id: dp300-4b-ts-mi-history
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Azure SQL managed instance named **MI1** runs 40 SQL Server Agent jobs. Several jobs run every five minutes.

    Auditors require 90 days of execution outcomes for every job. You notice that the job history of MI1 only covers the last few hours for the frequent jobs, and older entries are missing.

    You need to meet the audit requirement. What should you do?
  fr: |
    Une instance managée Azure SQL nommée **MI1** exécute 40 travaux SQL Server Agent. Plusieurs travaux s'exécutent toutes les cinq minutes.

    Les auditeurs exigent 90 jours de résultats d'exécution pour chaque travail. Vous constatez que l'historique des travaux de MI1 ne couvre que les dernières heures pour les travaux fréquents, et que les entrées plus anciennes ont disparu.

    Vous devez satisfaire l'exigence d'audit. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run sp_set_agent_properties to increase the maximum job history size.", fr: "Exécuter sp_set_agent_properties pour augmenter la taille maximale de l'historique des travaux." } }
    - { id: b, text: { en: "Increase the history limits on the History page of the SQL Server Agent properties in SSMS.", fr: "Augmenter les limites d'historique dans la page History des propriétés de SQL Server Agent dans SSMS." } }
    - { id: c, text: { en: "Move the jobs to an elastic job agent that keeps 45 days of history.", fr: "Déplacer les travaux vers un agent de travail élastique qui conserve 45 jours d'historique." } }
    - { id: d, text: { en: "Create a job that regularly copies new rows of msdb.dbo.sysjobhistory to a user table.", fr: "Créer un travail qui copie régulièrement les nouvelles lignes de msdb.dbo.sysjobhistory dans une table utilisateur." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On SQL Managed Instance, SQL Server Agent settings are read-only and the job history retention is fixed at 1,000 records in total and 100 per job, so frequent jobs quickly push out older rows. To keep 90 days, copy the history rows to your own table on a schedule.
    fr: |
      Sur SQL Managed Instance, les paramètres de SQL Server Agent sont en lecture seule et la conservation de l'historique des travaux est fixée à 1 000 enregistrements au total et 100 par travail : les travaux fréquents évincent rapidement les lignes anciennes. Pour conserver 90 jours, copiez les lignes d'historique dans votre propre table selon une planification.
  options:
    a: { en: "sp_set_agent_properties isn't supported on SQL Managed Instance.", fr: "sp_set_agent_properties n'est pas pris en charge sur SQL Managed Instance." }
    b: { en: "SQL Server Agent properties can't be changed on SQL Managed Instance.", fr: "Les propriétés de SQL Server Agent ne peuvent pas être modifiées sur SQL Managed Instance." }
    c: { en: "Elastic jobs target Azure SQL Database, and 45 days wouldn't meet the 90-day requirement anyway.", fr: "Les travaux élastiques ciblent Azure SQL Database, et 45 jours ne satisferaient de toute façon pas l'exigence de 90 jours." }
references:
  - title: Automate management tasks using SQL Agent jobs in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/job-automation-managed-instance
