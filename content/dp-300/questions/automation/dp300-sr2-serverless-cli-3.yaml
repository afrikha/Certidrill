id: dp300-sr2-serverless-cli-3
objective: "4.2.3"
type: series_yesno
series: dp300-sr2-serverless-cli
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You create the database with the GP_S_Gen5_4 service objective.
  fr: |
    Vous créez la base de données avec l'objectif de service GP_S_Gen5_4.
body:
  solution:
    en: |
      You run `az sql db create -g RG1 -s sql-tail1 -n InventoryDb --service-objective GP_S_Gen5_4 --auto-pause-delay 120`.
    fr: |
      Vous exécutez `az sql db create -g RG1 -s sql-tail1 -n InventoryDb --service-objective GP_S_Gen5_4 --auto-pause-delay 120`.
answer: { value: true }
explanation:
  correct:
    en: |
      The service objective name encodes the whole SKU: `GP` for General Purpose, `S` for serverless, `Gen5` for the hardware and `4` for the maximum vCores. It replaces the `-e`, `-f`, `-c` and `--compute-model` parameters, and `--auto-pause-delay 120` sets the pause after 120 minutes of inactivity.
    fr: |
      Le nom de l'objectif de service encode toute la référence SKU : `GP` pour General Purpose, `S` pour serverless, `Gen5` pour le matériel et `4` pour le nombre maximal de vCores. Il remplace les paramètres `-e`, `-f`, `-c` et `--compute-model`, et `--auto-pause-delay 120` définit la pause après 120 minutes d'inactivité.
references:
  - title: "az sql db"
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
  - title: "Serverless compute tier for Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
