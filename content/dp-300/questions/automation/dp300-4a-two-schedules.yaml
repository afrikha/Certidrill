id: dp300-4a-two-schedules
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. A SQL Server Agent job named **ArchiveOrders** runs a stored procedure that archives old orders.

    ArchiveOrders must run at 01:00 from Monday to Friday and at 06:00 on Saturday and Sunday. The solution must minimize the number of jobs and job steps that you maintain.

    What should you do?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Un travail SQL Server Agent nommé **ArchiveOrders** exécute une procédure stockée qui archive les anciennes commandes.

    ArchiveOrders doit s'exécuter à 01:00 du lundi au vendredi et à 06:00 le samedi et le dimanche. La solution doit réduire au minimum le nombre de travaux et d'étapes de travail à maintenir.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a copy of ArchiveOrders and give each job its own weekly schedule.", fr: "Créer une copie de ArchiveOrders et attribuer à chaque travail sa propre planification hebdomadaire." } }
    - { id: b, text: { en: "Create two weekly schedules and attach both of them to ArchiveOrders.", fr: "Créer deux planifications hebdomadaires et les attacher toutes les deux à ArchiveOrders." } }
    - { id: c, text: { en: "Create one daily schedule that starts at 01:00 and repeats every 5 hours.", fr: "Créer une planification quotidienne qui démarre à 01:00 et se répète toutes les 5 heures." } }
    - { id: d, text: { en: "Create one schedule that starts when SQL Server Agent starts, and add a step that waits until the right time.", fr: "Créer une planification qui démarre au démarrage de SQL Server Agent, et ajouter une étape qui attend l'heure voulue." } }
answer: { optionId: b }
explanation:
  correct:
    en: A schedule is an object separate from the job, and a job can have several schedules. A weekly schedule at 01:00 for Monday to Friday (`@freq_interval = 62`) and a weekly schedule at 06:00 for Saturday and Sunday (`@freq_interval = 65`), both attached to the same job, meet the requirement with a single job.
    fr: Une planification est un objet distinct du travail, et un travail peut avoir plusieurs planifications. Une planification hebdomadaire à 01:00 du lundi au vendredi (`@freq_interval = 62`) et une planification hebdomadaire à 06:00 le samedi et le dimanche (`@freq_interval = 65`), attachées toutes les deux au même travail, répondent à l'exigence avec un seul travail.
  options:
    a: { en: "Two copies of the job double the steps to maintain.", fr: "Deux copies du travail doublent les étapes à maintenir." }
    c: { en: "A daily schedule repeating every 5 hours runs at 01:00, 06:00, 11:00 and later every day, not on the required days only.", fr: "Une planification quotidienne répétée toutes les 5 heures s'exécute à 01:00, 06:00, 11:00 et plus tard chaque jour, pas seulement les jours voulus." }
    d: { en: "On MI1, SQL Server Agent is always running, so this schedule would almost never start, and a waiting step adds logic to maintain.", fr: "Sur MI1, SQL Server Agent est toujours en cours d'exécution : cette planification ne démarrerait presque jamais, et une étape d'attente ajoute de la logique à maintenir." }
references:
