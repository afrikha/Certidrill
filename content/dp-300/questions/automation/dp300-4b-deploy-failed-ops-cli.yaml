id: dp300-4b-deploy-failed-ops-cli
objective: "4.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A deployment named **sqldeploy** to a resource group named **rg-sales** failed. The deployment created 12 resources.

    You need an Azure CLI command that returns only the error messages of the operations that failed.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un déploiement nommé **sqldeploy** dans un groupe de ressources nommé **rg-sales** a échoué. Le déploiement a créé 12 ressources.

    Vous avez besoin d'une commande Azure CLI qui renvoie uniquement les messages d'erreur des opérations en échec.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az deployment [[cmd]] list \
      --resource-group rg-sales \
      --name sqldeploy \
      --query "[?properties.provisioningState=='[[state]]'].properties.[[prop]]"
  slots:
    - id: cmd
      options:
        - { id: opgroup, text: operation group }
        - { id: group, text: group }
        - { id: sub, text: sub }
    - id: state
      options:
        - { id: failed, text: Failed }
        - { id: canceled, text: Canceled }
        - { id: running, text: Running }
    - id: prop
      options:
        - { id: msg, text: statusMessage }
        - { id: target, text: targetResource }
        - { id: ts, text: timestamp }
answer:
  values: { cmd: opgroup, state: failed, prop: msg }
explanation:
  correct:
    en: "`az deployment operation group list` returns the operations of one deployment of a resource group. The JMESPath filter keeps the operations whose `provisioningState` is `Failed`, and `statusMessage` holds the error code and message returned by the resource provider."
    fr: "`az deployment operation group list` renvoie les opérations d'un déploiement d'un groupe de ressources. Le filtre JMESPath conserve les opérations dont `provisioningState` vaut `Failed`, et `statusMessage` contient le code et le message d'erreur renvoyés par le fournisseur de ressources."
  options:
    group: { en: "az deployment group list lists the deployments of the resource group, not the operations of one deployment.", fr: "az deployment group list liste les déploiements du groupe de ressources, pas les opérations d'un déploiement." }
    sub: { en: "az deployment sub targets subscription-scope deployments, and it doesn't list operations.", fr: "az deployment sub cible les déploiements au niveau de l'abonnement et ne liste pas les opérations." }
    canceled: { en: "Canceled operations were stopped; they aren't the operations that failed.", fr: "Les opérations Canceled ont été arrêtées ; ce ne sont pas les opérations en échec." }
    running: { en: "Running operations are still in progress, and a failed deployment has none.", fr: "Les opérations Running sont encore en cours, et un déploiement en échec n'en a pas." }
    target: { en: "targetResource identifies the resource of the operation, not the error message.", fr: "targetResource identifie la ressource de l'opération, pas le message d'erreur." }
    ts: { en: "timestamp only gives the time of the operation.", fr: "timestamp ne donne que l'heure de l'opération." }
references:
  - title: View deployment history with Azure Resource Manager
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-history
