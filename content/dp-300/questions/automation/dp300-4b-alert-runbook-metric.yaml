id: dp300-4b-alert-runbook-metric
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Azure Automation account named **aa-ops** runs 20 runbooks that export, scale and clean up Azure SQL databases. aa-ops has no diagnostic setting, and the company doesn't use Log Analytics.

    You need the on-call engineer to be notified within minutes when a job of any runbook in aa-ops fails. You must not create a Log Analytics workspace.

    What should you create?
  fr: |
    Un compte Automation nommé **aa-ops** exécute 20 runbooks qui exportent, mettent à l'échelle et nettoient des bases de données Azure SQL. aa-ops n'a aucun paramètre de diagnostic, et l'entreprise n'utilise pas Log Analytics.

    L'ingénieur d'astreinte doit être averti en quelques minutes lorsqu'un travail d'un runbook d'aa-ops échoue. Vous ne devez pas créer d'espace de travail Log Analytics.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A log search alert rule that queries the JobLogs category in AzureDiagnostics", fr: "Une règle d'alerte de recherche dans les journaux qui interroge la catégorie JobLogs dans AzureDiagnostics" } }
    - { id: b, text: { en: "A Service Health alert rule for Azure Automation", fr: "Une règle d'alerte Service Health pour Azure Automation" } }
    - { id: c, text: { en: "A metric alert rule on aa-ops for the Total Jobs metric, with the Status dimension set to Failed", fr: "Une règle d'alerte de métrique sur aa-ops pour la métrique Total Jobs, avec la dimension Status définie sur Failed" } }
    - { id: d, text: { en: "A Resource Health alert rule on aa-ops", fr: "Une règle d'alerte Resource Health sur aa-ops" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Automation accounts publish the Total Jobs platform metric with the Runbook Name and Status dimensions, without any diagnostic setting. A metric alert rule filtered on Status = Failed, with the runbook name left blank to cover every runbook, is evaluated every few minutes and triggers an action group.
    fr: |
      Les comptes Automation publient la métrique de plateforme Total Jobs avec les dimensions Runbook Name et Status, sans paramètre de diagnostic. Une règle d'alerte de métrique filtrée sur Status = Failed, avec le nom de runbook laissé vide pour couvrir tous les runbooks, est évaluée toutes les quelques minutes et déclenche un groupe d'actions.
  options:
    a: { en: "A log search alert needs the job logs in a Log Analytics workspace, which requires a diagnostic setting and a workspace.", fr: "Une alerte de recherche dans les journaux nécessite les journaux de travaux dans un espace de travail Log Analytics, donc un paramètre de diagnostic et un espace de travail." }
    b: { en: "Service Health reports Azure incidents, not failed runbook jobs.", fr: "Service Health signale les incidents Azure, pas les travaux de runbook en échec." }
    d: { en: "Resource Health reports the availability of the Automation account, not the result of its jobs.", fr: "Resource Health signale la disponibilité du compte Automation, pas le résultat de ses travaux." }
references:
  - title: Monitor runbooks with metric alerts
    url: https://learn.microsoft.com/en-us/azure/automation/automation-alert-metric
