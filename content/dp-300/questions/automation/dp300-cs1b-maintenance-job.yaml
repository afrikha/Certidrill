id: dp300-cs1b-maintenance-job
objective: "4.3.1"
type: ordering
caseStudy: dp300-cs1b-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You need to implement the index and statistics maintenance to meet the maintenance requirements.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez mettre en œuvre la maintenance des index et des statistiques pour satisfaire les exigences de maintenance.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: jobdb, text: { en: "Create an empty database at the S1 service objective on sql-mt-prod.", fr: "Créer une base de données vide à l'objectif de service S1 sur sql-mt-prod." } }
    - { id: agent, text: { en: "Create an elastic job agent that uses the new database, and assign umi-jobs to the agent.", fr: "Créer un agent de travail élastique qui utilise la nouvelle base de données, et lui attribuer umi-jobs." } }
    - { id: tgpool, text: { en: "Create a target group whose members are pool-1, pool-2 and pool-3.", fr: "Créer un groupe cible dont les membres sont pool-1, pool-2 et pool-3." } }
    - { id: job, text: { en: "Create a job with a weekly schedule, and add a job step that runs the maintenance script against the target group.", fr: "Créer un travail avec une planification hebdomadaire, et lui ajouter une étape de travail qui exécute le script de maintenance sur le groupe cible." } }
    - { id: tgdb, text: { en: "Create a target group whose members are the 420 tenant databases.", fr: "Créer un groupe cible dont les membres sont les 420 bases de données de locataire." } }
    - { id: cred, text: { en: "Create a database scoped credential in each tenant database.", fr: "Créer des informations d'identification délimitées à la base de données dans chaque base de données de locataire." } }
    - { id: agentjob, text: { en: "Create a SQL Server Agent job in the Catalog database.", fr: "Créer un travail SQL Server Agent dans la base de données Catalog." } }
answer:
  sequence: [ jobdb, agent, tgpool, job ]
explanation:
  correct:
    en: |
      Elastic jobs run T-SQL on many Azure SQL databases without a virtual machine. The elastic job agent needs an empty job database (S1 or higher is recommended), so you create the database before the agent; you assign the user-assigned managed identity umi-jobs to the agent for authentication. Target groups and jobs are stored in the job database, and each job step references a target group. A target group whose members are elastic pools is enumerated at each run, so databases added to the pools later are included automatically.
    fr: |
      Les travaux élastiques exécutent du T-SQL sur de nombreuses bases de données Azure SQL sans machine virtuelle. L'agent de travail élastique a besoin d'une base de données de travaux vide (S1 ou supérieur est recommandé) : vous créez donc la base avant l'agent, et vous attribuez à l'agent l'identité managée affectée par l'utilisateur umi-jobs pour l'authentification. Les groupes cibles et les travaux sont stockés dans la base de données de travaux, et chaque étape de travail référence un groupe cible. Un groupe cible dont les membres sont des pools élastiques est énuméré à chaque exécution : les bases de données ajoutées plus tard aux pools sont incluses automatiquement.
  options:
    tgdb: { en: "A list of individual databases does not include the databases created later, so the job definition would have to be edited every week.", fr: "Une liste de bases de données individuelles n'inclut pas les bases créées plus tard : la définition du travail devrait être modifiée chaque semaine." }
    cred: { en: "The agent authenticates with umi-jobs, whose users already exist; database scoped credentials are the older method and are created in the job database, not in the targets.", fr: "L'agent s'authentifie avec umi-jobs, dont les utilisateurs existent déjà ; les informations d'identification délimitées à la base de données sont l'ancienne méthode et se créent dans la base de données de travaux, pas dans les cibles." }
    agentjob: { en: "SQL Server Agent is not available in Azure SQL Database; elastic jobs replace it.", fr: "SQL Server Agent n'est pas disponible dans Azure SQL Database ; les travaux élastiques le remplacent." }
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
  - title: Create, configure, and manage elastic jobs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-tutorial
