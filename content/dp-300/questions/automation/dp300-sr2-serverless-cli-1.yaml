id: dp300-sr2-serverless-cli-1
objective: "4.2.3"
type: series_yesno
series: dp300-sr2-serverless-cli
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You create the database with the Serverless compute model.
  fr: |
    Vous créez la base de données avec le modèle de calcul Serverless.
body:
  solution:
    en: |
      You run `az sql db create -g RG1 -s sql-tail1 -n InventoryDb -e GeneralPurpose -f Gen5 -c 4 --compute-model Serverless --auto-pause-delay 120`.
    fr: |
      Vous exécutez `az sql db create -g RG1 -s sql-tail1 -n InventoryDb -e GeneralPurpose -f Gen5 -c 4 --compute-model Serverless --auto-pause-delay 120`.
answer: { value: true }
explanation:
  correct:
    en: |
      `--compute-model Serverless` creates a serverless General Purpose database, billed per second for the vCores used, and `-c 4` sets its maximum vCores. `--auto-pause-delay 120` pauses the database after 120 minutes of inactivity, a value inside the 15 to 10,080-minute range of General Purpose.
    fr: |
      `--compute-model Serverless` crée une base General Purpose serverless, facturée à la seconde pour les vCores utilisés, et `-c 4` fixe son nombre maximal de vCores. `--auto-pause-delay 120` met la base en pause après 120 minutes d'inactivité, une valeur comprise dans la plage de 15 à 10 080 minutes de General Purpose.
references:
  - title: "az sql db"
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
  - title: "Serverless compute tier for Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
