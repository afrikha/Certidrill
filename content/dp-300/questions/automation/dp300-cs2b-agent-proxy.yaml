id: dp300-cs2b-agent-proxy
objective: "4.1.3"
type: single
caseStudy: dp300-cs2b-fabrikam-plants
difficulty: 1
status: draft
stem:
  en: |
    You need to fix ExportQualityFiles to meet the job requirements.

    What should you do?
  fr: |
    Vous devez corriger ExportQualityFiles pour satisfaire les exigences relatives aux travaux.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant the SQL Server Agent service account write permission on the share, and add FABRIKAM\\qa-lead to the SQLAgentOperatorRole role in msdb.", fr: "Accorder au compte de service SQL Server Agent l'autorisation d'écriture sur le partage, et ajouter FABRIKAM\\qa-lead au rôle SQLAgentOperatorRole dans msdb." } }
    - { id: b, text: { en: "Create a credential for FABRIKAM\\svc-qexport and a proxy for the PowerShell subsystem that uses it, grant the proxy to FABRIKAM\\qa-lead, and select it in Run as.", fr: "Créer des informations d'identification pour FABRIKAM\\svc-qexport et un proxy pour le sous-système PowerShell qui les utilise, accorder le proxy à FABRIKAM\\qa-lead et le sélectionner dans Run as." } }
    - { id: c, text: { en: "Create a login for FABRIKAM\\svc-qexport, and enter it in the Run as user setting on the Advanced page of the job step.", fr: "Créer une connexion pour FABRIKAM\\svc-qexport, et la saisir dans le paramètre Run as user de la page Advanced de l'étape de travail." } }
    - { id: d, text: { en: "Change the owner of the job to FABRIKAM\\svc-qexport, and grant FABRIKAM\\qa-lead the SQLAgentOperatorRole role in msdb.", fr: "Remplacer le propriétaire du travail par FABRIKAM\\svc-qexport, et accorder à FABRIKAM\\qa-lead le rôle SQLAgentOperatorRole dans msdb." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the owner of a job is not a member of sysadmin, a PowerShell or CmdExec step runs only through a proxy. A proxy maps to a credential, which stores the Windows account and its secret; the proxy is granted to a subsystem and to the logins allowed to use it, and the step selects it in Run as. The step then runs as FABRIKAM\svc-qexport while FABRIKAM\qa-lead stays the owner without sysadmin rights.
    fr: |
      Quand le propriétaire d'un travail n'est pas membre de sysadmin, une étape PowerShell ou CmdExec ne s'exécute que par un proxy. Un proxy correspond à des informations d'identification qui stockent le compte Windows et son secret ; le proxy est accordé à un sous-système et aux connexions autorisées à l'utiliser, et l'étape le sélectionne dans Run as. L'étape s'exécute alors sous FABRIKAM\svc-qexport, et FABRIKAM\qa-lead reste propriétaire sans droits sysadmin.
  options:
    a: { en: "The step still fails because a non-sysadmin owner needs a proxy for PowerShell steps, and it would not run under FABRIKAM\\svc-qexport.", fr: "L'étape échoue toujours, car un propriétaire non sysadmin a besoin d'un proxy pour les étapes PowerShell, et elle ne s'exécuterait pas sous FABRIKAM\\svc-qexport." }
    c: { en: "Run as user applies to Transact-SQL steps and impersonates a database user; it does not change the Windows account of a PowerShell step.", fr: "Run as user s'applique aux étapes Transact-SQL et emprunte l'identité d'un utilisateur de base de données ; il ne change pas le compte Windows d'une étape PowerShell." }
    d: { en: "FABRIKAM\\qa-lead must remain the owner of the job.", fr: "FABRIKAM\\qa-lead doit rester propriétaire du travail." }
references:
  - title: Create a SQL Server Agent proxy
    url: https://learn.microsoft.com/en-us/ssms/agent/create-a-sql-server-agent-proxy
