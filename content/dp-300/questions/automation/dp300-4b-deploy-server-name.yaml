id: dp300-4b-deploy-server-name
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You deploy a Bicep file named **main.bicep** to two resource groups named **rg-dev** and **rg-test** in the same subscription. The file contains the following parameter, which names a `Microsoft.Sql/servers` resource:

    ```bicep
    param serverName string = 'sql-contoso-app'
    ```

    The deployment to rg-dev succeeds. The deployment to rg-test, which uses the default parameter values, fails because the server name is already in use.

    You need the file to deploy to any resource group without supplying parameter values. Each resource group must keep the same server name when the file is redeployed.

    What should you do?
  fr: |
    Vous déployez un fichier Bicep nommé **main.bicep** dans deux groupes de ressources nommés **rg-dev** et **rg-test** du même abonnement. Le fichier contient le paramètre suivant, qui nomme une ressource `Microsoft.Sql/servers` :

    ```bicep
    param serverName string = 'sql-contoso-app'
    ```

    Le déploiement dans rg-dev réussit. Le déploiement dans rg-test, qui utilise les valeurs de paramètre par défaut, échoue car le nom du serveur est déjà utilisé.

    Le fichier doit pouvoir être déployé dans n'importe quel groupe de ressources sans fournir de valeurs de paramètre. Chaque groupe de ressources doit conserver le même nom de serveur lorsque le fichier est redéployé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the default value of serverName to 'sql-${uniqueString(resourceGroup().id)}'.", fr: "Remplacer la valeur par défaut de serverName par 'sql-${uniqueString(resourceGroup().id)}'." } }
    - { id: b, text: { en: "Change the default value of serverName to 'sql-${resourceGroup().location}'.", fr: "Remplacer la valeur par défaut de serverName par 'sql-${resourceGroup().location}'." } }
    - { id: c, text: { en: "Deploy the file to rg-test by using the Complete deployment mode.", fr: "Déployer le fichier dans rg-test avec le mode de déploiement Complete." } }
    - { id: d, text: { en: "Add a dependsOn property to the server resource that references the databases.", fr: "Ajouter à la ressource du serveur une propriété dependsOn qui référence les bases de données." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A logical server name becomes part of a DNS name (`<name>.database.windows.net`), so it must be unique across Azure. `uniqueString(resourceGroup().id)` returns a deterministic 13-character hash of the resource group ID: each resource group gets a different name, and redeploying to the same group produces the same name, so the server is updated rather than duplicated."
    fr: "Le nom d'un serveur logique fait partie d'un nom DNS (`<nom>.database.windows.net`) : il doit donc être unique dans Azure. `uniqueString(resourceGroup().id)` renvoie un hachage déterministe de 13 caractères de l'ID du groupe de ressources : chaque groupe de ressources obtient un nom différent, et un redéploiement dans le même groupe produit le même nom, si bien que le serveur est mis à jour au lieu d'être dupliqué."
  options:
    b: { en: "Both resource groups can be in the same region, so the names would still collide.", fr: "Les deux groupes de ressources peuvent être dans la même région : les noms entreraient encore en conflit." }
    c: { en: "The deployment mode only decides what happens to resources missing from the file; it doesn't make the server name unique.", fr: "Le mode de déploiement ne décide que du sort des ressources absentes du fichier ; il ne rend pas le nom du serveur unique." }
    d: { en: "The server is the parent of the databases; a dependency in that direction is wrong and doesn't affect the name conflict.", fr: "Le serveur est le parent des bases de données : une dépendance dans ce sens est erronée et ne change rien au conflit de nom." }
references:
  - title: Bicep functions - string
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/bicep-functions-string
