id: dp300-4a-ps-scale-db
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database named **SalesDB** on a logical server named **sql-sales-01**. SalesDB uses the General Purpose service tier with 2 vCores.

    You need to change SalesDB to 8 vCores by using Azure PowerShell. The data of SalesDB must be kept.

    Which cmdlet should you run?
  fr: |
    Vous disposez d'une base Azure SQL Database nommée **SalesDB** sur un serveur logique nommé **sql-sales-01**. SalesDB utilise le niveau de service General Purpose avec 2 vCores.

    Vous devez faire passer SalesDB à 8 vCores à l'aide d'Azure PowerShell. Les données de SalesDB doivent être conservées.

    Quelle applet de commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: Set-AzSqlServer }
    - { id: b, text: New-AzSqlDatabaseCopy }
    - { id: c, text: Set-AzSqlElasticPool }
    - { id: d, text: Set-AzSqlDatabase }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `Set-AzSqlDatabase` changes the properties of an existing database, including its service objective (`-RequestedServiceObjectiveName GP_Gen5_8`, or `-Edition`, `-VCore` and `-ComputeGeneration`). It can also move a database into an elastic pool with `-ElasticPoolName`.
    fr: |
      `Set-AzSqlDatabase` modifie les propriétés d'une base de données existante, y compris son objectif de service (`-RequestedServiceObjectiveName GP_Gen5_8`, ou `-Edition`, `-VCore` et `-ComputeGeneration`). Elle peut aussi déplacer une base de données dans un pool élastique avec `-ElasticPoolName`.
  options:
    a: { en: "Set-AzSqlServer changes the logical server, not the compute of a database.", fr: "Set-AzSqlServer modifie le serveur logique, pas le calcul d'une base de données." }
    b: { en: "A copy creates a second database instead of scaling SalesDB.", fr: "Une copie crée une seconde base de données au lieu de mettre SalesDB à l'échelle." }
    c: { en: "SalesDB is a single database, not a member of an elastic pool.", fr: "SalesDB est une base de données unique, pas un membre d'un pool élastique." }
references:
  - title: Set-AzSqlDatabase
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/set-azsqldatabase
