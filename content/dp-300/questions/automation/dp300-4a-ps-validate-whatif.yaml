id: dp300-4a-ps-validate-whatif
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You deploy Azure SQL resources to a resource group named **rg-sales** with Azure PowerShell and an ARM template named **sql.json**. Before each production deployment, you want to check the template without changing any resource.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez des ressources Azure SQL dans un groupe de ressources nommé **rg-sales** avec Azure PowerShell et un modèle ARM nommé **sql.json**. Avant chaque déploiement en production, vous voulez vérifier le modèle sans modifier aucune ressource.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Test-AzResourceGroupDeployment checks whether sql.json and its parameter values are valid for rg-sales.
        fr: Test-AzResourceGroupDeployment vérifie si sql.json et ses valeurs de paramètres sont valides pour rg-sales.
    - id: s2
      text:
        en: Test-AzResourceGroupDeployment lists the properties of the existing databases that the deployment would modify.
        fr: Test-AzResourceGroupDeployment liste les propriétés des bases de données existantes que le déploiement modifierait.
    - id: s3
      text:
        en: New-AzResourceGroupDeployment with the -WhatIf parameter shows the resources that the deployment would create, modify or delete.
        fr: New-AzResourceGroupDeployment avec le paramètre -WhatIf montre les ressources que le déploiement créerait, modifierait ou supprimerait.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      `Test-AzResourceGroupDeployment` validates a template and its parameter values; it reports errors but not the changes. The what-if operation (`New-AzResourceGroupDeployment -WhatIf`, or `-Confirm` to preview and then confirm) predicts the changes, such as Create, Modify, Delete or NoChange, without modifying resources.
    fr: |
      `Test-AzResourceGroupDeployment` valide un modèle et ses valeurs de paramètres ; elle signale les erreurs, mais pas les modifications. L'opération what-if (`New-AzResourceGroupDeployment -WhatIf`, ou `-Confirm` pour afficher un aperçu puis confirmer) prévoit les modifications, comme Create, Modify, Delete ou NoChange, sans modifier les ressources.
references:
  - title: Test-AzResourceGroupDeployment
    url: https://learn.microsoft.com/en-us/powershell/module/az.resources/test-azresourcegroupdeployment
  - title: ARM template deployment what-if operation
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-what-if
