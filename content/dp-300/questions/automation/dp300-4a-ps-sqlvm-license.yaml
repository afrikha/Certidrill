id: dp300-4a-ps-sqlvm-license
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **SQLVM4** that runs SQL Server 2022 Enterprise, installed from your own media. SQLVM4 is not registered with the SQL IaaS Agent extension. Contoso owns SQL Server Enterprise core licenses with active Software Assurance for this server.

    You need to register SQLVM4 by running the following command and apply Azure Hybrid Benefit:

    `New-AzSqlVM -ResourceGroupName rg-sql -Name SQLVM4 -Location westeurope -LicenseType <value>`

    Which value should you use?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **SQLVM4** qui exécute SQL Server 2022 Enterprise, installé à partir de votre propre support. SQLVM4 n'est pas inscrite auprès de l'extension SQL IaaS Agent. Contoso possède des licences de cœurs SQL Server Enterprise avec Software Assurance active pour ce serveur.

    Vous devez inscrire SQLVM4 en exécutant la commande suivante et appliquer Azure Hybrid Benefit :

    `New-AzSqlVM -ResourceGroupName rg-sql -Name SQLVM4 -Location westeurope -LicenseType <value>`

    Quelle valeur devez-vous utiliser ?
body:
  options:
    - { id: a, text: PAYG }
    - { id: b, text: AHUB }
    - { id: c, text: DR }
    - { id: d, text: BasePrice }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For SQL Server on Azure VMs, the license type `AHUB` applies Azure Hybrid Benefit: you allocate your SQL Server licenses with Software Assurance to the VM. The VM must be registered with the SQL IaaS Agent extension, which `New-AzSqlVM` does.
    fr: |
      Pour SQL Server sur machines virtuelles Azure, le type de licence `AHUB` applique Azure Hybrid Benefit : vous affectez vos licences SQL Server avec Software Assurance à la machine virtuelle. La machine virtuelle doit être inscrite auprès de l'extension SQL IaaS Agent, ce que fait `New-AzSqlVM`.
  options:
    a: { en: "PAYG includes the SQL Server license in the per-second VM price.", fr: "PAYG inclut la licence SQL Server dans le prix à la seconde de la machine virtuelle." }
    c: { en: "DR is for a free passive HA/DR replica, not for a server that runs the workload.", fr: "DR concerne un réplica HA/DR passif gratuit, pas un serveur qui exécute la charge de travail." }
    d: { en: "BasePrice is the Azure Hybrid Benefit value for Azure SQL Database and Managed Instance, not for SQL Server VMs.", fr: "BasePrice est la valeur Azure Hybrid Benefit d'Azure SQL Database et de Managed Instance, pas des machines virtuelles SQL Server." }
references:
  - title: Change the license model for a SQL virtual machine in Azure
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/licensing-model-azure-hybrid-benefit-ahb-change
  - title: New-AzSqlVM
    url: https://learn.microsoft.com/en-us/powershell/module/az.sqlvirtualmachine/new-azsqlvm
