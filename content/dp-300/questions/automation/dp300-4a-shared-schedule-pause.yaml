id: dp300-4a-shared-schedule-pause
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has SQL Server 2022 on an Azure virtual machine named **SQLVM1**. Five SQL Server Agent jobs run index and statistics maintenance, and all five use a shared schedule named **NightlyMaint**. The backup jobs on SQLVM1 use other schedules.

    During a two-week change freeze, the five maintenance jobs must not run on their schedule. The backup jobs must keep running, and a DBA must still be able to start any maintenance job manually. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Contoso dispose de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM1**. Cinq travaux SQL Server Agent effectuent la maintenance des index et des statistiques, et tous les cinq utilisent une planification partagée nommée **NightlyMaint**. Les travaux de sauvegarde de SQLVM1 utilisent d'autres planifications.

    Pendant un gel des modifications de deux semaines, les cinq travaux de maintenance ne doivent pas s'exécuter selon leur planification. Les travaux de sauvegarde doivent continuer à s'exécuter, et un administrateur de base de données doit toujours pouvoir démarrer manuellement n'importe quel travail de maintenance. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable each of the five maintenance jobs.", fr: "Désactiver chacun des cinq travaux de maintenance." } }
    - { id: b, text: { en: "Stop the SQL Server Agent service on SQLVM1.", fr: "Arrêter le service SQL Server Agent sur SQLVM1." } }
    - { id: c, text: { en: "Disable the NightlyMaint schedule.", fr: "Désactiver la planification NightlyMaint." } }
    - { id: d, text: { en: "Delete the NightlyMaint schedule and re-create it after the freeze.", fr: "Supprimer la planification NightlyMaint et la recréer après le gel." } }
answer: { optionId: c }
explanation:
  correct:
    en: A disabled schedule is disabled for every job that uses it, so one change stops the five maintenance jobs while the backup jobs keep their own schedules. A job whose schedule is disabled can still be run manually or in response to an alert. You re-enable the schedule explicitly after the freeze.
    fr: Une planification désactivée l'est pour tous les travaux qui l'utilisent ; une seule modification arrête donc les cinq travaux de maintenance, tandis que les travaux de sauvegarde conservent leurs propres planifications. Un travail dont la planification est désactivée peut toujours être exécuté manuellement ou en réponse à une alerte. Vous réactivez explicitement la planification après le gel.
  options:
    a: { en: "This also works, but it takes five changes instead of one, which does not minimize administrative effort.", fr: "Cela fonctionne aussi, mais demande cinq modifications au lieu d'une, ce qui ne réduit pas l'effort d'administration." }
    b: { en: "Stopping SQL Server Agent also stops the backup jobs and prevents any manual run of the jobs.", fr: "Arrêter SQL Server Agent arrête aussi les travaux de sauvegarde et empêche toute exécution manuelle des travaux." }
    d: { en: "Deleting the schedule detaches it from the five jobs; you would then have to re-create it and attach it to each job again.", fr: "Supprimer la planification la détache des cinq travaux ; il faudrait ensuite la recréer et l'attacher à nouveau à chaque travail." }
references:
  - title: Create and Attach Schedules to Jobs
    url: https://learn.microsoft.com/en-us/ssms/agent/create-and-attach-schedules-to-jobs
