id: dp300-4a-failed-steps-query
objective: "4.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. Several SQL Server Agent jobs failed during November 2026.

    You need a query that returns the job name, the step, the start date and time, and the error message of every failed execution since November 1, 2026.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Plusieurs travaux SQL Server Agent ont échoué en novembre 2026.

    Vous avez besoin d'une requête qui renvoie le nom du travail, l'étape, la date et l'heure de début, et le message d'erreur de chaque exécution en échec depuis le 1er novembre 2026.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT j.name, h.step_id, h.step_name, h.run_date, h.run_time, h.message
    FROM [[tbl]] AS h
    JOIN msdb.dbo.sysjobs AS j ON h.job_id = j.job_id
    WHERE h.run_status = [[status]]
      AND h.run_date >= [[date]]
    ORDER BY h.instance_id DESC;
  slots:
    - id: tbl
      options:
        - { id: hist, text: msdb.dbo.sysjobhistory }
        - { id: act, text: msdb.dbo.sysjobactivity }
        - { id: steps, text: msdb.dbo.sysjobsteps }
        - { id: sched, text: msdb.dbo.sysjobschedules }
    - id: status
      options:
        - { id: s0, text: "0" }
        - { id: s1, text: "1" }
        - { id: s2, text: "2" }
        - { id: s3, text: "3" }
    - id: date
      options:
        - { id: iso, text: "20261101" }
        - { id: dmy, text: "01112026" }
        - { id: str, text: "'2026-11-01 00:00:00'" }
answer:
  values: { tbl: hist, status: s0, date: iso }
explanation:
  correct:
    en: |
      `msdb.dbo.sysjobhistory` stores one row per job and step execution with `run_status`, `message`, `run_date` and `run_time`. `run_status = 0` means failed (1 = succeeded, 2 = retry, 3 = canceled, 4 = in progress). `run_date` is an int in the yyyyMMdd format, so November 1, 2026 is 20261101.
    fr: |
      `msdb.dbo.sysjobhistory` stocke une ligne par exécution de travail et d'étape, avec `run_status`, `message`, `run_date` et `run_time`. `run_status = 0` signifie un échec (1 = réussite, 2 = nouvelle tentative, 3 = annulation, 4 = en cours). `run_date` est un int au format yyyyMMdd : le 1er novembre 2026 s'écrit 20261101.
  options:
    act: { en: "sysjobactivity shows current and recent activity of jobs, not the error message of each step.", fr: "sysjobactivity montre l'activité en cours et récente des travaux, pas le message d'erreur de chaque étape." }
    steps: { en: "sysjobsteps stores the definition of the steps, not their executions.", fr: "sysjobsteps stocke la définition des étapes, pas leurs exécutions." }
    sched: { en: "sysjobschedules links jobs to schedules.", fr: "sysjobschedules relie les travaux aux planifications." }
    s1: { en: "1 is succeeded.", fr: "1 correspond à une réussite." }
    s2: { en: "2 is retry.", fr: "2 correspond à une nouvelle tentative." }
    s3: { en: "3 is canceled.", fr: "3 correspond à une annulation." }
    dmy: { en: "run_date is in yyyyMMdd format, not ddMMyyyy.", fr: "run_date est au format yyyyMMdd, pas ddMMyyyy." }
    str: { en: "run_date is an int, not a datetime value.", fr: "run_date est un int, pas une valeur datetime." }
references:
  - title: dbo.sysjobhistory (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-tables/dbo-sysjobhistory-transact-sql
