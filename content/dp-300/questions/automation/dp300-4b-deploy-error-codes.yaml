id: dp300-4b-deploy-error-codes
objective: "4.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A deployment pipeline at Northwind Traders deploys Azure SQL resources from Bicep files. You review four failed deployments and identify their causes.

    Which error code does each deployment return? To answer, drag the appropriate error codes to the correct causes. Each error code may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un pipeline de déploiement de Northwind Traders déploie des ressources Azure SQL à partir de fichiers Bicep. Vous examinez quatre déploiements en échec et vous en identifiez les causes.

    Quel code d'erreur chaque déploiement renvoie-t-il ? Pour répondre, faites glisser les codes d'erreur appropriés vers les causes correspondantes. Chaque code d'erreur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: policy, text: RequestDisallowedByPolicy }
    - { id: parent, text: ParentResourceNotFound }
    - { id: authz, text: AuthorizationFailed }
    - { id: invalid, text: InvalidTemplate }
    - { id: depquota, text: DeploymentQuotaExceeded }
    - { id: sku, text: SkuNotAvailable }
  targets:
    - id: t1
      text: { en: "An Azure Policy assignment denies logical servers that allow public network access.", fr: "Une attribution Azure Policy refuse les serveurs logiques qui autorisent l'accès réseau public." }
    - id: t2
      text: { en: "The file creates a database before the logical server that hosts it exists.", fr: "Le fichier crée une base de données avant que le serveur logique qui l'héberge existe." }
    - id: t3
      text: { en: "The service principal of the pipeline only has the Reader role on the resource group.", fr: "Le principal de service du pipeline n'a que le rôle Reader sur le groupe de ressources." }
    - id: t4
      text: { en: "A resource property contains an expression with a syntax error.", fr: "Une propriété de ressource contient une expression comportant une erreur de syntaxe." }
answer:
  mapping: { t1: policy, t2: parent, t3: authz, t4: invalid }
explanation:
  correct:
    en: |
      A policy assignment that blocks part of a deployment returns RequestDisallowedByPolicy. A child resource (a database) created before its parent (the server) returns ParentResourceNotFound; declare the parent with `parent` or `dependsOn`. An identity without a sufficient role at the deployment scope gets AuthorizationFailed. Syntax errors in the template return InvalidTemplate.
    fr: |
      Une attribution de stratégie qui bloque une partie d'un déploiement renvoie RequestDisallowedByPolicy. Une ressource enfant (une base de données) créée avant son parent (le serveur) renvoie ParentResourceNotFound ; déclarez le parent avec `parent` ou `dependsOn`. Une identité sans rôle suffisant sur l'étendue du déploiement obtient AuthorizationFailed. Les erreurs de syntaxe du modèle renvoient InvalidTemplate.
  options:
    depquota: { en: "DeploymentQuotaExceeded means the resource group's deployment history reached its 800-deployment limit.", fr: "DeploymentQuotaExceeded signifie que l'historique de déploiement du groupe de ressources a atteint sa limite de 800 déploiements." }
    sku: { en: "SkuNotAvailable means the requested SKU isn't available in the selected location.", fr: "SkuNotAvailable signifie que la référence SKU demandée n'est pas disponible à l'emplacement choisi." }
references:
  - title: Troubleshoot common Azure deployment errors
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors
