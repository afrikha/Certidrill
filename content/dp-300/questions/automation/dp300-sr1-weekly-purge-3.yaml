id: dp300-sr1-weekly-purge-3
objective: "4.3.2"
type: series_yesno
series: dp300-sr1-weekly-purge
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You create an elastic job agent that uses a user-assigned managed identity.
  fr: |
    Vous créez un agent de travail élastique qui utilise une identité managée affectée par l'utilisateur.
body:
  solution:
    en: |
      You create a new, empty S1 database named **JobsDb** on sql-nw-sales and an elastic job agent that uses JobsDb and a **user-assigned managed identity** named **umi-nw-jobs**. In SalesOps, you create a user for umi-nw-jobs `FROM EXTERNAL PROVIDER` and grant it EXECUTE on dbo.usp_PurgeAudit. You create a target group that contains SalesOps and a job with a step running `EXEC dbo.usp_PurgeAudit;` and a weekly schedule on Sunday at 02:00 UTC.
    fr: |
      Vous créez une nouvelle base de données S1 vide nommée **JobsDb** sur sql-nw-sales et un agent de travail élastique qui utilise JobsDb et une **identité managée affectée par l'utilisateur** nommée **umi-nw-jobs**. Dans SalesOps, vous créez un utilisateur pour umi-nw-jobs `FROM EXTERNAL PROVIDER` et lui accordez EXECUTE sur dbo.usp_PurgeAudit. Vous créez un groupe cible qui contient SalesOps et un travail avec une étape exécutant `EXEC dbo.usp_PurgeAudit;` et une planification hebdomadaire le dimanche à 02:00 UTC.
answer: { value: true }
explanation:
  correct:
    en: |
      An elastic job agent is a managed Azure resource that runs T-SQL on a schedule against the databases of a target group, so no VM is needed. With a user-assigned managed identity, the agent connects to SalesOps through Microsoft Entra ID without stored credentials, and the target user only has EXECUTE on the procedure. Elastic job schedules are expressed in UTC, which matches the requirement.
    fr: |
      Un agent de travail élastique est une ressource Azure managée qui exécute du T-SQL selon une planification sur les bases d'un groupe cible : aucune machine virtuelle n'est nécessaire. Avec une identité managée affectée par l'utilisateur, l'agent se connecte à SalesOps via Microsoft Entra ID sans informations d'identification stockées, et l'utilisateur cible ne dispose que d'EXECUTE sur la procédure. Les planifications des travaux élastiques sont exprimées en UTC, ce qui correspond à l'exigence.
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
