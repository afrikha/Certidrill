id: dp300-4b-ej-pool-parallelism
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An elastic job agent named **agent1** uses the JA200 service tier. A job step of agent1 runs an index maintenance script against a target group that contains:

    - An elastic pool named **Pool1** that contains 150 databases
    - 40 single databases on other logical servers

    When the job runs, the eDTU utilization of Pool1 reaches 100% and the applications that use Pool1 slow down.

    You need to reduce the impact of the job on Pool1. The script must not start later on the 40 single databases.

    What should you do?
  fr: |
    Un agent de travail élastique nommé **agent1** utilise le niveau de service JA200. Une étape de travail d'agent1 exécute un script de maintenance des index sur un groupe cible qui contient :

    - un pool élastique nommé **Pool1** qui contient 150 bases de données ;
    - 40 bases de données uniques sur d'autres serveurs logiques.

    Pendant l'exécution du travail, l'utilisation des eDTU de Pool1 atteint 100 % et les applications qui utilisent Pool1 ralentissent.

    Vous devez réduire l'impact du travail sur Pool1. Le script ne doit pas démarrer plus tard sur les 40 bases de données uniques.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the service tier of agent1 to JA100.", fr: "Passer agent1 au niveau de service JA100." } }
    - { id: b, text: { en: "Scale up the job database of agent1.", fr: "Augmenter la taille de la base de données de travaux d'agent1." } }
    - { id: c, text: { en: "Set the @max_parallelism parameter of the job step.", fr: "Définir le paramètre @max_parallelism de l'étape de travail." } }
    - { id: d, text: { en: "Set the @retry_attempts parameter of the job step to 0.", fr: "Définir le paramètre @retry_attempts de l'étape de travail sur 0." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `@max_parallelism` sets the maximum number of databases of each elastic pool that the step runs against at the same time. It throttles the work inside Pool1 only, while the single databases still start as soon as connections are available.
    fr: |
      `@max_parallelism` fixe le nombre maximal de bases de données de chaque pool élastique sur lesquelles l'étape s'exécute en même temps. Il limite le travail dans Pool1 uniquement, tandis que les bases de données uniques démarrent toujours dès que des connexions sont disponibles.
  options:
    a: { en: "A lower tier limits concurrent connections for all targets, so the single databases would wait too, and up to 100 pool databases could still run at once.", fr: "Un niveau inférieur limite les connexions simultanées pour toutes les cibles : les bases uniques attendraient aussi, et jusqu'à 100 bases du pool pourraient encore s'exécuter en même temps." }
    b: { en: "The job database stores job metadata; scaling it doesn't reduce the load the script puts on Pool1.", fr: "La base de données de travaux stocke les métadonnées des travaux ; l'augmenter ne réduit pas la charge que le script impose à Pool1." }
    d: { en: "Disabling retries doesn't change how many pool databases run the script at the same time.", fr: "Désactiver les nouvelles tentatives ne change pas le nombre de bases du pool qui exécutent le script en même temps." }
references:
  - title: jobs.sp_add_jobstep (Azure Elastic Jobs) (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-jobstep-elastic-jobs-transact-sql
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
