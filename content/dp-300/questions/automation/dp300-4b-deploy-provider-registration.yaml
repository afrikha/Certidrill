id: dp300-4b-deploy-provider-registration
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum creates a new Azure subscription named **Sub2**. You have the Owner role on Sub2.

    You deploy an ARM template that creates a logical server and a database in Sub2. The deployment fails with the error code `MissingSubscriptionRegistration` for the namespace `Microsoft.Sql`.

    You need to deploy the template successfully.

    What should you do before you redeploy?
  fr: |
    Adatum crée un nouvel abonnement Azure nommé **Sub2**. Vous disposez du rôle Owner sur Sub2.

    Vous déployez un modèle ARM qui crée un serveur logique et une base de données dans Sub2. Le déploiement échoue avec le code d'erreur `MissingSubscriptionRegistration` pour l'espace de noms `Microsoft.Sql`.

    Vous devez déployer le modèle avec succès.

    Que devez-vous faire avant de redéployer ?
body:
  options:
    - { id: a, text: { en: "Assign the SQL Server Contributor role to your account on Sub2.", fr: "Attribuer le rôle SQL Server Contributor à votre compte sur Sub2." } }
    - { id: b, text: { en: "Request a quota increase for Azure SQL Database in Sub2.", fr: "Demander une augmentation de quota pour Azure SQL Database dans Sub2." } }
    - { id: c, text: { en: "Register the Microsoft.Sql resource provider in Sub2.", fr: "Inscrire le fournisseur de ressources Microsoft.Sql dans Sub2." } }
    - { id: d, text: { en: "Create a policy exemption for the template's resource group.", fr: "Créer une exemption de stratégie pour le groupe de ressources du modèle." } }
answer: { optionId: c }
explanation:
  correct:
    en: "`MissingSubscriptionRegistration` means that the subscription isn't registered with the resource provider of the resources you deploy. Register `Microsoft.Sql` in Sub2 (for example `az provider register --namespace Microsoft.Sql`), then redeploy."
    fr: "`MissingSubscriptionRegistration` signifie que l'abonnement n'est pas inscrit auprès du fournisseur de ressources des ressources déployées. Inscrivez `Microsoft.Sql` dans Sub2 (par exemple `az provider register --namespace Microsoft.Sql`), puis redéployez."
  options:
    a: { en: "You are already Owner of Sub2; a missing role returns AuthorizationFailed, not MissingSubscriptionRegistration.", fr: "Vous êtes déjà Owner de Sub2 ; un rôle manquant renvoie AuthorizationFailed, pas MissingSubscriptionRegistration." }
    b: { en: "A quota problem returns a quota error such as ResourceQuotaExceeded.", fr: "Un problème de quota renvoie une erreur de quota comme ResourceQuotaExceeded." }
    d: { en: "A blocking policy returns RequestDisallowedByPolicy; no policy is involved here.", fr: "Une stratégie bloquante renvoie RequestDisallowedByPolicy ; aucune stratégie n'est en cause ici." }
references:
  - title: Troubleshoot common Azure deployment errors
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors
