id: dp300-4a-agent-mail-profile
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine named **SQLVM3**. Database Mail is configured with a profile named **DBAMail**, which is the default profile of msdb. When you run `sp_send_dbmail` with DBAMail, the email arrives.

    A SQL Server Agent job named **LoadWarehouse** is configured to email an operator named **DBA-Team** when the job fails. LoadWarehouse failed last night, but DBA-Team received no email.

    You need to ensure that the job notifications are sent.

    What should you do?
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM3**. Database Mail est configuré avec un profil nommé **DBAMail**, qui est le profil par défaut de msdb. Quand vous exécutez `sp_send_dbmail` avec DBAMail, l'e-mail arrive.

    Un travail SQL Server Agent nommé **LoadWarehouse** est configuré pour envoyer un e-mail à un opérateur nommé **DBA-Team** en cas d'échec du travail. LoadWarehouse a échoué la nuit dernière, mais DBA-Team n'a reçu aucun e-mail.

    Vous devez vous assurer que les notifications des travaux sont envoyées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the Database Mail XPs option, and then run RECONFIGURE.", fr: "Activer l'option Database Mail XPs, puis exécuter RECONFIGURE." } }
    - { id: b, text: { en: "Enable the mail profile in the SQL Server Agent properties, and restart the Agent.", fr: "Activer le profil de messagerie dans les propriétés de SQL Server Agent, et redémarrer l'Agent." } }
    - { id: c, text: { en: "Designate DBA-Team as the fail-safe operator in the SQL Server Agent properties.", fr: "Désigner DBA-Team comme opérateur de prévention de défaillance dans les propriétés de SQL Server Agent." } }
    - { id: d, text: { en: "Change the notification of LoadWarehouse so that it emails DBA-Team when the job completes.", fr: "Modifier la notification de LoadWarehouse pour qu'elle envoie un e-mail à DBA-Team à la fin de l'exécution du travail." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Database Mail works, so the missing link is SQL Server Agent itself: it sends notifications only after you enable the mail profile on the Alert System page of its properties, select the Database Mail profile, and restart SQL Server Agent.
    fr: |
      Database Mail fonctionne : le maillon manquant est SQL Server Agent lui-même. Il n'envoie les notifications qu'après l'activation du profil de messagerie dans la page Système d'alerte de ses propriétés, la sélection du profil Database Mail et le redémarrage de SQL Server Agent.
  options:
    a: { en: "Database Mail XPs is already enabled: sp_send_dbmail works.", fr: "Database Mail XPs est déjà activé : sp_send_dbmail fonctionne." }
    c: { en: "A fail-safe operator applies to alerts when the designated operator cannot be reached; Agent mail would still be disabled.", fr: "Un opérateur de prévention de défaillance concerne les alertes quand l'opérateur désigné est injoignable ; la messagerie de l'Agent resterait désactivée." }
    d: { en: "Changing the notification level does not help while SQL Server Agent has no mail profile enabled.", fr: "Changer le niveau de notification n'aide pas tant que SQL Server Agent n'a pas de profil de messagerie activé." }
references:
  - title: Configure SQL Server Agent mail to use Database Mail
    url: https://learn.microsoft.com/en-us/sql/relational-databases/database-mail/configure-sql-server-agent-mail-to-use-database-mail
