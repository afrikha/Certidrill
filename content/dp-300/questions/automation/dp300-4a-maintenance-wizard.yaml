id: dp300-4a-maintenance-wizard
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine named **SQLVM2**. SQLVM2 hosts 12 user databases.

    Every Sunday night, you need to check database integrity, rebuild indexes, update statistics and clean up old job history for all the user databases. You are a member of the sysadmin fixed server role. The solution must minimize administrative effort and must not require you to write scripts.

    What should you use?
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM2**. SQLVM2 héberge 12 bases de données utilisateur.

    Chaque dimanche soir, vous devez vérifier l'intégrité des bases de données, reconstruire les index, mettre à jour les statistiques et nettoyer l'ancien historique des travaux pour toutes les bases de données utilisateur. Vous êtes membre du rôle serveur fixe sysadmin. La solution doit réduire au minimum l'effort d'administration et ne doit pas vous obliger à écrire des scripts.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An elastic job agent", fr: "Un agent de travail élastique" } }
    - { id: b, text: { en: "Database Engine Tuning Advisor", fr: "L'Assistant Paramétrage du moteur de base de données (Database Engine Tuning Advisor)" } }
    - { id: c, text: { en: "Automatic tuning", fr: "Le réglage automatique" } }
    - { id: d, text: { en: "The Maintenance Plan Wizard", fr: "L'Assistant Plan de maintenance" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Maintenance Plan Wizard builds a maintenance plan with tasks such as Check Database Integrity, Rebuild Index, Update Statistics and History Cleanup, and schedules it with SQL Server Agent (one schedule for the whole plan or one per task). It requires membership in sysadmin and the Agent XPs option.
    fr: |
      L'Assistant Plan de maintenance crée un plan de maintenance avec des tâches telles que vérification de l'intégrité de la base de données, reconstruction des index, mise à jour des statistiques et nettoyage de l'historique, et le planifie avec SQL Server Agent (une planification pour tout le plan ou une par tâche). Il nécessite l'appartenance à sysadmin et l'option Agent XPs.
  options:
    a: { en: "Elastic jobs target Azure SQL Database, and they run T-SQL scripts that you write.", fr: "Les travaux élastiques ciblent Azure SQL Database, et ils exécutent des scripts T-SQL que vous écrivez." }
    b: { en: "Database Engine Tuning Advisor recommends indexes for a workload; it does not schedule maintenance.", fr: "Database Engine Tuning Advisor recommande des index pour une charge de travail ; il ne planifie pas la maintenance." }
    c: { en: "Automatic tuning on SQL Server corrects plan regressions; it does not check integrity or rebuild indexes.", fr: "Le réglage automatique sur SQL Server corrige les régressions de plan ; il ne vérifie pas l'intégrité et ne reconstruit pas les index." }
references:
  - title: Use the Maintenance Plan Wizard
    url: https://learn.microsoft.com/en-us/sql/relational-databases/maintenance-plans/use-the-maintenance-plan-wizard
