id: dp300-4a-alert-statements
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are configuring SQL Server Agent alerts on SQL Server 2022 running on an Azure virtual machine.

    Which two statements about SQL Server Agent alerts are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez des alertes SQL Server Agent sur SQL Server 2022 exécuté sur une machine virtuelle Azure.

    Quelles sont les deux affirmations vraies concernant les alertes SQL Server Agent ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An alert defined on an error number fires only when that error is written to the Windows application log.", fr: "Une alerte définie sur un numéro d'erreur ne se déclenche que si cette erreur est écrite dans le journal des applications Windows." } }
    - { id: b, text: { en: "An alert can be defined on an error number and a severity level at the same time.", fr: "Une alerte peut être définie à la fois sur un numéro d'erreur et sur un niveau de gravité." } }
    - { id: c, text: { en: "A performance condition alert can only test whether a counter is equal to a value.", fr: "Une alerte de condition de performances peut seulement tester si un compteur est égal à une valeur." } }
    - { id: d, text: { en: "An alert can run a SQL Server Agent job in response to the event.", fr: "Une alerte peut exécuter un travail SQL Server Agent en réponse à l'événement." } }
    - { id: e, text: { en: "A WMI event alert can query a WMI namespace on a remote server.", fr: "Une alerte d'événement WMI peut interroger un espace de noms WMI sur un serveur distant." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      SQL Server Agent raises event alerts from errors written to the Windows application log (for example severity 19 or higher, RAISERROR WITH LOG, or messages set to be logged with sp_altermessage). An alert can notify operators and run a job, specified with `@job_name` or `@job_id`.
    fr: |
      SQL Server Agent déclenche les alertes d'événement à partir des erreurs écrites dans le journal des applications Windows (par exemple gravité 19 ou plus, RAISERROR WITH LOG, ou messages configurés pour être journalisés avec sp_altermessage). Une alerte peut avertir des opérateurs et exécuter un travail, indiqué par `@job_name` ou `@job_id`.
  options:
    b: { en: "@message_id and @severity are exclusive: when one defines the alert, the other must be 0.", fr: "@message_id et @severity s'excluent : quand l'un définit l'alerte, l'autre doit valoir 0." }
    c: { en: "The comparator can be >, < or =.", fr: "Le comparateur peut être >, < ou =." }
    e: { en: "Only WMI namespaces on the local server are supported.", fr: "Seuls les espaces de noms WMI du serveur local sont pris en charge." }
references:
  - title: sp_add_alert (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-alert-transact-sql
