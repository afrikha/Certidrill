id: dp300-sr2-serverless-cli-2
objective: "4.2.3"
type: series_yesno
series: dp300-sr2-serverless-cli
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You create a serverless database with an auto-pause delay of 2.
  fr: |
    Vous créez une base de données serverless avec un délai de pause automatique de 2.
body:
  solution:
    en: |
      You run `az sql db create -g RG1 -s sql-tail1 -n InventoryDb -e GeneralPurpose -f Gen5 -c 4 --compute-model Serverless --auto-pause-delay 2`.
    fr: |
      Vous exécutez `az sql db create -g RG1 -s sql-tail1 -n InventoryDb -e GeneralPurpose -f Gen5 -c 4 --compute-model Serverless --auto-pause-delay 2`.
answer: { value: false }
explanation:
  correct:
    en: |
      The `--auto-pause-delay` value is expressed in minutes, not hours, so 2 does not request a two-hour delay. It is also below the 15-minute minimum of the General Purpose serverless tier; the value for the requirement is 120.
    fr: |
      La valeur de `--auto-pause-delay` s'exprime en minutes, pas en heures : 2 ne demande pas un délai de deux heures. Elle est aussi inférieure au minimum de 15 minutes du niveau General Purpose serverless ; la valeur qui répond à l'exigence est 120.
references:
  - title: "az sql db"
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
  - title: "Serverless compute tier for Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
