id: dp300-4b-deploy-error-details
objective: "4.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You deploy a Bicep file named **main.bicep** to a resource group named **RG-Data** by using Azure CLI. The file creates a logical server, an elastic pool and four databases.

    The deployment fails, and the CLI output only shows the error code `DeploymentFailed`.

    You need to find the specific error code and message of the resource operation that failed.

    What are two ways to achieve the goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez un fichier Bicep nommé **main.bicep** dans un groupe de ressources nommé **RG-Data** avec Azure CLI. Le fichier crée un serveur logique, un pool élastique et quatre bases de données.

    Le déploiement échoue, et la sortie de l'interface CLI n'affiche que le code d'erreur `DeploymentFailed`.

    Vous devez trouver le code et le message d'erreur précis de l'opération de ressource qui a échoué.

    Quels sont les deux moyens d'atteindre l'objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Open the Resource health page of the logical server.", fr: "Ouvrir la page Resource health du serveur logique." } }
    - { id: b, text: { en: "Run az deployment operation group list for the deployment.", fr: "Exécuter az deployment operation group list pour le déploiement." } }
    - { id: c, text: { en: "Run az deployment group what-if with the same Bicep file.", fr: "Exécuter az deployment group what-if avec le même fichier Bicep." } }
    - { id: d, text: { en: "Open the deployment from the Deployments page of RG-Data and view its operation details.", fr: "Ouvrir le déploiement depuis la page Deployments de RG-Data et afficher le détail de ses opérations." } }
    - { id: e, text: { en: "Open the Service Health page of the subscription.", fr: "Ouvrir la page Service Health de l'abonnement." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`DeploymentFailed` is a generic wrapper: the real error is attached to the individual operations of the deployment. The resource group's Deployments page lists every deployment, and its operation details show the error of each failed step. `az deployment operation group list` returns the same operations, with their status and status message, from the command line."
    fr: "`DeploymentFailed` est une erreur générique : l'erreur réelle est attachée aux opérations individuelles du déploiement. La page Deployments du groupe de ressources liste chaque déploiement, et le détail de ses opérations affiche l'erreur de chaque étape en échec. `az deployment operation group list` renvoie les mêmes opérations, avec leur état et leur message, en ligne de commande."
  options:
    a: { en: "Resource health reports platform availability problems of the server, not why a template operation was rejected.", fr: "Resource health signale les problèmes de disponibilité de la plateforme pour le serveur, pas la raison du rejet d'une opération de modèle." }
    c: { en: "What-if previews the changes of a future deployment; it doesn't show the errors of a past one.", fr: "What-if présente un aperçu des modifications d'un futur déploiement ; il n'affiche pas les erreurs d'un déploiement passé." }
    e: { en: "Service Health reports Azure incidents and planned maintenance, not the errors of your deployments.", fr: "Service Health signale les incidents Azure et la maintenance planifiée, pas les erreurs de vos déploiements." }
references:
  - title: View deployment history with Azure Resource Manager
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-history
  - title: Troubleshoot common Azure deployment errors
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors
