id: dp300-4b-alert-kql-joblogs
objective: "4.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An Azure Automation account named **aa-ops** runs database maintenance runbooks. A diagnostic setting sends the Job Logs and Job Streams categories of aa-ops to a Log Analytics workspace that uses the AzureDiagnostics table.

    You need a query for a log search alert rule that counts, for each runbook, the jobs that failed or were suspended.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte Automation nommé **aa-ops** exécute des runbooks de maintenance de bases de données. Un paramètre de diagnostic envoie les catégories Job Logs et Job Streams d'aa-ops vers un espace de travail Log Analytics qui utilise la table AzureDiagnostics.

    Vous avez besoin d'une requête pour une règle d'alerte de recherche dans les journaux qui compte, pour chaque runbook, les travaux en échec ou suspendus.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    AzureDiagnostics
    | where ResourceProvider == "MICROSOFT.AUTOMATION"
    | where Category == "[[cat]]"
    | where ResultType in ([[status]])
    | summarize FailedJobs = count() by [[col]]
  slots:
    - id: cat
      options:
        - { id: joblogs, text: JobLogs }
        - { id: jobstreams, text: JobStreams }
        - { id: audit, text: AuditEvent }
    - id: status
      options:
        - { id: fs, text: '"Failed", "Suspended"' }
        - { id: ew, text: '"Error", "Warning"' }
        - { id: sc, text: '"Stopped", "Completed"' }
    - id: col
      options:
        - { id: runbook, text: RunbookName_s }
        - { id: stream, text: StreamType_s }
        - { id: jobid, text: JobId_g }
answer:
  values: { cat: joblogs, status: fs, col: runbook }
explanation:
  correct:
    en: |
      The JobLogs category records the status of each runbook job in `ResultType` (Created, Started, Stopped, Suspended, Failed, Completed). Filtering on Failed and Suspended and summarizing by `RunbookName_s` gives one count per runbook.
    fr: |
      La catégorie JobLogs enregistre l'état de chaque travail de runbook dans `ResultType` (Created, Started, Stopped, Suspended, Failed, Completed). Le filtre sur Failed et Suspended, puis le regroupement par `RunbookName_s`, donnent un nombre par runbook.
  options:
    jobstreams: { en: "JobStreams contains the stream records written by the runbooks, not the job status.", fr: "JobStreams contient les enregistrements de flux écrits par les runbooks, pas l'état des travaux." }
    audit: { en: "AuditEvent records the interactions with the account's data and settings.", fr: "AuditEvent enregistre les interactions avec les données et les paramètres du compte." }
    ew: { en: "Error and Warning are stream types, not job statuses.", fr: "Error et Warning sont des types de flux, pas des états de travail." }
    sc: { en: "Stopped and Completed don't describe failed or suspended jobs.", fr: "Stopped et Completed ne décrivent pas des travaux en échec ou suspendus." }
    stream: { en: "StreamType_s belongs to stream records, not to job status records.", fr: "StreamType_s appartient aux enregistrements de flux, pas aux enregistrements d'état des travaux." }
    jobid: { en: "JobId_g gives one row per job, not one count per runbook.", fr: "JobId_g donne une ligne par travail, pas un nombre par runbook." }
references:
  - title: Forward Azure Automation diagnostic logs to Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/automation/automation-manage-send-joblogs-log-analytics
