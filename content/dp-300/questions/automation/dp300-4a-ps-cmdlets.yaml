id: dp300-4a-ps-cmdlets
objective: "4.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You automate the deployment of the Azure SQL resources of Adatum Corporation by using Azure PowerShell.

    Which cmdlet should you use for each task? To answer, drag the appropriate cmdlets to the correct tasks. Each cmdlet may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous automatisez le déploiement des ressources Azure SQL d'Adatum Corporation à l'aide d'Azure PowerShell.

    Quelle applet de commande devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les applets de commande appropriées vers les tâches correspondantes. Chaque applet de commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mi, text: New-AzSqlInstance }
    - { id: vm, text: New-AzSqlVM }
    - { id: fw, text: New-AzSqlServerFirewallRule }
    - { id: copy, text: New-AzSqlDatabaseCopy }
    - { id: pool, text: New-AzSqlElasticPool }
    - { id: setsrv, text: Set-AzSqlServer }
  targets:
    - { id: t1, text: { en: "Create a transactionally consistent copy of SalesDB on a test logical server", fr: "Créer une copie transactionnellement cohérente de SalesDB sur un serveur logique de test" } }
    - { id: t2, text: { en: "Allow client computers in 203.0.113.0/24 to connect to a logical server", fr: "Autoriser les ordinateurs clients de 203.0.113.0/24 à se connecter à un serveur logique" } }
    - { id: t3, text: { en: "Deploy a managed instance into a subnet of a virtual network", fr: "Déployer une instance managée dans un sous-réseau d'un réseau virtuel" } }
    - { id: t4, text: { en: "Provide shared compute for 40 databases whose usage peaks at different times", fr: "Fournir un calcul partagé à 40 bases de données dont les pics d'utilisation surviennent à des moments différents" } }
answer:
  mapping: { t1: copy, t2: fw, t3: mi, t4: pool }
explanation:
  correct:
    en: |
      `New-AzSqlDatabaseCopy` creates a database copy, on the same or another server. `New-AzSqlServerFirewallRule` adds a server-level IP firewall rule with a start and end address. `New-AzSqlInstance` creates a managed instance in a subnet (`-SubnetId`). `New-AzSqlElasticPool` creates a pool whose resources are shared by its databases.
    fr: |
      `New-AzSqlDatabaseCopy` crée une copie de base de données, sur le même serveur ou sur un autre. `New-AzSqlServerFirewallRule` ajoute une règle de pare-feu IP de niveau serveur avec une adresse de début et de fin. `New-AzSqlInstance` crée une instance managée dans un sous-réseau (`-SubnetId`). `New-AzSqlElasticPool` crée un pool dont les ressources sont partagées par ses bases de données.
  options:
    vm: { en: "New-AzSqlVM creates the SQL virtual machine resource of the SQL IaaS Agent extension; it is not used for Azure SQL Database or Managed Instance.", fr: "New-AzSqlVM crée la ressource de machine virtuelle SQL de l'extension SQL IaaS Agent ; elle ne sert pas pour Azure SQL Database ni Managed Instance." }
    setsrv: { en: "Set-AzSqlServer changes server properties; it doesn't create firewall rules.", fr: "Set-AzSqlServer modifie les propriétés du serveur ; elle ne crée pas de règles de pare-feu." }
references:
  - title: New-AzSqlInstance
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/new-azsqlinstance
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
