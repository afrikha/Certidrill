id: dp300-4a-ps-vcore-params
objective: "4.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You need to create a database named **CrmDB** on a logical server named **sql-crm-01** by using `New-AzSqlDatabase`. CrmDB must use the General Purpose service tier, provisioned compute, standard-series (Gen5) hardware and 4 vCores.

    Which two sets of parameters can you add to the command? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer une base de données nommée **CrmDB** sur un serveur logique nommé **sql-crm-01** à l'aide de `New-AzSqlDatabase`. CrmDB doit utiliser le niveau de service General Purpose, le calcul provisionné, le matériel série standard (Gen5) et 4 vCores.

    Quels sont les deux ensembles de paramètres que vous pouvez ajouter à la commande ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "-Edition GeneralPurpose -VCore 4 -ComputeGeneration Gen5" }
    - { id: b, text: "-Edition GeneralPurpose -VCore 4 -ComputeGeneration Gen5 -ComputeModel Serverless" }
    - { id: c, text: "-Edition BusinessCritical -VCore 4 -ComputeGeneration Gen5" }
    - { id: d, text: "-RequestedServiceObjectiveName GP_Gen5_4" }
    - { id: e, text: "-Edition Standard -RequestedServiceObjectiveName S4" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A vCore database is defined either by its components (`-Edition GeneralPurpose -VCore 4 -ComputeGeneration Gen5`, provisioned by default) or by the full service objective name: `GP_Gen5_4` means General Purpose, provisioned, Gen5, 4 vCores. Both produce the same service objective.
    fr: |
      Une base de données vCore se définit soit par ses composants (`-Edition GeneralPurpose -VCore 4 -ComputeGeneration Gen5`, provisionné par défaut), soit par le nom complet de l'objectif de service : `GP_Gen5_4` signifie General Purpose, provisionné, Gen5, 4 vCores. Les deux produisent le même objectif de service.
  options:
    b: { en: "-ComputeModel Serverless creates GP_S_Gen5_4, a serverless database, not provisioned compute.", fr: "-ComputeModel Serverless crée GP_S_Gen5_4, une base serverless, pas du calcul provisionné." }
    c: { en: "This creates a Business Critical database.", fr: "Cela crée une base de données Business Critical." }
    e: { en: "S4 is a DTU-based Standard service objective, not General Purpose vCores.", fr: "S4 est un objectif de service Standard basé sur les DTU, pas des vCores General Purpose." }
references:
  - title: New-AzSqlDatabase
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/new-azsqldatabase
