id: dp300-4a-cli-firewall-rules
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You create a logical server named **sql-web-01** with an Azure CLI script. Public network access is enabled.

    The following clients must connect to the databases of sql-web-01:

    - A web app in Azure App Service that is not integrated with a virtual network. The security team accepts allowing connections from Azure services.
    - The computers of the head office, which use the public addresses 203.0.113.0 to 203.0.113.255.

    No other internet address may connect.

    Which two commands should you add to the script? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un serveur logique nommé **sql-web-01** avec un script Azure CLI. L'accès au réseau public est activé.

    Les clients suivants doivent se connecter aux bases de données de sql-web-01 :

    - Une application web Azure App Service non intégrée à un réseau virtuel. L'équipe de sécurité accepte d'autoriser les connexions des services Azure.
    - Les ordinateurs du siège, qui utilisent les adresses publiques 203.0.113.0 à 203.0.113.255.

    Aucune autre adresse Internet ne doit pouvoir se connecter.

    Quelles sont les deux commandes à ajouter au script ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "az sql server firewall-rule create -g rg-web -s sql-web-01 -n AllowAzure --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0" }
    - { id: b, text: "az sql server firewall-rule create -g rg-web -s sql-web-01 -n AllowAll --start-ip-address 0.0.0.0 --end-ip-address 255.255.255.255" }
    - { id: c, text: "az sql server firewall-rule create -g rg-web -s sql-web-01 -n HeadOffice --start-ip-address 203.0.113.0 --end-ip-address 203.0.113.255" }
    - { id: d, text: "az sql server vnet-rule create -g rg-web -s sql-web-01 -n AppService --vnet-name vnet-web --subnet snet-app" }
    - { id: e, text: "az sql server update -g rg-web -n sql-web-01 --enable-public-network false" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A server-level IP rule whose start and end addresses are both 0.0.0.0 allows connections from Azure services (the portal's "Allow Azure services and resources to access this server"); it also allows services of other customers, which the security team accepted. A second rule covers the head office range 203.0.113.0 to 203.0.113.255.
    fr: |
      Une règle IP de niveau serveur dont les adresses de début et de fin valent toutes deux 0.0.0.0 autorise les connexions des services Azure (l'option du portail « Autoriser les services et les ressources Azure à accéder à ce serveur ») ; elle autorise aussi les services d'autres clients, ce que l'équipe de sécurité a accepté. Une seconde règle couvre la plage du siège, de 203.0.113.0 à 203.0.113.255.
  options:
    b: { en: "This range allows every internet address.", fr: "Cette plage autorise toutes les adresses Internet." }
    d: { en: "A virtual network rule needs a subnet with a service endpoint; the web app is not integrated with a virtual network.", fr: "Une règle de réseau virtuel nécessite un sous-réseau avec un point de terminaison de service ; l'application web n'est pas intégrée à un réseau virtuel." }
    e: { en: "Disabling public network access blocks both clients, which connect through the public endpoint.", fr: "Désactiver l'accès au réseau public bloque les deux clients, qui se connectent via le point de terminaison public." }
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
