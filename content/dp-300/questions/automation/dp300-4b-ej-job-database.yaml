id: dp300-4b-ej-job-database
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware plans to create an elastic job agent named **agent1** on a logical server named **srv-ops**. The agent will run maintenance scripts against 60 databases of Azure SQL Database.

    Which database should you use as the job database of agent1?
  fr: |
    Litware prévoit de créer un agent de travail élastique nommé **agent1** sur un serveur logique nommé **srv-ops**. L'agent exécutera des scripts de maintenance sur 60 bases de données Azure SQL Database.

    Quelle base de données devez-vous utiliser comme base de données de travaux d'agent1 ?
body:
  options:
    - { id: a, text: { en: "An existing Hyperscale database that has no user tables", fr: "Une base de données Hyperscale existante qui ne contient aucune table utilisateur" } }
    - { id: b, text: { en: "A new serverless General Purpose database with auto-pause enabled", fr: "Une nouvelle base de données serverless General Purpose avec la mise en pause automatique activée" } }
    - { id: c, text: { en: "The existing Business Critical database that stores the application tables", fr: "La base de données Business Critical existante qui stocke les tables de l'application" } }
    - { id: d, text: { en: "A new, empty database that uses the S1 service objective", fr: "Une nouvelle base de données vide qui utilise l'objectif de service S1" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The job database stores the job definitions, state and history, and it should be a new, empty Azure SQL database. Microsoft recommends the S1 service objective or higher, and you scale it up if its CPU, data IO or log write utilization approaches 100%.
    fr: |
      La base de données de travaux stocke les définitions, l'état et l'historique des travaux ; elle doit être une nouvelle base de données Azure SQL vide. Microsoft recommande l'objectif de service S1 ou supérieur, et vous l'augmentez si son utilisation du processeur, des E/S de données ou de l'écriture de journal approche 100 %.
  options:
    a: { en: "A Hyperscale database isn't supported as the job database (Hyperscale databases can only be targets).", fr: "Une base de données Hyperscale n'est pas prise en charge comme base de données de travaux (elle ne peut être qu'une cible)." }
    b: { en: "A serverless database with auto-pause isn't supported as the job database.", fr: "Une base de données serverless avec mise en pause automatique n'est pas prise en charge comme base de données de travaux." }
    c: { en: "The job database must be new and empty; you must not create or modify objects in it.", fr: "La base de données de travaux doit être nouvelle et vide ; vous ne devez pas y créer ni modifier d'objets." }
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
