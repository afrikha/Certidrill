id: dp300-4a-arm-dependson
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an ARM template that defines a `Microsoft.Sql/servers` resource and, at the top level of the `resources` array, a `Microsoft.Sql/servers/databases` resource named `[format('{0}/{1}', parameters('serverName'), 'SalesDB')]`.

    When you deploy the template to a new resource group, the deployment sometimes fails because the database is created before the server exists.

    You need to ensure that the database is always deployed after the server.

    What should you do?
  fr: |
    Vous disposez d'un modèle ARM qui définit une ressource `Microsoft.Sql/servers` et, au premier niveau du tableau `resources`, une ressource `Microsoft.Sql/servers/databases` nommée `[format('{0}/{1}', parameters('serverName'), 'SalesDB')]`.

    Quand vous déployez le modèle dans un nouveau groupe de ressources, le déploiement échoue parfois, car la base de données est créée avant que le serveur existe.

    La base de données doit toujours être déployée après le serveur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the resource ID of the server to the dependsOn element of the database.", fr: "Ajouter l'ID de ressource du serveur à l'élément dependsOn de la base de données." } }
    - { id: b, text: { en: "Deploy the template by running az deployment group create --mode Complete.", fr: "Déployer le modèle en exécutant az deployment group create --mode Complete." } }
    - { id: c, text: { en: "Add a condition element that evaluates to true to the server resource.", fr: "Ajouter à la ressource de serveur un élément condition qui prend la valeur true." } }
    - { id: d, text: { en: "Move the database resource before the server resource in the resources array.", fr: "Placer la ressource de base de données avant la ressource de serveur dans le tableau resources." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Resource Manager deploys resources that don't depend on each other in parallel, and in a JSON template a child resource doesn't get an implicit dependency on its parent. A `dependsOn` element that lists the server's resource ID, for example `[resourceId('Microsoft.Sql/servers', parameters('serverName'))]`, forces the server to be deployed first.
    fr: |
      Resource Manager déploie en parallèle les ressources qui ne dépendent pas les unes des autres, et dans un modèle JSON une ressource enfant n'obtient pas de dépendance implicite envers son parent. Un élément `dependsOn` qui liste l'ID de ressource du serveur, par exemple `[resourceId('Microsoft.Sql/servers', parameters('serverName'))]`, impose le déploiement préalable du serveur.
  options:
    b: { en: "The mode controls what happens to resources that aren't in the template, not the order of deployment.", fr: "Le mode détermine le sort des ressources absentes du modèle, pas l'ordre de déploiement." }
    c: { en: "A condition decides whether a resource is deployed, not when.", fr: "Une condition décide si une ressource est déployée, pas quand." }
    d: { en: "The order of the resources array does not define the deployment order.", fr: "L'ordre du tableau resources ne définit pas l'ordre de déploiement." }
references:
  - title: Define the order for deploying resources in ARM templates
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/resource-dependency
