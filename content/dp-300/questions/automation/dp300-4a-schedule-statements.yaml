id: dp300-4a-schedule-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    On SQL Server 2022 running on an Azure virtual machine, a schedule named **Weekly-Sun-0200** is attached to three SQL Server Agent jobs: **IndexMaint**, **StatsMaint** and **PurgeLogs**. None of the jobs has another schedule.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Sur SQL Server 2022 exécuté sur une machine virtuelle Azure, une planification nommée **Weekly-Sun-0200** est attachée à trois travaux SQL Server Agent : **IndexMaint**, **StatsMaint** et **PurgeLogs**. Aucun des travaux n'a d'autre planification.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you change the start time of Weekly-Sun-0200 to 03:00, IndexMaint, StatsMaint and PurgeLogs all start at 03:00.
        fr: Si vous changez l'heure de début de Weekly-Sun-0200 en 03:00, IndexMaint, StatsMaint et PurgeLogs démarrent tous à 03:00.
    - id: s2
      text:
        en: After you disable Weekly-Sun-0200, a DBA can still start PurgeLogs manually.
        fr: Après la désactivation de Weekly-Sun-0200, un administrateur de base de données peut toujours démarrer PurgeLogs manuellement.
    - id: s3
      text:
        en: After you disable Weekly-Sun-0200, editing its start time enables it again.
        fr: Après la désactivation de Weekly-Sun-0200, la modification de son heure de début la réactive.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Updating a schedule affects every job attached to it; to control jobs separately, each job needs its own schedule object. A disabled schedule stops scheduled runs only, so the job can still run manually or from an alert. A disabled schedule must be re-enabled explicitly; editing it does not enable it again.
    fr: |
      La modification d'une planification s'applique à tous les travaux qui y sont attachés ; pour piloter les travaux séparément, chacun a besoin de son propre objet planification. Une planification désactivée n'arrête que les exécutions planifiées : le travail peut toujours s'exécuter manuellement ou à partir d'une alerte. Une planification désactivée doit être réactivée explicitement ; la modifier ne la réactive pas.
references:
  - title: Create and Attach Schedules to Jobs
    url: https://learn.microsoft.com/en-us/ssms/agent/create-and-attach-schedules-to-jobs
