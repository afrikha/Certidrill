id: dp300-4b-ej-umi-auth
objective: "4.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You create an elastic job agent named **agent1** that uses a job database named **JobsDb**. A target group named **TG1** contains three individual databases named **DB1**, **DB2** and **DB3** on a logical server named **srv1**. TG1 contains no server or elastic pool member. Microsoft Entra authentication is enabled on srv1.

    You need agent1 to connect to the databases of TG1 by using Microsoft Entra authentication. No password may be stored for the connections.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un agent de travail élastique nommé **agent1** qui utilise une base de données de travaux nommée **JobsDb**. Un groupe cible nommé **TG1** contient trois bases de données individuelles nommées **DB1**, **DB2** et **DB3** sur un serveur logique nommé **srv1**. TG1 ne contient aucun membre de type serveur ou pool élastique. L'authentification Microsoft Entra est activée sur srv1.

    agent1 doit se connecter aux bases de données de TG1 avec l'authentification Microsoft Entra. Aucun mot de passe ne doit être stocké pour les connexions.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable a system-assigned managed identity on agent1.", fr: "Activer une identité managée affectée par le système sur agent1." } }
    - { id: b, text: { en: "Assign a user-assigned managed identity named umi-jobs to agent1.", fr: "Attribuer à agent1 une identité managée affectée par l'utilisateur nommée umi-jobs." } }
    - { id: c, text: { en: "In JobsDb, create a database scoped credential for umi-jobs.", fr: "Dans JobsDb, créer des informations d'identification délimitées à la base de données pour umi-jobs." } }
    - { id: d, text: { en: "Assign the SQL DB Contributor role on srv1 to umi-jobs.", fr: "Attribuer à umi-jobs le rôle SQL DB Contributor sur srv1." } }
    - { id: e, text: { en: "In DB1, DB2 and DB3, create a user for umi-jobs FROM EXTERNAL PROVIDER and grant it the required permissions.", fr: "Dans DB1, DB2 et DB3, créer un utilisateur pour umi-jobs FROM EXTERNAL PROVIDER et lui accorder les autorisations nécessaires." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The recommended Microsoft Entra method assigns one user-assigned managed identity to the job agent, which uses it to connect to the targets. The identity needs a contained user (`CREATE USER [umi-jobs] FROM EXTERNAL PROVIDER`) with the required permissions in every target database. Because TG1 has no server or pool member, no user is needed in `master` to enumerate databases.
    fr: |
      La méthode Microsoft Entra recommandée attribue une identité managée affectée par l'utilisateur à l'agent de travail, qui l'utilise pour se connecter aux cibles. L'identité a besoin d'un utilisateur contenu (`CREATE USER [umi-jobs] FROM EXTERNAL PROVIDER`) disposant des autorisations nécessaires dans chaque base de données cible. Comme TG1 n'a aucun membre serveur ou pool, aucun utilisateur n'est nécessaire dans `master` pour énumérer les bases.
  options:
    a: { en: "Elastic job agents don't support system-assigned managed identities.", fr: "Les agents de travail élastique ne prennent pas en charge les identités managées affectées par le système." }
    c: { en: "Database scoped credentials store a password and are the other authentication method; an agent can't mix both methods.", fr: "Les informations d'identification délimitées à la base de données stockent un mot de passe et constituent l'autre méthode d'authentification ; un agent ne peut pas mélanger les deux méthodes." }
    d: { en: "SQL DB Contributor manages databases through Azure Resource Manager; it grants no permission inside the databases.", fr: "SQL DB Contributor gère les bases de données via Azure Resource Manager ; il n'accorde aucune autorisation à l'intérieur des bases." }
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
  - title: Create, configure, and manage elastic jobs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-tutorial
