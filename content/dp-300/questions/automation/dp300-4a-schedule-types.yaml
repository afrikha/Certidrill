id: dp300-4a-schedule-types
objective: "4.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You manage SQL Server 2022 on an Azure virtual machine named **SQLVM1**. You create SQL Server Agent schedules by running `sp_add_schedule`.

    Which `@freq_type` value should you use for each requirement? To answer, drag the appropriate values to the correct requirements. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM1**. Vous créez des planifications SQL Server Agent en exécutant `sp_add_schedule`.

    Quelle valeur de `@freq_type` devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les valeurs appropriées vers les exigences correspondantes. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: f1, text: "1" }
    - { id: f4, text: "4" }
    - { id: f8, text: "8" }
    - { id: f16, text: "16" }
    - { id: f32, text: "32" }
    - { id: f64, text: "64" }
  targets:
    - { id: once, text: { en: "Run a data-fix script at 23:00 on 30 November only", fr: "Exécuter un script de correction de données à 23:00 le 30 novembre uniquement" } }
    - { id: sunday, text: { en: "Rebuild indexes every Sunday at 02:00", fr: "Reconstruire les index chaque dimanche à 02:00" } }
    - { id: day15, text: { en: "Archive closed invoices on the 15th day of every month", fr: "Archiver les factures clôturées le 15 de chaque mois" } }
    - { id: lastsat, text: { en: "Run DBCC CHECKDB on the last Saturday of every month", fr: "Exécuter DBCC CHECKDB le dernier samedi de chaque mois" } }
    - { id: start, text: { en: "Clear a staging table every time SQL Server Agent starts", fr: "Vider une table de transit à chaque démarrage de SQL Server Agent" } }
answer:
  mapping: { once: f1, sunday: f8, day15: f16, lastsat: f32, start: f64 }
explanation:
  correct:
    en: "`@freq_type` values: 1 = once, 4 = daily, 8 = weekly, 16 = monthly on a given day number, 32 = monthly relative (with `@freq_relative_interval = 16` for \"last\" and `@freq_interval = 7` for Saturday), 64 = when SQL Server Agent starts. The daily value 4 is not needed."
    fr: "Valeurs de `@freq_type` : 1 = une seule fois, 4 = quotidienne, 8 = hebdomadaire, 16 = mensuelle à un numéro de jour donné, 32 = mensuelle relative (avec `@freq_relative_interval = 16` pour « dernier » et `@freq_interval = 7` pour samedi), 64 = au démarrage de SQL Server Agent. La valeur quotidienne 4 n'est pas utilisée."
  options:
    f4: { en: "A daily schedule would run every day (or every N days), which matches none of the requirements.", fr: "Une planification quotidienne s'exécuterait chaque jour (ou tous les N jours), ce qui ne correspond à aucune exigence." }
references:
  - title: sp_add_schedule (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-schedule-transact-sql
