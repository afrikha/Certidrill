id: dp300-4b-auto-tool-match
objective: "4.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure SQL Database, Azure SQL Managed Instance and Azure Blob Storage. You need to automate four database tasks. The solution must minimize administrative and development effort.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Azure SQL Database, Azure SQL Managed Instance et Stockage Blob Azure. Vous devez automatiser quatre tâches de base de données. La solution doit réduire au minimum l'effort d'administration et de développement.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: elastic, text: { en: "Elastic jobs", fr: "Travaux élastiques" } }
    - { id: agent, text: SQL Server Agent }
    - { id: automation, text: Azure Automation }
    - { id: logic, text: Azure Logic Apps }
    - { id: policy, text: Azure Policy }
    - { id: advisor, text: Azure Advisor }
  targets:
    - id: t1
      text: { en: "Every night, run the same T-SQL script on all the databases of three logical servers, including databases created later.", fr: "Chaque nuit, exécuter le même script T-SQL sur toutes les bases de données de trois serveurs logiques, y compris les bases créées plus tard." }
    - id: t2
      text: { en: "Every night on a managed instance, run an SSIS package step followed by a T-SQL step.", fr: "Chaque nuit, sur une instance managée, exécuter une étape de package SSIS suivie d'une étape T-SQL." }
    - id: t3
      text: { en: "Every Friday at 18:00, scale a database to a higher service objective by running Az PowerShell cmdlets.", fr: "Chaque vendredi à 18:00, faire passer une base de données à un objectif de service supérieur en exécutant des cmdlets Az PowerShell." }
    - id: t4
      text: { en: "When a file is added to a blob container, run a stored procedure in a database, without writing code.", fr: "Lorsqu'un fichier est ajouté à un conteneur d'objets blob, exécuter une procédure stockée dans une base de données, sans écrire de code." }
answer:
  mapping: { t1: elastic, t2: agent, t3: automation, t4: logic }
explanation:
  correct:
    en: |
      Elastic jobs run T-SQL across many Azure SQL databases and enumerate servers at each run, so new databases are included. SQL Server Agent runs on SQL Managed Instance and supports SSIS and T-SQL job steps. An Azure Automation runbook runs PowerShell with the Az modules on a schedule for control-plane tasks such as scaling. Logic Apps workflows react to events, such as a new blob, and call the SQL Server connector's Execute stored procedure action without code.
    fr: |
      Les travaux élastiques exécutent du T-SQL sur de nombreuses bases de données Azure SQL et énumèrent les serveurs à chaque exécution : les nouvelles bases sont incluses. SQL Server Agent s'exécute sur SQL Managed Instance et prend en charge les étapes de travail SSIS et T-SQL. Un runbook Azure Automation exécute du PowerShell avec les modules Az selon une planification pour les tâches du plan de contrôle, comme la mise à l'échelle. Les workflows Logic Apps réagissent à des événements, comme un nouvel objet blob, et appellent l'action Execute stored procedure du connecteur SQL Server sans code.
  options:
    policy: { en: "Azure Policy evaluates and enforces resource compliance; it doesn't run scheduled tasks.", fr: "Azure Policy évalue et impose la conformité des ressources ; il n'exécute pas de tâches planifiées." }
    advisor: { en: "Azure Advisor produces recommendations; it doesn't run tasks.", fr: "Azure Advisor produit des recommandations ; il n'exécute pas de tâches." }
references:
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
  - title: Connect to SQL databases from workflows in Azure Logic Apps
    url: https://learn.microsoft.com/en-us/azure/connectors/connectors-create-api-sqlazure
