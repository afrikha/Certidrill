id: dp300-4b-ts-enumeration
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An elastic job agent named **agent2** authenticates by using a user-assigned managed identity named **umi-ops**. A target group named **TG1** has one member: an elastic pool named **Pool1** on a logical server named **srv-pool**. You created a user for umi-ops FROM EXTERNAL PROVIDER in each of the 25 databases of Pool1.

    The executions of the job that targets TG1 fail before the step runs on any database of Pool1. The error reports that umi-ops can't connect to the `master` database of srv-pool.

    You need the job to run on every database of Pool1, including databases added to Pool1 later. What should you do?
  fr: |
    Un agent de travail élastique nommé **agent2** s'authentifie avec une identité managée affectée par l'utilisateur nommée **umi-ops**. Un groupe cible nommé **TG1** a un seul membre : un pool élastique nommé **Pool1** sur un serveur logique nommé **srv-pool**. Vous avez créé un utilisateur pour umi-ops FROM EXTERNAL PROVIDER dans chacune des 25 bases de données de Pool1.

    Les exécutions du travail qui cible TG1 échouent avant que l'étape ne s'exécute sur une base de Pool1. L'erreur indique qu'umi-ops ne peut pas se connecter à la base de données `master` de srv-pool.

    Le travail doit s'exécuter sur toutes les bases de données de Pool1, y compris celles ajoutées plus tard. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the @refresh_credential_name parameter to the Pool1 member of TG1.", fr: "Ajouter le paramètre @refresh_credential_name au membre Pool1 de TG1." } }
    - { id: b, text: { en: "Assign the Reader role on srv-pool to umi-ops.", fr: "Attribuer le rôle Reader sur srv-pool à umi-ops." } }
    - { id: c, text: { en: "In the master database of srv-pool, create a user for umi-ops FROM EXTERNAL PROVIDER.", fr: "Dans la base de données master de srv-pool, créer un utilisateur pour umi-ops FROM EXTERNAL PROVIDER." } }
    - { id: d, text: { en: "Replace the Pool1 member with 25 SqlDatabase members.", fr: "Remplacer le membre Pool1 par 25 membres SqlDatabase." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Before each execution, the agent connects to `master` of the server to enumerate the databases of a server or elastic pool member. With Microsoft Entra authentication, the managed identity therefore needs a user (or a login and user) in `master` of srv-pool in addition to the users in the target databases.
    fr: |
      Avant chaque exécution, l'agent se connecte à `master` du serveur pour énumérer les bases de données d'un membre serveur ou pool élastique. Avec l'authentification Microsoft Entra, l'identité managée a donc besoin d'un utilisateur (ou d'une connexion et d'un utilisateur) dans `master` de srv-pool, en plus des utilisateurs des bases cibles.
  options:
    a: { en: "A refresh credential is a database scoped credential, which belongs to the other authentication method; an agent can't mix both methods.", fr: "Des informations d'identification d'actualisation sont des informations d'identification délimitées à la base de données, qui relèvent de l'autre méthode d'authentification ; un agent ne peut pas mélanger les deux méthodes." }
    b: { en: "An Azure role doesn't grant a connection to the master database.", fr: "Un rôle Azure n'accorde pas de connexion à la base de données master." }
    d: { en: "Individual database members aren't enumerated, so databases added to Pool1 later would be missed.", fr: "Les membres de base de données individuels ne sont pas énumérés : les bases ajoutées plus tard à Pool1 seraient oubliées." }
references:
