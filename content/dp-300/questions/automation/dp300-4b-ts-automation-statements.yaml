id: dp300-4b-ts-automation-statements
objective: "4.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An Azure Automation account named **aa-ops** runs runbooks that maintain Azure SQL databases. A diagnostic setting sends the Job Logs and Job Streams categories of aa-ops to a Log Analytics workspace. You troubleshoot a runbook job that didn't do what was expected.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte Automation nommé **aa-ops** exécute des runbooks qui assurent la maintenance de bases de données Azure SQL. Un paramètre de diagnostic envoie les catégories Job Logs et Job Streams d'aa-ops vers un espace de travail Log Analytics. Vous diagnostiquez un travail de runbook qui n'a pas produit le résultat attendu.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A runbook job can have the Completed status even though its Error stream contains records.
        fr: Un travail de runbook peut avoir l'état Completed alors que son flux Error contient des enregistrements.
    - id: s2
      text:
        en: The Job Logs category sends the Output and Error stream records of the jobs to the workspace.
        fr: La catégorie Job Logs envoie les enregistrements des flux Output et Error des travaux vers l'espace de travail.
    - id: s3
      text:
        en: To read all the stream records of one job in the workspace, you can filter the AzureDiagnostics table on the JobId_g column.
        fr: Pour lire tous les enregistrements de flux d'un travail dans l'espace de travail, vous pouvez filtrer la table AzureDiagnostics sur la colonne JobId_g.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Non-terminating errors are written to the Error stream without failing the job, so a Completed job can still contain errors. Job Logs only records the job status; the stream records (Output, Warning, Error, Verbose...) come from the Job Streams category. JobStreams records carry the job ID in `JobId_g`, which lets you list every stream of one job in order.
    fr: |
      Les erreurs sans fin d'exécution sont écrites dans le flux Error sans faire échouer le travail : un travail Completed peut donc contenir des erreurs. Job Logs n'enregistre que l'état du travail ; les enregistrements de flux (Output, Warning, Error, Verbose...) proviennent de la catégorie Job Streams. Les enregistrements JobStreams portent l'ID du travail dans `JobId_g`, ce qui permet de lister dans l'ordre tous les flux d'un travail.
references:
  - title: Forward Azure Automation diagnostic logs to Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/automation/automation-manage-send-joblogs-log-analytics
