id: dp300-4b-ej-statements
objective: "4.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware creates an elastic job agent named **agent1** to run maintenance scripts against its Azure SQL databases.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware crée un agent de travail élastique nommé **agent1** pour exécuter des scripts de maintenance sur ses bases de données Azure SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A job created by jobs.sp_add_job without the @enabled parameter runs automatically on its schedule.
        fr: Un travail créé par jobs.sp_add_job sans le paramètre @enabled s'exécute automatiquement selon sa planification.
    - id: s2
      text:
        en: The schedule start and end times of agent1's jobs are interpreted in UTC.
        fr: Les heures de début et de fin de planification des travaux d'agent1 sont interprétées en UTC.
    - id: s3
      text:
        en: agent1 can connect to its target databases by using a system-assigned managed identity.
        fr: agent1 peut se connecter à ses bases de données cibles avec une identité managée affectée par le système.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      `@enabled` defaults to 0, so a new job doesn't run on its schedule until it is enabled; it can still be started manually. All dates and times of elastic jobs are in UTC. For Microsoft Entra authentication, an agent supports one user-assigned managed identity; system-assigned managed identities aren't supported.
    fr: |
      `@enabled` vaut 0 par défaut : un nouveau travail ne s'exécute pas selon sa planification tant qu'il n'est pas activé, mais il peut être démarré manuellement. Toutes les dates et heures des travaux élastiques sont en UTC. Pour l'authentification Microsoft Entra, un agent prend en charge une identité managée affectée par l'utilisateur ; les identités managées affectées par le système ne sont pas prises en charge.
references:
  - title: jobs.sp_add_job (Azure Elastic Jobs) (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-job-elastic-jobs-transact-sql
  - title: Elastic jobs in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
