id: dp300-sr1-weekly-purge-2
objective: "4.3.2"
type: series_yesno
series: dp300-sr1-weekly-purge
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You schedule an Azure Automation runbook that uses the account's managed identity.
  fr: |
    Vous planifiez un runbook Azure Automation qui utilise l'identité managée du compte.
body:
  solution:
    en: |
      You create an Azure Automation account named **aa-nw-maint** and enable its **system-assigned managed identity**. In SalesOps, you run `CREATE USER [aa-nw-maint] FROM EXTERNAL PROVIDER;` for the identity and grant it EXECUTE on dbo.usp_PurgeAudit. You create a PowerShell runbook that obtains an access token for Azure SQL Database with the managed identity and runs `EXEC dbo.usp_PurgeAudit;`, and you link the runbook to a weekly schedule on Sunday at 02:00 UTC.
    fr: |
      Vous créez un compte Azure Automation nommé **aa-nw-maint** et activez son **identité managée affectée par le système**. Dans SalesOps, vous exécutez `CREATE USER [aa-nw-maint] FROM EXTERNAL PROVIDER;` pour l'identité et lui accordez EXECUTE sur dbo.usp_PurgeAudit. Vous créez un runbook PowerShell qui obtient un jeton d'accès pour Azure SQL Database avec l'identité managée et exécute `EXEC dbo.usp_PurgeAudit;`, puis vous liez le runbook à une planification hebdomadaire le dimanche à 02:00 UTC.
answer: { value: true }
explanation:
  correct:
    en: |
      Azure Automation runs runbooks on a schedule without any VM to manage, and a runbook can issue SQL commands to Azure SQL Database through PowerShell. The managed identity authenticates with Microsoft Entra ID, so no password or secret is stored. A contained user created FROM EXTERNAL PROVIDER with only EXECUTE on the procedure gives the identity the permissions it needs and nothing more.
    fr: |
      Azure Automation exécute des runbooks selon une planification sans machine virtuelle à gérer, et un runbook peut envoyer des commandes SQL à Azure SQL Database via PowerShell. L'identité managée s'authentifie auprès de Microsoft Entra ID : aucun mot de passe ni secret n'est stocké. Un utilisateur autonome créé FROM EXTERNAL PROVIDER avec uniquement EXECUTE sur la procédure donne à l'identité les autorisations nécessaires, et rien de plus.
references:
  - title: Manage databases in Azure SQL Database by using Azure Automation
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automation-manage
