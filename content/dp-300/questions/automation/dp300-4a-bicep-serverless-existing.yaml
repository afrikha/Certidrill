id: dp300-4a-bicep-serverless-existing
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A logical server named **sql-contoso-prod** was deployed by another team in the resource group that you deploy to. You must not redeploy or change the server.

    You need a Bicep file that creates a database named **ReportsDB** on sql-contoso-prod. ReportsDB must use the General Purpose serverless compute tier with a maximum of 4 vCores and must pause automatically after 60 minutes of inactivity.

    How should you complete the Bicep file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur logique nommé **sql-contoso-prod** a été déployé par une autre équipe dans le groupe de ressources dans lequel vous déployez. Vous ne devez ni redéployer ni modifier le serveur.

    Vous avez besoin d'un fichier Bicep qui crée une base de données nommée **ReportsDB** sur sql-contoso-prod. ReportsDB doit utiliser le niveau de calcul serverless General Purpose avec 4 vCores au maximum et doit se mettre en pause automatiquement après 60 minutes d'inactivité.

    Comment devez-vous compléter le fichier Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource sqlServer 'Microsoft.Sql/servers@2023-08-01' [[kw]] = {
      name: 'sql-contoso-prod'
    }

    resource reportsDb 'Microsoft.Sql/servers/databases@2023-08-01' = {
      parent: sqlServer
      name: 'ReportsDB'
      location: resourceGroup().location
      sku: {
        name: [[sku]]
        tier: 'GeneralPurpose'
        family: 'Gen5'
        capacity: 4
      }
      properties: {
        [[pause]]: 60
        minCapacity: json('0.5')
      }
    }
  slots:
    - id: kw
      options:
        - { id: existing, text: existing }
        - { id: batch, text: "@batchSize(1)" }
        - { id: secure, text: "@secure()" }
    - id: sku
      options:
        - { id: gp, text: "'GP_Gen5'" }
        - { id: gps, text: "'GP_S_Gen5'" }
        - { id: hss, text: "'HS_S_Gen5'" }
        - { id: srv, text: "'Serverless'" }
    - id: pause
      options:
        - { id: apd, text: autoPauseDelay }
        - { id: apdmin, text: autoPauseDelayInMinutes }
        - { id: idle, text: idleTimeout }
answer:
  values: { kw: existing, sku: gps, pause: apd }
explanation:
  correct:
    en: |
      The `existing` keyword references a resource that is already deployed: Bicep does not deploy it again, and the symbolic name can be used as the `parent` of the database. `GP_S_Gen5` is the General Purpose serverless SKU, `capacity` sets the maximum vCores, and `autoPauseDelay` (in minutes, -1 to disable) with `minCapacity` configure serverless behavior.
    fr: |
      Le mot clé `existing` référence une ressource déjà déployée : Bicep ne la redéploie pas, et le nom symbolique peut servir de `parent` à la base de données. `GP_S_Gen5` est la référence SKU serverless General Purpose, `capacity` définit le nombre maximal de vCores, et `autoPauseDelay` (en minutes, -1 pour désactiver) avec `minCapacity` configurent le comportement serverless.
  options:
    batch: { en: "@batchSize() is a decorator that limits parallel deployment in loops; it does not reference an existing resource.", fr: "@batchSize() est un décorateur qui limite le déploiement en parallèle dans les boucles ; il ne référence pas une ressource existante." }
    secure: { en: "@secure() is a parameter decorator for secrets; without existing, the server would be redeployed.", fr: "@secure() est un décorateur de paramètre pour les secrets ; sans existing, le serveur serait redéployé." }
    gp: { en: "GP_Gen5 is provisioned compute, which never pauses.", fr: "GP_Gen5 correspond au calcul provisionné, qui ne se met jamais en pause." }
    hss: { en: "HS_S_Gen5 is Hyperscale serverless, not General Purpose.", fr: "HS_S_Gen5 correspond à Hyperscale serverless, pas à General Purpose." }
    srv: { en: "Serverless is a compute model, not a SKU name.", fr: "Serverless est un modèle de calcul, pas un nom de référence SKU." }
    apdmin: { en: "AutoPauseDelayInMinutes is the Azure PowerShell parameter; the template property is autoPauseDelay.", fr: "AutoPauseDelayInMinutes est le paramètre Azure PowerShell ; la propriété du modèle est autoPauseDelay." }
    idle: { en: "The database resource has no idleTimeout property.", fr: "La ressource de base de données n'a pas de propriété idleTimeout." }
references:
  - title: Reference existing resources in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/existing-resource
  - title: Microsoft.Sql servers/databases
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.sql/servers/databases
