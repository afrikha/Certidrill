id: dp300-4a-agent-mail-order
objective: "4.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine named **SQLVM1**. An authenticated SMTP relay is available. Database Mail has never been configured on SQLVM1.

    A SQL Server Agent job named **NightlyETL** already has a notification that emails an operator named **DBA-Team** when the job fails.

    You need to ensure that the email is sent the next time NightlyETL fails.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM1**. Un relais SMTP authentifié est disponible. Database Mail n'a jamais été configuré sur SQLVM1.

    Un travail SQL Server Agent nommé **NightlyETL** possède déjà une notification qui envoie un e-mail à un opérateur nommé **DBA-Team** en cas d'échec du travail.

    Vous devez vous assurer que l'e-mail est envoyé la prochaine fois que NightlyETL échoue.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: dbmail, text: { en: "Configure Database Mail with an account for the SMTP relay and a profile, and send a test email.", fr: "Configurer Database Mail avec un compte pour le relais SMTP et un profil, et envoyer un e-mail de test." } }
    - { id: alertsys, text: { en: "On the Alert System page of the SQL Server Agent properties, enable the mail profile and select the Database Mail profile.", fr: "Dans la page Système d'alerte des propriétés de SQL Server Agent, activer le profil de messagerie et sélectionner le profil Database Mail." } }
    - { id: restart, text: { en: "Restart the SQL Server Agent service.", fr: "Redémarrer le service SQL Server Agent." } }
    - { id: miprofile, text: { en: "Rename the profile AzureManagedInstance_dbmail_profile.", fr: "Renommer le profil AzureManagedInstance_dbmail_profile." } }
    - { id: failsafe, text: { en: "Designate DBA-Team as the fail-safe operator.", fr: "Désigner DBA-Team comme opérateur de prévention de défaillance (fail-safe operator)." } }
    - { id: cmdshell, text: { en: "Enable the xp_cmdshell server configuration option.", fr: "Activer l'option de configuration de serveur xp_cmdshell." } }
answer:
  sequence: [ dbmail, alertsys, restart ]
explanation:
  correct:
    en: |
      SQL Server Agent sends email through Database Mail, so the account and profile must exist first. You then enable the mail profile on the Alert System page of the SQL Server Agent properties and select the profile, and you restart SQL Server Agent so that it uses it. The job notification and the operator already exist.
    fr: |
      SQL Server Agent envoie les e-mails via Database Mail : le compte et le profil doivent donc exister d'abord. Vous activez ensuite le profil de messagerie dans la page Système d'alerte des propriétés de SQL Server Agent et sélectionnez le profil, puis vous redémarrez SQL Server Agent pour qu'il l'utilise. La notification du travail et l'opérateur existent déjà.
  options:
    miprofile: { en: "This profile name is required only on Azure SQL Managed Instance.", fr: "Ce nom de profil n'est exigé que sur Azure SQL Managed Instance." }
    failsafe: { en: "A fail-safe operator receives alerts when the designated operator cannot be reached; it does not enable email.", fr: "Un opérateur de prévention de défaillance reçoit les alertes quand l'opérateur désigné est injoignable ; il n'active pas l'envoi d'e-mails." }
    cmdshell: { en: "xp_cmdshell runs operating system commands and is not used by Database Mail.", fr: "xp_cmdshell exécute des commandes du système d'exploitation et n'est pas utilisé par Database Mail." }
references:
  - title: Configure SQL Server Agent mail to use Database Mail
    url: https://learn.microsoft.com/en-us/sql/relational-databases/database-mail/configure-sql-server-agent-mail-to-use-database-mail
