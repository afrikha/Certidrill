id: dp300-4b-auto-runbook-role
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Azure Automation account named **aa-ops** has a system-assigned managed identity. A runbook in aa-ops runs `Set-AzSqlDatabase` to change the service objective of the databases on a logical server named **srv-sales**, according to a schedule.

    You need to grant the managed identity the permissions required by the runbook. The solution must follow the principle of least privilege.

    Which role should you assign to the identity on srv-sales?
  fr: |
    Un compte Automation nommé **aa-ops** dispose d'une identité managée affectée par le système. Un runbook d'aa-ops exécute `Set-AzSqlDatabase` pour modifier l'objectif de service des bases de données d'un serveur logique nommé **srv-sales**, selon une planification.

    Vous devez accorder à l'identité managée les autorisations nécessaires au runbook. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'identité sur srv-sales ?
body:
  options:
    - { id: a, text: Contributor }
    - { id: b, text: SQL DB Contributor }
    - { id: c, text: SQL Server Contributor }
    - { id: d, text: SQL Security Manager }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SQL DB Contributor lets a principal manage SQL databases, including their service objective, but not their parent servers or their security-related policies, and it grants no data access. Assigned on srv-sales, it covers every database of the server and nothing more.
    fr: |
      SQL DB Contributor permet à un principal de gérer des bases de données SQL, y compris leur objectif de service, mais pas leurs serveurs parents ni leurs stratégies liées à la sécurité, et il n'accorde aucun accès aux données. Attribué sur srv-sales, il couvre toutes les bases du serveur, sans plus.
  options:
    a: { en: "Contributor manages every resource type at that scope, far more than the runbook needs.", fr: "Contributor gère tous les types de ressources à cette étendue, bien plus que ce dont le runbook a besoin." }
    c: { en: "SQL Server Contributor also manages the server itself, which the runbook doesn't need.", fr: "SQL Server Contributor gère aussi le serveur lui-même, ce dont le runbook n'a pas besoin." }
    d: { en: "SQL Security Manager manages security policies such as auditing; it can't change a service objective.", fr: "SQL Security Manager gère les stratégies de sécurité comme l'audit ; il ne peut pas modifier un objectif de service." }
references:
  - title: Azure built-in roles for Databases
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/databases
