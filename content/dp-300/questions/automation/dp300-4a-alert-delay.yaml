id: dp300-4a-alert-delay
objective: "4.1.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine. A SQL Server Agent alert named **Sev17** fires on every error of severity 17 and emails an operator named **DBA-Team**.

    During a storage incident, the alert sent hundreds of emails in a few minutes. The alert must keep firing on severity 17 errors, but DBA-Team must receive at most one email every 10 minutes for this alert.

    Which parameter should you set by running `sp_update_alert`?
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure. Une alerte SQL Server Agent nommée **Sev17** se déclenche à chaque erreur de gravité 17 et envoie un e-mail à un opérateur nommé **DBA-Team**.

    Lors d'un incident de stockage, l'alerte a envoyé des centaines d'e-mails en quelques minutes. L'alerte doit continuer à se déclencher sur les erreurs de gravité 17, mais DBA-Team ne doit recevoir qu'un e-mail toutes les 10 minutes au maximum pour cette alerte.

    Quel paramètre devez-vous définir en exécutant `sp_update_alert` ?
body:
  options:
    - { id: a, text: "@delay_between_responses = 10" }
    - { id: b, text: "@delay_between_responses = 600" }
    - { id: c, text: "@include_event_description_in = 0" }
    - { id: d, text: "@enabled = 0" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `@delay_between_responses` is the wait, in seconds, between two responses to the same alert; the default 0 means every occurrence generates a response. 600 seconds gives at most one notification every 10 minutes while the alert stays enabled.
    fr: |
      `@delay_between_responses` est le délai, en secondes, entre deux réponses à la même alerte ; la valeur par défaut 0 signifie que chaque occurrence génère une réponse. 600 secondes donnent au plus une notification toutes les 10 minutes, tandis que l'alerte reste activée.
  options:
    a: { en: "The delay is in seconds: 10 would allow a notification every 10 seconds.", fr: "Le délai est en secondes : 10 autoriserait une notification toutes les 10 secondes." }
    c: { en: "This removes the error text from the email but does not reduce the number of emails.", fr: "Cela retire le texte de l'erreur de l'e-mail mais ne réduit pas le nombre d'e-mails." }
    d: { en: "A disabled alert no longer fires at all.", fr: "Une alerte désactivée ne se déclenche plus du tout." }
references:
  - title: sp_add_alert (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-alert-transact-sql
