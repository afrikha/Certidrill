id: dp300-4a-ps-pool-order
objective: "4.2.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You are writing an Azure PowerShell script that deploys a new environment for Wingtip Toys. The script must create a resource group named **rg-wingtip**, a logical server named **sql-wingtip-01**, an elastic pool named **pool-tenants**, and a database named **tenant001** that is a member of pool-tenants.

    Which four cmdlets should you run in sequence? To answer, move the appropriate cmdlets from the list of cmdlets to the answer area and arrange them in the correct order.
  fr: |
    Vous écrivez un script Azure PowerShell qui déploie un nouvel environnement pour Wingtip Toys. Le script doit créer un groupe de ressources nommé **rg-wingtip**, un serveur logique nommé **sql-wingtip-01**, un pool élastique nommé **pool-tenants** et une base de données nommée **tenant001** membre de pool-tenants.

    Quelles sont les quatre applets de commande à exécuter dans l'ordre ? Pour répondre, déplacez les applets de commande appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: rg, text: New-AzResourceGroup }
    - { id: srv, text: New-AzSqlServer }
    - { id: pool, text: New-AzSqlElasticPool }
    - { id: db, text: "New-AzSqlDatabase -ElasticPoolName pool-tenants" }
    - { id: mi, text: New-AzSqlInstance }
    - { id: ipool, text: New-AzSqlInstancePool }
    - { id: copy, text: New-AzSqlDatabaseCopy }
answer:
  sequence: [ rg, srv, pool, db ]
explanation:
  correct:
    en: |
      Azure PowerShell creates resources imperatively, so each parent must exist before its children: the resource group, then the logical server, then the elastic pool on that server, and finally the database created directly in the pool with `-ElasticPoolName`.
    fr: |
      Azure PowerShell crée les ressources de manière impérative : chaque parent doit exister avant ses enfants. D'abord le groupe de ressources, puis le serveur logique, puis le pool élastique sur ce serveur, et enfin la base de données créée directement dans le pool avec `-ElasticPoolName`.
  options:
    mi: { en: "A managed instance isn't needed: elastic pools belong to logical servers of Azure SQL Database.", fr: "Une instance managée n'est pas nécessaire : les pools élastiques appartiennent aux serveurs logiques d'Azure SQL Database." }
    ipool: { en: "An instance pool hosts managed instances, not Azure SQL databases.", fr: "Un pool d'instances héberge des instances managées, pas des bases Azure SQL Database." }
    copy: { en: "There is no source database to copy.", fr: "Il n'y a pas de base de données source à copier." }
references:
  - title: New-AzSqlDatabase
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/new-azsqldatabase
