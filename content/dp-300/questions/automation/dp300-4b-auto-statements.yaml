id: dp300-4b-auto-statements
objective: "4.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure SQL database named **SalesDb** and an Azure SQL managed instance named **MI1**. You automate database tasks by using Azure Automation, Azure Logic Apps and SQL Server Agent.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une base de données Azure SQL nommée **SalesDb** et d'une instance managée Azure SQL nommée **MI1**. Vous automatisez des tâches de base de données avec Azure Automation, Azure Logic Apps et SQL Server Agent.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Logic Apps workflow can run a stored procedure in SalesDb by using the SQL Server connector.
        fr: Un workflow Logic Apps peut exécuter une procédure stockée dans SalesDb avec le connecteur SQL Server.
    - id: s2
      text:
        en: Assigning the SQL DB Contributor role on SalesDb to the managed identity of a runbook lets the runbook read rows from SalesDb tables.
        fr: L'attribution du rôle SQL DB Contributor sur SalesDb à l'identité managée d'un runbook permet au runbook de lire des lignes des tables de SalesDb.
    - id: s3
      text:
        en: Before you create a SQL Server Agent job on MI1, you must start the SQL Server Agent service of MI1.
        fr: Avant de créer un travail SQL Server Agent sur MI1, vous devez démarrer le service SQL Server Agent de MI1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The SQL Server connector of Logic Apps supports Azure SQL Database and SQL Managed Instance and provides an Execute stored procedure action. SQL DB Contributor is an Azure role with no data actions, so reading data requires a database user with permissions. SQL Server Agent always runs on SQL Managed Instance and can't be started, stopped or disabled.
    fr: |
      Le connecteur SQL Server de Logic Apps prend en charge Azure SQL Database et SQL Managed Instance et fournit une action Execute stored procedure. SQL DB Contributor est un rôle Azure sans action de données ; lire des données exige un utilisateur de base de données disposant d'autorisations. SQL Server Agent s'exécute toujours sur SQL Managed Instance et ne peut être ni démarré, ni arrêté, ni désactivé.
references:
  - title: Connect to SQL databases from workflows in Azure Logic Apps
    url: https://learn.microsoft.com/en-us/azure/connectors/connectors-create-api-sqlazure
  - title: Automate management tasks using SQL Agent jobs in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/job-automation-managed-instance
