id: dp300-4a-log-used-alert
objective: "4.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine. Database Mail and SQL Server Agent mail are configured, and an operator named **DBA-Team** exists. A SQL Server Agent job named **Back up SalesDB log** backs up the transaction log of SalesDB.

    When more than 80 percent of the SalesDB transaction log is used, SQL Server Agent must start the log backup job and send an email to DBA-Team.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure. Database Mail et la messagerie de SQL Server Agent sont configurés, et un opérateur nommé **DBA-Team** existe. Un travail SQL Server Agent nommé **Back up SalesDB log** sauvegarde le journal des transactions de SalesDB.

    Quand plus de 80 % du journal des transactions de SalesDB est utilisé, SQL Server Agent doit démarrer le travail de sauvegarde du journal et envoyer un e-mail à DBA-Team.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    USE msdb;
    EXEC sp_add_alert
        @name = N'SalesDB log above 80 percent',
        [[cond]] = N'SQLServer:Databases|Percent Log Used|SalesDB|>|80',
        [[resp]] = N'Back up SalesDB log';
    EXEC sp_add_notification
        @alert_name = N'SalesDB log above 80 percent',
        @operator_name = N'DBA-Team',
        @notification_method = [[method]];
  slots:
    - id: cond
      options:
        - { id: perf, text: "@performance_condition" }
        - { id: keyword, text: "@event_description_keyword" }
        - { id: wmi, text: "@wmi_query" }
        - { id: msg, text: "@message_id" }
    - id: resp
      options:
        - { id: job, text: "@job_name" }
        - { id: notif, text: "@notification_message" }
        - { id: cat, text: "@category_name" }
    - id: method
      options:
        - { id: m1, text: "1" }
        - { id: m2, text: "2" }
        - { id: m4, text: "4" }
answer:
  values: { cond: perf, resp: job, method: m1 }
explanation:
  correct:
    en: |
      A performance condition alert uses `@performance_condition` with an item (object, counter, instance), a comparator (`>`, `<` or `=`) and a value. `@job_name` names the job that the alert runs in response. In `sp_add_notification`, `@notification_method = 1` is email (2 = pager, 4 = net send).
    fr: |
      Une alerte de condition de performances utilise `@performance_condition` avec un élément (objet, compteur, instance), un comparateur (`>`, `<` ou `=`) et une valeur. `@job_name` désigne le travail que l'alerte exécute en réponse. Dans `sp_add_notification`, `@notification_method = 1` correspond à l'e-mail (2 = pager, 4 = net send).
  options:
    keyword: { en: "This filters event alerts on text in the error description; it does not read performance counters.", fr: "Ce paramètre filtre les alertes d'événement sur un texte de la description d'erreur ; il ne lit pas les compteurs de performances." }
    wmi: { en: "@wmi_query defines a WMI event alert, not a counter threshold.", fr: "@wmi_query définit une alerte d'événement WMI, pas un seuil de compteur." }
    msg: { en: "@message_id defines an alert on an error number.", fr: "@message_id définit une alerte sur un numéro d'erreur." }
    notif: { en: "@notification_message only adds text to the notification; it does not run the backup job.", fr: "@notification_message ajoute seulement du texte à la notification ; il n'exécute pas le travail de sauvegarde." }
    cat: { en: "@category_name only classifies the alert.", fr: "@category_name ne fait que classer l'alerte." }
    m2: { en: "2 is pager.", fr: "2 correspond au pager." }
    m4: { en: "4 is net send.", fr: "4 correspond à net send." }
references:
  - title: sp_add_alert (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-alert-transact-sql
  - title: sp_add_notification (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-notification-transact-sql
