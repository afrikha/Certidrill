id: dp300-4b-ej-schedule
objective: "4.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    In the job database of an elastic job agent, you created a job named **IndexMaint** by running `jobs.sp_add_job` with only the `@job_name` and `@description` parameters, and you added its job step.

    You need IndexMaint to run automatically every six hours, starting on December 1, 2026, at 00:00 UTC.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans la base de données de travaux d'un agent de travail élastique, vous avez créé un travail nommé **IndexMaint** en exécutant `jobs.sp_add_job` avec les seuls paramètres `@job_name` et `@description`, et vous avez ajouté son étape de travail.

    IndexMaint doit s'exécuter automatiquement toutes les six heures, à partir du 1er décembre 2026 à 00:00 UTC.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    EXEC jobs.sp_update_job
        @job_name = N'IndexMaint',
        @enabled = [[en]],
        @schedule_interval_type = N'[[type]]',
        @schedule_interval_count = [[count]],
        @schedule_start_time = N'2026-12-01 00:00:00';
  slots:
    - id: en
      options:
        - { id: zero, text: "0" }
        - { id: one, text: "1" }
    - id: type
      options:
        - { id: once, text: Once }
        - { id: minutes, text: Minutes }
        - { id: hours, text: Hours }
        - { id: days, text: Days }
    - id: count
      options:
        - { id: c1, text: "1" }
        - { id: c4, text: "4" }
        - { id: c6, text: "6" }
        - { id: c24, text: "24" }
answer:
  values: { en: one, type: hours, count: c6 }
explanation:
  correct:
    en: |
      `jobs.sp_add_job` creates a disabled job (`@enabled = 0`) that runs `Once` by default, so the schedule never fires until you enable the job. `@enabled = 1` turns on the schedule, and `@schedule_interval_type = N'Hours'` with `@schedule_interval_count = 6` runs it every six hours. Elastic job times are in UTC.
    fr: |
      `jobs.sp_add_job` crée par défaut un travail désactivé (`@enabled = 0`) qui s'exécute `Once` : la planification ne se déclenche jamais tant que le travail n'est pas activé. `@enabled = 1` active la planification, et `@schedule_interval_type = N'Hours'` avec `@schedule_interval_count = 6` l'exécute toutes les six heures. Les heures des travaux élastiques sont en UTC.
  options:
    zero: { en: "With @enabled = 0 the job only runs when it is started manually.", fr: "Avec @enabled = 0, le travail ne s'exécute que s'il est démarré manuellement." }
    once: { en: "Once runs the job a single time.", fr: "Once exécute le travail une seule fois." }
    minutes: { en: "With Minutes, none of the counts gives six hours (360 minutes).", fr: "Avec Minutes, aucune des valeurs proposées ne donne six heures (360 minutes)." }
    days: { en: "Days runs the job at most once a day.", fr: "Days exécute le travail au plus une fois par jour." }
    c4: { en: "4 hours is a different interval.", fr: "4 heures est un autre intervalle." }
references:
  - title: jobs.sp_add_job (Azure Elastic Jobs) (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-job-elastic-jobs-transact-sql
  - title: jobs.sp_update_job (Azure Elastic Jobs) (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-update-job-elastic-jobs-transact-sql
