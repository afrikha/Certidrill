id: dp300-4b-auto-multiserver
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs SQL Server 2022 on 12 Azure virtual machines. Every instance must run the same set of maintenance jobs.

    You need the jobs to be defined and changed in a single place and to run on all 12 instances. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam exécute SQL Server 2022 sur 12 machines virtuelles Azure. Chaque instance doit exécuter le même ensemble de travaux de maintenance.

    Les travaux doivent être définis et modifiés à un seul endroit et s'exécuter sur les 12 instances. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Make one instance a master server and enlist the other instances as target servers.", fr: "Faire d'une instance un serveur maître et inscrire les autres instances comme serveurs cibles." } }
    - { id: b, text: { en: "Create an elastic job agent and a target group that contains the 12 instances.", fr: "Créer un agent de travail élastique et un groupe cible qui contient les 12 instances." } }
    - { id: c, text: { en: "Script the jobs from one instance and run the script on each instance after every change.", fr: "Générer le script des travaux sur une instance et l'exécuter sur chaque instance après chaque modification." } }
    - { id: d, text: { en: "Migrate the instances to Azure SQL Managed Instance and configure a multiserver environment.", fr: "Migrer les instances vers Azure SQL Managed Instance et configurer un environnement multiserveur." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SQL Server Agent multiserver administration uses a master server (MSX) where you define the jobs, and target servers (TSX) that download and run them. Each target server reports to one master server.
    fr: |
      L'administration multiserveur de SQL Server Agent utilise un serveur maître (MSX), où vous définissez les travaux, et des serveurs cibles (TSX) qui les téléchargent et les exécutent. Chaque serveur cible dépend d'un seul serveur maître.
  options:
    b: { en: "Elastic jobs target databases of Azure SQL Database, not SQL Server instances on virtual machines.", fr: "Les travaux élastiques ciblent des bases de données Azure SQL Database, pas des instances SQL Server sur des machines virtuelles." }
    c: { en: "Re-running a script on 12 instances after each change doesn't minimize administrative effort.", fr: "Réexécuter un script sur 12 instances après chaque modification ne réduit pas l'effort d'administration." }
    d: { en: "Multiserver administration isn't supported on Azure SQL Managed Instance.", fr: "L'administration multiserveur n'est pas prise en charge sur Azure SQL Managed Instance." }
references:
  - title: Create a Multiserver Environment
    url: https://learn.microsoft.com/en-us/sql/ssms/agent/create-a-multiserver-environment
