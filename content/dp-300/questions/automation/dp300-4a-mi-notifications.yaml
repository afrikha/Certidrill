id: dp300-4a-mi-notifications
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. Database Mail is enabled on MI1 with a profile named `AzureManagedInstance_dbmail_profile`, and an operator named **OnCall** has an email address and a pager address.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Database Mail est activé sur MI1 avec un profil nommé `AzureManagedInstance_dbmail_profile`, et un opérateur nommé **OnCall** possède une adresse e-mail et une adresse de pager.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can configure a SQL Server Agent job on MI1 to email OnCall when the job fails.
        fr: Vous pouvez configurer un travail SQL Server Agent sur MI1 pour qu'il envoie un e-mail à OnCall quand le travail échoue.
    - id: s2
      text:
        en: You can create a SQL Server Agent alert on MI1 that starts a job when a severity 17 error occurs.
        fr: Vous pouvez créer une alerte SQL Server Agent sur MI1 qui démarre un travail quand une erreur de gravité 17 se produit.
    - id: s3
      text:
        en: A job on MI1 can notify OnCall by pager when it completes.
        fr: Un travail sur MI1 peut avertir OnCall par pager quand il se termine.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      SQL Server Agent on SQL Managed Instance supports email notifications to operators through the Database Mail profile named `AzureManagedInstance_dbmail_profile`. SQL Server Agent alerts aren't supported on SQL Managed Instance, and neither are pager, net send or event log notifications.
    fr: |
      SQL Server Agent sur SQL Managed Instance prend en charge les notifications par e-mail aux opérateurs via le profil Database Mail nommé `AzureManagedInstance_dbmail_profile`. Les alertes SQL Server Agent ne sont pas prises en charge sur SQL Managed Instance, pas plus que les notifications par pager, net send ou journal des événements.
references:
  - title: Automate management tasks using SQL Agent jobs in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/job-automation-managed-instance
