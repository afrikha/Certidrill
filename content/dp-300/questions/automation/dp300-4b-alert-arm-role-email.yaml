id: dp300-4b-alert-arm-role-email
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a metric alert rule for the failed executions of an elastic job agent in a subscription named **Sub1**.

    When the alert fires, an email must be sent to every user who has the Owner role on Sub1. You must not maintain a list of email addresses when owners change.

    Which notification type should you add to the action group of the alert rule?
  fr: |
    Vous créez une règle d'alerte de métrique pour les exécutions en échec d'un agent de travail élastique dans un abonnement nommé **Sub1**.

    Lorsque l'alerte se déclenche, un e-mail doit être envoyé à chaque utilisateur disposant du rôle Owner sur Sub1. Vous ne devez pas tenir à jour une liste d'adresses e-mail lorsque les propriétaires changent.

    Quel type de notification devez-vous ajouter au groupe d'actions de la règle d'alerte ?
body:
  options:
    - { id: a, text: Email/SMS message/Push/Voice }
    - { id: b, text: Webhook }
    - { id: c, text: Email Azure Resource Manager Role }
    - { id: d, text: ITSM }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Email Azure Resource Manager Role notification sends the email to the users and group members assigned a role (Owner, Contributor, Reader, Monitoring Contributor or Monitoring Reader) at the subscription level, so the recipients follow the role assignments automatically.
    fr: |
      La notification Email Azure Resource Manager Role envoie l'e-mail aux utilisateurs et aux membres de groupes disposant d'un rôle (Owner, Contributor, Reader, Monitoring Contributor ou Monitoring Reader) au niveau de l'abonnement : les destinataires suivent automatiquement les attributions de rôles.
  options:
    a: { en: "The email notification sends to fixed addresses, which you would have to update when owners change.", fr: "La notification par e-mail envoie à des adresses fixes, qu'il faudrait mettre à jour lorsque les propriétaires changent." }
    b: { en: "A webhook calls an HTTP endpoint; it doesn't email the subscription owners.", fr: "Un webhook appelle un point de terminaison HTTP ; il n'envoie pas d'e-mail aux propriétaires de l'abonnement." }
    d: { en: "ITSM creates work items in an IT service management tool through an ITSM connection.", fr: "ITSM crée des éléments de travail dans un outil de gestion des services informatiques via une connexion ITSM." }
references:
  - title: Create and manage action groups in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
