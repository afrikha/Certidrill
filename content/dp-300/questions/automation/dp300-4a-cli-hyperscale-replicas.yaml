id: dp300-4a-cli-hyperscale-replicas
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are creating a Hyperscale database named **TelemetryDB** by running the following command:

    `az sql db create -g rg-iot -s sql-iot-01 -n TelemetryDB -e Hyperscale -f Gen5 -c 8`

    TelemetryDB must have two high availability secondary replicas that can also serve read-only workloads.

    Which parameter should you add to the command?
  fr: |
    Vous créez une base de données Hyperscale nommée **TelemetryDB** en exécutant la commande suivante :

    `az sql db create -g rg-iot -s sql-iot-01 -n TelemetryDB -e Hyperscale -f Gen5 -c 8`

    TelemetryDB doit avoir deux réplicas secondaires de haute disponibilité qui peuvent aussi servir des charges de travail en lecture seule.

    Quel paramètre devez-vous ajouter à la commande ?
body:
  options:
    - { id: a, text: "--read-scale Enabled" }
    - { id: b, text: "--zone-redundant true" }
    - { id: c, text: "--capacity 2" }
    - { id: d, text: "--ha-replicas 2" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `--ha-replicas` (alias `--read-replicas`) sets the number of high availability replicas of a Hyperscale database; these secondary replicas can serve read-only connections.
    fr: |
      `--ha-replicas` (alias `--read-replicas`) définit le nombre de réplicas de haute disponibilité d'une base de données Hyperscale ; ces réplicas secondaires peuvent servir les connexions en lecture seule.
  options:
    a: { en: "--read-scale is settable only for Premium and Business Critical databases.", fr: "--read-scale n'est disponible que pour les bases de données Premium et Business Critical." }
    b: { en: "Zone redundancy spreads replicas across zones; it does not set their number.", fr: "La redondance de zone répartit les réplicas entre les zones ; elle n'en définit pas le nombre." }
    c: { en: "--capacity sets the vCores of the database (-c 8 already does), not the number of replicas.", fr: "--capacity définit les vCores de la base de données (-c 8 le fait déjà), pas le nombre de réplicas." }
references:
  - title: az sql db
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
