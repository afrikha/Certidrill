id: dp300-4a-bicep-entra-admin
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Bicep file that deploys a logical server named **sql-hr-01**. A Microsoft Entra group named **SQL-Admins** must be the administrator of the server, and SQL authentication must be disabled from the moment the server is created.

    The `properties` section of the server contains the following block:

    ```bicep
    administrators: {
      administratorType: 'ActiveDirectory'
      login: 'SQL-Admins'
      sid: sqlAdminsGroupObjectId
      tenantId: tenant().tenantId
      principalType: ???
      azureADOnlyAuthentication: ???
    }
    ```

    Which values should you use?
  fr: |
    Vous écrivez un fichier Bicep qui déploie un serveur logique nommé **sql-hr-01**. Un groupe Microsoft Entra nommé **SQL-Admins** doit être l'administrateur du serveur, et l'authentification SQL doit être désactivée dès la création du serveur.

    La section `properties` du serveur contient le bloc suivant :

    ```bicep
    administrators: {
      administratorType: 'ActiveDirectory'
      login: 'SQL-Admins'
      sid: sqlAdminsGroupObjectId
      tenantId: tenant().tenantId
      principalType: ???
      azureADOnlyAuthentication: ???
    }
    ```

    Quelles valeurs devez-vous utiliser ?
body:
  options:
    - { id: a, text: "principalType: 'User' and azureADOnlyAuthentication: true" }
    - { id: b, text: "principalType: 'Group' and azureADOnlyAuthentication: false" }
    - { id: c, text: "principalType: 'Application' and azureADOnlyAuthentication: true" }
    - { id: d, text: "principalType: 'Group' and azureADOnlyAuthentication: true" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `administrators` object sets the Microsoft Entra administrator at creation: `principalType` must match the principal (`Group` for a group, whose object ID is the `sid`), and `azureADOnlyAuthentication: true` disables SQL authentication on the server, including the server admin login.
    fr: |
      L'objet `administrators` définit l'administrateur Microsoft Entra à la création : `principalType` doit correspondre au principal (`Group` pour un groupe, dont l'ID d'objet est le `sid`), et `azureADOnlyAuthentication: true` désactive l'authentification SQL sur le serveur, y compris pour la connexion d'administrateur du serveur.
  options:
    a: { en: "SQL-Admins is a group, so the principal type User is wrong.", fr: "SQL-Admins est un groupe : le type de principal User est incorrect." }
    b: { en: "With false, SQL authentication stays enabled.", fr: "Avec false, l'authentification SQL reste activée." }
    c: { en: "Application is for a service principal or managed identity, not a group.", fr: "Application concerne un principal de service ou une identité managée, pas un groupe." }
references:
  - title: Microsoft.Sql servers
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.sql/servers
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
