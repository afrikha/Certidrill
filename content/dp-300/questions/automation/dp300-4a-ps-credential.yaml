id: dp300-4a-ps-credential
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A deployment script contains the following command:

    ```powershell
    New-AzSqlServer -ResourceGroupName rg-hr -ServerName sql-hr-02 -Location westeurope `
      -SqlAdministratorCredentials 'sqladmin:P@ss-2026-Hr!'
    ```

    The command fails with an error stating that the value cannot be converted to the expected type. The server must use SQL authentication with an administrator login named **sqladmin**, and the password must not be written in the script.

    What should you do?
  fr: |
    Un script de déploiement contient la commande suivante :

    ```powershell
    New-AzSqlServer -ResourceGroupName rg-hr -ServerName sql-hr-02 -Location westeurope `
      -SqlAdministratorCredentials 'sqladmin:P@ss-2026-Hr!'
    ```

    La commande échoue avec une erreur indiquant que la valeur ne peut pas être convertie dans le type attendu. Le serveur doit utiliser l'authentification SQL avec une connexion d'administrateur nommée **sqladmin**, et le mot de passe ne doit pas être écrit dans le script.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Pass the password with -SqlAdministratorCredentials (ConvertTo-SecureString 'P@ss-2026-Hr!' -AsPlainText -Force).", fr: "Passer le mot de passe avec -SqlAdministratorCredentials (ConvertTo-SecureString 'P@ss-2026-Hr!' -AsPlainText -Force)." } }
    - { id: b, text: { en: "Pass -SqlAdministratorCredentials (Get-Credential -UserName sqladmin) so that the password is entered at run time.", fr: "Passer -SqlAdministratorCredentials (Get-Credential -UserName sqladmin) pour que le mot de passe soit saisi à l'exécution." } }
    - { id: c, text: { en: "Replace -SqlAdministratorCredentials with -ExternalAdminName sqladmin.", fr: "Remplacer -SqlAdministratorCredentials par -ExternalAdminName sqladmin." } }
    - { id: d, text: { en: "Run Connect-AzAccount with the sqladmin account before New-AzSqlServer.", fr: "Exécuter Connect-AzAccount avec le compte sqladmin avant New-AzSqlServer." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `-SqlAdministratorCredentials` expects a `PSCredential` object that holds the login name and a secure password. `Get-Credential` builds it and prompts for the password, so the password is not in the script (in a pipeline, build the PSCredential from a secret instead).
    fr: |
      `-SqlAdministratorCredentials` attend un objet `PSCredential` contenant le nom de connexion et un mot de passe sécurisé. `Get-Credential` le construit et demande le mot de passe : celui-ci n'est pas dans le script (dans un pipeline, construisez plutôt le PSCredential à partir d'un secret).
  options:
    a: { en: "A SecureString is not a PSCredential, and the password would still be written in the script.", fr: "Un SecureString n'est pas un PSCredential, et le mot de passe resterait écrit dans le script." }
    c: { en: "-ExternalAdminName sets a Microsoft Entra administrator; the requirement is a SQL authentication login.", fr: "-ExternalAdminName définit un administrateur Microsoft Entra ; l'exigence porte sur une connexion d'authentification SQL." }
    d: { en: "Connect-AzAccount signs in to Azure; it does not provide the server administrator credentials.", fr: "Connect-AzAccount connecte à Azure ; il ne fournit pas les informations d'identification de l'administrateur du serveur." }
references:
  - title: New-AzSqlServer
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/new-azsqlserver
