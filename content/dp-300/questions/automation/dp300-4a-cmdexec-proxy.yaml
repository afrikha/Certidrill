id: dp300-4a-cmdexec-proxy
objective: "4.1.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have SQL Server 2022 on an Azure virtual machine that is joined to the contoso.com domain. A SQL Server Agent job owned by a login named **etl_owner** has an Operating system (CmdExec) step that copies export files to a file share. etl_owner is not a member of the sysadmin fixed server role.

    The step fails. A domain account named **CONTOSO\svc-export** has write access to the share.

    You need the step to run as CONTOSO\svc-export. The solution must follow the principle of least privilege.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de SQL Server 2022 sur une machine virtuelle Azure jointe au domaine contoso.com. Un travail SQL Server Agent dont le propriétaire est une connexion nommée **etl_owner** comporte une étape Système d'exploitation (CmdExec) qui copie des fichiers d'export vers un partage de fichiers. etl_owner n'est pas membre du rôle serveur fixe sysadmin.

    L'étape échoue. Un compte de domaine nommé **CONTOSO\svc-export** dispose d'un accès en écriture au partage.

    L'étape doit s'exécuter sous CONTOSO\svc-export. La solution doit respecter le principe du moindre privilège.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: cred, text: { en: "Create a credential that stores the identity and password of CONTOSO\\svc-export.", fr: "Créer des informations d'identification qui stockent l'identité et le mot de passe de CONTOSO\\svc-export." } }
    - { id: proxy, text: { en: "Create a SQL Server Agent proxy that uses the credential.", fr: "Créer un proxy SQL Server Agent qui utilise les informations d'identification." } }
    - { id: grant, text: { en: "Grant the proxy access to the Operating system (CmdExec) subsystem and to the etl_owner login.", fr: "Accorder au proxy l'accès au sous-système Système d'exploitation (CmdExec) et à la connexion etl_owner." } }
    - { id: step, text: { en: "Select the proxy in the Run as list of the job step.", fr: "Sélectionner le proxy dans la liste Exécuter en tant que de l'étape de travail." } }
    - { id: sysadmin, text: { en: "Add etl_owner to the sysadmin fixed server role.", fr: "Ajouter etl_owner au rôle serveur fixe sysadmin." } }
    - { id: dbcred, text: { en: "Create a database scoped credential in msdb for CONTOSO\\svc-export.", fr: "Créer des informations d'identification délimitées à la base de données dans msdb pour CONTOSO\\svc-export." } }
    - { id: cmdshell, text: { en: "Enable the xp_cmdshell server configuration option.", fr: "Activer l'option de configuration de serveur xp_cmdshell." } }
answer:
  sequence: [ cred, proxy, grant, step ]
explanation:
  correct:
    en: |
      Job steps other than Transact-SQL run under the SQL Server Agent service account only when the owner is a sysadmin; otherwise they need a proxy. A proxy is based on a server credential, so you create the credential first, then the proxy, then grant the proxy to the CmdExec subsystem and to the login that uses it, and finally select the proxy in the step.
    fr: |
      Les étapes de travail autres que Transact-SQL ne s'exécutent sous le compte de service SQL Server Agent que si le propriétaire est sysadmin ; sinon, elles ont besoin d'un proxy. Un proxy repose sur des informations d'identification de serveur : vous créez d'abord les informations d'identification, puis le proxy, puis vous accordez le proxy au sous-système CmdExec et à la connexion qui l'utilise, et enfin vous sélectionnez le proxy dans l'étape.
  options:
    sysadmin: { en: "Making etl_owner a sysadmin violates least privilege, and the step would run as the Agent service account, not svc-export.", fr: "Rendre etl_owner sysadmin enfreint le moindre privilège, et l'étape s'exécuterait sous le compte de service de l'Agent, pas sous svc-export." }
    dbcred: { en: "SQL Server Agent proxies use server-level credentials, not database scoped credentials.", fr: "Les proxys SQL Server Agent utilisent des informations d'identification au niveau du serveur, pas délimitées à la base de données." }
    cmdshell: { en: "xp_cmdshell is unrelated to CmdExec job steps.", fr: "xp_cmdshell n'a aucun rapport avec les étapes de travail CmdExec." }
references:
  - title: Create a SQL Server Agent proxy
    url: https://learn.microsoft.com/en-us/ssms/agent/create-a-sql-server-agent-proxy
