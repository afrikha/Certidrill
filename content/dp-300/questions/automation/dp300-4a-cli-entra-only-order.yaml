id: dp300-4a-cli-entra-only-order
objective: "4.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An Azure CLI script creates a logical server named **sql-fin-01** with a SQL authentication administrator by using `az sql server create --admin-user` and `--admin-password`. You must keep this command unchanged.

    You need to extend the script so that, at the end, a Microsoft Entra group named **Fin-DBAs** is the administrator of sql-fin-01 and only Microsoft Entra authentication is allowed. The group already exists.

    Which three commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    Un script Azure CLI crée un serveur logique nommé **sql-fin-01** avec un administrateur d'authentification SQL à l'aide de `az sql server create --admin-user` et `--admin-password`. Vous devez conserver cette commande sans la modifier.

    Vous devez compléter le script pour qu'à la fin un groupe Microsoft Entra nommé **Fin-DBAs** soit l'administrateur de sql-fin-01 et que seule l'authentification Microsoft Entra soit autorisée. Le groupe existe déjà.

    Quelles sont les trois commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: "az sql server create (existing command)" }
    - { id: admin, text: "az sql server ad-admin create --display-name Fin-DBAs --object-id <group object ID>" }
    - { id: only, text: "az sql server ad-only-auth enable" }
    - { id: group, text: "az ad group create --display-name Fin-DBAs" }
    - { id: public, text: "az sql server update --enable-public-network false" }
    - { id: fw, text: "az sql server firewall-rule create --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0" }
answer:
  sequence: [ create, admin, only ]
explanation:
  correct:
    en: |
      The server must exist before you set its Microsoft Entra administrator with `az sql server ad-admin create` (display name and object ID of the group). The Microsoft Entra admin must be set before Microsoft Entra-only authentication can be enabled with `az sql server ad-only-auth enable`, which then disables SQL authentication on the server, including the SQL administrator login.
    fr: |
      Le serveur doit exister avant que vous définissiez son administrateur Microsoft Entra avec `az sql server ad-admin create` (nom d'affichage et ID d'objet du groupe). L'administrateur Microsoft Entra doit être défini avant de pouvoir activer l'authentification Microsoft Entra uniquement avec `az sql server ad-only-auth enable`, qui désactive ensuite l'authentification SQL sur le serveur, y compris la connexion d'administrateur SQL.
  options:
    group: { en: "The group already exists.", fr: "Le groupe existe déjà." }
    public: { en: "Disabling public network access controls network connectivity, not the authentication method.", fr: "Désactiver l'accès au réseau public contrôle la connectivité réseau, pas la méthode d'authentification." }
    fw: { en: "A firewall rule controls which addresses can connect, not the authentication method.", fr: "Une règle de pare-feu contrôle les adresses qui peuvent se connecter, pas la méthode d'authentification." }
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
  - title: az sql server ad-admin
    url: https://learn.microsoft.com/en-us/cli/azure/sql/server/ad-admin
