id: dp300-4b-auto-runbook-sql-access
objective: "4.3.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    An Azure Automation account named **aa-ops** has no managed identity. A runbook named **rb-purge** in aa-ops must run a stored procedure named **dbo.usp_Purge** in a database named **SalesDb** on a logical server named **srv-sales**. The runbook gets an access token for Azure SQL Database and connects with it. No password may be stored.

    You are the Microsoft Entra admin of srv-sales. The solution must follow the principle of least privilege.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un compte Automation nommé **aa-ops** ne dispose d'aucune identité managée. Un runbook nommé **rb-purge** dans aa-ops doit exécuter une procédure stockée nommée **dbo.usp_Purge** dans une base de données nommée **SalesDb** sur un serveur logique nommé **srv-sales**. Le runbook obtient un jeton d'accès pour Azure SQL Database et se connecte avec ce jeton. Aucun mot de passe ne doit être stocké.

    Vous êtes l'administrateur Microsoft Entra de srv-sales. La solution doit respecter le principe du moindre privilège.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: identity, text: { en: "Enable the system-assigned managed identity of aa-ops.", fr: "Activer l'identité managée affectée par le système d'aa-ops." } }
    - { id: user, text: { en: "Connect to SalesDb as the Microsoft Entra admin and run CREATE USER [aa-ops] FROM EXTERNAL PROVIDER.", fr: "Se connecter à SalesDb en tant qu'administrateur Microsoft Entra et exécuter CREATE USER [aa-ops] FROM EXTERNAL PROVIDER." } }
    - { id: grant, text: { en: "In SalesDb, run GRANT EXECUTE ON dbo.usp_Purge TO [aa-ops].", fr: "Dans SalesDb, exécuter GRANT EXECUTE ON dbo.usp_Purge TO [aa-ops]." } }
    - { id: start, text: { en: "Start rb-purge and review the Output and Error streams of the job.", fr: "Démarrer rb-purge et examiner les flux Output et Error du travail." } }
    - { id: login, text: { en: "In master, create a SQL login for aa-ops WITH PASSWORD.", fr: "Dans master, créer une connexion SQL pour aa-ops WITH PASSWORD." } }
    - { id: rbac, text: { en: "Assign the SQL DB Contributor role on SalesDb to the identity of aa-ops.", fr: "Attribuer à l'identité d'aa-ops le rôle SQL DB Contributor sur SalesDb." } }
    - { id: owner, text: { en: "In SalesDb, add [aa-ops] to the db_owner role.", fr: "Dans SalesDb, ajouter [aa-ops] au rôle db_owner." } }
answer:
  sequence: [ identity, user, grant, start ]
explanation:
  correct:
    en: |
      The identity must exist before a database user can be mapped to it, and a contained user `FROM EXTERNAL PROVIDER` must be created by a Microsoft Entra principal, such as the server's Microsoft Entra admin; the user of a system-assigned identity takes the display name of the Automation account. The user then gets only EXECUTE on the procedure, and you test the runbook last by reading its job streams.
    fr: |
      L'identité doit exister avant qu'un utilisateur de base de données puisse lui être associé, et un utilisateur contenu `FROM EXTERNAL PROVIDER` doit être créé par un principal Microsoft Entra, comme l'administrateur Microsoft Entra du serveur ; l'utilisateur d'une identité affectée par le système porte le nom complet du compte Automation. L'utilisateur reçoit ensuite uniquement EXECUTE sur la procédure, et vous testez le runbook en dernier en lisant les flux de son travail.
  options:
    login: { en: "A SQL login stores a password, which the requirements forbid.", fr: "Une connexion SQL stocke un mot de passe, ce que les exigences interdisent." }
    rbac: { en: "SQL DB Contributor is an Azure role for managing the database resource; it grants no permission to run a procedure.", fr: "SQL DB Contributor est un rôle Azure de gestion de la ressource base de données ; il n'accorde aucune autorisation d'exécuter une procédure." }
    owner: { en: "db_owner grants far more than EXECUTE on one procedure, which violates least privilege.", fr: "db_owner accorde bien plus que EXECUTE sur une procédure, ce qui enfreint le moindre privilège." }
references:
  - title: Configure and manage Microsoft Entra authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
  - title: Using a system-assigned managed identity for an Azure Automation account
    url: https://learn.microsoft.com/en-us/azure/automation/enable-managed-identity-for-automation
