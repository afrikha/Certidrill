id: dp300-4a-cli-db-copy
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database named **InvoicesDB** on a logical server named **sql-prod-01**. A second logical server named **sql-test-01** is in the same subscription.

    Every month, an Azure CLI script must create on sql-test-01 a transactionally consistent, read-write database that contains the data of InvoicesDB at the time of the operation. The copy must not stay synchronized with InvoicesDB. The solution must minimize administrative effort.

    Which command should the script use?
  fr: |
    Vous disposez d'une base Azure SQL Database nommée **InvoicesDB** sur un serveur logique nommé **sql-prod-01**. Un second serveur logique nommé **sql-test-01** se trouve dans le même abonnement.

    Chaque mois, un script Azure CLI doit créer sur sql-test-01 une base de données en lecture-écriture, transactionnellement cohérente, qui contient les données d'InvoicesDB au moment de l'opération. La copie ne doit pas rester synchronisée avec InvoicesDB. La solution doit réduire au minimum l'effort d'administration.

    Quelle commande le script doit-il utiliser ?
body:
  options:
    - { id: a, text: az sql db replica create }
    - { id: b, text: az sql db export }
    - { id: c, text: az sql db copy }
    - { id: d, text: az sql db restore }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `az sql db copy` creates a transactionally consistent copy of a database, on the same server or on another server, as an independent read-write database. One command does the whole operation, and the copy is not kept in sync with the source.
    fr: |
      `az sql db copy` crée une copie transactionnellement cohérente d'une base de données, sur le même serveur ou sur un autre, sous la forme d'une base de données indépendante en lecture-écriture. Une seule commande effectue toute l'opération, et la copie n'est pas synchronisée avec la source.
  options:
    a: { en: "A geo-replica is a continuously synchronized, read-only secondary.", fr: "Un géoréplica est un secondaire en lecture seule synchronisé en continu." }
    b: { en: "An export writes a BACPAC file to storage; you would then have to import it, which adds effort.", fr: "Un export écrit un fichier BACPAC dans le stockage ; il faudrait ensuite l'importer, ce qui ajoute de l'effort." }
    d: { en: "A point-in-time restore creates the new database on the same server as the source.", fr: "Une restauration à un point dans le temps crée la nouvelle base de données sur le même serveur que la source." }
references:
  - title: az sql db
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
