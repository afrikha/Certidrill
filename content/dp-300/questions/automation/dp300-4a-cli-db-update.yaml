id: dp300-4a-cli-db-update
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A logical server named **sql-app-01** contains a Standard elastic pool named **Pool1** and two databases: **AppDB**, a single database, and **ArchiveDB**, a member of Pool1. You manage them with Azure CLI.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un serveur logique nommé **sql-app-01** contient un pool élastique Standard nommé **Pool1** et deux bases de données : **AppDB**, une base de données unique, et **ArchiveDB**, membre de Pool1. Vous les gérez avec Azure CLI.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Running az sql db update -g rg-app -s sql-app-01 -n AppDB --elastic-pool Pool1 moves AppDB into Pool1.
        fr: L'exécution de az sql db update -g rg-app -s sql-app-01 -n AppDB --elastic-pool Pool1 déplace AppDB dans Pool1.
    - id: s2
      text:
        en: Running az sql db update -g rg-app -s sql-app-01 -n ArchiveDB --service-objective S3 removes ArchiveDB from Pool1.
        fr: L'exécution de az sql db update -g rg-app -s sql-app-01 -n ArchiveDB --service-objective S3 retire ArchiveDB de Pool1.
    - id: s3
      text:
        en: Running az sql db update -g rg-app -s sql-app-01 -n AppDB --max-size 250 sets the maximum size of AppDB to 250 GB.
        fr: L'exécution de az sql db update -g rg-app -s sql-app-01 -n AppDB --max-size 250 définit la taille maximale d'AppDB à 250 Go.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      `--elastic-pool` on `az sql db update` moves the database into the pool. A standalone service objective such as S3 applied to a pooled database removes it from the pool. `--max-size` without a unit is read in bytes, so 250 GB must be written `--max-size 250GB`.
    fr: |
      `--elastic-pool` sur `az sql db update` déplace la base de données dans le pool. Un objectif de service autonome comme S3 appliqué à une base de données d'un pool la retire du pool. Sans unité, `--max-size` est interprété en octets : 250 Go s'écrit `--max-size 250GB`.
references:
  - title: az sql db
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
