id: dp300-4a-mi-agent-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. You are investigating SQL Server Agent jobs on MI1. One job runs every five minutes, and the history of older executions of the other jobs is missing.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Vous examinez les travaux SQL Server Agent de MI1. Un travail s'exécute toutes les cinq minutes, et l'historique des exécutions plus anciennes des autres travaux est absent.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can raise the job history limit of MI1 to keep more than 100 history rows per job.
        fr: Vous pouvez relever la limite d'historique des travaux de MI1 pour conserver plus de 100 lignes d'historique par travail.
    - id: s2
      text:
        en: A job on MI1 can contain a step that runs an SSIS package.
        fr: Un travail sur MI1 peut contenir une étape qui exécute un package SSIS.
    - id: s3
      text:
        en: You can change the SQL Server Agent properties of MI1 by running sp_set_agent_properties.
        fr: Vous pouvez modifier les propriétés de SQL Server Agent de MI1 en exécutant sp_set_agent_properties.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      On SQL Managed Instance, the job history retention is fixed at the default of 1,000 rows in total and 100 rows per job, so a frequent job pushes out the history of the others; export the history if you need to keep it. SSIS job steps are supported. SQL Server Agent settings are read-only and sp_set_agent_properties isn't supported.
    fr: |
      Sur SQL Managed Instance, la rétention de l'historique des travaux est fixée à la valeur par défaut de 1 000 lignes au total et 100 lignes par travail : un travail fréquent chasse donc l'historique des autres ; exportez l'historique si vous devez le conserver. Les étapes de travail SSIS sont prises en charge. Les paramètres de SQL Server Agent sont en lecture seule et sp_set_agent_properties n'est pas pris en charge.
references:
  - title: Automate management tasks using SQL Agent jobs in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/job-automation-managed-instance
