id: dp300-5c-fci-quorum
objective: "5.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are deploying a two-node SQL Server failover cluster instance (FCI) on Azure virtual machines in an availability set. The FCI stores its databases on Azure shared disks (Premium SSD).

    You need to configure the quorum of the Windows Server failover cluster. The solution must use the most resilient quorum option for this storage.

    Which witness should you configure?
  fr: |
    Vous déployez une instance de cluster de basculement (FCI) SQL Server à deux nœuds sur des machines virtuelles Azure dans un groupe à haute disponibilité. La FCI stocke ses bases de données sur des disques partagés Azure (Premium SSD).

    Vous devez configurer le quorum du cluster de basculement Windows Server. La solution doit utiliser l'option de quorum la plus résiliente pour ce stockage.

    Quel témoin devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A cloud witness in an Azure Storage account", fr: "Un témoin cloud dans un compte Stockage Azure" } }
    - { id: b, text: { en: "A file share witness on a third virtual machine", fr: "Un témoin de partage de fichiers sur une troisième machine virtuelle" } }
    - { id: c, text: { en: "A disk witness on an additional Azure shared disk", fr: "Un témoin de disque sur un disque partagé Azure supplémentaire" } }
    - { id: d, text: { en: "No witness, because a two-node cluster keeps quorum without one", fr: "Aucun témoin, car un cluster à deux nœuds conserve le quorum sans témoin" } }
answer: { optionId: c }
explanation:
  correct:
    en: A disk witness is the most resilient quorum option and the preferred one for any cluster that uses Azure shared disks or another shared-disk solution. A cloud witness is recommended whenever possible, except with a shared-storage cluster such as this FCI.
    fr: Un témoin de disque est l'option de quorum la plus résiliente et celle à privilégier pour tout cluster qui utilise des disques partagés Azure ou une autre solution de disques partagés. Un témoin cloud est recommandé chaque fois que possible, sauf avec un cluster à stockage partagé comme cette FCI.
  options:
    a: { en: "A cloud witness is the usual choice for clusters without shared storage, for example availability groups.", fr: "Un témoin cloud est le choix habituel pour les clusters sans stockage partagé, par exemple les groupes de disponibilité." }
    b: { en: "A file share witness is for when neither a disk witness nor a cloud witness is possible.", fr: "Un témoin de partage de fichiers est réservé aux cas où ni un témoin de disque ni un témoin cloud ne sont possibles." }
    d: { en: "Production clusters require a quorum resource to be supported by Microsoft, even with two nodes.", fr: "Les clusters de production doivent avoir une ressource de quorum pour être pris en charge par Microsoft, même avec deux nœuds." }
references:
  - title: HADR configuration best practices - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/hadr-cluster-best-practices
