id: dp300-5c-ls-job-servers
objective: "5.3.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You configure log shipping for a database named **ErpDb**. **SQL1** hosts the primary database, **SQL2** and **SQL3** host secondary databases, and **SQLMON** is the monitor server.

    On which server does each SQL Server Agent job of the configuration run? To answer, drag the appropriate servers to the correct jobs. Each server may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez la copie des journaux de transaction d'une base de données nommée **ErpDb**. **SQL1** héberge la base primaire, **SQL2** et **SQL3** hébergent des bases secondaires, et **SQLMON** est le serveur moniteur.

    Sur quel serveur s'exécute chaque travail SQL Server Agent de la configuration ? Pour répondre, faites glisser les serveurs appropriés vers les travaux correspondants. Chaque serveur peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: primary, text: { en: "SQL1 (primary server)", fr: "SQL1 (serveur primaire)" } }
    - { id: secondary, text: { en: "SQL2 and SQL3 (each secondary server)", fr: "SQL2 et SQL3 (chaque serveur secondaire)" } }
    - { id: monitor, text: { en: "SQLMON (monitor server)", fr: "SQLMON (serveur moniteur)" } }
    - { id: all, text: { en: "Every server of the configuration", fr: "Tous les serveurs de la configuration" } }
  targets:
    - { id: backup, text: { en: "Backup job", fr: "Travail de sauvegarde" } }
    - { id: copy, text: { en: "Copy job", fr: "Travail de copie" } }
    - { id: restore, text: { en: "Restore job", fr: "Travail de restauration" } }
    - { id: alert, text: { en: "Alert job", fr: "Travail d'alerte" } }
answer:
  mapping: { backup: primary, copy: secondary, restore: secondary, alert: monitor }
explanation:
  correct:
    en: The backup job runs on the primary server and backs up the transaction log. Each secondary server runs its own copy job, which copies the backup files to a local folder, and its own restore job, which applies them to the secondary database. When a monitor server is configured, the alert job runs on it and raises an alert when a backup or restore threshold is exceeded.
    fr: Le travail de sauvegarde s'exécute sur le serveur primaire et sauvegarde le journal des transactions. Chaque serveur secondaire exécute son propre travail de copie, qui copie les fichiers de sauvegarde dans un dossier local, et son propre travail de restauration, qui les applique à la base secondaire. Quand un serveur moniteur est configuré, le travail d'alerte s'exécute sur ce serveur et déclenche une alerte quand un seuil de sauvegarde ou de restauration est dépassé.
references:
  - title: About Log Shipping (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/about-log-shipping-sql-server
