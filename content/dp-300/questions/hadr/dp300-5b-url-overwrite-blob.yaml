id: dp300-5b-url-overwrite-blob
objective: "5.2.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine. A SQL Server Agent job runs the following statement every Sunday by using a SAS credential for the container:

    ```sql
    BACKUP DATABASE Hr
    TO URL = N'https://stlitwarebak.blob.core.windows.net/sql/Hr_weekly.bak'
    WITH COMPRESSION, CHECKSUM;
    ```

    The first run succeeded. The second run failed because the blob already exists.

    Which two changes allow the job to succeed every week? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure. Un travail SQL Server Agent exécute chaque dimanche l'instruction suivante avec des informations d'identification SAS pour le conteneur :

    ```sql
    BACKUP DATABASE Hr
    TO URL = N'https://stlitwarebak.blob.core.windows.net/sql/Hr_weekly.bak'
    WITH COMPRESSION, CHECKSUM;
    ```

    La première exécution a réussi. La deuxième a échoué, car l'objet blob existe déjà.

    Quelles sont les deux modifications qui permettent au travail de réussir chaque semaine ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the INIT option to the WITH clause.", fr: "Ajouter l'option INIT à la clause WITH." } }
    - { id: b, text: { en: "Add the FORMAT option to the WITH clause.", fr: "Ajouter l'option FORMAT à la clause WITH." } }
    - { id: c, text: { en: "Add the NOINIT option to the WITH clause to append the new backup set.", fr: "Ajouter l'option NOINIT à la clause WITH pour ajouter le nouveau jeu de sauvegarde." } }
    - { id: d, text: { en: "Add RETAINDAYS = 7 to the WITH clause.", fr: "Ajouter RETAINDAYS = 7 à la clause WITH." } }
    - { id: e, text: { en: "Build the blob name with the backup date in the job step, so that each run writes a new blob.", fr: "Construire le nom de l'objet blob avec la date de la sauvegarde dans l'étape du travail, pour que chaque exécution écrive un nouvel objet blob." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Backup to URL can't append to an existing blob: the backup fails unless `WITH FORMAT` overwrites it. Writing each backup to a new blob name avoids the conflict and also keeps the previous weeks' backups.
    fr: |
      La sauvegarde vers une URL ne peut pas ajouter de données à un objet blob existant : elle échoue sauf si `WITH FORMAT` l'écrase. Écrire chaque sauvegarde dans un nouvel objet blob évite le conflit et conserve en plus les sauvegardes des semaines précédentes.
  options:
    a: { en: "INIT and NOINIT aren't supported by backup to URL.", fr: "INIT et NOINIT ne sont pas pris en charge par la sauvegarde vers une URL." }
    c: { en: "Appending to a blob isn't possible with backup to URL; NOINIT isn't supported.", fr: "L'ajout à un objet blob est impossible avec la sauvegarde vers une URL ; NOINIT n'est pas pris en charge." }
    d: { en: "EXPIREDATE and RETAINDAYS aren't supported by backup to URL.", fr: "EXPIREDATE et RETAINDAYS ne sont pas pris en charge par la sauvegarde vers une URL." }
references:
  - title: SQL Server backup to URL for Azure Blob Storage
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/sql-server-backup-to-url
