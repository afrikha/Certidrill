id: dp300-cs1a-backup-retention
objective: "5.2.5"
type: dropdown
caseStudy: dp300-cs1a-lucerne-logistics
difficulty: 1
status: draft
stem:
  en: |
    You need to configure the backup retention of FreightOps on MI1 to meet the business continuity requirements. The resource group is named **rg-data**.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la rétention des sauvegardes de FreightOps sur MI1 pour satisfaire les exigences de continuité d'activité. Le groupe de ressources se nomme **rg-data**.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql [[group]] ltr-policy set \
      --resource-group rg-data --mi MI1 --name FreightOps \
      --monthly-retention [[monthly]] \
      --yearly-retention [[yearly]] \
      --week-of-year 26
  slots:
    - id: group
      options:
        - { id: db, text: db }
        - { id: midb, text: midb }
        - { id: mi, text: mi }
    - id: monthly
      options:
        - { id: m7m, text: P7M }
        - { id: m7w, text: P7W }
        - { id: m7y, text: P7Y }
    - id: yearly
      options:
        - { id: y10y, text: P10Y }
        - { id: y10m, text: P10M }
        - { id: y1y, text: P1Y }
answer:
  values: { group: midb, monthly: m7y, yearly: y10y }
explanation:
  correct:
    en: |
      Long-term retention of a managed instance database is configured with `az sql midb ltr-policy set`. Retention periods use ISO 8601 durations: `P7Y` keeps each monthly backup for seven years, and `P10Y`, the maximum, keeps the yearly backup taken during week 26 for 10 years.
    fr: |
      La rétention à long terme d'une base de données d'instance managée se configure avec `az sql midb ltr-policy set`. Les durées de rétention utilisent le format ISO 8601 : `P7Y` conserve chaque sauvegarde mensuelle pendant sept ans, et `P10Y`, le maximum, conserve pendant 10 ans la sauvegarde annuelle effectuée la semaine 26.
  options:
    db: { en: "az sql db ltr-policy configures databases of a logical server in Azure SQL Database, not managed instance databases.", fr: "az sql db ltr-policy configure les bases de données d'un serveur logique Azure SQL Database, pas celles d'une instance managée." }
    mi: { en: "az sql mi manages the instance itself; long-term retention policies are set per database with az sql midb.", fr: "az sql mi gère l'instance elle-même ; les stratégies de rétention à long terme se définissent par base de données avec az sql midb." }
    m7m: { en: "P7M is seven months, not seven years.", fr: "P7M correspond à sept mois, pas à sept ans." }
    m7w: { en: "P7W is seven weeks.", fr: "P7W correspond à sept semaines." }
    y10m: { en: "P10M is 10 months.", fr: "P10M correspond à 10 mois." }
    y1y: { en: "P1Y keeps the yearly backup for one year only.", fr: "P1Y ne conserve la sauvegarde annuelle qu'un an." }
references:
  - title: Manage Azure SQL Managed Instance long-term backup retention
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/long-term-backup-retention-configure
  - title: az sql midb ltr-policy
    url: https://learn.microsoft.com/en-us/cli/azure/sql/midb/ltr-policy
