id: dp300-5a-vm-ag-zones
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a database named **TradeDb** on SQL Server 2022 Enterprise on Azure virtual machines in the East US 2 region.

    You need to design a high availability solution for TradeDb that meets the following requirements:

    - If a datacenter of the region fails, TradeDb must fail over automatically.
    - No committed transaction can be lost during the failover.

    What should you recommend?
  fr: |
    Litware exécute une base de données nommée **TradeDb** sur SQL Server 2022 Enterprise sur des machines virtuelles Azure dans la région East US 2.

    Vous devez concevoir une solution de haute disponibilité pour TradeDb qui satisfait les exigences suivantes :

    - Si un centre de données de la région tombe en panne, TradeDb doit basculer automatiquement.
    - Aucune transaction validée ne doit être perdue lors du basculement.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An availability group in synchronous-commit mode with the VMs in the same availability set", fr: "Un groupe de disponibilité en mode de validation synchrone avec les machines virtuelles dans le même groupe à haute disponibilité" } }
    - { id: b, text: { en: "An availability group in asynchronous-commit mode with the VMs in different availability zones", fr: "Un groupe de disponibilité en mode de validation asynchrone avec les machines virtuelles dans des zones de disponibilité différentes" } }
    - { id: c, text: { en: "An availability group in synchronous-commit mode with the VMs in different availability zones", fr: "Un groupe de disponibilité en mode de validation synchrone avec les machines virtuelles dans des zones de disponibilité différentes" } }
    - { id: d, text: { en: "Log shipping between two VMs in different availability zones", fr: "La copie des journaux de transaction entre deux machines virtuelles dans des zones de disponibilité différentes" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Availability zones protect against the loss of an entire datacenter, whereas an availability set only protects against rack failures and maintenance inside one datacenter. Synchronous commit guarantees that a committed transaction is hardened on the secondary, and it's required for automatic failover.
    fr: |
      Les zones de disponibilité protègent contre la perte d'un centre de données entier, alors qu'un groupe à haute disponibilité ne protège que contre les pannes de rack et la maintenance au sein d'un même centre de données. La validation synchrone garantit qu'une transaction validée est écrite sur le secondaire, et elle est obligatoire pour le basculement automatique.
  options:
    a: { en: "All VMs of an availability set are in one datacenter, so a datacenter failure takes down every replica.", fr: "Toutes les machines virtuelles d'un groupe à haute disponibilité se trouvent dans un même centre de données : une panne de ce centre arrête tous les réplicas." }
    b: { en: "Asynchronous commit supports only a forced manual failover, which can lose transactions.", fr: "La validation asynchrone ne prend en charge qu'un basculement manuel forcé, qui peut perdre des transactions." }
    d: { en: "Log shipping has no automatic failover, and changes since the last log backup are lost.", fr: "La copie des journaux de transaction n'a pas de basculement automatique, et les modifications postérieures à la dernière sauvegarde de journal sont perdues." }
references:
  - title: Always On availability group on SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-overview
  - title: Change availability mode of a replica within an Always On availability group
    url: https://learn.microsoft.com/en-us/sql/database-engine/availability-groups/windows/change-the-availability-mode-of-an-availability-replica-sql-server
