id: dp300-5a-drill-powershell
objective: "5.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a failover group named **fog-hr** in the resource group **rg-hr**. The primary server is **srv-hr-eus** in East US, and the secondary server is **srv-hr-wus** in West US.

    You need to script a disaster recovery drill that makes srv-hr-wus the primary. The drill must not lose any data: if the roles can't be switched safely, the command must fail and roll back.

    How should you complete the Azure PowerShell command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un groupe de basculement nommé **fog-hr** dans le groupe de ressources **rg-hr**. Le serveur primaire est **srv-hr-eus** dans East US, et le serveur secondaire est **srv-hr-wus** dans West US.

    Vous devez écrire le script d'un exercice de récupération d'urgence qui fait de srv-hr-wus le primaire. L'exercice ne doit perdre aucune donnée : si les rôles ne peuvent pas être inversés en toute sécurité, la commande doit échouer et être annulée.

    Comment devez-vous compléter la commande Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -ResourceGroupName "rg-hr" `
        -ServerName [[srv]] `
        -FailoverGroupName "fog-hr" [[flag]]
  slots:
    - id: cmd
      options:
        - { id: switch, text: Switch-AzSqlDatabaseFailoverGroup }
        - { id: set, text: Set-AzSqlDatabaseFailoverGroup }
        - { id: invoke, text: Invoke-AzSqlDatabaseFailover }
    - id: srv
      options:
        - { id: eus, text: "\"srv-hr-eus\"" }
        - { id: wus, text: "\"srv-hr-wus\"" }
        - { id: fog, text: "\"fog-hr\"" }
    - id: flag
      options:
        - { id: none, text: { en: "(no additional parameter)", fr: "(aucun paramètre supplémentaire)" } }
        - { id: allow, text: "-AllowDataLoss" }
        - { id: try, text: "-TryPlannedBeforeForcedFailover" }
answer:
  values: { cmd: switch, srv: wus, flag: none }
explanation:
  correct:
    en: |
      Switch-AzSqlDatabaseFailoverGroup runs the failover, and -ServerName must be the secondary server that becomes the new primary. Without any data loss parameter, the command performs a planned failover that either succeeds with no data loss or fails and rolls back.
    fr: |
      Switch-AzSqlDatabaseFailoverGroup effectue le basculement, et -ServerName doit désigner le serveur secondaire qui devient le nouveau primaire. Sans paramètre de perte de données, la commande effectue un basculement planifié qui réussit sans perte de données ou échoue et est annulé.
  options:
    set: { en: "Set-AzSqlDatabaseFailoverGroup changes the settings of the group, such as its failover policy; it doesn't fail over.", fr: "Set-AzSqlDatabaseFailoverGroup modifie les paramètres du groupe, comme sa stratégie de basculement ; il n'effectue pas de basculement." }
    invoke: { en: "Invoke-AzSqlDatabaseFailover tests a local failover of one database inside its region.", fr: "Invoke-AzSqlDatabaseFailover teste un basculement local d'une base au sein de sa région." }
    eus: { en: "The command targets the secondary server, not the current primary.", fr: "La commande cible le serveur secondaire, pas le primaire actuel." }
    allow: { en: "-AllowDataLoss performs a forced failover that can lose unsynchronized changes.", fr: "-AllowDataLoss effectue un basculement forcé qui peut perdre les modifications non synchronisées." }
    try: { en: "-TryPlannedBeforeForcedFailover falls back to a forced failover with possible data loss if the planned failover fails.", fr: "-TryPlannedBeforeForcedFailover se replie sur un basculement forcé avec perte de données possible si le basculement planifié échoue." }
references:
  - title: Switch-AzSqlDatabaseFailoverGroup
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/switch-azsqldatabasefailovergroup
