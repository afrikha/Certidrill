id: dp300-5b-pitr-deleted-database
objective: "5.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **srv-hr**. Yesterday at 16:40, an administrator deleted a database named **Staff** from srv-hr by mistake. srv-hr still exists. No long-term retention policy was configured for Staff.

    You need to recover Staff as it was when it was deleted.

    Which two methods can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **srv-hr**. Hier à 16:40, un administrateur a supprimé par erreur une base de données nommée **Staff** de srv-hr. srv-hr existe toujours. Aucune stratégie de rétention à long terme n'était configurée pour Staff.

    Vous devez récupérer Staff telle qu'elle était au moment de sa suppression.

    Quelles sont les deux méthodes que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the Azure portal, open srv-hr, select Deleted databases, and restore Staff.", fr: "Dans le portail Azure, ouvrir srv-hr, sélectionner Deleted databases, puis restaurer Staff." } }
    - { id: b, text: { en: "Run az sql db ltr-backup restore for the latest backup of Staff.", fr: "Exécuter az sql db ltr-backup restore pour la dernière sauvegarde de Staff." } }
    - { id: c, text: { en: "Connect to master on srv-hr and run RESTORE DATABASE Staff FROM URL.", fr: "Se connecter à master sur srv-hr et exécuter RESTORE DATABASE Staff FROM URL." } }
    - { id: d, text: { en: "Run Restore-AzSqlDatabase with the -FromDeletedDatabaseBackup parameter.", fr: "Exécuter Restore-AzSqlDatabase avec le paramètre -FromDeletedDatabaseBackup." } }
    - { id: e, text: { en: "Run Restore-AzSqlDatabase with the -FromLongTermRetentionBackup parameter.", fr: "Exécuter Restore-AzSqlDatabase avec le paramètre -FromLongTermRetentionBackup." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A deleted database can be restored to its deletion time, or an earlier point, on the same server while the server exists. In the portal, the server's Deleted databases page lists it; in PowerShell, `Get-AzSqlDeletedDatabaseBackup` followed by `Restore-AzSqlDatabase -FromDeletedDatabaseBackup` does the same.
    fr: |
      Une base de données supprimée peut être restaurée à l'heure de sa suppression, ou à un point antérieur, sur le même serveur tant que celui-ci existe. Dans le portail, la page Deleted databases du serveur la répertorie ; dans PowerShell, `Get-AzSqlDeletedDatabaseBackup` suivi de `Restore-AzSqlDatabase -FromDeletedDatabaseBackup` produit le même résultat.
  options:
    b: { en: "No long-term retention policy was configured, so Staff has no LTR backup.", fr: "Aucune stratégie de rétention à long terme n'était configurée : Staff n'a aucune sauvegarde LTR." }
    c: { en: "Azure SQL Database doesn't support restoring with Transact-SQL; automated backups aren't accessible directly.", fr: "Azure SQL Database ne permet pas de restaurer avec Transact-SQL ; les sauvegardes automatiques ne sont pas accessibles directement." }
    e: { en: "This parameter set restores long-term retention backups, and Staff has none.", fr: "Ce jeu de paramètres restaure des sauvegardes de rétention à long terme, et Staff n'en a aucune." }
references:
  - title: Restore a database from a backup in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
  - title: Restore-AzSqlDatabase
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/restore-azsqldatabase
