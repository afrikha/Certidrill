id: dp300-5c-mon-ag-queues-hotarea
objective: "5.3.6"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have an Always On availability group named **AG3** on Azure virtual machines. **SQLVM1** hosts the primary replica of a database named **OrdersDb**, and three other virtual machines host secondary replicas. The redo rates of the three secondary replicas are similar.

    You collect the following values from sys.dm_hadr_database_replica_states for the secondary databases.

    Answer each prompt by selecting the appropriate replica.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un groupe de disponibilité Always On nommé **AG3** sur des machines virtuelles Azure. **SQLVM1** héberge le réplica primaire d'une base de données nommée **OrdersDb**, et trois autres machines virtuelles hébergent des réplicas secondaires. Les vitesses de rejeu des trois réplicas secondaires sont similaires.

    Vous collectez les valeurs suivantes dans sys.dm_hadr_database_replica_states pour les bases secondaires.

    Répondez à chaque consigne en sélectionnant le réplica approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The replica that would lose the most data if you forced a failover to it now", fr: "Le réplica qui perdrait le plus de données si vous forciez maintenant un basculement vers lui" }
    - id: p2
      text: { en: "The replica on which OrdersDb would take the longest to come online after a failover", fr: "Le réplica sur lequel OrdersDb mettrait le plus de temps à être en ligne après un basculement" }
  grid:
    header: [{ en: "Replica", fr: "Réplica" }, { en: "Availability mode", fr: "Mode de disponibilité" }, synchronization_state_desc, { en: "log_send_queue_size (KB)", fr: "log_send_queue_size (Ko)" }, { en: "redo_queue_size (KB)", fr: "redo_queue_size (Ko)" }]
    rows:
      - [{ text: SQLVM2, area: vm2 }, { text: SYNCHRONOUS_COMMIT }, { text: SYNCHRONIZED }, { text: "0" }, { text: "350" }]
      - [{ text: SQLVM3, area: vm3 }, { text: ASYNCHRONOUS_COMMIT }, { text: SYNCHRONIZING }, { text: "48200" }, { text: "1100" }]
      - [{ text: SQLVM4, area: vm4 }, { text: ASYNCHRONOUS_COMMIT }, { text: SYNCHRONIZING }, { text: "600" }, { text: "925000" }]
answer:
  values: { p1: vm3, p2: vm4 }
explanation:
  correct:
    en: The log send queue is log generated on the primary that the secondary hasn't received yet, so SQLVM3, with about 48 MB in its send queue, would lose the most data in a forced failover. The redo queue is log received but not yet redone; with similar redo rates, SQLVM4 and its redo queue of about 900 MB needs the longest redo before OrdersDb can come online. SQLVM2 is synchronized, with an empty send queue and a small redo queue.
    fr: La file d'envoi du journal contient le journal généré sur le primaire que le secondaire n'a pas encore reçu ; SQLVM3, avec environ 48 Mo dans sa file d'envoi, perdrait donc le plus de données lors d'un basculement forcé. La file de rétablissement contient le journal reçu mais pas encore rejoué ; à vitesses de rejeu similaires, SQLVM4 et sa file d'environ 900 Mo demande le rejeu le plus long avant que OrdersDb ne soit en ligne. SQLVM2 est synchronisé, avec une file d'envoi vide et une petite file de rétablissement.
references:
  - title: sys.dm_hadr_database_replica_states (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-hadr-database-replica-states-transact-sql
