id: dp300-5a-mi-tde-backup
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI3** that hosts a database named **ClaimsDb**. ClaimsDb is encrypted by transparent data encryption (TDE) with the default service-managed key. MI3 has a credential for a Blob Storage container that uses a shared access signature.

    You run the following statement, and it fails:

    `BACKUP DATABASE ClaimsDb TO URL = N'https://stadatumbak.blob.core.windows.net/sql/ClaimsDb.bak' WITH COPY_ONLY;`

    You need to take a native backup of ClaimsDb to the container. Data must stay encrypted at rest in the database.

    What should you do first?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI3** qui héberge une base de données nommée **ClaimsDb**. ClaimsDb est chiffrée par le chiffrement transparent des données (TDE) avec la clé gérée par le service par défaut. MI3 possède des informations d'identification pour un conteneur Stockage Blob qui utilisent une signature d'accès partagé.

    Vous exécutez l'instruction suivante, qui échoue :

    `BACKUP DATABASE ClaimsDb TO URL = N'https://stadatumbak.blob.core.windows.net/sql/ClaimsDb.bak' WITH COPY_ONLY;`

    Vous devez effectuer une sauvegarde native de ClaimsDb vers le conteneur. Les données doivent rester chiffrées au repos dans la base.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Replace the credential with one that uses the storage account access key.", fr: "Remplacer les informations d'identification par d'autres qui utilisent la clé d'accès du compte de stockage." } }
    - { id: b, text: { en: "Remove the COPY_ONLY option from the statement.", fr: "Supprimer l'option COPY_ONLY de l'instruction." } }
    - { id: c, text: { en: "Change the TDE protector of MI3 to a customer-managed key in Azure Key Vault.", fr: "Remplacer le protecteur TDE de MI3 par une clé gérée par le client dans Azure Key Vault." } }
    - { id: d, text: { en: "Add the ENCRYPTION option with a server certificate to the statement.", fr: "Ajouter à l'instruction l'option ENCRYPTION avec un certificat de serveur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SQL Managed Instance can't take a COPY_ONLY backup of a database protected by service-managed TDE, because the internal key can't be exported and the backup couldn't be restored elsewhere. Switching to a customer-managed TDE protector (BYOK) keeps the data encrypted and allows the backup; disabling TDE would also work but breaks the encryption requirement.
    fr: |
      SQL Managed Instance ne peut pas effectuer de sauvegarde COPY_ONLY d'une base protégée par un TDE géré par le service, car la clé interne ne peut pas être exportée et la sauvegarde ne pourrait pas être restaurée ailleurs. Passer à un protecteur TDE géré par le client (BYOK) garde les données chiffrées et permet la sauvegarde ; désactiver TDE fonctionnerait aussi, mais ne respecte pas l'exigence de chiffrement.
  options:
    a: { en: "SQL Managed Instance supports only a SAS or a managed identity for backup to URL; storage access keys aren't supported.", fr: "SQL Managed Instance ne prend en charge qu'une SAS ou une identité managée pour la sauvegarde vers une URL ; les clés d'accès de stockage ne sont pas prises en charge." }
    b: { en: "COPY_ONLY is mandatory for user backups on SQL Managed Instance.", fr: "COPY_ONLY est obligatoire pour les sauvegardes utilisateur sur SQL Managed Instance." }
    d: { en: "Backup encryption protects the backup file but doesn't remove the service-managed TDE restriction.", fr: "Le chiffrement de sauvegarde protège le fichier de sauvegarde, mais ne lève pas la restriction liée au TDE géré par le service." }
references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
  - title: Copy-only backups
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/copy-only-backups-sql-server
