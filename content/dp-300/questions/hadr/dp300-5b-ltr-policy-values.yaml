id: dp300-5b-ltr-policy-values
objective: "5.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **Claims** on a logical server named **srv-ins**. A compliance policy requires the following for Claims:

    - Keep each weekly full backup for eight weeks.
    - Keep the first full backup of each month for 18 months.
    - Keep the full backup taken during week 14 of each year for seven years.

    You need to configure the long-term retention policy of Claims.

    Which value should you use for each setting? To answer, drag the appropriate values to the correct settings. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Claims** sur un serveur logique nommé **srv-ins**. Une stratégie de conformité impose les exigences suivantes pour Claims :

    - Conserver chaque sauvegarde complète hebdomadaire pendant huit semaines.
    - Conserver la première sauvegarde complète de chaque mois pendant 18 mois.
    - Conserver pendant sept ans la sauvegarde complète effectuée au cours de la semaine 14 de chaque année.

    Vous devez configurer la stratégie de rétention à long terme de Claims.

    Quelle valeur devez-vous utiliser pour chaque paramètre ? Pour répondre, faites glisser les valeurs appropriées vers les paramètres correspondants. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: p8w, text: P8W }
    - { id: p8m, text: P8M }
    - { id: p18m, text: P18M }
    - { id: p7y, text: P7Y }
    - { id: p14w, text: P14W }
    - { id: n14, text: "14" }
    - { id: n18, text: "18" }
  targets:
    - { id: weekly, text: { en: "Weekly retention", fr: "Rétention hebdomadaire" } }
    - { id: monthly, text: { en: "Monthly retention", fr: "Rétention mensuelle" } }
    - { id: yearly, text: { en: "Yearly retention", fr: "Rétention annuelle" } }
    - { id: woy, text: { en: "Week of year", fr: "Semaine de l'année" } }
answer:
  mapping: { weekly: p8w, monthly: p18m, yearly: p7y, woy: n14 }
explanation:
  correct:
    en: |
      Retention periods use ISO 8601 durations: `P8W` keeps each weekly backup for eight weeks, `P18M` keeps the first backup of each month for 18 months, and `P7Y` keeps the yearly backup for seven years. The week of year is a number from 1 to 52 that selects which weekly backup becomes the yearly one, here 14.
    fr: |
      Les durées de rétention utilisent le format ISO 8601 : `P8W` conserve chaque sauvegarde hebdomadaire huit semaines, `P18M` conserve la première sauvegarde de chaque mois 18 mois, et `P7Y` conserve la sauvegarde annuelle sept ans. La semaine de l'année est un nombre de 1 à 52 qui choisit la sauvegarde hebdomadaire conservée comme sauvegarde annuelle, ici 14.
  options:
    p8m: { en: "P8M is eight months, not eight weeks.", fr: "P8M correspond à huit mois, pas à huit semaines." }
    p14w: { en: "The week of year is an integer, not a duration; P14W would be a 14-week retention.", fr: "La semaine de l'année est un entier, pas une durée ; P14W serait une rétention de 14 semaines." }
    n18: { en: "A bare number in a retention setting is interpreted as days, so 18 would mean 18 days.", fr: "Un nombre seul dans un paramètre de rétention est interprété en jours : 18 signifierait 18 jours." }
references:
  - title: Long-term retention backups - Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/long-term-retention-overview
  - title: az sql db ltr-policy
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db/ltr-policy
