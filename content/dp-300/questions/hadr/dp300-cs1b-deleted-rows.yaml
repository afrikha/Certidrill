id: dp300-cs1b-deleted-rows
objective: "5.2.4"
type: single
caseStudy: dp300-cs1b-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    The agency that uses tdb-0042 reports that bookings were deleted by mistake three hours ago. Bookings were added and modified in tdb-0042 since then. You need to meet the recovery requirements. What should you do?
  fr: |
    L'agence qui utilise tdb-0042 signale que des réservations ont été supprimées par erreur il y a trois heures. Depuis, des réservations ont été ajoutées et modifiées dans tdb-0042. Vous devez satisfaire les exigences de récupération. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Restore tdb-0042 over itself to a point in time just before the deletion.", fr: "Restaurer tdb-0042 sur elle-même à un point dans le temps juste avant la suppression." } }
    - { id: b, text: { en: "Geo-restore tdb-0042 as a new database, and then copy the deleted rows into tdb-0042.", fr: "Effectuer une géorestauration de tdb-0042 en tant que nouvelle base de données, puis copier les lignes supprimées dans tdb-0042." } }
    - { id: c, text: { en: "Restore tdb-0042 as a new database from its latest long-term retention backup, and then copy the deleted rows into tdb-0042.", fr: "Restaurer tdb-0042 en tant que nouvelle base de données à partir de sa dernière sauvegarde de rétention à long terme, puis copier les lignes supprimées dans tdb-0042." } }
    - { id: d, text: { en: "Restore tdb-0042 as a new database to a point in time just before the deletion, and then copy the deleted rows into tdb-0042.", fr: "Restaurer tdb-0042 en tant que nouvelle base de données à un point dans le temps juste avant la suppression, puis copier les lignes supprimées dans tdb-0042." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A point-in-time restore always creates a new database on the same server, here from the automated backups kept for seven days. Restoring to just before the deletion and copying only the deleted rows back into tdb-0042 recovers the data while keeping every change made since the deletion.
    fr: |
      Une restauration à un point dans le temps crée toujours une nouvelle base de données sur le même serveur, ici à partir des sauvegardes automatiques conservées sept jours. Restaurer juste avant la suppression puis recopier seulement les lignes supprimées dans tdb-0042 récupère les données tout en conservant toutes les modifications effectuées depuis la suppression.
  options:
    a: { en: "Azure SQL Database cannot restore a database over itself; even if it could, the changes made after the deletion would be lost.", fr: "Azure SQL Database ne peut pas restaurer une base de données sur elle-même ; même si c'était possible, les modifications postérieures à la suppression seraient perdues." }
    b: { en: "Geo-restore uses the most recent geo-replicated backup and cannot target a chosen point in time, so the restored copy would not contain the rows deleted three hours ago.", fr: "La géorestauration utilise la sauvegarde géorépliquée la plus récente et ne permet pas de choisir un point dans le temps : la copie restaurée ne contiendrait pas les lignes supprimées il y a trois heures." }
    c: { en: "No long-term retention policy is configured, so there is no long-term retention backup to restore.", fr: "Aucune stratégie de rétention à long terme n'est configurée : il n'existe aucune sauvegarde de rétention à long terme à restaurer." }
references:
  - title: Restore a database from a backup in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
