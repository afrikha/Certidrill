id: dp300-5c-fog-rbac-role
objective: "5.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have two Azure SQL Database logical servers named **sql-app-prod** and **sql-app-dr** in a resource group named **rg-sql**.

    A database administrator named **Admin1** must create failover groups between the two servers and initiate failovers. You need to grant Admin1 the required permissions on rg-sql. The solution must follow the principle of least privilege.

    Which role should you assign to Admin1?
  fr: |
    Vous disposez de deux serveurs logiques Azure SQL Database nommés **sql-app-prod** et **sql-app-dr** dans un groupe de ressources nommé **rg-sql**.

    Un administrateur de base de données nommé **Admin1** doit créer des groupes de basculement entre les deux serveurs et déclencher des basculements. Vous devez accorder à Admin1 les autorisations nécessaires sur rg-sql. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Admin1 ?
body:
  options:
    - { id: a, text: SQL Security Manager }
    - { id: b, text: SQL Managed Instance Contributor }
    - { id: c, text: Reader }
    - { id: d, text: SQL Server Contributor }
answer: { optionId: d }
explanation:
  correct:
    en: Creating a failover group needs write access on the primary server, the secondary server and the databases, and a failover needs write access on the failover group of the new primary server. The SQL Server Contributor built-in role grants these permissions on logical servers without granting access management or rights on other resource types.
    fr: La création d'un groupe de basculement exige un accès en écriture sur le serveur primaire, le serveur secondaire et les bases, et un basculement exige un accès en écriture sur le groupe de basculement du nouveau serveur primaire. Le rôle intégré SQL Server Contributor accorde ces autorisations sur les serveurs logiques, sans gestion des accès ni droits sur d'autres types de ressources.
  options:
    a: { en: "SQL Security Manager manages the security-related policies of servers and databases, such as auditing; it can't create or fail over failover groups.", fr: "SQL Security Manager gère les stratégies de sécurité des serveurs et des bases, comme l'audit ; il ne peut pas créer de groupe de basculement ni en déclencher le basculement." }
    b: { en: "SQL Managed Instance Contributor applies to managed instances and their instance failover groups, not to logical servers.", fr: "SQL Managed Instance Contributor s'applique aux instances managées et à leurs groupes de basculement d'instance, pas aux serveurs logiques." }
    c: { en: "Reader can view the failover groups but can't create them or initiate a failover.", fr: "Reader peut consulter les groupes de basculement, mais ne peut ni les créer ni déclencher un basculement." }
references:
  - title: Configure a Failover Group - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-configure-sql-db
