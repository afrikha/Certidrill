id: dp300-5b-url-storage-rules
objective: "5.2.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You manage SQL Server 2019 instances on Azure virtual machines. Some virtual machines run Windows Server and others run Linux. You plan to back up the databases directly to Azure Blob Storage by using `BACKUP ... TO URL`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez des instances SQL Server 2019 sur des machines virtuelles Azure. Certaines machines virtuelles exécutent Windows Server et d'autres Linux. Vous prévoyez de sauvegarder les bases de données directement dans Stockage Blob Azure avec `BACKUP ... TO URL`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can write the backups to a premium storage account to make them faster.
        fr: Vous pouvez écrire les sauvegardes dans un compte de stockage premium pour les accélérer.
    - id: s2
      text:
        en: On the Linux virtual machines, the backups must use a SAS credential and block blobs.
        fr: Sur les machines virtuelles Linux, les sauvegardes doivent utiliser des informations d'identification SAS et des objets blob de blocs.
    - id: s3
      text:
        en: Backups that use a SAS credential keep working after you disallow Shared Key authorization on the storage account.
        fr: Les sauvegardes qui utilisent des informations d'identification SAS continuent de fonctionner après la désactivation de l'autorisation par clé partagée sur le compte de stockage.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Backup to URL doesn't support premium storage. On Linux, the only supported target is block blobs with a SAS credential. If Shared Key authorization is disabled on the storage account, backup to URL fails.
    fr: |
      La sauvegarde vers une URL ne prend pas en charge le stockage premium. Sous Linux, la seule cible prise en charge est un objet blob de blocs avec des informations d'identification SAS. Si l'autorisation par clé partagée est désactivée sur le compte de stockage, la sauvegarde vers une URL échoue.
references:
  - title: SQL Server backup to URL for Azure Blob Storage
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/sql-server-backup-to-url
