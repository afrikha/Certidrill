id: dp300-5a-rpo-statements
objective: "5.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a zone-redundant Azure SQL database named **FlightsDb** on a logical server in West Europe. You plan to add FlightsDb to a failover group with a secondary server in North Europe. The business requires an RPO of five seconds and an RTO of one minute for a regional outage.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une base de données Azure SQL redondante interzone nommée **FlightsDb** sur un serveur logique dans West Europe. Vous prévoyez d'ajouter FlightsDb à un groupe de basculement avec un serveur secondaire dans North Europe. L'entreprise exige un RPO de cinq secondes et un RTO d'une minute en cas de panne régionale.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A forced failover of the failover group can lose transactions that were committed on the primary but not yet replicated to the secondary.
        fr: |
          Un basculement forcé du groupe de basculement peut perdre des transactions validées sur le primaire mais pas encore répliquées sur le secondaire.
    - id: s2
      text:
        en: |
          Because FlightsDb is zone redundant, it stays available if the whole West Europe region becomes unavailable.
        fr: |
          Comme FlightsDb est redondante interzone, elle reste disponible si toute la région West Europe devient indisponible.
    - id: s3
      text:
        en: |
          With the Microsoft-managed failover policy, Microsoft fails over the group only after a grace period of at least one hour, so this policy doesn't meet the RTO.
        fr: |
          Avec la stratégie de basculement gérée par Microsoft, Microsoft ne bascule le groupe qu'après une période de grâce d'au moins une heure : cette stratégie ne respecte donc pas le RTO.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Geo-replication is asynchronous, so a forced failover promotes the secondary without waiting for the last changes, which can be lost. Zone redundancy spreads replicas across the availability zones of one region and doesn't protect against a regional outage. The Microsoft-managed policy triggers only for a widespread regional outage after the grace period, which is at least one hour; use the customer-managed policy to meet a one-minute RTO.
    fr: |
      La géoréplication est asynchrone : un basculement forcé promeut le secondaire sans attendre les dernières modifications, qui peuvent être perdues. La redondance interzone répartit les réplicas entre les zones de disponibilité d'une seule région et ne protège pas contre une panne régionale. La stratégie gérée par Microsoft ne se déclenche qu'en cas de panne régionale étendue, après la période de grâce d'au moins une heure ; utilisez la stratégie gérée par le client pour respecter un RTO d'une minute.
references:
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
