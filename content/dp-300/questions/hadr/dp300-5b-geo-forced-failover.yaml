id: dp300-5b-geo-forced-failover
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **SalesDb** on a logical server named **srv-sales** in a resource group named **rg-data**. SalesDb is geo-replicated by active geo-replication to a logical server named **srv-sales-dr** in a resource group named **rg-dr**.

    A regional outage makes srv-sales unreachable. You need SalesDb to accept writes as soon as possible. Some data loss is acceptable.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **SalesDb** sur un serveur logique nommé **srv-sales** dans un groupe de ressources nommé **rg-data**. SalesDb est géorépliquée par géoréplication active vers un serveur logique nommé **srv-sales-dr** dans un groupe de ressources nommé **rg-dr**.

    Une panne régionale rend srv-sales inaccessible. SalesDb doit accepter les écritures le plus tôt possible. Une perte de données est acceptable.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: "az sql db replica set-primary --resource-group rg-data --server srv-sales --name SalesDb --allow-data-loss" }
    - { id: b, text: "az sql db replica set-primary --resource-group rg-dr --server srv-sales-dr --name SalesDb" }
    - { id: c, text: { en: "Geo-restore SalesDb from its geo-replicated backups to srv-sales-dr as a new database.", fr: "Géorestaurer SalesDb à partir de ses sauvegardes géorépliquées sur srv-sales-dr en tant que nouvelle base de données." } }
    - { id: d, text: "az sql db replica set-primary --resource-group rg-dr --server srv-sales-dr --name SalesDb --allow-data-loss" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `az sql db replica set-primary` runs against the secondary that must become the primary, here on srv-sales-dr in rg-dr. Because the primary is unreachable, the synchronization of a planned failover can't complete: `--allow-data-loss` forces the failover immediately, and transactions not yet replicated are lost.
    fr: |
      `az sql db replica set-primary` s'exécute sur la base secondaire qui doit devenir primaire, ici sur srv-sales-dr dans rg-dr. Comme la base primaire est inaccessible, la synchronisation d'un basculement planifié ne peut pas aboutir : `--allow-data-loss` force le basculement immédiatement, et les transactions non encore répliquées sont perdues.
  options:
    a: { en: "The command must target the server that hosts the secondary, not the unreachable primary.", fr: "La commande doit cibler le serveur qui héberge la base secondaire, pas la base primaire inaccessible." }
    b: { en: "Without --allow-data-loss, the failover waits for a full synchronization with the primary, which is unreachable.", fr: "Sans --allow-data-loss, le basculement attend une synchronisation complète avec la base primaire, qui est inaccessible." }
    c: { en: "A geo-restore creates another database from geo-replicated backups, with more data loss and a longer recovery than promoting the existing secondary.", fr: "Une géorestauration crée une autre base à partir des sauvegardes géorépliquées, avec plus de perte de données et une récupération plus longue que la promotion de la base secondaire existante." }
references:
  - title: az sql db replica
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db/replica
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
