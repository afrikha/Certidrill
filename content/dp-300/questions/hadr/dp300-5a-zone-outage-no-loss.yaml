id: dp300-5a-zone-outage-no-loss
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **srv-sales** in the West Europe region, which supports availability zones. The server hosts a General Purpose database named **SalesDb**.

    You need to ensure that SalesDb remains available without losing committed transactions if one datacenter of the region fails. The solution must minimize cost and administrative effort.

    What should you do?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **srv-sales** dans la région West Europe, qui prend en charge les zones de disponibilité. Le serveur héberge une base de données General Purpose nommée **SalesDb**.

    Vous devez faire en sorte que SalesDb reste disponible sans perte de transactions validées en cas de défaillance d'un centre de données de la région. La solution doit réduire au minimum le coût et l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a failover group with a secondary server in North Europe.", fr: "Créer un groupe de basculement avec un serveur secondaire dans North Europe." } }
    - { id: b, text: { en: "Enable zone redundancy on SalesDb.", fr: "Activer la redondance interzone sur SalesDb." } }
    - { id: c, text: { en: "Create a geo-secondary of SalesDb on another server in West Europe.", fr: "Créer un géosecondaire de SalesDb sur un autre serveur dans West Europe." } }
    - { id: d, text: { en: "Change the backup storage redundancy of SalesDb to zone-redundant.", fr: "Passer la redondance du stockage de sauvegarde de SalesDb en stockage redondant interzone." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Zone redundancy places the replicas of the General Purpose database in different availability zones of the region. If one zone fails, the database fails over automatically to another zone with zero loss of committed data, and there's no secondary database to create or manage.
    fr: |
      La redondance interzone place les réplicas de la base General Purpose dans différentes zones de disponibilité de la région. Si une zone tombe en panne, la base bascule automatiquement vers une autre zone sans perte de données validées, et il n'y a aucune base secondaire à créer ni à gérer.
  options:
    a: { en: "A failover group protects against a regional outage, but it adds a second database to pay for and to manage, which doesn't minimize cost or effort.", fr: "Un groupe de basculement protège contre une panne régionale, mais il ajoute une deuxième base à payer et à gérer, ce qui ne réduit pas le coût ni l'effort." }
    c: { en: "A geo-secondary in the same region doesn't guarantee availability zone isolation, uses asynchronous replication and requires a manual failover.", fr: "Un géosecondaire dans la même région ne garantit pas l'isolation par zone de disponibilité, utilise une réplication asynchrone et exige un basculement manuel." }
    d: { en: "Backup storage redundancy protects the backups, not the availability of the database: recovery would require a restore.", fr: "La redondance du stockage de sauvegarde protège les sauvegardes, pas la disponibilité de la base : la récupération exigerait une restauration." }
references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
