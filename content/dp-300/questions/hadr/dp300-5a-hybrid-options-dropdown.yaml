id: dp300-5a-hybrid-options-dropdown
objective: "5.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs several on-premises SQL Server 2019 Enterprise instances. The datacenter is connected to Azure by ExpressRoute. You need to recommend a hybrid disaster recovery solution for three workloads. Each solution must minimize cost and administrative effort.

    What should you recommend for each workload? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute plusieurs instances SQL Server 2019 Enterprise locales. Le centre de données est connecté à Azure par ExpressRoute. Vous devez recommander une solution de récupération d'urgence hybride pour trois charges de travail. Chaque solution doit réduire au minimum le coût et l'effort d'administration.

    Que devez-vous recommander pour chaque charge de travail ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Archive database, recovery within two days is acceptable, no standby server in Azure: [[w1]]

      Sales database, continuous replication to a PaaS service in Azure: [[w2]]

      Line-of-business server whose application components and SQL Server instance must be recovered together as a whole machine: [[w3]]
    fr: |
      Base d'archives, récupération en deux jours acceptable, aucun serveur de secours dans Azure : [[w1]]

      Base des ventes, réplication continue vers un service PaaS dans Azure : [[w2]]

      Serveur métier dont les composants applicatifs et l'instance SQL Server doivent être récupérés ensemble, comme une machine entière : [[w3]]
  slots:
    - id: w1
      options:
        - { id: url, text: { en: "Backup to URL in geo-redundant storage", fr: "Sauvegarde vers une URL dans un stockage géoredondant" } }
        - { id: link, text: { en: "Managed Instance link", fr: "Lien Managed Instance" } }
        - { id: asr, text: { en: "Azure Site Recovery", fr: "Azure Site Recovery" } }
        - { id: ls, text: { en: "Log shipping to an Azure VM", fr: "Copie des journaux de transaction vers une machine virtuelle Azure" } }
    - id: w2
      options:
        - { id: url, text: { en: "Backup to URL in geo-redundant storage", fr: "Sauvegarde vers une URL dans un stockage géoredondant" } }
        - { id: link, text: { en: "Managed Instance link", fr: "Lien Managed Instance" } }
        - { id: asr, text: { en: "Azure Site Recovery", fr: "Azure Site Recovery" } }
        - { id: ls, text: { en: "Log shipping to an Azure VM", fr: "Copie des journaux de transaction vers une machine virtuelle Azure" } }
    - id: w3
      options:
        - { id: url, text: { en: "Backup to URL in geo-redundant storage", fr: "Sauvegarde vers une URL dans un stockage géoredondant" } }
        - { id: link, text: { en: "Managed Instance link", fr: "Lien Managed Instance" } }
        - { id: asr, text: { en: "Azure Site Recovery", fr: "Azure Site Recovery" } }
        - { id: ls, text: { en: "Log shipping to an Azure VM", fr: "Copie des journaux de transaction vers une machine virtuelle Azure" } }
answer:
  values: { w1: url, w2: link, w3: asr }
explanation:
  correct:
    en: |
      Backing up directly to Azure Blob Storage is the cheapest cold standby: nothing runs in Azure until you restore. The Managed Instance link replicates a SQL Server 2016 or later database in near real time to SQL Managed Instance, a PaaS service. Azure Site Recovery replicates the entire server, so the application components and SQL Server are recovered together.
    fr: |
      La sauvegarde directe vers Stockage Blob Azure est le secours à froid le moins cher : rien ne s'exécute dans Azure avant la restauration. Le lien Managed Instance réplique en temps quasi réel une base SQL Server 2016 ou ultérieure vers SQL Managed Instance, un service PaaS. Azure Site Recovery réplique le serveur entier : les composants applicatifs et SQL Server sont récupérés ensemble.
  options:
    ls: { en: "Log shipping needs a running SQL Server VM in Azure and only protects databases, not the other components of the server.", fr: "La copie des journaux de transaction exige une machine virtuelle SQL Server active dans Azure et ne protège que les bases, pas les autres composants du serveur." }
references:
  - title: Business continuity and HADR for SQL Server on Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/business-continuity-high-availability-disaster-recovery-hadr-overview
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
