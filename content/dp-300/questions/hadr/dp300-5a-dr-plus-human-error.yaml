id: dp300-5a-dr-plus-human-error
objective: "5.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has an Azure SQL database named **LedgerDb** in the Business Critical service tier on a logical server named **srv-ledger-weu** in West Europe. LedgerDb uses the default point-in-time restore retention.

    You need to recommend a business continuity solution that meets the following requirements:

    - If West Europe becomes unavailable, the applications must reconnect within one minute without changing their connection strings.
    - The database must be recoverable as it was at any point in time during the last 21 days.
    - Costs must be minimized.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'une base de données Azure SQL nommée **LedgerDb** dans le niveau de service Business Critical, sur un serveur logique nommé **srv-ledger-weu** dans West Europe. LedgerDb utilise la rétention de restauration à un point dans le temps par défaut.

    Vous devez recommander une solution de continuité d'activité qui satisfait les exigences suivantes :

    - Si West Europe devient indisponible, les applications doivent se reconnecter en moins d'une minute sans modifier leurs chaînes de connexion.
    - La base doit pouvoir être récupérée telle qu'elle était à n'importe quel moment des 21 derniers jours.
    - Les coûts doivent être réduits au minimum.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure active geo-replication of LedgerDb to a server in North Europe.", fr: "Configurer la géoréplication active de LedgerDb vers un serveur dans North Europe." } }
    - { id: b, text: { en: "Create a failover group that contains LedgerDb, with a secondary server in North Europe.", fr: "Créer un groupe de basculement qui contient LedgerDb, avec un serveur secondaire dans North Europe." } }
    - { id: c, text: { en: "Configure a long-term retention policy that keeps weekly backups for three weeks.", fr: "Configurer une stratégie de rétention à long terme qui conserve les sauvegardes hebdomadaires pendant trois semaines." } }
    - { id: d, text: { en: "Set the point-in-time restore retention of LedgerDb to 21 days.", fr: "Définir la rétention de restauration à un point dans le temps de LedgerDb sur 21 jours." } }
    - { id: e, text: { en: "Enable zone redundancy on LedgerDb.", fr: "Activer la redondance interzone sur LedgerDb." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A failover group fails over to the North Europe secondary in typically less than a minute, and its read-write listener keeps the same connection string. The default PITR retention is 7 days; setting it to 21 days allows a restore to any point in the last 21 days, and replicas can't do this because they copy mistakes within seconds.
    fr: |
      Un groupe de basculement bascule vers le secondaire de North Europe généralement en moins d'une minute, et son écouteur en lecture-écriture conserve la même chaîne de connexion. La rétention PITR par défaut est de 7 jours ; la définir sur 21 jours permet une restauration à n'importe quel moment des 21 derniers jours, ce que les réplicas ne permettent pas, car ils copient les erreurs en quelques secondes.
  options:
    a: { en: "After a geo-replication failover, the new primary is on another server, so the connection strings must change.", fr: "Après un basculement de géoréplication, le nouveau primaire est sur un autre serveur : les chaînes de connexion doivent changer." }
    c: { en: "LTR keeps only full weekly backups, not every point in time between them.", fr: "La LTR ne conserve que des sauvegardes complètes hebdomadaires, pas chaque point dans le temps entre elles." }
    e: { en: "Zone redundancy protects against an availability zone failure, not against the loss of the whole region.", fr: "La redondance interzone protège contre la panne d'une zone de disponibilité, pas contre la perte de toute la région." }
references:
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
