id: dp300-5b-ag-mi-link-facts
objective: "5.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an on-premises SQL Server 2019 Enterprise instance that hosts a database named **Inventory**, and an Azure SQL managed instance named **MI1**. The networks are connected by a site-to-site VPN. You plan to replicate Inventory to MI1 by using the Managed Instance link.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance SQL Server 2019 Enterprise locale qui héberge une base de données nommée **Inventory**, et d'une instance managée Azure SQL nommée **MI1**. Les réseaux sont reliés par un VPN site à site. Vous prévoyez de répliquer Inventory vers MI1 avec le lien Managed Instance.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The link replicates Inventory by using a distributed availability group between SQL Server and MI1.
        fr: Le lien réplique Inventory au moyen d'un groupe de disponibilité distribué entre SQL Server et MI1.
    - id: s2
      text:
        en: After a failover to MI1, you can fail back to the SQL Server 2019 instance through the same link.
        fr: Après un basculement vers MI1, vous pouvez revenir à l'instance SQL Server 2019 par le même lien.
    - id: s3
      text:
        en: The link also replicates the logins and the SQL Server Agent jobs that Inventory uses.
        fr: Le lien réplique aussi les connexions et les travaux SQL Server Agent qu'utilise Inventory.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The Managed Instance link is built on distributed availability groups, with certificate-based trust between SQL Server and the instance. With SQL Server 2016 to 2019, replication and failover go one way only, to SQL Managed Instance; failback through the link requires SQL Server 2022 or 2025. Only user databases are replicated: logins, Agent jobs and other server-level objects must be recreated on MI1.
    fr: |
      Le lien Managed Instance repose sur des groupes de disponibilité distribués, avec une approbation par certificats entre SQL Server et l'instance. Avec SQL Server 2016 à 2019, la réplication et le basculement se font dans un seul sens, vers SQL Managed Instance ; le retour par le lien exige SQL Server 2022 ou 2025. Seules les bases de données utilisateur sont répliquées : les connexions, les travaux Agent et les autres objets au niveau du serveur doivent être recréés sur MI1.
references:
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
