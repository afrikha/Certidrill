id: dp300-cs4b-backup-options
objective: "5.2.1"
type: yesno_statements
caseStudy: dp300-cs4b-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You review the backup and restore options of TicketsDB.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les options de sauvegarde et de restauration de TicketsDB.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can make TicketsDB available for geo-restore by updating its backup storage redundancy to geo-redundant.
        fr: |
          Vous pouvez rendre TicketsDB disponible pour la géorestauration en modifiant la redondance de son stockage de sauvegarde en géoredondant.
    - id: s2
      text:
        en: |
          A point-in-time restore of TicketsDB to sql-rc-prod that keeps the same backup storage redundancy completes in minutes, whatever the size of TicketsDB.
        fr: |
          Une restauration à un point dans le temps de TicketsDB vers sql-rc-prod qui conserve la même redondance du stockage de sauvegarde se termine en quelques minutes, quelle que soit la taille de TicketsDB.
    - id: s3
      text:
        en: |
          You can meet the audit requirement for weekly backups by configuring a long-term retention policy on TicketsDB.
        fr: |
          Vous pouvez satisfaire l'exigence d'audit relative aux sauvegardes hebdomadaires en configurant une stratégie de rétention à long terme sur TicketsDB.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The backup storage redundancy of a Hyperscale database can be set only when the database is created; to change it, you use active geo-replication or a database copy. A same-region Hyperscale restore uses storage snapshots, so it finishes in minutes even for multi-terabyte databases, unless the restore changes the storage or zone redundancy. Long-term retention is supported for Hyperscale and can keep weekly backups for up to 10 years.
    fr: |
      La redondance du stockage de sauvegarde d'une base de données Hyperscale ne peut être définie qu'à sa création ; pour la modifier, vous utilisez la géoréplication active ou une copie de base de données. Une restauration Hyperscale dans la même région utilise des instantanés de stockage : elle se termine en quelques minutes, même pour des bases de plusieurs téraoctets, sauf si la restauration modifie la redondance du stockage ou la redondance interzone. La rétention à long terme est prise en charge pour Hyperscale et peut conserver des sauvegardes hebdomadaires jusqu'à 10 ans.
  options:
    s1: { en: "Backup storage redundancy can't be modified after a Hyperscale database is provisioned.", fr: "La redondance du stockage de sauvegarde ne peut pas être modifiée après l'approvisionnement d'une base de données Hyperscale." }
references:
  - title: Automated backups for Hyperscale databases - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/hyperscale-automated-backups-overview
