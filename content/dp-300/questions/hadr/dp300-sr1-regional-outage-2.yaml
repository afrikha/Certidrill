id: dp300-sr1-regional-outage-2
objective: "5.1.3"
type: series_yesno
series: dp300-sr1-regional-outage
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You create a failover group with the customer managed failover policy.
  fr: |
    Vous créez un groupe de basculement avec la stratégie de basculement gérée par le client.
body:
  solution:
    en: |
      You create a logical server named **sql-litware-neu** in North Europe. You create a failover group named **fog-litware** between sql-litware-weu and sql-litware-neu that uses the **customer managed** failover policy, and you add the three databases to it. The application connects to `fog-litware.database.windows.net`.
    fr: |
      Vous créez un serveur logique nommé **sql-litware-neu** dans la région Europe Nord. Vous créez un groupe de basculement nommé **fog-litware** entre sql-litware-weu et sql-litware-neu qui utilise la stratégie de basculement **gérée par le client**, et vous y ajoutez les trois bases. L'application se connecte à `fog-litware.database.windows.net`.
answer: { value: true }
explanation:
  correct:
    en: |
      A failover group replicates its databases to a server in another region and fails them over together. With the customer managed policy, failover happens only when the team starts it. The read-write listener `fog-litware.database.windows.net` always points to the current primary, so connection strings don't change after a failover.
    fr: |
      Un groupe de basculement réplique ses bases vers un serveur d'une autre région et les bascule ensemble. Avec la stratégie gérée par le client, le basculement n'a lieu que lorsque l'équipe le lance. L'écouteur en lecture-écriture `fog-litware.database.windows.net` pointe toujours vers le primaire actuel : les chaînes de connexion ne changent pas après un basculement.
references:
  - title: Failover groups overview & best practices (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
