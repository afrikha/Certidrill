id: dp300-5b-geo-scale-order
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **Orders** that uses the General Purpose service tier with 4 vCores. Orders has one geo-secondary with the same configuration, created by using active geo-replication.

    You need to scale Orders and its geo-secondary to 8 vCores. The solution must prevent the geo-secondary from lagging behind and the primary log rate from being throttled during the change.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Orders** qui utilise le niveau de service General Purpose avec 4 vCores. Orders possède une base secondaire géographique de même configuration, créée par géoréplication active.

    Vous devez faire passer Orders et sa base secondaire à 8 vCores. La solution doit empêcher la base secondaire de prendre du retard et éviter la limitation du débit du journal de la base primaire pendant la modification.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Scale the primary to 8 vCores, and then scale the geo-secondary to 8 vCores.", fr: "Faire passer la base primaire à 8 vCores, puis la base secondaire à 8 vCores." } }
    - { id: b, text: { en: "Scale the geo-secondary to 8 vCores, and then scale the primary to 8 vCores.", fr: "Faire passer la base secondaire à 8 vCores, puis la base primaire à 8 vCores." } }
    - { id: c, text: { en: "Remove the geo-secondary, scale the primary to 8 vCores, and then re-create the geo-secondary.", fr: "Supprimer la base secondaire, faire passer la base primaire à 8 vCores, puis recréer la base secondaire." } }
    - { id: d, text: { en: "Scale only the primary to 8 vCores; the geo-secondary is scaled automatically.", fr: "Faire passer uniquement la base primaire à 8 vCores ; la base secondaire est mise à l'échelle automatiquement." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When you scale up, you scale the geo-secondary first and then the primary; when you scale down, you do the reverse. A geo-secondary smaller than the primary can fall behind, and geo-replication then throttles the primary's log rate. Both databases stay connected during the operation.
    fr: |
      Pour augmenter la taille, vous mettez d'abord à l'échelle la base secondaire, puis la base primaire ; pour la réduire, vous faites l'inverse. Une base secondaire plus petite que la primaire peut prendre du retard, et la géoréplication limite alors le débit du journal de la base primaire. Les deux bases restent connectées pendant l'opération.
  options:
    a: { en: "With this order, the secondary is smaller than the primary for a while, which can cause lag and log rate throttling.", fr: "Dans cet ordre, la base secondaire est un temps plus petite que la primaire, ce qui peut entraîner du retard et une limitation du débit du journal." }
    c: { en: "Removing the link leaves the database unprotected and forces a full reseeding; scaling doesn't require it.", fr: "Supprimer le lien laisse la base sans protection et impose un réamorçage complet ; la mise à l'échelle ne l'exige pas." }
    d: { en: "Each geo-secondary is scaled independently; its compute size doesn't follow the primary.", fr: "Chaque base secondaire se met à l'échelle indépendamment ; sa taille de calcul ne suit pas celle de la primaire." }
references:
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
