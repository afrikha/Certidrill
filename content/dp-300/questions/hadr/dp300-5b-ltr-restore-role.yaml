id: dp300-5b-ltr-restore-role
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **srv-fin** in a resource group named **rg-fin**. The databases on srv-fin have long-term retention policies.

    Members of an operations group must be able to view the available long-term retention backups and restore them to new databases on srv-fin. They must not be able to delete long-term retention backups.

    Which built-in role should you assign to the group on rg-fin? The solution must follow the principle of least privilege.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **srv-fin** dans un groupe de ressources nommé **rg-fin**. Les bases de données de srv-fin ont des stratégies de rétention à long terme.

    Les membres d'un groupe d'exploitation doivent pouvoir consulter les sauvegardes de rétention à long terme disponibles et les restaurer dans de nouvelles bases de données sur srv-fin. Ils ne doivent pas pouvoir supprimer de sauvegardes de rétention à long terme.

    Quel rôle intégré devez-vous attribuer au groupe sur rg-fin ? La solution doit respecter le principe du moindre privilège.
body:
  options:
    - { id: a, text: Contributor }
    - { id: b, text: Reader }
    - { id: c, text: Owner }
    - { id: d, text: SQL Server Contributor }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SQL Server Contributor can view and restore long-term retention backups but can't delete them; deletion requires Owner, Contributor or a custom role with the `longTermRetentionBackups/delete` permission. It is also limited to SQL servers and databases, so it is the least privileged built-in role that meets the requirements.
    fr: |
      SQL Server Contributor peut consulter et restaurer les sauvegardes de rétention à long terme, mais pas les supprimer ; la suppression exige Owner, Contributor ou un rôle personnalisé disposant de l'autorisation `longTermRetentionBackups/delete`. Ce rôle est en outre limité aux serveurs et bases de données SQL : c'est le rôle intégré le moins privilégié qui satisfait les exigences.
  options:
    a: { en: "Contributor can restore, but it can also delete LTR backups and manages every resource type in rg-fin.", fr: "Contributor peut restaurer, mais il peut aussi supprimer les sauvegardes LTR et gère tous les types de ressources de rg-fin." }
    b: { en: "Reader can view resources but can't restore a backup, which creates a database.", fr: "Reader peut consulter les ressources, mais pas restaurer une sauvegarde, ce qui crée une base de données." }
    c: { en: "Owner can delete LTR backups and also manage access, far more than required.", fr: "Owner peut supprimer les sauvegardes LTR et gérer les accès, bien plus que nécessaire." }
references:
  - title: Manage Azure SQL Database long-term backup retention
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/long-term-backup-retention-configure
