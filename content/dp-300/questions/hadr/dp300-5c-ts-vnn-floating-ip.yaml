id: dp300-5c-ts-vnn-floating-ip
objective: "5.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Always On availability group on two Azure virtual machines in a single subnet. Clients connect through a virtual network name (VNN) listener on port 1433, behind an internal Standard Azure Load Balancer.

    The listener IP address resource of the cluster uses ProbePort 59999, and the load balancer health probe on TCP port 59999 reports the primary replica as healthy. The load-balancing rule uses frontend port 1433 and backend port 1433, with Floating IP disabled.

    Clients can connect directly to the primary replica, but connections to the listener time out. What should you do?
  fr: |
    Vous disposez d'un groupe de disponibilité Always On sur deux machines virtuelles Azure dans un seul sous-réseau. Les clients se connectent par un écouteur de nom de réseau virtuel (VNN) sur le port 1433, derrière un équilibreur de charge Azure Standard interne.

    La ressource d'adresse IP de l'écouteur dans le cluster utilise ProbePort 59999, et la sonde d'intégrité de l'équilibreur de charge sur le port TCP 59999 indique que le réplica primaire est sain. La règle d'équilibrage de charge utilise le port frontal 1433 et le port principal 1433, avec l'option IP flottante désactivée.

    Les clients peuvent se connecter directement au réplica primaire, mais les connexions à l'écouteur expirent. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a port exclusion for port 59999 on each virtual machine.", fr: "Ajouter une exclusion de port pour le port 59999 sur chaque machine virtuelle." } }
    - { id: b, text: { en: "Enable Floating IP (direct server return) on the load-balancing rule.", fr: "Activer l'IP flottante (retour direct du serveur) sur la règle d'équilibrage de charge." } }
    - { id: c, text: { en: "Increase the lease timeout of the availability group to 40 seconds.", fr: "Augmenter le délai de bail du groupe de disponibilité à 40 secondes." } }
    - { id: d, text: { en: "Change the backend port of the load-balancing rule to 5022.", fr: "Remplacer le port principal de la règle d'équilibrage de charge par 5022." } }
answer: { optionId: b }
explanation:
  correct:
    en: The listener IP address is configured on the cluster node, so the load balancer must forward packets with the frontend IP unchanged. That requires Floating IP (direct server return) on the load-balancing rule, with the backend port equal to the frontend port.
    fr: L'adresse IP de l'écouteur est configurée sur le nœud du cluster ; l'équilibreur de charge doit donc transmettre les paquets sans changer l'adresse IP frontale. Cela exige l'IP flottante (retour direct du serveur) sur la règle d'équilibrage de charge, avec un port principal égal au port frontal.
  options:
    a: { en: "A port exclusion prevents another process from taking the probe port; the probe already reports the primary as healthy.", fr: "Une exclusion de port empêche un autre processus de prendre le port de la sonde ; la sonde indique déjà que le primaire est sain." }
    c: { en: "The lease timeout reduces false failovers; it has no effect on listener connectivity.", fr: "Le délai de bail réduit les faux basculements ; il n'a aucun effet sur la connectivité de l'écouteur." }
    d: { en: "Port 5022 is the database mirroring endpoint used between replicas, not the SQL Server port that clients use.", fr: "Le port 5022 est celui du point de terminaison de mise en miroir utilisé entre les réplicas, pas le port SQL Server utilisé par les clients." }
references:
  - title: Configure an Azure Load Balancer for an AG VNN Listener - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-vnn-azure-load-balancer-configure
