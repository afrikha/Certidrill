id: dp300-5a-two-cluster-dag
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an availability group named **ag-onprem** on a Windows Server failover cluster in its on-premises Active Directory domain. The replicas run SQL Server 2022 Enterprise.

    You plan to deploy SQL Server 2022 Enterprise on two Azure virtual machines for disaster recovery. The Azure VMs will form their own Windows Server failover cluster in a different Active Directory domain. The on-premises cluster must not be extended to Azure.

    You need to replicate the databases of ag-onprem to the Azure VMs.

    What should you configure?
  fr: |
    Proseware dispose d'un groupe de disponibilité nommé **ag-onprem** sur un cluster de basculement Windows Server de son domaine Active Directory local. Les réplicas exécutent SQL Server 2022 Enterprise.

    Vous prévoyez de déployer SQL Server 2022 Enterprise sur deux machines virtuelles Azure pour la récupération d'urgence. Les machines virtuelles Azure formeront leur propre cluster de basculement Windows Server, dans un autre domaine Active Directory. Le cluster local ne doit pas être étendu à Azure.

    Vous devez répliquer les bases de données de ag-onprem vers les machines virtuelles Azure.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Add the Azure VMs as nodes of the on-premises cluster, and then add them as replicas of ag-onprem.", fr: "Ajouter les machines virtuelles Azure comme nœuds du cluster local, puis les ajouter comme réplicas de ag-onprem." } }
    - { id: b, text: { en: "A failover cluster instance that uses Azure shared disks on the two Azure VMs", fr: "Une instance de cluster de basculement qui utilise des disques partagés Azure sur les deux machines virtuelles Azure" } }
    - { id: c, text: { en: "An availability group on the Azure cluster, and a distributed availability group that spans both availability groups", fr: "Un groupe de disponibilité sur le cluster Azure, et un groupe de disponibilité distribué qui englobe les deux groupes de disponibilité" } }
    - { id: d, text: { en: "A Managed Instance link from the primary replica of ag-onprem", fr: "Un lien Managed Instance à partir du réplica principal de ag-onprem" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A distributed availability group spans two separate availability groups, each on its own cluster, and the clusters don't have to share a domain; they only need to communicate. It's the usual design for disaster recovery between sites, with asynchronous data movement and a manual failover.
    fr: |
      Un groupe de disponibilité distribué englobe deux groupes de disponibilité distincts, chacun sur son propre cluster, et les clusters n'ont pas besoin de partager un domaine ; ils doivent seulement pouvoir communiquer. C'est la conception habituelle pour la récupération d'urgence entre sites, avec un déplacement des données asynchrone et un basculement manuel.
  options:
    a: { en: "Adding the Azure VMs to the on-premises cluster extends that cluster to Azure, which the requirements forbid.", fr: "Ajouter les machines virtuelles Azure au cluster local étend ce cluster à Azure, ce que les exigences interdisent." }
    b: { en: "A failover cluster instance protects one instance with shared storage; it doesn't replicate the databases from the on-premises availability group.", fr: "Une instance de cluster de basculement protège une instance avec un stockage partagé ; elle ne réplique pas les bases du groupe de disponibilité local." }
    d: { en: "The Managed Instance link replicates to Azure SQL Managed Instance, not to SQL Server on Azure VMs.", fr: "Le lien Managed Instance réplique vers Azure SQL Managed Instance, pas vers SQL Server sur des machines virtuelles Azure." }
references:
  - title: Distributed availability groups
    url: https://learn.microsoft.com/en-us/sql/database-engine/availability-groups/windows/distributed-availability-groups
