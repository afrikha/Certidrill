id: dp300-5c-fog-mi-prereqs
objective: "5.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1** in West Europe. MI1 uses the Business Critical service tier with 16 vCores and hosts five user databases.

    You plan to deploy a managed instance named **MI2** in North Europe and to create a failover group between MI1 and MI2. The virtual networks of MI1 and MI2 will have non-overlapping address spaces and will be connected by global virtual network peering.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1** dans la région West Europe. MI1 utilise le niveau de service Business Critical avec 16 vCores et héberge cinq bases de données utilisateur.

    Vous prévoyez de déployer une instance managée nommée **MI2** dans la région North Europe et de créer un groupe de basculement entre MI1 et MI2. Les réseaux virtuels de MI1 et MI2 auront des espaces d'adressage qui ne se chevauchent pas et seront reliés par un peering de réseaux virtuels mondial.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "When you create MI2, select MI1 as the primary managed instance so that MI2 uses the DNS zone of MI1.", fr: "Lors de la création de MI2, sélectionner MI1 comme instance managée primaire afin que MI2 utilise la zone DNS de MI1." } }
    - { id: b, text: { en: "Enable the public endpoint on MI1 and MI2 so that the failover group listeners can be reached.", fr: "Activer le point de terminaison public sur MI1 et MI2 afin que les écouteurs du groupe de basculement soient accessibles." } }
    - { id: c, text: { en: "Restore a full backup of each user database of MI1 on MI2 before you create the failover group.", fr: "Restaurer sur MI2 une sauvegarde complète de chaque base utilisateur de MI1 avant de créer le groupe de basculement." } }
    - { id: d, text: { en: "In the network security groups of both subnets, allow inbound and outbound TCP on port 5022 and the range 11000-11999.", fr: "Dans les groupes de sécurité réseau des deux sous-réseaux, autoriser le trafic TCP entrant et sortant sur le port 5022 et la plage 11000-11999." } }
    - { id: e, text: { en: "Deploy MI2 in the General Purpose service tier with 16 vCores to reduce the cost of the secondary.", fr: "Déployer MI2 dans le niveau de service General Purpose avec 16 vCores pour réduire le coût du secondaire." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Both instances of a failover group must share the same DNS zone, which can only be set when MI2 is created (Primary Managed Instance in the portal, DNSZonePartner in PowerShell). Geo-replication between the instances uses TCP port 5022 and the range 11000-11999, which must be allowed inbound and outbound in the NSGs of both subnets.
    fr: "Les deux instances d'un groupe de basculement doivent partager la même zone DNS, qui ne peut être définie qu'à la création de MI2 (Primary Managed Instance dans le portail, DNSZonePartner dans PowerShell). La géoréplication entre les instances utilise le port TCP 5022 et la plage 11000-11999, qui doivent être autorisés en entrée et en sortie dans les groupes de sécurité réseau des deux sous-réseaux."
  options:
    b: { en: "The failover group listeners aren't reachable through the public endpoint; replication uses the private network.", fr: "Les écouteurs du groupe de basculement ne sont pas accessibles par le point de terminaison public ; la réplication utilise le réseau privé." }
    c: { en: "The secondary instance must be empty: the failover group seeds the databases itself.", fr: "L'instance secondaire doit être vide : le groupe de basculement amorce lui-même les bases." }
    e: { en: "The secondary should have the same service tier, compute size and storage size as the primary to support the workload after a failover.", fr: "Le secondaire doit avoir le même niveau de service, la même taille de calcul et la même taille de stockage que le primaire pour supporter la charge après un basculement." }
references:
