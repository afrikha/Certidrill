id: dp300-sr2-standard-reporting-copy-3
objective: "5.3.5"
type: series_yesno
series: dp300-sr2-standard-reporting-copy
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |
    You configure log shipping and restore in no recovery mode.
  fr: |
    Vous configurez la copie des journaux de transaction avec restauration en mode sans récupération.
body:
  solution:
    en: |
      You configure log shipping from SQL1 to VM1. The backup, copy and restore jobs run every **5 minutes**. The restore job restores the log backups in **no recovery mode**.
    fr: |
      Vous configurez la copie des journaux de transaction de SQL1 vers VM1. Les travaux de sauvegarde, de copie et de restauration s'exécutent toutes les **5 minutes**. Le travail de restauration restaure les sauvegardes de journal en **mode sans récupération (No recovery)**.
answer: { value: false }
explanation:
  correct:
    en: |
      In no recovery mode, the secondary database stays in the restoring state and is not accessible to users. The copy meets the data-loss requirement, but the analysts cannot run reporting queries against it.
    fr: |
      En mode sans récupération, la base secondaire reste à l'état de restauration et n'est pas accessible aux utilisateurs. La copie respecte l'exigence de perte de données, mais les analystes ne peuvent pas y exécuter de requêtes de reporting.
references:
  - title: "About log shipping (SQL Server)"
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/about-log-shipping-sql-server
