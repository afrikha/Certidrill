id: dp300-5b-ag-legacy-client-dns
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Always On availability group named **AG1** on two SQL Server 2022 instances on Azure virtual machines in different subnets. AG1 was created by using SSMS and has a listener named **ag1-listener** with one IP address in each subnet. Applications that set `MultiSubnetFailover=True` reconnect within seconds after a failover.

    A legacy application uses a client library that doesn't support `MultiSubnetFailover`. After each failover, the application keeps trying the old IP address and needs a long time to reconnect. You can't change the application.

    You need to minimize the reconnection time of the legacy application after a failover.

    What should you do?
  fr: |
    Vous disposez d'un groupe de disponibilité Always On nommé **AG1** sur deux instances SQL Server 2022 hébergées sur des machines virtuelles Azure situées dans des sous-réseaux différents. AG1 a été créé avec SSMS et possède un écouteur nommé **ag1-listener** avec une adresse IP dans chaque sous-réseau. Les applications qui définissent `MultiSubnetFailover=True` se reconnectent en quelques secondes après un basculement.

    Une application ancienne utilise une bibliothèque cliente qui ne prend pas en charge `MultiSubnetFailover`. Après chaque basculement, l'application continue d'essayer l'ancienne adresse IP et met longtemps à se reconnecter. Vous ne pouvez pas modifier l'application.

    Vous devez minimiser le temps de reconnexion de l'application ancienne après un basculement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set RegisterAllProvidersIP to 0 and HostRecordTTL to 300 on the network name resource of ag1-listener.", fr: "Définir RegisterAllProvidersIP sur 0 et HostRecordTTL sur 300 sur la ressource de nom réseau de ag1-listener." } }
    - { id: b, text: { en: "Set RegisterAllProvidersIP to 1 and HostRecordTTL to 1200 on the network name resource of ag1-listener.", fr: "Définir RegisterAllProvidersIP sur 1 et HostRecordTTL sur 1200 sur la ressource de nom réseau de ag1-listener." } }
    - { id: c, text: { en: "Create an internal load balancer with floating IP enabled, and move the listener IP addresses to it.", fr: "Créer un équilibreur de charge interne avec l'adresse IP flottante activée, et y déplacer les adresses IP de l'écouteur." } }
    - { id: d, text: { en: "Change the secondary replica to asynchronous commit so that failovers complete faster.", fr: "Passer le réplica secondaire en validation asynchrone pour que les basculements soient plus rapides." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When an availability group is created with SSMS, T-SQL or PowerShell, RegisterAllProvidersIP is 1: DNS returns every listener IP address, and only clients that use `MultiSubnetFailover` try them all in parallel. With RegisterAllProvidersIP set to 0, DNS returns only the active IP address, and a lower HostRecordTTL (300 seconds) makes clients refresh the record sooner after a failover, at the cost of more DNS traffic.
    fr: |
      Quand un groupe de disponibilité est créé avec SSMS, T-SQL ou PowerShell, RegisterAllProvidersIP vaut 1 : le DNS renvoie toutes les adresses IP de l'écouteur, et seuls les clients qui utilisent `MultiSubnetFailover` les essaient toutes en parallèle. Avec RegisterAllProvidersIP défini sur 0, le DNS ne renvoie que l'adresse IP active, et une valeur HostRecordTTL plus faible (300 secondes) fait actualiser l'enregistrement plus tôt après un basculement, au prix d'un trafic DNS accru.
  options:
    b: { en: "RegisterAllProvidersIP is already 1 for this listener, and a longer TTL makes clients keep the old address even longer.", fr: "RegisterAllProvidersIP vaut déjà 1 pour cet écouteur, et une durée de vie plus longue fait conserver l'ancienne adresse encore plus longtemps." }
    c: { en: "A load balancer is the connectivity option for a single-subnet VNN listener; it doesn't apply to replicas in different subnets.", fr: "Un équilibreur de charge est l'option de connectivité d'un écouteur VNN dans un seul sous-réseau ; il ne s'applique pas à des réplicas situés dans des sous-réseaux différents." }
    d: { en: "The commit mode doesn't change how the client resolves the listener name, and asynchronous commit removes automatic failover.", fr: "Le mode de validation ne change pas la façon dont le client résout le nom de l'écouteur, et la validation asynchrone supprime le basculement automatique." }
references:
  - title: "Tutorial: Configure an availability group in multiple subnets (SQL Server on Azure VMs)"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-manually-configure-tutorial-multi-subnet
