id: dp300-5b-pitr-backup-chain
objective: "5.2.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine. A database named **Ledger** uses the FULL recovery model. The following table shows the backups of Ledger.

    You need to restore Ledger to its state on Tuesday, November 10, 2026, at 10:24 by restoring the minimum number of backups. You will restore the full backup first, then a differential backup, then log backups, the last one `WITH STOPAT`.

    Answer each prompt by selecting the backup in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure. Une base de données nommée **Ledger** utilise le mode de récupération FULL. Le tableau suivant présente les sauvegardes de Ledger.

    Vous devez restaurer Ledger dans l'état où elle se trouvait le mardi 10 novembre 2026 à 10:24 en restaurant le nombre minimal de sauvegardes. Vous restaurerez d'abord la sauvegarde complète, puis une sauvegarde différentielle, puis des sauvegardes de journal, la dernière `WITH STOPAT`.

    Répondez à chaque consigne en sélectionnant la sauvegarde dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The differential backup to restore", fr: "La sauvegarde différentielle à restaurer" }
    - id: p2
      text: { en: "The log backup to restore WITH STOPAT", fr: "La sauvegarde de journal à restaurer WITH STOPAT" }
  grid:
    header: [{ en: "File", fr: "Fichier" }, { en: "Type", fr: "Type" }, { en: "Backup finished", fr: "Fin de la sauvegarde" }]
    rows:
      - [{ text: Ledger_full_1108.bak, area: f1108 }, { text: { en: "Full", fr: "Complète" } }, { text: "2026-11-08 01:00" }]
      - [{ text: Ledger_log_1108_1300.trn, area: l1108 }, { text: { en: "Log", fr: "Journal" } }, { text: "2026-11-08 13:00" }]
      - [{ text: Ledger_diff_1109.bak, area: d1109 }, { text: { en: "Differential", fr: "Différentielle" } }, { text: "2026-11-09 01:00" }]
      - [{ text: Ledger_log_1109_1300.trn, area: l1109 }, { text: { en: "Log", fr: "Journal" } }, { text: "2026-11-09 13:00" }]
      - [{ text: Ledger_diff_1110.bak, area: d1110 }, { text: { en: "Differential", fr: "Différentielle" } }, { text: "2026-11-10 01:00" }]
      - [{ text: Ledger_log_1110_0700.trn, area: l0700 }, { text: { en: "Log", fr: "Journal" } }, { text: "2026-11-10 07:00" }]
      - [{ text: Ledger_log_1110_1300.trn, area: l1300 }, { text: { en: "Log", fr: "Journal" } }, { text: "2026-11-10 13:00" }]
answer:
  values: { p1: d1110, p2: l1300 }
explanation:
  correct:
    en: |
      A differential backup contains every change since the last full backup, so only the most recent differential before the target time is needed: the one of November 10 at 01:00. The log backups taken after it are then applied in order. The 07:00 log backup ends before 10:24, so it is restored `WITH NORECOVERY`; the 13:00 log backup covers 07:00 to 13:00 and is the one restored `WITH STOPAT = '2026-11-10T10:24:00', RECOVERY`.
    fr: |
      Une sauvegarde différentielle contient toutes les modifications depuis la dernière sauvegarde complète : seule la différentielle la plus récente avant l'heure cible est nécessaire, celle du 10 novembre à 01:00. Les sauvegardes de journal effectuées après elle sont ensuite appliquées dans l'ordre. Celle de 07:00 se termine avant 10:24 et est restaurée `WITH NORECOVERY` ; celle de 13:00 couvre la période de 07:00 à 13:00 et c'est elle qui est restaurée `WITH STOPAT = '2026-11-10T10:24:00', RECOVERY`.
  options:
    d1109: { en: "The November 9 differential works but forces you to restore more log backups; the November 10 differential is more recent.", fr: "La différentielle du 9 novembre fonctionne, mais oblige à restaurer davantage de sauvegardes de journal ; celle du 10 novembre est plus récente." }
    l0700: { en: "The 07:00 log backup ends before 10:24: it doesn't contain the target time.", fr: "La sauvegarde de journal de 07:00 se termine avant 10:24 : elle ne contient pas l'heure cible." }
references:
  - title: RESTORE Statements - Arguments (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-arguments-transact-sql
