id: dp300-5b-url-mi-service-tde
objective: "5.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1** that hosts a database named **Finance**. Finance is encrypted by using transparent data encryption (TDE) with a service-managed key. MI1 has a valid SAS credential for a container named **exports**.

    You run the following statement, and it fails:

    ```sql
    BACKUP DATABASE Finance
    TO URL = N'https://stproseware.blob.core.windows.net/exports/Finance.bak'
    WITH COPY_ONLY, COMPRESSION;
    ```

    You need to be able to create a native copy-only backup of Finance in the exports container.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1** qui héberge une base de données nommée **Finance**. Finance est chiffrée par le chiffrement transparent des données (TDE) avec une clé gérée par le service. MI1 possède des informations d'identification SAS valides pour un conteneur nommé **exports**.

    Vous exécutez l'instruction suivante, et elle échoue :

    ```sql
    BACKUP DATABASE Finance
    TO URL = N'https://stproseware.blob.core.windows.net/exports/Finance.bak'
    WITH COPY_ONLY, COMPRESSION;
    ```

    Vous devez pouvoir créer une sauvegarde native en copie seule de Finance dans le conteneur exports.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add ENCRYPTION (ALGORITHM = AES_256, SERVER CERTIFICATE = BackupCert) to the WITH clause.", fr: "Ajouter ENCRYPTION (ALGORITHM = AES_256, SERVER CERTIFICATE = BackupCert) à la clause WITH." } }
    - { id: b, text: { en: "Change the TDE protector of MI1 to a customer-managed key stored in Azure Key Vault.", fr: "Changer le protecteur TDE de MI1 en une clé gérée par le client stockée dans Azure Key Vault." } }
    - { id: c, text: { en: "Remove the COPY_ONLY option from the WITH clause.", fr: "Supprimer l'option COPY_ONLY de la clause WITH." } }
    - { id: d, text: { en: "Turn off encryption on Finance by running ALTER DATABASE Finance SET ENCRYPTION OFF.", fr: "Désactiver le chiffrement de Finance en exécutant ALTER DATABASE Finance SET ENCRYPTION OFF." } }
    - { id: e, text: { en: "Replace the SAS credential with a credential that uses the managed identity of MI1.", fr: "Remplacer les informations d'identification SAS par des informations d'identification qui utilisent l'identité managée de MI1." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A copy-only backup can't be taken of a database encrypted with service-managed TDE, because the backup would be encrypted with an internal key that can't be exported, so it could never be restored. Switching to customer-managed TDE (bring your own key) or disabling encryption on the database removes the restriction.
    fr: |
      Une sauvegarde en copie seule est impossible sur une base chiffrée par TDE avec une clé gérée par le service : la sauvegarde serait chiffrée avec une clé interne non exportable et ne pourrait jamais être restaurée. Passer à un TDE géré par le client (BYOK) ou désactiver le chiffrement de la base lève cette restriction.
  options:
    a: { en: "Backup encryption doesn't change the TDE restriction; the backup would still be protected by the internal TDE key.", fr: "Le chiffrement de la sauvegarde ne lève pas la restriction TDE ; la sauvegarde resterait protégée par la clé TDE interne." }
    c: { en: "COPY_ONLY is mandatory for user backups on SQL Managed Instance.", fr: "COPY_ONLY est obligatoire pour les sauvegardes utilisateur sur SQL Managed Instance." }
    e: { en: "The SAS credential is valid; the failure comes from service-managed TDE, not from authentication.", fr: "Les informations d'identification SAS sont valides ; l'échec vient du TDE géré par le service, pas de l'authentification." }
references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
