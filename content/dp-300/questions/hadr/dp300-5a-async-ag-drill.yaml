id: dp300-5a-async-ag-drill
objective: "5.1.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an availability group named **ag-erp** on SQL Server 2022 Enterprise:

    | Replica | Region | Availability mode | Role |
    | --- | --- | --- | --- |
    | VM1 | West Europe | Synchronous commit | Primary |
    | VM2 | West Europe | Synchronous commit | Secondary |
    | VM3 | North Europe | Asynchronous commit | Secondary |

    You need to run a disaster recovery drill that makes VM3 the primary replica without losing any data.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un groupe de disponibilité nommé **ag-erp** sur SQL Server 2022 Enterprise :

    | Réplica | Région | Mode de disponibilité | Rôle |
    | --- | --- | --- | --- |
    | VM1 | West Europe | Validation synchrone | Primaire |
    | VM2 | West Europe | Validation synchrone | Secondaire |
    | VM3 | North Europe | Validation asynchrone | Secondaire |

    Vous devez effectuer un exercice de récupération d'urgence qui fait de VM3 le réplica principal sans perdre aucune donnée.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: sync, text: { en: "On VM1, set the availability mode of the VM3 replica to SYNCHRONOUS_COMMIT.", fr: "Sur VM1, définir le mode de disponibilité du réplica VM3 sur SYNCHRONOUS_COMMIT." } }
    - { id: wait, text: { en: "Wait until the databases of VM3 are in the SYNCHRONIZED state.", fr: "Attendre que les bases de VM3 soient dans l'état SYNCHRONIZED." } }
    - { id: fail, text: { en: "On VM3, run ALTER AVAILABILITY GROUP ag-erp FAILOVER.", fr: "Sur VM3, exécuter ALTER AVAILABILITY GROUP ag-erp FAILOVER." } }
    - { id: test, text: { en: "Test the applications through the listener, and record the measured RTO.", fr: "Tester les applications par l'écouteur, puis consigner le RTO mesuré." } }
    - { id: force, text: { en: "On VM3, run ALTER AVAILABILITY GROUP ag-erp FORCE_FAILOVER_ALLOW_DATA_LOSS.", fr: "Sur VM3, exécuter ALTER AVAILABILITY GROUP ag-erp FORCE_FAILOVER_ALLOW_DATA_LOSS." } }
    - { id: onvm1, text: { en: "On VM1, run ALTER AVAILABILITY GROUP ag-erp FAILOVER.", fr: "Sur VM1, exécuter ALTER AVAILABILITY GROUP ag-erp FAILOVER." } }
    - { id: syncvm3, text: { en: "On VM3, set its own availability mode to SYNCHRONOUS_COMMIT.", fr: "Sur VM3, définir son propre mode de disponibilité sur SYNCHRONOUS_COMMIT." } }
answer:
  sequence: [ sync, wait, fail, test ]
explanation:
  correct:
    en: |
      A planned manual failover without data loss requires the primary and the target secondary in synchronous-commit mode and the target databases SYNCHRONIZED. You change the availability mode while connected to the primary (VM1), wait for synchronization, and then run ALTER AVAILABILITY GROUP ... FAILOVER on the target secondary (VM3). Finally, you validate the applications and measure the RTO.
    fr: |
      Un basculement manuel planifié sans perte de données exige que le primaire et le secondaire cible soient en mode de validation synchrone et que les bases cibles soient SYNCHRONIZED. Vous modifiez le mode de disponibilité en étant connecté au primaire (VM1), attendez la synchronisation, puis exécutez ALTER AVAILABILITY GROUP ... FAILOVER sur le secondaire cible (VM3). Enfin, vous validez les applications et mesurez le RTO.
  options:
    force: { en: "A forced failover can lose data; it's for a real disaster when the primary is unavailable.", fr: "Un basculement forcé peut perdre des données ; il est réservé à un vrai sinistre où le primaire est indisponible." }
    onvm1: { en: "A planned manual failover is run on the target secondary, not on the current primary.", fr: "Un basculement manuel planifié s'exécute sur le secondaire cible, pas sur le primaire actuel." }
    syncvm3: { en: "The availability mode of a replica is changed while connected to the instance that hosts the primary replica.", fr: "Le mode de disponibilité d'un réplica se modifie en étant connecté à l'instance qui héberge le réplica principal." }
references:
  - title: Perform a planned manual failover of an Always On availability group (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/database-engine/availability-groups/windows/perform-a-planned-manual-failover-of-an-availability-group-sql-server
  - title: Change availability mode of a replica within an Always On availability group
    url: https://learn.microsoft.com/en-us/sql/database-engine/availability-groups/windows/change-the-availability-mode-of-an-availability-replica-sql-server
