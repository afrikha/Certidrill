id: dp300-5a-encrypted-backup-order
objective: "5.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 virtual machine in Azure that hosts a database named **PatientsDb**. PatientsDb isn't encrypted, and the instance has no database master key in the master database.

    You need to create a full backup of PatientsDb on the local drive F that is encrypted with AES 256 by a certificate.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle SQL Server 2022 dans Azure qui héberge une base de données nommée **PatientsDb**. PatientsDb n'est pas chiffrée, et l'instance n'a aucune clé principale de base de données dans la base master.

    Vous devez créer sur le lecteur local F une sauvegarde complète de PatientsDb chiffrée en AES 256 par un certificat.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: dmk, text: { en: "In master, run CREATE MASTER KEY ENCRYPTION BY PASSWORD.", fr: "Dans master, exécuter CREATE MASTER KEY ENCRYPTION BY PASSWORD." } }
    - { id: cert, text: { en: "In master, run CREATE CERTIFICATE BackupCert WITH SUBJECT = 'Backup encryption'.", fr: "Dans master, exécuter CREATE CERTIFICATE BackupCert WITH SUBJECT = 'Backup encryption'." } }
    - { id: bkp, text: { en: "Run BACKUP DATABASE PatientsDb TO DISK ... WITH ENCRYPTION (ALGORITHM = AES_256, SERVER CERTIFICATE = BackupCert).", fr: "Exécuter BACKUP DATABASE PatientsDb TO DISK ... WITH ENCRYPTION (ALGORITHM = AES_256, SERVER CERTIFICATE = BackupCert)." } }
    - { id: dek, text: { en: "In PatientsDb, run CREATE DATABASE ENCRYPTION KEY.", fr: "Dans PatientsDb, exécuter CREATE DATABASE ENCRYPTION KEY." } }
    - { id: tde, text: { en: "Run ALTER DATABASE PatientsDb SET ENCRYPTION ON.", fr: "Exécuter ALTER DATABASE PatientsDb SET ENCRYPTION ON." } }
    - { id: cred, text: { en: "Run CREATE CREDENTIAL with a shared access signature.", fr: "Exécuter CREATE CREDENTIAL avec une signature d'accès partagé." } }
answer:
  sequence: [ dmk, cert, bkp ]
explanation:
  correct:
    en: |
      Backup encryption requires a database master key in master, which protects the private key of a certificate created in master. The BACKUP statement then names the algorithm and the server certificate in its ENCRYPTION option. Keep a backup of the certificate and its private key, because the backup can't be restored without them.
    fr: |
      Le chiffrement de sauvegarde exige une clé principale de base de données dans master, qui protège la clé privée d'un certificat créé dans master. L'instruction BACKUP nomme ensuite l'algorithme et le certificat de serveur dans son option ENCRYPTION. Conservez une sauvegarde du certificat et de sa clé privée, car la sauvegarde ne peut pas être restaurée sans eux.
  options:
    dek: { en: "A database encryption key is used by TDE, which encrypts the database files, not the backup file on its own.", fr: "Une clé de chiffrement de base de données sert à TDE, qui chiffre les fichiers de la base, pas le fichier de sauvegarde seul." }
    tde: { en: "Enabling TDE isn't required to encrypt a backup.", fr: "Activer TDE n'est pas nécessaire pour chiffrer une sauvegarde." }
    cred: { en: "A credential is needed only for a backup to URL, not to a local drive.", fr: "Des informations d'identification ne sont nécessaires que pour une sauvegarde vers une URL, pas vers un lecteur local." }
references:
  - title: Create an encrypted backup
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/create-an-encrypted-backup
