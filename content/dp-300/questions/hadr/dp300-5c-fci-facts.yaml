id: dp300-5c-fci-facts
objective: "5.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 failover cluster instance (FCI) named **SQLFCI1** that runs on two Azure virtual machines: **SQLVM1** in a subnet named **sn-sql1** and **SQLVM2** in a subnet named **sn-sql2**. Both subnets are in the same virtual network. SQLFCI1 stores its databases on Azure shared disks.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance de cluster de basculement (FCI) SQL Server 2022 nommée **SQLFCI1** qui s'exécute sur deux machines virtuelles Azure : **SQLVM1** dans un sous-réseau nommé **sn-sql1** et **SQLVM2** dans un sous-réseau nommé **sn-sql2**. Les deux sous-réseaux appartiennent au même réseau virtuel. SQLFCI1 stocke ses bases de données sur des disques partagés Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Clients need an Azure Load Balancer or a distributed network name (DNN) to connect to SQLFCI1.
        fr: Les clients ont besoin d'un équilibreur de charge Azure ou d'un nom de réseau distribué (DNN) pour se connecter à SQLFCI1.
    - id: s2
      text:
        en: After you register SQLVM1 and SQLVM2 with the SQL IaaS Agent extension, you can enable automated patching for SQLFCI1.
        fr: Après avoir inscrit SQLVM1 et SQLVM2 auprès de l'extension SQL IaaS Agent, vous pouvez activer la mise à jour corrective automatisée pour SQLFCI1.
    - id: s3
      text:
        en: The data files of each database of SQLFCI1 exist as a single copy, on the shared disks.
        fr: Les fichiers de données de chaque base de SQLFCI1 existent en un seul exemplaire, sur les disques partagés.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: When the cluster nodes are in different subnets of the same virtual network, the FCI uses a multi-subnet configuration and needs neither an Azure Load Balancer nor a DNN. An FCI registered with the SQL IaaS Agent extension only supports the features of basic registration, so automated backup, automated patching and Microsoft Entra authentication aren't available. An FCI has one copy of the data on shared storage; only the owner node accesses it at a given time.
    fr: Quand les nœuds du cluster sont dans des sous-réseaux différents du même réseau virtuel, la FCI utilise une configuration multisous-réseau et n'a besoin ni d'un équilibreur de charge Azure ni d'un DNN. Une FCI inscrite auprès de l'extension SQL IaaS Agent ne prend en charge que les fonctionnalités de l'inscription de base ; la sauvegarde automatisée, la mise à jour corrective automatisée et l'authentification Microsoft Entra ne sont pas disponibles. Une FCI a une seule copie des données sur le stockage partagé ; seul le nœud propriétaire y accède à un instant donné.
references:
  - title: Failover cluster instances - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/failover-cluster-instance-overview
