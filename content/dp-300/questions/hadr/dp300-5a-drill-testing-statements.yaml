id: dp300-5a-drill-testing-statements
objective: "5.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are writing the test plan for the high availability and disaster recovery solutions of Woodgrove. The plan covers an Azure SQL database named **CardsDb**, a failover group that contains CardsDb, and SQL Server VMs protected by Azure Site Recovery.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous rédigez le plan de test des solutions de haute disponibilité et de récupération d'urgence de Woodgrove. Le plan couvre une base de données Azure SQL nommée **CardsDb**, un groupe de basculement qui contient CardsDb, et des machines virtuelles SQL Server protégées par Azure Site Recovery.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A load test can call Invoke-AzSqlDatabaseFailover on CardsDb every five minutes.
        fr: |
          Un test de charge peut appeler Invoke-AzSqlDatabaseFailover sur CardsDb toutes les cinq minutes.
    - id: s2
      text:
        en: |
          A planned failover of the failover group requires the primary server to be accessible.
        fr: |
          Un basculement planifié du groupe de basculement exige que le serveur primaire soit accessible.
    - id: s3
      text:
        en: |
          An Azure Site Recovery test failover pauses replication of the VMs until you clean up the test.
        fr: |
          Un test de basculement Azure Site Recovery suspend la réplication des machines virtuelles jusqu'au nettoyage du test.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Only one user-initiated failover is allowed every 15 minutes per database or elastic pool. A planned failover synchronizes the secondary fully before switching roles, so the primary must be reachable; otherwise you need a forced failover. A Site Recovery test failover doesn't affect ongoing replication or production.
    fr: |
      Un seul basculement initié par l'utilisateur est autorisé toutes les 15 minutes par base de données ou pool élastique. Un basculement planifié synchronise entièrement le secondaire avant d'inverser les rôles : le primaire doit donc être accessible, sinon il faut un basculement forcé. Un test de basculement Site Recovery n'affecte ni la réplication en cours ni la production.
references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
  - title: Run a test failover (disaster recovery drill) to Azure
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-test-failover-to-azure
