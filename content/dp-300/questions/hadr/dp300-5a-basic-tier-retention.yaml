id: dp300-5a-basic-tier-retention
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip has an Azure SQL database named **KioskDb** in the Basic service tier. KioskDb uses 1.2 GB of storage.

    You need to ensure that KioskDb can be restored to any point in time during the last 14 days. The solution must minimize cost.

    What should you do?
  fr: |
    Wingtip dispose d'une base de données Azure SQL nommée **KioskDb** dans le niveau de service Basic. KioskDb utilise 1,2 Go de stockage.

    Vous devez faire en sorte que KioskDb puisse être restaurée à n'importe quel moment des 14 derniers jours. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the point-in-time restore retention of KioskDb to 14 days.", fr: "Définir la rétention de restauration à un point dans le temps de KioskDb sur 14 jours." } }
    - { id: b, text: { en: "Configure a long-term retention policy with a weekly retention of two weeks.", fr: "Configurer une stratégie de rétention à long terme avec une rétention hebdomadaire de deux semaines." } }
    - { id: c, text: { en: "Change the backup storage redundancy of KioskDb to geo-redundant.", fr: "Passer la redondance du stockage de sauvegarde de KioskDb en stockage géoredondant." } }
    - { id: d, text: { en: "Scale KioskDb to the Standard service tier, and then set the point-in-time restore retention to 14 days.", fr: "Faire passer KioskDb au niveau de service Standard, puis définir la rétention de restauration à un point dans le temps sur 14 jours." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The PITR retention is configurable from 1 to 35 days, except in the Basic tier, where the maximum is 7 days. Moving KioskDb to the Standard tier, the cheapest tier above Basic, allows a 14-day retention.
    fr: |
      La rétention PITR est configurable de 1 à 35 jours, sauf dans le niveau Basic, où le maximum est de 7 jours. Faire passer KioskDb au niveau Standard, le moins cher après Basic, permet une rétention de 14 jours.
  options:
    a: { en: "A Basic database can keep point-in-time restore backups for 7 days at most.", fr: "Une base Basic peut conserver les sauvegardes de restauration à un point dans le temps pendant 7 jours au plus." }
    b: { en: "LTR keeps only weekly full backups, so it doesn't allow a restore to any point in time.", fr: "La LTR ne conserve que des sauvegardes complètes hebdomadaires : elle ne permet pas une restauration à n'importe quel moment." }
    c: { en: "Backup storage redundancy changes where backups are stored, not their retention.", fr: "La redondance du stockage de sauvegarde modifie l'emplacement des sauvegardes, pas leur rétention." }
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
