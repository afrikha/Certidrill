id: dp300-cs3a-geo-lag
objective: "5.3.6"
type: single
caseStudy: dp300-cs3a-lamna-insurance
difficulty: 3
status: draft
stem:
  en: |
    The copy of PolicyDB has been created on sql-li-cae. You are writing the monitoring script required by the business continuity requirements.

    What should the script do?
  fr: |
    La copie de PolicyDB a été créée sur sql-li-cae. Vous écrivez le script de supervision exigé par les exigences de continuité d'activité.

    Que doit faire le script ?
body:
  options:
    - { id: a, text: { en: "Query sys.dm_geo_replication_link_status in the master database of sql-li-cac and read replication_lag_sec.", fr: "Interroger sys.dm_geo_replication_link_status dans la base de données master de sql-li-cac et lire replication_lag_sec." } }
    - { id: b, text: { en: "Query sys.dm_geo_replication_link_status in PolicyDB on sql-li-cae and read replication_lag_sec.", fr: "Interroger sys.dm_geo_replication_link_status dans PolicyDB sur sql-li-cae et lire replication_lag_sec." } }
    - { id: c, text: { en: "Query sys.geo_replication_links in the master database of sql-li-cac and read replication_state_desc.", fr: "Interroger sys.geo_replication_links dans la base de données master de sql-li-cac et lire replication_state_desc." } }
    - { id: d, text: { en: "Query sys.dm_geo_replication_link_status in PolicyDB on sql-li-cac and read replication_lag_sec.", fr: "Interroger sys.dm_geo_replication_link_status dans PolicyDB sur sql-li-cac et lire replication_lag_sec." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `sys.dm_geo_replication_link_status` returns one row per geo-replication link, and its `replication_lag_sec` column gives, in seconds, how far the secondary is behind. The lag columns are populated only on the primary database, and the view must be queried in the user database, so the script connects to PolicyDB on sql-li-cac and compares replication_lag_sec with 60.
    fr: |
      `sys.dm_geo_replication_link_status` renvoie une ligne par lien de géoréplication, et sa colonne `replication_lag_sec` indique, en secondes, le retard du secondaire. Les colonnes de retard ne sont renseignées que sur la base de données primaire, et la vue doit être interrogée dans la base de données utilisateur : le script se connecte donc à PolicyDB sur sql-li-cac et compare replication_lag_sec à 60.
  options:
    a: { en: "The view exists in master, but it returns an empty set there; it must be queried in the user database.", fr: "La vue existe dans master, mais elle y renvoie un ensemble vide ; elle doit être interrogée dans la base de données utilisateur." }
    b: { en: "replication_lag_sec and last_replication are available only on the primary database, not on the geo-secondary.", fr: "replication_lag_sec et last_replication ne sont disponibles que sur la base de données primaire, pas sur le géo-secondaire." }
    c: { en: "This catalog view lists the geo-replication links and their state, such as seeding or catch-up; it does not measure the lag in seconds.", fr: "Cette vue de catalogue liste les liens de géoréplication et leur état, par exemple amorçage ou rattrapage ; elle ne mesure pas le retard en secondes." }
references:
  - title: sys.dm_geo_replication_link_status (Azure SQL Database and Azure SQL Managed Instance)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-geo-replication-link-status-azure-sql-database
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
