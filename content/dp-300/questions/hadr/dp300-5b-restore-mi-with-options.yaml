id: dp300-5b-restore-mi-with-options
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. MI1 has a valid shared access signature (SAS) credential for the container `https://stfabrikambak.blob.core.windows.net/sql`. The container holds a full backup of a SQL Server 2019 database named **Billing**. MI1 doesn't contain a database named Billing.

    You run the following statement on MI1, and it fails immediately:

    ```sql
    RESTORE DATABASE Billing
    FROM URL = N'https://stfabrikambak.blob.core.windows.net/sql/Billing_full.bak'
    WITH REPLACE, STATS = 10;
    ```

    You need to restore Billing to MI1. What should you do?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. MI1 possède des informations d'identification SAS (signature d'accès partagé) valides pour le conteneur `https://stfabrikambak.blob.core.windows.net/sql`. Le conteneur contient une sauvegarde complète d'une base de données SQL Server 2019 nommée **Billing**. MI1 ne contient aucune base de données nommée Billing.

    Vous exécutez l'instruction suivante sur MI1, et elle échoue immédiatement :

    ```sql
    RESTORE DATABASE Billing
    FROM URL = N'https://stfabrikambak.blob.core.windows.net/sql/Billing_full.bak'
    WITH REPLACE, STATS = 10;
    ```

    Vous devez restaurer Billing sur MI1. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add MOVE clauses that place the data and log files in the default folders of MI1.", fr: "Ajouter des clauses MOVE qui placent les fichiers de données et journaux dans les dossiers par défaut de MI1." } }
    - { id: b, text: { en: "Recreate the credential by using the storage account access key, and add WITH CREDENTIAL.", fr: "Recréer les informations d'identification avec la clé d'accès du compte de stockage, et ajouter WITH CREDENTIAL." } }
    - { id: c, text: { en: "Remove the WITH clause, and run the RESTORE DATABASE statement again.", fr: "Supprimer la clause WITH, puis exécuter de nouveau l'instruction RESTORE DATABASE." } }
    - { id: d, text: { en: "Copy the backup file to the instance, and restore it by using FROM DISK.", fr: "Copier le fichier de sauvegarde sur l'instance, puis le restaurer avec FROM DISK." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SQL Managed Instance doesn't support any `WITH` option on `RESTORE`: statements that include options such as `REPLACE`, `STATS` or `DIFFERENTIAL` fail. Because Billing doesn't exist on MI1, `REPLACE` isn't needed, and the instance places the files itself, so a plain `RESTORE DATABASE ... FROM URL` succeeds.
    fr: |
      SQL Managed Instance ne prend en charge aucune option `WITH` sur `RESTORE` : les instructions qui contiennent des options comme `REPLACE`, `STATS` ou `DIFFERENTIAL` échouent. Billing n'existant pas sur MI1, `REPLACE` est inutile, et l'instance place elle-même les fichiers : une simple instruction `RESTORE DATABASE ... FROM URL` réussit.
  options:
    a: { en: "MOVE is also a WITH option, so the statement would still fail; the instance manages file placement.", fr: "MOVE est aussi une option WITH : l'instruction échouerait toujours ; l'instance gère l'emplacement des fichiers." }
    b: { en: "SQL Managed Instance doesn't support storage account access keys for backup and restore; it uses a SAS or a managed identity.", fr: "SQL Managed Instance ne prend pas en charge les clés d'accès du compte de stockage pour la sauvegarde et la restauration ; il utilise une SAS ou une identité managée." }
    d: { en: "FROM URL is the only restore source on SQL Managed Instance; FROM DISK isn't supported.", fr: "FROM URL est la seule source de restauration sur SQL Managed Instance ; FROM DISK n'est pas pris en charge." }
references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
  - title: "Quickstart: Restore a database to Azure SQL Managed Instance with SSMS"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/restore-sample-database-quickstart
