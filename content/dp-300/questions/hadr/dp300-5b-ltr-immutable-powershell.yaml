id: dp300-5b-ltr-immutable-powershell
objective: "5.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **GeneralLedger** on a logical server named **srv-fin** in a resource group named **rg-fin**.

    You need to configure the backups of GeneralLedger to meet the following requirements:

    - Keep the full backup taken during the first week of each year for seven years.
    - Prevent anyone from deleting those backups before they expire. This protection must be impossible to remove later.

    How should you complete the PowerShell command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **GeneralLedger** sur un serveur logique nommé **srv-fin** dans un groupe de ressources nommé **rg-fin**.

    Vous devez configurer les sauvegardes de GeneralLedger pour satisfaire les exigences suivantes :

    - Conserver pendant sept ans la sauvegarde complète effectuée au cours de la première semaine de chaque année.
    - Empêcher quiconque de supprimer ces sauvegardes avant leur expiration. Cette protection ne doit pas pouvoir être retirée ultérieurement.

    Comment devez-vous compléter la commande PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[cmd]] -ResourceGroupName "rg-fin" `
      -ServerName "srv-fin" -DatabaseName "GeneralLedger" `
      -YearlyRetention [[yr]] -WeekOfYear 1 `
      -TimeBasedImmutability Enabled -TimeBasedImmutabilityMode [[mode]]
  slots:
    - id: cmd
      options:
        - { id: ltr, text: Set-AzSqlDatabaseBackupLongTermRetentionPolicy }
        - { id: str, text: Set-AzSqlDatabaseBackupShortTermRetentionPolicy }
        - { id: upd, text: Update-AzSqlDatabaseLongTermRetentionBackup }
    - id: yr
      options:
        - { id: p7w, text: P7W }
        - { id: p7m, text: P7M }
        - { id: p7y, text: P7Y }
    - id: mode
      options:
        - { id: unlocked, text: Unlocked }
        - { id: locked, text: Locked }
        - { id: enabled, text: Enabled }
answer:
  values: { cmd: ltr, yr: p7y, mode: locked }
explanation:
  correct:
    en: |
      `Set-AzSqlDatabaseBackupLongTermRetentionPolicy` sets the long-term retention policy; `-YearlyRetention P7Y` with `-WeekOfYear 1` keeps the first-week backup for seven years. `-TimeBasedImmutability Enabled` makes future LTR backups immutable, and the `Locked` mode makes that immutability impossible to remove.
    fr: |
      `Set-AzSqlDatabaseBackupLongTermRetentionPolicy` définit la stratégie de rétention à long terme ; `-YearlyRetention P7Y` avec `-WeekOfYear 1` conserve sept ans la sauvegarde de la première semaine. `-TimeBasedImmutability Enabled` rend immuables les futures sauvegardes LTR, et le mode `Locked` empêche de retirer cette immuabilité.
  options:
    str: { en: "The short-term retention policy sets point-in-time restore retention (up to 35 days).", fr: "La stratégie de rétention à court terme définit la rétention de restauration à un point dans le temps (35 jours au maximum)." }
    upd: { en: "Update-AzSqlDatabaseLongTermRetentionBackup changes an existing backup; it doesn't define a policy with a yearly retention.", fr: "Update-AzSqlDatabaseLongTermRetentionBackup modifie une sauvegarde existante ; il ne définit pas de stratégie avec une rétention annuelle." }
    p7w: { en: "P7W is seven weeks.", fr: "P7W correspond à sept semaines." }
    p7m: { en: "P7M is seven months.", fr: "P7M correspond à sept mois." }
    unlocked: { en: "In Unlocked mode, the immutability can still be removed, which breaks the second requirement.", fr: "En mode Unlocked, l'immuabilité peut encore être retirée, ce qui ne respecte pas la seconde exigence." }
    enabled: { en: "Enabled is a value of -TimeBasedImmutability, not a mode.", fr: "Enabled est une valeur de -TimeBasedImmutability, pas un mode." }
references:
  - title: Set-AzSqlDatabaseBackupLongTermRetentionPolicy
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/set-azsqldatabasebackuplongtermretentionpolicy
