id: dp300-5a-protection-matching
objective: "5.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure SQL database named **ClaimsDb** in the Business Critical service tier, in a region that supports availability zones. ClaimsDb uses geo-redundant backup storage.

    You need to recommend a solution for each business continuity requirement. Each solution must minimize cost.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une base de données Azure SQL nommée **ClaimsDb** dans le niveau de service Business Critical, dans une région qui prend en charge les zones de disponibilité. ClaimsDb utilise un stockage de sauvegarde géoredondant.

    Vous devez recommander une solution pour chaque exigence de continuité d'activité. Chaque solution doit réduire les coûts au minimum.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pitr, text: { en: "Point-in-time restore", fr: "Restauration à un point dans le temps" } }
    - { id: ltr, text: { en: "Long-term retention", fr: "Rétention à long terme" } }
    - { id: fog, text: { en: "Failover group", fr: "Groupe de basculement" } }
    - { id: zr, text: { en: "Zone redundancy", fr: "Redondance interzone" } }
    - { id: geo, text: { en: "Geo-restore", fr: "Géorestauration" } }
  targets:
    - id: t1
      text: { en: "Recover claims that a user deleted by mistake yesterday", fr: "Récupérer des déclarations de sinistre qu'un utilisateur a supprimées par erreur hier" }
    - id: t2
      text: { en: "Keep one backup per month for five years for the auditors", fr: "Conserver une sauvegarde par mois pendant cinq ans pour les auditeurs" }
    - id: t3
      text: { en: "Keep working within one minute after a regional outage, without changing the connection strings", fr: "Reprendre le travail en moins d'une minute après une panne régionale, sans modifier les chaînes de connexion" }
    - id: t4
      text: { en: "Survive the loss of an availability zone with an RPO of zero", fr: "Survivre à la perte d'une zone de disponibilité avec un RPO de zéro" }
answer:
  mapping: { t1: pitr, t2: ltr, t3: fog, t4: zr }
explanation:
  correct:
    en: |
      Point-in-time restore recovers the database as it was before a user error, within the PITR retention. Long-term retention keeps weekly, monthly or yearly full backups for up to 10 years. A failover group fails over to another region in typically less than a minute, and its listeners keep the connection strings unchanged. Zone redundancy keeps replicas in several availability zones with zero data loss.
    fr: |
      La restauration à un point dans le temps récupère la base telle qu'elle était avant une erreur d'utilisateur, dans la limite de la rétention PITR. La rétention à long terme conserve des sauvegardes complètes hebdomadaires, mensuelles ou annuelles jusqu'à 10 ans. Un groupe de basculement bascule vers une autre région généralement en moins d'une minute, et ses écouteurs gardent les chaînes de connexion inchangées. La redondance interzone conserve des réplicas dans plusieurs zones de disponibilité sans perte de données.
  options:
    geo: { en: "Geo-restore recovers in another region in hours and creates a database on another server, so it misses the one-minute RTO and the unchanged connection strings.", fr: "La géorestauration récupère dans une autre région en quelques heures et crée une base sur un autre serveur : elle ne respecte ni le RTO d'une minute ni les chaînes de connexion inchangées." }
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
