id: dp300-5c-mon-ag-recovery-time
objective: "5.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Always On availability group named **AG2** on Azure virtual machines. **SQLVM4** hosts the primary replica and **SQLVM5** hosts a synchronous-commit secondary replica of a database named **ClaimsDb**.

    You need to estimate how long ClaimsDb on SQLVM5 would take to finish applying the log it has already received before it can come online after a failover.

    Which two values from sys.dm_hadr_database_replica_states should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un groupe de disponibilité Always On nommé **AG2** sur des machines virtuelles Azure. **SQLVM4** héberge le réplica primaire et **SQLVM5** héberge un réplica secondaire avec validation synchrone d'une base de données nommée **ClaimsDb**.

    Vous devez estimer le temps nécessaire à ClaimsDb sur SQLVM5 pour finir d'appliquer le journal déjà reçu avant de pouvoir être mise en ligne après un basculement.

    Quelles sont les deux valeurs de sys.dm_hadr_database_replica_states à utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: log_send_queue_size }
    - { id: b, text: redo_queue_size }
    - { id: c, text: log_send_rate }
    - { id: d, text: last_commit_time }
    - { id: e, text: redo_rate }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "`redo_queue_size` is the log, in KB, that the secondary has received but not yet redone, and `redo_rate` is the average redo speed in KB per second. Dividing the queue by the rate estimates the redo time that delays the secondary database after a failover (the RTO)."
    fr: "`redo_queue_size` est le journal, en Ko, que le secondaire a reçu mais pas encore rejoué, et `redo_rate` est la vitesse moyenne de rejeu en Ko par seconde. Diviser la file par la vitesse donne une estimation du temps de rejeu qui retarde la base secondaire après un basculement (le RTO)."
  options:
    a: { en: "log_send_queue_size measures log not yet sent by the primary, which relates to data loss, not to redo time.", fr: "log_send_queue_size mesure le journal pas encore envoyé par le primaire, ce qui concerne la perte de données, pas le temps de rejeu." }
    c: { en: "log_send_rate is the speed at which the primary sends log, not the speed at which the secondary redoes it.", fr: "log_send_rate est la vitesse à laquelle le primaire envoie le journal, pas celle à laquelle le secondaire le rejoue." }
    d: { en: "Comparing last_commit_time between replicas approximates the data loss window (RPO), not the redo time.", fr: "Comparer last_commit_time entre les réplicas donne une approximation de la fenêtre de perte de données (RPO), pas du temps de rejeu." }
