id: dp300-5a-schedule-native-tools
objective: "5.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 Enterprise virtual machine in Azure that hosts several user databases. The SQL IaaS Agent extension's Automated Backup and Azure Backup aren't used.

    You need to take a full backup of every user database each night by using only tools that are included with SQL Server.

    Which two tools can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle SQL Server 2022 Enterprise dans Azure qui héberge plusieurs bases de données utilisateur. Ni Automated Backup de l'extension SQL IaaS Agent ni Sauvegarde Azure ne sont utilisés.

    Vous devez effectuer chaque nuit une sauvegarde complète de chaque base utilisateur en utilisant uniquement des outils inclus dans SQL Server.

    Quels sont les deux outils que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A maintenance plan with a Back Up Database task", fr: "Un plan de maintenance avec une tâche Sauvegarder la base de données" } }
    - { id: b, text: { en: "An elastic job agent with a job that runs BACKUP DATABASE", fr: "Un agent de travail élastique avec un travail qui exécute BACKUP DATABASE" } }
    - { id: c, text: { en: "SqlPackage with the Export action, scheduled by Task Scheduler", fr: "SqlPackage avec l'action Export, planifié par le Planificateur de tâches" } }
    - { id: d, text: { en: "A SQL Server Agent job with a Transact-SQL step that runs BACKUP DATABASE", fr: "Un travail SQL Server Agent avec une étape Transact-SQL qui exécute BACKUP DATABASE" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Maintenance plans and SQL Server Agent jobs are native SQL Server tools; both can schedule full backups of all user databases. A maintenance plan builds the backup task in a designer and runs it through SQL Server Agent, while a job step runs your own BACKUP DATABASE statements.
    fr: |
      Les plans de maintenance et les travaux SQL Server Agent sont des outils natifs de SQL Server ; les deux peuvent planifier des sauvegardes complètes de toutes les bases utilisateur. Un plan de maintenance construit la tâche de sauvegarde dans un concepteur et l'exécute par SQL Server Agent, tandis qu'une étape de travail exécute vos propres instructions BACKUP DATABASE.
  options:
    b: { en: "Elastic jobs are an Azure SQL Database feature; BACKUP DATABASE isn't available on SQL Database.", fr: "Les travaux élastiques sont une fonctionnalité d'Azure SQL Database ; BACKUP DATABASE n'est pas disponible sur SQL Database." }
    c: { en: "SqlPackage Export creates a BACPAC file, a logical export that isn't a database backup and isn't included with SQL Server.", fr: "L'action Export de SqlPackage crée un fichier BACPAC, une exportation logique qui n'est pas une sauvegarde de base et n'est pas incluse dans SQL Server." }
references:
  - title: Backup and restore for SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/backup-restore
