id: dp300-5a-tail-log-offline
objective: "5.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a SQL Server 2022 virtual machine in Azure. A database named **OrdersDb** uses the full recovery model and is backed up every hour with log backups.

    The data disk that holds the data file of OrdersDb fails. OrdersDb is offline and can't start, but the log disk is intact. You plan to restore OrdersDb on a new disk without losing the transactions committed since the last log backup.

    How should you complete the Transact-SQL statement that you run first? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle SQL Server 2022 dans Azure. Une base de données nommée **OrdersDb** utilise le mode de récupération complète et ses journaux sont sauvegardés toutes les heures.

    Le disque de données qui contient le fichier de données de OrdersDb tombe en panne. OrdersDb est hors connexion et ne peut pas démarrer, mais le disque du journal est intact. Vous prévoyez de restaurer OrdersDb sur un nouveau disque sans perdre les transactions validées depuis la dernière sauvegarde de journal.

    Comment devez-vous compléter l'instruction Transact-SQL que vous exécutez en premier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    BACKUP [[kind]] OrdersDb
    TO DISK = N'H:\Backup\OrdersDb_tail.trn'
    WITH [[opt]];
  slots:
    - id: kind
      options:
        - { id: log, text: LOG }
        - { id: db, text: DATABASE }
        - { id: cert, text: CERTIFICATE }
    - id: opt
      options:
        - { id: notrunc, text: NO_TRUNCATE }
        - { id: diff, text: DIFFERENTIAL }
        - { id: format, text: FORMAT }
        - { id: stats, text: STATS = 10 }
answer:
  values: { kind: log, opt: notrunc }
explanation:
  correct:
    en: |
      The transactions since the last log backup are only in the tail of the log, so you take a tail-log backup with BACKUP LOG before restoring. When the database is offline and fails to start, the tail-log backup uses NO_TRUNCATE, which doesn't need the database to be online.
    fr: |
      Les transactions postérieures à la dernière sauvegarde de journal ne se trouvent que dans la fin du journal : vous effectuez donc une sauvegarde de la fin du journal avec BACKUP LOG avant la restauration. Lorsque la base est hors connexion et ne démarre pas, la sauvegarde de la fin du journal utilise NO_TRUNCATE, qui ne nécessite pas que la base soit en ligne.
  options:
    db: { en: "A database backup reads the data files, which are lost.", fr: "Une sauvegarde de base de données lit les fichiers de données, qui sont perdus." }
    cert: { en: "BACKUP CERTIFICATE exports a certificate, not the log records of a database.", fr: "BACKUP CERTIFICATE exporte un certificat, pas les enregistrements du journal d'une base." }
    format: { en: "FORMAT only rewrites the media header; a regular log backup of an offline database still fails.", fr: "FORMAT ne fait que réécrire l'en-tête du support ; une sauvegarde de journal ordinaire d'une base hors connexion échoue toujours." }
    stats: { en: "STATS only reports progress; without NO_TRUNCATE the log backup of an offline database fails.", fr: "STATS ne fait qu'indiquer la progression ; sans NO_TRUNCATE, la sauvegarde de journal d'une base hors connexion échoue." }
references:
  - title: Tail-log backups (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/tail-log-backups-sql-server
