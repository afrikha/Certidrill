id: dp300-5c-ls-recovery-model
objective: "5.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine named **SQLVM1**. SQLVM1 hosts a database named **InventoryDb** that uses the SIMPLE recovery model.

    You plan to configure log shipping for InventoryDb to a second virtual machine named **SQLVM2**.

    What should you do first?
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM1**. SQLVM1 héberge une base de données nommée **InventoryDb** qui utilise le mode de récupération SIMPLE.

    Vous prévoyez de configurer la copie des journaux de transaction de InventoryDb vers une seconde machine virtuelle nommée **SQLVM2**.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable the Always On availability groups feature on SQLVM1 and SQLVM2.", fr: "Activer la fonctionnalité Groupes de disponibilité Always On sur SQLVM1 et SQLVM2." } }
    - { id: b, text: { en: "Create a database mirroring endpoint on SQLVM1 and SQLVM2.", fr: "Créer un point de terminaison de mise en miroir de bases de données sur SQLVM1 et SQLVM2." } }
    - { id: c, text: { en: "Take a copy-only full backup of InventoryDb.", fr: "Effectuer une sauvegarde complète en copie seule de InventoryDb." } }
    - { id: d, text: { en: "Change the recovery model of InventoryDb to FULL.", fr: "Passer le mode de récupération de InventoryDb à FULL." } }
answer: { optionId: d }
explanation:
  correct:
    en: Log shipping sends transaction log backups, so the primary database must use the FULL or BULK_LOGGED recovery model. A database in the SIMPLE recovery model can't have log backups, and switching a log-shipped database to SIMPLE stops log shipping.
    fr: La copie des journaux de transaction envoie des sauvegardes du journal ; la base primaire doit donc utiliser le mode de récupération FULL ou BULK_LOGGED. Une base en mode SIMPLE ne peut pas avoir de sauvegardes du journal, et passer une base en copie des journaux en mode SIMPLE arrête la copie des journaux.
  options:
    a: { en: "The Always On availability groups feature is required for availability groups, not for log shipping, which relies on SQL Server Agent jobs.", fr: "La fonctionnalité Groupes de disponibilité Always On est requise pour les groupes de disponibilité, pas pour la copie des journaux de transaction, qui repose sur des travaux SQL Server Agent." }
    b: { en: "Mirroring endpoints are used by database mirroring and availability groups; log shipping copies backup files through a share.", fr: "Les points de terminaison de mise en miroir servent à la mise en miroir de bases de données et aux groupes de disponibilité ; la copie des journaux copie des fichiers de sauvegarde par un partage." }
    c: { en: "A full backup taken while the database uses SIMPLE can't start a log backup chain; change the recovery model first, and the wizard can then take the initial full backup.", fr: "Une sauvegarde complète effectuée en mode SIMPLE ne peut pas démarrer une chaîne de sauvegardes du journal ; changez d'abord le mode de récupération, l'assistant pourra ensuite effectuer la sauvegarde complète initiale." }
references:
  - title: Configure Log Shipping (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/configure-log-shipping-sql-server
