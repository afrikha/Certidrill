id: dp300-5c-mon-ag-data-loss
objective: "5.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Always On availability group named **AG1** on Azure virtual machines. **SQLVM1** hosts the primary replica, **SQLVM2** is a synchronous-commit secondary replica in the same region, and **SQLVM3** is an asynchronous-commit secondary replica in another region.

    You need to monitor how much transaction log generated on SQLVM1 has not yet reached SQLVM3, to evaluate the data that would be lost by a forced failover to SQLVM3.

    Which column of sys.dm_hadr_database_replica_states should you monitor on SQLVM1?
  fr: |
    Vous disposez d'un groupe de disponibilité Always On nommé **AG1** sur des machines virtuelles Azure. **SQLVM1** héberge le réplica primaire, **SQLVM2** est un réplica secondaire avec validation synchrone dans la même région, et **SQLVM3** est un réplica secondaire avec validation asynchrone dans une autre région.

    Vous devez surveiller la quantité de journal des transactions générée sur SQLVM1 qui n'a pas encore atteint SQLVM3, afin d'évaluer les données qui seraient perdues lors d'un basculement forcé vers SQLVM3.

    Quelle colonne de sys.dm_hadr_database_replica_states devez-vous surveiller sur SQLVM1 ?
body:
  options:
    - { id: a, text: redo_queue_size }
    - { id: b, text: redo_rate }
    - { id: c, text: synchronization_health_desc }
    - { id: d, text: log_send_queue_size }
answer: { optionId: d }
explanation:
  correct:
    en: "`log_send_queue_size` is the amount of log, in KB, in the primary database that hasn't been sent to the secondary database yet. Those log records would be lost by a forced failover, so this column measures the data loss exposure (RPO) of SQLVM3."
    fr: "`log_send_queue_size` est la quantité de journal, en Ko, de la base primaire qui n'a pas encore été envoyée à la base secondaire. Ces enregistrements de journal seraient perdus lors d'un basculement forcé : cette colonne mesure donc l'exposition à la perte de données (RPO) de SQLVM3."
  options:
    a: { en: "redo_queue_size is log already received by the secondary but not yet redone; it affects the failover time, not the data loss.", fr: "redo_queue_size est le journal déjà reçu par le secondaire mais pas encore rejoué ; il influe sur la durée du basculement, pas sur la perte de données." }
    b: { en: "redo_rate is the speed at which the secondary redoes log records; it says nothing about log not yet sent.", fr: "redo_rate est la vitesse à laquelle le secondaire rejoue les enregistrements du journal ; il n'indique rien sur le journal non encore envoyé." }
    c: { en: "synchronization_health_desc gives an overall health state, not the amount of log at risk.", fr: "synchronization_health_desc donne un état d'intégrité global, pas la quantité de journal exposée." }
references:
  - title: sys.dm_hadr_database_replica_states (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-hadr-database-replica-states-transact-sql
