id: dp300-5a-copy-only-refresh
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 virtual machine in Azure that hosts a database named **SalesDb**. SQL Server Agent jobs back up SalesDb with a full backup every Sunday, a differential backup every night and a log backup every 15 minutes.

    On Wednesday, the developers ask for a full backup of SalesDb to refresh a test environment. The backup must not change the restore sequence of the scheduled backups.

    Which statement should you run?
  fr: |
    Vous disposez d'une machine virtuelle SQL Server 2022 dans Azure qui héberge une base de données nommée **SalesDb**. Des travaux SQL Server Agent sauvegardent SalesDb avec une sauvegarde complète chaque dimanche, une sauvegarde différentielle chaque nuit et une sauvegarde de journal toutes les 15 minutes.

    Le mercredi, les développeurs demandent une sauvegarde complète de SalesDb pour actualiser un environnement de test. La sauvegarde ne doit pas modifier la séquence de restauration des sauvegardes planifiées.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "BACKUP DATABASE SalesDb TO DISK = N'F:\\Test\\SalesDb.bak' WITH COPY_ONLY;" }
    - { id: b, text: "BACKUP DATABASE SalesDb TO DISK = N'F:\\Test\\SalesDb.bak' WITH DIFFERENTIAL;" }
    - { id: c, text: "BACKUP DATABASE SalesDb TO DISK = N'F:\\Test\\SalesDb.bak' WITH INIT;" }
    - { id: d, text: "BACKUP LOG SalesDb TO DISK = N'F:\\Test\\SalesDb.trn' WITH COPY_ONLY;" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A copy-only full backup doesn't become the base of the next differential backups, so the Sunday full backup remains their base and the restore sequence doesn't change. It restores like any other full backup.
    fr: |
      Une sauvegarde complète de copie seule ne devient pas la base des sauvegardes différentielles suivantes : la sauvegarde complète du dimanche reste leur base et la séquence de restauration ne change pas. Elle se restaure comme n'importe quelle autre sauvegarde complète.
  options:
    b: { en: "A differential backup alone can't refresh a test database: it must be restored on top of the Sunday full backup.", fr: "Une sauvegarde différentielle seule ne peut pas actualiser une base de test : elle doit être restaurée par-dessus la sauvegarde complète du dimanche." }
    c: { en: "INIT only overwrites the backup sets on the media; the backup is a regular full backup that becomes the new differential base.", fr: "INIT ne fait qu'écraser les jeux de sauvegarde du support ; la sauvegarde est une sauvegarde complète ordinaire qui devient la nouvelle base différentielle." }
    d: { en: "A copy-only log backup contains only log records; it can't be restored without a full backup.", fr: "Une sauvegarde de journal de copie seule ne contient que des enregistrements du journal ; elle ne peut pas être restaurée sans sauvegarde complète." }
references:
  - title: Copy-only backups
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/copy-only-backups-sql-server
