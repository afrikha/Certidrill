id: dp300-5a-standard-readable-standby
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip has an on-premises instance named **SQL3** that runs SQL Server 2019 Standard. SQL3 hosts a database named **ReportsDb** that uses the full recovery model. The datacenter is connected to an Azure virtual network by a site-to-site VPN.

    You plan to deploy SQL Server 2019 Standard on an Azure virtual machine named **VM-DR** to host a disaster recovery copy of ReportsDb. The solution must meet the following requirements:

    - Data loss must not exceed 30 minutes.
    - Analysts must be able to run read-only queries on the copy on VM-DR.
    - SQL Server licenses must remain Standard edition.

    What should you recommend?
  fr: |
    Wingtip dispose d'une instance locale nommée **SQL3** qui exécute SQL Server 2019 Standard. SQL3 héberge une base de données nommée **ReportsDb** qui utilise le mode de récupération complète. Le centre de données est connecté à un réseau virtuel Azure par un VPN site à site.

    Vous prévoyez de déployer SQL Server 2019 Standard sur une machine virtuelle Azure nommée **VM-DR** pour héberger une copie de récupération d'urgence de ReportsDb. La solution doit satisfaire les exigences suivantes :

    - La perte de données ne doit pas dépasser 30 minutes.
    - Les analystes doivent pouvoir exécuter des requêtes en lecture seule sur la copie de VM-DR.
    - Les licences SQL Server doivent rester en édition Standard.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Log shipping every 15 minutes, with the secondary database on VM-DR in standby mode", fr: "La copie des journaux de transaction toutes les 15 minutes, avec la base secondaire de VM-DR en mode veille (Standby)" } }
    - { id: b, text: { en: "A basic availability group with an asynchronous-commit replica on VM-DR", fr: "Un groupe de disponibilité de base avec un réplica en validation asynchrone sur VM-DR" } }
    - { id: c, text: { en: "A distributed availability group between a basic availability group on SQL3 and one on VM-DR", fr: "Un groupe de disponibilité distribué entre un groupe de disponibilité de base sur SQL3 et un autre sur VM-DR" } }
    - { id: d, text: { en: "Azure Site Recovery replication of SQL3 to Azure", fr: "La réplication de SQL3 vers Azure avec Azure Site Recovery" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Log shipping works with Standard edition and gives an RPO close to the backup interval. When the secondary database is restored in standby mode, users can read it between log restores, which requires the same major version on both servers, as here.
    fr: |
      La copie des journaux de transaction fonctionne avec l'édition Standard et donne un RPO proche de l'intervalle des sauvegardes. Lorsque la base secondaire est restaurée en mode veille (Standby), les utilisateurs peuvent la lire entre deux restaurations de journal, ce qui exige la même version majeure sur les deux serveurs, comme ici.
  options:
    b: { en: "A basic availability group offers no read access on the secondary replica.", fr: "Un groupe de disponibilité de base n'offre aucun accès en lecture sur le réplica secondaire." }
    c: { en: "Basic availability groups can't be part of a distributed availability group.", fr: "Les groupes de disponibilité de base ne peuvent pas faire partie d'un groupe de disponibilité distribué." }
    d: { en: "Site Recovery replicates the whole server, and the replica isn't running or readable until you fail over or test a failover.", fr: "Site Recovery réplique tout le serveur, et le réplica n'est ni démarré ni lisible tant que vous n'effectuez pas un basculement ou un test de basculement." }
references:
  - title: Basic Always On availability groups for a single database
    url: https://learn.microsoft.com/en-us/sql/database-engine/availability-groups/windows/basic-availability-groups-always-on-availability-groups
  - title: Configure log shipping (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/configure-log-shipping-sql-server
