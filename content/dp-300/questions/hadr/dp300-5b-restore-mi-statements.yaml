id: dp300-5b-restore-mi-statements
objective: "5.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. You plan to restore native SQL Server backup files of several databases to MI1 by using Transact-SQL. A credential for the storage container that holds the files already exists on MI1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Vous prévoyez de restaurer sur MI1, avec Transact-SQL, des fichiers de sauvegarde SQL Server natifs de plusieurs bases de données. Des informations d'identification pour le conteneur de stockage qui contient les fichiers existent déjà sur MI1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the SSMS connection times out during `RESTORE DATABASE ... FROM URL`, MI1 continues the restore in the background, and you can track it in `sys.dm_operation_status`.
        fr: Si la connexion SSMS expire pendant `RESTORE DATABASE ... FROM URL`, MI1 poursuit la restauration en arrière-plan, et vous pouvez la suivre dans `sys.dm_operation_status`.
    - id: s2
      text:
        en: You can restore a `.bak` file that contains several backup sets by adding `WITH FILE = 2` to the `RESTORE DATABASE` statement.
        fr: Vous pouvez restaurer un fichier `.bak` qui contient plusieurs jeux de sauvegarde en ajoutant `WITH FILE = 2` à l'instruction `RESTORE DATABASE`.
    - id: s3
      text:
        en: A backup of a database that uses the SIMPLE recovery model is restored on MI1 with the FULL recovery model.
        fr: La sauvegarde d'une base de données qui utilise le mode de récupération SIMPLE est restaurée sur MI1 avec le mode de récupération FULL.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      On SQL Managed Instance, a native restore is asynchronous and retryable: it continues even if the client connection drops, and `sys.dm_exec_requests` and `sys.dm_operation_status` show its progress. `RESTORE` on a managed instance accepts no `WITH` options at all, and `.bak` files that contain multiple backup sets can't be restored. The instance forces the FULL recovery model on databases restored from SIMPLE or BULK_LOGGED backups.
    fr: |
      Sur SQL Managed Instance, une restauration native est asynchrone et réessayable : elle continue même si la connexion du client est interrompue, et `sys.dm_exec_requests` et `sys.dm_operation_status` indiquent sa progression. `RESTORE` sur une instance managée n'accepte aucune option `WITH`, et les fichiers `.bak` qui contiennent plusieurs jeux de sauvegarde ne peuvent pas être restaurés. L'instance impose le mode de récupération FULL aux bases restaurées à partir de sauvegardes SIMPLE ou BULK_LOGGED.
references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
