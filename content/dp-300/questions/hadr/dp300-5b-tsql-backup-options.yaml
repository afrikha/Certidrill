id: dp300-5b-tsql-backup-options
objective: "5.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage SQL Server 2022 databases on Azure virtual machines. You write `BACKUP` statements for the following requirements.

    Which option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez des bases de données SQL Server 2022 sur des machines virtuelles Azure. Vous écrivez des instructions `BACKUP` pour les exigences suivantes.

    Quelle option devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: checksum, text: CHECKSUM }
    - { id: differential, text: DIFFERENTIAL }
    - { id: norecovery, text: NORECOVERY }
    - { id: compression, text: COMPRESSION }
    - { id: copyonly, text: COPY_ONLY }
    - { id: standby, text: STANDBY }
  targets:
    - { id: t1, text: { en: "Verify page checksums while the backup reads the database", fr: "Vérifier les sommes de contrôle des pages pendant que la sauvegarde lit la base" } }
    - { id: t2, text: { en: "Back up only the extents changed since the last full backup", fr: "Sauvegarder uniquement les extensions modifiées depuis la dernière sauvegarde complète" } }
    - { id: t3, text: { en: "Leave the database in the restoring state after a tail-log backup", fr: "Laisser la base à l'état de restauration après une sauvegarde de la fin du journal" } }
    - { id: t4, text: { en: "Reduce the size of the backup file", fr: "Réduire la taille du fichier de sauvegarde" } }
answer:
  mapping: { t1: checksum, t2: differential, t3: norecovery, t4: compression }
explanation:
  correct:
    en: |
      `CHECKSUM` verifies page checksums and writes a backup checksum. `DIFFERENTIAL` backs up only the extents changed since the differential base. `NORECOVERY` on `BACKUP LOG` backs up the tail of the log and leaves the database restoring so that it can't change before the restore. `COMPRESSION` makes the backup smaller and usually faster.
    fr: |
      `CHECKSUM` vérifie les sommes de contrôle des pages et écrit une somme de contrôle de sauvegarde. `DIFFERENTIAL` sauvegarde uniquement les extensions modifiées depuis la base différentielle. `NORECOVERY` sur `BACKUP LOG` sauvegarde la fin du journal et laisse la base en restauration pour qu'elle ne change plus avant la restauration. `COMPRESSION` rend la sauvegarde plus petite et généralement plus rapide.
  options:
    copyonly: { en: "COPY_ONLY creates a backup outside the regular sequence; it doesn't reduce its size or check pages.", fr: "COPY_ONLY crée une sauvegarde hors de la séquence normale ; il ne réduit pas sa taille et ne vérifie pas les pages." }
    standby: { en: "STANDBY on a tail-log backup leaves the database read-only in standby, not in the restoring state.", fr: "STANDBY sur une sauvegarde de la fin du journal laisse la base en lecture seule en mode standby, pas à l'état de restauration." }
references:
  - title: BACKUP (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/backup-transact-sql
  - title: Tail-log backups (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/tail-log-backups-sql-server
