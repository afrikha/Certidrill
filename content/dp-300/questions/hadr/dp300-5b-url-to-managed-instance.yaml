id: dp300-5b-url-to-managed-instance
objective: "5.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an on-premises SQL Server 2022 instance that hosts a database named **Vendors**, and an Azure SQL managed instance named **MI1**. A private container named **transfer** exists in an Azure storage account named **stadatum**. MI1 already has a valid credential for the transfer container.

    You need to copy Vendors to MI1 by using native backup and restore.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une instance SQL Server 2022 locale qui héberge une base de données nommée **Vendors**, et d'une instance managée Azure SQL nommée **MI1**. Un conteneur privé nommé **transfer** existe dans un compte de stockage Azure nommé **stadatum**. MI1 possède déjà des informations d'identification valides pour le conteneur transfer.

    Vous devez copier Vendors sur MI1 par sauvegarde et restauration natives.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: sas, text: { en: "Generate a SAS token for the transfer container with the read, write and list permissions.", fr: "Générer un jeton SAS pour le conteneur transfer avec les autorisations de lecture, d'écriture et de liste." } }
    - { id: cred, text: { en: "On SQL Server, create a credential named after the container URL that uses the SAS token.", fr: "Sur SQL Server, créer des informations d'identification nommées d'après l'URL du conteneur et utilisant le jeton SAS." } }
    - { id: backup, text: { en: "On SQL Server, back up Vendors TO URL in the transfer container.", fr: "Sur SQL Server, sauvegarder Vendors TO URL dans le conteneur transfer." } }
    - { id: restore, text: { en: "On MI1, run RESTORE DATABASE Vendors FROM URL.", fr: "Sur MI1, exécuter RESTORE DATABASE Vendors FROM URL." } }
    - { id: disk, text: { en: "Copy the backup file to a disk of MI1, and run RESTORE DATABASE Vendors FROM DISK.", fr: "Copier le fichier de sauvegarde sur un disque de MI1, puis exécuter RESTORE DATABASE Vendors FROM DISK." } }
    - { id: bacpac, text: { en: "Export Vendors to a BACPAC file by using SqlPackage.", fr: "Exporter Vendors dans un fichier BACPAC avec SqlPackage." } }
answer:
  sequence: [ sas, cred, backup, restore ]
explanation:
  correct:
    en: |
      SQL Server needs its own credential, named after the container URL and holding a SAS token without the leading `?`, before it can run `BACKUP ... TO URL`. Once the `.bak` is in Blob Storage, MI1 restores it with `RESTORE DATABASE ... FROM URL` by using its existing credential.
    fr: |
      SQL Server a besoin de ses propres informations d'identification, nommées d'après l'URL du conteneur et contenant un jeton SAS sans `?` initial, avant de pouvoir exécuter `BACKUP ... TO URL`. Une fois le fichier `.bak` dans Stockage Blob Azure, MI1 le restaure avec `RESTORE DATABASE ... FROM URL` grâce à ses informations d'identification existantes.
  options:
    disk: { en: "You can't access the disks of a managed instance, and FROM DISK isn't supported there: FROM URL is the only restore source.", fr: "Vous n'avez pas accès aux disques d'une instance managée, et FROM DISK n'y est pas pris en charge : FROM URL est la seule source de restauration." }
    bacpac: { en: "A BACPAC is an export, not a native backup, and isn't restored with RESTORE.", fr: "Un BACPAC est une exportation, pas une sauvegarde native, et ne se restaure pas avec RESTORE." }
references:
  - title: SQL Server backup to URL for Azure Blob Storage
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/sql-server-backup-to-url
  - title: "Quickstart: Restore a database to Azure SQL Managed Instance with SSMS"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/restore-sample-database-quickstart
