id: dp300-5b-pitr-midb-cli
objective: "5.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure SQL managed instances named **MI1** and **MI2** in a resource group named **rg-sql**. Both instances are in the same region and subscription. MI1 hosts a database named **Orders**.

    You need to create a database named **Orders_0915** on MI2 that contains Orders as it was on November 12, 2026, at 09:15. Orders on MI1 must remain unchanged.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux instances managées Azure SQL nommées **MI1** et **MI2** dans un groupe de ressources nommé **rg-sql**. Les deux instances se trouvent dans la même région et le même abonnement. MI1 héberge une base de données nommée **Orders**.

    Vous devez créer sur MI2 une base de données nommée **Orders_0915** qui contient Orders telle qu'elle était le 12 novembre 2026 à 09:15. Orders sur MI1 ne doit pas être modifiée.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql [[grp]] restore \
      --resource-group rg-sql --mi MI1 --name Orders \
      --dest-name Orders_0915 \
      [[dest]] MI2 \
      [[tp]] "2026-11-12T09:15:00"
  slots:
    - id: grp
      options:
        - { id: db, text: db }
        - { id: mi, text: mi }
        - { id: midb, text: midb }
    - id: dest
      options:
        - { id: destrg, text: "--dest-resource-group" }
        - { id: destmi, text: "--dest-mi" }
        - { id: srcsub, text: "--source-sub" }
    - id: tp
      options:
        - { id: time, text: "--time" }
        - { id: deleted, text: "--deleted-time" }
        - { id: yearly, text: "--yearly-retention" }
answer:
  values: { grp: midb, dest: destmi, tp: time }
explanation:
  correct:
    en: |
      `az sql midb restore` runs a point-in-time restore of a managed database into a new database. `--dest-mi` selects another instance as the target (it defaults to the source instance), and `--time` sets the restore point in `YYYY-MM-DDTHH:MM:SS` format. Cross-instance restore is supported within the same region.
    fr: |
      `az sql midb restore` effectue une restauration à un point dans le temps d'une base de données managée dans une nouvelle base. `--dest-mi` désigne une autre instance comme cible (par défaut, l'instance source), et `--time` définit le point de restauration au format `YYYY-MM-DDTHH:MM:SS`. La restauration vers une autre instance est prise en charge dans la même région.
  options:
    db: { en: "az sql db restore targets databases of a logical server, not managed instance databases.", fr: "az sql db restore cible les bases de données d'un serveur logique, pas celles d'une instance managée." }
    mi: { en: "az sql mi manages the instance; database restores are under az sql midb.", fr: "az sql mi gère l'instance ; les restaurations de bases de données relèvent de az sql midb." }
    destrg: { en: "--dest-resource-group sets the resource group of the target instance, which is the same here; it doesn't select MI2.", fr: "--dest-resource-group définit le groupe de ressources de l'instance cible, identique ici ; il ne sélectionne pas MI2." }
    srcsub: { en: "--source-sub is for a cross-subscription restore and takes a subscription ID.", fr: "--source-sub sert à une restauration entre abonnements et prend un ID d'abonnement." }
    deleted: { en: "--deleted-time restores a deleted database; Orders still exists.", fr: "--deleted-time restaure une base de données supprimée ; Orders existe toujours." }
    yearly: { en: "--yearly-retention belongs to the long-term retention policy commands.", fr: "--yearly-retention appartient aux commandes de stratégie de rétention à long terme." }
references:
  - title: az sql midb
    url: https://learn.microsoft.com/en-us/cli/azure/sql/midb
  - title: Restore a database in Azure SQL Managed Instance to a previous point in time
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/point-in-time-restore
