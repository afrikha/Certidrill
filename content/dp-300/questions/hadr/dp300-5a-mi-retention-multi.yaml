id: dp300-5a-mi-retention-multi
objective: "5.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure SQL managed instance named **MI2** that hosts a database named **HrDb**. HrDb uses the default point-in-time restore retention and has no long-term retention policy.

    You need to meet the following requirements:

    - HrDb must be restorable to any point in time during the last 28 days.
    - The first backup of each month must be kept for five years.
    - Backup storage costs must be minimized.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une instance managée Azure SQL nommée **MI2** qui héberge une base de données nommée **HrDb**. HrDb utilise la rétention de restauration à un point dans le temps par défaut et n'a aucune stratégie de rétention à long terme.

    Vous devez satisfaire les exigences suivantes :

    - HrDb doit pouvoir être restaurée à n'importe quel moment des 28 derniers jours.
    - La première sauvegarde de chaque mois doit être conservée pendant cinq ans.
    - Les coûts de stockage des sauvegardes doivent être réduits au minimum.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure a long-term retention policy with a weekly retention of five years.", fr: "Configurer une stratégie de rétention à long terme avec une rétention hebdomadaire de cinq ans." } }
    - { id: b, text: { en: "Set the point-in-time restore retention of HrDb to 28 days.", fr: "Définir la rétention de restauration à un point dans le temps de HrDb sur 28 jours." } }
    - { id: c, text: { en: "Configure a long-term retention policy with a monthly retention of five years.", fr: "Configurer une stratégie de rétention à long terme avec une rétention mensuelle de cinq ans." } }
    - { id: d, text: { en: "Protect MI2 with an Azure Backup policy in a Recovery Services vault.", fr: "Protéger MI2 avec une stratégie Sauvegarde Azure dans un coffre Recovery Services." } }
    - { id: e, text: { en: "Change the backup storage redundancy of MI2 to geo-zone-redundant.", fr: "Passer la redondance du stockage de sauvegarde de MI2 en stockage géoredondant interzone." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      The default PITR retention is 7 days and can be raised up to 35 days; 28 days meets the requirement. An LTR policy with a monthly retention of five years (P5Y) keeps the first full backup of each month, and SQL Managed Instance supports LTR like SQL Database.
    fr: |
      La rétention PITR par défaut est de 7 jours et peut être portée jusqu'à 35 jours ; 28 jours satisfont l'exigence. Une stratégie LTR avec une rétention mensuelle de cinq ans (P5Y) conserve la première sauvegarde complète de chaque mois, et SQL Managed Instance prend en charge la LTR comme SQL Database.
  options:
    a: { en: "A weekly retention of five years keeps about four times more backups than needed, which doesn't minimize cost.", fr: "Une rétention hebdomadaire de cinq ans conserve environ quatre fois plus de sauvegardes que nécessaire, ce qui ne réduit pas les coûts." }
    d: { en: "Azure Backup doesn't protect SQL Managed Instance, whose backups are automated by the service.", fr: "Sauvegarde Azure ne protège pas SQL Managed Instance, dont les sauvegardes sont automatisées par le service." }
    e: { en: "Changing the redundancy doesn't extend retention, and geo-zone-redundant storage costs more.", fr: "Changer la redondance n'allonge pas la rétention, et le stockage géoredondant interzone coûte plus cher." }
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
  - title: Manage Azure SQL Managed Instance long-term backup retention
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/long-term-backup-retention-configure
