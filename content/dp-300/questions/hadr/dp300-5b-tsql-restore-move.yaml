id: dp300-5b-tsql-restore-move
objective: "5.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine named **SQLVM3**. SQLVM3 already hosts a database named **Sales**. You copied a full backup and one log backup of Sales from another server to SQLVM3.

    You need to restore the backups as a new database named **Sales_QA** on SQLVM3, with its data file on drive G and its log file on drive H. The existing Sales database must not be affected, and Sales_QA must be online at the end of the script.

    How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM3**. SQLVM3 héberge déjà une base de données nommée **Sales**. Vous avez copié sur SQLVM3 une sauvegarde complète et une sauvegarde de journal de Sales provenant d'un autre serveur.

    Vous devez restaurer ces sauvegardes en tant que nouvelle base de données nommée **Sales_QA** sur SQLVM3, avec son fichier de données sur le lecteur G et son fichier journal sur le lecteur H. La base Sales existante ne doit pas être affectée, et Sales_QA doit être en ligne à la fin du script.

    Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    RESTORE DATABASE Sales_QA FROM DISK = N'F:\Import\Sales_full.bak'
        WITH [[a]] N'Sales' TO N'G:\Data\Sales_QA.mdf',
             [[b]] N'Sales_log' TO N'H:\Log\Sales_QA.ldf',
             [[c]];
    RESTORE LOG Sales_QA FROM DISK = N'F:\Import\Sales_log.trn'
        WITH [[d]];
  slots:
    - id: a
      options:
        - { id: move, text: MOVE }
        - { id: replace, text: REPLACE }
        - { id: file, text: FILE }
    - id: b
      options:
        - { id: move, text: MOVE }
        - { id: replace, text: REPLACE }
        - { id: file, text: FILE }
    - id: c
      options:
        - { id: recovery, text: RECOVERY }
        - { id: norecovery, text: NORECOVERY }
        - { id: replace, text: REPLACE }
    - id: d
      options:
        - { id: rec2, text: RECOVERY }
        - { id: norec2, text: NORECOVERY }
        - { id: standby, text: "STANDBY = N'H:\\Log\\Sales_QA.tuf'" }
answer:
  values: { a: move, b: move, c: norecovery, d: rec2 }
explanation:
  correct:
    en: |
      Each `MOVE 'logical_name' TO 'path'` clause relocates one file, which avoids a collision with the files of the existing Sales database. The full backup is restored `WITH NORECOVERY` so that the log backup can still be applied, and the last restore uses `RECOVERY` to bring Sales_QA online.
    fr: |
      Chaque clause `MOVE 'nom_logique' TO 'chemin'` déplace un fichier, ce qui évite un conflit avec les fichiers de la base Sales existante. La sauvegarde complète est restaurée `WITH NORECOVERY` pour pouvoir appliquer ensuite la sauvegarde de journal, et la dernière restauration utilise `RECOVERY` pour mettre Sales_QA en ligne.
  options:
    replace: { en: "REPLACE overwrites an existing database or its files; it doesn't relocate files and isn't needed for a new database name.", fr: "REPLACE écrase une base existante ou ses fichiers ; il ne déplace pas de fichiers et n'est pas nécessaire pour un nouveau nom de base." }
    file: { en: "FILE selects a backup set by position in the media; it doesn't change file locations.", fr: "FILE sélectionne un jeu de sauvegarde selon sa position sur le support ; il ne change pas l'emplacement des fichiers." }
    recovery: { en: "RECOVERY after the full backup would prevent the log backup from being applied.", fr: "RECOVERY après la sauvegarde complète empêcherait d'appliquer la sauvegarde de journal." }
    norec2: { en: "NORECOVERY after the last log backup leaves Sales_QA in the RESTORING state.", fr: "NORECOVERY après la dernière sauvegarde de journal laisse Sales_QA à l'état RESTORING." }
    standby: { en: "STANDBY leaves the database read-only and ready for more log restores, not fully online.", fr: "STANDBY laisse la base en lecture seule et prête pour d'autres restaurations de journal, pas pleinement en ligne." }
references:
  - title: RESTORE Statements - Arguments (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-arguments-transact-sql
