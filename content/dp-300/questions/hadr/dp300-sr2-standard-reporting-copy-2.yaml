seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: |
    You configure log shipping and restore in standby mode.
  fr: |
    Vous configurez la copie des journaux de transaction avec restauration en mode veille.
body:
  solution:
    en: |
      You configure log shipping from SQL1 to VM1. The backup, copy and restore jobs run every **5 minutes**. The restore job restores the log backups in **standby mode** and disconnects users from the database while each backup is restored.
    fr: |
      Vous configurez la copie des journaux de transaction de SQL1 vers VM1. Les travaux de sauvegarde, de copie et de restauration s'exécutent toutes les **5 minutes**. Le travail de restauration restaure les sauvegardes de journal en **mode veille (Standby)** et déconnecte les utilisateurs de la base pendant la restauration de chaque sauvegarde.
answer: { value: true }
explanation:
  correct:
    en: |
      Log shipping works with Standard edition, and a secondary database restored in standby mode is available for read-only queries between restore jobs. With backups and copies every 5 minutes, the transactions at risk if SQL1 fails are a few minutes of log, well under 30 minutes. Disconnecting users lets each restore run on schedule.
    fr: |
      La copie des journaux de transaction fonctionne avec l'édition Standard, et une base secondaire restaurée en mode veille est disponible pour des requêtes en lecture seule entre les travaux de restauration. Avec des sauvegardes et des copies toutes les 5 minutes, les transactions exposées si SQL1 tombe en panne représentent quelques minutes de journal, bien moins de 30 minutes. Déconnecter les utilisateurs permet à chaque restauration de s'exécuter à l'heure prévue.
references:
  - title: "About log shipping (SQL Server)"
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/about-log-shipping-sql-server
