id: dp300-5a-dr-only-cost
objective: "5.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has an Azure SQL database named **BillingDb** in the Business Critical service tier (provisioned vCore, Standard-series hardware) on a logical server in East US.

    You need to implement a disaster recovery solution that meets the following requirements:

    - If East US becomes unavailable, BillingDb must be available in West US within one minute of your decision to fail over.
    - Applications must keep the same connection string after a failover.
    - The copy in West US will be used only for disaster recovery.
    - Costs must be minimized.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une base de données Azure SQL nommée **BillingDb** dans le niveau de service Business Critical (vCore provisionné, matériel série Standard) sur un serveur logique dans East US.

    Vous devez mettre en œuvre une solution de récupération d'urgence qui satisfait les exigences suivantes :

    - Si East US devient indisponible, BillingDb doit être disponible dans West US moins d'une minute après votre décision de basculer.
    - Les applications doivent conserver la même chaîne de connexion après un basculement.
    - La copie de West US sera utilisée uniquement pour la récupération d'urgence.
    - Les coûts doivent être réduits au minimum.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable read scale-out on the West US database.", fr: "Activer le scale-out en lecture sur la base de West US." } }
    - { id: b, text: { en: "Set the failover policy of the group to Microsoft managed.", fr: "Définir la stratégie de basculement du groupe sur Microsoft managed." } }
    - { id: c, text: { en: "Create a failover group that contains BillingDb, with a secondary server in West US.", fr: "Créer un groupe de basculement qui contient BillingDb, avec un serveur secondaire dans West US." } }
    - { id: d, text: { en: "Change the backup storage redundancy of BillingDb to geo-zone-redundant.", fr: "Passer la redondance du stockage de sauvegarde de BillingDb en stockage géoredondant interzone." } }
    - { id: e, text: { en: "Designate the West US database as a standby replica.", fr: "Désigner la base de West US comme réplica de secours (standby)." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      A failover group gives a sub-minute customer-managed failover to West US, and its listener keeps the connection string. Because the secondary serves no reads, you can designate it as a license-free standby replica, which is supported for provisioned General Purpose and Business Critical databases and is set per database in a failover group; you then pay only its compute and storage.
    fr: |
      Un groupe de basculement offre un basculement géré par le client en moins d'une minute vers West US, et son écouteur conserve la chaîne de connexion. Comme le secondaire ne sert aucune lecture, vous pouvez le désigner comme réplica de secours (standby) sans licence, pris en charge pour les bases General Purpose et Business Critical provisionnées et défini par base dans un groupe de basculement ; vous ne payez alors que son calcul et son stockage.
  options:
    a: { en: "Read scale-out sends read-only queries to a replica, which a DR-only copy doesn't need and a standby replica doesn't allow.", fr: "Le scale-out en lecture envoie des requêtes en lecture seule vers un réplica, ce dont une copie réservée à la récupération d'urgence n'a pas besoin et qu'un réplica de secours n'autorise pas." }
    b: { en: "With the Microsoft-managed policy, failover happens only after a grace period of at least one hour, and you don't decide when.", fr: "Avec la stratégie gérée par Microsoft, le basculement n'a lieu qu'après une période de grâce d'au moins une heure, et vous ne décidez pas du moment." }
    d: { en: "Geo-redundant backups enable geo-restore, whose RTO is measured in hours, not one minute.", fr: "Des sauvegardes géoredondantes permettent la géorestauration, dont le RTO se mesure en heures, pas en une minute." }
references:
  - title: License-free standby replica for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/standby-replica-how-to-configure
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
