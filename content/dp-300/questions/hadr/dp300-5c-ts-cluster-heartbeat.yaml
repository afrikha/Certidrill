id: dp300-5c-ts-cluster-heartbeat
objective: "5.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Always On availability group on two Azure virtual machines that run Windows Server 2022 and SQL Server 2022. The Windows Server failover cluster uses the default heartbeat settings.

    The availability group fails over unexpectedly several times a week. The system log contains event ID 1135 (a node was removed from the active failover cluster membership), and the SQL Server error log contains error 19407 (the lease between the availability group and the cluster expired). CPU, disk and network metrics of the virtual machines are normal.

    You need to reduce the number of unplanned failovers. What should you do?
  fr: |
    Vous disposez d'un groupe de disponibilité Always On sur deux machines virtuelles Azure qui exécutent Windows Server 2022 et SQL Server 2022. Le cluster de basculement Windows Server utilise les paramètres de pulsation par défaut.

    Le groupe de disponibilité bascule de façon inattendue plusieurs fois par semaine. Le journal système contient l'événement 1135 (un nœud a été retiré des membres actifs du cluster de basculement), et le journal des erreurs SQL Server contient l'erreur 19407 (le bail entre le groupe de disponibilité et le cluster a expiré). Les métriques de processeur, de disque et de réseau des machines virtuelles sont normales.

    Vous devez réduire le nombre de basculements non planifiés. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set SameSubnetThreshold and CrossSubnetThreshold of the cluster to 40.", fr: "Définir SameSubnetThreshold et CrossSubnetThreshold du cluster sur 40." } }
    - { id: b, text: { en: "Add a second network interface to each virtual machine for cluster traffic.", fr: "Ajouter une deuxième interface réseau à chaque machine virtuelle pour le trafic du cluster." } }
    - { id: c, text: { en: "Set the HEALTH_CHECK_TIMEOUT of the availability group to 10000.", fr: "Définir le HEALTH_CHECK_TIMEOUT du groupe de disponibilité sur 10000." } }
    - { id: d, text: { en: "Replace the cloud witness of the cluster with a file share witness.", fr: "Remplacer le témoin cloud du cluster par un témoin de partage de fichiers." } }
answer: { optionId: a }
explanation:
  correct:
    en: Event 1135 and lease timeouts in Azure usually come from transient network or host events that exceed default cluster thresholds. Microsoft recommends relaxed heartbeat values of 40 heartbeats for SameSubnetThreshold and CrossSubnetThreshold; the change takes effect immediately without a restart.
    fr: L'événement 1135 et les expirations de bail dans Azure viennent généralement d'événements réseau ou d'hôte passagers qui dépassent les seuils par défaut du cluster. Microsoft recommande des valeurs de pulsation assouplies de 40 pulsations pour SameSubnetThreshold et CrossSubnetThreshold ; la modification prend effet immédiatement, sans redémarrage.
  options:
    b: { en: "Azure networking has physical redundancy and bandwidth is shared across NICs, so one NIC per node is recommended.", fr: "Le réseau Azure dispose d'une redondance physique et la bande passante est partagée entre les cartes réseau : une seule carte par nœud est recommandée." }
    c: { en: "10 seconds is below the default of 30 seconds and would make failovers more frequent; the relaxed value is 60 seconds.", fr: "10 secondes est inférieur à la valeur par défaut de 30 secondes et rendrait les basculements plus fréquents ; la valeur assouplie est de 60 secondes." }
    d: { en: "The witness type doesn't change heartbeat detection; a cloud witness is the recommended choice for an availability group cluster.", fr: "Le type de témoin ne change pas la détection des pulsations ; un témoin cloud est le choix recommandé pour le cluster d'un groupe de disponibilité." }
references:
  - title: HADR configuration best practices - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/hadr-cluster-best-practices
