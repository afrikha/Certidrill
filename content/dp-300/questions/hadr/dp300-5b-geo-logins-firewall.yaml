id: dp300-5b-geo-logins-firewall
objective: "5.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **Portal** on a logical server named **srv-web**. Applications connect to Portal by using SQL logins created in the master database of srv-web, and access is allowed by server-level IP firewall rules. You plan to add a geo-secondary of Portal on a logical server named **srv-web-dr** by using active geo-replication.

    You need to ensure that after a failover to srv-web-dr, the applications can authenticate and pass the firewall without any further configuration on srv-web-dr.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Portal** sur un serveur logique nommé **srv-web**. Les applications se connectent à Portal avec des connexions SQL créées dans la base master de srv-web, et l'accès est autorisé par des règles de pare-feu IP au niveau du serveur. Vous prévoyez d'ajouter une base secondaire géographique de Portal sur un serveur logique nommé **srv-web-dr** par géoréplication active.

    Vous devez vous assurer qu'après un basculement vers srv-web-dr, les applications peuvent s'authentifier et franchir le pare-feu sans autre configuration sur srv-web-dr.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace the server-level IP firewall rules with database-level IP firewall rules in Portal.", fr: "Remplacer les règles de pare-feu IP au niveau du serveur par des règles de pare-feu IP au niveau de la base de données dans Portal." } }
    - { id: b, text: { en: "Designate the geo-secondary as a license-free standby replica.", fr: "Désigner la base secondaire comme réplica de secours sans licence." } }
    - { id: c, text: { en: "Replace the logins and their mapped users with contained database users in Portal.", fr: "Remplacer les connexions et les utilisateurs associés par des utilisateurs de base de données autonome dans Portal." } }
    - { id: d, text: { en: "Set the backup storage redundancy of the geo-secondary to geo-redundant storage.", fr: "Définir la redondance du stockage de sauvegarde de la base secondaire sur le stockage géoredondant." } }
    - { id: e, text: { en: "Enable the Allow Azure services and resources to access this server setting on srv-web.", fr: "Activer le paramètre Allow Azure services and resources to access this server sur srv-web." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Database-level IP firewall rules and contained database users are stored in the database itself, so they replicate to the geo-secondary and work as soon as it becomes the primary. Server-level rules and logins live in the master database of each server and would have to be recreated on srv-web-dr.
    fr: |
      Les règles de pare-feu IP au niveau de la base et les utilisateurs de base de données autonome sont stockés dans la base elle-même : ils sont répliqués vers la base secondaire et fonctionnent dès qu'elle devient primaire. Les règles au niveau du serveur et les connexions résident dans la base master de chaque serveur et devraient être recréées sur srv-web-dr.
  options:
    b: { en: "A standby replica only removes license costs for a secondary that runs no workload; it doesn't replicate logins or firewall rules.", fr: "Un réplica de secours supprime seulement le coût de licence d'une base secondaire sans charge de travail ; il ne réplique ni les connexions ni les règles de pare-feu." }
    d: { en: "Backup storage redundancy affects backups and geo-restore, not authentication or firewall rules.", fr: "La redondance du stockage de sauvegarde concerne les sauvegardes et la géorestauration, pas l'authentification ni le pare-feu." }
    e: { en: "This setting is a server-level option of srv-web; it isn't replicated and doesn't allow the application IP addresses on srv-web-dr.", fr: "Ce paramètre est une option au niveau du serveur srv-web ; il n'est pas répliqué et n'autorise pas les adresses IP des applications sur srv-web-dr." }
references:
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
