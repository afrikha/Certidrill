id: dp300-cs4a-mi-link-dr
objective: "5.1.2"
type: yesno_statements
caseStudy: dp300-cs4a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You plan the Managed Instance link between SQL1 and MI-DR to meet the business continuity requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez le lien Managed Instance entre SQL1 et MI-DR pour satisfaire les exigences de continuité d'activité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          To fail ClaimsCore back to SQL1 online, MI-DR must use the SQL Server 2022 update policy.
        fr: |
          Pour effectuer la restauration automatique de ClaimsCore vers SQL1 en ligne, MI-DR doit utiliser la stratégie de mise à jour SQL Server 2022.
    - id: s2
      text:
        en: |
          The link can replicate ClaimsCore to MI-DR through the public endpoint of MI-DR.
        fr: |
          Le lien peut répliquer ClaimsCore vers MI-DR via le point de terminaison public de MI-DR.
    - id: s3
      text:
        en: |
          You can activate the hybrid failover benefit on MI-DR so that Humongous isn't charged SQL Server licensing for the vCores of MI-DR.
        fr: |
          Vous pouvez activer l'avantage de basculement hybride sur MI-DR afin que Humongous ne paie pas de licence SQL Server pour les vCores de MI-DR.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With SQL Server 2022, the link supports failover to Azure and online failback to SQL Server only when the managed instance uses the matching SQL Server 2022 update policy; replication from an instance with the Always-up-to-date policy to SQL Server 2022 isn't supported. Link replication always uses the VNet-local endpoint of the managed instance, reached here through ExpressRoute; the public endpoint carries client traffic only. A managed instance designated as a passive, DR-only replica that runs no workload qualifies for the hybrid failover benefit, so its vCores aren't charged SQL Server licensing.
    fr: |
      Avec SQL Server 2022, le lien prend en charge le basculement vers Azure et la restauration automatique en ligne vers SQL Server uniquement quand l'instance managée utilise la stratégie de mise à jour SQL Server 2022 correspondante ; la réplication d'une instance en stratégie Always-up-to-date vers SQL Server 2022 n'est pas prise en charge. La réplication du lien utilise toujours le point de terminaison local du réseau virtuel (VNet-local) de l'instance managée, atteint ici via ExpressRoute ; le point de terminaison public ne transporte que le trafic des clients. Une instance managée désignée comme réplica passif dédié à la reprise d'activité et sans charge de travail bénéficie de l'avantage de basculement hybride : ses vCores ne sont pas facturés en licence SQL Server.
  options:
    s2: { en: "The Managed Instance link can be established only with the VNet-local endpoint of the managed instance.", fr: "Le lien Managed Instance ne peut être établi qu'avec le point de terminaison local du réseau virtuel de l'instance managée." }
references:
  - title: Managed Instance link overview - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
