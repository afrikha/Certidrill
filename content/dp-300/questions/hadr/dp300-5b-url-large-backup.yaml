id: dp300-5b-url-large-backup
objective: "5.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a SQL Server 2019 instance on an Azure virtual machine. A database named **Archive** produces a compressed full backup of about 1.5 TB.

    You need to back up Archive directly to a container in an Azure Storage general-purpose v2 account. The solution must use the most secure supported authorization method.

    What should you do?
  fr: |
    Vous disposez d'une instance SQL Server 2019 sur une machine virtuelle Azure. Une base de données nommée **Archive** produit une sauvegarde complète compressée d'environ 1,5 To.

    Vous devez sauvegarder Archive directement dans un conteneur d'un compte de stockage Azure general-purpose v2. La solution doit utiliser la méthode d'autorisation prise en charge la plus sécurisée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a credential that uses a SAS, and back up to one URL WITH MAXTRANSFERSIZE = 4194304, BLOCKSIZE = 65536.", fr: "Créer des informations d'identification qui utilisent une SAS, et sauvegarder vers une seule URL WITH MAXTRANSFERSIZE = 4194304, BLOCKSIZE = 65536." } }
    - { id: b, text: { en: "Create a credential that uses the account access key, and back up to one URL WITH CREDENTIAL.", fr: "Créer des informations d'identification qui utilisent la clé d'accès du compte, et sauvegarder vers une seule URL WITH CREDENTIAL." } }
    - { id: c, text: { en: "Create a credential that uses the account access key, and back up to 10 URLs WITH CREDENTIAL.", fr: "Créer des informations d'identification qui utilisent la clé d'accès du compte, et sauvegarder vers 10 URL WITH CREDENTIAL." } }
    - { id: d, text: { en: "Create a credential that uses a SAS, and back up to 10 URLs WITH MAXTRANSFERSIZE = 4194304, BLOCKSIZE = 65536.", fr: "Créer des informations d'identification qui utilisent une SAS, et sauvegarder vers 10 URL WITH MAXTRANSFERSIZE = 4194304, BLOCKSIZE = 65536." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A SAS credential writes block blobs, and a single block blob holds about 195 GB (50,000 blocks of 4 MB). Striping the backup across 10 URLs keeps each blob near 150 GB, and the recommended `MAXTRANSFERSIZE` and `BLOCKSIZE` values make the best use of the block limit. SAS is also safer than the storage account key.
    fr: |
      Des informations d'identification SAS écrivent des objets blob de blocs, et un seul objet blob de blocs contient environ 195 Go (50 000 blocs de 4 Mo). Répartir la sauvegarde sur 10 URL maintient chaque objet blob autour de 150 Go, et les valeurs recommandées de `MAXTRANSFERSIZE` et `BLOCKSIZE` exploitent au mieux la limite de blocs. La SAS est en outre plus sûre que la clé du compte de stockage.
  options:
    a: { en: "A single block blob is limited to about 195 GB, far less than 1.5 TB.", fr: "Un seul objet blob de blocs est limité à environ 195 Go, bien moins que 1,5 To." }
    b: { en: "An access key writes a page blob, limited to 1 TB, and is less secure than a SAS.", fr: "Une clé d'accès écrit un objet blob de pages, limité à 1 To, et est moins sûre qu'une SAS." }
    c: { en: "Backing up to multiple blobs requires block blobs and a SAS credential.", fr: "La sauvegarde vers plusieurs objets blob exige des objets blob de blocs et des informations d'identification SAS." }
references:
  - title: SQL Server backup to URL for Azure Blob Storage
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/sql-server-backup-to-url
