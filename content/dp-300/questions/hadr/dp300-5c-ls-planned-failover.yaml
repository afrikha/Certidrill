id: dp300-5c-ls-planned-failover
objective: "5.3.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a log shipping configuration for a database named **ErpDb** from **SQL1** (primary) to **SQL2** (secondary, No recovery mode). You have disabled the log shipping jobs, and every log backup taken by the backup job has been copied and restored on SQL2.

    You need to make ErpDb on SQL2 the primary database without losing any transaction. ErpDb on SQL1 must stay in the restoring state so that it can later become a secondary database.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une configuration de copie des journaux de transaction pour une base de données nommée **ErpDb**, de **SQL1** (primaire) vers **SQL2** (secondaire, mode No recovery). Vous avez désactivé les travaux de copie des journaux, et chaque sauvegarde du journal effectuée par le travail de sauvegarde a été copiée et restaurée sur SQL2.

    Vous devez faire de ErpDb sur SQL2 la base primaire sans perdre aucune transaction. ErpDb sur SQL1 doit rester en état de restauration afin de pouvoir devenir plus tard une base secondaire.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: tail, text: { en: "On SQL1, back up the tail of the log of ErpDb WITH NORECOVERY.", fr: "Sur SQL1, sauvegarder la fin du journal de ErpDb WITH NORECOVERY." } }
    - { id: restoretail, text: { en: "On SQL2, restore the tail-log backup WITH RECOVERY.", fr: "Sur SQL2, restaurer la sauvegarde de la fin du journal WITH RECOVERY." } }
    - { id: redirect, text: { en: "Redirect the applications to SQL2.", fr: "Rediriger les applications vers SQL2." } }
    - { id: copyonly, text: { en: "On SQL1, back up the log of ErpDb WITH COPY_ONLY.", fr: "Sur SQL1, sauvegarder le journal de ErpDb WITH COPY_ONLY." } }
    - { id: standby, text: { en: "On SQL2, restore the tail-log backup WITH STANDBY.", fr: "Sur SQL2, restaurer la sauvegarde de la fin du journal WITH STANDBY." } }
    - { id: recover1, text: { en: "On SQL1, run RESTORE DATABASE ErpDb WITH RECOVERY.", fr: "Sur SQL1, exécuter RESTORE DATABASE ErpDb WITH RECOVERY." } }
answer:
  sequence: [ tail, restoretail, redirect ]
explanation:
  correct:
    en: A tail-log backup taken WITH NORECOVERY captures the last transactions of ErpDb and leaves the database on SQL1 in the restoring state, ready to receive log backups from the new primary later. Restoring that backup on SQL2 WITH RECOVERY applies the last transactions and brings the database online. Log shipping has no listener, so you then redirect the applications to SQL2.
    fr: Une sauvegarde de la fin du journal effectuée WITH NORECOVERY capture les dernières transactions de ErpDb et laisse la base sur SQL1 en état de restauration, prête à recevoir plus tard les sauvegardes du journal du nouveau primaire. Restaurer cette sauvegarde sur SQL2 WITH RECOVERY applique les dernières transactions et met la base en ligne. La copie des journaux de transaction n'a pas d'écouteur ; vous redirigez donc ensuite les applications vers SQL2.
  options:
    copyonly: { en: "A copy-only log backup doesn't leave ErpDb in the restoring state, so new transactions could still be written on SQL1.", fr: "Une sauvegarde du journal en copie seule ne laisse pas ErpDb en état de restauration : de nouvelles transactions pourraient encore être écrites sur SQL1." }
    standby: { en: "WITH STANDBY leaves the database read-only; it doesn't make SQL2 a writable primary.", fr: "WITH STANDBY laisse la base en lecture seule ; cela ne fait pas de SQL2 un primaire accessible en écriture." }
    recover1: { en: "Recovering ErpDb on SQL1 brings it back online, which is the opposite of the requirement.", fr: "Récupérer ErpDb sur SQL1 la remet en ligne, ce qui est l'inverse de l'exigence." }
references:
  - title: Fail Over to a Log Shipping Secondary (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/fail-over-to-a-log-shipping-secondary-sql-server
