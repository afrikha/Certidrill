id: dp300-5b-geo-tsql-add-secondary
objective: "5.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure SQL Database logical servers named **srv-sales** in West Europe and **srv-sales-dr** in North Europe. srv-sales hosts a database named **SalesDb**.

    You need to use Transact-SQL to configure active geo-replication of SalesDb to srv-sales-dr. Reporting users must be able to query the secondary.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux serveurs logiques Azure SQL Database nommés **srv-sales** en West Europe et **srv-sales-dr** en North Europe. srv-sales héberge une base de données nommée **SalesDb**.

    Vous devez utiliser Transact-SQL pour configurer la géoréplication active de SalesDb vers srv-sales-dr. Les utilisateurs des rapports doivent pouvoir interroger la base secondaire.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    -- Connected to srv-sales, database: [[where]]
    ALTER DATABASE [SalesDb]
        [[op]] ON SERVER [srv-sales-dr]
        WITH (ALLOW_CONNECTIONS = [[conn]]);
  slots:
    - id: where
      options:
        - { id: salesdb, text: SalesDb }
        - { id: master, text: master }
        - { id: tempdb, text: tempdb }
    - id: op
      options:
        - { id: add, text: ADD SECONDARY }
        - { id: remove, text: REMOVE SECONDARY }
        - { id: force, text: FORCE_FAILOVER_ALLOW_DATA_LOSS }
    - id: conn
      options:
        - { id: connno, text: "NO" }
        - { id: readonly, text: READ_ONLY }
        - { id: all, text: ALL }
answer:
  values: { where: master, op: add, conn: all }
explanation:
  correct:
    en: |
      Geo-replication statements run in the `master` database of the server that hosts the primary. `ADD SECONDARY ON SERVER` creates the geo-secondary and starts seeding, and `ALLOW_CONNECTIONS = ALL` makes it readable.
    fr: |
      Les instructions de géoréplication s'exécutent dans la base `master` du serveur qui héberge la base primaire. `ADD SECONDARY ON SERVER` crée la base secondaire géographique et lance l'amorçage, et `ALLOW_CONNECTIONS = ALL` la rend lisible.
  options:
    salesdb: { en: "ALTER DATABASE ... ADD SECONDARY must be run from master, not from the user database.", fr: "ALTER DATABASE ... ADD SECONDARY doit être exécuté depuis master, pas depuis la base utilisateur." }
    remove: { en: "REMOVE SECONDARY terminates an existing replication link.", fr: "REMOVE SECONDARY met fin à un lien de réplication existant." }
    force: { en: "FORCE_FAILOVER_ALLOW_DATA_LOSS promotes an existing secondary and is run on the secondary server.", fr: "FORCE_FAILOVER_ALLOW_DATA_LOSS promeut une base secondaire existante et s'exécute sur le serveur secondaire." }
    connno: { en: "NO creates a secondary that doesn't accept connections.", fr: "NO crée une base secondaire qui n'accepte pas de connexions." }
    readonly: { en: "READ_ONLY is an availability group replica setting, not a value of ALLOW_CONNECTIONS for geo-replication.", fr: "READ_ONLY est un paramètre de réplica de groupe de disponibilité, pas une valeur d'ALLOW_CONNECTIONS pour la géoréplication." }
references:
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
