id: dp300-5a-mi-regional-dr
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1** in the France Central region. MI1 hosts 12 user databases that are used by the same application.

    You need to protect the application against a regional outage. All the databases must fail over together, and the application must keep the same connection string after a failover.

    What should you configure?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1** dans la région France Central. MI1 héberge 12 bases de données utilisateur utilisées par la même application.

    Vous devez protéger l'application contre une panne régionale. Toutes les bases doivent basculer ensemble, et l'application doit conserver la même chaîne de connexion après un basculement.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Active geo-replication of each database to a managed instance in France South", fr: "La géoréplication active de chaque base vers une instance managée dans France South" } }
    - { id: b, text: { en: "Zone redundancy on MI1", fr: "La redondance interzone sur MI1" } }
    - { id: c, text: { en: "A failover group between MI1 and a managed instance in France South", fr: "Un groupe de basculement entre MI1 et une instance managée dans France South" } }
    - { id: d, text: { en: "Geo-restore of each database to a managed instance in France South", fr: "La géorestauration de chaque base vers une instance managée dans France South" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A failover group on SQL Managed Instance replicates all the user databases of the instance to a secondary instance in another region, and fails them over as a unit. The read-write listener always points to the current primary, so the connection string doesn't change.
    fr: |
      Un groupe de basculement sur SQL Managed Instance réplique toutes les bases utilisateur de l'instance vers une instance secondaire dans une autre région, et les fait basculer en bloc. L'écouteur en lecture-écriture pointe toujours vers le primaire actuel : la chaîne de connexion ne change pas.
  options:
    a: { en: "Active geo-replication is a feature of Azure SQL Database; on SQL Managed Instance, geo-replication is provided by failover groups.", fr: "La géoréplication active est une fonctionnalité d'Azure SQL Database ; sur SQL Managed Instance, la géoréplication est fournie par les groupes de basculement." }
    b: { en: "Zone redundancy protects against an availability zone failure inside France Central, not against a regional outage.", fr: "La redondance interzone protège contre la panne d'une zone de disponibilité dans France Central, pas contre une panne régionale." }
    d: { en: "Geo-restore creates new databases on another instance, with a new connection string and an RTO of hours.", fr: "La géorestauration crée de nouvelles bases sur une autre instance, avec une nouvelle chaîne de connexion et un RTO de plusieurs heures." }
references:
  - title: Failover groups overview & best practices - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/failover-group-sql-mi
