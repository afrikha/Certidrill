id: dp300-cs2c-dr-drill
objective: "5.1.4"
type: single
caseStudy: dp300-cs2c-adatum-learning
difficulty: 2
status: draft
stem:
  en: |
    You need to plan the first step of the disaster recovery drill for Enrollment to meet the disaster recovery requirements.

    What should you do?
  fr: |
    Vous devez planifier la première étape de l'exercice de reprise d'activité d'Enrollment pour satisfaire les exigences de reprise d'activité.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Connect to the master database of sql-adl-weu, and run ALTER DATABASE [Enrollment] FAILOVER.", fr: "Se connecter à la base de données master de sql-adl-weu, et exécuter ALTER DATABASE [Enrollment] FAILOVER." } }
    - { id: b, text: { en: "Connect to the master database of sql-adl-neu, and run ALTER DATABASE [Enrollment] FORCE_FAILOVER_ALLOW_DATA_LOSS.", fr: "Se connecter à la base de données master de sql-adl-neu, et exécuter ALTER DATABASE [Enrollment] FORCE_FAILOVER_ALLOW_DATA_LOSS." } }
    - { id: c, text: { en: "Connect to the master database of sql-adl-neu, and run ALTER DATABASE [Enrollment] FAILOVER.", fr: "Se connecter à la base de données master de sql-adl-neu, et exécuter ALTER DATABASE [Enrollment] FAILOVER." } }
    - { id: d, text: { en: "Geo-restore Enrollment to sql-adl-neu, and then point the applications to the restored database.", fr: "Effectuer une géorestauration d'Enrollment sur sql-adl-neu, puis rediriger les applications vers la base restaurée." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A planned geo-replication failover is started on the server that hosts the geo-secondary, from its master database. It completes a full data synchronization before switching the roles, so no committed transaction is lost, which makes it the recommended method for DR drills. Running the same command later on sql-adl-weu, the new secondary server, switches the roles back.
    fr: |
      Un basculement planifié de géoréplication se lance sur le serveur qui héberge le géo-secondaire, depuis sa base de données master. Il effectue une synchronisation complète des données avant d'inverser les rôles : aucune transaction validée n'est perdue, ce qui en fait la méthode recommandée pour les exercices de reprise d'activité. Exécuter plus tard la même commande sur sql-adl-weu, le nouveau serveur secondaire, inverse de nouveau les rôles.
  options:
    a: { en: "The failover command must run on the server that hosts the geo-secondary, not on the current primary server.", fr: "La commande de basculement doit s'exécuter sur le serveur qui héberge le géo-secondaire, pas sur le serveur primaire actuel." }
    b: { en: "A forced failover switches the roles without synchronization, so transactions not yet replicated are lost; it is meant for an unavailable primary.", fr: "Un basculement forcé inverse les rôles sans synchronisation : les transactions pas encore répliquées sont perdues ; il est prévu pour un primaire indisponible." }
    d: { en: "A geo-restore creates a new database from geo-replicated backups, which can miss the most recent transactions, and does not switch the geo-replication roles.", fr: "Une géorestauration crée une nouvelle base de données à partir des sauvegardes géorépliquées, qui peuvent ne pas contenir les transactions les plus récentes, et n'inverse pas les rôles de géoréplication." }
references:
  - title: Active Geo-Replication - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
