id: dp300-5c-mon-fog-who-failed-over
objective: "5.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a failover group named **fog-crm** in Azure SQL Database that uses the Microsoft managed failover policy. The primary server was **sql-crm-weu** and the secondary server was **sql-crm-neu**.

    After a regional outage in West Europe, sql-crm-neu is now the primary server. You need to determine whether the failover was initiated by Microsoft or by a member of your team.

    What should you review?
  fr: |
    Vous disposez d'un groupe de basculement nommé **fog-crm** dans Azure SQL Database qui utilise la stratégie de basculement gérée par Microsoft. Le serveur primaire était **sql-crm-weu** et le serveur secondaire était **sql-crm-neu**.

    Après une panne régionale dans la région West Europe, sql-crm-neu est désormais le serveur primaire. Vous devez déterminer si le basculement a été déclenché par Microsoft ou par un membre de votre équipe.

    Que devez-vous examiner ?
body:
  options:
    - { id: a, text: { en: "The output of sys.dm_geo_replication_link_status in the databases on sql-crm-neu", fr: "Le résultat de sys.dm_geo_replication_link_status dans les bases de sql-crm-neu" } }
    - { id: b, text: { en: "The Query Performance Insight page of the databases on sql-crm-neu", fr: "La page Query Performance Insight des bases de sql-crm-neu" } }
    - { id: c, text: { en: "The Failover Azure SQL failover group events in the Azure activity log", fr: "Les événements Failover Azure SQL failover group dans le journal d'activité Azure" } }
    - { id: d, text: { en: "The reliability recommendations of Azure Advisor for sql-crm-neu", fr: "Les recommandations de fiabilité d'Azure Advisor pour sql-crm-neu" } }
answer: { optionId: c }
explanation:
  correct:
    en: Every failover group failover is recorded in the activity log as Failover Azure SQL failover group. When Microsoft initiated it, the Event initiated by field shows a single hyphen (-) instead of the identity of a user or an application.
    fr: Chaque basculement de groupe de basculement est enregistré dans le journal d'activité sous le nom Failover Azure SQL failover group. Quand Microsoft l'a déclenché, le champ Event initiated by affiche un simple tiret (-) au lieu de l'identité d'un utilisateur ou d'une application.
  options:
    a: { en: "The view shows the current role and state of each replication link, not who triggered the role change.", fr: "La vue affiche le rôle et l'état actuels de chaque lien de réplication, pas l'auteur du changement de rôle." }
    b: { en: "Query Performance Insight analyzes the resource consumption of queries; it doesn't record failovers.", fr: "Query Performance Insight analyse la consommation de ressources des requêtes ; il n'enregistre pas les basculements." }
    d: { en: "Azure Advisor gives recommendations; it isn't an audit trail of operations.", fr: "Azure Advisor fournit des recommandations ; ce n'est pas une piste d'audit des opérations." }
references:
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
