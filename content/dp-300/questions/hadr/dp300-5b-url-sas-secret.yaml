id: dp300-5b-url-sas-secret
objective: "5.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. You uploaded a SQL Server backup file to a private container named **imports** in a storage account named **stwoodgrove**. You generated a shared access signature (SAS) token for the container with the read and list permissions, and you ran the following statement on MI1:

    ```sql
    CREATE CREDENTIAL [https://stwoodgrove.blob.core.windows.net/imports]
    WITH IDENTITY = 'SHARED ACCESS SIGNATURE',
         SECRET = '?sv=2025-01-05&ss=b&srt=co&sp=rl&se=2026-12-31&sig=...';
    ```

    `RESTORE FILELISTONLY FROM URL` fails with error 3201 and operating system error 86 ("The specified network password is not correct"). The token itself is valid and not expired.

    What should you do?
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. Vous avez chargé un fichier de sauvegarde SQL Server dans un conteneur privé nommé **imports** d'un compte de stockage nommé **stwoodgrove**. Vous avez généré pour le conteneur un jeton SAS (signature d'accès partagé) avec les autorisations de lecture et de liste, puis exécuté l'instruction suivante sur MI1 :

    ```sql
    CREATE CREDENTIAL [https://stwoodgrove.blob.core.windows.net/imports]
    WITH IDENTITY = 'SHARED ACCESS SIGNATURE',
         SECRET = '?sv=2025-01-05&ss=b&srt=co&sp=rl&se=2026-12-31&sig=...';
    ```

    `RESTORE FILELISTONLY FROM URL` échoue avec l'erreur 3201 et l'erreur de système d'exploitation 86 (« The specified network password is not correct »). Le jeton lui-même est valide et n'a pas expiré.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant your Microsoft Entra account the Storage Blob Data Reader role on stwoodgrove.", fr: "Attribuer à votre compte Microsoft Entra le rôle Storage Blob Data Reader sur stwoodgrove." } }
    - { id: b, text: { en: "Drop the credential, and re-create it with a secret that omits the leading question mark.", fr: "Supprimer les informations d'identification, puis les recréer avec un secret sans le point d'interrogation initial." } }
    - { id: c, text: { en: "Drop the credential, and re-create it with the storage account name as the identity and an access key as the secret.", fr: "Supprimer les informations d'identification, puis les recréer avec le nom du compte de stockage comme identité et une clé d'accès comme secret." } }
    - { id: d, text: { en: "Add WITH CREDENTIAL to the RESTORE FILELISTONLY statement to reference the credential by name.", fr: "Ajouter WITH CREDENTIAL à l'instruction RESTORE FILELISTONLY pour référencer les informations d'identification par leur nom." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For a SAS credential, the name is the container URL, the identity is `SHARED ACCESS SIGNATURE`, and the secret is the SAS token **without** its leading `?`. Error 3201 with operating system error 86 indicates a wrong credential: drop it and re-create it with the corrected secret.
    fr: |
      Pour des informations d'identification SAS, le nom est l'URL du conteneur, l'identité est `SHARED ACCESS SIGNATURE` et le secret est le jeton SAS **sans** son `?` initial. L'erreur 3201 accompagnée de l'erreur de système d'exploitation 86 signale des informations d'identification incorrectes : supprimez-les et recréez-les avec le secret corrigé.
  options:
    a: { en: "Restore from URL authenticates with the SAS in the credential, not with your Microsoft Entra account.", fr: "La restauration à partir d'une URL s'authentifie avec la SAS des informations d'identification, pas avec votre compte Microsoft Entra." }
    c: { en: "SQL Managed Instance doesn't support storage account access keys for backup and restore.", fr: "SQL Managed Instance ne prend pas en charge les clés d'accès du compte de stockage pour la sauvegarde et la restauration." }
    d: { en: "SQL Managed Instance matches the SAS credential by URL; the CREDENTIAL option is only for access-key credentials on SQL Server.", fr: "SQL Managed Instance associe les informations d'identification SAS par leur URL ; l'option CREDENTIAL ne sert qu'aux informations d'identification à clé d'accès sur SQL Server." }
references:
  - title: "Quickstart: Restore a database to Azure SQL Managed Instance with SSMS"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/restore-sample-database-quickstart
