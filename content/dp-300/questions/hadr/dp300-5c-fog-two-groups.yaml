id: dp300-5c-fog-two-groups
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-contoso-weu** in West Europe that hosts two databases named **SalesDb** and **HrDb**. A second logical server named **sql-contoso-neu** exists in North Europe.

    You need to protect both databases against a regional outage. The solution must meet the following requirements:

    - Applications must keep the same connection strings after a failover.
    - The operations team must be able to fail over SalesDb to North Europe without failing over HrDb.

    What should you do?
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-contoso-weu** dans la région West Europe, qui héberge deux bases de données nommées **SalesDb** et **HrDb**. Un second serveur logique nommé **sql-contoso-neu** existe dans la région North Europe.

    Vous devez protéger les deux bases de données contre une panne régionale. La solution doit répondre aux exigences suivantes :

    - Les applications doivent conserver les mêmes chaînes de connexion après un basculement.
    - L'équipe d'exploitation doit pouvoir basculer SalesDb vers North Europe sans basculer HrDb.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create one failover group that contains both databases, and set the failover policy of HrDb to Microsoft managed.", fr: "Créer un groupe de basculement qui contient les deux bases de données, et définir la stratégie de basculement de HrDb sur Gérée par Microsoft." }
    - id: b
      text: { en: "Configure active geo-replication for both databases, with sql-contoso-neu as the secondary server.", fr: "Configurer la géoréplication active pour les deux bases de données, avec sql-contoso-neu comme serveur secondaire." }
    - id: c
      text: { en: "Create two failover groups between the servers, one that contains SalesDb and one that contains HrDb.", fr: "Créer deux groupes de basculement entre les serveurs, l'un qui contient SalesDb et l'autre qui contient HrDb." }
    - id: d
      text: { en: "Create one failover group that contains both databases, and point the HrDb application to the read-only listener.", fr: "Créer un groupe de basculement qui contient les deux bases de données, et faire pointer l'application de HrDb vers l'écouteur en lecture seule." }
answer: { optionId: c }
explanation:
  correct:
    en: A logical server can host several failover groups, and each group fails over independently, which limits the scope of a failover. Two groups give SalesDb and HrDb their own listeners, which keep the same names after a failover, and let the team fail over SalesDb alone.
    fr: Un serveur logique peut héberger plusieurs groupes de basculement, et chaque groupe bascule indépendamment, ce qui limite la portée d'un basculement. Deux groupes donnent à SalesDb et à HrDb leurs propres écouteurs, dont le nom ne change pas après un basculement, et permettent à l'équipe de basculer SalesDb seule.
  options:
    a:
      en: The failover policy is a setting of the failover group, not of a database, and a failover always moves every database of the group.
      fr: La stratégie de basculement est un paramètre du groupe de basculement, pas d'une base de données, et un basculement déplace toujours toutes les bases du groupe.
    b:
      en: Active geo-replication fails over each database independently, but the endpoint changes to the secondary server, so the connection strings must change.
      fr: "La géoréplication active bascule chaque base indépendamment, mais le point de terminaison devient celui du serveur secondaire : les chaînes de connexion doivent changer."
    d:
      en: Both databases would still fail over together. The read-only listener sends read-only sessions to the secondary; it doesn't change the scope of a failover.
      fr: Les deux bases basculeraient toujours ensemble. L'écouteur en lecture seule envoie les sessions en lecture seule vers le secondaire ; il ne change pas la portée d'un basculement.
references:
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
