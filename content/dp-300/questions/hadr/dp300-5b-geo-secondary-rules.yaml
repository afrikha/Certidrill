id: dp300-5b-geo-secondary-rules
objective: "5.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **Catalog** on a logical server named **srv-shop**. Catalog uses the Business Critical service tier and a point-in-time restore retention of 28 days. You plan to protect and scale out Catalog by using active geo-replication.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Catalog** sur un serveur logique nommé **srv-shop**. Catalog utilise le niveau de service Business Critical et une rétention de restauration à un point dans le temps de 28 jours. Vous prévoyez de protéger Catalog et d'en répartir les lectures par géoréplication active.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can create four geo-secondaries of Catalog, each on a different logical server.
        fr: Vous pouvez créer quatre bases secondaires géographiques de Catalog, chacune sur un serveur logique différent.
    - id: s2
      text:
        en: Two geo-secondaries of Catalog can be placed in the same elastic pool.
        fr: Deux bases secondaires géographiques de Catalog peuvent être placées dans le même pool élastique.
    - id: s3
      text:
        en: Each geo-secondary of Catalog automatically uses a point-in-time restore retention of 28 days.
        fr: Chaque base secondaire géographique de Catalog utilise automatiquement une rétention de restauration à un point dans le temps de 28 jours.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Active geo-replication supports up to four geo-secondaries per primary. A pool belongs to a single logical server and database names must be unique on a server, so two secondaries of the same primary can never share a pool. The point-in-time restore retention isn't replicated: a geo-secondary defaults to seven days, so you must set it to match the primary.
    fr: |
      La géoréplication active prend en charge jusqu'à quatre bases secondaires géographiques par base primaire. Un pool appartient à un seul serveur logique et les noms de bases doivent être uniques sur un serveur : deux bases secondaires de la même primaire ne peuvent donc jamais partager un pool. La rétention de restauration à un point dans le temps n'est pas répliquée : une base secondaire utilise sept jours par défaut, et vous devez l'aligner sur la base primaire.
references:
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
