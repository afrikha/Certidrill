id: dp300-5a-compliance-seven-years
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has an Azure SQL database named **LoansDb**. A new regulation requires Woodgrove to keep one backup of LoansDb per month for seven years. The current point-in-time restore retention of 14 days must not change.

    You need to meet the regulatory requirement. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Woodgrove dispose d'une base de données Azure SQL nommée **LoansDb**. Une nouvelle réglementation impose à Woodgrove de conserver une sauvegarde de LoansDb par mois pendant sept ans. La rétention actuelle de restauration à un point dans le temps de 14 jours ne doit pas changer.

    Vous devez satisfaire l'exigence réglementaire. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A point-in-time restore retention of 2,555 days", fr: "Une rétention de restauration à un point dans le temps de 2 555 jours" } }
    - { id: b, text: { en: "Geo-zone-redundant backup storage", fr: "Un stockage de sauvegarde géoredondant interzone" } }
    - { id: c, text: { en: "A long-term retention policy with a monthly retention of seven years", fr: "Une stratégie de rétention à long terme avec une rétention mensuelle de sept ans" } }
    - { id: d, text: { en: "An Azure Backup policy in a Recovery Services vault", fr: "Une stratégie Sauvegarde Azure dans un coffre Recovery Services" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Long-term retention (LTR) copies automated full backups to separate storage and keeps weekly, monthly or yearly backups for up to 10 years. A monthly retention of seven years (P7Y) keeps the first backup of each month, without changing the PITR retention.
    fr: |
      La rétention à long terme (LTR) copie les sauvegardes complètes automatiques vers un stockage distinct et conserve des sauvegardes hebdomadaires, mensuelles ou annuelles jusqu'à 10 ans. Une rétention mensuelle de sept ans (P7Y) conserve la première sauvegarde de chaque mois, sans modifier la rétention PITR.
  options:
    a: { en: "PITR retention is limited to 35 days, and the requirement says it must stay at 14 days.", fr: "La rétention PITR est limitée à 35 jours, et l'exigence impose de la garder à 14 jours." }
    b: { en: "Backup storage redundancy decides where backups are copied, not how long they're kept.", fr: "La redondance du stockage de sauvegarde détermine où les sauvegardes sont copiées, pas leur durée de conservation." }
    d: { en: "Azure Backup protects SQL Server on Azure VMs; Azure SQL Database backups are managed by the service itself.", fr: "Sauvegarde Azure protège SQL Server sur des machines virtuelles Azure ; les sauvegardes d'Azure SQL Database sont gérées par le service lui-même." }
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
