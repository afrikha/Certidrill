id: dp300-5b-ag-vm-sequence
objective: "5.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure virtual machines named **SQLVM1** and **SQLVM2** that run SQL Server 2022 Enterprise on Windows Server 2022. Each virtual machine is in a different subnet of the same virtual network, has two secondary IP addresses, and is joined to an Active Directory domain. The Failover Clustering feature is installed on both virtual machines. A database named **Claims** on SQLVM1 uses the FULL recovery model and has a full backup. The cluster quorum will be configured separately.

    You need to configure an Always On availability group for Claims that clients reach through a listener, without a load balancer.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de deux machines virtuelles Azure nommées **SQLVM1** et **SQLVM2** qui exécutent SQL Server 2022 Enterprise sur Windows Server 2022. Chaque machine virtuelle se trouve dans un sous-réseau différent du même réseau virtuel, possède deux adresses IP secondaires et est jointe à un domaine Active Directory. La fonctionnalité Clustering de basculement est installée sur les deux machines virtuelles. Une base de données nommée **Claims** sur SQLVM1 utilise le mode de récupération FULL et dispose d'une sauvegarde complète. Le quorum du cluster sera configuré séparément.

    Vous devez configurer pour Claims un groupe de disponibilité Always On que les clients joignent par un écouteur, sans équilibreur de charge.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: cluster, text: { en: "Create a Windows Server failover cluster that contains SQLVM1 and SQLVM2.", fr: "Créer un cluster de basculement Windows Server qui contient SQLVM1 et SQLVM2." } }
    - { id: enable, text: { en: "Enable Always On availability groups in SQL Server Configuration Manager on both instances, and restart the SQL Server service.", fr: "Activer les groupes de disponibilité Always On dans le Gestionnaire de configuration SQL Server sur les deux instances, puis redémarrer le service SQL Server." } }
    - { id: ag, text: { en: "Create the availability group with SQLVM1 and SQLVM2 as synchronous-commit replicas with automatic failover.", fr: "Créer le groupe de disponibilité avec SQLVM1 et SQLVM2 comme réplicas à validation synchrone avec basculement automatique." } }
    - { id: listener, text: { en: "Add a listener that has one static IP address in each subnet.", fr: "Ajouter un écouteur qui possède une adresse IP statique dans chaque sous-réseau." } }
    - { id: lb, text: { en: "Create an internal load balancer with floating IP enabled for the listener.", fr: "Créer un équilibreur de charge interne avec l'adresse IP flottante activée pour l'écouteur." } }
    - { id: fci, text: { en: "Install SQL Server as a failover cluster instance on SQLVM1.", fr: "Installer SQL Server en tant qu'instance de cluster de basculement sur SQLVM1." } }
answer:
  sequence: [ cluster, enable, ag, listener ]
explanation:
  correct:
    en: |
      Availability groups depend on a Windows Server failover cluster, so you create the cluster first; the Always On feature can then be enabled on each instance (it requires a restart). You create the availability group, and then its listener: in a multi-subnet deployment, the listener gets one IP address per subnet, so no load balancer or distributed network name is needed.
    fr: |
      Les groupes de disponibilité reposent sur un cluster de basculement Windows Server : vous créez donc d'abord le cluster, puis vous pouvez activer la fonctionnalité Always On sur chaque instance (un redémarrage est nécessaire). Vous créez ensuite le groupe de disponibilité, puis son écouteur : dans un déploiement multi-sous-réseau, l'écouteur reçoit une adresse IP par sous-réseau, si bien qu'aucun équilibreur de charge ni nom de réseau distribué n'est nécessaire.
  options:
    lb: { en: "A load balancer is needed only for a VNN listener in a single subnet.", fr: "Un équilibreur de charge n'est nécessaire que pour un écouteur VNN dans un seul sous-réseau." }
    fci: { en: "A failover cluster instance uses shared storage; it isn't part of an availability group deployment.", fr: "Une instance de cluster de basculement utilise un stockage partagé ; elle ne fait pas partie d'un déploiement de groupe de disponibilité." }
references:
  - title: "Tutorial: Configure an availability group in multiple subnets (SQL Server on Azure VMs)"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-manually-configure-tutorial-multi-subnet
  - title: Always On availability group on SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-overview
