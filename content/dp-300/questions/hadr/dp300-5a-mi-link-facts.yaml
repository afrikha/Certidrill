id: dp300-5a-mi-link-facts
objective: "5.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an on-premises instance named **SQL2** that runs SQL Server 2022 Standard. SQL2 hosts a database named **StockDb**, several SQL Server Agent jobs and SQL Server logins.

    You plan to use the Managed Instance link to replicate StockDb to an Azure SQL managed instance named **MI1** for disaster recovery. MI1 won't run any workload unless a disaster occurs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une instance locale nommée **SQL2** qui exécute SQL Server 2022 Standard. SQL2 héberge une base de données nommée **StockDb**, plusieurs travaux SQL Server Agent et des connexions SQL Server.

    Vous prévoyez d'utiliser le lien Managed Instance pour répliquer StockDb vers une instance managée Azure SQL nommée **MI1** à des fins de récupération d'urgence. MI1 n'exécutera aucune charge de travail, sauf en cas de sinistre.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The link replicates the SQL Server Agent jobs and the logins of SQL2 to MI1.
        fr: |
          Le lien réplique les travaux SQL Server Agent et les connexions de SQL2 vers MI1.
    - id: s2
      text:
        en: |
          MI1 can also be part of a failover group with a managed instance in another Azure region.
        fr: |
          MI1 peut aussi faire partie d'un groupe de basculement avec une instance managée dans une autre région Azure.
    - id: s3
      text:
        en: |
          If you designate MI1 as a passive disaster recovery replica, you don't pay SQL Server license costs for its vCores.
        fr: |
          Si vous désignez MI1 comme réplica passif de récupération d'urgence, vous ne payez pas de coûts de licence SQL Server pour ses vCores.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      The link replicates user databases only; logins, SQL Server Agent jobs and other server-level objects must be recreated on MI1. An instance that uses the link can't be part of a failover group, and the reverse is also true. A managed instance designated as a passive DR replica benefits from the hybrid failover benefit, so its vCores carry no SQL Server license charge.
    fr: |
      Le lien ne réplique que les bases de données utilisateur ; les connexions, les travaux SQL Server Agent et les autres objets de niveau serveur doivent être recréés sur MI1. Une instance qui utilise le lien ne peut pas faire partie d'un groupe de basculement, et inversement. Une instance managée désignée comme réplica passif de récupération d'urgence bénéficie de l'avantage de basculement hybride : ses vCores n'entraînent aucun frais de licence SQL Server.
references:
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
