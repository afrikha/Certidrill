id: dp300-5a-paas-backup-statements
objective: "5.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind has an Azure SQL database named **ShopDb** in the General Purpose service tier (vCore). ShopDb uses geo-redundant backup storage and the default backup settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une base de données Azure SQL nommée **ShopDb** dans le niveau de service General Purpose (vCore). ShopDb utilise un stockage de sauvegarde géoredondant et les paramètres de sauvegarde par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If you change the backup storage redundancy of ShopDb to locally redundant, its existing backups are moved to locally redundant storage.
        fr: |
          Si vous passez la redondance du stockage de sauvegarde de ShopDb en stockage localement redondant, ses sauvegardes existantes sont déplacées vers un stockage localement redondant.
    - id: s2
      text:
        en: |
          You can set the point-in-time restore retention of ShopDb to 35 days.
        fr: |
          Vous pouvez définir la rétention de restauration à un point dans le temps de ShopDb sur 35 jours.
    - id: s3
      text:
        en: |
          A differential backup of ShopDb is taken every 12 hours.
        fr: |
          Une sauvegarde différentielle de ShopDb est effectuée toutes les 12 heures.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A change of backup storage redundancy applies to future backups only; existing backups stay where they are until their retention expires. The PITR retention ranges from 1 to 35 days in every tier except Basic. In the vCore purchasing model, differential backups run every 12 hours by default, versus 24 hours for DTU.
    fr: |
      Un changement de redondance du stockage de sauvegarde ne s'applique qu'aux sauvegardes futures ; les sauvegardes existantes restent en place jusqu'à l'expiration de leur rétention. La rétention PITR va de 1 à 35 jours dans tous les niveaux sauf Basic. Dans le modèle d'achat vCore, les sauvegardes différentielles ont lieu toutes les 12 heures par défaut, contre 24 heures en DTU.
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
