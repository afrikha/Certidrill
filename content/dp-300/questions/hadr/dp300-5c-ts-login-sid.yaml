id: dp300-5c-ts-login-sid
objective: "5.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a failover group named **fog-hr** in Azure SQL Database between **sql-hr-weu** (primary) and **sql-hr-neu** (secondary). The group contains a database named **HrDb**. An application named **HrApp** connects through the read-write listener by using a SQL login named **hrapp** that is mapped to a database user in HrDb.

    Before the failover group was created, you created a login named hrapp on sql-hr-neu with the same password as on sql-hr-weu. The server-level firewall rules are identical on both servers.

    After a planned failover, HrApp fails with error 18456: Login failed for user 'hrapp'. You need to resolve the issue. The solution must also work after a failback.

    What should you do?
  fr: |
    Vous disposez d'un groupe de basculement nommé **fog-hr** dans Azure SQL Database entre **sql-hr-weu** (primaire) et **sql-hr-neu** (secondaire). Le groupe contient une base de données nommée **HrDb**. Une application nommée **HrApp** se connecte par l'écouteur en lecture-écriture avec une connexion SQL nommée **hrapp** associée à un utilisateur de base de données dans HrDb.

    Avant la création du groupe de basculement, vous avez créé une connexion nommée hrapp sur sql-hr-neu avec le même mot de passe que sur sql-hr-weu. Les règles de pare-feu au niveau du serveur sont identiques sur les deux serveurs.

    Après un basculement planifié, HrApp échoue avec l'erreur 18456 : Login failed for user 'hrapp'. Vous devez résoudre le problème. La solution doit aussi fonctionner après une restauration automatique.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a server-level IP firewall rule for the HrApp servers on sql-hr-neu.", fr: "Ajouter une règle de pare-feu IP au niveau du serveur pour les serveurs de HrApp sur sql-hr-neu." } }
    - { id: b, text: { en: "Enable failover of the read-only listener of fog-hr.", fr: "Activer le basculement de l'écouteur en lecture seule de fog-hr." } }
    - { id: c, text: { en: "Change the HrApp connection string to use sql-hr-neu.database.windows.net.", fr: "Modifier la chaîne de connexion de HrApp pour utiliser sql-hr-neu.database.windows.net." } }
    - { id: d, text: { en: "Re-create the hrapp login on sql-hr-neu with the SID of the hrapp login on sql-hr-weu.", fr: "Recréer la connexion hrapp sur sql-hr-neu avec le SID de la connexion hrapp de sql-hr-weu." } }
answer: { optionId: d }
explanation:
  correct:
    en: A database user is mapped to a login by its SID, not by its name. The login created on sql-hr-neu received a new SID, so it doesn't match the user replicated in HrDb. Re-creating it with CREATE LOGIN ... WITH PASSWORD = ..., SID = ... and the SID read from sys.sql_logins on sql-hr-weu makes the mapping work on both servers, whatever the role of each.
    fr: "Un utilisateur de base de données est associé à une connexion par son SID, pas par son nom. La connexion créée sur sql-hr-neu a reçu un nouveau SID : elle ne correspond pas à l'utilisateur répliqué dans HrDb. La recréer avec CREATE LOGIN ... WITH PASSWORD = ..., SID = ... et le SID lu dans sys.sql_logins sur sql-hr-weu rend l'association valide sur les deux serveurs, quel que soit leur rôle."
  options:
    a: { en: "The firewall rules are already identical, and a firewall block returns a different error than a failed login.", fr: "Les règles de pare-feu sont déjà identiques, et un blocage du pare-feu renvoie une autre erreur qu'un échec de connexion." }
    b: { en: "The read-only listener only serves read-only sessions; HrApp uses the read-write listener.", fr: "L'écouteur en lecture seule ne sert que les sessions en lecture seule ; HrApp utilise l'écouteur en lecture-écriture." }
    c: { en: "The listener already reaches sql-hr-neu; the login would fail the same way, and the connection string would break after a failback.", fr: "L'écouteur atteint déjà sql-hr-neu ; la connexion échouerait de la même façon, et la chaîne de connexion ne fonctionnerait plus après une restauration automatique." }
references:
  - title: Configure and manage Azure SQL Database security for geo-restore or failover
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-security-configure
