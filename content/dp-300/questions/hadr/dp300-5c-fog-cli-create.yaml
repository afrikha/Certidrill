id: dp300-5c-fog-cli-create
objective: "5.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure SQL Database logical servers in a resource group named **rg-data**:

    - **sql-orders-weu** in West Europe, which hosts a database named **OrdersDb**
    - **sql-orders-neu** in North Europe

    You need to create a failover group named **fog-orders** that contains OrdersDb, with sql-orders-weu as the primary server. Your team must decide when a failover occurs. Later, you must run a planned failover drill to North Europe.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux serveurs logiques Azure SQL Database dans un groupe de ressources nommé **rg-data** :

    - **sql-orders-weu** dans la région West Europe, qui héberge une base de données nommée **OrdersDb**
    - **sql-orders-neu** dans la région North Europe

    Vous devez créer un groupe de basculement nommé **fog-orders** qui contient OrdersDb, avec sql-orders-weu comme serveur primaire. Votre équipe doit décider du moment d'un basculement. Plus tard, vous devrez effectuer un exercice de basculement planifié vers North Europe.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql failover-group [[verb]] --name fog-orders --resource-group rg-data \
      --server sql-orders-weu --partner-server sql-orders-neu \
      --add-db OrdersDb --failover-policy [[policy]]

    # Planned failover drill
    az sql failover-group set-primary --name fog-orders --resource-group rg-data \
      --server [[target]]
  slots:
    - id: verb
      options:
        - { id: create, text: create }
        - { id: update, text: update }
        - { id: list, text: list }
    - id: policy
      options:
        - { id: manual, text: Manual }
        - { id: automatic, text: Automatic }
        - { id: disabled, text: Disabled }
    - id: target
      options:
        - { id: weu, text: sql-orders-weu }
        - { id: neu, text: sql-orders-neu }
        - { id: fog, text: fog-orders }
answer:
  values: { verb: create, policy: manual, target: neu }
explanation:
  correct:
    en: "`az sql failover-group create` creates the group on the primary server and takes `--partner-server` and `--add-db`. The `Manual` policy is the customer managed policy: your team initiates every failover. `set-primary` runs against the secondary server that must become the primary, here sql-orders-neu; without `--allow-data-loss` it performs a planned failover that synchronizes the databases first."
    fr: "`az sql failover-group create` crée le groupe sur le serveur primaire et accepte `--partner-server` et `--add-db`. La stratégie `Manual` est la stratégie gérée par le client : votre équipe déclenche chaque basculement. `set-primary` s'exécute sur le serveur secondaire qui doit devenir primaire, ici sql-orders-neu ; sans `--allow-data-loss`, il effectue un basculement planifié qui synchronise d'abord les bases."
  options:
    update: { en: "update modifies an existing group and doesn't accept --partner-server.", fr: "update modifie un groupe existant et n'accepte pas --partner-server." }
    list: { en: "list only returns the failover groups of a server.", fr: "list renvoie seulement les groupes de basculement d'un serveur." }
    automatic: { en: "Automatic is the Microsoft managed policy: Microsoft decides when to fail over during a widespread regional outage.", fr: "Automatic est la stratégie gérée par Microsoft : Microsoft décide du basculement lors d'une panne régionale étendue." }
    disabled: { en: "Disabled is a value of --ro-failover-policy (read-only listener), not of --failover-policy.", fr: "Disabled est une valeur de --ro-failover-policy (écouteur en lecture seule), pas de --failover-policy." }
    weu: { en: "sql-orders-weu is already the primary; the command targets the server that becomes the primary.", fr: "sql-orders-weu est déjà le primaire ; la commande cible le serveur qui devient primaire." }
    fog: { en: "--server expects a logical server name, not the failover group name.", fr: "--server attend un nom de serveur logique, pas le nom du groupe de basculement." }
references:
  - title: az sql failover-group
    url: https://learn.microsoft.com/en-us/cli/azure/sql/failover-group
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
