id: dp300-5c-fog-sqldb-facts
objective: "5.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-fab-eus** in East US that hosts an elastic pool named **pool-apps**. You plan to add the databases of pool-apps to a failover group named **fog-apps** whose secondary server is **sql-fab-wus** in West US.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-fab-eus** dans la région East US, qui héberge un pool élastique nommé **pool-apps**. Vous prévoyez d'ajouter les bases de données de pool-apps à un groupe de basculement nommé **fog-apps** dont le serveur secondaire est **sql-fab-wus** dans la région West US.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: sql-fab-wus must contain an elastic pool named pool-apps before you add the pooled databases to fog-apps.
        fr: sql-fab-wus doit contenir un pool élastique nommé pool-apps avant que vous ajoutiez les bases du pool à fog-apps.
    - id: s2
      text:
        en: If you select the Microsoft managed failover policy, you can set the grace period to 30 minutes.
        fr: Si vous sélectionnez la stratégie de basculement gérée par Microsoft, vous pouvez définir la période de grâce sur 30 minutes.
    - id: s3
      text:
        en: After a forced failover to sql-fab-wus, sql-fab-eus automatically rejoins fog-apps as the secondary when the outage is resolved.
        fr: Après un basculement forcé vers sql-fab-wus, sql-fab-eus rejoint automatiquement fog-apps comme secondaire une fois la panne résolue.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: For pooled databases, the secondary server needs an elastic pool with exactly the same name and enough free capacity; the secondaries are created in that pool. The grace period of the Microsoft managed policy can't be lower than one hour. After a forced failover, the old primary reconnects automatically as a new secondary once the outage is over; moving the primary role back requires a planned failover.
    fr: "Pour des bases en pool, le serveur secondaire a besoin d'un pool élastique portant exactement le même nom et disposant d'une capacité libre suffisante ; les secondaires sont créés dans ce pool. La période de grâce de la stratégie gérée par Microsoft ne peut pas être inférieure à une heure. Après un basculement forcé, l'ancien primaire se reconnecte automatiquement comme nouveau secondaire une fois la panne terminée ; pour lui rendre le rôle primaire, il faut un basculement planifié."
references:
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
  - title: Configure a Failover Group - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-configure-sql-db
