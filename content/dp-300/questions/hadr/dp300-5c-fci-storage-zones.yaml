id: dp300-5c-fci-storage-zones
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You plan to deploy a two-node SQL Server 2022 failover cluster instance (FCI) on Azure virtual machines that run Windows Server 2022.

    The solution must meet the following requirements:

    - The two virtual machines must be in different availability zones of the same region.
    - A database of the FCI uses FILESTREAM.

    Which shared storage should you use for the FCI?
  fr: |
    Vous prévoyez de déployer une instance de cluster de basculement (FCI) SQL Server 2022 à deux nœuds sur des machines virtuelles Azure qui exécutent Windows Server 2022.

    La solution doit répondre aux exigences suivantes :

    - Les deux machines virtuelles doivent se trouver dans des zones de disponibilité différentes de la même région.
    - Une base de données de la FCI utilise FILESTREAM.

    Quel stockage partagé devez-vous utiliser pour la FCI ?
body:
  options:
    - { id: a, text: { en: "Premium file shares in Azure Files", fr: "Des partages de fichiers Premium dans Azure Files" } }
    - { id: b, text: { en: "Storage Spaces Direct", fr: "Espaces de stockage direct (Storage Spaces Direct)" } }
    - { id: c, text: { en: "Azure shared disks that use Premium SSD ZRS", fr: "Des disques partagés Azure qui utilisent Premium SSD ZRS" } }
    - { id: d, text: { en: "Azure shared disks that use Ultra Disk", fr: "Des disques partagés Azure qui utilisent Ultra Disk" } }
answer: { optionId: c }
explanation:
  correct:
    en: Azure shared disks support FILESTREAM, and Premium SSD with zone-redundant storage (ZRS) can be shared by virtual machines in different availability zones. This is the only option that meets both requirements.
    fr: Les disques partagés Azure prennent en charge FILESTREAM, et Premium SSD avec un stockage redondant interzone (ZRS) peut être partagé par des machines virtuelles situées dans des zones de disponibilité différentes. C'est la seule option qui répond aux deux exigences.
  options:
    a: { en: "Premium file shares work across availability zones, but they don't support FILESTREAM.", fr: "Les partages de fichiers Premium fonctionnent entre zones de disponibilité, mais ne prennent pas en charge FILESTREAM." }
    b: { en: "Storage Spaces Direct supports FILESTREAM, but only virtual machines in an availability set, not in availability zones.", fr: "Les espaces de stockage direct prennent en charge FILESTREAM, mais uniquement avec des machines virtuelles dans un groupe à haute disponibilité, pas dans des zones de disponibilité." }
    d: { en: "A shared Ultra Disk requires all the virtual machines to be in the same availability zone.", fr: "Un Ultra Disk partagé exige que toutes les machines virtuelles soient dans la même zone de disponibilité." }
references:
  - title: Failover cluster instances - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/failover-cluster-instance-overview
