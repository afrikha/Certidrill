id: dp300-5b-pitr-mi-replace
objective: "5.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1** that hosts a database named **Tickets**. At 09:20, a script updated every row of a table in Tickets with wrong values.

    You need to return Tickets to its state at 09:15. Applications must keep connecting to a database named Tickets on MI1, and changes made after 09:15 can be discarded.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1** qui héberge une base de données nommée **Tickets**. À 09:20, un script a mis à jour toutes les lignes d'une table de Tickets avec des valeurs erronées.

    Vous devez ramener Tickets à son état de 09:15. Les applications doivent continuer à se connecter à une base de données nommée Tickets sur MI1, et les modifications postérieures à 09:15 peuvent être abandonnées.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run RESTORE DATABASE Tickets FROM URL with the REPLACE and STOPAT options.", fr: "Exécuter RESTORE DATABASE Tickets FROM URL avec les options REPLACE et STOPAT." } }
    - { id: b, text: { en: "Restore Tickets to 09:15 on MI1 as a new database named Tickets_0915.", fr: "Restaurer Tickets à 09:15 sur MI1 en tant que nouvelle base de données nommée Tickets_0915." } }
    - { id: c, text: { en: "Run RESTORE LOG Tickets WITH STOPAT set to 09:15.", fr: "Exécuter RESTORE LOG Tickets WITH STOPAT défini sur 09:15." } }
    - { id: d, text: { en: "Set the short-term retention policy of Tickets to 35 days.", fr: "Définir la stratégie de rétention à court terme de Tickets sur 35 jours." } }
    - { id: e, text: { en: "Drop Tickets, and then rename Tickets_0915 by running ALTER DATABASE ... MODIFY NAME.", fr: "Supprimer Tickets, puis renommer Tickets_0915 en exécutant ALTER DATABASE ... MODIFY NAME." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Point-in-time restore on SQL Managed Instance always creates a new database from the automated backups. To replace the original, you drop Tickets (portal, PowerShell, Azure CLI or `DROP DATABASE`) and rename the restored database with `ALTER DATABASE Tickets_0915 MODIFY NAME = Tickets`.
    fr: |
      Sur SQL Managed Instance, la restauration à un point dans le temps crée toujours une nouvelle base de données à partir des sauvegardes automatiques. Pour remplacer l'original, vous supprimez Tickets (portail, PowerShell, Azure CLI ou `DROP DATABASE`) puis vous renommez la base restaurée avec `ALTER DATABASE Tickets_0915 MODIFY NAME = Tickets`.
  options:
    a: { en: "RESTORE on a managed instance supports no WITH options, and automated backups aren't exposed as files in your storage.", fr: "RESTORE sur une instance managée ne prend en charge aucune option WITH, et les sauvegardes automatiques ne sont pas exposées sous forme de fichiers dans votre stockage." }
    c: { en: "SQL Managed Instance supports only RESTORE DATABASE from URL, not log restores of its automated backups; point-in-time restore goes through the portal, Azure CLI, PowerShell or REST.", fr: "SQL Managed Instance ne prend en charge que RESTORE DATABASE à partir d'une URL, pas la restauration des journaux de ses sauvegardes automatiques ; la restauration à un point dans le temps passe par le portail, Azure CLI, PowerShell ou REST." }
    d: { en: "09:15 is already within the retention period; a longer retention doesn't restore anything.", fr: "09:15 se trouve déjà dans la période de rétention ; une rétention plus longue ne restaure rien." }
references:
  - title: Restore a database in Azure SQL Managed Instance to a previous point in time
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/point-in-time-restore
