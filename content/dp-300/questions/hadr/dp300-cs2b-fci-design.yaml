id: dp300-cs2b-fci-design
objective: "5.3.4"
type: dropdown
caseStudy: dp300-cs2b-fabrikam-plants
difficulty: 3
status: draft
stem:
  en: |
    You need to design the shared storage and the client connectivity of MESFCI to meet the availability requirements.

    What should you use? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez concevoir le stockage partagé et la connectivité cliente de MESFCI pour satisfaire les exigences de disponibilité.

    Que devez-vous utiliser ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Shared storage: [[storage]]

      Client connectivity: [[conn]]
    fr: |
      Stockage partagé : [[storage]]

      Connectivité cliente : [[conn]]
  slots:
    - id: storage
      options:
        - { id: st_s2d, text: { en: "Storage Spaces Direct", fr: "Storage Spaces Direct" } }
        - { id: st_files, text: { en: "Premium file shares", fr: "Partages de fichiers Premium" } }
        - { id: st_disk, text: { en: "Azure shared disks (Premium SSD ZRS)", fr: "Disques partagés Azure (Premium SSD ZRS)" } }
        - { id: st_esan, text: { en: "Azure Elastic SAN", fr: "Azure Elastic SAN" } }
    - id: conn
      options:
        - { id: c_vnn, text: { en: "A virtual network name (VNN) with an internal Standard load balancer", fr: "Un nom de réseau virtuel (VNN) avec un équilibreur de charge Standard interne" } }
        - { id: c_dnn, text: { en: "A distributed network name (DNN)", fr: "Un nom de réseau distribué (DNN)" } }
        - { id: c_multi, text: { en: "A deployment of the nodes to multiple subnets", fr: "Un déploiement des nœuds dans plusieurs sous-réseaux" } }
answer:
  values: { storage: st_disk, conn: c_dnn }
explanation:
  correct:
    en: |
      Azure shared disks support FILESTREAM, and Premium SSD ZRS shared disks can be attached to nodes in different availability zones, so MESFCI survives a zone failure. With both nodes in one subnet, the FCI needs either a VNN with a load balancer or a DNN; the DNN (SQL Server 2019 CU2 and later) gives faster failover and removes the load balancer. FILESTREAM is supported with a DNN as long as the data is not accessed through file system APIs, which is the case at Fabrikam.
    fr: |
      Les disques partagés Azure prennent en charge FILESTREAM, et les disques partagés Premium SSD ZRS peuvent être attachés à des nœuds situés dans des zones de disponibilité différentes : MESFCI résiste à la défaillance d'une zone. Avec les deux nœuds dans un seul sous-réseau, la FCI a besoin d'un VNN avec un équilibreur de charge ou d'un DNN ; le DNN (SQL Server 2019 CU2 et versions ultérieures) offre un basculement plus rapide et supprime l'équilibreur de charge. FILESTREAM est pris en charge avec un DNN tant que les données ne sont pas lues par les API du système de fichiers, ce qui est le cas chez Fabrikam.
  options:
    st_s2d: { en: "Storage Spaces Direct does not support availability zones.", fr: "Storage Spaces Direct ne prend pas en charge les zones de disponibilité." }
    st_files: { en: "Premium file shares support availability zones but not FILESTREAM.", fr: "Les partages de fichiers Premium prennent en charge les zones de disponibilité, mais pas FILESTREAM." }
    st_esan: { en: "Azure Elastic SAN supports availability zones but not FILESTREAM.", fr: "Azure Elastic SAN prend en charge les zones de disponibilité, mais pas FILESTREAM." }
    c_vnn: { en: "A VNN in a single subnet needs an Azure load balancer, which the requirements exclude.", fr: "Un VNN dans un seul sous-réseau nécessite un équilibreur de charge Azure, ce que les exigences excluent." }
    c_multi: { en: "A multi-subnet deployment removes the need for a load balancer, but SQLN1 and SQLN2 must stay in snet-sql.", fr: "Un déploiement multisous-réseau supprime le besoin d'un équilibreur de charge, mais SQLN1 et SQLN2 doivent rester dans snet-sql." }
references:
  - title: Failover cluster instances - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/failover-cluster-instance-overview
  - title: Feature Interoperability with SQL Server FCI and DNN - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/failover-cluster-instance-dnn-interoperability
