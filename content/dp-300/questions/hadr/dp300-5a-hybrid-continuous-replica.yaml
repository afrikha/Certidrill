id: dp300-5a-hybrid-continuous-replica
objective: "5.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has an on-premises instance named **SQL4** that runs SQL Server 2022 Enterprise and hosts a database named **ErpDb**. SQL4 is a member of a Windows Server failover cluster. The datacenter is connected to Azure by a site-to-site VPN, and a replica domain controller runs in Azure.

    You need to recommend a disaster recovery solution in Azure for ErpDb. The secondary copy must receive changes continuously, not on a backup schedule.

    Which two solutions should you recommend? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une instance locale nommée **SQL4** qui exécute SQL Server 2022 Enterprise et héberge une base de données nommée **ErpDb**. SQL4 est membre d'un cluster de basculement Windows Server. Le centre de données est connecté à Azure par un VPN site à site, et un contrôleur de domaine réplica s'exécute dans Azure.

    Vous devez recommander une solution de récupération d'urgence dans Azure pour ErpDb. La copie secondaire doit recevoir les modifications en continu, et non selon une planification de sauvegardes.

    Quelles sont les deux solutions à recommander ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Log shipping to SQL Server on an Azure VM", fr: "La copie des journaux de transaction vers SQL Server sur une machine virtuelle Azure" } }
    - { id: b, text: { en: "A Managed Instance link to an Azure SQL managed instance", fr: "Un lien Managed Instance vers une instance managée Azure SQL" } }
    - { id: c, text: { en: "A nightly backup to URL, restored on an Azure VM", fr: "Une sauvegarde vers une URL chaque nuit, restaurée sur une machine virtuelle Azure" } }
    - { id: d, text: { en: "Active geo-replication to an Azure SQL database", fr: "La géoréplication active vers une base de données Azure SQL" } }
    - { id: e, text: { en: "An availability group with an asynchronous-commit replica on an Azure VM", fr: "Un groupe de disponibilité avec un réplica en validation asynchrone sur une machine virtuelle Azure" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The Managed Instance link uses distributed availability groups to stream the transaction log of ErpDb to SQL Managed Instance in near real time. An availability group replica on an Azure VM also receives log records continuously; the hybrid cluster is multi-subnet over the VPN, with a domain controller at the DR site and asynchronous commit to tolerate the latency.
    fr: |
      Le lien Managed Instance utilise des groupes de disponibilité distribués pour transmettre en temps quasi réel le journal des transactions de ErpDb à SQL Managed Instance. Un réplica de groupe de disponibilité sur une machine virtuelle Azure reçoit lui aussi les enregistrements du journal en continu ; le cluster hybride est multi-sous-réseau via le VPN, avec un contrôleur de domaine sur le site de secours et la validation asynchrone pour tolérer la latence.
  options:
    a: { en: "Log shipping copies and restores log backups on a schedule, so it doesn't replicate continuously.", fr: "La copie des journaux de transaction copie et restaure des sauvegardes de journal selon une planification : elle ne réplique pas en continu." }
    c: { en: "A nightly backup gives an RPO of up to a day and a scheduled, not continuous, copy.", fr: "Une sauvegarde nocturne donne un RPO pouvant atteindre une journée et une copie planifiée, non continue." }
    d: { en: "Active geo-replication works between Azure SQL Database databases; it can't use SQL Server as the primary.", fr: "La géoréplication active fonctionne entre bases Azure SQL Database ; elle ne peut pas utiliser SQL Server comme primaire." }
references:
  - title: Business continuity and HADR for SQL Server on Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/business-continuity-high-availability-disaster-recovery-hadr-overview
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
