id: dp300-5b-ltr-behavior
objective: "5.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription named **Sub1** that contains a logical server named **srv-ops**. A database named **Assets** on srv-ops has the following long-term retention policy: weekly retention `P4W`, monthly retention `P12M`, yearly retention `P10Y`, week of year 30.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un abonnement Azure nommé **Sub1** qui contient un serveur logique nommé **srv-ops**. Une base de données nommée **Assets** sur srv-ops a la stratégie de rétention à long terme suivante : rétention hebdomadaire `P4W`, rétention mensuelle `P12M`, rétention annuelle `P10Y`, semaine de l'année 30.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If Assets is deleted, its long-term retention backups are kept until their retention period ends.
        fr: Si Assets est supprimée, ses sauvegardes de rétention à long terme sont conservées jusqu'à la fin de leur période de rétention.
    - id: s2
      text:
        en: You can restore a long-term retention backup of Assets to a logical server in another subscription.
        fr: Vous pouvez restaurer une sauvegarde de rétention à long terme d'Assets sur un serveur logique d'un autre abonnement.
    - id: s3
      text:
        en: If you change the yearly retention to `P5Y`, the yearly backups already in long-term storage are kept for five years only.
        fr: Si vous changez la rétention annuelle en `P5Y`, les sauvegardes annuelles déjà présentes dans le stockage à long terme ne sont conservées que cinq ans.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Deleting a database doesn't delete its LTR backups: they stay for their configured period and can be restored to a server of the same subscription. LTR restores always target a server or instance in the same subscription as the original database. A policy change applies only to future backups; each existing backup keeps the retention that was in effect when it was created.
    fr: |
      La suppression d'une base de données ne supprime pas ses sauvegardes LTR : elles restent pendant la période configurée et peuvent être restaurées sur un serveur du même abonnement. Une restauration LTR cible toujours un serveur ou une instance du même abonnement que la base d'origine. Une modification de stratégie ne s'applique qu'aux sauvegardes futures ; chaque sauvegarde existante conserve la rétention en vigueur lors de sa création.
references:
  - title: Long-term retention backups - Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/long-term-retention-overview
