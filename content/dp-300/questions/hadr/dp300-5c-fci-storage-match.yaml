id: dp300-5c-fci-storage-match
objective: "5.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to deploy several SQL Server failover cluster instances (FCIs) on Azure virtual machines. Each FCI has its own requirements.

    Which shared storage should you use for each FCI? To answer, drag the appropriate storage options to the correct FCIs. Each storage option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de déployer plusieurs instances de cluster de basculement (FCI) SQL Server sur des machines virtuelles Azure. Chaque FCI a ses propres exigences.

    Quel stockage partagé devez-vous utiliser pour chaque FCI ? Pour répondre, faites glisser les options de stockage appropriées vers les FCI correspondantes. Chaque option de stockage peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: shared, text: { en: "Azure shared disks", fr: "Disques partagés Azure" } }
    - { id: pfs, text: { en: "Premium file shares", fr: "Partages de fichiers Premium" } }
    - { id: s2d, text: { en: "Storage Spaces Direct", fr: "Espaces de stockage direct" } }
    - { id: esan, text: Azure Elastic SAN }
  targets:
    - id: t1
      text: { en: "SQL Server 2014 FCI with nodes in two availability zones, on SMB file-based storage that can be resized without downtime", fr: "FCI SQL Server 2014 dont les nœuds sont dans deux zones de disponibilité, sur un stockage de fichiers SMB redimensionnable sans interruption" }
    - id: t2
      text: { en: "SQL Server 2019 FCI on Windows Server 2019 that must use a clustered MSDTC resource", fr: "FCI SQL Server 2019 sur Windows Server 2019 qui doit utiliser une ressource MSDTC en cluster" }
    - id: t3
      text: { en: "SQL Server 2019 FCI in an availability set that uses a software-based virtual SAN built from the disks of each node", fr: "FCI SQL Server 2019 dans un groupe à haute disponibilité qui utilise un SAN virtuel logiciel constitué des disques de chaque nœud" }
    - id: t4
      text: { en: "SQL Server 2022 FCI whose storage throughput must not be capped by the disk limits of the virtual machine size", fr: "FCI SQL Server 2022 dont le débit de stockage ne doit pas être plafonné par les limites de disque de la taille de machine virtuelle" }
answer:
  mapping: { t1: pfs, t2: shared, t3: s2d, t4: esan }
explanation:
  correct:
    en: Premium file shares are SMB shares that support SQL Server 2012 and later, availability zones and resizing without downtime. Azure shared disks are the only option that supports MSDTC (Windows Server 2019 and later). Storage Spaces Direct is a software-based virtual SAN that requires an availability set. Azure Elastic SAN throughput isn't limited by the VM disk limits, which lets smaller VM sizes reach the same throughput; it requires SQL Server 2022.
    fr: Les partages de fichiers Premium sont des partages SMB qui prennent en charge SQL Server 2012 et ultérieur, les zones de disponibilité et le redimensionnement sans interruption. Les disques partagés Azure sont la seule option qui prend en charge MSDTC (Windows Server 2019 et ultérieur). Les espaces de stockage direct forment un SAN virtuel logiciel qui exige un groupe à haute disponibilité. Le débit d'Azure Elastic SAN n'est pas limité par les limites de disque de la machine virtuelle, ce qui permet à des tailles plus petites d'atteindre le même débit ; il exige SQL Server 2022.
references:
  - title: Failover cluster instances - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/failover-cluster-instance-overview
