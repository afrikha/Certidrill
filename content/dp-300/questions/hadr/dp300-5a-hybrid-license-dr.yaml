id: dp300-5a-hybrid-license-dr
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an on-premises SQL Server 2022 Enterprise instance covered by Software Assurance. The instance is the primary replica of an availability group.

    You add a SQL Server 2022 Enterprise virtual machine named **VM-DR** in Azure as an asynchronous-commit secondary replica. VM-DR is passive: it serves no reads, no backups and no other workload.

    You need to minimize the SQL Server licensing cost of VM-DR.

    What should you do?
  fr: |
    Contoso dispose d'une instance SQL Server 2022 Enterprise locale couverte par la Software Assurance. L'instance est le réplica principal d'un groupe de disponibilité.

    Vous ajoutez dans Azure une machine virtuelle SQL Server 2022 Enterprise nommée **VM-DR** comme réplica secondaire en validation asynchrone. VM-DR est passive : elle ne sert ni lectures, ni sauvegardes, ni aucune autre charge de travail.

    Vous devez réduire au minimum le coût de licence SQL Server de VM-DR.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the SQL Server license of VM-DR to Pay as you go.", fr: "Définir la licence SQL Server de VM-DR sur Pay as you go." } }
    - { id: b, text: { en: "Set the SQL Server license of VM-DR to Azure Hybrid Benefit.", fr: "Définir la licence SQL Server de VM-DR sur Azure Hybrid Benefit." } }
    - { id: c, text: { en: "Reinstall VM-DR with SQL Server 2022 Developer edition.", fr: "Réinstaller VM-DR avec SQL Server 2022 Developer." } }
    - { id: d, text: { en: "Set the SQL Server license of VM-DR to HA/DR.", fr: "Définir la licence SQL Server de VM-DR sur HA/DR." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With Software Assurance, a passive disaster recovery replica in Azure doesn't need a paid SQL Server license. You enable the benefit on the SQL virtual machine resource, under Settings > Configure, by selecting the HA/DR license type.
    fr: |
      Avec la Software Assurance, un réplica passif de récupération d'urgence dans Azure ne nécessite pas de licence SQL Server payante. Vous activez cet avantage sur la ressource de machine virtuelle SQL, sous Settings > Configure, en sélectionnant le type de licence HA/DR.
  options:
    a: { en: "Pay as you go bills the SQL Server license with every hour of the VM, which is the most expensive option for a passive replica.", fr: "Pay as you go facture la licence SQL Server à chaque heure de la machine virtuelle : c'est l'option la plus chère pour un réplica passif." }
    b: { en: "Azure Hybrid Benefit consumes one of your existing core licenses, whereas the HA/DR benefit consumes none.", fr: "Azure Hybrid Benefit consomme une de vos licences de cœurs existantes, alors que l'avantage HA/DR n'en consomme aucune." }
    c: { en: "Developer edition is licensed for development and testing only, not for a production disaster recovery replica.", fr: "L'édition Developer est concédée pour le développement et les tests uniquement, pas pour un réplica de récupération d'urgence de production." }
references:
  - title: Business continuity and HADR for SQL Server on Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/business-continuity-high-availability-disaster-recovery-hadr-overview
