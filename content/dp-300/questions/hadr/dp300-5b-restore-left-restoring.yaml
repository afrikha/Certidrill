id: dp300-5b-restore-left-restoring
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2019 instance on an Azure virtual machine. You ran the following script to restore a database named **Inventory**:

    ```sql
    RESTORE DATABASE Inventory FROM DISK = N'F:\Backup\Inventory_full.bak' WITH NORECOVERY, REPLACE;
    RESTORE DATABASE Inventory FROM DISK = N'F:\Backup\Inventory_diff.bak' WITH NORECOVERY;
    RESTORE LOG Inventory FROM DISK = N'F:\Backup\Inventory_log_0900.trn' WITH NORECOVERY;
    ```

    The log backup taken at 09:00 is the last one you need. Inventory remains in the **Restoring** state.

    You need to bring Inventory online without applying any other backup. What should you run?
  fr: |
    Vous disposez d'une instance SQL Server 2019 sur une machine virtuelle Azure. Vous avez exécuté le script suivant pour restaurer une base de données nommée **Inventory** :

    ```sql
    RESTORE DATABASE Inventory FROM DISK = N'F:\Backup\Inventory_full.bak' WITH NORECOVERY, REPLACE;
    RESTORE DATABASE Inventory FROM DISK = N'F:\Backup\Inventory_diff.bak' WITH NORECOVERY;
    RESTORE LOG Inventory FROM DISK = N'F:\Backup\Inventory_log_0900.trn' WITH NORECOVERY;
    ```

    La sauvegarde de journal de 09:00 est la dernière dont vous avez besoin. Inventory reste à l'état **Restoring**.

    Vous devez mettre Inventory en ligne sans appliquer d'autre sauvegarde. Que devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER DATABASE Inventory SET ONLINE;" }
    - { id: b, text: "RESTORE DATABASE Inventory WITH RECOVERY;" }
    - { id: c, text: "DBCC CHECKDB (Inventory) WITH NO_INFOMSGS;" }
    - { id: d, text: "ALTER DATABASE Inventory SET MULTI_USER;" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Every step of the sequence used `NORECOVERY`, so the recovery phase never ran. `RESTORE DATABASE Inventory WITH RECOVERY` without a backup source runs recovery only: it rolls back uncommitted transactions and brings the database online. After that, no further backup can be applied.
    fr: |
      Toutes les étapes de la séquence ont utilisé `NORECOVERY` : la phase de récupération n'a donc jamais été exécutée. `RESTORE DATABASE Inventory WITH RECOVERY` sans source de sauvegarde exécute uniquement la récupération : elle annule les transactions non validées et met la base de données en ligne. Aucune autre sauvegarde ne peut ensuite être appliquée.
  options:
    a: { en: "SET ONLINE applies to a database that was taken offline; it can't complete a restore sequence.", fr: "SET ONLINE s'applique à une base de données mise hors connexion ; il ne termine pas une séquence de restauration." }
    c: { en: "DBCC CHECKDB checks consistency; it can't run recovery on a database in the Restoring state.", fr: "DBCC CHECKDB vérifie la cohérence ; il ne peut pas exécuter la récupération d'une base à l'état Restoring." }
    d: { en: "MULTI_USER changes the user access mode of an online database; it doesn't end the restore sequence.", fr: "MULTI_USER modifie le mode d'accès utilisateur d'une base en ligne ; il ne termine pas la séquence de restauration." }
references:
  - title: RESTORE Statements - Arguments (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-arguments-transact-sql
