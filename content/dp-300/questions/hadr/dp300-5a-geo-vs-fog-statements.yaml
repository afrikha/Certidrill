id: dp300-5a-geo-vs-fog-statements
objective: "5.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are comparing active geo-replication and failover groups for the databases of an Azure SQL Database logical server named **srv-crm**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez la géoréplication active et les groupes de basculement pour les bases d'un serveur logique Azure SQL Database nommé **srv-crm**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A failover group can fail over several databases of srv-crm together.
        fr: |
          Un groupe de basculement peut faire basculer ensemble plusieurs bases de srv-crm.
    - id: s2
      text:
        en: |
          After a failover group fails over, applications that connect through the read-write listener must update their connection string.
        fr: |
          Après le basculement d'un groupe de basculement, les applications qui se connectent par l'écouteur en lecture-écriture doivent mettre à jour leur chaîne de connexion.
    - id: s3
      text:
        en: |
          After an active geo-replication failover, applications must connect to the server that hosts the new primary.
        fr: |
          Après un basculement de géoréplication active, les applications doivent se connecter au serveur qui héberge le nouveau primaire.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A failover group contains one or more databases of a server and fails them over as a unit. Its read-write listener always resolves to the current primary, so connection strings don't change. Active geo-replication has no listener: the new primary is on another logical server, so the connection endpoint changes.
    fr: |
      Un groupe de basculement contient une ou plusieurs bases d'un serveur et les fait basculer en bloc. Son écouteur en lecture-écriture correspond toujours au primaire actuel : les chaînes de connexion ne changent pas. La géoréplication active n'a pas d'écouteur : le nouveau primaire est sur un autre serveur logique, le point de terminaison de connexion change donc.
references:
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
