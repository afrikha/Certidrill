id: dp300-5b-ltr-geo-secondary
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **SalesDb** on a logical server named **srv-weu** in West Europe. SalesDb has a geo-secondary on a logical server named **srv-neu** in North Europe, created by using active geo-replication. A long-term retention policy on SalesDb keeps weekly backups for 12 weeks and yearly backups for five years.

    You need to ensure that long-term retention backups of SalesDb continue to be created after a failover to srv-neu. The solution must minimize storage costs.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **SalesDb** sur un serveur logique nommé **srv-weu** en West Europe. SalesDb possède une base secondaire géographique sur un serveur logique nommé **srv-neu** en North Europe, créée par géoréplication active. Une stratégie de rétention à long terme sur SalesDb conserve les sauvegardes hebdomadaires pendant 12 semaines et les sauvegardes annuelles pendant cinq ans.

    Vous devez vous assurer que les sauvegardes de rétention à long terme de SalesDb continuent d'être créées après un basculement vers srv-neu. La solution doit minimiser les coûts de stockage.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure the same long-term retention policy on the geo-secondary SalesDb on srv-neu.", fr: "Configurer la même stratégie de rétention à long terme sur la base secondaire SalesDb de srv-neu." } }
    - { id: b, text: { en: "Change the backup storage redundancy of SalesDb on srv-weu to geo-zone-redundant storage.", fr: "Changer la redondance du stockage de sauvegarde de SalesDb sur srv-weu en stockage géoredondant interzone." } }
    - { id: c, text: { en: "Do nothing: the long-term retention policy replicates to the geo-secondary with the database.", fr: "Ne rien faire : la stratégie de rétention à long terme est répliquée vers la base secondaire avec la base de données." } }
    - { id: d, text: { en: "Schedule a runbook that copies each long-term retention backup from srv-weu to srv-neu.", fr: "Planifier un runbook qui copie chaque sauvegarde de rétention à long terme de srv-weu vers srv-neu." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The long-term retention policy is set per database and isn't replicated. You configure the same policy on the geo-secondary: it doesn't add storage cost, because backups aren't generated from secondaries, and LTR backups start on srv-neu as soon as that database becomes the primary.
    fr: |
      La stratégie de rétention à long terme se définit par base de données et n'est pas répliquée. Vous configurez la même stratégie sur la base secondaire : cela n'ajoute aucun coût de stockage, car aucune sauvegarde n'est générée à partir des bases secondaires, et les sauvegardes LTR démarrent sur srv-neu dès que cette base devient la base primaire.
  options:
    b: { en: "Geo-redundant backup storage enables geo-restore; it doesn't create LTR backups on the new primary after a failover.", fr: "Le stockage de sauvegarde géoredondant permet la géorestauration ; il ne crée pas de sauvegardes LTR sur la nouvelle base primaire après un basculement." }
    c: { en: "The policy isn't replicated: without a policy on the secondary, no LTR backup is created after the failover.", fr: "La stratégie n'est pas répliquée : sans stratégie sur la base secondaire, aucune sauvegarde LTR n'est créée après le basculement." }
    d: { en: "Copying LTR backups relies on deprecated APIs, adds storage cost and still creates no new backups after a failover.", fr: "La copie des sauvegardes LTR repose sur des API dépréciées, ajoute des coûts de stockage et ne crée toujours aucune nouvelle sauvegarde après un basculement." }
references:
  - title: Long-term retention backups - Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/long-term-retention-overview
