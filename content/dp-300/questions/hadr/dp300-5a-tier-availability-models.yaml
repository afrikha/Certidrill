id: dp300-5a-tier-availability-models
objective: "5.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are explaining the built-in high availability of Azure SQL Database to a team that must choose a service tier.

    Which availability model does each service tier use? To answer, drag the appropriate models to the correct service tiers. Each model may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous expliquez la haute disponibilité intégrée d'Azure SQL Database à une équipe qui doit choisir un niveau de service.

    Quel modèle de disponibilité chaque niveau de service utilise-t-il ? Pour répondre, faites glisser les modèles appropriés vers les niveaux de service correspondants. Chaque modèle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: remote, text: { en: "Remote storage: stateless compute, data files on Azure storage", fr: "Stockage distant : calcul sans état, fichiers de données sur le stockage Azure" } }
    - { id: local, text: { en: "Local storage: a cluster of replicas on locally attached SSD", fr: "Stockage local : un cluster de réplicas sur des SSD attachés localement" } }
    - { id: hs, text: { en: "Distributed: compute replicas, page servers, log service and storage", fr: "Distribué : réplicas de calcul, serveurs de pages, service de journal et stockage" } }
    - { id: fci, text: { en: "Failover cluster instance on shared disks", fr: "Instance de cluster de basculement sur des disques partagés" } }
  targets:
    - { id: gp, text: General Purpose }
    - { id: bc, text: Business Critical }
    - { id: hyper, text: Hyperscale }
    - { id: std, text: Standard (DTU) }
answer:
  mapping: { gp: remote, bc: local, hyper: hs, std: remote }
explanation:
  correct:
    en: |
      Basic, Standard and General Purpose use the remote storage model, which separates compute from the data files stored on Azure storage. Premium and Business Critical use the local storage model, an Always On-style cluster of replicas with local SSD. Hyperscale uses its own distributed architecture, in which each component provides its own redundancy.
    fr: |
      Basic, Standard et General Purpose utilisent le modèle de stockage distant, qui sépare le calcul des fichiers de données stockés sur le stockage Azure. Premium et Business Critical utilisent le modèle de stockage local, un cluster de réplicas de type Always On avec des SSD locaux. Hyperscale utilise sa propre architecture distribuée, dans laquelle chaque composant assure sa propre redondance.
  options:
    fci: { en: "Failover cluster instances are a SQL Server feature for virtual machines; no Azure SQL Database tier uses them.", fr: "Les instances de cluster de basculement sont une fonctionnalité SQL Server pour les machines virtuelles ; aucun niveau d'Azure SQL Database ne les utilise." }
references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
