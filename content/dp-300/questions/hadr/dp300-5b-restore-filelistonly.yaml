id: dp300-5b-restore-filelistonly
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You copied a backup file named **Payroll_full.bak** from an on-premises SQL Server to an Azure virtual machine named **SQLVM1** that runs SQL Server 2022. On SQLVM1, data files must be stored on drive G and log files on drive H, which don't exist on the source server.

    Before you write the `RESTORE DATABASE ... WITH MOVE` statement, you need to list the logical names of the data and log files contained in the backup.

    Which statement should you run?
  fr: |
    Vous avez copié un fichier de sauvegarde nommé **Payroll_full.bak** d'un serveur SQL Server local vers une machine virtuelle Azure nommée **SQLVM1** qui exécute SQL Server 2022. Sur SQLVM1, les fichiers de données doivent être stockés sur le lecteur G et les fichiers journaux sur le lecteur H, qui n'existent pas sur le serveur source.

    Avant d'écrire l'instruction `RESTORE DATABASE ... WITH MOVE`, vous devez lister les noms logiques des fichiers de données et des fichiers journaux contenus dans la sauvegarde.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "RESTORE HEADERONLY" }
    - { id: b, text: "RESTORE FILELISTONLY" }
    - { id: c, text: "RESTORE VERIFYONLY" }
    - { id: d, text: "RESTORE LABELONLY" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `RESTORE FILELISTONLY` returns one row per database and log file in the backup set, including the logical name and the original physical path. You use the logical names in the `MOVE 'logical_name' TO 'new_path'` clauses.
    fr: |
      `RESTORE FILELISTONLY` renvoie une ligne par fichier de données et fichier journal du jeu de sauvegarde, avec le nom logique et le chemin physique d'origine. Vous utilisez ces noms logiques dans les clauses `MOVE 'nom_logique' TO 'nouveau_chemin'`.
  options:
    a: { en: "HEADERONLY returns the backup header (backup type, dates, LSNs) of each backup set, not the list of files.", fr: "HEADERONLY renvoie l'en-tête de chaque jeu de sauvegarde (type, dates, LSN), pas la liste des fichiers." }
    c: { en: "VERIFYONLY checks that the backup set is complete and readable; it doesn't list the logical file names.", fr: "VERIFYONLY vérifie que le jeu de sauvegarde est complet et lisible ; il ne liste pas les noms logiques des fichiers." }
    d: { en: "LABELONLY returns information about the backup media, not about the database files.", fr: "LABELONLY renvoie des informations sur le support de sauvegarde, pas sur les fichiers de la base de données." }
references:
  - title: RESTORE Statements - Arguments (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-arguments-transact-sql
