id: dp300-cs2b-log-shipping
objective: "5.3.5"
type: single
caseStudy: dp300-cs2b-fabrikam-plants
difficulty: 2
status: draft
stem:
  en: |
    You are configuring log shipping from MESFCI to SQLDR1. You need to configure the Restore Transaction Log tab for the secondary database to meet the disaster recovery requirements.

    Which configuration should you use?
  fr: |
    Vous configurez la copie des journaux de transaction de MESFCI vers SQLDR1. Vous devez configurer l'onglet Restore Transaction Log de la base de données secondaire pour satisfaire les exigences de reprise d'activité.

    Quelle configuration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "No recovery mode, and Delay restoring backups at least set to 60 minutes", fr: "No recovery mode, et Delay restoring backups at least défini sur 60 minutes" } }
    - { id: b, text: { en: "Standby mode with Disconnect users selected, and Delay restoring backups at least set to 60 minutes", fr: "Standby mode avec Disconnect users sélectionné, et Delay restoring backups at least défini sur 60 minutes" } }
    - { id: c, text: { en: "Standby mode with Disconnect users cleared, and Delay restoring backups at least set to 60 minutes", fr: "Standby mode avec Disconnect users désélectionné, et Delay restoring backups at least défini sur 60 minutes" } }
    - { id: d, text: { en: "Standby mode with Disconnect users selected, and the restore job scheduled to run every 60 minutes", fr: "Standby mode avec Disconnect users sélectionné, et le travail de restauration planifié toutes les 60 minutes" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Standby mode leaves the secondary database read-only between restores, which is allowed because SQLDR1 runs the same SQL Server version as the primary. Selecting Disconnect users lets each restore proceed instead of waiting for the analysts' sessions to end. The Delay restoring backups setting postpones the restore of each log backup by at least the configured time, so the DBAs have 60 minutes to stop the restore job after a mistaken deletion.
    fr: |
      Le mode Standby laisse la base secondaire en lecture seule entre les restaurations, ce qui est possible car SQLDR1 exécute la même version de SQL Server que le primaire. Sélectionner Disconnect users permet à chaque restauration de s'exécuter au lieu d'attendre la fin des sessions des analystes. Le paramètre Delay restoring backups reporte la restauration de chaque sauvegarde de journal d'au moins la durée configurée : les DBA disposent de 60 minutes pour arrêter le travail de restauration après une suppression par erreur.
  options:
    a: { en: "In No recovery mode the secondary database is in the restoring state and cannot be queried.", fr: "En mode No recovery, la base secondaire est en état de restauration et ne peut pas être interrogée." }
    c: { en: "Without Disconnect users, a restore cannot start while analysts are connected, so the restores would wait for their sessions.", fr: "Sans Disconnect users, une restauration ne peut pas démarrer tant que des analystes sont connectés : les restaurations attendraient la fin de leurs sessions." }
    d: { en: "An hourly restore job applies every log backup copied so far, including one taken a few minutes earlier, so the copy is not always 60 minutes behind.", fr: "Un travail de restauration horaire applique toutes les sauvegardes de journal déjà copiées, y compris une sauvegarde effectuée quelques minutes plus tôt : la copie n'a donc pas toujours 60 minutes de retard." }
references:
  - title: Configure Log Shipping (SQL Server) - SQL Server
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/configure-log-shipping-sql-server
