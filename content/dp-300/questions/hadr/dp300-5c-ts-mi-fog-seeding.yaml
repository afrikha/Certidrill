id: dp300-5c-ts-mi-fog-seeding
objective: "5.3.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You created a failover group named **fog-erp** between two Azure SQL managed instances: **MI1** in West Europe (primary) and **MI2** in North Europe. The virtual networks of the instances are connected by global virtual network peering.

    Several hours later, fog-erp still shows the Seeding state and no user database is available on MI2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez créé un groupe de basculement nommé **fog-erp** entre deux instances managées Azure SQL : **MI1** dans la région West Europe (primaire) et **MI2** dans la région North Europe. Les réseaux virtuels des instances sont reliés par un peering de réseaux virtuels mondial.

    Plusieurs heures plus tard, fog-erp affiche toujours l'état Seeding et aucune base utilisateur n'est disponible sur MI2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A network security group rule that blocks TCP port 5022 between the subnets of MI1 and MI2 can cause this issue.
        fr: Une règle de groupe de sécurité réseau qui bloque le port TCP 5022 entre les sous-réseaux de MI1 et MI2 peut provoquer ce problème.
    - id: s2
      text:
        en: While fog-erp is in the Seeding state, you can run a planned failover to MI2.
        fr: Tant que fog-erp est à l'état Seeding, vous pouvez effectuer un basculement planifié vers MI2.
    - id: s3
      text:
        en: SQL Server Agent jobs created on MI1 are replicated to MI2 when seeding completes.
        fr: Les travaux SQL Server Agent créés sur MI1 sont répliqués sur MI2 à la fin de l'amorçage.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Replication between the instances needs TCP port 5022 and the range 11000-11999 open inbound and outbound in the NSGs of both subnets; a blocked port prevents or stalls seeding. A failover isn't possible while the group is in the Seeding state. Only user databases are replicated; msdb isn't, so Agent jobs and logins must be created on MI2 manually.
    fr: La réplication entre les instances exige que le port TCP 5022 et la plage 11000-11999 soient ouverts en entrée et en sortie dans les groupes de sécurité réseau des deux sous-réseaux ; un port bloqué empêche ou bloque l'amorçage. Aucun basculement n'est possible tant que le groupe est à l'état Seeding. Seules les bases utilisateur sont répliquées ; msdb ne l'est pas, donc les travaux Agent et les connexions doivent être créés manuellement sur MI2.
references:
