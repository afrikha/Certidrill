id: dp300-5b-tsql-copy-only
objective: "5.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine. A SQL Server Agent job backs up a database named **Fleet** with a full backup every Sunday and a differential backup every night.

    On Wednesday, a developer needs a full backup of Fleet to refresh a test environment. The backup must not affect the restore sequence of the scheduled backups.

    Which Transact-SQL statement should you run?
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure. Un travail SQL Server Agent sauvegarde une base de données nommée **Fleet** avec une sauvegarde complète chaque dimanche et une sauvegarde différentielle chaque nuit.

    Le mercredi, un développeur a besoin d'une sauvegarde complète de Fleet pour actualiser un environnement de test. La sauvegarde ne doit pas affecter la séquence de restauration des sauvegardes planifiées.

    Quelle instruction Transact-SQL devez-vous exécuter ?
body:
  options:
    - { id: a, text: "BACKUP DATABASE Fleet TO DISK = N'F:\\Temp\\Fleet.bak' WITH COPY_ONLY;" }
    - { id: b, text: "BACKUP DATABASE Fleet TO DISK = N'F:\\Temp\\Fleet.bak' WITH DIFFERENTIAL;" }
    - { id: c, text: "BACKUP DATABASE Fleet TO DISK = N'F:\\Temp\\Fleet.bak' WITH INIT;" }
    - { id: d, text: "BACKUP DATABASE Fleet TO DISK = N'F:\\Temp\\Fleet.bak' WITH NO_TRUNCATE;" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A copy-only full backup is independent of the sequence of conventional backups: it doesn't become the base of the following differential backups, so the nightly differentials stay restorable on top of the Sunday full backup.
    fr: |
      Une sauvegarde complète en copie seule est indépendante de la séquence des sauvegardes classiques : elle ne devient pas la base des sauvegardes différentielles suivantes, et les différentielles nocturnes restent restaurables par-dessus la sauvegarde complète du dimanche.
  options:
    b: { en: "A differential backup isn't a full backup: it can't be restored on its own in the test environment.", fr: "Une sauvegarde différentielle n'est pas une sauvegarde complète : elle ne peut pas être restaurée seule dans l'environnement de test." }
    c: { en: "INIT only overwrites the backup sets in the file; the backup becomes the new differential base and changes the restore sequence.", fr: "INIT écrase seulement les jeux de sauvegarde du fichier ; la sauvegarde devient la nouvelle base différentielle et modifie la séquence de restauration." }
    d: { en: "NO_TRUNCATE is a log backup option used for a damaged or offline database; it doesn't prevent a full backup from resetting the differential base.", fr: "NO_TRUNCATE est une option de sauvegarde du journal utilisée pour une base endommagée ou hors connexion ; elle n'empêche pas une sauvegarde complète de redéfinir la base différentielle." }
references:
  - title: Copy-only backups
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/copy-only-backups-sql-server
