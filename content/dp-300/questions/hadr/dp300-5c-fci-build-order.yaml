id: dp300-5c-fci-build-order
objective: "5.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure virtual machines named **SQLVM1** and **SQLVM2** that run Windows Server 2022, are joined to an Active Directory domain, and are in the same availability set. An Azure shared disk is attached to both virtual machines and is initialized and formatted. The SQL Server 2022 installation media is available on both virtual machines.

    You need to deploy a SQL Server failover cluster instance (FCI) that runs on SQLVM1 and SQLVM2.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez de deux machines virtuelles Azure nommées **SQLVM1** et **SQLVM2** qui exécutent Windows Server 2022, sont jointes à un domaine Active Directory et se trouvent dans le même groupe à haute disponibilité. Un disque partagé Azure est attaché aux deux machines virtuelles, initialisé et formaté. Le média d'installation de SQL Server 2022 est disponible sur les deux machines virtuelles.

    Vous devez déployer une instance de cluster de basculement (FCI) SQL Server qui s'exécute sur SQLVM1 et SQLVM2.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: cluster, text: { en: "Create a Windows Server failover cluster that contains SQLVM1 and SQLVM2.", fr: "Créer un cluster de basculement Windows Server qui contient SQLVM1 et SQLVM2." } }
    - { id: witness, text: { en: "Configure a disk witness for the cluster quorum.", fr: "Configurer un témoin de disque pour le quorum du cluster." } }
    - { id: install, text: { en: "On SQLVM1, run SQL Server Setup and select New SQL Server failover cluster installation.", fr: "Sur SQLVM1, exécuter le programme d'installation de SQL Server et sélectionner New SQL Server failover cluster installation." } }
    - { id: addnode, text: { en: "On SQLVM2, run SQL Server Setup and select Add node to a SQL Server failover cluster.", fr: "Sur SQLVM2, exécuter le programme d'installation de SQL Server et sélectionner Add node to a SQL Server failover cluster." } }
    - { id: standalone, text: { en: "On SQLVM1 and SQLVM2, install a stand-alone SQL Server instance.", fr: "Sur SQLVM1 et SQLVM2, installer une instance SQL Server autonome." } }
    - { id: agfeature, text: { en: "Enable the Always On availability groups feature in SQL Server Configuration Manager.", fr: "Activer la fonctionnalité Groupes de disponibilité Always On dans le Gestionnaire de configuration SQL Server." } }
    - { id: listener, text: { en: "Create an availability group listener.", fr: "Créer un écouteur de groupe de disponibilité." } }
answer:
  sequence: [ cluster, witness, install, addnode ]
explanation:
  correct:
    en: An FCI is installed on top of a Windows Server failover cluster, so you first create the cluster and configure its quorum (a disk witness with shared disks). You then run the New SQL Server failover cluster installation on the first node, which creates the clustered instance on the shared disk, and add each other node with Add node to a SQL Server failover cluster.
    fr: Une FCI s'installe sur un cluster de basculement Windows Server ; vous créez donc d'abord le cluster et configurez son quorum (un témoin de disque avec des disques partagés). Vous exécutez ensuite New SQL Server failover cluster installation sur le premier nœud, ce qui crée l'instance en cluster sur le disque partagé, puis vous ajoutez chaque autre nœud avec Add node to a SQL Server failover cluster.
  options:
    standalone: { en: "A stand-alone instance isn't clustered; an FCI is created by the failover cluster installation itself.", fr: "Une instance autonome n'est pas en cluster ; une FCI est créée par l'installation en cluster de basculement elle-même." }
    agfeature: { en: "The Always On availability groups feature is needed for availability groups, not for an FCI.", fr: "La fonctionnalité Groupes de disponibilité Always On sert aux groupes de disponibilité, pas à une FCI." }
    listener: { en: "Clients connect to an FCI through its network name (VNN, DNN or multi-subnet), not an availability group listener.", fr: "Les clients se connectent à une FCI par son nom réseau (VNN, DNN ou multisous-réseau), pas par un écouteur de groupe de disponibilité." }
references:
  - title: Create an FCI with Azure Shared Disks - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/failover-cluster-instance-azure-shared-disks-manually-configure
