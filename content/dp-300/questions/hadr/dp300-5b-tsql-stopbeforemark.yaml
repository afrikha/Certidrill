id: dp300-5b-tsql-stopbeforemark
objective: "5.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine. A database named **Billing** uses the FULL recovery model. Every release script for Billing runs inside a marked transaction, for example:

    ```sql
    BEGIN TRANSACTION Release57 WITH MARK 'Release 57';
    -- schema and data changes
    COMMIT TRANSACTION Release57;
    ```

    Release57 corrupted data. You restored the last full backup of Billing `WITH NORECOVERY`, and you are restoring the log backup that contains Release57. You need Billing to contain every transaction committed before Release57 started, and none of the changes made by Release57.

    Which option should you add to the `RESTORE LOG` statement, with `RECOVERY`?
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure. Une base de données nommée **Billing** utilise le mode de récupération FULL. Chaque script de mise en production de Billing s'exécute dans une transaction marquée, par exemple :

    ```sql
    BEGIN TRANSACTION Release57 WITH MARK 'Release 57';
    -- schema and data changes
    COMMIT TRANSACTION Release57;
    ```

    Release57 a endommagé des données. Vous avez restauré la dernière sauvegarde complète de Billing `WITH NORECOVERY`, et vous restaurez la sauvegarde de journal qui contient Release57. Billing doit contenir toutes les transactions validées avant le début de Release57, et aucune des modifications effectuées par Release57.

    Quelle option devez-vous ajouter à l'instruction `RESTORE LOG`, avec `RECOVERY` ?
body:
  options:
    - { id: a, text: "STOPATMARK = 'Release57'" }
    - { id: b, text: "STOPAT = 'Release57'" }
    - { id: c, text: "STOPBEFOREMARK = 'Release57'" }
    - { id: d, text: "STANDBY = 'Release57'" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `STOPBEFOREMARK` stops recovery just before the marked transaction: Release57 isn't included and is rolled back when the database is recovered, while everything committed earlier is kept. The mark name is the transaction name, and it works with `RESTORE LOG`.
    fr: |
      `STOPBEFOREMARK` arrête la récupération juste avant la transaction marquée : Release57 n'est pas incluse et elle est annulée lors de la récupération de la base, tandis que tout ce qui a été validé auparavant est conservé. Le nom de la marque est le nom de la transaction, et il fonctionne avec `RESTORE LOG`.
  options:
    a: { en: "STOPATMARK is inclusive: the marked transaction is rolled forward, so the changes made by Release57 would be kept.", fr: "STOPATMARK est inclusif : la transaction marquée est restaurée, et les modifications de Release57 seraient conservées." }
    b: { en: "STOPAT expects a date and time, not a transaction mark name.", fr: "STOPAT attend une date et une heure, pas un nom de marque de transaction." }
    d: { en: "STANDBY expects the path of an undo file and leaves the database read-only; it doesn't select a stop point.", fr: "STANDBY attend le chemin d'un fichier d'annulation et laisse la base en lecture seule ; il ne choisit pas de point d'arrêt." }
references:
  - title: RESTORE Statements - Arguments (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-arguments-transact-sql
