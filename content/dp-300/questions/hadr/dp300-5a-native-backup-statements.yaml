id: dp300-5a-native-backup-statements
objective: "5.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin uses Azure SQL Database, Azure SQL Managed Instance and SQL Server on Azure virtual machines. You are documenting which native backup statements the database administrators can run.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin utilise Azure SQL Database, Azure SQL Managed Instance et SQL Server sur des machines virtuelles Azure. Vous documentez les instructions de sauvegarde natives que les administrateurs de bases de données peuvent exécuter.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can run BACKUP DATABASE on an Azure SQL Database database to create a .bak file in Blob Storage.
        fr: |
          Vous pouvez exécuter BACKUP DATABASE sur une base Azure SQL Database pour créer un fichier .bak dans Stockage Blob.
    - id: s2
      text:
        en: |
          On SQL Managed Instance, a user-initiated backup must be a COPY_ONLY full backup to URL.
        fr: |
          Sur SQL Managed Instance, une sauvegarde initiée par l'utilisateur doit être une sauvegarde complète COPY_ONLY vers une URL.
    - id: s3
      text:
        en: |
          On SQL Server, a database in the simple recovery model supports transaction log backups.
        fr: |
          Sur SQL Server, une base en mode de récupération simple prend en charge les sauvegardes du journal des transactions.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Azure SQL Database backups are fully managed by the service, and the BACKUP statement isn't available there. SQL Managed Instance also takes automatic backups, so a user can only take full COPY_ONLY backups to Blob Storage with TO URL. The simple recovery model reclaims log space automatically and doesn't support log backups.
    fr: |
      Les sauvegardes d'Azure SQL Database sont entièrement gérées par le service, et l'instruction BACKUP n'y est pas disponible. SQL Managed Instance effectue aussi des sauvegardes automatiques : un utilisateur ne peut effectuer que des sauvegardes complètes COPY_ONLY vers Stockage Blob avec TO URL. Le mode de récupération simple récupère automatiquement l'espace du journal et ne prend pas en charge les sauvegardes de journal.
references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
  - title: Recovery models (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/recovery-models-sql-server
