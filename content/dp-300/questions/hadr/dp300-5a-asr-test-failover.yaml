id: dp300-5a-asr-test-failover
objective: "5.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs an application server and a SQL Server 2019 virtual machine named **VM-SQL** in East US. Both VMs are replicated to West US by Azure Site Recovery and belong to a recovery plan named **rp-app**.

    You need to run a disaster recovery drill in West US. The drill must not affect the production VMs or the ongoing replication.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware exécute un serveur d'applications et une machine virtuelle SQL Server 2019 nommée **VM-SQL** dans East US. Les deux machines virtuelles sont répliquées vers West US par Azure Site Recovery et font partie d'un plan de récupération nommé **rp-app**.

    Vous devez effectuer un exercice de récupération d'urgence dans West US. L'exercice ne doit affecter ni les machines virtuelles de production ni la réplication en cours.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: vnet, text: { en: "Create a virtual network in West US that isn't connected to the production networks.", fr: "Créer dans West US un réseau virtuel qui n'est pas connecté aux réseaux de production." } }
    - { id: tfo, text: { en: "Run Test failover on rp-app, and select a recovery point and the isolated virtual network.", fr: "Exécuter Test failover sur rp-app, puis sélectionner un point de récupération et le réseau virtuel isolé." } }
    - { id: validate, text: { en: "Validate the SQL Server databases and the application on the test VMs.", fr: "Valider les bases SQL Server et l'application sur les machines virtuelles de test." } }
    - { id: cleanup, text: { en: "Run Cleanup test failover on rp-app.", fr: "Exécuter Cleanup test failover sur rp-app." } }
    - { id: fo, text: { en: "Run Failover on rp-app.", fr: "Exécuter Failover sur rp-app." } }
    - { id: commit, text: { en: "Commit the failover of rp-app.", fr: "Valider (Commit) le basculement de rp-app." } }
    - { id: disable, text: { en: "Disable replication of VM-SQL.", fr: "Désactiver la réplication de VM-SQL." } }
answer:
  sequence: [ vnet, tfo, validate, cleanup ]
explanation:
  correct:
    en: |
      A test failover creates test VMs from a recovery point in the network you select, while replication continues and production isn't affected. An isolated virtual network that mirrors the production subnets avoids conflicts with the running VMs. After validation, Cleanup test failover deletes the test VMs.
    fr: |
      Un test de basculement crée des machines virtuelles de test à partir d'un point de récupération dans le réseau que vous sélectionnez, pendant que la réplication continue et sans affecter la production. Un réseau virtuel isolé qui reproduit les sous-réseaux de production évite les conflits avec les machines virtuelles en cours d'exécution. Après la validation, Cleanup test failover supprime les machines virtuelles de test.
  options:
    fo: { en: "A real failover moves production to West US, which the drill must not do.", fr: "Un vrai basculement déplace la production vers West US, ce que l'exercice ne doit pas faire." }
    commit: { en: "Commit applies only after a real failover.", fr: "La validation (Commit) ne s'applique qu'après un vrai basculement." }
    disable: { en: "Disabling replication stops the protection of VM-SQL, which the drill must not affect.", fr: "Désactiver la réplication arrête la protection de VM-SQL, ce que l'exercice ne doit pas affecter." }
references:
  - title: Run a test failover (disaster recovery drill) to Azure
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-test-failover-to-azure
