id: dp300-5c-ls-standby-reporting
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are configuring log shipping for a database named **SalesDb** from **SQLVM1** to **SQLVM2**. Both Azure virtual machines run SQL Server 2022.

    Analysts must be able to run read-only queries against SalesDb on SQLVM2 between restores. Each scheduled restore must run on time, even if analysts are connected to the database.

    How should you configure the restore settings of the secondary database?
  fr: |
    Vous configurez la copie des journaux de transaction d'une base de données nommée **SalesDb** de **SQLVM1** vers **SQLVM2**. Les deux machines virtuelles Azure exécutent SQL Server 2022.

    Les analystes doivent pouvoir exécuter des requêtes en lecture seule sur SalesDb sur SQLVM2 entre les restaurations. Chaque restauration planifiée doit s'exécuter à l'heure, même si des analystes sont connectés à la base.

    Comment devez-vous configurer les paramètres de restauration de la base secondaire ?
body:
  options:
    - { id: a, text: { en: "Select No recovery mode, and set Delay restoring backups at least to 60 minutes.", fr: "Sélectionner No recovery mode, et définir Delay restoring backups at least sur 60 minutes." } }
    - { id: b, text: { en: "Select Standby mode, and select Disconnect users in the database when restoring backups.", fr: "Sélectionner Standby mode, et sélectionner Disconnect users in the database when restoring backups." } }
    - { id: c, text: { en: "Select Standby mode, clear Disconnect users in the database when restoring backups, and run the restore job more often.", fr: "Sélectionner Standby mode, désélectionner Disconnect users in the database when restoring backups, et exécuter le travail de restauration plus souvent." } }
    - { id: d, text: { en: "Select No recovery mode, and change the restore job to restore each log backup WITH RECOVERY.", fr: "Sélectionner No recovery mode, et modifier le travail de restauration pour restaurer chaque sauvegarde du journal WITH RECOVERY." } }
answer: { optionId: b }
explanation:
  correct:
    en: Standby mode leaves the secondary database readable between restores; it's available because both servers run the same version. A restore needs exclusive access to the database, so selecting Disconnect users lets each restore start on schedule instead of waiting for the analysts' sessions to end.
    fr: Le mode Standby laisse la base secondaire lisible entre les restaurations ; il est disponible car les deux serveurs exécutent la même version. Une restauration a besoin d'un accès exclusif à la base ; sélectionner Disconnect users permet donc à chaque restauration de démarrer à l'heure au lieu d'attendre la fin des sessions des analystes.
  options:
    a: { en: "In No recovery mode the secondary database stays in the restoring state and can't be queried; a restore delay doesn't change that.", fr: "En mode No recovery, la base secondaire reste en état de restauration et ne peut pas être interrogée ; un délai de restauration n'y change rien." }
    c: { en: "Without disconnecting users, a restore can't start while analysts are connected, so restores are delayed.", fr: "Sans déconnexion des utilisateurs, une restauration ne peut pas démarrer tant que des analystes sont connectés : les restaurations sont retardées." }
    d: { en: "Restoring WITH RECOVERY brings the database online and ends the restore sequence, so no further log backup can be applied.", fr: "Restaurer WITH RECOVERY met la base en ligne et termine la séquence de restauration : plus aucune sauvegarde du journal ne peut être appliquée." }
references:
  - title: Configure Log Shipping (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/configure-log-shipping-sql-server
  - title: About Log Shipping (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/about-log-shipping-sql-server
