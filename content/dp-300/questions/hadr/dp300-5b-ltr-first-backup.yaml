id: dp300-5b-ltr-first-backup
objective: "5.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **Payments**. Yesterday, you configured a long-term retention policy for Payments that keeps weekly backups for 12 weeks. Today, the **Available LTR backups** pane of Payments is still empty, and an auditor asks you to make a long-term retention backup available as soon as possible.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Payments**. Hier, vous avez configuré pour Payments une stratégie de rétention à long terme qui conserve les sauvegardes hebdomadaires pendant 12 semaines. Aujourd'hui, le volet **Available LTR backups** de Payments est toujours vide, et un auditeur vous demande de rendre disponible une sauvegarde de rétention à long terme le plus tôt possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run BACKUP DATABASE Payments TO URL WITH COPY_ONLY to trigger a long-term retention backup.", fr: "Exécuter BACKUP DATABASE Payments TO URL WITH COPY_ONLY pour déclencher une sauvegarde de rétention à long terme." } }
    - { id: b, text: { en: "Increase the point-in-time restore retention of Payments to 35 days.", fr: "Augmenter la rétention de restauration à un point dans le temps de Payments à 35 jours." } }
    - { id: c, text: { en: "Wait: the first long-term retention backup can take up to seven days to appear.", fr: "Attendre : la première sauvegarde de rétention à long terme peut mettre jusqu'à sept jours à apparaître." } }
    - { id: d, text: { en: "Change the backup storage redundancy of Payments to geo-redundant storage.", fr: "Changer la redondance du stockage de sauvegarde de Payments en stockage géoredondant." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure controls when long-term retention backups are created: you can't trigger one or choose its time. When the policy is enabled for the first time, the most recent full backup is copied to long-term storage, but it can take up to seven days to appear in the list of available backups.
    fr: |
      Azure décide du moment où les sauvegardes de rétention à long terme sont créées : vous ne pouvez ni en déclencher une ni choisir son heure. Lors de la première activation de la stratégie, la dernière sauvegarde complète est copiée dans le stockage à long terme, mais elle peut mettre jusqu'à sept jours à apparaître dans la liste des sauvegardes disponibles.
  options:
    a: { en: "Azure SQL Database doesn't support the BACKUP statement; LTR copies the automated full backups.", fr: "Azure SQL Database ne prend pas en charge l'instruction BACKUP ; la LTR copie les sauvegardes complètes automatiques." }
    b: { en: "The point-in-time restore retention is separate from long-term retention and doesn't create LTR backups.", fr: "La rétention de restauration à un point dans le temps est distincte de la rétention à long terme et ne crée pas de sauvegardes LTR." }
    d: { en: "Backup storage redundancy decides where backups are replicated, not when LTR backups appear.", fr: "La redondance du stockage de sauvegarde détermine où les sauvegardes sont répliquées, pas quand les sauvegardes LTR apparaissent." }
references:
  - title: Long-term retention backups - Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/long-term-retention-overview
