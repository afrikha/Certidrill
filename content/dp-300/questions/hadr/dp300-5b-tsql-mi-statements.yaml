id: dp300-5b-tsql-mi-statements
objective: "5.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1**. MI1 hosts a database named **Crm** that is encrypted by using transparent data encryption (TDE) with a customer-managed key. MI1 has a valid shared access signature (SAS) credential for the container `https://stcontosomi.blob.core.windows.net/bak`. The container holds a file named **Hr_full.bak**, a full backup of a SQL Server 2022 database named **Hr**. MI1 doesn't contain a database named Hr.

    Which two statements run successfully on MI1?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **MI1**. MI1 héberge une base de données nommée **Crm** chiffrée par le chiffrement transparent des données (TDE) avec une clé gérée par le client. MI1 possède des informations d'identification SAS (signature d'accès partagé) valides pour le conteneur `https://stcontosomi.blob.core.windows.net/bak`. Le conteneur contient un fichier nommé **Hr_full.bak**, une sauvegarde complète d'une base de données SQL Server 2022 nommée **Hr**. MI1 ne contient aucune base de données nommée Hr.

    Quelles sont les deux instructions qui s'exécutent correctement sur MI1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "BACKUP DATABASE Crm TO URL = N'https://stcontosomi.blob.core.windows.net/bak/Crm.bak' WITH COPY_ONLY, COMPRESSION;" }
    - { id: b, text: "BACKUP LOG Crm TO URL = N'https://stcontosomi.blob.core.windows.net/bak/Crm.trn' WITH COPY_ONLY;" }
    - { id: c, text: "BACKUP DATABASE Crm TO URL = N'https://stcontosomi.blob.core.windows.net/bak/Crm.bak' WITH COMPRESSION;" }
    - { id: d, text: "RESTORE DATABASE Hr FROM URL = N'https://stcontosomi.blob.core.windows.net/bak/Hr_full.bak';" }
    - { id: e, text: "RESTORE DATABASE Hr FROM URL = N'https://stcontosomi.blob.core.windows.net/bak/Hr_full.bak' WITH NORECOVERY;" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      SQL Managed Instance takes its own automated backups, so user backups must be full `COPY_ONLY` backups to URL; compression is allowed, and customer-managed TDE doesn't block them. A restore must use `FROM URL` without any `WITH` option.
    fr: |
      SQL Managed Instance effectue ses propres sauvegardes automatiques : les sauvegardes utilisateur doivent donc être des sauvegardes complètes `COPY_ONLY` vers une URL ; la compression est autorisée, et un TDE géré par le client ne les bloque pas. Une restauration doit utiliser `FROM URL` sans aucune option `WITH`.
  options:
    b: { en: "Log backups aren't supported on SQL Managed Instance, even with COPY_ONLY.", fr: "Les sauvegardes du journal ne sont pas prises en charge sur SQL Managed Instance, même avec COPY_ONLY." }
    c: { en: "COPY_ONLY is mandatory for a user backup on SQL Managed Instance.", fr: "COPY_ONLY est obligatoire pour une sauvegarde utilisateur sur SQL Managed Instance." }
    e: { en: "RESTORE on SQL Managed Instance accepts no WITH options, NORECOVERY included.", fr: "RESTORE sur SQL Managed Instance n'accepte aucune option WITH, NORECOVERY compris." }
references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
