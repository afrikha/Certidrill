id: dp300-sr1-regional-outage-1
objective: "5.1.3"
type: series_yesno
series: dp300-sr1-regional-outage
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You configure active geo-replication for each database.
  fr: |
    Vous configurez la géoréplication active pour chaque base de données.
body:
  solution:
    en: |
      You create a logical server named **sql-litware-neu** in North Europe. You configure **active geo-replication** from each of the three databases to sql-litware-neu, and the operations team runs a forced failover of each database during a regional outage.
    fr: |
      Vous créez un serveur logique nommé **sql-litware-neu** dans la région Europe Nord. Vous configurez la **géoréplication active** de chacune des trois bases vers sql-litware-neu, et l'équipe d'exploitation lance un basculement forcé de chaque base en cas de panne régionale.
answer: { value: false }
explanation:
  correct:
    en: |
      Active geo-replication is configured and failed over per database, so the three databases don't fail over as one unit. It has no listener: after a failover the new primary is on sql-litware-neu, and the application's connection strings must be changed to that server.
    fr: |
      La géoréplication active est configurée et basculée base par base : les trois bases ne basculent pas comme une seule unité. Elle n'a pas d'écouteur : après un basculement, le nouveau primaire se trouve sur sql-litware-neu, et les chaînes de connexion de l'application doivent être modifiées vers ce serveur.
references:
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
