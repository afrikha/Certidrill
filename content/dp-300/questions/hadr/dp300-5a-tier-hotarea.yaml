id: dp300-5a-tier-hotarea
objective: "5.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has the following Azure SQL databases in the Sweden Central region, which supports availability zones.

    Answer each prompt by selecting the database in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose des bases de données Azure SQL suivantes dans la région Sweden Central, qui prend en charge les zones de disponibilité.

    Répondez à chaque consigne en sélectionnant la base de données dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The database for which you can't enable zone redundancy", fr: "La base pour laquelle vous ne pouvez pas activer la redondance interzone" }
    - id: p2
      text: { en: "The database that you can't geo-restore if Sweden Central becomes unavailable", fr: "La base que vous ne pouvez pas géorestaurer si Sweden Central devient indisponible" }
  grid:
    header: [{ en: Database, fr: Base de données }, { en: "Service tier", fr: "Niveau de service" }, { en: "Backup storage redundancy", fr: "Redondance du stockage de sauvegarde" }]
    rows:
      - [{ text: db-orders, area: db1 }, { text: Standard (DTU) }, { text: { en: "Geo-redundant", fr: "Géoredondant" } }]
      - [{ text: db-billing, area: db2 }, { text: General Purpose }, { text: { en: "Locally redundant", fr: "Localement redondant" } }]
      - [{ text: db-trading, area: db3 }, { text: Business Critical }, { text: { en: "Geo-redundant", fr: "Géoredondant" } }]
      - [{ text: db-telemetry, area: db4 }, { text: Hyperscale }, { text: { en: "Geo-zone-redundant", fr: "Géoredondant interzone" } }]
answer:
  values: { p1: db1, p2: db2 }
explanation:
  correct:
    en: |
      Zone redundancy is available for General Purpose, Business Critical, Hyperscale and Premium, but not for the Basic and Standard DTU tiers, so db-orders can't be zone redundant. Geo-restore requires geo-redundant (GRS or GZRS) backup storage; db-billing uses locally redundant backup storage, so its backups never leave the region.
    fr: |
      La redondance interzone est disponible pour General Purpose, Business Critical, Hyperscale et Premium, mais pas pour les niveaux DTU Basic et Standard : db-orders ne peut pas être redondante interzone. La géorestauration exige un stockage de sauvegarde géoredondant (GRS ou GZRS) ; db-billing utilise un stockage de sauvegarde localement redondant, ses sauvegardes ne quittent donc jamais la région.
references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
