id: dp300-5a-mi-link-failback
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an on-premises instance named **SQL1** that runs SQL Server 2019 Enterprise with the latest cumulative update. SQL1 hosts a database named **PayrollDb**. The datacenter is connected to Azure by ExpressRoute.

    You need to recommend a disaster recovery solution for PayrollDb that meets the following requirements:

    - The secondary must be hosted in a platform as a service (PaaS) offering.
    - After a disaster, PayrollDb must run in Azure, and then fail back to the on-premises datacenter once it's repaired.

    What should you recommend?
  fr: |
    Contoso dispose d'une instance locale nommée **SQL1** qui exécute SQL Server 2019 Enterprise avec la dernière mise à jour cumulative. SQL1 héberge une base de données nommée **PayrollDb**. Le centre de données est connecté à Azure par ExpressRoute.

    Vous devez recommander une solution de récupération d'urgence pour PayrollDb qui satisfait les exigences suivantes :

    - Le secondaire doit être hébergé dans une offre PaaS (platform as a service).
    - Après un sinistre, PayrollDb doit s'exécuter dans Azure, puis revenir vers le centre de données local une fois celui-ci réparé.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Configure a Managed Instance link from SQL1 to a managed instance that uses the SQL Server 2022 update policy.", fr: "Configurer un lien Managed Instance de SQL1 vers une instance managée qui utilise la stratégie de mise à jour SQL Server 2022." } }
    - { id: b, text: { en: "Upgrade SQL1 to SQL Server 2022, and then configure a Managed Instance link to a managed instance that uses the SQL Server 2022 update policy.", fr: "Mettre à niveau SQL1 vers SQL Server 2022, puis configurer un lien Managed Instance vers une instance managée qui utilise la stratégie de mise à jour SQL Server 2022." } }
    - { id: c, text: { en: "Upgrade SQL1 to SQL Server 2022, and then configure a Managed Instance link to a managed instance that uses the Always-up-to-date update policy.", fr: "Mettre à niveau SQL1 vers SQL Server 2022, puis configurer un lien Managed Instance vers une instance managée qui utilise la stratégie de mise à jour Always-up-to-date." } }
    - { id: d, text: { en: "Use Log Replay Service to restore the log backups of PayrollDb continuously on a managed instance.", fr: "Utiliser Log Replay Service pour restaurer en continu les sauvegardes de journal de PayrollDb sur une instance managée." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Managed Instance link is the PaaS disaster recovery option for SQL Server. With SQL Server 2019, the link replicates in one direction only, so failing back isn't supported. Failback requires SQL Server 2022 or 2025 and a managed instance that uses the matching SQL Server 2022 or SQL Server 2025 update policy.
    fr: |
      Le lien Managed Instance est l'option de récupération d'urgence PaaS pour SQL Server. Avec SQL Server 2019, le lien ne réplique que dans un sens : le retour n'est pas pris en charge. Le retour exige SQL Server 2022 ou 2025 et une instance managée qui utilise la stratégie de mise à jour SQL Server 2022 ou SQL Server 2025 correspondante.
  options:
    a: { en: "SQL Server 2019 supports only a one-way link to SQL Managed Instance, whatever the update policy, so you can't fail back.", fr: "SQL Server 2019 ne prend en charge qu'un lien unidirectionnel vers SQL Managed Instance, quelle que soit la stratégie de mise à jour : le retour est impossible." }
    c: { en: "With the Always-up-to-date policy, after a failover to the managed instance you can't replicate or fail back to SQL Server.", fr: "Avec la stratégie Always-up-to-date, après un basculement vers l'instance managée, vous ne pouvez plus répliquer vers SQL Server ni y revenir." }
    d: { en: "Log Replay Service is a migration service: the database is usable only after the cutover, and it provides no replication back to SQL Server.", fr: "Log Replay Service est un service de migration : la base n'est utilisable qu'après le basculement final, et il n'offre aucune réplication vers SQL Server." }
references:
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
