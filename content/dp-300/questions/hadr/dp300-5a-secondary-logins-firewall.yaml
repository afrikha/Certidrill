id: dp300-5a-secondary-logins-firewall
objective: "5.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a failover group named **fog-crm** between a primary server named **srv-crm-weu** and a secondary server named **srv-crm-neu**. The application connects through the read-write listener of fog-crm.

    The application authenticates with SQL logins defined in the master database of srv-crm-weu. Access from the office public IP addresses is allowed by server-level IP firewall rules on srv-crm-weu.

    Before the next disaster recovery drill, you need to ensure that the application can connect after fog-crm fails over to srv-crm-neu.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un groupe de basculement nommé **fog-crm** entre un serveur primaire nommé **srv-crm-weu** et un serveur secondaire nommé **srv-crm-neu**. L'application se connecte par l'écouteur en lecture-écriture de fog-crm.

    L'application s'authentifie avec des connexions SQL définies dans la base master de srv-crm-weu. L'accès depuis les adresses IP publiques des bureaux est autorisé par des règles de pare-feu IP de niveau serveur sur srv-crm-weu.

    Avant le prochain exercice de récupération d'urgence, vous devez faire en sorte que l'application puisse se connecter après le basculement de fog-crm vers srv-crm-neu.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On srv-crm-neu, create the SQL logins with the same SIDs as on srv-crm-weu.", fr: "Sur srv-crm-neu, créer les connexions SQL avec les mêmes SID que sur srv-crm-weu." } }
    - { id: b, text: { en: "Enable failover of the read-only listener of fog-crm.", fr: "Activer le basculement de l'écouteur en lecture seule de fog-crm." } }
    - { id: c, text: { en: "Change the application connection string to srv-crm-neu.database.windows.net.", fr: "Remplacer la chaîne de connexion de l'application par srv-crm-neu.database.windows.net." } }
    - { id: d, text: { en: "On srv-crm-neu, create the same server-level IP firewall rules as on srv-crm-weu.", fr: "Sur srv-crm-neu, créer les mêmes règles de pare-feu IP de niveau serveur que sur srv-crm-weu." } }
    - { id: e, text: { en: "Configure a long-term retention policy on the secondary databases.", fr: "Configurer une stratégie de rétention à long terme sur les bases secondaires." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Server-level logins live in the master database of each server and aren't replicated; the database users of the geo-secondary map to logins by SID, so you create the logins on srv-crm-neu with the same SIDs. Server-level IP firewall rules are also stored at the server level and must be recreated on the secondary; database-level rules and contained users travel with the database.
    fr: |
      Les connexions de niveau serveur résident dans la base master de chaque serveur et ne sont pas répliquées ; les utilisateurs de la base géosecondaire sont associés aux connexions par SID : vous créez donc les connexions sur srv-crm-neu avec les mêmes SID. Les règles de pare-feu IP de niveau serveur sont elles aussi stockées au niveau du serveur et doivent être recréées sur le secondaire ; les règles de niveau base de données et les utilisateurs contenus suivent la base.
  options:
    b: { en: "The read-only listener serves read-intent connections; the application uses the read-write listener.", fr: "L'écouteur en lecture seule sert les connexions en lecture ; l'application utilise l'écouteur en lecture-écriture." }
    c: { en: "The read-write listener follows the primary after a failover, so the connection string must not change.", fr: "L'écouteur en lecture-écriture suit le primaire après un basculement : la chaîne de connexion ne doit pas changer." }
    e: { en: "LTR policies concern backup retention, not the ability to connect after a failover.", fr: "Les stratégies LTR concernent la rétention des sauvegardes, pas la capacité à se connecter après un basculement." }
references:
  - title: Configure and manage Azure SQL Database security for geo-restore or failover
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-security-configure
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
