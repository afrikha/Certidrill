id: dp300-5a-test-local-failover
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **AppDb** on a logical server named **srv-app** in the resource group **rg-app**. AppDb isn't part of a failover group or a geo-replication relationship.

    The developers added retry logic for transient errors to the application. You need to test how the application behaves when the built-in high availability of AppDb fails over to another replica in the same region.

    What should you run?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **AppDb** sur un serveur logique nommé **srv-app** dans le groupe de ressources **rg-app**. AppDb ne fait partie d'aucun groupe de basculement ni d'aucune relation de géoréplication.

    Les développeurs ont ajouté à l'application une logique de nouvelle tentative pour les erreurs temporaires. Vous devez tester le comportement de l'application lorsque la haute disponibilité intégrée de AppDb bascule vers un autre réplica de la même région.

    Que devez-vous exécuter ?
body:
  options:
    - { id: a, text: "Switch-AzSqlDatabaseFailoverGroup -ResourceGroupName rg-app -ServerName srv-app" }
    - { id: b, text: "ALTER DATABASE AppDb FORCE_FAILOVER_ALLOW_DATA_LOSS;" }
    - { id: c, text: "Set-AzSqlDatabase -ResourceGroupName rg-app -ServerName srv-app -DatabaseName AppDb -ZoneRedundant" }
    - { id: d, text: "Invoke-AzSqlDatabaseFailover -ResourceGroupName rg-app -ServerName srv-app -DatabaseName AppDb" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Invoke-AzSqlDatabaseFailover triggers a user-initiated failover of the database to another replica of its high availability configuration, which lets you test the application's resilience. Only one such failover is allowed every 15 minutes per database or elastic pool.
    fr: |
      Invoke-AzSqlDatabaseFailover déclenche un basculement initié par l'utilisateur de la base vers un autre réplica de sa configuration de haute disponibilité, ce qui permet de tester la résilience de l'application. Un seul basculement de ce type est autorisé toutes les 15 minutes par base de données ou pool élastique.
  options:
    a: { en: "Switch-AzSqlDatabaseFailoverGroup fails over a failover group to another region, and AppDb isn't in a failover group.", fr: "Switch-AzSqlDatabaseFailoverGroup fait basculer un groupe de basculement vers une autre région, et AppDb n'appartient à aucun groupe de basculement." }
    b: { en: "This statement forces a geo-secondary to become the primary; it requires a geo-replication relationship.", fr: "Cette instruction force un géosecondaire à devenir primaire ; elle exige une relation de géoréplication." }
    c: { en: "Enabling zone redundancy changes the configuration of the database; it doesn't trigger a failover to test.", fr: "Activer la redondance interzone modifie la configuration de la base ; cela ne déclenche pas de basculement à tester." }
references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
