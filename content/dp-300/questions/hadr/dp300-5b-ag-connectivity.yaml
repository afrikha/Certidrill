id: dp300-5b-ag-connectivity
objective: "5.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are deploying Always On availability groups on SQL Server on Azure virtual machines for four applications. Each application has the connectivity requirements shown in the answer area.

    Which connectivity option should you use for each application? To answer, drag the appropriate options to the correct applications. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez des groupes de disponibilité Always On sur SQL Server sur des machines virtuelles Azure pour quatre applications. Chaque application a les exigences de connectivité indiquées dans la zone de réponse.

    Quelle option de connectivité devez-vous utiliser pour chaque application ? Pour répondre, faites glisser les options appropriées vers les applications correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: multisub, text: { en: "Listener with one IP address in each subnet", fr: "Écouteur avec une adresse IP dans chaque sous-réseau" } }
    - { id: dnn, text: { en: "Distributed network name (DNN) listener", fr: "Écouteur de nom de réseau distribué (DNN)" } }
    - { id: vnn, text: { en: "Virtual network name (VNN) listener with an Azure Load Balancer", fr: "Écouteur de nom de réseau virtuel (VNN) avec Azure Load Balancer" } }
    - { id: mirror, text: { en: "Connection string with a Failover Partner, without a listener", fr: "Chaîne de connexion avec un Failover Partner, sans écouteur" } }
    - { id: tm, text: { en: "Azure Traffic Manager profile with priority routing", fr: "Profil Azure Traffic Manager avec routage par priorité" } }
  targets:
    - { id: t1, text: { en: "App1: SQL Server 2022 replicas in two subnets of the same virtual network; no load balancer", fr: "App1 : réplicas SQL Server 2022 dans deux sous-réseaux du même réseau virtuel ; aucun équilibreur de charge" } }
    - { id: t2, text: { en: "App2: SQL Server 2022 on Windows Server 2022, replicas in a single subnet; fastest failover and no load balancer", fr: "App2 : SQL Server 2022 sur Windows Server 2022, réplicas dans un seul sous-réseau ; basculement le plus rapide et aucun équilibreur de charge" } }
    - { id: t3, text: { en: "App3: SQL Server 2014 on Windows Server 2012 R2, replicas in a single subnet", fr: "App3 : SQL Server 2014 sur Windows Server 2012 R2, réplicas dans un seul sous-réseau" } }
    - { id: t4, text: { en: "App4: basic availability group in Standard edition with one non-readable secondary; no listener and no load balancer", fr: "App4 : groupe de disponibilité de base en édition Standard avec un seul secondaire non lisible ; ni écouteur ni équilibreur de charge" } }
answer:
  mapping: { t1: multisub, t2: dnn, t3: vnn, t4: mirror }
explanation:
  correct:
    en: |
      With replicas in several subnets, the listener gets one IP address per subnet and needs neither a load balancer nor a DNN. In a single subnet, Azure doesn't support gratuitous ARP, so you need a DNN listener (faster failover, no load balancer, recent versions only) or a VNN listener behind an Azure Load Balancer, the option for older versions such as SQL Server 2014. A basic availability group can skip the listener and use a database mirroring-style connection string with a Failover Partner.
    fr: |
      Avec des réplicas dans plusieurs sous-réseaux, l'écouteur reçoit une adresse IP par sous-réseau et ne nécessite ni équilibreur de charge ni DNN. Dans un seul sous-réseau, Azure ne prend pas en charge l'ARP gratuit : il faut un écouteur DNN (basculement plus rapide, sans équilibreur de charge, versions récentes uniquement) ou un écouteur VNN derrière Azure Load Balancer, l'option des versions plus anciennes comme SQL Server 2014. Un groupe de disponibilité de base peut se passer d'écouteur et utiliser une chaîne de connexion de type mise en miroir avec un Failover Partner.
  options:
    tm: { en: "Traffic Manager routes DNS for internet endpoints; it doesn't track which replica is the primary.", fr: "Traffic Manager route le DNS vers des points de terminaison Internet ; il ne suit pas le réplica primaire." }
references:
  - title: Always On availability group on SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-overview
