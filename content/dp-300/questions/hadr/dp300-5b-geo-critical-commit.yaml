id: dp300-5b-geo-critical-commit
objective: "5.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **Trades** on a logical server named **srv-trading**. Trades is geo-replicated to a logical server named **srv-trading-dr** by using active geo-replication.

    An application commits settlement transactions in Trades. A settlement must never be lost, even if a forced failover to srv-trading-dr occurs right after the commit. The other transactions of the application can tolerate the normal replication lag. The solution must minimize the impact on application performance.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **Trades** sur un serveur logique nommé **srv-trading**. Trades est géorépliquée vers un serveur logique nommé **srv-trading-dr** par géoréplication active.

    Une application valide des transactions de règlement dans Trades. Un règlement ne doit jamais être perdu, même si un basculement forcé vers srv-trading-dr se produit juste après la validation. Les autres transactions de l'application peuvent tolérer le retard normal de la réplication. La solution doit minimiser l'impact sur les performances de l'application.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Trades to a failover group that uses the Microsoft managed failover policy with a one-hour grace period.", fr: "Ajouter Trades à un groupe de basculement qui utilise la stratégie de basculement gérée par Microsoft avec une période de grâce d'une heure." } }
    - { id: b, text: { en: "Scale the geo-secondary to a larger compute size than the primary.", fr: "Faire passer la base secondaire à une taille de calcul supérieure à celle de la base primaire." } }
    - { id: c, text: { en: "Change the service tier of Trades and its geo-secondary to Business Critical.", fr: "Faire passer Trades et sa base secondaire au niveau de service Business Critical." } }
    - { id: d, text: { en: "Call sys.sp_wait_for_database_copy_sync immediately after each settlement commit.", fr: "Appeler sys.sp_wait_for_database_copy_sync immédiatement après chaque validation de règlement." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Geo-replication is asynchronous, so a forced failover can lose the most recent commits. `sp_wait_for_database_copy_sync` blocks the calling session until the last committed transaction is hardened in the transaction log of the secondary. Calling it only after settlements protects them while the other transactions keep the asynchronous performance.
    fr: |
      La géoréplication est asynchrone : un basculement forcé peut perdre les dernières validations. `sp_wait_for_database_copy_sync` bloque la session appelante jusqu'à ce que la dernière transaction validée soit renforcée dans le journal des transactions de la base secondaire. L'appeler uniquement après les règlements les protège, tandis que les autres transactions conservent les performances du mode asynchrone.
  options:
    a: { en: "A failover group still replicates asynchronously; the grace period delays a forced failover but doesn't prevent data loss.", fr: "Un groupe de basculement réplique toujours de manière asynchrone ; la période de grâce retarde un basculement forcé, mais n'empêche pas la perte de données." }
    b: { en: "A larger secondary can reduce lag but never guarantees that a committed transaction has reached it.", fr: "Une base secondaire plus grande peut réduire le retard, mais ne garantit jamais qu'une transaction validée l'a atteinte." }
    c: { en: "Business Critical replicas inside the region are synchronous, but the geo-secondary stays asynchronous.", fr: "Les réplicas Business Critical de la région sont synchrones, mais la base secondaire géographique reste asynchrone." }
references:
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
