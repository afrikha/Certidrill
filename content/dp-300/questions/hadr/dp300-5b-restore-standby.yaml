id: dp300-5b-restore-standby
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine named **SQLVM2**. You are restoring a full backup and a series of transaction log backups of a database named **Claims** to SQLVM2.

    Between two log restores, auditors must be able to run read-only queries against Claims. You must still be able to apply the remaining log backups afterward.

    Which option should you use when you restore each log backup?
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM2**. Vous restaurez sur SQLVM2 une sauvegarde complète et une série de sauvegardes du journal des transactions d'une base de données nommée **Claims**.

    Entre deux restaurations de journal, des auditeurs doivent pouvoir exécuter des requêtes en lecture seule sur Claims. Vous devez ensuite pouvoir appliquer les sauvegardes de journal restantes.

    Quelle option devez-vous utiliser lors de la restauration de chaque sauvegarde de journal ?
body:
  options:
    - { id: a, text: "WITH NORECOVERY" }
    - { id: b, text: "WITH RECOVERY" }
    - { id: c, text: "WITH STANDBY = N'F:\\Undo\\Claims_undo.tuf'" }
    - { id: d, text: "WITH REPLACE" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `STANDBY` rolls back uncommitted transactions into an undo file so that the database is readable, and it keeps the restore sequence open so that the next log backup can still be applied. This is the mode that log shipping uses for readable secondaries.
    fr: |
      `STANDBY` annule les transactions non validées dans un fichier d'annulation afin que la base de données soit lisible, tout en laissant la séquence de restauration ouverte pour appliquer la sauvegarde de journal suivante. C'est le mode qu'utilise la copie des journaux de transaction pour les bases secondaires lisibles.
  options:
    a: { en: "NORECOVERY lets you apply more log backups, but the database stays in the RESTORING state and can't be queried.", fr: "NORECOVERY permet d'appliquer d'autres sauvegardes de journal, mais la base de données reste à l'état RESTORING et ne peut pas être interrogée." }
    b: { en: "RECOVERY brings the database online, but no further log backup can be applied afterward.", fr: "RECOVERY met la base de données en ligne, mais aucune autre sauvegarde de journal ne peut ensuite être appliquée." }
    d: { en: "REPLACE only skips the safety check that prevents overwriting an existing database; it doesn't make the database readable.", fr: "REPLACE ignore seulement la vérification qui empêche d'écraser une base de données existante ; il ne rend pas la base lisible." }
references:
  - title: RESTORE Statements - Arguments (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-arguments-transact-sql
