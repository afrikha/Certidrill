id: dp300-5c-ts-ls-broken-chain
objective: "5.3.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a log shipping configuration for a database named **SalesDb** from **SQL1** to **SQL2**. The secondary database uses No recovery mode.

    Since 10:15, the restore job on SQL2 fails with an error stating that the log in the backup set begins at an LSN that is too recent to apply to the database. The backup history on SQL1 shows that at 10:05 a developer ran the following statement, and the file still exists:

    `BACKUP LOG SalesDb TO DISK = N'D:\Temp\SalesDb.trn';`

    You need to resume log shipping and prevent the issue from happening again. The solution must minimize effort. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une configuration de copie des journaux de transaction pour une base de données nommée **SalesDb**, de **SQL1** vers **SQL2**. La base secondaire utilise le mode No recovery.

    Depuis 10:15, le travail de restauration sur SQL2 échoue avec une erreur indiquant que le journal du jeu de sauvegarde commence à un LSN trop récent pour être appliqué à la base. L'historique des sauvegardes sur SQL1 montre qu'à 10:05 un développeur a exécuté l'instruction suivante, et le fichier existe toujours :

    `BACKUP LOG SalesDb TO DISK = N'D:\Temp\SalesDb.trn';`

    Vous devez reprendre la copie des journaux de transaction et empêcher que le problème se reproduise. La solution doit réduire l'effort au minimum. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Restore the most recent full backup of SalesDb on SQL2 WITH RECOVERY.", fr: "Restaurer la dernière sauvegarde complète de SalesDb sur SQL2 WITH RECOVERY." } }
    - { id: b, text: { en: "Copy D:\\Temp\\SalesDb.trn to SQL2 and restore it WITH NORECOVERY.", fr: "Copier D:\\Temp\\SalesDb.trn sur SQL2 et le restaurer WITH NORECOVERY." } }
    - { id: c, text: { en: "Switch the secondary database to Standby mode.", fr: "Passer la base secondaire en mode Standby." } }
    - { id: d, text: { en: "Require ad hoc log backups of SalesDb to use WITH COPY_ONLY.", fr: "Exiger que les sauvegardes ponctuelles du journal de SalesDb utilisent WITH COPY_ONLY." } }
    - { id: e, text: { en: "Run the copy job on SQL2 more often.", fr: "Exécuter le travail de copie sur SQL2 plus souvent." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: The developer's log backup is part of the log chain but went to a local folder that the copy job never sees, so the next shipped backup starts at an LSN that SQL2 can't apply yet. Restoring the missing file WITH NORECOVERY closes the gap, and the restore job then continues with the shipped backups. A COPY_ONLY log backup doesn't affect the sequence of regular log backups, so ad hoc backups no longer break log shipping.
    fr: "La sauvegarde du journal du développeur fait partie de la chaîne de journaux, mais elle a été écrite dans un dossier local que le travail de copie ne voit pas ; la sauvegarde copiée suivante commence donc à un LSN que SQL2 ne peut pas encore appliquer. Restaurer le fichier manquant WITH NORECOVERY comble l'écart, puis le travail de restauration reprend avec les sauvegardes copiées. Une sauvegarde du journal COPY_ONLY n'affecte pas la séquence des sauvegardes du journal normales : les sauvegardes ponctuelles ne cassent plus la copie des journaux."
  options:
    a: { en: "WITH RECOVERY brings the secondary online and ends log shipping; reinitializing from a full backup would also take far more effort.", fr: "WITH RECOVERY met le secondaire en ligne et met fin à la copie des journaux ; réinitialiser à partir d'une sauvegarde complète demanderait en outre beaucoup plus d'effort." }
    c: { en: "Standby mode makes the secondary readable but doesn't fill the gap in the log chain.", fr: "Le mode Standby rend le secondaire lisible mais ne comble pas l'écart dans la chaîne de journaux." }
    e: { en: "The copy job only copies files from the backup share; the missing backup is in a local folder it never reads.", fr: "Le travail de copie ne copie que les fichiers du partage de sauvegarde ; la sauvegarde manquante se trouve dans un dossier local qu'il ne lit jamais." }
references:
  - title: Copy-Only Backups
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/copy-only-backups-sql-server
  - title: About Log Shipping (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/about-log-shipping-sql-server
