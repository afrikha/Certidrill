id: dp300-5b-pitr-other-server
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have two logical servers in Azure SQL Database, **srv-sales** and **srv-analytics**, in the same subscription and region. srv-sales hosts a database named **SalesDb** that has a point-in-time restore retention of 14 days and a long-term retention policy that keeps weekly backups for 8 weeks.

    Analysts need a database on srv-analytics that contains SalesDb as it was yesterday at 18:00. SalesDb must not be modified.

    What should you do?
  fr: |
    Vous disposez de deux serveurs logiques Azure SQL Database, **srv-sales** et **srv-analytics**, dans le même abonnement et la même région. srv-sales héberge une base de données nommée **SalesDb** dont la rétention de restauration à un point dans le temps est de 14 jours et dont la stratégie de rétention à long terme conserve les sauvegardes hebdomadaires pendant 8 semaines.

    Des analystes ont besoin, sur srv-analytics, d'une base de données qui contient SalesDb telle qu'elle était hier à 18:00. SalesDb ne doit pas être modifiée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run a point-in-time restore of SalesDb to yesterday 18:00 and select srv-analytics as the target server.", fr: "Effectuer une restauration à un point dans le temps de SalesDb à hier 18:00 en sélectionnant srv-analytics comme serveur cible." } }
    - { id: b, text: { en: "Run a geo-restore of SalesDb to srv-analytics and select yesterday 18:00 as the restore point.", fr: "Effectuer une géorestauration de SalesDb sur srv-analytics en sélectionnant hier 18:00 comme point de restauration." } }
    - { id: c, text: { en: "Restore the most recent long-term retention backup of SalesDb to srv-analytics.", fr: "Restaurer la sauvegarde de rétention à long terme la plus récente de SalesDb sur srv-analytics." } }
    - { id: d, text: { en: "Run a point-in-time restore of SalesDb to yesterday 18:00 on srv-sales, and then copy the restored database to srv-analytics.", fr: "Effectuer une restauration à un point dans le temps de SalesDb à hier 18:00 sur srv-sales, puis copier la base restaurée sur srv-analytics." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Point-in-time restore in Azure SQL Database always creates a new database on the same logical server; cross-server restore isn't supported. To get the 18:00 state onto another server, you restore it on srv-sales, then use a database copy, which supports another server, and finally drop the temporary database.
    fr: |
      Dans Azure SQL Database, la restauration à un point dans le temps crée toujours une nouvelle base de données sur le même serveur logique ; la restauration vers un autre serveur n'est pas prise en charge. Pour obtenir l'état de 18:00 sur un autre serveur, vous restaurez sur srv-sales, puis vous utilisez une copie de base de données, qui accepte un autre serveur, et vous supprimez enfin la base temporaire.
  options:
    a: { en: "The target server of a point-in-time restore is fixed to the source server; cross-server PITR isn't supported.", fr: "Le serveur cible d'une restauration à un point dans le temps est imposé (serveur source) ; la restauration vers un autre serveur n'est pas prise en charge." }
    b: { en: "Geo-restore uses the most recent geo-replicated backup; you can't choose an arbitrary point in time.", fr: "La géorestauration utilise la dernière sauvegarde géorépliquée ; vous ne pouvez pas choisir un point dans le temps quelconque." }
    c: { en: "Long-term retention backups are weekly full backups; none of them corresponds to yesterday 18:00.", fr: "Les sauvegardes de rétention à long terme sont des sauvegardes complètes hebdomadaires ; aucune ne correspond à hier 18:00." }
references:
  - title: Restore a database from a backup in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
