id: dp300-5a-vm-backup-options-match
objective: "5.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs SQL Server on Azure virtual machines. You need to recommend a backup option for each of the following workloads. Each option must minimize administrative effort.

    Which option should you recommend for each workload? To answer, drag the appropriate options to the correct workloads. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute SQL Server sur des machines virtuelles Azure. Vous devez recommander une option de sauvegarde pour chacune des charges de travail suivantes. Chaque option doit réduire au minimum l'effort d'administration.

    Quelle option devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les options appropriées vers les charges de travail correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: auto, text: Automated Backup }
    - { id: azbk, text: { en: "Azure Backup for SQL Server in Azure VMs", fr: "Sauvegarde Azure pour SQL Server dans des machines virtuelles Azure" } }
    - { id: tsql, text: { en: "SQL Server Agent jobs that run BACKUP ... TO URL", fr: "Des travaux SQL Server Agent qui exécutent BACKUP ... TO URL" } }
    - { id: asr, text: Azure Site Recovery }
    - { id: ltr, text: { en: "Long-term retention policy", fr: "Stratégie de rétention à long terme" } }
  targets:
    - id: t1
      text: { en: "A single development VM: backups to a storage account handled by the SQL IaaS Agent extension, kept 30 days", fr: "Une seule machine virtuelle de développement : sauvegardes vers un compte de stockage gérées par l'extension SQL IaaS Agent, conservées 30 jours" }
    - id: t2
      text: { en: "Hundreds of production databases on many VMs: central reporting, retention of five years", fr: "Des centaines de bases de production sur de nombreuses machines virtuelles : rapports centralisés, rétention de cinq ans" }
    - id: t3
      text: { en: "A data warehouse VM: a custom schedule that stripes each backup across several block blobs", fr: "Une machine virtuelle d'entrepôt de données : une planification personnalisée qui répartit chaque sauvegarde sur plusieurs objets blob de blocs" }
answer:
  mapping: { t1: auto, t2: azbk, t3: tsql }
explanation:
  correct:
    en: |
      Automated Backup is configured per VM by the SQL IaaS Agent extension and writes to a storage account, with a retention of up to 90 days. Azure Backup centralizes hundreds of databases in a Recovery Services vault with long retention policies and reports. A custom schedule with striping to several URLs requires your own BACKUP ... TO URL statements, for example in SQL Server Agent jobs.
    fr: |
      Automated Backup se configure par machine virtuelle via l'extension SQL IaaS Agent et écrit dans un compte de stockage, avec une rétention allant jusqu'à 90 jours. Sauvegarde Azure centralise des centaines de bases dans un coffre Recovery Services avec des stratégies de rétention longues et des rapports. Une planification personnalisée avec répartition sur plusieurs URL exige vos propres instructions BACKUP ... TO URL, par exemple dans des travaux SQL Server Agent.
  options:
    asr: { en: "Site Recovery replicates whole VMs for disaster recovery and doesn't provide database backups.", fr: "Site Recovery réplique des machines virtuelles entières pour la récupération d'urgence et ne fournit pas de sauvegardes de bases." }
    ltr: { en: "LTR policies apply to Azure SQL Database and SQL Managed Instance, not to SQL Server on VMs.", fr: "Les stratégies LTR s'appliquent à Azure SQL Database et à SQL Managed Instance, pas à SQL Server sur des machines virtuelles." }
references:
  - title: Backup and restore for SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/backup-restore
