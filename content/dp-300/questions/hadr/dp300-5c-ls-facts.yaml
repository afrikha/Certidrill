id: dp300-5c-ls-facts
objective: "5.3.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan to configure log shipping for a database named **FinanceDb** from **SQLVM1**, which runs SQL Server 2019, to **SQLVM2**, which runs SQL Server 2022. You don't plan to use a monitor server at first.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de configurer la copie des journaux de transaction d'une base de données nommée **FinanceDb** de **SQLVM1**, qui exécute SQL Server 2019, vers **SQLVM2**, qui exécute SQL Server 2022. Vous ne prévoyez pas d'utiliser de serveur moniteur au départ.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add a monitor server later without removing the log shipping configuration.
        fr: Vous pouvez ajouter un serveur moniteur plus tard sans supprimer la configuration de copie des journaux de transaction.
    - id: s2
      text:
        en: You can configure the secondary database on SQLVM2 in Standby mode so that it can be read between restores.
        fr: Vous pouvez configurer la base secondaire sur SQLVM2 en mode Standby afin qu'elle soit lisible entre les restaurations.
    - id: s3
      text:
        en: You can delay the restores on SQLVM2 so that data changed by mistake on SQLVM1 can be retrieved from SQLVM2 before the change is applied there.
        fr: Vous pouvez retarder les restaurations sur SQLVM2 afin de pouvoir récupérer depuis SQLVM2 des données modifiées par erreur sur SQLVM1 avant que la modification n'y soit appliquée.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: The monitor server must be added when you configure log shipping; adding one later requires removing and recreating the configuration. Standby mode is only available when the primary and secondary run the same version; with a later major version on the secondary, only No recovery mode is possible. The Delay restoring backups setting keeps the secondary behind the primary, which leaves time to retrieve data changed by mistake.
    fr: Le serveur moniteur doit être ajouté lors de la configuration de la copie des journaux ; en ajouter un plus tard exige de supprimer puis de recréer la configuration. Le mode Standby n'est disponible que si le primaire et le secondaire exécutent la même version ; avec une version majeure plus récente sur le secondaire, seul le mode No recovery est possible. Le paramètre Delay restoring backups maintient le secondaire en retard sur le primaire, ce qui laisse le temps de récupérer des données modifiées par erreur.
references:
  - title: Configure Log Shipping (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/configure-log-shipping-sql-server
  - title: About Log Shipping (SQL Server)
