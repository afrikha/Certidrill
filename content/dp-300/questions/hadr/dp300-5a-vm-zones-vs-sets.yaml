id: dp300-5a-vm-zones-vs-sets
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy an Always On availability group on two SQL Server virtual machines in the Central US region. Both replicas must stay in Central US.

    You need to ensure that the availability group remains available if an entire datacenter of the region is lost.

    How should you deploy the virtual machines?
  fr: |
    Vous prévoyez de déployer un groupe de disponibilité Always On sur deux machines virtuelles SQL Server dans la région Central US. Les deux réplicas doivent rester dans Central US.

    Vous devez faire en sorte que le groupe de disponibilité reste disponible en cas de perte d'un centre de données entier de la région.

    Comment devez-vous déployer les machines virtuelles ?
body:
  options:
    - { id: a, text: { en: "In the same availability set", fr: "Dans le même groupe à haute disponibilité" } }
    - { id: b, text: { en: "In different availability zones", fr: "Dans des zones de disponibilité différentes" } }
    - { id: c, text: { en: "In the same proximity placement group", fr: "Dans le même groupe de placement de proximité" } }
    - { id: d, text: { en: "In the same availability set, with Azure Site Recovery enabled", fr: "Dans le même groupe à haute disponibilité, avec Azure Site Recovery activé" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Availability zones are physically separate datacenters within a region, so replicas in different zones survive the loss of one datacenter. A VM can be in an availability set or in an availability zone, not both, and zones add some latency between replicas.
    fr: |
      Les zones de disponibilité sont des centres de données physiquement séparés au sein d'une région : des réplicas dans des zones différentes survivent à la perte d'un centre de données. Une machine virtuelle peut se trouver dans un groupe à haute disponibilité ou dans une zone de disponibilité, pas dans les deux, et les zones ajoutent un peu de latence entre les réplicas.
  options:
    a: { en: "An availability set protects against rack failures and planned maintenance inside one datacenter only.", fr: "Un groupe à haute disponibilité ne protège que contre les pannes de rack et la maintenance planifiée au sein d'un même centre de données." }
    c: { en: "A proximity placement group keeps the VMs physically close to reduce latency, which increases the risk of losing both at once.", fr: "Un groupe de placement de proximité rapproche physiquement les machines virtuelles pour réduire la latence, ce qui augmente le risque de les perdre toutes les deux." }
    d: { en: "Site Recovery replicates to another region, which the requirement excludes, and both replicas would still share one datacenter.", fr: "Site Recovery réplique vers une autre région, ce que l'exigence exclut, et les deux réplicas partageraient toujours un même centre de données." }
references:
  - title: Always On availability group on SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-overview
