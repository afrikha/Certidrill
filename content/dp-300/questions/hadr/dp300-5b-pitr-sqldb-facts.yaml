id: dp300-5b-pitr-sqldb-facts
objective: "5.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **srv-crm** that hosts a General Purpose database named **Accounts**. The point-in-time restore retention of Accounts is 21 days. You plan how to use point-in-time restore for Accounts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **srv-crm** qui héberge une base de données General Purpose nommée **Accounts**. La rétention de restauration à un point dans le temps d'Accounts est de 21 jours. Vous planifiez l'utilisation de la restauration à un point dans le temps pour Accounts.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can restore Accounts to a point in time as a Business Critical database on srv-crm.
        fr: Vous pouvez restaurer Accounts à un point dans le temps en tant que base de données Business Critical sur srv-crm.
    - id: s2
      text:
        en: A point-in-time restore can overwrite Accounts in place, without creating another database.
        fr: Une restauration à un point dans le temps peut écraser Accounts sur place, sans créer d'autre base de données.
    - id: s3
      text:
        en: If srv-crm is deleted, you can restore Accounts to a point in time from its automated backups.
        fr: Si srv-crm est supprimé, vous pouvez restaurer Accounts à un point dans le temps à partir de ses sauvegardes automatiques.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A point-in-time restore can specify any service tier or compute size for the new database (restores between Hyperscale and other tiers are the exception). It never overwrites an existing database: to replace Accounts, you rename the databases afterward. Deleting a logical server deletes its databases and their point-in-time backups; only long-term retention backups survive.
    fr: |
      Une restauration à un point dans le temps peut spécifier n'importe quel niveau de service ou taille de calcul pour la nouvelle base (les restaurations entre Hyperscale et les autres niveaux font exception). Elle n'écrase jamais une base existante : pour remplacer Accounts, vous renommez ensuite les bases. La suppression d'un serveur logique supprime ses bases de données et leurs sauvegardes de restauration à un point dans le temps ; seules les sauvegardes de rétention à long terme sont conservées.
references:
  - title: Restore a database from a backup in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
