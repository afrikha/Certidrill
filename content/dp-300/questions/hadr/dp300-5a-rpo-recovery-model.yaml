id: dp300-5a-rpo-recovery-model
objective: "5.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 virtual machine in Azure that hosts a database named **InvDb**. InvDb uses the simple recovery model, and a SQL Server Agent job takes a full backup of InvDb every night.

    You need to change the backup strategy to meet the following requirements:

    - The data loss after a failure of the data files must not exceed 15 minutes.
    - InvDb must be restorable to a point in time just before a user error.

    How should you complete the strategy? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle SQL Server 2022 dans Azure qui héberge une base de données nommée **InvDb**. InvDb utilise le mode de récupération simple, et un travail SQL Server Agent effectue chaque nuit une sauvegarde complète de InvDb.

    Vous devez modifier la stratégie de sauvegarde pour satisfaire les exigences suivantes :

    - La perte de données après une défaillance des fichiers de données ne doit pas dépasser 15 minutes.
    - InvDb doit pouvoir être restaurée à un point dans le temps juste avant une erreur d'utilisateur.

    Comment devez-vous compléter la stratégie ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Set the recovery model of InvDb to [[model]].

      Keep the nightly full backup, and schedule [[type]] every 15 minutes.
    fr: |
      Définir le mode de récupération de InvDb sur [[model]].

      Conserver la sauvegarde complète nocturne, et planifier [[type]] toutes les 15 minutes.
  slots:
    - id: model
      options:
        - { id: simple, text: SIMPLE }
        - { id: bulk, text: BULK_LOGGED }
        - { id: full, text: FULL }
    - id: type
      options:
        - { id: diff, text: { en: "a differential backup", fr: "une sauvegarde différentielle" } }
        - { id: log, text: { en: "a transaction log backup", fr: "une sauvegarde du journal des transactions" } }
        - { id: copy, text: { en: "a copy-only full backup", fr: "une sauvegarde complète de copie seule" } }
answer:
  values: { model: full, type: log }
explanation:
  correct:
    en: |
      The full recovery model supports log backups and point-in-time restore. With a log backup every 15 minutes, the RPO of a data file failure is at most 15 minutes, and a tail-log backup can reduce it further when the log is intact.
    fr: |
      Le mode de récupération complète prend en charge les sauvegardes de journal et la restauration à un point dans le temps. Avec une sauvegarde de journal toutes les 15 minutes, le RPO d'une défaillance des fichiers de données est de 15 minutes au plus, et une sauvegarde de la fin du journal peut le réduire encore si le journal est intact.
  options:
    simple: { en: "The simple recovery model doesn't support log backups or point-in-time restore.", fr: "Le mode de récupération simple ne prend en charge ni les sauvegardes de journal ni la restauration à un point dans le temps." }
    bulk: { en: "The bulk-logged model supports log backups but not point-in-time recovery.", fr: "Le mode de récupération utilisant les journaux de transactions prend en charge les sauvegardes de journal, mais pas la récupération à un point dans le temps." }
    diff: { en: "A differential backup every 15 minutes rereads every extent changed since the full backup and still doesn't allow a restore between two backups.", fr: "Une sauvegarde différentielle toutes les 15 minutes relit toutes les extensions modifiées depuis la sauvegarde complète et ne permet toujours pas une restauration entre deux sauvegardes." }
    copy: { en: "Copy-only full backups give restore points only at the time of each backup, at a high storage cost.", fr: "Des sauvegardes complètes de copie seule ne donnent des points de restauration qu'au moment de chaque sauvegarde, pour un coût de stockage élevé." }
references:
  - title: Recovery models (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/recovery-models-sql-server
