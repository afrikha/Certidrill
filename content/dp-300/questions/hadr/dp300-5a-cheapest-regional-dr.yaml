id: dp300-5a-cheapest-regional-dr
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **OrdersDb** in the General Purpose service tier. OrdersDb uses the default backup storage redundancy.

    The business continuity plan states that if the Azure region that hosts OrdersDb becomes unavailable, OrdersDb must be recovered in another region within 24 hours, and that losing several hours of changes is acceptable. The solution must minimize cost.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **OrdersDb** dans le niveau de service General Purpose. OrdersDb utilise la redondance du stockage de sauvegarde par défaut.

    Le plan de continuité d'activité indique que si la région Azure qui héberge OrdersDb devient indisponible, OrdersDb doit être récupérée dans une autre région en moins de 24 heures, et qu'une perte de plusieurs heures de modifications est acceptable. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a failover group that contains OrdersDb.", fr: "Créer un groupe de basculement qui contient OrdersDb." } }
    - { id: b, text: { en: "Configure active geo-replication with a standby replica.", fr: "Configurer la géoréplication active avec un réplica de secours (standby)." } }
    - { id: c, text: { en: "Configure a long-term retention policy with weekly backups.", fr: "Configurer une stratégie de rétention à long terme avec des sauvegardes hebdomadaires." } }
    - { id: d, text: { en: "Plan to geo-restore OrdersDb from its geo-redundant backups.", fr: "Prévoir une géorestauration de OrdersDb à partir de ses sauvegardes géoredondantes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The default backup storage redundancy is geo-redundant (GRS), so the backups are already copied to the paired region. Geo-restore creates a new database from those backups on any server in any region, with an RTO and RPO measured in hours, at no extra cost beyond backup storage.
    fr: |
      La redondance du stockage de sauvegarde par défaut est géoredondante (GRS) : les sauvegardes sont déjà copiées dans la région jumelée. La géorestauration crée une nouvelle base à partir de ces sauvegardes sur n'importe quel serveur de n'importe quelle région, avec un RTO et un RPO de l'ordre de quelques heures, sans autre coût que le stockage des sauvegardes.
  options:
    a: { en: "A failover group gives an RTO under a minute, but you pay for a secondary database that the stated RTO and RPO don't require.", fr: "Un groupe de basculement donne un RTO inférieur à une minute, mais vous payez une base secondaire que le RTO et le RPO indiqués n'exigent pas." }
    b: { en: "A standby replica saves the license cost, but you still pay its compute and storage; geo-restore meets the targets for less.", fr: "Un réplica de secours économise le coût de licence, mais vous payez toujours son calcul et son stockage ; la géorestauration atteint les objectifs pour moins cher." }
    c: { en: "Weekly LTR backups give an RPO of up to a week, which exceeds the acceptable few hours of data loss.", fr: "Des sauvegardes LTR hebdomadaires donnent un RPO pouvant atteindre une semaine, ce qui dépasse la perte de quelques heures de données acceptée." }
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
