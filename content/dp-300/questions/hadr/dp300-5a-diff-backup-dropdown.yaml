id: dp300-5a-diff-backup-dropdown
objective: "5.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 virtual machine in Azure that hosts a database named **SalesDb**. A full backup of SalesDb is taken every Sunday.

    You need to write the nightly backup of SalesDb. The backup must contain only the extents changed since the last full backup, verify page checksums, and produce the smallest possible file.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle SQL Server 2022 dans Azure qui héberge une base de données nommée **SalesDb**. Une sauvegarde complète de SalesDb est effectuée chaque dimanche.

    Vous devez écrire la sauvegarde nocturne de SalesDb. La sauvegarde doit contenir uniquement les extensions modifiées depuis la dernière sauvegarde complète, vérifier les sommes de contrôle des pages et produire le fichier le plus petit possible.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    BACKUP [[kind]] SalesDb
    TO DISK = N'F:\Backup\SalesDb_diff.bak'
    WITH [[opt]], CHECKSUM, [[comp]];
  slots:
    - id: kind
      options:
        - { id: db, text: DATABASE }
        - { id: log, text: LOG }
        - { id: cert, text: CERTIFICATE }
    - id: opt
      options:
        - { id: diff, text: DIFFERENTIAL }
        - { id: copy, text: COPY_ONLY }
        - { id: norec, text: NORECOVERY }
        - { id: init, text: INIT }
    - id: comp
      options:
        - { id: comp, text: COMPRESSION }
        - { id: nocomp, text: NO_COMPRESSION }
        - { id: format, text: FORMAT }
answer:
  values: { kind: db, opt: diff, comp: comp }
explanation:
  correct:
    en: |
      A differential backup is a BACKUP DATABASE statement with the DIFFERENTIAL option; it contains the extents changed since the differential base, the last full backup. CHECKSUM verifies the pages while reading, and COMPRESSION produces a smaller and usually faster backup.
    fr: |
      Une sauvegarde différentielle est une instruction BACKUP DATABASE avec l'option DIFFERENTIAL ; elle contient les extensions modifiées depuis la base différentielle, la dernière sauvegarde complète. CHECKSUM vérifie les pages pendant la lecture, et COMPRESSION produit une sauvegarde plus petite et généralement plus rapide.
  options:
    log: { en: "BACKUP LOG backs up the transaction log records, not the changed extents.", fr: "BACKUP LOG sauvegarde les enregistrements du journal des transactions, pas les extensions modifiées." }
    copy: { en: "COPY_ONLY has no effect combined with DIFFERENTIAL, and on its own it produces a full backup.", fr: "COPY_ONLY n'a aucun effet combiné à DIFFERENTIAL et, seul, il produit une sauvegarde complète." }
    norec: { en: "NORECOVERY applies to log backups, where it leaves the database in the restoring state.", fr: "NORECOVERY s'applique aux sauvegardes de journal, où il laisse la base dans l'état de restauration." }
    nocomp: { en: "NO_COMPRESSION disables compression, so the file isn't the smallest.", fr: "NO_COMPRESSION désactive la compression : le fichier n'est pas le plus petit." }
references:
  - title: Copy-only backups
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/copy-only-backups-sql-server
  - title: Recovery models (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/recovery-models-sql-server
