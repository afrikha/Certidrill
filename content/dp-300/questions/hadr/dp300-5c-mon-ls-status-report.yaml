id: dp300-5c-mon-ls-status-report
objective: "5.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has 12 log shipping configurations on SQL Server instances that run on Azure virtual machines. All the configurations use a monitor server named **SQLMON**.

    You need a single view of the status of the backup, copy and restore operations of all the configurations. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Contoso dispose de 12 configurations de copie des journaux de transaction sur des instances SQL Server qui s'exécutent sur des machines virtuelles Azure. Toutes les configurations utilisent un serveur moniteur nommé **SQLMON**.

    Vous avez besoin d'une vue unique de l'état des opérations de sauvegarde, de copie et de restauration de toutes les configurations. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Always On availability group dashboard in SQL Server Management Studio, connected to SQLMON", fr: "Le tableau de bord des groupes de disponibilité Always On dans SQL Server Management Studio, connecté à SQLMON" } }
    - { id: b, text: { en: "The Transaction Log Shipping Status report in SQL Server Management Studio, run on SQLMON", fr: "Le rapport Transaction Log Shipping Status dans SQL Server Management Studio, exécuté sur SQLMON" } }
    - { id: c, text: { en: "A query on sys.dm_hadr_database_replica_states, run on each primary server", fr: "Une requête sur sys.dm_hadr_database_replica_states, exécutée sur chaque serveur primaire" } }
    - { id: d, text: { en: "The Azure Monitor activity log of the virtual machines that host the instances", fr: "Le journal d'activité Azure Monitor des machines virtuelles qui hébergent les instances" } }
answer: { optionId: b }
explanation:
  correct:
    en: The Transaction Log Shipping Status standard report shows, on a monitor server, the name and status of every primary and secondary server that uses it as monitor. The monitor server gives the most complete view, so one report covers the 12 configurations.
    fr: "Le rapport standard Transaction Log Shipping Status affiche, sur un serveur moniteur, le nom et l'état de chaque serveur primaire et secondaire qui l'utilise comme moniteur. Le serveur moniteur offre la vue la plus complète : un seul rapport couvre les 12 configurations."
  options:
    a: { en: "The dashboard shows availability groups, not log shipping configurations.", fr: "Le tableau de bord affiche les groupes de disponibilité, pas les configurations de copie des journaux de transaction." }
    c: { en: "This view reports availability group databases only, and querying each server separately doesn't minimize effort.", fr: "Cette vue ne concerne que les bases des groupes de disponibilité, et interroger chaque serveur séparément ne réduit pas l'effort." }
    d: { en: "The activity log records Azure control plane operations on the VMs, not SQL Server Agent log shipping jobs.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle Azure sur les machines virtuelles, pas les travaux SQL Server Agent de copie des journaux." }
references:
  - title: View the Log Shipping Report (SQL Server Management Studio)
    url: https://learn.microsoft.com/en-us/sql/database-engine/log-shipping/view-the-log-shipping-report-sql-server-management-studio
