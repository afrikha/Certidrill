id: dp300-5b-restore-tail-log-sequence
objective: "5.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a SQL Server 2022 instance on an Azure virtual machine. A database named **Orders** uses the FULL recovery model and is online. The backup schedule is:

    - a full backup every Sunday at 01:00
    - a differential backup every day at 01:00
    - a transaction log backup every 15 minutes

    On Wednesday at 10:07, a faulty deployment damages a set of tables that you can't repair. You decide to restore Orders over itself to its latest possible state by using the existing backups. The solution must minimize data loss and the number of backups to restore.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une instance SQL Server 2022 sur une machine virtuelle Azure. Une base de données nommée **Orders** utilise le mode de récupération FULL et est en ligne. La planification des sauvegardes est la suivante :

    - une sauvegarde complète chaque dimanche à 01:00
    - une sauvegarde différentielle chaque jour à 01:00
    - une sauvegarde du journal des transactions toutes les 15 minutes

    Le mercredi à 10:07, un déploiement défectueux endommage un ensemble de tables que vous ne pouvez pas réparer. Vous décidez de restaurer Orders sur elle-même dans l'état le plus récent possible à partir des sauvegardes existantes. La solution doit minimiser la perte de données et le nombre de sauvegardes à restaurer.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: tail, text: { en: "Back up the tail of the log of Orders WITH NORECOVERY.", fr: "Sauvegarder la fin du journal d'Orders WITH NORECOVERY." } }
    - { id: full, text: { en: "Restore the Sunday full backup WITH NORECOVERY.", fr: "Restaurer la sauvegarde complète du dimanche WITH NORECOVERY." } }
    - { id: diff, text: { en: "Restore the Wednesday differential backup WITH NORECOVERY.", fr: "Restaurer la sauvegarde différentielle du mercredi WITH NORECOVERY." } }
    - { id: logs, text: { en: "Restore, in order, the log backups taken after the Wednesday differential WITH NORECOVERY.", fr: "Restaurer, dans l'ordre, les sauvegardes de journal effectuées après la différentielle du mercredi WITH NORECOVERY." } }
    - { id: last, text: { en: "Restore the tail-log backup WITH RECOVERY.", fr: "Restaurer la sauvegarde de la fin du journal WITH RECOVERY." } }
    - { id: alldiff, text: { en: "Restore the Monday, Tuesday and Wednesday differential backups WITH NORECOVERY.", fr: "Restaurer les sauvegardes différentielles du lundi, du mardi et du mercredi WITH NORECOVERY." } }
    - { id: checkdb, text: { en: "Run DBCC CHECKDB on Orders with REPAIR_ALLOW_DATA_LOSS.", fr: "Exécuter DBCC CHECKDB sur Orders avec REPAIR_ALLOW_DATA_LOSS." } }
answer:
  sequence: [ tail, full, diff, logs, last ]
explanation:
  correct:
    en: |
      Because the database is online, you first back up the tail of the log `WITH NORECOVERY`: it captures the log records not yet backed up and leaves Orders in the restoring state so that nothing changes afterward. You then restore the full backup, only the most recent differential (each differential contains all changes since the full backup), the log backups taken after it, and finally the tail-log backup `WITH RECOVERY`.
    fr: |
      La base de données étant en ligne, vous sauvegardez d'abord la fin du journal `WITH NORECOVERY` : cette sauvegarde capture les enregistrements du journal non encore sauvegardés et laisse Orders à l'état de restauration pour qu'elle ne change plus. Vous restaurez ensuite la sauvegarde complète, uniquement la différentielle la plus récente (chaque différentielle contient toutes les modifications depuis la sauvegarde complète), les sauvegardes de journal effectuées après elle, puis la sauvegarde de la fin du journal `WITH RECOVERY`.
  options:
    alldiff: { en: "Differential backups are cumulative since the last full backup: only the most recent one is needed.", fr: "Les sauvegardes différentielles sont cumulatives depuis la dernière sauvegarde complète : seule la plus récente est nécessaire." }
    checkdb: { en: "REPAIR_ALLOW_DATA_LOSS can deallocate damaged pages and lose data; it doesn't restore anything.", fr: "REPAIR_ALLOW_DATA_LOSS peut désallouer des pages endommagées et perdre des données ; il ne restaure rien." }
references:
  - title: Tail-log backups (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/tail-log-backups-sql-server
  - title: RESTORE Statements - Arguments (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-arguments-transact-sql
