id: dp300-5a-vm-central-backup
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs 40 SQL Server 2022 virtual machines in Azure. Several of them host availability groups. The databases use the full recovery model.

    You need to recommend a backup solution that meets the following requirements:

    - Monitor all the backups from a single dashboard and send email alerts on failures.
    - Keep backups for three years.
    - Honor the backup preference of each availability group.
    - Restore a database to a point in time from the Azure portal.
    - Minimize administrative effort.

    What should you recommend?
  fr: |
    Contoso exécute 40 machines virtuelles SQL Server 2022 dans Azure. Plusieurs d'entre elles hébergent des groupes de disponibilité. Les bases utilisent le mode de récupération complète.

    Vous devez recommander une solution de sauvegarde qui satisfait les exigences suivantes :

    - Superviser toutes les sauvegardes depuis un tableau de bord unique et envoyer des alertes par e-mail en cas d'échec.
    - Conserver les sauvegardes pendant trois ans.
    - Respecter la préférence de sauvegarde de chaque groupe de disponibilité.
    - Restaurer une base à un point dans le temps depuis le portail Azure.
    - Réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Automated Backup configured on each VM through the SQL IaaS Agent extension", fr: "Automated Backup configuré sur chaque machine virtuelle par l'extension SQL IaaS Agent" } }
    - { id: b, text: { en: "Azure Backup for SQL Server in Azure VMs with a Recovery Services vault", fr: "Sauvegarde Azure pour SQL Server dans des machines virtuelles Azure, avec un coffre Recovery Services" } }
    - { id: c, text: { en: "Maintenance plans on each VM that back up to URL", fr: "Des plans de maintenance sur chaque machine virtuelle qui sauvegardent vers une URL" } }
    - { id: d, text: { en: "Azure Site Recovery with a three-year recovery point retention", fr: "Azure Site Recovery avec une rétention des points de récupération de trois ans" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Backup for SQL Server in Azure VMs manages thousands of databases on many servers from one dashboard, sends consolidated email alerts and keeps backups for years. It detects Always On configurations and honors the backup preference, and it restores to a point in time from the portal without manually chaining the backups.
    fr: |
      Sauvegarde Azure pour SQL Server dans des machines virtuelles Azure gère des milliers de bases sur de nombreux serveurs depuis un tableau de bord, envoie des alertes par e-mail consolidées et conserve les sauvegardes pendant des années. Elle détecte les configurations Always On et respecte la préférence de sauvegarde, et elle restaure à un point dans le temps depuis le portail sans enchaîner manuellement les sauvegardes.
  options:
    a: { en: "Automated Backup is managed per VM, has no consolidated alerts or built-in availability group support, and restores are done with SSMS or T-SQL.", fr: "Automated Backup se gère par machine virtuelle, n'a ni alertes consolidées ni prise en charge intégrée des groupes de disponibilité, et les restaurations se font avec SSMS ou T-SQL." }
    c: { en: "Maintenance plans are configured and monitored server by server and offer no central dashboard or portal restore.", fr: "Les plans de maintenance se configurent et se supervisent serveur par serveur et n'offrent ni tableau de bord central ni restauration depuis le portail." }
    d: { en: "Site Recovery replicates VMs for disaster recovery; it isn't a database backup solution.", fr: "Site Recovery réplique des machines virtuelles pour la récupération d'urgence ; ce n'est pas une solution de sauvegarde de bases de données." }
references:
  - title: Backup and restore for SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/backup-restore
