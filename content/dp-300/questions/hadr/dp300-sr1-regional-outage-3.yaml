id: dp300-sr1-regional-outage-3
objective: "5.1.3"
type: series_yesno
series: dp300-sr1-regional-outage
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |
    You enable zone redundancy for the three databases.
  fr: |
    Vous activez la redondance de zone pour les trois bases de données.
body:
  solution:
    en: |
      You enable the **zone-redundant** configuration for Claims, Policies and Customers on sql-litware-weu.
    fr: |
      Vous activez la configuration de **redondance de zone** pour Claims, Policies et Customers sur sql-litware-weu.
answer: { value: false }
explanation:
  correct:
    en: |
      Zone redundancy spreads the replicas of a database across availability zones of the same region. It protects against the loss of a zone, not of the whole West Europe region, and it doesn't place any copy in North Europe.
    fr: |
      La redondance de zone répartit les réplicas d'une base entre les zones de disponibilité d'une même région. Elle protège contre la perte d'une zone, pas de toute la région Europe Ouest, et elle ne place aucune copie en Europe Nord.
references:
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
