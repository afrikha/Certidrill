id: dp300-5a-drill-planned
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a failover group named **fog-sales** between a primary server in West Europe and a secondary server in North Europe. The failover group uses the customer-managed failover policy.

    You must run a quarterly disaster recovery drill in production. Both regions are available during the drill. The drill must measure the time needed for the applications to work against North Europe, and no transaction can be lost.

    What should you do in the drill?
  fr: |
    Contoso dispose d'un groupe de basculement nommé **fog-sales** entre un serveur primaire dans West Europe et un serveur secondaire dans North Europe. Le groupe de basculement utilise la stratégie de basculement gérée par le client.

    Vous devez effectuer chaque trimestre un exercice de récupération d'urgence en production. Les deux régions sont disponibles pendant l'exercice. L'exercice doit mesurer le temps nécessaire aux applications pour fonctionner sur North Europe, et aucune transaction ne doit être perdue.

    Que devez-vous faire lors de l'exercice ?
body:
  options:
    - { id: a, text: { en: "Run a planned failover (Failover) of fog-sales to North Europe, and fail back after the tests.", fr: "Effectuer un basculement planifié (Failover) de fog-sales vers North Europe, puis revenir après les tests." } }
    - { id: b, text: { en: "Run a forced failover (Forced failover) of fog-sales to North Europe, and fail back after the tests.", fr: "Effectuer un basculement forcé (Forced failover) de fog-sales vers North Europe, puis revenir après les tests." } }
    - { id: c, text: { en: "Switch fog-sales to the Microsoft-managed policy, and block access to the primary server.", fr: "Passer fog-sales à la stratégie gérée par Microsoft, puis bloquer l'accès au serveur primaire." } }
    - { id: d, text: { en: "Geo-restore the databases on the North Europe server, and point the applications to them.", fr: "Géorestaurer les bases sur le serveur de North Europe, puis y faire pointer les applications." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A planned failover fully synchronizes the secondary before switching roles, so no data is lost; it requires the primary to be accessible, which is the case during a drill. It's the recommended operation for production DR drills and for failing back afterward.
    fr: |
      Un basculement planifié synchronise entièrement le secondaire avant d'inverser les rôles : aucune donnée n'est perdue. Il exige que le primaire soit accessible, ce qui est le cas pendant un exercice. C'est l'opération recommandée pour les exercices de récupération d'urgence en production et pour le retour ensuite.
  options:
    b: { en: "A forced failover promotes the secondary without waiting for replication, so recent transactions can be lost; it's for a primary that's unreachable.", fr: "Un basculement forcé promeut le secondaire sans attendre la réplication : des transactions récentes peuvent être perdues. Il est réservé à un primaire inaccessible." }
    c: { en: "Microsoft-managed failover is triggered only by a widespread regional outage after the grace period, never by blocking one server, and Learn advises not to rely on it.", fr: "Le basculement géré par Microsoft n'est déclenché que par une panne régionale étendue après la période de grâce, jamais par le blocage d'un serveur, et Learn déconseille de s'y fier." }
    d: { en: "Geo-restore creates new databases from backups, which loses recent changes and doesn't test the failover group.", fr: "La géorestauration crée de nouvelles bases à partir des sauvegardes, ce qui perd les modifications récentes et ne teste pas le groupe de basculement." }
references:
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
