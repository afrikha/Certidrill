id: dp300-5c-fog-mi-readonly-listener
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a failover group named **fog-retail** between two Azure SQL managed instances: **mi1** (primary, France Central) and **mi2** (secondary, France South). The DNS zone ID of both instances is **a1b2c3d4e5f6**.

    A reporting application runs on a virtual machine in a virtual network that is peered with both instance networks. The application must always run its queries on the geo-secondary instance, and its connection string must not change after a failover.

    Which server name should the reporting application use in its connection string?
  fr: |
    Vous disposez d'un groupe de basculement nommé **fog-retail** entre deux instances managées Azure SQL : **mi1** (primaire, France Central) et **mi2** (secondaire, France South). L'ID de zone DNS des deux instances est **a1b2c3d4e5f6**.

    Une application de création de rapports s'exécute sur une machine virtuelle dans un réseau virtuel relié par peering aux réseaux des deux instances. L'application doit toujours exécuter ses requêtes sur l'instance géosecondaire, et sa chaîne de connexion ne doit pas changer après un basculement.

    Quel nom de serveur l'application de création de rapports doit-elle utiliser dans sa chaîne de connexion ?
body:
  options:
    - { id: a, text: "fog-retail.a1b2c3d4e5f6.database.windows.net, with ApplicationIntent=ReadOnly" }
    - { id: b, text: "fog-retail.secondary.a1b2c3d4e5f6.database.windows.net" }
    - { id: c, text: "mi2.a1b2c3d4e5f6.database.windows.net" }
    - { id: d, text: "mi2.public.a1b2c3d4e5f6.database.windows.net,3342" }
answer: { optionId: b }
explanation:
  correct:
    en: The read-only listener of a managed instance failover group, `<fog-name>.secondary.<zone_id>.database.windows.net`, always points to the current secondary instance. Its name doesn't change after a failover, so the reporting application keeps reading from the geo-secondary without any change.
    fr: "L'écouteur en lecture seule d'un groupe de basculement d'instance managée, `<fog-name>.secondary.<zone_id>.database.windows.net`, pointe toujours vers l'instance secondaire actuelle. Son nom ne change pas après un basculement : l'application continue de lire sur le géosecondaire sans aucune modification."
  options:
    a: { en: "The read-write listener points to the primary instance; ApplicationIntent=ReadOnly can only reach a read-only replica of that instance in the primary region.", fr: "L'écouteur en lecture-écriture pointe vers l'instance primaire ; ApplicationIntent=ReadOnly ne peut atteindre qu'un réplica en lecture seule de cette instance, dans la région primaire." }
    c: { en: "mi2 becomes the primary after a failover, so the application would then query the primary instead of the geo-secondary.", fr: "mi2 devient primaire après un basculement : l'application interrogerait alors le primaire au lieu du géosecondaire." }
    d: { en: "The public endpoint name also targets mi2 whatever its role, and failover group listeners aren't available through the public endpoint.", fr: "Le nom du point de terminaison public cible lui aussi mi2 quel que soit son rôle, et les écouteurs du groupe de basculement ne sont pas disponibles par le point de terminaison public." }
references:
  - title: Failover groups overview & best practices - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/failover-group-sql-mi
