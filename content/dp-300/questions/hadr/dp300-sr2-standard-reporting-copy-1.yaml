id: dp300-sr2-standard-reporting-copy-1
objective: "5.3.5"
type: series_yesno
series: dp300-sr2-standard-reporting-copy
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You create a basic availability group with VM1 as the secondary replica.
  fr: |
    Vous créez un groupe de disponibilité de base avec VM1 comme réplica secondaire.
body:
  solution:
    en: |
      You create a basic availability group for SalesDb with SQL1 as the primary replica and VM1 as an asynchronous-commit secondary replica, and you direct the analysts to the secondary replica.
    fr: |
      Vous créez un groupe de disponibilité de base pour SalesDb avec SQL1 comme réplica principal et VM1 comme réplica secondaire avec validation asynchrone, et vous dirigez les analystes vers le réplica secondaire.
answer: { value: false }
explanation:
  correct:
    en: |
      Basic availability groups are the availability groups of Standard edition, and they don't allow read access on the secondary replica. The analysts couldn't query the copy on VM1, so the reporting requirement is not met.
    fr: |
      Les groupes de disponibilité de base sont les groupes de disponibilité de l'édition Standard, et ils n'autorisent pas l'accès en lecture sur le réplica secondaire. Les analystes ne pourraient pas interroger la copie de VM1 : l'exigence de reporting n'est pas respectée.
references:
  - title: "Basic Always On availability groups for a single database"
    url: https://learn.microsoft.com/en-us/sql/database-engine/availability-groups/windows/basic-availability-groups-always-on-availability-groups
