id: dp300-5b-ag-mi-link-choice
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a SQL Server 2022 Enterprise instance on an Azure virtual machine named **SQLVM1** that hosts a database named **Sales**. You also have an Azure SQL managed instance named **MI1**. The virtual network of SQLVM1 is peered with the virtual network of MI1.

    You need to replicate Sales to MI1 in near real time so that reporting queries can run on MI1. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Vous disposez d'une instance SQL Server 2022 Enterprise sur une machine virtuelle Azure nommée **SQLVM1** qui héberge une base de données nommée **Sales**. Vous disposez également d'une instance managée Azure SQL nommée **MI1**. Un peering relie le réseau virtuel de SQLVM1 à celui de MI1.

    Vous devez répliquer Sales vers MI1 quasiment en temps réel afin que des requêtes de rapport puissent s'exécuter sur MI1. La solution doit minimiser l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A failover group between SQLVM1 and MI1", fr: "Un groupe de basculement entre SQLVM1 et MI1" } }
    - { id: b, text: { en: "Active geo-replication from SQLVM1 to MI1", fr: "Une géoréplication active de SQLVM1 vers MI1" } }
    - { id: c, text: { en: "A Managed Instance link by using the SSMS wizard", fr: "Un lien Managed Instance à l'aide de l'Assistant SSMS" } }
    - { id: d, text: { en: "Log shipping from SQLVM1 to MI1", fr: "Une copie des journaux de transaction de SQLVM1 vers MI1" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Managed Instance link replicates a SQL Server database to SQL Managed Instance in near real time through a distributed availability group, and the replicated database on the instance can serve read-only workloads. The SSMS wizard is the easiest way to configure it; virtual network peering provides the required connectivity for SQL Server on an Azure VM.
    fr: |
      Le lien Managed Instance réplique une base SQL Server vers SQL Managed Instance quasiment en temps réel au moyen d'un groupe de disponibilité distribué, et la base répliquée sur l'instance peut servir des charges de travail en lecture seule. L'Assistant SSMS est le moyen le plus simple de le configurer ; le peering de réseaux virtuels fournit la connectivité nécessaire pour SQL Server sur une machine virtuelle Azure.
  options:
    a: { en: "Failover groups are created between two managed instances or two logical servers, not with SQL Server.", fr: "Les groupes de basculement se créent entre deux instances managées ou deux serveurs logiques, pas avec SQL Server." }
    b: { en: "Active geo-replication is a feature of Azure SQL Database only.", fr: "La géoréplication active est une fonctionnalité d'Azure SQL Database uniquement." }
    d: { en: "SQL Managed Instance can't restore log backups with Transact-SQL, so it can't be a log shipping secondary.", fr: "SQL Managed Instance ne peut pas restaurer de sauvegardes de journal avec Transact-SQL : elle ne peut donc pas être une base secondaire de copie des journaux." }
references:
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
