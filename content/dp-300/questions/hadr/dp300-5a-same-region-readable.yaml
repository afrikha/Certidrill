id: dp300-5a-same-region-readable
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Azure SQL database named **CatalogDb** in the General Purpose service tier on a logical server in West Europe.

    You need to meet the following requirements:

    - A reporting application in West Europe must query a readable copy of CatalogDb so that its queries don't run on the primary.
    - A readable copy of CatalogDb must exist in North Europe for disaster recovery.

    What should you use?
  fr: |
    Northwind dispose d'une base de données Azure SQL nommée **CatalogDb** dans le niveau de service General Purpose, sur un serveur logique dans West Europe.

    Vous devez satisfaire les exigences suivantes :

    - Une application de création de rapports dans West Europe doit interroger une copie lisible de CatalogDb afin que ses requêtes ne s'exécutent pas sur le primaire.
    - Une copie lisible de CatalogDb doit exister dans North Europe pour la récupération d'urgence.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Active geo-replication with one geo-secondary in West Europe and one in North Europe", fr: "La géoréplication active avec un géosecondaire dans West Europe et un autre dans North Europe" } }
    - { id: b, text: { en: "A failover group with secondary servers in West Europe and North Europe", fr: "Un groupe de basculement avec des serveurs secondaires dans West Europe et North Europe" } }
    - { id: c, text: { en: "Read scale-out on CatalogDb and a failover group with a secondary server in North Europe", fr: "Le scale-out en lecture sur CatalogDb et un groupe de basculement avec un serveur secondaire dans North Europe" } }
    - { id: d, text: { en: "Zone redundancy on CatalogDb and geo-restore to North Europe", fr: "La redondance interzone sur CatalogDb et la géorestauration vers North Europe" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Active geo-replication supports up to four readable geo-secondaries per database, in any region, including the region of the primary. The West Europe secondary offloads the reports, and the North Europe secondary is the disaster recovery target.
    fr: |
      La géoréplication active prend en charge jusqu'à quatre géosecondaires lisibles par base, dans n'importe quelle région, y compris celle du primaire. Le secondaire de West Europe décharge les rapports, et celui de North Europe est la cible de récupération d'urgence.
  options:
    b: { en: "The secondary server of a failover group can't be in the same region as the primary.", fr: "Le serveur secondaire d'un groupe de basculement ne peut pas se trouver dans la même région que le primaire." }
    c: { en: "Read scale-out exists only in the Premium and Business Critical tiers, not in General Purpose.", fr: "Le scale-out en lecture n'existe que dans les niveaux Premium et Business Critical, pas dans General Purpose." }
    d: { en: "Zone redundancy doesn't expose a readable replica, and geo-restore creates a database only when you run it.", fr: "La redondance interzone n'expose aucun réplica lisible, et la géorestauration ne crée une base que lorsque vous l'exécutez." }
references:
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
  - title: Failover groups overview & best practices - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
