id: dp300-cs1a-failover-group
objective: "5.3.3"
type: yesno_statements
caseStudy: dp300-cs1a-lucerne-logistics
difficulty: 2
status: draft
stem:
  en: |
    To meet the business continuity requirements, you plan to create a failover group between MI1 and MI2 that uses the customer managed failover policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour satisfaire les exigences de continuité d'activité, vous prévoyez de créer un groupe de basculement entre MI1 et MI2 qui utilise la stratégie de basculement gérée par le client.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When you create MI2, you must specify MI1 as its DNS zone partner.
        fr: |
          Quand vous créez MI2, vous devez spécifier MI1 comme partenaire de zone DNS.
    - id: s2
      text:
        en: |
          The failover group replicates the FreightPurge job and the DBA-Team operator from MI1 to MI2.
        fr: |
          Le groupe de basculement réplique le travail FreightPurge et l'opérateur DBA-Team de MI1 vers MI2.
    - id: s3
      text:
        en: |
          After a failover, applications that connect to the read-write listener endpoint of the failover group reach MI2 without any change to their connection strings.
        fr: |
          Après un basculement, les applications qui se connectent au point de terminaison d'écouteur en lecture-écriture du groupe de basculement atteignent MI2 sans aucune modification de leurs chaînes de connexion.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Both instances of a failover group must share a DNS zone, so MI2 must be created with MI1 as its DNS zone partner (the Primary Managed Instance setting in the portal). A failover group replicates user databases only; master and msdb are not replicated, so SQL Server Agent jobs, operators and logins must be re-created on MI2. The read-write listener always points to the current primary, so connection strings do not change after a failover.
    fr: |
      Les deux instances d'un groupe de basculement doivent partager une zone DNS ; MI2 doit donc être créée avec MI1 comme partenaire de zone DNS (paramètre Primary Managed Instance dans le portail). Un groupe de basculement ne réplique que les bases de données utilisateur ; master et msdb ne sont pas répliquées : les travaux SQL Server Agent, les opérateurs et les connexions doivent être recréés sur MI2. L'écouteur en lecture-écriture pointe toujours vers le primaire actuel : les chaînes de connexion ne changent pas après un basculement.
references:
  - title: Failover groups overview & best practices - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/failover-group-sql-mi
