id: dp300-cs4a-archive-move
objective: "1.3.7"
type: ordering
caseStudy: dp300-cs4a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the archive consolidation requirement.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez satisfaire l'exigence de consolidation des archives.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans l'ordre correct.
body:
  count: 5
  actions:
    - id: a1
      text: { en: "Allow inbound and outbound TCP traffic on port 5022 and ports 11000-11999 in the NSGs of both managed instance subnets.", fr: "Autoriser le trafic TCP entrant et sortant sur le port 5022 et les ports 11000-11999 dans les NSG des deux sous-réseaux d'instance managée." }
    - id: a2
      text: { en: "Start a move of ClaimsArchive from MI-LEGACY to MI-PROD.", fr: "Démarrer un déplacement de ClaimsArchive de MI-LEGACY vers MI-PROD." }
    - id: a3
      text: { en: "Wait until the status of the operation is Move ready for completion.", fr: "Attendre que l'état de l'opération soit Move ready for completion." }
    - id: a4
      text: { en: "Complete the move operation.", fr: "Terminer l'opération de déplacement." }
    - id: a5
      text: { en: "Point the connection string of the claims archive portal to MI-PROD.", fr: "Faire pointer la chaîne de connexion du portail d'archives des sinistres vers MI-PROD." }
    - id: a6
      text: { en: "Take a COPY_ONLY backup of ClaimsArchive to URL.", fr: "Effectuer une sauvegarde COPY_ONLY de ClaimsArchive vers une URL." }
    - id: a7
      text: { en: "Drop ClaimsArchive from MI-LEGACY.", fr: "Supprimer ClaimsArchive de MI-LEGACY." }
answer:
  sequence: [a1, a2, a3, a4, a5]
explanation:
  correct:
    en: |
      A database move between two managed instances in the same region seeds the destination online and keeps replicating changes until you complete it, so the portal is down only during completion. Because the instances are in different peered virtual networks, TCP port 5022 and ports 11000-11999 must first be allowed in both directions on both subnets. After seeding, the status becomes Move ready for completion; completing the move brings the database online on MI-PROD and drops the source database, which you must do within 24 hours. The portal can then connect to MI-PROD.
    fr: |
      Un déplacement de base de données entre deux instances managées de la même région alimente la destination en ligne et continue de répliquer les modifications jusqu'à ce que vous le terminiez : le portail n'est donc interrompu que pendant la finalisation. Comme les instances se trouvent dans des réseaux virtuels distincts reliés par un peering, le port TCP 5022 et les ports 11000-11999 doivent d'abord être autorisés dans les deux sens sur les deux sous-réseaux. Après l'amorçage, l'état passe à Move ready for completion ; terminer le déplacement met la base de données en ligne sur MI-PROD et supprime la base source, ce que vous devez faire dans les 24 heures. Le portail peut alors se connecter à MI-PROD.
  options:
    a6: { en: "A native backup and restore is an offline method: changes made after the backup would be lost or would require a long interruption.", fr: "Une sauvegarde et une restauration natives constituent une méthode hors connexion : les modifications postérieures à la sauvegarde seraient perdues ou exigeraient une longue interruption." }
    a7: { en: "Completing a move drops the source database automatically; no manual drop is needed.", fr: "La finalisation d'un déplacement supprime automatiquement la base de données source ; aucune suppression manuelle n'est nécessaire." }
references:
  - title: Copy or move a database - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
