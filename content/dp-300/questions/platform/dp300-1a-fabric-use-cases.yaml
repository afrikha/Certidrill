id: dp300-1a-fabric-use-cases
objective: "1.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum is reviewing project proposals to decide where SQL database in Microsoft Fabric fits.

    Which two proposals are use cases for SQL database in Fabric?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum examine des propositions de projets pour déterminer où la base de données SQL dans Microsoft Fabric est adaptée.

    Quelles sont les deux propositions qui constituent des cas d'usage de la base de données SQL dans Fabric ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Push curated customer scores from a Fabric lakehouse back into an operational database that applications read", fr: "Renvoyer des scores clients préparés d'un lakehouse Fabric vers une base opérationnelle que lisent des applications" } }
    - { id: b, text: { en: "Rehost a SQL Server instance that uses SQL Server Agent jobs and linked servers without code changes", fr: "Réhéberger une instance SQL Server qui utilise des travaux SQL Server Agent et des serveurs liés, sans modification du code" } }
    - { id: c, text: { en: "Build an application that needs transactional writes and analytical reads on the same data", fr: "Créer une application qui a besoin d'écritures transactionnelles et de lectures analytiques sur les mêmes données" } }
    - { id: d, text: { en: "Keep monthly database backups for 10 years by using long-term retention", fr: "Conserver des sauvegardes mensuelles de la base pendant 10 ans avec la rétention à long terme" } }
    - { id: e, text: { en: "Run a vendor application that requires administrator access to the operating system of the database server", fr: "Exécuter une application d'éditeur qui exige un accès administrateur au système d'exploitation du serveur de base de données" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Microsoft documents reverse ETL (pushing curated analytical data back into operational systems) and translytical applications (transactional and analytical access to the same data) as use cases of SQL database in Fabric, along with operational data stores and AI applications.
    fr: |
      Microsoft documente le reverse ETL (renvoyer des données analytiques préparées vers les systèmes opérationnels) et les applications translytiques (accès transactionnel et analytique aux mêmes données) comme cas d'usage de la base de données SQL dans Fabric, avec les magasins de données opérationnels et les applications d'IA.
  options:
    b: { en: "Instance-level features such as SQL Server Agent and linked servers point to Azure SQL Managed Instance.", fr: "Des fonctionnalités de niveau instance comme SQL Server Agent et les serveurs liés orientent vers Azure SQL Managed Instance." }
    d: { en: "Long-term retention isn't supported by SQL database in Fabric; Azure SQL Database provides it.", fr: "La rétention à long terme n'est pas prise en charge par la base de données SQL dans Fabric ; Azure SQL Database la fournit." }
    e: { en: "No PaaS or SaaS database gives operating system access; that requires SQL Server on a virtual machine.", fr: "Aucune base PaaS ou SaaS ne donne accès au système d'exploitation ; il faut SQL Server sur une machine virtuelle." }
references:
  - title: "SQL database Overview - Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/database/sql/overview
  - title: "Limitations for SQL database - Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/database/sql/limitations
