id: dp300-1a-mi-link-failback
objective: "1.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an on-premises SQL Server 2019 Enterprise instance (CU22) named **SQLHQ** that hosts a database named **ClaimsDb**. You plan to use the Managed Instance link to replicate ClaimsDb to a new Azure SQL managed instance named **MI1** for disaster recovery.

    After a disaster, the company must be able to fail over to MI1 and later fail back online to SQLHQ by using the link, without exporting and importing the data.

    What should you do?
  fr: |
    Adatum dispose d'une instance SQL Server 2019 Enterprise (CU22) locale nommée **SQLHQ** qui héberge une base de données nommée **ClaimsDb**. Vous prévoyez d'utiliser le lien Managed Instance pour répliquer ClaimsDb vers une nouvelle instance Azure SQL Managed Instance nommée **MI1** à des fins de reprise d'activité.

    Après un sinistre, l'entreprise doit pouvoir basculer vers MI1, puis revenir en ligne vers SQLHQ à l'aide du lien, sans exporter ni importer les données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep SQL Server 2019 on SQLHQ and set the update policy of MI1 to Always-up-to-date", fr: "Conserver SQL Server 2019 sur SQLHQ et définir la stratégie de mise à jour de MI1 sur Always-up-to-date" } }
    - { id: b, text: { en: "Upgrade SQLHQ to SQL Server 2022 and set the update policy of MI1 to Always-up-to-date", fr: "Mettre à niveau SQLHQ vers SQL Server 2022 et définir la stratégie de mise à jour de MI1 sur Always-up-to-date" } }
    - { id: c, text: { en: "Upgrade SQLHQ to SQL Server 2022 and set the update policy of MI1 to SQL Server 2022", fr: "Mettre à niveau SQLHQ vers SQL Server 2022 et définir la stratégie de mise à jour de MI1 sur SQL Server 2022" } }
    - { id: d, text: { en: "Keep SQL Server 2019 on SQLHQ and set the update policy of MI1 to SQL Server 2022", fr: "Conserver SQL Server 2019 sur SQLHQ et définir la stratégie de mise à jour de MI1 sur SQL Server 2022" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Failback from a managed instance to SQL Server by using the link is supported only for SQL Server 2022 and SQL Server 2025. The managed instance must also use the matching update policy (SQL Server 2022 here) so that its database format stays compatible with the on-premises engine.
    fr: |
      Le retour d'une instance managée vers SQL Server à l'aide du lien n'est pris en charge que pour SQL Server 2022 et SQL Server 2025. L'instance managée doit aussi utiliser la stratégie de mise à jour correspondante (ici SQL Server 2022) pour que le format de ses bases reste compatible avec le moteur local.
  options:
    a: { en: "SQL Server 2019 supports the link only from SQL Server to the managed instance, and Always-up-to-date prevents any replication back to SQL Server.", fr: "SQL Server 2019 ne prend en charge le lien que de SQL Server vers l'instance managée, et Always-up-to-date empêche toute réplication de retour vers SQL Server." }
    b: { en: "With the Always-up-to-date update policy, you can't replicate or fail back from the managed instance to SQL Server.", fr: "Avec la stratégie de mise à jour Always-up-to-date, vous ne pouvez ni répliquer ni revenir de l'instance managée vers SQL Server." }
    d: { en: "The update policy alone isn't enough: failback isn't supported for SQL Server 2016 to 2019.", fr: "La stratégie de mise à jour ne suffit pas : le retour n'est pas pris en charge pour SQL Server 2016 à 2019." }
references:
  - title: "Managed Instance link overview - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
