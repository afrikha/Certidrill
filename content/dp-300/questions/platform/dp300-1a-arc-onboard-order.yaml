id: dp300-1a-arc-onboard-order
objective: "1.1.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has an on-premises Windows Server 2022 server named **SRV-SQL1** that runs a SQL Server 2022 instance. The server isn't connected to Azure Arc yet. Azure Arc has never been used in the Azure subscription **Sub1**.

    You need to connect the SQL Server instance to Azure Arc by using the onboarding script from the Azure portal.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'un serveur Windows Server 2022 local nommé **SRV-SQL1** qui exécute une instance SQL Server 2022. Le serveur n'est pas encore connecté à Azure Arc. Azure Arc n'a jamais été utilisé dans l'abonnement Azure **Sub1**.

    Vous devez connecter l'instance SQL Server à Azure Arc à l'aide du script d'intégration du portail Azure.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rp, text: { en: "Register the Microsoft.HybridCompute and Microsoft.AzureArcData resource providers in Sub1.", fr: "Inscrire les fournisseurs de ressources Microsoft.HybridCompute et Microsoft.AzureArcData dans Sub1." } }
    - { id: gen, text: { en: "In Azure Arc, add a SQL Server, specify the region and license type, and download the generated onboarding script.", fr: "Dans Azure Arc, ajouter un serveur SQL, indiquer la région et le type de licence, puis télécharger le script d'intégration généré." } }
    - { id: run, text: { en: "Run the script on SRV-SQL1 from an elevated PowerShell session to install the Connected Machine agent and the Azure extension for SQL Server.", fr: "Exécuter le script sur SRV-SQL1 depuis une session PowerShell avec élévation pour installer l'agent Connected Machine et l'extension Azure pour SQL Server." } }
    - { id: inbound, text: { en: "Open inbound TCP port 1433 on the firewall of SRV-SQL1 for the Azure service tags.", fr: "Ouvrir le port TCP 1433 entrant sur le pare-feu de SRV-SQL1 pour les étiquettes de service Azure." } }
    - { id: iaas, text: { en: "Register SRV-SQL1 with the SQL IaaS Agent extension.", fr: "Inscrire SRV-SQL1 auprès de l'extension SQL IaaS Agent." } }
    - { id: pl, text: { en: "Create a private endpoint for the Arc data processing service endpoint.", fr: "Créer un point de terminaison privé pour le point de terminaison du service de traitement des données Arc." } }
answer:
  sequence: [ rp, gen, run ]
explanation:
  correct:
    en: |
      The subscription must have the Microsoft.HybridCompute and Microsoft.AzureArcData resource providers registered. You then generate the onboarding script from Azure Arc in the portal, choosing the region and license type, and run it on the server: it installs the Azure Connected Machine agent if needed, which creates the Server - Azure Arc resource, and the Azure extension for SQL Server, which registers each instance as a SQL Server - Azure Arc resource.
    fr: |
      Les fournisseurs de ressources Microsoft.HybridCompute et Microsoft.AzureArcData doivent être inscrits dans l'abonnement. Vous générez ensuite le script d'intégration depuis Azure Arc dans le portail, en choisissant la région et le type de licence, puis vous l'exécutez sur le serveur : il installe si nécessaire l'agent Azure Connected Machine, qui crée la ressource Server - Azure Arc, et l'extension Azure pour SQL Server, qui inscrit chaque instance comme ressource SQL Server - Azure Arc.
  options:
    inbound: { en: "The agent and the extension use outbound HTTPS on TCP 443; no inbound port is required.", fr: "L'agent et l'extension utilisent le trafic HTTPS sortant sur TCP 443 ; aucun port entrant n'est requis." }
    iaas: { en: "The SQL IaaS Agent extension is for SQL Server on Azure virtual machines only.", fr: "L'extension SQL IaaS Agent est réservée à SQL Server sur les machines virtuelles Azure." }
    pl: { en: "Private Link isn't supported for the Arc data processing service endpoint.", fr: "Private Link n'est pas pris en charge pour le point de terminaison du service de traitement des données Arc." }
references:
  - title: "Connect Your SQL Server to Azure Arc - SQL Server enabled by Azure Arc"
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/connect
  - title: "Prerequisites - SQL Server enabled by Azure Arc"
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/prerequisites
