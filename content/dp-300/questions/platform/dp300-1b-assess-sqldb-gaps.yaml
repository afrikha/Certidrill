id: dp300-1b-assess-sqldb-gaps
objective: "1.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans to migrate an on-premises SQL Server 2017 instance that uses Windows logins, SQL Server Agent jobs and an Always On availability group to Azure SQL Database.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de migrer vers Azure SQL Database une instance SQL Server 2017 locale qui utilise des connexions Windows, des travaux SQL Server Agent et un groupe de disponibilité Always On.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The SQL Server Agent jobs can be re-created as SQL Server Agent jobs in Azure SQL Database.
        fr: Les travaux SQL Server Agent peuvent être recréés sous forme de travaux SQL Server Agent dans Azure SQL Database.
    - id: s2
      text:
        en: The Windows logins must be replaced, for example by Microsoft Entra ID logins.
        fr: Les connexions Windows doivent être remplacées, par exemple par des connexions Microsoft Entra ID.
    - id: s3
      text:
        en: An Always On availability group must be configured on the target to provide high availability.
        fr: Un groupe de disponibilité Always On doit être configuré sur la cible pour assurer la haute disponibilité.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Azure SQL Database has no SQL Server Agent; scheduled jobs are re-created as elastic jobs. Windows logins aren't supported, so you create Microsoft Entra ID logins and re-create SQL logins manually. High availability is built into the service, so availability groups become obsolete; failover groups cover cross-region failover.
    fr: "Azure SQL Database ne dispose pas de SQL Server Agent ; les travaux planifiés sont recréés sous forme de travaux élastiques. Les connexions Windows ne sont pas prises en charge : vous créez des connexions Microsoft Entra ID et recréez manuellement les connexions SQL. La haute disponibilité est intégrée au service, les groupes de disponibilité deviennent donc inutiles ; les groupes de basculement couvrent le basculement entre régions."
references:
  - title: "Migration overview: SQL Server to Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/database/sql-server-to-sql-database-overview
