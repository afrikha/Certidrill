id: dp300-1a-fabric-or-sqldb
objective: "1.1.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Litware is choosing the database offering for four new workloads. The analytics platform of the company is Microsoft Fabric. The solution must minimize administrative effort.

    | Workload | Requirements |
    | --- | --- |
    | Visits | The application writes rows that Power BI reports in the same Fabric workspace must query within seconds, without a pipeline |
    | Payments | Card numbers must be protected by Always Encrypted |
    | Catalog | The database must be part of a failover group with a secondary in another region |
    | Pricing | The workload needs 48 vCores |

    Which offering should you recommend for each workload? To answer, drag the appropriate offerings to the correct workloads. Each offering may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware choisit l'offre de base de données de quatre nouvelles charges de travail. La plateforme d'analytique de l'entreprise est Microsoft Fabric. La solution doit réduire au minimum l'effort d'administration.

    | Charge de travail | Exigences |
    | --- | --- |
    | Visits | L'application écrit des lignes que des rapports Power BI du même espace de travail Fabric doivent interroger en quelques secondes, sans pipeline |
    | Payments | Les numéros de carte doivent être protégés par Always Encrypted |
    | Catalog | La base de données doit faire partie d'un groupe de basculement avec un secondaire dans une autre région |
    | Pricing | La charge de travail a besoin de 48 vCores |

    Quelle offre devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les offres appropriées vers les charges de travail correspondantes. Chaque offre peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: fabric, text: { en: "SQL database in Microsoft Fabric", fr: "Base de données SQL dans Microsoft Fabric" } }
    - { id: sqldb, text: { en: "Azure SQL Database", fr: "Azure SQL Database" } }
    - { id: vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur les machines virtuelles Azure" } }
  targets:
    - { id: visits, text: Visits }
    - { id: payments, text: Payments }
    - { id: catalog, text: Catalog }
    - { id: pricing, text: Pricing }
answer:
  mapping: { visits: fabric, payments: sqldb, catalog: sqldb, pricing: sqldb }
explanation:
  correct:
    en: |
      SQL database in Fabric replicates its data to OneLake automatically, so reports in the workspace use it without a pipeline. It doesn't support Always Encrypted or failover groups, and it is limited to 32 vCores and 4 TB, so Payments, Catalog and Pricing need Azure SQL Database, which supports all three requirements as a PaaS offering. SQL Server on virtual machines would also work for those workloads, but with more administrative effort.
    fr: |
      La base de données SQL dans Fabric réplique automatiquement ses données dans OneLake : les rapports de l'espace de travail les utilisent sans pipeline. Elle ne prend en charge ni Always Encrypted ni les groupes de basculement, et elle est limitée à 32 vCores et 4 To : Payments, Catalog et Pricing exigent Azure SQL Database, qui satisfait les trois exigences en tant qu'offre PaaS. SQL Server sur des machines virtuelles fonctionnerait aussi pour ces charges, mais avec plus d'effort d'administration.
references:
  - title: "Limitations for SQL database - Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/database/sql/limitations
  - title: "SQL database Overview - Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/database/sql/overview
