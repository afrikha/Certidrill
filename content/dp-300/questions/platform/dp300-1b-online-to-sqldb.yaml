id: dp300-1b-online-to-sqldb
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an on-premises SQL Server 2019 instance that hosts a 600 GB database named **OrdersDb**. OrdersDb receives writes 24 hours a day, and all its tables have a primary key.

    You plan to migrate OrdersDb to a single database in Azure SQL Database. The application can be unavailable for at most 10 minutes.

    Which migration method should you use?
  fr: |
    Vous disposez d'une instance SQL Server 2019 locale qui héberge une base de données de 600 Go nommée **OrdersDb**. OrdersDb reçoit des écritures 24 heures sur 24, et toutes ses tables ont une clé primaire.

    Vous prévoyez de migrer OrdersDb vers une base de données unique dans Azure SQL Database. L'application peut être indisponible au maximum 10 minutes.

    Quelle méthode de migration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An online migration by using Azure Database Migration Service", fr: "Une migration en ligne avec Azure Database Migration Service" } }
    - { id: b, text: { en: "Log Replay Service (LRS) in continuous mode", fr: "Log Replay Service (LRS) en mode continu" } }
    - { id: c, text: { en: "Transactional replication with the Azure SQL database as a subscriber", fr: "La réplication transactionnelle avec la base de données Azure SQL comme abonné" } }
    - { id: d, text: { en: "An offline migration by using Azure Database Migration Service", fr: "Une migration hors connexion avec Azure Database Migration Service" } }
answer: { optionId: c }
explanation:
  correct:
    en: Transactional replication keeps the source online while changes flow continuously to Azure SQL Database, which can be a push subscriber of a SQL Server 2016 or later publisher. At cutover, you stop writes, let the last changes arrive and repoint the application, which fits a 10-minute window. The primary keys meet the replication requirement.
    fr: La réplication transactionnelle laisse la source en ligne pendant que les modifications sont transmises en continu à Azure SQL Database, qui peut être un abonné par envoi (push) d'un serveur de publication SQL Server 2016 ou ultérieur. Au basculement, vous arrêtez les écritures, laissez arriver les dernières modifications et redirigez l'application, ce qui tient dans une fenêtre de 10 minutes. Les clés primaires satisfont l'exigence de la réplication.
  options:
    a: { en: "Database Migration Service supports online migrations only to SQL Managed Instance and SQL Server on Azure VMs; Azure SQL Database is offline only.", fr: "Database Migration Service ne prend en charge les migrations en ligne que vers SQL Managed Instance et SQL Server sur machines virtuelles Azure ; Azure SQL Database est uniquement hors connexion." }
    b: { en: "Log Replay Service restores backups only to Azure SQL Managed Instance.", fr: "Log Replay Service ne restaure des sauvegardes que vers Azure SQL Managed Instance." }
    d: { en: "An offline migration of 600 GB stops the application for the whole copy, far more than 10 minutes.", fr: "Une migration hors connexion de 600 Go arrête l'application pendant toute la copie, bien plus que 10 minutes." }
references:
  - title: Replication to Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/replication-to-sql-database
  - title: What is Azure Database Migration Service?
    url: https://learn.microsoft.com/en-us/azure/dms/dms-overview
