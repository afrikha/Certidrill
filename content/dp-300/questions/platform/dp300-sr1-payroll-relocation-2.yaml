id: dp300-sr1-payroll-relocation-2
objective: "1.3.7"
type: series_yesno
series: dp300-sr1-payroll-relocation
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: |
    You start a move on Wednesday and complete it on Saturday at 22:00.
  fr: |
    Vous démarrez un déplacement le mercredi et le terminez le samedi à 22:00.
body:
  solution:
    en: |
      On Wednesday at 09:00, you select Payroll on sqlmi-adatum-hr in the Azure portal and start a **Move** operation to sqlmi-adatum-core so that seeding finishes well in advance. The status shows **Move ready for completion** on Wednesday afternoon, and you select **Complete** on Saturday at 22:00.
    fr: |
      Le mercredi à 09:00, vous sélectionnez Payroll sur sqlmi-adatum-hr dans le portail Azure et démarrez une opération **Move** vers sqlmi-adatum-core pour que l'amorçage se termine bien à l'avance. L'état affiche **Move ready for completion** le mercredi après-midi, et vous sélectionnez **Complete** le samedi à 22:00.
answer: { value: false }
explanation:
  correct:
    en: |
      A copy or move operation must be completed within 24 hours. Otherwise it's canceled automatically and the destination database is dropped. By Saturday the operation no longer exists, so there is nothing to complete at the cutover.
    fr: |
      Une opération de copie ou de déplacement doit être terminée dans les 24 heures, sinon elle est annulée automatiquement et la base de destination est supprimée. Le samedi, l'opération n'existe plus : il n'y a rien à terminer au moment du basculement.
references:
  - title: Copy or move a database across instances in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
