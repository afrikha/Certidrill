id: dp300-1b-method-match
objective: "1.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip plans three database migrations. Each migration must meet its downtime requirement and must minimize administrative effort.

    Which method should you use for each migration? To answer, drag the appropriate methods to the correct migrations. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip prévoit trois migrations de bases de données. Chaque migration doit respecter son exigence de temps d'arrêt et réduire au minimum l'effort d'administration.

    Quelle méthode devez-vous utiliser pour chaque migration ? Pour répondre, faites glisser les méthodes appropriées vers les migrations correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: link, text: { en: "Managed Instance link", fr: "Lien Managed Instance" } }
    - { id: lrs, text: { en: "Log Replay Service in continuous mode", fr: "Log Replay Service en mode continu" } }
    - { id: native, text: { en: "Native backup and restore by using BACKUP TO URL and RESTORE FROM URL", fr: "Sauvegarde et restauration natives avec BACKUP TO URL et RESTORE FROM URL" } }
    - { id: bacpac, text: { en: "BACPAC export and import", fr: "Exportation et importation BACPAC" } }
    - { id: repl, text: { en: "Transactional replication", fr: "Réplication transactionnelle" } }
  targets:
    - { id: t1, text: { en: "A SQL Server 2022 database to SQL Managed Instance Business Critical, online, with read-only reports run on the target before cutover", fr: "Une base SQL Server 2022 vers SQL Managed Instance Business Critical, en ligne, avec des rapports en lecture seule exécutés sur la cible avant le basculement" } }
    - { id: t2, text: { en: "A SQL Server 2012 database to SQL Managed Instance General Purpose, with a cutover of a few minutes", fr: "Une base SQL Server 2012 vers SQL Managed Instance General Purpose, avec un basculement de quelques minutes" } }
    - { id: t3, text: { en: "A 15 GB SQL Server 2016 database to Azure SQL Database, during a weekend when the application is stopped", fr: "Une base SQL Server 2016 de 15 Go vers Azure SQL Database, pendant un week-end où l'application est arrêtée" } }
answer:
  mapping: { t1: link, t2: lrs, t3: bacpac }
explanation:
  correct:
    en: The Managed Instance link replicates near real time through a distributed availability group, keeps the replica readable and is the only online option to Business Critical. The link requires SQL Server 2016 or later, so a SQL Server 2012 source uses Log Replay Service, which supports SQL Server 2008 to 2022 and restores log backups continuously until a short cutover. A small database to Azure SQL Database with downtime allowed is the BACPAC use case, with no separate migration service.
    fr: Le lien Managed Instance réplique quasiment en temps réel via un groupe de disponibilité distribué, garde le réplica accessible en lecture et constitue la seule option en ligne vers Business Critical. Le lien exige SQL Server 2016 ou ultérieur ; une source SQL Server 2012 utilise donc Log Replay Service, qui prend en charge SQL Server 2008 à 2022 et restaure les sauvegardes de journal en continu jusqu'à un court basculement. Une petite base vers Azure SQL Database avec temps d'arrêt autorisé est le cas d'usage du BACPAC, sans service de migration distinct.
  options:
    native: { en: "Native restore works only to SQL Managed Instance or SQL Server; its downtime covers the full backup and restore.", fr: "La restauration native ne fonctionne que vers SQL Managed Instance ou SQL Server ; son temps d'arrêt couvre toute la sauvegarde et la restauration." }
    repl: { en: "Transactional replication is online but complex to set up, which doesn't minimize effort when downtime is allowed.", fr: "La réplication transactionnelle est en ligne mais complexe à configurer, ce qui ne réduit pas l'effort quand un temps d'arrêt est autorisé." }
references:
  - title: "Migration overview: SQL Server to Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/managed-instance/sql-server-to-managed-instance-overview
  - title: "Migration overview: SQL Server to Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/database/sql-server-to-sql-database-overview
