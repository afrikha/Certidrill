id: dp300-cs1a-billing-offering
objective: "1.1.1"
type: single
caseStudy: dp300-cs1a-lucerne-logistics
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a deployment option for the Billing database. The solution must meet the migration requirements. What should you recommend?
  fr: |
    Vous devez recommander une option de déploiement pour la base de données Billing. La solution doit respecter les exigences de migration. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure SQL Database single database in the General Purpose tier that uses provisioned compute", fr: "Une base de données unique Azure SQL Database au niveau General Purpose avec le calcul provisionné" } }
    - { id: b, text: { en: "An Azure SQL Database single database in the Business Critical tier that uses provisioned compute", fr: "Une base de données unique Azure SQL Database au niveau Business Critical avec le calcul provisionné" } }
    - { id: c, text: { en: "An Azure SQL Database single database in the General Purpose tier that uses serverless compute", fr: "Une base de données unique Azure SQL Database au niveau General Purpose avec le calcul serverless" } }
    - { id: d, text: { en: "An Azure SQL Database elastic pool in the General Purpose tier that uses provisioned compute", fr: "Un pool élastique Azure SQL Database au niveau General Purpose avec le calcul provisionné" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The serverless compute tier bills compute per second of use and can auto-pause a General Purpose database after a period without activity, so only storage is billed while Billing is idle. It resumes automatically on the next connection, so there is no schedule to maintain, which fits an irregular workload.
    fr: |
      Le niveau de calcul serverless facture le calcul à la seconde d'utilisation et peut suspendre automatiquement (auto-pause) une base de données General Purpose après une période sans activité : seul le stockage est facturé quand Billing est inactive. La base reprend automatiquement à la connexion suivante, sans planification à gérer, ce qui convient à une charge irrégulière.
  options:
    a: { en: "Provisioned compute is billed per hour for the configured vCores, whether or not the database is used.", fr: "Le calcul provisionné est facturé à l'heure pour les vCores configurés, que la base de données soit utilisée ou non." }
    b: { en: "Business Critical uses provisioned compute only and costs more; compute charges never stop while the database exists.", fr: "Business Critical n'utilise que le calcul provisionné et coûte plus cher ; les frais de calcul ne s'arrêtent jamais tant que la base de données existe." }
    d: { en: "An elastic pool shares provisioned resources among several databases and is billed continuously; it brings nothing for a single database.", fr: "Un pool élastique partage des ressources provisionnées entre plusieurs bases de données et il est facturé en continu ; il n'apporte rien pour une seule base de données." }
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
