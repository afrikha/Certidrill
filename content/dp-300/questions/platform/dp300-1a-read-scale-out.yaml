id: dp300-1a-read-scale-out
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Database database named **OrdersDb** in the Business Critical service tier. The read scale-out setting of OrdersDb has its default value.

    A reporting application runs long read-only queries that slow down the order entry workload. You need to run the reporting queries on a read-only replica. The solution must not increase cost.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **OrdersDb** au niveau de service Business Critical. Le paramètre de scale-out en lecture d'OrdersDb a sa valeur par défaut.

    Une application de reporting exécute de longues requêtes en lecture seule qui ralentissent la saisie des commandes. Vous devez exécuter les requêtes de reporting sur un réplica en lecture seule. La solution ne doit pas augmenter les coûts.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an active geo-replication secondary and point the reporting application to it", fr: "Créer un secondaire de géoréplication active et y diriger l'application de reporting" } }
    - { id: b, text: { en: "Add a named replica to OrdersDb and point the reporting application to it", fr: "Ajouter un réplica nommé à OrdersDb et y diriger l'application de reporting" } }
    - { id: c, text: { en: "Add ApplicationIntent=ReadOnly to the connection string of the reporting application", fr: "Ajouter ApplicationIntent=ReadOnly à la chaîne de connexion de l'application de reporting" } }
    - { id: d, text: { en: "Add MultiSubnetFailover=True to the connection string of the reporting application", fr: "Ajouter MultiSubnetFailover=True à la chaîne de connexion de l'application de reporting" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Read scale-out is enabled by default on new Business Critical databases and uses a replica that is already part of the high availability architecture, at no extra cost. Connections that specify ApplicationIntent=ReadOnly are routed to that replica; the default ReadWrite intent goes to the primary.
    fr: |
      Le scale-out en lecture est activé par défaut sur les nouvelles bases Business Critical et utilise un réplica qui fait déjà partie de l'architecture de haute disponibilité, sans coût supplémentaire. Les connexions qui indiquent ApplicationIntent=ReadOnly sont routées vers ce réplica ; l'intention par défaut ReadWrite mène au principal.
  options:
    a: { en: "A geo-secondary is a separate, billed database in another region; it increases cost.", fr: "Un géosecondaire est une base distincte, facturée, dans une autre région ; il augmente les coûts." }
    b: { en: "Named replicas exist only in the Hyperscale tier and are billed separately.", fr: "Les réplicas nommés n'existent qu'au niveau Hyperscale et sont facturés à part." }
    d: { en: "MultiSubnetFailover speeds up reconnection to a listener after a failover; it doesn't route reads to a replica.", fr: "MultiSubnetFailover accélère la reconnexion à un écouteur après un basculement ; il ne route pas les lectures vers un réplica." }
references:
  - title: "Read Queries on Replicas - Azure SQL Database & Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
