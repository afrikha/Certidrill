id: dp300-1a-mi-config-match
objective: "1.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin plans three Azure SQL Managed Instance deployments. Each deployment must use the lowest-cost configuration that meets its requirements.

    | Deployment | Requirements |
    | --- | --- |
    | Trading | Storage latency of 1 to 2 ms and a built-in read-only replica for reports |
    | Archive | 20 TB of data and 350 user databases in a single instance |
    | Branches | Migrate 12 small SQL Server instances that each need 2 vCores, with instance deployment in about 10 minutes |

    Which configuration should you use for each deployment? To answer, drag the appropriate configurations to the correct deployments. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin prévoit trois déploiements d'Azure SQL Managed Instance. Chaque déploiement doit utiliser la configuration la moins coûteuse qui satisfait à ses exigences.

    | Déploiement | Exigences |
    | --- | --- |
    | Trading | Latence de stockage de 1 à 2 ms et un réplica intégré en lecture seule pour les rapports |
    | Archive | 20 To de données et 350 bases de données utilisateur dans une seule instance |
    | Branches | Migrer 12 petites instances SQL Server qui ont chacune besoin de 2 vCores, avec un déploiement d'instance en 10 minutes environ |

    Quelle configuration devez-vous utiliser pour chaque déploiement ? Pour répondre, faites glisser les configurations appropriées vers les déploiements correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bc, text: { en: "Business Critical", fr: "Business Critical" } }
    - { id: gp, text: { en: "General Purpose", fr: "General Purpose" } }
    - { id: ngp, text: { en: "Next-gen General Purpose", fr: "Next-gen General Purpose" } }
    - { id: pool, text: { en: "General Purpose instances in an instance pool", fr: "Instances General Purpose dans un pool d'instances" } }
    - { id: memopt, text: { en: "General Purpose on memory optimized premium-series hardware", fr: "General Purpose sur le matériel premium-series à mémoire optimisée" } }
  targets:
    - { id: trading, text: Trading }
    - { id: archive, text: Archive }
    - { id: branches, text: Branches }
answer:
  mapping: { trading: bc, archive: ngp, branches: pool }
explanation:
  correct:
    en: |
      Business Critical uses local SSD storage with 1 to 2 ms latency and always includes a readable replica. Next-gen General Purpose supports up to 32 TB of storage and 500 databases per instance, whereas classic General Purpose stops at 16 TB and 100 databases. Instance pools host General Purpose instances of 2 vCores, which exist only in a pool, and deploy an instance in up to 10 minutes.
    fr: |
      Business Critical utilise un stockage SSD local avec une latence de 1 à 2 ms et inclut toujours un réplica accessible en lecture. Next-gen General Purpose prend en charge jusqu'à 32 To de stockage et 500 bases par instance, alors que General Purpose classique s'arrête à 16 To et 100 bases. Les pools d'instances hébergent des instances General Purpose de 2 vCores, qui n'existent que dans un pool, et déploient une instance en 10 minutes au plus.
  options:
    gp: { en: "Classic General Purpose is limited to 16 TB and 100 databases, has remote storage latency, no readable replica and a 4-vCore minimum outside a pool.", fr: "General Purpose classique est limité à 16 To et 100 bases, a la latence d'un stockage distant, pas de réplica lisible et un minimum de 4 vCores hors pool." }
    memopt: { en: "Memory optimized hardware raises memory per vCore; it changes neither latency, database count limits nor the minimum instance size.", fr: "Le matériel à mémoire optimisée augmente la mémoire par vCore ; il ne change ni la latence, ni la limite de bases, ni la taille minimale d'instance." }
references:
  - title: "Resource Limits - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/resource-limits
  - title: "What is an instance pool? - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/instance-pools-overview
