id: dp300-1a-inmemory-downgrade
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL Database database named **BookingDb** in the Business Critical service tier with 8 vCores. BookingDb contains two memory-optimized tables and several natively compiled stored procedures that were used by a retired feature.

    To reduce cost, you need to move BookingDb to the General Purpose service tier with 8 vCores. Your first attempt to change the service tier fails.

    What should you do before you retry the operation?
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **BookingDb** au niveau de service Business Critical avec 8 vCores. BookingDb contient deux tables optimisées en mémoire et plusieurs procédures stockées compilées en mode natif, utilisées par une fonctionnalité abandonnée.

    Pour réduire les coûts, vous devez faire passer BookingDb au niveau de service General Purpose avec 8 vCores. Votre première tentative de changement de niveau de service échoue.

    Que devez-vous faire avant de relancer l'opération ?
body:
  options:
    - { id: a, text: { en: "Disable read scale-out on BookingDb", fr: "Désactiver le scale-out en lecture sur BookingDb" } }
    - { id: b, text: { en: "Scale BookingDb down to Business Critical with 2 vCores", fr: "Réduire BookingDb à Business Critical avec 2 vCores" } }
    - { id: c, text: { en: "Convert BookingDb to the Hyperscale service tier", fr: "Convertir BookingDb au niveau de service Hyperscale" } }
    - { id: d, text: { en: "Drop or convert the memory-optimized tables and the natively compiled modules", fr: "Supprimer ou convertir les tables optimisées en mémoire et les modules compilés en mode natif" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In-Memory OLTP isn't supported in General Purpose, Standard or Basic, so a database that contains any In-Memory OLTP object can't be scaled to those tiers. Remove the memory-optimized tables and table types and the natively compiled modules, or convert them to disk-based tables and regular modules, and then change the tier.
    fr: |
      In-Memory OLTP n'est pas pris en charge en General Purpose, Standard ni Basic : une base qui contient un objet In-Memory OLTP ne peut pas passer à ces niveaux. Supprimez les tables et types de tables optimisés en mémoire ainsi que les modules compilés en mode natif, ou convertissez-les en tables sur disque et en modules ordinaires, puis changez de niveau.
  options:
    a: { en: "Read scale-out doesn't block a change of tier; the In-Memory OLTP objects do.", fr: "Le scale-out en lecture ne bloque pas le changement de niveau ; ce sont les objets In-Memory OLTP qui le bloquent." }
    b: { en: "The number of vCores doesn't matter; General Purpose doesn't support In-Memory OLTP objects at any size.", fr: "Le nombre de vCores n'a pas d'importance ; General Purpose ne prend en charge les objets In-Memory OLTP à aucune taille." }
    c: { en: "Migration to Hyperscale is also blocked while In-Memory OLTP objects exist, and it doesn't meet the General Purpose requirement.", fr: "La migration vers Hyperscale est elle aussi bloquée tant que des objets In-Memory OLTP existent, et elle ne satisfait pas l'exigence General Purpose." }
references:
  - title: "In-memory technologies - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/in-memory-oltp-overview
