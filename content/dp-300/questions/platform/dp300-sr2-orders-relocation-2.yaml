id: dp300-sr2-orders-relocation-2
objective: "1.3.7"
type: series_yesno
series: dp300-sr2-orders-relocation
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You back up OrdersDb to URL, restore it on MI2 and drop it from MI1.
  fr: |
    Vous sauvegardez OrdersDb vers une URL, la restaurez sur MI2 et la supprimez de MI1.
body:
  solution:
    en: |
      You run `BACKUP DATABASE OrdersDb TO URL` with the `COPY_ONLY` option on MI1, restore the backup on MI2 by using `RESTORE DATABASE ... FROM URL`, and then drop OrdersDb from MI1.
    fr: |
      Vous exécutez `BACKUP DATABASE OrdersDb TO URL` avec l'option `COPY_ONLY` sur MI1, restaurez la sauvegarde sur MI2 avec `RESTORE DATABASE ... FROM URL`, puis supprimez OrdersDb de MI1.
answer: { value: false }
explanation:
  correct:
    en: |
      A backup captures OrdersDb at one point in time, and the application keeps writing during the backup and the restore of 600 GB, so the transactions committed after the backup are missing on MI2. Keeping them would mean stopping the application for the whole backup and restore, which does not minimize downtime. An online database move replicates changes until the cutover instead.
    fr: |
      Une sauvegarde capture OrdersDb à un instant donné, et l'application continue d'écrire pendant la sauvegarde et la restauration des 600 Go : les transactions validées après la sauvegarde manquent sur MI2. Pour les conserver, il faudrait arrêter l'application pendant toute la sauvegarde et la restauration, ce qui ne réduit pas l'interruption au minimum. Un déplacement de base en ligne réplique au contraire les modifications jusqu'au basculement.
references:
  - title: "Copy or move a database - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
