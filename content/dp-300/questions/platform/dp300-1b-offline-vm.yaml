id: dp300-1b-offline-vm
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an on-premises SQL Server 2016 instance that hosts a 300 GB database named **ArchiveDb**. You plan to migrate ArchiveDb to SQL Server 2022 on an Azure virtual machine. The application can be stopped for a whole weekend.

    You need to migrate ArchiveDb. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'une instance SQL Server 2016 locale qui héberge une base de données de 300 Go nommée **ArchiveDb**. Vous prévoyez de migrer ArchiveDb vers SQL Server 2022 sur une machine virtuelle Azure. L'application peut être arrêtée pendant tout un week-end.

    Vous devez migrer ArchiveDb. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Start Log Replay Service in autocomplete mode on the virtual machine.", fr: "Démarrer Log Replay Service en mode autocomplete sur la machine virtuelle." } }
    - { id: b, text: { en: "Create a Managed Instance link to the virtual machine, and then fail over.", fr: "Créer un lien Managed Instance vers la machine virtuelle, puis basculer." } }
    - { id: c, text: { en: "Configure transactional replication to the virtual machine, and then cut over.", fr: "Configurer la réplication transactionnelle vers la machine virtuelle, puis basculer." } }
    - { id: d, text: { en: "Take a full backup, copy it to the virtual machine, and restore it.", fr: "Effectuer une sauvegarde complète, la copier sur la machine virtuelle et la restaurer." } }
answer: { optionId: d }
explanation:
  correct:
    en: Backup and restore is the first method listed for migrating individual databases to SQL Server on Azure Virtual Machines. The downtime covers the backup, the copy and the restore, which fits a weekend for 300 GB, and a SQL Server 2016 backup can be restored on SQL Server 2022.
    fr: La sauvegarde et la restauration est la première méthode citée pour migrer des bases de données individuelles vers SQL Server sur les machines virtuelles Azure. Le temps d'arrêt couvre la sauvegarde, la copie et la restauration, ce qui tient dans un week-end pour 300 Go, et une sauvegarde SQL Server 2016 peut être restaurée sur SQL Server 2022.
  options:
    a: { en: "Log Replay Service restores backups only to Azure SQL Managed Instance.", fr: "Log Replay Service ne restaure des sauvegardes que vers Azure SQL Managed Instance." }
    b: { en: "The Managed Instance link replicates only to Azure SQL Managed Instance.", fr: "Le lien Managed Instance ne réplique que vers Azure SQL Managed Instance." }
    c: { en: "Transactional replication is an online method that is complex to set up; it adds effort when downtime is allowed.", fr: "La réplication transactionnelle est une méthode en ligne complexe à configurer ; elle ajoute de l'effort quand un temps d'arrêt est autorisé." }
references:
  - title: "Migration guide: SQL Server to SQL Server on Azure Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/virtual-machines/sql-server-to-sql-on-azure-vm-individual-databases-guide
