id: dp300-1a-bicep-serverless-db
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Bicep file that adds a database named **InventoryDb** to an existing logical server named **sql-adatum-dev**.

    InventoryDb must meet the following requirements:

    - Use the General Purpose service tier with serverless compute and a maximum of 4 vCores.
    - Pause automatically after 60 minutes of inactivity.

    How should you complete the Bicep file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un fichier Bicep qui ajoute une base de données nommée **InventoryDb** à un serveur logique existant nommé **sql-adatum-dev**.

    InventoryDb doit satisfaire aux exigences suivantes :

    - Utiliser le niveau de service General Purpose avec le calcul serverless et 4 vCores au maximum.
    - Se suspendre automatiquement après 60 minutes d'inactivité.

    Comment devez-vous compléter le fichier Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource sqlServer 'Microsoft.Sql/servers@2022-05-01-preview' existing = {
      name: 'sql-adatum-dev'
    }

    resource inventoryDb '[[rtype]]@2022-05-01-preview' = {
      parent: sqlServer
      name: 'InventoryDb'
      location: resourceGroup().location
      sku: {
        name: [[sku]]
        tier: 'GeneralPurpose'
        family: 'Gen5'
        capacity: 4
      }
      properties: {
        [[prop]]: 60
      }
    }
  slots:
    - id: rtype
      options:
        - { id: dbs, text: Microsoft.Sql/servers/databases }
        - { id: pools, text: Microsoft.Sql/servers/elasticPools }
        - { id: midbs, text: Microsoft.Sql/managedInstances/databases }
    - id: sku
      options:
        - { id: gps, text: "'GP_S_Gen5'" }
        - { id: gp, text: "'GP_Gen5'" }
        - { id: bc, text: "'BC_Gen5'" }
    - id: prop
      options:
        - { id: pause, text: autoPauseDelay }
        - { id: mincap, text: minCapacity }
        - { id: ha, text: highAvailabilityReplicaCount }
answer:
  values: { rtype: dbs, sku: gps, prop: pause }
explanation:
  correct:
    en: |
      A database of a logical server is a Microsoft.Sql/servers/databases child resource, linked here with parent. The SKU name GP_S_Gen5 selects General Purpose serverless on standard-series (Gen5) hardware, and capacity sets the maximum vCores. The autoPauseDelay property sets the number of minutes of inactivity before the database pauses (-1 disables auto-pause).
    fr: |
      Une base de données d'un serveur logique est une ressource enfant Microsoft.Sql/servers/databases, reliée ici avec parent. Le nom de SKU GP_S_Gen5 sélectionne General Purpose serverless sur le matériel standard-series (Gen5), et capacity fixe le maximum de vCores. La propriété autoPauseDelay fixe le nombre de minutes d'inactivité avant la suspension de la base (-1 désactive la pause automatique).
  options:
    pools: { en: "This type deploys an elastic pool, not a database.", fr: "Ce type déploie un pool élastique, pas une base de données." }
    midbs: { en: "This type creates a database in a managed instance, not on a logical server.", fr: "Ce type crée une base de données dans une instance managée, pas sur un serveur logique." }
    gp: { en: "GP_Gen5 is General Purpose with provisioned compute, which never pauses.", fr: "GP_Gen5 correspond à General Purpose avec le calcul provisionné, qui ne se suspend jamais." }
    bc: { en: "Business Critical doesn't support serverless compute.", fr: "Business Critical ne prend pas en charge le calcul serverless." }
    mincap: { en: "minCapacity sets the minimum vCores allocated while the database isn't paused, not the pause delay.", fr: "minCapacity fixe le minimum de vCores alloués quand la base n'est pas suspendue, pas le délai de pause." }
    ha: { en: "highAvailabilityReplicaCount sets the number of secondary replicas (Business Critical, Premium, Hyperscale).", fr: "highAvailabilityReplicaCount fixe le nombre de réplicas secondaires (Business Critical, Premium, Hyperscale)." }
references:
  - title: "Microsoft.Sql/servers/databases - Bicep, ARM template & Terraform AzAPI reference"
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.sql/servers/databases
  - title: "Serverless compute tier - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
