id: dp300-1a-mi-agent-jobs
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs an order management application on an on-premises SQL Server 2019 instance that hosts three databases. The application relies on the following features:

    - SQL Server Agent jobs that run nightly maintenance
    - Queries that join tables across the three databases by using three-part names
    - CLR assemblies created with the SAFE permission set

    You plan to move the databases to Azure. The solution must minimize code changes and minimize the administrative effort required for operating system and SQL Server patching.

    Which offering should you recommend?
  fr: |
    Contoso exécute une application de gestion des commandes sur une instance SQL Server 2019 locale qui héberge trois bases de données. L'application s'appuie sur les fonctionnalités suivantes :

    - des travaux SQL Server Agent qui exécutent la maintenance nocturne ;
    - des requêtes qui joignent des tables des trois bases de données à l'aide de noms en trois parties ;
    - des assemblys CLR créés avec le jeu d'autorisations SAFE.

    Vous prévoyez de déplacer les bases de données vers Azure. La solution doit réduire au minimum les modifications de code et l'effort d'administration nécessaire aux correctifs du système d'exploitation et de SQL Server.

    Quelle offre devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Three Azure SQL Database single databases on the same logical server", fr: "Trois bases de données uniques Azure SQL Database sur le même serveur logique" } }
    - { id: b, text: { en: "An Azure SQL Database elastic pool that contains the three databases", fr: "Un pool élastique Azure SQL Database qui contient les trois bases de données" } }
    - { id: c, text: { en: "An Azure SQL Managed Instance that hosts the three databases", fr: "Une instance Azure SQL Managed Instance qui héberge les trois bases de données" } }
    - { id: d, text: { en: "A SQL Server 2019 instance on an Azure virtual machine that hosts the three databases", fr: "Une instance SQL Server 2019 sur une machine virtuelle Azure qui héberge les trois bases de données" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure SQL Managed Instance supports SQL Server Agent, cross-database queries with three-part names and CLR assemblies, so the application moves with few changes. As a PaaS offering, Microsoft patches the operating system and the database engine for you.
    fr: |
      Azure SQL Managed Instance prend en charge SQL Server Agent, les requêtes entre bases de données avec des noms en trois parties et les assemblys CLR : l'application migre avec peu de modifications. S'agissant d'une offre PaaS, Microsoft applique pour vous les correctifs du système d'exploitation et du moteur de base de données.
  options:
    a: { en: "Azure SQL Database has no SQL Server Agent (elastic jobs replace it), no three-part-name cross-database queries and no CLR, so the code would need rework.", fr: "Azure SQL Database n'a ni SQL Server Agent (remplacé par les travaux élastiques), ni requêtes entre bases avec des noms en trois parties, ni CLR : le code devrait être retravaillé." }
    b: { en: "An elastic pool only shares resources among Azure SQL Database databases; it adds none of the missing instance-level features.", fr: "Un pool élastique ne fait que partager des ressources entre bases Azure SQL Database ; il n'ajoute aucune des fonctionnalités de niveau instance manquantes." }
    d: { en: "A virtual machine supports every feature, but you remain responsible for operating system and SQL Server patching, which doesn't minimize administrative effort.", fr: "Une machine virtuelle prend en charge toutes les fonctionnalités, mais les correctifs du système d'exploitation et de SQL Server restent à votre charge, ce qui ne réduit pas l'effort d'administration." }
references:
  - title: "Compare SQL Database Engine Features - Azure SQL Database & Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
