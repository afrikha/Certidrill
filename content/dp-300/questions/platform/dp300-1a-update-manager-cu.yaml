id: dp300-1a-update-manager-cu
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has 20 SQL Server 2022 instances on Azure virtual machines. Each virtual machine is registered with the SQL IaaS Agent extension and uses Automated Patching with a Sunday maintenance window.

    The database team now needs SQL Server cumulative updates to be installed automatically during the Sunday window, together with the Windows updates. The solution must minimize administrative effort and avoid conflicting patching schedules.

    What should you do?
  fr: |
    Fabrikam dispose de 20 instances SQL Server 2022 sur des machines virtuelles Azure. Chaque machine virtuelle est inscrite auprès de l'extension SQL IaaS Agent et utilise la mise à jour corrective automatisée (Automated Patching) avec une fenêtre de maintenance le dimanche.

    L'équipe des bases de données a désormais besoin que les mises à jour cumulatives de SQL Server soient installées automatiquement pendant la fenêtre du dimanche, en même temps que les mises à jour Windows. La solution doit réduire au minimum l'effort d'administration et éviter les planifications de correctifs en conflit.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Extend the Automated Patching maintenance window of each virtual machine to 180 minutes", fr: "Étendre à 180 minutes la fenêtre de maintenance d'Automated Patching de chaque machine virtuelle" } }
    - { id: b, text: { en: "Keep Automated Patching and add an Azure Update Manager maintenance configuration for the cumulative updates", fr: "Conserver Automated Patching et ajouter une configuration de maintenance Azure Update Manager pour les mises à jour cumulatives" } }
    - { id: c, text: { en: "Disable Automated Patching and assign the virtual machines to an Azure Update Manager maintenance configuration that includes SQL Server updates", fr: "Désactiver Automated Patching et affecter les machines virtuelles à une configuration de maintenance Azure Update Manager qui inclut les mises à jour SQL Server" } }
    - { id: d, text: { en: "Connect the virtual machines to Azure Arc and enable automatic updates of SQL Server enabled by Azure Arc", fr: "Connecter les machines virtuelles à Azure Arc et activer les mises à jour automatiques de SQL Server activé par Azure Arc" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Automated Patching installs only updates marked Important or Critical, not SQL Server cumulative updates, and it is scheduled to retire in September 2027. Azure Update Manager installs SQL Server cumulative updates in a maintenance window that applies to many virtual machines. Disable Automated Patching first: using both services causes scheduling conflicts.
    fr: |
      Automated Patching n'installe que les mises à jour marquées Important ou Critical, pas les mises à jour cumulatives de SQL Server, et son retrait est prévu en septembre 2027. Azure Update Manager installe les mises à jour cumulatives de SQL Server dans une fenêtre de maintenance qui s'applique à de nombreuses machines virtuelles. Désactivez d'abord Automated Patching : utiliser les deux services provoque des conflits de planification.
  options:
    a: { en: "A longer window doesn't change what Automated Patching installs; cumulative updates not marked Important or Critical still aren't installed.", fr: "Une fenêtre plus longue ne change pas ce qu'installe Automated Patching ; les mises à jour cumulatives non marquées Important ou Critical ne sont toujours pas installées." }
    b: { en: "Running two patching services on the same virtual machine can cause conflicts and failed updates; use only one.", fr: "Exécuter deux services de correctifs sur la même machine virtuelle peut provoquer des conflits et des échecs ; n'en utilisez qu'un." }
    d: { en: "SQL Server on Azure virtual machines isn't a supported Azure Arc configuration.", fr: "SQL Server sur des machines virtuelles Azure n'est pas une configuration Azure Arc prise en charge." }
references:
  - title: "Azure Update Manager - SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/azure-update-manager-sql-vm
  - title: "Automated Patching - SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/automated-patching
