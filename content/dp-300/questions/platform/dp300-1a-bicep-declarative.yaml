id: dp300-1a-bicep-declarative
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum deploys the same Azure SQL environment (a logical server, three databases and server-level firewall rules) to development, test and production resource groups.

    You need to choose a deployment method that meets the following requirements:

    - The environment is described declaratively as a desired state and stored in a Git repository.
    - A deployment pipeline can run the same deployment again without creating duplicate resources and without custom existence checks.

    What should you use?
  fr: |
    Adatum déploie le même environnement Azure SQL (un serveur logique, trois bases de données et des règles de pare-feu au niveau du serveur) dans des groupes de ressources de développement, de test et de production.

    Vous devez choisir une méthode de déploiement qui satisfait aux exigences suivantes :

    - L'environnement est décrit de façon déclarative, comme un état souhaité, et stocké dans un dépôt Git.
    - Un pipeline de déploiement peut relancer le même déploiement sans créer de ressources en double et sans vérifications d'existence personnalisées.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A Bash script that runs az sql server create and az sql db create", fr: "Un script Bash qui exécute az sql server create et az sql db create" } }
    - { id: b, text: { en: "A Bicep file deployed by running az deployment group create", fr: "Un fichier Bicep déployé en exécutant az deployment group create" } }
    - { id: c, text: { en: "A PowerShell script that runs New-AzSqlServer and New-AzSqlDatabase", fr: "Un script PowerShell qui exécute New-AzSqlServer et New-AzSqlDatabase" } }
    - { id: d, text: { en: "A runbook in Azure Automation that clones the production databases", fr: "Un runbook Azure Automation qui clone les bases de données de production" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Bicep file declares the resources and their properties, and Resource Manager compares that desired state with what exists. In the default incremental mode, a resource that already exists with the same settings is left unchanged, so the pipeline can redeploy the file safely.
    fr: |
      Un fichier Bicep déclare les ressources et leurs propriétés, et Resource Manager compare cet état souhaité à l'existant. En mode incrémentiel, le mode par défaut, une ressource qui existe déjà avec les mêmes paramètres reste inchangée : le pipeline peut redéployer le fichier sans risque.
  options:
    a: { en: "Azure CLI commands are imperative steps; the script, not a desired-state definition, decides what to do when a resource already exists.", fr: "Les commandes Azure CLI sont des étapes impératives ; c'est le script, et non une définition d'état souhaité, qui décide quoi faire si une ressource existe déjà." }
    c: { en: "The Az PowerShell cmdlets are imperative too; handling resources that already exist requires your own checks.", fr: "Les cmdlets Az PowerShell sont elles aussi impératives ; gérer les ressources déjà existantes exige vos propres vérifications." }
    d: { en: "Cloning production databases copies data instead of deploying a defined environment, and a runbook is imperative code.", fr: "Cloner les bases de production copie des données au lieu de déployer un environnement défini, et un runbook est du code impératif." }
references:
  - title: "Deployment modes - Azure Resource Manager"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
