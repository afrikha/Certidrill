id: dp300-1a-ag-rolling-patch
objective: "1.1.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has an Always On availability group named **AG1** on two Azure virtual machines in the same region. **SQLVM1** hosts the primary replica and **SQLVM2** hosts a synchronous-commit secondary replica. Both replicas are configured for automatic failover.

    You need to apply a SQL Server cumulative update to both replicas. The solution must minimize the downtime of the databases in AG1.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove dispose d'un groupe de disponibilité Always On nommé **AG1** sur deux machines virtuelles Azure de la même région. **SQLVM1** héberge le réplica principal et **SQLVM2** un réplica secondaire avec validation synchrone. Les deux réplicas sont configurés pour le basculement automatique.

    Vous devez appliquer une mise à jour cumulative de SQL Server aux deux réplicas. La solution doit réduire au minimum le temps d'arrêt des bases de données d'AG1.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: noauto, text: { en: "Remove automatic failover from both replicas.", fr: "Supprimer le basculement automatique des deux réplicas." } }
    - { id: patch2, text: { en: "Install the cumulative update on SQLVM2.", fr: "Installer la mise à jour cumulative sur SQLVM2." } }
    - { id: failover, text: { en: "Manually fail over AG1 to SQLVM2.", fr: "Basculer manuellement AG1 vers SQLVM2." } }
    - { id: patch1, text: { en: "Install the cumulative update on SQLVM1.", fr: "Installer la mise à jour cumulative sur SQLVM1." } }
    - { id: auto, text: { en: "Configure automatic failover on both replicas again.", fr: "Reconfigurer le basculement automatique sur les deux réplicas." } }
    - { id: remove, text: { en: "Remove the databases from AG1.", fr: "Supprimer les bases de données d'AG1." } }
    - { id: async, text: { en: "Change SQLVM2 to asynchronous commit and force a failover with possible data loss.", fr: "Passer SQLVM2 en validation asynchrone et forcer un basculement avec perte de données possible." } }
answer:
  sequence: [ noauto, patch2, failover, patch1, auto ]
explanation:
  correct:
    en: |
      A rolling update removes automatic failover so that a replica restarting during the update doesn't trigger an unplanned failover. You update the secondary first, fail over manually to it once it is synchronized, which is the only short interruption, then update the former primary and restore automatic failover.
    fr: |
      Une mise à jour propagée supprime le basculement automatique pour qu'un réplica qui redémarre pendant la mise à jour ne provoque pas de basculement non planifié. Vous mettez d'abord à jour le secondaire, basculez manuellement vers lui une fois synchronisé, ce qui constitue la seule brève interruption, puis vous mettez à jour l'ancien principal et rétablissez le basculement automatique.
  options:
    remove: { en: "Removing the databases breaks the availability group and would require reseeding; it increases downtime.", fr: "Supprimer les bases casse le groupe de disponibilité et imposerait un nouvel amorçage ; cela augmente le temps d'arrêt." }
    async: { en: "A synchronized synchronous-commit replica allows a planned manual failover without data loss; a forced failover isn't needed.", fr: "Un réplica synchrone synchronisé permet un basculement manuel planifié sans perte de données ; un basculement forcé n'est pas nécessaire." }
references:
  - title: "Upgrade Availability Group Replicas - SQL Server Always On"
    url: https://learn.microsoft.com/en-us/sql/database-engine/availability-groups/windows/upgrading-always-on-availability-group-replica-instances
