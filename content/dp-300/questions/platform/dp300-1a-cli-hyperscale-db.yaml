id: dp300-1a-cli-hyperscale-db
objective: "1.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-contoso-prod**. You need to create a database named **LedgerDb** by using the Azure CLI. LedgerDb must meet the following requirements:

    - Grow to 50 TB without a change of service tier.
    - Have two high availability secondary replicas.
    - Store its backups in zone-redundant storage in the primary region only.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-contoso-prod**. Vous devez créer une base de données nommée **LedgerDb** avec Azure CLI. LedgerDb doit satisfaire aux exigences suivantes :

    - Atteindre 50 To sans changement de niveau de service.
    - Disposer de deux réplicas secondaires de haute disponibilité.
    - Stocker ses sauvegardes dans un stockage redondant interzone, dans la région primaire uniquement.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql db create --resource-group RG1 --server sql-contoso-prod \
      --name LedgerDb --edition [[ed]] --family Gen5 --capacity 8 \
      [[rep]] 2 --backup-storage-redundancy [[bsr]]
  slots:
    - id: ed
      options:
        - { id: gp, text: GeneralPurpose }
        - { id: bc, text: BusinessCritical }
        - { id: hs, text: Hyperscale }
    - id: rep
      options:
        - { id: ha, text: --ha-replicas }
        - { id: min, text: --min-capacity }
        - { id: pause, text: --auto-pause-delay }
    - id: bsr
      options:
        - { id: local, text: Local }
        - { id: zone, text: Zone }
        - { id: geo, text: Geo }
        - { id: geozone, text: GeoZone }
answer:
  values: { ed: hs, rep: ha, bsr: zone }
explanation:
  correct:
    en: |
      Hyperscale storage grows up to 128 TB, whereas General Purpose and Business Critical stop at 4 TB. A Hyperscale database can have 0 to 4 high availability replicas, set with --ha-replicas. Zone backup storage redundancy keeps backups in zone-redundant storage in the primary region; Geo and GeoZone copy them to the paired region.
    fr: |
      Le stockage Hyperscale atteint 128 To, alors que General Purpose et Business Critical s'arrêtent à 4 To. Une base Hyperscale peut avoir de 0 à 4 réplicas de haute disponibilité, définis avec --ha-replicas. La redondance Zone du stockage de sauvegarde conserve les sauvegardes dans un stockage redondant interzone de la région primaire ; Geo et GeoZone les copient dans la région jumelée.
  options:
    gp: { en: "General Purpose is limited to 4 TB.", fr: "General Purpose est limité à 4 To." }
    bc: { en: "Business Critical is limited to 4 TB.", fr: "Business Critical est limité à 4 To." }
    min: { en: "--min-capacity sets the minimum vCores of a serverless database.", fr: "--min-capacity fixe le minimum de vCores d'une base serverless." }
    pause: { en: "--auto-pause-delay applies to serverless databases and is expressed in minutes.", fr: "--auto-pause-delay s'applique aux bases serverless et s'exprime en minutes." }
    local: { en: "Local keeps backups in locally redundant storage, not zone-redundant storage.", fr: "Local conserve les sauvegardes dans un stockage localement redondant, pas redondant interzone." }
    geo: { en: "Geo replicates backups to the paired region, which the requirement excludes.", fr: "Geo réplique les sauvegardes dans la région jumelée, ce que l'exigence exclut." }
    geozone: { en: "GeoZone also replicates backups to the paired region.", fr: "GeoZone réplique aussi les sauvegardes dans la région jumelée." }
references:
  - title: "What is the Hyperscale service tier? - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale
  - title: "Microsoft.Sql/servers/databases - Bicep, ARM template & Terraform AzAPI reference"
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.sql/servers/databases
