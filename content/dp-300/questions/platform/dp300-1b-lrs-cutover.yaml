id: dp300-1b-lrs-cutover
objective: "1.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You are migrating a database named **CrmDb** from SQL Server 2019 to an Azure SQL managed instance named MI1 by using Log Replay Service (LRS) in continuous mode. LRS has restored the full backup and keeps restoring the log backups that you upload to Azure Blob Storage.

    You need to perform the cutover so that CrmDb comes online on MI1 with no data loss.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous migrez une base de données nommée **CrmDb** de SQL Server 2019 vers une instance managée Azure SQL nommée MI1 avec Log Replay Service (LRS) en mode continu. LRS a restauré la sauvegarde complète et continue de restaurer les sauvegardes de journal que vous chargez dans Stockage Blob Azure.

    Vous devez effectuer le basculement pour que CrmDb soit mise en ligne sur MI1 sans perte de données.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: stopapp, text: { en: "Stop the application workload on CrmDb.", fr: "Arrêter la charge de travail applicative sur CrmDb." } }
    - { id: tail, text: { en: "Take a tail-log backup of CrmDb on SQL Server.", fr: "Effectuer une sauvegarde de la fin du journal de CrmDb sur SQL Server." } }
    - { id: upload, text: { en: "Upload the tail-log backup file to the database folder in Blob Storage.", fr: "Charger le fichier de sauvegarde de la fin du journal dans le dossier de la base dans Stockage Blob." } }
    - { id: show, text: { en: "Run az sql midb log-replay show to confirm that the tail-log backup is restored.", fr: "Exécuter az sql midb log-replay show pour vérifier que la sauvegarde de la fin du journal est restaurée." } }
    - { id: complete, text: { en: "Run az sql midb log-replay complete with the name of the tail-log backup file.", fr: "Exécuter az sql midb log-replay complete avec le nom du fichier de sauvegarde de la fin du journal." } }
    - { id: stoplrs, text: { en: "Run az sql midb log-replay stop.", fr: "Exécuter az sql midb log-replay stop." } }
    - { id: restart, text: { en: "Restart LRS in autocomplete mode with the tail-log backup as the last backup.", fr: "Redémarrer LRS en mode autocomplete avec la sauvegarde de la fin du journal comme dernière sauvegarde." } }
answer:
  sequence: [ stopapp, tail, upload, show, complete ]
explanation:
  correct:
    en: |
      In continuous mode the cutover is manual: stop the workload so that no change is lost, back up the tail of the log, upload it, check that LRS has restored it, and then run the complete command, which brings the database online. Only after that do you repoint the application to MI1.
    fr: |
      En mode continu, le basculement est manuel : arrêtez la charge de travail pour ne perdre aucune modification, sauvegardez la fin du journal, chargez-la, vérifiez que LRS l'a restaurée, puis exécutez la commande complete, qui met la base de données en ligne. C'est seulement ensuite que vous redirigez l'application vers MI1.
  options:
    stoplrs: { en: "Stopping LRS deletes the database being restored; the migration would have to start again.", fr: "Arrêter LRS supprime la base de données en cours de restauration ; la migration devrait recommencer." }
    restart: { en: "A running continuous-mode job can't be switched to autocomplete; the complete command performs the cutover.", fr: "Un travail en mode continu en cours ne peut pas passer en mode autocomplete ; c'est la commande complete qui effectue le basculement." }
references:
  - title: Overview of Log Replay Service with Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-overview
  - title: Migrate databases from SQL Server by using Log Replay Service - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-migrate
