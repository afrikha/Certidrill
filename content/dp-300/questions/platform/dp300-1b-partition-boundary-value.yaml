id: dp300-1b-partition-boundary-value
objective: "1.2.4"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You have an Azure SQL managed instance that hosts a database named **InventoryDb**. You run the following statement.

    ```sql
    CREATE PARTITION FUNCTION pfQuantity (int)
        AS RANGE LEFT FOR VALUES (100, 200, 300);
    ```

    A table is partitioned by using pfQuantity on its Quantity column.

    In which partition is a row stored if its Quantity value is 200?
  fr: |
    Vous disposez d'une instance managée Azure SQL qui héberge une base de données nommée **InventoryDb**. Vous exécutez l'instruction suivante.

    ```sql
    CREATE PARTITION FUNCTION pfQuantity (int)
        AS RANGE LEFT FOR VALUES (100, 200, 300);
    ```

    Une table est partitionnée à l'aide de pfQuantity sur sa colonne Quantity.

    Dans quelle partition une ligne est-elle stockée si sa valeur Quantity est 200 ?
body:
  options:
    - { id: p1, text: Partition 1 }
    - { id: p2, text: Partition 2 }
    - { id: p3, text: Partition 3 }
    - { id: p4, text: Partition 4 }
answer: { optionId: p2 }
explanation:
  correct:
    en: Three boundary values create four partitions. With RANGE LEFT, each boundary value belongs to the partition on its left, so partition 2 holds the values greater than 100 and lower than or equal to 200, including 200.
    fr: Trois valeurs limites créent quatre partitions. Avec RANGE LEFT, chaque valeur limite appartient à la partition située à sa gauche ; la partition 2 contient donc les valeurs supérieures à 100 et inférieures ou égales à 200, y compris 200.
  options:
    p1: { en: "Partition 1 holds the values lower than or equal to 100.", fr: "La partition 1 contient les valeurs inférieures ou égales à 100." }
    p3: { en: "200 would be in partition 3 with RANGE RIGHT, where each boundary starts the next partition.", fr: "200 serait dans la partition 3 avec RANGE RIGHT, où chaque limite commence la partition suivante." }
    p4: { en: "Partition 4 holds the values greater than 300.", fr: "La partition 4 contient les valeurs supérieures à 300." }
references:
  - title: CREATE PARTITION FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-partition-function-transact-sql
