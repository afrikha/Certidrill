id: dp300-1a-mi-memory-hardware
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI1** in the Business Critical service tier with 16 vCores on standard-series (Gen5) hardware. MI1 must stay in the Business Critical tier.

    Monitoring shows memory pressure on MI1, while average CPU usage stays below 30 percent. Adding vCores would increase licensing costs, which the company refuses.

    You need to provide the highest amount of memory per vCore to MI1 without changing the number of vCores. What should you do?
  fr: |
    Vous disposez d'une instance Azure SQL Managed Instance nommée **MI1** au niveau de service Business Critical, avec 16 vCores sur le matériel standard-series (Gen5). MI1 doit rester au niveau Business Critical.

    La supervision montre une pression sur la mémoire de MI1, alors que l'utilisation moyenne du processeur reste inférieure à 30 %. Ajouter des vCores augmenterait les coûts de licence, ce que l'entreprise refuse.

    Vous devez fournir à MI1 la plus grande quantité de mémoire par vCore sans changer le nombre de vCores. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the hardware of MI1 to premium-series", fr: "Changer le matériel de MI1 pour premium-series" } }
    - { id: b, text: { en: "Change the hardware of MI1 to memory optimized premium-series", fr: "Changer le matériel de MI1 pour premium-series à mémoire optimisée" } }
    - { id: c, text: { en: "Enable Next-gen General Purpose on MI1 and set a larger memory size", fr: "Activer Next-gen General Purpose sur MI1 et définir une taille de mémoire plus grande" } }
    - { id: d, text: { en: "Add data files to tempdb on MI1", fr: "Ajouter des fichiers de données à tempdb sur MI1" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      On Managed Instance, the hardware sets the memory per vCore: 5.1 GB for standard-series, 7 GB for premium-series and 13.6 GB for memory optimized premium-series. Business Critical supports memory optimized premium-series, so the same 16 vCores get about 218 GB of memory instead of about 82 GB.
    fr: |
      Sur Managed Instance, le matériel fixe la mémoire par vCore : 5,1 Go pour standard-series, 7 Go pour premium-series et 13,6 Go pour premium-series à mémoire optimisée. Business Critical prend en charge premium-series à mémoire optimisée : les mêmes 16 vCores disposent d'environ 218 Go de mémoire au lieu d'environ 82 Go.
  options:
    a: { en: "Premium-series raises memory to 7 GB per vCore, less than memory optimized premium-series.", fr: "Premium-series porte la mémoire à 7 Go par vCore, moins que premium-series à mémoire optimisée." }
    c: { en: "Next-gen General Purpose is a variant of the General Purpose tier; MI1 must stay in Business Critical.", fr: "Next-gen General Purpose est une variante du niveau General Purpose ; MI1 doit rester en Business Critical." }
    d: { en: "More tempdb files reduce allocation contention; they don't add memory to the instance.", fr: "Plus de fichiers tempdb réduisent la contention d'allocation ; ils n'ajoutent pas de mémoire à l'instance." }
references:
  - title: "Resource Limits - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/resource-limits
