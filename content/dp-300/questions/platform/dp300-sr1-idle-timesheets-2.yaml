id: dp300-sr1-idle-timesheets-2
objective: "1.2.1"
type: series_yesno
series: dp300-sr1-idle-timesheets
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You switch Timesheets to serverless with a 60-minute auto-pause delay.
  fr: |
    Vous passez Timesheets en serverless avec un délai de mise en pause automatique de 60 minutes.
body:
  solution:
    en: |
      You change the compute tier of Timesheets to **Serverless** in the General Purpose service tier, you set the maximum vCores to **8**, and you set the auto-pause delay to **60 minutes**.
    fr: |
      Vous changez le niveau de calcul de Timesheets en **Serverless** dans le niveau de service General Purpose, vous définissez le maximum de vCores sur **8** et le délai de mise en pause automatique sur **60 minutes**.
answer: { value: true }
explanation:
  correct:
    en: |
      Serverless General Purpose scales automatically up to the configured maximum, so peaks still get 8 vCores. After 60 minutes without activity the database pauses, and while it is paused only storage is billed, so idle nights and weekends cost no compute. The resume delay is acceptable because the application retries.
    fr: |
      Le serverless General Purpose se met à l'échelle automatiquement jusqu'au maximum configuré : les pics disposent toujours de 8 vCores. Après 60 minutes sans activité, la base se met en pause, et pendant la pause seul le stockage est facturé : les nuits et les week-ends inactifs ne coûtent aucun calcul. Le délai de reprise est acceptable puisque l'application relance ses connexions.
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
