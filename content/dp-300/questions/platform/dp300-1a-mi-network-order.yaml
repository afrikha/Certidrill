id: dp300-1a-mi-network-order
objective: "1.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You need to deploy an Azure SQL managed instance named **mi-adatum** and a database named **SalesDb** in it by using the Azure CLI. The resource group **RG1** is empty. The instance must meet the networking requirements of SQL Managed Instance.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez déployer une instance Azure SQL Managed Instance nommée **mi-adatum** et une base de données nommée **SalesDb** dans celle-ci avec Azure CLI. Le groupe de ressources **RG1** est vide. L'instance doit respecter les exigences réseau de SQL Managed Instance.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: vnet, text: { en: "Create a virtual network with a dedicated subnet that has at least 32 IP addresses.", fr: "Créer un réseau virtuel avec un sous-réseau dédié d'au moins 32 adresses IP." } }
    - { id: prep, text: { en: "Associate a network security group and a route table with the subnet, and delegate the subnet to Microsoft.Sql/managedInstances.", fr: "Associer un groupe de sécurité réseau et une table de routage au sous-réseau, et déléguer le sous-réseau à Microsoft.Sql/managedInstances." } }
    - { id: mi, text: { en: "Run az sql mi create and specify the resource ID of the subnet.", fr: "Exécuter az sql mi create en indiquant l'ID de ressource du sous-réseau." } }
    - { id: db, text: { en: "Run az sql midb create to create SalesDb.", fr: "Exécuter az sql midb create pour créer SalesDb." } }
    - { id: pe, text: { en: "Create a private endpoint in the subnet.", fr: "Créer un point de terminaison privé dans le sous-réseau." } }
    - { id: se, text: { en: "Enable the Microsoft.Sql service endpoint on the subnet.", fr: "Activer le point de terminaison de service Microsoft.Sql sur le sous-réseau." } }
    - { id: srv, text: { en: "Run az sql server create to create a logical server.", fr: "Exécuter az sql server create pour créer un serveur logique." } }
answer:
  sequence: [ vnet, prep, mi, db ]
explanation:
  correct:
    en: |
      A managed instance is deployed into a dedicated subnet of your virtual network. The subnet must be delegated to Microsoft.Sql/managedInstances and have a network security group and a route table associated; service-aided subnet configuration then adds the required rules and routes. The instance is created in that subnet, and the database is created in the instance afterward.
    fr: |
      Une instance managée est déployée dans un sous-réseau dédié de votre réseau virtuel. Le sous-réseau doit être délégué à Microsoft.Sql/managedInstances et être associé à un groupe de sécurité réseau et à une table de routage ; la configuration de sous-réseau assistée par le service ajoute ensuite les règles et itinéraires requis. L'instance est créée dans ce sous-réseau, puis la base est créée dans l'instance.
  options:
    pe: { en: "A private endpoint gives private access to another service; a managed instance is injected into the subnet instead.", fr: "Un point de terminaison privé donne un accès privé à un autre service ; une instance managée est au contraire injectée dans le sous-réseau." }
    se: { en: "Service endpoints secure access to Azure SQL Database logical servers; they aren't a requirement of a managed instance subnet.", fr: "Les points de terminaison de service sécurisent l'accès aux serveurs logiques Azure SQL Database ; ils ne sont pas une exigence du sous-réseau d'une instance managée." }
    srv: { en: "A logical server hosts Azure SQL Database databases; a managed instance doesn't use one.", fr: "Un serveur logique héberge des bases Azure SQL Database ; une instance managée n'en utilise pas." }
references:
  - title: "Connectivity Architecture - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/connectivity-architecture-overview
