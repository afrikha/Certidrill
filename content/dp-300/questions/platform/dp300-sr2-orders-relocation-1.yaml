id: dp300-sr2-orders-relocation-1
objective: "1.3.7"
type: series_yesno
series: dp300-sr2-orders-relocation
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You copy OrdersDb to MI2 with the Azure CLI and complete the copy.
  fr: |
    Vous copiez OrdersDb vers MI2 avec Azure CLI et terminez la copie.
body:
  solution:
    en: |
      You run `az sql midb copy start` for OrdersDb with MI2 in Sub2 as the destination. When the operation is ready for completion, you run `az sql midb copy complete`, and then you redirect the application to MI2.
    fr: |
      Vous exécutez `az sql midb copy start` pour OrdersDb avec MI2 dans Sub2 comme destination. Quand l'opération est prête à être terminée, vous exécutez `az sql midb copy complete`, puis vous redirigez l'application vers MI2.
answer: { value: false }
explanation:
  correct:
    en: |
      A database copy leaves the source database online on MI1 after completion, so OrdersDb still exists there. Completing a copy also stops log replication while the application can still write to the source, so transactions committed on MI1 after that moment are not on MI2. The move operation is the one that stops the source workload, replicates the remaining log and then drops the source.
    fr: |
      Une copie de base laisse la base source en ligne sur MI1 après la fin de l'opération : OrdersDb y existe donc toujours. Terminer une copie arrête aussi la réplication du journal alors que l'application peut encore écrire dans la source : les transactions validées sur MI1 après ce moment ne sont pas sur MI2. C'est le déplacement qui arrête la charge de travail source, réplique le reste du journal puis supprime la source.
references:
  - title: "Copy or move a database - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
