id: dp300-cs2b-archive-compression
objective: "1.2.5"
type: dropdown
caseStudy: dp300-cs2b-fabrikam-plants
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You need to reduce the storage used by dbo.MachineEvents to meet the data requirements.

    How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez réduire le stockage utilisé par dbo.MachineEvents pour satisfaire les exigences de données.

    Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE dbo.MachineEvents
    REBUILD PARTITION = ALL WITH (
        DATA_COMPRESSION = [[comp]] ON PARTITIONS ([[range]])
    );
  slots:
    - id: comp
      options:
        - { id: c_page, text: PAGE }
        - { id: c_cs, text: COLUMNSTORE }
        - { id: c_archive, text: COLUMNSTORE_ARCHIVE }
    - id: range
      options:
        - { id: r_1_12, text: 1 TO 12 }
        - { id: r_1_24, text: 1 TO 24 }
        - { id: r_25_36, text: 25 TO 36 }
answer:
  values: { comp: c_archive, range: r_1_24 }
explanation:
  correct:
    en: |
      Columnstore archival compression adds XPRESS compression on top of columnstore compression; it saves space at the cost of CPU and slower queries, which suits rarely queried data. Partition 36 is the current month, so partitions 25 to 36 are the 12 most recent months and partitions 1 to 24 are the months older than 12 months. `ON PARTITIONS (1 TO 24)` limits archival compression to those partitions, and the other partitions keep standard columnstore compression.
    fr: |
      La compression d'archivage columnstore ajoute la compression XPRESS à la compression columnstore ; elle réduit l'espace au prix de processeur et de requêtes plus lentes, ce qui convient à des données rarement interrogées. La partition 36 est le mois en cours : les partitions 25 à 36 sont les 12 mois les plus récents et les partitions 1 à 24 les mois de plus de 12 mois. `ON PARTITIONS (1 TO 24)` limite la compression d'archivage à ces partitions, et les autres conservent la compression columnstore standard.
  options:
    c_page: { en: "Row and page compression apply to rowstore tables and indexes; a columnstore index always uses columnstore compression.", fr: "La compression de ligne et de page s'applique aux tables et index rowstore ; un index columnstore utilise toujours la compression columnstore." }
    c_cs: { en: "COLUMNSTORE is the standard compression that the partitions already use; it would not reduce their storage.", fr: "COLUMNSTORE est la compression standard que les partitions utilisent déjà ; elle ne réduirait pas leur stockage." }
    r_1_12: { en: "Partitions 1 to 12 cover only the oldest 12 months; months 13 to 24 are also older than 12 months.", fr: "Les partitions 1 à 12 ne couvrent que les 12 mois les plus anciens ; les mois 13 à 24 ont eux aussi plus de 12 mois." }
    r_25_36: { en: "Partitions 25 to 36 are the 12 most recent months, which must keep standard columnstore performance.", fr: "Les partitions 25 à 36 sont les 12 mois les plus récents, qui doivent conserver les performances columnstore standard." }
references:
  - title: Data compression - SQL Server
    url: https://learn.microsoft.com/en-us/sql/relational-databases/data-compression/data-compression
