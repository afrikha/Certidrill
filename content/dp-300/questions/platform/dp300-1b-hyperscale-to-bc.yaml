id: dp300-1b-hyperscale-to-bc
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named **QuotesDb** that uses the HS_Gen5_8 service objective. Twenty days ago, you converted QuotesDb from the Business Critical tier to Hyperscale. QuotesDb isn't in an elastic pool and has no geo-replicas and no named replicas.

    Tests show that the workload needs the Business Critical tier. You need to move QuotesDb back to Business Critical. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **QuotesDb** qui utilise l'objectif de service HS_Gen5_8. Il y a vingt jours, vous avez converti QuotesDb du niveau Business Critical vers Hyperscale. QuotesDb n'est pas dans un pool élastique et n'a ni géoréplica ni réplica nommé.

    Les tests montrent que la charge de travail a besoin du niveau Business Critical. Vous devez ramener QuotesDb au niveau Business Critical. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the service tier of QuotesDb directly to Business Critical.", fr: "Changer directement le niveau de service de QuotesDb en Business Critical." } }
    - { id: b, text: { en: "Create a copy of QuotesDb in the Business Critical tier by using CREATE DATABASE ... AS COPY OF.", fr: "Créer une copie de QuotesDb au niveau Business Critical avec CREATE DATABASE ... AS COPY OF." } }
    - { id: c, text: { en: "Reverse migrate QuotesDb to General Purpose, and then change the service tier to Business Critical.", fr: "Effectuer une migration inverse de QuotesDb vers General Purpose, puis changer le niveau de service en Business Critical." } }
    - { id: d, text: { en: "Export QuotesDb to a BACPAC from the Azure portal, and then import it into a new Business Critical database.", fr: "Exporter QuotesDb vers un BACPAC depuis le portail Azure, puis l'importer dans une nouvelle base Business Critical." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A database converted to Hyperscale can be reverse migrated within 45 days, but only to General Purpose (provisioned or serverless). To reach Business Critical, reverse migrate to General Purpose first, then change the service tier. QuotesDb meets the prerequisites: no geo-replication, no named replicas, not in a pool, and at least 2 vCores."
    fr: "Une base convertie en Hyperscale peut faire l'objet d'une migration inverse dans les 45 jours, mais uniquement vers General Purpose (provisionné ou serverless). Pour atteindre Business Critical, effectuez d'abord la migration inverse vers General Purpose, puis changez le niveau de service. QuotesDb remplit les prérequis : pas de géoréplication, pas de réplica nommé, pas de pool et au moins 2 vCores."
  options:
    a: { en: "Reverse migration from Hyperscale targets only General Purpose; a direct move to Business Critical isn't supported.", fr: "La migration inverse depuis Hyperscale ne cible que General Purpose ; un passage direct à Business Critical n'est pas pris en charge." }
    b: { en: "A database copy keeps the service tier of the source; only the compute size or backup redundancy can change.", fr: "Une copie de base de données conserve le niveau de service de la source ; seuls la taille de calcul ou la redondance des sauvegardes peuvent changer." }
    d: { en: "BACPAC export and import of a Hyperscale database isn't supported from the Azure portal, and it is a slow, offline data movement.", fr: "L'exportation et l'importation BACPAC d'une base Hyperscale ne sont pas prises en charge depuis le portail Azure, et c'est un déplacement de données lent et hors connexion." }
references:
  - title: Reverse migrate a database from Hyperscale
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/reverse-migrate-from-hyperscale
