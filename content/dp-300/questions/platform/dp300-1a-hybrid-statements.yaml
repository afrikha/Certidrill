id: dp300-1a-hybrid-statements
objective: "1.1.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to connect the SQL Server instances of a branch office to Azure Arc. The branch office firewall allows only outbound traffic. One host runs SQL Server 2022 on Windows Server 2022, and another host runs SQL Server 2022 in Linux containers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de connecter à Azure Arc les instances SQL Server d'une succursale. Le pare-feu de la succursale n'autorise que le trafic sortant. Un hôte exécute SQL Server 2022 sur Windows Server 2022, et un autre exécute SQL Server 2022 dans des conteneurs Linux.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Azure extension for SQL Server can reach the Arc data processing service through outbound HTTPS on TCP port 443.
        fr: L'extension Azure pour SQL Server peut joindre le service de traitement des données Arc via HTTPS sortant sur le port TCP 443.
    - id: s2
      text:
        en: The SQL Server instances that run in Linux containers can be connected to Azure Arc as SQL Server - Azure Arc resources.
        fr: Les instances SQL Server exécutées dans des conteneurs Linux peuvent être connectées à Azure Arc en tant que ressources SQL Server - Azure Arc.
    - id: s3
      text:
        en: The Arc-enabled server and the Arc-enabled SQL Server instance that it hosts should be assigned the same Azure region.
        fr: Le serveur activé par Arc et l'instance SQL Server activée par Arc qu'il héberge doivent se voir attribuer la même région Azure.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Arc-enabled SQL Server communicates with Azure over outbound TCP 443, so no inbound rule is needed. SQL Server running in containers is an unsupported configuration. The prerequisites require the same Azure region for the Arc-enabled server and its Arc-enabled SQL Server instances.
    fr: |
      SQL Server activé par Arc communique avec Azure via TCP 443 sortant : aucune règle entrante n'est nécessaire. SQL Server exécuté dans des conteneurs est une configuration non prise en charge. Les prérequis imposent la même région Azure pour le serveur activé par Arc et ses instances SQL Server activées par Arc.
references:
  - title: "Prerequisites - SQL Server enabled by Azure Arc"
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/prerequisites
