id: dp300-1b-mi-copy-powershell
objective: "1.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure SQL managed instances named **mi-tailspin-01** (resource group RG1) and **mi-tailspin-02** (resource group RG2) in the same region. mi-tailspin-01 hosts a database named RoutesDb.

    You need to create a copy of RoutesDb on mi-tailspin-02 by using Azure PowerShell. RoutesDb must remain online and independent on mi-tailspin-01 after the operation. You must check the status of the operation before you complete it.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux instances managées Azure SQL nommées **mi-tailspin-01** (groupe de ressources RG1) et **mi-tailspin-02** (groupe de ressources RG2) dans la même région. mi-tailspin-01 héberge une base de données nommée RoutesDb.

    Vous devez créer une copie de RoutesDb sur mi-tailspin-02 avec Azure PowerShell. RoutesDb doit rester en ligne et indépendante sur mi-tailspin-01 après l'opération. Vous devez vérifier l'état de l'opération avant de la terminer.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $p = @{
      DatabaseName = "RoutesDb"; InstanceName = "mi-tailspin-01"; ResourceGroupName = "RG1"
      TargetInstanceName = "mi-tailspin-02"; TargetResourceGroupName = "RG2"
    }

    [[start]] @p

    [[status]] @p

    [[complete]] @p
  slots:
    - id: start
      options:
        - { id: st_move, text: Move-AzSqlInstanceDatabase }
        - { id: st_copy, text: Copy-AzSqlInstanceDatabase }
        - { id: st_dbcopy, text: New-AzSqlDatabaseCopy }
    - id: status
      options:
        - { id: ss_lrs, text: Get-AzSqlInstanceDatabaseLogReplay }
        - { id: ss_move, text: Get-AzSqlInstanceDatabaseMoveOperation }
        - { id: ss_copy, text: Get-AzSqlInstanceDatabaseCopyOperation }
    - id: complete
      options:
        - { id: c_copy, text: Complete-AzSqlInstanceDatabaseCopy }
        - { id: c_lrs, text: Complete-AzSqlInstanceDatabaseLogReplay }
        - { id: c_stop, text: Stop-AzSqlInstanceDatabaseMove }
answer:
  values: { start: st_copy, status: ss_copy, complete: c_copy }
explanation:
  correct:
    en: |
      `Copy-AzSqlInstanceDatabase` starts an online copy, which leaves the source database online and independent. `Get-AzSqlInstanceDatabaseCopyOperation` shows the progress until the status is ready for completion, and `Complete-AzSqlInstanceDatabaseCopy` brings the destination database online for read and write workloads.
    fr: |
      `Copy-AzSqlInstanceDatabase` démarre une copie en ligne, qui laisse la base source en ligne et indépendante. `Get-AzSqlInstanceDatabaseCopyOperation` affiche la progression jusqu'à l'état prêt pour la finalisation, et `Complete-AzSqlInstanceDatabaseCopy` met la base de destination en ligne pour les charges de travail en lecture et en écriture.
  options:
    st_move: { en: "A move drops the source database when it completes.", fr: "Un déplacement supprime la base source à la fin de l'opération." }
    st_dbcopy: { en: "New-AzSqlDatabaseCopy copies Azure SQL Database databases, not managed instance databases.", fr: "New-AzSqlDatabaseCopy copie des bases Azure SQL Database, pas des bases d'instance managée." }
    ss_lrs: { en: "This cmdlet monitors Log Replay Service migrations.", fr: "Cette applet de commande surveille les migrations Log Replay Service." }
    ss_move: { en: "This cmdlet reports move operations, not copy operations.", fr: "Cette applet de commande indique les opérations de déplacement, pas de copie." }
    c_lrs: { en: "This cmdlet performs the cutover of a Log Replay Service migration.", fr: "Cette applet de commande effectue le basculement d'une migration Log Replay Service." }
    c_stop: { en: "This cmdlet cancels a move operation and drops the destination database.", fr: "Cette applet de commande annule une opération de déplacement et supprime la base de destination." }
references:
  - title: Copy or move a database - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
