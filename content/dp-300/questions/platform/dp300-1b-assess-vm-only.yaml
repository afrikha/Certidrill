id: dp300-1b-assess-vm-only
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to migrate an application database from SQL Server 2019 to Azure. The preferred target is Azure SQL Managed Instance, unless a requirement can be met only by SQL Server on Azure Virtual Machines.

    Which two requirements can be met only by SQL Server on Azure Virtual Machines?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de migrer une base de données applicative de SQL Server 2019 vers Azure. La cible privilégiée est Azure SQL Managed Instance, sauf si une exigence ne peut être satisfaite que par SQL Server sur les machines virtuelles Azure.

    Quelles sont les deux exigences qui ne peuvent être satisfaites que par SQL Server sur les machines virtuelles Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The database stores documents in a FILESTREAM filegroup.", fr: "La base de données stocke des documents dans un groupe de fichiers FILESTREAM." } }
    - { id: b, text: { en: "SQL Server Agent jobs run Transact-SQL steps every night.", fr: "Des travaux SQL Server Agent exécutent des étapes Transact-SQL chaque nuit." } }
    - { id: c, text: { en: "A third-party monitoring agent must be installed on the operating system of the server.", fr: "Un agent de supervision tiers doit être installé sur le système d'exploitation du serveur." } }
    - { id: d, text: { en: "Stored procedures query a second database on the same instance.", fr: "Des procédures stockées interrogent une deuxième base de données de la même instance." } }
    - { id: e, text: { en: "Stored procedures send alert emails by using Database Mail.", fr: "Des procédures stockées envoient des e-mails d'alerte avec Database Mail." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Azure SQL Managed Instance doesn't support FILESTREAM or FileTable, and a restore fails when the backup contains FILESTREAM data. As a PaaS service, it also gives no access to the operating system. Both requirements point to SQL Server on Azure Virtual Machines.
    fr: "Azure SQL Managed Instance ne prend pas en charge FILESTREAM ni FileTable, et une restauration échoue si la sauvegarde contient des données FILESTREAM. En tant que service PaaS, elle ne donne pas non plus accès au système d'exploitation. Ces deux exigences orientent vers SQL Server sur les machines virtuelles Azure."
  options:
    b: { en: "SQL Server Agent is available and always running in SQL Managed Instance, with Transact-SQL job steps supported.", fr: "SQL Server Agent est disponible et toujours actif dans SQL Managed Instance, avec prise en charge des étapes Transact-SQL." }
    d: { en: "Databases of the same managed instance can be queried together, as on SQL Server.", fr: "Les bases de données d'une même instance managée peuvent être interrogées ensemble, comme sur SQL Server." }
    e: { en: "SQL Managed Instance supports sp_send_dbmail; only file attachments aren't supported.", fr: "SQL Managed Instance prend en charge sp_send_dbmail ; seules les pièces jointes de fichiers ne sont pas prises en charge." }
references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
  - title: "Migration overview: SQL Server to Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/database/sql-server-to-sql-database-overview
