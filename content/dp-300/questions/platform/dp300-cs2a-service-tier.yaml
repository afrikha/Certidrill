id: dp300-cs2a-service-tier
objective: "1.1.1"
type: single
caseStudy: dp300-cs2a-proseware-market
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a service tier for Orders that meets the platform requirements.

    Which service tier should you recommend?
  fr: |
    Vous devez recommander pour Orders un niveau de service qui satisfait les exigences de plateforme.

    Quel niveau de service devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Business Critical", fr: "Business Critical" } }
    - { id: b, text: { en: "General Purpose with serverless compute", fr: "General Purpose avec calcul serverless" } }
    - { id: c, text: { en: "Hyperscale", fr: "Hyperscale" } }
    - { id: d, text: { en: "Premium (DTU purchasing model)", fr: "Premium (modèle d'achat DTU)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Hyperscale stores up to 128 TB per database, so Orders can grow to 15 TB. Its backups and restores are based on file snapshots and do not depend on the database size, and because compute is separated from the page servers that store the data, scaling compute involves no data movement.
    fr: |
      Hyperscale stocke jusqu'à 128 To par base de données : Orders peut donc atteindre 15 To. Ses sauvegardes et restaurations reposent sur des instantanés de fichiers et ne dépendent pas de la taille de la base, et comme le calcul est séparé des serveurs de pages qui stockent les données, la mise à l'échelle du calcul n'entraîne aucun déplacement de données.
  options:
    a: { en: "Business Critical is limited to 4 TB per database, and its restore time grows with the size of the database.", fr: "Business Critical est limité à 4 To par base de données, et sa durée de restauration augmente avec la taille de la base." }
    b: { en: "General Purpose, provisioned or serverless, is limited to 4 TB per database; serverless changes how compute is billed, not the storage limit.", fr: "General Purpose, provisionné ou serverless, est limité à 4 To par base de données ; le serverless change la facturation du calcul, pas la limite de stockage." }
    d: { en: "The Premium DTU tier is also limited to 4 TB per database and restores by copying data, so restore time depends on size.", fr: "Le niveau DTU Premium est lui aussi limité à 4 To par base de données et restaure en copiant les données : la durée de restauration dépend de la taille." }
references:
  - title: What is the Hyperscale service tier? - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale
