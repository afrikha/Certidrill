id: dp300-1a-partition-sliding-window
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL Managed Instance that hosts a database named **MetricsDb**. MetricsDb contains a table named **dbo.Telemetry** with about 3 billion rows. Each row has a **ReadingDate** column.

    At the start of each month, you must load the previous month of data, which is prepared in a staging table, and remove the oldest month from dbo.Telemetry. Both operations must complete in seconds and generate minimal transaction log activity.

    What should you include in the design?
  fr: |
    Vous disposez d'une instance Azure SQL Managed Instance qui héberge une base de données nommée **MetricsDb**. MetricsDb contient une table nommée **dbo.Telemetry** d'environ 3 milliards de lignes. Chaque ligne possède une colonne **ReadingDate**.

    Au début de chaque mois, vous devez charger les données du mois précédent, préparées dans une table de préproduction, et supprimer le mois le plus ancien de dbo.Telemetry. Les deux opérations doivent s'achever en quelques secondes et générer une activité minimale du journal des transactions.

    Que devez-vous inclure dans la conception ?
body:
  options:
    - { id: a, text: { en: "Partition dbo.Telemetry by month on ReadingDate and switch partitions in and out", fr: "Partitionner dbo.Telemetry par mois sur ReadingDate et basculer (SWITCH) des partitions en entrée et en sortie" } }
    - { id: b, text: { en: "Create a SQL Server Agent job that deletes and inserts the rows in batches of 10,000", fr: "Créer un travail SQL Server Agent qui supprime et insère les lignes par lots de 10 000" } }
    - { id: c, text: { en: "Shard dbo.Telemetry across one database per month by using the split-merge tool", fr: "Partitionner horizontalement (sharding) dbo.Telemetry dans une base par mois avec l'outil de fractionnement-fusion" } }
    - { id: d, text: { en: "Create a filtered nonclustered index on ReadingDate for each month", fr: "Créer un index non cluster filtré sur ReadingDate pour chaque mois" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With a table partitioned by month, loading and archiving become partition switches: a staging table with the same structure is switched in, and the oldest partition is switched out to an archive table. A switch changes only metadata, so it completes in seconds whatever the number of rows.
    fr: |
      Avec une table partitionnée par mois, le chargement et l'archivage deviennent des basculements de partition : une table de préproduction de même structure est basculée en entrée, et la partition la plus ancienne est basculée vers une table d'archive. Un basculement ne modifie que des métadonnées : il s'achève en quelques secondes quel que soit le nombre de lignes.
  options:
    b: { en: "Batched DELETE and INSERT statements still move and log every row; with millions of rows per month they take far longer than seconds.", fr: "Des instructions DELETE et INSERT par lots déplacent et journalisent toujours chaque ligne ; avec des millions de lignes par mois, elles prennent bien plus que quelques secondes." }
    c: { en: "Sharding spreads data across databases and requires application routing; it doesn't make loading or removing a month a metadata operation.", fr: "Le sharding répartit les données entre bases et exige un routage applicatif ; il ne fait pas du chargement ou de la suppression d'un mois une opération de métadonnées." }
    d: { en: "Filtered indexes can speed up queries on a month, but the rows must still be inserted and deleted one by one.", fr: "Des index filtrés peuvent accélérer les requêtes sur un mois, mais les lignes doivent toujours être insérées et supprimées une par une." }
references:
  - title: "Partitioned Tables and Indexes - SQL Server, Azure SQL Database, Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes
