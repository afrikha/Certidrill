id: dp300-1a-shard-multitenant
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam offers a free and a standard edition of a SaaS application on Azure SQL Database. The free edition has 20,000 small tenants, each with less than 50 MB of data and a few queries per day. Their total data is expected to grow by several terabytes per year.

    The free-edition solution must meet the following requirements:

    - Minimize the cost per tenant.
    - Ensure that a session for one tenant can read only the rows of that tenant.
    - Allow a tenant that upgrades to the standard edition to be moved to its own database.

    What should you recommend for the free edition?
  fr: |
    Fabrikam propose une édition gratuite et une édition standard d'une application SaaS sur Azure SQL Database. L'édition gratuite compte 20 000 petits locataires, chacun avec moins de 50 Mo de données et quelques requêtes par jour. Leur volume total de données devrait croître de plusieurs téraoctets par an.

    La solution de l'édition gratuite doit satisfaire aux exigences suivantes :

    - Réduire au minimum le coût par locataire.
    - Garantir qu'une session d'un locataire ne peut lire que les lignes de ce locataire.
    - Permettre de déplacer dans sa propre base un locataire qui passe à l'édition standard.

    Que devez-vous recommander pour l'édition gratuite ?
body:
  options:
    - { id: a, text: { en: "One database per tenant in elastic pools, and the split-merge tool to move upgraded tenants", fr: "Une base par locataire dans des pools élastiques, et l'outil de fractionnement-fusion pour déplacer les locataires mis à niveau" } }
    - { id: b, text: { en: "One General Purpose database that contains every tenant, with a table partitioned on TenantId", fr: "Une seule base General Purpose qui contient tous les locataires, avec une table partitionnée sur TenantId" } }
    - { id: c, text: { en: "Multitenant shards that store a TenantId in every row, with row-level security and the split-merge tool to move upgraded tenants", fr: "Des shards multilocataires qui stockent un TenantId dans chaque ligne, avec la sécurité au niveau des lignes et l'outil de fractionnement-fusion pour déplacer les locataires mis à niveau" } }
    - { id: d, text: { en: "One serverless database per tenant, each configured to pause automatically after one hour", fr: "Une base serverless par locataire, chacune configurée pour se suspendre automatiquement après une heure" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In multitenant sharding, every row carries the tenant key, so many small tenants share each database and the cost per tenant stays low. Row-level security filters the rows a session can see, and the split-merge tool moves a tenant from a multitenant database to a single-tenant database when it upgrades. Adding shards absorbs the data growth.
    fr: |
      Dans le sharding multilocataire, chaque ligne porte la clé du locataire : de nombreux petits locataires partagent chaque base et le coût par locataire reste faible. La sécurité au niveau des lignes filtre les lignes visibles par une session, et l'outil de fractionnement-fusion déplace un locataire d'une base multilocataire vers une base monolocataire lors de sa mise à niveau. L'ajout de shards absorbe la croissance des données.
  options:
    a: { en: "20,000 databases, even pooled, cost far more per tenant than shared multitenant databases for tenants this small.", fr: "20 000 bases, même dans des pools, coûtent bien plus par locataire que des bases multilocataires partagées pour des locataires aussi petits." }
    b: { en: "A single General Purpose database is limited to 4 TB, so it can't absorb several terabytes of growth per year; partitioning doesn't restrict which rows a session reads.", fr: "Une seule base General Purpose est limitée à 4 To : elle ne peut pas absorber plusieurs téraoctets de croissance par an ; le partitionnement ne limite pas les lignes lues par une session." }
    d: { en: "Serverless databases bill storage even while paused and each database has a minimum compute while active; 20,000 of them don't minimize the cost per tenant.", fr: "Les bases serverless facturent le stockage même en pause et chaque base a un calcul minimal quand elle est active ; 20 000 bases ne réduisent pas le coût par locataire." }
references:
  - title: "Scaling out - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-scale-introduction
