id: dp300-1a-partition-range-default
objective: "1.1.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A colleague proposes the following partition function and partition scheme for a table named **dbo.Readings** in an Azure SQL database. The table is partitioned on its **ReadingDate** column, of type `date`.

    ```sql
    CREATE PARTITION FUNCTION pfReadings (date)
        AS RANGE FOR VALUES ('2026-01-01', '2026-02-01', '2026-03-01');

    CREATE PARTITION SCHEME psReadings
        AS PARTITION pfReadings ALL TO ([PRIMARY]);
    ```

    The partitions that the design creates are shown in the following table. Answer each prompt by selecting the partition that would store the row.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un collègue propose la fonction de partition et le schéma de partition suivants pour une table nommée **dbo.Readings** dans une base de données Azure SQL. La table est partitionnée sur sa colonne **ReadingDate**, de type `date`.

    ```sql
    CREATE PARTITION FUNCTION pfReadings (date)
        AS RANGE FOR VALUES ('2026-01-01', '2026-02-01', '2026-03-01');

    CREATE PARTITION SCHEME psReadings
        AS PARTITION pfReadings ALL TO ([PRIMARY]);
    ```

    Les partitions créées par cette conception figurent dans le tableau suivant. Répondez à chaque consigne en sélectionnant la partition qui stockerait la ligne.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A row whose ReadingDate is 2026-01-01", fr: "Une ligne dont ReadingDate vaut 2026-01-01" }
    - id: p2
      text: { en: "A row whose ReadingDate is 2026-02-15", fr: "Une ligne dont ReadingDate vaut 2026-02-15" }
  grid:
    header: [{ en: "Partition number", fr: "Numéro de partition" }, { en: "Filegroup", fr: "Groupe de fichiers" }]
    rows:
      - [{ text: "1", area: part1 }, { text: PRIMARY }]
      - [{ text: "2", area: part2 }, { text: PRIMARY }]
      - [{ text: "3", area: part3 }, { text: PRIMARY }]
      - [{ text: "4", area: part4 }, { text: PRIMARY }]
answer:
  values: { p1: part1, p2: part3 }
explanation:
  correct:
    en: |
      The function specifies neither LEFT nor RIGHT, so it uses the default, RANGE LEFT: each boundary value belongs to the partition on its left. Partition 1 holds dates up to and including 2026-01-01, partition 2 dates after 2026-01-01 up to 2026-02-01, partition 3 dates after 2026-02-01 up to 2026-03-01, and partition 4 later dates. A row dated 2026-01-01 goes to partition 1 and a row dated 2026-02-15 to partition 3. For calendar-month partitions with first-of-month boundaries, RANGE RIGHT must be written explicitly.
    fr: |
      La fonction ne précise ni LEFT ni RIGHT : elle utilise la valeur par défaut, RANGE LEFT, et chaque valeur limite appartient à la partition située à sa gauche. La partition 1 contient les dates jusqu'au 2026-01-01 inclus, la partition 2 les dates après le 2026-01-01 jusqu'au 2026-02-01, la partition 3 les dates après le 2026-02-01 jusqu'au 2026-03-01, et la partition 4 les dates ultérieures. Une ligne du 2026-01-01 va dans la partition 1 et une ligne du 2026-02-15 dans la partition 3. Pour des partitions par mois civil avec des limites au premier du mois, il faut écrire RANGE RIGHT explicitement.
references:
  - title: "CREATE PARTITION FUNCTION (Transact-SQL) - SQL Server"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-partition-function-transact-sql
