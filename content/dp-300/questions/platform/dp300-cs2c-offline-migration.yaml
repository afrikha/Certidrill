id: dp300-cs2c-offline-migration
objective: "1.3.4"
type: single
caseStudy: dp300-cs2c-adatum-learning
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a method to migrate Enrollment and Grades to sql-adl-weu that meets the migration requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une méthode de migration d'Enrollment et de Grades vers sql-adl-weu qui satisfait les exigences de migration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Export each database to a BACPAC file by using SqlPackage, and then import the files into sql-adl-weu.", fr: "Exporter chaque base de données dans un fichier BACPAC à l'aide de SqlPackage, puis importer les fichiers dans sql-adl-weu." } }
    - { id: b, text: { en: "Back up each database to an Azure Blob Storage container, and then restore the backups to sql-adl-weu from URL.", fr: "Sauvegarder chaque base de données dans un conteneur Stockage Blob Azure, puis restaurer les sauvegardes sur sql-adl-weu à partir de l'URL." } }
    - { id: c, text: { en: "Run an offline migration in Azure Database Migration Service, with a self-hosted integration runtime that can reach SQLEDU1.", fr: "Exécuter une migration hors connexion dans Azure Database Migration Service, avec un runtime d'intégration auto-hébergé qui peut atteindre SQLEDU1." } }
    - { id: d, text: { en: "Upload full and log backups of each database to Azure Blob Storage, and then restore them by using Log Replay Service.", fr: "Charger les sauvegardes complètes et de journaux de chaque base de données dans Stockage Blob Azure, puis les restaurer à l'aide de Log Replay Service." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Database Migration Service supports offline migrations from SQL Server to Azure SQL Database; online migrations to this target are not available, which is acceptable here because the portal is closed for the weekend. The service can deploy the missing schema and then copies the table data from the source to the target through the self-hosted integration runtime, without writing the data to backup or BACPAC files.
    fr: |
      Azure Database Migration Service prend en charge les migrations hors connexion de SQL Server vers Azure SQL Database ; les migrations en ligne vers cette cible ne sont pas disponibles, ce qui est acceptable ici car le portail est fermé pendant le week-end. Le service peut déployer le schéma manquant, puis copie les données des tables de la source vers la cible par le runtime d'intégration auto-hébergé, sans écrire les données dans des fichiers de sauvegarde ou BACPAC.
  options:
    a: { en: "A BACPAC file is a copy of the schema and the data, which the data protection policy forbids during the migration.", fr: "Un fichier BACPAC est une copie du schéma et des données, ce que la stratégie de protection des données interdit pendant la migration." }
    b: { en: "Azure SQL Database cannot restore native SQL Server backups, and backup files would be copies of the student data.", fr: "Azure SQL Database ne peut pas restaurer de sauvegardes SQL Server natives, et les fichiers de sauvegarde seraient des copies des données des étudiants." }
    d: { en: "Log Replay Service restores backups to Azure SQL Managed Instance only, and it also relies on backup files.", fr: "Log Replay Service restaure des sauvegardes uniquement sur Azure SQL Managed Instance, et il repose lui aussi sur des fichiers de sauvegarde." }
references:
  - title: "Tutorial: Migrate SQL Server to Azure SQL Database (Offline) - Azure Database Migration Service"
    url: https://learn.microsoft.com/en-us/data-migration/sql-server/database/database-migration-service
