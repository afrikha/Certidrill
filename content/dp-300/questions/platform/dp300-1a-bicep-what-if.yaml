id: dp300-1a-bicep-what-if
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You manage a Bicep file named **main.bicep** that deploys the Azure SQL Database resources of a resource group named **RG-SQL-Prod**. A developer changed the compute size and the backup storage redundancy in the file.

    Before the pipeline deploys the file, the change approver must see which resources would be created and which properties would be modified. No change must be made to the existing resources during the review.

    Which command should the pipeline run?
  fr: |
    Vous gérez un fichier Bicep nommé **main.bicep** qui déploie les ressources Azure SQL Database d'un groupe de ressources nommé **RG-SQL-Prod**. Un développeur a modifié la taille de calcul et la redondance du stockage de sauvegarde dans le fichier.

    Avant que le pipeline déploie le fichier, l'approbateur doit voir quelles ressources seraient créées et quelles propriétés seraient modifiées. Aucune modification ne doit être apportée aux ressources existantes pendant la revue.

    Quelle commande le pipeline doit-il exécuter ?
body:
  options:
    - { id: a, text: "az deployment group validate --resource-group RG-SQL-Prod --template-file main.bicep" }
    - { id: b, text: "az bicep build --file main.bicep" }
    - { id: c, text: "az deployment group what-if --resource-group RG-SQL-Prod --template-file main.bicep" }
    - { id: d, text: "az deployment group create --resource-group RG-SQL-Prod --template-file main.bicep --mode Complete" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The what-if operation predicts the changes that a deployment of the Bicep file would make, listing each resource with a change type such as Create, Modify or NoChange, and the property-level differences. It doesn't change any existing resource.
    fr: |
      L'opération what-if prédit les modifications qu'apporterait le déploiement du fichier Bicep, en listant chaque ressource avec un type de modification comme Create, Modify ou NoChange, ainsi que les différences au niveau des propriétés. Elle ne modifie aucune ressource existante.
  options:
    a: { en: "Validation checks whether the template would be accepted by Resource Manager; it doesn't list the resources and properties that would change.", fr: "La validation vérifie si le modèle serait accepté par Resource Manager ; elle ne liste pas les ressources et propriétés qui changeraient." }
    b: { en: "az bicep build only transpiles the Bicep file into an ARM JSON template; it doesn't compare it with Azure.", fr: "az bicep build ne fait que transpiler le fichier Bicep en modèle ARM JSON ; il ne le compare pas à Azure." }
    d: { en: "This command performs the deployment, and complete mode can also delete resources that aren't in the file.", fr: "Cette commande effectue le déploiement, et le mode complet peut aussi supprimer des ressources absentes du fichier." }
references:
  - title: "Bicep What-If: Preview Changes Before Deployment - Azure Resource Manager"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
