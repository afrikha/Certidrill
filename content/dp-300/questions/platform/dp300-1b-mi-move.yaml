id: dp300-1b-mi-move
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have two Azure SQL managed instances named **MI1** and **MI2** in the West Europe region. MI1 hosts a database named BillingDb. The instances can communicate with each other.

    You need to relocate BillingDb from MI1 to MI2. The solution must keep BillingDb online during the data transfer, must not lose any transaction, and must remove BillingDb from MI1 when the operation completes.

    What should you use?
  fr: |
    Vous disposez de deux instances managées Azure SQL nommées **MI1** et **MI2** dans la région West Europe. MI1 héberge une base de données nommée BillingDb. Les instances peuvent communiquer entre elles.

    Vous devez transférer BillingDb de MI1 vers MI2. La solution doit garder BillingDb en ligne pendant le transfert des données, ne doit perdre aucune transaction et doit supprimer BillingDb de MI1 à la fin de l'opération.

    Qu'est-ce que vous devez utiliser ?
body:
  options:
    - { id: a, text: { en: "A database copy operation", fr: "Une opération de copie de base de données" } }
    - { id: b, text: { en: "A failover group between MI1 and MI2", fr: "Un groupe de basculement entre MI1 et MI2" } }
    - { id: c, text: { en: "A cross-instance point-in-time restore", fr: "Une restauration à un point dans le temps entre instances" } }
    - { id: d, text: { en: "A database move operation", fr: "Une opération de déplacement de base de données" } }
answer: { optionId: d }
explanation:
  correct:
    en: A database move replicates the database online from one managed instance to another in the same region by using Always On availability group technology. When you complete it, the source stops accepting workloads, the final transactions are replicated, and the source database is dropped, with no data loss by design.
    fr: Un déplacement de base de données réplique la base en ligne d'une instance managée vers une autre de la même région, avec la technologie des groupes de disponibilité Always On. Quand vous le terminez, la source cesse d'accepter des charges de travail, les dernières transactions sont répliquées et la base source est supprimée, sans perte de données par conception.
  options:
    a: { en: "A copy leaves the source database online and independent; it isn't removed from MI1.", fr: "Une copie laisse la base source en ligne et indépendante ; elle n'est pas supprimée de MI1." }
    b: { en: "Failover groups replicate all user databases to a secondary instance for disaster recovery, usually in another region; they don't relocate one database.", fr: "Les groupes de basculement répliquent toutes les bases utilisateur vers une instance secondaire pour la reprise d'activité, en général dans une autre région ; ils ne transfèrent pas une seule base." }
    c: { en: "A point-in-time restore loses the transactions made after the restore point and doesn't remove the source.", fr: "Une restauration à un point dans le temps perd les transactions postérieures au point de restauration et ne supprime pas la source." }
references:
  - title: Copy or move a database - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
