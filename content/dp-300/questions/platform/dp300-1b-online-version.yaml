id: dp300-1b-online-version
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an on-premises server that runs SQL Server 2014 Enterprise and hosts a 2 TB database named **ClaimsDb**. ClaimsDb uses the full recovery model.

    You plan to migrate ClaimsDb to an Azure SQL managed instance in the General Purpose tier. The application can be unavailable for at most 15 minutes. Full, differential and log backups of ClaimsDb can be copied to Azure Blob Storage.

    Which migration method should you use?
  fr: |
    Vous disposez d'un serveur local qui exécute SQL Server 2014 Enterprise et héberge une base de données de 2 To nommée **ClaimsDb**. ClaimsDb utilise le mode de récupération complet.

    Vous prévoyez de migrer ClaimsDb vers une instance managée Azure SQL du niveau General Purpose. L'application peut être indisponible au maximum 15 minutes. Les sauvegardes complètes, différentielles et de journal de ClaimsDb peuvent être copiées vers Stockage Blob Azure.

    Quelle méthode de migration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Managed Instance link", fr: "Le lien Managed Instance (Managed Instance link)" } }
    - { id: b, text: { en: "A native full backup to URL, followed by RESTORE FROM URL", fr: "Une sauvegarde complète native vers une URL, suivie d'un RESTORE FROM URL" } }
    - { id: c, text: { en: "A BACPAC export, followed by an import with SqlPackage", fr: "Une exportation BACPAC, suivie d'une importation avec SqlPackage" } }
    - { id: d, text: { en: "Log Replay Service (LRS) in continuous mode", fr: "Log Replay Service (LRS) en mode continu" } }
answer: { optionId: d }
explanation:
  correct:
    en: Log Replay Service supports SQL Server 2008 to 2022 sources and restores full, differential and log backups from Blob Storage while the source stays in use. In continuous mode, it keeps applying new log backups, so the downtime is limited to the tail-log backup and the cutover.
    fr: Log Replay Service prend en charge les sources SQL Server 2008 à 2022 et restaure les sauvegardes complètes, différentielles et de journal depuis Stockage Blob pendant que la source reste utilisée. En mode continu, il applique les nouvelles sauvegardes de journal au fil de l'eau ; le temps d'arrêt se limite donc à la sauvegarde de la fin du journal et au basculement.
  options:
    a: { en: "The Managed Instance link requires SQL Server 2016 or later; SQL Server 2014 isn't supported.", fr: "Le lien Managed Instance exige SQL Server 2016 ou ultérieur ; SQL Server 2014 n'est pas pris en charge." }
    b: { en: "A single full backup and restore is offline: the downtime covers the backup and restore of 2 TB.", fr: "Une sauvegarde complète unique suivie d'une restauration est hors connexion : le temps d'arrêt couvre la sauvegarde et la restauration de 2 To." }
    c: { en: "A BACPAC export and import is offline and slow for 2 TB, far beyond 15 minutes.", fr: "Une exportation et une importation BACPAC sont hors connexion et lentes pour 2 To, bien au-delà de 15 minutes." }
references:
  - title: "Migration overview: SQL Server to Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/managed-instance/sql-server-to-managed-instance-overview
  - title: Overview of Log Replay Service with Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-overview
