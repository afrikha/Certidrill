id: dp300-1a-cli-mi-create
objective: "1.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to deploy an Azure SQL managed instance named **mi-fabrikam** by using the Azure CLI. The instance must meet the following requirements:

    - Support In-Memory OLTP and provide a built-in readable secondary replica.
    - Use the company's existing SQL Server Enterprise licenses that are covered by Software Assurance.
    - Clients inside the virtual network must connect directly to the node that hosts the database, for the lowest latency.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez déployer une instance Azure SQL Managed Instance nommée **mi-fabrikam** avec Azure CLI. L'instance doit satisfaire aux exigences suivantes :

    - Prendre en charge In-Memory OLTP et fournir un réplica secondaire intégré accessible en lecture.
    - Utiliser les licences SQL Server Enterprise existantes de l'entreprise, couvertes par Software Assurance.
    - Les clients situés dans le réseau virtuel doivent se connecter directement au nœud qui héberge la base de données, pour la latence la plus faible.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql mi create --resource-group RG1 --name mi-fabrikam --location westeurope \
      --admin-user miadmin --admin-password "<password>" \
      --subnet "<subnet resource ID>" \
      --edition [[ed]] --family Gen5 --capacity 8 --storage 512GB \
      --license-type [[lic]] --proxy-override [[proxy]]
  slots:
    - id: ed
      options:
        - { id: gp, text: GeneralPurpose }
        - { id: bc, text: BusinessCritical }
    - id: lic
      options:
        - { id: base, text: BasePrice }
        - { id: incl, text: LicenseIncluded }
    - id: proxy
      options:
        - { id: proxy, text: Proxy }
        - { id: redirect, text: Redirect }
answer:
  values: { ed: bc, lic: base, proxy: redirect }
explanation:
  correct:
    en: |
      In-Memory OLTP and a built-in readable secondary replica exist only in the Business Critical tier of Managed Instance. BasePrice applies Azure Hybrid Benefit, so you pay only the base compute price with your Software Assurance licenses. The Redirect connection type sends clients directly to the node that hosts the database instead of through the gateway, which gives better latency and throughput.
    fr: |
      In-Memory OLTP et un réplica secondaire intégré accessible en lecture n'existent qu'au niveau Business Critical de Managed Instance. BasePrice applique Azure Hybrid Benefit : vous ne payez que le prix de base du calcul avec vos licences Software Assurance. Le type de connexion Redirect envoie les clients directement vers le nœud qui héberge la base au lieu de passer par la passerelle, ce qui améliore la latence et le débit.
  options:
    gp: { en: "General Purpose has no In-Memory OLTP and no readable secondary replica.", fr: "General Purpose n'a ni In-Memory OLTP ni réplica secondaire accessible en lecture." }
    incl: { en: "LicenseIncluded pays for the SQL Server license in the hourly price, ignoring the existing licenses.", fr: "LicenseIncluded paie la licence SQL Server dans le prix horaire, sans tenir compte des licences existantes." }
    proxy: { en: "Proxy routes every connection through the gateway, which adds latency.", fr: "Proxy fait passer chaque connexion par la passerelle, ce qui ajoute de la latence." }
references:
  - title: "az sql mi"
    url: https://learn.microsoft.com/en-us/cli/azure/sql/mi?view=azure-cli-latest
  - title: "Connection Types - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/connection-types-overview
