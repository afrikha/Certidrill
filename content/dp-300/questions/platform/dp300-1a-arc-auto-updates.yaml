id: dp300-1a-arc-auto-updates
objective: "1.1.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware has the following on-premises servers connected to Azure Arc. Each server hosts one SQL Server 2022 instance.

    | Server | Operating system | SQL Server license type |
    | --- | --- | --- |
    | HOST1 | Windows Server 2022 | Pay-as-you-go |
    | HOST2 | Ubuntu 20.04 | Pay-as-you-go |
    | HOST3 | Windows Server 2019 | License only |

    You plan to use the automatic updates feature of SQL Server enabled by Azure Arc.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose des serveurs locaux suivants connectés à Azure Arc. Chaque serveur héberge une instance SQL Server 2022.

    | Serveur | Système d'exploitation | Type de licence SQL Server |
    | --- | --- | --- |
    | HOST1 | Windows Server 2022 | Paiement à l'utilisation |
    | HOST2 | Ubuntu 20.04 | Paiement à l'utilisation |
    | HOST3 | Windows Server 2019 | License only |

    Vous prévoyez d'utiliser la fonctionnalité de mises à jour automatiques de SQL Server activé par Azure Arc.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On HOST1, automatic updates install Windows and SQL Server updates marked Important or Critical during the maintenance window.", fr: "Sur HOST1, les mises à jour automatiques installent les mises à jour Windows et SQL Server marquées Important ou Critical pendant la fenêtre de maintenance." } }
    - { id: b, text: { en: "On HOST1, automatic updates install every SQL Server cumulative update, whatever its classification.", fr: "Sur HOST1, les mises à jour automatiques installent chaque mise à jour cumulative de SQL Server, quelle que soit sa classification." } }
    - { id: c, text: { en: "On HOST2, you can enable automatic updates because its license type is pay-as-you-go.", fr: "Sur HOST2, vous pouvez activer les mises à jour automatiques, car son type de licence est le paiement à l'utilisation." } }
    - { id: d, text: { en: "On HOST3, the license type must be changed to Software Assurance or pay-as-you-go before automatic updates can be enabled.", fr: "Sur HOST3, le type de licence doit passer à Software Assurance ou au paiement à l'utilisation avant de pouvoir activer les mises à jour automatiques." } }
    - { id: e, text: { en: "On HOST1, you can enable automatic updates for the SQL Server instance without affecting other updates of the host operating system.", fr: "Sur HOST1, vous pouvez activer les mises à jour automatiques pour l'instance SQL Server sans affecter les autres mises à jour du système d'exploitation hôte." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Automatic updates of Arc-enabled SQL Server configure Windows Update and Microsoft Update on the host and apply Windows and SQL Server updates marked Important or Critical, only during the maintenance window. They apply only to servers covered by Software Assurance or pay-as-you-go; with the License only type, the option is disabled until the license type changes.
    fr: |
      Les mises à jour automatiques de SQL Server activé par Arc configurent Windows Update et Microsoft Update sur l'hôte et appliquent les mises à jour Windows et SQL Server marquées Important ou Critical, uniquement pendant la fenêtre de maintenance. Elles ne s'appliquent qu'aux serveurs couverts par Software Assurance ou le paiement à l'utilisation ; avec le type License only, l'option est désactivée jusqu'au changement de type de licence.
  options:
    b: { en: "Cumulative updates that aren't marked Important or Critical must be installed manually.", fr: "Les mises à jour cumulatives non marquées Important ou Critical doivent être installées manuellement." }
    c: { en: "Automatic updates currently work only on Windows hosts, whatever the license type.", fr: "Les mises à jour automatiques ne fonctionnent actuellement que sur des hôtes Windows, quel que soit le type de licence." }
    e: { en: "Automatic updates work at the level of the host operating system and apply Windows updates too, to all installed SQL Server instances.", fr: "Les mises à jour automatiques agissent au niveau du système d'exploitation hôte et appliquent aussi les mises à jour Windows, à toutes les instances SQL Server installées." }
references:
  - title: "Configure Automatic Updates - SQL Server enabled by Azure Arc"
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/update
