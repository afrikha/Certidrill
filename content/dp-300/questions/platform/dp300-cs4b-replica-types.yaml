id: dp300-cs4b-replica-types
objective: "1.2.1"
type: dragdrop
caseStudy: dp300-cs4b-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You need to identify which type of Hyperscale secondary replica meets each requirement for TicketsDB.

    Which replica type should you use for each requirement? To answer, drag the appropriate replica types to the correct requirements. Each replica type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez identifier le type de réplica secondaire Hyperscale qui satisfait chaque exigence de TicketsDB.

    Quel type de réplica devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types de réplicas appropriés vers les exigences correctes. Chaque type de réplica peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: i_ha
      text: { en: "High availability replica", fr: "Réplica de haute disponibilité" }
    - id: i_named
      text: { en: "Named replica", fr: "Réplica nommé" }
    - id: i_geo
      text: { en: "Geo-replica", fr: "Géoréplica" }
    - id: i_copy
      text: { en: "Database copy", fr: "Copie de base de données" }
  targets:
    - id: t_partner
      text: { en: "Requirement 1: Proseware queries", fr: "Exigence 1 : requêtes de Proseware" }
    - id: t_local
      text: { en: "Requirement 2: automatic failover within North Europe", fr: "Exigence 2 : basculement automatique au sein de North Europe" }
    - id: t_dr
      text: { en: "Requirement 3: readable secondary in West Europe", fr: "Exigence 3 : secondaire accessible en lecture dans West Europe" }
answer:
  mapping: { t_partner: i_named, t_local: i_ha, t_dr: i_geo }
explanation:
  correct:
    en: |
      A named replica shares the page servers of the primary, has its own service level objective and can be placed on another logical server in the same region, with its own logins, which isolates the Proseware workload. High availability replicas always have the same size as the primary and are the automatic hot-standby failover targets. A geo-replica, created on a logical server such as sql-rc-dr in another region, is readable and is used for disaster recovery.
    fr: |
      Un réplica nommé partage les serveurs de pages du primaire, possède son propre objectif de niveau de service et peut être placé sur un autre serveur logique de la même région, avec ses propres connexions, ce qui isole la charge de travail de Proseware. Les réplicas de haute disponibilité ont toujours la même taille que le primaire et sont les cibles de basculement automatique en attente à chaud. Un géoréplica, créé sur un serveur logique tel que sql-rc-dr dans une autre région, est accessible en lecture et sert à la reprise d'activité.
  options:
    i_copy: { en: "A database copy is a point-in-time, independent read-write database; it doesn't stay synchronized with TicketsDB and doesn't fail over.", fr: "Une copie de base de données est une base indépendante en lecture-écriture, figée à un instant donné ; elle ne reste pas synchronisée avec TicketsDB et ne bascule pas." }
references:
  - title: Hyperscale secondary replicas - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale-replicas
