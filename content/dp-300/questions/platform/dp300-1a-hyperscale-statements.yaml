id: dp300-1a-hyperscale-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Last week, you converted an Azure SQL Database database named **CatalogDb** from the General Purpose service tier to the Hyperscale service tier. You are planning how to scale CatalogDb for read-heavy workloads.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    La semaine dernière, vous avez converti une base de données Azure SQL Database nommée **CatalogDb** du niveau de service General Purpose au niveau de service Hyperscale. Vous planifiez la mise à l'échelle de CatalogDb pour des charges à forte proportion de lectures.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add up to 30 named replicas to CatalogDb for read scale-out workloads.
        fr: Vous pouvez ajouter jusqu'à 30 réplicas nommés à CatalogDb pour des charges de scale-out en lecture.
    - id: s2
      text:
        en: If Hyperscale doesn't meet expectations, you can reverse migrate CatalogDb directly to the Business Critical service tier.
        fr: Si Hyperscale ne donne pas satisfaction, vous pouvez effectuer une migration inverse de CatalogDb directement vers le niveau de service Business Critical.
    - id: s3
      text:
        en: You can configure CatalogDb with four high availability secondary replicas.
        fr: Vous pouvez configurer CatalogDb avec quatre réplicas secondaires de haute disponibilité.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A Hyperscale database supports up to 30 named replicas and from 0 to 4 high availability secondary replicas. A database that was migrated to Hyperscale can be reverse migrated only to General Purpose, within 45 days; to reach Business Critical, you reverse migrate to General Purpose first and then change the tier.
    fr: |
      Une base Hyperscale prend en charge jusqu'à 30 réplicas nommés et de 0 à 4 réplicas secondaires de haute disponibilité. Une base migrée vers Hyperscale ne peut faire l'objet d'une migration inverse que vers General Purpose, dans les 45 jours ; pour arriver à Business Critical, vous revenez d'abord à General Purpose, puis vous changez de niveau.
references:
  - title: "What is the Hyperscale service tier? - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale
