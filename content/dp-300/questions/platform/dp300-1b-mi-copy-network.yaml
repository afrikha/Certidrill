id: dp300-1b-mi-copy-network
objective: "1.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure SQL managed instances in the North Europe region:

    | Instance | Virtual network | Subnet |
    | --- | --- | --- |
    | MI1 | VNet1 | snet-mi1 |
    | MI2 | VNet2 | snet-mi2 |

    VNet1 and VNet2 have no connectivity to each other. Both instances are in the same subscription, and neither is part of a failover group.

    You need to copy a database named HRDb from MI1 to MI2 by using the database copy feature.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux instances managées Azure SQL dans la région North Europe :

    | Instance | Réseau virtuel | Sous-réseau |
    | --- | --- | --- |
    | MI1 | VNet1 | snet-mi1 |
    | MI2 | VNet2 | snet-mi2 |

    VNet1 et VNet2 n'ont aucune connectivité entre eux. Les deux instances sont dans le même abonnement, et aucune ne fait partie d'un groupe de basculement.

    Vous devez copier une base de données nommée HRDb de MI1 vers MI2 à l'aide de la fonctionnalité de copie de base de données.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the public endpoint on both instances and allow TCP port 3342.", fr: "Activer le point de terminaison public sur les deux instances et autoriser le port TCP 3342." } }
    - { id: b, text: { en: "Peer VNet1 and VNet2.", fr: "Configurer un peering entre VNet1 et VNet2." } }
    - { id: c, text: { en: "Create a failover group that contains MI1 and MI2.", fr: "Créer un groupe de basculement qui contient MI1 et MI2." } }
    - { id: d, text: { en: "Allow inbound and outbound TCP traffic on port 5022 and ports 11000-11999 on snet-mi1 and snet-mi2.", fr: "Autoriser le trafic TCP entrant et sortant sur le port 5022 et les ports 11000-11999 sur snet-mi1 et snet-mi2." } }
    - { id: e, text: { en: "Allow inbound and outbound TCP traffic on ports 1433 and 3342 on snet-mi2 only.", fr: "Autoriser le trafic TCP entrant et sortant sur les ports 1433 et 3342 sur snet-mi2 uniquement." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: When the instances are in different virtual networks, copy and move need network connectivity between them, for example virtual network peering, and inbound and outbound TCP traffic on port 5022 and the range 11000-11999 on both subnets. The data is replicated with Always On availability group technology over these ports.
    fr: Quand les instances sont dans des réseaux virtuels différents, la copie et le déplacement exigent une connectivité réseau entre eux, par exemple un peering de réseaux virtuels, et le trafic TCP entrant et sortant sur le port 5022 et la plage 11000-11999 sur les deux sous-réseaux. Les données sont répliquées avec la technologie des groupes de disponibilité Always On sur ces ports.
  options:
    a: { en: "The public endpoint serves client connections; copy and move replicate through the instances' virtual networks.", fr: "Le point de terminaison public sert aux connexions clientes ; la copie et le déplacement répliquent via les réseaux virtuels des instances." }
    c: { en: "Copy and move aren't supported when the source or destination is part of a failover group.", fr: "La copie et le déplacement ne sont pas pris en charge lorsque la source ou la destination fait partie d'un groupe de basculement." }
    e: { en: "Ports 1433 and 3342 serve client connections; replication needs 5022 and 11000-11999 on both subnets.", fr: "Les ports 1433 et 3342 servent aux connexions clientes ; la réplication exige 5022 et 11000-11999 sur les deux sous-réseaux." }
references:
  - title: Copy or move a database - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
