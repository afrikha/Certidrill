id: dp300-1a-deploy-statements
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Bicep file named **main.bicep** that deploys a logical server named **sql-tailspin-test** and a database named **OrdersDb** to a resource group named **RG1**. The file declares the following parameter for the server administrator password:

    ```bicep
    @secure()
    param adminPassword string
    ```

    The file was deployed once successfully. The file and the parameter values haven't changed since.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un fichier Bicep nommé **main.bicep** qui déploie un serveur logique nommé **sql-tailspin-test** et une base de données nommée **OrdersDb** dans un groupe de ressources nommé **RG1**. Le fichier déclare le paramètre suivant pour le mot de passe de l'administrateur du serveur :

    ```bicep
    @secure()
    param adminPassword string
    ```

    Le fichier a été déployé une fois avec succès. Ni le fichier ni les valeurs des paramètres n'ont changé depuis.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you deploy main.bicep to RG1 again in the default deployment mode, Resource Manager creates a second copy of OrdersDb.
        fr: Si vous déployez à nouveau main.bicep dans RG1 avec le mode de déploiement par défaut, Resource Manager crée une deuxième copie d'OrdersDb.
    - id: s2
      text:
        en: The value passed for adminPassword is saved in the deployment history of RG1.
        fr: La valeur transmise pour adminPassword est enregistrée dans l'historique de déploiement de RG1.
    - id: s3
      text:
        en: You can deploy main.bicep to RG1 by running the New-AzResourceGroupDeployment cmdlet.
        fr: Vous pouvez déployer main.bicep dans RG1 en exécutant la cmdlet New-AzResourceGroupDeployment.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      The default mode is incremental: a resource that already exists with unchanged settings is left as is, so no duplicate is created. A parameter decorated with @secure() isn't saved to the deployment history and isn't logged. Azure PowerShell deploys Bicep files to a resource group with New-AzResourceGroupDeployment, as the Azure CLI does with az deployment group create.
    fr: |
      Le mode par défaut est incrémentiel : une ressource qui existe déjà avec des paramètres inchangés est laissée telle quelle, aucun doublon n'est créé. Un paramètre décoré avec @secure() n'est pas enregistré dans l'historique de déploiement et n'est pas journalisé. Azure PowerShell déploie des fichiers Bicep dans un groupe de ressources avec New-AzResourceGroupDeployment, comme Azure CLI avec az deployment group create.
references:
  - title: "Deployment modes - Azure Resource Manager"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-modes
  - title: "Parameters in Bicep files - Azure Resource Manager"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameters
