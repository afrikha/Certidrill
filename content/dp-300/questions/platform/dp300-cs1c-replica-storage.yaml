id: dp300-cs1c-replica-storage
objective: "1.2.3"
type: dragdrop
caseStudy: dp300-cs1c-litware-energy
difficulty: 1
status: draft
stem:
  en: |
    You need to configure the storage of SQLVM3 to meet the data management requirements.

    What should you configure for each component? To answer, drag the appropriate settings to the correct components. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer le stockage de SQLVM3 pour satisfaire les exigences de gestion des données.

    Que devez-vous configurer pour chaque composant ? Pour répondre, faites glisser les paramètres appropriés vers les composants correspondants. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ro, text: { en: "Host caching: Read-only", fr: "Mise en cache de l'hôte : Read-only" } }
    - { id: none, text: { en: "Host caching: None", fr: "Mise en cache de l'hôte : None" } }
    - { id: rw, text: { en: "Host caching: Read/write", fr: "Mise en cache de l'hôte : Read/write" } }
    - { id: temp, text: { en: "The local temporary SSD (D:)", fr: "Le SSD temporaire local (D:)" } }
    - { id: os, text: { en: "The OS disk (C:)", fr: "Le disque du système d'exploitation (C:)" } }
  targets:
    - { id: data, text: { en: "Data disk that stores the data files", fr: "Disque de données qui stocke les fichiers de données" } }
    - { id: log, text: { en: "Data disk that stores the log files", fr: "Disque de données qui stocke les fichiers journaux" } }
    - { id: tempdb, text: { en: "Location of the tempdb files", fr: "Emplacement des fichiers tempdb" } }
answer:
  mapping: { data: ro, log: none, tempdb: temp }
explanation:
  correct:
    en: |
      Read-only host caching improves reads on the data file disks without buffering writes. The log disk must use no host caching, because a cache could acknowledge log writes before they reach durable storage. On a size that includes a local temporary SSD, such as Standard_E16bds_v5, tempdb belongs on the D: drive for the lowest latency; tempdb is re-created at each start, so the ephemeral disk is acceptable. Host caching is supported here because P40 disks are smaller than 4 TiB.
    fr: |
      La mise en cache de l'hôte en lecture seule (Read-only) améliore les lectures sur les disques des fichiers de données sans mettre les écritures en mémoire tampon. Le disque du journal ne doit utiliser aucune mise en cache de l'hôte (None), car un cache pourrait confirmer des écritures du journal avant qu'elles n'atteignent un stockage durable. Sur une taille qui inclut un SSD temporaire local, comme Standard_E16bds_v5, tempdb se place sur le lecteur D: pour la latence la plus faible ; tempdb est recréée à chaque démarrage, le disque éphémère convient donc. La mise en cache de l'hôte est possible ici, car les disques P40 font moins de 4 Tio.
  options:
    rw: { en: "Read/write caching buffers writes and risks data integrity; it is not used for SQL Server data or log files.", fr: "La mise en cache Read/write met les écritures en mémoire tampon et menace l'intégrité des données ; elle ne s'utilise pas pour les fichiers de données ou journaux SQL Server." }
    os: { en: "The OS disk is not meant for database files; it keeps its default caching and is slower than the local SSD for tempdb.", fr: "Le disque du système d'exploitation n'est pas destiné aux fichiers de base de données ; il conserve sa mise en cache par défaut et il est plus lent que le SSD local pour tempdb." }
references:
  - title: "Storage: Performance best practices for SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/performance-guidelines-best-practices-storage
