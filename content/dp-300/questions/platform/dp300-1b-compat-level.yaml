id: dp300-1b-compat-level
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You migrated a database named **ShopDb** from SQL Server 2016 to Azure SQL Database. ShopDb kept its compatibility level of 130.

    You need to move ShopDb to the latest compatibility level. The solution must minimize the risk of query performance regressions caused by the new query optimizer.

    What should you do?
  fr: |
    Vous avez migré une base de données nommée **ShopDb** de SQL Server 2016 vers Azure SQL Database. ShopDb a conservé son niveau de compatibilité 130.

    Vous devez faire passer ShopDb au niveau de compatibilité le plus récent. La solution doit réduire au minimum le risque de régression des performances des requêtes due au nouvel optimiseur de requête.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Raise the compatibility level immediately, and then clear the plan cache.", fr: "Élever immédiatement le niveau de compatibilité, puis vider le cache des plans." } }
    - { id: b, text: { en: "Rebuild every index of ShopDb, and then raise the compatibility level.", fr: "Reconstruire tous les index de ShopDb, puis élever le niveau de compatibilité." } }
    - { id: c, text: { en: "Keep level 130 while Query Store captures a baseline, then raise the level and force good plans.", fr: "Garder le niveau 130 pendant que le Magasin des requêtes capture une référence, puis élever le niveau et forcer les bons plans." } }
    - { id: d, text: { en: "Keep level 130 permanently, and disable Query Store to reduce overhead.", fr: "Garder définitivement le niveau 130 et désactiver le Magasin des requêtes pour réduire la surcharge." } }
answer: { optionId: c }
explanation:
  correct:
    en: Optimizer changes are tied to the compatibility level, not to the platform, so plans change only when you raise the level. The recommended workflow keeps the source level while Query Store captures a baseline, then raises the level and forces the previously known good plan for any query that regresses.
    fr: "Les changements de l'optimiseur sont liés au niveau de compatibilité, pas à la plateforme : les plans ne changent que lorsque vous élevez le niveau. La procédure recommandée conserve le niveau de la source pendant que le Magasin des requêtes capture une référence, puis élève le niveau et force le dernier bon plan connu pour toute requête qui régresse."
  options:
    a: { en: "Clearing the cache only forces new plans to be compiled; without a baseline you can't detect or fix regressions.", fr: "Vider le cache force seulement la compilation de nouveaux plans ; sans référence, vous ne pouvez ni détecter ni corriger les régressions." }
    b: { en: "Rebuilding indexes doesn't protect against plan choice regressions introduced by the new optimizer.", fr: "Reconstruire les index ne protège pas contre les régressions de choix de plan introduites par le nouvel optimiseur." }
    d: { en: "This never reaches the latest compatibility level, which the requirement asks for.", fr: "Cette solution n'atteint jamais le niveau de compatibilité le plus récent, ce que l'exigence demande." }
references:
  - title: Query Store Usage Scenarios
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/query-store-usage-scenarios
