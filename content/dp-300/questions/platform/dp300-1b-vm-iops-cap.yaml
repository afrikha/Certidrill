id: dp300-1b-vm-iops-cap
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **SQLVM1** that runs SQL Server 2022. The data files are stored on a Storage Spaces volume striped across four P30 Premium SSD disks. Each P30 disk provides 5,000 IOPS, and host caching on the data disks is set to Read-only.

    The size of SQLVM1 supports a maximum of 12,800 uncached disk IOPS. During peak hours, Azure Monitor shows that SQLVM1 reaches 12,800 uncached IOPS while each disk stays below its own IOPS limit, and the read latency of the data files increases.

    You need to increase the IOPS available to the data files.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **SQLVM1** qui exécute SQL Server 2022. Les fichiers de données sont stockés sur un volume Storage Spaces agrégé par bandes sur quatre disques SSD Premium P30. Chaque disque P30 fournit 5 000 IOPS, et la mise en cache de l'hôte des disques de données est définie sur Read-only.

    La taille de SQLVM1 prend en charge au maximum 12 800 IOPS de disque non mises en cache. Aux heures de pointe, Azure Monitor montre que SQLVM1 atteint 12 800 IOPS non mises en cache alors que chaque disque reste sous sa propre limite d'IOPS, et la latence de lecture des fichiers de données augmente.

    Vous devez augmenter les IOPS disponibles pour les fichiers de données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add two more P30 disks to the storage pool.", fr: "Ajouter deux disques P30 supplémentaires au pool de stockage." } }
    - { id: b, text: { en: "Change the performance tier of the four disks to P40.", fr: "Changer le niveau de performance des quatre disques en P40." } }
    - { id: c, text: { en: "Resize SQLVM1 to a larger virtual machine size.", fr: "Redimensionner SQLVM1 vers une taille de machine virtuelle plus grande." } }
    - { id: d, text: { en: "Set host caching on the four data disks to Read/write.", fr: "Définir la mise en cache de l'hôte des quatre disques de données sur Read/write." } }
answer: { optionId: c }
explanation:
  correct:
    en: The bottleneck is the virtual machine, not the disks. Uncached IOPS and throughput limits apply at the VM level to remotely attached data disks, so the disks can never deliver more than the size allows. Only a larger VM size with a higher uncached limit raises the ceiling.
    fr: "Le goulot d'étranglement est la machine virtuelle, pas les disques. Les limites d'IOPS et de débit non mis en cache s'appliquent au niveau de la machine virtuelle pour les disques de données attachés à distance : les disques ne peuvent jamais fournir plus que ce que la taille autorise. Seule une taille de machine virtuelle plus grande, dotée d'une limite non mise en cache plus élevée, relève ce plafond."
  options:
    a: { en: "More disks add disk IOPS, but the VM already caps uncached IOPS at 12,800, so the extra capacity can't be used.", fr: "Des disques supplémentaires ajoutent des IOPS de disque, mais la machine virtuelle plafonne déjà les IOPS non mises en cache à 12 800 : cette capacité supplémentaire reste inutilisable." }
    b: { en: "A higher disk performance tier raises the limit of each disk, which isn't the limit being reached.", fr: "Un niveau de performance de disque supérieur relève la limite de chaque disque, qui n'est pas la limite atteinte." }
    d: { en: "Read/write caching buffers writes and risks data integrity; it must not be used for SQL Server data files.", fr: "La mise en cache Read/write met les écritures en mémoire tampon et menace l'intégrité des données ; elle ne doit pas être utilisée pour les fichiers de données SQL Server." }
references:
  - title: "Storage: Performance best practices for SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/performance-guidelines-best-practices-storage
