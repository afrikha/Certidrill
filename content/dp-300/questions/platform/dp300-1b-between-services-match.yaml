id: dp300-1b-between-services-match
objective: "1.3.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam needs to move databases between Azure SQL services. Each move must use a method that the services support and must minimize administrative effort.

    Which method should you use for each move? To answer, drag the appropriate methods to the correct moves. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam doit déplacer des bases de données entre des services Azure SQL. Chaque déplacement doit utiliser une méthode prise en charge par les services et réduire au minimum l'effort d'administration.

    Quelle méthode devez-vous utiliser pour chaque déplacement ? Pour répondre, faites glisser les méthodes appropriées vers les déplacements correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bacpac, text: { en: "BACPAC export and import with SqlPackage", fr: "Exportation et importation BACPAC avec SqlPackage" } }
    - { id: copy, text: { en: "Database copy (CREATE DATABASE ... AS COPY OF)", fr: "Copie de base de données (CREATE DATABASE ... AS COPY OF)" } }
    - { id: move, text: { en: "Managed instance database move", fr: "Déplacement de base de données d'instance managée" } }
    - { id: tier, text: { en: "A change of the service tier", fr: "Un changement de niveau de service" } }
    - { id: georestore, text: { en: "Geo-restore", fr: "Géorestauration" } }
  targets:
    - { id: t1, text: { en: "An Azure SQL database to an Azure SQL managed instance", fr: "Une base de données Azure SQL vers une instance managée Azure SQL" } }
    - { id: t2, text: { en: "A database from managed instance MI1 to managed instance MI2 in the same region, online, with the source removed at the end", fr: "Une base de données de l'instance managée MI1 vers l'instance managée MI2 de la même région, en ligne, avec suppression de la source à la fin" } }
    - { id: t3, text: { en: "An Azure SQL database from General Purpose to Hyperscale, online", fr: "Une base de données Azure SQL de General Purpose vers Hyperscale, en ligne" } }
    - { id: t4, text: { en: "A transactionally consistent copy of an Azure SQL database on another logical server in the same region", fr: "Une copie transactionnellement cohérente d'une base de données Azure SQL sur un autre serveur logique de la même région" } }
answer:
  mapping: { t1: bacpac, t2: move, t3: tier, t4: copy }
explanation:
  correct:
    en: Azure SQL Database has no native backup that a managed instance could restore, so a BACPAC exported and imported with SqlPackage moves the data. A managed instance database move replicates the database online to another instance in the same region and drops the source on completion. Converting to Hyperscale is a service tier change with a short cutover. A database copy creates a transactionally consistent, independent copy on the same or another logical server.
    fr: Azure SQL Database n'a pas de sauvegarde native qu'une instance managée pourrait restaurer ; un BACPAC exporté et importé avec SqlPackage déplace donc les données. Le déplacement de base de données d'instance managée réplique la base en ligne vers une autre instance de la même région et supprime la source à la fin. La conversion en Hyperscale est un changement de niveau de service avec un court basculement. Une copie de base de données crée une copie indépendante et transactionnellement cohérente sur le même serveur logique ou un autre.
  options:
    georestore: { en: "Geo-restore restores a geo-replicated backup, usually to another region; it doesn't move data between service types.", fr: "La géorestauration restaure une sauvegarde géorépliquée, en général dans une autre région ; elle ne déplace pas de données entre types de services." }
references:
  - title: Copy a transactionally consistent copy of a database in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/database-copy
  - title: Copy or move a database - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
