id: dp300-1a-fabric-ods
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind uses Microsoft Fabric for analytics. The operations team needs a new operational data store that consolidates order and shipment data written by several line-of-business applications.

    The solution must meet the following requirements:

    - The data must be available in OneLake for Spark notebooks and Power BI reports in near real time.
    - No extract, transform and load (ETL) pipeline must be built or maintained.
    - The database must be created and secured in the same Fabric workspace as the reports.

    What should you recommend?
  fr: |
    Northwind utilise Microsoft Fabric pour l'analytique. L'équipe des opérations a besoin d'un nouveau magasin de données opérationnel qui regroupe les données de commandes et d'expéditions écrites par plusieurs applications métier.

    La solution doit satisfaire aux exigences suivantes :

    - Les données doivent être disponibles dans OneLake pour les notebooks Spark et les rapports Power BI en quasi-temps réel.
    - Aucun pipeline d'extraction, de transformation et de chargement (ETL) ne doit être créé ni maintenu.
    - La base de données doit être créée et sécurisée dans le même espace de travail Fabric que les rapports.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure SQL Database database and a scheduled Azure Data Factory pipeline that copies the tables to a lakehouse", fr: "Une base de données Azure SQL Database et un pipeline Azure Data Factory planifié qui copie les tables dans un lakehouse" } }
    - { id: b, text: { en: "A SQL database in Microsoft Fabric created in the reporting workspace", fr: "Une base de données SQL dans Microsoft Fabric créée dans l'espace de travail des rapports" } }
    - { id: c, text: { en: "An Azure SQL Managed Instance and a nightly export of the tables to CSV files in OneLake", fr: "Une instance Azure SQL Managed Instance et une exportation nocturne des tables vers des fichiers CSV dans OneLake" } }
    - { id: d, text: { en: "SQL Server on an Azure virtual machine and transactional replication to a second instance", fr: "SQL Server sur une machine virtuelle Azure et une réplication transactionnelle vers une deuxième instance" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SQL database in Microsoft Fabric is a transactional database created in a Fabric workspace and based on the Azure SQL Database engine. Its data is replicated automatically to OneLake in near real time in an analytics-ready format, with a SQL analytics endpoint, so Spark and Power BI use it without any ETL pipeline. An operational data store is one of its documented use cases.
    fr: |
      La base de données SQL dans Microsoft Fabric est une base transactionnelle créée dans un espace de travail Fabric et fondée sur le moteur d'Azure SQL Database. Ses données sont répliquées automatiquement dans OneLake en quasi-temps réel dans un format prêt pour l'analytique, avec un point de terminaison d'analytique SQL : Spark et Power BI les utilisent sans pipeline ETL. Le magasin de données opérationnel fait partie de ses cas d'usage documentés.
  options:
    a: { en: "A scheduled copy pipeline is exactly the ETL process that must be avoided, and the data is only as fresh as the last run.", fr: "Un pipeline de copie planifié est précisément le processus ETL à éviter, et les données ne sont pas plus récentes que la dernière exécution." }
    c: { en: "A nightly export is an ETL job to maintain and doesn't provide near real-time data.", fr: "Une exportation nocturne est un travail ETL à maintenir et ne fournit pas des données en quasi-temps réel." }
    d: { en: "Replication to another SQL Server instance doesn't put the data in OneLake, and the database isn't part of the Fabric workspace.", fr: "La réplication vers une autre instance SQL Server ne place pas les données dans OneLake, et la base ne fait pas partie de l'espace de travail Fabric." }
references:
  - title: "SQL database Overview - Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/database/sql/overview
