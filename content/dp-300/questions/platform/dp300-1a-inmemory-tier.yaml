id: dp300-1a-inmemory-tier
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is building a trading application that will use a new Azure SQL Database database named **TradesDb**. The database will be about 1.5 TB.

    The application requirements are:

    - The order book must be stored in durable memory-optimized tables.
    - Storage IO latency must be about 1 to 2 milliseconds.
    - The database must use the vCore purchasing model.

    Which service tier should you recommend for TradesDb?
  fr: |
    Fabrikam développe une application de négociation qui utilisera une nouvelle base de données Azure SQL Database nommée **TradesDb**. La base de données fera environ 1,5 To.

    Les exigences de l'application sont les suivantes :

    - Le carnet d'ordres doit être stocké dans des tables optimisées en mémoire durables.
    - La latence d'E/S du stockage doit être d'environ 1 à 2 millisecondes.
    - La base de données doit utiliser le modèle d'achat vCore.

    Quel niveau de service devez-vous recommander pour TradesDb ?
body:
  options:
    - { id: a, text: { en: "General Purpose with provisioned compute", fr: "General Purpose avec le calcul provisionné" } }
    - { id: b, text: { en: "General Purpose with serverless compute", fr: "General Purpose avec le calcul serverless" } }
    - { id: c, text: { en: "Hyperscale with provisioned compute", fr: "Hyperscale avec le calcul provisionné" } }
    - { id: d, text: { en: "Business Critical with provisioned compute", fr: "Business Critical avec le calcul provisionné" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In the vCore model, In-Memory OLTP tables are supported only in Business Critical, which also stores data on local SSD with an average latency of 1 to 2 ms. A 1.5 TB database is within the 4 TB maximum of the tier.
    fr: |
      Dans le modèle vCore, les tables In-Memory OLTP ne sont prises en charge qu'au niveau Business Critical, qui stocke aussi les données sur un SSD local avec une latence moyenne de 1 à 2 ms. Une base de 1,5 To reste sous le maximum de 4 To du niveau.
  options:
    a: { en: "General Purpose doesn't support in-memory tables, and its remote storage has a latency of 5 to 10 ms.", fr: "General Purpose ne prend pas en charge les tables en mémoire, et son stockage distant a une latence de 5 à 10 ms." }
    b: { en: "Serverless runs only in General Purpose or Hyperscale, and neither supports durable memory-optimized tables.", fr: "Le serverless ne fonctionne qu'en General Purpose ou Hyperscale, et aucun des deux ne prend en charge les tables optimisées en mémoire durables." }
    c: { en: "Hyperscale supports only some non-persistent In-Memory OLTP objects; durable and non-durable memory-optimized tables must be converted to disk-based tables.", fr: "Hyperscale ne prend en charge que certains objets In-Memory OLTP non persistants ; les tables optimisées en mémoire, durables ou non, doivent être converties en tables sur disque." }
references:
  - title: "vCore purchasing model - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-sql-database-vcore
  - title: "What is the Hyperscale service tier? - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale
