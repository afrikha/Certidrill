id: dp300-1a-offering-match
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to move four workloads to Azure. Each workload must use a single deployment option, and the solution must minimize administrative effort.

    | Workload | Requirements |
    | --- | --- |
    | Tenants | 250 tenant databases of 5 to 20 GB each, low average use, usage peaks at different times of day; minimize cost |
    | Telemetry | One OLTP database of 60 TB that is expected to reach 100 TB; PaaS only |
    | Messaging | Service Broker conversations between databases of the same instance; PaaS only |
    | Legacy | A third-party monitoring agent must be installed on the operating system of the server that runs SQL Server |

    Which deployment option should you recommend for each workload? To answer, drag the appropriate options to the correct workloads. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de déplacer quatre charges de travail vers Azure. Chaque charge de travail doit utiliser une seule option de déploiement, et la solution doit réduire au minimum l'effort d'administration.

    | Charge de travail | Exigences |
    | --- | --- |
    | Tenants | 250 bases de données de locataires de 5 à 20 Go chacune, utilisation moyenne faible, pics d'utilisation à des moments différents de la journée ; réduire les coûts au minimum |
    | Telemetry | Une base de données OLTP de 60 To qui devrait atteindre 100 To ; PaaS uniquement |
    | Messaging | Conversations Service Broker entre des bases de données de la même instance ; PaaS uniquement |
    | Legacy | Un agent de supervision tiers doit être installé sur le système d'exploitation du serveur qui exécute SQL Server |

    Quelle option de déploiement devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les options appropriées vers les charges de travail correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pool, text: { en: "Azure SQL Database elastic pool", fr: "Pool élastique Azure SQL Database" } }
    - { id: hs, text: { en: "Azure SQL Database single database in the Hyperscale tier", fr: "Base de données unique Azure SQL Database au niveau Hyperscale" } }
    - { id: gp, text: { en: "Azure SQL Database single database in the General Purpose tier", fr: "Base de données unique Azure SQL Database au niveau General Purpose" } }
    - { id: mi, text: { en: "Azure SQL Managed Instance", fr: "Azure SQL Managed Instance" } }
    - { id: vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur les machines virtuelles Azure" } }
  targets:
    - { id: tenants, text: Tenants }
    - { id: telemetry, text: Telemetry }
    - { id: messaging, text: Messaging }
    - { id: legacy, text: Legacy }
answer:
  mapping: { tenants: pool, telemetry: hs, messaging: mi, legacy: vm }
explanation:
  correct:
    en: |
      An elastic pool shares resources among many databases whose peaks don't overlap, which costs less than sizing each database for its own peak. Hyperscale grows to 128 TB, whereas General Purpose and Business Critical stop at 4 TB and Managed Instance at 32 TB. Service Broker is supported by Managed Instance but not by Azure SQL Database. Only a virtual machine gives access to the operating system for a third-party agent.
    fr: |
      Un pool élastique partage des ressources entre de nombreuses bases dont les pics ne se chevauchent pas, ce qui coûte moins cher que de dimensionner chaque base pour son propre pic. Hyperscale atteint 128 To, alors que General Purpose et Business Critical s'arrêtent à 4 To et Managed Instance à 32 To. Service Broker est pris en charge par Managed Instance, mais pas par Azure SQL Database. Seule une machine virtuelle donne accès au système d'exploitation pour un agent tiers.
  options:
    gp: { en: "General Purpose is limited to 4 TB per database and has no Service Broker; it fits none of the workloads as well as the other options.", fr: "General Purpose est limité à 4 To par base et n'a pas de Service Broker ; il ne convient à aucune charge aussi bien que les autres options." }
references:
  - title: "vCore purchasing model - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-sql-database-vcore
  - title: "Compare SQL Database Engine Features - Azure SQL Database & Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
