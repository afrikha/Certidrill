id: dp300-1a-mi-scaling-behavior
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have two Azure SQL managed instances:

    - **MI3**, in the General Purpose service tier (not Next-gen), hosts 400 GB of data. You plan to increase its vCores from 8 to 16.
    - **MI4**, in the General Purpose service tier, hosts 3 TB of data. You plan to change it to the Business Critical service tier.

    How should you complete the following statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux instances Azure SQL Managed Instance :

    - **MI3**, au niveau de service General Purpose (pas Next-gen), héberge 400 Go de données. Vous prévoyez de faire passer ses vCores de 8 à 16.
    - **MI4**, au niveau de service General Purpose, héberge 3 To de données. Vous prévoyez de la faire passer au niveau de service Business Critical.

    Comment devez-vous compléter les affirmations suivantes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      While the vCores of MI3 are being scaled, the databases of MI3 [[during]].

      The scaling operation of MI3 ends with [[end]].

      The duration of the change of MI4 to Business Critical depends mainly on [[dur]].
    fr: |
      Pendant la mise à l'échelle des vCores de MI3, les bases de données de MI3 [[during]].

      La mise à l'échelle de MI3 se termine par [[end]].

      La durée du passage de MI4 à Business Critical dépend principalement [[dur]].
  slots:
    - id: during
      options:
        - { id: avail, text: { en: "remain available for reads and writes", fr: "restent disponibles en lecture et en écriture" } }
        - { id: ro, text: { en: "are available for reads only", fr: "ne sont disponibles qu'en lecture" } }
        - { id: offline, text: { en: "are offline for the whole operation", fr: "sont hors connexion pendant toute l'opération" } }
    - id: end
      options:
        - { id: none, text: { en: "no interruption of connections", fr: "aucune interruption des connexions" } }
        - { id: failover, text: { en: "a failover of up to about 2 minutes that drops open connections", fr: "un basculement d'environ 2 minutes au plus qui coupe les connexions ouvertes" } }
        - { id: restore, text: { en: "a restore of the latest backup on the new compute", fr: "une restauration de la dernière sauvegarde sur le nouveau calcul" } }
    - id: dur
      options:
        - { id: size, text: { en: "on the amount of data, because the data is copied from remote storage to local storage", fr: "de la quantité de données, car les données sont copiées du stockage distant vers le stockage local" } }
        - { id: vcores, text: { en: "on the number of vCores, because new compute nodes are deployed per vCore", fr: "du nombre de vCores, car de nouveaux nœuds de calcul sont déployés par vCore" } }
        - { id: logins, text: { en: "on the number of logins, because they are recreated on each replica", fr: "du nombre de connexions (logins), car elles sont recréées sur chaque réplica" } }
answer:
  values: { during: avail, end: failover, dur: size }
explanation:
  correct:
    en: |
      A managed instance stays available during an update operation, except during the failover at the end, when traffic is redirected to the new SQL Database Engine process and open connections break. In General Purpose, this failover takes up to 2 minutes (up to 20 seconds in Business Critical). A change from General Purpose to Business Critical copies the data from remote storage to local storage (seeding), so its duration grows with the data size.
    fr: |
      Une instance managée reste disponible pendant une opération de mise à jour, sauf pendant le basculement final, quand le trafic est redirigé vers le nouveau processus du moteur de base de données SQL et que les connexions ouvertes sont coupées. En General Purpose, ce basculement dure jusqu'à 2 minutes (jusqu'à 20 secondes en Business Critical). Un passage de General Purpose à Business Critical copie les données du stockage distant vers le stockage local (amorçage) : sa durée croît avec la taille des données.
references:
  - title: "Management Operations Overview - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/management-operations-overview
