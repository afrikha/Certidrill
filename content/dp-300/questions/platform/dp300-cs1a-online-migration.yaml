id: dp300-cs1a-online-migration
objective: "1.3.3"
type: single
caseStudy: dp300-cs1a-lucerne-logistics
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a migration method for FreightOps. The solution must meet the migration requirements. What should you recommend?
  fr: |
    Vous devez recommander une méthode de migration pour FreightOps. La solution doit respecter les exigences de migration. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Log Replay Service (LRS) in continuous mode, followed by a manual cutover", fr: "Log Replay Service (LRS) en mode continu, suivi d'un basculement manuel" } }
    - { id: b, text: { en: "The Managed Instance link, followed by a failover to MI1", fr: "Le lien Managed Instance (Managed Instance link), suivi d'un basculement vers MI1" } }
    - { id: c, text: { en: "A native full backup to Azure Blob Storage, followed by RESTORE FROM URL on MI1", fr: "Une sauvegarde complète native vers Stockage Blob Azure, suivie d'un RESTORE FROM URL sur MI1" } }
    - { id: d, text: { en: "A BACPAC export by using SqlPackage, followed by an import into MI1", fr: "Une exportation BACPAC avec SqlPackage, suivie d'une importation dans MI1" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Managed Instance link replicates FreightOps to MI1 by using a distributed availability group, and the replica on MI1 is readable during replication, so the quality team can validate the data before the cutover. It is the only method that provides a true online migration to the Business Critical tier, and SQL1 runs SQL Server 2019 CU22, which is later than the minimum CU20 required by the link.
    fr: |
      Le lien Managed Instance réplique FreightOps vers MI1 à l'aide d'un groupe de disponibilité distribué, et le réplica de MI1 est accessible en lecture pendant la réplication : l'équipe qualité peut valider les données avant le basculement. C'est la seule méthode qui offre une véritable migration en ligne vers le niveau Business Critical, et SQL1 exécute SQL Server 2019 CU22, postérieur à la CU20 minimale exigée par le lien.
  options:
    a: { en: "LRS keeps the database in a restoring state until the cutover, so no report can run against it, and its online migration targets only General Purpose.", fr: "LRS laisse la base de données en état de restauration jusqu'au basculement : aucun rapport ne peut s'y exécuter, et sa migration en ligne ne cible que General Purpose." }
    c: { en: "A full backup and restore is an offline method: changes made after the backup are lost unless the workload stops for the whole restore of 1.4 TB.", fr: "Une sauvegarde complète suivie d'une restauration est une méthode hors connexion : les modifications postérieures à la sauvegarde sont perdues, sauf à arrêter la charge pendant toute la restauration de 1,4 To." }
    d: { en: "A BACPAC export and import is offline and slow for 1.4 TB; the downtime would far exceed five minutes.", fr: "Une exportation et une importation BACPAC sont hors connexion et lentes pour 1,4 To ; l'interruption dépasserait largement cinq minutes." }
references:
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
  - title: Overview of Log Replay Service with Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-overview
