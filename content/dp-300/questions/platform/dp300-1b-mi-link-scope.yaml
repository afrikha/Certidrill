id: dp300-1b-mi-link-scope
objective: "1.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You plan to migrate a database named **HRDb** from SQL Server 2022 to an Azure SQL managed instance by using the Managed Instance link. HRDb is used by applications that sign in with SQL Server logins, and several SQL Server Agent jobs run against HRDb.

    Which two items must you migrate separately because the link doesn't replicate them?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de migrer une base de données nommée **HRDb** de SQL Server 2022 vers une instance managée Azure SQL à l'aide du lien Managed Instance. HRDb est utilisée par des applications qui se connectent avec des connexions SQL Server, et plusieurs travaux SQL Server Agent s'exécutent sur HRDb.

    Quels sont les deux éléments que vous devez migrer séparément, car le lien ne les réplique pas ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The SQL Server logins", fr: "Les connexions SQL Server" } }
    - { id: b, text: { en: "The database users of HRDb", fr: "Les utilisateurs de base de données de HRDb" } }
    - { id: c, text: { en: "The SQL Server Agent jobs", fr: "Les travaux SQL Server Agent" } }
    - { id: d, text: { en: "The stored procedures of HRDb", fr: "Les procédures stockées de HRDb" } }
    - { id: e, text: { en: "The nonclustered indexes of HRDb", fr: "Les index non cluster de HRDb" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The Managed Instance link replicates user databases only. Server-level objects such as logins, and SQL Server Agent jobs, which are stored in msdb, aren't replicated, so you must re-create them on the managed instance before the cutover.
    fr: "Le lien Managed Instance ne réplique que les bases de données utilisateur. Les objets de niveau serveur comme les connexions, ainsi que les travaux SQL Server Agent, stockés dans msdb, ne sont pas répliqués : vous devez les recréer sur l'instance managée avant le basculement."
  options:
    b: { en: "Database users are stored inside HRDb and are replicated with the database.", fr: "Les utilisateurs de base de données sont stockés dans HRDb et sont répliqués avec la base." }
    d: { en: "Stored procedures are database objects and are replicated with HRDb.", fr: "Les procédures stockées sont des objets de base de données et sont répliquées avec HRDb." }
    e: { en: "Indexes are part of the database and are replicated with HRDb.", fr: "Les index font partie de la base de données et sont répliqués avec HRDb." }
references:
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
