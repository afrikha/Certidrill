id: dp300-1b-mi-copy-facts
objective: "1.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to use the database copy and move features of Azure SQL Managed Instance to reorganize databases across several managed instances.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser les fonctionnalités de copie et de déplacement de base de données d'Azure SQL Managed Instance pour réorganiser des bases entre plusieurs instances managées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can copy a database from a managed instance in West Europe to a managed instance in North Europe.
        fr: Vous pouvez copier une base de données d'une instance managée de West Europe vers une instance managée de North Europe.
    - id: s2
      text:
        en: After a move completes, the point-in-time restore backups taken on the source instance are available on the destination instance.
        fr: Une fois un déplacement terminé, les sauvegardes de restauration à un point dans le temps effectuées sur l'instance source sont disponibles sur l'instance de destination.
    - id: s3
      text:
        en: If you don't complete an operation within 24 hours after it is ready for completion, the operation is canceled and the destination database is dropped.
        fr: Si vous ne terminez pas une opération dans les 24 heures après qu'elle est prête pour la finalisation, l'opération est annulée et la base de destination est supprimée.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: Copy and move require the source and destination instances to be in the same Azure region. Point-in-time restore backups aren't copied or moved; a new backup chain starts on the destination. You have 24 hours to complete an operation once seeding is done, after which it is canceled automatically and the destination database is dropped.
    fr: La copie et le déplacement exigent que les instances source et de destination soient dans la même région Azure. Les sauvegardes de restauration à un point dans le temps ne sont ni copiées ni déplacées ; une nouvelle chaîne de sauvegarde commence sur la destination. Vous disposez de 24 heures pour terminer une opération une fois l'amorçage terminé ; ensuite, elle est annulée automatiquement et la base de destination est supprimée.
references:
  - title: Copy or move a database - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
