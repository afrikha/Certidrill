id: dp300-1b-partition-existing-table
objective: "1.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine that runs SQL Server 2022 and hosts a database named **BillingDb**. BillingDb contains a non-partitioned table named dbo.Invoices that has a clustered index named CIX_Invoices on the InvoiceDate column. The filegroups fg2024, fg2025 and fg2026 already exist, each with one data file.

    You need to partition dbo.Invoices by year so that the rows of each year are stored on their own filegroup.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une machine virtuelle Azure qui exécute SQL Server 2022 et héberge une base de données nommée **BillingDb**. BillingDb contient une table non partitionnée nommée dbo.Invoices, dotée d'un index cluster nommé CIX_Invoices sur la colonne InvoiceDate. Les groupes de fichiers fg2024, fg2025 et fg2026 existent déjà, chacun avec un fichier de données.

    Vous devez partitionner dbo.Invoices par année, de sorte que les lignes de chaque année soient stockées dans leur propre groupe de fichiers.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pf, text: { en: "Create a partition function on the InvoiceDate data type with yearly boundary values.", fr: "Créer une fonction de partition sur le type de données d'InvoiceDate avec des valeurs limites annuelles." } }
    - { id: ps, text: { en: "Create a partition scheme that maps the partitions of the function to the filegroups.", fr: "Créer un schéma de partition qui associe les partitions de la fonction aux groupes de fichiers." } }
    - { id: ci, text: { en: "Re-create CIX_Invoices with DROP_EXISTING = ON on the partition scheme, with InvoiceDate as the partitioning column.", fr: "Recréer CIX_Invoices avec DROP_EXISTING = ON sur le schéma de partition, avec InvoiceDate comme colonne de partitionnement." } }
    - { id: split, text: { en: "Run ALTER PARTITION FUNCTION ... SPLIT RANGE once for each year.", fr: "Exécuter ALTER PARTITION FUNCTION ... SPLIT RANGE une fois pour chaque année." } }
    - { id: switch, text: { en: "Switch dbo.Invoices into partition 1 of a new partitioned table.", fr: "Basculer dbo.Invoices dans la partition 1 d'une nouvelle table partitionnée." } }
    - { id: lock, text: { en: "Set LOCK_ESCALATION to AUTO on dbo.Invoices.", fr: "Définir LOCK_ESCALATION sur AUTO pour dbo.Invoices." } }
answer:
  sequence: [ pf, ps, ci ]
explanation:
  correct:
    en: |
      The partition function defines the boundaries, the partition scheme maps the resulting partitions to filegroups and references the function, and rebuilding the clustered index on the scheme moves the existing rows into their partitions. Rebuilding with DROP_EXISTING = ON is one of the documented ways to repartition an existing table.
    fr: |
      La fonction de partition définit les limites, le schéma de partition associe les partitions obtenues aux groupes de fichiers et référence la fonction, et la reconstruction de l'index cluster sur le schéma déplace les lignes existantes dans leurs partitions. Reconstruire l'index avec DROP_EXISTING = ON est l'une des méthodes documentées pour repartitionner une table existante.
  options:
    split: { en: "The yearly boundaries are declared when the function is created; SPLIT is for adding a boundary later.", fr: "Les limites annuelles se déclarent à la création de la fonction ; SPLIT sert à ajouter une limite plus tard." }
    switch: { en: "Switching the whole table into one partition would put every year in a single partition and requires a check constraint on the source.", fr: "Basculer toute la table dans une partition placerait toutes les années dans une seule partition et exige une contrainte de validation sur la source." }
    lock: { en: "LOCK_ESCALATION = AUTO is an optional tuning setting; it doesn't partition the table.", fr: "LOCK_ESCALATION = AUTO est un réglage facultatif ; il ne partitionne pas la table." }
references:
  - title: Partitioned tables and indexes
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes
  - title: ALTER PARTITION FUNCTION (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-partition-function-transact-sql
