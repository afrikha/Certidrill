id: dp300-1b-bacpac-elastic-pool
objective: "1.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a logical server for Azure SQL Database named **sql-adatum** that contains an elastic pool named Pool1. You have a 40 GB BACPAC file named CatalogDb.bacpac in a standard Azure Storage account that isn't behind a firewall. "Allow Azure services and resources to access this server" is enabled on sql-adatum.

    You need to migrate CatalogDb to a database in Pool1.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-adatum** qui contient un pool élastique nommé Pool1. Vous disposez d'un fichier BACPAC de 40 Go nommé CatalogDb.bacpac dans un compte Stockage Azure standard qui n'est pas derrière un pare-feu. L'option « Autoriser les services et les ressources Azure à accéder à ce serveur » est activée sur sql-adatum.

    Vous devez migrer CatalogDb vers une base de données de Pool1.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the Azure portal, import the BACPAC file and select Pool1 as the target of the new database.", fr: "Dans le portail Azure, importer le fichier BACPAC et sélectionner Pool1 comme cible de la nouvelle base." } }
    - { id: b, text: { en: "Create an empty database in Pool1, and then import the BACPAC file into it by using SqlPackage.", fr: "Créer une base vide dans Pool1, puis y importer le fichier BACPAC avec SqlPackage." } }
    - { id: c, text: { en: "Run RESTORE DATABASE ... FROM URL on sql-adatum, and then add the database to Pool1.", fr: "Exécuter RESTORE DATABASE ... FROM URL sur sql-adatum, puis ajouter la base à Pool1." } }
    - { id: d, text: { en: "Import the BACPAC file as a single database from the Azure portal, and then move the database into Pool1.", fr: "Importer le fichier BACPAC comme base unique depuis le portail Azure, puis déplacer la base dans Pool1." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Importing directly into an elastic pool database isn't supported by the Azure portal, Azure PowerShell or the Azure CLI. The documented workarounds are to create the database in the pool and import with SqlPackage, or to import into a single database and then move it into the pool.
    fr: L'importation directe dans une base de données de pool élastique n'est pas prise en charge par le portail Azure, Azure PowerShell ni Azure CLI. Les contournements documentés consistent à créer la base dans le pool et à importer avec SqlPackage, ou à importer dans une base unique puis à la déplacer dans le pool.
  options:
    a: { en: "The portal import creates only a single database and doesn't support an elastic pool target.", fr: "L'importation du portail crée seulement une base unique et ne prend pas en charge une cible de pool élastique." }
    c: { en: "Azure SQL Database has no native RESTORE from a backup file, and a BACPAC isn't a native backup.", fr: "Azure SQL Database n'a pas de RESTORE natif à partir d'un fichier de sauvegarde, et un BACPAC n'est pas une sauvegarde native." }
references:
  - title: "Quickstart: Import a BACPAC file to a database in Azure SQL Database or Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/database-import
