id: dp300-1b-migration-plan-hotarea
objective: "1.3.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind prepared the migration plan shown in the following table. Every source database uses the full recovery model and has full, differential and log backups available.

    Answer each prompt by selecting the planned method in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind a préparé le plan de migration présenté dans le tableau suivant. Chaque base de données source utilise le mode de récupération complet et dispose de sauvegardes complètes, différentielles et de journal.

    Répondez à chaque consigne en sélectionnant la méthode prévue dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Select the planned method that can't be used for its database.", fr: "Sélectionnez la méthode prévue qui ne peut pas être utilisée pour sa base de données." }
    - id: p2
      text: { en: "Select the planned method whose job is canceled automatically if it runs for more than 30 days.", fr: "Sélectionnez la méthode prévue dont le travail est annulé automatiquement s'il dure plus de 30 jours." }
  grid:
    header: [{ en: Database, fr: Base de données }, Source, { en: Target, fr: Cible }, { en: Maximum downtime, fr: Temps d'arrêt maximal }, { en: Planned method, fr: Méthode prévue }]
    rows:
      - [{ text: DB1 }, { text: SQL Server 2019 }, { text: Azure SQL Database }, { text: { en: "10 minutes", fr: "10 minutes" } }, { text: { en: "Database Migration Service, online", fr: "Database Migration Service, en ligne" }, area: m1 }]
      - [{ text: DB2 }, { text: SQL Server 2022 }, { text: SQL Managed Instance Business Critical }, { text: { en: "5 minutes", fr: "5 minutes" } }, { text: { en: "Managed Instance link", fr: "Lien Managed Instance" }, area: m2 }]
      - [{ text: DB3 }, { text: SQL Server 2016 }, { text: { en: "SQL Server on an Azure VM", fr: "SQL Server sur une machine virtuelle Azure" } }, { text: { en: "8 hours", fr: "8 heures" } }, { text: { en: "Backup and restore", fr: "Sauvegarde et restauration" }, area: m3 }]
      - [{ text: DB4 }, { text: SQL Server 2012 }, { text: SQL Managed Instance General Purpose }, { text: { en: "15 minutes", fr: "15 minutes" } }, { text: { en: "Log Replay Service, continuous mode", fr: "Log Replay Service, mode continu" }, area: m4 }]
answer:
  values: { p1: m1, p2: m4 }
explanation:
  correct:
    en: Database Migration Service supports online migrations only to SQL Managed Instance and SQL Server on Azure VMs; to Azure SQL Database it is offline only, so DB1 needs another method, such as transactional replication. A single Log Replay Service job runs for at most 30 days and is then canceled automatically. The other plans are valid; the Managed Instance link supports SQL Server 2022 and the Business Critical tier.
    fr: "Database Migration Service ne prend en charge les migrations en ligne que vers SQL Managed Instance et SQL Server sur machines virtuelles Azure ; vers Azure SQL Database, il est uniquement hors connexion : DB1 a donc besoin d'une autre méthode, comme la réplication transactionnelle. Un travail Log Replay Service dure au maximum 30 jours, puis il est annulé automatiquement. Les autres plans sont valides ; le lien Managed Instance prend en charge SQL Server 2022 et le niveau Business Critical."
references:
  - title: What is Azure Database Migration Service?
    url: https://learn.microsoft.com/en-us/azure/dms/dms-overview
  - title: Overview of Log Replay Service with Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-overview
