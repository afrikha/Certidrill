id: dp300-1b-vm-log-shipping
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an on-premises standalone SQL Server 2019 instance that hosts a 1.5 TB database named **LedgerDb**. The instance isn't part of an availability group.

    You plan to migrate LedgerDb to SQL Server 2019 on an Azure virtual machine. The application can be unavailable for at most 15 minutes. The solution must minimize configuration effort.

    Which migration method should you use?
  fr: |
    Vous disposez d'une instance SQL Server 2019 locale autonome qui héberge une base de données de 1,5 To nommée **LedgerDb**. L'instance ne fait pas partie d'un groupe de disponibilité.

    Vous prévoyez de migrer LedgerDb vers SQL Server 2019 sur une machine virtuelle Azure. L'application peut être indisponible au maximum 15 minutes. La solution doit réduire au minimum l'effort de configuration.

    Quelle méthode de migration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Log shipping to the virtual machine, followed by a failover", fr: "La copie des journaux de transaction (log shipping) vers la machine virtuelle, suivie d'un basculement" } }
    - { id: b, text: { en: "Log Replay Service in continuous mode, followed by a cutover", fr: "Log Replay Service en mode continu, suivi d'un basculement" } }
    - { id: c, text: { en: "A full backup and restore, followed by a cutover", fr: "Une sauvegarde complète et une restauration, suivies d'un basculement" } }
    - { id: d, text: { en: "The Managed Instance link, followed by a failover", fr: "Le lien Managed Instance, suivi d'un basculement" } }
answer: { optionId: a }
explanation:
  correct:
    en: Log shipping replicates transaction log backups to the Azure virtual machine, so the downtime is limited to the failover window. It needs less configuration than an Always On availability group, which suits a standalone instance.
    fr: La copie des journaux de transaction réplique les sauvegardes de journal vers la machine virtuelle Azure ; le temps d'arrêt se limite donc à la fenêtre de basculement. Elle demande moins de configuration qu'un groupe de disponibilité Always On, ce qui convient à une instance autonome.
  options:
    b: { en: "Log Replay Service restores backups only to Azure SQL Managed Instance.", fr: "Log Replay Service ne restaure des sauvegardes que vers Azure SQL Managed Instance." }
    c: { en: "A full backup and restore of 1.5 TB is offline; the downtime far exceeds 15 minutes.", fr: "Une sauvegarde complète et une restauration de 1,5 To sont hors connexion ; le temps d'arrêt dépasse largement 15 minutes." }
    d: { en: "The Managed Instance link replicates only to Azure SQL Managed Instance.", fr: "Le lien Managed Instance ne réplique que vers Azure SQL Managed Instance." }
references:
  - title: "Migration guide: SQL Server to SQL Server on Azure Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/virtual-machines/sql-server-to-sql-on-azure-vm-individual-databases-guide
