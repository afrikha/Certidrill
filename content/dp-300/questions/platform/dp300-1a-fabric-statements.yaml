id: dp300-1a-fabric-statements
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to create a SQL database in Microsoft Fabric named **FieldServiceDb** for a mobile workforce application. The application will write service visits, and analysts will build Power BI reports on the same data.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de créer une base de données SQL dans Microsoft Fabric nommée **FieldServiceDb** pour une application destinée aux techniciens itinérants. L'application écrira les interventions, et des analystes créeront des rapports Power BI sur les mêmes données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The application can connect to FieldServiceDb by using a SQL authentication login and password.
        fr: L'application peut se connecter à FieldServiceDb avec une connexion et un mot de passe d'authentification SQL.
    - id: s2
      text:
        en: The data written to FieldServiceDb is replicated automatically to OneLake.
        fr: Les données écrites dans FieldServiceDb sont répliquées automatiquement dans OneLake.
    - id: s3
      text:
        en: Creating FieldServiceDb also creates a SQL analytics endpoint that analysts can query without affecting the transactional workload.
        fr: La création de FieldServiceDb crée aussi un point de terminaison d'analytique SQL que les analystes peuvent interroger sans affecter la charge transactionnelle.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      SQL database in Fabric relies on Microsoft Entra authentication: logins aren't supported, only users that represent Microsoft Entra principals. Its data is replicated automatically to OneLake in near real time, and a SQL analytics endpoint is created with the database so that analytical queries run on the replicated data rather than on the transactional engine.
    fr: |
      La base de données SQL dans Fabric s'appuie sur l'authentification Microsoft Entra : les connexions (logins) ne sont pas prises en charge, seulement des utilisateurs représentant des principaux Microsoft Entra. Ses données sont répliquées automatiquement dans OneLake en quasi-temps réel, et un point de terminaison d'analytique SQL est créé avec la base : les requêtes analytiques s'exécutent sur les données répliquées plutôt que sur le moteur transactionnel.
references:
  - title: "SQL database Overview - Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/database/sql/overview
  - title: "Limitations for SQL database - Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/database/sql/limitations
