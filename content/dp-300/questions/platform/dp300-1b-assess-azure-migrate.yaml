id: dp300-1b-assess-azure-migrate
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has 400 SQL Server instances that run on VMware vSphere virtual machines in its datacenter. The instances are not connected to Azure Arc.

    You need to discover the instances, assess their readiness for Azure SQL, and obtain recommended targets with sizing and monthly cost estimates. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Litware dispose de 400 instances SQL Server qui s'exécutent sur des machines virtuelles VMware vSphere dans son centre de données. Les instances ne sont pas connectées à Azure Arc.

    Vous devez découvrir les instances, évaluer leur préparation à Azure SQL et obtenir des cibles recommandées avec un dimensionnement et des estimations de coût mensuel. La solution doit réduire au minimum l'effort d'administration.

    Qu'est-ce que vous devez utiliser ?
body:
  options:
    - { id: a, text: Azure Database Migration Service }
    - { id: b, text: Azure Migrate }
    - { id: c, text: Azure Advisor }
    - { id: d, text: Log Replay Service }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Migrate discovers and assesses SQL Server estates at scale on VMware, and it provides Azure SQL deployment recommendations, target sizing and monthly cost estimates. It is the recommended assessment tool for a large estate that isn't connected to Azure Arc.
    fr: Azure Migrate découvre et évalue à grande échelle les parcs SQL Server sur VMware, et fournit des recommandations de déploiement Azure SQL, un dimensionnement des cibles et des estimations de coût mensuel. C'est l'outil d'évaluation recommandé pour un grand parc non connecté à Azure Arc.
  options:
    a: { en: "Database Migration Service runs migrations; its portal version doesn't provide assessment or SKU recommendations.", fr: "Database Migration Service exécute les migrations ; sa version portail ne fournit ni évaluation ni recommandation de SKU." }
    c: { en: "Azure Advisor gives recommendations for resources already deployed in Azure, not for on-premises SQL Server instances.", fr: "Azure Advisor donne des recommandations pour des ressources déjà déployées dans Azure, pas pour des instances SQL Server locales." }
    d: { en: "Log Replay Service restores backups to Azure SQL Managed Instance; it doesn't discover or assess instances.", fr: "Log Replay Service restaure des sauvegardes vers Azure SQL Managed Instance ; il ne découvre ni n'évalue les instances." }
references:
  - title: "Migration overview: SQL Server to Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/database/sql-server-to-sql-database-overview
  - title: What is Azure Database Migration Service?
    url: https://learn.microsoft.com/en-us/azure/dms/dms-overview
