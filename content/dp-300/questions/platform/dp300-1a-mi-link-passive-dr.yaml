id: dp300-1a-mi-link-passive-dr
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a production database on an on-premises SQL Server 2022 Enterprise instance covered by Software Assurance. A Managed Instance link replicates the database to an Azure SQL managed instance named **MI-DR**.

    MI-DR is used only for disaster recovery and runs no workload. Its compute size must not change.

    You need to minimize the SQL Server licensing cost of MI-DR. What should you do?
  fr: |
    Contoso exécute une base de données de production sur une instance SQL Server 2022 Enterprise locale couverte par Software Assurance. Un lien Managed Instance réplique la base vers une instance Azure SQL Managed Instance nommée **MI-DR**.

    MI-DR sert uniquement à la reprise d'activité et n'exécute aucune charge de travail. Sa taille de calcul ne doit pas changer.

    Vous devez réduire au minimum le coût de licence SQL Server de MI-DR. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Activate the hybrid failover benefit on MI-DR", fr: "Activer l'avantage de basculement hybride (hybrid failover benefit) sur MI-DR" } }
    - { id: b, text: { en: "Set the license type of MI-DR to BasePrice and assign additional Enterprise core licenses to it", fr: "Définir le type de licence de MI-DR sur BasePrice et lui affecter des licences Enterprise par cœur supplémentaires" } }
    - { id: c, text: { en: "Purchase reserved capacity for the vCores of MI-DR", fr: "Acheter de la capacité réservée pour les vCores de MI-DR" } }
    - { id: d, text: { en: "Move MI-DR into an instance pool", fr: "Déplacer MI-DR dans un pool d'instances" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A secondary managed instance that is passive and used only for disaster recovery qualifies for the license-free passive DR replica. When you activate the hybrid failover benefit, the SQL Server license charge isn't billed: with pay-as-you-go it appears as a discount, and with Azure Hybrid Benefit the vCores are returned to the license pool.
    fr: |
      Une instance managée secondaire passive, utilisée uniquement pour la reprise d'activité, est éligible au réplica DR passif sans licence. Quand vous activez l'avantage de basculement hybride, la licence SQL Server n'est pas facturée : en paiement à l'utilisation, elle apparaît comme une remise, et avec Azure Hybrid Benefit, les vCores sont rendus au pool de licences.
  options:
    b: { en: "Azure Hybrid Benefit consumes existing licenses for the instance, whereas a passive DR replica doesn't need to consume any.", fr: "Azure Hybrid Benefit consomme des licences existantes pour l'instance, alors qu'un réplica DR passif n'a besoin d'en consommer aucune." }
    c: { en: "Reserved capacity discounts compute for a commitment term; the license component is still paid.", fr: "La capacité réservée réduit le prix du calcul en échange d'un engagement ; la composante licence reste payée." }
    d: { en: "An instance pool shares pre-provisioned resources among instances; it doesn't remove license charges for a DR-only instance.", fr: "Un pool d'instances partage des ressources préprovisionnées entre instances ; il ne supprime pas les frais de licence d'une instance dédiée à la reprise." }
references:
  - title: "Managed Instance link overview - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
