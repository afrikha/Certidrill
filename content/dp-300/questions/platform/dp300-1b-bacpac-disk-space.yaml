id: dp300-1b-bacpac-disk-space
objective: "1.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You exported an on-premises database to a 260 GB BACPAC file and uploaded it to a standard Azure Storage account. You start an import of the file into a new database in Azure SQL Database from the Azure portal.

    After several hours, the import request fails with the error "There is not enough space on the disk".

    You need to import the BACPAC file.

    What should you do?
  fr: |
    Vous avez exporté une base de données locale vers un fichier BACPAC de 260 Go et l'avez chargé dans un compte Stockage Azure standard. Vous lancez l'importation du fichier dans une nouvelle base Azure SQL Database depuis le portail Azure.

    Après plusieurs heures, la demande d'importation échoue avec l'erreur « There is not enough space on the disk ».

    Vous devez importer le fichier BACPAC.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Import the file by using SqlPackage.", fr: "Importer le fichier avec SqlPackage." } }
    - { id: b, text: { en: "Select a larger service objective for the new database, and retry the import from the portal.", fr: "Sélectionner un objectif de service plus élevé pour la nouvelle base, puis relancer l'importation depuis le portail." } }
    - { id: c, text: { en: "Copy the file to a premium storage account, and retry the import from the portal.", fr: "Copier le fichier dans un compte de stockage premium, puis relancer l'importation depuis le portail." } }
    - { id: d, text: { en: "Retry the import by using New-AzSqlDatabaseImport.", fr: "Relancer l'importation avec New-AzSqlDatabaseImport." } }
answer: { optionId: a }
explanation:
  correct:
    en: The machines that process portal and PowerShell imports have 450 GB of local disk, and an import can need up to three times the database size, so large files fail with this error. BACPAC files over 150 GB can also fail in the portal or PowerShell. SqlPackage runs on a machine you control, ideally an Azure virtual machine in the same region, and avoids both limits.
    fr: Les machines qui traitent les importations du portail et de PowerShell disposent de 450 Go de disque local, et une importation peut nécessiter jusqu'à trois fois la taille de la base ; les gros fichiers échouent donc avec cette erreur. Les fichiers BACPAC de plus de 150 Go peuvent aussi échouer dans le portail ou PowerShell. SqlPackage s'exécute sur une machine que vous contrôlez, idéalement une machine virtuelle Azure de la même région, et évite ces deux limites.
  options:
    b: { en: "The failure comes from the local disk of the Import/Export service machine, not from the size of the target database.", fr: "L'échec vient du disque local de la machine du service d'importation/exportation, pas de la taille de la base cible." }
    c: { en: "The Import/Export service supports only standard storage, and the disk limit would remain.", fr: "Le service d'importation/exportation ne prend en charge que le stockage standard, et la limite de disque subsisterait." }
    d: { en: "PowerShell imports use the same service and local disk as the portal, so the error would repeat.", fr: "Les importations PowerShell utilisent le même service et le même disque local que le portail : l'erreur se reproduirait." }
references:
  - title: "Quickstart: Import a BACPAC file to a database in Azure SQL Database or Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/database-import
