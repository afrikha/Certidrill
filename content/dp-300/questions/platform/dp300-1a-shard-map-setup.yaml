id: dp300-1a-shard-map-setup
objective: "1.1.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Adatum is moving a single-database application to a sharded design in Azure SQL Database. Tenants are identified by an integer **TenantId**, and each shard database will hold a range of TenantId values. The three shard databases already exist and contain the application schema. The application will use the Elastic Database client library.

    You need to set up data-dependent routing.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum fait passer une application à base unique vers une conception partitionnée (sharding) dans Azure SQL Database. Les locataires sont identifiés par un entier **TenantId**, et chaque base shard contiendra une plage de valeurs de TenantId. Les trois bases shard existent déjà et contiennent le schéma de l'application. L'application utilisera la bibliothèque cliente Elastic Database.

    Vous devez mettre en place le routage dépendant des données.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: smm, text: { en: "Create a dedicated database and call CreateSqlShardMapManager on it.", fr: "Créer une base dédiée et y appeler CreateSqlShardMapManager." } }
    - { id: map, text: { en: "Create a range shard map by calling CreateRangeShardMap.", fr: "Créer une carte de partitions par plage en appelant CreateRangeShardMap." } }
    - { id: shard, text: { en: "Register each shard database in the shard map by calling CreateShard.", fr: "Inscrire chaque base shard dans la carte de partitions en appelant CreateShard." } }
    - { id: mapping, text: { en: "Map TenantId ranges to the shards by calling CreateRangeMapping.", fr: "Mapper les plages de TenantId aux shards en appelant CreateRangeMapping." } }
    - { id: open, text: { en: "In the application, open connections by calling OpenConnectionForKey with the TenantId.", fr: "Dans l'application, ouvrir les connexions en appelant OpenConnectionForKey avec le TenantId." } }
    - { id: jobagent, text: { en: "Create an elastic job agent and a target group that contains the shards.", fr: "Créer un agent de travaux élastiques et un groupe cible qui contient les shards." } }
    - { id: extsrc, text: { en: "Create an external data source of type SHARD_MAP_MANAGER for elastic query.", fr: "Créer une source de données externe de type SHARD_MAP_MANAGER pour la requête élastique." } }
answer:
  sequence: [ smm, map, shard, mapping, open ]
explanation:
  correct:
    en: |
      The shard map manager stores the global shard map in its own small database, so it is created first. A range shard map is then created in it, the existing databases are registered as shards, and TenantId ranges are mapped to those shards. Finally, OpenConnectionForKey returns a connection to the database that holds the given key, using the cached shard map.
    fr: |
      Le gestionnaire de cartes de partitions stocke la carte globale dans sa propre petite base : il est créé en premier. Une carte de partitions par plage y est ensuite créée, les bases existantes y sont inscrites comme shards, et les plages de TenantId sont mappées à ces shards. Enfin, OpenConnectionForKey renvoie une connexion vers la base qui contient la clé donnée, en s'appuyant sur la carte mise en cache.
  options:
    jobagent: { en: "Elastic jobs run scripts across databases; they aren't needed to route requests.", fr: "Les travaux élastiques exécutent des scripts sur plusieurs bases ; ils ne sont pas nécessaires pour router les requêtes." }
    extsrc: { en: "An external data source serves cross-shard queries with elastic query, not data-dependent routing.", fr: "Une source de données externe sert aux requêtes entre shards avec la requête élastique, pas au routage dépendant des données." }
references:
  - title: "Scale out a Database - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-scale-shard-map-management
  - title: "Data-Dependent Routing - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-scale-data-dependent-routing
