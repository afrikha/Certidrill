id: dp300-1b-vm-pool-columns
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure virtual machine named **SQLVM2** that runs SQL Server 2019. Six months ago, you created a Storage Spaces pool from two P30 Premium SSD disks and a striped virtual disk for the data files.

    Last week, you added two more P30 disks to the pool and extended the virtual disk and the volume. The volume capacity increased, but the IOPS and throughput of the data volume did not change. SQLVM2 is far below its virtual machine IOPS and throughput limits.

    You need to obtain the IOPS and throughput of the four disks for the data files.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **SQLVM2** qui exécute SQL Server 2019. Il y a six mois, vous avez créé un pool Storage Spaces à partir de deux disques SSD Premium P30, ainsi qu'un disque virtuel agrégé par bandes pour les fichiers de données.

    La semaine dernière, vous avez ajouté deux disques P30 au pool et étendu le disque virtuel et le volume. La capacité du volume a augmenté, mais les IOPS et le débit du volume de données n'ont pas changé. SQLVM2 est loin de ses limites d'IOPS et de débit de machine virtuelle.

    Vous devez obtenir les IOPS et le débit des quatre disques pour les fichiers de données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Move the data files elsewhere, re-create the pool and virtual disk with four columns, and move the files back.", fr: "Déplacer les fichiers de données, recréer le pool et le disque virtuel avec quatre colonnes, puis remettre les fichiers." } }
    - { id: b, text: { en: "Reformat the data volume with a 64 KB allocation unit size, and restore the data files on it.", fr: "Reformater le volume de données avec une taille d'unité d'allocation de 64 Ko, puis y restaurer les fichiers de données." } }
    - { id: c, text: { en: "Enable Write Accelerator on the two new disks, and leave the pool configuration unchanged.", fr: "Activer Write Accelerator sur les deux nouveaux disques, sans modifier la configuration du pool." } }
    - { id: d, text: { en: "Set host caching on the two new disks to Read-only, like the two original disks.", fr: "Définir la mise en cache de l'hôte des deux nouveaux disques sur Read-only, comme les deux disques d'origine." } }
answer: { optionId: a }
explanation:
  correct:
    en: The number of stripe columns (NumberOfColumns) of a Storage Spaces virtual disk is fixed when it is created. Adding disks to the pool later only adds capacity, so the data is still striped across two columns. To use the IOPS and throughput of all four disks, re-create the pool and virtual disk with the desired number of disks.
    fr: "Le nombre de colonnes d'agrégation (NumberOfColumns) d'un disque virtuel Storage Spaces est fixé à sa création. Ajouter ensuite des disques au pool n'ajoute que de la capacité : les données restent réparties sur deux colonnes. Pour profiter des IOPS et du débit des quatre disques, il faut recréer le pool et le disque virtuel avec le nombre de disques voulu."
  options:
    b: { en: "The 64 KB allocation unit is a best practice for data drives, but it doesn't change how many disks the stripe uses.", fr: "L'unité d'allocation de 64 Ko est une bonne pratique pour les lecteurs de données, mais elle ne change pas le nombre de disques utilisés par l'agrégation." }
    c: { en: "Write Accelerator is available only on M-series virtual machines and must not be used for data files.", fr: "Write Accelerator n'est disponible que sur les machines virtuelles de la série M et ne doit pas être utilisé pour les fichiers de données." }
    d: { en: "Read-only caching is the right setting for data disks, but the stripe still uses only two columns, so IOPS and throughput stay the same.", fr: "La mise en cache Read-only est le bon paramètre pour les disques de données, mais l'agrégation n'utilise toujours que deux colonnes : les IOPS et le débit restent identiques." }
references:
  - title: "Storage: Performance best practices for SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/performance-guidelines-best-practices-storage
