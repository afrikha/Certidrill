id: dp300-1a-mi-gp-iops
objective: "1.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **MI2** in the General Purpose service tier (not Next-gen General Purpose) with 8 vCores and 1,024 GB of reserved storage. MI2 hosts a database named **Db1** whose single data file is 100 GiB.

    Waits show that the data file of Db1 is limited by its IOPS. You need to increase the IOPS available to the data file of Db1. MI2 must stay in the General Purpose service tier.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance Azure SQL Managed Instance nommée **MI2** au niveau de service General Purpose (pas Next-gen General Purpose), avec 8 vCores et 1 024 Go de stockage réservé. MI2 héberge une base de données nommée **Db1** dont l'unique fichier de données fait 100 Gio.

    Les attentes montrent que le fichier de données de Db1 est limité par ses IOPS. Vous devez augmenter les IOPS disponibles pour le fichier de données de Db1. MI2 doit rester au niveau de service General Purpose.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grow the data file of Db1 to 200 GiB", fr: "Agrandir le fichier de données de Db1 à 200 Gio" } }
    - { id: b, text: { en: "Upgrade MI2 to Next-gen General Purpose and provision additional IOPS", fr: "Mettre à niveau MI2 vers Next-gen General Purpose et provisionner des IOPS supplémentaires" } }
    - { id: c, text: { en: "Increase MI2 to 16 vCores and keep the current file size", fr: "Passer MI2 à 16 vCores en conservant la taille actuelle du fichier" } }
    - { id: d, text: { en: "Enable read scale-out on MI2", fr: "Activer le scale-out en lecture sur MI2" } }
    - { id: e, text: { en: "Add a second log file to Db1", fr: "Ajouter un deuxième fichier journal à Db1" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      In General Purpose, each file gets IOPS according to its size: up to 129 GiB, a file gets 500 IOPS, and from 129 to 513 GiB it gets 2,300 IOPS, so pre-growing the file to 200 GiB raises its limit. Next-gen General Purpose stays in the General Purpose tier but provides 3 IOPS per GB of reserved storage (3,072 IOPS for 1,024 GB) and lets you buy more, up to the vCore cap.
    fr: |
      En General Purpose, chaque fichier reçoit des IOPS selon sa taille : jusqu'à 129 Gio, un fichier dispose de 500 IOPS, et de 129 à 513 Gio de 2 300 IOPS ; agrandir le fichier à 200 Gio relève donc sa limite. Next-gen General Purpose reste dans le niveau General Purpose, mais fournit 3 IOPS par Go de stockage réservé (3 072 IOPS pour 1 024 Go) et permet d'en acheter davantage, jusqu'au plafond lié aux vCores.
  options:
    c: { en: "In classic General Purpose, the IOPS of a file depend on its size, not on the number of vCores.", fr: "En General Purpose classique, les IOPS d'un fichier dépendent de sa taille, pas du nombre de vCores." }
    d: { en: "Read scale-out doesn't exist in General Purpose, and it wouldn't raise the IOPS of the primary's data file.", fr: "Le scale-out en lecture n'existe pas en General Purpose, et il n'augmenterait pas les IOPS du fichier de données du principal." }
    e: { en: "The bottleneck is the data file; an extra log file doesn't change data file IOPS.", fr: "Le goulot d'étranglement est le fichier de données ; un fichier journal supplémentaire ne change pas ses IOPS." }
references:
  - title: "Resource Limits - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/resource-limits
