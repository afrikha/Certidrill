id: dp300-1b-compression-choose-type
objective: "1.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage databases on an Azure virtual machine that runs SQL Server 2022. You need to choose a data compression setting for each table. Each setting must provide storage savings that match the access pattern of the table.

    Which compression setting should you use for each table? To answer, drag the appropriate settings to the correct tables. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez des bases de données sur une machine virtuelle Azure qui exécute SQL Server 2022. Vous devez choisir un paramètre de compression des données pour chaque table. Chaque paramètre doit apporter des économies de stockage adaptées au mode d'accès de la table.

    Quel paramètre de compression devez-vous utiliser pour chaque table ? Pour répondre, faites glisser les paramètres appropriés vers les tables correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: row, text: ROW }
    - { id: page, text: PAGE }
    - { id: cs, text: COLUMNSTORE }
    - { id: arch, text: COLUMNSTORE_ARCHIVE }
    - { id: backup, text: { en: "Backup compression", fr: "Compression de sauvegarde" } }
  targets:
    - { id: hist, text: { en: "A large rowstore history table that is read by range scans, on a server where I/O is the bottleneck and CPU has headroom", fr: "Une grande table d'historique rowstore lue par des analyses de plages, sur un serveur où les E/S sont le goulot d'étranglement et où le processeur a de la marge" } }
    - { id: oltp, text: { en: "A rowstore table with a high rate of inserts and updates, on a CPU-constrained server, where some savings are still wanted", fr: "Une table rowstore soumise à beaucoup d'insertions et de mises à jour, sur un serveur limité en processeur, où un peu d'économie reste souhaitée" } }
    - { id: cold, text: { en: "The partitions of a clustered columnstore table that hold data older than three years and are almost never queried", fr: "Les partitions d'une table columnstore cluster qui contiennent des données de plus de trois ans et ne sont presque jamais interrogées" } }
answer:
  mapping: { hist: page, oltp: row, cold: arch }
explanation:
  correct:
    en: PAGE compression adds prefix and dictionary compression to row compression, so it saves the most space and I/O on read-mostly rowstore data, at a higher CPU cost. ROW compression only stores fixed-length values in a variable-length format, which has the lowest CPU overhead for write-heavy tables. COLUMNSTORE_ARCHIVE gives the highest compression for columnstore data that is rarely accessed, at the cost of slower queries.
    fr: La compression PAGE ajoute la compression de préfixe et de dictionnaire à la compression de ligne ; elle économise le plus d'espace et d'E/S sur des données rowstore surtout lues, avec un coût processeur plus élevé. La compression ROW stocke seulement les valeurs de longueur fixe dans un format de longueur variable, avec la plus faible surcharge processeur pour les tables très sollicitées en écriture. COLUMNSTORE_ARCHIVE offre la compression la plus forte pour des données columnstore rarement consultées, au prix de requêtes plus lentes.
  options:
    cs: { en: "COLUMNSTORE is the default compression of columnstore data; it doesn't add savings for cold partitions and doesn't apply to rowstore tables.", fr: "COLUMNSTORE est la compression par défaut des données columnstore ; elle n'apporte pas d'économie supplémentaire pour les partitions froides et ne s'applique pas aux tables rowstore." }
    backup: { en: "Backup compression compresses backup files, not the data stored in the tables.", fr: "La compression de sauvegarde compresse les fichiers de sauvegarde, pas les données stockées dans les tables." }
references:
  - title: Data compression
    url: https://learn.microsoft.com/en-us/sql/relational-databases/data-compression/data-compression
