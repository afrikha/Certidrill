id: dp300-1b-compression-estimate
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **SalesDb** that contains a large rowstore table named dbo.SalesHistory. You plan to apply PAGE compression to dbo.SalesHistory.

    Before you change the table, you need to know how much space PAGE compression would save.

    What should you use?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **SalesDb** qui contient une grande table rowstore nommée dbo.SalesHistory. Vous prévoyez d'appliquer la compression PAGE à dbo.SalesHistory.

    Avant de modifier la table, vous devez savoir combien d'espace la compression PAGE permettrait d'économiser.

    Qu'est-ce que vous devez utiliser ?
body:
  options:
    - { id: a, text: sp_spaceused }
    - { id: b, text: sys.dm_db_partition_stats }
    - { id: c, text: sp_estimate_data_compression_savings }
    - { id: d, text: sys.dm_db_index_physical_stats }
answer: { optionId: c }
explanation:
  correct:
    en: sp_estimate_data_compression_savings samples the object, compresses the sample with the requested setting (here PAGE) and returns the current and estimated sizes, without changing the table. It works per table, index and partition, and it also supports columnstore indexes.
    fr: sp_estimate_data_compression_savings échantillonne l'objet, compresse l'échantillon avec le paramètre demandé (ici PAGE) et renvoie la taille actuelle et la taille estimée, sans modifier la table. Elle fonctionne par table, index et partition, et prend aussi en charge les index columnstore.
  options:
    a: { en: "sp_spaceused reports the current space used by the table, not the space a compression setting would save.", fr: "sp_spaceused indique l'espace actuellement utilisé par la table, pas l'espace qu'un paramètre de compression ferait économiser." }
    b: { en: "sys.dm_db_partition_stats returns current page and row counts per partition, with no compression estimate.", fr: "sys.dm_db_partition_stats renvoie le nombre actuel de pages et de lignes par partition, sans estimation de compression." }
    d: { en: "sys.dm_db_index_physical_stats reports fragmentation and page density; it doesn't estimate compression savings.", fr: "sys.dm_db_index_physical_stats indique la fragmentation et la densité des pages ; elle n'estime pas les économies de compression." }
references:
  - title: Data compression
    url: https://learn.microsoft.com/en-us/sql/relational-databases/data-compression/data-compression
