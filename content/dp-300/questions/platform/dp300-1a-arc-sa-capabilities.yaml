id: dp300-1a-arc-sa-capabilities
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an on-premises server that runs Windows Server 2022 and a SQL Server 2019 Enterprise instance named **SQLPLANT1**. SQLPLANT1 is covered by Software Assurance.

    You connect SQLPLANT1 to Azure Arc and set its license type to **License with Software Assurance**. You do not plan to upgrade SQL Server.

    Which two generally available capabilities can you enable for SQLPLANT1 from Azure?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un serveur local qui exécute Windows Server 2022 et une instance SQL Server 2019 Enterprise nommée **SQLPLANT1**. SQLPLANT1 est couverte par Software Assurance.

    Vous connectez SQLPLANT1 à Azure Arc et définissez son type de licence sur **License with Software Assurance**. Vous ne prévoyez pas de mettre à niveau SQL Server.

    Quelles sont les deux fonctionnalités en disponibilité générale que vous pouvez activer pour SQLPLANT1 depuis Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The best practices assessment", fr: "L'évaluation des bonnes pratiques" } }
    - { id: b, text: { en: "Microsoft Entra authentication", fr: "L'authentification Microsoft Entra" } }
    - { id: c, text: { en: "Automatic updates", fr: "Les mises à jour automatiques" } }
    - { id: d, text: { en: "Read scale-out to a readable secondary replica", fr: "Le scale-out en lecture vers un réplica secondaire accessible en lecture" } }
    - { id: e, text: { en: "Zone-redundant high availability", fr: "La haute disponibilité redondante interzone" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The best practices assessment and automatic updates are available to Arc-enabled instances whose license type is Software Assurance, SQL Server subscription or pay-as-you-go, which is the case of SQLPLANT1.
    fr: |
      L'évaluation des bonnes pratiques et les mises à jour automatiques sont disponibles pour les instances activées par Arc dont le type de licence est Software Assurance, abonnement SQL Server ou paiement à l'utilisation, ce qui est le cas de SQLPLANT1.
  options:
    b: { en: "Microsoft Entra authentication through Azure Arc requires SQL Server 2022 or later; SQLPLANT1 runs SQL Server 2019 and won't be upgraded.", fr: "L'authentification Microsoft Entra via Azure Arc exige SQL Server 2022 ou ultérieur ; SQLPLANT1 exécute SQL Server 2019 et ne sera pas mise à niveau." }
    d: { en: "Read scale-out is a feature of Azure SQL Database and Managed Instance replicas, not of Arc-enabled SQL Server.", fr: "Le scale-out en lecture est une fonctionnalité des réplicas d'Azure SQL Database et de Managed Instance, pas de SQL Server activé par Arc." }
    e: { en: "Zone-redundant high availability is a configuration of Azure SQL PaaS offerings; Azure Arc doesn't change how an on-premises server is made highly available.", fr: "La haute disponibilité redondante interzone est une configuration des offres PaaS Azure SQL ; Azure Arc ne change pas la façon dont un serveur local est rendu hautement disponible." }
references:
  - title: "Overview - SQL Server enabled by Azure Arc"
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/overview
