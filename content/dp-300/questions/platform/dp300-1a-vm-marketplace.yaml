id: dp300-1a-vm-marketplace
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin needs a new SQL Server 2022 Enterprise instance on Windows Server for a vendor application that requires access to the operating system.

    You need to deploy the instance in Azure. The solution must allow you to configure automated backup and Azure Key Vault integration from the Azure portal, and it must minimize deployment effort.

    What should you do?
  fr: |
    Tailspin a besoin d'une nouvelle instance SQL Server 2022 Enterprise sur Windows Server pour une application d'éditeur qui exige un accès au système d'exploitation.

    Vous devez déployer l'instance dans Azure. La solution doit vous permettre de configurer la sauvegarde automatisée et l'intégration à Azure Key Vault depuis le portail Azure, et elle doit réduire au minimum l'effort de déploiement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a virtual machine from a Windows Server image, install SQL Server from the installation media, and back up to a file share", fr: "Créer une machine virtuelle à partir d'une image Windows Server, installer SQL Server depuis le support d'installation et sauvegarder vers un partage de fichiers" } }
    - { id: b, text: { en: "Create a virtual machine from an Azure Marketplace SQL Server 2022 Enterprise image in the Azure portal", fr: "Créer une machine virtuelle à partir d'une image SQL Server 2022 Enterprise de la Place de marché Azure dans le portail Azure" } }
    - { id: c, text: { en: "Create an Azure SQL managed instance in the Business Critical tier", fr: "Créer une instance Azure SQL Managed Instance au niveau Business Critical" } }
    - { id: d, text: { en: "Create a virtual machine from a Windows Server image and connect it to Azure Arc", fr: "Créer une machine virtuelle à partir d'une image Windows Server et la connecter à Azure Arc" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A virtual machine deployed from an Azure Marketplace SQL Server image in the portal is registered automatically with the SQL IaaS Agent extension. The extension enables automated backup, Azure Key Vault integration and the other SQL settings in the portal, without installing SQL Server yourself.
    fr: |
      Une machine virtuelle déployée dans le portail à partir d'une image SQL Server de la Place de marché Azure est inscrite automatiquement auprès de l'extension SQL IaaS Agent. L'extension active la sauvegarde automatisée, l'intégration à Azure Key Vault et les autres paramètres SQL dans le portail, sans installer SQL Server vous-même.
  options:
    a: { en: "Installing SQL Server yourself adds deployment effort, and a manual backup to a file share doesn't use the portal-managed automated backup.", fr: "Installer SQL Server vous-même ajoute de l'effort de déploiement, et une sauvegarde manuelle vers un partage n'utilise pas la sauvegarde automatisée gérée depuis le portail." }
    c: { en: "A managed instance gives no access to the operating system, which the vendor application requires.", fr: "Une instance managée ne donne pas accès au système d'exploitation, ce qu'exige l'application de l'éditeur." }
    d: { en: "Azure Arc is for SQL Server outside Azure; Azure virtual machines aren't a supported Arc configuration, and SQL Server would still have to be installed.", fr: "Azure Arc est destiné à SQL Server hors d'Azure ; les machines virtuelles Azure ne sont pas une configuration Arc prise en charge, et SQL Server resterait à installer." }
references:
  - title: "What Is the SQL Server IaaS Agent Extension? (Windows) - SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/sql-server-iaas-agent-extension-automate-management
