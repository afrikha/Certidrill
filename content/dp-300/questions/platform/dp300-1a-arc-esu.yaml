id: dp300-1a-arc-esu
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove runs 12 SQL Server 2016 Enterprise instances on physical servers in its own datacenter. The instances use Software Assurance licenses. Extended support for SQL Server 2016 ended in July 2026.

    The instances must stay in the datacenter for two more years while the migration is planned. You need to ensure that the instances continue to receive security updates. The charges must appear on the company's Azure bill.

    What should you do?
  fr: |
    Woodgrove exécute 12 instances SQL Server 2016 Enterprise sur des serveurs physiques dans son propre centre de données. Les instances utilisent des licences avec Software Assurance. Le support étendu de SQL Server 2016 a pris fin en juillet 2026.

    Les instances doivent rester dans le centre de données deux ans de plus, le temps de planifier la migration. Vous devez faire en sorte que les instances continuent de recevoir des mises à jour de sécurité. Les frais doivent figurer sur la facture Azure de l'entreprise.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Register each server with the SQL IaaS Agent extension and enable Automated Patching", fr: "Inscrire chaque serveur auprès de l'extension SQL IaaS Agent et activer la mise à jour corrective automatisée" } }
    - { id: b, text: { en: "Connect the instances to Azure Arc and enable the Extended Security Updates subscription", fr: "Connecter les instances à Azure Arc et activer l'abonnement Extended Security Updates" } }
    - { id: c, text: { en: "Create a maintenance configuration in Azure Update Manager for the physical servers", fr: "Créer une configuration de maintenance dans Azure Update Manager pour les serveurs physiques" } }
    - { id: d, text: { en: "Assess the instances with Azure Migrate and enable continuous discovery", fr: "Évaluer les instances avec Azure Migrate et activer la découverte continue" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SQL Server enabled by Azure Arc offers an Extended Security Updates subscription for SQL Server 2014 and 2016, for up to three years after the end of support. It requires Software Assurance, a SQL Server subscription or pay-as-you-go licensing, and usage is billed through Azure.
    fr: |
      SQL Server activé par Azure Arc propose un abonnement Extended Security Updates pour SQL Server 2014 et 2016, jusqu'à trois ans après la fin du support. Il exige Software Assurance, un abonnement SQL Server ou des licences avec paiement à l'utilisation, et l'utilisation est facturée via Azure.
  options:
    a: { en: "The SQL IaaS Agent extension is for SQL Server on Azure virtual machines, not for physical servers in a datacenter.", fr: "L'extension SQL IaaS Agent est destinée à SQL Server sur les machines virtuelles Azure, pas aux serveurs physiques d'un centre de données." }
    c: { en: "Azure Update Manager can manage servers outside Azure only once they are Arc-enabled, and it doesn't provide the security updates of an out-of-support version without an ESU subscription.", fr: "Azure Update Manager ne gère des serveurs hors d'Azure qu'une fois activés par Arc, et il ne fournit pas les mises à jour de sécurité d'une version hors support sans abonnement ESU." }
    d: { en: "Azure Migrate discovers and assesses servers for migration; it doesn't deliver security updates.", fr: "Azure Migrate découvre et évalue des serveurs en vue d'une migration ; il ne fournit pas de mises à jour de sécurité." }
references:
  - title: "Extended Security Updates - SQL Server enabled by Azure Arc"
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/extended-security-updates
