id: dp300-sr1-idle-timesheets-3
objective: "1.2.1"
type: series_yesno
series: dp300-sr1-idle-timesheets
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You switch Timesheets to serverless with auto-pause disabled.
  fr: |
    Vous passez Timesheets en serverless avec la mise en pause automatique désactivée.
body:
  solution:
    en: |
      You change the compute tier of Timesheets to **Serverless** in the General Purpose service tier, you set the maximum vCores to **8**, and you set the auto-pause delay to **-1**.
    fr: |
      Vous changez le niveau de calcul de Timesheets en **Serverless** dans le niveau de service General Purpose, vous définissez le maximum de vCores sur **8** et le délai de mise en pause automatique sur **-1**.
answer: { value: false }
explanation:
  correct:
    en: |
      An auto-pause delay of -1 disables auto-pause, so the database stays online and is billed at least for its minimum vCores and memory every second, nights and weekends included. Compute costs during idle periods aren't minimized; a positive auto-pause delay would bring them to zero.
    fr: |
      Un délai de mise en pause automatique de -1 désactive la pause : la base reste en ligne et est facturée au moins pour ses vCores et sa mémoire minimum à chaque seconde, nuits et week-ends compris. Les coûts de calcul pendant l'inactivité ne sont pas réduits au minimum ; un délai positif les ramènerait à zéro.
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
