id: dp300-sr1-idle-timesheets-1
objective: "1.2.1"
type: series_yesno
series: dp300-sr1-idle-timesheets
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You move Timesheets into an 8-vCore elastic pool.
  fr: |
    Vous déplacez Timesheets dans un pool élastique de 8 vCores.
body:
  solution:
    en: |
      You create a General Purpose elastic pool with **8 vCores** on sql-fabrikam-hr, and you move Timesheets into the pool with a per-database maximum of 8 vCores.
    fr: |
      Vous créez un pool élastique General Purpose de **8 vCores** sur sql-fabrikam-hr, et vous déplacez Timesheets dans le pool avec un maximum par base de 8 vCores.
answer: { value: false }
explanation:
  correct:
    en: |
      An elastic pool is billed for each hour it exists at its provisioned vCores, regardless of usage, and it never pauses. With a single database, the pool costs as much as the current provisioned database and saves nothing at night or on weekends.
    fr: |
      Un pool élastique est facturé pour chaque heure d'existence selon ses vCores provisionnés, quelle que soit l'utilisation, et il ne se met jamais en pause. Avec une seule base, le pool coûte autant que la base provisionnée actuelle et n'économise rien la nuit ni le week-end.
references:
  - title: Elastic pools help you manage and scale multiple databases in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview
