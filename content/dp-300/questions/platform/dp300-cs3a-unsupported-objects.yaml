id: dp300-cs3a-unsupported-objects
objective: "1.3.1"
type: multi
caseStudy: dp300-cs3a-lamna-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating PolicyDB to meet the migration requirements.

    Which two objects must be redesigned before PolicyDB is migrated to sql-li-cac?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez PolicyDB pour satisfaire les exigences de migration.

    Quels sont les deux objets à reconcevoir avant la migration de PolicyDB vers sql-li-cac ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "dbo.Policies" }
    - { id: b, text: "dbo.PolicyHistory" }
    - { id: c, text: "dbo.QuoteSessions" }
    - { id: d, text: "RatingEngine" }
    - { id: e, text: "BrokerFilter" }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Azure SQL Database does not support CLR assemblies, so the RatingEngine logic must be rewritten, for example in T-SQL or in the application tier. In-Memory OLTP is available only in the Premium and Business Critical service tiers, and PolicyDB must stay in General Purpose, so the memory-optimized table dbo.QuoteSessions must become a disk-based table.
    fr: |
      Azure SQL Database ne prend pas en charge les assemblys CLR : la logique de RatingEngine doit être réécrite, par exemple en T-SQL ou dans la couche application. In-Memory OLTP n'est disponible qu'aux niveaux de service Premium et Business Critical, et PolicyDB doit rester en General Purpose : la table optimisée en mémoire dbo.QuoteSessions doit devenir une table sur disque.
  options:
    a: { en: "System-versioned temporal tables are supported in Azure SQL Database.", fr: "Les tables temporelles avec version système sont prises en charge dans Azure SQL Database." }
    b: { en: "Columnstore indexes are supported in the General Purpose service tier.", fr: "Les index columnstore sont pris en charge au niveau de service General Purpose." }
    e: { en: "Row-level security is supported in Azure SQL Database.", fr: "La sécurité au niveau des lignes est prise en charge dans Azure SQL Database." }
references:
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
