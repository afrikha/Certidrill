id: dp300-1a-shard-tenant-isolation
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip is building a SaaS application on Azure SQL Database for 400 customers (tenants). Most tenants have low average usage, and their peaks occur at different times.

    The contracts state the following requirements:

    - The data of each tenant must be stored in isolation from the data of other tenants.
    - A single tenant's data must be restorable to an earlier point in time without affecting other tenants.

    The solution must minimize cost. Which data architecture should you recommend?
  fr: |
    Wingtip développe une application SaaS sur Azure SQL Database pour 400 clients (locataires). La plupart des locataires ont une utilisation moyenne faible, et leurs pics surviennent à des moments différents.

    Les contrats imposent les exigences suivantes :

    - Les données de chaque locataire doivent être stockées de façon isolée des données des autres locataires.
    - Les données d'un seul locataire doivent pouvoir être restaurées à un point antérieur dans le temps sans affecter les autres locataires.

    La solution doit réduire les coûts au minimum. Quelle architecture de données devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One multitenant database that stores a TenantId column in every table and uses row-level security", fr: "Une base multilocataire qui stocke une colonne TenantId dans chaque table et utilise la sécurité au niveau des lignes" } }
    - { id: b, text: { en: "One database per tenant, with the databases grouped in elastic pools", fr: "Une base par locataire, les bases étant regroupées dans des pools élastiques" } }
    - { id: c, text: { en: "One Hyperscale database whose tables are partitioned on a TenantId column", fr: "Une base Hyperscale dont les tables sont partitionnées sur une colonne TenantId" } }
    - { id: d, text: { en: "One single database per tenant, each provisioned for the peak load of its tenant", fr: "Une base unique par locataire, chacune provisionnée pour le pic de charge de son locataire" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The single-tenant sharding pattern stores each tenant in its own database, which provides isolation, backup and restore, and scaling at the granularity of the tenant. Placing the databases in elastic pools shares resources among tenants whose peaks don't overlap, which minimizes cost.
    fr: |
      Le modèle de sharding monolocataire stocke chaque locataire dans sa propre base, ce qui fournit l'isolation, la sauvegarde et la restauration, et la mise à l'échelle à la granularité du locataire. Regrouper les bases dans des pools élastiques partage les ressources entre locataires dont les pics ne se chevauchent pas, ce qui réduit les coûts.
  options:
    a: { en: "Row-level security filters rows but doesn't isolate storage, and a database restore can't bring back one tenant out of a multitenant database.", fr: "La sécurité au niveau des lignes filtre des lignes mais n'isole pas le stockage, et une restauration de base ne peut pas récupérer un seul locataire d'une base multilocataire." }
    c: { en: "Partitioning keeps all tenants in one database, so point-in-time restore applies to every tenant at once.", fr: "Le partitionnement garde tous les locataires dans une seule base : la restauration à un point dans le temps s'applique à tous les locataires à la fois." }
    d: { en: "Separate databases meet the isolation and restore requirements, but provisioning each one for its own peak costs much more than sharing resources in a pool.", fr: "Des bases séparées satisfont l'isolation et la restauration, mais provisionner chacune pour son propre pic coûte bien plus que de partager les ressources dans un pool." }
references:
  - title: "Scaling out - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-scale-introduction
