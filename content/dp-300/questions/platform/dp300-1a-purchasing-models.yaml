id: dp300-1a-purchasing-models
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind is comparing the DTU-based and vCore-based purchasing models of Azure SQL Database for several new databases.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind compare les modèles d'achat DTU et vCore d'Azure SQL Database pour plusieurs nouvelles bases de données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can apply Azure Hybrid Benefit for SQL Server to a database in the Standard tier to reduce its cost.
        fr: Vous pouvez appliquer Azure Hybrid Benefit pour SQL Server à une base de données du niveau Standard pour réduire son coût.
    - id: s2
      text:
        en: A database in the Basic tier can store up to 2 GB of data.
        fr: Une base de données du niveau Basic peut stocker jusqu'à 2 Go de données.
    - id: s3
      text:
        en: A database in the Premium tier can use the serverless compute tier to pause automatically when it is idle.
        fr: Une base de données du niveau Premium peut utiliser le niveau de calcul serverless pour se suspendre automatiquement lorsqu'elle est inactive.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Standard, Basic and Premium are tiers of the DTU model. Azure Hybrid Benefit and the serverless compute tier are available only in the vCore model, so neither applies to a Standard or Premium database. A Basic database has a maximum size of 2 GB (Standard goes to 1 TB and Premium to 4 TB).
    fr: |
      Standard, Basic et Premium sont des niveaux du modèle DTU. Azure Hybrid Benefit et le niveau de calcul serverless ne sont disponibles que dans le modèle vCore : aucun des deux ne s'applique à une base Standard ou Premium. Une base Basic a une taille maximale de 2 Go (Standard va jusqu'à 1 To et Premium jusqu'à 4 To).
references:
  - title: "DTU-Based Purchasing Model - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-dtu
