id: dp300-sr2-orders-relocation-3
objective: "1.3.7"
type: series_yesno
series: dp300-sr2-orders-relocation
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You use the Move option of the Azure portal and complete the move.
  fr: |
    Vous utilisez l'option Move du portail Azure et terminez le déplacement.
body:
  solution:
    en: |
      In the Azure portal, you select OrdersDb on MI1, select **Move**, and choose MI2 in Sub2 as the destination. When the operation status is **Ready for completion**, you complete the operation, and then you redirect the application to MI2.
    fr: |
      Dans le portail Azure, vous sélectionnez OrdersDb sur MI1, sélectionnez **Move**, puis choisissez MI2 dans Sub2 comme destination. Quand l'état de l'opération est **Ready for completion**, vous terminez l'opération, puis vous redirigez l'application vers MI2.
answer: { value: true }
explanation:
  correct:
    en: |
      A database move seeds OrdersDb online to MI2 and keeps replicating changes while the application runs. At completion, the source stops accepting workload, the remaining transactions are replicated, the destination comes online and the source database is dropped. Moves are supported across subscriptions of the same tenant when both instances are in the same region; the operation must be completed within 24 hours.
    fr: |
      Un déplacement de base amorce OrdersDb en ligne sur MI2 et continue de répliquer les modifications pendant que l'application fonctionne. À la fin, la source cesse d'accepter la charge de travail, les dernières transactions sont répliquées, la destination passe en ligne et la base source est supprimée. Le déplacement est pris en charge entre abonnements d'un même locataire quand les deux instances sont dans la même région ; l'opération doit être terminée dans les 24 heures.
references:
  - title: "Copy or move a database - Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
