id: dp300-cs3c-adverse-events-db
objective: "1.1.4"
type: single
caseStudy: dp300-cs3c-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a database for the adverse event application that meets the requirements for the new application.

    What should you recommend?
  fr: |
    Vous devez recommander une base de données pour l'application d'événements indésirables qui respecte les exigences de la nouvelle application.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Fabric warehouse in the Clinical Analytics workspace", fr: "Un entrepôt Fabric dans l'espace de travail Clinical Analytics" } }
    - { id: b, text: { en: "A new database on MI-TRIALS, mirrored to the Clinical Analytics workspace", fr: "Une nouvelle base de données sur MI-TRIALS, mise en miroir dans l'espace de travail Clinical Analytics" } }
    - { id: c, text: { en: "A SQL database in Microsoft Fabric in the Clinical Analytics workspace", fr: "Une base de données SQL dans Microsoft Fabric dans l'espace de travail Clinical Analytics" } }
    - { id: d, text: { en: "A serverless Azure SQL Database, mirrored to the Clinical Analytics workspace", fr: "Une base de données Azure SQL Database serverless, mise en miroir dans l'espace de travail Clinical Analytics" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SQL database in Microsoft Fabric is the Fabric item for operational (OLTP) workloads. It uses the same SQL Database Engine as Azure SQL Database, it is created in a Fabric workspace and runs on the Fabric capacity, and its data is replicated automatically to OneLake in near real time in an analytics-ready format, with no pipeline to build.
    fr: |
      La base de données SQL dans Microsoft Fabric est l'élément Fabric destiné aux charges de travail opérationnelles (OLTP). Elle utilise le même moteur de base de données SQL qu'Azure SQL Database, elle est créée dans un espace de travail Fabric et s'exécute sur la capacité Fabric, et ses données sont répliquées automatiquement dans OneLake en quasi-temps réel dans un format prêt pour l'analytique, sans pipeline à créer.
  options:
    a: { en: "A Fabric warehouse is designed for analytical workloads and does not enforce primary key and foreign key constraints.", fr: "Un entrepôt Fabric est conçu pour les charges de travail analytiques et n'applique pas les contraintes de clé primaire et de clé étrangère." }
    b: { en: "The database would live in an Azure resource billed outside the Fabric capacity and managed outside the workspace.", fr: "La base de données résiderait dans une ressource Azure facturée hors de la capacité Fabric et gérée hors de l'espace de travail." }
    d: { en: "A new Azure SQL Database is a new Azure resource, billed separately from the Fabric capacity, which the requirements forbid.", fr: "Une nouvelle base Azure SQL Database est une nouvelle ressource Azure, facturée séparément de la capacité Fabric, ce que les exigences interdisent." }
references:
  - title: SQL database in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/sql/overview
  - title: Primary keys, foreign keys, and unique keys in Warehouse in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/table-constraints
