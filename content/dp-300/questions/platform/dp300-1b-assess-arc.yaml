id: dp300-1b-assess-arc
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has 60 SQL Server 2019 instances that run on Windows Server 2022, in an on-premises datacenter and in another public cloud. All the instances are connected to Azure Arc and have the Azure extension for SQL Server installed.

    You need to obtain, for each instance, a migration readiness report, a recommended Azure SQL target and a monthly cost estimate. The solution must minimize cost and administrative effort.

    What should you do?
  fr: |
    Proseware dispose de 60 instances SQL Server 2019 qui s'exécutent sur Windows Server 2022, dans un centre de données local et dans un autre cloud public. Toutes les instances sont connectées à Azure Arc et l'extension Azure pour SQL Server y est installée.

    Vous devez obtenir, pour chaque instance, un rapport de préparation à la migration, une cible Azure SQL recommandée et une estimation de coût mensuel. La solution doit réduire au minimum le coût et l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Deploy an Azure Migrate appliance in each location and run a discovery.", fr: "Déployer une appliance Azure Migrate dans chaque emplacement et lancer une découverte." } }
    - { id: b, text: { en: "Create an Azure Database Migration Service instance and run a migration for each instance.", fr: "Créer une instance Azure Database Migration Service et lancer une migration pour chaque instance." } }
    - { id: c, text: { en: "Review the migration assessment of each SQL Server resource enabled by Azure Arc.", fr: "Consulter l'évaluation de migration de chaque ressource SQL Server activée par Azure Arc." } }
    - { id: d, text: { en: "Collect performance counters on each instance with Logman and size the targets manually.", fr: "Collecter les compteurs de performances sur chaque instance avec Logman et dimensionner les cibles manuellement." } }
answer: { optionId: c }
explanation:
  correct:
    en: SQL Server enabled by Azure Arc generates a migration assessment automatically, once a week by default, at no cost for all editions. It reports readiness, recommends Azure SQL Managed Instance, SQL Database or SQL Server on Azure VM configurations with sizing, and estimates monthly costs, in the **Migration** > **Assessments** section of each Arc-enabled SQL Server resource.
    fr: "SQL Server activé par Azure Arc génère automatiquement une évaluation de migration, une fois par semaine par défaut, gratuitement pour toutes les éditions. Elle indique la préparation, recommande des configurations Azure SQL Managed Instance, SQL Database ou SQL Server sur machine virtuelle Azure avec leur dimensionnement, et estime les coûts mensuels, dans la section **Migration** > **Assessments** de chaque ressource SQL Server activée par Arc."
  options:
    a: { en: "Azure Migrate would work, but deploying appliances in two locations adds effort when the Arc assessment already exists.", fr: "Azure Migrate fonctionnerait, mais déployer des appliances dans deux emplacements ajoute de l'effort alors que l'évaluation Arc existe déjà." }
    b: { en: "Database Migration Service migrates databases; its portal version doesn't provide assessment or SKU recommendations.", fr: "Database Migration Service migre des bases de données ; sa version portail ne fournit ni évaluation ni recommandation de SKU." }
    d: { en: "A Logman baseline gives raw performance data only; manual sizing and costing for 60 instances maximizes effort.", fr: "Une référence Logman ne fournit que des données de performances brutes ; dimensionner et chiffrer 60 instances à la main maximise l'effort." }
references:
  - title: Assess migration readiness - SQL Server enabled by Azure Arc
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/migration-assessment
