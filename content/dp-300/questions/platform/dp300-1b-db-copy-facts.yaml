id: dp300-1b-db-copy-facts
objective: "1.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to create copies of Azure SQL databases for test environments by using the database copy feature of Azure SQL Database.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer des copies de bases de données Azure SQL pour des environnements de test à l'aide de la fonctionnalité de copie de base de données d'Azure SQL Database.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can use the Azure portal to copy a database to a logical server in a different subscription.
        fr: Vous pouvez utiliser le portail Azure pour copier une base de données vers un serveur logique d'un autre abonnement.
    - id: s2
      text:
        en: After a copy to another logical server, contained database users of the source can sign in to the copy without remapping.
        fr: Après une copie vers un autre serveur logique, les utilisateurs de base de données autonome de la source peuvent se connecter à la copie sans remappage.
    - id: s3
      text:
        en: A database in the Standard tier can be copied to a database in the General Purpose tier.
        fr: Une base de données du niveau Standard peut être copiée vers une base de données du niveau General Purpose.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The Azure portal, PowerShell and the Azure CLI don't support copying to a different subscription; that requires Transact-SQL with a login that has the same name, password and SID on both servers. All users, permissions and SIDs are copied, and contained database users keep working immediately, whereas users mapped to server logins might need remapping. A Standard database can be copied to Standard or General Purpose.
    fr: "Le portail Azure, PowerShell et Azure CLI ne prennent pas en charge la copie vers un autre abonnement ; il faut Transact-SQL avec une connexion qui a le même nom, le même mot de passe et le même SID sur les deux serveurs. Tous les utilisateurs, autorisations et SID sont copiés, et les utilisateurs de base de données autonome fonctionnent immédiatement, alors que les utilisateurs associés à des connexions de serveur peuvent devoir être remappés. Une base Standard peut être copiée vers Standard ou General Purpose."
references:
  - title: Copy a transactionally consistent copy of a database in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/database-copy
