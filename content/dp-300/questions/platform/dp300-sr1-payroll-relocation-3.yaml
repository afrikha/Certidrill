id: dp300-sr1-payroll-relocation-3
objective: "1.3.7"
type: series_yesno
series: dp300-sr1-payroll-relocation
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You restore Payroll to the other instance with point-in-time restore.
  fr: |
    Vous restaurez Payroll sur l'autre instance par restauration à un point dans le temps.
body:
  solution:
    en: |
      On Saturday at 22:00, while the application is still connected to sqlmi-adatum-hr, you start a cross-instance **point-in-time restore** of Payroll to sqlmi-adatum-core at the latest restore point. When the restore finishes, you reconfigure the application and delete Payroll from sqlmi-adatum-hr.
    fr: |
      Le samedi à 22:00, alors que l'application est toujours connectée à sqlmi-adatum-hr, vous démarrez une **restauration à un point dans le temps** inter-instances de Payroll vers sqlmi-adatum-core au dernier point de restauration. Une fois la restauration terminée, vous reconfigurez l'application et supprimez Payroll de sqlmi-adatum-hr.
answer: { value: false }
explanation:
  correct:
    en: |
      Point-in-time restore creates a new database that contains the data as of the chosen point. Transactions committed on sqlmi-adatum-hr after that point, including those written while the restore runs, aren't in the restored database and are lost when the source is deleted. A move operation guarantees that the last transactions are replicated before the source is dropped.
    fr: |
      La restauration à un point dans le temps crée une nouvelle base qui contient les données telles qu'elles étaient au point choisi. Les transactions validées sur sqlmi-adatum-hr après ce point, y compris celles écrites pendant la restauration, ne figurent pas dans la base restaurée et sont perdues quand la source est supprimée. Une opération de déplacement garantit que les dernières transactions sont répliquées avant la suppression de la source.
references:
  - title: Restore a database in Azure SQL Managed Instance to a previous point in time
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/point-in-time-restore
