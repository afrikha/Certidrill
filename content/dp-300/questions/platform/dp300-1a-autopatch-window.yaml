id: dp300-1a-autopatch-window
objective: "1.1.9"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You have a SQL Server virtual machine named **SQLVM1** in a resource group named **RG1**. Until its migration to Azure Update Manager next quarter, SQLVM1 must keep using Automated Patching with the following maintenance window:

    - Every Sunday
    - Start at 2:00 AM local time
    - A duration of 150 minutes

    How should you complete the Azure PowerShell command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une machine virtuelle SQL Server nommée **SQLVM1** dans un groupe de ressources nommé **RG1**. Jusqu'à sa migration vers Azure Update Manager au prochain trimestre, SQLVM1 doit continuer d'utiliser Automated Patching avec la fenêtre de maintenance suivante :

    - Tous les dimanches
    - Début à 2 h 00, heure locale
    - Une durée de 150 minutes

    Comment devez-vous compléter la commande Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Update-AzSqlVM -ResourceGroupName 'RG1' -Name 'SQLVM1' `
      -AutoPatchingSettingDayOfWeek [[day]] `
      -AutoPatchingSettingMaintenanceWindowStartingHour [[hour]] `
      -AutoPatchingSettingMaintenanceWindowDuration [[dur]] `
      -AutoPatchingSettingEnable
  slots:
    - id: day
      options:
        - { id: everyday, text: Everyday }
        - { id: saturday, text: Saturday }
        - { id: sunday, text: Sunday }
    - id: hour
      options:
        - { id: h2, text: "2" }
        - { id: h14, text: "14" }
        - { id: h200, text: "200" }
    - id: dur
      options:
        - { id: d2, text: "2.5" }
        - { id: d150, text: "150" }
        - { id: d240, text: "240" }
answer:
  values: { day: sunday, hour: h2, dur: d150 }
explanation:
  correct:
    en: |
      The maintenance schedule accepts Everyday or a day of the week, here Sunday. The starting hour is the local start hour as a number from 0 to 24, so 2 means 2:00 AM. The window duration is expressed in minutes, from 30 to 180, so 150 sets a window of two and a half hours.
    fr: |
      La planification de maintenance accepte Everyday ou un jour de la semaine, ici Sunday. L'heure de début est l'heure locale sous forme de nombre de 0 à 24 : 2 signifie 2 h 00. La durée de la fenêtre s'exprime en minutes, de 30 à 180 : 150 définit une fenêtre de deux heures et demie.
  options:
    everyday: { en: "Everyday would patch on every day of the week.", fr: "Everyday appliquerait les correctifs tous les jours de la semaine." }
    h14: { en: "14 is 2:00 PM.", fr: "14 correspond à 14 h 00." }
    h200: { en: "The starting hour is a number from 0 to 24, not a clock time like 2:00 written as 200.", fr: "L'heure de début est un nombre de 0 à 24, pas une heure écrite 200 pour 2:00." }
    d2: { en: "The duration is in minutes, not hours.", fr: "La durée s'exprime en minutes, pas en heures." }
    d240: { en: "The window duration can't exceed 180 minutes, and 240 isn't the requested duration.", fr: "La durée de la fenêtre ne peut pas dépasser 180 minutes, et 240 n'est pas la durée demandée." }
references:
  - title: "Automated Patching - SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/automated-patching
