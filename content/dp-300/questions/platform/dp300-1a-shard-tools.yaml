id: dp300-1a-shard-tools
objective: "1.1.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso shards customer data across 60 databases in Azure SQL Database by using CustomerId as the sharding key.

    You need to recommend a tool for each task. Which tool should you recommend for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso répartit (sharding) les données client entre 60 bases de données Azure SQL Database en utilisant CustomerId comme clé de sharding.

    Vous devez recommander un outil pour chaque tâche. Quel outil devez-vous recommander pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lib, text: { en: "Elastic Database client library", fr: "Bibliothèque cliente Elastic Database" } }
    - { id: split, text: { en: "Split-merge tool", fr: "Outil de fractionnement-fusion (split-merge)" } }
    - { id: jobs, text: { en: "Elastic jobs", fr: "Travaux élastiques" } }
    - { id: query, text: { en: "Elastic query", fr: "Requête élastique" } }
    - { id: geo, text: { en: "Active geo-replication", fr: "Géoréplication active" } }
  targets:
    - { id: route, text: { en: "Route each application request to the database that holds the customer", fr: "Router chaque requête de l'application vers la base qui contient le client" } }
    - { id: move, text: { en: "Move the rows of a large customer from a multitenant database to a new database", fr: "Déplacer les lignes d'un gros client d'une base multilocataire vers une nouvelle base" } }
    - { id: schema, text: { en: "Apply the same schema change to every shard on a schedule", fr: "Appliquer la même modification de schéma à chaque shard selon une planification" } }
    - { id: report, text: { en: "Run a Transact-SQL query that spans all the shards for a reporting tool", fr: "Exécuter une requête Transact-SQL qui couvre tous les shards pour un outil de reporting" } }
answer:
  mapping: { route: lib, move: split, schema: jobs, report: query }
explanation:
  correct:
    en: |
      The Elastic Database client library maintains the shard map and provides data-dependent routing to the right database. The split-merge tool moves data between shards, for example from a multitenant to a single-tenant database. Elastic jobs run administrative scripts such as schema changes across many databases. Elastic query (preview) runs a Transact-SQL query that spans several databases.
    fr: |
      La bibliothèque cliente Elastic Database gère la carte de partitions (shard map) et fournit le routage dépendant des données vers la bonne base. L'outil de fractionnement-fusion déplace des données entre shards, par exemple d'une base multilocataire vers une base monolocataire. Les travaux élastiques exécutent des scripts d'administration, comme des modifications de schéma, sur de nombreuses bases. La requête élastique (préversion) exécute une requête Transact-SQL qui couvre plusieurs bases.
  options:
    geo: { en: "Active geo-replication creates readable copies of a database in other regions; it doesn't route, move or query sharded data.", fr: "La géoréplication active crée des copies lisibles d'une base dans d'autres régions ; elle ne route, ne déplace ni n'interroge des données partitionnées." }
references:
  - title: "Scaling out - Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-scale-introduction
