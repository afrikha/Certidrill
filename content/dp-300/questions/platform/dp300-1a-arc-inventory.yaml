id: dp300-1a-arc-inventory
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has 300 SQL Server instances. Some run on VMware virtual machines in its datacenters, and the others run on virtual machines in another public cloud.

    You need to manage all the instances from Azure. The solution must meet the following requirements:

    - Show every instance and its databases in the Azure portal and allow queries by using Azure Resource Graph.
    - Allow the use of Azure role-based access control (Azure RBAC) and Azure Policy on the instances.

    What should you use?
  fr: |
    Proseware possède 300 instances SQL Server. Certaines s'exécutent sur des machines virtuelles VMware dans ses centres de données, les autres sur des machines virtuelles d'un autre cloud public.

    Vous devez gérer toutes les instances depuis Azure. La solution doit satisfaire aux exigences suivantes :

    - Afficher chaque instance et ses bases de données dans le portail Azure et permettre des requêtes avec Azure Resource Graph.
    - Permettre l'utilisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC) et d'Azure Policy sur les instances.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "SQL Server enabled by Azure Arc", fr: "SQL Server activé par Azure Arc" } }
    - { id: b, text: { en: "The SQL IaaS Agent extension", fr: "L'extension SQL IaaS Agent" } }
    - { id: c, text: { en: "Azure Monitor database watcher", fr: "L'observateur de base de données Azure Monitor (database watcher)" } }
    - { id: d, text: { en: "Azure Database Migration Service", fr: "Azure Database Migration Service" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Arc projects each SQL Server instance running outside Azure, and its databases, as Azure resources. They appear in the portal and in Azure Resource Graph, and you can manage them with Azure RBAC, tags and Azure Policy like native resources.
    fr: |
      Azure Arc projette chaque instance SQL Server exécutée hors d'Azure, ainsi que ses bases de données, sous forme de ressources Azure. Elles apparaissent dans le portail et dans Azure Resource Graph, et vous pouvez les gérer avec Azure RBAC, les étiquettes et Azure Policy comme des ressources natives.
  options:
    b: { en: "The SQL IaaS Agent extension manages SQL Server on Azure virtual machines only.", fr: "L'extension SQL IaaS Agent ne gère que SQL Server sur les machines virtuelles Azure." }
    c: { en: "Database watcher monitors Azure SQL databases and managed instances; it doesn't make SQL Server outside Azure manageable as Azure resources.", fr: "L'observateur de base de données supervise les bases Azure SQL et les instances managées ; il ne rend pas SQL Server hors d'Azure gérable comme des ressources Azure." }
    d: { en: "Database Migration Service moves databases to Azure; it doesn't provide ongoing management of instances that stay where they are.", fr: "Database Migration Service déplace des bases de données vers Azure ; il n'assure pas la gestion continue d'instances qui restent en place." }
references:
  - title: "Overview - SQL Server enabled by Azure Arc"
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/overview
