id: dp300-1a-partition-sqldb-design
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin plans to partition a 900 GB table named **dbo.Shipments** in an Azure SQL Database database. The table will have a unique nonclustered index on **ShipmentNumber**, and the team wants to switch old partitions out to an archive table.

    Which two statements about the plan are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin prévoit de partitionner une table de 900 Go nommée **dbo.Shipments** dans une base de données Azure SQL Database. La table aura un index non cluster unique sur **ShipmentNumber**, et l'équipe souhaite basculer les anciennes partitions vers une table d'archive.

    Quelles sont les deux affirmations vraies concernant ce plan ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Every partition must be mapped to the PRIMARY filegroup.", fr: "Chaque partition doit être mappée au groupe de fichiers PRIMARY." } }
    - { id: b, text: { en: "Older partitions can be mapped to a filegroup on lower-cost storage.", fr: "Les partitions les plus anciennes peuvent être mappées à un groupe de fichiers sur un stockage moins coûteux." } }
    - { id: c, text: { en: "To partition the unique index, its key must contain the partitioning column.", fr: "Pour partitionner l'index unique, sa clé doit contenir la colonne de partitionnement." } }
    - { id: d, text: { en: "A partition function with 12 boundary values creates 12 partitions.", fr: "Une fonction de partition avec 12 valeurs limites crée 12 partitions." } }
    - { id: e, text: { en: "The partitions of the table can be placed in different databases of the same logical server.", fr: "Les partitions de la table peuvent être placées dans différentes bases de données du même serveur logique." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Azure SQL Database provides only the PRIMARY filegroup, so the partition scheme maps every partition to PRIMARY. A unique nonclustered index can be partitioned (and therefore aligned with the table for switching) only if its key contains the partitioning column.
    fr: |
      Azure SQL Database ne fournit que le groupe de fichiers PRIMARY : le schéma de partition mappe chaque partition à PRIMARY. Un index non cluster unique ne peut être partitionné (et donc aligné sur la table pour le basculement) que si sa clé contient la colonne de partitionnement.
  options:
    b: { en: "Placing partitions on different filegroups requires SQL Server or Managed Instance; Azure SQL Database has only PRIMARY.", fr: "Placer des partitions sur différents groupes de fichiers exige SQL Server ou Managed Instance ; Azure SQL Database n'a que PRIMARY." }
    d: { en: "n boundary values create n + 1 partitions, so 12 boundaries create 13 partitions.", fr: "n valeurs limites créent n + 1 partitions : 12 limites créent 13 partitions." }
    e: { en: "Partitioning stays inside one database; spreading rows across databases is sharding.", fr: "Le partitionnement reste dans une seule base ; répartir des lignes entre bases relève du sharding." }
references:
  - title: "Partitioned Tables and Indexes - SQL Server, Azure SQL Database, Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes
