id: dp300-cs2b-cu-patching
objective: "1.1.9"
type: single
caseStudy: dp300-cs2b-fabrikam-plants
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a patching solution for SQLN1 and SQLN2 that meets the patching requirements.

    What should you recommend?
  fr: |
    Vous devez recommander pour SQLN1 et SQLN2 une solution de mise à jour qui satisfait les exigences de mise à jour.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Update Manager with one maintenance configuration that contains SQLN1 and SQLN2", fr: "Azure Update Manager avec une configuration de maintenance qui contient SQLN1 et SQLN2" } }
    - { id: b, text: { en: "Azure Update Manager with one maintenance configuration per node, scheduled on different days", fr: "Azure Update Manager avec une configuration de maintenance par nœud, planifiées des jours différents" } }
    - { id: c, text: { en: "Automated Patching of the SQL IaaS Agent extension, with a different maintenance window on each node", fr: "La mise à jour corrective automatisée (Automated Patching) de l'extension SQL IaaS Agent, avec une fenêtre de maintenance différente sur chaque nœud" } }
    - { id: d, text: { en: "Automated Patching of the SQL IaaS Agent extension, with the same maintenance window on both nodes", fr: "La mise à jour corrective automatisée (Automated Patching) de l'extension SQL IaaS Agent, avec la même fenêtre de maintenance sur les deux nœuds" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Update Manager installs Windows updates and SQL Server cumulative updates on a schedule defined by a maintenance configuration. Assigning each node to its own maintenance configuration, on a different day, guarantees that SQLN1 and SQLN2 are never patched at the same time, so the FCI role can keep running on the other node.
    fr: |
      Azure Update Manager installe les mises à jour Windows et les mises à jour cumulatives SQL Server selon une planification définie par une configuration de maintenance. Affecter chaque nœud à sa propre configuration de maintenance, un jour différent, garantit que SQLN1 et SQLN2 ne sont jamais mis à jour en même temps : le rôle FCI peut continuer à s'exécuter sur l'autre nœud.
  options:
    a: { en: "A single maintenance configuration patches both nodes in the same window, so both could restart at the same time.", fr: "Une configuration de maintenance unique met à jour les deux nœuds dans la même fenêtre : ils pourraient redémarrer en même temps." }
    c: { en: "Automated Patching installs only updates marked Important or Critical, not every cumulative update, and it is scheduled for retirement, so it must not be used for new deployments.", fr: "Automated Patching n'installe que les mises à jour marquées Important ou Critical, pas toutes les mises à jour cumulatives, et sa mise hors service est planifiée : il ne doit pas être utilisé pour de nouveaux déploiements." }
    d: { en: "Automated Patching is scheduled for retirement and does not install every cumulative update; the same window would also patch both nodes at once.", fr: "La mise hors service d'Automated Patching est planifiée et il n'installe pas toutes les mises à jour cumulatives ; la même fenêtre mettrait en outre à jour les deux nœuds à la fois." }
references:
  - title: Automated Patching - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/automated-patching
