id: dp300-1b-replication-sqldb
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to migrate a database named **InventoryDb** from an on-premises SQL Server 2019 instance to Azure SQL Database with minimal downtime by using transactional replication.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de migrer une base de données nommée **InventoryDb** d'une instance SQL Server 2019 locale vers Azure SQL Database avec un temps d'arrêt minimal, à l'aide de la réplication transactionnelle.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Azure SQL database must be configured as a push subscriber.", fr: "La base de données Azure SQL doit être configurée comme abonné par envoi (push)." } }
    - { id: b, text: { en: "The distribution database can be hosted on the Azure SQL Database logical server.", fr: "La base de données de distribution peut être hébergée sur le serveur logique Azure SQL Database." } }
    - { id: c, text: { en: "Every published table must have a primary key.", fr: "Chaque table publiée doit avoir une clé primaire." } }
    - { id: d, text: { en: "The publication can be configured from the Azure portal.", fr: "La publication peut être configurée depuis le portail Azure." } }
    - { id: e, text: { en: "The Distribution Agent can run as a pull subscription agent on the Azure SQL database.", fr: "L'Agent de distribution peut s'exécuter comme agent d'abonnement par extraction (pull) sur la base de données Azure SQL." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Azure SQL Database can only be a push subscriber in a one-way transactional or snapshot topology, and replicated tables must have a primary key. The publisher and distributor are SQL Server (here the on-premises instance), and replication is configured and monitored from SQL Server with SQL Server Management Studio or Transact-SQL.
    fr: Azure SQL Database ne peut être qu'un abonné par envoi (push) dans une topologie transactionnelle ou de capture instantanée unidirectionnelle, et les tables répliquées doivent avoir une clé primaire. Le serveur de publication et le serveur de distribution sont SQL Server (ici l'instance locale), et la réplication se configure et se supervise depuis SQL Server avec SQL Server Management Studio ou Transact-SQL.
  options:
    b: { en: "Azure SQL Database can't be a distributor, and the distribution database can't run on it.", fr: "Azure SQL Database ne peut pas être serveur de distribution, et la base de distribution ne peut pas s'y exécuter." }
    d: { en: "The Azure portal can't configure replication; use SSMS or Transact-SQL on the publisher.", fr: "Le portail Azure ne peut pas configurer la réplication ; utilisez SSMS ou Transact-SQL sur le serveur de publication." }
    e: { en: "Only push subscriptions to Azure SQL Database are supported, and replication agents can't run on it.", fr: "Seuls les abonnements par envoi vers Azure SQL Database sont pris en charge, et les agents de réplication ne peuvent pas s'y exécuter." }
references:
  - title: Replication to Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/replication-to-sql-database
