id: dp300-1b-orphaned-users
objective: "1.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You migrated a database named **PortalDb** from an on-premises SQL Server 2017 instance to SQL Server 2022 on an Azure virtual machine by using backup and restore. On the virtual machine, you created a SQL Server login named AppUser with the same name and password as on the source server.

    The application can't access PortalDb when it signs in as AppUser. PortalDb contains a database user named AppUser, but its SID doesn't match any login on the virtual machine.

    You need to restore access for the application. The solution must keep the permissions granted to the AppUser database user.

    What should you run in PortalDb?
  fr: |
    Vous avez migré une base de données nommée **PortalDb** d'une instance SQL Server 2017 locale vers SQL Server 2022 sur une machine virtuelle Azure, par sauvegarde et restauration. Sur la machine virtuelle, vous avez créé une connexion SQL Server nommée AppUser, avec le même nom et le même mot de passe que sur le serveur source.

    L'application ne peut pas accéder à PortalDb lorsqu'elle se connecte en tant qu'AppUser. PortalDb contient un utilisateur de base de données nommé AppUser, mais son SID ne correspond à aucune connexion de la machine virtuelle.

    Vous devez rétablir l'accès de l'application. La solution doit conserver les autorisations accordées à l'utilisateur de base de données AppUser.

    Que devez-vous exécuter dans PortalDb ?
body:
  options:
    - { id: a, text: "CREATE USER [AppUser] FOR LOGIN [AppUser];" }
    - { id: b, text: "ALTER USER [AppUser] WITH LOGIN = [AppUser];" }
    - { id: c, text: "ALTER LOGIN [AppUser] ENABLE;" }
    - { id: d, text: "GRANT CONNECT TO [AppUser];" }
answer: { optionId: b }
explanation:
  correct:
    en: Restoring a database on another instance orphans its users when the logins were created there with different SIDs. `ALTER USER ... WITH LOGIN` remaps the existing database user to the new login and keeps the user's permissions; it replaces the deprecated sp_change_users_login procedure.
    fr: Restaurer une base sur une autre instance rend ses utilisateurs orphelins lorsque les connexions y ont été créées avec des SID différents. `ALTER USER ... WITH LOGIN` réassocie l'utilisateur de base de données existant à la nouvelle connexion et conserve ses autorisations ; cette instruction remplace la procédure dépréciée sp_change_users_login.
  options:
    a: { en: "A user named AppUser already exists in PortalDb, so CREATE USER fails; dropping and re-creating it would lose its permissions.", fr: "Un utilisateur nommé AppUser existe déjà dans PortalDb : CREATE USER échoue, et le supprimer pour le recréer ferait perdre ses autorisations." }
    c: { en: "The login is new and enabled; the problem is the SID mismatch between the login and the database user.", fr: "La connexion est nouvelle et activée ; le problème est la différence de SID entre la connexion et l'utilisateur de base de données." }
    d: { en: "The orphaned user isn't mapped to the login, so granting CONNECT to it doesn't let the login use the database.", fr: "L'utilisateur orphelin n'est pas associé à la connexion : lui accorder CONNECT ne permet pas à la connexion d'utiliser la base." }
references:
  - title: Troubleshoot orphaned users (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/sql-server/failover-clusters/troubleshoot-orphaned-users-sql-server
