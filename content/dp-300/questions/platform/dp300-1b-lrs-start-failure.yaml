id: dp300-1b-lrs-start-failure
objective: "1.3.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You are migrating a database named **FinanceDb** from SQL Server 2019 to an Azure SQL managed instance named MI1 by using Log Replay Service (LRS) in continuous mode. The configuration is shown in the following table.

    | Setting | Value |
    | --- | --- |
    | Storage URI | https://stnorthwind.blob.core.windows.net/sqlmig/backups/FinanceDb |
    | SAS token permissions | Read, List |
    | SAS token validity | From one week before to one month after the migration start |
    | Backup files | One full backup and several log backups, all taken WITH CHECKSUM, in the FinanceDb folder |
    | Databases on MI1 | FinanceDb (restored during a test last month), HRDb |

    The LRS start command fails.

    Which two issues cause the failure?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous migrez une base de données nommée **FinanceDb** de SQL Server 2019 vers une instance managée Azure SQL nommée MI1 avec Log Replay Service (LRS) en mode continu. La configuration figure dans le tableau suivant.

    | Paramètre | Valeur |
    | --- | --- |
    | URI de stockage | https://stnorthwind.blob.core.windows.net/sqlmig/backups/FinanceDb |
    | Autorisations du jeton SAS | Read, List |
    | Validité du jeton SAS | D'une semaine avant à un mois après le début de la migration |
    | Fichiers de sauvegarde | Une sauvegarde complète et plusieurs sauvegardes de journal, toutes effectuées WITH CHECKSUM, dans le dossier FinanceDb |
    | Bases de données sur MI1 | FinanceDb (restaurée lors d'un test le mois dernier), HRDb |

    La commande de démarrage de LRS échoue.

    Quels sont les deux problèmes qui provoquent l'échec ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The storage URI contains a folder named backups.", fr: "L'URI de stockage contient un dossier nommé backups." } }
    - { id: b, text: { en: "The SAS token doesn't grant the Write permission.", fr: "Le jeton SAS n'accorde pas l'autorisation Write." } }
    - { id: c, text: { en: "A database named FinanceDb already exists on MI1.", fr: "Une base de données nommée FinanceDb existe déjà sur MI1." } }
    - { id: d, text: { en: "The backups were taken WITH CHECKSUM.", fr: "Les sauvegardes ont été effectuées WITH CHECKSUM." } }
    - { id: e, text: { en: "The full and log backups are stored in the same folder.", fr: "Les sauvegardes complètes et de journal sont stockées dans le même dossier." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The URI path, container and folder names can't contain the reserved words backup or backups, and LRS can't restore into a database name that already exists on the managed instance. Rename the folder (for example sqlmig/FinanceDb) and drop or rename the test database before you start LRS again.
    fr: Le chemin de l'URI ainsi que les noms de conteneur et de dossier ne peuvent pas contenir les mots réservés backup ou backups, et LRS ne peut pas restaurer vers un nom de base qui existe déjà sur l'instance managée. Renommez le dossier (par exemple sqlmig/FinanceDb) et supprimez ou renommez la base de test avant de redémarrer LRS.
  options:
    b: { en: "LRS requires only Read and List; granting more permissions, such as Write, makes it fail.", fr: "LRS n'exige que Read et List ; accorder davantage d'autorisations, comme Write, le fait échouer." }
    d: { en: "CHECKSUM is recommended: it avoids migrating a corrupt database and speeds up the restore.", fr: "CHECKSUM est recommandé : il évite de migrer une base endommagée et accélère la restauration." }
    e: { en: "LRS expects all the backups of a database in one flat folder; it builds the chain from the file headers.", fr: "LRS attend toutes les sauvegardes d'une base dans un même dossier plat ; il construit la chaîne à partir des en-têtes de fichiers." }
references:
  - title: Migrate databases from SQL Server by using Log Replay Service - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-migrate
