id: dp300-1a-filestream-vm
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has an on-premises SQL Server 2022 database named **DocsDb** that stores scanned contracts by using FILESTREAM and exposes them to a file server application through a FileTable. The database also sends notifications by using Database Mail.

    You need to migrate DocsDb to Azure without changing how the documents are stored. Among the offerings that meet this requirement, the solution must minimize administrative effort.

    Which offering should you recommend?
  fr: |
    Litware dispose d'une base de données SQL Server 2022 locale nommée **DocsDb** qui stocke des contrats numérisés à l'aide de FILESTREAM et les expose à une application de serveur de fichiers via une FileTable. La base de données envoie également des notifications avec la messagerie de base de données (Database Mail).

    Vous devez migrer DocsDb vers Azure sans changer la façon dont les documents sont stockés. Parmi les offres qui satisfont à cette exigence, la solution doit réduire au minimum l'effort d'administration.

    Quelle offre devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure SQL Managed Instance in the Business Critical tier", fr: "Azure SQL Managed Instance au niveau Business Critical" } }
    - { id: b, text: { en: "Azure SQL Managed Instance in the General Purpose tier", fr: "Azure SQL Managed Instance au niveau General Purpose" } }
    - { id: c, text: { en: "SQL Server on an Azure virtual machine", fr: "SQL Server sur une machine virtuelle Azure" } }
    - { id: d, text: { en: "Azure SQL Database in the Hyperscale tier", fr: "Azure SQL Database au niveau Hyperscale" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      FILESTREAM and FileTable aren't supported by Azure SQL Database or Azure SQL Managed Instance, whatever the tier. SQL Server on an Azure virtual machine keeps full feature parity with the on-premises engine, so it is the only offering that meets the storage requirement.
    fr: |
      FILESTREAM et FileTable ne sont pris en charge ni par Azure SQL Database ni par Azure SQL Managed Instance, quel que soit le niveau. SQL Server sur une machine virtuelle Azure conserve la parité complète des fonctionnalités avec le moteur local : c'est la seule offre qui satisfait l'exigence de stockage.
  options:
    a: { en: "Managed Instance supports Database Mail, but not FILESTREAM or FileTable, in any tier.", fr: "Managed Instance prend en charge Database Mail, mais pas FILESTREAM ni FileTable, quel que soit le niveau." }
    b: { en: "The General Purpose tier of Managed Instance doesn't support FILESTREAM or FileTable either.", fr: "Le niveau General Purpose de Managed Instance ne prend pas non plus en charge FILESTREAM ni FileTable." }
    d: { en: "Azure SQL Database supports neither FILESTREAM nor FileTable, and it has no Database Mail.", fr: "Azure SQL Database ne prend en charge ni FILESTREAM ni FileTable, et n'a pas de Database Mail." }
references:
  - title: "Compare SQL Database Engine Features - Azure SQL Database & Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
