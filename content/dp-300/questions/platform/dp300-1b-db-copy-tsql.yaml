id: dp300-1b-db-copy-tsql
objective: "1.3.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have two logical servers for Azure SQL Database named **sql-contoso-prod** and **sql-contoso-test** in the same subscription. sql-contoso-prod hosts a database named SalesDb. sql-contoso-test has an elastic pool named PoolTest. Your login is a member of the dbmanager role on both servers, and both server firewalls allow your client IP address.

    You need to create a transactionally consistent copy of SalesDb named SalesDb_Test in PoolTest by using Transact-SQL.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux serveurs logiques Azure SQL Database nommés **sql-contoso-prod** et **sql-contoso-test** dans le même abonnement. sql-contoso-prod héberge une base de données nommée SalesDb. sql-contoso-test possède un pool élastique nommé PoolTest. Votre connexion est membre du rôle dbmanager sur les deux serveurs, et les deux pare-feu de serveur autorisent l'adresse IP de votre client.

    Vous devez créer, avec Transact-SQL, une copie transactionnellement cohérente de SalesDb nommée SalesDb_Test dans PoolTest.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template:
    en: |
      -- Connect to: [[ctx]]
      CREATE DATABASE [SalesDb_Test]
          AS COPY OF [[source]]
          ([[pool]]);
    fr: |
      -- Se connecter à : [[ctx]]
      CREATE DATABASE [SalesDb_Test]
          AS COPY OF [[source]]
          ([[pool]]);
  slots:
    - id: ctx
      options:
        - { id: c_testmaster, text: { en: "the master database of sql-contoso-test", fr: "la base de données master de sql-contoso-test" } }
        - { id: c_prodmaster, text: { en: "the master database of sql-contoso-prod", fr: "la base de données master de sql-contoso-prod" } }
        - { id: c_salesdb, text: { en: "the SalesDb database of sql-contoso-prod", fr: "la base de données SalesDb de sql-contoso-prod" } }
    - id: source
      options:
        - { id: s_dbo, text: "[sql-contoso-prod].[dbo].[SalesDb]" }
        - { id: s_ok, text: "[sql-contoso-prod].[SalesDb]" }
        - { id: s_at, text: "[SalesDb]@[sql-contoso-prod]" }
    - id: pool
      options:
        - { id: p_name, text: "ELASTIC_POOL = PoolTest" }
        - { id: p_so, text: "SERVICE_OBJECTIVE = 'PoolTest'" }
        - { id: p_ok, text: "SERVICE_OBJECTIVE = ELASTIC_POOL(name = PoolTest)" }
answer:
  values: { ctx: c_testmaster, source: s_ok, pool: p_ok }
explanation:
  correct:
    en: |
      `CREATE DATABASE ... AS COPY OF` runs in the master database of the destination server, with a login that is the server administrator or a member of dbmanager. A source on another server is named with two parts, server and database. The target elastic pool is set with `SERVICE_OBJECTIVE = ELASTIC_POOL(name = ...)`.
    fr: |
      `CREATE DATABASE ... AS COPY OF` s'exécute dans la base de données master du serveur de destination, avec une connexion administrateur du serveur ou membre de dbmanager. Une source sur un autre serveur se nomme en deux parties, serveur et base de données. Le pool élastique cible se définit avec `SERVICE_OBJECTIVE = ELASTIC_POOL(name = ...)`.
  options:
    c_prodmaster: { en: "The statement creates the database on the server it runs on, so it must run on the destination server.", fr: "L'instruction crée la base sur le serveur où elle s'exécute ; elle doit donc s'exécuter sur le serveur de destination." }
    c_salesdb: { en: "CREATE DATABASE runs in master, not in a user database.", fr: "CREATE DATABASE s'exécute dans master, pas dans une base de données utilisateur." }
    s_dbo: { en: "A database isn't qualified by a schema; the source is server.database.", fr: "Une base de données ne se qualifie pas par un schéma ; la source est serveur.base." }
    s_at: { en: "This isn't a valid Transact-SQL name for a database on another server.", fr: "Ce n'est pas un nom Transact-SQL valide pour une base de données d'un autre serveur." }
    p_name: { en: "The pool is specified inside SERVICE_OBJECTIVE, not as a separate option.", fr: "Le pool se spécifie dans SERVICE_OBJECTIVE, pas comme une option distincte." }
    p_so: { en: "A quoted value is read as a service objective name such as GP_Gen5_2, not as a pool name.", fr: "Une valeur entre guillemets est lue comme un nom d'objectif de service tel que GP_Gen5_2, pas comme un nom de pool." }
references:
  - title: Copy a transactionally consistent copy of a database in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/database-copy
