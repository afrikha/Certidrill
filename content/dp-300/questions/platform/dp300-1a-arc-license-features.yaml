id: dp300-1a-arc-license-features
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has the following SQL Server instances. Each instance has the license type shown in the table.

    | Instance | Version | Location | License type |
    | --- | --- | --- | --- |
    | SQL1 | SQL Server 2022 | On-premises server, connected to Azure Arc | License only |
    | SQL2 | SQL Server 2019 | On-premises server, connected to Azure Arc | Pay-as-you-go |
    | SQL3 | SQL Server 2022 | Azure virtual machine | Pay-as-you-go |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose des instances SQL Server suivantes. Chaque instance a le type de licence indiqué dans le tableau.

    | Instance | Version | Emplacement | Type de licence |
    | --- | --- | --- | --- |
    | SQL1 | SQL Server 2022 | Serveur local, connecté à Azure Arc | License only |
    | SQL2 | SQL Server 2019 | Serveur local, connecté à Azure Arc | Pay-as-you-go |
    | SQL3 | SQL Server 2022 | Machine virtuelle Azure | Pay-as-you-go |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can run the best practices assessment on SQL1 from the Azure portal without changing its license type.
        fr: Vous pouvez exécuter l'évaluation des bonnes pratiques sur SQL1 depuis le portail Azure sans changer son type de licence.
    - id: s2
      text:
        en: You can configure Microsoft Entra authentication for SQL1 through Azure Arc.
        fr: Vous pouvez configurer l'authentification Microsoft Entra pour SQL1 via Azure Arc.
    - id: s3
      text:
        en: To manage SQL3 from Azure, you should connect it to Azure Arc.
        fr: Pour gérer SQL3 depuis Azure, vous devez le connecter à Azure Arc.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      With the License only license type, an Arc-enabled instance gets inventory, Microsoft Entra authentication, Defender for Cloud and migration readiness, but not the best practices assessment, which needs Software Assurance, a SQL Server subscription or pay-as-you-go. Microsoft Entra authentication requires SQL Server 2022 or later, which SQL1 runs. SQL Server on Azure virtual machines isn't a supported Arc configuration; it is managed through the SQL IaaS Agent extension.
    fr: |
      Avec le type de licence License only, une instance activée par Arc bénéficie de l'inventaire, de l'authentification Microsoft Entra, de Defender pour le cloud et de la préparation à la migration, mais pas de l'évaluation des bonnes pratiques, qui exige Software Assurance, un abonnement SQL Server ou le paiement à l'utilisation. L'authentification Microsoft Entra exige SQL Server 2022 ou ultérieur, ce qu'exécute SQL1. SQL Server sur une machine virtuelle Azure n'est pas une configuration Arc prise en charge ; il se gère avec l'extension SQL IaaS Agent.
references:
  - title: "Overview - SQL Server enabled by Azure Arc"
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/overview
