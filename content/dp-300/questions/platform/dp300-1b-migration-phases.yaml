id: dp300-1b-migration-phases
objective: "1.3.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin plans to migrate a SQL Server 2019 database named **FlightsDb** to Azure SQL Managed Instance. No target has been chosen yet.

    You need to organize the migration project.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin prévoit de migrer une base de données SQL Server 2019 nommée **FlightsDb** vers Azure SQL Managed Instance. Aucune cible n'a encore été choisie.

    Vous devez organiser le projet de migration.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: assess, text: { en: "Assess FlightsDb for compatibility issues and collect a performance baseline.", fr: "Évaluer FlightsDb pour détecter les problèmes de compatibilité et collecter une référence de performances." } }
    - { id: size, text: { en: "Choose the service tier and size of the managed instance from the assessment results.", fr: "Choisir le niveau de service et la taille de l'instance managée d'après les résultats de l'évaluation." } }
    - { id: prepare, text: { en: "Deploy the managed instance and configure its network, logins and SQL Server Agent jobs.", fr: "Déployer l'instance managée et configurer son réseau, ses connexions et ses travaux SQL Server Agent." } }
    - { id: migrate, text: { en: "Migrate the database by using the chosen online or offline method.", fr: "Migrer la base de données avec la méthode en ligne ou hors connexion choisie." } }
    - { id: cutover, text: { en: "Cut over the application to the managed instance and run the post-migration tests.", fr: "Basculer l'application vers l'instance managée et exécuter les tests postérieurs à la migration." } }
    - { id: compat, text: { en: "Raise the compatibility level of FlightsDb on the source to the latest level.", fr: "Élever le niveau de compatibilité de FlightsDb sur la source au niveau le plus récent." } }
    - { id: dropsrc, text: { en: "Drop FlightsDb on the source server to prevent further writes.", fr: "Supprimer FlightsDb sur le serveur source pour empêcher toute nouvelle écriture." } }
answer:
  sequence: [ assess, size, prepare, migrate, cutover ]
explanation:
  correct:
    en: |
      A migration starts with an assessment and a performance baseline, which drive the choice and sizing of the target. The target is then deployed and prepared with the instance-level objects that a database migration doesn't carry, such as logins and SQL Server Agent jobs. The data is migrated, and the cutover is followed by validation tests.
    fr: |
      Une migration commence par une évaluation et une référence de performances, qui orientent le choix et le dimensionnement de la cible. La cible est ensuite déployée et préparée avec les objets de niveau instance qu'une migration de base ne transporte pas, comme les connexions et les travaux SQL Server Agent. Les données sont migrées, puis le basculement est suivi de tests de validation.
  options:
    compat: { en: "Keep the source compatibility level during the migration and raise it on the target after a Query Store baseline.", fr: "Conservez le niveau de compatibilité de la source pendant la migration et élevez-le sur la cible après une référence du Magasin des requêtes." }
    dropsrc: { en: "The source must stay available until the target is validated; dropping it removes any rollback option.", fr: "La source doit rester disponible jusqu'à la validation de la cible ; la supprimer élimine toute possibilité de retour arrière." }
references:
  - title: "Migration overview: SQL Server to Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/managed-instance/sql-server-to-managed-instance-overview
