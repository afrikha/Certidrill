id: dp300-1b-online-offline-facts
objective: "1.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are comparing online migration methods for SQL Server databases.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez des méthodes de migration en ligne pour des bases de données SQL Server.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: During a Log Replay Service migration, the database on the managed instance can serve read-only queries before the cutover.
        fr: Pendant une migration avec Log Replay Service, la base de données de l'instance managée peut traiter des requêtes en lecture seule avant le basculement.
    - id: s2
      text:
        en: During a Managed Instance link migration, the database on the managed instance can serve read-only queries before the cutover.
        fr: Pendant une migration avec le lien Managed Instance, la base de données de l'instance managée peut traiter des requêtes en lecture seule avant le basculement.
    - id: s3
      text:
        en: Azure Database Migration Service supports online migrations from SQL Server to SQL Server on Azure Virtual Machines.
        fr: Azure Database Migration Service prend en charge les migrations en ligne de SQL Server vers SQL Server sur les machines virtuelles Azure.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Log Replay Service keeps the database in a restoring state (NORECOVERY) until the migration completes, so it can't be read. The Managed Instance link keeps a read-only replica on the managed instance during replication. Database Migration Service supports online migrations to SQL Managed Instance and to SQL Server on Azure Virtual Machines, and only offline migrations to Azure SQL Database.
    fr: Log Replay Service maintient la base de données en état de restauration (NORECOVERY) jusqu'à la fin de la migration ; elle ne peut donc pas être lue. Le lien Managed Instance conserve un réplica en lecture seule sur l'instance managée pendant la réplication. Database Migration Service prend en charge les migrations en ligne vers SQL Managed Instance et vers SQL Server sur machines virtuelles Azure, et seulement les migrations hors connexion vers Azure SQL Database.
references:
  - title: Overview of Log Replay Service with Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-overview
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
