id: dp300-1a-partition-column
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are planning the partitioning of a table named **dbo.Orders** in an Azure SQL database. The table has the following columns:

    | Column | Data type |
    | --- | --- |
    | OrderId | bigint, IDENTITY |
    | CustomerId | int |
    | OrderDate | date |
    | Notes | nvarchar(max) |

    Most queries filter on a range of OrderDate values. Each partition must contain exactly one calendar month of orders so that a month can be switched out to an archive table.

    Which partition function design should you use?
  fr: |
    Vous planifiez le partitionnement d'une table nommée **dbo.Orders** dans une base de données Azure SQL. La table comporte les colonnes suivantes :

    | Colonne | Type de données |
    | --- | --- |
    | OrderId | bigint, IDENTITY |
    | CustomerId | int |
    | OrderDate | date |
    | Notes | nvarchar(max) |

    La plupart des requêtes filtrent sur une plage de valeurs d'OrderDate. Chaque partition doit contenir exactement un mois civil de commandes, afin qu'un mois puisse être basculé vers une table d'archive.

    Quelle conception de fonction de partition devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "RANGE LEFT on OrderDate, with the first day of each month as boundary values", fr: "RANGE LEFT sur OrderDate, avec le premier jour de chaque mois comme valeurs limites" } }
    - { id: b, text: { en: "RANGE RIGHT on OrderDate, with the first day of each month as boundary values", fr: "RANGE RIGHT sur OrderDate, avec le premier jour de chaque mois comme valeurs limites" } }
    - { id: c, text: { en: "RANGE RIGHT on OrderId, with a boundary value every 10 million orders", fr: "RANGE RIGHT sur OrderId, avec une valeur limite tous les 10 millions de commandes" } }
    - { id: d, text: { en: "RANGE RIGHT on CustomerId, with a boundary value every 1,000 customers", fr: "RANGE RIGHT sur CustomerId, avec une valeur limite tous les 1 000 clients" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With RANGE RIGHT, each boundary value belongs to the partition on its right, so the boundary 2026-02-01 starts the February partition and every partition holds exactly one month. OrderDate is also the column the queries filter on, which allows partition elimination.
    fr: |
      Avec RANGE RIGHT, chaque valeur limite appartient à la partition située à sa droite : la limite 2026-02-01 ouvre la partition de février et chaque partition contient exactement un mois. OrderDate est aussi la colonne sur laquelle filtrent les requêtes, ce qui permet l'élimination de partitions.
  options:
    a: { en: "With RANGE LEFT, the first day of each month would fall into the partition of the previous month, so partitions wouldn't match calendar months.", fr: "Avec RANGE LEFT, le premier jour de chaque mois tomberait dans la partition du mois précédent : les partitions ne correspondraient pas aux mois civils." }
    c: { en: "Ranges of OrderId don't align with calendar months, and date filters couldn't eliminate partitions.", fr: "Des plages d'OrderId ne s'alignent pas sur les mois civils, et les filtres de date ne pourraient pas éliminer de partitions." }
    d: { en: "Partitioning by customer mixes all months in every partition, so a month can't be switched out.", fr: "Un partitionnement par client mélange tous les mois dans chaque partition : un mois ne peut pas être basculé." }
references:
  - title: "Partitioned Tables and Indexes - SQL Server, Azure SQL Database, Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes
