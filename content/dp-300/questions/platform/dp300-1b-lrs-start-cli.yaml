id: dp300-1b-lrs-start-cli
objective: "1.3.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL managed instance named **mi-woodgrove** in a resource group named RG1. You are migrating a database named PayrollDb from SQL Server 2019 by using Log Replay Service. The backups are uploaded to the container **lrs** of the storage account stwoodgrove, and new log backups will be uploaded every 15 minutes until the cutover.

    You generate a SAS token for the container that grants the Read and List permissions. The Azure portal returns the following Blob service SAS URL:

    `https://stwoodgrove.blob.core.windows.net/lrs?sp=rl&st=2026-11-01T00:00:00Z&se=2026-12-31T00:00:00Z&spr=https&sv=2022-11-02&sr=c&sig=<signature>`

    You need to start the migration.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance managée Azure SQL nommée **mi-woodgrove** dans un groupe de ressources nommé RG1. Vous migrez une base de données nommée PayrollDb depuis SQL Server 2019 avec Log Replay Service. Les sauvegardes sont chargées dans le conteneur **lrs** du compte de stockage stwoodgrove, et de nouvelles sauvegardes de journal y seront chargées toutes les 15 minutes jusqu'au basculement.

    Vous générez pour le conteneur un jeton SAS qui accorde les autorisations Read et List. Le portail Azure renvoie l'URL SAS de service Blob suivante :

    `https://stwoodgrove.blob.core.windows.net/lrs?sp=rl&st=2026-11-01T00:00:00Z&se=2026-12-31T00:00:00Z&spr=https&sv=2022-11-02&sr=c&sig=<signature>`

    Vous devez démarrer la migration.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql midb log-replay [[verb]] -g RG1 --mi mi-woodgrove -n PayrollDb \
      --storage-uri "https://stwoodgrove.blob.core.windows.net/lrs/[[folder]]" \
      --storage-sas "[[sas]]"
  slots:
    - id: verb
      options:
        - { id: v_start, text: start }
        - { id: v_complete, text: complete }
        - { id: v_show, text: show }
    - id: folder
      options:
        - { id: f_backups, text: backups/PayrollDb }
        - { id: f_db, text: PayrollDb }
        - { id: f_nested, text: PayrollDb/full }
    - id: sas
      options:
        - { id: sas_q, text: "?sp=rl&st=...&sr=c&sig=<signature>" }
        - { id: sas_ok, text: "sp=rl&st=...&sr=c&sig=<signature>" }
        - { id: sas_url, text: "https://stwoodgrove.blob.core.windows.net/lrs?sp=rl&...&sig=<signature>" }
answer:
  values: { verb: v_start, folder: f_db, sas: sas_ok }
explanation:
  correct:
    en: |
      `az sql midb log-replay start` without `-a` and `--last-bn` starts LRS in continuous mode, which keeps restoring the new log backups until you run the complete command. Each database needs its own flat folder, and the folder and path names can't contain the reserved words backup or backups. The SAS URL is split at the `?`: the part before it is the container URI, and the token after it is passed without the `?`.
    fr: |
      `az sql midb log-replay start` sans `-a` ni `--last-bn` démarre LRS en mode continu, qui continue de restaurer les nouvelles sauvegardes de journal jusqu'à ce que vous exécutiez la commande complete. Chaque base de données a besoin de son propre dossier plat, et les noms de dossier et de chemin ne peuvent pas contenir les mots réservés backup ou backups. L'URL SAS se coupe au `?` : la partie qui le précède est l'URI du conteneur, et le jeton qui le suit se passe sans le `?`.
  options:
    v_complete: { en: "complete performs the cutover of a continuous-mode migration that is already running.", fr: "complete effectue le basculement d'une migration en mode continu déjà en cours." }
    v_show: { en: "show only displays the status of an existing LRS migration.", fr: "show affiche seulement l'état d'une migration LRS existante." }
    f_backups: { en: "backup and backups are reserved words and can't appear in the URI path.", fr: "backup et backups sont des mots réservés et ne peuvent pas figurer dans le chemin de l'URI." }
    f_nested: { en: "Nested folders inside a database folder aren't supported; LRS needs one flat folder per database.", fr: "Les sous-dossiers dans un dossier de base de données ne sont pas pris en charge ; LRS exige un dossier plat par base." }
    sas_q: { en: "The token must not include the leading question mark.", fr: "Le jeton ne doit pas inclure le point d'interrogation initial." }
    sas_url: { en: "The storage-sas parameter takes only the token; the container URI goes in storage-uri.", fr: "Le paramètre storage-sas ne prend que le jeton ; l'URI du conteneur va dans storage-uri." }
references:
  - title: Migrate databases from SQL Server by using Log Replay Service - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-migrate
