id: dp300-1b-vm-log-write-accel
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure virtual machine named **SQLVM3** of size Standard_M32ms that runs SQL Server 2022 for an OLTP workload. The transaction log is stored on a dedicated Premium SSD disk that has host caching set to None. The data files are on separate Premium SSD disks.

    Wait statistics show that commits are slowed by transaction log write latency.

    You need to reduce the log write latency. The solution must keep the existing Premium SSD disks.

    What should you do?
  fr: |
    Vous disposez d'une machine virtuelle Azure nommée **SQLVM3**, de taille Standard_M32ms, qui exécute SQL Server 2022 pour une charge de travail OLTP. Le journal des transactions est stocké sur un disque SSD Premium dédié dont la mise en cache de l'hôte est définie sur None. Les fichiers de données se trouvent sur d'autres disques SSD Premium.

    Les statistiques d'attente montrent que les validations sont ralenties par la latence d'écriture du journal des transactions.

    Vous devez réduire la latence d'écriture du journal. La solution doit conserver les disques SSD Premium existants.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Write Accelerator on the disks that store the data files.", fr: "Activer Write Accelerator sur les disques qui stockent les fichiers de données." } }
    - { id: b, text: { en: "Set host caching on the transaction log disk to Read-only.", fr: "Définir la mise en cache de l'hôte du disque du journal des transactions sur Read-only." } }
    - { id: c, text: { en: "Set host caching on the transaction log disk to Read/write.", fr: "Définir la mise en cache de l'hôte du disque du journal des transactions sur Read/write." } }
    - { id: d, text: { en: "Enable Write Accelerator on the disk that stores the transaction log.", fr: "Activer Write Accelerator sur le disque qui stocke le journal des transactions." } }
answer: { optionId: d }
explanation:
  correct:
    en: Write Accelerator is available only on M-series virtual machines and is designed for the transaction log disk, where it lowers write latency on Premium SSD storage. Microsoft recommends it over Ultra Disks for the log on M-series when possible, and it keeps the existing disks.
    fr: Write Accelerator n'est disponible que sur les machines virtuelles de la série M et est conçu pour le disque du journal des transactions, dont il réduit la latence d'écriture sur stockage SSD Premium. Microsoft le recommande plutôt qu'Ultra Disk pour le journal sur la série M lorsque c'est possible, et il conserve les disques existants.
  options:
    a: { en: "Write Accelerator must not be used for SQL Server data files; the latency problem is on the log.", fr: "Write Accelerator ne doit pas être utilisé pour les fichiers de données SQL Server ; le problème de latence concerne le journal." }
    b: { en: "Log disks must use no host caching; read caching doesn't help sequential log writes.", fr: "Les disques du journal ne doivent utiliser aucune mise en cache de l'hôte ; un cache en lecture n'aide pas les écritures séquentielles du journal." }
    c: { en: "Read/write caching buffers writes and risks data integrity; Microsoft says not to enable any caching on log disks.", fr: "La mise en cache Read/write met les écritures en mémoire tampon et menace l'intégrité des données ; Microsoft déconseille toute mise en cache sur les disques du journal." }
references:
  - title: "Storage: Performance best practices for SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/performance-guidelines-best-practices-storage
