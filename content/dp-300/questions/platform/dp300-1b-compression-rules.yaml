id: dp300-1b-compression-rules
objective: "1.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named **LegalDb** that contains a table named dbo.Contracts. dbo.Contracts has a clustered index that uses PAGE compression. The table has a column named ContractText of type nvarchar(max), and most ContractText values are larger than 8,000 bytes and are stored off-row.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **LegalDb** qui contient une table nommée dbo.Contracts. dbo.Contracts possède un index cluster qui utilise la compression PAGE. La table comporte une colonne nommée ContractText de type nvarchar(max), et la plupart des valeurs de ContractText dépassent 8 000 octets et sont stockées hors ligne (off-row).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A nonclustered index that you create on dbo.Contracts without a DATA_COMPRESSION option uses PAGE compression.
        fr: Un index non cluster que vous créez sur dbo.Contracts sans option DATA_COMPRESSION utilise la compression PAGE.
    - id: s2
      text:
        en: The PAGE compression of dbo.Contracts reduces the space used by the ContractText values that are stored off-row.
        fr: La compression PAGE de dbo.Contracts réduit l'espace utilisé par les valeurs de ContractText stockées hors ligne.
    - id: s3
      text:
        en: The PAGE compression of dbo.Contracts doesn't change the maximum row size of the table.
        fr: La compression PAGE de dbo.Contracts ne modifie pas la taille de ligne maximale de la table.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: Nonclustered indexes don't inherit the compression of the table; they are created with NONE unless you specify a setting. Row and page compression don't apply to off-row and large-value data. Compression can fit more rows in a page, but it doesn't change the maximum row size of a table or index.
    fr: Les index non cluster n'héritent pas de la compression de la table ; ils sont créés avec NONE sauf si vous indiquez un paramètre. La compression de ligne et de page ne s'applique pas aux données hors ligne ni aux données de grande valeur. La compression peut faire tenir davantage de lignes dans une page, mais elle ne modifie pas la taille de ligne maximale d'une table ou d'un index.
references:
  - title: Data compression
    url: https://learn.microsoft.com/en-us/sql/relational-databases/data-compression/data-compression
