id: dp300-1b-post-migration-regression
objective: "1.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You migrated a database named **OrdersDb** from SQL Server 2016 to an Azure SQL managed instance. Query Store captured a baseline at compatibility level 130, and you then raised the compatibility level to 160.

    Most queries are faster, but one critical reporting query now takes 40 seconds instead of 2. Query Store shows that the query has a new execution plan and that its previous plan was much faster.

    You need to restore the performance of the reporting query as quickly as possible. The other queries must keep the benefits of compatibility level 160.

    What should you do?
  fr: |
    Vous avez migré une base de données nommée **OrdersDb** de SQL Server 2016 vers une instance managée Azure SQL. Le Magasin des requêtes a capturé une référence au niveau de compatibilité 130, puis vous avez élevé le niveau de compatibilité à 160.

    La plupart des requêtes sont plus rapides, mais une requête de rapport critique prend désormais 40 secondes au lieu de 2. Le Magasin des requêtes montre que la requête a un nouveau plan d'exécution et que son plan précédent était beaucoup plus rapide.

    Vous devez rétablir au plus vite les performances de la requête de rapport. Les autres requêtes doivent conserver les avantages du niveau de compatibilité 160.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the compatibility level of OrdersDb back to 130.", fr: "Rétablir le niveau de compatibilité 130 sur OrdersDb." } }
    - { id: b, text: { en: "Force the previous plan of the query by using sp_query_store_force_plan.", fr: "Forcer le plan précédent de la requête avec sp_query_store_force_plan." } }
    - { id: c, text: { en: "Enable the LEGACY_CARDINALITY_ESTIMATION database scoped configuration.", fr: "Activer la configuration délimitée à la base de données LEGACY_CARDINALITY_ESTIMATION." } }
    - { id: d, text: { en: "Rebuild all the indexes of the tables used by the query.", fr: "Reconstruire tous les index des tables utilisées par la requête." } }
answer: { optionId: b }
explanation:
  correct:
    en: After a compatibility level upgrade, the recommended fix for a plan choice regression is to force the previously known good plan in Query Store, with the Force Plan option or sp_query_store_force_plan. It affects only that query, so the other queries keep the new optimizer behavior.
    fr: "Après une élévation du niveau de compatibilité, la correction recommandée d'une régression de choix de plan consiste à forcer le dernier bon plan connu dans le Magasin des requêtes, avec l'option Forcer le plan ou sp_query_store_force_plan. Cela ne concerne que cette requête : les autres conservent le comportement du nouvel optimiseur."
  options:
    a: { en: "Reverting the compatibility level affects the whole database, so the other queries would lose the benefits of level 160.", fr: "Revenir au niveau de compatibilité précédent affecte toute la base : les autres requêtes perdraient les avantages du niveau 160." }
    c: { en: "This setting changes cardinality estimation for every query in the database, not only the regressed one.", fr: "Ce paramètre modifie l'estimation de cardinalité pour toutes les requêtes de la base, pas seulement celle qui a régressé." }
    d: { en: "The problem is a plan choice regression, which rebuilding indexes doesn't reliably fix.", fr: "Le problème est une régression de choix de plan, que la reconstruction des index ne corrige pas de façon fiable." }
references:
  - title: Query Store Usage Scenarios
    url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/query-store-usage-scenarios
