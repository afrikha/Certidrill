id: dp300-1a-scale-tsql-bc
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database database named **SalesDb** in the General Purpose service tier with 4 vCores.

    You need to move SalesDb to the Business Critical service tier with 8 vCores on standard-series (Gen5) hardware and provisioned compute by using Transact-SQL.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données Azure SQL Database nommée **SalesDb** au niveau de service General Purpose avec 4 vCores.

    Vous devez faire passer SalesDb au niveau de service Business Critical avec 8 vCores, sur le matériel standard-series (Gen5) et avec le calcul provisionné, à l'aide de Transact-SQL.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER DATABASE [SalesDb]
        [[kw]] (EDITION = [[ed]], SERVICE_OBJECTIVE = [[so]]);
  slots:
    - id: kw
      options:
        - { id: modify, text: MODIFY }
        - { id: set, text: SET }
        - { id: alter, text: ALTER }
    - id: ed
      options:
        - { id: bc, text: "'BusinessCritical'" }
        - { id: premium, text: "'Premium'" }
        - { id: hs, text: "'Hyperscale'" }
    - id: so
      options:
        - { id: bc8, text: "'BC_Gen5_8'" }
        - { id: gp8, text: "'GP_Gen5_8'" }
        - { id: bcdc8, text: "'BC_DC_8'" }
        - { id: p4, text: "'P4'" }
answer:
  values: { kw: modify, ed: bc, so: bc8 }
explanation:
  correct:
    en: |
      In Azure SQL Database, ALTER DATABASE ... MODIFY changes the edition, the service objective or the maximum size. The vCore service objective name encodes the tier, the hardware and the vCore count: BC_Gen5_8 is Business Critical on standard-series hardware with 8 vCores. The scaling operation is online, with a short disconnection when it completes.
    fr: |
      Dans Azure SQL Database, ALTER DATABASE ... MODIFY change l'édition, l'objectif de service ou la taille maximale. Le nom de l'objectif de service vCore code le niveau, le matériel et le nombre de vCores : BC_Gen5_8 correspond à Business Critical sur le matériel standard-series avec 8 vCores. La mise à l'échelle se fait en ligne, avec une brève déconnexion à la fin.
  options:
    set: { en: "SET changes database options such as compatibility or recovery settings, not the edition or service objective.", fr: "SET modifie des options de base comme la compatibilité, pas l'édition ni l'objectif de service." }
    alter: { en: "ALTER isn't a clause of ALTER DATABASE.", fr: "ALTER n'est pas une clause d'ALTER DATABASE." }
    premium: { en: "Premium is a DTU tier, not Business Critical.", fr: "Premium est un niveau DTU, pas Business Critical." }
    hs: { en: "Hyperscale is a different vCore tier.", fr: "Hyperscale est un autre niveau vCore." }
    gp8: { en: "GP_Gen5_8 is General Purpose.", fr: "GP_Gen5_8 correspond à General Purpose." }
    bcdc8: { en: "BC_DC_8 uses DC-series hardware, not standard-series.", fr: "BC_DC_8 utilise le matériel DC-series, pas standard-series." }
    p4: { en: "P4 is a DTU Premium service objective.", fr: "P4 est un objectif de service DTU Premium." }
references:
  - title: "ALTER DATABASE (Transact-SQL) - SQL Server"
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-transact-sql?view=azuresqldb-current
