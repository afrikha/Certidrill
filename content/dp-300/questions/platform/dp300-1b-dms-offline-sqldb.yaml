id: dp300-1b-dms-offline-sqldb
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an on-premises SQL Server 2017 instance that hosts a 120 GB database named **TicketsDb**. You plan to migrate TicketsDb to Azure SQL Database during an 8-hour maintenance window on Saturday.

    You need to migrate the schema and the data by using a fully managed migration service that you run from the Azure portal.

    What should you use?
  fr: |
    Vous disposez d'une instance SQL Server 2017 locale qui héberge une base de données de 120 Go nommée **TicketsDb**. Vous prévoyez de migrer TicketsDb vers Azure SQL Database pendant une fenêtre de maintenance de 8 heures le samedi.

    Vous devez migrer le schéma et les données à l'aide d'un service de migration entièrement managé que vous exécutez depuis le portail Azure.

    Qu'est-ce que vous devez utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Database Migration Service in offline mode", fr: "Azure Database Migration Service en mode hors connexion" } }
    - { id: b, text: { en: "Log Replay Service in autocomplete mode", fr: "Log Replay Service en mode autocomplete" } }
    - { id: c, text: { en: "The Managed Instance link", fr: "Le lien Managed Instance" } }
    - { id: d, text: { en: "RESTORE DATABASE ... FROM URL", fr: "RESTORE DATABASE ... FROM URL" } }
answer: { optionId: a }
explanation:
  correct:
    en: Azure Database Migration Service is a fully managed service, used from the Azure portal, PowerShell or the Azure CLI. It supports offline migrations from SQL Server to Azure SQL Database, including the schema, which fits a planned maintenance window.
    fr: Azure Database Migration Service est un service entièrement managé, utilisable depuis le portail Azure, PowerShell ou Azure CLI. Il prend en charge les migrations hors connexion de SQL Server vers Azure SQL Database, schéma compris, ce qui convient à une fenêtre de maintenance planifiée.
  options:
    b: { en: "Log Replay Service restores backups only to Azure SQL Managed Instance.", fr: "Log Replay Service ne restaure des sauvegardes que vers Azure SQL Managed Instance." }
    c: { en: "The Managed Instance link replicates only to Azure SQL Managed Instance.", fr: "Le lien Managed Instance ne réplique que vers Azure SQL Managed Instance." }
    d: { en: "Azure SQL Database doesn't support native restores of SQL Server backup files.", fr: "Azure SQL Database ne prend pas en charge la restauration native de fichiers de sauvegarde SQL Server." }
references:
  - title: What is Azure Database Migration Service?
    url: https://learn.microsoft.com/en-us/azure/dms/dms-overview
