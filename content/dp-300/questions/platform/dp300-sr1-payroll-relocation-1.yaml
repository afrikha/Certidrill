id: dp300-sr1-payroll-relocation-1
objective: "1.3.7"
type: series_yesno
series: dp300-sr1-payroll-relocation
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You start a move on Saturday morning and complete it at 22:00.
  fr: |
    Vous démarrez un déplacement le samedi matin et le terminez à 22:00.
body:
  solution:
    en: |
      On Saturday at 08:00, you select Payroll on sqlmi-adatum-hr in the Azure portal and start a **Move** operation to sqlmi-adatum-core. When the status shows **Move ready for completion**, you wait until 22:00 and select **Complete**.
    fr: |
      Le samedi à 08:00, vous sélectionnez Payroll sur sqlmi-adatum-hr dans le portail Azure et démarrez une opération **Move** vers sqlmi-adatum-core. Quand l'état affiche **Move ready for completion**, vous attendez 22:00 et sélectionnez **Complete**.
answer: { value: true }
explanation:
  correct:
    en: |
      A move seeds Payroll online to sqlmi-adatum-core and keeps replicating changes while the source stays in use. Selecting Complete at 22:00, within 24 hours, stops workloads on the source, replicates the last transactions, brings the destination online and drops the source, so no committed transaction is lost and Payroll no longer exists on sqlmi-adatum-hr.
    fr: |
      Un déplacement amorce Payroll en ligne vers sqlmi-adatum-core et continue de répliquer les modifications pendant que la source reste utilisée. Sélectionner Complete à 22:00, dans les 24 heures, arrête les charges de travail sur la source, réplique les dernières transactions, met la destination en ligne et supprime la source : aucune transaction validée n'est perdue et Payroll n'existe plus sur sqlmi-adatum-hr.
references:
  - title: Copy or move a database across instances in Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
