id: dp300-cs1c-arc-capabilities
objective: "1.1.3"
type: multi
caseStudy: dp300-cs1c-litware-energy
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the requirements for the regional control centers. Which two capabilities of SQL Server enabled by Azure Arc should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences concernant les centres de contrôle régionaux. Quelles sont les deux fonctionnalités de SQL Server activé par Azure Arc que vous devez utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Pay-as-you-go licensing billed through Azure", fr: "Licences avec paiement à l'utilisation facturées via Azure" } }
    - { id: b, text: { en: "The best practices assessment", fr: "L'évaluation des bonnes pratiques" } }
    - { id: c, text: { en: "Microsoft Defender for Cloud threat protection for SQL", fr: "La protection contre les menaces de Microsoft Defender pour le cloud pour SQL" } }
    - { id: d, text: { en: "The migration assessment", fr: "L'évaluation de la migration" } }
    - { id: e, text: { en: "Automated backups to local storage", fr: "Les sauvegardes automatisées vers un stockage local" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      SQL Server enabled by Azure Arc can switch the license type of an instance to pay-as-you-go, so usage is billed monthly through Azure without buying licenses. Microsoft Defender for Cloud provides vulnerability assessment and threat protection for Arc-enabled instances, including alerts on potential SQL injection and anomalous access.
    fr: |
      SQL Server activé par Azure Arc peut passer le type de licence d'une instance en paiement à l'utilisation : l'utilisation est facturée mensuellement via Azure sans achat de licences. Microsoft Defender pour le cloud fournit l'évaluation des vulnérabilités et la protection contre les menaces aux instances activées par Arc, avec des alertes sur les injections SQL potentielles et les accès anormaux.
  options:
    b: { en: "The best practices assessment compares the configuration with Microsoft guidance; it neither bills usage nor raises security alerts.", fr: "L'évaluation des bonnes pratiques compare la configuration aux recommandations Microsoft ; elle ne facture pas l'utilisation et ne déclenche pas d'alertes de sécurité." }
    d: { en: "The migration assessment analyzes cloud readiness and recommends a target SKU; it does not change licensing or detect attacks.", fr: "L'évaluation de la migration analyse la préparation au cloud et recommande une référence SKU cible ; elle ne modifie pas les licences et ne détecte pas les attaques." }
    e: { en: "Automated backups protect the data; they address neither the billing nor the threat detection requirement.", fr: "Les sauvegardes automatisées protègent les données ; elles ne répondent ni à l'exigence de facturation ni à celle de détection des menaces." }
references:
  - title: SQL Server enabled by Azure Arc
    url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/overview
