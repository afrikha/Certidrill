id: dp300-1b-vm-config-statements
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam plans to deploy several SQL Server instances on Azure virtual machines and wants to follow Microsoft's performance best practices.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de déployer plusieurs instances SQL Server sur des machines virtuelles Azure et souhaite suivre les bonnes pratiques de performances de Microsoft.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The drives that store the data files, other than the temporary D drive, should be formatted with a 64 KB allocation unit size.
        fr: Les lecteurs qui stockent les fichiers de données, hormis le lecteur temporaire D, doivent être formatés avec une taille d'unité d'allocation de 64 Ko.
    - id: s2
      text:
        en: For a SQL Server failover cluster instance (FCI), the recommended default location of tempdb is the local temporary D drive of each node.
        fr: Pour une instance de cluster de basculement (FCI) SQL Server, l'emplacement par défaut recommandé de tempdb est le lecteur temporaire local D de chaque nœud.
    - id: s3
      text:
        en: The recommended number of tempdb data files is one per core, up to eight files.
        fr: Le nombre recommandé de fichiers de données tempdb est d'un par cœur, jusqu'à huit fichiers.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Data drives other than the temporary drive (which keeps 4 KB) should use a 64 KB allocation unit. For most workloads that are not part of an FCI, tempdb goes on the temporary D drive, but an FCI places tempdb on shared storage; a local drive is only an advanced option that requires custom monitoring. Microsoft recommends one tempdb data file per core, up to eight.
    fr: "Les lecteurs de données autres que le lecteur temporaire (qui conserve 4 Ko) doivent utiliser une unité d'allocation de 64 Ko. Pour la plupart des charges de travail hors FCI, tempdb se place sur le lecteur temporaire D, mais une FCI place tempdb sur le stockage partagé ; un lecteur local n'est qu'une option avancée qui exige une surveillance personnalisée. Microsoft recommande un fichier de données tempdb par cœur, jusqu'à huit."
references:
  - title: "Checklist: Best practices for SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/performance-guidelines-best-practices-checklist
  - title: "Storage: Performance best practices for SQL Server on Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/performance-guidelines-best-practices-storage
