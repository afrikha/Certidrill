# DP-300 — Administering Microsoft Azure SQL Solutions
# (Microsoft Certified: Azure Database Administrator Associate)
# Source: official study guide, "Skills measured as of October 27, 2026" (en-us and fr-fr pages,
# checked on 2026-11-16): https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-300
# Real exam: 100 minutes, passing score 700/1000, proctored, "may have interactive components"
# (certification page). Microsoft does not publish the number of questions nor the presence of
# case studies; the structure below follows the factory default for associate exams.
# typeMix and difficultyMix: as AZ-104. Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
certification:
  code: dp-300
  title: "Administering Microsoft Azure SQL Solutions"
  vendor: Microsoft
  active: false

blueprint:
  version: "2026-10-27"
  durationMin: 100
  # Microsoft does not publish the number of questions; the simulator draws a total in this range.
  questionCount: { min: 45, max: 58 }
  passScore: 700
  maxScore: 1000

  # Target share of each question type in an exam (0..1). series_yesno is driven by structure.series.
  typeMix:
    single: { min: 0.35, max: 0.45 }
    multi: { min: 0.10, max: 0.15 }
    yesno_statements: { min: 0.10, max: 0.15 }
    dropdown: { min: 0.10, max: 0.15 }
    dragdrop: { min: 0.05, max: 0.10 }
    ordering: { min: 0.05, max: 0.10 }
    hotarea: { min: 0.00, max: 0.05 }

  difficultyMix: { easy: 0.30, medium: 0.50, hard: 0.20 }

  structure:
    caseStudies:
      count: { min: 1, max: 1 }
      questionsEach: { min: 4, max: 6 }
      placement: random
    series:
      count: { min: 1, max: 1 }
      questionsEach: { min: 3, max: 3 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # Readiness and progression rules: same values as AZ-104 (see content/az-104/blueprint.yaml for the comments).
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale: { from: 600, to: 850 }
      weights: { level: 0.5, consistency: 0.2, domains: 0.2, freshness: 0.1 }
      bands: { progressing: 50, almost: 70, ready: 85 }
      freshness: { staleDays: 30, zeroDays: 90, minNewShare: 0.5 }
    progression:
      xp:
        base: 50
        scoreFrom: 400
        perPoint: 0.5
        knownShare: 0.5
        passBonus: 100
        bestBonus: 75
        domainBonus: 50
        domainGain: 50
      levels:
        - { xp: 0, title: { en: "Data intern", fr: "Stagiaire données" } }
        - { xp: 150, title: { en: "Query novice", fr: "Novice des requêtes" } }
        - { xp: 400, title: { en: "Backup operator", fr: "Opérateur de sauvegarde" } }
        - { xp: 750, title: { en: "Login keeper", fr: "Gardien des connexions" } }
        - { xp: 1200, title: { en: "Junior DBA", fr: "DBA junior" } }
        - { xp: 1750, title: { en: "Index tuner", fr: "Régleur d'index" } }
        - { xp: 2400, title: { en: "Failover strategist", fr: "Stratège du basculement" } }
        - { xp: 3150, title: { en: "Azure SQL DBA", fr: "DBA Azure SQL" } }
        - { xp: 4000, title: { en: "Data platform architect", fr: "Architecte de plateforme de données" } }
        - { xp: 5000, title: { en: "SQL legend", fr: "Légende SQL" } }
      mastery: { bronze: 650, silver: 700, gold: 850 }
      badges:
        hatTrick: { count: 3, min: 800 }
        regular: { weeks: 4 }
        comeback: { gain: 150 }

domains:
  - code: platform
    order: 1
    weight: { min: 0.15, max: 0.20 }
    title:
      en: "Plan and implement data platform resources"
      fr: "Planifier et implémenter des ressources de plateforme de données"
  - code: security
    order: 2
    weight: { min: 0.20, max: 0.25 }
    title:
      en: "Implement a secure environment"
      fr: "Implémenter un environnement sécurisé"
  - code: performance
    order: 3
    weight: { min: 0.20, max: 0.25 }
    title:
      en: "Monitor, configure, and optimize database resources"
      fr: "Surveiller, configurer et optimiser les ressources de base de données"
  - code: automation
    order: 4
    weight: { min: 0.15, max: 0.20 }
    title:
      en: "Configure and manage automation of tasks"
      fr: "Configurer et gérer l'automatisation des tâches"
  - code: hadr
    order: 5
    weight: { min: 0.20, max: 0.25 }
    title:
      en: "Plan and configure a high availability and disaster recovery (HA/DR) environment"
      fr: "Planifier et mettre en œuvre un environnement de haute disponibilité et de reprise après sinistre (HA/DR)"
