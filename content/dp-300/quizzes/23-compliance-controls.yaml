chapter: 23-compliance-controls
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-23-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum uses Data Discovery & Classification on an Azure SQL database named **Sales**. You accept the recommendation to classify the `Sales.Customer.Email` column with the label Confidential and the information type Contact Info.

        What does this change in the database?
      fr: |
        Adatum utilise Découverte et classification des données sur une base de données Azure SQL nommée **Sales**. Vous acceptez la recommandation de classifier la colonne `Sales.Customer.Email` avec l'étiquette Confidential et le type d'informations Contact Info.

        Qu'est-ce que cela change dans la base de données ?
    body:
      options:
        - { id: a, text: { en: "A masking rule hides the Email values from users who lack the UNMASK permission.", fr: "Une règle de masquage cache les valeurs d'Email aux utilisateurs qui n'ont pas l'autorisation UNMASK." } }
        - { id: b, text: { en: "Persistent sensitivity attributes are added to the metadata of the Email column.", fr: "Des attributs de sensibilité persistants sont ajoutés aux métadonnées de la colonne Email." } }
        - { id: c, text: { en: "The Email values are encrypted with a key that only Confidential readers can open.", fr: "Les valeurs d'Email sont chiffrées avec une clé que seuls les lecteurs Confidential peuvent ouvrir." } }
        - { id: d, text: { en: "SELECT on the Email column is denied to users who lack the SQL Security Manager role.", fr: "SELECT sur la colonne Email est refusé aux utilisateurs qui n'ont pas le rôle SQL Security Manager." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Classification applies persistent sensitivity labels and information types to columns as metadata attributes of the database engine, visible in `sys.sensitivity_classifications`. It labels and reports; auditing can then record the labels of the data that each query returns. It doesn't mask, encrypt or block anything by itself.
        fr: |
          La classification applique aux colonnes des étiquettes de sensibilité et des types d'informations persistants, sous forme d'attributs de métadonnées du moteur de base de données, visibles dans `sys.sensitivity_classifications`. Elle étiquette et rapporte ; l'audit peut ensuite enregistrer les étiquettes des données que renvoie chaque requête. Elle ne masque, ne chiffre et ne bloque rien par elle-même.
      options:
        a: { en: "Masking is a separate feature, dynamic data masking; classifying a column adds no masking rule.", fr: "Le masquage est une fonctionnalité distincte, le masquage dynamique des données ; classifier une colonne n'ajoute aucune règle de masquage." }
        c: { en: "Classification doesn't encrypt data; Always Encrypted or column-level encryption would be needed for that.", fr: "La classification ne chiffre pas les données ; il faudrait Always Encrypted ou le chiffrement au niveau des colonnes pour cela." }
        d: { en: "SQL Security Manager is an Azure role that can manage classifications; classification never denies data access.", fr: "SQL Security Manager est un rôle Azure qui peut gérer les classifications ; la classification ne refuse jamais l'accès aux données." }
    references:
      - title: Data Discovery & Classification - Azure SQL Database & Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/data-discovery-and-classification-overview

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-23-02
    objective: "2.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have an Azure SQL database named **Telemetry**, with change tracking enabled at the database level. The `dbo.Readings` table has no primary key and no unique constraint.

        You run `ALTER TABLE dbo.Readings ENABLE CHANGE_TRACKING;` and the statement fails. What should you do before you run the statement again?
      fr: |
        Vous disposez d'une base de données Azure SQL nommée **Telemetry**, avec le suivi des modifications activé au niveau de la base. La table `dbo.Readings` n'a ni clé primaire ni contrainte unique.

        Vous exécutez `ALTER TABLE dbo.Readings ENABLE CHANGE_TRACKING;` et l'instruction échoue. Que devez-vous faire avant d'exécuter de nouveau l'instruction ?
    body:
      options:
        - { id: a, text: { en: "Set the `ALLOW_SNAPSHOT_ISOLATION` option of Telemetry to ON.", fr: "Définir l'option `ALLOW_SNAPSHOT_ISOLATION` de Telemetry sur ON." } }
        - { id: b, text: { en: "Add `WITH (TRACK_COLUMNS_UPDATED = ON)` to the statement.", fr: "Ajouter `WITH (TRACK_COLUMNS_UPDATED = ON)` à l'instruction." } }
        - { id: c, text: { en: "Enable change data capture on Telemetry with `sys.sp_cdc_enable_db`.", fr: "Activer la capture des changements de données sur Telemetry avec `sys.sp_cdc_enable_db`." } }
        - { id: d, text: { en: "Add a primary key constraint to the `dbo.Readings` table.", fr: "Ajouter une contrainte de clé primaire à la table `dbo.Readings`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Change tracking records only the primary key values of the changed rows, so a table must have a primary key before change tracking can be enabled on it. Database-level change tracking is already on, which is the other prerequisite.
        fr: |
          Le suivi des modifications n'enregistre que les valeurs de clé primaire des lignes modifiées : une table doit donc avoir une clé primaire avant de pouvoir activer le suivi des modifications sur elle. Le suivi des modifications au niveau de la base est déjà activé, ce qui est l'autre prérequis.
      options:
        a: { en: "Snapshot isolation is strongly recommended for consistent change information, but it isn't required to enable change tracking.", fr: "L'isolation de capture instantanée est fortement recommandée pour des informations de modification cohérentes, mais elle n'est pas exigée pour activer le suivi des modifications." }
        b: { en: "TRACK_COLUMNS_UPDATED only adds which columns changed; it doesn't remove the primary key requirement.", fr: "TRACK_COLUMNS_UPDATED ajoute seulement quelles colonnes ont changé ; il ne lève pas l'exigence de clé primaire." }
        c: { en: "Change data capture is a separate feature; enabling it doesn't let change tracking work on a table without a primary key.", fr: "La capture des changements de données est une fonctionnalité distincte ; l'activer ne permet pas au suivi des modifications de fonctionner sur une table sans clé primaire." }
    references:
      - title: ALTER TABLE (Transact-SQL) - SQL Server
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-table-transact-sql
      - title: Enable and Disable Change Tracking - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/track-changes/enable-and-disable-change-tracking-sql-server

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-23-03
    objective: "2.3.4"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders has an Azure SQL database that contains a table named `dbo.Member` with the columns `BirthDate` (date), `Phone` (varchar(20)) and `CreditScore` (int). No masking rule exists.

        Users who lack the UNMASK permission must see the following:

        - `BirthDate`: the year is hidden, while the month and the day stay visible.
        - `Phone`: only the first three characters stay visible, followed by `XXXXXXX`.
        - `CreditScore`: a random value between 300 and 850.

        How should you complete the Transact-SQL statements? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'une base de données Azure SQL qui contient une table nommée `dbo.Member` avec les colonnes `BirthDate` (date), `Phone` (varchar(20)) et `CreditScore` (int). Aucune règle de masquage n'existe.

        Les utilisateurs qui n'ont pas l'autorisation UNMASK doivent voir ce qui suit :

        - `BirthDate` : l'année est masquée, tandis que le mois et le jour restent visibles.
        - `Phone` : seuls les trois premiers caractères restent visibles, suivis de `XXXXXXX`.
        - `CreditScore` : une valeur aléatoire comprise entre 300 et 850.

        Comment devez-vous compléter les instructions Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        ALTER TABLE dbo.Member ALTER COLUMN BirthDate
            ADD MASKED WITH (FUNCTION = '[[birth]]');

        ALTER TABLE dbo.Member ALTER COLUMN Phone
            ADD MASKED WITH (FUNCTION = '[[phone]]');

        ALTER TABLE dbo.Member ALTER COLUMN CreditScore
            ADD MASKED WITH (FUNCTION = '[[score]]');
      slots:
        - id: birth
          options:
            - { id: b_default, text: "default()" }
            - { id: b_year, text: "datetime(\"Y\")" }
            - { id: b_day, text: "datetime(\"D\")" }
        - id: phone
          options:
            - { id: p_suffix, text: "partial(0,\"XXXXXXX\",3)" }
            - { id: p_email, text: "email()" }
            - { id: p_prefix, text: "partial(3,\"XXXXXXX\",0)" }
            - { id: p_default, text: "default()" }
        - id: score
          options:
            - { id: s_default, text: "default()" }
            - { id: s_year, text: "datetime(\"Y\")" }
            - { id: s_random, text: "random(300, 850)" }
    answer:
      values: { birth: b_year, phone: p_prefix, score: s_random }
    explanation:
      correct:
        en: |
          `datetime("Y")` masks only the year part of a date or time value. `partial(prefix, padding, suffix)` keeps the given number of characters at the start and the end: `partial(3,"XXXXXXX",0)` exposes the first three characters and pads the rest. `random(start, end)` replaces a numeric value with a random value in the range.
        fr: |
          `datetime("Y")` ne masque que la partie année d'une valeur de date ou d'heure. `partial(préfixe, remplissage, suffixe)` conserve le nombre de caractères indiqué au début et à la fin : `partial(3,"XXXXXXX",0)` expose les trois premiers caractères et remplace le reste. `random(début, fin)` remplace une valeur numérique par une valeur aléatoire de la plage.
      options:
        b_default: { en: "default() masks the whole date as 1900-01-01, so the month and the day would be hidden too.", fr: "default() masque toute la date en 1900-01-01 : le mois et le jour seraient donc masqués aussi." }
        b_day: { en: "datetime(\"D\") masks the day, not the year.", fr: "datetime(\"D\") masque le jour, pas l'année." }
        p_suffix: { en: "This mask exposes the last three characters instead of the first three.", fr: "Ce masque expose les trois derniers caractères au lieu des trois premiers." }
        s_default: { en: "default() returns 0 for numbers, not a random value in the range.", fr: "default() renvoie 0 pour les nombres, pas une valeur aléatoire de la plage." }
    references:
      - title: Dynamic Data Masking - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking
      - title: Dynamic Data Masking - Azure SQL Database & Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-23-04
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has an Azure SQL Database logical server named **sql-wood** that hosts 30 databases. Server-level auditing sends the events of all the databases to a storage account named **stwoodaudit**, and this configuration must stay in place.

        The security operations team needs the audit events of the **Payments** database, and of no other database, in a Log Analytics workspace named **law-soc**. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'un serveur logique Azure SQL Database nommé **sql-wood** qui héberge 30 bases de données. L'audit au niveau du serveur envoie les événements de toutes les bases vers un compte de stockage nommé **stwoodaudit**, et cette configuration doit rester en place.

        L'équipe des opérations de sécurité a besoin des événements d'audit de la base **Payments**, et d'aucune autre base, dans un espace de travail Log Analytics nommé **law-soc**. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add law-soc as a second destination of the server-level auditing policy of sql-wood.", fr: "Ajouter law-soc comme deuxième destination de la stratégie d'audit au niveau du serveur de sql-wood." } }
        - { id: b, text: { en: "Enable database-level auditing on Payments, with law-soc as its destination.", fr: "Activer l'audit au niveau de la base sur Payments, avec law-soc comme destination." } }
        - { id: c, text: { en: "Enable auditing of Microsoft support operations on sql-wood, with law-soc as its destination.", fr: "Activer l'audit des opérations du support Microsoft sur sql-wood, avec law-soc comme destination." } }
        - { id: d, text: { en: "Move Payments to a new logical server, and enable server-level auditing there to law-soc.", fr: "Déplacer Payments vers un nouveau serveur logique, et y activer l'audit au niveau du serveur vers law-soc." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A database-level auditing policy applies to one database, in addition to the server-level policy. Payments keeps being audited to stwoodaudit by the server policy, and its own policy also sends its events to law-soc, while the other 29 databases send nothing there.
        fr: |
          Une stratégie d'audit au niveau de la base s'applique à une seule base, en plus de la stratégie au niveau du serveur. Payments reste auditée vers stwoodaudit par la stratégie du serveur, et sa propre stratégie envoie aussi ses événements vers law-soc, tandis que les 29 autres bases n'y envoient rien.
      options:
        a: { en: "The server-level policy covers every database of the server, so the 29 other databases would also be sent to law-soc.", fr: "La stratégie au niveau du serveur couvre toutes les bases du serveur : les 29 autres bases seraient donc aussi envoyées vers law-soc." }
        c: { en: "This option records the operations of Microsoft support engineers on the server, not the events of the Payments database.", fr: "Cette option enregistre les opérations des ingénieurs du support Microsoft sur le serveur, pas les événements de la base Payments." }
        d: { en: "A new server would work, but moving the database and recreating its settings is far more effort than one database policy.", fr: "Un nouveau serveur fonctionnerait, mais déplacer la base et recréer ses paramètres demande bien plus d'effort qu'une stratégie de base." }
    references:
      - title: Auditing - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-23-05
    objective: "2.3.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam creates an Azure SQL database named **Claims** and configures it as a ledger database during the creation. Automatic digest storage uploads the digests to a storage account protected by an immutability policy.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam crée une base de données Azure SQL nommée **Claims** et la configure comme base de données de registre lors de la création. Le stockage automatique des synthèses charge les synthèses dans un compte de stockage protégé par une stratégie d'immuabilité.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A developer who runs `CREATE TABLE dbo.Notes (...)` without any LEDGER option creates an updatable ledger table.", fr: "Un développeur qui exécute `CREATE TABLE dbo.Notes (...)` sans aucune option LEDGER crée une table de registre modifiable." }
        - id: s2
          text: { en: "If no transaction runs on Claims during a 30-second interval, no database digest is uploaded for that interval.", fr: "Si aucune transaction ne s'exécute sur Claims pendant un intervalle de 30 secondes, aucune synthèse de base de données n'est chargée pour cet intervalle." }
        - id: s3
          text: { en: "If the ledger overhead becomes too high, you can convert Claims to a regular database.", fr: "Si la surcharge du registre devient trop importante, vous pouvez convertir Claims en base de données ordinaire." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A ledger database can contain only ledger tables, and a table created without options is an updatable ledger table with default settings. Automatic digests are generated every 30 seconds, but only when transactions occurred in the interval. The ledger setting is chosen at creation, and a ledger database can't be converted to a regular database afterward.
        fr: |
          Une base de données de registre ne peut contenir que des tables de registre, et une table créée sans option est une table de registre modifiable avec les paramètres par défaut. Les synthèses automatiques sont générées toutes les 30 secondes, mais seulement si des transactions ont eu lieu pendant l'intervalle. Le paramètre de registre se choisit à la création, et une base de données de registre ne peut pas être convertie ensuite en base ordinaire.
      options:
        s3: { en: "Once created, a ledger database can't be converted to a regular database.", fr: "Une fois créée, une base de données de registre ne peut pas être convertie en base ordinaire." }
    references:
      - title: Ledger Overview - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview
      - title: Digest management - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-digest-management

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-23-06
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adventure Works has an Azure SQL database named **HR** that contains the `HR.Employee` table, with the columns `EmployeeID`, `FullName`, `Department`, `Phone` and `Salary`. You have the following requirements:

        - Members of the **SupportAgents** database role use a helpdesk app to verify callers. They must see only the last four digits of `Phone`, in the form `XXX-XXX-1234`.
        - Members of the **Analysts** database role run ad hoc queries on `HR.Employee` to count employees per department. They don't need `Salary`, and they must not be able to determine or estimate the salary of any employee by using any query.
        - The HR application connects as a user that is a member of a role that already holds the UNMASK permission, and it must keep reading every value in plaintext.

        Both roles currently have SELECT on `HR.Employee`. No masking rule or security policy exists.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adventure Works dispose d'une base de données Azure SQL nommée **HR** qui contient la table `HR.Employee`, avec les colonnes `EmployeeID`, `FullName`, `Department`, `Phone` et `Salary`. Vous avez les exigences suivantes :

        - Les membres du rôle de base de données **SupportAgents** utilisent une application de support pour vérifier l'identité des appelants. Ils ne doivent voir que les quatre derniers chiffres de `Phone`, sous la forme `XXX-XXX-1234`.
        - Les membres du rôle de base de données **Analysts** exécutent des requêtes ad hoc sur `HR.Employee` pour compter les employés par service. Ils n'ont pas besoin de `Salary`, et ils ne doivent pouvoir ni déterminer ni estimer le salaire d'un employé, avec quelque requête que ce soit.
        - L'application RH se connecte avec un utilisateur membre d'un rôle qui détient déjà l'autorisation UNMASK, et elle doit continuer à lire toutes les valeurs en clair.

        Les deux rôles ont actuellement SELECT sur `HR.Employee`. Aucune règle de masquage ni aucune stratégie de sécurité n'existe.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add a mask that uses `partial(0,\"XXX-XXX-\",4)` to the Phone column.", fr: "Ajouter un masque qui utilise `partial(0,\"XXX-XXX-\",4)` à la colonne Phone." } }
        - { id: b, text: { en: "Add a mask that uses `default()` to the Salary column.", fr: "Ajouter un masque qui utilise `default()` à la colonne Salary." } }
        - { id: c, text: { en: "Run `DENY SELECT ON HR.Employee (Salary) TO Analysts;`.", fr: "Exécuter `DENY SELECT ON HR.Employee (Salary) TO Analysts;`." } }
        - { id: d, text: { en: "Create a security policy with a filter predicate on Salary for the Analysts role.", fr: "Créer une stratégie de sécurité avec un prédicat de filtre sur Salary pour le rôle Analysts." } }
        - { id: e, text: { en: "Run `GRANT UNMASK ON HR.Employee (Phone) TO SupportAgents;`.", fr: "Exécuter `GRANT UNMASK ON HR.Employee (Phone) TO SupportAgents;`." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A `partial` mask that keeps the last four characters gives support agents the format they need, while the HR application still sees plaintext through its UNMASK permission. Masking can't protect Salary from ad hoc users, who can guess values with range filters such as `WHERE Salary > 99999 AND Salary < 100001`. A column-level DENY SELECT stops the analysts from reading or filtering on Salary at all, and they don't need the column.
        fr: |
          Un masque `partial` qui conserve les quatre derniers caractères donne aux agents du support le format dont ils ont besoin, tandis que l'application RH voit toujours le texte en clair grâce à son autorisation UNMASK. Le masquage ne peut pas protéger Salary contre des utilisateurs ad hoc, qui peuvent deviner les valeurs avec des filtres de plage comme `WHERE Salary > 99999 AND Salary < 100001`. Un DENY SELECT au niveau de la colonne empêche les analystes de lire Salary ou de filtrer dessus, et ils n'ont pas besoin de cette colonne.
      options:
        b: { en: "A mask hides values in results only; analysts could still infer salaries with WHERE clauses on the real values.", fr: "Un masque ne cache les valeurs que dans les résultats ; les analystes pourraient toujours déduire les salaires avec des clauses WHERE sur les vraies valeurs." }
        d: { en: "Row-level security filters rows, not columns: analysts would lose rows, and the rows they keep would still show Salary.", fr: "La sécurité au niveau des lignes filtre des lignes, pas des colonnes : les analystes perdraient des lignes, et celles qu'ils gardent montreraient toujours Salary." }
        e: { en: "UNMASK on Phone would show support agents the full phone numbers instead of the last four digits.", fr: "UNMASK sur Phone montrerait aux agents du support les numéros complets au lieu des quatre derniers chiffres." }
    references:
      - title: Dynamic Data Masking - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/dynamic-data-masking
      - title: Dynamic Data Masking - Azure SQL Database & Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-23-07
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware has an Azure SQL Database logical server named **sql-lit**. Its auditing is configured as follows:

        - Server-level auditing writes to a general-purpose v2 storage account named **stlitaudit**. The audit container has a locked time-based retention policy, and its **Allow protected append writes** setting is **None**.
        - Auditing of Microsoft support operations is enabled, with a Log Analytics workspace named **law-lit** as its destination.
        - The **Claims** database also has database-level auditing, with an event hub named **eh-lit** as its destination.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un serveur logique Azure SQL Database nommé **sql-lit**. Son audit est configuré comme suit :

        - L'audit au niveau du serveur écrit dans un compte de stockage v2 universel nommé **stlitaudit**. Le conteneur d'audit a une stratégie de rétention limitée dans le temps verrouillée, et son paramètre **Allow protected append writes** est défini sur **None**.
        - L'audit des opérations du support Microsoft est activé, avec un espace de travail Log Analytics nommé **law-lit** comme destination.
        - La base **Claims** dispose aussi d'un audit au niveau de la base, avec un hub d'événements nommé **eh-lit** comme destination.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The server-level audit logs of sql-lit are written to stlitaudit with this immutability configuration.", fr: "Les journaux de l'audit au niveau du serveur de sql-lit sont écrits dans stlitaudit avec cette configuration d'immuabilité." }
        - id: s2
          text: { en: "The operations that a Microsoft support engineer performs on sql-lit during a support request are recorded in law-lit.", fr: "Les opérations qu'un ingénieur du support Microsoft effectue sur sql-lit pendant une demande de support sont enregistrées dans law-lit." }
        - id: s3
          text: { en: "The audit events of the Claims database are also sent to law-lit.", fr: "Les événements d'audit de la base Claims sont aussi envoyés vers law-lit." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          SQL auditing writes append blobs, so an immutable container must allow protected append writes (Append blobs or Block and append blobs); None isn't supported. Auditing of Microsoft support operations is a separate server setting with its own destination: law-lit receives the support engineers' operations only. The events of Claims go to stlitaudit through the server policy and to eh-lit through the database policy, not to law-lit.
        fr: |
          L'audit SQL écrit des objets blob d'ajout : un conteneur immuable doit donc autoriser les écritures d'ajout protégées (Append blobs ou Block and append blobs) ; None n'est pas pris en charge. L'audit des opérations du support Microsoft est un paramètre distinct du serveur, avec sa propre destination : law-lit ne reçoit que les opérations des ingénieurs du support. Les événements de Claims vont vers stlitaudit par la stratégie du serveur et vers eh-lit par la stratégie de la base, pas vers law-lit.
      options:
        s1: { en: "With Allow protected append writes set to None, the immutable container can't receive the audit append blobs.", fr: "Avec Allow protected append writes défini sur None, le conteneur immuable ne peut pas recevoir les objets blob d'ajout de l'audit." }
        s3: { en: "law-lit is only the destination of the support operations audit; database events follow the server and database policies.", fr: "law-lit n'est que la destination de l'audit des opérations du support ; les événements des bases suivent les stratégies du serveur et de la base." }
    references:
      - title: Auditing - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
      - title: Auditing Microsoft Support Operations - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-microsoft-support-operations

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-23-08
    objective: "2.3.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has an Azure SQL database named **FinDB** that contains updatable ledger tables. Regulators require that the database digests be stored only on Contoso's on-premises write once, read many (WORM) device: no digest may be uploaded to an Azure service.

        Every hour, a scheduled job that connects to FinDB as the database user **digest_job** generates a digest and copies its JSON output to the device. Each quarter, an auditor verifies FinDB against all the digests read from the device. The solution must follow the principle of least privilege.

        How should you complete the Transact-SQL statements? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'une base de données Azure SQL nommée **FinDB** qui contient des tables de registre modifiables. Les régulateurs exigent que les synthèses de base de données soient stockées uniquement sur le périphérique WORM (write once, read many) local de Contoso : aucune synthèse ne doit être chargée dans un service Azure.

        Toutes les heures, un travail planifié qui se connecte à FinDB avec l'utilisateur de base de données **digest_job** génère une synthèse et copie sa sortie JSON sur le périphérique. Chaque trimestre, un auditeur vérifie FinDB par rapport à toutes les synthèses lues sur le périphérique. La solution doit respecter le principe du moindre privilège.

        Comment devez-vous compléter les instructions Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template:
        en: |
          -- Once, run by the database owner
          GRANT [[perm]] TO digest_job;

          -- Every hour, run by digest_job
          EXECUTE [[gen]];

          -- Each quarter, run by the auditor
          -- @stored_digests holds the digests read from the WORM device
          EXECUTE [[verify]] @digests = @stored_digests;
        fr: |
          -- Une fois, exécuté par le propriétaire de la base
          GRANT [[perm]] TO digest_job;

          -- Toutes les heures, exécuté par digest_job
          EXECUTE [[gen]];

          -- Chaque trimestre, exécuté par l'auditeur
          -- @stored_digests contient les synthèses lues sur le périphérique WORM
          EXECUTE [[verify]] @digests = @stored_digests;
      slots:
        - id: perm
          options:
            - { id: p_view, text: VIEW LEDGER CONTENT }
            - { id: p_gen, text: GENERATE LEDGER DIGEST }
            - { id: p_control, text: CONTROL }
        - id: gen
          options:
            - { id: g_verify, text: sys.sp_verify_database_ledger }
            - { id: g_copy, text: sys.sp_copy_data_in_batches }
            - { id: g_gen, text: sys.sp_generate_database_ledger_digest }
        - id: verify
          options:
            - { id: v_manual, text: sys.sp_verify_database_ledger }
            - { id: v_storage, text: sys.sp_verify_database_ledger_from_digest_storage }
            - { id: v_gen, text: sys.sp_generate_database_ledger_digest }
    answer:
      values: { perm: p_gen, gen: g_gen, verify: v_manual }
    explanation:
      correct:
        en: |
          Because no digest may go to an Azure service, automatic digest storage is excluded and the digests are generated manually with `sys.sp_generate_database_ledger_digest`, which requires only the GENERATE LEDGER DIGEST permission. `sys.sp_verify_database_ledger` takes a JSON document of digests in its `@digests` argument, which fits digests kept on your own trusted device.
        fr: |
          Comme aucune synthèse ne doit aller dans un service Azure, le stockage automatique des synthèses est exclu, et les synthèses sont générées manuellement avec `sys.sp_generate_database_ledger_digest`, qui n'exige que l'autorisation GENERATE LEDGER DIGEST. `sys.sp_verify_database_ledger` prend un document JSON de synthèses dans son argument `@digests`, ce qui convient à des synthèses conservées sur votre propre périphérique approuvé.
      options:
        p_view: { en: "VIEW LEDGER CONTENT is the permission for verifying the ledger, not for generating digests.", fr: "VIEW LEDGER CONTENT est l'autorisation de vérification du registre, pas celle de génération des synthèses." }
        p_control: { en: "CONTROL would work but grants far more than generating digests, which breaks least privilege.", fr: "CONTROL fonctionnerait, mais accorde bien plus que la génération des synthèses, ce qui enfreint le moindre privilège." }
        g_copy: { en: "sys.sp_copy_data_in_batches copies rows from a regular table to a ledger table during a migration.", fr: "sys.sp_copy_data_in_batches copie des lignes d'une table ordinaire vers une table de registre lors d'une migration." }
        v_storage: { en: "This procedure verifies against the digest locations of automatic digest storage, which isn't used here.", fr: "Cette procédure vérifie par rapport aux emplacements du stockage automatique des synthèses, qui n'est pas utilisé ici." }
    references:
      - title: Digest management - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-digest-management
      - title: sys.sp_verify_database_ledger (Transact-SQL) - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sys-sp-verify-database-ledger-transact-sql

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-23-09
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has an Azure SQL database named **Logistics** in the General Purpose service tier. Change data capture (CDC) isn't enabled. The `Sales.Shipments` table has no primary key, but it has a unique nonclustered index named **UX_Shipments_TrackingNo** on the `TrackingNo` column. The schema of the table can't be changed.

        An ETL process runs every 30 minutes. For each load window, it must receive one row per changed shipment, with the final values of the row. Apart from the members of `db_owner`, only the members of a database role named **EtlReaders** may read the change data.

        How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'une base de données Azure SQL nommée **Logistics** dans le niveau de service General Purpose. La capture des changements de données (CDC) n'est pas activée. La table `Sales.Shipments` n'a pas de clé primaire, mais elle a un index non cluster unique nommé **UX_Shipments_TrackingNo** sur la colonne `TrackingNo`. Le schéma de la table ne peut pas être modifié.

        Un processus ETL s'exécute toutes les 30 minutes. Pour chaque fenêtre de chargement, il doit recevoir une ligne par expédition modifiée, avec les valeurs finales de la ligne. En dehors des membres de `db_owner`, seuls les membres d'un rôle de base de données nommé **EtlReaders** peuvent lire les données modifiées.

        Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template:
        en: |
          EXECUTE [[db]];

          EXECUTE sys.sp_cdc_enable_table
              @source_schema = N'Sales',
              @source_name = N'Shipments',
              @role_name = [[role]],
              @supports_net_changes = 1,
              @index_name = [[idx]];

          -- ETL query for each load window
          SELECT * FROM [[fn]](@from_lsn, @to_lsn, N'all');
        fr: |
          EXECUTE [[db]];

          EXECUTE sys.sp_cdc_enable_table
              @source_schema = N'Sales',
              @source_name = N'Shipments',
              @role_name = [[role]],
              @supports_net_changes = 1,
              @index_name = [[idx]];

          -- Requête ETL de chaque fenêtre de chargement
          SELECT * FROM [[fn]](@from_lsn, @to_lsn, N'all');
      slots:
        - id: db
          options:
            - { id: d_start, text: sys.sp_cdc_start_job }
            - { id: d_enable, text: sys.sp_cdc_enable_db }
            - { id: d_change, text: sys.sp_cdc_change_job }
        - id: role
          options:
            - { id: r_null, text: "NULL" }
            - { id: r_owner, text: "N'db_owner'" }
            - { id: r_etl, text: "N'EtlReaders'" }
        - id: idx
          options:
            - { id: i_ux, text: "N'UX_Shipments_TrackingNo'" }
            - { id: i_null, text: "NULL" }
            - { id: i_col, text: "N'TrackingNo'" }
        - id: fn
          options:
            - { id: f_all, text: cdc.fn_cdc_get_all_changes_Sales_Shipments }
            - { id: f_map, text: sys.fn_cdc_map_time_to_lsn }
            - { id: f_net, text: cdc.fn_cdc_get_net_changes_Sales_Shipments }
    answer:
      values: { db: d_enable, role: r_etl, idx: i_ux, fn: f_net }
    explanation:
      correct:
        en: |
          CDC must first be enabled for the database with `sys.sp_cdc_enable_db`, by a member of `db_owner`. `@role_name` sets the gating role that limits access to the change data. Net changes require a primary key or a unique index named in `@index_name`, and the default capture instance `Sales_Shipments` then gets a net changes function, which returns one row per changed row with its final values.
        fr: |
          La CDC doit d'abord être activée pour la base avec `sys.sp_cdc_enable_db`, par un membre de `db_owner`. `@role_name` définit le rôle de contrôle qui limite l'accès aux données modifiées. Les modifications nettes exigent une clé primaire ou un index unique indiqué dans `@index_name`, et l'instance de capture par défaut `Sales_Shipments` reçoit alors une fonction de modifications nettes, qui renvoie une ligne par ligne modifiée avec ses valeurs finales.
      options:
        d_start: { en: "Starting a job doesn't enable CDC for the database; in Azure SQL Database, a built-in scheduler runs capture and cleanup.", fr: "Démarrer un travail n'active pas la CDC pour la base ; dans Azure SQL Database, un planificateur intégré exécute la capture et le nettoyage." }
        r_null: { en: "NULL means that no gating role limits access to the change data.", fr: "NULL signifie qu'aucun rôle de contrôle ne limite l'accès aux données modifiées." }
        r_owner: { en: "With db_owner as the gating role, only db_owner members could read the change data, and the ETL process in EtlReaders couldn't.", fr: "Avec db_owner comme rôle de contrôle, seuls les membres de db_owner pourraient lire les données modifiées, et pas le processus ETL du rôle EtlReaders." }
        i_null: { en: "Without a primary key, @supports_net_changes = 1 requires @index_name to name a unique index.", fr: "Sans clé primaire, @supports_net_changes = 1 exige que @index_name désigne un index unique." }
        i_col: { en: "@index_name takes the name of a unique index, not the name of a column.", fr: "@index_name prend le nom d'un index unique, pas le nom d'une colonne." }
        f_all: { en: "The all changes function returns every change in the window, possibly several rows per shipment.", fr: "La fonction de toutes les modifications renvoie chaque changement de la fenêtre, éventuellement plusieurs lignes par expédition." }
    references:
      - title: sys.sp_cdc_enable_table (Transact-SQL) - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sys-sp-cdc-enable-table-transact-sql
      - title: Change Data Capture (CDC) With Azure SQL Database - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/change-data-capture-overview

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-23-10
    objective: "2.3.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Wingtip Toys has an Azure SQL database that contains a table named `Sales.Orders`. The `SalesRep` column contains the database user name of the sales representative who owns each order.

        The representatives connect with their own database users and have the SELECT, UPDATE and DELETE permissions on `Sales.Orders`. They have no INSERT permission: an import process inserts the orders under its own database user. You create an inline table-valued function named `Security.fn_IsOwner(@SalesRep)`, with SCHEMABINDING, that returns a row when `@SalesRep` equals `USER_NAME()`.

        You need to create a security policy that meets the following requirements:

        - Every representative can read all the orders, for shared reports.
        - A representative can update or delete only their own orders.
        - A representative can't assign one of their orders to another representative.

        Which three predicates should the security policy contain? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys dispose d'une base de données Azure SQL qui contient une table nommée `Sales.Orders`. La colonne `SalesRep` contient le nom d'utilisateur de base de données du commercial propriétaire de chaque commande.

        Les commerciaux se connectent avec leurs propres utilisateurs de base de données et disposent des autorisations SELECT, UPDATE et DELETE sur `Sales.Orders`. Ils n'ont pas l'autorisation INSERT : un processus d'importation insère les commandes avec son propre utilisateur de base de données. Vous créez une fonction table inline nommée `Security.fn_IsOwner(@SalesRep)`, avec SCHEMABINDING, qui renvoie une ligne quand `@SalesRep` est égal à `USER_NAME()`.

        Vous devez créer une stratégie de sécurité qui répond aux exigences suivantes :

        - Chaque commercial peut lire toutes les commandes, pour des rapports partagés.
        - Un commercial ne peut mettre à jour ou supprimer que ses propres commandes.
        - Un commercial ne peut pas attribuer l'une de ses commandes à un autre commercial.

        Quels sont les trois prédicats que la stratégie de sécurité doit contenir ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: "ADD FILTER PREDICATE Security.fn_IsOwner(SalesRep) ON Sales.Orders" }
        - { id: b, text: "ADD BLOCK PREDICATE Security.fn_IsOwner(SalesRep) ON Sales.Orders AFTER INSERT" }
        - { id: c, text: "ADD BLOCK PREDICATE Security.fn_IsOwner(SalesRep) ON Sales.Orders AFTER UPDATE" }
        - { id: d, text: "ADD BLOCK PREDICATE Security.fn_IsOwner(SalesRep) ON Sales.Orders BEFORE UPDATE" }
        - { id: e, text: "ADD BLOCK PREDICATE Security.fn_IsOwner(SalesRep) ON Sales.Orders BEFORE DELETE" }
    answer: { optionIds: [c, d, e] }
    explanation:
      correct:
        en: |
          Block predicates restrict writes without hiding rows. BEFORE UPDATE rejects updates of rows that currently fail the predicate (another representative's orders), and BEFORE DELETE blocks the deletion of those rows. AFTER UPDATE rejects an update whose new values fail the predicate, so a representative can't set `SalesRep` to another user on one of their own orders.
        fr: |
          Les prédicats de blocage restreignent les écritures sans masquer de lignes. BEFORE UPDATE rejette les mises à jour des lignes qui ne satisfont pas actuellement le prédicat (les commandes d'un autre commercial), et BEFORE DELETE bloque la suppression de ces lignes. AFTER UPDATE rejette une mise à jour dont les nouvelles valeurs ne satisfont pas le prédicat : un commercial ne peut donc pas définir `SalesRep` sur un autre utilisateur pour l'une de ses propres commandes.
      options:
        a: { en: "A filter predicate would hide the other representatives' orders, but every representative must read all the orders.", fr: "Un prédicat de filtre masquerait les commandes des autres commerciaux, alors que chaque commercial doit lire toutes les commandes." }
        b: { en: "No requirement covers inserts, and this predicate would reject the import process's rows, whose SalesRep isn't its own user name.", fr: "Aucune exigence ne porte sur les insertions, et ce prédicat rejetterait les lignes du processus d'importation, dont le SalesRep n'est pas son propre nom d'utilisateur." }
    references:
      - title: Row-Level Security - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
