chapter: 13-migration
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-13-01
    objective: "1.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are comparing strategies to migrate a SQL Server database to Azure SQL Managed Instance. The team wants to understand the downtime of an online migration.

        During an online migration, when is the application unavailable?
      fr: |
        Vous comparez des stratégies pour migrer une base de données SQL Server vers Azure SQL Managed Instance. L'équipe veut comprendre le temps d'arrêt d'une migration en ligne.

        Pendant une migration en ligne, quand l'application est-elle indisponible ?
    body:
      options:
        - { id: a, text: { en: "During the initial copy of the data, and then again during the cutover", fr: "Pendant la copie initiale des données, puis de nouveau pendant le basculement" } }
        - { id: b, text: { en: "Only during the short cutover, after the target has received the last changes", fr: "Uniquement pendant le court basculement, une fois que la cible a reçu les dernières modifications" } }
        - { id: c, text: { en: "During the whole data copy, until the target database is brought online", fr: "Pendant toute la copie des données, jusqu'à la mise en ligne de la base cible" } }
        - { id: d, text: { en: "Never, because the source and the target both accept writes until the cutover", fr: "Jamais, car la source et la cible acceptent toutes deux des écritures jusqu'au basculement" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In an online migration, the data is copied while the source stays in use, and the changes made in the meantime keep replicating to the target. The application stops only for the cutover: writes stop, the last changes reach the target, and the application is repointed.
        fr: |
          Dans une migration en ligne, les données sont copiées pendant que la source reste utilisée, et les modifications faites entre-temps continuent d'être répliquées vers la cible. L'application ne s'arrête que pour le basculement : les écritures s'arrêtent, les dernières modifications atteignent la cible, puis l'application est redirigée.
      options:
        a: { en: "The source stays in use during the initial copy; that is the point of an online method.", fr: "La source reste utilisée pendant la copie initiale ; c'est tout l'intérêt d'une méthode en ligne." }
        c: { en: "That describes an offline migration, such as a backup and restore or a BACPAC.", fr: "Cela décrit une migration hors connexion, comme une sauvegarde et restauration ou un BACPAC." }
        d: { en: "Until the cutover, the target is read-only or restoring: only the source accepts writes, so the application must stop briefly.", fr: "Jusqu'au basculement, la cible est en lecture seule ou en cours de restauration : seule la source accepte des écritures, donc l'application doit s'arrêter brièvement." }
    references:
      - title: "Migration overview: SQL Server to Azure SQL Managed Instance"
        url: https://learn.microsoft.com/en-us/data-migration/sql-server/managed-instance/overview

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-13-02
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans to migrate a SQL Server 2019 database to Azure. The operations team doesn't want to manage operating systems or SQL Server patching after the migration. Stored procedures query other servers through linked servers and send notifications by using Database Mail. SQL Server Agent jobs run the nightly maintenance.

        You need to choose a target that supports these features without changing the code. Which target should you choose?
      fr: |
        Fabrikam prévoit de migrer une base de données SQL Server 2019 vers Azure. L'équipe d'exploitation ne veut gérer ni systèmes d'exploitation ni mises à jour correctives de SQL Server après la migration. Des procédures stockées interrogent d'autres serveurs via des serveurs liés et envoient des notifications avec Database Mail. Des travaux SQL Server Agent exécutent la maintenance nocturne.

        Vous devez choisir une cible qui prend en charge ces fonctionnalités sans modifier le code. Quelle cible devez-vous choisir ?
    body:
      options:
        - { id: a, text: Azure SQL Database (Hyperscale) }
        - { id: b, text: Azure SQL Database (General Purpose) }
        - { id: c, text: Azure SQL Managed Instance }
        - { id: d, text: SQL Server on Azure Virtual Machines }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Linked servers, Database Mail and SQL Server Agent are instance-level features. Azure SQL Managed Instance provides them as a fully managed service, with the operating system and patching handled by Azure, so the database can move without code changes.
        fr: |
          Les serveurs liés, Database Mail et SQL Server Agent sont des fonctionnalités de niveau instance. Azure SQL Managed Instance les fournit en tant que service entièrement managé, dont Azure gère le système d'exploitation et les mises à jour correctives ; la base peut donc migrer sans modification du code.
      options:
        a: { en: "Azure SQL Database, whatever its tier, has no SQL Server Agent, no Database Mail and no linked servers.", fr: "Azure SQL Database, quel que soit son niveau, n'a ni SQL Server Agent, ni Database Mail, ni serveurs liés." }
        b: { en: "The service tier doesn't add instance-level features: Azure SQL Database still lacks Agent jobs, Database Mail and linked servers.", fr: "Le niveau de service n'ajoute pas de fonctionnalités de niveau instance : Azure SQL Database n'a toujours ni travaux Agent, ni Database Mail, ni serveurs liés." }
        d: { en: "A virtual machine supports these features, but the team would have to manage the operating system and SQL Server, which it doesn't want.", fr: "Une machine virtuelle prend en charge ces fonctionnalités, mais l'équipe devrait gérer le système d'exploitation et SQL Server, ce qu'elle ne veut pas." }
    references:
      - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
      - title: "Migration overview: SQL Server to Azure SQL Managed Instance"
        url: https://learn.microsoft.com/en-us/data-migration/sql-server/managed-instance/overview

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-13-03
    objective: "1.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure SQL database named **CatalogDb** on a logical server named **sql-contoso**. CatalogDb must move to an Azure SQL managed instance named **mi-contoso**. You exported CatalogDb to a BACPAC file named CatalogDb.bacpac.

        You need to create CatalogDb on mi-contoso from the BACPAC file. What should you use?
      fr: |
        Contoso dispose d'une base de données Azure SQL nommée **CatalogDb** sur un serveur logique nommé **sql-contoso**. CatalogDb doit être déplacée vers une instance managée Azure SQL nommée **mi-contoso**. Vous avez exporté CatalogDb dans un fichier BACPAC nommé CatalogDb.bacpac.

        Vous devez créer CatalogDb sur mi-contoso à partir du fichier BACPAC. Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "SqlPackage with the Import action, with mi-contoso as the target server", fr: "SqlPackage avec l'action Import, avec mi-contoso comme serveur cible" } }
        - { id: b, text: { en: "The Import database page of the Azure portal, with mi-contoso as the target", fr: "La page Importer une base de données du portail Azure, avec mi-contoso comme cible" } }
        - { id: c, text: { en: "RESTORE DATABASE ... FROM URL on mi-contoso, with the URL of the BACPAC file", fr: "RESTORE DATABASE ... FROM URL sur mi-contoso, avec l'URL du fichier BACPAC" } }
        - { id: d, text: { en: "The az sql db import command, with mi-contoso as the server name", fr: "La commande az sql db import, avec mi-contoso comme nom de serveur" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A BACPAC is imported into a managed instance with SqlPackage (or SQL Server Management Studio), which connects to the instance and creates the database from the file. The Azure portal and Azure PowerShell don't support an import into a managed instance: their import service creates databases on logical servers.
        fr: |
          Un BACPAC s'importe dans une instance managée avec SqlPackage (ou SQL Server Management Studio), qui se connecte à l'instance et crée la base à partir du fichier. Le portail Azure et Azure PowerShell ne prennent pas en charge une importation dans une instance managée : leur service d'importation crée des bases sur des serveurs logiques.
      options:
        b: { en: "Import database in the portal creates a single database on a logical server; it can't target a managed instance.", fr: "Importer une base de données dans le portail crée une base unique sur un serveur logique ; il ne peut pas cibler une instance managée." }
        c: { en: "RESTORE reads native backup files (.bak), not BACPAC files, and Azure SQL Database can't produce a native backup for you to restore.", fr: "RESTORE lit des fichiers de sauvegarde natifs (.bak), pas des fichiers BACPAC, et Azure SQL Database ne peut pas produire de sauvegarde native à restaurer." }
        d: { en: "az sql db import targets a database on a logical server, not a managed instance.", fr: "az sql db import cible une base de données sur un serveur logique, pas une instance managée." }
    references:
      - title: "Quickstart: Import a BACPAC file to a database in Azure SQL Database or Azure SQL Managed Instance"
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/database-import

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-13-04
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Litware plans to migrate a database named **SalesDb** from SQL Server 2019 Enterprise to an Azure SQL managed instance named **mi-litware** by using the Managed Instance link. A site-to-site VPN connects the datacenter to the virtual network of mi-litware, but the firewalls and network security groups don't allow any SQL traffic yet. SalesDb has never been backed up.

        Which two actions must you perform before you create the link? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware prévoit de migrer une base de données nommée **SalesDb** de SQL Server 2019 Enterprise vers une instance managée Azure SQL nommée **mi-litware** à l'aide du lien Managed Instance. Un VPN site à site relie le centre de données au réseau virtuel de mi-litware, mais les pare-feu et les groupes de sécurité réseau n'autorisent encore aucun trafic SQL. SalesDb n'a jamais été sauvegardée.

        Quelles sont les deux actions à effectuer avant de créer le lien ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Upload a full backup of SalesDb taken WITH CHECKSUM to a Blob Storage container.", fr: "Charger une sauvegarde complète de SalesDb prise WITH CHECKSUM dans un conteneur Stockage Blob." } }
        - { id: b, text: { en: "Allow TCP port 5022 and TCP ports 11000-11999 between SQL Server and the mi-litware subnet.", fr: "Autoriser le port TCP 5022 et les ports TCP 11000-11999 entre SQL Server et le sous-réseau de mi-litware." } }
        - { id: c, text: { en: "Configure SQL Server as a distributor, and publish the tables of SalesDb.", fr: "Configurer SQL Server comme distributeur, puis publier les tables de SalesDb." } }
        - { id: d, text: { en: "Make sure that SalesDb uses the full recovery model, and take a full backup of SalesDb.", fr: "Vérifier que SalesDb utilise le mode de récupération complet, puis effectuer une sauvegarde complète de SalesDb." } }
        - { id: e, text: { en: "Connect SQL Server to Azure Arc, which the link requires to replicate the database.", fr: "Connecter SQL Server à Azure Arc, que le lien exige pour répliquer la base de données." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The link replicates the database through a distributed availability group, over the database mirroring endpoint (port 5022) and the ports 11000-11999 of the managed instance, so this traffic must be allowed first. Because the replication is based on the transaction log, a database replicated from SQL Server must use the full recovery model and have at least one full backup.
        fr: |
          Le lien réplique la base via un groupe de disponibilité distribué, par le point de terminaison de mise en miroir de bases de données (port 5022) et les ports 11000-11999 de l'instance managée : ce trafic doit donc d'abord être autorisé. Comme la réplication repose sur le journal des transactions, une base répliquée depuis SQL Server doit utiliser le mode de récupération complet et avoir au moins une sauvegarde complète.
      options:
        a: { en: "Backups uploaded to Blob Storage are the input of Log Replay Service, not of the link, which seeds the database itself.", fr: "Des sauvegardes chargées dans Stockage Blob sont l'entrée de Log Replay Service, pas du lien, qui amorce lui-même la base." }
        c: { en: "A distributor and a publication belong to transactional replication, another online method.", fr: "Un distributeur et une publication relèvent de la réplication transactionnelle, une autre méthode en ligne." }
        e: { en: "The link doesn't need Azure Arc: Arc can manage a migration that uses the link, but the link itself connects SQL Server and the instance directly.", fr: "Le lien n'a pas besoin d'Azure Arc : Arc peut piloter une migration qui utilise le lien, mais le lien relie directement SQL Server et l'instance." }
    references:
      - title: Prepare your environment for a link - Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-preparation

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-13-05
    objective: "1.3.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You started a database copy operation of a 2 TB database named **LedgerDb** from the managed instance **mi-tailspin-01** to the managed instance **mi-tailspin-02**, in the same region. After several hours, the operation is still in progress.

        You need to find out how many bytes have already been transferred and when the transfer is expected to finish. What should you query?
      fr: |
        Vous avez démarré une opération de copie d'une base de données de 2 To nommée **LedgerDb** de l'instance managée **mi-tailspin-01** vers l'instance managée **mi-tailspin-02**, dans la même région. Après plusieurs heures, l'opération est toujours en cours.

        Vous devez savoir combien d'octets ont déjà été transférés et quand le transfert devrait se terminer. Que devez-vous interroger ?
    body:
      options:
        - { id: a, text: "`sys.dm_operation_status`" }
        - { id: b, text: "`sys.dm_exec_requests`" }
        - { id: c, text: "`msdb.dbo.restorehistory`" }
        - { id: d, text: "`sys.dm_hadr_physical_seeding_stats`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Copy and move use availability group technology: the database is seeded to the destination. `sys.dm_hadr_physical_seeding_stats` shows the transfer rate, the bytes transferred, the database size and the estimated completion time of the seeding.
        fr: |
          La copie et le déplacement utilisent la technologie des groupes de disponibilité : la base est amorcée vers la destination. `sys.dm_hadr_physical_seeding_stats` affiche le débit de transfert, les octets transférés, la taille de la base et l'heure d'achèvement estimée de l'amorçage.
      options:
        a: { en: "sys.dm_operation_status lists management operations of Azure SQL Database (create, scale, copy) in master; it doesn't report seeding bytes on a managed instance.", fr: "sys.dm_operation_status liste les opérations de gestion d'Azure SQL Database (création, mise à l'échelle, copie) dans master ; il n'indique pas les octets amorcés sur une instance managée." }
        b: { en: "sys.dm_exec_requests shows the requests that run now, such as a BACKUP or RESTORE with its percentage; seeding isn't a user request with transferred bytes.", fr: "sys.dm_exec_requests affiche les requêtes en cours, comme un BACKUP ou un RESTORE avec son pourcentage ; l'amorçage n'est pas une requête utilisateur avec des octets transférés." }
        c: { en: "restorehistory records restores that are finished; a copy doesn't restore a backup and the table gives no progress.", fr: "restorehistory enregistre les restaurations terminées ; une copie ne restaure pas de sauvegarde et la table ne donne aucune progression." }
    references:
      - title: Copy or move a database - Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-13-06
    objective: "1.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank runs SQL Server 2019 Enterprise on two on-premises servers that host an Always On availability group named **AG-Loans**. AG-Loans contains a 3 TB database named LoansDb that receives writes all day. A site-to-site VPN connects the datacenter to an Azure virtual network named VNet-Data.

        You plan to migrate LoansDb to SQL Server 2019 on Azure virtual machines in VNet-Data. The cutover must take less than five minutes, and no committed transaction must be lost.

        What should you do?
      fr: |
        Woodgrove Bank exécute SQL Server 2019 Enterprise sur deux serveurs locaux qui hébergent un groupe de disponibilité Always On nommé **AG-Loans**. AG-Loans contient une base de données de 3 To nommée LoansDb qui reçoit des écritures toute la journée. Un VPN site à site relie le centre de données à un réseau virtuel Azure nommé VNet-Data.

        Vous prévoyez de migrer LoansDb vers SQL Server 2019 sur des machines virtuelles Azure dans VNet-Data. Le basculement doit durer moins de cinq minutes, et aucune transaction validée ne doit être perdue.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a Managed Instance link from the primary replica of AG-Loans to the virtual machine, and then fail the link over.", fr: "Créer un lien Managed Instance du réplica principal d'AG-Loans vers la machine virtuelle, puis basculer le lien." } }
        - { id: b, text: { en: "Start Log Replay Service in continuous mode to restore the backups on the virtual machine, and then run the complete command.", fr: "Démarrer Log Replay Service en mode continu pour restaurer les sauvegardes sur la machine virtuelle, puis exécuter la commande complete." } }
        - { id: c, text: { en: "Link AG-Loans and an availability group on the virtual machines in a distributed availability group, and then fail over.", fr: "Relier AG-Loans et un groupe de disponibilité des machines virtuelles dans un groupe de disponibilité distribué, puis basculer." } }
        - { id: d, text: { en: "Back up LoansDb to URL with COMPRESSION, and then run RESTORE DATABASE ... FROM URL on the virtual machine.", fr: "Sauvegarder LoansDb vers une URL avec COMPRESSION, puis exécuter RESTORE DATABASE ... FROM URL sur la machine virtuelle." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When an availability group already exists on-premises, a distributed availability group that spans it and a new availability group on the Azure virtual machines is the minimal-downtime method. LoansDb keeps serving the application while it replicates, and a planned failover, with synchronous commit at that time, makes Azure the primary in moments without losing committed transactions.
        fr: |
          Quand un groupe de disponibilité existe déjà en local, un groupe de disponibilité distribué qui le relie à un nouveau groupe de disponibilité sur les machines virtuelles Azure est la méthode au temps d'arrêt minimal. LoansDb continue de servir l'application pendant la réplication, et un basculement planifié, avec la validation synchrone à ce moment, fait d'Azure le réplica principal en quelques instants sans perte de transactions validées.
      options:
        a: { en: "The Managed Instance link targets Azure SQL Managed Instance only, not SQL Server on a virtual machine.", fr: "Le lien Managed Instance cible uniquement Azure SQL Managed Instance, pas SQL Server sur une machine virtuelle." }
        b: { en: "Log Replay Service is a service of Azure SQL Managed Instance; it doesn't restore backups on a virtual machine.", fr: "Log Replay Service est un service d'Azure SQL Managed Instance ; il ne restaure pas de sauvegardes sur une machine virtuelle." }
        d: { en: "A full backup and restore of 3 TB is an offline method: the application would be down far longer than five minutes, or later writes would be lost.", fr: "Une sauvegarde et restauration complète de 3 To est une méthode hors connexion : l'application serait arrêtée bien plus de cinq minutes, ou les écritures suivantes seraient perdues." }
    references:
      - title: "Migration overview: SQL Server to SQL Server on Azure VMs"
        url: https://learn.microsoft.com/en-us/data-migration/sql-server/virtual-machines/overview

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-13-07
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum has an on-premises SQL Server 2016 instance named **sqlsrv01** that hosts an 80 GB database named **HrDb**. You plan an offline migration of HrDb, schema and data, to a new single database named HrDb on the logical server **sql-adatum-prod**, during a weekend when the application is stopped.

        The storage accounts of Adatum are behind a firewall. You will run SqlPackage on a management workstation that can reach sqlsrv01 and sql-adatum-prod. You sign in to sql-adatum-prod with a Microsoft Entra account that requires multifactor authentication.

        How should you complete the commands? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'une instance SQL Server 2016 locale nommée **sqlsrv01** qui héberge une base de données de 80 Go nommée **HrDb**. Vous prévoyez une migration hors connexion de HrDb, schéma et données, vers une nouvelle base unique nommée HrDb sur le serveur logique **sql-adatum-prod**, pendant un week-end où l'application est arrêtée.

        Les comptes de stockage d'Adatum sont derrière un pare-feu. Vous exécuterez SqlPackage sur un poste d'administration qui peut atteindre sqlsrv01 et sql-adatum-prod. Vous vous connectez à sql-adatum-prod avec un compte Microsoft Entra qui exige l'authentification multifacteur.

        Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        SqlPackage /a:[[exp]] /ssn:sqlsrv01 /sdn:HrDb /[[f1]]:HrDb.bacpac

        SqlPackage /a:[[imp]] /tsn:sql-adatum-prod.database.windows.net /tdn:HrDb /[[f2]]:HrDb.bacpac /ua:True /tid:"adatum.onmicrosoft.com"
      slots:
        - id: exp
          options:
            - { id: e_extract, text: Extract }
            - { id: e_export, text: Export }
            - { id: e_script, text: Script }
        - id: f1
          options:
            - { id: f1_sf, text: sf }
            - { id: f1_tf, text: tf }
            - { id: f1_op, text: op }
        - id: imp
          options:
            - { id: i_publish, text: Publish }
            - { id: i_deployreport, text: DeployReport }
            - { id: i_import, text: Import }
        - id: f2
          options:
            - { id: f2_sf, text: sf }
            - { id: f2_tf, text: tf }
            - { id: f2_op, text: op }
    answer:
      values: { exp: e_export, f1: f1_tf, imp: i_import, f2: f2_sf }
    explanation:
      correct:
        en: |
          A BACPAC holds the schema and the data: the Export action writes it to the target file named by `/tf` (TargetFile), and the Import action reads it from the source file named by `/sf` (SourceFile) to create the new database. Running SqlPackage from the workstation avoids the Import/Export service, which can't use storage behind a firewall or Microsoft Entra accounts that require MFA, and `/ua:True` gives interactive Microsoft Entra authentication with MFA.
        fr: |
          Un BACPAC contient le schéma et les données : l'action Export l'écrit dans le fichier cible indiqué par `/tf` (TargetFile), et l'action Import le lit depuis le fichier source indiqué par `/sf` (SourceFile) pour créer la nouvelle base. Exécuter SqlPackage depuis le poste évite le service Import/Export, qui ne peut utiliser ni un stockage derrière un pare-feu ni des comptes Microsoft Entra qui exigent la MFA, et `/ua:True` fournit l'authentification Microsoft Entra interactive avec MFA.
      options:
        e_extract: { en: "Extract produces a DACPAC, which holds the schema only, not the data.", fr: "Extract produit un DACPAC, qui ne contient que le schéma, pas les données." }
        e_script: { en: "Script generates a Transact-SQL deployment script; it doesn't create a BACPAC.", fr: "Script génère un script de déploiement Transact-SQL ; il ne crée pas de BACPAC." }
        i_publish: { en: "Publish deploys the schema of a DACPAC to a database; Import is the action that loads a BACPAC with its data.", fr: "Publish déploie le schéma d'un DACPAC dans une base ; Import est l'action qui charge un BACPAC avec ses données." }
        i_deployreport: { en: "DeployReport only lists the changes a publish would make; it doesn't change the target.", fr: "DeployReport liste seulement les modifications qu'une publication ferait ; il ne modifie pas la cible." }
        f1_sf: { en: "During an export, the file is the output: it's named by /tf, while /sf names an input file.", fr: "Pendant une exportation, le fichier est la sortie : il est désigné par /tf, alors que /sf désigne un fichier d'entrée." }
        f2_tf: { en: "During an import, the BACPAC is the input, named by /sf; the target is the server and database.", fr: "Pendant une importation, le BACPAC est l'entrée, désignée par /sf ; la cible est le serveur et la base." }
    references:
      - title: SqlPackage Export parameters and properties
        url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-export
      - title: SqlPackage Import parameters and properties
        url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-import

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-13-08
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Tailspin has an on-premises SQL Server 2019 instance named **SQL-OPS** that hosts a 700 GB database named **OrdersDb**. Every table of OrdersDb has a primary key. OrdersDb must move to a single database in Azure SQL Database named OrdersDb, and the application can be unavailable for at most 10 minutes.

        You decide to use transactional replication. No replication is configured on SQL-OPS yet.

        Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Tailspin dispose d'une instance SQL Server 2019 locale nommée **SQL-OPS** qui héberge une base de données de 700 Go nommée **OrdersDb**. Chaque table d'OrdersDb a une clé primaire. OrdersDb doit être déplacée vers une base unique Azure SQL Database nommée OrdersDb, et l'application peut être indisponible au plus 10 minutes.

        Vous décidez d'utiliser la réplication transactionnelle. Aucune réplication n'est encore configurée sur SQL-OPS.

        Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 5
      actions:
        - { id: dist, text: { en: "Configure SQL-OPS as its own distributor.", fr: "Configurer SQL-OPS comme son propre distributeur." } }
        - { id: pub, text: { en: "Create a transactional publication that contains the tables of OrdersDb.", fr: "Créer une publication transactionnelle qui contient les tables d'OrdersDb." } }
        - { id: push, text: { en: "Create a push subscription to the Azure SQL database, initialized from a snapshot.", fr: "Créer un abonnement par envoi de données (push) vers la base Azure SQL, initialisé à partir d'un instantané." } }
        - { id: stop, text: { en: "Stop the application writes, and wait until the last changes are delivered.", fr: "Arrêter les écritures de l'application, puis attendre que les dernières modifications soient remises." } }
        - { id: repoint, text: { en: "Point the application connection strings to the Azure SQL database.", fr: "Rediriger les chaînes de connexion de l'application vers la base Azure SQL." } }
        - { id: azdist, text: { en: "Configure the logical server of Azure SQL Database as the distributor.", fr: "Configurer le serveur logique d'Azure SQL Database comme distributeur." } }
        - { id: pull, text: { en: "Create a pull subscription that runs its agent on the Azure SQL database.", fr: "Créer un abonnement par extraction de données (pull) dont l'agent s'exécute sur la base Azure SQL." } }
    answer:
      sequence: [ dist, pub, push, stop, repoint ]
    explanation:
      correct:
        en: |
          With Azure SQL Database as the target, the on-premises instance is publisher and distributor, so you first configure distribution, then create the publication, then a push subscription that sends the initial snapshot and the ongoing changes. At cutover, you stop writes, let the last changes arrive, and repoint the application.
        fr: |
          Avec Azure SQL Database comme cible, l'instance locale est éditeur et distributeur : vous configurez d'abord la distribution, puis créez la publication, puis un abonnement par envoi de données (push) qui envoie l'instantané initial et les modifications continues. Au basculement, vous arrêtez les écritures, laissez arriver les dernières modifications, puis redirigez l'application.
      options:
        azdist: { en: "Azure SQL Database can't be a publisher or a distributor; it can only be a subscriber.", fr: "Azure SQL Database ne peut être ni éditeur ni distributeur ; il ne peut être qu'abonné." }
        pull: { en: "Azure SQL Database supports push subscriptions only: the Distribution Agent runs on the distributor.", fr: "Azure SQL Database ne prend en charge que les abonnements par envoi de données (push) : l'Agent de distribution s'exécute sur le distributeur." }
    references:
      - title: Azure SQL Database as a subscriber in transactional replication
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/replication-to-sql-database

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-13-09
    objective: "1.3.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware has an Azure SQL managed instance named **mi-proseware** that uses the **SQL Server 2025** update policy. mi-proseware hosts a 60 GB database named **VendorDb**.

        The vendor of the application that uses VendorDb supports only SQL Server 2022. VendorDb must move to SQL Server 2022 on an Azure virtual machine during a weekend when the application is stopped. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Proseware dispose d'une instance managée Azure SQL nommée **mi-proseware** qui utilise la stratégie de mise à jour **SQL Server 2025**. mi-proseware héberge une base de données de 60 Go nommée **VendorDb**.

        L'éditeur de l'application qui utilise VendorDb ne prend en charge que SQL Server 2022. VendorDb doit être déplacée vers SQL Server 2022 sur une machine virtuelle Azure, pendant un week-end où l'application est arrêtée. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Take a COPY_ONLY backup of VendorDb to URL, and then restore it on the virtual machine.", fr: "Effectuer une sauvegarde COPY_ONLY de VendorDb vers une URL, puis la restaurer sur la machine virtuelle." } }
        - { id: b, text: { en: "Change the update policy of mi-proseware to SQL Server 2022, and then back up and restore VendorDb.", fr: "Passer la stratégie de mise à jour de mi-proseware à SQL Server 2022, puis sauvegarder et restaurer VendorDb." } }
        - { id: c, text: { en: "Export VendorDb to a BACPAC file with SqlPackage, and then import the file on the virtual machine.", fr: "Exporter VendorDb dans un fichier BACPAC avec SqlPackage, puis importer le fichier sur la machine virtuelle." } }
        - { id: d, text: { en: "Copy VendorDb with a database copy operation from mi-proseware to the virtual machine.", fr: "Copier VendorDb avec une opération de copie de base de données de mi-proseware vers la machine virtuelle." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A copy-only backup of a managed instance can be restored only on a SQL Server version that its update policy allows: databases restored to SQL Server 2022 must come from an instance with the SQL Server 2022 policy. A BACPAC is a logical export of the schema and data that SqlPackage can import into SQL Server 2022, and the weekend window allows an offline method.
        fr: |
          Une sauvegarde de copie seule d'une instance managée ne peut être restaurée que sur une version de SQL Server que sa stratégie de mise à jour autorise : les bases restaurées sur SQL Server 2022 doivent provenir d'une instance dotée de la stratégie SQL Server 2022. Un BACPAC est une exportation logique du schéma et des données que SqlPackage peut importer dans SQL Server 2022, et la fenêtre du week-end autorise une méthode hors connexion.
      options:
        a: { en: "The backup comes from an instance with the SQL Server 2025 update policy, so SQL Server 2022 can't restore it.", fr: "La sauvegarde provient d'une instance dotée de la stratégie de mise à jour SQL Server 2025 : SQL Server 2022 ne peut donc pas la restaurer." }
        b: { en: "Changing the update policy upgrades the internal database format permanently, so an instance can't go back to an older policy.", fr: "Changer la stratégie de mise à jour met à niveau le format interne des bases de façon permanente : une instance ne peut donc pas revenir à une stratégie plus ancienne." }
        d: { en: "Database copy and move work only between two managed instances in the same region, not to a virtual machine.", fr: "La copie et le déplacement de base ne fonctionnent qu'entre deux instances managées de la même région, pas vers une machine virtuelle." }
    references:
      - title: Restore a database to SQL Server from Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/restore-database-to-sql-server
      - title: Update policy in Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/update-policy

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-13-10
    objective: "1.3.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind has two Azure SQL managed instances in the North Europe region:

        | Instance | Subscription | Update policy | TDE protector |
        | --- | --- | --- | --- |
        | mi-nw-core | Sub-Prod | SQL Server 2022 | Customer-managed key in the key vault kv-nw-core |
        | mi-nw-apps | Sub-Apps | Always-up-to-date | Service-managed key |

        Both subscriptions belong to the same Microsoft Entra tenant. The virtual networks are peered, and both subnets allow TCP port 5022 and TCP ports 11000-11999 in both directions. mi-nw-core hosts a 1.2 TB database named **ClaimsDb** that is in a failover group with an instance in West Europe.

        A move of ClaimsDb from mi-nw-core to mi-nw-apps fails to start.

        Which two issues cause the failure?

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose de deux instances managées Azure SQL dans la région Europe Nord :

        | Instance | Abonnement | Stratégie de mise à jour | Protecteur TDE |
        | --- | --- | --- | --- |
        | mi-nw-core | Sub-Prod | SQL Server 2022 | Clé gérée par le client dans le coffre de clés kv-nw-core |
        | mi-nw-apps | Sub-Apps | Always-up-to-date | Clé managée par le service |

        Les deux abonnements appartiennent au même locataire Microsoft Entra. Les réseaux virtuels sont connectés par peering, et les deux sous-réseaux autorisent le port TCP 5022 et les ports TCP 11000-11999 dans les deux sens. mi-nw-core héberge une base de données de 1,2 To nommée **ClaimsDb** qui fait partie d'un groupe de basculement avec une instance en Europe Ouest.

        Un déplacement de ClaimsDb de mi-nw-core vers mi-nw-apps ne démarre pas.

        Quels sont les deux problèmes à l'origine de l'échec ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "ClaimsDb is part of a failover group.", fr: "ClaimsDb fait partie d'un groupe de basculement." } }
        - { id: b, text: { en: "The two instances are in different subscriptions.", fr: "Les deux instances sont dans des abonnements différents." } }
        - { id: c, text: { en: "mi-nw-core is already running three other copy operations.", fr: "mi-nw-core exécute déjà trois autres opérations de copie." } }
        - { id: d, text: { en: "mi-nw-apps has no access to the TDE key of ClaimsDb in kv-nw-core.", fr: "mi-nw-apps n'a pas accès à la clé TDE de ClaimsDb dans kv-nw-core." } }
        - { id: e, text: { en: "mi-nw-apps uses a newer update policy than mi-nw-core.", fr: "mi-nw-apps utilise une stratégie de mise à jour plus récente que mi-nw-core." } }
        - { id: f, text: { en: "ClaimsDb is larger than 1 TB.", fr: "ClaimsDb dépasse 1 To." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          A database that belongs to a failover group (or to a Managed Instance link) can't be copied or moved. When the source protects the database with a customer-managed TDE protector, the destination instance must have access to the same Key Vault key; mi-nw-apps uses a service-managed key and has no access to kv-nw-core.
        fr: |
          Une base de données qui fait partie d'un groupe de basculement (ou d'un lien Managed Instance) ne peut être ni copiée ni déplacée. Quand la source protège la base avec un protecteur TDE géré par le client, l'instance de destination doit avoir accès à la même clé Key Vault ; mi-nw-apps utilise une clé managée par le service et n'a pas accès à kv-nw-core.
      options:
        b: { en: "Different subscriptions are allowed when they belong to the same Microsoft Entra tenant.", fr: "Des abonnements différents sont permis quand ils appartiennent au même locataire Microsoft Entra." }
        c: { en: "A source instance runs up to eight operations at a time, and the service queues any extra ones instead of failing them.", fr: "Une instance source exécute jusqu'à huit opérations à la fois, et le service met en file d'attente les opérations supplémentaires au lieu de les faire échouer." }
        e: { en: "The destination needs a matching or newer update policy: Always-up-to-date is newer than SQL Server 2022, so it's valid.", fr: "La destination exige une stratégie de mise à jour identique ou plus récente : Always-up-to-date est plus récente que SQL Server 2022, elle est donc valide." }
        f: { en: "The size only affects how long the seeding takes; it doesn't prevent the operation from starting.", fr: "La taille n'influe que sur la durée de l'amorçage ; elle n'empêche pas l'opération de démarrer." }
    references:
      - title: Copy or move a database - Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/database-copy-move-how-to
