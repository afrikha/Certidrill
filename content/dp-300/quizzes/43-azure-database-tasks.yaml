chapter: 43-azure-database-tasks
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-43-01
    objective: "4.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You created an elastic job agent named **agent1** whose job database is named **JobsDb** on a logical server named **srv-ops**. The jobs of agent1 will run against 30 databases on a logical server named **srv-apps**.

        In which database should you run `jobs.sp_add_job` to create a job for agent1?
      fr: |
        Vous avez créé un agent de travail élastique nommé **agent1** dont la base de données de travail se nomme **JobsDb**, sur un serveur logique nommé **srv-ops**. Les travaux d'agent1 s'exécuteront sur 30 bases de données d'un serveur logique nommé **srv-apps**.

        Dans quelle base de données devez-vous exécuter `jobs.sp_add_job` pour créer un travail pour agent1 ?
    body:
      options:
        - { id: a, text: { en: "The master database of srv-apps", fr: "La base de données master de srv-apps" } }
        - { id: b, text: { en: "Each of the 30 target databases", fr: "Chacune des 30 bases de données cibles" } }
        - { id: c, text: { en: "The master database of srv-ops", fr: "La base de données master de srv-ops" } }
        - { id: d, text: JobsDb }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The job database stores the definitions, the state and the history of the jobs of its agent. Target groups, jobs, steps and schedules are created by running the `jobs` stored procedures in that database.
        fr: |
          La base de données de travail stocke les définitions, l'état et l'historique des travaux de son agent. Les groupes cibles, les travaux, les étapes et les planifications se créent en exécutant les procédures stockées du schéma `jobs` dans cette base.
      options:
        a: { en: "master of a target server is used to enumerate its databases, not to store job definitions.", fr: "master d'un serveur cible sert à énumérer ses bases, pas à stocker les définitions de travaux." }
        b: { en: "Target databases receive the T-SQL of the job steps; they don't hold the job definitions.", fr: "Les bases cibles reçoivent le T-SQL des étapes de travail ; elles ne contiennent pas les définitions de travaux." }
        c: { en: "The `jobs` schema and its procedures are in the job database, not in master of its server.", fr: "Le schéma `jobs` et ses procédures se trouvent dans la base de travail, pas dans master de son serveur." }
    references:
      - title: Create and manage elastic jobs by using T-SQL
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-tsql-create-manage

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-43-02
    objective: "4.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Proseware stores the data of a sales application in a SQL database in Microsoft Fabric. A stored procedure must run in the database every night at 01:00. The solution must stay inside the Fabric workspace and minimize development effort.

        What should you use?
      fr: |
        Proseware stocke les données d'une application commerciale dans une base de données SQL dans Microsoft Fabric. Une procédure stockée doit s'exécuter dans la base chaque nuit à 01:00. La solution doit rester dans l'espace de travail Fabric et réduire au minimum l'effort de développement.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "An elastic job agent and a target group", fr: "Un agent de travail élastique et un groupe cible" } }
        - { id: b, text: { en: "A scheduled Data Factory pipeline", fr: "Un pipeline Data Factory planifié" } }
        - { id: c, text: { en: "A SQL Server Agent job and a schedule", fr: "Un travail SQL Server Agent et une planification" } }
        - { id: d, text: { en: "A maintenance window of the database", fr: "Une fenêtre de maintenance de la base" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          SQL database in Microsoft Fabric has neither SQL Server Agent nor elastic jobs. Microsoft recommends scheduled Data Factory pipelines (or Apache Airflow jobs) in Fabric to run recurring tasks, such as a stored procedure activity.
        fr: |
          Une base de données SQL dans Microsoft Fabric ne dispose ni de SQL Server Agent ni des travaux élastiques. Microsoft recommande des pipelines Data Factory planifiés (ou des travaux Apache Airflow) dans Fabric pour exécuter des tâches récurrentes, comme une activité de procédure stockée.
      options:
        a: { en: "Elastic jobs target Azure SQL Database; they aren't supported for SQL database in Fabric.", fr: "Les travaux élastiques ciblent Azure SQL Database ; ils ne sont pas pris en charge pour une base de données SQL dans Fabric." }
        c: { en: "SQL Server Agent isn't available in SQL database in Fabric.", fr: "SQL Server Agent n'est pas disponible dans une base de données SQL dans Fabric." }
        d: { en: "A maintenance window schedules platform updates; it doesn't run your code.", fr: "Une fenêtre de maintenance planifie les mises à jour de la plateforme ; elle n'exécute pas votre code." }
    references:
      - title: Limitations in SQL database in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/database/sql/limitations

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-43-03
    objective: "4.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An elastic job agent named **agent1** uses the JA100 service tier. You start a job whose only step targets a target group that resolves to 130 databases. Each database runs the step for about 10 minutes.

        What happens when the job starts?
      fr: |
        Un agent de travail élastique nommé **agent1** utilise le niveau de service JA100. Vous démarrez un travail dont l'unique étape cible un groupe cible qui se résout en 130 bases de données. Sur chaque base, l'étape dure environ 10 minutes.

        Que se passe-t-il au démarrage du travail ?
    body:
      options:
        - { id: a, text: { en: "The step fails on 30 databases with a connection limit error.", fr: "L'étape échoue sur 30 bases avec une erreur de limite de connexions." } }
        - { id: b, text: { en: "agent1 switches to the JA200 tier for the duration of the job.", fr: "agent1 passe au niveau JA200 pendant la durée du travail." } }
        - { id: c, text: { en: "The step starts on 100 databases; 30 wait for a connection to free up.", fr: "L'étape démarre sur 100 bases ; 30 attendent qu'une connexion se libère." } }
        - { id: d, text: { en: "The step is skipped on 30 databases until the next execution.", fr: "L'étape est ignorée sur 30 bases jusqu'à l'exécution suivante." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The JA100 tier allows 100 concurrent target connections. When a job has more targets, the extra targets wait to start until other targets finish; the job doesn't fail. To run more targets at the same time, raise the agent tier.
        fr: |
          Le niveau JA100 autorise 100 connexions simultanées aux cibles. Quand un travail a davantage de cibles, les cibles en surnombre attendent pour démarrer que d'autres se terminent ; le travail n'échoue pas. Pour exécuter plus de cibles en même temps, augmentez le niveau de l'agent.
      options:
        a: { en: "Targets above the tier capacity are queued, not failed.", fr: "Les cibles au-delà de la capacité du niveau sont mises en file d'attente, pas en échec." }
        b: { en: "The tier changes only when you change it in the portal, with PowerShell or with the REST API.", fr: "Le niveau ne change que si vous le modifiez dans le portail, avec PowerShell ou avec l'API REST." }
        d: { en: "Skipped means another execution of the same step was still running on that target, which isn't the case here.", fr: "Skipped signifie qu'une autre exécution de la même étape était encore en cours sur cette cible, ce qui n'est pas le cas ici." }
    references:
      - title: Elastic jobs in Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-43-04
    objective: "4.3.1"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        An elastic job agent named **agent2** must authenticate to its targets by using database-scoped credentials. Its job database, **JobsDb**, already has a database master key. A target group named **TG1** contains three `SqlDatabase` members on a logical server named **srv1**: **DB1**, **DB2** and **DB3**. The job steps will pass `@credential_name = N'job_cred'`.

        You need agent2 to connect to DB1, DB2 and DB3.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un agent de travail élastique nommé **agent2** doit s'authentifier auprès de ses cibles à l'aide d'informations d'identification délimitées à la base de données. Sa base de données de travail, **JobsDb**, possède déjà une clé principale de base de données. Un groupe cible nommé **TG1** contient trois membres `SqlDatabase` sur un serveur logique nommé **srv1** : **DB1**, **DB2** et **DB3**. Les étapes de travail passeront `@credential_name = N'job_cred'`.

        Vous devez permettre à agent2 de se connecter à DB1, DB2 et DB3.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "In JobsDb, create a database scoped credential named job_cred whose identity is job_cred and whose secret is its password.", fr: "Dans JobsDb, créer des informations d'identification délimitées à la base de données nommées job_cred, dont l'identité est job_cred et le secret son mot de passe." } }
        - { id: b, text: { en: "In master of srv1, create a database scoped credential named job_cred with the same password.", fr: "Dans master de srv1, créer des informations d'identification délimitées à la base de données nommées job_cred avec le même mot de passe." } }
        - { id: c, text: { en: "In DB1, DB2 and DB3, create a user for job_cred FROM EXTERNAL PROVIDER and grant it the permissions.", fr: "Dans DB1, DB2 et DB3, créer un utilisateur pour job_cred FROM EXTERNAL PROVIDER et lui accorder les autorisations." } }
        - { id: d, text: { en: "In master of srv1, create a login named job_cred with the same password, and a user for it in DB1, DB2 and DB3.", fr: "Dans master de srv1, créer une connexion nommée job_cred avec le même mot de passe, et un utilisateur pour celle-ci dans DB1, DB2 et DB3." } }
        - { id: e, text: { en: "Assign a user-assigned managed identity to agent2 so that it can read the password of job_cred.", fr: "Affecter une identité managée affectée par l'utilisateur à agent2 pour qu'il puisse lire le mot de passe de job_cred." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          With credential-based authentication, the credential is created in the job database, and each target needs a login and user with the same name and the same password as the credential. The job steps then reference the credential with `@credential_name`.
        fr: |
          Avec l'authentification par informations d'identification, celles-ci sont créées dans la base de données de travail, et chaque cible a besoin d'une connexion et d'un utilisateur portant le même nom et le même mot de passe que les informations d'identification. Les étapes de travail les référencent ensuite avec `@credential_name`.
      options:
        b: { en: "The agent reads credentials from the job database only; targets need a matching login and user, not a credential.", fr: "L'agent lit les informations d'identification uniquement dans la base de travail ; les cibles ont besoin d'une connexion et d'un utilisateur correspondants, pas d'informations d'identification." }
        c: { en: "A user FROM EXTERNAL PROVIDER is for Microsoft Entra authentication, not for a SQL credential with a password.", fr: "Un utilisateur FROM EXTERNAL PROVIDER sert à l'authentification Microsoft Entra, pas à des informations d'identification SQL avec mot de passe." }
        e: { en: "An agent uses one authentication method for all its targets; a managed identity isn't added to credential-based authentication.", fr: "Un agent utilise une seule méthode d'authentification pour toutes ses cibles ; une identité managée ne s'ajoute pas à l'authentification par informations d'identification." }
    references:
      - title: Create and manage elastic jobs by using T-SQL
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-tsql-create-manage
      - title: Elastic jobs in Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-43-05
    objective: "4.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An elastic job named **PiiExport** copies personal data from tenant databases. The job database of the agent is named **JobsDb**. A compliance rule requires that the execution history of PiiExport never contain entries older than seven days. The other jobs of the agent must keep their history.

        What should you run every day in JobsDb?
      fr: |
        Un travail élastique nommé **PiiExport** copie des données personnelles depuis des bases de données de locataires. La base de données de travail de l'agent se nomme **JobsDb**. Une règle de conformité exige que l'historique d'exécution de PiiExport ne contienne jamais d'entrées de plus de sept jours. Les autres travaux de l'agent doivent conserver leur historique.

        Que devez-vous exécuter chaque jour dans JobsDb ?
    body:
      options:
        - { id: a, text: "EXEC jobs.sp_purge_jobhistory @job_name = N'PiiExport', @oldest_date = @cutoff;" }
        - { id: b, text: "DELETE FROM jobs.job_executions WHERE job_name = N'PiiExport' AND start_time < @cutoff;" }
        - { id: c, text: "EXEC msdb.dbo.sp_purge_jobhistory @job_name = N'PiiExport', @oldest_date = @cutoff;" }
        - { id: d, text: "EXEC jobs.sp_delete_job @job_name = N'PiiExport', @force = 1;" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          `jobs.sp_purge_jobhistory` removes the history of one job up to the date that you give, with `@cutoff` set to seven days ago. The automatic cleanup only removes history older than 45 days, so the rule needs this explicit purge.
        fr: |
          `jobs.sp_purge_jobhistory` supprime l'historique d'un travail jusqu'à la date indiquée, avec `@cutoff` fixé à sept jours en arrière. Le nettoyage automatique ne supprime que l'historique de plus de 45 jours : la règle exige donc cette purge explicite.
      options:
        b: { en: "Objects of the job database must not be modified directly; the history is managed through the `jobs` procedures.", fr: "Les objets de la base de travail ne doivent pas être modifiés directement ; l'historique se gère avec les procédures du schéma `jobs`." }
        c: { en: "`msdb.dbo.sp_purge_jobhistory` purges SQL Server Agent history; elastic job history is in JobsDb.", fr: "`msdb.dbo.sp_purge_jobhistory` purge l'historique de SQL Server Agent ; l'historique des travaux élastiques se trouve dans JobsDb." }
        d: { en: "Deleting the job removes PiiExport itself, which must keep running.", fr: "Supprimer le travail supprime PiiExport lui-même, qui doit continuer à s'exécuter." }
    references:
      - title: Elastic jobs in Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
      - title: Create and manage elastic jobs by using T-SQL
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-tsql-create-manage

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-43-06
    objective: "4.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure Automation account named **aa-ops** in a subscription named **Sub1**. The system-assigned managed identity of aa-ops has the Reader role on Sub1, for inventory runbooks, and the SQL DB Contributor role on a logical server named **srv-sales** in a resource group named **rg-sales** of a subscription named **Sub2**.

        A new runbook contains the following code:

        ```powershell
        Connect-AzAccount -Identity
        Set-AzSqlDatabase -ResourceGroupName "rg-sales" -ServerName "srv-sales" `
          -DatabaseName "SalesDb" -RequestedServiceObjectiveName "S3"
        ```

        The job of the runbook ends with an error stating that the resource group rg-sales could not be found. The Az.Sql module is available in aa-ops.

        You need the runbook to scale SalesDb. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Contoso dispose d'un compte Azure Automation nommé **aa-ops** dans un abonnement nommé **Sub1**. L'identité managée affectée par le système d'aa-ops a le rôle Reader sur Sub1, pour des runbooks d'inventaire, et le rôle SQL DB Contributor sur un serveur logique nommé **srv-sales** dans un groupe de ressources nommé **rg-sales** d'un abonnement nommé **Sub2**.

        Un nouveau runbook contient le code suivant :

        ```powershell
        Connect-AzAccount -Identity
        Set-AzSqlDatabase -ResourceGroupName "rg-sales" -ServerName "srv-sales" `
          -DatabaseName "SalesDb" -RequestedServiceObjectiveName "S3"
        ```

        Le travail du runbook se termine par une erreur indiquant que le groupe de ressources rg-sales est introuvable. Le module Az.Sql est disponible dans aa-ops.

        Vous devez faire en sorte que le runbook mette SalesDb à l'échelle. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the identity of aa-ops the SQL DB Contributor role on Sub1.", fr: "Attribuer à l'identité d'aa-ops le rôle SQL DB Contributor sur Sub1." } }
        - { id: b, text: { en: "After Connect-AzAccount, add Set-AzContext with the Subscription parameter set to Sub2.", fr: "Après Connect-AzAccount, ajouter Set-AzContext avec le paramètre Subscription défini sur Sub2." } }
        - { id: c, text: { en: "Assign the identity of aa-ops the Contributor role on the rg-sales resource group.", fr: "Attribuer à l'identité d'aa-ops le rôle Contributor sur le groupe de ressources rg-sales." } }
        - { id: d, text: { en: "Replace the system-assigned identity with a user-assigned identity created in Sub2.", fr: "Remplacer l'identité affectée par le système par une identité affectée par l'utilisateur créée dans Sub2." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `Connect-AzAccount -Identity` signs in and selects a default subscription context; the cmdlets that follow look for rg-sales in that subscription. Because the identity can access Sub1 and Sub2 and the error shows that the context isn't Sub2, setting the context to Sub2 lets the existing role on srv-sales apply.
        fr: |
          `Connect-AzAccount -Identity` se connecte et sélectionne un contexte d'abonnement par défaut ; les cmdlets suivantes cherchent rg-sales dans cet abonnement. Comme l'identité a accès à Sub1 et à Sub2 et que l'erreur montre que le contexte n'est pas Sub2, définir le contexte sur Sub2 permet au rôle existant sur srv-sales de s'appliquer.
      options:
        a: { en: "rg-sales doesn't exist in Sub1, so a role there doesn't help, and it grants more than needed.", fr: "rg-sales n'existe pas dans Sub1 : un rôle à cet endroit n'aide pas, et il accorde plus que nécessaire." }
        c: { en: "The identity already has enough rights on srv-sales; the request is sent to the wrong subscription, and Contributor breaks least privilege.", fr: "L'identité a déjà assez de droits sur srv-sales ; la requête est envoyée au mauvais abonnement, et Contributor enfreint le moindre privilège." }
        d: { en: "The subscription where an identity is created doesn't set the context of the runbook; the context would still have to be set.", fr: "L'abonnement où une identité est créée ne définit pas le contexte du runbook ; il faudrait toujours définir le contexte." }
    references:
      - title: Using a system-assigned managed identity for an Azure Automation account
        url: https://learn.microsoft.com/en-us/azure/automation/enable-managed-identity-for-automation

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-43-07
    objective: "4.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has the following databases:

        - 60 databases of Azure SQL Database on two logical servers named **srv-eu** and **srv-us**. Some of them are in elastic pools, and new databases are added every month.
        - Eight user databases on an Azure SQL managed instance named **MI1**.

        Every Sunday, a stored procedure named **dbo.usp_Purge**, present in every database, must run in each of these databases, including the databases added later. The solution must minimize development and administrative effort.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose des bases de données suivantes :

        - 60 bases de données Azure SQL Database sur deux serveurs logiques nommés **srv-eu** et **srv-us**. Certaines se trouvent dans des pools élastiques, et de nouvelles bases sont ajoutées chaque mois.
        - Huit bases de données utilisateur sur une instance managée Azure SQL nommée **MI1**.

        Chaque dimanche, une procédure stockée nommée **dbo.usp_Purge**, présente dans chaque base, doit s'exécuter dans chacune de ces bases, y compris les bases ajoutées ultérieurement. La solution doit réduire au minimum l'effort de développement et d'administration.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create an elastic job whose target group contains srv-eu and srv-us as SqlServer members.", fr: "Créer un travail élastique dont le groupe cible contient srv-eu et srv-us comme membres SqlServer." } }
        - { id: b, text: { en: "Add MI1 to the target group of the elastic job as a SqlServer member.", fr: "Ajouter MI1 au groupe cible du travail élastique comme membre SqlServer." } }
        - { id: c, text: { en: "Create a SQL Server Agent job on MI1 whose step runs dbo.usp_Purge in each user database of MI1.", fr: "Créer un travail SQL Server Agent sur MI1 dont l'étape exécute dbo.usp_Purge dans chaque base utilisateur de MI1." } }
        - { id: d, text: { en: "Make MI1 a master server and enlist srv-eu and srv-us as target servers.", fr: "Faire de MI1 un serveur maître et inscrire srv-eu et srv-us comme serveurs cibles." } }
        - { id: e, text: { en: "Create a SQL Server Agent job in one database of srv-eu that targets every database of both servers.", fr: "Créer un travail SQL Server Agent dans une base de srv-eu qui cible chaque base des deux serveurs." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Elastic jobs run T-SQL against databases of Azure SQL Database, and server members are enumerated at each run, so new databases, pooled or not, are included. Elastic jobs don't target SQL Managed Instance, where SQL Server Agent is always available to run the same procedure in each user database of the instance.
        fr: |
          Les travaux élastiques exécutent du T-SQL sur des bases Azure SQL Database, et les membres serveur sont énumérés à chaque exécution : les nouvelles bases, en pool ou non, sont incluses. Les travaux élastiques ne ciblent pas SQL Managed Instance, où SQL Server Agent est toujours disponible pour exécuter la même procédure dans chaque base utilisateur de l'instance.
      options:
        b: { en: "Target members are logical servers, elastic pools and databases of Azure SQL Database; a managed instance isn't a supported target.", fr: "Les membres cibles sont des serveurs logiques, des pools élastiques et des bases Azure SQL Database ; une instance managée n'est pas une cible prise en charge." }
        d: { en: "Multiserver administration (MSX/TSX) isn't available on SQL Managed Instance, and logical servers have no SQL Server Agent.", fr: "L'administration multiserveur (MSX/TSX) n'est pas disponible sur SQL Managed Instance, et les serveurs logiques n'ont pas de SQL Server Agent." }
        e: { en: "SQL Server Agent doesn't exist in Azure SQL Database.", fr: "SQL Server Agent n'existe pas dans Azure SQL Database." }
    references:
      - title: Elastic jobs in Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview
      - title: jobs.sp_add_target_group_member (Azure Elastic Jobs) (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-target-group-member-elastic-jobs-transact-sql

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-43-08
    objective: "4.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        An elastic job agent named **agent1** runs maintenance jobs against 200 databases. The database team uses the distribution list **dba-team@contoso.com**, whose members change often.

        You need the team to receive an email whenever a job execution of agent1 fails on a target and whenever a job execution of agent1 stops because it exceeds its step timeout. Each type of event must trigger a notification even when the other type doesn't occur. The solution must minimize administrative effort.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un agent de travail élastique nommé **agent1** exécute des travaux de maintenance sur 200 bases de données. L'équipe de bases de données utilise la liste de distribution **dba-team@contoso.com**, dont les membres changent souvent.

        Vous devez faire en sorte que l'équipe reçoive un e-mail chaque fois qu'une exécution de travail d'agent1 échoue sur une cible et chaque fois qu'une exécution de travail d'agent1 s'arrête parce qu'elle dépasse le délai d'expiration de son étape. Chaque type d'événement doit déclencher une notification même quand l'autre ne se produit pas. La solution doit réduire au minimum l'effort d'administration.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create an action group that sends an email notification to dba-team@contoso.com.", fr: "Créer un groupe d'actions qui envoie une notification par e-mail à dba-team@contoso.com." } }
        - { id: b, text: { en: "Create one metric alert rule on agent1 with two conditions: Elastic Jobs Executions Failed above 0 and Elastic Jobs Executions Timed Out above 0.", fr: "Créer une règle d'alerte de métrique sur agent1 avec deux conditions : Elastic Jobs Executions Failed supérieur à 0 et Elastic Jobs Executions Timed Out supérieur à 0." } }
        - { id: c, text: { en: "Create two metric alert rules on agent1, one on Elastic Jobs Executions Failed and one on Elastic Jobs Executions Timed Out, each above 0.", fr: "Créer deux règles d'alerte de métrique sur agent1, l'une sur Elastic Jobs Executions Failed et l'autre sur Elastic Jobs Executions Timed Out, chacune supérieure à 0." } }
        - { id: d, text: { en: "Configure Database Mail in the job database and create an operator for dba-team@contoso.com.", fr: "Configurer Database Mail dans la base de données de travail et créer un opérateur pour dba-team@contoso.com." } }
        - { id: e, text: { en: "Create an action group that emails each member of the team, and update it when the team changes.", fr: "Créer un groupe d'actions qui envoie un e-mail à chaque membre de l'équipe, et le mettre à jour quand l'équipe change." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The job agent exposes the Elastic Jobs Executions Failed and Elastic Jobs Executions Timed Out metrics. A metric alert rule with several conditions fires only when all of them are true, so two rules are needed for independent notifications; both can use one action group that emails the distribution list, which absorbs team changes.
        fr: |
          L'agent de travail expose les métriques Elastic Jobs Executions Failed et Elastic Jobs Executions Timed Out. Une règle d'alerte de métrique comportant plusieurs conditions ne se déclenche que lorsqu'elles sont toutes vraies : deux règles sont donc nécessaires pour des notifications indépendantes ; les deux peuvent utiliser un même groupe d'actions qui envoie un e-mail à la liste de distribution, laquelle absorbe les changements d'équipe.
      options:
        b: { en: "With two conditions, the rule fires only when failures and timeouts occur together.", fr: "Avec deux conditions, la règle ne se déclenche que lorsque des échecs et des dépassements de délai surviennent ensemble." }
        d: { en: "Azure SQL Database has no SQL Server Agent operators or Database Mail notifications for elastic jobs.", fr: "Azure SQL Database n'a ni opérateurs SQL Server Agent ni notifications Database Mail pour les travaux élastiques." }
        e: { en: "Listing individual members means updating the action group at every team change, which adds administrative effort.", fr: "Lister les membres un par un oblige à mettre à jour le groupe d'actions à chaque changement d'équipe, ce qui ajoute de l'effort d'administration." }
    references:
      - title: Supported metrics - Microsoft.Sql/servers/jobAgents
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-metrics/microsoft-sql-servers-jobagents-metrics
      - title: Choose the right type of alert rule
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-43-09
    objective: "4.3.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        An elastic job agent named **agent1** uses the JA100 service tier. A job named **IndexMaint** has one step whose target group is a logical server named **srv-app** with 40 databases. The schedule of IndexMaint runs it every 30 minutes. The step uses the default retry settings.

        On 39 databases, the step completes in about 5 minutes. On a database named **Big01**, it succeeds but takes about 50 minutes.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un agent de travail élastique nommé **agent1** utilise le niveau de service JA100. Un travail nommé **IndexMaint** comporte une étape dont le groupe cible est un serveur logique nommé **srv-app** contenant 40 bases de données. La planification d'IndexMaint l'exécute toutes les 30 minutes. L'étape utilise les paramètres de nouvelle tentative par défaut.

        Sur 39 bases, l'étape se termine en 5 minutes environ. Sur une base nommée **Big01**, elle réussit mais dure environ 50 minutes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: When an execution starts while the step of the previous execution is still running on Big01, the new step execution on Big01 gets the lifecycle Skipped.
            fr: Quand une exécution démarre alors que l'étape de l'exécution précédente est encore en cours sur Big01, la nouvelle exécution de l'étape sur Big01 obtient le cycle de vie Skipped.
        - id: s2
          text:
            en: Each Skipped execution on Big01 uses one retry attempt of the step, and the execution becomes Failed when the attempts are exhausted.
            fr: Chaque exécution Skipped sur Big01 consomme une nouvelle tentative de l'étape, et l'exécution passe à Failed quand les tentatives sont épuisées.
        - id: s3
          text:
            en: Changing agent1 to the JA200 service tier stops the Skipped executions on Big01.
            fr: Passer agent1 au niveau de service JA200 met fin aux exécutions Skipped sur Big01.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A step execution is Skipped when another execution of the same step is still running on the same target, which happens on Big01 at every other run. The fix is a schedule interval longer than the run time on Big01, or a faster script.
        fr: |
          Une exécution d'étape est Skipped quand une autre exécution de la même étape est encore en cours sur la même cible, ce qui arrive sur Big01 une exécution sur deux. La correction consiste à choisir un intervalle de planification plus long que la durée sur Big01, ou à accélérer le script.
      options:
        s2: { en: "Retries apply to failed attempts; a skipped execution didn't fail and isn't retried, and the running step on Big01 still succeeds.", fr: "Les nouvelles tentatives s'appliquent aux tentatives en échec ; une exécution ignorée n'a pas échoué et n'est pas retentée, et l'étape en cours sur Big01 réussit toujours." }
        s3: { en: "40 targets already fit in the 100 connections of JA100; the skip comes from the overlap on the same target, not from a lack of connections.", fr: "40 cibles tiennent déjà dans les 100 connexions de JA100 ; l'exécution ignorée provient du chevauchement sur la même cible, pas d'un manque de connexions." }
    references:
      - title: jobs.job_executions (Azure Elastic Jobs) (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-catalog-views/jobs-job-executions-elastic-jobs-transact-sql
      - title: jobs.sp_add_jobstep (Azure Elastic Jobs) (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-jobstep-elastic-jobs-transact-sql

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-43-10
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        In the job database of an elastic job agent, you are adding the step of a job named **PurgeAudit**. The step must meet the following requirements:

        - If the step fails on a target, it must be retried at most four times after the first attempt.
        - The first retry must wait 30 seconds, and each later retry must wait twice as long as the previous one.
        - The step must be stopped on a target that runs it for more than 20 minutes.

        How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans la base de données de travail d'un agent de travail élastique, vous ajoutez l'étape d'un travail nommé **PurgeAudit**. L'étape doit satisfaire les exigences suivantes :

        - Si l'étape échoue sur une cible, elle doit faire l'objet d'au plus quatre nouvelles tentatives après la première tentative.
        - La première nouvelle tentative doit attendre 30 secondes, et chaque nouvelle tentative suivante doit attendre deux fois plus longtemps que la précédente.
        - L'étape doit être arrêtée sur une cible qui l'exécute depuis plus de 20 minutes.

        Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        EXEC jobs.sp_add_jobstep @job_name = N'PurgeAudit',
             @command = N'EXEC dbo.usp_PurgeAudit @days = 90;',
             @target_group_name = N'AllTenants',
             @retry_attempts = [[retry]],
             @initial_retry_interval_seconds = [[initial]],
             @maximum_retry_interval_seconds = 600,
             @retry_interval_backoff_multiplier = [[mult]],
             @step_timeout_seconds = [[timeout]];
      slots:
        - id: retry
          options:
            - { id: r4, text: "4" }
            - { id: r5, text: "5" }
            - { id: r10, text: "10" }
        - id: initial
          options:
            - { id: i1, text: "1" }
            - { id: i30, text: "30" }
            - { id: i60, text: "60" }
        - id: mult
          options:
            - { id: m05, text: "0.5" }
            - { id: m1, text: "1.0" }
            - { id: m2, text: "2.0" }
        - id: timeout
          options:
            - { id: t20, text: "20" }
            - { id: t1200, text: "1200" }
            - { id: t43200, text: "43200" }
    answer:
      values: { retry: r4, initial: i30, mult: m2, timeout: t1200 }
    explanation:
      correct:
        en: |
          `@retry_attempts` counts the retries after the initial attempt, so 4 gives five attempts in total. `@initial_retry_interval_seconds = 30` sets the first delay, and a backoff multiplier of 2.0 doubles each following delay (60, 120, 240 seconds, below the 600-second cap). `@step_timeout_seconds` is in seconds: 20 minutes = 1,200.
        fr: |
          `@retry_attempts` compte les nouvelles tentatives après la tentative initiale : 4 donne cinq tentatives au total. `@initial_retry_interval_seconds = 30` fixe le premier délai, et un multiplicateur de 2.0 double chaque délai suivant (60, 120, 240 secondes, sous le plafond de 600 secondes). `@step_timeout_seconds` s'exprime en secondes : 20 minutes = 1 200.
      options:
        r5: { en: "5 would allow five retries, six attempts in total.", fr: "5 autoriserait cinq nouvelles tentatives, soit six tentatives au total." }
        r10: { en: "10 is the default number of retries, more than allowed.", fr: "10 est le nombre de nouvelles tentatives par défaut, plus que ce qui est autorisé." }
        i1: { en: "1 second is the default first delay, not 30 seconds.", fr: "1 seconde est le premier délai par défaut, pas 30 secondes." }
        m1: { en: "A multiplier of 1.0 keeps the same delay between retries.", fr: "Un multiplicateur de 1.0 conserve le même délai entre les nouvelles tentatives." }
        t20: { en: "The timeout is in seconds: 20 would stop the step after 20 seconds.", fr: "Le délai d'expiration est en secondes : 20 arrêterait l'étape au bout de 20 secondes." }
        t43200: { en: "43,200 seconds (12 hours) is the default timeout.", fr: "43 200 secondes (12 heures) est le délai d'expiration par défaut." }
    references:
      - title: jobs.sp_add_jobstep (Azure Elastic Jobs) (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-jobstep-elastic-jobs-transact-sql
