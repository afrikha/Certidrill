chapter: 51-hadr-strategy
questions:
- id: dp300-qz-51-01
  objective: 5.1.1
  difficulty: 1
  status: draft
  type: single
  stem:
    en: |
      The business continuity plan of Northwind contains the following requirement for an Azure SQL database named **OrdersDb**: after an outage, no more than 15 minutes of committed transactions can be lost, and OrdersDb must be available again within two hours.

      Which statement describes this requirement?
    fr: |
      Le plan de continuité d'activité de Northwind contient l'exigence suivante pour une base de données Azure SQL nommée **OrdersDb** : après une panne, au plus 15 minutes de transactions validées peuvent être perdues, et OrdersDb doit être de nouveau disponible en moins de deux heures.

      Quelle affirmation décrit cette exigence ?
  body:
    options:
    - id: a
      text:
        en: The RPO is two hours and the RTO is 15 minutes.
        fr: Le RPO est de deux heures et le RTO de 15 minutes.
    - id: b
      text:
        en: The RPO and the RTO are both 15 minutes.
        fr: Le RPO et le RTO sont tous deux de 15 minutes.
    - id: c
      text:
        en: The RPO is 15 minutes and the RTO is two hours.
        fr: Le RPO est de 15 minutes et le RTO de deux heures.
    - id: d
      text:
        en: The RPO and the RTO are both two hours.
        fr: Le RPO et le RTO sont tous deux de deux heures.
  answer:
    optionId: c
  explanation:
    correct:
      en: |
        The recovery point objective (RPO) is the amount of data loss, expressed as time, that the business tolerates: here 15 minutes of transactions. The recovery time objective (RTO) is the time allowed until the application works again: here two hours. The design then picks the cheapest option whose published RPO and RTO meet both values.
      fr: |
        L'objectif de point de récupération (RPO) est la quantité de données perdues, exprimée en temps, que le métier tolère : ici 15 minutes de transactions. L'objectif de temps de récupération (RTO) est le délai accordé jusqu'au retour à la normale de l'application : ici deux heures. La conception retient ensuite l'option la moins chère dont le RPO et le RTO publiés respectent ces deux valeurs.
    options:
      a:
        en: 'This inverts the two objectives: the data loss (15 minutes) is the RPO and the downtime (two hours) is the RTO.'
        fr: 'Cette réponse inverse les deux objectifs : la perte de données (15 minutes) est le RPO et l''interruption (deux heures) est le RTO.'
      b:
        en: Two hours is the allowed downtime, so the RTO is two hours, not 15 minutes.
        fr: 'Deux heures est l''interruption admise : le RTO est donc de deux heures, pas de 15 minutes.'
      d:
        en: 15 minutes is the allowed data loss, so the RPO is 15 minutes, not two hours.
        fr: '15 minutes est la perte de données admise : le RPO est donc de 15 minutes, pas de deux heures.'
  references:
  - title: Cloud Business Continuity - Disaster Recovery - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/business-continuity-high-availability-disaster-recover-hadr-overview
- id: dp300-qz-51-02
  objective: 5.1.4
  difficulty: 1
  status: draft
  type: single
  stem:
    en: |
      You have an Azure SQL managed instance named **MI1** in a resource group named **rg-hr**. MI1 isn't part of a failover group.

      You need to test how an application behaves when the built-in high availability of MI1 fails over to another replica.

      Which Azure PowerShell cmdlet should you run?
    fr: |
      Vous disposez d'une instance managée Azure SQL nommée **MI1** dans un groupe de ressources nommé **rg-hr**. MI1 ne fait partie d'aucun groupe de basculement.

      Vous devez tester le comportement d'une application quand la haute disponibilité intégrée de MI1 bascule vers un autre réplica.

      Quelle commande Azure PowerShell devez-vous exécuter ?
  body:
    options:
    - id: a
      text: Invoke-AzSqlDatabaseFailover
    - id: b
      text: Switch-AzSqlDatabaseInstanceFailoverGroup
    - id: c
      text: Invoke-AzSqlElasticPoolFailover
    - id: d
      text: Invoke-AzSqlInstanceFailover
  answer:
    optionId: d
  explanation:
    correct:
      en: |
        `Invoke-AzSqlInstanceFailover` triggers a user-initiated failover of a SQL Managed Instance to another replica of its built-in high availability (the `-ReadableSecondary` switch targets the readable secondary of a Business Critical instance instead). It's the way to check that the application's retry logic survives a local failover.
      fr: |
        `Invoke-AzSqlInstanceFailover` déclenche un basculement initié par l'utilisateur d'une instance SQL Managed Instance vers un autre réplica de sa haute disponibilité intégrée (le commutateur `-ReadableSecondary` cible plutôt le secondaire lisible d'une instance Business Critical). C'est la façon de vérifier que la logique de nouvelle tentative de l'application résiste à un basculement local.
    options:
      a:
        en: Invoke-AzSqlDatabaseFailover fails over a database of an Azure SQL Database logical server, not a managed instance.
        fr: Invoke-AzSqlDatabaseFailover fait basculer une base de données d'un serveur logique Azure SQL Database, pas une instance managée.
      b:
        en: Switch-AzSqlDatabaseInstanceFailoverGroup swaps the roles in an instance failover group; MI1 has none, and it tests regional DR, not the built-in HA.
        fr: Switch-AzSqlDatabaseInstanceFailoverGroup inverse les rôles dans un groupe de basculement d'instances ; MI1 n'en a pas, et cela teste la récupération d'urgence régionale, pas la HA intégrée.
      c:
        en: Invoke-AzSqlElasticPoolFailover fails over an elastic pool of Azure SQL Database.
        fr: Invoke-AzSqlElasticPoolFailover fait basculer un pool élastique d'Azure SQL Database.
  references:
  - title: Invoke-AzSqlInstanceFailover (Az.Sql)
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/invoke-azsqlinstancefailover
- id: dp300-qz-51-03
  objective: 5.1.3
  difficulty: 2
  status: draft
  type: single
  shuffle: false
  stem:
    en: |
      You plan to create an Azure SQL Database Hyperscale database named **TelemetryDb** in a region that supports availability zones. TelemetryDb must be zone redundant. Compute costs must be minimized.

      How many high availability replicas should you configure for TelemetryDb?
    fr: |
      Vous prévoyez de créer une base de données Azure SQL Database Hyperscale nommée **TelemetryDb** dans une région qui prend en charge les zones de disponibilité. TelemetryDb doit être redondante interzone. Les coûts de calcul doivent être réduits au minimum.

      Combien de réplicas haute disponibilité devez-vous configurer pour TelemetryDb ?
  body:
    options:
    - id: a
      text: '0'
    - id: b
      text: '1'
    - id: c
      text: '2'
    - id: d
      text: '4'
  answer:
    optionId: b
  explanation:
    correct:
      en: |
        In Hyperscale, the optional high availability replicas are the failover targets of the primary compute replica. A zone-redundant Hyperscale database requires at least one high availability replica, so one replica meets the requirement at the lowest compute cost. Learn adds that zone-redundant Hyperscale also needs zone-redundant or geo-zone-redundant backup storage and can only be chosen when the database is created.
      fr: |
        Dans Hyperscale, les réplicas haute disponibilité facultatifs sont les cibles de basculement du réplica de calcul primaire. Une base Hyperscale redondante interzone exige au moins un réplica haute disponibilité : un seul réplica répond donc à l'exigence au coût de calcul le plus bas. Learn précise qu'une base Hyperscale redondante interzone exige aussi un stockage de sauvegarde redondant interzone ou géoredondant interzone, et que ce choix ne se fait qu'à la création de la base.
    options:
      a:
        en: Without any high availability replica, a Hyperscale database can't be configured as zone redundant.
        fr: Sans aucun réplica haute disponibilité, une base Hyperscale ne peut pas être configurée comme redondante interzone.
      c:
        en: Two replicas also work, but the second one adds compute cost that the requirement doesn't need.
        fr: Deux réplicas fonctionnent aussi, mais le second ajoute un coût de calcul inutile pour cette exigence.
      d:
        en: Four replicas is the maximum, not the minimum needed for zone redundancy, and it multiplies the compute cost.
        fr: Quatre réplicas est le maximum, pas le minimum nécessaire à la redondance interzone, et multiplie le coût de calcul.
  references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
- id: dp300-qz-51-04
  objective: 5.1.2
  difficulty: 2
  status: draft
  type: single
  stem:
    en: |
      Contoso has an availability group named **ag-sales** on an on-premises Windows Server failover cluster named **CL1**. The cluster nodes are members of the on-premises Active Directory domain contoso.com and run SQL Server 2022 Enterprise. The datacenter is connected to an Azure virtual network by a site-to-site VPN.

      You deploy SQL Server 2022 Enterprise on an Azure virtual machine named **VM-DR**. You need to add VM-DR to ag-sales as an asynchronous-commit secondary replica.

      What should you do first?
    fr: |
      Contoso dispose d'un groupe de disponibilité nommé **ag-sales** sur un cluster de basculement Windows Server local nommé **CL1**. Les nœuds du cluster sont membres du domaine Active Directory local contoso.com et exécutent SQL Server 2022 Enterprise. Le centre de données est connecté à un réseau virtuel Azure par un VPN site à site.

      Vous déployez SQL Server 2022 Enterprise sur une machine virtuelle Azure nommée **VM-DR**. Vous devez ajouter VM-DR à ag-sales en tant que réplica secondaire à validation asynchrone.

      Que devez-vous faire en premier ?
  body:
    options:
    - id: a
      text:
        en: Create a failover cluster on VM-DR, and then create a distributed availability group between the two clusters.
        fr: Créer un cluster de basculement sur VM-DR, puis créer un groupe de disponibilité distribué entre les deux clusters.
    - id: b
      text:
        en: Deploy a domain controller for contoso.com in Azure, join VM-DR to the domain, and add it to CL1 as a node.
        fr: Déployer un contrôleur de domaine de contoso.com dans Azure, joindre VM-DR au domaine, puis l'ajouter à CL1 comme nœud.
    - id: c
      text:
        en: Install the Azure Connect pack on the replicas of ag-sales, and then create a Managed Instance link to VM-DR.
        fr: Installer l'Azure Connect pack sur les réplicas de ag-sales, puis créer un lien Managed Instance vers VM-DR.
    - id: d
      text:
        en: Register VM-DR with the SQL IaaS Agent extension, and then set its SQL Server license type to HA/DR.
        fr: Inscrire VM-DR auprès de l'extension SQL IaaS Agent, puis définir son type de licence SQL Server sur HA/DR.
  answer:
    optionId: b
  explanation:
    correct:
      en: |
        A replica of an existing availability group must be a node of the same Windows Server failover cluster. A hybrid cluster spans both networks (a multi-subnet cluster over the VPN) and needs Active Directory in Azure, so you deploy a replica domain controller there, join VM-DR to contoso.com and add it to CL1 before adding the replica.
      fr: |
        Un réplica d'un groupe de disponibilité existant doit être un nœud du même cluster de basculement Windows Server. Un cluster hybride s'étend sur les deux réseaux (cluster multisous-réseau via le VPN) et exige Active Directory dans Azure : vous y déployez donc un contrôleur de domaine réplica, joignez VM-DR à contoso.com et l'ajoutez à CL1 avant d'ajouter le réplica.
    options:
      a:
        en: 'A distributed availability group links two separate availability groups: VM-DR would host a replica of a new availability group, not of ag-sales.'
        fr: 'Un groupe de disponibilité distribué relie deux groupes de disponibilité distincts : VM-DR hébergerait un réplica d''un nouveau groupe de disponibilité, pas de ag-sales.'
      c:
        en: The Managed Instance link replicates to Azure SQL Managed Instance, not to SQL Server on a virtual machine, and SQL Server 2022 doesn't need the Azure Connect pack.
        fr: Le lien Managed Instance réplique vers Azure SQL Managed Instance, pas vers SQL Server sur une machine virtuelle, et SQL Server 2022 n'a pas besoin de l'Azure Connect pack.
      d:
        en: The HA/DR license type removes the license cost of a passive replica, but it doesn't make VM-DR part of the cluster.
        fr: Le type de licence HA/DR supprime le coût de licence d'un réplica passif, mais ne fait pas entrer VM-DR dans le cluster.
  references:
  - title: Business continuity and HADR for SQL Server on Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/business-continuity-high-availability-disaster-recovery-hadr-overview
- id: dp300-qz-51-05
  objective: 5.1.4
  difficulty: 2
  status: draft
  type: single
  stem:
    en: |
      Adatum runs SQL Server 2022 on an Azure virtual machine named **SQLVM1**. SQL Server Agent jobs back up a database named **ErpDb** to Azure Blob Storage. The disaster recovery plan assumes that ErpDb can be restored from these backups within four hours.

      Each quarter, you must prove that the latest backups of ErpDb can be restored, measure the actual restore time, and confirm that the restored database has no consistency errors.

      What should you include in the test procedure?
    fr: |
      Adatum exécute SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM1**. Des travaux SQL Server Agent sauvegardent une base de données nommée **ErpDb** dans le Stockage Blob Azure. Le plan de récupération d'urgence suppose qu'ErpDb peut être restaurée à partir de ces sauvegardes en moins de quatre heures.

      Chaque trimestre, vous devez prouver que les dernières sauvegardes d'ErpDb peuvent être restaurées, mesurer la durée réelle de la restauration et confirmer que la base restaurée ne présente aucune erreur de cohérence.

      Que devez-vous inclure dans la procédure de test ?
  body:
    options:
    - id: a
      text:
        en: Run RESTORE VERIFYONLY WITH CHECKSUM against each backup file of ErpDb, and record the duration.
        fr: Exécuter RESTORE VERIFYONLY WITH CHECKSUM sur chaque fichier de sauvegarde d'ErpDb et noter la durée.
    - id: b
      text:
        en: Run DBCC CHECKDB on the production ErpDb on SQLVM1 before each scheduled full backup.
        fr: Exécuter DBCC CHECKDB sur la base ErpDb de production de SQLVM1 avant chaque sauvegarde complète planifiée.
    - id: c
      text:
        en: Restore the backups of ErpDb on a test virtual machine, and then run DBCC CHECKDB on the restored copy.
        fr: Restaurer les sauvegardes d'ErpDb sur une machine virtuelle de test, puis exécuter DBCC CHECKDB sur la copie restaurée.
    - id: d
      text:
        en: Run RESTORE HEADERONLY on each backup file, and compare the backup start and finish times.
        fr: Exécuter RESTORE HEADERONLY sur chaque fichier de sauvegarde et comparer les heures de début et de fin des sauvegardes.
  answer:
    optionId: c
  explanation:
    correct:
      en: |
        Only a real restore proves that the backup chain can be restored and gives the actual restore time to compare with the four-hour RTO. Running DBCC CHECKDB on the restored copy then checks its consistency without loading the production server.
      fr: |
        Seule une vraie restauration prouve que la chaîne de sauvegardes peut être restaurée et donne la durée réelle de restauration à comparer au RTO de quatre heures. L'exécution de DBCC CHECKDB sur la copie restaurée vérifie ensuite sa cohérence sans charger le serveur de production.
    options:
      a:
        en: RESTORE VERIFYONLY checks that the backup set is complete and readable, but it doesn't restore it, so it gives no restore time, and it doesn't verify the structure of the data.
        fr: 'RESTORE VERIFYONLY vérifie que le jeu de sauvegarde est complet et lisible, mais ne le restaure pas : il ne donne aucune durée de restauration et ne vérifie pas la structure des données.'
      b:
        en: Checking the source database is good practice, but it proves neither that the backups can be restored nor how long a restore takes.
        fr: Vérifier la base source est une bonne pratique, mais cela ne prouve ni que les sauvegardes sont restaurables ni la durée d'une restauration.
      d:
        en: RESTORE HEADERONLY only reads the backup headers; backup duration says nothing about restore duration or consistency.
        fr: RESTORE HEADERONLY lit seulement les en-têtes de sauvegarde ; la durée d'une sauvegarde ne dit rien de la durée de restauration ni de la cohérence.
  references:
  - title: RESTORE Statements - VERIFYONLY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-verifyonly-transact-sql
  - title: Business continuity and HADR for SQL Server on Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/business-continuity-high-availability-disaster-recovery-hadr-overview
- id: dp300-qz-51-06
  objective: 5.1.2
  difficulty: 3
  status: draft
  type: single
  stem:
    en: |
      Fabrikam has an on-premises instance named **SQL5** that runs SQL Server 2016 Enterprise Service Pack 3 on Windows Server 2019. SQL5 hosts a database named **CustomersDb**. The datacenter is connected to Azure by ExpressRoute.

      You need to recommend a disaster recovery solution for CustomersDb that meets the following requirements:

      - The disaster recovery copy must be hosted in a platform as a service (PaaS) offering and must receive changes in near real time.
      - After a disaster, CustomersDb will keep running in Azure. Returning it to the on-premises datacenter isn't required.
      - Administrative effort must be minimized.

      What should you recommend?
    fr: |
      Fabrikam dispose d'une instance locale nommée **SQL5** qui exécute SQL Server 2016 Enterprise Service Pack 3 sur Windows Server 2019. SQL5 héberge une base de données nommée **CustomersDb**. Le centre de données est connecté à Azure par ExpressRoute.

      Vous devez recommander une solution de récupération d'urgence pour CustomersDb qui répond aux exigences suivantes :

      - La copie de récupération d'urgence doit être hébergée dans une offre PaaS (platform as a service) et recevoir les modifications en temps quasi réel.
      - Après un sinistre, CustomersDb continuera à s'exécuter dans Azure. Son retour dans le centre de données local n'est pas exigé.
      - L'effort d'administration doit être réduit au minimum.

      Que devez-vous recommander ?
  body:
    options:
    - id: a
      text:
        en: Upgrade SQL5 to SQL Server 2022, and then create a Managed Instance link to an Azure SQL managed instance.
        fr: Mettre à niveau SQL5 vers SQL Server 2022, puis créer un lien Managed Instance vers une instance managée Azure SQL.
    - id: b
      text:
        en: Create a Managed Instance link from SQL5 to an Azure SQL managed instance without installing any update on SQL5.
        fr: Créer un lien Managed Instance de SQL5 vers une instance managée Azure SQL sans installer aucune mise à jour sur SQL5.
    - id: c
      text:
        en: Configure log shipping from SQL5 to an Azure SQL managed instance, with the secondary database in standby mode.
        fr: Configurer la copie des journaux de transaction de SQL5 vers une instance managée Azure SQL, avec la base secondaire en mode standby.
    - id: d
      text:
        en: Install the Azure Connect pack on SQL5, and then create a Managed Instance link to an Azure SQL managed instance.
        fr: Installer l'Azure Connect pack sur SQL5, puis créer un lien Managed Instance vers une instance managée Azure SQL.
  answer:
    optionId: d
  explanation:
    correct:
      en: |
        The Managed Instance link replicates a SQL Server database to SQL Managed Instance in near real time through a distributed availability group. SQL Server 2016 is supported from SP3 with the Azure Connect pack installed, and with 2016 the link is one way only, which is enough because failback isn't required. Installing the Azure Connect pack is far less effort than a version upgrade.
      fr: |
        Le lien Managed Instance réplique une base SQL Server vers SQL Managed Instance en temps quasi réel au moyen d'un groupe de disponibilité distribué. SQL Server 2016 est pris en charge à partir du SP3 avec l'Azure Connect pack installé ; avec 2016, le lien ne fonctionne que dans un sens, ce qui suffit puisque le retour n'est pas exigé. Installer l'Azure Connect pack demande bien moins d'effort qu'une mise à niveau de version.
    options:
      a:
        en: An upgrade to SQL Server 2022 would be needed only to fail back through the link; it isn't required here and adds a lot of effort.
        fr: Une mise à niveau vers SQL Server 2022 ne serait nécessaire que pour revenir par le lien ; elle n'est pas exigée ici et ajoute beaucoup d'effort.
      b:
        en: 'SP3 alone isn''t enough: SQL Server 2016 and 2017 also need the Azure Connect pack before a link can be created.'
        fr: 'Le SP3 seul ne suffit pas : SQL Server 2016 et 2017 exigent aussi l''Azure Connect pack avant de pouvoir créer un lien.'
      c:
        en: 'SQL Managed Instance can''t be a log shipping secondary: it restores only full backups from URL, without NORECOVERY or STANDBY.'
        fr: 'SQL Managed Instance ne peut pas être secondaire d''une copie des journaux de transaction : elle ne restaure que des sauvegardes complètes depuis une URL, sans NORECOVERY ni STANDBY.'
  references:
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
- id: dp300-qz-51-07
  objective: 5.1.3
  difficulty: 3
  status: draft
  type: dragdrop
  stem:
    en: |
      Litware runs several SQL Server workloads on Azure virtual machines in the East US 2 region, which supports availability zones. Central US is the disaster recovery region of the company.

      The architects ask you which technology fits each requirement below. For every requirement, pick the option that has the lowest cost and the least administrative effort.

      Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

      NOTE: Each correct selection is worth one point.
    fr: |
      Litware exécute plusieurs charges de travail SQL Server sur des machines virtuelles Azure dans la région East US 2, qui prend en charge les zones de disponibilité. Central US est la région de récupération d'urgence de l'entreprise.

      Les architectes vous demandent quelle technologie convient à chaque exigence ci-dessous. Pour chaque exigence, choisissez l'option dont le coût et l'effort d'administration sont les plus faibles.

      Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

      Remarque : chaque sélection correcte vaut un point.
  body:
    reuse: false
    items:
    - id: fci
      text:
        en: A failover cluster instance on Azure shared disks
        fr: Une instance de cluster de basculement sur des disques partagés Azure
    - id: agsync
      text:
        en: An availability group with a synchronous-commit replica in another zone
        fr: Un groupe de disponibilité avec un réplica à validation synchrone dans une autre zone
    - id: agasync
      text:
        en: An availability group with an asynchronous-commit replica in Central US
        fr: Un groupe de disponibilité avec un réplica à validation asynchrone dans Central US
    - id: ls
      text:
        en: Log shipping to a virtual machine in Central US
        fr: La copie des journaux de transaction vers une machine virtuelle dans Central US
    - id: asr
      text:
        en: Azure Site Recovery
        fr: Azure Site Recovery
    - id: pitr
      text:
        en: A restore of the full, differential and log backups with STOPAT
        fr: Une restauration des sauvegardes complète, différentielle et de journaux avec STOPAT
    targets:
    - id: t1
      text:
        en: A SQL Server 2019 instance whose logins, SQL Server Agent jobs and linked servers must move automatically with its databases if its virtual machine fails
        fr: Une instance SQL Server 2019 dont les connexions, les travaux SQL Server Agent et les serveurs liés doivent suivre automatiquement ses bases si sa machine virtuelle tombe en panne
    - id: t2
      text:
        en: An application server VM and its SQL Server VM must be recovered together in Central US by running one recovery plan
        fr: Une machine virtuelle de serveur d'applications et sa machine virtuelle SQL Server doivent être récupérées ensemble dans Central US par l'exécution d'un seul plan de récupération
    - id: t3
      text:
        en: A readable copy in Central US must receive changes continuously, without adding the cross-region round trip to each commit
        fr: Une copie lisible dans Central US doit recevoir les modifications en continu, sans ajouter l'aller-retour interrégion à chaque validation
    - id: t4
      text:
        en: The rows of a table must be recovered as they were before a faulty script ran this morning
        fr: Les lignes d'une table doivent être récupérées telles qu'elles étaient avant l'exécution d'un script défectueux ce matin
  answer:
    mapping:
      t1: fci
      t2: asr
      t3: agasync
      t4: pitr
  explanation:
    correct:
      en: |
        A failover cluster instance protects the whole instance, so instance-level objects such as logins, jobs and linked servers fail over with it. Azure Site Recovery replicates entire VMs and recovers them together through a recovery plan. An asynchronous-commit availability group replica in another region is readable and receives the log continuously without delaying commits. Human error is undone by restoring backups to a point in time, because every replica copies the mistake.
      fr: |
        Une instance de cluster de basculement protège toute l'instance : les objets de niveau instance comme les connexions, les travaux et les serveurs liés basculent avec elle. Azure Site Recovery réplique des machines virtuelles entières et les récupère ensemble au moyen d'un plan de récupération. Un réplica de groupe de disponibilité à validation asynchrone dans une autre région est lisible et reçoit le journal en continu sans retarder les validations. Une erreur humaine se corrige par la restauration de sauvegardes à un point dans le temps, car tout réplica copie l'erreur.
    options:
      agsync:
        en: A synchronous replica in another zone protects the databases inside East US 2, but on SQL Server 2019 an availability group doesn't carry logins, jobs or linked servers, and it isn't in Central US.
        fr: Un réplica synchrone dans une autre zone protège les bases au sein d'East US 2, mais sur SQL Server 2019 un groupe de disponibilité ne transporte ni connexions, ni travaux, ni serveurs liés, et il n'est pas dans Central US.
      ls:
        en: Log shipping applies log backups on a schedule, not continuously, and users of a standby secondary are disconnected at each restore.
        fr: La copie des journaux de transaction applique des sauvegardes de journaux selon une planification, pas en continu, et les utilisateurs d'un secondaire en mode standby sont déconnectés à chaque restauration.
  references:
  - title: Business continuity and HADR for SQL Server on Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/business-continuity-high-availability-disaster-recovery-hadr-overview
  - title: Failover cluster instances - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/failover-cluster-instance-overview
- id: dp300-qz-51-08
  objective: 5.1.1
  difficulty: 3
  status: draft
  type: hotarea
  stem:
    en: |
      Tailspin has the following Azure SQL databases on logical servers in the West Europe region. Each application connects to its database by using the connection string it uses today.

      Answer each prompt by selecting the database in the table.

      NOTE: Each correct selection is worth one point.
    fr: |
      Tailspin dispose des bases de données Azure SQL suivantes sur des serveurs logiques de la région West Europe. Chaque application se connecte à sa base avec la chaîne de connexion qu'elle utilise aujourd'hui.

      Répondez à chaque consigne en sélectionnant la base de données dans le tableau.

      Remarque : chaque sélection correcte vaut un point.
  body:
    prompts:
    - id: p1
      text:
        en: The database that can be recovered in another region after a West Europe outage, but only with an RPO and an RTO of minutes to hours
        fr: La base qui peut être récupérée dans une autre région après une panne de West Europe, mais seulement avec un RPO et un RTO de quelques minutes à plusieurs heures
    - id: p2
      text:
        en: The database that can be back online within about a minute after a West Europe outage, with an RPO close to zero, without any change to the application's connection string
        fr: La base qui peut être de nouveau en ligne en une minute environ après une panne de West Europe, avec un RPO proche de zéro, sans aucune modification de la chaîne de connexion de l'application
    grid:
      header:
      - en: Database
        fr: Base de données
      - en: Service tier
        fr: Niveau de service
      - en: Backup storage redundancy
        fr: Redondance du stockage de sauvegarde
      - en: Disaster recovery configuration
        fr: Configuration de récupération d'urgence
      rows:
      - - text: db-hr
          area: h
        - text: General Purpose
        - text:
            en: Geo-redundant
            fr: Géoredondant
        - text:
            en: None
            fr: Aucune
      - - text: db-crm
          area: c
        - text: General Purpose
        - text:
            en: Locally redundant
            fr: Localement redondant
        - text:
            en: Active geo-replication to a server in North Europe
            fr: Géoréplication active vers un serveur de North Europe
      - - text: db-pay
          area: p
        - text: Business Critical
        - text:
            en: Zone-redundant
            fr: Redondant interzone
        - text:
            en: Failover group with a secondary server in North Europe, customer-managed policy
            fr: Groupe de basculement avec un serveur secondaire dans North Europe, stratégie gérée par le client
      - - text: db-ops
          area: o
        - text: Business Critical
        - text:
            en: Locally redundant
            fr: Localement redondant
        - text:
            en: None
            fr: Aucune
  answer:
    values:
      p1: h
      p2: p
  explanation:
    correct:
      en: |
        db-hr has no replica, but its geo-redundant backups allow a geo-restore in another region, with an RPO and an RTO of minutes to hours. db-pay is in a failover group: a failover takes typically less than 60 seconds with an RPO near zero, and the read-write listener keeps the connection string unchanged.
      fr: |
        db-hr n'a aucun réplica, mais ses sauvegardes géoredondantes permettent une géorestauration dans une autre région, avec un RPO et un RTO de quelques minutes à plusieurs heures. db-pay est dans un groupe de basculement : un basculement prend généralement moins de 60 secondes avec un RPO proche de zéro, et l'écouteur en lecture-écriture conserve la chaîne de connexion.
    options:
      c:
        en: db-crm recovers within a minute through its geo-secondary, but the application must then connect to the other server, and its locally redundant backups rule out geo-restore.
        fr: db-crm se rétablit en une minute grâce à son géosecondaire, mais l'application doit alors se connecter à l'autre serveur, et ses sauvegardes localement redondantes excluent la géorestauration.
      o:
        en: db-ops has no replica and locally redundant backups, so it can't be recovered in another region at all; its built-in HA only protects within West Europe.
        fr: 'db-ops n''a ni réplica ni sauvegardes géoredondantes : elle ne peut pas du tout être récupérée dans une autre région ; sa HA intégrée ne protège qu''au sein de West Europe.'
  references:
  - title: Cloud Business Continuity - Disaster Recovery - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/business-continuity-high-availability-disaster-recover-hadr-overview
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
- id: dp300-qz-51-09
  objective: 5.1.4
  difficulty: 3
  status: draft
  type: ordering
  stem:
    en: |
      Woodgrove has a failover group named **fog-loans** between a primary managed instance named **MI-WEU** in West Europe and a secondary managed instance named **MI-NEU** in North Europe. The failover group uses the customer-managed failover policy. The application connects through the read-write listener of fog-loans by using SQL Server logins, and SQL Server Agent jobs on MI-WEU run the nightly processing.

      You need to run the first disaster recovery drill. Both regions are available. The drill must prove that the application and the nightly processing work from North Europe without losing any transaction, and it must end with MI-WEU as the primary again.

      Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
    fr: |
      Woodgrove dispose d'un groupe de basculement nommé **fog-loans** entre une instance managée primaire nommée **MI-WEU** dans West Europe et une instance managée secondaire nommée **MI-NEU** dans North Europe. Le groupe de basculement utilise la stratégie de basculement gérée par le client. L'application se connecte par l'écouteur en lecture-écriture de fog-loans avec des connexions SQL Server, et des travaux SQL Server Agent sur MI-WEU exécutent le traitement de nuit.

      Vous devez mener le premier exercice de récupération d'urgence. Les deux régions sont disponibles. L'exercice doit prouver que l'application et le traitement de nuit fonctionnent depuis North Europe sans perdre aucune transaction, et doit se terminer avec MI-WEU de nouveau primaire.

      Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans le bon ordre.
  body:
    count: 4
    actions:
    - id: prep
      text:
        en: Create the SQL Server logins with the same SIDs, and the SQL Server Agent jobs, on MI-NEU.
        fr: Créer sur MI-NEU les connexions SQL Server avec les mêmes SID, ainsi que les travaux SQL Server Agent.
    - id: switch
      text:
        en: Run Switch-AzSqlDatabaseInstanceFailoverGroup for fog-loans in the region of MI-NEU, without the AllowDataLoss parameter.
        fr: Exécuter Switch-AzSqlDatabaseInstanceFailoverGroup pour fog-loans dans la région de MI-NEU, sans le paramètre AllowDataLoss.
    - id: validate
      text:
        en: Measure the time until the application works through the read-write listener, and run the nightly jobs.
        fr: Mesurer le temps jusqu'au fonctionnement de l'application par l'écouteur en lecture-écriture, puis exécuter les travaux de nuit.
    - id: back
      text:
        en: Run a planned failover of fog-loans back to West Europe, and record the results in the runbook.
        fr: Exécuter un basculement planifié de fog-loans vers West Europe, puis consigner les résultats dans le runbook.
    - id: force
      text:
        en: Run Switch-AzSqlDatabaseInstanceFailoverGroup for fog-loans in the region of MI-NEU, with the AllowDataLoss parameter.
        fr: Exécuter Switch-AzSqlDatabaseInstanceFailoverGroup pour fog-loans dans la région de MI-NEU, avec le paramètre AllowDataLoss.
    - id: conn
      text:
        en: Change the application connection string to the host name of MI-NEU.
        fr: Remplacer la chaîne de connexion de l'application par le nom d'hôte de MI-NEU.
    - id: local
      text:
        en: Run Invoke-AzSqlInstanceFailover on MI-NEU.
        fr: Exécuter Invoke-AzSqlInstanceFailover sur MI-NEU.
  answer:
    sequence:
    - prep
    - switch
    - validate
    - back
  explanation:
    correct:
      en: |
        A failover group of SQL Managed Instance replicates the user databases only: master and msdb aren't replicated, so the logins (with the same SIDs) and the jobs must exist on MI-NEU first. Switch-AzSqlDatabaseInstanceFailoverGroup without AllowDataLoss is a planned failover that synchronizes fully or rolls back. You then measure the RTO through the listener and validate the jobs, and a planned failover back restores the original roles.
      fr: |
        Un groupe de basculement SQL Managed Instance ne réplique que les bases utilisateur : master et msdb ne sont pas répliquées, les connexions (avec les mêmes SID) et les travaux doivent donc d'abord exister sur MI-NEU. Switch-AzSqlDatabaseInstanceFailoverGroup sans AllowDataLoss est un basculement planifié qui se synchronise entièrement ou est annulé. Vous mesurez ensuite le RTO par l'écouteur et validez les travaux, puis un basculement planifié de retour rétablit les rôles d'origine.
    options:
      force:
        en: 'AllowDataLoss forces the failover without full synchronization: it''s for a primary that''s unavailable, not for a drill that must lose no transaction.'
        fr: 'AllowDataLoss force le basculement sans synchronisation complète : il est réservé à un primaire indisponible, pas à un exercice qui ne doit perdre aucune transaction.'
      conn:
        en: The read-write listener follows the primary after a failover, so the connection string must not change.
        fr: 'L''écouteur en lecture-écriture suit le primaire après un basculement : la chaîne de connexion ne doit pas changer.'
      local:
        en: Invoke-AzSqlInstanceFailover tests the built-in HA inside one region; it doesn't swap the roles of the failover group.
        fr: Invoke-AzSqlInstanceFailover teste la HA intégrée au sein d'une région ; il n'inverse pas les rôles du groupe de basculement.
  references:
  - title: Failover groups overview & best practices - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/failover-group-sql-mi
  - title: Switch-AzSqlDatabaseInstanceFailoverGroup (Az.Sql)
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/switch-azsqldatabaseinstancefailovergroup
- id: dp300-qz-51-10
  objective: 5.1.3
  difficulty: 3
  status: draft
  type: single
  stem:
    en: |
      Proseware has an Azure SQL database named **SalesDb** in the Business Critical service tier (provisioned vCore) on a logical server named **srv-sales-weu** in West Europe. Order processing applications in West Europe read and write SalesDb.

      You need to meet the following requirements:

      - A reporting application that runs in North Europe must run its read-only queries against a copy of SalesDb located in North Europe.
      - If West Europe becomes unavailable, the order processing applications must work against North Europe within one minute of your decision to fail over, without any change to their connection strings.
      - Costs must be minimized.

      What should you do?
    fr: |
      Proseware dispose d'une base de données Azure SQL nommée **SalesDb** au niveau de service Business Critical (vCore provisionné) sur un serveur logique nommé **srv-sales-weu** dans West Europe. Des applications de traitement des commandes situées dans West Europe lisent et écrivent dans SalesDb.

      Vous devez répondre aux exigences suivantes :

      - Une application de reporting qui s'exécute dans North Europe doit exécuter ses requêtes en lecture seule sur une copie de SalesDb située dans North Europe.
      - Si West Europe devient indisponible, les applications de traitement des commandes doivent fonctionner sur North Europe dans la minute qui suit votre décision de basculer, sans aucune modification de leurs chaînes de connexion.
      - Les coûts doivent être réduits au minimum.

      Que devez-vous faire ?
  body:
    options:
    - id: a
      text:
        en: Create a failover group with a secondary server in North Europe, designate the secondary database as a standby replica, and point the reporting application at the read-only listener.
        fr: Créer un groupe de basculement avec un serveur secondaire dans North Europe, désigner la base secondaire comme réplica de secours (standby), et diriger l'application de reporting vers l'écouteur en lecture seule.
    - id: b
      text:
        en: Enable read scale-out on SalesDb for the reporting application, and create a failover group with a secondary server in North Europe.
        fr: Activer le scale-out en lecture sur SalesDb pour l'application de reporting, et créer un groupe de basculement avec un serveur secondaire dans North Europe.
    - id: c
      text:
        en: Configure active geo-replication of SalesDb to a server in North Europe, and point the reporting application at the geo-secondary database.
        fr: Configurer la géoréplication active de SalesDb vers un serveur de North Europe, et diriger l'application de reporting vers la base géosecondaire.
    - id: d
      text:
        en: Create a failover group with a secondary server in North Europe, and point the reporting application at the read-only listener of the group.
        fr: Créer un groupe de basculement avec un serveur secondaire dans North Europe, et diriger l'application de reporting vers l'écouteur en lecture seule du groupe.
  answer:
    optionId: d
  explanation:
    correct:
      en: |
        A failover group gives an RTO of typically less than 60 seconds after a customer-managed failover, and its read-write listener keeps the connection strings unchanged. Its secondary in North Europe is readable through the read-only listener, so the reports run in North Europe. Because the secondary serves a read workload, it must stay a regular readable secondary.
      fr: |
        Un groupe de basculement offre un RTO généralement inférieur à 60 secondes après un basculement géré par le client, et son écouteur en lecture-écriture conserve les chaînes de connexion. Son secondaire de North Europe est lisible par l'écouteur en lecture seule : les rapports s'exécutent donc dans North Europe. Comme le secondaire sert une charge de lecture, il doit rester un secondaire lisible ordinaire.
    options:
      a:
        en: A standby replica is license-free only if it serves no read workload (DMVs, backups and DBCC excepted); the reporting queries break that condition.
        fr: Un réplica de secours (standby) n'est exempt de licence que s'il ne sert aucune charge de lecture (hors DMV, sauvegardes et DBCC) ; les requêtes de reporting enfreignent cette condition.
      b:
        en: Read scale-out uses a built-in HA replica in West Europe, so the reports wouldn't run on a copy in North Europe.
        fr: 'Le scale-out en lecture utilise un réplica HA intégré de West Europe : les rapports ne s''exécuteraient pas sur une copie située dans North Europe.'
      c:
        en: After an active geo-replication failover, the applications must connect to the server of the new primary, so their connection strings change.
        fr: 'Après un basculement de géoréplication active, les applications doivent se connecter au serveur du nouveau primaire : leurs chaînes de connexion changent.'
  references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
  - title: Configure license-free standby replica - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/standby-replica-how-to-configure
