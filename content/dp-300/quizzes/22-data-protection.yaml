chapter: 22-data-protection
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure SQL Database logical server named **sql-contoso**. Every database on the server uses service-managed transparent data encryption (TDE).

        Which database on sql-contoso is never encrypted by TDE?
      fr: |
        Contoso dispose d'un serveur logique Azure SQL Database nommé **sql-contoso**. Toutes les bases de données du serveur utilisent le chiffrement transparent des données (TDE) géré par le service.

        Quelle base de données de sql-contoso n'est jamais chiffrée par TDE ?
    body:
      options:
        - { id: a, text: { en: "The `tempdb` system database", fr: "La base de données système `tempdb`" } }
        - { id: b, text: { en: "The `master` system database", fr: "La base de données système `master`" } }
        - { id: c, text: { en: "A user database created by a database copy", fr: "Une base de données utilisateur créée par une copie de base de données" } }
        - { id: d, text: { en: "A user database restored to a point in time", fr: "Une base de données utilisateur restaurée à un point dans le temps" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          TDE can't encrypt system databases such as `master`, because `master` holds objects that TDE needs to encrypt the user databases. Microsoft recommends not storing sensitive data in system databases for this reason.
        fr: |
          TDE ne peut pas chiffrer les bases de données système comme `master`, car `master` contient des objets dont TDE a besoin pour chiffrer les bases utilisateur. C'est pourquoi Microsoft recommande de ne pas stocker de données sensibles dans les bases de données système.
      options:
        a: { en: "`tempdb` is the exception among system databases: it is always encrypted, with an asymmetric key owned by Microsoft.", fr: "`tempdb` est l'exception parmi les bases système : elle est toujours chiffrée, avec une clé asymétrique détenue par Microsoft." }
        c: { en: "When the source database is encrypted, a database copy is encrypted by default.", fr: "Quand la base source est chiffrée, une copie de base de données est chiffrée par défaut." }
        d: { en: "When the source database is encrypted, a database restored from its backups is encrypted by default.", fr: "Quand la base source est chiffrée, une base restaurée à partir de ses sauvegardes est chiffrée par défaut." }
    references:
      - title: Transparent Data Encryption - Azure SQL Database & Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-tde-overview

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-22-02
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure SQL managed instance named **mi-fabrikam** with its public endpoint enabled. An auditing partner will connect to the public endpoint from the address range 198.51.100.0/28.

        You need to ensure that only this range can reach the public endpoint of mi-fabrikam. What should you configure?
      fr: |
        Fabrikam dispose d'une instance managée Azure SQL nommée **mi-fabrikam** dont le point de terminaison public est activé. Un partenaire chargé de l'audit se connectera au point de terminaison public depuis la plage d'adresses 198.51.100.0/28.

        Vous devez faire en sorte que seule cette plage puisse atteindre le point de terminaison public de mi-fabrikam. Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A server-level IP firewall rule, created with `sp_set_firewall_rule` in `master`", fr: "Une règle de pare-feu IP au niveau du serveur, créée avec `sp_set_firewall_rule` dans `master`" } }
        - { id: b, text: { en: "A database-level IP firewall rule, created with `sp_set_database_firewall_rule`", fr: "Une règle de pare-feu IP au niveau de la base, créée avec `sp_set_database_firewall_rule`" } }
        - { id: c, text: { en: "An inbound rule in the network security group of the subnet of mi-fabrikam", fr: "Une règle de trafic entrant dans le groupe de sécurité réseau du sous-réseau de mi-fabrikam" } }
        - { id: d, text: { en: "A virtual network rule for the partner's subnet, with the `Microsoft.Sql` service endpoint", fr: "Une règle de réseau virtuel pour le sous-réseau du partenaire, avec le point de terminaison de service `Microsoft.Sql`" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A managed instance lives in a subnet of your virtual network and has no IP firewall rules. Access to its public endpoint is limited by the network security group of that subnet, with an inbound rule that allows only the trusted source addresses on the public endpoint port.
        fr: |
          Une instance managée réside dans un sous-réseau de votre réseau virtuel et n'a pas de règles de pare-feu IP. L'accès à son point de terminaison public se limite par le groupe de sécurité réseau de ce sous-réseau, avec une règle de trafic entrant qui n'autorise que les adresses sources approuvées sur le port du point de terminaison public.
      options:
        a: { en: "Server-level IP firewall rules belong to the logical servers of Azure SQL Database; they don't apply to SQL Managed Instance.", fr: "Les règles de pare-feu IP au niveau du serveur appartiennent aux serveurs logiques d'Azure SQL Database ; elles ne s'appliquent pas à SQL Managed Instance." }
        b: { en: "Database-level IP firewall rules are an Azure SQL Database feature too; a managed instance filters traffic at the subnet.", fr: "Les règles de pare-feu IP au niveau de la base sont aussi une fonctionnalité d'Azure SQL Database ; une instance managée filtre le trafic au niveau du sous-réseau." }
        d: { en: "Virtual network rules let subnets reach the public endpoint of a logical server; they don't filter internet addresses for a managed instance.", fr: "Les règles de réseau virtuel permettent à des sous-réseaux d'atteindre le point de terminaison public d'un serveur logique ; elles ne filtrent pas des adresses Internet pour une instance managée." }
    references:
      - title: Secure Azure SQL Managed Instance Public Endpoints - Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/public-endpoint-overview
      - title: IP Firewall Rules - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-22-03
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure SQL database named **Members**. The `NationalID` column of the `dbo.Member` table is encrypted by using Always Encrypted with deterministic encryption and the `Latin1_General_BIN2` collation.

        A .NET application connects with `Column Encryption Setting=Enabled` and can access the column master key. To find a member, the application builds the statement `SELECT * FROM dbo.Member WHERE NationalID = '780-55-1234'` by concatenating strings. The statement fails with error 206, "Operand type clash".

        You need to ensure that the application can find members by national ID. What should you do?
      fr: |
        Litware dispose d'une base de données Azure SQL nommée **Members**. La colonne `NationalID` de la table `dbo.Member` est chiffrée avec Always Encrypted, en chiffrement déterministe, avec le classement `Latin1_General_BIN2`.

        Une application .NET se connecte avec `Column Encryption Setting=Enabled` et peut accéder à la clé principale de colonne. Pour trouver un membre, l'application construit l'instruction `SELECT * FROM dbo.Member WHERE NationalID = '780-55-1234'` en concaténant des chaînes. L'instruction échoue avec l'erreur 206, « Operand type clash ».

        Vous devez faire en sorte que l'application puisse trouver les membres par numéro national. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Pass the national ID to the query as a parameter instead of a literal.", fr: "Transmettre le numéro national à la requête comme paramètre plutôt que comme littéral." } }
        - { id: b, text: { en: "Re-encrypt the NationalID column with randomized encryption.", fr: "Rechiffrer la colonne NationalID avec le chiffrement aléatoire." } }
        - { id: c, text: { en: "Add `Attestation Protocol=None` to the connection string.", fr: "Ajouter `Attestation Protocol=None` à la chaîne de connexion." } }
        - { id: d, text: { en: "Grant `VIEW ANY COLUMN ENCRYPTION KEY DEFINITION` to the application user.", fr: "Accorder `VIEW ANY COLUMN ENCRYPTION KEY DEFINITION` à l'utilisateur de l'application." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The driver can only encrypt values that it receives as query parameters. A literal reaches the database engine in plaintext and is compared with an encrypted column, which causes the operand type clash. With a parameter, the driver encrypts the value with the same deterministic key, and the equality search works.
        fr: |
          Le pilote ne peut chiffrer que les valeurs qu'il reçoit comme paramètres de requête. Un littéral arrive en clair au moteur de base de données et est comparé à une colonne chiffrée, d'où le conflit de type d'opérande. Avec un paramètre, le pilote chiffre la valeur avec la même clé déterministe, et la recherche d'égalité fonctionne.
      options:
        b: { en: "Randomized encryption allows no equality search at all without a secure enclave, and the literal would still fail.", fr: "Le chiffrement aléatoire ne permet aucune recherche d'égalité sans enclave sécurisée, et le littéral échouerait toujours." }
        c: { en: "The attestation protocol only matters for queries that use a secure enclave; it doesn't let the driver encrypt a literal.", fr: "Le protocole d'attestation ne compte que pour les requêtes qui utilisent une enclave sécurisée ; il ne permet pas au pilote de chiffrer un littéral." }
        d: { en: "Missing key metadata permissions cause a different failure; the clash comes from comparing ciphertext with a plaintext literal.", fr: "L'absence d'autorisations sur les métadonnées des clés provoque un autre échec ; le conflit vient de la comparaison d'un texte chiffré avec un littéral en clair." }
    references:
      - title: Always Encrypted - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-22-04
    objective: "2.2.6"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has an Azure SQL Database logical server named **sql-nw**. The public network access of sql-nw is set to **Selected networks**, and a server-level IP firewall rule allows the public addresses of a branch office.

        A network administrator creates a private endpoint named **pe-nw** for sql-nw in a virtual network named **vnet-nw**. The endpoint is integrated with the `privatelink.database.windows.net` private DNS zone, which is linked to vnet-nw. No other setting of sql-nw is changed.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un serveur logique Azure SQL Database nommé **sql-nw**. L'accès réseau public de sql-nw est défini sur **Selected networks**, et une règle de pare-feu IP au niveau du serveur autorise les adresses publiques d'une succursale.

        Un administrateur réseau crée un point de terminaison privé nommé **pe-nw** pour sql-nw dans un réseau virtuel nommé **vnet-nw**. Le point de terminaison est intégré à la zone DNS privée `privatelink.database.windows.net`, liée à vnet-nw. Aucun autre paramètre de sql-nw n'est modifié.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The branch office can still connect to sql-nw over the internet through its public endpoint.", fr: "La succursale peut toujours se connecter à sql-nw par Internet via son point de terminaison public." }
        - id: s2
          text: { en: "If pe-nw is pending, a SQL administrator can approve it on the Private access tab of the Networking page of sql-nw.", fr: "Si pe-nw est en attente, un administrateur SQL peut l'approuver dans l'onglet Private access de la page Networking de sql-nw." }
        - id: s3
          text: { en: "Applications in vnet-nw can connect by using `sql-nw.privatelink.database.windows.net` as the server name.", fr: "Les applications de vnet-nw peuvent se connecter en utilisant `sql-nw.privatelink.database.windows.net` comme nom de serveur." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Adding a private endpoint doesn't block public routing: until **Deny public network access** is selected, the firewall rules keep working. The network administrator creates the endpoint, and the SQL administrator manages the connection on the Private access tab, where it can be approved or rejected. Clients must keep using `sql-nw.database.windows.net`, which DNS resolves to the private IP address inside vnet-nw.
        fr: |
          Ajouter un point de terminaison privé ne bloque pas le routage public : tant que **Deny public network access** n'est pas sélectionné, les règles de pare-feu continuent de fonctionner. L'administrateur réseau crée le point de terminaison, et l'administrateur SQL gère la connexion dans l'onglet Private access, où elle peut être approuvée ou rejetée. Les clients doivent continuer à utiliser `sql-nw.database.windows.net`, que le DNS résout vers l'adresse IP privée dans vnet-nw.
      options:
        s3: { en: "Logins made with the privatelink name or the private IP address fail by design: the gateway needs the server's FQDN to route the login.", fr: "Les connexions faites avec le nom privatelink ou l'adresse IP privée échouent par conception : la passerelle a besoin du nom de domaine complet du serveur pour router la connexion." }
    references:
      - title: Azure Private Link - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-22-05
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has an Azure SQL managed instance that hosts a database named **Billing**. The `TaxId` column of the `dbo.Supplier` table must be protected as follows:

        - A user who runs `SELECT` on the table without opening a key gets only encrypted binary values.
        - A nightly Transact-SQL stored procedure that runs on the instance must decrypt `TaxId` to build a report file.
        - The database administrators are allowed to read the values.

        What should you implement?
      fr: |
        Adatum dispose d'une instance managée Azure SQL qui héberge une base de données nommée **Billing**. La colonne `TaxId` de la table `dbo.Supplier` doit être protégée comme suit :

        - Un utilisateur qui exécute `SELECT` sur la table sans ouvrir de clé n'obtient que des valeurs binaires chiffrées.
        - Une procédure stockée Transact-SQL nocturne, exécutée sur l'instance, doit déchiffrer `TaxId` pour produire un fichier de rapport.
        - Les administrateurs de base de données sont autorisés à lire les valeurs.

        Que devez-vous implémenter ?
    body:
      options:
        - { id: a, text: { en: "Always Encrypted with deterministic encryption and a column master key in Azure Key Vault", fr: "Always Encrypted avec chiffrement déterministe et une clé principale de colonne dans Azure Key Vault" } }
        - { id: b, text: { en: "Column-level encryption with a symmetric key protected by a certificate in the database", fr: "Le chiffrement au niveau des colonnes avec une clé symétrique protégée par un certificat de la base" } }
        - { id: c, text: { en: "Transparent data encryption with a customer-managed key in Azure Key Vault", fr: "Le chiffrement transparent des données avec une clé gérée par le client dans Azure Key Vault" } }
        - { id: d, text: { en: "Dynamic data masking with the `default()` function on the TaxId column", fr: "Le masquage dynamique des données avec la fonction `default()` sur la colonne TaxId" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Column-level encryption stores `ENCRYPTBYKEY` output in a `varbinary` column, so a plain `SELECT` returns ciphertext. The keys live in the database hierarchy (database master key, certificate, symmetric key), so a stored procedure can open the symmetric key and call `DECRYPTBYKEY` on the server. Anyone with the right permissions on the keys, such as the DBAs, can decrypt, which the requirements allow.
        fr: |
          Le chiffrement au niveau des colonnes stocke la sortie d'`ENCRYPTBYKEY` dans une colonne `varbinary` : un simple `SELECT` renvoie donc du texte chiffré. Les clés résident dans la hiérarchie de la base (clé principale de base de données, certificat, clé symétrique) : une procédure stockée peut ainsi ouvrir la clé symétrique et appeler `DECRYPTBYKEY` sur le serveur. Quiconque a les bonnes autorisations sur les clés, comme les DBA, peut déchiffrer, ce que les exigences autorisent.
      options:
        a: { en: "With Always Encrypted, only the client driver decrypts; a stored procedure running in the engine can't read the plaintext.", fr: "Avec Always Encrypted, seul le pilote client déchiffre ; une procédure stockée exécutée dans le moteur ne peut pas lire le texte en clair." }
        c: { en: "TDE encrypts files and backups only: every user with SELECT reads the values in plaintext.", fr: "TDE ne chiffre que les fichiers et les sauvegardes : tout utilisateur doté de SELECT lit les valeurs en clair." }
        d: { en: "Masking only changes the query results of some users; the values aren't encrypted, and no key is involved.", fr: "Le masquage ne change que les résultats des requêtes de certains utilisateurs ; les valeurs ne sont pas chiffrées, et aucune clé n'intervient." }
    references:
      - title: Encrypt a Column of Data - SQL Server & Azure Synapse Analytics & Azure SQL Database & SQL Managed Instance
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/encrypt-a-column-of-data

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-22-06
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has an Azure SQL Database logical server named **sql-wg** that hosts a database named **Loans**. The TDE protector of sql-wg is an RSA key named **tde-key** in an Azure key vault named **kv-wg** that uses the Azure RBAC permission model. The system-assigned managed identity of sql-wg holds the Key Vault Crypto Service Encryption User role on kv-wg.

        An administrator removes this role assignment by mistake. Loans becomes **Inaccessible**. You re-create the role assignment 50 minutes after it was removed. Two hours later, Loans is still inaccessible.

        You need to bring Loans back online. The solution must not lose any committed transaction and must minimize administrative effort.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'un serveur logique Azure SQL Database nommé **sql-wg** qui héberge une base de données nommée **Loans**. Le protecteur TDE de sql-wg est une clé RSA nommée **tde-key** dans un coffre de clés Azure nommé **kv-wg** qui utilise le modèle d'autorisation Azure RBAC. L'identité managée affectée par le système de sql-wg détient le rôle Key Vault Crypto Service Encryption User sur kv-wg.

        Un administrateur supprime cette attribution de rôle par erreur. Loans devient **Inaccessible**. Vous recréez l'attribution de rôle 50 minutes après sa suppression. Deux heures plus tard, Loans est toujours inaccessible.

        Vous devez remettre Loans en ligne. La solution ne doit perdre aucune transaction validée et doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Wait: the database recovers automatically within 24 hours of the restored key access.", fr: "Attendre : la base se rétablit automatiquement dans les 24 heures qui suivent le rétablissement de l'accès à la clé." } }
        - { id: b, text: { en: "Create a new version of tde-key in kv-wg, and then select it as the TDE protector of sql-wg.", fr: "Créer une nouvelle version de tde-key dans kv-wg, puis la sélectionner comme protecteur TDE de sql-wg." } }
        - { id: c, text: { en: "On the Transparent data encryption page of sql-wg, select Retry existing key, and then Validate key.", fr: "Dans la page Transparent data encryption de sql-wg, sélectionner Retry existing key, puis Validate key." } }
        - { id: d, text: { en: "Restore Loans to a point in time before the removal, and then rename the restored database to Loans.", fr: "Restaurer Loans à un point dans le temps antérieur à la suppression, puis renommer la base restaurée en Loans." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A database recovers automatically only if key access comes back within 30 minutes of the loss. After that, you fix the cause (here, the role assignment) and then revalidate the original key from the Transparent data encryption page: Retry existing key, then Validate key. Some server and database settings, such as failover groups or tags, might need to be configured again after the recovery.
        fr: |
          Une base ne se rétablit automatiquement que si l'accès à la clé revient dans les 30 minutes qui suivent sa perte. Au-delà, vous corrigez la cause (ici, l'attribution de rôle), puis vous revalidez la clé d'origine depuis la page Transparent data encryption : Retry existing key, puis Validate key. Certains paramètres du serveur et de la base, comme les groupes de basculement ou les étiquettes, peuvent devoir être reconfigurés après le rétablissement.
      options:
        a: { en: "Automatic recovery stops being possible when key access isn't restored within 30 minutes; waiting longer changes nothing.", fr: "Le rétablissement automatique n'est plus possible quand l'accès à la clé n'est pas rétabli dans les 30 minutes ; attendre davantage ne change rien." }
        b: { en: "Revalidation needs the original key that protected the database; a new key version doesn't resolve the inaccessible state.", fr: "La revalidation exige la clé d'origine qui protégeait la base ; une nouvelle version de clé ne résout pas l'état inaccessible." }
        d: { en: "A point-in-time restore loses the transactions committed after the chosen point, which the requirements forbid.", fr: "Une restauration à un point dans le temps perd les transactions validées après le point choisi, ce que les exigences interdisent." }
    references:
      - title: Customer-Managed Transparent Data Encryption (TDE) - Azure SQL Database & Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-22-07
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin Toys plans to encrypt the `Salary` column of an Azure SQL database named **Payroll** by using Always Encrypted. The column master key will be stored in an Azure key vault named **kv-pay**. The company requires role separation:

        - Sam, a security administrator, has access to kv-pay but no access to Payroll.
        - Dana, a database administrator, has access to Payroll but must never access kv-pay or any plaintext key.
        - A web app that runs as the managed identity **id-hrweb** must display salaries in plaintext.

        The keys are provisioned with the SqlServer PowerShell module. Who should perform each task? To answer, drag the appropriate principals to the correct tasks. Each principal may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys prévoit de chiffrer la colonne `Salary` d'une base de données Azure SQL nommée **Payroll** avec Always Encrypted. La clé principale de colonne sera stockée dans un coffre de clés Azure nommé **kv-pay**. L'entreprise exige la séparation des rôles :

        - Sam, administrateur de la sécurité, a accès à kv-pay mais pas à Payroll.
        - Dana, administratrice de base de données, a accès à Payroll mais ne doit jamais accéder à kv-pay ni à aucune clé en clair.
        - Une application web qui s'exécute sous l'identité managée **id-hrweb** doit afficher les salaires en clair.

        Les clés sont provisionnées avec le module PowerShell SqlServer. Qui doit effectuer chaque tâche ? Pour répondre, faites glisser les principaux appropriés vers les tâches correspondantes. Chaque principal peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: sam, text: { en: "Sam (security administrator)", fr: "Sam (administrateur de la sécurité)" } }
        - { id: dana, text: { en: "Dana (database administrator)", fr: "Dana (administratrice de base de données)" } }
        - { id: app, text: { en: "id-hrweb (web app identity)", fr: "id-hrweb (identité de l'application web)" } }
        - { id: srv, text: { en: "The managed identity of the logical server", fr: "L'identité managée du serveur logique" } }
      targets:
        - id: t_cek
          text: { en: "Generate a column encryption key and encrypt it with the column master key", fr: "Générer une clé de chiffrement de colonne et la chiffrer avec la clé principale de colonne" }
        - id: t_cmk
          text: { en: "Create the column master key in kv-pay", fr: "Créer la clé principale de colonne dans kv-pay" }
        - id: t_meta
          text: { en: "Create the key metadata in Payroll from the key path and the encrypted key value", fr: "Créer les métadonnées des clés dans Payroll à partir du chemin de la clé et de la valeur de clé chiffrée" }
        - id: t_run
          text: { en: "Unwrap the column encryption key at run time to decrypt the Salary values", fr: "Déchiffrer (unwrap) la clé de chiffrement de colonne à l'exécution pour déchiffrer les valeurs de Salary" }
    answer:
      mapping: { t_cek: sam, t_cmk: sam, t_meta: dana, t_run: app }
    explanation:
      correct:
        en: |
          With role separation, the security administrator works only with the key store: he creates the column master key and generates the column encryption key, encrypted by the column master key, which is the step that touches plaintext keys. He gives the DBA only the key path and the encrypted value, and the DBA creates the column master key and column encryption key metadata in the database. At run time, the client driver of the app unwraps the column encryption key, so id-hrweb needs permissions on the key in kv-pay.
        fr: |
          Avec la séparation des rôles, l'administrateur de la sécurité ne travaille qu'avec le magasin de clés : il crée la clé principale de colonne et génère la clé de chiffrement de colonne, chiffrée par la clé principale de colonne, étape qui manipule des clés en clair. Il ne transmet au DBA que le chemin de la clé et la valeur chiffrée, et le DBA crée les métadonnées de la clé principale de colonne et de la clé de chiffrement de colonne dans la base. À l'exécution, le pilote client de l'application déchiffre la clé de chiffrement de colonne : id-hrweb a donc besoin d'autorisations sur la clé dans kv-pay.
      options:
        srv: { en: "The database engine never receives Always Encrypted keys in plaintext, so the server identity has no role in this process.", fr: "Le moteur de base de données ne reçoit jamais les clés Always Encrypted en clair : l'identité du serveur ne joue aucun rôle dans ce processus." }
        dana: { en: "Generating the column encryption key handles plaintext keys and needs the key vault, both of which Dana must never access.", fr: "Générer la clé de chiffrement de colonne manipule des clés en clair et exige le coffre de clés, deux accès interdits à Dana." }
    references:
      - title: Provision Always Encrypted Keys Using PowerShell - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/configure-always-encrypted-keys-using-powershell
      - title: Always Encrypted - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-22-08
    objective: "2.2.5"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Proseware has an Azure SQL database named **Clinic** on standard-series hardware, with compatibility level 160. VBS secure enclaves are enabled for Clinic.

        The `LastName` column of the `dbo.Patient` table uses the `Latin1_General_BIN2` collation and is encrypted with deterministic encryption by a column encryption key named **CEK1**. CEK1 is protected by a column master key named **CMK1** in Azure Key Vault. CMK1 was created without **Allow enclave computations**.

        Applications must now run `LIKE` queries on `LastName`. The column must stay protected by CEK1, and its data must not leave the database during the cryptographic operation. You are connected to Clinic in SQL Server Management Studio with Always Encrypted and secure enclaves enabled, and the attestation protocol set to None.

        Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Proseware dispose d'une base de données Azure SQL nommée **Clinic** sur du matériel de série standard, avec le niveau de compatibilité 160. Les enclaves sécurisées VBS sont activées pour Clinic.

        La colonne `LastName` de la table `dbo.Patient` utilise le classement `Latin1_General_BIN2` et est chiffrée en chiffrement déterministe par une clé de chiffrement de colonne nommée **CEK1**. CEK1 est protégée par une clé principale de colonne nommée **CMK1** dans Azure Key Vault. CMK1 a été créée sans **Allow enclave computations**.

        Les applications doivent désormais exécuter des requêtes `LIKE` sur `LastName`. La colonne doit rester protégée par CEK1, et ses données ne doivent pas quitter la base pendant l'opération de chiffrement. Vous êtes connecté à Clinic dans SQL Server Management Studio avec Always Encrypted et les enclaves sécurisées activés, et le protocole d'attestation défini sur None.

        Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 3
      actions:
        - { id: cmk2, text: { en: "Create a column master key named CMK2 in Azure Key Vault with Allow enclave computations selected.", fr: "Créer une clé principale de colonne nommée CMK2 dans Azure Key Vault avec Allow enclave computations sélectionné." } }
        - { id: rotate, text: { en: "Rotate CMK1 to CMK2, so that CEK1 is encrypted by CMK2.", fr: "Effectuer la rotation de CMK1 vers CMK2, afin que CEK1 soit chiffrée par CMK2." } }
        - { id: alter, text: { en: "Run ALTER TABLE ... ALTER COLUMN LastName ... ENCRYPTED WITH (COLUMN_ENCRYPTION_KEY = CEK1, ENCRYPTION_TYPE = RANDOMIZED ...).", fr: "Exécuter ALTER TABLE ... ALTER COLUMN LastName ... ENCRYPTED WITH (COLUMN_ENCRYPTION_KEY = CEK1, ENCRYPTION_TYPE = RANDOMIZED ...)." } }
        - { id: cek2, text: { en: "Create a column encryption key named CEK2 protected by CMK2, and re-encrypt LastName in place from CEK1 to CEK2.", fr: "Créer une clé de chiffrement de colonne nommée CEK2 protégée par CMK2, et rechiffrer LastName sur place de CEK1 vers CEK2." } }
        - { id: maa, text: { en: "Configure an attestation policy in Microsoft Azure Attestation.", fr: "Configurer une stratégie d'attestation dans Microsoft Azure Attestation." } }
        - { id: dc, text: { en: "Change the hardware configuration of Clinic to DC-series.", fr: "Changer la configuration matérielle de Clinic en série DC." } }
    answer:
      sequence: [ cmk2, rotate, alter ]
    explanation:
      correct:
        en: |
          A column encryption key is enclave-enabled only when its column master key is, and in-place re-encryption requires the current key of the column to be enclave-enabled. Creating CMK2 with Allow enclave computations and rotating CMK1 to CMK2 makes CEK1 enclave-enabled without touching the data. `ALTER TABLE ... ALTER COLUMN` can then switch the column to randomized encryption inside the enclave, which `LIKE` queries require.
        fr: |
          Une clé de chiffrement de colonne n'est compatible enclave que si sa clé principale de colonne l'est, et le rechiffrement sur place exige que la clé actuelle de la colonne soit compatible enclave. Créer CMK2 avec Allow enclave computations puis effectuer la rotation de CMK1 vers CMK2 rend CEK1 compatible enclave sans toucher aux données. `ALTER TABLE ... ALTER COLUMN` peut alors passer la colonne en chiffrement aléatoire dans l'enclave, ce qu'exigent les requêtes `LIKE`.
      options:
        cek2: { en: "In-place re-encryption needs both the current and the new key to be enclave-enabled; CEK1 isn't yet, and the column must keep CEK1.", fr: "Le rechiffrement sur place exige que la clé actuelle et la nouvelle clé soient compatibles enclave ; CEK1 ne l'est pas encore, et la colonne doit garder CEK1." }
        maa: { en: "VBS enclaves in Azure SQL Database don't support attestation; the protocol None is already used.", fr: "Les enclaves VBS d'Azure SQL Database ne prennent pas en charge l'attestation ; le protocole None est déjà utilisé." }
        dc: { en: "VBS enclaves need no special hardware, and Intel SGX enclaves on DC-series reach end of support in October 2027.", fr: "Les enclaves VBS n'exigent aucun matériel particulier, et les enclaves Intel SGX en série DC arrivent en fin de support en octobre 2027." }
    references:
      - title: Rotate enclave-enabled keys - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves-rotate-keys
      - title: Configure column encryption in-place using Always Encrypted with secure enclaves - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves-configure-encryption

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-22-09
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure SQL Database logical server named **sql-fab**. Its public network access is disabled, and its connection policy is **Redirect**. A private endpoint named **pe-sql** for sql-fab is in the subnet **snet-pe** (10.20.2.0/24) of a virtual network named **vnet-hub**. No network security group is associated with snet-pe.

        Application servers in the subnet **snet-app** of vnet-hub use Microsoft.Data.SqlClient and connect to `sql-fab.database.windows.net`, which resolves to the private IP address of pe-sql. The network security group of snet-app contains an outbound rule that allows TCP port 1433 to 10.20.2.0/24, followed by a rule that denies all other outbound traffic. Connection attempts from the application servers fail.

        You need to ensure that the application servers can connect. The solution must keep the lowest connection latency and open the fewest ports.

        What should you do?
      fr: |
        Fabrikam dispose d'un serveur logique Azure SQL Database nommé **sql-fab**. Son accès réseau public est désactivé, et sa stratégie de connexion est **Redirect**. Un point de terminaison privé nommé **pe-sql** pour sql-fab se trouve dans le sous-réseau **snet-pe** (10.20.2.0/24) d'un réseau virtuel nommé **vnet-hub**. Aucun groupe de sécurité réseau n'est associé à snet-pe.

        Des serveurs d'applications du sous-réseau **snet-app** de vnet-hub utilisent Microsoft.Data.SqlClient et se connectent à `sql-fab.database.windows.net`, qui se résout vers l'adresse IP privée de pe-sql. Le groupe de sécurité réseau de snet-app contient une règle de trafic sortant qui autorise le port TCP 1433 vers 10.20.2.0/24, suivie d'une règle qui refuse tout autre trafic sortant. Les tentatives de connexion des serveurs d'applications échouent.

        Vous devez faire en sorte que les serveurs d'applications puissent se connecter. La solution doit conserver la latence de connexion la plus faible et ouvrir le moins de ports possible.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the connection policy of sql-fab to Proxy, so that every connection uses port 1433.", fr: "Changer la stratégie de connexion de sql-fab en Proxy, pour que toutes les connexions utilisent le port 1433." } }
        - { id: b, text: { en: "Change the outbound rule of snet-app to allow TCP ports 1433 to 65535 to 10.20.2.0/24.", fr: "Modifier la règle de trafic sortant de snet-app pour autoriser les ports TCP 1433 à 65535 vers 10.20.2.0/24." } }
        - { id: c, text: { en: "Change the connection string to use the private IP address of pe-sql instead of the server name.", fr: "Modifier la chaîne de connexion pour utiliser l'adresse IP privée de pe-sql au lieu du nom du serveur." } }
        - { id: d, text: { en: "Add an outbound rule that allows TCP ports 11000 to 11999 to the `Sql` service tag of the region.", fr: "Ajouter une règle de trafic sortant qui autorise les ports TCP 11000 à 11999 vers la balise de service `Sql` de la région." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With the Redirect policy through a private endpoint, the client first reaches the gateway on port 1433 and is then redirected to the node that hosts the database, on a port between 1433 and 65535 of the private endpoint. The outbound rule must therefore allow this whole range to the private endpoint subnet. Redirect is the policy recommended for the lowest latency, so keeping it meets the requirement.
        fr: |
          Avec la stratégie Redirect via un point de terminaison privé, le client atteint d'abord la passerelle sur le port 1433, puis il est redirigé vers le nœud qui héberge la base, sur un port compris entre 1433 et 65535 du point de terminaison privé. La règle de trafic sortant doit donc autoriser toute cette plage vers le sous-réseau du point de terminaison privé. Redirect est la stratégie recommandée pour la latence la plus faible : la conserver répond à l'exigence.
      options:
        a: { en: "Proxy would work with port 1433 only, but every connection would go through the gateway, which increases latency.", fr: "Proxy fonctionnerait avec le seul port 1433, mais chaque connexion passerait par la passerelle, ce qui augmente la latence." }
        c: { en: "Logins made directly to the private IP address fail by design: the gateway needs the server's FQDN to route them.", fr: "Les connexions faites directement à l'adresse IP privée échouent par conception : la passerelle a besoin du nom de domaine complet du serveur pour les router." }
        d: { en: "Ports 11000 to 11999 to the Sql service tag serve redirection to the public endpoint; through a private endpoint, the traffic targets the private IP on ports 1433 to 65535.", fr: "Les ports 11000 à 11999 vers la balise de service Sql servent à la redirection vers le point de terminaison public ; via un point de terminaison privé, le trafic vise l'adresse IP privée sur les ports 1433 à 65535." }
    references:
      - title: Azure Private Link - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-22-10
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has two Azure SQL Database logical servers, each with a system-assigned managed identity:

        | Server | Region | TDE protector | Key vault of the protector |
        | --- | --- | --- | --- |
        | sql-weu1 | West Europe | Customer-managed key **KeyA** | kv-weu (West Europe) |
        | sql-neu1 | North Europe | Customer-managed key **KeyB** | kv-neu (North Europe) |

        Both key vaults use the Azure RBAC permission model, with soft delete and purge protection enabled. Each server's identity holds the Key Vault Crypto Service Encryption User role only on the key vault of its own protector.

        You try to create a failover group from sql-weu1 to sql-neu1, and the operation fails. Each server must keep its current key as its TDE protector.

        Which two actions should you perform before you retry? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de deux serveurs logiques Azure SQL Database, chacun avec une identité managée affectée par le système :

        | Serveur | Région | Protecteur TDE | Coffre de clés du protecteur |
        | --- | --- | --- | --- |
        | sql-weu1 | Europe Ouest | Clé gérée par le client **KeyA** | kv-weu (Europe Ouest) |
        | sql-neu1 | Europe Nord | Clé gérée par le client **KeyB** | kv-neu (Europe Nord) |

        Les deux coffres de clés utilisent le modèle d'autorisation Azure RBAC, avec la suppression réversible et la protection contre le vidage activées. L'identité de chaque serveur détient le rôle Key Vault Crypto Service Encryption User uniquement sur le coffre de clés de son propre protecteur.

        Vous tentez de créer un groupe de basculement de sql-weu1 vers sql-neu1, et l'opération échoue. Chaque serveur doit conserver sa clé actuelle comme protecteur TDE.

        Quelles sont les deux actions à effectuer avant de réessayer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Assign the Key Vault Crypto Service Encryption User role on kv-neu to sql-weu1, and on kv-weu to sql-neu1.", fr: "Attribuer le rôle Key Vault Crypto Service Encryption User sur kv-neu à sql-weu1, et sur kv-weu à sql-neu1." } }
        - { id: b, text: { en: "Re-create KeyB in a key vault in West Europe, so that both protectors are in the region of the primary server.", fr: "Recréer KeyB dans un coffre de clés en Europe Ouest, pour que les deux protecteurs soient dans la région du serveur principal." } }
        - { id: c, text: { en: "Add KeyB to sql-weu1 and KeyA to sql-neu1 by running `az sql server key create` on each server.", fr: "Ajouter KeyB à sql-weu1 et KeyA à sql-neu1 en exécutant `az sql server key create` sur chaque serveur." } }
        - { id: d, text: { en: "Enable automatic key rotation on both servers, so that each server picks up the other server's key.", fr: "Activer la rotation automatique des clés sur les deux serveurs, pour que chaque serveur récupère la clé de l'autre." } }
        - { id: e, text: { en: "Switch sql-neu1 to service-managed TDE until the failover group is created, and then set KeyB again.", fr: "Passer sql-neu1 en TDE géré par le service jusqu'à la création du groupe de basculement, puis redéfinir KeyB." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          When a geo-replication link or failover group is created, Azure SQL checks that both servers can access every key that the databases need, and the operation fails otherwise. When the servers use different keys, both keys must be added to both servers before the creation, and each server's identity needs permissions on every key vault that contains one of these keys. The key vaults can stay in their own regions.
        fr: |
          À la création d'un lien de géoréplication ou d'un groupe de basculement, Azure SQL vérifie que les deux serveurs peuvent accéder à toutes les clés dont les bases ont besoin, sinon l'opération échoue. Quand les serveurs utilisent des clés différentes, les deux clés doivent être ajoutées aux deux serveurs avant la création, et l'identité de chaque serveur a besoin d'autorisations sur chaque coffre de clés qui contient l'une de ces clés. Les coffres de clés peuvent rester dans leurs propres régions.
      options:
        b: { en: "The primary and secondary servers can use key vaults in any supported region; the location isn't what fails.", fr: "Les serveurs principal et secondaire peuvent utiliser des coffres de clés dans toute région prise en charge ; l'emplacement n'est pas la cause de l'échec." }
        d: { en: "Automatic rotation only moves a server to newer versions of its own key; it doesn't add another server's key.", fr: "La rotation automatique ne fait passer un serveur qu'aux nouvelles versions de sa propre clé ; elle n'ajoute pas la clé d'un autre serveur." }
        e: { en: "Each server must keep its customer-managed key, and the databases of sql-weu1 still need KeyA on sql-neu1 after a failover.", fr: "Chaque serveur doit conserver sa clé gérée par le client, et les bases de sql-weu1 ont toujours besoin de KeyA sur sql-neu1 après un basculement." }
    references:
      - title: Customer-Managed Transparent Data Encryption (TDE) - Azure SQL Database & Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
