chapter: 11-deploy-azure-sql
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure SQL Database database named **DevDb** in the General Purpose service tier. DevDb uses the serverless compute tier with auto-pause enabled, and it stays paused every weekend.

        What is billed for DevDb while it's paused?
      fr: |
        Contoso dispose d'une base de données Azure SQL Database nommée **DevDb** au niveau de service General Purpose. DevDb utilise le niveau de calcul serverless avec la pause automatique activée, et reste en pause chaque week-end.

        Qu'est-ce qui est facturé pour DevDb pendant la pause ?
    body:
      options:
        - { id: a, text: { en: "The maximum vCores and the storage, at a reduced rate", fr: "Le nombre maximal de vCores et le stockage, à un tarif réduit" } }
        - { id: b, text: { en: "The minimum vCores and the storage", fr: "Le nombre minimal de vCores et le stockage" } }
        - { id: c, text: { en: "Only the storage of the database", fr: "Uniquement le stockage de la base de données" } }
        - { id: d, text: { en: "Neither the compute nor the storage", fr: "Ni le calcul ni le stockage" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When a serverless database is paused, its compute cost is zero and only its storage is billed. That is why serverless with auto-pause suits databases that are idle for long periods, such as development databases.
        fr: |
          Quand une base de données serverless est en pause, son coût de calcul est nul et seul son stockage est facturé. C'est pourquoi le serverless avec pause automatique convient aux bases inactives pendant de longues périodes, comme les bases de développement.
      options:
        a: { en: "Serverless never bills the maximum vCores by default: it bills the compute actually used, and nothing while paused.", fr: "Le serverless ne facture jamais par défaut le maximum de vCores : il facture le calcul réellement utilisé, et rien pendant la pause." }
        b: { en: "The minimum vCores are billed while the database is online but idle; once it's paused, no compute is billed.", fr: "Le nombre minimal de vCores est facturé quand la base est en ligne mais inactive ; une fois en pause, aucun calcul n'est facturé." }
        d: { en: "The data stays stored during the pause, so the storage is still billed.", fr: "Les données restent stockées pendant la pause : le stockage est donc toujours facturé." }
    references:
      - title: Serverless compute tier for Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-11-02
    objective: "1.1.9"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam runs a SQL Server failover cluster instance (FCI) on two Azure virtual machines. The FCI is registered with the SQL IaaS Agent extension.

        You need to schedule the automatic installation of Windows and SQL Server updates on both nodes. What should you use?
      fr: |
        Fabrikam exécute une instance de cluster de basculement (FCI) SQL Server sur deux machines virtuelles Azure. La FCI est inscrite auprès de l'extension SQL IaaS Agent.

        Vous devez planifier l'installation automatique des mises à jour Windows et SQL Server sur les deux nœuds. Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Extended Security Updates", fr: "Les mises à jour de sécurité étendues" } }
        - { id: b, text: { en: "Automated Patching of the SQL IaaS Agent extension", fr: "La mise à jour corrective automatisée de l'extension SQL IaaS Agent" } }
        - { id: c, text: { en: "Automatic updates of SQL Server enabled by Azure Arc", fr: "Les mises à jour automatiques de SQL Server activé par Azure Arc" } }
        - { id: d, text: Azure Update Manager }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A failover cluster instance registered with the SQL IaaS Agent extension has limited functionality: features that need the agent, such as patching, aren't supported. Azure Update Manager patches the Azure virtual machines on a schedule and is the recommended tool anyway, since Automated Patching retires in September 2027.
        fr: |
          Une instance de cluster de basculement inscrite auprès de l'extension SQL IaaS Agent a des fonctionnalités limitées : celles qui exigent l'agent, comme la mise à jour corrective, ne sont pas prises en charge. Azure Update Manager applique les correctifs aux machines virtuelles Azure selon une planification et c'est de toute façon l'outil recommandé, puisque la mise à jour corrective automatisée sera mise hors service en septembre 2027.
      options:
        a: { en: "Extended Security Updates provide security fixes for out-of-support versions; they don't schedule the installation of updates.", fr: "Les mises à jour de sécurité étendues fournissent des correctifs de sécurité aux versions hors support ; elles ne planifient pas l'installation des mises à jour." }
        b: { en: "Automated Patching is an agent feature, which an FCI registered with the extension doesn't support.", fr: "La mise à jour corrective automatisée est une fonctionnalité de l'agent, qu'une FCI inscrite auprès de l'extension ne prend pas en charge." }
        c: { en: "Azure Arc manages SQL Server outside Azure; SQL Server on Azure virtual machines uses the SQL IaaS Agent extension instead.", fr: "Azure Arc gère SQL Server hors d'Azure ; SQL Server sur les machines virtuelles Azure utilise à la place l'extension SQL IaaS Agent." }
    references:
      - title: Automate management with the Windows SQL Server IaaS Agent extension
        url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/sql-server-iaas-agent-extension-automate-management
      - title: Automated Patching for SQL Server on Azure virtual machines
        url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/automated-patching

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-11-03
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind plans to create a SQL database in Microsoft Fabric named **OrdersDb** for a new order intake application. The application authenticates by using a managed identity. Analysts will report on the orders from the same Fabric workspace.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind prévoit de créer une base de données SQL dans Microsoft Fabric nommée **OrdersDb** pour une nouvelle application de saisie des commandes. L'application s'authentifie à l'aide d'une identité managée. Les analystes produiront des rapports sur les commandes depuis le même espace de travail Fabric.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "You can store the orders in ledger tables of OrdersDb to prove that no row was tampered with.", fr: "Vous pouvez stocker les commandes dans des tables de registre (ledger) d'OrdersDb pour prouver qu'aucune ligne n'a été falsifiée." } }
        - { id: s2, text: { en: "The managed identity of the application can be given access to OrdersDb as a database user for a Microsoft Entra principal.", fr: "L'identité managée de l'application peut obtenir l'accès à OrdersDb en tant qu'utilisateur de base de données d'un principal Microsoft Entra." } }
        - { id: s3, text: { en: "You can place OrdersDb in an elastic pool to share vCores with the other databases of the workspace.", fr: "Vous pouvez placer OrdersDb dans un pool élastique pour partager des vCores avec les autres bases de l'espace de travail." } }
    answer: { values: { s1: false, s2: true, s3: false } }
    explanation:
      correct:
        en: |
          SQL database in Fabric doesn't support ledger tables (nor Always Encrypted or in-memory tables), so tamper-evidence with ledger requires Azure SQL Database. It supports only Microsoft Entra authentication: there are no logins, and access is given to users that represent Entra principals, such as a managed identity. Elastic pools don't exist in Fabric; they're an Azure SQL Database feature on a logical server.
        fr: |
          La base de données SQL dans Fabric ne prend pas en charge les tables de registre (ni Always Encrypted ni les tables en mémoire) : la preuve d'inviolabilité par le registre exige Azure SQL Database. Elle ne prend en charge que l'authentification Microsoft Entra : il n'y a pas de connexions, et l'accès se donne à des utilisateurs qui représentent des principaux Entra, comme une identité managée. Les pools élastiques n'existent pas dans Fabric ; c'est une fonctionnalité d'Azure SQL Database sur un serveur logique.
    references:
      - title: Limitations in SQL database in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/database/sql/limitations

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-11-04
    objective: "1.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin created an Azure virtual machine named **SQLVM4** from a Windows Server 2022 image, then installed SQL Server 2022 Enterprise from the installation media. SQLVM4 doesn't appear on the **SQL virtual machines** page of the Azure portal.

        You need to configure automated backups and Azure Key Vault integration for SQLVM4 from the Azure portal. The solution must not redeploy SQLVM4.

        What should you do?
      fr: |
        Tailspin a créé une machine virtuelle Azure nommée **SQLVM4** à partir d'une image Windows Server 2022, puis a installé SQL Server 2022 Enterprise depuis le support d'installation. SQLVM4 n'apparaît pas dans la page **Machines virtuelles SQL** du portail Azure.

        Vous devez configurer les sauvegardes automatisées et l'intégration Azure Key Vault de SQLVM4 depuis le portail Azure. La solution ne doit pas redéployer SQLVM4.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Re-create SQLVM4 from an Azure Marketplace SQL Server 2022 image", fr: "Recréer SQLVM4 à partir d'une image SQL Server 2022 de la Place de marché Azure" } }
        - { id: b, text: { en: "Connect SQLVM4 to Azure Arc with the Azure extension for SQL Server", fr: "Connecter SQLVM4 à Azure Arc avec l'extension Azure pour SQL Server" } }
        - { id: c, text: { en: "Register SQLVM4 with the SQL IaaS Agent extension", fr: "Inscrire SQLVM4 auprès de l'extension SQL IaaS Agent" } }
        - { id: d, text: { en: "Install the Azure Monitor Agent on SQLVM4 with a data collection rule", fr: "Installer Azure Monitor Agent sur SQLVM4 avec une règle de collecte de données" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A virtual machine on which you install SQL Server yourself must be registered with the SQL IaaS Agent extension to unlock its management features (the subscription must be registered with the Microsoft.SqlVirtualMachine resource provider first). Once it's registered, features such as automated backup and Azure Key Vault integration can be enabled from the portal, without redeploying the virtual machine.
        fr: |
          Une machine virtuelle sur laquelle vous installez vous-même SQL Server doit être inscrite auprès de l'extension SQL IaaS Agent pour débloquer ses fonctionnalités de gestion (l'abonnement doit d'abord être inscrit auprès du fournisseur de ressources Microsoft.SqlVirtualMachine). Une fois inscrite, des fonctionnalités comme la sauvegarde automatisée et l'intégration Azure Key Vault s'activent depuis le portail, sans redéployer la machine virtuelle.
      options:
        a: { en: "A Marketplace image would register the new virtual machine automatically, but re-creating SQLVM4 is the redeployment the solution must avoid.", fr: "Une image de la Place de marché inscrirait automatiquement la nouvelle machine virtuelle, mais recréer SQLVM4 est le redéploiement que la solution doit éviter." }
        b: { en: "Azure Arc is for SQL Server running outside Azure; SQL Server on Azure virtual machines is managed through the SQL IaaS Agent extension.", fr: "Azure Arc concerne SQL Server exécuté hors d'Azure ; SQL Server sur les machines virtuelles Azure se gère avec l'extension SQL IaaS Agent." }
        d: { en: "The Azure Monitor Agent collects monitoring data; it doesn't provide automated backup or Key Vault integration for SQL Server.", fr: "Azure Monitor Agent collecte des données de supervision ; il ne fournit ni la sauvegarde automatisée ni l'intégration Key Vault de SQL Server." }
    references:
      - title: Register Windows SQL Server VM with SQL IaaS Agent extension
        url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/sql-agent-extension-manually-register-single-vm
      - title: Automate management with the Windows SQL Server IaaS Agent extension
        url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/sql-server-iaas-agent-extension-automate-management

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-11-05
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware wants a single inventory of its SQL Server instances in the Azure portal and plans to use SQL Server enabled by Azure Arc. Every instance is 64-bit and its server can reach Azure through outbound HTTPS.

        Which instance can you connect to Azure Arc as a SQL Server - Azure Arc resource?
      fr: |
        Proseware souhaite un inventaire unique de ses instances SQL Server dans le portail Azure et prévoit d'utiliser SQL Server activé par Azure Arc. Chaque instance est en 64 bits et son serveur peut joindre Azure en HTTPS sortant.

        Quelle instance pouvez-vous connecter à Azure Arc en tant que ressource SQL Server - Azure Arc ?
    body:
      options:
        - { id: a, text: { en: "SQL Server 2012 on an on-premises physical server that runs Windows Server 2016", fr: "SQL Server 2012 sur un serveur physique local qui exécute Windows Server 2016" } }
        - { id: b, text: { en: "SQL Server 2019 on an Azure virtual machine that runs Windows Server 2022", fr: "SQL Server 2019 sur une machine virtuelle Azure qui exécute Windows Server 2022" } }
        - { id: c, text: { en: "SQL Server 2022 in Linux containers on an on-premises host that runs Ubuntu 20.04", fr: "SQL Server 2022 dans des conteneurs Linux sur un hôte local qui exécute Ubuntu 20.04" } }
        - { id: d, text: { en: "SQL Server 2016 on a virtual machine in another cloud that runs Windows Server 2019", fr: "SQL Server 2016 sur une machine virtuelle d'un autre cloud qui exécute Windows Server 2019" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          SQL Server enabled by Azure Arc manages SQL Server 2014 and later that runs outside Azure, including on virtual machines in other clouds. SQL Server 2016 on Windows Server 2019 meets both the version and the operating system prerequisites (Windows Server 2016 or later).
        fr: |
          SQL Server activé par Azure Arc gère SQL Server 2014 et ultérieur exécuté hors d'Azure, y compris sur des machines virtuelles d'autres clouds. SQL Server 2016 sur Windows Server 2019 respecte à la fois les prérequis de version et de système d'exploitation (Windows Server 2016 ou ultérieur).
      options:
        a: { en: "SQL Server 2012 and older versions aren't supported by Azure Arc; the minimum version is SQL Server 2014.", fr: "SQL Server 2012 et les versions antérieures ne sont pas pris en charge par Azure Arc ; la version minimale est SQL Server 2014." }
        b: { en: "SQL Server on Azure virtual machines isn't an Arc configuration; it's managed through the SQL IaaS Agent extension.", fr: "SQL Server sur les machines virtuelles Azure n'est pas une configuration Arc ; il se gère avec l'extension SQL IaaS Agent." }
        c: { en: "SQL Server running in containers is an unsupported configuration, even on a supported Linux distribution.", fr: "SQL Server exécuté dans des conteneurs est une configuration non prise en charge, même sur une distribution Linux prise en charge." }
    references:
      - title: Prerequisites - SQL Server enabled by Azure Arc
        url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/prerequisites

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-11-06
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove plans a new OLTP database named **PaymentsDb** for an application that uses only database-scoped features. PaymentsDb will hold 6 TB of data at go-live and grow by about 2 TB per year.

        The solution must meet the following requirements:

        - Reporting queries must run on a readable secondary replica in the same region, not on the primary replica.
        - At each month-end, the compute size is increased for two days and then decreased. The duration of each change must not depend on the volume of data.
        - Administrative effort must be minimized.

        What should you recommend?
      fr: |
        Woodgrove prévoit une nouvelle base de données OLTP nommée **PaymentsDb** pour une application qui n'utilise que des fonctionnalités au niveau de la base. PaymentsDb contiendra 6 To de données à la mise en service et grossira d'environ 2 To par an.

        La solution doit répondre aux exigences suivantes :

        - Les requêtes de reporting doivent s'exécuter sur un réplica secondaire lisible dans la même région, pas sur le réplica principal.
        - À chaque fin de mois, la taille de calcul est augmentée pendant deux jours, puis réduite. La durée de chaque changement ne doit pas dépendre du volume de données.
        - L'effort d'administration doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "An Azure SQL Database single database in the Business Critical tier with read scale-out", fr: "Une base de données unique Azure SQL Database au niveau Business Critical avec le scale-out en lecture" } }
        - { id: b, text: { en: "An Azure SQL Database single database in the Hyperscale tier with one high availability replica", fr: "Une base de données unique Azure SQL Database au niveau Hyperscale avec un réplica de haute disponibilité" } }
        - { id: c, text: { en: "An Azure SQL managed instance in the Business Critical tier on premium-series hardware", fr: "Une instance Azure SQL Managed Instance au niveau Business Critical sur du matériel série Premium" } }
        - { id: d, text: { en: "An Azure SQL Database single database in the General Purpose tier with serverless compute", fr: "Une base de données unique Azure SQL Database au niveau General Purpose avec le calcul serverless" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Hyperscale supports up to 128 TB, and because compute is separated from storage, the time to scale up or down is no longer tied to the volume of data. A high availability replica is readable with ApplicationIntent=ReadOnly, so the reports leave the primary, and a single database keeps administrative effort minimal.
        fr: |
          Hyperscale prend en charge jusqu'à 128 To et, comme le calcul est séparé du stockage, le temps de mise à l'échelle n'est plus lié au volume de données. Un réplica de haute disponibilité est lisible avec ApplicationIntent=ReadOnly : les rapports quittent donc le principal, et une base de données unique réduit l'effort d'administration au minimum.
      options:
        a: { en: "Business Critical offers a free readable replica, but a single database is limited to 4 TB: 6 TB at go-live doesn't fit.", fr: "Business Critical offre un réplica lisible gratuit, mais une base unique est limitée à 4 To : 6 To dès la mise en service ne tiennent pas." }
        c: { en: "Scaling a Business Critical managed instance seeds the data to new replicas, so the duration of each change grows with the data size.", fr: "La mise à l'échelle d'une instance managée Business Critical réensemence les données vers de nouveaux réplicas : la durée de chaque changement augmente avec la taille des données." }
        d: { en: "General Purpose is limited to 4 TB and has no readable secondary replica for the reports.", fr: "General Purpose est limité à 4 To et n'a pas de réplica secondaire lisible pour les rapports." }
    references:
      - title: Hyperscale service tier
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-11-07
    objective: "1.1.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam hosts a SaaS ordering application in a single Azure SQL Database Hyperscale database. The write throughput of the workload now exceeds what the largest compute size provides. You plan to shard the data across several databases and to route requests by using the Elastic Database client library.

        The main tables contain the columns **CustomerId**, **OrderId**, **OrderDate** and **Region**. Fabrikam has 12,000 customers, and 70 percent of them are in the Europe region. Every business transaction reads and writes several orders of a single customer, and orders arrive for all the customers throughout the day.

        The design must keep every transaction within one database and spread the write load evenly across the shards as shards are added. Which column should you use as the sharding key?
      fr: |
        Fabrikam héberge une application SaaS de commandes dans une base de données Azure SQL Database Hyperscale unique. Le débit d'écriture de la charge de travail dépasse désormais ce que fournit la plus grande taille de calcul. Vous prévoyez de répartir les données sur plusieurs bases par sharding et de router les requêtes avec la bibliothèque cliente Elastic Database.

        Les tables principales contiennent les colonnes **CustomerId**, **OrderId**, **OrderDate** et **Region**. Fabrikam compte 12 000 clients, dont 70 % se trouvent dans la région Europe. Chaque transaction métier lit et écrit plusieurs commandes d'un seul client, et des commandes arrivent pour tous les clients tout au long de la journée.

        La conception doit garder chaque transaction dans une seule base et répartir uniformément la charge d'écriture entre les shards à mesure que des shards sont ajoutés. Quelle colonne devez-vous utiliser comme clé de sharding ?
    body:
      options:
        - { id: a, text: OrderDate }
        - { id: b, text: OrderId }
        - { id: c, text: CustomerId }
        - { id: d, text: Region }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Sharding works best when every transaction is restricted to a single value of the sharding key, so the key must be the unit of the transactions: the customer. With 12,000 customers whose orders arrive all day, ranges or lists of CustomerId values can be spread over any number of shards and rebalanced with the split-merge tool.
        fr: |
          Le sharding fonctionne le mieux quand chaque transaction se limite à une seule valeur de la clé de sharding : la clé doit donc être l'unité des transactions, le client. Avec 12 000 clients dont les commandes arrivent toute la journée, des plages ou des listes de valeurs de CustomerId se répartissent sur un nombre quelconque de shards et se rééquilibrent avec l'outil de fractionnement-fusion.
      options:
        a: { en: "Date ranges send every new order to the shard that holds the current range, which concentrates the write load on one database.", fr: "Des plages de dates envoient chaque nouvelle commande vers le shard qui contient la plage en cours, ce qui concentre la charge d'écriture sur une seule base." }
        b: { en: "The orders of one customer would land in different databases, so a transaction on several orders would span shards.", fr: "Les commandes d'un même client se retrouveraient dans des bases différentes : une transaction sur plusieurs commandes s'étendrait sur plusieurs shards." }
        d: { en: "Region keeps a customer's transactions local, but 70 percent of the load would go to the Europe shard, which can't be split further.", fr: "Region garde locales les transactions d'un client, mais 70 % de la charge iraient vers le shard Europe, qui ne peut pas être divisé davantage." }
    references:
      - title: Scale out with Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-scale-introduction

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-11-08
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You are planning the partitioning of a table named **dbo.Shipments** in a database hosted on an Azure SQL managed instance. The table has the following columns.

        | Column | Definition |
        | --- | --- |
        | ShipmentId | `bigint NOT NULL`, assigned in random order by the source system |
        | ShipDate | `datetime2 NOT NULL` |
        | ShipMonth | `int`, computed as `YEAR(ShipDate) * 100 + MONTH(ShipDate)`, `PERSISTED` |
        | ShipMonthText | `varchar(7)`, computed as `FORMAT(ShipDate, 'yyyy-MM')`, not persisted |
        | RowVer | `rowversion` |
        | Manifest | `xml` |

        Each partition must contain the shipments of one calendar month. Which two columns can you use as the partitioning column? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous planifiez le partitionnement d'une table nommée **dbo.Shipments** dans une base de données hébergée sur une instance Azure SQL Managed Instance. La table comporte les colonnes suivantes.

        | Colonne | Définition |
        | --- | --- |
        | ShipmentId | `bigint NOT NULL`, attribuée dans un ordre aléatoire par le système source |
        | ShipDate | `datetime2 NOT NULL` |
        | ShipMonth | `int`, calculée comme `YEAR(ShipDate) * 100 + MONTH(ShipDate)`, `PERSISTED` |
        | ShipMonthText | `varchar(7)`, calculée comme `FORMAT(ShipDate, 'yyyy-MM')`, non persistante |
        | RowVer | `rowversion` |
        | Manifest | `xml` |

        Chaque partition doit contenir les expéditions d'un mois civil. Quelles sont les deux colonnes que vous pouvez utiliser comme colonne de partitionnement ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: ShipmentId }
        - { id: b, text: ShipDate }
        - { id: c, text: ShipMonth }
        - { id: d, text: ShipMonthText }
        - { id: e, text: RowVer }
        - { id: f, text: Manifest }
    answer: { optionIds: [ b, c ] }
    explanation:
      correct:
        en: |
          ShipDate is a valid partitioning column, and a partition function with the first day of each month as boundaries (RANGE RIGHT) puts one month in each partition. ShipMonth also works: a computed column can be the partitioning column when it's explicitly `PERSISTED`, and one boundary per month value gives one month per partition.
        fr: |
          ShipDate est une colonne de partitionnement valide, et une fonction de partition dont les limites sont le premier jour de chaque mois (RANGE RIGHT) place un mois dans chaque partition. ShipMonth convient aussi : une colonne calculée peut être la colonne de partitionnement quand elle est explicitement `PERSISTED`, et une limite par valeur de mois donne un mois par partition.
      options:
        a: { en: "bigint is a valid type, but identifiers assigned in random order don't map ranges of values to calendar months.", fr: "bigint est un type valide, mais des identifiants attribués dans un ordre aléatoire n'associent pas des plages de valeurs à des mois civils." }
        d: { en: "A computed column used as the partitioning column must be explicitly PERSISTED, which ShipMonthText isn't.", fr: "Une colonne calculée utilisée comme colonne de partitionnement doit être explicitement PERSISTED, ce que ShipMonthText n'est pas." }
        e: { en: "rowversion is the timestamp type, the only index key type that can't be a partitioning column.", fr: "rowversion est le type timestamp, le seul type de clé d'index qui ne peut pas être une colonne de partitionnement." }
        f: { en: "Large object types such as xml can't be partitioning columns.", fr: "Les types d'objets volumineux comme xml ne peuvent pas être des colonnes de partitionnement." }
    references:
      - title: Partitioned tables and indexes
        url: https://learn.microsoft.com/en-us/sql/relational-databases/partitions/partitioned-tables-and-indexes

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-11-09
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip deploys its SaaS environment from a pipeline by using Bicep files. You are writing a Bicep file that adds an elastic pool and a first tenant database to an existing logical server named **sql-wingtip-saas**.

        The deployment must meet the following requirements:

        - The pool uses the General Purpose service tier with 8 vCores on standard-series (Gen5) hardware.
        - The pool uses the SQL Server licenses of Wingtip that are covered by Software Assurance.
        - A single tenant database must never use more than 2 vCores of the pool.
        - A database named **TenantDb01** is created in the pool.

        How should you complete the Bicep file? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip déploie son environnement SaaS depuis un pipeline à l'aide de fichiers Bicep. Vous rédigez un fichier Bicep qui ajoute un pool élastique et une première base de locataire à un serveur logique existant nommé **sql-wingtip-saas**.

        Le déploiement doit répondre aux exigences suivantes :

        - Le pool utilise le niveau de service General Purpose avec 8 vCores sur du matériel série Standard (Gen5).
        - Le pool utilise les licences SQL Server de Wingtip couvertes par la Software Assurance.
        - Une base de locataire ne doit jamais utiliser plus de 2 vCores du pool.
        - Une base de données nommée **TenantDb01** est créée dans le pool.

        Comment devez-vous compléter le fichier Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bicep
      template: |
        resource sqlServer 'Microsoft.Sql/servers@2023-08-01' existing = {
          name: 'sql-wingtip-saas'
        }

        resource pool '[[ptype]]@2023-08-01' = {
          parent: sqlServer
          name: 'pool-tenants'
          location: resourceGroup().location
          sku: {
            name: 'GP_Gen5'
            tier: 'GeneralPurpose'
            family: 'Gen5'
            capacity: 8
          }
          properties: {
            licenseType: [[lic]]
            perDatabaseSettings: {
              minCapacity: 0
              [[perdb]]: 2
            }
          }
        }

        resource tenantDb 'Microsoft.Sql/servers/databases@2023-08-01' = {
          parent: sqlServer
          name: 'TenantDb01'
          location: resourceGroup().location
          properties: {
            [[poolprop]]: pool.id
          }
        }
      slots:
        - id: ptype
          options:
            - { id: pools, text: "Microsoft.Sql/servers/elasticPools" }
            - { id: dbs, text: "Microsoft.Sql/servers/databases" }
            - { id: mi, text: "Microsoft.Sql/managedInstances" }
        - id: lic
          options:
            - { id: base, text: "'BasePrice'" }
            - { id: incl, text: "'LicenseIncluded'" }
            - { id: ahub, text: "'AHUB'" }
        - id: perdb
          options:
            - { id: maxcap, text: maxCapacity }
            - { id: cap, text: capacity }
            - { id: maxsize, text: maxSizeBytes }
        - id: poolprop
          options:
            - { id: srcdb, text: sourceDatabaseId }
            - { id: poolid, text: elasticPoolId }
            - { id: maint, text: maintenanceConfigurationId }
    answer: { values: { ptype: pools, lic: base, perdb: maxcap, poolprop: poolid } }
    explanation:
      correct:
        en: |
          An elastic pool is a child resource of the logical server of type `Microsoft.Sql/servers/elasticPools`. `licenseType: 'BasePrice'` applies Azure Hybrid Benefit with licenses covered by Software Assurance, and `perDatabaseSettings.maxCapacity` caps the vCores that any one database can use. A database joins the pool through its `elasticPoolId` property, set to the resource ID of the pool.
        fr: |
          Un pool élastique est une ressource enfant du serveur logique de type `Microsoft.Sql/servers/elasticPools`. `licenseType: 'BasePrice'` applique Azure Hybrid Benefit avec des licences couvertes par la Software Assurance, et `perDatabaseSettings.maxCapacity` plafonne les vCores qu'une base peut utiliser. Une base de données rejoint le pool par sa propriété `elasticPoolId`, définie sur l'ID de ressource du pool.
      options:
        incl: { en: "LicenseIncluded pays for the SQL Server license in the price of the pool, instead of using the existing licenses.", fr: "LicenseIncluded paie la licence SQL Server dans le prix du pool, au lieu d'utiliser les licences existantes." }
        ahub: { en: "AHUB is a license type of SQL Server virtual machines registered with the SQL IaaS Agent extension; a pool uses BasePrice or LicenseIncluded.", fr: "AHUB est un type de licence des machines virtuelles SQL Server inscrites auprès de l'extension SQL IaaS Agent ; un pool utilise BasePrice ou LicenseIncluded." }
        maxsize: { en: "maxSizeBytes is the storage limit of the pool, not a per-database compute limit.", fr: "maxSizeBytes est la limite de stockage du pool, pas une limite de calcul par base." }
        srcdb: { en: "sourceDatabaseId identifies the source database of a copy or a restore; it doesn't place the database in a pool.", fr: "sourceDatabaseId identifie la base source d'une copie ou d'une restauration ; il ne place pas la base dans un pool." }
    references:
      - title: Microsoft.Sql servers/elasticPools
        url: https://learn.microsoft.com/en-us/azure/templates/microsoft.sql/servers/elasticpools
      - title: Microsoft.Sql servers/databases
        url: https://learn.microsoft.com/en-us/azure/templates/microsoft.sql/servers/databases

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-11-10
    objective: "1.1.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an on-premises SQL Server 2019 Enterprise instance named **SQLHQ** that hosts a database named **SalesDb**. Fabrikam owns unused SQL Server Enterprise core licenses with Software Assurance, enough for 8 vCores.

        You need to recommend a hybrid solution that meets the following requirements:

        - A copy of SalesDb in a platform as a service (PaaS) offering in Azure is kept synchronized in near real time.
        - Business analysts run their daily reports on the copy in Azure, never on SQLHQ.
        - If SQLHQ fails, the company can fail over to the copy in Azure. Failing back isn't required.
        - The SQL Server licensing cost of the copy must be minimized.

        What should you recommend?
      fr: |
        Fabrikam dispose d'une instance SQL Server 2019 Enterprise locale nommée **SQLHQ** qui héberge une base de données nommée **SalesDb**. Fabrikam possède des licences par cœur SQL Server Enterprise inutilisées avec Software Assurance, suffisantes pour 8 vCores.

        Vous devez recommander une solution hybride qui répond aux exigences suivantes :

        - Une copie de SalesDb dans une offre PaaS (platform as a service) dans Azure est synchronisée quasiment en temps réel.
        - Les analystes métier exécutent leurs rapports quotidiens sur la copie dans Azure, jamais sur SQLHQ.
        - Si SQLHQ tombe en panne, l'entreprise peut basculer vers la copie dans Azure. La restauration automatique n'est pas exigée.
        - Le coût des licences SQL Server de la copie doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A Managed Instance link to an 8-vCore managed instance on which the hybrid failover benefit is activated", fr: "Un lien Managed Instance vers une instance managée de 8 vCores sur laquelle l'avantage de basculement hybride est activé" } }
        - { id: b, text: { en: "A Managed Instance link to an 8-vCore managed instance whose license type is set to BasePrice", fr: "Un lien Managed Instance vers une instance managée de 8 vCores dont le type de licence est BasePrice" } }
        - { id: c, text: { en: "An availability group replica on an 8-vCore Azure virtual machine registered with the DR license type", fr: "Un réplica de groupe de disponibilité sur une machine virtuelle Azure de 8 vCores inscrite avec le type de licence DR" } }
        - { id: d, text: { en: "A Managed Instance link to an 8-vCore managed instance whose license type is set to LicenseIncluded", fr: "Un lien Managed Instance vers une instance managée de 8 vCores dont le type de licence est LicenseIncluded" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Managed Instance link replicates SalesDb from SQL Server 2019 in near real time, the replica is readable for the reports, and you can fail over to it manually, without failback, which needs SQL Server 2022 or later. Because the replica runs a reporting workload, the licensing cost is minimized by applying Azure Hybrid Benefit with the unused licenses: license type BasePrice.
        fr: |
          Le lien Managed Instance réplique SalesDb depuis SQL Server 2019 quasiment en temps réel, le réplica est lisible pour les rapports, et vous pouvez y basculer manuellement, sans restauration automatique, qui exige SQL Server 2022 ou ultérieur. Comme le réplica exécute une charge de reporting, le coût des licences est réduit au minimum en appliquant Azure Hybrid Benefit avec les licences inutilisées : type de licence BasePrice.
      options:
        a: { en: "The hybrid failover benefit applies only to passive, disaster recovery only instances that run no workload; the daily reports are a workload.", fr: "L'avantage de basculement hybride s'applique seulement aux instances passives, réservées à la reprise d'activité et sans charge de travail ; les rapports quotidiens sont une charge de travail." }
        c: { en: "A virtual machine is infrastructure as a service, not PaaS, and the free DR license covers passive replicas, not a reporting replica.", fr: "Une machine virtuelle relève de l'infrastructure as a service, pas du PaaS, et la licence DR gratuite couvre des réplicas passifs, pas un réplica de reporting." }
        d: { en: "LicenseIncluded pays for SQL Server licenses in the price of the instance, although unused licenses with Software Assurance are available.", fr: "LicenseIncluded paie les licences SQL Server dans le prix de l'instance, alors que des licences inutilisées avec Software Assurance sont disponibles." }
    references:
      - title: Overview of the Managed Instance link
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
