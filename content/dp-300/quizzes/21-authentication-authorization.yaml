chapter: 21-authentication-authorization
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A database administrator at Contoso uses SQL Server Management Studio on a laptop that isn't joined to any domain. Her account is a cloud-only Microsoft Entra account, and Conditional Access requires multifactor authentication for it.

        She needs to connect to an Azure SQL database with this account. Which authentication option should she select?
      fr: |
        Une administratrice de bases de données de Contoso utilise SQL Server Management Studio sur un ordinateur portable qui n'est joint à aucun domaine. Son compte est un compte Microsoft Entra cloud uniquement, et l'accès conditionnel lui impose l'authentification multifacteur.

        Elle doit se connecter à une base de données Azure SQL avec ce compte. Quelle option d'authentification doit-elle sélectionner ?
    body:
      options:
        - { id: a, text: Microsoft Entra Password }
        - { id: b, text: Microsoft Entra Integrated }
        - { id: c, text: Windows Authentication }
        - { id: d, text: Microsoft Entra MFA }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Microsoft Entra MFA (Universal with MFA) is the interactive method: it opens the Microsoft Entra sign-in dialog, so the account can complete the multifactor authentication that Conditional Access requires.
        fr: |
          Microsoft Entra MFA (Universal avec MFA) est la méthode interactive : elle ouvre la boîte de dialogue de connexion Microsoft Entra, ce qui permet au compte d'effectuer l'authentification multifacteur exigée par l'accès conditionnel.
      options:
        a: { en: "Microsoft Entra Password sends a user name and a password without an interactive prompt, so it can't satisfy an MFA requirement.", fr: "Microsoft Entra Password envoie un nom d'utilisateur et un mot de passe sans invite interactive ; il ne peut donc pas satisfaire une exigence de MFA." }
        b: { en: "Microsoft Entra Integrated relies on the Windows session of a domain-joined client with a hybrid identity; the laptop isn't joined and the account is cloud-only.", fr: "Microsoft Entra Integrated s'appuie sur la session Windows d'un client joint à un domaine avec une identité hybride ; l'ordinateur n'est pas joint et le compte est cloud uniquement." }
        c: { en: "Azure SQL Database doesn't accept Windows authentication with AD DS accounts; it uses SQL or Microsoft Entra authentication.", fr: "Azure SQL Database n'accepte pas l'authentification Windows avec des comptes AD DS ; il utilise l'authentification SQL ou Microsoft Entra." }
    references:
      - title: Microsoft Entra authentication for Azure SQL
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-overview

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-21-02
    objective: "2.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Wingtip has an Azure SQL Database logical server named **sql-wingtip**. A monitoring login named **mon_login** exists in the master database.

        You need to add mon_login to the **##MS_ServerStateReader##** fixed server role. Which principal can run the statement that adds the member?
      fr: |
        Wingtip dispose d'un serveur logique Azure SQL Database nommé **sql-wingtip**. Une connexion de supervision nommée **mon_login** existe dans la base de données master.

        Vous devez ajouter mon_login au rôle serveur fixe **##MS_ServerStateReader##**. Quel principal peut exécuter l'instruction qui ajoute le membre ?
    body:
      options:
        - { id: a, text: { en: "A login that is a member of ##MS_LoginManager##", fr: "Une connexion membre de ##MS_LoginManager##" } }
        - { id: b, text: { en: "The server admin login of sql-wingtip", fr: "La connexion d'administrateur du serveur sql-wingtip" } }
        - { id: c, text: { en: "A login that is a member of ##MS_DatabaseManager##", fr: "Une connexion membre de ##MS_DatabaseManager##" } }
        - { id: d, text: { en: "A user of master that is a member of loginmanager", fr: "Un utilisateur de master membre de loginmanager" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure SQL Database has no sysadmin role: the server admin and the Microsoft Entra admin are the only full administrators of the logical server, and they are the principals that add logins to the fixed server roles or remove them. A member of a fixed server role can only add other logins to that same role, and none of the other options is a member of ##MS_ServerStateReader##.
        fr: |
          Azure SQL Database n'a pas de rôle sysadmin : l'administrateur du serveur et l'administrateur Microsoft Entra sont les seuls administrateurs complets du serveur logique, et ce sont eux qui ajoutent des connexions aux rôles serveur fixes ou les en retirent. Un membre d'un rôle serveur fixe peut seulement ajouter d'autres connexions à ce même rôle, et aucune des autres options n'est membre de ##MS_ServerStateReader##.
      options:
        a: { en: "##MS_LoginManager## lets its members create and drop logins, and add logins to ##MS_LoginManager## only, not to other server roles.", fr: "##MS_LoginManager## permet à ses membres de créer et de supprimer des connexions, et d'ajouter des connexions à ##MS_LoginManager## uniquement, pas aux autres rôles serveur." }
        c: { en: "##MS_DatabaseManager## lets its members create and drop databases; it gives no control over the other server roles.", fr: "##MS_DatabaseManager## permet à ses membres de créer et de supprimer des bases ; il ne donne aucun contrôle sur les autres rôles serveur." }
        d: { en: "loginmanager is a database role of master that allows creating logins; it can't add members to server roles.", fr: "loginmanager est un rôle de base de données de master qui permet de créer des connexions ; il ne peut pas ajouter de membres aux rôles serveur." }
    references:
      - title: Azure SQL Database server roles for permission management
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/security-server-roles

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has an Azure virtual machine named **VM1** that runs SQL Server 2022 in SQL Server and Windows Authentication mode. VM1 is joined to the AD DS domain fabrikam.local. Fabrikam also has an Azure SQL managed instance named **MI1** that was deployed with a SQL admin login. The application team asks you which sign-in options each server supports before it moves its services.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'une machine virtuelle Azure nommée **VM1** qui exécute SQL Server 2022 en mode d'authentification SQL Server et Windows. VM1 est jointe au domaine AD DS fabrikam.local. Fabrikam dispose aussi d'une instance managée Azure SQL nommée **MI1**, déployée avec une connexion d'administrateur SQL. L'équipe applicative vous demande quelles options de connexion chaque serveur prend en charge avant de déplacer ses services.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "On VM1, you can turn off Windows authentication so that only SQL logins can connect.", fr: "Sur VM1, vous pouvez désactiver l'authentification Windows pour que seules les connexions SQL puissent se connecter." } }
        - { id: s2, text: { en: "On MI1, you can run CREATE LOGIN [FABRIKAM\\svc-app] FROM WINDOWS for an account of the fabrikam.local domain.", fr: "Sur MI1, vous pouvez exécuter CREATE LOGIN [FABRIKAM\\svc-app] FROM WINDOWS pour un compte du domaine fabrikam.local." } }
        - { id: s3, text: { en: "On MI1, the SQL admin login created during deployment can create SQL logins with CREATE LOGIN ... WITH PASSWORD.", fr: "Sur MI1, la connexion d'administrateur SQL créée au déploiement peut créer des connexions SQL avec CREATE LOGIN ... WITH PASSWORD." } }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          SQL Server offers two authentication modes, Windows Authentication mode and mixed mode, and Windows authentication is enabled in both. SQL Managed Instance can't join an AD DS domain, so Windows logins created FROM WINDOWS aren't supported; Windows users reach it through Windows authentication for Microsoft Entra principals instead. SQL authentication is available on a managed instance, and the SQL admin created at deployment can create SQL logins.
        fr: |
          SQL Server propose deux modes d'authentification, le mode Authentification Windows et le mode mixte, et l'authentification Windows est activée dans les deux. SQL Managed Instance ne peut pas rejoindre un domaine AD DS : les connexions Windows créées FROM WINDOWS ne sont donc pas prises en charge, et les utilisateurs Windows y accèdent plutôt par l'authentification Windows pour les principaux Microsoft Entra. L'authentification SQL est disponible sur une instance managée, et l'administrateur SQL créé au déploiement peut créer des connexions SQL.
      options:
        s1: { en: "There is no SQL-only mode: Windows authentication stays enabled in mixed mode.", fr: "Il n'existe pas de mode SQL uniquement : l'authentification Windows reste activée en mode mixte." }
        s2: { en: "Windows logins created FROM WINDOWS aren't supported on SQL Managed Instance.", fr: "Les connexions Windows créées FROM WINDOWS ne sont pas prises en charge sur SQL Managed Instance." }
    references:
      - title: Change server authentication mode
        url: https://learn.microsoft.com/en-us/sql/database-engine/configure-windows/change-server-authentication-mode
      - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-21-04
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You manage an Azure SQL database named **DB1** with SQL Server Management Studio. A database user named **perf_analyst** must read the dynamic management views of DB1, which requires the VIEW DATABASE STATE permission on the database. perf_analyst must not get any other permission.

        You must make the change in the graphical interface. Where should you grant the permission?
      fr: |
        Vous gérez une base de données Azure SQL nommée **DB1** avec SQL Server Management Studio. Un utilisateur de base de données nommé **perf_analyst** doit lire les vues de gestion dynamique de DB1, ce qui exige l'autorisation VIEW DATABASE STATE sur la base. perf_analyst ne doit obtenir aucune autre autorisation.

        Vous devez effectuer la modification dans l'interface graphique. Où devez-vous accorder l'autorisation ?
    body:
      options:
        - { id: a, text: { en: "On the Membership page of the properties of perf_analyst", fr: "Sur la page Membership des propriétés de perf_analyst" } }
        - { id: b, text: { en: "On the Access control (IAM) page of DB1 in the Azure portal", fr: "Sur la page Contrôle d'accès (IAM) de DB1 dans le portail Azure" } }
        - { id: c, text: { en: "On the Permissions page of the properties of DB1", fr: "Sur la page Permissions des propriétés de DB1" } }
        - { id: d, text: { en: "On the Permissions page of the properties of a table in DB1", fr: "Sur la page Permissions des propriétés d'une table de DB1" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Database-level permissions are granted on the Permissions page of the database properties in SSMS: you select the user, then select Grant for the permission. The Script button of the dialog box shows the equivalent GRANT statement.
        fr: |
          Les autorisations au niveau de la base se donnent sur la page Permissions des propriétés de la base dans SSMS : vous sélectionnez l'utilisateur, puis Grant pour l'autorisation. Le bouton Script de la boîte de dialogue affiche l'instruction GRANT équivalente.
      options:
        a: { en: "The Membership page adds the user to database roles; no fixed role grants only VIEW DATABASE STATE, and db_owner would grant far more.", fr: "La page Membership ajoute l'utilisateur à des rôles de base de données ; aucun rôle fixe n'accorde uniquement VIEW DATABASE STATE, et db_owner accorderait bien plus." }
        b: { en: "Access control (IAM) assigns Azure roles on the resource; it doesn't grant permissions inside the database engine.", fr: "Le Contrôle d'accès (IAM) attribue des rôles Azure sur la ressource ; il n'accorde pas d'autorisations dans le moteur de base de données." }
        d: { en: "A table's Permissions page grants permissions on that object; VIEW DATABASE STATE is a permission on the database.", fr: "La page Permissions d'une table accorde des autorisations sur cet objet ; VIEW DATABASE STATE est une autorisation sur la base de données." }
    references:
      - title: Permissions or Securables Page
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/permissions-or-securables-page

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-21-05
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has an Azure SQL database named **SalesDb** on the logical server **sql-adatum**. A Microsoft Entra group is the Microsoft Entra admin of the server. A team lead, **lea@adatum.com**, has a contained database user in SalesDb that was created FROM EXTERNAL PROVIDER.

        Lea must create database users in SalesDb for the Microsoft Entra users and groups of her department. She must not read data, change objects or manage the server. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Adatum dispose d'une base de données Azure SQL nommée **SalesDb** sur le serveur logique **sql-adatum**. Un groupe Microsoft Entra est l'administrateur Microsoft Entra du serveur. Une responsable d'équipe, **lea@adatum.com**, a un utilisateur de base de données autonome dans SalesDb, créé FROM EXTERNAL PROVIDER.

        Lea doit créer dans SalesDb des utilisateurs de base de données pour les utilisateurs et les groupes Microsoft Entra de son service. Elle ne doit ni lire les données, ni modifier les objets, ni gérer le serveur. La solution doit respecter le principe du privilège minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add the database user of Lea to the db_securityadmin role.", fr: "Ajouter l'utilisateur de base de données de Lea au rôle db_securityadmin." } }
        - { id: b, text: { en: "Create a login for Lea in master, and add it to ##MS_LoginManager##.", fr: "Créer une connexion pour Lea dans master, puis l'ajouter à ##MS_LoginManager##." } }
        - { id: c, text: { en: "Grant the ALTER ANY USER permission in SalesDb to the user of Lea.", fr: "Accorder l'autorisation ALTER ANY USER dans SalesDb à l'utilisateur de Lea." } }
        - { id: d, text: { en: "Add the database user of Lea to the db_owner role.", fr: "Ajouter l'utilisateur de base de données de Lea au rôle db_owner." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          To create a database user from a Microsoft Entra identity, you must connect with a Microsoft Entra identity that has at least the ALTER ANY USER permission in the database. Lea already signs in with Microsoft Entra ID, so ALTER ANY USER in SalesDb is all she needs; the users she creates receive only CONNECT.
        fr: |
          Pour créer un utilisateur de base de données à partir d'une identité Microsoft Entra, vous devez vous connecter avec une identité Microsoft Entra qui dispose au moins de l'autorisation ALTER ANY USER dans la base. Lea se connecte déjà avec Microsoft Entra ID : ALTER ANY USER dans SalesDb est donc tout ce qu'il lui faut ; les utilisateurs qu'elle crée ne reçoivent que CONNECT.
      options:
        a: { en: "db_securityadmin manages the membership of custom roles and permissions; it doesn't hold ALTER ANY USER to create users.", fr: "db_securityadmin gère l'appartenance aux rôles personnalisés et les autorisations ; il ne détient pas ALTER ANY USER pour créer des utilisateurs." }
        b: { en: "##MS_LoginManager## creates logins, which are server principals in master; it gives no right to create users in SalesDb.", fr: "##MS_LoginManager## crée des connexions, qui sont des principaux de serveur dans master ; il ne donne aucun droit de créer des utilisateurs dans SalesDb." }
        d: { en: "db_owner can create users, but it can also read and change all data and objects: it breaks least privilege.", fr: "db_owner peut créer des utilisateurs, mais il peut aussi lire et modifier toutes les données et tous les objets : il enfreint le privilège minimum." }
    references:
      - title: Configure and manage Microsoft Entra authentication with Azure SQL
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-21-06
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind has an Azure SQL Database logical server named **sql-northwind** that hosts the databases DB1, DB2 and DB3. You created the following principals:

        | Principal | Created with | Where |
        | --- | --- | --- |
        | Login for the Microsoft Entra group **Finance Team** | CREATE LOGIN ... FROM EXTERNAL PROVIDER | master |
        | Users for the group login | CREATE USER ... FROM LOGIN | DB1 |
        | Login for the Microsoft Entra user **svc-etl@northwind.com** | CREATE LOGIN ... FROM EXTERNAL PROVIDER | master |
        | Users for the svc-etl login | CREATE USER ... FROM LOGIN | DB1, DB2 |
        | User for the Microsoft Entra user **ana@northwind.com** | CREATE USER ... FROM EXTERNAL PROVIDER | DB3 |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'un serveur logique Azure SQL Database nommé **sql-northwind** qui héberge les bases de données DB1, DB2 et DB3. Vous avez créé les principaux suivants :

        | Principal | Créé avec | Emplacement |
        | --- | --- | --- |
        | Connexion pour le groupe Microsoft Entra **Finance Team** | CREATE LOGIN ... FROM EXTERNAL PROVIDER | master |
        | Utilisateurs pour la connexion du groupe | CREATE USER ... FROM LOGIN | DB1 |
        | Connexion pour l'utilisateur Microsoft Entra **svc-etl@northwind.com** | CREATE LOGIN ... FROM EXTERNAL PROVIDER | master |
        | Utilisateurs pour la connexion svc-etl | CREATE USER ... FROM LOGIN | DB1, DB2 |
        | Utilisateur pour l'utilisateur Microsoft Entra **ana@northwind.com** | CREATE USER ... FROM EXTERNAL PROVIDER | DB3 |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "After you run ALTER LOGIN [svc-etl@northwind.com] DISABLE in master and the authentication caches are cleared, svc-etl can't open new connections to DB1 or DB2.", fr: "Après l'exécution de ALTER LOGIN [svc-etl@northwind.com] DISABLE dans master et le vidage des caches d'authentification, svc-etl ne peut plus ouvrir de nouvelles connexions ni à DB1 ni à DB2." } }
        - { id: s2, text: { en: "Running ALTER LOGIN [Finance Team] DISABLE in master blocks the access of every member of the group to DB1.", fr: "L'exécution de ALTER LOGIN [Finance Team] DISABLE dans master bloque l'accès de tous les membres du groupe à DB1." } }
        - { id: s3, text: { en: "To block ana@northwind.com in DB3 from a central place, you can run ALTER LOGIN [ana@northwind.com] DISABLE in master.", fr: "Pour bloquer ana@northwind.com dans DB3 depuis un point central, vous pouvez exécuter ALTER LOGIN [ana@northwind.com] DISABLE dans master." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Disabling a Microsoft Entra login blocks the login and every database user created FROM LOGIN for it, in all databases, which is why logins give a central switch; the change applies to new connections once the authentication caches are cleared. Disabling isn't supported for a Microsoft Entra group login. A user created FROM EXTERNAL PROVIDER is a contained user that isn't associated with any login, so ALTER LOGIN can't block it.
        fr: |
          Désactiver une connexion Microsoft Entra bloque la connexion et tous les utilisateurs de base créés FROM LOGIN pour elle, dans toutes les bases ; c'est pourquoi les connexions offrent un interrupteur central, et la modification s'applique aux nouvelles connexions une fois les caches d'authentification vidés. La désactivation n'est pas prise en charge pour une connexion de groupe Microsoft Entra. Un utilisateur créé FROM EXTERNAL PROVIDER est un utilisateur autonome associé à aucune connexion : ALTER LOGIN ne peut donc pas le bloquer.
      options:
        s2: { en: "ALTER LOGIN ... DISABLE isn't supported for Microsoft Entra group logins; drop the group user or deny CONNECT instead.", fr: "ALTER LOGIN ... DISABLE n'est pas pris en charge pour les connexions de groupes Microsoft Entra ; supprimez plutôt l'utilisateur du groupe ou refusez CONNECT." }
        s3: { en: "ana has no login in master: her contained user is blocked in DB3 itself, for example with DENY CONNECT or by dropping the user.", fr: "ana n'a aucune connexion dans master : son utilisateur autonome se bloque dans DB3 même, par exemple avec DENY CONNECT ou en supprimant l'utilisateur." }
    references:
      - title: Microsoft Entra server principals - Azure SQL
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-logins

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-21-07
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has an Azure SQL Database logical server named **sql-litware** that hosts 12 databases. A Microsoft Entra group is the Microsoft Entra admin. A batch application connects to the databases with a SQL login named **batch_login**, which has a user in each database.

        Since Monday morning, every connection of batch_login to any database fails with error 18456, "Login failed for user 'batch_login'". The password hasn't changed. Microsoft Entra users still connect to all the databases from the same network.

        Which two changes made on Monday could cause this error?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un serveur logique Azure SQL Database nommé **sql-litware** qui héberge 12 bases de données. Un groupe Microsoft Entra est l'administrateur Microsoft Entra. Une application de traitement par lots se connecte aux bases avec une connexion SQL nommée **batch_login**, qui a un utilisateur dans chaque base.

        Depuis lundi matin, chaque connexion de batch_login à n'importe quelle base échoue avec l'erreur 18456, « Login failed for user 'batch_login' ». Le mot de passe n'a pas changé. Les utilisateurs Microsoft Entra se connectent toujours à toutes les bases depuis le même réseau.

        Quelles sont les deux modifications faites lundi qui pourraient provoquer cette erreur ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Microsoft Entra-only authentication was enabled on sql-litware.", fr: "L'authentification Microsoft Entra uniquement a été activée sur sql-litware." } }
        - { id: b, text: { en: "The server-level IP firewall rule for the application servers was deleted.", fr: "La règle de pare-feu IP au niveau du serveur pour les serveurs d'application a été supprimée." } }
        - { id: c, text: { en: "ALTER LOGIN batch_login DISABLE was run in master.", fr: "ALTER LOGIN batch_login DISABLE a été exécuté dans master." } }
        - { id: d, text: { en: "DENY SELECT ON SCHEMA::dbo was granted to the users of batch_login.", fr: "DENY SELECT ON SCHEMA::dbo a été accordé aux utilisateurs de batch_login." } }
        - { id: e, text: { en: "The Microsoft Entra admin of sql-litware was removed.", fr: "L'administrateur Microsoft Entra de sql-litware a été supprimé." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Error 18456 means that authentication failed. Microsoft Entra-only authentication rejects every SQL authentication connection on the server without deleting the logins, and a disabled login can't sign in to any database. Both leave Microsoft Entra users unaffected.
        fr: |
          L'erreur 18456 signifie que l'authentification a échoué. L'authentification Microsoft Entra uniquement rejette toutes les connexions par authentification SQL sur le serveur sans supprimer les connexions, et une connexion désactivée ne peut se connecter à aucune base. Les deux laissent les utilisateurs Microsoft Entra intacts.
      options:
        b: { en: "A missing firewall rule returns error 40615 before authentication, and the Microsoft Entra users on the same network would fail too.", fr: "Une règle de pare-feu manquante renvoie l'erreur 40615 avant l'authentification, et les utilisateurs Microsoft Entra du même réseau échoueraient aussi." }
        d: { en: "A DENY on objects acts after a successful sign-in and returns error 229 on the queries, not 18456.", fr: "Un DENY sur des objets agit après une connexion réussie et renvoie l'erreur 229 sur les requêtes, pas 18456." }
        e: { en: "Removing the Microsoft Entra admin stops Microsoft Entra connections, which still work, and doesn't affect SQL logins.", fr: "Supprimer l'administrateur Microsoft Entra arrête les connexions Microsoft Entra, qui fonctionnent toujours, et n'affecte pas les connexions SQL." }
    references:
      - title: Microsoft Entra-only authentication - Azure SQL
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-21-08
    objective: "2.1.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has an Azure SQL database named **HrDb** that contains the custom database roles **hr_read** and **hr_write**. A security officer connects to HrDb as a database user named **sec_officer**.

        sec_officer must create contained database users that authenticate with a password for the contractors, and add them to hr_read or hr_write or remove them. sec_officer must not read or modify the data, and must not create or alter tables. The solution must follow the principle of least privilege.

        To which two fixed database roles should you add sec_officer? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'une base de données Azure SQL nommée **HrDb** qui contient les rôles de base de données personnalisés **hr_read** et **hr_write**. Un responsable de la sécurité se connecte à HrDb en tant qu'utilisateur de base de données nommé **sec_officer**.

        sec_officer doit créer des utilisateurs de base de données autonomes qui s'authentifient avec un mot de passe pour les prestataires, et les ajouter à hr_read ou hr_write ou les en retirer. sec_officer ne doit ni lire ni modifier les données, ni créer ou modifier des tables. La solution doit respecter le principe du privilège minimum.

        À quels deux rôles de base de données fixes devez-vous ajouter sec_officer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: db_owner }
        - { id: b, text: db_accessadmin }
        - { id: c, text: db_ddladmin }
        - { id: d, text: db_securityadmin }
        - { id: e, text: db_datareader }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Creating database users requires ALTER ANY USER, which db_accessadmin holds. Changing the membership of custom roles is the job of db_securityadmin. Together they cover the task without access to the data or to the schema of the tables, unlike db_owner.
        fr: |
          Créer des utilisateurs de base de données exige ALTER ANY USER, que détient db_accessadmin. Modifier l'appartenance aux rôles personnalisés est le rôle de db_securityadmin. Ensemble, ils couvrent la tâche sans accès aux données ni au schéma des tables, contrairement à db_owner.
      options:
        a: { en: "db_owner can do everything in the database, including reading data and altering tables: it breaks least privilege.", fr: "db_owner peut tout faire dans la base, y compris lire les données et modifier les tables : il enfreint le privilège minimum." }
        c: { en: "db_ddladmin creates and alters objects such as tables, which sec_officer must not do, and doesn't manage users or role membership.", fr: "db_ddladmin crée et modifie des objets comme les tables, ce que sec_officer ne doit pas faire, et ne gère ni les utilisateurs ni l'appartenance aux rôles." }
        e: { en: "db_datareader reads all the tables, which sec_officer must not do, and gives no permission on users or roles.", fr: "db_datareader lit toutes les tables, ce que sec_officer ne doit pas faire, et ne donne aucune autorisation sur les utilisateurs ou les rôles." }
    references:
      - title: Database-level roles
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/database-level-roles

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-21-09
    objective: "2.1.8"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin has an Azure SQL managed instance named **MI1**. MI1 has a Microsoft Entra admin, and its managed identity holds the Directory Readers role. A release manager, **ines@tailspin.com**, must sign in to MI1 with her Microsoft Entra account and meet the following requirements:

        - Create new databases on MI1 for each release.
        - Read the dynamic management views that show the sessions and waits of the whole instance.
        - Have no right to end sessions, change server configuration options or manage logins.

        You connect to MI1 as the Microsoft Entra admin. You must use one fixed server role and one server-level permission. The solution must follow the principle of least privilege.

        How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'une instance managée Azure SQL nommée **MI1**. MI1 a un administrateur Microsoft Entra, et son identité managée détient le rôle Directory Readers. Une responsable des mises en production, **ines@tailspin.com**, doit se connecter à MI1 avec son compte Microsoft Entra et répondre aux exigences suivantes :

        - Créer de nouvelles bases de données sur MI1 pour chaque mise en production.
        - Lire les vues de gestion dynamique qui montrent les sessions et les attentes de toute l'instance.
        - N'avoir aucun droit de mettre fin à des sessions, de modifier les options de configuration du serveur ni de gérer des connexions.

        Vous vous connectez à MI1 en tant qu'administrateur Microsoft Entra. Vous devez utiliser un rôle serveur fixe et une autorisation de niveau serveur. La solution doit respecter le principe du privilège minimum.

        Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        CREATE LOGIN [ines@tailspin.com] [[src]];

        ALTER SERVER ROLE [[role]] ADD MEMBER [ines@tailspin.com];

        GRANT [[perm]] TO [ines@tailspin.com];
      slots:
        - id: src
          options:
            - { id: s_windows, text: FROM WINDOWS }
            - { id: s_ext, text: FROM EXTERNAL PROVIDER }
            - { id: s_pwd, text: "WITH PASSWORD = N'Rel3ase!Mgr#2026'" }
        - id: role
          options:
            - { id: r_sysadmin, text: sysadmin }
            - { id: r_process, text: processadmin }
            - { id: r_dbcreator, text: dbcreator }
            - { id: r_server, text: serveradmin }
        - id: perm
          options:
            - { id: p_control, text: CONTROL SERVER }
            - { id: p_alter, text: ALTER SERVER STATE }
            - { id: p_dbstate, text: VIEW DATABASE STATE }
            - { id: p_view, text: VIEW SERVER STATE }
    answer:
      values: { src: s_ext, role: r_dbcreator, perm: p_view }
    explanation:
      correct:
        en: |
          A login for a Microsoft Entra user on a managed instance is created FROM EXTERNAL PROVIDER. Among the fixed server roles, dbcreator is the one that lets its members create databases. VIEW SERVER STATE, granted at the server level, gives read access to the instance-wide DMVs of sessions and waits without the right to change anything.
        fr: |
          Une connexion pour un utilisateur Microsoft Entra sur une instance managée se crée FROM EXTERNAL PROVIDER. Parmi les rôles serveur fixes, dbcreator est celui qui permet à ses membres de créer des bases de données. VIEW SERVER STATE, accordé au niveau du serveur, donne un accès en lecture aux DMV de sessions et d'attentes de toute l'instance sans droit de modification.
      options:
        s_windows: { en: "SQL Managed Instance doesn't support Windows logins created FROM WINDOWS.", fr: "SQL Managed Instance ne prend pas en charge les connexions Windows créées FROM WINDOWS." }
        s_pwd: { en: "WITH PASSWORD creates a SQL login that happens to have this name, not a login for the Microsoft Entra account.", fr: "WITH PASSWORD crée une connexion SQL qui porte ce nom, pas une connexion pour le compte Microsoft Entra." }
        r_sysadmin: { en: "sysadmin can perform any activity on the instance, including managing logins.", fr: "sysadmin peut effectuer n'importe quelle activité sur l'instance, y compris gérer les connexions." }
        r_process: { en: "processadmin lets its members end processes, which is forbidden, and doesn't allow creating databases.", fr: "processadmin permet à ses membres de mettre fin à des processus, ce qui est interdit, et ne permet pas de créer des bases." }
        r_server: { en: "serveradmin changes server-wide configuration options and can shut down the server, and doesn't create databases.", fr: "serveradmin modifie les options de configuration du serveur et peut l'arrêter, et ne crée pas de bases." }
        p_control: { en: "CONTROL SERVER should be considered identical to sysadmin.", fr: "CONTROL SERVER doit être considéré comme identique à sysadmin." }
        p_alter: { en: "ALTER SERVER STATE allows management operations such as DBCC FREEPROCCACHE, beyond the read access required.", fr: "ALTER SERVER STATE permet des opérations de gestion comme DBCC FREEPROCCACHE, au-delà de la lecture demandée." }
        p_dbstate: { en: "VIEW DATABASE STATE is a database permission: it isn't granted at the server level and covers one database only.", fr: "VIEW DATABASE STATE est une autorisation de base de données : elle ne s'accorde pas au niveau du serveur et ne couvre qu'une base." }
    references:
      - title: Server-level roles
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/authentication-access/server-level-roles
      - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-21-10
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure SQL database named **OrdersDb**. The tables are in the **Sales** schema, owned by dbo. A developer created the **Api** schema with AUTHORIZATION set to his database user **api_dev**, and then created the stored procedures of the application in Api. The procedures use static Transact-SQL only.

        The application connects as **app_user**, which has EXECUTE on SCHEMA::Api and no permission on Sales. When the application runs Api.usp_AddOrder, it receives error 229: "The INSERT permission was denied on the object 'Orders'".

        app_user must keep no direct permission on the Sales tables. The solution must follow the principle of least privilege. What should you do?
      fr: |
        Fabrikam dispose d'une base de données Azure SQL nommée **OrdersDb**. Les tables sont dans le schéma **Sales**, dont dbo est propriétaire. Un développeur a créé le schéma **Api** avec AUTHORIZATION défini sur son utilisateur de base de données **api_dev**, puis a créé les procédures stockées de l'application dans Api. Les procédures utilisent uniquement du Transact-SQL statique.

        L'application se connecte en tant que **app_user**, qui a EXECUTE sur SCHEMA::Api et aucune autorisation sur Sales. Quand l'application exécute Api.usp_AddOrder, elle reçoit l'erreur 229 : « The INSERT permission was denied on the object 'Orders' ».

        app_user ne doit conserver aucune autorisation directe sur les tables de Sales. La solution doit respecter le principe du privilège minimum. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Grant INSERT on Sales.Orders to api_dev, the owner of the Api schema.", fr: "Accorder INSERT sur Sales.Orders à api_dev, le propriétaire du schéma Api." } }
        - { id: b, text: { en: "Grant EXECUTE on SCHEMA::Api to app_user again, with the GRANT OPTION.", fr: "Accorder de nouveau EXECUTE sur SCHEMA::Api à app_user, avec GRANT OPTION." } }
        - { id: c, text: { en: "Add app_user to db_datawriter, and deny SELECT on SCHEMA::Sales to it.", fr: "Ajouter app_user à db_datawriter, puis lui refuser SELECT sur SCHEMA::Sales." } }
        - { id: d, text: { en: "Change the owner of the Api schema to dbo, the owner of the Sales schema.", fr: "Changer le propriétaire du schéma Api en dbo, le propriétaire du schéma Sales." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A procedure reaches tables without permission checks on the caller only when the procedure and the tables have the same owner (ownership chaining). The procedures belong to api_dev and the tables to dbo, so the chain is broken and the engine checks the INSERT permission of app_user. Making dbo the owner of the Api schema restores the chain, and EXECUTE stays the only permission of app_user.
        fr: |
          Une procédure atteint des tables sans vérification des autorisations de l'appelant uniquement quand la procédure et les tables ont le même propriétaire (chaînage des propriétés). Les procédures appartiennent à api_dev et les tables à dbo : la chaîne est rompue et le moteur vérifie l'autorisation INSERT d'app_user. Faire de dbo le propriétaire du schéma Api rétablit la chaîne, et EXECUTE reste la seule autorisation d'app_user.
      options:
        a: { en: "When the chain is broken, the engine checks the permissions of the caller, app_user, not those of the procedure owner.", fr: "Quand la chaîne est rompue, le moteur vérifie les autorisations de l'appelant, app_user, pas celles du propriétaire de la procédure." }
        b: { en: "app_user already has EXECUTE; the GRANT OPTION only lets it grant EXECUTE to others and doesn't change the check on Sales.Orders.", fr: "app_user a déjà EXECUTE ; GRANT OPTION lui permet seulement d'accorder EXECUTE à d'autres et ne change pas la vérification sur Sales.Orders." }
        c: { en: "db_datawriter gives app_user direct INSERT, UPDATE and DELETE on every table, which the requirement forbids.", fr: "db_datawriter donne à app_user des droits INSERT, UPDATE et DELETE directs sur toutes les tables, ce que l'exigence interdit." }
    references:
      - title: Authorization and Permissions in SQL Server
        url: https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/sql/authorization-and-permissions-in-sql-server
      - title: Describe database and object permissions
        url: https://learn.microsoft.com/en-us/training/modules/configure-database-authentication-authorization/5-describe-database-object-permissions
