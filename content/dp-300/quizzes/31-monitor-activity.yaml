chapter: 31-monitor-activity
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso runs an order-processing database named **OrdersDB** in Azure SQL Database. The workload is light most of the month and heavy during the month-end closing, and a batch job runs every night.

        You are preparing an operational performance baseline for OrdersDB. Over which period should you capture the baseline measurements?
      fr: |
        Contoso exploite une base de données de traitement des commandes nommée **OrdersDB** dans Azure SQL Database. La charge de travail est légère la plus grande partie du mois et forte pendant la clôture de fin de mois, et un traitement par lots s'exécute chaque nuit.

        Vous préparez une base de référence des performances opérationnelles pour OrdersDB. Sur quelle période devez-vous capturer les mesures de la base de référence ?
    body:
      options:
        - { id: a, text: { en: "One week in the middle of the month, when the workload is stable and no incident occurs", fr: "Une semaine en milieu de mois, quand la charge de travail est stable et qu'aucun incident ne se produit" } }
        - { id: b, text: { en: "Several weeks that include a month-end closing, the nightly batch windows and quiet hours", fr: "Plusieurs semaines qui incluent une clôture de fin de mois, les fenêtres de traitement nocturnes et des heures calmes" } }
        - { id: c, text: { en: "The month-end closing only, because the baseline must describe the highest load", fr: "La clôture de fin de mois uniquement, car la base de référence doit décrire la charge la plus forte" } }
        - { id: d, text: { en: "The hour that precedes each incident, read from sys.dm_db_resource_stats when it occurs", fr: "L'heure qui précède chaque incident, lue dans sys.dm_db_resource_stats au moment où il se produit" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A baseline describes normal behavior, so it must cover a representative period: peak and off-peak hours, month-end processing and batch windows. Later measurements are compared with it, and values far above or below the baseline point to what needs tuning.
        fr: |
          Une base de référence décrit le comportement normal : elle doit donc couvrir une période représentative, avec les heures de pointe et les heures creuses, les traitements de fin de mois et les fenêtres de traitement par lots. Les mesures suivantes lui sont comparées, et les valeurs très au-dessus ou très en dessous de la base de référence signalent ce qui doit être optimisé.
      options:
        a: { en: "A quiet week misses the month-end and nightly peaks, so a usual peak would later look like a regression.", fr: "Une semaine calme ne contient ni les pics de fin de mois ni ceux de la nuit : un pic habituel ressemblerait ensuite à une régression." }
        c: { en: "Without the off-peak periods, the baseline can't show what normal looks like the rest of the month.", fr: "Sans les périodes creuses, la base de référence ne peut pas montrer à quoi ressemble la normale le reste du mois." }
        d: { en: "A baseline is captured at regular intervals while no problem occurs; data taken only around incidents describes abnormal behavior.", fr: "Une base de référence se capture à intervalles réguliers, même sans problème ; des données prises seulement autour des incidents décrivent un comportement anormal." }
    references:
      - title: Establish a Performance Baseline - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/establish-a-performance-baseline

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-31-02
    objective: "3.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have an Azure SQL managed instance named **MI1**.

        You need to read the current value of the SQL Server counter **Page life expectancy** of MI1 by using Transact-SQL.

        Which object should you query?
      fr: |
        Vous disposez d'une instance managée Azure SQL nommée **MI1**.

        Vous devez lire la valeur actuelle du compteur SQL Server **Page life expectancy** de MI1 à l'aide de Transact-SQL.

        Quel objet devez-vous interroger ?
    body:
      options:
        - { id: a, text: "sys.dm_os_performance_counters" }
        - { id: b, text: "sys.dm_db_resource_stats" }
        - { id: c, text: "sys.dm_os_wait_stats" }
        - { id: d, text: "sys.server_resource_stats" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          `sys.dm_os_performance_counters` returns one row for each performance counter maintained by the server, such as the Buffer Manager counter Page life expectancy. It's available in SQL Server, Azure SQL Managed Instance and Azure SQL Database, and gives from Transact-SQL the counters that Performance Monitor shows on a server.
        fr: |
          `sys.dm_os_performance_counters` renvoie une ligne pour chaque compteur de performances tenu par le serveur, comme le compteur Page life expectancy du gestionnaire de tampons. Elle est disponible dans SQL Server, Azure SQL Managed Instance et Azure SQL Database, et fournit en Transact-SQL les compteurs que l'Analyseur de performances affiche sur un serveur.
      options:
        b: { en: "sys.dm_db_resource_stats returns resource usage percentages (CPU, data I/O, log write) every 15 seconds, not SQL Server counters.", fr: "sys.dm_db_resource_stats renvoie des pourcentages d'utilisation des ressources (processeur, E/S de données, écriture du journal) toutes les 15 secondes, pas des compteurs SQL Server." }
        c: { en: "sys.dm_os_wait_stats returns cumulative wait statistics by wait type, not buffer manager counters.", fr: "sys.dm_os_wait_stats renvoie des statistiques d'attente cumulées par type d'attente, pas les compteurs du gestionnaire de tampons." }
        d: { en: "sys.server_resource_stats returns the CPU, I/O and storage usage of the managed instance over time, not individual SQL Server counters.", fr: "sys.server_resource_stats renvoie l'utilisation du processeur, des E/S et du stockage de l'instance managée dans le temps, pas des compteurs SQL Server individuels." }
    references:
      - title: sys.dm_os_performance_counters (Transact-SQL) - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-os-performance-counters-transact-sql

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-31-03
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an Azure SQL database named **LoadDB** in the General Purpose service tier. Every night, an ETL job inserts several million rows in large transactions. The job takes longer each week.

        During the job, most requests of LoadDB wait with the `WRITELOG` wait type.

        Which column of `sys.dm_db_resource_stats` do you expect to be close to 100 during the job?
      fr: |
        Vous disposez d'une base de données Azure SQL nommée **LoadDB** dans le niveau de service General Purpose. Chaque nuit, un travail ETL insère plusieurs millions de lignes dans de grosses transactions. Le travail dure plus longtemps chaque semaine.

        Pendant le travail, la plupart des requêtes de LoadDB attendent avec le type d'attente `WRITELOG`.

        Quelle colonne de `sys.dm_db_resource_stats` vous attendez-vous à voir proche de 100 pendant le travail ?
    body:
      options:
        - { id: a, text: "avg_cpu_percent" }
        - { id: b, text: "avg_data_io_percent" }
        - { id: c, text: "avg_log_write_percent" }
        - { id: d, text: "max_worker_percent" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `WRITELOG` is the wait for transaction log I/O. Large insert transactions generate log records faster than the log write throughput allowed by the compute size, so `avg_log_write_percent`, which is relative to that limit, approaches 100.
        fr: |
          `WRITELOG` est l'attente des E/S du journal des transactions. De grosses transactions d'insertion produisent des enregistrements de journal plus vite que le débit d'écriture du journal autorisé par la taille de calcul : `avg_log_write_percent`, relatif à cette limite, approche donc de 100.
      options:
        a: { en: "CPU pressure shows as SOS_SCHEDULER_YIELD waits, not as waits on log writes.", fr: "Une pression sur le processeur se traduit par des attentes SOS_SCHEDULER_YIELD, pas par des attentes sur les écritures du journal." }
        b: { en: "Data file reads show as PAGEIOLATCH_* waits; WRITELOG concerns the transaction log, not the data files.", fr: "Les lectures des fichiers de données se traduisent par des attentes PAGEIOLATCH_* ; WRITELOG concerne le journal des transactions, pas les fichiers de données." }
        d: { en: "A worker shortage, often caused by blocking, shows as LCK_M_* waits and error 10928, not as log write waits.", fr: "Un manque de workers, souvent dû à un blocage, se traduit par des attentes LCK_M_* et l'erreur 10928, pas par des attentes d'écriture du journal." }
    references:
      - title: Monitor Performance Using DMVs - Azure SQL Database & SQL database in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-31-04
    objective: "3.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an Azure virtual machine named **SQLVM1** that runs SQL Server 2022. A database administrator who is a member of the sysadmin fixed server role investigates an ongoing slowdown.

        From SQL Server Management Studio (SSMS), without writing any query, the administrator needs a live view of the processes on the instance, their resource waits, the I/O of each data file and the recent expensive queries.

        What should the administrator open?
      fr: |
        Vous disposez d'une machine virtuelle Azure nommée **SQLVM1** qui exécute SQL Server 2022. Un administrateur de base de données membre du rôle serveur fixe sysadmin analyse un ralentissement en cours.

        Depuis SQL Server Management Studio (SSMS), sans écrire de requête, l'administrateur a besoin d'une vue en direct des processus de l'instance, de leurs attentes de ressources, des E/S de chaque fichier de données et des requêtes coûteuses récentes.

        Qu'est-ce que l'administrateur doit ouvrir ?
    body:
      options:
        - { id: a, text: { en: "The Query Store reports of each database", fr: "Les rapports du Magasin des requêtes de chaque base de données" } }
        - { id: b, text: { en: "XEvent Profiler", fr: "XEvent Profiler" } }
        - { id: c, text: { en: "Query Performance Insight", fr: "Query Performance Insight" } }
        - { id: d, text: { en: "Activity Monitor", fr: "Activity Monitor" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Activity Monitor in SSMS has the Overview, Processes, Resource Waits, Data File I/O, Recent Expensive Queries and Active Expensive Queries panes. It runs its own queries against the instance and refreshes them, so the administrator gets a live view without writing any Transact-SQL.
        fr: |
          Activity Monitor dans SSMS comprend les volets Overview, Processes, Resource Waits, Data File I/O, Recent Expensive Queries et Active Expensive Queries. Il exécute ses propres requêtes sur l'instance et les actualise : l'administrateur obtient une vue en direct sans écrire de Transact-SQL.
      options:
        a: { en: "Query Store reports show the history of queries and plans per database, not the live processes and data file I/O of the instance.", fr: "Les rapports du Magasin des requêtes montrent l'historique des requêtes et des plans par base, pas les processus en direct ni les E/S des fichiers de données de l'instance." }
        b: { en: "XEvent Profiler streams a quick Extended Events trace of statements; it doesn't summarize waits or data file I/O.", fr: "XEvent Profiler diffuse une trace rapide d'événements étendus sur les instructions ; il ne résume ni les attentes ni les E/S des fichiers de données." }
        c: { en: "Query Performance Insight is a page of the Azure portal for Azure SQL Database; it doesn't monitor SQL Server on a virtual machine.", fr: "Query Performance Insight est une page du portail Azure pour Azure SQL Database ; il ne supervise pas SQL Server sur une machine virtuelle." }
    references:
      - title: Activity Monitor - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/performance-monitor/activity-monitor
      - title: Open Activity Monitor (SSMS) - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/performance-monitor/open-activity-monitor-sql-server-management-studio

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-31-05
    objective: "3.1.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam created a watcher named **wch-fabrikam** in October 2026 and started it. wch-fabrikam stores its data in a database of an Azure Data Explorer cluster. It connects to its 40 Azure SQL databases by using its system-assigned managed identity and Microsoft Entra authentication. Fabrikam has a second subscription in the same Microsoft Entra tenant.

        It is now late November 2026.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a créé un observateur nommé **wch-fabrikam** en octobre 2026 et l'a démarré. wch-fabrikam stocke ses données dans une base de données d'un cluster Azure Data Explorer. Il se connecte à ses 40 bases de données Azure SQL avec son identité managée affectée par le système et l'authentification Microsoft Entra. Fabrikam dispose d'un second abonnement dans le même locataire Microsoft Entra.

        Nous sommes fin novembre 2026.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "wch-fabrikam needs an Azure Key Vault that stores the credentials it uses to connect to its SQL targets.", fr: "wch-fabrikam a besoin d'un coffre Azure Key Vault qui stocke les informations d'identification qu'il utilise pour se connecter à ses cibles SQL." }
        - id: s2
          text: { en: "You can add an elastic pool of the second subscription as a new SQL target of wch-fabrikam.", fr: "Vous pouvez ajouter un pool élastique du second abonnement comme nouvelle cible SQL de wch-fabrikam." }
        - id: s3
          text: { en: "Performance analysts can query the data collected by wch-fabrikam with KQL in the Azure Data Explorer database.", fr: "Des analystes des performances peuvent interroger en KQL les données collectées par wch-fabrikam dans la base de données Azure Data Explorer." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          With Microsoft Entra authentication, the watcher connects with its managed identity and no password is stored; Key Vault is needed only for SQL authentication. Targets can come from any subscription of the tenant, but database watcher is a preview that is retiring: since November 9, 2026, you can't create watchers or edit existing ones, so no target can be added. The collected data stays in the data store you own, where you query it with KQL (or T-SQL).
        fr: |
          Avec l'authentification Microsoft Entra, l'observateur se connecte avec son identité managée et aucun mot de passe n'est stocké ; Key Vault n'est nécessaire que pour l'authentification SQL. Les cibles peuvent provenir de n'importe quel abonnement du locataire, mais l'observateur de base de données est une préversion en cours de mise hors service : depuis le 9 novembre 2026, il n'est plus possible de créer des observateurs ni de modifier ceux qui existent, donc aucune cible ne peut être ajoutée. Les données collectées restent dans le magasin de données qui vous appartient, où vous les interrogez en KQL (ou en T-SQL).
      options:
        s1: { en: "Key Vault stores credentials only for targets that use SQL authentication; the managed identity needs no stored secret.", fr: "Key Vault ne stocke des informations d'identification que pour les cibles qui utilisent l'authentification SQL ; l'identité managée n'a besoin d'aucun secret stocké." }
        s2: { en: "Cross-subscription targets are supported, but existing watchers can no longer be edited since November 9, 2026.", fr: "Les cibles d'un autre abonnement sont prises en charge, mais les observateurs existants ne peuvent plus être modifiés depuis le 9 novembre 2026." }
    references:
      - title: Monitor Azure SQL workloads with database watcher - Azure SQL Database & SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database-watcher-overview

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-31-06
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum has an Azure SQL database named **ReportsDB** in the General Purpose service tier with 4 vCores. Users report that reports are slow every afternoon. During these periods, `sys.dm_db_resource_stats` shows the following averages:

        | Column | Average |
        | --- | --- |
        | avg_cpu_percent | 34 |
        | avg_data_io_percent | 99 |
        | avg_log_write_percent | 7 |
        | max_worker_percent | 22 |

        The top wait type is `PAGEIOLATCH_SH`. Query Store shows that one report query accounts for 80 percent of the reads: its plan scans a table of 60 million rows to return about 500 rows. No blocking occurs.

        Which two actions can each resolve the issue? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'une base de données Azure SQL nommée **ReportsDB** dans le niveau de service General Purpose avec 4 vCores. Les utilisateurs signalent que les rapports sont lents chaque après-midi. Pendant ces périodes, `sys.dm_db_resource_stats` affiche les moyennes suivantes :

        | Colonne | Moyenne |
        | --- | --- |
        | avg_cpu_percent | 34 |
        | avg_data_io_percent | 99 |
        | avg_log_write_percent | 7 |
        | max_worker_percent | 22 |

        Le principal type d'attente est `PAGEIOLATCH_SH`. Le Magasin des requêtes montre qu'une requête de rapport représente 80 % des lectures : son plan analyse une table de 60 millions de lignes pour renvoyer environ 500 lignes. Aucun blocage ne se produit.

        Quelles sont les deux actions qui peuvent chacune résoudre le problème ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set the MAXDOP database scoped configuration of ReportsDB to 1.", fr: "Définir la configuration délimitée à la base de données MAXDOP de ReportsDB sur 1." } }
        - { id: b, text: { en: "Create a nonclustered index that supports the predicate of the report query.", fr: "Créer un index non cluster qui prend en charge le prédicat de la requête de rapport." } }
        - { id: c, text: { en: "Split the nightly data loads of ReportsDB into smaller transactions.", fr: "Découper les chargements de données nocturnes de ReportsDB en transactions plus petites." } }
        - { id: d, text: { en: "Turn on the READ_COMMITTED_SNAPSHOT database option of ReportsDB.", fr: "Activer l'option de base de données READ_COMMITTED_SNAPSHOT de ReportsDB." } }
        - { id: e, text: { en: "Scale ReportsDB to a General Purpose compute size with more vCores.", fr: "Faire passer ReportsDB à une taille de calcul General Purpose avec plus de vCores." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          `avg_data_io_percent` near 100 with `PAGEIOLATCH_SH` waits means that data file reads reach the I/O limit of the compute size, while CPU, log and workers have headroom. Tuning the query that consumes the I/O removes the cause: an index lets the plan seek the 500 rows instead of scanning 60 million. Moving to a larger compute size is the other documented answer: the data I/O limit and the memory that caches pages both grow with the number of vCores.
        fr: |
          `avg_data_io_percent` proche de 100 avec des attentes `PAGEIOLATCH_SH` signifie que les lectures des fichiers de données atteignent la limite d'E/S de la taille de calcul, alors que le processeur, le journal et les workers ont de la marge. Optimiser la requête qui consomme les E/S supprime la cause : un index permet au plan de rechercher les 500 lignes au lieu d'en analyser 60 millions. Passer à une taille de calcul supérieure est l'autre réponse documentée : la limite d'E/S de données et la mémoire qui met les pages en cache augmentent avec le nombre de vCores.
      options:
        a: { en: "MAXDOP limits parallelism; a serial scan still reads the same 60 million rows from the data files.", fr: "MAXDOP limite le parallélisme ; une analyse en série lit toujours les mêmes 60 millions de lignes dans les fichiers de données." }
        c: { en: "Smaller transactions relieve the log write limit, but avg_log_write_percent is only 7 and the slowdown happens in the afternoon.", fr: "Des transactions plus petites soulagent la limite d'écriture du journal, mais avg_log_write_percent n'est qu'à 7 et le ralentissement a lieu l'après-midi." }
        d: { en: "RCSI, already on by default in Azure SQL Database, stops readers from blocking writers; no blocking occurs here, and it doesn't reduce the pages read.", fr: "RCSI, déjà activé par défaut dans Azure SQL Database, empêche les lecteurs de bloquer les écrivains ; aucun blocage ne se produit ici, et il ne réduit pas les pages lues." }
    references:
      - title: Monitor Performance Using DMVs - Azure SQL Database & SQL database in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-31-07
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin has an Azure SQL database named **TicketsDB** in the Business Critical service tier. No Log Analytics workspace, diagnostic setting or action group exists in the subscription.

        The on-call database administrators must receive an email when TicketsDB records more than five deadlocks within one hour. The details of the deadlocks don't need to be kept. The solution must minimize cost.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'une base de données Azure SQL nommée **TicketsDB** dans le niveau de service Business Critical. Aucun espace de travail Log Analytics, aucun paramètre de diagnostic et aucun groupe d'actions n'existe dans l'abonnement.

        Les administrateurs de base de données d'astreinte doivent recevoir un e-mail quand TicketsDB enregistre plus de cinq interblocages en une heure. Le détail des interblocages n'a pas besoin d'être conservé. La solution doit réduire les coûts au minimum.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a diagnostic setting that sends the Deadlocks category of TicketsDB to a new Log Analytics workspace.", fr: "Créer un paramètre de diagnostic qui envoie la catégorie Deadlocks de TicketsDB vers un nouvel espace de travail Log Analytics." } }
        - { id: b, text: { en: "Create an action group that sends an email notification to the on-call database administrators.", fr: "Créer un groupe d'actions qui envoie une notification par e-mail aux administrateurs de base de données d'astreinte." } }
        - { id: c, text: { en: "Create a log search alert rule that counts the Deadlocks records of TicketsDB in the AzureDiagnostics table.", fr: "Créer une règle d'alerte de recherche dans les journaux qui compte les enregistrements Deadlocks de TicketsDB dans la table AzureDiagnostics." } }
        - { id: d, text: { en: "Create a metric alert rule on the Deadlocks metric of TicketsDB with the Total aggregation over one hour.", fr: "Créer une règle d'alerte de métrique sur la métrique Deadlocks de TicketsDB avec l'agrégation Total sur une heure." } }
        - { id: e, text: { en: "Create an Extended Events session on TicketsDB that sends xml_deadlock_report events to a ring_buffer target.", fr: "Créer une session d'événements étendus sur TicketsDB qui envoie les événements xml_deadlock_report vers une cible ring_buffer." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Deadlocks is a platform metric of Azure SQL Database (a count with the Total aggregation), collected without any configuration. A metric alert rule with a threshold greater than 5 over a one-hour lookback period detects the condition, and an action group sends the email. Nothing is ingested into Log Analytics, so the cost stays at the price of one metric alert rule.
        fr: |
          Deadlocks est une métrique de plateforme d'Azure SQL Database (un nombre avec l'agrégation Total), collectée sans aucune configuration. Une règle d'alerte de métrique avec un seuil supérieur à 5 sur une période d'analyse (lookback) d'une heure détecte la condition, et un groupe d'actions envoie l'e-mail. Rien n'est ingéré dans Log Analytics : le coût se limite au prix d'une règle d'alerte de métrique.
      options:
        a: { en: "The resource log would work with a log search alert, but workspace ingestion and the log alert cost more than a metric alert, and the details aren't needed.", fr: "Le journal de ressources fonctionnerait avec une alerte de recherche dans les journaux, mais l'ingestion dans l'espace de travail et l'alerte de journal coûtent plus qu'une alerte de métrique, et le détail n'est pas nécessaire." }
        c: { en: "A log search alert needs the diagnostic setting and the workspace first, which adds ingestion cost for data the platform metric already counts.", fr: "Une alerte de recherche dans les journaux exige d'abord le paramètre de diagnostic et l'espace de travail, ce qui ajoute un coût d'ingestion pour des données que la métrique de plateforme compte déjà." }
        e: { en: "An event session captures deadlock graphs in memory but sends no notification to anyone.", fr: "Une session d'événements capture les graphes d'interblocage en mémoire, mais n'envoie de notification à personne." }
    references:
      - title: Supported metrics - Microsoft.Sql/servers/databases - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-metrics/microsoft-sql-servers-databases-metrics
      - title: Create Azure Monitor metric alert rules - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-metric-alert-rule

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-31-08
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind has an Azure SQL logical server named **sql-northwind** that hosts an elastic pool named **Pool1** with 30 databases, including **NwSales**. No diagnostic setting is configured. Last week, the compute size of Pool1 was increased.

        To update your performance baseline, you need the CPU, data I/O and log write usage of Pool1 as a whole, relative to the pool limits, for each 15-second interval of the last 12 days, so that you can compare the periods before and after the change. You must use Transact-SQL.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'un serveur logique Azure SQL nommé **sql-northwind** qui héberge un pool élastique nommé **Pool1** avec 30 bases de données, dont **NwSales**. Aucun paramètre de diagnostic n'est configuré. La semaine dernière, la taille de calcul de Pool1 a été augmentée.

        Pour mettre à jour votre base de référence des performances, vous avez besoin de l'utilisation du processeur, des E/S de données et de l'écriture du journal de Pool1 dans son ensemble, relative aux limites du pool, pour chaque intervalle de 15 secondes des 12 derniers jours, afin de comparer les périodes avant et après le changement. Vous devez utiliser Transact-SQL.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        -- Connected to the [[db]] database of sql-northwind
        SELECT start_time, end_time, avg_cpu_percent,
               avg_data_io_percent, avg_log_write_percent
        FROM [[view]]
        WHERE [[col]] = 'Pool1'
          AND start_time > DATEADD(day, -12, SYSUTCDATETIME())
        ORDER BY start_time;
      slots:
        - id: db
          options:
            - { id: master, text: master }
            - { id: pooled, text: NwSales }
            - { id: tempdb, text: tempdb }
        - id: view
          options:
            - { id: eprs, text: sys.elastic_pool_resource_stats }
            - { id: dmeprs, text: sys.dm_elastic_pool_resource_stats }
            - { id: rs, text: sys.resource_stats }
            - { id: dmdbrs, text: sys.dm_db_resource_stats }
        - id: col
          options:
            - { id: pool, text: elastic_pool_name }
            - { id: dbname, text: database_name }
            - { id: sku, text: sku }
    answer:
      values: { db: master, view: eprs, col: pool }
    explanation:
      correct:
        en: |
          `sys.elastic_pool_resource_stats` lives in the `master` database of the logical server and keeps one row per pool for each 15-second window over 14 days, with percentages relative to the pool limits. Filtering on `elastic_pool_name` returns the 12 days of Pool1 that cover the periods before and after the change.
        fr: |
          `sys.elastic_pool_resource_stats` se trouve dans la base de données `master` du serveur logique et conserve une ligne par pool pour chaque fenêtre de 15 secondes sur 14 jours, avec des pourcentages relatifs aux limites du pool. Le filtre sur `elastic_pool_name` renvoie les 12 jours de Pool1 qui couvrent les périodes avant et après le changement.
      options:
        dmeprs: { en: "sys.dm_elastic_pool_resource_stats is queried from a pooled database and returns only recent data, not 12 days.", fr: "sys.dm_elastic_pool_resource_stats s'interroge depuis une base du pool et ne renvoie que des données récentes, pas 12 jours." }
        rs: { en: "sys.resource_stats returns 5-minute rows per database, relative to each database's limits, not the pool as a whole.", fr: "sys.resource_stats renvoie des lignes de 5 minutes par base de données, relatives aux limites de chaque base, pas le pool dans son ensemble." }
        dmdbrs: { en: "sys.dm_db_resource_stats covers one database and about one hour of data.", fr: "sys.dm_db_resource_stats couvre une seule base de données et environ une heure de données." }
        pooled: { en: "The historical pool view exists only in master.", fr: "La vue d'historique du pool n'existe que dans master." }
    references:
      - title: sys.elastic_pool_resource_stats - Azure SQL Database
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-catalog-views/sys-elastic-pool-resource-stats-azure-sql-database
      - title: Monitor Performance Using DMVs - Azure SQL Database & SQL database in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/monitoring-with-dmvs

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-31-09
    objective: "3.1.6"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove has an Azure virtual machine named **SQLVM1** that runs SQL Server 2022. You plan four Extended Events sessions on SQLVM1, each with the requirement listed in the answer area. Each session must use as little memory and storage as its requirement allows.

        Which target should you use for each session? To answer, drag the appropriate targets to the correct sessions. Each target may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose d'une machine virtuelle Azure nommée **SQLVM1** qui exécute SQL Server 2022. Vous prévoyez quatre sessions d'événements étendus sur SQLVM1, chacune avec l'exigence indiquée dans la zone de réponse. Chaque session doit utiliser aussi peu de mémoire et de stockage que son exigence le permet.

        Quelle cible devez-vous utiliser pour chaque session ? Pour répondre, faites glisser les cibles appropriées vers les sessions correspondantes. Chaque cible peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: file, text: event_file }
        - { id: ring, text: ring_buffer }
        - { id: hist, text: histogram }
        - { id: counter, text: event_counter }
        - { id: pair, text: pair_matching }
        - { id: etw, text: etw_classic_sync_target }
      targets:
        - id: locks
          text: { en: "Session 1: list the lock_acquired events that have no matching lock_released event, to find transactions that keep their locks", fr: "Session 1 : lister les événements lock_acquired qui n'ont pas d'événement lock_released correspondant, pour trouver les transactions qui conservent leurs verrous" }
        - id: counts
          text: { en: "Session 2: report how many times each of the events sql_batch_completed, rpc_completed and error_reported occurred, without keeping any event data", fr: "Session 2 : indiquer combien de fois chacun des événements sql_batch_completed, rpc_completed et error_reported s'est produit, sans conserver aucune donnée d'événement" }
        - id: live
          text: { en: "Session 3: look at the most recent events during a one-hour test; nothing needs to be kept after the session stops", fr: "Session 3 : examiner les événements les plus récents pendant un test d'une heure ; rien ne doit être conservé après l'arrêt de la session" }
        - id: keep
          text: { en: "Session 4: keep every deadlock report for one month and read the reports later with sys.fn_xe_file_target_read_file", fr: "Session 4 : conserver chaque rapport d'interblocage pendant un mois et lire les rapports plus tard avec sys.fn_xe_file_target_read_file" }
    answer:
      mapping: { locks: pair, counts: counter, live: ring, keep: file }
    explanation:
      correct:
        en: |
          pair_matching discards the start and end events that match and keeps only the unmatched start events, such as a lock_acquired without its lock_released. event_counter keeps only a count per event, with no event data. ring_buffer holds the latest events in memory and loses them when the session stops, which suits a short test. event_file writes .xel files that persist and that sys.fn_xe_file_target_read_file reads.
        fr: |
          pair_matching écarte les événements de début et de fin qui se correspondent et ne conserve que les événements de début sans correspondance, comme un lock_acquired sans son lock_released. event_counter ne conserve qu'un nombre par événement, sans données d'événement. ring_buffer garde les derniers événements en mémoire et les perd à l'arrêt de la session, ce qui convient à un test court. event_file écrit des fichiers .xel persistants que lit sys.fn_xe_file_target_read_file.
      options:
        hist: { en: "histogram counts occurrences per distinct value of one field or action (for example per database_id), not per event.", fr: "histogram compte les occurrences par valeur distincte d'un champ ou d'une action (par exemple par database_id), pas par événement." }
        etw: { en: "etw_classic_sync_target sends events to Event Tracing for Windows for correlation with operating system events; it isn't needed here.", fr: "etw_classic_sync_target envoie les événements au suivi d'événements pour Windows (ETW) pour les corréler avec ceux du système d'exploitation ; il n'est pas nécessaire ici." }
    references:
      - title: Extended Events Targets - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/extended-events/targets-for-extended-events-in-sql-server

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-31-10
    objective: "3.1.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware has an Azure SQL database named **DB1** on a logical server named **sql-proseware** in the East US 2 region. sql-proseware has a system-assigned managed identity. A storage account named **stprosexe** in East US 2 meets the requirements for event files and contains a blob container named **xevents**.

        You plan to capture the errors raised in DB1 to event files in xevents. The security policy forbids storing any secret, such as a SAS token or an account key, in the database.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'une base de données Azure SQL nommée **DB1** sur un serveur logique nommé **sql-proseware** dans la région USA Est 2. sql-proseware dispose d'une identité managée affectée par le système. Un compte de stockage nommé **stprosexe** dans la région USA Est 2 respecte les exigences des fichiers d'événements et contient un conteneur blob nommé **xevents**.

        Vous prévoyez de capturer les erreurs levées dans DB1 dans des fichiers d'événements de xevents. La stratégie de sécurité interdit de stocker un secret, comme un jeton SAS ou une clé de compte, dans la base de données.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        -- Azure role assignment on the xevents container:
        -- Storage Blob Data Contributor, assigned to [[principal]]

        -- Run in the [[db]] database
        CREATE DATABASE SCOPED CREDENTIAL [[name]]
        WITH IDENTITY = [[ident]];

        CREATE EVENT SESSION Errors ON DATABASE
        ADD EVENT sqlserver.error_reported
        ADD TARGET package0.event_file (
            SET filename = 'https://stprosexe.blob.core.windows.net/xevents/Errors.xel');
      slots:
        - id: principal
          options:
            - { id: mi, text: "the managed identity of sql-proseware" }
            - { id: admin, text: "the Microsoft Entra admin of sql-proseware" }
            - { id: dbuser, text: "the database user that creates the session" }
        - id: db
          options:
            - { id: db1, text: DB1 }
            - { id: master, text: master }
        - id: name
          options:
            - { id: url, text: "[https://stprosexe.blob.core.windows.net/xevents]" }
            - { id: slash, text: "[https://stprosexe.blob.core.windows.net/xevents/]" }
            - { id: acct, text: "[stprosexe]" }
            - { id: cont, text: "[xevents]" }
        - id: ident
          options:
            - { id: mid, text: "'MANAGED IDENTITY'" }
            - { id: sas, text: "'SHARED ACCESS SIGNATURE'" }
            - { id: key, text: "'stprosexe'" }
    answer:
      values: { principal: mi, db: db1, name: url, ident: mid }
    explanation:
      correct:
        en: |
          In Azure SQL Database, the event_file target authenticates to Azure Storage with a database scoped credential created in the user database. With `IDENTITY = 'MANAGED IDENTITY'` the credential holds no secret: Azure SQL uses the managed identity of the logical server, which needs Storage Blob Data Contributor on the container. The credential name must be the container URL exactly, without a trailing slash.
        fr: |
          Dans Azure SQL Database, la cible event_file s'authentifie auprès de Stockage Azure avec des informations d'identification délimitées à la base de données, créées dans la base utilisateur. Avec `IDENTITY = 'MANAGED IDENTITY'`, les informations d'identification ne contiennent aucun secret : Azure SQL utilise l'identité managée du serveur logique, qui a besoin de Storage Blob Data Contributor sur le conteneur. Le nom des informations d'identification doit être exactement l'URL du conteneur, sans barre oblique finale.
      options:
        admin: { en: "The storage request is made with the server's managed identity, not with the identity of an administrator.", fr: "La requête vers le stockage est faite avec l'identité managée du serveur, pas avec l'identité d'un administrateur." }
        dbuser: { en: "A database user isn't the identity that Azure SQL presents to Azure Storage.", fr: "Un utilisateur de base de données n'est pas l'identité qu'Azure SQL présente à Stockage Azure." }
        master: { en: "The session is database scoped, so its credential is created in DB1, not in master.", fr: "La session est délimitée à la base de données : ses informations d'identification se créent dans DB1, pas dans master." }
        slash: { en: "A trailing slash makes the name differ from the container URL and the target fails (error 86).", fr: "Une barre oblique finale rend le nom différent de l'URL du conteneur et la cible échoue (erreur 86)." }
        acct: { en: "The credential is matched to the target by the full container URL, not by the storage account name.", fr: "Les informations d'identification sont associées à la cible par l'URL complète du conteneur, pas par le nom du compte de stockage." }
        cont: { en: "The container name alone doesn't match the URL used by the event_file target.", fr: "Le nom du conteneur seul ne correspond pas à l'URL utilisée par la cible event_file." }
        sas: { en: "A SAS credential stores the token as its SECRET, which the security policy forbids.", fr: "Des informations d'identification SAS stockent le jeton dans leur SECRET, ce que la stratégie de sécurité interdit." }
        key: { en: "An identity named after the storage account goes with the account key as SECRET, which the policy forbids.", fr: "Une identité au nom du compte de stockage s'accompagne de la clé du compte comme SECRET, ce que la stratégie interdit." }
    references:
      - title: Create an Event Session with an event_file Target - Azure SQL Database & Azure SQL Managed Instance & SQL database in Fabric
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/xevent-code-event-file
