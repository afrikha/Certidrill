chapter: 33-optimal-configuration
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-33-01
    objective: "3.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have SQL Server 2022 on an Azure virtual machine that hosts a database named **OrdersDB** in the full recovery model. A scheduled `DBCC CHECKDB` reports consistency errors in OrdersDB, with `repair_allow_data_loss` as the minimum repair level.

        A full backup taken before the corruption occurred and every transaction log backup taken since then are available and verified.

        You need to recover OrdersDB with the least possible data loss. What should you do?
      fr: |
        Vous disposez de SQL Server 2022 sur une machine virtuelle Azure qui héberge une base de données nommée **OrdersDB** en mode de récupération complète. Un `DBCC CHECKDB` planifié signale des erreurs de cohérence dans OrdersDB, avec `repair_allow_data_loss` comme niveau de réparation minimal.

        Une sauvegarde complète effectuée avant l'apparition de la corruption et toutes les sauvegardes du journal des transactions effectuées depuis sont disponibles et vérifiées.

        Vous devez récupérer OrdersDB avec le moins de perte de données possible. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run `DBCC CHECKDB` with `REPAIR_ALLOW_DATA_LOSS` after setting OrdersDB to single-user mode.", fr: "Exécuter `DBCC CHECKDB` avec `REPAIR_ALLOW_DATA_LOSS` après avoir passé OrdersDB en mode mono-utilisateur." } }
        - { id: b, text: { en: "Run `DBCC CHECKDB` with `REPAIR_REBUILD` after setting OrdersDB to single-user mode.", fr: "Exécuter `DBCC CHECKDB` avec `REPAIR_REBUILD` après avoir passé OrdersDB en mode mono-utilisateur." } }
        - { id: c, text: { en: "Restore OrdersDB from the verified full backup, and then apply the log backups.", fr: "Restaurer OrdersDB à partir de la sauvegarde complète vérifiée, puis appliquer les sauvegardes du journal." } }
        - { id: d, text: { en: "Run `DBCC CHECKDB` with `PHYSICAL_ONLY` so that it repairs the damaged pages.", fr: "Exécuter `DBCC CHECKDB` avec `PHYSICAL_ONLY` pour qu'il répare les pages endommagées." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When `DBCC CHECKDB` reports errors, Microsoft recommends restoring from the last known good backup rather than repairing. With a full backup taken before the corruption and an unbroken chain of log backups, the restore brings the database back without the corruption and with the least data loss.
        fr: |
          Quand `DBCC CHECKDB` signale des erreurs, Microsoft recommande de restaurer à partir de la dernière sauvegarde saine connue plutôt que de réparer. Avec une sauvegarde complète antérieure à la corruption et une chaîne ininterrompue de sauvegardes du journal, la restauration rend la base sans la corruption et avec le moins de perte de données.
      options:
        a: { en: "`REPAIR_ALLOW_DATA_LOSS` is a last resort when no good backup exists: it can deallocate pages and lose more data than the restore.", fr: "`REPAIR_ALLOW_DATA_LOSS` est un dernier recours quand aucune bonne sauvegarde n'existe : il peut désallouer des pages et perdre plus de données que la restauration." }
        b: { en: "`REPAIR_REBUILD` only fixes errors that can be repaired without data loss; the reported minimum repair level is higher, so it can't fix these errors.", fr: "`REPAIR_REBUILD` ne corrige que les erreurs réparables sans perte de données ; le niveau de réparation minimal signalé est supérieur, il ne peut donc pas corriger ces erreurs." }
        d: { en: "`PHYSICAL_ONLY` limits the checks to page and allocation structures; it isn't a repair option and fixes nothing.", fr: "`PHYSICAL_ONLY` limite les vérifications à la structure des pages et des allocations ; ce n'est pas une option de réparation et il ne corrige rien." }
    references:
      - title: DBCC CHECKDB (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkdb-transact-sql

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-33-02
    objective: "3.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A nightly job runs `EXEC sp_updatestats;` without parameters in an Azure SQL database named **CrmDB**.

        Which statistics does the procedure update?
      fr: |
        Un travail nocturne exécute `EXEC sp_updatestats;` sans paramètre dans une base de données Azure SQL nommée **CrmDB**.

        Quelles statistiques la procédure met-elle à jour ?
    body:
      options:
        - { id: a, text: { en: "Every statistics object of every user table, by using a full scan of the data", fr: "Chaque objet de statistiques de chaque table utilisateur, avec une analyse complète des données" } }
        - { id: b, text: { en: "Only the statistics that have row modifications since their last update, with the default sample", fr: "Uniquement les statistiques qui ont des modifications de lignes depuis leur dernière mise à jour, avec l'échantillon par défaut" } }
        - { id: c, text: { en: "Only the statistics of the indexes, never the column statistics, with the default sample", fr: "Uniquement les statistiques des index, jamais les statistiques de colonnes, avec l'échantillon par défaut" } }
        - { id: d, text: { en: "Only the statistics that queries used since the last restart, with their persisted sample rate", fr: "Uniquement les statistiques utilisées par des requêtes depuis le dernier redémarrage, avec leur taux d'échantillonnage conservé" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `sp_updatestats` runs `UPDATE STATISTICS` against the user tables of the current database, but skips the statistics that have no row modifications since their last update. Without `@resample = 'resample'`, the statistics it updates use the default sample.
        fr: |
          `sp_updatestats` exécute `UPDATE STATISTICS` sur les tables utilisateur de la base active, mais ignore les statistiques qui n'ont aucune modification de lignes depuis leur dernière mise à jour. Sans `@resample = 'resample'`, les statistiques mises à jour utilisent l'échantillon par défaut.
      options:
        a: { en: "The procedure neither updates unmodified statistics nor uses a full scan; `UPDATE STATISTICS ... WITH FULLSCAN` does that for a table.", fr: "La procédure ne met pas à jour les statistiques non modifiées et n'utilise pas d'analyse complète ; c'est ce que fait `UPDATE STATISTICS ... WITH FULLSCAN` pour une table." }
        c: { en: "The procedure covers index and column statistics alike; the filter is on modifications, not on the type of statistics.", fr: "La procédure couvre aussi bien les statistiques d'index que de colonnes ; le filtre porte sur les modifications, pas sur le type de statistiques." }
        d: { en: "Use by queries isn't a criterion, and the default sample applies unless you ask to resample.", fr: "L'utilisation par des requêtes n'est pas un critère, et l'échantillon par défaut s'applique sauf si vous demandez un rééchantillonnage." }
    references:
      - title: sys.sp_updatestats (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-updatestats-transact-sql

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-33-03
    objective: "3.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You deploy SQL Server 2022 on a new Azure virtual machine named **SQLVM1** that has 16 vCPUs and a local temporary SSD mounted as drive D:. SQLVM1 is a standalone instance that isn't part of a failover cluster instance.

        You need to configure `tempdb` by following Microsoft's performance best practices for SQL Server on Azure VMs.

        Which configuration should you use?
      fr: |
        Vous déployez SQL Server 2022 sur une nouvelle machine virtuelle Azure nommée **SQLVM1** qui dispose de 16 processeurs virtuels et d'un SSD temporaire local monté comme lecteur D:. SQLVM1 est une instance autonome qui ne fait pas partie d'une instance de cluster de basculement.

        Vous devez configurer `tempdb` en suivant les bonnes pratiques de performances de Microsoft pour SQL Server sur machines virtuelles Azure.

        Quelle configuration devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Sixteen equally sized data files on drive D:", fr: "Seize fichiers de données de même taille sur le lecteur D:" } }
        - { id: b, text: { en: "Eight equally sized data files on drive D:", fr: "Huit fichiers de données de même taille sur le lecteur D:" } }
        - { id: c, text: { en: "Eight equally sized data files on a Premium SSD data disk with read/write host caching", fr: "Huit fichiers de données de même taille sur un disque de données SSD Premium avec mise en cache de l'hôte en lecture/écriture" } }
        - { id: d, text: { en: "One data file with unlimited autogrowth on drive D:", fr: "Un seul fichier de données avec croissance automatique illimitée sur le lecteur D:" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For most workloads that aren't part of a failover cluster instance, Microsoft recommends placing `tempdb` on the local ephemeral SSD (D:). Use multiple data files, starting with one file per core, up to eight files: a 16-vCPU virtual machine therefore gets eight files.
        fr: |
          Pour la plupart des charges de travail qui ne font pas partie d'une instance de cluster de basculement, Microsoft recommande de placer `tempdb` sur le SSD éphémère local (D:). Utilisez plusieurs fichiers de données, en commençant par un fichier par cœur, jusqu'à huit fichiers : une machine virtuelle de 16 processeurs virtuels reçoit donc huit fichiers.
      options:
        a: { en: "The recommendation stops at eight files; one file for each of the 16 vCPUs exceeds it.", fr: "La recommandation s'arrête à huit fichiers ; un fichier pour chacun des 16 processeurs virtuels la dépasse." }
        c: { en: "The local SSD is the recommended location for a standalone instance, and Microsoft advises against read/write host caching on disks that contain SQL Server data or log files.", fr: "Le SSD local est l'emplacement recommandé pour une instance autonome, et Microsoft déconseille la mise en cache de l'hôte en lecture/écriture sur les disques qui contiennent des fichiers de données ou de journal SQL Server." }
        d: { en: "A single data file ignores the recommendation of multiple files and exposes `tempdb` to allocation contention on 16 vCPUs.", fr: "Un seul fichier de données ignore la recommandation de plusieurs fichiers et expose `tempdb` à la contention d'allocation sur 16 processeurs virtuels." }
    references:
      - title: "Checklist: Best practices for SQL Server on Azure VMs"
        url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/performance-guidelines-best-practices-checklist

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-33-04
    objective: "3.3.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have SQL Server 2022 on an Azure virtual machine named **SQLVM4**. A database named **BillingDB** on SQLVM4 runs at compatibility level 160. Tests show that several queries run slower since their scalar user-defined functions are inlined. You aren't allowed to modify the functions or the queries.

        You need to turn off scalar UDF inlining in BillingDB only, not in the other databases of SQLVM4. Every other behavior of compatibility level 160 must remain in effect.

        Which statement should you run in BillingDB?
      fr: |
        Vous disposez de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM4**. Une base de données nommée **BillingDB** de SQLVM4 s'exécute au niveau de compatibilité 160. Des tests montrent que plusieurs requêtes sont plus lentes depuis que leurs fonctions scalaires définies par l'utilisateur sont incorporées. Vous n'êtes pas autorisé à modifier les fonctions ni les requêtes.

        Vous devez désactiver l'incorporation des UDF scalaires dans BillingDB uniquement, pas dans les autres bases de SQLVM4. Tous les autres comportements du niveau de compatibilité 160 doivent rester en vigueur.

        Quelle instruction devez-vous exécuter dans BillingDB ?
    body:
      options:
        - { id: a, text: "ALTER DATABASE CURRENT SET COMPATIBILITY_LEVEL = 140;" }
        - { id: b, text: "ALTER DATABASE SCOPED CONFIGURATION SET BATCH_MODE_ON_ROWSTORE = OFF;" }
        - { id: c, text: "ALTER DATABASE SCOPED CONFIGURATION SET QUERY_OPTIMIZER_HOTFIXES = OFF;" }
        - { id: d, text: "ALTER DATABASE SCOPED CONFIGURATION SET TSQL_SCALAR_UDF_INLINING = OFF;" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The `TSQL_SCALAR_UDF_INLINING` database-scoped configuration turns scalar UDF inlining on or off for one database while the compatibility level stays at 160. It needs no change to the functions or the queries, unlike `WITH INLINE = OFF` or the `DISABLE_TSQL_SCALAR_UDF_INLINING` hint.
        fr: |
          La configuration à l'échelle de la base de données `TSQL_SCALAR_UDF_INLINING` active ou désactive l'incorporation des UDF scalaires pour une seule base tandis que le niveau de compatibilité reste à 160. Elle n'exige aucune modification des fonctions ni des requêtes, contrairement à `WITH INLINE = OFF` ou à l'indicateur `DISABLE_TSQL_SCALAR_UDF_INLINING`.
      options:
        a: { en: "Level 140 does disable inlining, which arrived with level 150, but it also removes every other feature of levels 150 and 160.", fr: "Le niveau 140 désactive bien l'incorporation, apparue avec le niveau 150, mais il retire aussi toutes les autres fonctionnalités des niveaux 150 et 160." }
        b: { en: "This option disables batch mode on rowstore, another IQP feature; scalar UDFs would still be inlined.", fr: "Cette option désactive le mode batch sur rowstore, une autre fonctionnalité IQP ; les UDF scalaires resteraient incorporées." }
        c: { en: "Query optimizer hotfixes are already off by default and don't control scalar UDF inlining.", fr: "Les correctifs de l'optimiseur de requête sont déjà désactivés par défaut et ne contrôlent pas l'incorporation des UDF scalaires." }
    references:
      - title: ALTER DATABASE SCOPED CONFIGURATION (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-database-scoped-configuration-transact-sql

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-33-05
    objective: "3.3.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You change the service objective of an Azure SQL database named **SalesDB**, on a logical server named **sql-sales**, from General Purpose with 4 vCores to Business Critical with 8 vCores.

        You need to follow the progress of the operation by using Transact-SQL. What should you query?
      fr: |
        Vous modifiez l'objectif de service d'une base de données Azure SQL nommée **SalesDB**, sur un serveur logique nommé **sql-sales**, de General Purpose avec 4 vCores à Business Critical avec 8 vCores.

        Vous devez suivre la progression de l'opération à l'aide de Transact-SQL. Que devez-vous interroger ?
    body:
      options:
        - { id: a, text: { en: "`sys.dm_operation_status` in the master database of sql-sales", fr: "`sys.dm_operation_status` dans la base de données master de sql-sales" } }
        - { id: b, text: { en: "`sys.dm_db_resource_stats` in the SalesDB database", fr: "`sys.dm_db_resource_stats` dans la base de données SalesDB" } }
        - { id: c, text: { en: "`sys.dm_exec_requests` in the SalesDB database", fr: "`sys.dm_exec_requests` dans la base de données SalesDB" } }
        - { id: d, text: { en: "`sys.database_scoped_configurations` in the SalesDB database", fr: "`sys.database_scoped_configurations` dans la base de données SalesDB" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          `sys.dm_operation_status` returns the operations performed on the databases of a logical server, including service objective changes, with their state and percent complete. You query it in the master database of the server, filtering on the database name.
        fr: |
          `sys.dm_operation_status` renvoie les opérations effectuées sur les bases d'un serveur logique, y compris les changements d'objectif de service, avec leur état et leur pourcentage d'achèvement. Vous l'interrogez dans la base de données master du serveur, en filtrant sur le nom de la base.
      options:
        b: { en: "This view shows the CPU, I/O and memory use of SalesDB every 15 seconds, not the progress of a management operation.", fr: "Cette vue montre l'utilisation du processeur, des E/S et de la mémoire de SalesDB toutes les 15 secondes, pas la progression d'une opération de gestion." }
        c: { en: "The scaling runs as a service operation outside the user requests of SalesDB, so this view doesn't report its progress.", fr: "La mise à l'échelle s'exécute comme une opération du service en dehors des demandes utilisateur de SalesDB : cette vue ne rend pas compte de sa progression." }
        d: { en: "This view lists the database-scoped configuration values such as MAXDOP, not operations in progress.", fr: "Cette vue liste les valeurs de configuration à l'échelle de la base comme MAXDOP, pas les opérations en cours." }
    references:
      - title: sys.dm_operation_status
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-operation-status-azure-sql-database

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-33-06
    objective: "3.3.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has the following databases:

        - **AppDB**, on SQL Server 2022 that runs on an Azure virtual machine named SQLVM2. Query Store is enabled in `READ_WRITE` mode, and the `FORCE_LAST_GOOD_PLAN` automatic tuning option is on.
        - **TelemetryDB**, an Azure SQL database in the General Purpose service tier. The `CREATE_INDEX` and `DROP_INDEX` automatic tuning options are on. The table **dbo.Events** has a clustered index of 40 GB.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose des bases de données suivantes :

        - **AppDB**, sur SQL Server 2022 qui s'exécute sur une machine virtuelle Azure nommée SQLVM2. Le Magasin des requêtes est activé en mode `READ_WRITE`, et l'option de réglage automatique `FORCE_LAST_GOOD_PLAN` est activée.
        - **TelemetryDB**, une base de données Azure SQL du niveau de service General Purpose. Les options de réglage automatique `CREATE_INDEX` et `DROP_INDEX` sont activées. La table **dbo.Events** a un index cluster de 40 Go.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "If a plan that the Database Engine forced automatically in AppDB doesn't perform better than the regressed plan, the engine stops forcing it."
            fr: "Si un plan que le moteur de base de données a forcé automatiquement dans AppDB n'est pas plus performant que le plan régressé, le moteur cesse de le forcer."
        - id: s2
          text:
            en: "After SQLVM2 restarts, `sys.dm_db_tuning_recommendations` in AppDB still lists the plan regressions detected before the restart."
            fr: "Après un redémarrage de SQLVM2, `sys.dm_db_tuning_recommendations` dans AppDB liste toujours les régressions de plan détectées avant le redémarrage."
        - id: s3
          text:
            en: "Automatic tuning can create an index on dbo.Events in TelemetryDB when the workload would benefit from it."
            fr: "Le réglage automatique peut créer un index sur dbo.Events dans TelemetryDB quand la charge de travail en profiterait."
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Automatic plan correction verifies each forced plan: if the forced plan isn't better than the regressed one, the engine unforces it and compiles a new plan. The recommendations in `sys.dm_db_tuning_recommendations` are kept in memory only and are lost when the instance restarts. In Azure SQL Database, `CREATE_INDEX` doesn't recommend indexes on tables whose clustered index or heap exceeds 10 GB, so dbo.Events gets no automatic index.
        fr: |
          La correction automatique des plans vérifie chaque plan forcé : si le plan forcé n'est pas meilleur que le plan régressé, le moteur cesse de le forcer et compile un nouveau plan. Les recommandations de `sys.dm_db_tuning_recommendations` ne sont conservées qu'en mémoire et sont perdues au redémarrage de l'instance. Dans Azure SQL Database, `CREATE_INDEX` ne recommande pas d'index sur les tables dont l'index cluster ou le segment de mémoire (heap) dépasse 10 Go : dbo.Events n'obtient aucun index automatique.
      options:
        s2: { en: "The DMV isn't persisted: use Query Store or a periodic copy of the view to keep the history across restarts.", fr: "La vue de gestion dynamique n'est pas conservée : utilisez le Magasin des requêtes ou une copie périodique de la vue pour garder l'historique après un redémarrage." }
        s3: { en: "The 10-GB limit on the clustered index or heap of the table applies, whatever the service tier.", fr: "La limite de 10 Go de l'index cluster ou du segment de mémoire de la table s'applique, quel que soit le niveau de service." }
    references:
      - title: Automatic tuning
        url: https://learn.microsoft.com/en-us/sql/relational-databases/automatic-tuning/automatic-tuning
      - title: Automatic database tuning
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automatic-tuning-overview

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-33-07
    objective: "3.3.9"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        You migrated a database named **LegacyDB** to SQL Server 2025 on an Azure virtual machine. LegacyDB still uses compatibility level 130, Query Store is enabled in `READ_WRITE` mode, and every database-scoped configuration uses its default value.

        You plan to raise the compatibility level of LegacyDB in stages, and to stop at the lowest level that enables each intelligent query processing feature shown in the answer area.

        What is the lowest compatibility level that enables each feature? To answer, drag the appropriate compatibility levels to the correct features. Each compatibility level may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous avez migré une base de données nommée **LegacyDB** vers SQL Server 2025 sur une machine virtuelle Azure. LegacyDB utilise toujours le niveau de compatibilité 130, le Magasin des requêtes est activé en mode `READ_WRITE`, et chaque configuration à l'échelle de la base de données utilise sa valeur par défaut.

        Vous prévoyez de relever le niveau de compatibilité de LegacyDB par étapes, et de vous arrêter au niveau le plus bas qui active chaque fonctionnalité de traitement intelligent des requêtes présentée dans la zone de réponse.

        Quel est le niveau de compatibilité le plus bas qui active chaque fonctionnalité ? Pour répondre, faites glisser les niveaux de compatibilité appropriés vers les fonctionnalités correctes. Chaque niveau de compatibilité peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      items:
        - { id: c130, text: "130" }
        - { id: c140, text: "140" }
        - { id: c150, text: "150" }
        - { id: c160, text: "160" }
        - { id: c170, text: "170" }
      targets:
        - { id: t1, text: { en: "Batch mode adaptive joins", fr: "Jointures adaptatives en mode batch" } }
        - { id: t2, text: { en: "Batch mode on rowstore", fr: "Mode batch sur rowstore" } }
        - { id: t3, text: { en: "Cardinality estimation feedback", fr: "Rétroaction d'estimation de cardinalité" } }
        - { id: t4, text: { en: "Optional parameter plan optimization", fr: "Optimisation du plan des paramètres facultatifs" } }
      reuse: false
    answer:
      mapping: { t1: c140, t2: c150, t3: c160, t4: c170 }
    explanation:
      correct:
        en: |
          Batch mode adaptive joins arrived with compatibility level 140, batch mode on rowstore with level 150, cardinality estimation feedback (which also needs Query Store) with level 160, and optional parameter plan optimization with level 170 in SQL Server 2025. Level 130, the current one, enables none of them.
        fr: |
          Les jointures adaptatives en mode batch sont arrivées avec le niveau de compatibilité 140, le mode batch sur rowstore avec le niveau 150, la rétroaction d'estimation de cardinalité (qui exige aussi le Magasin des requêtes) avec le niveau 160, et l'optimisation du plan des paramètres facultatifs avec le niveau 170 dans SQL Server 2025. Le niveau 130, l'actuel, n'en active aucune.
      options:
        c130: { en: "LegacyDB already runs at level 130 and has none of these features, so 130 can't be the level that enables them.", fr: "LegacyDB s'exécute déjà au niveau 130 sans aucune de ces fonctionnalités : 130 ne peut donc pas être le niveau qui les active." }
    references:
      - title: Intelligent query processing in SQL databases
        url: https://learn.microsoft.com/en-us/sql/relational-databases/performance/intelligent-query-processing

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-33-08
    objective: "3.3.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have an Azure SQL database named **SalesDB** on a logical server named **sql-weu**. SalesDB uses the General Purpose service tier with 8 vCores and provisioned compute. SalesDB has an active geo-replication secondary with the same configuration on a logical server named **sql-neu**.

        The workload has decreased, and you plan to move both databases to General Purpose with 4 vCores. The space used by SalesDB is below the maximum data size of the target service objective. Geo-replication must be kept.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'une base de données Azure SQL nommée **SalesDB** sur un serveur logique nommé **sql-weu**. SalesDB utilise le niveau de service General Purpose avec 8 vCores et le calcul provisionné. SalesDB a un secondaire de géoréplication active de même configuration sur un serveur logique nommé **sql-neu**.

        La charge de travail a diminué et vous prévoyez de passer les deux bases à General Purpose avec 4 vCores. L'espace utilisé par SalesDB est inférieur à la taille maximale des données de l'objectif de service cible. La géoréplication doit être conservée.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Microsoft recommends changing the primary database first, and then the geo-secondary.", fr: "Microsoft recommande de modifier d'abord la base primaire, puis le géo-secondaire." } }
        - { id: b, text: { en: "Microsoft recommends changing the geo-secondary first, and then the primary database.", fr: "Microsoft recommande de modifier d'abord le géo-secondaire, puis la base primaire." } }
        - { id: c, text: { en: "You must remove geo-replication, change both databases, and then re-create the link.", fr: "Vous devez supprimer la géoréplication, modifier les deux bases, puis recréer la liaison." } }
        - { id: d, text: { en: "The duration of each change is proportional to the space used, because the data is copied.", fr: "La durée de chaque modification est proportionnelle à l'espace utilisé, car les données sont copiées." } }
        - { id: e, text: { en: "Open connections to SalesDB are dropped briefly when the new compute takes over.", fr: "Les connexions ouvertes à SalesDB sont brièvement coupées quand le nouveau calcul prend le relais." } }
      choose: 2
    answer: { optionIds: [a, e] }
    explanation:
      correct:
        en: |
          With geo-replication, Microsoft recommends upgrading the secondary first and downgrading the primary first (a requirement when the service tier changes), so that the secondary never has less compute than the primary while it replays its log. Each change ends with a short switch to the new compute that drops the open connections, usually for less than 30 seconds, which is why applications need retry logic.
        fr: |
          Avec la géoréplication, Microsoft recommande de monter d'abord le secondaire et de rétrograder d'abord le primaire (c'est une obligation quand le niveau de service change), afin que le secondaire n'ait jamais moins de calcul que le primaire pendant qu'il rejoue son journal. Chaque modification se termine par un court basculement vers le nouveau calcul qui coupe les connexions ouvertes, en général moins de 30 secondes : c'est pourquoi les applications ont besoin d'une logique de nouvelle tentative.
      options:
        b: { en: "Secondary first is the order for an upgrade; downgrading the secondary first leaves it with less compute than the primary, which can slow replication.", fr: "Le secondaire d'abord est l'ordre d'une montée en gamme ; rétrograder d'abord le secondaire lui laisse moins de calcul que le primaire, ce qui peut ralentir la réplication." }
        c: { en: "You can change the service objective of geo-replicated databases without removing the link, in the right order.", fr: "Vous pouvez changer l'objectif de service de bases géorépliquées sans supprimer la liaison, dans le bon ordre." }
        d: { en: "Within General Purpose, the data stays on remote storage and only the compute changes, so the duration doesn't depend on the space used.", fr: "Au sein de General Purpose, les données restent sur le stockage distant et seul le calcul change : la durée ne dépend pas de l'espace utilisé." }
    references:
      - title: Scale single database resources in Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/single-database-scale

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-33-09
    objective: "3.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have an Azure SQL managed instance named **MI2** in the Business Critical service tier. A database on MI2 contains a table named **dbo.Entries** whose clustered index **PK_Entries** is 900 GB, with a page density of 55 percent.

        You need to rebuild PK_Entries with a fill factor of 95. The solution must meet the following requirements:

        - Users must be able to read and modify dbo.Entries during the operation.
        - If a failover occurs during the operation, the work already done must not be lost.
        - When the operation is complete, the statistics of PK_Entries must reflect a full scan of the data.

        What should you do?
      fr: |
        Vous disposez d'une instance managée Azure SQL nommée **MI2** du niveau de service Business Critical. Une base de données de MI2 contient une table nommée **dbo.Entries** dont l'index cluster **PK_Entries** fait 900 Go, avec une densité des pages de 55 %.

        Vous devez reconstruire PK_Entries avec un facteur de remplissage de 95. La solution doit satisfaire les exigences suivantes :

        - Les utilisateurs doivent pouvoir lire et modifier dbo.Entries pendant l'opération.
        - Si un basculement se produit pendant l'opération, le travail déjà effectué ne doit pas être perdu.
        - Une fois l'opération terminée, les statistiques de PK_Entries doivent refléter une analyse complète des données.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Rebuild PK_Entries with `ONLINE = ON` and `FILLFACTOR = 95`, and rely on the rebuild to update its statistics with a full scan.", fr: "Reconstruire PK_Entries avec `ONLINE = ON` et `FILLFACTOR = 95`, et compter sur la reconstruction pour mettre à jour ses statistiques avec une analyse complète." } }
        - { id: b, text: { en: "Rebuild PK_Entries with `ONLINE = ON`, `RESUMABLE = ON` and `FILLFACTOR = 95`, and rely on the rebuild to update its statistics with a full scan.", fr: "Reconstruire PK_Entries avec `ONLINE = ON`, `RESUMABLE = ON` et `FILLFACTOR = 95`, et compter sur la reconstruction pour mettre à jour ses statistiques avec une analyse complète." } }
        - { id: c, text: { en: "Rebuild PK_Entries with `ONLINE = ON`, `RESUMABLE = ON` and `FILLFACTOR = 95`, and then run `UPDATE STATISTICS` on PK_Entries `WITH FULLSCAN`.", fr: "Reconstruire PK_Entries avec `ONLINE = ON`, `RESUMABLE = ON` et `FILLFACTOR = 95`, puis exécuter `UPDATE STATISTICS` sur PK_Entries `WITH FULLSCAN`." } }
        - { id: d, text: { en: "Reorganize PK_Entries, which keeps its progress after a failover, and then run `UPDATE STATISTICS` on PK_Entries `WITH FULLSCAN`.", fr: "Réorganiser PK_Entries, ce qui conserve sa progression après un basculement, puis exécuter `UPDATE STATISTICS` sur PK_Entries `WITH FULLSCAN`." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An online rebuild keeps the table available, and `RESUMABLE = ON` lets the rebuild continue from where it stopped after a failover. Unlike a regular rebuild, a resumable rebuild doesn't update the index statistics with a full scan, so you run `UPDATE STATISTICS ... WITH FULLSCAN` on the index once the rebuild completes.
        fr: |
          Une reconstruction en ligne garde la table disponible, et `RESUMABLE = ON` permet à la reconstruction de reprendre là où elle s'est arrêtée après un basculement. Contrairement à une reconstruction ordinaire, une reconstruction pouvant être reprise ne met pas à jour les statistiques de l'index avec une analyse complète : vous exécutez donc `UPDATE STATISTICS ... WITH FULLSCAN` sur l'index une fois la reconstruction terminée.
      options:
        a: { en: "This rebuild does update the statistics with a full scan, but without `RESUMABLE = ON` a failover rolls back all the work done.", fr: "Cette reconstruction met bien à jour les statistiques avec une analyse complète, mais sans `RESUMABLE = ON` un basculement annule tout le travail effectué." }
        b: { en: "The rebuild survives a failover, but a resumable rebuild doesn't update the index statistics with a full scan.", fr: "La reconstruction survit à un basculement, mais une reconstruction pouvant être reprise ne met pas à jour les statistiques de l'index avec une analyse complète." }
        d: { en: "Reorganizing compacts pages by using the fill factor already stored for the index; it can't apply a new fill factor of 95.", fr: "La réorganisation compacte les pages selon le facteur de remplissage déjà enregistré pour l'index ; elle ne peut pas appliquer un nouveau facteur de remplissage de 95." }
    references:
      - title: ALTER INDEX (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-index-transact-sql
      - title: Optimize index maintenance to improve query performance and reduce resource consumption
        url: https://learn.microsoft.com/en-us/sql/relational-databases/indexes/reorganize-and-rebuild-indexes

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-33-10
    objective: "3.3.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have SQL Server 2022 Enterprise on an Azure virtual machine named **SQLVM3**. Resource Governor isn't configured yet.

        The sessions of an application named **NightlyETL**, identified by its application name, saturate the data disks. You need to meet the following requirements:

        - The NightlyETL sessions must be limited to 2,000 I/O operations per second on each disk volume.
        - The other sessions must keep running without limits.
        - The configuration must take effect without restarting the instance.

        How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez de SQL Server 2022 Enterprise sur une machine virtuelle Azure nommée **SQLVM3**. Resource Governor n'est pas encore configuré.

        Les sessions d'une application nommée **NightlyETL**, identifiée par son nom d'application, saturent les disques de données. Vous devez satisfaire les exigences suivantes :

        - Les sessions de NightlyETL doivent être limitées à 2 000 opérations d'E/S par seconde sur chaque volume de disque.
        - Les autres sessions doivent continuer à s'exécuter sans limite.
        - La configuration doit prendre effet sans redémarrer l'instance.

        Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        USE [[db]];
        CREATE RESOURCE POOL EtlPool WITH ([[limit]] = 2000);
        CREATE WORKLOAD GROUP EtlGroup USING EtlPool;
        GO
        CREATE FUNCTION dbo.rg_etl() RETURNS sysname
        [[bind]]
        AS
        BEGIN
            RETURN CASE WHEN APP_NAME() = N'NightlyETL'
                        THEN N'EtlGroup' ELSE N'default' END;
        END;
        GO
        ALTER RESOURCE GOVERNOR WITH (CLASSIFIER_FUNCTION = dbo.rg_etl);
        [[apply]];
      slots:
        - id: db
          options:
            - { id: master, text: master }
            - { id: msdb, text: msdb }
            - { id: tempdb, text: tempdb }
        - id: limit
          options:
            - { id: iops, text: MAX_IOPS_PER_VOLUME }
            - { id: cap, text: CAP_CPU_PERCENT }
            - { id: mem, text: MAX_MEMORY_PERCENT }
            - { id: miniops, text: MIN_IOPS_PER_VOLUME }
        - id: bind
          options:
            - { id: schema, text: WITH SCHEMABINDING }
            - { id: encrypt, text: WITH ENCRYPTION }
            - { id: caller, text: WITH EXECUTE AS CALLER }
        - id: apply
          options:
            - { id: rgreconf, text: ALTER RESOURCE GOVERNOR RECONFIGURE }
            - { id: reconf, text: RECONFIGURE }
            - { id: reset, text: ALTER RESOURCE GOVERNOR RESET STATISTICS }
    answer:
      values: { db: master, limit: iops, bind: schema, apply: rgreconf }
    explanation:
      correct:
        en: |
          The classifier function must be created in the master database with `WITH SCHEMABINDING`; it runs for each new session and returns the name of the workload group. `MAX_IOPS_PER_VOLUME` caps the I/O operations per second of the pool on each disk volume. Sessions classified to `default` keep running in the default pool without the limit, and `ALTER RESOURCE GOVERNOR RECONFIGURE` applies the configuration and enables Resource Governor without a restart.
        fr: |
          La fonction de classification doit être créée dans la base de données master avec `WITH SCHEMABINDING` ; elle s'exécute pour chaque nouvelle session et renvoie le nom du groupe de charges de travail. `MAX_IOPS_PER_VOLUME` plafonne les opérations d'E/S par seconde du pool sur chaque volume de disque. Les sessions classées dans `default` continuent à s'exécuter dans le pool par défaut sans la limite, et `ALTER RESOURCE GOVERNOR RECONFIGURE` applique la configuration et active Resource Governor sans redémarrage.
      options:
        msdb: { en: "Resource Governor only accepts a classifier function stored in master.", fr: "Resource Governor n'accepte qu'une fonction de classification stockée dans master." }
        cap: { en: "CAP_CPU_PERCENT is a hard cap on CPU bandwidth, not on I/O.", fr: "CAP_CPU_PERCENT est un plafond strict de bande passante processeur, pas d'E/S." }
        mem: { en: "MAX_MEMORY_PERCENT limits the memory of the pool, not its I/O.", fr: "MAX_MEMORY_PERCENT limite la mémoire du pool, pas ses E/S." }
        miniops: { en: "MIN_IOPS_PER_VOLUME reserves a minimum number of IOPS for the pool; it doesn't cap the pool's I/O.", fr: "MIN_IOPS_PER_VOLUME réserve un nombre minimal d'IOPS pour le pool ; il ne plafonne pas les E/S du pool." }
        encrypt: { en: "The classifier function must be schema-bound; encryption doesn't replace schema binding.", fr: "La fonction de classification doit être liée au schéma ; le chiffrement ne remplace pas la liaison au schéma." }
        reconf: { en: "RECONFIGURE applies `sp_configure` options; it doesn't apply a Resource Governor configuration.", fr: "RECONFIGURE applique les options de `sp_configure` ; il n'applique pas une configuration de Resource Governor." }
        reset: { en: "This statement resets the Resource Governor statistics; it doesn't apply the new configuration.", fr: "Cette instruction réinitialise les statistiques de Resource Governor ; elle n'applique pas la nouvelle configuration." }
    references:
      - title: Resource governor classifier function
        url: https://learn.microsoft.com/en-us/sql/relational-databases/resource-governor/resource-governor-classifier-function
      - title: CREATE RESOURCE POOL (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-resource-pool-transact-sql
