chapter: 41-sql-agent-jobs
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You manage SQL Server 2022 on an Azure virtual machine named **SQLVM1**. You plan to back up the SQL Server Agent configuration of SQLVM1: the job definitions, their schedules, the operators and the job history.

        Which system database must you back up?
      fr: |
        Vous gérez SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM1**. Vous prévoyez de sauvegarder la configuration de SQL Server Agent de SQLVM1 : les définitions des travaux, leurs planifications, les opérateurs et l'historique des travaux.

        Quelle base de données système devez-vous sauvegarder ?
    body:
      options:
        - { id: a, text: master }
        - { id: b, text: model }
        - { id: c, text: msdb }
        - { id: d, text: tempdb }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          SQL Server Agent stores its jobs, job steps, schedules, operators, alerts and job history in the msdb system database. Backing up msdb protects this configuration.
        fr: |
          SQL Server Agent stocke ses travaux, les étapes de travail, les planifications, les opérateurs, les alertes et l'historique des travaux dans la base de données système msdb. La sauvegarde de msdb protège cette configuration.
      options:
        a: { en: "master holds the instance-level configuration, such as logins and server settings, not the SQL Server Agent objects.", fr: "master contient la configuration au niveau de l'instance, comme les connexions et les paramètres du serveur, pas les objets de SQL Server Agent." }
        b: { en: "model is the template used to create new databases.", fr: "model est le modèle utilisé pour créer les nouvelles bases de données." }
        d: { en: "tempdb is re-created at each start of the instance and can't be backed up.", fr: "tempdb est recréée à chaque démarrage de l'instance et ne peut pas être sauvegardée." }
    references:
      - title: msdb database
        url: https://learn.microsoft.com/en-us/sql/relational-databases/databases/msdb-database

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-41-02
    objective: "4.1.2"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        A SQL Server Agent job named **NightlyLoad** must email an operator named **DBA-Team** after every run, whether the job succeeds or fails. Database Mail and SQL Server Agent mail are already configured.

        Which value of the `@notify_level_email` parameter of `sp_update_job` should you use?
      fr: |
        Un travail SQL Server Agent nommé **NightlyLoad** doit envoyer un e-mail à un opérateur nommé **DBA-Team** après chaque exécution, que le travail réussisse ou échoue. Database Mail et la messagerie de SQL Server Agent sont déjà configurées.

        Quelle valeur du paramètre `@notify_level_email` de `sp_update_job` devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "0" }
        - { id: b, text: "1" }
        - { id: c, text: "2" }
        - { id: d, text: "3" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `@notify_level_email = 3` (Always) sends the notification when the job completes, whatever its outcome. The value 1 notifies on success only and 2 on failure only.
        fr: |
          `@notify_level_email = 3` (toujours) envoie la notification quand le travail se termine, quel que soit son résultat. La valeur 1 ne notifie qu'en cas de réussite et 2 qu'en cas d'échec.
      options:
        a: { en: "0 means never: no email would be sent.", fr: "0 signifie jamais : aucun e-mail ne serait envoyé." }
        b: { en: "1 sends the email only when the job succeeds.", fr: "1 n'envoie l'e-mail que lorsque le travail réussit." }
        c: { en: "2 sends the email only when the job fails.", fr: "2 n'envoie l'e-mail que lorsque le travail échoue." }
    references:
      - title: sp_update_job (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-update-job-transact-sql

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-41-03
    objective: "4.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have SQL Server 2022 on an Azure virtual machine named **SQLVM2**. Members of an audit team have logins on SQLVM2 and own no SQL Server Agent jobs.

        The auditors must be able to view every SQL Server Agent job on SQLVM2 and its history to investigate failures. They must not be able to start, stop, enable, disable or modify the jobs. The solution must follow the principle of least privilege.

        To which role in msdb should you add the users of the auditors?
      fr: |
        Vous disposez de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM2**. Les membres d'une équipe d'audit ont des connexions sur SQLVM2 et ne possèdent aucun travail SQL Server Agent.

        Les auditeurs doivent pouvoir afficher chaque travail SQL Server Agent de SQLVM2 et son historique pour analyser les échecs. Ils ne doivent pas pouvoir démarrer, arrêter, activer, désactiver ni modifier les travaux. La solution doit respecter le principe du moindre privilège.

        À quel rôle de msdb devez-vous ajouter les utilisateurs des auditeurs ?
    body:
      options:
        - { id: a, text: SQLAgentUserRole }
        - { id: b, text: SQLAgentReaderRole }
        - { id: c, text: SQLAgentOperatorRole }
        - { id: d, text: db_owner }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          SQLAgentReaderRole includes the permissions of SQLAgentUserRole and adds the right to view the list of all the jobs and their history, including jobs owned by other users. It doesn't allow its members to run, enable, disable or change jobs that they don't own.
        fr: |
          SQLAgentReaderRole inclut les autorisations de SQLAgentUserRole et ajoute le droit d'afficher la liste de tous les travaux et leur historique, y compris ceux d'autres utilisateurs. Il ne permet pas à ses membres d'exécuter, d'activer, de désactiver ni de modifier les travaux qu'ils ne possèdent pas.
      options:
        a: { en: "SQLAgentUserRole only shows the jobs that the user owns, so the auditors would see none.", fr: "SQLAgentUserRole n'affiche que les travaux que l'utilisateur possède : les auditeurs n'en verraient aucun." }
        c: { en: "SQLAgentOperatorRole also lets its members start, stop, enable and disable any local job, which the auditors must not do.", fr: "SQLAgentOperatorRole permet aussi à ses membres de démarrer, d'arrêter, d'activer et de désactiver tout travail local, ce que les auditeurs ne doivent pas faire." }
        d: { en: "db_owner in msdb grants full control of the database and its SQL Server Agent objects: it breaks least privilege.", fr: "db_owner dans msdb accorde le contrôle total de la base et de ses objets SQL Server Agent : il enfreint le moindre privilège." }
    references:
      - title: SQL Server Agent fixed database roles
        url: https://learn.microsoft.com/en-us/ssms/agent/sql-server-agent-fixed-database-roles

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-41-04
    objective: "4.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        On SQL Server 2022 running on an Azure virtual machine, you create a job named **ArchiveLogs** by running a script that calls `sp_add_job`, `sp_add_jobstep`, `sp_add_schedule` and `sp_attach_schedule`, in that order.

        SQL Server Agent is running, the job and its schedule are enabled, and the start date of the schedule has passed. ArchiveLogs never runs on its schedule, and msdb contains no history row for it.

        What should you do?
      fr: |
        Sur SQL Server 2022 qui s'exécute sur une machine virtuelle Azure, vous créez un travail nommé **ArchiveLogs** en exécutant un script qui appelle `sp_add_job`, `sp_add_jobstep`, `sp_add_schedule` et `sp_attach_schedule`, dans cet ordre.

        SQL Server Agent est en cours d'exécution, le travail et sa planification sont activés, et la date de début de la planification est passée. ArchiveLogs ne s'exécute jamais selon sa planification, et msdb ne contient aucune ligne d'historique pour lui.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run `sp_configure 'Agent XPs', 1`, and then run `RECONFIGURE`.", fr: "Exécuter `sp_configure 'Agent XPs', 1`, puis exécuter `RECONFIGURE`." } }
        - { id: b, text: { en: "Run `sp_add_jobserver` to target ArchiveLogs at the local server.", fr: "Exécuter `sp_add_jobserver` pour cibler ArchiveLogs sur le serveur local." } }
        - { id: c, text: { en: "Run `sp_update_schedule` with `@enabled = 1` for the schedule.", fr: "Exécuter `sp_update_schedule` avec `@enabled = 1` pour la planification." } }
        - { id: d, text: { en: "Run `sp_update_job` with `@start_step_id = 1` for ArchiveLogs.", fr: "Exécuter `sp_update_job` avec `@start_step_id = 1` pour ArchiveLogs." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `sp_add_jobserver` targets a job at the server where it executes, `(LOCAL)` by default. SQL Server Management Studio does this for you, but a script that creates the job with `sp_add_job` must call it explicitly: a job with no target server isn't run by SQL Server Agent, even with an enabled schedule.
        fr: |
          `sp_add_jobserver` cible un travail sur le serveur où il s'exécute, `(LOCAL)` par défaut. SQL Server Management Studio le fait pour vous, mais un script qui crée le travail avec `sp_add_job` doit l'appeler explicitement : un travail sans serveur cible n'est pas exécuté par SQL Server Agent, même avec une planification activée.
      options:
        a: { en: "The Agent XPs option is enabled when SQL Server Agent starts, and the service is already running.", fr: "L'option Agent XPs est activée au démarrage de SQL Server Agent, et le service est déjà en cours d'exécution." }
        c: { en: "The schedule is already enabled; enabling it again changes nothing.", fr: "La planification est déjà activée ; l'activer de nouveau ne change rien." }
        d: { en: "The first step added is step 1, which is already the default start step.", fr: "La première étape ajoutée est l'étape 1, qui est déjà l'étape de départ par défaut." }
    references:
      - title: sp_add_jobserver (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-jobserver-transact-sql
      - title: sp_add_job (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-job-transact-sql

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-41-05
    objective: "4.1.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        You have an Azure SQL managed instance named **MI1**. You are adding the first step of a SQL Server Agent job named **NightlyExport**. The step must meet the following requirements:

        - If the step fails, it must be retried up to three times, 10 minutes apart.
        - If the step succeeds, the job must continue with step 2.
        - If the step still fails after the retries, the job must go to step 3, which logs the failure.

        How should you complete the Transact-SQL statement? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'une instance managée Azure SQL nommée **MI1**. Vous ajoutez la première étape d'un travail SQL Server Agent nommé **NightlyExport**. L'étape doit satisfaire les exigences suivantes :

        - Si l'étape échoue, elle doit faire l'objet de trois nouvelles tentatives au maximum, à 10 minutes d'intervalle.
        - Si l'étape réussit, le travail doit continuer avec l'étape 2.
        - Si l'étape échoue encore après les nouvelles tentatives, le travail doit passer à l'étape 3, qui journalise l'échec.

        Comment devez-vous compléter l'instruction Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        EXEC msdb.dbo.sp_add_jobstep
             @job_name = N'NightlyExport', @step_id = 1,
             @step_name = N'Export orders', @subsystem = N'TSQL',
             @database_name = N'SalesDB', @command = N'EXEC dbo.ExportOrders;',
             @retry_attempts = 3, @retry_interval = [[interval]],
             @on_success_action = [[success]],
             @on_fail_action = [[fail]], @on_fail_step_id = 3;
      slots:
        - id: interval
          options:
            - { id: i1, text: "1" }
            - { id: i10, text: "10" }
            - { id: i600, text: "600" }
        - id: success
          options:
            - { id: s1, text: "1" }
            - { id: s2, text: "2" }
            - { id: s3, text: "3" }
            - { id: s4, text: "4" }
        - id: fail
          options:
            - { id: f2, text: "2" }
            - { id: f3, text: "3" }
            - { id: f4, text: "4" }
    answer:
      values: { interval: i10, success: s3, fail: f4 }
    explanation:
      correct:
        en: |
          `@retry_interval` is expressed in minutes, so 10 waits 10 minutes between retries. `@on_success_action = 3` goes to the next step, step 2. `@on_fail_action = 4` goes to the step given by `@on_fail_step_id`, step 3, once the retries are exhausted.
        fr: |
          `@retry_interval` s'exprime en minutes : 10 attend 10 minutes entre les nouvelles tentatives. `@on_success_action = 3` passe à l'étape suivante, l'étape 2. `@on_fail_action = 4` passe à l'étape indiquée par `@on_fail_step_id`, l'étape 3, une fois les nouvelles tentatives épuisées.
      options:
        i600: { en: "The interval is in minutes, not seconds: 600 would wait 10 hours.", fr: "L'intervalle est en minutes, pas en secondes : 600 attendrait 10 heures." }
        s1: { en: "1 quits the job reporting success, so step 2 would never run.", fr: "1 quitte le travail en signalant la réussite : l'étape 2 ne s'exécuterait jamais." }
        s4: { en: "4 goes to the step given by `@on_success_step_id`, which the statement doesn't set.", fr: "4 passe à l'étape indiquée par `@on_success_step_id`, que l'instruction ne définit pas." }
        f2: { en: "2 quits the job reporting failure, so step 3 would never run.", fr: "2 quitte le travail en signalant l'échec : l'étape 3 ne s'exécuterait jamais." }
        f3: { en: "3 goes to the next step, which is step 2, not the logging step.", fr: "3 passe à l'étape suivante, qui est l'étape 2, pas l'étape de journalisation." }
    references:
      - title: sp_add_jobstep (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-jobstep-transact-sql

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-41-06
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have SQL Server 2022 on an Azure virtual machine named **SQLVM3**. After the virtual machine restarted for monthly patching, none of the SQL Server Agent jobs ran on their schedules. In SQL Server Management Studio, the SQL Server Agent node shows **Agent XPs disabled**. The Database Engine service is running, and the SQL Server Agent service is stopped with a manual start mode.

        You need the jobs to run on their schedules now and after every future restart of SQLVM3.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM3**. Après le redémarrage de la machine virtuelle pour les correctifs mensuels, aucun travail SQL Server Agent ne s'est exécuté selon sa planification. Dans SQL Server Management Studio, le nœud SQL Server Agent affiche **Agent XPs disabled**. Le service du moteur de base de données est en cours d'exécution, et le service SQL Server Agent est arrêté avec un mode de démarrage manuel.

        Vous devez faire en sorte que les travaux s'exécutent selon leur planification dès maintenant et après chaque redémarrage futur de SQLVM3.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Start the SQL Server Agent service.", fr: "Démarrer le service SQL Server Agent." } }
        - { id: b, text: { en: "Run `sp_configure 'Agent XPs', 1`, and then run `RECONFIGURE`.", fr: "Exécuter `sp_configure 'Agent XPs', 1`, puis exécuter `RECONFIGURE`." } }
        - { id: c, text: { en: "Set the startup type of the SQL Server Agent service to Automatic.", fr: "Définir le type de démarrage du service SQL Server Agent sur Automatique." } }
        - { id: d, text: { en: "Select **Auto restart SQL Server Agent if it stops unexpectedly** in the SQL Server Agent properties.", fr: "Sélectionner **Auto restart SQL Server Agent if it stops unexpectedly** dans les propriétés de SQL Server Agent." } }
        - { id: e, text: { en: "Attach a schedule that starts automatically when SQL Server Agent starts to each job.", fr: "Attacher à chaque travail une planification qui démarre automatiquement au démarrage de SQL Server Agent." } }
      choose: 2
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          SQL Server Agent must run as a service to execute scheduled jobs. Starting it (from SQL Server Management Studio, which also enables the Agent XPs option) makes the jobs run again, and configuring the service to start automatically when the operating system starts covers every future restart of the virtual machine.
        fr: |
          SQL Server Agent doit s'exécuter comme service pour exécuter les travaux planifiés. Le démarrer (depuis SQL Server Management Studio, ce qui active aussi l'option Agent XPs) fait de nouveau exécuter les travaux, et configurer le service pour qu'il démarre automatiquement avec le système d'exploitation couvre chaque redémarrage futur de la machine virtuelle.
      options:
        b: { en: "Enabling Agent XPs only makes the SQL Server Agent extended stored procedures available, whatever the state of the service; no job runs while the service is stopped.", fr: "Activer Agent XPs ne fait que rendre disponibles les procédures stockées étendues de SQL Server Agent, quel que soit l'état du service ; aucun travail ne s'exécute tant que le service est arrêté." }
        d: { en: "With this setting, SQL Server restarts SQL Server Agent when the Agent stops unexpectedly; it doesn't start a service whose start mode is manual when Windows starts.", fr: "Avec ce paramètre, SQL Server redémarre SQL Server Agent quand l'Agent s'arrête de manière inattendue ; il ne démarre pas au démarrage de Windows un service dont le mode de démarrage est manuel." }
        e: { en: "Such a schedule runs a job when SQL Server Agent starts; it is useless while the service itself doesn't start, and it would add unwanted runs.", fr: "Une telle planification exécute un travail au démarrage de SQL Server Agent ; elle est inutile tant que le service lui-même ne démarre pas, et elle ajouterait des exécutions non souhaitées." }
    references:
      - title: "Server configuration: Agent XPs"
        url: https://learn.microsoft.com/en-us/sql/database-engine/configure-windows/agent-xps-server-configuration-option
      - title: Start, stop, or pause the SQL Server Agent service
        url: https://learn.microsoft.com/en-us/ssms/agent/start-stop-or-pause-the-sql-server-agent-service

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-41-07
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have an Azure SQL managed instance named **MI2** in the General Purpose service tier with 1 TB of reserved storage. Database Mail is configured on MI2 with the `AzureManagedInstance_dbmail_profile` profile, and SQL Server Agent jobs already email an operator named **DBA-Team** when they fail.

        The DBA team must also receive an email when the storage space used by MI2 exceeds 900 GB. The solution must minimize administrative effort and must not require custom code.

        What should you configure?
      fr: |
        Vous disposez d'une instance managée Azure SQL nommée **MI2** du niveau de service General Purpose avec 1 To de stockage réservé. Database Mail est configurée sur MI2 avec le profil `AzureManagedInstance_dbmail_profile`, et les travaux SQL Server Agent envoient déjà un e-mail à un opérateur nommé **DBA-Team** quand ils échouent.

        L'équipe DBA doit aussi recevoir un e-mail quand l'espace de stockage utilisé par MI2 dépasse 900 Go. La solution doit réduire au minimum l'effort administratif et ne doit pas exiger de code personnalisé.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A SQL Server Agent performance condition alert on MI2 that emails DBA-Team when the storage used exceeds 900 GB", fr: "Une alerte de condition de performances SQL Server Agent sur MI2 qui envoie un e-mail à DBA-Team quand le stockage utilisé dépasse 900 Go" } }
        - { id: b, text: { en: "A SQL Server Agent event alert on MI2 for error 1105 that emails DBA-Team when a filegroup runs out of space", fr: "Une alerte d'événement SQL Server Agent sur MI2 pour l'erreur 1105 qui envoie un e-mail à DBA-Team quand un groupe de fichiers manque d'espace" } }
        - { id: c, text: { en: "An Azure Monitor metric alert rule on the Storage space used metric of MI2, with an action group that sends email", fr: "Une règle d'alerte de métrique Azure Monitor sur la métrique Storage space used de MI2, avec un groupe d'actions qui envoie un e-mail" } }
        - { id: d, text: { en: "A job notification on every SQL Server Agent job of MI2 that emails DBA-Team when the job completes", fr: "Une notification de travail sur chaque travail SQL Server Agent de MI2 qui envoie un e-mail à DBA-Team quand le travail se termine" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          SQL Server Agent alerts aren't supported on Azure SQL Managed Instance: only job notifications to operators are. Azure Monitor collects the **Storage space used** platform metric (`storage_space_used_mb`) of the managed instance every minute, and a metric alert rule with a static threshold of 900 GB and an action group emails the team without any code.
        fr: |
          Les alertes SQL Server Agent ne sont pas prises en charge sur Azure SQL Managed Instance : seules les notifications de travaux vers les opérateurs le sont. Azure Monitor collecte chaque minute la métrique de plateforme **Storage space used** (`storage_space_used_mb`) de l'instance managée, et une règle d'alerte de métrique avec un seuil statique de 900 Go et un groupe d'actions envoie un e-mail à l'équipe sans aucun code.
      options:
        a: { en: "Performance condition alerts are SQL Server Agent alerts, which Managed Instance doesn't support.", fr: "Les alertes de condition de performances sont des alertes SQL Server Agent, que Managed Instance ne prend pas en charge." }
        b: { en: "Event alerts aren't supported on Managed Instance either, and error 1105 would only fire once space has already run out.", fr: "Les alertes d'événement ne sont pas non plus prises en charge sur Managed Instance, et l'erreur 1105 ne se déclencherait qu'une fois l'espace déjà épuisé." }
        d: { en: "Job notifications report job outcomes; they don't monitor the storage used by the instance.", fr: "Les notifications de travaux signalent le résultat des travaux ; elles ne surveillent pas le stockage utilisé par l'instance." }
    references:
      - title: Automate management tasks using SQL Agent jobs in Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/job-automation-managed-instance
      - title: Azure SQL Managed Instance monitoring data reference
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/monitoring-sql-managed-instance-azure-monitor-reference

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-41-08
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have SQL Server 2022 on an Azure virtual machine named **SQLVM4**. SQL Server Agent uses the default history settings. SQLVM4 has 30 jobs, and one of them, **PollQueue**, runs every minute.

        You notice the following issues:

        - The history of the weekly maintenance jobs disappears a few days after each run.
        - When a step of a weekly job fails, the message in the job history is cut off before the cause of the error.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM4**. SQL Server Agent utilise les paramètres d'historique par défaut. SQLVM4 compte 30 travaux, et l'un d'eux, **PollQueue**, s'exécute chaque minute.

        Vous constatez les problèmes suivants :

        - L'historique des travaux de maintenance hebdomadaires disparaît quelques jours après chaque exécution.
        - Quand une étape d'un travail hebdomadaire échoue, le message de l'historique du travail est tronqué avant la cause de l'erreur.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "With the default settings, msdb keeps at most 100 history rows for PollQueue."
            fr: "Avec les paramètres par défaut, msdb conserve au maximum 100 lignes d'historique pour PollQueue."
        - id: s2
          text:
            en: "Raising only the maximum number of history rows per job to 300 ensures that each of the 30 jobs keeps 300 history rows."
            fr: "Augmenter uniquement le nombre maximal de lignes d'historique par travail à 300 garantit que chacun des 30 travaux conserve 300 lignes d'historique."
        - id: s3
          text:
            en: "Configuring the failing steps to log their output to a table stores the full output of their latest run in msdb, outside the job history rows."
            fr: "Configurer les étapes qui échouent pour journaliser leur sortie dans une table stocke la sortie complète de leur dernière exécution dans msdb, en dehors des lignes d'historique du travail."
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          By default, SQL Server Agent keeps at most 1,000 history rows in total and 100 rows per job, so PollQueue keeps its last 100 rows. Both limits apply together: 30 jobs at 300 rows would need 9,000 rows, far above the total limit of 1,000, so the oldest rows would still be removed. Logging step output to a table (`@flags` 8 or 16 of `sp_add_jobstep`, or the **Advanced** page of the step) stores it in `msdb.dbo.sysjobstepslogs`, whose `log` column is `nvarchar(max)`, outside the truncated history message.
        fr: |
          Par défaut, SQL Server Agent conserve au maximum 1 000 lignes d'historique au total et 100 lignes par travail : PollQueue garde donc ses 100 dernières lignes. Les deux limites s'appliquent ensemble : 30 travaux à 300 lignes exigeraient 9 000 lignes, bien au-dessus de la limite totale de 1 000, donc les lignes les plus anciennes seraient toujours supprimées. Journaliser la sortie de l'étape dans une table (`@flags` 8 ou 16 de `sp_add_jobstep`, ou la page **Avancé** de l'étape) la stocke dans `msdb.dbo.sysjobstepslogs`, dont la colonne `log` est de type `nvarchar(max)`, en dehors du message d'historique tronqué.
      options:
        s2: { en: "The total limit of the history log must be raised too; the per-job limit alone doesn't prevent the purge.", fr: "La limite totale du journal d'historique doit aussi être augmentée ; la limite par travail seule n'empêche pas la purge." }
    references:
      - title: Resize the job history log
        url: https://learn.microsoft.com/en-us/ssms/agent/resize-the-job-history-log
      - title: dbo.sysjobstepslogs (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-tables/dbo-sysjobstepslogs-transact-sql

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-41-09
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum's finance team closes its books on the last Friday of each month. On SQL Server 2022 hosted on an Azure virtual machine named **SQLVM6**, a SQL Server Agent job named **MonthEndCheck** checks the integrity of the finance databases once the close is over.

        You create a dedicated schedule for MonthEndCheck. It must start the job at 23:00 on the last Friday of every month, including the months that contain five Fridays.

        How should you complete the Transact-SQL script? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe financière d'Adatum clôture ses comptes le dernier vendredi de chaque mois. Sur SQL Server 2022 hébergé sur une machine virtuelle Azure nommée **SQLVM6**, un travail SQL Server Agent nommé **MonthEndCheck** vérifie l'intégrité des bases de données financières une fois la clôture terminée.

        Vous créez une planification dédiée pour MonthEndCheck. Elle doit démarrer le travail à 23:00 le dernier vendredi de chaque mois, y compris les mois qui comptent cinq vendredis.

        Comment devez-vous compléter le script Transact-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        EXEC msdb.dbo.sp_add_schedule
             @schedule_name = N'Last Friday 23:00',
             @freq_type = [[type]],
             @freq_interval = [[day]],
             @freq_relative_interval = [[which]],
             @freq_recurrence_factor = 1,
             @active_start_time = 230000;
        EXEC msdb.dbo.sp_attach_schedule
             @job_name = N'MonthEndCheck',
             @schedule_name = N'Last Friday 23:00';
      slots:
        - id: type
          options:
            - { id: t8, text: "8" }
            - { id: t16, text: "16" }
            - { id: t32, text: "32" }
        - id: day
          options:
            - { id: d5, text: "5" }
            - { id: d6, text: "6" }
            - { id: d32, text: "32" }
            - { id: d64, text: "64" }
        - id: which
          options:
            - { id: w1, text: "1" }
            - { id: w4, text: "4" }
            - { id: w8, text: "8" }
            - { id: w16, text: "16" }
    answer:
      values: { type: t32, day: d6, which: w16 }
    explanation:
      correct:
        en: |
          A schedule relative to the days of the month uses `@freq_type = 32` (monthly, relative to `@freq_interval`). With this type, `@freq_interval` names the day as a number from 1 (Sunday) to 7 (Saturday), so Friday is 6, and `@freq_relative_interval = 16` selects the last occurrence in the month. `@freq_recurrence_factor = 1` repeats it every month.
        fr: |
          Une planification relative aux jours du mois utilise `@freq_type = 32` (mensuelle, relative à `@freq_interval`). Avec ce type, `@freq_interval` désigne le jour par un nombre de 1 (dimanche) à 7 (samedi) : vendredi vaut 6, et `@freq_relative_interval = 16` sélectionne la dernière occurrence du mois. `@freq_recurrence_factor = 1` la répète chaque mois.
      options:
        t8: { en: "8 is a weekly schedule; it can't select the last Friday of the month.", fr: "8 est une planification hebdomadaire ; elle ne peut pas sélectionner le dernier vendredi du mois." }
        t16: { en: "16 is monthly on a fixed day number (for example the 25th), not on a relative weekday.", fr: "16 est mensuelle sur un numéro de jour fixe (par exemple le 25), pas sur un jour de la semaine relatif." }
        d32: { en: "32 is Friday in the bit mask of weekly schedules, not in monthly relative schedules.", fr: "32 est le vendredi dans le masque de bits des planifications hebdomadaires, pas dans les planifications mensuelles relatives." }
        w8: { en: "8 selects the fourth occurrence, which isn't the last one in months with five Fridays.", fr: "8 sélectionne la quatrième occurrence, qui n'est pas la dernière les mois qui comptent cinq vendredis." }
    references:
      - title: sp_add_schedule (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-add-schedule-transact-sql

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-41-10
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have SQL Server 2022 on an Azure virtual machine named **SQLVM5**. A stored procedure named **dbo.PostInvoices** runs `RAISERROR (50120, 16, 1);` when a batch of invoices is rejected. Message 50120 was added with `sp_addmessage` and default options. The procedure runs under a login that isn't a member of sysadmin.

        A SQL Server Agent alert on message 50120 notifies an operator named **DBA-Team** by email. Applications receive the error, but the alert never fires. Other alerts on SQLVM5 send their emails. You can't modify dbo.PostInvoices.

        You need the alert to fire every time message 50120 is raised. What should you do?
      fr: |
        Vous disposez de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM5**. Une procédure stockée nommée **dbo.PostInvoices** exécute `RAISERROR (50120, 16, 1);` quand un lot de factures est rejeté. Le message 50120 a été ajouté avec `sp_addmessage` et les options par défaut. La procédure s'exécute sous une connexion qui n'est pas membre de sysadmin.

        Une alerte SQL Server Agent sur le message 50120 avertit par e-mail un opérateur nommé **DBA-Team**. Les applications reçoivent l'erreur, mais l'alerte ne se déclenche jamais. Les autres alertes de SQLVM5 envoient leurs e-mails. Vous ne pouvez pas modifier dbo.PostInvoices.

        Vous devez faire en sorte que l'alerte se déclenche chaque fois que le message 50120 est déclenché. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run `sp_altermessage 50120, 'WITH_LOG', 'true'` so that the message is always written to the application log.", fr: "Exécuter `sp_altermessage 50120, 'WITH_LOG', 'true'` pour que le message soit toujours écrit dans le journal des applications." } }
        - { id: b, text: { en: "Change the alert so that it fires on severity 16 instead of message 50120, for every database.", fr: "Modifier l'alerte pour qu'elle se déclenche sur la gravité 16 au lieu du message 50120, pour toutes les bases." } }
        - { id: c, text: { en: "Designate DBA-Team as the fail-safe operator in the Alert System page of the SQL Server Agent properties.", fr: "Désigner DBA-Team comme opérateur de prévention de défaillance dans la page Système d'alerte des propriétés de SQL Server Agent." } }
        - { id: d, text: { en: "Run `sp_update_alert` with `@include_event_description_in = 1` so that the email contains the error text.", fr: "Exécuter `sp_update_alert` avec `@include_event_description_in = 1` pour que l'e-mail contienne le texte de l'erreur." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          SQL Server Agent alerts fire only on errors written to the Windows application log, and by default user-defined messages of severity lower than 19 aren't sent to that log, so they trigger no alert. `sp_altermessage` with `WITH_LOG` set to `true` makes SQL Server write message 50120 to the log every time it is raised, even by a `RAISERROR` without `WITH LOG`, so the procedure doesn't change.
        fr: |
          Les alertes SQL Server Agent ne se déclenchent que sur des erreurs écrites dans le journal des applications Windows, et par défaut les messages définis par l'utilisateur de gravité inférieure à 19 n'y sont pas envoyés : ils ne déclenchent donc aucune alerte. `sp_altermessage` avec `WITH_LOG` à `true` fait écrire le message 50120 dans le journal par SQL Server chaque fois qu'il est déclenché, même par un `RAISERROR` sans `WITH LOG` : la procédure ne change pas.
      options:
        b: { en: "A severity alert also reads the application log, and severity 16 errors that aren't logged still never reach it; the alert would also fire on unrelated errors.", fr: "Une alerte de gravité lit aussi le journal des applications, et les erreurs de gravité 16 non journalisées ne l'atteignent toujours pas ; l'alerte se déclencherait en outre sur des erreurs sans rapport." }
        c: { en: "The fail-safe operator receives notifications when other operators can't be reached; it doesn't make an alert fire.", fr: "L'opérateur de prévention de défaillance reçoit les notifications quand les autres opérateurs ne peuvent pas être joints ; il ne fait pas se déclencher une alerte." }
        d: { en: "This option only controls whether the error text is included in the notification; the alert still never fires.", fr: "Cette option ne contrôle que l'inclusion du texte de l'erreur dans la notification ; l'alerte ne se déclenche toujours pas." }
    references:
      - title: sys.sp_altermessage (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-altermessage-transact-sql
      - title: Create a User-Defined Event
        url: https://learn.microsoft.com/en-us/ssms/agent/create-a-user-defined-event
