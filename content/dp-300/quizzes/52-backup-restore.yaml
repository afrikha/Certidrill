chapter: 52-backup-restore
questions:
- id: dp300-qz-52-01
  objective: 5.2.1
  difficulty: 1
  status: draft
  type: single
  stem:
    en: |
      Northwind runs SQL Server 2022 on an Azure virtual machine. Every night, a job loads large files into a database named **StagingDb** by using `BULK INSERT`. The database administrators want these bulk loads to be minimally logged, and transaction log backups of StagingDb must continue.

      Which recovery model should StagingDb use during the bulk loads?
    fr: |
      Northwind exécute SQL Server 2022 sur une machine virtuelle Azure. Chaque nuit, un travail charge de gros fichiers dans une base de données nommée **StagingDb** avec `BULK INSERT`. Les administrateurs de base de données veulent que ces chargements en bloc soient journalisés de façon minimale, et les sauvegardes du journal des transactions de StagingDb doivent continuer.

      Quel mode de récupération StagingDb doit-elle utiliser pendant les chargements en bloc ?
  body:
    options:
    - id: a
      text: SIMPLE
    - id: b
      text: BULK_LOGGED
    - id: c
      text: FULL
  answer:
    optionId: b
  explanation:
    correct:
      en: |
        The bulk-logged recovery model uses minimal logging for most bulk operations and still requires transaction log backups. The trade-off is the restore: a log backup that contains minimally logged operations can be restored only to its end, not to a point in time inside it.
      fr: |
        Le mode de récupération utilisant les journaux de transactions (BULK_LOGGED) journalise de façon minimale la plupart des opérations en bloc et exige toujours des sauvegardes du journal des transactions. La contrepartie concerne la restauration : une sauvegarde de journal qui contient des opérations journalisées de façon minimale ne peut être restaurée que jusqu'à sa fin, pas jusqu'à un point dans le temps à l'intérieur.
    options:
      a:
        en: The simple recovery model also logs bulk operations minimally, but it doesn't support transaction log backups.
        fr: Le mode de récupération simple journalise lui aussi les opérations en bloc de façon minimale, mais il ne prend pas en charge les sauvegardes du journal des transactions.
      c:
        en: The full recovery model supports log backups, but it fully logs bulk operations.
        fr: Le mode de récupération complète prend en charge les sauvegardes de journal, mais journalise entièrement les opérations en bloc.
  references:
  - title: Recovery models (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/recovery-models-sql-server
- id: dp300-qz-52-02
  objective: 5.2.4
  difficulty: 1
  status: draft
  type: single
  stem:
    en: |
      You have an Azure SQL database named **SalesDb** on a logical server named **srv-sales** in a resource group named **rg-data**. SalesDb wasn't deleted.

      You need to use the Azure CLI to create a database named **SalesDb_0910** on srv-sales that contains SalesDb as it was on November 24, 2026, at 09:10 UTC.

      Which command should you run?
    fr: |
      Vous disposez d'une base de données Azure SQL nommée **SalesDb** sur un serveur logique nommé **srv-sales** dans un groupe de ressources nommé **rg-data**. SalesDb n'a pas été supprimée.

      Vous devez utiliser Azure CLI pour créer sur srv-sales une base nommée **SalesDb_0910** qui contient SalesDb telle qu'elle était le 24 novembre 2026 à 09:10 UTC.

      Quelle commande devez-vous exécuter ?
  body:
    options:
    - id: a
      text: az sql db copy --resource-group rg-data --server srv-sales --name SalesDb --dest-name SalesDb_0910
    - id: b
      text: az sql midb restore --resource-group rg-data --managed-instance srv-sales --name SalesDb --dest-name SalesDb_0910 --time "2026-11-24T09:10:00"
    - id: c
      text: az sql db restore --resource-group rg-data --server srv-sales --name SalesDb --dest-name SalesDb_0910 --deleted-time "2026-11-24T09:10:00"
    - id: d
      text: az sql db restore --resource-group rg-data --server srv-sales --name SalesDb --dest-name SalesDb_0910 --time "2026-11-24T09:10:00"
  answer:
    optionId: d
  explanation:
    correct:
      en: |
        `az sql db restore` with `--time` runs a point-in-time restore: it creates a new database, named by `--dest-name`, on the same logical server, from the automated backups of the source database.
      fr: |
        `az sql db restore` avec `--time` effectue une restauration à un point dans le temps : il crée une nouvelle base, nommée par `--dest-name`, sur le même serveur logique, à partir des sauvegardes automatisées de la base source.
    options:
      a:
        en: az sql db copy creates a transactionally consistent copy of SalesDb as it is now, not as it was at 09:10.
        fr: az sql db copy crée une copie transactionnellement cohérente de SalesDb dans son état actuel, pas dans son état de 09:10.
      b:
        en: az sql midb restore restores a database of Azure SQL Managed Instance, not of a logical server.
        fr: az sql midb restore restaure une base d'Azure SQL Managed Instance, pas d'un serveur logique.
      c:
        en: --deleted-time restores a deleted database and must match its deletion time; SalesDb still exists.
        fr: --deleted-time restaure une base supprimée et doit correspondre à son heure de suppression ; SalesDb existe toujours.
  references:
  - title: az sql db
    url: https://learn.microsoft.com/en-us/cli/azure/sql/db
  - title: Restore a database from a backup in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
- id: dp300-qz-52-03
  objective: 5.2.1
  difficulty: 2
  status: draft
  type: single
  stem:
    en: |
      Contoso has an Azure SQL Database Hyperscale database named **EventsDb** that was created with geo-redundant backup storage. A new data residency policy requires the backups of EventsDb to stay in the Azure region of the database. Downtime must be minimized.

      What should you do?
    fr: |
      Contoso dispose d'une base de données Azure SQL Database Hyperscale nommée **EventsDb**, créée avec un stockage de sauvegarde géoredondant. Une nouvelle stratégie de résidence des données exige que les sauvegardes d'EventsDb restent dans la région Azure de la base. Le temps d'arrêt doit être réduit au minimum.

      Que devez-vous faire ?
  body:
    options:
    - id: a
      text:
        en: Change the backup storage redundancy of EventsDb to zone-redundant, and wait for the existing backups to expire.
        fr: Changer la redondance du stockage de sauvegarde d'EventsDb en redondant interzone, puis attendre l'expiration des sauvegardes existantes.
    - id: b
      text:
        en: Configure a long-term retention policy for EventsDb that keeps its backups in zone-redundant storage.
        fr: Configurer pour EventsDb une stratégie de rétention à long terme qui conserve ses sauvegardes dans un stockage redondant interzone.
    - id: c
      text:
        en: Create a copy of EventsDb that uses zone-redundant backup storage, and then move the applications to the copy.
        fr: Créer une copie d'EventsDb qui utilise un stockage de sauvegarde redondant interzone, puis faire basculer les applications vers la copie.
    - id: d
      text:
        en: Set the point-in-time restore retention of EventsDb to one day so that its geo-redundant backups expire.
        fr: Réduire à un jour la rétention de restauration à un point dans le temps d'EventsDb pour que ses sauvegardes géoredondantes expirent.
  answer:
    optionId: c
  explanation:
    correct:
      en: |
        For Hyperscale, the backup storage redundancy can be set only when the database is created. To move to zone-redundant (or locally redundant) backup storage with little downtime, you create a new database with the required redundancy, for example a database copy or a geo-replica, and move the applications to it.
      fr: |
        Pour Hyperscale, la redondance du stockage de sauvegarde ne se définit qu'à la création de la base. Pour passer à un stockage de sauvegarde redondant interzone (ou localement redondant) avec un temps d'arrêt réduit, vous créez une nouvelle base avec la redondance exigée, par exemple une copie de la base ou un géoréplica, puis vous y faites basculer les applications.
    options:
      a:
        en: That change works for the other service tiers, where it applies to future backups only; a Hyperscale database can't change its backup storage redundancy after creation.
        fr: Ce changement fonctionne pour les autres niveaux de service, où il ne s'applique qu'aux sauvegardes futures ; une base Hyperscale ne peut pas changer la redondance de son stockage de sauvegarde après sa création.
      b:
        en: Long-term retention doesn't change where the point-in-time restore backups of EventsDb are stored.
        fr: La rétention à long terme ne change pas l'emplacement des sauvegardes de restauration à un point dans le temps d'EventsDb.
      d:
        en: A shorter retention removes old backups, but the new backups are still written to geo-redundant storage.
        fr: Une rétention plus courte supprime les anciennes sauvegardes, mais les nouvelles sont toujours écrites dans un stockage géoredondant.
  references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
- id: dp300-qz-52-04
  objective: 5.2.3
  difficulty: 2
  status: draft
  type: single
  stem:
    en: |
      Fabrikam runs SQL Server 2022 on an Azure virtual machine named **SQLVM1**. The full backups of a database named **PatientsDb** are encrypted with AES_256 by a server certificate named **BackupCert** in the master database of SQLVM1.

      You copy the latest backup file to a new virtual machine named **SQLVM2** that runs SQL Server 2022, and you run `RESTORE DATABASE PatientsDb FROM DISK = N'F:\Restore\PatientsDb_full.bak'`. The restore fails because the certificate can't be found. SQLVM1 is still available.

      You need to restore PatientsDb on SQLVM2.

      What should you do?
    fr: |
      Fabrikam exécute SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM1**. Les sauvegardes complètes d'une base de données nommée **PatientsDb** sont chiffrées en AES_256 par un certificat de serveur nommé **BackupCert** dans la base master de SQLVM1.

      Vous copiez le dernier fichier de sauvegarde sur une nouvelle machine virtuelle nommée **SQLVM2** qui exécute SQL Server 2022, puis vous exécutez `RESTORE DATABASE PatientsDb FROM DISK = N'F:\Restore\PatientsDb_full.bak'`. La restauration échoue, car le certificat est introuvable. SQLVM1 est toujours disponible.

      Vous devez restaurer PatientsDb sur SQLVM2.

      Que devez-vous faire ?
  body:
    options:
    - id: a
      text:
        en: Create a certificate named BackupCert in master on SQLVM2, and then add the ENCRYPTION option to the RESTORE statement.
        fr: Créer un certificat nommé BackupCert dans master sur SQLVM2, puis ajouter l'option ENCRYPTION à l'instruction RESTORE.
    - id: b
      text:
        en: Back up BackupCert with its private key on SQLVM1, and then recreate the certificate from those files on SQLVM2.
        fr: Sauvegarder BackupCert avec sa clé privée sur SQLVM1, puis recréer le certificat à partir de ces fichiers sur SQLVM2.
    - id: c
      text:
        en: Back up the service master key of SQLVM1, and then restore that service master key on SQLVM2 before the restore.
        fr: Sauvegarder la clé principale du service de SQLVM1, puis restaurer cette clé principale du service sur SQLVM2 avant la restauration.
    - id: d
      text:
        en: Create a database master key in master on SQLVM2, and then add the CREDENTIAL option to the RESTORE statement.
        fr: Créer une clé principale de base de données dans master sur SQLVM2, puis ajouter l'option CREDENTIAL à l'instruction RESTORE.
  answer:
    optionId: b
  explanation:
    correct:
      en: |
        An encrypted backup can be restored only on an instance that has the same certificate, with its private key. You back up BackupCert and its private key on SQLVM1, create a database master key in master on SQLVM2, create the certificate from the backup files, and then run the same RESTORE statement: it needs no encryption option.
      fr: |
        Une sauvegarde chiffrée ne peut être restaurée que sur une instance qui possède le même certificat, avec sa clé privée. Vous sauvegardez BackupCert et sa clé privée sur SQLVM1, créez une clé principale de base de données dans master sur SQLVM2, créez le certificat à partir des fichiers de sauvegarde, puis exécutez la même instruction RESTORE : elle n'exige aucune option de chiffrement.
    options:
      a:
        en: A new certificate with the same name has a different key and thumbprint, so it can't decrypt the backup; RESTORE has no ENCRYPTION option either.
        fr: 'Un nouveau certificat portant le même nom a une clé et une empreinte différentes : il ne peut pas déchiffrer la sauvegarde ; RESTORE n''a pas non plus d''option ENCRYPTION.'
      c:
        en: 'The service master key doesn''t contain BackupCert: the certificate is stored in master and must be backed up and recreated itself.'
        fr: 'La clé principale du service ne contient pas BackupCert : le certificat est stocké dans master et doit lui-même être sauvegardé et recréé.'
      d:
        en: A master key alone doesn't provide the certificate, and the CREDENTIAL option is for backups to URL that use an access key.
        fr: Une clé principale seule ne fournit pas le certificat, et l'option CREDENTIAL sert aux sauvegardes vers une URL qui utilisent une clé d'accès.
  references:
  - title: Backup encryption
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/backup-encryption
- id: dp300-qz-52-05
  objective: 5.2.2
  difficulty: 2
  status: draft
  type: single
  stem:
    en: |
      You are migrating a database named **SalesDb** from SQL Server 2022 on an Azure virtual machine named **SQLVM1** to SQL Server 2022 on a virtual machine named **SQLVM2**. SalesDb uses the full recovery model. You already restored a full backup and all the log backups of SalesDb on SQLVM2 by using NORECOVERY.

      At cutover, the applications are stopped. You need to take the last log backup of SalesDb on SQLVM1. The backup must contain every remaining transaction, and SalesDb on SQLVM1 must not accept any change after the backup.

      Which statement should you run on SQLVM1?
    fr: |
      Vous migrez une base de données nommée **SalesDb** de SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM1** vers SQL Server 2022 sur une machine virtuelle nommée **SQLVM2**. SalesDb utilise le mode de récupération complète. Vous avez déjà restauré une sauvegarde complète et toutes les sauvegardes de journal de SalesDb sur SQLVM2 avec NORECOVERY.

      Au basculement, les applications sont arrêtées. Vous devez prendre la dernière sauvegarde de journal de SalesDb sur SQLVM1. La sauvegarde doit contenir toutes les transactions restantes, et SalesDb sur SQLVM1 ne doit accepter aucune modification après la sauvegarde.

      Quelle instruction devez-vous exécuter sur SQLVM1 ?
  body:
    options:
    - id: a
      text: BACKUP LOG SalesDb TO DISK = N'F:\Mig\SalesDb_tail.trn' WITH COPY_ONLY;
    - id: b
      text: BACKUP LOG SalesDb TO DISK = N'F:\Mig\SalesDb_tail.trn' WITH NO_TRUNCATE;
    - id: c
      text: BACKUP LOG SalesDb TO DISK = N'F:\Mig\SalesDb_tail.trn' WITH NORECOVERY;
    - id: d
      text: BACKUP DATABASE SalesDb TO DISK = N'F:\Mig\SalesDb_tail.bak' WITH DIFFERENTIAL;
  answer:
    optionId: c
  explanation:
    correct:
      en: |
        A tail-log backup of an online database taken WITH NORECOVERY backs up the remaining log and puts the database in the RESTORING state, which guarantees that it doesn't change after the backup. You then restore this last log backup on SQLVM2 WITH RECOVERY.
      fr: |
        Une sauvegarde de la fin du journal d'une base en ligne prise WITH NORECOVERY sauvegarde le journal restant et place la base dans l'état RESTORING, ce qui garantit qu'elle ne change plus après la sauvegarde. Vous restaurez ensuite cette dernière sauvegarde de journal sur SQLVM2 WITH RECOVERY.
    options:
      a:
        en: A copy-only log backup doesn't truncate the log and leaves SalesDb online, so it could still be modified on SQLVM1.
        fr: 'Une sauvegarde de journal en copie seule ne tronque pas le journal et laisse SalesDb en ligne : elle pourrait encore être modifiée sur SQLVM1.'
      b:
        en: NO_TRUNCATE is for a damaged or offline database; it leaves an online SalesDb available for changes.
        fr: NO_TRUNCATE est réservé à une base endommagée ou hors ligne ; il laisse une base SalesDb en ligne modifiable.
      d:
        en: A differential backup can't be applied on top of log backups already restored, and it leaves SalesDb online.
        fr: Une sauvegarde différentielle ne peut pas être appliquée après des sauvegardes de journal déjà restaurées, et elle laisse SalesDb en ligne.
  references:
  - title: Tail-log backups (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/tail-log-backups-sql-server
- id: dp300-qz-52-06
  objective: 5.2.5
  difficulty: 3
  status: draft
  type: single
  stem:
    en: |
      Litware has an Azure subscription named **Sub1** that contains two logical servers named **srv-legal** and **srv-dr**. A database named **ContractsDb** on srv-legal had a point-in-time restore retention of 35 days, geo-redundant backup storage, and a long-term retention policy that keeps monthly backups for 10 years. Litware also has a subscription named **Sub2** that contains a logical server named **srv-archive**.

      Yesterday, an administrator deleted srv-legal by mistake.

      You need to recover ContractsDb with the most recent data possible.

      What should you do?
    fr: |
      Litware dispose d'un abonnement Azure nommé **Sub1** qui contient deux serveurs logiques nommés **srv-legal** et **srv-dr**. Une base de données nommée **ContractsDb** sur srv-legal avait une rétention de restauration à un point dans le temps de 35 jours, un stockage de sauvegarde géoredondant et une stratégie de rétention à long terme qui conserve les sauvegardes mensuelles pendant 10 ans. Litware dispose aussi d'un abonnement nommé **Sub2** qui contient un serveur logique nommé **srv-archive**.

      Hier, un administrateur a supprimé srv-legal par erreur.

      Vous devez récupérer ContractsDb avec les données les plus récentes possibles.

      Que devez-vous faire ?
  body:
    options:
    - id: a
      text:
        en: Create a logical server named srv-legal in Sub1, and then restore ContractsDb from its Deleted databases list.
        fr: Créer un serveur logique nommé srv-legal dans Sub1, puis restaurer ContractsDb à partir de sa liste Bases de données supprimées.
    - id: b
      text:
        en: Geo-restore ContractsDb from its geo-redundant backups to srv-dr, selecting the time of the deletion.
        fr: Géorestaurer ContractsDb à partir de ses sauvegardes géoredondantes vers srv-dr, en choisissant l'heure de la suppression.
    - id: c
      text:
        en: Restore the most recent long-term retention backup of ContractsDb to srv-archive in Sub2.
        fr: Restaurer la sauvegarde de rétention à long terme la plus récente de ContractsDb vers srv-archive dans Sub2.
    - id: d
      text:
        en: Restore the most recent long-term retention backup of ContractsDb to srv-dr in Sub1.
        fr: Restaurer la sauvegarde de rétention à long terme la plus récente de ContractsDb vers srv-dr dans Sub1.
  answer:
    optionId: d
  explanation:
    correct:
      en: |
        Deleting a logical server deletes its databases with their point-in-time restore backups, and a deleted server can't be restored. Long-term retention backups are kept, and they can be restored as a new database to any server of the same subscription, here srv-dr. The latest monthly LTR backup is the most recent data still available.
      fr: |
        La suppression d'un serveur logique supprime ses bases avec leurs sauvegardes de restauration à un point dans le temps, et un serveur supprimé ne peut pas être restauré. Les sauvegardes de rétention à long terme sont conservées et peuvent être restaurées comme nouvelle base sur n'importe quel serveur du même abonnement, ici srv-dr. La dernière sauvegarde LTR mensuelle contient les données les plus récentes encore disponibles.
    options:
      a:
        en: 'A new server with the same name is a different resource: the deleted databases of the old server and their backups aren''t available to it.'
        fr: 'Un nouveau serveur portant le même nom est une autre ressource : les bases supprimées de l''ancien serveur et leurs sauvegardes ne lui sont pas accessibles.'
      b:
        en: Geo-restore uses the automated backups of an existing database; they were deleted with the server, and geo-restore doesn't select a point in time.
        fr: La géorestauration utilise les sauvegardes automatisées d'une base existante ; elles ont été supprimées avec le serveur, et la géorestauration ne permet pas de choisir un point dans le temps.
      c:
        en: A long-term retention backup can be restored only to a server or managed instance in the same subscription as the original database.
        fr: Une sauvegarde de rétention à long terme ne peut être restaurée que sur un serveur ou une instance managée du même abonnement que la base d'origine.
  references:
  - title: Long-term retention backups - Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/long-term-retention-overview
  - title: Restore a database from a backup in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
- id: dp300-qz-52-07
  objective: 5.2.6
  difficulty: 3
  status: draft
  type: single
  stem:
    en: |
      Adatum runs SQL Server 2022 on an Azure virtual machine named **SQLVM4**. SQLVM4 hosts a test database named **Billing_QA** that uses the full recovery model. Every month, you refresh Billing_QA from the latest full backup of the production database **Billing**. Changes made in Billing_QA since the previous refresh can be discarded.

      You run the following statement, and it fails with an error that states that the tail of the log of Billing_QA hasn't been backed up.

      ```sql
      RESTORE DATABASE Billing_QA
      FROM DISK = N'F:\Refresh\Billing_full.bak'
      WITH MOVE N'Billing' TO N'G:\Data\Billing_QA.mdf',
           MOVE N'Billing_log' TO N'H:\Log\Billing_QA.ldf',
           RECOVERY;
      ```

      You need to refresh Billing_QA. The solution must minimize administrative effort.

      What should you do?
    fr: |
      Adatum exécute SQL Server 2022 sur une machine virtuelle Azure nommée **SQLVM4**. SQLVM4 héberge une base de données de test nommée **Billing_QA** qui utilise le mode de récupération complète. Chaque mois, vous actualisez Billing_QA à partir de la dernière sauvegarde complète de la base de production **Billing**. Les modifications apportées à Billing_QA depuis l'actualisation précédente peuvent être abandonnées.

      Vous exécutez l'instruction suivante, et elle échoue avec une erreur qui indique que la fin du journal de Billing_QA n'a pas été sauvegardée.

      ```sql
      RESTORE DATABASE Billing_QA
      FROM DISK = N'F:\Refresh\Billing_full.bak'
      WITH MOVE N'Billing' TO N'G:\Data\Billing_QA.mdf',
           MOVE N'Billing_log' TO N'H:\Log\Billing_QA.ldf',
           RECOVERY;
      ```

      Vous devez actualiser Billing_QA. La solution doit réduire au minimum l'effort d'administration.

      Que devez-vous faire ?
  body:
    options:
    - id: a
      text:
        en: Replace the RECOVERY option with NORECOVERY, and run the statement again.
        fr: Remplacer l'option RECOVERY par NORECOVERY, puis exécuter de nouveau l'instruction.
    - id: b
      text:
        en: Add the CONTINUE_AFTER_ERROR option to the WITH clause, and run the statement again.
        fr: Ajouter l'option CONTINUE_AFTER_ERROR à la clause WITH, puis exécuter de nouveau l'instruction.
    - id: c
      text:
        en: Run RESTORE DATABASE Billing_QA WITH RECOVERY, and then run the statement again.
        fr: Exécuter RESTORE DATABASE Billing_QA WITH RECOVERY, puis exécuter de nouveau l'instruction.
    - id: d
      text:
        en: Add the REPLACE option to the WITH clause, and run the statement again.
        fr: Ajouter l'option REPLACE à la clause WITH, puis exécuter de nouveau l'instruction.
  answer:
    optionId: d
  explanation:
    correct:
      en: |
        For a database in the full or bulk-logged recovery model, RESTORE DATABASE refuses to overwrite it until the tail of the log is backed up, unless WITH REPLACE is specified. REPLACE also bypasses the safety check that blocks restoring a backup of another database (Billing) over an existing database with a different name (Billing_QA). Because the changes in Billing_QA can be discarded, REPLACE is the simplest fix.
      fr: |
        Pour une base en mode de récupération complète ou utilisant les journaux de transactions, RESTORE DATABASE refuse de la remplacer tant que la fin du journal n'est pas sauvegardée, sauf si WITH REPLACE est spécifié. REPLACE contourne aussi le contrôle de sécurité qui bloque la restauration de la sauvegarde d'une autre base (Billing) sur une base existante d'un nom différent (Billing_QA). Comme les modifications de Billing_QA peuvent être abandonnées, REPLACE est la correction la plus simple.
    options:
      a:
        en: NORECOVERY only leaves the restored database in the RESTORING state; the tail-log check still blocks the restore.
        fr: NORECOVERY laisse seulement la base restaurée dans l'état RESTORING ; le contrôle de la fin du journal bloque toujours la restauration.
      b:
        en: CONTINUE_AFTER_ERROR lets a restore continue past errors in a damaged backup; it doesn't override the tail-log check.
        fr: CONTINUE_AFTER_ERROR permet à une restauration de continuer malgré des erreurs dans une sauvegarde endommagée ; il ne lève pas le contrôle de la fin du journal.
      c:
        en: Billing_QA is online, not restoring, so a RESTORE WITH RECOVERY has nothing to recover and the next attempt fails the same way.
        fr: 'Billing_QA est en ligne, pas en cours de restauration : un RESTORE WITH RECOVERY n''a rien à récupérer et la tentative suivante échoue de la même façon.'
  references:
  - title: RESTORE Statements - Arguments (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-arguments-transact-sql
  - title: Tail-log backups (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/tail-log-backups-sql-server
- id: dp300-qz-52-08
  objective: 5.2.4
  difficulty: 3
  status: draft
  type: dropdown
  stem:
    en: |
      Contoso has an Azure SQL database named **SalesDb** on a logical server named **srv-sales-weu** in West Europe, in a resource group named **rg-weu**. SalesDb uses geo-redundant backup storage and has no geo-replica. A logical server named **srv-sales-neu** exists in North Europe, in a resource group named **rg-neu** of the same subscription.

      West Europe becomes unavailable. You need to recover SalesDb in North Europe as quickly as possible.

      How should you complete the Azure PowerShell script? Select the appropriate options in the answer area.

      NOTE: Each correct selection is worth one point.
    fr: |
      Contoso dispose d'une base de données Azure SQL nommée **SalesDb** sur un serveur logique nommé **srv-sales-weu** dans West Europe, dans un groupe de ressources nommé **rg-weu**. SalesDb utilise un stockage de sauvegarde géoredondant et n'a aucun géoréplica. Un serveur logique nommé **srv-sales-neu** existe dans North Europe, dans un groupe de ressources nommé **rg-neu** du même abonnement.

      West Europe devient indisponible. Vous devez récupérer SalesDb dans North Europe le plus rapidement possible.

      Comment devez-vous compléter le script Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

      Remarque : chaque sélection correcte vaut un point.
  body:
    layout: code
    language: powershell
    template: |
      $backup = [[src]] -ResourceGroupName "rg-weu" -ServerName "srv-sales-weu" -DatabaseName "SalesDb"
      Restore-AzSqlDatabase [[sw]] -ResourceGroupName "rg-neu" -ServerName "[[srv]]" `
          -TargetDatabaseName "SalesDb" -ResourceId $backup.ResourceId
    slots:
    - id: src
      options:
      - id: geo
        text: Get-AzSqlDatabaseGeoBackup
      - id: db
        text: Get-AzSqlDatabase
      - id: del
        text: Get-AzSqlDeletedDatabaseBackup
      - id: ltr
        text: Get-AzSqlDatabaseLongTermRetentionBackup
    - id: sw
      options:
      - id: pit
        text: -FromPointInTimeBackup
      - id: geo
        text: -FromGeoBackup
      - id: del
        text: -FromDeletedDatabaseBackup
      - id: ltr
        text: -FromLongTermRetentionBackup
    - id: srv
      options:
      - id: weu
        text: srv-sales-weu
      - id: neu
        text: srv-sales-neu
  answer:
    values:
      src: geo
      sw: geo
      srv: neu
  explanation:
    correct:
      en: |
        Geo-restore recovers a database from its geo-replicated backups to any logical server in any region of the same subscription, even when the source region is down. Get-AzSqlDatabaseGeoBackup returns the geo-redundant backup of SalesDb, and Restore-AzSqlDatabase -FromGeoBackup creates the database on srv-sales-neu, the target server in North Europe.
      fr: |
        La géorestauration récupère une base à partir de ses sauvegardes géorépliquées sur n'importe quel serveur logique de n'importe quelle région du même abonnement, même quand la région source est hors service. Get-AzSqlDatabaseGeoBackup renvoie la sauvegarde géoredondante de SalesDb, et Restore-AzSqlDatabase -FromGeoBackup crée la base sur srv-sales-neu, le serveur cible de North Europe.
    options:
      pit:
        en: A point-in-time restore creates the database on the same server only, and srv-sales-weu is unavailable.
        fr: Une restauration à un point dans le temps ne crée la base que sur le même serveur, et srv-sales-weu est indisponible.
      db:
        en: Get-AzSqlDatabase returns the live database, which is in the unavailable region; geo-restore needs its geo-redundant backup.
        fr: Get-AzSqlDatabase renvoie la base active, située dans la région indisponible ; la géorestauration a besoin de sa sauvegarde géoredondante.
      ltr:
        en: No long-term retention policy is mentioned, and an LTR backup is weekly at best, so it would lose far more data than the geo-redundant backups.
        fr: 'Aucune stratégie de rétention à long terme n''est mentionnée, et une sauvegarde LTR est au mieux hebdomadaire : elle perdrait bien plus de données que les sauvegardes géoredondantes.'
      weu:
        en: '-ServerName is the target server: the database must be created in North Europe.'
        fr: '-ServerName désigne le serveur cible : la base doit être créée dans North Europe.'
  references:
  - title: Restore-AzSqlDatabase (Az.Sql)
    url: https://learn.microsoft.com/en-us/powershell/module/az.sql/restore-azsqldatabase
  - title: Restore a database from a backup in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
- id: dp300-qz-52-09
  objective: 5.2.7
  difficulty: 3
  status: draft
  type: yesno_statements
  stem:
    en: |
      Fabrikam has an Azure SQL managed instance named **MI1** that uses the SQL Server 2022 update policy. MI1 hosts a database named **Sales** that doesn't use transparent data encryption (TDE). A compressed full backup of Sales is about 500 GB. MI1 has a shared access signature (SAS) credential for a container named **exports**.

      You plan to take a COPY_ONLY backup of Sales to the exports container, and then to restore it on two Azure virtual machines: **VM19**, which runs SQL Server 2019, and **VM22**, which runs SQL Server 2022.

      For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

      NOTE: Each correct selection is worth one point.
    fr: |
      Fabrikam dispose d'une instance managée Azure SQL nommée **MI1** qui utilise la stratégie de mise à jour SQL Server 2022. MI1 héberge une base de données nommée **Sales** qui n'utilise pas le chiffrement transparent des données (TDE). Une sauvegarde complète compressée de Sales fait environ 500 Go. MI1 dispose d'informations d'identification de signature d'accès partagé (SAS) pour un conteneur nommé **exports**.

      Vous prévoyez de prendre une sauvegarde COPY_ONLY de Sales dans le conteneur exports, puis de la restaurer sur deux machines virtuelles Azure : **VM19**, qui exécute SQL Server 2019, et **VM22**, qui exécute SQL Server 2022.

      Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

      Remarque : chaque sélection correcte vaut un point.
  body:
    statements:
    - id: s1
      text:
        en: To stay within the blob size limit, the backup must be striped across at least three URLs.
        fr: Pour respecter la limite de taille des objets blob, la sauvegarde doit être répartie sur au moins trois URL.
    - id: s2
      text:
        en: You can restore the backup on VM19.
        fr: Vous pouvez restaurer la sauvegarde sur VM19.
    - id: s3
      text:
        en: On VM22, you can restore the backup by using a credential that contains the storage account access key.
        fr: Sur VM22, vous pouvez restaurer la sauvegarde avec des informations d'identification qui contiennent la clé d'accès du compte de stockage.
  answer:
    values:
      s1: true
      s2: false
      s3: false
  explanation:
    correct:
      en: |
        A backup stripe written by SQL Managed Instance can't exceed 195 GB, so about 500 GB needs at least three stripes (three of about 167 GB each). A native backup taken on a managed instance that uses the SQL Server 2022 update policy can be restored on SQL Server 2022, not on an earlier version such as SQL Server 2019. The striped backup is made of block blobs written through a SAS credential, and SQL Server reads block blobs through a SAS credential: an access key credential is for single page blobs.
      fr: |
        Une bande de sauvegarde écrite par SQL Managed Instance ne peut pas dépasser 195 Go : environ 500 Go exigent donc au moins trois bandes (trois d'environ 167 Go). Une sauvegarde native prise sur une instance managée qui utilise la stratégie de mise à jour SQL Server 2022 peut être restaurée sur SQL Server 2022, pas sur une version antérieure comme SQL Server 2019. La sauvegarde répartie est constituée d'objets blob de blocs écrits avec des informations d'identification SAS, et SQL Server lit les objets blob de blocs avec des informations d'identification SAS : des informations d'identification avec clé d'accès servent aux objets blob de pages uniques.
    options:
      s2:
        en: SQL Managed Instance has a higher internal database version than SQL Server 2019, so its native backups can't be restored there.
        fr: 'SQL Managed Instance a une version interne de base de données plus élevée que SQL Server 2019 : ses sauvegardes natives ne peuvent pas y être restaurées.'
  references:
  - title: T-SQL differences between SQL Server and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tsql-differences-sql-server
  - title: SQL Server backup to URL for Azure Blob Storage
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/sql-server-backup-to-url
- id: dp300-qz-52-10
  objective: 5.2.1
  difficulty: 3
  status: draft
  type: dropdown
  stem:
    en: |
      Tailspin runs SQL Server 2022 on an Azure virtual machine. A database named **FlightsDb** uses the full recovery model. A SQL Server Agent job takes a full backup of FlightsDb every Sunday at 01:00. No other backup is scheduled.

      You need to complete the backup strategy of FlightsDb to meet the following requirements:

      - If both the data disk and the log disk fail, no more than 15 minutes of committed transactions can be lost.
      - A restore must never have to apply more than 24 hours of transaction log backups.
      - The number of backups and the backup storage must be minimized.

      How should you complete the strategy? Select the appropriate options in the answer area.

      NOTE: Each correct selection is worth one point.
    fr: |
      Tailspin exécute SQL Server 2022 sur une machine virtuelle Azure. Une base de données nommée **FlightsDb** utilise le mode de récupération complète. Un travail SQL Server Agent prend une sauvegarde complète de FlightsDb chaque dimanche à 01:00. Aucune autre sauvegarde n'est planifiée.

      Vous devez compléter la stratégie de sauvegarde de FlightsDb pour répondre aux exigences suivantes :

      - Si le disque de données et le disque de journal tombent tous deux en panne, au plus 15 minutes de transactions validées peuvent être perdues.
      - Une restauration ne doit jamais avoir à appliquer plus de 24 heures de sauvegardes du journal des transactions.
      - Le nombre de sauvegardes et le stockage de sauvegarde doivent être réduits au minimum.

      Comment devez-vous compléter la stratégie ? Sélectionnez les options appropriées dans la zone de réponse.

      Remarque : chaque sélection correcte vaut un point.
  body:
    layout: text
    template:
      en: |
        Differential backups: [[diff]]

        Transaction log backups: [[log]]

        To recover after a failure on Saturday at 18:00, restore: [[chain]]
      fr: |
        Sauvegardes différentielles : [[diff]]

        Sauvegardes du journal des transactions : [[log]]

        Pour récupérer après une panne le samedi à 18:00, restaurer : [[chain]]
    slots:
    - id: diff
      options:
      - id: none
        text:
          en: None
          fr: Aucune
      - id: daily
        text:
          en: Every day at 01:00
          fr: Chaque jour à 01:00
      - id: hourly
        text:
          en: Every hour
          fr: Toutes les heures
    - id: log
      options:
      - id: m5
        text:
          en: Every 5 minutes
          fr: Toutes les 5 minutes
      - id: m15
        text:
          en: Every 15 minutes
          fr: Toutes les 15 minutes
      - id: h1
        text:
          en: Every hour
          fr: Toutes les heures
    - id: chain
      options:
      - id: c1
        text:
          en: The Sunday full backup, then every log backup taken since Sunday
          fr: La sauvegarde complète du dimanche, puis toutes les sauvegardes de journal prises depuis dimanche
      - id: c2
        text:
          en: The Sunday full backup, the Saturday 01:00 differential backup, then the log backups taken since Saturday 01:00
          fr: La sauvegarde complète du dimanche, la sauvegarde différentielle du samedi 01:00, puis les sauvegardes de journal prises depuis samedi 01:00
      - id: c3
        text:
          en: The Sunday full backup, every differential backup taken since Sunday, then the log backups taken since Saturday 01:00
          fr: La sauvegarde complète du dimanche, toutes les sauvegardes différentielles prises depuis dimanche, puis les sauvegardes de journal prises depuis samedi 01:00
      - id: c4
        text:
          en: The Saturday 01:00 differential backup, then the log backups taken since Saturday 01:00
          fr: La sauvegarde différentielle du samedi 01:00, puis les sauvegardes de journal prises depuis samedi 01:00
  answer:
    values:
      diff: daily
      log: m15
      chain: c2
  explanation:
    correct:
      en: |
        When the log disk is lost, no tail-log backup is possible, so the RPO equals the log backup interval: every 15 minutes is the least frequent schedule that meets 15 minutes. A daily differential at 01:00 limits each restore to at most 24 hours of log backups with the fewest extra backups. A differential contains every change since the last full backup, so the restore applies the full backup, only the latest differential, then the log backups taken since that differential.
      fr: |
        Quand le disque de journal est perdu, aucune sauvegarde de la fin du journal n'est possible : le RPO est égal à l'intervalle des sauvegardes de journal, et toutes les 15 minutes est la planification la moins fréquente qui respecte 15 minutes. Une différentielle quotidienne à 01:00 limite chaque restauration à 24 heures de sauvegardes de journal au plus, avec le moins de sauvegardes supplémentaires. Une différentielle contient toutes les modifications depuis la dernière sauvegarde complète : la restauration applique donc la sauvegarde complète, seulement la dernière différentielle, puis les sauvegardes de journal prises depuis cette différentielle.
    options:
      none:
        en: Without differentials, a failure on Saturday requires almost six days of log backups.
        fr: Sans différentielles, une panne le samedi exige près de six jours de sauvegardes de journal.
      hourly:
        en: Hourly differentials also meet the 24-hour limit, but with 24 times more differential backups than needed.
        fr: Des différentielles toutes les heures respectent aussi la limite de 24 heures, mais avec 24 fois plus de sauvegardes différentielles que nécessaire.
      h1:
        en: Hourly log backups could lose up to an hour of transactions.
        fr: Des sauvegardes de journal toutes les heures pourraient perdre jusqu'à une heure de transactions.
      m5:
        en: Every 5 minutes meets the RPO but triples the number of log backups for no requirement.
        fr: Toutes les 5 minutes respecte le RPO, mais triple le nombre de sauvegardes de journal sans exigence qui le justifie.
      c3:
        en: 'Differential backups aren''t cumulative with each other: only the latest one is restored after the full backup.'
        fr: 'Les sauvegardes différentielles ne s''additionnent pas entre elles : seule la plus récente est restaurée après la sauvegarde complète.'
      c4:
        en: A differential backup can only be restored on top of the full backup it's based on.
        fr: Une sauvegarde différentielle ne peut être restaurée qu'après la sauvegarde complète sur laquelle elle repose.
  references:
  - title: Recovery models (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/recovery-models-sql-server
  - title: Tail-log backups (SQL Server)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/backup-restore/tail-log-backups-sql-server
