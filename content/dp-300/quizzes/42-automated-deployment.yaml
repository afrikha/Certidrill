chapter: 42-automated-deployment
questions:
  # ------------------------------------------------------------------ 1
  - id: dp300-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Your team deploys Azure SQL resources by using an ARM template named **sql.json**. The team decides to maintain the template in Bicep from now on and wants a Bicep file generated from sql.json as a starting point.

        Which Azure CLI command should you run?
      fr: |
        Votre équipe déploie des ressources Azure SQL à l'aide d'un modèle ARM nommé **sql.json**. L'équipe décide de maintenir désormais le modèle en Bicep et souhaite un fichier Bicep généré à partir de sql.json comme point de départ.

        Quelle commande Azure CLI devez-vous exécuter ?
    body:
      options:
        - { id: a, text: az bicep build --file sql.json }
        - { id: b, text: az bicep decompile --file sql.json }
        - { id: c, text: az bicep format --file sql.json }
        - { id: d, text: az group export --name rg-sql }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `az bicep decompile` converts an ARM JSON template into a Bicep file (here, sql.bicep in the same folder). The result is a starting point that you review and clean up before you use it.
        fr: |
          `az bicep decompile` convertit un modèle JSON ARM en fichier Bicep (ici, sql.bicep dans le même dossier). Le résultat est un point de départ à relire et à nettoyer avant de l'utiliser.
      options:
        a: { en: "`az bicep build` does the opposite: it compiles a Bicep file into ARM JSON.", fr: "`az bicep build` fait l'inverse : il compile un fichier Bicep en JSON ARM." }
        c: { en: "`az bicep format` reformats an existing Bicep file; it doesn't read JSON templates.", fr: "`az bicep format` remet en forme un fichier Bicep existant ; il ne lit pas les modèles JSON." }
        d: { en: "`az group export` exports the current resources of a resource group as a JSON template, not a Bicep file generated from sql.json.", fr: "`az group export` exporte les ressources actuelles d'un groupe de ressources sous forme de modèle JSON, pas un fichier Bicep généré à partir de sql.json." }
    references:
      - title: Decompile a JSON Azure Resource Manager template to Bicep
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/decompile

  # ------------------------------------------------------------------ 2
  - id: dp300-qz-42-02
    objective: "4.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Yesterday, the service objective of an Azure SQL database named **SalesDB** changed from S2 to S4. Nobody ran a template deployment; you suspect that an administrator ran `az sql db update` from Azure Cloud Shell.

        You need to identify the account that made the change and the time of the change.

        What should you use?
      fr: |
        Hier, l'objectif de service d'une base de données Azure SQL nommée **SalesDB** est passé de S2 à S4. Personne n'a exécuté de déploiement de modèle ; vous soupçonnez qu'un administrateur a exécuté `az sql db update` depuis Azure Cloud Shell.

        Vous devez identifier le compte qui a effectué la modification et l'heure de la modification.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "The Deployments page of the resource group", fr: "La page Déploiements du groupe de ressources" } }
        - { id: b, text: { en: "The Query Store of SalesDB", fr: "Le Magasin des requêtes de SalesDB" } }
        - { id: c, text: { en: "The activity log of SalesDB", fr: "Le journal d'activité de SalesDB" } }
        - { id: d, text: { en: "The az deployment operation group list command", fr: "La commande az deployment operation group list" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The activity log records control-plane operations, such as creating, updating or deleting a resource, with the caller and the time, whatever tool sent the request. A scale operation run with Azure CLI appears there even though no deployment was involved.
        fr: |
          Le journal d'activité enregistre les opérations du plan de contrôle, comme la création, la mise à jour ou la suppression d'une ressource, avec l'appelant et l'heure, quel que soit l'outil qui a envoyé la requête. Une mise à l'échelle exécutée avec Azure CLI y apparaît même sans aucun déploiement.
      options:
        a: { en: "The Deployments page lists template deployments only; a direct `az sql db update` call isn't a deployment.", fr: "La page Déploiements ne liste que les déploiements de modèles ; un appel direct à `az sql db update` n'est pas un déploiement." }
        b: { en: "Query Store records queries run inside the database, not management operations on the database resource.", fr: "Le Magasin des requêtes enregistre les requêtes exécutées dans la base, pas les opérations de gestion sur la ressource de base de données." }
        d: { en: "This command lists the resource operations of a template deployment; there is no deployment to inspect here.", fr: "Cette commande liste les opérations de ressources d'un déploiement de modèle ; il n'y a ici aucun déploiement à examiner." }
    references:
      - title: Activity log in Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/activity-log

  # ------------------------------------------------------------------ 3
  - id: dp300-qz-42-03
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Bicep file named **main.bicep** that deploys a logical server and two databases to a resource group, and a Bicep parameters file named **main.bicepparam** that starts with `using 'main.bicep'`. Both files are on your computer, which has a current version of Azure PowerShell and the Bicep CLI.

        You need to deploy the resources to an existing resource group named **rg-sales** by using main.bicepparam.

        Which command should you run?
      fr: |
        Vous disposez d'un fichier Bicep nommé **main.bicep** qui déploie un serveur logique et deux bases de données dans un groupe de ressources, et d'un fichier de paramètres Bicep nommé **main.bicepparam** qui commence par `using 'main.bicep'`. Les deux fichiers se trouvent sur votre ordinateur, qui dispose d'une version actuelle d'Azure PowerShell et de l'interface CLI Bicep.

        Vous devez déployer les ressources dans un groupe de ressources existant nommé **rg-sales** en utilisant main.bicepparam.

        Quelle commande devez-vous exécuter ?
    body:
      options:
        - { id: a, text: New-AzSubscriptionDeployment -Location westeurope -TemplateParameterFile main.bicepparam }
        - { id: b, text: Test-AzResourceGroupDeployment -ResourceGroupName rg-sales -TemplateParameterFile main.bicepparam }
        - { id: c, text: New-AzResourceGroupDeployment -ResourceGroupName rg-sales -TemplateParameterUri https://contoso.blob.core.windows.net/iac/main.bicepparam }
        - { id: d, text: New-AzResourceGroupDeployment -ResourceGroupName rg-sales -TemplateParameterFile main.bicepparam }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `New-AzResourceGroupDeployment` deploys to a resource group. With a local .bicepparam file passed to `-TemplateParameterFile`, the `using` statement points to main.bicep, so `-TemplateFile` isn't needed.
        fr: |
          `New-AzResourceGroupDeployment` déploie dans un groupe de ressources. Avec un fichier .bicepparam local passé à `-TemplateParameterFile`, l'instruction `using` désigne main.bicep : `-TemplateFile` n'est pas nécessaire.
      options:
        a: { en: "`New-AzSubscriptionDeployment` deploys at subscription scope, while main.bicep targets a resource group.", fr: "`New-AzSubscriptionDeployment` déploie à l'étendue de l'abonnement, alors que main.bicep cible un groupe de ressources." }
        b: { en: "`Test-AzResourceGroupDeployment` only validates the template and its parameters; it creates nothing.", fr: "`Test-AzResourceGroupDeployment` ne fait que valider le modèle et ses paramètres ; il ne crée rien." }
        c: { en: "`-TemplateParameterUri` accepts JSON parameters files only, and a .bicepparam file must be a local file.", fr: "`-TemplateParameterUri` n'accepte que des fichiers de paramètres JSON, et un fichier .bicepparam doit être un fichier local." }
    references:
      - title: Deploy Bicep files with Azure PowerShell
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-powershell

  # ------------------------------------------------------------------ 4
  - id: dp300-qz-42-04
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware runs SQL Server 2022 Enterprise on two Azure virtual machines that are licensed pay-as-you-go. Litware has no SQL Server licenses with Software Assurance. **SQLVM1** hosts the primary replica of an availability group. **SQLVM2** hosts a passive secondary replica that serves no read workload and runs no backups.

        You need to register SQLVM2 with the SQL IaaS Agent extension by running `az sql vm create`. SQLVM2 must not be charged for its SQL Server license, and Litware must remain compliant with its licensing terms.

        Which parameter should you add to the command?
      fr: |
        Litware exécute SQL Server 2022 Enterprise sur deux machines virtuelles Azure facturées avec paiement à l'utilisation. Litware ne possède aucune licence SQL Server avec Software Assurance. **SQLVM1** héberge le réplica principal d'un groupe de disponibilité. **SQLVM2** héberge un réplica secondaire passif qui ne sert aucune charge de travail en lecture et n'exécute aucune sauvegarde.

        Vous devez inscrire SQLVM2 auprès de l'extension SQL IaaS Agent en exécutant `az sql vm create`. SQLVM2 ne doit pas être facturée pour sa licence SQL Server, et Litware doit rester conforme à ses conditions de licence.

        Quel paramètre devez-vous ajouter à la commande ?
    body:
      options:
        - { id: a, text: --license-type PAYG }
        - { id: b, text: --license-type AHUB }
        - { id: c, text: --license-type DR }
        - { id: d, text: --image-sku Developer }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The `DR` license type (HA/DR in the portal) is used for the free passive replica of a high availability or disaster recovery configuration. Pay-as-you-go customers can use it when the VM is a passive replica, so SQLVM2 isn't charged for SQL Server.
        fr: |
          Le type de licence `DR` (HA/DR dans le portail) sert au réplica passif gratuit d'une configuration de haute disponibilité ou de récupération d'urgence. Les clients avec paiement à l'utilisation peuvent l'utiliser quand la machine virtuelle est un réplica passif : SQLVM2 n'est pas facturée pour SQL Server.
      options:
        a: { en: "PAYG includes the SQL Server license in the hourly price of the VM, so SQLVM2 would be charged for it.", fr: "PAYG inclut la licence SQL Server dans le prix horaire de la machine virtuelle : SQLVM2 serait facturée pour celle-ci." }
        b: { en: "Azure Hybrid Benefit (AHUB) requires licenses with Software Assurance or a qualifying subscription, which Litware doesn't have.", fr: "Azure Hybrid Benefit (AHUB) exige des licences avec Software Assurance ou un abonnement admissible, ce dont Litware ne dispose pas." }
        d: { en: "The Developer edition is free but isn't licensed for production use, and SQLVM2 runs the Enterprise edition of a production availability group.", fr: "L'édition Developer est gratuite mais n'est pas concédée sous licence pour la production, et SQLVM2 exécute l'édition Enterprise d'un groupe de disponibilité de production." }
    references:
      - title: Change the license model for a SQL virtual machine in Azure
        url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/licensing-model-azure-hybrid-benefit-ahb-change
      - title: az sql vm
        url: https://learn.microsoft.com/en-us/cli/azure/sql/vm

  # ------------------------------------------------------------------ 5
  - id: dp300-qz-42-05
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A release pipeline deploys a Bicep file that raises an Azure SQL database named **OrdersDB** from 4 to 8 vCores. Ten minutes earlier, an administrator started a change of the backup storage redundancy of OrdersDB in the Azure portal, and that operation is still running. The deployment fails, and the failed operation for OrdersDB returns the error code `Conflict`.

        You need the pipeline deployment to succeed. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Un pipeline de mise en production déploie un fichier Bicep qui fait passer une base de données Azure SQL nommée **OrdersDB** de 4 à 8 vCores. Dix minutes plus tôt, un administrateur a lancé dans le portail Azure une modification de la redondance du stockage de sauvegarde d'OrdersDB, et cette opération est toujours en cours. Le déploiement échoue, et l'opération en échec pour OrdersDB renvoie le code d'erreur `Conflict`.

        Vous devez faire réussir le déploiement du pipeline. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Wait until the running operation on OrdersDB completes, and then run the deployment again.", fr: "Attendre la fin de l'opération en cours sur OrdersDB, puis exécuter de nouveau le déploiement." } }
        - { id: b, text: { en: "Request an increase of the regional vCore quota of the subscription, and then run the deployment again.", fr: "Demander une augmentation du quota régional de vCores de l'abonnement, puis exécuter de nouveau le déploiement." } }
        - { id: c, text: { en: "Run the deployment again by using the Complete deployment mode.", fr: "Exécuter de nouveau le déploiement en utilisant le mode de déploiement complet." } }
        - { id: d, text: { en: "Delete OrdersDB, and then run the deployment again to re-create it with 8 vCores.", fr: "Supprimer OrdersDB, puis exécuter de nouveau le déploiement pour la recréer avec 8 vCores." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          `Conflict` means that the requested operation isn't allowed in the current state of the resource; here another management operation is still running on OrdersDB. Once it completes, the same deployment can scale the database.
        fr: |
          `Conflict` signifie que l'opération demandée n'est pas autorisée dans l'état actuel de la ressource ; ici, une autre opération de gestion est encore en cours sur OrdersDB. Une fois celle-ci terminée, le même déploiement peut mettre la base à l'échelle.
      options:
        b: { en: "A quota problem returns a quota error code such as `ResourceQuotaExceeded`, not `Conflict`.", fr: "Un problème de quota renvoie un code d'erreur de quota comme `ResourceQuotaExceeded`, pas `Conflict`." }
        c: { en: "The deployment mode only decides what happens to resources missing from the file; it doesn't bypass the operation in progress.", fr: "Le mode de déploiement ne décide que du sort des ressources absentes du fichier ; il ne contourne pas l'opération en cours." }
        d: { en: "Deleting the database loses its data and adds work, while waiting is enough.", fr: "Supprimer la base fait perdre ses données et ajoute du travail, alors qu'attendre suffit." }
    references:
      - title: Troubleshoot common Azure deployment errors
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors

  # ------------------------------------------------------------------ 6
  - id: dp300-qz-42-06
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has an Azure SQL database named **CrmDB** on a logical server named **sql-crm-01** in a resource group named **rg-crm**. CrmDB uses provisioned compute in the General Purpose service tier with 4 vCores on standard-series (Gen5) hardware.

        You need to change CrmDB by using Azure CLI to meet the following requirements:

        - Keep the existing data and the database name.
        - Use the serverless compute tier and scale automatically up to 8 vCores.
        - Always keep at least 2 vCores allocated.
        - Never pause, because the application can't tolerate the delay of the first connection after a resume.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'une base de données Azure SQL nommée **CrmDB** sur un serveur logique nommé **sql-crm-01** dans un groupe de ressources nommé **rg-crm**. CrmDB utilise le calcul provisionné du niveau de service General Purpose avec 4 vCores sur du matériel de série standard (Gen5).

        Vous devez modifier CrmDB à l'aide d'Azure CLI pour satisfaire les exigences suivantes :

        - Conserver les données existantes et le nom de la base.
        - Utiliser le niveau de calcul serverless et se mettre à l'échelle automatiquement jusqu'à 8 vCores.
        - Toujours conserver au moins 2 vCores alloués.
        - Ne jamais se mettre en pause, car l'application ne tolère pas le délai de la première connexion après une reprise.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az sql db [[cmd]] -g rg-crm -s sql-crm-01 -n CrmDB \
          --edition GeneralPurpose --family Gen5 [[max]] \
          --compute-model Serverless [[min]] \
          --auto-pause-delay [[apd]]
      slots:
        - id: cmd
          options:
            - { id: create, text: create }
            - { id: update, text: update }
            - { id: copy, text: copy }
        - id: max
          options:
            - { id: m_cap, text: --capacity 8 }
            - { id: m_min, text: --min-capacity 8 }
            - { id: m_size, text: --max-size 8GB }
        - id: min
          options:
            - { id: n_cap, text: --capacity 2 }
            - { id: n_min, text: --min-capacity 2 }
            - { id: n_ha, text: --ha-replicas 2 }
        - id: apd
          options:
            - { id: a_neg, text: "-1" }
            - { id: a_zero, text: "0" }
            - { id: a_max, text: "10080" }
    answer:
      values: { cmd: update, max: m_cap, min: n_min, apd: a_neg }
    explanation:
      correct:
        en: |
          `az sql db update` changes the existing database in place, so the data and the name are kept. For a serverless vCore database, `--capacity` sets the maximum vCores and `--min-capacity` the minimum always allocated. An `--auto-pause-delay` of -1 disables auto-pause.
        fr: |
          `az sql db update` modifie la base existante sur place : les données et le nom sont conservés. Pour une base serverless vCore, `--capacity` définit le nombre maximal de vCores et `--min-capacity` le minimum toujours alloué. Un `--auto-pause-delay` de -1 désactive la mise en pause automatique.
      options:
        create: { en: "`create` fails because CrmDB already exists on the server.", fr: "`create` échoue, car CrmDB existe déjà sur le serveur." }
        copy: { en: "`copy` creates another database; CrmDB itself must change and keep its name.", fr: "`copy` crée une autre base ; c'est CrmDB elle-même qui doit changer et garder son nom." }
        m_min: { en: "`--min-capacity` is the floor of the serverless range, not the maximum.", fr: "`--min-capacity` est le plancher de la plage serverless, pas le maximum." }
        m_size: { en: "`--max-size` is the maximum storage size, not compute.", fr: "`--max-size` est la taille de stockage maximale, pas le calcul." }
        n_cap: { en: "`--capacity` is the maximum vCores; 2 would cap the database at 2 vCores.", fr: "`--capacity` est le nombre maximal de vCores ; 2 plafonnerait la base à 2 vCores." }
        n_ha: { en: "`--ha-replicas` sets high availability replicas (Hyperscale), not allocated compute.", fr: "`--ha-replicas` définit des réplicas de haute disponibilité (Hyperscale), pas le calcul alloué." }
        a_zero: { en: "0 doesn't disable auto-pause: the General Purpose delay ranges from 15 to 10,080 minutes, and only -1 disables it.", fr: "0 ne désactive pas la mise en pause : le délai General Purpose va de 15 à 10 080 minutes, et seul -1 la désactive." }
        a_max: { en: "10,080 minutes (seven days) is the longest delay, but the database still pauses after a week of inactivity.", fr: "10 080 minutes (sept jours) est le délai le plus long, mais la base se met encore en pause après une semaine d'inactivité." }
    references:
      - title: az sql db
        url: https://learn.microsoft.com/en-us/cli/azure/sql/db
      - title: Serverless compute tier for Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview

  # ------------------------------------------------------------------ 7
  - id: dp300-qz-42-07
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You are writing an ARM JSON template that deploys a logical server and a database named **SalesDB** on it. In the `resources` array, the database is declared at the same level as the server, not nested inside it. The template must meet the following requirements:

        - The administrator password is supplied at deployment time and must never be saved in the deployment history or logged.
        - SalesDB is created on the server deployed by the template.

        How should you complete the template? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous écrivez un modèle JSON ARM qui déploie un serveur logique et, sur celui-ci, une base de données nommée **SalesDB**. Dans le tableau `resources`, la base est déclarée au même niveau que le serveur, et non imbriquée dans celui-ci. Le modèle doit satisfaire les exigences suivantes :

        - Le mot de passe d'administrateur est fourni au moment du déploiement et ne doit jamais être enregistré dans l'historique des déploiements ni journalisé.
        - SalesDB est créée sur le serveur déployé par le modèle.

        Comment devez-vous compléter le modèle ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        "parameters": {
          "serverName": { "type": "string" },
          "adminPassword": { "type": "[[ptype]]" }
        },
        "resources": [
          {
            "type": "Microsoft.Sql/servers",
            "apiVersion": "2023-08-01",
            "name": "[parameters('serverName')]",
            "location": "[resourceGroup().location]",
            "properties": {
              "administratorLogin": "sqladmin",
              "administratorLoginPassword": "[parameters('adminPassword')]"
            }
          },
          {
            "type": "[[rtype]]",
            "apiVersion": "2023-08-01",
            "name": "[[rname]]",
            "location": "[resourceGroup().location]",
            "sku": { "name": "GP_Gen5", "tier": "GeneralPurpose", "family": "Gen5", "capacity": 2 },
            "dependsOn": [ "[resourceId('Microsoft.Sql/servers', parameters('serverName'))]" ]
          }
        ]
      slots:
        - id: ptype
          options:
            - { id: p_string, text: string }
            - { id: p_secure, text: securestring }
            - { id: p_object, text: secureObject }
        - id: rtype
          options:
            - { id: t_db, text: Microsoft.Sql/servers/databases }
            - { id: t_flat, text: Microsoft.Sql/databases }
            - { id: t_pool, text: Microsoft.Sql/servers/elasticPools }
        - id: rname
          options:
            - { id: n_short, text: "SalesDB" }
            - { id: n_full, text: "[format('{0}/{1}', parameters('serverName'), 'SalesDB')]" }
            - { id: n_fqdn, text: "[format('{0}.database.windows.net/{1}', parameters('serverName'), 'SalesDB')]" }
    answer:
      values: { ptype: p_secure, rtype: t_db, rname: n_full }
    explanation:
      correct:
        en: |
          A `securestring` parameter isn't saved to the deployment history and isn't logged. A database is the child type `Microsoft.Sql/servers/databases`; declared outside its parent, its name must be the full name `serverName/SalesDB`, with one segment fewer than the type.
        fr: |
          Un paramètre `securestring` n'est ni enregistré dans l'historique des déploiements ni journalisé. Une base de données est le type enfant `Microsoft.Sql/servers/databases` ; déclarée hors de son parent, son nom doit être le nom complet `serverName/SalesDB`, avec un segment de moins que le type.
      options:
        p_string: { en: "A plain `string` value is shown in the deployment inputs.", fr: "Une valeur `string` simple apparaît dans les entrées du déploiement." }
        p_object: { en: "`secureObject` is for objects; the password is a string passed to a string property.", fr: "`secureObject` est destiné aux objets ; le mot de passe est une chaîne passée à une propriété de type chaîne." }
        t_flat: { en: "`Microsoft.Sql/databases` isn't a resource type: databases are children of servers.", fr: "`Microsoft.Sql/databases` n'est pas un type de ressource : les bases sont des enfants des serveurs." }
        t_pool: { en: "This type creates an elastic pool, not a database.", fr: "Ce type crée un pool élastique, pas une base de données." }
        n_short: { en: "Outside its parent, a child resource needs the parent name in its name; `SalesDB` alone doesn't match the two-segment type.", fr: "Hors de son parent, une ressource enfant a besoin du nom du parent dans son nom ; `SalesDB` seul ne correspond pas au type à deux segments." }
        n_fqdn: { en: "The parent segment is the server name, not its DNS name.", fr: "Le segment parent est le nom du serveur, pas son nom DNS." }
    references:
      - title: Data types in ARM templates
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/data-types
      - title: Set name and type for child resources in Bicep
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/child-resource-name-type

  # ------------------------------------------------------------------ 8
  - id: dp300-qz-42-08
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys deploys a Bicep file named **main.bicep** to a resource group named **rg-sales** by using `az deployment group create` without the `--mode` parameter. The file declares a logical server, an elastic pool and four single databases named **DB1** to **DB4**.

        The deployment fails. The deployment operations show that the server, the pool, DB1, DB2 and DB4 succeeded, and that DB3 failed with the error code `ResourceQuotaExceeded` for the regional vCore quota of the subscription. Applications have already started to write to DB1. Your quota increase request is now approved, and main.bicep is unchanged.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys déploie un fichier Bicep nommé **main.bicep** dans un groupe de ressources nommé **rg-sales** à l'aide d'`az deployment group create` sans le paramètre `--mode`. Le fichier déclare un serveur logique, un pool élastique et quatre bases de données uniques nommées **DB1** à **DB4**.

        Le déploiement échoue. Les opérations du déploiement montrent que le serveur, le pool, DB1, DB2 et DB4 ont réussi, et que DB3 a échoué avec le code d'erreur `ResourceQuotaExceeded` pour le quota régional de vCores de l'abonnement. Des applications ont déjà commencé à écrire dans DB1. Votre demande d'augmentation de quota est maintenant approuvée, et main.bicep n'a pas changé.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Resource Manager rolled back the failed deployment, so the resources that succeeded were removed.", fr: "Resource Manager a annulé le déploiement en échec : les ressources qui ont réussi ont été supprimées." } }
        - { id: b, text: { en: "Running az deployment group what-if with main.bicep now reports DB3 with the Create change type.", fr: "L'exécution d'az deployment group what-if avec main.bicep signale maintenant DB3 avec le type de modification Create." } }
        - { id: c, text: { en: "You must delete DB1, DB2 and DB4 before you deploy main.bicep again, or the deployment fails.", fr: "Vous devez supprimer DB1, DB2 et DB4 avant de redéployer main.bicep, sinon le déploiement échoue." } }
        - { id: d, text: { en: "Deploying main.bicep again with the same command creates DB3 and keeps the data written to DB1.", fr: "Redéployer main.bicep avec la même commande crée DB3 et conserve les données écrites dans DB1." } }
        - { id: e, text: { en: "Only a deployment that uses the Complete mode creates DB3 without redeploying the other resources.", fr: "Seul un déploiement en mode complet crée DB3 sans redéployer les autres ressources." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          An error during deployment leaves the resources that already succeeded in place. Redeploying the same file in the default incremental mode creates what is missing (DB3) and updates the existing resources to the declared state without re-creating them, so data is kept. What-if compares the file with the current state: DB3 doesn't exist, so it is reported as Create.
        fr: |
          Une erreur pendant le déploiement laisse en place les ressources qui ont déjà réussi. Redéployer le même fichier dans le mode incrémentiel par défaut crée ce qui manque (DB3) et met les ressources existantes à l'état déclaré sans les recréer : les données sont conservées. L'opération de simulation (what-if) compare le fichier à l'état actuel : DB3 n'existe pas, elle est donc signalée comme Create.
      options:
        a: { en: "No automatic rollback happens by default; the server, the pool and three databases still exist.", fr: "Aucune annulation automatique n'a lieu par défaut ; le serveur, le pool et trois bases existent toujours." }
        c: { en: "Templates are idempotent: deploying over existing resources updates them and doesn't fail.", fr: "Les modèles sont idempotents : déployer sur des ressources existantes les met à jour et n'échoue pas." }
        e: { en: "Complete mode only adds the deletion of resources missing from the file; the incremental mode already creates DB3.", fr: "Le mode complet ajoute seulement la suppression des ressources absentes du fichier ; le mode incrémentiel crée déjà DB3." }
    references:
      - title: ARM template deployment what-if operation
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-what-if
      - title: Troubleshoot common Azure deployment errors
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors

  # ------------------------------------------------------------------ 9
  - id: dp300-qz-42-09
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a resource group named **rg-core** that contains a logical server named **sql-core-01** and its databases. To prevent accidental deletion, a **CanNotDelete** lock is applied to rg-core. A pipeline deploys a Bicep file to rg-core every 15 minutes by using a service principal that has the Contributor role on rg-core.

        Deployments to rg-core now fail with the error code `DeploymentQuotaExceeded`.

        You need to ensure that future deployments succeed without anyone deleting deployments from the history manually. sql-core-01 and its databases must remain protected against deletion.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'un groupe de ressources nommé **rg-core** qui contient un serveur logique nommé **sql-core-01** et ses bases de données. Pour empêcher toute suppression accidentelle, un verrou **CanNotDelete** est appliqué à rg-core. Un pipeline déploie un fichier Bicep dans rg-core toutes les 15 minutes à l'aide d'un principal de service qui a le rôle Contributor sur rg-core.

        Les déploiements dans rg-core échouent désormais avec le code d'erreur `DeploymentQuotaExceeded`.

        Vous devez faire en sorte que les déploiements futurs réussissent sans que personne ne supprime manuellement des déploiements de l'historique. sql-core-01 et ses bases de données doivent rester protégés contre la suppression.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the service principal a custom role that allows Microsoft.Resources/deployments/delete on rg-core.", fr: "Attribuer au principal de service un rôle personnalisé qui autorise Microsoft.Resources/deployments/delete sur rg-core." } }
        - { id: b, text: { en: "Replace the CanNotDelete lock on rg-core with a ReadOnly lock on rg-core.", fr: "Remplacer le verrou CanNotDelete de rg-core par un verrou ReadOnly sur rg-core." } }
        - { id: c, text: { en: "Remove the lock from rg-core, and then apply a CanNotDelete lock to sql-core-01.", fr: "Supprimer le verrou de rg-core, puis appliquer un verrou CanNotDelete à sql-core-01." } }
        - { id: d, text: { en: "Register the DisableDeploymentGrooming feature of Microsoft.Resources in the subscription.", fr: "Inscrire la fonctionnalité DisableDeploymentGrooming de Microsoft.Resources dans l'abonnement." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Resource Manager deletes old deployments automatically when the history exceeds 700 entries, but a CanNotDelete lock on the resource group blocks this cleanup, so the 800-deployment limit is reached. A lock on the server still protects it and, by inheritance, its databases, while the deployment history of the resource group can be cleaned up again.
        fr: |
          Resource Manager supprime automatiquement les anciens déploiements quand l'historique dépasse 700 entrées, mais un verrou CanNotDelete sur le groupe de ressources bloque ce nettoyage : la limite de 800 déploiements est atteinte. Un verrou sur le serveur protège toujours celui-ci et, par héritage, ses bases de données, tandis que l'historique des déploiements du groupe de ressources peut de nouveau être nettoyé.
      options:
        a: { en: "Contributor already allows deleting deployments; the lock on the resource group is what blocks the cleanup.", fr: "Contributor autorise déjà la suppression des déploiements ; c'est le verrou du groupe de ressources qui bloque le nettoyage." }
        b: { en: "A ReadOnly lock is more restrictive: it still blocks the cleanup and also blocks the updates made by the deployments.", fr: "Un verrou ReadOnly est plus restrictif : il bloque toujours le nettoyage ainsi que les mises à jour effectuées par les déploiements." }
        d: { en: "This feature opts out of automatic deletion, so the history would only be cleaned up manually.", fr: "Cette fonctionnalité désactive la suppression automatique : l'historique ne serait plus nettoyé que manuellement." }
    references:
      - title: Automatic deletions from deployment history
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deployment-history-deletions
      - title: Lock your Azure resources to protect your infrastructure
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources

  # ------------------------------------------------------------------ 10
  - id: dp300-qz-42-10
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware stores the infrastructure of its reporting platform as code. A colleague wrote the following Bicep file, which creates a logical server and a reporting database. You deploy it to a new, empty resource group named **rg-reports** by running `az deployment group create` and supply the administrator password at run time.

        ```bicep
        param location string = resourceGroup().location
        param serverName string = 'sql-${uniqueString(resourceGroup().id)}'
        @secure()
        param adminPassword string

        resource sqlServer 'Microsoft.Sql/servers@2023-08-01' = {
          name: serverName
          location: location
          properties: {
            administratorLogin: 'sqladmin'
            administratorLoginPassword: adminPassword
          }
        }

        resource reportsDb 'Microsoft.Sql/servers/databases@2023-08-01' = {
          name: '${serverName}/ReportsDB'
          location: location
          sku: { name: 'GP_Gen5', tier: 'GeneralPurpose', family: 'Gen5', capacity: 2 }
        }

        output connectionHint string = 'Server=${sqlServer.properties.fullyQualifiedDomainName};Password=${adminPassword}'
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware stocke l'infrastructure de sa plateforme de rapports sous forme de code. Un collègue a écrit le fichier Bicep suivant, qui crée un serveur logique et une base de données de rapports. Vous le déployez dans un nouveau groupe de ressources vide nommé **rg-reports** en exécutant `az deployment group create` et fournissez le mot de passe d'administrateur au moment de l'exécution.

        ```bicep
        param location string = resourceGroup().location
        param serverName string = 'sql-${uniqueString(resourceGroup().id)}'
        @secure()
        param adminPassword string

        resource sqlServer 'Microsoft.Sql/servers@2023-08-01' = {
          name: serverName
          location: location
          properties: {
            administratorLogin: 'sqladmin'
            administratorLoginPassword: adminPassword
          }
        }

        resource reportsDb 'Microsoft.Sql/servers/databases@2023-08-01' = {
          name: '${serverName}/ReportsDB'
          location: location
          sku: { name: 'GP_Gen5', tier: 'GeneralPurpose', family: 'Gen5', capacity: 2 }
        }

        output connectionHint string = 'Server=${sqlServer.properties.fullyQualifiedDomainName};Password=${adminPassword}'
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Resource Manager always finishes creating sqlServer before it starts creating reportsDb.
            fr: Resource Manager termine toujours la création de sqlServer avant de commencer celle de reportsDb.
        - id: s2
          text:
            en: If you deploy the file to rg-reports again with the default parameter values, the deployment targets the same logical server.
            fr: Si vous déployez de nouveau le fichier dans rg-reports avec les valeurs de paramètres par défaut, le déploiement cible le même serveur logique.
        - id: s3
          text:
            en: Because adminPassword is decorated with @secure(), the password is redacted from the connectionHint output.
            fr: Comme adminPassword est décoré avec @secure(), le mot de passe est masqué dans la sortie connectionHint.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          reportsDb uses the full name `serverName/ReportsDB` built from a parameter, not the `parent` property or the symbolic name of the server, and it has no `dependsOn`: Bicep can't infer the dependency, so the database can be sent before the server exists (`ParentResourceNotFound`). `uniqueString(resourceGroup().id)` returns the same value for the same resource group, so a redeployment targets the same server. Redaction applies to the secure value itself, not to a value derived from it, such as a concatenated output.
        fr: |
          reportsDb utilise le nom complet `serverName/ReportsDB` construit à partir d'un paramètre, et non la propriété `parent` ni le nom symbolique du serveur, et elle n'a pas de `dependsOn` : Bicep ne peut pas déduire la dépendance, et la base peut être envoyée avant que le serveur existe (`ParentResourceNotFound`). `uniqueString(resourceGroup().id)` renvoie la même valeur pour le même groupe de ressources : un redéploiement cible donc le même serveur. Le masquage s'applique à la valeur sécurisée elle-même, pas à une valeur qui en dérive, comme une sortie concaténée.
      options:
        s1: { en: "Without `parent`, a reference to the symbolic name sqlServer or a `dependsOn`, Resource Manager can deploy both resources in parallel.", fr: "Sans `parent`, référence au nom symbolique sqlServer ou `dependsOn`, Resource Manager peut déployer les deux ressources en parallèle." }
        s3: { en: "The concatenated string contains the password in clear text; never put secrets in outputs.", fr: "La chaîne concaténée contient le mot de passe en clair ; ne placez jamais de secrets dans les sorties." }
    references:
      - title: Set name and type for child resources in Bicep
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/child-resource-name-type
      - title: Parameters in Bicep
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameters
