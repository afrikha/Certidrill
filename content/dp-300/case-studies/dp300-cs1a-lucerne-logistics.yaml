id: dp300-cs1a-lucerne-logistics
status: draft
title:
  en: Lucerne Logistics
  fr: Lucerne Logistics
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lucerne Logistics is a freight forwarding company that operates 25 warehouses in the Netherlands, Belgium and Germany. The head office and the only datacenter are in Rotterdam.

        Lucerne plans to close the Rotterdam datacenter and to move its databases to Azure. A team of four database administrators (DBAs) manages the SQL Server estate.
      fr: |
        Lucerne Logistics est un commissionnaire de transport qui exploite 25 entrepôts aux Pays-Bas, en Belgique et en Allemagne. Le siège et l'unique centre de données se trouvent à Rotterdam.

        Lucerne prévoit de fermer le centre de données de Rotterdam et de déplacer ses bases de données vers Azure. Une équipe de quatre administrateurs de bases de données (DBA) gère le parc SQL Server.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **SQL Server**

        An on-premises server named **SQL1** runs SQL Server 2019 Enterprise CU22 on Windows Server 2019. SQL1 hosts the following databases.

        | Database | Size | Usage |
        | --- | --- | --- |
        | FreightOps | 1.4 TB | Order and shipment processing, used 24 hours a day. Stored procedures query Tracking by using three-part names. |
        | Tracking | 1.8 TB | Parcel scan events. |
        | Billing | 120 GB | Monthly invoicing. |

        SQL1 has 14 SQL Server Agent jobs, including a nightly job named **FreightPurge** that deletes expired shipments from FreightOps. The msdb database contains an operator named **DBA-Team** whose email address is the DBA distribution list.

        **Identity and network**

        The Active Directory Domain Services (AD DS) domain is synchronized to a Microsoft Entra tenant by using Microsoft Entra Connect. Warehouse supervisors are members of a synchronized group named **SG-Freight-Ops**. An ExpressRoute circuit connects the datacenter to the West Europe region.

        **Planned environment**

        - FreightOps and Tracking will move to an Azure SQL managed instance named **MI1** in West Europe. MI1 uses the Business Critical service tier and has a Microsoft Entra admin configured.
        - The SQL Server Agent jobs and the DBA-Team operator will be re-created on MI1.
        - A second managed instance named **MI2** will be deployed in North Europe.
      fr: |
        **SQL Server**

        Un serveur local nommé **SQL1** exécute SQL Server 2019 Enterprise CU22 sur Windows Server 2019. SQL1 héberge les bases de données suivantes.

        | Base de données | Taille | Usage |
        | --- | --- | --- |
        | FreightOps | 1,4 To | Traitement des commandes et des expéditions, utilisée 24 heures sur 24. Des procédures stockées interrogent Tracking à l'aide de noms en trois parties. |
        | Tracking | 1,8 To | Événements de scan des colis. |
        | Billing | 120 Go | Facturation mensuelle. |

        SQL1 compte 14 travaux SQL Server Agent, dont un travail nocturne nommé **FreightPurge** qui supprime les expéditions expirées de FreightOps. La base de données msdb contient un opérateur nommé **DBA-Team** dont l'adresse e-mail est la liste de distribution des DBA.

        **Identité et réseau**

        Le domaine Active Directory Domain Services (AD DS) est synchronisé avec un locataire Microsoft Entra à l'aide de Microsoft Entra Connect. Les responsables d'entrepôt sont membres d'un groupe synchronisé nommé **SG-Freight-Ops**. Un circuit ExpressRoute relie le centre de données à la région West Europe.

        **Environnement prévu**

        - FreightOps et Tracking seront déplacées vers une instance managée Azure SQL nommée **MI1** dans la région West Europe. MI1 utilise le niveau de service Business Critical et un administrateur Microsoft Entra y est configuré.
        - Les travaux SQL Server Agent et l'opérateur DBA-Team seront recréés sur MI1.
        - Une seconde instance managée nommée **MI2** sera déployée dans la région North Europe.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Migration requirements**

        1. While FreightOps is being migrated, the quality team must be able to run validation reports against the copy of FreightOps on MI1 before the cutover.
        2. The cutover of FreightOps must cause less than five minutes of downtime.
        3. Billing will move to Azure SQL Database. Billing is used irregularly: some days for an hour, some days not at all. Compute charges for Billing must stop automatically when the database is not used, without any schedule to maintain.

        **Security requirements**

        4. Warehouse supervisors must sign in to MI1 by using their Microsoft Entra identities and must be able to read all the data in FreightOps. No SQL authentication login must be created for them. The principle of least privilege must be applied.

        **Business continuity requirements**

        5. If West Europe becomes unavailable, the DBAs must be able to bring FreightOps and Tracking online in North Europe. The DBAs decide when to fail over. The applications must not change their connection strings after a failover.
        6. One FreightOps backup per month must be kept for seven years. The backup taken during week 26 of each year, at the end of the fiscal year, must be kept for 10 years.

        **Operations requirements**

        7. The DBA-Team operator must receive an email when the FreightPurge job fails on MI1, and only then.
      fr: |
        **Exigences de migration**

        1. Pendant la migration de FreightOps, l'équipe qualité doit pouvoir exécuter des rapports de validation sur la copie de FreightOps dans MI1 avant le basculement.
        2. Le basculement de FreightOps doit entraîner moins de cinq minutes d'interruption.
        3. Billing sera déplacée vers Azure SQL Database. Billing est utilisée de façon irrégulière : certains jours pendant une heure, certains jours pas du tout. Les frais de calcul de Billing doivent s'arrêter automatiquement quand la base de données n'est pas utilisée, sans planification à gérer.

        **Exigences de sécurité**

        4. Les responsables d'entrepôt doivent se connecter à MI1 avec leurs identités Microsoft Entra et doivent pouvoir lire toutes les données de FreightOps. Aucune connexion d'authentification SQL ne doit être créée pour eux. Le principe des privilèges minimum doit être appliqué.

        **Exigences de continuité d'activité**

        5. Si la région West Europe devient indisponible, les DBA doivent pouvoir mettre FreightOps et Tracking en ligne dans la région North Europe. Les DBA décident du moment du basculement. Les applications ne doivent pas modifier leurs chaînes de connexion après un basculement.
        6. Une sauvegarde de FreightOps par mois doit être conservée pendant sept ans. La sauvegarde effectuée pendant la semaine 26 de chaque année, à la fin de l'exercice fiscal, doit être conservée pendant 10 ans.

        **Exigences d'exploitation**

        7. L'opérateur DBA-Team doit recevoir un e-mail quand le travail FreightPurge échoue sur MI1, et uniquement dans ce cas.
