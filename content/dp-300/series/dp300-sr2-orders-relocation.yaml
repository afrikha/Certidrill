id: dp300-sr2-orders-relocation
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso has two Azure SQL managed instances in the **West Europe** region: **MI1** in a subscription named **Sub1** and **MI2** in a subscription named **Sub2**. Both subscriptions belong to the same Microsoft Entra tenant. The virtual networks of MI1 and MI2 are peered, and both subnets allow TCP port 5022 and TCP ports 11000-11999 in both directions. Neither instance is part of a failover group, and both instances use the same update policy.

    MI1 hosts a 600-GB user database named **OrdersDb**. An order-entry application writes to OrdersDb around the clock.

    You need to relocate OrdersDb to MI2. The solution must meet the following requirements:

    - Minimize application downtime.
    - Every transaction committed on MI1 before the cutover must be present on MI2.
    - After the operation, OrdersDb must no longer exist on MI1.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso dispose de deux instances managées Azure SQL dans la région **West Europe** : **MI1** dans un abonnement nommé **Sub1** et **MI2** dans un abonnement nommé **Sub2**. Les deux abonnements appartiennent au même locataire Microsoft Entra. Un peering relie les réseaux virtuels de MI1 et de MI2, et les deux sous-réseaux autorisent le port TCP 5022 et les ports TCP 11000-11999 dans les deux sens. Aucune des deux instances ne fait partie d'un groupe de basculement, et les deux instances utilisent la même stratégie de mise à jour.

    MI1 héberge une base de données utilisateur de 600 Go nommée **OrdersDb**. Une application de saisie des commandes écrit dans OrdersDb en continu.

    Vous devez transférer OrdersDb vers MI2. La solution doit répondre aux exigences suivantes :

    - Réduire au minimum l'interruption de l'application.
    - Chaque transaction validée sur MI1 avant le basculement doit être présente sur MI2.
    - Après l'opération, OrdersDb ne doit plus exister sur MI1.
