id: dp300-sr1-order-entry-hang
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure SQL database named **OrderEntry**. Users report that saving an order hangs for several minutes. You confirm that many requests in OrderEntry are waiting on `LCK_M_X` and `LCK_M_U` locks.

    You are connected to OrderEntry as the server admin by using SQL Server Management Studio (SSMS).

    You need to identify the session at the head of the blocking chain and the last statement that this session submitted. You must then end only that session so that the waiting requests can continue.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'une base de données Azure SQL nommée **OrderEntry**. Les utilisateurs signalent que l'enregistrement d'une commande reste bloqué pendant plusieurs minutes. Vous confirmez que de nombreuses requêtes dans OrderEntry attendent des verrous `LCK_M_X` et `LCK_M_U`.

    Vous êtes connecté à OrderEntry en tant qu'administrateur du serveur à l'aide de SQL Server Management Studio (SSMS).

    Vous devez identifier la session en tête de la chaîne de blocage et la dernière instruction que cette session a envoyée. Vous devez ensuite mettre fin uniquement à cette session pour que les requêtes en attente puissent continuer.
