id: dp300-sr1-weekly-purge
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has an Azure SQL logical server named **sql-nw-sales** that hosts a database named **SalesOps**. SalesOps contains a stored procedure named **dbo.usp_PurgeAudit** that deletes old audit rows. Microsoft Entra authentication is configured on sql-nw-sales, and network access to the server is already allowed for any Azure service that you choose.

    You need to run dbo.usp_PurgeAudit in SalesOps every Sunday at 02:00 UTC. The solution must meet the following requirements:

    - No virtual machine must be deployed or managed.
    - No password or secret must be stored to authenticate to SalesOps.
    - The identity that runs the procedure must have only the permissions it needs in SalesOps.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un serveur logique Azure SQL nommé **sql-nw-sales** qui héberge une base de données nommée **SalesOps**. SalesOps contient une procédure stockée nommée **dbo.usp_PurgeAudit** qui supprime les anciennes lignes d'audit. L'authentification Microsoft Entra est configurée sur sql-nw-sales, et l'accès réseau au serveur est déjà autorisé pour tout service Azure que vous choisissez.

    Vous devez exécuter dbo.usp_PurgeAudit dans SalesOps chaque dimanche à 02:00 UTC. La solution doit répondre aux exigences suivantes :

    - Aucune machine virtuelle ne doit être déployée ni gérée.
    - Aucun mot de passe ni secret ne doit être stocké pour s'authentifier auprès de SalesOps.
    - L'identité qui exécute la procédure ne doit disposer que des autorisations nécessaires dans SalesOps.
