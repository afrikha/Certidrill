id: dp300-sr2-standard-reporting-copy
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum has an on-premises server named **SQL1** that runs SQL Server 2022 Standard edition. SQL1 hosts a database named **SalesDb** that uses the full recovery model. An Azure virtual machine named **VM1** runs SQL Server 2022 Standard edition and is connected to the on-premises network by a site-to-site VPN. SQL Server Agent runs on both instances.

    You need to maintain a copy of SalesDb on VM1. The solution must meet the following requirements:

    - Analysts must be able to run read-only reporting queries against the copy on VM1 between updates.
    - If SQL1 fails, no more than 30 minutes of committed transactions can be lost.
    - Both instances must remain on Standard edition.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum dispose d'un serveur local nommé **SQL1** qui exécute SQL Server 2022 édition Standard. SQL1 héberge une base de données nommée **SalesDb** qui utilise le mode de récupération complet. Une machine virtuelle Azure nommée **VM1** exécute SQL Server 2022 édition Standard et est connectée au réseau local par un VPN site à site. SQL Server Agent s'exécute sur les deux instances.

    Vous devez maintenir une copie de SalesDb sur VM1. La solution doit répondre aux exigences suivantes :

    - Les analystes doivent pouvoir exécuter des requêtes de reporting en lecture seule sur la copie de VM1 entre les mises à jour.
    - Si SQL1 tombe en panne, au plus 30 minutes de transactions validées peuvent être perdues.
    - Les deux instances doivent rester en édition Standard.
