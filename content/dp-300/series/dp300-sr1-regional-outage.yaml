id: dp300-sr1-regional-outage
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has an Azure SQL logical server named **sql-litware-weu** in the West Europe region. The server hosts three Business Critical databases named **Claims**, **Policies** and **Customers** that are used by the same application.

    You need to recommend a disaster recovery solution. The solution must meet the following requirements:

    - If West Europe becomes unavailable, the three databases must be recoverable in the North Europe region and must fail over together.
    - The operations team must decide when a failover occurs.
    - After a failover, the application must keep using the same connection strings.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'un serveur logique Azure SQL nommé **sql-litware-weu** dans la région Europe Ouest. Le serveur héberge trois bases de données Business Critical nommées **Claims**, **Policies** et **Customers**, utilisées par la même application.

    Vous devez recommander une solution de récupération d'urgence. La solution doit répondre aux exigences suivantes :

    - Si la région Europe Ouest devient indisponible, les trois bases doivent pouvoir être récupérées dans la région Europe Nord et doivent basculer ensemble.
    - L'équipe d'exploitation doit décider du moment d'un basculement.
    - Après un basculement, l'application doit continuer à utiliser les mêmes chaînes de connexion.
