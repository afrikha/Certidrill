id: dp300-sr2-tde-protector
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has an Azure SQL Database logical server named **sql-wg1** that hosts several databases. The databases use transparent data encryption (TDE) with a service-managed key. sql-wg1 has a system-assigned managed identity.

    Woodgrove also has a key vault named **kv-wg1** in the same region and Microsoft Entra tenant as sql-wg1. kv-wg1 uses the Azure role-based access control (Azure RBAC) permission model, and soft delete and purge protection are enabled.

    A compliance policy requires that the TDE protector of every database on sql-wg1 be an RSA key that Woodgrove manages in kv-wg1. The solution must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un serveur logique Azure SQL Database nommé **sql-wg1** qui héberge plusieurs bases de données. Les bases utilisent le chiffrement transparent des données (TDE) avec une clé gérée par le service. sql-wg1 a une identité managée affectée par le système.

    Woodgrove dispose aussi d'un coffre de clés nommé **kv-wg1** dans la même région et le même locataire Microsoft Entra que sql-wg1. kv-wg1 utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC), et la suppression réversible et la protection contre le vidage sont activées.

    Une stratégie de conformité exige que le protecteur TDE de chaque base de sql-wg1 soit une clé RSA que Woodgrove gère dans kv-wg1. La solution doit respecter le principe du moindre privilège.
