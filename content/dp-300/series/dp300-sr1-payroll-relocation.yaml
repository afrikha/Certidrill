id: dp300-sr1-payroll-relocation
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum has two Azure SQL managed instances named **sqlmi-adatum-hr** and **sqlmi-adatum-core** in the same subscription and the West Europe region. Their virtual networks are peered, and the network security groups of both subnets allow TCP ports 5022 and 11000-11999 between the subnets. Both instances use the **Always-up-to-date** update policy and service-managed keys for transparent data encryption. Neither instance is in a failover group.

    sqlmi-adatum-hr hosts a 400 GB database named **Payroll** that receives writes all day. You need to relocate Payroll to sqlmi-adatum-core. The solution must meet the following requirements:

    - Payroll must stay available for reads and writes on sqlmi-adatum-hr until the cutover.
    - The cutover must happen on Saturday at 22:00, when the application is reconfigured to use sqlmi-adatum-core.
    - No committed transaction must be lost.
    - After the cutover, Payroll must no longer exist on sqlmi-adatum-hr.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum dispose de deux instances managées Azure SQL nommées **sqlmi-adatum-hr** et **sqlmi-adatum-core** dans le même abonnement et la région Europe Ouest. Leurs réseaux virtuels sont connectés par peering, et les groupes de sécurité réseau des deux sous-réseaux autorisent les ports TCP 5022 et 11000-11999 entre les sous-réseaux. Les deux instances utilisent la stratégie de mise à jour **Always-up-to-date** et des clés managées par le service pour le chiffrement transparent des données. Aucune des instances ne fait partie d'un groupe de basculement.

    sqlmi-adatum-hr héberge une base de données de 400 Go nommée **Payroll** qui reçoit des écritures toute la journée. Vous devez déplacer Payroll vers sqlmi-adatum-core. La solution doit répondre aux exigences suivantes :

    - Payroll doit rester disponible en lecture et en écriture sur sqlmi-adatum-hr jusqu'au basculement.
    - Le basculement doit avoir lieu le samedi à 22:00, quand l'application est reconfigurée pour utiliser sqlmi-adatum-core.
    - Aucune transaction validée ne doit être perdue.
    - Après le basculement, Payroll ne doit plus exister sur sqlmi-adatum-hr.
