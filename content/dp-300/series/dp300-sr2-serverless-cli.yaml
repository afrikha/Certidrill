id: dp300-sr2-serverless-cli
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure SQL Database logical server named **sql-tail1** in a resource group named **RG1**. You deploy databases from an Azure CLI script.

    You need to create a single database named **InventoryDb** on sql-tail1. The solution must meet the following requirements:

    - Compute must be billed per second, based on the vCores used.
    - Compute must scale automatically up to a maximum of **4 vCores**.
    - The database must pause automatically after **120 minutes** without activity.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un serveur logique Azure SQL Database nommé **sql-tail1** dans un groupe de ressources nommé **RG1**. Vous déployez les bases de données à partir d'un script Azure CLI.

    Vous devez créer une base de données unique nommée **InventoryDb** sur sql-tail1. La solution doit répondre aux exigences suivantes :

    - Le calcul doit être facturé à la seconde, en fonction des vCores utilisés.
    - Le calcul doit se mettre à l'échelle automatiquement jusqu'à un maximum de **4 vCores**.
    - La base de données doit se mettre en pause automatiquement après **120 minutes** sans activité.
