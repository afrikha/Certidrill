id: dp300-sr1-idle-timesheets
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has an Azure SQL logical server named **sql-fabrikam-hr** that hosts a single database named **Timesheets**. Timesheets uses the vCore purchasing model, the General Purpose service tier, provisioned compute with **8 vCores** and Standard-series (Gen5) hardware.

    Timesheets is used from Monday to Friday between 08:00 and 19:00, with unpredictable peaks that need up to 8 vCores. It has no activity at night or on weekends. Timesheets doesn't use any feature that prevents auto-pause, and the application retries its connections, so a delay on the first connection after an idle period is acceptable.

    You need to reconfigure Timesheets. The solution must meet the following requirements:

    - Peaks must still be able to use up to 8 vCores.
    - Compute costs during idle periods must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'un serveur logique Azure SQL nommé **sql-fabrikam-hr** qui héberge une seule base de données nommée **Timesheets**. Timesheets utilise le modèle d'achat vCore, le niveau de service General Purpose, le calcul provisionné avec **8 vCores** et le matériel série Standard (Gen5).

    Timesheets est utilisée du lundi au vendredi entre 08:00 et 19:00, avec des pics imprévisibles qui nécessitent jusqu'à 8 vCores. Elle n'a aucune activité la nuit ni le week-end. Timesheets n'utilise aucune fonctionnalité qui empêche la mise en pause automatique, et l'application relance ses connexions : un délai sur la première connexion après une période d'inactivité est acceptable.

    Vous devez reconfigurer Timesheets. La solution doit répondre aux exigences suivantes :

    - Les pics doivent toujours pouvoir utiliser jusqu'à 8 vCores.
    - Les coûts de calcul pendant les périodes d'inactivité doivent être réduits au minimum.
