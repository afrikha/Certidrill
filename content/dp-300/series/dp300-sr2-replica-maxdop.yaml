id: dp300-sr2-replica-maxdop
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has an Azure SQL database named **SalesDb** in the **Business Critical** service tier, with read scale-out enabled. The order-processing application connects to the read-write primary replica. A reporting application connects to the read-only replica by using `ApplicationIntent=ReadOnly`. The MAXDOP database scoped configuration of SalesDb is set to **8** for the primary replica and the secondary replicas.

    Parallel reporting queries consume most of the CPU of the read-only replica.

    You need the queries that run on the read-only replica to use a maximum degree of parallelism of **2**. The queries that run on the primary replica must keep a maximum degree of parallelism of 8. The solution must not require changes to the code of either application.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'une base de données Azure SQL nommée **SalesDb** dans le niveau de service **Business Critical**, avec le scale-out en lecture activé. L'application de traitement des commandes se connecte au réplica principal en lecture-écriture. Une application de reporting se connecte au réplica en lecture seule avec `ApplicationIntent=ReadOnly`. La configuration à l'échelle de la base de données MAXDOP de SalesDb vaut **8** pour le réplica principal et les réplicas secondaires.

    Les requêtes de reporting parallèles consomment la plus grande partie du processeur du réplica en lecture seule.

    Vous devez faire en sorte que les requêtes exécutées sur le réplica en lecture seule utilisent un degré maximal de parallélisme de **2**. Les requêtes exécutées sur le réplica principal doivent conserver un degré maximal de parallélisme de 8. La solution ne doit nécessiter aucune modification du code des deux applications.
