id: dp300-sr1-partner-reports
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Wingtip Toys has an Azure SQL logical server named **sql-wingtip-prod** that hosts three databases named **Orders**, **Inventory** and **HR**. Public network access on sql-wingtip-prod is set to **Selected networks**, and the server has one server-level IP firewall rule that allows the administrator workstation.

    Orders is replicated by active geo-replication to a logical server named **sql-wingtip-dr** in another region.

    A partner reporting tool hosted outside Azure connects from the public IP address **198.51.100.25** by using SQL authentication. A contained database user for the tool already exists in Orders. You need to allow the tool to connect. The solution must meet the following requirements:

    - The tool must be able to connect to Orders.
    - The firewall must not allow the tool to connect to Inventory or HR.
    - The firewall rule for the tool must be replicated to the geo-secondary of Orders.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Wingtip Toys dispose d'un serveur logique Azure SQL nommé **sql-wingtip-prod** qui héberge trois bases de données nommées **Orders**, **Inventory** et **HR**. L'accès au réseau public de sql-wingtip-prod est défini sur **Selected networks**, et le serveur possède une règle de pare-feu IP au niveau du serveur qui autorise le poste de travail de l'administrateur.

    Orders est répliquée par géoréplication active vers un serveur logique nommé **sql-wingtip-dr** dans une autre région.

    Un outil de reporting d'un partenaire, hébergé hors d'Azure, se connecte depuis l'adresse IP publique **198.51.100.25** à l'aide de l'authentification SQL. Un utilisateur de base de données autonome pour l'outil existe déjà dans Orders. Vous devez autoriser l'outil à se connecter. La solution doit répondre aux exigences suivantes :

    - L'outil doit pouvoir se connecter à Orders.
    - Le pare-feu ne doit pas autoriser l'outil à se connecter à Inventory ni à HR.
    - La règle de pare-feu de l'outil doit être répliquée vers le géosecondaire d'Orders.
