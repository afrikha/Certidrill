# KCNA objectives — Kubernetes and Cloud Native Associate.
# Source: CNCF KCNA Exam Curriculum (github.com/cncf/curriculum, KCNA_Curriculum.pdf, no version
# printed, PDF dated 2026-03-22; read on 2026-11-23), matching the domains of the certification page
# and of the "KCNA Upcoming Program Changes" page (effective no earlier than November 24, 2025).
# One group per curriculum competency, titles verbatim, in the curriculum's order.
# WRITTEN OBJECTIVES: the curriculum lists only competency names (13), no bullet points, and the
# official LFS250 course page gives only chapter titles. Every objective below is therefore OUR
# wording: 4–7 per competency, restating what the competency covers in the Kubernetes v1.37
# documentation (kubernetes.io concepts and tasks), the CNCF glossary and project sites, and in the
# competencies of the previous KCNA curriculum (old-versions/KCNA_Curriculum.pdf: Kubernetes
# Resources, Architecture, API, Containers, Scheduling; Container Orchestration Fundamentals,
# Runtime, Security, Networking, Service Mesh, Storage; Cloud Native Architecture Fundamentals,
# Autoscaling, Serverless, Community and Governance, Personas, Open Standards; Telemetry &
# Observability, Prometheus, Cost Management; Application Delivery Fundamentals, GitOps, CI/CD),
# each placed under the new competency that absorbs it.
# Codes <domain order>.<group>.<n>; `code` is the stable key referenced by question files and course
# sections. English only (the exam is not offered in French).
fundamentals:
- group:
    en: Kubernetes Core Concepts
  objectives:
  - code: 1.1.1
    en: Describe the Kubernetes cluster architecture and the role of each control plane component (kube-apiserver, etcd, kube-scheduler, kube-controller-manager, cloud-controller-manager)
  - code: 1.1.2
    en: Describe the node components (kubelet, kube-proxy, container runtime) and how they interact with the control plane
  - code: 1.1.3
    en: Describe the Kubernetes API and its declarative model, including API groups and versions, object spec and status, and the controller reconciliation loop
  - code: 1.1.4
    en: Describe Pods and the workload resources (Deployment, ReplicaSet, StatefulSet, DaemonSet, Job, CronJob) and choose the right one for a workload
  - code: 1.1.5
    en: Organize and select objects with namespaces, labels, label selectors and annotations
  - code: 1.1.6
    en: Provide configuration to applications with ConfigMaps and Secrets, as environment variables or mounted files
  - code: 1.1.7
    en: Describe how Kubernetes is extended with CustomResourceDefinitions, custom controllers and the operator pattern
- group:
    en: Administration
  objectives:
  - code: 1.2.1
    en: Use kubectl to create, list, describe, edit and delete resources, and compare imperative commands with declarative configuration (kubectl apply)
  - code: 1.2.2
    en: Read and write YAML manifests (apiVersion, kind, metadata, spec) and discover resource fields with kubectl explain and kubectl api-resources
  - code: 1.2.3
    en: Describe how users and tools access a cluster through kubeconfig files, clusters, users and contexts
  - code: 1.2.4
    en: Describe the ways to deploy a cluster, including kubeadm, managed Kubernetes services and local clusters for learning (kind, minikube)
  - code: 1.2.5
    en: Describe Kubernetes releases and cluster maintenance, including the release cadence, supported versions, upgrades, and cordoning and draining nodes
  - code: 1.2.6
    en: Limit resource consumption per namespace with ResourceQuota and LimitRange
- group:
    en: Scheduling
  objectives:
  - code: 1.3.1
    en: Describe how kube-scheduler assigns Pods to nodes (filtering and scoring of feasible nodes, binding) and why a Pod stays Pending
  - code: 1.3.2
    en: Describe resource requests and limits, how requests drive scheduling, and the resulting QoS classes (Guaranteed, Burstable, BestEffort)
  - code: 1.3.3
    en: Constrain Pod placement with nodeSelector, node affinity, and inter-Pod affinity and anti-affinity
  - code: 1.3.4
    en: Use taints and tolerations to keep Pods off nodes or to dedicate nodes
  - code: 1.3.5
    en: Describe Pod priority and preemption, and spreading Pods with topology spread constraints
- group:
    en: Containerization
  objectives:
  - code: 1.4.1
    en: Compare containers with virtual machines and describe the Linux features that isolate containers (namespaces, cgroups)
  - code: 1.4.2
    en: Describe container images (layers, tags, digests), registries, image pull policies and the Open Container Initiative (OCI) specifications
  - code: 1.4.3
    en: Describe how container images are built from a Dockerfile, including multi-stage builds and small base images
  - code: 1.4.4
    en: Describe container runtimes and the Container Runtime Interface (CRI), including containerd, CRI-O, low-level runtimes such as runc, and the removal of dockershim
  - code: 1.4.5
    en: Describe sandboxed container runtimes (gVisor, Kata Containers) and selecting a runtime with RuntimeClass
orchestration:
- group:
    en: Networking
  objectives:
  - code: 2.1.1
    en: Describe the Kubernetes network model (an IP address per Pod, Pod-to-Pod communication without NAT) and the role of Container Network Interface (CNI) plugins
  - code: 2.1.2
    en: Describe Services and their types (ClusterIP, NodePort, LoadBalancer, ExternalName, headless), EndpointSlices and the role of kube-proxy
  - code: 2.1.3
    en: Describe DNS-based service discovery in the cluster with CoreDNS
  - code: 2.1.4
    en: Expose HTTP and HTTPS applications with Ingress and Ingress controllers, and with the Gateway API
  - code: 2.1.5
    en: Control traffic between Pods with NetworkPolicy, including default-deny policies
  - code: 2.1.6
    en: Describe service meshes (sidecar and sidecarless data planes, mutual TLS, traffic management, observability) and service mesh projects such as Istio and Linkerd
- group:
    en: Security
  objectives:
  - code: 2.2.1
    en: Describe the layers of cloud native security and how the API server processes a request through authentication, authorization and admission control
  - code: 2.2.2
    en: Authorize access with RBAC (Role, ClusterRole, RoleBinding, ClusterRoleBinding) following the principle of least privilege
  - code: 2.2.3
    en: Describe ServiceAccounts and how Pods authenticate to the Kubernetes API
  - code: 2.2.4
    en: Describe the Pod Security Standards (Privileged, Baseline, Restricted), Pod Security Admission and the Pod securityContext
  - code: 2.2.5
    en: Describe how Secrets are protected (base64 encoding is not encryption, encryption at rest, access control)
  - code: 2.2.6
    en: Describe container image and supply chain security, including vulnerability scanning, image signing and policy enforcement with admission controllers such as OPA Gatekeeper and Kyverno
- group:
    en: Troubleshooting
  objectives:
  - code: 2.3.1
    en: Inspect the state of resources and cluster events with kubectl get, kubectl describe and kubectl events
  - code: 2.3.2
    en: Interpret Pod phases, container states and common failure reasons (Pending, CrashLoopBackOff, ImagePullBackOff, OOMKilled)
  - code: 2.3.3
    en: Describe liveness, readiness and startup probes and the effect of a failing probe
  - code: 2.3.4
    en: Troubleshoot Service connectivity (selector and label mismatch, missing endpoints, wrong ports, DNS resolution)
  - code: 2.3.5
    en: Troubleshoot nodes and cluster components (node conditions, NotReady nodes, kubelet and control plane component health)
- group:
    en: Storage
  objectives:
  - code: 2.4.1
    en: Describe volumes and their lifetime, including ephemeral volumes (emptyDir, configMap, secret, projected) and hostPath
  - code: 2.4.2
    en: Describe PersistentVolumes and PersistentVolumeClaims, binding, access modes and reclaim policies
  - code: 2.4.3
    en: Describe dynamic provisioning with StorageClasses and the default StorageClass
  - code: 2.4.4
    en: Describe the Container Storage Interface (CSI) and CSI drivers
  - code: 2.4.5
    en: Describe persistent storage for stateful applications with StatefulSets and volumeClaimTemplates
delivery:
- group:
    en: Application Delivery
  objectives:
  - code: 3.1.1
    en: Describe application delivery fundamentals and deployment strategies (rolling update, recreate, blue-green, canary)
  - code: 3.1.2
    en: Manage Deployment rollouts with kubectl rollout (status, history, undo, pause and resume) and the maxSurge and maxUnavailable settings
  - code: 3.1.3
    en: Package, install and customize applications with Helm charts, releases and values, and with Kustomize
  - code: 3.1.4
    en: Describe continuous integration and continuous delivery (CI/CD) pipelines for containerized applications
  - code: 3.1.5
    en: Describe GitOps principles (declarative, versioned and immutable, pulled automatically, continuously reconciled) and GitOps tools such as Argo CD and Flux
- group:
    en: Debugging
  objectives:
  - code: 3.2.1
    en: Read application logs with kubectl logs, including the previous container instance, a specific container and streaming
  - code: 3.2.2
    en: Run commands in a running container with kubectl exec and debug Pods with ephemeral containers (kubectl debug)
  - code: 3.2.3
    en: Reach an application from a workstation for testing with kubectl port-forward
  - code: 3.2.4
    en: Debug application configuration errors (wrong image or tag, missing ConfigMap or Secret, wrong command or arguments, insufficient resources)
  - code: 3.2.5
    en: Debug a failed rollout with rollout status, ReplicaSet history and events, and roll back
architecture:
- group:
    en: Observability
  objectives:
  - code: 4.1.1
    en: Describe observability and its telemetry signals (metrics, logs, traces) and how observability differs from monitoring
  - code: 4.1.2
    en: Describe Prometheus (pull-based scraping, time series, exporters, PromQL, Alertmanager) and dashboards with Grafana
  - code: 4.1.3
    en: Describe distributed tracing and OpenTelemetry (APIs, SDKs, the OpenTelemetry Collector) with tracing back ends such as Jaeger
  - code: 4.1.4
    en: Describe logging in Kubernetes (container logs, node-level logging agents run as DaemonSets) with log processors such as Fluentd and Fluent Bit
  - code: 4.1.5
    en: Describe cloud native cost management (right-sizing requests, autoscaling, cost visibility and allocation)
- group:
    en: Cloud Native Ecosystem and Principles
  objectives:
  - code: 4.2.1
    en: Describe cloud native principles and architecture (CNCF definition, microservices, immutable infrastructure, declarative APIs, resiliency, the twelve-factor app)
  - code: 4.2.2
    en: Describe autoscaling in Kubernetes (HorizontalPodAutoscaler, VerticalPodAutoscaler, Cluster Autoscaler) and event-driven autoscaling with KEDA
  - code: 4.2.3
    en: Describe serverless and Function as a Service on Kubernetes, including scale to zero and Knative
  - code: 4.2.4
    en: Describe the open standards of the cloud native ecosystem (OCI, CRI, CNI, CSI) and why they matter for portability
  - code: 4.2.5
    en: Navigate the CNCF landscape and identify the purpose of major CNCF projects by category
- group:
    en: Cloud Native Community and Collaboration
  objectives:
  - code: 4.3.1
    en: Describe the CNCF and its governance (Governing Board, Technical Oversight Committee, Technical Advisory Groups, end user community)
  - code: 4.3.2
    en: Describe the CNCF project maturity levels (Sandbox, Incubating, Graduated) and what they signal
  - code: 4.3.3
    en: Describe how the Kubernetes project is organized (Steering Committee, Special Interest Groups, working groups, Kubernetes Enhancement Proposals, release cycle)
  - code: 4.3.4
    en: Describe cloud native roles and personas (application developer, DevOps engineer, site reliability engineer, platform engineer, security engineer, cloud architect)
  - code: 4.3.5
    en: Describe open source collaboration in cloud native communities (contribution paths, code of conduct, open governance)
