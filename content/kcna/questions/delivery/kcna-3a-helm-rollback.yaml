id: kcna-3a-helm-rollback
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Helm release `shop` is at revision 3 after a faulty `helm upgrade`. Revision 2 worked. Which command returns the release to the configuration of revision 2?
body:
  options:
    - id: a
      text: { en: "`helm rollback shop 2`" }
    - id: b
      text: { en: "`helm upgrade shop example/webshop --version 2`" }
    - id: c
      text: { en: "`helm get values shop --revision 2`" }
    - id: d
      text: { en: "`helm history shop`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `helm rollback RELEASE REVISION` returns a release to an earlier revision. The rollback itself is recorded as a new revision (4 here), because every install, upgrade or rollback increments the revision number.
  options:
    b:
      en: "`--version` selects a chart version, not a release revision; chart version 2 may have nothing to do with revision 2 of the release."
    c:
      en: "`helm get values` only displays the values of a revision; it changes nothing in the cluster."
    d:
      en: "`helm history` lists the revisions of the release, which helps you choose one, but it does not roll back."
references:
  - title: Using Helm
    url: https://helm.sh/docs/intro/using_helm/
