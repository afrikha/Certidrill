id: kcna-3b-cfg-missing-secret-env
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You apply this Pod in a namespace where the Secret `db-credentials` does not exist yet:

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: orders
    spec:
      containers:
      - name: orders
        image: registry.example.com/orders:1.0
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
    ```

    What happens?
body:
  options:
    - id: a
      text: { en: "The Pod is created, but its container does not start until the Secret is available" }
    - id: b
      text: { en: "The API server rejects the Pod because the referenced Secret does not exist" }
    - id: c
      text: { en: "The container starts with `DB_PASSWORD` set to an empty string" }
    - id: d
      text: { en: "The scheduler keeps the Pod unscheduled until the Secret is created" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Secrets are required by default: none of a Pod's containers start until all its non-optional Secrets are available. The kubelet retries periodically and records an event for the Pod that describes the problem, so `kubectl describe pod` shows the cause. Creating the Secret in the Pod's namespace lets the container start.
  options:
    b:
      en: |
        The API server accepts the Pod; the missing Secret is found when the kubelet prepares the container on its node.
    c:
      en: |
        The container could start without the value only if the reference were marked `optional: true`; this reference is required.
    d:
      en: |
        Scheduling does not depend on Secrets; the Pod is assigned to a node, and its container waits there.
references:
  - title: Secrets
    url: https://kubernetes.io/docs/concepts/configuration/secret/
