id: kcna-3a-kustomize-hash-suffix
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A `kustomization.yaml` uses `configMapGenerator` to create the ConfigMap `app-config` used by a Deployment. The generated ConfigMap is named `app-config-8mbdf7882g`. Why does Kustomize add this suffix?
body:
  options:
    - id: a
      text: { en: "To avoid name conflicts with ConfigMaps of other namespaces" }
    - id: b
      text: { en: "So that changed content creates a new ConfigMap and the Deployment rolls out" }
    - id: c
      text: { en: "To mark the ConfigMap as immutable in the API server" }
    - id: d
      text: { en: "To encrypt the ConfigMap data before it is stored in etcd" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Generated ConfigMaps and Secrets get a content hash suffix, so new content produces a new name. Kustomize rewrites the references in the Deployment to the new name, which changes its Pod template and triggers a rollout that picks up the new configuration.
  options:
    a:
      en: Names only need to be unique within a namespace; the suffix is derived from the content, not from the namespace.
    c:
      en: Immutability is set with the `immutable` field of a ConfigMap, not by its name.
    d:
      en: The suffix is a hash of the content in the name; the data itself is not encrypted.
references:
  - title: Declarative Management of Kubernetes Objects Using Kustomize
    url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
