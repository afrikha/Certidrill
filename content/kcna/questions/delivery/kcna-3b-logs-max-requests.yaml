id: kcna-3b-logs-max-requests
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Deployment `ingest` runs 8 Pods labeled `app=ingest`. You run:

    ```bash
    kubectl logs -f -l app=ingest
    ```

    kubectl refuses to follow the logs because too many Pods match. Which flag lets you stream the logs of the 8 Pods?
body:
  options:
    - id: a
      text: { en: "`--all-pods=true`" }
    - id: b
      text: { en: "`--tail=8`" }
    - id: c
      text: { en: "`--max-log-requests=8`" }
    - id: d
      text: { en: "`--ignore-errors=true`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With a selector, `--max-log-requests` sets how many log streams kubectl follows at the same time, and its default is 5. Following the 8 Pods needs a value of at least 8.
  options:
    a:
      en: |
        `--all-pods` gets the logs of all the Pods of a resource named as TYPE/NAME, such as `deployment/ingest`; it does not change how many streams kubectl may follow at once.
    b:
      en: |
        `--tail=8` limits each stream to its last 8 lines; it does not change how many Pods can be followed.
    d:
      en: |
        `--ignore-errors` makes errors non-fatal while following logs; it does not raise the limit of concurrent streams.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
