id: kcna-3b-pf-session-ends
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer runs `kubectl port-forward deployment/api 8080:8080`. During a rolling update of `api`, the forwarding stops working.

    What explains this?
body:
  options:
    - id: a
      text: { en: "Port forwarding works only with Deployments that use the `Recreate` strategy" }
    - id: b
      text: { en: "The session ends when the selected Pod terminates, and the command must be run again" }
    - id: c
      text: { en: "The rolling update changes the ClusterIP address of the Service in front of `api`" }
    - id: d
      text: { en: "The API server blocks port forwarding while a Deployment is rolling out" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      kubectl selects one Pod when the command starts. The forwarding session ends when that Pod terminates, which happens when the rolling update replaces it, and you must run the command again to forward to a new Pod.
  options:
    a:
      en: |
        The strategy does not matter: with either strategy the old Pods are terminated, and the session ends with its Pod.
    c:
      en: |
        `port-forward` does not use a Service's IP address, and a rolling update does not change a Service's ClusterIP.
    d:
      en: |
        Rollouts do not block port forwarding; the session stopped because its Pod was terminated.
references:
  - title: kubectl port-forward
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_port-forward/
