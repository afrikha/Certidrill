id: kcna-3b-logs-since
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Users reported errors starting about 20 minutes ago. You want to read only the log lines that the Pod `orders-6b8f` wrote in the last 30 minutes.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl logs orders-6b8f --tail=30`" }
    - id: b
      text: { en: "`kubectl logs orders-6b8f --since=30m`" }
    - id: c
      text: { en: "`kubectl logs orders-6b8f --since-time=30m`" }
    - id: d
      text: { en: "`kubectl events --for pod/orders-6b8f`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `--since` takes a relative duration such as `5s`, `2m` or `3h` and returns only the lines newer than it. Without it, `kubectl logs` returns all the available lines.
  options:
    a:
      en: |
        `--tail=30` returns the last 30 lines, which may cover a few seconds or several hours.
    c:
      en: |
        `--since-time` expects an absolute date in RFC3339 format, such as `2026-11-23T10:00:00Z`, not a duration.
    d:
      en: |
        `kubectl events` lists the Kubernetes events of the Pod; it does not show what the application wrote to its logs.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
