id: kcna-3b-cfg-deployment-exit-zero
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Deployment `nightly-report` runs a container whose command builds a report, then exits with code 0 after about 30 seconds. The Pods keep restarting and soon show `CrashLoopBackOff`.

    What explains this?
body:
  options:
    - id: a
      text: { en: "The kubelet treats exit code 0 from a Deployment container as a failure" }
    - id: b
      text: { en: "The Pods use `restartPolicy: Always`, which restarts any exited container" }
    - id: c
      text: { en: "The container needs a liveness probe to report that it has completed" }
    - id: d
      text: { en: "The container reaches its memory limit when it writes the report" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Deployment only allows `restartPolicy: Always`, which restarts a container after any termination, successful or not. A command that finishes is therefore restarted again and again with a growing back-off delay, which shows as `CrashLoopBackOff`. A run-to-completion task belongs in a Job, or in a CronJob if it runs on a schedule.
  options:
    a:
      en: |
        Exit code 0 means success; under `OnFailure` the container would not be restarted, but a Deployment does not allow that policy.
    c:
      en: |
        A liveness probe checks a running container; it cannot mark a container as completed.
    d:
      en: |
        A memory limit problem shows `OOMKilled` with exit code 137, not a clean exit with code 0.
references:
  - title: Pod Lifecycle
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
