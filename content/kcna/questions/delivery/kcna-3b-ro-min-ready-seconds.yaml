id: kcna-3b-ro-min-ready-seconds
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A new version of the Deployment `api` passes its readiness probe, then crashes about 20 seconds after it starts. Because the new Pods became ready, the rolling update replaced all the old Pods before the crashes began.

    Which Deployment field makes the controller wait until a new Pod has stayed ready for a given time before it counts the Pod as available?
body:
  options:
    - id: a
      text: { en: "`spec.minReadySeconds`" }
    - id: b
      text: { en: "`spec.progressDeadlineSeconds`" }
    - id: c
      text: { en: "`spec.revisionHistoryLimit`" }
    - id: d
      text: { en: "`spec.template.spec.terminationGracePeriodSeconds`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `minReadySeconds` is the minimum number of seconds a new Pod must stay ready, without any of its containers crashing, before it is considered available. It defaults to 0, so a Pod is available as soon as it is ready. With `minReadySeconds: 30`, the crashing Pods would never become available, and the rollout would stall instead of replacing all the old Pods.
  options:
    b:
      en: |
        `progressDeadlineSeconds` sets how long the controller waits before it reports a stalled rollout; it does not delay availability.
    c:
      en: |
        `revisionHistoryLimit` sets how many old ReplicaSets are kept for rollbacks.
    d:
      en: |
        `terminationGracePeriodSeconds` gives containers time to stop when their Pod is deleted; it does not affect availability.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
