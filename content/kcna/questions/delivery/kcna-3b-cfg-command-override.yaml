id: kcna-3b-cfg-command-override
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Deployment copied from a test template contains this container:

    ```yaml
    containers:
    - name: web
      image: registry.example.com/shop/web:1.8
      command: ["sleep", "3600"]
    ```

    The image normally starts a web server. The Pods are `Running` with no restarts, but nothing answers on the web server's port. What is the cause?
body:
  options:
    - id: a
      text: { en: "The image tag `1.8` does not exist in the registry" }
    - id: b
      text: { en: "The container has no memory limit set in its spec" }
    - id: c
      text: { en: "The Pods have no readiness probe in their spec" }
    - id: d
      text: { en: "The `command` field replaces the image's default command" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `command` set in the Pod spec overrides the default command of the image. Here the container runs `sleep 3600`, so the process is healthy and the Pod is `Running`, but the web server is never started. Removing `command`, or setting the server's command, fixes it.
  options:
    a:
      en: |
        A missing tag would leave the container waiting with `ImagePullBackOff`; these Pods are `Running`.
    b:
      en: |
        Without a memory limit, the container may use more memory; that does not stop the web server from starting.
    c:
      en: |
        A readiness probe only reports whether the Pod can receive traffic; it does not start the web server.
references:
  - title: Define a Command and Arguments for a Container
    url: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
