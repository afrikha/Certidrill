id: kcna-3b-exec-interactive-shell
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You need an interactive shell in the container `web` of the Pod `frontend-0` to look at its files while the application runs. The image includes `sh`.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl exec -it frontend-0 -c web -- sh`" }
    - id: b
      text: { en: "`kubectl attach -it frontend-0 -c web`" }
    - id: c
      text: { en: "`kubectl exec frontend-0 -c web -- sh`" }
    - id: d
      text: { en: "`kubectl run -it shell --image=busybox:1.36 -- sh`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `-i` passes your standard input to the container and `-t` allocates a terminal; together they give an interactive session. `-c web` selects the container, and the command after `--` starts the shell inside it.
  options:
    b:
      en: |
        `kubectl attach` connects to the process that is already running in the container, the application, not to a new shell.
    c:
      en: |
        Without `-i` and `-t`, your input is not passed to `sh`, so you do not get an interactive session.
    d:
      en: |
        This starts a new busybox Pod; its shell cannot see the files of the `web` container.
references:
  - title: kubectl exec
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_exec/
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
