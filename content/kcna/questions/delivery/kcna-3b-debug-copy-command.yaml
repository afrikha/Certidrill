id: kcna-3b-debug-copy-command
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The container `myapp` of the Pod `myapp` exits right after it starts, so you cannot `exec` into it. You want a copy of the Pod in which the `myapp` container runs `sh` instead of its usual command, with the same image and settings.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl debug myapp -it --copy-to=myapp-debug --container=myapp -- sh`" }
    - id: b
      text: { en: "`kubectl debug myapp -it --copy-to=myapp-debug --image=busybox -- sh`" }
    - id: c
      text: { en: "`kubectl debug myapp -it --image=busybox --target=myapp -- sh`" }
    - id: d
      text: { en: "`kubectl exec -it myapp -c myapp -- sh`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With `--copy-to`, `kubectl debug` creates a copy of the Pod. When `--container` names an existing container, the command after `--` replaces that container's command in the copy, here `sh`, and the image and settings stay the same. Without `--container`, kubectl adds a new container to run the command instead.
  options:
    b:
      en: |
        Without `--container=myapp`, kubectl adds a new busybox container running `sh` to the copy; `myapp` keeps its command and keeps exiting.
    c:
      en: |
        This adds an ephemeral container to the original Pod; the `myapp` container still runs its usual command.
    d:
      en: |
        `kubectl exec` needs a running container, and `myapp` exits right after it starts.
references:
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
  - title: kubectl debug
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_debug/
