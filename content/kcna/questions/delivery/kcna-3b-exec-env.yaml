id: kcna-3b-exec-env
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The container of the running Pod `payments-0` should receive the environment variable `DB_HOST`. You want to list the environment variables that the running process actually sees.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl run env-check --image=busybox:1.36 -- env`" }
    - id: b
      text: { en: "`kubectl attach payments-0`" }
    - id: c
      text: { en: "`kubectl logs payments-0 --previous`" }
    - id: d
      text: { en: "`kubectl exec payments-0 -- env`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kubectl exec` runs a command in a running container, here `env`, which prints the environment of that container. Everything after `--` is the command to run in the container.
  options:
    a:
      en: |
        `kubectl run` creates a new Pod from the busybox image; `env` then prints the environment of that new container, not the one of `payments-0`.
    b:
      en: |
        `kubectl attach` connects to the process already running in the container; it does not run a new command such as `env`.
    c:
      en: |
        `kubectl logs --previous` prints the logs of the previous container instance; it does not list environment variables.
references:
  - title: kubectl exec
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_exec/
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
