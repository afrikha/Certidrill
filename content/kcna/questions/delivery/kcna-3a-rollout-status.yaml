id: kcna-3a-rollout-status
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A deployment script updates the image of the Deployment `web`. The script must wait until the rollout finishes and fail if it does not complete. Which command should the script run next?
body:
  options:
    - id: a
      text: { en: "`kubectl rollout status deployment/web`" }
    - id: b
      text: { en: "`kubectl rollout history deployment/web`" }
    - id: c
      text: { en: "`kubectl rollout resume deployment/web`" }
    - id: d
      text: { en: "`kubectl describe deployment/web`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl rollout status` watches the rollout until it completes. It returns a zero exit code on success and a non-zero exit code when the Deployment exceeds its progress deadline, so a script can stop on failure.
  options:
    b:
      en: "`rollout history` prints the list of revisions and returns immediately; it does not wait for the current rollout."
    c:
      en: "`rollout resume` restarts a paused rollout; it neither waits nor reports the result."
    d:
      en: "`kubectl describe` prints the current state once and returns; it does not wait for completion."
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
