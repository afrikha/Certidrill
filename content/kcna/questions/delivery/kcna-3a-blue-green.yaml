id: kcna-3a-blue-green
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team runs two complete environments. One serves all live traffic while the new version is deployed and tested in the idle one. A load balancer then moves all traffic to the new environment at once. Which deployment strategy is this?
body:
  options:
    - id: a
      text: { en: "Blue-green deployment" }
    - id: b
      text: { en: "Canary deployment" }
    - id: c
      text: { en: "Rolling update" }
    - id: d
      text: { en: "Recreate" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Blue-green keeps two environments, one live and one idle. The new version is tested in the idle environment, then all traffic is switched to it, usually through a load balancer. Switching back is the rollback.
  options:
    b:
      en: A canary sends only a small, growing share of traffic to the new version, not all traffic at once.
    c:
      en: A rolling update replaces instances progressively within one environment, so both versions serve traffic during the update.
    d:
      en: Recreate stops the old version before starting the new one in the same environment, which causes downtime.
references:
  - title: Blue Green Deployment
    url: https://glossary.cncf.io/blue-green-deployment/
