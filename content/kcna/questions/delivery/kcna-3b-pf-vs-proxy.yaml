id: kcna-3b-pf-vs-proxy
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You want to call the Kubernetes API from your workstation with `curl http://localhost:8001/api/v1/namespaces/shop/pods`.

    Which command should you run first?
body:
  options:
    - id: a
      text: { en: "`kubectl port-forward pod/web-0 8001:80`" }
    - id: b
      text: { en: "`kubectl proxy`" }
    - id: c
      text: { en: "`kubectl get --raw /api/v1/namespaces/shop/pods`" }
    - id: d
      text: { en: "`kubectl cluster-info`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubectl proxy` runs a proxy server between localhost and the Kubernetes API server, listening on port 8001 by default. `curl` then sends plain HTTP requests to `localhost:8001`, and the proxy forwards them to the API server.
  options:
    a:
      en: |
        This forwards local port 8001 to port 80 of an application Pod, not to the Kubernetes API server.
    c:
      en: |
        `kubectl get --raw` sends one request to the API server and prints the result; it opens no local port for `curl`.
    d:
      en: |
        `kubectl cluster-info` prints the addresses of the control plane and cluster services; it starts no local proxy.
references:
  - title: kubectl proxy
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_proxy/
