id: kcna-3a-ci-output
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a CI/CD pipeline for a containerized application, what is the usual output of the continuous integration stage?
body:
  options:
    - id: a
      text: { en: "A running Deployment in the production cluster" }
    - id: b
      text: { en: "A tested container image pushed to a registry" }
    - id: c
      text: { en: "A new node added to the cluster" }
    - id: d
      text: { en: "A Git commit that reverts the last change" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CI starts when changes are committed and ends with a tested artifact ready for the CD system. For a containerized application, that artifact is the container image, pushed to a registry where later stages can pull it.
  options:
    a:
      en: Running the new version in production is the job of the delivery or deployment stage, not of CI.
    c:
      en: Adding nodes is cluster capacity management, for example by a cluster autoscaler; it is not a pipeline output.
    d:
      en: A revert commit is a way to roll back a change, not the normal result of a CI run.
references:
  - title: Continuous integration (CI)
    url: https://glossary.cncf.io/continuous-integration/
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
