id: kcna-3a-push-credentials
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI/CD server outside the cluster deploys each release by running `kubectl apply` against the production cluster. What must this server hold?
body:
  options:
    - id: a
      text: { en: "Credentials allowed to change resources through the cluster's API server" }
    - id: b
      text: { en: "SSH access to every worker node of the cluster" }
    - id: c
      text: { en: "A copy of the etcd data of the cluster" }
    - id: d
      text: { en: "Nothing, because the cluster pulls the manifests from the server" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In this push model, the pipeline acts as a client of the API server, so it needs a kubeconfig with credentials authorized to create and update the resources. Those powerful credentials live outside the cluster, which is one reason teams adopt pull-based GitOps.
  options:
    b:
      en: "`kubectl` talks only to the API server; it never needs SSH access to nodes."
    c:
      en: Clients never read etcd directly; all changes go through the API server, which stores them in etcd.
    d:
      en: A cluster pulling its desired state describes GitOps with an in-cluster agent, not a pipeline that runs `kubectl apply`.
references:
  - title: Organizing Cluster Access Using kubeconfig Files
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
  - title: GitOps
    url: https://glossary.cncf.io/gitops/
