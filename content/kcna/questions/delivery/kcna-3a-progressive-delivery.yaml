id: kcna-3a-progressive-delivery
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team wants canary releases in which traffic shifts by steps, Prometheus metrics are checked at each step, and a bad release is rolled back automatically. Which project provides this?
body:
  options:
    - id: a
      text: { en: "Helm" }
    - id: b
      text: { en: "Kustomize" }
    - id: c
      text: { en: "Argo Rollouts" }
    - id: d
      text: { en: "HorizontalPodAutoscaler" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Argo Rollouts is a Kubernetes controller with CRDs that adds blue-green and canary strategies, step-by-step traffic shifting and analysis of metrics from providers such as Prometheus, with automated promotion or rollback. The native Deployment can pause a rollout but cannot abort and roll back on its own.
  options:
    a:
      en: Helm packages and installs applications as releases; it does not shift traffic or analyze metrics during a rollout.
    b:
      en: Kustomize customizes YAML manifests per environment; it has no runtime control over traffic.
    d:
      en: The HorizontalPodAutoscaler changes the number of replicas based on metrics; it does not manage releases.
references:
  - title: Argo Rollouts - Kubernetes Progressive Delivery Controller
    url: https://argoproj.github.io/argo-rollouts/
