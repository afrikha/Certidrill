id: kcna-3a-rollout-restart
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pods of the Deployment `web` read their settings only at startup. You need to replace all of them with new Pods using the same Pod template, without downtime. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl rollout undo deployment/web`" }
    - id: b
      text: { en: "`kubectl rollout resume deployment/web`" }
    - id: c
      text: { en: "`kubectl rollout status deployment/web`" }
    - id: d
      text: { en: "`kubectl rollout restart deployment/web`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kubectl rollout restart` restarts a Deployment, DaemonSet or StatefulSet: it triggers a new rolling rollout that recreates the Pods with the same specification, following the Deployment's update strategy.
  options:
    a:
      en: "`rollout undo` returns to the previous revision, which changes the Pod template instead of keeping it."
    b:
      en: "`rollout resume` only restarts a paused rollout; on a Deployment that is not paused it does nothing."
    c:
      en: "`rollout status` only reports progress; it does not replace any Pod."
references:
  - title: kubectl rollout restart
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/kubectl_rollout_restart/
  - title: kubectl rollout
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/
