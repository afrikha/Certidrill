id: kcna-3b-ro-deadline-default
objective: "3.2.5"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    A Deployment does not set `progressDeadlineSeconds`. How long does the Deployment controller wait without progress before it reports the rollout as stalled?
body:
  options:
    - id: a
      text: { en: "300 seconds" }
    - id: b
      text: { en: "600 seconds" }
    - id: c
      text: { en: "900 seconds" }
    - id: d
      text: { en: "3,600 seconds" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `.spec.progressDeadlineSeconds` defaults to 600 seconds. After that time without progress, the controller sets the `Progressing` condition to `False` with reason `ProgressDeadlineExceeded`, and `kubectl rollout status` exits with an error.
  options:
    a:
      en: |
        300 seconds is the maximum back-off delay between image pull or container restart attempts, not the progress deadline.
    c:
      en: |
        900 seconds is not a Kubernetes default for Deployments; the default deadline is 600 seconds.
    d:
      en: |
        3,600 seconds is not the default; you can set such a value yourself if a rollout legitimately needs that long.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
