id: kcna-3b-exec-double-dash
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the role of `--` in the following command?

    ```bash
    kubectl exec mypod -i -t -- ls -t /usr
    ```
body:
  options:
    - id: a
      text: { en: "It runs the command in every container of the Pod" }
    - id: b
      text: { en: "It separates the kubectl flags from the command to run in the container" }
    - id: c
      text: { en: "It runs the command in a new ephemeral container" }
    - id: d
      text: { en: "It passes the command to a shell instead of running it directly" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Everything after `--` is the command and its arguments, passed to the container as they are. Here `-t` appears twice: before `--` it is kubectl's `--tty` flag, after `--` it is an option of `ls`. Without the separator, kubectl could read the command's flags as its own.
  options:
    a:
      en: |
        `kubectl exec` runs the command in one container, chosen with `-c` or by default, not in all of them.
    c:
      en: |
        An ephemeral container is added with `kubectl debug`; `kubectl exec` runs the command in an existing container.
    d:
      en: |
        The command runs directly in the container; to use shell features you start a shell yourself, for example `sh -c`.
references:
  - title: kubectl exec
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_exec/
