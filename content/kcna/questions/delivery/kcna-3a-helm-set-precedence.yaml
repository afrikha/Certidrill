id: kcna-3a-helm-set-precedence
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The chart `example/webshop` sets `replicaCount: 2` in its `values.yaml`. The file `prod.yaml` sets `replicaCount: 3`. You run:

    ```bash
    helm install shop example/webshop -f prod.yaml --set replicaCount=5
    ```

    How many replicas does the release use?
body:
  options:
    - id: a
      text: { en: "2" }
    - id: b
      text: { en: "3" }
    - id: c
      text: { en: "5" }
    - id: d
      text: { en: "The install fails because the value is defined twice." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Values passed on the command line override the chart defaults. When `-f` (`--values`) and `--set` are both used, `--set` takes precedence, so `replicaCount` is 5.
  options:
    a:
      en: The chart's `values.yaml` only provides defaults; both overrides take priority over it.
    b:
      en: "`prod.yaml` overrides the default, but `--set` has a higher priority than `-f`."
    d:
      en: Defining a value in several places is normal; Helm merges them following a fixed order of precedence.
references:
  - title: Using Helm
    url: https://helm.sh/docs/intro/using_helm/
