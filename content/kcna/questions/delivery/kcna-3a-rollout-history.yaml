id: kcna-3a-rollout-history
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You need to list the revisions of the Deployment `web` to see which versions it has rolled out. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl rollout status deployment/web`" }
    - id: b
      text: { en: "`kubectl rollout history deployment/web`" }
    - id: c
      text: { en: "`kubectl logs deployment/web`" }
    - id: d
      text: { en: "`kubectl get events`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubectl rollout history` lists the revisions of a Deployment, DaemonSet or StatefulSet. Add `--revision=N` to see the Pod template of one revision.
  options:
    a:
      en: "`kubectl rollout status` reports the progress of the current rollout, not the list of past revisions."
    c:
      en: "`kubectl logs` prints container output of one Pod of the Deployment; it says nothing about revisions."
    d:
      en: "`kubectl get events` lists recent cluster events, which expire and do not form a revision history."
references:
  - title: kubectl rollout history
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/kubectl_rollout_history/
