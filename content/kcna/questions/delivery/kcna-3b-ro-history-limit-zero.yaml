id: kcna-3b-ro-history-limit-zero
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Deployment has the following settings:

    ```yaml
    spec:
      replicas: 4
      revisionHistoryLimit: 0
    ```

    The rollout of a new version has completed, and users now report that this version is broken. What is the effect of `revisionHistoryLimit: 0`?
body:
  options:
    - id: a
      text: { en: "`kubectl rollout undo` cannot roll back, because no old ReplicaSet was kept" }
    - id: b
      text: { en: "`kubectl rollout undo` works, but `rollout history` shows no CHANGE-CAUSE" }
    - id: c
      text: { en: "The Deployment rolls back automatically, because it keeps no history" }
    - id: d
      text: { en: "It has no effect, because 0 means that the default of 10 revisions applies" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `revisionHistoryLimit` sets how many old ReplicaSets are retained to allow rollback, 10 by default. Setting it to 0 cleans up all the history of the Deployment, so it cannot be rolled back; you must apply the previous version again, for example from version control.
  options:
    b:
      en: |
        A rollback relies on the old ReplicaSets; with none kept, `undo` has no revision to return to.
    c:
      en: |
        Kubernetes never rolls a Deployment back automatically, whatever its history setting.
    d:
      en: |
        0 is an explicit value, not an unset field: it removes the history instead of applying the default.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
