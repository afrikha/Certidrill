id: kcna-3a-continuous-deployment
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a company's pipeline, every change that passes all automated tests is released to production automatically, with no manual approval step. Which practice is this?
body:
  options:
    - id: a
      text: { en: "Continuous deployment" }
    - id: b
      text: { en: "Continuous delivery" }
    - id: c
      text: { en: "Continuous integration" }
    - id: d
      text: { en: "Blue-green deployment" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Continuous deployment goes one step further than continuous delivery: finished software that passes the pipeline is deployed directly to production, through all environments, without a manual gate.
  options:
    b:
      en: Continuous delivery automatically brings changes to an acceptance environment and keeps them releasable; the production release is not automatic.
    c:
      en: Continuous integration ends with a tested artifact; it does not release it to production.
    d:
      en: Blue-green is a strategy for switching traffic between two environments during a release; it says nothing about whether releases are automatic.
references:
  - title: Continuous Deployment (CD)
    url: https://glossary.cncf.io/continuous-deployment/
