id: kcna-3b-cfg-allocatable-cpu
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Each worker node of a cluster has 2 CPUs. `kubectl describe node` shows, for every node:

    ```text
    Capacity:
      cpu:     2
    Allocatable:
      cpu:     1800m
    ```

    A new Pod requests `cpu: "2"`. CPU usage on the nodes is low, yet the Pod stays `Pending` with `Insufficient cpu`. Why?
body:
  options:
    - id: a
      text: { en: "The scheduler compares the request with the current CPU usage of each node" }
    - id: b
      text: { en: "A single Pod can never request more than half of a node's capacity" }
    - id: c
      text: { en: "CPU requests must be written in millicores, such as `2000m`" }
    - id: d
      text: { en: "Requests must fit in the allocatable CPU, which is below the capacity" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Allocatable is the amount of a node's resources that is available to Pods. The scheduler places a Pod only where its requests fit in that amount, together with the requests of the Pods already there. A 2-CPU request never fits in 1800m, so the Pod cannot be scheduled: lower the request or use larger nodes.
  options:
    a:
      en: |
        The scheduler checks requests, not usage: it refuses a node whose capacity check fails even when the node's actual usage is very low.
    b:
      en: |
        There is no such rule; a Pod can request up to what a node has allocatable.
    c:
      en: |
        `"2"` and `2000m` are the same quantity; the unit is not the problem.
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
