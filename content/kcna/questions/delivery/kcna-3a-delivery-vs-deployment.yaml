id: kcna-3a-delivery-vs-deployment
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Every merged change is automatically built, tested and deployed to an acceptance environment, where it is ready for release. A release manager then decides when each version goes to production. Which practice does this pipeline implement?
body:
  options:
    - id: a
      text: { en: "Continuous integration only" }
    - id: b
      text: { en: "Continuous deployment" }
    - id: c
      text: { en: "Canary deployment" }
    - id: d
      text: { en: "Continuous delivery" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Continuous delivery automatically brings every change into an acceptance environment, tested and releasable. Because the production release stays a decision, this is not continuous deployment.
  options:
    a:
      en: |
        The pipeline goes beyond CI: it also deploys every change automatically to an acceptance environment.
    b:
      en: Continuous deployment would release each change that passes the pipeline directly to production, with no manual decision.
    c:
      en: Canary is a strategy for releasing a version to a small share of traffic; the scenario describes the pipeline stages, not traffic shifting.
references:
  - title: Continuous Delivery (CD)
    url: https://glossary.cncf.io/continuous-delivery/
  - title: Continuous Deployment (CD)
    url: https://glossary.cncf.io/continuous-deployment/
