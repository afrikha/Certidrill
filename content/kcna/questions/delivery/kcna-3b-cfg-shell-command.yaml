id: kcna-3b-cfg-shell-command
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container must print a greeting, then wait. The image includes `/bin/sh`. The container is configured as follows:

    ```yaml
    env:
    - name: GREETING
      value: "hello"
    command: ["echo $GREETING && sleep 3600"]
    ```

    The container fails to start, because no executable has that whole string as its name. What should you change?
body:
  options:
    - id: a
      text: { en: "Replace `$GREETING` with `$(GREETING)` inside the string" }
    - id: b
      text: { en: "Move the string from `command` to `args`" }
    - id: c
      text: { en: "Set `command: [\"/bin/sh\", \"-c\"]` and put the string in `args`" }
    - id: d
      text: { en: "Split the string into one `command` item per word" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The first item of `command` is run directly as an executable, without a shell, so `&&` and `$GREETING` are not interpreted. To run a pipeline or a small script, start a shell: `/bin/sh` with `-c`, and the script as its argument. The shell then expands `$GREETING` and runs both commands.
  options:
    a:
      en: |
        Kubernetes would expand `$(GREETING)`, but the whole string would still be run as the name of a single executable.
    b:
      en: |
        With only `args`, the image's default command runs with the string as an argument; no shell interprets `&&`.
    d:
      en: |
        Without a shell, `echo` receives `$GREETING`, `&&`, `sleep` and `3600` as plain arguments and prints them; `sleep` never runs.
references:
  - title: Define a Command and Arguments for a Container
    url: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
