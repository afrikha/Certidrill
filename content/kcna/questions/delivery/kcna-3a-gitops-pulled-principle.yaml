id: kcna-3a-gitops-pulled-principle
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which OpenGitOps principle states that software agents fetch the desired state declarations from the source by themselves?
body:
  options:
    - id: a
      text: { en: "Declarative" }
    - id: b
      text: { en: "Versioned and immutable" }
    - id: c
      text: { en: "Continuously reconciled" }
    - id: d
      text: { en: "Pulled automatically" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Pulled automatically: software agents automatically pull the desired state declarations from the source, instead of a pipeline pushing changes into the system.
  options:
    a:
      en: Declarative means the desired state is expressed as a target to reach, not as a sequence of steps.
    b:
      en: Versioned and immutable means the desired state is stored with a complete version history that cannot be altered.
    c:
      en: Continuously reconciled means agents keep observing the actual state and applying the desired state; it is about correcting differences, not about fetching.
references:
  - title: documents/PRINCIPLES.md at main · open-gitops/documents
    url: https://github.com/open-gitops/documents/blob/main/PRINCIPLES.md
