id: kcna-3b-ro-quota-failedcreate
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A rollout of the Deployment `web` in the namespace `shop` makes no progress. `kubectl describe deployment web` shows:

    ```text
    Conditions:
      Type            Status  Reason
      ----            ------  ------
      Available       True    MinimumReplicasAvailable
      Progressing     True    ReplicaSetUpdated
      ReplicaFailure  True    FailedCreate
    ```

    The failure message mentions `exceeded quota`. What blocks the rollout?
body:
  options:
    - id: a
      text: { en: "The new image cannot be pulled from the registry" }
    - id: b
      text: { en: "The new Pods fail their readiness probe" }
    - id: c
      text: { en: "The rollout was paused with `kubectl rollout pause`" }
    - id: d
      text: { en: "A namespace ResourceQuota blocks the creation of new Pods" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `ReplicaFailure` condition with reason `FailedCreate` means that new Pods could not be created, and `exceeded quota` points to a ResourceQuota of the namespace. During a rolling update the new Pods count against the quota together with the old ones, so the rollout stalls. Raise the quota or reduce the number of Pods the rollout needs at the same time.
  options:
    a:
      en: |
        An image pull fails after a Pod has been created; here the Pods are not created at all.
    b:
      en: |
        A readiness failure affects Pods that exist; `FailedCreate` means that the Pods could not be created.
    c:
      en: |
        Pausing a rollout does not make Pod creation fail; `FailedCreate` comes from a rejected creation.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
