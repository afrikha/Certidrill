id: kcna-3a-choose-recreate
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Version 2 of an internal tool changes its data format, so versions 1 and 2 must never run at the same time. A short outage during releases is acceptable, and the cluster has no spare capacity. Which strategy fits?
body:
  options:
    - id: a
      text: { en: "Recreate" }
    - id: b
      text: { en: "Rolling update with `maxUnavailable: 1`" }
    - id: c
      text: { en: "Blue-green deployment" }
    - id: d
      text: { en: "Canary deployment" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `Recreate` terminates every old Pod before any new Pod is created, so the two versions never run together and no extra capacity is used. The cost is a short outage, which the scenario accepts.
  options:
    b:
      en: A rolling update always runs old and new Pods side by side during the update, whatever the value of `maxUnavailable`.
    c:
      en: Blue-green needs a full second environment, which the cluster does not have, and both versions run while the new one is tested.
    d:
      en: A canary deliberately runs both versions at once and splits traffic between them.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
