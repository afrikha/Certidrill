id: kcna-3b-ro-readiness-blocks
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    During a rolling update of the Deployment `api` (default strategy settings), the new Pods are `Running` with `0/1` in the READY column and no restarts: their readiness probe keeps failing. Most old Pods are still running, and the rollout makes no progress.

    Why does the rolling update not replace the remaining old Pods?
body:
  options:
    - id: a
      text: { en: "The kubelet restarts the new containers after each failed readiness check" }
    - id: b
      text: { en: "The Deployment pauses itself until the new Pods pass their readiness probe" }
    - id: c
      text: { en: "The new Pods are not available, so removing old Pods would exceed `maxUnavailable`" }
    - id: d
      text: { en: "The Service sends all traffic to the new Pods, so the old Pods cannot stop" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A new Pod counts as available only once it is ready (and has stayed ready for `minReadySeconds`, 0 by default). By default, a rolling update keeps at least 75 % of the desired Pods available, so while the new Pods stay unready the controller removes no more old Pods. The rollout stalls until the progress deadline, and `kubectl describe pod` shows the probe failures.
  options:
    a:
      en: |
        A failing readiness probe never restarts a container; it only marks the Pod as not ready.
    b:
      en: |
        A Deployment is paused only by `kubectl rollout pause`; it never pauses itself.
    d:
      en: |
        A Service sends traffic only to ready Pods, so the unready new Pods receive none.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  - title: Pod Lifecycle
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
