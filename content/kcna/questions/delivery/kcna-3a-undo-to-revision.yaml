id: kcna-3a-undo-to-revision
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Deployment `web` was created with `kubectl apply`. Its history shows:

    ```text
    REVISION  CHANGE-CAUSE
    2         image web:1.2
    3         image web:1.3
    4         image web:1.4
    ```

    Revision 4 is running. Versions 1.3 and 1.4 both have a bug, and you must run `web:1.2` again. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl rollout undo deployment/web`" }
    - id: b
      text: { en: "`kubectl rollout history deployment/web --revision=2`" }
    - id: c
      text: { en: "`kubectl rollout undo deployment/web --to-revision=2`" }
    - id: d
      text: { en: "`helm rollback web 2`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubectl rollout undo` with `--to-revision=2` restores the Pod template of revision 2, so the Deployment rolls out `web:1.2` again.
  options:
    a:
      en: Without `--to-revision`, undo returns to the previous revision, which is 3 (`web:1.3`, also faulty).
    b:
      en: "`rollout history --revision=2` only shows the details of revision 2; it changes nothing."
    d:
      en: "`helm rollback` works on Helm releases. This Deployment was created with `kubectl apply`, so there is no Helm release named `web`."
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
