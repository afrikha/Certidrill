id: kcna-3a-config-per-environment
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pipeline builds one image per commit and promotes it unchanged from test to production. Each environment needs a different database address. Where should this setting come from?
body:
  options:
    - id: a
      text: { en: "A separate image build per environment with the address in the image" }
    - id: b
      text: { en: "A ConfigMap in each environment, passed to the container at runtime" }
    - id: c
      text: { en: "A different image tag per environment, built from different branches" }
    - id: d
      text: { en: "A label on each node that the application reads at startup" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A ConfigMap decouples environment-specific configuration from the container image, so the same image runs everywhere and only the ConfigMap differs per environment. It is passed to the container as environment variables or mounted files.
  options:
    a:
      en: Building per environment means production runs an image that was never tested, which breaks the build-once, promote-unchanged rule.
    c:
      en: Different branches produce different images, so the tested image is not the one released.
    d:
      en: Node labels describe nodes for scheduling; containers do not read them as application configuration.
references:
  - title: ConfigMaps
    url: https://kubernetes.io/docs/concepts/configuration/configmap/
