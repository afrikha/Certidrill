id: kcna-3b-cfg-pull-secret-namespace
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Pod below runs in the namespace `payments`. The Secret `regcred`, of type `kubernetes.io/dockerconfigjson`, exists only in the namespace `default`. The Pod stays in `ImagePullBackOff`.

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: api
      namespace: payments
    spec:
      containers:
      - name: api
        image: registry.example.com/payments/api:3.2
      imagePullSecrets:
      - name: regcred
    ```

    What should you do?
body:
  options:
    - id: a
      text: { en: "Change the type of the Secret `regcred` to `Opaque`" }
    - id: b
      text: { en: "Reference the Secret as `default/regcred` in `imagePullSecrets`" }
    - id: c
      text: { en: "Move `imagePullSecrets` under the definition of the `api` container" }
    - id: d
      text: { en: "Create the Secret `regcred` in the namespace `payments`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      All `imagePullSecrets` must be Secrets in the same namespace as the Pod, and each item references one Secret of that namespace. The Pod cannot use `regcred` from `default`, so the Secret must also exist in `payments`.
  options:
    a:
      en: |
        Image pull Secrets must be of type `kubernetes.io/dockerconfigjson` or `kubernetes.io/dockercfg`, and the namespace would still be wrong.
    b:
      en: |
        An `imagePullSecrets` item can only reference a Secret in the Pod's own namespace; `default/regcred` does not reach another namespace.
    c:
      en: |
        `imagePullSecrets` is a field of the Pod spec, where it already is; it is not a container field.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
