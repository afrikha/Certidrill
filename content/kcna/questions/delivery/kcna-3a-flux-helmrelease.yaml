id: kcna-3a-flux-helmrelease
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team uses Flux. The chart repository `https://charts.example.com` is already declared. Which Flux custom resource should they create to have Flux install the chart `webshop` from it as a release and keep that release reconciled?
body:
  options:
    - id: a
      text: { en: "HelmRepository" }
    - id: b
      text: { en: "GitRepository" }
    - id: c
      text: { en: "HelmRelease" }
    - id: d
      text: { en: "Kustomization" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A `HelmRelease` is managed by the Helm controller: it names a chart from a source, its values, and the release to install, upgrade and keep reconciled in the cluster.
  options:
    a:
      en: A `HelmRepository` is a source that tells Flux where charts are stored; it is already declared and installs nothing by itself.
    b:
      en: A `GitRepository` is a source for a Git repository; it does not install charts.
    d:
      en: A `Kustomization` makes Flux apply a set of manifests or a Kustomize overlay, not a Helm chart release.
references:
  - title: GitOps Toolkit components
    url: https://fluxcd.io/flux/components/
