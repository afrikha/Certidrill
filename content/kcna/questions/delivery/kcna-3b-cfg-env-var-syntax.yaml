id: kcna-3b-cfg-env-var-syntax
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A container is configured as follows. The application logs that it cannot parse the port value `$PORT`.

    ```yaml
    env:
    - name: PORT
      value: "8080"
    command: ["/app/server"]
    args: ["--port", "$PORT"]
    ```

    What should you change?
body:
  options:
    - id: a
      text: { en: "Write the argument as `$(PORT)`" }
    - id: b
      text: { en: "Write the argument as `${PORT}`" }
    - id: c
      text: { en: "Move the `env` section below `args`" }
    - id: d
      text: { en: "Write the value of `PORT` without quotes" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In `command` and `args`, Kubernetes expands environment variables only with the `$(VAR)` syntax. No shell runs here, so `$PORT` reaches the program as is. With `$(PORT)`, the container receives `--port 8080`.
  options:
    b:
      en: |
        Kubernetes does not expand `${PORT}`; only `$(PORT)` is replaced, and no shell is started to do it.
    c:
      en: |
        The order of the fields in the container spec does not matter.
    d:
      en: |
        An environment variable value must be a string, so the quotes are needed; the problem is how `args` references the variable.
references:
  - title: Define a Command and Arguments for a Container
    url: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
