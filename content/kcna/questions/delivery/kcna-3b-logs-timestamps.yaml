id: kcna-3b-logs-timestamps
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The application in the Pod `billing-0` writes log lines without any date or time. You need to know when each line was written, to compare the logs with an incident timeline.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl logs billing-0 --since=1h`" }
    - id: b
      text: { en: "`kubectl logs billing-0 --prefix`" }
    - id: c
      text: { en: "`kubectl events --for pod/billing-0`" }
    - id: d
      text: { en: "`kubectl logs billing-0 --timestamps`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `--timestamps` includes a timestamp on each line of the output, so you see when every line was written even though the application does not log the time itself.
  options:
    a:
      en: |
        `--since=1h` keeps only the lines of the last hour; it does not show when each line was written.
    b:
      en: |
        `--prefix` adds the Pod and container name to each line, not its time.
    c:
      en: |
        `kubectl events` lists the events of the Pod, such as image pulls and restarts; it does not show the application's log lines.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
