id: kcna-3b-cfg-pull-retry
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pod `web-5d8c9` is in `ImagePullBackOff` because its image tag `registry.example.com/shop/web:2.1` was never pushed. You now push that tag to the registry, without changing anything in the cluster.

    What happens to the Pod?
body:
  options:
    - id: a
      text: { en: "Nothing: you must delete the Pod so that a new one pulls the image" }
    - id: b
      text: { en: "Nothing: you must restart the kubelet on the node to clear the error" }
    - id: c
      text: { en: "The kubelet retries the pull and starts the container at its next attempt" }
    - id: d
      text: { en: "The Pod is marked `Failed` and must be recreated by its controller" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `ImagePullBackOff` means that the kubelet keeps trying to pull the image, with an increasing delay between attempts that is capped at 300 seconds (5 minutes). Once the tag exists, the next attempt succeeds and the container starts, without any action on the Pod.
  options:
    a:
      en: |
        Deleting the Pod is not required: the existing Pod keeps retrying the pull by itself.
    b:
      en: |
        The back-off is a per-image retry delay, not a stuck kubelet; no restart of the kubelet is needed.
    d:
      en: |
        A pull failure does not make the Pod fail: it stays `Pending` with its container waiting while the kubelet retries.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
