id: kcna-3b-ro-history-revision-detail
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before you roll back the Deployment `cart` to its revision 2, you want to see which container image that revision used.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl rollout undo deployment/cart --to-revision=2`" }
    - id: b
      text: { en: "`kubectl describe replicaset cart --revision=2`" }
    - id: c
      text: { en: "`kubectl rollout status deployment/cart --revision=2`" }
    - id: d
      text: { en: "`kubectl rollout history deployment/cart --revision=2`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kubectl rollout history` with `--revision` shows the details of that revision, including its Pod template and therefore its container images. You can then run `kubectl rollout undo --to-revision=2` knowing what you will get.
  options:
    a:
      en: |
        This performs the rollback; it does not let you check the revision first.
    b:
      en: |
        `kubectl describe` has no `--revision` flag, and the ReplicaSets of a Deployment have generated names such as `cart-<hash>`.
    c:
      en: |
        `--revision` with `rollout status` pins the watch to the rollout of that revision; it shows progress, not the Pod template.
references:
  - title: kubectl rollout history
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/kubectl_rollout_history/
