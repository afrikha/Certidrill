id: kcna-3a-gitops-revert
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cluster is managed with GitOps by a reconciling agent. A commit that changed the image of the `shop` Deployment caused errors. What is the GitOps way to roll back?
body:
  options:
    - id: a
      text: { en: "Revert the commit in the Git repository." }
    - id: b
      text: { en: "Run `kubectl rollout undo deployment/shop`." }
    - id: c
      text: { en: "Delete the Pods of the `shop` Deployment." }
    - id: d
      text: { en: "Edit the Deployment with `kubectl edit`." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In GitOps, the desired state lives in Git, so a rollback is a change to Git: reverting the commit restores the previous declaration, and the agent applies it. The rollback is reviewed and recorded like any other change.
  options:
    b:
      en: A rollback made directly in the cluster makes it drift from Git; the agent would bring the faulty version back at its next reconciliation.
    c:
      en: Deleted Pods are recreated by the ReplicaSet from the same faulty template.
    d:
      en: A manual edit is drift from the desired state in Git, which the reconciling agent reverts.
references:
  - title: GitOps
    url: https://glossary.cncf.io/gitops/
  - title: Core Concepts
    url: https://fluxcd.io/flux/concepts/
