id: kcna-3a-helm-template
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A CI job must render the manifests of a Helm chart with a values file, so that a reviewer can read the resulting YAML. The job has no access to any cluster. Which command should it run?
body:
  options:
    - id: a
      text: { en: "`helm lint ./webshop -f prod.yaml`" }
    - id: b
      text: { en: "`helm template shop ./webshop -f prod.yaml`" }
    - id: c
      text: { en: "`helm get manifest shop`" }
    - id: d
      text: { en: "`helm package ./webshop`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `helm template` renders the chart templates locally and prints the result. Values that would come from a cluster are simulated, and no server-side checks are done, so no cluster is needed.
  options:
    a:
      en: "`helm lint` checks that the chart is well-formed and reports problems; it does not output the rendered manifests."
    c:
      en: "`helm get manifest` reads the manifest of an existing release from the cluster, which this job cannot reach."
    d:
      en: "`helm package` bundles the chart directory into a `.tgz` archive; it does not render templates."
references:
  - title: helm template
    url: https://helm.sh/docs/helm/helm_template/
  - title: Using Helm
    url: https://helm.sh/docs/intro/using_helm/
