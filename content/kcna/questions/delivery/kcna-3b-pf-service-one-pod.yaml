id: kcna-3b-pf-service-one-pod
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Service `web` selects 6 Pods. A developer runs `kubectl port-forward service/web 8080:80` and sends 100 requests to `localhost:8080`.

    Which Pods receive the requests?
body:
  options:
    - id: a
      text: { en: "The 6 Pods, evenly, because kube-proxy balances the forwarded traffic" }
    - id: b
      text: { en: "The ready Pods, through the ClusterIP address of the Service" }
    - id: c
      text: { en: "Only the single Pod that kubectl selected when the command started" }
    - id: d
      text: { en: "A temporary Pod that kubectl creates for the forwarding session" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When you name a Service or a Deployment, kubectl uses it only to select a Pod, then forwards every connection to that Pod. The traffic does not go through the Service's virtual IP address, so there is no load balancing across the 6 Pods.
  options:
    a:
      en: |
        kube-proxy handles traffic sent to the Service's IP address; `port-forward` connects to one selected Pod instead.
    b:
      en: |
        The forwarded connections do not use the ClusterIP address; they reach the selected Pod only.
    d:
      en: |
        `port-forward` creates no Pod; it forwards to an existing Pod of the Service.
references:
  - title: kubectl port-forward
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_port-forward/
