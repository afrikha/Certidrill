id: kcna-3a-pause-resume
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You must change the image, an environment variable and the resource limits of the Deployment `web`. You want the three changes to produce a single rollout instead of three. What should you do?
body:
  options:
    - id: a
      text: { en: "Run `kubectl rollout pause`, make the three changes, then run `kubectl rollout resume`." }
    - id: b
      text: { en: "Make the three changes, then run `kubectl rollout restart`." }
    - id: c
      text: { en: "Set `revisionHistoryLimit: 1`, then make the three changes." }
    - id: d
      text: { en: "Scale the Deployment to zero, make the three changes, then scale it back." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      While a Deployment is paused, changes to its Pod template do not trigger rollouts. Resuming it starts one rollout with all the changes, which avoids unnecessary intermediate rollouts.
  options:
    b:
      en: Each change to the Pod template already triggers its own rollout; a restart afterwards only adds one more.
    c:
      en: "`revisionHistoryLimit` controls how many old ReplicaSets are kept for rollback; it does not group changes."
    d:
      en: Scaling to zero causes an outage, and each template change still creates its own revision; it does not batch the changes.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
