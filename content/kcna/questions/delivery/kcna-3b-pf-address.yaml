id: kcna-3b-pf-address
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On her laptop (IP address 192.168.1.20), a developer runs `kubectl port-forward pod/web-0 8080:80`. The page opens on the laptop itself, but a colleague on the same network cannot open `http://192.168.1.20:8080`.

    What should she change?
body:
  options:
    - id: a
      text: { en: "Forward through the Service with `kubectl port-forward service/web 8080:80`" }
    - id: b
      text: { en: "Add `--pod-running-timeout=5m` to the command" }
    - id: c
      text: { en: "Expose the Pod with a ClusterIP Service" }
    - id: d
      text: { en: "Add `--address 0.0.0.0` to the command" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, `kubectl port-forward` listens only on localhost (127.0.0.1 and ::1). `--address` sets the local addresses to listen on, and `0.0.0.0` makes the forwarded port reachable on all the laptop's addresses. Anyone who can reach that port then reaches the Pod, so use it only on a trusted network.
  options:
    a:
      en: |
        Forwarding through the Service still listens on localhost only; the problem is the listening address, not the target.
    b:
      en: |
        `--pod-running-timeout` sets how long kubectl waits for a running Pod; it does not change the listening address.
    c:
      en: |
        A ClusterIP Service is reachable only from inside the cluster, not from the colleague's machine.
references:
  - title: kubectl port-forward
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_port-forward/
