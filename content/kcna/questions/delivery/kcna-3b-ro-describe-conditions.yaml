id: kcna-3b-ro-describe-conditions
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want to check whether the Deployment `web` has reported its rollout as stalled. Which command shows the Deployment's conditions, such as `Progressing` and `Available`?
body:
  options:
    - id: a
      text: { en: "`kubectl rollout history deployment/web`" }
    - id: b
      text: { en: "`kubectl describe deployment web`" }
    - id: c
      text: { en: "`kubectl get replicasets -l app=web`" }
    - id: d
      text: { en: "`kubectl logs deployment/web`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubectl describe deployment` prints a readable summary of the Deployment, including its Conditions section. A stalled rollout appears there as `Progressing` with status `False` and reason `ProgressDeadlineExceeded`.
  options:
    a:
      en: |
        `rollout history` lists the revisions and their change causes, not the current conditions.
    c:
      en: |
        `kubectl get replicasets` shows the replica counts of each ReplicaSet, not the conditions of the Deployment.
    d:
      en: |
        `kubectl logs` shows the output of a container in one of the Pods, not the status of the Deployment.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
