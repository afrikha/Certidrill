id: kcna-3b-ephemeral-limits
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement about ephemeral containers is true?
body:
  options:
    - id: a
      text: { en: "You can add one to a Pod by editing its spec with `kubectl edit`" }
    - id: b
      text: { en: "They can define a readiness probe to report when they are ready" }
    - id: c
      text: { en: "They are removed from the Pod automatically when you exit their shell" }
    - id: d
      text: { en: "The kubelet never restarts them automatically" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Ephemeral containers run temporarily in an existing Pod for troubleshooting. They have no guarantees for resources or execution and are never restarted automatically. They also cannot declare ports, probes or resources.
  options:
    a:
      en: |
        They are added through the `ephemeralcontainers` handler of the API, for example by `kubectl debug`, not through `pod.spec`, so `kubectl edit` cannot add them.
    b:
      en: |
        Ephemeral containers may not have ports, so fields such as `livenessProbe` and `readinessProbe` are not allowed.
    c:
      en: |
        An ephemeral container cannot be changed or removed after it has been added to the Pod.
references:
  - title: Ephemeral Containers
    url: https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/
