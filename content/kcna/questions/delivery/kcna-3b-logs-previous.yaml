id: kcna-3b-logs-previous
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pod `web-5f7d9c8b4-k2xzq` is in `CrashLoopBackOff`. Running `kubectl logs web-5f7d9c8b4-k2xzq` shows nothing useful, because the container has just been restarted.

    Which command shows the logs of the container instance that crashed?
body:
  options:
    - id: a
      text: { en: "`kubectl logs web-5f7d9c8b4-k2xzq -f`" }
    - id: b
      text: { en: "`kubectl logs web-5f7d9c8b4-k2xzq --previous`" }
    - id: c
      text: { en: "`kubectl logs web-5f7d9c8b4-k2xzq --all-containers`" }
    - id: d
      text: { en: "`kubectl logs web-5f7d9c8b4-k2xzq --timestamps`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `--previous` (`-p`) prints the logs of the previous instance of the container, if it exists. In a crash loop the current instance has just restarted, so the error that made the container exit is in the previous instance. After a restart, the kubelet keeps one terminated container with its logs.
  options:
    a:
      en: |
        `-f` streams the new lines of the current instance; it does not show the output of the instance that already exited.
    c:
      en: |
        `--all-containers` returns the logs of every container of the Pod, but still from the current instance of each one.
    d:
      en: |
        `--timestamps` adds a timestamp to each line of the current instance; it does not select the crashed instance.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
  - title: Logging Architecture
    url: https://kubernetes.io/docs/concepts/cluster-administration/logging/
