id: kcna-3b-pf-service-targetport
objective: "3.2.3"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    The Service `shop-web` is defined as follows:

    ```yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: shop-web
    spec:
      selector:
        app: shop-web
      ports:
      - name: http
        port: 80
        targetPort: 8080
    ```

    You run `kubectl port-forward service/shop-web 9000:80`. To which port of the selected Pod are your connections forwarded?
body:
  options:
    - id: a
      text: { en: "80" }
    - id: b
      text: { en: "8080" }
    - id: c
      text: { en: "9000" }
    - id: d
      text: { en: "30080" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When you forward to a Service, kubectl selects one of its Pods and forwards to the `targetPort` that matches the Service port you named. Service port 80 maps to `targetPort` 8080, so local port 9000 reaches port 8080 in the Pod.
  options:
    a:
      en: |
        80 is the Service port; it is translated to the `targetPort`, the port the container listens on.
    c:
      en: |
        9000 is the local port on your workstation, not a port in the Pod.
    d:
      en: |
        30080 would be a NodePort, which this ClusterIP Service does not have, and `port-forward` does not use node ports.
references:
  - title: kubectl port-forward
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_port-forward/
