id: kcna-3b-pf-purpose
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes `kubectl port-forward`?
body:
  options:
    - id: a
      text: { en: "It creates a NodePort Service so that users can reach the application from outside the cluster" }
    - id: b
      text: { en: "It forwards connections from a local port of your machine to a port of a Pod while it runs" }
    - id: c
      text: { en: "It load-balances the forwarded requests across all the Pods selected by a Service" }
    - id: d
      text: { en: "It proxies HTTP requests from localhost to the Kubernetes API server" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubectl port-forward` forwards one or more local ports to a Pod. The command does not return while it forwards, and nothing is exposed beyond your machine. It is a tool for testing and debugging, not a way to publish an application.
  options:
    a:
      en: |
        `port-forward` creates no Service. To make an application reachable by users, you use a NodePort or LoadBalancer Service, an Ingress or a Gateway.
    c:
      en: |
        Even when you name a Service, kubectl selects one Pod and forwards to it; there is no load balancing.
    d:
      en: |
        That describes `kubectl proxy`, which runs a proxy between localhost and the API server.
references:
  - title: kubectl port-forward
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_port-forward/
  - title: kubectl proxy
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_proxy/
