id: kcna-3b-ro-progress-condition
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Deployment's rollout has made no progress for longer than its progress deadline. Which condition does the Deployment controller set in the Deployment's status?
body:
  options:
    - id: a
      text: { en: "`Progressing` with status `False` and reason `ProgressDeadlineExceeded`" }
    - id: b
      text: { en: "`Available` with status `True` and reason `MinimumReplicasAvailable`" }
    - id: c
      text: { en: "`Progressing` with status `True` and reason `NewReplicaSetAvailable`" }
    - id: d
      text: { en: "`Progressing` with status `True` and reason `ReplicaSetUpdated`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When the progress deadline passes, the Deployment controller sets the `Progressing` condition to status `False` with reason `ProgressDeadlineExceeded`. `kubectl describe deployment` shows it in the Conditions section.
  options:
    b:
      en: |
        This condition says that enough replicas are available; it can stay `True` while the new version is stuck, because old Pods keep serving.
    c:
      en: |
        `NewReplicaSetAvailable` marks a completed rollout, the opposite situation.
    d:
      en: |
        `ReplicaSetUpdated` is a reason of a rollout that is still progressing, before any deadline is exceeded.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
