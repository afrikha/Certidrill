id: kcna-3a-helm-values-file
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which file of a Helm chart holds the default configuration values used to fill its templates?
body:
  options:
    - id: a
      text: { en: "`Chart.yaml`" }
    - id: b
      text: { en: "`templates/deployment.yaml`" }
    - id: c
      text: { en: "`charts/`" }
    - id: d
      text: { en: "`values.yaml`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `values.yaml` contains the default configuration values of the chart. Users override them at install or upgrade time with `-f` or `--set`.
  options:
    a:
      en: "`Chart.yaml` holds the chart metadata (name, version, appVersion, dependencies), not the configuration values."
    b:
      en: Files in `templates/` are the templates that the values fill in to produce manifests.
    c:
      en: The `charts/` directory holds the charts this chart depends on.
references:
  - title: Charts
    url: https://helm.sh/docs/topics/charts/
