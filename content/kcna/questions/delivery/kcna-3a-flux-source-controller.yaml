id: kcna-3a-flux-source-controller
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Flux, which component fetches the desired state from a Git repository, an OCI registry or a Helm repository, and makes it available as an artifact to the other controllers?
body:
  options:
    - id: a
      text: { en: "Kustomize controller" }
    - id: b
      text: { en: "Source controller" }
    - id: c
      text: { en: "Notification controller" }
    - id: d
      text: { en: "Helm controller" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The source controllers manage `GitRepository`, `OCIRepository`, `HelmRepository` and `Bucket` objects. They check their origin on an interval for new versions and produce artifacts that the other Flux controllers consume.
  options:
    a:
      en: The Kustomize controller applies the manifests of a `Kustomization` to the cluster, using an artifact produced by a source.
    c:
      en: The notification controller sends alerts to providers and receives incoming webhooks; it does not fetch configuration.
    d:
      en: The Helm controller manages `HelmRelease` objects, installing and upgrading charts obtained from a source.
references:
  - title: GitOps Toolkit components
    url: https://fluxcd.io/flux/components/
  - title: Core Concepts
    url: https://fluxcd.io/flux/concepts/
