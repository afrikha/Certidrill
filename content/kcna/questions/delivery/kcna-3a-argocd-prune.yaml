id: kcna-3a-argocd-prune
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Argo CD application has this sync policy:

    ```yaml
    spec:
      syncPolicy:
        automated: {}
    ```

    A developer deletes the manifest of the ConfigMap `legacy-config` from the Git repository. What does the automated sync do with this ConfigMap in the cluster?
body:
  options:
    - id: a
      text: { en: "It deletes the ConfigMap at the next automated sync." }
    - id: b
      text: { en: "It leaves the ConfigMap in place, because pruning is off by default." }
    - id: c
      text: { en: "It recreates the ConfigMap in Git from the live object." }
    - id: d
      text: { en: "It stops all syncs of the application until the ConfigMap is deleted." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      As a safety mechanism, automated sync does not delete resources that are no longer defined in Git unless pruning is enabled (`prune: true` or `--auto-prune`). The ConfigMap stays until pruning is turned on or a manual sync with pruning is run.
  options:
    a:
      en: |
        Deletion would happen only with `prune: true` in the automated policy, which is not set here.
    c:
      en: Argo CD syncs from Git to the cluster; it never writes live objects back into the repository.
    d:
      en: Automated sync keeps working for the other resources; an extra live resource does not block it.
references:
  - title: Automated Sync Policy
    url: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
