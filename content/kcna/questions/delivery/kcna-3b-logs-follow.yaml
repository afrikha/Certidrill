id: kcna-3b-logs-follow
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    While you send test requests, you want to see the log lines of the Pod `checkout-7c9d` appear in your terminal as the application writes them.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl logs -f checkout-7c9d`" }
    - id: b
      text: { en: "`kubectl logs -p checkout-7c9d`" }
    - id: c
      text: { en: "`kubectl events --for pod/checkout-7c9d --watch`" }
    - id: d
      text: { en: "`kubectl get pod checkout-7c9d --watch`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `-f` (`--follow`) streams the logs: kubectl prints the existing lines, keeps the connection open and prints new lines as they are written, until you stop it.
  options:
    b:
      en: |
        `-p` prints the logs of the previous, terminated instance of the container; it does not stream anything.
    c:
      en: |
        `kubectl events --watch` streams the Kubernetes events of the Pod (scheduling, image pulls, probe failures), not the output of the application.
    d:
      en: |
        `kubectl get --watch` prints the changes of the Pod object, such as its status, not its log lines.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
  - title: kubectl events
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_events/
