id: kcna-3a-kustomize-tool
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team keeps one set of plain YAML manifests (a base) and small per-environment changes (overlays), without any templating language. The tool must be usable directly from `kubectl`. Which tool fits?
body:
  options:
    - id: a
      text: { en: "Kustomize" }
    - id: b
      text: { en: "Helm" }
    - id: c
      text: { en: "Argo CD" }
    - id: d
      text: { en: "kubeadm" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Kustomize customizes Kubernetes objects through a `kustomization.yaml` file: a base holds shared resources and overlays refer to it and add changes. It uses no templates, and `kubectl` supports it directly since Kubernetes 1.14.
  options:
    b:
      en: Helm renders charts written with a templating language; it is a separate CLI, not built into `kubectl`.
    c:
      en: Argo CD is a GitOps delivery tool. It can deploy Kustomize overlays, but it does not define bases and overlays itself.
    d:
      en: kubeadm bootstraps clusters; it does not customize application manifests.
references:
  - title: Declarative Management of Kubernetes Objects Using Kustomize
    url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
