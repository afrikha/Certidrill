id: kcna-3b-logs-tail
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pod `batch-worker-x7k2p` has written thousands of log lines. You only need the last 50 lines.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl logs batch-worker-x7k2p --limit-bytes=50`" }
    - id: b
      text: { en: "`kubectl logs batch-worker-x7k2p --since=50s`" }
    - id: c
      text: { en: "`kubectl logs batch-worker-x7k2p --max-log-requests=50`" }
    - id: d
      text: { en: "`kubectl logs batch-worker-x7k2p --tail=50`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `--tail` limits the output to the most recent N lines of the log. For a single Pod, its default is -1, which prints all the lines.
  options:
    a:
      en: |
        `--limit-bytes` caps the output at a number of bytes, not at a number of lines.
    b:
      en: |
        `--since=50s` returns the lines written in the last 50 seconds, however many there are.
    c:
      en: |
        `--max-log-requests` limits how many log streams kubectl follows at the same time with a selector; it does not limit the number of lines.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
