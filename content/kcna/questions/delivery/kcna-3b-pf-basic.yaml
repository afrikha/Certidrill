id: kcna-3b-pf-basic
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pod `web-0` serves HTTP on container port 8080. You want to open `http://localhost:9000` in the browser of your workstation to test it, without creating any Service.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl port-forward pod/web-0 8080:9000`" }
    - id: b
      text: { en: "`kubectl proxy --port=9000`" }
    - id: c
      text: { en: "`kubectl port-forward pod/web-0 9000:8080`" }
    - id: d
      text: { en: "`kubectl expose pod web-0 --port=9000 --target-port=8080`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubectl port-forward` forwards a local port to a port of the Pod. The syntax is `LOCAL_PORT:REMOTE_PORT`, so `9000:8080` listens on port 9000 of your workstation and sends the traffic to port 8080 in the Pod.
  options:
    a:
      en: |
        The order is reversed: this listens on local port 8080 and forwards to port 9000 in the Pod, where nothing listens.
    b:
      en: |
        `kubectl proxy` runs a proxy between localhost and the Kubernetes API server; it does not forward a local port to the application.
    d:
      en: |
        `kubectl expose` creates a Service, which the requirement excludes, and a ClusterIP Service is not reachable from the workstation anyway.
references:
  - title: kubectl port-forward
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_port-forward/
  - title: Use Port Forwarding to Access Applications in a Cluster
    url: https://kubernetes.io/docs/tasks/access-application-cluster/port-forward-access-application-cluster/
