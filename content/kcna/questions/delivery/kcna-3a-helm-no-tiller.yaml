id: kcna-3a-helm-no-tiller
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement describes how current Helm versions (Helm 3 and later) work with a cluster?
body:
  options:
    - id: a
      text: { en: "The Helm client talks to an in-cluster server named Tiller, which installs the charts." }
    - id: b
      text: { en: "Helm stores release records in its own external database outside the cluster." }
    - id: c
      text: { en: "Helm must be installed on every node to pull charts for the kubelet." }
    - id: d
      text: { en: "The Helm client talks to the API server and stores release records in Secrets." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Helm is a command-line tool that talks to the Kubernetes API server with the user's kubeconfig credentials. It stores release information in Kubernetes Secrets inside the cluster, so it needs no database and no server component.
  options:
    a:
      en: Tiller was the in-cluster component of Helm 2. It was removed in Helm 3, partly because it was hard to secure with RBAC.
    b:
      en: Release records live in the cluster, as Secrets in the release's namespace by default, not in an external database.
    c:
      en: Helm runs where the user or pipeline runs it; nodes and the kubelet only see the rendered Kubernetes objects.
references:
  - title: Introduction to Helm
    url: https://helm.sh/docs/intro/introduction/
  - title: Changes Since Helm 2
    url: https://helm.sh/docs/faq/changes_since_helm2/
