id: kcna-3a-push-not-gitops
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Manifests are stored in Git. On each merge, a CI job outside the cluster runs `kubectl apply -f` against the cluster. Nothing else runs. Why is this not GitOps as defined by the OpenGitOps principles?
body:
  options:
    - id: a
      text: { en: "The manifests are declarative YAML instead of a sequence of commands." }
    - id: b
      text: { en: "No agent pulls the state, and nothing reconciles manual drift." }
    - id: c
      text: { en: "Git does not keep a version history of the manifests." }
    - id: d
      text: { en: "GitOps requires Helm charts instead of plain manifests." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      GitOps requires software agents that pull the desired state automatically and continuously reconcile the actual state with it. A job that pushes changes on merge applies them once; a later manual change in the cluster stays until the next merge.
  options:
    a:
      en: Declarative manifests are a requirement of GitOps, not the reason this setup falls short.
    c:
      en: Git does keep a complete version history, which satisfies the versioned and immutable principle.
    d:
      en: GitOps tools accept plain YAML as well as Helm, Kustomize and other formats; the format is not the issue.
references:
  - title: documents/PRINCIPLES.md at main · open-gitops/documents
    url: https://github.com/open-gitops/documents/blob/main/PRINCIPLES.md
