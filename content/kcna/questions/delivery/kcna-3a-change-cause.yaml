id: kcna-3a-change-cause
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    `kubectl rollout history deployment/web` shows a `CHANGE-CAUSE` column. Where does Kubernetes take the text of this column from?
body:
  options:
    - id: a
      text: { en: "The `app.kubernetes.io/version` label of the Deployment" }
    - id: b
      text: { en: "The `pod-template-hash` label of each ReplicaSet" }
    - id: c
      text: { en: "The message of the last Git commit of the manifest" }
    - id: d
      text: { en: "The `kubernetes.io/change-cause` annotation of the Deployment" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `CHANGE-CAUSE` is copied from the Deployment annotation `kubernetes.io/change-cause` to its revisions when they are created. You set it with `kubectl annotate`, in the manifest, or through tooling.
  options:
    a:
      en: "`app.kubernetes.io/version` is a recommended label that describes the application version; `rollout history` does not read it."
    b:
      en: "`pod-template-hash` is added by the Deployment controller to tell ReplicaSets apart; it is a hash, not a description of the change."
    c:
      en: Kubernetes knows nothing about Git; only the annotation stored on the Deployment is shown.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
