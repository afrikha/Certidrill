id: kcna-3a-maxsurge-zero-unavailable
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Deployment `web` has this configuration:

    ```yaml
    spec:
      replicas: 4
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
    ```

    During a rollout, which limits apply?
body:
  options:
    - id: a
      text: { en: "At most 4 Pods in total, and at least 3 available Pods" }
    - id: b
      text: { en: "At most 5 Pods in total, and at least 3 available Pods" }
    - id: c
      text: { en: "At most 4 Pods in total, and at least 4 available Pods" }
    - id: d
      text: { en: "At most 5 Pods in total, and at least 4 available Pods" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `maxSurge: 1` allows one Pod above the desired 4, so at most 5 Pods exist. `maxUnavailable: 0` means the available Pods never drop below 4: a new Pod must be ready before an old one is removed, which keeps full capacity during the update.
  options:
    a:
      en: |
        A limit of 4 Pods in total would mean `maxSurge: 0`, and 3 available Pods would mean `maxUnavailable: 1`.
    b:
      en: |
        The total of 5 is right, but `maxUnavailable: 0` does not allow the available Pods to drop to 3.
    c:
      en: With no Pod allowed above or below 4, the rollout could never progress, which is why `maxSurge` and `maxUnavailable` cannot both be 0.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
