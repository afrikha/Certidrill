id: kcna-3a-blue-green-selector
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two Deployments run version 1 (Pods labelled `version: blue`) and version 2 (Pods labelled `version: green`). All users reach the application through this Service:

    ```yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: shop
    spec:
      selector:
        app: shop
        version: blue
      ports:
      - port: 80
        targetPort: 8080
    ```

    Version 2 has passed its tests. How do you move all users to it at once, keeping version 1 ready for a fast rollback?
body:
  options:
    - id: a
      text: { en: "Change the Service selector from `version: blue` to `version: green`." }
    - id: b
      text: { en: "Run `kubectl rollout undo` on the version 1 Deployment." }
    - id: c
      text: { en: "Scale the version 1 Deployment to zero replicas." }
    - id: d
      text: { en: "Change the image of the version 1 Deployment to version 2." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In a blue-green release built with plain objects, the Service selector decides which set of Pods receives traffic. Changing `version: blue` to `version: green` switches all traffic at once, and changing it back is an instant rollback because the blue Pods are still running.
  options:
    b:
      en: "`kubectl rollout undo` returns a Deployment to its previous Pod template; it does not move traffic between two Deployments."
    c:
      en: Scaling version 1 to zero leaves the Service with no matching Pods, causing an outage, and removes the fast way back.
    d:
      en: Changing the image of version 1 starts a rolling update of that Deployment; it is not a blue-green switch and leaves no running version 1 for rollback.
references:
  - title: Blue Green Deployment
    url: https://glossary.cncf.io/blue-green-deployment/
