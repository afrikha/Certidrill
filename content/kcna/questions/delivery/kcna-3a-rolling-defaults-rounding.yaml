id: kcna-3a-rolling-defaults-rounding
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Deployment has `replicas: 10` and uses `RollingUpdate` without setting `maxSurge` or `maxUnavailable`. During a rollout, what are the limits?
body:
  options:
    - id: a
      text: { en: "At most 12 Pods in total, and at least 8 available Pods" }
    - id: b
      text: { en: "At most 13 Pods in total, and at least 8 available Pods" }
    - id: c
      text: { en: "At most 13 Pods in total, and at least 7 available Pods" }
    - id: d
      text: { en: "At most 12 Pods in total, and at least 7 available Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Both settings default to 25 %, which is 2.5 Pods here. `maxSurge` is rounded up to 3, so at most 13 Pods exist; `maxUnavailable` is rounded down to 2, so at least 8 Pods stay available.
  options:
    a:
      en: This rounds `maxSurge` down to 2; the percentage of `maxSurge` is rounded up.
    c:
      en: This rounds `maxUnavailable` up to 3; the percentage of `maxUnavailable` is rounded down.
    d:
      en: |
        This inverts both rounding rules: `maxSurge` rounds up and `maxUnavailable` rounds down.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
