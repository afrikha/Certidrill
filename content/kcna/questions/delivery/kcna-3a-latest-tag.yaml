id: kcna-3a-latest-tag
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI pipeline pushes every build as `registry.example.com/shop:latest`, and the production Deployment references that tag. What is the main problem with this approach?
body:
  options:
    - id: a
      text: { en: "Kubernetes refuses to start images tagged `latest`." }
    - id: b
      text: { en: "Images tagged `latest` cannot be stored in a private registry." }
    - id: c
      text: { en: "The `latest` tag makes image pulls slower on every node." }
    - id: d
      text: { en: "It is hard to know which version runs and to roll back properly." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Kubernetes documentation advises against `:latest` in production because it is harder to track which version of the image is running and harder to roll back properly. Pipelines should push a meaningful tag (such as a version or commit identifier) and/or reference the image by digest.
  options:
    a:
      en: Kubernetes runs `latest` images without complaint; when the tag is `latest`, the default pull policy is simply `Always`.
    b:
      en: Any tag, including `latest`, can be pushed to a private registry.
    c:
      en: The tag name does not change pull speed; what matters is the pull policy and whether the layers are already cached.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
