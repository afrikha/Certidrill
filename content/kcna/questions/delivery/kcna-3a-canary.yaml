id: kcna-3a-canary
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new release first receives about 1 % of live traffic. The team watches error rates, then raises the share to 10 %, 25 % and finally 100 %. Which deployment strategy is this?
body:
  options:
    - id: a
      text: { en: "Recreate" }
    - id: b
      text: { en: "Blue-green deployment" }
    - id: c
      text: { en: "Rolling update" }
    - id: d
      text: { en: "Canary deployment" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A canary deployment shifts traffic to the new version gradually, starting with a small share. Problems show up while only a few requests are affected, and traffic can be moved back quickly.
  options:
    a:
      en: Recreate stops every old instance before starting the new ones; there is no gradual traffic share.
    b:
      en: Blue-green switches all traffic from the old environment to the new one at once.
    c:
      en: A rolling update replaces Pods progressively, but the traffic share follows the number of Pods replaced, not a share chosen and watched by the team.
references:
  - title: Canary Deployment
    url: https://glossary.cncf.io/canary-deployment/
