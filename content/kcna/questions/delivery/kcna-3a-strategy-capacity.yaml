id: kcna-3a-strategy-capacity
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application runs 20 replicas. Which release strategy needs the most extra cluster capacity while the release is in progress?
body:
  options:
    - id: a
      text: { en: "Rolling update with the default `maxSurge`" }
    - id: b
      text: { en: "Recreate" }
    - id: c
      text: { en: "Canary with a second Deployment of 2 replicas" }
    - id: d
      text: { en: "Blue-green deployment" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Blue-green keeps a complete second environment running next to the live one until traffic is switched and the old one is retired. For 20 replicas, that is about 20 extra Pods during the release.
  options:
    a:
      en: The default `maxSurge` is 25 %, so a rolling update adds at most 5 Pods above the desired 20 at any time.
    b:
      en: Recreate needs no extra capacity at all, since old Pods are terminated before new ones start; the price is downtime.
    c:
      en: This canary adds only the 2 replicas of the canary Deployment.
references:
  - title: Blue Green Deployment
    url: https://glossary.cncf.io/blue-green-deployment/
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
