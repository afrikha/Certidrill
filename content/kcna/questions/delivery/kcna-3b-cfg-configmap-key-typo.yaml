id: kcna-3b-cfg-configmap-key-typo
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The ConfigMap `app-config` contains the key `db-host`. A container defines:

    ```yaml
    env:
    - name: DB_HOST
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: db_host
    ```

    The Pod does not start. What is the cause?
body:
  options:
    - id: a
      text: { en: "Environment variable names cannot contain an underscore" }
    - id: b
      text: { en: "A ConfigMap can only be consumed as a mounted volume" }
    - id: c
      text: { en: "A `configMapKeyRef` reference requires `optional: true`" }
    - id: d
      text: { en: "The key `db_host` does not exist in the ConfigMap" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The reference asks for the key `db_host`, but the ConfigMap only has `db-host`. A reference to a key that does not exist in the ConfigMap prevents the Pod from starting, unless the reference is marked optional. Correct the key name in the reference.
  options:
    a:
      en: |
        `DB_HOST` is a common, valid environment variable name; the problem is the ConfigMap key.
    b:
      en: |
        A ConfigMap can provide environment variables, as here, as well as files in a volume.
    c:
      en: |
        `optional: true` is for a key that may be absent on purpose; it would hide the typo instead of fixing it.
references:
  - title: Configure a Pod to Use a ConfigMap
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
