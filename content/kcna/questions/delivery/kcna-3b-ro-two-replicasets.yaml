id: kcna-3b-ro-two-replicasets
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During a rollout of the Deployment `web` (3 replicas, default strategy settings), you run `kubectl get rs -l app=web`:

    ```text
    NAME             DESIRED   CURRENT   READY   AGE
    web-6d8f7b9c4    3         3         3       5d
    web-7f5c8d6b2    1         1         0       4m
    ```

    What does this output show?
body:
  options:
    - id: a
      text: { en: "The rollout is complete, and the old ReplicaSet is kept only for the history" }
    - id: b
      text: { en: "The two versions are serving traffic, with 4 Pods in total" }
    - id: c
      text: { en: "The old ReplicaSet has failed, and the new one is replacing it" }
    - id: d
      text: { en: "The new Pod is not ready, so the rollout is stuck and the old Pods keep serving" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      During a rolling update, the Deployment scales the new ReplicaSet up and the old one down. Here the Pod of the new ReplicaSet is not ready, so old Pods are not removed, and the 3 ready old Pods keep serving. The next step is to describe the new Pod to find why it is not ready.
  options:
    a:
      en: |
        A completed rollout shows the new ReplicaSet with 3 ready Pods and the old one scaled to 0.
    b:
      en: |
        Only ready Pods receive traffic from a Service; the new Pod is not ready, so the old Pods serve all the requests.
    c:
      en: |
        The old ReplicaSet has 3 ready Pods; the problem is the new ReplicaSet, whose Pod never becomes ready.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
