id: kcna-3b-logs-container-flag
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pod `api-0` runs two containers, `api` and `log-shipper`. You need to read the logs of the `api` container only.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl logs api-0/api`" }
    - id: b
      text: { en: "`kubectl logs -l app=api-0`" }
    - id: c
      text: { en: "`kubectl logs api-0 -c api`" }
    - id: d
      text: { en: "`kubectl logs api --container=api-0`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `-c` (`--container`) selects the container whose logs are printed. The container name is optional only when the Pod has a single container; `api-0` has two, so you name the one you need.
  options:
    a:
      en: |
        kubectl reads `api-0/api` as TYPE/NAME, that is a resource type named `api-0`, which does not exist. A container is selected with `-c`, not with a slash.
    b:
      en: |
        `-l` selects Pods by label; it does not choose a container inside a Pod, and `api-0` is a Pod name, not a label value.
    d:
      en: |
        This swaps the names: it asks for a Pod named `api` and a container named `api-0`, and neither exists.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
