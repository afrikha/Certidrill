id: kcna-3a-flux-drift
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Flux reconciles a `Kustomization` that declares the Deployment `shop` with 3 replicas. An operator runs `kubectl edit` and sets 8 replicas. Nothing is changed in Git. What happens?
body:
  options:
    - id: a
      text: { en: "Flux commits the new value of 8 replicas to the Git repository." }
    - id: b
      text: { en: "The Deployment keeps 8 replicas until the next commit to Git." }
    - id: c
      text: { en: "Flux reverts the Deployment to 3 replicas at a later reconciliation." }
    - id: d
      text: { en: "Flux deletes the Deployment because it no longer matches Git." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Flux reconciles on an interval: it makes the cluster match the state declared in the source. Manual changes made with `kubectl edit`, `patch` or `delete` are reverted, so to change the replica count you must push the change to Git (or suspend reconciliation).
  options:
    a:
      en: Reconciliation flows from Git to the cluster; Flux does not write manual cluster changes back to the repository.
    b:
      en: Waiting for a commit is push-based behaviour; Flux reconciles continuously on its interval.
    d:
      en: Flux corrects the drift by applying the declared state; it does not delete a resource that is still declared in Git.
references:
  - title: Core Concepts
    url: https://fluxcd.io/flux/concepts/
