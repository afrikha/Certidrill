id: kcna-3b-debug-rbac-ephemeral
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer is bound to the built-in `edit` ClusterRole in the namespace `shop`. They can run `kubectl exec` in the Pods of `shop`, but `kubectl debug -it api-0 --image=busybox:1.36` is denied.

    What is the most likely reason?
body:
  options:
    - id: a
      text: { en: "`kubectl debug` can only be used by holders of the `cluster-admin` ClusterRole" }
    - id: b
      text: { en: "The `edit` role does not grant access to the `pods/ephemeralcontainers` subresource" }
    - id: c
      text: { en: "Ephemeral containers are an alpha feature that is disabled by default" }
    - id: d
      text: { en: "The Pod must be restarted before an ephemeral container can be added" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Adding an ephemeral container updates the Pod through its `ephemeralcontainers` subresource, which requires the `patch` (or `update`) verb on `pods/ephemeralcontainers`. This permission is not part of the default `admin` and `edit` ClusterRoles, so an administrator must grant it, for example with an extra Role in the namespace.
  options:
    a:
      en: |
        `cluster-admin` is not required: a Role that grants the verb on `pods/ephemeralcontainers` in the namespace is enough.
    c:
      en: |
        Ephemeral containers have been stable since Kubernetes v1.25 and are available by default.
    d:
      en: |
        Ephemeral containers are added to a running Pod without restarting it; that is their purpose.
references:
  - title: Ephemeral Containers
    url: https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
