id: kcna-3a-kustomize-overlay-result
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The base contains a Deployment named `web` with the image `registry.example.com/web:1.0`. The production overlay has this `kustomization.yaml`:

    ```yaml
    resources:
    - ../../base
    namePrefix: prod-
    images:
    - name: registry.example.com/web
      newTag: "2.1"
    ```

    What does `kubectl kustomize` output for this Deployment?
body:
  options:
    - id: a
      text: { en: "A Deployment named `web` with the image `registry.example.com/web:2.1`" }
    - id: b
      text: { en: "A Deployment named `prod-web` with the image `registry.example.com/web:1.0`" }
    - id: c
      text: { en: "A Deployment named `prod-web` with the image `registry.example.com/web:2.1`" }
    - id: d
      text: { en: "Two Deployments, `web` and `prod-web`, with the images `1.0` and `2.1`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `namePrefix` is prepended to the names of all resources, so `web` becomes `prod-web`. The `images` entry changes the tag of the matching image without writing a patch, so the container uses `2.1`. The overlay transforms the base resources; it does not copy them.
  options:
    a:
      en: "`namePrefix: prod-` renames every resource of the overlay, so the name is no longer `web`."
    b:
      en: The `images` field replaces the tag of the matching image, so `1.0` becomes `2.1`.
    d:
      en: An overlay transforms the resources of its base; the output contains one Deployment, not the original plus a copy.
references:
  - title: Declarative Management of Kubernetes Objects Using Kustomize
    url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
