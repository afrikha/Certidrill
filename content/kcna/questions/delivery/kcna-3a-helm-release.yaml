id: kcna-3a-helm-release
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In Helm, what is the name of one instance of a chart running in a Kubernetes cluster?
body:
  options:
    - id: a
      text: { en: "A repository" }
    - id: b
      text: { en: "A release" }
    - id: c
      text: { en: "A template" }
    - id: d
      text: { en: "A value" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A release is an instance of a chart running in a cluster. The same chart can be installed several times, and each installation is a separate release with its own name and revision history.
  options:
    a:
      en: A repository is the place where charts are collected and shared.
    c:
      en: Templates are the files of a chart that, combined with values, produce the Kubernetes manifests.
    d:
      en: Values are the configuration used to fill a chart's templates, typically from `values.yaml`.
references:
  - title: Introduction to Helm
    url: https://helm.sh/docs/intro/introduction/
