id: kcna-3b-debug-distroless
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pod `api-6f9c` runs a container named `api` built from a distroless image, which contains no shell and no debugging tools. `kubectl exec -it api-6f9c -- sh` fails.

    Which command gives you a shell with tools to inspect the processes of the `api` container, without restarting the Pod?
body:
  options:
    - id: a
      text: { en: "`kubectl exec -it api-6f9c -c api -- /bin/bash`" }
    - id: b
      text: { en: "`kubectl run -it debug --image=busybox:1.36 -- sh`" }
    - id: c
      text: { en: "`kubectl debug -it api-6f9c --image=busybox:1.36 --target=api`" }
    - id: d
      text: { en: "`kubectl attach -it api-6f9c -c api`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubectl debug` adds an ephemeral container, built from an image that has the tools (here busybox), to the running Pod, so the Pod is not restarted. `--target=api` puts it in the process namespace of the `api` container, so `ps` shows the application's processes. Ephemeral containers are stable since Kubernetes v1.25.
  options:
    a:
      en: |
        A distroless image has no shell at all, so asking for `/bin/bash` fails just like `sh`.
    b:
      en: |
        `kubectl run` starts a separate Pod, which shares neither the processes nor the files of `api-6f9c`.
    d:
      en: |
        `kubectl attach` connects to the main process of the `api` container; it provides no shell and no tools.
references:
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
  - title: Ephemeral Containers
    url: https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/
