id: kcna-3b-logs-prefix
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You run `kubectl logs -l app=cart --tail=20` and get lines from four Pods mixed together. You cannot tell which Pod wrote each line.

    Which flag should you add?
body:
  options:
    - id: a
      text: { en: "`--timestamps`" }
    - id: b
      text: { en: "`--all-containers`" }
    - id: c
      text: { en: "`--previous`" }
    - id: d
      text: { en: "`--prefix`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `--prefix` adds the source of each log line, the Pod name and the container name, at the start of the line. It is useful when a selector or `--all-containers` merges the output of several containers.
  options:
    a:
      en: |
        `--timestamps` adds the time of each line, not the Pod or container that wrote it.
    b:
      en: |
        `--all-containers` includes every container of each Pod, which adds more lines without labeling their source.
    c:
      en: |
        `--previous` switches to the previous instance of each container; it does not identify the source of each line.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
