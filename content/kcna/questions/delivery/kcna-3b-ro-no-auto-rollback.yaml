id: kcna-3b-ro-no-auto-rollback
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Deployment's rollout exceeds its progress deadline, with reason `ProgressDeadlineExceeded`. No other tool manages the Deployment.

    What does Kubernetes do next?
body:
  options:
    - id: a
      text: { en: "It rolls the Deployment back to its previous revision" }
    - id: b
      text: { en: "It only reports the condition in the Deployment's status" }
    - id: c
      text: { en: "It deletes the new ReplicaSet and its Pods" }
    - id: d
      text: { en: "It pauses the Deployment until you resume it" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes takes no action on a stalled Deployment other than reporting a status condition with reason `ProgressDeadlineExceeded`. Higher-level tools, such as a delivery pipeline, can use this condition to roll back; otherwise you run `kubectl rollout undo` yourself.
  options:
    a:
      en: |
        The Deployment controller has no automatic rollback; the condition is only a signal.
    c:
      en: |
        The new ReplicaSet and its Pods stay as they are, so you can inspect them.
    d:
      en: |
        A Deployment is paused only by `kubectl rollout pause`; an exceeded deadline does not pause it.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
