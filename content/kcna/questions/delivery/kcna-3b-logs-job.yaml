id: kcna-3b-logs-job
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Job `db-migrate` has finished. You do not know the generated name of its Pod, and you want to read what the migration printed.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl logs job/db-migrate`" }
    - id: b
      text: { en: "`kubectl logs db-migrate`" }
    - id: c
      text: { en: "`kubectl describe job db-migrate`" }
    - id: d
      text: { en: "`kubectl events --for job/db-migrate`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl logs` accepts TYPE/NAME as well as a Pod name. With `job/db-migrate`, kubectl finds the Pod of the Job and returns the logs of its first container, so you do not need the generated Pod name.
  options:
    b:
      en: |
        Without a resource type, kubectl looks for a Pod named `db-migrate`, while the Pod of the Job has a generated name.
    c:
      en: |
        `kubectl describe job` shows the Job's status and events, such as the Pods it created, not what the container printed.
    d:
      en: |
        `kubectl events` lists the Kubernetes events of the Job, not the output of the migration.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
