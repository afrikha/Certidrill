id: kcna-3b-debug-target-flag
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You add a debug container to a running Pod:

    ```bash
    kubectl debug -it shop-0 --image=busybox:1.36 --target=shop
    ```

    What does `--target=shop` do?
body:
  options:
    - id: a
      text: { en: "It lets the debug container see the processes of `shop`" }
    - id: b
      text: { en: "It replaces the image of the `shop` container with `busybox:1.36`" }
    - id: c
      text: { en: "It gives the name `shop` to the new debug container" }
    - id: d
      text: { en: "It creates a copy of the Pod named `shop` for debugging" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `--target` targets the processes of the named container: the ephemeral container joins the process namespace of `shop`, so tools such as `ps` show the application's processes. The container runtime must support it; otherwise the debug container may not start, or may start with an isolated process namespace.
  options:
    b:
      en: |
        Images are changed only in a copy of the Pod, with `--copy-to` and `--set-image`; `--target` changes no image.
    c:
      en: |
        The name of the debug container is set with `-c` (`--container`); `--target` names an existing container to inspect.
    d:
      en: |
        A copy of the Pod is created with `--copy-to`; with `--target`, the ephemeral container is added to the existing Pod.
references:
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
  - title: kubectl debug
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_debug/
