id: kcna-3b-pf-random-port
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want to forward to port 5432 of the Pod `db-0`. You do not care which local port is used, as long as it is free.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl port-forward pod/db-0 5432`" }
    - id: b
      text: { en: "`kubectl port-forward --address 0.0.0.0 pod/db-0 5432`" }
    - id: c
      text: { en: "`kubectl port-forward pod/db-0 5432:`" }
    - id: d
      text: { en: "`kubectl port-forward pod/db-0 :5432`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When you leave out the local port and keep the colon, kubectl picks a local port that is not in use, avoiding low port numbers, and prints it in its output.
  options:
    a:
      en: |
        A single port number uses the same number locally, so kubectl listens on local port 5432, which fails if that port is already used on the workstation.
    b:
      en: |
        `--address` changes the local addresses kubectl listens on; the local port is still 5432.
    c:
      en: |
        The Pod port comes after the colon; `5432:` leaves it empty, so this is not a valid port specification.
references:
  - title: Use Port Forwarding to Access Applications in a Cluster
    url: https://kubernetes.io/docs/tasks/access-application-cluster/port-forward-access-application-cluster/
  - title: kubectl port-forward
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_port-forward/
