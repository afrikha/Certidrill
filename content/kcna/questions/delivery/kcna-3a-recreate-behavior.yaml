id: kcna-3a-recreate-behavior
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Deployment `web` uses the strategy below. You change the container image of its Pod template.

    ```yaml
    spec:
      replicas: 3
      strategy:
        type: Recreate
    ```

    What happens?
body:
  options:
    - id: a
      text: { en: "New Pods are created one at a time, and an old Pod is removed after each new Pod is ready." }
    - id: b
      text: { en: "Three new Pods are created next to the old ones, then traffic switches to them at once." }
    - id: c
      text: { en: "All three old Pods are terminated first, then the new Pods are created." }
    - id: d
      text: { en: "One new Pod is created and receives a small share of traffic until you promote it." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `Recreate`, all existing Pods are killed before new ones are created. The application is unavailable between the two steps, which is acceptable only when two versions must never run together.
  options:
    a:
      en: Progressive replacement is the `RollingUpdate` strategy, not `Recreate`.
    b:
      en: Running a full new set next to the old one and switching all traffic at once is blue-green, which a Deployment does not do natively.
    d:
      en: Sending a small share of traffic to one new instance is a canary release, which needs extra objects or a progressive delivery tool.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
