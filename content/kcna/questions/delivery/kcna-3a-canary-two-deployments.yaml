id: kcna-3a-canary-two-deployments
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You want to try a new version of the `shop` application on a small part of the traffic, using only built-in Kubernetes objects (no add-on controller). What should you do?
body:
  options:
    - id: a
      text: { en: "Set `spec.strategy.type: Canary` on the existing Deployment." }
    - id: b
      text: { en: "Create a second Deployment with few replicas that shares the label selected by the Service." }
    - id: c
      text: { en: "Set `maxSurge: 10%` on the existing Deployment and update its image." }
    - id: d
      text: { en: "Add a readiness probe to the existing Deployment and update its image." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Kubernetes documentation describes a canary as two Deployments, one per release, that share a common label such as `app: shop` selected by a single Service, with a `track: stable` or `track: canary` label to tell them apart. The replica counts set the traffic ratio between the stable and canary Pods.
  options:
    a:
      en: "`Canary` is not a valid value; `spec.strategy.type` only accepts `RollingUpdate` and `Recreate`."
    c:
      en: "`maxSurge` only limits how many extra Pods exist during a rolling update. The update still continues until every Pod runs the new version."
    d:
      en: A readiness probe keeps unready Pods out of the Service, but the update still replaces every Pod; it does not hold the new version at a small share.
references:
  - title: Managing Workloads
    url: https://kubernetes.io/docs/concepts/workloads/management/
