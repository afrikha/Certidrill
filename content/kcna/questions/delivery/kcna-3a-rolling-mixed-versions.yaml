id: kcna-3a-rolling-mixed-versions
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Deployment is being updated with the default `RollingUpdate` strategy. Which statement about the update is true?
body:
  options:
    - id: a
      text: { en: "The application is unavailable until every new Pod is ready." }
    - id: b
      text: { en: "All traffic moves from the old Pods to the new Pods at a single moment." }
    - id: c
      text: { en: "A full second copy of the application runs for the whole update." }
    - id: d
      text: { en: "Old and new Pods serve traffic at the same time during the update." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A rolling update gradually scales the new ReplicaSet up and the old one down. At any point a mix of old and new Pods serves traffic, so the application stays available, but the two versions must be able to run side by side.
  options:
    a:
      en: Downtime between versions is the behaviour of `Recreate`. A rolling update keeps Pods serving throughout.
    b:
      en: A single switch of all traffic describes blue-green, not a rolling update.
    c:
      en: A rolling update only adds up to `maxSurge` extra Pods (25 % by default); a full second copy is what blue-green needs.
references:
  - title: Managing Workloads
    url: https://kubernetes.io/docs/concepts/workloads/management/
