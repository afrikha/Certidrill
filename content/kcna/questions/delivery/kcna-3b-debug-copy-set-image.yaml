id: kcna-3b-debug-copy-set-image
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Pod `report-7d`, managed by the Deployment `report`, crashes with the image `registry.example.com/report:1.4` in its container `report`. You want to check whether the image `registry.example.com/report:1.4-debug` starts correctly, without changing the original Pod or the Deployment.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl set image deployment/report report=registry.example.com/report:1.4-debug`" }
    - id: b
      text: { en: "`kubectl debug -it report-7d --image=registry.example.com/report:1.4-debug --target=report`" }
    - id: c
      text: { en: "`kubectl debug report-7d --copy-to=report-debug --set-image=report=registry.example.com/report:1.4-debug`" }
    - id: d
      text: { en: "`kubectl edit pod report-7d`, then change the image of the `report` container" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `--copy-to`, `kubectl debug` creates a new Pod that copies the original one, and `--set-image` changes images in the copy with the same `name=image` syntax as `kubectl set image`. The original Pod and the Deployment are not modified. Delete the copy when you are done.
  options:
    a:
      en: |
        `kubectl set image` changes the Deployment's Pod template, which starts a new rollout of the real workload.
    b:
      en: |
        This adds an ephemeral container to the original Pod; the `report` container keeps running the crashing image.
    d:
      en: |
        Editing the Pod changes the original Pod, which the requirement excludes.
references:
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
  - title: kubectl debug
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_debug/
