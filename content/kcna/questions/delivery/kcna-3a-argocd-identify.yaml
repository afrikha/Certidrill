id: kcna-3a-argocd-identify
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which CNCF project is a declarative GitOps continuous delivery tool for Kubernetes, with a web UI that shows whether each application matches its state in Git?
body:
  options:
    - id: a
      text: { en: "Argo CD" }
    - id: b
      text: { en: "Helm" }
    - id: c
      text: { en: "Prometheus" }
    - id: d
      text: { en: "Kustomize" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Argo CD is a declarative GitOps continuous delivery tool for Kubernetes. A controller compares the live state of each application with its target state in Git, and the web UI shows differences in real time. Argo is a CNCF graduated project.
  options:
    b:
      en: Helm is a package manager that installs charts as releases; Argo CD can deploy Helm charts, but Helm itself does not reconcile with Git.
    c:
      en: Prometheus is a monitoring and alerting system that collects metrics; it does not deploy applications.
    d:
      en: Kustomize customizes YAML manifests; Argo CD can use it, but it does not compare the cluster with Git.
references:
  - title: Argo CD - Declarative GitOps CD for Kubernetes
    url: https://argo-cd.readthedocs.io/en/stable/
