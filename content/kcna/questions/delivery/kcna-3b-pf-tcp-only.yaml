id: kcna-3b-pf-tcp-only
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer tests a DNS server Pod that answers queries on UDP port 53. She runs `kubectl port-forward pod/dns-test 5353:53` and sends UDP queries to `localhost:5353`. The queries get no answer.

    Why?
body:
  options:
    - id: a
      text: { en: "`kubectl port-forward` supports TCP ports only" }
    - id: b
      text: { en: "Port 53 is reserved for CoreDNS in every Pod" }
    - id: c
      text: { en: "Local ports above 1024 cannot be forwarded" }
    - id: d
      text: { en: "`kubectl port-forward` requires the Pod to be selected by a Service" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl port-forward` is implemented for TCP ports only; UDP is not supported. To test UDP traffic, run the client inside the cluster, for example from a temporary Pod.
  options:
    b:
      en: |
        Any Pod can listen on port 53; CoreDNS does not reserve that port in other Pods.
    c:
      en: |
        Local ports above 1024 are the usual choice; when kubectl picks a local port itself, it even avoids low port numbers.
    d:
      en: |
        `port-forward` can target a Pod directly by its name; no Service is required.
references:
  - title: Use Port Forwarding to Access Applications in a Cluster
    url: https://kubernetes.io/docs/tasks/access-application-cluster/port-forward-access-application-cluster/
