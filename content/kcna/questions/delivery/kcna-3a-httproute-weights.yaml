id: kcna-3a-httproute-weights
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team uses this Gateway API route for a canary release of the `shop` application:

    ```yaml
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: shop
    spec:
      parentRefs:
      - name: public-gateway
      rules:
      - backendRefs:
        - name: shop-v1
          port: 80
          weight: 9
        - name: shop-v2
          port: 80
          weight: 1
    ```

    About what share of the requests reaches `shop-v2`?
body:
  options:
    - id: a
      text: { en: "1 %" }
    - id: b
      text: { en: "10 %" }
    - id: c
      text: { en: "50 %" }
    - id: d
      text: { en: "90 %" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In `backendRefs`, `weight` is a proportional split, not a percentage. With weights 9 and 1, `shop-v2` receives 1 part out of 10, about 10 % of the requests. Raising its weight step by step continues the canary.
  options:
    a:
      en: Weights are not percentages; a weight of 1 against 9 is one tenth of the traffic, not 1 %.
    c:
      en: An even split would need equal weights (or both weights omitted, since the default weight is 1).
    d:
      en: About 90 % goes to `shop-v1`, the backend with weight 9.
references:
  - title: HTTP traffic splitting
    url: https://gateway-api.sigs.k8s.io/guides/traffic-splitting/
