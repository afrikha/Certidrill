id: kcna-3a-image-digest
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pipeline promotes the same image from staging to production. The team must guarantee that production runs exactly the image content that was tested, even if someone later moves a tag in the registry. How should the production manifest reference the image?
body:
  options:
    - id: a
      text: { en: "By its version tag, such as `shop:2.4.1`" }
    - id: b
      text: { en: "By its digest, such as `shop@sha256:...`" }
    - id: c
      text: { en: "By its `latest` tag with `imagePullPolicy: Always`" }
    - id: d
      text: { en: "By its version tag with `imagePullPolicy: IfNotPresent`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A digest is a hash of the image content and is immutable, so Kubernetes runs the same code every time a container starts with that digest. Tags, even meaningful version tags, can be moved to point to a different image.
  options:
    a:
      en: A version tag is far better than `latest`, but a tag can still be moved to another image, so it does not guarantee the tested content.
    c:
      en: "`Always` pulls whatever the tag points to at that moment, which can be a different, untested image."
    d:
      en: "`IfNotPresent` reuses a cached image on nodes that have one, but nodes without it pull whatever the tag points to at that time."
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
