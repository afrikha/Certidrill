id: kcna-3a-gitops-source-of-truth
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In GitOps, what is usually the source of truth for the desired state of the applications running in a cluster?
body:
  options:
    - id: a
      text: { en: "The objects currently stored in etcd" }
    - id: b
      text: { en: "The configuration of the CI server" }
    - id: c
      text: { en: "Declarative files stored in a Git repository" }
    - id: d
      text: { en: "The shell history of the cluster administrators" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      GitOps keeps the desired configuration of applications and infrastructure in a source of truth, usually Git, as versioned declarative files. Automated processes continuously compare the live system with it and adjust the system to match.
  options:
    a:
      en: etcd holds the live state of the cluster, which GitOps compares against the desired state; it is not the source of truth.
    b:
      en: The CI server builds and tests artifacts; in GitOps it is not where the desired state of the cluster is defined.
    d:
      en: Imperative commands typed by administrators are exactly what GitOps replaces with reviewed, versioned declarations.
references:
  - title: GitOps
    url: https://glossary.cncf.io/gitops/
