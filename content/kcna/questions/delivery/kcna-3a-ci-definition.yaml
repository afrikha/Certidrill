id: kcna-3a-ci-definition
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Developers merge their code changes into the shared repository several times a day. Each commit automatically triggers a build, tests and code quality checks. What is this practice called?
body:
  options:
    - id: a
      text: { en: "Continuous deployment" }
    - id: b
      text: { en: "GitOps" }
    - id: c
      text: { en: "Continuous integration" }
    - id: d
      text: { en: "Infrastructure as code" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Continuous integration (CI) integrates code changes as often as possible. Tooling checks that each commit merges cleanly and runs builds, tests and quality checks, so each commit either fails or produces a viable release candidate.
  options:
    a:
      en: |
        Continuous deployment comes after CI: it releases every change that passes the pipeline to production automatically.
    b:
      en: GitOps reconciles a running system with a desired state stored in Git; it is about operating deployments, not about building and testing commits.
    d:
      en: Infrastructure as code describes infrastructure in versioned files; it does not describe frequent merging with automated tests.
references:
  - title: Continuous integration (CI)
    url: https://glossary.cncf.io/continuous-integration/
