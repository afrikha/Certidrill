id: kcna-3a-immutable-hotfix
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bug must be fixed in an application running in Pods. Following the immutable infrastructure principle, how should the fix reach the cluster?
body:
  options:
    - id: a
      text: { en: "Run `kubectl exec` in each Pod and edit the application files." }
    - id: b
      text: { en: "Copy the fixed files into the running containers with `kubectl cp`." }
    - id: c
      text: { en: "Build a new image through the pipeline and roll it out." }
    - id: d
      text: { en: "Connect to each node and patch the container image layers." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Immutable infrastructure is never changed once in service: a lasting change means building a new version and replacing the running instances. For containers, the pipeline builds a new image and the Deployment rolls it out, leaving a recorded, repeatable change.
  options:
    a:
      en: Editing files inside running containers is an in-place change that is lost when the Pod is recreated and leaves no record.
    b:
      en: "`kubectl cp` also modifies running containers in place; new Pods would start from the old image."
    d:
      en: Patching image layers on nodes is an unrecorded in-place change and does not affect other nodes or new Pods.
references:
  - title: Immutable Infrastructure
    url: https://glossary.cncf.io/immutable-infrastructure/
