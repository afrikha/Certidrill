id: kcna-3a-apply-k
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The directory `overlays/prod` contains a `kustomization.yaml` file. Which command creates or updates in the cluster the resources it produces?
body:
  options:
    - id: a
      text: { en: "`kubectl apply -f overlays/prod`" }
    - id: b
      text: { en: "`kubectl kustomize overlays/prod`" }
    - id: c
      text: { en: "`kubectl apply -k overlays/prod`" }
    - id: d
      text: { en: "`helm install prod overlays/prod`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `-k` (`--kustomize`) flag tells `kubectl` to build the kustomization directory and apply the result to the cluster.
  options:
    a:
      en: "`-f` applies the files as plain manifests; the kustomization is not built, so patches, prefixes and generators are not applied."
    b:
      en: "`kubectl kustomize` only prints the generated resources; it does not send them to the cluster."
    d:
      en: "`helm install` expects a Helm chart (with `Chart.yaml`), not a kustomization directory."
references:
  - title: Declarative Management of Kubernetes Objects Using Kustomize
    url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
