id: kcna-3b-logs-selector
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Deployment `web` runs three Pods labeled `app=web`. You want a single command that prints the logs of the three Pods.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl logs web`" }
    - id: b
      text: { en: "`kubectl logs app=web`" }
    - id: c
      text: { en: "`kubectl logs -l app=web`" }
    - id: d
      text: { en: "`kubectl describe pods -l app=web`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `-l` (`--selector`) takes a label query, and `kubectl logs` prints the logs of every Pod that matches it. With a selector, kubectl shows the last 10 lines of each Pod by default; `--tail` changes this.
  options:
    a:
      en: |
        Without a resource type, `kubectl logs web` looks for a Pod named `web`, while the Pods of the Deployment have generated names such as `web-7d9f8c6b5-x2lqp`.
    b:
      en: |
        `app=web` is read as a Pod name, not as a label query; a label query needs `-l`.
    d:
      en: |
        `kubectl describe` shows the configuration, status and events of the Pods, not their log output.
references:
  - title: kubectl logs
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/
