id: kcna-3b-debug-node-host
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You suspect a disk problem on the node `worker-2` and run:

    ```bash
    kubectl debug node/worker-2 -it --image=ubuntu
    ```

    Where is the root filesystem of the node available inside the debug container?
body:
  options:
    - id: a
      text: { en: "`/`" }
    - id: b
      text: { en: "`/host`" }
    - id: c
      text: { en: "`/mnt/node`" }
    - id: d
      text: { en: "`/var/lib/kubelet`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For a node, `kubectl debug` creates a Pod that runs in the node's host IPC, network and PID namespaces, and mounts the node's root filesystem at `/host`. This Pod is not privileged by default; a profile such as `sysadmin` gives it more privileges.
  options:
    a:
      en: |
        `/` is the root filesystem of the ubuntu debug image, not the one of the node.
    c:
      en: |
        `kubectl debug` does not mount anything at `/mnt/node`; the node's filesystem is under `/host`.
    d:
      en: |
        `/var/lib/kubelet` is a path on the node itself; inside the debug container, the node's files are under `/host`.
references:
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
  - title: kubectl debug
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_debug/
