id: kcna-3a-pipeline-order
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which sequence of steps is typical for a CI/CD pipeline of a containerized application?
body:
  options:
    - id: a
      text: { en: "Deploy to the test environment, build the image, run unit tests, push the image to the registry" }
    - id: b
      text: { en: "Push the image to the registry, run unit tests, build the image, deploy to the test environment" }
    - id: c
      text: { en: "Run unit tests, build the image, push the image to the registry, deploy to the test environment" }
    - id: d
      text: { en: "Build the image, deploy to the test environment, push the image to the registry, run unit tests" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CI starts from a commit, verifies the code (unit tests and quality checks), builds the image and pushes it to a registry as the tested artifact. CD then deploys that image, which the cluster pulls from the registry, to a test or acceptance environment.
  options:
    a:
      en: Nothing can be deployed before the image is built and pushed, because the cluster pulls images from a registry.
    b:
      en: An image cannot be pushed before it is built, and pushing untested code as a release candidate defeats the purpose of CI.
    d:
      en: The test environment pulls the image from the registry, so the image must be pushed before it is deployed; unit tests also come before deployment.
references:
  - title: Continuous integration (CI)
    url: https://glossary.cncf.io/continuous-integration/
  - title: Continuous Delivery (CD)
    url: https://glossary.cncf.io/continuous-delivery/
