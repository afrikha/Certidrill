id: kcna-3a-argocd-outofsync
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Argo CD manages the application `shop`. Someone changes a Service of the application directly in the cluster, so the live state no longer matches the target state in Git. How does Argo CD report the application?
body:
  options:
    - id: a
      text: { en: "OutOfSync" }
    - id: b
      text: { en: "Degraded" }
    - id: c
      text: { en: "Pending" }
    - id: d
      text: { en: "CrashLoopBackOff" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Argo CD controller compares the live state of each application with its target state in Git. An application whose live state differs from the target is marked `OutOfSync`, and Argo CD shows the differences and can sync automatically or on demand.
  options:
    b:
      en: "`Degraded` is a health status: it says resources are not working, not that they differ from Git."
    c:
      en: "`Pending` is a Pod phase (for example a Pod not yet scheduled), not an Argo CD sync status."
    d:
      en: "`CrashLoopBackOff` is a container waiting reason for a container that keeps crashing; it is unrelated to Git."
references:
  - title: Argo CD - Declarative GitOps CD for Kubernetes
    url: https://argo-cd.readthedocs.io/en/stable/
