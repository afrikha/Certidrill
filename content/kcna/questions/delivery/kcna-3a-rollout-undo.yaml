id: kcna-3a-rollout-undo
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new image was just rolled out to the Deployment `web`, and users report errors. You need to return to the previous version of the Deployment. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl rollout pause deployment/web`" }
    - id: b
      text: { en: "`kubectl rollout restart deployment/web`" }
    - id: c
      text: { en: "`kubectl rollout undo deployment/web`" }
    - id: d
      text: { en: "`kubectl delete deployment/web`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubectl rollout undo` rolls the Deployment back to its previous revision: the Pod template of that revision is restored and a new rollout replaces the faulty Pods.
  options:
    a:
      en: Pausing stops further changes from being rolled out, but the faulty version keeps running.
    b:
      en: A restart recreates the Pods with the current, faulty template.
    d:
      en: Deleting the Deployment deletes its Pods and causes an outage; it does not restore the previous version.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
