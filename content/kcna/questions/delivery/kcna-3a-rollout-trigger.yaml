id: kcna-3a-rollout-trigger
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which change to the Deployment `web` triggers a new rollout and creates a new revision?
body:
  options:
    - id: a
      text: { en: "Changing `spec.replicas` from 3 to 6" }
    - id: b
      text: { en: "Changing `spec.strategy.rollingUpdate.maxSurge` from 1 to 2" }
    - id: c
      text: { en: "Changing the container image in `spec.template`" }
    - id: d
      text: { en: "Changing `spec.revisionHistoryLimit` from 10 to 5" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A rollout is triggered if and only if the Pod template (`spec.template`) changes, for example its container images or labels. The Deployment then creates a new ReplicaSet, which becomes a new revision.
  options:
    a:
      en: Scaling does not trigger a rollout and does not create a revision, so manual scaling and autoscaling can happen at any time.
    b:
      en: "`maxSurge` is part of `spec.strategy`, outside the Pod template; it only affects how the next rollout proceeds."
    d:
      en: "`revisionHistoryLimit` only sets how many old ReplicaSets are kept; it is outside the Pod template."
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
