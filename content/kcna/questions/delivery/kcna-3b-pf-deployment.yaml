id: kcna-3b-pf-deployment
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Deployment `catalog` runs Pods with generated names such as `catalog-5c7b9d-8xk2q`. You want to forward local port 8080 to port 80 of one of its Pods without looking up a Pod name.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl port-forward deployment/catalog 8080:80`" }
    - id: b
      text: { en: "`kubectl port-forward catalog 8080:80`" }
    - id: c
      text: { en: "`kubectl expose deployment catalog --port=8080 --target-port=80`" }
    - id: d
      text: { en: "`kubectl proxy deployment/catalog --port=8080`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl port-forward` accepts TYPE/NAME, such as `deployment/catalog`, and selects one Pod of that resource automatically. Without a type, the name is read as a Pod name.
  options:
    b:
      en: |
        Without a resource type, kubectl looks for a Pod named `catalog`, while the Pods of the Deployment have generated names.
    c:
      en: |
        `kubectl expose` creates a Service for the Deployment; it does not forward a port from your workstation.
    d:
      en: |
        `kubectl proxy` forwards localhost to the Kubernetes API server and takes no workload as an argument.
references:
  - title: Use Port Forwarding to Access Applications in a Cluster
    url: https://kubernetes.io/docs/tasks/access-application-cluster/port-forward-access-application-cluster/
  - title: kubectl port-forward
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_port-forward/
