id: kcna-3b-cfg-pod-args-immutable
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Pod `api-6c8d7-xk2p9`, created by the Deployment `api`, has a wrong `args` value. You run `kubectl edit pod api-6c8d7-xk2p9` to correct it, but the API server refuses the change.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Delete the Pod, then run `kubectl edit pod` on the Pod that replaces it" }
    - id: b
      text: { en: "Add the corrected arguments through an ephemeral container" }
    - id: c
      text: { en: "Correct `args` in the Deployment's Pod template so that new Pods roll out" }
    - id: d
      text: { en: "Run `kubectl rollout restart deployment/api` to reload the arguments" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The command and arguments of a container cannot be changed after the Pod is created. The Pods of a Deployment are created from its Pod template, so you correct `args` there (in the manifest, then apply it). The change starts a rollout that replaces the Pods with Pods that use the new arguments.
  options:
    a:
      en: |
        The replacement Pod is created from the same Pod template, with the same wrong `args`, and it cannot be edited either.
    b:
      en: |
        An ephemeral container is a separate troubleshooting container; it cannot change the arguments of the application container.
    d:
      en: |
        `rollout restart` recreates the Pods from the current template, which still contains the wrong `args`.
references:
  - title: Define a Command and Arguments for a Container
    url: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
