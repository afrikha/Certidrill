id: kcna-3a-default-strategy
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Deployment manifest does not set `spec.strategy`. Which strategy does Kubernetes use when the Pod template of this Deployment is updated?
body:
  options:
    - id: a
      text: { en: "Recreate" }
    - id: b
      text: { en: "RollingUpdate" }
    - id: c
      text: { en: "Blue-green" }
    - id: d
      text: { en: "Canary" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `spec.strategy.type` accepts `Recreate` or `RollingUpdate`, and `RollingUpdate` is the default. Old Pods are replaced progressively by new ones, within the limits of `maxSurge` and `maxUnavailable` (25 % each by default).
  options:
    a:
      en: "`Recreate` is the other built-in value, but you must set it explicitly. It terminates all old Pods before creating new ones."
    c:
      en: Blue-green is not a value of `spec.strategy.type`. You build it yourself with two Deployments and a Service selector switch, or with a progressive delivery tool.
    d:
      en: Canary is not a value of `spec.strategy.type`. A canary release needs extra objects (a second Deployment, weighted routes) or a dedicated controller.
references:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
