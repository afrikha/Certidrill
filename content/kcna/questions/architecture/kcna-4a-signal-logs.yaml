id: kcna-4a-signal-logs
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment service fails intermittently. Metrics show the error rate rising, and traces point to the payment service as the failing step. Which signal should you examine next to read the exact error message and stack trace that the service reported?
body:
  options:
    - id: a
      text: { en: "The logs of the payment service" }
    - id: b
      text: { en: "The metrics of the payment service" }
    - id: c
      text: { en: "The baggage of the failing requests" }
    - id: d
      text: { en: "The Kubernetes Events of the Pod" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Logs are timestamped records of discrete events written by the component itself, so they contain the error message and stack trace. The usual workflow is: metrics show that something is wrong, traces show where, and logs show what exactly happened.
  options:
    b:
      en: |
        Metrics have already shown the rising error rate. They are aggregated numbers and do not carry the text of an individual error.
    c:
      en: |
        Baggage is key/value context propagated between services. It does not record the errors a service raises.
    d:
      en: |
        Kubernetes Events describe what happened to the Pod object (scheduling, pulls, restarts, probe failures). They do not contain the application's own error output.
references:
  - title: Logs
    url: https://opentelemetry.io/docs/concepts/signals/logs/
  - title: Signals
    url: https://opentelemetry.io/docs/concepts/signals/
