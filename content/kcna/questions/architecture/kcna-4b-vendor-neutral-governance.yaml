id: kcna-4b-vendor-neutral-governance
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several competing companies want to invest in an open source project, but they fear that the company that created it could change its direction alone.

    What does hosting the project in the CNCF give them?
body:
  options:
    - id: a
      text: { en: "Vendor-neutral governance under a foundation that holds the trademark" }
    - id: b
      text: { en: "A guarantee that the project becomes Graduated within a year" }
    - id: c
      text: { en: "Maintainers who are all employed and paid by the CNCF" }
    - id: d
      text: { en: "Governing Board approval for every pull request to the project" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Neutrality is a core value of the CNCF: it avoids pay-to-play decisions, and the Linux Foundation hosts project trademarks neutrally. Projects keep their own technical governance, and graduation requires documented vendor-neutral governance with maintainers from at least two organizations, so no single vendor controls the project.
  options:
    b:
      en: "Moving between maturity levels depends on adoption and on criteria checked by the TOC; there is no time-based guarantee."
    c:
      en: "Maintainers come from the contributing organizations and earn their role through contributions; the CNCF does not employ them."
    d:
      en: "Pull requests are reviewed and approved by the project's own maintainers. The Governing Board makes no technical decisions."
references:
  - title: "Cloud Native Computing Foundation (CNCF) Charter"
    url: https://github.com/cncf/foundation/blob/main/charter.md
  - title: "Archived Projects"
    url: https://www.cncf.io/archived-projects/
