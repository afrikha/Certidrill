id: kcna-4b-sig-docs-contribution
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new contributor wants to improve and translate the documentation on kubernetes.io instead of writing code.

    Which Kubernetes group should the contributor join?
body:
  options:
    - id: a
      text: { en: "SIG Release" }
    - id: b
      text: { en: "SIG Architecture" }
    - id: c
      text: { en: "SIG Contributor Experience" }
    - id: d
      text: { en: "SIG Docs" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Documentation is a recognized contribution path in Kubernetes, alongside code, designs, blog posts and community work. The kubernetes.io website and its localizations are maintained by SIG Docs, which defines the roles (member, reviewer, approver) for documentation contributions.
  options:
    a:
      en: "SIG Release manages the release process and the release team, not the documentation website."
    b:
      en: "SIG Architecture maintains the design principles and conventions of Kubernetes, not its documentation website."
    c:
      en: "SIG Contributor Experience improves the experience of all contributors, but the documentation itself is owned by SIG Docs."
references:
  - title: "Contribute to Kubernetes"
    url: https://kubernetes.io/docs/contribute/
  - title: "Roles and responsibilities"
    url: https://kubernetes.io/docs/contribute/participate/roles-and-responsibilities/
