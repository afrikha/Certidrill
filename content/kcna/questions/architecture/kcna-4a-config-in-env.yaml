id: kcna-4a-config-in-env
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Following the twelve-factor app methodology, a team wants the same container image to run in development and in production, where the database host differs. Where should the database host be configured?
body:
  options:
    - id: a
      text: { en: "In the source code, with one Git branch per environment" }
    - id: b
      text: { en: "Outside the image, in an environment variable set from a ConfigMap" }
    - id: c
      text: { en: "In a separate image tag that is built for each environment" }
    - id: d
      text: { en: "In a configuration file copied into the image at build time" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The twelve-factor app stores configuration in the environment, separate from the code. In Kubernetes, a ConfigMap decouples environment-specific configuration from the container image: the code reads a variable such as `DATABASE_HOST`, and each environment sets its own value, so one image runs everywhere.
  options:
    a:
      en: |
        Configuration in the code, with branches per environment, means different builds for each environment and breaks the separation of code and config.
    c:
      en: |
        One image per environment means the image you tested is not the one you run in production. The same image should be promoted between environments.
    d:
      en: |
        A file baked into the image ties the image to one environment; changing the database host would require a rebuild.
references:
  - title: ConfigMaps
    url: https://kubernetes.io/docs/concepts/configuration/configmap/
