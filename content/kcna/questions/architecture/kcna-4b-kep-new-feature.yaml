id: kcna-4b-kep-new-feature
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A contributor wants to propose a significant new feature for Kubernetes and coordinate it with the community.

    What should the contributor write, with the support of a sponsoring SIG?
body:
  options:
    - id: a
      text: { en: "A CNCF project proposal to the TOC" }
    - id: b
      text: { en: "A Kubernetes Enhancement Proposal (KEP)" }
    - id: c
      text: { en: "An OWNERS file" }
    - id: d
      text: { en: "A CustomResourceDefinition" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Kubernetes Enhancement Proposal (KEP) is how new efforts are proposed, communicated and coordinated in the Kubernetes project. KEPs are required for most non-trivial changes, such as most new features and major changes to existing ones, and almost all of them belong to a sponsoring SIG.
  options:
    a:
      en: "A project proposal to the TOC is how a new project applies to join the CNCF, not how a feature is added to Kubernetes."
    c:
      en: "OWNERS files list the reviewers and approvers of a part of the code. They do not propose features."
    d:
      en: "A CustomResourceDefinition extends the API of one cluster. It does not propose a change to the Kubernetes project."
references:
  - title: "Kubernetes Enhancement Proposals (KEPs)"
    url: https://github.com/kubernetes/enhancements/blob/master/keps/README.md
