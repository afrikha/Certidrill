id: kcna-4a-cluster-autoscaler
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    New Pods stay `Pending` because no node has enough free CPU for their requests. Which autoscaler adds nodes to the cluster so that these Pods can be scheduled?
body:
  options:
    - id: a
      text: { en: "HorizontalPodAutoscaler" }
    - id: b
      text: { en: "Cluster Autoscaler" }
    - id: c
      text: { en: "VerticalPodAutoscaler" }
    - id: d
      text: { en: "KEDA" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cluster Autoscaler, sponsored by SIG Autoscaling, provisions new nodes for Pods that cannot be scheduled on existing nodes. It adds nodes to the pre-configured node group that best fits the requests of the pending Pods, and later removes underused nodes.
  options:
    a:
      en: |
        The HPA changes the number of Pod replicas. Adding replicas would create even more Pending Pods; it never adds nodes.
    c:
      en: |
        The VPA adjusts the CPU and memory requests of Pods. It does not add capacity to the cluster.
    d:
      en: |
        KEDA scales workloads on events, including to and from zero replicas. Like the HPA, it scales Pods, not nodes.
references:
  - title: Node Autoscaling
    url: https://kubernetes.io/docs/concepts/cluster-administration/node-autoscaling/
