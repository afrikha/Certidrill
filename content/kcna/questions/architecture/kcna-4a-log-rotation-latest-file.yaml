id: kcna-4a-log-rotation-latest-file
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A container has written about 40 MiB of logs to stdout since it started. The kubelet uses its default log rotation settings (`containerLogMaxSize: 10Mi`, `containerLogMaxFiles: 5`). How much of this output can `kubectl logs` return?
body:
  options:
    - id: a
      text: { en: "All 40 MiB, because the kubelet keeps up to five rotated files" }
    - id: b
      text: { en: "Only the lines written since the kubelet was last restarted" }
    - id: c
      text: { en: "Only the content of the latest log file, at most 10 MiB" }
    - id: d
      text: { en: "Nothing, because rotated files are sent to a central back end" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The kubelet rotates container logs when a file reaches `containerLogMaxSize` and keeps up to `containerLogMaxFiles` files. `kubectl logs` reads only the latest log file, so with a 10 MiB rotation size it returns at most 10 MiB, even if the container wrote 40 MiB. Keeping the full history requires a cluster-level logging back end.
  options:
    a:
      en: |
        The older rotated files may still be on the node, but `kubectl logs` does not read them: it returns only the latest file.
    b:
      en: |
        Log files belong to the container and are rotated by size. A kubelet restart does not reset what `kubectl logs` can read.
    d:
      en: |
        Kubernetes provides no native log storage and ships nothing to a back end by itself. Shipping logs is the job of a logging agent you deploy.
references:
  - title: Logging Architecture
    url: https://kubernetes.io/docs/concepts/cluster-administration/logging/
