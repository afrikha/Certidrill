id: kcna-4b-end-user-tab
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs its own services on Kubernetes but sells no cloud native products or services. It wants to help represent the users of cloud native technology in CNCF community decisions.

    Which CNCF group serves as the voice of end users?
body:
  options:
    - id: a
      text: { en: "The End User Technical Advisory Board" }
    - id: b
      text: { en: "The Technical Oversight Committee (TOC)" }
    - id: c
      text: { en: "TAG Developer Experience" }
    - id: d
      text: { en: "The Kubernetes Steering Committee" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An end user is an organization that uses cloud native technologies internally to build and run its own software, without selling cloud native products or services. The End User Technical Advisory Board serves as the voice of end users in CNCF community decisions; its recommendations to the TOC are advisory.
  options:
    b:
      en: "The TOC is the technical governing body that admits and oversees projects. It takes feedback from end users but is not their representative body."
    c:
      en: "TAG Developer Experience is a Technical Advisory Group under the TOC that brings expertise in one technical area. It does not represent end users."
    d:
      en: "The Kubernetes Steering Committee oversees the governance of the Kubernetes project, not the representation of CNCF end users."
references:
  - title: "End User Community"
    url: https://www.cncf.io/enduser/
  - title: "Cloud Native Computing Foundation (CNCF) Charter"
    url: https://github.com/cncf/foundation/blob/main/charter.md
