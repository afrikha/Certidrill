id: kcna-4b-archived-project
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CNCF project has become inactive and no longer meets the CNCF requirements. The TOC approves a proposal to change its status.

    What happens to the project?
body:
  options:
    - id: a
      text: { en: "It is archived, and the Linux Foundation still hosts its trademarks" }
    - id: b
      text: { en: "It moves back to the Sandbox level until its activity resumes" }
    - id: c
      text: { en: "It is transferred to the company that originally created it" }
    - id: d
      text: { en: "It is deleted from GitHub and its code can no longer be used" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Projects that reach the end of their lifecycle and become inactive are archived after a proposal approved by the TOC; examples include rkt, OpenTracing and Service Mesh Interface. The Linux Foundation keeps hosting their trademarks neutrally, the CNCF stops providing full services, and an archived project can later be reactivated through the normal proposal process.
  options:
    b:
      en: "An inactive project is archived, not moved back to the Sandbox, which is the entry level for new experimental projects."
    c:
      en: "The trademarks of archived projects stay hosted neutrally by the Linux Foundation; they are not handed back to a vendor."
    d:
      en: "Archiving does not delete the project. Maintainers may keep working on it, and it can be reactivated."
references:
  - title: "Archived Projects"
    url: https://www.cncf.io/archived-projects/
