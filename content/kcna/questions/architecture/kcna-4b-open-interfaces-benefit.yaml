id: kcna-4b-open-interfaces-benefit
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the main benefit of the open interfaces CRI, CNI and CSI for Kubernetes users?
body:
  options:
    - id: a
      text: { en: "Runtimes, network plugins and storage drivers can be swapped without changing Kubernetes code" }
    - id: b
      text: { en: "Every container runtime, network plugin and storage driver delivers the same performance" }
    - id: c
      text: { en: "They are API resources that users create with kubectl to configure each node" }
    - id: d
      text: { en: "They encrypt the traffic between the control plane and the nodes of the cluster" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each interface defines a contract between Kubernetes and a replaceable component: CRI between the kubelet and the container runtime, CNI for network plugins, CSI for storage drivers. Any compliant implementation can be plugged in without recompiling or changing Kubernetes, and these components are developed and released outside the Kubernetes code base.
  options:
    b:
      en: "The interfaces standardize how components are called, not how fast they are. Implementations differ in features and performance."
    c:
      en: "CRI, CNI and CSI are specifications that components implement, not Kubernetes API objects that users create."
    d:
      en: "None of these interfaces encrypts control plane traffic; that is done with TLS on the API server and its clients."
references:
  - title: "Container Runtime Interface (CRI)"
    url: https://kubernetes.io/docs/concepts/architecture/cri/
  - title: "Volumes"
    url: https://kubernetes.io/docs/concepts/storage/volumes/
