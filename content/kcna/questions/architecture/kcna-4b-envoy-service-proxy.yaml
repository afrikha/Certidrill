id: kcna-4b-envoy-service-proxy
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which graduated CNCF project is an edge and service proxy that Istio runs as sidecars to form the data plane of its service mesh?
body:
  options:
    - id: a
      text: { en: "Envoy" }
    - id: b
      text: { en: "Linkerd" }
    - id: c
      text: { en: "CoreDNS" }
    - id: d
      text: { en: "Cilium" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Envoy is a graduated CNCF project described as an open source edge and service proxy for cloud native applications. In Istio's sidecar mode, Envoy proxies form the data plane: they mediate all inbound and outbound traffic of the services and are configured by the Istio control plane (istiod).
  options:
    b:
      en: "Linkerd is a complete service mesh, not the proxy that Istio uses for its data plane."
    c:
      en: "CoreDNS is the cluster DNS server that provides service discovery. It does not proxy application traffic."
    d:
      en: "Cilium is a CNI plugin based on eBPF that provides networking and network policy. Istio's sidecars are Envoy proxies, not Cilium."
references:
  - title: "Envoy"
    url: https://www.cncf.io/projects/envoy/
  - title: "Architecture"
    url: https://istio.io/latest/docs/ops/deployment/architecture/
