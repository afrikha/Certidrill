id: kcna-4a-consolidation-requests
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Monitoring shows that the Pods on a node use only 10 % of its CPU, yet the node autoscaler never removes the node. The CPU requests of these Pods add up to 90 % of the node's allocatable CPU. Why is the node kept?
body:
  options:
    - id: a
      text: { en: "Node autoscalers never remove a node that runs DaemonSet Pods" }
    - id: b
      text: { en: "Consolidation is turned off while any HorizontalPodAutoscaler exists" }
    - id: c
      text: { en: "Consolidation decisions use Pod resource requests, not real usage" }
    - id: d
      text: { en: "Consolidation needs metrics-server to report the real CPU usage" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Node autoscalers such as Cluster Autoscaler and Karpenter consider only Pod resource requests, not real usage, when they provision or consolidate nodes. Requests that reserve 90 % of the node make it look full, so the node is kept. Right-sizing the requests closer to real usage lets the autoscaler consolidate and saves cost.
  options:
    a:
      en: |
        A node that runs only DaemonSet and static Pods is considered empty and is the easiest to remove. DaemonSet Pods do not block consolidation.
    b:
      en: |
        Workload and node autoscaling are designed to work together: the HPA removes replicas, and the node autoscaler then removes the capacity that is no longer needed.
    d:
      en: |
        Node autoscalers do not base consolidation on real usage, so installing metrics-server would not change the decision.
references:
  - title: Node Autoscaling
    url: https://kubernetes.io/docs/concepts/cluster-administration/node-autoscaling/
