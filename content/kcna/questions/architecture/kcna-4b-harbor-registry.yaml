id: kcna-4b-harbor-registry
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An organization wants to host its own container registry that stores, signs and scans its images.

    Which CNCF project should it use?
body:
  options:
    - id: a
      text: { en: "Rook" }
    - id: b
      text: { en: "Harbor" }
    - id: c
      text: { en: "Helm" }
    - id: d
      text: { en: "Falco" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Harbor is a graduated CNCF project: an open source, trusted cloud native registry that stores, signs and scans content such as container images. In the CNCF landscape it belongs to the Container Registry category of the Provisioning layer.
  options:
    a:
      en: "Rook orchestrates storage for Kubernetes (for example Ceph). It is not a container registry."
    c:
      en: "Helm is a package manager that installs applications from charts. It does not host and scan container images."
    d:
      en: "Falco detects threats in running hosts and containers. It does not store images."
references:
  - title: "Harbor"
    url: https://www.cncf.io/projects/harbor/
  - title: "The CNCF Cloud Native Landscape Guide"
    url: https://landscape.cncf.io/guide
