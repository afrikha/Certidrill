id: kcna-4b-landscape-service-mesh-layer
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You browse the CNCF landscape to compare service mesh projects.

    In which layer of the landscape is the Service Mesh category?
body:
  options:
    - id: a
      text: { en: "Runtime" }
    - id: b
      text: { en: "Orchestration and Management" }
    - id: c
      text: { en: "Provisioning" }
    - id: d
      text: { en: "App Definition and Development" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The landscape guide places Service Mesh in the Orchestration and Management layer, next to Scheduling and Orchestration, Coordination and Service Discovery, Remote Procedure Call, Service Proxy and API Gateway. These categories cover how services are run, found and connected.
  options:
    a:
      en: "The Runtime layer holds cloud native storage, container runtimes and cloud native networking (such as CNI plugins), not service meshes."
    c:
      en: "The Provisioning layer holds automation and configuration, container registries, security and compliance, and key management."
    d:
      en: "App Definition and Development holds databases, streaming and messaging, application definition and image build, and CI/CD."
references:
  - title: "The CNCF Cloud Native Landscape Guide"
    url: https://landscape.cncf.io/guide
