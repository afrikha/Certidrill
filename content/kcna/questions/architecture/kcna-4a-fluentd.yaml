id: kcna-4a-fluentd
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which CNCF graduated project is an open source data collector for a unified logging layer?
body:
  options:
    - id: a
      text: { en: "Jaeger" }
    - id: b
      text: { en: "Prometheus" }
    - id: c
      text: { en: "Knative" }
    - id: d
      text: { en: "Fluentd" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Fluentd is an open source data collector for a unified logging layer and a CNCF graduated project. It collects logs from many sources, processes them and forwards them to storage back ends. Fluent Bit, from the same Fluent ecosystem, is a lighter agent often used on each node.
  options:
    a:
      en: |
        Jaeger is a distributed tracing back end. It stores traces, not logs.
    b:
      en: |
        Prometheus is a monitoring system and time series database for metrics. It does not collect logs.
    c:
      en: |
        Knative adds serverless capabilities (request-driven autoscaling, eventing) to Kubernetes. It is not a log collector.
references:
  - title: Fluentd | CNCF
    url: https://www.cncf.io/projects/fluentd/
