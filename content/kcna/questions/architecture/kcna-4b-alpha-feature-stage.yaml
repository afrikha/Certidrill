id: kcna-4b-alpha-feature-stage
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Kubernetes feature described in a KEP is at the alpha stage in v1.37.

    Which statement about this feature is true?
body:
  options:
    - id: a
      text: { en: "It is always enabled and cannot be disabled" }
    - id: b
      text: { en: "It is disabled by default and support may be dropped without notice" }
    - id: c
      text: { en: "It is usually enabled by default and considered safe to use" }
    - id: d
      text: { en: "It has graduated and no longer needs a feature gate" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Alpha features are disabled by default and must be turned on with a feature gate. They may be buggy, their API may change in incompatible ways, and support may be dropped at any time without notice, so they are recommended only for short-lived test clusters.
  options:
    a:
      en: "Always enabled with no way to disable it describes a GA (stable) feature."
    c:
      en: "Usually enabled by default and well tested describes a beta feature."
    d:
      en: "A feature whose feature gate is no longer needed has graduated to GA (stable); alpha features still need their gate to be turned on."
references:
  - title: "Feature Gates"
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/feature-gates/
