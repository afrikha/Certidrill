id: kcna-4a-prometheus-pull
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How does a Prometheus server normally collect metrics from its targets?
body:
  options:
    - id: a
      text: { en: "Each target pushes its metrics to the server over OTLP" }
    - id: b
      text: { en: "Each target writes its metrics to etcd for the server to read" }
    - id: c
      text: { en: "The server scrapes each target's HTTP metrics endpoint at intervals" }
    - id: d
      text: { en: "A node agent parses metrics out of the container log files" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Prometheus uses a pull model: the server scrapes the HTTP metrics endpoint of each target at regular intervals and stores the samples as time series identified by a metric name and labels. Targets are found through static configuration or service discovery, including Kubernetes service discovery.
  options:
    a:
      en: |
        OTLP is the OpenTelemetry protocol. Prometheus's normal collection path is pulling over HTTP; pushing is the exception, through the Pushgateway for short-lived jobs.
    b:
      en: |
        etcd stores the Kubernetes cluster state. Prometheus keeps its samples in its own local time series database and does not read metrics from etcd.
    d:
      en: |
        Parsing container log files is what a logging agent such as Fluent Bit does. Prometheus collects metrics from metrics endpoints, not from logs.
references:
  - title: Overview
    url: https://prometheus.io/docs/introduction/overview/
