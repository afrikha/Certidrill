id: kcna-4a-exporter
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You need Prometheus metrics from a PostgreSQL database whose source code you cannot change. What should you deploy?
body:
  options:
    - id: a
      text: { en: "A Pushgateway that PostgreSQL sends its metrics to" }
    - id: b
      text: { en: "An exporter that exposes PostgreSQL metrics in Prometheus format" }
    - id: c
      text: { en: "A Prometheus client library compiled into PostgreSQL" }
    - id: d
      text: { en: "An Alertmanager receiver configured for PostgreSQL" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Exporters expose metrics of third-party systems in the Prometheus format when you cannot instrument the system directly. A PostgreSQL exporter queries the database and serves the results on an HTTP endpoint that Prometheus scrapes.
  options:
    a:
      en: |
        The Pushgateway is for short-lived batch jobs that push their own metrics. PostgreSQL does not push metrics, and a long-running service should be scraped.
    c:
      en: |
        Client libraries instrument code you own. The stem says the database code cannot be changed, which is exactly the case for an exporter.
    d:
      en: |
        Alertmanager receivers are destinations for notifications (email, paging). They do not produce metrics.
references:
  - title: Exporters and integrations
    url: https://prometheus.io/docs/instrumenting/exporters/
