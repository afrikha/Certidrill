id: kcna-4b-persona-cluster-architect
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In the Kubernetes glossary, which persona designs infrastructure that involves one or more Kubernetes clusters, with a focus on distributed-system best practices such as high availability and security?
body:
  options:
    - id: a
      text: { en: "Cluster operator" }
    - id: b
      text: { en: "Cluster architect" }
    - id: c
      text: { en: "Application developer" }
    - id: d
      text: { en: "Platform developer" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A cluster architect designs infrastructure involving one or more Kubernetes clusters and is concerned with best practices for distributed systems, such as high availability and security. Keeping those clusters running day to day is the job of the cluster operator.
  options:
    a:
      en: "A cluster operator configures, controls and monitors clusters to keep them up and running, including maintenance and upgrades. It operates the clusters rather than designing them."
    c:
      en: "An application developer writes an application that runs in a Kubernetes cluster. It does not design the cluster infrastructure."
    d:
      en: "A platform developer customizes the Kubernetes platform, for example with custom resources or API extensions. It does not design the cluster topology."
references:
  - title: "Glossary"
    url: https://kubernetes.io/docs/reference/glossary/?all=true
