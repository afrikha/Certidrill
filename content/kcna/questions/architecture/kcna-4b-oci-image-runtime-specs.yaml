id: kcna-4b-oci-image-runtime-specs
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which set of open specifications defines a standard container image format and how a container runtime runs a container, so that an image built with one tool runs on any compliant runtime?
body:
  options:
    - id: a
      text: { en: "Container Runtime Interface (CRI)" }
    - id: b
      text: { en: "Container Storage Interface (CSI)" }
    - id: c
      text: { en: "Open Container Initiative (OCI)" }
    - id: d
      text: { en: "Container Network Interface (CNI)" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Open Container Initiative, a Linux Foundation project founded in 2015, publishes open industry standards for container formats and runtimes: the Image Specification, the Runtime Specification and the Distribution Specification. Because builders, registries and runtimes follow the same specifications, an image built by one tool runs on any OCI-compliant runtime.
  options:
    a:
      en: "CRI is the Kubernetes API between the kubelet and the container runtime. It does not define the image format; it builds on the lower-level OCI specifications."
    b:
      en: "CSI is the interface between container orchestrators and storage drivers. It has nothing to do with image formats or running containers."
    d:
      en: "CNI is the interface between the container runtime and network plugins that give Pods their network. It does not define images or runtimes."
references:
  - title: "About the Open Container Initiative"
    url: https://opencontainers.org/about/overview/
  - title: "Updated: Dockershim Removal FAQ"
    url: https://kubernetes.io/blog/2022/02/17/dockershim-faq/
