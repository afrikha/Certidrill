id: kcna-4b-tags-role
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    What is the role of the CNCF Technical Advisory Groups (TAGs), such as TAG Security and Compliance?
body:
  options:
    - id: a
      text: { en: "They approve the CNCF budget and direct its marketing" }
    - id: b
      text: { en: "They report to the TOC and support projects with expertise in one technical area" }
    - id: c
      text: { en: "They own and merge the code of the projects in their technical area" }
    - id: d
      text: { en: "They represent companies that use cloud native technology without selling it" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      TAGs are the primary organizational unit under the TOC and report to it. They provide services to projects, to other TAGs and to the TOC, and develop practices, standards and assessments in their domain. The current TAGs are Developer Experience, Infrastructure, Operational Resilience, Security and Compliance, and Workloads Foundation.
  options:
    a:
      en: "Budget and marketing are the responsibility of the Governing Board."
    c:
      en: "Each project's own maintainers own and merge its code under the project's governance. TAGs advise and assess; they do not own project code."
    d:
      en: "Organizations that use cloud native technology without selling it form the End User community, represented by the End User Technical Advisory Board."
references:
  - title: "10 Years in Cloud Native: TOC Restructures Technical Groups"
    url: https://www.cncf.io/blog/2025/05/07/10-years-in-cloud-native-toc-restructures-technical-groups/
  - title: "CNCF Technical Oversight Committee (TOC)"
    url: https://github.com/cncf/toc/blob/main/README.md
