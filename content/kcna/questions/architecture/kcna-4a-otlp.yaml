id: kcna-4a-otlp
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which part of OpenTelemetry is the standard protocol that defines the shape of telemetry data sent between SDKs, Collectors and back ends?
body:
  options:
    - id: a
      text: { en: "PromQL" }
    - id: b
      text: { en: "The W3C TraceContext `traceparent` header" }
    - id: c
      text: { en: "OTLP" }
    - id: d
      text: { en: "CloudEvents" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      OTLP, the OpenTelemetry Protocol, is the standard protocol that defines the shape of telemetry data. SDKs export OTLP, the Collector receives and exports it, and many back ends accept it directly, which avoids vendor-specific formats.
  options:
    a:
      en: |
        PromQL is the query language of Prometheus. It reads stored time series; it is not a transport protocol for telemetry.
    b:
      en: |
        The `traceparent` header carries the trace context (trace ID, parent ID) between services so that spans join the same trace. It does not carry the telemetry data to back ends.
    d:
      en: |
        CloudEvents is a specification for describing event data, used for example by Knative Eventing. It is not OpenTelemetry's telemetry protocol.
references:
  - title: What is OpenTelemetry?
    url: https://opentelemetry.io/docs/what-is-opentelemetry/
