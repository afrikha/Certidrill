id: kcna-4b-switch-runtime-endpoint
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator replaces containerd with CRI-O on a node of a Kubernetes v1.37 cluster. The workloads and their images must not change.

    What must the administrator configure so that the kubelet uses the new runtime?
body:
  options:
    - id: a
      text: { en: "Set `runtimeClassName: cri-o` in every Pod that runs on the node" }
    - id: b
      text: { en: "Rebuild the images in a format that CRI-O can read" }
    - id: c
      text: { en: "Install a different CNI plugin that supports CRI-O" }
    - id: d
      text: { en: "Point the kubelet's container runtime endpoint to the CRI-O socket" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The kubelet talks to any runtime through the CRI, as a gRPC client of the endpoint set by `--container-runtime-endpoint` (or the matching kubelet configuration field). Switching runtimes means pointing that endpoint to the new runtime, which must support the CRI `v1` API; Pods and OCI images stay the same.
  options:
    a:
      en: "A RuntimeClass selects a runtime handler configured in the node's runtime, for example a sandboxed runtime. It does not tell the kubelet which CRI runtime to connect to."
    b:
      en: "containerd and CRI-O both run standard OCI images, so the images do not need to be rebuilt."
    c:
      en: "CNI plugins follow a runtime-independent specification; CRI-O loads them like containerd does, so the network plugin does not need to change."
references:
  - title: "Container Runtime Interface (CRI)"
    url: https://kubernetes.io/docs/concepts/architecture/cri/
