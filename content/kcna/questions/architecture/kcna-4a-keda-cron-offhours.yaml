id: kcna-4a-keda-cron-offhours
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Deployments of a development environment are idle every night and weekend. To reduce resource consumption during these off-peak hours, you want them scaled in and out on a schedule that uses the team's time zone. Which approach meets this goal?
body:
  options:
    - id: a
      text: { en: "A VerticalPodAutoscaler in `Initial` mode" }
    - id: b
      text: { en: "KEDA with its Cron scaler" }
    - id: c
      text: { en: "A HorizontalPodAutoscaler with a memory target" }
    - id: d
      text: { en: "A PodDisruptionBudget for each Deployment" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Kubernetes autoscaling documentation describes scheduled scaling to reduce resource consumption during off-peak hours with KEDA and its Cron scaler, which defines schedules and time zones for scaling workloads in or out.
  options:
    a:
      en: |
        In `Initial` mode the VPA sets requests only when Pods are created. It changes Pod size, not the number of replicas, and has no schedule.
    c:
      en: |
        An HPA reacts to observed metrics such as memory utilization. It has no notion of a calendar schedule.
    d:
      en: |
        A PodDisruptionBudget limits voluntary disruptions of a workload. It does not scale anything.
references:
  - title: Autoscaling Workloads
    url: https://kubernetes.io/docs/concepts/workloads/autoscaling/
