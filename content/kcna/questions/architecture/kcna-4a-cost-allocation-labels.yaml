id: kcna-4a-cost-allocation-labels
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several teams share one cluster. Finance wants a monthly report of the Kubernetes cost of each team. What should the platform team do so that a cost tool such as OpenCost can attribute the spending to teams?
body:
  options:
    - id: a
      text: { en: "Assign a separate PriorityClass to each team's Pods" }
    - id: b
      text: { en: "Create a HorizontalPodAutoscaler for each team's Deployments" }
    - id: c
      text: { en: "Set one LimitRange in the `default` namespace" }
    - id: d
      text: { en: "Use a namespace per team and a consistent `team` label" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Cost allocation groups resource usage by Kubernetes metadata. Labels exist to organize and select subsets of objects, and namespaces split a cluster between teams, so a namespace per team plus a consistent `team` label lets a cost tool aggregate spending per team (showback or chargeback).
  options:
    a:
      en: |
        A PriorityClass decides which Pods are scheduled first and which can be preempted. It is not meant to identify owners for cost reports.
    b:
      en: |
        An HPA scales replicas with demand, which can reduce cost, but it does not say which team owns which workload.
    c:
      en: |
        A LimitRange sets default and maximum resources per object in one namespace. It neither separates teams nor attributes cost.
references:
  - title: OpenCost | CNCF
    url: https://www.cncf.io/projects/opencost/
  - title: Labels and Selectors
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
