id: kcna-4a-component-metrics-endpoint
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    How do Kubernetes system components such as kube-apiserver, kube-scheduler and the kubelet expose their own metrics?
body:
  options:
    - id: a
      text: { en: "As Kubernetes Events stored in etcd and read with `kubectl events`" }
    - id: b
      text: { en: "In the Prometheus text format, on a `/metrics` HTTP endpoint" }
    - id: c
      text: { en: "As OTLP data pushed by default to an OpenTelemetry Collector" }
    - id: d
      text: { en: "As JSON files written under `/var/log/pods` on each node" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes components emit metrics in the Prometheus format, a structured plain-text format, usually on the `/metrics` endpoint of their HTTP server. Any Prometheus-compatible collector can scrape them; Kubernetes itself is instrumented with a Prometheus client library.
  options:
    a:
      en: |
        Events record state changes of objects (a Pod scheduled, an image pulled). They are short-lived API objects, not time series of component metrics.
    c:
      en: |
        OTLP is the OpenTelemetry protocol. The components' metrics endpoint uses the Prometheus format; nothing is pushed to a Collector by default.
    d:
      en: |
        `/var/log/pods` holds container log files written by the runtime. Component metrics are served over HTTP, not written as files.
references:
  - title: Metrics For Kubernetes System Components
    url: https://kubernetes.io/docs/concepts/cluster-administration/system-metrics/
  - title: Exporters and integrations
    url: https://prometheus.io/docs/instrumenting/exporters/
