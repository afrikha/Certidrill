id: kcna-4a-alertmanager
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Prometheus alerting rules fire alerts. Which component deduplicates and groups these alerts and routes the notifications to receivers such as email or a paging service?
body:
  options:
    - id: a
      text: { en: "Grafana" }
    - id: b
      text: { en: "Pushgateway" }
    - id: c
      text: { en: "The Prometheus time series database" }
    - id: d
      text: { en: "Alertmanager" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Alertmanager handles alerts sent by client applications such as the Prometheus server. It deduplicates and groups them, routes them to the right receivers (email, chat, paging), and supports silences and inhibition.
  options:
    a:
      en: |
        Grafana is a visualization platform that queries Prometheus to build dashboards. It is not the component that routes Prometheus alerts.
    b:
      en: |
        The Pushgateway accepts metrics pushed by short-lived jobs so that Prometheus can scrape them. It does not handle alerts.
    c:
      en: |
        The local time series database stores scraped samples. Alert notification, grouping and routing are Alertmanager's job.
references:
  - title: Alertmanager
    url: https://prometheus.io/docs/alerting/latest/alertmanager/
