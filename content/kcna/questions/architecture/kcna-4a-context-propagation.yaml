id: kcna-4a-context-propagation
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Service A calls service B over HTTP. Both are instrumented with OpenTelemetry, but the tracing back end shows two separate traces instead of one trace with B's span under A's span. What is the most likely cause?
body:
  options:
    - id: a
      text: { en: "The trace context is not propagated from A to B in the request headers" }
    - id: b
      text: { en: "Service B exposes no Prometheus metrics endpoint for the server to scrape" }
    - id: c
      text: { en: "Both services write their logs to stdout instead of to log files" }
    - id: d
      text: { en: "The Collector batches the spans before it exports them to the back end" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Context propagation moves the trace ID and the parent span ID from one service to the next, by default in the W3C TraceContext `traceparent` header. Service B uses them to create its span in the same trace, with A's span as parent. If the context is not propagated, B starts a new trace.
  options:
    b:
      en: |
        A metrics endpoint concerns Prometheus metrics. It plays no part in linking spans into one trace.
    c:
      en: |
        Writing logs to stdout is the recommended practice in Kubernetes and does not affect how spans are linked.
    d:
      en: |
        Batching groups spans for efficient export. It changes when spans arrive, not which trace they belong to: each span still carries its trace ID.
references:
  - title: Context propagation
    url: https://opentelemetry.io/docs/concepts/context-propagation/
