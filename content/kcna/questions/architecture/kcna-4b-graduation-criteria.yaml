id: kcna-4b-graduation-criteria
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Incubating CNCF project applies to move to the Graduated level.

    Which requirement must it meet?
body:
  options:
    - id: a
      text: { en: "Approval of the move by a vote of the CNCF Governing Board" }
    - id: b
      text: { en: "An accepted Kubernetes Enhancement Proposal from a SIG" }
    - id: c
      text: { en: "Maintainers who all work for the company that created it" }
    - id: d
      text: { en: "Maintainers from at least two organizations" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The graduation criteria require maintainers from at least two organizations to show that the project can survive, along with an OpenSSF Best Practices passing badge, a third-party security review, documented vendor-neutral governance and public adopters. The TOC decides the move with a two-thirds supermajority after due diligence.
  options:
    a:
      en: "Moves between maturity levels are voted by the TOC, not by the Governing Board, which handles business and budget."
    b:
      en: "KEPs propose changes to Kubernetes itself. They play no part in the graduation of a CNCF project."
    c:
      en: "Maintainers from a single company is the opposite of what graduation requires: maintainers from at least two organizations and vendor-neutral governance."
references:
  - title: "Project Graduation Application"
    url: https://github.com/cncf/toc/blob/main/.github/ISSUE_TEMPLATE/template-graduation-application.md
  - title: "CNCF Project Lifecycle & Process"
    url: https://github.com/cncf/toc/blob/main/process/README.md
