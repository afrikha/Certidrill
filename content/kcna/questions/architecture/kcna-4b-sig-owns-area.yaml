id: kcna-4b-sig-owns-area
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the Kubernetes project, which groups collectively manage an ongoing area of the project, such as networking, storage or documentation, and own its code through subprojects?
body:
  options:
    - id: a
      text: { en: "Working groups (WGs)" }
    - id: b
      text: { en: "Committees" }
    - id: c
      text: { en: "Special Interest Groups (SIGs)" }
    - id: d
      text: { en: "CNCF Technical Advisory Groups (TAGs)" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Special Interest Groups are community members who collectively manage an ongoing aspect of the Kubernetes project, for example SIG Network, SIG Storage or SIG Docs. Every identifiable part of the project is owned by a SIG, and work inside a SIG is divided into subprojects with their own owners.
  options:
    a:
      en: "Working groups facilitate short-lived or cross-SIG efforts. Areas of the code are owned by SIGs."
    b:
      en: "Committees, such as Steering, Code of Conduct and Security Response, handle governance and sensitive topics; they do not own areas of the code."
    d:
      en: "TAGs belong to the CNCF and support CNCF projects with expertise. They are not part of the Kubernetes project structure."
references:
  - title: "Glossary"
    url: https://kubernetes.io/docs/reference/glossary/?all=true
  - title: "Kubernetes community governance (governance.md)"
    url: https://github.com/kubernetes/community/blob/master/governance.md
