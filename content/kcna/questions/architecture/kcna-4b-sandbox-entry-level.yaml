id: kcna-4b-sandbox-entry-level
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new, experimental open source project that is not yet widely tested in production joins the CNCF.

    At which maturity level does it enter?
body:
  options:
    - id: a
      text: { en: "Incubating" }
    - id: b
      text: { en: "Graduated" }
    - id: c
      text: { en: "Sandbox" }
    - id: d
      text: { en: "Archived" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Sandbox is the entry point for early-stage projects: experimental projects not yet widely tested in production. Sandbox projects must follow the CNCF legal, code of conduct and intellectual property requirements.
  options:
    a:
      en: "Incubating projects are already used successfully in production by a number of users and have a healthy pool of contributors."
    b:
      en: "Graduated is the highest level, for stable, widely adopted, production-ready projects."
    d:
      en: "Archived is for projects that have reached the end of their lifecycle and become inactive, not for new ones."
references:
  - title: "Sandbox Projects"
    url: https://www.cncf.io/sandbox-projects/
  - title: "Graduated and Incubating Projects"
    url: https://www.cncf.io/projects/
