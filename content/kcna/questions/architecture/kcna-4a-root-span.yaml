id: kcna-4a-root-span
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A trace contains the spans below. All of them share the same trace ID.

    ```text
    span_id   name          parent_id
    a1        checkout      -
    b2        get-cart      a1
    c3        charge-card   a1
    d4        call-bank     c3
    ```

    What is the `checkout` span called?
body:
  options:
    - id: a
      text: { en: "A child span" }
    - id: b
      text: { en: "The root span" }
    - id: c
      text: { en: "A span event" }
    - id: d
      text: { en: "The span context" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The span with no parent ID is the root span: it represents the whole operation, and every other span of the trace descends from it. All spans carry the same trace ID, which is how they are grouped into one trace.
  options:
    a:
      en: |
        `get-cart`, `charge-card` and `call-bank` are child spans because they reference a parent ID. `checkout` has no parent.
    c:
      en: |
        A span event is a timestamped annotation recorded inside a span, not a separate span with its own ID.
    d:
      en: |
        The span context is the trace ID and span ID pair that identifies a span and is propagated to other services. It is a property of a span, not the name for the top-level span.
references:
  - title: Traces
    url: https://opentelemetry.io/docs/concepts/signals/traces/
