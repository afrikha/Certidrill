id: kcna-4a-opencost
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which CNCF project provides visibility into current and historical Kubernetes spend and resource allocation?
body:
  options:
    - id: a
      text: { en: "Prometheus" }
    - id: b
      text: { en: "OpenCost" }
    - id: c
      text: { en: "KEDA" }
    - id: d
      text: { en: "Kyverno" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      OpenCost, a CNCF incubating project, provides visibility into current and historical Kubernetes spend and resource allocation. Teams use it to see what their workloads cost and to attribute that cost.
  options:
    a:
      en: |
        Prometheus collects and stores metrics such as CPU and memory usage. It does not by itself turn them into costs.
    c:
      en: |
        KEDA scales workloads on events, which can lower cost, but it does not report or allocate spending.
    d:
      en: |
        Kyverno is a policy engine that validates, mutates and generates Kubernetes resources. It does not measure cost.
references:
  - title: OpenCost | CNCF
    url: https://www.cncf.io/projects/opencost/
