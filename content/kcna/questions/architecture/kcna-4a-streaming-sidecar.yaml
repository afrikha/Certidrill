id: kcna-4a-streaming-sidecar
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legacy application can only write its logs to a file inside its container. You want these logs to reach the node-level logging agent and to be visible with `kubectl logs`, without changing the application. What should you add to the Pod?
body:
  options:
    - id: a
      text: { en: "A sidecar container that reads the file and prints it to its own stdout" }
    - id: b
      text: { en: "A sidecar container that runs a full logging agent and ships the file" }
    - id: c
      text: { en: "A startup probe that checks that the log file exists" }
    - id: d
      text: { en: "An init container that creates the log file before the app starts" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A streaming sidecar shares a volume with the application, tails the log file and writes it to its own stdout. The runtime then captures it like any container output, so the node-level agent collects it and `kubectl logs <pod> -c <sidecar>` shows it, with little overhead.
  options:
    b:
      en: |
        A sidecar running its own logging agent can ship the file, but those logs are not handled by the kubelet, so `kubectl logs` cannot show them, and the extra agent consumes more resources.
    c:
      en: |
        A startup probe only tells the kubelet when the application has started. It does not move any log data.
    d:
      en: |
        An init container runs to completion before the app starts. It cannot stream a file that the application writes later.
references:
  - title: Logging Architecture
    url: https://kubernetes.io/docs/concepts/cluster-administration/logging/
