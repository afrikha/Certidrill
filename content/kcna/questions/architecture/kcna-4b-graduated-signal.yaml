id: kcna-4b-graduated-signal
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does the Graduated maturity level signal about a CNCF project such as Kubernetes or Prometheus?
body:
  options:
    - id: a
      text: { en: "The project is experimental and breaking changes are expected" }
    - id: b
      text: { en: "The project is stable, widely adopted and production ready" }
    - id: c
      text: { en: "The project is used in production by a small number of users" }
    - id: d
      text: { en: "The project is inactive and no longer recommended for use" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Graduated projects are considered stable, widely adopted and production ready, and they attract many contributors. Adopters have demonstrated production readiness, so the project is considered a trusted solution.
  options:
    a:
      en: "Experimental projects with expected breaking changes are at the Sandbox level."
    c:
      en: "Production use by a small number of users with a healthy pool of contributors describes the Incubating level."
    d:
      en: "Inactive projects that the TOC no longer supports or recommends are Archived."
references:
  - title: "Graduated and Incubating Projects"
    url: https://www.cncf.io/projects/
  - title: "CNCF Project Lifecycle & Process"
    url: https://github.com/cncf/toc/blob/main/process/README.md
