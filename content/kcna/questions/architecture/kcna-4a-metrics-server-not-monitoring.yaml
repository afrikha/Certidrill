id: kcna-4a-metrics-server-not-monitoring
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster runs metrics-server, so `kubectl top pods` works. The operations team now wants weeks of history for application metrics, with dashboards and alerting. What should the team do?
body:
  options:
    - id: a
      text: { en: "Point the dashboards at the `metrics.k8s.io` API served by metrics-server" }
    - id: b
      text: { en: "Create a HorizontalPodAutoscaler for every Deployment" }
    - id: c
      text: { en: "Read the kubelet logs on each node with `journalctl -u kubelet`" }
    - id: d
      text: { en: "Deploy a monitoring stack such as Prometheus with Grafana" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The resource metrics pipeline (metrics-server and the `metrics.k8s.io` API) only offers the minimum CPU and memory metrics needed by the HPA, the VPA and `kubectl top`. History, application metrics, dashboards and alerts need a full monitoring stack, for example Prometheus to scrape and store time series and Grafana to build dashboards.
  options:
    a:
      en: |
        The Metrics API returns current CPU and memory usage of nodes and Pods for autoscaling. It does not provide application metrics or a long history to chart.
    b:
      en: |
        A HorizontalPodAutoscaler changes the number of replicas. It consumes metrics; it does not store them or show dashboards.
    c:
      en: |
        The kubelet's journald logs describe the kubelet's own activity. They are not application metrics and give no dashboards or alerting.
references:
  - title: Resource metrics pipeline
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/
  - title: Overview
    url: https://prometheus.io/docs/introduction/overview/
