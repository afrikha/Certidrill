id: kcna-4a-signal-traces
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    One user request passes through five microservices. Which telemetry signal shows the path of that single request across the services, with the time spent in each one?
body:
  options:
    - id: a
      text: { en: "Metrics" }
    - id: b
      text: { en: "Traces" }
    - id: c
      text: { en: "Logs" }
    - id: d
      text: { en: "Kubernetes Events" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A trace records the route that one request takes through an application. It is made of timed spans, one per unit of work, so you can see which service the request visited and how long each step took.
  options:
    a:
      en: |
        Metrics are numeric measurements aggregated over time, such as request rate or latency percentiles. They show that something is slow, not the path of one particular request.
    c:
      en: |
        Logs are records of discrete events in one component. Each service logs its own events, but logs alone do not link the steps of one request into a path with timings.
    d:
      en: |
        Kubernetes Events report state changes of cluster objects (scheduling, image pulls, restarts). They know nothing about application requests flowing between services.
references:
  - title: Signals
    url: https://opentelemetry.io/docs/concepts/signals/
  - title: Traces
    url: https://opentelemetry.io/docs/concepts/signals/traces/
