id: kcna-4a-hpa-formula
objective: "4.2.2"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A HorizontalPodAutoscaler targets an average CPU utilization of 50 % for a Deployment, with `minReplicas: 2` and `maxReplicas: 10`. The Deployment runs 4 ready replicas, all reporting metrics, and their average CPU utilization is 90 %. How many replicas will the HPA set at its next evaluation?
body:
  options:
    - id: a
      text: { en: "6" }
    - id: b
      text: { en: "7" }
    - id: c
      text: { en: "8" }
    - id: d
      text: { en: "9" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The HPA computes `desiredReplicas = ceil(currentReplicas × currentMetricValue / desiredMetricValue)` = ceil(4 × 90 / 50) = ceil(7.2) = 8. The ratio 1.8 is far outside the default 10 % tolerance, scaling up has no stabilization window by default, and 8 is within the 2–10 range.
  options:
    a:
      en: |
        6 would bring utilization to about 60 %, still above the 50 % target. The formula multiplies the current replicas by the ratio 90/50.
    b:
      en: |
        7 rounds 7.2 down. The formula takes the ceiling, so 7.2 becomes 8.
    d:
      en: |
        9 overshoots: the formula gives 7.2, rounded up to 8.
references:
  - title: Horizontal Pod Autoscaling
    url: https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
