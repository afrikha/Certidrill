id: kcna-4a-knative-identify
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which CNCF graduated project adds serverless capabilities to Kubernetes, including request-driven autoscaling of containers down to zero when they are idle?
body:
  options:
    - id: a
      text: { en: "Helm" }
    - id: b
      text: { en: "Argo CD" }
    - id: c
      text: { en: "Knative" }
    - id: d
      text: { en: "Linkerd" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Knative is a serverless application layer on Kubernetes. Knative Serving deploys serverless containers with autoscaling based on incoming traffic, including scale to zero when idle, and manages revisions and traffic splitting; Knative Eventing routes events.
  options:
    a:
      en: |
        Helm is a package manager that installs applications from charts. It does not autoscale workloads.
    b:
      en: |
        Argo CD is a GitOps tool that syncs cluster state with a Git repository. It does not provide serverless autoscaling.
    d:
      en: |
        Linkerd is a service mesh that adds mutual TLS, traffic management and observability between services. It does not scale workloads to zero.
references:
  - title: Knative Serving
    url: https://knative.dev/docs/serving/
  - title: Knative | CNCF
    url: https://www.cncf.io/projects/knative/
