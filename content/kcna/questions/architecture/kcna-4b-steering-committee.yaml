id: kcna-4b-steering-committee
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which body of seven members oversees the governance of the whole Kubernetes project and receives disputes that cannot be resolved elsewhere?
body:
  options:
    - id: a
      text: { en: "The CNCF Technical Oversight Committee" }
    - id: b
      text: { en: "SIG Architecture" }
    - id: c
      text: { en: "The Code of Conduct Committee" }
    - id: d
      text: { en: "The Kubernetes Steering Committee" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Kubernetes Steering Committee is a seven-member body that oversees the governance of the Kubernetes project. It forms committees and decides their members, holds a seat on the CNCF Governing Board, and is the escalation point for extended debates or deadlocks.
  options:
    a:
      en: "The CNCF TOC provides technical leadership for the whole CNCF. It does not govern the internal organization of Kubernetes."
    b:
      en: "SIG Architecture is a SIG that maintains the architecture and design principles of Kubernetes. It does not govern the whole project."
    c:
      en: "The Code of Conduct Committee handles code of conduct incidents and reports to the Steering Committee."
references:
  - title: "Steering Committee"
    url: https://github.com/kubernetes/steering
  - title: "Kubernetes community governance (governance.md)"
    url: https://github.com/kubernetes/community/blob/master/governance.md
