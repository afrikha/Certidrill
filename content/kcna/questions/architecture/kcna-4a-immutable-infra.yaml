id: kcna-4a-immutable-infra
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bug is found in an application that runs in production containers. Following the principle of immutable infrastructure, how should the fix be delivered?
body:
  options:
    - id: a
      text: { en: "Run `kubectl exec` in each container and patch the files" }
    - id: b
      text: { en: "Edit the application files directly on each node's disk" }
    - id: c
      text: { en: "Install the fix with a package manager inside each container" }
    - id: d
      text: { en: "Build a new image version and replace the running containers" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Immutable infrastructure is never modified after deployment. A lasting change to a container requires building a new version of its image and recreating the container from it, for example by updating the image tag of a Deployment and letting it roll out.
  options:
    a:
      en: |
        Patching through `kubectl exec` changes a running container in place. The change is lost when the container restarts and makes instances drift from their image.
    b:
      en: |
        Editing files on nodes changes deployed infrastructure by hand, the opposite of immutability, and is not reproducible.
    c:
      en: |
        Installing packages inside a running container is an in-place modification that disappears on restart and leaves the image unfixed.
references:
  - title: Immutable Infrastructure
    url: https://glossary.cncf.io/immutable-infrastructure/
