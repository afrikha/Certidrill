id: kcna-4b-backstage-developer-portal
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team wants to build an internal developer portal: a single place where developers find the organization's services and the tools to create new ones.

    Which CNCF project is designed for this?
body:
  options:
    - id: a
      text: { en: "Argo CD" }
    - id: b
      text: { en: "Helm" }
    - id: c
      text: { en: "Backstage" }
    - id: d
      text: { en: "Knative" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Backstage is a CNCF project (Incubating) described as an open platform for building developer portals. Platform teams use it to build their own internal developer portals for the organization's developers.
  options:
    a:
      en: "Argo CD is a GitOps tool that continuously syncs Kubernetes manifests from Git to clusters. It is not a developer portal."
    b:
      en: "Helm packages and installs applications as charts. It does not provide a portal for developers."
    d:
      en: "Knative adds serverless capabilities, such as request-driven scaling and scale to zero, to Kubernetes. It is not a developer portal."
references:
  - title: "Backstage"
    url: https://www.cncf.io/projects/backstage/
