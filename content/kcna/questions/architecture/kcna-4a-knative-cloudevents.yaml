id: kcna-4a-knative-cloudevents
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Knative Eventing routes events from producers (sources) to consumers (sinks) through HTTP POST requests. Which specification do these events follow, so that they can be created and parsed in any programming language?
body:
  options:
    - id: a
      text: { en: "CloudEvents" }
    - id: b
      text: { en: "OpenTelemetry Protocol (OTLP)" }
    - id: c
      text: { en: "OCI Image Format Specification" }
    - id: d
      text: { en: "Container Network Interface (CNI)" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Knative Eventing sends events as HTTP POST requests that conform to the CloudEvents specification. A common event format lets producers and consumers written in any language exchange events, and lets them be developed and deployed independently.
  options:
    b:
      en: |
        OTLP is the protocol for sending telemetry (traces, metrics, logs) to observability back ends, not for application events.
    c:
      en: |
        The OCI image specification defines the format of container images. It has nothing to do with event payloads.
    d:
      en: |
        CNI is the interface between the container runtime and network plugins that give Pods network connectivity. It does not define events.
references:
  - title: Knative Eventing
    url: https://knative.dev/docs/eventing/
