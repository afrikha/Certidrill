id: kcna-4b-persona-sre
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which role applies software engineering to operations: instead of building product features, it builds monitoring, alerting and automation so that applications keep working in production?
body:
  options:
    - id: a
      text: { en: "Site reliability engineer (SRE)" }
    - id: b
      text: { en: "Application developer" }
    - id: c
      text: { en: "Platform engineer" }
    - id: d
      text: { en: "Security engineer" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Site Reliability Engineering combines operations and software engineering. SREs build systems to run applications rather than product features: they continuously measure and monitor infrastructure and applications, alert when something fails and automate operational tasks so that production stays reliable.
  options:
    b:
      en: "An application developer writes the application and its features, the work that SREs specifically do not do."
    c:
      en: "A platform engineer builds self-service tools that help developers ship software, rather than focusing on the reliability of services in production."
    d:
      en: "A security engineer focuses on securing the supply chain, clusters and workloads, not on overall service reliability."
references:
  - title: "Site Reliability Engineering"
    url: https://glossary.cncf.io/site-reliability-engineering/
