id: kcna-4a-knative-route
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Knative Service contains the traffic block below. Which Knative Serving resource, created and managed by the Service, maps the network endpoint to these Revisions and applies the split?

    ```yaml
    apiVersion: serving.knative.dev/v1
    kind: Service
    metadata:
      name: hello
    spec:
      # template omitted
      traffic:
      - revisionName: hello-00001
        percent: 90
      - revisionName: hello-00002
        percent: 10
    ```
body:
  options:
    - id: a
      text: { en: "Configuration" }
    - id: b
      text: { en: "Route" }
    - id: c
      text: { en: "Revision" }
    - id: d
      text: { en: "Trigger" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Knative Service creates a Route, a Configuration and a new Revision for each update. The Route maps the network endpoint to one or more Revisions and distributes traffic between them, here 90 % to the stable Revision and 10 % to the new one (a canary).
  options:
    a:
      en: |
        The Configuration holds the desired state of the code and settings and produces Revisions. It does not decide how traffic is distributed.
    c:
      en: |
        Revisions are the targets of the split. Each is an immutable snapshot; none of them routes traffic to the others.
    d:
      en: |
        A Trigger belongs to Knative Eventing: it delivers events from a Broker to a consumer based on event attributes. It does not split HTTP traffic.
references:
  - title: Knative Serving
    url: https://knative.dev/docs/serving/
  - title: Traffic management
    url: https://knative.dev/docs/serving/traffic-management/
