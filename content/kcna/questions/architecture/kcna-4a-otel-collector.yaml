id: kcna-4a-otel-collector
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Applications in a cluster are instrumented with OpenTelemetry SDKs. You want one vendor-agnostic component that receives their telemetry, batches and filters it, and exports it to several back ends. What should you deploy?
body:
  options:
    - id: a
      text: { en: "Jaeger" }
    - id: b
      text: { en: "metrics-server" }
    - id: c
      text: { en: "Prometheus Pushgateway" }
    - id: d
      text: { en: "OpenTelemetry Collector" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The OpenTelemetry Collector is a vendor-agnostic service that receives, processes and exports telemetry. Its pipelines are built from receivers, processors (for example batching and filtering) and exporters, and it can send data to one or more open source or commercial back ends. It runs as an agent next to workloads or as a central gateway.
  options:
    a:
      en: |
        Jaeger is a tracing back end that stores and displays traces. It is one possible destination of the telemetry, not the component that fans it out to several back ends.
    b:
      en: |
        metrics-server collects CPU and memory usage from kubelets for autoscaling and `kubectl top`. It does not receive application telemetry.
    c:
      en: |
        The Pushgateway holds metrics pushed by short-lived batch jobs for Prometheus to scrape. It does not process or export traces and logs.
references:
  - title: Collector
    url: https://opentelemetry.io/docs/collector/
