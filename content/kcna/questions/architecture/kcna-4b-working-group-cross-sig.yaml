id: kcna-4b-working-group-cross-sig
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Kubernetes contributors need to discuss a short-lived topic that spans several SIGs. No new long-term area of the code needs an owner.

    What kind of group should they form?
body:
  options:
    - id: a
      text: { en: "A working group" }
    - id: b
      text: { en: "A new Special Interest Group" }
    - id: c
      text: { en: "A committee" }
    - id: d
      text: { en: "A subproject of one SIG" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Working groups are rallying points for topics that are short-lived or that span multiple SIGs. They facilitate discussion and coordination of a discrete task, while the code itself stays owned by SIGs and their subprojects.
  options:
    b:
      en: "A SIG is a long-lived group that owns an ongoing area of the project. It is not meant for a short-lived, cross-SIG topic."
    c:
      en: "Committees are for sensitive topics that require discretion, such as security or the code of conduct, and their membership is not open."
    d:
      en: "A subproject is a work effort inside a single SIG, so it does not fit a topic that spans several SIGs."
references:
  - title: "Kubernetes community governance (governance.md)"
    url: https://github.com/kubernetes/community/blob/master/governance.md
  - title: "Glossary"
    url: https://kubernetes.io/docs/reference/glossary/?all=true
