id: kcna-4b-interfaces-boundaries
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Which list correctly matches each open interface with the boundary it defines in a Kubernetes cluster?
body:
  options:
    - id: a
      text: { en: "CRI: runtime to network plugins; CNI: kubelet to runtime; CSI: orchestrator to storage drivers" }
    - id: b
      text: { en: "CRI: kubelet to runtime; CNI: orchestrator to storage drivers; CSI: runtime to network plugins" }
    - id: c
      text: { en: "CRI: kubelet to runtime; CNI: runtime to network plugins; CSI: orchestrator to storage drivers" }
    - id: d
      text: { en: "CRI: orchestrator to storage drivers; CNI: runtime to network plugins; CSI: kubelet to runtime" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The CRI is the protocol between the kubelet (the client) and the container runtime. CNI plugins are loaded by the container runtime to set up the network of each Pod. CSI defines how container orchestration systems such as Kubernetes expose storage systems to workloads through CSI drivers.
  options:
    a:
      en: "CRI and CNI are swapped: the kubelet talks to the runtime through CRI, and the runtime calls the network plugins through CNI."
    b:
      en: "CNI and CSI are swapped: CNI is for networking and CSI is for storage."
    d:
      en: "CRI and CSI are swapped: CRI connects the kubelet to the runtime, and CSI connects the orchestrator to storage drivers."
references:
  - title: "Network Plugins"
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/
  - title: "Container Runtime Interface (CRI)"
    url: https://kubernetes.io/docs/concepts/architecture/cri/
