id: kcna-4a-stateless-processes
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web application keeps user session data in the memory of its process. After the team scales its Deployment from 1 to 5 replicas, users are randomly logged out when their requests reach a different Pod. Which cloud native principle does the application break?
body:
  options:
    - id: a
      text: { en: "Use declarative APIs" }
    - id: b
      text: { en: "Use immutable infrastructure" }
    - id: c
      text: { en: "Keep dev/prod parity" }
    - id: d
      text: { en: "Run as stateless processes" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Cloud native and twelve-factor applications run as stateless processes: each request is handled without relying on data kept in the process, and shared state lives in a backing service such as a database or cache. Stateless replicas are interchangeable, which is what makes horizontal scaling work.
  options:
    a:
      en: |
        Declarative APIs concern how you describe desired state to the platform (manifests, `kubectl apply`). The Deployment is already declared; the problem is inside the application.
    b:
      en: |
        Immutable infrastructure is about replacing instead of modifying deployed containers. Keeping sessions in memory does not modify the infrastructure.
    c:
      en: |
        Dev/prod parity keeps environments similar. The failure appears because of how the app stores state, not because environments differ.
references:
  - title: Stateless Apps
    url: https://glossary.cncf.io/stateless-apps/
  - title: Horizontal Scaling
    url: https://glossary.cncf.io/horizontal-scaling/
