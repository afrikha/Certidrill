id: kcna-4b-lgtm-then-approve
objective: "4.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A pull request to the Kubernetes documentation has received `/lgtm` from a reviewer, and its tests pass.

    What else is needed before automation merges it?
body:
  options:
    - id: a
      text: { en: "A second `/lgtm` from another reviewer" }
    - id: b
      text: { en: "A vote of the SIG chairs in a public meeting" }
    - id: c
      text: { en: "An `/approve` comment from an approver" }
    - id: d
      text: { en: "A `/hold` comment from the pull request author" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Pull requests need a `/lgtm` from a reviewer, which vouches for technical quality, and an `/approve` from an approver, which gives holistic acceptance for that part of the project. When both are present, automation merges the pull request.
  options:
    a:
      en: "Reviewer status alone is not enough: the merge requires approval from an approver, not more reviews."
    b:
      en: "SIG chairs organize and facilitate their SIG; they do not vote on individual pull requests."
    d:
      en: "`/hold` blocks a merge instead of allowing it."
references:
  - title: "Roles and responsibilities"
    url: https://kubernetes.io/docs/contribute/participate/roles-and-responsibilities/
  - title: "Glossary"
    url: https://kubernetes.io/docs/reference/glossary/?all=true
