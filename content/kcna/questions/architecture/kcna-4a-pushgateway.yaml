id: kcna-4a-pushgateway
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A nightly service-level batch job runs for two minutes and exits, often before Prometheus scrapes it. Which Prometheus component lets the job's final metrics still be collected?
body:
  options:
    - id: a
      text: { en: "Pushgateway" }
    - id: b
      text: { en: "Alertmanager" }
    - id: c
      text: { en: "Node exporter" }
    - id: d
      text: { en: "Grafana" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Pushgateway exists for jobs that cannot be scraped. The short-lived job pushes its metrics to the Pushgateway before it exits, and Prometheus scrapes them from there. The Prometheus documentation says capturing the outcome of a service-level batch job is usually its only valid use case.
  options:
    b:
      en: |
        Alertmanager receives alerts fired by Prometheus and routes notifications. It does not collect metrics from jobs.
    c:
      en: |
        The node exporter exposes host-level metrics of Linux machines (CPU, disk, network). It does not keep the metrics of a job after the job exits.
    d:
      en: |
        Grafana builds dashboards on data sources such as Prometheus. It does not collect metrics from a batch job.
references:
  - title: When to use the Pushgateway
    url: https://prometheus.io/docs/practices/pushing/
  - title: Overview
    url: https://prometheus.io/docs/introduction/overview/
