id: kcna-4b-falco-runtime-threats
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security team wants real-time alerts when a running container shows abnormal behavior, detected from Linux kernel events.

    Which CNCF project provides this runtime threat detection?
body:
  options:
    - id: a
      text: { en: "Kyverno" }
    - id: b
      text: { en: "Harbor" }
    - id: c
      text: { en: "Prometheus" }
    - id: d
      text: { en: "Falco" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Falco is a graduated CNCF runtime security project. It applies rules to Linux kernel events (collected with eBPF) and other data sources to detect abnormal behavior and potential threats across hosts, containers and Kubernetes, and sends real-time alerts.
  options:
    a:
      en: "Kyverno is a policy engine that validates or mutates resources when they are admitted to the API server. It does not watch the behavior of running containers."
    b:
      en: "Harbor is a container registry that scans images for vulnerabilities before they run, not a runtime detection tool."
    c:
      en: "Prometheus collects and queries metrics. It does not analyze kernel events to detect threats."
references:
  - title: "Falco"
    url: https://falco.org/
  - title: "Falco"
    url: https://www.cncf.io/projects/falco/
