id: kcna-4b-persona-devsecops
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An organization wants to make security a shared responsibility of its development and operations teams, with automated security policies that guide developers towards compliance instead of blocking them.

    Which practice does it want to adopt?
body:
  options:
    - id: a
      text: { en: "Platform engineering" }
    - id: b
      text: { en: "Site reliability engineering" }
    - id: c
      text: { en: "GitOps" }
    - id: d
      text: { en: "DevSecOps" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      DevSecOps combines development, operations and security into one shared approach. It extends DevOps with security goals while keeping disruption to developer and operations workflows low, and its policies should guide developers to compliance rather than act as a blocker.
  options:
    a:
      en: "Platform engineering builds self-service tools for developers; adding security responsibility to every team is DevSecOps."
    b:
      en: "Site reliability engineering focuses on keeping applications reliable in production, not on sharing security responsibility."
    c:
      en: "GitOps delivers applications by continuously reconciling clusters with the desired state stored in Git. It is a delivery practice, not a security practice."
references:
  - title: "DevSecOps"
    url: https://glossary.cncf.io/devsecops/
