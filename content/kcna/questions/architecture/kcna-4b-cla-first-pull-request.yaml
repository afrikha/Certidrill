id: kcna-4b-cla-first-pull-request
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer opens a first pull request to a Kubernetes repository. A bot comments that the pull request cannot be accepted yet.

    What must the developer sign, as an individual or through an employer, before Kubernetes can accept the contribution?
body:
  options:
    - id: a
      text: { en: "The CNCF Contributor License Agreement (CLA)" }
    - id: b
      text: { en: "A CNCF membership agreement" }
    - id: c
      text: { en: "A non-disclosure agreement with the Linux Foundation" }
    - id: d
      text: { en: "The Kubernetes Steering Committee charter" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Kubernetes can only accept original source code from signatories of the Contributor License Agreement, which the CNCF defines in individual and corporate versions. The EasyCLA bot of the Linux Foundation posts the CLA status on the first pull request with a link to sign it.
  options:
    b:
      en: "CNCF membership is for organizations that join the foundation. Contributors do not need it to contribute."
    c:
      en: "Contributions to Kubernetes are public; no non-disclosure agreement is involved."
    d:
      en: "The Steering Committee charter governs that committee. Contributors do not sign it."
references:
  - title: "The Contributor License Agreement"
    url: https://github.com/kubernetes/community/blob/main/CLA.md
  - title: "Glossary"
    url: https://kubernetes.io/docs/reference/glossary/?all=true
