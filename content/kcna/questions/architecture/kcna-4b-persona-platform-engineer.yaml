id: kcna-4b-persona-platform-engineer
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team builds self-service tools and processes that hide infrastructure complexity, so that developers can deploy their services without setting up environments or configuring tools themselves.

    Which discipline does this team practice?
body:
  options:
    - id: a
      text: { en: "Site reliability engineering" }
    - id: b
      text: { en: "Application development" }
    - id: c
      text: { en: "Platform engineering" }
    - id: d
      text: { en: "Cluster operations" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Platform engineering builds tools and processes that empower developers, like a self-service station designed for their needs. It removes repetitive work such as environment setup and tool configuration by abstracting the infrastructure, so developers can focus on writing code.
  options:
    a:
      en: "Site reliability engineering keeps applications reliable in production through monitoring, alerting and automation; it is not about developer self-service."
    b:
      en: "Application developers are the consumers of the platform: they write the applications that run on it."
    d:
      en: "A cluster operator configures, controls and monitors clusters to keep them running. That is not the same as building self-service tooling for developers."
references:
  - title: "Platform Engineering"
    url: https://glossary.cncf.io/platform-engineering/
