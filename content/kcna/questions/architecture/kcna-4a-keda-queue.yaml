id: kcna-4a-keda-queue
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A worker Deployment processes messages from a message queue. You want its replica count to follow the number of waiting messages, using a ready-made scaler for that queue system, and to run zero replicas when the queue is empty. What should you use?
body:
  options:
    - id: a
      text: { en: "A HorizontalPodAutoscaler with a CPU utilization target" }
    - id: b
      text: { en: "A VerticalPodAutoscaler in `Recreate` mode" }
    - id: c
      text: { en: "A Cluster Autoscaler with a minimum of zero nodes" }
    - id: d
      text: { en: "KEDA with a scaler for the queue system" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      KEDA, a CNCF graduated project, scales workloads on the number of events to process, with built-in scalers for many queues and other event sources. A ScaledObject links the Deployment to the queue; KEDA activates it from zero to one replica and back, and feeds the queue metric to an HPA that scales from one to N.
  options:
    a:
      en: |
        CPU utilization does not reflect the number of waiting messages, and scale to zero is not available for resource metrics such as CPU: with no Pods running there is no CPU to measure.
    b:
      en: |
        The VPA changes the CPU and memory requests of Pods. It never changes the number of replicas.
    c:
      en: |
        The Cluster Autoscaler changes the number of nodes for pending Pods. It does not scale a Deployment on queue length.
references:
  - title: KEDA Concepts
    url: https://keda.sh/docs/latest/concepts/
  - title: Autoscaling Workloads
    url: https://kubernetes.io/docs/concepts/workloads/autoscaling/
