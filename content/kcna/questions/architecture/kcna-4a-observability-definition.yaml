id: kcna-4a-observability-definition
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    How does the CNCF Cloud Native Glossary describe observability?
body:
  options:
    - id: a
      text: { en: "A tool that collects metrics from cluster nodes and draws dashboards" }
    - id: b
      text: { en: "A retention policy that keeps every log line for audits and compliance" }
    - id: c
      text: { en: "A system property: how well the system produces actionable insights about its state" }
    - id: d
      text: { en: "A set of alerting rules that fire when known thresholds are crossed" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The glossary defines observability as a system property: the degree to which a system can generate actionable insights, so that operators understand its state from its outputs and take corrective action. Tools and signals support observability, but it is a quality of the system itself.
  options:
    a:
      en: |
        A metrics and dashboard tool (for example Prometheus with Grafana) is one way to observe a system. Observability is the property that makes such observation useful, not a product.
    b:
      en: |
        Keeping logs is a storage and compliance decision. Large amounts of stored data do not by themselves make a system observable.
    d:
      en: |
        Alerting on known thresholds is monitoring: it answers questions you anticipated. Observability also lets you investigate failures you did not anticipate.
references:
  - title: Observability
    url: https://glossary.cncf.io/observability/
