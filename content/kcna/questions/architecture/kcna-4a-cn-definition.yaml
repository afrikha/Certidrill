id: kcna-4a-cn-definition
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    According to the CNCF Cloud Native Definition, which characteristics describe the systems that cloud native practices produce?
body:
  options:
    - id: a
      text: { en: "Tightly coupled, stateful and manually operated" }
    - id: b
      text: { en: "Monolithic, vertically scaled and vendor-specific" }
    - id: c
      text: { en: "Loosely coupled, resilient, manageable and observable" }
    - id: d
      text: { en: "Hardware-bound, statically configured and patched in place" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The CNCF Cloud Native Definition (v1.1) characterizes cloud native systems as loosely coupled systems that interoperate securely and are resilient, manageable, sustainable and observable. Example approaches include containers, service meshes, microservices, immutable infrastructure, serverless and declarative APIs.
  options:
    a:
      en: |
        Tight coupling and manual operation are what cloud native practices move away from; the definition stresses loose coupling and automation.
    b:
      en: |
        Monoliths scaled vertically and tied to one vendor are the opposite of the portable, loosely coupled systems the definition describes.
    d:
      en: |
        Patching servers in place contradicts immutable infrastructure, one of the approaches the definition lists.
references:
  - title: toc/DEFINITION.md at main · cncf/toc · GitHub
    url: https://github.com/cncf/toc/blob/main/DEFINITION.md
