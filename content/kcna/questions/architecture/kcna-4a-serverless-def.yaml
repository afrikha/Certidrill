id: kcna-4a-serverless-def
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement correctly describes serverless computing?
body:
  options:
    - id: a
      text: { en: "Servers still exist, but the provider runs them and you pay only for what you use" }
    - id: b
      text: { en: "Applications run without any servers, directly on the users' own devices" }
    - id: c
      text: { en: "You reserve a fixed capacity in advance and pay for it even when it is idle" }
    - id: d
      text: { en: "Each team provisions and patches the virtual machines that run its code" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Serverless computing hides servers from the user: the provider manages the machines, resources scale automatically with demand, and you pay only for what you use, so idle services cost nothing. The physical servers still exist; they are just not your concern.
  options:
    b:
      en: |
        "Serverless" does not mean that no servers exist. The code still runs on the provider's servers, not on users' devices.
    c:
      en: |
        Reserving fixed capacity and paying for it whether you use it or not is the traditional IaaS model that serverless moves away from.
    d:
      en: |
        Provisioning and patching your own virtual machines is exactly the server management that serverless removes from the user.
references:
  - title: Serverless
    url: https://glossary.cncf.io/serverless/
