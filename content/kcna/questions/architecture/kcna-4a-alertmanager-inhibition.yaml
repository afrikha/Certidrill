id: kcna-4a-alertmanager-inhibition
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    When an alert reports that a whole cluster is unreachable, the on-call engineer also receives dozens of alerts about the cluster's individual components. Which Alertmanager feature suppresses the component alerts automatically while the cluster-level alert is firing?
body:
  options:
    - id: a
      text: { en: "Silences" }
    - id: b
      text: { en: "Grouping" }
    - id: c
      text: { en: "Inhibition" }
    - id: d
      text: { en: "Deduplication" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Inhibition suppresses notifications for some alerts while certain other alerts are already firing. The Alertmanager documentation uses this exact case: when a cluster is unreachable, alerts about its components are muted.
  options:
    a:
      en: |
        A silence mutes alerts that match its matchers for a fixed period, and someone creates it by hand in the Alertmanager web interface. It does not depend on whether another alert is firing.
    b:
      en: |
        Grouping combines related alerts into one notification. The component alerts would still be sent, only bundled together.
    d:
      en: |
        Deduplication removes repeated copies of the same alert. The component alerts are different alerts, so they would still be delivered.
references:
  - title: Alertmanager
    url: https://prometheus.io/docs/alerting/latest/alertmanager/
