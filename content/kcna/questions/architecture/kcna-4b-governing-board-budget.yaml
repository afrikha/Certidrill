id: kcna-4b-governing-board-budget
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The CNCF must approve its annual budget and decide how to market its events.

    Which body is responsible for these decisions?
body:
  options:
    - id: a
      text: { en: "The Technical Oversight Committee (TOC)" }
    - id: b
      text: { en: "TAG Operational Resilience" }
    - id: c
      text: { en: "The Governing Board" }
    - id: d
      text: { en: "The End User Technical Advisory Board" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The CNCF Governing Board is responsible for marketing, business oversight and budget decisions; it approves the annual budget and directs marketing, including events. It does not make technical decisions, which belong to the TOC.
  options:
    a:
      en: "The TOC provides technical leadership (technical vision, project admission). Budget and marketing belong to the Governing Board."
    b:
      en: "Technical Advisory Groups report to the TOC and bring expertise in a technical area. They do not control the budget."
    d:
      en: "The End User Technical Advisory Board represents end users and gives advisory recommendations. It does not approve the budget."
references:
  - title: "Cloud Native Computing Foundation (CNCF) Charter"
    url: https://github.com/cncf/foundation/blob/main/charter.md
  - title: "Graduated and Incubating Projects"
    url: https://www.cncf.io/projects/
