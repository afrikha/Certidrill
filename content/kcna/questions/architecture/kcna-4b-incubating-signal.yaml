id: kcna-4b-incubating-signal
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CNCF project is used successfully in production by a small number of users and has a healthy pool of contributors. Its APIs are becoming more stable, but it is not yet considered widely adopted.

    At which maturity level is this project?
body:
  options:
    - id: a
      text: { en: "Sandbox" }
    - id: b
      text: { en: "Archived" }
    - id: c
      text: { en: "Graduated" }
    - id: d
      text: { en: "Incubating" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Incubating projects are used successfully in production by a small number of users and have a healthy pool of contributors. At this stage change slows, APIs become more stable and versioned, and the TOC starts actively assessing adoption.
  options:
    a:
      en: "Sandbox projects are experimental and not yet widely tested in production."
    b:
      en: "Archived projects have reached the end of their lifecycle and are inactive."
    c:
      en: "Graduated projects are stable and widely adopted; this project is not yet widely adopted."
references:
  - title: "Graduated and Incubating Projects"
    url: https://www.cncf.io/projects/
  - title: "CNCF Project Lifecycle & Process"
    url: https://github.com/cncf/toc/blob/main/process/README.md
