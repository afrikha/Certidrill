id: kcna-4a-microservices-scale
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The search feature of an online store receives ten times more traffic than its other features. Which architecture lets the team deploy, update and scale the search function independently of the rest of the application?
body:
  options:
    - id: a
      text: { en: "A microservices architecture" }
    - id: b
      text: { en: "A monolithic architecture" }
    - id: c
      text: { en: "A tightly coupled architecture" }
    - id: d
      text: { en: "A single larger virtual machine" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A microservices architecture splits an application into separate services, each handling one function. Each service can be deployed, updated and scaled independently, so only the search service gets more replicas.
  options:
    b:
      en: |
        In a monolith all functions share one codebase and one deployment. A spike in one feature forces you to scale the whole application.
    c:
      en: |
        Tightly coupled components depend on each other's internals, so they cannot be deployed or scaled separately.
    d:
      en: |
        A bigger machine is vertical scaling of everything at once. It does not separate the search function from the rest.
references:
  - title: Microservices Architecture
    url: https://glossary.cncf.io/microservices-architecture/
