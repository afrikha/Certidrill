id: kcna-4b-dockershim-removal-reason
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Why could Kubernetes remove dockershim from the kubelet in v1.24?
body:
  options:
    - id: a
      text: { en: "Images built with Docker were not OCI images, so new clusters could not run them" }
    - id: b
      text: { en: "Docker Engine did not implement the CRI, and CRI runtimes such as containerd could replace it" }
    - id: c
      text: { en: "The CNCF archived Docker Engine, so Kubernetes could no longer depend on it" }
    - id: d
      text: { en: "The kubelet started to create containers itself, without any container runtime" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The CRI was created so that orchestrators can work with many runtimes. Docker Engine does not implement the CRI, so Kubernetes kept special code, dockershim, inside the kubelet. Once CRI runtimes such as containerd and CRI-O were available, this code could be removed; clusters that still want Docker Engine can use the external cri-dockerd adapter.
  options:
    a:
      en: "Images built with `docker build` work with all CRI implementations. The removal did not affect images."
    c:
      en: "Docker Engine is not a CNCF project and was not archived. The removal was about the interface the kubelet uses."
    d:
      en: "Every node still needs a container runtime: the kubelet uses the CRI to ask the runtime to run containers."
references:
  - title: "Updated: Dockershim Removal FAQ"
    url: https://kubernetes.io/blog/2022/02/17/dockershim-faq/
  - title: "Container Runtime Interface (CRI)"
    url: https://kubernetes.io/docs/concepts/architecture/cri/
