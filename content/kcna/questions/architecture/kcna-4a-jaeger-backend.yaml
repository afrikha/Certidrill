id: kcna-4a-jaeger-backend
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    OpenTelemetry generates and exports trace data but does not store it. Which CNCF graduated project is a distributed tracing back end that stores traces and lets you explore them?
body:
  options:
    - id: a
      text: { en: "Jaeger" }
    - id: b
      text: { en: "Fluentd" }
    - id: c
      text: { en: "Prometheus" }
    - id: d
      text: { en: "CoreDNS" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Jaeger is an open source, end-to-end distributed tracing system and a CNCF graduated project. OpenTelemetry is not an observability back end: it leaves storage and visualization to tools such as Jaeger for traces.
  options:
    b:
      en: |
        Fluentd is a data collector for a unified logging layer. It collects and routes logs; it is not a trace store.
    c:
      en: |
        Prometheus is a monitoring system and time series database for metrics. It does not store distributed traces.
    d:
      en: |
        CoreDNS serves DNS in Kubernetes clusters. It has nothing to do with tracing.
references:
  - title: What is OpenTelemetry?
    url: https://opentelemetry.io/docs/what-is-opentelemetry/
  - title: Jaeger | CNCF
    url: https://www.cncf.io/projects/jaeger/
