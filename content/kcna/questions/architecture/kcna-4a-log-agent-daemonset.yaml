id: kcna-4a-log-agent-daemonset
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You run a node-level logging agent, such as Fluent Bit, that reads the log files of every container on its node and ships them to a central back end. Which workload resource should run this agent?
body:
  options:
    - id: a
      text: { en: "Deployment" }
    - id: b
      text: { en: "StatefulSet" }
    - id: c
      text: { en: "DaemonSet" }
    - id: d
      text: { en: "Job" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A node-level logging agent must run once on every node, because each node holds the log files of its own containers. A DaemonSet runs one Pod per node and adds one automatically when a node joins the cluster. This is the approach the Kubernetes documentation recommends, and it needs no change to the applications.
  options:
    a:
      en: |
        A Deployment runs a number of interchangeable replicas wherever the scheduler places them. Some nodes could have no agent and others two.
    b:
      en: |
        A StatefulSet gives replicas stable identities and storage. It does not guarantee one Pod per node.
    d:
      en: |
        A Job runs Pods to completion. A logging agent must run continuously.
references:
  - title: Logging Architecture
    url: https://kubernetes.io/docs/concepts/cluster-administration/logging/
