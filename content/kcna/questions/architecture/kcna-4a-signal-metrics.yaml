id: kcna-4a-signal-metrics
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which telemetry signal is a numeric measurement captured at runtime, such as CPU usage or requests per second, and is best suited to dashboards and threshold alerts?
body:
  options:
    - id: a
      text: { en: "Logs" }
    - id: b
      text: { en: "Traces" }
    - id: c
      text: { en: "Baggage" }
    - id: d
      text: { en: "Metrics" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A metric is a numeric measurement of a service taken at runtime, recorded with a timestamp and metadata. Because metrics are compact numbers, they are cheap to store over time and are the usual input for dashboards and alerting rules.
  options:
    a:
      en: |
        Logs are timestamped records of discrete events, often text. You can count log lines, but a log is not itself a numeric measurement.
    b:
      en: |
        Traces describe the path of individual requests through services as a tree of spans. They explain where time is spent in one request, not a value plotted over time.
    c:
      en: |
        Baggage is contextual data that OpenTelemetry passes along with other signals between services. It is not a measurement.
references:
  - title: Signals
    url: https://opentelemetry.io/docs/concepts/signals/
  - title: Metrics
    url: https://opentelemetry.io/docs/concepts/signals/metrics/
