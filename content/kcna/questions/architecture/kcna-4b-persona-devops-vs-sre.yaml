id: kcna-4b-persona-devops-vs-sre
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    According to the CNCF Cloud Native Glossary, how does DevOps differ from site reliability engineering (SRE)?
body:
  options:
    - id: a
      text: { en: "DevOps keeps code working in production; SRE gets code to production" }
    - id: b
      text: { en: "DevOps is a set of CI/CD tools; SRE is a change in culture and team ownership" }
    - id: c
      text: { en: "DevOps focuses on getting code to production; SRE keeps it working in production" }
    - id: d
      text: { en: "DevOps builds self-service platforms for developers; SRE writes product features" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DevOps is a methodology in which teams own the whole process from development to production operations, which requires a shift in culture and processes; its focus is getting code to production. SRE ensures that the code running in production works properly, by monitoring, alerting and automating operations.
  options:
    a:
      en: "This reverses the two: DevOps focuses on getting code to production, and SRE on keeping it working in production."
    b:
      en: "DevOps is mainly a change in culture and processes, not a set of tools; SRE is an engineering discipline for operations."
    d:
      en: "Building self-service platforms is platform engineering, and SREs specifically build systems to run applications instead of product features."
references:
  - title: "Site Reliability Engineering"
    url: https://glossary.cncf.io/site-reliability-engineering/
  - title: "DevOps"
    url: https://glossary.cncf.io/devops/
