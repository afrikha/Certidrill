id: kcna-4b-code-of-conduct-report
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A participant sees a contributor harassing others in a Kubernetes community channel.

    Which group handles this incident?
body:
  options:
    - id: a
      text: { en: "The Security Response Committee" }
    - id: b
      text: { en: "The Kubernetes Code of Conduct Committee" }
    - id: c
      text: { en: "SIG Contributor Experience" }
    - id: d
      text: { en: "The CNCF Governing Board" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes follows the CNCF Code of Conduct, which aims at a harassment-free experience for everyone in project and community spaces. Incidents in the Kubernetes community are reported to the Kubernetes Code of Conduct Committee, one of the project's committees for sensitive topics.
  options:
    a:
      en: "The Security Response Committee handles security vulnerabilities, not conduct incidents."
    c:
      en: "SIG Contributor Experience improves the contributor experience in general; conduct incidents go to the Code of Conduct Committee."
    d:
      en: "The Governing Board handles the CNCF budget and business, not conduct incidents."
references:
  - title: "CNCF Community Code of Conduct"
    url: https://github.com/cncf/foundation/blob/main/code-of-conduct.md
  - title: "Community Groups"
    url: https://github.com/kubernetes/community/blob/master/sig-list.md
