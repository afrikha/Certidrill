id: kcna-4b-cncf-linux-foundation
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Cloud Native Computing Foundation (CNCF) is part of which nonprofit organization?
body:
  options:
    - id: a
      text: { en: "The Apache Software Foundation" }
    - id: b
      text: { en: "The Open Container Initiative" }
    - id: c
      text: { en: "The Open Source Security Foundation (OpenSSF)" }
    - id: d
      text: { en: "The Linux Foundation" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The CNCF is part of the nonprofit Linux Foundation. Its mission is to make cloud native computing ubiquitous by fostering an ecosystem of open source, vendor-neutral projects such as Kubernetes, Prometheus and Envoy.
  options:
    a:
      en: "The Apache Software Foundation is a separate open source foundation. It does not host the CNCF."
    b:
      en: "The Open Container Initiative is a project that publishes container image and runtime specifications. It does not host the CNCF."
    c:
      en: "OpenSSF is a separate foundation focused on open source security; the CNCF is not part of it. CNCF graduation requires the OpenSSF Best Practices badge, but that is a criterion, not a parent organization."
references:
  - title: "Who We Are"
    url: https://www.cncf.io/about/who-we-are/
