id: kcna-4a-vpa-identify
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which autoscaler adjusts the CPU and memory requests of a workload's Pods to match their observed usage, instead of changing the number of replicas?
body:
  options:
    - id: a
      text: { en: "HorizontalPodAutoscaler" }
    - id: b
      text: { en: "Cluster Autoscaler" }
    - id: c
      text: { en: "VerticalPodAutoscaler" }
    - id: d
      text: { en: "Cluster Proportional Autoscaler" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The VerticalPodAutoscaler adjusts resource requests and limits to match actual usage (right-sizing). Unlike the HPA, it is not part of core Kubernetes: it is an add-on, defined with a CustomResourceDefinition, that you install along with a metrics source such as metrics-server.
  options:
    a:
      en: |
        The HPA scales horizontally: it changes the number of replicas and leaves each Pod's requests unchanged.
    b:
      en: |
        The Cluster Autoscaler adds and removes nodes. It does not modify Pod requests.
    d:
      en: |
        The Cluster Proportional Autoscaler changes the replica count of a workload in proportion to the number of nodes and cores in the cluster, not according to observed usage.
references:
  - title: Vertical Pod Autoscaling
    url: https://kubernetes.io/docs/concepts/workloads/autoscaling/vertical-pod-autoscale/
  - title: Autoscaling Workloads
    url: https://kubernetes.io/docs/concepts/workloads/autoscaling/
