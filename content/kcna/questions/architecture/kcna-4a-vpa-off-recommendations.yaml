id: kcna-4a-vpa-off-recommendations
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers set CPU and memory requests by guesswork, so nodes are full of reserved but unused capacity. You want right-sizing recommendations based on observed usage, without the autoscaler changing or evicting any running Pod. What should you use?
body:
  options:
    - id: a
      text: { en: "A VerticalPodAutoscaler with `updateMode: \"Off\"`" }
    - id: b
      text: { en: "A VerticalPodAutoscaler with `updateMode: \"Recreate\"`" }
    - id: c
      text: { en: "A HorizontalPodAutoscaler with a CPU utilization target" }
    - id: d
      text: { en: "A ResourceQuota in each application namespace" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In `Off` mode, the VPA recommender still analyzes resource usage and stores target, lower-bound and upper-bound recommendations in the object's status, but nothing is applied to Pods. Teams can then right-size requests themselves. The VPA is an add-on and needs a metrics source such as metrics-server.
  options:
    b:
      en: |
        In `Recreate` mode the VPA evicts Pods whose requests differ significantly from the recommendation so that they restart with new requests, which the requirement forbids.
    c:
      en: |
        An HPA changes the number of replicas based on utilization relative to requests. It does not recommend better request values.
    d:
      en: |
        A ResourceQuota caps the total resources a namespace can request. It limits consumption but gives no recommendations.
references:
  - title: Vertical Pod Autoscaling
    url: https://kubernetes.io/docs/concepts/workloads/autoscaling/vertical-pod-autoscale/
