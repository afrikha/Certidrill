id: kcna-4b-toc-approves-projects
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which CNCF body defines the technical vision of the foundation and approves new projects?
body:
  options:
    - id: a
      text: { en: "The Technical Oversight Committee (TOC)" }
    - id: b
      text: { en: "The Governing Board" }
    - id: c
      text: { en: "The End User Technical Advisory Board" }
    - id: d
      text: { en: "The Kubernetes Steering Committee" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Technical Oversight Committee is the technical governing body of the CNCF. It defines and maintains the technical vision, approves new projects within the scope set by the Governing Board, aligns projects and can archive them.
  options:
    b:
      en: "The Governing Board handles marketing, business oversight and budget. The charter says it does not make technical decisions, apart from setting the scope with the TOC."
    c:
      en: "The End User Technical Advisory Board is the voice of end users and its recommendations are advisory only. It does not admit projects."
    d:
      en: "The Kubernetes Steering Committee oversees the governance of the Kubernetes project only, not the CNCF as a whole."
references:
  - title: "CNCF Technical Oversight Committee (TOC)"
    url: https://github.com/cncf/toc/blob/main/README.md
  - title: "Cloud Native Computing Foundation (CNCF) Charter"
    url: https://github.com/cncf/foundation/blob/main/charter.md
