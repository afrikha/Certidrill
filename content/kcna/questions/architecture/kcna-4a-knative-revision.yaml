id: kcna-4a-knative-revision
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Knative Serving, each change to the code or configuration of a Knative Service creates a new immutable, point-in-time snapshot of that code and configuration. What is this resource called?
body:
  options:
    - id: a
      text: { en: "Route" }
    - id: b
      text: { en: "Configuration" }
    - id: c
      text: { en: "Broker" }
    - id: d
      text: { en: "Revision" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Revision is an immutable, point-in-time snapshot of the code and configuration for each change. Revisions scale up and down with incoming traffic, and older Revisions stay available so traffic can be routed back to them.
  options:
    a:
      en: |
        A Route maps a network endpoint to one or more Revisions and decides how traffic is split between them. It is not the snapshot itself.
    b:
      en: |
        A Configuration holds the desired, current state of the deployment. Changing it creates a new Revision; the Configuration itself is updated, not frozen.
    c:
      en: |
        A Broker belongs to Knative Eventing: producers send events to it and Triggers deliver them to consumers. It is not part of Serving.
references:
  - title: Knative Serving
    url: https://knative.dev/docs/serving/
