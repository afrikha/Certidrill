id: kcna-4a-log-stdout
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Where should a containerized application write its logs so that the container runtime captures them and `kubectl logs` can show them?
body:
  options:
    - id: a
      text: { en: "To a file in the container's writable layer" }
    - id: b
      text: { en: "To the standard output and standard error streams" }
    - id: c
      text: { en: "To a ConfigMap that is mounted as a volume" }
    - id: d
      text: { en: "To Event objects created through the Kubernetes API" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Writing to stdout and stderr is the easiest and most widely adopted logging method for containerized applications. The container runtime redirects these streams to log files on the node, and `kubectl logs` reads them through the kubelet.
  options:
    a:
      en: |
        A file inside the container is not captured by the runtime, so `kubectl logs` does not show it, and it disappears with the container.
    c:
      en: |
        ConfigMaps hold configuration data, and a ConfigMap volume is read-only for the container. They are not a log destination.
    d:
      en: |
        Events record state changes of cluster objects and expire quickly. They are not designed to hold application log output.
references:
  - title: Logging Architecture
    url: https://kubernetes.io/docs/concepts/cluster-administration/logging/
