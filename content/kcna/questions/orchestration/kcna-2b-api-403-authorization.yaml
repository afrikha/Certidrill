id: kcna-2b-api-403-authorization
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user runs a `kubectl` command and gets this error:

    ```text
    Error from server (Forbidden): deployments.apps "web" is forbidden:
    User "dana@example.com" cannot delete resource "deployments" in API
    group "apps" in the namespace "shop"
    ```

    Which stage of request processing denied the request?
body:
  options:
    - id: a
      text: { en: "Authentication" }
    - id: b
      text: { en: "Authorization" }
    - id: c
      text: { en: "Admission control" }
    - id: d
      text: { en: "The kubelet on the node" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `Forbidden` (HTTP 403) means that the caller was identified but no authorization module, such as RBAC, allowed the verb `delete` on `deployments` in namespace `shop`. The fix is a binding to a Role or ClusterRole that grants the missing permission.
  options:
    a:
      en: |
        The message names the user `dana@example.com`, so authentication succeeded. An authentication failure returns `401 Unauthorized`.
    c:
      en: |
        Admission control runs only after a request has been authorized. "Cannot delete resource" with `Forbidden` is the result of authorization.
    d:
      en: |
        The kubelet doesn't decide who may call the API. The kube-apiserver evaluates the request before anything is changed in the cluster.
references:
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
  - title: "Controlling Access to the Kubernetes API"
    url: https://kubernetes.io/docs/concepts/security/controlling-access/
