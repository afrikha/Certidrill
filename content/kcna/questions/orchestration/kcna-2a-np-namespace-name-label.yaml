id: kcna-2a-np-namespace-name-label
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A NetworkPolicy must allow ingress from all Pods of the namespace `monitoring`. Nobody added labels to that namespace. Which label can the policy's `namespaceSelector` match?
body:
  options:
    - id: a
      text: { en: "`kubernetes.io/metadata.name: monitoring`" }
    - id: b
      text: { en: "`app.kubernetes.io/name: monitoring`" }
    - id: c
      text: { en: "`kubernetes.io/service-name: monitoring`" }
    - id: d
      text: { en: "`kubernetes.io/hostname: monitoring`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A NetworkPolicy can't name a namespace directly; it selects namespaces by label. The control plane sets the immutable label `kubernetes.io/metadata.name` on every namespace, with the namespace's name as its value, so it can select one namespace by name.
  options:
    b:
      en: |
        `app.kubernetes.io/name` is a recommended label that users put on their applications. Kubernetes doesn't set it on namespaces.
    c:
      en: |
        `kubernetes.io/service-name` is the label that links EndpointSlices to their Service, not a namespace label.
    d:
      en: |
        `kubernetes.io/hostname` is a node label that holds the node's host name.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
