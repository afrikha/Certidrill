id: kcna-2d-pvc-no-matching-pv
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster has no dynamic provisioning. An administrator pre-created several PersistentVolumes of 50Gi each. A user creates a PersistentVolumeClaim that requests 100Gi.

    What happens to the claim?
body:
  options:
    - id: a
      text: { en: "It is bound to two 50Gi PersistentVolumes" }
    - id: b
      text: { en: "It is bound to one 50Gi PersistentVolume with a warning" }
    - id: c
      text: { en: "It stays unbound until a matching volume exists" }
    - id: d
      text: { en: "It is rejected by the API server at creation" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Claims remain unbound (`Pending`) indefinitely if no matching volume exists, and are bound as soon as one becomes available. A 100Gi claim never matches a 50Gi volume, because the user always gets at least the requested size.
  options:
    a:
      en: |
        Binding is a one-to-one mapping between one claim and one PersistentVolume. Kubernetes never combines several volumes to satisfy a claim.
    b:
      en: |
        A claim is only bound to a volume at least as large as the request. A smaller volume is never used.
    d:
      en: |
        The claim is valid and is accepted by the API server. Finding a volume is the job of a control loop that runs after creation.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
