id: kcna-2b-security-phase-distribute
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Kubernetes documentation groups cloud native security controls by lifecycle phase: Develop, Distribute, Deploy and Runtime. To which phase do image vulnerability scanning and a private registry that restricts who can pull images belong?
body:
  options:
    - id: a
      text: { en: "Develop" }
    - id: b
      text: { en: "Deploy" }
    - id: c
      text: { en: "Runtime" }
    - id: d
      text: { en: "Distribute" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Distribute phase secures the supply chain of container images and cluster components: scanning images and artifacts for known vulnerabilities, keeping dependencies up to date, and keeping images in a private registry that only authorized clients can pull from.
  options:
    a:
      en: |
        Develop is about secure development environments and application design: code review, threat modeling, fuzzing.
    b:
      en: |
        Deploy is about what can be deployed, by whom and where, for example verifying the identity of image artifacts at deployment and isolating with namespaces.
    c:
      en: |
        Runtime is about the running cluster: API access control, Pod Security Standards, network policies, encryption at rest and observability.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
