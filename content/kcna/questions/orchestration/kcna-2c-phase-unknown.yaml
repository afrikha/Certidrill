id: kcna-2c-phase-unknown
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Pod phase means that the state of the Pod could not be obtained, typically because of an error in communicating with the node where it should be running?
body:
  options:
    - id: a
      text: { en: "`Pending`" }
    - id: b
      text: { en: "`Unknown`" }
    - id: c
      text: { en: "`Failed`" }
    - id: d
      text: { en: "`Terminating`" }
answer: { optionId: b }
explanation:
  correct:
    en: "The `Unknown` phase is used when the state of the Pod cannot be obtained, typically because the control plane cannot communicate with the Pod's node. Check the node's status with `kubectl get nodes` and `kubectl describe node`."
  options:
    a:
      en: "`Pending` means the Pod was accepted but its containers are not set up and running yet, for example while it waits to be scheduled or while images are downloaded."
    c:
      en: "`Failed` means every container has terminated and at least one ended in failure. It is a known final state, not a state that could not be read."
    d:
      en: "`Terminating` is shown by kubectl for a Pod that is being deleted. It is not a Pod phase."
references:
  - title: Pod Lifecycle
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
