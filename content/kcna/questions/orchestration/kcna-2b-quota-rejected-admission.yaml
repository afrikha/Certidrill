id: kcna-2b-quota-rejected-admission
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    User `dana` has a RoleBinding that allows her to create Pods in namespace `shop`. Her new Pod is rejected because it would exceed the ResourceQuota of the namespace. Which stage of request processing rejected it?
body:
  options:
    - id: a
      text: { en: "Authorization" }
    - id: b
      text: { en: "Authentication" }
    - id: c
      text: { en: "Admission control" }
    - id: d
      text: { en: "The kubelet, when it starts the containers" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      ResourceQuota is enforced by the ResourceQuota admission controller, which runs after authentication and authorization and before the object is stored. Admission controllers see the content of the object, so they can reject a request that RBAC allowed.
  options:
    a:
      en: |
        Authorization succeeded: RBAC allows dana to create Pods in `shop`. Authorization checks the verb, resource and namespace, not the resources requested in the Pod spec.
    b:
      en: |
        Authentication identified dana. A failure at that stage would return `401 Unauthorized`.
    d:
      en: |
        The quota is checked by the API server before the Pod is stored. A rejected Pod never reaches the scheduler or a kubelet.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
  - title: "Controlling Access to the Kubernetes API"
    url: https://kubernetes.io/docs/concepts/security/controlling-access/
