id: kcna-2b-supply-registry-policy
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Pods in every namespace must use only images from `registry.example.com`. Any other Pod must be rejected when it is created. What should you use?
body:
  options:
    - id: a
      text: { en: "An admission policy, for example with Kyverno or OPA Gatekeeper" }
    - id: b
      text: { en: "An RBAC Role that allows only images from that registry" }
    - id: c
      text: { en: "A NetworkPolicy that blocks egress to other registries" }
    - id: d
      text: { en: "The Restricted profile of the Pod Security Standards" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Admission controllers see the content of the object being created, so a policy engine running as a validating admission webhook can check every container image and reject Pods that use other registries. The built-in ValidatingAdmissionPolicy (CEL) could also express this rule.
  options:
    b:
      en: |
        RBAC authorizes verbs on resources. It can't inspect field values such as image names.
    c:
      en: |
        Images are pulled by the node's container runtime, not by the Pod, and a NetworkPolicy never rejects a Pod at creation.
    d:
      en: |
        The Restricted profile checks security settings such as privileges and capabilities. It has no rule about registries.
references:
  - title: "OPA for Kubernetes Admission Control"
    url: https://www.openpolicyagent.org/docs/kubernetes
  - title: "Introduction"
    url: https://kyverno.io/docs/introduction/
