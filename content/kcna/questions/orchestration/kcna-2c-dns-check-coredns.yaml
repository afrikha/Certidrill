id: kcna-2c-dns-check-coredns
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    From any Pod in the cluster, the following command now fails, while it worked yesterday:

    ```bash
    nslookup kubernetes.default
    ```

    Connections to Service ClusterIP addresses still work. What should you check next?
body:
  options:
    - id: a
      text: { en: "Whether the CoreDNS Pods in `kube-system` are running" }
    - id: b
      text: { en: "Whether the Ingress controller Pods are running" }
    - id: c
      text: { en: "Whether the `kubernetes` Service has the right `targetPort`" }
    - id: d
      text: { en: "Whether the nodes report the `DiskPressure` condition" }
answer: { optionId: a }
explanation:
  correct:
    en: "`kubernetes.default` should always resolve. If it fails from every Pod while ClusterIP traffic works, the cluster DNS is the problem: check the CoreDNS Pods (`kubectl get pods -n kube-system -l k8s-app=kube-dns`), their logs, and the `kube-dns` Service and its endpoints."
  options:
    b:
      en: "An Ingress controller handles HTTP traffic entering the cluster. It does not answer DNS queries from Pods."
    c:
      en: "Name resolution does not use the Service's ports. Connections to ClusterIPs work, so the Service definitions are not the issue."
    d:
      en: "`DiskPressure` means a node is low on disk space; the kubelet may evict Pods. It does not explain DNS failing from every Pod while other traffic works."
references:
  - title: Debugging DNS Resolution
    url: https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
