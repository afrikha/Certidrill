id: kcna-2d-empty-class-string
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster has a default StorageClass. A user creates the following claim:

    ```yaml
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: legacy-data
    spec:
      storageClassName: ""
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
    ```

    How is this claim satisfied?
body:
  options:
    - id: a
      text: { en: "The default StorageClass provisions a new volume" }
    - id: b
      text: { en: "Any available volume of any class is bound" }
    - id: c
      text: { en: "Only a pre-created volume with no class can be bound" }
    - id: d
      text: { en: "The API server rejects the empty class name" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `storageClassName: ""` always means a request for a volume with no class. It disables dynamic provisioning for this claim, which can only bind to existing PersistentVolumes that have no class. The control plane does not replace it with the default class.
  options:
    a:
      en: |
        The default class is applied only to claims that omit `storageClassName`. An empty string is an explicit choice of "no class".
    b:
      en: |
        A volume of a particular class can only be bound to claims that request that class.
    d:
      en: |
        The empty string is a valid, documented value used to opt out of dynamic provisioning.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  - title: Storage Classes
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
