id: kcna-2d-allow-volume-expansion
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A user wants to grow a bound claim from 10Gi to 20Gi by editing `spec.resources.requests.storage` in the PersistentVolumeClaim. The volume was provisioned by a CSI driver that supports expansion.

    Which setting must the claim's StorageClass have?
body:
  options:
    - id: a
      text: { en: "`volumeBindingMode: WaitForFirstConsumer`" }
    - id: b
      text: { en: "`allowVolumeExpansion: true`" }
    - id: c
      text: { en: "`reclaimPolicy: Retain`" }
    - id: d
      text: { en: "`allowedTopologies` with the volume's zone" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A claim can only be expanded if its StorageClass sets `allowVolumeExpansion` to `true`. Editing the claim with a larger size then expands the existing volume; no new PersistentVolume is created. Shrinking a claim below its current size is not supported.
  options:
    a:
      en: |
        The binding mode controls when a volume is bound and provisioned. It does not allow resizing.
    c:
      en: |
        The reclaim policy applies when the claim is deleted. It has no effect on resizing.
    d:
      en: |
        `allowedTopologies` restricts where volumes can be provisioned. It does not enable expansion.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
