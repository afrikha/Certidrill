id: kcna-2a-mesh-mtls
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which service mesh feature encrypts traffic between services and lets each side verify the identity of the other workload, without changes to the application code?
body:
  options:
    - id: a
      text: { en: "NetworkPolicy" }
    - id: b
      text: { en: "Base64 encoding of Secrets" }
    - id: c
      text: { en: "TLS termination at an Ingress" }
    - id: d
      text: { en: "Mutual TLS (mTLS)" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With mutual TLS, the proxies on the client side and the server side both present certificates, so traffic is encrypted and both workloads are authenticated. The mesh control plane acts as a certificate authority: in Istio, istiod signs workload certificates that encode the service identity and rotates them automatically.
  options:
    a:
      en: |
        NetworkPolicy allows or denies traffic by IP address and port. It neither encrypts traffic nor verifies identities.
    b:
      en: |
        Base64 is an encoding, not encryption, and it concerns stored Secret data, not traffic between services.
    c:
      en: |
        An Ingress terminates TLS for clients outside the cluster; traffic from the Ingress to the Services and Pods is plaintext.
references:
  - title: "Security"
    url: https://istio.io/latest/docs/concepts/security/
