id: kcna-2a-dns-headless
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Review this Service:

    ```yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: cache
      namespace: shop
    spec:
      clusterIP: None
      selector:
        app: cache
      ports:
      - port: 6379
    ```

    What does a DNS lookup of `cache.shop.svc.cluster.local` return?
body:
  options:
    - id: a
      text: { en: "One virtual IP address that kube-proxy balances across the Pods" }
    - id: b
      text: { en: "A CNAME record that points to an external host name" }
    - id: c
      text: { en: "The IP addresses of the nodes where the selected Pods run" }
    - id: d
      text: { en: "The IP addresses of the Pods that the Service selects" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `clusterIP: None` makes the Service headless: no cluster IP, no load balancing and no proxying. The DNS returns A or AAAA records with the IP addresses of the Pods behind the Service, and the client chooses which one to use.
  options:
    a:
      en: |
        A virtual IP address is what a normal ClusterIP Service gets. With `clusterIP: None`, no cluster IP is allocated and kube-proxy ignores the Service.
    b:
      en: |
        A CNAME record is returned for an ExternalName Service, not for a headless Service with a selector.
    c:
      en: |
        DNS records of a headless Service point directly to the Pods, not to their nodes.
references:
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
  - title: "DNS for Services and Pods"
    url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
