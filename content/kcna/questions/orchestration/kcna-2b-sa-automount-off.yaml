id: kcna-2b-sa-automount-off
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod never calls the Kubernetes API. To reduce risk, you don't want a ServiceAccount token to be mounted into it. What should you set in the Pod spec?
body:
  options:
    - id: a
      text: { en: "`enableServiceLinks: false`" }
    - id: b
      text: { en: "`automountServiceAccountToken: false`" }
    - id: c
      text: { en: "`hostNetwork: false`" }
    - id: d
      text: { en: "`readOnlyRootFilesystem: true` in the container's securityContext" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `automountServiceAccountToken: false` on the Pod (or on its ServiceAccount) stops the API token from being mounted. If both set it, the Pod's value takes precedence.
  options:
    a:
      en: |
        `enableServiceLinks` only controls whether information about Services is injected as environment variables.
    c:
      en: |
        `hostNetwork` decides whether the Pod uses the node's network namespace. It has nothing to do with API tokens.
    d:
      en: |
        A read-only root filesystem prevents writes inside the container. The token volume would still be mounted.
references:
  - title: "Configure Service Accounts for Pods"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
