id: kcna-2b-rbac-rolebinding-clusterrole
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You apply this manifest:

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: dev-view
      namespace: dev
    subjects:
    - kind: User
      name: lee@example.com
      apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: ClusterRole
      name: view
      apiGroup: rbac.authorization.k8s.io
    ```

    Where can `lee@example.com` read objects through this binding?
body:
  options:
    - id: a
      text: { en: "In every namespace of the cluster" }
    - id: b
      text: { en: "Nowhere, because a RoleBinding can't reference a ClusterRole" }
    - id: c
      text: { en: "In `dev` and on cluster-scoped resources such as nodes" }
    - id: d
      text: { en: "Only in the namespace `dev`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a RoleBinding references a ClusterRole, the ClusterRole's rules are granted only within the namespace of the RoleBinding. Lee can read most objects in `dev` and nothing in other namespaces.
  options:
    a:
      en: |
        Only a ClusterRoleBinding grants a ClusterRole in every namespace.
    b:
      en: |
        A RoleBinding may reference a ClusterRole. It is the usual way to reuse one set of rules in several namespaces.
    c:
      en: |
        A RoleBinding never grants access to cluster-scoped resources. That requires a ClusterRoleBinding.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
