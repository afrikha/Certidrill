id: kcna-2b-sa-change-running-pods
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Pods of the Deployment `api` in namespace `shop` run as the `default` ServiceAccount. They must run as the ServiceAccount `api-sa` instead. What should you do?
body:
  options:
    - id: a
      text: { en: "Edit each running Pod and set `spec.serviceAccountName` to `api-sa`" }
    - id: b
      text: { en: "Bind the roles of `api-sa` to the `default` ServiceAccount of `shop`" }
    - id: c
      text: { en: "Set `serviceAccountName: api-sa` in the Pod template of the Deployment" }
    - id: d
      text: { en: "Set `automountServiceAccountToken: false` on the `default` ServiceAccount" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The ServiceAccount of a Pod can only be set when the Pod is created. Changing it in the Deployment's Pod template triggers a rollout that replaces the Pods with new ones that run as `api-sa`.
  options:
    a:
      en: |
        `spec.serviceAccountName` can't be updated on a Pod that already exists, so the edit is refused.
    b:
      en: |
        The Pods would still run as `default`, and every other Pod of `shop` that uses `default` would get the same permissions.
    d:
      en: |
        This only stops the token of `default` from being mounted. The Pods would still run as `default`, without a token.
references:
  - title: "Configure Service Accounts for Pods"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
