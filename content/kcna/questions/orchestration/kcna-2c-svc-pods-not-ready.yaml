id: kcna-2c-svc-pods-not-ready
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The selector of the Service `web` matches the labels of its three Pods, but the Service receives no traffic. `kubectl get pods` shows:

    ```text
    NAME          READY   STATUS    RESTARTS   AGE
    web-5f9c-a1   0/1     Running   0          12m
    web-5f9c-b2   0/1     Running   0          12m
    web-5f9c-c3   0/1     Running   0          12m
    ```

    What is the most likely cause?
body:
  options:
    - id: a
      text: { en: "The containers' liveness probe is failing." }
    - id: b
      text: { en: "The Pods are still waiting to be scheduled." }
    - id: c
      text: { en: "The containers' readiness probe is failing." }
    - id: d
      text: { en: "The image of the containers cannot be pulled." }
answer: { optionId: c }
explanation:
  correct:
    en: "The containers run (STATUS Running, no restarts) but are not ready (READY 0/1). A failing readiness probe marks a container as not ready, and the Pod's IP is removed from the Service's EndpointSlices, so the Service has no ready endpoint. `kubectl describe pod` shows the `Readiness probe failed` events."
  options:
    a:
      en: "A failing liveness probe makes the kubelet restart the container, so the RESTARTS count would grow. It is 0 for all three Pods."
    b:
      en: "Unscheduled Pods are in the Pending phase. These Pods are Running, so they were scheduled and their containers started."
    d:
      en: "Without an image the container cannot start, and the status would be `ImagePullBackOff` or `ErrImagePull`, not Running."
references:
  - title: Liveness, Readiness, and Startup Probes
    url: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
