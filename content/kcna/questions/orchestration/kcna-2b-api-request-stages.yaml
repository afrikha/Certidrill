id: kcna-2b-api-request-stages
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In which order does the kube-apiserver process a request to create a Pod?
body:
  options:
    - id: a
      text: { en: "Authentication, authorization, admission control, then storage in etcd" }
    - id: b
      text: { en: "Authorization, authentication, admission control, then storage in etcd" }
    - id: c
      text: { en: "Admission control, authentication, authorization, then storage in etcd" }
    - id: d
      text: { en: "Authentication, admission control, authorization, then storage in etcd" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The API server first authenticates the caller (who is it?), then authorizes the request (may this identity create Pods in this namespace?), then runs the admission controllers (is this object acceptable, does it need changes?). Only then is the object validated against its schema and written to etcd.
  options:
    b:
      en: |
        Authorization needs to know who is calling, so it always runs after authentication has identified the user.
    c:
      en: |
        Admission control only sees requests that are already authenticated and authorized. It is the last stage before the object is validated and stored.
    d:
      en: |
        Authorization comes before admission control: the API server first checks that the identity may perform the verb on the resource, then admission controllers inspect the object itself.
references:
  - title: "Controlling Access to the Kubernetes API"
    url: https://kubernetes.io/docs/concepts/security/controlling-access/
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
