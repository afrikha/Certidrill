id: kcna-2b-supply-sbom
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After a critical CVE is published, a security team wants to find quickly which of its container images include the affected library version, without pulling and inspecting each image. What should the build pipeline produce for every image?
body:
  options:
    - id: a
      text: { en: "A cosign signature" }
    - id: b
      text: { en: "A software bill of materials (SBOM)" }
    - id: c
      text: { en: "An image digest" }
    - id: d
      text: { en: "A Kyverno policy report" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An SBOM lists the components of an image, such as packages and libraries with their versions, in a standard format such as SPDX. Searching the SBOMs for the affected version shows which images need a fix. The Kubernetes project itself publishes signed SPDX SBOMs with its releases.
  options:
    a:
      en: |
        A signature proves who built the image and that it hasn't changed. It doesn't list what the image contains.
    c:
      en: |
        A digest identifies one image manifest. It says nothing about the libraries inside the image.
    d:
      en: |
        A policy report lists the results of policy checks on cluster resources, not the components of each image.
references:
  - title: "Verify Signed Kubernetes Artifacts"
    url: https://kubernetes.io/docs/tasks/administer-cluster/verify-signed-artifacts/
