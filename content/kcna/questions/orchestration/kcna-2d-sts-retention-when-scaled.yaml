id: kcna-2d-sts-retention-when-scaled
objective: "2.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A StatefulSet runs short-lived test databases. When it is scaled down, the claims of the removed replicas must be deleted automatically. When the StatefulSet itself is deleted, all claims must be kept.

    Which setting meets these requirements?
body:
  options:
    - id: a
      text: { en: "`persistentVolumeClaimRetentionPolicy.whenDeleted: Delete`" }
    - id: b
      text: { en: "`reclaimPolicy: Delete` in the StorageClass" }
    - id: c
      text: { en: "`persistentVolumeClaimRetentionPolicy.whenScaled: Delete`" }
    - id: d
      text: { en: "`podManagementPolicy: Parallel`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `whenScaled: Delete` deletes the claims created from `volumeClaimTemplates` for the Pods removed when the replica count is reduced. `whenDeleted` keeps its default, `Retain`, so all claims survive the deletion of the StatefulSet. The field is stable since v1.32.
  options:
    a:
      en: |
        `whenDeleted` applies when the StatefulSet is deleted, which is exactly when the claims must be kept. It does nothing on scale-down.
    b:
      en: |
        The reclaim policy acts on the PersistentVolume after its claim is deleted. It never deletes the claim itself.
    d:
      en: |
        `podManagementPolicy: Parallel` starts and stops Pods in parallel instead of in order. It does not change what happens to the claims.
references:
  - title: StatefulSets
    url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
