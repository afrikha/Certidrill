id: kcna-2b-sa-create-token
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A deployment script running outside the cluster must call the API as the ServiceAccount `deployer` in namespace `ci`, using a short-lived token. Which command gets the token?
body:
  options:
    - id: a
      text: { en: "`kubectl create serviceaccount deployer -n ci`" }
    - id: b
      text: { en: "`kubectl get serviceaccount deployer -n ci -o yaml`" }
    - id: c
      text: { en: "`kubectl create secret generic deployer-token -n ci`" }
    - id: d
      text: { en: "`kubectl create token deployer -n ci`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kubectl create token` requests a time-limited token for the ServiceAccount from the TokenRequest API; `--duration` asks for a different lifetime. Short-lived tokens are preferred to long-lived token Secrets.
  options:
    a:
      en: |
        This creates the ServiceAccount. It doesn't issue a token.
    b:
      en: |
        The ServiceAccount object contains no token, and no token Secret is created for it automatically since v1.24.
    c:
      en: |
        A generic Secret holds only the data you put in it. The control plane fills in a token only for a Secret of type `kubernetes.io/service-account-token`, and that token never expires.
references:
  - title: "Configure Service Accounts for Pods"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
