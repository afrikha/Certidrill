id: kcna-2c-configmap-volume-readonly
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod mounts the ConfigMap `app-config` as a `configMap` volume at `/etc/app`. At startup, the application tries to write a new file to `/etc/app`.

    What happens?
body:
  options:
    - id: a
      text: { en: "The write succeeds, and the file is added as a new key of the ConfigMap." }
    - id: b
      text: { en: "The write succeeds, and the file is kept until the Pod is deleted." }
    - id: c
      text: { en: "The write succeeds only if the container runs as root." }
    - id: d
      text: { en: "The write fails, because a `configMap` volume is always mounted read-only." }
answer: { optionId: d }
explanation:
  correct:
    en: "A ConfigMap is always mounted read-only: its keys appear as files that the application can read but not change. To let the application write files, mount a writable volume such as an `emptyDir` at another path."
  options:
    a:
      en: "Files in the volume are a projection of the ConfigMap's data. Containers cannot change the ConfigMap by writing files; it is updated through the API."
    b:
      en: "The volume is read-only, so the file cannot be created at all."
    c:
      en: "The mount is read-only for every user of the container, including root."
references:
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
