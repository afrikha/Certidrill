id: kcna-2b-supply-kyverno
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which CNCF project is a policy engine for Kubernetes whose policies are written as YAML resources, and which can validate, mutate and generate resources?
body:
  options:
    - id: a
      text: { en: "OPA Gatekeeper" }
    - id: b
      text: { en: "Kyverno" }
    - id: c
      text: { en: "Falco" }
    - id: d
      text: { en: "cert-manager" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kyverno is a policy engine built for Kubernetes: policies are declarative Kubernetes resources written in YAML (with CEL expressions), with no new language to learn. It can validate, mutate, generate and clean up resources and verify container images, typically as an admission controller.
  options:
    a:
      en: |
        Gatekeeper is also an admission policy engine, but its policies are written in the Rego language, in constraint templates.
    c:
      en: |
        Falco is a runtime security tool that detects suspicious behavior in running containers. It doesn't enforce policies at admission.
    d:
      en: |
        cert-manager issues and renews TLS certificates in Kubernetes. It is not a policy engine.
references:
  - title: "Introduction"
    url: https://kyverno.io/docs/introduction/
