id: kcna-2b-secret-base64-commit
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer wants to commit a Secret manifest to a shared Git repository, because the values in its `data` field are base64-encoded. Which statement about this plan is true?
body:
  options:
    - id: a
      text: { en: "It is unsafe: base64 is an encoding, and anyone who reads the file can decode the values" }
    - id: b
      text: { en: "It is safe, because base64 values can only be decoded by the API server" }
    - id: c
      text: { en: "It is safe if the Secret has `type: Opaque`" }
    - id: d
      text: { en: "It is safe if the Secret is marked `immutable: true`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Secret values are only base64-encoded, which obscures them but provides no confidentiality. Committing the manifest exposes the Secret to everyone who can read the repository.
  options:
    b:
      en: |
        base64 is a reversible encoding that needs no key. Any tool can decode the values.
    c:
      en: |
        The type only describes the structure of the data. It adds no encryption.
    d:
      en: |
        Immutability prevents updates to the Secret's data. It doesn't hide the values.
references:
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
