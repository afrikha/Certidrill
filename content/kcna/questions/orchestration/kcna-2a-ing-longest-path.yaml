id: kcna-2a-ing-longest-path
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Review this Ingress:

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: shop
    spec:
      rules:
      - host: shop.example.com
        http:
          paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 80 } } }
    ```

    Which Service receives a request for `http://shop.example.com/api/orders`?
body:
  options:
    - id: a
      text: { en: "`web`, because the `/` path is listed first" }
    - id: b
      text: { en: "`web` and `api` in turn, because both paths match" }
    - id: c
      text: { en: "Neither, because `Prefix` matches only an identical path" }
    - id: d
      text: { en: "`api`, because the longest matching path wins" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `Prefix` matching compares the path element by element, split by `/`. Both `/` and `/api` match `/api/orders`, and when several paths match, the longest matching path takes precedence, so the request goes to `api`.
  options:
    a:
      en: |
        The order of the paths doesn't decide. When several paths match, the longest one wins.
    b:
      en: |
        An Ingress sends each request to the backend of one matching path. It doesn't alternate between rules.
    c:
      en: |
        `Exact` matches only an identical path. `Prefix` matches element by element, so `/api` matches `/api/orders`.
references:
  - title: "Ingress"
    url: https://kubernetes.io/docs/concepts/services-networking/ingress/
