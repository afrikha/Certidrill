id: kcna-2b-psa-enforce-label
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Pod Security Admission must reject any new Pod in namespace `shop` that violates the Baseline profile. Which label should you set on the namespace?
body:
  options:
    - id: a
      text: { en: "`pod-security.kubernetes.io/warn: baseline`" }
    - id: b
      text: { en: "`pod-security.kubernetes.io/audit: baseline`" }
    - id: c
      text: { en: "`pod-security.kubernetes.io/enforce: baseline`" }
    - id: d
      text: { en: "`pod-security.kubernetes.io/enforce-version: baseline`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Pod Security Admission reads namespace labels of the form `pod-security.kubernetes.io/<mode>: <level>`. In `enforce` mode, Pods that violate the level are rejected.
  options:
    a:
      en: |
        In `warn` mode a violation only returns a warning to the user; the Pod is still created.
    b:
      en: |
        In `audit` mode a violation only adds an annotation to the audit log entry; the Pod is still created.
    d:
      en: |
        The `-version` label pins the policy to a Kubernetes version, such as `v1.37` or `latest`. Its value is not a profile.
references:
  - title: "Pod Security Admission"
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
