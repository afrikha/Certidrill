id: kcna-2b-sa-grant-permissions
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Pods in namespace `shop` run as the ServiceAccount `inventory`. The application must list the ConfigMaps of `shop`. What should you do?
body:
  options:
    - id: a
      text: { en: "Bind a Role that allows `list` on ConfigMaps to the ServiceAccount `inventory`" }
    - id: b
      text: { en: "Set `automountServiceAccountToken: true` on the ServiceAccount `inventory`" }
    - id: c
      text: { en: "Create a Secret of type `kubernetes.io/service-account-token` for `inventory`" }
    - id: d
      text: { en: "Add the label `serviceaccount: inventory` to each ConfigMap in `shop`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A ServiceAccount gets permissions only through RBAC bindings whose subject is that ServiceAccount. A Role limited to `list` on ConfigMaps, bound in `shop`, gives the application exactly what it needs.
  options:
    b:
      en: |
        This setting only controls whether a token is mounted. A token lets the application authenticate; it grants no permission.
    c:
      en: |
        This creates a long-lived token for the same identity, with the same missing permissions. Long-lived tokens are also discouraged.
    d:
      en: |
        RBAC doesn't read labels on the target objects. Access is granted only through roles and bindings.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: "Service Accounts"
    url: https://kubernetes.io/docs/concepts/security/service-accounts/
