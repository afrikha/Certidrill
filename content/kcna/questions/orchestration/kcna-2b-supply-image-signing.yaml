id: kcna-2b-supply-image-signing
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which practice lets a cluster check, at deployment time, that a container image was produced by a trusted build pipeline and not modified afterwards?
body:
  options:
    - id: a
      text: { en: "Scanning images for known vulnerabilities" }
    - id: b
      text: { en: "Setting `imagePullPolicy: Always` on the containers" }
    - id: c
      text: { en: "Signing images and verifying the signatures with an admission controller" }
    - id: d
      text: { en: "Running containers with `readOnlyRootFilesystem: true`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A signature, for example created with Sigstore's cosign, proves the authenticity and integrity of an image. An admission controller can verify it when a Pod is created and reject images that are not signed by a trusted identity.
  options:
    a:
      en: |
        A scan finds known vulnerabilities. It doesn't prove where the image comes from.
    b:
      en: |
        `Always` makes the node pull the image again at each container start. It doesn't prove who produced the image.
    d:
      en: |
        A read-only root filesystem prevents writes inside the running container. It doesn't verify the image.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Overview"
    url: https://docs.sigstore.dev/cosign/signing/overview/
