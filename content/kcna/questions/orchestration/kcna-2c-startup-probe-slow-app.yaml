id: kcna-2c-startup-probe-slow-app
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legacy application needs up to four minutes to initialize. Its liveness probe is tuned to detect a deadlock within 30 seconds, so the kubelet kills the container before it has finished starting, and the Pod ends in `CrashLoopBackOff`.

    You must keep the fast deadlock detection once the application runs. What should you add to the container?
body:
  options:
    - id: a
      text: { en: "A `startupProbe` that allows enough time for initialization" }
    - id: b
      text: { en: "A `readinessProbe` that checks the same endpoint" }
    - id: c
      text: { en: "A larger `terminationGracePeriodSeconds` value for the Pod" }
    - id: d
      text: { en: "A `preStop` lifecycle hook that waits four minutes" }
answer: { optionId: a }
explanation:
  correct:
    en: "When a startup probe is configured, the kubelet does not run the liveness and readiness probes until the startup probe succeeds. Give it a window of at least four minutes (`failureThreshold` × `periodSeconds`); after that, the existing liveness probe takes over with its fast detection."
  options:
    b:
      en: "Readiness and liveness probes do not depend on each other: a readiness probe only controls Service traffic and does not delay or stop the liveness probe."
    c:
      en: "The termination grace period is the time a container gets to shut down after it is asked to stop. It does not delay the liveness probe during startup."
    d:
      en: "A `preStop` hook runs when the container is being terminated. It does nothing to protect the container while it starts."
references:
  - title: Configure Liveness, Readiness and Startup Probes
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
