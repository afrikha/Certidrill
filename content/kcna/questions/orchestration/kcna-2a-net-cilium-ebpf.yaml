id: kcna-2a-net-cilium-ebpf
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team wants a CNI plugin built on eBPF that also enforces network policies and can replace kube-proxy. Which project should it choose?
body:
  options:
    - id: a
      text: { en: "CoreDNS" }
    - id: b
      text: { en: "containerd" }
    - id: c
      text: { en: "Envoy" }
    - id: d
      text: { en: "Cilium" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Cilium is a CNI plugin built on eBPF. It provides Pod networking, enforces identity-aware network policies from Layer 3 to Layer 7, and its eBPF load balancing can fully replace kube-proxy. Hubble, built on Cilium, adds network observability.
  options:
    a:
      en: |
        CoreDNS is the cluster DNS server. It resolves names but doesn't connect Pods to the network.
    b:
      en: |
        containerd is a container runtime. It calls the CNI plugin but is not one.
    c:
      en: |
        Envoy is a Layer 7 proxy used by service meshes and gateways. It is not a CNI plugin.
references:
  - title: "Introduction to Cilium & Hubble"
    url: https://docs.cilium.io/en/stable/overview/intro/
