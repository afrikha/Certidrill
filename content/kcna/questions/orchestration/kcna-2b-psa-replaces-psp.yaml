id: kcna-2b-psa-replaces-psp
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team runs Kubernetes v1.37 and wants a built-in way to apply the Pod Security Standards to each namespace. What should they use?
body:
  options:
    - id: a
      text: { en: "PodSecurityPolicy" }
    - id: b
      text: { en: "Pod Security Admission" }
    - id: c
      text: { en: "NetworkPolicy" }
    - id: d
      text: { en: "LimitRange" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Pod Security Admission is the built-in admission controller, stable since v1.25, that applies the Privileged, Baseline or Restricted profile to each namespace through labels. It replaced PodSecurityPolicy.
  options:
    a:
      en: |
        PodSecurityPolicy was deprecated in v1.21 and removed in v1.25. It doesn't exist in v1.37.
    c:
      en: |
        A NetworkPolicy controls network traffic to and from Pods, not their security settings.
    d:
      en: |
        A LimitRange sets default, minimum and maximum resource values for containers. It doesn't check security settings.
references:
  - title: "Pod Security Admission"
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - title: "Pod Security Policies"
    url: https://kubernetes.io/docs/concepts/security/pod-security-policy/
