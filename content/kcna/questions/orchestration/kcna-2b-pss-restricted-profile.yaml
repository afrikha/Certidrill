id: kcna-2b-pss-restricted-profile
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Pod Security Standards profile is the most restrictive and follows current Pod hardening best practices?
body:
  options:
    - id: a
      text: { en: "Restricted" }
    - id: b
      text: { en: "Baseline" }
    - id: c
      text: { en: "Privileged" }
    - id: d
      text: { en: "RuntimeDefault" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Pod Security Standards define three cumulative profiles: Privileged (unrestricted), Baseline (prevents known privilege escalations) and Restricted (heavily restricted, current hardening practice). Restricted includes all of Baseline plus rules such as running as non-root and dropping all capabilities.
  options:
    b:
      en: |
        Baseline is minimally restrictive: it prevents known privilege escalations but still allows a default Pod, for example one that runs as root.
    c:
      en: |
        Privileged is the unrestricted profile, meant for trusted system and infrastructure workloads.
    d:
      en: |
        `RuntimeDefault` is a seccomp profile type set in a securityContext, not a Pod Security Standards profile.
references:
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
