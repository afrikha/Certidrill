id: kcna-2d-default-class-annotation
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want the StorageClass `fast-ssd` to be used by every PersistentVolumeClaim that does not name a class.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Add the annotation `storageclass.kubernetes.io/is-default-class: \"true\"`" }
    - id: b
      text: { en: "Add the label `storageclass.kubernetes.io/is-default-class: \"true\"`" }
    - id: c
      text: { en: "Rename the StorageClass to `default`" }
    - id: d
      text: { en: "Create the StorageClass in the `default` namespace" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A StorageClass becomes the default when it carries the annotation `storageclass.kubernetes.io/is-default-class` set to `true`. `kubectl get storageclass` then shows `(default)` next to its name.
  options:
    b:
      en: |
        The setting is read from an annotation, not from a label. A label with the same key has no effect on defaulting.
    c:
      en: |
        The name of a StorageClass is how users request it explicitly. A class named `default` is not treated as the default class.
    d:
      en: |
        A StorageClass is cluster-scoped: it does not belong to any namespace.
references:
  - title: Change the default StorageClass
    url: https://kubernetes.io/docs/tasks/administer-cluster/change-default-storage-class/
  - title: Storage Classes
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
