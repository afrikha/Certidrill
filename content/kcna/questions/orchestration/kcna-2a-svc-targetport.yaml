id: kcna-2a-svc-targetport
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Review this Service:

    ```yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: orders
      namespace: shop
    spec:
      selector:
        app: orders
      ports:
      - port: 80
        targetPort: 8080
    ```

    What does `targetPort: 8080` define?
body:
  options:
    - id: a
      text: { en: "The port of the selected Pods to which the Service forwards traffic" }
    - id: b
      text: { en: "The port that clients use to connect to the Service" }
    - id: c
      text: { en: "The port opened on every node for clients outside the cluster" }
    - id: d
      text: { en: "The port on which the cluster DNS answers queries for the Service" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Clients connect to the Service on `port` 80, and the Service forwards the traffic to port 8080 of a Pod labeled `app: orders`, where the container listens. When `targetPort` is omitted, it defaults to the value of `port`. It can also reference a named container port.
  options:
    b:
      en: |
        Clients connect to the Service on `port`, here 80.
    c:
      en: |
        A port opened on every node is a `nodePort`, used only by NodePort and LoadBalancer Services. This Service is a ClusterIP Service.
    d:
      en: |
        DNS is unrelated to `targetPort`. The cluster DNS only maps the Service name to its ClusterIP.
references:
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
