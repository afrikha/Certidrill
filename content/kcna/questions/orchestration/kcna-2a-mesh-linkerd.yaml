id: kcna-2a-mesh-linkerd
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which CNCF graduated service mesh uses lightweight micro-proxies written in Rust for its data plane?
body:
  options:
    - id: a
      text: { en: "Istio" }
    - id: b
      text: { en: "Cilium" }
    - id: c
      text: { en: "Linkerd" }
    - id: d
      text: { en: "Envoy" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Linkerd was rewritten in 2018 to use Rust micro-proxies, which are small, lightweight and specialized for Linkerd. It became a CNCF graduated project in 2021. It provides automatic mTLS, retries, timeouts, load balancing and metrics.
  options:
    a:
      en: |
        Istio is a CNCF graduated service mesh, but its data plane uses Envoy proxies, as sidecars or in ambient mode.
    b:
      en: |
        Cilium is an eBPF-based CNI plugin that offers service mesh features without a traditional proxy per Pod.
    d:
      en: |
        Envoy is a proxy that other meshes and gateways use as their data plane. It is not a mesh with its own control plane.
references:
  - title: "What is a service mesh?"
    url: https://linkerd.io/what-is-a-service-mesh/
  - title: "Overview"
    url: https://linkerd.io/2/overview/
