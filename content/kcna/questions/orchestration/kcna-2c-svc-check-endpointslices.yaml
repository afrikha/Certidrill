id: kcna-2c-svc-check-endpointslices
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Clients cannot reach the Service `api` in the `payments` namespace. You want to check which Pod IP addresses the Service currently sends traffic to.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl get endpointslices -n payments -l kubernetes.io/service-name=api`" }
    - id: b
      text: { en: "`kubectl get ingress -n payments`" }
    - id: c
      text: { en: "`kubectl get networkpolicies -n payments`" }
    - id: d
      text: { en: "`kubectl get nodes -o wide`" }
answer: { optionId: a }
explanation:
  correct:
    en: "The control plane creates EndpointSlices for each Service with a selector, and labels them with `kubernetes.io/service-name`. Their ENDPOINTS column lists the Pod IPs behind the Service; `<none>` means no Pod is selected or ready."
  options:
    b:
      en: "An Ingress routes external HTTP traffic to Services. It does not show which Pods a Service has selected."
    c:
      en: "NetworkPolicies may block traffic, but listing them does not show the Pod IPs behind the Service."
    d:
      en: "This lists the nodes and their addresses. Node IPs are not the endpoints of a ClusterIP Service."
references:
  - title: Debug Services
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
