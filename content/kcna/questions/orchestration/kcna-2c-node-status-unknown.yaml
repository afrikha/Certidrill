id: kcna-2c-node-status-unknown
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    `kubectl describe node node-5` shows every condition with the status `Unknown`, the reason `NodeStatusUnknown` and the message `Kubelet stopped posting node status.`

    What is the most likely cause?
body:
  options:
    - id: a
      text: { en: "An administrator cordoned the node before a maintenance." }
    - id: b
      text: { en: "The node's kubelet stopped or lost its connection to the API server." }
    - id: c
      text: { en: "The node runs more Pods than its allocatable resources allow." }
    - id: d
      text: { en: "The kube-scheduler has stopped assigning Pods to the node." }
answer: { optionId: b }
explanation:
  correct:
    en: "The kubelet reports the node's health to the API server. When the node controller hears nothing from the node for the grace period (`node-monitor-grace-period`, 50 seconds by default), it sets the conditions to `Unknown`. The usual causes are a stopped or crashed kubelet, a node that is shut down, or a network problem between the node and the control plane."
  options:
    a:
      en: "Cordoning marks the node as unschedulable (shown as `SchedulingDisabled`). The kubelet keeps reporting, so the conditions stay known."
    c:
      en: "Resource shortages on a node are reported by pressure conditions with a `True` or `False` status, while the kubelet keeps reporting. `Unknown` means the control plane no longer hears from the node at all."
    d:
      en: "The scheduler does not report node conditions. Node conditions come from the kubelet and the node controller."
references:
  - title: Troubleshooting Clusters
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/
  - title: Node Status
    url: https://kubernetes.io/docs/reference/node/node-status/
