id: kcna-2c-get-pods-wide
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Several Pods of the `shop` namespace fail at the same time. You suspect that they all run on the same node.

    Which command lists the Pods together with the node each one runs on and its Pod IP address?
body:
  options:
    - id: a
      text: { en: "`kubectl get pods -n shop --show-labels`" }
    - id: b
      text: { en: "`kubectl get pods -n shop --watch`" }
    - id: c
      text: { en: "`kubectl get pods -n shop -o wide`" }
    - id: d
      text: { en: "`kubectl get pods -n shop -o name`" }
answer: { optionId: c }
explanation:
  correct:
    en: "The `-o wide` output format adds columns to the default table, such as the Pod IP address and the name of the node the Pod is bound to. It is the quickest way to see whether failing Pods share a node."
  options:
    a:
      en: "`--show-labels` adds a column with the labels of each Pod. It does not show the node or the Pod IP."
    b:
      en: "`--watch` keeps the command running and prints changes as they happen, with the same default columns. It does not add the node or the Pod IP."
    d:
      en: "`-o name` prints only the resource type and name of each Pod (`pod/web-1`), with even less information than the default table."
references:
  - title: kubectl get
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_get/
