id: kcna-2b-sa-username-format
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An audit log entry shows a request made by the user `system:serviceaccount:ci:build-bot`. Who made the request?
body:
  options:
    - id: a
      text: { en: "The ServiceAccount `ci` in namespace `build-bot`" }
    - id: b
      text: { en: "The ServiceAccount `build-bot` in namespace `ci`" }
    - id: c
      text: { en: "A human user named `build-bot` in the group `ci`" }
    - id: d
      text: { en: "Any ServiceAccount of namespace `ci`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A ServiceAccount authenticates with the username `system:serviceaccount:<namespace>:<name>`. It also belongs to the groups `system:serviceaccounts` and `system:serviceaccounts:<namespace>`, which RBAC bindings can use as subjects.
  options:
    a:
      en: |
        The format is `system:serviceaccount:<namespace>:<name>`: the namespace comes first.
    c:
      en: |
        The `system:serviceaccount:` prefix identifies a ServiceAccount. Human users are not represented by API objects and have no such prefix.
    d:
      en: |
        All the ServiceAccounts of a namespace form the group `system:serviceaccounts:ci` (plural). A username names a single ServiceAccount.
references:
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
