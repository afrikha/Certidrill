id: kcna-2b-baseline-hostnetwork
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Namespace `shop` enforces the Baseline profile of the Pod Security Standards. Which Pod is rejected?
body:
  options:
    - id: a
      text: { en: "A Pod whose container runs as root (UID 0)" }
    - id: b
      text: { en: "A Pod whose spec sets no `seccompProfile`" }
    - id: c
      text: { en: "A Pod that mounts an `emptyDir` volume" }
    - id: d
      text: { en: "A Pod with `hostNetwork: true`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Baseline blocks known privilege escalations, including sharing host namespaces: `hostNetwork`, `hostPID` and `hostIPC` must be unset or `false`. It still allows a default Pod, such as one that runs as root without a seccomp profile.
  options:
    a:
      en: |
        Baseline doesn't require running as non-root. That rule belongs to the Restricted profile.
    b:
      en: |
        Baseline only forbids the `Unconfined` seccomp profile. Requiring an explicit `RuntimeDefault` or `Localhost` profile is a Restricted rule.
    c:
      en: |
        `emptyDir` volumes are allowed even by the Restricted profile. Baseline forbids `hostPath` volumes.
references:
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
