id: kcna-2b-rbac-grant-role
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Role named `pod-reader` exists in namespace `shop`. Which object grants this Role to the user `dana@example.com`?
body:
  options:
    - id: a
      text: { en: "A ClusterRoleBinding whose `roleRef` is the Role `pod-reader`" }
    - id: b
      text: { en: "A ServiceAccount named `dana` in namespace `shop`" }
    - id: c
      text: { en: "A RoleBinding in namespace `shop` whose `roleRef` is `pod-reader`" }
    - id: d
      text: { en: "A label `user: dana` added to the Role `pod-reader`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A RoleBinding lists subjects (users, groups or ServiceAccounts) and a `roleRef` that points to the role it grants. The RoleBinding and the Role are both in `shop`, so dana gets the Role's permissions in that namespace.
  options:
    a:
      en: |
        A ClusterRoleBinding can only reference a ClusterRole, never a namespaced Role.
    b:
      en: |
        A ServiceAccount is a workload identity, not a grant. Creating one gives no permission to anybody, and dana is a user, not a ServiceAccount.
    d:
      en: |
        Labels organize and select objects. RBAC doesn't read labels to decide who holds a role.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
