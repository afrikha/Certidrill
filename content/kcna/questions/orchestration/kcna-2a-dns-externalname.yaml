id: kcna-2a-dns-externalname
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Review this Service:

    ```yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: billing
      namespace: shop
    spec:
      type: ExternalName
      externalName: billing.example.com
    ```

    A Pod looks up `billing.shop.svc.cluster.local`. What does the cluster DNS return?
body:
  options:
    - id: a
      text: { en: "An A record with a ClusterIP that kube-proxy forwards to `billing.example.com`" }
    - id: b
      text: { en: "The IP addresses of the Pods labeled `app: billing`" }
    - id: c
      text: { en: "A CNAME record that points to `billing.example.com`" }
    - id: d
      text: { en: "No record, because only kube-proxy resolves ExternalName Services" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An ExternalName Service maps a Service name to a DNS name. The cluster DNS returns a CNAME record with the value of `externalName`, so the redirection happens at the DNS level, without any proxying.
  options:
    a:
      en: |
        An ExternalName Service gets no cluster IP, and no proxying of any kind is set up for it.
    b:
      en: |
        An ExternalName Service has no selector, so it never points to Pods.
    d:
      en: |
        kube-proxy doesn't handle ExternalName Services at all. The cluster DNS answers for them.
references:
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
