id: kcna-2c-startup-blocks-other-probes
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container defines a startup probe, a liveness probe and a readiness probe. The application has just started, and the startup probe has not succeeded yet.

    How does the kubelet handle the liveness and readiness probes during this time?
body:
  options:
    - id: a
      text: { en: "It runs neither of them until the startup probe succeeds." }
    - id: b
      text: { en: "It runs both of them in parallel with the startup probe." }
    - id: c
      text: { en: "It runs the readiness probe only, and waits to run the liveness probe." }
    - id: d
      text: { en: "It runs the liveness probe only, and waits to run the readiness probe." }
answer: { optionId: a }
explanation:
  correct:
    en: "If a startup probe is configured, Kubernetes does not execute liveness or readiness probes until the startup probe succeeds. This gives a slow application time to initialize without being restarted by the liveness probe. The startup probe runs only at startup; the two other probes then run periodically for the rest of the container's life."
  options:
    b:
      en: "Running the liveness probe during startup is exactly what the startup probe prevents: a slow starter would be killed before it is ready."
    c:
      en: "The readiness probe is also held back until the startup probe succeeds. Until then, the container is not ready and gets no Service traffic."
    d:
      en: "The liveness probe is the one the startup probe mainly protects against. It does not run before the startup probe succeeds."
references:
  - title: Liveness, Readiness, and Startup Probes
    url: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
