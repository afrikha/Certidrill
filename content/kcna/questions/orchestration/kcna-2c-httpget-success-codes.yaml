id: kcna-2c-httpget-success-codes
objective: "2.3.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A container's liveness probe uses `httpGet` on `/healthz`. The endpoint returns a redirect (HTTP 302) to a login page.

    Which range of HTTP status codes makes an `httpGet` probe succeed?
body:
  options:
    - id: a
      text: { en: "Only 200" }
    - id: b
      text: { en: "200 to 299" }
    - id: c
      text: { en: "200 to 399" }
    - id: d
      text: { en: "Any code below 500" }
answer: { optionId: c }
explanation:
  correct:
    en: "For an `httpGet` probe, any status code greater than or equal to 200 and less than 400 indicates success; any other code is a failure. The 302 redirect therefore counts as a success, even though the application may not be healthy, so health endpoints should answer directly."
  options:
    a:
      en: "The probe does not require exactly 200: every code from 200 to 399 is accepted."
    b:
      en: "The success range is wider than the 2xx codes: 3xx redirects are accepted too."
    d:
      en: "4xx codes such as 404 or 403 make the probe fail. Only codes from 200 to 399 succeed."
references:
  - title: Configure Liveness, Readiness and Startup Probes
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
