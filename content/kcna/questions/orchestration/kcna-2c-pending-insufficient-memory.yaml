id: kcna-2c-pending-insufficient-memory
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A new Pod stays `Pending`. `kubectl describe pod` shows this event:

    ```text
    Warning  FailedScheduling  20s  default-scheduler  0/3 nodes are available: 3 Insufficient memory.
    ```

    What is the cause?
body:
  options:
    - id: a
      text: { en: "The container used more memory than its limit and was killed." }
    - id: b
      text: { en: "The image is too large to fit in the memory of the nodes." }
    - id: c
      text: { en: "The Pod's memory request is more than any node has left to allocate." }
    - id: d
      text: { en: "The kubelet evicted the Pod because a node reported MemoryPressure." }
answer: { optionId: c }
explanation:
  correct:
    en: "The scheduler places a Pod only on a node whose allocatable resources can still fit the Pod's requests. `Insufficient memory` on every node means the memory request is larger than what any node has left. Lower the request, free capacity, or add nodes."
  options:
    a:
      en: "An out-of-memory kill happens to a container that is already running and is reported as `OOMKilled`. This Pod was never scheduled, so no container has run."
    b:
      en: "Image size has nothing to do with this event: images are pulled to the node's disk, and only after the Pod is scheduled."
    d:
      en: "Node-pressure eviction terminates Pods that were already running on a node. This Pod was never placed on a node: the scheduler reports that it does not fit."
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  - title: Debug Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
