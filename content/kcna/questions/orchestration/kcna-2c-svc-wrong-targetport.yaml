id: kcna-2c-svc-wrong-targetport
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The application in the `catalog` Pods listens on port 3000. The Service below lists three endpoints, but every connection to `catalog:80` is refused.

    ```yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: catalog
    spec:
      selector:
        app: catalog
      ports:
      - port: 80
        targetPort: 8080
    ```

    What should you change?
body:
  options:
    - id: a
      text: { en: "Set `port` to `3000`" }
    - id: b
      text: { en: "Set `targetPort` to `3000`" }
    - id: c
      text: { en: "Add `type: LoadBalancer`" }
    - id: d
      text: { en: "Add `clusterIP: None`" }
answer: { optionId: b }
explanation:
  correct:
    en: "`targetPort` is the port on the Pods that receives the traffic, and it must match the port the container listens on. `port` is the port clients use on the Service. With `targetPort: 3000`, connections to `catalog:80` reach the application."
  options:
    a:
      en: "Changing `port` changes what clients must connect to, but the traffic would still be forwarded to port 8080 on the Pods, where nothing listens."
    c:
      en: "A LoadBalancer Service adds an external entry point, but it forwards to the same wrong `targetPort`."
    d:
      en: "`clusterIP: None` makes a headless Service: DNS returns the Pod IPs directly, and clients would still use the wrong port. It does not fix the port mapping."
references:
  - title: Debug Services
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
