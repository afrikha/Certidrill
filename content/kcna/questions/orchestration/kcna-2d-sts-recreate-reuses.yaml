id: kcna-2d-sts-recreate-reuses
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A StatefulSet named `db` with the default claim retention settings is deleted. An hour later, it is created again with the same name and the same `volumeClaimTemplates`.

    What storage does the new Pod `db-0` get?
body:
  options:
    - id: a
      text: { en: "A new, empty volume from the StorageClass" }
    - id: b
      text: { en: "No storage until the old claims are deleted" }
    - id: c
      text: { en: "Its original claim `data-db-0` and its data" }
    - id: d
      text: { en: "A copy of the data restored from a snapshot" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      By default (`whenDeleted: Retain`), deleting a StatefulSet does not delete its claims or volumes. When the StatefulSet is recreated, Pod `db-0` uses the existing claim `data-db-0`, so its original volume is remounted.
  options:
    a:
      en: |
        A new volume is only provisioned when the claim does not exist. Here `data-db-0` was kept.
    b:
      en: |
        The old claims are exactly what the new Pods use; deleting them would lose the data.
    d:
      en: |
        No snapshot is involved: the original volume itself is still there and is mounted again.
references:
  - title: StatefulSet Basics
    url: https://kubernetes.io/docs/tutorials/stateful-application/basic-stateful-set/
  - title: StatefulSets
    url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
