id: kcna-2c-gitrepo-removed
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    On a Kubernetes v1.37 cluster, a web server must serve the content of a Git repository. The repository must be cloned each time the Pod starts.

    How should you configure the Pod?
body:
  options:
    - id: a
      text: { en: "Add a `gitRepo` volume that clones the repository, and mount it in the web server container" }
    - id: b
      text: { en: "Add an init container that clones the repository into an `emptyDir` volume shared with the web server" }
    - id: c
      text: { en: "Add a `hostPath` volume that points to a clone made on one node, and mount it in the web server" }
    - id: d
      text: { en: "Add a `projected` volume with the repository URL, and mount it in the web server container" }
answer: { optionId: b }
explanation:
  correct:
    en: "The documented pattern is an init container that runs `git clone` into an `emptyDir` volume; the init container completes before the web server starts, and the web server mounts the same `emptyDir`. Each new Pod gets a fresh clone."
  options:
    a:
      en: "The `gitRepo` volume type was deprecated for a long time and is not included in Kubernetes v1.37: the last version that could use it was v1.35."
    c:
      en: "`hostPath` exposes one node's filesystem, so the content would be missing on other nodes and would not be refreshed at each start. It also adds security risks."
    d:
      en: "A projected volume combines Secret, ConfigMap, downward API, service account token and certificate sources. It cannot clone a Git repository."
references:
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
