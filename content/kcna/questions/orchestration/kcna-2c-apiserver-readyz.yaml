id: kcna-2c-apiserver-readyz
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want to check whether the kube-apiserver is ready to serve traffic, and see the result of each of its individual checks, such as `etcd`.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl get --raw='/readyz?verbose'`" }
    - id: b
      text: { en: "`kubectl get nodes`" }
    - id: c
      text: { en: "`kubectl get pods -n default`" }
    - id: d
      text: { en: "`kubectl describe node cp1`" }
answer: { optionId: a }
explanation:
  correct:
    en: "The kube-apiserver exposes the health endpoints `/livez` and `/readyz` (`/healthz` is deprecated). The `verbose` parameter lists every check, for example `[+]etcd ok`, which helps a human find the failing part."
  options:
    b:
      en: "`kubectl get nodes` shows whether each node is Ready. It does not list the API server's internal checks."
    c:
      en: "Listing Pods in `default` only shows that the API server answered this request. It does not report its individual checks."
    d:
      en: "`kubectl describe node` shows the conditions reported by the node's kubelet, not the readiness checks of the kube-apiserver."
references:
  - title: Kubernetes API health endpoints
    url: https://kubernetes.io/docs/reference/using-api/health-checks/
