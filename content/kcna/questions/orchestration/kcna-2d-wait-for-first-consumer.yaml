id: kcna-2d-wait-for-first-consumer
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a multi-zone cluster, volumes are provisioned as soon as each claim is created. Some Pods then cannot be scheduled, because their volume was created in a zone where the Pod cannot run.

    Which StorageClass setting fixes this?
body:
  options:
    - id: a
      text: { en: "`volumeBindingMode: Immediate`" }
    - id: b
      text: { en: "`reclaimPolicy: Retain`" }
    - id: c
      text: { en: "`allowVolumeExpansion: true`" }
    - id: d
      text: { en: "`volumeBindingMode: WaitForFirstConsumer`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `WaitForFirstConsumer` delays binding and provisioning until a Pod that uses the claim is created. The volume is then provisioned according to the Pod's scheduling constraints, in a zone where the Pod can run.
  options:
    a:
      en: |
        `Immediate` is the default and the cause of the problem: the volume is provisioned when the claim is created, without knowledge of the Pod's scheduling requirements.
    b:
      en: |
        The reclaim policy decides what happens to the volume after its claim is deleted. It has no effect on where the volume is created.
    c:
      en: |
        `allowVolumeExpansion` lets users grow a volume. It does not change the zone in which the volume is provisioned.
references:
  - title: Storage Classes
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
