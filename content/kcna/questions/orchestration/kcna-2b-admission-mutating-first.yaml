id: kcna-2b-admission-mutating-first
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster has a mutating admission webhook that adds a sidecar container to every Pod, and a validating admission webhook that rejects Pods whose containers have no memory limit. Which statement is true?
body:
  options:
    - id: a
      text: { en: "Validating admission runs first, so the added sidecar is never checked" }
    - id: b
      text: { en: "Mutating admission runs first, so the validating webhook also checks the added sidecar" }
    - id: c
      text: { en: "Both webhooks run in parallel, in a single admission phase" }
    - id: d
      text: { en: "Both webhooks run after the Pod has been stored in etcd" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Admission control has two phases. Mutating controllers run first and may change the object (here, add the sidecar). Validating controllers then check the final object and can only accept or reject it. If the sidecar has no memory limit, the validating webhook rejects the Pod.
  options:
    a:
      en: |
        The mutating phase always runs before the validating phase, so validation sees the final object, sidecar included.
    c:
      en: |
        Admission has two phases. Validating webhooks can be called in parallel with each other, but only after all mutating webhooks have run.
    d:
      en: |
        Admission happens before the object is stored. A Pod rejected by admission is never written to etcd.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
