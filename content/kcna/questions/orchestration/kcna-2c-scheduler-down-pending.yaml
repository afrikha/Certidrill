id: kcna-2c-scheduler-down-pending
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In a cluster, all nodes are `Ready` and existing applications keep serving traffic. Since this morning, every new Pod stays `Pending`: its `NODE` column shows `<none>`, and `kubectl describe pod` shows no `Scheduled` and no `FailedScheduling` event. `kubectl` commands work normally.

    Which component is most likely not working?
body:
  options:
    - id: a
      text: { en: "kube-proxy" }
    - id: b
      text: { en: "etcd" }
    - id: c
      text: { en: "kube-scheduler" }
    - id: d
      text: { en: "The kubelet on every node" }
answer: { optionId: c }
explanation:
  correct:
    en: "kube-scheduler assigns new Pods to nodes and records either a `Scheduled` or a `FailedScheduling` event. If it is down, nothing evaluates the new Pods: they stay Pending with no node and no scheduling event, while the Pods already running are unaffected. On a kubeadm cluster, check the `kube-scheduler` static Pod in `kube-system`."
  options:
    a:
      en: "kube-proxy implements Service traffic on each node. It does not assign Pods to nodes."
    b:
      en: "If etcd were down, the kube-apiserver could not store or read objects, and `kubectl` commands would fail. Here they work."
    d:
      en: "If the kubelets had stopped, the nodes would become `NotReady` or `Unknown`. Here all nodes are Ready, and Pods are not even assigned to a node yet."
references:
  - title: Troubleshooting Clusters
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/
