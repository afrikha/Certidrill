id: kcna-2d-reclaim-retain
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator creates a PersistentVolume for audit data. When the claim that uses it is deleted, the data must stay on the storage so that the administrator can recover it manually.

    What should the administrator configure on the PersistentVolume?
body:
  options:
    - id: a
      text: { en: "Set `persistentVolumeReclaimPolicy` to `Delete`" }
    - id: b
      text: { en: "Set `persistentVolumeReclaimPolicy` to `Recycle`" }
    - id: c
      text: { en: "Set `accessModes` to `ReadOnlyMany`" }
    - id: d
      text: { en: "Set `persistentVolumeReclaimPolicy` to `Retain`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `Retain` reclaim policy allows manual reclamation. When the claim is deleted, the PersistentVolume still exists and becomes `Released`, and the previous claimant's data stays on the volume until an administrator cleans it up.
  options:
    a:
      en: |
        `Delete` removes the PersistentVolume object and the associated storage asset in the backend when the claim is deleted, so the data would be lost.
    b:
      en: |
        `Recycle` is deprecated and performs a basic scrub (`rm -rf`) of the volume so that it can be reused: it erases the data.
    c:
      en: |
        Access modes describe how nodes can mount the volume. They do not decide what happens to the volume after its claim is deleted.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
