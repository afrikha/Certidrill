id: kcna-2c-secret-volume-tmpfs
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security reviewer asks where the files of a `secret` volume are stored on the node while a Pod uses them.

    What should you answer?
body:
  options:
    - id: a
      text: { en: "In a tmpfs, a RAM-backed filesystem, so they are never written to non-volatile storage" }
    - id: b
      text: { en: "In the node's disk, under the container image layers of the Pod" }
    - id: c
      text: { en: "In etcd only, read by the container through the API server at each access" }
    - id: d
      text: { en: "In a PersistentVolume created by the default StorageClass" }
answer: { optionId: a }
explanation:
  correct:
    en: "`secret` volumes are backed by tmpfs, so the Secret data is never written to the node's non-volatile storage. Like a ConfigMap, a Secret is always mounted read-only."
  options:
    b:
      en: "Volumes are not part of the image layers, and a `secret` volume is kept in memory, not on disk."
    c:
      en: "The Secret object is stored in etcd, but the kubelet writes its data into the volume on the node. The container reads local files, without calling the API server."
    d:
      en: "A `secret` volume is an ephemeral volume managed by the kubelet. It does not use PersistentVolumes or StorageClasses."
references:
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
