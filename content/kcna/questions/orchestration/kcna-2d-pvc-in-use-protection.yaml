id: kcna-2d-pvc-in-use-protection
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A user runs the following command while a running Pod still mounts the claim:

    ```bash
    kubectl delete pvc data -n shop
    ```

    What happens to the PersistentVolumeClaim?
body:
  options:
    - id: a
      text: { en: "It stays `Terminating` until no Pod uses it" }
    - id: b
      text: { en: "It is removed at once and the Pod is restarted" }
    - id: c
      text: { en: "The API server rejects the delete request" }
    - id: d
      text: { en: "It is removed at once and the Pod loses the mount" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Storage object in use protection postpones the removal of a claim that is actively used by a Pod. The claim shows `Terminating` (it carries the `kubernetes.io/pvc-protection` finalizer) and is removed once no Pod uses it any more.
  options:
    b:
      en: |
        The claim is not removed while a Pod uses it, and deleting a claim does not restart Pods.
    c:
      en: |
        The delete request is accepted; only the actual removal is postponed by a finalizer.
    d:
      en: |
        Protection exists precisely so that a volume is not pulled from under a running Pod.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
