id: kcna-2a-net-source-ip
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Pod `client` (IP 10.244.2.7) runs on node B. It opens a TCP connection directly to the Pod IP address of Pod `server`, which runs on node A. Which source IP address does `server` see?
body:
  options:
    - id: a
      text: { en: "The IP address of node B" }
    - id: b
      text: { en: "The ClusterIP of a Service in front of `client`" }
    - id: c
      text: { en: "10.244.2.7, the IP address of Pod `client`" }
    - id: d
      text: { en: "An IP address owned by kube-proxy on node A" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Kubernetes network model requires Pods to communicate directly, without proxies or NAT. So `server` sees the real Pod IP address of `client`, whichever node `client` runs on.
  options:
    a:
      en: |
        The node's address would appear only if traffic were translated with NAT. The network model requires Pod-to-Pod traffic without NAT.
    b:
      en: |
        No Service is involved in a direct connection to a Pod IP. A ClusterIP is a destination address for clients, never the source address of a Pod's connections.
    d:
      en: |
        kube-proxy only programs rules for Service virtual IP addresses. A direct connection to a Pod IP doesn't go through it.
references:
  - title: "Services, Load Balancing, and Networking"
    url: https://kubernetes.io/docs/concepts/services-networking/
