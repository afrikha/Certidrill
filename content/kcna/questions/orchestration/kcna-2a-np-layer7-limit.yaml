id: kcna-2a-np-layer7-limit
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Pods of the app `reports` may call Pods of the app `api`, but only with HTTP `GET` requests on the path `/status`. Which approach can enforce this rule?
body:
  options:
    - id: a
      text: { en: "A NetworkPolicy with a `ports` rule for port 80" }
    - id: b
      text: { en: "An authorization policy of a service mesh" }
    - id: c
      text: { en: "A NetworkPolicy with an `ipBlock` for the `reports` Pod IPs" }
    - id: d
      text: { en: "A Service with `sessionAffinity: ClientIP`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The NetworkPolicy API has no Layer 7 controls, and the Kubernetes documentation points to tools such as service meshes for such needs. A mesh proxy sees each HTTP request, so a mesh authorization policy, such as an Istio AuthorizationPolicy, can allow requests by method and path.
  options:
    a:
      en: |
        A NetworkPolicy works on IP addresses and ports (Layers 3 and 4). It can't inspect HTTP methods or paths.
    c:
      en: |
        An `ipBlock` is still a Layer 3 rule, meant for addresses outside the cluster because Pod IPs change. It can't inspect HTTP requests.
    d:
      en: |
        Session affinity keeps a client on the same Pod. It doesn't filter requests.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - title: "Security"
    url: https://istio.io/latest/docs/concepts/security/
