id: kcna-2c-events-for-warning
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The namespace `payments` contains many Pods and produces a lot of events. You want to list only the events of type `Warning` that concern the Pod `api-7`.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl events -n payments --for pod/api-7 --types=Warning`" }
    - id: b
      text: { en: "`kubectl logs -n payments api-7 --previous`" }
    - id: c
      text: { en: "`kubectl describe pod -n payments api-7 --show-events=false`" }
    - id: d
      text: { en: "`kubectl get pod -n payments api-7 --watch`" }
answer: { optionId: a }
explanation:
  correct:
    en: "`kubectl events` lists events. `--for TYPE/NAME` keeps only the events that pertain to one resource, and `--types=Warning` keeps only the events of type Warning, so the command shows exactly the warnings about `api-7`."
  options:
    b:
      en: "`kubectl logs --previous` shows the output of the previous container instance. Logs are written by the application; they are not Kubernetes events."
    c:
      en: "`--show-events=false` removes the Events section from the description, the opposite of what you need."
    d:
      en: "`kubectl get --watch` prints the Pod's status line each time it changes. It does not list events or filter them by type."
references:
  - title: kubectl events
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_events/
