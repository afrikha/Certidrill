id: kcna-2a-np-default-allow
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    No NetworkPolicy exists in the namespace `shop`. Which traffic can the Pods of `shop` send and receive?
body:
  options:
    - id: a
      text: { en: "All inbound and outbound traffic is allowed" }
    - id: b
      text: { en: "Only traffic from Pods of the same namespace is allowed" }
    - id: c
      text: { en: "All inbound traffic is denied until a policy allows it" }
    - id: d
      text: { en: "Only traffic that goes through a Service is allowed" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, Pods are non-isolated: they accept all inbound traffic and can send traffic anywhere. A Pod becomes isolated for ingress or egress only when a NetworkPolicy selects it with that direction in `policyTypes`.
  options:
    b:
      en: |
        Without a policy, Pods accept traffic from every namespace and from outside the cluster too.
    c:
      en: |
        Pods are not isolated by default. Inbound traffic is denied only after a policy selects the Pods for ingress.
    d:
      en: |
        Pods can be reached directly on their Pod IPs. Services are not a filtering mechanism.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
