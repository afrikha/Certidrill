id: kcna-2d-csi-node-plugin-daemonset
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The node plugin of a CSI driver mounts volumes on the node where a Pod runs. Pods using the driver can be scheduled on any node.

    How is the node plugin usually deployed?
body:
  options:
    - id: a
      text: { en: "As a Deployment with one replica" }
    - id: b
      text: { en: "As a StatefulSet with one replica per zone" }
    - id: c
      text: { en: "As a static Pod on the control plane nodes" }
    - id: d
      text: { en: "As a DaemonSet that runs on every node" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Each node that can run Pods with CSI volumes needs the node plugin locally, so it runs as a DaemonSet on every node, together with the node-driver-registrar sidecar that registers the driver with the kubelet. The controller plugin, by contrast, can run anywhere as a Deployment or StatefulSet.
  options:
    a:
      en: |
        A single replica runs on one node only, so volumes could not be mounted on the other nodes.
    b:
      en: |
        A StatefulSet with a fixed replica count does not guarantee one Pod per node. A StatefulSet is an option for the controller plugin, not the node plugin.
    c:
      en: |
        The plugin must run on the worker nodes where the Pods and their volumes are, not only on control plane nodes.
references:
  - title: Deploying CSI Driver on Kubernetes
    url: https://github.com/kubernetes-csi/docs/blob/master/book/src/deploying.md
