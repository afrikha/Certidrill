id: kcna-2a-svc-loadbalancer-ccm
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster runs on a cloud provider that supports external load balancers. You create a Service of type `LoadBalancer`. Which component configures the cloud's load balancer to forward traffic to the Service?
body:
  options:
    - id: a
      text: { en: "kube-proxy" }
    - id: b
      text: { en: "cloud-controller-manager" }
    - id: c
      text: { en: "kube-scheduler" }
    - id: d
      text: { en: "An Ingress controller" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For a LoadBalancer Service, Kubernetes first sets up what a NodePort Service needs. The cloud-controller-manager then configures the external load balancer to forward traffic to that node port. Information about the load balancer is published in the Service's `.status.loadBalancer` field.
  options:
    a:
      en: |
        kube-proxy programs rules on each node for traffic that reaches the node. It doesn't call the cloud provider's API.
    c:
      en: |
        kube-scheduler assigns Pods to nodes. It has no role in Service exposure.
    d:
      en: |
        An Ingress controller implements Ingress resources. A LoadBalancer Service doesn't need one.
references:
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
