id: kcna-2a-svc-internal-traffic-local
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A ClusterIP Service has `internalTrafficPolicy: Local`. A client Pod runs on a node where no ready backend Pod of the Service is running. What happens when the client connects to the Service?
body:
  options:
    - id: a
      text: { en: "kube-proxy forwards the traffic to a ready backend Pod on another node" }
    - id: b
      text: { en: "kube-scheduler starts a backend Pod on the client's node" }
    - id: c
      text: { en: "kube-proxy drops the traffic, because only endpoints on the client's node can be used" }
    - id: d
      text: { en: "The cluster DNS returns the Pod IP addresses so that the client connects directly" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `internalTrafficPolicy: Local`, internal traffic goes only to ready endpoints on the same node as the client. When the node has no such endpoint, kube-proxy drops the traffic. The default, `Cluster`, routes to all ready endpoints.
  options:
    a:
      en: |
        Forwarding to ready endpoints on any node is the behavior of the default policy, `Cluster`, not `Local`.
    b:
      en: |
        A Service never creates Pods, and kube-scheduler only places Pods that already exist.
    d:
      en: |
        Returning Pod IP addresses is the behavior of a headless Service. A ClusterIP Service doesn't fall back to it.
references:
  - title: "Virtual IPs and Service Proxies"
    url: https://kubernetes.io/docs/reference/networking/virtual-ips/
