id: kcna-2c-readiness-failure-effect
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod behind a Service has a readiness probe. While the application reloads a large cache, the readiness probe fails for one minute, then succeeds again.

    What happens to the Pod during that minute?
body:
  options:
    - id: a
      text: { en: "Its container is killed and restarted by the kubelet." }
    - id: b
      text: { en: "It receives no traffic from the Service, and its container keeps running." }
    - id: c
      text: { en: "It is deleted and replaced by its Deployment with a new Pod." }
    - id: d
      text: { en: "Its phase changes to Failed until the probe succeeds again." }
answer: { optionId: b }
explanation:
  correct:
    en: "When a readiness probe fails, the kubelet marks the container as not ready and the EndpointSlice controller removes the Pod's IP address from the EndpointSlices of the matching Services. The container is not restarted, and the Pod receives traffic again as soon as the probe succeeds."
  options:
    a:
      en: "Killing and restarting the container is what happens when a liveness or startup probe fails, not a readiness probe."
    c:
      en: "No probe deletes the Pod. The Deployment keeps the same Pod, which simply stops receiving Service traffic while it is not ready."
    d:
      en: "The Pod stays in the Running phase. Readiness is reported through the Ready condition, not through the phase."
references:
  - title: Liveness, Readiness, and Startup Probes
    url: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
