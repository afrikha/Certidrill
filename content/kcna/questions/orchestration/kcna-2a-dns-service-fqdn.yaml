id: kcna-2a-dns-service-fqdn
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Service `api` runs in the namespace `payments` of a cluster whose domain is `cluster.local`. What is the fully qualified DNS name of the Service?
body:
  options:
    - id: a
      text: { en: "`api.payments.svc.cluster.local`" }
    - id: b
      text: { en: "`payments.api.svc.cluster.local`" }
    - id: c
      text: { en: "`api.payments.pod.cluster.local`" }
    - id: d
      text: { en: "`api.svc.payments.cluster.local`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A normal Service gets A and/or AAAA records named `<service>.<namespace>.svc.<cluster-domain>`, which resolve to its ClusterIP. Here, that name is `api.payments.svc.cluster.local`.
  options:
    b:
      en: |
        The Service name comes first, then the namespace. This name reverses them.
    c:
      en: |
        The `pod` label is used for Pod records, which are built from the Pod's IP address, not for Services.
    d:
      en: |
        The namespace comes before `svc`, not after it.
references:
  - title: "DNS for Services and Pods"
    url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
