id: kcna-2d-sts-default-class
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A StatefulSet's `volumeClaimTemplates` entry does not set `storageClassName`. The cluster has a default StorageClass that uses dynamic provisioning.

    How do the replicas get their volumes?
body:
  options:
    - id: a
      text: { en: "The default StorageClass provisions one volume per replica" }
    - id: b
      text: { en: "The default StorageClass provisions one volume shared by all replicas" }
    - id: c
      text: { en: "The replicas use emptyDir volumes because no class is set" }
    - id: d
      text: { en: "The StatefulSet is rejected until a class is named" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each Pod receives its own claim from the template. When the template names no StorageClass, the default StorageClass is used, and its provisioner creates one volume for each claim.
  options:
    b:
      en: |
        A claim template creates one claim per Pod, so each replica gets a separate volume.
    c:
      en: |
        A claim template always creates PersistentVolumeClaims. Kubernetes never replaces them with `emptyDir` volumes.
    d:
      en: |
        `storageClassName` is optional in a claim template; the default class fills the gap.
references:
  - title: StatefulSets
    url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
