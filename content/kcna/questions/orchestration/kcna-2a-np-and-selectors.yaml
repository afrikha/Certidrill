id: kcna-2a-np-and-selectors
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    This rule appears in a NetworkPolicy:

    ```yaml
    ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            team: alpha
        podSelector:
          matchLabels:
            role: client
    ```

    Which sources does it allow?
body:
  options:
    - id: a
      text: { en: "All Pods in namespaces labeled `team: alpha`, and Pods labeled `role: client` in the policy's namespace" }
    - id: b
      text: { en: "Pods labeled `role: client` in any namespace" }
    - id: c
      text: { en: "Pods labeled `role: client` in namespaces labeled `team: alpha`" }
    - id: d
      text: { en: "All Pods in namespaces labeled `team: alpha`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When `namespaceSelector` and `podSelector` are in the same `from` element, both must match (AND): only `role: client` Pods in `team: alpha` namespaces are allowed. Written as two separate elements, they would be combined with OR.
  options:
    a:
      en: |
        This would be the result of two separate `from` elements (each starting with `-`), which are combined with OR. Here both selectors are in one element.
    b:
      en: |
        The `namespaceSelector` in the same element restricts the namespaces to those labeled `team: alpha`.
    d:
      en: |
        The `podSelector` in the same element restricts the Pods to those labeled `role: client`.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
