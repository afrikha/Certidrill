id: kcna-2c-kubelet-journalctl
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A worker node is `NotReady`. You log in to the node, where the kubelet runs as a systemd service, and you want to read the kubelet's recent log messages.

    Which command should you run on the node?
body:
  options:
    - id: a
      text: { en: "`kubectl logs kubelet -n kube-system`" }
    - id: b
      text: { en: "`crictl images`" }
    - id: c
      text: { en: "`kubectl get events -n kube-node-lease`" }
    - id: d
      text: { en: "`journalctl -u kubelet`" }
answer: { optionId: d }
explanation:
  correct:
    en: "The kubelet is not a Pod: it is a service of the node's operating system. On systemd-based systems its logs are in the journal, so `journalctl -u kubelet` shows them; `systemctl status kubelet` shows whether the service runs."
  options:
    a:
      en: "`kubectl logs` reads the logs of containers in Pods. The kubelet is not a Pod in `kube-system`, and with the node NotReady the API server may not even get data from it."
    b:
      en: "`crictl images` lists the container images present on the node through the CRI runtime. It does not show kubelet log messages."
    c:
      en: "The `kube-node-lease` namespace holds the Lease objects that the kubelets renew as heartbeats. It does not contain the kubelet's log messages."
references:
  - title: Troubleshooting Clusters
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/
