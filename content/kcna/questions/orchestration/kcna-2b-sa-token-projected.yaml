id: kcna-2b-sa-token-projected
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Kubernetes v1.37, how does a Pod normally receive its ServiceAccount token?
body:
  options:
    - id: a
      text: { en: "The control plane creates a non-expiring token Secret for each ServiceAccount and mounts it" }
    - id: b
      text: { en: "The kubelet injects a static token into an environment variable of each container" }
    - id: c
      text: { en: "The Pod receives a client certificate signed by the cluster certificate authority" }
    - id: d
      text: { en: "The kubelet mounts a short-lived token from the TokenRequest API in a projected volume and rotates it" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Since v1.22, Kubernetes obtains a short-lived token through the TokenRequest API, and the kubelet mounts it as a projected volume and rotates it before it expires. The token is bound to the Pod, so it stops being valid when the Pod is deleted.
  options:
    a:
      en: |
        Kubernetes stopped creating long-lived token Secrets automatically in v1.24. Such tokens never expire and never rotate.
    b:
      en: |
        The token is delivered as a file in a projected volume, not as an environment variable, and it is rotated rather than static.
    c:
      en: |
        Client certificates are an authentication method for users and components. Pods authenticate with ServiceAccount tokens, which are signed JWTs.
references:
  - title: "Service Accounts"
    url: https://kubernetes.io/docs/concepts/security/service-accounts/
