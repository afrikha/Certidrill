id: kcna-2a-net-localhost-same-pod
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod runs two containers. The `app` container must call an HTTP API that the `helper` container of the same Pod serves on port 9000. Which address lets `app` reach it without creating any other object?
body:
  options:
    - id: a
      text: { en: "The node's IP address on port 9000" }
    - id: b
      text: { en: "The ClusterIP of a Service on port 9000" }
    - id: c
      text: { en: "`helper:9000`, resolved by the cluster DNS" }
    - id: d
      text: { en: "`localhost:9000`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Pod has its own network namespace, shared by all of its containers. The containers share the Pod's IP address and port space, so a process in one container reaches a process in another container of the same Pod over `localhost`.
  options:
    a:
      en: |
        Nothing listens on the node's IP address on port 9000 unless a `hostPort` is configured. The containers of a Pod don't need the node's address to talk to each other.
    b:
      en: |
        A Service is another object to create, and it could send the request to the `helper` container of a different replica. Containers of the same Pod talk over `localhost`.
    c:
      en: |
        The cluster DNS has records for Services and Pods, not for individual containers, so the container name `helper` doesn't resolve.
references:
  - title: "Services, Load Balancing, and Networking"
    url: https://kubernetes.io/docs/concepts/services-networking/
