id: kcna-2d-access-mode-rwx
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Pods of a web application run on several nodes and must all write uploaded files to the same shared volume.

    Which access mode must the PersistentVolumeClaim request?
body:
  options:
    - id: a
      text: { en: "`ReadWriteOnce`" }
    - id: b
      text: { en: "`ReadOnlyMany`" }
    - id: c
      text: { en: "`ReadWriteMany`" }
    - id: d
      text: { en: "`ReadWriteOncePod`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `ReadWriteMany` (RWX) means the volume can be mounted read-write by many nodes, which is what Pods spread across nodes need. The storage backend must support it (for example an NFS share).
  options:
    a:
      en: |
        `ReadWriteOnce` (RWO) allows read-write mounting by a single node only. Pods on other nodes could not mount the volume.
    b:
      en: |
        `ReadOnlyMany` (ROX) allows many nodes to mount the volume, but read-only, so the Pods could not write uploads.
    d:
      en: |
        `ReadWriteOncePod` (RWOP) restricts read-write access to a single Pod in the whole cluster, the opposite of what is needed.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
