id: kcna-2d-pvc-namespace-scope
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A PersistentVolumeClaim named `reports` exists in the `finance` namespace and uses a `ReadWriteMany` volume. A Pod in the `analytics` namespace must read the same files.

    Can the Pod reference the claim `reports` directly?
body:
  options:
    - id: a
      text: { en: "Yes, because PersistentVolumes are cluster-scoped" }
    - id: b
      text: { en: "Yes, because the volume uses the `ReadWriteMany` mode" }
    - id: c
      text: { en: "Yes, if the volume uses the `Retain` reclaim policy" }
    - id: d
      text: { en: "No, a claim must be in the same namespace as the Pod" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      PersistentVolumeClaims are namespaced, and a claim must exist in the same namespace as the Pod that uses it. Mounting a claim with a "Many" mode (ROX, RWX) is therefore only possible within one namespace.
  options:
    a:
      en: |
        The PersistentVolume is a cluster resource, but Pods never reference a PV directly: they reference a claim, and the claim is namespaced.
    b:
      en: |
        `ReadWriteMany` lets many nodes mount the volume, but only through claims in the Pod's own namespace.
    c:
      en: |
        The reclaim policy decides what happens to the volume after its claim is deleted. It does not change which namespaces can use the claim.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
