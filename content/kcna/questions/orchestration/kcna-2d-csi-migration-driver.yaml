id: kcna-2d-csi-migration-driver
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Existing PersistentVolumes in a cluster were created with a cloud provider's in-tree volume plugin. That in-tree plugin has since been removed from Kubernetes, and CSI migration redirects operations on these volumes.

    What must the administrator make sure of so that the volumes keep working?
body:
  options:
    - id: a
      text: { en: "The matching CSI driver is installed and configured" }
    - id: b
      text: { en: "Every volume is recreated as a `hostPath` volume" }
    - id: c
      text: { en: "The FlexVolume plugin interface is enabled on nodes" }
    - id: d
      text: { en: "Every claim is edited to name a new StorageClass" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CSI migration (stable since v1.25) directs operations against in-tree volumes to the corresponding CSI driver, with no change to existing StorageClasses, PersistentVolumes or claims. The administrator must install and configure that CSI driver: the core of Kubernetes does not install it.
  options:
    b:
      en: |
        `hostPath` mounts a directory of the node and would not give access to the existing cloud disks. It is also discouraged for application data.
    c:
      en: |
        FlexVolume is deprecated since v1.23; the recommended way to integrate external storage is an out-of-tree CSI driver.
    d:
      en: |
        Migration needs no change to existing claims or classes. Without the CSI driver, a new class name would not help.
references:
  - title: Volumes
    url: https://kubernetes.io/docs/concepts/storage/volumes/
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
