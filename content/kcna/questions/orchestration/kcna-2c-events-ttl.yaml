id: kcna-2c-events-ttl
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod of the `orders` Deployment was restarted several times yesterday evening. This morning, `kubectl describe pod` shows `Events: <none>` for that Pod, although the cluster uses the default kube-apiserver settings.

    What is the most likely reason?
body:
  options:
    - id: a
      text: { en: "Events are shown only while the Pod is in the Pending phase." }
    - id: b
      text: { en: "Events are kept only in the kubelet's memory and are lost when it restarts." }
    - id: c
      text: { en: "Events are recorded only when kubectl runs with a high verbosity level." }
    - id: d
      text: { en: "Events are retained for a limited time, one hour by default." }
answer: { optionId: d }
explanation:
  correct:
    en: "Events are API objects stored by the API server, but they are short-lived: the kube-apiserver `--event-ttl` flag sets how long they are retained, and its default is one hour. Events from yesterday evening have expired, so inspect events soon after a problem or collect them with a monitoring or logging tool."
  options:
    a:
      en: "Events are recorded during the whole life of a Pod: image pulls, probe failures, kills and restarts all produce events while the Pod is Running."
    b:
      en: "Events are persisted through the API server (in etcd), not only in the kubelet's memory. They disappear because of their time to live, not because of a kubelet restart."
    c:
      en: "The verbosity of kubectl changes only what the client prints about its own requests. It does not decide whether the cluster records events."
references:
  - title: kube-apiserver
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
