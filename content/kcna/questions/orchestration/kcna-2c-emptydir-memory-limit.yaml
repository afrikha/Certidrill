id: kcna-2c-emptydir-memory-limit
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container with a memory limit of `512Mi` writes temporary files to this volume:

    ```yaml
    volumes:
    - name: cache
      emptyDir:
        medium: Memory
    ```

    After a while, the container is killed with the reason `OOMKilled`, although the application itself uses only about 200Mi. What explains this?
body:
  options:
    - id: a
      text: { en: "The volume is stored on the node's disk, which slows down the application." }
    - id: b
      text: { en: "The volume is a tmpfs, and the files written to it count against the container's memory limit." }
    - id: c
      text: { en: "The volume is shared with other Pods of the node, which fill it up." }
    - id: d
      text: { en: "The volume is read-only, so each failed write uses more memory." }
answer: { optionId: b }
explanation:
  correct:
    en: "With `medium: Memory`, the `emptyDir` is mounted as a tmpfs (a RAM-backed filesystem). It is very fast, but the files a container writes there count against that container's memory limit, so a growing cache can make the container exceed its limit. Set a `sizeLimit` or raise the memory limit."
  options:
    a:
      en: "Without `medium`, an `emptyDir` is stored on the node's disk. `medium: Memory` stores it in RAM instead."
    c:
      en: "An `emptyDir` belongs to one Pod. Only the containers of that Pod can mount it."
    d:
      en: "An `emptyDir` is writable by the containers that mount it. Only some types, such as `configMap` and `secret`, are always read-only."
references:
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
