id: kcna-2b-secret-pod-create-access
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    User `sam` has no RBAC permission on Secrets in namespace `shop`, but can create Deployments there. Which statement is true?
body:
  options:
    - id: a
      text: { en: "Sam can read any Secret of `shop` by creating a Pod that mounts it" }
    - id: b
      text: { en: "Sam can't read any Secret, because RBAC blocks all access to Secrets" }
    - id: c
      text: { en: "Sam can read only the Secrets that are not marked `immutable: true`" }
    - id: d
      text: { en: "Sam can read the Secrets of every namespace in the cluster" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Anyone authorized to create a Pod in a namespace, directly or through a workload such as a Deployment, can use it to read any Secret of that namespace. Restrict workload creation rights and use separate namespaces to isolate sensitive Secrets.
  options:
    b:
      en: |
        RBAC blocks Sam's direct reads, but a Pod created through Sam's Deployment can mount any Secret of the namespace and expose its values.
    c:
      en: |
        Immutability prevents updates. An immutable Secret can still be mounted and read.
    d:
      en: |
        A Pod can only use Secrets from its own namespace, so the exposure is limited to `shop`.
references:
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
