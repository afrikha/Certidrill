id: kcna-2c-svc-selector-mismatch
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Service `web` in the `shop` namespace has no endpoints. Its Pods are Running and Ready. You collect the following:

    ```text
    $ kubectl get svc web -n shop -o wide
    NAME   TYPE        CLUSTER-IP     PORT(S)   SELECTOR
    web    ClusterIP   10.96.40.12    80/TCP    app=web
    $ kubectl get pods -n shop --show-labels
    NAME          READY   STATUS    LABELS
    web-7d4b-x2   1/1     Running   app=webapp,pod-template-hash=7d4b
    ```

    What should you fix?
body:
  options:
    - id: a
      text: { en: "Change the Service type to NodePort" }
    - id: b
      text: { en: "Set a `targetPort` that matches the container port" }
    - id: c
      text: { en: "Restart the CoreDNS Pods in `kube-system`" }
    - id: d
      text: { en: "Make the Service selector match the Pod labels" }
answer: { optionId: d }
explanation:
  correct:
    en: "A Service sends traffic to the Pods selected by its `spec.selector`. The selector asks for `app=web`, but the Pods are labeled `app=webapp`, so the EndpointSlice controller finds no Pod and the Service has no endpoints. Change the selector or the Pod template labels so that they match."
  options:
    a:
      en: "The Service type only decides how the Service is exposed. A NodePort Service with the same selector would still have no endpoints."
    b:
      en: "A wrong `targetPort` makes connections fail, but the Pods would still appear as endpoints. Here no endpoint exists at all because no Pod is selected."
    c:
      en: "CoreDNS resolves Service names to ClusterIPs. It plays no part in choosing which Pods are endpoints of a Service."
references:
  - title: Debug Services
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
