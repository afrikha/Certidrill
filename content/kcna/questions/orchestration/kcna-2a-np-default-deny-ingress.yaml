id: kcna-2a-np-default-deny-ingress
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Review this NetworkPolicy:

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: default-deny-ingress
      namespace: payments
    spec:
      podSelector: {}
      policyTypes:
      - Ingress
    ```

    What is its effect on the Pods of the namespace `payments`?
body:
  options:
    - id: a
      text: { en: "All inbound and outbound traffic is denied" }
    - id: b
      text: { en: "All inbound traffic is denied, and outbound traffic is not affected" }
    - id: c
      text: { en: "Only the Pods without labels are isolated" }
    - id: d
      text: { en: "All inbound traffic is allowed because there are no rules" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The empty `podSelector` selects every Pod of `payments`, and `policyTypes: [Ingress]` isolates them for ingress. Because the policy has no ingress rule, no inbound traffic is allowed unless another policy allows it. Egress stays unrestricted.
  options:
    a:
      en: |
        Denying outbound traffic too requires `Egress` in `policyTypes`. This policy lists only `Ingress`.
    c:
      en: |
        An empty `podSelector` (`{}`) selects every Pod of the namespace, whatever its labels.
    d:
      en: |
        Allowing all inbound traffic requires an `ingress` list with an empty rule (`- {}`). With no ingress rule, nothing is allowed.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
