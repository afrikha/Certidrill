id: kcna-2b-sa-workload-identity
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Kubernetes object gives an identity to the processes running in a Pod, so that they can authenticate to the API server?
body:
  options:
    - id: a
      text: { en: "ServiceAccount" }
    - id: b
      text: { en: "Role" }
    - id: c
      text: { en: "Secret" }
    - id: d
      text: { en: "Namespace" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A ServiceAccount is a namespaced API object that represents a non-human identity, used by workloads and automation. Unlike human users, who are managed outside Kubernetes, ServiceAccounts exist in the Kubernetes API.
  options:
    b:
      en: |
        A Role defines permissions. It is not an identity that a process can authenticate as.
    c:
      en: |
        A Secret stores sensitive data. Pods normally receive a short-lived ServiceAccount token, not a token stored in a Secret.
    d:
      en: |
        A namespace groups objects. It isn't an identity.
references:
  - title: "Service Accounts"
    url: https://kubernetes.io/docs/concepts/security/service-accounts/
