id: kcna-2b-supply-gatekeeper-rego
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team already writes its policies in Rego. It wants to enforce them on Kubernetes objects at admission, using constraint templates and constraints. Which tool should it use?
body:
  options:
    - id: a
      text: { en: "Kyverno" }
    - id: b
      text: { en: "ValidatingAdmissionPolicy" }
    - id: c
      text: { en: "Pod Security Admission" }
    - id: d
      text: { en: "OPA Gatekeeper" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Open Policy Agent policies are written in Rego. Gatekeeper brings OPA to Kubernetes as an admission webhook: constraint templates define new policy types, and constraints instantiate them with parameters. Gatekeeper can also audit existing objects.
  options:
    a:
      en: |
        Kyverno policies are written in YAML and CEL, not in Rego.
    b:
      en: |
        ValidatingAdmissionPolicy is built into Kubernetes and uses CEL expressions, not Rego.
    c:
      en: |
        Pod Security Admission applies only the three Pod Security Standards profiles. It doesn't run custom policies.
references:
  - title: "OPA for Kubernetes Admission Control"
    url: https://www.openpolicyagent.org/docs/kubernetes
