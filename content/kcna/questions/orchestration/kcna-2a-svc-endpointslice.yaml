id: kcna-2a-svc-endpointslice
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which object does the control plane create and update to list the IP addresses and ports of the Pods that match a Service's selector?
body:
  options:
    - id: a
      text: { en: "EndpointSlice" }
    - id: b
      text: { en: "ReplicaSet" }
    - id: c
      text: { en: "ServiceCIDR" }
    - id: d
      text: { en: "IngressClass" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The control plane automatically creates EndpointSlices for every Service that has a selector, and updates them as matching Pods come and go. By default, each slice holds up to 100 endpoints, with conditions such as `ready`. kube-proxy watches them, and they replace the Endpoints API, deprecated since v1.33.
  options:
    b:
      en: |
        A ReplicaSet keeps a given number of Pod replicas running. It doesn't track the backends of a Service.
    c:
      en: |
        A ServiceCIDR defines an IP range from which ClusterIP addresses are allocated to Services.
    d:
      en: |
        An IngressClass names the controller that implements Ingress resources.
references:
  - title: "EndpointSlices"
    url: https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/
