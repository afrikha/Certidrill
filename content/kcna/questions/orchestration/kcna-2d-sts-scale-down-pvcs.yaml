id: kcna-2d-sts-scale-down-pvcs
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A StatefulSet named `db` uses `volumeClaimTemplates` with default settings. It is scaled down from 3 replicas to 1.

    What happens to the claims `data-db-1` and `data-db-2`?
body:
  options:
    - id: a
      text: { en: "They are deleted with their Pods" }
    - id: b
      text: { en: "They are kept, with their data" }
    - id: c
      text: { en: "They are attached to Pod `db-0`" }
    - id: d
      text: { en: "They are kept, but their data is erased" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Scaling down a StatefulSet does not delete the volumes associated with it, to keep the data safe. If the StatefulSet is scaled up again, the new Pods `db-1` and `db-2` remount their existing claims.
  options:
    a:
      en: |
        Claims are only deleted on scale-down when `persistentVolumeClaimRetentionPolicy.whenScaled` is set to `Delete`. The default is `Retain`.
    c:
      en: |
        Each claim belongs to one Pod ordinal. Pod `db-0` keeps using only `data-db-0`.
    d:
      en: |
        The StatefulSet does not touch the volumes or their content when it scales down.
references:
  - title: StatefulSets
    url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
