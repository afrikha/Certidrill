id: kcna-2d-pvc-without-class
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cluster has a default StorageClass. A user creates a PersistentVolumeClaim that does not set `storageClassName`.

    What happens?
body:
  options:
    - id: a
      text: { en: "The claim stays unbound until an administrator creates a volume" }
    - id: b
      text: { en: "The claim gets the default class and a volume is provisioned" }
    - id: c
      text: { en: "The claim is rejected because the class is required" }
    - id: d
      text: { en: "The claim binds only to volumes that have no class" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a default StorageClass exists, the `DefaultStorageClass` admission controller adds `storageClassName` pointing to the default class to a claim that omits it. The class's provisioner then creates the volume dynamically.
  options:
    a:
      en: |
        Manual volumes are only needed without dynamic provisioning. Here the default class provisions the volume.
    c:
      en: |
        `storageClassName` is optional in a claim; when it is missing, the default class is filled in.
    d:
      en: |
        Binding only to volumes without a class is the behaviour of a claim with `storageClassName: ""`, not of a claim that omits the field.
references:
  - title: Dynamic Volume Provisioning
    url: https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/
