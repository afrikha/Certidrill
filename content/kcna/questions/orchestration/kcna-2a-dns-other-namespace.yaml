id: kcna-2a-dns-other-namespace
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod in the namespace `web` must reach the Service `db` in the namespace `data`. Which is the shortest name that the Pod can use?
body:
  options:
    - id: a
      text: { en: "`db`" }
    - id: b
      text: { en: "`db.web`" }
    - id: c
      text: { en: "`data.db`" }
    - id: d
      text: { en: "`db.data`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      DNS queries that don't name a namespace are limited to the Pod's namespace. To reach a Service in another namespace, add the namespace: `db.data` is expanded by the search list to `db.data.svc.cluster.local`.
  options:
    a:
      en: |
        A name without a namespace is looked up in the Pod's own namespace, so `db` would look for a Service `db` in `web`.
    b:
      en: |
        `db.web` names a Service `db` in the namespace `web`, which doesn't exist.
    c:
      en: |
        The Service name comes before the namespace, so `data.db` would look for a Service `data` in a namespace `db`.
references:
  - title: "DNS for Services and Pods"
    url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
