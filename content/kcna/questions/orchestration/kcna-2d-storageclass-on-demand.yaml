id: kcna-2d-storageclass-on-demand
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Administrators no longer want to create volumes by hand. Volumes must be created automatically, with a given provisioner and parameters, whenever users create claims.

    Which object should the administrators define?
body:
  options:
    - id: a
      text: { en: "A PersistentVolume" }
    - id: b
      text: { en: "A VolumeSnapshotClass" }
    - id: c
      text: { en: "A ResourceQuota" }
    - id: d
      text: { en: "A StorageClass" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Dynamic provisioning is based on the StorageClass object of the `storage.k8s.io` API group. Each StorageClass names a provisioner and the parameters to pass to it, and a claim that requests the class gets a volume created on demand.
  options:
    a:
      en: |
        A PersistentVolume represents one existing piece of storage. Creating PVs in advance is static provisioning, the manual work the administrators want to stop.
    b:
      en: |
        A VolumeSnapshotClass describes how volume snapshots are taken. It does not create volumes for claims.
    c:
      en: |
        A ResourceQuota limits how much storage or how many claims a namespace can use. It does not create any volume.
references:
  - title: Dynamic Volume Provisioning
    url: https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/
