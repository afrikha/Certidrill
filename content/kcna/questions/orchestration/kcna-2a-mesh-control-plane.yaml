id: kcna-2a-mesh-control-plane
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a service mesh, which part configures the proxies and issues the certificates used for mutual TLS?
body:
  options:
    - id: a
      text: { en: "The data plane" }
    - id: b
      text: { en: "The CNI plugin" }
    - id: c
      text: { en: "The control plane" }
    - id: d
      text: { en: "kube-proxy" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A service mesh has two parts: the proxies form the data plane, and the control plane manages them as a whole. In Istio, the control plane (istiod) also acts as the certificate authority that signs and rotates workload certificates.
  options:
    a:
      en: |
        The data plane is the set of proxies that carry the traffic. It receives its configuration and certificates from the control plane.
    b:
      en: |
        The CNI plugin gives Pods their network and IP addresses. It doesn't manage mesh proxies or their certificates.
    d:
      en: |
        kube-proxy programs node rules for Service virtual IP addresses. It is not part of a service mesh.
references:
  - title: "What is a service mesh?"
    url: https://linkerd.io/what-is-a-service-mesh/
  - title: "Security"
    url: https://istio.io/latest/docs/concepts/security/
