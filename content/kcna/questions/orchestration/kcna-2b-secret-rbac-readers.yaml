id: kcna-2b-secret-rbac-readers
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which control limits which users and ServiceAccounts can read Secrets through the Kubernetes API?
body:
  options:
    - id: a
      text: { en: "Pod Security Admission in `enforce` mode" }
    - id: b
      text: { en: "Encryption at rest with a KMS provider" }
    - id: c
      text: { en: "A LimitRange in each namespace" }
    - id: d
      text: { en: "RBAC rules that grant access to Secrets only to the subjects that need it" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Anyone with API access to a Secret can read it, so access must be restricted with RBAC following least privilege: few subjects, and only the verbs they need. Encryption at rest is complementary: it protects etcd, not the API.
  options:
    a:
      en: |
        Pod Security Admission checks the security settings of Pods. It doesn't decide who may read Secrets.
    b:
      en: |
        Encryption at rest protects the data stored in etcd. The API server decrypts Secrets for every authorized reader.
    c:
      en: |
        A LimitRange sets resource defaults and limits for containers. It has no effect on API access.
references:
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
