id: kcna-2d-two-default-classes
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    By mistake, two StorageClasses carry the annotation `storageclass.kubernetes.io/is-default-class: "true"`: `standard`, created a year ago, and `premium`, created yesterday. A user creates a claim without `storageClassName`.

    Which class does the claim get?
body:
  options:
    - id: a
      text: { en: "`standard`, the oldest default class" }
    - id: b
      text: { en: "None: the claim is rejected until one default remains" }
    - id: c
      text: { en: "`premium`, the most recently created default class" }
    - id: d
      text: { en: "None: the claim binds only to volumes with no class" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When more than one StorageClass is marked as default, a claim with no `storageClassName` gets the most recently created default class. The documentation still recommends keeping only one default class in a cluster.
  options:
    a:
      en: |
        Kubernetes picks the newest default class, not the oldest.
    b:
      en: |
        Several default classes are allowed; the claim is created with the most recently created one.
    d:
      en: |
        Binding only to volumes with no class happens when a claim sets `storageClassName: ""`, not when it omits the field.
references:
  - title: Storage Classes
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
  - title: Change the default StorageClass
    url: https://kubernetes.io/docs/tasks/administer-cluster/change-default-storage-class/
