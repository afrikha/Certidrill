id: kcna-2b-secret-list-reveals
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Role in namespace `shop` grants the verb `list` on `secrets`, but not `get`. What can a user bound to this Role do?
body:
  options:
    - id: a
      text: { en: "See only the names of the Secrets in `shop`" }
    - id: b
      text: { en: "Read the contents of every Secret in `shop`" }
    - id: c
      text: { en: "Nothing, because `list` requires the `get` verb" }
    - id: d
      text: { en: "Read only the Secrets that their own Pods reference" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `get`, `list` and `watch` all return the full content of objects. Granting `list` on Secrets lets the subject fetch the contents of all the Secrets of the namespace, so it should be reserved for the most privileged components.
  options:
    a:
      en: |
        `list` returns the full objects, data included, not only their names.
    c:
      en: |
        Verbs are independent in RBAC. `list` works without `get`.
    d:
      en: |
        RBAC doesn't look at which Pods reference a Secret. `list` returns all the Secrets of the namespace.
references:
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
