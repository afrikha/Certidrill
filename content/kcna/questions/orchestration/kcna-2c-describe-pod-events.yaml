id: kcna-2c-describe-pod-events
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod named `web-1` has been in the `ContainerCreating` state for several minutes. You want a readable summary of the Pod, including the recent events that explain what the kubelet and the scheduler did.

    Which command should you run first?
body:
  options:
    - id: a
      text: { en: "`kubectl logs web-1`" }
    - id: b
      text: { en: "`kubectl describe pod web-1`" }
    - id: c
      text: { en: "`kubectl get pod web-1`" }
    - id: d
      text: { en: "`kubectl port-forward pod/web-1 8080:80`" }
answer: { optionId: b }
explanation:
  correct:
    en: "`kubectl describe pod` prints a detailed description of the Pod, including container states and the related events (scheduling, image pulls, mounts, kills). The Kubernetes debugging guide makes it the first step for a Pod that does not start, because the Events section usually names the cause."
  options:
    a:
      en: "`kubectl logs` shows what the application wrote. A container that is still being created has not run yet, so there are no logs to read."
    c:
      en: "`kubectl get pod` shows only a one-line status (READY, STATUS, RESTARTS, AGE). It does not list the events that explain why the Pod is stuck."
    d:
      en: "`kubectl port-forward` opens a tunnel to a running Pod for testing. It gives no information about why the containers are not created."
references:
  - title: Debug Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
  - title: kubectl describe
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_describe/
