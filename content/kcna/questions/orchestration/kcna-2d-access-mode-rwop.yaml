id: kcna-2d-access-mode-rwop
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A database volume is provisioned by a CSI driver. You must guarantee that only one Pod in the whole cluster can mount it read-write, even if a second Pod is scheduled on the same node.

    Which access mode should the PersistentVolumeClaim use?
body:
  options:
    - id: a
      text: { en: "`ReadWriteOncePod`" }
    - id: b
      text: { en: "`ReadWriteOnce`" }
    - id: c
      text: { en: "`ReadOnlyMany`" }
    - id: d
      text: { en: "`ReadWriteMany`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `ReadWriteOncePod` (RWOP) lets a single Pod mount the volume read-write. It is stable since Kubernetes v1.29 and supported only for CSI volumes, which is the case here.
  options:
    b:
      en: |
        `ReadWriteOnce` limits read-write access to a single node, not a single Pod: several Pods running on that node can still use the volume.
    c:
      en: |
        `ReadOnlyMany` lets many nodes mount the volume read-only. It neither gives write access nor limits the volume to one Pod.
    d:
      en: |
        `ReadWriteMany` lets many nodes mount the volume read-write, the opposite of an exclusive volume.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
