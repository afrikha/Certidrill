id: kcna-2d-sts-pvc-name
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A StatefulSet named `web` has 3 replicas and this claim template:

    ```yaml
    volumeClaimTemplates:
    - metadata:
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    ```

    Which PersistentVolumeClaim does Pod `web-1` use?
body:
  options:
    - id: a
      text: { en: "`www-web-1`" }
    - id: b
      text: { en: "`web-www-1`" }
    - id: c
      text: { en: "`www-1`" }
    - id: d
      text: { en: "`web-1-www`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each claim is named after the template and the Pod: `<template name>-<Pod name>`. Pod `web-1` therefore uses `www-web-1`, and `web-0` and `web-2` use `www-web-0` and `www-web-2`.
  options:
    b:
      en: |
        The template name comes first, followed by the Pod name (`web-1`), not the StatefulSet name followed by the template name.
    c:
      en: |
        The claim name includes the full Pod name, not only the ordinal.
    d:
      en: |
        The order is reversed: the template name comes first.
references:
  - title: StatefulSet Basics
    url: https://kubernetes.io/docs/tutorials/stateful-application/basic-stateful-set/
