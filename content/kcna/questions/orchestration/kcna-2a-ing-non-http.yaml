id: kcna-2a-ing-non-http
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application uses a custom binary protocol over TCP port 7000. Clients outside the cluster must reach it through the cloud provider's load balancer. What should you create?
body:
  options:
    - id: a
      text: { en: "An Ingress with a rule for port 7000" }
    - id: b
      text: { en: "A Service of type ExternalName" }
    - id: c
      text: { en: "A headless Service" }
    - id: d
      text: { en: "A Service of type LoadBalancer" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Ingress handles HTTP and HTTPS only; for other protocols, the Kubernetes documentation points to NodePort or LoadBalancer Services. Because the clients must use the cloud provider's load balancer, a LoadBalancer Service is the right choice.
  options:
    a:
      en: |
        An Ingress exposes only HTTP and HTTPS routes. It doesn't expose arbitrary ports or protocols.
    b:
      en: |
        An ExternalName Service is a DNS alias to an external name. It doesn't receive traffic from outside the cluster.
    c:
      en: |
        A headless Service has no virtual IP and is resolved by the cluster DNS for clients inside the cluster. It doesn't expose the application externally.
references:
  - title: "Ingress"
    url: https://kubernetes.io/docs/concepts/services-networking/ingress/
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
