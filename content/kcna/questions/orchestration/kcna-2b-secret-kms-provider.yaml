id: kcna-2b-secret-kms-provider
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are configuring encryption at rest for Secrets. The security team requires the encryption key to be kept in an external key management service, not in a file on the control plane nodes. Which provider should you use?
body:
  options:
    - id: a
      text: { en: "`aescbc`" }
    - id: b
      text: { en: "`secretbox`" }
    - id: c
      text: { en: "`identity`" }
    - id: d
      text: { en: "`kms` (v2)" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The KMS v2 provider uses envelope encryption: the data encryption keys are themselves protected by a key held in an external key management service. It is stable since v1.29 and is the recommended choice when you use a third-party key management tool.
  options:
    a:
      en: |
        `aescbc` uses a local key stored in the configuration file, and it is not recommended because of CBC's weakness to padding oracle attacks.
    b:
      en: |
        `secretbox` is a strong cipher, but its key is stored in the configuration file on the control plane nodes.
    c:
      en: |
        `identity` doesn't encrypt anything: it writes data as is.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
