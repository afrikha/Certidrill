id: kcna-2b-rbac-additive
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement about Kubernetes RBAC permissions is true?
body:
  options:
    - id: a
      text: { en: "A rule in a Role can deny a verb granted by a ClusterRole" }
    - id: b
      text: { en: "Permissions are purely additive: there are no deny rules" }
    - id: c
      text: { en: "Rules are evaluated in order, and the first matching rule wins" }
    - id: d
      text: { en: "A subject without any binding can read all namespaces" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      RBAC rules only grant access. A request is allowed when at least one Role or ClusterRole bound to the subject permits it, and refused otherwise. To remove access, you remove or narrow the grant.
  options:
    a:
      en: |
        RBAC has no deny rules. A Role can only add permissions; it can't take away a permission granted by another binding.
    c:
      en: |
        Order doesn't matter: a request is allowed if any role bound to the subject grants it.
    d:
      en: |
        Anything that is not granted is refused. Without a binding, a subject gets nothing beyond the default API discovery permissions.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
