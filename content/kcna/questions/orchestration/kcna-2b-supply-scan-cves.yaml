id: kcna-2b-supply-scan-cves
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which practice detects known vulnerabilities (CVEs) in the packages of a container image before the image is deployed?
body:
  options:
    - id: a
      text: { en: "Scanning the image in the CI/CD pipeline" }
    - id: b
      text: { en: "Signing the image" }
    - id: c
      text: { en: "Referencing the image by digest" }
    - id: d
      text: { en: "Enforcing the Restricted Pod Security Standard" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An image scanner compares the packages of an image with vulnerability databases and reports known CVEs, often with a CVSS score. Running the scan in the pipeline, with rules that stop unpatched images, keeps them out of production.
  options:
    b:
      en: |
        A signature proves who built the image and that it wasn't modified. It says nothing about vulnerabilities.
    c:
      en: |
        A digest guarantees that the same image runs everywhere. It doesn't detect vulnerabilities in it.
    d:
      en: |
        The Restricted profile restricts the security settings of Pods. It doesn't inspect the packages in images.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
