id: kcna-2c-imagepullbackoff-cause
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new Pod shows the following status:

    ```text
    NAME      READY   STATUS             RESTARTS   AGE
    web-1     0/1     ImagePullBackOff   0          3m
    ```

    What is the most likely cause?
body:
  options:
    - id: a
      text: { en: "The container used more memory than its limit and was killed." }
    - id: b
      text: { en: "The kubelet could not pull the image, for example because of a wrong name or missing registry credentials." }
    - id: c
      text: { en: "The container starts and then exits with an error again and again." }
    - id: d
      text: { en: "No node has enough free CPU to run the Pod." }
answer: { optionId: b }
explanation:
  correct:
    en: "`ImagePullBackOff` means the container could not start because Kubernetes could not pull its image, for example because the image name or tag is invalid, or because the image is in a private registry and the Pod has no `imagePullSecrets`. Kubernetes keeps retrying with an increasing delay. The events of `kubectl describe pod` show the exact pull error."
  options:
    a:
      en: "A container killed for exceeding its memory limit is reported as `OOMKilled`. That can only happen after the image was pulled and the container ran."
    c:
      en: "A container that repeatedly starts and exits leads to `CrashLoopBackOff`. Here the container never started, and RESTARTS is 0."
    d:
      en: "A Pod that no node can fit stays `Pending` with a `FailedScheduling` event. Image pulls happen only after the Pod is assigned to a node."
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
