id: kcna-2d-class-default-reclaim
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Claims in the `shop` namespace use the following StorageClass. A user deletes one of these claims.

    ```yaml
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: standard-disk
    provisioner: disk.csi.example.com
    parameters:
      type: hdd
    ```

    What happens to the dynamically provisioned volume?
body:
  options:
    - id: a
      text: { en: "The PersistentVolume and the backend disk are deleted" }
    - id: b
      text: { en: "The PersistentVolume becomes `Released` and the disk is kept" }
    - id: c
      text: { en: "The PersistentVolume is scrubbed and becomes `Available`" }
    - id: d
      text: { en: "The PersistentVolume stays `Bound` to the deleted claim" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Dynamically provisioned volumes inherit the reclaim policy of their StorageClass, and a StorageClass without `reclaimPolicy` defaults to `Delete`. Deleting the claim therefore removes both the PersistentVolume object and the storage asset in the backend.
  options:
    b:
      en: |
        This is the `Retain` behaviour. The class would need `reclaimPolicy: Retain` explicitly.
    c:
      en: |
        Scrubbing and reuse describe the deprecated `Recycle` policy, which a StorageClass does not use (it accepts `Delete` or `Retain`).
    d:
      en: |
        Once the claim is deleted, the volume is no longer bound to it: the reclaim policy then applies.
references:
  - title: Storage Classes
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
