id: kcna-2c-dns-other-namespace
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod in the `frontend` namespace must call the Service `api` in the `backend` namespace. From the Pod, the following command fails with a "can't find" error, although the Service exists and has endpoints:

    ```bash
    nslookup api
    ```

    What should the Pod use to reach the Service?
body:
  options:
    - id: a
      text: { en: "The name `api.frontend`" }
    - id: b
      text: { en: "The name `api.backend`" }
    - id: c
      text: { en: "The name of one of the `api` Pods" }
    - id: d
      text: { en: "The name `api.kube-system`" }
answer: { optionId: b }
explanation:
  correct:
    en: "A short Service name resolves only within the Pod's own namespace, because the DNS search list starts with that namespace. To reach a Service in another namespace, include the namespace: `api.backend` (or the full name `api.backend.svc.cluster.local` with the default cluster domain)."
  options:
    a:
      en: "`api.frontend` points to a Service named `api` in the `frontend` namespace, which does not exist. The Service is in `backend`."
    c:
      en: "Pod names are not registered in cluster DNS like Service names, and calling one Pod would bypass the Service's load balancing."
    d:
      en: "`kube-system` holds cluster components such as CoreDNS, not the `api` Service. The name must contain the namespace of the Service: `backend`."
references:
  - title: Debugging DNS Resolution
    url: https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/
