id: kcna-2a-net-pod-ip-ephemeral
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Deployment replaces one of its Pods after the Pod's node fails. Which statement about the IP address of the new Pod is true?
body:
  options:
    - id: a
      text: { en: "It keeps the IP address of the Pod it replaces, so clients can keep using that address" }
    - id: b
      text: { en: "It gets no IP address until a Service selects it, so clients must wait for the Service" }
    - id: c
      text: { en: "It usually gets a different IP address, so clients should use a Service rather than Pod IPs" }
    - id: d
      text: { en: "It uses the IP address of its new node, so clients must use the node's address instead" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each Pod gets its own IP address, but Pods are ephemeral: a replacement Pod is a new object with a new address. A Service gives a stable IP address and DNS name in front of a set of Pods that changes over time.
  options:
    a:
      en: |
        The replacement is a new Pod object and gets its own address from the pod network. Pod IPs are not carried over from the Pod it replaces.
    b:
      en: |
        Every Pod gets an IP address when its network is set up, whether or not a Service selects it.
    d:
      en: |
        A Pod uses its node's IP address only when it runs with `hostNetwork: true`. By default, each Pod has its own IP address.
references:
  - title: "Services, Load Balancing, and Networking"
    url: https://kubernetes.io/docs/concepts/services-networking/
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
