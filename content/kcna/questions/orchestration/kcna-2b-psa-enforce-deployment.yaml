id: kcna-2b-psa-enforce-deployment
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Namespace `shop` has a single Pod Security Admission label: `pod-security.kubernetes.io/enforce: restricted`. You apply a Deployment whose Pod template runs a privileged container. What happens?
body:
  options:
    - id: a
      text: { en: "The Deployment is rejected when you apply it" }
    - id: b
      text: { en: "The Pods are created, and a warning is returned to you" }
    - id: c
      text: { en: "The Deployment is created, but its Pods are rejected when the ReplicaSet tries to create them" }
    - id: d
      text: { en: "The Pods are created, and the kubelet then stops the privileged container" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In `enforce` mode, Pod Security Admission checks Pod objects, not workload resources. The Deployment and its ReplicaSet are created, but each Pod the ReplicaSet tries to create is rejected, so no replica runs. Adding the `warn` label would show the problem when the Deployment is applied.
  options:
    a:
      en: |
        `enforce` mode is not applied to workload resources such as Deployments, only to the Pods they create.
    b:
      en: |
        Warnings come from `warn` mode, which is not set here. In `enforce` mode, violating Pods are rejected.
    d:
      en: |
        Pod Security Admission works in the API server. Rejected Pods are never stored, so no kubelet ever runs them.
references:
  - title: "Pod Security Admission"
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
