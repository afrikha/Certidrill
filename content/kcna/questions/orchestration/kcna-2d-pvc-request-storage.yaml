id: kcna-2d-pvc-request-storage
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer needs 10 GiB of durable storage for a Pod in the `shop` namespace.

    Which object should the developer create in that namespace to request the storage?
body:
  options:
    - id: a
      text: { en: "A PersistentVolume" }
    - id: b
      text: { en: "A PersistentVolumeClaim" }
    - id: c
      text: { en: "A StorageClass" }
    - id: d
      text: { en: "A VolumeSnapshotClass" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A PersistentVolumeClaim (PVC) is a user's request for storage: size, access mode and optionally a StorageClass. It is a namespaced object, and the Pod refers to the claim in its `volumes` section. The control plane then binds the claim to a matching PersistentVolume.
  options:
    a:
      en: |
        A PersistentVolume is the piece of storage itself, a cluster resource usually created by an administrator or by a provisioner. Users request storage through a claim, not by creating PVs.
    c:
      en: |
        A StorageClass is defined by administrators to describe a kind of storage and its provisioner. It does not request any storage by itself.
    d:
      en: |
        A VolumeSnapshotClass sets the attributes of volume snapshots. It has nothing to do with requesting a new volume.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
