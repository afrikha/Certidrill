id: kcna-2d-csi-kubelet-node-plugin
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod that uses a CSI volume is scheduled on a node. The volume must be mounted on that node before the containers start.

    Which node component calls the CSI driver's node plugin to make the volume available to the Pod?
body:
  options:
    - id: a
      text: { en: "kube-proxy" }
    - id: b
      text: { en: "The kubelet" }
    - id: c
      text: { en: "kube-scheduler" }
    - id: d
      text: { en: "The container runtime" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The kubelet manages the volumes of the Pods on its node. It calls the CSI driver's node plugin through a Unix domain socket on the host, and the driver mounts the volume so that the kubelet can give it to the containers.
  options:
    a:
      en: |
        kube-proxy programs Service networking rules on the node. It has no role in mounting volumes.
    c:
      en: |
        kube-scheduler is a control plane component that chooses a node for the Pod. It does not mount volumes.
    d:
      en: |
        The container runtime runs the containers and is called by the kubelet through the CRI. It does not talk to CSI drivers.
references:
  - title: Deploying CSI Driver on Kubernetes
    url: https://github.com/kubernetes-csi/docs/blob/master/book/src/deploying.md
