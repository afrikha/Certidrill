id: kcna-2c-node-diskpressure
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    `kubectl describe node node-4` shows the following condition:

    ```text
    Type           Status   Reason
    ----           ------   ------
    DiskPressure   True     KubeletHasDiskPressure
    ```

    What does this condition mean?
body:
  options:
    - id: a
      text: { en: "The node's free disk space is low, and the kubelet may evict Pods to reclaim it." }
    - id: b
      text: { en: "A PersistentVolume attached to the node is full." }
    - id: c
      text: { en: "The node has too many processes running." }
    - id: d
      text: { en: "The node's network is not correctly configured." }
answer: { optionId: a }
explanation:
  correct:
    en: "`DiskPressure` set to `True` means disk capacity on the node is low. The kubelet first tries to reclaim space (removing dead containers and unused images), then may evict Pods, and the node is tainted so that the scheduler avoids it."
  options:
    b:
      en: "Node conditions describe the node's own filesystems (the kubelet's and the container images'). A full PersistentVolume does not set `DiskPressure`."
    c:
      en: "Too many processes on the node is reported by the `PIDPressure` condition."
    d:
      en: "A badly configured node network is reported by the `NetworkUnavailable` condition."
references:
  - title: Node Status
    url: https://kubernetes.io/docs/reference/node/node-status/
  - title: Node-pressure Eviction
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/
