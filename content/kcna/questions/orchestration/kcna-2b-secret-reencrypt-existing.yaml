id: kcna-2b-secret-reencrypt-existing
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You enabled encryption at rest for Secrets and restarted the kube-apiserver. What happens to the Secrets that existed before the change?
body:
  options:
    - id: a
      text: { en: "The API server encrypts all existing Secrets in etcd when it starts" }
    - id: b
      text: { en: "They are encrypted the next time a Pod reads them" }
    - id: c
      text: { en: "They stay unencrypted until they are rewritten, for example with `kubectl replace`" }
    - id: d
      text: { en: "They are deleted and must be recreated from their manifests" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The first provider encrypts data when it is written, so existing Secrets stay as they were until they are rewritten. The documentation rewrites every Secret with `kubectl get secrets --all-namespaces -o json | kubectl replace -f -`.
  options:
    a:
      en: |
        The API server doesn't rewrite stored data at startup. Only data written after the change is encrypted.
    b:
      en: |
        Reading a Secret doesn't write it back to etcd, so reads never encrypt existing data.
    d:
      en: |
        Enabling encryption deletes nothing. The existing Secrets remain in etcd as they were.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
