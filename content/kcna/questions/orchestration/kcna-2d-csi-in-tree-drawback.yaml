id: kcna-2d-csi-in-tree-drawback
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before the Container Storage Interface (CSI), Kubernetes volume plugins were "in-tree".

    Which problem of in-tree volume plugins does CSI solve?
body:
  options:
    - id: a
      text: { en: "Vendors had to add their code to the core Kubernetes repository and releases" }
    - id: b
      text: { en: "In-tree plugins could only provide ephemeral volumes, never persistent ones" }
    - id: c
      text: { en: "In-tree plugins could not be used through PersistentVolumeClaims" }
    - id: d
      text: { en: "In-tree plugins required a storage sidecar container in every Pod" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In-tree plugins were compiled and shipped with the core Kubernetes binaries, so storage vendors had to check code into Kubernetes and follow its release process. With CSI, vendors write and deploy drivers without touching the core Kubernetes code.
  options:
    b:
      en: |
        In-tree plugins backed PersistentVolumes, for example cloud provider disks. Persistence was not the problem.
    c:
      en: |
        In-tree volumes were used through PersistentVolumes and claims, including with dynamic provisioning.
    d:
      en: |
        In-tree plugins ran inside the Kubernetes components themselves; they did not need a sidecar in each Pod.
references:
  - title: Container Storage Interface (CSI) for Kubernetes GA
    url: https://kubernetes.io/blog/2019/01/15/container-storage-interface-ga/
  - title: Volumes
    url: https://kubernetes.io/docs/concepts/storage/volumes/
