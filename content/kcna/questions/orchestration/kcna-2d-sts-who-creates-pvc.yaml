id: kcna-2d-sts-who-creates-pvc
objective: "2.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A StatefulSet with `volumeClaimTemplates` is created in a cluster where a StorageClass uses a CSI driver for dynamic provisioning.

    Which statement correctly describes how the storage objects are created?
body:
  options:
    - id: a
      text: { en: "The kubelet creates each claim, and the StatefulSet controller creates each volume" }
    - id: b
      text: { en: "The StatefulSet controller creates each claim, and the class's provisioner creates each volume" }
    - id: c
      text: { en: "The StatefulSet controller creates each volume, and the scheduler binds each claim" }
    - id: d
      text: { en: "An administrator creates each claim, and the StatefulSet controller binds each volume" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The StatefulSet controller creates one PersistentVolumeClaim per Pod from the templates. Each claim then triggers dynamic provisioning: the provisioner of the StorageClass (here the CSI driver, through its external-provisioner) creates the volume, which is bound to the claim.
  options:
    a:
      en: |
        The kubelet mounts volumes on its node; it does not create claims. The StatefulSet controller never creates volumes.
    c:
      en: |
        The StatefulSet controller creates claims, not volumes. Volumes come from the StorageClass's provisioner.
    d:
      en: |
        The point of `volumeClaimTemplates` is that nobody creates the claims by hand: the StatefulSet controller does it.
references:
  - title: StatefulSet Basics
    url: https://kubernetes.io/docs/tutorials/stateful-application/basic-stateful-set/
  - title: Dynamic Volume Provisioning
    url: https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/
