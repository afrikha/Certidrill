id: kcna-2b-rbac-pods-log
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Role must let a support engineer read the logs of the Pods in namespace `shop` with `kubectl logs`. Which entry must the rule's `resources` list contain, in addition to `pods`?
body:
  options:
    - id: a
      text: { en: "`pods/exec`" }
    - id: b
      text: { en: "`pods/log`" }
    - id: c
      text: { en: "`pods/status`" }
    - id: d
      text: { en: "`events`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Container logs are served by the `log` subresource of Pods. RBAC names a subresource with a slash, so the rule needs `pods/log` with the `get` verb. Access to `pods` alone lets the engineer read Pod objects but not their logs.
  options:
    a:
      en: |
        `pods/exec` lets a subject run commands inside containers (`kubectl exec`), which is much more than reading logs.
    c:
      en: |
        The `status` subresource holds the state reported for the Pod. It doesn't serve container logs.
    d:
      en: |
        Events record what happened to objects (scheduling, image pulls, restarts). They don't contain the application's logs.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
