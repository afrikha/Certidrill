id: kcna-2b-rbac-auth-can-i
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You want to check whether the ServiceAccount `build-bot` in namespace `ci` is allowed to create Deployments in namespace `shop`, and get a yes or no answer. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl auth can-i create deployments -n shop --as system:serviceaccount:ci:build-bot`" }
    - id: b
      text: { en: "`kubectl get rolebindings -n shop -o wide`" }
    - id: c
      text: { en: "`kubectl describe serviceaccount build-bot -n ci`" }
    - id: d
      text: { en: "`kubectl create token build-bot -n ci`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl auth can-i` asks the API server whether a verb on a resource is allowed and answers yes or no. With `--as`, an administrator checks another identity; a ServiceAccount's username is `system:serviceaccount:<namespace>:<name>`.
  options:
    b:
      en: |
        This lists the RoleBindings of `shop`, but you would still have to read every referenced role and every ClusterRoleBinding yourself. It gives no yes or no answer.
    c:
      en: |
        Describing the ServiceAccount shows its metadata and image pull secrets, not its permissions.
    d:
      en: |
        This issues a token for the ServiceAccount. It doesn't check any permission.
references:
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
