id: kcna-2a-mesh-observability
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team adds its services to a service mesh. Which observability data does the mesh provide without changes to the application code?
body:
  options:
    - id: a
      text: { en: "Business metrics such as the number of orders placed per minute" }
    - id: b
      text: { en: "Request rate, error rate and latency of each service, measured by the proxies" }
    - id: c
      text: { en: "CPU and memory usage of each node, measured by the mesh control plane" }
    - id: d
      text: { en: "Audit logs of the requests sent to the Kubernetes API server" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Because the mesh proxies see every request between services, they can report Layer 7 metrics: request rate, error rate and request duration (latency). Meshes such as Istio and Linkerd provide this telemetry, and distributed tracing, without code changes.
  options:
    a:
      en: |
        Business metrics depend on the application's logic, so the application must expose them itself.
    c:
      en: |
        Node CPU and memory usage comes from the kubelet and tools such as metrics-server, not from the mesh.
    d:
      en: |
        Audit logs of API requests are produced by kube-apiserver, not by the mesh.
references:
  - title: "Sidecar or ambient?"
    url: https://istio.io/latest/docs/overview/dataplane-modes/
  - title: "Overview"
    url: https://linkerd.io/2/overview/
