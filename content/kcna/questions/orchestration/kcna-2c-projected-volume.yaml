id: kcna-2c-projected-volume
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application expects a TLS certificate from a Secret, its settings from a ConfigMap, and a short-lived service account token for audience `vault`, all as files in the same directory `/var/run/app`.

    Which volume type should you use?
body:
  options:
    - id: a
      text: { en: "`downwardAPI`" }
    - id: b
      text: { en: "`emptyDir`" }
    - id: c
      text: { en: "`projected`" }
    - id: d
      text: { en: "`hostPath`" }
answer: { optionId: c }
explanation:
  correct:
    en: "A `projected` volume maps several volume sources into the same directory. Its sources include `secret`, `configMap`, `downwardAPI` and `serviceAccountToken` (with an `audience` and an `expirationSeconds`). All sources must be in the Pod's namespace."
  options:
    a:
      en: "A `downwardAPI` volume exposes information about the Pod itself, such as its labels and annotations. It cannot hold Secret or ConfigMap data or a token."
    b:
      en: "An `emptyDir` starts empty. The files would have to be copied into it by a container."
    d:
      en: "`hostPath` mounts a path of the node's filesystem. It does not read Secrets, ConfigMaps or tokens from the API, and it carries security risks."
references:
  - title: Projected Volumes
    url: https://kubernetes.io/docs/concepts/storage/projected-volumes/
