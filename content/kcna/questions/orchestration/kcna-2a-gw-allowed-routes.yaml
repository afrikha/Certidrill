id: kcna-2a-gw-allowed-routes
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An HTTPRoute in the namespace `shop` lists a Gateway of the namespace `infra` in its `parentRefs`. The Gateway's listeners use the default settings, and the route is not attached. What must change?
body:
  options:
    - id: a
      text: { en: "The HTTPRoute must be converted into an Ingress in the namespace `infra`" }
    - id: b
      text: { en: "An IngressClass in the namespace `shop` must be marked as the default" }
    - id: c
      text: { en: "The Gateway's listener must allow routes from `shop` with `allowedRoutes`" }
    - id: d
      text: { en: "A NetworkPolicy must allow traffic from the namespace `infra` to `shop`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      By default, a Gateway accepts routes only from its own namespace. Accepting routes from other namespaces requires configuring `allowedRoutes` on the listener. Routes name their Gateway and the Gateway filters which routes may attach: this two-way trust lets the cluster operator control which teams use the Gateway.
  options:
    a:
      en: |
        Converting the route to an Ingress abandons the Gateway API instead of fixing the attachment. Gateway API routes can attach across namespaces when the Gateway allows it.
    b:
      en: |
        IngressClass only concerns Ingress resources. It has no effect on Gateway API routes.
    d:
      en: |
        A NetworkPolicy filters packets between Pods. It doesn't decide which routes a Gateway accepts.
references:
  - title: "Gateway API"
    url: https://kubernetes.io/docs/concepts/services-networking/gateway/
