id: kcna-2c-init-crashloopbackoff
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod has one init container that waits for a database, and one app container. `kubectl get pods` shows:

    ```text
    NAME      READY   STATUS                  RESTARTS   AGE
    app-1     0/1     Init:CrashLoopBackOff   5          6m
    ```

    What does this status mean?
body:
  options:
    - id: a
      text: { en: "The init container completed, and the app container now crashes repeatedly." }
    - id: b
      text: { en: "The init container is still running normally and has not finished yet." }
    - id: c
      text: { en: "The init container has failed repeatedly, so the app container has not started." }
    - id: d
      text: { en: "The Pod is waiting to be scheduled before it runs its init container." }
answer: { optionId: c }
explanation:
  correct:
    en: "`Init:CrashLoopBackOff` means an init container has failed repeatedly. App containers start only after every init container has completed successfully, so the app container has not run. Read the init container's output with `kubectl logs app-1 -c <init-container-name>`."
  options:
    a:
      en: "Once all init containers have finished, the status shows `PodInitializing` or `Running`, and a crashing app container shows `CrashLoopBackOff` without the `Init:` prefix."
    b:
      en: "An init container that is still running is reported as `Init:0/1` (N of M completed). The back-off in the status means it has failed."
    d:
      en: "A Pod that has not started its init containers yet shows `Pending`. The `Init:CrashLoopBackOff` status shows that the init container has already run and failed."
references:
  - title: Debug Init Containers
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-init-containers/
