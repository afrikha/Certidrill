id: kcna-2a-ing-no-controller
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cluster has no Ingress controller. What happens when you create a valid Ingress resource?
body:
  options:
    - id: a
      text: { en: "The API server rejects the Ingress because no controller exists" }
    - id: b
      text: { en: "The Ingress is stored but has no effect until a controller implements it" }
    - id: c
      text: { en: "kube-proxy applies the Ingress routing rules on every node" }
    - id: d
      text: { en: "The cloud-controller-manager creates a load balancer for the Ingress" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Ingress needs an Ingress controller: creating only the Ingress resource has no effect. You must choose a controller and deploy it in the cluster. The Kubernetes project maintains the AWS and GCE controllers, and many third-party controllers exist.
  options:
    a:
      en: |
        The API server stores a valid Ingress whether or not a controller runs. Nothing then acts on it.
    c:
      en: |
        kube-proxy handles Service virtual IP addresses at Layer 4. It doesn't read Ingress resources or route HTTP requests.
    d:
      en: |
        The cloud-controller-manager provisions load balancers for LoadBalancer Services, not for Ingress resources.
references:
  - title: "Ingress"
    url: https://kubernetes.io/docs/concepts/services-networking/ingress/
  - title: "Ingress Controllers"
    url: https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/
