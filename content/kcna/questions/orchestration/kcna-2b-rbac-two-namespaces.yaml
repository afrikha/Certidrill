id: kcna-2b-rbac-two-namespaces
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A ClusterRole named `deploy-updater` allows updating Deployments. A CI ServiceAccount must get these permissions in the namespaces `shop` and `payments` only, following the principle of least privilege. What should you create?
body:
  options:
    - id: a
      text: { en: "One ClusterRoleBinding that references `deploy-updater`" }
    - id: b
      text: { en: "One RoleBinding in `default` whose subjects list both namespaces" }
    - id: c
      text: { en: "Two RoleBindings, one in `shop` and one in `payments`, that reference `deploy-updater`" }
    - id: d
      text: { en: "Two copies of `deploy-updater`, with `metadata.namespace` set to each namespace" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A RoleBinding that references a ClusterRole grants the ClusterRole's rules only in the binding's namespace. Two RoleBindings reuse the same ClusterRole and limit the ServiceAccount to exactly `shop` and `payments`.
  options:
    a:
      en: |
        A ClusterRoleBinding grants the ClusterRole in every namespace, which is more than required.
    b:
      en: |
        A RoleBinding grants permissions only in its own namespace. The namespace of a ServiceAccount subject identifies the account; it doesn't extend the binding to other namespaces.
    d:
      en: |
        ClusterRoles are cluster-scoped objects with no namespace, so a namespace in their metadata can't limit where their permissions apply.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
