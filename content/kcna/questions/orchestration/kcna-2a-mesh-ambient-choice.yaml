id: kcna-2a-mesh-ambient-choice
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team wants to add existing workloads to an Istio mesh with mutual TLS. Their Pods must not be restarted, and the proxy resource cost per Pod must be as low as possible. Which option fits?
body:
  options:
    - id: a
      text: { en: "Istio sidecar mode, with a proxy injected into each Pod" }
    - id: b
      text: { en: "A default-deny NetworkPolicy in each namespace" }
    - id: c
      text: { en: "kube-proxy in `nftables` mode on each node" }
    - id: d
      text: { en: "Istio ambient mode, enabled with a namespace label" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Istio ambient mode adds workloads to the mesh with a namespace label, without restarting them, and its per-node proxy keeps the resource cost low. Traffic between Pods is encrypted with mTLS in both modes. Sidecar mode requires restarts and provisions a proxy in every Pod.
  options:
    a:
      en: |
        Sidecar mode needs a restart of each workload to inject the proxy, and its per-Pod resource cost is the higher of the two modes.
    b:
      en: |
        A NetworkPolicy filters traffic by IP address and port. It provides no mutual TLS.
    c:
      en: |
        kube-proxy only handles Service virtual IP addresses. It provides no mutual TLS.
references:
  - title: "Sidecar or ambient?"
    url: https://istio.io/latest/docs/overview/dataplane-modes/
