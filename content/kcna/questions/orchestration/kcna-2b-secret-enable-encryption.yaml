id: kcna-2b-secret-enable-encryption
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which configuration enables encryption at rest for the Secret data stored in etcd?
body:
  options:
    - id: a
      text: { en: "The field `immutable: true` set on each Secret" }
    - id: b
      text: { en: "An `EncryptionConfiguration` file passed to the kube-apiserver with `--encryption-provider-config`" }
    - id: c
      text: { en: "The field `type: kubernetes.io/tls` set on each Secret" }
    - id: d
      text: { en: "A NetworkPolicy that blocks Pod traffic to the etcd members" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Encryption at rest is configured on the API server: an `EncryptionConfiguration` lists the resources to encrypt (such as `secrets`) and an ordered list of providers. The first provider in the list encrypts new writes.
  options:
    a:
      en: |
        Immutability prevents changes to the Secret's data. It doesn't encrypt anything.
    c:
      en: |
        The type describes the content (a TLS certificate and key). It doesn't encrypt anything.
    d:
      en: |
        A NetworkPolicy controls Pod traffic. The data on the etcd disks and in backups would still be readable.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
