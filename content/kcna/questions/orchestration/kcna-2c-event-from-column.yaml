id: kcna-2c-event-from-column
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    `kubectl describe pod web-1` ends with the following Events section:

    ```text
    Type     Reason     Age   From               Message
    ----     ------     ----  ----               -------
    Normal   Scheduled  2m    default-scheduler  Successfully assigned shop/web-1 to node-2
    Warning  BackOff    30s   kubelet            Back-off restarting failed container
    ```

    Which column tells you which component reported each event?
body:
  options:
    - id: a
      text: { en: "`Type`" }
    - id: b
      text: { en: "`Reason`" }
    - id: c
      text: { en: "`From`" }
    - id: d
      text: { en: "`Message`" }
answer: { optionId: c }
explanation:
  correct:
    en: "The `From` column names the component that logged the event: here the scheduler assigned the Pod to a node, and the kubelet on that node reported the restart back-off."
  options:
    a:
      en: "`Type` is the severity of the event: `Normal` or `Warning`. It does not say who reported it."
    b:
      en: "`Reason` is a short machine-readable cause such as `Scheduled` or `BackOff`. Together with `Message` it says what happened, not which component reported it."
    d:
      en: "`Message` is the human-readable description of what happened. The reporting component is in another column."
references:
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
