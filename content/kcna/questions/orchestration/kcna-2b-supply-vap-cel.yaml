id: kcna-2b-supply-vap-cel
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which built-in Kubernetes feature validates API requests with Common Expression Language (CEL) rules evaluated inside the API server, without deploying a webhook?
body:
  options:
    - id: a
      text: { en: "ValidatingAdmissionWebhook" }
    - id: b
      text: { en: "ImagePolicyWebhook" }
    - id: c
      text: { en: "The PodSecurity admission controller" }
    - id: d
      text: { en: "ValidatingAdmissionPolicy" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      ValidatingAdmissionPolicy, stable since v1.30, declares validation rules as CEL expressions that the API server evaluates in-process. A ValidatingAdmissionPolicyBinding scopes the policy and sets its actions, such as `Deny`, `Warn` or `Audit`.
  options:
    a:
      en: |
        The ValidatingAdmissionWebhook controller calls external webhook servers, which you must deploy and run.
    b:
      en: |
        ImagePolicyWebhook sends image review requests to a back-end webhook. It is disabled by default.
    c:
      en: |
        The PodSecurity admission controller is built in, but it only applies the fixed Pod Security Standards profiles.
references:
  - title: "Validating Admission Policy"
    url: https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
