id: kcna-2c-crashloopbackoff-meaning
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod of a Deployment shows `CrashLoopBackOff` in the STATUS column of `kubectl get pods`, and its RESTARTS count keeps growing.

    What does this status indicate?
body:
  options:
    - id: a
      text: { en: "The image cannot be pulled, and the kubelet waits before the next pull attempt." }
    - id: b
      text: { en: "The container keeps exiting, and the kubelet waits longer before each restart." }
    - id: c
      text: { en: "The Pod cannot be scheduled, and the scheduler waits before the next attempt." }
    - id: d
      text: { en: "The Pod is being deleted, and the kubelet waits for its grace period to end." }
answer: { optionId: b }
explanation:
  correct:
    en: "`CrashLoopBackOff` means the container starts, exits, and is restarted repeatedly. The kubelet applies an exponential back-off between restarts (10 s, 20 s, 40 s…, capped at 5 minutes). It is a symptom: the cause is in the logs of the previous instance (`kubectl logs --previous`) and in the last terminated state shown by `kubectl describe pod`."
  options:
    a:
      en: "Repeated image pull failures are reported as `ImagePullBackOff`, and the container never starts, so RESTARTS would not grow."
    c:
      en: "A Pod that cannot be scheduled stays `Pending` with a `FailedScheduling` event. Its containers never start, so they cannot be restarted."
    d:
      en: "A Pod being deleted shows `Terminating`. Restarts do not increase during a deletion."
references:
  - title: Pod Lifecycle
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
