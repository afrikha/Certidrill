id: kcna-2a-net-model-pod-ip
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the Kubernetes network model?
body:
  options:
    - id: a
      text: { en: "All Pods on a node share the node's IP address and are reached through port mapping" }
    - id: b
      text: { en: "Every Pod gets its own cluster-wide IP address and reaches other Pods directly, without NAT" }
    - id: c
      text: { en: "Pods on different nodes can reach each other only through a Service that performs NAT" }
    - id: d
      text: { en: "Each container of a Pod gets its own IP address on the node's network" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the Kubernetes network model, each Pod gets a unique IP address in the cluster. Every Pod can communicate with every other Pod, on the same node or another node, directly, without proxies or NAT. Kubernetes defines these rules, and a pod network implementation (a CNI plugin) puts them in place.
  options:
    a:
      en: |
        Sharing the node's IP with port mapping is the model Kubernetes avoids. Each Pod has its own IP address, so Pods never need port mapping to talk to each other.
    c:
      en: |
        Pods reach each other directly on their Pod IPs, on the same node or across nodes, with no proxy or address translation. A Service is an optional stable front end, not a requirement for Pod-to-Pod traffic.
    d:
      en: |
        The IP address belongs to the Pod, not to each container. All containers of a Pod share the Pod's network namespace and its single IP address.
references:
  - title: "Services, Load Balancing, and Networking"
    url: https://kubernetes.io/docs/concepts/services-networking/
