id: kcna-2c-svc-kube-proxy-node
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The cluster uses kube-proxy to implement Services. From Pods running on `node-3`, connections to every Service ClusterIP fail. From Pods on the other nodes, the same Services work. On `node-3`, Service names resolve to the right ClusterIPs, and Pods can reach other Pods directly by their Pod IP and port. The EndpointSlices list the expected Pod IPs.

    What should you check first?
body:
  options:
    - id: a
      text: { en: "The CoreDNS Pods and the `kube-dns` Service" }
    - id: b
      text: { en: "kube-proxy and its logs on `node-3`" }
    - id: c
      text: { en: "The selectors and labels of the affected Services" }
    - id: d
      text: { en: "The readiness probes of the backend Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: "kube-proxy runs on every node and programs the rules (iptables, for example) that translate a ClusterIP into a Pod IP. When only ClusterIP traffic fails, only from one node, while DNS and direct Pod-to-Pod traffic work, kube-proxy on that node is the likely culprit: check that it is running and look for errors in its logs."
  options:
    a:
      en: "DNS works: the names resolve to the right ClusterIPs on `node-3`. The failure happens after resolution."
    c:
      en: "Wrong selectors would leave the Services without endpoints from every node. The EndpointSlices list the expected Pods, and the Services work from the other nodes."
    d:
      en: "Failing readiness probes would remove Pods from the EndpointSlices for every client. Here the endpoints are present and the Services work from the other nodes."
references:
  - title: Debug Services
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
