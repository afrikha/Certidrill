id: kcna-2a-svc-kube-proxy-role
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which component runs on each node and programs the rules that send traffic for a Service's virtual IP address to one of its backend Pods?
body:
  options:
    - id: a
      text: { en: "kubelet" }
    - id: b
      text: { en: "CoreDNS" }
    - id: c
      text: { en: "kube-controller-manager" }
    - id: d
      text: { en: "kube-proxy" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      kube-proxy watches Service and EndpointSlice objects and configures each node to capture traffic sent to a Service's cluster IP and port and redirect it to a backend. On Linux, its default mode in v1.37 is `iptables`; `nftables` is also available and `ipvs` is deprecated. Some network plugins replace kube-proxy with their own implementation.
  options:
    a:
      en: |
        The kubelet starts and monitors the Pods of its node through the container runtime. It doesn't program Service forwarding rules.
    b:
      en: |
        CoreDNS resolves a Service name to its ClusterIP, but it doesn't forward the traffic sent to that address.
    c:
      en: |
        kube-controller-manager runs in the control plane and keeps EndpointSlices up to date, but it doesn't program rules on the nodes.
references:
  - title: "Virtual IPs and Service Proxies"
    url: https://kubernetes.io/docs/reference/networking/virtual-ips/
