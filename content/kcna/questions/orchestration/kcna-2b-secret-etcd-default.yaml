id: kcna-2b-secret-etcd-default
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Encryption at rest has not been configured on a cluster. How are Secret objects stored in etcd?
body:
  options:
    - id: a
      text: { en: "Encrypted with a key that the API server generates at startup" }
    - id: b
      text: { en: "Encrypted by a KMS v2 provider that is enabled by default" }
    - id: c
      text: { en: "Unencrypted, so anyone with access to etcd or its backups can read them" }
    - id: d
      text: { en: "As one-way hashes that only the kubelet can verify" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      By default, the API server writes resources to etcd in plain text: the default `identity` provider does no encryption. Anyone with access to etcd or to an etcd backup can read every Secret, which is why encryption at rest is recommended.
  options:
    a:
      en: |
        Without an encryption configuration, the API server doesn't encrypt anything before writing to etcd.
    b:
      en: |
        The KMS v2 provider must be configured explicitly. No encryption provider is active by default.
    d:
      en: |
        Pods need the actual values, so Secrets are never hashed. The API server returns the stored values to any authorized reader.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
