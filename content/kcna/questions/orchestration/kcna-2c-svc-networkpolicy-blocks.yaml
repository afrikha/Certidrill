id: kcna-2c-svc-networkpolicy-blocks
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Service `ledger.finance` works from Pods in the `finance` namespace. From Pods in the `reports` namespace, the name `ledger.finance` resolves to the right ClusterIP, but connections time out. The Service has ready endpoints, and the cluster's CNI plugin enforces network policies.

    What is the most likely cause?
body:
  options:
    - id: a
      text: { en: "The Service selector does not match the Pod labels." }
    - id: b
      text: { en: "The Service `targetPort` does not match the container port." }
    - id: c
      text: { en: "CoreDNS is not running in the cluster." }
    - id: d
      text: { en: "A NetworkPolicy allows ingress only from the `finance` namespace." }
answer: { optionId: d }
explanation:
  correct:
    en: "The Service works from its own namespace, so the selector, the endpoints and the ports are correct, and DNS resolves the name. A NetworkPolicy that selects the `ledger` Pods and allows ingress only from `finance` would drop the traffic from `reports`. Check the policies with `kubectl get networkpolicies -n finance`."
  options:
    a:
      en: "With a selector mismatch the Service would have no endpoints and would fail from every namespace, including `finance`."
    b:
      en: "A wrong `targetPort` would make connections fail from every namespace, including `finance`, where the Service works."
    c:
      en: "The name resolves to the right ClusterIP from `reports`, so DNS works."
references:
  - title: Debug Services
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
