id: kcna-2a-svc-nodeport
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Clients outside the cluster must reach a Service on the same static port of every node's IP address. No external load balancer may be used. Which Service type should you use?
body:
  options:
    - id: a
      text: { en: "ClusterIP" }
    - id: b
      text: { en: "NodePort" }
    - id: c
      text: { en: "ExternalName" }
    - id: d
      text: { en: "LoadBalancer" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A NodePort Service exposes the Service on each node's IP address at a static port. The control plane allocates the port from a range (30000-32767 by default) unless you set `nodePort`. Each node forwards that port to the Service, which also gets a cluster IP.
  options:
    a:
      en: |
        A ClusterIP Service is reachable only from inside the cluster.
    c:
      en: |
        An ExternalName Service is only a DNS alias (a CNAME record) to another host name. It doesn't receive traffic.
    d:
      en: |
        A LoadBalancer Service provisions an external load balancer, which the requirement excludes.
references:
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
