id: kcna-2d-csi-volume-handle
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator exposes an existing disk to the cluster with this PersistentVolume:

    ```yaml
    apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: archive-pv
    spec:
      capacity:
        storage: 50Gi
      accessModes: ["ReadWriteOnce"]
      csi:
        driver: disk.csi.example.com
        volumeHandle: vol-0a1b2c3d
        fsType: ext4
    ```

    Which field uniquely identifies the disk in the storage system?
body:
  options:
    - id: a
      text: { en: "`driver`" }
    - id: b
      text: { en: "`fsType`" }
    - id: c
      text: { en: "`metadata.name`" }
    - id: d
      text: { en: "`volumeHandle`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `volumeHandle` uniquely identifies the volume. It matches the volume ID returned by the CSI driver when the volume was created, and Kubernetes passes it to the driver in every call about this volume.
  options:
    a:
      en: |
        `driver` names the CSI driver that Kubernetes must call for this volume, not the volume itself.
    b:
      en: |
        `fsType` is the filesystem used to mount (and, if needed, format) the volume.
    c:
      en: |
        `metadata.name` is the name of the PersistentVolume object in Kubernetes. The storage system does not know it.
references:
  - title: Volumes
    url: https://kubernetes.io/docs/concepts/storage/volumes/
