id: kcna-2d-csi-storageclass-provisioner
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The CSI driver `disk.csi.example.com` is installed in a cluster. Claims must get volumes from this driver dynamically.

    Which StorageClass field must name the driver?
body:
  options:
    - id: a
      text: { en: "`parameters`" }
    - id: b
      text: { en: "`mountOptions`" }
    - id: c
      text: { en: "`provisioner`" }
    - id: d
      text: { en: "`allowedTopologies`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The required `provisioner` field determines which volume plugin provisions the PersistentVolumes of the class. For a CSI driver, it is set to the driver's name, for example `provisioner: disk.csi.example.com`.
  options:
    a:
      en: |
        `parameters` holds driver-specific options such as a disk type. It is passed to the provisioner but does not select it.
    b:
      en: |
        `mountOptions` lists the options used when the provisioned volumes are mounted. It does not choose the driver.
    d:
      en: |
        `allowedTopologies` restricts the zones or regions where volumes can be provisioned. It does not choose the driver.
references:
  - title: Storage Classes
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
  - title: Container Storage Interface (CSI) for Kubernetes GA
    url: https://kubernetes.io/blog/2019/01/15/container-storage-interface-ga/
