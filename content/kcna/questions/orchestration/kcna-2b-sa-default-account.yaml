id: kcna-2b-sa-default-account
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod in namespace `shop` doesn't set `spec.serviceAccountName`. Which ServiceAccount does it run as?
body:
  options:
    - id: a
      text: { en: "The ServiceAccount named `default` in namespace `kube-system`" }
    - id: b
      text: { en: "None: the Pod runs without any identity" }
    - id: c
      text: { en: "The ServiceAccount named `default` in namespace `shop`" }
    - id: d
      text: { en: "A new ServiceAccount named after the Pod" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Every namespace has a ServiceAccount named `default`, and a Pod that doesn't name a ServiceAccount is assigned it. This account has no permissions beyond API discovery unless someone binds a role to it.
  options:
    a:
      en: |
        A Pod runs as a ServiceAccount of its own namespace. The `default` account of `kube-system` is used by Pods in `kube-system`.
    b:
      en: |
        Kubernetes always assigns a ServiceAccount. When none is named, the Pod gets the `default` ServiceAccount of its namespace.
    d:
      en: |
        Kubernetes doesn't create a ServiceAccount per Pod. It creates one `default` ServiceAccount per namespace.
references:
  - title: "Service Accounts"
    url: https://kubernetes.io/docs/concepts/security/service-accounts/
  - title: "Configure Service Accounts for Pods"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
