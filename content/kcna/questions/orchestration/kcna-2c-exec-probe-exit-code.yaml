id: kcna-2c-exec-probe-exit-code
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container has the following liveness probe:

    ```yaml
    livenessProbe:
      exec:
        command: ["cat", "/tmp/healthy"]
      periodSeconds: 5
    ```

    When does the kubelet consider this probe successful?
body:
  options:
    - id: a
      text: { en: "When the command prints any output" }
    - id: b
      text: { en: "When the container's port 5 accepts a TCP connection" }
    - id: c
      text: { en: "When the command returns an HTTP status code below 400" }
    - id: d
      text: { en: "When the command exits with status code 0" }
answer: { optionId: d }
explanation:
  correct:
    en: "An `exec` probe runs the command inside the container. Exit code 0 means the container is healthy; any non-zero exit code is a failure. Here the probe fails as soon as `/tmp/healthy` no longer exists, because `cat` then exits with an error."
  options:
    a:
      en: "The kubelet looks at the exit code of the command, not at what it prints."
    b:
      en: "Opening a TCP connection is the `tcpSocket` mechanism. `periodSeconds: 5` is the interval between probes, not a port."
    c:
      en: "Status codes from 200 to 399 are the success rule of `httpGet` probes. An `exec` probe does not make an HTTP request."
references:
  - title: Configure Liveness, Readiness and Startup Probes
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
