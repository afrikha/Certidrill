id: kcna-2a-np-allow-web-to-api
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Review this NetworkPolicy:

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: api-allow-web
      namespace: shop
    spec:
      podSelector:
        matchLabels: { app: api }
      ingress:
      - from:
        - podSelector:
            matchLabels: { app: web }
        ports:
        - { protocol: TCP, port: 8080 }
    ```

    Which inbound traffic to the `app: api` Pods does it allow?
body:
  options:
    - id: a
      text: { en: "TCP port 8080 from Pods labeled `app: web` in any namespace" }
    - id: b
      text: { en: "Any port from Pods labeled `app: web` in the namespace `shop`" }
    - id: c
      text: { en: "TCP port 8080 from any Pod in the namespace `shop`" }
    - id: d
      text: { en: "TCP port 8080 from Pods labeled `app: web` in the namespace `shop`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The policy selects the `app: api` Pods. Without `policyTypes`, `Ingress` is set by default, so these Pods become isolated for ingress. The only rule allows TCP 8080 from Pods labeled `app: web` in the namespace `shop`; other inbound traffic is denied unless another policy allows it.
  options:
    a:
      en: |
        A `podSelector` alone in `from` selects Pods of the policy's own namespace. Other namespaces need a `namespaceSelector`.
    b:
      en: |
        The `ports` list limits the rule to TCP port 8080.
    c:
      en: |
        The `from` list limits the sources to Pods labeled `app: web`.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
