id: kcna-2a-net-cni-spec
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which specification do Kubernetes network plugins implement to connect Pods to the network and give them IP addresses?
body:
  options:
    - id: a
      text: { en: "Container Network Interface (CNI)" }
    - id: b
      text: { en: "Container Runtime Interface (CRI)" }
    - id: c
      text: { en: "Container Storage Interface (CSI)" }
    - id: d
      text: { en: "Open Container Initiative (OCI) runtime specification" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CNI, a CNCF project, is a specification and a set of libraries for plugins that configure network interfaces in Linux containers. Kubernetes needs a CNI plugin to implement its network model, and many plugins exist, Cilium for example.
  options:
    b:
      en: |
        CRI is the API between the kubelet and the container runtime, which starts and stops containers. It doesn't define how Pods get their network.
    c:
      en: |
        CSI is the interface for storage drivers that provide volumes to Pods, not network connectivity.
    d:
      en: |
        The OCI runtime specification describes how a low-level runtime such as runc runs a container. It doesn't cover Pod networking.
references:
  - title: "Network Plugins"
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/
  - title: "GitHub - containernetworking/cni: Container Network Interface - networking for Linux containers"
    url: https://github.com/containernetworking/cni
