id: kcna-2a-net-runtime-calls-cni
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Kubernetes v1.37, which component loads and runs the CNI plugins when the network of a new Pod is set up on a node?
body:
  options:
    - id: a
      text: { en: "The container runtime, such as containerd or CRI-O" }
    - id: b
      text: { en: "kube-proxy" }
    - id: c
      text: { en: "kube-scheduler" }
    - id: d
      text: { en: "kube-controller-manager" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The container runtime, which provides the CRI services to the kubelet, must be configured to load the CNI plugins that implement the network model. Before Kubernetes 1.24, the kubelet could manage CNI plugins itself with flags such as `--network-plugin`, but those flags were removed in 1.24.
  options:
    b:
      en: |
        kube-proxy programs node rules for Service virtual IP addresses. It doesn't create the network interfaces of Pods.
    c:
      en: |
        kube-scheduler only chooses a node for each Pod. It never configures anything on the node.
    d:
      en: |
        kube-controller-manager runs control loops in the control plane. It doesn't set up the network interfaces of Pods on each node.
references:
  - title: "Network Plugins"
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/
