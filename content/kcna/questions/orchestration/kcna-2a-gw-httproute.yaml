id: kcna-2a-gw-httproute
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which Gateway API resource defines rules that map HTTP requests arriving at a Gateway listener, matched by host name and path, to backend Services?
body:
  options:
    - id: a
      text: { en: "GatewayClass" }
    - id: b
      text: { en: "HTTPRoute" }
    - id: c
      text: { en: "Gateway" }
    - id: d
      text: { en: "IngressClass" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An HTTPRoute holds HTTP-specific rules that map traffic from a Gateway listener to backends. It attaches to a Gateway through `parentRefs`, matches requests by host name, path or headers, and sends them to the Services listed in `backendRefs`. GRPCRoute plays the same role for gRPC.
  options:
    a:
      en: |
        A GatewayClass defines a set of gateways with a common configuration, managed by the controller that implements the class. It has no routing rules.
    c:
      en: |
        A Gateway is an instance of traffic-handling infrastructure, with listeners that routes attach to. The routing rules live in the routes.
    d:
      en: |
        IngressClass belongs to the Ingress API, not to the Gateway API.
references:
  - title: "Gateway API"
    url: https://kubernetes.io/docs/concepts/services-networking/gateway/
