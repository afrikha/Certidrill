id: kcna-2c-get-pod-yaml-status
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You need to see the complete object of the Pod `web-1` as the API server stores it, including the `status` section with its conditions and the `containerStatuses` list.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl get pod web-1 -o wide`" }
    - id: b
      text: { en: "`kubectl get pod web-1 --show-labels`" }
    - id: c
      text: { en: "`kubectl logs web-1 --all-containers`" }
    - id: d
      text: { en: "`kubectl get pod web-1 -o yaml`" }
answer: { optionId: d }
explanation:
  correct:
    en: "`-o yaml` prints the whole object: metadata, spec and status. The status section contains the Pod phase, the conditions (PodScheduled, Initialized, ContainersReady, Ready) and the state, restart count and readiness of each container."
  options:
    a:
      en: "`-o wide` keeps the table format and only adds a few columns such as the node and the Pod IP. It does not show conditions or container statuses."
    b:
      en: "`--show-labels` adds a column with the Pod's labels to the table. The status section is not printed."
    c:
      en: "`kubectl logs --all-containers` prints the application output of every container. It does not show the object stored by the API server."
references:
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
