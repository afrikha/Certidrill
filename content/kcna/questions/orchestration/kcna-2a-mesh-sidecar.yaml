id: kcna-2a-mesh-sidecar
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a sidecar-based service mesh, what is the sidecar?
body:
  options:
    - id: a
      text: { en: "A proxy container added to each Pod that intercepts the Pod's traffic" }
    - id: b
      text: { en: "A DaemonSet Pod that resolves DNS names for each node" }
    - id: c
      text: { en: "A control plane process that stores the mesh configuration" }
    - id: d
      text: { en: "An init container that builds the application's image" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In the sidecar model, each Pod gets a proxy container that intercepts and manages its network traffic, enforces security policies and collects telemetry. Istio's sidecar mode deploys an Envoy proxy with each Pod. The cost is extra CPU and memory in every Pod.
  options:
    b:
      en: |
        Resolving DNS names is the job of the cluster DNS (CoreDNS), not of a mesh sidecar.
    c:
      en: |
        The control plane configures the proxies; the sidecars are the data plane that carries the traffic.
    d:
      en: |
        Images are built before deployment, in a CI pipeline. A sidecar runs next to the application at run time.
references:
  - title: "Service Mesh"
    url: https://glossary.cncf.io/service-mesh/
  - title: "Sidecar or ambient?"
    url: https://istio.io/latest/docs/overview/dataplane-modes/
