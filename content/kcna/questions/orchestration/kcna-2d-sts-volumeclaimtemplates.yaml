id: kcna-2d-sts-volumeclaimtemplates
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A StatefulSet runs three database replicas. Each replica must get its own PersistentVolumeClaim, created automatically.

    Which StatefulSet field provides this?
body:
  options:
    - id: a
      text: { en: "`spec.template.spec.volumes`" }
    - id: b
      text: { en: "`spec.persistentVolumeClaimRetentionPolicy`" }
    - id: c
      text: { en: "`spec.volumeClaimTemplates`" }
    - id: d
      text: { en: "`spec.template.spec.containers[].volumeMounts`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For each entry in `volumeClaimTemplates`, every Pod of the StatefulSet receives one PersistentVolumeClaim. This gives each replica stable storage of its own.
  options:
    a:
      en: |
        A claim named in the Pod template's `volumes` is the same claim for every replica, so the replicas would share one volume.
    b:
      en: |
        The retention policy decides whether the claims are deleted when the StatefulSet is deleted or scaled down. It does not create them.
    d:
      en: |
        `volumeMounts` mounts a volume into a container. It does not create any claim.
references:
  - title: StatefulSets
    url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
