id: kcna-2c-startup-probe-window
objective: "2.3.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A container has the following startup probe:

    ```yaml
    startupProbe:
      httpGet:
        path: /healthz
        port: 8080
      failureThreshold: 30
      periodSeconds: 10
    ```

    What is the maximum time the application has to finish starting before the kubelet kills the container?
body:
  options:
    - id: a
      text: { en: "10 seconds" }
    - id: b
      text: { en: "30 seconds" }
    - id: c
      text: { en: "300 seconds" }
    - id: d
      text: { en: "3,000 seconds" }
answer: { optionId: c }
explanation:
  correct:
    en: "The startup window is `failureThreshold` × `periodSeconds`: 30 × 10 = 300 seconds (5 minutes). If the probe has not succeeded by then, the kubelet kills the container and the Pod's restart policy applies. Once it succeeds, the liveness probe takes over."
  options:
    a:
      en: "10 seconds is the interval between two probe attempts (`periodSeconds`), not the total time allowed."
    b:
      en: "30 is the number of failed attempts tolerated (`failureThreshold`), not a number of seconds."
    d:
      en: "3,000 seconds would need 300 attempts at a 10-second period. The probe tolerates only 30 failures."
references:
  - title: Configure Liveness, Readiness and Startup Probes
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
