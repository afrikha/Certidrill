id: kcna-2c-phase-succeeded
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Job created a Pod whose only container ran a database migration and exited with code 0.

    Which value does the Pod's `status.phase` field show?
body:
  options:
    - id: a
      text: { en: "`Completed`" }
    - id: b
      text: { en: "`Failed`" }
    - id: c
      text: { en: "`Unknown`" }
    - id: d
      text: { en: "`Succeeded`" }
answer: { optionId: d }
explanation:
  correct:
    en: "The `Succeeded` phase means that all containers in the Pod terminated successfully and will not be restarted. It is the normal end state of a Pod created by a Job."
  options:
    a:
      en: "`Completed` is a reason that `kubectl get pods` can show in its STATUS column for a container that exited with code 0. It is not one of the five Pod phases (Pending, Running, Succeeded, Failed, Unknown)."
    b:
      en: "`Failed` means that all containers terminated and at least one of them ended in failure (non-zero exit code or killed by the system). Exit code 0 is a success."
    c:
      en: "`Unknown` means the state of the Pod could not be obtained, typically because the control plane cannot communicate with the node."
references:
  - title: Pod Lifecycle
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
