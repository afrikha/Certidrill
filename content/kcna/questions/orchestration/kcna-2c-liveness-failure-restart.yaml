id: kcna-2c-liveness-failure-restart
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application sometimes deadlocks: the process keeps running but stops answering requests. Its container has a liveness probe on `/healthz`.

    What does the kubelet do when the liveness probe fails more times than its failure threshold allows?
body:
  options:
    - id: a
      text: { en: "It removes the Pod from the EndpointSlices of its Services and keeps the container running." }
    - id: b
      text: { en: "It deletes the Pod and asks the scheduler to place a new Pod on another node." }
    - id: c
      text: { en: "It kills the container, which is then restarted according to the Pod's restart policy." }
    - id: d
      text: { en: "It marks the node as NotReady so that no new Pods are scheduled on it." }
answer: { optionId: c }
explanation:
  correct:
    en: "Liveness probes decide when to restart a container, for example to recover from a deadlock. When the probe fails, the kubelet kills the container and the Pod's restart policy applies; with the default `Always`, the container is restarted in the same Pod on the same node."
  options:
    a:
      en: "Removing the Pod from the Service endpoints without a restart is the effect of a failing readiness probe, not a liveness probe."
    b:
      en: "Probes act on containers inside the existing Pod. The kubelet does not delete the Pod or move it to another node when a probe fails."
    d:
      en: "Node readiness reflects the health of the kubelet and the node, not the result of one container's probes."
references:
  - title: Liveness, Readiness, and Startup Probes
    url: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
