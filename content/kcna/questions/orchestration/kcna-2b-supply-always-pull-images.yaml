id: kcna-2b-supply-always-pull-images
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In a multi-tenant cluster, a private image already cached on a node could be started by a Pod of another tenant that has no credentials for the registry. Which admission controller prevents this?
body:
  options:
    - id: a
      text: { en: "ImagePolicyWebhook" }
    - id: b
      text: { en: "PodSecurity" }
    - id: c
      text: { en: "AlwaysPullImages" }
    - id: d
      text: { en: "NodeRestriction" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AlwaysPullImages sets the image pull policy of every new Pod to `Always`, so the image must be pulled from the registry, which requires valid credentials. A Pod without credentials can no longer use an image cached by another tenant.
  options:
    a:
      en: |
        ImagePolicyWebhook delegates the admission decision about images to a back-end service. It doesn't force a pull with credentials.
    b:
      en: |
        PodSecurity checks Pods against the Pod Security Standards. It doesn't involve registry credentials.
    d:
      en: |
        NodeRestriction limits which Node and Pod objects a kubelet can modify. It doesn't affect image pulls.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
