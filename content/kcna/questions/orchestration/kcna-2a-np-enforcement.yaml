id: kcna-2a-np-enforcement
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which component enforces NetworkPolicy objects in a cluster?
body:
  options:
    - id: a
      text: { en: "kube-proxy" }
    - id: b
      text: { en: "kube-apiserver" }
    - id: c
      text: { en: "The network plugin" }
    - id: d
      text: { en: "CoreDNS" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      NetworkPolicy is implemented by the pod network implementation, the network (CNI) plugin. The plugin must support NetworkPolicy: with one that doesn't, the API still accepts NetworkPolicy objects, but they have no effect.
  options:
    a:
      en: |
        kube-proxy implements the virtual IP addresses of Services. It doesn't enforce NetworkPolicy.
    b:
      en: |
        kube-apiserver validates and stores NetworkPolicy objects, but it doesn't filter any packet.
    d:
      en: |
        CoreDNS resolves names. It has no control over which connections are allowed.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - title: "Services, Load Balancing, and Networking"
    url: https://kubernetes.io/docs/concepts/services-networking/
