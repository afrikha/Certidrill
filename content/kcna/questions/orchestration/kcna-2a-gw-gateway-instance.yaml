id: kcna-2a-gw-gateway-instance
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster operator must deploy an instance of traffic-handling infrastructure, such as a cloud load balancer, with listeners to which application teams attach their routes. Which Gateway API resource should the operator create?
body:
  options:
    - id: a
      text: { en: "Gateway" }
    - id: b
      text: { en: "GatewayClass" }
    - id: c
      text: { en: "HTTPRoute" }
    - id: d
      text: { en: "IngressClass" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Gateway defines an instance of traffic-handling infrastructure, such as a cloud load balancer, and is associated with exactly one GatewayClass. Its listeners accept the routes, such as HTTPRoutes, that application teams create.
  options:
    b:
      en: |
        A GatewayClass describes a kind of gateway and the controller that implements it. Each Gateway references a GatewayClass, but the class is not itself an instance with listeners.
    c:
      en: |
        An HTTPRoute holds routing rules that attach to a Gateway. It doesn't create the infrastructure.
    d:
      en: |
        IngressClass belongs to the Ingress API and is not used by Gateway API resources.
references:
  - title: "Gateway API"
    url: https://kubernetes.io/docs/concepts/services-networking/gateway/
