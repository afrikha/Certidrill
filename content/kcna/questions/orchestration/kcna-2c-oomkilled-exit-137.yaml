id: kcna-2c-oomkilled-exit-137
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    `kubectl describe pod report-5` shows the following for its only container:

    ```text
    Limits:
      memory:       256Mi
    State:          Running
    Last State:     Terminated
      Reason:       OOMKilled
      Exit Code:    137
    Restart Count:  4
    ```

    Why was the container restarted?
body:
  options:
    - id: a
      text: { en: "It tried to use more memory than its memory limit." }
    - id: b
      text: { en: "It used more CPU than its CPU limit." }
    - id: c
      text: { en: "Its liveness probe failed three times in a row." }
    - id: d
      text: { en: "Its image could not be pulled from the registry." }
answer: { optionId: a }
explanation:
  correct:
    en: "The reason `OOMKilled` (exit code 137) shows that the container tried to use more memory than its limit, so the kernel's out-of-memory killer stopped it, and the kubelet restarted it. Look for a memory leak in the application or raise the memory limit (and possibly the request)."
  options:
    b:
      en: "A CPU limit is enforced by throttling: a container that wants more CPU is slowed down, not killed. Container runtimes don't terminate containers for excessive CPU usage."
    c:
      en: "A liveness probe failure produces `Unhealthy` and `Killing` events in the event list. The reason recorded here is OOMKilled, which points to memory."
    d:
      en: "An image pull failure prevents the container from ever starting (`ImagePullBackOff`). This container has run and been restarted four times."
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
