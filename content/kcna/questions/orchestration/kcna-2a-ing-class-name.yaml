id: kcna-2a-ing-class-name
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cluster runs two Ingress controllers. Which Ingress field chooses the controller that implements a given Ingress?
body:
  options:
    - id: a
      text: { en: "`spec.defaultBackend`" }
    - id: b
      text: { en: "`spec.tls`" }
    - id: c
      text: { en: "`spec.ingressClassName`" }
    - id: d
      text: { en: "`spec.rules[].host`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `spec.ingressClassName` references an IngressClass, which names the controller that implements the Ingress. It replaces the older `kubernetes.io/ingress.class` annotation. If the field is omitted and exactly one IngressClass is marked as the default, that class is applied.
  options:
    a:
      en: |
        `spec.defaultBackend` names the Service that receives requests matching no rule.
    b:
      en: |
        `spec.tls` lists the host names and the Secret with the certificate for HTTPS.
    d:
      en: |
        `spec.rules[].host` matches the host name of incoming requests, not the controller.
references:
  - title: "Ingress Controllers"
    url: https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/
  - title: "Ingress"
    url: https://kubernetes.io/docs/concepts/services-networking/ingress/
