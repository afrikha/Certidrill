id: kcna-2a-ing-gateway-successor
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which API does the Kubernetes project present as the successor of Ingress for routing traffic from outside the cluster to Services?
body:
  options:
    - id: a
      text: { en: "Gateway API" }
    - id: b
      text: { en: "IngressClass" }
    - id: c
      text: { en: "EndpointSlice API" }
    - id: d
      text: { en: "Service type ExternalName" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Gateway API is the successor of Ingress, and the Kubernetes project recommends it because the Ingress API is frozen. It is an add-on: its kinds are custom resources that must be installed with an implementation. It has no Ingress kind, so existing Ingress resources need a one-time conversion.
  options:
    b:
      en: |
        IngressClass is part of the Ingress API. It names the controller that implements an Ingress.
    c:
      en: |
        EndpointSlices list the backend endpoints of Services. They don't route external traffic.
    d:
      en: |
        An ExternalName Service is a DNS alias to an external name. It doesn't bring outside traffic into the cluster.
references:
  - title: "Gateway API"
    url: https://kubernetes.io/docs/concepts/services-networking/gateway/
  - title: "Ingress"
    url: https://kubernetes.io/docs/concepts/services-networking/ingress/
