id: kcna-2b-admission-skips-reads
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Admission controllers can modify or reject requests sent to the kube-apiserver. Which of these requests is never processed by admission controllers?
body:
  options:
    - id: a
      text: { en: "`kubectl create deployment web --image=nginx -n shop`" }
    - id: b
      text: { en: "`kubectl delete pod web-1 -n shop`" }
    - id: c
      text: { en: "`kubectl scale deployment web --replicas=5 -n shop`" }
    - id: d
      text: { en: "`kubectl get secrets -n shop`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Admission controllers act on requests that create, modify, delete or connect to objects. Read requests (`get`, `list`, `watch`) bypass the admission layer, so only authentication and authorization can control who reads Secrets.
  options:
    a:
      en: |
        Creating an object goes through admission control. For example, ResourceQuota or Pod Security Admission can reject it.
    b:
      en: |
        Delete requests go through admission control. Only read requests bypass it.
    c:
      en: |
        Scaling updates the Deployment (through its `scale` subresource). It is a write request, so it passes through admission control.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
