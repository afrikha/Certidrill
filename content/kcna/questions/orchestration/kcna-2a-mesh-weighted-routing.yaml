id: kcna-2a-mesh-weighted-routing
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team runs versions v1 and v2 of the service `checkout` in a service mesh. Exactly 10 % of the HTTP requests must go to v2, whatever the number of Pods of each version. Which feature should the team use?
body:
  options:
    - id: a
      text: { en: "`sessionAffinity: ClientIP` on the Service" }
    - id: b
      text: { en: "Weighted routing rules of the service mesh" }
    - id: c
      text: { en: "A NetworkPolicy that limits the clients of v2" }
    - id: d
      text: { en: "A headless Service for the v2 Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A service mesh can split traffic by percentage weight between versions, for example 90/10 between two subsets in Istio, which is useful for canary releases. The split doesn't depend on the number of Pods, whereas a plain Service spreads connections across all ready Pods.
  options:
    a:
      en: |
        Session affinity keeps each client on the same Pod. It doesn't split traffic by percentage.
    c:
      en: |
        A NetworkPolicy allows or denies connections. It can't send a percentage of requests to a version.
    d:
      en: |
        A headless Service returns Pod IP addresses through DNS. It has no traffic weights.
references:
  - title: "Traffic Management"
    url: https://istio.io/latest/docs/concepts/traffic-management/
