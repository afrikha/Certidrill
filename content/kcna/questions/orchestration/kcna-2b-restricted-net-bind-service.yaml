id: kcna-2b-restricted-net-bind-service
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A namespace enforces the Restricted profile. A container drops `ALL` capabilities, but it must listen on port 80 while running as a non-root user. Which capability may it add back?
body:
  options:
    - id: a
      text: { en: "`NET_BIND_SERVICE`" }
    - id: b
      text: { en: "`NET_ADMIN`" }
    - id: c
      text: { en: "`SYS_ADMIN`" }
    - id: d
      text: { en: "`NET_RAW`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Restricted profile requires containers to drop `ALL` capabilities and allows adding back only `NET_BIND_SERVICE`, the capability to bind ports below 1024. It lets a non-root process listen on port 80.
  options:
    b:
      en: |
        `NET_ADMIN` allows network administration on the host's behalf. Restricted allows adding back only `NET_BIND_SERVICE`.
    c:
      en: |
        `SYS_ADMIN` is a very broad capability. Neither Baseline nor Restricted allows adding it.
    d:
      en: |
        `NET_RAW` allows raw sockets. Restricted allows adding back only `NET_BIND_SERVICE`.
references:
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
