id: kcna-2b-rbac-role-namespace
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which RBAC object defines a set of permissions that applies within a single namespace?
body:
  options:
    - id: a
      text: { en: "Role" }
    - id: b
      text: { en: "ClusterRole" }
    - id: c
      text: { en: "RoleBinding" }
    - id: d
      text: { en: "ServiceAccount" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Role is a namespaced object whose rules list API groups, resources and verbs. Its permissions apply only in the namespace where the Role is created.
  options:
    b:
      en: |
        A ClusterRole is not namespaced. It defines permissions on cluster-scoped resources, for all namespaces, or as a reusable set of rules.
    c:
      en: |
        A RoleBinding grants a role to subjects. It contains no permission rules itself.
    d:
      en: |
        A ServiceAccount is an identity for workloads. Permissions are granted to it through bindings.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
