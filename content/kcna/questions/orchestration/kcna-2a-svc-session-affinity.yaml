id: kcna-2a-svc-session-affinity
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legacy web application keeps user sessions in memory, so each client must keep reaching the same Pod behind the application's ClusterIP Service. Which Service setting should you use?
body:
  options:
    - id: a
      text: { en: "`internalTrafficPolicy: Local`" }
    - id: b
      text: { en: "`externalTrafficPolicy: Local`" }
    - id: c
      text: { en: "`clusterIP: None`" }
    - id: d
      text: { en: "`sessionAffinity: ClientIP`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `sessionAffinity: ClientIP`, kube-proxy sends the connections of a given client IP address to the same Pod. The default is `None`. The maximum sticky time is set with `sessionAffinityConfig.clientIP.timeoutSeconds` (10800 seconds by default).
  options:
    a:
      en: |
        `internalTrafficPolicy: Local` sends internal traffic only to endpoints on the client's node. It doesn't pin a client to one Pod.
    b:
      en: |
        `externalTrafficPolicy: Local` applies to traffic from outside the cluster and sends it only to endpoints on the receiving node. It doesn't pin a client to one Pod.
    c:
      en: |
        `clusterIP: None` makes the Service headless: no virtual IP and no proxying, so kube-proxy can't keep a client on one Pod.
references:
  - title: "Virtual IPs and Service Proxies"
    url: https://kubernetes.io/docs/reference/networking/virtual-ips/
