id: kcna-2b-authz-node-mode
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which authorization mode grants each kubelet permissions based on the Pods that are scheduled to run on its node?
body:
  options:
    - id: a
      text: { en: "Node" }
    - id: b
      text: { en: "RBAC" }
    - id: c
      text: { en: "Webhook" }
    - id: d
      text: { en: "ABAC" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Node authorizer is a special-purpose mode for kubelets: it grants a kubelet permissions based on the Pods scheduled to its node. It is usually combined with RBAC, for example `--authorization-mode=Node,RBAC`.
  options:
    b:
      en: |
        RBAC grants the permissions of Roles and ClusterRoles to the subjects of bindings. It doesn't derive permissions from where Pods are scheduled.
    c:
      en: |
        Webhook mode sends the authorization decision to an external HTTP service. It isn't specific to kubelets.
    d:
      en: |
        ABAC evaluates attribute-based policies written by an administrator. It doesn't track which Pods run on which node.
references:
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
