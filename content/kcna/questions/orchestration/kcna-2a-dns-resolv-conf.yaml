id: kcna-2a-dns-resolv-conf
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which file inside a container does the kubelet configure so that the container's DNS queries go to the cluster DNS server, with the cluster's search domains?
body:
  options:
    - id: a
      text: { en: "`/etc/cni/net.d`" }
    - id: b
      text: { en: "`/etc/resolv.conf`" }
    - id: c
      text: { en: "`~/.kube/config`" }
    - id: d
      text: { en: "`/etc/services`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The kubelet writes `/etc/resolv.conf` for each Pod. With the default DNS policy, it lists the cluster DNS Service as the nameserver, a search list such as `<namespace>.svc.cluster.local svc.cluster.local cluster.local`, and `options ndots:5`.
  options:
    a:
      en: |
        `/etc/cni/net.d` is the default directory of the CNI configuration on the node, not a file inside containers.
    c:
      en: |
        `~/.kube/config` is the kubeconfig file that kubectl uses to connect to clusters. It has no DNS settings.
    d:
      en: |
        `/etc/services` maps network service names to port numbers. It doesn't configure DNS resolution.
references:
  - title: "DNS for Services and Pods"
    url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
