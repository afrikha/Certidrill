id: kcna-2d-csi-volume-snapshots
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team wants to take point-in-time snapshots of its PersistentVolumeClaims with the `VolumeSnapshot` API. The snapshot CRDs and the snapshot controller are installed.

    Which condition must the volumes meet?
body:
  options:
    - id: a
      text: { en: "They must use the `Retain` reclaim policy" }
    - id: b
      text: { en: "They must use the `ReadWriteMany` access mode" }
    - id: c
      text: { en: "They must come from a CSI driver that implements snapshots" }
    - id: d
      text: { en: "They must come from an in-tree volume plugin" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `VolumeSnapshot` support is only available for CSI drivers, and each CSI driver may or may not implement snapshots. The volumes must therefore be provisioned by a CSI driver with snapshot support.
  options:
    a:
      en: |
        The reclaim policy decides what happens to a volume after its claim is deleted. It does not enable snapshots.
    b:
      en: |
        The access mode describes how nodes mount the volume. Snapshots do not depend on it.
    d:
      en: |
        Snapshots are a CSI feature. In-tree plugins do not support the `VolumeSnapshot` API.
references:
  - title: Volume Snapshots
    url: https://kubernetes.io/docs/concepts/storage/volume-snapshots/
