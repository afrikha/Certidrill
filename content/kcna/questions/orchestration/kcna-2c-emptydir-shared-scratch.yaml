id: kcna-2c-emptydir-shared-scratch
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod has two containers: one downloads files, the other serves them over HTTP. The files are only a temporary cache and can be downloaded again if they are lost when the Pod is deleted.

    Which volume type should the two containers share?
body:
  options:
    - id: a
      text: { en: "`persistentVolumeClaim`" }
    - id: b
      text: { en: "`hostPath`" }
    - id: c
      text: { en: "`emptyDir`" }
    - id: d
      text: { en: "`configMap`" }
answer: { optionId: c }
explanation:
  correct:
    en: "An `emptyDir` volume is created empty when the Pod is assigned to a node, every container of the Pod can mount it, and it is deleted when the Pod is removed from the node. It is meant for scratch space and for files that one container fetches for another."
  options:
    a:
      en: "A PersistentVolumeClaim provides durable storage that outlives the Pod. The cache does not need to survive the Pod, so durable storage adds cost and setup for nothing."
    b:
      en: "`hostPath` mounts a directory of the node's filesystem and leaves data on the node after the Pod is gone. It carries many security risks and should be avoided when possible."
    d:
      en: "A `configMap` volume exposes the keys of a ConfigMap as files and is always mounted read-only, so the downloader could not write to it."
references:
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
