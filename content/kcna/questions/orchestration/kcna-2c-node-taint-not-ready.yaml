id: kcna-2c-node-taint-not-ready
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The kubelet of `node-6` keeps reporting to the API server, but its `Ready` condition has had the status `False` for several minutes.

    Which taint does the control plane add to the node?
body:
  options:
    - id: a
      text: { en: "`node.kubernetes.io/unreachable`" }
    - id: b
      text: { en: "`node.kubernetes.io/not-ready`" }
    - id: c
      text: { en: "`node.kubernetes.io/unschedulable`" }
    - id: d
      text: { en: "`node.kubernetes.io/disk-pressure`" }
answer: { optionId: b }
explanation:
  correct:
    en: "When the `Ready` condition stays `False` longer than the grace period, the node controller adds the `node.kubernetes.io/not-ready` taint. The scheduler then avoids the node, and the `NoExecute` effect evicts Pods that do not tolerate it, so their controllers recreate them elsewhere."
  options:
    a:
      en: "`node.kubernetes.io/unreachable` is added when `Ready` is `Unknown`, that is when the control plane no longer hears from the node. Here the kubelet still reports, with the status `False`."
    c:
      en: "`node.kubernetes.io/unschedulable` matches a node that is cordoned (`spec.unschedulable`). Cordoning is an administrator action, not the result of a failing `Ready` condition."
    d:
      en: "`node.kubernetes.io/disk-pressure` matches the `DiskPressure` condition, not the `Ready` condition."
references:
  - title: Node Status
    url: https://kubernetes.io/docs/reference/node/node-status/
  - title: Taints and Tolerations
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
