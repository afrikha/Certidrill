id: kcna-2a-net-plugin-responsibility
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Which task is performed by the pod network implementation (the CNI plugin) rather than by a built-in Kubernetes component?
body:
  options:
    - id: a
      text: { en: "Allocating ClusterIP addresses to Services from the Service IP range" }
    - id: b
      text: { en: "Giving each new Pod an IP address and routing Pod traffic between nodes" }
    - id: c
      text: { en: "Creating the EndpointSlices that list the Pods matching a Service selector" }
    - id: d
      text: { en: "Writing the cluster DNS server address into each Pod's `/etc/resolv.conf`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes defines the network model but leaves the Pod network to a pod network implementation, usually a CNI plugin called by the container runtime. The plugin sets up the Pod's network interface and IP address and makes the Pod reachable from other nodes. Service IP allocation, EndpointSlices and Pod DNS settings are handled by Kubernetes components.
  options:
    a:
      en: |
        ClusterIP addresses come from the Service IP range configured on kube-apiserver (`--service-cluster-ip-range`, managed as ServiceCIDR objects). The pod network implementation doesn't allocate them.
    c:
      en: |
        The control plane creates and updates EndpointSlices automatically for every Service with a selector. That is the job of the EndpointSlice controller, not of the network plugin.
    d:
      en: |
        The kubelet configures `/etc/resolv.conf` for each Pod so that it uses the cluster DNS.
references:
  - title: "Services, Load Balancing, and Networking"
    url: https://kubernetes.io/docs/concepts/services-networking/
  - title: "Virtual IPs and Service Proxies"
    url: https://kubernetes.io/docs/reference/networking/virtual-ips/
