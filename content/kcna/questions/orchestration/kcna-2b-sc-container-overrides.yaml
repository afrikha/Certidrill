id: kcna-2b-sc-container-overrides
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    As which user ID does the process of container `app` run?

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: demo
    spec:
      securityContext:
        runAsUser: 1000
      containers:
      - name: app
        image: registry.example.com/app:1.0
        securityContext:
          runAsUser: 2000
    ```
body:
  options:
    - id: a
      text: { en: "1000" }
    - id: b
      text: { en: "2000" }
    - id: c
      text: { en: "0 (root)" }
    - id: d
      text: { en: "None: the Pod is rejected because the values conflict" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Pod-level securityContext applies to all containers of the Pod, but a container-level securityContext overrides it where they overlap. The container sets `runAsUser: 2000`, so its process runs as UID 2000.
  options:
    a:
      en: |
        The Pod-level value applies only where the container doesn't set its own value. Here the container sets `runAsUser`, which overrides it.
    c:
      en: |
        Both levels set a non-zero user ID, so the process doesn't run as root.
    d:
      en: |
        Setting the same field at both levels is allowed. The container's value wins.
references:
  - title: "Configure a Security Context for a Pod or Container"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
