id: kcna-2c-crashloop-phase-running
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Deployment Pod (`restartPolicy: Always`) has one container. The container started, then crashed several times, and `kubectl get pods` now shows `CrashLoopBackOff` in the STATUS column.

    Which value does the Pod's `status.phase` field most likely hold?
body:
  options:
    - id: a
      text: { en: "`Running`" }
    - id: b
      text: { en: "`CrashLoopBackOff`" }
    - id: c
      text: { en: "`Failed`" }
    - id: d
      text: { en: "`Pending`" }
answer: { optionId: a }
explanation:
  correct:
    en: "The phase `Running` covers a Pod that is bound to a node, whose containers were created, and where at least one container is running, starting or restarting. A crash-looping container that will be restarted keeps the Pod in `Running`; the STATUS column of kubectl shows the container's waiting reason instead of the phase."
  options:
    b:
      en: "`CrashLoopBackOff` is a reason displayed by kubectl in the STATUS column. The documentation warns not to confuse it with the phase, which has only five values."
    c:
      en: "`Failed` requires all containers to be terminated with at least one failure and no automatic restart. With `restartPolicy: Always`, the kubelet keeps restarting the container."
    d:
      en: "`Pending` covers the time before the Pod is scheduled and its containers are set up. This Pod's container has already started and crashed."
references:
  - title: Pod Lifecycle
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
