id: kcna-2a-svc-default-type
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Service manifest doesn't set `spec.type`. Which type does the Service get?
body:
  options:
    - id: a
      text: { en: "NodePort" }
    - id: b
      text: { en: "LoadBalancer" }
    - id: c
      text: { en: "ClusterIP" }
    - id: d
      text: { en: "ExternalName" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      ClusterIP is the default Service type. It gives the Service a virtual IP address that is reachable only from inside the cluster. The other types are used only when `spec.type` asks for them.
  options:
    a:
      en: |
        NodePort must be requested explicitly. It opens the same port on every node for clients outside the cluster.
    b:
      en: |
        LoadBalancer must be requested explicitly and needs an external load balancer implementation, such as a cloud provider integration.
    d:
      en: |
        ExternalName must be requested explicitly, with `spec.externalName`. It makes the cluster DNS return a CNAME record.
references:
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
