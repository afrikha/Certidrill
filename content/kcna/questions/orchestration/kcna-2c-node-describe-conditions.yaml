id: kcna-2c-node-describe-conditions
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    `kubectl get nodes` shows that `node-2` is `NotReady`. You want to see the node's conditions, capacity, allocatable resources and taints.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl cordon node-2`" }
    - id: b
      text: { en: "`kubectl get pods -n kube-system`" }
    - id: c
      text: { en: "`kubectl describe node node-2`" }
    - id: d
      text: { en: "`kubectl get pods -A -o wide`" }
answer: { optionId: c }
explanation:
  correct:
    en: "`kubectl describe node` shows the node's conditions (Ready, MemoryPressure, DiskPressure, PIDPressure, NetworkUnavailable) with their reason and message, as well as its capacity, allocatable resources, taints and recent events. The Ready condition's message usually tells why the node is NotReady."
  options:
    a:
      en: "`kubectl cordon` marks the node as unschedulable. It changes the node; it does not show why the node is NotReady."
    b:
      en: "This lists the system Pods, such as CoreDNS or kube-proxy. It does not show the conditions of `node-2`."
    d:
      en: "This lists every Pod with the node it runs on. It does not show the node's conditions, capacity or taints."
references:
  - title: Node Status
    url: https://kubernetes.io/docs/reference/node/node-status/
