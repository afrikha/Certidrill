id: kcna-2b-api-401-authentication
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A script calls the Kubernetes API with an invalid bearer token and receives `401 Unauthorized`. Which stage of request processing rejected the request?
body:
  options:
    - id: a
      text: { en: "Authorization" }
    - id: b
      text: { en: "Admission control" }
    - id: c
      text: { en: "Authentication" }
    - id: d
      text: { en: "Schema validation" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The API server tries its authentication modules (client certificates, bearer tokens, OIDC, ServiceAccount tokens...) one after the other. If none of them can identify the caller, the request is rejected with HTTP 401. Invalid credentials are not treated as anonymous: they still get a 401.
  options:
    a:
      en: |
        Authorization failures return `403 Forbidden`, and authorization only runs after the caller has been identified.
    b:
      en: |
        Admission controllers run after authentication and authorization. A request with invalid credentials never reaches them.
    d:
      en: |
        The object is validated against its schema after admission, just before it is stored. This step doesn't check credentials.
references:
  - title: "Controlling Access to the Kubernetes API"
    url: https://kubernetes.io/docs/concepts/security/controlling-access/
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
