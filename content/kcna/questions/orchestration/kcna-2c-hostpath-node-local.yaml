id: kcna-2c-hostpath-node-local
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Deployment's Pod stores uploaded files in a `hostPath` volume at `/data/uploads`. After a node maintenance, the Pod is recreated on another node, and the previously uploaded files are missing.

    Why?
body:
  options:
    - id: a
      text: { en: "`hostPath` data is deleted when the Pod that wrote it is deleted." }
    - id: b
      text: { en: "`hostPath` data is kept in memory and is lost when the node restarts." }
    - id: c
      text: { en: "`hostPath` data is copied to the new node only after the old node is drained." }
    - id: d
      text: { en: "`hostPath` data is a directory on one node, and stays on the old node." }
answer: { optionId: d }
explanation:
  correct:
    en: "A `hostPath` volume mounts a file or directory of the node's own filesystem. The data persists on that node after the Pod is removed, but a Pod scheduled on another node sees that node's directory instead. Use a PersistentVolumeClaim for data that must follow the Pod; the documentation also advises avoiding `hostPath` because of its security risks."
  options:
    a:
      en: "Unlike `emptyDir`, `hostPath` data is not deleted with the Pod: it remains in the node's filesystem."
    b:
      en: "`hostPath` points to the node's filesystem, normally on disk. The files are still on the old node."
    c:
      en: "Kubernetes never copies `hostPath` data between nodes, whether the node is drained or not."
references:
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
  - title: Volumes
    url: https://kubernetes.io/docs/concepts/storage/volumes/
