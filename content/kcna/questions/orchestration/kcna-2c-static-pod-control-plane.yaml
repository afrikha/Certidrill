id: kcna-2c-static-pod-control-plane
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On a kubeadm cluster, `kubectl get pods -n kube-system` lists `kube-apiserver-cp1`, `kube-scheduler-cp1` and `kube-controller-manager-cp1`. These are static Pods.

    What runs these Pods?
body:
  options:
    - id: a
      text: { en: "A Deployment in the `kube-system` namespace" }
    - id: b
      text: { en: "A DaemonSet that targets the control plane nodes" }
    - id: c
      text: { en: "The kube-controller-manager, from objects stored in etcd" }
    - id: d
      text: { en: "The kubelet of node `cp1`, from manifest files on that node" }
answer: { optionId: d }
explanation:
  correct:
    en: "Static Pods are run by the kubelet from manifest files in a local directory, `/etc/kubernetes/manifests` on kubeadm control plane nodes. The kubelet creates a read-only mirror Pod in the API server, named with the node name as suffix, so that kubectl can see them. To troubleshoot a control plane component, check its manifest and the kubelet on that node."
  options:
    a:
      en: "A Deployment is managed through the API server and the kube-controller-manager, which are themselves among these Pods. Static Pods do not depend on any controller."
    b:
      en: "A DaemonSet is also an API object reconciled by a controller. Static Pods are read from local files by the kubelet."
    c:
      en: "The kube-controller-manager is itself one of these static Pods. Deleting a mirror Pod with kubectl does not stop the static Pod: the kubelet keeps it running."
references:
  - title: Create static Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/
