id: kcna-2a-dns-pod-subdomain
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A headless Service named `db` exists in the namespace `shop`. The cluster domain is `cluster.local`. Review this Pod:

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: db-0
      namespace: shop
    spec:
      hostname: db-0
      subdomain: db
      containers:
      - name: postgres
        image: postgres:17
    ```

    Which DNS name resolves to this Pod's IP address?
body:
  options:
    - id: a
      text: { en: "`db.db-0.shop.svc.cluster.local`" }
    - id: b
      text: { en: "`db-0.db.shop.svc.cluster.local`" }
    - id: c
      text: { en: "`db-0.shop.svc.cluster.local`" }
    - id: d
      text: { en: "`db-0.shop.pod.cluster.local`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a Pod sets `hostname` and `subdomain`, its fully qualified name is `<hostname>.<subdomain>.<namespace>.svc.<cluster-domain>`. The DNS returns an A or AAAA record for this name because a headless Service with the same name as the subdomain exists in the namespace.
  options:
    a:
      en: |
        The hostname comes first and the subdomain second. This name reverses them.
    c:
      en: |
        This name skips the subdomain. It would be the name of a Service called `db-0`, which doesn't exist.
    d:
      en: |
        Pod records under `pod` are built from the Pod's IP address with dashes, not from its name.
references:
  - title: "DNS for Services and Pods"
    url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
