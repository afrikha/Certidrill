id: kcna-2a-np-egress-dns
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You apply a default-deny egress NetworkPolicy to the namespace `shop`. Afterwards, the Pods of `shop` can no longer resolve Service names. What should you add?
body:
  options:
    - id: a
      text: { en: "A NetworkPolicy that allows ingress to the `shop` Pods on port 53" }
    - id: b
      text: { en: "A `dnsPolicy: Default` setting in the spec of each Pod" }
    - id: c
      text: { en: "A restart of the CoreDNS Pods in the namespace `kube-system`" }
    - id: d
      text: { en: "A NetworkPolicy that allows egress to the cluster DNS service on port 53" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A default-deny egress policy blocks all outbound traffic of the selected Pods, DNS queries included. The Kubernetes documentation says to add a separate NetworkPolicy that allows egress to the cluster's DNS service, which listens on port 53 (UDP and TCP).
  options:
    a:
      en: |
        DNS queries leave the `shop` Pods, so egress is blocked, not ingress. Replies to allowed connections are allowed implicitly.
    b:
      en: |
        `dnsPolicy: Default` uses the node's resolver instead of the cluster DNS, so cluster names wouldn't resolve, and the queries would still be blocked by the egress policy.
    c:
      en: |
        CoreDNS works; the queries never reach it because the policy blocks them.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
