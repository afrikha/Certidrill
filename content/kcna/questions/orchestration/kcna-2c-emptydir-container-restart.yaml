id: kcna-2c-emptydir-container-restart
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container writes intermediate results to an `emptyDir` volume mounted at `/work`. The container crashes, and the kubelet restarts it in the same Pod.

    What happens to the files in `/work`?
body:
  options:
    - id: a
      text: { en: "They are still there, because the volume lives as long as the Pod stays on the node." }
    - id: b
      text: { en: "They are deleted, because an `emptyDir` volume is recreated empty at each container start." }
    - id: c
      text: { en: "They are moved to a PersistentVolume created automatically for the Pod." }
    - id: d
      text: { en: "They are lost, unless the volume uses `medium: Memory`." }
answer: { optionId: a }
explanation:
  correct:
    en: "A container crash does not remove the Pod from its node, and the data of any volume is preserved across container restarts. The `emptyDir` data is deleted permanently only when the Pod is removed from the node, for example when it is deleted or evicted."
  options:
    b:
      en: "The volume is created empty only once, when the Pod is assigned to the node. Restarting a container does not recreate it."
    c:
      en: "Kubernetes never converts an `emptyDir` into a PersistentVolume. A volume backed by a claim must be declared, for example with a PVC or a generic ephemeral volume."
    d:
      en: "The medium changes where the data is stored (node disk or RAM), not how long it lives. In both cases the data survives a container restart."
references:
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
  - title: Volumes
    url: https://kubernetes.io/docs/concepts/storage/volumes/
