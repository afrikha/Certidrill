id: kcna-2d-sts-pod-rescheduled
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Pod `db-0` of a StatefulSet uses the claim `data-db-0`. The Pod is deleted, and the StatefulSet controller creates it again on another node.

    Which storage does the new `db-0` Pod use?
body:
  options:
    - id: a
      text: { en: "A new, empty claim named `data-db-0`" }
    - id: b
      text: { en: "No volume until an administrator binds one" }
    - id: c
      text: { en: "The claim of another replica, such as `data-db-1`" }
    - id: d
      text: { en: "The same claim `data-db-0`, with its existing data" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a StatefulSet Pod is rescheduled, its volume mounts use the PersistentVolumes associated with its own claims. The new `db-0` remounts `data-db-0` and finds its previous data.
  options:
    a:
      en: |
        Deleting a Pod does not delete its claim, so no new claim is created: the existing one is reused.
    b:
      en: |
        The claim is still bound to its volume, so no manual action is needed.
    c:
      en: |
        Each Pod ordinal keeps its own claim. Swapping claims between replicas would break stable storage.
references:
  - title: StatefulSets
    url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
  - title: StatefulSet Basics
    url: https://kubernetes.io/docs/tutorials/stateful-application/basic-stateful-set/
