id: kcna-2a-mesh-ambient-waypoint
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Istio's ambient (sidecarless) mode, which component provides Layer 7 features such as HTTP routing?
body:
  options:
    - id: a
      text: { en: "A waypoint proxy" }
    - id: b
      text: { en: "The per-node Layer 4 proxy" }
    - id: c
      text: { en: "An Envoy sidecar in each Pod" }
    - id: d
      text: { en: "kube-proxy" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Istio ambient mode uses a per-node Layer 4 proxy for all traffic, and optionally an Envoy proxy per namespace, called a waypoint, for Layer 7 features. The full Istio traffic management feature set requires a waypoint.
  options:
    b:
      en: |
        In ambient mode, the per-node proxy handles Layer 4 only, including mTLS. Layer 7 features need a waypoint.
    c:
      en: |
        Sidecars belong to Istio's sidecar mode. Ambient mode runs without a proxy in each Pod.
    d:
      en: |
        kube-proxy programs Layer 4 rules for Service virtual IP addresses. It is not part of Istio.
references:
  - title: "Sidecar or ambient?"
    url: https://istio.io/latest/docs/overview/dataplane-modes/
