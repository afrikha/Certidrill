id: kcna-2b-rbac-view-no-secrets
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Developers must be able to read most objects in namespace `shop`, but they must not read Secrets or change anything. Which built-in ClusterRole should a RoleBinding in `shop` reference?
body:
  options:
    - id: a
      text: { en: "`edit`" }
    - id: b
      text: { en: "`admin`" }
    - id: c
      text: { en: "`cluster-admin`" }
    - id: d
      text: { en: "`view`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The built-in `view` ClusterRole gives read-only access to most objects of a namespace and deliberately excludes Secrets, Roles and RoleBindings. Referenced by a RoleBinding in `shop`, it applies only in that namespace.
  options:
    a:
      en: |
        `edit` allows modifying most objects of the namespace and gives access to Secrets.
    b:
      en: |
        `admin` grants read and write access to most resources of the namespace, including Roles and RoleBindings.
    c:
      en: |
        `cluster-admin` is the super-user role. Bound in a namespace, it gives full control over that namespace.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
