id: kcna-2d-pv-phase-released
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A PersistentVolume with the `Retain` reclaim policy was bound to a claim. The claim has just been deleted.

    Which phase does the PersistentVolume show now?
body:
  options:
    - id: a
      text: { en: "`Available`" }
    - id: b
      text: { en: "`Released`" }
    - id: c
      text: { en: "`Bound`" }
    - id: d
      text: { en: "`Failed`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `Released` means the claim has been deleted but the storage resource has not yet been reclaimed by the cluster. With `Retain`, the volume stays in this phase and is not offered to new claims, because the previous data is still on it.
  options:
    a:
      en: |
        `Available` is a free volume not yet bound to a claim. A retained volume does not go back to `Available` by itself after its claim is deleted.
    c:
      en: |
        `Bound` means the volume is bound to a claim. The claim no longer exists here.
    d:
      en: |
        `Failed` means the automatic reclamation of the volume failed. With `Retain`, no automatic reclamation is attempted.
references:
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
