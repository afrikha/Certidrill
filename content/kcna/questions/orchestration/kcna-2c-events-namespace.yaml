id: kcna-2c-events-namespace
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your kubeconfig context uses the `default` namespace. A Pod in the `billing` namespace keeps failing, but the following command lists none of its events:

    ```bash
    kubectl get events
    ```

    What should you change to see the events of that Pod?
body:
  options:
    - id: a
      text: { en: "Add `--namespace billing` to the command." }
    - id: b
      text: { en: "Add `--watch` to the command." }
    - id: c
      text: { en: "Add `-o wide` to the command." }
    - id: d
      text: { en: "Add `--sort-by=.metadata.creationTimestamp` to the command." }
answer: { optionId: a }
explanation:
  correct:
    en: "Events are namespaced objects: an event about a Pod is stored in the Pod's namespace. Without a namespace flag, kubectl lists the events of the context's namespace (`default`), so you must add `--namespace billing` (or `-n billing`), or `--all-namespaces` to see every namespace."
  options:
    b:
      en: "`--watch` streams new events as they arrive, but still only from the `default` namespace."
    c:
      en: "`-o wide` adds columns to the output. It does not change the namespace that is queried."
    d:
      en: "Sorting puts the events in time order, but it still sorts only the events of the `default` namespace."
references:
  - title: Debug Running Pods
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
