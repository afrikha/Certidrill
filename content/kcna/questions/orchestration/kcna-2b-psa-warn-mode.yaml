id: kcna-2b-psa-warn-mode
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before enforcing the Restricted profile in namespace `payments`, a team wants users to see which of their Pods would violate it when they run `kubectl apply`, without blocking anything. Which label should they set?
body:
  options:
    - id: a
      text: { en: "`pod-security.kubernetes.io/enforce: restricted`" }
    - id: b
      text: { en: "`pod-security.kubernetes.io/audit: restricted`" }
    - id: c
      text: { en: "`pod-security.kubernetes.io/enforce: privileged`" }
    - id: d
      text: { en: "`pod-security.kubernetes.io/warn: restricted`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In `warn` mode a violation returns a warning to the user, but the request is allowed. Warn (like audit) is also applied to workload resources such as Deployments, so users see the problem as soon as they apply their manifests.
  options:
    a:
      en: |
        `enforce` rejects violating Pods immediately, which blocks deployments.
    b:
      en: |
        `audit` records violations in the audit log only. Users don't see anything when they apply their manifests.
    c:
      en: |
        The Privileged profile allows everything, so no violation of Restricted would ever be reported.
references:
  - title: "Pod Security Admission"
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
