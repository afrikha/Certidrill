id: kcna-2a-dns-policy-default
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod spec doesn't set `dnsPolicy`. Which DNS policy does the Pod use?
body:
  options:
    - id: a
      text: { en: "`ClusterFirst`" }
    - id: b
      text: { en: "`Default`" }
    - id: c
      text: { en: "`None`" }
    - id: d
      text: { en: "`ClusterFirstWithHostNet`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When `dnsPolicy` is not set, Kubernetes uses `ClusterFirst`. Queries that match the cluster domain go to the cluster DNS, and the DNS server forwards other names to an upstream nameserver.
  options:
    b:
      en: |
        Despite its name, `Default` is not the default policy. It makes the Pod inherit the name resolution settings of its node.
    c:
      en: |
        `None` ignores the cluster DNS settings and requires every setting to be provided in `dnsConfig`.
    d:
      en: |
        `ClusterFirstWithHostNet` must be set explicitly, for Pods that run with `hostNetwork: true`.
references:
  - title: "DNS for Services and Pods"
    url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
