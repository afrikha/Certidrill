id: kcna-2a-dns-coredns
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which CNCF project is the default implementation of cluster DNS in Kubernetes?
body:
  options:
    - id: a
      text: { en: "etcd" }
    - id: b
      text: { en: "Envoy" }
    - id: c
      text: { en: "CoreDNS" }
    - id: d
      text: { en: "Prometheus" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CoreDNS is a flexible, extensible DNS server and the default implementation of Kubernetes cluster DNS. It is a graduated CNCF project, configured with a file called the Corefile. It resolves Service and Pod names for the Pods of the cluster.
  options:
    a:
      en: |
        etcd is the key-value store that holds the cluster state. It doesn't answer DNS queries.
    b:
      en: |
        Envoy is a proxy used by service meshes and gateways, not a DNS server.
    d:
      en: |
        Prometheus collects and stores metrics. It doesn't resolve names.
references:
  - title: "Using CoreDNS for Service Discovery"
    url: https://kubernetes.io/docs/tasks/administer-cluster/coredns/
  - title: "CoreDNS"
    url: https://www.cncf.io/projects/coredns/
