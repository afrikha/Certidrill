id: kcna-2d-csi-external-provisioner
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A CSI driver is deployed with its sidecar containers. When a user creates a PersistentVolumeClaim, one sidecar watches the claim and asks the driver to create the volume.

    Which sidecar is it?
body:
  options:
    - id: a
      text: { en: "external-attacher" }
    - id: b
      text: { en: "external-provisioner" }
    - id: c
      text: { en: "node-driver-registrar" }
    - id: d
      text: { en: "livenessprobe" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The external-provisioner sidecar watches PersistentVolumeClaim objects and triggers the `CreateVolume` and `DeleteVolume` operations of the CSI driver. It runs with the controller plugin.
  options:
    a:
      en: |
        external-attacher watches VolumeAttachment objects and triggers the attach and detach operations (`ControllerPublish` and `ControllerUnpublish`), not volume creation.
    c:
      en: |
        node-driver-registrar runs with the node plugin and registers the driver with the kubelet. It does not create volumes.
    d:
      en: |
        The livenessprobe sidecar lets Kubernetes check the health of the CSI plugin Pod. It does not react to claims.
references:
  - title: Container Storage Interface (CSI) for Kubernetes GA
    url: https://kubernetes.io/blog/2019/01/15/container-storage-interface-ga/
