id: kcna-2c-field-selector-pending
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You want to list, across all namespaces, only the Pods whose phase is `Pending`, so that you can check which workloads cannot be scheduled.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl get pods -A -l status.phase=Pending`" }
    - id: b
      text: { en: "`kubectl get pods -A --field-selector status.phase=Pending`" }
    - id: c
      text: { en: "`kubectl get pods -A --sort-by=.status.phase`" }
    - id: d
      text: { en: "`kubectl events -A --types=Pending`" }
answer: { optionId: b }
explanation:
  correct:
    en: "A field selector filters objects on the value of a resource field. `status.phase` is one of the fields that Pods support, so `--field-selector status.phase=Pending` with `-A` returns only the Pending Pods of every namespace."
  options:
    a:
      en: "`-l` is a label selector: it matches labels in `metadata.labels`. The phase is a status field, not a label, so this command returns no Pods."
    c:
      en: "`--sort-by` orders the list by phase, but it still returns every Pod; it does not filter."
    d:
      en: "`--types` filters events by event type, which is `Normal` or `Warning`. `Pending` is a Pod phase, not an event type."
references:
  - title: Field Selectors
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/field-selectors/
