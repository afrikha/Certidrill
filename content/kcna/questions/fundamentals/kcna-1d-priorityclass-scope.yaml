id: kcna-1d-priorityclass-scope
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement about PriorityClass is correct?
body:
  options:
    - id: a
      text: { en: "It is a namespaced object that applies to every Pod of its namespace" }
    - id: b
      text: { en: "It is set per container in the `resources` field of a Pod" }
    - id: c
      text: { en: "It is a field of the Deployment `strategy` that orders rollouts" }
    - id: d
      text: { en: "It is a cluster-scoped object that Pods reference with `priorityClassName`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A PriorityClass is a non-namespaced object. A Pod in any namespace uses it by setting `priorityClassName`, and the priority admission controller fills in the integer priority from the class.
  options:
    a:
      en: |
        PriorityClass is not namespaced, and it applies only to Pods that name it (or to all new Pods if it is the global default).
    b:
      en: |
        Priority is a property of the whole Pod, set with `spec.priorityClassName`, not a container resource.
    c:
      en: |
        The Deployment strategy controls rolling updates; it has no priority setting.
references:
  - title: "Pod Priority and Preemption"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
