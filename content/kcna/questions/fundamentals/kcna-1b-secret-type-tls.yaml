id: kcna-1b-secret-type-tls
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You need to store a TLS server certificate and its private key in a Secret, for example to terminate HTTPS.

    Which built-in Secret type is meant for this data?
body:
  options:
    - id: a
      text: { en: "`kubernetes.io/tls`" }
    - id: b
      text: { en: "`kubernetes.io/basic-auth`" }
    - id: c
      text: { en: "`kubernetes.io/dockerconfigjson`" }
    - id: d
      text: { en: "`kubernetes.io/service-account-token`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The `kubernetes.io/tls` type holds TLS client or server data: a certificate and its key. `kubectl create secret tls` creates a Secret of this type from PEM files given with `--cert` and `--key`.
  options:
    b: { en: "`kubernetes.io/basic-auth` holds credentials for basic authentication, a user name and a password." }
    c: { en: "`kubernetes.io/dockerconfigjson` holds a serialized `~/.docker/config.json` file with registry credentials." }
    d: { en: "`kubernetes.io/service-account-token` holds a ServiceAccount token, not a certificate and key you provide." }
references:
  - title: Secrets
    url: https://kubernetes.io/docs/concepts/configuration/secret/
