id: kcna-1b-multi-document-yaml
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want to keep a Deployment and the Service that exposes it in the same manifest file `web.yaml`.

    How do you separate the two objects in the file?
body:
  options:
    - id: a
      text: { en: "With an empty line between the two objects" }
    - id: b
      text: { en: "By putting both objects under a single `spec` key" }
    - id: c
      text: { en: "By giving both objects the same `metadata.name`" }
    - id: d
      text: { en: "With a line that contains only `---`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Related resources can be grouped in one YAML manifest, separated by `---`, and defined in any order. `kubectl apply -f web.yaml` then processes every object in the file.
  options:
    a: { en: "An empty line does not end a YAML document; the second object's fields would collide with the first one's." }
    b: { en: "Each object needs its own `apiVersion`, `kind`, `metadata` and `spec`; a `spec` cannot contain other objects." }
    c: { en: "Sharing a name does not separate objects in a file; the `---` separator does." }
references:
  - title: Managing Workloads
    url: https://kubernetes.io/docs/concepts/workloads/management/
