id: kcna-1a-job-run-to-completion
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A database schema migration must run once, now, and be retried automatically if its container fails, until it succeeds. Which workload resource should you use?
body:
  options:
    - id: a
      text: { en: "CronJob" }
    - id: b
      text: { en: "Deployment" }
    - id: c
      text: { en: "DaemonSet" }
    - id: d
      text: { en: "Job" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Job creates one or more Pods and retries them until a specified number of them complete successfully (one by default). Failed Pods are retried with exponential backoff, up to `backoffLimit`, which is 6 by default.
  options:
    a:
      en: |
        A CronJob creates Jobs on a schedule; the migration must run once, now.
    b:
      en: |
        Deployment Pods must use `restartPolicy: Always`, so the task would run again even after it succeeds.
    c:
      en: |
        A DaemonSet runs a long-lived Pod on each node, not a one-off task.
references:
  - title: "Jobs"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/job/
