id: kcna-1d-topologykey-meaning
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In an inter-Pod anti-affinity rule, what does the `topologyKey` field specify?
body:
  options:
    - id: a
      text: { en: "The label of the other Pods that the rule matches" }
    - id: b
      text: { en: "The node label that defines the topology domains" }
    - id: c
      text: { en: "The namespaces in which matching Pods are searched" }
    - id: d
      text: { en: "The weight that the rule adds to a node's score" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `topologyKey` is the key of a node label that defines a topology domain: nodes with the same value for that key are in the same domain. With `kubernetes.io/hostname` the domain is one node; with `topology.kubernetes.io/zone` it is a zone.
  options:
    a:
      en: |
        The other Pods are chosen by the `labelSelector` field, not by `topologyKey`.
    c:
      en: |
        Namespaces are set with the `namespaces` and `namespaceSelector` fields.
    d:
      en: |
        A weight exists only in preferred rules, in the `weight` field (1 to 100).
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
