id: kcna-1a-service-equality-selector
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which of these objects supports only equality-based label selectors, written as a simple map of labels?
body:
  options:
    - id: a
      text: { en: "Deployment" }
    - id: b
      text: { en: "Job" }
    - id: c
      text: { en: "DaemonSet" }
    - id: d
      text: { en: "Service" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Service (like the older ReplicationController) selects Pods with a map of labels, which is equivalent to equality-based requirements. Deployment, ReplicaSet, Job and DaemonSet also support set-based requirements in `matchExpressions`, with the operators `In`, `NotIn`, `Exists` and `DoesNotExist`.
  options:
    a:
      en: |
        A Deployment's selector also accepts set-based requirements in `matchExpressions`.
    b:
      en: |
        A Job's selector also accepts set-based requirements in `matchExpressions`.
    c:
      en: |
        A DaemonSet's selector also accepts set-based requirements in `matchExpressions`.
references:
  - title: "Labels and Selectors"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
