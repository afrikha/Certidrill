id: kcna-1c-filtering-step
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    kube-scheduler first finds the nodes that can run a new Pod, for example by dropping nodes without enough free capacity for its resource requests. What is this step called?
body:
  options:
    - id: a
      text: { en: "Scoring" }
    - id: b
      text: { en: "Filtering" }
    - id: c
      text: { en: "Binding" }
    - id: d
      text: { en: "Preemption" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Filtering finds the feasible nodes: those that meet the Pod's scheduling requirements, such as enough resources for its requests. If no node is left, the Pod is not schedulable yet.
  options:
    a:
      en: |
        Scoring comes after filtering and ranks the feasible nodes; it does not remove nodes.
    c:
      en: |
        Binding records the chosen node with the API server once the decision is made.
    d:
      en: |
        Preemption is attempted only when filtering finds no feasible node; it evicts lower-priority Pods to make room.
references:
  - title: Kubernetes Scheduler
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
