id: kcna-1a-controller-reconcile
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does a Kubernetes controller do?
body:
  options:
    - id: a
      text: { en: "It stores the desired state of every object in a consistent key-value database" }
    - id: b
      text: { en: "It runs a container once and exits as soon as that container has succeeded" }
    - id: c
      text: { en: "It watches the cluster state and acts to move the current state toward the desired state" }
    - id: d
      text: { en: "It translates the names of Services into IP addresses for the Pods that ask" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A controller is a non-terminating control loop, like a thermostat. It tracks at least one resource type, compares the current state with the desired state in `spec`, and makes or requests changes to close the gap. The built-in controllers run inside kube-controller-manager.
  options:
    a:
      en: |
        Storing objects is the role of etcd, behind the API server.
    b:
      en: |
        That describes a Job's Pod. A controller is a non-terminating loop.
    d:
      en: |
        That is cluster DNS, provided by an add-on such as CoreDNS.
references:
  - title: "Controllers"
    url: https://kubernetes.io/docs/concepts/architecture/controller/
