id: kcna-1d-cgroup-v1-node
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Kubernetes v1.37 worker node runs a Linux distribution that still uses cgroup v1. The kubelet configuration does not set `failCgroupV1`. What happens when the kubelet starts?
body:
  options:
    - id: a
      text: { en: "It refuses to start, because cgroup v1 support is deprecated and disabled by default" }
    - id: b
      text: { en: "It starts normally, because cgroup v1 is the default for Kubernetes" }
    - id: c
      text: { en: "It starts and converts the node to cgroup v2 automatically" }
    - id: d
      text: { en: "It starts, but only BestEffort Pods can run on the node" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      cgroup v1 is deprecated since Kubernetes v1.35, and the kubelet no longer starts on a cgroup v1 node by default. An administrator can override this by setting `failCgroupV1: false` in the kubelet configuration, but the supported path is a distribution with cgroup v2.
  options:
    b:
      en: |
        cgroup v2 has been stable since v1.25, and cgroup v1 is deprecated since v1.35.
    c:
      en: |
        The kubelet detects the cgroup version of the OS; it cannot change it. Moving to cgroup v2 is done in the OS configuration.
    d:
      en: |
        There is no such mode; the kubelet either starts or refuses to start on cgroup v1.
references:
  - title: "About cgroup v2"
    url: https://kubernetes.io/docs/concepts/architecture/cgroups/
