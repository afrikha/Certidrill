id: kcna-1c-qos-status-field
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Where can you read the QoS class of a running Pod, and when is it set?
body:
  options:
    - id: a
      text: { en: "In `spec.qosClass`, chosen by the user when creating the Pod" }
    - id: b
      text: { en: "In `status.qosClass`, set at creation and unchanged afterward" }
    - id: c
      text: { en: "In a label on the Pod, updated by the kubelet" }
    - id: d
      text: { en: "In `status.qosClass`, recalculated whenever usage changes" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes derives the QoS class from the requests and limits and records it in `status.qosClass`. It is assigned when the Pod is created and stays unchanged for the Pod's lifetime.
  options:
    a:
      en: |
        There is no field to choose the class; it is derived from requests and limits.
    c:
      en: |
        The class is a status field, not a label, and the kubelet does not update it.
    d:
      en: |
        The class depends on requests and limits, not on actual usage, and it does not change during the Pod's life.
references:
  - title: Configure Quality of Service for Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/quality-service-pod/
