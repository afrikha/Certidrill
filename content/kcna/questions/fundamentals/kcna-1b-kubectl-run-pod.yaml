id: kcna-1b-kubectl-run-pod
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You run the following command.

    ```bash
    kubectl run web --image=nginx:1.27
    ```

    What does it create?
body:
  options:
    - id: a
      text: { en: "A Deployment named `web` with one replica" }
    - id: b
      text: { en: "A ReplicaSet named `web` with one Pod" }
    - id: c
      text: { en: "A Job named `web` that runs once" }
    - id: d
      text: { en: "A single Pod named `web`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kubectl run` starts a single Pod from an image. Nothing recreates the Pod if it is deleted or its node fails. To create a Deployment imperatively, use `kubectl create deployment`.
  options:
    a: { en: "`kubectl run` does not create a Deployment; `kubectl create deployment web --image=...` does." }
    b: { en: "No ReplicaSet is created: the command creates a bare Pod." }
    c: { en: "A Job is created with `kubectl create job`, not with `kubectl run`." }
references:
  - title: kubectl Quick Reference
    url: https://kubernetes.io/docs/reference/kubectl/quick-reference/
