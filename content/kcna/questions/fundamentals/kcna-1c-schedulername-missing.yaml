id: kcna-1c-schedulername-missing
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You create this Pod, but no scheduler named `batch-scheduler` runs in the cluster.

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: report
    spec:
      schedulerName: batch-scheduler
      containers:
      - name: report
        image: registry.example.com/report:1.4
    ```

    What happens?
body:
  options:
    - id: a
      text: { en: "`default-scheduler` places the Pod after a timeout" }
    - id: b
      text: { en: "The API server rejects the Pod" }
    - id: c
      text: { en: "The kubelet of any node starts the Pod" }
    - id: d
      text: { en: "The Pod stays Pending until that scheduler runs" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Pod is placed only by the scheduler whose name matches `spec.schedulerName`. With no `batch-scheduler` running, nobody binds the Pod, so it remains Pending; once a scheduler with that name starts, it schedules the Pod.
  options:
    a:
      en: |
        The default scheduler ignores Pods that name another scheduler; there is no fallback.
    b:
      en: |
        The API server accepts any scheduler name; it does not check that such a scheduler runs.
    c:
      en: |
        A kubelet runs only Pods bound to its own node, which requires a scheduler (or `nodeName`).
references:
  - title: Configure Multiple Schedulers
    url: https://kubernetes.io/docs/tasks/extend-kubernetes/configure-multiple-schedulers/
