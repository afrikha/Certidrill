id: kcna-1b-apply-keeps-scale
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Deployment `web` was created with `kubectl apply -f web.yaml`. The file does not contain a `replicas` field. An operator then runs the following command.

    ```bash
    kubectl scale deployment web --replicas=5
    ```

    Later, someone runs `kubectl apply -f web.yaml` again with the unchanged file. How many replicas does the Deployment have?
body:
  options:
    - id: a
      text: { en: "1, the default replica count of a Deployment" }
    - id: b
      text: { en: "5, the value set by `kubectl scale`" }
    - id: c
      text: { en: "0, because the file has no `replicas` field" }
    - id: d
      text: { en: "None: `kubectl apply` fails with a conflict" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubectl apply` sets the fields present in the file and clears only the fields that were removed from the file since the last apply. Fields set by other writers, such as `replicas` changed by `kubectl scale`, are kept when the file does not mention them.
  options:
    a: { en: "`apply` does not reset fields that the file never contained; the value 5 written by `kubectl scale` stays." }
    c: { en: "A missing field is not read as zero; `apply` leaves fields it never managed untouched." }
    d: { en: "`apply` patches only the observed differences and keeps changes made by other writers, so it does not fail here." }
references:
  - title: Declarative Management of Kubernetes Objects Using Configuration Files
    url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/
