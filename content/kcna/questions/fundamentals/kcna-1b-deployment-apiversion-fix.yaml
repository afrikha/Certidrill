id: kcna-1b-deployment-apiversion-fix
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    `kubectl apply` fails on the following manifest because the API server finds no `Deployment` kind in the version given.

    ```yaml
    apiVersion: v1
    kind: Deployment
    metadata:
      name: web
    spec:
      replicas: 2
    ```

    Which change fixes this error?
body:
  options:
    - id: a
      text: { en: "Change `apiVersion` to `batch/v1`" }
    - id: b
      text: { en: "Change `kind` to `Deployments`" }
    - id: c
      text: { en: "Change `apiVersion` to `apps/v1`" }
    - id: d
      text: { en: "Add `namespace: default` under `metadata`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Deployment belongs to the `apps` API group, so its manifest uses `apiVersion: apps/v1`. The core group `v1` contains objects such as Pod, Service and ConfigMap, but not Deployment.
  options:
    a: { en: "`batch/v1` is the group of Job and CronJob; it has no Deployment kind." }
    b: { en: "`kind` takes the singular type name, `Deployment`; the plural `deployments` is the resource name used in URLs and kubectl." }
    d: { en: "The namespace does not change which API group serves the kind, so the error remains." }
references:
  - title: Objects In Kubernetes
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
