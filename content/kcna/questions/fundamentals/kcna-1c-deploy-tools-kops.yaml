id: kcna-1c-deploy-tools-kops
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Besides kubeadm, which tools does the Kubernetes documentation list for deploying a production control plane?
body:
  options:
    - id: a
      text: { en: "kind and minikube" }
    - id: b
      text: { en: "Helm and Kustomize" }
    - id: c
      text: { en: "Argo CD and Flux" }
    - id: d
      text: { en: "kops and Kubespray" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The production environment guide lists kubeadm, kops and Kubespray as deployment tools for a production-quality control plane.
  options:
    a:
      en: |
        kind and minikube create local clusters for learning, development and tests, not production clusters.
    b:
      en: |
        Helm and Kustomize package and customize application manifests; they do not deploy clusters.
    c:
      en: |
        Argo CD and Flux are GitOps tools that deliver applications to an existing cluster.
references:
  - title: Production environment
    url: https://kubernetes.io/docs/setup/production-environment/
