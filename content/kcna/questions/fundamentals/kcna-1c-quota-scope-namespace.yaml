id: kcna-1c-quota-scope-namespace
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At which scope does a ResourceQuota object limit resource consumption?
body:
  options:
    - id: a
      text: { en: "Each node" }
    - id: b
      text: { en: "Each Pod" }
    - id: c
      text: { en: "The whole cluster" }
    - id: d
      text: { en: "One namespace" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A ResourceQuota is a namespaced object that limits aggregate consumption in its namespace: total requests and limits, and the number of objects of each kind. It lets administrators share a cluster fairly between teams.
  options:
    a:
      en: |
        Node capacity is enforced by the scheduler and the kubelet, not by ResourceQuota.
    b:
      en: |
        Per-Pod or per-container bounds are the job of a LimitRange.
    c:
      en: |
        A ResourceQuota applies only to the namespace it is created in, not to the whole cluster.
references:
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
