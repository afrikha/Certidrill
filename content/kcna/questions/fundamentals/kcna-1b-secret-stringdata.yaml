id: kcna-1b-secret-stringdata
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You write a Secret manifest by hand. You want to type the value `s3cr3t` as plain text, without base64-encoding it yourself.

    Which field of the Secret do you use?
body:
  options:
    - id: a
      text: { en: "`data`" }
    - id: b
      text: { en: "`binaryData`" }
    - id: c
      text: { en: "`stringData`" }
    - id: d
      text: { en: "`spec`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `stringData` accepts arbitrary strings; its entries are merged into `data` when the Secret is stored, and `stringData` wins if a key appears in both. Remember that base64 is an encoding, not encryption.
  options:
    a: { en: "Values in `data` must already be base64-encoded." }
    b: { en: "`binaryData` is a ConfigMap field for base64-encoded binary values, not a Secret field." }
    d: { en: "A Secret has no `spec`; its content goes in `data` or `stringData`." }
references:
  - title: Secrets
    url: https://kubernetes.io/docs/concepts/configuration/secret/
