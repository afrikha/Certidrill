id: kcna-1b-api-resources-cluster-scoped
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You need the list of resource types that are cluster-scoped, so that their manifests must not set `metadata.namespace`.

    Which command lists only these types?
body:
  options:
    - id: a
      text: { en: "`kubectl get all -A`" }
    - id: b
      text: { en: "`kubectl api-resources --namespaced=true`" }
    - id: c
      text: { en: "`kubectl api-resources --namespaced=false`" }
    - id: d
      text: { en: "`kubectl get namespaces`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubectl api-resources --namespaced=false` returns the non-namespaced (cluster-scoped) resource types, such as Node, Namespace and CustomResourceDefinition.
  options:
    a: { en: "`kubectl get all -A` lists objects of common namespaced types in every namespace, not resource types." }
    b: { en: "`--namespaced=true` returns the namespaced types, the opposite of what is needed." }
    d: { en: "`kubectl get namespaces` lists the namespaces of the cluster, not the resource types that live outside them." }
references:
  - title: kubectl api-resources
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_api-resources/
