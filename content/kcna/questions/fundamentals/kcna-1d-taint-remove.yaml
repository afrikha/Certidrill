id: kcna-1d-taint-remove
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Node `node-4` has the taint `gpu=true:NoSchedule`. Which command removes this taint?
body:
  options:
    - id: a
      text: { en: "`kubectl uncordon node-4`" }
    - id: b
      text: { en: "`kubectl label nodes node-4 gpu-`" }
    - id: c
      text: { en: "`kubectl taint nodes node-4 gpu=true:NoSchedule-`" }
    - id: d
      text: { en: "`kubectl drain node-4`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A taint is removed with the same `kubectl taint` command followed by a trailing hyphen: `key=value:effect-`. The node then accepts Pods without a toleration again.
  options:
    a:
      en: |
        Uncordoning reverses `kubectl cordon` (the unschedulable flag); it does not remove a taint you added.
    b:
      en: |
        This removes a node label named `gpu`; taints are a separate field of the node.
    d:
      en: |
        Draining evicts the Pods from the node and cordons it; it does not remove taints.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
