id: kcna-1a-set-based-in-selector
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You need to list the Pods whose `env` label is either `prod` or `staging`. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl get pods -l 'env in (prod,staging)'`" }
    - id: b
      text: { en: "`kubectl get pods -l env=prod,env=staging`" }
    - id: c
      text: { en: "`kubectl get pods -l 'env=prod||env=staging'`" }
    - id: d
      text: { en: "`kubectl get pods --field-selector 'env in (prod,staging)'`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A set-based requirement such as `env in (prod,staging)` matches objects whose label value is in the set, which gives an OR on values. Requirements separated by commas are ANDed together.
  options:
    b:
      en: |
        The comma is a logical AND: no Pod has both values, so nothing matches.
    c:
      en: |
        Label selectors have no OR operator; OR on values needs the set-based `in` form.
    d:
      en: |
        Field selectors filter resource fields, not labels, and support only `=`, `==` and `!=`.
references:
  - title: "Labels and Selectors"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
