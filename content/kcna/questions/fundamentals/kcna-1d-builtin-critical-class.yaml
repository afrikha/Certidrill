id: kcna-1d-builtin-critical-class
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which name is a PriorityClass built into Kubernetes to protect critical system Pods?
body:
  options:
    - id: a
      text: { en: "`system-node-critical`" }
    - id: b
      text: { en: "`Guaranteed`" }
    - id: c
      text: { en: "`kube-system`" }
    - id: d
      text: { en: "`default-scheduler`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Kubernetes ships with two PriorityClasses, `system-cluster-critical` and `system-node-critical`, so that critical components are always scheduled first. Their values are above the 1-billion ceiling of user-defined classes, and user classes cannot use the `system-` prefix.
  options:
    b:
      en: |
        `Guaranteed` is a QoS class derived from requests and limits, not a PriorityClass.
    c:
      en: |
        `kube-system` is the namespace of system components, not a PriorityClass.
    d:
      en: |
        `default-scheduler` is the name of the default scheduler profile, not a PriorityClass.
references:
  - title: "Pod Priority and Preemption"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
