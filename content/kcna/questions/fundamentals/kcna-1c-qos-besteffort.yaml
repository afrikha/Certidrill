id: kcna-1c-qos-besteffort
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which QoS class does Kubernetes assign to this Pod?

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: tools
    spec:
      containers:
      - name: tools
        image: busybox:1.37
        command: ["sleep", "3600"]
    ```
body:
  options:
    - id: a
      text: { en: "BestEffort" }
    - id: b
      text: { en: "Burstable" }
    - id: c
      text: { en: "Guaranteed" }
    - id: d
      text: { en: "No class, until resources are set" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Pod is BestEffort when none of its containers sets any CPU or memory request or limit. BestEffort Pods are the first candidates for eviction when the node runs short of resources.
  options:
    b:
      en: |
        Burstable requires at least one CPU or memory request or limit in the Pod.
    c:
      en: |
        Guaranteed requires CPU and memory requests equal to limits in every container.
    d:
      en: |
        Kubernetes assigns every Pod a QoS class; a Pod without resources gets BestEffort.
references:
  - title: Pod Quality of Service Classes
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/
