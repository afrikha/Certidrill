id: kcna-1e-crio-purpose
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which container runtime is a lightweight runtime made only for Kubernetes, able to run Pods with any OCI-compliant runtime such as runc or Kata Containers?
body:
  options:
    - id: a
      text: { en: "CRI-O" }
    - id: b
      text: { en: "runc" }
    - id: c
      text: { en: "gVisor" }
    - id: d
      text: { en: "Docker Engine" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CRI-O implements the Kubernetes Container Runtime Interface so that Kubernetes can use OCI-compliant runtimes such as runc or Kata Containers. It is a lightweight runtime dedicated to Kubernetes and a CNCF graduated project.
  options:
    b:
      en: |
        runc is a low-level OCI runtime that creates containers. It doesn't implement the CRI, so the kubelet can't use it directly.
    c:
      en: |
        gVisor is a sandbox with an application kernel. Its OCI runtime, `runsc`, is called by a CRI runtime; it is not a CRI implementation.
    d:
      en: |
        Docker Engine doesn't implement the CRI. Kubernetes can use it only through the `cri-dockerd` adapter.
references:
  - title: "cri-o"
    url: https://cri-o.io/
