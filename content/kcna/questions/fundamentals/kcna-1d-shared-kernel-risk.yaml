id: kcna-1d-shared-kernel-risk
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement describes a security drawback of containers compared with virtual machines?
body:
  options:
    - id: a
      text: { en: "Each container runs an outdated copy of the guest kernel" }
    - id: b
      text: { en: "A flaw in the shared host kernel can affect every container on the host" }
    - id: c
      text: { en: "Containers cannot have memory limits, so one can starve the others" }
    - id: d
      text: { en: "Containers cannot be given their own network stack" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Containers relax isolation by sharing the host's operating system kernel. That makes them lightweight, but the kernel becomes a common point: a kernel vulnerability or a privileged container can reach beyond one container, whereas each VM has its own kernel behind a hypervisor.
  options:
    a:
      en: |
        Containers have no guest kernel; they all use the host's kernel.
    c:
      en: |
        Memory limits are enforced on containers through cgroups.
    d:
      en: |
        Each container (or Pod) can have its own network stack through a network namespace.
references:
  - title: "Overview"
    url: https://kubernetes.io/docs/concepts/overview/
