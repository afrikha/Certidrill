id: kcna-1a-deployment-apiversion
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which `apiVersion` do you set in the manifest of a Deployment?
body:
  options:
    - id: a
      text: { en: "`v1`" }
    - id: b
      text: { en: "`batch/v1`" }
    - id: c
      text: { en: "`apps/v1`" }
    - id: d
      text: { en: "`networking.k8s.io/v1`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Deployments, like ReplicaSets, StatefulSets and DaemonSets, belong to the `apps` API group at the stable version `v1`, so their manifests use `apiVersion: apps/v1`.
  options:
    a:
      en: |
        `v1` is the core group, which contains Pods, Services, ConfigMaps and Namespaces, but not Deployments.
    b:
      en: |
        `batch/v1` contains Jobs and CronJobs.
    d:
      en: |
        `networking.k8s.io/v1` contains networking objects such as Ingress and NetworkPolicy.
references:
  - title: "Objects In Kubernetes"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
  - title: "API Overview"
    url: https://kubernetes.io/docs/reference/using-api/
