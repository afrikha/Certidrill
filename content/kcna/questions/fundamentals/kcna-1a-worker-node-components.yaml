id: kcna-1a-worker-node-components
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which set of components runs on a typical worker node?
body:
  options:
    - id: a
      text: { en: "kube-apiserver, etcd and kubelet" }
    - id: b
      text: { en: "kube-scheduler, kubelet and kube-proxy" }
    - id: c
      text: { en: "kubelet, kube-proxy and a container runtime" }
    - id: d
      text: { en: "kube-controller-manager, kube-proxy and a container runtime" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Node components run on every node: the kubelet (runs the Pods), kube-proxy (Service network rules, optional when a network plugin replaces it) and a container runtime. kube-apiserver, etcd, kube-scheduler and the controller managers form the control plane.
  options:
    a:
      en: |
        kube-apiserver and etcd are control plane components; they don't run on ordinary worker nodes.
    b:
      en: |
        kube-scheduler is a control plane component; worker nodes also need a container runtime.
    d:
      en: |
        kube-controller-manager is a control plane component, and a node needs a kubelet to run Pods.
references:
  - title: "Cluster Architecture"
    url: https://kubernetes.io/docs/concepts/architecture/
