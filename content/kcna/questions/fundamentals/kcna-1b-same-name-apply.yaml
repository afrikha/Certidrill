id: kcna-1b-same-name-apply
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Two files both define a Deployment named `web` in the namespace `shop`. The files are identical except for the container image: `team-a.yaml` uses `nginx:1.26`, and `team-b.yaml` uses `nginx:1.27`. You run the following commands.

    ```bash
    kubectl apply -f team-a.yaml
    kubectl apply -f team-b.yaml
    ```

    What is the result?
body:
  options:
    - id: a
      text: { en: "One Deployment `web`, now running `nginx:1.27`" }
    - id: b
      text: { en: "Two Deployments named `web`, one per image" }
    - id: c
      text: { en: "One Deployment `web` with two containers, one per image" }
    - id: d
      text: { en: "One Deployment `web` with `nginx:1.26`; the second apply fails" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A name is unique for a resource type within a namespace, so both files describe the same object. The first `apply` creates it, and the second updates it to `nginx:1.27`.
  options:
    b: { en: "Only one Deployment can be named `web` in the namespace `shop` at a time." }
    c: { en: "Both files define the same container; the second `apply` changes its image instead of adding a second container." }
    d: { en: "`kubectl apply` updates an existing object instead of failing; `kubectl create` is the command that fails when the object exists." }
references:
  - title: Object Names and IDs
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/
