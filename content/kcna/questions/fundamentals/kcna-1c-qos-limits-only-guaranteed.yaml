id: kcna-1c-qos-limits-only-guaranteed
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Pod has a single container that sets only limits, and no LimitRange exists in the namespace. Which QoS class does the Pod get?

    ```yaml
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
    ```
body:
  options:
    - id: a
      text: { en: "BestEffort" }
    - id: b
      text: { en: "Burstable" }
    - id: c
      text: { en: "No class, until requests are added" }
    - id: d
      text: { en: "Guaranteed" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Kubernetes copies each limit into the missing request, so the container ends up with CPU and memory requests equal to its limits. Every container then meets the Guaranteed conditions.
  options:
    a:
      en: |
        BestEffort requires no request and no limit; this container sets limits.
    b:
      en: |
        The requests are not missing after admission: they equal the limits, which makes the Pod Guaranteed, not Burstable.
    c:
      en: |
        Every Pod gets a QoS class when it is created.
references:
  - title: Configure Quality of Service for Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/quality-service-pod/
  - title: Pod Quality of Service Classes
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/
