id: kcna-1b-no-user-object
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A kubeconfig file contains a user entry named `alice` with a client certificate and key.

    Which statement about `alice` is true?
body:
  options:
    - id: a
      text: { en: "`kubectl get users` lists `alice` as an object in the cluster" }
    - id: b
      text: { en: "`alice` is a ServiceAccount in the `default` namespace" }
    - id: c
      text: { en: "`alice` names credentials in the file; the cluster has no User object" }
    - id: d
      text: { en: "Deleting the `alice` User object revokes her access" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes has no objects that represent normal user accounts, and normal users cannot be added through an API call. The API server authenticates the credentials it receives, for example a client certificate signed by the cluster's CA, whose common name becomes the user name.
  options:
    a: { en: "There is no User resource in the Kubernetes API, so `kubectl get users` has nothing to list." }
    b: { en: "ServiceAccounts are API objects for workloads, bound to a namespace; a kubeconfig user entry does not create one." }
    d: { en: "No User object exists to delete; access depends on the credentials and on authorization rules such as RBAC bindings." }
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
