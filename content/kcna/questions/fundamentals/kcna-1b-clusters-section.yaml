id: kcna-1b-clusters-section
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The address of a cluster's API server changed. You must update the kubeconfig file so that kubectl reaches the new address.

    In which section of the file is the API server address stored?
body:
  options:
    - id: a
      text: { en: "`users`" }
    - id: b
      text: { en: "`clusters`" }
    - id: c
      text: { en: "`contexts`" }
    - id: d
      text: { en: "`preferences`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each entry of `clusters` holds the `server` address of an API server and the certificate authority to trust (`certificate-authority` or `certificate-authority-data`). `kubectl config set-cluster` updates these entries.
  options:
    a: { en: "`users` entries hold credentials, such as a client certificate and key, a token or an exec plugin, not server addresses." }
    c: { en: "`contexts` entries only reference a cluster and a user by name, plus a namespace." }
    d: { en: "`preferences` holds client preferences and is usually empty; it does not define where clusters are." }
references:
  - title: Configure Access to Multiple Clusters
    url: https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/
