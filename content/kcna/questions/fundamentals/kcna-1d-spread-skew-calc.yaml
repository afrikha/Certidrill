id: kcna-1d-spread-skew-calc
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Zones A, B and C currently run 2, 2 and 1 Pods labeled `app=web`. A new `app=web` Pod has a topology spread constraint with `maxSkew: 1`, `topologyKey: topology.kubernetes.io/zone` and `whenUnsatisfiable: DoNotSchedule`. Every zone has free capacity. Where can the new Pod be scheduled?
body:
  options:
    - id: a
      text: { en: "In zone A, B or C" }
    - id: b
      text: { en: "Only in zone A or zone B" }
    - id: c
      text: { en: "Only in zone C" }
    - id: d
      text: { en: "Nowhere: the Pod stays `Pending`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Skew is the number of matching Pods in a zone minus the global minimum. In zone C the result is 2, 2, 2 (skew 0); in zone A or B it would be 3 against a minimum of 1 (skew 2), which violates `maxSkew: 1`. With `DoNotSchedule`, only zone C is allowed.
  options:
    a:
      en: |
        Placing the Pod in A or B gives a zone 3 Pods while C keeps 1: a skew of 2, which exceeds `maxSkew: 1`.
    b:
      en: |
        These are exactly the placements that would raise the skew to 2.
    d:
      en: |
        Placing it in zone C gives 2, 2, 2, a skew of 0, which respects the constraint.
references:
  - title: "Pod Topology Spread Constraints"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
