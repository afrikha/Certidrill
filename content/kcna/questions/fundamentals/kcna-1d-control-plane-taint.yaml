id: kcna-1d-control-plane-taint
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a cluster created with kubeadm, application Pods are never scheduled on the control plane node. What causes this?
body:
  options:
    - id: a
      text: { en: "The control plane node runs no kubelet, so it cannot run Pods" }
    - id: b
      text: { en: "The node has the taint `node-role.kubernetes.io/control-plane:NoSchedule`" }
    - id: c
      text: { en: "kube-scheduler skips every node whose name contains `control`" }
    - id: d
      text: { en: "A ResourceQuota on the node limits it to system Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      By default kubeadm taints control plane nodes with `node-role.kubernetes.io/control-plane:NoSchedule`, so Pods without a matching toleration are not scheduled there. Removing the taint (for example on a single-node lab cluster) lets the scheduler use those nodes.
  options:
    a:
      en: |
        kubeadm runs a kubelet on control plane nodes; it starts the control plane components there as static Pods.
    c:
      en: |
        The scheduler does not filter on node names; it filters on resources, selectors, affinity and taints.
    d:
      en: |
        ResourceQuota is a namespace object that caps total consumption; it is not attached to nodes.
references:
  - title: "Creating a cluster with kubeadm"
    url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
