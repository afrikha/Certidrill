id: kcna-1b-manifest-kind
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a Kubernetes manifest, which top-level field states the type of object to create, such as `Deployment` or `Service`?
body:
  options:
    - id: a
      text: { en: "`apiVersion`" }
    - id: b
      text: { en: "`kind`" }
    - id: c
      text: { en: "`metadata`" }
    - id: d
      text: { en: "`spec`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kind` says what kind of object you want to create. A manifest sets four fields: `apiVersion`, `kind`, `metadata` and `spec`.
  options:
    a: { en: "`apiVersion` gives the API group and version used to create the object, such as `apps/v1`, not its type." }
    c: { en: "`metadata` identifies the object: its name, namespace, labels and annotations." }
    d: { en: "`spec` describes the desired state of the object; its content depends on the kind." }
references:
  - title: Objects In Kubernetes
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
