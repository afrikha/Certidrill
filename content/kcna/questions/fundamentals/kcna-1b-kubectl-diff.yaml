id: kcna-1b-kubectl-diff
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before you run `kubectl apply -f web.yaml` in production, you want to see which fields of the live objects the command would change.

    Which command shows this?
body:
  options:
    - id: a
      text: { en: "`kubectl describe -f web.yaml`" }
    - id: b
      text: { en: "`kubectl get -f web.yaml -o yaml`" }
    - id: c
      text: { en: "`kubectl diff -f web.yaml`" }
    - id: d
      text: { en: "`kubectl rollout status -f web.yaml`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubectl diff` compares the file with the live configuration and shows what `kubectl apply` would change. It uses a server-side dry run, so nothing is modified.
  options:
    a: { en: "`kubectl describe` shows the current state of the objects named in the file, without comparing it with the file." }
    b: { en: "`kubectl get -o yaml` prints the live objects only; you would have to compare them with the file yourself." }
    d: { en: "`kubectl rollout status` follows the progress of a rollout that is already happening; it does not preview changes." }
references:
  - title: Declarative Management of Kubernetes Objects Using Configuration Files
    url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/
