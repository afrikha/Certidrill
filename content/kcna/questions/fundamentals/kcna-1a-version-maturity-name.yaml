id: kcna-1a-version-maturity-name
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which of these API version names indicates a stable (GA) API?
body:
  options:
    - id: a
      text: { en: "`v2beta3`" }
    - id: b
      text: { en: "`v1alpha1`" }
    - id: c
      text: { en: "`v3alpha1`" }
    - id: d
      text: { en: "`v1`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Version names show stability: `vXalphaY` is alpha, `vXbetaY` is beta and `vX` is stable. Stable versions remain available for all future releases within the Kubernetes major version, so a higher number before `alpha` or `beta` does not mean a more mature API.
  options:
    a:
      en: |
        A beta version, whatever its number: its schema may still change in a later version.
    b:
      en: |
        An alpha version: disabled by default, and it may be dropped at any time without notice.
    c:
      en: |
        Also alpha: the number in front of `alpha` says nothing about maturity.
references:
  - title: "API Overview"
    url: https://kubernetes.io/docs/reference/using-api/
