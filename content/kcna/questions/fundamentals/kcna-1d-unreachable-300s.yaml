id: kcna-1d-unreachable-300s
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A worker node becomes unreachable. Its Pods remain bound to it for about five minutes before they are evicted, although nobody configured tolerations for this. Why?
body:
  options:
    - id: a
      text: { en: "An automatic toleration of the `unreachable` taint for 300 seconds" }
    - id: b
      text: { en: "The default `terminationGracePeriodSeconds` of the Pods is 300 seconds" }
    - id: c
      text: { en: "A PodDisruptionBudget delays every eviction by 300 seconds" }
    - id: d
      text: { en: "The kubelet on the node waits 300 seconds before it stops the containers" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The node controller taints an unreachable node with `node.kubernetes.io/unreachable:NoExecute`. Unless a toleration is set explicitly, Kubernetes adds one for this taint (and for `not-ready`) with `tolerationSeconds=300`, so Pods stay bound for 5 minutes before eviction.
  options:
    b:
      en: |
        The termination grace period is the time a container gets to stop after a delete; it does not delay eviction.
    c:
      en: |
        A PodDisruptionBudget limits voluntary disruptions; it adds no fixed delay and is not created automatically.
    d:
      en: |
        The node is unreachable, so the eviction is driven by the control plane, not by that node's kubelet.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
