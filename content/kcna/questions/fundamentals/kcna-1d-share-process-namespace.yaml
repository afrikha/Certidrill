id: kcna-1d-share-process-namespace
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod has two containers, `app` and `debug`. From `debug`, you need to see and signal the processes of `app`, without exposing the processes of the node. Which Pod spec setting allows this?
body:
  options:
    - id: a
      text: { en: "`hostPID: true`" }
    - id: b
      text: { en: "`hostNetwork: true`" }
    - id: c
      text: { en: "`hostUsers: false`" }
    - id: d
      text: { en: "`shareProcessNamespace: true`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default each container of a Pod has its own PID namespace. With `shareProcessNamespace: true`, the containers share one, so processes of `app` are visible to `debug` (which also needs the `SYS_PTRACE` capability to signal them).
  options:
    a:
      en: |
        `hostPID` puts the Pod in the node's PID namespace, which exposes every process of the node.
    b:
      en: |
        `hostNetwork` shares the node's network namespace; it has no effect on process visibility.
    c:
      en: |
        `hostUsers: false` runs the Pod in a user namespace; it changes user ID mapping, not process visibility.
references:
  - title: "Share Process Namespace between Containers in a Pod"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/
