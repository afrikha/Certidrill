id: kcna-1e-overhead-scheduling-total
objective: "1.4.5"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A RuntimeClass and a Pod are defined as follows.

    ```yaml
    apiVersion: node.k8s.io/v1
    kind: RuntimeClass
    metadata:
      name: kata
    handler: kata
    overhead:
      podFixed:
        cpu: 250m
        memory: 128Mi
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: batch
    spec:
      runtimeClassName: kata
      containers:
      - name: worker
        image: registry.example.com/batch/worker:1.0
        resources:
          requests: { cpu: 500m, memory: 256Mi }
    ```

    Which resource requests does kube-scheduler use for this Pod?
body:
  options:
    - id: a
      text: { en: "250m CPU and 128Mi memory" }
    - id: b
      text: { en: "500m CPU and 256Mi memory" }
    - id: c
      text: { en: "750m CPU and 384Mi memory" }
    - id: d
      text: { en: "1000m CPU and 512Mi memory" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The RuntimeClass overhead is copied into the Pod's `spec.overhead` at admission. The scheduler adds it to the sum of the container requests: 500m + 250m = 750m CPU and 256Mi + 128Mi = 384Mi memory.
  options:
    a:
      en: |
        These values are the overhead alone. The scheduler adds them to the container requests.
    b:
      en: |
        These values are the container requests alone. With a RuntimeClass overhead, the scheduler also counts the overhead.
    d:
      en: |
        The overhead is added once per Pod, not doubled, and the container requests are not doubled either.
references:
  - title: "Pod Overhead"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-overhead/
