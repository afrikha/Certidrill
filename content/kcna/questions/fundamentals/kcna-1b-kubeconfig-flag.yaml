id: kcna-1b-kubeconfig-flag
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    `KUBECONFIG` lists the files `dev.yaml` and `prod.yaml`. A CI job runs the following command.

    ```bash
    kubectl --kubeconfig=ci.yaml get pods
    ```

    Which kubeconfig data does kubectl use?
body:
  options:
    - id: a
      text: { en: "The three files merged, with `ci.yaml` first" }
    - id: b
      text: { en: "`dev.yaml` and `prod.yaml`; the flag is ignored" }
    - id: c
      text: { en: "`ci.yaml` merged with `$HOME/.kube/config`" }
    - id: d
      text: { en: "Only `ci.yaml`, without merging any other file" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When `--kubeconfig` is set, kubectl uses only the specified file and does not merge it with anything else. Only one instance of the flag is allowed.
  options:
    a: { en: "The flag replaces the `KUBECONFIG` list instead of being merged with it." }
    b: { en: "The command-line flag takes precedence over the `KUBECONFIG` environment variable." }
    c: { en: "`$HOME/.kube/config` is used only when neither the flag nor `KUBECONFIG` is set." }
references:
  - title: Organizing Cluster Access Using kubeconfig Files
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
