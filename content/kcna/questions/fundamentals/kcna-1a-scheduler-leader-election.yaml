id: kcna-1a-scheduler-leader-election
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A highly available control plane runs three `kube-scheduler` instances. How does Kubernetes make sure that only one of them schedules Pods at any given time?
body:
  options:
    - id: a
      text: { en: "The instances use leader election with a Lease object, and the other instances wait on standby" }
    - id: b
      text: { en: "etcd gives each instance a share of the nodes, and each instance schedules Pods only onto its own share" }
    - id: c
      text: { en: "kube-apiserver sends each new Pod to the scheduler instances in turn, in a round-robin order" }
    - id: d
      text: { en: "Each instance schedules only the Pods of the namespaces that are assigned to it in its config" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Kubernetes uses Leases (`coordination.k8s.io`) to ensure that only one instance of a component such as kube-scheduler or kube-controller-manager is active at a time. The instance that holds the Lease is the leader; the others stay on standby and can take over if it fails.
  options:
    b:
      en: |
        etcd only stores data; it does not divide work between scheduler instances.
    c:
      en: |
        The API server does not dispatch Pods to schedulers; the active scheduler watches for unscheduled Pods itself.
    d:
      en: |
        Scheduler instances are not split by namespace; the active instance schedules Pods of every namespace.
references:
  - title: "Leases"
    url: https://kubernetes.io/docs/concepts/architecture/leases/
