id: kcna-1e-runtimeclass-scope
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement about RuntimeClass objects is true?
body:
  options:
    - id: a
      text: { en: "They are cluster-scoped, so Pods of any namespace can reference them" }
    - id: b
      text: { en: "They are namespaced, so each namespace needs its own copy" }
    - id: c
      text: { en: "The kubelet creates one for each runtime installed on its node" }
    - id: d
      text: { en: "They were removed, together with dockershim, in Kubernetes v1.24" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      RuntimeClass is a cluster-scoped (non-namespaced) resource of the `node.k8s.io/v1` API, stable since v1.20. An administrator creates it once, and Pods of any namespace reference it by name with `runtimeClassName`.
  options:
    b:
      en: |
        RuntimeClass is not namespaced. A single object serves the Pods of every namespace.
    c:
      en: |
        RuntimeClasses are created by cluster administrators. The handler must also be configured in the node's runtime, but the kubelet doesn't create the objects.
    d:
      en: |
        RuntimeClass is a stable API in current Kubernetes versions. v1.24 removed dockershim, not RuntimeClass.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
