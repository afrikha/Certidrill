id: kcna-1d-podaffinity-cache
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pods of a web front end should run in the same zone as the Pods of their cache to reduce latency. Which mechanism expresses this?
body:
  options:
    - id: a
      text: { en: "Node affinity" }
    - id: b
      text: { en: "Inter-Pod affinity" }
    - id: c
      text: { en: "Inter-Pod anti-affinity" }
    - id: d
      text: { en: "A toleration" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Inter-Pod affinity places a Pod in a topology domain (here a zone, through `topologyKey: topology.kubernetes.io/zone`) that already runs Pods with given labels. The front end is therefore scheduled close to its cache.
  options:
    a:
      en: |
        Node affinity selects nodes by their own labels; it cannot express a relationship with other Pods.
    c:
      en: |
        Anti-affinity keeps Pods away from matching Pods, which is the opposite of the requirement.
    d:
      en: |
        A toleration only allows a Pod onto tainted nodes; it does not bring Pods near other Pods.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
