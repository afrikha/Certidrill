id: kcna-1a-core-group-apiversion
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manifest starts with `apiVersion: v1` and `kind: Service`. What does `apiVersion: v1` tell you?
body:
  options:
    - id: a
      text: { en: "The object belongs to the core API group, at its stable version `v1`" }
    - id: b
      text: { en: "The object belongs to a named API group that is called `v1`" }
    - id: c
      text: { en: "The object uses an alpha API version that is disabled by default" }
    - id: d
      text: { en: "The object is a custom resource defined by a CustomResourceDefinition" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The core (legacy) group is served at `/api/v1` and has no group name, so its objects use `apiVersion: v1`. Named groups are served at `/apis/GROUP/VERSION` and appear as `GROUP/VERSION`, for example `batch/v1`.
  options:
    b:
      en: |
        `v1` is a version, not a group: core objects have no group name, and named groups appear as `group/version`.
    c:
      en: |
        Alpha versions contain `alpha` in their name, such as `v1alpha1`; `v1` is stable.
    d:
      en: |
        Custom resources are served under a named group of their own, so their `apiVersion` has the form `group/version`.
references:
  - title: "API Overview"
    url: https://kubernetes.io/docs/reference/using-api/
