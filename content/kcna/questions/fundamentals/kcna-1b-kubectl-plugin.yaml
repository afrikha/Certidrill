id: kcna-1b-kubectl-plugin
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want to add a new subcommand to `kubectl` on your own workstation. It does not need to change anything on the cluster side.

    Which extension point fits?
body:
  options:
    - id: a
      text: { en: "CustomResourceDefinition" }
    - id: b
      text: { en: "Admission webhook" }
    - id: c
      text: { en: "CSI driver" }
    - id: d
      text: { en: "kubectl plugin" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      kubectl plugins are separate binaries that add or replace the behavior of kubectl subcommands. They affect only the local environment of the user who installs them, so they cannot enforce cluster-wide policies.
  options:
    a: { en: "A CRD adds a new resource kind to the API on the cluster side; it does not add a kubectl subcommand." }
    b: { en: "An admission webhook runs at the API server to accept, reject or change objects; it is a cluster-side extension." }
    c: { en: "A CSI driver adds support for a kind of storage volume on the nodes, not a command-line feature." }
references:
  - title: Extending Kubernetes
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/
