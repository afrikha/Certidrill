id: kcna-1b-untrusted-kubeconfig
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A colleague forwards you a kubeconfig file that came from an unknown source and asks you to use it with kubectl.

    What is the main risk?
body:
  options:
    - id: a
      text: { en: "A crafted kubeconfig can run malicious code or expose local files" }
    - id: b
      text: { en: "kubectl uploads your existing kubeconfig to the new cluster" }
    - id: c
      text: { en: "The file permanently replaces `$HOME/.kube/config`" }
    - id: d
      text: { en: "The file deletes the contexts already defined on your workstation" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Kubernetes documentation warns to use kubeconfig files only from trusted sources: a specially crafted file can lead to malicious code execution or file exposure, for example through an `exec` credential plugin that runs a command. Inspect an untrusted file as carefully as a shell script.
  options:
    b: { en: "kubectl sends requests to the API server with the selected credentials; it does not upload kubeconfig files to clusters." }
    c: { en: "Using a file with `--kubeconfig` or `KUBECONFIG` does not overwrite `$HOME/.kube/config`." }
    d: { en: "Reading another kubeconfig file does not remove contexts from your own file." }
references:
  - title: Organizing Cluster Access Using kubeconfig Files
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
