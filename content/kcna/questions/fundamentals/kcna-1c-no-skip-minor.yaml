id: kcna-1c-no-skip-minor
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A kubeadm cluster runs Kubernetes 1.35. The team wants to reach 1.37. What is the supported upgrade path?
body:
  options:
    - id: a
      text: { en: "Upgrade to 1.36 first, then from 1.36 to 1.37" }
    - id: b
      text: { en: "Run `kubeadm upgrade apply` with v1.37 directly" }
    - id: c
      text: { en: "Upgrade every kubelet to 1.37 first, then the control plane" }
    - id: d
      text: { en: "Upgrade the worker nodes only; the control plane follows" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Skipping minor versions is not supported, even in single-instance clusters. The cluster must go from 1.35 to 1.36, then from 1.36 to 1.37, each time upgrading the control plane before the nodes.
  options:
    b:
      en: |
        `kubeadm upgrade apply` enforces the version skew policy; a jump from 1.35 to 1.37 skips a minor version and is not supported.
    c:
      en: |
        A kubelet must never be newer than the kube-apiserver, so the nodes cannot be upgraded before the control plane.
    d:
      en: |
        The control plane is upgraded first and separately; it is never upgraded as a side effect of node upgrades.
references:
  - title: Upgrading kubeadm clusters
    url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
  - title: Version Skew Policy
    url: https://kubernetes.io/releases/version-skew-policy/
