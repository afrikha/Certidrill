id: kcna-1b-operator-pattern
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which approach combines a custom resource with a custom controller that encodes the knowledge of a human operator, for example to back up, restore and upgrade a database?
body:
  options:
    - id: a
      text: { en: "Sidecar container" }
    - id: b
      text: { en: "Init container" }
    - id: c
      text: { en: "Operator pattern" }
    - id: d
      text: { en: "Admission webhook" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Operators are software extensions that use custom resources to manage applications and their components. The operator's controller is a client of the Kubernetes API that reconciles the custom resource, automating tasks such as deployment, backups, restores and upgrades.
  options:
    a: { en: "A sidecar container runs beside the app container in the same Pod, for example to ship logs; it does not manage a custom resource." }
    b: { en: "An init container runs to completion before the app containers start; it is not a controller." }
    d: { en: "An admission webhook checks or changes objects before they are stored; it does not continuously manage an application." }
references:
  - title: Operator pattern
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
