id: kcna-1e-small-base-cves
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An image scanner reports many vulnerabilities in operating system packages of an image. The application never uses these packages. Which change reduces these findings?
body:
  options:
    - id: a
      text: { en: "Set `imagePullPolicy: Always` on the containers" }
    - id: b
      text: { en: "Use a minimal base image in the final build stage" }
    - id: c
      text: { en: "Use the `latest` tag for the base image" }
    - id: d
      text: { en: "Add more `RUN` instructions to the final stage" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Every package in an image is a potential vulnerability, even if the application never calls it. A minimal base image, such as distroless or Alpine, in the final stage removes the packages the application doesn't need, so scanners report fewer findings. A multi-stage build keeps build tools out of that stage.
  options:
    a:
      en: |
        `imagePullPolicy` controls when the kubelet pulls the image. The same image, with the same packages, is pulled.
    c:
      en: |
        `latest` is a mutable tag that can point to a different image tomorrow. It doesn't make the base image smaller and makes builds less reproducible.
    d:
      en: |
        Each `RUN` instruction adds a layer. More instructions never remove packages that an earlier layer installed.
references:
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
  - title: "GitHub - GoogleContainerTools/distroless: Language focused docker images, minus the operating system."
    url: https://github.com/GoogleContainerTools/distroless
