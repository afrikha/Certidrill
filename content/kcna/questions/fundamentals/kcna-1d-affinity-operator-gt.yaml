id: kcna-1d-affinity-operator-gt
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Nodes carry an integer label `cpu-generation`. A Pod must run only on nodes where this label is greater than `3`. Which node affinity operator should the `matchExpressions` entry use?
body:
  options:
    - id: a
      text: { en: "`In`" }
    - id: b
      text: { en: "`Exists`" }
    - id: c
      text: { en: "`NotIn`" }
    - id: d
      text: { en: "`Gt`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Node affinity supports `In`, `NotIn`, `Exists`, `DoesNotExist`, `Gt` and `Lt`. `Gt` matches nodes whose label value, parsed as an integer, is greater than the given value. `Gt` and `Lt` exist only for node affinity, not for Pod affinity.
  options:
    a:
      en: |
        `In` matches a list of exact values; it cannot express a numeric comparison.
    b:
      en: |
        `Exists` only checks that the label key is present, whatever its value.
    c:
      en: |
        `NotIn` excludes a list of exact values; it does not compare numbers.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
