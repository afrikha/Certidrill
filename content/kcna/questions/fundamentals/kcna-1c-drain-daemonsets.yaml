id: kcna-1c-drain-daemonsets
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    `kubectl drain node-3` refuses to proceed because the node runs Pods managed by DaemonSets, such as a log collector. Which flag lets the drain continue?
body:
  options:
    - id: a
      text: { en: "`--force`" }
    - id: b
      text: { en: "`--ignore-daemonsets`" }
    - id: c
      text: { en: "`--delete-emptydir-data`" }
    - id: d
      text: { en: "`--disable-eviction`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With DaemonSet Pods on the node, drain does not proceed without `--ignore-daemonsets`. Those Pods are never deleted by drain, because the DaemonSet controller would immediately replace them; they keep providing node-local services during maintenance.
  options:
    a:
      en: |
        `--force` lets drain continue when Pods are not managed by a controller, not when DaemonSet Pods are present.
    c:
      en: |
        `--delete-emptydir-data` allows the eviction of Pods that use emptyDir volumes, whose local data is lost.
    d:
      en: |
        `--disable-eviction` makes drain delete Pods instead of evicting them, which bypasses PodDisruptionBudgets.
references:
  - title: kubectl drain
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_drain/
  - title: Safely Drain a Node
    url: https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
