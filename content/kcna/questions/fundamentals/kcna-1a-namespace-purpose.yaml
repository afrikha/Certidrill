id: kcna-1a-namespace-purpose
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the main purpose of namespaces in a Kubernetes cluster?
body:
  options:
    - id: a
      text: { en: "To group the nodes of the cluster into separate physical clusters" }
    - id: b
      text: { en: "To encrypt the network traffic between the Pods of different teams" }
    - id: c
      text: { en: "To make every object name unique across the whole cluster" }
    - id: d
      text: { en: "To isolate groups of resources within one cluster, such as per team" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Namespaces provide a mechanism for isolating groups of resources within a single cluster. Resource names must be unique within a namespace but not across namespaces, and namespaces are a way to divide cluster resources between users, for example with resource quotas.
  options:
    a:
      en: |
        Nodes are cluster-scoped; namespaces don't split hardware.
    b:
      en: |
        Namespaces encrypt nothing; they only group and scope objects.
    c:
      en: |
        Names must be unique only within a namespace; two namespaces can use the same name.
references:
  - title: "Namespaces"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
