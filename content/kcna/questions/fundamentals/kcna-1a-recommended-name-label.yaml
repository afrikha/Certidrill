id: kcna-1a-recommended-name-label
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which recommended label key holds the name of the application, such as `mysql`?
body:
  options:
    - id: a
      text: { en: "`app.kubernetes.io/instance`" }
    - id: b
      text: { en: "`app.kubernetes.io/managed-by`" }
    - id: c
      text: { en: "`app.kubernetes.io/name`" }
    - id: d
      text: { en: "`kubernetes.io/metadata.name`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The recommended labels share the `app.kubernetes.io` prefix: `name`, `instance`, `version`, `component`, `part-of` and `managed-by`. They are recommended, not required, and make it easier for tools to manage applications consistently.
  options:
    a:
      en: |
        This key identifies one instance of the application, such as `mysql-abcxyz`.
    b:
      en: |
        This key names the tool that manages the application, such as Helm.
    d:
      en: |
        The control plane sets this label on every Namespace, with the namespace's name.
references:
  - title: "Recommended Labels"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/common-labels/
