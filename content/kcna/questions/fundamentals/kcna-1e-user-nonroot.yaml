id: kcna-1e-user-nonroot
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Dockerfile instruction makes the container's main process run as a non-root user?
body:
  options:
    - id: a
      text: { en: "`WORKDIR`" }
    - id: b
      text: { en: "`ENV`" }
    - id: c
      text: { en: "`USER`" }
    - id: d
      text: { en: "`LABEL`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `USER` sets the user, and optionally the group, that runs the following instructions and the container's main process. Running services without root privileges limits the damage if the application is compromised.
  options:
    a:
      en: |
        `WORKDIR` sets the working directory for the following instructions and the container. It doesn't change the user.
    b:
      en: |
        `ENV` sets environment variables. Setting a variable such as a user name doesn't change the identity of the process.
    d:
      en: |
        `LABEL` adds metadata to the image, such as a version or license. It has no effect on the running process.
references:
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
