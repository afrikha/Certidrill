id: kcna-1c-describe-quota
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which command shows, for each resource tracked by the quotas of the `team-a` namespace, the amount used and the hard limit?
body:
  options:
    - id: a
      text: { en: "`kubectl describe resourcequota -n team-a`" }
    - id: b
      text: { en: "`kubectl describe limitrange -n team-a`" }
    - id: c
      text: { en: "`kubectl top pods -n team-a`" }
    - id: d
      text: { en: "`kubectl get events -n team-a`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl describe resourcequota` (short name `quota`) lists each tracked resource with its `Used` and `Hard` values, for example `requests.cpu` or `pods`.
  options:
    b:
      en: |
        This shows the per-container defaults and bounds of LimitRanges, not quota usage.
    c:
      en: |
        `kubectl top` shows actual CPU and memory usage of Pods; quotas count requests, limits and objects.
    d:
      en: |
        Events can show a rejected request, but not the usage and limits of the quota.
references:
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
