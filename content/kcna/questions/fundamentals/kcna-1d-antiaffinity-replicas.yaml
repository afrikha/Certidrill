id: kcna-1d-antiaffinity-replicas
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want the replicas of a Deployment named `db` never to run on the same node as each other. What should you add to the Pod template?
body:
  options:
    - id: a
      text: { en: "Node affinity on the `db` labels with the `NotIn` operator" }
    - id: b
      text: { en: "Pod anti-affinity on the `db` labels with `topologyKey: kubernetes.io/hostname`" }
    - id: c
      text: { en: "A `NoSchedule` taint on every node that already runs a `db` replica" }
    - id: d
      text: { en: "Pod affinity on the `db` labels with `topologyKey: kubernetes.io/hostname`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Inter-Pod anti-affinity keeps a Pod away from topology domains that already run Pods with matching labels. With `topologyKey: kubernetes.io/hostname`, the domain is a single node, so no two `db` replicas share a node.
  options:
    a:
      en: |
        Node affinity matches labels of nodes, not labels of the Pods already running on them, so it cannot keep replicas apart.
    c:
      en: |
        Taints are set on nodes by an administrator; they are not a Pod template setting and do not track where replicas run.
    d:
      en: |
        Pod affinity attracts Pods to nodes that already run matching Pods: it would pack the replicas together instead of separating them.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
