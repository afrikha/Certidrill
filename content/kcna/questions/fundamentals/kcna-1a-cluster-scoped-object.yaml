id: kcna-1a-cluster-scoped-object
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which of these objects is cluster-scoped, that is, not in any namespace?
body:
  options:
    - id: a
      text: { en: "Pod" }
    - id: b
      text: { en: "Service" }
    - id: c
      text: { en: "Node" }
    - id: d
      text: { en: "ConfigMap" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Most objects, such as Pods, Services and ConfigMaps, are namespaced. Low-level resources such as Nodes and PersistentVolumes, and Namespace objects themselves, are not in any namespace. `kubectl api-resources --namespaced=false` lists the cluster-scoped kinds.
  options:
    a:
      en: |
        Pods are namespaced objects.
    b:
      en: |
        Services are namespaced: their DNS name includes the namespace.
    d:
      en: |
        ConfigMaps are namespaced and can only be used by Pods of the same namespace.
references:
  - title: "Namespaces"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
