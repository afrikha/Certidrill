id: kcna-1a-runtime-runs-containers
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which node component is the software that actually runs the containers, for example containerd or CRI-O?
body:
  options:
    - id: a
      text: { en: "The container runtime" }
    - id: b
      text: { en: "The kubelet" }
    - id: c
      text: { en: "kube-proxy" }
    - id: d
      text: { en: "kube-apiserver" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The container runtime is the software responsible for running containers. Kubernetes supports containerd, CRI-O and any other implementation of the Container Runtime Interface (CRI), the gRPC protocol that the kubelet uses to talk to it.
  options:
    b:
      en: |
        The kubelet decides which containers must run and asks the runtime to start them; it does not run containers itself.
    c:
      en: |
        kube-proxy programs Service network rules; it never starts containers.
    d:
      en: |
        kube-apiserver is a control plane component that serves the API; it never runs containers.
references:
  - title: "Kubernetes Components"
    url: https://kubernetes.io/docs/concepts/overview/components/
  - title: "Container Runtime Interface (CRI)"
    url: https://kubernetes.io/docs/concepts/architecture/cri/
