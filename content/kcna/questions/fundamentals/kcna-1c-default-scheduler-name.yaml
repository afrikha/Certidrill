id: kcna-1c-default-scheduler-name
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod manifest does not set `spec.schedulerName`. Which value does the API server write into this field when the Pod is created?
body:
  options:
    - id: a
      text: { en: "`default-scheduler`" }
    - id: b
      text: { en: "`kube-scheduler`" }
    - id: c
      text: { en: "`system-cluster-critical`" }
    - id: d
      text: { en: "`kube-system`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      If a Pod does not specify a scheduler name, kube-apiserver sets `spec.schedulerName` to `default-scheduler`, the name of kube-scheduler's default profile. A Pod can name another profile or scheduler to be placed by it instead.
  options:
    b:
      en: |
        `kube-scheduler` is the name of the control plane component, not the scheduler name written in Pods.
    c:
      en: |
        `system-cluster-critical` is a built-in PriorityClass, not a scheduler name.
    d:
      en: |
        `kube-system` is the namespace of the system components, not a scheduler name.
references:
  - title: Scheduler Configuration
    url: https://kubernetes.io/docs/reference/scheduling/config/
  - title: Configure Multiple Schedulers
    url: https://kubernetes.io/docs/tasks/extend-kubernetes/configure-multiple-schedulers/
