id: kcna-1d-pid-namespace
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Inside a container, the application sees itself as process 1 and cannot see the processes of the host. Which type of Linux namespace provides this?
body:
  options:
    - id: a
      text: { en: "Network namespace" }
    - id: b
      text: { en: "Mount namespace" }
    - id: c
      text: { en: "PID namespace" }
    - id: d
      text: { en: "User namespace" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A PID namespace gives a container its own process tree with its own numbering, so its main process can be PID 1 and host processes are invisible. Kubernetes can make the containers of a Pod share one PID namespace with `shareProcessNamespace: true`.
  options:
    a:
      en: |
        A network namespace isolates network interfaces, IP addresses and ports, not process IDs.
    b:
      en: |
        A mount namespace isolates the file system mounts a process sees, not the process list.
    d:
      en: |
        A user namespace maps user and group IDs between the container and the host; it does not hide processes.
references:
  - title: "Share Process Namespace between Containers in a Pod"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/
