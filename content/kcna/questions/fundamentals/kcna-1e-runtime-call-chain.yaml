id: kcna-1e-runtime-call-chain
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On a node that uses containerd, which sequence describes how a Pod's container gets started?
body:
  options:
    - id: a
      text: { en: "kubelet → CRI → containerd → runc" }
    - id: b
      text: { en: "kubelet → runc → containerd → CRI" }
    - id: c
      text: { en: "kube-apiserver → containerd → kubelet → runc" }
    - id: d
      text: { en: "kubelet → CNI → containerd → runc" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The kubelet calls the high-level runtime, containerd, through the CRI gRPC API. containerd pulls the image and prepares the container, then calls a low-level OCI runtime, runc by default, which creates the process with namespaces and cgroups.
  options:
    b:
      en: |
        runc is the last step: it is called by containerd and never calls a higher-level runtime.
    c:
      en: |
        The API server never talks to the runtime. The kubelet watches the API server for Pods assigned to its node and calls the runtime itself.
    d:
      en: |
        CNI plugins configure Pod networking. The kubelet reaches containerd through the CRI, not through the CNI.
references:
  - title: "Container Runtime Interface (CRI)"
    url: https://kubernetes.io/docs/concepts/architecture/cri/
  - title: "Container Runtimes"
    url: https://kubernetes.io/docs/setup/production-environment/container-runtimes/
