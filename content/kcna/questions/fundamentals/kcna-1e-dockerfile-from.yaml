id: kcna-1e-dockerfile-from
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Dockerfile instruction sets the base image that a build stage starts from?
body:
  options:
    - id: a
      text: { en: "`RUN`" }
    - id: b
      text: { en: "`FROM`" }
    - id: c
      text: { en: "`COPY`" }
    - id: d
      text: { en: "`ENTRYPOINT`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `FROM` starts a build stage and names the image it builds on, such as a language image or a minimal base. Every following instruction adds to that base. A Dockerfile with several `FROM` lines has several stages.
  options:
    a:
      en: |
        `RUN` executes a command at build time, such as installing a package, and records the result as a new layer. It does not choose the base image.
    c:
      en: |
        `COPY` copies files from the build context, or from another stage with `--from`, into the image. It does not choose the base image.
    d:
      en: |
        `ENTRYPOINT` sets the executable that runs when a container starts from the image. It has no effect on the base image.
references:
  - title: "docs/content/manuals/build/building/multi-stage.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/multi-stage.md
