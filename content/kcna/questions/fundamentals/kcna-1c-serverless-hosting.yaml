id: kcna-1c-serverless-hosting
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A startup wants to run its containers without managing a cluster at all: no control plane and no node pools to configure. It wants to pay for the CPU and memory that its workloads request. Which hosting model matches?
body:
  options:
    - id: a
      text: { en: "A serverless offering that runs the workloads for it" }
    - id: b
      text: { en: "A managed control plane with self-managed worker nodes" }
    - id: c
      text: { en: "Managed worker nodes in node pools that it configures" }
    - id: d
      text: { en: "A self-managed cluster bootstrapped with kubeadm" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With a serverless offering you just run workloads on third-party equipment without managing a cluster, and you are charged for things like the CPU, memory and disk you request. Nothing about the control plane or the nodes is left to you.
  options:
    b:
      en: |
        A managed control plane removes the control plane work, but the startup would still run its own worker nodes.
    c:
      en: |
        With managed worker nodes the provider keeps the nodes available, but the startup still has to configure the node pools.
    d:
      en: |
        With kubeadm the startup would operate both the control plane and the nodes itself.
references:
  - title: Production environment
    url: https://kubernetes.io/docs/setup/production-environment/
