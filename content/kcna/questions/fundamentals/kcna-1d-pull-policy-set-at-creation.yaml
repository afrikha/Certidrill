id: kcna-1d-pull-policy-set-at-creation
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Deployment was created with `image: shop/web:1.4.2` and no `imagePullPolicy`. Later, its image is changed to `shop/web:latest`. Which pull policy do the containers of the new Pods use?
body:
  options:
    - id: a
      text: { en: "`IfNotPresent`" }
    - id: b
      text: { en: "`Always`" }
    - id: c
      text: { en: "`Never`" }
    - id: d
      text: { en: "No policy: the field stays empty until set explicitly" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The default `imagePullPolicy` is set when the object is first created and is not updated if the image's tag later changes. The Deployment was created with the tag `1.4.2`, so the template got `IfNotPresent`, and it keeps it after the switch to `latest`.
  options:
    b:
      en: |
        `Always` would be the default for a new object created with `:latest`, but the policy was already set when the Deployment was created.
    c:
      en: |
        `Never` is never set by default.
    d:
      en: |
        The field was filled with a default at creation and is stored in the Pod template.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
