id: kcna-1a-named-group-rest-path
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Which REST path returns the Deployments of the `shop` namespace?
body:
  options:
    - id: a
      text: { en: "`/api/v1/namespaces/shop/deployments`" }
    - id: b
      text: { en: "`/apis/v1/apps/namespaces/shop/deployments`" }
    - id: c
      text: { en: "`/api/apps/v1/shop/deployments`" }
    - id: d
      text: { en: "`/apis/apps/v1/namespaces/shop/deployments`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Named API groups are served at `/apis/GROUP/VERSION`, and namespaced resources add `namespaces/NAMESPACE/RESOURCETYPE`. Core resources use `/api/v1` and omit the group, for example `/api/v1/namespaces/shop/pods`.
  options:
    a:
      en: |
        `/api/v1` serves only the core group, which doesn't contain Deployments.
    b:
      en: |
        The group comes before the version: `/apis/GROUP/VERSION`.
    c:
      en: |
        Named groups are served under `/apis`, and namespaced resources need the `namespaces/NAMESPACE` segment.
references:
  - title: "Kubernetes API Concepts"
    url: https://kubernetes.io/docs/reference/using-api/api-concepts/
  - title: "API Overview"
    url: https://kubernetes.io/docs/reference/using-api/
