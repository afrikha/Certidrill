id: kcna-1d-dedicated-nodes
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    GPU nodes have the taint `gpu=true:NoSchedule` and the label `gpu=true`. The ML team's Pods tolerate the taint, yet some of them run on ordinary nodes. The team's Pods must run only on GPU nodes. What should you add to their Pod template?
body:
  options:
    - id: a
      text: { en: "A second toleration for `gpu=true:NoExecute`" }
    - id: b
      text: { en: "`tolerationSeconds: 0` in the existing toleration" }
    - id: c
      text: { en: "Pod anti-affinity on the ML team's own labels" }
    - id: d
      text: { en: "A `nodeSelector` or node affinity on the label `gpu=true`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A toleration allows a Pod on a tainted node but does not attract it there. To dedicate nodes, combine the taint (which keeps other Pods out) with a `nodeSelector` or node affinity on a node label (which brings the team's Pods in).
  options:
    a:
      en: |
        Another toleration only widens where the Pods are allowed; it never forces them onto the GPU nodes.
    b:
      en: |
        `tolerationSeconds` applies only to `NoExecute` taints and controls how long a Pod stays after the taint appears.
    c:
      en: |
        Anti-affinity spreads the team's Pods apart; it does not restrict them to GPU nodes.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
