id: kcna-1d-namespaces-isolate
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Linux kernel feature gives a container its own view of processes, network interfaces and mounted file systems?
body:
  options:
    - id: a
      text: { en: "Control groups (cgroups)" }
    - id: b
      text: { en: "A hypervisor" }
    - id: c
      text: { en: "AppArmor" }
    - id: d
      text: { en: "Namespaces" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Linux namespaces isolate what a process can see: a PID namespace gives it its own process tree, a network namespace its own network stack, and a mount namespace its own file system view. A container is a process placed in such namespaces.
  options:
    a:
      en: |
        cgroups limit how much CPU, memory and I/O a process uses; they do not change what it can see.
    b:
      en: |
        A hypervisor virtualizes hardware for virtual machines; containers do not use one.
    c:
      en: |
        AppArmor confines a program to a set of resources by profile; it does not give it a separate view of the system.
references:
  - title: "Share Process Namespace between Containers in a Pod"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/
  - title: "User Namespaces"
    url: https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/
