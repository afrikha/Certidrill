id: kcna-1b-imperative-commands
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer creates an application with the following command, without writing any file.

    ```bash
    kubectl create deployment web --image=nginx:1.27 --replicas=3
    ```

    Which object management technique is this?
body:
  options:
    - id: a
      text: { en: "Imperative commands" }
    - id: b
      text: { en: "Imperative object configuration" }
    - id: c
      text: { en: "Declarative object configuration" }
    - id: d
      text: { en: "GitOps reconciliation" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With imperative commands, you operate directly on live objects through arguments and flags. They are simple and fit development and one-off tasks, but they leave no file to review, no audit trail and no template for the next object.
  options:
    b: { en: "Imperative object configuration names an operation and a file, such as `kubectl create -f web.yaml` or `kubectl replace -f web.yaml`." }
    c: { en: "Declarative object configuration uses `kubectl apply` on files or directories and lets kubectl work out the changes." }
    d: { en: "GitOps means an agent pulls manifests from Git and reconciles the cluster; no Git repository or agent is involved here." }
references:
  - title: Kubernetes Object Management
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/object-management/
