id: kcna-1e-build-target-stage
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Dockerfile has three stages.

    ```text
    FROM golang:1.25 AS build
    ...
    FROM build AS test
    ...
    FROM gcr.io/distroless/static AS release
    ...
    ```

    A CI job must build an image of the `test` stage only. Which `docker build` option should it use?
body:
  options:
    - id: a
      text: { en: "`--file test`" }
    - id: b
      text: { en: "`--target test`" }
    - id: c
      text: { en: "`--tag test`" }
    - id: d
      text: { en: "`--pull`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `--target` stops the build at the named stage, so the image is the `test` stage. With BuildKit, only the stages that `test` depends on, here `build`, are built. Without `--target`, the image is the last stage, `release`.
  options:
    a:
      en: |
        `--file` names the Dockerfile to read, not a stage in it. A file named `test` would be read instead of this Dockerfile.
    c:
      en: |
        `--tag` only names the resulting image. The image would still be built from the last stage, `release`.
    d:
      en: |
        `--pull` makes the builder fetch newer versions of the base images. It doesn't choose the stage that is built.
references:
  - title: "docs/content/manuals/build/building/multi-stage.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/multi-stage.md
