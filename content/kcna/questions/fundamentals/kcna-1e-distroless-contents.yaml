id: kcna-1e-distroless-contents
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team switches the final stage of its Dockerfile to a distroless base image. What does a distroless image leave out?
body:
  options:
    - id: a
      text: { en: "The application's run-time dependencies, such as language runtimes" }
    - id: b
      text: { en: "The image layers, so the image is stored as a single file" }
    - id: c
      text: { en: "The image configuration, such as the entrypoint and environment" }
    - id: d
      text: { en: "The shell, the package manager and other operating system programs" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Distroless images contain only the application and its run-time dependencies. They have no package manager, no shell and none of the other programs of a standard Linux distribution. Fewer packages mean a smaller image and fewer findings for vulnerability scanners.
  options:
    a:
      en: |
        Distroless images keep the run-time dependencies the application needs: that is their purpose. They remove the rest of the distribution.
    b:
      en: |
        A distroless image is still an ordinary image made of layers. Leaving out programs changes what the layers contain, not the image format.
    c:
      en: |
        Every image, distroless or not, has a configuration with the entrypoint, environment and user. Only operating system programs are removed.
references:
  - title: "GitHub - GoogleContainerTools/distroless: Language focused docker images, minus the operating system."
    url: https://github.com/GoogleContainerTools/distroless
