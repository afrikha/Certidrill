id: kcna-1c-kubectl-skew
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster's kube-apiserver runs v1.37. An engineer's workstation has kubectl v1.35. What is true?
body:
  options:
    - id: a
      text: { en: "Supported: kubectl may be three minor versions older" }
    - id: b
      text: { en: "Supported: kubectl only needs the same major version" }
    - id: c
      text: { en: "Not supported: kubectl must match the exact patch version" }
    - id: d
      text: { en: "Not supported: kubectl must be within one minor version" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      kubectl is supported within one minor version of kube-apiserver, older or newer. With an API server at 1.37, kubectl 1.36, 1.37 and 1.38 are supported, so 1.35 should be upgraded.
  options:
    a:
      en: |
        The three-version skew applies to the kubelet and kube-proxy, not to kubectl.
    b:
      en: |
        Matching the major version is not enough; the policy limits the minor version gap.
    c:
      en: |
        The policy is about minor versions; kubectl does not have to match the patch number.
references:
  - title: Version Skew Policy
    url: https://kubernetes.io/releases/version-skew-policy/
