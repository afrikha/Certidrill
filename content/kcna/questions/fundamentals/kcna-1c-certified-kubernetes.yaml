id: kcna-1c-certified-kubernetes
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A vendor advertises its Kubernetes distribution as "Certified Kubernetes". What does this certification tell you?
body:
  options:
    - id: a
      text: { en: "It is hardened against the CIS Kubernetes Benchmark" }
    - id: b
      text: { en: "It is a CNCF Graduated project" }
    - id: c
      text: { en: "The vendor guarantees a control plane uptime SLA" }
    - id: d
      text: { en: "It passed the CNCF conformance tests for the required APIs" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The CNCF Certified Kubernetes Conformance Program checks that a distribution supports the required Kubernetes APIs, using the open source Sonobuoy test tool. Conformance gives interoperability: workloads and tools behave consistently from one certified installation to another.
  options:
    a:
      en: |
        Conformance is about API compatibility, not security hardening. CIS Benchmark compliance is a separate assessment.
    b:
      en: |
        Graduated is a maturity level of CNCF projects, not a certification of commercial distributions.
    c:
      en: |
        An uptime SLA is a commercial promise of a provider; the conformance program does not test availability.
references:
  - title: Certified Kubernetes Software Conformance
    url: https://www.cncf.io/training/certification/software-conformance/
