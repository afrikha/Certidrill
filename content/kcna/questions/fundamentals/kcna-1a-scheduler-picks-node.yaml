id: kcna-1a-scheduler-picks-node
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which component watches for newly created Pods that have no node assigned and selects a node for each of them to run on?
body:
  options:
    - id: a
      text: { en: "kube-scheduler" }
    - id: b
      text: { en: "kubelet" }
    - id: c
      text: { en: "kube-controller-manager" }
    - id: d
      text: { en: "kube-apiserver" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      kube-scheduler watches for Pods with no assigned node, filters out the nodes that cannot run each Pod, scores the remaining feasible nodes and picks one. It then notifies the API server of its decision (binding); the kubelet of the chosen node starts the containers.
  options:
    b:
      en: |
        The kubelet runs the Pods that are already assigned to its own node; it does not choose nodes.
    c:
      en: |
        The controllers in kube-controller-manager create Pods, for example for a ReplicaSet, but they do not place Pods on nodes.
    d:
      en: |
        kube-apiserver stores the scheduling decision (the binding) but does not make it.
references:
  - title: "Kubernetes Components"
    url: https://kubernetes.io/docs/concepts/overview/components/
  - title: "Kubernetes Scheduler"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
