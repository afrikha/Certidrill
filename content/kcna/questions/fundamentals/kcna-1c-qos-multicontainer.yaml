id: kcna-1c-qos-multicontainer
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Which QoS class does this Pod get?

    ```yaml
    spec:
      containers:
      - name: app
        image: registry.example.com/app:2.1
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: 500m, memory: 512Mi}
      - name: log-shipper
        image: registry.example.com/shipper:1.0
    ```
body:
  options:
    - id: a
      text: { en: "Guaranteed" }
    - id: b
      text: { en: "Burstable" }
    - id: c
      text: { en: "BestEffort" }
    - id: d
      text: { en: "Guaranteed for `app`, BestEffort for `log-shipper`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The QoS class belongs to the whole Pod. Guaranteed requires equal requests and limits in every container, and `log-shipper` sets none, so the Pod is not Guaranteed. Because at least one container sets requests or limits, the Pod is Burstable.
  options:
    a:
      en: |
        The `app` container alone would qualify, but every container must meet the condition.
    c:
      en: |
        BestEffort requires that no container sets any CPU or memory request or limit; `app` sets them.
    d:
      en: |
        Kubernetes assigns one QoS class per Pod, not one per container.
references:
  - title: Pod Quality of Service Classes
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/
  - title: Configure Quality of Service for Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/quality-service-pod/
