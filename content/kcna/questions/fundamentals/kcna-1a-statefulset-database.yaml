id: kcna-1a-statefulset-database
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A clustered database needs Pods with stable names (`db-0`, `db-1`, `db-2`) and a persistent volume that stays with each Pod. Which workload resource fits?
body:
  options:
    - id: a
      text: { en: "StatefulSet" }
    - id: b
      text: { en: "Deployment" }
    - id: c
      text: { en: "ReplicaSet" }
    - id: d
      text: { en: "DaemonSet" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A StatefulSet maintains a sticky identity for each Pod: ordinal names such as `db-0`, stable network identities through a headless Service, and one PersistentVolumeClaim per Pod from its volume claim templates. Pods are also created and scaled in order.
  options:
    b:
      en: |
        Deployment Pods get random names, are interchangeable and have no per-Pod storage identity.
    c:
      en: |
        A ReplicaSet keeps a number of identical Pods running, with no stable names or per-Pod volumes.
    d:
      en: |
        A DaemonSet ties Pods to nodes, not to stable identities.
references:
  - title: "StatefulSets"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
