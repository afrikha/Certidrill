id: kcna-1a-kube-proxy-watches
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    kube-proxy on each node watches the control plane for changes to which objects, so that it can keep its rules up to date?
body:
  options:
    - id: a
      text: { en: "Pods and Nodes" }
    - id: b
      text: { en: "Services and EndpointSlices" }
    - id: c
      text: { en: "Ingresses and NetworkPolicies" }
    - id: d
      text: { en: "Deployments and ReplicaSets" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each kube-proxy instance watches the control plane for the addition and removal of Service and EndpointSlice objects. For each Service, it configures the node to capture traffic to the Service's cluster IP and port and redirect it to one of the endpoints, and a control loop keeps these rules in sync.
  options:
    a:
      en: |
        kube-proxy learns the backend addresses of a Service from its EndpointSlices, not by watching every Pod.
    c:
      en: |
        Ingresses are handled by an Ingress controller and NetworkPolicies by the network plugin, not by kube-proxy.
    d:
      en: |
        Workload resources are reconciled by controllers in kube-controller-manager; kube-proxy only deals with Service traffic.
references:
  - title: "Virtual IPs and Service Proxies"
    url: https://kubernetes.io/docs/reference/networking/virtual-ips/
