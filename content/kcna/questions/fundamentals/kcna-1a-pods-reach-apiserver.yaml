id: kcna-1a-pods-reach-apiserver
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application Pod needs to call the Kubernetes API. By default, how does it reach the API server?
body:
  options:
    - id: a
      text: { en: "By connecting directly to etcd on a control plane node, which then forwards the request" }
    - id: b
      text: { en: "Through the kubelet of its own node, which relays every API call to the control plane" }
    - id: c
      text: { en: "Through the `kubernetes` Service in the `default` namespace, which leads to the API server's HTTPS endpoint" }
    - id: d
      text: { en: "Through kube-scheduler, which exposes the API inside the cluster on behalf of the control plane" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes uses a hub-and-spoke model: all API usage from nodes and Pods terminates at the API server, which listens on a secure HTTPS port (typically 443). Pods reach it through the `kubernetes` Service in the `default` namespace, whose virtual IP is redirected to the API server's HTTPS endpoint.
  options:
    a:
      en: |
        Pods never talk to etcd; all API usage from nodes and Pods terminates at the API server.
    b:
      en: |
        The kubelet does not proxy API calls for Pods; Pods connect to the API server themselves.
    d:
      en: |
        kube-scheduler exposes no remote service; only the API server does.
references:
  - title: "Communication between Nodes and the Control Plane"
    url: https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/
