id: kcna-1d-pull-latest-default
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Deployment is created with `image: registry.example.com/shop/web:latest` and no `imagePullPolicy`. Which pull policy does the container get?
body:
  options:
    - id: a
      text: { en: "`Always`" }
    - id: b
      text: { en: "`IfNotPresent`" }
    - id: c
      text: { en: "`Never`" }
    - id: d
      text: { en: "No policy: the kubelet decides at each start" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When `imagePullPolicy` is omitted, Kubernetes sets it to `Always` if the image tag is `latest` or if no tag is given. For any other tag or for a digest, it sets `IfNotPresent`.
  options:
    b:
      en: |
        `IfNotPresent` is the default for any tag other than `latest`, or for a digest.
    c:
      en: |
        `Never` is never a default; it must be set explicitly.
    d:
      en: |
        The policy is set on the container when the object is created, and the `latest` tag makes it `Always`.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
