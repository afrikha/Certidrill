id: kcna-1b-list-crds
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You join a team and want to see which CustomResourceDefinitions are installed in the cluster.

    Which command lists them?
body:
  options:
    - id: a
      text: { en: "`kubectl api-versions`" }
    - id: b
      text: { en: "`kubectl get apiservices`" }
    - id: c
      text: { en: "`kubectl get crd`" }
    - id: d
      text: { en: "`kubectl get configmaps -A`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CustomResourceDefinition is a cluster-scoped resource with the short names `crd` and `crds`, so `kubectl get crd` lists every CRD installed in the cluster.
  options:
    a: { en: "`kubectl api-versions` prints the group/version pairs the server supports, not the list of CRDs." }
    b: { en: "`kubectl get apiservices` lists the API group versions registered with the aggregation layer, not the CustomResourceDefinition objects." }
    d: { en: "ConfigMaps hold configuration data; CRDs are not stored as ConfigMaps." }
references:
  - title: Command line tool (kubectl)
    url: https://kubernetes.io/docs/reference/kubectl/
