id: kcna-1b-env-not-updated
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A running container reads `LOG_LEVEL` from a ConfigMap through `env` and `configMapKeyRef`. You change the value of that key in the ConfigMap from `info` to `debug`.

    What value does the running container see?
body:
  options:
    - id: a
      text: { en: "`debug`, after the kubelet's next sync of the ConfigMap" }
    - id: b
      text: { en: "`info`, until the container is restarted or recreated" }
    - id: c
      text: { en: "No value; the variable is removed while the ConfigMap changes" }
    - id: d
      text: { en: "`debug`, because Kubernetes restarts the Pod automatically" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Environment variables are set when the container starts. ConfigMaps consumed as environment variables are not updated automatically: the container keeps `info` until it is restarted, for example by recreating the Pods.
  options:
    a: { en: "The periodic kubelet sync refreshes ConfigMaps mounted as volumes, not environment variables." }
    c: { en: "Changing the ConfigMap does not touch the environment of a running process; the old value stays." }
    d: { en: "Kubernetes does not restart Pods when a ConfigMap changes; you trigger a restart yourself." }
references:
  - title: ConfigMaps
    url: https://kubernetes.io/docs/concepts/configuration/configmap/
