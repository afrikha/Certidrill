id: kcna-1b-api-versions
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before writing manifests for a cluster, you want to check which API group versions it serves, printed in the form `group/version`, such as `apps/v1` or `batch/v1`.

    Which command do you use?
body:
  options:
    - id: a
      text: { en: "`kubectl api-versions`" }
    - id: b
      text: { en: "`kubectl version`" }
    - id: c
      text: { en: "`kubectl explain --api-version=apps/v1`" }
    - id: d
      text: { en: "`kubectl config view`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl api-versions` prints the API versions supported by the server in the form `group/version`. These are the values you can use in the `apiVersion` field of a manifest.
  options:
    b: { en: "`kubectl version` prints the versions of the kubectl client and of the Kubernetes server, not the API groups." }
    c: { en: "`--api-version` selects the version used to explain a resource type; `kubectl explain` needs a type and does not list group versions." }
    d: { en: "`kubectl config view` shows the kubeconfig settings: clusters, users and contexts." }
references:
  - title: kubectl api-versions
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_api-versions/
