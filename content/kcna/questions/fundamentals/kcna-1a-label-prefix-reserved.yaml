id: kcna-1a-label-prefix-reserved
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team writes a controller that adds an owner label to users' objects. Which label key follows the Kubernetes rules for labels added by automated components?
body:
  options:
    - id: a
      text: { en: "`owner-team`" }
    - id: b
      text: { en: "`kubernetes.io/owner-team`" }
    - id: c
      text: { en: "`k8s.io/owner-team`" }
    - id: d
      text: { en: "`platform.example.com/owner-team`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A label key has an optional prefix (a DNS subdomain followed by `/`) and a name of at most 63 characters. Automated components that add labels to users' objects must specify a prefix, and the `kubernetes.io/` and `k8s.io/` prefixes are reserved for Kubernetes core components.
  options:
    a:
      en: |
        A key without a prefix is private to the user; automated components must use a prefix.
    b:
      en: |
        The `kubernetes.io/` prefix is reserved for Kubernetes core components.
    c:
      en: |
        The `k8s.io/` prefix is reserved for Kubernetes core components.
references:
  - title: "Labels and Selectors"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
