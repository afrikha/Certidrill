id: kcna-1b-crd-name-format
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are completing the following CustomResourceDefinition.

    ```yaml
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: ???
    spec:
      group: example.com
      scope: Namespaced
      names:
        plural: backups
        singular: backup
        kind: Backup
    ```

    Which value must `metadata.name` have?
body:
  options:
    - id: a
      text: { en: "`Backup.example.com`" }
    - id: b
      text: { en: "`backups.example.com`" }
    - id: c
      text: { en: "`example.com/backups`" }
    - id: d
      text: { en: "`backup.v1.example.com`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The name of a CustomResourceDefinition must be `<plural>.<group>`, built from `spec.names.plural` and `spec.group`: here `backups.example.com`.
  options:
    a: { en: "The name uses the lowercase plural (`backups`), not the `kind` (`Backup`)." }
    c: { en: "`group/version`-style paths appear in `apiVersion` and API URLs; a CRD name is `<plural>.<group>` and contains no slash." }
    d: { en: "The CRD name contains neither the singular nor the version; it is `<plural>.<group>`." }
references:
  - title: Extend the Kubernetes API with CustomResourceDefinitions
    url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
