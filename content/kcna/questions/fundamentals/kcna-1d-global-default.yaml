id: kcna-1d-global-default
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator creates a PriorityClass with `globalDefault: true`. Which Pods receive its priority value?
body:
  options:
    - id: a
      text: { en: "All existing and future Pods without a `priorityClassName`" }
    - id: b
      text: { en: "All Pods of the namespace where the class was created" }
    - id: c
      text: { en: "Only Pods that set `priorityClassName: default`" }
    - id: d
      text: { en: "Pods created afterward without a `priorityClassName`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Only one PriorityClass can have `globalDefault: true`. Its value is used for Pods that do not set `priorityClassName`, and only for Pods created after the class is added; existing Pods keep their priority.
  options:
    a:
      en: |
        Adding a global default does not change the priority of Pods that already exist.
    b:
      en: |
        PriorityClass is not namespaced, and the default is not tied to a namespace.
    c:
      en: |
        No class name is needed: the global default applies precisely to Pods that do not set one.
references:
  - title: "Pod Priority and Preemption"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
