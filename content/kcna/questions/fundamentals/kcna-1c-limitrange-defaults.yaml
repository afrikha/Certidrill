id: kcna-1c-limitrange-defaults
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Developers in the `dev` namespace often forget to set resources. Every container that sets none must automatically get a default CPU request and limit. Which object should you create?
body:
  options:
    - id: a
      text: { en: "ResourceQuota" }
    - id: b
      text: { en: "HorizontalPodAutoscaler" }
    - id: c
      text: { en: "LimitRange" }
    - id: d
      text: { en: "PodDisruptionBudget" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A LimitRange sets default requests and limits (`defaultRequest` and `default`) that its admission controller injects into containers that do not set them. It can also enforce minimum and maximum values per container.
  options:
    a:
      en: |
        A ResourceQuota caps the namespace total; it does not inject default values into containers.
    b:
      en: |
        A HorizontalPodAutoscaler changes the number of replicas of a workload; it does not set container resources.
    d:
      en: |
        A PodDisruptionBudget protects application availability during voluntary disruptions such as drains.
references:
  - title: Limit Ranges
    url: https://kubernetes.io/docs/concepts/policy/limit-range/
