id: kcna-1a-labels-separate-versions
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team runs versions `v1` and `v2` of the same application side by side in one cluster and wants to tell their resources apart. What does the Kubernetes documentation recommend?
body:
  options:
    - id: a
      text: { en: "One namespace for each version of the application" }
    - id: b
      text: { en: "Labels, such as a `version` label, within the same namespace" }
    - id: c
      text: { en: "Annotations, which selectors then use to pick a version" }
    - id: d
      text: { en: "A different `kind` value for the objects of each version" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Namespaces are intended for environments with many users across teams or projects. To separate slightly different resources, such as versions of the same software, use labels to distinguish them within the same namespace; selectors can then target one version.
  options:
    a:
      en: |
        The documentation advises against namespaces just to separate versions of the same software.
    c:
      en: |
        Annotations can't be used in selectors; they don't identify objects.
    d:
      en: |
        `kind` is the object type, such as Deployment; you cannot choose it freely.
references:
  - title: "Namespaces"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
  - title: "Labels and Selectors"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
