id: kcna-1b-kubeconfig-merge
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On a Linux workstation, `~/.kube/dev.yaml` defines the context `dev` and `~/.kube/prod.yaml` defines the context `prod`. You run the following commands.

    ```bash
    export KUBECONFIG=~/.kube/dev.yaml:~/.kube/prod.yaml
    kubectl config get-contexts
    ```

    Which contexts are listed?
body:
  options:
    - id: a
      text: { en: "Only `dev`, from the first file of the list" }
    - id: b
      text: { en: "Only `prod`, from the last file of the list" }
    - id: c
      text: { en: "Both `dev` and `prod`" }
    - id: d
      text: { en: "None: `KUBECONFIG` must name a single file" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `KUBECONFIG` holds a list of files, colon-delimited on Linux and macOS and semicolon-delimited on Windows. kubectl merges them, so the contexts of both files are available.
  options:
    a: { en: "kubectl merges all the files of the list; the order only matters when two files set the same value." }
    b: { en: "The files are merged, so the contexts of the first file are not lost." }
    d: { en: "`KUBECONFIG` can list several files; only the `--kubeconfig` flag takes a single file." }
references:
  - title: Organizing Cluster Access Using kubeconfig Files
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
