id: kcna-1a-node-controller-unreachable
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A worker node becomes unreachable and stops sending heartbeats. With default settings, what does the node controller in kube-controller-manager do?
body:
  options:
    - id: a
      text: { en: "It marks the node's `Ready` condition `Unknown`, then evicts its Pods 5 minutes later" }
    - id: b
      text: { en: "It deletes the Node object at once and recreates its Pods on other nodes" }
    - id: c
      text: { en: "It connects to the node over SSH and restarts the kubelet service there" }
    - id: d
      text: { en: "It evicts all Pods of the node at once, then marks the node `NotReady`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The node controller checks the state of each node every 5 seconds by default. When a node becomes unreachable, it sets the node's `Ready` condition to `Unknown`; if the node stays unreachable, it submits the first API-initiated eviction requests 5 minutes later by default.
  options:
    b:
      en: |
        The Node object is kept; the controller first marks it `Unknown` and waits before any eviction.
    c:
      en: |
        The node controller only works through the API: it monitors node health and evicts Pods, it never logs on to nodes.
    d:
      en: |
        Eviction is not immediate: by default the controller waits 5 minutes after marking the node `Unknown`.
references:
  - title: "Nodes"
    url: https://kubernetes.io/docs/concepts/architecture/nodes/
