id: kcna-1c-drain-pdb-wait
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Deployment `api` has 3 replicas and a PodDisruptionBudget with `minAvailable: 2`. One replica is already down on another node. You run `kubectl drain node-1`, which hosts a healthy `api` Pod, and the command keeps retrying. Why?
body:
  options:
    - id: a
      text: { en: "node-1 must be cordoned before it can be drained" }
    - id: b
      text: { en: "The DaemonSet Pods on node-1 block every eviction" }
    - id: c
      text: { en: "Evicting the Pod would break the budget, so the eviction is refused" }
    - id: d
      text: { en: "The Deployment's `maxUnavailable` setting blocks evictions" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      drain uses the Eviction API, which respects PodDisruptionBudgets. Only 2 `api` Pods are available, and evicting one would leave fewer than `minAvailable: 2`, so the eviction is refused; drain retries until a replacement is available or a timeout is reached.
  options:
    a:
      en: |
        `kubectl drain` cordons the node itself before evicting Pods; no separate cordon is needed.
    b:
      en: |
        DaemonSet Pods make drain stop with an error unless `--ignore-daemonsets` is set; they do not cause endless retries of an eviction.
    d:
      en: |
        `maxUnavailable` of a Deployment controls rolling updates. Evictions are limited by PodDisruptionBudgets, not by the rollout strategy.
references:
  - title: Disruptions
    url: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
  - title: Safely Drain a Node
    url: https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
