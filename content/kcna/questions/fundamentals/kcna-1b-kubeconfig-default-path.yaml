id: kcna-1b-kubeconfig-default-path
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The `KUBECONFIG` environment variable is not set and you pass no `--kubeconfig` flag.

    Which file does `kubectl` read to find the cluster and credentials?
body:
  options:
    - id: a
      text: { en: "`$HOME/.kubeconfig`" }
    - id: b
      text: { en: "`$HOME/.kube/config`" }
    - id: c
      text: { en: "`/etc/kubernetes/kubeconfig.yaml`" }
    - id: d
      text: { en: "`/var/run/secrets/kubernetes.io/serviceaccount/token`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      By default, kubectl looks for a file named `config` in the `$HOME/.kube` directory. "kubeconfig file" is a generic name for such files; no file has to be named `kubeconfig`.
  options:
    a: { en: "kubectl does not look for a `.kubeconfig` file in the home directory; the default is `$HOME/.kube/config`." }
    c: { en: "kubectl does not read files under `/etc/kubernetes` by default; another file must be named with `KUBECONFIG` or `--kubeconfig`." }
    d: { en: "That path holds the ServiceAccount token used for in-cluster authentication when kubectl runs inside a Pod, not a kubeconfig file." }
references:
  - title: Organizing Cluster Access Using kubeconfig Files
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
