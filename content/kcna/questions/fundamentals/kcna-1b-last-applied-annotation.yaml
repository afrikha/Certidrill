id: kcna-1b-last-applied-annotation
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    `kubectl apply` records the content of the configuration file on each object it manages, so that it can later work out which fields were removed from the file.

    Which annotation holds this record?
body:
  options:
    - id: a
      text: { en: "`kubernetes.io/change-cause`" }
    - id: b
      text: { en: "`kubectl.kubernetes.io/last-applied-configuration`" }
    - id: c
      text: { en: "`deployment.kubernetes.io/revision`" }
    - id: d
      text: { en: "`kubectl.kubernetes.io/restartedAt`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubectl apply` stores the applied configuration in the `kubectl.kubernetes.io/last-applied-configuration` annotation. Imperative `create` and `replace` do not maintain it, which is why you should not mix them with `apply` on the same object.
  options:
    a: { en: "`kubernetes.io/change-cause` is a free-text note shown in `kubectl rollout history`; it does not store the applied file." }
    c: { en: "`deployment.kubernetes.io/revision` is the revision number the Deployment controller sets on its ReplicaSets." }
    d: { en: "`kubectl.kubernetes.io/restartedAt` is set on the Pod template by `kubectl rollout restart` to trigger a new rollout." }
references:
  - title: Declarative Management of Kubernetes Objects Using Configuration Files
    url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/
