id: kcna-1b-crd-apiversion
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You write the manifest of a CustomResourceDefinition.

    Which `apiVersion` does the CustomResourceDefinition itself use?
body:
  options:
    - id: a
      text: { en: "`apiextensions.k8s.io/v1`" }
    - id: b
      text: { en: "`apps/v1`" }
    - id: c
      text: { en: "`v1`" }
    - id: d
      text: { en: "`admissionregistration.k8s.io/v1`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CustomResourceDefinition belongs to the `apiextensions.k8s.io` API group, version `v1`. In that version a structural OpenAPI v3 schema is mandatory for each served version of the custom resource.
  options:
    b: { en: "`apps/v1` is the group of workload resources such as Deployment, StatefulSet and DaemonSet." }
    c: { en: "`v1` is the core group (Pod, Service, ConfigMap, Secret); it does not contain CustomResourceDefinition." }
    d: { en: "`admissionregistration.k8s.io/v1` holds admission webhook configurations, not CustomResourceDefinitions." }
references:
  - title: Extend the Kubernetes API with CustomResourceDefinitions
    url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
