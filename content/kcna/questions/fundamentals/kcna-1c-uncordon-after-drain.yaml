id: kcna-1c-uncordon-after-drain
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After maintenance, node-2 is back and `kubectl get nodes` shows it as `Ready,SchedulingDisabled`. New Pods never land on it. What should you do?
body:
  options:
    - id: a
      text: { en: "Restart the kubelet on node-2" }
    - id: b
      text: { en: "Run `kubectl drain node-2` again" }
    - id: c
      text: { en: "Delete the DaemonSet Pods on node-2" }
    - id: d
      text: { en: "Run `kubectl uncordon node-2`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The drain left the node cordoned (unschedulable). `kubectl uncordon` marks it schedulable again, so the scheduler can place new Pods on it.
  options:
    a:
      en: |
        The kubelet is healthy (the node is Ready); the node is only marked unschedulable, which a restart does not change.
    b:
      en: |
        Draining again would cordon the node and evict Pods: the opposite of what is needed.
    c:
      en: |
        DaemonSet Pods tolerate unschedulable nodes and are not what keeps other Pods away.
references:
  - title: Safely Drain a Node
    url: https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
  - title: Nodes
    url: https://kubernetes.io/docs/concepts/architecture/nodes/
