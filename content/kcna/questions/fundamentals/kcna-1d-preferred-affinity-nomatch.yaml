id: kcna-1d-preferred-affinity-nomatch
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod has the following node affinity, and no node in the cluster has the label `gpu=true`. What happens to the Pod?

    ```yaml
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
            - key: gpu
              operator: In
              values: ["true"]
    ```
body:
  options:
    - id: a
      text: { en: "It is scheduled on another feasible node" }
    - id: b
      text: { en: "It stays `Pending` until a node gets the label" }
    - id: c
      text: { en: "The API server rejects the Pod at creation" }
    - id: d
      text: { en: "It is scheduled, then evicted when a node gets the label" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With `preferredDuringSchedulingIgnoredDuringExecution`, the scheduler tries to find a matching node and adds the rule's weight to its score. If no node matches, it still schedules the Pod on another feasible node.
  options:
    b:
      en: |
        Only a required rule leaves the Pod `Pending`. A preferred rule only adds to the score of the nodes that match it.
    c:
      en: |
        The manifest is valid; whether a node matches is decided later by the scheduler, not by API validation.
    d:
      en: |
        Affinity is ignored during execution: a running Pod is never moved because labels change.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
