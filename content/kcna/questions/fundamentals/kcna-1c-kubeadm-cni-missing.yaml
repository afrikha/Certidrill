id: kcna-1c-kubeadm-cni-missing
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You bootstrap a cluster with `kubeadm init`. A few minutes later the CoreDNS Pods in `kube-system` are still not `Running`. What must you install next?
body:
  options:
    - id: a
      text: { en: "A Pod network add-on based on CNI" }
    - id: b
      text: { en: "An Ingress controller" }
    - id: c
      text: { en: "The metrics-server add-on" }
    - id: d
      text: { en: "A default StorageClass" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      kubeadm does not install a Pod network. You must deploy a Container Network Interface (CNI) based Pod network add-on so that Pods can communicate, and cluster DNS (CoreDNS) does not start until a network is installed.
  options:
    b:
      en: |
        An Ingress controller exposes HTTP routes from outside the cluster. CoreDNS does not depend on it.
    c:
      en: |
        metrics-server provides CPU and memory usage for `kubectl top` and autoscaling. It is optional and does not block CoreDNS.
    d:
      en: |
        A StorageClass is used for dynamic provisioning of volumes. CoreDNS needs no persistent storage.
references:
  - title: Creating a cluster with kubeadm
    url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/
