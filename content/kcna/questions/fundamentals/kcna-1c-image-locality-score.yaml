id: kcna-1c-image-locality-score
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several nodes pass filtering for a new Pod. Which property of a node can raise its score with the default scoring plugins?
body:
  options:
    - id: a
      text: { en: "It already has the container images that the Pod runs" }
    - id: b
      text: { en: "It runs the newest kubelet version of the cluster" }
    - id: c
      text: { en: "It joined the cluster most recently" }
    - id: d
      text: { en: "It shows the highest current CPU usage" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The ImageLocality scoring plugin favors nodes that already have the Pod's container images, because the Pod can start without a long image pull. Scores from all plugins are combined, and the node with the highest total wins.
  options:
    b:
      en: |
        The kubelet version is not a scoring criterion.
    c:
      en: |
        The age of a node plays no part in scoring.
    d:
      en: |
        The scheduler scores on requested resources, not on current usage, and its default strategy favors less allocated nodes.
references:
  - title: Scheduler Configuration
    url: https://kubernetes.io/docs/reference/scheduling/config/
