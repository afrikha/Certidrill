id: kcna-1b-configmap-data-not-spec
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Most manifests describe the desired state under `spec`.

    For which kind do you write the content under top-level `data` and `binaryData` fields instead of `spec`?
body:
  options:
    - id: a
      text: { en: "Deployment" }
    - id: b
      text: { en: "Service" }
    - id: c
      text: { en: "PersistentVolumeClaim" }
    - id: d
      text: { en: "ConfigMap" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Unlike most objects, a ConfigMap has `data` and `binaryData` fields rather than a `spec`. `data` holds UTF-8 strings and `binaryData` holds base64-encoded binary values; both are optional.
  options:
    a: { en: "A Deployment describes replicas, selector and Pod template under `spec`." }
    b: { en: "A Service describes its type, selector and ports under `spec`." }
    c: { en: "A PersistentVolumeClaim describes the requested storage size, access modes and StorageClass under `spec`." }
references:
  - title: ConfigMaps
    url: https://kubernetes.io/docs/concepts/configuration/configmap/
