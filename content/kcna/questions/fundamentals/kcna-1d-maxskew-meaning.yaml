id: kcna-1d-maxskew-meaning
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Deployment's Pod template has the following constraint. What does `maxSkew: 1` mean?

    ```yaml
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: web
    ```
body:
  options:
    - id: a
      text: { en: "Each zone may run at most one `app=web` Pod" }
    - id: b
      text: { en: "No zone may exceed the least-loaded zone by more than one Pod" }
    - id: c
      text: { en: "At most one `app=web` Pod can be scheduled at a time" }
    - id: d
      text: { en: "Each node may run at most one `app=web` Pod" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `whenUnsatisfiable: DoNotSchedule`, `maxSkew` is the maximum permitted difference between the number of matching Pods in a domain and the global minimum across domains. Here a zone may hold at most one more `app=web` Pod than the least-loaded zone.
  options:
    a:
      en: |
        `maxSkew` limits the difference between zones, not the number of Pods per zone.
    c:
      en: |
        The field has nothing to do with scheduling throughput; it is about distribution.
    d:
      en: |
        The domain here is the zone (`topologyKey`), and the limit is a difference, not an absolute count.
references:
  - title: "Pod Topology Spread Constraints"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
