id: kcna-1a-native-sidecar
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod spec contains the following containers:

    ```yaml
    spec:
      initContainers:
      - name: log-shipper
        image: registry.example.com/tools/log-shipper:2.1
        restartPolicy: Always
      containers:
      - name: app
        image: registry.example.com/shop/app:1.4
    ```

    How does `log-shipper` behave?
body:
  options:
    - id: a
      text: { en: "It starts before `app` and keeps running beside it as a sidecar" }
    - id: b
      text: { en: "It must exit successfully before `app` can start" }
    - id: c
      text: { en: "It is rejected: init containers can't set `restartPolicy`" }
    - id: d
      text: { en: "It starts only after the `app` container has exited" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An init container with `restartPolicy: Always` is a sidecar container: it starts before the main application containers, keeps running alongside them and stops when the Pod shuts down. Sidecar containers are stable since Kubernetes v1.33.
  options:
    b:
      en: |
        That is a regular init container; `restartPolicy: Always` turns this one into a sidecar.
    c:
      en: |
        Init containers accept `restartPolicy: Always`; this sidecar feature is stable since v1.33.
    d:
      en: |
        A sidecar starts before the main containers, not after them.
references:
  - title: "Pods"
    url: https://kubernetes.io/docs/concepts/workloads/pods/
  - title: "Init Containers"
    url: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
