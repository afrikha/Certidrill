id: kcna-1b-context-triple
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does a context in a kubeconfig file group together under one name?
body:
  options:
    - id: a
      text: { en: "A cluster, a node and a namespace" }
    - id: b
      text: { en: "An API server address, a CA certificate and a token" }
    - id: c
      text: { en: "A cluster, a user and a namespace" }
    - id: d
      text: { en: "A namespace, a ServiceAccount and a Role" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A context is a named triple of cluster, user and namespace. For example, a `dev-frontend` context can mean: use the credentials of the `developer` user to access the `frontend` namespace of the `development` cluster.
  options:
    a: { en: "Nodes do not appear in kubeconfig files; a context names a user, not a node." }
    b: { en: "The server address and CA certificate belong to a cluster entry, and the token to a user entry; a context references those entries by name." }
    d: { en: "ServiceAccounts and Roles are API objects in the cluster; they are not parts of a kubeconfig context." }
references:
  - title: Configure Access to Multiple Clusters
    url: https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/
