id: kcna-1b-configmapkeyref
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container must receive one environment variable, `DB_HOST`, set from the key `db-host` of the ConfigMap `app-config`.

    Which field do you use under `env[].valueFrom`?
body:
  options:
    - id: a
      text: { en: "`secretKeyRef`" }
    - id: b
      text: { en: "`fieldRef`" }
    - id: c
      text: { en: "`configMapKeyRef`" }
    - id: d
      text: { en: "`resourceFieldRef`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `configMapKeyRef` takes the `name` of a ConfigMap and the `key` to read, and sets one environment variable from that key. The ConfigMap must exist in the same namespace as the Pod.
  options:
    a: { en: "`secretKeyRef` reads a key from a Secret, not from a ConfigMap." }
    b: { en: "`fieldRef` exposes fields of the Pod itself, such as its name or namespace, not ConfigMap data." }
    d: { en: "`resourceFieldRef` exposes the container's resource requests or limits, not ConfigMap data." }
references:
  - title: Configure a Pod to Use a ConfigMap
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
