id: kcna-1c-version-minor
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the Kubernetes version `1.37.1`, what does `37` identify?
body:
  options:
    - id: a
      text: { en: "The minor version" }
    - id: b
      text: { en: "The patch version" }
    - id: c
      text: { en: "The major version" }
    - id: d
      text: { en: "The release candidate number" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Kubernetes versions follow semantic versioning in the form `x.y.z`: major, minor and patch. In `1.37.1`, `1` is the major version, `37` the minor version and `1` the patch release.
  options:
    b:
      en: |
        The patch version is the last number, `1` in `1.37.1`.
    c:
      en: |
        The major version is the first number, `1`.
    d:
      en: |
        `1.37.1` is a final patch release; it has no release candidate suffix.
references:
  - title: Version Skew Policy
    url: https://kubernetes.io/releases/version-skew-policy/
