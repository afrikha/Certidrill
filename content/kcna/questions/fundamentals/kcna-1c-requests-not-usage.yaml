id: kcna-1c-requests-not-usage
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Monitoring shows that node-1, the only worker node, uses 15 % of its CPU. Yet a new Pod stays Pending, and its FailedScheduling event reports insufficient CPU. What explains this?
body:
  options:
    - id: a
      text: { en: "The scheduler uses the CPU usage of the last 24 hours" }
    - id: b
      text: { en: "The kubelet of node-1 reports stale usage figures" }
    - id: c
      text: { en: "The scheduler counts CPU requests, not actual usage" }
    - id: d
      text: { en: "The Pod sets no CPU limit, so it cannot be scheduled" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The scheduler checks that the sum of the requests of the Pods on a node, plus the new Pod's request, stays within the node's capacity. It refuses a node whose capacity check fails even when actual usage is very low.
  options:
    a:
      en: |
        The scheduler does not look at usage history; it compares requests with capacity.
    b:
      en: |
        Usage figures play no part in the filtering decision, so stale metrics would change nothing.
    d:
      en: |
        A CPU limit is not required for scheduling; requests are what count.
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  - title: Kubernetes Scheduler
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
