id: kcna-1a-no-ccm-on-premises
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs Kubernetes on its own bare-metal servers in its own data center, with no cloud provider. Which control plane component does this cluster not have?
body:
  options:
    - id: a
      text: { en: "kube-controller-manager" }
    - id: b
      text: { en: "kube-scheduler" }
    - id: c
      text: { en: "etcd" }
    - id: d
      text: { en: "cloud-controller-manager" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      cloud-controller-manager is optional: it only runs the controllers that are specific to a cloud provider (node, route and service controllers that call the cloud's APIs). A cluster that runs on your own premises does not have a cloud controller manager.
  options:
    a:
      en: |
        kube-controller-manager runs the core controllers, such as the Node, Job and ServiceAccount controllers, which every cluster needs.
    b:
      en: |
        Every cluster needs a scheduler to assign Pods to nodes, whatever the infrastructure.
    c:
      en: |
        Every cluster needs a backing store for its API data, on premises too.
references:
  - title: "Cluster Architecture"
    url: https://kubernetes.io/docs/concepts/architecture/
  - title: "Cloud Controller Manager"
    url: https://kubernetes.io/docs/concepts/architecture/cloud-controller/
