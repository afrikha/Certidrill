id: kcna-1b-merge-first-wins
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    `~/.kube/team.yaml` sets `current-context: staging`, and `~/.kube/personal.yaml` sets `current-context: lab`. You run the following commands without a `--context` flag.

    ```bash
    export KUBECONFIG=~/.kube/team.yaml:~/.kube/personal.yaml
    kubectl get pods
    ```

    Which context does kubectl use?
body:
  options:
    - id: a
      text: { en: "`staging`, set by the first file of the list" }
    - id: b
      text: { en: "`lab`, set by the last file of the list" }
    - id: c
      text: { en: "None: kubectl fails because the files conflict" }
    - id: d
      text: { en: "None: kubectl prompts you to choose a context" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When kubectl merges the files of `KUBECONFIG`, the first file to set a particular value or map key wins, and later files never change it. Without `--context`, kubectl uses the merged `current-context`, which comes from `team.yaml`.
  options:
    b: { en: "Later files do not override values set by earlier ones; the first file wins." }
    c: { en: "Two files setting `current-context` is not an error; the merge rules pick the first value." }
    d: { en: "kubectl does not ask for a context; the merge rules decide, and `--context` can override them." }
references:
  - title: Organizing Cluster Access Using kubeconfig Files
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
