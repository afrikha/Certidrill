id: kcna-1a-job-controller-via-api
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You create a Job. How does the Job controller get the work done?
body:
  options:
    - id: a
      text: { en: "It starts the containers itself, on a node that it picks for each of the Pods" }
    - id: b
      text: { en: "It writes the new Pod records directly into etcd, without going through the API" }
    - id: c
      text: { en: "It asks the API server to create Pods, which are then scheduled and run by kubelets" }
    - id: d
      text: { en: "It calls the container runtime of each node through the CRI to run the task" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Built-in controllers act by talking to the API server. The Job controller does not run any Pods or containers itself: it tells the API server to create or remove Pods, the scheduler places them and the kubelets run them. When the work is done, the controller updates the Job to mark it finished.
  options:
    a:
      en: |
        The Job controller does not run Pods or containers itself, and choosing nodes is the scheduler's job.
    b:
      en: |
        Built-in controllers work by talking to the API server, never directly to etcd.
    d:
      en: |
        Only the kubelet talks to the container runtime through the CRI.
references:
  - title: "Controllers"
    url: https://kubernetes.io/docs/concepts/architecture/controller/
