id: kcna-1d-taint-where
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Where are taints and tolerations defined?
body:
  options:
    - id: a
      text: { en: "Taints on nodes, tolerations on Pods" }
    - id: b
      text: { en: "Taints on Pods, tolerations on nodes" }
    - id: c
      text: { en: "Both on nodes" }
    - id: d
      text: { en: "Taints on namespaces, tolerations on Pods" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A taint is a property of a node that repels Pods. A toleration is set in the Pod spec and allows the scheduler to place that Pod on nodes with matching taints.
  options:
    b:
      en: |
        This reverses the two: a node repels Pods with its taints, and a Pod declares what it accepts with tolerations.
    c:
      en: |
        Only taints belong to nodes; tolerations are part of the Pod spec (`spec.tolerations`).
    d:
      en: |
        Namespaces have no taints; the scheduler checks the taints of each node.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
