id: kcna-1c-kubeadm-self-managed
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp wants to build a self-managed cluster on its own Linux servers. Which tool does the Kubernetes documentation name as the officially supported tool for deploying such a cluster?
body:
  options:
    - id: a
      text: { en: "kind" }
    - id: b
      text: { en: "kubeadm" }
    - id: c
      text: { en: "minikube" }
    - id: d
      text: { en: "kubectl" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      kubeadm is the officially supported tool for deploying a cluster you manage yourself. It bootstraps the control plane with `kubeadm init` and adds nodes with `kubeadm join`, producing a minimum viable, conformant cluster.
  options:
    a:
      en: |
        kind runs a local cluster whose nodes are containers on Docker or Podman. It is meant for local testing and CI, not for building a cluster on servers.
    c:
      en: |
        minikube runs a local cluster on a personal computer for learning and development work, not a production cluster on company servers.
    d:
      en: |
        kubectl is the command-line client of the Kubernetes API. It manages resources in an existing cluster but does not install one.
references:
  - title: Getting started
    url: https://kubernetes.io/docs/setup/
  - title: Kubeadm
    url: https://kubernetes.io/docs/reference/setup-tools/kubeadm/
