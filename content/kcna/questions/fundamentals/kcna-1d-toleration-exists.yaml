id: kcna-1d-toleration-exists
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod has the following toleration. Which taint does it tolerate?

    ```yaml
    tolerations:
    - key: gpu
      operator: Exists
      effect: NoSchedule
    ```
body:
  options:
    - id: a
      text: { en: "Only a `NoSchedule` taint whose key is `gpu` and whose value is empty" }
    - id: b
      text: { en: "Every taint on the node, whatever its key" }
    - id: c
      text: { en: "Any `NoSchedule` taint with the key `gpu`, whatever its value" }
    - id: d
      text: { en: "Any taint with the key `gpu`, whatever its effect" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A toleration matches a taint when the keys and effects are the same and, with `operator: Exists`, no value is compared. This toleration therefore matches `gpu=true:NoSchedule`, `gpu=a100:NoSchedule` and so on, but not a `gpu` taint with the `NoExecute` effect.
  options:
    a:
      en: |
        `Exists` ignores the value entirely; an empty value is not required.
    b:
      en: |
        Matching every key requires an empty `key` with `operator: Exists`; here the key is `gpu`.
    d:
      en: |
        The `effect` field is set, so only `NoSchedule` taints match; an empty effect would match all effects.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
