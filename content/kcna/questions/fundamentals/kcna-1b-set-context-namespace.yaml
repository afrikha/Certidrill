id: kcna-1b-set-context-namespace
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You work mostly in the namespace `shop` and are tired of adding `-n shop` to every command. You want this namespace saved for all later kubectl commands in your current context.

    Which command do you run?
body:
  options:
    - id: a
      text: { en: "`kubectl config set-context --current --namespace=shop`" }
    - id: b
      text: { en: "`kubectl config set-context shop --namespace=shop`" }
    - id: c
      text: { en: "`kubectl create namespace shop`" }
    - id: d
      text: { en: "`kubectl get pods --namespace=shop`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl config set-context --current --namespace=shop` saves the namespace in the current context. Commands without `-n` then use `shop`; an explicit `--namespace` still overrides it.
  options:
    b: { en: "Without `--current`, this creates or modifies a context named `shop`; the current context, which kubectl keeps using, is unchanged." }
    c: { en: "`kubectl create namespace` creates a Namespace object in the cluster; it does not change kubectl's default namespace." }
    d: { en: "The `--namespace` flag applies to that one command only; nothing is saved for later commands." }
references:
  - title: Command line tool (kubectl)
    url: https://kubernetes.io/docs/reference/kubectl/
