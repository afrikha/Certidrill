id: kcna-1e-runtimeclass-overhead
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Pods that run with Kata Containers use extra memory and CPU for their virtual machine. The scheduler must account for this extra usage automatically for every Pod that runs with Kata Containers. What should the administrator configure?
body:
  options:
    - id: a
      text: { en: "A LimitRange in each namespace that sets default requests" }
    - id: b
      text: { en: "A ResourceQuota in each namespace that runs Kata Pods" }
    - id: c
      text: { en: "A PriorityClass that the Kata Pods reference" }
    - id: d
      text: { en: "The `overhead.podFixed` field of the Kata RuntimeClass" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Pod overhead is declared in the RuntimeClass with `overhead.podFixed`. At admission, it is copied into each Pod's `spec.overhead`, and the scheduler adds it to the sum of the container requests when it picks a node. The kubelet also includes it when it sizes the Pod cgroup.
  options:
    a:
      en: |
        A LimitRange sets default and maximum values for containers. It doesn't add the runtime's own cost to the Pod, and it applies to all Pods of the namespace.
    b:
      en: |
        A ResourceQuota caps the total consumption of a namespace. It doesn't make the scheduler add any overhead to a Pod.
    c:
      en: |
        A PriorityClass affects scheduling order and preemption. It doesn't change the resources counted for a Pod.
references:
  - title: "Pod Overhead"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-overhead/
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
