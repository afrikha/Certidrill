id: kcna-1e-gvisor-approach
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How does gVisor isolate a container from the host?
body:
  options:
    - id: a
      text: { en: "An application kernel in user space handles the container's system calls" }
    - id: b
      text: { en: "Each Pod runs in a lightweight virtual machine with its own guest kernel" }
    - id: c
      text: { en: "A seccomp profile blocks the system calls that the container doesn't need" }
    - id: d
      text: { en: "The container image is signed and verified before the runtime starts it" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      gVisor is an application kernel written in Go that runs in user space between the application and the host. It implements the Linux system interface itself, so the container's system calls don't reach the host kernel directly. Its OCI runtime is `runsc`.
  options:
    b:
      en: |
        Running each Pod in a lightweight virtual machine with its own kernel is the approach of Kata Containers, not gVisor.
    c:
      en: |
        gVisor is not a seccomp system-call filter: it implements the system calls itself instead of only allowing or blocking them.
    d:
      en: |
        Image signing protects the supply chain. It doesn't isolate a running container from the host kernel.
references:
  - title: "GitHub - google/gvisor: Application Kernel for Containers"
    url: https://github.com/google/gvisor
