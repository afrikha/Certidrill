id: kcna-1a-kcm-single-process
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How are the built-in controllers of Kubernetes, such as the Node, Job, EndpointSlice and ServiceAccount controllers, normally run?
body:
  options:
    - id: a
      text: { en: "As one Pod per controller on each worker node" }
    - id: b
      text: { en: "Inside the kubelet of every node" }
    - id: c
      text: { en: "Together in one process, kube-controller-manager" }
    - id: d
      text: { en: "Inside etcd, as triggers on stored objects" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Logically, each controller is a separate process, but to reduce complexity they are compiled into a single binary and run in a single process: kube-controller-manager. It is a control plane component.
  options:
    a:
      en: |
        Built-in controllers are control plane logic; they are not deployed on the worker nodes, and not one Pod per controller.
    b:
      en: |
        The kubelet manages the Pods of its own node; it does not run the cluster-wide controllers.
    d:
      en: |
        etcd only stores data; controllers watch objects through the API server.
references:
  - title: "Cluster Architecture"
    url: https://kubernetes.io/docs/concepts/architecture/
  - title: "Controllers"
    url: https://kubernetes.io/docs/concepts/architecture/controller/
