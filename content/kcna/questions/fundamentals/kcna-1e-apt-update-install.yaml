id: kcna-1e-apt-update-install
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Why should a Dockerfile run `apt-get update` and `apt-get install` in the same `RUN` instruction?
body:
  options:
    - id: a
      text: { en: "Because `apt-get` can only run once per Dockerfile" }
    - id: b
      text: { en: "Because each `RUN` instruction starts a new container image" }
    - id: c
      text: { en: "Because separate `RUN` instructions run in parallel during the build" }
    - id: d
      text: { en: "Because a cached `apt-get update` layer can install outdated packages" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Each `RUN` instruction creates a layer that the builder can reuse from its cache. If `apt-get update` is a separate instruction, its cached layer can be reused even after the package list changed, and a later install gets stale packages. Combining both commands in one `RUN` refreshes the list whenever the install line changes.
  options:
    a:
      en: |
        `apt-get` can run in as many instructions as needed. The problem is the cache, not a limit on the command.
    b:
      en: |
        Each `RUN` adds a layer to the same image. It doesn't start a new image.
    c:
      en: |
        Instructions of one stage run in order, each on top of the previous layer. The issue is the reuse of a cached layer, not parallel execution.
references:
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
