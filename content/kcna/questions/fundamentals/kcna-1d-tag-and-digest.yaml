id: kcna-1d-tag-and-digest
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container uses `image: registry.example.com/shop/web:1.4.2@sha256:9f2b…`. The tag `1.4.2` has since been moved to a different image. Which image does the kubelet pull?
body:
  options:
    - id: a
      text: { en: "The image the tag `1.4.2` currently points to" }
    - id: b
      text: { en: "Neither: a reference with both a tag and a digest is invalid" }
    - id: c
      text: { en: "The image identified by the digest" }
    - id: d
      text: { en: "The latest image of the `shop/web` repository" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When an image reference includes both a tag and a digest, only the digest is used for pulling. Because a digest is a hash of the content, the container gets the same image even if the tag has been moved.
  options:
    a:
      en: |
        When a digest is present, the tag is not used for pulling.
    b:
      en: |
        Kubernetes accepts a reference with both; the documentation shows such an example.
    d:
      en: |
        Nothing in the reference points to `latest`; the digest decides.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
