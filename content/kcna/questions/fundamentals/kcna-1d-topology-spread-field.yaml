id: kcna-1d-topology-spread-field
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want the replicas of a Deployment to be distributed evenly across the zones of a cluster, with at most one more replica in any zone than in another. Which Pod spec field expresses this?
body:
  options:
    - id: a
      text: { en: "`affinity.podAffinity`" }
    - id: b
      text: { en: "`nodeSelector`" }
    - id: c
      text: { en: "`tolerations`" }
    - id: d
      text: { en: "`topologySpreadConstraints`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Topology spread constraints control how Pods are distributed across failure domains such as zones and nodes. With `topologyKey: topology.kubernetes.io/zone` and `maxSkew: 1`, the number of matching Pods may differ by at most one between zones.
  options:
    a:
      en: |
        Pod affinity attracts Pods to domains that already run matching Pods, so it tends to pack them, not balance them.
    b:
      en: |
        A `nodeSelector` restricts the eligible nodes by label but does not count Pods per zone.
    c:
      en: |
        Tolerations let Pods use tainted nodes; they do not affect how replicas are distributed.
references:
  - title: "Pod Topology Spread Constraints"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
