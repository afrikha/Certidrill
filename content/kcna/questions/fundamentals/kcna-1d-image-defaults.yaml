id: kcna-1d-image-defaults
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container spec sets `image: nginx`. Which registry and tag does Kubernetes assume, with the default runtime configuration?
body:
  options:
    - id: a
      text: { en: "Docker Hub and the tag `latest`" }
    - id: b
      text: { en: "`registry.k8s.io` and the tag `latest`" }
    - id: c
      text: { en: "Docker Hub and the tag `stable`" }
    - id: d
      text: { en: "The node's local image cache only, with no tag" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      If you don't specify a registry hostname, Kubernetes assumes the Docker public registry (Docker Hub), unless the container runtime is configured otherwise. If you don't specify a tag, it assumes `latest`.
  options:
    b:
      en: |
        `registry.k8s.io` hosts the Kubernetes project's images; it is not the default registry for unqualified names.
    c:
      en: |
        When no tag is given, the assumed tag is `latest`, not `stable`.
    d:
      en: |
        An image name without registry is not limited to local images; it refers to the Docker public registry.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
