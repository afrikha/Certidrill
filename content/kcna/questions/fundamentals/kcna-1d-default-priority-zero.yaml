id: kcna-1d-default-priority-zero
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod has no `priorityClassName`, and no PriorityClass in the cluster has `globalDefault: true`. What is the priority of the Pod?
body:
  options:
    - id: a
      text: { en: "0" }
    - id: b
      text: { en: "1000000000" }
    - id: c
      text: { en: "The priority of the lowest PriorityClass in the cluster" }
    - id: d
      text: { en: "The priority of `system-cluster-critical`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without a `priorityClassName` and without a PriorityClass that has `globalDefault: true`, a Pod's priority is zero. A global default class, if one exists, gives its value to Pods created without a class name.
  options:
    b:
      en: |
        This is the largest value allowed for a user-defined PriorityClass, not a default.
    c:
      en: |
        Kubernetes does not pick an existing class for the Pod unless one is marked `globalDefault`.
    d:
      en: |
        That built-in class is reserved for critical system components and must be requested explicitly.
references:
  - title: "Pod Priority and Preemption"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
