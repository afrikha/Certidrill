id: kcna-1e-cri-dockerd-keep-docker
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team must keep Docker Engine as the container runtime of its nodes on Kubernetes v1.37. What must be installed on each node?
body:
  options:
    - id: a
      text: { en: "A RuntimeClass named `docker`" }
    - id: b
      text: { en: "The `crictl` command-line tool" }
    - id: c
      text: { en: "The `cri-dockerd` adapter" }
    - id: d
      text: { en: "The dockershim feature gate" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Docker Engine doesn't implement the CRI. Since dockershim was removed in v1.24, the kubelet can use Docker Engine only through `cri-dockerd`, an external adapter that exposes a CRI socket in front of Docker Engine.
  options:
    a:
      en: |
        A RuntimeClass selects a handler that the node's CRI runtime already provides. It can't make the kubelet talk to a runtime that doesn't implement the CRI.
    b:
      en: |
        `crictl` is a debugging client for CRI runtimes. It doesn't connect the kubelet to Docker Engine.
    d:
      en: |
        dockershim was removed from the kubelet code in v1.24. There is no feature gate that brings it back.
references:
  - title: "Container Runtimes"
    url: https://kubernetes.io/docs/setup/production-environment/container-runtimes/
