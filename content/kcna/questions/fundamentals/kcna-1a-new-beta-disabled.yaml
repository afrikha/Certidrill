id: kcna-1a-new-beta-disabled
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A new built-in API was introduced as `v1beta1` in a recent Kubernetes release. Which statement about this API version is correct by default?
body:
  options:
    - id: a
      text: { en: "It is enabled by default, like every built-in beta API version" }
    - id: b
      text: { en: "It is disabled until it is enabled in the kube-apiserver configuration" }
    - id: c
      text: { en: "It is enabled, but the API server accepts only read requests on it" }
    - id: d
      text: { en: "It has the same guarantees as a `v1` version and is never removed" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Built-in beta API versions are disabled by default and must be explicitly enabled in the kube-apiserver configuration, for example with `--runtime-config`, except for beta APIs introduced before Kubernetes 1.22. Beta versions are also deprecated and removed within a limited time.
  options:
    a:
      en: |
        Only beta APIs introduced before Kubernetes 1.22 were enabled by default; newer built-in beta versions are not.
    c:
      en: |
        API versions are enabled or disabled as a whole with `--runtime-config`, not per verb.
    d:
      en: |
        Beta versions have a limited lifetime: they are deprecated and then removed once a newer version exists.
references:
  - title: "API Overview"
    url: https://kubernetes.io/docs/reference/using-api/
