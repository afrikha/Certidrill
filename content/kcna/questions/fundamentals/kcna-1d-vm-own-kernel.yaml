id: kcna-1d-vm-own-kernel
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does each virtual machine have that a container does not?
body:
  options:
    - id: a
      text: { en: "Its own process tree" }
    - id: b
      text: { en: "Its own operating system kernel" }
    - id: c
      text: { en: "Its own file system view" }
    - id: d
      text: { en: "Its own share of CPU and memory" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each VM is a full machine that runs its own operating system on virtualized hardware. Containers relax that isolation: they share the host's operating system kernel, which is why they are lighter and start faster.
  options:
    a:
      en: |
        A container also has its own process tree, through a PID namespace.
    c:
      en: |
        A container also has its own file system, built from its image and isolated by a mount namespace.
    d:
      en: |
        A container also gets its own share of CPU and memory, enforced by cgroups.
references:
  - title: "Overview"
    url: https://kubernetes.io/docs/concepts/overview/
