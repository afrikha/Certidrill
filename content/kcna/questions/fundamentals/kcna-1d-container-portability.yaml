id: kcna-1d-container-portability
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Why does a containerized application behave the same on a developer laptop and on a cloud server?
body:
  options:
    - id: a
      text: { en: "A hypervisor emulates identical hardware on both machines" }
    - id: b
      text: { en: "Each container boots the same guest operating system" }
    - id: c
      text: { en: "The image packages the application with its runtime dependencies" }
    - id: d
      text: { en: "The container runtime installs the application's libraries on the host" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A container image includes the code, the runtime it needs, its libraries and default settings. Because dependencies travel with the image, each container is repeatable and decoupled from the host infrastructure, so it runs the same way across environments.
  options:
    a:
      en: |
        Containers do not run on emulated hardware; they run directly on the host kernel.
    b:
      en: |
        Containers do not boot an operating system; they share the host's kernel.
    d:
      en: |
        Dependencies stay inside the image; nothing is installed on the host.
references:
  - title: "Containers"
    url: https://kubernetes.io/docs/concepts/containers/
