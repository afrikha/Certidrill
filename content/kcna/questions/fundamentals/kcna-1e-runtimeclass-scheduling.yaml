id: kcna-1e-runtimeclass-scheduling
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Only the nodes labeled `sandbox=gvisor` have the `runsc` handler configured. Pods that use the RuntimeClass `gvisor` are sometimes scheduled on other nodes and fail. The fix must not require editing each Pod. What should the administrator do?
body:
  options:
    - id: a
      text: { en: "Add `overhead.podFixed` to the `gvisor` RuntimeClass" }
    - id: b
      text: { en: "Add `scheduling.nodeSelector` with `sandbox: gvisor` to the RuntimeClass" }
    - id: c
      text: { en: "Add a `NoSchedule` taint to the nodes labeled `sandbox=gvisor`" }
    - id: d
      text: { en: "Change the handler of the RuntimeClass to `runc`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `scheduling` field of a RuntimeClass constrains the nodes that can run its Pods. Its `nodeSelector` is merged into the nodeSelector of every Pod that uses the RuntimeClass at admission, so these Pods go only to nodes labeled `sandbox=gvisor`, with no change to the Pods.
  options:
    a:
      en: |
        `overhead.podFixed` adds the sandbox's resource cost to the Pod's requests. It doesn't restrict which nodes can run the Pod.
    c:
      en: |
        A taint keeps Pods without a matching toleration off these nodes. It doesn't attract the `gvisor` Pods, and they would need a toleration too.
    d:
      en: |
        `runc` would start the Pods on any node, but without the gVisor sandbox, which defeats the purpose of the RuntimeClass.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
