id: kcna-1d-nodeselector-label
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod must run only on nodes that carry the label `disktype=ssd`. Which Pod spec field is the simplest way to express this?
body:
  options:
    - id: a
      text: { en: "`nodeSelector`" }
    - id: b
      text: { en: "`tolerations`" }
    - id: c
      text: { en: "`nodeName`" }
    - id: d
      text: { en: "`priorityClassName`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `nodeSelector` is the simplest recommended way to constrain a Pod to nodes. The scheduler places the Pod only on nodes that have every label listed in it, here `disktype: ssd`.
  options:
    b:
      en: |
        Tolerations let a Pod run on nodes that have matching taints; they do not select nodes by label.
    c:
      en: |
        `nodeName` binds the Pod to one named node and bypasses the scheduler; it does not select nodes by label.
    d:
      en: |
        `priorityClassName` sets the Pod's priority for queueing and preemption; it does not restrict which nodes are used.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
