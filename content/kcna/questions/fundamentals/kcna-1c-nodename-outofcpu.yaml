id: kcna-1c-nodename-outofcpu
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Pod sets `spec.nodeName: node-4` and requests 4 CPUs. node-4 has only 2 CPUs of allocatable capacity left. What happens?
body:
  options:
    - id: a
      text: { en: "The Pod stays Pending with a FailedScheduling event" }
    - id: b
      text: { en: "The Pod fails on node-4 with a reason such as OutOfcpu" }
    - id: c
      text: { en: "kube-scheduler moves the Pod to a node with enough CPU" }
    - id: d
      text: { en: "The Pod runs on node-4 and is throttled to 2 CPUs" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `nodeName` set, the scheduler is bypassed, so no filtering checks the node's free capacity. The kubelet on node-4 cannot accommodate the Pod, and the Pod fails with a reason that says why, for example OutOfcpu.
  options:
    a:
      en: |
        FailedScheduling events come from the scheduler, which ignores Pods that already have a `nodeName`.
    c:
      en: |
        The scheduler never processes this Pod, so it cannot move it elsewhere.
    d:
      en: |
        Throttling enforces CPU limits of running containers; it does not make room for requests that do not fit.
references:
  - title: Assigning Pods to Nodes
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
