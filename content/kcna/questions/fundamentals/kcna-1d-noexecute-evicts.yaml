id: kcna-1d-noexecute-evicts
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator adds a taint to a node. Pods already running on that node without a matching toleration are evicted. Which taint was added?
body:
  options:
    - id: a
      text: { en: "`maintenance=true:NoSchedule`" }
    - id: b
      text: { en: "`maintenance=true:NoExecute`" }
    - id: c
      text: { en: "`maintenance=true:PreferNoSchedule`" }
    - id: d
      text: { en: "`node.kubernetes.io/unschedulable:NoSchedule`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `NoExecute` effect acts on running Pods as well as new ones: Pods that do not tolerate the taint are evicted, and new ones are not scheduled. `NoSchedule` and `PreferNoSchedule` affect only scheduling decisions.
  options:
    a:
      en: |
        `NoSchedule` stops new Pods without a toleration, but Pods already running on the node are not evicted.
    c:
      en: |
        `PreferNoSchedule` is only a soft preference for the scheduler; it never evicts running Pods.
    d:
      en: |
        This is the taint that marks a cordoned node: it blocks new Pods but leaves running Pods in place.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
