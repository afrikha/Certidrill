id: kcna-1a-kubelet-registers-node
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    When a new worker node joins a cluster, which component normally registers the node with the API server?
body:
  options:
    - id: a
      text: { en: "The kubelet on the new node" }
    - id: b
      text: { en: "kube-scheduler" }
    - id: c
      text: { en: "kube-proxy on the new node" }
    - id: d
      text: { en: "kube-controller-manager" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With the default `--register-node=true`, the kubelet self-registers its node with the API server, which is the preferred pattern used by most distributions. An administrator can instead create Node objects manually with `--register-node=false`.
  options:
    b:
      en: |
        kube-scheduler only places Pods on nodes that are already registered.
    c:
      en: |
        kube-proxy programs Service rules; it does not create the Node object.
    d:
      en: |
        The node controller works on registered nodes (CIDR assignment, health monitoring); it does not register them.
references:
  - title: "Nodes"
    url: https://kubernetes.io/docs/concepts/architecture/nodes/
  - title: "kubelet"
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
