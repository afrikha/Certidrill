id: kcna-1d-schedule-anyway
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A topology spread constraint uses `whenUnsatisfiable: ScheduleAnyway`. No node can satisfy its `maxSkew`. What happens to a new Pod?
body:
  options:
    - id: a
      text: { en: "It is scheduled, preferring nodes that keep the skew lowest" }
    - id: b
      text: { en: "It stays `Pending` until the skew can be respected" }
    - id: c
      text: { en: "It is scheduled, and the scheduler later moves Pods to rebalance" }
    - id: d
      text: { en: "It is rejected by the API server" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `ScheduleAnyway` makes the constraint a soft preference: the scheduler still places the Pod and gives higher scores to nodes that reduce the skew. `DoNotSchedule` (the default) would leave the Pod `Pending` instead.
  options:
    b:
      en: |
        That is the behavior of `DoNotSchedule`, the default value.
    c:
      en: |
        The scheduler never moves running Pods; spread is only considered when a Pod is scheduled.
    d:
      en: |
        The constraint is evaluated by the scheduler, not at API admission.
references:
  - title: "Pod Topology Spread Constraints"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
