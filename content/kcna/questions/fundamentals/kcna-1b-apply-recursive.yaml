id: kcna-1b-apply-recursive
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your manifests are stored in `configs/` and in several subdirectories of it, such as `configs/frontend/` and `configs/backend/`. There is no kustomization file.

    Which command applies all of them?
body:
  options:
    - id: a
      text: { en: "`kubectl apply -R -f configs/`" }
    - id: b
      text: { en: "`kubectl apply -k configs/`" }
    - id: c
      text: { en: "`kubectl create -f configs/`" }
    - id: d
      text: { en: "`kubectl apply -f configs/ --dry-run=server`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl apply -f <directory>` processes the files of that directory; adding `-R` (`--recursive`) also processes its subdirectories. Each object is created or updated as needed.
  options:
    b: { en: "`-k` builds the directory as a Kustomize kustomization, which needs a kustomization file; it is not the recursive option." }
    c: { en: "`kubectl create -f` without `-R` does not walk subdirectories, and it fails for objects that already exist." }
    d: { en: "`--dry-run=server` only simulates the request, and without `-R` the subdirectories are skipped." }
references:
  - title: Kubernetes Object Management
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/object-management/
