id: kcna-1d-image-registry-part
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the image reference `registry.example.com:5000/shop/web:1.4.2`, which part identifies the registry?
body:
  options:
    - id: a
      text: { en: "`shop/web`" }
    - id: b
      text: { en: "`registry.example.com:5000`" }
    - id: c
      text: { en: "`1.4.2`" }
    - id: d
      text: { en: "`web:1.4.2`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An image name can start with a registry hostname and an optional port, here `registry.example.com:5000`. It is followed by the repository (`shop/web`) and the tag (`1.4.2`).
  options:
    a:
      en: |
        `shop/web` is the repository, the image name inside the registry.
    c:
      en: |
        `1.4.2` is the tag, which identifies a version of the image.
    d:
      en: |
        This is the last part of the repository name followed by the tag, not the registry.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
