id: kcna-1c-requests-for-scheduling
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which container setting does kube-scheduler use to decide whether a Pod fits on a node?
body:
  options:
    - id: a
      text: { en: "`resources.limits`" }
    - id: b
      text: { en: "`resources.requests`" }
    - id: c
      text: { en: "`priorityClassName`" }
    - id: d
      text: { en: "`imagePullPolicy`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      kube-scheduler uses the resource requests of the containers to choose a node: the sum of the requests on a node must stay within its capacity. The kubelet reserves at least the requested amount for each container.
  options:
    a:
      en: |
        Limits are enforced at run time by the kernel (throttling, OOM kills); placement is based on requests.
    c:
      en: |
        A priority class orders Pending Pods and can trigger preemption, but it does not decide whether a Pod fits on a node.
    d:
      en: |
        The image pull policy controls when the kubelet pulls the image; it plays no part in node selection.
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
