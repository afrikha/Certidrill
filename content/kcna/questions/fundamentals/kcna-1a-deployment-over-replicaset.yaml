id: kcna-1a-deployment-over-replicaset
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Why does the Kubernetes documentation recommend creating a Deployment rather than a ReplicaSet directly?
body:
  options:
    - id: a
      text: { en: "A Deployment manages ReplicaSets and adds declarative updates of their Pods" }
    - id: b
      text: { en: "ReplicaSets are deprecated and will be removed in a future release" }
    - id: c
      text: { en: "A ReplicaSet can only keep one Pod running at a time" }
    - id: d
      text: { en: "A ReplicaSet does not replace Pods that fail or are deleted" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A ReplicaSet keeps a stable set of replica Pods running. A Deployment is a higher-level concept that manages ReplicaSets and provides declarative updates to Pods (rolling updates, rollback), so the documentation recommends Deployments unless you need custom update orchestration or no updates at all.
  options:
    b:
      en: |
        ReplicaSets are not deprecated: every Deployment uses them to run its Pods.
    c:
      en: |
        A ReplicaSet keeps the number of replicas set in `spec.replicas` running.
    d:
      en: |
        Replacing failed or deleted Pods is exactly what a ReplicaSet does.
references:
  - title: "ReplicaSet"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  - title: "Deployments"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
