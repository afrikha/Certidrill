id: kcna-1c-kind-ci-cluster
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CI pipeline must create a throwaway multi-node cluster on its build agent. Each Kubernetes node must run as a container on the agent's Docker engine. Which tool fits this need?
body:
  options:
    - id: a
      text: { en: "kubeadm" }
    - id: b
      text: { en: "Kubespray" }
    - id: c
      text: { en: "kind" }
    - id: d
      text: { en: "kops" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      kind (Kubernetes IN Docker) runs a local cluster whose nodes are containers, and it requires Docker or Podman. A cluster can be created and deleted in seconds, which makes kind a common choice for tests and CI pipelines.
  options:
    a:
      en: |
        kubeadm bootstraps a cluster on machines (physical or virtual) that are already provisioned. It does not run the nodes as containers.
    b:
      en: |
        Kubespray is a deployment tool for production clusters on existing machines, not for throwaway clusters on a build agent.
    d:
      en: |
        kops is a deployment tool for production clusters on cloud infrastructure. It does not create nodes as local containers.
references:
  - title: Install Tools
    url: https://kubernetes.io/docs/tasks/tools/
