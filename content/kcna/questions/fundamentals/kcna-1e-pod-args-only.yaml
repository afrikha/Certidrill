id: kcna-1e-pod-args-only
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An image is built with `ENTRYPOINT ["/report"]` and `CMD ["--daily"]`. A Pod runs it with this container spec.

    ```yaml
    containers:
    - name: report
      image: registry.example.com/tools/report:3.2
      args: ["--weekly"]
    ```

    What does the container run?
body:
  options:
    - id: a
      text: { en: "`/report --daily`" }
    - id: b
      text: { en: "`--weekly` as the executable" }
    - id: c
      text: { en: "`/report --daily --weekly`" }
    - id: d
      text: { en: "`/report --weekly`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In a Pod, `command` replaces the image's `ENTRYPOINT` and `args` replaces its `CMD`. With `args` only, the image's entrypoint runs with the new arguments, so the container runs `/report --weekly`.
  options:
    a:
      en: |
        The image's `CMD` provides default arguments only when the Pod sets no `args`. Here `args` replaces it.
    b:
      en: |
        `args` never replaces the executable. That would require the `command` field.
    c:
      en: |
        `args` replaces the default arguments of `CMD`; it does not append to them.
references:
  - title: "Define a Command and Arguments for a Container"
    url: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
