id: kcna-1d-priorityclass-object
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Kubernetes object maps a name to an integer value that sets how important a Pod is relative to other Pods?
body:
  options:
    - id: a
      text: { en: "ResourceQuota" }
    - id: b
      text: { en: "RuntimeClass" }
    - id: c
      text: { en: "PriorityClass" }
    - id: d
      text: { en: "LimitRange" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A PriorityClass is a non-namespaced object that maps a priority class name to an integer value; the higher the value, the higher the priority. A Pod refers to it with `priorityClassName`.
  options:
    a:
      en: |
        A ResourceQuota caps the total resources or object counts of a namespace; it does not rank Pods.
    b:
      en: |
        A RuntimeClass selects a container runtime configuration for a Pod, not its importance.
    d:
      en: |
        A LimitRange sets default and maximum resource values per container in a namespace.
references:
  - title: "Pod Priority and Preemption"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
