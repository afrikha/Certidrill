id: kcna-1a-etcd-five-member-tolerance
objective: "1.1.1"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A production cluster uses a five-member etcd cluster, as the Kubernetes documentation recommends. How many members can fail while etcd keeps a quorum and can still commit changes?
body:
  options:
    - id: a
      text: { en: "1" }
    - id: b
      text: { en: "2" }
    - id: c
      text: { en: "3" }
    - id: d
      text: { en: "4" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      etcd needs a majority (quorum) of its members, (n/2)+1, to agree on each change. For five members the quorum is 3, so the cluster tolerates 2 failed members. This is why etcd should run with an odd number of members: a sixth member would raise the quorum to 4 without tolerating more failures.
  options:
    a:
      en: |
        One failure is the tolerance of a three-member cluster. Five members still have a majority of 3 after two failures.
    c:
      en: |
        With three members down, only 2 of 5 remain, which is not a majority: etcd cannot commit changes.
    d:
      en: |
        One remaining member is far from a majority of five; the cluster cannot make any changes.
references:
  - title: "FAQ"
    url: https://etcd.io/docs/v3.6/faq/
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
