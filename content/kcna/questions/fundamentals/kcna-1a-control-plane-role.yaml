id: kcna-1a-control-plane-role
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which part of a Kubernetes cluster makes global decisions about the cluster, such as scheduling, and responds to cluster events?
body:
  options:
    - id: a
      text: { en: "The worker nodes" }
    - id: b
      text: { en: "The container runtime" }
    - id: c
      text: { en: "The control plane" }
    - id: d
      text: { en: "The cluster DNS add-on" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The control plane (kube-apiserver, etcd, kube-scheduler, kube-controller-manager and, in a cloud, cloud-controller-manager) makes global decisions such as scheduling and responds to cluster events. The nodes run the workloads that it assigns to them.
  options:
    a:
      en: |
        Worker nodes run the Pods and report their status; they carry out decisions rather than making cluster-wide ones.
    b:
      en: |
        The container runtime only pulls images and runs containers on its own node when the kubelet asks it to.
    d:
      en: |
        Cluster DNS serves DNS records for Services; it takes no scheduling or management decisions.
references:
  - title: "Cluster Architecture"
    url: https://kubernetes.io/docs/concepts/architecture/
