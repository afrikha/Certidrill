id: kcna-1c-eviction-order
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A node runs out of memory. It hosts Pods of all three QoS classes, all using more memory than they request. Which Pods does the kubelet evict first?
body:
  options:
    - id: a
      text: { en: "Guaranteed Pods" }
    - id: b
      text: { en: "Burstable Pods" }
    - id: c
      text: { en: "BestEffort Pods" }
    - id: d
      text: { en: "The most recently started Pods" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Under node resource pressure, Kubernetes evicts BestEffort Pods first, then Burstable Pods, and Guaranteed Pods last. Only Pods that use more than their requests are candidates when the eviction is due to resource pressure.
  options:
    a:
      en: |
        Guaranteed Pods are evicted last.
    b:
      en: |
        Burstable Pods are evicted only after all BestEffort Pods.
    d:
      en: |
        Start time does not set the eviction order; the QoS class does.
references:
  - title: Pod Quality of Service Classes
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/
