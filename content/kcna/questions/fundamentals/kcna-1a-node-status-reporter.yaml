id: kcna-1a-node-status-reporter
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which component posts a node's status, such as its `Ready` condition and its capacity, to the API server?
body:
  options:
    - id: a
      text: { en: "kube-scheduler" }
    - id: b
      text: { en: "kube-proxy of that node" }
    - id: c
      text: { en: "The kubelet of that node" }
    - id: d
      text: { en: "The container runtime of that node" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The kubelet posts the status of its node (addresses, conditions such as `Ready`, capacity and allocatable resources) to the API server, every 10 seconds by default (`--node-status-update-frequency`). You can read it with `kubectl describe node`.
  options:
    a:
      en: |
        kube-scheduler reads node capacity to place Pods; it does not report node status.
    b:
      en: |
        kube-proxy only watches Services and EndpointSlices to program network rules.
    d:
      en: |
        The runtime reports container state to the kubelet; it does not talk to the API server.
references:
  - title: "kubelet"
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
  - title: "Nodes"
    url: https://kubernetes.io/docs/concepts/architecture/nodes/
