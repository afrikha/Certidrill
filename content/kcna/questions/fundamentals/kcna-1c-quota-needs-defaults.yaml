id: kcna-1c-quota-needs-defaults
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `team-b` namespace has a ResourceQuota that tracks `requests.cpu` and `requests.memory`. Pods whose containers set no resources are now rejected. You want them admitted without editing every manifest. What should you add to the namespace?
body:
  options:
    - id: a
      text: { en: "A higher hard limit in the ResourceQuota" }
    - id: b
      text: { en: "A PriorityClass with `globalDefault: true`" }
    - id: c
      text: { en: "A PodDisruptionBudget for the namespace" }
    - id: d
      text: { en: "A LimitRange that sets default CPU and memory requests" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a quota tracks CPU or memory, Pods must specify requests or limits for them or the quota system may reject them. A LimitRange with default values injects them into containers that set none, so the Pods are admitted and counted against the quota.
  options:
    a:
      en: |
        The Pods are rejected because they declare no requests, not because the total is too low.
    b:
      en: |
        A default PriorityClass gives Pods a priority; it does not give containers resource requests.
    c:
      en: |
        A PodDisruptionBudget only limits voluntary disruptions; it has no effect on admission.
references:
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
  - title: Limit Ranges
    url: https://kubernetes.io/docs/concepts/policy/limit-range/
