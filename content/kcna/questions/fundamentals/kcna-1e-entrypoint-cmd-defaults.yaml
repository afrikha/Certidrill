id: kcna-1e-entrypoint-cmd-defaults
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An image must always run the `/app` executable. Its default argument is `--port=8080`, and users must be able to replace that argument with their own, for example with Pod `args`. Which Dockerfile lines meet these requirements?
body:
  options:
    - id: a
      text: { en: "`ENTRYPOINT [\"/app\"]` and `CMD [\"--port=8080\"]`" }
    - id: b
      text: { en: "`CMD [\"/app\", \"--port=8080\"]` only" }
    - id: c
      text: { en: "`RUN [\"/app\", \"--port=8080\"]` only" }
    - id: d
      text: { en: "`ENTRYPOINT [\"/app\", \"--port=8080\"]` only" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `ENTRYPOINT` sets the main executable and `CMD` sets default arguments that are replaced when the user passes others. Pod `args` replace `CMD`, so `/app` always runs and `--port=8080` is used only when no argument is given.
  options:
    b:
      en: |
        With `CMD` only, user arguments replace the whole command, including `/app`, so the executable is not guaranteed to run.
    c:
      en: |
        `RUN` executes the command once at build time. It doesn't define what runs when a container starts.
    d:
      en: |
        Arguments in `ENTRYPOINT` are fixed. User arguments are added after them instead of replacing `--port=8080`.
references:
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
  - title: "Define a Command and Arguments for a Container"
    url: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
