id: kcna-1b-configmap-volume-files
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The ConfigMap `web-config` has two keys, `nginx.conf` and `mime.types`. A Pod declares it as a volume.

    ```yaml
    volumes:
    - name: config
      configMap:
        name: web-config
    containers:
    - name: web
      image: nginx:1.27
      volumeMounts:
      - name: config
        mountPath: /etc/nginx/conf.d
    ```

    What does the container find in `/etc/nginx/conf.d`?
body:
  options:
    - id: a
      text: { en: "Two files, `nginx.conf` and `mime.types`, each containing the value of its key" }
    - id: b
      text: { en: "One file named `web-config` that contains both keys in YAML" }
    - id: c
      text: { en: "An empty directory; the keys are exposed as environment variables" }
    - id: d
      text: { en: "The original image files, with the ConfigMap keys added next to them" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a ConfigMap is mounted as a volume without `items`, each key becomes a file in the mount directory, named after the key, and the file content is the key's value. Use `items` with `path` to pick only some keys or rename the files.
  options:
    b: { en: "The kubelet does not write the whole ConfigMap as one file; it creates one file per key." }
    c: { en: "A `configMap` volume projects the keys as files; environment variables come only from `env` or `envFrom`." }
    d: { en: "The volume mount hides the files that the image had in that directory: only the projected keys are visible." }
references:
  - title: Configure a Pod to Use a ConfigMap
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
