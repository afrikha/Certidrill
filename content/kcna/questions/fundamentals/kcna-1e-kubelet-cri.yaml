id: kcna-1e-kubelet-cri
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Through which interface does the kubelet ask the container runtime on its node to start and stop containers?
body:
  options:
    - id: a
      text: { en: "Container Runtime Interface (CRI)" }
    - id: b
      text: { en: "Container Network Interface (CNI)" }
    - id: c
      text: { en: "Container Storage Interface (CSI)" }
    - id: d
      text: { en: "OCI Distribution Specification" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The CRI is the gRPC API between the kubelet, which acts as the client, and the container runtime. Any runtime that implements it, such as containerd or CRI-O, can run Pods without changes to Kubernetes.
  options:
    b:
      en: |
        CNI plugins configure Pod networking, such as interfaces and IP addresses. They don't start or stop containers.
    c:
      en: |
        CSI drivers expose storage systems to Kubernetes as volumes. They don't manage containers.
    d:
      en: |
        The OCI Distribution Specification standardizes how registries distribute images. It is not the API between the kubelet and the runtime.
references:
  - title: "Container Runtime Interface (CRI)"
    url: https://kubernetes.io/docs/concepts/architecture/cri/
