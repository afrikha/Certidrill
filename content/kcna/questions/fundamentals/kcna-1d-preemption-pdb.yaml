id: kcna-1d-preemption-pdb
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A pending high-priority Pod can fit only if the scheduler evicts lower-priority Pods that are protected by a PodDisruptionBudget. No other victims are available. What can happen?
body:
  options:
    - id: a
      text: { en: "The scheduler never evicts Pods covered by a PDB, so the Pod stays `Pending`" }
    - id: b
      text: { en: "The scheduler can still preempt them, because it respects PDBs only on a best-effort basis" }
    - id: c
      text: { en: "The PDB is raised automatically so that the eviction is allowed" }
    - id: d
      text: { en: "The high-priority Pod is scheduled on a cordoned node instead" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes supports PodDisruptionBudgets during preemption, but respecting them is best effort. The scheduler first looks for victims whose eviction does not violate a PDB; if it finds none, preemption still happens and PDB-protected lower-priority Pods can be removed.
  options:
    a:
      en: |
        PDBs are not an absolute protection against preemption: if no compliant victims exist, preemption still happens.
    c:
      en: |
        The scheduler never modifies PodDisruptionBudgets.
    d:
      en: |
        A cordoned (unschedulable) node is filtered out; preemption does not bypass that.
references:
  - title: "Pod Priority and Preemption"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
