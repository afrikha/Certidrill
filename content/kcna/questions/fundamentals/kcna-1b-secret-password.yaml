id: kcna-1b-secret-password
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod needs the password of its database. You do not want to put the password in the container image or in the application code.

    Which Kubernetes object is designed to hold the password?
body:
  options:
    - id: a
      text: { en: "ConfigMap" }
    - id: b
      text: { en: "Secret" }
    - id: c
      text: { en: "An annotation on the Pod" }
    - id: d
      text: { en: "PersistentVolume" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Secret holds a small amount of sensitive data such as a password, a token or a key, so that confidential data stays out of images and code. Pods consume it as environment variables or as files in a volume.
  options:
    a: { en: "A ConfigMap provides no secrecy or encryption and is meant for non-confidential data only." }
    c: { en: "Annotations are non-identifying metadata read by tools; they are visible to anyone who can read the Pod and are not a way to deliver credentials." }
    d: { en: "A PersistentVolume is a piece of storage in the cluster, not an object that holds individual credentials." }
references:
  - title: Secrets
    url: https://kubernetes.io/docs/concepts/configuration/secret/
