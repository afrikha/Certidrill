id: kcna-1e-containerd-role
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes containerd?
body:
  options:
    - id: a
      text: { en: "A network plugin that assigns an IP address to each Pod" }
    - id: b
      text: { en: "A daemon that manages the container lifecycle, from image pull to execution" }
    - id: c
      text: { en: "A kernel feature that limits the CPU and memory of a process" }
    - id: d
      text: { en: "A registry that stores and distributes container images" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      containerd is an industry-standard container runtime that runs as a daemon. It manages the complete container lifecycle on a host: image transfer and storage, container execution and supervision, low-level storage and network attachments. It is a CNCF graduated project.
  options:
    a:
      en: |
        Assigning Pod IP addresses is the job of a CNI plugin, such as Cilium. containerd runs containers.
    c:
      en: |
        Limiting CPU and memory is done by control groups (cgroups), a Linux kernel feature that runtimes use. containerd is not a kernel feature.
    d:
      en: |
        containerd pulls images from and pushes them to registries, but it is not a registry itself.
references:
  - title: "containerd – An industry-standard container runtime with an emphasis on simplicity, robustness and portability"
    url: https://containerd.io/
