id: kcna-1c-quota-total-cpu
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pods of the `team-a` namespace must never request more than 10 CPUs in total. Which object enforces this?
body:
  options:
    - id: a
      text: { en: "LimitRange" }
    - id: b
      text: { en: "ResourceQuota" }
    - id: c
      text: { en: "PriorityClass" }
    - id: d
      text: { en: "PodDisruptionBudget" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A ResourceQuota limits aggregate resource consumption per namespace, for example the sum of CPU requests of all non-terminal Pods with `requests.cpu: "10"`. A request that would exceed the total is rejected.
  options:
    a:
      en: |
        A LimitRange constrains each Pod or container (defaults, minimum, maximum), not the total of the namespace.
    c:
      en: |
        A PriorityClass sets the importance of Pods for scheduling and preemption; it does not cap consumption.
    d:
      en: |
        A PodDisruptionBudget limits how many Pods of an application voluntary disruptions may take down at once.
references:
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
