id: kcna-1a-apiserver-front-end
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which control plane component is the front end of the control plane and exposes the Kubernetes HTTP API that `kubectl` uses?
body:
  options:
    - id: a
      text: { en: "etcd" }
    - id: b
      text: { en: "kube-proxy" }
    - id: c
      text: { en: "kube-controller-manager" }
    - id: d
      text: { en: "kube-apiserver" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      kube-apiserver is the front end of the control plane: it exposes the Kubernetes HTTP API. `kubectl`, the other control plane components, the kubelets and other tools all send their requests to it.
  options:
    a:
      en: |
        etcd is the key-value store behind the API server; `kubectl` never talks to it directly.
    b:
      en: |
        kube-proxy is a node component that maintains network rules for Services; it does not serve the Kubernetes API.
    c:
      en: |
        kube-controller-manager is itself a client of the API server; it runs controllers and exposes no API to users.
references:
  - title: "Kubernetes Components"
    url: https://kubernetes.io/docs/concepts/overview/components/
  - title: "Cluster Architecture"
    url: https://kubernetes.io/docs/concepts/architecture/
