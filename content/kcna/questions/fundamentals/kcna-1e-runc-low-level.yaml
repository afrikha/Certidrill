id: kcna-1e-runc-low-level
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which component is a low-level runtime that creates the container process according to the OCI runtime specification?
body:
  options:
    - id: a
      text: { en: "containerd" }
    - id: b
      text: { en: "CRI-O" }
    - id: c
      text: { en: "kubelet" }
    - id: d
      text: { en: "runc" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      runc is a command-line tool that spawns and runs containers on Linux according to the OCI specification. It is a low-level tool, called by higher-level runtimes such as containerd, rather than used directly. Docker donated runc to the OCI as the basis of its work.
  options:
    a:
      en: |
        containerd is a high-level runtime: it implements the CRI, pulls and stores images and supervises containers, and calls a low-level runtime such as runc to create them.
    b:
      en: |
        CRI-O is a high-level CRI implementation for Kubernetes. It runs containers through an OCI runtime such as runc or Kata Containers.
    c:
      en: |
        The kubelet is the node agent. It asks the runtime through the CRI to run containers but doesn't create container processes itself.
references:
  - title: "GitHub - opencontainers/runc: CLI tool for spawning and running containers according to the OCI specification"
    url: https://github.com/opencontainers/runc
  - title: "About the Open Container Initiative - Open Container Initiative"
    url: https://opencontainers.org/about/overview/
