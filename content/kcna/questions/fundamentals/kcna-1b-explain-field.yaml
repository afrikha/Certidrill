id: kcna-1b-explain-field
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want to read what the `strategy` field of a Deployment means and which subfields it accepts, using the schema of your cluster.

    Which command do you use?
body:
  options:
    - id: a
      text: { en: "`kubectl explain deployment.spec.strategy`" }
    - id: b
      text: { en: "`kubectl describe deployment strategy`" }
    - id: c
      text: { en: "`kubectl get deployment -o yaml`" }
    - id: d
      text: { en: "`kubectl api-versions`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl explain` describes the fields of a resource, identified with a `TYPE.FIELD.FIELD` path. The information is retrieved from the API server in OpenAPI format, so it matches the cluster's version.
  options:
    b: { en: "`kubectl describe deployment strategy` looks for a Deployment named `strategy` and shows its live state, not field documentation." }
    c: { en: "`kubectl get -o yaml` prints the live objects with their values, without explaining what the fields mean." }
    d: { en: "`kubectl api-versions` lists the group/version pairs of the server, not field documentation." }
references:
  - title: kubectl explain
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_explain/
