id: kcna-1e-cri-v1-required
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    After a node is upgraded to Kubernetes v1.37, its kubelet fails to register the node. The node's container runtime is an old release that supports only a pre-v1 version of the CRI API. What should the administrator do?
body:
  options:
    - id: a
      text: { en: "Re-enable dockershim in the kubelet configuration" }
    - id: b
      text: { en: "Create a RuntimeClass whose handler names the old runtime" }
    - id: c
      text: { en: "Switch the kubelet cgroup driver to `cgroupfs`" }
    - id: d
      text: { en: "Upgrade the runtime to a release that supports CRI `v1`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Since Kubernetes v1.26, the kubelet works only with runtimes that support the `v1` CRI API. If the runtime doesn't support it, the kubelet doesn't register the node. Upgrading the runtime to a release that implements CRI `v1`, then restarting the kubelet if needed, fixes it.
  options:
    a:
      en: |
        dockershim was removed in v1.24 and can't be re-enabled. It would not help a runtime that speaks an old CRI version anyway.
    b:
      en: |
        A RuntimeClass selects among handlers that a working CRI runtime offers. It doesn't change the CRI version the runtime supports.
    c:
      en: |
        The cgroup driver must match between the kubelet and the runtime, but it has nothing to do with the CRI API version.
references:
  - title: "Container Runtime Interface (CRI)"
    url: https://kubernetes.io/docs/concepts/architecture/cri/
