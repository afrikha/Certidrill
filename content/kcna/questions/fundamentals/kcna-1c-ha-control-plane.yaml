id: kcna-1c-ha-control-plane
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp runs a self-managed cluster whose control plane runs on a single machine. The control plane must keep working if one machine fails. What should the company do?
body:
  options:
    - id: a
      text: { en: "Run the control plane on at least three machines behind a load balancer" }
    - id: b
      text: { en: "Add worker nodes and spread application replicas across them" }
    - id: c
      text: { en: "Raise the replica count of every Deployment in the cluster" }
    - id: d
      text: { en: "Move the control plane to the largest available machine" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A control plane on one machine is not highly available. The production guidance is to run the control plane services on at least three machines and to put a load balancer in front of the kube-apiserver instances.
  options:
    b:
      en: |
        More worker nodes protect the applications, but the single control plane machine remains a single point of failure.
    c:
      en: |
        Application replicas do not protect the API server, the scheduler or etcd from the loss of their only machine.
    d:
      en: |
        A bigger machine adds capacity, not redundancy: its failure still stops the control plane.
references:
  - title: Production environment
    url: https://kubernetes.io/docs/setup/production-environment/
