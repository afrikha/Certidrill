id: kcna-1b-use-context
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your kubeconfig file defines the contexts `dev` and `staging`. kubectl currently uses `dev`.

    Which command makes `staging` the default context for the next kubectl commands?
body:
  options:
    - id: a
      text: { en: "`kubectl config set-context staging`" }
    - id: b
      text: { en: "`kubectl config get-contexts staging`" }
    - id: c
      text: { en: "`kubectl config set-cluster staging`" }
    - id: d
      text: { en: "`kubectl config use-context staging`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kubectl config use-context` sets the `current-context` of the kubeconfig file, which kubectl uses whenever no `--context` flag is given.
  options:
    a: { en: "`set-context` creates or modifies a context entry; it does not switch to it." }
    b: { en: "`get-contexts` only displays contexts; it changes nothing." }
    c: { en: "`set-cluster` creates or modifies a cluster entry, such as its server address; it does not change the current context." }
references:
  - title: kubectl Quick Reference
    url: https://kubernetes.io/docs/reference/kubectl/quick-reference/
