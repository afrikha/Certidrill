id: kcna-1d-pull-always-cache
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A container has `imagePullPolicy: Always`, and its image is already on the node from an earlier start. What happens when the container starts again?
body:
  options:
    - id: a
      text: { en: "The runtime downloads every layer of the image again" }
    - id: b
      text: { en: "The registry is not contacted, because the image is cached" }
    - id: c
      text: { en: "The kubelet compares digests itself and skips the runtime" }
    - id: d
      text: { en: "The runtime checks the registry and downloads only missing layers" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `Always`, every time the kubelet launches the container it asks the container runtime to pull the image. The runtime resolves the name to a digest and downloads only the layers that are not already cached, so a repeated pull is cheap.
  options:
    a:
      en: |
        Cached layers are reused; only missing layers are downloaded.
    b:
      en: |
        With `Always`, the kubelet asks the runtime to pull at every container start, so the registry is contacted.
    c:
      en: |
        The kubelet does not check whether the image is cached; it asks the container runtime to pull.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
