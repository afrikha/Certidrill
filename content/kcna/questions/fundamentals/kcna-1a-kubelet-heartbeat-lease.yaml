id: kcna-1a-kubelet-heartbeat-lease
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    How does the kubelet send the lightweight heartbeats that the control plane uses to detect node failures?
body:
  options:
    - id: a
      text: { en: "It answers the health checks that kube-controller-manager sends to each node" }
    - id: b
      text: { en: "It writes a timestamp directly into etcd on the control plane" }
    - id: c
      text: { en: "It creates a new Event in the `kube-system` namespace" }
    - id: d
      text: { en: "It renews its node's Lease object in the `kube-node-lease` namespace" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For every Node there is a Lease with the same name in the `kube-node-lease` namespace. Each kubelet heartbeat updates the Lease's `spec.renewTime`, and the control plane uses that timestamp to decide whether the node is available. Updates to the Node's `.status` are the other form of heartbeat.
  options:
    a:
      en: |
        The node controller does not poll the nodes; it reads the heartbeats that the kubelets post through the API.
    b:
      en: |
        The kubelet never accesses etcd; all its updates go through the API server.
    c:
      en: |
        Events record notable occurrences for people and tools; they are not the heartbeat mechanism.
references:
  - title: "Leases"
    url: https://kubernetes.io/docs/concepts/architecture/leases/
  - title: "Nodes"
    url: https://kubernetes.io/docs/concepts/architecture/nodes/
