id: kcna-1c-kubeadm-join-worker
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You ran `kubeadm init` on the first control plane node. Which command do you run on a new machine to add it to the cluster as a worker node?
body:
  options:
    - id: a
      text: { en: "`kubeadm upgrade node`" }
    - id: b
      text: { en: "`kubeadm token create`" }
    - id: c
      text: { en: "`kubeadm join`" }
    - id: d
      text: { en: "`kubectl uncordon`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubeadm join` bootstraps a worker node and joins it to the cluster. `kubeadm init` prints the full `kubeadm join` command, with the control plane address, a token and the CA certificate hash.
  options:
    a:
      en: |
        `kubeadm upgrade node` upgrades a node that is already part of the cluster during a version upgrade.
    b:
      en: |
        `kubeadm token create` only creates a bootstrap token; the machine is not added until `kubeadm join` runs on it.
    d:
      en: |
        `kubectl uncordon` makes an existing node schedulable again after maintenance. It cannot add a new machine.
references:
  - title: Kubeadm
    url: https://kubernetes.io/docs/reference/setup-tools/kubeadm/
  - title: Creating a cluster with kubeadm
    url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/
