id: kcna-1b-immutable-configmap
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The ConfigMap `pricing` was created with `immutable: true`. You now need to change one of its values.

    What must you do?
body:
  options:
    - id: a
      text: { en: "Set `immutable` to `false`, then edit the value" }
    - id: b
      text: { en: "Edit the value with `kubectl edit`; `immutable` only blocks deletion" }
    - id: c
      text: { en: "Scale the Pods that use it to zero, then edit the value" }
    - id: d
      text: { en: "Delete the ConfigMap and create it again with the new value" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Once a ConfigMap is marked immutable, its `data` and `binaryData` cannot change and the setting cannot be reverted. You delete and recreate the ConfigMap; recreating the Pods that mounted it is recommended. Immutability protects against accidental changes and reduces load on the kube-apiserver.
  options:
    a: { en: "Immutability cannot be reverted: `immutable: true` cannot be set back to `false`." }
    b: { en: "`immutable` blocks changes to the data, not deletion; an edit of the data is rejected." }
    c: { en: "Whether Pods use the ConfigMap does not matter; the data of an immutable ConfigMap can never be updated." }
references:
  - title: ConfigMaps
    url: https://kubernetes.io/docs/concepts/configuration/configmap/
