id: kcna-1d-user-namespaces
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container must run its process as root, but you want that root user to be an unprivileged user on the node. Which Pod setting provides this?
body:
  options:
    - id: a
      text: { en: "`shareProcessNamespace: true`" }
    - id: b
      text: { en: "`hostIPC: true`" }
    - id: c
      text: { en: "`privileged: true`" }
    - id: d
      text: { en: "`hostUsers: false`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `hostUsers: false` runs the Pod in a Linux user namespace, a feature stable since Kubernetes v1.36. Users in the container are mapped to different users on the host, so root inside the container is a non-root user on the node and its capabilities are valid only inside the namespace.
  options:
    a:
      en: |
        This shares one PID namespace between the containers of the Pod; it does not remap user IDs.
    b:
      en: |
        This shares the node's IPC namespace, which weakens isolation instead of strengthening it.
    c:
      en: |
        A privileged container gets all Linux capabilities on the node, the opposite of the goal.
references:
  - title: "User Namespaces"
    url: https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/
