id: kcna-1a-self-heal-replicas
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Deployment declares `replicas: 3`. The node that runs one of its Pods fails, and after that Pod is evicted only two Pods remain. What happens next, with no action from you?
body:
  options:
    - id: a
      text: { en: "The lost Pod is moved, with its name and IP address, to another healthy node" }
    - id: b
      text: { en: "The ReplicaSet controller sees two Pods instead of three and creates a replacement Pod" }
    - id: c
      text: { en: "Nothing changes until you run `kubectl apply` again with the same manifest" }
    - id: d
      text: { en: "The Deployment lowers its desired count to two replicas to match the cluster" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The desired state (`replicas: 3`) stays stored in the API. The ReplicaSet controller compares it with the current state, sees too few Pods and creates a new one, which the scheduler places on a healthy node. This reconciliation loop is the declarative model at work.
  options:
    a:
      en: |
        Pods are not moved: a new Pod, with a new name and IP address, replaces the lost one.
    c:
      en: |
        The desired state is already stored in the API; controllers keep reconciling it without new commands.
    d:
      en: |
        Controllers restore the desired state; they don't change `spec.replicas` to match reality.
references:
  - title: "Objects In Kubernetes"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
  - title: "ReplicaSet"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
