id: kcna-1c-limitrange-pvc
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Each PersistentVolumeClaim created in the `data` namespace must request at least 1Gi and at most 10Gi of storage. Which object enforces this rule for every claim?
body:
  options:
    - id: a
      text: { en: "A ResourceQuota with `requests.storage: 10Gi`" }
    - id: b
      text: { en: "A StorageClass with `allowVolumeExpansion: false`" }
    - id: c
      text: { en: "A LimitRange of `type: PersistentVolumeClaim`" }
    - id: d
      text: { en: "A PersistentVolume with a `capacity` of 10Gi" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A LimitRange can enforce a minimum and maximum storage request per PersistentVolumeClaim in a namespace. A claim outside the bounds is rejected at admission.
  options:
    a:
      en: |
        `requests.storage` in a ResourceQuota caps the total storage requested by all claims of the namespace, not the size of each claim.
    b:
      en: |
        `allowVolumeExpansion` controls whether claims can be resized later; it sets no minimum or maximum size.
    d:
      en: |
        A PersistentVolume is a piece of storage that a claim binds to; it does not validate the requests of claims.
references:
  - title: Limit Ranges
    url: https://kubernetes.io/docs/concepts/policy/limit-range/
