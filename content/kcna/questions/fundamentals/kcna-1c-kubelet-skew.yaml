id: kcna-1c-kubelet-skew
objective: "1.2.5"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    The kube-apiserver of a cluster runs v1.37. Which kubelet version is supported on a node of this cluster?
body:
  options:
    - id: a
      text: { en: "v1.32" }
    - id: b
      text: { en: "v1.33" }
    - id: c
      text: { en: "v1.34" }
    - id: d
      text: { en: "v1.38" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The kubelet must not be newer than kube-apiserver and may be up to three minor versions older. With kube-apiserver at 1.37, supported kubelets are 1.37, 1.36, 1.35 and 1.34.
  options:
    a:
      en: |
        1.32 is five minor versions older than the API server, beyond the three-version skew.
    b:
      en: |
        1.33 is four minor versions older than the API server, one too many.
    d:
      en: |
        A kubelet newer than kube-apiserver is never supported.
references:
  - title: Version Skew Policy
    url: https://kubernetes.io/releases/version-skew-policy/
