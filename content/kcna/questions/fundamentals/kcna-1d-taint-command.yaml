id: kcna-1d-taint-command
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Node `node-4` must accept new Pods only if they tolerate `dedicated=ml`. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl label nodes node-4 dedicated=ml`" }
    - id: b
      text: { en: "`kubectl annotate nodes node-4 dedicated=ml`" }
    - id: c
      text: { en: "`kubectl cordon node-4`" }
    - id: d
      text: { en: "`kubectl taint nodes node-4 dedicated=ml:NoSchedule`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kubectl taint` adds a taint in the form `key=value:effect`. With the `NoSchedule` effect, no new Pod is scheduled on `node-4` unless it has a toleration that matches `dedicated=ml`.
  options:
    a:
      en: |
        A label only describes the node; it attracts Pods that select it but repels nothing.
    b:
      en: |
        Annotations store non-identifying metadata; the scheduler does not use them to keep Pods away.
    c:
      en: |
        Cordoning marks the node unschedulable for ordinary new Pods, including those that tolerate `dedicated=ml`; it does not create a taint that a team can tolerate.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
