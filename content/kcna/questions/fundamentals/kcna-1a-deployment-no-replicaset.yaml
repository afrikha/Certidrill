id: kcna-1a-deployment-no-replicaset
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You apply a Deployment. `kubectl get deployment web` shows the object, and the API server answers normally, but no ReplicaSet and no Pod is ever created for it. Which control plane component is most likely not running?
body:
  options:
    - id: a
      text: { en: "kube-scheduler" }
    - id: b
      text: { en: "kube-controller-manager" }
    - id: c
      text: { en: "etcd" }
    - id: d
      text: { en: "kubelet" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Creating the ReplicaSet of a Deployment, and then its Pods, is the job of the Deployment and ReplicaSet controllers, which run inside kube-controller-manager. The object is stored, so the API server and etcd work; nothing reconciles it, which points to the controller manager.
  options:
    a:
      en: |
        Without a scheduler, Pods would still be created and would stay `Pending`; here no Pod object exists at all.
    c:
      en: |
        Without etcd, the API server could not have stored the Deployment, and it would not answer normally.
    d:
      en: |
        Kubelets run Pods that already exist and are bound to their nodes; they do not create ReplicaSets or Pod objects.
references:
  - title: "Controllers"
    url: https://kubernetes.io/docs/concepts/architecture/controller/
  - title: "Kubernetes Components"
    url: https://kubernetes.io/docs/concepts/overview/components/
