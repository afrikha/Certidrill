id: kcna-1b-unknown-field-strict
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manifest contains a typo: `replica` instead of `replicas`.

    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      replica: 3
      # selector and template omitted
    ```

    The selector and template are valid. You run `kubectl apply -f web.yaml` with default settings. What happens?
body:
  options:
    - id: a
      text: { en: "The Deployment is created with 3 replicas" }
    - id: b
      text: { en: "The Deployment is created, and the unknown field is silently ignored" }
    - id: c
      text: { en: "The request fails with an error about the unknown field" }
    - id: d
      text: { en: "The Deployment is created, and kubectl prints a warning" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Since v1.25 the API server detects unrecognized or duplicate fields. kubectl's default is `--validate=true`, which means `Strict`: a validation failure is an error, so the request fails and nothing is created.
  options:
    a: { en: "`replica` is not a field of the Deployment spec, so it cannot set the replica count." }
    b: { en: "Silently ignoring unknown fields is the `--validate=ignore` behavior, not the default." }
    d: { en: "Reporting the problem as a warning is the `--validate=warn` behavior; the default is strict." }
references:
  - title: Objects In Kubernetes
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
