id: kcna-1d-image-index-multiarch
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The same image reference `registry.example.com/shop/web:1.4.2` runs on both `amd64` and `arm64` nodes, and each node gets a build for its architecture. What makes this possible?
body:
  options:
    - id: a
      text: { en: "A separate tag that each node appends to the reference" }
    - id: b
      text: { en: "An image index that points to one manifest per platform" }
    - id: c
      text: { en: "A RuntimeClass that recompiles the image for the node" }
    - id: d
      text: { en: "A single layer that contains binaries for every architecture" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An OCI image index is a higher-level manifest that points to a list of manifests, for example one per architecture. The registry serves the index under one name, and the runtime pulls the manifest that matches the node's platform.
  options:
    a:
      en: |
        The reference is identical on every node; the node does not change it.
    c:
      en: |
        A RuntimeClass selects a runtime configuration; nothing recompiles images on the node.
    d:
      en: |
        Layers are per build; the selection happens at the manifest level, through the index.
references:
  - title: "image-spec/spec.md at main · opencontainers/image-spec"
    url: https://github.com/opencontainers/image-spec/blob/main/spec.md
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
