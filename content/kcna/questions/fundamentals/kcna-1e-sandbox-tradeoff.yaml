id: kcna-1e-sandbox-tradeoff
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    What is the main trade-off of running Pods with a sandboxed runtime such as gVisor or Kata Containers?
body:
  options:
    - id: a
      text: { en: "They can't run standard OCI images" }
    - id: b
      text: { en: "They give stronger isolation at the cost of extra overhead" }
    - id: c
      text: { en: "They remove the need for a CRI runtime on the node" }
    - id: d
      text: { en: "They prevent the Pods from using Services" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sandboxed runtimes add a layer between the workload and the host kernel, a user-space kernel for gVisor or a virtual machine for Kata Containers. This gives stronger isolation, but the extra layer uses more resources and can reduce performance, which is why Kubernetes lets you declare a RuntimeClass overhead.
  options:
    a:
      en: |
        Both run ordinary OCI images: gVisor through its OCI runtime `runsc`, Kata Containers through its runtime for containerd or CRI-O.
    c:
      en: |
        The kubelet still talks to a CRI runtime such as containerd or CRI-O, which calls the sandboxed runtime through a RuntimeClass handler.
    d:
      en: |
        Sandboxed Pods keep normal Pod networking, so they can be selected by Services like any other Pod.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
  - title: "Pod Overhead"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-overhead/
