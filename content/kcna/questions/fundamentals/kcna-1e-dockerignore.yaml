id: kcna-1e-dockerignore
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the purpose of a `.dockerignore` file?
body:
  options:
    - id: a
      text: { en: "To exclude files from the build context sent to the builder" }
    - id: b
      text: { en: "To list registries that the builder must never pull from" }
    - id: c
      text: { en: "To prevent the running container from reading some files" }
    - id: d
      text: { en: "To skip some Dockerfile instructions during a rebuild" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `.dockerignore` uses patterns similar to `.gitignore` to exclude files from the build context, such as `.git`, local dependencies or secrets. Excluded files can't be copied into the image by mistake, and the build sends less data to the builder.
  options:
    b:
      en: |
        `.dockerignore` lists files and directories of the build context, not registries.
    c:
      en: |
        `.dockerignore` acts at build time. Run-time file access is controlled by the image content, users and permissions, not by this file.
    d:
      en: |
        Every instruction of the Dockerfile still runs or comes from the cache. `.dockerignore` only filters the files available to `COPY` and `ADD`.
references:
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
