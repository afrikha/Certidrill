id: kcna-1d-selector-terms-or
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Pod has the following required node affinity. Which nodes are eligible for it?

    ```yaml
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["zone-a"]
      - matchExpressions:
        - key: disktype
          operator: In
          values: ["ssd"]
    ```
body:
  options:
    - id: a
      text: { en: "Only nodes that are in `zone-a` and have the label `disktype=ssd`" }
    - id: b
      text: { en: "Only nodes in `zone-a`; the second term is a preference" }
    - id: c
      text: { en: "Nodes that are in `zone-a` or have the label `disktype=ssd`" }
    - id: d
      text: { en: "No node, because a Pod can have only one entry in `nodeSelectorTerms`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The manifest has two entries under `nodeSelectorTerms`, and terms are ORed: a node needs to satisfy only one of them. A node in `zone-b` labeled `disktype=ssd` is therefore eligible. Expressions inside one `matchExpressions` list, by contrast, are ANDed.
  options:
    a:
      en: |
        That would be the result of two expressions in the same `matchExpressions` list, which are ANDed. Here they are in two separate terms.
    b:
      en: |
        Both terms belong to the required rule; preferences are written under `preferredDuringSchedulingIgnoredDuringExecution`.
    d:
      en: |
        `nodeSelectorTerms` is a list and accepts several terms; the manifest is valid.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
