id: kcna-1c-pending-retry-new-node
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod is Pending because no node has enough free memory for its request. An administrator then adds a node with plenty of memory. What happens to the Pod?
body:
  options:
    - id: a
      text: { en: "It must be deleted and re-created to be scheduled" }
    - id: b
      text: { en: "kube-scheduler must be restarted to see the new node" }
    - id: c
      text: { en: "The scheduler retries and can bind it to the new node" }
    - id: d
      text: { en: "It stays Pending; Pending Pods are never retried" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An unschedulable Pod remains unscheduled until the scheduler is able to place it: the scheduler keeps it in its queue and retries when the cluster changes. The new node passes filtering, so the Pod is bound to it.
  options:
    a:
      en: |
        No re-creation is needed; the same Pod object is scheduled once a feasible node exists.
    b:
      en: |
        kube-scheduler watches the API server and sees new nodes without a restart.
    d:
      en: |
        Pending Pods are retried; a node with free capacity lets them be scheduled.
references:
  - title: Kubernetes Scheduler
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
