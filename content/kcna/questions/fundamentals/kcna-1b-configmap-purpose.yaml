id: kcna-1b-configmap-purpose
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team wants to store an application's log level and feature flags in the cluster as key-value pairs. None of these values is sensitive.

    Which Kubernetes object is designed for this data?
body:
  options:
    - id: a
      text: { en: "ConfigMap" }
    - id: b
      text: { en: "Secret" }
    - id: c
      text: { en: "PersistentVolumeClaim" }
    - id: d
      text: { en: "ServiceAccount" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A ConfigMap stores non-confidential data as key-value pairs that Pods consume as environment variables, command arguments or files. It keeps environment-specific settings out of the image, so one image runs everywhere.
  options:
    b: { en: "A Secret is meant for confidential data such as passwords, tokens and keys. For non-sensitive settings, a ConfigMap is the intended object." }
    c: { en: "A PersistentVolumeClaim requests persistent storage for a Pod; it does not hold configuration key-value pairs." }
    d: { en: "A ServiceAccount gives Pods an identity to call the Kubernetes API; it stores no application settings." }
references:
  - title: ConfigMaps
    url: https://kubernetes.io/docs/concepts/configuration/configmap/
