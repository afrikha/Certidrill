id: kcna-1e-build-without-docker-sock
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI Pod builds images by mounting `/var/run/docker.sock` from its node. The nodes now run containerd, and Docker Engine must not be installed on them. Which tool can build the images without a Docker daemon?
body:
  options:
    - id: a
      text: { en: "`crictl`" }
    - id: b
      text: { en: "runc" }
    - id: c
      text: { en: "Buildah" }
    - id: d
      text: { en: "CRI-O" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Workloads that mount `docker.sock` depend on Docker Engine being on the node, so they break on containerd nodes. Buildah builds OCI images without a Docker daemon, so it can run in the CI Pod instead.
  options:
    a:
      en: |
        `crictl` inspects and debugs CRI runtimes. It doesn't build images.
    b:
      en: |
        runc creates container processes from an unpacked image. It doesn't build images.
    d:
      en: |
        CRI-O is a CRI runtime that runs Pods for the kubelet. It doesn't provide an image build service to workloads.
references:
  - title: "Updated: Dockershim Removal FAQ"
    url: https://kubernetes.io/blog/2022/02/17/dockershim-faq/
