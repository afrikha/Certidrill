id: kcna-1a-apiserver-only-etcd-client
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    According to the Kubernetes documentation, which component should be the only one with direct access to etcd?
body:
  options:
    - id: a
      text: { en: "kube-scheduler" }
    - id: b
      text: { en: "kube-apiserver" }
    - id: c
      text: { en: "kube-controller-manager" }
    - id: d
      text: { en: "kubelet" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Access to etcd is equivalent to root permission in the cluster, so ideally only the API server has access to it, enforced with firewall rules or etcd's TLS client authentication. Every other component and client goes through kube-apiserver.
  options:
    a:
      en: |
        kube-scheduler reads Pods and nodes and records its bindings through the API server, never through etcd.
    c:
      en: |
        Controllers watch and change objects through the API server; they do not connect to etcd.
    d:
      en: |
        The kubelet talks to the API server and to its local container runtime, not to etcd.
references:
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
  - title: "Communication between Nodes and the Control Plane"
    url: https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/
