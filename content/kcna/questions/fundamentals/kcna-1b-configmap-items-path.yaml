id: kcna-1b-configmap-items-path
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Pod mounts the ConfigMap `log-config` with the following configuration.

    ```yaml
    volumes:
    - name: config-vol
      configMap:
        name: log-config
        items:
        - key: log_level
          path: log_level.conf
    containers:
    - name: app
      image: busybox:1.36
      volumeMounts:
      - name: config-vol
        mountPath: /etc/config
    ```

    At which path does the container find the value of the key `log_level`?
body:
  options:
    - id: a
      text: { en: "`/etc/config/log_level`" }
    - id: b
      text: { en: "`/etc/config/log-config/log_level.conf`" }
    - id: c
      text: { en: "`/etc/config/log_level/log_level.conf`" }
    - id: d
      text: { en: "`/etc/config/log_level.conf`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `items` maps a key to a `path` relative to the volume's `mountPath`. The content of `log_level` is therefore mounted at `/etc/config/log_level.conf`. ConfigMap volumes are always mounted read-only.
  options:
    a: { en: "A file named after the key is what you get without `items`; here `path` renames it to `log_level.conf`." }
    b: { en: "The ConfigMap name does not become a directory; the path is the `mountPath` plus the item's `path`." }
    c: { en: "The key name does not become a directory; `path` is placed directly under the `mountPath`." }
references:
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
