id: kcna-1c-limitrange-default-conflict
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The `dev` namespace contains this LimitRange. A developer creates a Pod whose container sets `requests.cpu: 700m` and no CPU limit.

    ```yaml
    apiVersion: v1
    kind: LimitRange
    metadata:
      name: cpu-resource-constraint
    spec:
      limits:
      - type: Container
        default:
          cpu: 500m
        defaultRequest:
          cpu: 500m
        max:
          cpu: "1"
    ```

    What happens?
body:
  options:
    - id: a
      text: { en: "The Pod is rejected: the default limit is lower than its request" }
    - id: b
      text: { en: "The Pod is created with a 700m request and a 1 CPU limit" }
    - id: c
      text: { en: "The Pod is created with a 500m limit and is throttled" }
    - id: d
      text: { en: "The Pod is created with its request lowered to 500m" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The LimitRange injects its default limit of 500m because the container sets none. A LimitRange does not check that its defaults are consistent with what the user set: the request of 700m is now above the limit of 500m, so the Pod is invalid and rejected. Setting both the request and the limit avoids the conflict.
  options:
    b:
      en: |
        `max` is a bound, not a default: the injected limit comes from `default` (500m).
    c:
      en: |
        A request higher than the limit is invalid, so the Pod is never created and nothing runs.
    d:
      en: |
        A LimitRange never lowers a value that the user set; it only fills in missing values.
references:
  - title: Limit Ranges
    url: https://kubernetes.io/docs/concepts/policy/limit-range/
