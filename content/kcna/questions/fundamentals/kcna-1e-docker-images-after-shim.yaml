id: kcna-1e-docker-images-after-shim
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's images are built with `docker build`. Its cluster nodes now use containerd instead of Docker Engine. What happens to these images?
body:
  options:
    - id: a
      text: { en: "They must be rebuilt with a CRI-compatible builder" }
    - id: b
      text: { en: "They run unchanged, because they are OCI images" }
    - id: c
      text: { en: "They run only if each node also has the `cri-dockerd` adapter" }
    - id: d
      text: { en: "They must be converted with `crictl` before the first pull" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Images produced by `docker build` follow the OCI image format, so they work with every CRI runtime, including containerd and CRI-O. The dockershim removal changed the node runtime, not the image format, and private images still use the same pull secrets.
  options:
    a:
      en: |
        No rebuild is needed: the image format is the same OCI format whatever the tool that built it.
    c:
      en: |
        `cri-dockerd` is only needed to keep Docker Engine as the node runtime. containerd pulls and runs these images directly.
    d:
      en: |
        `crictl` inspects and debugs a CRI runtime on a node. Images need no conversion, and `crictl` doesn't convert images.
references:
  - title: "Updated: Dockershim Removal FAQ"
    url: https://kubernetes.io/blog/2022/02/17/dockershim-faq/
