id: kcna-1a-kubelet-watches-bound-pods
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    kube-scheduler has just bound a new Pod to the node `worker-2`. How does the kubelet on `worker-2` learn that it must start this Pod?
body:
  options:
    - id: a
      text: { en: "kube-scheduler connects to the kubelet and sends it the Pod spec" }
    - id: b
      text: { en: "etcd pushes the new Pod spec to the node that it is bound to" }
    - id: c
      text: { en: "It watches the API server for Pods that are assigned to its node" }
    - id: d
      text: { en: "kube-controller-manager copies the Pod into the node's static Pod folder" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes components coordinate through the API server rather than calling each other. The scheduler binds the Pod to a node; the kubelet of that node, which gets its Pod specs primarily from the API server, sees the new Pod, asks the container runtime to start its containers and reports the status back.
  options:
    a:
      en: |
        The scheduler only records the binding through the API server; it never contacts kubelets.
    b:
      en: |
        Only the API server accesses etcd, and etcd never contacts nodes.
    d:
      en: |
        That folder holds static Pod manifests written by an administrator or a tool such as kubeadm.
references:
  - title: "kubelet"
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
  - title: "Kubernetes Scheduler"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
