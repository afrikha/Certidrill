id: kcna-1a-deployment-stateless-web
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team runs a stateless web API as five identical replicas and wants rolling updates and easy rollback. Which workload resource should it use?
body:
  options:
    - id: a
      text: { en: "StatefulSet" }
    - id: b
      text: { en: "DaemonSet" }
    - id: c
      text: { en: "Job" }
    - id: d
      text: { en: "Deployment" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Deployment manages identical, interchangeable Pods for a stateless application. It creates ReplicaSets, rolls out changes to the Pod template gradually and can roll back to an earlier revision.
  options:
    a:
      en: |
        A StatefulSet gives each Pod a stable identity and its own storage, which a stateless API doesn't need.
    b:
      en: |
        A DaemonSet runs one Pod per node, not a chosen number of replicas.
    c:
      en: |
        A Job runs Pods until they complete; a web API must keep running.
references:
  - title: "Deployments"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
