id: kcna-1c-patch-cadence
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How often are patch releases, such as 1.37.1 followed by 1.37.2, typically published for a maintained minor version?
body:
  options:
    - id: a
      text: { en: "Every week" }
    - id: b
      text: { en: "Every four months, with each minor release" }
    - id: c
      text: { en: "About once a month" }
    - id: d
      text: { en: "Once a year" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The typical patch release cadence is monthly. The first patch releases after a new minor release often come a bit faster, and critical fixes can trigger an out-of-band release.
  options:
    a:
      en: |
        Weekly is not the normal cadence; patch releases are usually monthly.
    b:
      en: |
        About three minor releases ship per year, but patch releases come much more often than minor ones.
    d:
      en: |
        A yearly patch would leave bugs and vulnerabilities unfixed for too long; patches are typically monthly.
references:
  - title: Patch Releases
    url: https://kubernetes.io/releases/patch-releases/
