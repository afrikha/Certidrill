id: kcna-1c-quota-pods-exceeded
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `team-a` namespace contains this quota and already runs 10 Pods. You create an 11th Pod in the namespace.

    ```yaml
    apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: pod-count
      namespace: team-a
    spec:
      hard:
        pods: "10"
    ```

    What happens?
body:
  options:
    - id: a
      text: { en: "The Pod is created and stays Pending until another Pod ends" }
    - id: b
      text: { en: "The API server rejects the request with 403 Forbidden" }
    - id: c
      text: { en: "The oldest Pod in the namespace is evicted to make room" }
    - id: d
      text: { en: "The Pod is created and a warning event is recorded" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Quotas are enforced at admission. When creating a resource would violate a quota, the control plane rejects the request with HTTP status 403 Forbidden and a message naming the exceeded constraint; nothing is created.
  options:
    a:
      en: |
        A quota violation is not a scheduling problem: the Pod is never created, so it cannot wait in Pending.
    c:
      en: |
        A quota never evicts running Pods; it only refuses new requests.
    d:
      en: |
        A quota is a hard limit, not a warning: the request fails.
references:
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
