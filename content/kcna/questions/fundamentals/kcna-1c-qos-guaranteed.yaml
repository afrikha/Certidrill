id: kcna-1c-qos-guaranteed
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod has a single container with these resources. Which QoS class does it get?

    ```yaml
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ```
body:
  options:
    - id: a
      text: { en: "Guaranteed" }
    - id: b
      text: { en: "Burstable" }
    - id: c
      text: { en: "BestEffort" }
    - id: d
      text: { en: "`system-node-critical`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Pod is Guaranteed when every container has CPU and memory requests and limits, and each request equals its limit. This single container meets both conditions, so the Pod is evicted last under node pressure.
  options:
    b:
      en: |
        Burstable is for Pods that set some requests or limits without meeting the Guaranteed conditions.
    c:
      en: |
        BestEffort is for Pods that set no CPU or memory request or limit at all.
    d:
      en: |
        `system-node-critical` is a built-in PriorityClass, not a QoS class.
references:
  - title: Pod Quality of Service Classes
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/
