id: kcna-1c-pod-network-cidr
objective: "1.2.4"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You bootstrap a cluster with kubeadm on servers whose network is `10.0.0.0/16`, and no other network is in use. Which Pod network range can you configure for the Pod network add-on?
body:
  options:
    - id: a
      text: { en: "`10.0.0.0/16`" }
    - id: b
      text: { en: "`10.0.128.0/17`" }
    - id: c
      text: { en: "`192.168.0.0/16`" }
    - id: d
      text: { en: "`10.0.5.0/24`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Pod network must not overlap with any of the host networks. `192.168.0.0/16` is outside `10.0.0.0/16`, so Pod addresses cannot collide with node addresses.
  options:
    a:
      en: |
        This is exactly the host network, so Pod and node addresses would collide.
    b:
      en: |
        `10.0.128.0/17` is the upper half of `10.0.0.0/16`, so it overlaps the host network.
    d:
      en: |
        `10.0.5.0/24` lies inside `10.0.0.0/16`, so it overlaps the host network.
references:
  - title: Creating a cluster with kubeadm
    url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/
