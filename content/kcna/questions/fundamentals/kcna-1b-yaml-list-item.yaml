id: kcna-1b-yaml-list-item
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod manifest contains the following snippet.

    ```yaml
    spec:
      containers:
      - name: web
        image: nginx:1.27
      - name: log-shipper
        image: busybox:1.36
    ```

    What do the two entries that start with `-` define?
body:
  options:
    - id: a
      text: { en: "Two Pods, each with one container" }
    - id: b
      text: { en: "Two items of the `containers` list: the Pod runs two containers" }
    - id: c
      text: { en: "One container, with `busybox:1.36` as a fallback image" }
    - id: d
      text: { en: "One active container; the second entry is commented out" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In YAML, `-` starts an item of a list. `containers` is a list, so this Pod has two containers, `web` and `log-shipper`, which share the Pod's network and can share volumes.
  options:
    a: { en: "The snippet is the `spec` of one Pod; a second Pod would need its own object with `apiVersion`, `kind` and `metadata`." }
    c: { en: "Kubernetes has no fallback image: each list item is a separate container with its own image." }
    d: { en: "Comments in YAML start with `#`; `-` marks a list item." }
references:
  - title: Objects In Kubernetes
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
