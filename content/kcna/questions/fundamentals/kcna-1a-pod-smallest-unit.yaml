id: kcna-1a-pod-smallest-unit
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the smallest deployable unit of computing that you can create and manage in Kubernetes?
body:
  options:
    - id: a
      text: { en: "Container" }
    - id: b
      text: { en: "Deployment" }
    - id: c
      text: { en: "Pod" }
    - id: d
      text: { en: "Node" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Pod is a group of one or more containers with shared storage and network resources and a specification for how to run them. It is the smallest deployable unit in Kubernetes; you usually create Pods through workload resources.
  options:
    a:
      en: |
        Kubernetes doesn't schedule bare containers: containers always run inside a Pod.
    b:
      en: |
        A Deployment is a higher-level resource that manages Pods through ReplicaSets.
    d:
      en: |
        A node is a machine that runs Pods; you don't deploy it as a workload.
references:
  - title: "Pods"
    url: https://kubernetes.io/docs/concepts/workloads/pods/
