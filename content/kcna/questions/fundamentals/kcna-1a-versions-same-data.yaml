id: kcna-1a-versions-same-data
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An API serves both the `v1beta1` and the `v1` versions of a resource. You created an object through `v1beta1`. Which statement is correct?
body:
  options:
    - id: a
      text: { en: "The object is visible only through `v1beta1` until you delete it and create it again with `v1`" }
    - id: b
      text: { en: "You can read and update the object through either version, because the API server converts between them" }
    - id: c
      text: { en: "The API server keeps two separate copies of the object, one for each version that it serves" }
    - id: d
      text: { en: "The object is deleted automatically when the `v1` version of the API becomes available" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes versions its API at the API level, and the API server handles the conversion between versions transparently: all versions are representations of the same persisted data. An object created through `v1beta1` can be read, updated or deleted through `v1beta1` or `v1` until `v1beta1` is removed.
  options:
    a:
      en: |
        All served versions are representations of the same persisted data, so `v1` shows the object too.
    c:
      en: |
        The object is stored once; the versions are views of that data.
    d:
      en: |
        A new version doesn't touch existing objects; only the removal of `v1beta1` ends access through that version.
references:
  - title: "The Kubernetes API"
    url: https://kubernetes.io/docs/concepts/overview/kubernetes-api/
