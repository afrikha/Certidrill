id: kcna-1c-cordon-effect
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You run `kubectl cordon node-2`. What happens?
body:
  options:
    - id: a
      text: { en: "The node is marked unschedulable and its Pods keep running" }
    - id: b
      text: { en: "All Pods on the node are evicted, except DaemonSet Pods" }
    - id: c
      text: { en: "The Node object is deleted from the cluster" }
    - id: d
      text: { en: "The kubelet on the node is stopped" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Cordoning marks the node unschedulable: the scheduler places no new Pods on it, but the Pods already there are not affected. It is a preparatory step before a reboot or other maintenance; `kubectl uncordon` reverses it.
  options:
    b:
      en: |
        Evicting the Pods is what `kubectl drain` does after cordoning the node.
    c:
      en: |
        Cordon only changes the node's schedulability; `kubectl delete node` would remove the Node object.
    d:
      en: |
        Cordon does not touch the kubelet; the node keeps running its Pods.
references:
  - title: Nodes
    url: https://kubernetes.io/docs/concepts/architecture/nodes/
  - title: Safely Drain a Node
    url: https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
