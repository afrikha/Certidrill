id: kcna-1e-no-runtimeclassname
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster has one RuntimeClass, named `gvisor`. A developer creates a Pod that doesn't set `runtimeClassName`. How does the Pod run?
body:
  options:
    - id: a
      text: { en: "With the `gvisor` RuntimeClass, because it is the only one" }
    - id: b
      text: { en: "It stays Pending until a RuntimeClass is set on it" }
    - id: c
      text: { en: "With the default runtime handler of the node" }
    - id: d
      text: { en: "It is rejected by admission control" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When `runtimeClassName` is omitted, the Pod uses the node's default runtime handler, as if RuntimeClass didn't exist. RuntimeClasses apply only to the Pods that reference them by name.
  options:
    a:
      en: |
        A RuntimeClass is never applied automatically, even when it is the only one. The Pod must reference it.
    b:
      en: |
        `runtimeClassName` is optional. A Pod without it is scheduled and started normally.
    d:
      en: |
        No admission rule requires `runtimeClassName`. The Pod is accepted and uses the default handler.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
