id: kcna-1d-ignored-during-execution
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod uses `requiredDuringSchedulingIgnoredDuringExecution` node affinity. What does the `IgnoredDuringExecution` part mean?
body:
  options:
    - id: a
      text: { en: "If the node runs out of memory, the rule is ignored and the Pod moves" }
    - id: b
      text: { en: "The rule is checked only while the Pod is running, not at scheduling" }
    - id: c
      text: { en: "If the node's labels change after scheduling, the running Pod keeps running" }
    - id: d
      text: { en: "The scheduler may ignore the rule when no node matches it" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `IgnoredDuringExecution` means the rule is evaluated only when the Pod is scheduled. If the node's labels change later so that the rule no longer matches, the Pod continues to run on that node.
  options:
    a:
      en: |
        The rule has nothing to do with node pressure, and Kubernetes never moves a running Pod: an evicted Pod is replaced by a new one.
    b:
      en: |
        It is the opposite: the rule is checked at scheduling time and not re-evaluated while the Pod runs.
    d:
      en: |
        That describes the `preferred...` form. With the `required...` form, a Pod that matches no node stays `Pending`.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
