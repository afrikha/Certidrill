id: kcna-1c-maintained-branches
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    For how many minor releases does the Kubernetes project maintain release branches at the same time?
body:
  options:
    - id: a
      text: { en: "Only the most recent one" }
    - id: b
      text: { en: "The three most recent ones" }
    - id: c
      text: { en: "The five most recent ones" }
    - id: d
      text: { en: "Every minor release since 1.0" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The project maintains release branches for the three most recent minor releases, for example 1.37, 1.36 and 1.35. Older minor versions no longer receive patch releases, so clusters must be upgraded to stay supported.
  options:
    a:
      en: |
        The previous two minor releases are also maintained and receive patch releases.
    c:
      en: |
        Only three minor releases are maintained, not five.
    d:
      en: |
        Old minor versions reach end of life and receive no more fixes.
references:
  - title: Releases
    url: https://kubernetes.io/releases/
  - title: Version Skew Policy
    url: https://kubernetes.io/releases/version-skew-policy/
