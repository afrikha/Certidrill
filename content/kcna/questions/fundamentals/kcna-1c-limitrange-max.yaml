id: kcna-1c-limitrange-max
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `dev` namespace contains this LimitRange. A developer creates a Pod whose container sets `limits.cpu: "2"`.

    ```yaml
    apiVersion: v1
    kind: LimitRange
    metadata:
      name: cpu-bounds
      namespace: dev
    spec:
      limits:
      - type: Container
        max:
          cpu: "1"
        min:
          cpu: 100m
    ```

    What happens?
body:
  options:
    - id: a
      text: { en: "The Pod is created and its limit is lowered to 1 CPU" }
    - id: b
      text: { en: "The API server rejects the Pod with 403 Forbidden" }
    - id: c
      text: { en: "The Pod is created and throttled at 1 CPU" }
    - id: d
      text: { en: "The Pod is created and stays Pending" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A LimitRange validates each container at admission. A limit of 2 CPUs exceeds the `max` of 1 CPU, so the API server rejects the request with HTTP 403 Forbidden and explains the violated constraint.
  options:
    a:
      en: |
        A LimitRange injects defaults only for missing values; it never rewrites a value the user set.
    c:
      en: |
        The Pod is never created, so nothing runs or gets throttled.
    d:
      en: |
        The rejection happens at admission, before any scheduling: no Pod object exists to stay Pending.
references:
  - title: Limit Ranges
    url: https://kubernetes.io/docs/concepts/policy/limit-range/
