id: kcna-1e-crictl-node-debug
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator logs in to a node that runs containerd. The `docker` command isn't installed. Which tool lists the Pods and containers directly from the node's CRI runtime?
body:
  options:
    - id: a
      text: { en: "`kubectl`" }
    - id: b
      text: { en: "`crictl`" }
    - id: c
      text: { en: "`kubeadm`" }
    - id: d
      text: { en: "`cri-dockerd`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `crictl` is a command-line client for CRI-compatible runtimes, used to inspect and debug the runtime and the containers on a node. `crictl pods`, `crictl ps` and `crictl logs` replace the Docker commands that administrators used on nodes.
  options:
    a:
      en: |
        `kubectl` reads Pods from the API server, not from the node's runtime. It doesn't show what the runtime itself reports on that node.
    c:
      en: |
        `kubeadm` bootstraps and upgrades clusters. It doesn't list the containers of a runtime.
    d:
      en: |
        `cri-dockerd` is an adapter that lets the kubelet use Docker Engine. It isn't a client tool, and the node runs containerd.
references:
  - title: "Debugging Kubernetes nodes with crictl"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/
