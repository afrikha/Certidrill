id: kcna-1d-toleration-seconds
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A running Pod has the following toleration. A taint `maintenance=true:NoExecute` is then added to its node and never removed. What happens to the Pod?

    ```yaml
    tolerations:
    - key: maintenance
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 3600
    ```
body:
  options:
    - id: a
      text: { en: "It is evicted immediately" }
    - id: b
      text: { en: "It keeps running for 3,600 seconds, then it is evicted" }
    - id: c
      text: { en: "It keeps running indefinitely" }
    - id: d
      text: { en: "It is restarted on the same node after 3,600 seconds" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For a `NoExecute` taint, `tolerationSeconds` sets how long a tolerating Pod stays bound to the node after the taint is added. After 3,600 seconds the Pod is evicted, unless the taint is removed before then.
  options:
    a:
      en: |
        Immediate eviction applies to Pods that do not tolerate the taint; this Pod tolerates it for a limited time.
    c:
      en: |
        A Pod stays bound forever only when its toleration has no `tolerationSeconds`.
    d:
      en: |
        Kubernetes does not restart a Pod in place when the time is up; the Pod is evicted from the node.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
