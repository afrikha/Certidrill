id: kcna-1c-quota-lowered
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator lowers the `requests.memory` hard limit of the quota of `team-a` below the memory that the namespace's running Pods already request. What happens to those running Pods?
body:
  options:
    - id: a
      text: { en: "They are evicted, lowest priority first, until usage fits" }
    - id: b
      text: { en: "They are restarted with smaller memory requests" }
    - id: c
      text: { en: "They keep running; the new limit applies to new requests" }
    - id: d
      text: { en: "The namespace becomes read-only until usage fits" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Changes to a quota do not affect resources that already exist. The running Pods keep running; requests to create or update resources are checked against the new limit, so new Pods are rejected until usage falls below it.
  options:
    a:
      en: |
        A ResourceQuota never evicts Pods; eviction comes from node pressure or explicit actions.
    b:
      en: |
        A quota does not modify the resources of existing Pods.
    d:
      en: |
        There is no read-only mode: only requests that would exceed the quota are rejected.
references:
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
