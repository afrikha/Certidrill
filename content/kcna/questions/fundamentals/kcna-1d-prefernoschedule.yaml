id: kcna-1d-prefernoschedule
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A node has the taint `spot=true:PreferNoSchedule`. How does the scheduler treat Pods that do not tolerate it?
body:
  options:
    - id: a
      text: { en: "It tries to avoid the node, but may still place them there" }
    - id: b
      text: { en: "It never places them on the node" }
    - id: c
      text: { en: "It evicts them if they already run on the node" }
    - id: d
      text: { en: "It ignores the taint, which only affects Pods that tolerate it" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `PreferNoSchedule` is the soft version of `NoSchedule`. The control plane tries not to place a non-tolerating Pod on the node, but this is not guaranteed if no better node is available.
  options:
    b:
      en: |
        That is the `NoSchedule` effect, a hard rule for new Pods.
    c:
      en: |
        Eviction of running Pods is the `NoExecute` effect.
    d:
      en: |
        The taint does affect non-tolerating Pods: it lowers the node's preference for them.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
