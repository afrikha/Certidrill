id: kcna-1b-crd-schema-validation
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A CustomResourceDefinition for the kind `Cache` contains the following schema.

    ```yaml
    openAPIV3Schema:
      type: object
      properties:
        spec:
          type: object
          properties:
            replicas:
              type: integer
              maximum: 10
    ```

    A user applies a `Cache` object with `spec.replicas: 15`. What happens?
body:
  options:
    - id: a
      text: { en: "The API server rejects the object with a validation error" }
    - id: b
      text: { en: "The object is stored; its controller later sets replicas to 10" }
    - id: c
      text: { en: "The object is stored without `replicas`, which is pruned" }
    - id: d
      text: { en: "The object is stored, and kubectl only prints a warning" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The kube-apiserver validates custom objects against the CRD's OpenAPI v3 schema. A value that violates a declared constraint, here `maximum: 10`, is rejected with an error and nothing is stored.
  options:
    b: { en: "Validation happens at the API server before storage; an invalid object never reaches a controller." }
    c: { en: "Pruning removes fields that are not declared in the schema. `replicas` is declared, so an invalid value is rejected, not pruned." }
    d: { en: "A schema violation is an error, not a warning: the request fails." }
references:
  - title: Extend the Kubernetes API with CustomResourceDefinitions
    url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
