id: kcna-1d-multiple-taints
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Node `n2` has three taints: `a=1:NoSchedule`, `b=1:NoExecute` and `c=1:NoSchedule`. Pod `p1`, already running on `n2`, tolerates `a=1:NoSchedule` and `b=1:NoExecute` only. What is the effect on `p1`?
body:
  options:
    - id: a
      text: { en: "It is evicted because it does not tolerate every taint of the node" }
    - id: b
      text: { en: "It keeps running, and a new Pod with the same tolerations could be scheduled on `n2`" }
    - id: c
      text: { en: "It is evicted after 300 seconds because of the untolerated taint" }
    - id: d
      text: { en: "It keeps running, but a new Pod with the same tolerations could not be scheduled on `n2`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Kubernetes ignores the taints a Pod tolerates and applies the effects of the rest. The only untolerated taint is `c=1:NoSchedule`: it prevents new Pods with these tolerations from being scheduled on `n2`, but it does not evict `p1`, which is already running.
  options:
    a:
      en: |
        Only an untolerated `NoExecute` taint evicts running Pods; the untolerated taint `c` has the `NoSchedule` effect.
    b:
      en: |
        The untolerated `NoSchedule` taint `c` blocks the scheduling of any new Pod with these tolerations.
    c:
      en: |
        The 300-second default applies only to the built-in `not-ready` and `unreachable` taints, which are not involved here.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
