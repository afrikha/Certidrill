id: kcna-1c-score-tie
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Two feasible nodes get exactly the same highest score for a Pod. What does kube-scheduler do?
body:
  options:
    - id: a
      text: { en: "Leaves the Pod Pending until the scores differ" }
    - id: b
      text: { en: "Splits the Pod's containers across both nodes" }
    - id: c
      text: { en: "Chooses the node that joined the cluster first" }
    - id: d
      text: { en: "Chooses one of the two nodes at random" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When more than one node has the same top score, kube-scheduler selects one of them at random and binds the Pod to it.
  options:
    a:
      en: |
        A tie is not a failure: both nodes are feasible, so the Pod is scheduled right away.
    b:
      en: |
        All containers of a Pod always run on the same node.
    c:
      en: |
        Node age is not a tie-breaker; the choice among equal scores is random.
references:
  - title: Kubernetes Scheduler
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
