id: kcna-1c-limit-only-request
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container sets only limits, and no LimitRange exists in the namespace:

    ```yaml
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
    ```

    Which requests does Kubernetes use for this container?
body:
  options:
    - id: a
      text: { en: "None: the scheduler counts the requests as zero" }
    - id: b
      text: { en: "Half of each limit: 250m CPU and 128Mi" }
    - id: c
      text: { en: "The cluster default: 100m CPU and 64Mi" }
    - id: d
      text: { en: "The same as the limits: 500m CPU and 256Mi" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      If you set a limit but no request, and no admission mechanism applies a default request, Kubernetes copies the limit and uses it as the request. The scheduler therefore reserves 500m CPU and 256Mi for this container.
  options:
    a:
      en: |
        Requests are not left empty here: the limits are copied into them.
    b:
      en: |
        Kubernetes copies the limit as it is; it never derives a fraction of it.
    c:
      en: |
        There is no built-in cluster default request; defaults come only from a LimitRange or from copying the limit.
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  - title: Configure Quality of Service for Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/quality-service-pod/
