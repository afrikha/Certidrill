id: kcna-1b-explain-recursive
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Pod manifest and want to see, in one output, all the nested fields of the Pod spec with their types.

    Which command do you use?
body:
  options:
    - id: a
      text: { en: "`kubectl get pods -o yaml`" }
    - id: b
      text: { en: "`kubectl describe pods`" }
    - id: c
      text: { en: "`kubectl api-resources -o wide`" }
    - id: d
      text: { en: "`kubectl explain pods.spec -R`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kubectl explain` with `-R` (`--recursive`) prints the fields of fields, so you see the whole structure under `pods.spec` at once; `--max-depth` can limit the depth. Without it, only one level is shown.
  options:
    a: { en: "`kubectl get pods -o yaml` shows existing Pods with the fields that are set, not every field the schema allows." }
    b: { en: "`kubectl describe pods` shows the state and events of existing Pods, not the schema." }
    c: { en: "`kubectl api-resources -o wide` lists resource types with extra columns such as verbs, not the fields of a type." }
references:
  - title: kubectl explain
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_explain/
