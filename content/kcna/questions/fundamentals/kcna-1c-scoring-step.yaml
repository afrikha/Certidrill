id: kcna-1c-scoring-step
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After filtering, three nodes are feasible for a new Pod. What does kube-scheduler do next?
body:
  options:
    - id: a
      text: { en: "Starts the Pod on all three nodes and keeps the fastest" }
    - id: b
      text: { en: "Picks the first node in alphabetical order" }
    - id: c
      text: { en: "Gives each node a score and picks the highest" }
    - id: d
      text: { en: "Rotates through the three nodes in round-robin order" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the scoring step, kube-scheduler ranks every node that survived filtering according to its active scoring rules, such as balanced resource use or images already present. It then picks the node with the highest score.
  options:
    a:
      en: |
        A Pod runs on exactly one node; the scheduler never starts copies to compare them.
    b:
      en: |
        Node names play no part in the choice; nodes are ranked by score.
    d:
      en: |
        There is no round-robin rule; the scheduler chooses by score.
references:
  - title: Kubernetes Scheduler
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
  - title: Scheduler Configuration
    url: https://kubernetes.io/docs/reference/scheduling/config/
