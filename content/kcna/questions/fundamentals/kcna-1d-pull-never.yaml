id: kcna-1d-pull-never
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container has `imagePullPolicy: Never`, and the image is not present on the node. What happens?
body:
  options:
    - id: a
      text: { en: "The kubelet pulls the image once, then never again" }
    - id: b
      text: { en: "The kubelet pulls the image from the default registry" }
    - id: c
      text: { en: "The kubelet does not pull the image, and the container fails to start" }
    - id: d
      text: { en: "The scheduler moves the Pod to a node that has the image" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `imagePullPolicy: Never`, the kubelet never tries to fetch the image. If the image is already present on the node the container starts; otherwise startup fails.
  options:
    a:
      en: |
        That resembles `IfNotPresent`; `Never` forbids any pull.
    b:
      en: |
        `Never` means the kubelet does not try to fetch the image at all.
    d:
      en: |
        The scheduler does not reschedule a Pod because of its pull policy.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
