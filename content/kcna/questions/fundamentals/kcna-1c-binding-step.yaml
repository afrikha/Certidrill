id: kcna-1c-binding-step
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Once kube-scheduler has chosen a node for a Pod, how is the decision applied?
body:
  options:
    - id: a
      text: { en: "The scheduler notifies the API server, and that node's kubelet runs the Pod" }
    - id: b
      text: { en: "The scheduler connects to the node and starts the containers itself" }
    - id: c
      text: { en: "The scheduler creates a ReplicaSet that targets the chosen node" }
    - id: d
      text: { en: "The scheduler updates kube-proxy rules to route the Pod there" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The scheduler notifies the API server of its decision; this is called binding, and it sets the Pod's node. The kubelet of that node sees the Pod assigned to it and starts its containers through the container runtime.
  options:
    b:
      en: |
        The scheduler never runs containers; starting them is the kubelet's job.
    c:
      en: |
        ReplicaSets are created by Deployments, not by the scheduler, and they do not target nodes.
    d:
      en: |
        kube-proxy programs Service traffic rules; it plays no part in placing Pods.
references:
  - title: Kubernetes Scheduler
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
  - title: Pod Lifecycle
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
