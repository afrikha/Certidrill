id: kcna-1a-mirror-pod-delete
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    On a control plane node built with kubeadm, you run the following command:

    ```bash
    kubectl delete pod kube-scheduler-cp1 -n kube-system
    ```

    What happens?
body:
  options:
    - id: a
      text: { en: "kube-scheduler stays stopped until you run `kubeadm init` again" }
    - id: b
      text: { en: "A Deployment in `kube-system` creates a replacement with a new name" }
    - id: c
      text: { en: "The DaemonSet controller starts the scheduler again on another node" }
    - id: d
      text: { en: "The kubelet keeps running the static Pod and creates its mirror Pod again" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kube-scheduler-cp1` is the mirror Pod of a static Pod: a read-only copy that the kubelet creates so that the Pod is visible in the API. Deleting the mirror Pod does not remove the static Pod, and the kubelet recreates the mirror Pod. To stop a static Pod, you remove its manifest from the kubelet's static Pod directory.
  options:
    a:
      en: |
        The scheduler runs as a static Pod from a manifest file on the node; deleting its copy in the API doesn't stop it.
    b:
      en: |
        kubeadm doesn't run the scheduler as a Deployment, so no controller replaces it.
    c:
      en: |
        There is no DaemonSet: a static Pod is bound to one kubelet on one node.
references:
  - title: "Static Pods"
    url: https://kubernetes.io/docs/concepts/workloads/pods/static-pods/
  - title: "Create static Pods"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/
