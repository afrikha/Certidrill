id: kcna-1b-apply-idempotent
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CI pipeline runs the same command on every commit. The command must create the objects defined in `manifests/` the first time and update them on later runs.

    Which command fits?
body:
  options:
    - id: a
      text: { en: "`kubectl create -f manifests/`" }
    - id: b
      text: { en: "`kubectl apply -f manifests/`" }
    - id: c
      text: { en: "`kubectl replace -f manifests/`" }
    - id: d
      text: { en: "`kubectl edit -f manifests/`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubectl apply` is declarative object configuration: it creates the objects that do not exist yet and patches the ones that do, so the same command can run again and again. It works on whole directories of files.
  options:
    a: { en: "`kubectl create` creates objects and returns an error for objects that already exist, so the second run fails." }
    c: { en: "`kubectl replace` replaces the whole spec of existing objects and drops changes that are not in the file; it is not the create-or-update command." }
    d: { en: "`kubectl edit` opens objects in an interactive editor, which does not fit an automated pipeline." }
references:
  - title: Kubernetes Object Management
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/object-management/
  - title: Declarative Management of Kubernetes Objects Using Configuration Files
    url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/
