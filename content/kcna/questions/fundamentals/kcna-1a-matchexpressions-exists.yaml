id: kcna-1a-matchexpressions-exists
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DaemonSet must select the Pods that carry a `tier` label, whatever its value. Which `matchExpressions` operator should the selector use for the key `tier`?
body:
  options:
    - id: a
      text: { en: "`In`" }
    - id: b
      text: { en: "`Exists`" }
    - id: c
      text: { en: "`DoesNotExist`" }
    - id: d
      text: { en: "`NotIn`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The valid `matchExpressions` operators are `In`, `NotIn`, `Exists` and `DoesNotExist`. `Exists` matches objects that have the key, whatever its value, and takes no values; `In` and `NotIn` need a non-empty set of values.
  options:
    a:
      en: |
        `In` needs a non-empty list of values and matches only those values.
    c:
      en: |
        `DoesNotExist` matches the Pods that have no `tier` label, the opposite of the goal.
    d:
      en: |
        `NotIn` needs a list of values to exclude; it doesn't express "any value".
references:
  - title: "Labels and Selectors"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
