id: kcna-1d-podaffinity-no-match
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod has a required inter-Pod affinity to Pods labeled `app=cache` within the same zone. No Pod with the label `app=cache` exists in the cluster, and the new Pod does not carry this label itself. What happens to the new Pod?
body:
  options:
    - id: a
      text: { en: "It is scheduled on any feasible node" }
    - id: b
      text: { en: "It is scheduled and a cache Pod is created next to it" }
    - id: c
      text: { en: "The API server rejects it because the selector matches no Pod" }
    - id: d
      text: { en: "It stays `Pending` until a matching Pod exists" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A required Pod affinity rule lets the scheduler use only topology domains that already run matching Pods. With no `app=cache` Pod anywhere, no node is feasible and the Pod stays `Pending`. The only exception is a Pod whose own labels match its affinity, so that the first replica of a self-affine group can start.
  options:
    a:
      en: |
        That is the behavior of a preferred rule. A required rule is a filter: no zone runs a matching Pod, so every node fails it.
    b:
      en: |
        Affinity never creates Pods; it only constrains where the new Pod may go.
    c:
      en: |
        The API server does not check selectors against existing Pods; the scheduler evaluates the rule.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
