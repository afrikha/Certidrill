id: kcna-1e-multistage-benefit
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the main benefit of a multi-stage build in a Dockerfile?
body:
  options:
    - id: a
      text: { en: "The image runs several processes in one container" }
    - id: b
      text: { en: "The image is built for several CPU architectures at once" }
    - id: c
      text: { en: "The final image contains only what the application needs at run time" }
    - id: d
      text: { en: "Each microservice of the application gets its own image" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In a multi-stage build, each `FROM` starts a stage. Compilers, sources and intermediate files stay in the build stage, and only the selected artifacts are copied into the final stage. The final image is smaller and contains fewer packages to patch.
  options:
    a:
      en: |
        Multi-stage builds do not change how many processes a container runs. The recommended practice is still one main concern per container.
    b:
      en: |
        Building for several CPU architectures is a multi-platform build, a different feature. Stages are about separating build tools from the run-time image.
    d:
      en: |
        Splitting an application into one image per microservice is an architecture choice, not what a multi-stage build does. A multi-stage build still produces one image.
references:
