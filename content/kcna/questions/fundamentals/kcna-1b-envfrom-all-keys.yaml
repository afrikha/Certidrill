id: kcna-1b-envfrom-all-keys
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The ConfigMap `app-config` contains the keys `LOG_LEVEL` and `CACHE_SIZE`. A container spec includes the following snippet.

    ```yaml
    envFrom:
    - configMapRef:
        name: app-config
    ```

    What does the container receive?
body:
  options:
    - id: a
      text: { en: "One file per key, mounted under `/etc/config`" }
    - id: b
      text: { en: "One variable named `app-config` that holds all the keys" }
    - id: c
      text: { en: "Only the first key of the ConfigMap, as a variable" }
    - id: d
      text: { en: "Two variables, `LOG_LEVEL` and `CACHE_SIZE`, with their values" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `envFrom` with `configMapRef` defines every key of the ConfigMap as an environment variable: the key becomes the variable name and its value the variable value. Keys that are not valid variable names are skipped and reported in an event.
  options:
    a: { en: "Files are created only when the ConfigMap is declared as a volume and mounted with `volumeMounts`; `envFrom` creates environment variables." }
    b: { en: "The ConfigMap name is not used as a variable name; each key becomes its own variable." }
    c: { en: "`envFrom` imports all the keys, not only the first one. To pick one key, use `env` with `configMapKeyRef`." }
references:
  - title: Configure a Pod to Use a ConfigMap
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
