id: kcna-1e-runtimeclass-object
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Kubernetes object lets a Pod run with a different container runtime configuration, such as a sandboxed runtime?
body:
  options:
    - id: a
      text: { en: "PriorityClass" }
    - id: b
      text: { en: "RuntimeClass" }
    - id: c
      text: { en: "StorageClass" }
    - id: d
      text: { en: "IngressClass" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A RuntimeClass names a container runtime configuration through its `handler`. Pods that reference it run with that configuration, for example a sandboxed runtime for stronger isolation, while other Pods keep the node's default runtime.
  options:
    a:
      en: |
        A PriorityClass sets the scheduling priority of Pods, used for preemption. It doesn't select a runtime.
    c:
      en: |
        A StorageClass describes how volumes are provisioned dynamically. It has nothing to do with the container runtime.
    d:
      en: |
        An IngressClass names the Ingress controller that implements an Ingress. It doesn't affect how containers run.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
