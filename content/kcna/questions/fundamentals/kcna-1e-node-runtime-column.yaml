id: kcna-1e-node-runtime-column
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator needs to see which container runtime and version each node of a cluster uses. Which command shows this?
body:
  options:
    - id: a
      text: { en: "`kubectl get runtimeclasses`" }
    - id: b
      text: { en: "`kubectl version`" }
    - id: c
      text: { en: "`kubectl cluster-info`" }
    - id: d
      text: { en: "`kubectl get nodes -o wide`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The wide output of `kubectl get nodes` has a `CONTAINER-RUNTIME` column in the form `<runtime>://<version>`, for example `containerd://<version>`. The value comes from the status that each kubelet reports.
  options:
    a:
      en: |
        `kubectl get runtimeclasses` lists RuntimeClass objects, which name runtime handlers for Pods. It doesn't show the runtime installed on each node.
    b:
      en: |
        `kubectl version` shows the version of the kubectl client and of the API server, not the runtime of the nodes.
    c:
      en: |
        `kubectl cluster-info` shows the addresses of the control plane and of cluster services. It doesn't list node runtimes.
references:
  - title: "Find Out What Container Runtime is Used on a Node"
    url: https://kubernetes.io/docs/tasks/administer-cluster/migrating-from-dockershim/find-out-runtime-you-use/
