id: kcna-1a-selector-template-mismatch
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You apply this Deployment:

    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: web
      template:
        metadata:
          labels:
            app: frontend
        spec:
          containers:
          - name: web
            image: nginx:1.27
    ```

    What happens?
body:
  options:
    - id: a
      text: { en: "The API server rejects it, because the selector doesn't match the template labels" }
    - id: b
      text: { en: "It is created, but it never counts its Pods and keeps creating new ones" }
    - id: c
      text: { en: "Kubernetes replaces the selector with `app: frontend` from the template" }
    - id: d
      text: { en: "It is created and selects the Pods labeled `app: web` or `app: frontend`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Deployment's `.spec.selector` must match `.spec.template.metadata.labels`, or the API rejects the object. The selector is how the Deployment finds and counts its Pods, and it is immutable after creation in `apps/v1`.
  options:
    b:
      en: |
        The API validates the selector against the template, so the object is never created.
    c:
      en: |
        In `apps/v1`, the selector is never defaulted from the template; it must be set explicitly and match.
    d:
      en: |
        A selector is not merged with the template labels; a mismatch is an error.
references:
  - title: "Deployments"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
