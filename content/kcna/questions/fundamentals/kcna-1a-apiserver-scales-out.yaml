id: kcna-1a-apiserver-scales-out
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A control plane runs several `kube-apiserver` instances for high availability. Which statement about these instances is correct?
body:
  options:
    - id: a
      text: { en: "Only one instance serves requests; the other instances stay on standby until they win a leader election" }
    - id: b
      text: { en: "All instances serve API requests at the same time; kube-apiserver scales horizontally by adding instances" }
    - id: c
      text: { en: "Each instance keeps its own separate etcd database that holds only the objects it has created" }
    - id: d
      text: { en: "Each instance serves one API group, and clients must send requests to the instance of that group" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      kube-apiserver is designed to scale horizontally: you deploy more instances and balance traffic between them. Each instance publishes its identity with a Lease, which lets clients count the API server instances in the control plane.
  options:
    a:
      en: |
        That is how kube-scheduler and kube-controller-manager work; API server instances all serve requests.
    c:
      en: |
        All API server instances use the same cluster data; they are stateless front ends of one backing store.
    d:
      en: |
        Any API server instance serves the whole API; requests are not split by API group.
references:
  - title: "Cluster Architecture"
    url: https://kubernetes.io/docs/concepts/architecture/
  - title: "Leases"
    url: https://kubernetes.io/docs/concepts/architecture/leases/
