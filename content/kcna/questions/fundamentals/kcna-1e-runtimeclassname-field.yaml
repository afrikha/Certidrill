id: kcna-1e-runtimeclassname-field
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A RuntimeClass named `sandboxed` exists in the cluster. Which Pod field makes a Pod use it?
body:
  options:
    - id: a
      text: { en: "`spec.priorityClassName`" }
    - id: b
      text: { en: "`spec.schedulerName`" }
    - id: c
      text: { en: "`spec.nodeName`" }
    - id: d
      text: { en: "`spec.runtimeClassName`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Pod opts in to a RuntimeClass by setting `spec.runtimeClassName` to its name, here `runtimeClassName: sandboxed`. The kubelet then asks the CRI runtime to run the Pod with the handler of that RuntimeClass.
  options:
    a:
      en: |
        `priorityClassName` references a PriorityClass, which sets the Pod's scheduling priority, not its runtime.
    b:
      en: |
        `schedulerName` selects the scheduler that places the Pod. The runtime on the node stays the default one.
    c:
      en: |
        `nodeName` binds the Pod to a specific node. It doesn't choose the runtime configuration on that node.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
