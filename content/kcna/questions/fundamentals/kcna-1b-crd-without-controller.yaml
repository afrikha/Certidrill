id: kcna-1b-crd-without-controller
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster has a CustomResourceDefinition for the kind `Backup`, but no controller watches `Backup` objects. A user applies a valid `Backup` object.

    What happens?
body:
  options:
    - id: a
      text: { en: "The API server rejects it because no controller handles the kind" }
    - id: b
      text: { en: "Kubernetes starts a Pod that performs the backup" }
    - id: c
      text: { en: "The API server stores it as a ConfigMap in the same namespace" }
    - id: d
      text: { en: "The object is stored and listed by kubectl, but nothing acts on it" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On their own, custom resources let you store and retrieve structured data. Only when a custom controller watches them do they become a declarative API that changes the cluster. Without a controller, the `Backup` object just sits in the API.
  options:
    a: { en: "The API server accepts any object that matches the CRD schema; it does not check whether a controller exists." }
    b: { en: "Kubernetes has no built-in logic for a custom kind; a controller would have to create such a Pod." }
    c: { en: "Custom objects are stored as their own kind, not converted into ConfigMaps." }
references:
  - title: Custom Resources
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
