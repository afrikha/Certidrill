id: kcna-1d-nodeselector-and
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod has the following `nodeSelector`. Which nodes can the scheduler choose for it?

    ```yaml
    nodeSelector:
      disktype: ssd
      team: payments
    ```
body:
  options:
    - id: a
      text: { en: "Nodes that have at least one of the two labels" }
    - id: b
      text: { en: "Any node, preferring nodes with both labels" }
    - id: c
      text: { en: "Only nodes that have neither label" }
    - id: d
      text: { en: "Only nodes that have both labels" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Kubernetes schedules the Pod only onto nodes that have each of the labels listed in `nodeSelector`. A node needs both `disktype=ssd` and `team=payments` to be feasible.
  options:
    a:
      en: |
        The labels of a `nodeSelector` are not alternatives: a node that has only one of them is filtered out.
    b:
      en: |
        `nodeSelector` is a hard rule, not a preference. Preferences are expressed with `preferredDuringSchedulingIgnoredDuringExecution` node affinity.
    c:
      en: |
        That would be an exclusion rule, such as node affinity with the `NotIn` or `DoesNotExist` operator, not a `nodeSelector`.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
