id: kcna-1b-crd-new-kind
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team wants to add a new resource kind, `Database`, to the Kubernetes API. They want to do it by applying a manifest, without writing or running an additional API server.

    Which object should they create?
body:
  options:
    - id: a
      text: { en: "ConfigMap" }
    - id: b
      text: { en: "CustomResourceDefinition" }
    - id: c
      text: { en: "APIService" }
    - id: d
      text: { en: "MutatingWebhookConfiguration" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A CustomResourceDefinition (CRD) adds a new kind to the API without programming: the kube-apiserver serves and stores the new objects, and `kubectl` manages them like built-in ones. No additional service has to run.
  options:
    a: { en: "A ConfigMap stores configuration data; it does not add a new kind to the API." }
    c: { en: "An APIService registers an extension API server with the aggregation layer, which means writing and running that server." }
    d: { en: "A MutatingWebhookConfiguration sends objects to a webhook that can change them at admission; it adds no new kind." }
references:
  - title: Custom Resources
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
