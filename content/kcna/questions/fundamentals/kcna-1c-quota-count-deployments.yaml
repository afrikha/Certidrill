id: kcna-1c-quota-count-deployments
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `web` team must not create more than 5 Deployments in its namespace. What should you configure?
body:
  options:
    - id: a
      text: { en: "A ResourceQuota with `count/deployments.apps: \"5\"`" }
    - id: b
      text: { en: "A ResourceQuota with `pods: \"5\"`" }
    - id: c
      text: { en: "A LimitRange of `type: Pod` with a `max` value" }
    - id: d
      text: { en: "A ResourceQuota with `replicationcontrollers: \"5\"`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A ResourceQuota can limit the number of objects of any kind with the `count/<resource>.<group>` syntax. `count/deployments.apps` counts Deployments, which belong to the `apps` API group.
  options:
    b:
      en: |
        `pods` counts Pods, not Deployments: one Deployment can run many Pods.
    c:
      en: |
        A LimitRange bounds the resources of each Pod or container; it does not count objects.
    d:
      en: |
        `replicationcontrollers` counts ReplicationControllers, an older kind, not Deployments.
references:
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
