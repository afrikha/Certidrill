id: kcna-1a-init-container-wait
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before the main container of a Pod starts, a step must wait until a database Service resolves in DNS, and then exit. Which kind of container fits this step?
body:
  options:
    - id: a
      text: { en: "A sidecar container" }
    - id: b
      text: { en: "An init container" }
    - id: c
      text: { en: "An ephemeral container" }
    - id: d
      text: { en: "A second container in `containers`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Init containers run to completion, one after the other, before the app containers start. If one fails, the kubelet restarts it until it succeeds (unless the Pod's `restartPolicy` is `Never`), so the app starts only once its dependency is ready.
  options:
    a:
      en: |
        A sidecar keeps running beside the main container; this step must finish before the app starts.
    c:
      en: |
        Ephemeral containers are added to a running Pod for debugging, not to prepare its start.
    d:
      en: |
        App containers do not wait for each other to complete, so the main container would start at once.
references:
  - title: "Init Containers"
    url: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
