id: kcna-1d-image-pull-secrets
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Pods in the namespace `shop` must pull images from a private registry that requires a login. What should the Pod spec reference?
body:
  options:
    - id: a
      text: { en: "`imagePullSecrets` naming a `kubernetes.io/dockerconfigjson` Secret in `kube-system`" }
    - id: b
      text: { en: "A ConfigMap that contains the registry user name and password" }
    - id: c
      text: { en: "`imagePullSecrets` naming a `kubernetes.io/dockerconfigjson` Secret in `shop`" }
    - id: d
      text: { en: "`imagePullPolicy: Always` with the registry URL in the image name" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `imagePullSecrets` is the recommended way to supply registry credentials. Each entry names a Secret of type `kubernetes.io/dockerconfigjson` (or `kubernetes.io/dockercfg`) that must exist in the same namespace as the Pod.
  options:
    a:
      en: |
        Image pull Secrets must exist in the same namespace as the Pod; a Secret in `kube-system` is not used.
    b:
      en: |
        The kubelet does not read registry credentials from ConfigMaps, and ConfigMaps are not meant for credentials.
    d:
      en: |
        The pull policy controls when to pull, not how to authenticate.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
