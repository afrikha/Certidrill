id: kcna-1c-exceed-request-eviction
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container requests 256Mi of memory and has a 1Gi limit. It uses 600Mi when its node becomes short of memory. What is likely to happen?
body:
  options:
    - id: a
      text: { en: "The container's memory is throttled to 256Mi" }
    - id: b
      text: { en: "The scheduler moves the Pod to another node" }
    - id: c
      text: { en: "Nothing, because the container is under its limit" }
    - id: d
      text: { en: "The Pod is likely to be evicted from the node" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Staying under the limit avoids an OOM kill, but a container that uses more than its memory request is a candidate for eviction when the node runs short of memory. The request is what the node reserves; usage above it is not protected.
  options:
    a:
      en: |
        Memory is not throttled: requests reserve capacity, and only the limit caps usage.
    b:
      en: |
        The scheduler places new Pods only; it never moves a running Pod.
    c:
      en: |
        Being under the limit does not protect a Pod that exceeds its request during node memory pressure.
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  - title: Pod Quality of Service Classes
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/
