id: kcna-1d-host-network
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod sets `hostNetwork: true`. Which isolation do its containers lose?
body:
  options:
    - id: a
      text: { en: "They use the node's PID namespace and see host processes" }
    - id: b
      text: { en: "They lose their CPU and memory limits" }
    - id: c
      text: { en: "They use the node's network namespace instead of their own" }
    - id: d
      text: { en: "They share the file system of the node" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `hostNetwork: true` makes the Pod use the node's network namespace: it sees the node's interfaces and binds ports directly on the node. `hostNetwork`, `hostPID` and `hostIPC` are the Pod fields that share host namespaces, which is why they are restricted, for example in user-namespace Pods.
  options:
    a:
      en: |
        Host processes become visible with `hostPID: true`, not `hostNetwork`.
    b:
      en: |
        Limits are enforced by cgroups, which `hostNetwork` does not affect.
    d:
      en: |
        The file system view comes from the mount namespace and volumes; `hostNetwork` does not change it.
references:
  - title: "User Namespaces"
    url: https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/
