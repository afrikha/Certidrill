id: kcna-1c-upgrade-order-apiserver
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    During a minor version upgrade, which component does the version skew policy say to upgrade first?
body:
  options:
    - id: a
      text: { en: "The kubelet on every node" }
    - id: b
      text: { en: "kube-apiserver" }
    - id: c
      text: { en: "kube-proxy" }
    - id: d
      text: { en: "kube-scheduler" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      kube-apiserver is upgraded first. kube-controller-manager, kube-scheduler and cloud-controller-manager follow, then the kubelets and kube-proxy, because none of these may be newer than the API server they talk to.
  options:
    a:
      en: |
        The kubelet must not be newer than kube-apiserver, so nodes are upgraded after the control plane.
    c:
      en: |
        kube-proxy must not be newer than kube-apiserver either; it is upgraded last, with the nodes.
    d:
      en: |
        kube-scheduler must not be newer than the API servers it talks to, so it comes after kube-apiserver.
references:
  - title: Version Skew Policy
    url: https://kubernetes.io/releases/version-skew-policy/
