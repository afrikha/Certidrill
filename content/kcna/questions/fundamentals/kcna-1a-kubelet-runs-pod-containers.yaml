id: kcna-1a-kubelet-runs-pod-containers
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which agent runs on every node and makes sure that the containers of the Pods assigned to that node are running and healthy?
body:
  options:
    - id: a
      text: { en: "kube-proxy" }
    - id: b
      text: { en: "kube-scheduler" }
    - id: c
      text: { en: "kube-controller-manager" }
    - id: d
      text: { en: "kubelet" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The kubelet is the agent that runs on each node. It takes the Pod specs assigned to its node, provided mainly through the API server, and ensures that the containers described in them are running and healthy, by asking the container runtime to start them.
  options:
    a:
      en: |
        kube-proxy maintains network rules for Services on the node; it does not start or watch containers.
    b:
      en: |
        kube-scheduler is a control plane component that chooses nodes for Pods; it does not run them.
    c:
      en: |
        kube-controller-manager runs controllers that create Pod objects through the API; the containers are started on the node by its agent.
references:
  - title: "kubelet"
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
  - title: "Kubernetes Components"
    url: https://kubernetes.io/docs/concepts/overview/components/
