id: kcna-1b-resource-type-forms
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Consider the following three commands.

    ```bash
    kubectl get pod pod1
    kubectl get pods pod1
    kubectl get po pod1
    ```

    Which statement is true?
body:
  options:
    - id: a
      text: { en: "Only the plural form `pods` is accepted" }
    - id: b
      text: { en: "`po` refers to a different resource type, PodTemplate" }
    - id: c
      text: { en: "The singular form lists every Pod and ignores the name" }
    - id: d
      text: { en: "All three return the same Pod" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In `kubectl [command] [TYPE] [NAME] [flags]`, the resource type is case-insensitive and accepts the singular, plural or short form; `po` is the short name of `pods`. The name, by contrast, is case-sensitive.
  options:
    a: { en: "kubectl accepts the singular, plural and short forms of a resource type." }
    b: { en: "`po` is the short name of `pods`, as `kubectl api-resources` shows." }
    c: { en: "When a name is given, kubectl returns that object only, whatever form of the type you use." }
references:
  - title: Command line tool (kubectl)
    url: https://kubernetes.io/docs/reference/kubectl/
