id: kcna-1e-layer-cache-order
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Node.js image is built from this Dockerfile. Every small code change makes the build download all dependencies again.

    ```text
    FROM node:22-alpine
    WORKDIR /app
    COPY . .
    RUN npm ci
    CMD ["node", "server.js"]
    ```

    What should the developer change?
body:
  options:
    - id: a
      text: { en: "Replace `COPY . .` with `ADD . .`" }
    - id: b
      text: { en: "Build the image with the `--no-cache` option" }
    - id: c
      text: { en: "Copy `package*.json` and run `npm ci` before copying the rest of the source" }
    - id: d
      text: { en: "Move the `CMD` instruction before the `COPY` instruction" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A changed layer invalidates the cache of every following instruction. Here `COPY . .` changes with every code edit, so `npm ci` runs again. Copying only the dependency files first and installing them, then copying the source, lets the dependency layer come from the cache until the dependencies change.
  options:
    a:
      en: |
        For a directory of source files, `ADD` copies them like `COPY` does: the layer still changes with every code edit, and `npm ci` still runs again. The recommended instruction for local files is `COPY`.
    b:
      en: |
        `--no-cache` disables the build cache entirely, so every step runs again. It makes the problem worse.
    d:
      en: |
        `CMD` only records the default command in the image configuration. Moving it does not change when `npm ci` is invalidated.
references:
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
