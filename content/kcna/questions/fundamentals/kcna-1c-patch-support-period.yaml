id: kcna-1c-patch-support-period
objective: "1.2.5"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    For about how long does a Kubernetes minor version (1.19 or newer) receive patch releases?
body:
  options:
    - id: a
      text: { en: "About three months" }
    - id: b
      text: { en: "About six months" }
    - id: c
      text: { en: "About one year" }
    - id: d
      text: { en: "About three years" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes 1.19 and newer minor versions receive approximately one year of patch support. After that the version reaches end of life, so clusters must move to a newer minor version.
  options:
    a:
      en: |
        Three months is far shorter than the documented support period of about one year.
    b:
      en: |
        Six months is too short; minor versions 1.18 and older had about nine months, and 1.19 and newer about one year.
    d:
      en: |
        No Kubernetes minor version is patched for three years by the project.
references:
  - title: Releases
    url: https://kubernetes.io/releases/
  - title: Patch Releases
    url: https://kubernetes.io/releases/patch-releases/
