id: kcna-1c-hostport-pending
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Deployment `agent` has 4 replicas, and its container declares `hostPort: 9100`. The cluster has 3 schedulable worker nodes with plenty of free CPU and memory. Three replicas run, and the fourth stays Pending. Why?
body:
  options:
    - id: a
      text: { en: "A `hostPort` requires a NodePort Service, which is missing" }
    - id: b
      text: { en: "The scheduler never places two replicas of a Deployment on one node" }
    - id: c
      text: { en: "kube-proxy allows only one Pod per node to receive traffic" }
    - id: d
      text: { en: "Port 9100 is taken on every node, so no node passes filtering" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      During filtering, the scheduler checks that a node has free ports for the host ports a Pod requests. Each worker already runs a replica bound to host port 9100, so no node is feasible for the fourth replica and it stays Pending.
  options:
    a:
      en: |
        A host port does not depend on any Service; it maps a port of the node directly to the container.
    b:
      en: |
        Replicas of a Deployment can share a node unless anti-affinity or spread constraints forbid it; the host port conflict is the cause here.
    c:
      en: |
        kube-proxy programs Service rules; it does not limit how many Pods a node runs.
references:
  - title: Scheduler Configuration
    url: https://kubernetes.io/docs/reference/scheduling/config/
