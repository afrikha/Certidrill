id: kcna-1c-managed-control-plane
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp moves its applications to a managed Kubernetes service from a cloud provider. Which part of the cluster does the provider typically operate for the company?
body:
  options:
    - id: a
      text: { en: "The Deployments and Services of its applications" }
    - id: b
      text: { en: "The container images in its registry" }
    - id: c
      text: { en: "The RBAC Roles granted to each team" }
    - id: d
      text: { en: "The control plane and its upgrades" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With a managed Kubernetes service, the provider manages the scale and availability of the control plane and handles its patches and upgrades. The company still owns its workloads, its images and the access it grants inside the cluster.
  options:
    a:
      en: |
        The customer still writes and deploys its own Deployments and Services; the provider does not manage application objects.
    b:
      en: |
        Building, scanning and pushing images stays the customer's job, whatever the cluster hosting model.
    c:
      en: |
        Granting least-privilege access to teams with RBAC remains the customer's responsibility in a managed cluster.
references:
  - title: Production environment
    url: https://kubernetes.io/docs/setup/production-environment/
