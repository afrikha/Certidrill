id: kcna-1e-untrusted-code-sandbox
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform runs code uploaded by its customers in Pods. The code is untrusted, and a flaw in the host kernel must not let it reach other workloads on the node. What should the platform team do?
body:
  options:
    - id: a
      text: { en: "Run each customer's Pods in a separate namespace" }
    - id: b
      text: { en: "Set CPU and memory limits on every customer container" }
    - id: c
      text: { en: "Apply a default-deny NetworkPolicy to customer Pods" }
    - id: d
      text: { en: "Run customer Pods with a RuntimeClass for gVisor or Kata Containers" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Ordinary containers share the host kernel, so a kernel flaw can affect every container on the node. A sandboxed runtime such as gVisor, with its user-space kernel, or Kata Containers, with a lightweight virtual machine per Pod, adds a layer between the workload and the host kernel. A RuntimeClass selects it for these Pods only.
  options:
    a:
      en: |
        Kubernetes namespaces group objects and scope names and policies. Pods of all namespaces still share the kernel of their node.
    b:
      en: |
        Limits cap the CPU and memory a container can use through cgroups. They don't protect the host kernel from the code.
    c:
      en: |
        A NetworkPolicy controls network traffic between Pods. It doesn't isolate the containers from the host kernel.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
  - title: "GitHub - google/gvisor: Application Kernel for Containers"
    url: https://github.com/google/gvisor
