id: kcna-1a-kube-proxy-optional
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster's network plugin implements packet forwarding for Services itself, with behavior equivalent to kube-proxy. Which statement about kube-proxy in this cluster is correct?
body:
  options:
    - id: a
      text: { en: "kube-proxy must still run, or Pods cannot start" }
    - id: b
      text: { en: "kube-proxy can be left out of the nodes" }
    - id: c
      text: { en: "kube-proxy must move to the control plane" }
    - id: d
      text: { en: "kube-proxy must be replaced by CoreDNS" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      kube-proxy is an optional node component. If you use a network plugin that implements packet forwarding for Services, providing behavior equivalent to kube-proxy, you don't need to run kube-proxy on the nodes.
  options:
    a:
      en: |
        Pods start without kube-proxy; it only implements Service traffic rules.
    c:
      en: |
        kube-proxy is a node component; it never becomes a central control plane service.
    d:
      en: |
        CoreDNS resolves names to Service IPs; it does not forward Service traffic.
references:
  - title: "Cluster Architecture"
    url: https://kubernetes.io/docs/concepts/architecture/
  - title: "Kubernetes Components"
    url: https://kubernetes.io/docs/concepts/overview/components/
