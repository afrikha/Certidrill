id: kcna-1d-preemption-never
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A batch Pod uses the following PriorityClass. When the cluster is full, how is the Pod treated compared with lower-priority Pods?

    ```yaml
    apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    metadata:
      name: batch-high
    value: 500000
    preemptionPolicy: Never
    ```
body:
  options:
    - id: a
      text: { en: "It evicts them as soon as it cannot be scheduled" }
    - id: b
      text: { en: "It is treated exactly like a Pod of priority 0" }
    - id: c
      text: { en: "It waits ahead of them in the queue but never evicts them" }
    - id: d
      text: { en: "It can never be preempted by higher-priority Pods" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `preemptionPolicy: Never`, Pods are placed in the scheduling queue ahead of lower-priority Pods but cannot preempt other Pods. They wait until resources become free naturally. The default policy is `PreemptLowerPriority`.
  options:
    a:
      en: |
        That is the default `PreemptLowerPriority` policy; `Never` disables preemption by this Pod.
    b:
      en: |
        Its value still matters: it is placed ahead of lower-priority Pods in the queue.
    d:
      en: |
        `preemptionPolicy` only controls whether this Pod preempts others; it can still be preempted itself.
references:
  - title: "Pod Priority and Preemption"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
