id: kcna-1b-configmap-size-limit
objective: "1.1.6"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    A team plans to store large reference data files in a ConfigMap.

    What is the maximum size of the data in a single ConfigMap?
body:
  options:
    - id: a
      text: { en: "64 KiB" }
    - id: b
      text: { en: "1 MiB" }
    - id: c
      text: { en: "10 MiB" }
    - id: d
      text: { en: "1 GiB" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The data stored in a ConfigMap cannot exceed 1 MiB. ConfigMaps are not designed for large data: for bigger content, mount a volume or use a separate database or file service. Secrets have the same 1 MiB limit.
  options:
    a: { en: "64 KiB is not the ConfigMap limit; a ConfigMap can hold up to 1 MiB of data." }
    c: { en: "10 MiB is above the limit; the API server accepts at most 1 MiB of data in one ConfigMap." }
    d: { en: "1 GiB is far above the 1 MiB limit; large files belong in a volume or an external store." }
references:
  - title: ConfigMaps
    url: https://kubernetes.io/docs/concepts/configuration/configmap/
