id: kcna-1d-preemption-basic
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A high-priority Pod cannot be scheduled because no node has enough free resources. Which action can kube-scheduler take?
body:
  options:
    - id: a
      text: { en: "Add a node to the cluster" }
    - id: b
      text: { en: "Evict lower-priority Pods from a node to make room" }
    - id: c
      text: { en: "Lower the resource requests of the pending Pod" }
    - id: d
      text: { en: "Throttle the CPU of the Pods already running" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      This is preemption: when a Pod cannot be scheduled, the scheduler looks for a node where removing one or more lower-priority Pods would let it fit, and evicts them. The pending Pod can then be scheduled once the victims have terminated.
  options:
    a:
      en: |
        Adding nodes is the job of a node autoscaler such as Cluster Autoscaler, not of kube-scheduler.
    c:
      en: |
        The scheduler never changes a Pod's requests; it places Pods as they are declared.
    d:
      en: |
        CPU throttling enforces limits through cgroups on the node; the scheduler does not do it to free capacity.
references:
  - title: "Pod Priority and Preemption"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
