id: kcna-1d-namespace-vs-cgroup-pair
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A container sees only its own processes, and the kernel kills it when it uses more than 512 MiB of memory. Which pair of Linux features is responsible for these two behaviors?
body:
  options:
    - id: a
      text: { en: "A process cgroup for the process view, and a memory namespace for the limit" }
    - id: b
      text: { en: "A PID namespace for the process view, and a memory cgroup for the limit" }
    - id: c
      text: { en: "seccomp for the process view, and AppArmor for the limit" }
    - id: d
      text: { en: "A user namespace for the process view, and SELinux for the limit" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Namespaces define what a container can see: the PID namespace gives it its own process tree. Control groups define what it can use: the memory controller enforces the limit, and a container that exceeds its memory limit is OOM-killed.
  options:
    a:
      en: |
        This swaps the two roles: namespaces isolate what is visible, and cgroups limit what is consumed. There is no memory namespace.
    c:
      en: |
        seccomp filters system calls and AppArmor confines access to resources; neither hides processes or caps memory.
    d:
      en: |
        A user namespace remaps user IDs, and SELinux restricts access by label; neither provides these behaviors.
references:
  - title: "About cgroup v2"
    url: https://kubernetes.io/docs/concepts/architecture/cgroups/
  - title: "Share Process Namespace between Containers in a Pod"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/
