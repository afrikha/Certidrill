id: kcna-1d-nodeselector-plus-affinity
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod sets `nodeSelector: {disktype: ssd}` and a required node affinity that allows only `topology.kubernetes.io/zone` `zone-a`. Node `n1` is in `zone-a` and has the label `disktype=hdd`. Can the Pod be scheduled on `n1`?
body:
  options:
    - id: a
      text: { en: "Yes, because node affinity overrides nodeSelector when both are set" }
    - id: b
      text: { en: "Yes, because a node that matches either of the two rules is feasible" }
    - id: c
      text: { en: "No, because both the nodeSelector and the node affinity must be satisfied" }
    - id: d
      text: { en: "No, because nodeSelector and node affinity cannot be used in the same Pod" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a Pod specifies both `nodeSelector` and `nodeAffinity`, both must be satisfied for a node to be feasible. `n1` passes the zone rule but fails `disktype: ssd`, so the scheduler filters it out.
  options:
    a:
      en: |
        Neither field overrides the other; the scheduler applies both.
    b:
      en: |
        The two fields are not alternatives. Only separate `nodeSelectorTerms` inside node affinity are ORed.
    d:
      en: |
        Both fields can be set in one Pod spec; the API accepts the combination.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
