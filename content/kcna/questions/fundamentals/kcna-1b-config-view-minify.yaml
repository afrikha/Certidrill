id: kcna-1b-config-view-minify
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your merged kubeconfig contains many clusters, users and contexts. You want to display only the cluster, user and context entries used by the current context.

    Which command do you use?
body:
  options:
    - id: a
      text: { en: "`kubectl config view --raw`" }
    - id: b
      text: { en: "`kubectl config get-contexts`" }
    - id: c
      text: { en: "`kubectl cluster-info`" }
    - id: d
      text: { en: "`kubectl config view --minify`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `kubectl config view` shows the merged kubeconfig settings, and `--minify` limits the output to the information associated with the current context.
  options:
    a: { en: "`--raw` shows the full merged configuration including raw certificate data; it does not filter by context." }
    b: { en: "`get-contexts` lists the contexts in a table but does not show the cluster and user entries." }
    c: { en: "`kubectl cluster-info` contacts the cluster and prints service addresses; it does not show kubeconfig entries." }
references:
  - title: Configure Access to Multiple Clusters
    url: https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/
