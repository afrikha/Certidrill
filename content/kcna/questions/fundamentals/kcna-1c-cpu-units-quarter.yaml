id: kcna-1c-cpu-units-quarter
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container needs a quarter of a CPU core. Which value should you set in `requests.cpu`?
body:
  options:
    - id: a
      text: { en: "`25m`" }
    - id: b
      text: { en: "`250m`" }
    - id: c
      text: { en: "`2500m`" }
    - id: d
      text: { en: "`0.025`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CPU is measured in CPU units: `1` is one physical or virtual core, and `1000m` (millicpu) equals one CPU. A quarter of a core is `250m`, which can also be written `0.25`.
  options:
    a:
      en: |
        `25m` is 0.025 CPU, a fortieth of a core.
    c:
      en: |
        `2500m` is 2.5 CPUs.
    d:
      en: |
        `0.025` equals `25m`, a fortieth of a core.
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
