id: kcna-1c-quota-replicaset-events
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The `shop` namespace has a ResourceQuota with `pods: "3"`. You apply a Deployment with 5 replicas, and kubectl prints `deployment.apps/web created`. Only 3 Pods exist. Where do you find the reason for the 2 missing Pods?
body:
  options:
    - id: a
      text: { en: "In the logs of the running `web` Pods" }
    - id: b
      text: { en: "In the FailedScheduling events of the missing Pods" }
    - id: c
      text: { en: "In the logs of kube-scheduler" }
    - id: d
      text: { en: "In the events of the Deployment's ReplicaSet" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Deployment itself is admitted. Its ReplicaSet then creates the Pods, and the API server rejects the creations that exceed the quota. The rejection appears in the events of the ReplicaSet (`kubectl describe replicaset`).
  options:
    a:
      en: |
        The running containers know nothing about Pods that were never created.
    b:
      en: |
        The missing Pods were never created, so they have no events; FailedScheduling concerns Pods that exist but fit no node.
    c:
      en: |
        The scheduler never sees Pods that admission rejected.
references:
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
