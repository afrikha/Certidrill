id: kcna-1d-cgroups-limit
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Linux kernel feature limits how much CPU and memory a container can use?
body:
  options:
    - id: a
      text: { en: "Control groups (cgroups)" }
    - id: b
      text: { en: "Namespaces" }
    - id: c
      text: { en: "seccomp" }
    - id: d
      text: { en: "SELinux" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      On Linux, control groups constrain the resources allocated to processes. The kubelet and the container runtime use cgroups to enforce the CPU and memory requests and limits of Pods and containers.
  options:
    b:
      en: |
        Namespaces control what a process can see (processes, network, mounts), not how much it can consume.
    c:
      en: |
        seccomp restricts which system calls a process can make; it does not meter CPU or memory.
    d:
      en: |
        SELinux is a security module that restricts access to files and other resources by label, not resource consumption.
references:
  - title: "About cgroup v2"
    url: https://kubernetes.io/docs/concepts/architecture/cgroups/
