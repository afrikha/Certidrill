id: kcna-1d-daemonset-tolerations
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A node becomes `NotReady`. The ordinary Pods on it are evicted after a few minutes, but the Pods of a DaemonSet stay bound to the node. Why?
body:
  options:
    - id: a
      text: { en: "DaemonSet Pods ignore every taint, because the DaemonSet controller places them itself" }
    - id: b
      text: { en: "DaemonSet Pods always get the `system-node-critical` PriorityClass" }
    - id: c
      text: { en: "DaemonSet Pods get `NoExecute` tolerations for `not-ready` and `unreachable` with no `tolerationSeconds`" }
    - id: d
      text: { en: "DaemonSet Pods are static Pods managed by the kubelet, not by the API server" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The DaemonSet controller creates its Pods with `NoExecute` tolerations for `node.kubernetes.io/not-ready` and `node.kubernetes.io/unreachable` that have no `tolerationSeconds`. Ordinary Pods only get the default 300-second tolerations, so they are evicted while the DaemonSet Pods are never evicted for these conditions.
  options:
    a:
      en: |
        DaemonSet Pods are subject to taints: they tolerate only the built-in taints that the DaemonSet controller adds tolerations for, plus those in their template.
    b:
      en: |
        Priority affects scheduling order and preemption, not taint-based eviction, and is not set automatically on DaemonSet Pods.
    d:
      en: |
        DaemonSet Pods are regular API objects created by the DaemonSet controller; static Pods are defined in files on a node.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
