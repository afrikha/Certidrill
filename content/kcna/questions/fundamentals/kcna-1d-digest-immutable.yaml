id: kcna-1d-digest-immutable
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which image reference always points to exactly the same image content?
body:
  options:
    - id: a
      text: { en: "`registry.example.com/shop/web:1.4.2`" }
    - id: b
      text: { en: "`registry.example.com/shop/web:latest`" }
    - id: c
      text: { en: "`registry.example.com/shop/web`" }
    - id: d
      text: { en: "`registry.example.com/shop/web@sha256:9f2b…`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A digest is a hash of the image's content, so it is immutable: the same digest always identifies the same image. Tags are human-friendly names that can be moved to different images.
  options:
    a:
      en: |
        A tag such as `1.4.2` can be moved to point to a different image.
    b:
      en: |
        `latest` is a tag like any other and is usually moved at every release.
    c:
      en: |
        With no tag, the reference means `:latest`, which is mutable.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
