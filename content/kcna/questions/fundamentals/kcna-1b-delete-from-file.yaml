id: kcna-1b-delete-from-file
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The file `web.yaml` defines a Deployment and a Service that are running in the cluster. You want to remove both objects.

    Which command do you use?
body:
  options:
    - id: a
      text: { en: "`kubectl delete -f web.yaml`" }
    - id: b
      text: { en: "`kubectl replace -f web.yaml`" }
    - id: c
      text: { en: "`kubectl rollout undo -f web.yaml`" }
    - id: d
      text: { en: "`kubectl diff -f web.yaml`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl delete -f` deletes the objects whose type and name are defined in the file. It is the recommended, explicit way to delete objects managed from configuration files.
  options:
    b: { en: "`kubectl replace` overwrites the objects with the content of the file; it does not delete them." }
    c: { en: "`kubectl rollout undo` rolls a Deployment back to a previous revision; the objects remain." }
    d: { en: "`kubectl diff` only previews the changes `apply` would make." }
references:
  - title: Declarative Management of Kubernetes Objects Using Configuration Files
    url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/
