id: kcna-1c-kubeadm-scope
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    By design, which task does kubeadm leave to other tools?
body:
  options:
    - id: a
      text: { en: "Generating the control plane certificates" }
    - id: b
      text: { en: "Provisioning the machines that become nodes" }
    - id: c
      text: { en: "Creating the tokens used by `kubeadm join`" }
    - id: d
      text: { en: "Upgrading the control plane to a newer version" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      kubeadm cares only about bootstrapping a minimum viable cluster on machines that already exist. Provisioning machines, like installing nice-to-have add-ons such as dashboards or monitoring, is out of its scope and left to higher-level tooling.
  options:
    a:
      en: |
        kubeadm generates the cluster certificates during `kubeadm init` and manages them with `kubeadm certs`.
    c:
      en: |
        `kubeadm token` creates, lists and deletes the bootstrap tokens used by `kubeadm join`.
    d:
      en: |
        `kubeadm upgrade` upgrades a kubeadm cluster to a newer version, so upgrades are in kubeadm's scope.
references:
  - title: Kubeadm
    url: https://kubernetes.io/docs/reference/setup-tools/kubeadm/
