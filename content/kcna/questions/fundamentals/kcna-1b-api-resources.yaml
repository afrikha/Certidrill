id: kcna-1b-api-resources
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which command lists the resource types that the API server supports, with their short names, API group and whether they are namespaced?
body:
  options:
    - id: a
      text: { en: "`kubectl api-versions`" }
    - id: b
      text: { en: "`kubectl api-resources`" }
    - id: c
      text: { en: "`kubectl explain pods`" }
    - id: d
      text: { en: "`kubectl cluster-info`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubectl api-resources` prints the supported API resources with their name, short names (such as `po`, `svc`, `deploy`), API version, whether they are namespaced and their kind. It is the reference for the resource types of your cluster.
  options:
    a: { en: "`kubectl api-versions` prints only the group/version pairs, such as `apps/v1`, not the resource types." }
    c: { en: "`kubectl explain pods` documents the fields of one resource type; it does not list the types." }
    d: { en: "`kubectl cluster-info` shows the addresses of the control plane and cluster services, not resource types." }
references:
  - title: kubectl api-resources
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_api-resources/
