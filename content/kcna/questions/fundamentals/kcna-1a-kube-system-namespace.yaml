id: kcna-1a-kube-system-namespace
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In which initial namespace does Kubernetes place the objects created by the Kubernetes system, such as the resources of cluster add-ons?
body:
  options:
    - id: a
      text: { en: "`default`" }
    - id: b
      text: { en: "`kube-public`" }
    - id: c
      text: { en: "`kube-system`" }
    - id: d
      text: { en: "`kube-node-lease`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kube-system` is the namespace for objects created by the Kubernetes system; add-ons put their namespaced resources there. Avoid creating your own namespaces with the `kube-` prefix, which is reserved for Kubernetes system namespaces.
  options:
    a:
      en: |
        `default` lets you use a new cluster without creating a namespace; it holds your own objects.
    b:
      en: |
        `kube-public` is readable by all clients, including unauthenticated ones, and is mostly reserved for cluster use.
    d:
      en: |
        `kube-node-lease` holds the Lease objects that kubelets use for node heartbeats.
references:
  - title: "Namespaces"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
  - title: "Cluster Architecture"
    url: https://kubernetes.io/docs/concepts/architecture/
