id: kcna-1c-qos-burstable-single
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod has a single container that sets only `requests.cpu: 250m`, with no memory request and no limits. Which QoS class does the Pod get?
body:
  options:
    - id: a
      text: { en: "Guaranteed" }
    - id: b
      text: { en: "BestEffort" }
    - id: c
      text: { en: "Burstable" }
    - id: d
      text: { en: "`system-cluster-critical`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Pod is Burstable when it does not meet the Guaranteed conditions but at least one container sets a CPU or memory request or limit. Here a CPU request is set, but no limits, so the Pod is Burstable.
  options:
    a:
      en: |
        Guaranteed requires CPU and memory requests and limits, with each request equal to its limit.
    b:
      en: |
        BestEffort requires that no container sets any CPU or memory request or limit; this one sets a CPU request.
    d:
      en: |
        `system-cluster-critical` is a built-in PriorityClass, not a QoS class.
references:
  - title: Pod Quality of Service Classes
    url: https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/
