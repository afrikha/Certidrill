id: kcna-1a-status-written-by-k8s
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement about the `status` field of a Kubernetes object is correct?
body:
  options:
    - id: a
      text: { en: "Kubernetes components set and update it to report the current state of the object" }
    - id: b
      text: { en: "You must write it in your manifest, next to `spec`, before you apply the object" }
    - id: c
      text: { en: "It always holds the same values as the `spec` field of the same object" }
    - id: d
      text: { en: "It is kept only in the memory of the kubelet and is never stored by the API" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `status` describes the current state of the object, supplied and updated by the Kubernetes system and its components. Controllers compare it with `spec` to decide what to change.
  options:
    b:
      en: |
        You declare `spec`; `status` is supplied and updated by the Kubernetes system, not by your manifest.
    c:
      en: |
        `status` reports the current state, which can differ from `spec` until controllers close the gap.
    d:
      en: |
        `status` is part of the object stored through the API server, and you can read it with kubectl.
references:
  - title: "Objects In Kubernetes"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
