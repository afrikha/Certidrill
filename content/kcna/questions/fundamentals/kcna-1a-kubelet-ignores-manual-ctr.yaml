id: kcna-1a-kubelet-ignores-manual-ctr
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator logs on to a node and starts a container directly with the container runtime's command-line tool, outside Kubernetes. How does the kubelet treat this container?
body:
  options:
    - id: a
      text: { en: "It doesn't manage it, since Kubernetes did not create it" }
    - id: b
      text: { en: "It wraps it in a new Pod and reports that Pod to the API" }
    - id: c
      text: { en: "It stops it at once, because only Pods may run" }
    - id: d
      text: { en: "It restarts it after failures, like a static Pod" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The kubelet works in terms of Pod specs and doesn't manage containers that were not created by Kubernetes. Such containers are not counted in the scheduler's view of the node either, so they can use resources that the scheduler doesn't see.
  options:
    b:
      en: |
        The kubelet does not adopt foreign containers into Pods.
    c:
      en: |
        The kubelet doesn't stop containers that it doesn't manage; it ignores them.
    d:
      en: |
        Static Pods come from manifest files the kubelet reads; a container started by hand has none.
references:
  - title: "kubelet"
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
  - title: "Nodes"
    url: https://kubernetes.io/docs/concepts/architecture/nodes/
