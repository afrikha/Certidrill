id: kcna-1a-cronjob-nightly
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A report must be generated every night at 02:00 by a container that exits when the report is done. Which workload resource should you use?
body:
  options:
    - id: a
      text: { en: "Job" }
    - id: b
      text: { en: "DaemonSet" }
    - id: c
      text: { en: "CronJob" }
    - id: d
      text: { en: "Deployment" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A CronJob creates Jobs on a repeating schedule written in cron format, here `0 2 * * *`. Each Job runs its Pod until the task completes successfully.
  options:
    a:
      en: |
        A Job runs once, when you create it; it has no schedule.
    b:
      en: |
        A DaemonSet keeps one Pod running on each node; it has no schedule.
    d:
      en: |
        A Deployment restarts containers that exit, so a finished task would run again and again.
references:
  - title: "CronJob"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
