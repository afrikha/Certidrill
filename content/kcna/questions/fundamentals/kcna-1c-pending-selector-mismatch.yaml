id: kcna-1c-pending-selector-mismatch
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod spec contains `nodeSelector: {disktype: ssd}`, but no node in the cluster has the label `disktype=ssd`. What happens to the Pod?
body:
  options:
    - id: a
      text: { en: "It runs on any node, because `nodeSelector` is only a preference" }
    - id: b
      text: { en: "It stays Pending, because no node passes filtering" }
    - id: c
      text: { en: "The API server rejects it when it is created" }
    - id: d
      text: { en: "The scheduler adds the label to the least loaded node" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A `nodeSelector` is a hard requirement checked during filtering. With no matching node there is no feasible node, so the Pod stays Pending and a FailedScheduling event explains why. Labeling a node or fixing the selector lets the scheduler place it.
  options:
    a:
      en: |
        `nodeSelector` is a requirement, not a preference; preferences are expressed with preferred node affinity.
    c:
      en: |
        The API server accepts the Pod; it simply cannot be scheduled.
    d:
      en: |
        The scheduler never changes node labels.
references:
  - title: Assigning Pods to Nodes
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
  - title: Kubernetes Scheduler
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
