id: kcna-1a-spec-desired-state
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a Kubernetes object, which field describes the desired state that you declare?
body:
  options:
    - id: a
      text: { en: "`status`" }
    - id: b
      text: { en: "`metadata`" }
    - id: c
      text: { en: "`kind`" }
    - id: d
      text: { en: "`spec`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      You set `spec` when you create an object: it describes the characteristics that you want the resource to have, its desired state. The control plane then works continuously to make the actual state match it.
  options:
    a:
      en: |
        `status` describes the current state; Kubernetes components write it.
    b:
      en: |
        `metadata` identifies the object (name, namespace, UID, labels, annotations); it doesn't describe the state you want.
    c:
      en: |
        `kind` names the type of object, such as Deployment or Service.
references:
  - title: "Objects In Kubernetes"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/
