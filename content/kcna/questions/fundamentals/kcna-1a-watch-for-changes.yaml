id: kcna-1a-watch-for-changes
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Controllers must react quickly to changes of the objects they manage, without listing every object again and again. Which API mechanism do they use?
body:
  options:
    - id: a
      text: { en: "A watch request on the API server that starts from a `resourceVersion`" }
    - id: b
      text: { en: "A direct subscription to the change log of etcd" }
    - id: c
      text: { en: "An admission webhook that the API server calls on each change" }
    - id: d
      text: { en: "The Events that kube-scheduler publishes for each object" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Every object has a `resourceVersion`. A client lists the current state, then sends a watch request (`?watch=1&resourceVersion=...`) and receives the following changes (ADDED, MODIFIED, DELETED) without missing any. This is how controllers follow the objects that they reconcile.
  options:
    b:
      en: |
        Only the API server should access etcd; other components use the API.
    c:
      en: |
        Admission webhooks check or modify requests before storage; they are not how controllers follow objects.
    d:
      en: |
        Events record notable occurrences for people and tools; they are not a complete change feed.
references:
  - title: "Kubernetes API Concepts"
    url: https://kubernetes.io/docs/reference/using-api/api-concepts/
