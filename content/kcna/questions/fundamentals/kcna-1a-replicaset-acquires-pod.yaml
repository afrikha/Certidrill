id: kcna-1a-replicaset-acquires-pod
objective: "1.1.4"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A bare Pod named `web-manual`, with the label `app: web` and no owner, runs in the namespace `shop`. You then create this ReplicaSet in the same namespace:

    ```yaml
    apiVersion: apps/v1
    kind: ReplicaSet
    metadata:
      name: web
    spec:
      replicas: 3
      selector:
        matchLabels:
          app: web
      template:
        metadata:
          labels:
            app: web
        spec:
          containers:
          - name: web
            image: nginx:1.27
    ```

    How many new Pods does the ReplicaSet create?
body:
  options:
    - id: a
      text: { en: "0" }
    - id: b
      text: { en: "1" }
    - id: c
      text: { en: "2" }
    - id: d
      text: { en: "3" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A ReplicaSet acquires any Pod that matches its selector and has no controller owner reference. It adopts `web-manual`, counts it as one of its three replicas and creates only two new Pods. This is why bare Pods should not carry labels that match a ReplicaSet's selector.
  options:
    a:
      en: |
        The ReplicaSet wants 3 Pods and only `web-manual` matches, so it must create more.
    b:
      en: |
        One acquired Pod plus one new Pod gives 2 replicas, not the 3 requested.
    d:
      en: |
        The ReplicaSet doesn't ignore the matching bare Pod: it acquires `web-manual` and counts it.
references:
  - title: "ReplicaSet"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
