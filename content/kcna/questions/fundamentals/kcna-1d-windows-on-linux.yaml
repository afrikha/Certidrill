id: kcna-1d-windows-on-linux
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A cluster has only Linux worker nodes. A team wants to run a container image built for Windows Server. What is required?
body:
  options:
    - id: a
      text: { en: "Add Windows worker nodes, because a container uses the kernel of the node it runs on" }
    - id: b
      text: { en: "Set a RuntimeClass on the Pod so a Linux node can run the Windows image" }
    - id: c
      text: { en: "Rebuild the cluster with a Windows control plane" }
    - id: d
      text: { en: "Nothing: the container runtime emulates the Windows kernel on Linux" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Containers share the host's operating system kernel, so a Windows container needs a Windows host. To run Windows containers, a cluster must include Windows worker nodes; the control plane stays on Linux.
  options:
    b:
      en: |
        A RuntimeClass selects a runtime configuration on the node; it cannot provide a Windows kernel on a Linux host.
    c:
      en: |
        The Kubernetes control plane runs only on Linux; only worker nodes can be Windows.
    d:
      en: |
        Container runtimes do not emulate another kernel; containers share the host's kernel.
references:
  - title: "Windows containers in Kubernetes"
    url: https://kubernetes.io/docs/concepts/windows/intro/
  - title: "Overview"
    url: https://kubernetes.io/docs/concepts/overview/
