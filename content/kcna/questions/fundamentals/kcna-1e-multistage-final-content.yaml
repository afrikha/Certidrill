id: kcna-1e-multistage-final-content
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer builds an image from this Dockerfile.

    ```text
    FROM golang:1.25 AS build
    WORKDIR /src
    COPY . .
    RUN CGO_ENABLED=0 go build -o /out/api ./cmd/api

    FROM gcr.io/distroless/static
    COPY --from=build /out/api /api
    ENTRYPOINT ["/api"]
    ```

    What does the resulting image contain?
body:
  options:
    - id: a
      text: { en: "The distroless base and the `/api` binary only" }
    - id: b
      text: { en: "The Go toolchain, the source code and the `/api` binary" }
    - id: c
      text: { en: "The distroless base, the source code and the `/api` binary" }
    - id: d
      text: { en: "The layers of both stages merged into one image" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The image is built from the last stage, which starts from `gcr.io/distroless/static`. `COPY --from=build` copies only the compiled binary from the `build` stage. The Go toolchain and the source code stay in the `build` stage and are not part of the final image.
  options:
    b:
      en: |
        The Go toolchain and the sources belong to the `golang:1.25` stage. The final stage starts from a new base and receives only the file copied with `COPY --from`.
    c:
      en: |
        The source code was copied into the `build` stage only. The final stage copies one file, `/out/api`, and nothing else.
    d:
      en: |
        Stages are not merged. The image keeps the layers of the last stage, and an earlier stage contributes only the files that are explicitly copied from it.
references:
  - title: "docs/content/manuals/build/building/multi-stage.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/multi-stage.md
