id: kcna-1e-runtimeclass-handler
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator creates this RuntimeClass.

    ```yaml
    apiVersion: node.k8s.io/v1
    kind: RuntimeClass
    metadata:
      name: gvisor
    handler: runsc
    ```

    What must `runsc` match for Pods that use this RuntimeClass to start?
body:
  options:
    - id: a
      text: { en: "A runtime handler configured in the CRI runtime of the nodes" }
    - id: b
      text: { en: "The name of a container image stored in the cluster's registry" }
    - id: c
      text: { en: "A label that is set on the nodes that have gVisor installed" }
    - id: d
      text: { en: "The name of a DaemonSet that runs the gVisor binary on the nodes" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The `handler` names a runtime configuration of the node's CRI implementation, for example a `runsc` entry in the containerd or CRI-O configuration. Each handler configured on the nodes needs a matching RuntimeClass. If the node's runtime can't run that handler, the Pod fails.
  options:
    b:
      en: |
        The handler names a runtime configuration, not an image. Images are set in the Pod's containers.
    c:
      en: |
        Node labels are used by the optional `scheduling.nodeSelector` field of a RuntimeClass, not by `handler`.
    d:
      en: |
        The handler is configured in the node's CRI runtime. It doesn't refer to a Kubernetes workload object.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
