id: kcna-1b-crd-cluster-scope
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You define a CustomResourceDefinition for the kind `Tenant`. Each `Tenant` object must exist once for the whole cluster, not inside a namespace.

    What should you set in the CustomResourceDefinition?
body:
  options:
    - id: a
      text: { en: "`metadata.namespace: kube-system`" }
    - id: b
      text: { en: "`spec.names.kind: ClusterTenant`" }
    - id: c
      text: { en: "`spec.versions[0].served: false`" }
    - id: d
      text: { en: "`spec.scope: Cluster`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `spec.scope` decides whether the custom objects are `Namespaced` or `Cluster` scoped. With `Cluster`, `Tenant` objects have no namespace, like Nodes or Namespaces.
  options:
    a: { en: "A CustomResourceDefinition is itself cluster-scoped, and the namespace of the definition does not decide the scope of the custom objects." }
    b: { en: "The kind is only the type name; a name starting with Cluster does not change the scope." }
    c: { en: "`served: false` stops the API server from serving that version; it does not change the scope." }
references:
  - title: Extend the Kubernetes API with CustomResourceDefinitions
    url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
