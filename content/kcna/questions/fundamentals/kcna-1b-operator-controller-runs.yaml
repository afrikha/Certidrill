id: kcna-1b-operator-controller-runs
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You install an operator for a database in a cluster.

    Where does the operator's controller normally run?
body:
  options:
    - id: a
      text: { en: "Inside kube-controller-manager, compiled with the built-in controllers" }
    - id: b
      text: { en: "Inside etcd, next to the custom objects it manages" }
    - id: c
      text: { en: "As a workload in the cluster, such as a Deployment, calling the API" }
    - id: d
      text: { en: "Inside the kubelet process of every node" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Operators are clients of the Kubernetes API that act as controllers for a custom resource. The usual way to install one is to add the CustomResourceDefinition and its controller, which normally runs outside the control plane, for example as a Deployment.
  options:
    a: { en: "Operators extend the cluster without modifying Kubernetes code; kube-controller-manager runs only the built-in controllers." }
    b: { en: "etcd is the key-value store of the cluster state; it runs no controllers." }
    d: { en: "The kubelet runs the Pods assigned to its node; it does not host operator logic." }
references:
  - title: Operator pattern
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
