id: kcna-1b-replace-force
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You changed a field in `job.yaml` that is immutable after the object is created. A short interruption is acceptable.

    Which single command makes the cluster match the new file?
body:
  options:
    - id: a
      text: { en: "`kubectl apply -f job.yaml`" }
    - id: b
      text: { en: "`kubectl apply --server-side -f job.yaml`" }
    - id: c
      text: { en: "`kubectl replace --force -f job.yaml`" }
    - id: d
      text: { en: "`kubectl edit -f job.yaml`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An immutable field cannot be updated in place: the object must be deleted and created again. `kubectl replace --force` does both in one step, which causes downtime, so use it only when an in-place update is impossible.
  options:
    a: { en: "`kubectl apply` sends an update of the existing object, and the API server rejects changes to immutable fields." }
    b: { en: "Server-side apply also updates the existing object in place, so the change to the immutable field is rejected." }
    d: { en: "`kubectl edit` updates the live object in place; the API server rejects the change to the immutable field." }
references:
  - title: Managing Workloads
    url: https://kubernetes.io/docs/concepts/workloads/management/
