id: kcna-1a-iptables-mode-data-path
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    kube-proxy runs in `iptables` mode on a Linux node. How does a packet that a client Pod sends to a Service's cluster IP reach a backend Pod?
body:
  options:
    - id: a
      text: { en: "kube-proxy receives the packet in user space and opens a new connection to a Pod" }
    - id: b
      text: { en: "The kernel applies netfilter rules that kube-proxy wrote and redirects the packet to a backend" }
    - id: c
      text: { en: "CoreDNS rewrites the destination of the packet from the cluster IP to a Pod IP" }
    - id: d
      text: { en: "The kubelet of the destination node receives the packet and passes it to the runtime" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In `iptables` mode, the default on Linux in Kubernetes v1.37, kube-proxy configures packet forwarding rules through the kernel's netfilter subsystem. When a client connects to the Service's virtual IP, a rule picks a backend (at random, or by session affinity) and the kernel redirects the packets to it.
  options:
    a:
      en: |
        In `iptables` mode kube-proxy only programs rules; the kernel handles the packets.
    c:
      en: |
        DNS resolves a Service name to its cluster IP; it never touches packets.
    d:
      en: |
        The kubelet manages Pods; it plays no part in Service traffic.
references:
  - title: "Virtual IPs and Service Proxies"
    url: https://kubernetes.io/docs/reference/networking/virtual-ips/
