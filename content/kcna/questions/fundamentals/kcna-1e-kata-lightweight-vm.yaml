id: kcna-1e-kata-lightweight-vm
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which project runs containers inside lightweight virtual machines that use hardware virtualization, to give each workload its own kernel?
body:
  options:
    - id: a
      text: { en: "gVisor" }
    - id: b
      text: { en: "runc" }
    - id: c
      text: { en: "Kata Containers" }
    - id: d
      text: { en: "containerd" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kata Containers builds lightweight virtual machines that feel and perform like containers but provide the isolation of virtual machines. It requires hardware virtualization on the host and boots a guest kernel for the workload.
  options:
    a:
      en: |
        gVisor doesn't use a virtual machine by design: it runs an application kernel in user space that handles the container's system calls.
    b:
      en: |
        runc creates ordinary containers that share the host kernel, isolated with namespaces and cgroups.
    d:
      en: |
        containerd is a high-level runtime that manages containers. It can call Kata Containers as a runtime but doesn't create virtual machines itself.
references:
  - title: "GitHub - kata-containers/kata-containers"
    url: https://github.com/kata-containers/kata-containers
