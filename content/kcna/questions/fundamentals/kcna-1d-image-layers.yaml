id: kcna-1d-image-layers
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How is a container image structured?
body:
  options:
    - id: a
      text: { en: "As a single disk file that contains a full operating system and kernel" }
    - id: b
      text: { en: "As read-only layers plus a configuration, listed in a manifest" }
    - id: c
      text: { en: "As a running process that the registry snapshots" }
    - id: d
      text: { en: "As a script that installs the application on the node at startup" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An OCI image consists of filesystem layers (each a changeset applied in order), a configuration (entrypoint, environment and other runtime settings) and a manifest that references them by content address. Layers are shared between images and cached on nodes.
  options:
    a:
      en: |
        That describes a virtual machine disk image; a container image has no kernel and is split into layers.
    c:
      en: |
        An image is static content, not a process; a container is the running process started from it.
    d:
      en: |
        An image is already built; nothing is installed on the node when a container starts.
references:
  - title: "image-spec/spec.md at main · opencontainers/image-spec"
    url: https://github.com/opencontainers/image-spec/blob/main/spec.md
