id: kcna-1a-job-restartpolicy
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which `restartPolicy` values are allowed in the Pod template of a Job?
body:
  options:
    - id: a
      text: { en: "`Always` only" }
    - id: b
      text: { en: "`Always` or `OnFailure`" }
    - id: c
      text: { en: "`Never` or `OnFailure`" }
    - id: d
      text: { en: "Any value, because the Job controller ignores it" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Job's Pods must end, so only `restartPolicy: Never` or `OnFailure` is allowed, and the field must be set because the Pod default, `Always`, is not valid for a Job. With `OnFailure` a failed container is restarted in its Pod; with `Never` the Job creates a new Pod.
  options:
    a:
      en: |
        `Always` is the only value allowed for Deployments, whose Pods must keep running; it is not allowed for a Job.
    b:
      en: |
        `Always` would restart a container that has finished its work, so a Job rejects it.
    d:
      en: |
        The field is validated: a Job accepts only `Never` or `OnFailure`.
references:
  - title: "Jobs"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/job/
