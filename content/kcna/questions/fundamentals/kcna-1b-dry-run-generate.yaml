id: kcna-1b-dry-run-generate
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You want to start a manifest file for a new Deployment from an imperative command, without creating anything in the cluster.

    Which command does this?
body:
  options:
    - id: a
      text: { en: "`kubectl get deployment web -o yaml > web.yaml`" }
    - id: b
      text: { en: "`kubectl create deployment web --image=nginx:1.27 --dry-run=client > web.yaml`" }
    - id: c
      text: { en: "`kubectl create deployment web --image=nginx:1.27 -o yaml > web.yaml`" }
    - id: d
      text: { en: "`kubectl create deployment web --image=nginx:1.27 --dry-run=client -o yaml > web.yaml`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `--dry-run=client` stops kubectl from sending the object to the cluster, and `-o yaml` prints the object it would have created. The output is a manifest skeleton that you can edit, store in Git and apply later.
  options:
    a: { en: "`kubectl get` reads an object that already exists; the Deployment `web` has not been created yet." }
    b: { en: "Without `-o yaml`, the dry run prints only a one-line message saying the Deployment would be created, not a manifest." }
    c: { en: "Without `--dry-run=client`, the command really creates the Deployment in the cluster." }
references:
  - title: kubectl Quick Reference
    url: https://kubernetes.io/docs/reference/kubectl/quick-reference/
