id: kcna-1a-statefulset-scale-down-order
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A StatefulSet named `db` uses the default Pod management policy and runs `db-0`, `db-1` and `db-2`. You scale it down to one replica. What does the controller do?
body:
  options:
    - id: a
      text: { en: "It terminates `db-0` first, then `db-1` once `db-0` has fully shut down" }
    - id: b
      text: { en: "It terminates `db-2` first, then `db-1` once `db-2` has fully shut down" }
    - id: c
      text: { en: "It terminates `db-1` and `db-2` at the same time, without waiting" }
    - id: d
      text: { en: "It terminates two Pods that kube-scheduler picks on the busiest nodes" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With the default `OrderedReady` policy, StatefulSet Pods are terminated in reverse order, from N-1 to 0, and before a Pod is terminated all its successors must be completely shut down. The volumes of the removed Pods are kept.
  options:
    a:
      en: |
        StatefulSet Pods are removed in reverse ordinal order, starting with the highest ordinal.
    c:
      en: |
        That is the `Parallel` policy; the default `OrderedReady` policy handles one Pod at a time.
    d:
      en: |
        The ordinals decide which Pods go; the scheduler never deletes Pods.
references:
  - title: "StatefulSets"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
