id: kcna-1e-dockershim-version
objective: "1.4.4"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    In which Kubernetes version was dockershim removed from the kubelet?
body:
  options:
    - id: a
      text: { en: "v1.20" }
    - id: b
      text: { en: "v1.22" }
    - id: c
      text: { en: "v1.24" }
    - id: d
      text: { en: "v1.26" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      dockershim, the built-in adapter that let the kubelet drive Docker Engine, was removed in Kubernetes v1.24. Since then, nodes use a CRI runtime such as containerd or CRI-O, or Docker Engine through the external `cri-dockerd` adapter.
  options:
    a:
      en: |
        v1.20 is the release in which the removal of dockershim was announced. dockershim was still part of the kubelet.
    b:
      en: |
        dockershim was still included in v1.22. It was removed two minor releases later.
    d:
      en: |
        v1.26 is the release from which the kubelet requires the CRI `v1` API. dockershim had already been removed in v1.24.
references:
  - title: "Updated: Dockershim Removal FAQ"
    url: https://kubernetes.io/blog/2022/02/17/dockershim-faq/
  - title: "Container Runtimes"
    url: https://kubernetes.io/docs/setup/production-environment/container-runtimes/
