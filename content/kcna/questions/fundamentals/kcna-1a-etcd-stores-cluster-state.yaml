id: kcna-1a-etcd-stores-cluster-state
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Kubernetes component is the consistent, highly available key-value store that holds all cluster data?
body:
  options:
    - id: a
      text: { en: "kube-apiserver" }
    - id: b
      text: { en: "etcd" }
    - id: c
      text: { en: "kube-scheduler" }
    - id: d
      text: { en: "kube-controller-manager" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      etcd is the consistent and highly available key-value store that Kubernetes uses as the backing store for all cluster data. Because the whole cluster state lives there, a cluster that uses etcd needs a backup plan for it.
  options:
    a:
      en: |
        kube-apiserver serves the Kubernetes API and reads and writes the cluster data, but it keeps none of it: it persists objects in etcd.
    c:
      en: |
        kube-scheduler only chooses a node for Pods that have none; it stores no cluster data.
    d:
      en: |
        kube-controller-manager runs the built-in controllers, which read and change objects through the API server; it does not store them.
references:
  - title: "Kubernetes Components"
    url: https://kubernetes.io/docs/concepts/overview/components/
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
