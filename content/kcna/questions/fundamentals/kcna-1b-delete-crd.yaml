id: kcna-1b-delete-crd
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator deletes the CustomResourceDefinition `backups.example.com` while 20 `Backup` objects exist in the cluster.

    What happens to the 20 `Backup` objects?
body:
  options:
    - id: a
      text: { en: "They stay in etcd and come back if the CRD is recreated" }
    - id: b
      text: { en: "They are deleted together with the CRD's API endpoint" }
    - id: c
      text: { en: "The deletion is rejected while any `Backup` object exists" }
    - id: d
      text: { en: "They are converted into ConfigMaps in their namespaces" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Deleting a CustomResourceDefinition uninstalls its RESTful endpoint and deletes all the custom objects stored in it. If the CRD is created again, it starts empty, so treat CRD deletion as destructive.
  options:
    a: { en: "The custom objects are deleted, not kept: a recreated CRD starts with no objects." }
    c: { en: "The API server does not block the deletion of a CRD that still has objects; it deletes them." }
    d: { en: "Kubernetes never converts custom objects into ConfigMaps." }
references:
  - title: Extend the Kubernetes API with CustomResourceDefinitions
    url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
