id: kcna-1d-nodename-bypass
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod manifest sets `spec.nodeName: node-3`. How is this Pod placed?
body:
  options:
    - id: a
      text: { en: "The scheduler ignores it and the kubelet on `node-3` tries to run it" }
    - id: b
      text: { en: "The scheduler checks `node-3` first and falls back to another node" }
    - id: c
      text: { en: "The scheduler treats it as a preferred node affinity for `node-3`" }
    - id: d
      text: { en: "The API server rejects it because only the scheduler may set `nodeName`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When `nodeName` is not empty, the scheduler ignores the Pod and the kubelet of the named node tries to run it, overruling `nodeSelector` and affinity rules. If that node lacks resources, the Pod fails instead of being placed elsewhere.
  options:
    b:
      en: |
        There is no fallback: with `nodeName` set, the scheduler does not handle the Pod at all.
    c:
      en: |
        `nodeName` is a direct assignment, not a scoring preference.
    d:
      en: |
        Users can set `nodeName`; it is meant for custom schedulers and advanced use cases.
references:
  - title: "Assigning Pods to Nodes"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
