id: kcna-1c-kubeadm-join-token
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The output of `kubeadm init` prints a `kubeadm join` command that contains a token. Why must this token be kept secret?
body:
  options:
    - id: a
      text: { en: "It is the password of the admin kubeconfig" }
    - id: b
      text: { en: "Anyone who has it can add authenticated nodes to the cluster" }
    - id: c
      text: { en: "It decrypts the Secrets stored in etcd" }
    - id: d
      text: { en: "It is the private key of the cluster certificate authority" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The bootstrap token provides mutual authentication between the control plane and the nodes that join. Anyone who holds it can add authenticated nodes to the cluster, so it must be protected; `kubeadm token` lists, creates and deletes such tokens.
  options:
    a:
      en: |
        Administrator access comes from the admin kubeconfig file and its credentials, not from the join token.
    c:
      en: |
        The join token plays no part in encrypting Secrets at rest; that is configured on the API server.
    d:
      en: |
        The CA private key stays on the control plane. The join command only carries a hash of the CA certificate so that nodes can verify the control plane.
references:
  - title: Creating a cluster with kubeadm
    url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/
