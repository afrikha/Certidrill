id: kcna-1a-selector-ne-missing-label
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A namespace contains these Pods:

    ```text
    NAME    LABELS
    web-1   app=web,tier=cache
    web-2   app=web,tier=frontend
    web-3   app=web
    api-1   app=api,tier=frontend
    ```

    Which Pods does `kubectl get pods -l 'app=web,tier!=cache'` return?
body:
  options:
    - id: a
      text: { en: "`web-2` only" }
    - id: b
      text: { en: "`web-2` and `web-3`" }
    - id: c
      text: { en: "`web-2`, `web-3` and `api-1`" }
    - id: d
      text: { en: "`web-1` only" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Requirements separated by a comma are ANDed. `app=web` keeps `web-1`, `web-2` and `web-3`; `tier!=cache` then drops `web-1` and keeps the Pods whose `tier` differs from `cache` or that have no `tier` label at all, such as `web-3`.
  options:
    a:
      en: |
        `!=` also matches objects that have no `tier` label at all, so `web-3` is returned too.
    c:
      en: |
        The comma is a logical AND: `api-1` fails `app=web`.
    d:
      en: |
        `web-1` is the only `app=web` Pod excluded by `tier!=cache`.
references:
  - title: "Labels and Selectors"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
