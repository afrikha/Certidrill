id: kcna-1a-daemonset-subset-nodes
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A monitoring agent must run as exactly one Pod on every node that has the label `hardware=gpu`, including GPU nodes added later, and on no other node. The agent must be managed through the Kubernetes API. What should you create?
body:
  options:
    - id: a
      text: { en: "A Deployment with one replica per GPU node and `nodeSelector: {hardware: gpu}`" }
    - id: b
      text: { en: "A DaemonSet whose Pod template has `nodeSelector: {hardware: gpu}`" }
    - id: c
      text: { en: "A static Pod manifest copied into the kubelet folder of each GPU node" }
    - id: d
      text: { en: "A StatefulSet with one replica per GPU node and `nodeSelector: {hardware: gpu}`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A DaemonSet runs one copy of a Pod on all eligible nodes and adds Pods to matching nodes as they join. With `.spec.template.spec.nodeSelector` (or node affinity), the DaemonSet controller creates Pods only on the nodes that match.
  options:
    a:
      en: |
        A Deployment doesn't place one Pod per node, and its replica count doesn't follow nodes that are added later.
    c:
      en: |
        Static Pods cannot be managed with kubectl or other API clients, and new nodes would need the file copied by hand.
    d:
      en: |
        A StatefulSet gives Pods stable identities, but it doesn't run one Pod per node or follow new nodes.
references:
  - title: "DaemonSet"
    url: https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
