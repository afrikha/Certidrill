id: kcna-1b-kubectl-edit
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want to open the live Deployment `web` in a text editor, change a field and have the change sent to the cluster when you save and close the editor.

    Which command do you use?
body:
  options:
    - id: a
      text: { en: "`kubectl describe deployment web`" }
    - id: b
      text: { en: "`kubectl get deployment web -o yaml`" }
    - id: c
      text: { en: "`kubectl edit deployment web`" }
    - id: d
      text: { en: "`kubectl explain deployment`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubectl edit` opens the live resource in the default editor and sends your changes to the API server when you save. It is useful for one-off adjustments; changes made this way are not recorded in any manifest file.
  options:
    a: { en: "`kubectl describe` displays the detailed state of an object; it cannot change it." }
    b: { en: "`kubectl get -o yaml` prints the object; editing that output changes nothing in the cluster." }
    d: { en: "`kubectl explain` shows the documentation of the fields of a resource type, not a live object." }
references:
  - title: Command line tool (kubectl)
    url: https://kubernetes.io/docs/reference/kubectl/
