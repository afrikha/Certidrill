id: kcna-1d-oci-distribution-spec
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which Open Container Initiative (OCI) specification standardizes the API used to push images to and pull images from a registry?
body:
  options:
    - id: a
      text: { en: "The image specification" }
    - id: b
      text: { en: "The runtime specification" }
    - id: c
      text: { en: "The Container Runtime Interface (CRI)" }
    - id: d
      text: { en: "The distribution specification" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The OCI, a Linux Foundation project launched in 2015, maintains three specifications: the runtime spec, the image spec and the distribution spec. The distribution spec standardizes the API for distributing container images, which registries implement.
  options:
    a:
      en: |
        The image spec defines the image format (manifest, layers, configuration), not the registry API.
    b:
      en: |
        The runtime spec defines how to run a container from an unpacked file system bundle.
    c:
      en: |
        The CRI is the Kubernetes API between the kubelet and the container runtime, not an OCI specification.
references:
  - title: "About the Open Container Initiative"
    url: https://opencontainers.org/about/overview/
