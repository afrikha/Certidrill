id: kcna-1a-annotation-build-info
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want to record a build number and the owning team's contact address on a Deployment. Tools will read these values, but nothing will ever select objects by them. What should you use?
body:
  options:
    - id: a
      text: { en: "Annotations" }
    - id: b
      text: { en: "Labels" }
    - id: c
      text: { en: "A ConfigMap mounted in the Pods" }
    - id: d
      text: { en: "A separate namespace per build" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Annotations attach arbitrary, non-identifying metadata to objects, such as build or release information and the contact details of the people responsible. Clients such as tools can read them, but annotations are not used to identify and select objects.
  options:
    b:
      en: |
        Labels are identifying attributes used by selectors; non-identifying information belongs in annotations.
    c:
      en: |
        A ConfigMap provides configuration to containers; it doesn't describe the Deployment object.
    d:
      en: |
        Namespaces isolate groups of resources; they are not a place for descriptive metadata.
references:
  - title: "Annotations"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
