id: kcna-1b-api-aggregation
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team needs a new Kubernetes API. Its objects must be kept in the team's own storage back end instead of etcd, and the API must offer custom subresources such as `logs`.

    Which extension mechanism fits?
body:
  options:
    - id: a
      text: { en: "An extension API server behind the API aggregation layer" }
    - id: b
      text: { en: "A CustomResourceDefinition with an OpenAPI v3 schema" }
    - id: c
      text: { en: "A ConfigMap that an operator reads and updates" }
    - id: d
      text: { en: "A kubectl plugin installed on every workstation" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      API aggregation requires programming and running an extra API server, but it gives full control over the API: custom storage and subresources such as `logs` or `exec`. CRDs need no programming, but the kube-apiserver stores their objects and they support neither custom storage nor such subresources.
  options:
    b: { en: "CRD objects are stored by the kube-apiserver, and CRDs offer only the status and scale subresources, not custom ones such as `logs`." }
    c: { en: "A ConfigMap is plain configuration data in etcd; it adds no API and no subresource." }
    d: { en: "kubectl plugins change only a user's local command line; they add nothing to the API." }
references:
  - title: Custom Resources
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
