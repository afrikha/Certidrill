id: kcna-1b-current-context
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before running a delete command, you want to check which context kubectl will use.

    Which command prints only the name of the current context?
body:
  options:
    - id: a
      text: { en: "`kubectl cluster-info`" }
    - id: b
      text: { en: "`kubectl config current-context`" }
    - id: c
      text: { en: "`kubectl config view --raw`" }
    - id: d
      text: { en: "`kubectl get namespaces`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubectl config current-context` displays the name of the context that kubectl uses by default. `kubectl config get-contexts` lists all contexts and marks the current one.
  options:
    a: { en: "`kubectl cluster-info` shows addresses of the control plane and cluster services, not the context name." }
    c: { en: "`kubectl config view --raw` prints the whole merged configuration, including certificate data, not just the context name." }
    d: { en: "`kubectl get namespaces` lists the namespaces of whichever cluster is current, without naming the context." }
references:
  - title: kubectl Quick Reference
    url: https://kubernetes.io/docs/reference/kubectl/quick-reference/
