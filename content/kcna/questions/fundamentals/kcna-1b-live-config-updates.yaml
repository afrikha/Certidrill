id: kcna-1b-live-config-updates
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application rereads its configuration files when they change. The team wants changes made to a ConfigMap to reach the running containers without restarting them.

    Which way of consuming the ConfigMap meets this goal?
body:
  options:
    - id: a
      text: { en: "Set each value as a variable with `env` and `configMapKeyRef`" }
    - id: b
      text: { en: "Import all keys as variables with `envFrom` and `configMapRef`" }
    - id: c
      text: { en: "Mount the ConfigMap as a volume on a directory such as `/etc/app`" }
    - id: d
      text: { en: "Mount one key as a single file with a `subPath` volume mount" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A ConfigMap mounted as a volume is updated automatically: the kubelet refreshes the projected files on its periodic sync, so the change arrives after a delay without a restart. The application must then reread the files.
  options:
    a: { en: "Environment variables are read when the container starts and are not updated when the ConfigMap changes." }
    b: { en: "`envFrom` also creates environment variables, which keep their start-up values until a restart." }
    d: { en: "A container that uses a ConfigMap through a `subPath` volume mount does not receive ConfigMap updates." }
references:
  - title: ConfigMaps
    url: https://kubernetes.io/docs/concepts/configuration/configmap/
