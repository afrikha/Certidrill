id: kcna-1c-memory-400m-pitfall
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer writes this container resource request. How much memory does it actually request?

    ```yaml
    resources:
      requests:
        memory: 400m
    ```
body:
  options:
    - id: a
      text: { en: "400 mebibytes" }
    - id: b
      text: { en: "400 megabytes" }
    - id: c
      text: { en: "0.4 bytes" }
    - id: d
      text: { en: "40 % of the node's memory" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Suffixes are case-sensitive: `m` means milli, so `400m` of memory is 0.4 bytes. The developer probably meant `400Mi` (mebibytes) or `400M` (megabytes).
  options:
    a:
      en: |
        400 mebibytes is written `400Mi`.
    b:
      en: |
        400 megabytes is written `400M`, with a capital M.
    d:
      en: |
        Resource quantities are absolute values, never percentages of the node.
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
