# KCNA — Kubernetes and Cloud Native Associate
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-23):
#   - Certification page: https://training.linuxfoundation.org/certification/kubernetes-cloud-native-associate/
#     (online, proctored, multiple-choice exam; 90 minutes; two exam attempts ("One Retake");
#     12 months to schedule and take the exam; certification valid 2 years; no prerequisites;
#     domains 44 / 28 / 16 / 12 %).
#   - Curriculum PDF: https://github.com/cncf/curriculum/blob/master/KCNA_Curriculum.pdf (raw file read;
#     3 pages, NO version number printed, PDF created 2026-03-22). It lists domains and competency
#     names only, no bullet points (see objectives.yaml).
#   - Program changes page: https://training.linuxfoundation.org/kcna-program-changes/ (new domains
#     effective "no earlier than November 24, 2025"; Observability moved under Cloud Native Architecture).
#   - Multiple Choice Exams: Important Instructions (docs.linuxfoundation.org/tc-docs/certification/
#     important-instructions-mc): 60 multiple-choice questions, 90 minutes (CNPA excepted: 85 / 120).
#   - Multiple Choice Exams: FAQ (…/faq-mc): pass at 75 % or above, scored automatically, score report by
#     email within 24 hours.
#   - Candidate handbook, Language page (…/lf-handbook2/language): KCNA in English, Japanese (Japanese-only
#     version) and Simplified Chinese (Chinese-only version). French is NOT offered.
#   - Handbook, ExamUI: Multiple Choice Exams and Exam Scoring pages: no mention of multiple-answer items,
#     no partial credit, no per-item feedback.
# Version: neither the curriculum version nor the Kubernetes version of the KCNA exam is published.
# blueprint.version = 'v1.37', the Kubernetes version of the Linux Foundation Kubernetes exams
# ("The exam is based on Kubernetes v1.37", CKA certification page) and the latest minor release
# listed on kubernetes.io/releases on 2026-11-23. Content is written for Kubernetes v1.37.
# Exam facts: 60 single-answer multiple-choice questions, 90 minutes, pass at 75 %, the score is a
# percentage (maxScore 100). Two attempts per purchase (one retake).
# Languages offered by the vendor: English, Japanese, Simplified Chinese -> Certidrill: English only.
# Readiness and progression: the AZ-900 rules, with every score threshold divided by 10 because
# the score here is out of 100, not 1,000 (800 -> 80, 650 -> 65, scale 600–850 -> 60–85,
# xp.scoreFrom 400 -> 40 and perPoint 0.5 -> 5 for the same XP, domainGain 50 -> 5,
# mastery 650/700/850 -> 65/70/85, hatTrick min 800 -> 80, comeback gain 150 -> 15).
# active: false until the bank and the course are reviewed and published.
certification:
  code: kcna
  title: Kubernetes and Cloud Native Associate
  vendor: CNCF
  languages: [en]
  active: false
blueprint:
  version: 'v1.37'
  durationMin: 90
  questionCount:
    min: 60
    max: 60
  passScore: 75
  maxScore: 100
  # The handbook mentions no multiple-answer item; stated for completeness (no partial credit).
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing
  # The real exam has single-answer multiple-choice questions only.
  typeMix:
    single:
      min: 1
      max: 1
  difficultyMix:
    easy: 0.4
    medium: 0.45
    hard: 0.15
  structure:
    caseStudies:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
      placement: end
    series:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
    maxPerObjective: 2
    warningsMin:
    - 10
    - 5
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 80
      domainFloor: 65
      recent: 3
      window: 5
      scale:
        from: 60
        to: 85
      weights:
        level: 0.5
        consistency: 0.2
        domains: 0.2
        freshness: 0.1
      bands:
        progressing: 50
        almost: 70
        ready: 85
      freshness:
        staleDays: 30
        zeroDays: 90
        minNewShare: 0.5
    progression:
      xp:
        base: 50
        scoreFrom: 40
        perPoint: 5
        knownShare: 0.5
        passBonus: 100
        bestBonus: 75
        domainBonus: 50
        domainGain: 5
      levels:
      - xp: 0
        title:
          en: Container curious
      - xp: 150
        title:
          en: Pod watcher
      - xp: 400
        title:
          en: Manifest reader
      - xp: 750
        title:
          en: kubectl apprentice
      - xp: 1200
        title:
          en: Service wrangler
      - xp: 1750
        title:
          en: Deployment pilot
      - xp: 2400
        title:
          en: Cluster navigator
      - xp: 3150
        title:
          en: Cloud native insider
      - xp: 4000
        title:
          en: Kubernetes associate
      - xp: 5000
        title:
          en: Cloud native legend
      mastery:
        bronze: 65
        silver: 70
        gold: 85
      badges:
        hatTrick:
          count: 3
          min: 80
        regular:
          weeks: 4
        comeback:
          gain: 15
domains:
- code: fundamentals
  order: 1
  weight:
    min: 0.44
    max: 0.44
  title:
    en: Kubernetes Fundamentals
- code: orchestration
  order: 2
  weight:
    min: 0.28
    max: 0.28
  title:
    en: Container Orchestration
- code: delivery
  order: 3
  weight:
    min: 0.16
    max: 0.16
  title:
    en: Cloud Native Application Delivery
- code: architecture
  order: 4
  weight:
    min: 0.12
    max: 0.12
  title:
    en: Cloud Native Architecture
