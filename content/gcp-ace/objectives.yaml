# Google Cloud Associate Cloud Engineer objectives.
# Source: Associate Cloud Engineer Certification exam guide (standard exam),
# https://services.google.com/fh/files/misc/associate_cloud_engineer_exam_guide_english.pdf, read on 2026-11-27
# (no version date printed). Four sections, groups = the guide's subsections (1.1, 1.2…), objectives = their bullets,
# English verbatim. Codes <section>.<subsection>.<n>; English only on Certidrill.
setup:
- group:
    en: Setting up cloud projects and accounts
  objectives:
  - code: 1.1.1
    en: Creating a resource hierarchy
  - code: 1.1.2
    en: Applying organizational policies to the resource hierarchy
  - code: 1.1.3
    en: Granting members Identity and Access Management (IAM) roles within a project
  - code: 1.1.4
    en: Managing users and groups in Cloud Identity (manually and automated)
  - code: 1.1.5
    en: Enabling APIs within projects
  - code: 1.1.6
    en: Provisioning and setting up products in Google Cloud Observability
  - code: 1.1.7
    en: Assessing quotas and requesting increases
  - code: 1.1.8
    en: Setting up standalone organizations
  - code: 1.1.9
    en: Setting up cloud networking
  - code: 1.1.10
    en: Verifying product availability across geographical locations (e.g., regions, zones)
  - code: 1.1.11
    en: Configuring Cloud Asset Inventory and using Gemini Cloud Assist to analyze resources
  - code: 1.1.12
    en: Configuring Workforce Identity Federation
- group:
    en: Managing billing configuration
  objectives:
  - code: 1.2.1
    en: Creating one or more billing accounts
  - code: 1.2.2
    en: Linking projects to a billing account
  - code: 1.2.3
    en: Establishing billing budgets and alerts
  - code: 1.2.4
    en: Setting up billing exports
planning:
- group:
    en: Planning and implementing compute resources
  objectives:
  - code: 2.1.1
    en: Selecting appropriate compute choices for a given workload (e.g., Compute Engine, Google Kubernetes Engine [GKE], Cloud Run, Cloud Run functions, Agent Runtime on Gemini Enterprise Agent Platform [formerly Vertex AI Agent Engine])
  - code: 2.1.2
    en: Launching a compute instance (e.g., availability policy, SSH keys)
  - code: 2.1.3
    en: Choosing the appropriate storage for Compute Engine (e.g., zonal Persistent Disk, regional Persistent Disk, Google Cloud Hyperdisk)
  - code: 2.1.4
    en: Creating an autoscaled managed instance group by using an instance template
  - code: 2.1.5
    en: Configuring OS Login
  - code: 2.1.6
    en: Configuring VM Manager
  - code: 2.1.7
    en: Using Spot VM instances and custom machine types
  - code: 2.1.8
    en: Installing and configuring the command-line interface (CLI) for Kubernetes (kubectl)
  - code: 2.1.9
    en: Deploying a GKE cluster with different configurations (e.g., GKE Autopilot, regional clusters, private clusters)
  - code: 2.1.10
    en: Deploying a containerized application to GKE
  - code: 2.1.11
    en: Deploying an application to serverless compute platforms, including for the processing of Google Cloud events (e.g., Pub/Sub events, Cloud Storage object change notification events, Eventarc)
  - code: 2.1.12
    en: Identifying whether to use GPUs or TPUs
- group:
    en: Planning and implementing storage and data solutions
  objectives:
  - code: 2.2.1
    en: Choosing and deploying data products (e.g., Cloud SQL, BigQuery, Firestore, Spanner, Bigtable, AlloyDB, Dataflow, Pub/Sub, Google Cloud Managed Service for Apache Kafka, Memorystore)
  - code: 2.2.2
    en: Choosing and deploying storage products (e.g., Cloud Storage, Filestore, Google Cloud NetApp Volumes, Google Cloud Managed Lustre) and Cloud Storage options (e.g., Standard, Nearline, Coldline, Archive)
  - code: 2.2.3
    en: Loading data (e.g., command-line upload, load data from Cloud Storage, Storage Transfer Service)
  - code: 2.2.4
    en: Maintaining multi-region redundancy across data solutions
- group:
    en: Planning and implementing networking resources
  objectives:
  - code: 2.3.1
    en: Creating a VPC with subnets (e.g., custom mode VPC, Shared VPC, VPC Network Peering)
  - code: 2.3.2
    en: Creating and applying VPC firewalls rules and Cloud Next Generation Firewall (Cloud NGFW) policies with ingress and egress rules and attributes (e.g., action, source, destination, targets, protocols, ports)
  - code: 2.3.3
    en: Using Tags (e.g., secure Tags) and service accounts in Cloud NGFW policy rules
  - code: 2.3.4
    en: Establishing network connectivity (e.g., Cloud VPN, VPC Network Peering, Cloud Interconnect)
  - code: 2.3.5
    en: Choosing and deploying load balancers
  - code: 2.3.6
    en: Differentiating Network Service Tiers
- group:
    en: Planning and implementing resources using tooling
  objectives:
  - code: 2.4.1
    en: Infrastructure as Code tooling (e.g., Fabric FAST, Config Connector, Terraform, Helm)
  - code: 2.4.2
    en: AI-assisted planning and implementation (e.g., Gemini CLI, Google Antigravity, Gemini Cloud Assist, Application Design Center)
operations:
- group:
    en: Managing compute resources
  objectives:
  - code: 3.1.1
    en: Remotely connecting to a Compute Engine instance
  - code: 3.1.2
    en: Viewing current running Compute Engine instances
  - code: 3.1.3
    en: Working with snapshots and images (e.g., create, view, and delete images or snapshots; schedule a snapshot)
  - code: 3.1.4
    en: Viewing current running GKE cluster inventory (e.g., nodes, Pods, Services)
  - code: 3.1.5
    en: Configuring GKE to access Artifact Registry
  - code: 3.1.6
    en: Working with GKE node pools (e.g., add, edit, or remove a node pool; autoscaling node pool)
  - code: 3.1.7
    en: Working with Kubernetes resources (e.g., Pods, Services, StatefulSets)
  - code: 3.1.8
    en: Managing horizontal and vertical Pod autoscaling configurations
  - code: 3.1.9
    en: Managing GKE Autopilot Pod resource requests
  - code: 3.1.10
    en: Deploying new versions of a Cloud Run application
  - code: 3.1.11
    en: Adjusting application traffic splitting parameters (e.g., Cloud Run, Cloud Run functions, GKE)
  - code: 3.1.12
    en: Configuring autoscaling for a Cloud Run application
  - code: 3.1.13
    en: Attaching GPUs and TPUs
  - code: 3.1.14
    en: Deploying an agent to Agent Runtime on Gemini Enterprise Agent Platform (formerly Vertex AI Agent Engine)
  - code: 3.1.15
    en: Managing notebooks in Gemini Enterprise Agent Platform Workbench (formerly Vertex AI Workbench) and BigQuery
  - code: 3.1.16
    en: Managing developer environments (e.g., Cloud Workstations)
- group:
    en: Managing storage and data solutions
  objectives:
  - code: 3.2.1
    en: Managing and securing objects in Cloud Storage buckets
  - code: 3.2.2
    en: Setting object lifecycle management policies for Cloud Storage buckets
  - code: 3.2.3
    en: Executing queries to retrieve data from data instances (e.g., Cloud SQL, BigQuery, Bigtable, Spanner, Firestore, AlloyDB)
  - code: 3.2.4
    en: Estimating costs of data storage resources
  - code: 3.2.5
    en: Backing up and restoring database instances (e.g., Cloud SQL, Firestore, Spanner, AlloyDB, Bigtable)
  - code: 3.2.6
    en: Reviewing job status (e.g., Dataflow, BigQuery)
  - code: 3.2.7
    en: Using Database Center to manage the Google Cloud database fleet
  - code: 3.2.8
    en: Configuring customer-managed encryption keys (CMEK)
- group:
    en: Managing networking resources
  objectives:
  - code: 3.3.1
    en: Resizing a subnet's IPv4 address range
  - code: 3.3.2
    en: Reserving static external or internal IP addresses
  - code: 3.3.3
    en: Adding custom static routes in a VPC
  - code: 3.3.4
    en: Using Cloud DNS and Cloud NAT
  - code: 3.3.5
    en: Managing VPC firewall rules and Cloud NGFW policies
- group:
    en: Monitoring and logging
  objectives:
  - code: 3.4.1
    en: Creating Cloud Monitoring alerts based on resource metrics
  - code: 3.4.2
    en: Creating and ingesting Cloud Monitoring custom metrics (e.g., from applications or logs)
  - code: 3.4.3
    en: Configuring audit logs (e.g., VPC Flow Logs, audit logs, firewall logs)
  - code: 3.4.4
    en: Exporting logs to external systems (e.g., on-premises, BigQuery)
  - code: 3.4.5
    en: Configuring log buckets, log analytics, and log routers
  - code: 3.4.6
    en: Viewing and filtering logs in Cloud Logging
  - code: 3.4.7
    en: Viewing specific log message details in Cloud Logging
  - code: 3.4.8
    en: Using cloud diagnostic tools (e.g., Cloud Trace, Cloud Profiler, Query Insights, index advisor) to investigate an application issue
  - code: 3.4.9
    en: Viewing the Personalized Service Health dashboard
  - code: 3.4.10
    en: Configuring and deploying Ops Agent
  - code: 3.4.11
    en: Deploying Google Cloud Managed Service for Prometheus
  - code: 3.4.12
    en: Using Gemini Cloud Assist for Cloud Monitoring
  - code: 3.4.13
    en: Using Active Assist to optimize resource utilization
  - code: 3.4.14
    en: Using Cloud Hub to monitor active events and application health data
security:
- group:
    en: Managing IAM
  objectives:
  - code: 4.1.1
    en: Viewing and creating IAM policies
  - code: 4.1.2
    en: Attaching roles and policy inheritance in the Organization hierarchy
  - code: 4.1.3
    en: Managing the various role types and defining custom IAM roles
- group:
    en: Managing service accounts
  objectives:
  - code: 4.2.1
    en: Creating service accounts, including Google-managed service accounts
  - code: 4.2.2
    en: Using service accounts in IAM policies with minimum permissions
  - code: 4.2.3
    en: Assigning service accounts to resources
  - code: 4.2.4
    en: Managing IAM permissions of a service account
  - code: 4.2.5
    en: Managing service account impersonation
  - code: 4.2.6
    en: Creating and managing short-lived service account credentials
  - code: 4.2.7
    en: Using a Google Cloud service account with a GKE application
  - code: 4.2.8
    en: Provisioning Workload Identity Federation
