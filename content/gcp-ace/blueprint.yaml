# Google Cloud Associate Cloud Engineer (gcp-ace)
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-27):
#   - Certification page: https://cloud.google.com/learn/certification/cloud-engineer (standard exam: 2 hours,
#     50–60 multiple choice and multiple select questions, $125, English, Japanese, Spanish and Portuguese, online or
#     test-centre proctoring, valid 3 years, no prerequisite, 6+ months of hands-on Google Cloud experience recommended;
#     no case study).
#   - Exam guide (standard): services.google.com/fh/files/misc/associate_cloud_engineer_exam_guide_english.pdf
#     (no date printed): sections ~20 / ~30 / ~30 / ~20 %.
# Google publishes a pass/fail result, no score and no passing score: the mock exam scores in percent and passes at
# 70 % (Certidrill's assumption, same as gcp-pca).
# Languages offered by the vendor: English, Japanese, Spanish, Portuguese -> Certidrill: English only.
# active: false until the bank and the course are reviewed and published.
