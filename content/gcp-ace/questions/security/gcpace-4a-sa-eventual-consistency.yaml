id: gcpace-4a-sa-eventual-consistency
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An onboarding script runs `gcloud iam service-accounts create` and, in the next line, `gcloud projects add-iam-policy-binding` to grant the new account a role. About one run in five fails at the second step with an error saying that the service account doesn't exist. When you rerun the second step a few minutes later by hand, it succeeds.

    What should you change in the script?
body:
  options:
    - id: a
      text:
        en: |-
          Wait at least 60 seconds after the creation, and retry the grant with exponential backoff if it still fails.
    - id: b
      text:
        en: |-
          Add `--display-name` to the creation command so that the account is registered immediately in IAM.
    - id: c
      text:
        en: |-
          Run the `add-iam-policy-binding` step before the creation step so that the binding is ready for the account.
    - id: d
      text:
        en: |-
          Grant the script's identity Service Account Admin instead of Create Service Accounts on the project.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Service account creation is eventually consistent: a new account can take 60 seconds or more to be usable everywhere. Google recommends waiting after creating it and retrying failed reads or uses with exponential backoff.
  options:
    b:
      en: |-
        The display name is only a label shown in the console; it doesn't affect how quickly the account propagates.
    c:
      en: |-
        A role can't be granted to a service account that doesn't exist yet, so the binding step would fail every time.
    d:
      en: |-
        The error isn't a permission problem, since the same step succeeds later with the same identity; a broader role changes nothing.
references:
  - title: "Create service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-accounts-create
