id: gcpace-4a-move-project-inheritance
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The project `claims-api` is in the folder `Dev`. The group `dev-team@example.com` has the Compute Instance Admin (v1) role on the `Dev` folder, and the group `api-owners@example.com` has the Cloud Run Admin role granted directly on the project. The folder `Prod` grants the Compute Viewer role to `ops-team@example.com`. You move the project from `Dev` to `Prod`.

    What is the effect on access to the project?
body:
  options:
    - id: a
      text:
        en: |-
          All three groups keep or gain their roles, because the project keeps a copy of the bindings that it inherited from `Dev`.
    - id: b
      text:
        en: |-
          `api-owners` loses Cloud Run Admin, `dev-team` keeps Compute Instance Admin, and `ops-team` gains Compute Viewer.
    - id: c
      text:
        en: |-
          `api-owners` keeps Cloud Run Admin, `dev-team` loses Compute Instance Admin, and `ops-team` gains Compute Viewer.
    - id: d
      text:
        en: |-
          Nothing changes until you run `gcloud projects set-iam-policy` on the project to refresh its inherited bindings.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Roles granted directly on a project are part of its own allow policy and move with it. Inherited roles come from the current ancestors, so after the move the project stops inheriting from `Dev` and starts inheriting from `Prod`.
  options:
    a:
      en: |-
        Inherited bindings are never copied into the project's allow policy; they disappear when the project leaves the folder.
    b:
      en: |-
        This reverses the rule: the direct binding stays with the project, and the folder binding stays with the folder.
    d:
      en: |-
        Inheritance follows the hierarchy automatically; no command is needed to apply the new parent's policies.
references:
  - title: "Migrate projects between organization resources | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/project-migration
  - title: "About resource hierarchy | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
