id: gcpace-4b-vm-default-scope-403
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A VM was created in the console with the Compute Engine default service account and the access scope option "Allow default access". Later, an administrator granted `roles/storage.objectCreator` on the bucket `gs://ml-output` to that service account.

    Every upload from the application on the VM to `gs://ml-output` fails with the error "Request had insufficient authentication scopes".

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant `roles/storage.objectAdmin` on the bucket to the Compute Engine default service account.
    - id: b
      text:
        en: |-
          Stop the VM, set its access scopes to `cloud-platform` with `gcloud compute instances set-service-account`, and start the VM.
    - id: c
      text:
        en: |-
          Run `gcloud services enable storage.googleapis.com` in the project so that the VM can write to Cloud Storage.
    - id: d
      text:
        en: |-
          Grant the Compute Engine default service account the Service Account Token Creator role on itself.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Access scopes and IAM must both allow a call. The default scopes give Cloud Storage read-only access (`devstorage.read_only`), so writes fail even though the IAM role allows them. Setting the `cloud-platform` scope (the VM must be stopped to change scopes) leaves IAM as the only control.
  options:
    a:
      en: |-
        The error is about scopes, not IAM; a broader role does not lift the read-only scope.
    c:
      en: |-
        The error is about the scopes of the token; enabling an API does not change the scopes of the tokens the VM receives.
    d:
      en: |-
        Token Creator on itself does not change the scopes of the tokens the metadata server issues to the VM.
references:
  - title: "Service accounts | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/access/service-accounts
  - title: "Change the attached service account | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/change-service-account
