id: gcpace-4a-org-role-administrator
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small IAM team must create, update and delete the custom roles defined at the organization level. The team must not manage organization policies or grant roles on the organization. You must follow the principle of least privilege.

    Which role should you grant to the team on the organization?
body:
  options:
    - id: a
      text:
        en: |-
          Organization Policy Administrator (`roles/orgpolicy.policyAdmin`)
    - id: b
      text:
        en: |-
          Organization Role Administrator (`roles/iam.organizationRoleAdmin`)
    - id: c
      text:
        en: |-
          Organization Administrator (`roles/resourcemanager.organizationAdmin`)
    - id: d
      text:
        en: |-
          Project IAM Admin (`roles/resourcemanager.projectIamAdmin`)
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Organization Role Administrator, granted on the organization, is the role that the documentation names for managing an organization's custom roles. It doesn't let the team change organization policies or allow policies.
  options:
    a:
      en: |-
        Organization Policy Administrator manages organization policy constraints, not custom IAM roles.
    c:
      en: |-
        Organization Administrator can manage the organization's allow policies, which gives far more control than the team needs.
    d:
      en: |-
        Project IAM Admin manages allow policies of projects; it doesn't cover organization-level custom roles.
references:
  - title: "Create and manage custom roles | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/creating-custom-roles
