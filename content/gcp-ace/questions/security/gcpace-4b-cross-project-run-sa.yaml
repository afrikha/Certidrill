id: gcpace-4b-cross-project-run-sa
objective: "4.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    Your security team keeps all service accounts in the project `sec-identities`. You need to deploy the Cloud Run service `pricing` in the project `app-prod`, and it must run as `pricing-sa@sec-identities.iam.gserviceaccount.com`.

    The boolean constraint `iam.disableCrossProjectServiceAccountUsage` is enforced, as by default, on every project of the organization.

    Which three actions should you take? Choose three.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Set the `iam.disableCrossProjectServiceAccountUsage` constraint to not enforced on the `sec-identities` project.
    - id: b
      text:
        en: |-
          Set the `iam.disableCrossProjectServiceAccountUsage` constraint to not enforced on the `app-prod` project.
    - id: c
      text:
        en: |-
          Grant the deployer `roles/iam.serviceAccountUser` on `pricing-sa`.
    - id: d
      text:
        en: |-
          Grant the deployer `roles/iam.serviceAccountTokenCreator` on `pricing-sa`.
    - id: e
      text:
        en: |-
          Grant `roles/iam.serviceAccountTokenCreator` on `pricing-sa` to the Cloud Run service agent of `app-prod` (`service-APP_PROD_NUMBER@serverless-robot-prod.iam.gserviceaccount.com`).
    - id: f
      text:
        en: |-
          Create a key for `pricing-sa` and store it as a secret in Secret Manager in `app-prod`.
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      To attach a service account from another project, the constraint must be lifted in the project that owns the service account (`sec-identities`). The deployer needs Service Account User (`actAs`) on `pricing-sa`, and the Cloud Run service agent of the project that runs the service needs Service Account Token Creator on it so that it can issue tokens for the service.
  options:
    b:
      en: |-
        The constraint is checked in the project that contains the service account, not in the project that uses it.
    d:
      en: |-
        Attaching an account requires `actAs` (Service Account User); Token Creator lets the deployer impersonate it, which is not needed.
    f:
      en: |-
        Keys are a last resort and are not needed: the attached service account gets its credentials from Cloud Run.
references:
  - title: "Configure service identity for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/services/service-identity
  - title: "Attach service accounts to resources | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/attach-service-accounts
