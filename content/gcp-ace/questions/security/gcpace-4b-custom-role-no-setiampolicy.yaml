id: gcpace-4b-custom-role-no-setiampolicy
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A team lead manages the service account `prod-deployer@rel-prd.iam.gserviceaccount.com`. He must be able to update its display name and description, and to disable and re-enable it during incidents. He must not be able to change who can use or impersonate the account, because that would let him grant himself access to it.

    What should you grant him on `prod-deployer`?
body:
  options:
    - id: a
      text:
        en: |-
          Service Account Admin (`roles/iam.serviceAccountAdmin`)
    - id: b
      text:
        en: |-
          Service Account Key Admin (`roles/iam.serviceAccountKeyAdmin`)
    - id: c
      text:
        en: |-
          View Service Accounts (`roles/iam.serviceAccountViewer`) and Service Account User (`roles/iam.serviceAccountUser`)
    - id: d
      text:
        en: |-
          A custom role with `iam.serviceAccounts.get`, `iam.serviceAccounts.update`, `iam.serviceAccounts.disable` and `iam.serviceAccounts.enable`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Service Account Admin includes `iam.serviceAccounts.setIamPolicy`, which gives full control of the account's allow policy and so lets its holder grant himself Token Creator. A custom role with only the read, update, disable and enable permissions covers the tasks without that escalation path.
  options:
    a:
      en: |-
        Service Account Admin includes `setIamPolicy`, so he could grant himself impersonation on the account.
    b:
      en: |-
        Key Admin lets him create keys and so authenticate as the account, which is exactly the access he must not get.
    c:
      en: |-
        These roles cannot update or disable the account, and Service Account User adds `actAs`, which lets him run workloads as the account.
references:
  - title: "Best practices for using service accounts securely | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
  - title: "Roles for service account authentication | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-permissions
