id: gcpace-4b-imp-time-bound
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    An external auditor, `aud@review.example.com`, must be able to impersonate `audit-ro@fin-prd.iam.gserviceaccount.com` until December 31, 2026 at 23:59:59 UTC. After that, the access must end without any manual action. The auditor must not be able to impersonate any other service account of the project `fin-prd`.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects add-iam-policy-binding fin-prd --member=user:aud@review.example.com --role=roles/iam.serviceAccountTokenCreator --condition='expression=request.time < timestamp("2027-01-01T00:00:00Z"),title=audit-2026'`
    - id: b
      text:
        en: |-
          `gcloud iam service-accounts add-iam-policy-binding audit-ro@fin-prd.iam.gserviceaccount.com --member=user:aud@review.example.com --role=roles/iam.serviceAccountTokenCreator --condition='expression=request.time < timestamp("2027-01-01T00:00:00Z"),title=audit-2026'`
    - id: c
      text:
        en: |-
          `gcloud iam service-accounts add-iam-policy-binding audit-ro@fin-prd.iam.gserviceaccount.com --member=user:aud@review.example.com --role=roles/iam.serviceAccountUser --condition='expression=request.time < timestamp("2027-01-01T00:00:00Z"),title=audit-2026'`
    - id: d
      text:
        en: |-
          `gcloud iam service-accounts add-iam-policy-binding audit-ro@fin-prd.iam.gserviceaccount.com --member=user:aud@review.example.com --role=roles/iam.serviceAccountOpenIdTokenCreator --condition='expression=request.time < timestamp("2027-01-01T00:00:00Z"),title=audit-2026'`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Token Creator granted on `audit-ro` alone lets the auditor impersonate only that account. The condition `request.time < timestamp("2027-01-01T00:00:00Z")` makes the binding apply only until the end of 2026, so access stops automatically.
  options:
    a:
      en: |-
        A project-level Token Creator grant lets the auditor impersonate every service account of the project.
    c:
      en: |-
        Service Account User does not allow impersonation with gcloud; it only allows attaching the account.
    d:
      en: |-
        This role only allows creating OpenID Connect ID tokens; gcloud impersonation needs access tokens, which require Token Creator.
references:
  - title: "Manage access to service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-access-service-accounts
  - title: "Best practices for using service accounts securely | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
