id: gcpace-4c-delegation-chain-roles
objective: "4.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company requires that the service account sa-app obtain short-lived credentials for the service account sa-records only through the intermediary service account sa-broker, by using a delegated request in which sa-broker is listed in the delegates field. sa-app must not hold any role directly on sa-records.

    Which two role grants should you configure? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant sa-app the Service Account Token Creator role on sa-records.
    - id: b
      text:
        en: |-
          Grant sa-app the Service Account Token Creator role on sa-broker.
    - id: c
      text:
        en: |-
          Grant sa-broker the Service Account User role on sa-records.
    - id: d
      text:
        en: |-
          Grant sa-broker the Service Account Token Creator role on sa-records.
    - id: e
      text:
        en: |-
          Grant sa-records the Service Account Token Creator role on sa-broker.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      In a delegation chain, each account must have the Service Account Token Creator role on the next account in the chain: the caller sa-app on the intermediary sa-broker, and sa-broker on the final account sa-records. The resulting credential represents only sa-records.
  options:
    a:
      en: |-
        A direct grant on sa-records is forbidden by the requirement and is not needed when the request goes through sa-broker.
    c:
      en: |-
        Service Account User grants actAs for attaching the account to resources; it doesn't let sa-broker pass token requests along the chain.
    e:
      en: |-
        The grant goes in the direction of the chain (each account on the next one); sa-records doesn't need any role on sa-broker.
references:
  - title: "Create short-lived credentials for multiple service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-delegated
