id: gcpace-4c-wif-impersonation-role
objective: "4.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An energy company federates on-premises workloads through an OIDC provider in a workload identity pool. A workload must call a Google Cloud API that doesn't support direct resource access for federated principals, so the workload must impersonate the service account sa-meter, which has the required roles.

    Which grant should you configure on sa-meter?
body:
  options:
    - id: a
      text:
        en: |-
          The Service Account User role to the principalSet that represents the workload
    - id: b
      text:
        en: |-
          The Workload Identity Pool Admin role to the principalSet that represents the workload
    - id: c
      text:
        en: |-
          The Workload Identity User role to the principalSet that represents the workload
    - id: d
      text:
        en: |-
          The Service Account Key Admin role to the principalSet that represents the workload
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With service account impersonation, you grant roles/iam.workloadIdentityUser on the service account to the federated principal or principalSet. The federated token can then be exchanged for a short-lived access token of sa-meter.
  options:
    a:
      en: |-
        Service Account User grants actAs for attaching the account to resources; it doesn't let a federated identity obtain tokens for it.
    b:
      en: |-
        Workload Identity Pool Admin manages pools and providers on the project; it doesn't allow impersonating a service account.
    d:
      en: |-
        Service Account Key Admin manages long-lived keys, which federation is meant to avoid, and doesn't grant impersonation.
references:
  - title: "Workload Identity Federation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
  - title: "Configure Workload Identity Federation with deployment pipelines | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-deployment-pipelines
