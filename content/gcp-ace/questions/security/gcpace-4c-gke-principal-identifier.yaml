id: gcpace-4c-gke-principal-identifier
objective: "4.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The project web-prod has the project number 123456789012 and a GKE cluster with Workload Identity Federation for GKE enabled. Pods in the namespace orders run with the Kubernetes ServiceAccount orders-ksa. You need to grant orders-ksa, and only orders-ksa, the Storage Object Viewer role on the bucket gs://web-prod-invoices, which uses uniform bucket-level access, without using an IAM service account.

    Which value should you pass to --member in gcloud storage buckets add-iam-policy-binding?
body:
  options:
    - id: a
      text:
        en: |-
          principal://iam.googleapis.com/projects/web-prod/locations/global/workloadIdentityPools/web-prod.svc.id.goog/subject/ns/orders/sa/orders-ksa
    - id: b
      text:
        en: |-
          principal://iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/123456789012.svc.id.goog/subject/ns/orders/sa/orders-ksa
    - id: c
      text:
        en: |-
          serviceAccount:orders-ksa@web-prod.iam.gserviceaccount.com
    - id: d
      text:
        en: |-
          principal://iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/web-prod.svc.id.goog/subject/ns/orders/sa/orders-ksa
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The principal identifier of a Kubernetes ServiceAccount uses the project number in the projects/ segment and the pool name PROJECT_ID.svc.id.goog, followed by subject/ns/NAMESPACE/sa/KSA_NAME. Granting the role to this principal gives access to that Kubernetes ServiceAccount only.
  options:
    a:
      en: |-
        The projects/ segment of the identifier takes the project number, not the project ID.
    b:
      en: |-
        The pool is named after the project ID (web-prod.svc.id.goog); there is no pool named after the project number.
    c:
      en: |-
        A Kubernetes ServiceAccount isn't an IAM service account, so this email address doesn't exist and identifies nothing.
references:
  - title: "About Workload Identity Federation for GKE | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
  - title: "Authenticate to Google Cloud APIs from GKE workloads | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
