id: gcpace-4c-wif-aws-credential-config
objective: "4.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company created a workload identity pool with an AWS provider and granted the Workload Identity User role on the service account sa-sync to the identities of an AWS role. An application on an EC2 instance that uses that role relies on the Google Cloud client libraries. You must configure the application to obtain Google Cloud credentials as sa-sync.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a key for sa-sync, copy it to the instance, and set GOOGLE_APPLICATION_CREDENTIALS to the key file path.
    - id: b
      text:
        en: |-
          Generate a credential configuration file with create-cred-config, --aws and --service-account, and point GOOGLE_APPLICATION_CREDENTIALS to it.
    - id: c
      text:
        en: |-
          Run gcloud auth application-default login --impersonate-service-account on the instance with sa-sync as the target service account.
    - id: d
      text:
        en: |-
          Save the output of gcloud iam workload-identity-pools providers describe for the provider, and pass it to gcloud auth login --cred-file.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      create-cred-config writes a credential configuration file that tells client libraries where to get the AWS credentials, which provider to use and which service account to impersonate. The file contains no private key, and libraries find it through GOOGLE_APPLICATION_CREDENTIALS.
  options:
    a:
      en: |-
        A service account key is long-lived and unnecessary once federation is configured.
    c:
      en: |-
        This command runs an interactive sign-in with a user account, which an unattended workload on EC2 can't use.
    d:
      en: |-
        The describe output is the provider's configuration, not a credential configuration file that gcloud or the client libraries can use.
references:
  - title: "Configure Workload Identity Federation with AWS or Azure VMs | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-other-clouds
  - title: "gcloud iam workload-identity-pools create-cred-config | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/iam/workload-identity-pools/create-cred-config
