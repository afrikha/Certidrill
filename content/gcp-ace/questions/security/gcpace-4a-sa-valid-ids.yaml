id: gcpace-4a-sa-valid-ids
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A script creates one user-managed service account per data pipeline with `gcloud iam service-accounts create`. The pipeline owners proposed the following service account IDs.

    Which two IDs can the script use? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `Billing_Export`
    - id: b
      text:
        en: |-
          `invoice-export-01`
    - id: c
      text:
        en: |-
          `bq-1`
    - id: d
      text:
        en: |-
          `invoice-export-nightly-job-finance`
    - id: e
      text:
        en: |-
          `etl-loader-2026`
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A service account ID must be 6 to 30 characters long and contain only lowercase letters, digits and dashes. `invoice-export-01` (17 characters) and `etl-loader-2026` (15 characters) meet both rules; the ID can't be changed after creation.
  options:
    a:
      en: |-
        Uppercase letters and underscores aren't allowed in a service account ID.
    c:
      en: |-
        At 4 characters, the ID is shorter than the 6-character minimum.
    d:
      en: |-
        At 34 characters, the ID is longer than the 30-character maximum.
references:
  - title: "Create service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-accounts-create
