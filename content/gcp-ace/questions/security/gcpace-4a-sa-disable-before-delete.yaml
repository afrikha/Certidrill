id: gcpace-4a-sa-disable-before-delete
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    During a cleanup, you find the user-managed service account `legacy-sync@crm-prod.iam.gserviceaccount.com`, which nobody remembers creating. You want to remove it, but you must be able to restore access within minutes if a critical application turns out to depend on it.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run `gcloud iam service-accounts disable legacy-sync@crm-prod.iam.gserviceaccount.com`, and watch the applications for failures.
    - id: b
      text:
        en: |-
          Delete the account now, and create a new account with the same name if an application fails.
    - id: c
      text:
        en: |-
          Delete the account's user-managed keys, and consider the account safe to remove if nothing fails.
    - id: d
      text:
        en: |-
          After an observation period without failures, delete the account with `gcloud iam service-accounts delete`.
    - id: e
      text:
        en: |-
          Remove the account's roles in every project first, and keep a copy of the bindings to restore them if needed.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Google recommends disabling a service account before deleting it: a disabled account stops authenticating, and `gcloud iam service-accounts enable` restores it at once if something breaks. Once you are confident that nothing depends on it, you delete it.
  options:
    b:
      en: |-
        A new account with the same name is a different identity that doesn't inherit the old account's role bindings.
    c:
      en: |-
        Workloads attached to the account, such as VMs, don't use keys, so deleting keys doesn't prove the account is unused.
    e:
      en: |-
        Restoring bindings across projects is slow and error-prone compared with re-enabling the account.
references:
  - title: "Disable and enable service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-accounts-disable-enable
  - title: "Delete and undelete service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-accounts-delete-undelete
