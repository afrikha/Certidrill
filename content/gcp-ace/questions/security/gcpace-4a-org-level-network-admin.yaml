id: gcpace-4a-org-level-network-admin
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A central networking team, `netops@example.com`, must create and manage VPC networks, subnets, routes and load balancers in every project of the organization, including projects created in the future. The team must not manage VM instances. You want the least administrative effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the group the Compute Network Admin role on each existing project, and add the grant to the new-project checklist.
    - id: b
      text:
        en: |-
          Grant the group the Compute Admin role on the organization, so that it is inherited by every project.
    - id: c
      text:
        en: |-
          Grant the group the Compute Network Viewer role on the organization, so that it is inherited by every project.
    - id: d
      text:
        en: |-
          Grant the group the Compute Network Admin role on the organization, so that it is inherited by every project.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Roles granted on the organization are inherited by every folder and project below it, including projects created later. Compute Network Admin (`roles/compute.networkAdmin`) covers networking resources without giving control of VM instances.
  options:
    a:
      en: |-
        Per-project grants work but take ongoing effort, and a forgotten checklist step leaves a new project without access.
    b:
      en: |-
        Compute Admin also gives full control of VM instances and disks, which the team must not have.
    c:
      en: |-
        Compute Network Viewer is read-only; the team couldn't create or change networks.
references:
  - title: "Using resource hierarchy for access control | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/resource-hierarchy-access-control
