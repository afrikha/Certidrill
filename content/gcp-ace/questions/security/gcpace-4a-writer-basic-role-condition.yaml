id: gcpace-4a-writer-basic-role-condition
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The company allows basic roles only in sandbox projects. A hackathon group needs to create, change and delete resources in most services of the project `sandbox-hack` for 14 days. The access must end automatically, and the group must not manage roles or billing of the project.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the group the Editor role (`roles/editor`) on the project, with a condition on `request.time` that ends after 14 days.
    - id: b
      text:
        en: |-
          Grant the group the Admin role (`roles/admin`) on the project, with a condition on `request.time` that ends after 14 days.
    - id: c
      text:
        en: |-
          Grant the group the Writer role (`roles/writer`) on the project, and remove the binding manually after 14 days.
    - id: d
      text:
        en: |-
          Grant the group the Writer role (`roles/writer`) on the project, with a condition on `request.time` that ends after 14 days.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Writer is the current basic role that adds state-changing permissions, such as creating and deleting resources, to Reader, without the role and billing management of Admin. Unlike the legacy basic roles, Writer bindings accept IAM Conditions, so a `request.time` condition ends the access automatically.
  options:
    a:
      en: |-
        Editor is a legacy basic role, and conditions can't be added to bindings of legacy basic roles.
    b:
      en: |-
        Admin also allows sensitive tasks such as managing the project's roles and billing, which the group must not do.
    c:
      en: |-
        A manual removal doesn't meet the requirement that the access ends automatically.
references:
  - title: "Roles overview | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/roles-overview
