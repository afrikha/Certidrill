id: gcpace-4c-enable-iamcredentials-api
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at a media company has the Service Account Token Creator role on the service account sa-render in the project media-prod. The IAM API is enabled in media-prod. When the developer runs gcloud auth print-access-token --impersonate-service-account=sa-render@media-prod.iam.gserviceaccount.com, the command fails with an error stating that the IAM Service Account Credentials API has not been used in the project or is disabled.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run gcloud services enable iam.googleapis.com --project=media-prod.
    - id: b
      text:
        en: |-
          Grant the developer the Service Account User role on sa-render.
    - id: c
      text:
        en: |-
          Run gcloud services enable iamcredentials.googleapis.com --project=media-prod.
    - id: d
      text:
        en: |-
          Run gcloud services enable sts.googleapis.com --project=media-prod.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Short-lived credentials are issued by the IAM Service Account Credentials API, whose service name is iamcredentials.googleapis.com. It must be enabled in the project, in addition to the IAM API, before tokens can be generated, so enabling it fixes the error.
  options:
    a:
      en: |-
        The IAM API is already enabled; the error names the Service Account Credentials API, which is a separate service.
    b:
      en: |-
        The error is about a disabled API, not a missing permission, and Service Account User (actAs) doesn't allow creating tokens anyway.
    d:
      en: |-
        The Security Token Service API exchanges federated tokens for Workload Identity Federation; it doesn't issue service account access tokens.
references:
  - title: "Create short-lived credentials for a service account | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
