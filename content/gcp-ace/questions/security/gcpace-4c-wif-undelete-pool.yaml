id: gcpace-4c-wif-undelete-pool
objective: "4.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Yesterday an administrator deleted the workload identity pool partner-pool in the project fed-hub by mistake, and partner workloads lost access to Google Cloud. You must restore access as quickly as possible and keep the existing role bindings and the credential configuration files on the partner side unchanged.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run gcloud iam workload-identity-pools undelete partner-pool --project=fed-hub --location=global.
    - id: b
      text:
        en: |-
          Run gcloud iam workload-identity-pools create partner-pool --location=global and re-create its providers.
    - id: c
      text:
        en: |-
          Run gcloud iam workload-identity-pools update partner-pool --project=fed-hub --location=global --no-disabled.
    - id: d
      text:
        en: |-
          Create a pool with a new name, re-create the providers, and send new credential configuration files to the partners.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A deleted workload identity pool can be restored for up to 30 days with gcloud iam workload-identity-pools undelete. Restoring it keeps its name and providers, so the existing bindings and credential configuration files work again.
  options:
    b:
      en: |-
        Until a deleted pool is permanently deleted, its name can't be reused for a new pool.
    c:
      en: |-
        --no-disabled re-enables a disabled pool; it can't bring back a deleted one.
    d:
      en: |-
        A new pool name changes the principal identifiers and provider names, so bindings and partner files would all have to change.
references:
  - title: "Manage workload identity pools and providers | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-workload-identity-pools-providers
