id: gcpace-4b-inherited-folder-grant
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    Alex moved from the platform team to the finance team, but he can still impersonate `pay-admin@pay-prd.iam.gserviceaccount.com`. The allow policies of the service account and of the project `pay-prd` contain no binding for him. Policy Analyzer shows that his access comes from a binding of the Service Account Token Creator role on the folder `prod`, granted to the group `platform-admins@example.com`, of which he is still a member.

    The other members of the group must keep their access. What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud iam service-accounts remove-iam-policy-binding` on `pay-admin` for Alex with `--condition=None`.
    - id: b
      text:
        en: |-
          Disable the `pay-admin` service account until the folder policy has been reviewed.
    - id: c
      text:
        en: |-
          Grant Alex a custom role without `iam.serviceAccounts.getAccessToken` on `pay-admin`.
    - id: d
      text:
        en: |-
          Remove Alex from the `platform-admins@example.com` group.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Roles granted on a folder are inherited by every resource below it, including service accounts, and inherited roles cannot be revoked on the child resource. Because the access reaches Alex through his group membership, removing him from the group ends it while the other members keep theirs.
  options:
    a:
      en: |-
        There is no binding for Alex on the service account to remove; the access is inherited from the folder.
    b:
      en: |-
        Disabling the account would break every workload and administrator that relies on it.
    c:
      en: |-
        Allow policies are additive: an extra role cannot take away a permission granted elsewhere.
references:
  - title: "Manage access to service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-access-service-accounts
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
