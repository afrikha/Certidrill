id: gcpace-4a-identify-service-agents
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    During an access review of the project `shop-prod` (project number `123456789012`), an auditor lists the service accounts that hold roles. She wants to separate the Google-managed service agents, which Google creates and manages for its services, from the accounts that the company manages.

    Which two accounts are service agents? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `123456789012-compute@developer.gserviceaccount.com`
    - id: b
      text:
        en: |-
          `ci-deployer@shop-prod.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `service-123456789012@compute-system.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `shop-prod@appspot.gserviceaccount.com`
    - id: e
      text:
        en: |-
          `service-123456789012@gcp-sa-pubsub.iam.gserviceaccount.com`
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      The Compute Engine Service Agent (`service-PROJECT_NUMBER@compute-system...`) and the Pub/Sub service agent (`service-PROJECT_NUMBER@gcp-sa-pubsub...`) are created and managed by Google so that these services can act on the project's resources. You can't use them directly, and they don't appear in the project's service account list.
  options:
    a:
      en: |-
        This is the Compute Engine default service account: Google creates it, but it is a user-managed account that the company manages.
    b:
      en: |-
        An `@PROJECT_ID.iam.gserviceaccount.com` address is a user-managed service account that someone in the company created.
    d:
      en: |-
        This is the App Engine default service account, a user-managed account that the company manages after Google creates it.
references:
  - title: "Types of service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-types
  - title: "Service agents | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-agents
