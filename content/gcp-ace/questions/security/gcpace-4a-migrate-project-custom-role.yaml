id: gcpace-4a-migrate-project-custom-role
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    After an acquisition, the project `fleet-tracker` must move from the acquired company's organization to the parent company's organization. The deployment team holds `organizations/551098234411/roles/fleetDeployer`, a custom role of the source organization, granted directly on the project. The team must keep the same permissions on the project after the move.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Do nothing special, because the bindings granted directly on the project move with it and keep working in the new organization.
    - id: b
      text:
        en: |-
          Before the move, recreate the custom role in the destination organization, and grant it on the project after the move.
    - id: c
      text:
        en: |-
          Export the source organization's allow policy, and apply it to the destination organization with `gcloud organizations set-iam-policy`.
    - id: d
      text:
        en: |-
          Grant the team the custom role on the destination organization from the source organization before you start the move.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Direct bindings move with the project, but a custom role exists only in the organization or project where it was created and can only be granted there. Custom roles defined in the source organization must be recreated in the destination before the move, so that the team can be granted an equivalent role.
  options:
    a:
      en: |-
        The binding refers to a role that exists only in the source organization, so it gives no permission once the project has left that organization.
    c:
      en: |-
        Copying the whole source policy would grant unrelated principals on the destination organization, and it still refers to roles of the source organization.
    d:
      en: |-
        A custom role can only be granted within the organization or project where it was created, so it can't be granted on another organization.
references:
  - title: "Migrate projects between organization resources | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/project-migration
  - title: "Roles overview | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/roles-overview
