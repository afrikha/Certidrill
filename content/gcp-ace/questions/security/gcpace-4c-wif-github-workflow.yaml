id: gcpace-4c-wif-github-workflow
objective: "4.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A web agency configured a workload identity pool and an OIDC provider for GitHub Actions, and granted the deployment roles directly to a principalSet built from the repository attribute. You now need to update the GitHub Actions workflow so that it authenticates to Google Cloud through Workload Identity Federation.

    Which two changes should you make to the workflow? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Store a JSON key of a deployment service account in a GitHub encrypted secret and pass it to the authentication step.
    - id: b
      text:
        en: |-
          Set the environment variable GOOGLE_APPLICATION_CREDENTIALS to the resource name of the workload identity provider.
    - id: c
      text:
        en: |-
          Grant the job the id-token: write permission so that it can request a GitHub OIDC token.
    - id: d
      text:
        en: |-
          Run gcloud auth activate-service-account in the first step of the job to sign in as the deployment service account.
    - id: e
      text:
        en: |-
          Add the google-github-actions/auth action with the workload_identity_provider input set to the full provider resource name.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      The workflow needs the id-token: write permission to obtain an OIDC token from GitHub, and the google-github-actions/auth action exchanges that token through the provider named in workload_identity_provider (projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID). With direct resource access, the service_account input is omitted.
  options:
    a:
      en: |-
        A JSON key is the long-lived credential that Workload Identity Federation is meant to replace.
    b:
      en: |-
        GOOGLE_APPLICATION_CREDENTIALS must point to a credential file, not to a provider resource name.
    d:
      en: |-
        activate-service-account signs in with a service account key file, which this design doesn't use.
references:
  - title: "Configure Workload Identity Federation with deployment pipelines | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-deployment-pipelines
