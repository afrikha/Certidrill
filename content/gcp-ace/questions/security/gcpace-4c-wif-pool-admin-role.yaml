id: gcpace-4c-wif-pool-admin-role
objective: "4.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform engineer at Example Corp must create, update, and delete workload identity pools and providers in the dedicated project fed-hub. The engineer must not be able to change other resources in the project.

    Which role should you grant on fed-hub?
body:
  options:
    - id: a
      text:
        en: |-
          Workload Identity User (roles/iam.workloadIdentityUser)
    - id: b
      text:
        en: |-
          Workload Identity Pool Viewer (roles/iam.workloadIdentityPoolViewer)
    - id: c
      text:
        en: |-
          Service Account Admin (roles/iam.serviceAccountAdmin)
    - id: d
      text:
        en: |-
          Workload Identity Pool Admin (roles/iam.workloadIdentityPoolAdmin)
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Workload Identity Pool Admin, granted on the project, lets a principal view, create, update and delete workload identity pools and providers. It is the predefined role Google documents for managing federation, without broader project permissions.
  options:
    a:
      en: |-
        Workload Identity User lets a principal impersonate a service account; it doesn't manage pools or providers.
    b:
      en: |-
        Workload Identity Pool Viewer only lets a principal view pools and providers.
    c:
      en: |-
        Service Account Admin manages service accounts, not workload identity pools and providers.
references:
  - title: "Manage workload identity pools and providers | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-workload-identity-pools-providers
  - title: "Configure Workload Identity Federation with deployment pipelines | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-deployment-pipelines
