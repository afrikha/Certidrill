id: gcpace-4b-imp-flag-one-command
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    You have the Service Account Token Creator role on `audit-sa@sec-prd.iam.gserviceaccount.com`. You need to check which buckets that account can list by running one command as the account, without creating a service account key and without changing your gcloud configuration.

    What should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud auth activate-service-account audit-sa@sec-prd.iam.gserviceaccount.com --key-file=audit-sa.json`, then `gcloud storage buckets list`
    - id: b
      text:
        en: |-
          `gcloud storage buckets list --account=audit-sa@sec-prd.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `gcloud config set account audit-sa@sec-prd.iam.gserviceaccount.com`, then `gcloud storage buckets list`
    - id: d
      text:
        en: |-
          `gcloud storage buckets list --impersonate-service-account=audit-sa@sec-prd.iam.gserviceaccount.com`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The global `--impersonate-service-account` flag makes gcloud create short-lived credentials for the service account and run that one command with them. It needs Token Creator on the account and no key.
  options:
    a:
      en: |-
        `activate-service-account` requires a key file, which you must not create.
    b:
      en: |-
        `--account` selects an account that is already credentialed in gcloud; it does not impersonate, and no credentials exist for `audit-sa`.
    c:
      en: |-
        This changes your configuration, and gcloud has no credentials for that account, so the command fails.
references:
  - title: "Use service account impersonation | Authentication | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/authentication/use-service-account-impersonation
  - title: "Service account impersonation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-impersonation
