id: gcpace-4a-deny-override-org-grant
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The user `sam@example.com` holds the Storage Admin role on the organization and uses it in about 60 projects. After an audit, he must lose all access to Cloud Storage in the project `hr-payroll` only. He must keep his access in every other project, including projects created later, and you want to make as few changes as possible.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Attach a deny policy to the `hr-payroll` project that denies the Cloud Storage bucket and object permissions to Sam.
    - id: b
      text:
        en: |-
          Run `gcloud projects remove-iam-policy-binding hr-payroll --member=user:sam@example.com --role=roles/storage.admin`.
    - id: c
      text:
        en: |-
          Remove Sam's Storage Admin binding from the organization, and grant him the role again on each of the other projects.
    - id: d
      text:
        en: |-
          Grant Sam the Storage Object Viewer role on the `hr-payroll` project so that it replaces Storage Admin there.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Allow policies are additive: a role inherited from the organization can't be removed on a child project. A deny policy attached to the project blocks the denied permissions for Sam in that project only, whatever roles he holds, while the organization-level grant keeps working everywhere else.
  options:
    b:
      en: |-
        The binding is on the organization, not on the project, so removing it from the project's policy changes nothing.
    c:
      en: |-
        Granting the role project by project is many changes, and projects created later would not get the access automatically.
    d:
      en: |-
        A lower role on the project is added to the inherited Storage Admin role; the effective policy is the union of both, so Sam keeps full access.
references:
  - title: "Deny policies | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/deny-overview
  - title: "Using resource hierarchy for access control | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/resource-hierarchy-access-control
