id: gcpace-4b-list-roles-of-sa
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An auditor asks you for the list of roles that the service account `etl-loader@data-prd.iam.gserviceaccount.com` holds on the project `data-prd`.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects get-iam-policy data-prd --flatten="bindings[].members" --filter="bindings.members:serviceAccount:etl-loader@data-prd.iam.gserviceaccount.com" --format="table(bindings.role)"`
    - id: b
      text:
        en: |-
          `gcloud iam service-accounts get-iam-policy etl-loader@data-prd.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `gcloud iam service-accounts describe etl-loader@data-prd.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `gcloud iam roles list --project=data-prd`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The roles a service account holds on a project are bindings in the project's allow policy, where the account is a principal. Reading the project policy, flattening it per member and filtering on the account's `serviceAccount:` identifier lists exactly those roles.
  options:
    b:
      en: |-
        This reads the allow policy of the service account as a resource: it shows who can use or manage the account, not the roles the account holds.
    c:
      en: |-
        This shows the account's metadata (email, unique ID, display name, disabled state), not its role bindings.
    d:
      en: |-
        This lists the custom roles defined in the project, not the roles granted to the account.
references:
  - title: "Manage access to service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-access-service-accounts
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
