id: gcpace-4c-gke-namespace-principalset
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The project data-prod (project number 555000111222) has three GKE clusters with Workload Identity Federation for GKE enabled. Every workload in the namespace reporting, in any of the clusters, must be able to read objects in gs://data-prod-reports, a bucket with uniform bucket-level access. Teams create new Kubernetes ServiceAccounts in that namespace every week, and you want to avoid a new IAM grant each time.

    Which member should you grant the Storage Object Viewer role on the bucket?
body:
  options:
    - id: a
      text:
        en: |-
          principal://iam.googleapis.com/projects/555000111222/locations/global/workloadIdentityPools/data-prod.svc.id.goog/subject/ns/reporting/sa/default
    - id: b
      text:
        en: |-
          The node service account of each of the three clusters
    - id: c
      text:
        en: |-
          principalSet://iam.googleapis.com/projects/555000111222/locations/global/workloadIdentityPools/data-prod.svc.id.goog/namespace/reporting
    - id: d
      text:
        en: |-
          principalSet://iam.googleapis.com/projects/555000111222/locations/global/workloadIdentityPools/data-prod.svc.id.goog/kubernetes.cluster/https://container.googleapis.com/v1/projects/data-prod/locations/us-east1/clusters/reports-1
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The principalSet identifier ending in namespace/NAMESPACE covers every Kubernetes ServiceAccount in that namespace in all clusters that share the project's workload identity pool. New Kubernetes ServiceAccounts in reporting get access without another grant.
  options:
    a:
      en: |-
        This identifier covers only the default Kubernetes ServiceAccount, not the new ones the teams create.
    b:
      en: |-
        Node service accounts are shared by all Pods on the nodes, so every namespace, not only reporting, would get access.
    d:
      en: |-
        This set contains all Pods of one cluster, in every namespace, and none of the other two clusters.
references:
  - title: "About Workload Identity Federation for GKE | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
  - title: "Identity federation: products and limitations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/federated-identity-supported-services
