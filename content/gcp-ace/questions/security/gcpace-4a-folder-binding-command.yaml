id: gcpace-4a-folder-binding-command
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The folder `Finance` has the folder ID `734591023184` and contains 12 projects. The group `fin-analysts@example.com` must get the BigQuery Data Viewer role in all the projects of this folder, now and in the future, with a single command.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud resource-manager folders add-iam-policy-binding Finance --member=group:fin-analysts@example.com --role=roles/bigquery.dataViewer`
    - id: b
      text:
        en: |-
          `gcloud projects add-iam-policy-binding 734591023184 --member=group:fin-analysts@example.com --role=roles/bigquery.dataViewer`
    - id: c
      text:
        en: |-
          `gcloud resource-manager folders add-iam-policy-binding 734591023184 --member=group:fin-analysts@example.com --role=roles/bigquery.dataViewer`
    - id: d
      text:
        en: |-
          `gcloud organizations add-iam-policy-binding 734591023184 --member=group:fin-analysts@example.com --role=roles/bigquery.dataViewer`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud resource-manager folders add-iam-policy-binding` adds a binding to the folder's allow policy, and the numeric folder ID identifies the folder. Every current and future project in the folder inherits the role.
  options:
    a:
      en: |-
        Folders are identified by their numeric ID in this command, not by their display name.
    b:
      en: |-
        `gcloud projects` expects a project ID or number; the folder ID doesn't identify a project.
    d:
      en: |-
        `gcloud organizations` expects an organization ID; a folder isn't an organization, and an organization grant would cover every project.
references:
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
