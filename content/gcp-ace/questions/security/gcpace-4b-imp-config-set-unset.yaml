id: gcpace-4b-imp-config-set-unset
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    During a two-hour maintenance window, every gcloud command you run must be sent as `maint-sa@core-prd.iam.gserviceaccount.com`, without adding a flag to each command. After the window, gcloud must use your own identity again. You already have the Service Account Token Creator role on the account.

    Which two commands should you run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud config set account maint-sa@core-prd.iam.gserviceaccount.com`
    - id: b
      text:
        en: |-
          `gcloud auth application-default login --impersonate-service-account maint-sa@core-prd.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `gcloud config set auth/impersonate_service_account maint-sa@core-prd.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `gcloud auth revoke maint-sa@core-prd.iam.gserviceaccount.com`
    - id: e
      text:
        en: |-
          `gcloud config unset auth/impersonate_service_account`
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      The `auth/impersonate_service_account` property makes every gcloud command impersonate the account, as if each one had the `--impersonate-service-account` flag. Unsetting the property after the window returns gcloud to your own credentials.
  options:
    a:
      en: |-
        `core/account` must name an account that has credentials in gcloud; it does not impersonate.
    b:
      en: |-
        This creates the local Application Default Credentials used by client libraries and tools such as Terraform, not the credentials of gcloud commands.
    d:
      en: |-
        No credentials of `maint-sa` are stored in gcloud, so there is nothing to revoke, and this does not stop impersonation.
references:
  - title: "Use service account impersonation | Authentication | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/authentication/use-service-account-impersonation
