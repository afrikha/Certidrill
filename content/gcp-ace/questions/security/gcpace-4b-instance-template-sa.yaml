id: gcpace-4b-instance-template-sa
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A managed instance group will run batch workers that scale between 2 and 40 VMs. Every VM that the group creates must run as the service account `batch-worker@etl-prd.iam.gserviceaccount.com`.

    Where should you specify the service account?
body:
  options:
    - id: a
      text:
        en: |-
          In the autoscaling policy that you set with `gcloud compute instance-groups managed set-autoscaling`.
    - id: b
      text:
        en: |-
          In a project metadata entry named `service-account` that every new VM reads at boot.
    - id: c
      text:
        en: |-
          On each VM after the group creates it, with `gcloud compute instances set-service-account`.
    - id: d
      text:
        en: |-
          In the instance template, with `gcloud compute instance-templates create batch-tpl --service-account=batch-worker@etl-prd.iam.gserviceaccount.com --scopes=cloud-platform`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A managed instance group creates every VM from its instance template, and an instance template can carry a service account and scopes. Each VM the group creates, including during autoscaling or autohealing, then runs as `batch-worker`.
  options:
    a:
      en: |-
        An autoscaling policy only defines how many VMs the group runs, not their configuration.
    b:
      en: |-
        Custom metadata does not attach a service account to a VM.
    c:
      en: |-
        The group recreates VMs from the template during autoscaling and repairs, so per-VM changes are lost.
references:
  - title: "Attach service accounts to resources | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/attach-service-accounts
  - title: "Service accounts | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/access/service-accounts
