id: gcpace-4a-deny-policy-statements
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company plans to use IAM deny policies as guardrails on top of its existing allow policies. Before it writes the first deny policy, the cloud team reviews how deny policies work.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          An allow binding of the Admin basic role or of the legacy Owner role on a project overrides a deny rule that is attached to the project.
    - id: b
      text:
        en: |-
          A deny policy can be attached to an organization, a folder or a project.
    - id: c
      text:
        en: |-
          A deny policy can be attached directly to an individual Cloud Storage bucket or Compute Engine VM.
    - id: d
      text:
        en: |-
          IAM checks the relevant deny policies before it checks the relevant allow policies.
    - id: e
      text:
        en: |-
          A denial condition can use any request attribute, such as `request.time` or the caller's IP address.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Deny policies are attached to an organization, a folder or a project, and they are inherited by every resource below. IAM always evaluates the relevant deny policies first: if a deny rule applies, the request is denied whatever roles the principal holds.
  options:
    a:
      en: |-
        No allow binding, not even Admin or Owner, overrides a deny rule; only an exception principal or exception permission in the rule avoids it.
    c:
      en: |-
        Individual resources inherit deny policies from their project, folder or organization, but a deny policy can't be attached to them directly.
    e:
      en: |-
        Denial conditions recognize only resource tag functions, not other attributes such as the request time.
references:
  - title: "Deny policies | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/deny-overview
