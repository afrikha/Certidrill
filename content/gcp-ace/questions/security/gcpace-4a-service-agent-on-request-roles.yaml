id: gcpace-4a-service-agent-on-request-roles
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    To reference them in its Terraform code, a platform team asked Google Cloud to create the service agents of a service in the new project `ml-sandbox` before anyone used the service. When the first job runs, it fails with permission errors on the project's resources. The service agents exist and appear on the IAM page when Google-provided role grants are included, but they hold no role.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the service agents the roles that the service requires, because agents created on request don't receive their roles automatically.
    - id: b
      text:
        en: |-
          Create a key for each service agent, and give the key files to the job so that it authenticates as the agents.
    - id: c
      text:
        en: |-
          Delete the service agents, and create user-managed service accounts with the same names by using `gcloud iam service-accounts create`.
    - id: d
      text:
        en: |-
          Grant the platform team the Service Account User role on the service agents so that the job can act as them.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Service agents that Google creates when a service is first used usually get their service agent role automatically, but agents created at your request are not granted any role. You must grant them the roles that the service needs, which the creation output lists, for example with `add-iam-policy-binding`.
  options:
    b:
      en: |-
        Service agents are managed by Google and can't be used directly; the problem is their missing roles, not authentication.
    c:
      en: |-
        A service only uses its own Google-managed service agents; user-managed accounts with similar names wouldn't be used by the service.
    d:
      en: |-
        The service, not the team, acts through its service agents; Service Account User on them doesn't give them any permission on the project.
references:
  - title: "Create and grant roles to service agents | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-service-agents
  - title: "Types of service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-types
