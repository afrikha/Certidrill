id: gcpace-4c-gke-enable-workload-pool
objective: "4.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company runs a GKE Standard cluster named match-prod in the project game-prod. Workload Identity Federation for GKE is not enabled on the cluster. You plan to let Pods call Pub/Sub with their own Kubernetes ServiceAccounts instead of the node service account.

    What should you do first?
body:
  options:
    - id: a
      text:
        en: |-
          Run gcloud container node-pools update default-pool --cluster=match-prod --location=us-central1 --workload-metadata=GKE_METADATA.
    - id: b
      text:
        en: |-
          Run gcloud iam workload-identity-pools create game-prod.svc.id.goog --location=global to create the pool for the cluster.
    - id: c
      text:
        en: |-
          Run gcloud container clusters update match-prod --location=us-central1 --workload-pool=game-prod.svc.id.goog.
    - id: d
      text:
        en: |-
          Run kubectl annotate serviceaccount default --namespace=default iam.gke.io/gcp-service-account=pubsub-sa@game-prod.iam.gserviceaccount.com.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      On a Standard cluster you first enable Workload Identity Federation for GKE on the cluster with --workload-pool set to PROJECT_ID.svc.id.goog. Only then can node pools run the GKE metadata server and Pods receive federated credentials.
  options:
    a:
      en: |-
        Node pools can use the GKE metadata server only after the feature is enabled on the cluster, so this is a later step.
    b:
      en: |-
        The PROJECT_ID.svc.id.goog pool is a fixed pool that Google Cloud manages for the project; you don't create it with the workload identity pools commands.
    d:
      en: |-
        The annotation links a Kubernetes ServiceAccount to an IAM service account but has no effect until the cluster uses Workload Identity Federation for GKE.
references:
  - title: "Authenticate to Google Cloud APIs from GKE workloads | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
