id: gcpace-4b-imp-audit-vs-keys
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    Your security team is comparing two ways for administrators to run gcloud commands as the service account `ops-sa@ops-prd.iam.gserviceaccount.com`: impersonation, or a downloaded service account key.

    Which two statements about impersonation are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          It requires the Service Account User role on the service account.
    - id: b
      text:
        en: |-
          Most audit log entries record both the administrator's identity and the impersonated service account.
    - id: c
      text:
        en: |-
          It requires downloading a key once, which gcloud then caches.
    - id: d
      text:
        en: |-
          It records the same audit information as a key, because both authenticate as the service account.
    - id: e
      text:
        en: |-
          The credentials it creates are short-lived and do not persist, so there is no long-lived secret to rotate.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Impersonation starts from an already authenticated identity, so most audit logs show both the caller and the service account, while a key only shows the service account. The credentials it creates are short-lived and not stored, which is why Google calls it more secure than a key.
  options:
    a:
      en: |-
        Impersonation needs `getAccessToken`, from Service Account Token Creator; Service Account User only allows attaching the account.
    c:
      en: |-
        Impersonation never uses a key; gcloud creates short-lived credentials from your own authenticated identity.
    d:
      en: |-
        With a key, logs show only the service account; with impersonation they also show who impersonated it.
references:
  - title: "Service account impersonation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-impersonation
  - title: "Use service account impersonation | Authentication | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/authentication/use-service-account-impersonation
