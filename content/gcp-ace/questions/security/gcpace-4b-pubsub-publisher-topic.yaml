id: gcpace-4b-pubsub-publisher-topic
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    In the project `ord-prod`, a managed instance group of VMs runs an order service as `orders-pub@ord-prod.iam.gserviceaccount.com`. The service must publish messages to the Pub/Sub topic `order-events`. Other teams own the other topics and subscriptions of the project.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud pubsub topics add-iam-policy-binding order-events --member=serviceAccount:orders-pub@ord-prod.iam.gserviceaccount.com --role=roles/pubsub.publisher`
    - id: b
      text:
        en: |-
          `gcloud projects add-iam-policy-binding ord-prod --member=serviceAccount:orders-pub@ord-prod.iam.gserviceaccount.com --role=roles/pubsub.publisher`
    - id: c
      text:
        en: |-
          `gcloud pubsub topics add-iam-policy-binding order-events --member=serviceAccount:orders-pub@ord-prod.iam.gserviceaccount.com --role=roles/pubsub.editor`
    - id: d
      text:
        en: |-
          `gcloud pubsub topics add-iam-policy-binding order-events --member=serviceAccount:orders-pub@ord-prod.iam.gserviceaccount.com --role=roles/pubsub.subscriber`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Pub/Sub Publisher allows publishing messages to a topic, and it can be granted on the topic itself. The binding on `order-events` gives the service exactly what it needs and nothing on the other teams' topics.
  options:
    b:
      en: |-
        A project-level grant lets the service publish to every topic of the project, including the other teams' topics.
    c:
      en: |-
        Pub/Sub Editor also lets the service modify and delete the topic and consume messages, far beyond publishing.
    d:
      en: |-
        Pub/Sub Subscriber is for consuming messages and attaching subscriptions; it does not allow publishing.
references:
  - title: "Access control with Identity and Access Management | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/access-control
