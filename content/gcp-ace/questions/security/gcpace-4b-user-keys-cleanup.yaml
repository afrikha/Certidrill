id: gcpace-4b-user-keys-cleanup
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A security review requires you to remove every user-managed key of the service account `partner-upload@b2b-prd.iam.gserviceaccount.com` that was created before June 1, 2026. Google-managed keys must not be touched, and the service account must keep working for its attached workloads.

    Which two commands should you use? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud iam service-accounts keys list --iam-account=partner-upload@b2b-prd.iam.gserviceaccount.com --managed-by=user --created-before=2026-06-01`
    - id: b
      text:
        en: |-
          `gcloud iam service-accounts keys list --iam-account=partner-upload@b2b-prd.iam.gserviceaccount.com --managed-by=system`
    - id: c
      text:
        en: |-
          `gcloud iam service-accounts keys disable KEY_ID --iam-account=partner-upload@b2b-prd.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `gcloud iam service-accounts keys delete KEY_ID --iam-account=partner-upload@b2b-prd.iam.gserviceaccount.com`
    - id: e
      text:
        en: |-
          `gcloud iam service-accounts delete partner-upload@b2b-prd.iam.gserviceaccount.com`
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      `keys list` with `--managed-by=user` returns only user-managed keys, and `--created-before` keeps those created before the date. You then remove each returned key with `keys delete KEY_ID --iam-account=...`, which leaves the account and its Google-managed keys in place.
  options:
    b:
      en: |-
        `--managed-by=system` lists the Google-managed keys, which must not be touched.
    c:
      en: |-
        A disabled key can be re-enabled; the review requires the keys to be removed.
    e:
      en: |-
        Deleting the service account breaks the workloads that use it.
references:
  - title: "gcloud iam service-accounts keys list | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/iam/service-accounts/keys/list
  - title: "List and get service account keys | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/keys-list-get
