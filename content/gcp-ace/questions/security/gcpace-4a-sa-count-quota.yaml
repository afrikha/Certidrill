id: gcpace-4a-sa-count-quota
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS provider creates one user-managed service account per customer tenant in the project `tenants-prod`. Today, `gcloud iam service-accounts create` fails with an error saying that the project has reached its quota for service accounts. Every existing service account is used by an active tenant, and new tenants must be onboarded this week.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the IAM Service Account Credentials API in the project so that it can hold more service accounts.
    - id: b
      text:
        en: |-
          Grant the onboarding pipeline the Service Account Admin role instead of Create Service Accounts on the project.
    - id: c
      text:
        en: |-
          Delete the oldest tenants' service accounts, and undelete them within 30 days when those tenants need them again.
    - id: d
      text:
        en: |-
          On the Quotas page of the project, find the Service Account Count quota and request a higher value.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The number of service accounts allowed in a project depends on the project's Service Account Count quota, which you can view and adjust on the Quotas page of the console. Requesting an increase lets the provider keep every active account and create new ones.
  options:
    a:
      en: |-
        The Service Account Credentials API issues short-lived credentials; enabling it doesn't change how many accounts a project can hold.
    b:
      en: |-
        The failure is a quota limit, not a missing permission, so a broader role doesn't let the creation succeed.
    c:
      en: |-
        These accounts are used by active tenants, so deleting them would break those tenants; deletion only frees quota for accounts nobody needs.
references:
  - title: "Quotas and limits | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/quotas
  - title: "Create service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-accounts-create
