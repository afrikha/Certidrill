id: gcpace-4c-gke-image-pull-node-sa
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A GKE Standard cluster in the project apps-prod uses Workload Identity Federation for GKE and a custom node service account, gke-nodes@apps-prod.iam.gserviceaccount.com. A new Deployment uses an image stored in an Artifact Registry repository in the project shared-images. Its Pods stay in ImagePullBackOff with a 403 error. The Kubernetes ServiceAccount of the Deployment already has the Artifact Registry Reader role on the repository.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Artifact Registry Writer role on the repository to the principal identifier of the Kubernetes ServiceAccount.
    - id: b
      text:
        en: |-
          Create a key for gke-nodes, store it as a Kubernetes Secret, and reference it in imagePullSecrets.
    - id: c
      text:
        en: |-
          Grant the Service Account Token Creator role on gke-nodes to the principal identifier of the Kubernetes ServiceAccount.
    - id: d
      text:
        en: |-
          Grant the Artifact Registry Reader role on the repository to gke-nodes@apps-prod.iam.gserviceaccount.com.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Image pulls are done by the node, which authenticates with the node service account, not with the Pod's federated identity. When the repository is in another project, you grant the Artifact Registry Reader role on it to the node service account.
  options:
    a:
      en: |-
        Pulls don't use the Kubernetes ServiceAccount identity, and a write role would exceed what pulling needs.
    b:
      en: |-
        A key in imagePullSecrets is a long-lived credential and is unnecessary because the node service account can be granted read access.
    c:
      en: |-
        Letting Pods impersonate the node account doesn't change who pulls images; the node account itself still lacks access to the repository.
references:
  - title: "Deploying to Google Kubernetes Engine | Artifact Registry | Google Cloud Documentation"
    url: https://docs.cloud.google.com/artifact-registry/docs/integrate-gke
  - title: "About service accounts in GKE | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/service-accounts
