id: gcpace-4a-sa-undelete-after-recreate
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Twelve days ago, an engineer deleted the service account `report-runner@fin-tools.iam.gserviceaccount.com`, which held roles in 15 projects. Yesterday, another engineer created a new account with the same name, but the reporting jobs still fail with permission errors. The allow policies show entries such as `deleted:serviceAccount:report-runner@fin-tools.iam.gserviceaccount.com?uid=104729383612034875521`. You must restore the original identity and all its role bindings with the least effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud iam service-accounts undelete 104729383612034875521` while the new account stays in place.
    - id: b
      text:
        en: |-
          Grant the new account the same roles again in each of the 15 projects, by copying the `deleted:` entries.
    - id: c
      text:
        en: |-
          Delete the new account, and then run `gcloud iam service-accounts undelete 104729383612034875521`.
    - id: d
      text:
        en: |-
          Run `gcloud iam service-accounts enable report-runner@fin-tools.iam.gserviceaccount.com` on the new account.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A deleted service account can be undeleted within 30 days with its 21-digit unique ID, and undeleting keeps its original identity and role bindings. Undelete fails while another account with the same name exists, so the new account must be deleted first.
  options:
    a:
      en: |-
        Undelete fails because an account with the same name already exists in the project.
    b:
      en: |-
        Regranting 15 projects' worth of roles is the most effort, and the new account is a different identity that never inherits the old bindings.
    d:
      en: |-
        The new account is already enabled; enabling it doesn't link it to the deleted account's bindings.
references:
  - title: "Delete and undelete service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-accounts-delete-undelete
