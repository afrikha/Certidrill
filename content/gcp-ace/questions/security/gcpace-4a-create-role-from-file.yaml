id: gcpace-4a-create-role-from-file
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You wrote the following file, `role.yaml`, to define a new custom role in the project `ops-prod`. No role with the ID `logBucketAuditor` exists yet.

    ```yaml
    title: Log Bucket Auditor
    description: Read log bucket and view settings
    stage: GA
    includedPermissions:
    - logging.buckets.get
    - logging.buckets.list
    - logging.views.get
    - logging.views.list
    ```

    Which command creates the role?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud iam roles update logBucketAuditor --project=ops-prod --file=role.yaml`
    - id: b
      text:
        en: |-
          `gcloud projects set-iam-policy ops-prod role.yaml`
    - id: c
      text:
        en: |-
          `gcloud iam roles create logBucketAuditor --project=ops-prod --file=role.yaml`
    - id: d
      text:
        en: |-
          `gcloud iam roles copy --source=role.yaml --destination=logBucketAuditor --dest-project=ops-prod`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud iam roles create` takes the new role ID, the project or organization that owns it, and either flags or a YAML or JSON file with `title`, `description`, `stage` and `includedPermissions`.
  options:
    a:
      en: |-
        `update` changes an existing custom role; it can't create one that doesn't exist yet.
    b:
      en: |-
        `set-iam-policy` replaces the project's allow policy with the file's content; it doesn't define roles.
    d:
      en: |-
        `--source` of `gcloud iam roles copy` takes an existing role ID, not a role definition file.
references:
  - title: "gcloud iam roles create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/iam/roles/create
