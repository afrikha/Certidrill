id: gcpace-4b-imp-terraform-provider
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    You run Terraform from your workstation, where Application Default Credentials hold your own user credentials. The platform team requires every change to be made as `tf-deployer@plat-prd.iam.gserviceaccount.com` through service account impersonation, with no service account key. You have the Service Account Token Creator role on that account.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Set `credentials = file("tf-deployer.json")` in the `google` provider block, with a key exported for `tf-deployer`.
    - id: b
      text:
        en: |-
          Set `access_token = "tf-deployer@plat-prd.iam.gserviceaccount.com"` in the `google` provider block.
    - id: c
      text:
        en: |-
          Set `impersonate_service_account = "tf-deployer@plat-prd.iam.gserviceaccount.com"` in the `google` provider block.
    - id: d
      text:
        en: |-
          Run `gcloud auth application-default login` again with your user account before `terraform apply`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Google provider's `impersonate_service_account` argument makes Terraform use your ADC to obtain short-lived credentials for `tf-deployer` and send every request as that account. It requires Token Creator on the account and no key.
  options:
    a:
      en: |-
        A key file is exactly what the requirement forbids.
    b:
      en: |-
        `access_token` expects an OAuth access token, not a service account email.
    d:
      en: |-
        This only refreshes ADC with your own user credentials, so Terraform would still send the requests as you, not as `tf-deployer`.
references:
  - title: "Authentication for Terraform | Terraform on Google Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/terraform/authentication
