id: gcpace-4c-gke-autopilot-setup
objective: "4.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup runs its API on a GKE Autopilot cluster. A new Deployment in the namespace api must read objects in the Cloud Storage bucket gs://api-config, which uses uniform bucket-level access. You need to give only this Deployment access, without service account keys and with the least administrative effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run gcloud container clusters update with --workload-pool=PROJECT_ID.svc.id.goog, then grant the Storage Object Viewer role on the bucket to the Compute Engine default service account.
    - id: b
      text:
        en: |-
          Create a Kubernetes ServiceAccount in the namespace api, grant the Storage Object Viewer role on the bucket to its principal identifier, and set it as serviceAccountName in the Deployment.
    - id: c
      text:
        en: |-
          Create a node pool with --workload-metadata=GKE_METADATA, then grant the Storage Object Viewer role on the bucket to the Kubernetes ServiceAccount of the Deployment.
    - id: d
      text:
        en: |-
          Grant the Storage Object Viewer role on the bucket to the node service account so that the Pods inherit its permissions.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Workload Identity Federation for GKE is always enabled on Autopilot clusters, so there is no enablement step. You create a Kubernetes ServiceAccount, grant the IAM role to its principal identifier, and reference it with spec.serviceAccountName so that only these Pods get the access.
  options:
    a:
      en: |-
        The feature is already on in Autopilot, and a grant to the Compute Engine default service account would reach other workloads instead of this Deployment only.
    c:
      en: |-
        In Autopilot, Google manages the nodes and the feature is already enabled, so you don't create node pools for it.
    d:
      en: |-
        The node service account is shared by all Pods on the nodes, which grants access far beyond the one Deployment.
references:
  - title: "Authenticate to Google Cloud APIs from GKE workloads | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
  - title: "Identity federation: products and limitations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/federated-identity-supported-services
