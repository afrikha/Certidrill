id: gcpace-4a-hierarchy-effective-access
objective: "4.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A retailer has the following role bindings. No deny policy exists, and all buckets use uniform bucket-level access.

    | Resource | Principal | Role |
    | --- | --- | --- |
    | Organization | `sec-audit@example.com` | Security Reviewer (`roles/iam.securityReviewer`) |
    | Folder `Retail` | `retail-devs@example.com` | Compute Instance Admin (v1) |
    | Bucket `gs://web-assets` in project `retail-web` | `ana@example.com` | Storage Object Viewer |

    The project `retail-web` is in the `Retail` folder. The project `hr-payroll` is in the `Corporate` folder.

    Which three statements are true? Choose three.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Members of `sec-audit` can view the allow policies of the resources in `hr-payroll`.
    - id: b
      text:
        en: |-
          Members of `retail-devs` can stop VM instances in `retail-web`.
    - id: c
      text:
        en: |-
          Members of `retail-devs` can stop VM instances in `hr-payroll`.
    - id: d
      text:
        en: |-
          Ana can read the objects of the `gs://web-assets` bucket.
    - id: e
      text:
        en: |-
          Ana can read the objects of every bucket in `retail-web`.
    - id: f
      text:
        en: |-
          Removing `retail-devs` from the allow policy of `retail-web` removes their VM access in that project.
answer: { optionIds: [ a, b, d ] }
explanation:
  correct:
    en: |-
      Bindings flow down the hierarchy: the organization-level Security Reviewer role covers every project, and the `Retail` folder's Compute Instance Admin role covers `retail-web`. A binding on a bucket applies only to that bucket, so Ana can read `gs://web-assets` and nothing else.
  options:
    c:
      en: |-
        `hr-payroll` is in the `Corporate` folder, so it doesn't inherit the `Retail` folder's binding.
    e:
      en: |-
        Ana's role is granted on one bucket; resource-level bindings don't flow up to the project or across to other buckets.
    f:
      en: |-
        The binding is on the `Retail` folder, not in the project's allow policy, so there is nothing to remove from the project.
references:
  - title: "Using resource hierarchy for access control | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/resource-hierarchy-access-control
