id: gcpace-4b-run-default-identity
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A developer deploys a Cloud Run service with `gcloud run deploy` and does not use the `--service-account` flag. The code of the service calls Cloud Storage through Application Default Credentials.

    Which identity does the service use to call Cloud Storage?
body:
  options:
    - id: a
      text:
        en: |-
          The Cloud Run service agent, `service-PROJECT_NUMBER@serverless-robot-prod.iam.gserviceaccount.com`
    - id: b
      text:
        en: |-
          The App Engine default service account, `PROJECT_ID@appspot.gserviceaccount.com`
    - id: c
      text:
        en: |-
          The user account of the developer who deployed the revision
    - id: d
      text:
        en: |-
          The Compute Engine default service account, `PROJECT_NUMBER-compute@developer.gserviceaccount.com`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When no service account is specified, Cloud Run uses the Compute Engine default service account as the service identity. Google recommends attaching a user-managed service account with only the roles the service needs instead.
  options:
    a:
      en: |-
        The Cloud Run service agent is a Google-managed account that Cloud Run uses for its own operations, not the identity of your code.
    b:
      en: |-
        The App Engine default service account is not the default identity of Cloud Run services.
    c:
      en: |-
        The deployer's permissions are checked at deployment time; the running code never uses the deployer's credentials.
references:
  - title: "Introduction to service identity | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/securing/service-identity
