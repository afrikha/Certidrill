id: gcpace-4a-union-org-project-storage
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The user `ivy@example.com` has the Storage Object Viewer role on the organization and the Storage Object Creator role on the project `ingest-prod`. No other role is granted to her, and no deny policy exists. All buckets use uniform bucket-level access.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          She can read objects in the buckets of every project in the organization.
    - id: b
      text:
        en: |-
          She can upload objects to buckets in every project in the organization.
    - id: c
      text:
        en: |-
          She can upload objects to the buckets of the `ingest-prod` project.
    - id: d
      text:
        en: |-
          She can't read objects in `ingest-prod`, because the project-level role replaces the organization-level role.
    - id: e
      text:
        en: |-
          She can delete objects in the buckets of the `ingest-prod` project.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Each binding is evaluated independently and the effective policy is the union of the resource's policy and its ancestors' policies. The organization-level Viewer grant covers objects in every project, and the project-level Creator grant adds object creation in `ingest-prod` only.
  options:
    b:
      en: |-
        Storage Object Creator is granted on one project, so the upload permission doesn't extend to other projects.
    d:
      en: |-
        A lower-level binding never replaces an inherited binding; both roles apply in `ingest-prod`.
    e:
      en: |-
        Neither Storage Object Viewer nor Storage Object Creator includes the permission to delete objects.
references:
  - title: "Understanding allow policies | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/policies
