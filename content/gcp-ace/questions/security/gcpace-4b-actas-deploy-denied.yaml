id: gcpace-4b-actas-deploy-denied
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A developer has the Cloud Run Developer role on the project `api-prd`. When she deploys a service with `--service-account=api-sa@api-prd.iam.gserviceaccount.com`, the deployment fails with "Permission 'iam.serviceAccounts.actAs' denied on service account api-sa@api-prd.iam.gserviceaccount.com".

    Which role should you grant her on `api-sa`, following the principle of least privilege?
body:
  options:
    - id: a
      text:
        en: |-
          Service Account Token Creator (`roles/iam.serviceAccountTokenCreator`)
    - id: b
      text:
        en: |-
          Service Account User (`roles/iam.serviceAccountUser`)
    - id: c
      text:
        en: |-
          Service Account Admin (`roles/iam.serviceAccountAdmin`)
    - id: d
      text:
        en: |-
          Service Account Key Admin (`roles/iam.serviceAccountKeyAdmin`)
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Attaching a service account to a resource such as a Cloud Run service requires `iam.serviceAccounts.actAs` on that account. Service Account User contains that permission and is the role Cloud Run documents for deployers; granting it on `api-sa` alone keeps the scope minimal.
  options:
    a:
      en: |-
        Token Creator lets a principal create tokens for the account (impersonation) but does not include `actAs`.
    c:
      en: |-
        Service Account Admin manages the account and its allow policy but does not include `actAs`.
    d:
      en: |-
        Key Admin manages service account keys, which deploying a service does not need.
references:
  - title: "Roles for service account authentication | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-permissions
  - title: "Configure service identity for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/services/service-identity
