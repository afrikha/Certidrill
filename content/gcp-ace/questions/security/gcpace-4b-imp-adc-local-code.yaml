id: gcpace-4b-imp-adc-local-code
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A developer tests a Python application on her workstation. The application uses the Cloud Client Libraries with Application Default Credentials. For the tests, it must run with the permissions of `app-sa@shop-dev.iam.gserviceaccount.com`, and no service account key may be created. She has the Service Account Token Creator role on the account.

    What should she do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud auth application-default login --impersonate-service-account app-sa@shop-dev.iam.gserviceaccount.com`.
    - id: b
      text:
        en: |-
          Run `gcloud config set auth/impersonate_service_account app-sa@shop-dev.iam.gserviceaccount.com`.
    - id: c
      text:
        en: |-
          Create a key for `app-sa` and set the `GOOGLE_APPLICATION_CREDENTIALS` environment variable to the key file.
    - id: d
      text:
        en: |-
          Run `gcloud auth application-default login` with her own user account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `gcloud auth application-default login --impersonate-service-account` writes a local ADC file that impersonates the service account. Client libraries that support impersonation pick it up automatically, so the code runs with the account's permissions without a key.
  options:
    b:
      en: |-
        This property affects gcloud commands only; the client libraries read Application Default Credentials, not the gcloud configuration.
    c:
      en: |-
        Creating a key is forbidden, and keys are a security risk that impersonation avoids.
    d:
      en: |-
        The application would run with her own user permissions, not those of `app-sa`.
references:
  - title: "Use service account impersonation | Authentication | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/authentication/use-service-account-impersonation
