id: gcpace-4c-gke-link-ksa-iam-sa
objective: "4.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A GKE Standard cluster in the project ana-prod uses Workload Identity Federation for GKE. Pods in the namespace etl run with the Kubernetes ServiceAccount etl-ksa. The application calls an API that doesn't support granting roles to Kubernetes principal identifiers, so it must act as the IAM service account etl-sa@ana-prod.iam.gserviceaccount.com, which already has the roles it needs.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant the node service account the Service Account User role on etl-sa.
    - id: b
      text:
        en: |-
          Create a key for etl-sa, store it in a Kubernetes Secret, and mount it in the Pods.
    - id: c
      text:
        en: |-
          Grant the Workload Identity User role on etl-sa to the member serviceAccount:ana-prod.svc.id.goog[etl/etl-ksa].
    - id: d
      text:
        en: |-
          Set the iam.gke.io/gcp-service-account annotation on the Pod template of the Deployment instead of on etl-ksa.
    - id: e
      text:
        en: |-
          Annotate etl-ksa with iam.gke.io/gcp-service-account=etl-sa@ana-prod.iam.gserviceaccount.com.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      To link a Kubernetes ServiceAccount to an IAM service account, you grant roles/iam.workloadIdentityUser on the IAM service account to serviceAccount:PROJECT_ID.svc.id.goog[NAMESPACE/KSA_NAME] and annotate the Kubernetes ServiceAccount with iam.gke.io/gcp-service-account. Both the IAM policy and the annotation are required.
  options:
    a:
      en: |-
        The node service account is shared by every Pod on the node, and Service Account User (actAs) doesn't let Pods obtain tokens for etl-sa.
    b:
      en: |-
        A service account key stored as a Secret is a long-lived credential that you must protect and rotate; Workload Identity Federation for GKE avoids it.
    d:
      en: |-
        GKE reads the annotation from the Kubernetes ServiceAccount, not from the Pods.
references:
  - title: "Authenticate to Google Cloud APIs from GKE workloads | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
