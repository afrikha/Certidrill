id: gcpace-4c-access-token-curl
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team at a logistics company runs a nightly shell script on an on-premises build server. The script calls the BigQuery REST API with curl and must authenticate as the service account sa-export@logi-data.iam.gserviceaccount.com. The build server is already signed in to the gcloud CLI with a user account that has the Service Account Token Creator role on sa-export. Company policy forbids service account keys.

    How should the script obtain the bearer token for the curl requests?
body:
  options:
    - id: a
      text:
        en: |-
          Run gcloud auth print-identity-token --impersonate-service-account=sa-export@logi-data.iam.gserviceaccount.com and send the result in the Authorization header.
    - id: b
      text:
        en: |-
          Run gcloud auth print-access-token --impersonate-service-account=sa-export@logi-data.iam.gserviceaccount.com and send the result in the Authorization header.
    - id: c
      text:
        en: |-
          Run gcloud iam service-accounts keys create with --iam-account=sa-export@logi-data.iam.gserviceaccount.com, then gcloud auth activate-service-account with the key file.
    - id: d
      text:
        en: |-
          Run gcloud auth application-default print-access-token on the build server and send the result in the Authorization header.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud auth print-access-token --impersonate-service-account` asks the Service Account Credentials API for a short-lived OAuth 2.0 access token of sa-export, which the Token Creator role allows. Google APIs such as the BigQuery REST API accept this access token as a bearer token, and no key is created.
  options:
    a:
      en: |-
        An ID token proves an identity to services that accept OpenID Connect tokens, such as Cloud Run; Google APIs like BigQuery expect an OAuth 2.0 access token.
    c:
      en: |-
        Creating a user-managed key violates the policy that forbids service account keys; keys are long-lived and don't expire by default.
    d:
      en: |-
        This prints a token for the Application Default Credentials of the build server, which here are not the service account, so requests would not run as sa-export.
references:
  - title: "Create short-lived credentials for a service account | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
