id: gcpace-4b-bq-query-one-dataset
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A finance team runs a reporting application on Cloud Run as `reports-sa@fin-analytics.iam.gserviceaccount.com`. The application must run SQL queries in the `fin-analytics` project against the tables of the `ledger` dataset.

    The application must not modify any table and must not read the other datasets of the project. You want to follow the principle of least privilege.

    Which two role grants should you make? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant `roles/bigquery.dataEditor` to the service account on the `ledger` dataset.
    - id: b
      text:
        en: |-
          Grant `roles/bigquery.jobUser` to the service account on the `fin-analytics` project.
    - id: c
      text:
        en: |-
          Grant `roles/bigquery.dataViewer` to the service account on the `fin-analytics` project.
    - id: d
      text:
        en: |-
          Grant `roles/bigquery.user` to the service account on the `fin-analytics` project.
    - id: e
      text:
        en: |-
          Grant `roles/bigquery.dataViewer` to the service account on the `ledger` dataset.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Running a query is a job, and the permission to create jobs (`bigquery.jobs.create`) comes from BigQuery Job User, which can only be granted on a project, folder or organization. Reading table data comes from BigQuery Data Viewer, which can be granted on a single dataset. Together they let the application query `ledger` without write access and without access to the other datasets.
  options:
    a:
      en: |-
        BigQuery Data Editor can also create, update and delete tables, which the application must not do.
    c:
      en: |-
        Data Viewer on the project is inherited by every dataset, so the application could read the other datasets.
    d:
      en: |-
        BigQuery User also lets the account create datasets in the project; Job User is the narrower role for running queries.
references:
  - title: "BigQuery IAM roles and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/access-control
