id: gcpace-4a-custom-role-statements
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank's cloud team is about to replace several predefined roles with custom roles. The team lead asks you to confirm how custom roles behave before the team writes them.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Google automatically adds new permissions to a custom role when it updates the predefined role that the custom role was based on.
    - id: b
      text:
        en: |-
          A custom role can be granted only within the project or organization where it was created.
    - id: c
      text:
        en: |-
          A custom role defined in a project can include permissions that apply only at the folder or organization level.
    - id: d
      text:
        en: |-
          A permission with the `TESTING` support level can be included, but it can behave unexpectedly and isn't recommended for production.
    - id: e
      text:
        en: |-
          A custom role can include wildcard permissions, such as `compute.instances.*`, to stay current with new permissions.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Custom roles are restricted to the project or organization in which they were created. Permissions marked `TESTING` are still being checked for compatibility with custom roles: you can add them, but behavior may be unexpected, so Google advises against them in production.
  options:
    a:
      en: |-
        You maintain custom roles yourself; Google updates predefined roles, not the custom roles copied from them.
    c:
      en: |-
        Project-level custom roles can't include permissions that only work at the folder or organization level.
    e:
      en: |-
        Wildcards aren't allowed in custom role permissions; each permission must be listed by name.
references:
  - title: "Roles overview | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/roles-overview
