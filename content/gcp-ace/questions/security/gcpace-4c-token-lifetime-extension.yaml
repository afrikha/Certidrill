id: gcpace-4c-token-lifetime-extension
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company uses a third-party reconciliation tool that accepts one static OAuth 2.0 bearer token at startup and can't refresh it. Each run lasts up to 6 hours and must call Cloud Storage as the service account sa-recon. A scheduler that runs as sa-scheduler, which has the Service Account Token Creator role on sa-recon, requests the token. Service account keys are not allowed, and you have the Organization Policy Administrator role.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Have the scheduler run gcloud auth print-access-token --impersonate-service-account for sa-recon once at startup and pass the token to the tool for the whole run.
    - id: b
      text:
        en: |-
          Set the constraints/iam.serviceAccountKeyExpiryHours constraint to 6 hours, then have the scheduler call generateAccessToken for sa-recon with its default lifetime.
    - id: c
      text:
        en: |-
          Grant sa-scheduler the Service Account Token Creator role on sa-recon at the organization level, then call generateAccessToken with a lifetime of 21600s.
    - id: d
      text:
        en: |-
          Add sa-recon to the constraints/iam.allowServiceAccountCredentialLifetimeExtension constraint, then have the scheduler call generateAccessToken with a lifetime of 21600s.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Access tokens for a service account last 1 hour at most by default. Listing the service account in the constraints/iam.allowServiceAccountCredentialLifetimeExtension organization policy allows lifetimes of up to 12 hours (43,200 seconds), which the caller then requests in the lifetime field of generateAccessToken (the gcloud CLI can't set a lifetime).
  options:
    a:
      en: |-
        The gcloud CLI can't set a lifetime, so the token expires after 1 hour, long before the 6-hour run ends, and the tool can't refresh it.
    b:
      en: |-
        This constraint sets the expiry of newly created user-managed keys; it doesn't change the lifetime of access tokens, which stays at 1 hour.
    c:
      en: |-
        Where the role is granted doesn't change token lifetime; a lifetime above 1 hour is rejected until the account is listed in the lifetime extension constraint.
references:
  - title: "Create short-lived credentials for a service account | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
