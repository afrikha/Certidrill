id: gcpace-4b-run-invoker-one-service
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    The project `pay-core` contains several Cloud Run services in `europe-west1` that require authentication. The service `front` runs as `front-sa@pay-core.iam.gserviceaccount.com` and must call the service `ledger-api`. The other services of the project must reject calls from `front-sa`.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects add-iam-policy-binding pay-core --member=serviceAccount:front-sa@pay-core.iam.gserviceaccount.com --role=roles/run.invoker`
    - id: b
      text:
        en: |-
          `gcloud run services add-iam-policy-binding ledger-api --region=europe-west1 --member=serviceAccount:front-sa@pay-core.iam.gserviceaccount.com --role=roles/run.invoker`
    - id: c
      text:
        en: |-
          `gcloud run services add-iam-policy-binding ledger-api --region=europe-west1 --member=serviceAccount:front-sa@pay-core.iam.gserviceaccount.com --role=roles/run.developer`
    - id: d
      text:
        en: |-
          `gcloud run services add-iam-policy-binding ledger-api --region=europe-west1 --member=allUsers --role=roles/run.invoker`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cloud Run Invoker allows a principal to call a service. Granted on the `ledger-api` service only, it lets `front-sa` call that service while the other services keep rejecting it.
  options:
    a:
      en: |-
        A project-level Invoker grant applies to every Cloud Run service of the project, so `front-sa` could call all of them.
    c:
      en: |-
        Cloud Run Developer manages services (deploy, update, delete); it is not the role for invoking one, and it is far broader than needed.
    d:
      en: |-
        `allUsers` makes `ledger-api` public: anyone on the internet could call it.
references:
  - title: "Access control with IAM | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/securing/managing-access
