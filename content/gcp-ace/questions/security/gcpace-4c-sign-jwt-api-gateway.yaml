id: gcpace-4c-sign-jwt-api-gateway
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company runs a Cloud Run service as the service account sa-frontend. The service must call a backend through API Gateway, which is configured to accept JWTs signed by the service account sa-gw-client. Each JWT must carry custom claims that describe the end user. Service account keys are not allowed.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant sa-frontend the Service Account User role on sa-gw-client, and have the service call the signJwt method for sa-gw-client.
    - id: b
      text:
        en: |-
          Grant sa-frontend the Service Account OpenID Connect Identity Token Creator role on sa-gw-client, and call generateIdToken with the custom claims.
    - id: c
      text:
        en: |-
          Grant sa-frontend the Service Account Token Creator role on sa-gw-client, and have the service call the signJwt method for sa-gw-client.
    - id: d
      text:
        en: |-
          Create a key for sa-gw-client, store it in Secret Manager, and have the service sign the JWT locally with the private key.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The signJwt method of the Service Account Credentials API signs a JWT that you build, with your own claims, by using the service account's Google-managed private key. The caller needs iam.serviceAccounts.signJwt, which the Service Account Token Creator role provides, so no user-managed key is involved.
  options:
    a:
      en: |-
        Service Account User grants actAs for attaching the account to resources; it doesn't include the signJwt permission.
    b:
      en: |-
        generateIdToken returns a Google-signed ID token with standard claims for an audience; you can't add your own claims to it.
    d:
      en: |-
        Creating and storing a key violates the rule that forbids service account keys, even if the key is kept in Secret Manager.
references:
  - title: "Create short-lived credentials for a service account | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
  - title: "Roles for service account authentication | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-permissions
