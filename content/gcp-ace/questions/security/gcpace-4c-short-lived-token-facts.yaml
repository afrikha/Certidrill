id: gcpace-4c-short-lived-token-facts
objective: "4.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your security team is replacing service account keys with short-lived credentials generated through the IAM Service Account Credentials API. The organization has not configured any constraint related to credential lifetimes. They ask you to confirm how these credentials behave.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          An access token returned by generateAccessToken is valid for at most 1 hour.
    - id: b
      text:
        en: |-
          An access token returned by generateAccessToken comes with a refresh token that the caller can use to renew it.
    - id: c
      text:
        en: |-
          An OpenID Connect ID token for a service account can be made valid for up to 12 hours with an organization policy constraint.
    - id: d
      text:
        en: |-
          When an access token expires, the caller must request a new one from the Service Account Credentials API.
    - id: e
      text:
        en: |-
          The gcloud auth print-access-token --impersonate-service-account command can request a token lifetime of up to 12 hours.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Without the lifetime extension constraint, access tokens for a service account have a maximum lifetime of 1 hour. They carry no refresh token, so the caller repeats the token creation request when a token expires.
  options:
    b:
      en: |-
        Short-lived access tokens have no refresh token; renewal means calling the API again.
    c:
      en: |-
        ID tokens are valid for 1 hour; the lifetime extension constraint applies to OAuth 2.0 access tokens.
    e:
      en: |-
        The gcloud CLI can't set a token lifetime; a longer lifetime is requested through the REST lifetime field after the constraint allows it.
references:
  - title: "Create short-lived credentials for a service account | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
  - title: "Create short-lived credentials for multiple service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-delegated
