id: gcpace-4c-gke-host-network-pod
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A GKE Standard cluster has Workload Identity Federation for GKE enabled on all node pools. A monitoring DaemonSet runs with its own Kubernetes ServiceAccount, whose principal identifier has the Monitoring Metric Writer role, and its Pod spec sets hostNetwork: true. The DaemonSet's requests are made as the node service account instead. The agent doesn't need host networking.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Remove hostNetwork: true from the DaemonSet Pod spec so that its Pods use the GKE metadata server.
    - id: b
      text:
        en: |-
          Annotate the Kubernetes ServiceAccount with iam.gke.io/gcp-service-account set to the node service account.
    - id: c
      text:
        en: |-
          Update the node pools with --workload-metadata=GKE_METADATA and restart the DaemonSet.
    - id: d
      text:
        en: |-
          Grant the Monitoring Metric Writer role to the principalSet of the namespace instead of the Kubernetes ServiceAccount.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Pods that run on the host network can't use Workload Identity Federation for GKE: their metadata requests go to the Compute Engine metadata server, which returns the node service account. Running the Pods on the Pod network lets the GKE metadata server give them the Kubernetes ServiceAccount's identity.
  options:
    b:
      en: |-
        Linking the Kubernetes ServiceAccount to the node service account would not stop host-network Pods from bypassing the GKE metadata server, and it widens access.
    c:
      en: |-
        The node pools already use GKE_METADATA; host-network Pods bypass the GKE metadata server regardless.
    d:
      en: |-
        Changing the member doesn't help, because host-network Pods never present a federated identity.
references:
  - title: "About Workload Identity Federation for GKE | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
