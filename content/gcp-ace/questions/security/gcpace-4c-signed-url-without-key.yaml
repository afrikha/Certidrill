id: gcpace-4c-signed-url-without-key
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketing agency must give a partner download access to one Cloud Storage object, gs://campaign-assets/video.mp4, for 2 hours. The partner has no Google account. The organization enforces the constraints/iam.disableServiceAccountKeyCreation constraint. You have the Service Account Token Creator role on the service account sa-signer, which has the Storage Object Viewer role on the bucket.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a key for sa-signer and run gcloud storage sign-url gs://campaign-assets/video.mp4 --private-key-file=key.json --duration=2h.
    - id: b
      text:
        en: |-
          Run gcloud storage sign-url gs://campaign-assets/video.mp4 --duration=2h while authenticated with your own user account only.
    - id: c
      text:
        en: |-
          Grant allUsers the Storage Object Viewer role on the bucket, and remove the binding after 2 hours.
    - id: d
      text:
        en: |-
          Run gcloud storage sign-url gs://campaign-assets/video.mp4 --impersonate-service-account=sa-signer@PROJECT_ID.iam.gserviceaccount.com --duration=2h.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With --impersonate-service-account, gcloud storage sign-url has the IAM Service Account Credentials API sign the URL with sa-signer's Google-managed key, which the Token Creator role allows, so no user-managed key is needed. A URL signed this way can last up to 12 hours, so 2 hours is supported.
  options:
    a:
      en: |-
        The organization policy blocks creating service account keys, and a downloadable key is the long-lived credential the policy is meant to avoid.
    b:
      en: |-
        A user account can't sign the URL itself; without impersonation the command needs a service account key.
    c:
      en: |-
        allUsers access makes every object in the bucket public and doesn't expire on its own, which exceeds the single-object, 2-hour need.
references:
  - title: "gcloud storage sign-url | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/sign-url
  - title: "Create short-lived credentials for a service account | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
