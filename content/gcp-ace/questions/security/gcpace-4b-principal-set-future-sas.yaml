id: gcpace-4b-principal-set-future-sas
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    The project `build-tools` (project number 482915736104) hosts the Artifact Registry repository `base-images`. Every service account of the project `ci-runners` (project number 731004582267) must be able to pull images from `base-images`, including the service accounts that teams will create later.

    You want no administration when a new service account is created in `ci-runners`, and no access for any other principal.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Google group, add the current `ci-runners` service accounts to it, and grant `roles/artifactregistry.reader` on the repository to the group.
    - id: b
      text:
        en: |-
          Grant `roles/artifactregistry.reader` on the `build-tools` project to `allAuthenticatedUsers`.
    - id: c
      text:
        en: |-
          Grant `roles/artifactregistry.reader` on the repository to `principalSet://cloudresourcemanager.googleapis.com/projects/482915736104/type/ServiceAccount`.
    - id: d
      text:
        en: |-
          Grant `roles/artifactregistry.reader` on the repository to `principalSet://cloudresourcemanager.googleapis.com/projects/731004582267/type/ServiceAccount`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A principal set of the form `principalSet://cloudresourcemanager.googleapis.com/projects/PROJECT_NUMBER/type/ServiceAccount` represents all service accounts of that project. Google recommends it over a custom group when current and future service accounts share the same needs. It must name the project that contains the service accounts, here `ci-runners` (731004582267), and the grant stays on the repository.
  options:
    a:
      en: |-
        The group works for today's accounts, but every new service account must be added to it, which is the administration you want to avoid.
    b:
      en: |-
        `allAuthenticatedUsers` includes any authenticated Google identity, far beyond the `ci-runners` service accounts.
    c:
      en: |-
        This principal set covers the service accounts of `build-tools`, the project that hosts the repository, not those of `ci-runners`.
references:
  - title: "Best practices for using service accounts securely | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
  - title: "Principal identifiers | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/principal-identifiers
