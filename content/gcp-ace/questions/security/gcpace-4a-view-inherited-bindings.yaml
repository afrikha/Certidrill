id: gcpace-4a-view-inherited-bindings
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A user named Ana can stop and start Compute Engine VMs in the project `ops-tools`, which sits in a folder under your organization. When you run `gcloud projects get-iam-policy ops-tools`, Ana doesn't appear in any binding. You need to see, from the command line, the allow policies that could grant her this access.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud projects get-ancestors-iam-policy ops-tools` to list the allow policies of the project, its folder and the organization.
    - id: b
      text:
        en: |-
          Run `gcloud projects get-iam-policy ops-tools --format=yaml` so that the output also shows the inherited role bindings.
    - id: c
      text:
        en: |-
          Run `gcloud iam roles describe roles/compute.instanceAdmin.v1` to list the principals that hold the role in the hierarchy.
    - id: d
      text:
        en: |-
          Run `gcloud iam list-grantable-roles` on the project to list the roles that each principal holds on the project.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A resource's allow policy doesn't show roles gained through inheritance, so a grant on the folder or the organization is invisible in `get-iam-policy`. `gcloud projects get-ancestors-iam-policy` returns the allow policies of the project and of each of its ancestors, which shows where Ana's role is granted.
  options:
    b:
      en: |-
        `--format` only changes how the output is printed; the policy returned still contains only the bindings attached directly to the project.
    c:
      en: |-
        `gcloud iam roles describe` shows a role's title, stage and permissions, not the principals who were granted that role.
    d:
      en: |-
        `gcloud iam list-grantable-roles` lists the roles that can be granted on a resource; it doesn't say who holds them.
references:
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
  - title: "gcloud projects get-ancestors-iam-policy | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/projects/get-ancestors-iam-policy
