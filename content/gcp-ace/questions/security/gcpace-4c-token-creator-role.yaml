id: gcpace-4c-token-creator-role
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp runs a deployment tool on a Compute Engine VM that uses the attached service account sa-ci. The tool must call the generateAccessToken method of the IAM Service Account Credentials API to obtain short-lived OAuth 2.0 access tokens for the service account sa-deploy, which holds the deployment permissions.

    You need to grant sa-ci the least privileged predefined role on sa-deploy. Which role should you grant?
body:
  options:
    - id: a
      text:
        en: |-
          Service Account User (roles/iam.serviceAccountUser)
    - id: b
      text:
        en: |-
          Service Account Key Admin (roles/iam.serviceAccountKeyAdmin)
    - id: c
      text:
        en: |-
          Service Account Admin (roles/iam.serviceAccountAdmin)
    - id: d
      text:
        en: |-
          Service Account Token Creator (roles/iam.serviceAccountTokenCreator)
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Generating an access token for another service account requires the iam.serviceAccounts.getAccessToken permission on that account, which the Service Account Token Creator role provides. You grant it on sa-deploy (the privilege-bearing account) to sa-ci (the caller), for example with gcloud iam service-accounts add-iam-policy-binding.
  options:
    a:
      en: |-
        Service Account User grants iam.serviceAccounts.actAs, which lets a principal attach the account to a resource; it doesn't allow creating short-lived credentials.
    b:
      en: |-
        Service Account Key Admin manages user-managed keys, which are long-lived credentials; it doesn't grant permission to generate access tokens.
    c:
      en: |-
        Service Account Admin manages service accounts (create, update, set policies) and is broader than needed; it isn't the role that grants token generation.
references:
  - title: "Roles for service account authentication | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-permissions
  - title: "Create short-lived credentials for a service account | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/create-short-lived-credentials-direct
