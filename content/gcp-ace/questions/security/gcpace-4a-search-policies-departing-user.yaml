id: gcpace-4a-search-policies-departing-user
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineer, `omar@example.com`, is leaving a logistics company. The organization (ID `418203337745`) has more than 200 projects in several folders, and roles were granted to Omar on projects, folders and individual resources. You need a list of every allow policy binding that names him, with the least effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud organizations get-iam-policy 418203337745` and search the output for his email address.
    - id: b
      text:
        en: |-
          Run `gcloud projects get-iam-policy` on each project, and merge the bindings that name him into one file.
    - id: c
      text:
        en: |-
          Run `gcloud iam roles list --organization=418203337745` and look for the roles that are assigned to him.
    - id: d
      text:
        en: |-
          Run `gcloud asset search-all-iam-policies --scope=organizations/418203337745 --query=policy:omar@example.com`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `gcloud asset search-all-iam-policies` searches the allow policies of every resource in a project, folder or organization scope. With `--query=policy:EMAIL`, it returns only the bindings that contain that principal, wherever they are in the hierarchy.
  options:
    a:
      en: |-
        The organization's allow policy only contains bindings set on the organization itself, not those on folders, projects or resources.
    b:
      en: |-
        Running a command per project is slow for 200 projects and still misses the bindings on folders and on individual resources.
    c:
      en: |-
        `gcloud iam roles list --organization` lists the custom roles defined in the organization; it doesn't show who holds them.
references:
  - title: "gcloud asset search-all-iam-policies | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/asset/search-all-iam-policies
