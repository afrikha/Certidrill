id: gcpace-4b-imp-delegation-chain
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    Your user account has the Service Account Token Creator role on `sa-broker@sec-hub.iam.gserviceaccount.com` only. `sa-broker` has the Service Account Token Creator role on `sa-prod-admin@prod-core.iam.gserviceaccount.com`. You have no role on `sa-prod-admin`.

    You must run `gcloud compute instances list --project=prod-core` so that the request is made as `sa-prod-admin`. Which flag should you add?
body:
  options:
    - id: a
      text:
        en: |-
          `--impersonate-service-account=sa-broker@sec-hub.iam.gserviceaccount.com,sa-prod-admin@prod-core.iam.gserviceaccount.com`
    - id: b
      text:
        en: |-
          `--impersonate-service-account=sa-prod-admin@prod-core.iam.gserviceaccount.com,sa-broker@sec-hub.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `--impersonate-service-account=sa-prod-admin@prod-core.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `--account=sa-broker@sec-hub.iam.gserviceaccount.com --impersonate-service-account=sa-prod-admin@prod-core.iam.gserviceaccount.com`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A comma-separated list creates an impersonation delegation chain: your account needs Token Creator on the first account, each account needs Token Creator on the next one, and the request is made as the last account of the list. Listing `sa-broker` then `sa-prod-admin` matches the grants you have.
  options:
    b:
      en: |-
        In this order, your account would need Token Creator on `sa-prod-admin`, which it does not have.
    c:
      en: |-
        Impersonating `sa-prod-admin` directly requires a role on it, which you do not have.
    d:
      en: |-
        gcloud holds no credentials for `sa-broker`, so `--account` cannot select it.
references:
  - title: "gcloud | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference
  - title: "Service account impersonation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-impersonation
