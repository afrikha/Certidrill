id: gcpace-4c-wif-project-number
objective: "4.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A GitLab pipeline federates through the pool gitlab-pool in the project ops-tools, whose project number is 998877665544. The provider maps google.subject=assertion.sub and attribute.project_path=assertion.project_path, and token exchange succeeds. The pipeline is still denied access to a bucket that uses uniform bucket-level access. The bucket's allow policy grants Storage Object Admin to principalSet://iam.googleapis.com/projects/ops-tools/locations/global/workloadIdentityPools/gitlab-pool/attribute.project_path/infra/deploy.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add an attribute condition to the provider that matches assertion.project_path=='infra/deploy'.
    - id: b
      text:
        en: |-
          Grant the role to principal://iam.googleapis.com/projects/ops-tools/locations/global/workloadIdentityPools/gitlab-pool/subject/infra/deploy instead.
    - id: c
      text:
        en: |-
          Replace ops-tools with 998877665544 in the principalSet identifier of the binding.
    - id: d
      text:
        en: |-
          Grant the role at the organization level so that federated identities from every project are covered.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Principal identifiers for workload identity pools must use the project number, not the project ID, in the projects/ segment. With ops-tools in that position the binding doesn't match the federated identity, so changing it to 998877665544 lets the attribute-based principalSet receive the role.
  options:
    a:
      en: |-
        An attribute condition only restricts which tokens can be exchanged; exchange already succeeds and the binding still wouldn't match.
    b:
      en: |-
        This identifier still uses the project ID, and the subject is mapped from the token's sub claim, which isn't the project path alone.
    d:
      en: |-
        The member would still use the project ID and match nothing, and organization-level access violates least privilege.
references:
  - title: "Workload Identity Federation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
  - title: "Configure Workload Identity Federation with deployment pipelines | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-deployment-pipelines
