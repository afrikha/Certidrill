id: gcpace-4a-analyze-bucket-delete-access
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A compliance officer asks which individual users can delete the Cloud Storage bucket `gs://ledger-archive`. Roles that include this permission are granted on the bucket, on its project and on a parent folder, and most of them are granted to Google groups. The answer must list the users inside those groups.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud storage buckets get-iam-policy gs://ledger-archive`, and list the members of each group in the output.
    - id: b
      text:
        en: |-
          Run `gcloud asset search-all-iam-policies` on the organization with `--query=policy:roles/storage.admin`.
    - id: c
      text:
        en: |-
          Run `gcloud asset analyze-iam-policy` on the organization with `--full-resource-name` set to the bucket, `--permissions=storage.buckets.delete` and `--expand-groups`.
    - id: d
      text:
        en: |-
          Run `gcloud iam list-grantable-roles` on the bucket, and keep the roles that contain `storage.buckets.delete`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud asset analyze-iam-policy` (Policy Analyzer) answers "who can do what on which resource" from the allow policies in the scope, including those inherited from the project and the folder. Filtering on the bucket and the permission, and adding `--expand-groups`, returns the individual users who get the permission through groups.
  options:
    a:
      en: |-
        The bucket's allow policy doesn't include the bindings inherited from the project and the folder, and expanding groups by hand is error-prone.
    b:
      en: |-
        This search only finds bindings of one role; other roles, including custom roles, can also contain `storage.buckets.delete`, and groups aren't expanded.
    d:
      en: |-
        `gcloud iam list-grantable-roles` lists the roles that can be granted on the bucket; it says nothing about who holds them.
references:
  - title: "gcloud asset analyze-iam-policy | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/asset/analyze-iam-policy
