id: gcpace-4a-sa-creation-org-policy
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The organization enforces the managed constraint `iam.managed.disableServiceAccountCreation` at the organization level. A data team needs a dedicated service account in its project `dq-checks`, and the security team has approved an exception for this project only. The team already holds Create Service Accounts on the project, but `gcloud iam service-accounts create` fails.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the data team the Service Account Admin role on the project so that the creation is no longer blocked.
    - id: b
      text:
        en: |-
          Have an Organization Policy Administrator set a policy on `dq-checks` that doesn't enforce the constraint.
    - id: c
      text:
        en: |-
          Create the service account in another project of the organization, and use it from `dq-checks`.
    - id: d
      text:
        en: |-
          Use the Compute Engine default service account of `dq-checks` as the team's dedicated identity.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An organization policy constraint blocks the action whatever IAM roles the caller holds. Setting an organization policy on the project that doesn't enforce the constraint overrides the inherited policy for that project only, which matches the approved exception.
  options:
    a:
      en: |-
        IAM roles don't override organization policy constraints; the creation stays blocked with any role.
    c:
      en: |-
        The constraint is inherited by every project of the organization, so the creation fails in the other project too.
    d:
      en: |-
        A default service account is shared by every VM that uses it, so it isn't a dedicated identity for the team.
references:
  - title: "Restrict IAM service account usage | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/restricting-service-accounts
