id: gcpace-4b-split-dev-sec-roles
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    The developers group already has Cloud Run Developer on the project `orders-prd`. Its members must deploy revisions that run as `orders-api@orders-prd.iam.gserviceaccount.com`, but must not be able to create tokens for that account.

    The security group must manage the allow policy of `orders-api`, and must be able to disable it and update its description.

    You grant roles on the service account only. Which two grants should you make? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Service Account User on `orders-api` to the developers group
    - id: b
      text:
        en: |-
          Service Account Token Creator on `orders-api` to the developers group
    - id: c
      text:
        en: |-
          Service Account Key Admin on `orders-api` to the security group
    - id: d
      text:
        en: |-
          Service Account User on `orders-api` to the security group
    - id: e
      text:
        en: |-
          Service Account Admin on `orders-api` to the security group
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Service Account User gives developers `actAs`, which is what attaching `orders-api` to a Cloud Run revision requires, without the token-creation permissions of Token Creator. Service Account Admin lets the security group get and set the account's allow policy and update or disable the account.
  options:
    b:
      en: |-
        Token Creator lets developers create access tokens for the account, which is forbidden, and it does not include `actAs`.
    c:
      en: |-
        Key Admin manages keys; it cannot change the allow policy or disable the account.
    d:
      en: |-
        Service Account User only allows attaching the account; it cannot manage the allow policy.
references:
  - title: "Roles for service account authentication | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-permissions
  - title: "Manage access to service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-access-service-accounts
