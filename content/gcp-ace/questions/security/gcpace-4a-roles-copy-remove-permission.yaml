id: gcpace-4a-roles-copy-remove-permission
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An events team in the project `events-prod` must be able to do everything that the Pub/Sub Editor role allows, except delete topics. You want to start from the permissions of the predefined role, with the least effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Pub/Sub Editor role on the project with an IAM condition whose expression excludes the `pubsub.topics.delete` permission.
    - id: b
      text:
        en: |-
          Run `gcloud iam roles update roles/pubsub.editor --project=events-prod --remove-permissions=pubsub.topics.delete`, and grant the role.
    - id: c
      text:
        en: |-
          Grant both the Pub/Sub Editor and the Pub/Sub Viewer roles on the project, so that the Viewer role limits topic deletion.
    - id: d
      text:
        en: |-
          Run `gcloud iam roles copy --source=roles/pubsub.editor --destination=pubsubEditorNoDelete --dest-project=events-prod`, then remove `pubsub.topics.delete` with `gcloud iam roles update`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `gcloud iam roles copy` creates a custom role that starts with the permissions of a predefined role, here in the project given by `--dest-project`. `gcloud iam roles update ... --remove-permissions=pubsub.topics.delete` then takes out the one permission before you grant the custom role.
  options:
    a:
      en: |-
        IAM conditions decide when a binding applies, based on attributes such as time or resource; they can't remove individual permissions from a role.
    b:
      en: |-
        Predefined roles are maintained by Google and can't be modified; only custom roles can be updated.
    c:
      en: |-
        Roles add up, so adding Pub/Sub Viewer removes nothing from Pub/Sub Editor.
references:
  - title: "gcloud iam roles copy | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/iam/roles/copy
