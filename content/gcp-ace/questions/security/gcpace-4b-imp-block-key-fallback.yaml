id: gcpace-4b-imp-block-key-fallback
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    Administrators of the `prod` folder now reach production only by impersonating dedicated service accounts. The security team wants to make sure that nobody can bypass this model by creating a service account key for one of these accounts, even if someone holds a role that includes key creation.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enforce the `iam.disableServiceAccountCreation` constraint on the `prod` folder.
    - id: b
      text:
        en: |-
          Enforce the `iam.disableServiceAccountKeyCreation` constraint on the `prod` folder.
    - id: c
      text:
        en: |-
          Enforce the `iam.disableCrossProjectServiceAccountUsage` constraint on the `prod` folder.
    - id: d
      text:
        en: |-
          Enforce the `iam.automaticIamGrantsForDefaultServiceAccounts` constraint on the `prod` folder.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The `iam.disableServiceAccountKeyCreation` organization policy constraint blocks the creation of user-managed keys in the projects where it applies, whatever IAM roles a principal holds. Google recommends it, together with disabling key upload, when projects do not need keys, so impersonation remains the only way to use the accounts.
  options:
    a:
      en: |-
        This blocks creating service accounts, not creating keys for existing ones.
    c:
      en: |-
        This prevents attaching service accounts to resources in other projects; it does not stop key creation.
    d:
      en: |-
        This stops the automatic Editor grant to default service accounts; it has nothing to do with keys.
references:
  - title: "Best practices for using service accounts securely | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
  - title: "Use service account impersonation | Authentication | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/authentication/use-service-account-impersonation
