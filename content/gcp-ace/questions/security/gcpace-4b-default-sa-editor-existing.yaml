id: gcpace-4b-default-sa-editor-existing
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    Your organization has just enforced the `iam.automaticIamGrantsForDefaultServiceAccounts` organization policy constraint. In the existing project `media-web`, the Compute Engine default service account still has the Editor role (`roles/editor`) on the project.

    Twelve VMs run as that account, and the applications on them only write logs and metrics. You must apply least privilege without stopping the VMs.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Do nothing: the constraint removes the Editor role from existing default service accounts at the next policy evaluation.
    - id: b
      text:
        en: |-
          Delete the Compute Engine default service account, then disable and re-enable the Compute Engine API so that the account is recreated without the Editor role.
    - id: c
      text:
        en: |-
          Grant the Logs Writer and Monitoring Metric Writer roles to the default service account, then remove its Editor role binding from the project.
    - id: d
      text:
        en: |-
          Create a user-managed service account with the Logs Writer and Monitoring Metric Writer roles, and attach it to the twelve VMs.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The constraint only stops future automatic grants; it does not remove the Editor role already granted to default service accounts. Replacing Editor with the narrow roles the workload needs (Logs Writer and Monitoring Metric Writer) applies least privilege, and changing the account's roles does not require touching the VMs.
  options:
    a:
      en: |-
        Enforcing the constraint does not remove existing grants; the Editor binding stays until you remove it.
    b:
      en: |-
        A deleted default service account cannot be recreated, so deleting it breaks the twelve VMs.
    d:
      en: |-
        A user-managed account is the long-term best practice, but changing the service account attached to a VM requires stopping the VM.
references:
  - title: "Best practices for using service accounts securely | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
  - title: "Service accounts | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/access/service-accounts
