id: gcpace-4a-sa-creator-role
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A deployment pipeline in the project `apps-prod` must create new service accounts for each application it onboards. Another team grants roles to these accounts later. The pipeline's identity must not delete or modify existing service accounts, and you must follow the principle of least privilege.

    Which role should you grant to the pipeline's identity on the project?
body:
  options:
    - id: a
      text:
        en: |-
          Service Account User (`roles/iam.serviceAccountUser`)
    - id: b
      text:
        en: |-
          Service Account Admin (`roles/iam.serviceAccountAdmin`)
    - id: c
      text:
        en: |-
          Project IAM Admin (`roles/resourcemanager.projectIamAdmin`)
    - id: d
      text:
        en: |-
          Create Service Accounts (`roles/iam.serviceAccountCreator`)
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Creating a service account requires the Create Service Accounts role on the project. It doesn't include deleting or updating other service accounts or changing allow policies, so it matches the pipeline's single task.
  options:
    a:
      en: |-
        Service Account User lets a principal attach or act as service accounts; it doesn't allow creating them.
    b:
      en: |-
        Service Account Admin can also update, disable and delete service accounts and manage their allow policies, which is more than needed.
    c:
      en: |-
        Project IAM Admin manages the project's allow policy; granting roles is the other team's job, and it doesn't create service accounts.
references:
  - title: "Create service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-accounts-create
