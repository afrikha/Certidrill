id: gcpace-4c-gke-existing-node-pool
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You enabled Workload Identity Federation for GKE on an existing GKE Standard cluster by running gcloud container clusters update with the --workload-pool flag. The cluster has one node pool, created before the change. You granted a Cloud Storage role to a Kubernetes ServiceAccount, but Pods that use it still call Google Cloud APIs as the node service account. You can accept a brief disruption of the running workloads.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run gcloud container node-pools update on the node pool with --workload-metadata=GKE_METADATA.
    - id: b
      text:
        en: |-
          Run gcloud container clusters update again with --workload-pool so that the change reaches the node pool.
    - id: c
      text:
        en: |-
          Run kubectl rollout restart on the Deployments so that new Pods pick up federated credentials.
    - id: d
      text:
        en: |-
          Run gcloud container node-pools update on the node pool with --workload-metadata=GCE_METADATA.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Enabling the feature on the cluster doesn't change existing node pools; only new node pools use it by default. Updating the existing pool with --workload-metadata=GKE_METADATA makes its nodes run the GKE metadata server, so Pods get credentials for their Kubernetes ServiceAccount (the change applies immediately and can disrupt running workloads, which is acceptable here).
  options:
    b:
      en: |-
        The cluster setting is already applied; repeating it doesn't modify node pools that existed before.
    c:
      en: |-
        Restarted Pods land on the same nodes, which still expose the Compute Engine metadata server and the node service account.
    d:
      en: |-
        GCE_METADATA is the value that opts a node pool out of the feature, which is the current behavior.
references:
  - title: "Authenticate to Google Cloud APIs from GKE workloads | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
