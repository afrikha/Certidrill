id: gcpace-4a-undelete-custom-role
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Five days ago, an administrator deleted by mistake the organization-level custom role `dataLoader` of the organization `605214478812`. The role is granted in about 30 bindings across several projects, and those bindings no longer give any permission. You must restore the access of every principal with the least effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a new custom role with the ID `dataLoader` and the same permissions in the organization.
    - id: b
      text:
        en: |-
          Create a custom role named `dataLoaderV2` with the same permissions, and grant it in all 30 bindings.
    - id: c
      text:
        en: |-
          Run `gcloud iam roles undelete dataLoader --organization=605214478812`.
    - id: d
      text:
        en: |-
          Run `gcloud iam roles update dataLoader --organization=605214478812 --stage=GA`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A deleted custom role is suspended: its bindings stay in the allow policies but have no effect. Within 7 days of the deletion, `gcloud iam roles undelete` restores the role to its previous state, and the existing bindings work again.
  options:
    a:
      en: |-
        The ID of a deleted role can't be reused until the deletion process ends, up to 44 days after the request.
    b:
      en: |-
        A new role works but requires recreating all 30 bindings, which is far more effort than restoring the role.
    d:
      en: |-
        Changing the launch stage doesn't restore a deleted role; only `undelete` does.
references:
  - title: "Create and manage custom roles | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/creating-custom-roles
