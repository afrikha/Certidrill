id: gcpace-4a-condition-expiry-title
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A contractor group, `render-contractors@example.com`, needs the Compute Instance Admin (v1) role on the project `render-dev` until the end of 2026 (UTC). The access must end automatically at that time, with a single command and without creating any other Google Cloud resource.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud projects add-iam-policy-binding render-dev --member=group:render-contractors@example.com --role=roles/compute.instanceAdmin.v1 --condition='expression=request.time < timestamp("2027-01-01T00:00:00Z")'`.
    - id: b
      text:
        en: |-
          Run `gcloud projects add-iam-policy-binding render-dev --member=group:render-contractors@example.com --role=roles/editor --condition='expression=request.time < timestamp("2027-01-01T00:00:00Z"),title=end-2026'`.
    - id: c
      text:
        en: |-
          Run `gcloud projects add-iam-policy-binding render-dev --member=group:render-contractors@example.com --role=roles/compute.instanceAdmin.v1`, and create a Cloud Scheduler job that removes the binding on 31 December.
    - id: d
      text:
        en: |-
          Run `gcloud projects add-iam-policy-binding render-dev --member=group:render-contractors@example.com --role=roles/compute.instanceAdmin.v1 --condition='expression=request.time < timestamp("2027-01-01T00:00:00Z"),title=end-2026'`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An IAM condition on `request.time` makes the role binding apply only before the given timestamp, so access ends without any follow-up action. In `--condition`, both `expression` and `title` are required keys; `description` is optional.
  options:
    a:
      en: |-
        The condition has no `title` key, which `--condition` requires, so the command is rejected.
    b:
      en: |-
        A condition can't be added to a binding of a legacy basic role such as `roles/editor`, and Editor grants far more than the instance administration that the contractors need.
    c:
      en: |-
        A Cloud Scheduler job is an extra resource to create and maintain, which the requirement excludes; a time-based condition ends the access by itself.
references:
  - title: "gcloud projects add-iam-policy-binding | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/projects/add-iam-policy-binding
  - title: "Overview of IAM Conditions | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/conditions-overview
