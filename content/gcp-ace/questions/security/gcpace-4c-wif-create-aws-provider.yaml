id: gcpace-4c-wif-create-aws-provider
objective: "4.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You created the workload identity pool multicloud in the project fed-hub. Workloads that run in the AWS account 123456789012 must be able to federate through this pool.

    Which command should you run next?
body:
  options:
    - id: a
      text:
        en: |-
          gcloud iam workload-identity-pools providers create-aws aws-prod --location=global --workload-identity-pool=multicloud --account-id=123456789012
    - id: b
      text:
        en: |-
          gcloud iam workload-identity-pools providers create-oidc aws-prod --location=global --workload-identity-pool=multicloud --issuer-uri=https://sts.amazonaws.com
    - id: c
      text:
        en: |-
          gcloud iam workload-identity-pools create-cred-config projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/multicloud/providers/aws-prod --aws --output-file=aws.json
    - id: d
      text:
        en: |-
          gcloud iam workload-identity-pools providers create-saml aws-prod --location=global --workload-identity-pool=multicloud --idp-metadata-path=aws-metadata.xml
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An AWS provider is created with providers create-aws and the 12-digit AWS account ID in --account-id; it trusts credentials from that account. AWS providers come with a default attribute mapping, and you can add --attribute-condition to restrict which roles may authenticate.
  options:
    b:
      en: |-
        EC2 workloads present AWS credentials, which an AWS provider configured with the account ID validates; an OIDC provider expects OIDC tokens from an issuer.
    c:
      en: |-
        create-cred-config writes the client-side credential configuration file and needs an existing provider; it doesn't create the provider.
    d:
      en: |-
        SAML providers are for SAML 2.0 identity providers; EC2 workloads present AWS credentials, which an AWS provider handles.
references:
  - title: "Configure Workload Identity Federation with AWS or Azure VMs | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-other-clouds
