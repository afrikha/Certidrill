id: gcpace-4b-cross-project-topic-grant
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A Cloud Run service in the project `web-a` runs as `notify-sa@web-a.iam.gserviceaccount.com`. It must publish messages to the Pub/Sub topic `alerts` in the project `ops-b`. The constraint `iam.disableCrossProjectServiceAccountUsage` is enforced on both projects, and the security team wants no service account keys.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Set `iam.disableCrossProjectServiceAccountUsage` to not enforced on `web-a`, then grant `roles/pubsub.publisher` on the `alerts` topic to `notify-sa`.
    - id: b
      text:
        en: |-
          Grant `roles/pubsub.publisher` on the `web-a` project to `serviceAccount:notify-sa@web-a.iam.gserviceaccount.com`.
    - id: c
      text:
        en: |-
          Grant `roles/pubsub.publisher` on the `alerts` topic in `ops-b` to `serviceAccount:notify-sa@web-a.iam.gserviceaccount.com`.
    - id: d
      text:
        en: |-
          Create a service account in `ops-b` with `roles/pubsub.publisher`, and store a key for it as a secret that the Cloud Run service reads.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A service account is a principal that can be granted roles on resources in any project. Granting Pub/Sub Publisher on the `alerts` topic in `ops-b` to `notify-sa` lets the service publish there, with no key and no change to the attachment of the service account.
  options:
    a:
      en: |-
        The constraint only restricts attaching a service account to resources of another project; the service account is attached in its own project, so nothing needs to change.
    b:
      en: |-
        Roles on `web-a` do not apply to a topic in `ops-b`.
    d:
      en: |-
        This introduces a long-lived key, which the security team forbids and which is unnecessary.
references:
  - title: "Access control with Identity and Access Management | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/access-control
  - title: "Attach service accounts to resources | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/attach-service-accounts
