id: gcpace-4b-gke-node-pool-sa
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    In the GKE Standard cluster `shop-gke`, the node pool `default-pool` uses the Compute Engine default service account. The security team requires all nodes to run as `gke-nodes@shop-prd.iam.gserviceaccount.com`, which already has the Kubernetes Engine Default Node Service Account role and Artifact Registry Reader on the image repository.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a node pool with `gcloud container node-pools create pool-v2 --cluster=shop-gke --service-account=gke-nodes@shop-prd.iam.gserviceaccount.com`, move the workloads to it, and delete `default-pool`.
    - id: b
      text:
        en: |-
          Stop each node VM of `default-pool` and run `gcloud compute instances set-service-account` on it with the `gke-nodes` account.
    - id: c
      text:
        en: |-
          Enable Workload Identity Federation for GKE and bind the Kubernetes service accounts of the workloads to `gke-nodes`.
    - id: d
      text:
        en: |-
          Grant the Kubernetes Engine Default Node Service Account role to the Compute Engine default service account and remove its Editor role.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The node service account is set when a node pool is created and cannot be changed on an existing node pool. You create a new node pool with `--service-account`, move the workloads to it, and remove the old pool.
  options:
    b:
      en: |-
        Nodes belong to a managed instance group that GKE recreates from its template, so per-VM changes are not supported and do not last.
    c:
      en: |-
        Workload Identity Federation for GKE gives identities to Pods, not to the nodes; the nodes would still run as the default account.
    d:
      en: |-
        This reduces the default account's privileges but does not meet the requirement that nodes run as `gke-nodes`.
references:
  - title: "Configure GKE node service accounts | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/security/configure-node-service-accounts
  - title: "Best practices for hardening your cluster's security | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
