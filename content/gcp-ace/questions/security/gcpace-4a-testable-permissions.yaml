id: gcpace-4a-testable-permissions
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are writing an organization-level custom role for the organization `284711530926`. Your first `gcloud iam roles create` attempt fails because one of the permissions can't be used in custom roles. Before you try again, you want the list of permissions that can be included in a custom role at this level.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud iam list-grantable-roles //cloudresourcemanager.googleapis.com/organizations/284711530926`.
    - id: b
      text:
        en: |-
          Run `gcloud iam list-testable-permissions //cloudresourcemanager.googleapis.com/organizations/284711530926 --filter="customRolesSupportLevel!=NOT_SUPPORTED"`.
    - id: c
      text:
        en: |-
          Run `gcloud iam roles describe` on each predefined role that you used as a model, and copy all their permissions.
    - id: d
      text:
        en: |-
          Run `gcloud iam roles list --organization=284711530926` to list the permissions available to custom roles.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud iam list-testable-permissions` lists the permissions that apply to a resource together with their custom role support level. Filtering out `NOT_SUPPORTED` leaves the permissions that a custom role on the organization can include.
  options:
    a:
      en: |-
        `list-grantable-roles` lists roles that can be granted on the resource, not the permissions allowed in custom roles.
    c:
      en: |-
        Predefined roles can contain permissions that are not supported in custom roles, so copying their lists can reproduce the same error.
    d:
      en: |-
        `gcloud iam roles list --organization` lists the custom roles already defined in the organization, not the permissions.
references:
  - title: "Create and manage custom roles | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/creating-custom-roles
