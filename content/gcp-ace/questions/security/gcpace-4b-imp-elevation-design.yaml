id: gcpace-4b-imp-elevation-design
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    Five SREs occasionally change firewall rules in the project `net-prod`. Today they hold the Compute Security Admin role permanently. The security team wants their own user accounts to hold no firewall administration role, no service account keys to exist, and each change to stay traceable to the SRE who made it.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create the service account `fw-admin@net-prod.iam.gserviceaccount.com` and grant it Compute Security Admin on the project.
    - id: b
      text:
        en: |-
          Grant the SRE group Service Account Token Creator on the `net-prod` project.
    - id: c
      text:
        en: |-
          Create a key for `fw-admin`, store it in Secret Manager, and grant the SREs Secret Manager Secret Accessor on the secret.
    - id: d
      text:
        en: |-
          Grant the SRE group Service Account Token Creator on `fw-admin`, remove the SREs' Compute Security Admin role, and have them run changes with `--impersonate-service-account=fw-admin@net-prod.iam.gserviceaccount.com`.
    - id: e
      text:
        en: |-
          Grant the SRE group Service Account User on `fw-admin` and have them run changes with `--impersonate-service-account`.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A dedicated service account holds the privileged role, and the SREs get only Token Creator on that one account, so they elevate on demand with `--impersonate-service-account`. No key exists, and audit logs record both the SRE and the impersonated account, which keeps each change traceable.
  options:
    b:
      en: |-
        Token Creator on the project lets the SREs impersonate every service account of the project.
    c:
      en: |-
        This creates a long-lived key, and logs of key use show only the service account, not which SRE used it.
    e:
      en: |-
        Service Account User does not allow impersonation with gcloud; Token Creator is needed.
references:
  - title: "Best practices for using service accounts securely | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
  - title: "Service account impersonation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-impersonation
