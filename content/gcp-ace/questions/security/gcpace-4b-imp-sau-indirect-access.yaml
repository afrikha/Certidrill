id: gcpace-4b-imp-sau-indirect-access
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    The service account `prod-sa@core-prd.iam.gserviceaccount.com` holds broad roles in the project `core-prd`. The developers group holds these grants:

    | Resource | Role |
    | --- | --- |
    | Project `core-prd` | View Service Accounts |
    | Project `core-prd` | Compute Instance Admin (v1) |
    | Service account `prod-sa` | Service Account User |
    | Project `core-prd` | Logs Viewer |

    Developers must keep managing VMs that run as other service accounts, but they must not be able to run code with the permissions of `prod-sa` in any way. Which grant should you remove?
body:
  options:
    - id: a
      text:
        en: |-
          View Service Accounts on the project
    - id: b
      text:
        en: |-
          Compute Instance Admin (v1) on the project
    - id: c
      text:
        en: |-
          Service Account User on `prod-sa`
    - id: d
      text:
        en: |-
          Logs Viewer on the project
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Service Account User includes `actAs`: with it and Compute Instance Admin, a developer can create a VM that runs as `prod-sa`, and any code on that VM gets the account's tokens from the metadata server. Google warns that roles such as Service Account User and Token Creator allow this kind of indirect use; removing it on `prod-sa` closes the path while developers keep managing other VMs.
  options:
    a:
      en: |-
        View Service Accounts only lists accounts and their metadata; it gives no way to use them.
    b:
      en: |-
        Developers need this role to keep managing VMs, and without `actAs` on `prod-sa` it does not let them attach that account.
    d:
      en: |-
        Logs Viewer only reads logs.
references:
  - title: "Best practices for using service accounts securely | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
  - title: "Roles for service account authentication | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-permissions
