id: gcpace-4c-gke-pod-spec-fixes
objective: "4.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A GKE Standard cluster has two node pools: pool-a uses --workload-metadata=GKE_METADATA, and pool-b uses GCE_METADATA for legacy workloads. You granted a Cloud Storage role to the principal identifier of the Kubernetes ServiceAccount billing-ksa in the namespace billing. Pods of the new billing Deployment get permission errors, and the audit logs show the node service account as the caller. The Deployment manifest sets neither serviceAccountName nor any node selection.

    Which two changes should you make to the Deployment's Pod template? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set spec.serviceAccountName to billing-ksa.
    - id: b
      text:
        en: |-
          Set hostNetwork: true so that the Pods reach the metadata server directly.
    - id: c
      text:
        en: |-
          Add a nodeSelector for iam.gke.io/gke-metadata-server-enabled: "true".
    - id: d
      text:
        en: |-
          Set automountServiceAccountToken: false so that the node credentials are not used.
    - id: e
      text:
        en: |-
          Add the annotation iam.gke.io/gcp-service-account to the Pod template metadata.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Pods without serviceAccountName run as the default Kubernetes ServiceAccount, so they must reference billing-ksa. On Standard clusters, the nodeSelector iam.gke.io/gke-metadata-server-enabled: "true" makes them run on node pools with the GKE metadata server; on pool-b they get the node service account.
  options:
    b:
      en: |-
        Host-network Pods can't use Workload Identity Federation for GKE and always get the node service account.
    d:
      en: |-
        Disabling the token mount doesn't change which metadata server answers; Pods on pool-b would still get the node service account.
    e:
      en: |-
        The gcp-service-account annotation belongs on the Kubernetes ServiceAccount and only links it to an IAM service account; it isn't needed for direct grants.
references:
  - title: "Authenticate to Google Cloud APIs from GKE workloads | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
  - title: "About Workload Identity Federation for GKE | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
