id: gcpace-4c-openid-token-least-privilege
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has a private Cloud Run service. The service account sa-invoker already has the Cloud Run Invoker role on that service. A batch job that runs as the service account sa-batch must call the generateIdToken method to obtain OpenID Connect ID tokens for sa-invoker, and must never be able to obtain OAuth 2.0 access tokens or sign data as sa-invoker.

    Which role should you grant to sa-batch on sa-invoker?
body:
  options:
    - id: a
      text:
        en: |-
          Service Account OpenID Connect Identity Token Creator (roles/iam.serviceAccountOpenIdTokenCreator)
    - id: b
      text:
        en: |-
          Service Account Token Creator (roles/iam.serviceAccountTokenCreator)
    - id: c
      text:
        en: |-
          Workload Identity User (roles/iam.workloadIdentityUser)
    - id: d
      text:
        en: |-
          Cloud Run Invoker (roles/run.invoker)
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The Service Account OpenID Connect Identity Token Creator role contains only iam.serviceAccounts.getOpenIdToken, so sa-batch can create ID tokens for sa-invoker and nothing else. Cloud Run then authorizes the requests because the ID tokens represent sa-invoker, which has the Invoker role.
  options:
    b:
      en: |-
        Service Account Token Creator also includes getAccessToken, signBlob and signJwt, which the requirement forbids.
    c:
      en: |-
        Workload Identity User includes getAccessToken as well as getOpenIdToken, so it would also allow access tokens; it is meant for GKE and federated workloads.
    d:
      en: |-
        Cloud Run Invoker on the service lets a principal call it directly; it doesn't let sa-batch create ID tokens for sa-invoker.
references:
  - title: "Roles for service account authentication | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-permissions
