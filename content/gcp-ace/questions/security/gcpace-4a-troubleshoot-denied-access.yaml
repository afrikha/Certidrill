id: gcpace-4a-troubleshoot-denied-access
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer, `kai@example.com`, receives a permission error when she tries to read a secret in the project `pay-dev`. Her manager says that a role with `secretmanager.versions.access` was granted to her group, but the organization also uses deny policies and conditional role bindings. You need to find out which policy decides the result, without reading every policy in the hierarchy.

    What should you use?
body:
  options:
    - id: a
      text:
        en: |-
          The IAM role recommendations of the project, to see which permissions Kai has used in the last 90 days
    - id: b
      text:
        en: |-
          Policy Troubleshooter, with Kai's email address, the full resource name of the secret and the permission
    - id: c
      text:
        en: |-
          The Admin Activity audit logs of the project, filtered on the `SetIamPolicy` method
    - id: d
      text:
        en: |-
          The `gcloud iam list-grantable-roles` command on the secret, to list the roles that include the permission
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Policy Troubleshooter checks whether a principal has a permission on a resource by evaluating the relevant allow and deny policies. Its result shows the overall access state and the role bindings, conditions and deny rules that affect it, so you can see exactly what blocks Kai.
  options:
    a:
      en: |-
        Role recommendations compare granted and used permissions to remove excess access; they don't explain why a request is denied.
    c:
      en: |-
        Admin Activity audit logs show who changed allow policies and when, but they don't evaluate deny rules or conditions for Kai's request.
    d:
      en: |-
        `gcloud iam list-grantable-roles` lists roles that could be granted on the resource; it doesn't evaluate any principal's access.
references:
  - title: "Troubleshoot IAM permissions | Policy Intelligence | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/troubleshooting-access
