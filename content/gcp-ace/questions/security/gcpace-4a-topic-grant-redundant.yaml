id: gcpace-4a-topic-grant-redundant
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer holds the Pub/Sub Editor role (`roles/pubsub.editor`) on the project `orders-prod`. To limit him on the topic `payments`, an administrator grants him the Pub/Sub Viewer role on that topic only. No deny policy exists.

    What can the developer do on the `payments` topic?
body:
  options:
    - id: a
      text:
        en: |-
          Only view the topic, because a role granted on the topic replaces the role inherited from the project.
    - id: b
      text:
        en: |-
          Everything that Pub/Sub Editor allows, because the topic inherits the project's binding and roles add up.
    - id: c
      text:
        en: |-
          Nothing, because the two roles conflict and IAM denies requests when a resource has conflicting bindings.
    - id: d
      text:
        en: |-
          Only view the topic until the topic-level binding is removed, and then everything that Pub/Sub Editor allows.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A resource's effective allow policy is the union of its own policy and the policies inherited from its ancestors. The Pub/Sub Editor role inherited from the project still applies to the topic, so the Pub/Sub Viewer grant on the topic is redundant and limits nothing; a deny policy would be needed to restrict him.
  options:
    a:
      en: |-
        A lower-level grant never replaces an inherited one; IAM grants access if any binding grants it.
    c:
      en: |-
        Bindings don't conflict in IAM; permissions from all applicable bindings are combined.
    d:
      en: |-
        The topic-level Viewer binding doesn't block anything while it exists, so removing it changes nothing.
references:
  - title: "Using resource hierarchy for access control | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/resource-hierarchy-access-control
