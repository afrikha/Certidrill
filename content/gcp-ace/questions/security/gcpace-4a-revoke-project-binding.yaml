id: gcpace-4a-revoke-project-binding
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A consultant, `lena@example.com`, was granted the Compute Instance Admin (v1) role (`roles/compute.instanceAdmin.v1`) directly on the project `render-prod`. Her contract has ended, and she must lose this role on the project. Other principals who hold the same role must keep it.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud projects add-iam-policy-binding render-prod --member=user:lena@example.com --role=roles/compute.instanceAdmin.v1 --condition=None`.
    - id: b
      text:
        en: |-
          Run `gcloud projects remove-iam-policy-binding render-prod --member=user:lena@example.com --role=roles/compute.instanceAdmin.v1`.
    - id: c
      text:
        en: |-
          Run `gcloud iam roles delete roles/compute.instanceAdmin.v1 --project=render-prod` to remove the role from the project.
    - id: d
      text:
        en: |-
          Run `gcloud iam service-accounts disable lena@example.com` to block every role that she holds in the project.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud projects remove-iam-policy-binding` removes one principal from the binding of one role in the project's allow policy. The other members of the same binding keep the role.
  options:
    a:
      en: |-
        `add-iam-policy-binding` adds a binding; with `--condition=None` it grants the role again without a condition instead of revoking it.
    c:
      en: |-
        Predefined roles can't be deleted; `gcloud iam roles delete` only deletes custom roles, and deleting a role would affect every principal that holds it.
    d:
      en: |-
        `gcloud iam service-accounts disable` applies to service accounts, not to user accounts such as a consultant's Google Account.
references:
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
