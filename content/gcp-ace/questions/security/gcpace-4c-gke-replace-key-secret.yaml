id: gcpace-4c-gke-replace-key-secret
objective: "4.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company's GKE Standard cluster runs an application that reads a JSON service account key from a Kubernetes Secret to call BigQuery. A security review asks you to remove service account keys from the cluster and to give each application only its own permissions, following Google-recommended practice.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Rotate the key every 30 days with gcloud iam service-accounts keys create and update the Secret after each rotation.
    - id: b
      text:
        en: |-
          Enable Workload Identity Federation for GKE, and grant the BigQuery roles to the application's Kubernetes ServiceAccount.
    - id: c
      text:
        en: |-
          Grant the BigQuery roles to the node service account and delete the Secret that contains the key.
    - id: d
      text:
        en: |-
          Move the key from the Kubernetes Secret to Secret Manager, and have the application read it at startup.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Workload Identity Federation for GKE lets each Kubernetes ServiceAccount receive short-lived credentials from the GKE metadata server, so no key is stored in the cluster. IAM roles are granted to each application's own Kubernetes ServiceAccount, which keeps permissions per application.
  options:
    a:
      en: |-
        Rotation still leaves a long-lived key in the cluster, which the review asks you to remove.
    c:
      en: |-
        The node service account is shared by all Pods on the nodes, so every application would get the BigQuery permissions.
    d:
      en: |-
        The application still uses a service account key; only its storage location changes.
references:
  - title: "About Workload Identity Federation for GKE | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
