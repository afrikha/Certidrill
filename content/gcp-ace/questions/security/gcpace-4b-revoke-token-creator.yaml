id: gcpace-4b-revoke-token-creator
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A contractor, `dev@partner.example.com`, was granted the Service Account Token Creator role directly on the service account `deploy-sa@web-prd.iam.gserviceaccount.com`. His contract has ended. You must remove only his access, without affecting other principals or the workloads that use `deploy-sa`.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects remove-iam-policy-binding web-prd --member=user:dev@partner.example.com --role=roles/iam.serviceAccountTokenCreator`
    - id: b
      text:
        en: |-
          `gcloud iam service-accounts disable deploy-sa@web-prd.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `gcloud iam service-accounts remove-iam-policy-binding deploy-sa@web-prd.iam.gserviceaccount.com --member=user:dev@partner.example.com --role=roles/iam.serviceAccountTokenCreator`
    - id: d
      text:
        en: |-
          `gcloud iam service-accounts set-iam-policy deploy-sa@web-prd.iam.gserviceaccount.com empty-policy.json`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The binding was granted on the service account, so it is removed from the service account's own allow policy with `gcloud iam service-accounts remove-iam-policy-binding`, naming the member and the role. The other bindings and the account itself are unchanged.
  options:
    a:
      en: |-
        The binding is not in the project's allow policy, so changing the project policy does not remove it.
    b:
      en: |-
        Disabling the account would break every workload that uses `deploy-sa`.
    d:
      en: |-
        Setting an empty policy removes the bindings of every principal on the account, not only the contractor's.
references:
  - title: "Manage access to service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-access-service-accounts
