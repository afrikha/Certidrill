id: gcpace-4b-scheduler-oidc-run
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A Cloud Scheduler job must call the Cloud Run service `nightly-close` every night at 02:00. The service requires authentication. You created the service account `sched-invoker@fin-ops.iam.gserviceaccount.com` and granted it `roles/run.invoker` on the service.

    Which command should you run to create the job?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud scheduler jobs create http close-job --location=europe-west1 --schedule="0 2 * * *" --uri=https://nightly-close-a1b2c3-ew.a.run.app --oauth-service-account-email=sched-invoker@fin-ops.iam.gserviceaccount.com`
    - id: b
      text:
        en: |-
          `gcloud scheduler jobs create pubsub close-job --location=europe-west1 --schedule="0 2 * * *" --topic=nightly-close --message-body=run`
    - id: c
      text:
        en: |-
          `gcloud scheduler jobs create http close-job --location=europe-west1 --schedule="0 2 * * *" --uri=https://nightly-close-a1b2c3-ew.a.run.app --oidc-service-account-email=sched-invoker@fin-ops.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `gcloud scheduler jobs create http close-job --location=europe-west1 --schedule="0 2 * * *" --uri=https://nightly-close-a1b2c3-ew.a.run.app --impersonate-service-account=sched-invoker@fin-ops.iam.gserviceaccount.com`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For a Cloud Run target, the job must send an OIDC ID token. `--oidc-service-account-email` makes Cloud Scheduler generate that token as `sched-invoker`, whose Cloud Run Invoker role lets the request in.
  options:
    a:
      en: |-
        OAuth access tokens are only for targets on `*.googleapis.com`; Cloud Run expects an OIDC ID token.
    b:
      en: |-
        A Pub/Sub job only publishes a message to a topic; it does not call the service with any identity.
    d:
      en: |-
        This global flag only runs the create command as that account; the job itself would send no token.
references:
  - title: "Use authentication with HTTP targets | Cloud Scheduler | Google Cloud Documentation"
    url: https://docs.cloud.google.com/scheduler/docs/http-target-auth
