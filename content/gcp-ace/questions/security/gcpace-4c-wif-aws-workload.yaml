id: gcpace-4c-wif-aws-workload
objective: "4.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company runs a claims application on Amazon EC2 instances that have an attached AWS IAM role. The application must upload files to a Cloud Storage bucket. The security team forbids long-lived Google Cloud credentials outside Google Cloud.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a key for a Google Cloud service account and store it in AWS Secrets Manager for the application to read.
    - id: b
      text:
        en: |-
          Configure Workload Identity Federation with a workload identity pool and an AWS provider for the AWS account.
    - id: c
      text:
        en: |-
          Configure Workforce Identity Federation so that the EC2 instances sign in through the company's identity provider.
    - id: d
      text:
        en: |-
          Create HMAC keys for a Google Cloud service account and configure the application to use the XML API.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Workload Identity Federation lets the EC2 workload exchange its AWS credentials with the Security Token Service for short-lived Google Cloud tokens. You create a workload identity pool and an AWS provider, then grant access to the federated identity, so no service account key leaves Google Cloud.
  options:
    a:
      en: |-
        A service account key is a long-lived credential stored outside Google Cloud, which the security team forbids.
    c:
      en: |-
        Workforce Identity Federation is for human users who sign in with an external identity provider, not for workloads such as EC2 applications.
    d:
      en: |-
        HMAC keys are long-lived secrets as well, so they don't meet the requirement.
references:
  - title: "Workload Identity Federation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
  - title: "Configure Workload Identity Federation with AWS or Azure VMs | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-other-clouds
