id: gcpace-4a-group-membership-propagation
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your company grants roles only to Google groups. The group `sre@example.com` has had the Compute Instance Admin (v1) role on the `Prod` folder for months. Five minutes ago, you added a new engineer to the group, and she still gets permission errors when she restarts a VM in a project of the folder. Other group members can restart VMs.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Wait and retry later, because group membership changes can take from several minutes to hours to propagate.
    - id: b
      text:
        en: |-
          Grant the role directly to the engineer on each project of the folder, and remove it once the group works.
    - id: c
      text:
        en: |-
          Remove the group's binding from the folder and add it again, so that IAM recomputes the folder's members.
    - id: d
      text:
        en: |-
          Grant the group the role on the organization, because folder-level bindings don't apply to new group members.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      IAM access changes are eventually consistent. Allow policy changes typically take about 2 minutes, but group membership changes typically take several minutes and can take hours, so the engineer gets the folder's role once her membership has propagated.
  options:
    b:
      en: |-
        Direct grants break the company's group-only practice and add bindings that someone must remember to remove.
    c:
      en: |-
        Re-adding the binding doesn't speed up membership propagation and briefly removes access from the other engineers.
    d:
      en: |-
        Folder-level bindings apply to all group members, new or old; an organization grant would only widen access.
references:
  - title: "Access change propagation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/access-change-propagation
