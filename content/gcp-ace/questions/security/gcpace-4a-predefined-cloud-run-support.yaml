id: gcpace-4a-predefined-cloud-run-support
objective: "4.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Support engineers at a travel company must view the configuration and revisions of the Cloud Run services in the project `booking-prod`, and read the services' logs in Cloud Logging. They must not be able to change any resource, and you must follow the principle of least privilege with predefined roles.

    Which two roles should you grant? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Cloud Run Viewer (`roles/run.viewer`)
    - id: b
      text:
        en: |-
          Cloud Run Invoker (`roles/run.invoker`)
    - id: c
      text:
        en: |-
          Reader (`roles/reader`)
    - id: d
      text:
        en: |-
          Logs Viewer (`roles/logging.viewer`)
    - id: e
      text:
        en: |-
          Logging Admin (`roles/logging.admin`)
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Predefined roles give granular access to one service. Cloud Run Viewer lets the engineers see services and revisions without changing them, and Logs Viewer lets them read the logs in the project's log buckets.
  options:
    b:
      en: |-
        Cloud Run Invoker lets a principal call a service's endpoint; it doesn't show the service configuration or revisions.
    c:
      en: |-
        Reader is a basic role that gives read access to almost every service in the project, far beyond Cloud Run and logs.
    e:
      en: |-
        Logging Admin can change sinks, buckets and log settings, which breaks the read-only requirement.
references:
  - title: "Roles overview | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/roles-overview
