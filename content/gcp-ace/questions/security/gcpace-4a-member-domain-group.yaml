id: gcpace-4a-member-domain-group
objective: "4.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You must grant the Logs Viewer role (`roles/logging.viewer`) on the project `ops-prod` to every user of your company's Cloud Identity domain `example.com`, and to the members of a partner's Google group `noc@partner.example.org`. No organization policy restricts which domains can be granted roles. You run `gcloud projects add-iam-policy-binding ops-prod --role=roles/logging.viewer` once for each principal.

    Which two `--member` values should you use? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `--member=domain:example.com`
    - id: b
      text:
        en: |-
          `--member=user:example.com`
    - id: c
      text:
        en: |-
          `--member=allAuthenticatedUsers`
    - id: d
      text:
        en: |-
          `--member=serviceAccount:noc@partner.example.org`
    - id: e
      text:
        en: |-
          `--member=group:noc@partner.example.org`
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      The `domain:` prefix represents every principal of a Google Workspace or Cloud Identity domain, and the `group:` prefix represents all members of a Google group, including a group owned by another organization. Both are valid `--member` values of `add-iam-policy-binding`.
  options:
    b:
      en: |-
        The `user:` prefix needs the email address of one account, not a domain name.
    c:
      en: |-
        `allAuthenticatedUsers` covers anyone signed in with any Google account, far more than the two audiences that need access.
    d:
      en: |-
        The partner's address is a Google group, not a service account, so the `serviceAccount:` prefix doesn't identify it.
references:
  - title: "gcloud projects add-iam-policy-binding | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/projects/add-iam-policy-binding
