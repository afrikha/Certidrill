id: gcpace-4b-sa-viewer-analyst
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A compliance analyst must list the service accounts of the project `hr-prd` and see the metadata of their keys. She must not be able to change the accounts, attach them to resources or create tokens for them.

    Which role should you grant her on the project?
body:
  options:
    - id: a
      text:
        en: |-
          View Service Accounts (`roles/iam.serviceAccountViewer`)
    - id: b
      text:
        en: |-
          Service Account Admin (`roles/iam.serviceAccountAdmin`)
    - id: c
      text:
        en: |-
          Service Account User (`roles/iam.serviceAccountUser`)
    - id: d
      text:
        en: |-
          Service Account Key Admin (`roles/iam.serviceAccountKeyAdmin`)
answer: { optionId: a }
explanation:
  correct:
    en: |-
      View Service Accounts is the read-only role for service accounts: it lets the analyst list the accounts and list or get their keys, without changing, attaching or impersonating them.
  options:
    b:
      en: |-
        Service Account Admin can create, update, disable and delete accounts and change their allow policies.
    c:
      en: |-
        Service Account User includes `actAs`, which lets her attach the accounts to resources.
    d:
      en: |-
        Key Admin can create and delete keys, which is a change.
references:
  - title: "List and get service account keys | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/keys-list-get
  - title: "Roles for service account authentication | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-permissions
