id: gcpace-4c-wif-eks-workloads
objective: "4.2.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A media company runs an Amazon EKS cluster. Pods that use the Kubernetes ServiceAccount transcoder in the namespace media must read objects from Cloud Storage by exchanging their Kubernetes ServiceAccount tokens, without service account keys. The cluster's OIDC issuer URL is publicly reachable, and you already created a workload identity pool.

    Which three actions should you take? Choose three.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Create an OIDC provider in the pool with --issuer-uri set to the cluster's OIDC issuer URL and google.subject=assertion.sub.
    - id: b
      text:
        en: |-
          Run gcloud container clusters update on the EKS cluster with --workload-pool=PROJECT_ID.svc.id.goog to register its issuer.
    - id: c
      text:
        en: |-
          Mount a projected service account token volume in the Pods whose audience is the workload identity provider.
    - id: d
      text:
        en: |-
          Annotate the transcoder Kubernetes ServiceAccount with iam.gke.io/gcp-service-account set to a Google Cloud service account.
    - id: e
      text:
        en: |-
          Create a key for a Google Cloud service account and store it as a Kubernetes Secret in the namespace media.
    - id: f
      text:
        en: |-
          Generate a credential configuration file with --credential-source-file set to the token path, and reference it in GOOGLE_APPLICATION_CREDENTIALS.
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: |-
      For clusters outside GKE, you create an OIDC provider that trusts the cluster's issuer and maps google.subject to the token's sub claim (system:serviceaccount:NAMESPACE:KSA_NAME). The Pods mount a projected token whose audience is the provider, and a credential configuration file generated with --credential-source-file, exposed through GOOGLE_APPLICATION_CREDENTIALS, tells client libraries to exchange that token.
  options:
    b:
      en: |-
        gcloud container clusters manages GKE clusters only; an EKS cluster can't use the GKE workload pool.
    d:
      en: |-
        This annotation is read by the GKE metadata server, which doesn't exist on EKS nodes.
    e:
      en: |-
        A key stored as a Secret is the long-lived credential that federation is meant to remove.
references:
  - title: "Configure Workload Identity Federation with Kubernetes | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-kubernetes
