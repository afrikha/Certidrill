id: gcpace-4c-gke-identity-sameness
objective: "4.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The project shop-apps contains two GKE clusters with Workload Identity Federation for GKE enabled: prod-cluster and dev-cluster. Both clusters run the namespace payments with a Kubernetes ServiceAccount named payments-ksa. The principal identifier of payments-ksa has the Storage Object Admin role on a production bucket. Developers have full kubectl access to dev-cluster. Security requires that no workload on dev-cluster can access the production bucket.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add a nodeSelector to the production Pods so that only prod-cluster nodes run the payments workloads.
    - id: b
      text:
        en: |-
          Recreate dev-cluster in a separate project so that its workloads use a different workload identity pool.
    - id: c
      text:
        en: |-
          Annotate payments-ksa in prod-cluster only with iam.gke.io/gcp-service-account to mark it as the trusted identity.
    - id: d
      text:
        en: |-
          Replace the grant with one to the principalSet of the namespace payments to scope access to that namespace.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      All clusters in a project share the pool PROJECT_ID.svc.id.goog, so the same namespace and Kubernetes ServiceAccount name in two clusters is one identity (identity sameness). Moving the untrusted cluster to another project gives it a different pool, so its payments-ksa no longer matches the principal that holds the role.
  options:
    a:
      en: |-
        Scheduling doesn't change identity: Pods named payments-ksa in dev-cluster still match the same principal and keep the bucket access.
    c:
      en: |-
        This annotation only links a Kubernetes ServiceAccount to an IAM service account; the direct grant to the principal still applies in both clusters.
    d:
      en: |-
        The namespace principalSet also spans every cluster in the pool, so it is broader and still includes dev-cluster.
references:
  - title: "About Workload Identity Federation for GKE | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity
