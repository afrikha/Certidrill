id: gcpace-4b-cmek-storage-agent
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A healthcare company wants the bucket `gs://hc-scans` in the project `hc-imaging` (location `europe-west1`) to use the Cloud KMS key `projects/hc-keys/locations/europe-west1/keyRings/storage/cryptoKeys/scans` as its default key. Applications upload files as `ingest-sa@hc-imaging.iam.gserviceaccount.com`.

    Setting the default key on the bucket fails with a permission error on the key. You must follow the principle of least privilege.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant `roles/cloudkms.cryptoKeyEncrypterDecrypter` on the key to `ingest-sa@hc-imaging.iam.gserviceaccount.com`.
    - id: b
      text:
        en: |-
          Run `gcloud storage service-agent --project=hc-imaging --authorize-cmek=projects/hc-keys/locations/europe-west1/keyRings/storage/cryptoKeys/scans`.
    - id: c
      text:
        en: |-
          Grant `roles/cloudkms.admin` on the `storage` key ring to the Cloud Storage service agent of `hc-imaging`.
    - id: d
      text:
        en: |-
          Grant `roles/cloudkms.cryptoKeyEncrypterDecrypter` on the key to the Compute Engine default service account of `hc-imaging`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With CMEK, Cloud Storage encrypts and decrypts objects through the Cloud Storage service agent of the project that holds the bucket, a Google-managed service account. `gcloud storage service-agent --authorize-cmek` grants that agent the Cloud KMS CryptoKey Encrypter/Decrypter role on the key, which is the only role it needs.
  options:
    a:
      en: |-
        The application's service account does not call Cloud KMS for bucket encryption; the Cloud Storage service agent does.
    c:
      en: |-
        Cloud KMS Admin manages keys but is far broader than needed; the service agent only needs to encrypt and decrypt.
    d:
      en: |-
        The Compute Engine default service account plays no part in Cloud Storage encryption.
references:
  - title: "Use customer-managed encryption keys | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/encryption/using-customer-managed-keys
