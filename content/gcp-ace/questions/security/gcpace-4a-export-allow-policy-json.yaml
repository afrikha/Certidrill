id: gcpace-4a-export-allow-policy-json
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external auditor at a retail company asks for a copy of the allow policy that is attached to the project `shop-prod`. The auditor wants a JSON file that lists every role binding of the project, and you have the gcloud CLI configured with the required permissions.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud projects describe shop-prod --format=json > policy.json` and send the file.
    - id: b
      text:
        en: |-
          Run `gcloud iam roles list --project=shop-prod --format=json > policy.json` and send the file.
    - id: c
      text:
        en: |-
          Run `gcloud projects get-iam-policy shop-prod --format=json > policy.json` and send the file.
    - id: d
      text:
        en: |-
          Run `gcloud projects get-ancestors shop-prod --format=json > policy.json` and send the file.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud projects get-iam-policy` returns the allow policy attached to the project, with its bindings, etag and version, and `--format=json` writes it as JSON. The output file is also a valid input for `gcloud projects set-iam-policy` if you later need to change the policy.
  options:
    a:
      en: |-
        `gcloud projects describe` returns the project's metadata (ID, number, parent, lifecycle state), not its role bindings.
    b:
      en: |-
        `gcloud iam roles list --project` lists the custom roles defined in the project, not the principals who hold roles.
    d:
      en: |-
        `gcloud projects get-ancestors` lists the folders and organization above the project; it doesn't return any allow policy.
references:
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
