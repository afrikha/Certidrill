id: gcpace-4a-custom-role-org-for-folder
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Data engineers need six specific BigQuery permissions in all 40 projects of the folder `Analytics`, including future projects. No predefined role matches this set, and the engineers must not receive any other permission. You want to minimize the number of roles and bindings to maintain.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create the custom role in each of the 40 projects, and grant it to the engineers' group on each project.
    - id: b
      text:
        en: |-
          Create the custom role in one of the projects, and grant it to the engineers' group on the `Analytics` folder.
    - id: c
      text:
        en: |-
          Create the custom role at the organization level, and grant it to the engineers' group on the `Analytics` folder.
    - id: d
      text:
        en: |-
          Grant the BigQuery Admin predefined role to the engineers' group on the `Analytics` folder.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Custom roles can be defined at the organization or project level, but not at the folder level, so Google recommends defining them at the organization level when they are needed on a folder. One organization-level role and one folder binding cover every current and future project of the folder.
  options:
    a:
      en: |-
        Forty copies of the role and forty bindings are hard to keep in sync, and new projects would need their own copy.
    b:
      en: |-
        A project-level custom role can only be granted within the project where it was created, not on a folder.
    d:
      en: |-
        BigQuery Admin gives many more permissions than the six that the engineers need.
references:
  - title: "Roles overview | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/roles-overview
