id: gcpace-4b-vm-change-sa-stop
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    The VM `report-01` is running with the Compute Engine default service account. You must switch it to the user-managed service account `report-sa@fin-reports.iam.gserviceaccount.com` with the `cloud-platform` scope. You must keep the existing VM and its boot disk instead of recreating them.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute instances set-service-account report-01 --service-account=report-sa@fin-reports.iam.gserviceaccount.com --scopes=cloud-platform` while the VM is running.
    - id: b
      text:
        en: |-
          Run `gcloud compute instances add-metadata report-01 --metadata=service-account=report-sa@fin-reports.iam.gserviceaccount.com`, then reset the VM.
    - id: c
      text:
        en: |-
          Grant `roles/iam.serviceAccountUser` on `report-sa` to the Compute Engine default service account so that the VM can switch identities.
    - id: d
      text:
        en: |-
          Stop the VM, run `gcloud compute instances set-service-account report-01 --service-account=report-sa@fin-reports.iam.gserviceaccount.com --scopes=cloud-platform`, and start the VM.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Compute Engine is one of the few resources whose attached service account can be changed after creation, but the VM must be stopped first. `gcloud compute instances set-service-account` then sets the new account and its scopes, and the VM uses them once it starts again.
  options:
    a:
      en: |-
        The service account and scopes of a VM cannot be changed while it is running; the VM must be stopped first.
    b:
      en: |-
        Custom metadata does not change the attached service account.
    c:
      en: |-
        Service Account User lets a principal attach the account to resources; it does not change which account the VM uses.
references:
  - title: "Change the attached service account | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/change-service-account
