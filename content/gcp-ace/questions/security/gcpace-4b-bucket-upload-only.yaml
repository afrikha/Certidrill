id: gcpace-4b-bucket-upload-only
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A logistics company runs a nightly export job on a Compute Engine VM. The VM runs as the user-managed service account `export-job@logi-prod.iam.gserviceaccount.com`.

    The job must upload new files to the bucket `gs://logi-exports`. It must not be able to read, overwrite or delete objects, and the other buckets of the `logi-prod` project must stay out of its reach.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant `roles/storage.objectCreator` to the service account on the `logi-prod` project with `gcloud projects add-iam-policy-binding`.
    - id: b
      text:
        en: |-
          Grant `roles/storage.objectCreator` to the service account on the bucket with `gcloud storage buckets add-iam-policy-binding gs://logi-exports`.
    - id: c
      text:
        en: |-
          Grant `roles/storage.objectUser` to the service account on the bucket with `gcloud storage buckets add-iam-policy-binding gs://logi-exports`.
    - id: d
      text:
        en: |-
          Grant `roles/storage.legacyBucketWriter` to the service account on the bucket with `gcloud storage buckets add-iam-policy-binding gs://logi-exports`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Storage Object Creator lets a principal create objects but not view, delete or overwrite them. Granting it on the bucket itself, with the `serviceAccount:` principal of the job, limits the grant to `gs://logi-exports`, which is the least-privilege combination of role and scope.
  options:
    a:
      en: |-
        The role is right, but a project-level grant is inherited by every bucket of the project, so the job could upload to the other buckets too.
    c:
      en: |-
        Storage Object User also allows reading, updating and deleting objects, which the job must not be able to do.
    d:
      en: |-
        Storage Legacy Bucket Writer can create, replace and delete objects, so the job could overwrite and delete files.
references:
  - title: "IAM roles for Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/access-control/iam-roles
  - title: "Set and manage IAM policies on buckets | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/access-control/using-iam-permissions
