id: gcpace-4a-sa-create-command
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nightly export job in the project `batch-prod` needs its own identity. You must create a user-managed service account with the ID `nightly-export` and the display name "Nightly export". Your gcloud CLI already uses `batch-prod` as its default project.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud iam service-accounts keys create nightly-export.json --iam-account=nightly-export@batch-prod.iam.gserviceaccount.com`
    - id: b
      text:
        en: |-
          `gcloud iam service-accounts create nightly-export --display-name="Nightly export"`
    - id: c
      text:
        en: |-
          `gcloud iam service-accounts create nightly-export@batch-prod.iam.gserviceaccount.com --display-name="Nightly export"`
    - id: d
      text:
        en: |-
          `gcloud projects add-iam-policy-binding batch-prod --member=serviceAccount:nightly-export@batch-prod.iam.gserviceaccount.com --role=roles/viewer`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud iam service-accounts create` takes the service account ID as its argument and builds the email address `nightly-export@batch-prod.iam.gserviceaccount.com` from it. `--display-name` sets the name shown in the console, and the account is created in the current project.
  options:
    a:
      en: |-
        This command creates a key for an existing service account; it doesn't create the account, and keys should be avoided when possible.
    c:
      en: |-
        The argument is the account ID, which can contain only lowercase letters, digits and dashes, not the full email address.
    d:
      en: |-
        `add-iam-policy-binding` grants a role to a principal; it fails for a service account that doesn't exist yet.
references:
  - title: "Create service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-accounts-create
