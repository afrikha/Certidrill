id: gcpace-4b-sau-on-one-sa
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    The project `ops-tools` contains 25 service accounts, some of them highly privileged. The group `vm-operators@example.com` already has the Compute Instance Admin (v1) role on the project. Its members must be able to create VMs that run as `vm-batch@ops-tools.iam.gserviceaccount.com`, and must not be able to attach any other service account.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects add-iam-policy-binding ops-tools --member=group:vm-operators@example.com --role=roles/iam.serviceAccountUser`
    - id: b
      text:
        en: |-
          `gcloud iam service-accounts add-iam-policy-binding vm-batch@ops-tools.iam.gserviceaccount.com --member=group:vm-operators@example.com --role=roles/iam.serviceAccountTokenCreator`
    - id: c
      text:
        en: |-
          `gcloud iam service-accounts add-iam-policy-binding vm-batch@ops-tools.iam.gserviceaccount.com --member=group:vm-operators@example.com --role=roles/iam.serviceAccountUser`
    - id: d
      text:
        en: |-
          `gcloud projects add-iam-policy-binding ops-tools --member=serviceAccount:vm-batch@ops-tools.iam.gserviceaccount.com --role=roles/iam.serviceAccountUser`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Here the service account is the resource: `gcloud iam service-accounts add-iam-policy-binding` grants a role on `vm-batch` only. Service Account User on that account gives the group the `actAs` permission it needs to attach `vm-batch`, and no access to the other 24 accounts.
  options:
    a:
      en: |-
        A project-level grant is inherited by every service account of the project, including the privileged ones.
    b:
      en: |-
        Token Creator allows impersonating `vm-batch`, not attaching it to a VM.
    d:
      en: |-
        This makes `vm-batch` itself able to act as every service account of the project; it gives the group nothing.
references:
  - title: "Manage access to service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-access-service-accounts
  - title: "Best practices for using service accounts securely | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
