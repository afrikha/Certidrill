id: gcpace-4a-service-agent-hidden
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator needs to check which roles the Compute Engine Service Agent, `service-421839027715@compute-system.iam.gserviceaccount.com`, holds on the project `ops-prod`. The account doesn't appear on the IAM page of the console or on the Service Accounts page.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Open the Service Accounts page of the project, and filter the list on `compute-system` in the email column.
    - id: b
      text:
        en: |-
          Open the IAM page of the project, and select the Include Google-provided role grants checkbox.
    - id: c
      text:
        en: |-
          Enable Data Access audit logs for IAM, and wait for the service agent to appear on the IAM page.
    - id: d
      text:
        en: |-
          Run `gcloud iam service-accounts list --project=ops-prod`, and look for the service agent's email address.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Service agents are Google-managed service accounts: they are not listed among the project's service accounts, and their role grants are hidden on the IAM page by default. Selecting Include Google-provided role grants shows them with their roles.
  options:
    a:
      en: |-
        Service agents never appear on the Service Accounts page, so filtering that list can't find them.
    c:
      en: |-
        Audit logs record API activity; they don't change what the IAM page shows.
    d:
      en: |-
        `gcloud iam service-accounts list` lists the project's user-managed service accounts, not Google's service agents.
references:
  - title: "Types of service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-types
