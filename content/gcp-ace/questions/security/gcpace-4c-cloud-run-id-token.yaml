id: gcpace-4c-cloud-run-id-token
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer must test a private Cloud Run service at https://orders-abc123-uc.a.run.app from a laptop. Only the service account sa-tester has the Cloud Run Invoker role on the service; the developer's user account has no role on it. The developer has the Service Account Token Creator role on sa-tester.

    Which command should the developer use to get the token to pass in the Authorization header of the curl request?
body:
  options:
    - id: a
      text:
        en: |-
          gcloud auth print-access-token --impersonate-service-account=sa-tester@PROJECT_ID.iam.gserviceaccount.com
    - id: b
      text:
        en: |-
          gcloud auth print-identity-token --audiences=https://orders-abc123-uc.a.run.app
    - id: c
      text:
        en: |-
          gcloud auth print-identity-token --impersonate-service-account=sa-tester@PROJECT_ID.iam.gserviceaccount.com --audiences=https://orders-abc123-uc.a.run.app
    - id: d
      text:
        en: |-
          gcloud auth application-default print-access-token --scopes=https://www.googleapis.com/auth/cloud-platform
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A private Cloud Run service expects a Google-signed ID token whose audience is the service URL and whose identity has the Invoker role. Impersonating sa-tester with print-identity-token and setting --audiences to the service URL produces such a token, which the Token Creator role allows.
  options:
    a:
      en: |-
        This produces an OAuth 2.0 access token, but a request to a private Cloud Run service must carry a valid ID token for the service.
    b:
      en: |-
        Without impersonation the ID token represents the developer's user account, which has no Invoker role on the service, so the request is denied.
    d:
      en: |-
        This prints an access token for the laptop's Application Default Credentials (the developer), not an ID token for sa-tester.
references:
  - title: "gcloud auth print-identity-token | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/auth/print-identity-token
  - title: "Set custom audiences for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/custom-audiences
