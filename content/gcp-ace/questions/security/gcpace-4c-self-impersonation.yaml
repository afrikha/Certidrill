id: gcpace-4c-self-impersonation
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Cloud Run service runs as the service account sa-report. Its code first gets a token from the metadata server, then uses it to call generateAccessToken for sa-report itself, and uses the returned token to query BigQuery. The generateAccessToken call fails with a FAILED_PRECONDITION error. sa-report already has the BigQuery roles it needs, and the IAM Service Account Credentials API is enabled.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Remove the generateAccessToken call and use the access token from the metadata server, through Application Default Credentials, to call BigQuery.
    - id: b
      text:
        en: |-
          Grant sa-report the Service Account Token Creator role on itself so that it can generate access tokens for its own identity.
    - id: c
      text:
        en: |-
          Add sa-report to the constraints/iam.allowServiceAccountCredentialLifetimeExtension constraint so that the call is accepted.
    - id: d
      text:
        en: |-
          Create a key for sa-report, mount it in the service as a secret, and use it to call generateAccessToken.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Using a short-lived credential of a service account to generate a new access token for that same account is self-impersonation, which Google Cloud prohibits and which can fail with FAILED_PRECONDITION. The attached service account already gives the code a short-lived access token from the metadata server, which client libraries obtain and refresh through Application Default Credentials.
  options:
    b:
      en: |-
        A role grant doesn't lift the self-impersonation restriction; the call is rejected because caller and target are the same account.
    c:
      en: |-
        The lifetime extension constraint only allows longer token lifetimes; it doesn't permit self-impersonation.
    d:
      en: |-
        A key adds a long-lived credential to protect and rotate, and it is unnecessary because the attached account already provides tokens.
references:
  - title: "Service account credentials | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-creds
