id: gcpace-4b-member-prefix-sa
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    You need to grant the Monitoring Metric Writer role on the project `retail-dev` to the service account `metrics-agent@retail-dev.iam.gserviceaccount.com`. You run the following command:

    `gcloud projects add-iam-policy-binding retail-dev --role=roles/monitoring.metricWriter --member=MEMBER`

    Which value should you use for `MEMBER`?
body:
  options:
    - id: a
      text:
        en: |-
          `user:metrics-agent@retail-dev.iam.gserviceaccount.com`
    - id: b
      text:
        en: |-
          `principal://iam.googleapis.com/projects/-/serviceAccounts/metrics-agent@retail-dev.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `serviceAccount:metrics-agent@retail-dev.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `principalSet://cloudresourcemanager.googleapis.com/projects/retail-dev/type/ServiceAccount`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In an allow policy, a single service account is identified as `serviceAccount:` followed by its email address. `gcloud ... add-iam-policy-binding --member` uses the same format as the allow policy.
  options:
    a:
      en: |-
        The `user:` prefix identifies a Google Account of a person, not a service account.
    b:
      en: |-
        The `principal://iam.googleapis.com/projects/-/serviceAccounts/...` format identifies a service account in deny policies (IAM v2), not in allow policies.
    d:
      en: |-
        This principal set means every service account of a project, not only this one, and it takes the project number, not the project ID.
references:
  - title: "Principal identifiers | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/principal-identifiers
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
