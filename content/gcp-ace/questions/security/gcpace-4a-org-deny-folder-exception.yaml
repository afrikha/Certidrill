id: gcpace-4a-org-deny-folder-exception
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An organization-level deny policy denies `iam.googleapis.com/roles.delete` to all principals, with `iam-admins@example.com` as the only exception principal. The `Apps` folder administrator wants the group `apps-leads@example.com` to delete custom roles in the folder's projects. She attached a deny policy to `Apps` with the same rule and `apps-leads` as an exception, and granted the group Role Administrator on the folder's projects, but deletions still fail. The security team approves an exception for `apps-leads`.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant `apps-leads` the Organization Role Administrator role on the organization so that its allow binding takes precedence over the deny rule.
    - id: b
      text:
        en: |-
          Delete the deny policy attached to the `Apps` folder, because two deny policies with the same rule cancel each other out.
    - id: c
      text:
        en: |-
          Move the projects of `apps-leads` to a new folder that has no deny policy, so that they no longer inherit the denial.
    - id: d
      text:
        en: |-
          Add `apps-leads@example.com` as an exception principal in the organization-level deny policy.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Deny policies are inherited down the hierarchy and each one is evaluated independently, so the organization-level rule still denies the permission even though the folder's own policy has an exception. Adding the group to the exception principals of the organization-level policy is what lets its members use the permission.
  options:
    a:
      en: |-
        IAM checks deny policies before allow policies; no allow binding, at any level, overrides a deny rule.
    b:
      en: |-
        Deny policies don't cancel each other; removing the folder policy leaves the organization-level denial in place.
    c:
      en: |-
        Any folder in the organization still inherits the organization-level deny policy, so moving the projects doesn't remove the denial.
references:
  - title: "Deny policies | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/deny-overview
