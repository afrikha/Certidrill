id: gcpace-4a-etag-read-modify-write
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A platform team runs a script that changes several role bindings of the project `data-prod` at once. The script runs `gcloud projects get-iam-policy data-prod --format=json`, edits the JSON file, and then runs `gcloud projects set-iam-policy data-prod policy.json`. Sometimes the last step fails with a 409 conflict because another administrator changed the policy in the meantime. The team must not overwrite changes made by others.

    What should the script do? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Keep the `etag` field of the downloaded policy unchanged in the edited JSON file.
    - id: b
      text:
        en: |-
          Delete the `etag` field from the JSON file before it runs `set-iam-policy`.
    - id: c
      text:
        en: |-
          After a 409 conflict, read the policy again, reapply the edits, and retry with backoff.
    - id: d
      text:
        en: |-
          Set the `version` field of the JSON file to 1 before it runs `set-iam-policy`.
    - id: e
      text:
        en: |-
          Add the `--quiet` flag to `set-iam-policy` so that it overrides the conflict.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The `etag` makes the write conditional: IAM applies the policy only if the etag still matches the current one, otherwise it returns 409 Conflict instead of overwriting concurrent changes. The documented response is to repeat the whole read-modify-write cycle, with exponential backoff, on the fresh policy.
  options:
    b:
      en: |-
        Without an etag the write is no longer checked against the current policy, so it can overwrite another administrator's changes.
    d:
      en: |-
        Version 1 doesn't support conditions; writing a version 1 policy can drop conditional bindings, and it doesn't prevent concurrent overwrites.
    e:
      en: |-
        `--quiet` only disables interactive prompts; it doesn't bypass or resolve an etag conflict.
references:
  - title: "Understanding allow policies | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/policies
