id: gcpace-4c-wif-required-apis
objective: "4.2.8"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are setting up Workload Identity Federation in a new project for an Azure DevOps pipeline that will impersonate a Google Cloud service account. The IAM API and the Cloud Resource Manager API are already enabled in the project.

    Which two additional APIs must you enable? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Secret Manager API (secretmanager.googleapis.com)
    - id: b
      text:
        en: |-
          Security Token Service API (sts.googleapis.com)
    - id: c
      text:
        en: |-
          Cloud Key Management Service API (cloudkms.googleapis.com)
    - id: d
      text:
        en: |-
          Identity Toolkit API (identitytoolkit.googleapis.com)
    - id: e
      text:
        en: |-
          IAM Service Account Credentials API (iamcredentials.googleapis.com)
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Workload Identity Federation exchanges the external token through the Security Token Service, and service account impersonation then issues a short-lived access token through the IAM Service Account Credentials API. Google lists both, together with the IAM and Resource Manager APIs, as prerequisites.
  options:
    a:
      en: |-
        Secret Manager stores secrets; federation is designed so that no secret has to be stored.
    c:
      en: |-
        Cloud KMS manages encryption keys and plays no part in the token exchange.
    d:
      en: |-
        Identity Toolkit supports Identity Platform sign-in for applications, not workload federation.
references:
  - title: "Configure Workload Identity Federation with deployment pipelines | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-deployment-pipelines
