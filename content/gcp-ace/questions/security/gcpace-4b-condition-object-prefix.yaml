id: gcpace-4b-condition-object-prefix
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A partner integration runs on a VM as `partner-feed@acme-data.iam.gserviceaccount.com`. It downloads objects by name from the bucket `gs://acme-shared` and never lists the bucket. It must be able to read only the objects whose names start with `partner-a/`.

    Uniform bucket-level access is enabled on the bucket.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant `roles/storage.objectViewer` on the bucket with the IAM condition `resource.name.startsWith("projects/_/buckets/acme-shared/objects/partner-a/")`.
    - id: b
      text:
        en: |-
          Grant `roles/storage.objectViewer` on the bucket with the IAM condition `resource.name.startsWith("gs://acme-shared/partner-a/")`.
    - id: c
      text:
        en: |-
          Add an object ACL that gives the service account `READER` access to each object whose name starts with `partner-a/`.
    - id: d
      text:
        en: |-
          Grant `roles/storage.objectViewer` on the bucket with the IAM condition `resource.name == "projects/_/buckets/acme-shared/objects/partner-a/"`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      IAM Conditions can restrict a bucket-level grant to objects whose resource name starts with a prefix. Cloud Storage object names in conditions use the format `projects/_/buckets/BUCKET/objects/OBJECT`, and conditions require uniform bucket-level access, which is enabled here.
  options:
    b:
      en: |-
        Conditions evaluate the resource name `projects/_/buckets/...`, not a `gs://` URL, so this condition never matches.
    c:
      en: |-
        Uniform bucket-level access disables ACLs: access is controlled by IAM only.
    d:
      en: |-
        An equality test matches only an object named exactly `partner-a/`, not the objects under that prefix.
references:
  - title: "Attribute reference for IAM Conditions | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/conditions-attribute-reference
  - title: "Set and manage IAM policies on buckets | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/access-control/using-iam-permissions
