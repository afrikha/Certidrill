id: gcpace-4a-default-sa-no-editor
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company created its organization in 2025 and kept the default organization policies. A new VM in the project `tracking-prod` runs with the Compute Engine default service account, and its application gets 403 errors when it writes objects to the bucket `gs://tracking-events`. A colleague expected the default service account to hold the Editor role. You must follow the principle of least privilege and Google-recommended practices.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Editor role on the project to the Compute Engine default service account so that it gets the access that older projects have.
    - id: b
      text:
        en: |-
          Stop enforcing `iam.automaticIamGrantsForDefaultServiceAccounts` on the project so that the default service account receives the Editor role.
    - id: c
      text:
        en: |-
          Create a user-managed service account, grant it Storage Object Creator on the bucket, and configure the VM to use that account.
    - id: d
      text:
        en: |-
          Create a key for the Compute Engine default service account, and store the key file on the VM for the application to use.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Organizations created after May 3, 2024 enforce `iam.automaticIamGrantsForDefaultServiceAccounts` by default, so default service accounts no longer receive Editor automatically. A dedicated user-managed service account with only Storage Object Creator on the bucket gives the application the access it needs and nothing more.
  options:
    a:
      en: |-
        Editor gives write access to almost every service in the project, far more than writing objects to one bucket.
    b:
      en: |-
        Google recommends keeping this constraint enforced, and the Editor role it would allow is still far broader than the application needs.
    d:
      en: |-
        A key only authenticates as the same account, which still has no role on the bucket; keys are also a security risk to avoid.
references:
  - title: "Types of service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/service-account-types
