id: gcpace-4b-who-has-access-on-sa
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    Before a security review, you need to see which principals have been granted roles directly on the service account `billing-export@fin-prd.iam.gserviceaccount.com`, such as Service Account User or Service Account Token Creator.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects get-iam-policy fin-prd`
    - id: b
      text:
        en: |-
          `gcloud iam service-accounts keys list --iam-account=billing-export@fin-prd.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `gcloud iam service-accounts describe billing-export@fin-prd.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `gcloud iam service-accounts get-iam-policy billing-export@fin-prd.iam.gserviceaccount.com`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A service account is also a resource with its own allow policy. `gcloud iam service-accounts get-iam-policy` returns that policy, which lists the principals granted roles such as Service Account User or Token Creator on the account.
  options:
    a:
      en: |-
        The project policy shows grants made on the project, not the bindings stored on the service account.
    b:
      en: |-
        This lists the account's keys, not the principals who have roles on it.
    c:
      en: |-
        `describe` returns the account's metadata (email, unique ID, display name, disabled state), not its allow policy.
references:
  - title: "Manage access to service accounts | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-access-service-accounts
