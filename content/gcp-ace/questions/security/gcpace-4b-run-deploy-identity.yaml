id: gcpace-4b-run-deploy-identity
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    You are deploying the container image of the service `catalog` to Cloud Run in `us-central1`. The service must call Firestore as the user-managed service account `catalog-sa@shop-prd.iam.gserviceaccount.com` instead of the default service account, without any service account key.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud run deploy catalog --image=us-central1-docker.pkg.dev/shop-prd/apps/catalog:1.4 --region=us-central1 --impersonate-service-account=catalog-sa@shop-prd.iam.gserviceaccount.com`
    - id: b
      text:
        en: |-
          `gcloud run deploy catalog --image=us-central1-docker.pkg.dev/shop-prd/apps/catalog:1.4 --region=us-central1 --set-env-vars=GOOGLE_APPLICATION_CREDENTIALS=/secrets/catalog-sa.json`
    - id: c
      text:
        en: |-
          `gcloud run deploy catalog --image=us-central1-docker.pkg.dev/shop-prd/apps/catalog:1.4 --region=us-central1 --service-account=catalog-sa@shop-prd.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `gcloud run services add-iam-policy-binding catalog --region=us-central1 --member=serviceAccount:catalog-sa@shop-prd.iam.gserviceaccount.com --role=roles/run.invoker`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The `--service-account` flag of `gcloud run deploy` sets the service identity of the new revision. The code then gets credentials for `catalog-sa` from the metadata server through Application Default Credentials, with no key. The deployer needs Service Account User on that account.
  options:
    a:
      en: |-
        `--impersonate-service-account` only runs the deploy request as that account; the service still runs as the default service account.
    b:
      en: |-
        This relies on a key file, and Cloud Run documentation says never to set `GOOGLE_APPLICATION_CREDENTIALS` on a service that uses service identity.
    d:
      en: |-
        This lets `catalog-sa` call the `catalog` service; it does not make the service run as `catalog-sa`.
references:
  - title: "Configure service identity for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/services/service-identity
  - title: "Introduction to service identity | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/securing/service-identity
