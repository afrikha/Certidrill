id: gcpace-4b-secret-accessor-one-secret
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A Cloud Run service in the project `shop-prod` runs as `checkout-sa@shop-prod.iam.gserviceaccount.com`. At startup it must read the value of the Secret Manager secret `payment-gateway-key`. The project contains 40 other secrets that the service must not read.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant `roles/secretmanager.secretAccessor` to the service account on the `shop-prod` project.
    - id: b
      text:
        en: |-
          Grant `roles/secretmanager.viewer` to the service account on the `payment-gateway-key` secret.
    - id: c
      text:
        en: |-
          Grant `roles/secretmanager.secretVersionManager` to the service account on the `payment-gateway-key` secret.
    - id: d
      text:
        en: |-
          Grant `roles/secretmanager.secretAccessor` to the service account on the `payment-gateway-key` secret.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Secret Manager Secret Accessor is the role that allows reading a secret's payload. Secret Manager recommends granting it at the lowest level of the hierarchy, here on the one secret, for example with `gcloud secrets add-iam-policy-binding payment-gateway-key`.
  options:
    a:
      en: |-
        Granted on the project, Secret Accessor covers every secret in the project, including the 40 others.
    b:
      en: |-
        Secret Manager Viewer shows metadata only; it does not include `secretmanager.versions.access`, so the service cannot read the value.
    c:
      en: |-
        Secret Version Manager can add, disable and destroy versions but cannot access the payload, and it allows changes the service does not need.
references:
  - title: "Access control with IAM | Secret Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/secret-manager/docs/access-control
