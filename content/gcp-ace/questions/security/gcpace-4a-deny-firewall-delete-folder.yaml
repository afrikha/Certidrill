id: gcpace-4a-deny-firewall-delete-folder
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The security team of an insurance company wants to stop anyone from deleting VPC firewall rules in the projects of the `Production` folder, whatever roles they hold now or receive later. Only the members of `net-security@example.com` must keep this ability. Projects in other folders must not be affected.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Remove every role that contains `compute.firewalls.delete` from the principals in the folder's projects, and grant those roles to the group only.
    - id: b
      text:
        en: |-
          Create a custom role without `compute.firewalls.delete`, and replace the predefined Compute Engine roles that the teams hold with it.
    - id: c
      text:
        en: |-
          Attach a deny policy to the `Production` folder that denies `compute.googleapis.com/firewalls.delete` to all principals, with the group as an exception principal.
    - id: d
      text:
        en: |-
          Attach a deny policy to the organization that denies `compute.googleapis.com/firewalls.delete` to all principals, and grant the group Compute Security Admin on the folder.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A deny policy blocks the listed permissions for the listed principals regardless of the roles they are granted, and it is inherited by every project under its attachment point. Attaching it to the folder limits it to production, and an exception principal keeps the permission for the security group. You create it with `gcloud iam policies create --attachment-point=... --kind=denypolicies --policy-file=...`.
  options:
    a:
      en: |-
        Removing today's bindings doesn't stop roles from being granted again later, which the requirement covers.
    b:
      en: |-
        A custom role only limits the principals who receive it; any other role granted now or later can still include the permission.
    d:
      en: |-
        IAM checks deny policies before allow policies, so the group would be denied too, and an organization-level deny policy also affects the other folders.
references:
  - title: "Deny policies | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/deny-overview
  - title: "Deny access to resources | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/deny-access
