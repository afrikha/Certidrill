id: gcpace-4b-oslogin-needs-sau
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    OS Login is enabled on the project `db-ops`. An engineer has the Compute OS Admin Login role (`roles/compute.osAdminLogin`) on the project. She can connect with SSH to VMs that have no service account, but SSH to the VM `db-tools`, which runs as `dbtools-sa@db-ops.iam.gserviceaccount.com`, fails with a permission error. She belongs to the same organization as the VM.

    What should you do, following the principle of least privilege?
body:
  options:
    - id: a
      text:
        en: |-
          Grant her `roles/compute.instanceAdmin.v1` on the `db-tools` VM.
    - id: b
      text:
        en: |-
          Grant her `roles/iam.serviceAccountUser` on `dbtools-sa`.
    - id: c
      text:
        en: |-
          Grant her `roles/iam.serviceAccountTokenCreator` on `dbtools-sa`.
    - id: d
      text:
        en: |-
          Grant her `roles/compute.osLoginExternalUser` on the organization.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With OS Login, a user who connects to a VM that has a service account also needs Service Account User on that account, because she could then run code as it. Granting the role on `dbtools-sa` alone fixes the error without other access.
  options:
    a:
      en: |-
        Compute Instance Admin (v1) manages instances but does not include `actAs` on the attached service account.
    c:
      en: |-
        OS Login requires `actAs` (Service Account User); Token Creator grants impersonation, a different and unneeded permission.
    d:
      en: |-
        OS Login External User is only for users from another organization than the VM.
references:
  - title: "Set up OS Login | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin
  - title: "Best practices for using service accounts securely | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
