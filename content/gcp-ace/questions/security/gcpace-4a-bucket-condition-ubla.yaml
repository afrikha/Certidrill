id: gcpace-4a-bucket-condition-ubla
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An analyst must read objects in the Cloud Storage bucket `gs://q4-reports` until 15 January, and in no other bucket of the project. You run `gcloud storage buckets add-iam-policy-binding` on the bucket with the Storage Object Viewer role and a `request.time` condition, but the command fails. The bucket uses fine-grained access control, and no application depends on its object ACLs.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Storage Object Viewer role on the project without a condition, and remove the binding on 15 January.
    - id: b
      text:
        en: |-
          Enable uniform bucket-level access on the bucket, and then add the conditional binding on the bucket again.
    - id: c
      text:
        en: |-
          Put the same condition in a YAML file, and add the binding on the bucket again with `--condition-from-file`.
    - id: d
      text:
        en: |-
          Add an object ACL that gives the analyst read access, and set an expiration date on the ACL entry.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A conditional role binding in a bucket's allow policy requires uniform bucket-level access on that bucket. Once it is enabled, the binding with the `request.time` condition gives the analyst read access to this bucket only, and the access ends by itself on 15 January.
  options:
    a:
      en: |-
        A project-level grant covers every bucket of the project, which breaks the one-bucket requirement, and the removal is a manual follow-up.
    c:
      en: |-
        `--condition-from-file` is only another way to pass the same condition; the bucket still doesn't accept conditional bindings with fine-grained access control.
    d:
      en: |-
        Cloud Storage ACL entries don't carry an expiration date, so the access wouldn't end automatically.
references:
  - title: "Overview of IAM Conditions | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/conditions-overview
