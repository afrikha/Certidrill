id: gcpace-4c-wif-github-attribute-condition
objective: "4.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your company uses GitHub Actions in the GitHub organization example-org. You created an OIDC provider in a workload identity pool with the issuer URI https://token.actions.githubusercontent.com/ and the attribute mapping google.subject=assertion.sub,attribute.repository=assertion.repository. No attribute condition is set. A security review states that, as configured, workflows from any GitHub organization can authenticate through the provider.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Update the provider with --allowed-audiences=https://github.com/example-org so that only tokens for your organization are accepted.
    - id: b
      text:
        en: |-
          Change the attribute mapping to google.subject=assertion.repository_owner so that each organization gets its own subject.
    - id: c
      text:
        en: |-
          Update the provider with --attribute-condition="assertion.repository_owner=='example-org'".
    - id: d
      text:
        en: |-
          Create a separate workload identity pool for each repository and move the provider into it.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      GitHub uses one issuer URL for all organizations, so Google requires an attribute condition that limits the provider to your organization, such as assertion.repository_owner=='example-org'. Tokens whose claims don't satisfy the condition are rejected before any IAM policy is evaluated; you can set it with gcloud iam workload-identity-pools providers update-oidc --attribute-condition.
  options:
    a:
      en: |-
        The audience identifies the intended recipient of the token (the provider), not the GitHub organization that ran the workflow.
    b:
      en: |-
        Attribute mappings only translate claims; without a condition, tokens from any organization are still accepted.
    d:
      en: |-
        Splitting pools doesn't filter tokens: each provider would still accept any organization's workflows without a condition.
references:
  - title: "Configure Workload Identity Federation with deployment pipelines | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-deployment-pipelines
  - title: "gcloud iam workload-identity-pools providers update-oidc | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/iam/workload-identity-pools/providers/update-oidc
