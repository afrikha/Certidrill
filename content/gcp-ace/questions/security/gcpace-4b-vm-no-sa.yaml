id: gcpace-4b-vm-no-sa
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    You must create the VM `sandbox-01` to run untrusted third-party code. Code on the VM must not be able to get any credentials for Google Cloud APIs from the metadata server. The other VMs of the project use the Compute Engine default service account and must keep working.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create the VM with `gcloud compute instances create sandbox-01 --zone=europe-west4-a --no-service-account --no-scopes`.
    - id: b
      text:
        en: |-
          Create the VM with default settings, then remove all IAM roles from the Compute Engine default service account.
    - id: c
      text:
        en: |-
          Create the VM with `--service-account` set to a new service account that has no roles, and with `--scopes=cloud-platform`.
    - id: d
      text:
        en: |-
          Create the VM with default settings and enable OS Login on it.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `--no-service-account` with `--no-scopes` creates the VM without any attached service account, so the metadata server has no service account credentials to give to code on the VM.
  options:
    b:
      en: |-
        The other VMs use the same default service account, so removing its roles would break them.
    c:
      en: |-
        The VM would still get access tokens for the new account from the metadata server; the requirement is no credentials at all.
    d:
      en: |-
        OS Login controls SSH access to the VM; it does not stop code on the VM from getting service account tokens.
references:
  - title: "Change the attached service account | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/change-service-account
  - title: "Service accounts | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/access/service-accounts
