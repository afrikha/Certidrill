id: gcpace-4a-bucket-level-grant
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The project `media-assets` contains 25 Cloud Storage buckets with uniform bucket-level access. A freelance editor, `noa@example.com`, must download objects from the bucket `gs://promo-videos` and must not see any other bucket's objects. You must follow the principle of least privilege.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud projects add-iam-policy-binding media-assets --member=user:noa@example.com --role=roles/storage.objectViewer`.
    - id: b
      text:
        en: |-
          Run `gcloud storage buckets add-iam-policy-binding gs://promo-videos --member=user:noa@example.com --role=roles/storage.objectAdmin`.
    - id: c
      text:
        en: |-
          Run `gcloud projects add-iam-policy-binding media-assets --member=user:noa@example.com --role=roles/storage.objectViewer`, and attach a deny policy for the other buckets.
    - id: d
      text:
        en: |-
          Run `gcloud storage buckets add-iam-policy-binding gs://promo-videos --member=user:noa@example.com --role=roles/storage.objectViewer`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Granting the role on the bucket puts the binding in the bucket's allow policy, so it applies to that bucket's objects only. Storage Object Viewer lets the editor list and download objects without changing them.
  options:
    a:
      en: |-
        A project-level grant is inherited by all 25 buckets, so the editor would see every bucket's objects.
    b:
      en: |-
        Storage Object Admin also allows creating, overwriting and deleting objects, which is more than downloading.
    c:
      en: |-
        Deny policies attach to organizations, folders and projects, not to individual buckets, and granting broadly then denying is the opposite of least privilege.
references:
  - title: "Using resource hierarchy for access control | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/resource-hierarchy-access-control
  - title: "gcloud storage buckets add-iam-policy-binding | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/buckets/add-iam-policy-binding
