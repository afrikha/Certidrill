id: gcpace-4b-cloudsql-secret-two-roles
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A Cloud Run service in the project `crm-prd` runs as `crm-api@crm-prd.iam.gserviceaccount.com`. It connects to a Cloud SQL for PostgreSQL instance of the same project through the Cloud SQL connector, and it reads the database password from the Secret Manager secret `db-password`. The project contains other secrets that the service must not read.

    You need to follow the principle of least privilege. Which two role grants should you make? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant `roles/cloudsql.client` to the service account on the `crm-prd` project.
    - id: b
      text:
        en: |-
          Grant `roles/cloudsql.editor` to the service account on the `crm-prd` project.
    - id: c
      text:
        en: |-
          Grant `roles/secretmanager.secretAccessor` to the service account on the `db-password` secret.
    - id: d
      text:
        en: |-
          Grant `roles/secretmanager.secretAccessor` to the service account on the `crm-prd` project.
    - id: e
      text:
        en: |-
          Grant `roles/secretmanager.viewer` to the service account on the `db-password` secret.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Connecting through the Cloud SQL Auth Proxy or a Cloud SQL connector requires the Cloud SQL Client role, which includes the connect permission. Reading the password requires Secret Manager Secret Accessor, granted on the one secret so that the other secrets stay out of reach.
  options:
    b:
      en: |-
        Cloud SQL Editor lets the account modify instances and export data, far beyond connecting.
    d:
      en: |-
        Secret Accessor on the project covers every secret of the project.
    e:
      en: |-
        Secret Manager Viewer shows metadata only and cannot read the secret's value.
references:
  - title: "Roles and permissions | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/roles-and-permissions
  - title: "Access control with IAM | Secret Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/secret-manager/docs/access-control
