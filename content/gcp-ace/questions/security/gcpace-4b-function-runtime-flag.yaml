id: gcpace-4b-function-runtime-flag
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    You deploy a Cloud Run function named `resize-images` with `gcloud functions deploy`. Eventarc triggers it when an image is uploaded to a bucket. The function code must write thumbnails to another bucket as the service account `thumbs-sa@media-prd.iam.gserviceaccount.com`.

    Which flag should you add to the deploy command?
body:
  options:
    - id: a
      text:
        en: |-
          `--trigger-service-account=thumbs-sa@media-prd.iam.gserviceaccount.com`
    - id: b
      text:
        en: |-
          `--service-account=thumbs-sa@media-prd.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `--build-service-account=projects/media-prd/serviceAccounts/thumbs-sa@media-prd.iam.gserviceaccount.com`
    - id: d
      text:
        en: |-
          `--impersonate-service-account=thumbs-sa@media-prd.iam.gserviceaccount.com`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In `gcloud functions deploy`, `--service-account` sets the identity of the running function, which determines what the function code can do. Without it, the function runs as the Compute Engine default service account.
  options:
    a:
      en: |-
        The trigger service account is the identity the Eventarc trigger uses to invoke the function, not the identity of the function code.
    c:
      en: |-
        The build service account is used only while the function is built, not when it runs.
    d:
      en: |-
        This global flag runs the deploy command itself as that account; it does not set the function's runtime identity.
references:
  - title: "gcloud functions deploy | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/functions/deploy
  - title: "Attach service accounts to resources | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/attach-service-accounts
