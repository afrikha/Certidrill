id: gcpace-4a-disable-custom-role
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The project `batch-prod` has a custom role, `batchOperator`, granted to eight groups. After a suspected misuse, the security team asks you to suspend immediately all access granted through this role. The investigation could last two months, and at the end the team wants to restore the access quickly without recreating any binding.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud iam roles update batchOperator --project=batch-prod --stage=DISABLED`.
    - id: b
      text:
        en: |-
          Run `gcloud iam roles update batchOperator --project=batch-prod --stage=DEPRECATED`.
    - id: c
      text:
        en: |-
          Run `gcloud iam roles delete batchOperator --project=batch-prod`, and undelete the role at the end of the investigation.
    - id: d
      text:
        en: |-
          Run `gcloud projects remove-iam-policy-binding batch-prod` for each group, and record the bindings in a file.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Setting a custom role's launch stage to `DISABLED` inactivates every role binding that uses it, while the bindings stay in the allow policies. Setting the stage back to `GA` later restores the access with no binding to recreate.
  options:
    b:
      en: |-
        `DEPRECATED` is informational: it signals that the role will be retired, but the bindings keep granting the permissions.
    c:
      en: |-
        A deleted role can be undeleted only within 7 days; after that it is permanently deleted and its bindings are removed, long before the two-month investigation ends.
    d:
      en: |-
        Removing the bindings means recreating them later, which the security team wants to avoid.
references:
  - title: "Create and manage custom roles | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/creating-custom-roles
