id: gcpace-4a-role-recommendations-basic
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In the project `legacy-erp`, about 40 users and service accounts were granted the legacy Editor basic role (`roles/editor`) years ago. You want to replace each of these grants with less permissive roles that match the permissions each principal actually used, with the least manual analysis and without breaking active workloads.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Review the IAM role recommendations for the project, and apply the ones that remove or replace each Editor grant.
    - id: b
      text:
        en: |-
          Replace every Editor grant with the Reader basic role, and grant other roles when users report errors.
    - id: c
      text:
        en: |-
          Run Policy Troubleshooter for each principal to find the permissions that it needs, and build custom roles.
    - id: d
      text:
        en: |-
          Export the Admin Activity audit logs to BigQuery, and design one custom role per principal from the results.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Role recommendations, generated by the IAM recommender, compare the permissions that each principal was granted with the permissions that it used, over up to 90 days. They suggest removing unused roles or replacing them with less permissive roles, and recommendations for basic roles at the project level are free.
  options:
    b:
      en: |-
        Downgrading everyone first would break service accounts and users that need write permissions, which the requirement excludes.
    c:
      en: |-
        Policy Troubleshooter explains whether one principal has one permission; it doesn't analyze which permissions were used.
    d:
      en: |-
        Building roles from audit logs is a long manual analysis, and Admin Activity logs don't record every data read.
references:
  - title: "Overview of role recommendations | Policy Intelligence | Google Cloud Documentation"
    url: https://docs.cloud.google.com/policy-intelligence/docs/role-recommendations-overview
