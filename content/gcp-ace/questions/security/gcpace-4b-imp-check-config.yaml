id: gcpace-4b-imp-check-config
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    Your gcloud commands are sent with the permissions of a service account even though you never add a flag to them. You suspect that a colleague changed your active gcloud configuration so that it impersonates a service account.

    Which command shows the service account that the configuration impersonates?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud config get auth/impersonate_service_account`
    - id: b
      text:
        en: |-
          `gcloud config get core/account`
    - id: c
      text:
        en: |-
          `gcloud auth list`
    - id: d
      text:
        en: |-
          `gcloud iam service-accounts list`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Impersonation for every command is set with the `auth/impersonate_service_account` property of the gcloud configuration. Reading that property shows which service account, or chain of accounts, is impersonated; `gcloud config unset` removes it.
  options:
    b:
      en: |-
        `core/account` is the authenticated account that gcloud uses, which stays your own user account when impersonating.
    c:
      en: |-
        `gcloud auth list` shows the accounts that have credentials in gcloud and the active one; impersonation is a configuration property, not a credentialed account.
    d:
      en: |-
        This lists the service accounts of the project, not the one your configuration impersonates.
references:
  - title: "Use service account impersonation | Authentication | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/authentication/use-service-account-impersonation
