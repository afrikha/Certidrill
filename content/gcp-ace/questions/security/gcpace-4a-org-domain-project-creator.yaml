id: gcpace-4a-org-domain-project-creator
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company has just created its Google Cloud organization for the Cloud Identity domain `example.com` and kept the initial organization allow policy. Any employee can now create projects under the organization. The company wants only the members of `cloud-platform@example.com` to create projects.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          On the organization, remove the Project Creator role from `domain:example.com`, and grant Project Creator to the platform group.
    - id: b
      text:
        en: |-
          On the organization, remove the Billing Account Creator role from `domain:example.com`, and grant it to the platform group.
    - id: c
      text:
        en: |-
          On the organization, grant the Project Creator role to the platform group, and keep the other bindings unchanged.
    - id: d
      text:
        en: |-
          On each project that employees created, remove the Owner role from its creator, and grant Owner to the platform group.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When an organization is created, its initial allow policy grants Project Creator and Billing Account Creator to the whole domain. Removing the domain's Project Creator binding at the organization level, and granting the role to the platform group, limits project creation to that group in the whole hierarchy.
  options:
    b:
      en: |-
        Billing Account Creator controls who can create billing accounts; employees could still create projects.
    c:
      en: |-
        Adding a binding doesn't remove the domain-wide one; every employee would still inherit Project Creator.
    d:
      en: |-
        Owner on existing projects doesn't control who can create new projects under the organization.
references:
  - title: "About resource hierarchy | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
