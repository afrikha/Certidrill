id: gcpace-4b-pubsub-push-auth
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    You need a push subscription that delivers messages of the topic `invoices` to the Cloud Run service `invoice-worker`, which rejects unauthenticated requests. You created the service account `push-sa@billing-prd.iam.gserviceaccount.com`. The Pub/Sub service agent already has the Service Account Token Creator role on the project.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant `roles/pubsub.publisher` on the `invoices` topic to `push-sa`.
    - id: b
      text:
        en: |-
          Create the subscription with `gcloud pubsub subscriptions create invoices-push --topic=invoices --push-endpoint=https://invoice-worker-a1b2c3-ew.a.run.app --push-auth-service-account=push-sa@billing-prd.iam.gserviceaccount.com`.
    - id: c
      text:
        en: |-
          Grant `roles/run.invoker` on `invoice-worker` to the Pub/Sub service agent.
    - id: d
      text:
        en: |-
          Grant `roles/run.invoker` on `invoice-worker` to `push-sa`.
    - id: e
      text:
        en: |-
          Grant `roles/run.invoker` on `invoice-worker` to `allUsers`.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      With `--push-auth-service-account`, Pub/Sub signs a token for `push-sa` and sends it with each push request. Cloud Run then authorizes the request as `push-sa`, so that account needs Cloud Run Invoker on the service.
  options:
    a:
      en: |-
        Publisher is for publishing to the topic; the push subscription delivers messages and needs no publisher role.
    c:
      en: |-
        The token identifies `push-sa`, not the service agent; the agent only creates the token.
    e:
      en: |-
        Granting Invoker to `allUsers` makes the service public, which defeats the authentication requirement.
references:
  - title: "Authentication for push subscriptions | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/authenticate-push-subscriptions
