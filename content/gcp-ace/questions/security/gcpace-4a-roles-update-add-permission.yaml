id: gcpace-4a-roles-update-add-permission
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The project `ops-prod` has a custom role with the ID `vmOperator` that contains `compute.instances.start` and `compute.instances.stop`. Operators now also need to reset VMs. You must add `compute.instances.reset` to the role and keep its existing permissions.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud iam roles update vmOperator --project=ops-prod --add-permissions=compute.instances.reset`
    - id: b
      text:
        en: |-
          `gcloud iam roles update vmOperator --project=ops-prod --permissions=compute.instances.reset`
    - id: c
      text:
        en: |-
          `gcloud iam roles create vmOperator --project=ops-prod --permissions=compute.instances.reset`
    - id: d
      text:
        en: |-
          `gcloud projects add-iam-policy-binding ops-prod --role=vmOperator --member=compute.instances.reset`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `gcloud iam roles update` with `--add-permissions` appends the listed permissions to the custom role and leaves the others in place. The role ID is followed by `--project` or `--organization` to say where the custom role is defined.
  options:
    b:
      en: |-
        `--permissions` replaces the whole permission list, so the role would lose `start` and `stop`.
    c:
      en: |-
        `create` makes a new role; it fails because a role with this ID already exists in the project.
    d:
      en: |-
        `add-iam-policy-binding` grants a role to a principal; `--member` takes a principal, not a permission.
references:
  - title: "gcloud iam roles update | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/iam/roles/update
