id: gcpace-2b-kubectl-apply-directory
objective: "2.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    The manifests of an application, a Deployment, a Service and a ConfigMap, are stored in the k8s/ directory of a Git repository. Some of these objects already exist in the GKE cluster and others are new. On every merge, the pipeline must create the missing objects and update the existing ones to match the files.

    Which command should the pipeline run?
body:
  options:
    - id: a
      text:
        en: |-
          `kubectl create -f k8s/`
    - id: b
      text:
        en: |-
          `kubectl apply -f k8s/`
    - id: c
      text:
        en: |-
          `kubectl replace -f k8s/`
    - id: d
      text:
        en: |-
          `kubectl run app --image=IMAGE_URL`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `kubectl apply -f` with a directory processes every manifest in it: it creates the objects that don't exist yet and updates the existing ones to match the files, so the same command works on every merge.
  options:
    a:
      en: |-
        `kubectl create` fails for objects that already exist, so the pipeline would error after the first deployment.
    c:
      en: |-
        `kubectl replace` fails for objects that don't exist yet, so new manifests wouldn't be created.
    d:
      en: |-
        `kubectl run` creates a single Pod from an image and ignores the manifests stored in the repository.
references:
  - title: "Deploying a stateless Linux application | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/stateless-apps
