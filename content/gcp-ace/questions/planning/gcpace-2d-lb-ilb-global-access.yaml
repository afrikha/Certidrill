id: gcpace-2d-lb-ilb-global-access
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company exposes a database proxy through an internal passthrough Network Load Balancer whose forwarding rule `db-proxy-fr` is in `us-central1`, in the VPC network `corp-vpc`. Clients in `us-central1` connect successfully. New clients in a `europe-west1` subnet of the same network time out, although firewall rules allow their traffic to the backends. The backends must stay in `us-central1`.

    What should you do?
body:
  options:
    - { id: a, text: { en: "`gcloud compute networks update corp-vpc --bgp-routing-mode=global`" } }
    - { id: b, text: { en: "Create a second internal passthrough Network Load Balancer in europe-west1 whose backend service uses the us-central1 instance groups." } }
    - { id: c, text: { en: "`gcloud compute forwarding-rules update db-proxy-fr --region=us-central1 --allow-global-access`" } }
    - { id: d, text: { en: "Create an ingress firewall rule in corp-vpc that allows the health check range 35.191.0.0/16 to the backends." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      By default, an internal passthrough Network Load Balancer accepts clients only from its own region. Enabling global access on the forwarding rule (`allowGlobalAccess`) lets clients from any region of the network reach it, while the backends stay in `us-central1`.
  options:
    a: { en: "The dynamic routing mode controls which regions Cloud Routers learn and advertise routes for; it does not lift the load balancer's regional client restriction." }
    b: { en: "The backends of an internal passthrough Network Load Balancer must be in the same region as its backend service and forwarding rule." }
    d: { en: "Health checks already work, since clients in us-central1 reach healthy backends; the problem is the clients' region." }
references:
  - title: "Internal passthrough Network Load Balancer overview | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/internal
