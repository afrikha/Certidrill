id: gcpace-2c-private-google-access-subnet
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Batch VMs in the subnet `batch-us` (`us-central1`) have only internal IP addresses. They must read objects from Cloud Storage and load results into BigQuery through the public Google API endpoints. The security policy forbids any other access from these VMs to the internet. The network keeps its default route to the default internet gateway, and egress firewall rules allow the traffic.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Cloud NAT gateway on a Cloud Router in `us-central1` that serves the `batch-us` subnet.
    - id: b
      text:
        en: |-
          Assign an ephemeral external IP address to each batch VM.
    - id: c
      text:
        en: |-
          Delete the default route to the default internet gateway from the network.
    - id: d
      text:
        en: |-
          Run `gcloud compute networks subnets update batch-us --region=us-central1 --enable-private-ip-google-access`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Private Google Access is a per-subnet setting that lets VMs with only internal IP addresses reach the external IP addresses of Google APIs and services. It doesn't give the VMs a path to other internet destinations.
  options:
    a:
      en: |-
        Cloud NAT would let the VMs reach any internet destination, which the security policy forbids.
    b:
      en: |-
        External IP addresses give the VMs direct internet access, which the policy forbids.
    c:
      en: |-
        Removing the default route doesn't give the VMs access to Google APIs; it breaks it, because with the default API domains Private Google Access needs routes with the default internet gateway as next hop.
references:
  - title: "Private Google Access | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/private-google-access
