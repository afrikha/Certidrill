id: gcpace-2c-spanner-global-bookings
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A ticketing company sells seats for concerts on three continents. The booking service needs a relational schema, SQL queries and ACID transactions so that a seat is never sold twice. It must keep accepting bookings from every continent if one Google Cloud region fails, and the write volume is expected to outgrow what a single database server can handle.

    Which database should you deploy?
body:
  options:
    - id: a
      text:
        en: |-
          A Cloud SQL for PostgreSQL instance with high availability and a cross-region read replica on each continent
    - id: b
      text:
        en: |-
          A Bigtable instance with one cluster on each continent and an app profile that uses multi-cluster routing
    - id: c
      text:
        en: |-
          A Spanner instance that uses a multi-region instance configuration
    - id: d
      text:
        en: |-
          A BigQuery dataset in a multi-region location with streaming inserts from the booking service
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Spanner is a relational database with SQL and ACID transactions that scales writes horizontally by adding compute capacity. A multi-region instance configuration keeps read-write replicas in several regions, offers 99.999% availability and keeps serving writes when one region fails.
  options:
    a:
      en: |-
        Cloud SQL has a single primary that scales vertically, so it can't grow beyond one server for writes. Cross-region read replicas are read-only and must be promoted manually after a regional failure.
    b:
      en: |-
        Bigtable is a NoSQL wide-column store without a relational schema or multi-row ACID transactions, and its replication between clusters is eventually consistent, so it can't guarantee that a seat is sold only once.
    d:
      en: |-
        BigQuery is an analytics data warehouse, not a transactional database for an online booking workload.
references:
  - title: "Regional, dual-region, and multi-region configurations | Spanner | Google Cloud Documentation"
    url: https://docs.cloud.google.com/spanner/docs/instance-configurations
