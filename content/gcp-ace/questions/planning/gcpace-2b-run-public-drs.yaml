id: gcpace-2b-run-public-drs
objective: "2.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A company's projects are under an organization policy that enforces domain restricted sharing, so IAM policies can't include allUsers. A team must deploy the container image of a public marketing site to Cloud Run as the service promo. Anyone on the internet must be able to open the site without signing in.

    Which command should the team run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud run deploy promo --image=IMAGE_URL --region=europe-west1 --allow-unauthenticated`
    - id: b
      text:
        en: |-
          `gcloud run deploy promo --image=IMAGE_URL --region=europe-west1 --ingress=all`
    - id: c
      text:
        en: |-
          `gcloud run deploy promo --image=IMAGE_URL --region=europe-west1 --no-invoker-iam-check`
    - id: d
      text:
        en: |-
          `gcloud run deploy promo --image=IMAGE_URL --region=europe-west1 --no-allow-unauthenticated`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `--no-invoker-iam-check` disables the Invoker IAM check, so Cloud Run serves requests without checking the caller's identity and without adding allUsers to the IAM policy. Google recommends this method for public services, and it works in projects under a domain restricted sharing policy.
  options:
    a:
      en: |-
        `--allow-unauthenticated` grants the Cloud Run Invoker role to allUsers, which the domain restricted sharing policy blocks.
    b:
      en: |-
        Ingress settings control which networks can send requests to the service; with `--ingress=all` alone, callers still need the Invoker role.
    d:
      en: |-
        `--no-allow-unauthenticated` keeps the service private, so visitors who don't have the Invoker role are refused.
references:
  - title: "Allowing public (unauthenticated) access | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/authenticating/public
