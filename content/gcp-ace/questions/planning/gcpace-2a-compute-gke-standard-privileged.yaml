id: gcpace-2a-compute-gke-standard-privileged
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A cybersecurity firm runs its containerized scanning platform on Kubernetes. The platform includes an in-house DaemonSet that runs privileged containers to tune kernel parameters on every node, and engineers sometimes SSH into nodes to collect low-level diagnostics. The firm wants a managed Kubernetes control plane and the fewest components to operate that still support these needs.

    Which compute option should you choose?
body:
  options:
    - id: a
      text: { en: "A GKE Autopilot cluster, with the DaemonSet deployed in the kube-system namespace so that it can run privileged." }
    - id: b
      text: { en: "A Cloud Run service per component, with the DaemonSet logic moved into a sidecar container of each service." }
    - id: c
      text: { en: "A GKE Standard cluster, with node pools that the team manages and the privileged DaemonSet deployed on them." }
    - id: d
      text: { en: "A self-managed Kubernetes cluster that the firm installs on Compute Engine VMs in a managed instance group." }
answer: { optionId: c }
explanation:
  correct:
    en: In GKE Standard you manage the node pools, so you can run privileged containers and connect to the nodes over SSH, while Google still manages the control plane. Autopilot blocks SSH access to nodes and does not allow privileged containers unless they come from verified Google Cloud partners.
  options:
    a: { en: "Autopilot rejects privileged containers from your own workloads, wherever they are deployed, and blocks SSH to nodes, so both needs fail." }
    b: { en: "Cloud Run manages the kernel for you and gives no access to the host, so per-node kernel tuning and node SSH are impossible." }
    d: { en: "A self-managed cluster supports the needs but makes the firm operate the control plane, which fails the managed control plane requirement." }
references:
  - title: "GKE Autopilot security measures | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-security
  - title: "Choose compute options | Compute | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/compute-area/choose-compute-options
