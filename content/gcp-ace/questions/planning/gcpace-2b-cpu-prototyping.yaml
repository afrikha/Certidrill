id: gcpace-2b-cpu-prototyping
objective: "2.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A data scientist is prototyping a small model that trains in a few minutes with small batch sizes. During the next weeks, the model will change many times a day, and the team wants the most flexible and least expensive option for this phase.

    Which compute option should the data scientist use?
body:
  options:
    - id: a
      text:
        en: |-
          General-purpose Compute Engine VMs with CPUs only
    - id: b
      text:
        en: |-
          A Cloud TPU slice
    - id: c
      text:
        en: |-
          A3 High VMs with NVIDIA H100 GPUs
    - id: d
      text:
        en: |-
          A4 VMs with NVIDIA B200 GPUs
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Google recommends CPUs for quick prototyping that needs maximum flexibility, for simple models that don't take long to train, and for small models with small effective batch sizes. CPU-only VMs also avoid paying for accelerators that this phase doesn't need.
  options:
    b:
      en: |-
        TPUs pay off for large models dominated by matrix computations that train for a long time with large batches.
    c:
      en: |-
        A3 High VMs target model training and serving at scale, an expensive choice for a small prototype.
    d:
      en: |-
        A4 VMs target foundation model training and serving, far beyond the needs of a small prototype.
references:
  - title: "Introduction to Cloud TPU | Google Cloud Documentation"
    url: https://docs.cloud.google.com/tpu/docs/intro-to-tpu
  - title: "GPU machine types | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/gpus
