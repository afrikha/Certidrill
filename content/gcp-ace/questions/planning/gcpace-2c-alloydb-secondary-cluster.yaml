id: gcpace-2c-alloydb-secondary-cluster
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The AlloyDB for PostgreSQL cluster `ledger` runs in `europe-west1`, and its primary instance already has high availability. You must be able to run the database from `europe-west4` if `europe-west1` becomes unavailable, with a copy that is continuously replicated and can be promoted to read-write.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a secondary cluster in `europe-west4` with `gcloud alloydb clusters create-secondary`, and promote it if `europe-west1` fails.
    - id: b
      text:
        en: |-
          Add a read pool instance to the `ledger` cluster, and point the application to it if `europe-west1` fails.
    - id: c
      text:
        en: |-
          Run `gcloud alloydb clusters export` every hour to a Cloud Storage bucket in `europe-west4`, and import the latest export into a new cluster if `europe-west1` fails.
    - id: d
      text:
        en: |-
          Recreate the primary instance with a standby node in another zone of `europe-west1`, and rely on its automatic failover.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AlloyDB cross-region replication uses a secondary cluster that replicates asynchronously from the primary cluster and serves reads; Google recommends placing it in another region for disaster recovery. During a regional outage, promoting the secondary cluster makes it a stand-alone primary cluster with read and write capability.
  options:
    b:
      en: |-
        A read pool belongs to the cluster in `europe-west1` and serves reads only, so it is lost with the region and can't accept writes.
    c:
      en: |-
        Hourly exports aren't continuous replication: they could lose up to an hour of data, and importing into a new cluster takes much longer than a promotion.
    d:
      en: |-
        The primary instance already has an active and a standby node in different zones; this protects against a zone failure, not the loss of `europe-west1`.
references:
  - title: "Cross-region replication overview | AlloyDB for PostgreSQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/alloydb/docs/cross-region-replication/about-cross-region-replication
