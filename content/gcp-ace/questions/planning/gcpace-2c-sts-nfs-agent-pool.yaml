id: gcpace-2c-sts-nfs-agent-pool
objective: "2.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An engineering firm has 80 TB of project files on an on-premises NFS server and a 10 Gbps Cloud Interconnect connection to Google Cloud. It wants Storage Transfer Service to copy the files to `gs://brightline-projects` and then run an incremental sync every night until the migration ends. You already created an agent pool named `nfs-pool`, and several on-premises Linux servers with Docker installed mount the NFS share at `/mnt/projects`.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Order a Transfer Appliance and copy the project files to it.
    - id: b
      text:
        en: |-
          Run `gcloud transfer agents install --pool=nfs-pool` on each Linux server that mounts the share.
    - id: c
      text:
        en: |-
          Create HMAC keys for a service account and configure them on the NFS server.
    - id: d
      text:
        en: |-
          Install the Ops Agent on the NFS server so that Storage Transfer Service can read its files.
    - id: e
      text:
        en: |-
          Run `gcloud transfer jobs create posix:///mnt/projects/ gs://brightline-projects --source-agent-pool=nfs-pool --schedule-repeats-every=1d`.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Transfers from a file system need Storage Transfer Service agents, which run in containers (Docker by default) on machines that can read the data; Google recommends at least three agents per pool on separate machines. The transfer job then uses the `posix://` source scheme with `--source-agent-pool`, and each scheduled run copies only new or changed files.
  options:
    a:
      en: |-
        With a 10 Gbps interconnect, an online transfer is practical, and an appliance can't run the nightly incremental syncs.
    c:
      en: |-
        HMAC keys authenticate to Cloud Storage or S3-compatible APIs; they play no part in reading an NFS file system.
    d:
      en: |-
        The Ops Agent collects logs and metrics for Cloud Logging and Cloud Monitoring; it doesn't transfer files.
references:
  - title: "Manage transfer agents | Storage Transfer Service | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage-transfer/docs/on-prem-overview
  - title: "Data transfer options | Storage Transfer Service | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage-transfer/docs/transfer-options
