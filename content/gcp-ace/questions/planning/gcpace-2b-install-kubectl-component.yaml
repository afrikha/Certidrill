id: gcpace-2b-install-kubectl-component
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    An engineer installed the Google Cloud CLI on a macOS laptop from the downloaded archive with the interactive installer. The engineer must now install kubectl to manage GKE clusters, and wants it to be kept up to date by the same tool that updates the other Google Cloud CLI components.

    What should the engineer run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud services enable container.googleapis.com`
    - id: b
      text:
        en: |-
          `gcloud components update`
    - id: c
      text:
        en: |-
          `gcloud components install kubectl`
    - id: d
      text:
        en: |-
          `gcloud container clusters get-credentials`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With a Google Cloud CLI installed from the archive, the component manager installs kubectl at the version that matches the installation with `gcloud components install kubectl`. Later runs of `gcloud components update` update it together with the other installed components.
  options:
    a:
      en: |-
        Enabling the Kubernetes Engine API lets a project use GKE; it doesn't install any tool on the laptop.
    b:
      en: |-
        `gcloud components update` updates the components that are already installed; it doesn't add kubectl.
    d:
      en: |-
        `get-credentials` writes a kubeconfig entry for a named cluster; it doesn't install kubectl.
references:
  - title: "Managing gcloud CLI components | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/docs/components
  - title: "Install kubectl and configure cluster access | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl
