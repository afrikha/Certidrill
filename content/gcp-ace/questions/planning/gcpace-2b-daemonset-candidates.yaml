id: gcpace-2b-daemonset-candidates
objective: "2.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A platform team is deciding how to deploy five components to a GKE Standard cluster whose node pools scale up and down during the day.

    Which two components should be deployed as DaemonSets? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          A log collection agent that must read the container logs of every node, including nodes added by autoscaling
    - id: b
      text:
        en: |-
          A stateless web front end that must run four replicas behind a load balancer
    - id: c
      text:
        en: |-
          A three-replica message broker in which each replica keeps its own persistent volume and stable name
    - id: d
      text:
        en: |-
          A node tuning Pod that must set a kernel parameter on every node as soon as the node joins the cluster
    - id: e
      text:
        en: |-
          A database schema migration that must run once to completion before each new release
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A DaemonSet makes sure that all (or selected) nodes run a copy of a Pod, and nodes added to the cluster also get one. A per-node log agent and a Pod that tunes a kernel parameter on each new node both need exactly this behavior.
  options:
    b:
      en: |-
        A stateless front end with a fixed number of replicas is a Deployment; its replica count must not follow the number of nodes.
    c:
      en: |-
        Replicas with stable names and their own persistent volumes are the use case of a StatefulSet.
    e:
      en: |-
        A task that runs once to completion is a Job, not a Pod that runs permanently on every node.
references:
  - title: "Automatically bootstrap GKE nodes with DaemonSets | Kubernetes Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/solutions/automatically-bootstrapping-gke-nodes-with-daemonsets
  - title: "About StatefulSets in GKE | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/statefulset
