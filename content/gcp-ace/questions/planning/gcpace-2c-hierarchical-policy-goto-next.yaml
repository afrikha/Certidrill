id: gcpace-2c-hierarchical-policy-goto-next
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The security team is creating a hierarchical firewall policy associated with the `prod` folder. Ingress RDP (TCP port 3389) from the internet must be blocked in every project of the folder, and project teams must not be able to override this. Ingress SSH (TCP port 22) from the corporate range `198.51.100.0/24` must be decided by each project team with the VPC firewall rules of its own network.

    Which action should the policy rule that matches SSH from `198.51.100.0/24` use?
body:
  options:
    - id: a
      text:
        en: |-
          `allow`
    - id: b
      text:
        en: |-
          `deny`
    - id: c
      text:
        en: |-
          `apply_security_profile_group`
    - id: d
      text:
        en: |-
          `goto_next`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Hierarchical firewall policies are evaluated before VPC firewall rules, and an `allow` or `deny` match stops evaluation. `goto_next` passes the matching traffic to the next step of the evaluation order, so the VPC firewall rules of each project's network decide about SSH, while a `deny` rule for TCP port 3389 enforces the RDP block that projects can't override.
  options:
    a:
      en: |-
        An `allow` match ends evaluation, so SSH from the range would be allowed in every project, and project VPC firewall rules couldn't deny it.
    b:
      en: |-
        A `deny` match ends evaluation, so SSH would be blocked everywhere, and project teams couldn't allow it.
    c:
      en: |-
        `apply_security_profile_group` sends the traffic to a firewall endpoint for inspection; it doesn't delegate the decision to the projects' VPC firewall rules.
references:
  - title: "Evaluation order for firewall policies and rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies-rule-eval-order
  - title: "Firewall policy rule components | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies-rule-details
