id: gcpace-2c-fw-egress-allowlist
objective: "2.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Payment VMs with the network tag `pay` run in the VPC network `pay-vpc`, which has no egress firewall rules yet. The VMs may open outbound connections only to the range `10.50.0.0/16` on TCP port 443; every other outbound connection from these VMs must be blocked. Other VMs in the network must not be affected.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute firewall-rules create pay-deny-out --network=pay-vpc --direction=EGRESS --action=DENY --rules=all --destination-ranges=0.0.0.0/0 --target-tags=pay --priority=100`
    - id: b
      text:
        en: |-
          `gcloud compute firewall-rules create pay-allow-out --network=pay-vpc --direction=EGRESS --action=ALLOW --rules=tcp:443 --destination-ranges=10.50.0.0/16 --target-tags=pay --priority=1000`
    - id: c
      text:
        en: |-
          `gcloud compute firewall-rules create pay-deny-out --network=pay-vpc --direction=EGRESS --action=DENY --rules=all --destination-ranges=0.0.0.0/0 --target-tags=pay --priority=65000`
    - id: d
      text:
        en: |-
          `gcloud compute firewall-rules create pay-deny-in --network=pay-vpc --direction=INGRESS --action=DENY --rules=all --source-ranges=0.0.0.0/0 --target-tags=pay --priority=65000`
    - id: e
      text:
        en: |-
          Delete the implied allow egress rule of `pay-vpc`.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      Egress is allowed by default, so you need an egress deny rule for all destinations and an egress allow rule for the permitted destination. The allow rule must have a lower priority number (1000) than the deny rule (65000) so that it is evaluated first; both target only the tag `pay`.
  options:
    a:
      en: |-
        With priority 100, the deny rule takes precedence over the allow rule at priority 1000, so even connections to `10.50.0.0/16` on port 443 are blocked.
    d:
      en: |-
        An ingress rule filters incoming connections; it doesn't block connections that the VMs open to other destinations.
    e:
      en: |-
        The allow egress behavior is an implied action applied when no rule matches, not a rule that you can delete; you override it with explicit deny rules.
references:
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
  - title: "Use VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/using-firewalls
