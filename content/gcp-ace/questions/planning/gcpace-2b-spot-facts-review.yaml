id: gcpace-2b-spot-facts-review
objective: "2.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A software company plans to run its continuous integration build agents on Spot VMs in a project that has never requested preemptible quota. Builds take 10 to 40 minutes and are retried automatically when an agent disappears. Before approving the plan, the team lead asks you to confirm how Spot VMs behave.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Spot VMs are not covered by any Service Level Agreement.
    - id: b
      text:
        en: |-
          Spot VMs are stopped automatically after 24 hours of runtime, even when capacity remains available.
    - id: c
      text:
        en: |-
          When Compute Engine preempts a Spot VM, it restarts the VM automatically as a standard VM at the on-demand price.
    - id: d
      text:
        en: |-
          Compute Engine can preempt a Spot VM at any time, and the shutdown period that follows is best effort and up to 30 seconds.
    - id: e
      text:
        en: |-
          Spot VMs can use only preemptible quota, so the team must request preemptible quota before it creates any Spot VM.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Spot VMs have no SLA, and Compute Engine can preempt them at any time to reclaim capacity, after which the VM gets a best-effort shutdown period of up to 30 seconds. Build agents whose builds are retried automatically tolerate these interruptions.
  options:
    b:
      en: |-
        The 24-hour limit applies to the older preemptible VMs; Spot VMs have no maximum runtime unless you set one.
    c:
      en: |-
        A preempted Spot VM is stopped or deleted according to its termination action; Compute Engine doesn't convert it to a standard VM.
    e:
      en: |-
        In a region where the project has no preemptible quota, Spot VMs can use standard quota.
references:
  - title: "Spot VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/spot
