id: gcpace-2c-managed-lustre-training
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AI research lab trains models on hundreds of GPU VMs and GKE nodes at the same time. Every training job reads a shared 1.5 PiB data set through a POSIX file system mounted by all clients, and the jobs need very high aggregate throughput. The data set originates in Cloud Storage, and the lab wants a fully managed service.

    Which storage solution should you recommend?
body:
  options:
    - id: a
      text:
        en: |-
          A Filestore zonal instance mounted over NFS by every client
    - id: b
      text:
        en: |-
          A Cloud Storage bucket from which each job copies the data set to the Local SSDs of its VMs
    - id: c
      text:
        en: |-
          A Hyperdisk Throughput volume attached to each training VM
    - id: d
      text:
        en: |-
          A Google Cloud Managed Lustre instance that imports the data set from Cloud Storage
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Managed Lustre is a fully managed, POSIX-compliant parallel file system for HPC and AI training. It scales from 9,000 GiB to about 80 PiB with throughput of up to 10 TBps, mounts on Compute Engine and GKE clients, and transfers data to and from Cloud Storage.
  options:
    a:
      en: |-
        A Filestore zonal instance holds at most 100 TiB, far less than the 1.5 PiB data set.
    b:
      en: |-
        Copying 1.5 PiB to the local disks of every job isn't a shared mounted file system, and the copy time and space on each VM make it impractical.
    c:
      en: |-
        Separate disks give each VM its own copy of the data instead of one shared file system for all clients.
references:
  - title: "Managed Lustre | Google Cloud Documentation"
    url: https://docs.cloud.google.com/managed-lustre/docs/overview
  - title: "Filestore overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/filestore/docs/overview
