id: gcpace-2b-run-deploy-source
objective: "2.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer wrote a Python function named `handle_order` in `main.py`, in the current directory, which has no Dockerfile. It must be deployed from source as the Cloud Run function `orders-fn` in us-central1, and Cloud Run must run `handle_order` each time the function is invoked.

    Which command should the developer run?
body:
  options:
    - id: a
      text: { en: "`gcloud run deploy orders-fn --source . --region us-central1`" }
    - id: b
      text: { en: "`gcloud run deploy orders-fn --source . --set-env-vars=ENTRYPOINT=handle_order --region us-central1`" }
    - id: c
      text: { en: "`gcloud run deploy orders-fn --source . --function handle_order --base-image python314 --region us-central1`" }
    - id: d
      text: { en: "`gcloud run deploy orders-fn --image=handle_order --region us-central1`" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Cloud Run function is deployed from source with `gcloud run deploy --source`, where `--function` gives the entry point in the source code, the code that Cloud Run executes when the function runs, and `--base-image` selects the runtime environment, such as `python314`.
  options:
    a: { en: "Without `--function`, the source is deployed as an ordinary service, and nothing tells Cloud Run to run `handle_order` as the function's entry point." }
    b: { en: "An environment variable named `ENTRYPOINT` is just data for the code; it doesn't set the function's entry point." }
    d: { en: "`--image` expects the address of an existing container image, not the name of a function in the source code." }
references:
  - title: "Deploy a Cloud Run function | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/deploy-functions
