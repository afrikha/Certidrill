id: gcpace-2d-ai-cloud-assist-tasks
objective: "2.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company has set up Gemini Cloud Assist for its cloud engineers. The engineers want to use it to plan and implement new infrastructure faster, and the security team wants to know what the assistant is used for.

    Which two tasks can the engineers perform with Gemini Cloud Assist? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Describe an application in natural language in Application Design Center and get a suggested architecture to refine." } }
    - { id: b, text: { en: "Enforce organization policy constraints on new projects without configuring the Organization Policy Service." } }
    - { id: c, text: { en: "Generate or refine gcloud commands, kubectl manifests, and Terraform code through a chat conversation." } }
    - { id: d, text: { en: "Run agent workflows from a local terminal or an SSH session with the agy command-line client." } }
    - { id: e, text: { en: "Store and lock Terraform state for the team in place of a Cloud Storage backend." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Gemini Cloud Assist (a Preview offering) works in the console and in Application Design Center: from a natural language description, it suggests an architecture that you refine on the canvas and turn into Terraform. Through chat, it can also generate or refine gcloud commands, kubectl manifests, and Terraform code, which engineers review before using them.
  options:
    b: { en: "Organization policy constraints are enforced by the Organization Policy Service; Gemini Cloud Assist does not enforce policies." }
    d: { en: "agy is the command-line client of Google Antigravity, a separate agentic development platform." }
    e: { en: "Terraform state belongs in a backend such as Cloud Storage; an assistant is not a state backend." }
references:
  - title: "Gemini Cloud Assist overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/cloud-assist/overview
  - title: "Design an application with Gemini assistance | Gemini Cloud Assist | Google Cloud Documentation"
    url: https://docs.cloud.google.com/cloud-assist/design-application
