id: gcpace-2c-cloudsql-import-bucket-access
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You uploaded a MySQL dump file to the private bucket `gs://lumen-migration`. The dump contains confidential data. You have the Cloud SQL Admin role and run `gcloud sql import sql inventory-db gs://lumen-migration/inventory.sql.gz --database=inventory`, but the operation fails because the Cloud SQL instance can't read the object.

    What should you do before you run the import again?
body:
  options:
    - id: a
      text:
        en: |-
          Grant your own user account the Storage Object Viewer role on the bucket `gs://lumen-migration`.
    - id: b
      text:
        en: |-
          Grant the Cloud SQL Client role on the project to the service account that the instance uses.
    - id: c
      text:
        en: |-
          Grant the Storage Object Admin role on the bucket to the instance's service account, shown by `gcloud sql instances describe`.
    - id: d
      text:
        en: |-
          Grant the Storage Object Viewer role on the bucket to `allUsers` until the import has finished.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Cloud SQL reads the dump file with the instance's own service account, whose email address appears as `serviceAccountEmailAddress` in `gcloud sql instances describe`. The import procedure grants that service account the Storage Object Admin role on the bucket, and you can remove the binding after the import.
  options:
    a:
      en: |-
        The import isn't read with your credentials, so a role on your own account doesn't let the instance read the object.
    b:
      en: |-
        Cloud SQL Client lets principals connect to instances; it grants no access to Cloud Storage objects.
    d:
      en: |-
        Making the bucket public exposes the confidential dump to anyone on the internet.
references:
  - title: "Export and import using SQL dump files | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/import-export/import-export-sql
