id: gcpace-2d-conn-peering-onprem-routes
objective: "2.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An insurance company's network team manages the VPC network `hub-vpc`, which reaches the data center (`192.168.0.0/16`) through HA VPN. The Cloud Router `cr-hub` in `us-central1` uses the default advertisement mode. An application team's network `app-vpc` (subnet `10.50.0.0/20`) is peered with `hub-vpc` through the peering `hub-to-app` in `hub-vpc` and `app-to-hub` in `app-vpc`. VMs in `app-vpc` cannot reach the data center, and the data center cannot reach `app-vpc`. Firewall rules already allow the traffic. The traffic must use the existing HA VPN connection.

    Which three actions should you take? Choose three.
body:
  choose: 3
  options:
    - { id: a, text: { en: "`gcloud compute networks peerings update hub-to-app --network=hub-vpc --export-custom-routes`" } }
    - { id: b, text: { en: "`gcloud compute networks peerings update app-to-hub --network=app-vpc --import-custom-routes`" } }
    - { id: c, text: { en: "`gcloud compute routers update cr-hub --region=us-central1 --advertisement-mode=CUSTOM --set-advertisement-groups=ALL_SUBNETS --set-advertisement-ranges=10.50.0.0/20`" } }
    - { id: d, text: { en: "`gcloud compute networks peerings update hub-to-app --network=hub-vpc --import-custom-routes`" } }
    - { id: e, text: { en: "`gcloud compute routes create to-dc --network=app-vpc --destination-range=192.168.0.0/16 --next-hop-vpn-tunnel=tunnel-0 --next-hop-vpn-tunnel-region=us-central1`" } }
    - { id: f, text: { en: "`gcloud compute networks peerings update app-to-hub --network=app-vpc --export-custom-routes`" } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      The routes that `cr-hub` learns over BGP are custom dynamic routes, and peering exchanges custom routes only when the exporting side (`hub-to-app`) exports them and the importing side (`app-to-hub`) imports them. In the other direction, the default advertisement mode advertises only the subnets of `hub-vpc`, so `cr-hub` needs custom advertisement mode with the peered range `10.50.0.0/20` (plus its own subnets) for the data center to learn a route to `app-vpc`.
  options:
    d: { en: "Importing custom routes into hub-vpc does not help: hub-vpc must export its dynamic routes, and app-vpc has no custom routes to send." }
    e: { en: "The next hop of a static route must be in the route's own VPC network, and tunnel-0 belongs to hub-vpc; HA VPN also relies on dynamic routing." }
    f: { en: "app-vpc has only subnet routes, which peering always exchanges; exporting custom routes from it changes nothing for the data center." }
references:
  - title: "VPC Network Peering | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/vpc-peering
  - title: "Set up and manage VPC Network Peering | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/using-vpc-peering
