id: gcpace-2d-iac-helm-artifact-registry
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company packages its GKE application as the Helm chart `orders-0.3.0.tgz`. It wants to store its charts privately in a Google Cloud managed registry in `us-central1`, alongside its container images, and to install them with Helm 3.8 or later directly from that registry.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Log Helm in to gcr.io, and push the chart with `helm push orders-0.3.0.tgz oci://gcr.io/shop-prod/charts`." } }
    - { id: b, text: { en: "Create a generic-format Artifact Registry repository in us-central1, and upload the chart with `gcloud artifacts generic upload`." } }
    - { id: c, text: { en: "Create a Docker-format repository, and run `helm push orders-0.3.0.tgz oci://us-central1-docker.pkg.dev/shop-prod/charts`." } }
    - { id: d, text: { en: "Create a Cloud Storage bucket in us-central1, and upload the chart with `gcloud storage cp orders-0.3.0.tgz gs://shop-prod-charts/`." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Artifact Registry stores Helm charts as OCI artifacts in Docker-format repositories. After authenticating Helm to `us-central1-docker.pkg.dev`, `helm push` uploads the packaged chart and `helm install` can install it with an `oci://` reference and `--version`.
  options:
    a: { en: "gcr.io belongs to Container Registry, which is shut down; Artifact Registry is the registry to use." }
    b: { en: "Generic repositories store arbitrary files; Helm cannot push to or install from them as an OCI registry." }
    d: { en: "A bucket is not an OCI registry, so Helm cannot install the chart from it with an oci:// reference." }
references:
  - title: "Quickstart: Store Helm charts in Artifact Registry | Google Cloud Documentation"
    url: https://docs.cloud.google.com/artifact-registry/docs/helm/store-helm-charts
