id: gcpace-2d-conn-ha-vpn-second-tunnel
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You are configuring HA VPN for a 99.99% availability SLA. You created the HA VPN gateway `ha-gw` in `us-central1`, the external VPN gateway `onprem-gw` with interfaces `0` and `1` (one per on-premises device), the Cloud Router `cr-1`, and the first tunnel:

    ```bash
    gcloud compute vpn-tunnels create tunnel-0 --region=us-central1 \
      --vpn-gateway=ha-gw --interface=0 \
      --peer-external-gateway=onprem-gw --peer-external-gateway-interface=0 \
      --router=cr-1 --ike-version=2 --shared-secret=SECRET
    ```

    Which command should you run to create the second tunnel?
body:
  options:
    - { id: a, text: { en: "`gcloud compute vpn-tunnels create tunnel-1 --region=us-central1 --vpn-gateway=ha-gw --interface=0 --peer-external-gateway=onprem-gw --peer-external-gateway-interface=1 --router=cr-1 --ike-version=2 --shared-secret=SECRET`" } }
    - { id: b, text: { en: "`gcloud compute vpn-tunnels create tunnel-1 --region=us-central1 --target-vpn-gateway=ha-gw --peer-address=198.51.100.2 --local-traffic-selector=0.0.0.0/0 --ike-version=2 --shared-secret=SECRET`" } }
    - { id: c, text: { en: "`gcloud compute vpn-tunnels create tunnel-1 --region=us-central1 --vpn-gateway=ha-gw --interface=1 --peer-external-gateway=onprem-gw --peer-external-gateway-interface=1 --router=cr-1 --ike-version=2 --shared-secret=SECRET`" } }
    - { id: d, text: { en: "`gcloud compute vpn-tunnels create tunnel-1 --region=us-central1 --vpn-gateway=ha-gw --interface=1 --peer-external-gateway=onprem-gw --peer-external-gateway-interface=1 --ike-version=2 --shared-secret=SECRET`" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For the 99.99% SLA, each HA VPN gateway interface needs a tunnel, and with two peer interfaces, interface 1 connects to peer interface 1. The tunnel is attached to the Cloud Router `cr-1` because HA VPN supports only dynamic routing; you then add a BGP interface and peer for it on the router.
  options:
    a: { en: "Both tunnels would leave from interface 0, so interface 1 has no tunnel and the configuration does not meet the SLA." }
    b: { en: "--target-vpn-gateway, --peer-address, and traffic selectors are Classic VPN options with static routing; they do not apply to an HA VPN gateway." }
    d: { en: "Without --router, the tunnel has no Cloud Router for BGP, and HA VPN does not support static routing." }
references:
  - title: "HA VPN topologies | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-connectivity/docs/vpn/concepts/topologies
  - title: "Cloud VPN overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-connectivity/docs/vpn/concepts/overview
