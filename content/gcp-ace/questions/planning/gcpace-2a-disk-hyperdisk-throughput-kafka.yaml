id: gcpace-2a-disk-hyperdisk-throughput-kafka
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telemetry company runs a self-managed Apache Kafka cluster on Compute Engine VMs. Each broker needs several terabytes of durable block storage that is read and written sequentially at high throughput, while its IOPS needs are low. The company wants the most cost-effective disk type for this profile.

    Which disk type should you choose for the brokers?
body:
  options:
    - id: a
      text: { en: "Hyperdisk Extreme" }
    - id: b
      text: { en: "Hyperdisk Throughput" }
    - id: c
      text: { en: "Hyperdisk ML" }
    - id: d
      text: { en: "Local SSD" }
answer: { optionId: b }
explanation:
  correct:
    en: Hyperdisk Throughput is designed for bandwidth-heavy analytics workloads such as Hadoop, Spark, and Kafka that do not need high IOPS. It is the cost-effective Hyperdisk type for large, sequential, durable storage.
  options:
    a: { en: "Hyperdisk Extreme provides the highest IOPS for databases such as SAP HANA or high-end SQL Server, which this low-IOPS workload would pay for without using." }
    c: { en: "Hyperdisk ML is optimized for read-only access by many VMs to the same data, such as model weights; brokers must write their logs." }
    d: { en: "Local SSD data is lost on events such as a stop or an unrecovered host error, so it is not durable storage for broker logs." }
references:
  - title: "Google Cloud Hyperdisk overview | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/hyperdisks
