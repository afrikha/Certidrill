id: gcpace-2b-gpu-lifecycle-transcode
objective: "2.1.12"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A broadcaster is planning GPU VMs for video transcoding and for the virtual workstations of its editors. The platform must keep the same GPU model until at least 2029, so it must not use a GPU model that Google lists as approaching end of support.

    Which option should you choose?
body:
  options:
    - id: a
      text:
        en: |-
          N1 VMs with attached NVIDIA T4 GPUs
    - id: b
      text:
        en: |-
          N1 VMs with attached NVIDIA P4 GPUs
    - id: c
      text:
        en: |-
          G4 VMs with NVIDIA RTX PRO 6000 GPUs
    - id: d
      text:
        en: |-
          A3 High VMs with NVIDIA H100 GPUs
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Google recommends G4 VMs, with NVIDIA RTX PRO 6000 GPUs, for graphics-intensive applications, virtual workstations and video transcoding. The N1 options rely on the T4 and P4 GPUs, which reach end of support on August 1, 2027.
  options:
    a:
      en: |-
        The T4 reaches end of support on August 1, 2027, before the 2029 horizon.
    b:
      en: |-
        The P4 also reaches end of support on August 1, 2027.
    d:
      en: |-
        A3 High targets model training and serving, not video transcoding and virtual workstations.
references:
  - title: "GPU machine types | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/gpus
