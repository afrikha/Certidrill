id: gcpace-2c-pubsub-pull-subscription
objective: "2.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An invoicing application will publish an event for every new invoice. A billing service that runs on Compute Engine must pull these events at its own pace and acknowledge each one after processing it. The Pub/Sub API is already enabled in the project, and no Pub/Sub resource exists yet.

    Which two commands should you run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud pubsub subscriptions create billing-sub --topic=invoice-events --push-endpoint=https://billing.example.com/events`
    - id: b
      text:
        en: |-
          `gcloud pubsub topics create invoice-events`
    - id: c
      text:
        en: |-
          `gcloud pubsub topics create billing-sub --message-retention-duration=7d`
    - id: d
      text:
        en: |-
          `gcloud pubsub subscriptions create billing-sub --topic=invoice-events`
    - id: e
      text:
        en: |-
          `gcloud pubsub subscriptions create billing-sub --topic=invoice-events --bigquery-table=billing:events.invoices`
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      The publisher needs a topic, created with `gcloud pubsub topics create`. The billing service then needs a subscription attached to that topic; `gcloud pubsub subscriptions create` with only `--topic` creates a pull subscription, from which the service pulls messages and acknowledges them after processing.
  options:
    a:
      en: |-
        `--push-endpoint` turns the subscription into a push subscription: Pub/Sub sends each message to the URL instead of letting the service pull at its own pace.
    c:
      en: |-
        This command creates a second topic named billing-sub; a topic doesn't deliver messages to a subscriber.
    e:
      en: |-
        `--bigquery-table` creates a BigQuery subscription that writes the messages to a table, so the billing service never receives them.
references:
  - title: "gcloud pubsub subscriptions create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/pubsub/subscriptions/create
