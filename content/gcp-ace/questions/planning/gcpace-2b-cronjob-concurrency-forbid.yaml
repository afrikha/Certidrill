id: gcpace-2b-cronjob-concurrency-forbid
objective: "2.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A CronJob in a GKE cluster starts a data export every 15 minutes. During peak periods, an export sometimes takes longer than 15 minutes, and two exports that run at the same time corrupt the output files. A new export must not start until the previous one has finished, and a running export must never be cancelled.

    Which setting should you configure in the CronJob specification?
body:
  options:
    - id: a
      text:
        en: |-
          `concurrencyPolicy: Allow`
    - id: b
      text:
        en: |-
          `concurrencyPolicy: Replace`
    - id: c
      text:
        en: |-
          `concurrencyPolicy: Forbid`
    - id: d
      text:
        en: |-
          `schedule: "*/30 * * * *"`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With `concurrencyPolicy: Forbid`, the CronJob doesn't run Jobs concurrently: a new Job can't start until the previous one has completed or timed out, and the running export isn't cancelled.
  options:
    a:
      en: |-
        Allow, the default, lets Jobs run concurrently, which is what corrupts the output files.
    b:
      en: |-
        Replace also prevents concurrent Jobs, but it does so by cancelling the running Job in favor of the new one, which the requirement forbids.
    d:
      en: |-
        A 30-minute schedule makes overlaps rarer and halves the export frequency, but an export that runs longer than 30 minutes would still overlap the next one.
references:
  - title: "CronJobs | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cronjobs
