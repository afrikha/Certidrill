id: gcpace-2a-disk-hyperdisk-ml-weights
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AI startup runs 40 inference VMs in the same zone. At startup, every VM loads the same 2 TiB of model weights, which change only when a new model version is released. The startup wants the weights to load as fast as possible and wants to keep a single copy of each model version instead of one copy per VM.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create one Balanced Persistent Disk per VM from a snapshot of the weights, and attach each disk to its VM." }
    - id: b
      text: { en: "Add Local SSD disks to every VM, and copy the weights from Cloud Storage to them when each VM boots." }
    - id: c
      text: { en: "Store the weights on a Hyperdisk ML volume, and attach the volume in read-only mode to all the inference VMs." }
    - id: d
      text: { en: "Store the weights on a Hyperdisk Balanced High Availability volume, and attach it to all the VMs in multi-writer mode." }
answer: { optionId: c }
explanation:
  correct:
    en: Hyperdisk ML is built for AI and ML workloads and offers the highest read-only throughput of the Hyperdisk types. One volume can be attached in read-only mode to many VMs, so all inference VMs load the weights from a single copy.
  options:
    a: { en: "This keeps 40 copies of the weights, one per disk, which the startup wants to avoid." }
    b: { en: "Each VM gets its own copy on Local SSD, and copying 2 TiB at every boot slows down startup." }
    d: { en: "Hyperdisk Balanced High Availability is meant for writable data replicated across two zones, not for the highest read throughput to many VMs in one zone." }
references:
  - title: "Google Cloud Hyperdisk overview | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/hyperdisks
