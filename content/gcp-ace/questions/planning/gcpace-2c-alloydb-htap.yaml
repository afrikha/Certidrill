id: gcpace-2c-alloydb-htap
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company is moving a self-managed PostgreSQL database to a managed Google Cloud service. Analysts run heavy reporting queries directly against the live transactional data, and these queries are slow. The company wants a PostgreSQL-compatible database that accelerates analytical queries on the live data, without exporting the data to another system and while keeping the existing PostgreSQL tools.

    Which product should you choose?
body:
  options:
    - id: a
      text:
        en: |-
          Cloud SQL for PostgreSQL with a read replica for the reporting queries
    - id: b
      text:
        en: |-
          BigQuery, loaded every night from a Cloud SQL for PostgreSQL export
    - id: c
      text:
        en: |-
          Memorystore for Redis in front of a Cloud SQL for PostgreSQL instance
    - id: d
      text:
        en: |-
          AlloyDB for PostgreSQL
answer: { optionId: d }
explanation:
  correct:
    en: |-
      AlloyDB for PostgreSQL is a managed PostgreSQL-compatible database that works with standard clients such as `psql`. Its columnar engine keeps data in memory in a columnar format to speed up analytical queries on live transactional data, which suits hybrid transactional and analytical (HTAP) workloads without an export pipeline.
  options:
    a:
      en: |-
        A read replica moves the reporting load off the primary, but it runs the same row-oriented engine, so the analytical queries aren't accelerated.
    b:
      en: |-
        A nightly export to BigQuery is exactly the separate system and pipeline that the company wants to avoid, and the reports would no longer use live data.
    c:
      en: |-
        A Redis cache speeds up repeated key lookups; it doesn't run SQL reporting queries over the transactional data.
references:
  - title: "AlloyDB overview | AlloyDB for PostgreSQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/alloydb/docs/overview
