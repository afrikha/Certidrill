id: gcpace-2c-managed-kafka-migration
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a self-managed Apache Kafka cluster on Compute Engine VMs. Dozens of producer and consumer applications use the open source Kafka client libraries. The operations team wants to stop patching, sizing and scaling Kafka brokers, and the developers will accept changes to connection and authentication settings but not to application code.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create Pub/Sub topics for the Kafka topics, and update the producers and consumers to use the Pub/Sub client libraries.
    - id: b
      text:
        en: |-
          Deploy the Kafka brokers on a GKE Autopilot cluster by using a Helm chart, and point the clients to the new brokers.
    - id: c
      text:
        en: |-
          Create a Managed Service for Apache Kafka cluster, replicate the topics with MirrorMaker 2.0, and point the clients to the new cluster.
    - id: d
      text:
        en: |-
          Create a Dataflow streaming job that reads from the existing brokers, and point the consumers to the Dataflow job.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Managed Service for Apache Kafka runs open source Apache Kafka and automates sizing, scaling, patching and high availability, so existing Kafka clients keep working without code changes. MirrorMaker 2.0 is the documented way to migrate and replicate topics; clients only need the new bootstrap address and TLS with SASL or mTLS authentication settings.
  options:
    a:
      en: |-
        Pub/Sub has its own API and client libraries, so every producer and consumer would have to be rewritten, which the developers refuse.
    b:
      en: |-
        Running Kafka on GKE with a Helm chart still leaves the team to operate, patch and scale the brokers themselves.
    d:
      en: |-
        Dataflow processes data streams; it isn't a message broker that Kafka consumers can connect to, and the existing brokers would still need to be managed.
references:
  - title: "Managed Service for Apache Kafka overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/overview
