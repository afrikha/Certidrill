id: gcpace-2d-nst-existing-vm-change
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer set the default network tier of a project to Standard with `gcloud compute project-info update`. The existing VM `render-1` in `us-east1-b` still uses Premium Tier for its ephemeral external IP address, whose access configuration has the default name. The VM must use Standard Tier, and a new external IP address is acceptable.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Stop render-1, start it again, and check with `gcloud compute instances describe` that its network interface now uses the project's new default tier." } }
    - { id: b, text: { en: "Reserve a global static external address with `gcloud compute addresses create --global --network-tier=STANDARD`, and assign it to render-1." } }
    - { id: c, text: { en: "Run `gcloud compute instances delete-access-config render-1 --zone=us-east1-b`, then `gcloud compute instances add-access-config render-1 --zone=us-east1-b --network-tier=STANDARD`." } }
    - { id: d, text: { en: "Run `gcloud compute project-info update --default-network-tier=STANDARD` again, and wait for the existing resources of the project to be updated." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Changing the project default does not change the tier of existing resources. Removing the access configuration and adding a new one with `--network-tier=STANDARD` gives the interface an external address from the Standard Tier pool; because the address is ephemeral, it changes.
  options:
    a: { en: "A stop and start keeps the existing access configuration and its tier; the project default applies only to new resources." }
    b: { en: "Global external addresses exist only in Premium Tier and are used by global load balancers, not by VM interfaces." }
    d: { en: "The project default never changes existing resources, however many times it is set." }
references:
  - title: "Quickstart: Set the network tier | Network Service Tiers | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-tiers/docs/set-network-tier
  - title: "Network Service Tiers overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
