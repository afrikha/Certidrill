id: gcpace-2d-lb-tcp-ssl-offload
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A market data provider streams quotes to customers worldwide over a proprietary TCP protocol encrypted with TLS on port 443. The protocol is not HTTP. The backends run in two regions. The provider wants one global IP address, TLS terminated at Google's edge to remove the TLS processing from the backends, and connections sent to the closest region with capacity.

    Which load balancer should you deploy?
body:
  options:
    - { id: a, text: { en: "A global external Application Load Balancer with an HTTPS target proxy" } }
    - { id: b, text: { en: "A global external proxy Network Load Balancer with a target SSL proxy" } }
    - { id: c, text: { en: "A regional external passthrough Network Load Balancer in each region" } }
    - { id: d, text: { en: "A cross-region internal proxy Network Load Balancer" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The global external proxy Network Load Balancer handles TCP traffic with optional SSL offload: a target SSL proxy terminates TLS at Google's edge and forwards connections to the closest backends with capacity, behind one global IP address in Premium Tier.
  options:
    a: { en: "An Application Load Balancer processes HTTP and HTTPS requests; the proprietary protocol is not HTTP." }
    c: { en: "Passthrough load balancers are regional and do not terminate TLS, so the backends would keep the TLS work and there would be two addresses." }
    d: { en: "An internal load balancer is not reachable by customers on the internet, and internal proxy Network Load Balancers do not offload SSL." }
references:
  - title: "Choose a load balancer | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer
