id: gcpace-2d-nst-standard-ip-to-premium
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company reserved the Standard Tier regional static external address `partner-ip` (`203.0.113.25`) in `us-east1` for the SFTP VM `sftp-1`. Its partners allow only this address through their firewalls. Management now requires `sftp-1` to use Premium Tier.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Delete the access configuration of sftp-1, then add a new one with --network-tier=PREMIUM and --address=203.0.113.25." } }
    - { id: b, text: { en: "Release partner-ip, then reserve 203.0.113.25 again with gcloud compute addresses create --addresses=203.0.113.25 --network-tier=PREMIUM." } }
    - { id: c, text: { en: "Reserve a new Premium Tier regional static address, assign it to sftp-1, and ask the partners to allow the new address." } }
    - { id: d, text: { en: "Move partner-ip to a project whose default network tier is Premium with gcloud compute addresses move, then assign it again." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Premium Tier and Standard Tier use separate IP address pools, and an address cannot move from one pool to the other: a Standard Tier regional address cannot be updated to Premium Tier. The VM needs a new Premium Tier address, so the partners must update their allowlists.
  options:
    a: { en: "A Standard Tier address cannot be attached to a Premium Tier access configuration; the tier of the address and of the interface must match." }
    b: { en: "Releasing the address returns it to the Standard Tier pool; it cannot be reserved as a Premium Tier address." }
    d: { en: "Moving an address to another project keeps its tier, and the project default never changes the tier of an existing address." }
references:
  - title: "Network Service Tiers overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
