id: gcpace-2c-bigtable-meter-readings
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An energy company collects a reading from each of its 2 million smart meters every 10 seconds. Each reading is a small key-value record identified by the meter ID and a timestamp, and the data set will grow to several petabytes. Applications read recent readings of one meter with single-digit millisecond latency, and no joins or multi-row transactions are needed.

    Which product should you use to store the readings?
body:
  options:
    - id: a
      text:
        en: |-
          Bigtable
    - id: b
      text:
        en: |-
          Cloud SQL for MySQL
    - id: c
      text:
        en: |-
          Memorystore for Redis
    - id: d
      text:
        en: |-
          Filestore
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Bigtable is designed for time-series and IoT data such as meter readings: it sustains high read and write throughput at low latency for key-value rows, scales to petabytes by adding nodes, and a row key built from the meter ID and timestamp lets applications read recent readings of one meter efficiently.
  options:
    b:
      en: |-
        Cloud SQL is a relational database with a single primary that scales vertically; it isn't built for petabytes of data or millions of writes per minute.
    c:
      en: |-
        Memorystore for Redis is an in-memory cache with a limited instance size (up to 300 GB), not a durable store for petabytes of history.
    d:
      en: |-
        Filestore is a managed NFS file server for shared files; it offers no key-based reads of individual records.
references:
  - title: "Bigtable overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigtable/docs/overview
