id: gcpace-2c-bq-load-replace-parquet
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Each night, an ERP system writes a full snapshot of the product catalog as Parquet files to `gs://ridgeway-catalog/latest/`. After each nightly load, the BigQuery table `catalog.products` must contain only the rows of the latest snapshot. You want to use a single `bq` command.

    Which command should you schedule?
body:
  options:
    - id: a
      text:
        en: |-
          `bq load --source_format=PARQUET catalog.products "gs://ridgeway-catalog/latest/*.parquet"`
    - id: b
      text:
        en: |-
          `bq load --noreplace --source_format=PARQUET catalog.products "gs://ridgeway-catalog/latest/*.parquet"`
    - id: c
      text:
        en: |-
          `bq load --replace --source_format=CSV --autodetect catalog.products "gs://ridgeway-catalog/latest/*.parquet"`
    - id: d
      text:
        en: |-
          `bq load --replace --source_format=PARQUET catalog.products "gs://ridgeway-catalog/latest/*.parquet"`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `--replace` makes the load job overwrite the table instead of appending to it, so the table holds only the latest snapshot. Parquet files are self-describing, so BigQuery retrieves the schema from the files and no schema argument is needed.
  options:
    a:
      en: |-
        Without `--replace` or `--noreplace`, `bq load` appends to the existing table, so every night would add another full copy of the catalog.
    b:
      en: |-
        `--noreplace` explicitly appends the data, which duplicates the catalog each night.
    c:
      en: |-
        The files are Parquet; declaring them as CSV makes BigQuery parse binary Parquet data as text, so the load fails.
references:
  - title: "Load Parquet data from Cloud Storage | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/loading-data-cloud-storage-parquet
