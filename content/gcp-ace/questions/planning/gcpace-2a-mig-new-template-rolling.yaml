id: gcpace-2a-mig-new-template-rolling
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs an autoscaled zonal managed instance group named render-mig in us-west1-b, created from the instance template render-v1. All VMs, including the ones that already run, must move to the n2-standard-8 machine type. The change must be rolled out gradually by the group itself, and VMs created later by the autoscaler must also use the new machine type.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Edit the render-v1 instance template to change its machine type, and let the group pick up the change." }
    - id: b
      text: { en: "Run `gcloud compute instances set-machine-type` on each VM of the group after stopping it." }
    - id: c
      text: { en: "Create the template render-v2 with the new machine type, and run `gcloud compute instance-groups managed rolling-action start-update render-mig --version=template=render-v2 --zone=us-west1-b`." }
    - id: d
      text: { en: "Create the template render-v2 with the new machine type, and run `gcloud compute instance-groups managed set-instance-template render-mig --template=render-v2 --zone=us-west1-b`." }
answer: { optionId: c }
explanation:
  correct:
    en: Instance templates cannot be updated after they are created, so you create a new template. A rolling update with `rolling-action start-update --version=template=render-v2` sets the new template on the group and proactively replaces the existing VMs within the max surge and max unavailable limits, and new VMs use the new template.
  options:
    a: { en: "An instance template cannot be changed after it is created; you must create a new one." }
    b: { en: "Changing VMs one by one bypasses the group: the template still says render-v1, so VMs created later by the autoscaler or by repairs use the old machine type." }
    d: { en: "set-instance-template applies the new template only to VMs added to the group later; the VMs that already run are not updated." }
references:
  - title: "Automatically apply VM configuration updates in a MIG | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups
  - title: "Instance templates | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instance-templates
