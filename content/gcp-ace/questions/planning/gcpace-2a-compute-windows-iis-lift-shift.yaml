id: gcpace-2a-compute-windows-iis-lift-shift
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company runs a legacy intranet application on Windows Server with IIS and the .NET Framework. The vendor no longer exists, the application cannot be containerized, and administrators install updates through Remote Desktop. The company wants to move the application to Google Cloud without changing it.

    Which compute option should you choose?
body:
  options:
    - id: a
      text: { en: "A Cloud Run service that runs the application from a Windows container image built by Cloud Build." }
    - id: b
      text: { en: "A GKE Autopilot cluster that runs the application as a Deployment exposed by a LoadBalancer Service." }
    - id: c
      text: { en: "A Cloud Run function that serves the application pages from an HTTP trigger on the .NET runtime." }
    - id: d
      text: { en: "A Compute Engine VM created from a Windows Server public image, with the application installed as it is today." }
answer: { optionId: d }
explanation:
  correct:
    en: Compute Engine gives full control of the operating system, so a Windows Server VM can host the application and IIS exactly as on premises, and administrators can keep using Remote Desktop. This is the lift-and-shift option when the code cannot be changed or containerized.
  options:
    a: { en: "Cloud Run runs container images built for Linux 64-bit, so a Windows container cannot run there, and the application cannot be containerized anyway." }
    b: { en: "Running on GKE requires a container image, which this application cannot provide." }
    c: { en: "A function requires rewriting the application as function code, which breaks the no-change requirement." }
references:
  - title: "Choose compute options | Compute | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/compute-area/choose-compute-options
  - title: "Container runtime contract | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/container-contract
