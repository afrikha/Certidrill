id: gcpace-2c-storage-rsync-mirror
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A reporting server in your data center produces about 5 GB of files every night in `/data/reports`, and old files are regularly removed from that directory. The bucket `gs://kestrel-reports` must be an exact copy of the directory: new and changed files are uploaded, unchanged files aren't sent again, and files removed from the directory are removed from the bucket. The local directory must never be modified.

    Which command should the nightly job run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud storage rsync /data/reports gs://kestrel-reports --recursive --delete-unmatched-destination-objects`
    - id: b
      text:
        en: |-
          `gcloud storage cp -r /data/reports gs://kestrel-reports`
    - id: c
      text:
        en: |-
          `gcloud storage rsync /data/reports gs://kestrel-reports --recursive`
    - id: d
      text:
        en: |-
          `gcloud storage rsync gs://kestrel-reports /data/reports --recursive --delete-unmatched-destination-objects`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `gcloud storage rsync` copies only files that are new or changed at the source, and `--recursive` includes subdirectories. `--delete-unmatched-destination-objects` deletes objects in the destination bucket that no longer exist in the source directory, which keeps the bucket an exact mirror.
  options:
    b:
      en: |-
        `cp -r` uploads every file each night, including unchanged ones, and never deletes objects whose files were removed locally.
    c:
      en: |-
        Without `--delete-unmatched-destination-objects`, rsync doesn't delete objects whose source files were removed, so the bucket accumulates old files.
    d:
      en: |-
        This command makes the bucket the source and the directory the destination, so it would modify and delete local files instead of updating the bucket.
references:
  - title: "gcloud storage rsync | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/rsync
