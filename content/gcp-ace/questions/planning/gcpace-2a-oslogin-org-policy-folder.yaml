id: gcpace-2a-oslogin-org-policy-folder
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company keeps its production projects under a folder named prod. The security team requires OS Login on every VM in those projects, including projects created later, and project owners must not be able to turn it off.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Set enable-oslogin to TRUE in the project metadata of each production project." }
    - id: b
      text: { en: "Grant the Compute OS Login role on the prod folder to the groups that need SSH access." }
    - id: c
      text: { en: "Enforce the compute.requireOsLogin organization policy constraint on the prod folder." }
    - id: d
      text: { en: "Enforce the compute.requireOsConfig organization policy constraint on the prod folder." }
answer: { optionId: c }
explanation:
  correct:
    en: The Require OS Login constraint, compute.requireOsLogin, adds enable-oslogin=true to the metadata of new projects and rejects requests that set enable-oslogin to false in project or instance metadata. Enforced on the folder, it is inherited by all its projects, so owners cannot turn OS Login off.
  options:
    a: { en: "Project owners can change project metadata at any time, and projects created later would not get the setting." }
    b: { en: "IAM roles control who may log in through OS Login; they do not turn OS Login on for the VMs." }
    d: { en: "compute.requireOsConfig concerns VM Manager (enable-osconfig), not OS Login." }
references:
  - title: "Manage OS Login in an organization | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/manage-oslogin-in-an-org
