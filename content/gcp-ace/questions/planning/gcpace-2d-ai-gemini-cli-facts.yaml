id: gcpace-2d-ai-gemini-cli-facts
objective: "2.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An operations team at a logistics company is evaluating Gemini CLI to help its engineers plan and run changes on Google Cloud from the terminal. The team lead asks you to confirm how the tool works before rollout.

    Which two statements about Gemini CLI are true? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It is the chat panel of the Google Cloud console and uses the project and the page you are viewing as context." } }
    - { id: b, text: { en: "It is an open-source AI agent that runs in a local terminal or in Cloud Shell, where it is available without extra setup." } }
    - { id: c, text: { en: "By default, it runs every tool of a configured MCP server without asking the user for confirmation." } }
    - { id: d, text: { en: "It can be extended with local or remote MCP servers declared in the mcpServers section of its settings.json file." } }
    - { id: e, text: { en: "It is a managed service that deploys approved application templates and registers the applications in App Hub." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Gemini CLI is an open-source AI agent that gives access to Gemini in a local terminal or in Cloud Shell, where it needs no extra setup. It uses built-in tools and can connect to local or remote MCP servers, which are declared in the `mcpServers` object of `settings.json`. Its Google Cloud documentation page gives it no Preview label.
  options:
    a: { en: "This describes Gemini Cloud Assist, whose console panel uses the project, the organization, and the page context." }
    c: { en: "The trust setting of an MCP server defaults to false, so Gemini CLI asks for confirmation before it runs that server's tools." }
    e: { en: "This describes Application Design Center, not a terminal agent." }
references:
  - title: "Gemini CLI | Gemini for Google Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini/docs/codeassist/gemini-cli
  - title: MCP servers with Gemini CLI
    url: https://geminicli.com/docs/tools/mcp-server/
