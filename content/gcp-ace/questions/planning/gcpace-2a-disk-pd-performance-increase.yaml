id: gcpace-2a-disk-pd-performance-increase
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An analytics company runs a reporting database on an n2-standard-8 VM. Its data is on a 200 GiB zonal Balanced Persistent Disk, and the VM was created without Local SSD. Monitoring shows that the disk's own IOPS limit is the bottleneck; the VM's per-instance limit is not reached.

    Which two actions can raise the IOPS available to the database? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Increase the size of the disk with `gcloud compute disks resize`." }
    - id: b
      text: { en: "Raise the disk's IOPS with `gcloud compute disks update --provisioned-iops`." }
    - id: c
      text: { en: "Change the VM to the n2-standard-16 machine type to double its vCPUs." }
    - id: d
      text: { en: "Add a Local SSD disk to the existing VM and move the database files to it." }
    - id: e
      text: { en: "Move the data to a new SSD Persistent Disk of the same size." }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: Persistent Disk performance scales with capacity. Balanced and SSD disks have a baseline plus a fixed amount of IOPS per GiB, so a larger disk gets a higher limit. SSD Persistent Disk has a higher baseline and per-GiB rate than Balanced, so the same size gives more IOPS.
  options:
    b: { en: "Provisioned IOPS applies to Hyperdisk types, not to Balanced Persistent Disk, whose performance comes from its size and type." }
    c: { en: "More vCPUs raise the per-VM limit, but the stem says the disk's own limit is the bottleneck, so the database would not get more IOPS." }
    d: { en: "Local SSD disks can be added only when a VM is created, not to an existing VM." }
references:
  - title: "Persistent Disk performance overview | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/performance
  - title: "About Local SSD disks | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/local-ssd
