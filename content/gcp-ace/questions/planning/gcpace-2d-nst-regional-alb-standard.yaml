id: gcpace-2d-nst-regional-alb-standard
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A regional news site serves readers who are all in Brazil. Its web backends are a managed instance group in `southamerica-east1` only. The site needs HTTPS with host-based and path-based routing. The company wants the lowest internet data transfer cost and accepts that traffic crosses the public internet up to the region.

    Which configuration should you use?
body:
  options:
    - { id: a, text: { en: "A regional external Application Load Balancer in southamerica-east1 with a Standard Tier regional IP address" } }
    - { id: b, text: { en: "A global external Application Load Balancer with backends in southamerica-east1 and a Standard Tier global IP address" } }
    - { id: c, text: { en: "A global external Application Load Balancer with backends in southamerica-east1 and a Premium Tier global IP address" } }
    - { id: d, text: { en: "A regional external passthrough Network Load Balancer with a Standard Tier regional IP address" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The regional external Application Load Balancer supports Standard Tier with a regional external IP address, and it provides HTTPS termination and URL map routing by host and path. Standard Tier costs less per GB than Premium Tier, and the single-region, single-country audience does not need Google's global network.
  options:
    b: { en: "The global external Application Load Balancer supports only Premium Tier; global external addresses cannot use Standard Tier." }
    c: { en: "This works, but Premium Tier is billed at a higher rate, which fails the lowest-cost requirement." }
    d: { en: "A passthrough Network Load Balancer does not terminate HTTPS and cannot route requests by host or path." }
references:
  - title: "Network Service Tiers overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
  - title: "Choose a load balancer | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer
