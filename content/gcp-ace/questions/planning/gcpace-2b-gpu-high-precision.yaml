id: gcpace-2b-gpu-high-precision
objective: "2.1.12"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    An engineering firm runs a simulation that is dominated by dense matrix operations and must use high-precision arithmetic to produce valid results. The firm wants the simulation to run on hardware accelerators rather than on CPUs alone.

    Which option should the firm choose?
body:
  options:
    - id: a
      text:
        en: |-
          Cloud TPU VMs in a large slice, to run more matrix operations in parallel
    - id: b
      text:
        en: |-
          Compute-optimized C3 VMs with the largest number of vCPUs
    - id: c
      text:
        en: |-
          Compute Engine VMs with NVIDIA GPUs
    - id: d
      text:
        en: |-
          N4 VMs with a custom machine type and extended memory
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Matrix-dominated workloads usually favor TPUs, but Google states that Cloud TPUs aren't suited to workloads that require high-precision arithmetic. Among the accelerators, that leaves GPUs, which Compute Engine offers for HPC as well as machine learning.
  options:
    a:
      en: |-
        Cloud TPUs aren't suited to workloads that require high-precision arithmetic, whatever the size of the slice.
    b:
      en: |-
        C3 VMs have no accelerator, and the firm wants the simulation to run on hardware accelerators.
    d:
      en: |-
        N4 VMs have no accelerator; extended memory only adds memory beyond the standard ratio.
references:
  - title: "Introduction to Cloud TPU | Google Cloud Documentation"
    url: https://docs.cloud.google.com/tpu/docs/intro-to-tpu
  - title: "GPU machine types | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/gpus
