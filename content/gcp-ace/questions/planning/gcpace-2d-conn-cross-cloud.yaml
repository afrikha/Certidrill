id: gcpace-2d-conn-cross-cloud
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company runs its analytics platform on Google Cloud and its booking database on AWS. It needs a 10 Gbps private connection between a VPC network and its AWS VPC over a dedicated physical link. The company does not want to install its own routers in a colocation facility or to contract with a third-party connectivity provider.

    What should you use?
body:
  options:
    - { id: a, text: { en: "Dedicated Interconnect, with company-owned routers that also connect to AWS in the same facility" } }
    - { id: b, text: { en: "Partner Interconnect, with a VLAN attachment from a provider that also reaches AWS" } }
    - { id: c, text: { en: "Cross-Cloud Interconnect, with a 10 Gbps connection between Google and AWS" } }
    - { id: d, text: { en: "HA VPN, with tunnels between an HA VPN gateway and an AWS virtual private gateway" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Cross-Cloud Interconnect is a dedicated physical connection that Google provisions between its network and the network of another cloud provider, including AWS, at 10 Gbps or 100 Gbps. You buy ports from both providers but you do not deploy your own hardware or work with a third-party vendor.
  options:
    a: { en: "Dedicated Interconnect requires the company's own routing equipment in a colocation facility, which it does not want." }
    b: { en: "Partner Interconnect relies on a third-party service provider, which the company wants to avoid." }
    d: { en: "HA VPN tunnels run over the public internet, not over a dedicated physical link." }
references:
  - title: "Cross-Cloud Interconnect overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/cci-overview
