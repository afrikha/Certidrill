id: gcpace-2a-vmm-inventory-packages
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An auditing firm uses VM Manager on all its VMs. An auditor who has the OS Inventory Viewer role needs a command-line report of the operating system details and the installed packages of every VM in the europe-west2-a zone.

    Which command should the auditor run?
body:
  options:
    - id: a
      text: { en: "`gcloud compute os-config inventories list --location=europe-west2-a --view=basic`" }
    - id: b
      text: { en: "`gcloud compute instances list --zones=europe-west2-a --format=json`" }
    - id: c
      text: { en: "`gcloud compute os-config inventories list --location=europe-west2-a --view=full`" }
    - id: d
      text: { en: "`gcloud compute os-config vulnerability-reports list --location=europe-west2-a`" }
answer: { optionId: c }
explanation:
  correct:
    en: OS inventory management collects OS details and installed packages from each VM. `gcloud compute os-config inventories list` lists the inventory of the VMs in a zone given by `--location`, and `--view=full` includes package information in addition to OS details.
  options:
    a: { en: "The basic view, which is the default, shows only operating system details, not the installed packages." }
    b: { en: "The Compute Engine instance list describes VM resources, such as machine type and status, not the packages installed in the guest OS." }
    d: { en: "Vulnerability reports list the CVEs that affect the VMs, not a full report of OS details and installed packages." }
references:
  - title: "View OS inventory data | VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/view-os-details
