id: gcpace-2c-peering-overlapping-ranges
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your VPC network `analytics-vpc` has the subnet `etl` with the range `10.0.0.0/16`. A partner organization's network `partner-vpc` has the subnet `feeds` with the range `10.0.8.0/21`, and the partner agrees to change its subnets if needed. When both teams try to create a VPC Network Peering connection between the networks, the operation fails.

    What should you do so that the peering can be created?
body:
  options:
    - id: a
      text:
        en: |-
          Create the peering on both sides with `--import-custom-routes` and `--export-custom-routes`.
    - id: b
      text:
        en: |-
          Create ingress firewall rules in both networks that allow traffic from the other network's ranges, and then create the peering.
    - id: c
      text:
        en: |-
          Move the partner's workloads to a new subnet in `partner-vpc` with a range outside `10.0.0.0/16`, delete `feeds`, and then create the peering.
    - id: d
      text:
        en: |-
          Replace the peering with Shared VPC, using `analytics-vpc` as the host network and `partner-vpc` as a service network.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Peered networks can't have subnet ranges that match, contain or fall within each other's ranges, and peering creation fails when such an overlap exists. `10.0.8.0/21` falls within `10.0.0.0/16`, so the partner must use a non-overlapping range before the peering can be created.
  options:
    a:
      en: |-
        These flags control the exchange of static and dynamic routes; subnet routes are always exchanged, so the overlap still blocks the peering.
    b:
      en: |-
        Firewall rules filter traffic after connectivity exists; they don't resolve overlapping subnet ranges, which is why creation fails.
    d:
      en: |-
        Shared VPC shares subnets with service projects, not with another network, and host and service projects can't belong to different organizations.
references:
  - title: "VPC Network Peering | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/vpc-peering
  - title: "Shared VPC | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/shared-vpc
