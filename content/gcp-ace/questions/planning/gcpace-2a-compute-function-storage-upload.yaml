id: gcpace-2a-compute-function-storage-upload
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A real estate website stores listing photos in a Cloud Storage bucket. A developer has written a single Python function that creates a thumbnail each time a new photo is uploaded. The team wants to deploy the function from its source code, run it only when an upload happens, and avoid building container images or managing servers.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Deploy the code as a Cloud Run function with a trigger on the Cloud Storage object finalized event for the bucket." }
    - id: b
      text: { en: "Deploy the code on a Compute Engine VM with a cron job that lists the bucket every minute to find new photos." }
    - id: c
      text: { en: "Deploy the code to a GKE Autopilot cluster as a CronJob that scans the bucket for new photos every minute." }
    - id: d
      text: { en: "Deploy the code to Agent Runtime on Gemini Enterprise Agent Platform and call it from the upload page." }
answer: { optionId: a }
explanation:
  correct:
    en: Cloud Run functions deploy single-purpose code from source; the build into a container is done for you. An Eventarc trigger on the Cloud Storage object finalized event runs the function only when an object is created in the bucket.
  options:
    b: { en: "A VM that polls the bucket runs and costs money all the time, and the team must manage the server, which the requirements exclude." }
    c: { en: "A CronJob polls on a schedule instead of reacting to each upload, and the code must first be packaged as a container image." }
    d: { en: "Agent Runtime is a managed runtime for AI agents; calling it from the upload page adds an agent platform for a task that a storage event trigger handles directly." }
references:
  - title: "Compare Cloud Run functions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/functions/comparison
  - title: "What is Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
