id: gcpace-2d-lb-global-https-cdn
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A news publisher serves its website from managed instance groups in `us-central1`, `europe-west1`, and `asia-east1`. Readers are spread across the world. The publisher wants one anycast IP address for HTTPS traffic, static content cached at Google's edge with Cloud CDN, and requests sent to the closest healthy backend.

    Which load balancer should you deploy?
body:
  options:
    - { id: a, text: { en: "A regional external Application Load Balancer in each of the three regions, behind weighted DNS records" } }
    - { id: b, text: { en: "A global external Application Load Balancer with the three instance groups as backends" } }
    - { id: c, text: { en: "A regional external passthrough Network Load Balancer with the three instance groups as backends" } }
    - { id: d, text: { en: "A global external proxy Network Load Balancer with the three instance groups as backends" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The global external Application Load Balancer runs on Google Front Ends with a global anycast IP address in Premium Tier, reaches backends in several regions, and sends each request to the closest backend with capacity. It supports Cloud CDN and Cloud Armor for HTTPS sites.
  options:
    a: { en: "Three regional load balancers mean three IP addresses and DNS-based steering instead of one anycast address." }
    c: { en: "A passthrough Network Load Balancer is regional, does not terminate HTTPS, and does not provide Cloud CDN." }
    d: { en: "A proxy Network Load Balancer handles TCP traffic without HTTP-level features; Cloud CDN works with the global external Application Load Balancer." }
references:
  - title: "Choose a load balancer | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer
  - title: "External Application Load Balancer overview | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/https
