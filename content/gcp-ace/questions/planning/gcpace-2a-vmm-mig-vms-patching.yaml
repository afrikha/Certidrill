id: gcpace-2a-vmm-mig-vms-patching
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A ride-sharing company ran a VM Manager patch job with `--instance-filter-all`. The report shows that the VMs of an autoscaled, autohealing managed instance group were not patched. Security requires every VM of the group to run the patched OS, including VMs that the group recreates or adds later, and the operations team wants to follow the approach that keeps the group consistent.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run the patch job again with the `--mig-instances-allowed` flag so that the group's VMs are patched in place." }
    - id: b
      text: { en: "Create a weekly patch deployment whose patch configuration allows MIG instances, targeting the group's VMs." }
    - id: c
      text: { en: "Run the patch job again with `--reboot-config=always` so that the group's VMs restart after patching." }
    - id: d
      text: { en: "Create a patched image, create a new instance template that uses it, and apply it with a rolling update of the group." }
answer: { optionId: d }
explanation:
  correct:
    en: By default VM Manager does not patch MIG VMs, because the group recreates VMs from its instance template during repairs and scale-out, which reverts them to an unpatched state. Building the patches into the image and rolling out a new template makes every current and future VM of the group run the patched OS.
  options:
    a: { en: "In-place patching works only until the group repairs a VM or scales out, because new VMs come from the old, unpatched template." }
    b: { en: "Weekly patching leaves VMs created between runs unpatched, and patched VMs can still be replaced by unpatched ones from the template." }
    c: { en: "The reboot setting does not change which VMs are targeted; MIG VMs are still skipped by default." }
references:
  - title: "About Patch | VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/os-patch-management
  - title: "Automatically apply VM configuration updates in a MIG | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups
