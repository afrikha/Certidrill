id: gcpace-2a-mig-create-commands
objective: "2.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A travel website wants its web tier to run on identical Debian VMs in the us-central1-a zone. The group must start with two VMs and add or remove VMs automatically based on CPU utilization, up to ten VMs. Nothing exists yet in the project for this tier.

    Which three commands should you run? Choose three.
body:
  choose: 3
  options:
    - id: a
      text: { en: "`gcloud compute instance-templates create web-tmpl --machine-type=e2-medium --image-family=debian-12 --image-project=debian-cloud`" }
    - id: b
      text: { en: "`gcloud compute instance-groups unmanaged create web-group --zone=us-central1-a`" }
    - id: c
      text: { en: "`gcloud compute instance-groups managed create web-mig --template=web-tmpl --size=2 --zone=us-central1-a`" }
    - id: d
      text: { en: "`gcloud compute instances create web-1 web-2 --source-instance-template=web-tmpl --zone=us-central1-a`" }
    - id: e
      text: { en: "`gcloud compute instance-groups managed set-autoscaling web-mig --zone=us-central1-a --max-num-replicas=10 --target-cpu-utilization=0.6`" }
    - id: f
      text: { en: "`gcloud compute instance-groups managed resize web-mig --zone=us-central1-a --size=10`" }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: A managed instance group must be created from an instance template, so you first create the template, then the MIG with `--template` and `--size`, and finally attach an autoscaler with `set-autoscaling`, which requires `--max-num-replicas` and here scales on CPU utilization.
  options:
    b: { en: "Unmanaged instance groups cannot be autoscaled and do not create VMs from a template." }
    d: { en: "This creates two standalone VMs from the template; they are not part of a MIG, so nothing scales them." }
    f: { en: "resize sets a fixed group size of ten VMs; it does not add or remove VMs based on CPU utilization." }
references:
  - title: "Create a MIG in a single zone | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instance-groups/create-zonal-mig
  - title: "Scaling based on CPU utilization | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/autoscaler/scaling-cpu
