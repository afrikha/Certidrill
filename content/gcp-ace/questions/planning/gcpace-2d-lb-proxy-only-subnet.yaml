id: gcpace-2d-lb-proxy-only-subnet
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are deploying a regional internal Application Load Balancer in `us-east1` in the VPC network `core-vpc`. Before you create the forwarding rule, you must create the subnet from which the load balancer's proxies get their addresses. The range `10.129.0.0/23` is free.

    Which command should you run?
body:
  options:
    - { id: a, text: { en: "`gcloud compute networks subnets create proxy-use1 --network=core-vpc --region=us-east1 --range=10.129.0.0/23 --purpose=GLOBAL_MANAGED_PROXY --role=ACTIVE`" } }
    - { id: b, text: { en: "`gcloud compute networks subnets create proxy-use1 --network=core-vpc --region=us-east1 --range=10.129.0.0/23 --purpose=PRIVATE_SERVICE_CONNECT`" } }
    - { id: c, text: { en: "`gcloud compute networks subnets create proxy-use1 --network=core-vpc --region=us-east1 --range=10.129.0.0/23 --purpose=REGIONAL_MANAGED_PROXY --role=ACTIVE`" } }
    - { id: d, text: { en: "`gcloud compute networks subnets create proxy-use1 --network=core-vpc --region=us-east1 --range=10.129.0.0/23 --purpose=PRIVATE_NAT`" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Regional Envoy-based load balancers, including the regional internal Application Load Balancer, use a proxy-only subnet with the purpose `REGIONAL_MANAGED_PROXY` and the role `ACTIVE`. Only one active proxy-only subnet of that purpose can exist per region and network, and Google recommends starting with a `/23`.
  options:
    a: { en: "GLOBAL_MANAGED_PROXY is the purpose for cross-region internal Application and proxy Network Load Balancers, not for a regional one." }
    b: { en: "A PRIVATE_SERVICE_CONNECT subnet is used to publish services with Private Service Connect, not for load balancer proxies." }
    d: { en: "A PRIVATE_NAT subnet provides source ranges for Private NAT, not proxy addresses for a load balancer." }
references:
  - title: "Proxy-only subnets for Envoy-based load balancers | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/proxy-only-subnets
