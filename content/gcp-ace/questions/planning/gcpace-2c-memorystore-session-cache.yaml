id: gcpace-2c-memorystore-session-cache
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer runs its web front end on Compute Engine in one region and wants to move user session data out of the VMs into a managed cache that every VM can reach. Reads and writes must have sub-millisecond latency, the data set is about 20 GB, and the cache must keep serving with automatic failover if one zone of the region fails.

    What should you deploy?
body:
  options:
    - id: a
      text:
        en: |-
          A Memorystore for Redis instance in the Basic Tier
    - id: b
      text:
        en: |-
          A Memorystore for Redis instance in the Standard Tier
    - id: c
      text:
        en: |-
          A Cloud SQL for MySQL instance with high availability enabled
    - id: d
      text:
        en: |-
          A Firestore database in a regional location
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Memorystore for Redis is a managed in-memory store that gives sub-millisecond access and is commonly used for session data. The Standard Tier replicates the instance across zones and fails over automatically, with a 99.9% availability SLA, and a 20 GB data set fits in one instance.
  options:
    a:
      en: |-
        The Basic Tier is a standalone cache with no replication and no automatic failover, so a zone failure makes it unavailable.
    c:
      en: |-
        Cloud SQL is a disk-based relational database; it fails over automatically but doesn't give sub-millisecond reads and writes.
    d:
      en: |-
        Firestore offers single-digit millisecond latency, not the sub-millisecond access of an in-memory cache.
references:
  - title: "Memorystore for Redis overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/memorystore/docs/redis/memorystore-for-redis-overview
