id: gcpace-2c-fw-priority-deny-partner
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The VPC network of a web application has two ingress firewall rules that apply to all instances:

    | Name | Action | Source | Protocol and port | Priority |
    | --- | --- | --- | --- | --- |
    | allow-web | Allow | 0.0.0.0/0 | tcp:80 | 1000 |
    | block-scraper | Deny | 203.0.113.0/24 | tcp:80 | 900 |

    Clients at 203.0.113.25 and 198.51.100.7 send HTTP requests on TCP port 80 to a VM that has an external IP address.

    What happens?
body:
  options:
    - id: a
      text:
        en: |-
          Both requests are allowed, because an allow rule takes precedence over a deny rule.
    - id: b
      text:
        en: |-
          The request from 203.0.113.25 is denied, and the request from 198.51.100.7 is allowed.
    - id: c
      text:
        en: |-
          Both requests are denied, because a deny rule applies to every source when it matches the port.
    - id: d
      text:
        en: |-
          The request from 203.0.113.25 is allowed, because the rule with the higher priority number is evaluated last and wins.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Firewall rule priorities range from 0 to 65535, and a lower number means a higher precedence. Traffic from 203.0.113.25 matches `block-scraper` (priority 900) before `allow-web` (priority 1000), so it is denied; traffic from 198.51.100.7 matches only `allow-web` and is allowed.
  options:
    a:
      en: |-
        Precedence is decided by priority, not by action; an action only matters when two matching rules have the same priority, and then deny wins.
    c:
      en: |-
        A rule applies only to traffic that matches its source; 198.51.100.7 is outside `203.0.113.0/24`.
    d:
      en: |-
        The rule with the lowest priority number takes precedence, so `block-scraper` applies to traffic from its source range.
references:
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
