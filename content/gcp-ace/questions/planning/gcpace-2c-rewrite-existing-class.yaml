id: gcpace-2c-rewrite-existing-class
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The bucket `gs://adatum-audit-logs` holds 40 TB of objects in the Standard class that are now rarely read. Last week you ran `gcloud storage buckets update gs://adatum-audit-logs --default-storage-class=COLDLINE`, but the billing report still shows the existing objects as Standard storage. The objects must stay in the same bucket with the same names, and you want them in Coldline now by using a single command.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud storage objects update "gs://adatum-audit-logs/**" --storage-class=COLDLINE`.
    - id: b
      text:
        en: |-
          Run `gcloud storage buckets update gs://adatum-audit-logs --enable-autoclass`.
    - id: c
      text:
        en: |-
          Wait 30 days, after which Cloud Storage moves existing objects to the new default storage class of the bucket.
    - id: d
      text:
        en: |-
          Run `gcloud storage cp "gs://adatum-audit-logs/**" gs://adatum-audit-logs-cold` to a new bucket whose default class is Coldline.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Changing a bucket's default storage class affects only objects written afterward. `gcloud storage objects update` with `--storage-class` rewrites the matching objects in place in the new class, and the `**` wildcard covers every object in the bucket. Standard has no minimum storage duration, so the rewrite adds no early deletion charge.
  options:
    b:
      en: |-
        Enabling Autoclass moves objects to Standard first and only moves an object to Nearline after 30 days without access, so nothing reaches Coldline now.
    c:
      en: |-
        Cloud Storage never changes existing objects when the default class changes; they stay in their current class until they're rewritten.
    d:
      en: |-
        Copying to a new bucket changes the bucket name that applications use and leaves the original Standard objects in place.
references:
  - title: "gcloud storage objects update | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/objects/update
  - title: "Storage classes | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/storage-classes
