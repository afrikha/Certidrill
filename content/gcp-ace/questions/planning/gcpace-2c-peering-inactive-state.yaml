id: gcpace-2c-peering-inactive-state
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In the project `web-prj`, you ran `gcloud compute networks peerings create to-billing --network=web-vpc --peer-project=billing-prj --peer-network=billing-vpc`. The subnet ranges of the two networks don't overlap. `gcloud compute networks peerings list` shows the peering as inactive, and VMs in the two networks can't reach each other.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Have an administrator of `billing-prj` create a peering from `billing-vpc` to `web-vpc`.
    - id: b
      text:
        en: |-
          Delete the peering, and create it again with the `--export-custom-routes` flag.
    - id: c
      text:
        en: |-
          Create an ingress firewall rule in `web-vpc` that allows traffic from the subnet ranges of `billing-vpc`.
    - id: d
      text:
        en: |-
          Run `gcloud compute networks update web-vpc --bgp-routing-mode=global`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Each side of a VPC Network Peering is configured independently, and the peering becomes active only when the configuration from both sides matches. The administrator of `billing-prj` must create the matching peering that points back to `web-vpc`.
  options:
    b:
      en: |-
        Exporting custom routes adds static and dynamic routes to the exchange, but the peering stays inactive until the other side is configured.
    c:
      en: |-
        Firewall rules will be needed for traffic, but they don't activate a peering that is configured on only one side.
    d:
      en: |-
        The dynamic routing mode affects Cloud Router route propagation, not the state of a peering.
references:
  - title: "VPC Network Peering | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/vpc-peering
