id: gcpace-2b-spot-delete-on-preempt
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A data team runs short-lived image-conversion workers on Compute Engine, and a scheduler creates a new worker for each batch. Each worker must be a Spot VM. When Compute Engine preempts a worker, the VM and its boot disk must be removed so that nothing keeps generating charges.

    Which command should the scheduler use to create a worker?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute instances create worker-1 --zone=us-central1-a --provisioning-model=SPOT`
    - id: b
      text:
        en: |-
          `gcloud compute instances create worker-1 --zone=us-central1-a --provisioning-model=SPOT --instance-termination-action=DELETE`
    - id: c
      text:
        en: |-
          `gcloud compute instances create worker-1 --zone=us-central1-a --provisioning-model=STANDARD --instance-termination-action=DELETE`
    - id: d
      text:
        en: |-
          `gcloud compute instances create worker-1 --zone=us-central1-a --provisioning-model=SPOT --maintenance-policy=TERMINATE`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For a Spot VM, the termination action decides what Compute Engine does at preemption: DELETE deletes the VM, and the boot disk created with it is deleted too because boot disks are set to auto-delete by default. Without this flag, the termination action of a Spot VM is STOP.
  options:
    a:
      en: |-
        Without `--instance-termination-action`, a Spot VM is stopped at preemption: the VM stays in the project and its persistent disks keep generating storage charges.
    c:
      en: |-
        The STANDARD provisioning model creates on-demand VMs that are neither preempted nor discounted; the termination action would only apply to a runtime limit, and none is set.
    d:
      en: |-
        The maintenance policy controls what happens during host maintenance events, not at preemption; the preempted VM would still be stopped, not deleted.
references:
  - title: "Create and use Spot VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/create-use-spot
  - title: "Spot VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/spot
