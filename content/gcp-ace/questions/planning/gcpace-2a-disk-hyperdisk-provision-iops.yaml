id: gcpace-2a-disk-hyperdisk-provision-iops
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company stores its order database on a 500 GiB Hyperdisk Balanced volume named orders-data, attached to a running VM in the us-west1-a zone. Before a sales event, the database needs more IOPS, but its capacity is sufficient. The company does not want downtime or to pay for capacity it does not need.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run `gcloud compute disks resize orders-data --zone=us-west1-a --size=2TB` so that the volume gets more IOPS." }
    - id: b
      text: { en: "Create a snapshot of orders-data, create an SSD Persistent Disk from it, and attach the new disk in place of the volume." }
    - id: c
      text: { en: "Stop the VM, change it to a machine type with twice as many vCPUs, and start it again." }
    - id: d
      text: { en: "Run `gcloud compute disks update orders-data --zone=us-west1-a --provisioned-iops=20000` while the volume stays attached." }
answer: { optionId: d }
explanation:
  correct:
    en: With Hyperdisk Balanced, you provision IOPS and throughput separately from capacity, and you can change them on a volume that is attached to a running VM with `gcloud compute disks update --provisioned-iops`. Performance changes are allowed once every four hours.
  options:
    a: { en: "Hyperdisk performance is provisioned, not derived from size, so a larger volume only adds capacity the company does not need." }
    b: { en: "Swapping disks requires stopping the database to detach and attach volumes, which causes downtime, and it changes the disk type for no reason." }
    c: { en: "Stopping the VM causes downtime, and more vCPUs do not change the IOPS provisioned on the volume." }
references:
  - title: "Modify the size and provisioned performance of a Hyperdisk volume | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/modify-hyperdisks
  - title: "Google Cloud Hyperdisk overview | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/hyperdisks
