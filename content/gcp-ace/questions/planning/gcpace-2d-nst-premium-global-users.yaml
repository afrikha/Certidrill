id: gcpace-2d-nst-premium-global-users
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A SaaS company serves an API from Compute Engine VMs with external IP addresses in `us-central1`. Its customers are in Europe, Asia, and North America. The company wants inbound traffic to enter Google's network at the point of presence closest to each customer and to travel on Google's network to the region.

    What should you configure?
body:
  options:
    - { id: a, text: { en: "Standard Tier for the external IP addresses of the VMs" } }
    - { id: b, text: { en: "Premium Tier for the external IP addresses of the VMs" } }
    - { id: c, text: { en: "Standard Tier for the external IP addresses, with Cloud CDN enabled" } }
    - { id: d, text: { en: "A Cloud NAT gateway with static external IP addresses for the subnet" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With Premium Tier, the default tier, inbound traffic enters Google's network at the point of presence closest to the sender, and outbound traffic leaves it at the point of presence closest to the destination. Traffic between customers and the region therefore crosses Google's network for most of the path.
  options:
    a: { en: "With Standard Tier, traffic crosses the public internet and enters Google's network only at a peering point near the VMs' region." }
    c: { en: "Cloud CDN always uses Premium Tier and works with a load balancer, not with Standard Tier VM addresses." }
    d: { en: "Cloud NAT provides outbound connections for VMs without external addresses; it does not carry inbound API traffic." }
references:
  - title: "Network Service Tiers overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
