id: gcpace-2a-compute-engine-requirements
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company is reviewing five workloads to decide which ones should run on Compute Engine VMs instead of Cloud Run. The company prefers serverless platforms unless a requirement cannot be met there.

    Which two workloads should run on Compute Engine? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A stateless image-resizing API that must scale to zero instances outside business hours." }
    - id: b
      text: { en: "A video transcoder that depends on a custom kernel module and specific kernel settings on the host." }
    - id: c
      text: { en: "A web front end, built as a container image by Cloud Build, that serves HTTPS requests from browsers." }
    - id: d
      text: { en: "A nightly containerized report generator that runs for 40 minutes and then exits." }
    - id: e
      text: { en: "A media asset database whose license is priced per physical core and requires dedicated, unshared hardware." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Compute Engine gives you control of the OS and kernel settings, which a custom kernel module needs; Cloud Run manages the OS and kernel for you. Per-core licenses that require dedicated hardware are a bring-your-own-license case for sole-tenant nodes, which host only your project's VMs.
  options:
    a: { en: "Scaling a stateless API to zero is a Cloud Run strength, so the serverless preference applies." }
    c: { en: "Cloud Run serves a container image behind an HTTPS endpoint, so no VM is needed." }
    d: { en: "A containerized program that runs to completion fits a Cloud Run job, whose task timeout can be far longer than 40 minutes." }
references:
  - title: "Choose compute options | Compute | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/compute-area/choose-compute-options
  - title: "Sole-tenancy overview | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/nodes/sole-tenant-nodes
