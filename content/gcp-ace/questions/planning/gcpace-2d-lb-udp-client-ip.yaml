id: gcpace-2d-lb-udp-client-ip
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A game studio runs dedicated game servers in a managed instance group in `europe-west1`. Players connect from the internet over UDP port 7777. The anti-cheat system on the servers must see the real source IP address of each player.

    Which load balancer should you use?
body:
  options:
    - { id: a, text: { en: "A regional external proxy Network Load Balancer" } }
    - { id: b, text: { en: "A global external Application Load Balancer" } }
    - { id: c, text: { en: "An internal passthrough Network Load Balancer" } }
    - { id: d, text: { en: "An external passthrough Network Load Balancer" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An external passthrough Network Load Balancer is a regional load balancer for TCP, UDP, and other IP protocols from the internet. It does not proxy connections, so the backends receive packets with the players' original source IP addresses.
  options:
    a: { en: "Proxy Network Load Balancers handle TCP only and, as proxies, do not preserve the client IP address by default." }
    b: { en: "An Application Load Balancer handles HTTP and HTTPS, not raw UDP, and it proxies the connections." }
    c: { en: "An internal passthrough Network Load Balancer accepts traffic only from clients with internal addresses, not from players on the internet." }
references:
  - title: "Choose a load balancer | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer
