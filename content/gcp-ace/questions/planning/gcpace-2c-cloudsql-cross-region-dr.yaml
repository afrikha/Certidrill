id: gcpace-2c-cloudsql-cross-region-dr
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The Cloud SQL for MySQL instance `crm-db` runs with high availability in `us-central1` and uses Enterprise edition. You must prepare for the loss of the whole `us-central1` region: data written in the last few minutes may be lost, but the CRM application must be able to run from `us-east1` using the native replication of Cloud SQL.

    Which two actions should you include in the plan? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Now, run `gcloud sql instances create crm-db-dr --master-instance-name=crm-db --region=us-east1`.
    - id: b
      text:
        en: |-
          Now, run `gcloud sql instances patch crm-db --availability-type=regional`.
    - id: c
      text:
        en: |-
          During the outage, run `gcloud sql instances failover crm-db`.
    - id: d
      text:
        en: |-
          During the outage, run `gcloud sql instances promote-replica crm-db-dr`, and point the application to `crm-db-dr`.
    - id: e
      text:
        en: |-
          Now, store the automated daily backups of `crm-db` in the `us` multi-region by setting `--backup-location=us`.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      `--master-instance-name` with another `--region` creates a cross-region read replica that receives changes asynchronously. During a regional outage, promoting the replica turns it into a stand-alone read-write instance; promotion is a manual step, and transactions not yet replicated are lost, which the plan accepts.
  options:
    b:
      en: |-
        The instance already has high availability, and HA only protects against the loss of a zone within `us-central1`.
    c:
      en: |-
        A failover switches an HA instance to its standby in another zone of the same region, which is also unavailable when the whole region is lost.
    e:
      en: |-
        Restoring from a daily backup could lose up to a day of data and takes longer than promoting a replica; it doesn't meet the few-minutes loss target.
references:
  - title: "Promote replicas for regional migration or disaster recovery | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/replication/cross-region-replicas
  - title: "gcloud sql instances create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/sql/instances/create
