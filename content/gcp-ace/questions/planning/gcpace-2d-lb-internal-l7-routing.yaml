id: gcpace-2d-lb-internal-l7-routing
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank runs two internal HTTP services on Compute Engine in `us-east1`: an accounts service and a cards service. Only VMs in the same VPC network and region call them. Requests to `/accounts/*` must go to the accounts backends and requests to `/cards/*` to the cards backends, through one IP address. The services must not be reachable from the internet.

    Which load balancer should you deploy?
body:
  options:
    - { id: a, text: { en: "A regional internal Application Load Balancer with a URL map that has two path rules" } }
    - { id: b, text: { en: "An internal passthrough Network Load Balancer with one backend service per service" } }
    - { id: c, text: { en: "A regional external Application Load Balancer with a URL map that has two path rules" } }
    - { id: d, text: { en: "A regional internal proxy Network Load Balancer with one backend service per service" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The regional internal Application Load Balancer is an Envoy-based layer 7 proxy with an internal IP address. Its URL map routes requests by path to different backend services, so one internal address can serve both services without internet exposure.
  options:
    b: { en: "A passthrough Network Load Balancer works at layer 4 and cannot route requests by URL path." }
    c: { en: "An external Application Load Balancer has an internet-facing IP address, which the bank must avoid." }
    d: { en: "A proxy Network Load Balancer balances TCP connections and does not inspect HTTP paths." }
references:
  - title: "Choose a load balancer | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer
