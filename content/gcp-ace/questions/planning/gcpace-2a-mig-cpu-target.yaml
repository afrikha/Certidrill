id: gcpace-2a-mig-cpu-target
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company has a zonal managed instance group named calc-mig in europe-west1-c that has no autoscaler yet. The group must keep average CPU utilization around 65%, never run fewer than 3 VMs, and never run more than 12 VMs. The VMs are not behind a load balancer.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`gcloud compute instance-groups managed set-autoscaling calc-mig --zone=europe-west1-c --min-num-replicas=3 --max-num-replicas=12 --target-cpu-utilization=0.65`" }
    - id: b
      text: { en: "`gcloud compute instance-groups managed set-autoscaling calc-mig --zone=europe-west1-c --min-num-replicas=3 --max-num-replicas=12 --target-cpu-utilization=65`" }
    - id: c
      text: { en: "`gcloud compute instance-groups managed set-autoscaling calc-mig --zone=europe-west1-c --min-num-replicas=3 --max-num-replicas=12 --target-load-balancing-utilization=0.65`" }
    - id: d
      text: { en: "`gcloud compute instance-groups managed resize calc-mig --zone=europe-west1-c --size=12`" }
answer: { optionId: a }
explanation:
  correct:
    en: "`set-autoscaling` creates the autoscaler, with `--min-num-replicas` and `--max-num-replicas` as bounds. `--target-cpu-utilization` takes a fraction between 0.0 and 1.0, so 0.65 keeps average CPU utilization near 65%."
  options:
    b: { en: "The CPU target is a fraction from 0.0 to 1.0, so 65 is not a valid value for 65%." }
    c: { en: "Load balancing utilization scales on the serving capacity of a load balancer backend, and these VMs are not behind a load balancer." }
    d: { en: "resize fixes the group at 12 VMs all the time; it does not follow CPU utilization and wastes money at low load." }
references:
  - title: "Scaling based on CPU utilization | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/autoscaler/scaling-cpu
