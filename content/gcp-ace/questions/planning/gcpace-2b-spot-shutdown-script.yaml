id: gcpace-2b-spot-shutdown-script
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A genomics lab runs analysis jobs on Spot VMs that use the default preemption notice and the termination action DELETE. Each job keeps its intermediate results on the boot disk of its VM. When a VM is preempted, the lab wants the results produced so far to be copied to a Cloud Storage bucket before the VM is deleted, without running any additional infrastructure.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add a `startup-script` metadata entry that copies the results to the bucket each time the VM boots.
    - id: b
      text:
        en: |-
          Set `--maintenance-policy=MIGRATE` on the VMs so that Compute Engine moves them to another host instead of preempting them.
    - id: c
      text:
        en: |-
          Change the termination action to STOP, and run a nightly Cloud Scheduler job that copies the results from the stopped VMs.
    - id: d
      text:
        en: |-
          Add a `shutdown-script` metadata entry that copies the latest results to the bucket when the VM shuts down.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When Compute Engine preempts a Spot VM, the guest receives a shutdown signal, and a script stored in the `shutdown-script` metadata key runs during the best-effort shutdown period of up to 30 seconds. A short script that uploads the latest results meets the need without extra infrastructure, as long as the upload fits in that window.
  options:
    a:
      en: |-
        A startup script runs when a VM boots, not when it is preempted; a deleted VM never boots again, so the results produced after the boot would be lost.
    b:
      en: |-
        The host maintenance policy applies to maintenance events; it doesn't stop Compute Engine from preempting a Spot VM to reclaim capacity.
    c:
      en: |-
        Keeping stopped VMs and running a scheduled copy job adds infrastructure and storage charges, which the lab wants to avoid.
references:
  - title: "Create and use Spot VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/create-use-spot
  - title: "Spot VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/spot
