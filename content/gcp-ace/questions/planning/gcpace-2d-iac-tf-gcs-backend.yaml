id: gcpace-2d-iac-tf-gcs-backend
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team of five engineers runs Terraform for its Google Cloud projects from their laptops, and each laptop keeps its own state file. Applies regularly conflict. The team needs one shared state, a lock that prevents two applies from running at the same time, and the ability to recover a previous version of the state. You must follow Google-recommended practices.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Commit the terraform.tfstate file to the team's Git repository after each apply, and pull it before each plan." } }
    - { id: b, text: { en: "Configure a gcs backend in a Cloud Storage bucket that has Object Versioning enabled, and migrate the state to it." } }
    - { id: c, text: { en: "Copy the state file to a Cloud Storage bucket with gcloud storage cp after each apply, and download it before each plan." } }
    - { id: d, text: { en: "Store the state file as a new Secret Manager secret version after each apply, and read the latest version before each plan." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Google recommends the Cloud Storage backend for Terraform state: the `gcs` backend stores one shared state file and locks it so that a team can collaborate. Object Versioning keeps previous versions of the state, and `terraform init -migrate-state` moves the existing local state into the bucket.
  options:
    a: { en: "Git provides no state locking, and state files can contain secrets in plaintext, which must not be stored in a repository." }
    c: { en: "Manual copies do not lock the state, so two engineers can still apply at the same time from different copies." }
    d: { en: "Secret Manager is not a Terraform backend; manual uploads provide no locking and are easy to forget." }
references:
  - title: "Store Terraform state in a Cloud Storage bucket | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/terraform/resource-management/store-state
  - title: "Best practices for security | Terraform on Google Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/terraform/best-practices/security
