id: gcpace-2b-ingress-path-routing
objective: "2.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An online bookstore runs two Services in GKE: storefront and api. Customers must reach both over HTTP(S) through a single external IP address. Requests whose path starts with /api must go to api, and all other requests must go to storefront.

    What should you deploy?
body:
  options:
    - id: a
      text:
        en: |-
          An Ingress of the gce class whose rules send /api/* to api and /* to storefront
    - id: b
      text:
        en: |-
          A Service of type LoadBalancer for each of the two applications
    - id: c
      text:
        en: |-
          A Service of type NodePort for each application, with a firewall rule for the node ports
    - id: d
      text:
        en: |-
          A Service of type LoadBalancer with the annotation `networking.gke.io/load-balancer-type: "Internal"`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A GKE Ingress of the gce class makes GKE create an external Application Load Balancer with a forwarding rule and IP address, and a URL map whose path rules send each path to its own backend Service. It provides path-based routing of HTTP(S) traffic to several Services behind one IP address.
  options:
    b:
      en: |-
        Each LoadBalancer Service gets its own regional external passthrough Network Load Balancer and IP address, and these load balancers don't route by URL path.
    c:
      en: |-
        NodePort exposes each Service on a port of every node's IP address, with no single IP address and no path-based routing.
    d:
      en: |-
        This annotation creates an internal load balancer that is reachable only from the VPC network, not by customers on the internet.
references:
  - title: "GKE Ingress for Application Load Balancers | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/ingress
  - title: "Exposing applications using services | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/exposing-apps
