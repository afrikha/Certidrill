id: gcpace-2d-tags-vs-network-tags
objective: "2.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A retail company is choosing between network tags and secure tags to identify the VMs that its firewall rules apply to. The security team wants to move from VPC firewall rules to global network firewall policies and to control who can change the identity of a VM.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Binding a secure tag value to a VM is controlled by IAM, through the Tag User role on the tag value and on the resource." } }
    - { id: b, text: { en: "Network tags can be used as targets in hierarchical firewall policies and in global network firewall policies." } }
    - { id: c, text: { en: "Secure tags can be used as sources and targets in VPC firewall rules as well as in network firewall policies." } }
    - { id: d, text: { en: "A VM can have several values of the same secure tag key, up to 10 values per network interface." } }
    - { id: e, text: { en: "Secure tags can be used in global and regional network firewall policies, while network tags cannot be used there." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Secure tags are Resource Manager tag keys and values governed by IAM: binding a value requires the Tag User role on the value and on the resource. They are supported by hierarchical, global network, and regional network firewall policies, whereas network tags are plain strings without access control that only VPC firewall rules use.
  options:
    b: { en: "Network tags cannot be used by rules in hierarchical, global network, or regional network firewall policies." }
    c: { en: "VPC firewall rules do not support secure tags; they use network tags or service accounts." }
    d: { en: "A VM can have only one value per tag key; the limit of 10 counts tag values from different keys on a network interface." }
references:
  - title: "Secure tags for firewalls | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/tags-firewalls-overview
