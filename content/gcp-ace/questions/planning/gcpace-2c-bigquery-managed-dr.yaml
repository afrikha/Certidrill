id: gcpace-2c-bigquery-managed-dr
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's regulatory reporting datasets are stored in BigQuery in the `us-east4` region, and load jobs and DML statements update them every hour. The bank requires that, during a total outage of the region, both storage and compute fail over to a second region so that the jobs can keep writing to the datasets. Some data loss during such a failover is acceptable.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Recreate the datasets in the `US` multi-region, which stores the data in several US regions, and keep the jobs unchanged.
    - id: b
      text:
        en: |-
          Add a replica of each dataset in a second region with `ALTER SCHEMA ... ADD REPLICA`, and promote the replicas when `us-east4` fails.
    - id: c
      text:
        en: |-
          Create a scheduled query that copies every table to datasets in a second region once a day, and redirect the jobs to the copies when `us-east4` fails.
    - id: d
      text:
        en: |-
          Use managed disaster recovery with an Enterprise Plus failover reservation and attached dataset replicas, and run a hard failover if `us-east4` fails.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      BigQuery managed disaster recovery, available with the Enterprise Plus edition, fails over both compute (a failover reservation with standby capacity in the secondary location) and storage (cross-region dataset replicas attached to the reservation). A hard failover promotes the secondary immediately during a total regional outage, possibly losing data that wasn't replicated yet.
  options:
    a:
      en: |-
        A multi-region location doesn't add regional redundancy: the data sits in a single region within that area, so a regional outage still stops the jobs.
    b:
      en: |-
        Cross-region replication alone isn't a disaster recovery plan: a secondary replica can't be promoted while the region of the primary replica has an outage.
    c:
      en: |-
        Daily copies could lose up to a day of data, give no compute failover, and need the jobs to be changed to target different datasets.
references:
  - title: "Managed disaster recovery | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/managed-disaster-recovery
  - title: "Cross-region dataset replication | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/data-replication
