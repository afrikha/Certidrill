id: gcpace-2a-vmm-patch-deployment-recurring
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm has set up VM Manager in its project. Its policy requires that all Windows and Linux VMs be patched every month on the second Tuesday at 03:00 local time. The operations team wants VM Manager to run the patching automatically, with the least ongoing effort.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Add a cron entry on each Linux VM and a scheduled task on each Windows VM that installs all available updates." }
    - id: b
      text: { en: "Run `gcloud compute os-config patch-jobs execute --instance-filter-all --duration=30d` once each month." }
    - id: c
      text: { en: "Ask an operator to start an on-demand patch job from the console on the second Tuesday of each month." }
    - id: d
      text: { en: "Create a patch deployment with a monthly recurring schedule by using `gcloud compute os-config patch-deployments create`." }
answer: { optionId: d }
explanation:
  correct:
    en: A patch deployment runs patch jobs automatically on a one-time or recurring schedule, with the instance filter and patch settings applied at each run. You create it with `gcloud compute os-config patch-deployments create` and a YAML or JSON file that defines the schedule.
  options:
    a: { en: "Per-VM scripts are outside VM Manager, must be maintained on every VM, and give no central compliance reporting." }
    b: { en: "--duration only sets how long one job may run; someone must still start the job every month." }
    c: { en: "A manual monthly start is ongoing effort and can be forgotten, which a patch deployment avoids." }
references:
  - title: "Schedule patch jobs | VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/os-patch-management/schedule-patch-jobs
