id: gcpace-2b-custom-extended-memory
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An in-memory analytics engine needs 4 vCPUs and 48 GB of memory on a single VM. The company has standardized on the N2 machine series and doesn't want to pay for vCPUs that the engine doesn't use.

    Which machine configuration should you use?
body:
  options:
    - id: a
      text:
        en: |-
          An N2 custom machine type with 4 vCPUs and 48 GB of memory, created with the `--custom-extensions` flag
    - id: b
      text:
        en: |-
          An N2 custom machine type with 4 vCPUs and 48 GB of memory, created without the `--custom-extensions` flag
    - id: c
      text:
        en: |-
          The predefined n2-highmem-4 machine type, which has 4 vCPUs and the highest memory ratio of the N2 predefined types
    - id: d
      text:
        en: |-
          An E2 custom machine type with 4 vCPUs and 48 GB of memory, created with the `--custom-extensions` flag
answer: { optionId: a }
explanation:
  correct:
    en: |-
      48 GB for 4 vCPUs is 12 GB per vCPU, above the 8 GB per vCPU that an N2 custom machine type normally allows. Extended memory, enabled with `--custom-extensions` (or the -ext suffix of the machine type), lets N2 custom machine types exceed that ratio, up to 864 GB, so the engine gets its memory without extra vCPUs.
  options:
    b:
      en: |-
        Without extended memory, an N2 custom machine type is limited to 8 GB per vCPU, that is 32 GB for 4 vCPUs.
    c:
      en: |-
        n2-highmem-4 provides 32 GB of memory, less than the 48 GB that the engine needs.
    d:
      en: |-
        Extended memory isn't available for the E2 series, whose custom machine types are limited to 8 GB per vCPU.
references:
  - title: "Create a VM with a custom machine type | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/creating-instance-with-custom-machine-type
