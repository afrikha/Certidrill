id: gcpace-2d-iac-cc-drift-revert
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company manages its Cloud Storage buckets with Config Connector `StorageBucket` objects stored in Git. An engineer enabled Object Versioning on one bucket in the Google Cloud console. Some time later, versioning is disabled again, and nobody changed it manually. The company wants versioning to stay enabled and the Git manifests to remain the source of truth.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Enable versioning again with `gcloud storage buckets update --versioning` instead of the console." } }
    - { id: b, text: { en: "Set `cnrm.cloud.google.com/reconcile-interval-in-seconds: \"0\"` on the object, and enable versioning in the console again." } }
    - { id: c, text: { en: "Grant the engineer the Storage Admin role on the bucket, and enable versioning in the console again." } }
    - { id: d, text: { en: "Enable versioning in the StorageBucket manifest in Git, and apply the manifest to the cluster with kubectl apply." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Config Connector periodically reconciles each resource with the desired state in its Kubernetes object and corrects drift, so a change made outside the manifest is reverted. Changing the manifest and applying it makes the desired state include versioning, and Config Connector then keeps it enabled.
  options:
    a: { en: "A change made with gcloud is also outside the manifest, so Config Connector reverts it in the same way." }
    b: { en: "Disabling drift correction keeps the console change, but the Git manifest no longer describes the bucket, so it stops being the source of truth." }
    c: { en: "Permissions are not the problem: the change succeeded and was then reverted by Config Connector's reconciliation." }
references:
  - title: "Reconciliation strategy | Config Connector | Google Cloud Documentation"
    url: https://docs.cloud.google.com/config-connector/docs/concepts/reconciliation
  - title: "Config Connector overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/config-connector/docs/overview
