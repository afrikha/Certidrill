id: gcpace-2d-lb-https-frontend-commands
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are building a global external Application Load Balancer for `www.example.com`. You already created the global backend service `web-bs` with the `EXTERNAL_MANAGED` load-balancing scheme and its instance group backends, the URL map `web-map`, and the global static IP address `web-ip`. The site must use HTTPS with a Google-managed certificate.

    Which three commands should you run to complete the frontend? Choose three.
body:
  choose: 3
  options:
    - { id: a, text: { en: "`gcloud compute ssl-certificates create www-cert --domains=www.example.com --global`" } }
    - { id: b, text: { en: "`gcloud compute networks subnets create proxy-only --network=web-vpc --region=us-central1 --range=10.129.0.0/23 --purpose=REGIONAL_MANAGED_PROXY --role=ACTIVE`" } }
    - { id: c, text: { en: "`gcloud compute target-https-proxies create web-proxy --url-map=web-map --ssl-certificates=www-cert --global`" } }
    - { id: d, text: { en: "`gcloud compute forwarding-rules create web-fr --load-balancing-scheme=INTERNAL_MANAGED --global --target-https-proxy=web-proxy --ports=443`" } }
    - { id: e, text: { en: "`gcloud compute forwarding-rules create web-fr --load-balancing-scheme=EXTERNAL_MANAGED --network-tier=PREMIUM --address=web-ip --global --target-https-proxy=web-proxy --ports=443`" } }
    - { id: f, text: { en: "`gcloud compute target-pools create web-pool --region=us-central1`" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      The frontend of a global external Application Load Balancer is a target HTTPS proxy that references the URL map and an SSL certificate, plus a global forwarding rule with the `EXTERNAL_MANAGED` scheme that sends port 443 on the reserved address to that proxy. `--domains` creates a Google-managed certificate, which Google provisions and renews once DNS points to the load balancer.
  options:
    b: { en: "Proxy-only subnets are needed by regional Envoy-based load balancers; the global external Application Load Balancer does not use one." }
    d: { en: "INTERNAL_MANAGED is the scheme of internal Application Load Balancers, which have internal addresses and are not reachable from the internet." }
    f: { en: "Target pools are used by legacy passthrough Network Load Balancers, not by Application Load Balancers." }
references:
  - title: "External Application Load Balancer overview | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/https
  - title: "Proxy-only subnets for Envoy-based load balancers | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/proxy-only-subnets
