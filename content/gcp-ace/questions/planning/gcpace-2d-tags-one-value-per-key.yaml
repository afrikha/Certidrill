id: gcpace-2d-tags-one-value-per-key
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The secure tag key `123456789012/workload` has the GCE_FIREWALL purpose for the VPC network `data-vpc`, with the values `etl` and `reporting`. Rules in the global network firewall policy target each value. The VM `batch-07` is bound to `workload/etl` and has two tag values applied in total. The VM must now also match the rules that target `workload/reporting`, and it must keep matching the rules for `workload/etl`. An engineer who has the Tag User role on the key and on the project, and who created the existing binding, tries to bind `workload/reporting` to `batch-07`, and the request is refused.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the engineer the Tag Administrator role on the organization, and bind workload/reporting to batch-07 again." } }
    - { id: b, text: { en: "Create a second GCE_FIREWALL tag key for data-vpc with one value, bind it to batch-07, and add it to the targets of the reporting rules." } }
    - { id: c, text: { en: "Remove the workload/etl binding from batch-07, and bind workload/reporting to batch-07 in its place." } }
    - { id: d, text: { en: "Bind the value again by its namespaced name 123456789012/workload/reporting instead of its numeric tagValues ID." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A VM can have only one bound value per tag key, so `batch-07` cannot hold both `workload/etl` and `workload/reporting`. A value from another GCE_FIREWALL key can be bound alongside the first one (up to 10 tag values per network interface), and adding that value to the target secure tags of the reporting rules makes the VM match both sets of rules.
  options:
    a: { en: "The refusal is not a permission problem: the engineer already binds tags, and no role lets a VM hold two values of the same key." }
    c: { en: "Replacing the binding makes the VM match the reporting rules but stop matching the etl rules, which it must keep." }
    d: { en: "Both formats identify the same tag value; the request still breaks the rule of one value per key on a VM." }
references:
  - title: "Secure tags for firewalls | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/tags-firewalls-overview
