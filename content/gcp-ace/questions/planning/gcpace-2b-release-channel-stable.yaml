id: gcpace-2b-release-channel-stable
objective: "2.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A bank is creating GKE clusters for its core payment services. The clusters must keep receiving automatic upgrades, but the platform team prioritizes stability over new features and wants new GKE versions to reach these clusters only after they have been rolled out in the other standard channels.

    Which flag should you use when you create the clusters?
body:
  options:
    - id: a
      text:
        en: |-
          `--release-channel=rapid`
    - id: b
      text:
        en: |-
          `--release-channel=regular`
    - id: c
      text:
        en: |-
          `--release-channel=stable`
    - id: d
      text:
        en: |-
          `--release-channel=extended`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Stable channel prioritizes stability over new features: GKE rolls out changes and new versions to it last, a few months after Regular, while enrolled clusters keep getting automatic upgrades.
  options:
    a:
      en: |-
        Rapid receives new Kubernetes releases first, as early as possible after their upstream release, which is the opposite of the requirement.
    b:
      en: |-
        Regular, the default channel, balances feature availability and stability; versions reach it before they reach Stable.
    d:
      en: |-
        Extended keeps a cluster on a minor version as long as possible for long-term support, and its version availability is aligned with Regular rather than coming last.
references:
  - title: "About release channels | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/release-channels
