id: gcpace-2b-new-laptop-kubectl-setup
objective: "2.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A consultant receives a new laptop with the Google Cloud CLI installed from the archive and signs in with `gcloud auth login`. The consultant has the Kubernetes Engine Developer role on the project and must run kubectl commands against the existing regional cluster orders-prod in us-east1, whose external endpoint accepts connections from the laptop's network. No Kubernetes tooling is installed on the laptop yet.

    Which three actions should the consultant perform? Choose three.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Run `gcloud components install kubectl`.
    - id: b
      text:
        en: |-
          Run `gcloud services enable container.googleapis.com` in the project.
    - id: c
      text:
        en: |-
          Run `gcloud components install gke-gcloud-auth-plugin`.
    - id: d
      text:
        en: |-
          Create a service account key and set the GOOGLE_APPLICATION_CREDENTIALS environment variable to its path.
    - id: e
      text:
        en: |-
          Run `gcloud container clusters get-credentials orders-prod --location=us-east1`.
    - id: f
      text:
        en: |-
          Run `kubectl config set-credentials consultant --token=TOKEN` with a bearer token copied from a colleague.
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      kubectl must be installed, and kubectl needs gke-gcloud-auth-plugin to authenticate to GKE with the consultant's gcloud identity; both install with the component manager of an archive installation. `get-credentials` then writes the cluster's endpoint and authentication settings into the kubeconfig file and makes the cluster the current context.
  options:
    b:
      en: |-
        The cluster already runs, so the Kubernetes Engine API is enabled in the project; enabling it again configures nothing on the laptop.
    d:
      en: |-
        A service account key is a long-lived secret that isn't needed: the plugin uses the consultant's own gcloud credentials.
    f:
      en: |-
        Reusing a colleague's token would act with the colleague's permissions instead of the consultant's IAM roles, and GKE access relies on the plugin.
references:
  - title: "Install kubectl and configure cluster access | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl
  - title: "Managing gcloud CLI components | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/docs/components
