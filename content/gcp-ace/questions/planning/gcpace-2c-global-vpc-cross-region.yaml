id: gcpace-2c-global-vpc-cross-region
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The custom mode VPC network `corp-vpc` has the subnet `app-us` in `us-east1` and the subnet `db-eu` in `europe-west1`. Application VMs in `app-us` must connect to a PostgreSQL VM in `db-eu` on its internal IP address. A firewall rule already allows TCP port 5432 from the range of `app-us` to the database VM.

    What else must you configure?
body:
  options:
    - id: a
      text:
        en: |-
          Nothing else: subnet routes already connect the subnets of both regions.
    - id: b
      text:
        en: |-
          A VPC Network Peering connection between the `app-us` subnet and the `db-eu` subnet.
    - id: c
      text:
        en: |-
          An HA VPN gateway in each region with tunnels between `us-east1` and `europe-west1`.
    - id: d
      text:
        en: |-
          A Cloud NAT gateway in `europe-west1` for the database subnet.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A VPC network is a global resource and its subnets are regional. Resources in any subnet of the same network can communicate using internal IP addresses, subject to firewall rules, so the existing allow rule is enough.
  options:
    b:
      en: |-
        VPC Network Peering connects two different VPC networks, not two subnets of the same network.
    c:
      en: |-
        Cloud VPN connects separate networks, such as an on-premises network; subnets of one VPC network already reach each other.
    d:
      en: |-
        Cloud NAT gives VMs without external IP addresses outbound access to the internet; it isn't used between subnets of the same network.
references:
  - title: "VPC networks | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/vpc
