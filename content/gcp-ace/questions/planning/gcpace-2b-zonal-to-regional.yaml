id: gcpace-2b-zonal-to-regional
objective: "2.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A zonal GKE Standard cluster named shop in europe-west1-b runs production workloads. After a zone incident made its control plane unavailable, management now requires a control plane that stays available during a zone failure. Workload downtime must be avoided during the change.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud container clusters update shop --location=europe-west1-b --node-locations=europe-west1-b,europe-west1-c,europe-west1-d`.
    - id: b
      text:
        en: |-
          Create a second node pool whose nodes run in europe-west1-c, so that the cluster has nodes in two zones.
    - id: c
      text:
        en: |-
          Configure a maintenance window and maintenance exclusions so that control plane upgrades happen only on weekends.
    - id: d
      text:
        en: |-
          Create a regional cluster in europe-west1, deploy the workloads to it, and move traffic before you delete shop.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A zonal cluster has a single control plane in one zone, and the availability type is fixed at creation: a zonal cluster can't become a regional cluster. Creating a regional cluster, migrating the workloads and switching traffic before removing the old cluster gives a replicated control plane without downtime.
  options:
    a:
      en: |-
        Adding node locations makes the cluster multi-zonal: the nodes spread across zones, but the control plane stays a single replica in europe-west1-b.
    b:
      en: |-
        Nodes in another zone keep some workloads running during a zone failure, but the control plane still runs only in europe-west1-b.
    c:
      en: |-
        Maintenance windows and exclusions control when upgrades happen; they don't protect a single control plane from a zone failure.
references:
  - title: "About cluster configuration choices | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/configuration-overview
  - title: "Creating a regional cluster | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/creating-a-regional-cluster
