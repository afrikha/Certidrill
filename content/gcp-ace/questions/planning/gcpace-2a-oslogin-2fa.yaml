id: gcpace-2a-oslogin-2fa
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A defense contractor has set enable-oslogin to TRUE in the metadata of its project. A new security rule requires that every SSH connection to the project's VMs be confirmed with a second factor from the user's Google account, which already has 2-Step Verification turned on.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Set enable-oslogin-2fa to TRUE in the instance metadata of each VM, and set enable-oslogin to FALSE in the project metadata." }
    - id: b
      text: { en: "Run `gcloud compute project-info add-metadata --metadata=enable-oslogin-2fa=TRUE` and keep enable-oslogin set to TRUE." }
    - id: c
      text: { en: "Grant the users the IAP-secured Tunnel User role, and allow SSH to the VMs only from the IAP address range." }
    - id: d
      text: { en: "Ask the users to add their keys with `gcloud compute os-login ssh-keys add --ttl=1d` so that the keys expire daily." }
answer: { optionId: b }
explanation:
  correct:
    en: OS Login 2-step verification is enforced when both enable-oslogin and enable-oslogin-2fa are TRUE in project or instance metadata. Setting enable-oslogin-2fa in project metadata applies it to every VM, and users must have 2-Step Verification on their accounts.
  options:
    a: { en: "With enable-oslogin set to FALSE, OS Login is off on VMs that do not set it themselves, so its 2-step verification is not enforced." }
    c: { en: "IAP TCP forwarding controls the network path and who may open a tunnel, but it does not add a second factor to the SSH login." }
    d: { en: "Short-lived keys reduce the risk of leaked keys but do not ask the user for a second factor at login." }
references:
  - title: "Set up OS Login | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin
