id: gcpace-2c-bigtable-multicluster-routing
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Bigtable instance `telemetry` was created with a single cluster, `telemetry-c1`, in `us-east1-b`, and the application connects with the instance's `default` app profile. If `us-east1` becomes unavailable, the application must keep reading and writing through a cluster in `us-west1` without any manual action. Eventually consistent reads are acceptable.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create the cluster `telemetry-c2` in `us-west1-a`, and keep using the `default` app profile.
    - id: b
      text:
        en: |-
          Create the cluster `telemetry-c2` in `us-west1-a`, create an app profile with `--route-to=telemetry-c1`, and configure the application to use it.
    - id: c
      text:
        en: |-
          Create the cluster `telemetry-c2` in `us-east1-c`, create an app profile with `--route-any`, and configure the application to use it.
    - id: d
      text:
        en: |-
          Create the cluster `telemetry-c2` in `us-west1-a`, create an app profile with `--route-any`, and configure the application to use it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Adding a cluster in another region makes Bigtable replicate the tables to it. An app profile created with `--route-any` uses multi-cluster routing, so Bigtable fails over automatically to the nearest available cluster when the other one can't serve requests.
  options:
    a:
      en: |-
        A `default` app profile created when the instance had one cluster uses single-cluster routing, and it doesn't change when clusters are added, so failover would stay manual.
    b:
      en: |-
        `--route-to` sets single-cluster routing to `telemetry-c1`; with single-cluster routing you must decide when to fail over yourself.
    c:
      en: |-
        A second cluster in another zone of `us-east1` protects against a zone failure only, not against the loss of the region.
references:
  - title: "Failovers | Bigtable | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigtable/docs/failovers
  - title: "Replication overview | Bigtable | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigtable/docs/replication-overview
