id: gcpace-2a-compute-agent-runtime-adk
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel agency has built a customer-support agent in Python with the Agent Development Kit (ADK). The agent must keep the state of each conversation between user turns and scale with demand. The platform team does not want to build, patch, or scale the hosting infrastructure, or write its own session store.

    Where should you deploy the agent?
body:
  options:
    - id: a
      text: { en: "To a Cloud Run service built from the agent code, with a Firestore database that the team writes to store each conversation." }
    - id: b
      text: { en: "To Agent Runtime on Gemini Enterprise Agent Platform, using its managed deployment, scaling, and Sessions." }
    - id: c
      text: { en: "To an instance in Agent Platform Workbench, running the agent from a notebook kept open for production traffic." }
    - id: d
      text: { en: "To a regional managed instance group of Compute Engine VMs that run the agent behind a load balancer." }
answer: { optionId: b }
explanation:
  correct:
    en: Agent Runtime (formerly Vertex AI Agent Engine) is a fully managed runtime for deploying, operating, and scaling agents, with full ADK integration. Its Sessions feature maintains the history of interactions between a user and the agent, so the team does not have to manage infrastructure or build a session store.
  options:
    a: { en: "Cloud Run can host the agent, but the team would have to design and write the conversation store itself, which the requirements exclude." }
    c: { en: "Workbench is a notebook environment for development, not a managed serving runtime that scales a production agent." }
    d: { en: "A MIG leaves the team to build, patch, and scale the VMs, and still provides no session storage for the agent." }
references:
  - title: "Agent Runtime | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime
  - title: "Agent Platform Sessions overview | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions
