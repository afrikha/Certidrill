id: gcpace-2c-spanner-multiregion-config
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company serves customers across the United States and is creating a new Spanner instance for its ledger. The instance must keep accepting reads and writes if an entire region fails, and it must target 99.999% availability.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud spanner instances create ledger-prod --config=nam3 --edition=ENTERPRISE_PLUS --description="Ledger" --nodes=3`
    - id: b
      text:
        en: |-
          `gcloud spanner instances create ledger-prod --config=regional-us-east4 --edition=ENTERPRISE --description="Ledger" --nodes=3`
    - id: c
      text:
        en: |-
          `gcloud spanner instances create ledger-prod --config=nam3 --edition=STANDARD --description="Ledger" --nodes=3`
    - id: d
      text:
        en: |-
          `gcloud spanner instances create ledger-prod --config=regional-us-east4 --edition=ENTERPRISE --description="Ledger" --nodes=6`, followed by a move to a custom configuration that adds read-only replicas in `us-west1`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `nam3` is a multi-region configuration with read-write regions in Northern Virginia and South Carolina and a witness region in Iowa, so the instance keeps a write quorum if one region fails. Multi-region configurations offer 99.999% availability and require the Enterprise Plus edition.
  options:
    b:
      en: |-
        A regional configuration places its three read-write replicas in zones of a single region: it survives a zone failure but not a regional one, and its availability is 99.99%.
    c:
      en: |-
        Multi-region configurations are available only in the Enterprise Plus edition, not in the Standard edition.
    d:
      en: |-
        Read-only replicas don't vote in write quorums, so if `us-east4` fails the instance can't accept writes; adding nodes doesn't change the configuration's availability.
references:
  - title: "Regional, dual-region, and multi-region configurations | Spanner | Google Cloud Documentation"
    url: https://docs.cloud.google.com/spanner/docs/instance-configurations
