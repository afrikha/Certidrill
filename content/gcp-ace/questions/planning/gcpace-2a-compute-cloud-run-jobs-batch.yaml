id: gcpace-2a-compute-cloud-run-jobs-batch
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company has a containerized batch program that recalculates premiums every night. It reads input files, runs for about three hours, writes results to Cloud Storage, and exits; it does not listen for HTTP requests. The company wants to minimize cost and operational effort.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Deploy the container as a Cloud Run service and have Cloud Scheduler send it one HTTP request each night." }
    - id: b
      text: { en: "Deploy the program as a Cloud Run function with an HTTP trigger and have Cloud Scheduler call it each night." }
    - id: c
      text: { en: "Run the container on a Compute Engine VM that stays on all the time and starts the program from cron." }
    - id: d
      text: { en: "Create a Cloud Run job from the container image with a task timeout of four hours, and run it on a schedule." }
answer: { optionId: d }
explanation:
  correct:
    en: A Cloud Run job runs its tasks to completion and exits, without serving requests, and you pay only while it runs. The task timeout defaults to 10 minutes and can be raised up to 168 hours, so a four-hour timeout covers the three-hour run, and the job can be executed on a schedule.
  options:
    a: { en: "A Cloud Run service must listen for requests, and its request timeout is at most 60 minutes, so a three-hour run inside one request would be cut off." }
    b: { en: "HTTP functions are limited to a 60-minute request timeout, which is shorter than the three-hour run." }
    c: { en: "A VM that runs all day is paid for around the clock and must be patched and managed, which fails the cost and effort requirements." }
references:
  - title: "Set task timeout for jobs | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/task-timeout
  - title: "Configure request timeout for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/request-timeout
