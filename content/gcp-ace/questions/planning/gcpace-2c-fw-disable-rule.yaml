id: gcpace-2c-fw-disable-rule
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During troubleshooting, you suspect that the VPC firewall rule `deny-legacy-ftp` blocks traffic that an application needs. You want to stop enforcing the rule for one hour, and then enforce it again with exactly the same configuration.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute firewall-rules update deny-legacy-ftp --priority=65535`, and set the original priority again later.
    - id: b
      text:
        en: |-
          Run `gcloud compute firewall-rules update deny-legacy-ftp --disabled`, and later run the same command with `--no-disabled`.
    - id: c
      text:
        en: |-
          Run `gcloud compute firewall-rules update deny-legacy-ftp --no-enable-logging`, and enable logging again later.
    - id: d
      text:
        en: |-
          Run `gcloud compute firewall-rules delete deny-legacy-ftp`, and recreate the rule from memory later.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A disabled firewall rule is kept with its configuration but isn't enforced: the network behaves as if the rule didn't exist. `--no-disabled` enables it again with the same settings.
  options:
    a:
      en: |-
        A rule with priority 65535 is still enforced for any traffic that no higher-priority rule matches, so the deny can still apply.
    c:
      en: |-
        Firewall Rules Logging only records connections that the rule matches; turning it off doesn't stop the rule from denying traffic.
    d:
      en: |-
        Deleting the rule loses its configuration, and recreating it by hand risks changing it, which the requirement forbids.
references:
  - title: "Use VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/using-firewalls
