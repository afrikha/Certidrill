id: gcpace-2a-disk-hdb-ha-n4
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An online bank runs its ledger service on n4-standard-8 VMs in the europe-west4 region, and the machine type must not change. A new requirement says that ledger data must be replicated synchronously to a second zone so that a zonal outage causes no data loss. The team will fail over by attaching the volume to a VM in the second zone.

    Which storage should you use for the ledger data?
body:
  options:
    - id: a
      text: { en: "A regional Balanced Persistent Disk with replicas in two zones of europe-west4." }
    - id: b
      text: { en: "A Hyperdisk Balanced High Availability volume with replicas in two zones of europe-west4." }
    - id: c
      text: { en: "A zonal Hyperdisk Balanced volume protected by Asynchronous Replication to another region." }
    - id: d
      text: { en: "Local SSD disks on two VMs in different zones, mirrored by the ledger application." }
answer: { optionId: b }
explanation:
  correct:
    en: Hyperdisk Balanced High Availability replicates data synchronously across two zones of a region, for workloads that need a recovery point objective of zero. The N4 series supports only Hyperdisk types, including Hyperdisk Balanced High Availability.
  options:
    a: { en: "Regional Persistent Disk attaches only to E2, N1, N2, and N2D VMs, and N4 does not support Persistent Disk at all." }
    c: { en: "Asynchronous replication can lose the most recent writes, so it does not meet the no-data-loss requirement for a zonal outage." }
    d: { en: "N4 VMs do not support Local SSD, and application-level mirroring is not the synchronous storage replication that the requirement asks for." }
references:
  - title: "About Hyperdisk Balanced High Availability | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/hd-types/hyperdisk-balanced-ha
  - title: "General-purpose machine family for Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/general-purpose-machines
