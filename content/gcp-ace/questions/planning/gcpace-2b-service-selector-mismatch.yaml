id: gcpace-2b-service-selector-mismatch
objective: "2.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    You deployed version 2 of a web application with a new Deployment whose Pod template has the label app=web-v2, and you deleted the old Deployment. The existing Service web, of type LoadBalancer, still has the selector app=web. The Service keeps its external IP address and the new Pods are Running and Ready, but requests to the IP address now fail, and `kubectl describe service web` shows no endpoints.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Delete and recreate the Service web so that it gets a new external IP address.
    - id: b
      text:
        en: |-
          Change the Service selector to app=web-v2, or add the label app=web to the new Pod template.
    - id: c
      text:
        en: |-
          Change the type of the Service web to NodePort so that requests reach the nodes directly.
    - id: d
      text:
        en: |-
          Add a readiness probe to the new Pods so that the load balancer health checks pass.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Service sends traffic to the Pods whose labels match its selector. No running Pod has the label app=web any more, so the Service has no endpoints; making the selector and the Pod labels match again restores the endpoints without changing the external IP address.
  options:
    a:
      en: |-
        A recreated Service would keep the same selector, so it would still have no endpoints, and clients would also have to use a new IP address.
    c:
      en: |-
        Changing the Service type doesn't change which Pods the selector matches, so the Service would still have no endpoints.
    d:
      en: |-
        The Pods are already Ready; they receive no traffic because the selector doesn't match them, not because they fail health checks.
references:
  - title: "Exposing applications using services | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/exposing-apps
