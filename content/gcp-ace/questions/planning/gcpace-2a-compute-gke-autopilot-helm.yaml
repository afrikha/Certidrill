id: gcpace-2a-compute-gke-autopilot-helm
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company is migrating 25 microservices that are already described as Kubernetes manifests and Helm charts, including two StatefulSets with persistent volumes. The company wants to keep using the Kubernetes API and its existing charts. The operations team is small and does not want to provision, upgrade, or scale nodes.

    Which compute option should you choose?
body:
  options:
    - id: a
      text: { en: "A GKE Autopilot cluster, where Google manages the nodes and you deploy the existing manifests and Helm charts." }
    - id: b
      text: { en: "A GKE Standard cluster with several node pools that the operations team sizes and upgrades on a schedule." }
    - id: c
      text: { en: "One Cloud Run service per microservice, with the Kubernetes manifests converted to Cloud Run service definitions." }
    - id: d
      text: { en: "Compute Engine VMs in managed instance groups, with one instance template per microservice." }
answer: { optionId: a }
explanation:
  correct:
    en: GKE Autopilot is a Kubernetes cluster in which Google manages the node infrastructure, scaling, and security configuration. The team keeps the Kubernetes API, so the existing manifests, Helm charts, and StatefulSets work without node management.
  options:
    b: { en: "GKE Standard also runs the charts, but the team must manage the node pools, which the small operations team wants to avoid." }
    c: { en: "Cloud Run does not run Kubernetes manifests, Helm charts, or StatefulSets, so every service would have to be redesigned." }
    d: { en: "MIGs drop the Kubernetes API and the existing charts, and the team would manage VMs for each microservice." }
references:
  - title: "GKE Autopilot overview | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
  - title: "Choose compute options | Compute | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/compute-area/choose-compute-options
