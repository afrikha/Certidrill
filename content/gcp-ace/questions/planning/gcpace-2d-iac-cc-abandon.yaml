id: gcpace-2d-iac-cc-abandon
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Cloud SQL instance `orders-db` was created from the Config Connector object `SQLInstance/orders-db` in the namespace `shop`. The company is moving the management of this instance to Terraform. You must remove the object from the cluster so that Config Connector stops managing the instance, and the instance and its data must remain in place.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Run `kubectl delete sqlinstance orders-db -n shop`, because deleting a Kubernetes object never deletes the Google Cloud resource." } }
    - { id: b, text: { en: "Set the annotation `cnrm.cloud.google.com/reconcile-interval-in-seconds: \"0\"` on the object, apply it, and then delete the object with kubectl." } }
    - { id: c, text: { en: "Set the annotation `cnrm.cloud.google.com/deletion-policy: abandon` on the object, apply it, and then delete the object with kubectl." } }
    - { id: d, text: { en: "Run `kubectl delete namespace shop`, so that the object is removed together with the namespace that holds it." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      By default, deleting a Config Connector object also deletes the Google Cloud resource that it manages. With the `cnrm.cloud.google.com/deletion-policy: abandon` annotation applied first, deleting the object leaves the Cloud SQL instance and its data in place, ready to be imported into Terraform.
  options:
    a: { en: "Config Connector's default is to delete the underlying resource when the object is deleted, so the instance would be destroyed." }
    b: { en: "A reconcile interval of 0 only disables drift correction; deleting the object still deletes the instance." }
    d: { en: "Deleting the namespace deletes the objects in it, and Config Connector deletes their Google Cloud resources by default." }
references:
  - title: "Managing and deleting resources | Config Connector | Google Cloud Documentation"
    url: https://docs.cloud.google.com/config-connector/docs/how-to/managing-deleting-resources
  - title: "Reconciliation strategy | Config Connector | Google Cloud Documentation"
    url: https://docs.cloud.google.com/config-connector/docs/concepts/reconciliation
