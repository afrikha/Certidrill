id: gcpace-2b-spot-long-render
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    An animation studio renders film sequences on Compute Engine. Each render job runs for about 30 hours, writes a checkpoint to Cloud Storage every 15 minutes, and resumes from the last checkpoint if its VM disappears. The studio wants the lowest compute price for these VMs.

    Which provisioning option should you use?
body:
  options:
    - id: a
      text:
        en: |-
          Preemptible VMs, created with the `--preemptible` flag
    - id: b
      text:
        en: |-
          Standard VMs covered by a one-year resource-based committed use discount
    - id: c
      text:
        en: |-
          Spot VMs, created with the `--provisioning-model=SPOT` flag
    - id: d
      text:
        en: |-
          Standard VMs placed on sole-tenant nodes reserved for the studio
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Spot VMs run on excess Compute Engine capacity at discounts of up to 91% off the on-demand price, and unlike preemptible VMs they have no maximum runtime unless you set one. The checkpoints let each job resume after a preemption, so the Spot discount fits this fault-tolerant 30-hour job.
  options:
    a:
      en: |-
        Preemptible VMs run for at most 24 hours at a time, so every 30-hour job would be interrupted at least once even without capacity reclaims; Google recommends Spot VMs instead.
    b:
      en: |-
        A committed use discount requires paying for the resources for a full year and is usually smaller than the Spot discount, so it isn't the lowest price for a fault-tolerant job.
    d:
      en: |-
        Sole-tenant nodes dedicate physical servers to a project for isolation or licensing needs and cost more than standard VMs on shared hosts.
references:
  - title: "Spot VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/spot
  - title: "Preemptible VM instances | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/preemptible
