id: gcpace-2b-audit-log-trigger-vm
objective: "2.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A security team wants its Cloud Run service tag-checker to run each time someone creates a Compute Engine VM in the project, so that it can check the VM's labels within minutes. The team doesn't want to poll the Compute Engine API.

    What should you configure?
body:
  options:
    - id: a
      text:
        en: |-
          An Eventarc trigger with the event type google.cloud.audit.log.v1.written, filtered on the Compute Engine service name and on the method that inserts instances
    - id: b
      text:
        en: |-
          An Eventarc trigger with the event type google.cloud.storage.object.v1.finalized for the bucket that stores the project's VM images
    - id: c
      text:
        en: |-
          A Cloud Scheduler job that sends an HTTP request to tag-checker every five minutes
    - id: d
      text:
        en: |-
          A new Pub/Sub topic with a push subscription whose endpoint is the URL of tag-checker
answer: { optionId: a }
explanation:
  correct:
    en: |-
      VM creations are recorded in Admin Activity audit logs, which are always written. An Eventarc trigger of type google.cloud.audit.log.v1.written with the required serviceName (compute.googleapis.com) and methodName filters routes these log entries to tag-checker after each creation, without enabling extra logs.
  options:
    b:
      en: |-
        This trigger fires when objects are written to a bucket, not when VMs are created.
    c:
      en: |-
        A scheduled request is polling: it checks only every five minutes, calls the service even when nothing changed, and isn't tied to each VM creation.
    d:
      en: |-
        Nothing publishes VM creations to a new topic, so the subscription would never deliver a message.
references:
  - title: "Route audit log events to Cloud Run | Eventarc Standard | Google Cloud Documentation"
    url: https://docs.cloud.google.com/eventarc/standard/docs/run/route-trigger-cloud-audit-logs
