id: gcpace-2b-internal-api-clusterip
objective: "2.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A team is deploying a stateless inventory API to GKE. Three identical replicas must keep running and be recreated automatically if a node fails. Only other workloads in the same cluster call the API, through a stable internal IP address; the API must not be reachable from outside the cluster.

    Which two objects should you create? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Three standalone Pods created with `kubectl run`, one for each replica
    - id: b
      text:
        en: |-
          A Deployment with `replicas: 3` for the API Pods
    - id: c
      text:
        en: |-
          A Service of type LoadBalancer that selects the API Pods
    - id: d
      text:
        en: |-
          A DaemonSet that runs the API Pods
    - id: e
      text:
        en: |-
          A Service of type ClusterIP that selects the API Pods
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A Deployment keeps the requested number of identical stateless Pods running and replaces the Pods lost with a failed node. A ClusterIP Service, the default type, gives the Pods a stable internal cluster IP address that clients in the cluster use, without exposing them outside the cluster.
  options:
    a:
      en: |-
        Standalone Pods have no controller, so they aren't recreated when their node fails.
    c:
      en: |-
        A LoadBalancer Service provisions a Google Cloud load balancer that exposes the API outside the cluster.
    d:
      en: |-
        A DaemonSet runs one Pod per node, so the number of replicas would follow the node count instead of staying at three.
references:
  - title: "Exposing applications using services | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/exposing-apps
  - title: "Deploying a stateless Linux application | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/stateless-apps
