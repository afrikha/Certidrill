id: gcpace-2a-vm-gcloud-ssh-first-connect
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at a game studio has just launched a Linux VM named dev-1 in the us-east1-c zone. OS Login is not enabled in the project, the default SSH firewall rule exists, and the developer has never created an SSH key. The developer wants to connect from a terminal on a workstation where the gcloud CLI is installed, with as little manual key handling as possible.

    What should the developer do?
body:
  options:
    - id: a
      text: { en: "Generate a key pair with ssh-keygen, then paste the public key into the ~/.ssh/authorized_keys file of dev-1 through the serial console." }
    - id: b
      text: { en: "Run `gcloud compute os-login ssh-keys add --key-file=~/.ssh/id_rsa.pub`, and then connect with the local ssh client." }
    - id: c
      text: { en: "Run `gcloud compute ssh dev-1 --zone=us-east1-c`, which creates a key pair and publishes the public key to metadata." }
    - id: d
      text: { en: "Add a public key to the instance metadata of dev-1 with the enable-oslogin key, and then connect with the local ssh client." }
answer: { optionId: c }
explanation:
  correct:
    en: Without OS Login, `gcloud compute ssh` creates a persistent key pair the first time, keeps the private key on the workstation, and stores the public key in project metadata (or instance metadata if project keys are blocked). The guest agent then adds the key to the VM, so the developer handles no key manually.
  options:
    a: { en: "This is manual work, and keys written directly to authorized_keys can be overwritten by the guest agent, so metadata methods are preferred." }
    b: { en: "Keys in an OS Login profile are used only when OS Login is enabled, which is not the case here; the developer also has no key yet." }
    d: { en: "enable-oslogin is the metadata key that turns OS Login on or off; it does not hold SSH keys, which go in the ssh-keys key." }
references:
  - title: "About SSH connections | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/ssh
  - title: "Add SSH keys to VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/connect/add-ssh-keys
