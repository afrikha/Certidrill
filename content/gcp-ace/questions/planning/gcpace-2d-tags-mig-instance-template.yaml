id: gcpace-2d-tags-mig-instance-template
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs its matchmaking service on a regional managed instance group (MIG) that autoscales. A rule in the global network firewall policy allows player traffic to VMs that have the secure tag value `123456789012/svc/matchmaker`. An engineer bound this value to each running VM with `gcloud resource-manager tags bindings create`. After a scale-out event, the new VMs do not receive the traffic that the rule allows.

    What should you do so that every VM that the MIG creates in the future has the tag value?
body:
  options:
    - { id: a, text: { en: "Create an instance template that adds the network tag matchmaker with --tags, and set it as the MIG's instance template." } }
    - { id: b, text: { en: "Create a Cloud Scheduler job that runs the tags bindings create command every hour for the MIG's VMs that lack the tag value." } }
    - { id: c, text: { en: "Recreate the svc tag key with --purpose-data=organization=auto, and bind its matchmaker value to the running VMs again." } }
    - { id: d, text: { en: "Create an instance template that sets the tag value with --resource-manager-tags, and set it as the MIG's instance template." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A tag binding created on a VM applies only to that VM; VMs that the autoscaler creates later start from the instance template. The `--resource-manager-tags` flag of `gcloud compute instance-templates create` adds the secure tag value to every VM created from the template, so new VMs are matched by the rule as soon as they start.
  options:
    a: { en: "A network tag is a plain string that only VPC firewall rules use; the network firewall policy rule matches only the secure tag value." }
    b: { en: "A scheduled job leaves new VMs without the tag until its next run and adds custom code to maintain, while the template solves it at creation." }
    c: { en: "The scope of the key is not the problem: the new VMs have no binding at all, whatever the purpose data of the key." }
references:
  - title: "Manage VM traffic by using secure tags | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/use-tags-for-firewalls
