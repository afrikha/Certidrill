id: gcpace-2a-vm-create-image-family
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A school district needs a Compute Engine VM named web-1 in the europe-west1-b zone with the e2-standard-2 machine type. The boot disk must use the most recent Debian 12 public image, and the team's script must keep working after Google publishes newer Debian 12 images.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`gcloud compute instances create web-1 --zone=europe-west1-b --machine-type=e2-standard-2 --image=debian-12`" }
    - id: b
      text: { en: "`gcloud compute instances create web-1 --zone=europe-west1-b --machine-type=e2-standard-2 --image-family=debian-12 --image-project=debian-cloud`" }
    - id: c
      text: { en: "`gcloud compute instance-templates create web-1 --machine-type=e2-standard-2 --image-family=debian-12 --image-project=debian-cloud`" }
    - id: d
      text: { en: "`gcloud compute instances create web-1 --zone=europe-west1-b --machine-type=e2-standard-2 --image-family=debian-12`" }
answer: { optionId: b }
explanation:
  correct:
    en: An image family always resolves to the most recent non-deprecated image in the family, so `--image-family=debian-12` keeps the script valid when new images are published. Public images live in their own image projects, so `--image-project=debian-cloud` is required, and the VM is created in the zone given by `--zone`.
  options:
    a: { en: "`--image` expects the name of one specific image, not a family name, and the public image project is missing." }
    c: { en: "This command creates an instance template, not a VM; nothing would run until a VM or a MIG is created from it." }
    d: { en: "Without `--image-project`, gcloud looks for the image family in your own project, where no debian-12 family exists." }
references:
  - title: "Create an instance from a public image | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/create-vm-from-public-image
