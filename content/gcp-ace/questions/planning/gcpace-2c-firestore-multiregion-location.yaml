id: gcpace-2c-firestore-multiregion-location
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A mobile banking startup is creating the Firestore database of its app for customers in the United States. The data must be replicated across several US regions, and the database must target 99.999% monthly uptime.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud firestore databases create --location=us-central1`
    - id: b
      text:
        en: |-
          `gcloud firestore databases create --location=us-east1 --enable-pitr`
    - id: c
      text:
        en: |-
          `gcloud firestore databases create --location=nam5`
    - id: d
      text:
        en: |-
          `gcloud firestore databases create --location=us-central1 --delete-protection`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `nam5` is a Firestore multi-region location in the United States: data is replicated across several regions, and the multi-region SLA is 99.999% monthly uptime. The location can't be changed after the database is created, so it must be chosen correctly at creation.
  options:
    a:
      en: |-
        `us-central1` is a regional location: data is replicated across zones of one region only, with a 99.99% SLA.
    b:
      en: |-
        Point-in-time recovery protects against accidental changes, but `us-east1` is still a single region with a 99.99% SLA.
    d:
      en: |-
        Delete protection prevents the database from being deleted; it doesn't add regions to a regional location.
references:
  - title: "Locations | Firestore in Native mode | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firestore/native/docs/locations
