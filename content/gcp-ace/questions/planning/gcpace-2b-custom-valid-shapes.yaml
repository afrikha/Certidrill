id: gcpace-2b-custom-valid-shapes
objective: "2.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A cost review proposes replacing several oversized VMs with custom machine types. A colleague drafted five machine type strings for the new VMs, and you must keep only the ones that Compute Engine accepts.

    Which two machine types are valid? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `n2-custom-5-20480` (N2, 5 vCPUs, 20 GB)
    - id: b
      text:
        en: |-
          `n2-custom-6-49152` (N2, 6 vCPUs, 48 GB)
    - id: c
      text:
        en: |-
          `e2-custom-36-73728` (E2, 36 vCPUs, 72 GB)
    - id: d
      text:
        en: |-
          `e2-custom-4-40960` (E2, 4 vCPUs, 40 GB)
    - id: e
      text:
        en: |-
          `custom-1-3840` (N1, 1 vCPU, 3.75 GB)
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      N2 custom machine types accept an even number of vCPUs up to 32 and up to 8 GB per vCPU, so 6 vCPUs with 48 GB is valid. N1 custom machine types, whose strings omit the series prefix, accept 1 vCPU or an even number of vCPUs, with 1 to 6.5 GB per vCPU for a single vCPU, so 1 vCPU with 3,840 MB (a multiple of 256 MB) is valid.
  options:
    a:
      en: |-
        N2 custom machine types need an even number of vCPUs up to 32, so 5 vCPUs is rejected.
    c:
      en: |-
        E2 custom machine types support 2 to 32 vCPUs, so 36 vCPUs is out of range.
    d:
      en: |-
        E2 custom machine types allow at most 8 GB per vCPU (32 GB for 4 vCPUs), and the E2 series doesn't support extended memory.
references:
  - title: "Create a VM with a custom machine type | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/creating-instance-with-custom-machine-type
