id: gcpace-2a-vm-no-external-ip-sa
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank is writing the `gcloud compute instances create` command for a VM named worker-1. Security rules state that the VM must not have an external IPv4 address. The VM must run as the user-managed service account worker-sa@bank-prod.iam.gserviceaccount.com, and what the VM can do in Google Cloud APIs must be controlled only through the IAM roles of that service account.

    Which two flags should you include in the command? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "`--network-tier=STANDARD`" }
    - id: b
      text: { en: "`--private-network-ip=10.10.0.5`" }
    - id: c
      text: { en: "`--no-address`" }
    - id: d
      text: { en: "`--service-account=worker-sa@bank-prod.iam.gserviceaccount.com --no-scopes`" }
    - id: e
      text: { en: "`--service-account=worker-sa@bank-prod.iam.gserviceaccount.com --scopes=cloud-platform`" }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "`--no-address` creates the VM without an external IP address. Attaching the service account with the cloud-platform scope lets it call any Google Cloud API in principle, so the IAM roles granted to the service account alone decide what it can do, which is Google's recommended setup."
  options:
    a: { en: "The network tier only selects Premium or Standard routing for the external address; the VM still gets an external IP." }
    b: { en: "This sets the internal IP address; an external IP is still assigned by default." }
    d: { en: "Without scopes, the VM's tokens cannot call Google Cloud APIs at all, so the service account's IAM roles would be useless." }
references:
  - title: "Create a VM that uses a user-managed service account | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/access/create-enable-service-accounts-for-instances
  - title: "gcloud compute instances create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/compute/instances/create
