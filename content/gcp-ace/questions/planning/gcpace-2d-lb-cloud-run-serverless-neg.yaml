id: gcpace-2d-lb-cloud-run-serverless-neg
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup runs the Cloud Run service `checkout` in `us-central1`. It wants to serve the service behind a global external Application Load Balancer so that it can attach a Cloud Armor security policy and a custom domain. You are creating the backend of the load balancer.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a backend bucket that points to the run.app URL of the checkout service, and set it as the URL map's default backend." } }
    - { id: b, text: { en: "Create a serverless NEG with --network-endpoint-type=serverless and --cloud-run-service=checkout, and add it to a global backend service." } }
    - { id: c, text: { en: "Create a zonal NEG with --network-endpoint-type=gce-vm-ip-port that contains the service's IP address, and add it to a global backend service." } }
    - { id: d, text: { en: "Create a target pool in us-central1 that contains the checkout service, and point a global forwarding rule at the target pool." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A serverless network endpoint group points an Application Load Balancer at a Cloud Run service, Cloud Run function, or App Engine app in a region. You create it with `gcloud compute network-endpoint-groups create --region=us-central1 --network-endpoint-type=serverless --cloud-run-service=checkout` and add it to the backend service with `gcloud compute backend-services add-backend`; health checks are not used for serverless backends.
  options:
    a: { en: "Backend buckets serve objects from Cloud Storage buckets; they cannot point to a Cloud Run service." }
    c: { en: "GCE_VM_IP_PORT endpoints are VM network interfaces with ports; a Cloud Run service has no VM endpoints." }
    d: { en: "Target pools are for legacy passthrough Network Load Balancers with VM backends, not for an Application Load Balancer or Cloud Run." }
references:
  - title: "Serverless network endpoint groups overview | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/negs/serverless-neg-concepts
