id: gcpace-2c-netapp-smb-shares
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company is retiring its on-premises Windows file servers. Employees and Windows Server VMs on Compute Engine map network drives over SMB, and access to the folders is controlled by the company's Active Directory groups. The company wants a fully managed Google Cloud file service that keeps this access model.

    Which product should you use?
body:
  options:
    - id: a
      text:
        en: |-
          A Filestore regional instance shared with the Windows clients
    - id: b
      text:
        en: |-
          A Cloud Storage bucket with uniform bucket-level access for the users
    - id: c
      text:
        en: |-
          Google Cloud NetApp Volumes SMB volumes that use an Active Directory policy
    - id: d
      text:
        en: |-
          A Google Cloud Managed Lustre instance in the region of the VMs
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Google Cloud NetApp Volumes is a managed file service that supports SMB (2.1, 3.0 and 3.1.1) as well as NFS. For SMB volumes it joins the Active Directory domain as a member, so Windows clients map drives and folder permissions keep using the existing AD groups.
  options:
    a:
      en: |-
        Filestore exports NFS shares only (NFSv3 and NFSv4.1); Windows clients can't map its shares as SMB drives.
    b:
      en: |-
        Cloud Storage is object storage controlled by IAM; it doesn't provide SMB shares or Active Directory folder permissions.
    d:
      en: |-
        Managed Lustre is a parallel file system for HPC and AI workloads accessed with the Lustre client, not an SMB file service for Windows users.
references:
  - title: "Google Cloud NetApp Volumes overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/netapp/volumes/docs/discover/overview
  - title: "Google Cloud NetApp Volumes Active Directory integration | Google Cloud Documentation"
    url: https://docs.cloud.google.com/netapp/volumes/docs/configure-and-use/active-directory/about-ad
