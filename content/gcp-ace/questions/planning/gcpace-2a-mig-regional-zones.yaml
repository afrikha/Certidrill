id: gcpace-2a-mig-regional-zones
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A sports streaming company serves its API from an autoscaled zonal managed instance group in us-east1-b. During a recent zonal incident the whole API was unavailable. The company wants the group to keep serving from the other zones of us-east1 if one zone fails, while keeping autoscaling and the existing instance template api-tmpl.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Enable autohealing on the zonal group with an HTTP health check, so that failed VMs are recreated." }
    - id: b
      text: { en: "Increase the maximum number of replicas of the zonal group so that it has spare capacity in us-east1-b." }
    - id: c
      text: { en: "Create one VM from api-tmpl in each zone of us-east1, and add the three VMs to an unmanaged instance group." }
    - id: d
      text: { en: "Create a regional MIG from api-tmpl by using the `--region=us-east1` flag, and configure its autoscaler." }
answer: { optionId: d }
explanation:
  correct:
    en: A regional MIG spreads its VMs evenly across several zones of the region (three zones by default), so if one zone fails the VMs in the remaining zones keep serving. You create it with the `--region` flag and can autoscale it like a zonal MIG.
  options:
    a: { en: "Autohealing recreates VMs in the same zone; if that zone is down, the zonal group still cannot serve." }
    b: { en: "Extra capacity in the same zone fails together with that zone." }
    c: { en: "An unmanaged instance group is spread over zones but cannot be autoscaled or autohealed, so it breaks the autoscaling requirement." }
references:
  - title: "Create a MIG with VMs in multiple zones in a region | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instance-groups/distributing-instances-with-regional-instance-groups
