id: gcpace-2c-bq-load-csv-header
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every night, a point-of-sale system uploads CSV files to `gs://wexford-sales/daily/`. Each file starts with one header row that contains the column names. The BigQuery table `sales.orders` already exists with the correct schema, and the new rows must be added to the rows already in the table.

    Which command should you run to load the files?
body:
  options:
    - id: a
      text:
        en: |-
          `bq load --source_format=CSV --replace sales.orders "gs://wexford-sales/daily/*.csv"`
    - id: b
      text:
        en: |-
          `bq load --source_format=CSV --skip_leading_rows=1 sales.orders "gs://wexford-sales/daily/*.csv"`
    - id: c
      text:
        en: |-
          `bq load --source_format=NEWLINE_DELIMITED_JSON --skip_leading_rows=1 sales.orders "gs://wexford-sales/daily/*.csv"`
    - id: d
      text:
        en: |-
          `bq extract --destination_format=CSV sales.orders "gs://wexford-sales/daily/*.csv"`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `bq load` with `--source_format=CSV` loads the files that match the wildcard URI, and `--skip_leading_rows=1` skips the header row of each file (the default is 0, so headers would be read as data). Without `--replace`, the load appends to the existing table, and the schema argument can be omitted because the table already has one.
  options:
    a:
      en: |-
        `--replace` erases the existing rows of the table, and without `--skip_leading_rows` the header rows are treated as data.
    c:
      en: |-
        The files are CSV, so declaring newline-delimited JSON as the source format makes the load fail.
    d:
      en: |-
        `bq extract` exports a table to Cloud Storage; it doesn't load files into BigQuery.
references:
  - title: "Load CSV data from Cloud Storage | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/loading-data-cloud-storage-csv
