id: gcpace-2b-autopilot-spot-pods
objective: "2.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A research group runs a Deployment of stateless batch workers on a GKE Autopilot cluster. A worker can be interrupted at any time because the queue retries its work item. The group wants these Pods to run at the lower Spot price that Autopilot offers, without changing how the other workloads in the cluster run or are billed.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a node pool with `gcloud container node-pools create workers --cluster=lab --spot`, and schedule the workers on it.
    - id: b
      text:
        en: |-
          Run `gcloud compute instances set-scheduling --provisioning-model=SPOT` on the Compute Engine VMs that host the cluster's nodes.
    - id: c
      text:
        en: |-
          Set `priorityClassName` to a low-priority PriorityClass in the Pod template of the workers.
    - id: d
      text:
        en: |-
          Add the node selector `cloud.google.com/gke-spot: "true"` to the Pod template of the workers.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In Autopilot, you request Spot Pods in the Pod specification, with the `cloud.google.com/gke-spot: "true"` node selector or node affinity. Spot Pods are priced lower than standard Autopilot Pods and suit fault-tolerant batch workloads; only the Pods that select Spot are affected.
  options:
    a:
      en: |-
        In Autopilot, Google manages the nodes, and you request the capacity your Pods need in the Pod specification instead of creating node pools.
    b:
      en: |-
        Autopilot nodes are managed by GKE, so you don't change their VMs with Compute Engine commands, and doing so would affect every workload on those nodes.
    c:
      en: |-
        A PriorityClass changes the scheduling and eviction order of Pods; it doesn't change their price.
references:
  - title: "Run fault-tolerant workloads at lower costs in Spot Pods | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/autopilot-spot-pods
