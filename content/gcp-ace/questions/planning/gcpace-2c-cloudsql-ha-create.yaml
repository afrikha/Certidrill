id: gcpace-2c-cloudsql-ha-create
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are deploying a Cloud SQL for MySQL instance named `orders-db` in the `europe-west1` region for a production order service. If the zone of the instance becomes unavailable, the database must fail over automatically to another zone of the region without any manual action.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud sql instances create orders-db --availability-type=zonal --database-version=MYSQL_8_0 --region=europe-west1 --enable-bin-log`
    - id: b
      text:
        en: |-
          `gcloud sql instances create orders-db --availability-type=regional --database-version=MYSQL_8_0 --region=europe-west1 --enable-bin-log --no-backup`
    - id: c
      text:
        en: |-
          `gcloud sql instances create orders-db-replica --master-instance-name=orders-db --region=europe-west1` after you create `orders-db` with the default settings
    - id: d
      text:
        en: |-
          `gcloud sql instances create orders-db --availability-type=regional --database-version=MYSQL_8_0 --region=europe-west1 --enable-bin-log`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An instance with `--availability-type=regional` is a high-availability instance: Cloud SQL keeps a standby in another zone of the region, replicates writes synchronously and fails over automatically when the primary stops responding. HA for MySQL requires automated backups, which are on by default, and binary logging, which `--enable-bin-log` turns on.
  options:
    a:
      en: |-
        `zonal` is the default availability type and provides no failover capability.
    b:
      en: |-
        High availability requires automated backups, and `--no-backup` turns them off, so this configuration doesn't meet the HA prerequisites.
    c:
      en: |-
        A read replica serves reads only and isn't promoted automatically when the primary's zone fails; promotion is a manual operation.
references:
  - title: "About high availability | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/high-availability
  - title: "gcloud sql instances create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/sql/instances/create
