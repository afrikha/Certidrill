id: gcpace-2b-auth-plugin-apt
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An Ubuntu jump host has the Google Cloud CLI and kubectl installed from Google's APT repository. After an administrator ran `gcloud container clusters get-credentials` on the host, every kubectl command fails with an error saying that gke-gcloud-auth-plugin is not found.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `sudo apt-get install google-cloud-cli-gke-gcloud-auth-plugin`.
    - id: b
      text:
        en: |-
          Run `gcloud components install gke-gcloud-auth-plugin`.
    - id: c
      text:
        en: |-
          Run `gcloud auth login` again with the administrator's account.
    - id: d
      text:
        en: |-
          Run `gcloud container clusters get-credentials` again with the `--internal-ip` flag.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      kubectl needs gke-gcloud-auth-plugin to authenticate to GKE clusters. When the Google Cloud CLI is installed with APT or yum, its component manager is disabled, so the plugin is installed with the same package manager as the google-cloud-cli-gke-gcloud-auth-plugin package.
  options:
    b:
      en: |-
        The component manager is disabled for Google Cloud CLI installations made with APT or yum, so `gcloud components install` doesn't work on this host.
    c:
      en: |-
        Signing in again refreshes the gcloud credentials, but kubectl still can't find the plugin that it must call.
    d:
      en: |-
        `--internal-ip` only changes the endpoint written to the kubeconfig file; kubectl still needs the plugin to authenticate.
references:
  - title: "Install kubectl and configure cluster access | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl
  - title: "Managing gcloud CLI components | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/docs/components
