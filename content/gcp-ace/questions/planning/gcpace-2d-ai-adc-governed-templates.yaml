id: gcpace-2d-ai-adc-governed-templates
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team at an insurance company wants development teams to deploy only approved application architectures, such as a Cloud Run service with a Cloud SQL database behind a load balancer. The platform team will design these architectures once and share them from a central catalog. Developers will customize application drafts created from the shared designs, deploy them from the console or the gcloud CLI, and have the applications registered in App Hub.

    Which Google Cloud product should the platform team use?
body:
  options:
    - { id: a, text: { en: "Fabric FAST" } }
    - { id: b, text: { en: "Config Connector" } }
    - { id: c, text: { en: "Gemini CLI" } }
    - { id: d, text: { en: "Application Design Center" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Application Design Center (generally available) lets platform teams build application templates in spaces and share them through catalogs. Developers create application drafts from the templates, customize and deploy them, and the deployment can register the application in App Hub; Gemini Cloud Assist, a Preview offering, can also help design templates in natural language.
  options:
    a: { en: "Fabric FAST builds an organization landing zone with Terraform; it has no catalog of application templates for developers." }
    b: { en: "Config Connector manages Google Cloud resources as Kubernetes objects; it does not provide governed application templates or App Hub registration." }
    c: { en: "Gemini CLI is an AI agent in the terminal; it does not share approved architectures from a governed catalog." }
references:
  - title: "Application Design Center overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/application-design-center/docs/overview
  - title: "Deploy applications | Application Design Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/application-design-center/docs/deploy-applications
