id: gcpace-2d-conn-peering-nontransitive
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A software company has three VPC networks in different projects: `net-a`, `net-b`, and `net-c`. `net-a` is peered with `net-b`, and `net-b` is peered with `net-c`; both peerings are configured on both sides and are `ACTIVE`. The subnet ranges do not overlap, and no VPN, Cloud Interconnect, or custom route exists. In each network, the only ingress allow rules permit traffic from that network's own subnets.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "VMs in net-a can reach VMs in net-c by internal IP address only after net-a and net-c are peered directly." } }
    - { id: b, text: { en: "Traffic from net-a to net-c is routed through net-b, because net-b exchanges subnet routes with both networks." } }
    - { id: c, text: { en: "VMs in net-a can resolve the Compute Engine internal DNS names of the VMs in net-b." } }
    - { id: d, text: { en: "VMs in net-b do not accept connections from net-a until net-b has an ingress rule that allows the net-a ranges." } }
    - { id: e, text: { en: "If the net-b side of the net-a peering is deleted, traffic keeps flowing because one configuration is enough." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      VPC Network Peering is not transitive: `net-a` and `net-c` exchange no routes through `net-b`, so they need their own peering. Peering does not exchange firewall rules or policies either, so each network needs ingress allow rules for the peered ranges; here `net-b` allows only its own subnets.
  options:
    b: { en: "Routes learned through one peering are not passed to another peering, so net-b does not route traffic between net-a and net-c." }
    c: { en: "Compute Engine internal DNS names of one network are not resolvable from a peered network; Cloud DNS peering or shared private zones are needed." }
    e: { en: "Networks are connected only while each one has a peering configuration; if one side is deleted, the connection stops." }
references:
  - title: "VPC Network Peering | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/vpc-peering
