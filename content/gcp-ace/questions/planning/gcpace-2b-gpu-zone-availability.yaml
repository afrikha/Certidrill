id: gcpace-2b-gpu-zone-availability
objective: "2.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company trains a small TensorFlow model every night. Profiling shows that the training step is not limited by computation: the job spends most of its time waiting for input data, because it is limited by the I/O and the network bandwidth of the host system. The team wants the most cost-effective hardware for this job.

    Which hardware should the team use?
body:
  options:
    - id: a
      text: { en: "Cloud TPU VMs" }
    - id: b
      text: { en: "Compute Engine VMs with CPUs only" }
    - id: c
      text: { en: "G2 VMs with NVIDIA L4 GPUs" }
    - id: d
      text: { en: "A3 High VMs with NVIDIA H100 GPUs" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Google lists models that are limited by the available I/O or the networking bandwidth of the host system among the workloads that suit CPUs. An accelerator would mostly wait for data, so CPU-only VMs give the same throughput without paying for GPUs or TPUs.
  options:
    a: { en: "TPUs suit large models dominated by matrix computations; they don't remove an I/O or network bottleneck on the host." }
    c: { en: "A GPU adds computation, which isn't the bottleneck, and its cost would be wasted while it waits for data." }
    d: { en: "H100 GPUs target large training workloads; they would sit idle while the host's I/O limits the job, at a much higher cost." }
references:
  - title: "Introduction to Cloud TPU | Google Cloud Documentation"
    url: https://docs.cloud.google.com/tpu/docs/intro-to-tpu
