id: gcpace-2d-nst-standard-download-cost
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research lab serves large dataset downloads from VMs in `europe-west4`. Almost all users are universities in the same country. Download speed is not critical, and the lab wants the lowest cost for the data sent to the internet.

    What should you configure for the external IP addresses of the VMs?
body:
  options:
    - { id: a, text: { en: "Premium Tier, so that traffic stays on Google's network to the point of presence closest to each user" } }
    - { id: b, text: { en: "Standard Tier, so that traffic leaves Google's network near the region and is priced lower per GB" } }
    - { id: c, text: { en: "Premium Tier, with the VMs placed behind a global external Application Load Balancer" } }
    - { id: d, text: { en: "Standard Tier, with the VMs placed behind a Cloud CDN-enabled backend service" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Standard Tier hands traffic to the internet near the region of the resource and is priced lower per GB than Premium Tier. For users close to the region who can accept internet performance, it is the cheaper option.
  options:
    a: { en: "Premium Tier gives better performance for distant users, but it costs more, which the lab wants to avoid." }
    c: { en: "A global load balancer requires Premium Tier and adds load balancer charges, which raises the cost." }
    d: { en: "Cloud CDN always uses Premium Tier, so it cannot be combined with Standard Tier." }
references:
  - title: "Network Service Tiers overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
