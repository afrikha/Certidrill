id: gcpace-2c-shared-vpc-enable-attach
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have the Compute Shared VPC Admin and Project IAM Admin roles on the folder that contains the projects `net-host` and `billing-svc`. The Compute Engine API is enabled in both projects. The VPC network in `net-host` must be shared so that the billing team can create VMs in its subnets from `billing-svc`.

    Which two commands should you run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute shared-vpc enable billing-svc`
    - id: b
      text:
        en: |-
          `gcloud compute shared-vpc enable net-host`
    - id: c
      text:
        en: |-
          `gcloud compute shared-vpc associated-projects add net-host --host-project=billing-svc`
    - id: d
      text:
        en: |-
          `gcloud compute networks peerings create net-to-billing --network=shared-vpc --peer-project=billing-svc --peer-network=default`
    - id: e
      text:
        en: |-
          `gcloud compute shared-vpc associated-projects add billing-svc --host-project=net-host`
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      `gcloud compute shared-vpc enable` makes `net-host` a Shared VPC host project, and `gcloud compute shared-vpc associated-projects add` attaches `billing-svc` to it as a service project. Billing team members then need the Compute Network User role on the host project or on specific subnets.
  options:
    a:
      en: |-
        This makes `billing-svc` a host project; a project can't be both a host and a service project, so it could no longer be attached to `net-host`.
    c:
      en: |-
        The arguments are reversed: this tries to attach `net-host` as a service project of `billing-svc`.
    d:
      en: |-
        VPC Network Peering connects two separate networks; it doesn't let the billing project create VMs in the subnets of `net-host`.
references:
  - title: "Provision Shared VPC | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/provisioning-shared-vpc
