id: gcpace-2c-nearline-monthly-access
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A hospital stores scanned referral letters in a new Cloud Storage bucket. Each letter is kept for at least two years, and the medical records team reads a given letter about once a month during the first year. Letters must be readable immediately when requested. You need to choose the default storage class of the bucket by following Google's guidance on access frequency to minimize cost.

    Which storage class should you choose?
body:
  options:
    - id: a
      text:
        en: |-
          Standard
    - id: b
      text:
        en: |-
          Nearline
    - id: c
      text:
        en: |-
          Coldline
    - id: d
      text:
        en: |-
          Archive
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Nearline is the low-cost class for data read or modified about once a month or less, with a 30-day minimum storage duration that the two-year retention easily exceeds. Like every Cloud Storage class, it serves objects with low latency and no offline retrieval step.
  options:
    a:
      en: |-
        Standard is meant for frequently accessed data; its higher storage price isn't justified for data read about once a month.
    c:
      en: |-
        Coldline targets data accessed at most once a quarter; monthly reads would add retrieval fees that are higher than Nearline's.
    d:
      en: |-
        Archive targets data accessed less than once a year, and its retrieval fee is the highest of all classes, which monthly reads would make expensive.
references:
  - title: "Storage classes | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/storage-classes
