id: gcpace-2a-vm-set-scheduling-migrate
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs an inventory database on a Compute Engine VM named app-db in the us-central1-a zone. The VM uses the n2-standard-8 machine type with no GPUs and was created from a script that set its host maintenance policy to TERMINATE. The company now wants the VM to keep running during Compute Engine host maintenance events.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run `gcloud compute instances set-scheduling app-db --zone=us-central1-a --maintenance-policy=MIGRATE`." }
    - id: b
      text: { en: "Run `gcloud compute instances set-scheduling app-db --zone=us-central1-a --restart-on-failure`." }
    - id: c
      text: { en: "Run `gcloud compute instances add-metadata app-db --zone=us-central1-a --metadata=maintenance-policy=MIGRATE`." }
    - id: d
      text: { en: "Run `gcloud compute instances set-scheduling app-db --zone=us-central1-a --host-error-timeout-seconds=90`." }
answer: { optionId: a }
explanation:
  correct:
    en: The host maintenance policy is a scheduling setting of the VM, changed with `gcloud compute instances set-scheduling --maintenance-policy`. With MIGRATE, Compute Engine live migrates the VM to another host during maintenance, so it keeps running; an N2 VM without GPUs supports live migration.
  options:
    b: { en: "Automatic restart only restarts the VM after it has been terminated, so the database would still go down during each maintenance event." }
    c: { en: "A custom metadata entry is only data for the guest; it does not change the VM's scheduling options." }
    d: { en: "The host error timeout controls how long Compute Engine waits for an unresponsive VM before restarting it; it does not change the maintenance behavior." }
references:
  - title: "Set the host maintenance policy for a compute instance | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/setting-vm-host-options
  - title: "About host events | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/host-maintenance-overview
