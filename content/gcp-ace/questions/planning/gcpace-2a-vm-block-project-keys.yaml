id: gcpace-2a-vm-block-project-keys
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineering firm manages SSH access with metadata-based keys; OS Login is not used. The project metadata holds the public keys of 40 contractors, who need SSH access to most VMs in the project. A VM named payroll-1 must accept only the keys of two finance administrators, which are already stored in its instance metadata. Contractors and administrators connect from the same office network.

    You need to meet the requirement with the least administrative effort. What should you do?
body:
  options:
    - id: a
      text: { en: "Remove the contractors' keys from the project metadata, and add them to the instance metadata of every other VM." }
    - id: b
      text: { en: "Run `gcloud compute instances add-metadata payroll-1 --metadata=block-project-ssh-keys=TRUE`." }
    - id: c
      text: { en: "Run `gcloud compute instances add-metadata payroll-1 --metadata=enable-oslogin=FALSE`." }
    - id: d
      text: { en: "Create a firewall rule that denies TCP port 22 to payroll-1 from the office network, with a higher priority than the allow rule." }
answer: { optionId: b }
explanation:
  correct:
    en: Setting block-project-ssh-keys to TRUE in the instance metadata makes payroll-1 ignore the keys in project metadata, so only the keys in its own instance metadata work. The contractors keep their project-wide access to the other VMs.
  options:
    a: { en: "This works only through a large manual change to every other VM, and each new VM would also need the keys, which is far more effort than one metadata entry." }
    c: { en: "OS Login is already off; setting enable-oslogin to FALSE keeps metadata keys in use and does not block the project-wide keys." }
    d: { en: "Both groups connect from the same network, so the firewall rule would block the finance administrators too." }
references:
  - title: "Restrict SSH keys from VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/connect/restrict-ssh-keys
  - title: "Add SSH keys to VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/connect/add-ssh-keys
