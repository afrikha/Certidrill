id: gcpace-2c-transfer-appliance-low-bandwidth
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research institute must move 400 TB of archived instrument data from an on-premises NAS to Cloud Storage within two months. Its only internet link runs at 100 Mbps and is already busy with daily traffic, so an online upload would take about a year. The institute is located in a country where Google offers Transfer Appliance.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Install Storage Transfer Service agents next to the NAS, and create a transfer job that uses their agent pool.
    - id: b
      text:
        en: |-
          Order a Transfer Appliance, copy the data to it, and ship it back to Google for upload to the bucket.
    - id: c
      text:
        en: |-
          Run several `gcloud storage cp` commands in parallel from servers that mount the NAS.
    - id: d
      text:
        en: |-
          Create an agentless Storage Transfer Service job with the NAS as its source.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Transfer Appliance is recommended when uploading over the network would take more than about a week or connectivity is poor: you copy the data to a high-capacity device, ship it to a Google upload facility, and Google uploads it to your Cloud Storage bucket. The network link isn't the bottleneck, so 400 TB fits in the two-month window.
  options:
    a:
      en: |-
        Agent-based transfers still send every byte over the 100 Mbps link, so they would take about a year as well.
    c:
      en: |-
        Parallel uploads can't exceed the bandwidth of the link, so the transfer still takes about a year.
    d:
      en: |-
        Agentless transfers apply to cloud sources such as Amazon S3; data on an on-premises file system requires agents, and it would still be limited by the link.
references:
  - title: "Transfer Appliance | Google Cloud Documentation"
    url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/overview
  - title: "Data transfer options | Storage Transfer Service | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage-transfer/docs/transfer-options
