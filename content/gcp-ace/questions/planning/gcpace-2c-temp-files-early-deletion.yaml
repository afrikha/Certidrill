id: gcpace-2c-temp-files-early-deletion
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data science team writes intermediate files of a weekly pipeline to a bucket whose default storage class is Coldline, to benefit from the low storage price. The pipeline deletes each file seven days after creating it, and the files are read several times during those seven days. The monthly bill shows early deletion and retrieval charges for the bucket.

    What should you do to minimize the cost of these files?
body:
  options:
    - id: a
      text:
        en: |-
          Write the intermediate files to a bucket whose default storage class is Nearline.
    - id: b
      text:
        en: |-
          Keep the Coldline bucket, and replace the pipeline's delete step with a lifecycle rule that deletes objects older than seven days.
    - id: c
      text:
        en: |-
          Write the intermediate files to a bucket whose default storage class is Standard.
    - id: d
      text:
        en: |-
          Write the intermediate files to a bucket whose default storage class is Archive.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Standard has no minimum storage duration and no retrieval fee, so short-lived files that are read several times cost only their storage for seven days. Coldline bills every object deleted before 90 days as if it had been stored for 90 days and adds a fee for every read.
  options:
    a:
      en: |-
        Nearline still has a 30-day minimum storage duration and a retrieval fee, so seven-day files would keep generating early deletion and retrieval charges.
    b:
      en: |-
        Deleting through a lifecycle rule doesn't remove the early deletion charge, which applies to any object deleted before the 90-day minimum, and the retrieval fees remain.
    d:
      en: |-
        Archive has a 365-day minimum storage duration and the highest retrieval fee, which makes short-lived, frequently read files even more expensive.
references:
  - title: "Storage pricing | Google Cloud"
    url: https://cloud.google.com/storage/pricing
  - title: "Storage classes | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/storage-classes
