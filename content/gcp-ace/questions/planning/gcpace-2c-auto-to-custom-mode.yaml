id: gcpace-2c-auto-to-custom-mode
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `default` VPC network of a production project is an auto mode network, and VMs run in its subnets in three regions. The security team no longer wants subnets to be added to the network automatically when Google opens new regions. The existing subnets and VMs must keep running without interruption.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the `default` network, and recreate it as a custom mode network with the same subnet ranges.
    - id: b
      text:
        en: |-
          Run `gcloud compute networks update default --bgp-routing-mode=global`.
    - id: c
      text:
        en: |-
          Run `gcloud compute networks update default --switch-to-custom-subnet-mode`.
    - id: d
      text:
        en: |-
          Delete the auto-created subnets that no VM uses in the regions where the company doesn't operate.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `--switch-to-custom-subnet-mode` converts the auto mode network to custom mode in place: the existing subnets and VMs are kept, and no subnet is added automatically afterward. The conversion is one-way, because a custom mode network can't be converted back to auto mode.
  options:
    a:
      en: |-
        A network can't be deleted while VMs use it, and recreating it would interrupt the workloads.
    b:
      en: |-
        The dynamic routing mode controls how Cloud Routers advertise and learn routes; it doesn't change the subnet mode.
    d:
      en: |-
        The network stays in auto mode, so subnets would still be added automatically in new regions.
references:
  - title: "Quickstart: Create and manage VPC networks | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/create-modify-vpc-networks
  - title: "VPC networks | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/vpc
