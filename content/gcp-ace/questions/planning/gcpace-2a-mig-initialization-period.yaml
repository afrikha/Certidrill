id: gcpace-2a-mig-initialization-period
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company runs an autoscaled zonal managed instance group named match-mig in us-central1-c, configured with a minimum of 2 VMs, a maximum of 20, and a CPU target of 0.6. Each new VM takes about four minutes to load game assets, and its CPU is close to 100% during that time. During traffic spikes, the autoscaler keeps adding far more VMs than needed. You need the autoscaler to ignore the metrics of VMs that are still starting.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`gcloud compute instance-groups managed set-autoscaling match-mig --zone=us-central1-c --min-num-replicas=2 --max-num-replicas=20 --target-cpu-utilization=0.6 --stabilization-period=240`" }
    - id: b
      text: { en: "`gcloud compute instance-groups managed set-autoscaling match-mig --zone=us-central1-c --min-num-replicas=2 --max-num-replicas=20 --target-cpu-utilization=0.6 --cool-down-period=240`" }
    - id: c
      text: { en: "`gcloud compute instance-groups managed update match-mig --zone=us-central1-c --health-check=match-hc --initial-delay=240`" }
    - id: d
      text: { en: "`gcloud compute instance-groups managed set-autoscaling match-mig --zone=us-central1-c --min-num-replicas=2 --max-num-replicas=20 --target-cpu-utilization=0.6 --scale-in-control=max-scaled-in-replicas=2,time-window=240`" }
answer: { optionId: b }
explanation:
  correct:
    en: "`--cool-down-period` sets the autoscaler's initialization period, which defaults to 60 seconds. While a VM is within this period, the autoscaler ignores its data when it scales out, so setting it to the real start-up time of about 240 seconds stops the busy, booting VMs from triggering extra scale-out."
  options:
    a: { en: "The stabilization period applies only to scale-in decisions; it does not stop booting VMs from causing extra scale-out." }
    c: { en: "The initial delay applies to autohealing health checks, so it prevents premature repairs, not autoscaler decisions." }
    d: { en: "Scale-in controls limit how fast the group shrinks; they do nothing about the excessive scale-out." }
references:
  - title: "Scaling based on CPU utilization | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/autoscaler/scaling-cpu
  - title: "Autoscaling groups of instances | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/autoscaler
