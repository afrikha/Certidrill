id: gcpace-2a-compute-cloud-run-bursty-api
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A ticketing startup packages its stateless REST API as a Linux container image. Traffic is close to zero most of the day and spikes to thousands of requests per second when concert tickets go on sale. The team wants to pay nothing while the API is idle and does not want to manage servers, clusters, or node pools.

    Which compute option should you choose?
body:
  options:
    - id: a
      text: { en: "A zonal managed instance group of Compute Engine VMs that runs the container, with CPU-based autoscaling." }
    - id: b
      text: { en: "A GKE Standard cluster with a node pool that uses the cluster autoscaler and a Deployment for the API." }
    - id: c
      text: { en: "A Cloud Run service that deploys the container image with request-based billing and no minimum instances." }
    - id: d
      text: { en: "A Compute Engine VM with a large machine type, sized for the peak, that stops automatically at night." }
answer: { optionId: c }
explanation:
  correct:
    en: Cloud Run runs a stateless container behind an HTTPS endpoint, scales out automatically with requests, and removes the last instance when no requests arrive. With request-based billing you are not charged while no request is being processed, and Google manages the servers.
  options:
    a: { en: "A MIG keeps at least one VM running and requires you to manage the VMs, their image and the autoscaler, so it fails the no-server and zero-idle-cost requirements." }
    b: { en: "GKE Standard requires you to manage the cluster and its node pools, which the team does not want to do, and the cluster still costs money while idle." }
    d: { en: "A single VM sized for the peak is paid for while it runs at low load, cannot scale out for a spike, and is a server the team must manage." }
references:
  - title: "What is Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
  - title: "Choose compute options | Compute | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/compute-area/choose-compute-options
