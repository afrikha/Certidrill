id: gcpace-2b-resize-machine-type
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A VM named reports-1 in zone us-east1-c runs on the n2-standard-4 machine type and uses a static external IP address. Month-end reports now need 8 vCPUs. The team accepts a short downtime but wants to keep the same VM, disks and IP address with the least effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute instances set-machine-type reports-1 --zone=us-east1-c --machine-type=n2-standard-8` while the VM keeps running.
    - id: b
      text:
        en: |-
          Run `gcloud compute disks resize reports-1 --zone=us-east1-c --size=200GB`, and then restart the VM.
    - id: c
      text:
        en: |-
          Snapshot the boot disk, create a new n2-standard-8 VM from the snapshot, and move the static IP address to it.
    - id: d
      text:
        en: |-
          Stop the VM, run `gcloud compute instances set-machine-type reports-1 --zone=us-east1-c --machine-type=n2-standard-8`, and start it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Compute Engine changes the machine type only of a stopped VM, that is a VM in the TERMINATED state. Stopping reports-1, running `set-machine-type` and starting it again keeps the same VM, its disks and its static IP address, with only a short downtime.
  options:
    a:
      en: |-
        `set-machine-type` works only on a stopped (TERMINATED) VM, so the request fails while reports-1 is running.
    b:
      en: |-
        Resizing the boot disk adds storage capacity; it doesn't change the number of vCPUs of the VM.
    c:
      en: |-
        Rebuilding the VM from a snapshot works but creates a different VM and takes more steps than changing the machine type in place.
references:
  - title: "Edit the machine type of a compute instance | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/changing-machine-type-of-stopped-instance
