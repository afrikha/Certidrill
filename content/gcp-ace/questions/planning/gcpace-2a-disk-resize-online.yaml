id: gcpace-2a-disk-resize-online
objective: "2.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A news website keeps its media cache on a 500 GiB Balanced Persistent Disk named cache-data, formatted with ext4 and attached as a non-boot disk to a running Linux VM in the us-central1-f zone. The disk is 90% full. You must give the file system 1 TiB of space without stopping the VM.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Run `gcloud compute disks resize cache-data --zone=us-central1-f --size=1TB`." }
    - id: b
      text: { en: "Stop the VM, detach cache-data, and attach a new 1 TiB disk in its place." }
    - id: c
      text: { en: "Extend the ext4 file system inside the guest OS with resize2fs." }
    - id: d
      text: { en: "Create a snapshot of cache-data, and restore it to a new 1 TiB disk in the same zone." }
    - id: e
      text: { en: "Restart the VM so that the guest OS detects the larger disk." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: You can increase the size of a Persistent Disk at any time, even while it is attached to a running VM, with `gcloud compute disks resize`. For a non-boot disk you must then extend the file system, with resize2fs for ext4; no restart is needed.
  options:
    b: { en: "Stopping the VM breaks the requirement, and a new empty disk would not contain the existing cache data." }
    d: { en: "A restored copy is a different disk that must be swapped in, which needs a detach and attach and does not grow the existing disk." }
    e: { en: "The resize is visible to a running Linux VM, so no restart is required; the file system still has to be extended." }
references:
  - title: "Modify the size of a Persistent Disk | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/resize-persistent-disk
