id: gcpace-2a-vm-no-live-migration
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A research institute is planning how its Compute Engine VMs will react to host maintenance events. Every VM uses the default host maintenance settings where its configuration allows them. The operations team wants to know which VMs will be terminated, and restarted if automatic restart is on, instead of being live migrated.

    Which two VMs will not be live migrated? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A VM with NVIDIA GPUs attached that trains models." }
    - id: b
      text: { en: "An N2 VM with two Local SSD disks used as a cache." }
    - id: c
      text: { en: "An E2 VM that hosts the institute's public website." }
    - id: d
      text: { en: "A bare metal instance that runs a custom hypervisor." }
    - id: e
      text: { en: "An N2D Confidential VM that uses AMD SEV on AMD EPYC Milan." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Instances with GPUs or TPUs and bare metal instances cannot be live migrated, so they are terminated during host events and restarted if automatic restart is enabled. Most other VMs live migrate by default.
  options:
    b: { en: "Standard Local SSD disks do not prevent live migration, and their data is preserved when the VM is live migrated." }
    c: { en: "E2 VMs live migrate; their maintenance behavior cannot even be changed to TERMINATE." }
    e: { en: "Confidential VMs usually cannot live migrate, but N2D VMs with AMD EPYC Milan running AMD SEV are the documented exception." }
references:
  - title: "About host events | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/host-maintenance-overview
  - title: "Set the host maintenance policy for a compute instance | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/setting-vm-host-options
