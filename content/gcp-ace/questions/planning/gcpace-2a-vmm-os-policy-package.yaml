id: gcpace-2a-vmm-os-policy-package
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company uses VM Manager on its Linux VMs in the us-central1-a zone. The security team requires the endpoint agent package acme-edr to be installed on every VM labeled tier=web, including VMs created later. If someone uninstalls the package, VM Manager must reinstall it and report the VM's compliance.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create an OS policy assignment in us-central1-a with a package resource for acme-edr and a tier=web label filter." }
    - id: b
      text: { en: "Run `gcloud compute os-config patch-jobs execute --instance-filter-group-labels=tier=web --apt-exclusive-packages=acme-edr` each week." }
    - id: c
      text: { en: "Add a startup script that installs acme-edr to the instance template and to the metadata of every tier=web VM." }
    - id: d
      text: { en: "Run `gcloud compute os-config inventories list --location=us-central1-a --view=full` each day and install the package where it is missing." }
answer: { optionId: a }
explanation:
  correct:
    en: An OS policy declares the desired state of OS resources such as packages, repositories, files, and scripts, and an OS policy assignment applies policies to the VMs of one zone selected by labels and OS. VM Manager periodically checks and enforces the policy, which reinstalls the package if it is removed, and reports compliance for each VM.
  options:
    b: { en: "A patch job updates packages that are already installed; it does not keep a missing package installed or report policy compliance." }
    c: { en: "A startup script runs only at boot, so a package removed later stays missing until the next restart, and nothing reports compliance." }
    d: { en: "OS inventory reports what is installed but enforces nothing, so the daily manual fix-up is not what the requirement asks for." }
references:
  - title: "About OS policies | VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/os-configuration-management
