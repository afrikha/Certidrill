id: gcpace-2a-mig-autohealing-setup
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a web application on a zonal managed instance group named track-mig in asia-east1-a. Sometimes the application hangs while the VM keeps running, and the hung VM keeps receiving traffic until someone deletes it. You have already created an HTTP health check named track-hc that checks port 80, and the application needs about three minutes to start. You need the group to recreate VMs whose application stops responding.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create a firewall rule that allows TCP port 80 to the VMs from 130.211.0.0/22 and 35.191.0.0/16." }
    - id: b
      text: { en: "Set the autoscaler's CPU target lower so that the group adds VMs before the application hangs." }
    - id: c
      text: { en: "Create a new instance template that references track-hc, and start a rolling update to that template." }
    - id: d
      text: { en: "Run `gcloud compute instance-groups managed update track-mig --zone=asia-east1-a --health-check=track-hc --initial-delay=300`." }
    - id: e
      text: { en: "Create a new instance template with automatic restart enabled, and start a rolling update to that template." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Autohealing uses an application-based health check attached to the MIG, with an initial delay that covers the start-up time so that booting VMs are not recreated. Health check probes come from 130.211.0.0/22 and 35.191.0.0/16, so a firewall rule must allow them on port 80, or healthy VMs would be marked unhealthy.
  options:
    b: { en: "More VMs do not fix a hung application; the hung VM is neither detected nor recreated." }
    c: { en: "The autohealing health check is a property of the MIG, not of the instance template." }
    e: { en: "Automatic restart reacts when Compute Engine terminates a VM, for example after a host error; it does not detect an application that hangs on a running VM." }
references:
  - title: "Set up an application-based health check and autohealing | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instance-groups/autohealing-instances-in-migs
