id: gcpace-2c-fw-stateful-egress-deny
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The VM `api-1` has an external IP address and the network tag `api` in a custom mode VPC network. The network has only two firewall rules:

    | Name | Direction | Action | Target | Source or destination | Protocol and port | Priority |
    | --- | --- | --- | --- | --- | --- | --- |
    | allow-https-in | Ingress | Allow | Tag `api` | Source 0.0.0.0/0 | tcp:443 | 1000 |
    | deny-all-out | Egress | Deny | All instances | Destination 0.0.0.0/0 | all | 1000 |

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Clients on the internet can complete HTTPS connections to `api-1`, because the responses of allowed connections are permitted.
    - id: b
      text:
        en: |-
          `deny-all-out` blocks the responses of `api-1` to incoming HTTPS requests.
    - id: c
      text:
        en: |-
          `api-1` can't open new HTTPS connections to external APIs on the internet.
    - id: d
      text:
        en: |-
          Clients on the internet can connect to `api-1` with SSH, because no rule denies TCP port 22.
    - id: e
      text:
        en: |-
          `deny-all-out` prevents `api-1` from reaching the metadata server at 169.254.169.254.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      VPC firewall rules are stateful: once `allow-https-in` permits a connection, its return traffic is allowed in the other direction, and no rule can deny that response traffic. New outbound connections from `api-1` match `deny-all-out` and are blocked.
  options:
    b:
      en: |-
        Response traffic of an allowed connection is permitted whatever the egress rules say; a firewall rule can't be configured to deny it.
    d:
      en: |-
        Ingress that matches no rule is blocked by the implied deny action, so SSH isn't allowed.
    e:
      en: |-
        Traffic to and from the metadata server isn't subject to firewall rules.
references:
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
