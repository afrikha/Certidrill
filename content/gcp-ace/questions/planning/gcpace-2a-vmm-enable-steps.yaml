id: gcpace-2a-vmm-enable-steps
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A university wants to use VM Manager for patching and OS inventory in its project research-vms. All VMs were created from Debian 12 public images, which include the OS Config agent, have external IP addresses, and run with an attached service account. You do not want to use the console's automatic enablement.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Run `gcloud services enable osconfig.googleapis.com --project=research-vms`." }
    - id: b
      text: { en: "Install the Ops Agent on every VM, because VM Manager collects its data through that agent." }
    - id: c
      text: { en: "Run `gcloud compute project-info add-metadata --metadata=enable-osconfig=TRUE --project=research-vms`." }
    - id: d
      text: { en: "Grant the OS Config Admin role (`roles/osconfig.admin`) to the service account attached to the VMs." }
    - id: e
      text: { en: "Run `gcloud compute project-info add-metadata --metadata=enable-oslogin=TRUE --project=research-vms`." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Manual setup of VM Manager enables the OS Config API in the project and sets the enable-osconfig metadata key to TRUE, in project metadata for all VMs or in instance metadata for some. The OS Config agent is already on these images, and the VMs have the attached service account and network access that VM Manager also needs.
  options:
    b: { en: "The OS Config agent, not the Ops Agent, talks to VM Manager; the Ops Agent collects logs and metrics." }
    d: { en: "VM Manager requires a service account attached to each VM, but that service account needs no IAM role." }
    e: { en: "enable-oslogin controls SSH access through OS Login; it has nothing to do with VM Manager." }
references:
  - title: "Set up VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/manage-os
