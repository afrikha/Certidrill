id: gcpace-2d-conn-classic-vpn-static
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A design agency must connect one branch office to its VPC network on Google Cloud. The branch firewall supports IPsec with IKEv2 and static routes, but it does not support BGP and cannot be replaced this year. A 99.9% availability SLA is acceptable, the traffic can cross the internet if it is encrypted, and the agency wants the lowest-cost option.

    Which connectivity option should you use?
body:
  options:
    - { id: a, text: { en: "An HA VPN gateway with two tunnels and static routes that point to the branch ranges" } }
    - { id: b, text: { en: "A Partner Interconnect VLAN attachment through a local service provider" } }
    - { id: c, text: { en: "A Classic VPN gateway with a route-based tunnel and static routes" } }
    - { id: d, text: { en: "VPC Network Peering between the VPC network and the branch network" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Classic VPN supports only static routing, either route-based or policy-based, and provides a 99.9% SLA, which the requirements accept. The tunnel uses IPsec over the internet, so a branch firewall without BGP can connect.
  options:
    a: { en: "HA VPN supports only dynamic routing with BGP, which the branch firewall cannot run." }
    b: { en: "Partner Interconnect adds a service provider circuit and VLAN attachment charges for a private link that the agency does not need, so it is not the lowest-cost option." }
    d: { en: "VPC Network Peering connects VPC networks to each other; it cannot connect an on-premises network." }
references:
  - title: "Cloud VPN overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-connectivity/docs/vpn/concepts/overview
