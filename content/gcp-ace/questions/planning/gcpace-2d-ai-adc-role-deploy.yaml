id: gcpace-2d-ai-adc-role-deploy
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Application Design Center, a platform team creates application templates and shares them with the development teams through a catalog. The developers of the Orion team must create, manage, and deploy applications from these templates. They must not create or update templates, and they must not delegate application control to other users. You must follow the principle of least privilege.

    Which role should you grant to the Orion developers on the app-enabled folder?
body:
  options:
    - { id: a, text: { en: "Application Design Center Admin (roles/designcenter.admin)" } }
    - { id: b, text: { en: "Application Design Center User (roles/designcenter.user)" } }
    - { id: c, text: { en: "Application Editor (roles/designcenter.applicationEditor)" } }
    - { id: d, text: { en: "Application Viewer (roles/designcenter.applicationViewer)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Application Editor lets a principal create, manage, and deploy applications, and nothing more. Application Admin would add the ability to delegate application control, and the template roles are meant for the platform team. Application Design Center is generally available.
  options:
    a: { en: "Application Design Center Admin includes all Application Design Center permissions, including template management and delegation." }
    b: { en: "Application Design Center User is the role for creating and updating application templates, which the developers must not do." }
    d: { en: "Application Viewer only lets the developers view applications; they could not deploy them." }
references:
  - title: "Access control with IAM | Application Design Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/application-design-center/docs/access-control
