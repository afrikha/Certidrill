id: gcpace-2a-vm-project-ssh-keys-overwrite
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A biotech company uses metadata-based SSH keys; OS Login is not enabled. The project metadata already contains the ssh-keys entry with the keys of six engineers. A new engineer, priya, has sent you the public key file priya.pub, and she needs SSH access to every VM in the project, including VMs created later. The six existing engineers must keep their access.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a file with the single line priya:KEY_VALUE, and run `gcloud compute project-info add-metadata --metadata-from-file=ssh-keys=new-key.txt`." }
    - id: b
      text: { en: "Run `gcloud compute instances add-metadata VM_NAME --metadata-from-file=ssh-keys=new-key.txt` for each VM, with the line priya:KEY_VALUE in the file." }
    - id: c
      text: { en: "Save the current ssh-keys value from `gcloud compute project-info describe`, append priya:KEY_VALUE, and write the whole list back with `add-metadata`." }
    - id: d
      text: { en: "Ask priya to run `gcloud compute os-login ssh-keys add --key-file=priya.pub` so that her key is published to every VM in the project." }
answer: { optionId: c }
explanation:
  correct:
    en: The ssh-keys metadata value is replaced as a whole on each update, so you must first read the existing keys, for example with `gcloud compute project-info describe --format="value(commonInstanceMetadata[items][ssh-keys])"`, and then write back the complete list. Each entry uses the USERNAME:KEY_VALUE format.
  options:
    a: { en: "add-metadata replaces the whole ssh-keys value, so a file with only the new key erases the six existing keys." }
    b: { en: "Instance-level keys apply only to each VM, new VMs would not get the key, and the same replacement problem applies to any existing instance-level keys." }
    d: { en: "Keys in an OS Login profile are used only on VMs where OS Login is enabled; with metadata-based keys they give no access." }
references:
  - title: "Add SSH keys to VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/connect/add-ssh-keys
