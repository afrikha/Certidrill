id: gcpace-2d-tags-tag-user-app-team
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At a fintech company, the network security team owns the global network firewall policy and the secure tag key `123456789012/role`, which has the values `frontend` and `backend`. The payments team runs its VMs in project `pay-prod`, where it has the Compute Instance Admin (v1) role. The payments team must be able to attach the `frontend` value to its own VMs. It must not be able to change firewall rules or create, change, or delete tag keys and values. You must follow the principle of least privilege.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Grant the payments team the Tag Administrator role (roles/resourcemanager.tagAdmin) on the organization." } }
    - { id: b, text: { en: "Grant the payments team the Compute Security Admin role (roles/compute.securityAdmin) on the pay-prod project." } }
    - { id: c, text: { en: "Grant the payments team the Tag User role (roles/resourcemanager.tagUser) on the frontend tag value and on the pay-prod project." } }
    - { id: d, text: { en: "Grant the payments team the Tag Viewer role (roles/resourcemanager.tagViewer) on the role tag key and on the pay-prod project." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Tag User lets a principal attach and remove a tag value; it is needed on the tag value and on the resource that receives the binding. Granting it on the frontend value, the only value the team needs, and on pay-prod lets the team bind that value to its VMs without the ability to edit firewall rules, which is how secure tags separate VM owners from firewall administrators.
  options:
    a: { en: "Tag Administrator can create, update, and delete tag keys and values across the organization, which exceeds what the team needs." }
    b: { en: "Compute Security Admin lets the team change firewall rules and policies, which is explicitly forbidden, and it does not grant use of the tag value." }
    d: { en: "Tag Viewer only lets the team list and view tags; it cannot create a tag binding on a VM." }
references:
  - title: "Secure tags for firewalls | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/tags-firewalls-overview
  - title: "Create and manage tags | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/tags/tags-creating-and-managing
