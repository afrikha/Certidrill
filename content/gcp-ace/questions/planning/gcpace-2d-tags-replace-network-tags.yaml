id: gcpace-2d-tags-replace-network-tags
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company is moving the ingress rules of the VPC network `media-vpc` from VPC firewall rules to the global network firewall policy `fw-media`. Today, a VPC firewall rule allows TCP 443 from the internet to the VMs that have the network tag `web`. The web VMs use the same service account as several other VMs in the network. The new rule in `fw-media` must apply only to the web VMs.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Bind a web value of a GCE_FIREWALL tag key for media-vpc to the web VMs, and target it in fw-media with --target-secure-tags." } }
    - { id: b, text: { en: "Keep the web network tag on the VMs, and create the rule in fw-media with that existing network tag as its target." } }
    - { id: c, text: { en: "Create the rule in fw-media with --target-service-accounts set to the email of the service account that the web VMs use." } }
    - { id: d, text: { en: "Create the rule in a hierarchical firewall policy on the folder instead, with the existing web network tag as its target." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Network firewall policies identify targets with secure tags or service accounts, not with network tags. A secure tag value bound only to the web VMs, used with `--target-secure-tags`, applies the new rule to exactly those VMs, and IAM controls who can bind it.
  options:
    b: { en: "Network tags work only with VPC firewall rules; global network firewall policy rules cannot reference them." }
    c: { en: "The web VMs share their service account with other VMs, so the rule would also open TCP 443 on those VMs." }
    d: { en: "Hierarchical firewall policies cannot use network tags either, and the requirement is to use the fw-media policy." }
references:
  - title: "Secure tags for firewalls | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/tags-firewalls-overview
