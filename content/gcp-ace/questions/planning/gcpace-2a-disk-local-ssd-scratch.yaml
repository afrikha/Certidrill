id: gcpace-2a-disk-local-ssd-scratch
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A genomics lab is creating n2-highmem-16 VMs that run alignment jobs. Each job writes hundreds of gigabytes of intermediate files that need the lowest possible latency and the highest IOPS. The intermediate files can be regenerated from the input data if they are lost, and final results are copied to Cloud Storage.

    Which storage should you add to the VMs when you create them?
body:
  options:
    - id: a
      text: { en: "Local SSD disks attached to each VM and used as scratch space." }
    - id: b
      text: { en: "Regional SSD Persistent Disk volumes replicated across two zones." }
    - id: c
      text: { en: "Hyperdisk Balanced High Availability volumes attached to each VM." }
    - id: d
      text: { en: "A Cloud Storage bucket mounted on each VM with Cloud Storage FUSE." }
answer: { optionId: a }
explanation:
  correct:
    en: Local SSD disks are physically attached to the host, which gives them the lowest latency and very high IOPS, and Google recommends them for scratch space and transient data. Their data can be lost, for example on a stop or a preemption, which is acceptable here; they must be added when the VM is created.
  options:
    b: { en: "Regional Persistent Disk adds synchronous cross-zone replication, which costs more and adds write latency, for data that does not need to be durable." }
    c: { en: "Hyperdisk Balanced High Availability is built for cross-zone durability with an RPO of zero, not for the lowest-latency scratch space." }
    d: { en: "Cloud Storage FUSE accesses object storage over the network, so its latency is much higher than a local disk for intermediate files." }
references:
  - title: "About Local SSD disks | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/local-ssd
