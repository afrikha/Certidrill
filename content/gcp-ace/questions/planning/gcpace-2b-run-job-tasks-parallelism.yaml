id: gcpace-2b-run-job-tasks-parallelism
objective: "2.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A media company must transcode 500 video files every night. Its container processes one file per task and uses the task index to pick the file. Because of a partner API's rate limit, at most 50 tasks may run at the same time.

    Which command should you use to create the Cloud Run job?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud run jobs create transcode --image=IMAGE_URL --region=europe-west1 --tasks=50 --parallelism=500`
    - id: b
      text:
        en: |-
          `gcloud run jobs create transcode --image=IMAGE_URL --region=europe-west1 --tasks=500 --parallelism=50`
    - id: c
      text:
        en: |-
          `gcloud run jobs create transcode --image=IMAGE_URL --region=europe-west1 --tasks=500 --max-retries=50`
    - id: d
      text:
        en: |-
          `gcloud run deploy transcode --image=IMAGE_URL --region=europe-west1 --max-instances=50`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `--tasks` sets the number of tasks in each execution of the job, one per file here, and `--parallelism` sets the maximum number of tasks that run at the same time. Each task receives its own index, which the container uses to choose its file.
  options:
    a:
      en: |-
        This creates only 50 tasks, so 450 files would not be processed, and the parallelism must be less than or equal to the number of tasks.
    c:
      en: |-
        `--max-retries` sets how many times a failed task is retried; it doesn't cap the number of tasks that run at the same time.
    d:
      en: |-
        `gcloud run deploy` creates a service that waits for requests; it doesn't run a set of tasks to completion.
references:
  - title: "Create jobs | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/create-jobs
