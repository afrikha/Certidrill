id: gcpace-2a-vmm-patch-job-labels
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company has set up VM Manager in its project. A critical OpenSSL fix has been published, and the security team wants it applied now to every VM that carries the label env=prod. The production VMs have varied names, and the project also contains test VMs that must not be patched today.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`gcloud compute os-config patch-jobs execute --instance-filter-all`" }
    - id: b
      text: { en: "`gcloud compute os-config patch-jobs execute --instance-filter-group-labels=env=prod`" }
    - id: c
      text: { en: "`gcloud compute os-config patch-jobs execute --instance-filter-name-prefixes=prod-`" }
    - id: d
      text: { en: "`gcloud compute os-config patch-deployments create prod-patch --file=prod-patch.yaml`" }
answer: { optionId: b }
explanation:
  correct:
    en: "`patch-jobs execute` starts an on-demand patch job, and `--instance-filter-group-labels` targets the VMs that carry the given label combination, here env=prod. The filter is resolved when the job starts, so it covers every production VM whatever its name."
  options:
    a: { en: "This targets every VM in the project, including the test VMs that must not be patched today." }
    c: { en: "A name prefix filter relies on VM names, which vary for the production VMs, so some would be missed or test VMs included." }
    d: { en: "A patch deployment schedules patch jobs for later; it does not apply the fix right now." }
references:
  - title: "Create patch jobs | VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/os-patch-management/create-patch-job
