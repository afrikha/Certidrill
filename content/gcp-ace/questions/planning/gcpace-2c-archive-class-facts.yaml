id: gcpace-2c-archive-class-facts
objective: "2.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A legal firm must keep signed contracts for 10 years. It plans to store them in a regional Cloud Storage bucket whose default storage class is Archive, because a contract is read less than once a year, typically during an audit.

    Which two statements about this design are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          An auditor can download a contract directly, with low latency, without first restoring the object to another class.
    - id: b
      text:
        en: |-
          Reading a contract is free because Archive objects have no retrieval fee.
    - id: c
      text:
        en: |-
          A contract must be restored to the Standard class before anyone can download it.
    - id: d
      text:
        en: |-
          A contract deleted three months after upload is charged as if it had been stored for 365 days.
    - id: e
      text:
        en: |-
          Archive can't be used in a regional bucket, so the firm must create a multi-region bucket.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      All Cloud Storage classes, including Archive, serve objects with low latency and no offline data retrieval, so objects are read directly. Archive has a 365-day minimum storage duration: an object deleted, replaced or moved earlier is billed as if it had been stored for the full 365 days.
  options:
    b:
      en: |-
        Archive has the highest retrieval fee of all classes; only Standard has no retrieval fee.
    c:
      en: |-
        Cloud Storage has no restore operation for colder classes; objects are always readable directly.
    e:
      en: |-
        Archive is available in regions as well as dual-regions and multi-regions, each with its own availability SLA.
references:
  - title: "Storage classes | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/storage-classes
  - title: "Storage pricing | Google Cloud"
    url: https://cloud.google.com/storage/pricing
