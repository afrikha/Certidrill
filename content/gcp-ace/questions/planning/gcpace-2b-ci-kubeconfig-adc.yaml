id: gcpace-2b-ci-kubeconfig-adc
objective: "2.1.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |-
    A build pipeline runs on a Compute Engine VM whose attached service account has access to a GKE cluster. Each run must write the cluster's kubeconfig entry to /build/kubeconfig instead of the default kubeconfig file, and kubectl must authenticate with the application default credentials of the VM.

    Which two actions should the pipeline perform before it runs `gcloud container clusters get-credentials`? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run `gcloud auth application-default login` on the VM.
    - id: b
      text:
        en: |-
          Set the KUBECONFIG environment variable to /build/kubeconfig.
    - id: c
      text:
        en: |-
          Add the `--internal-ip` flag to the `get-credentials` command.
    - id: d
      text:
        en: |-
          Run `gcloud config set container/use_application_default_credentials true`.
    - id: e
      text:
        en: |-
          Run `kubectl config set-context --current --namespace=build`.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      `get-credentials` writes to the file named in the KUBECONFIG environment variable instead of $HOME/.kube/config. Setting the container/use_application_default_credentials property to true before running it makes the kubeconfig entry authenticate with application default credentials, which on this VM come from the attached service account.
  options:
    a:
      en: |-
        `application-default login` is an interactive flow that stores a user's credentials as application default credentials; the pipeline must use the VM's attached service account instead.
    c:
      en: |-
        `--internal-ip` changes only the endpoint address in the kubeconfig entry, not the file location or the authentication method.
    e:
      en: |-
        A default namespace changes neither the kubeconfig file location nor the credentials that kubectl uses.
references:
  - title: "gcloud container clusters get-credentials | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/container/clusters/get-credentials
