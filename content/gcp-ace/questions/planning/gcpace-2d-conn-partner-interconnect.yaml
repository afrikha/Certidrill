id: gcpace-2d-conn-partner-interconnect
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A regional bank needs a private 5 Gbps connection between its data center and a VPC network. The traffic must not cross the public internet. The data center is not in a colocation facility where Google's network is present, and the bank does not want to install routers in such a facility.

    Which option should you choose?
body:
  options:
    - { id: a, text: { en: "Partner Interconnect, with a 5 Gbps VLAN attachment ordered through a supported service provider" } }
    - { id: b, text: { en: "Dedicated Interconnect, with one 10 Gbps connection ordered in the nearest colocation facility" } }
    - { id: c, text: { en: "HA VPN, with two tunnels between an HA VPN gateway and the data center firewalls" } }
    - { id: d, text: { en: "Cross-Cloud Interconnect, with a 10 Gbps connection to the data center network" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Partner Interconnect connects an on-premises network to Google through a supported service provider, so the bank does not need equipment in a colocation facility. Each VLAN attachment supports from 50 Mbps to 50 Gbps, depending on what the provider offers, which covers 5 Gbps.
  options:
    b: { en: "Dedicated Interconnect requires the bank's network to meet Google's network in a colocation facility with its own routing equipment." }
    c: { en: "HA VPN encrypts traffic but sends it over the public internet, which the requirement forbids." }
    d: { en: "Cross-Cloud Interconnect connects Google Cloud to another cloud provider's network, not to an on-premises data center." }
references:
  - title: "Cloud Interconnect overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/overview
  - title: "Dedicated Interconnect overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/dedicated-overview
