id: gcpace-2a-oslogin-sa-user-roles
objective: "2.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A retail bank uses OS Login in the project branch-apps, whose VMs run as the attached service account app-sa. The VMs are reached over Cloud VPN, so no IAP tunnel is used. The support-team group must be able to SSH into the VMs as standard users, without sudo, and must receive only the permissions this requires.

    Which two roles should you grant to the support-team group? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Compute OS Admin Login (`roles/compute.osAdminLogin`) on the branch-apps project" }
    - id: b
      text: { en: "Compute OS Login (`roles/compute.osLogin`) on the branch-apps project" }
    - id: c
      text: { en: "Compute Instance Admin (v1) (`roles/compute.instanceAdmin.v1`) on the branch-apps project" }
    - id: d
      text: { en: "Service Account Token Creator (`roles/iam.serviceAccountTokenCreator`) on app-sa" }
    - id: e
      text: { en: "Service Account User (`roles/iam.serviceAccountUser`) on app-sa" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: OS Login users need `roles/compute.osLogin` for a standard login, granted on the project so that gcloud and the console can also look up the project. When the VM has an attached service account, users also need `roles/iam.serviceAccountUser` on that service account to connect.
  options:
    a: { en: "The admin login role adds sudo permissions, which the group must not have." }
    c: { en: "Instance Admin lets the group create, modify, and delete instances, which is far more than SSH access needs." }
    d: { en: "Token Creator lets the group create tokens to impersonate the service account, which is not what OS Login checks and is more than needed." }
references:
  - title: "Set up OS Login | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin
