id: gcpace-2d-nst-standard-supported
objective: "2.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to reduce internet data transfer costs by using Standard Tier wherever it is supported in a project. The project contains VMs with external IP addresses, a Cloud NAT gateway, an HA VPN gateway, a global external proxy Network Load Balancer, and a backend service with Cloud CDN enabled.

    Which two resources can use Standard Tier? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The HA VPN gateway" } }
    - { id: b, text: { en: "The ephemeral external IPv4 addresses of the VMs" } }
    - { id: c, text: { en: "The global external proxy Network Load Balancer" } }
    - { id: d, text: { en: "The external IP addresses of the Cloud NAT gateway" } }
    - { id: e, text: { en: "The backend service with Cloud CDN enabled" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Standard Tier works with resources that use regional external IP addresses: VM external IP addresses, Cloud NAT, regional external load balancers, and classic load balancers in regional mode. VMs and Cloud NAT can therefore move to Standard Tier.
  options:
    a: { en: "Cloud VPN gateways support only Premium Tier." }
    c: { en: "Global external proxy Network Load Balancers require a global external IP address, which exists only in Premium Tier." }
    e: { en: "Cloud CDN always uses Premium Tier; Standard Tier cannot be used with it." }
references:
  - title: "Network Service Tiers overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-tiers/docs/overview
