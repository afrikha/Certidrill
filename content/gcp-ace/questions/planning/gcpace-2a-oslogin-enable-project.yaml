id: gcpace-2a-oslogin-enable-project
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A consulting firm wants SSH access to all Linux VMs in its project analytics-prod to be controlled through IAM, using OS Login, instead of SSH keys stored in metadata. The rule must also apply to VMs created later. No organization policy is in place.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run `gcloud compute project-info add-metadata --metadata=enable-oslogin=TRUE --project=analytics-prod`." }
    - id: b
      text: { en: "Run `gcloud services enable oslogin.googleapis.com --project=analytics-prod`, and make no other change." }
    - id: c
      text: { en: "Run `gcloud compute instances add-metadata VM_NAME --metadata=enable-oslogin=TRUE` for each existing VM." }
    - id: d
      text: { en: "Ask every engineer to run `gcloud compute os-login ssh-keys add` to publish a key to their OS Login profile." }
answer: { optionId: a }
explanation:
  correct:
    en: Setting the enable-oslogin metadata key to TRUE in project metadata turns on OS Login for every VM in the project, including VMs created later. The VMs then stop accepting SSH keys from metadata, and access is granted with the OS Login IAM roles.
  options:
    b: { en: "Enabling an API does not change how VMs accept SSH connections; OS Login is turned on through the enable-oslogin metadata key." }
    c: { en: "Instance metadata covers only the existing VMs; VMs created later would not have OS Login enabled." }
    d: { en: "Keys in an OS Login profile are used only on VMs where OS Login is enabled, which this does not do." }
references:
  - title: "Set up OS Login | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin
