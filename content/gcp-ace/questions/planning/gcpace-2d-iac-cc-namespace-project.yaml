id: gcpace-2d-iac-cc-namespace-project
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team runs Config Connector on a GKE cluster. Team A applies its Config Connector manifests, such as `PubSubTopic` and `StorageBucket` objects, to the Kubernetes namespace `team-a`. The manifests do not specify a project. Every resource created from this namespace must go to the project `team-a-prod` by default, without editing each manifest.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Run `kubectl annotate namespace team-a cnrm.cloud.google.com/project-id=team-a-prod`." } }
    - { id: b, text: { en: "Run `gcloud config set project team-a-prod` in the shell from which the team runs kubectl apply." } }
    - { id: c, text: { en: "Run `kubectl label namespace team-a project=team-a-prod`." } }
    - { id: d, text: { en: "Add the annotation `cnrm.cloud.google.com/project-id: team-a-prod` to the metadata of each manifest." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a resource has no scope field (such as `projectRef`) and no scope annotation of its own, Config Connector uses the `cnrm.cloud.google.com/project-id` annotation of its namespace. Annotating the `team-a` namespace sets the default project for every resource in it.
  options:
    b: { en: "Config Connector reconciles resources with its own service account and settings; the gcloud configuration of the user's shell is not read." }
    c: { en: "Config Connector reads a scope annotation, not a namespace label, to choose the project." }
    d: { en: "A resource-level annotation works and overrides the namespace default, but it means editing every manifest, which the requirement excludes." }
references:
  - title: "Organizing your resources | Config Connector | Google Cloud Documentation"
    url: https://docs.cloud.google.com/config-connector/docs/how-to/organizing-resources/overview
