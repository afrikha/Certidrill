id: gcpace-2b-autopilot-create-command
objective: "2.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A startup wants a GKE cluster named web in us-central1. Google must manage the nodes and their scaling, and the control plane must be replicated across zones of the region. You will create the cluster with the gcloud CLI.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud container clusters create-auto web --location=us-central1`
    - id: b
      text:
        en: |-
          `gcloud container clusters create web --location=us-central1 --enable-autoscaling --min-nodes=1 --max-nodes=5`
    - id: c
      text:
        en: |-
          `gcloud container clusters create web --location=us-central1 --enable-autoprovisioning --max-cpu=64 --max-memory=256`
    - id: d
      text:
        en: |-
          `gcloud container clusters create web --location=us-central1-a --num-nodes=3`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `create-auto` creates an Autopilot cluster, in which Google manages the worker nodes, including their scaling, upgrades and repairs. Autopilot clusters are always regional, so the control plane is replicated across zones of us-central1.
  options:
    b:
      en: |-
        This creates a Standard cluster with cluster autoscaling on its default node pool; the team still manages the node pools and their configuration.
    c:
      en: |-
        Node auto-provisioning lets a Standard cluster create node pools within resource limits, but the cluster remains a Standard cluster that the team operates.
    d:
      en: |-
        A zone as location creates a zonal Standard cluster with a single control plane and nodes that the team manages.
references:
  - title: "GKE Autopilot overview | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
  - title: "About cluster configuration choices | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/configuration-overview
