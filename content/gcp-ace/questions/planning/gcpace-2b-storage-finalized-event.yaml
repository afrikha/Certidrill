id: gcpace-2b-storage-finalized-event
objective: "2.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A Cloud Run function named make-thumbnail must run each time an image is uploaded to the bucket photos-raw, including when an upload overwrites an existing object. You are creating its trigger with `gcloud eventarc triggers create`.

    Which event type should the trigger filter on, together with the bucket name?
body:
  options:
    - id: a
      text:
        en: |-
          `google.cloud.storage.object.v1.metadataUpdated`
    - id: b
      text:
        en: |-
          `google.cloud.storage.object.v1.archived`
    - id: c
      text:
        en: |-
          `google.cloud.storage.object.v1.deleted`
    - id: d
      text:
        en: |-
          `google.cloud.storage.object.v1.finalized`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The finalized event is sent when a new object is created in the bucket or an existing object is overwritten, which is exactly when a thumbnail is needed. The trigger also filters on bucket=photos-raw.
  options:
    a:
      en: |-
        metadataUpdated is sent when the metadata of an existing object changes, not when an image is uploaded.
    b:
      en: |-
        archived is sent when a live object version becomes noncurrent, for example in a bucket with Object Versioning.
    c:
      en: |-
        deleted is sent when an object is deleted, not when it is uploaded.
references:
  - title: "Create triggers from Cloud Storage events | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/triggering/storage-triggers
