id: gcpace-2b-pubsub-trigger-transport
objective: "2.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    An online shop publishes orders to the existing Pub/Sub topic orders in the project shop-prod. A Cloud Run function named fulfill, in the same project, must run for each message published to that topic. You are creating an Eventarc trigger for the function.

    Which flags should the trigger use?
body:
  options:
    - id: a
      text:
        en: |-
          `--event-filters="type=google.cloud.storage.object.v1.finalized" --event-filters="bucket=orders"`
    - id: b
      text:
        en: |-
          `--event-filters="type=google.cloud.pubsub.topic.v1.messagePublished" --transport-topic=projects/shop-prod/topics/orders`
    - id: c
      text:
        en: |-
          `--event-filters="type=google.cloud.audit.log.v1.written" --event-filters="serviceName=pubsub.googleapis.com"`
    - id: d
      text:
        en: |-
          `--event-filters="type=google.cloud.pubsub.topic.v1.messagePublished" --destination-run-path=/orders`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Pub/Sub triggers use the event type google.cloud.pubsub.topic.v1.messagePublished, and `--transport-topic` attaches the trigger to an existing topic of the same project, here orders. Each message published to orders is then delivered to fulfill.
  options:
    a:
      en: |-
        The finalized event type describes Cloud Storage objects, and orders is a Pub/Sub topic, not a bucket.
    c:
      en: |-
        Audit log triggers react to logged API calls and also require a methodName filter; they don't deliver each published message to the function.
    d:
      en: |-
        Without `--transport-topic`, the trigger isn't attached to the existing orders topic; `--destination-run-path` only sets the URL path of the requests sent to the function.
references:
  - title: "Create triggers from Pub/Sub events | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/triggering/pubsub-triggers
