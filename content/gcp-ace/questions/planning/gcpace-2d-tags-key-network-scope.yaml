id: gcpace-2d-tags-key-network-scope
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company protects the VPC network `prod-vpc` in project `lg-net-prod` with a global network firewall policy. A security engineer wants to identify VMs in the policy rules with a secure tag key named `app-tier`. The key must be usable only by firewall rules for `prod-vpc`, not for the other VPC networks of the organization. The organization ID is `123456789012`.

    Which command should you run to create the tag key?
body:
  options:
    - { id: a, text: { en: "`gcloud resource-manager tags keys create app-tier --parent=organizations/123456789012 --purpose=GCE_FIREWALL --purpose-data=network=lg-net-prod/prod-vpc`" } }
    - { id: b, text: { en: "`gcloud resource-manager tags keys create app-tier --parent=organizations/123456789012 --description=\"Firewall tier for prod-vpc\"`" } }
    - { id: c, text: { en: "`gcloud resource-manager tags keys create app-tier --parent=organizations/123456789012 --purpose=GCE_FIREWALL --purpose-data=organization=auto`" } }
    - { id: d, text: { en: "`gcloud compute instances add-tags web-1 --tags=app-tier --zone=us-central1-a`" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A tag key used by Cloud NGFW rules needs the `GCE_FIREWALL` purpose and purpose data. With `network=PROJECT_ID/NETWORK`, the key applies only to network interfaces in that one VPC network. The purpose and purpose data are set at creation and cannot be changed later.
  options:
    b: { en: "Without the GCE_FIREWALL purpose and its purpose data, the key is an ordinary Resource Manager tag that firewall rules cannot use." }
    c: { en: "The purpose data organization=auto makes the key usable in every VPC network of the organization, which the requirement forbids." }
    d: { en: "This adds a network tag, which only VPC firewall rules use; network firewall policies cannot reference network tags." }
references:
  - title: "Secure tags for firewalls | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/tags-firewalls-overview
  - title: "Manage VM traffic by using secure tags | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/use-tags-for-firewalls
