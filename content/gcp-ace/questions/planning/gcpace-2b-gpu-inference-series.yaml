id: gcpace-2b-gpu-inference-series
objective: "2.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A retailer serves an image classification model to its website. The model fits in the memory of a single mid-range GPU, and the retailer wants GPU VMs designed for cost-optimized inference rather than for training foundation models.

    Which machine series should you choose?
body:
  options:
    - id: a
      text:
        en: |-
          G2, with NVIDIA L4 GPUs
    - id: b
      text:
        en: |-
          A3 Mega, with NVIDIA H100 GPUs
    - id: c
      text:
        en: |-
          A4, with NVIDIA B200 GPUs
    - id: d
      text:
        en: |-
          M3, memory-optimized
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Google positions the G2 series, with NVIDIA L4 GPUs, for cost-optimized inference as well as graphics-intensive and HPC workloads, which fits serving a model that runs on one mid-range GPU.
  options:
    b:
      en: |-
        A3 Mega targets large-scale training and serving, far more capacity than this model needs.
    c:
      en: |-
        A4 targets foundation model training and serving.
    d:
      en: |-
        M3 is a memory-optimized series without GPUs.
references:
  - title: "GPU machine types | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/gpus
