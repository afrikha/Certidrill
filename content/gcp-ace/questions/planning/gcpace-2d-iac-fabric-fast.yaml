id: gcpace-2d-iac-fabric-fast
objective: "2.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company with a new Google Cloud organization wants to build its landing zone (resource hierarchy, an IaC automation project, organization policies, log sinks, networking, and security) with Terraform, from a Google-maintained reference design instead of writing everything itself. The architect proposes Fabric FAST.

    Which two statements about Fabric FAST are true? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "FAST is a managed console service in which development teams deploy application templates from a shared catalog." } }
    - { id: b, text: { en: "FAST is a Terraform reference implementation of an organization design, split into stages whose outputs feed later stages." } }
    - { id: c, text: { en: "FAST stages are Kubernetes custom resources that a controller in a GKE cluster reconciles against Google Cloud." } }
    - { id: d, text: { en: "The first stage is applied once with an organization administrator's credentials; later runs impersonate service accounts it creates." } }
    - { id: e, text: { en: "FAST stages are written as Deployment Manager templates and deployed with gcloud deployment-manager deployments create." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Fabric FAST, part of Google's Cloud Foundation Fabric repository, provides an enterprise organization design and its Terraform implementation, organized as stages that act as contracts: each one produces outputs used by the next. The first organization setup stage is applied with user credentials that have organization and billing admin access; it creates the IaC project, state buckets, and service accounts, and later runs use impersonated service account credentials.
  options:
    a: { en: "This describes Application Design Center, which works at the application level, not the organization landing zone." }
    c: { en: "This describes Config Connector; FAST stages are Terraform root modules." }
    e: { en: "FAST uses Terraform, and Deployment Manager reached its end of support on March 31, 2026." }
references:
  - title: Fabric FAST
    url: https://github.com/GoogleCloudPlatform/cloud-foundation-fabric/blob/master/fast/README.md
