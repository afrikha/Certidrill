id: gcpace-2b-storage-agent-publisher
objective: "2.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    In a new project, a developer is about to create an Eventarc trigger that routes direct Cloud Storage events from the bucket invoices-in to the Cloud Run service parser, in the bucket's region. The trigger will use a dedicated service account that already has the Eventarc Event Receiver role and the Cloud Run Invoker role on parser. The Cloud Storage service agent of the project hasn't been granted any role.

    What else should you do before you create the trigger?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Eventarc Event Receiver role on the project to the Cloud Storage service agent.
    - id: b
      text:
        en: |-
          Grant the Cloud Run Invoker role on the parser service to allUsers.
    - id: c
      text:
        en: |-
          Grant the Pub/Sub Publisher role on the project to the Cloud Storage service agent.
    - id: d
      text:
        en: |-
          Enable the Data Access audit logs of Cloud Storage in the project.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For direct Cloud Storage events, the Cloud Storage service agent publishes the event notifications to a Pub/Sub topic, so it needs the Pub/Sub Publisher role (roles/pubsub.publisher) on the project. The trigger's service account already has the roles it needs to receive events and invoke parser.
  options:
    a:
      en: |-
        Eventarc Event Receiver is needed by the trigger's service account, which already has it; it doesn't let the Cloud Storage service agent publish messages.
    b:
      en: |-
        Granting the Invoker role to allUsers makes parser public and doesn't let the Cloud Storage service agent publish to Pub/Sub.
    d:
      en: |-
        Direct Cloud Storage events don't come from Cloud Audit Logs, so Data Access audit logs play no part in this trigger.
references:
  - title: "Roles and permissions for Cloud Run targets | Eventarc Standard | Google Cloud Documentation"
    url: https://docs.cloud.google.com/eventarc/docs/roles-permissions
  - title: "Route Cloud Storage events to Cloud Run | Eventarc Standard | Google Cloud Documentation"
    url: https://docs.cloud.google.com/eventarc/standard/docs/run/route-trigger-cloud-storage
