id: gcpace-2a-vmm-zone-by-zone-rollout
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An airline runs its booking back end on VMs spread across three zones, and every VM is managed by VM Manager. You must patch all VMs in the project in one patch job. To limit risk, only one zone may be patched at a time, and no more than two VMs in that zone may be patched at the same time.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`gcloud compute os-config patch-jobs execute --instance-filter-all --rollout-mode=concurrent-zones --rollout-disruption-budget=2`" }
    - id: b
      text: { en: "`gcloud compute os-config patch-jobs execute --instance-filter-all --rollout-mode=zone-by-zone --rollout-disruption-budget=2`" }
    - id: c
      text: { en: "`gcloud compute os-config patch-jobs execute --instance-filter-all --rollout-mode=zone-by-zone --rollout-disruption-budget-percent=2`" }
    - id: d
      text: { en: "`gcloud compute os-config patch-jobs execute --instance-filter-all --reboot-config=never --duration=2h`" }
answer: { optionId: b }
explanation:
  correct:
    en: With `--rollout-mode=zone-by-zone`, the patch job patches one zone at a time. `--rollout-disruption-budget` sets the number of VMs per zone that can be disrupted at once, so a value of 2 limits each zone to two VMs being patched at the same time.
  options:
    a: { en: "concurrent-zones patches the VMs of all zones at the same time, which breaks the one-zone-at-a-time rule." }
    c: { en: "The percent flag sets a percentage of the VMs in a zone, so 2 means 2 percent, not two VMs." }
    d: { en: "These flags control reboots and the job's time limit; they do not limit how many zones or VMs are patched at once." }
references:
  - title: "Create patch jobs | VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/os-patch-management/create-patch-job
