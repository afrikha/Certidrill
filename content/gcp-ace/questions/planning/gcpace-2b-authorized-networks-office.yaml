id: gcpace-2b-authorized-networks-office
objective: "2.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A retailer is creating a GKE Standard cluster. Administrators run kubectl from the office, whose public range is 203.0.113.0/24 and which has no VPN or Interconnect connection to Google Cloud. The external control plane endpoint must accept connections only from this range.

    Which flags should you add to `gcloud container clusters create`?
body:
  options:
    - id: a
      text:
        en: |-
          `--enable-private-endpoint`
    - id: b
      text:
        en: |-
          `--enable-master-authorized-networks --master-authorized-networks=203.0.113.0/24`
    - id: c
      text:
        en: |-
          `--enable-private-nodes`
    - id: d
      text:
        en: |-
          `--no-enable-ip-access`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Authorized networks restrict access to the external control plane endpoint to the CIDR ranges that you list. `--enable-master-authorized-networks` turns on the restriction, and `--master-authorized-networks` lists the office range 203.0.113.0/24.
  options:
    a:
      en: |-
        `--enable-private-endpoint` turns off access through the external endpoint, so the office, which has no VPN or Interconnect, couldn't reach the control plane at all.
    c:
      en: |-
        Private nodes remove the nodes' external IP addresses; they don't restrict who can reach the control plane endpoint.
    d:
      en: |-
        `--no-enable-ip-access` disables both the internal and external IP-based endpoints, so the office couldn't use the external endpoint.
references:
  - title: "Customize your network isolation in GKE | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/latest/network-isolation
