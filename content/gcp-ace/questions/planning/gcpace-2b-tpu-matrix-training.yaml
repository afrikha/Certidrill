id: gcpace-2b-tpu-matrix-training
objective: "2.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A research team trains a large language model with JAX. The model is dominated by matrix multiplications, uses large batch sizes, has no custom operations in its main training loop, and each training run lasts several weeks.

    Which hardware should the team choose for training?
body:
  options:
    - id: a
      text:
        en: |-
          Compute-optimized C3 VMs without accelerators
    - id: b
      text:
        en: |-
          Cloud TPU
    - id: c
      text:
        en: |-
          G2 VMs with NVIDIA L4 GPUs
    - id: d
      text:
        en: |-
          N1 VMs with attached NVIDIA T4 GPUs
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Google recommends Cloud TPUs for models dominated by matrix computations, with no custom operations in the main training loop, that train for weeks or months, and for large models with large effective batch sizes. This workload meets every one of these criteria.
  options:
    a:
      en: |-
        CPUs suit quick prototyping and simple models that train quickly, not weeks-long training of a large model.
    c:
      en: |-
        Google positions G2 VMs with L4 GPUs for cost-optimized inference and graphics-intensive workloads rather than weeks-long training of a large model.
    d:
      en: |-
        N1 VMs with T4 GPUs target inference, smaller training jobs and visualization, and the T4 is approaching end of support.
references:
  - title: "Introduction to Cloud TPU | Google Cloud Documentation"
    url: https://docs.cloud.google.com/tpu/docs/intro-to-tpu
  - title: "GPU machine types | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/gpus
