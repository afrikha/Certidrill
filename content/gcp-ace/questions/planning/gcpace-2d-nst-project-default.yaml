id: gcpace-2d-nst-project-default
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs non-critical batch jobs in the project `media-batch`. It wants every new eligible resource in the project that is created without an explicit network tier, such as VM external IP addresses and regional forwarding rules, to use Standard Tier.

    Which command should you run?
body:
  options:
    - { id: a, text: { en: "`gcloud compute addresses create batch-ip --region=us-east1 --network-tier=STANDARD --project=media-batch`" } }
    - { id: b, text: { en: "`gcloud compute project-info add-metadata --metadata=network-tier=STANDARD --project=media-batch`" } }
    - { id: c, text: { en: "`gcloud compute instances create batch-1 --zone=us-east1-b --network-tier=STANDARD --project=media-batch`" } }
    - { id: d, text: { en: "`gcloud compute project-info update --default-network-tier=STANDARD --project=media-batch`" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `gcloud compute project-info update --default-network-tier` sets the project-level default tier, which newly created eligible resources use when no tier is specified. A tier set explicitly on a resource still takes precedence, and existing resources keep their tier.
  options:
    a: { en: "This reserves one Standard Tier address; it does not change the default for the other resources of the project." }
    b: { en: "Project metadata is passed to VMs; a network-tier metadata key does not change the project's default network tier." }
    c: { en: "This sets Standard Tier for one VM only; other new resources still use the project default." }
references:
  - title: "Quickstart: Set the network tier | Network Service Tiers | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-tiers/docs/set-network-tier
