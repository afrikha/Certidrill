id: gcpace-2a-oslogin-sudo-admin-role
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A hosting company uses OS Login on all its Linux VMs. The database administrators have the Compute OS Login role (`roles/compute.osLogin`) on the project and can connect over SSH, but every sudo command they run is refused. The administrators must be able to run commands as root on these VMs.

    Which role should you grant them instead?
body:
  options:
    - id: a
      text: { en: "Compute Instance Admin (v1) (`roles/compute.instanceAdmin.v1`)" }
    - id: b
      text: { en: "Service Account User (`roles/iam.serviceAccountUser`)" }
    - id: c
      text: { en: "Compute OS Admin Login (`roles/compute.osAdminLogin`)" }
    - id: d
      text: { en: "Compute OS Login External User (`roles/compute.osLoginExternalUser`)" }
answer: { optionId: c }
explanation:
  correct:
    en: With OS Login, `roles/compute.osLogin` gives a standard user login, while `roles/compute.osAdminLogin` gives a login with administrator (sudo) permissions on the VM.
  options:
    a: { en: "This role manages Compute Engine instances through the API; it does not give root access inside the guest through OS Login." }
    b: { en: "This role is needed on the VM's attached service account to connect, but it does not grant sudo permissions." }
    d: { en: "This role lets users from another organization use OS Login; it does not add administrator permissions." }
references:
  - title: "Set up OS Login | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin
