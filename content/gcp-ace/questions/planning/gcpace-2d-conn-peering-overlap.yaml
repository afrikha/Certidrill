id: gcpace-2d-conn-peering-overlap
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company wants to peer `sales-vpc`, which has a subnet `10.20.0.0/16`, with `crm-vpc`, which has a subnet `10.20.128.0/24`. The peering cannot be created because of the subnet ranges. The `crm-vpc` subnet hosts five test VMs that can be recreated, and both teams want to use VPC Network Peering.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Expand the crm-vpc subnet to 10.20.0.0/16, and then create the peering configuration in both networks." } }
    - { id: b, text: { en: "Create the peering configuration in both networks with --stack-type=IPV4_IPV6 so that the networks exchange IPv6 routes." } }
    - { id: c, text: { en: "Create the peering configuration in both networks with --export-custom-routes and --import-custom-routes." } }
    - { id: d, text: { en: "Recreate the crm-vpc subnet and its VMs with a range such as 10.30.0.0/24, and then create the peering in both networks." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      No subnet range in one network can match, contain, or fit within a subnet range of the peered network, and Google Cloud checks this when the peering is created. `10.20.128.0/24` fits within `10.20.0.0/16`, so the `crm-vpc` subnet must move to a range that does not overlap before both sides create their peering configuration.
  options:
    a: { en: "A range that exactly matches a range of the peered network is also forbidden, so the peering would still fail." }
    b: { en: "Adding IPv6 exchange does not change the IPv4 subnet ranges, which still overlap." }
    c: { en: "Subnet routes are always exchanged whatever the custom route flags, so the overlap check still fails." }
references:
  - title: "VPC Network Peering | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/vpc-peering
