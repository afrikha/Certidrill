id: gcpace-2b-autopilot-traits
objective: "2.1.9"
type: multi
difficulty: 1
status: draft
stem:
  en: |-
    A finance team is comparing GKE modes for a new set of microservices. Before choosing Autopilot, the team wants to understand how an Autopilot cluster created with the default settings is operated and billed.

    Which two statements are true for such a cluster? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The cluster is zonal unless you choose a region, which is required for a replicated control plane.
    - id: b
      text:
        en: |-
          A flat cluster management fee is charged for the cluster per hour, as for GKE Standard clusters.
    - id: c
      text:
        en: |-
          You choose the machine type of the cluster's nodes when you create the cluster.
    - id: d
      text:
        en: |-
          You must create at least one node pool before you can deploy the first workload.
    - id: e
      text:
        en: |-
          Google manages the worker nodes, including their scaling, upgrades and repairs.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      The flat cluster management fee applies to every GKE cluster, whatever its mode; the free tier credit can offset it for one Autopilot or zonal Standard cluster per billing account. Google manages the worker nodes, so you don't create nodes for your workloads, and GKE handles their scaling, upgrades and repairs.
  options:
    a:
      en: |-
        Autopilot clusters are always regional, with control plane replicas in several zones of the region.
    c:
      en: |-
        With Autopilot, GKE provisions and configures the nodes from the requirements of the workloads; you don't pick a node machine type when you create the cluster.
    d:
      en: |-
        Autopilot provisions nodes for the workloads that you deploy; you don't create node pools first.
references:
  - title: "GKE Autopilot overview | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
  - title: "Google Kubernetes Engine pricing | Google Cloud"
    url: https://cloud.google.com/kubernetes-engine/pricing
