id: gcpace-2c-sts-from-amazon-s3
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company is moving its analytics from AWS to Google Cloud. It must copy 40 TB from an Amazon S3 bucket to Cloud Storage now, then copy the new objects every day for three months until the cutover. The team wants a managed service and doesn't want to run or patch any VM for the transfer.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Order a Transfer Appliance, copy the S3 data to it, and ship it to Google.
    - id: b
      text:
        en: |-
          Run `gcloud storage rsync` from the S3 bucket to Cloud Storage in a daily cron job on a Compute Engine VM.
    - id: c
      text:
        en: |-
          Create a Storage Transfer Service job with the S3 bucket as its source and a daily schedule.
    - id: d
      text:
        en: |-
          Install Storage Transfer Service agents on Amazon EC2 instances, and create a transfer job that uses their agent pool.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Storage Transfer Service is the recommended service for moving data from Amazon S3 to Cloud Storage. Transfers from Amazon S3 are agentless and fully managed, and a job can run on a schedule (for example with `--schedule-repeats-every`) so that each run copies the new or changed objects.
  options:
    a:
      en: |-
        Transfer Appliance is a physical device for on-premises data with poor connectivity; it doesn't apply to data that already sits in another cloud.
    b:
      en: |-
        A cron job on a VM works, but it is a VM to run, patch and monitor, which the team wants to avoid.
    d:
      en: |-
        Transfers from Amazon S3 don't require agents or agent pools; agents are needed only for file systems and S3-compatible storage.
references:
  - title: "Create transfers | Storage Transfer Service | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage-transfer/docs/create-transfers
  - title: "Data transfer options | Storage Transfer Service | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage-transfer/docs/transfer-options
