id: gcpace-2b-current-context-switch
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    An operator had configured kubectl for the zonal cluster prod in europe-west4-a. To check an issue, the operator then ran `gcloud container clusters get-credentials staging --location=europe-west4`. Later, a `kubectl apply -f` command intended for prod was applied to staging. The operator wants kubectl commands without extra flags to target prod again.

    What should the operator do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud config set container/cluster prod`.
    - id: b
      text:
        en: |-
          Run `gcloud container clusters get-credentials prod --location=europe-west4-a`.
    - id: c
      text:
        en: |-
          Run `kubectl config view` and confirm that the prod entry still exists.
    - id: d
      text:
        en: |-
          Run `kubectl config set-cluster prod`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Running `get-credentials` for a cluster refreshes its kubeconfig entry and also makes it the current context, which is the default target of kubectl. The earlier run for staging is what switched kubectl to staging; running it again for prod switches kubectl back.
  options:
    a:
      en: |-
        container/cluster is a gcloud property that sets the default cluster of gcloud commands for GKE; it doesn't change kubectl's current context.
    c:
      en: |-
        `kubectl config view` only displays the kubeconfig content; it doesn't change which cluster kubectl targets.
    d:
      en: |-
        `kubectl config set-cluster` creates or edits a cluster entry in the kubeconfig file; it doesn't change the current context.
references:
  - title: "Install kubectl and configure cluster access | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl
