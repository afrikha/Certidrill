id: gcpace-2a-vm-restart-on-failure
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company runs a scheduler on a VM named batch-ctl in the asia-south1-b zone. The VM was created with the `--no-restart-on-failure` flag. Last week its host had a hardware failure, and the VM stayed in the TERMINATED state until an operator started it the next morning. You need Compute Engine to bring the VM back by itself after such failures.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run `gcloud compute instances set-scheduling batch-ctl --zone=asia-south1-b --maintenance-policy=MIGRATE`." }
    - id: b
      text: { en: "Run `gcloud compute instances set-scheduling batch-ctl --zone=asia-south1-b --host-error-timeout-seconds=330`." }
    - id: c
      text: { en: "Run `gcloud compute instances update batch-ctl --zone=asia-south1-b --deletion-protection`." }
    - id: d
      text: { en: "Run `gcloud compute instances set-scheduling batch-ctl --zone=asia-south1-b --restart-on-failure`." }
answer: { optionId: d }
explanation:
  correct:
    en: Automatic restart makes Compute Engine restart a VM that it terminated, for example after a host error, on a healthy host in the zone. It is on by default, and `set-scheduling --restart-on-failure` turns it back on for this VM.
  options:
    a: { en: "Live migration moves a running VM during planned maintenance; it cannot save a VM whose host crashes, and without automatic restart the VM still stays terminated." }
    b: { en: "A longer host error timeout only delays the decision about an unresponsive VM; with automatic restart off, the VM is still not restarted." }
    c: { en: "Deletion protection prevents the VM from being deleted; it has no effect on whether the VM restarts after a failure." }
references:
  - title: "About host events | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/host-maintenance-overview
  - title: "Set the host maintenance policy for a compute instance | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/setting-vm-host-options
