id: gcpace-2c-autoclass-bucket-create
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A news publisher stores photos in Cloud Storage. Access patterns are unpredictable: some photos stay popular for years, and others are never viewed again after the first week. You must create the bucket `gs://northpeak-photos` in `us-central1` so that Cloud Storage moves each object to a colder class when it isn't read and back to Standard when it is read again, without retrieval or early deletion fees and without rules to maintain.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud storage buckets create gs://northpeak-photos --location=us-central1 --default-storage-class=NEARLINE`
    - id: b
      text:
        en: |-
          `gcloud storage buckets create gs://northpeak-photos --location=us-central1 --enable-autoclass`
    - id: c
      text:
        en: |-
          `gcloud storage buckets create gs://northpeak-photos --location=us-central1 --lifecycle-file=age-rules.json`
    - id: d
      text:
        en: |-
          `gcloud storage buckets create gs://northpeak-photos --location=us-central1 --default-storage-class=COLDLINE`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Autoclass transitions each object based on its access: an object not read for 30 days moves to Nearline (and to colder classes if the terminal class is Archive), and reading it moves it back to Standard. Autoclass buckets aren't charged retrieval or early deletion fees; a management fee applies instead.
  options:
    a:
      en: |-
        A Nearline default class stores every new photo in Nearline, with retrieval fees on popular photos and no automatic move back to Standard.
    c:
      en: |-
        Lifecycle rules change classes by age or other conditions, not by whether an object is read, they never move objects back to Standard, and the rules must be maintained.
    d:
      en: |-
        A Coldline default class stores every new photo in Coldline, so frequently viewed photos would incur retrieval fees and 90-day minimum durations.
references:
  - title: "Autoclass | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/autoclass
  - title: "gcloud storage buckets create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/buckets/create
