id: gcpace-2c-custom-vpc-single-subnet
objective: "2.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are creating the VPC network `prod-vpc` for a new project. The network must contain only one subnet, `web-eu`, with the range `10.10.0.0/24` in `europe-west1`. No subnet may be created in any other region, now or when Google adds new regions.

    Which two commands should you run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute networks create prod-vpc --subnet-mode=auto`
    - id: b
      text:
        en: |-
          `gcloud compute networks subnets create web-eu --network=prod-vpc --region=europe-west1 --range=10.10.0.0/24`
    - id: c
      text:
        en: |-
          `gcloud compute networks create prod-vpc --subnet-mode=legacy --range=10.10.0.0/24`
    - id: d
      text:
        en: |-
          `gcloud compute routes create web-eu --network=prod-vpc --destination-range=10.10.0.0/24 --next-hop-gateway=default-internet-gateway`
    - id: e
      text:
        en: |-
          `gcloud compute networks create prod-vpc --subnet-mode=custom`
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A custom mode network starts with no subnets, so you control exactly which subnets exist. You then create the regional subnet with `gcloud compute networks subnets create`, giving the network, the region and the primary IPv4 range.
  options:
    a:
      en: |-
        An auto mode network automatically creates one subnet in every region, and adds subnets when new regions become available.
    c:
      en: |-
        The legacy mode is deprecated and creates a network that has a single range and can't have subnets.
    d:
      en: |-
        A route only tells the network where to send traffic for a destination; it doesn't create a subnet with that range.
references:
  - title: "Quickstart: Create and manage VPC networks | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/create-modify-vpc-networks
  - title: "Subnets | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/subnets
