id: gcpace-2d-tags-target-sa-egress
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company runs batch VMs as the service account `batch-sa@hc-prod.iam.gserviceaccount.com` in the VPC network `hc-vpc`, which uses the global network firewall policy `fw-hc`. Other VMs in the network use different service accounts. Security requires that the batch VMs cannot send any traffic to a partner range, `203.0.113.0/24`. The other VMs must keep their access to that range.

    Which command should you run?
body:
  options:
    - { id: a, text: { en: "`gcloud compute network-firewall-policies rules create 900 --firewall-policy=fw-hc --global-firewall-policy --direction=INGRESS --action=deny --src-ip-ranges=203.0.113.0/24 --target-service-accounts=batch-sa@hc-prod.iam.gserviceaccount.com --layer4-configs=all`" } }
    - { id: b, text: { en: "`gcloud compute network-firewall-policies rules create 900 --firewall-policy=fw-hc --global-firewall-policy --direction=EGRESS --action=deny --dest-ip-ranges=203.0.113.0/24 --layer4-configs=all`" } }
    - { id: c, text: { en: "`gcloud compute network-firewall-policies rules create 900 --firewall-policy=fw-hc --global-firewall-policy --direction=EGRESS --action=deny --dest-ip-ranges=203.0.113.0/24 --target-service-accounts=batch-sa@hc-prod.iam.gserviceaccount.com --layer4-configs=all`" } }
    - { id: d, text: { en: "`gcloud compute network-firewall-policies rules create 900 --firewall-policy=fw-hc --global-firewall-policy --direction=EGRESS --action=deny --dest-ip-ranges=203.0.113.0/24 --src-secure-tags=123456789012/sa/batch --layer4-configs=all`" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An egress deny rule with `--dest-ip-ranges` blocks connections that the VMs start toward the partner range. `--target-service-accounts` limits the rule to the network interfaces of VMs that run as `batch-sa`, so the other VMs keep their access.
  options:
    a: { en: "An ingress rule filters traffic coming from the partner range; it does not stop the batch VMs from opening connections to it." }
    b: { en: "Without a target, the rule applies to every VM in the network, so the other VMs also lose access to the range." }
    d: { en: "Source secure tags are allowed only in ingress rules, and the batch VMs are identified by their service account, not by a tag." }
references:
  - title: "Firewall policy rule components | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies-rule-details
