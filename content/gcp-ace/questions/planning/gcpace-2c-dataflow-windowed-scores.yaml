id: gcpace-2c-dataflow-windowed-scores
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A game studio publishes every player action as a JSON message to a Pub/Sub topic. The studio needs the total score of each player for every one-minute window, computed across all the messages of that window and written to a BigQuery table less than two minutes after the window closes. The team doesn't want to manage servers or write a custom aggregation service.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a BigQuery subscription on the topic with a single message transform that computes the score of each message.
    - id: b
      text:
        en: |-
          Create a Cloud Storage subscription on the topic, and run a `bq load` job every hour on the files it writes.
    - id: c
      text:
        en: |-
          Create a Dataflow streaming pipeline that reads from the topic, groups the events into one-minute windows and writes the totals to BigQuery.
    - id: d
      text:
        en: |-
          Create a push subscription to a Cloud Run service that inserts every message into BigQuery as it arrives.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Aggregating across messages in time windows is stream processing, which Dataflow runs as a managed, autoscaled Apache Beam pipeline. A streaming job can read from Pub/Sub, apply fixed one-minute windows, sum the scores per player and write the results to BigQuery shortly after each window closes.
  options:
    a:
      en: |-
        A BigQuery subscription writes each message to the table as it arrives, and a single message transform works on one message at a time, so neither can aggregate across a window; Pub/Sub recommends Dataflow for windowing and aggregation.
    b:
      en: |-
        An hourly load misses the two-minute deadline, and loading raw files doesn't compute the per-window totals.
    d:
      en: |-
        Inserting each message as it arrives stores raw events without computing the windowed totals, and the Cloud Run service is custom code that the team wants to avoid.
references:
  - title: "BigQuery subscriptions | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/bigquery
