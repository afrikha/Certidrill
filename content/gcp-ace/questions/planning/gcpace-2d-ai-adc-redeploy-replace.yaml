id: gcpace-2d-ai-adc-redeploy-replace
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The application `orders-app` was deployed from Application Design Center in the space `retail-space`, location `us-central1`, of the management project `mgmt-prj`. The platform team published a new revision of the template, and you already applied it to `orders-app`, which created an application revision. You must now update the resources of the existing deployment from the command line.

    Which command should you run?
body:
  options:
    - { id: a, text: { en: "`gcloud design-center spaces applications preview orders-app --space=retail-space --location=us-central1 --project=mgmt-prj`" } }
    - { id: b, text: { en: "`gcloud design-center spaces applications deploy orders-app --space=retail-space --location=us-central1 --project=mgmt-prj --create-sa`" } }
    - { id: c, text: { en: "`gcloud design-center spaces applications update orders-app --space=retail-space --location=us-central1 --project=mgmt-prj`" } }
    - { id: d, text: { en: "`gcloud design-center spaces applications deploy orders-app --space=retail-space --location=us-central1 --project=mgmt-prj --replace`" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      To update an application that is already deployed, Application Design Center requires the `--replace` flag on `gcloud design-center spaces applications deploy`. The command provisions the changes of the new application revision; any changes made to the components outside Application Design Center are not kept. Application Design Center is generally available.
  options:
    a: { en: "preview only generates the Terraform changes for review; it does not change the deployed resources." }
    b: { en: "--create-sa creates a new deployment service account; without --replace, the command does not update the existing deployment." }
    c: { en: "update changes the application definition, such as applying a template revision, which is already done; it does not deploy." }
references:
  - title: "Deploy applications | Application Design Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/application-design-center/docs/deploy-applications
