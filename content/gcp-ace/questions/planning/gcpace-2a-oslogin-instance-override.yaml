id: gcpace-2a-oslogin-instance-override
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecom company enabled OS Login by setting enable-oslogin to TRUE in project metadata; no organization policy requires OS Login. A vendor appliance VM named probe-1 in the same project does not support OS Login and must keep using the SSH key stored in its instance metadata. All other VMs must keep using OS Login.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run `gcloud compute instances add-metadata probe-1 --metadata=enable-oslogin=FALSE`." }
    - id: b
      text: { en: "Run `gcloud compute instances add-metadata probe-1 --metadata=block-project-ssh-keys=TRUE`." }
    - id: c
      text: { en: "Remove the enable-oslogin key from the project metadata, and set it to TRUE on every other VM." }
    - id: d
      text: { en: "Grant the vendor's support account the Compute OS Admin Login role on probe-1 only." }
answer: { optionId: a }
explanation:
  correct:
    en: Instance metadata takes precedence over project metadata for enable-oslogin. Setting it to FALSE on probe-1 turns OS Login off for that VM only, so it accepts its metadata SSH key, while the project setting keeps OS Login on for all other VMs.
  options:
    b: { en: "Blocking project-wide keys does not turn OS Login off, so the VM still ignores its metadata key." }
    c: { en: "This changes every other VM, and VMs created later would not get OS Login unless someone remembers to set it." }
    d: { en: "An OS Login role works only if the appliance supports OS Login, which it does not." }
references:
  - title: "Set up OS Login | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin
