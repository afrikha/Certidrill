id: gcpace-2a-vmm-no-data-causes
objective: "2.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A manufacturing company has enabled the OS Config API and set enable-osconfig to TRUE in project metadata. All VMs run a current Debian 12 public image with the OS Config agent, have no external IP address, and there is no Cloud NAT or proxy. On the console's Patch page, most VMs report data, but the VMs of one team show No data.

    Which two issues could explain why these VMs do not report to VM Manager? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The VMs were created without an attached service account." }
    - id: b
      text: { en: "The Ops Agent is not installed on the VMs." }
    - id: c
      text: { en: "OS Login is not enabled on the VMs." }
    - id: d
      text: { en: "Private Google Access is turned off on the subnet that the VMs use." }
    - id: e
      text: { en: "The enable-guest-attributes metadata key is not set on the VMs." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: VM Manager requires each VM to have an attached service account, although that account needs no IAM role. VMs without external IP addresses also need Private Google Access on their subnet to reach the OS Config API when there is no NAT or proxy.
  options:
    b: { en: "VM Manager relies on the OS Config agent, which is present; the Ops Agent is for logs and metrics." }
    c: { en: "OS Login controls SSH access and is not a VM Manager requirement." }
    e: { en: "Guest attributes are needed only for the earlier version of OS inventory, not for current agents to report." }
references:
  - title: "Set up VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/manage-os
  - title: "About Patch | VM Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/os-patch-management
