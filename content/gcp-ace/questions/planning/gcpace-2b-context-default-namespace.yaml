id: gcpace-2b-context-default-namespace
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A developer works only in the existing namespace payments of a shared GKE cluster, and the cluster's kubeconfig context is the current context. Each kubectl command currently needs `--namespace=payments`, or it acts on the default namespace. The developer wants commands without this flag to use payments.

    What should the developer run?
body:
  options:
    - id: a
      text:
        en: |-
          `kubectl create namespace payments`
    - id: b
      text:
        en: |-
          `kubectl config use-context payments`
    - id: c
      text:
        en: |-
          `kubectl config set-context --current --namespace=payments`
    - id: d
      text:
        en: |-
          `kubectl get pods --all-namespaces`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A kubeconfig context holds a cluster, a user and an optional default namespace. `kubectl config set-context --current --namespace=payments` stores payments as the namespace of the current context, so later commands without `--namespace` act on it.
  options:
    a:
      en: |-
        The namespace already exists, and creating a namespace doesn't change the namespace that kubectl uses by default.
    b:
      en: |-
        `use-context` switches to a context of that name; no context is named payments, and a namespace isn't a context.
    d:
      en: |-
        `--all-namespaces` lists Pods of every namespace for this one command; it doesn't change the default namespace.
references:
  - title: "Install kubectl and configure cluster access | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl
