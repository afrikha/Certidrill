id: gcpace-2b-cronjob-nightly-report
objective: "2.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A logistics company runs its applications on GKE. A containerized report generator must run inside the cluster every night at 01:30 UTC, process the previous day's data, and exit. The team wants Kubernetes to start each run automatically.

    Which Kubernetes object should you deploy?
body:
  options:
    - id: a
      text:
        en: |-
          A Deployment with one replica whose container sleeps until 01:30 UTC before each run
    - id: b
      text:
        en: |-
          A DaemonSet that runs the report generator on every node of the cluster
    - id: c
      text:
        en: |-
          A StatefulSet with one replica and a persistent volume for the reports
    - id: d
      text:
        en: |-
          A CronJob whose schedule field is set to "30 1 * * *"
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A CronJob automates recurring tasks such as reports: it creates a Job on a schedule written in crontab format, in UTC. The schedule "30 1 * * *" starts a run every day at 01:30 UTC, and the Pods of each run exit when the work is done.
  options:
    a:
      en: |-
        A Deployment keeps its Pod running permanently and restarts it when it exits, so the container would occupy resources all day and Kubernetes wouldn't schedule the runs.
    b:
      en: |-
        A DaemonSet runs a copy of the Pod on every node permanently, which would generate the report several times and never stop.
    c:
      en: |-
        A StatefulSet runs long-lived Pods that need stable identities and storage, not scheduled tasks that exit.
references:
  - title: "CronJobs | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cronjobs
