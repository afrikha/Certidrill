id: gcpace-2c-pubsub-bigquery-subscription
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Thousands of devices publish JSON status messages to the Pub/Sub topic `device-status`. The messages must be written as they arrive to an existing BigQuery table, and the rows must be queryable within a minute. No transformation, filtering or aggregation is needed, and the team wants the least operational overhead and no code to maintain.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a BigQuery subscription on the `device-status` topic that writes to the table.
    - id: b
      text:
        en: |-
          Run the Google-provided Pub/Sub to BigQuery Dataflow template that reads from the topic and writes to the table.
    - id: c
      text:
        en: |-
          Deploy a Cloud Run function triggered by the topic that inserts each message into the table.
    - id: d
      text:
        en: |-
          Create a Cloud Storage subscription on the topic, and load its files into the table with a nightly `bq load` job.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A BigQuery subscription is an export subscription that writes messages to an existing BigQuery table as Pub/Sub receives them, without a subscriber client or pipeline to run. Google notes that a Dataflow job isn't necessary when messages don't need additional processing.
  options:
    b:
      en: |-
        The Dataflow template works, but it adds a streaming job to run, size and monitor, which isn't the least operational overhead for messages that need no processing.
    c:
      en: |-
        A Cloud Run function is custom code to write and maintain, which the team wants to avoid.
    d:
      en: |-
        A nightly load doesn't make the rows queryable within a minute.
references:
  - title: "BigQuery subscriptions | Pub/Sub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/pubsub/docs/bigquery
  - title: "Pub/Sub to BigQuery template | Cloud Dataflow | Google Cloud Documentation"
    url: https://docs.cloud.google.com/dataflow/docs/guides/templates/provided/pubsub-to-bigquery
