id: gcpace-2d-conn-ha-vpn-two-ips
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company must connect the VPC network `mfg-vpc` in `us-east4` to its data center over the internet. The on-premises VPN appliance has two public IP addresses and supports BGP. The connection must be covered by the 99.99% availability SLA of Cloud VPN.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Create a Classic VPN gateway and two tunnels, one to each public IP address of the appliance, with static routes to the on-premises ranges." } }
    - { id: b, text: { en: "Create an HA VPN gateway, an external VPN gateway with two interfaces, a Cloud Router, and one tunnel with a BGP session from each HA VPN interface." } }
    - { id: c, text: { en: "Create an HA VPN gateway and one tunnel from interface 0 to the first public IP address, and keep the second address for manual failover." } }
    - { id: d, text: { en: "Create an HA VPN gateway and one tunnel from each interface, with static routes to the on-premises ranges and no Cloud Router." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      HA VPN reaches the 99.99% SLA when each of its two interfaces has a tunnel to the peer; with a peer that has two IP addresses, the external VPN gateway has two interfaces and each HA VPN interface connects to its matching peer interface. HA VPN supports only dynamic routing, so a Cloud Router runs a BGP session over each tunnel.
  options:
    a: { en: "Classic VPN offers a 99.9% SLA, not 99.99%, whatever the number of tunnels." }
    c: { en: "A single tunnel from one HA VPN interface does not provide enough redundancy to meet the availability SLA." }
    d: { en: "HA VPN does not support static routing; it needs BGP sessions on a Cloud Router." }
references:
  - title: "HA VPN topologies | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-connectivity/docs/vpn/concepts/topologies
  - title: "Cloud VPN overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-connectivity/docs/vpn/concepts/overview
