id: gcpace-2b-tpu-fit-criteria
objective: "2.1.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    An ML platform team reviews requests for accelerators from several projects. The team wants to approve Cloud TPU capacity only for workloads whose characteristics match Google's guidance for TPUs.

    Which two characteristics favor Cloud TPU? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Linear algebra programs that require frequent branching
    - id: b
      text:
        en: |-
          Models with ultra-large embeddings, as in advanced ranking and recommendation workloads
    - id: c
      text:
        en: |-
          Workloads that require high-precision arithmetic
    - id: d
      text:
        en: |-
          Models dominated by matrix computations with no custom operations in the main training loop
    - id: e
      text:
        en: |-
          Neural networks that contain custom operations in the main training loop
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Google recommends TPUs for models dominated by matrix computations that have no custom PyTorch or JAX operations in the main training loop, and for models with the ultra-large embeddings common in advanced ranking and recommendation workloads.
  options:
    a:
      en: |-
        Cloud TPUs aren't suited to linear algebra programs that require frequent branching or contain many element-wise operations.
    c:
      en: |-
        Cloud TPUs aren't suited to workloads that require high-precision arithmetic.
    e:
      en: |-
        Custom operations in the main training loop make a workload unsuited to Cloud TPUs.
references:
  - title: "Introduction to Cloud TPU | Google Cloud Documentation"
    url: https://docs.cloud.google.com/tpu/docs/intro-to-tpu
