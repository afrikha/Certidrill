id: gcpace-2d-iac-tf-pipeline-practices
objective: "2.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is moving its Terraform runs for production from engineers' laptops to a Cloud Build pipeline. State is stored in a Cloud Storage backend. The company wants to follow Google's best practices for Terraform operations.

    Which two practices should you adopt? Choose two.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Generate a plan first, and apply that saved plan only after an infrastructure owner approves it." } }
    - { id: b, text: { en: "Separate development and production with Terraform workspaces that share the same backend configuration." } }
    - { id: c, text: { en: "Let the pipeline use the credentials of the service account that it runs as, without downloaded service account keys." } }
    - { id: d, text: { en: "After a resource is imported into Terraform, keep making urgent changes to it in the Google Cloud console." } }
    - { id: e, text: { en: "Fix differences between the code and the infrastructure by editing the state file directly in the bucket." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Google recommends always generating a plan, having an infrastructure owner approve it, and then executing that plan. A pipeline should inherit the credentials of the service account of the service that runs it; downloaded keys are harder to manage and secure.
  options:
    b: { en: "Google recommends using only the default workspace and separate root configurations per environment; a shared backend becomes a single point of failure." }
    d: { en: "Once a resource is imported, it should be managed only with Terraform, otherwise the code and the real configuration drift apart." }
    e: { en: "Manual changes to the state can corrupt it and lead to major infrastructure problems." }
references:
  - title: "Best practices for Terraform operations | Terraform on Google Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/terraform/best-practices/operations
  - title: "Best practices for root modules | Terraform on Google Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/terraform/best-practices/root-modules
