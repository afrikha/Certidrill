id: gcpace-2a-oslogin-external-user
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An architecture firm uses OS Login on all VMs in its organization example.com. A consultant whose Google account belongs to a different organization, partner.example, must SSH into VMs in the project design-dev. You granted the consultant the Compute OS Login role on design-dev, but the consultant still cannot set up a POSIX account and connect. OS Login must stay enabled.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Grant the consultant the Compute OS Admin Login role on design-dev in place of the Compute OS Login role." }
    - id: b
      text: { en: "Grant the consultant the Compute OS Login External User role on the design-dev project." }
    - id: c
      text: { en: "Add the consultant's public key to the ssh-keys entry in the project metadata of design-dev." }
    - id: d
      text: { en: "Ask an organization administrator to grant the consultant the Compute OS Login External User role on the example.com organization." }
answer: { optionId: d }
explanation:
  correct:
    en: By default, users from outside your organization cannot use OS Login on your VMs. An organization administrator must grant `roles/compute.osLoginExternalUser` at the organization level so the external account can set its POSIX information; the consultant still needs the Compute OS Login role on the project or VMs.
  options:
    a: { en: "Admin login adds sudo permissions but does not lift the restriction on accounts from another organization." }
    b: { en: "The Compute OS Login External User role must be granted at the organization level, not on a project." }
    c: { en: "With OS Login enabled, the VMs ignore SSH keys stored in metadata." }
references:
  - title: "Manage OS Login in an organization | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/manage-oslogin-in-an-org
  - title: "Set up OS Login | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin
