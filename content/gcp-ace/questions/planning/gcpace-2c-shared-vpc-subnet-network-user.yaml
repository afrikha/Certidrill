id: gcpace-2c-shared-vpc-subnet-network-user
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Shared VPC host project `net-host` shares the subnets `app-eu` and `pci-eu` in `europe-west1`, and the service project `shop-svc` is attached to it. The group `shop-devs@example.com` already has the Compute Instance Admin (v1) role on `shop-svc`. The group must be able to create VMs in `app-eu` but not in `pci-eu`, following the principle of least privilege.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects add-iam-policy-binding net-host --member=group:shop-devs@example.com --role=roles/compute.networkUser`
    - id: b
      text:
        en: |-
          `gcloud compute networks subnets add-iam-policy-binding app-eu --region=europe-west1 --project=net-host --member=group:shop-devs@example.com --role=roles/compute.networkAdmin`
    - id: c
      text:
        en: |-
          `gcloud resource-manager folders add-iam-policy-binding 314159265358 --member=group:shop-devs@example.com --role=roles/compute.xpnAdmin`, where 314159265358 is the folder that contains both projects
    - id: d
      text:
        en: |-
          `gcloud compute networks subnets add-iam-policy-binding app-eu --region=europe-west1 --project=net-host --member=group:shop-devs@example.com --role=roles/compute.networkUser`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Service Project Admins need the Compute Network User role to use shared subnets. Granting it on one subnet of the host project, instead of on the whole project, limits the group to that subnet, so the developers can create VMs in `app-eu` but not in `pci-eu`.
  options:
    a:
      en: |-
        Network User on the host project covers every current and future subnet of the host project, including `pci-eu`.
    b:
      en: |-
        Network Admin grants permissions to manage network resources, which is far more than the group needs to place VMs in a subnet.
    c:
      en: |-
        Shared VPC Admin is for administrators who enable host projects and attach service projects; it doesn't follow least privilege for developers.
references:
  - title: "Shared VPC | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/shared-vpc
  - title: "Provision Shared VPC | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/provisioning-shared-vpc
