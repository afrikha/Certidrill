id: gcpace-2b-kubeconfig-internal-ip
objective: "2.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A GKE Standard cluster named payments in us-central1 keeps its external control plane endpoint, which accepts connections only from the office range listed in its authorized networks. Its DNS-based endpoint is not enabled. An administration VM in the cluster's subnet has no external IP address and no route to the internet. You must configure kubectl on this VM to reach the control plane.

    Which command should you run on the VM?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud container clusters get-credentials payments --location=us-central1`
    - id: b
      text:
        en: |-
          `gcloud container clusters get-credentials payments --location=us-central1 --dns-endpoint`
    - id: c
      text:
        en: |-
          `gcloud container clusters update payments --location=us-central1 --enable-private-endpoint`
    - id: d
      text:
        en: |-
          `gcloud container clusters get-credentials payments --location=us-central1 --internal-ip`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The `--internal-ip` flag writes a kubeconfig entry that uses the internal IP address of the control plane endpoint, which the VM can reach inside the VPC network. The external endpoint would need internet access from an authorized range, which the VM doesn't have.
  options:
    a:
      en: |-
        Without a flag, the kubeconfig entry points to the external endpoint, which the VM can't reach without internet access and which accepts only the office range.
    b:
      en: |-
        `--dns-endpoint` writes the DNS-based endpoint into the kubeconfig file, and that endpoint isn't enabled on this cluster.
    c:
      en: |-
        Turning off the external endpoint would cut off the office, and it doesn't write any kubeconfig entry on the VM.
references:
  - title: "Install kubectl and configure cluster access | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl
  - title: "Customize your network isolation in GKE | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/latest/network-isolation
