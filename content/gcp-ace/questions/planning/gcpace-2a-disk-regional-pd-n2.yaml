id: gcpace-2a-disk-regional-pd-n2
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hospital runs PostgreSQL on an n2-standard-16 VM in the us-east1-b zone, with data on a zonal SSD Persistent Disk. The hospital requires that the database data survive the loss of a zone with a recovery point objective close to zero. During a zonal outage, the team plans to start a standby VM in us-east1-c and attach the data disk to it.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Keep the zonal disk, and attach a snapshot schedule that creates a snapshot every hour in the us multi-region." }
    - id: b
      text: { en: "Move the data to Local SSD disks configured as a RAID 0 array, and copy a backup to Cloud Storage every night." }
    - id: c
      text: { en: "Move the data to a regional SSD Persistent Disk with replica zones us-east1-b and us-east1-c, and force-attach it to the standby VM on failover." }
    - id: d
      text: { en: "Move the data to a zonal Hyperdisk Extreme volume, and create a machine image of the VM every day in us-east1-c." }
answer: { optionId: c }
explanation:
  correct:
    en: A regional Persistent Disk replicates writes synchronously between two zones of the region, so after a zonal outage the replica in the other zone holds current data. You attach it to the standby VM with `gcloud compute instances attach-disk --force-attach`; regional Persistent Disk attaches to E2, N1, N2, and N2D VMs, so the N2 machine type is supported.
  options:
    a: { en: "Hourly snapshots can lose up to an hour of writes, which misses the near-zero recovery point objective." }
    b: { en: "Local SSD data is lost if the host or zone fails, and a nightly backup gives a recovery point of up to a day." }
    d: { en: "A zonal volume has no copy in another zone, and a daily machine image gives a recovery point of up to a day." }
references:
  - title: "Create and manage regional disks | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/regional-persistent-disk
