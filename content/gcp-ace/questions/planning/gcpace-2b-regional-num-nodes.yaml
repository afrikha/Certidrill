id: gcpace-2b-regional-num-nodes
objective: "2.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    You must create a GKE Standard cluster named orders whose control plane stays available if one zone of us-east1 fails. To keep costs low, the cluster must start with exactly three nodes in total, one in each of three zones of the region.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud container clusters create orders --location=us-east1 --num-nodes=3`
    - id: b
      text:
        en: |-
          `gcloud container clusters create orders --location=us-east1-b --node-locations=us-east1-b,us-east1-c,us-east1-d --num-nodes=1`
    - id: c
      text:
        en: |-
          `gcloud container clusters create orders --location=us-east1 --num-nodes=1`
    - id: d
      text:
        en: |-
          `gcloud container clusters create orders --location=us-east1-b --num-nodes=3`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A region as location creates a regional cluster: its control plane is replicated across zones, and by default each node pool is replicated across three zones of the region. `--num-nodes` is a number of nodes per zone, so a value of 1 gives three nodes in total.
  options:
    a:
      en: |-
        In a regional cluster, `--num-nodes=3` creates three nodes in each of the three zones, nine nodes in total.
    b:
      en: |-
        This creates a multi-zonal cluster: the nodes run in three zones, but the single control plane runs in us-east1-b and is unavailable if that zone fails.
    d:
      en: |-
        This creates a zonal cluster with three nodes and a single control plane, all in us-east1-b.
references:
  - title: "Creating a regional cluster | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/creating-a-regional-cluster
  - title: "About cluster configuration choices | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/configuration-overview
