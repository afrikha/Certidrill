id: gcpace-2b-kubectl-client-version
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |-
    A new team member installed kubectl on a workstation by running `gcloud components install kubectl`. No GKE cluster is configured yet in the workstation's kubeconfig file. Before configuring cluster access, the team member wants to confirm that kubectl is installed and see its version, without contacting any cluster.

    Which command should the team member run?
body:
  options:
    - id: a
      text:
        en: |-
          `kubectl cluster-info`
    - id: b
      text:
        en: |-
          `kubectl version --client`
    - id: c
      text:
        en: |-
          `gcloud container clusters list`
    - id: d
      text:
        en: |-
          `kubectl get nodes`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `kubectl version --client` prints only the version of the local kubectl binary, so it works before any cluster is configured. Google's installation steps use it to check the client right after installing kubectl.
  options:
    a:
      en: |-
        `kubectl cluster-info` contacts the control plane of the current context, and no cluster is configured yet.
    c:
      en: |-
        This lists the GKE clusters of the project through the GKE API; it doesn't use or check the kubectl client.
    d:
      en: |-
        `kubectl get nodes` needs a configured cluster and credentials in the kubeconfig file.
references:
  - title: "Install kubectl and configure cluster access | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl
