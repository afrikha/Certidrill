id: gcpace-2b-private-nodes-cloud-nat
objective: "2.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A media company is creating a GKE Standard cluster whose nodes must not have external IP addresses. Workloads must still pull public images from Docker Hub and call a partner API on the internet. Administrators will keep connecting to the control plane through its external endpoint.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create the cluster with the `--enable-private-nodes` flag.
    - id: b
      text:
        en: |-
          Create the cluster with the `--enable-private-endpoint` flag.
    - id: c
      text:
        en: |-
          Enable Private Google Access on the nodes' subnet, and configure no other egress path.
    - id: d
      text:
        en: |-
          Configure a Cloud NAT gateway on a Cloud Router in the cluster's network and region.
    - id: e
      text:
        en: |-
          Create a VPC firewall rule that allows egress from the nodes to 0.0.0.0/0 on TCP port 443.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      `--enable-private-nodes` gives the nodes internal IP addresses only. Private nodes have no external IP address, so they reach the internet, Docker Hub and the partner API through a Cloud NAT gateway configured with a Cloud Router.
  options:
    b:
      en: |-
        `--enable-private-endpoint` turns off access through the external control plane endpoint that the administrators use; it doesn't remove the nodes' external IP addresses.
    c:
      en: |-
        Private Google Access reaches Google APIs and services only, not Docker Hub or a partner API.
    e:
      en: |-
        Egress is already allowed by the implied egress rule; without an external IP address or NAT, the nodes still have no path to the internet.
references:
  - title: "Customize your network isolation in GKE | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/latest/network-isolation
