id: gcpace-2b-dns-endpoint-only
objective: "2.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A security team requires that a new GKE Autopilot cluster expose no IP-based control plane endpoint at all, neither internal nor external. Administrators work from laptops on many home networks without VPN, and their access to the control plane must be controlled by IAM. You are writing the `gcloud container clusters create-auto` command.

    Which flags should you add?
body:
  options:
    - id: a
      text:
        en: |-
          `--enable-dns-access --no-enable-ip-access`
    - id: b
      text:
        en: |-
          `--enable-private-endpoint --enable-master-authorized-networks --master-authorized-networks=0.0.0.0/0`
    - id: c
      text:
        en: |-
          `--enable-private-nodes --enable-private-endpoint`
    - id: d
      text:
        en: |-
          `--enable-master-authorized-networks --master-authorized-networks=198.51.100.0/24`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The DNS-based endpoint gives the control plane a unique DNS name that resolves to an endpoint reachable from any network that can reach Google Cloud APIs, with access controlled by IAM. `--enable-dns-access` turns it on, and `--no-enable-ip-access` disables both IP-based endpoints; administrators then run `get-credentials` with `--dns-endpoint`.
  options:
    b:
      en: |-
        `--enable-private-endpoint` keeps the internal IP-based endpoint, which the security team forbids and which laptops without VPN can't reach.
    c:
      en: |-
        These flags keep the internal IP-based endpoint, which laptops on home networks can't reach without VPN; private nodes don't change control plane access.
    d:
      en: |-
        Authorized networks restrict the external IP-based endpoint but keep it enabled, and one range can't cover many home networks.
references:
  - title: "About network isolation in GKE | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/network-isolation
  - title: "Customize your network isolation in GKE | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/latest/network-isolation
