id: gcpace-2d-tags-src-tag-db-ingress
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An e-commerce company runs application VMs and PostgreSQL VMs in the same subnet (`10.10.0.0/24`) of the VPC network `shop-vpc`. Both groups autoscale, so their IP addresses change often. The secure tag values `123456789012/tier/app` and `123456789012/tier/db` are bound to the application VMs and the database VMs. In the global network firewall policy `fw-shop`, you must allow TCP 5432 to the database VMs only from the application VMs.

    Which command should you run?
body:
  options:
    - { id: a, text: { en: "`gcloud compute network-firewall-policies rules create 1000 --firewall-policy=fw-shop --global-firewall-policy --direction=INGRESS --action=allow --src-ip-ranges=10.10.0.0/24 --target-secure-tags=123456789012/tier/db --layer4-configs=tcp:5432`" } }
    - { id: b, text: { en: "`gcloud compute network-firewall-policies rules create 1000 --firewall-policy=fw-shop --global-firewall-policy --direction=INGRESS --action=allow --src-secure-tags=123456789012/tier/app --target-secure-tags=123456789012/tier/db --layer4-configs=tcp:5432`" } }
    - { id: c, text: { en: "`gcloud compute network-firewall-policies rules create 1000 --firewall-policy=fw-shop --global-firewall-policy --direction=INGRESS --action=allow --src-secure-tags=123456789012/tier/db --target-secure-tags=123456789012/tier/app --layer4-configs=tcp:5432`" } }
    - { id: d, text: { en: "`gcloud compute network-firewall-policies rules create 1000 --firewall-policy=fw-shop --global-firewall-policy --direction=EGRESS --action=allow --src-secure-tags=123456789012/tier/app --target-secure-tags=123456789012/tier/db --layer4-configs=tcp:5432`" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An ingress rule can use a source secure tag: it matches packets sent from the network interfaces bound to `tier/app`, whatever their current IP addresses. The target secure tag `tier/db` limits the rule to the database VMs, and `tcp:5432` limits it to PostgreSQL.
  options:
    a: { en: "The subnet range also contains the database VMs and any other VM in the subnet, so the rule does not limit the source to the application VMs." }
    c: { en: "The source and target are swapped: this rule allows the database VMs to connect to TCP 5432 on the application VMs." }
    d: { en: "Source secure tags are supported only in ingress rules; an egress rule cannot use them, and the traffic to allow is inbound to the database VMs." }
references:
  - title: "Firewall policy rule components | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies-rule-details
  - title: "Manage VM traffic by using secure tags | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/use-tags-for-firewalls
