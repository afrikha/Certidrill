id: gcpace-2b-custom-n2-flags
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |-
    A software vendor licenses its server per vCPU. The license server must run on the N2 machine series with exactly 6 vCPUs and 24 GB of memory, and no predefined N2 machine type has this shape. You are writing the command that creates the VM.

    Which flags should you add to `gcloud compute instances create license-1 --zone=europe-west1-b`?
body:
  options:
    - id: a
      text:
        en: |-
          `--custom-cpu=6 --custom-memory=24GB`
    - id: b
      text:
        en: |-
          `--machine-type=n2-custom-6-24`
    - id: c
      text:
        en: |-
          `--custom-vm-type=n2 --custom-cpu=6 --custom-memory=24GB`
    - id: d
      text:
        en: |-
          `--machine-type=n2-standard-8`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With the separate custom flags, `--custom-vm-type` selects the machine series, `--custom-cpu` the number of vCPUs and `--custom-memory` the amount of memory. N2 custom machine types accept an even number of vCPUs up to 32 and 0.5 to 8 GB per vCPU, so 6 vCPUs with 24 GB (4 GB per vCPU) is valid.
  options:
    a:
      en: |-
        Without `--custom-vm-type`, gcloud creates the custom machine type in the default N1 series, which doesn't meet the N2 requirement.
    b:
      en: |-
        In a custom machine type string, the memory is given in MB (24 GB is n2-custom-6-24576); a value of 24 requests 24 MB, which isn't a valid amount.
    d:
      en: |-
        n2-standard-8 has 8 vCPUs and 32 GB of memory, so the vendor would charge licenses for 8 vCPUs instead of 6.
references:
  - title: "Create a VM with a custom machine type | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/creating-instance-with-custom-machine-type
