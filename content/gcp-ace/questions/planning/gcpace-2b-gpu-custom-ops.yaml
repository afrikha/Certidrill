id: gcpace-2b-gpu-custom-ops
objective: "2.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |-
    A computer vision team trains a medium-sized PyTorch model with large batch sizes. The model uses many custom PyTorch operations, and some of them must run at least partially on CPUs. The team wants hardware acceleration for training.

    What should the team use?
body:
  options:
    - id: a
      text:
        en: |-
          Cloud TPU VMs
    - id: b
      text:
        en: |-
          Compute-optimized C3 VMs without accelerators
    - id: c
      text:
        en: |-
          Compute Engine VMs with NVIDIA GPUs
    - id: d
      text:
        en: |-
          Memory-optimized M3 VMs
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Google recommends GPUs for models with a significant number of custom PyTorch or JAX operations that must run at least partially on CPUs, and for medium-to-large models with larger effective batch sizes. Both describe this model.
  options:
    a:
      en: |-
        Cloud TPUs aren't suited to neural networks that contain custom operations in the main training loop.
    b:
      en: |-
        CPUs fit quick prototyping and small models; they don't provide the acceleration that the team wants.
    d:
      en: |-
        Memory-optimized VMs provide large amounts of memory, not accelerators for training.
references:
  - title: "Introduction to Cloud TPU | Google Cloud Documentation"
    url: https://docs.cloud.google.com/tpu/docs/intro-to-tpu
