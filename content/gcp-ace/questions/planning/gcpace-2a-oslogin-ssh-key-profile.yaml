id: gcpace-2a-oslogin-ssh-key-profile
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company has enabled OS Login in its project, and an engineer has the Compute OS Login role. The engineer wants to connect with a third-party SSH client by using an existing key pair whose public key is in ~/.ssh/id_ed25519.pub. Company policy says that the key must stop working after 30 days.

    What should the engineer do?
body:
  options:
    - id: a
      text: { en: "Add the key to the ssh-keys entry in project metadata with an expireOn value 30 days ahead." }
    - id: b
      text: { en: "Append the key to the ~/.ssh/authorized_keys file on each VM, and remove it after 30 days." }
    - id: c
      text: { en: "Add the key to the instance metadata of each VM with an expireOn value 30 days ahead." }
    - id: d
      text: { en: "Run `gcloud compute os-login ssh-keys add --key-file=~/.ssh/id_ed25519.pub --ttl=30d`." }
answer: { optionId: d }
explanation:
  correct:
    en: With OS Login, SSH keys are associated with the user's Google account through the OS Login profile. `gcloud compute os-login ssh-keys add` adds an existing public key to that profile, and `--ttl` sets an expiration time for the key.
  options:
    a: { en: "When OS Login is enabled, the VM's guest agent ignores keys stored in project or instance metadata." }
    b: { en: "Enabling OS Login deletes the VMs' authorized_keys files, and keys written there by hand are not managed or expired." }
    c: { en: "Instance metadata keys are ignored as well on VMs where OS Login is enabled." }
references:
  - title: "Set up OS Login | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin
  - title: "Add SSH keys to VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/connect/add-ssh-keys
