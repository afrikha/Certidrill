id: gcpace-2c-network-policy-rule-association
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    In the project `web-prj`, you created the global network firewall policy `web-policy`, which has no rules yet. Ingress HTTPS (TCP port 443) from the partner range `203.0.113.0/24` to the VMs of the VPC network `web-vpc` must be allowed by a rule of this policy.

    Which two commands should you run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute network-firewall-policies associations create --firewall-policy=web-policy --network=web-vpc --global-firewall-policy`
    - id: b
      text:
        en: |-
          `gcloud compute firewall-rules create allow-partner-https --network=web-vpc --direction=INGRESS --action=ALLOW --rules=tcp:443 --source-ranges=203.0.113.0/24`
    - id: c
      text:
        en: |-
          `gcloud compute network-firewall-policies rules create 1000 --firewall-policy=web-policy --global-firewall-policy --direction=INGRESS --action=allow --layer4-configs=tcp:443 --src-ip-ranges=203.0.113.0/24`
    - id: d
      text:
        en: |-
          `gcloud compute firewall-policies associations create --firewall-policy=web-policy --organization=123456789012`
    - id: e
      text:
        en: |-
          `gcloud compute networks update web-vpc --network-firewall-policy-enforcement-order=BEFORE_CLASSIC_FIREWALL`
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      `gcloud compute network-firewall-policies rules create` with `--global-firewall-policy` adds the ingress allow rule to the global network firewall policy, with the ports in `--layer4-configs` and the source in `--src-ip-ranges`. A network firewall policy applies only once it is associated with a VPC network in the same project, which `associations create --network=web-vpc` does.
  options:
    b:
      en: |-
        This creates a VPC firewall rule in the network, not a rule of `web-policy`.
    d:
      en: |-
        `gcloud compute firewall-policies` manages hierarchical firewall policies, which are associated with an organization or folder; a global network firewall policy is associated with a VPC network.
    e:
      en: |-
        The enforcement order only decides whether network firewall policies are evaluated before or after VPC firewall rules; it neither adds the rule nor associates the policy.
references:
  - title: "Create global network firewall policies and rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/use-network-firewall-policies
  - title: "Evaluation order for firewall policies and rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies-rule-eval-order
