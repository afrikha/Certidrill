id: gcpace-2c-fw-iap-ssh-ingress
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    VMs with the network tag `ssh-iap` in the VPC network `ops-vpc` have no external IP addresses. Administrators connect to them with `gcloud compute ssh --tunnel-through-iap`. You must create a firewall rule that allows SSH to these VMs only, and only from Identity-Aware Proxy (IAP) TCP forwarding.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute firewall-rules create allow-iap-ssh --network=ops-vpc --direction=EGRESS --action=ALLOW --rules=tcp:22 --destination-ranges=35.235.240.0/20 --target-tags=ssh-iap`
    - id: b
      text:
        en: |-
          `gcloud compute firewall-rules create allow-iap-ssh --network=ops-vpc --direction=INGRESS --action=ALLOW --rules=tcp:22 --source-ranges=0.0.0.0/0 --target-tags=ssh-iap`
    - id: c
      text:
        en: |-
          `gcloud compute firewall-rules create allow-iap-ssh --network=ops-vpc --direction=INGRESS --action=ALLOW --rules=tcp:22 --source-ranges=35.235.240.0/20 --target-tags=ssh-iap`
    - id: d
      text:
        en: |-
          `gcloud compute firewall-rules create allow-iap-ssh --network=ops-vpc --direction=INGRESS --action=ALLOW --rules=tcp:22 --source-ranges=35.235.240.0/20`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      IAP TCP forwarding connects to the VMs from the range `35.235.240.0/20`, so the rule must be an ingress rule with that source range and TCP port 22. `--target-tags=ssh-iap` applies the rule only to the tagged VMs.
  options:
    a:
      en: |-
        An egress rule controls traffic that leaves the VMs; it doesn't permit the incoming SSH connections, which the implied ingress deny still blocks.
    b:
      en: |-
        A source range of `0.0.0.0/0` allows SSH from any address, not only from IAP.
    d:
      en: |-
        Without a target, the rule applies to every instance in the network instead of only the tagged VMs.
references:
  - title: "Use IAP for TCP forwarding | Identity-Aware Proxy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
