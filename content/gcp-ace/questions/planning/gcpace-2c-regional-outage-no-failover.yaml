id: gcpace-2c-regional-outage-no-failover
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is redesigning the storage layer of its claims platform. The platform stores claim records in a database and scanned documents as files. If an entire Google Cloud region becomes unavailable, applications must keep reading and writing data without any manual failover or promotion step by the operations team.

    Which two choices meet this requirement? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Store the claim records in a Cloud SQL for PostgreSQL instance with high availability enabled.
    - id: b
      text:
        en: |-
          Store the claim records in a Spanner instance that uses a multi-region instance configuration.
    - id: c
      text:
        en: |-
          Store the claim records in a Cloud SQL for PostgreSQL instance with a cross-region read replica.
    - id: d
      text:
        en: |-
          Store the scanned documents in a Filestore regional instance.
    - id: e
      text:
        en: |-
          Store the scanned documents in a dual-region Cloud Storage bucket.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A Spanner multi-region configuration keeps read-write replicas in several regions and continues to serve reads and writes when one region fails, with 99.999% availability. A dual-region Cloud Storage bucket transparently serves objects from the available region during a regional outage, with no change to the storage path and a designed recovery time objective of zero.
  options:
    a:
      en: |-
        Cloud SQL high availability places the standby in another zone of the same region, so it doesn't survive the loss of the whole region.
    c:
      en: |-
        A cross-region read replica serves reads only; it must be promoted manually before it accepts writes.
    d:
      en: |-
        A Filestore regional instance fails over across zones of one region; it doesn't survive the loss of that region.
references:
  - title: "Data availability and durability | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/availability-durability
  - title: "Regional, dual-region, and multi-region configurations | Spanner | Google Cloud Documentation"
    url: https://docs.cloud.google.com/spanner/docs/instance-configurations
