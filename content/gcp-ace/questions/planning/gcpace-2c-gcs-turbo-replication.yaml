id: gcpace-2c-gcs-turbo-replication
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A broadcaster stores video uploads in Cloud Storage. Compliance requires that every new object be stored in both `europe-west1` and `europe-west4`, that 100% of newly written objects be replicated to both regions within 15 minutes regardless of their size, and that applications keep using the same bucket name if one of the two regions fails.

    Which command should you use to create the bucket?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud storage buckets create gs://vistar-uploads --location=EU`
    - id: b
      text:
        en: |-
          `gcloud storage buckets create gs://vistar-uploads --location=EU --placement=europe-west1,europe-west4 --rpo=ASYNC_TURBO`
    - id: c
      text:
        en: |-
          `gcloud storage buckets create gs://vistar-uploads --location=EU --rpo=ASYNC_TURBO`
    - id: d
      text:
        en: |-
          `gcloud storage buckets create gs://vistar-uploads --location=europe-west1`, plus an hourly Storage Transfer Service job to a second bucket in `europe-west4`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `--placement` with two regions of the `EU` location creates a configurable dual-region bucket that stores data in exactly those regions and transparently serves objects from the available region during an outage. `--rpo=ASYNC_TURBO` enables turbo replication, which is designed to replicate 100% of newly written objects to both regions within 15 minutes regardless of size; it is available only for dual-region buckets.
  options:
    a:
      en: |-
        The `EU` multi-region doesn't let you choose the two regions, and default replication targets 99.9% of new objects within one hour and 100% within 12 hours, not 15 minutes.
    c:
      en: |-
        Without `--placement`, `EU` is a multi-region location, and `ASYNC_TURBO` is valid only for dual-region buckets.
    d:
      en: |-
        An hourly copy can't meet a 15-minute target, and the second bucket has another name, so applications would have to be changed to use it during an outage.
references:
  - title: "Bucket locations | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/locations
  - title: "gcloud storage buckets create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/buckets/create
