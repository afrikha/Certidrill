id: gcpace-2d-ai-antigravity-agents
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software team wants an agentic development platform from Google for its developers. It must provide a desktop app to launch and orchestrate several coding agents in parallel, extensions for the IDEs the team already uses, and a terminal client. The agents must produce artifacts, such as implementation plans and walkthroughs, that developers review.

    Which tool should the team adopt?
body:
  options:
    - { id: a, text: { en: "Gemini Cloud Assist" } }
    - { id: b, text: { en: "Google Antigravity" } }
    - { id: c, text: { en: "Application Design Center" } }
    - { id: d, text: { en: "Cloud Workstations" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Google Antigravity is an agentic development platform: its desktop app launches and orchestrates teams of agents, its IDE extensions bring the agents into existing editors, and its `agy` terminal client runs the same workflows from a shell. Agents report through artifacts such as implementation plans, walkthroughs, and diffs for developers to review. Antigravity is documented on antigravity.google, outside the Google Cloud documentation, and its documentation doesn't label the platform as Preview.
  options:
    a: { en: "Gemini Cloud Assist is an assistant in the Google Cloud console for designing, operating, and troubleshooting cloud resources, not a multi-agent coding platform." }
    c: { en: "Application Design Center designs and deploys application infrastructure from templates; it does not orchestrate coding agents." }
    d: { en: "Cloud Workstations provides managed development environments; it is not an agent platform." }
references:
  - title: "Choose your Antigravity | Google Antigravity Docs"
    url: https://antigravity.google/docs/overview
