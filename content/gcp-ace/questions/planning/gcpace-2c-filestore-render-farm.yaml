id: gcpace-2c-filestore-render-farm
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An animation studio runs 200 Linux Compute Engine VMs as a render farm. All VMs must mount the same project directory over NFS, and the rendering software reads and writes files with standard file system calls. The studio wants a managed service and no change to the rendering software.

    Which storage product should you use?
body:
  options:
    - id: a
      text:
        en: |-
          A Cloud Storage bucket that the VMs access with `gcloud storage cp` commands
    - id: b
      text:
        en: |-
          A Filestore instance
    - id: c
      text:
        en: |-
          A Hyperdisk volume attached to each VM
    - id: d
      text:
        en: |-
          A Bigtable instance
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Filestore is a managed file server that exports NFS shares (NFSv3 on every tier, NFSv4.1 on the zonal, regional and enterprise tiers). Every VM can mount the same share and use ordinary file system calls, so the rendering software doesn't change.
  options:
    a:
      en: |-
        Cloud Storage is object storage; copying objects with `gcloud storage cp` isn't an NFS mount, so the software would need to change.
    c:
      en: |-
        A separate disk per VM gives each VM its own data instead of one shared project directory.
    d:
      en: |-
        Bigtable is a NoSQL database accessed through its API, not a file system that VMs can mount.
references:
  - title: "Filestore overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/filestore/docs/overview
