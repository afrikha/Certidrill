id: gcpace-2b-pubsub-push-auth
objective: "2.1.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |-
    A Cloud Run service named ingest was deployed with `--no-allow-unauthenticated` and must stay private. Messages from the Pub/Sub topic events must be pushed to it, and each push request must be authenticated. You created the service account sa-push for this purpose in a project created this year.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant sa-push the Cloud Run Invoker role on the ingest service.
    - id: b
      text:
        en: |-
          Redeploy ingest with `--allow-unauthenticated` so that Pub/Sub can reach it.
    - id: c
      text:
        en: |-
          Create a push subscription on events with `--push-endpoint` set to the URL of ingest and `--push-auth-service-account` set to sa-push.
    - id: d
      text:
        en: |-
          Grant sa-push the Pub/Sub Publisher role on the topic events.
    - id: e
      text:
        en: |-
          Create a pull subscription on events, and pass its name to ingest in an environment variable.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      With `--push-auth-service-account`, Pub/Sub adds a token for sa-push to each push request, and the private service accepts the request only if sa-push has the Cloud Run Invoker role on ingest. In projects created after April 8, 2021, the Pub/Sub service agent already has the permissions it needs to create these tokens.
  options:
    b:
      en: |-
        Allowing unauthenticated access would make ingest public, which the requirement forbids.
    d:
      en: |-
        The Publisher role lets an identity publish messages to the topic; push deliveries to Cloud Run don't need it.
    e:
      en: |-
        With a pull subscription, the service would have to fetch messages itself; Pub/Sub wouldn't push authenticated requests to ingest.
references:
  - title: "Use Pub/Sub with Cloud Run tutorial | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/triggering/pubsub-push
