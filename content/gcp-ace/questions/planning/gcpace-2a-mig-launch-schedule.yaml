id: gcpace-2a-mig-launch-schedule
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An electronics retailer runs its storefront on an autoscaled managed instance group that scales on CPU utilization. A product launch on March 10 at 09:00 is expected to need at least 40 VMs for about six hours, five times the usual load; nothing similar has happened before. New VMs need about five minutes to initialize. You need the capacity to be ready when the launch starts, without changing the group's behavior on other days.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Enable predictive autoscaling with `--cpu-utilization-predictive-method=optimize-availability` a week before the launch." }
    - id: b
      text: { en: "Lower the CPU utilization target of the autoscaler to 0.2 for the week of the launch." }
    - id: c
      text: { en: "Create a scaling schedule with `update-autoscaling --set-schedule` that requires 40 VMs from 08:30 on March 10 for seven hours." }
    - id: d
      text: { en: "Increase the stabilization period of the autoscaler to 3,600 seconds before the launch." }
answer: { optionId: c }
explanation:
  correct:
    en: A scaling schedule sets a minimum number of VMs for a time window, which suits one-time, known events. Starting the schedule before 09:00 gives the VMs time to boot and initialize, because they are not ready at the very start time.
  options:
    a: { en: "Predictive autoscaling forecasts daily and weekly patterns only; it cannot predict a one-time event that never happened before." }
    b: { en: "A low target adds VMs for the whole week, which wastes money, and still reacts to load only after it arrives." }
    d: { en: "The stabilization period only delays scale-in decisions; it does not add VMs before the launch." }
references:
  - title: "Scaling based on schedules | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/autoscaler/scaling-schedules
  - title: "Scaling based on predictions | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/autoscaler/predictive-autoscaling
