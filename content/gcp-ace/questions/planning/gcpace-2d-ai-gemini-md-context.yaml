id: gcpace-2d-ai-gemini-md-context
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A DevOps team uses Gemini CLI in Cloud Shell to write gcloud commands and Terraform code in its infrastructure repository. The team wants Gemini CLI to always follow its conventions: a resource naming pattern, the required labels `env` and `owner`, and the preferred region. The conventions must be versioned with the repository, and engineers must not have to repeat them in every prompt.

    What should you do?
body:
  options:
    - { id: a, text: { en: "Add a GEMINI.md file at the root of the repository that describes the conventions." } }
    - { id: b, text: { en: "Describe the conventions in the mcpServers section of the repository's .gemini/settings.json file." } }
    - { id: c, text: { en: "Create a gcloud configuration with the preferred region, and activate it in each engineer's Cloud Shell." } }
    - { id: d, text: { en: "Paste the conventions into the Gemini Cloud Assist panel of the console at the start of each session." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Gemini CLI loads `GEMINI.md` context files from the workspace and its parent directories and sends their content with every prompt, so instructions are written once instead of in each prompt. A file at the repository root is versioned with the code and shared by the whole team. Gemini CLI's Google Cloud documentation page gives it no Preview label.
  options:
    b: { en: "The mcpServers section declares the MCP servers that Gemini CLI connects to for tools; it is not a place for instructions." }
    c: { en: "A gcloud configuration sets defaults for gcloud only; it does not tell Gemini CLI about naming or labels." }
    d: { en: "The Cloud Assist panel is a different assistant in the console, and pasting text each session is the repetition to avoid." }
references:
  - title: "Gemini CLI | Gemini for Google Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini/docs/codeassist/gemini-cli
  - title: Provide context with GEMINI.md files
    url: https://geminicli.com/docs/cli/gemini-md/
