id: gcpace-2c-fw-source-tags-database
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the VPC network `shop-vpc`, application VMs created by an autoscaled managed instance group have the network tag `app`, and database VMs have the network tag `db`. The internal IP addresses of the application VMs change often. Only the application VMs may connect to the databases on TCP port 5432.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute firewall-rules create app-to-db --network=shop-vpc --direction=INGRESS --action=ALLOW --rules=tcp:5432 --source-ranges=0.0.0.0/0 --target-tags=db`
    - id: b
      text:
        en: |-
          `gcloud compute firewall-rules create app-to-db --network=shop-vpc --direction=EGRESS --action=ALLOW --rules=tcp:5432 --destination-ranges=10.0.0.0/8 --target-tags=app`
    - id: c
      text:
        en: |-
          `gcloud compute firewall-rules create app-to-db --network=shop-vpc --direction=INGRESS --action=ALLOW --rules=tcp:5432 --source-tags=db --target-tags=app`
    - id: d
      text:
        en: |-
          `gcloud compute firewall-rules create app-to-db --network=shop-vpc --direction=INGRESS --action=ALLOW --rules=tcp:5432 --source-tags=app --target-tags=db`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      An ingress rule targets the VMs that receive the traffic, here the tag `db`. Using `--source-tags=app` as the source matches the application VMs by tag instead of by IP address, so new or replaced VMs are covered automatically.
  options:
    a:
      en: |-
        A source range of `0.0.0.0/0` allows any address to reach the databases, not only the application VMs.
    b:
      en: |-
        Egress is already allowed by the implied action; the databases still need an ingress rule to accept the connections, which the implied ingress deny otherwise blocks.
    c:
      en: |-
        Source and target are reversed: this rule lets the database VMs connect to the application VMs.
references:
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
