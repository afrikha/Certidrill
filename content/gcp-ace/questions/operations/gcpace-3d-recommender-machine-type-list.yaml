id: gcpace-3d-recommender-machine-type-list
objective: "3.4.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs about 40 standalone Compute Engine VMs, none of which belong to a managed instance group, in the zone `europe-west1-b` of the project `media-prod`. The FinOps team suspects that many VMs are oversized for their workloads and asks you for a list of the resize recommendations that Active Assist has generated for these VMs, from the gcloud CLI.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud recommender recommendations list --project=media-prod --location=europe-west1-b --recommender=google.compute.instance.IdleResourceRecommender`
    - id: b
      text:
        en: |-
          `gcloud recommender recommendations list --project=media-prod --location=europe-west1-b --recommender=google.compute.instanceGroupManager.MachineTypeRecommender`
    - id: c
      text:
        en: |-
          `gcloud recommender recommendations list --project=media-prod --location=europe-west1-b --recommender=google.compute.instance.MachineTypeRecommender`
    - id: d
      text:
        en: |-
          `gcloud recommender recommendations list --project=media-prod --location=europe-west1-b --recommender=google.compute.commitment.UsageCommitmentRecommender`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The VM machine type recommender, `google.compute.instance.MachineTypeRecommender`, produces the rightsizing recommendations that suggest a smaller or larger machine type from the last 8 days of utilization data. Its recommendations for VMs are listed with `gcloud recommender recommendations list`, the project and the zone of the VMs as the location.
  options:
    a:
      en: |-
        The idle VM recommender suggests stopping or deleting VMs that aren't used; it doesn't suggest a smaller machine type for VMs that are in use.
    b:
      en: |-
        This recommender covers managed instance groups, and none of these VMs belongs to one.
    d:
      en: |-
        This recommender suggests resource-based committed use discounts to buy; it doesn't resize the VMs.
references:
  - title: "Apply machine type recommendations to VM instances | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/apply-machine-type-recommendations-for-instances
  - title: "Recommenders | Google Cloud Documentation"
    url: https://docs.cloud.google.com/recommender/docs/recommenders
