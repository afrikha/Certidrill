id: gcpace-3a-nodepool-migrate-delete
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A GKE Standard cluster has an old node pool named legacy-pool, with cluster autoscaling enabled, and a new node pool named arm-pool that has enough capacity. You must move the workloads from legacy-pool to arm-pool gracefully before you delete legacy-pool.

    Which three actions should you perform before you delete legacy-pool? Choose three.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Disable autoscaling on legacy-pool with `gcloud container clusters update` and `--no-enable-autoscaling --node-pool=legacy-pool`.
    - id: b
      text:
        en: |-
          Delete all Pods of the cluster with `kubectl delete pods --all --all-namespaces`.
    - id: c
      text:
        en: |-
          Cordon each node of legacy-pool with `kubectl cordon`.
    - id: d
      text:
        en: |-
          Resize arm-pool to zero nodes with `gcloud container clusters resize`.
    - id: e
      text:
        en: |-
          Drain each node of legacy-pool with `kubectl drain --ignore-daemonsets --delete-emptydir-data`.
    - id: f
      text:
        en: |-
          Run `kubectl uncordon` on each node of legacy-pool.
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      Turning off autoscaling stops the autoscaler from changing legacy-pool during the move. Cordoning marks its nodes unschedulable so no new Pods land there, and draining evicts the running Pods gracefully so that their controllers recreate them on arm-pool. The old pool can then be deleted.
  options:
    b:
      en: |-
        Deleting every Pod abruptly stops all workloads, including those not on legacy-pool, instead of evicting them gracefully.
    d:
      en: |-
        arm-pool is the destination; removing its nodes leaves the workloads nowhere to run.
    f:
      en: |-
        `uncordon` makes the nodes schedulable again, the opposite of what the migration needs.
references:
  - title: "Troubleshoot GKE Standard node pools | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/troubleshooting/node-pools
