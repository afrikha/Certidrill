id: gcpace-3b-run-concurrency-one
objective: "3.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company moved a legacy PDF rendering library into the Cloud Run service `render` in `europe-west1`. The library keeps global state and produces corrupted output when two requests run at the same time in the same container instance. Under load, some generated PDFs are now corrupted. You must fix the problem without changing the code, and the service must still scale with traffic.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud run services update render --region=europe-west1 --max=1`.
    - id: b
      text:
        en: |-
          Run `gcloud run services update render --region=europe-west1 --min=1`.
    - id: c
      text:
        en: |-
          Run `gcloud run services update render --region=europe-west1 --concurrency=1`.
    - id: d
      text:
        en: |-
          Run `gcloud run services update render --region=europe-west1 --cpu-boost`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Concurrency is the maximum number of requests that one container instance handles at the same time; setting it to 1 guarantees that each instance processes a single request, which is the documented choice for code that can't safely handle parallel requests. Cloud Run then starts more instances to absorb load, so the service still scales.
  options:
    a:
      en: |-
        One instance stops the service from scaling, and that single instance would still receive up to the default number of concurrent requests.
    b:
      en: |-
        A minimum instance keeps capacity warm but doesn't limit how many requests run in parallel inside an instance.
    d:
      en: |-
        Startup CPU boost only adds CPU during instance startup; it doesn't stop concurrent requests from sharing the global state.
references:
  - title: "Maximum concurrent requests for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/about-concurrency
