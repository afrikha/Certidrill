id: gcpace-3b-gcs-viewer-creator-multi
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    The bucket `gs://partner-dropbox` uses uniform bucket-level access. The group `analysts@example.com` must list and read the objects in this bucket only. The service account `ingest@example-prj.iam.gserviceaccount.com` must upload new files to the bucket but must not read, overwrite, or delete any object.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant `analysts@example.com` Storage Object Viewer (`roles/storage.objectViewer`) on the project.
    - id: b
      text:
        en: |-
          Grant `analysts@example.com` Storage Object Viewer (`roles/storage.objectViewer`) on the bucket.
    - id: c
      text:
        en: |-
          Grant the `ingest` service account Storage Object User (`roles/storage.objectUser`) on the bucket.
    - id: d
      text:
        en: |-
          Grant the `ingest` service account Storage Object Admin (`roles/storage.objectAdmin`) on the bucket.
    - id: e
      text:
        en: |-
          Grant the `ingest` service account Storage Object Creator (`roles/storage.objectCreator`) on the bucket.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Storage Object Viewer lets a principal view objects and their metadata and list the objects of a bucket; granted on the bucket, it applies to that bucket only. Storage Object Creator allows creating objects but gives no permission to view, delete, or overwrite them, which fits an upload-only identity.
  options:
    a:
      en: |-
        A project-level grant gives the group read access to every bucket in the project, not only this one.
    c:
      en: |-
        Storage Object User also includes reading, updating, and deleting objects.
    d:
      en: |-
        Storage Object Admin gives full control of objects, including deletion and object IAM.
references:
  - title: "IAM roles for Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/access-control/iam-roles
