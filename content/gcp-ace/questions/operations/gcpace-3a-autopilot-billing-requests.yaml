id: gcpace-3a-autopilot-billing-requests
objective: "3.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A startup moves its workloads to a GKE Autopilot cluster that uses the default Pod-based billing model. The finance team wants to understand how the Pods' resource requests drive the bill before the developers tune them.

    Which two statements are correct? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          You are charged per second for the CPU, memory and ephemeral storage that running Pods request.
    - id: b
      text:
        en: |-
          You are charged for the full capacity of the nodes that Autopilot provisions, including unused capacity.
    - id: c
      text:
        en: |-
          You are charged for the CPU and memory that the Pods actually consume, as measured by Cloud Monitoring.
    - id: d
      text:
        en: |-
          Pods that are scheduled but stuck in CrashLoopBackOff are still charged for their requests.
    - id: e
      text:
        en: |-
          Pods that are waiting to be scheduled are charged for their requests from the time they are created.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      With Pod-based billing, Autopilot charges in one-second increments for the CPU, memory and ephemeral storage in the requests of scheduled Pods. A Pod that has been scheduled and has resources allocated is billed, even while it is in an error loop such as CrashLoopBackOff, so lowering oversized requests and fixing failing Pods both cut costs.
  options:
    b:
      en: |-
        In the Pod-based model, the size and number of the underlying nodes don't matter for billing, and unallocated capacity isn't charged.
    c:
      en: |-
        Billing is based on the requests, not on measured usage, which is why requests should match the real needs.
    e:
      en: |-
        Pods waiting to be scheduled have no resources allocated and aren't billed.
references:
  - title: "Google Kubernetes Engine pricing | Google Cloud"
    url: https://cloud.google.com/kubernetes-engine/pricing
  - title: "Resource requests in Autopilot | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-resource-requests
