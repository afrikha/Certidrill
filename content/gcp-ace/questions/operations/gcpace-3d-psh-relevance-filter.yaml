id: gcpace-3d-psh-relevance-filter
objective: "3.4.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank routes the Service Health logs of its project to a dedicated log bucket. The on-call team wants a saved Logs Explorer query that shows only the Service Health events that Google has verified as affecting the project or that affect a product in a location the project uses. Events whose impact is unknown or that may be in another location must not be shown.

    Which query should you save?
body:
  options:
    - id: a
      text:
        en: |-
          `jsonPayload.relevance != "NOT_IMPACTED"`
    - id: b
      text:
        en: |-
          `jsonPayload.relevance = ("RELATED" OR "PARTIALLY_RELATED")`
    - id: c
      text:
        en: |-
          `jsonPayload.relevance = ("IMPACTED" OR "RELATED")`
    - id: d
      text:
        en: |-
          `jsonPayload.relevance = ("IMPACTED" OR "UNKNOWN")`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In Personalized Service Health, `IMPACTED` means that the impact on the project is verified, and `RELATED` means that the event affects a product the project uses in a location it uses. Filtering the Service Health log entries on these two relevance values keeps exactly the events the team wants.
  options:
    a:
      en: |-
        This also returns the `UNKNOWN` and `PARTIALLY_RELATED` events, which the team wants to hide.
    b:
      en: |-
        `PARTIALLY_RELATED` events may be in a location that the project doesn't use, and the `IMPACTED` events are missing.
    d:
      en: |-
        `UNKNOWN` events have an impact that isn't known yet, and the `RELATED` events are missing.
references:
  - title: "Query, export, and store Service Health logs | Personalized Service Health | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-health/docs/logs
  - title: "Quickstart: View service health events in the Google Cloud console | Personalized Service Health | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-health/docs/view-events
