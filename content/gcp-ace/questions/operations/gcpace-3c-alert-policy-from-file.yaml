id: gcpace-3c-alert-policy-from-file
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company stores its Cloud Monitoring alerting policies as JSON files in a Git repository. A CI pipeline must create the alerting policy defined in `cpu-policy.json` in the project `ops-prod` by using the gcloud CLI.

    Which command should the pipeline run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud monitoring dashboards create --config-from-file=cpu-policy.json --project=ops-prod`
    - id: b
      text:
        en: |-
          `gcloud monitoring policies create --policy-from-file=cpu-policy.json --project=ops-prod`
    - id: c
      text:
        en: |-
          `gcloud logging metrics create cpu-policy --config-from-file=cpu-policy.json --project=ops-prod`
    - id: d
      text:
        en: |-
          `gcloud monitoring snoozes create --snooze-from-file=cpu-policy.json --project=ops-prod`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud monitoring policies create` creates an alerting policy, and `--policy-from-file` reads the whole policy, with its conditions and notification channels, from a JSON or YAML file. This keeps the Git file as the source of truth.
  options:
    a:
      en: |-
        `gcloud monitoring dashboards create` creates a dashboard from a dashboard configuration, not an alerting policy.
    c:
      en: |-
        `gcloud logging metrics create` creates a log-based metric; an alerting policy file isn't a metric configuration.
    d:
      en: |-
        A snooze temporarily silences existing alerting policies; it doesn't create one.
references:
  - title: "gcloud monitoring policies create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/monitoring/policies/create
