id: gcpace-3c-fw-enforcement-order
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer's VPC network `retail-vpc` has many legacy VPC firewall rules, some of which allow broad ingress traffic. The security team created a global network firewall policy, associated with `retail-vpc`, that denies traffic from known malicious ranges. These deny rules must take effect before the legacy VPC firewall rules. You can't change the VPC firewall rules this quarter and have no permissions on the organization or its folders. The network uses the default settings.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute networks update retail-vpc --network-firewall-policy-enforcement-order=BEFORE_CLASSIC_FIREWALL`.
    - id: b
      text:
        en: |-
          Recreate the deny rules in the global network firewall policy with priority 0.
    - id: c
      text:
        en: |-
          Run `gcloud compute networks update retail-vpc --network-firewall-policy-enforcement-order=AFTER_CLASSIC_FIREWALL`.
    - id: d
      text:
        en: |-
          Move the deny rules to a hierarchical firewall policy associated with the organization.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      By default (AFTER_CLASSIC_FIREWALL), VPC firewall rules are evaluated before global and regional network firewall policies, so a legacy allow rule stops the evaluation before the policy's deny rules. Setting the network's enforcement order to BEFORE_CLASSIC_FIREWALL evaluates the network firewall policies first.
  options:
    b:
      en: |-
        Priorities apply within the policy only; the policy as a whole is still evaluated after the VPC firewall rules.
    c:
      en: |-
        AFTER_CLASSIC_FIREWALL is the default order, which evaluates the VPC firewall rules first.
    d:
      en: |-
        A hierarchical policy would be evaluated first, but associating one with the organization requires permissions that you don't have.
references:
  - title: "Evaluation order for firewall policies and rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies-rule-eval-order
