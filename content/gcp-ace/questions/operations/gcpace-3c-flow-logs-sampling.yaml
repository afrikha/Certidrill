id: gcpace-3c-flow-logs-sampling
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team of an online gaming company needs VPC Flow Logs for the subnet `web-subnet` in `us-east1`. They want the highest flow sampling rate, and they accept a 1-minute aggregation interval to reduce the log volume. Flow logs aren't enabled today.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute networks subnets update web-subnet --region=us-east1 --enable-flow-logs --logging-flow-sampling=0.5 --logging-aggregation-interval=interval-1-min`
    - id: b
      text:
        en: |-
          `gcloud compute networks subnets update web-subnet --region=us-east1 --enable-flow-logs --logging-flow-sampling=1.0 --logging-aggregation-interval=interval-5-sec`
    - id: c
      text:
        en: |-
          `gcloud compute firewall-rules update allow-web --enable-logging --logging-metadata=include-all`
    - id: d
      text:
        en: |-
          `gcloud compute networks subnets update web-subnet --region=us-east1 --enable-flow-logs --logging-flow-sampling=1.0 --logging-aggregation-interval=interval-1-min`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `--enable-flow-logs` turns on VPC Flow Logs for the subnet. `--logging-flow-sampling=1.0` reports all collected flows, instead of half with the default 0.5, and `interval-1-min` aggregates each connection's records every minute, instead of every 5 seconds by default.
  options:
    a:
      en: |-
        A sampling rate of 0.5, the default, reports only half of the collected flows.
    b:
      en: |-
        `interval-5-sec` is the default aggregation interval, which produces more log entries than the 1-minute interval the team accepted.
    c:
      en: |-
        Firewall Rules Logging records the connections matched by one firewall rule; it isn't VPC Flow Logs for the subnet.
references:
  - title: "Configure VPC Flow Logs | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/using-flow-logs
