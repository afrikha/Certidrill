id: gcpace-3d-gca-folder-new-project
objective: "3.4.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Last month, an administrator enabled Gemini Cloud Assist for the folder `ops-apps` in the Admin for Gemini page of the console, and the SREs use it in every project of the folder for help with Cloud Monitoring data. This week, a new project named `billing-api` was created in `ops-apps`, and the SREs report that Gemini Cloud Assist isn't available there. The SREs have the same roles on `billing-api` as on the other projects.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Wait up to 24 hours, because the folder setting is propagated to new projects automatically.
    - id: b
      text:
        en: |-
          Enable Gemini Cloud Assist for the `billing-api` project, for example by enabling the Gemini Cloud Assist API in it.
    - id: c
      text:
        en: |-
          Run the gcloud CLI to enable Gemini Cloud Assist on the `ops-apps` folder again, so that it covers all its projects.
    - id: d
      text:
        en: |-
          Move `billing-api` out of `ops-apps` and back into it, so that the folder setting is applied to it.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When Gemini Cloud Assist (Preview) is enabled for a folder, the setting covers the projects that exist in the folder at that time. Projects created later aren't enabled automatically, so each new project must be enabled individually, in the console or with the Gemini Cloud Assist API.
  options:
    a:
      en: |-
        The folder setting isn't propagated to projects created afterward, so waiting doesn't help.
    c:
      en: |-
        Folder-level setup is supported only in the console, not with the gcloud CLI or the API.
    d:
      en: |-
        Moving the project doesn't enable the API in it; the folder setting only covered the projects that existed when it was applied.
references:
  - title: "Set up Gemini Cloud Assist | Google Cloud Documentation"
    url: https://docs.cloud.google.com/cloud-assist/set-up-gemini
