id: gcpace-3b-agent-runtime-source-files
objective: "3.1.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team deploys agents to Agent Runtime from a Cloud Build pipeline. The agent is a Python package in a private repository that isn't linked through Developer Connect. The pipeline's build image doesn't install the agent's frameworks, so it can't import the agent to create an in-memory object, and the security policy forbids creating any Cloud Storage bucket in the project.

    Which deployment method should the pipeline use?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy from an agent object with the Agent Platform SDK, and stage the serialized agent in a new Cloud Storage bucket.
    - id: b
      text:
        en: |-
          Deploy from a public Git repository by passing the repository URL and branch in the deployment configuration.
    - id: c
      text:
        en: |-
          Deploy from source files: package the code with its requirements file, and declare the entry point module, entry point object, and class methods.
    - id: d
      text:
        en: |-
          Deploy the package as a Cloud Run service with `gcloud run deploy --source .`, and register the service URL as the agent.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Deploying from source files is the method Google recommends for CI/CD pipelines: the configuration lists the source packages, the entry point module and object, the class methods to expose, and optionally a requirements file. It needs no agent object and no Cloud Storage staging bucket, which fits both constraints.
  options:
    a:
      en: |-
        This method needs an importable in-memory agent and a staging bucket, which the pipeline can't provide and the policy forbids.
    b:
      en: |-
        Deployment from a Git URL is for public repositories; a private repository requires a Developer Connect link, which doesn't exist here.
    d:
      en: |-
        A Cloud Run service isn't an Agent Runtime deployment, so the agent loses the managed agent runtime that the team targets.
references:
  - title: "Deploy an agent | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent
