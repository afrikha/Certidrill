id: gcpace-3b-run-tagged-revision-min
objective: "3.1.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Cloud Run service `ledger` in `asia-northeast1` has always been deployed with `--min-instances=2` on each revision. The team now wants to keep a traffic tag on every new revision for debugging, while only the newest revision receives traffic. The service must keep 2 warm instances for the traffic-serving revision, keep autoscaling under load, and not run idle instances for tagged revisions that receive no traffic.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Keep `--min-instances=2` on each new revision, and add `--max-instances=2` so that tagged revisions can't start more instances.
    - id: b
      text:
        en: |-
          Set a service-level minimum with `--min=2` on the service, and deploy new revisions with `--min-instances=default`.
    - id: c
      text:
        en: |-
          Switch the service to manual scaling with `gcloud run services update ledger --region=asia-northeast1 --scaling=2`.
    - id: d
      text:
        en: |-
          Keep `--min-instances=2` on each new revision, and deploy the revisions with `--no-cpu-throttling` so that idle instances aren't billed.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A revision-level minimum starts instances for every revision that is in the traffic split or has a tag, so tagged revisions without traffic keep idle instances. A service-level minimum (`--min`) is divided among revisions in proportion to their traffic, so all 2 warm instances go to the revision that serves 100%. Clearing the revision-level value with `default` on new deployments avoids mixing the two settings, as Google recommends.
  options:
    a:
      en: |-
        The revision-level minimum still starts 2 idle instances for every tagged revision, and a revision maximum of 2 also stops the serving revision from scaling under load.
    c:
      en: |-
        Manual scaling fixes the instance count at 2, so the service no longer autoscales under load.
    d:
      en: |-
        Disabling CPU throttling selects instance-based billing, where idle instances are billed at the full rate for their whole lifetime; it makes the waste worse.
references:
  - title: "Set minimum instances for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/min-instances
