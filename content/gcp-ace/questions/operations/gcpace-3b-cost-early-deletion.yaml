id: gcpace-3b-cost-early-deletion
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uploads a 10 TiB set of backup archives to a Coldline bucket every month and deletes each set 30 days after upload, when the next set arrives. The finance team asks you how the storage of each set will be billed, so that it can estimate the monthly cost.

    What should you tell the finance team?
body:
  options:
    - id: a
      text:
        en: |-
          Each set is billed as 90 days of Coldline storage: 30 days of storage, plus an early deletion charge for the remaining 60 days.
    - id: b
      text:
        en: |-
          Each set is billed for 30 days of Coldline storage only, because deleting the objects stops the storage charges.
    - id: c
      text:
        en: |-
          Each set is billed for 30 days of Coldline storage, plus a retrieval fee on the 10 TiB when the objects are deleted.
    - id: d
      text:
        en: |-
          Each set is billed at the Standard storage rate, because objects deleted before 90 days don't qualify for Coldline pricing.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Coldline has a 90-day minimum storage duration. An object deleted, replaced, or moved before then is charged as if it had been stored for the full minimum, so each set is charged for 30 days of storage plus 60 days through the early deletion SKU, at the Coldline rate.
  options:
    b:
      en: |-
        Deletion before the minimum storage duration triggers an early deletion charge for the remaining days.
    c:
      en: |-
        Retrieval fees apply when data is read, copied, moved, or rewritten, not as a fee for deleting it; the extra cost is the early deletion charge.
    d:
      en: |-
        The objects are billed at the Coldline rate; the minimum duration adds an early deletion charge, not a different storage rate.
references:
  - title: "Storage pricing | Google Cloud"
    url: https://cloud.google.com/storage/pricing
