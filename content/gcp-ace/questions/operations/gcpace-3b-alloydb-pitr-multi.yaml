id: gcpace-3b-alloydb-pitr-multi
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The AlloyDB cluster `inventory` in `europe-west1` uses the default continuous backup and recovery settings. A developer dropped a table at 10:42 UTC today (2026-11-27), about 2 hours ago. You must make the data as it was at 10:40 UTC available to the application team for querying, without changing the `inventory` cluster.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run `gcloud alloydb clusters restore inventory --region=europe-west1 --source-cluster=inventory --point-in-time=2026-11-27T10:40:00Z` to roll the cluster back.
    - id: b
      text:
        en: |-
          Run `gcloud alloydb clusters restore inventory-pitr --region=europe-west1 --source-cluster=inventory --point-in-time=2026-11-27T10:40:00Z`.
    - id: c
      text:
        en: |-
          Add a read pool instance to the `inventory` cluster, and give its IP address to the application team.
    - id: d
      text:
        en: |-
          Run `gcloud alloydb backups create inventory-now --cluster=inventory --region=europe-west1`, and restore this backup to a new cluster.
    - id: e
      text:
        en: |-
          Create a primary instance in the `inventory-pitr` cluster with `gcloud alloydb instances create`, and give its connection details to the application team.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Continuous backup and recovery is enabled by default with a 14-day window, so any point in that window can be recovered. A point-in-time restore creates a new cluster from the source cluster and timestamp; you then create a primary instance in the restored cluster to access the data, and the original cluster is untouched.
  options:
    a:
      en: |-
        A restore always creates a new cluster; the command can't roll back the existing `inventory` cluster, and doing so would change it.
    c:
      en: |-
        A read pool serves the current data of `inventory`, in which the table is already dropped.
    d:
      en: |-
        A backup taken now captures the state after the drop, so it doesn't contain the table.
references:
  - title: "Data backup and recovery overview | AlloyDB for PostgreSQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/alloydb/docs/backup/overview
