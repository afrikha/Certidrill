id: gcpace-3b-gcs-temporary-vs-event-hold
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The bucket `gs://claims-archive` has a 1-year retention policy. The 3-year-old object `c-1093.pdf` is part of a legal investigation and must not be deleted or replaced until the legal team releases it. When the hold is released, the object must be deletable immediately so that the normal cleanup can remove it. No other object may be affected.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud storage objects update gs://claims-archive/c-1093.pdf --event-based-hold`, and remove the hold when the legal team releases the object.
    - id: b
      text:
        en: |-
          Increase the bucket's retention period to 4 years, and reduce it again when the legal team releases the object.
    - id: c
      text:
        en: |-
          Run `gcloud storage objects update gs://claims-archive/c-1093.pdf --temporary-hold`, and remove the hold when the legal team releases the object.
    - id: d
      text:
        en: |-
          Run `gcloud storage buckets update gs://claims-archive --default-event-based-hold`, and remove the hold from the object when the legal team releases it.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      While an object has a hold, it can't be deleted or replaced. In a bucket with a retention policy, releasing a temporary hold doesn't change the object's time in the bucket, so a 3-year-old object is deletable as soon as the hold is removed.
  options:
    a:
      en: |-
        Releasing an event-based hold resets the object's time in the bucket for the retention period, so the object would stay protected for another year.
    b:
      en: |-
        Changing the bucket's retention period affects every object in the bucket, not only the investigated one.
    d:
      en: |-
        A default event-based hold applies only to objects created afterward, so it doesn't protect the existing object and it affects all new objects.
references:
  - title: "Object holds | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/object-holds
