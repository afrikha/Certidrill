id: gcpace-3d-psh-alert-roles
objective: "3.4.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An SRE must create an alerting policy from the Service Health dashboard of the project `media-prod` by clicking **Create Alert Policy** and choosing an example template. The Service Health API is enabled, a Cloud Monitoring notification channel already exists, and the SRE has the Personalized Service Health Viewer and Monitoring NotificationChannel Viewer roles on the project. The alerting policy can't be created.

    Which two roles should you grant to the SRE on `media-prod`, following the principle of least privilege? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Monitoring AlertPolicy Editor (`roles/monitoring.alertPolicyEditor`)
    - id: b
      text:
        en: |-
          Service Usage Admin (`roles/serviceusage.serviceUsageAdmin`)
    - id: c
      text:
        en: |-
          Monitoring Viewer (`roles/monitoring.viewer`)
    - id: d
      text:
        en: |-
          Logs Configuration Writer (`roles/logging.configWriter`)
    - id: e
      text:
        en: |-
          Project IAM Admin (`roles/resourcemanager.projectIamAdmin`)
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      To set up a Service Health alert from the dashboard, the documentation lists Logs Configuration Writer, Monitoring AlertPolicy Editor, Monitoring NotificationChannel Viewer and Personalized Service Health Viewer on the project. The SRE already has the last two, so the two missing roles are the ones that allow creating the alerting policy and its log-related configuration.
  options:
    b:
      en: |-
        Service Usage Admin is needed to enable APIs, and the Service Health API is already enabled.
    c:
      en: |-
        Monitoring Viewer grants read-only access to Cloud Monitoring, so it doesn't allow creating an alerting policy.
    e:
      en: |-
        Project IAM Admin lets the SRE change IAM policies, which is far more than needed and still doesn't allow creating the alerting policy directly.
references:
  - title: "Quickstart: Set up an alert | Personalized Service Health | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-health/docs/configure-alerts-dashboard
