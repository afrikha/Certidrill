id: gcpace-3d-lb-status-details
objective: "3.4.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Customers report intermittent errors from a web application behind a global external Application Load Balancer, and logging is enabled on its backend service. In the Logs Explorer, you expand a request log entry of the `http_load_balancer` resource type for one of the failed requests. You need to find the HTTP status code that was returned to the client and the load balancer's explanation of why that status code was returned.

    Which two fields of the entry should you read? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `protoPayload.status`
    - id: b
      text:
        en: |-
          `httpRequest.status`
    - id: c
      text:
        en: |-
          `resource.labels.backend_service_name`
    - id: d
      text:
        en: |-
          `jsonPayload.statusDetails`
    - id: e
      text:
        en: |-
          `severity`
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      The `httpRequest` field of a log entry records the details of the HTTP request, including the response status code in `httpRequest.status`. For Application Load Balancer request logs, `jsonPayload.statusDetails` explains why the load balancer returned that status, for example `response_sent_by_backend` or `failed_to_connect_to_backend`.
  options:
    a:
      en: |-
        `protoPayload` is used by Google-defined payloads such as audit logs; load balancer request logs use `httpRequest` and `jsonPayload`.
    c:
      en: |-
        This resource label names the backend service that handled the request; it gives neither the status code nor the reason for it.
    e:
      en: |-
        The severity is a level derived for the entry, not the HTTP status code, and it doesn't explain why the status was returned.
references:
  - title: "Global external Application Load Balancer logging and monitoring | Cloud Load Balancing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/load-balancing/docs/https/https-logging-monitoring
  - title: "LogEntry | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
