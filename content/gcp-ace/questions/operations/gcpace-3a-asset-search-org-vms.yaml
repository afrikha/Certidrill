id: gcpace-3a-asset-search-org-vms
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company has 40 projects under several folders of its organization (ID 123456789). An operations engineer has the Cloud Asset Viewer role on the organization and works from a project named ops-tools. Each week, the engineer must produce, with a single command, the list of all running Compute Engine VMs across every project of the organization.

    Which command should the engineer run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud asset search-all-resources --scope=projects/ops-tools --asset-types=compute.googleapis.com/Instance --query="state=RUNNING"`
    - id: b
      text:
        en: |-
          `gcloud compute instances list --project=ops-tools --filter="status=RUNNING"`
    - id: c
      text:
        en: |-
          `gcloud compute instances list --zones=us-central1-a,europe-west1-b --filter="status=RUNNING"`
    - id: d
      text:
        en: |-
          `gcloud asset search-all-resources --scope=organizations/123456789 --asset-types=compute.googleapis.com/Instance --query="state=RUNNING"`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Cloud Asset Inventory searches resources across a whole project, folder or organization. With the organization as scope, the Instance asset type and the `state=RUNNING` query, one command returns the running VMs of all 40 projects, and the Cloud Asset Viewer role on the organization grants the search permission.
  options:
    a:
      en: |-
        A project scope limits the search to ops-tools, so the VMs of the 39 other projects are missing.
    b:
      en: |-
        `gcloud compute instances list` works on one project at a time; here it lists only the VMs of ops-tools.
    c:
      en: |-
        Without `--project`, the command still queries only the default project, and the zone list leaves out every other zone.
references:
  - title: "Search for resources | Cloud Asset Inventory | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/search-resources
  - title: "Roles and permissions | Cloud Asset Inventory | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/access-control
