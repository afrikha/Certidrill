id: gcpace-3b-gcs-retention-lock
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A brokerage must keep the trade confirmations in the bucket `gs://trade-confirms` for 7 years. The regulator requires that nobody, including project owners, can delete an object, replace it, or shorten the retention period during those 7 years.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Set a retention policy with `gcloud storage buckets update gs://trade-confirms --retention-period=7y`, and then lock it with `--lock-retention-period`.
    - id: b
      text:
        en: |-
          Enable Object Versioning on the bucket, and add a lifecycle rule that deletes noncurrent versions after 7 years.
    - id: c
      text:
        en: |-
          Set the soft delete duration of the bucket to the maximum value with `--soft-delete-duration`.
    - id: d
      text:
        en: |-
          Set a retention policy with `--retention-period=7y`, and keep it unlocked so that it can be extended if the regulation changes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A retention policy blocks deleting or replacing objects until they reach the retention period. Locking it is irreversible: the policy can no longer be removed or shortened, only lengthened, and the bucket can't be deleted until every object meets the period, which meets the regulator's requirement.
  options:
    b:
      en: |-
        Users with enough permissions can still delete noncurrent versions, so versioning doesn't guarantee retention.
    c:
      en: |-
        Soft delete retains deleted objects for at most 90 days and doesn't prevent deletion.
    d:
      en: |-
        An unlocked policy can be reduced or removed by someone with permissions, so owners could shorten it; a locked policy can still be extended.
references:
  - title: "Bucket Lock | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/bucket-lock
  - title: "gcloud storage buckets update | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/buckets/update
