id: gcpace-3a-image-running-vm-force
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A game studio wants a custom image of the boot disk web-boot of a VM in zone asia-east1-a. The VM serves players and can't be stopped, so the team paused the writing processes and ran `sudo sync` on it. Then `gcloud compute images create web-v5 --source-disk=web-boot --source-disk-zone=asia-east1-a` fails because the disk is attached to a running VM.

    What should you add to the command?
body:
  options:
    - id: a
      text:
        en: |-
          `--family=web`
    - id: b
      text:
        en: |-
          `--storage-location=asia-east1`
    - id: c
      text:
        en: |-
          `--source-disk-project=game-prod`
    - id: d
      text:
        en: |-
          `--force`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      By default, gcloud refuses to create an image from a disk attached to a running VM. The `--force` flag allows it; Google recommends stopping the VM, or at least reducing writes and running `sync` first, as the team did, so that the image is consistent.
  options:
    a:
      en: |-
        `--family` adds the image to an image family; it doesn't lift the restriction on disks of running VMs.
    b:
      en: |-
        `--storage-location` chooses where the image is stored; the command still fails on the running VM's disk.
    c:
      en: |-
        `--source-disk-project` is for a disk in another project; the disk is found, but it is in use by a running VM.
references:
  - title: "Create custom images | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/images/create-custom
