id: gcpace-3c-fw-update-source-ranges
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the VPC network `ops-vpc` of an engineering firm, the VPC firewall rule `allow-office-ssh` allows TCP port 22 from the office range `198.51.100.0/24` to the VMs with the network tag `admin`. A new office uses `203.0.113.0/24` and must get the same access through the same rule. The existing office must keep its access.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute firewall-rules update allow-office-ssh --source-ranges=203.0.113.0/24`
    - id: b
      text:
        en: |-
          `gcloud compute firewall-rules update allow-office-ssh --source-ranges=198.51.100.0/24,203.0.113.0/24`
    - id: c
      text:
        en: |-
          `gcloud compute firewall-rules update allow-office-ssh --destination-ranges=203.0.113.0/24`
    - id: d
      text:
        en: |-
          `gcloud compute firewall-rules create allow-office-ssh --network=ops-vpc --allow=tcp:22 --source-ranges=203.0.113.0/24 --target-tags=admin`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud compute firewall-rules update --source-ranges` replaces the existing list of source ranges instead of adding to it. You must therefore pass both the existing office range and the new one.
  options:
    a:
      en: |-
        The new list replaces the old one, so the existing office would lose its SSH access.
    c:
      en: |-
        Destination ranges restrict the destinations of the traffic; the new office is a source of ingress connections.
    d:
      en: |-
        A rule named `allow-office-ssh` already exists in the project, so the creation fails, and the requirement is to use the same rule.
references:
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
