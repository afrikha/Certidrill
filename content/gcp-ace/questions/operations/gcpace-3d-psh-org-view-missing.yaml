id: gcpace-3d-psh-org-view-missing
objective: "3.4.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A central operations team uses the organization view of Personalized Service Health to see the incidents that affect any project of the organization and the number of impacted projects. The team has the permissions needed to list organization events and impacts. During a recent incident, several projects that run affected workloads didn't appear in the incident's Impact tab.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create an aggregated sink at the organization that routes the Service Health logs of all projects to one log bucket.
    - id: b
      text:
        en: |-
          Grant the team the Personalized Service Health Viewer role on each of the missing projects.
    - id: c
      text:
        en: |-
          Move the missing projects into the folder that contains the projects already shown in the organization view.
    - id: d
      text:
        en: |-
          Enable the Service Health API in each of the missing projects.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The organization view aggregates the incidents of the projects in which the Service Health API is enabled, so the API must be enabled in every relevant project of the organization. Once it is enabled, those projects appear in the Impact tab and in their own dashboards.
  options:
    a:
      en: |-
        An aggregated sink centralizes the log entries, but the organization view doesn't read them, and projects without the API don't produce Service Health data.
    b:
      en: |-
        The team already has the organization-level permissions; the projects are missing because they have no Service Health data, not because of the team's access.
    c:
      en: |-
        The folder of a project doesn't decide whether it appears in the organization view; the Service Health API does.
references:
  - title: "View organization incidents in the Google Cloud console | Personalized Service Health | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-health/docs/organization-views
