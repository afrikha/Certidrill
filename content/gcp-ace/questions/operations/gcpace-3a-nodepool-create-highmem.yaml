id: gcpace-3a-nodepool-create-highmem
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A zonal GKE Standard cluster named data-cluster in us-central1-a has one node pool of e2-standard-4 nodes. A new in-memory cache needs nodes with more memory, and the existing nodes and workloads must stay as they are.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud container clusters create cache-cluster --zone=us-central1-a --machine-type=n2-highmem-8 --num-nodes=2`.
    - id: b
      text:
        en: |-
          Run `gcloud container clusters resize data-cluster --zone=us-central1-a --num-nodes=6`.
    - id: c
      text:
        en: |-
          Run `gcloud container node-pools create highmem-pool --cluster=data-cluster --zone=us-central1-a --machine-type=n2-highmem-8 --num-nodes=2`.
    - id: d
      text:
        en: |-
          Run `gcloud compute instance-templates create highmem-tpl --machine-type=n2-highmem-8`, and then add the VMs to the cluster.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A node pool is a group of nodes with the same configuration inside a cluster, so adding a pool with a high-memory machine type gives the cache suitable nodes. The existing pool and its workloads aren't touched.
  options:
    a:
      en: |-
        This creates a second cluster to manage instead of adding nodes to the existing one.
    b:
      en: |-
        Resizing only adds more e2-standard-4 nodes to the existing pool; it doesn't add more memory per node.
    d:
      en: |-
        GKE creates and manages node VMs through node pools; VMs created from your own instance template don't join the cluster as nodes.
references:
  - title: "Add and manage node pools | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-pools
