id: gcpace-3a-windows-credentials
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You created a Windows Server VM named win-report in zone us-east1-c from a public Windows image. SSH for Windows is not enabled on the VM. Before you can sign in over RDP, you need a username and password for a local account named ops-admin.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute reset-windows-password win-report --user=ops-admin --zone=us-east1-c`.
    - id: b
      text:
        en: |-
          Run `gcloud compute ssh ops-admin@win-report --zone=us-east1-c` to generate a key pair for the account.
    - id: c
      text:
        en: |-
          Run `gcloud compute instances get-serial-port-output win-report --zone=us-east1-c` and read the password.
    - id: d
      text:
        en: |-
          Run `gcloud compute instances add-metadata win-report --zone=us-east1-c --metadata=enable-oslogin=TRUE`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Windows VMs authenticate RDP users with a username and password, and `gcloud compute reset-windows-password` creates the local account if needed and returns a new password for it. You then use these credentials in the RDP client.
  options:
    b:
      en: |-
        SSH key pairs authenticate SSH sessions, and SSH isn't enabled on this Windows VM; RDP needs a password.
    c:
      en: |-
        The serial port output shows boot and agent messages; it doesn't give you a password for a new account.
    d:
      en: |-
        OS Login controls SSH access to Linux VMs through IAM; it doesn't create Windows RDP credentials.
references:
  - title: "Manage accounts and credentials on Windows VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/windows/generating-credentials
  - title: "gcloud compute reset-windows-password | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/compute/reset-windows-password
