id: gcpace-3c-dbcenter-fleet-view
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company has about 60 projects that contain Cloud SQL, AlloyDB for PostgreSQL and Spanner instances. The database team lead wants one place in the Google Cloud console that lists all database instances of the organization and shows their top health issues, such as instances that aren't highly available or have no automated backups. The solution must require the least effort.

    What should you use?
body:
  options:
    - id: a
      text:
        en: |-
          Cloud Asset Inventory, with an export of the database resources to BigQuery.
    - id: b
      text:
        en: |-
          Database Center in the Google Cloud console.
    - id: c
      text:
        en: |-
          Query Insights, enabled on every Cloud SQL and AlloyDB instance.
    - id: d
      text:
        en: |-
          A Cloud Monitoring dashboard per project that charts every instance's uptime.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Database Center gives a centralized view of the database fleet across projects, with the number of issues in each health category such as availability configuration, data protection and security. It supports Cloud SQL, AlloyDB, Spanner, Bigtable, Firestore and Memorystore for Redis without building anything.
  options:
    a:
      en: |-
        Cloud Asset Inventory lists the resources but doesn't evaluate health issues such as missing backups or high availability; building the report in BigQuery takes effort.
    c:
      en: |-
        Query Insights diagnoses query performance on one instance at a time; it doesn't list the fleet or show configuration health issues, and it doesn't cover Spanner.
    d:
      en: |-
        Per-project dashboards don't give one organization-wide view, and an uptime chart doesn't reveal backup or high-availability configuration issues.
references:
  - title: "Database Center overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/database-center/docs/overview
