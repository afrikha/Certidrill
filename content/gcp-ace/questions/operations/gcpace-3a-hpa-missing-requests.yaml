id: gcpace-3a-hpa-missing-requests
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You created a HorizontalPodAutoscaler that targets 70% average CPU utilization for the Deployment reports on a GKE Standard cluster. During load tests, `kubectl get hpa` shows `<unknown>/70%` in the TARGETS column and the replica count never changes. The Deployment's manifest sets no resources section for its containers.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Increase `maxReplicas` in the HorizontalPodAutoscaler so that it has room to scale.
    - id: b
      text:
        en: |-
          Add CPU requests to the containers of the reports Deployment.
    - id: c
      text:
        en: |-
          Enable cluster autoscaling on the node pool that runs the reports Pods.
    - id: d
      text:
        en: |-
          Enable vertical Pod autoscaling on the cluster with `--enable-vertical-pod-autoscaling`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A utilization target is a percentage of the containers' requests, so every container needs a CPU request for the HorizontalPodAutoscaler to compute it. Without requests, it can't calculate the metric and takes no action.
  options:
    a:
      en: |-
        The limit isn't the problem: the autoscaler can't compute utilization, so it never scales, whatever the maximum.
    c:
      en: |-
        The cluster autoscaler adds nodes for Pods that can't be scheduled; it doesn't let the HorizontalPodAutoscaler compute CPU utilization.
    d:
      en: |-
        Enabling vertical Pod autoscaling on the cluster doesn't add requests to the Deployment; it only makes VerticalPodAutoscaler objects available.
references:
  - title: "Horizontal Pod autoscaling | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/horizontalpodautoscaler
  - title: "Configuring horizontal Pod autoscaling | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/horizontal-pod-autoscaling
