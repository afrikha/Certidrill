id: gcpace-3c-alert-metric-absence
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company's order workers run on Compute Engine VMs that have no external IP addresses and listen on no port. Each worker writes the user-defined metric `custom.googleapis.com/orders/processed` every minute. When a worker hangs, it stops writing the metric and logs nothing, while its VM keeps running. The team must be alerted when a worker hasn't written the metric for 30 minutes.

    What should you create?
body:
  options:
    - id: a
      text:
        en: |-
          An uptime check against the internal IP address of each VM, with an alerting policy on the check results.
    - id: b
      text:
        en: |-
          A log-based metric that counts the error entries of the workers, with a metric-threshold condition above 0.
    - id: c
      text:
        en: |-
          A metric-absence condition on `compute.googleapis.com/instance/uptime` with a trigger absence time of 30 minutes.
    - id: d
      text:
        en: |-
          A metric-absence condition on `custom.googleapis.com/orders/processed` with a trigger absence time of 30 minutes.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A metric-absence condition triggers when a monitored time series stops receiving data for the trigger absence time, here 30 minutes, which can be set up to 23.5 hours. Monitoring the worker's own metric detects the hang even though the VM keeps running.
  options:
    a:
      en: |-
        The workers listen on no port, so an uptime check has nothing to probe, and it wouldn't detect a hung worker.
    b:
      en: |-
        A hung worker logs nothing, so a count of error entries stays at zero.
    c:
      en: |-
        The VM keeps running when a worker hangs, so the uptime metric keeps arriving and the condition never triggers.
references:
  - title: "Create metric-absence alerting policies | Cloud Monitoring | Google Cloud Documentation"
    url: https://docs.cloud.google.com/monitoring/alerts/metric-absence
