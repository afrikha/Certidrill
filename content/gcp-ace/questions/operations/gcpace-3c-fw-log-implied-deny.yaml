id: gcpace-3c-fw-log-implied-deny
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In the VPC network `lab-vpc` of a university, a few VPC firewall rules allow specific ingress traffic with priorities between 900 and 1100. All other ingress traffic is blocked by the implied deny rule. The security team now wants log entries for the blocked ingress TCP and UDP connections, without blocking any traffic that is allowed today.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create an ingress rule that denies all protocols from `0.0.0.0/0` with priority 65534 and `--enable-logging`.
    - id: b
      text:
        en: |-
          Run `gcloud compute firewall-rules update implied-deny-ingress --enable-logging`.
    - id: c
      text:
        en: |-
          Enable the Data Access audit logs of the Compute Engine API for the project.
    - id: d
      text:
        en: |-
          Create an ingress rule that denies all protocols from `0.0.0.0/0` with priority 0 and `--enable-logging`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Logging isn't supported for the implied deny ingress and implied allow egress rules. An explicit deny-all ingress rule with priority 65534 is evaluated after every existing allow rule, so it blocks only the traffic that the implied rule already blocked, and its logging records those connections.
  options:
    b:
      en: |-
        Implied rules aren't firewall rule resources that you can update, and logging can't be enabled for them.
    c:
      en: |-
        Data Access audit logs record API calls that read data or configuration, not network connections blocked by the firewall.
    d:
      en: |-
        A deny rule with priority 0 is evaluated before the allow rules, so it would block the traffic that is allowed today.
references:
  - title: "Firewall policy rules logging overview | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewall-rules-logging
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
