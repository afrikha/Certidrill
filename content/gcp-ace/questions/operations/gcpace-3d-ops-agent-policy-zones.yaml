id: gcpace-3d-ops-agent-policy-zones
objective: "3.4.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs about 300 Linux VMs labeled `env=prod` in the zones `europe-west1-b` and `europe-west1-c` of one project. You must make sure that the latest Ops Agent is installed on all these VMs through agent policies. The legacy agents are removed, and you already ran the preparation script that enables the OS Config API and the OS Config metadata. You wrote a policy file `prod-ops.yaml` with `packageState: installed`, `version: latest` and an `instanceFilter` that includes the label `env=prod`.

    What should you do next?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute instances ops-agents policies create prod-ops --zone=europe-west1-b,europe-west1-c --file=prod-ops.yaml`.
    - id: b
      text:
        en: |-
          Run `gcloud compute instances ops-agents policies create` once with `--zone=europe-west1-b` and once with `--zone=europe-west1-c`, each with `--file=prod-ops.yaml`.
    - id: c
      text:
        en: |-
          Run `gcloud compute instances ops-agents policies create prod-ops --file=prod-ops.yaml` without `--zone`, so that the policy covers every zone of the project.
    - id: d
      text:
        en: |-
          Add `instanceFilter: all: True` to `prod-ops.yaml` next to the label criteria, and create the policy in `europe-west1-b`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Agent policies are applied only to the VMs of the zone specified at creation, so covering two zones takes one policy per zone, created with `gcloud compute instances ops-agents policies create POLICY_ID --zone=ZONE --file=FILE`. The same policy file, with its label filter, can be used for both.
  options:
    a:
      en: |-
        An agent policy is created in one zone: the `--zone` flag takes a single zone, not a list.
    c:
      en: |-
        `--zone` is a required flag of the command, and a policy never applies to the VMs of other zones.
    d:
      en: |-
        `all: True` can't be combined with other criteria, and a policy in `europe-west1-b` still wouldn't cover `europe-west1-c`.
references:
  - title: "Use agent policies (GA) | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/agent-policies
