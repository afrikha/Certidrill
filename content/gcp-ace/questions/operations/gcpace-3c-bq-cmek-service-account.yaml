id: gcpace-3c-bq-cmek-service-account
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A pharmaceutical company must protect a new BigQuery dataset in `europe-west3` with a customer-managed encryption key. A security administrator created the key `bq-key` in a key ring in `europe-west3` and will set it as the dataset's default key. Before that, an identity must be allowed to use the key.

    Which identity should receive the Cloud KMS CryptoKey Encrypter/Decrypter role on the key?
body:
  options:
    - id: a
      text:
        en: |-
          The Compute Engine default service account of the project, `PROJECT_NUMBER-compute@developer.gserviceaccount.com`.
    - id: b
      text:
        en: |-
          The user account of the security administrator who will run the `bq update --default_kms_key` command.
    - id: c
      text:
        en: |-
          The BigQuery encryption service account of the project, displayed by running `bq show --encryption_service_account`.
    - id: d
      text:
        en: |-
          The Cloud Storage service agent of the project, displayed by running `gcloud storage service-agent`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      BigQuery encrypts and decrypts CMEK-protected data with its own service account, `bq-PROJECT_NUMBER@bigquery-encryption.iam.gserviceaccount.com`. That account needs `roles/cloudkms.cryptoKeyEncrypterDecrypter` on the key; `bq show --encryption_service_account` displays it and creates it if it doesn't exist yet.
  options:
    a:
      en: |-
        The Compute Engine default service account is used by VMs, not by BigQuery to call Cloud KMS.
    b:
      en: |-
        Users don't perform the encryption; BigQuery calls Cloud KMS with its service account, so a grant to the administrator doesn't let BigQuery use the key.
    d:
      en: |-
        The Cloud Storage service agent encrypts Cloud Storage objects; it isn't involved in BigQuery table encryption.
references:
  - title: "Customer-managed Cloud KMS keys | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/customer-managed-encryption
