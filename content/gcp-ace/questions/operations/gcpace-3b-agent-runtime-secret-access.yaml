id: gcpace-3b-agent-runtime-secret-access
objective: "3.1.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An agent deployed to Agent Runtime must call a partner API with a key stored in Secret Manager as the secret `partner-key`. The project hosts several other agents that run as the default AI Platform Reasoning Engine Service Agent. Only this agent may read the key, following the principle of least privilege.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the agent with a dedicated service account, reference `partner-key` in the agent's environment variables, and grant that service account Secret Manager Secret Accessor on the secret.
    - id: b
      text:
        en: |-
          Grant the AI Platform Reasoning Engine Service Agent Secret Manager Secret Accessor on the secret, and reference `partner-key` in the agent's environment variables.
    - id: c
      text:
        en: |-
          Read the key value from Secret Manager when you deploy, and pass it to the agent as a plain environment variable in the deployment configuration.
    - id: d
      text:
        en: |-
          Deploy the agent with a dedicated service account, reference `partner-key` in the agent's environment variables, and grant that service account Secret Manager Secret Accessor on the project.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Environment variables of an Agent Runtime deployment can reference a Secret Manager secret and version instead of a value. The identity that reads it should be specific to the agent, such as a dedicated service account that the deployer can use with Service Account User; granting Secret Manager Secret Accessor on the single secret keeps the scope minimal. The documentation advises against granting this role to the shared service agents.
  options:
    b:
      en: |-
        The Reasoning Engine Service Agent is shared by every agent of the project that has no other identity, so all of them could read the key.
    c:
      en: |-
        A plain value is stored in the deployment configuration, where anyone who can view the agent sees it, instead of being protected by Secret Manager.
    d:
      en: |-
        A project-level grant lets the agent read every secret in the project, which breaks least privilege.
references:
  - title: "Deploy an agent | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent
  - title: "Set up the environment | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime/setup
