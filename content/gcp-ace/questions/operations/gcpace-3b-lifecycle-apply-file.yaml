id: gcpace-3b-lifecycle-apply-file
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You wrote the file `rules.json` with a lifecycle configuration that moves objects to Coldline 90 days after creation and deletes them 365 days after creation. You must apply it to the existing bucket `gs://iot-raw` so that its current and future objects follow these rules automatically.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud storage buckets update gs://iot-raw --default-storage-class=COLDLINE`
    - id: b
      text:
        en: |-
          `gcloud storage objects update gs://iot-raw/** --storage-class=COLDLINE`
    - id: c
      text:
        en: |-
          `gcloud storage buckets update gs://iot-raw --lifecycle-file=rules.json`
    - id: d
      text:
        en: |-
          `gcloud storage buckets create gs://iot-raw --lifecycle-file=rules.json`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud storage buckets update --lifecycle-file` sets the bucket's lifecycle configuration from a JSON file and replaces any existing rules. Cloud Storage then applies the actions asynchronously to objects that meet the conditions; a configuration change can take up to 24 hours to take effect.
  options:
    a:
      en: |-
        The default storage class applies only to new objects that are uploaded without a class; it neither moves existing objects later nor deletes anything.
    b:
      en: |-
        This rewrites every object to Coldline immediately, including recent ones, and doesn't delete anything at 365 days.
    d:
      en: |-
        The bucket already exists, so the create command fails.
references:
  - title: "gcloud storage buckets update | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/buckets/update
  - title: "Object Lifecycle Management | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/lifecycle
