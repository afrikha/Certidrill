id: gcpace-3b-lifecycle-num-newer-versions
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The versioned bucket `gs://cad-drawings` grows quickly because engineers overwrite their files many times a day. For each file, you must keep the live version and at most the two most recent noncurrent versions, and delete older noncurrent versions automatically.

    Which lifecycle rule should you add?
body:
  options:
    - id: a
      text:
        en: |-
          Action `Delete` with the conditions `isLive: false` and `numNewerVersions: 2`.
    - id: b
      text:
        en: |-
          Action `Delete` with the conditions `isLive: false` and `numNewerVersions: 3`.
    - id: c
      text:
        en: |-
          Action `Delete` with the conditions `isLive: false` and `daysSinceNoncurrentTime: 2`.
    - id: d
      text:
        en: |-
          Action `Delete` with the condition `age: 2`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `numNewerVersions: N` matches an object version that has at least N newer versions, and the live version counts as one of them. The most recent noncurrent version has 1 newer version and the second most recent has 2, so a value of 3 deletes only the third noncurrent version and older ones.
  options:
    a:
      en: |-
        With 2, a version is deleted as soon as it has two newer versions, so the second most recent noncurrent version is deleted and only one noncurrent version is kept.
    c:
      en: |-
        This deletes versions by time, two days after they become noncurrent, so files overwritten many times a day could keep far more than two versions.
    d:
      en: |-
        An `age` condition without `isLive` also matches live objects; in a versioned bucket, deleting a live object makes it noncurrent, so current files would disappear.
references:
  - title: "Object Lifecycle Management | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/lifecycle
  - title: "Configuration examples for Object Lifecycle Management | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/lifecycle-configurations
