id: gcpace-3b-gke-gpu-nodepool-multi
objective: "3.1.13"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The GKE Standard cluster `ml-std` in `us-central1` has only CPU node pools. You must run an inference Deployment on NVIDIA T4 GPUs in `us-central1-b`. GKE must install the GPU drivers, so that the team has no driver DaemonSet to maintain, and only Pods that use GPUs may run on the GPU nodes.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create the node pool with `--accelerator=type=nvidia-tesla-t4,count=1,gpu-driver-version=disabled`.
    - id: b
      text:
        en: |-
          Run `gcloud container node-pools create t4-pool --cluster=ml-std --location=us-central1 --node-locations=us-central1-b --machine-type=n1-standard-8 --accelerator=type=nvidia-tesla-t4,count=1,gpu-driver-version=default`.
    - id: c
      text:
        en: |-
          In the Pod template, request `cpu: "8"` so that the Pods can only fit on the larger GPU nodes.
    - id: d
      text:
        en: |-
          In the Pod template, set `resources.limits` with `nvidia.com/gpu: 1`.
    - id: e
      text:
        en: |-
          In the Pod template, add the node selector `cloud.google.com/gke-tpu-accelerator: nvidia-tesla-t4`.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A node pool created with `--accelerator` and `gpu-driver-version=default` gets GPU nodes on which GKE installs the default NVIDIA driver. Because the cluster also has non-GPU node pools, GKE taints the GPU nodes with `nvidia.com/gpu=present:NoSchedule`. A Pod that sets the `nvidia.com/gpu` resource limit gets a GPU, and GKE automatically adds the matching toleration, so only GPU Pods land on these nodes.
  options:
    a:
      en: |-
        `disabled` skips the automatic driver installation, so the team would have to install and maintain the drivers itself.
    c:
      en: |-
        A CPU request doesn't allocate a GPU to the container, and CPU-only Pods could still be placed on nodes that have enough CPU.
    e:
      en: |-
        `cloud.google.com/gke-tpu-accelerator` is the node label for TPU node pools; GPU nodes carry `cloud.google.com/gke-accelerator`.
references:
  - title: "Run GPUs in GKE Standard node pools | GKE AI/ML | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/gpus
