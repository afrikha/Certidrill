id: gcpace-3b-run-split-blocks-new-revision
objective: "3.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Cloud Run service `quotes` in `europe-west1` was used for a canary test: its traffic is split 50/50 between revisions `quotes-00007-zid` and `quotes-00008-mer`. A developer then fixed a bug and ran `gcloud run deploy quotes --image=europe-west1-docker.pkg.dev/ins-prod/apps/quotes:1.9 --region=europe-west1`. The deployment succeeded and created `quotes-00009-tug`, but no request reaches it. All users must now be served by the newest revision, and later deployments must receive the traffic automatically.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud run services update-traffic quotes --region=europe-west1 --to-revisions=quotes-00009-tug=100`.
    - id: b
      text:
        en: |-
          Run `gcloud run deploy` again with the same image and add `--tag=current` so that the new revision is promoted.
    - id: c
      text:
        en: |-
          Run `gcloud run services update-traffic quotes --region=europe-west1 --to-tags=quotes-00009-tug=100`.
    - id: d
      text:
        en: |-
          Run `gcloud run services update-traffic quotes --region=europe-west1 --to-latest`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Once traffic is split or assigned to specific revisions, later deployments keep that pattern, so the new revision gets no traffic. `--to-latest` removes the split and sends 100% of the traffic to the latest revision, and because traffic now follows the latest revision instead of a named one, every future deployment receives the traffic automatically.
  options:
    a:
      en: |-
        Pinning 100% to `quotes-00009-tug` fixes today's routing, but traffic stays assigned to a named revision, so the next deployment again receives no traffic.
    b:
      en: |-
        A tag only adds a URL for the revision; it doesn't change the traffic split, and the redeployment again follows the existing 50/50 pattern.
    c:
      en: |-
        `--to-tags` expects the name of an existing tag, not a revision name, and nothing has tagged the new revision.
references:
  - title: "Rollbacks, gradual rollouts, and traffic migration | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
  - title: "gcloud run services update-traffic | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/run/services/update-traffic
