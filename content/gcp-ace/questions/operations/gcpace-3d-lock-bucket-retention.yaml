id: gcpace-3d-lock-bucket-retention
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank routes its security logs to a user-defined log bucket named `sec-archive` in the `europe-west3` location, with a retention of 2,555 days. Auditors require that nobody, including the project owners, can shorten this retention or delete the bucket before the retention period ends.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud logging buckets update sec-archive --location=europe-west3 --retention-days=3650`.
    - id: b
      text:
        en: |-
          Run `gcloud logging buckets update sec-archive --location=europe-west3 --restricted-fields=protoPayload`.
    - id: c
      text:
        en: |-
          Remove the Logs Configuration Writer role from every user and group that has it on the project.
    - id: d
      text:
        en: |-
          Run `gcloud logging buckets update sec-archive --location=europe-west3 --locked`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Locking a log bucket locks its retention policy and prevents the bucket from being deleted until the retention period has passed. The lock is irreversible, so no principal, including a project owner, can shorten the retention afterward.
  options:
    a:
      en: |-
        A longer retention can still be shortened later, and the bucket can still be deleted by anyone with the needed permissions.
    b:
      en: |-
        Restricted fields add field-level access control to the listed fields of the entries; they don't protect the retention or the bucket.
    c:
      en: |-
        Project owners keep the permissions to update and delete buckets through their own role, and the change can be reverted at any time.
references:
  - title: "Configure log buckets | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/buckets
