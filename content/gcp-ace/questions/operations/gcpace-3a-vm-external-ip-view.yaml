id: gcpace-3a-vm-external-ip-view
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer reports that the running VM web-3 in zone us-west1-b received a new ephemeral external IP address after it was stopped and started. You need to find the current external IP address of web-3 from Cloud Shell. No static IP address is reserved in the project.

    Which two commands display it? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute addresses list --filter="region:us-west1"`
    - id: b
      text:
        en: |-
          `gcloud compute instances list --filter="name=web-3"`
    - id: c
      text:
        en: |-
          `gcloud compute instances describe web-3 --zone=us-west1-b --format="get(networkInterfaces[0].accessConfigs[0].natIP)"`
    - id: d
      text:
        en: |-
          `gcloud compute networks subnets describe default --region=us-west1`
    - id: e
      text:
        en: |-
          `gcloud compute instances get-serial-port-output web-3 --zone=us-west1-b`
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      The default table output of `gcloud compute instances list` includes INTERNAL_IP, EXTERNAL_IP and STATUS columns, so filtering on the name shows the current address. `gcloud compute instances describe` returns the VM resource, where the external address of the first interface is the `natIP` field of its access configuration.
  options:
    a:
      en: |-
        `gcloud compute addresses list` shows reserved addresses only; an ephemeral address assigned at start time isn't listed.
    d:
      en: |-
        A subnet description shows the subnet's internal ranges, not the addresses assigned to individual VMs.
    e:
      en: |-
        The serial port output contains boot and guest messages, not a reliable view of the external address that Compute Engine assigned.
references:
  - title: "Get a list of VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/get-list
