id: gcpace-3b-cost-pricing-calculator
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup plans a new workload: 40 TB of Standard storage in a regional Cloud Storage bucket, 2 TB of BigQuery storage, and one Cloud SQL instance. Before anything is deployed, the finance team wants an estimate of the monthly cost that it can share with management.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Export Cloud Billing data to BigQuery, and query the export for the costs of these products.
    - id: b
      text:
        en: |-
          Build an estimate in the Google Cloud Pricing Calculator, and share it with management.
    - id: c
      text:
        en: |-
          Create a budget with alert thresholds for the project, and send the alerts to management.
    - id: d
      text:
        en: |-
          Run the planned BigQuery queries with `bq query --dry_run`, and multiply the bytes by the on-demand price.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Pricing Calculator lets you add and configure products, such as Cloud Storage, BigQuery, and Cloud SQL, with their expected quantities to produce a cost estimate that you can share. It works before any resource exists.
  options:
    a:
      en: |-
        The billing export contains actual charges, and nothing has been deployed yet.
    c:
      en: |-
        Budgets alert on actual or forecast spending of running resources; they don't estimate a planned workload.
    d:
      en: |-
        A dry run estimates the bytes processed by a query, not the storage and instance costs of the workload.
references:
  - title: "Google Cloud Pricing Calculator"
    url: https://cloud.google.com/products/calculator
