id: gcpace-3a-hpa-inspect-status
objective: "3.1.8"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A HorizontalPodAutoscaler named checkout-hpa manages the Deployment checkout in the namespace shop. A developer asks why checkout still has 4 replicas during a traffic peak. You need to see the current and target CPU utilization that checkout-hpa uses for its decisions.

    Which two commands should you run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `kubectl get hpa checkout-hpa --namespace=shop`
    - id: b
      text:
        en: |-
          `kubectl top pods --namespace=shop`
    - id: c
      text:
        en: |-
          `kubectl describe hpa checkout-hpa --namespace=shop`
    - id: d
      text:
        en: |-
          `kubectl get deployment checkout --namespace=shop`
    - id: e
      text:
        en: |-
          `gcloud container node-pools list --cluster=CLUSTER --location=LOCATION`
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      `kubectl get hpa` shows the TARGETS column with the current and target utilization, plus the minimum, maximum and current replicas. `kubectl describe hpa` shows the same metrics with the autoscaler's conditions and recent scaling events.
  options:
    b:
      en: |-
        `kubectl top pods` shows the Pods' current CPU and memory usage, not the utilization target that the autoscaler compares it with.
    d:
      en: |-
        The Deployment status shows the replica counts, not the metric values that the autoscaler uses.
    e:
      en: |-
        Node pools describe the nodes of the cluster; they don't show Pod autoscaling metrics.
references:
  - title: "Configuring horizontal Pod autoscaling | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/horizontal-pod-autoscaling
