id: gcpace-3c-sink-writer-identity
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You created a log sink in the project `app-prod` whose destination is the BigQuery dataset `central_logs` in the project `sec-logging`. The sink's filter matches entries, but no table appears in the dataset. `gcloud logging sinks describe` shows the sink's `writerIdentity`, and you will grant roles to that principal.

    Which roles should you grant, and where?
body:
  options:
    - id: a
      text:
        en: |-
          The Logs Writer role and the BigQuery Data Editor role, in the project `sec-logging`.
    - id: b
      text:
        en: |-
          The Logs Writer role and the BigQuery Data Viewer role, in the project `sec-logging`.
    - id: c
      text:
        en: |-
          The Logs Writer role and the BigQuery Data Editor role, in the project `app-prod`.
    - id: d
      text:
        en: |-
          The Logs Bucket Writer role and the BigQuery Job User role, in the project `sec-logging`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A sink writes to its destination with its writer identity, which must be authorized in the project that stores the destination. The documentation asks for the Logs Writer role for all destinations, plus BigQuery Data Editor for a BigQuery dataset. Until the grant exists, the sink can't create the tables or write the entries.
  options:
    b:
      en: |-
        BigQuery Data Viewer grants read access only; the sink must create tables and write rows in the dataset.
    c:
      en: |-
        Roles granted in the sink's own project don't give access to a dataset stored in `sec-logging`.
    d:
      en: |-
        Logs Bucket Writer is the destination role for a log bucket, not for a BigQuery dataset, and BigQuery Job User runs jobs without granting write access to the dataset.
references:
  - title: "Route logs to supported destinations | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/export/configure_export_v2
