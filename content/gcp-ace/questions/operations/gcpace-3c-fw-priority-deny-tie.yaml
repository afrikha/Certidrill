id: gcpace-3c-fw-priority-deny-tie
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team created the VPC firewall rule `deny-all-ingress`, which denies all protocols from `0.0.0.0/0` to all VMs of the network `api-vpc` with priority 1000. You must now allow HTTPS (TCP 443) from the partner range `198.51.100.0/24` to the VMs with the network tag `api`, without changing the security team's rule.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create an ingress rule that allows `tcp:443` from `198.51.100.0/24` to the tag `api` with priority 1000.
    - id: b
      text:
        en: |-
          Create an ingress rule that allows `tcp:443` from `198.51.100.0/24` to the tag `api` with priority 1100.
    - id: c
      text:
        en: |-
          Create an egress rule that allows `tcp:443` to `198.51.100.0/24` from the tag `api` with priority 900.
    - id: d
      text:
        en: |-
          Create an ingress rule that allows `tcp:443` from `198.51.100.0/24` to the tag `api` with priority 900.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Among matching VPC firewall rules, the rule with the lowest priority value wins, so an allow rule with priority 900 takes precedence over the deny rule with priority 1000. Rules are stateful, so the return traffic is allowed.
  options:
    a:
      en: |-
        When an allow rule and a deny rule have the same priority, the deny rule is enforced.
    b:
      en: |-
        Priority 1100 is lower than 1000, so the deny rule still wins.
    c:
      en: |-
        The connections are inbound to the VMs; an egress rule doesn't override an ingress deny rule.
references:
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
