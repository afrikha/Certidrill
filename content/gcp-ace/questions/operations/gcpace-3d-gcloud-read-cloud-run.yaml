id: gcpace-3d-gcloud-read-cloud-run
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Cloud Run service named `checkout` started failing after a deployment. From Cloud Shell, you need to retrieve the 50 most recent entries of this service with a severity of `ERROR` or higher that were written during the last 2 hours, in JSON format, to attach them to a support ticket.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="checkout" AND severity=ERROR' --freshness=2h --limit=50 --format=json`
    - id: b
      text:
        en: |-
          `gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="checkout" AND severity>=ERROR' --limit=50 --format=json`
    - id: c
      text:
        en: |-
          `gcloud logging logs list --filter='resource.labels.service_name="checkout" AND severity>=ERROR' --limit=50 --format=json`
    - id: d
      text:
        en: |-
          `gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="checkout" AND severity>=ERROR' --freshness=2h --limit=50 --format=json`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `gcloud logging read` returns log entries that match a filter, newest first by default. The filter selects the `cloud_run_revision` entries of the `checkout` service with `severity>=ERROR`, `--freshness=2h` limits the results to the last 2 hours, and `--limit=50` with `--format=json` returns the 50 most recent entries as JSON.
  options:
    a:
      en: |-
        `severity=ERROR` matches only that exact level and misses the `CRITICAL`, `ALERT` and `EMERGENCY` entries, which are higher than `ERROR`.
    b:
      en: |-
        Without `--freshness`, the command uses its default of 1 day, so it can return entries older than 2 hours when fewer than 50 errors occurred in that window.
    c:
      en: |-
        `gcloud logging logs list` lists the names of the logs in the project, not their entries.
references:
  - title: "gcloud logging read | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/logging/read
  - title: "Logging and viewing logs in Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/logging
