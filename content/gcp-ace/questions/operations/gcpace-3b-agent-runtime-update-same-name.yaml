id: gcpace-3b-agent-runtime-update-same-name
objective: "3.1.14"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A web application calls an agent deployed to Agent Runtime through its resource name, `projects/travel-agents/locations/us-central1/reasoningEngines/4815`. A developer fixed a bug in the agent code in a notebook and must deploy the fix so that the web application keeps calling the same resource name, with no change to the application.

    What should the developer do?
body:
  options:
    - id: a
      text:
        en: |-
          Call the Agent Platform SDK's `create` method again with the fixed agent object and the same configuration.
    - id: b
      text:
        en: |-
          Call the Agent Platform SDK's `update` method with the existing resource name and the fixed agent object.
    - id: c
      text:
        en: |-
          Delete the agent with `force=True`, and then create it again with the same display name and configuration.
    - id: d
      text:
        en: |-
          Call the SDK's `create` method with the fixed agent object and the same `display_name` so that it replaces the existing agent.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A deployed agent is a `ReasoningEngine` resource identified by its resource name, `projects/PROJECT/locations/LOCATION/reasoningEngines/ID`. The SDK's update call takes that name with the new agent and redeploys it in place, so callers keep using the same resource name.
  options:
    a:
      en: |-
        Each create call deploys a new `ReasoningEngine` resource with a new ID, so the application would still call the old agent.
    c:
      en: |-
        The recreated agent gets a new resource ID, and deleting with `force=True` also removes child resources such as sessions.
    d:
      en: |-
        The display name is only descriptive metadata; a create call still produces a new resource with a different ID.
references:
  - title: "Deploy an agent | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent
