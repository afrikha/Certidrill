id: gcpace-3a-pods-all-namespaces-wide
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A GKE Standard cluster hosts applications in about 15 namespaces. Before a node maintenance, you need one list of every Pod in the cluster, whatever its namespace, that shows the name of the node each Pod runs on. Your kubectl context already points to the cluster.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `kubectl get pods -o wide`
    - id: b
      text:
        en: |-
          `kubectl get nodes -o wide`
    - id: c
      text:
        en: |-
          `kubectl get pods --all-namespaces --show-labels`
    - id: d
      text:
        en: |-
          `kubectl get pods --all-namespaces -o wide`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `--all-namespaces` (or `-A`) lists the Pods of every namespace, and `-o wide` adds columns such as the Pod IP and the NODE where each Pod runs. Together they give the full Pod-to-node list.
  options:
    a:
      en: |-
        Without `--all-namespaces`, kubectl lists only the Pods of the current namespace, usually default.
    b:
      en: |-
        This lists the nodes with their IP addresses and versions, not the Pods that run on them.
    c:
      en: |-
        `--show-labels` adds the Pod labels, not the node column, so you can't see where each Pod runs.
references:
  - title: "Install kubectl and configure cluster access | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl
