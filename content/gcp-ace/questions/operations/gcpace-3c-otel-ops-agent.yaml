id: gcpace-3c-otel-ops-agent
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer's Java application runs on Compute Engine VMs that have the Ops Agent 2.40 installed. The product team wants a new business metric, the number of orders placed per minute, in Cloud Monitoring. You must use the approach that Google recommends to instrument application code for user-defined metrics.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Write a log entry for each order, and create a counter log-based metric that counts these entries.
    - id: b
      text:
        en: |-
          Call the Cloud Monitoring API `timeSeries.create` method from the code with the metric type `logging.googleapis.com/user/orders`.
    - id: c
      text:
        en: |-
          Instrument the code with the OpenTelemetry SDK, and send the metrics to the OTLP receiver of the Ops Agent.
    - id: d
      text:
        en: |-
          Deploy a PodMonitoring resource of Managed Service for Prometheus that scrapes the application's metrics endpoint.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Google recommends OpenTelemetry to instrument code for user-defined metrics. The Ops Agent, from version 2.37.0, provides an OTLP receiver that collects the metrics of applications instrumented with OpenTelemetry SDKs and sends them to Google Cloud.
  options:
    a:
      en: |-
        Log-based metrics derive metrics from log entries; they aren't the recommended way to instrument code for a metric.
    b:
      en: |-
        User-defined metrics written through the API must use a prefix such as `custom.googleapis.com/`; the `logging.googleapis.com/user/` types belong to log-based metrics.
    d:
      en: |-
        PodMonitoring is a Kubernetes resource for GKE clusters; the application runs on Compute Engine VMs.
references:
  - title: "User-defined metrics overview | Cloud Monitoring | Google Cloud Documentation"
    url: https://docs.cloud.google.com/monitoring/custom-metrics
  - title: "Collect OpenTelemetry Protocol (OTLP) metrics and traces | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/otlp
