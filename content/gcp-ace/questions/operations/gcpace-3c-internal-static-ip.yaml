id: gcpace-3c-internal-static-ip
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company will create a database VM `db-1` in the subnet `db-subnet` (`10.10.2.0/24`) in `us-east1`. Application servers are configured with the address `10.10.2.10`, so the VM must use this internal address, and the address must stay reserved if the VM is deleted and recreated.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute addresses create db-ip --region=us-east1 --subnet=db-subnet --addresses=10.10.2.10`, then create the VM with `--private-network-ip=10.10.2.10`.
    - id: b
      text:
        en: |-
          Run `gcloud compute addresses create db-ip --global --addresses=10.10.2.10`, then create the VM with `--private-network-ip=10.10.2.10`.
    - id: c
      text:
        en: |-
          Run `gcloud compute addresses create db-ip --region=us-east1 --subnet=db-subnet --addresses=10.10.2.10 --purpose=SHARED_LOADBALANCER_VIP`, then create the VM with `--private-network-ip=10.10.2.10`.
    - id: d
      text:
        en: |-
          Run `gcloud compute addresses create db-ip --region=us-east1 --network-tier=PREMIUM --addresses=10.10.2.10`, then create the VM with `--private-network-ip=10.10.2.10`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A static internal IPv4 address is reserved in a region and a subnet with `--subnet`, and `--addresses` picks a specific address from the subnet's primary range. The VM is then created with that address, and the reservation remains when the VM is deleted, so a recreated VM can use it again.
  options:
    b:
      en: |-
        A VM's internal address is a regional resource in a subnet; a global reservation can't be used as a VM's primary internal address.
    c:
      en: |-
        The `SHARED_LOADBALANCER_VIP` purpose lets several internal load balancer forwarding rules share an address; it isn't meant for a VM's network interface.
    d:
      en: |-
        With `--region` and without `--subnet`, the gcloud reference describes the reservation as a regional external address, so the command doesn't reserve the internal address `10.10.2.10` in `db-subnet`.
references:
  - title: "Reserve a static internal IP address | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/reserve-static-internal-ip-address
