id: gcpace-3a-ar-find-node-sa
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A GKE Standard cluster named claims in us-east4 has three node pools, created by different teams over two years. Pods on one of the pools fail to pull images from Artifact Registry with a 403 error. Before you change any IAM policy, you need to know which IAM service account the nodes of each node pool run as.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `kubectl get serviceaccounts --all-namespaces`
    - id: b
      text:
        en: |-
          `gcloud container clusters describe claims --location=us-east4 --format="table(nodePools.name,nodePools.config.serviceAccount)"`
    - id: c
      text:
        en: |-
          `gcloud container clusters describe claims --location=us-east4 --format="value(workloadIdentityConfig.workloadPool)"`
    - id: d
      text:
        en: |-
          `gcloud iam service-accounts list --format="table(email,disabled)"`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The kubelet pulls images with the service account of the node VMs, which is set per node pool in its node configuration. This command lists each pool with its `config.serviceAccount` value, where `default` means the Compute Engine default service account, so you know which principal needs read access to the repository.
  options:
    a:
      en: |-
        Kubernetes ServiceAccounts are identities inside the cluster; kubelet image pulls don't use them.
    c:
      en: |-
        The workload pool identifies the Workload Identity Federation for GKE pool of the cluster, not the node service accounts.
    d:
      en: |-
        This lists every service account of the project but doesn't show which one each node pool uses.
references:
  - title: "Troubleshoot image pulls | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/troubleshooting/image-pulls
