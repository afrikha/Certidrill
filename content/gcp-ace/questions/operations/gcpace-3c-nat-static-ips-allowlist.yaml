id: gcpace-3c-nat-static-ips-allowlist
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce company's VMs in `us-central1` reach the internet through the Cloud NAT gateway `nat-gw` on the Cloud Router `nat-router`, which uses automatic NAT IP address allocation. A payment provider will accept API calls only from two source IP addresses that the company registers once and that never change.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Reserve two global static external IP addresses, then run `gcloud compute routers nats update nat-gw --router=nat-router --region=us-central1 --nat-external-ip-pool=nat-ip-1,nat-ip-2`.
    - id: b
      text:
        en: |-
          Reserve two regional static external IP addresses in `us-central1`, then run `gcloud compute routers nats update nat-gw --router=nat-router --region=us-central1 --nat-external-ip-pool=nat-ip-1,nat-ip-2`.
    - id: c
      text:
        en: |-
          Keep automatic allocation, and run `gcloud compute routers nats update nat-gw --router=nat-router --region=us-central1 --enable-endpoint-independent-mapping`.
    - id: d
      text:
        en: |-
          Keep automatic allocation, and run `gcloud compute routers nats update nat-gw --router=nat-router --region=us-central1 --auto-network-tier=STANDARD`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With automatic allocation, Cloud NAT adds and removes addresses as needed, so you can't predict them. For an allowlist, you use manual assignment: reserve static regional external IP addresses and give them to the gateway with `--nat-external-ip-pool`.
  options:
    a:
      en: |-
        Cloud NAT uses static regional external addresses; global addresses are for global load balancers.
    c:
      en: |-
        Endpoint-independent mapping controls how source ports are reused; the NAT IP addresses still change with automatic allocation.
    d:
      en: |-
        Changing the tier releases the current addresses and allocates a new automatic set, which still can't be predicted.
references:
  - title: "IP addresses and ports | Cloud NAT | Google Cloud Documentation"
    url: https://docs.cloud.google.com/nat/docs/ports-and-addresses
