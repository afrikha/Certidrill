id: gcpace-3a-snapshot-schedule-attach
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A healthcare startup has a zonal Persistent Disk named records-data in zone us-central1-a, attached to a running VM. You must back up the disk every day at 02:00 UTC and keep each backup for 14 days, with no scripts to maintain.

    Which two commands should you run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute resource-policies create snapshot-schedule daily-14 --region=us-central1 --daily-schedule --start-time=02:00 --max-retention-days=14`
    - id: b
      text:
        en: |-
          `gcloud compute instances add-resource-policies records-vm --zone=us-central1-a --resource-policies=daily-14`
    - id: c
      text:
        en: |-
          `gcloud compute disks snapshot records-data --zone=us-central1-a --snapshot-names=records-daily`
    - id: d
      text:
        en: |-
          `gcloud compute disks add-resource-policies records-data --zone=us-central1-a --resource-policies=daily-14`
    - id: e
      text:
        en: |-
          `gcloud compute images create records-daily --source-disk=records-data --source-disk-zone=us-central1-a --force`
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A snapshot schedule is a resource policy created in the region of the disk, with a frequency, a start time in UTC and a maximum retention in days. Attaching it to the disk with `gcloud compute disks add-resource-policies` makes Compute Engine take and delete the snapshots automatically.
  options:
    b:
      en: |-
        Snapshot schedules are attached to disks, not VMs; resource policies added to an instance cover other policy types, such as instance schedules.
    c:
      en: |-
        `gcloud compute disks snapshot` takes one snapshot now; it doesn't repeat daily or delete old snapshots after 14 days.
    e:
      en: |-
        An image is meant for creating new VMs, and this command creates a single image with no schedule or retention.
references:
  - title: "Create schedules for disk snapshots | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/scheduled-snapshots
