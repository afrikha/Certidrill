id: gcpace-3c-subnet-auto-mode-limit
objective: "3.3.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A startup still uses the auto mode VPC network `default`. Its `us-central1` subnet has the automatically assigned range `10.128.0.0/20` and needs many more addresses. You plan to run `gcloud compute networks subnets expand-ip-range` on this subnet and want the broadest range that the command accepts for it.

    Which prefix length should you specify?
body:
  options:
    - id: a
      text:
        en: |-
          `--prefix-length=9`
    - id: b
      text:
        en: |-
          `--prefix-length=12`
    - id: c
      text:
        en: |-
          `--prefix-length=16`
    - id: d
      text:
        en: |-
          `--prefix-length=18`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For subnets of an auto mode network, or of a network converted from auto mode, the broadest prefix that you can expand to is /16. A broader range would conflict with the subnets that auto mode creates in the other regions inside `10.128.0.0/9`.
  options:
    a:
      en: |-
        A /9 range would cover the whole `10.128.0.0/9` block used by the auto mode subnets of every region.
    b:
      en: |-
        A /12 range is broader than /16, the limit for auto mode subnets, and would overlap other regions' auto mode subnets.
    d:
      en: |-
        /18 is accepted, but it isn't the broadest range possible: /16 is.
references:
  - title: "Quickstart: Create and manage VPC networks | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/create-modify-vpc-networks
  - title: "Subnets | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/subnets
