id: gcpace-3b-spanner-version-time-backup
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Spanner database `billing-db` on the instance `prod-sp` has a version retention period of 3 days. At 08:00 UTC today (2026-11-27), a faulty batch job corrupted rows in many tables, and no backup exists from before the job. It's now 14:00 UTC. You must create a complete copy of the database as it was at 07:00 UTC, as a new database on the same instance.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud spanner backups create billing-bk --instance=prod-sp --database=billing-db --retention-period=7d`, and restore the backup to a new database.
    - id: b
      text:
        en: |-
          Run `gcloud spanner backups create billing-bk --instance=prod-sp --database=billing-db --version-time=2026-11-27T07:00:00Z --retention-period=7d`, and restore the backup to a new database.
    - id: c
      text:
        en: |-
          Run `gcloud spanner databases execute-sql billing-db --instance=prod-sp --read-timestamp=2026-11-27T07:00:00Z` with a SELECT statement for each table.
    - id: d
      text:
        en: |-
          Set `version_retention_period` to `7d` on `billing-db` with a DDL statement, and then create a backup of the database.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Spanner backup captures the database at its `versionTime`, which can be set to an earlier timestamp as long as it's within the database's version retention period; 07:00 is 7 hours ago, well within 3 days. The backup is then restored with `gcloud spanner databases restore`, which always creates a new database.
  options:
    a:
      en: |-
        Without `--version-time`, the backup captures the database at creation time, which already contains the corrupted rows.
    c:
      en: |-
        A stale read returns query results at that timestamp, not a complete database copy with its schema.
    d:
      en: |-
        A longer retention period only keeps more history from now on, and a backup taken afterward still captures the current, corrupted state.
references:
  - title: "Backups overview | Spanner | Google Cloud Documentation"
    url: https://docs.cloud.google.com/spanner/docs/backup
