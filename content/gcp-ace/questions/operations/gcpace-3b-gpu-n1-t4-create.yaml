id: gcpace-3b-gpu-n1-t4-create
objective: "3.1.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A video company needs a Compute Engine VM with 8 vCPUs and one NVIDIA T4 GPU for transcoding tests in zone `us-east1-d`, which offers T4 GPUs. The project has enough GPU quota in the region.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute instances create transcode-1 --zone=us-east1-d --machine-type=n1-standard-8 --accelerator=type=nvidia-tesla-t4,count=1 --maintenance-policy=TERMINATE --boot-disk-size=50GB --image-family=ubuntu-2204-lts --image-project=ubuntu-os-cloud`
    - id: b
      text:
        en: |-
          `gcloud compute instances create transcode-1 --zone=us-east1-d --machine-type=n1-standard-8 --accelerator=type=nvidia-tesla-t4,count=1 --maintenance-policy=MIGRATE --boot-disk-size=50GB --image-family=ubuntu-2204-lts --image-project=ubuntu-os-cloud`
    - id: c
      text:
        en: |-
          `gcloud compute instances create transcode-1 --zone=us-east1-d --machine-type=e2-standard-8 --accelerator=type=nvidia-tesla-t4,count=1 --maintenance-policy=TERMINATE --boot-disk-size=50GB --image-family=ubuntu-2204-lts --image-project=ubuntu-os-cloud`
    - id: d
      text:
        en: |-
          `gcloud compute instances create transcode-1 --zone=us-east1-d --machine-type=g2-standard-8 --accelerator=type=nvidia-tesla-t4,count=1 --maintenance-policy=TERMINATE --boot-disk-size=50GB --image-family=ubuntu-2204-lts --image-project=ubuntu-os-cloud`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      T4 GPUs are attached to N1 general-purpose VMs with `--accelerator=type=nvidia-tesla-t4,count=1`. VMs with GPUs can't be live migrated, so the host maintenance policy must be `TERMINATE`; the zone must offer the GPU model and the boot disk must be at least 40 GB.
  options:
    b:
      en: |-
        `MIGRATE` is the default host maintenance behavior, but instances with GPUs can't live migrate, so the request is rejected.
    c:
      en: |-
        E2 machine types don't support attached GPUs; the T4 attaches only to N1 VMs.
    d:
      en: |-
        G2 machine types come with NVIDIA L4 GPUs as part of the machine type; a T4 can't be attached to them.
references:
  - title: "Create an N1 VM that has attached GPUs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/gpus/create-gpu-vm-general-purpose
