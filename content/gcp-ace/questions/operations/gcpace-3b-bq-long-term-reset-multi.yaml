id: gcpace-3b-bq-long-term-reset-multi
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A BigQuery table partitioned by day holds 3 years of sales data. The finance team's cost estimate assumes that partitions older than 90 days stay at the long-term storage rate. The data team performs the following actions on partitions that are older than 90 days.

    Which two actions return the affected partitions to active storage pricing? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Running SELECT queries that read the old partitions.
    - id: b
      text:
        en: |-
          Running a DML UPDATE that corrects rows in the old partitions.
    - id: c
      text:
        en: |-
          Exporting the old partitions to Cloud Storage.
    - id: d
      text:
        en: |-
          Loading late-arriving rows into the old partitions.
    - id: e
      text:
        en: |-
          Creating a view that reads the old partitions.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A table or partition that isn't modified for 90 consecutive days is billed at the long-term rate, about 50% lower, and each partition is evaluated separately. Modifying a partition, for example with DML or by loading data into it, returns it to the active rate and restarts the 90-day timer.
  options:
    a:
      en: |-
        Querying a table doesn't reset the long-term storage timer.
    c:
      en: |-
        Exporting data from a table doesn't modify it, so the timer isn't reset.
    e:
      en: |-
        Creating a view over a table doesn't modify the table.
references:
  - title: "BigQuery pricing | Google Cloud"
    url: https://cloud.google.com/bigquery/pricing
