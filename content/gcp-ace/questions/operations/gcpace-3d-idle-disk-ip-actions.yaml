id: gcpace-3d-idle-disk-ip-actions
objective: "3.4.13"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Active Assist shows two recommendations in the project `legacy-apps`: the persistent disk `reports-data`, detached from every VM for 45 days, and the static external IP address `old-web-ip`, attached to no resource for 30 days. The owners confirm that nothing uses these resources anymore, but the data of `reports-data` must remain recoverable. You must remove the charges of these idle resources as far as possible.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Delete the `reports-data` disk directly, without any other step.
    - id: b
      text:
        en: |-
          Create a snapshot of the `reports-data` disk, and then delete the disk.
    - id: c
      text:
        en: |-
          Resize the `reports-data` disk to a smaller size, and keep it detached.
    - id: d
      text:
        en: |-
          Release the `old-web-ip` static external IP address.
    - id: e
      text:
        en: |-
          Mark both recommendations as claimed with `gcloud recommender recommendations mark-claimed`.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      For a disk that has been detached for at least 15 days, the idle persistent disk recommendation is to snapshot the disk and then delete it, which keeps the data recoverable at a lower cost. For a static IP address that hasn't been attached for at least 15 days, the recommendation is to delete (release) it, which removes its whole cost.
  options:
    a:
      en: |-
        Deleting the disk without a snapshot loses its data, which must remain recoverable.
    c:
      en: |-
        The size of a persistent disk can be increased but not decreased, and a detached disk still generates charges.
    e:
      en: |-
        Marking recommendations as claimed only tracks that someone is working on them; it doesn't change the resources or their charges.
references:
  - title: "View and apply idle resources recommendations | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/viewing-and-applying-idle-pd-recommendations
  - title: "Modify the size of a Persistent Disk | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/resize-persistent-disk
