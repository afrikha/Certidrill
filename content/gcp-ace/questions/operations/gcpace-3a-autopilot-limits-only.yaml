id: gcpace-3a-autopilot-limits-only
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team migrates a Deployment from a Standard cluster to a GKE Autopilot cluster. Each container sets `limits` of 1 CPU and 2Gi of memory but sets no `requests`. The Pods use the default general-purpose platform.

    Which CPU and memory requests does Autopilot use for each container?
body:
  options:
    - id: a
      text:
        en: |-
          1 vCPU and 2 GiB, the values of the limits
    - id: b
      text:
        en: |-
          0.5 vCPU and 2 GiB, the default values
    - id: c
      text:
        en: |-
          50m CPU and 52 MiB, the minimum values
    - id: d
      text:
        en: |-
          0.25 vCPU and 1 GiB, a quarter of the CPU limit
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When a container sets limits without requests, Autopilot sets the requests equal to the limits, as Kubernetes does by default. The containers are billed for 1 vCPU and 2 GiB each.
  options:
    b:
      en: |-
        The defaults apply only when neither requests nor limits are set.
    c:
      en: |-
        Minimums only replace requests that are too low; here the requests come from the limits.
    d:
      en: |-
        Autopilot doesn't derive requests as a fraction of the limits.
references:
  - title: "Resource requests in Autopilot | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-resource-requests
