id: gcpace-3a-k8s-statefulset-db
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company wants to run a three-node database cluster on GKE. Each replica needs its own persistent disk that stays attached to that replica after a restart, and a stable network name such as db-0, db-1 and db-2 so that the replicas can find each other.

    Which Kubernetes resources should you use?
body:
  options:
    - id: a
      text:
        en: |-
          A Deployment with three replicas that mount one shared PersistentVolumeClaim, and a ClusterIP Service
    - id: b
      text:
        en: |-
          A DaemonSet that runs one replica on each of three nodes, and a NodePort Service
    - id: c
      text:
        en: |-
          A ReplicaSet with three replicas and an emptyDir volume, and a LoadBalancer Service
    - id: d
      text:
        en: |-
          A StatefulSet with a volumeClaimTemplates section, and a matching headless Service
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A StatefulSet gives each Pod a persistent identity and a stable hostname (db-0, db-1, db-2) and creates one PersistentVolumeClaim per Pod from its volumeClaimTemplates. The matching headless Service provides the DNS records the replicas use to discover each other.
  options:
    a:
      en: |-
        Deployment Pods are interchangeable with random names, and sharing one claim doesn't give each replica its own disk.
    b:
      en: |-
        A DaemonSet runs one Pod per node, follows the node count rather than a fixed replica count, and gives no stable per-replica storage.
    c:
      en: |-
        An emptyDir volume is deleted with its Pod, and ReplicaSet Pods have no stable names.
references:
  - title: "About StatefulSets in GKE | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/statefulset
