id: gcpace-3a-image-family-rollback
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's instance templates create VMs from the custom image family payments-os. The family contains the images payments-os-v1, payments-os-v2 and payments-os-v3, all ACTIVE. Image v3 has a kernel bug, so new VMs must use v2 again through the family, without editing the templates. The security team needs v3 kept in the project for analysis.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute images deprecate payments-os-v2 --state=ACTIVE`.
    - id: b
      text:
        en: |-
          Run `gcloud compute images delete payments-os-v3`.
    - id: c
      text:
        en: |-
          Run `gcloud compute images deprecate payments-os-v3 --state=DEPRECATED --replacement=payments-os-v2`.
    - id: d
      text:
        en: |-
          Run `gcloud compute images create payments-os-v4 --source-image=payments-os-v3 --family=payments-os`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An image family points to its most recent image that isn't deprecated, so deprecating v3 rolls the family back to v2 while v3 stays in the project. The templates keep referencing the family, and the `--replacement` value tells users which image to use instead.
  options:
    a:
      en: |-
        v2 is already ACTIVE; setting the same state changes nothing, and the family still resolves to v3, the newest image.
    b:
      en: |-
        Deleting v3 would roll the family back too, but the security team needs v3 kept for analysis.
    d:
      en: |-
        A new image built from v3 carries the same bug and becomes the newest image of the family, so new VMs still get the bug.
references:
  - title: "Image families best practices | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/images/image-families-best-practices
