id: gcpace-3a-nodepool-autoscaling-total
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A regional GKE Standard cluster named media in europe-west1 has three zones and two node pools, default-pool and render-pool. You must enable cluster autoscaling on render-pool only. The pool must never have fewer than 3 nodes or more than 9 nodes in total, and the autoscaler must be free to place the nodes in whichever zones have capacity.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud container node-pools update render-pool --cluster=media --location=europe-west1 --enable-autoscaling --min-nodes=3 --max-nodes=9`
    - id: b
      text:
        en: |-
          `gcloud container clusters update media --location=europe-west1 --enable-autoscaling --total-min-nodes=3 --total-max-nodes=9`
    - id: c
      text:
        en: |-
          `gcloud container node-pools update render-pool --cluster=media --location=europe-west1 --enable-autoscaling --min-nodes=1 --max-nodes=3`
    - id: d
      text:
        en: |-
          `gcloud container node-pools update render-pool --cluster=media --location=europe-west1 --enable-autoscaling --total-min-nodes=3 --total-max-nodes=9 --location-policy=ANY`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `--total-min-nodes` and `--total-max-nodes` set the limits for the whole pool across all zones, and the ANY location policy lets the autoscaler use whichever zones have capacity. The command targets render-pool, so default-pool keeps its settings.
  options:
    a:
      en: |-
        `--min-nodes` and `--max-nodes` are per-zone limits, so this allows 9 to 27 nodes in the three zones.
    b:
      en: |-
        Without `--node-pool`, `gcloud container clusters update --enable-autoscaling` applies to default-pool, not render-pool.
    c:
      en: |-
        Per-zone limits of 1 to 3 force at least one node in every zone and at most three in any zone, so the autoscaler can't place nodes freely.
references:
  - title: "About GKE cluster autoscaling | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/cluster-autoscaler
