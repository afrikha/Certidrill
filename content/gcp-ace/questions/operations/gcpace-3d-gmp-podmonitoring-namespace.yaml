id: gcpace-3d-gmp-podmonitoring-namespace
objective: "3.4.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A GKE Standard cluster runs version 1.30, and Managed Service for Prometheus managed collection is enabled. The cart team's pods run in the namespace `shop` with the label `app=cart` and expose Prometheus metrics on a container port named `metrics`. The cart team has Kubernetes RBAC permissions only in the `shop` namespace and must configure the scraping of its own pods.

    What should the cart team do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a `ClusterPodMonitoring` resource that selects the pods labeled `app=cart` and scrapes the `metrics` port.
    - id: b
      text:
        en: |-
          Create a `PodMonitoring` resource in the `shop` namespace that selects the pods labeled `app=cart` and scrapes the `metrics` port.
    - id: c
      text:
        en: |-
          Edit the `OperatorConfig` resource in the `gmp-public` namespace to add a scrape job for the pods labeled `app=cart`.
    - id: d
      text:
        en: |-
          Deploy a Prometheus server with Helm in the `shop` namespace, and configure a scrape job for the pods labeled `app=cart`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With managed collection, scraping is configured through custom resources. A `PodMonitoring` resource (`monitoring.googleapis.com/v1`) is namespaced: it scrapes only the pods of its own namespace that match its `selector`, on the `endpoints` it lists, so the cart team can create it with permissions limited to `shop`.
  options:
    a:
      en: |-
        `ClusterPodMonitoring` is a cluster-scoped resource that can select pods in all namespaces, so creating it needs cluster-level permissions that the team doesn't have.
    c:
      en: |-
        The `OperatorConfig` resource in `gmp-public` holds cluster-wide settings such as kubelet scraping and rule evaluation, not scrape jobs for application pods, and the team has no access to that namespace.
    d:
      en: |-
        A self-managed Prometheus server adds servers to operate and doesn't use the managed collection that is already enabled.
references:
  - title: "Get started with managed collection | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed
