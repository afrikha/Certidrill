id: gcpace-3b-workstations-creator-multi
objective: "3.1.16"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Twelve developers in the group `backend-devs@example.com` must each create their own workstation from the Cloud Workstations configuration `java-ide` and use it. They must not create or modify clusters or configurations, and they must not be able to access other developers' workstations.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant the group Cloud Workstations Admin (`roles/workstations.admin`) on the project.
    - id: b
      text:
        en: |-
          Grant the group Cloud Workstations User (`roles/workstations.user`) on the configuration `java-ide`.
    - id: c
      text:
        en: |-
          Grant the group Cloud Workstations Creator (`roles/workstations.workstationCreator`) on the configuration `java-ide`.
    - id: d
      text:
        en: |-
          Grant the group Cloud Workstations Operation Viewer (`roles/workstations.operationViewer`) on the project.
    - id: e
      text:
        en: |-
          Grant the group Cloud Workstations Policy Admin (`roles/workstations.policyAdmin`) on the project.
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      Cloud Workstations Creator on a configuration lets a user view it, create workstations from it, and use them; Cloud Workstations automatically grants the creator Cloud Workstations User on each workstation that they create, so each developer reaches only their own. The documentation requires Cloud Workstations Operation Viewer on the project together with the User and Creator roles.
  options:
    a:
      en: |-
        Cloud Workstations Admin can create and update clusters and configurations, which the developers must not do.
    b:
      en: |-
        Cloud Workstations User doesn't allow creating workstations, and granted on the configuration it would give access to every workstation created from it.
    e:
      en: |-
        Policy Admin can change the IAM policies of workstations, so developers could grant themselves access to other workstations.
references:
  - title: "Access control with IAM | Cloud Workstations | Google Cloud Documentation"
    url: https://docs.cloud.google.com/workstations/docs/access-control
