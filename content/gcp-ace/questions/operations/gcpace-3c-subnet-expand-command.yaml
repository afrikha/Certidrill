id: gcpace-3c-subnet-expand-command
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company's custom mode VPC network has a subnet `web-subnet` in `us-east1` with the primary IPv4 range `10.0.0.0/24`. The subnet is almost out of addresses, and the range `10.0.0.0/22` isn't used anywhere else in the network or in any peered network. You must add addresses for new VMs without interrupting the traffic of the running VMs.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute networks subnets expand-ip-range web-subnet --region=us-east1 --prefix-length=22`.
    - id: b
      text:
        en: |-
          Run `gcloud compute networks subnets expand-ip-range web-subnet --region=us-east1 --prefix-length=26`.
    - id: c
      text:
        en: |-
          Run `gcloud compute networks subnets update web-subnet --region=us-east1 --add-secondary-ranges=web-extra=10.0.4.0/22`.
    - id: d
      text:
        en: |-
          Create a new subnet with the range `10.0.0.0/22`, and recreate the running VMs in the new subnet.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `expand-ip-range` with a smaller prefix length broadens the primary IPv4 range of an existing subnet, here from /24 to /22. Traffic within the subnet isn't interrupted during the expansion, and the new range doesn't overlap any other range.
  options:
    b:
      en: |-
        A /26 prefix is narrower than /24: a primary range can only be expanded, never shrunk.
    c:
      en: |-
        A secondary range provides alias IP addresses; VM primary internal addresses still come from the full primary range.
    d:
      en: |-
        Recreating the VMs interrupts them, and `10.0.0.0/22` would overlap the existing subnet's range, so the new subnet can't be created anyway.
references:
  - title: "Quickstart: Create and manage VPC networks | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/create-modify-vpc-networks
