id: gcpace-3c-dbcenter-missing-data
objective: "3.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An operations engineer at a gaming company has the Database Center Viewer role on the organization. The engineer reports two observations: a Spanner instance created 20 minutes ago doesn't appear in Database Center yet, and the BigQuery datasets of the company appear in the inventory but never show any health issue, while the Cloud SQL instances do.

    Which two statements explain these observations? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Database Center doesn't support Spanner instances, which are listed only in the Spanner page of the console.
    - id: b
      text:
        en: |-
          BigQuery health issues appear only after you grant the engineer the Recommender Viewer role (`roles/recommender.viewer`).
    - id: c
      text:
        en: |-
          Database Center data isn't real time: it usually updates within minutes, but an update can take up to 24 hours.
    - id: d
      text:
        en: |-
          Database Center computes the health issues once a week, so new resources appear after the next weekly scan.
    - id: e
      text:
        en: |-
          Database Center shows BigQuery in the inventory only, without health issue monitoring.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      Database Center isn't a real-time view: its data usually updates within a few minutes but can take up to 24 hours, so a new instance can be missing for a while. BigQuery is supported for the inventory only, so its datasets never show health issues, unlike Cloud SQL, AlloyDB, Spanner or Bigtable.
  options:
    a:
      en: |-
        Spanner is one of the products for which Database Center shows the inventory, metrics and health issues.
    b:
      en: |-
        Recommender Viewer adds recommender-related health issues for supported products; BigQuery has no health issue monitoring in Database Center at all.
    d:
      en: |-
        Database Center usually reflects changes within minutes; there's no weekly scan.
references:
  - title: "Database Center overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/database-center/docs/overview
