id: gcpace-3a-ar-image-path
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer pushed version 1.4 of an image named web to a standard Docker repository named team-images in Artifact Registry. The repository is in region europe-west1 of the project acme-apps. You must reference this image in the `image` field of a GKE Deployment.

    Which value should you use?
body:
  options:
    - id: a
      text:
        en: |-
          `docker.pkg.dev/europe-west1/acme-apps/team-images/web:1.4`
    - id: b
      text:
        en: |-
          `europe-west1.pkg.dev/acme-apps/team-images/web:1.4`
    - id: c
      text:
        en: |-
          `europe-west1-docker.pkg.dev/acme-apps/team-images/web:1.4`
    - id: d
      text:
        en: |-
          `europe-west1-docker.pkg.dev/team-images/acme-apps/web:1.4`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Artifact Registry Docker images use the path LOCATION-docker.pkg.dev/PROJECT-ID/REPOSITORY/IMAGE:TAG. Here the location is europe-west1, the project acme-apps and the repository team-images.
  options:
    a:
      en: |-
        The location is part of the host name (europe-west1-docker.pkg.dev), not the first element of the path.
    b:
      en: |-
        The host name of a Docker repository includes the `-docker` format suffix after the location.
    d:
      en: |-
        The project ID comes before the repository name in the path; this value inverts them.
references:
  - title: "Deploying to Google Kubernetes Engine | Artifact Registry | Google Cloud Documentation"
    url: https://docs.cloud.google.com/artifact-registry/docs/integrate-gke
