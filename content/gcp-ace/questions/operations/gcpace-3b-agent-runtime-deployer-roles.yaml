id: gcpace-3b-agent-runtime-deployer-roles
objective: "3.1.14"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A data scientist at a bank deploys an agent to Agent Runtime from a notebook by passing the in-memory agent object to the Agent Platform SDK. The SDK stages the agent's files in a Cloud Storage staging bucket of the same project before Agent Runtime builds the deployment. You must grant the data scientist the predefined roles that the setup guide requires for this deployment method.

    Which two roles should you grant? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Agent Platform User (`roles/aiplatform.user`)
    - id: b
      text:
        en: |-
          Cloud Run Admin (`roles/run.admin`)
    - id: c
      text:
        en: |-
          Notebooks Admin (`roles/notebooks.admin`)
    - id: d
      text:
        en: |-
          Artifact Registry Writer (`roles/artifactregistry.writer`)
    - id: e
      text:
        en: |-
          Storage Admin (`roles/storage.admin`)
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Agent Platform User is the role needed to use Agent Runtime. When an agent is deployed from an agent object, the SDK writes the serialized agent, its requirements, and extra packages to the staging bucket, so the setup guide also requires Storage Admin; deployments from source files don't need the bucket.
  options:
    b:
      en: |-
        Agent Runtime builds and runs the deployment as a managed service, so the developer needs no Cloud Run role.
    c:
      en: |-
        Notebooks Admin manages Workbench instances; it doesn't grant permission to deploy agents.
    d:
      en: |-
        An agent object deployment stages files in Cloud Storage; the developer doesn't push an image to Artifact Registry.
references:
  - title: "Set up the environment | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime/setup
  - title: "Deploy an agent | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent
