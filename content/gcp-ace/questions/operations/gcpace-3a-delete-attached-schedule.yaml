id: gcpace-3a-delete-attached-schedule
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A snapshot schedule named hourly-old in region europe-west4 is attached to two disks. The team no longer needs hourly-old and wants to delete it; the two disks will get a different schedule later. Running `gcloud compute resource-policies delete hourly-old --region=europe-west4` fails. The snapshots that hourly-old already created must be kept.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Delete the snapshots created by hourly-old, and then run the delete command again.
    - id: b
      text:
        en: |-
          Run `gcloud compute resource-policies update snapshot-schedule hourly-old --max-retention-days=1`, and then delete it.
    - id: c
      text:
        en: |-
          Run `gcloud compute disks remove-resource-policies` for both disks with `--resource-policies=hourly-old`, and then delete it.
    - id: d
      text:
        en: |-
          Stop the VMs that use the two disks, and then run the delete command again.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A snapshot schedule can't be deleted while it is attached to a disk, so you first detach it from each disk with `gcloud compute disks remove-resource-policies`. Deleting the schedule afterwards keeps the snapshots it already created until you delete them yourself.
  options:
    a:
      en: |-
        Existing snapshots don't block the deletion, and deleting them breaks the requirement to keep them.
    b:
      en: |-
        Lowering the retention keeps the schedule attached, so the deletion still fails, and the schedule would start deleting snapshots older than one day.
    d:
      en: |-
        The VM state doesn't matter; the schedule stays attached to the disks whether the VMs run or not.
references:
  - title: "Manage snapshot schedules for disks | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/manage-snapshot-schedules
