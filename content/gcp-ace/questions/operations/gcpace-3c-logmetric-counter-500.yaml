id: gcpace-3c-logmetric-counter-500
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A ticketing company's application on Compute Engine writes one structured log entry per HTTP request to Cloud Logging, with the response code in the field `jsonPayload.status`. The team wants a Cloud Monitoring metric that counts the requests that returned 500, so that they can chart it and alert on it.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create an alerting policy with a metric-threshold condition on the CPU utilization of the application's VMs.
    - id: b
      text:
        en: |-
          Create a log sink to BigQuery, and schedule a query every minute that counts the entries with status 500.
    - id: c
      text:
        en: |-
          Create an uptime check on the application's URL, and alert when the check fails.
    - id: d
      text:
        en: |-
          Run `gcloud logging metrics create http_500_count --description="HTTP 500 responses" --log-filter='jsonPayload.status=500'`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A counter log-based metric counts the log entries that match its filter, and Cloud Monitoring can chart it and alert on it like any other metric. `gcloud logging metrics create` with `--log-filter` creates such a counter metric.
  options:
    a:
      en: |-
        CPU utilization doesn't tell how many requests failed with a 500 response.
    b:
      en: |-
        A scheduled query produces table rows, not a Cloud Monitoring metric, and adds cost and effort.
    c:
      en: |-
        An uptime check probes the URL periodically; it doesn't count the 500 responses returned to real users.
references:
  - title: "Log-based metrics overview | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/logs-based-metrics
