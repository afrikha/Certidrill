id: gcpace-3a-autopilot-scaleout-ratio
objective: "3.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    On a GKE Autopilot cluster, a Pod selects the Scale-Out compute class with the node selector `cloud.google.com/compute-class: Scale-Out`. Its single container requests 2 vCPU and 12 GiB of memory, with no limits. The values are within the class's maximums.

    Which requests does Autopilot apply to the container?
body:
  options:
    - id: a
      text:
        en: |-
          2 vCPU and 8 GiB of memory
    - id: b
      text:
        en: |-
          2 vCPU and 12 GiB of memory, unchanged
    - id: c
      text:
        en: |-
          3 vCPU and 12 GiB of memory
    - id: d
      text:
        en: |-
          None; the Pod is rejected because the ratio is invalid
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Scale-Out class requires a CPU-to-memory ratio of exactly 1:4. When a request falls outside the allowed ratio, Autopilot increases the smaller resource, so 12 GiB of memory needs 3 vCPU, and the Pod is billed for 3 vCPU and 12 GiB.
  options:
    a:
      en: |-
        Autopilot never lowers a request to fix the ratio; it raises the resource that is too small, here CPU.
    b:
      en: |-
        1:6 is outside the 1:4 ratio of Scale-Out, so Autopilot changes the request.
    d:
      en: |-
        A ratio outside the range is adjusted automatically; only requests above the maximums are rejected.
references:
  - title: "Resource requests in Autopilot | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-resource-requests
