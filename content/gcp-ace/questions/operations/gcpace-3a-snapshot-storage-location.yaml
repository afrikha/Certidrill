id: gcpace-3a-snapshot-storage-location
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A German insurer must take a manual snapshot of the disk claims-db in zone europe-west3-b. Data-residency rules require the snapshot data to be stored only in the europe-west3 region. No custom snapshot settings exist in the project.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute snapshots create claims-snap --source-disk=claims-db --source-disk-zone=europe-west3-b`
    - id: b
      text:
        en: |-
          `gcloud compute snapshots create claims-snap --source-disk=claims-db --source-disk-zone=europe-west3-b --storage-location=europe-west3`
    - id: c
      text:
        en: |-
          `gcloud compute snapshots create claims-snap --source-disk=claims-db --source-disk-zone=europe-west3-b --storage-location=eu`
    - id: d
      text:
        en: |-
          `gcloud compute snapshots create claims-snap --source-disk=claims-db --source-disk-zone=europe-west3-b --labels=region=europe-west3`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `--storage-location` sets where the snapshot data is stored, and a regional value such as europe-west3 keeps the data in that region. Without it, and without custom snapshot settings, Compute Engine stores the snapshot in the multi-region closest to the source disk.
  options:
    a:
      en: |-
        With no storage location and default snapshot settings, the snapshot goes to the nearest multi-region (eu), which spans several regions.
    c:
      en: |-
        The eu multi-region stores data across several European regions, not only europe-west3.
    d:
      en: |-
        A label is only metadata for organizing resources; it doesn't control where the snapshot data is stored.
references:
  - title: "About archive and standard disk snapshots | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/disks/snapshots
