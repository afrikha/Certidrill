id: gcpace-3a-autopilot-default-requests
objective: "3.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer deploys a Deployment to a GKE Autopilot cluster without any resources section in the container spec. The Pods don't select a compute class or any special hardware, so they run on the default general-purpose platform. The finance team asks which resource requests Autopilot bills for each Pod.

    Which requests does Autopilot set on the container?
body:
  options:
    - id: a
      text:
        en: |-
          50m CPU, 52 MiB of memory and 10 MiB of ephemeral storage
    - id: b
      text:
        en: |-
          0.5 vCPU, 2 GiB of memory and 1 GiB of ephemeral storage
    - id: c
      text:
        en: |-
          1 vCPU, 4 GiB of memory and 10 GiB of ephemeral storage
    - id: d
      text:
        en: |-
          No requests; the Pod is billed for the resources it actually uses
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When a container sets no requests, Autopilot applies defaults: 0.5 vCPU and 2 GiB of memory for the general-purpose platform, and 1 GiB of ephemeral storage. Pod-based billing then charges for these requested resources.
  options:
    a:
      en: |-
        These are the minimum values on clusters that support bursting, not the defaults applied to containers without requests.
    c:
      en: |-
        These values are higher than the defaults; Autopilot only uses them if you request them.
    d:
      en: |-
        Autopilot always sets requests and bills for the requested resources, not for measured usage.
references:
  - title: "Resource requests in Autopilot | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-resource-requests
