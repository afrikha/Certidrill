id: gcpace-3a-node-pool-inventory
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A capacity planner asks for an inventory of a GKE Standard cluster named analytics in region europe-west1: the machine type and autoscaling limits of each node pool, and the node pool that each individual node belongs to. Your kubectl context already points to the cluster.

    Which two commands together provide this information? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud container clusters list --location=europe-west1`
    - id: b
      text:
        en: |-
          `kubectl top nodes`
    - id: c
      text:
        en: |-
          `kubectl get nodes --label-columns=cloud.google.com/gke-nodepool`
    - id: d
      text:
        en: |-
          `gcloud container node-pools list --cluster=analytics --location=europe-west1 --format=yaml`
    - id: e
      text:
        en: |-
          `kubectl get pods --all-namespaces -o wide`
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      GKE labels every node with `cloud.google.com/gke-nodepool`, so showing that label as a column maps each node to its pool. `gcloud container node-pools list` with full output returns each pool's configuration, including the machine type and the autoscaling settings.
  options:
    a:
      en: |-
        This lists the clusters of the region with summary details, not the configuration of each node pool or the nodes.
    b:
      en: |-
        `kubectl top nodes` shows current CPU and memory usage of the nodes, not their node pool or the pools' autoscaling limits.
    e:
      en: |-
        This shows where Pods run, but neither the node pool of each node nor the pools' machine types and limits.
references:
  - title: "Add and manage node pools | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-pools
  - title: "Troubleshoot GKE Standard node pools | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/troubleshooting/node-pools
