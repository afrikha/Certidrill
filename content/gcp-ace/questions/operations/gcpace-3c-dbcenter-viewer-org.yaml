id: gcpace-3c-dbcenter-viewer-org
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's database reliability team must view, in Database Center, the inventory and health issues of every managed database in the organization, including the databases of projects that will be created later. The team must not get access to the data stored in the databases. You must follow the principle of least privilege and minimize administrative effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the team's group the Cloud SQL Viewer role (`roles/cloudsql.viewer`) on each existing project.
    - id: b
      text:
        en: |-
          Grant the team's group the Database Center Viewer role (`roles/databasecenter.viewer`) on each existing project.
    - id: c
      text:
        en: |-
          Grant the team's group the Cloud SQL Admin role (`roles/cloudsql.admin`) on the organization.
    - id: d
      text:
        en: |-
          Grant the team's group the Database Center Viewer role (`roles/databasecenter.viewer`) on the organization.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `roles/databasecenter.viewer` gives view access to the database instances shown in Database Center, that is, to their metadata and not to their data. Granting it at the organization level, which the documentation recommends, covers every existing project and is inherited by the projects created later.
  options:
    a:
      en: |-
        Cloud SQL Viewer covers only Cloud SQL, not the other database products, and per-project grants miss the projects created later.
    b:
      en: |-
        The role is right, but grants on each existing project don't cover new projects and must be repeated, which adds administrative effort.
    c:
      en: |-
        Cloud SQL Admin grants full control of Cloud SQL instances, far more than viewing, which breaks least privilege.
references:
  - title: "Set up Database Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/database-center/docs/set-up-database-center
