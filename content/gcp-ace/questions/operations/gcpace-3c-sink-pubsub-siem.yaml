id: gcpace-3c-sink-pubsub-siem
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank runs its security information and event management (SIEM) system on premises. The SIEM must receive the Google Cloud security logs in near real time by pulling messages over HTTPS from a Google Cloud service. The logs must not be stored in an intermediate database.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a sink to a Cloud Storage bucket, and have the SIEM download the new log files from the bucket.
    - id: b
      text:
        en: |-
          Create a sink to a Pub/Sub topic, and have the SIEM pull the log entries from a subscription of the topic.
    - id: c
      text:
        en: |-
          Create a sink to a BigQuery dataset, and have the SIEM query the new log entries every few minutes.
    - id: d
      text:
        en: |-
          Create a log bucket with Observability Analytics enabled, and route the security logs to it with a sink.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A sink with a Pub/Sub topic destination streams the matching log entries as messages as they arrive, and an external system such as a SIEM pulls them from a subscription. Pub/Sub is the destination that the documentation names for third-party systems such as Splunk.
  options:
    a:
      en: |-
        Cloud Storage receives logs as files written in batches, so the SIEM wouldn't get the entries in near real time.
    c:
      en: |-
        BigQuery is a database used as an intermediate store, which the requirement forbids, and periodic queries add delay.
    d:
      en: |-
        Observability Analytics lets you query logs inside Google Cloud; it doesn't deliver them to an on-premises system.
references:
  - title: "Route logs to supported destinations | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/export/configure_export_v2
