id: gcpace-3c-global-lb-static-ip
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company is deploying a global external Application Load Balancer in front of backends in three regions. The DNS record of the shop must point to an IPv4 address that never changes, even if the forwarding rule is recreated.

    Which command should you run before you create the forwarding rule?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute addresses create shop-ip --region=us-central1`
    - id: b
      text:
        en: |-
          `gcloud compute addresses create shop-ip --global --ip-version=IPV4`
    - id: c
      text:
        en: |-
          `gcloud compute addresses create shop-ip --global --network-tier=STANDARD`
    - id: d
      text:
        en: |-
          `gcloud compute addresses create shop-ip --region=us-central1 --subnet=web-subnet`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A global external Application Load Balancer needs a global static external address, reserved with `--global` and `--ip-version=IPV4`. Global addresses can be used only with global load balancers, and a reserved address stays the same when the forwarding rule that uses it is recreated.
  options:
    a:
      en: |-
        A regional external address is for VMs and regional load balancers; a global load balancer can't use it.
    c:
      en: |-
        Standard Tier is available only for regional addresses; a global address uses Premium Tier.
    d:
      en: |-
        With `--subnet`, the command reserves a regional internal address, which can't be the public frontend of an external load balancer.
references:
  - title: "Reserve a static external IP address | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/reserve-static-external-ip-address
