id: gcpace-3b-workstations-home-overwritten
objective: "3.1.16"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Dockerfile of your custom Cloud Workstations image installs a CLI tool in `/usr/local/bin` and copies shared shell aliases and a `.gitconfig` file into `/home/user`. The configuration uses a persistent home directory, and developers' work in their home directories must persist between sessions. On new workstations, the CLI tool is present, but the files that the image placed in `/home/user` are missing.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Move the home directory setup into a startup script in `/etc/workstation-startup.d/` that runs when the workstation starts.
    - id: b
      text:
        en: |-
          Set the persistent disk reclaim policy of the configuration to `retain`, so that the files in `/home/user` are kept.
    - id: c
      text:
        en: |-
          Remove the persistent disk from the configuration, so that the `/home` directory comes from the image.
    - id: d
      text:
        en: |-
          Rebuild the image from the latest version of the base image tag, so that the home directory files are copied correctly.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With a persistent home directory, a persistent disk is attached to `/home` when the container starts, which overwrites whatever the image placed in `/home` at build time; files outside `/home`, such as `/usr/local/bin`, are unaffected. Google recommends doing home directory setup at runtime, with scripts in `/etc/workstation-startup.d/`, which the base images run at startup as root by default.
  options:
    b:
      en: |-
        The reclaim policy only decides whether the disk is kept when a workstation is deleted; the disk is still mounted over `/home` at startup.
    c:
      en: |-
        Without a persistent disk, the home directory would no longer persist between sessions, which the developers require.
    d:
      en: |-
        A newer base image doesn't change the fact that the persistent disk is mounted over `/home` at runtime.
references:
  - title: "Customize container images | Cloud Workstations | Google Cloud Documentation"
    url: https://docs.cloud.google.com/workstations/docs/customize-container-images
