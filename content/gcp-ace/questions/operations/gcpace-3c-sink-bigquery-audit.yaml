id: gcpace-3c-sink-bigquery-audit
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A compliance team of an insurance company wants to analyze the audit logs of the project `claims-prod` with standard SQL in BigQuery, as the logs arrive. The dataset `audit_logs` already exists in the project `sec-prod`.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud logging sinks create audit-gcs storage.googleapis.com/audit-archive --log-filter='logName:"cloudaudit.googleapis.com"' --project=claims-prod`
    - id: b
      text:
        en: |-
          `gcloud logging sinks create audit-ps pubsub.googleapis.com/projects/sec-prod/topics/audit --log-filter='logName:"cloudaudit.googleapis.com"' --project=claims-prod`
    - id: c
      text:
        en: |-
          `gcloud logging sinks create audit-bq bigquery.googleapis.com/projects/sec-prod/datasets/audit_logs --log-filter='logName:"cloudaudit.googleapis.com"' --project=claims-prod`
    - id: d
      text:
        en: |-
          `gcloud logging read 'logName:"cloudaudit.googleapis.com"' --format=json --project=claims-prod`, scheduled every hour, with the output loaded into the dataset.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A sink with a BigQuery dataset destination routes the matching log entries to tables of the dataset as they arrive, where they can be queried with SQL. The filter on `cloudaudit.googleapis.com` log names selects the audit logs; the sink's writer identity then needs the Logs Writer and BigQuery Data Editor roles in `sec-prod`.
  options:
    a:
      en: |-
        A Cloud Storage destination stores the logs as files, which aren't queryable as BigQuery tables without extra setup.
    b:
      en: |-
        A Pub/Sub destination streams the logs to subscribers; nothing loads them into BigQuery.
    d:
      en: |-
        A scheduled export is a manual batch process that delays the data by up to an hour and must be maintained.
references:
  - title: "Route logs to supported destinations | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/export/configure_export_v2
