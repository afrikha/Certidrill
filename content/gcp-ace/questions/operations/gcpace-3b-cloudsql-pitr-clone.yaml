id: gcpace-3b-cloudsql-pitr-clone
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At 09:58 UTC today (2026-11-27), a faulty script deleted rows in the Cloud SQL for MySQL instance `orders-db`, which has automated backups and binary logging enabled. The last automated backup ran at 02:00 UTC. You must recover the data as it was at 09:55 UTC and keep `orders-db` running unchanged for the investigation.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud sql backups restore BACKUP_ID --restore-instance=orders-db` with the ID of the 02:00 backup.
    - id: b
      text:
        en: |-
          Create the instance `orders-db-old`, and run `gcloud sql backups restore BACKUP_ID --restore-instance=orders-db-old` with the ID of the 02:00 backup.
    - id: c
      text:
        en: |-
          Run `gcloud sql instances clone orders-db orders-db-0955 --point-in-time='2026-11-27T09:55:00Z'`.
    - id: d
      text:
        en: |-
          Run `gcloud sql export sql orders-db gs://orders-recovery/orders.sql --database=orders`, and import the file into a new instance.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With backups and continuous binary logs, Cloud SQL can recover an instance to a timestamp: the clone command with `--point-in-time` (UTC, RFC 3339) creates a new instance in the state of 09:55. A point-in-time recovery always creates a new instance, so `orders-db` stays as it is for the investigation.
  options:
    a:
      en: |-
        Restoring onto `orders-db` overwrites the instance that must stay unchanged, and it loses every change made between 02:00 and 09:55.
    b:
      en: |-
        A backup restore returns the data of 02:00, so the changes made between 02:00 and 09:55 are missing.
    d:
      en: |-
        An export captures the current state, in which the rows are already deleted.
references:
  - title: "Perform point-in-time recovery (PITR) | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/backup-recovery/pitr
