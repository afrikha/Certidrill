id: gcpace-3b-run-max-db-connections
objective: "3.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Cloud Run service `orders-api` in `us-central1` uses a Cloud SQL for PostgreSQL instance that accepts 250 connections, of which 50 are reserved for administration and batch jobs. Each container instance of `orders-api` opens a fixed pool of 10 connections. During a campaign, the service scaled out and the database rejected connections. The service must keep scaling automatically with traffic within the database budget, and it must not pay for idle instances at night.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud run services update orders-api --region=us-central1 --scaling=20`.
    - id: b
      text:
        en: |-
          Run `gcloud run services update orders-api --region=us-central1 --min=20`.
    - id: c
      text:
        en: |-
          Run `gcloud run services update orders-api --region=us-central1 --concurrency=20`.
    - id: d
      text:
        en: |-
          Run `gcloud run services update orders-api --region=us-central1 --max=20`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The application can use 200 connections, and each instance opens 10, so the service must not run more than 20 instances. The service-level maximum (`--max`) caps autoscaling without creating a new revision, and Google documents this setting precisely to limit connections to a backing service such as a database. The minimum stays at 0, so the service can scale to zero at night.
  options:
    a:
      en: |-
        `--scaling=20` switches to manual scaling with a fixed count of 20 instances, so the service no longer scales with traffic and pays for 20 instances at night.
    b:
      en: |-
        A minimum keeps 20 instances running even at night and doesn't cap how far the service can scale out.
    c:
      en: |-
        Concurrency limits requests per instance; a lower value makes Cloud Run start more instances, so it doesn't protect the database.
references:
  - title: "Set maximum instances for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/max-instances
  - title: "About instance autoscaling in Cloud Run services | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/about-instance-autoscaling
