id: gcpace-3a-ar-pull-identity-facts
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A platform team is documenting how the nodes of its GKE Standard clusters, which run a current GKE version, pull container images from private Artifact Registry Docker repositories in the same project. Some node pools use the Compute Engine default service account and others use user-provided service accounts.

    Which two statements should the documentation include? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Pods must reference an imagePullSecret to pull images from a repository in the same project as the cluster.
    - id: b
      text:
        en: |-
          Node pools that use a user-provided service account get the cloud-platform access scope by default.
    - id: c
      text:
        en: |-
          Nodes that use the Compute Engine default service account get the cloud-platform access scope by default.
    - id: d
      text:
        en: |-
          The GKE service agent pulls the images on behalf of the nodes, so it needs access to the repositories.
    - id: e
      text:
        en: |-
          The Artifact Registry Reader role on the repository is enough for a node service account to pull images.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      When a node pool uses a user-provided service account, GKE gives its nodes the cloud-platform scope, so IAM roles alone decide what they can pull. Pulling only needs read access, which the Artifact Registry Reader role grants on the repository; Writer would add push permissions the nodes don't need.
  options:
    a:
      en: |-
        imagePullSecrets were only needed on very old GKE versions; current clusters pull from Artifact Registry with the node service account.
    c:
      en: |-
        Nodes that use the default service account get the default scopes, which include read-only storage access, not cloud-platform.
    d:
      en: |-
        Image pulls on the nodes use the node pool's service account, not the GKE service agent.
references:
  - title: "Access control with IAM | Artifact Registry | Google Cloud Documentation"
    url: https://docs.cloud.google.com/artifact-registry/docs/access-control
  - title: "Deploying to Google Kubernetes Engine | Artifact Registry | Google Cloud Documentation"
    url: https://docs.cloud.google.com/artifact-registry/docs/integrate-gke
