id: gcpace-3b-run-gpu-l4-settings
objective: "3.1.13"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A startup serves an open model as the Cloud Run service `llm-chat` in `us-central1` and needs one NVIDIA L4 GPU per instance. The command `gcloud run deploy llm-chat --image=us-central1-docker.pkg.dev/acme-ml/serve/llm:2 --region=us-central1 --gpu=1 --gpu-type=nvidia-l4 --cpu=2 --memory=8Gi` is rejected. The project has L4 quota in the region.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud run deploy llm-chat --image=us-central1-docker.pkg.dev/acme-ml/serve/llm:2 --region=us-central1 --gpu=2 --gpu-type=nvidia-l4 --cpu=2 --memory=8Gi`
    - id: b
      text:
        en: |-
          `gcloud run deploy llm-chat --image=us-central1-docker.pkg.dev/acme-ml/serve/llm:2 --region=us-central1 --gpu=1 --gpu-type=nvidia-l4 --cpu=4 --memory=16Gi --no-cpu-throttling`
    - id: c
      text:
        en: |-
          `gcloud run deploy llm-chat --image=us-central1-docker.pkg.dev/acme-ml/serve/llm:2 --region=us-central1 --gpu=1 --gpu-type=nvidia-l4 --cpu=4 --memory=16Gi --cpu-throttling`
    - id: d
      text:
        en: |-
          `gcloud run deploy llm-chat --image=us-central1-docker.pkg.dev/acme-ml/serve/llm:2 --region=us-central1 --gpu=1 --gpu-type=nvidia-l4 --cpu=2 --memory=8Gi --no-gpu-zonal-redundancy`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Cloud Run instance with one L4 GPU needs at least 4 CPUs and 16 GiB of memory, and GPU services require instance-based billing, which `--no-cpu-throttling` selects by keeping CPU allocated for the whole instance lifecycle. The service can still scale to zero when it receives no requests.
  options:
    a:
      en: |-
        Cloud Run attaches one GPU per instance, and 2 CPUs with 8 GiB is still below the L4 minimum.
    c:
      en: |-
        `--cpu-throttling` selects request-based billing, which GPU services don't support.
    d:
      en: |-
        Turning off GPU zonal redundancy only lowers the price of the GPU; it doesn't satisfy the 4 CPU and 16 GiB minimum.
references:
  - title: "Configure GPU for Cloud Run services | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/services/gpu
