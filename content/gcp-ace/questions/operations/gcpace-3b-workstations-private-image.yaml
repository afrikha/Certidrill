id: gcpace-3b-workstations-private-image
objective: "3.1.16"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your team built a custom workstation image and pushed it to the private Artifact Registry repository `dev-images` in the same project. The image contains internal tools and must stay private. After you updated the configuration `py-ide` (cluster `dev-eu`, region `europe-west1`) with `--container-custom-image`, new workstations fail to start because the image can't be pulled. The configuration has no service account.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant each developer Artifact Registry Reader on the `dev-images` repository.
    - id: b
      text:
        en: |-
          Create a service account with Artifact Registry Reader on `dev-images`, and set it on `py-ide` with `--service-account`.
    - id: c
      text:
        en: |-
          Grant `allUsers` Artifact Registry Reader on the `dev-images` repository so that the workstation VMs can pull the image.
    - id: d
      text:
        en: |-
          Update the configuration with `--container-predefined-image=codeoss`, and install the internal tools from a startup script.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The workstation VMs pull the container image with the service account of the configuration. Without a service account, the VMs run with no identity and the image must be publicly accessible, so a private image requires a service account that has permission to pull it, such as Artifact Registry Reader on the repository.
  options:
    a:
      en: |-
        The developers' own permissions aren't used to pull the image; the pull is done by the configuration's service account.
    c:
      en: |-
        Making the repository public would let the VMs pull the image, but it exposes the internal tools, which must stay private.
    d:
      en: |-
        A predefined image drops the custom image that the team built and moves the tooling problem into startup scripts.
references:
  - title: "Customize container images | Cloud Workstations | Google Cloud Documentation"
    url: https://docs.cloud.google.com/workstations/docs/customize-container-images
  - title: "gcloud workstations configs create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/workstations/configs/create
