id: gcpace-3a-iap-ssh-no-external-ip
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs Linux VMs that have only internal IP addresses in a custom mode VPC network. OS Login is enabled, and the support engineers already have the Compute OS Login role on the project. The engineers work from home and must connect by running `gcloud compute ssh VM_NAME --tunnel-through-iap`. Security policy forbids external IP addresses on the VMs.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a Cloud NAT gateway for the region and subnet of the VMs.
    - id: b
      text:
        en: |-
          Create a firewall rule that allows ingress TCP port 22 from 35.235.240.0/20 to the VMs.
    - id: c
      text:
        en: |-
          Create a firewall rule that allows ingress TCP port 22 from 0.0.0.0/0 to the VMs.
    - id: d
      text:
        en: |-
          Grant the IAP-secured Tunnel User role (roles/iap.tunnelResourceAccessor) to the engineers.
    - id: e
      text:
        en: |-
          Reserve a static external IP address and assign it to a bastion VM in the subnet.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      IAP TCP forwarding reaches the VMs from the IAP range 35.235.240.0/20, so a firewall rule must allow TCP 22 from that range. Each engineer also needs the IAP-secured Tunnel User role on the project or the VMs to open the tunnel; with OS Login already granted, these two actions complete the setup without any external IP address.
  options:
    a:
      en: |-
        Cloud NAT only translates connections that the VMs start toward the internet; it never accepts inbound SSH sessions.
    c:
      en: |-
        IAP traffic arrives from 35.235.240.0/20, so opening port 22 to the whole internet is unnecessary and widens the exposure without granting tunnel access.
    e:
      en: |-
        A bastion with an external IP address breaks the security policy and adds a VM to maintain, while IAP needs no external address.
references:
  - title: "Use IAP for TCP forwarding | Identity-Aware Proxy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding
