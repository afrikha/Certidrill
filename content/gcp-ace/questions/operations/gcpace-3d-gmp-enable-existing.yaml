id: gcpace-3d-gmp-enable-existing
objective: "3.4.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A regional GKE Standard cluster named `analytics` runs in `us-central1`. Managed Service for Prometheus managed collection is disabled on this cluster. The platform team wants Google to run and scale the Prometheus collectors so that application teams can then create `PodMonitoring` resources.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud container clusters update analytics --region=us-central1 --monitoring=SYSTEM`
    - id: b
      text:
        en: |-
          `gcloud container clusters update analytics --region=us-central1 --logging=SYSTEM,WORKLOAD`
    - id: c
      text:
        en: |-
          `gcloud container clusters update analytics --region=us-central1 --enable-managed-prometheus`
    - id: d
      text:
        en: |-
          `gcloud container clusters update analytics --region=us-central1 --disable-managed-prometheus`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `--enable-managed-prometheus` turns on managed collection on an existing cluster: GKE deploys and manages the collectors, and teams configure scraping through `PodMonitoring` resources. Managed collection is enabled by default only on recent cluster versions (Autopilot 1.25 or later, Standard 1.27 or later), so it must be enabled explicitly here.
  options:
    a:
      en: |-
        `--monitoring=SYSTEM` selects the GKE system metrics that are collected; it doesn't deploy the managed Prometheus collectors.
    b:
      en: |-
        `--logging` selects which logs GKE sends to Cloud Logging; it has nothing to do with Prometheus metrics.
    d:
      en: |-
        This flag turns managed collection off, which is its current state.
references:
  - title: "Get started with managed collection | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed
