id: gcpace-3d-bucket-region-retention
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company runs its application on Compute Engine in the project `pay-prod`. Its application logs currently go to the `_Default` log bucket, which is in the `global` location with the default retention. A new regulation requires that these application logs be stored in the `europe-west1` region and kept for 3 years, and they must stay queryable in the Logs Explorer.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud logging buckets update _Default --location=global --retention-days=1095`, and then change the location of the `_Default` bucket to `europe-west1` in the console.
    - id: b
      text:
        en: |-
          Run `gcloud logging settings update --organization=ORGANIZATION_ID --storage-location=europe-west1`, and then set the retention of the `_Default` bucket to 1095 days.
    - id: c
      text:
        en: |-
          Run `gcloud logging buckets create app-logs --location=europe-west1 --retention-days=1095`, and then create a sink that routes the application logs to this bucket.
    - id: d
      text:
        en: |-
          Run `gcloud logging buckets update _Required --location=global --retention-days=1095`, and then route the application logs to the `_Required` sink.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The location of a log bucket can't be changed after the bucket is created, so you create a user-defined bucket in `europe-west1` with a retention of 1,095 days (the range is 1 to 3,650 days). A sink whose filter selects the application logs and whose destination is `logging.googleapis.com/projects/pay-prod/locations/europe-west1/buckets/app-logs` then stores new entries in that bucket, where the Logs Explorer can query them.
  options:
    a:
      en: |-
        The retention change is valid, but a bucket's location is fixed at creation: the `_Default` bucket can't be moved to `europe-west1`.
    b:
      en: |-
        Default resource settings apply only to buckets created after the change, for example in new projects; the existing `_Default` bucket of `pay-prod` stays in `global`.
    d:
      en: |-
        The `_Required` bucket has a fixed 400-day retention that can't be configured, and its sink can't be modified to receive application logs.
references:
  - title: "Configure log buckets | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/buckets
  - title: "Quotas and limits | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/quotas
