id: gcpace-3c-route-statements
objective: "3.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A junior engineer of a transport company is writing the runbook for custom static routes in the company's VPC networks.

    Which two statements about custom static routes are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Among routes with the same destination, the route with the lower priority value is used.
    - id: b
      text:
        en: |-
          A static route with priority 0 overrides a subnet route that has the same destination.
    - id: c
      text:
        en: |-
          A route created without the `--priority` flag gets priority 0, the highest priority.
    - id: d
      text:
        en: |-
          A static route can't have a destination that matches or is more specific than a subnet route's destination.
    - id: e
      text:
        en: |-
          A route with a network tag applies to all VMs of the network except those that have the tag.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Priorities range from 0 (highest) to 65,535 (lowest), so among routes with the same destination the lower value wins. A custom static route can't have a destination range that matches or is more specific than a subnet route's range, which keeps subnet traffic local.
  options:
    b:
      en: |-
        A static route can't even be created with a destination that matches a subnet route, so priority can't make it override one.
    c:
      en: |-
        `gcloud compute routes create` uses priority 1000 by default.
    e:
      en: |-
        A route with a network tag applies only to the VMs that have the tag.
references:
  - title: "Static routes | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/static-routes
  - title: "Use routes | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/using-routes
