id: gcpace-3b-gpu-g2-l4
objective: "3.1.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AI startup needs a Compute Engine VM in `us-central1-a` with one NVIDIA L4 GPU, 8 vCPUs, and 32 GB of memory for model serving. An engineer's command fails: `gcloud compute instances create infer-1 --zone=us-central1-a --machine-type=n1-standard-8 --accelerator=type=nvidia-l4,count=1 --maintenance-policy=TERMINATE --boot-disk-size=50GB --image-family=ubuntu-2204-lts --image-project=ubuntu-os-cloud`. The project has L4 quota in the region.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the command, and add `--provisioning-model=SPOT` so that the GPU is taken from spare capacity.
    - id: b
      text:
        en: |-
          Change the accelerator type to `nvidia-l4-vws`, and keep the `n1-standard-8` machine type.
    - id: c
      text:
        en: |-
          Change the machine type to `g2-standard-8`, remove the `--accelerator` flag, and keep `--maintenance-policy=TERMINATE`.
    - id: d
      text:
        en: |-
          Change the machine type to `n1-highmem-8` for more memory per vCPU, and keep the `nvidia-l4` accelerator.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      L4 GPUs are provided by the accelerator-optimized G2 series: each G2 machine type has a set number of L4 GPUs, and `g2-standard-8` has 8 vCPUs, 32 GB of memory, and one L4. The G2 creation command doesn't need `--accelerator`, but it still sets the host maintenance policy to `TERMINATE` because GPU instances can't live migrate.
  options:
    a:
      en: |-
        The provisioning model doesn't change which GPUs a machine series supports; L4 GPUs still can't be attached to an N1 VM.
    b:
      en: |-
        `nvidia-l4-vws` is the RTX Virtual Workstation variant used with G2 VMs; it doesn't make L4 GPUs available on N1.
    d:
      en: |-
        Every N1 machine type supports only the earlier-generation GPUs such as T4, P4, and V100, not the L4.
references:
  - title: "Create a G2 or G4 instance | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/gpus/create-gpu-vm-g-series
