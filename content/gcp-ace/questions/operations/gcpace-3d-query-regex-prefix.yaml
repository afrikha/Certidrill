id: gcpace-3d-query-regex-prefix
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company's API writes structured logs in which the field `jsonPayload.userAgent` contains the client's user agent string. The security team suspects scripted access and asks you to list, in the Logs Explorer, only the entries whose user agent begins with `curl/`. Some browser user agents contain the text `curl/` later in the string, and those entries must not be returned.

    Which query expression should you use?
body:
  options:
    - id: a
      text:
        en: |-
          `jsonPayload.userAgent:"curl/"`
    - id: b
      text:
        en: |-
          `jsonPayload.userAgent=~"^curl/"`
    - id: c
      text:
        en: |-
          `jsonPayload.userAgent="curl/*"`
    - id: d
      text:
        en: |-
          `SEARCH("curl/")`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The `=~` operator matches a field against an RE2 regular expression. Regular expressions aren't anchored by default, so the `^` anchor is what limits the matches to values that start with `curl/`.
  options:
    a:
      en: |-
        The `:` (has) operator matches the text anywhere in the field, so it also returns the browser user agents that contain `curl/` later in the string.
    c:
      en: |-
        The `=` operator tests equality and doesn't treat `*` as a wildcard, so it only matches the literal value `curl/*`.
    d:
      en: |-
        `SEARCH()` looks for the tokens in all the fields of the entry, wherever they appear, so it neither targets `userAgent` nor checks the start of the value.
references:
  - title: "Logging query language | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/view/logging-query-language
