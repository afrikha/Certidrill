id: gcpace-3c-dataflow-diagnostics-tab
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nightly Dataflow batch job of a logistics company failed. The on-call engineer opens the job page in the Google Cloud console and wants to see the likely causes of the failure, with the error messages and their stack traces grouped together, with the least effort.

    Where should the engineer look?
body:
  options:
    - id: a
      text:
        en: |-
          In the Execution details tab of the job page.
    - id: b
      text:
        en: |-
          In the Job metrics tab of the job page.
    - id: c
      text:
        en: |-
          In Metrics Explorer, in a chart of the CPU utilization of the job's workers.
    - id: d
      text:
        en: |-
          In the Diagnostics tab of the logs panel of the job page.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The logs panel at the bottom of a Dataflow job page has a Diagnostics tab that groups likely pipeline issues and error messages with their stack traces into error groups, with an occurrence count and a histogram over time. It's the quickest way to find why a job failed without writing a Logging query.
  options:
    a:
      en: |-
        Execution details shows how the stages and the workers progressed, not the error messages and stack traces that explain a failure.
    b:
      en: |-
        Job metrics shows charts such as data freshness and resource utilization; charts don't contain the error messages of the failure.
    c:
      en: |-
        CPU utilization of the workers can hint at a resource problem but contains no error message; it takes more effort and doesn't group the errors.
references:
  - title: "Work with pipeline logs | Cloud Dataflow | Google Cloud Documentation"
    url: https://docs.cloud.google.com/dataflow/docs/guides/logging
  - title: "Use the Dataflow job monitoring interface | Google Cloud Documentation"
    url: https://docs.cloud.google.com/dataflow/docs/guides/monitoring-overview
