id: gcpace-3a-serial-console-boot
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After an administrator edited /etc/fstab on a Debian VM named db-tools, the VM no longer finishes booting and SSH connections time out. The serial port output shows the boot waiting at an emergency mode prompt. A local password is set for the root account, and no organization policy restricts serial port access. You need an interactive session to fix the file.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute ssh db-tools --tunnel-through-iap` so that the connection bypasses the VPC firewall rules.
    - id: b
      text:
        en: |-
          Set the `serial-port-enable` metadata key to TRUE on the VM, and then run `gcloud compute connect-to-serial-port db-tools`.
    - id: c
      text:
        en: |-
          Run `gcloud compute instances get-serial-port-output db-tools`, and then type the commands in that output stream.
    - id: d
      text:
        en: |-
          Run `gcloud compute ssh db-tools --troubleshoot` so that the tool repairs the SSH configuration of the VM.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Interactive serial console access is disabled by default and is turned on with the `serial-port-enable` metadata key on the VM or the project. `gcloud compute connect-to-serial-port` then gives a console that works even when the network stack and SSH daemon aren't running, and you sign in with the local root password.
  options:
    a:
      en: |-
        IAP still connects to the SSH daemon of the VM, which isn't running because the boot stopped in emergency mode.
    c:
      en: |-
        `get-serial-port-output` only prints the console output; it is read-only and can't accept commands.
    d:
      en: |-
        `--troubleshoot` runs connectivity and permission checks and reports what it finds; it doesn't give you a console on a VM whose SSH daemon isn't running.
references:
  - title: "Troubleshooting using the serial console | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/troubleshooting/troubleshooting-using-serial-console
