id: gcpace-3c-route-ip-forwarding
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An energy company created the VM `nva-1` from a vendor image to inspect traffic between two subnets, and a custom static route that uses `nva-1` as its next hop. The guest OS of `nva-1` is configured to forward packets, and firewall rules allow the routed traffic. Packets sent by the VMs reach `nva-1`, but the packets that it forwards to other addresses are dropped. `nva-1` was created with the default settings.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable IP forwarding (the `canIpForward` property) on `nva-1`.
    - id: b
      text:
        en: |-
          Recreate the custom static route with `--priority=0`.
    - id: c
      text:
        en: |-
          Enable Private Google Access on the subnet of `nva-1`.
    - id: d
      text:
        en: |-
          Recreate the custom static route with `--next-hop-address` set to the internal IP address of `nva-1`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A VM that is the next hop of a route must have IP forwarding enabled on Google Cloud, in addition to the forwarding configuration of its guest OS; without it, Google Cloud drops the packets whose source or destination isn't the VM's own address. IP forwarding is off by default, and you can update the `canIpForward` property of an existing VM.
  options:
    b:
      en: |-
        The packets already reach `nva-1`, so route selection works; a higher priority doesn't change the forwarding check on the VM.
    c:
      en: |-
        Private Google Access lets VMs without external addresses reach Google APIs; it has nothing to do with forwarding packets.
    d:
      en: |-
        Designating the next hop by address still sends the packets to `nva-1`, which still needs IP forwarding.
references:
  - title: "Static routes | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/static-routes
  - title: "Use routes | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/using-routes
