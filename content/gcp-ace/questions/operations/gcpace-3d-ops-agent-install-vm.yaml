id: gcpace-3d-ops-agent-install-vm
objective: "3.4.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Debian VM named `report-01` runs a reporting application. The operations team needs memory utilization and disk usage metrics of the guest operating system, and the VM's syslog entries, in Cloud Monitoring and Cloud Logging. No agent is installed on the VM, and the VM can reach the Google package repositories. You are connected to the VM over SSH with sudo access.

    What should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud services enable monitoring.googleapis.com logging.googleapis.com`, and nothing on the VM
    - id: b
      text:
        en: |-
          `sudo apt-get install stackdriver-agent`, followed by a restart of the VM
    - id: c
      text:
        en: |-
          `curl -sSO https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh`, then `sudo bash add-google-cloud-ops-agent-repo.sh --also-install`
    - id: d
      text:
        en: |-
          `gcloud compute instances add-metadata report-01 --metadata=enable-osconfig=TRUE`, and nothing else
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Ops Agent is the agent that collects guest metrics, such as memory and disk usage, and logs, such as syslog, from Compute Engine VMs. On a single Linux VM, you download the repository script and run it with `--also-install`, which adds the package repository and installs the agent with its default configuration (syslog and host metrics).
  options:
    a:
      en: |-
        The Logging and Monitoring APIs must be enabled, but without an agent on the VM, guest memory metrics and syslog entries aren't collected.
    b:
      en: |-
        This is the package of the legacy Monitoring agent, which is replaced by the Ops Agent and doesn't collect logs.
    d:
      en: |-
        This metadata enables the OS Config agent features used by agent policies, but it doesn't install the Ops Agent by itself.
references:
  - title: "Installing the Ops Agent on individual VMs | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/installation
