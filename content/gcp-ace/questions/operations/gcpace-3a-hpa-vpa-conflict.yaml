id: gcpace-3a-hpa-vpa-conflict
objective: "3.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Deployment search-api has a HorizontalPodAutoscaler that targets 60% CPU utilization. The team now wants a VerticalPodAutoscaler in Auto mode to right-size the CPU and memory requests of the Pods automatically, while the replica count keeps following the load. Cloud Monitoring already exposes a requests-per-second metric for search-api that the HPA can use. Only generally available features may be used.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Change the HPA to scale on the requests-per-second metric, and add the VPA in Auto mode for CPU and memory.
    - id: b
      text:
        en: |-
          Keep the HPA on CPU utilization, and add the VPA in Auto mode for CPU and memory.
    - id: c
      text:
        en: |-
          Keep the HPA on CPU utilization, and replace the VPA with cluster autoscaling on the node pool.
    - id: d
      text:
        en: |-
          Set the HPA's `minReplicas` equal to `maxReplicas`, and add the VPA in Auto mode for CPU and memory.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A HorizontalPodAutoscaler and a standard VerticalPodAutoscaler must not both act on CPU or memory, because each one's changes distort the other's metric. Vertical Pod autoscaling can be combined with horizontal Pod autoscaling on custom or external metrics, so moving the HPA to requests per second lets VPA manage the requests.
  options:
    b:
      en: |-
        Both autoscalers would react to CPU, and VPA's request changes alter the utilization that the HPA uses, which Google says not to combine.
    c:
      en: |-
        Cluster autoscaling adds or removes nodes; it doesn't right-size the Pods' CPU and memory requests.
    d:
      en: |-
        A fixed replica count stops the number of Pods from following the load, which breaks the requirement.
references:
  - title: "Vertical Pod autoscaling | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/verticalpodautoscaler
  - title: "Horizontal Pod autoscaling | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/horizontalpodautoscaler
