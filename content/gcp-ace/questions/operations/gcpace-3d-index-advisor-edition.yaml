id: gcpace-3d-index-advisor-edition
objective: "3.4.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A logistics company runs a Cloud SQL for PostgreSQL 16 primary instance named `fleet-db` in the Enterprise edition, on a dedicated-core machine type. Query Insights is enabled, and several reporting queries perform full table scans. The database team wants Cloud SQL to analyze the workload and recommend indexes in the Query Insights dashboard.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Upgrade `fleet-db` to the Cloud SQL Enterprise Plus edition.
    - id: b
      text:
        en: |-
          Create a read replica of `fleet-db`, and enable index advisor on the replica.
    - id: c
      text:
        en: |-
          Run `SELECT * FROM google_db_advisor_recommend_indexes();` on `fleet-db` in its current edition.
    - id: d
      text:
        en: |-
          In the Query Insights settings of `fleet-db`, enable the Enterprise Plus features and select **Enable index advisor**.
    - id: e
      text:
        en: |-
          Use the Cloud SQL overprovisioned instance recommender to get the recommendations for `fleet-db`.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Index advisor is available only for Cloud SQL Enterprise Plus edition instances, so the instance must be upgraded first. Index advisor is then turned on in the Query Insights settings, with Query Insights for Enterprise Plus enabled, and its recommendations appear in the Recommendation column of the dashboard.
  options:
    b:
      en: |-
        Index advisor doesn't support read replicas, and a replica in the Enterprise edition wouldn't support it either.
    c:
      en: |-
        This function belongs to index advisor and can only run once index advisor is enabled, which requires the Enterprise Plus edition.
    e:
      en: |-
        This recommender suggests a smaller instance size when the instance is underused; it doesn't recommend indexes.
references:
  - title: "Use index advisor | Cloud SQL for PostgreSQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/postgres/use-index-advisor
  - title: "Use query insights to improve query performance | Cloud SQL for PostgreSQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/postgres/using-query-insights
