id: gcpace-3b-spanner-query-plan
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A query on the Spanner database `orders-db` of the instance `prod-sp` has become slow. From the command line, you must view the query's execution plan without returning any rows and without collecting execution statistics.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud spanner databases execute-sql orders-db --instance=prod-sp --query-mode=PROFILE --sql='SELECT * FROM Orders WHERE CustomerId = 42'`
    - id: b
      text:
        en: |-
          `gcloud spanner databases execute-sql orders-db --instance=prod-sp --query-mode=PLAN --sql='SELECT * FROM Orders WHERE CustomerId = 42'`
    - id: c
      text:
        en: |-
          `gcloud spanner databases execute-sql orders-db --instance=prod-sp --query-mode=NORMAL --sql='SELECT * FROM Orders WHERE CustomerId = 42'`
    - id: d
      text:
        en: |-
          `gcloud spanner databases execute-sql orders-db --instance=prod-sp --query-mode=WITH_STATS --sql='SELECT * FROM Orders WHERE CustomerId = 42'`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud spanner databases execute-sql` runs a query against a Spanner database, and `--query-mode` selects what it returns. `PLAN` returns only the query plan, without rows or statistics.
  options:
    a:
      en: |-
        `PROFILE` executes the query and returns the plan, the overall and operator-level statistics, and the rows.
    c:
      en: |-
        `NORMAL`, the default, returns only the query results.
    d:
      en: |-
        `WITH_STATS` returns overall statistics and the rows, but no plan.
references:
  - title: "gcloud spanner databases execute-sql | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/spanner/databases/execute-sql
