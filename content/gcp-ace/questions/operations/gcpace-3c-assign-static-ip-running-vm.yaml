id: gcpace-3c-assign-static-ip-running-vm
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A news company reserved the static external IP address `web-ip` (`198.51.100.20`) in `us-east1` and registered it in a public DNS record. The running VM `web-1` in `us-east1-b` currently has an ephemeral external IP address in the default access config `external-nat`. `web-1` must use `web-ip` without being recreated, and a short loss of external connectivity is acceptable.

    Which two commands should you run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute instances delete-access-config web-1 --zone=us-east1-b --access-config-name="external-nat"`
    - id: b
      text:
        en: |-
          `gcloud compute addresses create web-ip-2 --region=us-east1 --addresses=CURRENT_EPHEMERAL_IP`
    - id: c
      text:
        en: |-
          `gcloud compute instances network-interfaces update web-1 --zone=us-east1-b --private-network-ip=198.51.100.20`
    - id: d
      text:
        en: |-
          `gcloud compute instances add-access-config web-1 --zone=us-east1-b --access-config-name="external-nat" --address=198.51.100.20`
    - id: e
      text:
        en: |-
          `gcloud compute instances create web-1 --zone=us-east1-b --address=web-ip`
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A network interface can't get a new external address while it already has one, so you first delete its access config, which releases the ephemeral address. You then add an access config with `--address` set to the IP address of the reserved static address.
  options:
    b:
      en: |-
        Promoting the current ephemeral address keeps the old address, not the `web-ip` address registered in DNS.
    c:
      en: |-
        `--private-network-ip` sets the internal IP address of the interface; an external address is set through an access config.
    e:
      en: |-
        Creating the VM again requires deleting the existing `web-1` first, and the VM must not be recreated.
references:
  - title: "Configure static external IP addresses | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/ip-addresses/configure-static-external-ip-address
