id: gcpace-3b-gke-tpu-pod-spec
objective: "3.1.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a GKE Standard cluster, you created a single-host TPU Trillium (v6e) node pool with the `ct6e-standard-4t` machine type, which provides 4 TPU chips per node in a `2x2` topology. A training Pod must run on this node pool and use all 4 chips of one node.

    Which Pod configuration should you use?
body:
  options:
    - id: a
      text:
        en: |-
          Node selector `cloud.google.com/gke-accelerator: tpu-v6e-slice`, and the resource limit `nvidia.com/gpu: 4`.
    - id: b
      text:
        en: |-
          Node selectors `cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice` and `cloud.google.com/gke-tpu-topology: 2x2`, a request of `google.com/tpu: 2`, and a limit of `google.com/tpu: 4`.
    - id: c
      text:
        en: |-
          Node selectors `cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice` and `cloud.google.com/gke-tpu-topology: 4x4`, and both a request and a limit of `google.com/tpu: 4`.
    - id: d
      text:
        en: |-
          Node selectors `cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice` and `cloud.google.com/gke-tpu-topology: 2x2`, and both a request and a limit of `google.com/tpu: 4`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      TPU Pods select the TPU version with `cloud.google.com/gke-tpu-accelerator` (`tpu-v6e-slice` for Trillium) and the slice shape with `cloud.google.com/gke-tpu-topology`; `2x2` is the single-host topology of a 4-chip `ct6e-standard-4t` node. The container requests chips with the `google.com/tpu` resource, and the documentation requires the same value in requests and limits.
  options:
    a:
      en: |-
        TPU chips aren't exposed as `nvidia.com/gpu` resources, and TPU nodes are selected with the `gke-tpu-accelerator` label, not the GPU label.
    b:
      en: |-
        The `google.com/tpu` value must be identical in requests and limits.
    c:
      en: |-
        A `4x4` topology describes a 16-chip multi-host slice, so the Pod wouldn't match the single-host `2x2` node pool.
references:
  - title: "Plan TPUs in GKE | GKE AI/ML | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/plan-tpus
  - title: "Deploy TPU workloads in GKE Standard | GKE AI/ML | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/tpus
