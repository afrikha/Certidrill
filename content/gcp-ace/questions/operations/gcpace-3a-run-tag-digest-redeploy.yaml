id: gcpace-3a-run-tag-digest-redeploy
objective: "3.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Cloud Run service portal was deployed from `us-docker.pkg.dev/acme/web/portal:latest`, and all traffic goes to its latest revision. A CI job built a fixed image and pushed it to the same `latest` tag. The service still runs the old code, and no new revision appears in the revision list.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud run deploy portal --image=us-docker.pkg.dev/acme/web/portal:latest`.
    - id: b
      text:
        en: |-
          Run `gcloud run services update-traffic portal --to-latest`.
    - id: c
      text:
        en: |-
          Delete the older revisions of portal with `gcloud run revisions delete`.
    - id: d
      text:
        en: |-
          Set the minimum number of instances of portal to 0 so that the running instances are replaced.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When you deploy from a tag, Cloud Run resolves the tag to an image digest, and the revision always serves that digest. Pushing a new image to the same tag doesn't change the existing revision, so you deploy again to create a revision with the new digest.
  options:
    b:
      en: |-
        The traffic already goes to the latest revision, and that revision still points to the old digest.
    c:
      en: |-
        Deleting old revisions doesn't change the image of the serving revision, which still uses the old digest.
    d:
      en: |-
        New instances start from the same revision and the same old digest, so they still run the old code.
references:
  - title: "Deploy container images to Cloud Run services | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/deploying
