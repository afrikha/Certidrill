id: gcpace-3c-dns-forward-onprem
objective: "3.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company connects its VPC network `hub-vpc` to its data center with HA VPN. The domain `corp.example.com` is hosted on the on-premises DNS servers `192.168.10.53` and `192.168.10.54`, and its records change every day. VMs in `hub-vpc` must resolve these names without copying records into Google Cloud. Cloud Router already advertises `35.199.192.0/19` to the data center.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a private forwarding zone for `corp.example.com.` authorized for `hub-vpc`, with `--forwarding-targets=192.168.10.53,192.168.10.54`.
    - id: b
      text:
        en: |-
          Create a DNS server policy on `hub-vpc` with `--enable-inbound-forwarding`.
    - id: c
      text:
        en: |-
          Create a private zone for `corp.example.com.` and add the on-premises records with `gcloud dns record-sets create`.
    - id: d
      text:
        en: |-
          Create a DNS peering zone for `corp.example.com.` whose target network is `hub-vpc`.
    - id: e
      text:
        en: |-
          Allow UDP and TCP port 53 from `35.199.192.0/19` to the DNS servers on the on-premises firewalls.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      A forwarding zone sends the queries for `corp.example.com` from the authorized VPC network to the on-premises name servers, so the records stay only on premises. Cloud DNS sends these forwarded queries from `35.199.192.0/19`, so the on-premises firewalls must allow that range on port 53; the return route is already advertised.
  options:
    b:
      en: |-
        Inbound forwarding lets on-premises clients resolve Google Cloud private zones, the opposite direction.
    c:
      en: |-
        Copying the records into a private zone is what the requirement forbids, and daily changes would make the copy stale.
    d:
      en: |-
        A peering zone sends queries to another VPC network's resolution order, not to on-premises servers; targeting `hub-vpc` itself achieves nothing.
references:
  - title: "Best practices for Cloud DNS | Google Cloud Documentation"
    url: https://docs.cloud.google.com/dns/docs/best-practices
