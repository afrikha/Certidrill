id: gcpace-3c-alert-retest-window
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An alerting policy of a fintech company monitors the CPU utilization of its database VMs with a metric-threshold condition above 90%. The policy pages the on-call engineer on short spikes that last one or two minutes. The team wants a notification only when the condition stays met for 10 consecutive minutes.

    Which setting of the condition should you change?
body:
  options:
    - id: a
      text:
        en: |-
          Set the Alert autoclose duration of the policy to 10 minutes.
    - id: b
      text:
        en: |-
          Set the Rolling window function of the condition to max.
    - id: c
      text:
        en: |-
          Set the Retest window in the Advanced options of the condition to 10 minutes.
    - id: d
      text:
        en: |-
          Turn on Notify on alert closure in the notification settings of the policy.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The retest window is how long the condition must remain met before it triggers; its default is No retest, so any single violation opens an incident. A 10-minute retest window ignores the short spikes and alerts only on sustained high CPU utilization.
  options:
    a:
      en: |-
        Alert autoclose duration controls when an open incident closes without new data, not when it opens.
    b:
      en: |-
        Using the maximum value in each window makes spikes more visible, so the policy would fire at least as often.
    d:
      en: |-
        Notify on alert closure sends an extra notification when an incident closes; it doesn't filter the spikes.
references:
  - title: "Create metric-threshold alerting policies | Cloud Monitoring | Google Cloud Documentation"
    url: https://docs.cloud.google.com/monitoring/alerts/using-alerting-ui
