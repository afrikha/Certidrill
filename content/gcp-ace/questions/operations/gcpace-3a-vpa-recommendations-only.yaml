id: gcpace-3a-vpa-recommendations-only
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A GKE Standard cluster named billing doesn't have vertical Pod autoscaling enabled. The team wants CPU and memory request recommendations for the Deployment invoicer, based on observed usage. Pods must not be evicted or restarted by the autoscaler; the team will apply the values itself.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable vertical Pod autoscaling on the cluster, and create a VerticalPodAutoscaler for invoicer with `updateMode: "Initial"`.
    - id: b
      text:
        en: |-
          Enable vertical Pod autoscaling on the cluster, and create a VerticalPodAutoscaler for invoicer with `updateMode: "Recreate"`.
    - id: c
      text:
        en: |-
          Create a HorizontalPodAutoscaler for invoicer that targets 50% CPU utilization, and read its status.
    - id: d
      text:
        en: |-
          Enable vertical Pod autoscaling on the cluster, and create a VerticalPodAutoscaler for invoicer with `updateMode: "Off"`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      On a Standard cluster, you first enable vertical Pod autoscaling, for example with `gcloud container clusters update billing --enable-vertical-pod-autoscaling`. A VerticalPodAutoscaler in Off mode computes recommendations, visible in its status, without applying them to Pods.
  options:
    a:
      en: |-
        Initial mode applies the recommended requests to every new Pod at creation, so the autoscaler changes the values instead of the team.
    b:
      en: |-
        Recreate mode evicts Pods to apply new requests, which the team forbids.
    c:
      en: |-
        A HorizontalPodAutoscaler changes the replica count and gives no recommendation for per-Pod requests.
references:
  - title: "Vertical Pod autoscaling | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/verticalpodautoscaler
