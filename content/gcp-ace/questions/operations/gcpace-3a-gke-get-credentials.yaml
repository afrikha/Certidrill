id: gcpace-3a-gke-get-credentials
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You installed the gcloud CLI, kubectl and gke-gcloud-auth-plugin on a new laptop and signed in with `gcloud auth login`. Your team runs a regional GKE cluster named shop-prod in us-central1. Running `kubectl get nodes` fails because kubectl has no configuration for any cluster.

    What should you do first?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud container clusters describe shop-prod --location=us-central1`.
    - id: b
      text:
        en: |-
          Run `gcloud container clusters get-credentials shop-prod --location=us-central1`.
    - id: c
      text:
        en: |-
          Run `kubectl config use-context shop-prod`.
    - id: d
      text:
        en: |-
          Run `gcloud auth application-default login`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud container clusters get-credentials` writes the cluster's endpoint and authentication settings to the kubeconfig file and makes the cluster the current context. kubectl can then reach the control plane and list the nodes.
  options:
    a:
      en: |-
        `describe` only prints the cluster's configuration; it doesn't add an entry to the kubeconfig file.
    c:
      en: |-
        `use-context` switches to a context that already exists in the kubeconfig file, and there is none yet.
    d:
      en: |-
        Application Default Credentials are for client libraries and tools that use them; they don't create the kubeconfig entry that kubectl needs.
references:
  - title: "Install kubectl and configure cluster access | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl
