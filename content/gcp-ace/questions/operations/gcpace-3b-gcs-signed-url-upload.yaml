id: gcpace-3b-gcs-signed-url-upload
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A supplier who has no Google account must upload one CSV file to `gs://supplier-inbox/acme/invoice-2026-11.csv` within the next hour. You have Service Account Token Creator on `uploader@retail-prj.iam.gserviceaccount.com`, which has Storage Object Creator on the bucket. Company policy forbids service account keys, and the supplier must not be able to read or upload any other object.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud storage sign-url gs://supplier-inbox/acme/invoice-2026-11.csv --duration=1h --impersonate-service-account=uploader@retail-prj.iam.gserviceaccount.com`, and send the URL.
    - id: b
      text:
        en: |-
          Run `gcloud storage sign-url gs://supplier-inbox/acme/invoice-2026-11.csv --http-verb=PUT --duration=1h --headers=content-type=text/csv --impersonate-service-account=uploader@retail-prj.iam.gserviceaccount.com`, and send the URL.
    - id: c
      text:
        en: |-
          Grant `allUsers` Storage Object Creator on the bucket for one hour, and send the supplier the object name to use.
    - id: d
      text:
        en: |-
          Run `gcloud storage sign-url gs://supplier-inbox/acme/invoice-2026-11.csv --http-verb=PUT --duration=7d --headers=content-type=text/csv --impersonate-service-account=uploader@retail-prj.iam.gserviceaccount.com`, and send the URL.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A signed URL authorizes one HTTP method on one object for a limited time, and anyone who holds it can use it without a Google account. `--http-verb=PUT` creates an upload URL (the default is GET, a download), and the signed `content-type` header must match the upload. Signing through impersonation uses a system-managed key, so no service account key is needed.
  options:
    a:
      en: |-
        Without `--http-verb`, the URL authorizes GET, so the supplier could only download the object, not upload it.
    c:
      en: |-
        A public grant lets anyone on the internet upload objects under any name in the bucket during that hour.
    d:
      en: |-
        With impersonation, the system-managed signing key limits the duration to 12 hours; 7 days is allowed only when signing with a key file or an activated service account.
references:
  - title: "gcloud storage sign-url | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/sign-url
  - title: "Signed URLs | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/access-control/signed-urls
