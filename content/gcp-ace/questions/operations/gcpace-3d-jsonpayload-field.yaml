id: gcpace-3d-jsonpayload-field
objective: "3.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Cloud Run service writes each log entry to standard output as a single line of serialized JSON that contains the keys `severity`, `message` and `orderId`. A support engineer expands one of these entries in the Logs Explorer to find the order ID of a failed request.

    In which field of the expanded entry is the order ID?
body:
  options:
    - id: a
      text:
        en: |-
          `textPayload.orderId`
    - id: b
      text:
        en: |-
          `labels.orderId`
    - id: c
      text:
        en: |-
          `protoPayload.orderId`
    - id: d
      text:
        en: |-
          `jsonPayload.orderId`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Cloud Logging parses a single line of serialized JSON written by a Cloud Run container and stores it as the entry's `jsonPayload`, so custom keys such as `orderId` appear under `jsonPayload`. The special `severity` key becomes the entry's severity, and `message` becomes its main display text.
  options:
    a:
      en: |-
        `textPayload` holds plain text written to standard output; it is a string without subfields and isn't used when the line is valid JSON.
    b:
      en: |-
        `labels` holds key-value metadata attached to the entry, not the keys of the JSON payload written by the application.
    c:
      en: |-
        `protoPayload` holds Google-defined protocol buffer payloads, such as audit log entries, not application JSON.
references:
  - title: "Logging and viewing logs in Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/logging
  - title: "LogEntry | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
