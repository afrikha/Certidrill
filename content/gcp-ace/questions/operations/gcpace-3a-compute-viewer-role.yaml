id: gcpace-3a-compute-viewer-role
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external auditor must be able to view the VMs of a production project, including their status, machine type and attached disks, in the Google Cloud console. The auditor must not be able to change, start, stop or connect to any VM, and must not see resources of other Google Cloud services. You must follow the principle of least privilege.

    Which role should you grant to the auditor on the project?
body:
  options:
    - id: a
      text:
        en: |-
          Compute Instance Admin (v1) (`roles/compute.instanceAdmin.v1`)
    - id: b
      text:
        en: |-
          Compute OS Login (`roles/compute.osLogin`)
    - id: c
      text:
        en: |-
          Reader (`roles/reader`)
    - id: d
      text:
        en: |-
          Compute Viewer (`roles/compute.viewer`)
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Compute Viewer gives read-only access to get and list Compute Engine resources, such as VMs and disks, and nothing else. It lets the auditor see the VMs and their details without any permission to modify or connect to them.
  options:
    a:
      en: |-
        Compute Instance Admin (v1) allows creating, modifying, starting, stopping and deleting VMs, far beyond read-only access.
    b:
      en: |-
        Compute OS Login lets a user sign in to VMs over SSH, which the auditor must not be able to do, and it isn't meant for viewing the inventory.
    c:
      en: |-
        Reader is a basic role that grants read access to resources of almost every service in the project, which is broader than needed and isn't recommended in production.
references:
  - title: "Compute Engine IAM roles and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/access/iam
