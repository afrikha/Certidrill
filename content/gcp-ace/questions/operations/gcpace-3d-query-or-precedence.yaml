id: gcpace-3d-query-or-precedence
objective: "3.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    During an incident review, you open the Logs Explorer in a project that runs both Compute Engine VMs and a GKE cluster. You need a single query that returns the entries with a severity of `ERROR` or higher from the Compute Engine VMs, together with all the entries from the GKE containers, whatever their severity.

    Which query should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `severity>=ERROR AND resource.type="gce_instance" OR resource.type="k8s_container"`
    - id: b
      text:
        en: |-
          `(severity>=ERROR AND resource.type="gce_instance") OR resource.type="k8s_container"`
    - id: c
      text:
        en: |-
          `severity>=ERROR AND (resource.type="gce_instance" OR resource.type="k8s_container")`
    - id: d
      text:
        en: |-
          `resource.type="k8s_container" OR resource.type="gce_instance" AND severity>=ERROR`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In the Logging query language, `OR` has a higher precedence than `AND`, so a query that mixes them without parentheses doesn't group the way it reads. The parentheses make the severity condition apply only to the `gce_instance` entries, and the `OR` then adds every `k8s_container` entry.
  options:
    a:
      en: |-
        Because `OR` binds tighter than `AND`, this query means `severity>=ERROR AND (gce_instance OR k8s_container)`, which drops the GKE entries below `ERROR`.
    c:
      en: |-
        The severity condition applies to both resource types, so the GKE container entries below `ERROR` are missing.
    d:
      en: |-
        This groups as `(k8s_container OR gce_instance) AND severity>=ERROR`, so it also filters the GKE entries on severity.
references:
  - title: "Logging query language | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/view/logging-query-language
