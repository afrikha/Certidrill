id: gcpace-3d-cloud-hub-pages
objective: "3.4.14"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The platform lead of a fintech company reviews a project in Cloud Hub every Monday. The lead must check the Application Design Center deployments that failed and the deployed applications that have updates available, and then check the open support cases and the company's support package information.

    Which two Cloud Hub pages should the lead use? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Deployments
    - id: b
      text:
        en: |-
          Health & troubleshooting
    - id: c
      text:
        en: |-
          Optimization
    - id: d
      text:
        en: |-
          Support
    - id: e
      text:
        en: |-
          Security & compliance
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The Deployments page of Cloud Hub lists failed Application Design Center deployments and deployed applications with available updates. The Support page shows open support cases, lets you open a new one, and displays the active incidents, in-progress maintenance and support package information.
  options:
    b:
      en: |-
        Health & troubleshooting shows open alerts, active Google Cloud incidents and resource health metrics, not deployments or support cases.
    c:
      en: |-
        Optimization shows the cost, cost trend and costly low-utilization resources.
    e:
      en: |-
        Security & compliance shows Security Command Center findings and compliance frameworks.
references:
  - title: "Cloud Hub overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/hub/docs/overview
