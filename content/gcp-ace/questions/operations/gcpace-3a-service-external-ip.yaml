id: gcpace-3a-service-external-ip
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deployed a web application to GKE and exposed it with a Service named storefront of type LoadBalancer in the namespace shop. You need the public IP address that GKE assigned to the load balancer so that the DNS team can create a record. No static IP address was reserved.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `kubectl get service storefront --namespace=shop`
    - id: b
      text:
        en: |-
          `kubectl get pods --namespace=shop -o wide`
    - id: c
      text:
        en: |-
          `gcloud compute addresses list`
    - id: d
      text:
        en: |-
          `kubectl get nodes -o wide`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `kubectl get service` shows each Service's type, cluster IP and EXTERNAL-IP. For a LoadBalancer Service, EXTERNAL-IP is the address of the load balancer that GKE provisioned, once it is ready.
  options:
    b:
      en: |-
        Pod IP addresses are internal cluster addresses, not the address of the load balancer.
    c:
      en: |-
        This lists reserved addresses; the ephemeral address that GKE assigned to the load balancer isn't a reserved address.
    d:
      en: |-
        Node addresses belong to the node VMs; clients must use the load balancer's address, not a node's.
references:
  - title: "About LoadBalancer Services | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/service-load-balancer
