id: gcpace-3a-list-stopped-terminated
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A finance team wants to review the VMs that were stopped with `gcloud compute instances stop` and are still in the project, because their persistent disks keep generating charges. You plan to run `gcloud compute instances list` with a filter on the status field.

    Which filter should you use?
body:
  options:
    - id: a
      text:
        en: |-
          `--filter="status=STOPPED"`
    - id: b
      text:
        en: |-
          `--filter="status=TERMINATED"`
    - id: c
      text:
        en: |-
          `--filter="status=SUSPENDED"`
    - id: d
      text:
        en: |-
          `--filter="status=STOPPING"`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When a stop operation completes, Compute Engine sets the VM state to TERMINATED, so stopped VMs are listed with that status. Attached disks and reserved IP addresses keep being billed in that state.
  options:
    a:
      en: |-
        Compute Engine has no STOPPED state for VMs, so this filter returns nothing.
    c:
      en: |-
        SUSPENDED applies to VMs that were suspended, not stopped; the stopped VMs wouldn't be listed.
    d:
      en: |-
        STOPPING is the short transition state while a VM shuts down; VMs that finished stopping are no longer in it.
references:
  - title: "Compute Engine instance lifecycle | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/instance-life-cycle
