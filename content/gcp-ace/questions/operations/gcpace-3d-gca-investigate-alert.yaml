id: gcpace-3d-gca-investigate-alert
objective: "3.4.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company has a Premium Support contract, and Gemini Cloud Assist is set up in its project. A Cloud Monitoring alerting policy on the error rate of a GKE workload has just opened an alert that has a resource label. The on-call SRE wants an AI-driven root-cause analysis of the logs, metrics and configuration behind this alert, with the alert's title, start time and resources filled in, with the least effort.

    What should the SRE do?
body:
  options:
    - id: a
      text:
        en: |-
          Open the alert in Cloud Monitoring, and click **Investigate** to start a Gemini Cloud Assist investigation.
    - id: b
      text:
        en: |-
          Create a support case from the alert, and attach the logs of the workload so that Google Support can analyze them.
    - id: c
      text:
        en: |-
          Export the workload's logs to BigQuery with a sink, and query them in BigQuery Studio for the alert's time range.
    - id: d
      text:
        en: |-
          Create a log-based metric for the workload's errors, and add a chart of the metric to a custom dashboard.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Gemini Cloud Assist investigations, a Preview feature, perform root-cause analysis from logs, metrics and configurations and return observations, a diagnosis and recommended steps. In Cloud Monitoring, the **Investigate** button appears on alerts that have a resource label and fills in the title, description, start time and resources. Since April 10, 2026, creating investigations is limited to customers with a Premium Support contract or who requested access.
  options:
    b:
      en: |-
        A support case relies on Google Support engineers and takes longer; it isn't an immediate AI-driven analysis started from the alert.
    c:
      en: |-
        Exporting and querying logs is a manual analysis that doesn't cover metrics and configuration, and it requires building the queries yourself.
    d:
      en: |-
        A log-based metric and a chart only visualize the errors that the alert already reports; they don't analyze their cause.
references:
  - title: "Troubleshoot issues with Gemini Cloud Assist investigations | Google Cloud Documentation"
    url: https://docs.cloud.google.com/cloud-assist/investigations
