id: gcpace-3d-gmp-globalrules-system
objective: "3.4.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A GKE cluster uses Managed Service for Prometheus managed collection and its managed rule evaluator. The platform team needs an alerting rule, written in PromQL and evaluated by the managed rule evaluator, whose expression uses GKE system metrics about container restarts. The alerts are sent to the team's Alertmanager.

    Which resource should the team create for this rule?
body:
  options:
    - id: a
      text:
        en: |-
          A `Rules` resource in the namespace of the platform team's workloads
    - id: b
      text:
        en: |-
          A `ClusterRules` resource that applies to all the namespaces of the cluster
    - id: c
      text:
        en: |-
          A `GlobalRules` resource that applies to all the projects of the metrics scope
    - id: d
      text:
        en: |-
          A `ClusterPodMonitoring` resource whose endpoints include the alerting rule
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `Rules` and `ClusterRules` restrict their expressions to the time series sent by the cluster (and, for `Rules`, by one namespace). `GlobalRules` evaluates across all the projects of the metrics scope without label restrictions, and the documentation states that it is required for rules that use Cloud Monitoring metrics and GKE system metrics.
  options:
    a:
      en: |-
        A `Rules` resource only sees the time series of its own project, cluster and namespace, so it can't evaluate GKE system metrics.
    b:
      en: |-
        A `ClusterRules` resource covers the Prometheus metrics sent from all the namespaces of one cluster, but it isn't the resource for GKE system metrics.
    d:
      en: |-
        `ClusterPodMonitoring` configures scraping; recording and alerting rules are defined in rule resources, not in scrape endpoints.
references:
  - title: "Managed rule evaluation and alerting | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/managed-prometheus/rules-managed
