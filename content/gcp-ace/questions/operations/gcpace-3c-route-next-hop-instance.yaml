id: gcpace-3c-route-next-hop-instance
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company's VPC network `corp-net` has a VM `vpn-gw-1` in `us-central1-a` that runs third-party VPN software connected to a branch office. IP forwarding is enabled on the VM, and firewall rules allow the traffic. VMs in `corp-net` must reach the branch range `192.168.50.0/24` through `vpn-gw-1`.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute routes create to-branch --network=corp-net --destination-range=192.168.50.0/24 --next-hop-gateway=default-internet-gateway`
    - id: b
      text:
        en: |-
          `gcloud compute routes create to-branch --network=corp-net --destination-range=192.168.50.0/24 --next-hop-instance=vpn-gw-1 --next-hop-instance-zone=us-central1-a`
    - id: c
      text:
        en: |-
          `gcloud compute networks subnets create branch --network=corp-net --range=192.168.50.0/24 --region=us-central1`
    - id: d
      text:
        en: |-
          `gcloud compute routes create to-branch --network=corp-net --destination-range=192.168.50.0/24 --next-hop-vpn-tunnel=vpn-gw-1 --next-hop-vpn-tunnel-region=us-central1`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A custom static route with `--next-hop-instance` and `--next-hop-instance-zone` sends packets for the destination range to the named VM, which forwards them. IP forwarding on the VM and firewall rules that allow the routed packets are the other prerequisites, and both are already in place.
  options:
    a:
      en: |-
        The default internet gateway sends packets to the internet; private branch addresses aren't reachable that way.
    c:
      en: |-
        Creating a subnet with the branch range makes those addresses local to the VPC network instead of routing them to the branch office.
    d:
      en: |-
        `--next-hop-vpn-tunnel` expects a Classic VPN tunnel resource, not a VM running VPN software.
references:
  - title: "Use routes | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/using-routes
