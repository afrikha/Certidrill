id: gcpace-3b-bq-dry-run
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before running a new GoogleSQL query on the table `web.events` of the default project, which uses on-demand pricing, an analyst must find out how many bytes the query will process, without being charged for the query.

    Which command should the analyst run?
body:
  options:
    - id: a
      text:
        en: |-
          `bq query --use_legacy_sql=false --dry_run 'SELECT page, COUNT(*) FROM web.events GROUP BY page'`
    - id: b
      text:
        en: |-
          `bq query --use_legacy_sql=false --max_rows=10 'SELECT page, COUNT(*) FROM web.events GROUP BY page'`
    - id: c
      text:
        en: |-
          `bq head --max_rows=10 web.events`
    - id: d
      text:
        en: |-
          `bq show --format=prettyjson web.events`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A dry run validates the query and returns an estimate of the bytes it would process, which gives the on-demand cost. Dry runs don't use query slots and aren't charged.
  options:
    b:
      en: |-
        `--max_rows` only limits how many result rows the command prints; the query still runs and processes, and bills, all the bytes it scans.
    c:
      en: |-
        `bq head` displays sample rows of the table; it doesn't estimate what a specific query would process.
    d:
      en: |-
        `bq show` displays the table's metadata, including its total size, but a query that selects some columns processes a different number of bytes.
references:
  - title: "Run a query | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/running-queries
