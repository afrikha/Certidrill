id: gcpace-3c-cloudsql-cmek-existing
objective: "3.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company runs a Cloud SQL for MySQL instance `claims-db` in `us-east4`, created with the default Google-managed encryption. An audit now requires that the database be protected by a customer-managed encryption key. The security team created a key in a key ring in `us-east4`. A short maintenance window is approved.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a read replica of `claims-db` in `us-east4` that uses the new key, then promote the replica to a standalone instance.
    - id: b
      text:
        en: |-
          Create a new Cloud SQL instance in `us-east4` with `--disk-encryption-key` set to the new key, then migrate the data from `claims-db` to it.
    - id: c
      text:
        en: |-
          Enforce the organization policy constraint `constraints/gcp.restrictNonCmekServices` on the project so that `claims-db` is re-encrypted.
    - id: d
      text:
        en: |-
          Create a new key in the `us` multi-region, then create a new instance in `us-east4` that uses it and migrate the data.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      You can't enable CMEK on an existing Cloud SQL instance, and the encryption key type can't be changed after creation. You must create a new instance with `--disk-encryption-key` pointing to a key in the instance's region, then move the data, for example with an export and import during the maintenance window.
  options:
    a:
      en: |-
        A replica in the same region inherits the encryption of its primary instance; you can't assign it a different key, so it stays Google-managed.
    c:
      en: |-
        That constraint makes new resource creation require CMEK; it doesn't re-encrypt existing instances.
    d:
      en: |-
        The key ring of a Cloud SQL instance must be in the instance's region; a multi-region or global key doesn't work, so the creation fails.
references:
  - title: "About customer-managed encryption keys (CMEK) | Cloud SQL for MySQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/mysql/cmek
