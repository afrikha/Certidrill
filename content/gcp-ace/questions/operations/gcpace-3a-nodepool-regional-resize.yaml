id: gcpace-3a-nodepool-regional-resize
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A regional GKE Standard cluster named orders in us-east1 has nodes in three zones. Its node pool api-pool has autoscaling disabled. Before a sales event, the pool must have exactly 6 nodes in total, spread evenly across the three zones. You plan to run `gcloud container clusters resize orders --location=us-east1 --node-pool=api-pool --num-nodes=N`.

    Which value of N should you use?
body:
  shuffle: false
  options:
    - id: a
      text:
        en: |-
          1
    - id: b
      text:
        en: |-
          2
    - id: c
      text:
        en: |-
          3
    - id: d
      text:
        en: |-
          6
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For regional and multi-zonal clusters, `--num-nodes` is the number of nodes per zone. Two nodes in each of the three zones give the six nodes required.
  options:
    a:
      en: |-
        One node per zone gives only three nodes in total.
    c:
      en: |-
        Three nodes per zone gives nine nodes in total.
    d:
      en: |-
        The value is applied in each zone, so 6 would create 18 nodes.
references:
  - title: "Add and manage node pools | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-pools
