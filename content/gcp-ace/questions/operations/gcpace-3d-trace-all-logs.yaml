id: gcpace-3d-trace-all-logs
objective: "3.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An order request goes through three Cloud Run services before it fails. In the Logs Explorer, you expand the error entry of the last service and see that the entry has a `trace` field. You need to see every log entry, from all three services, that was written while this request was processed.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Click the `spanId` value of the entry, and select **Show matching entries**.
    - id: b
      text:
        en: |-
          Click the trace icon of the entry, and select **Show all logs for this trace**.
    - id: c
      text:
        en: |-
          Add a `receiveTimestamp` comparison that matches the second in which the entry was received.
    - id: d
      text:
        en: |-
          Click the trace icon of the entry, and select **Show only traced requests**.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The `trace` field links an entry to a Cloud Trace trace, which covers the whole request across services. **Show all logs for this trace** adds the entry's `trace` value to the query, so the results include every entry, from any service, that carries the same trace ID.
  options:
    a:
      en: |-
        `spanId` identifies only the span in which this entry was written, so the entries of the other services, which have their own spans, aren't returned.
    c:
      en: |-
        Entries received in the same second can come from any request, and entries of this request can be received at other times, so a timestamp doesn't identify the request.
    d:
      en: |-
        **Show only traced requests** adds a `traceSampled` condition, which returns entries of every sampled request, not just the entries of this request.
references:
  - title: "View and analyze log entries | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/view/logs-explorer-interface
  - title: "LogEntry | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
