id: gcpace-3c-gcs-cmek-existing-objects
objective: "3.2.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A legal services company has a Cloud Storage bucket `gs://contracts-archive` in the `europe-west1` region. The bucket contains 2 million objects encrypted with Google-managed keys. A new policy requires that all existing objects and all future uploads be protected with the customer-managed key `contracts-key`, created in a key ring in `europe-west1` in a separate security project. The Cloud Storage service agent of the bucket's project is already authorized to use the key.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Recreate the key in the `global` location so that the bucket can use it from any region.
    - id: b
      text:
        en: |-
          Run `gcloud storage buckets update gs://contracts-archive --default-encryption-key=KEY_RESOURCE` to set the bucket's default key.
    - id: c
      text:
        en: |-
          Run `gcloud storage buckets update gs://contracts-archive --clear-default-encryption-key` so that the objects use the new key.
    - id: d
      text:
        en: |-
          Enable Data Access audit logs for Cloud Storage so that every object read uses the new key.
    - id: e
      text:
        en: |-
          Run `gcloud storage objects update gs://contracts-archive/** --encryption-key=KEY_RESOURCE` to rewrite the existing objects with the key.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Setting the bucket's default key protects the objects uploaded from now on, but objects written before the default key is added or changed are unaffected. The existing objects must therefore be rewritten with `gcloud storage objects update --encryption-key`. The key ring can be in another project but must be in the bucket's location, as it is here.
  options:
    a:
      en: |-
        For Cloud Storage the key ring must be in the same location as the data; a `global` key can't protect a bucket in `europe-west1`, and the existing key is already in the right location.
    c:
      en: |-
        `--clear-default-encryption-key` removes the default key from the bucket, which is the opposite of the requirement.
    d:
      en: |-
        Data Access audit logs record who accesses the data; they don't change how objects are encrypted.
references:
  - title: "Use customer-managed encryption keys | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/encryption/using-customer-managed-keys
