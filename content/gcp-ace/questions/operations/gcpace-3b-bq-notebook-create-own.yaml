id: gcpace-3b-bq-notebook-create-own
objective: "3.1.15"
type: single
difficulty: 3
status: draft
stem:
  en: |
    To let analysts share BigQuery notebooks, an administrator granted the `analysts` group Dataform Admin on the project. An audit found that every analyst can now edit and delete all the notebooks in the project. Analysts must still be able to create notebooks in BigQuery Studio, and each analyst must have full control only over the notebooks that they create.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the project-level Dataform Admin grant with BigQuery Studio User, because BigQuery grants each creator Dataform Admin on the notebook that they create.
    - id: b
      text:
        en: |-
          Replace the project-level Dataform Admin grant with Code Editor on the project, so that analysts can create and edit notebooks without owning them.
    - id: c
      text:
        en: |-
          Replace the project-level Dataform Admin grant with Code Viewer on the project, so that analysts can only open the notebooks of other analysts.
    - id: d
      text:
        en: |-
          Replace the project-level Dataform Admin grant with BigQuery Admin on the project, so that notebook access follows BigQuery permissions.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Users with Dataform Admin on the project have owner access to every notebook in it, which is what the audit found. BigQuery Studio User is the role for creating notebooks, and when a user creates a notebook, BigQuery grants that user Dataform Admin on that notebook only, so each analyst controls their own notebooks.
  options:
    b:
      en: |-
        Code Editor on the project lets analysts edit every notebook in the project, which is the problem to remove.
    c:
      en: |-
        Code Viewer doesn't let analysts create notebooks, which they must still be able to do.
    d:
      en: |-
        BigQuery Admin is broader than needed and doesn't limit each analyst to their own notebooks.
references:
  - title: "Create notebooks | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/create-notebooks
