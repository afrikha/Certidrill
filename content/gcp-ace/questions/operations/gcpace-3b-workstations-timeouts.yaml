id: gcpace-3b-workstations-timeouts
objective: "3.1.16"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's security policy states that a Cloud Workstations workstation must stop 8 hours after it starts, even if the developer is still active, so that everyone starts a fresh session each day. To save cost, a workstation that receives no user traffic for 30 minutes must also stop. Both rules apply to the configuration `secure-ide` in cluster `fin-dev`, region `us-east1`.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud workstations configs update secure-ide --cluster=fin-dev --region=us-east1 --idle-timeout=28800 --running-timeout=1800`
    - id: b
      text:
        en: |-
          `gcloud workstations configs update secure-ide --cluster=fin-dev --region=us-east1 --idle-timeout=1800 --running-timeout=0`
    - id: c
      text:
        en: |-
          `gcloud workstations configs update secure-ide --cluster=fin-dev --region=us-east1 --idle-timeout=1800 --running-timeout=28800`
    - id: d
      text:
        en: |-
          `gcloud workstations configs update secure-ide --cluster=fin-dev --region=us-east1 --idle-timeout=1800 --running-timeout=480`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `--idle-timeout` stops a workstation that hasn't received user traffic for the given number of seconds, and `--running-timeout` stops it a given number of seconds after it started, whatever the activity. Both values are in seconds, so 30 minutes is 1800 and 8 hours is 28800.
  options:
    a:
      en: |-
        The values are swapped: workstations would stop after 30 minutes of use even when active, and idle ones would keep running for 8 hours.
    b:
      en: |-
        A running timeout of 0 means that workstations never stop because of their running time, which breaks the 8-hour rule.
    d:
      en: |-
        The values are in seconds, so 480 stops workstations 8 minutes after they start instead of 8 hours.
references:
  - title: "gcloud workstations configs create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/workstations/configs/create
