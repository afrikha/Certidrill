id: gcpace-3d-ops-agent-files-receiver
objective: "3.4.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Ops Agent runs with its default configuration on a Linux VM, and syslog entries already reach Cloud Logging. An application on the VM writes its own log files to `/var/log/orders/*.log`, and these entries must also be sent to Cloud Logging. The syslog collection must keep working.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          In `/etc/google-cloud-ops-agent/config.yaml`, add a `files` receiver with `include_paths: [/var/log/orders/*.log]` and a new pipeline that uses it, then restart the agent.
    - id: b
      text:
        en: |-
          In `/etc/google-cloud-ops-agent/config.yaml`, add a `syslog` receiver for `/var/log/orders/*.log` in a new pipeline, and wait for the agent to reload its configuration.
    - id: c
      text:
        en: |-
          In `/etc/google-cloud-ops-agent/config.yaml`, redefine `default_pipeline` with only a `files` receiver for `/var/log/orders/*.log`, then restart the agent.
    - id: d
      text:
        en: |-
          Create a log-based metric with the filter `logName:"orders"`, and add a `parse_json` processor for the files.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A `files` receiver collects the files that match its `include_paths`, and a pipeline under `logging.service.pipelines` links it to Cloud Logging. The user configuration is merged with the built-in configuration, so a new pipeline keeps the default syslog pipeline, and the agent must be restarted to pick up configuration changes.
  options:
    b:
      en: |-
        The `syslog` receiver doesn't read arbitrary log files, and the agent doesn't pick up configuration changes until it is restarted.
    c:
      en: |-
        Declaring a component with the identifier of a built-in one overrides it, so redefining `default_pipeline` removes the default syslog collection.
    d:
      en: |-
        A log-based metric works on entries that are already in Cloud Logging, and these files aren't collected yet; a processor also needs a receiver and a pipeline.
references:
  - title: "Configure the Ops Agent | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/configuration
