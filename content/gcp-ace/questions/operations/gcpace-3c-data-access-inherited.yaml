id: gcpace-3c-data-access-inherited
objective: "3.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security administrator of a media group enabled the Data Read and Data Write types of the Data Access audit logs for all services at the organization level. The team that owns the project `analytics-dev` asks you to turn off the Data Read audit logs of BigQuery in that project only. You have permission to change the project's IAM policy but no permission at the folder or organization level.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Export the project's IAM policy, remove `DATA_READ` for `bigquery.googleapis.com` from its `auditConfigs` section, and apply it with `gcloud projects set-iam-policy`.
    - id: b
      text:
        en: |-
          Clear the Data Read log type of BigQuery on the project's Audit Logs page of IAM & Admin, and save the change.
    - id: c
      text:
        en: |-
          Ask the security administrator to change the organization-level configuration, because a project can't disable a log type that a parent enables.
    - id: d
      text:
        en: |-
          Move the project `analytics-dev` to another folder of the organization so that it no longer inherits the configuration.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The effective Data Access configuration of a project is the union of its own configuration and the configurations of its parent folders and organization. You can't disable at the project level a log type enabled in a parent, so only a change at the organization level can achieve the request.
  options:
    a:
      en: |-
        A project-level configuration can only add log types; removing them from the project's `auditConfigs` doesn't override the inherited configuration.
    b:
      en: |-
        The console applies the same rule: the inherited configuration still enables Data Read for BigQuery.
    d:
      en: |-
        Every folder of the organization inherits the organization-level configuration, and moving projects requires permissions that you don't have.
references:
  - title: "Enable Data Access audit logs | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/audit/configure-data-access
