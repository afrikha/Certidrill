id: gcpace-3b-agent-runtime-container-port
objective: "3.1.14"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team packages a Go agent as a container image in Artifact Registry and deploys it to Agent Runtime from that image. Agent Runtime can pull the image, but the deployment never becomes ready. The container logs show that the agent's HTTP server started and listens on `127.0.0.1:5000`.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant Artifact Registry Reader on the repository to the AI Platform Reasoning Engine Service Agent, and redeploy the same image.
    - id: b
      text:
        en: |-
          Redeploy the image with the agent framework set to `google-adk` so that Agent Runtime starts the ADK API server.
    - id: c
      text:
        en: |-
          Redeploy the image with larger resource limits of 8 CPUs and 32Gi of memory so that the server starts faster.
    - id: d
      text:
        en: |-
          Change the server to listen on `0.0.0.0` port `8080`, rebuild and push the image, and redeploy it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A container deployed to Agent Runtime must follow the runtime contract: it must listen for HTTP requests on `0.0.0.0` on port `8080`. A server bound to the loopback address on another port can't receive requests from the runtime, so the deployment never becomes ready until the image is fixed.
  options:
    a:
      en: |-
        The image is already being pulled, so the registry permissions aren't the problem.
    b:
      en: |-
        The agent framework setting describes how the agent is built; it can't change the address and port that a Go container listens on.
    c:
      en: |-
        More CPU and memory don't help, because requests still can't reach a server that listens only on the loopback address.
references:
  - title: "Deploy an agent | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent
