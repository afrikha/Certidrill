id: gcpace-3b-lifecycle-prefix-multi
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The bucket `gs://app-data` stores Standard storage objects under several prefixes. Only the objects under `logs/` must move to Coldline 30 days after creation and be deleted 365 days after creation. Objects under other prefixes must not change.

    Which two lifecycle rules should you configure? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Action `SetStorageClass` to `COLDLINE`, with the conditions `age: 30` and `matchesPrefix: ["logs/"]`.
    - id: b
      text:
        en: |-
          Action `SetStorageClass` to `COLDLINE`, with the conditions `age: 30` and `matchesStorageClass: ["COLDLINE"]`.
    - id: c
      text:
        en: |-
          Action `Delete`, with the conditions `age: 335` and `matchesPrefix: ["logs/"]`.
    - id: d
      text:
        en: |-
          Action `Delete`, with the conditions `age: 365` and `matchesPrefix: ["logs/"]`.
    - id: e
      text:
        en: |-
          Action `Delete`, with the conditions `daysSinceNoncurrentTime: 365` and `matchesPrefix: ["logs/"]`.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      An object must meet every condition of a rule, so adding `matchesPrefix` limits each rule to `logs/`. The `age` condition counts days since the object's creation, and a storage class change doesn't reset it, so the rules use 30 days for the transition and 365 days for the deletion.
  options:
    b:
      en: |-
        This rule has no prefix condition and matches only objects that are already in Coldline, so the Standard objects under `logs/` never move.
    c:
      en: |-
        Age is measured from creation, not from the transition to Coldline, so 335 deletes the logs 30 days too early.
    e:
      en: |-
        `daysSinceNoncurrentTime` matches only noncurrent versions, so live log objects would never be deleted.
references:
  - title: "Object Lifecycle Management | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/lifecycle
  - title: "Configuration examples for Object Lifecycle Management | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/lifecycle-configurations
