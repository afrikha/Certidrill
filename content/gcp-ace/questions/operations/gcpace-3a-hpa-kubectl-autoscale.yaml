id: gcpace-3a-hpa-kubectl-autoscale
objective: "3.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Deployment named frontend runs on a GKE Standard cluster, and its containers have CPU requests. Traffic varies during the day. The number of frontend Pods must automatically stay between 3 and 12, adding Pods when the average CPU utilization exceeds 60% of the requests.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `kubectl autoscale deployment frontend --min=3 --max=12` with a target CPU utilization of 60%.
    - id: b
      text:
        en: |-
          Run `kubectl scale deployment frontend --replicas=12`.
    - id: c
      text:
        en: |-
          Run `gcloud container clusters update CLUSTER --enable-autoscaling --min-nodes=3 --max-nodes=12`.
    - id: d
      text:
        en: |-
          Create a VerticalPodAutoscaler for frontend with `updateMode: "Auto"`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `kubectl autoscale` creates a HorizontalPodAutoscaler that adjusts the replica count of the Deployment between the minimum and maximum to keep the average CPU utilization near the target. The CPU requests already set on the containers let it compute the utilization. The GKE guide sets the target with `--cpu-percent`, and recent kubectl versions document `--cpu=60%`.
  options:
    b:
      en: |-
        `kubectl scale` sets a fixed number of replicas once; it doesn't react to CPU utilization.
    c:
      en: |-
        This enables the cluster autoscaler, which changes the number of nodes, not the number of Pods.
    d:
      en: |-
        Vertical Pod autoscaling changes the CPU and memory requests of the Pods, not the number of replicas.
references:
  - title: "Configuring horizontal Pod autoscaling | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/horizontal-pod-autoscaling
