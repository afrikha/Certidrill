id: gcpace-3c-promote-ephemeral-ip
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A partner of a media company allows connections only from the external IP address `203.0.113.25`. This address is the ephemeral external IP address of the VM `ftp-gw` in `us-west1`. The VM will be stopped for maintenance next week, and the address must not change.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Stop and start the VM before the maintenance so that its ephemeral external IP address becomes a static address.
    - id: b
      text:
        en: |-
          Run `gcloud compute addresses create ftp-ip --global --addresses=203.0.113.25` to keep the address.
    - id: c
      text:
        en: |-
          Run `gcloud compute addresses create ftp-ip --region=us-west1` and assign the new address to the VM.
    - id: d
      text:
        en: |-
          Run `gcloud compute addresses create ftp-ip --region=us-west1 --addresses=203.0.113.25` to keep the address.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Running `gcloud compute addresses create` with `--addresses` set to the current ephemeral address and the VM's region promotes that address to a static external address. The VM keeps the same address without dropping packets, and the reservation survives stopping the VM.
  options:
    a:
      en: |-
        An ephemeral external address is released when the VM stops; stopping and starting the VM can change it instead of keeping it.
    b:
      en: |-
        Global external addresses can be used only with global load balancers; a VM's external address is regional.
    c:
      en: |-
        Reserving a new address allocates a different IP address, which the partner doesn't allow.
references:
  - title: "Reserve a static external IP address | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/reserve-static-external-ip-address
