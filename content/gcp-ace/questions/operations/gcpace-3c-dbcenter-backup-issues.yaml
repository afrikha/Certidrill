id: gcpace-3c-dbcenter-backup-issues
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After a regional incident, the CTO of an e-commerce company asks for the list of Cloud SQL instances that have no automated backup policy, a short backup retention, or a last backup that failed. You already have access to Database Center for the whole organization.

    What should you do in Database Center?
body:
  options:
    - id: a
      text:
        en: |-
          Filter the fleet on the Data protection health issue category, and review the affected instances.
    - id: b
      text:
        en: |-
          Filter the fleet on the Availability configuration health issue category, and review the affected instances.
    - id: c
      text:
        en: |-
          Filter the fleet on the Security health issue category, and review the affected instances.
    - id: d
      text:
        en: |-
          Filter the fleet on the Performance and capacity health issue category, and review the affected instances.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Database Center classifies Cloud SQL backup checks, including no automated backup policy, short backup retention and last backup failed, under the Data protection category. Filtering on that category lists exactly the instances the CTO asked about.
  options:
    b:
      en: |-
        Availability configuration contains checks such as an instance that isn't failover protected, not the backup checks.
    c:
      en: |-
        Security contains checks such as public IP enabled or unencrypted connections, not backup checks.
    d:
      en: |-
        Performance and capacity contains checks such as high resource utilization, not backup checks.
references:
  - title: "Database health issues | Database Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/database-center/docs/database-health-issues
