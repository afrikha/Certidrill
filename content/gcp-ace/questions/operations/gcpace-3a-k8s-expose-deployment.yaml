id: gcpace-3a-k8s-expose-deployment
objective: "3.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Deployment named catalog runs Pods labeled app=catalog whose container listens on port 8080. You must make the application reachable from the internet on port 80 through a load balancer that GKE provisions.

    Which two methods meet the requirement? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run `kubectl expose deployment catalog --type=LoadBalancer --port=80 --target-port=8080`.
    - id: b
      text:
        en: |-
          Run `kubectl expose deployment catalog --type=ClusterIP --port=80 --target-port=8080`.
    - id: c
      text:
        en: |-
          Run `kubectl port-forward deployment/catalog 80:8080`.
    - id: d
      text:
        en: |-
          Apply a Service manifest of type LoadBalancer with the selector app=catalog, `port: 80` and `targetPort: 8080`.
    - id: e
      text:
        en: |-
          Run `kubectl expose deployment catalog --type=LoadBalancer --port=8080 --target-port=80`.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A Service of type LoadBalancer makes GKE provision an external load balancer with a public address. `port` is the port that clients use (80) and `targetPort` is the container port (8080); `kubectl expose` creates such a Service imperatively, and applying the manifest creates it declaratively.
  options:
    b:
      en: |-
        A ClusterIP Service is reachable only from inside the cluster and provisions no load balancer.
    c:
      en: |-
        Port forwarding opens a tunnel from your own machine for testing; it doesn't expose the application to the internet.
    e:
      en: |-
        The ports are inverted: clients would connect on 8080 and traffic would be sent to port 80, where the container doesn't listen.
references:
  - title: "About LoadBalancer Services | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/service-load-balancer
