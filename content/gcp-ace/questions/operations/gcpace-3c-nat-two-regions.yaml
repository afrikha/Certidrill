id: gcpace-3c-nat-two-regions
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research institute runs batch VMs in two subnets of the VPC network `batch-vpc`, one in `us-east1` and one in `europe-west1`. Security policy forbids external IP addresses on the VMs and any inbound connection from the internet. The VMs must download packages from public internet repositories. You must minimize the management effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable Private Google Access on both subnets.
    - id: b
      text:
        en: |-
          Create a Cloud Router and a Cloud NAT gateway in `us-east1` with `--auto-allocate-nat-external-ips --nat-all-subnet-ip-ranges`.
    - id: c
      text:
        en: |-
          Assign an ephemeral external IP address to each VM, and create a firewall rule that denies all ingress traffic.
    - id: d
      text:
        en: |-
          Create a Cloud Router and a Cloud NAT gateway in each of the two regions with `--auto-allocate-nat-external-ips --nat-all-subnet-ip-ranges`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Public NAT lets VMs without external addresses open outbound connections to the internet and doesn't allow unsolicited inbound connections. Each Cloud NAT gateway is tied to one VPC network, one region and one Cloud Router, so each region needs its own gateway, and automatic IP allocation keeps the management effort low.
  options:
    a:
      en: |-
        Private Google Access reaches Google APIs and services only, not public package repositories.
    b:
      en: |-
        A gateway serves only the subnets of its own region, so the VMs in `europe-west1` still couldn't reach the internet.
    c:
      en: |-
        External IP addresses on the VMs are forbidden by the security policy.
references:
  - title: "Public NAT | Google Cloud Documentation"
    url: https://docs.cloud.google.com/nat/docs/public-nat
