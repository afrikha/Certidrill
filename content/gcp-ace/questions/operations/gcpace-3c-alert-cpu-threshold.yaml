id: gcpace-3c-alert-cpu-threshold
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online education company runs its web servers on Compute Engine VMs. The on-call engineer must receive an email when the CPU utilization of any VM in the project stays above 80% for 5 minutes.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create an alerting policy with a threshold condition on the VM CPU utilization metric above 80%, a 5-minute retest window and an email channel.
    - id: b
      text:
        en: |-
          Create a Cloud Monitoring uptime check for each VM, and an alerting policy on the uptime check results with an email notification channel.
    - id: c
      text:
        en: |-
          Create a Cloud Billing budget for the project with an alert threshold at 80% of the budget, and add the on-call engineer as an email recipient.
    - id: d
      text:
        en: |-
          Create a log-based metric that counts syslog entries that contain the word CPU, and an alerting policy on this metric with an email notification channel.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A metric-threshold alerting policy compares a resource metric, here the CPU utilization of the VM instances, with a threshold. The retest window makes the condition fire only when it stays true for 5 minutes, and the notification channel sends the email.
  options:
    b:
      en: |-
        Uptime checks verify that an endpoint responds; they don't measure CPU utilization.
    c:
      en: |-
        Budget alerts track spending against a billing budget, not the CPU usage of VMs.
    d:
      en: |-
        System logs don't report CPU utilization reliably; Compute Engine already provides the CPU utilization metric.
references:
  - title: "Create metric-threshold alerting policies | Cloud Monitoring | Google Cloud Documentation"
    url: https://docs.cloud.google.com/monitoring/alerts/using-alerting-ui
