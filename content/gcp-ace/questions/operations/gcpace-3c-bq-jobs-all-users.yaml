id: gcpace-3c-bq-jobs-all-users
objective: "3.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A finance company's analyst must produce, every morning, an SQL report that lists all BigQuery query jobs that failed in the last 24 hours in the `fin-analytics` project, for every user of the project. The datasets are in the US multi-region. The analyst already has the BigQuery User role on the project, and today sees only the details of their own jobs. You must follow the principle of least privilege.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Have the analyst query the `region-us`.INFORMATION_SCHEMA.JOBS_BY_USER view and filter on `error_result IS NOT NULL`.
    - id: b
      text:
        en: |-
          Grant the analyst the BigQuery Resource Viewer role (`roles/bigquery.resourceViewer`) on the project.
    - id: c
      text:
        en: |-
          Grant the analyst the BigQuery Data Viewer role (`roles/bigquery.dataViewer`) on every dataset of the project.
    - id: d
      text:
        en: |-
          Have the analyst run `bq ls -j -n 1000` every morning and keep the lines whose state is FAILURE.
    - id: e
      text:
        en: |-
          Have the analyst query the `region-us`.INFORMATION_SCHEMA.JOBS view and filter on `error_result IS NOT NULL`.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      The INFORMATION_SCHEMA.JOBS view (a synonym of JOBS_BY_PROJECT) contains the metadata of all BigQuery jobs of the project, including `error_result` and `creation_time`, so one query lists the failed jobs of every user. Querying it requires `bigquery.jobs.listAll`, which BigQuery Resource Viewer grants without any data or administration permission, while the existing BigQuery User role provides `bigquery.jobs.create` to run the query.
  options:
    a:
      en: |-
        JOBS_BY_USER contains only the jobs submitted by the current user, so the jobs of the other users would be missing.
    c:
      en: |-
        BigQuery Data Viewer grants read access to tables and has no `bigquery.jobs.*` permission, so it doesn't reveal the jobs of other users.
    d:
      en: |-
        Without `-a`, `bq ls -j` lists only the caller's own jobs, and parsing command output isn't an SQL report.
references:
  - title: "JOBS view | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/information-schema-jobs
  - title: "BigQuery IAM roles and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/access-control
