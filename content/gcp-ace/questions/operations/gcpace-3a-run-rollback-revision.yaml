id: gcpace-3a-run-rollback-revision
objective: "3.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An hour ago, you deployed a new revision, billing-00008-xyz, of the Cloud Run service billing, and it received 100% of the traffic. Users now report errors. The previous revision, billing-00007-abc, worked correctly. You must restore service as quickly as possible without building or deploying anything.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud run services update-traffic billing --to-revisions=billing-00007-abc=100`
    - id: b
      text:
        en: |-
          `gcloud run services update-traffic billing --to-latest`
    - id: c
      text:
        en: |-
          `gcloud run revisions describe billing-00007-abc`
    - id: d
      text:
        en: |-
          `gcloud run services update billing --revision-suffix=00007-abc`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Cloud Run keeps previous revisions, so rolling back is a traffic change: `update-traffic` with `--to-revisions` sends 100% of the requests to the earlier revision. No new revision is built or deployed.
  options:
    b:
      en: |-
        `--to-latest` sends the traffic to the newest revision, which is the faulty one.
    c:
      en: |-
        `describe` only shows the revision's settings; it doesn't move any traffic.
    d:
      en: |-
        A suffix only names a new revision built from the current, faulty configuration (and an existing name is refused); it doesn't send traffic back to the old revision.
references:
  - title: "Rollbacks, gradual rollouts, and traffic migration | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
