id: gcpace-3a-nodepool-update-machine-type
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A node pool named web-pool of a GKE Standard cluster uses e2-standard-2 nodes, and the workloads now need e2-standard-8 nodes. The team accepts that nodes are recreated during tonight's maintenance window and wants to keep the same node pool name, with the least administrative effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute instances set-machine-type` on each node VM of web-pool after stopping it.
    - id: b
      text:
        en: |-
          Run `gcloud container clusters upgrade` with `--node-pool=web-pool` to recreate the nodes.
    - id: c
      text:
        en: |-
          Run `gcloud container node-pools update web-pool --cluster=CLUSTER --location=LOCATION --machine-type=e2-standard-8`.
    - id: d
      text:
        en: |-
          Run `gcloud container clusters resize CLUSTER --node-pool=web-pool --num-nodes=4`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud container node-pools update` with `--machine-type` changes the machine type of an existing node pool. GKE recreates the nodes using the pool's upgrade strategy, which can disrupt workloads, so running it in the maintenance window fits the requirement.
  options:
    a:
      en: |-
        GKE manages the node VMs from the node pool configuration; changing individual VMs isn't supported and doesn't change the pool's machine type for new nodes.
    b:
      en: |-
        An upgrade changes the GKE version of the nodes; the recreated nodes keep the e2-standard-2 machine type.
    d:
      en: |-
        Resizing changes the number of nodes, not their machine type.
references:
  - title: "Add and manage node pools | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-pools
