id: gcpace-3b-bq-notebook-view-run
objective: "3.1.15"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An analyst must open and run a Colab Enterprise notebook in BigQuery Studio that a colleague created, but must not be able to change it. The analyst already has BigQuery Job User, BigQuery Read Session User, and Notebook Runtime User on the project.

    Which additional role should you grant the analyst?
body:
  options:
    - id: a
      text:
        en: |-
          Code Editor (`roles/dataform.codeEditor`)
    - id: b
      text:
        en: |-
          Dataform Admin (`roles/dataform.admin`)
    - id: c
      text:
        en: |-
          BigQuery Data Viewer (`roles/bigquery.dataViewer`)
    - id: d
      text:
        en: |-
          Code Viewer (`roles/dataform.codeViewer`)
answer: { optionId: d }
explanation:
  correct:
    en: |-
      BigQuery notebooks are code assets whose access is controlled by Dataform roles. To view and run notebooks, a user needs BigQuery Job User, BigQuery Read Session User, Notebook Runtime User, and Code Viewer; Code Viewer gives read access to the notebook without the edit rights of Code Editor.
  options:
    a:
      en: |-
        Code Editor is the role for editing and running notebooks, so the analyst could change the colleague's notebook.
    b:
      en: |-
        Dataform Admin gives owner access to every notebook of the project.
    c:
      en: |-
        BigQuery Data Viewer gives access to tables and datasets, not to notebook code assets.
references:
  - title: "Create notebooks | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/create-notebooks
