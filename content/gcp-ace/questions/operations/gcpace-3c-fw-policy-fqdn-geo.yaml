id: gcpace-3c-fw-policy-fqdn-geo
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company's global network firewall policy `edge-policy` is associated with the VPC network `web-vpc`. The security team asks for two new rules: the VMs must not send any traffic to the domain `downloads.example.net`, whose IP addresses change often, and the VMs must not receive any traffic from two countries, identified by the country codes `CODE1` and `CODE2`.

    Which two commands should you run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute network-firewall-policies rules create 2000 --firewall-policy=edge-policy --global-firewall-policy --direction=EGRESS --action=deny --layer4-configs=all --dest-fqdns=downloads.example.net`
    - id: b
      text:
        en: |-
          `gcloud compute network-firewall-policies rules create 2000 --firewall-policy=edge-policy --global-firewall-policy --direction=EGRESS --action=deny --layer4-configs=all --src-fqdns=downloads.example.net`
    - id: c
      text:
        en: |-
          `gcloud compute network-firewall-policies rules create 2100 --firewall-policy=edge-policy --global-firewall-policy --direction=INGRESS --action=deny --layer4-configs=all --src-region-codes=CODE1,CODE2`
    - id: d
      text:
        en: |-
          `gcloud compute network-firewall-policies rules create 2100 --firewall-policy=edge-policy --global-firewall-policy --direction=INGRESS --action=deny --layer4-configs=all --dest-region-codes=CODE1,CODE2`
    - id: e
      text:
        en: |-
          `gcloud compute network-firewall-policies rules create 2000 --firewall-policy=edge-policy --global-firewall-policy --direction=EGRESS --action=deny --layer4-configs=all --dest-ip-ranges=CURRENT_DOMAIN_IPS`
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Firewall policy rules accept destination domain names in egress rules: Cloud NGFW periodically resolves the FQDN object, so the rule follows the changing addresses. Geolocation objects match the traffic's source in ingress rules, so `--src-region-codes` blocks traffic coming from the two countries.
  options:
    b:
      en: |-
        Domain names can be a source only in ingress rules; in an egress rule, the domain is the destination.
    d:
      en: |-
        In an ingress rule, the destination is the VM; the countries are the source of the traffic.
    e:
      en: |-
        Fixed destination ranges stop matching when the domain's addresses change, which the scenario says happens often.
references:
  - title: "Firewall policy rule components | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewall-policies-rule-details
