id: gcpace-3b-gcs-public-access-prevention
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company stores exports in the bucket `gs://patient-exports`. The data must never be readable through `allUsers` or `allAuthenticatedUsers`, even if someone adds such a grant by mistake later. The project doesn't belong to an organization.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud storage buckets update gs://patient-exports --uniform-bucket-level-access`
    - id: b
      text:
        en: |-
          `gcloud storage buckets remove-iam-policy-binding gs://patient-exports --member=allUsers --role=roles/storage.objectViewer`
    - id: c
      text:
        en: |-
          `gcloud storage buckets update gs://patient-exports --no-public-access-prevention`
    - id: d
      text:
        en: |-
          `gcloud storage buckets update gs://patient-exports --public-access-prevention`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `--public-access-prevention` sets the bucket's public access prevention to enforced: existing grants to `allUsers` and `allAuthenticatedUsers` stop working, and new ones are rejected. Projects outside an organization can't use the `storage.publicAccessPrevention` organization policy constraint, so the bucket-level setting is the way to enforce it.
  options:
    a:
      en: |-
        Uniform bucket-level access disables ACLs, but an IAM policy can still grant a role to `allUsers`.
    b:
      en: |-
        Removing today's binding doesn't stop someone from adding a public grant again later.
    c:
      en: |-
        This sets the bucket to inherited, which follows an organization policy that this project can't have, so public access stays possible.
references:
  - title: "Public access prevention | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/public-access-prevention
  - title: "gcloud storage buckets update | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/buckets/update
