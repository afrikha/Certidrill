id: gcpace-3c-route-tags-priority
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company's VPC network `prod` has the default route `0.0.0.0/0` to the default internet gateway with priority 1000. Firewall appliances sit behind an internal passthrough Network Load Balancer whose forwarding rule `fw-ilb` is in `us-central1`. Only the VMs with the network tag `inspect` must send internet-bound traffic through the appliances. All other VMs must keep using the default route.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute routes create via-fw --network=prod --destination-range=0.0.0.0/0 --next-hop-ilb=fw-ilb --next-hop-ilb-region=us-central1 --priority=900`
    - id: b
      text:
        en: |-
          `gcloud compute routes create via-fw --network=prod --destination-range=0.0.0.0/0 --next-hop-ilb=fw-ilb --next-hop-ilb-region=us-central1 --tags=inspect --priority=1100`
    - id: c
      text:
        en: |-
          `gcloud compute routes create via-fw --network=prod --destination-range=0.0.0.0/0 --next-hop-ilb=fw-ilb --next-hop-ilb-region=us-central1 --tags=inspect --priority=900`
    - id: d
      text:
        en: |-
          Delete the default route, then run `gcloud compute routes create via-fw --network=prod --destination-range=0.0.0.0/0 --next-hop-ilb=fw-ilb --next-hop-ilb-region=us-central1 --tags=inspect`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A static route with a network tag applies only to the VMs that have that tag. Both routes have the same destination, so priority decides, and a lower value means a higher priority: 900 beats the default route's 1000 for the tagged VMs, while untagged VMs only see the default route.
  options:
    a:
      en: |-
        Without `--tags`, the route applies to every VM in the network, so all internet-bound traffic would go through the appliances.
    b:
      en: |-
        Priority 1100 is lower than the default route's 1000, so the tagged VMs would keep using the default route.
    d:
      en: |-
        Deleting the default route removes the internet path of every untagged VM.
references:
  - title: "Static routes | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/static-routes
  - title: "Use routes | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/using-routes
