id: gcpace-3c-data-access-gcs-reads
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An HR services company stores employee files in the Cloud Storage bucket `hr-records`. Auditors need a record of every user who reads objects in this bucket. The project uses the default audit logging settings.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Use the Admin Activity audit logs of Cloud Storage, which are always written and record every object read.
    - id: b
      text:
        en: |-
          Enable the Data Read log type of the Data Access audit logs for Cloud Storage on the Audit Logs page of IAM & Admin.
    - id: c
      text:
        en: |-
          Enable VPC Flow Logs on the subnets of the VMs that read the bucket.
    - id: d
      text:
        en: |-
          Enable Firewall Rules Logging on the ingress rules of the project's VPC network.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Reads of object data are recorded by Data Access audit logs (Data Read type), which are disabled by default for Cloud Storage. You enable them for the service on the Audit Logs page of IAM & Admin, or in the `auditConfigs` section of the IAM policy.
  options:
    a:
      en: |-
        Admin Activity audit logs record changes to configuration or metadata, not reads of object data.
    c:
      en: |-
        VPC Flow Logs record network flows of VMs; they don't identify which user read which object.
    d:
      en: |-
        Firewall Rules Logging records connections matched by firewall rules, not access to Cloud Storage objects.
references:
  - title: "Enable Data Access audit logs | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/audit/configure-data-access
