id: gcpace-3d-trace-downstream-latency
objective: "3.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company's booking request calls five Cloud Run services over HTTP. Since a release last week, the 99th percentile latency of the booking request has doubled. You need to find which service-to-service call adds the extra latency, without changing the application code first.

    Which tool should you use?
body:
  options:
    - id: a
      text:
        en: |-
          Cloud Profiler, to compare the CPU time of the five services before and after the release
    - id: b
      text:
        en: |-
          Cloud Trace, to examine the spans of slow booking requests in Trace Explorer
    - id: c
      text:
        en: |-
          Query Insights, to rank the queries that the five services send to their databases
    - id: d
      text:
        en: |-
          VPC Flow Logs, to measure the network flows between the five services
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cloud Trace is a distributed tracing system that shows the latency of each span of a request, so you can see which downstream call is slow. Cloud Run automatically sends latency data for incoming and outgoing HTTP requests to Trace, and Trace Explorer shows the latency distribution and the individual traces.
  options:
    a:
      en: |-
        Cloud Profiler shows which functions consume CPU or memory inside a process; it doesn't measure the latency of calls between services, and it requires adding the profiling agent to the code.
    c:
      en: |-
        Query Insights analyzes queries on Cloud SQL databases; it doesn't show where the latency of a request between services comes from.
    d:
      en: |-
        VPC Flow Logs record samples of network flows of VM interfaces; they don't break a request down by service call, and Cloud Run services don't run on your VMs.
references:
  - title: "Cloud Trace overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/trace/docs/overview
