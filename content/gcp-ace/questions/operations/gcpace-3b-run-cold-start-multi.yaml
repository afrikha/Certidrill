id: gcpace-3b-run-cold-start-multi
objective: "3.1.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The Cloud Run service `pricing` in `us-east4` receives a few requests per hour from a partner. It was created with `--no-cpu-boost`. When an instance starts from zero, the first request takes 9 seconds, mostly because the Java runtime is slow to initialize. The partner requires faster responses. You must not change the code, and a small fixed monthly cost is acceptable.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run `gcloud run services update pricing --region=us-east4 --min=1`.
    - id: b
      text:
        en: |-
          Run `gcloud run services update pricing --region=us-east4 --concurrency=1000`.
    - id: c
      text:
        en: |-
          Run `gcloud run services update pricing --region=us-east4 --max=1`.
    - id: d
      text:
        en: |-
          Run `gcloud run services update pricing --region=us-east4 --cpu-boost`.
    - id: e
      text:
        en: |-
          Run `gcloud run services update pricing --region=us-east4 --timeout=60s`.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A minimum of one instance keeps a warm instance available, so requests no longer wait for an instance to start from zero; idle minimum instances are billed, which the scenario accepts. Startup CPU boost gives the container extra vCPU during startup and for 10 seconds after it, which shortens the Java initialization whenever a new instance must still start.
  options:
    b:
      en: |-
        Raising concurrency changes how many requests one instance handles; it doesn't make instance startup faster or keep an instance warm.
    c:
      en: |-
        A maximum of one instance limits scale-out and does nothing about the startup delay.
    e:
      en: |-
        The request timeout only sets how long a request may run; a longer timeout doesn't reduce latency.
references:
  - title: "Set minimum instances for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/min-instances
  - title: "Configure CPU limits for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/configuring/services/cpu
