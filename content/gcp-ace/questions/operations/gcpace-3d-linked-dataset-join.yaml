id: gcpace-3d-linked-dataset-join
objective: "3.4.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A retail company stores the logs of its order service in a user-defined log bucket named `orders-logs` in the `us-central1` location of the project `shop-ops`. The bucket hasn't been upgraded. Analysts must run SQL queries that join these log entries with the BigQuery table `crm.customers` in BigQuery Studio. The company doesn't want to store a second copy of the logs.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a sink that routes the order service logs to a new BigQuery dataset in `shop-ops`, with partitioned tables.
    - id: b
      text:
        en: |-
          Run `gcloud logging buckets update orders-logs --location=us-central1 --enable-analytics --async`.
    - id: c
      text:
        en: |-
          Run `gcloud logging buckets update orders-logs --location=us-central1 --index=fieldPath=jsonPayload.customerId,type=INDEX_TYPE_STRING`.
    - id: d
      text:
        en: |-
          Run `gcloud logging links create orders_link --bucket=orders-logs --location=us-central1`.
    - id: e
      text:
        en: |-
          Create a log view on `orders-logs` that keeps only the order service entries, and grant the analysts the Logs View Accessor role on it.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A bucket must first be upgraded to use Observability Analytics, which `--enable-analytics` does (the upgrade can't be undone). A linked BigQuery dataset, created with `gcloud logging links create`, then exposes the bucket's log views to BigQuery without copying the data, so analysts can join them with other BigQuery tables from BigQuery Studio.
  options:
    a:
      en: |-
        A BigQuery sink writes a second copy of every routed entry into BigQuery tables, which the company wants to avoid.
    c:
      en: |-
        A custom index speeds up Logging queries on that field, but it doesn't make the logs visible to BigQuery.
    e:
      en: |-
        A log view restricts which entries principals can read in Logging; it doesn't make the bucket queryable from BigQuery Studio.
references:
  - title: "Configure log buckets | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/buckets
  - title: "Query and analyze logs with Observability Analytics | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/analyze/query-and-view
