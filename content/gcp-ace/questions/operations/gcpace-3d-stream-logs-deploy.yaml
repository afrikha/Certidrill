id: gcpace-3d-stream-logs-deploy
objective: "3.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer is rolling out a new version of an application on a managed instance group. In the Logs Explorer, they have written a query that selects the application's entries, and they want to watch the matching entries appear as Cloud Logging stores them during the rollout, without running the query again.

    What should the developer do?
body:
  options:
    - id: a
      text:
        en: |-
          Click **Jump to now** in the Logs Explorer toolbar after each step of the rollout.
    - id: b
      text:
        en: |-
          Click **Share link** to create a URL of the query, and open it in a new browser tab.
    - id: c
      text:
        en: |-
          Click **Stream logs** in the Logs Explorer toolbar while the query is in the query editor.
    - id: d
      text:
        en: |-
          Create a log-based metric from the query, and open the metric in Metrics Explorer.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      **Stream logs** displays log entries as Cloud Logging stores them, and a query in the editor limits the stream to the matching entries. The developer clicks **Stop stream** when the rollout is over.
  options:
    a:
      en: |-
        **Jump to now** refreshes the results to the current time once; the developer would have to click it again for every new entry.
    b:
      en: |-
        A shared link contains the query and its absolute time range, so it shows a fixed set of results, not new entries.
    d:
      en: |-
        A log-based metric counts matching entries over time; it doesn't display the entries themselves.
references:
  - title: "View and analyze log entries | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/view/logs-explorer-interface
