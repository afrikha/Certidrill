id: gcpace-3a-autopilot-balanced-class
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A simulation job on a GKE Autopilot cluster needs a single container that requests 64 vCPU and 256 GiB of memory, on x86 nodes. With no compute class selected, Autopilot rejects the Pod because the requests exceed the platform's maximums. You must run the Pod on Autopilot with the least change to the manifest.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add the node selector `cloud.google.com/compute-class: Scale-Out` to the Pod spec.
    - id: b
      text:
        en: |-
          Set limits of 64 CPU and 256Gi with requests of 30 CPU and 110Gi so that the Pod bursts.
    - id: c
      text:
        en: |-
          Add the node selector `cloud.google.com/compute-class: Balanced` to the Pod spec.
    - id: d
      text:
        en: |-
          Add the node selector `cloud.google.com/gke-spot: "true"` to the Pod spec.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The general-purpose platform allows at most 30 vCPU and 110 GiB per Pod, while the Balanced compute class allows up to 222 vCPU and 851 GiB with a 1:1 to 1:8 CPU-to-memory ratio. Selecting Balanced with a node selector lets Autopilot provision nodes large enough for 64 vCPU and 256 GiB.
  options:
    a:
      en: |-
        Scale-Out allows at most 54 vCPU and 216 GiB on x86, so the request is still above its maximums.
    b:
      en: |-
        Only the requests are reserved, so the job would get 30 vCPU and 110 GiB; bursting up to the limits depends on spare capacity and isn't guaranteed.
    d:
      en: |-
        Spot Pods change the pricing and the eviction behavior; with no compute class selected they run on the default general-purpose class, whose maximums the requests still exceed.
references:
  - title: "Resource requests in Autopilot | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-resource-requests
  - title: "About Balanced and Scale-Out ComputeClasses in Autopilot clusters | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-compute-classes
