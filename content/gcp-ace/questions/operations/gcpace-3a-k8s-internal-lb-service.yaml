id: gcpace-3a-k8s-internal-lb-service
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Deployment named inventory-api runs in a VPC-native GKE cluster. Compute Engine VMs in the same VPC network and region must reach it through a single stable IP address on port 443. The API must not be reachable from the internet.

    What should you create?
body:
  options:
    - id: a
      text:
        en: |-
          A Service of type ClusterIP that selects the inventory-api Pods on port 443
    - id: b
      text:
        en: |-
          A Service of type LoadBalancer with the annotation `networking.gke.io/load-balancer-type: "Internal"`
    - id: c
      text:
        en: |-
          A Service of type LoadBalancer without annotations, and a firewall rule that denies ingress from 0.0.0.0/0
    - id: d
      text:
        en: |-
          A headless Service with `clusterIP: None` that selects the inventory-api Pods
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With the `networking.gke.io/load-balancer-type: "Internal"` annotation, GKE creates an internal passthrough Network Load Balancer with an internal IP address from the VPC. VMs in the network can reach it, and it has no internet-facing address.
  options:
    a:
      en: |-
        A ClusterIP address is only reachable from inside the cluster, not from other VMs of the VPC network.
    c:
      en: |-
        Without the annotation, GKE creates an external load balancer with a public address; patching it with firewall rules is the wrong design for a private API.
    d:
      en: |-
        A headless Service has no stable IP address; it only returns the Pod addresses through cluster DNS.
references:
  - title: "About LoadBalancer Services | GKE networking | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/service-load-balancer
