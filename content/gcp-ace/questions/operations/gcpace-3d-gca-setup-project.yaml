id: gcpace-3d-gca-setup-project
objective: "3.4.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The SREs of a video streaming company want to ask questions about their Compute Engine and Cloud SQL metrics in natural language from the Gemini Cloud Assist panel of the Google Cloud console, in the project `stream-prod`. Gemini Cloud Assist isn't set up in the project, the Cloud Monitoring API is enabled, and the SREs already have the Monitoring Viewer role. The company accepts the Pre-GA terms that apply to Gemini Cloud Assist.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the Service Health API in `stream-prod`, and grant the SREs the Personalized Service Health Viewer role.
    - id: b
      text:
        en: |-
          Grant the SREs the Gemini Cloud Assist Viewer role on `stream-prod`, without enabling any additional API.
    - id: c
      text:
        en: |-
          Enable the Gemini Cloud Assist API and the APIs that its setup requires, and grant the SREs the Gemini Cloud Assist User and Cloud Asset Viewer roles.
    - id: d
      text:
        en: |-
          Grant the SREs the Monitoring Editor role instead of Monitoring Viewer, so that Gemini can read and chart all the metrics.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Gemini Cloud Assist, a Preview offering, is set up by enabling `geminicloudassist.googleapis.com` in the project (which also enables `cloudaicompanion.googleapis.com`) together with the other required APIs, such as Cloud Asset Inventory and App Hub, and by granting users Gemini Cloud Assist User (`roles/geminicloudassist.user`) and Cloud Asset Viewer. Questions about resource performance also need Monitoring Viewer and the Cloud Monitoring API, which the SREs already have.
  options:
    a:
      en: |-
        The Service Health API gives Gemini Cloud Assist information about Google Cloud incidents, but it doesn't set up Gemini Cloud Assist itself.
    b:
      en: |-
        The Gemini Cloud Assist Viewer role can view artifacts and configurations but doesn't allow invoking or chatting with the agent, and the API still isn't enabled.
    d:
      en: |-
        Monitoring Editor adds write access to Cloud Monitoring, which isn't needed, and Gemini Cloud Assist is still not set up.
references:
  - title: "Set up Gemini Cloud Assist | Google Cloud Documentation"
    url: https://docs.cloud.google.com/cloud-assist/set-up-gemini
  - title: "IAM requirements for using Gemini Cloud Assist | Google Cloud Documentation"
    url: https://docs.cloud.google.com/cloud-assist/iam-requirements
