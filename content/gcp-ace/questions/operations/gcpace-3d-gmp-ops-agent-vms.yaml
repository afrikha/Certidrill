id: gcpace-3d-gmp-ops-agent-vms
objective: "3.4.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an inventory application on 20 Compute Engine VMs, outside any Kubernetes cluster. The application exposes Prometheus metrics on `http://localhost:9100/metrics`, and Ops Agent version 2.40 is installed on every VM. The SREs want these metrics stored in Google Cloud Managed Service for Prometheus and want to chart them with their existing PromQL queries.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a `PodMonitoring` resource that selects the VMs and scrapes port 9100 on the `/metrics` path.
    - id: b
      text:
        en: |-
          Add a `prometheus` receiver with a `scrape_configs` job for `localhost:9100` and a pipeline that uses it to the Ops Agent configuration, and restart the agent.
    - id: c
      text:
        en: |-
          Create a log-based metric that extracts the metric values from the entries written by the Ops Agent.
    - id: d
      text:
        en: |-
          Run `gcloud container clusters update` with `--enable-managed-prometheus` on a new GKE cluster in the VMs' VPC network.
    - id: e
      text:
        en: |-
          Run the queries in Metrics Explorer after selecting the PromQL option in the query builder.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      For Compute Engine VMs, the Ops Agent (version 2.25.0 or later) collects Prometheus metrics through a `prometheus` receiver configured with Prometheus-style `scrape_configs`, and sends them to Cloud Monitoring as `prometheus.googleapis.com` metrics, the same store used by Managed Service for Prometheus. Metrics Explorer, with its PromQL option, then runs the existing PromQL queries.
  options:
    a:
      en: |-
        `PodMonitoring` is a Kubernetes custom resource that selects pods in a cluster; it can't target Compute Engine VMs.
    c:
      en: |-
        The Ops Agent doesn't write scraped metrics as log entries, so there is nothing to extract, and log-based metrics wouldn't be the Prometheus series that the existing queries expect.
    d:
      en: |-
        Managed collection on a GKE cluster scrapes pods of that cluster; it doesn't scrape applications on standalone VMs.
references:
  - title: "Collect Prometheus metrics | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/prometheus
  - title: "Google Cloud Managed Service for Prometheus | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/managed-prometheus
