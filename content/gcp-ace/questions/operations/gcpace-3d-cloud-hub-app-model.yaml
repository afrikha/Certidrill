id: gcpace-3d-cloud-hub-app-model
objective: "3.4.14"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company groups the services and workloads of its checkout application with App Hub. The application is defined in an App Hub host project to which the service projects of the application are attached. The SRE team wants to use the application view of the Cloud Hub Health & troubleshooting page to see the health of the checkout application's services and workloads, with its logs, metrics and traces aggregated.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Select the App Hub host project in the console project picker, and open the Health & troubleshooting page.
    - id: b
      text:
        en: |-
          Define the application in App Hub on an app-enabled folder that contains the projects, and aggregate its telemetry.
    - id: c
      text:
        en: |-
          Select each service project of the application in turn, and open the Health & troubleshooting page in project view.
    - id: d
      text:
        en: |-
          Grant the SRE team the Cloud Hub Operator role on the App Hub host project and on every attached service project.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The application view of the Health & troubleshooting page shows App Hub applications defined in a folder set up for application management, and you select that folder rather than a project. Host-project and single-project application models aren't supported, so the application must be defined on an app-enabled folder, with aggregation of its logs, metrics and traces set up.
  options:
    a:
      en: |-
        The host-project application model isn't supported by the Cloud Hub application view, so selecting the host project doesn't show the application.
    c:
      en: |-
        The project view shows the health of the products of one project at a time, not of the application's services and workloads as a whole.
    d:
      en: |-
        Roles don't change the supported application models: with a host project, there is still no application view to open.
references:
  - title: "View application and resource health | Cloud Hub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/hub/docs/health
