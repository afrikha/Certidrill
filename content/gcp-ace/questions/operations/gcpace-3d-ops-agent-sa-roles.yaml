id: gcpace-3d-ops-agent-sa-roles
objective: "3.4.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You installed the Ops Agent on a fleet of Linux VMs, and `sudo systemctl status google-cloud-ops-agent"*"` shows that the Logging Agent and Metrics Agent are running. The VMs use a user-managed service account named `app-vm-sa` that has no roles, and no logs or agent metrics from the VMs appear in Cloud Logging or Cloud Monitoring. The Cloud Logging and Cloud Monitoring APIs are enabled.

    Which two roles should you grant to `app-vm-sa` on the project, following the principle of least privilege? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Monitoring Metric Writer (`roles/monitoring.metricWriter`)
    - id: b
      text:
        en: |-
          Monitoring Editor (`roles/monitoring.editor`)
    - id: c
      text:
        en: |-
          Logs Viewer (`roles/logging.viewer`)
    - id: d
      text:
        en: |-
          Logs Configuration Writer (`roles/logging.configWriter`)
    - id: e
      text:
        en: |-
          Logs Writer (`roles/logging.logWriter`)
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      The Ops Agent writes log entries and metrics with the identity of the VM's service account. That account needs Logs Writer to write log entries and Monitoring Metric Writer to write metric data, the two roles that the installation guide lists for the agent.
  options:
    b:
      en: |-
        Monitoring Editor lets the account change dashboards and alerting policies, which is much more than writing metric data.
    c:
      en: |-
        Logs Viewer allows reading log entries, not writing them.
    d:
      en: |-
        Logs Configuration Writer allows managing sinks, buckets and log-based metrics, not writing log entries.
references:
  - title: "Installing the Ops Agent on individual VMs | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/installation
