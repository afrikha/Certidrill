id: gcpace-3a-run-new-revision-changes
objective: "3.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A release manager keeps an audit trail of the revisions of the Cloud Run service catalog. The manager wants to know which operations create a new revision, so that each release is recorded.

    Which two commands create a new revision of catalog? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud run services update-traffic catalog --to-revisions=catalog-00004-kip=100`
    - id: b
      text:
        en: |-
          `gcloud run services update catalog --update-env-vars=FEATURE_X=on`
    - id: c
      text:
        en: |-
          `gcloud run services add-iam-policy-binding catalog --member=allUsers --role=roles/run.invoker`
    - id: d
      text:
        en: |-
          `gcloud run deploy catalog --image=us-docker.pkg.dev/acme/web/catalog:2.3`
    - id: e
      text:
        en: |-
          `gcloud run services update-traffic catalog --update-tags=beta=catalog-00004-kip`
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Revisions are immutable, so changing a configuration setting such as an environment variable, or deploying a different container image, creates a new revision. Both commands therefore add an entry to the revision list.
  options:
    a:
      en: |-
        Traffic assignments are a service-level setting; moving traffic between existing revisions creates no revision.
    c:
      en: |-
        IAM policies apply to the service, not to a revision, so changing who can invoke it creates no revision.
    e:
      en: |-
        Adding a tag only gives an existing revision a dedicated URL; it doesn't create a revision.
references:
  - title: "Deploy container images to Cloud Run services | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/deploying
