id: gcpace-3a-gke-inventory-viewer-role
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A compliance team runs a nightly script under a service account. The script lists the GKE clusters of a project, runs `gcloud container clusters get-credentials`, and then lists the nodes, Pods and Services of each cluster with kubectl. The service account must never create, change or delete anything, and no Kubernetes RBAC bindings are configured for it. You must follow the principle of least privilege.

    Which role should you grant to the service account on the project?
body:
  options:
    - id: a
      text:
        en: |-
          Kubernetes Engine Viewer (`roles/container.viewer`)
    - id: b
      text:
        en: |-
          Kubernetes Engine Cluster Viewer (`roles/container.clusterViewer`)
    - id: c
      text:
        en: |-
          Kubernetes Engine Developer (`roles/container.developer`)
    - id: d
      text:
        en: |-
          Compute Viewer (`roles/compute.viewer`)
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Kubernetes Engine Viewer gives read-only access to the clusters and to the Kubernetes objects inside them, such as nodes, Pods and Services. It covers both the cluster listing with gcloud and the kubectl reads, with no write permission.
  options:
    b:
      en: |-
        Cluster Viewer only allows getting and listing the clusters; without RBAC bindings, the kubectl calls to list nodes, Pods and Services are denied.
    c:
      en: |-
        Kubernetes Engine Developer can create, update and delete many Kubernetes objects, which the script must never be able to do.
    d:
      en: |-
        Compute Viewer covers Compute Engine resources such as the node VMs, not the GKE API or the Kubernetes objects of the clusters.
references:
  - title: "Create IAM allow policies | GKE security | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/iam
