id: gcpace-3a-rdp-iap-tunnel
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An accounting firm runs a Windows Server VM named win-app-1 in zone europe-west1-b. The VM has no external IP address, a firewall rule allows TCP 3389 from the IAP range, and you have the IAP-secured Tunnel User role. You need to open a Remote Desktop session from your laptop with your usual RDP client.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute ssh win-app-1 --zone=europe-west1-b --tunnel-through-iap`, and then start the RDP client from that session.
    - id: b
      text:
        en: |-
          Run `gcloud compute connect-to-serial-port win-app-1 --zone=europe-west1-b --port=2`, and then point the RDP client at the session.
    - id: c
      text:
        en: |-
          Run `gcloud compute start-iap-tunnel win-app-1 3389 --local-host-port=localhost:3389 --zone=europe-west1-b`, and then connect the RDP client to localhost:3389.
    - id: d
      text:
        en: |-
          Run `gcloud compute ssh win-app-1 --zone=europe-west1-b --internal-ip`, and then connect the RDP client to the internal IP address.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud compute start-iap-tunnel` opens a local port that IAP forwards to port 3389 of the VM, so any RDP client can connect to localhost on that port. It works without an external IP address, given the IAP firewall rule and the IAP-secured Tunnel User role.
  options:
    a:
      en: |-
        `gcloud compute ssh` opens an SSH session, which needs an SSH server on the VM and doesn't give your local RDP client a forwarded port 3389.
    b:
      en: |-
        Port 2 of the serial console gives a text console for troubleshooting a Windows VM; it isn't a Remote Desktop connection.
    d:
      en: |-
        `--internal-ip` only works when your laptop has a network path to the VPC, such as a VPN, which the scenario doesn't have; it is also an SSH command, not an RDP tunnel.
references:
  - title: "Use IAP for TCP forwarding | Identity-Aware Proxy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding
