id: gcpace-3d-cloud-hub-operator-role
objective: "3.4.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The folder `payments` is set up for App Hub application management, and its management project is `payments-mp`. Several applications are defined there, with their telemetry aggregated. An SRE needs to view the applications' health in the Cloud Hub application view. They don't need to create Gemini Cloud Assist investigations. You must follow the principle of least privilege.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the SRE the Cloud Hub Operator role on the management project `payments-mp`.
    - id: b
      text:
        en: |-
          Grant the SRE the Cloud Hub Operator role on every service project of the applications.
    - id: c
      text:
        en: |-
          Grant the SRE the Monitoring Viewer and Logs Viewer roles on the organization.
    - id: d
      text:
        en: |-
          Grant the SRE the Investigations Creator role on the management project `payments-mp`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Cloud Hub Operator (`roles/cloudhub.operator`) lets users view most application and project data in Cloud Hub. For the application view, Cloud Hub roles are granted on the management project of the folder; for the project view, they are granted on the project.
  options:
    b:
      en: |-
        Roles on the service projects serve the project view of each project; the application view needs the role on the folder's management project.
    c:
      en: |-
        Organization-wide viewer roles give far more access than needed and aren't the Cloud Hub role the application view uses.
    d:
      en: |-
        Investigations Creator lets users create and view Gemini Cloud Assist investigations, which the SRE doesn't need; it isn't the role for viewing Cloud Hub data.
references:
  - title: "Access control with IAM | Cloud Hub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/hub/docs/access-control
  - title: "View application and resource health | Cloud Hub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/hub/docs/health
