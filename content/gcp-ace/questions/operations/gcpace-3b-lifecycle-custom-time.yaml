id: gcpace-3b-lifecycle-custom-time
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A law firm stores signed contracts in the bucket `gs://contracts`. Each contract must be deleted 30 days after its own end date, which differs for each contract and is only known when the contract ends. The firm's application can update object metadata when a contract ends, but the firm doesn't want to run any scheduled job.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add a lifecycle rule with the action `Delete` and the condition `age: 30`.
    - id: b
      text:
        en: |-
          Add a lifecycle rule with the action `Delete` and the condition `createdBefore` set to the latest known contract end date.
    - id: c
      text:
        en: |-
          Enable Object Versioning, and add a lifecycle rule with the action `Delete` and the condition `daysSinceNoncurrentTime: 30`.
    - id: d
      text:
        en: |-
          Have the application set each object's Custom-Time to the end date, and add a `Delete` rule with `daysSinceCustomTime: 30`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Custom-Time is object metadata that a user or application sets, for example with `gcloud storage objects update --custom-time`. The `daysSinceCustomTime` condition is met once the given number of days have passed since that time, so each contract is deleted 30 days after its own end date without any external scheduler.
  options:
    a:
      en: |-
        `age` counts days since the object was uploaded, so contracts would be deleted 30 days after upload, regardless of their end date.
    b:
      en: |-
        `createdBefore` compares a single fixed date with the creation time, so it can't follow a different end date for each contract.
    c:
      en: |-
        `daysSinceNoncurrentTime` applies only to noncurrent versions, and live contracts don't become noncurrent when they end.
references:
  - title: "Object Lifecycle Management | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/lifecycle
