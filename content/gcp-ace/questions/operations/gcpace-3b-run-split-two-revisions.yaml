id: gcpace-3b-run-split-two-revisions
objective: "3.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs the Cloud Run service `checkout` in `us-east1`. Revision `checkout-00041-kov` serves all the traffic, and revision `checkout-00042-pax` was deployed with `--no-traffic`. The product team wants an A/B test in which 20% of the requests go to `checkout-00042-pax` and the rest stay on `checkout-00041-kov`. Nothing may be redeployed.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud run services update-traffic checkout --region=us-east1 --to-latest`
    - id: b
      text:
        en: |-
          `gcloud run services update-traffic checkout --region=us-east1 --to-revisions=checkout-00042-pax=20,checkout-00041-kov=80`
    - id: c
      text:
        en: |-
          `gcloud run deploy checkout --region=us-east1 --image=us-east1-docker.pkg.dev/shop-prod/web/checkout:2.4 --tag=ab-test`
    - id: d
      text:
        en: |-
          `gcloud run services update-traffic checkout --region=us-east1 --update-tags=ab-test=checkout-00042-pax`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud run services update-traffic` with `--to-revisions` assigns a percentage to each named revision; the values are integers from 0 to 100, and a list that totals 100 sets the split exactly as written. The command changes only the traffic configuration of the service, so no new revision is built or deployed.
  options:
    a:
      en: |-
        `--to-latest` sends 100% of the traffic to the newest revision, so there is no A/B split and every user gets `checkout-00042-pax`.
    c:
      en: |-
        This command deploys a new revision, which the scenario forbids, and it doesn't create a 20/80 split between the two existing revisions.
    d:
      en: |-
        `--update-tags` only gives the revision a tag and a tag URL; tag changes don't modify the traffic percentages.
references:
  - title: "Rollbacks, gradual rollouts, and traffic migration | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
  - title: "gcloud run services update-traffic | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/run/services/update-traffic
