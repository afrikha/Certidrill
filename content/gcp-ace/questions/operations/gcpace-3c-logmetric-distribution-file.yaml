id: gcpace-3c-logmetric-distribution-file
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An API platform writes a log entry per request with the fields `jsonPayload.latency_ms` and `jsonPayload.endpoint`. The SRE team needs a log-based metric that records the distribution of the latency values, with a label per endpoint, so that they can chart percentiles per endpoint. The metric must be created with the gcloud CLI.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud logging metrics create api_latency --config-from-file=api_latency.yaml`, where the file defines a distribution metric that extracts the latency and an endpoint label.
    - id: b
      text:
        en: |-
          Run `gcloud logging metrics create api_latency --description="API latency" --log-filter='jsonPayload.latency_ms>0'` to record the latency of each matching request.
    - id: c
      text:
        en: |-
          Run `gcloud logging metrics create api_latency --description="API latency" --log-filter='jsonPayload.latency_ms>0' --bucket-name=api-logs` to record the latency in a log bucket.
    - id: d
      text:
        en: |-
          Run `gcloud monitoring policies create --policy-from-file=api_latency.yaml`, where the file defines a condition on the `jsonPayload.latency_ms` field.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A distribution log-based metric extracts a numeric value from each matching entry and accumulates the values into histogram buckets, and label extractors add labels such as the endpoint. With gcloud, distribution metrics and user-defined labels require `--config-from-file` with a LogMetric definition.
  options:
    b:
      en: |-
        With only `--description` and `--log-filter`, gcloud creates a counter metric, which counts entries and ignores the latency value.
    c:
      en: |-
        `--bucket-name` creates a bucket-scoped metric, but it is still a counter without the latency values or the endpoint label.
    d:
      en: |-
        An alerting policy can't read log fields directly; it needs a metric, which this command doesn't create.
references:
  - title: "Log-based metrics overview | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/logs-based-metrics
