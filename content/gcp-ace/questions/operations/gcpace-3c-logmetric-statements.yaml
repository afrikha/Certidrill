id: gcpace-3c-logmetric-statements
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    At 09:00 today, the operations team of an online bank created the user-defined counter log-based metric `payment_failures` in the project `pay-prod`. It counts the log entries that report a failed payment. The project's `_Default` sink has an exclusion filter that matches some of these entries.

    Which two statements about this metric are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Its chart in Cloud Monitoring also shows the payment failures logged during the previous week.
    - id: b
      text:
        en: |-
          It counts only the matching log entries that Cloud Logging receives after the metric was created.
    - id: c
      text:
        en: |-
          It ignores the log entries that the exclusion filter of the `_Default` sink matches.
    - id: d
      text:
        en: |-
          It could instead have been created on the folder of `pay-prod` to cover all the projects of the folder.
    - id: e
      text:
        en: |-
          Its metric type in Cloud Monitoring is `logging.googleapis.com/user/payment_failures`.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A log-based metric isn't populated retroactively with log entries already in Cloud Logging: it counts only the entries received after its creation. User-defined log-based metrics have the type `logging.googleapis.com/user/METRIC_NAME`.
  options:
    a:
      en: |-
        Log-based metrics aren't backfilled, so the chart starts when the metric was created.
    c:
      en: |-
        By default, user-defined log-based metrics are calculated from logs regardless of exclusion filters.
    d:
      en: |-
        Log-based metrics can't be created for folders or organizations, only for projects or log buckets.
references:
  - title: "Log-based metrics overview | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/logs-based-metrics
