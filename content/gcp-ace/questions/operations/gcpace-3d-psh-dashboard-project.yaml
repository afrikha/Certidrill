id: gcpace-3d-psh-dashboard-project
objective: "3.4.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During a slowdown of its Compute Engine workloads in `us-east1`, an e-commerce company wants to know whether an ongoing Google Cloud incident affects its project `shop-prod`, which products and locations are impacted, and the latest update and workaround from Google. The Service Health API is enabled in the project, and you have the Personalized Service Health Viewer role on it.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Open the public Google Cloud Service Health page, and read the incidents listed for Compute Engine in all regions.
    - id: b
      text:
        en: |-
          In the console, select `shop-prod`, open the Service Health dashboard, and review its active incidents.
    - id: c
      text:
        en: |-
          Create an uptime check on the workloads, and review its failures on the Cloud Monitoring uptime checks page.
    - id: d
      text:
        en: |-
          Query the Admin Activity audit logs of `shop-prod` in the Logs Explorer for entries written by Google.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Personalized Service Health shows, in the Service Health dashboard of the selected project, the active and closed incidents that are relevant to that project. Each incident shows its relevance, the impacted products and locations, its start time and the latest update from Google Cloud Support, and the details include the workaround when one exists.
  options:
    a:
      en: |-
        The public page lists incidents for all customers; it doesn't say whether an incident is relevant to `shop-prod`.
    c:
      en: |-
        An uptime check shows that the workloads are unreachable or slow, not whether a Google Cloud incident causes it or what the workaround is.
    d:
      en: |-
        Admin Activity audit logs record configuration changes made by principals in the project, not Google Cloud incidents.
references:
  - title: "Quickstart: View service health events in the Google Cloud console | Personalized Service Health | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-health/docs/view-events
  - title: "Personalized Service Health overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-health/docs/overview
