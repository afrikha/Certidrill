id: gcpace-3c-bq-show-job
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer at a retail company started a BigQuery load job from a script with the global flag `--nosynchronous_mode`, so the script returned without waiting. The script printed the fully qualified job ID `retail-prod:US.bqjob_r1a2b3`. The engineer now needs to check whether the job has finished and, if it failed, read the error that it returned.

    What should the engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `bq ls -a` to list every dataset of the project and check the last modified time of the destination dataset.
    - id: b
      text:
        en: |-
          Run `gcloud dataflow jobs describe retail-prod:US.bqjob_r1a2b3` to display the state and the errors of the job.
    - id: c
      text:
        en: |-
          Run `bq show --format=prettyjson -j retail-prod:US.bqjob_r1a2b3` to display the state and the error result of the job.
    - id: d
      text:
        en: |-
          Run `bq show --schema retail-prod:sales.orders` to check whether the destination table already has the loaded columns.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `bq show -j` (or `--job=true`) followed by the job ID displays the metadata of a BigQuery job, including its state (PENDING, RUNNING or DONE) and, for a failed job, the error result. With `--format=prettyjson` you get the full details, and the fully qualified job ID makes the `--location` flag unnecessary.
  options:
    a:
      en: |-
        `bq ls -a` without `-j` lists datasets, including hidden ones; a dataset's modification time says nothing reliable about the state or the error of one load job.
    b:
      en: |-
        `gcloud dataflow jobs describe` reads Dataflow jobs, not BigQuery jobs, so it can't find a BigQuery job ID.
    d:
      en: |-
        `bq show --schema` displays a table's schema; an existing schema doesn't prove that this load job finished, and it shows no job error.
references:
  - title: "Manage jobs | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/managing-jobs
