id: gcpace-3c-dataflow-list-active
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs several Dataflow pipelines in the `europe-west1` region. An operations script must print, every morning, only the Dataflow jobs that are currently running in that region, with their IDs and states. Jobs that finished, failed or were canceled must not appear.

    Which command should the script run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud dataflow jobs list --region=europe-west1 --status=active`
    - id: b
      text:
        en: |-
          `gcloud dataflow jobs list --region=europe-west1 --status=all`
    - id: c
      text:
        en: |-
          `gcloud dataflow jobs list --region=europe-west1 --status=terminated`
    - id: d
      text:
        en: |-
          `gcloud dataflow jobs show --region=europe-west1 --environment`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `gcloud dataflow jobs list` returns the jobs with their ID, name, type, creation time, state and region. The `--status=active` filter keeps only the running jobs, and `--region` limits the query to `europe-west1` instead of querying all regions.
  options:
    b:
      en: |-
        `--status=all` returns the running jobs first and then every terminated job, so finished, failed and canceled jobs would appear.
    c:
      en: |-
        `--status=terminated` returns only the jobs in a terminal state (done, failed, canceled, drained, updated), the opposite of what the script needs.
    d:
      en: |-
        `gcloud dataflow jobs show` describes one job and requires its job ID; it can't list the running jobs of a region.
references:
  - title: "Dataflow jobs list | Google Cloud Documentation"
    url: https://docs.cloud.google.com/dataflow/docs/guides/jobs-list
