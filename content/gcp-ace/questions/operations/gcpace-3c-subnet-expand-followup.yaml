id: gcpace-3c-subnet-expand-followup
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank expanded the primary range of the subnet `svc-subnet` from `10.30.0.0/24` to `10.30.0.0/20`. Several VPC firewall rules use `10.30.0.0/24` as a source range, and a GKE cluster in the subnet restricts access to its control plane with authorized networks that list `10.30.0.0/24`. New VMs in the expanded range must have the same access as the existing VMs.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Restart every existing VM in the subnet so that its network interface uses the new subnet mask.
    - id: b
      text:
        en: |-
          Update the firewall rules that use `10.30.0.0/24` as a source range so that they use `10.30.0.0/20`.
    - id: c
      text:
        en: |-
          Replace the secondary ranges of `svc-subnet` so that they match the expanded primary range.
    - id: d
      text:
        en: |-
          Add `10.30.0.0/20` to the authorized networks of the GKE cluster's control plane.
    - id: e
      text:
        en: |-
          Recreate the instance templates of the managed instance groups that use `svc-subnet`.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Expanding a subnet doesn't change the rules that reference the old range: firewall rules and firewall policy rules that use `10.30.0.0/24` must be updated to cover the expanded range. When a GKE cluster uses the subnet, the expanded range must also be added to its control plane authorized networks.
  options:
    a:
      en: |-
        The expansion doesn't interrupt traffic and needs no restart of the existing VMs.
    c:
      en: |-
        Secondary ranges are independent of the primary range and don't need to match it.
    e:
      en: |-
        Instance templates reference the subnet, not its range, so new instances automatically get addresses from the expanded range.
references:
  - title: "Quickstart: Create and manage VPC networks | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/create-modify-vpc-networks
