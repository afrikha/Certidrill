id: gcpace-3d-cloud-hub-health-page
objective: "3.4.14"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The on-call engineer of a SaaS company starts each shift by checking the project `saas-prod`. They want one console page that shows the open alerts of the project's Cloud Monitoring alerting policies, the active Google Cloud incidents that affect the project, and utilization, latency and error data of its resources.

    Which page should the engineer open?
body:
  options:
    - id: a
      text:
        en: |-
          The Service Health dashboard of Personalized Service Health
    - id: b
      text:
        en: |-
          The Alerting page of Cloud Monitoring
    - id: c
      text:
        en: |-
          The Health & troubleshooting page of Cloud Hub
    - id: d
      text:
        en: |-
          The Recommendations page of Active Assist
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Cloud Hub Health & troubleshooting page brings together, for the selected project or App Hub application, the open Cloud Monitoring alerts, the active Google Cloud incidents from Service Health, and resource health metrics such as utilization, latency and errors.
  options:
    a:
      en: |-
        The Service Health dashboard shows the Google Cloud incidents relevant to the project, but not the project's own alerts or resource metrics.
    b:
      en: |-
        The Alerting page lists the alerting policies and their alerts, but not the Google Cloud incidents that affect the project.
    d:
      en: |-
        Active Assist recommendations suggest optimizations such as rightsizing; they don't show active alerts or incidents.
references:
  - title: "View application and resource health | Cloud Hub | Google Cloud Documentation"
    url: https://docs.cloud.google.com/hub/docs/health
