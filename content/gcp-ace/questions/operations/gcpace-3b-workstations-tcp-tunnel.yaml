id: gcpace-3b-workstations-tcp-tunnel
objective: "3.1.16"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer runs a web application on port 8080 inside the Cloud Workstations workstation `dev-anna` (cluster `eu-dev`, configuration `node-ide`, region `europe-west1`). The developer wants to open the application in a browser on their laptop at `http://localhost:8080`.

    Which command should the developer run on the laptop?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute ssh dev-anna --zone=europe-west1-b -- -L 8080:localhost:8080`
    - id: b
      text:
        en: |-
          `gcloud workstations ssh dev-anna --cluster=eu-dev --config=node-ide --region=europe-west1 --local-host-port=localhost:8080`
    - id: c
      text:
        en: |-
          `gcloud workstations start-tcp-tunnel dev-anna 8080 --cluster=eu-dev --config=node-ide --region=europe-west1 --local-host-port=localhost:8080`
    - id: d
      text:
        en: |-
          `gcloud compute start-iap-tunnel dev-anna 8080 --local-host-port=localhost:8080 --zone=europe-west1-b`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud workstations start-tcp-tunnel` forwards a local port to a port of the workstation; the positional arguments are the workstation and the workstation port, and `--local-host-port` sets the address that gcloud listens on locally (by default an arbitrary free port). The browser can then reach the application at `localhost:8080`.
  options:
    a:
      en: |-
        A workstation isn't addressed as a Compute Engine instance in a zone with `gcloud compute ssh`; workstations are reached through `gcloud workstations` commands.
    b:
      en: |-
        For `gcloud workstations ssh`, `--local-host-port` is only the local end of the tunnel that carries the SSH session to workstation port 22 by default; the application on port 8080 isn't forwarded.
    d:
      en: |-
        `gcloud compute start-iap-tunnel` targets Compute Engine VM instances, not workstations of a workstation cluster.
references:
  - title: "gcloud workstations start-tcp-tunnel | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/workstations/start-tcp-tunnel
