id: gcpace-3a-k8s-rollout-undo
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Ten minutes ago, you updated the image of the Deployment checkout in a GKE cluster with `kubectl set image`. The new Pods crash at startup. You need to return the Deployment to its previous image as quickly as possible.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `kubectl rollout restart deployment/checkout`
    - id: b
      text:
        en: |-
          `kubectl delete pods -l app=checkout`
    - id: c
      text:
        en: |-
          `kubectl scale deployment/checkout --replicas=0`
    - id: d
      text:
        en: |-
          `kubectl rollout undo deployment/checkout`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `kubectl rollout undo` rolls a Deployment back to its previous revision, so the Pod template with the earlier image is rolled out again. The Deployment keeps its revision history for this purpose.
  options:
    a:
      en: |-
        A restart recreates the Pods with the current template, so they still use the faulty image.
    b:
      en: |-
        The Deployment recreates the deleted Pods from the current template, with the same faulty image.
    c:
      en: |-
        Scaling to zero stops the application entirely instead of restoring the previous version.
references:
  - title: "Deploying a stateless Linux application | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/stateless-apps
