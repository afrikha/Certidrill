id: gcpace-3a-run-deploy-from-source
objective: "3.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer maintains the Cloud Run service `api` in `europe-west1`. The source directory now contains a Dockerfile that installs a system library the service needs. The project has never used source deployments, and its Artifact Registry has no repository yet. The developer runs `gcloud run deploy api --source=. --region=europe-west1` from a laptop where Docker isn't installed.

    What happens?
body:
  options:
    - id: a
      text:
        en: |-
          The command fails, because Docker must be installed locally to build an image from a Dockerfile.
    - id: b
      text:
        en: |-
          Cloud Build ignores the Dockerfile and builds the image with Google Cloud's buildpacks, so the system library isn't installed.
    - id: c
      text:
        en: |-
          Cloud Build builds the image with the Dockerfile, stores it in an Artifact Registry repository named `cloud-run-source-deploy` in `europe-west1` that is created automatically, and the new revision of `api` is deployed.
    - id: d
      text:
        en: |-
          The command fails, because an Artifact Registry repository must be created first with `gcloud artifacts repositories create`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A source deployment uploads the code and builds it with Cloud Build, without Docker on the developer's machine. When a Dockerfile is present, the build uses it; buildpacks are used only when there is none. The image is stored in the `cloud-run-source-deploy` repository of the region, which the feature creates if it doesn't exist, and the service is updated with the new image.
  options:
    a:
      en: |-
        The build runs in Cloud Build, not on the laptop, so no local Docker installation is needed.
    b:
      en: |-
        Buildpacks are used only when the directory has no Dockerfile; here the Dockerfile is used.
    d:
      en: |-
        The `cloud-run-source-deploy` repository is created automatically when it doesn't exist in the region.
references:
  - title: "Deploy services from source code | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/deploying-source-code
