id: gcpace-3d-recommendations-bq-export
objective: "3.4.13"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A holding company has an organization with more than 600 projects in several folders. The FinOps team wants all the Active Assist recommendations and insights of the organization in BigQuery, refreshed daily, so that it can rank the potential savings by project in a dashboard. The solution must require the least ongoing operational effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Write a Cloud Run job that runs `gcloud recommender recommendations list` for every project and recommender each night, and load the results into BigQuery.
    - id: b
      text:
        en: |-
          Create an aggregated sink at the organization that routes the Recommender API audit logs of all projects to a BigQuery dataset.
    - id: c
      text:
        en: |-
          Configure a daily Cloud Asset Inventory export of the organization's resources to BigQuery, and join it with the billing export.
    - id: d
      text:
        en: |-
          Create a BigQuery Data Transfer Service transfer for the recommendations export of the organization, with the Recommendations Exporter role granted at the organization level.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Recommender exports the recommendations and insights of every project, folder and billing account of an organization to BigQuery through the BigQuery Data Transfer Service, by default every day. The person who sets up the transfer needs the Recommendations Exporter role (`roles/recommender.exporter`) on the organization, and the transfer writes date-partitioned tables such as `recommendations_export`.
  options:
    a:
      en: |-
        A custom job works, but it has to loop over hundreds of projects, recommenders and locations, and it must be maintained, which is much more operational effort than the managed export.
    b:
      en: |-
        Audit logs record the calls made to the Recommender API, not the content of the recommendations that it generates.
    c:
      en: |-
        Cloud Asset Inventory exports the resources and their metadata, not the recommendations and insights generated by Active Assist.
references:
  - title: "Export recommendations to BigQuery | Recommender | Google Cloud Documentation"
    url: https://docs.cloud.google.com/recommender/docs/bq-export/export-recommendations-to-bq
