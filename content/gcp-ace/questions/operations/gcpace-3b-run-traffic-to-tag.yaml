id: gcpace-3b-run-traffic-to-tag
objective: "3.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI pipeline deploys each release candidate of the Cloud Run service `search` in `us-central1` with `--no-traffic --tag=candidate`, which moves the `candidate` tag to the new revision. Hotfix revisions are sometimes deployed after a candidate, so the newest revision is not always the candidate. After QA approval, a release script must send 10% of production traffic to the revision that carries the `candidate` tag, without looking up revision names.

    Which command should the script run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud run services update-traffic search --region=us-central1 --to-tags=candidate=10`
    - id: b
      text:
        en: |-
          `gcloud run services update-traffic search --region=us-central1 --to-revisions=LATEST=10`
    - id: c
      text:
        en: |-
          `gcloud run services update-traffic search --region=us-central1 --update-tags=candidate=10`
    - id: d
      text:
        en: |-
          `gcloud run deploy search --region=us-central1 --image=us-central1-docker.pkg.dev/web-prod/apps/search:rc --tag=candidate`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `--to-tags` assigns a traffic percentage to the revision that currently holds the tag, so the script never needs the revision name. The tag must already exist on a revision, which the pipeline guarantees by deploying each candidate with `--tag=candidate`.
  options:
    b:
      en: |-
        `LATEST` targets the newest ready revision, which can be a hotfix revision deployed after the candidate.
    c:
      en: |-
        `--update-tags` takes `TAG=REVISION` pairs to move tags; it doesn't assign traffic percentages, and `10` isn't a revision name.
    d:
      en: |-
        This deploys a new revision instead of shifting traffic to the approved candidate, and it moves the tag to an untested revision.
references:
  - title: "gcloud run services update-traffic | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/run/services/update-traffic
  - title: "Rollbacks, gradual rollouts, and traffic migration | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
