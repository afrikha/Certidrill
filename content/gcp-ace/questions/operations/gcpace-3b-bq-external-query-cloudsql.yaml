id: gcpace-3b-bq-external-query-cloudsql
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Analysts must join live order data from a Cloud SQL for PostgreSQL instance in `us-east4` with customer tables stored in BigQuery in the `US` multi-region. They must not copy the order data or build a data pipeline.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Export the Cloud SQL tables to Cloud Storage every night, and load the exported files into BigQuery tables.
    - id: b
      text:
        en: |-
          Configure Datastream to replicate the Cloud SQL tables into a BigQuery dataset continuously in near real time.
    - id: c
      text:
        en: |-
          Connect with `gcloud sql connect`, and run the join in `psql` between the orders and the BigQuery tables.
    - id: d
      text:
        en: |-
          Create a Cloud SQL connection in BigQuery in the `US` location, and use `EXTERNAL_QUERY` in the analysts' BigQuery queries.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      BigQuery federated queries read Cloud SQL data in real time without copying or moving it: an administrator creates a Cloud SQL connection resource, and analysts send a SELECT statement to Cloud SQL with `EXTERNAL_QUERY`, joining the result with BigQuery tables. The connection must be in the instance's region or in the multi-region of the same jurisdiction, so `US` works for `us-east4`.
  options:
    a:
      en: |-
        Nightly exports copy the data and lag behind the live orders.
    b:
      en: |-
        Replication with Datastream is a data pipeline that copies the tables, which the requirement excludes.
    c:
      en: |-
        `psql` connects only to the Cloud SQL database, which can't reach tables stored in BigQuery.
references:
  - title: "Cloud SQL federated queries | BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigquery/docs/cloud-sql-federated-queries
