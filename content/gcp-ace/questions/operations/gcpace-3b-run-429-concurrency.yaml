id: gcpace-3b-run-429-concurrency
objective: "3.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Cloud Run service `catalog-api` in `us-west1` returns HTTP 429 errors during daily peaks. Metrics show that the instance count stays at the service-level maximum of 10 and that the CPU utilization of each instance stays below 20%. The service was deployed with `--concurrency=1` by mistake; the code is thread-safe and handles parallel requests efficiently. The finance team won't approve more instances.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud run services update catalog-api --region=us-west1 --max=50`.
    - id: b
      text:
        en: |-
          Run `gcloud run services update catalog-api --region=us-west1 --min=10`.
    - id: c
      text:
        en: |-
          Run `gcloud run services update catalog-api --region=us-west1 --concurrency=80`.
    - id: d
      text:
        en: |-
          Run `gcloud run services update catalog-api --region=us-west1 --cpu-boost`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When every instance allowed by the maximum is busy, Cloud Run holds new requests for a short time and then rejects them with 429. With a concurrency of 1, each of the 10 instances handles only one request while its CPU stays mostly idle. Raising concurrency lets the same 10 instances serve many requests in parallel, which a thread-safe application supports.
  options:
    a:
      en: |-
        Raising the maximum to 50 instances also removes the errors, but it adds instances, which the finance team refuses.
    b:
      en: |-
        A minimum of 10 keeps instances warm off-peak but doesn't add any capacity at the peak, where the count is already 10.
    d:
      en: |-
        Startup CPU boost speeds up instance startup; it doesn't increase the number of requests that the 10 instances can serve.
references:
  - title: "About instance autoscaling in Cloud Run services | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/about-instance-autoscaling
  - title: "Maximum concurrent requests for services | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/about-concurrency
