id: gcpace-3d-gca-monitoring-viewer
objective: "3.4.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Gemini Cloud Assist is set up in the project `crm-prod`, the Cloud Monitoring API is enabled, and a developer has the Gemini Cloud Assist User and Cloud Asset Viewer roles. When the developer asks the Gemini Cloud Assist panel "Which of my VMs have the highest utilization?", Gemini Cloud Assist can't return the utilization data. You must fix the problem following the principle of least privilege.

    Which role should you grant to the developer on `crm-prod`?
body:
  options:
    - id: a
      text:
        en: |-
          Monitoring Viewer (`roles/monitoring.viewer`)
    - id: b
      text:
        en: |-
          Compute Instance Admin (v1) (`roles/compute.instanceAdmin.v1`)
    - id: c
      text:
        en: |-
          Monitoring Metric Writer (`roles/monitoring.metricWriter`)
    - id: d
      text:
        en: |-
          Logs Viewer (`roles/logging.viewer`)
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Gemini Cloud Assist (Preview) answers resource performance questions from Cloud Monitoring data, with the user's own permissions. The documentation requires the Cloud Monitoring API and the Monitoring Viewer role for this analysis, and Monitoring Viewer is a read-only role.
  options:
    b:
      en: |-
        This role allows managing VM instances, which is far more than needed, and it doesn't grant read access to Cloud Monitoring metrics.
    c:
      en: |-
        Metric Writer lets an identity write metric data, not read it; it is meant for agents and applications.
    d:
      en: |-
        Logs Viewer gives read access to log entries, while VM utilization comes from Cloud Monitoring metrics.
references:
  - title: "Use Gemini Cloud Assist in the Google Cloud console | Google Cloud Documentation"
    url: https://docs.cloud.google.com/cloud-assist/chat-panel
