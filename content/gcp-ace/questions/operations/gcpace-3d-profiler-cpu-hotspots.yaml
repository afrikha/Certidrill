id: gcpace-3d-profiler-cpu-hotspots
objective: "3.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Java service on GKE uses about three times more CPU in production than in the test environment, and its pods keep scaling out. Cloud Trace shows that the latency is spent inside the service itself, not in its downstream calls. You need to find which methods of the service consume the CPU, continuously in production, with low overhead.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add custom spans around each method of the service, and compare their latencies in Trace Explorer.
    - id: b
      text:
        en: |-
          Enable Data Access audit logs for the GKE API, and search the entries of the service's pods.
    - id: c
      text:
        en: |-
          Enable Query Insights on the service's database, and review the top queries by execution time.
    - id: d
      text:
        en: |-
          Start the Cloud Profiler agent with the service, and analyze the CPU time profiles in the Profiler interface.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Cloud Profiler continuously collects CPU and memory profiles from production applications, about 10 seconds every minute per instance, with an overhead commonly below 0.5 percent when amortized. For Java it collects CPU time, heap and wall time profiles, which show the methods that consume the CPU.
  options:
    a:
      en: |-
        Spans measure elapsed time, not CPU consumption, and adding a span to every method is a large code change with its own overhead.
    b:
      en: |-
        Data Access audit logs record API calls that read data or configuration; they contain nothing about the CPU used by the application's code.
    c:
      en: |-
        Trace already shows that the time is spent inside the service, and Query Insights only analyzes database queries.
references:
  - title: "Cloud Profiler overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/profiler/docs/about-profiler
