id: gcpace-3c-subnet-expand-peering-overlap
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company's VPC network `prod-vpc` has a subnet `app-subnet` with the primary range `10.20.0.0/24`. No other subnet of `prod-vpc` uses addresses in `10.20.0.0/16`. `prod-vpc` is peered with `partner-vpc`, which has a subnet `10.20.8.0/24`, and the peering must stay in place. `app-subnet` must provide at least 1,800 usable primary IPv4 addresses for VMs.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Expand `app-subnet` with `--prefix-length=20`.
    - id: b
      text:
        en: |-
          Expand `app-subnet` with `--prefix-length=22`.
    - id: c
      text:
        en: |-
          Add a secondary range `10.20.16.0/21` to `app-subnet`.
    - id: d
      text:
        en: |-
          Expand `app-subnet` with `--prefix-length=21`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Expanding to /21 gives `10.20.0.0/21` (10.20.0.0 to 10.20.7.255): 2,048 addresses, of which 2,044 are usable because Google Cloud reserves four addresses in each primary range. It stops just below `10.20.8.0/24`, and an expanded range must not overlap subnets of peered networks.
  options:
    a:
      en: |-
        `10.20.0.0/20` covers 10.20.0.0 to 10.20.15.255, so it overlaps the peered subnet `10.20.8.0/24`, and the expansion is refused.
    b:
      en: |-
        A /22 range has 1,024 addresses (1,020 usable), fewer than the required 1,800.
    c:
      en: |-
        Secondary ranges provide alias IP ranges; VM primary internal addresses come only from the primary range, which would stay at /24.
references:
  - title: "Subnets | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/subnets
