id: gcpace-3a-ar-default-node-sa
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel agency's project (project number 482910337165) has an organization policy that blocks automatic role grants to default service accounts, so the Compute Engine default service account has no role. You created a GKE Standard cluster with the default node settings. Pods that use images from an Artifact Registry repository in the same project fail with ImagePullBackOff and a 403 error.

    Which principal should you grant the Artifact Registry Reader role on the repository?
body:
  options:
    - id: a
      text:
        en: |-
          `482910337165-compute@developer.gserviceaccount.com`
    - id: b
      text:
        en: |-
          `service-482910337165@container-engine-robot.iam.gserviceaccount.com`
    - id: c
      text:
        en: |-
          `482910337165@cloudbuild.gserviceaccount.com`
    - id: d
      text:
        en: |-
          The Kubernetes service account `default` in the namespace of the Pods
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With default node settings, the nodes run as the Compute Engine default service account, and the kubelet pulls images with that identity. Because the organization policy removed its automatic Editor grant, you must give it the Artifact Registry Reader role yourself.
  options:
    b:
      en: |-
        The GKE service agent manages cluster resources on Google's side; image pulls on the nodes don't use it.
    c:
      en: |-
        The Cloud Build service account builds and pushes images; it plays no part when GKE nodes pull them.
    d:
      en: |-
        A Kubernetes service account isn't an IAM principal by itself, and kubelet image pulls don't use Workload Identity Federation for GKE.
references:
  - title: "Deploying to Google Kubernetes Engine | Artifact Registry | Google Cloud Documentation"
    url: https://docs.cloud.google.com/artifact-registry/docs/integrate-gke
  - title: "Troubleshoot image pulls | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/troubleshooting/image-pulls
