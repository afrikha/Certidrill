id: gcpace-3c-dns-private-zone
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company wants its VMs in the VPC network `apps-vpc` to resolve names such as `db.corp.internal` to internal addresses. The names must not be resolvable from the internet or from the company's other VPC networks.

    Which command should you run first?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud dns managed-zones create corp-internal --dns-name=corp.internal. --visibility=public --description="Internal names"`
    - id: b
      text:
        en: |-
          `gcloud dns managed-zones create corp-internal --dns-name=corp.internal. --visibility=private --networks=apps-vpc --forwarding-targets=10.0.0.53`
    - id: c
      text:
        en: |-
          `gcloud dns managed-zones create corp-internal --dns-name=corp.internal. --visibility=private --networks=apps-vpc --description="Internal names"`
    - id: d
      text:
        en: |-
          `gcloud dns policies create corp-internal --networks=apps-vpc --enable-inbound-forwarding --description="Internal names"`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Cloud DNS private zone, created with `--visibility=private`, is resolvable only from the VPC networks listed in `--networks`. You then add the records, such as an A record for `db.corp.internal`, to the zone.
  options:
    a:
      en: |-
        A public zone is served on the internet, which the requirement forbids.
    b:
      en: |-
        `--forwarding-targets` makes it a forwarding zone that sends the queries to another name server instead of answering from records stored in Cloud DNS.
    d:
      en: |-
        A server policy with inbound forwarding lets on-premises systems send queries into the VPC network; it doesn't create a zone or records.
references:
  - title: "Create, modify, and delete zones | Cloud DNS | Google Cloud Documentation"
    url: https://docs.cloud.google.com/dns/docs/zones
