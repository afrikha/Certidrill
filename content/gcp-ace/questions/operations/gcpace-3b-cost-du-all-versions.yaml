id: gcpace-3b-cost-du-all-versions
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The bucket `gs://design-assets` has Object Versioning enabled and soft delete disabled. It contains about 50,000 live objects, many of which have been overwritten several times. To estimate the monthly storage cost, you must measure today's total of the stored bytes that are billed for this bucket.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud storage du --summarize gs://design-assets`
    - id: b
      text:
        en: |-
          `gcloud storage buckets describe gs://design-assets --format=json`
    - id: c
      text:
        en: |-
          `gcloud storage du --summarize --all-versions gs://design-assets`
    - id: d
      text:
        en: |-
          `gcloud storage du --summarize --readable-sizes gs://design-assets`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Noncurrent versions are stored and billed like live objects. `gcloud storage du --all-versions` includes noncurrent versions in the total, and `--summarize` prints one total for the bucket. For a bucket of this size, listing the objects is acceptable; for hundreds of thousands of objects or for trends, Cloud Monitoring is recommended.
  options:
    a:
      en: |-
        Without `--all-versions`, only live objects are counted, so the bytes of the noncurrent versions are missing from the estimate.
    b:
      en: |-
        Describing the bucket shows its configuration, not the bytes that its objects use.
    d:
      en: |-
        `--readable-sizes` only formats the output, so the total still excludes the noncurrent versions.
references:
  - title: "gcloud storage du | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/storage/du
  - title: "Get bucket size | Cloud Storage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/storage/docs/getting-bucket-size
