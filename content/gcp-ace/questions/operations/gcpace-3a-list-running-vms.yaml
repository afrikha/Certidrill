id: gcpace-3a-list-running-vms
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company's project, set as your default gcloud project, has about 200 VMs in several zones of two regions. Many of them are stopped. You need a list of only the VMs that are currently running, in all zones of the project.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute instances list --zones=us-central1-a`
    - id: b
      text:
        en: |-
          `gcloud compute instance-groups list --filter="status=RUNNING"`
    - id: c
      text:
        en: |-
          `gcloud compute machine-types list --filter="status=RUNNING"`
    - id: d
      text:
        en: |-
          `gcloud compute instances list --filter="status=RUNNING"`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `gcloud compute instances list` returns the VMs of every zone of the project, and `--filter="status=RUNNING"` keeps only the VMs whose status is RUNNING. Stopped VMs are filtered out.
  options:
    a:
      en: |-
        `--zones` restricts the list to one zone and doesn't filter on status, so it misses the other zones and still shows stopped VMs.
    b:
      en: |-
        This command lists instance groups, not individual VMs, and many VMs may not belong to any group.
    c:
      en: |-
        Machine types are the available VM shapes in each zone, not the VMs of the project.
references:
  - title: "Get a list of VMs | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/get-list
