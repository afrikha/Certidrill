id: gcpace-3a-run-no-traffic-tag
objective: "3.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Cloud Run service named booking in us-central1 serves all production traffic from its latest revision. You built version 2 of the container image and must deploy it so that QA can test it at its own URL, while production users keep reaching the current revision.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud run deploy booking --image=IMAGE_V2 --region=us-central1 --tag=qa`
    - id: b
      text:
        en: |-
          `gcloud run deploy booking --image=IMAGE_V2 --region=us-central1 --no-traffic`
    - id: c
      text:
        en: |-
          `gcloud run deploy booking --image=IMAGE_V2 --region=us-central1 --no-traffic --tag=qa`
    - id: d
      text:
        en: |-
          `gcloud run deploy booking --image=IMAGE_V2 --region=us-central1 --revision-suffix=qa`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `--no-traffic` deploys the new revision without moving the production traffic to it, and `--tag` assigns it a tag with a dedicated URL that starts with the tag name. QA can test that URL while users keep reaching the current revision.
  options:
    a:
      en: |-
        Without `--no-traffic`, the new revision becomes the latest one and receives all the traffic, so production users get version 2 immediately.
    b:
      en: |-
        The revision gets no traffic, but without a tag it has no dedicated URL for QA to test.
    d:
      en: |-
        A revision suffix only names the revision; the new revision still receives all the traffic.
references:
  - title: "Rollbacks, gradual rollouts, and traffic migration | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
