id: gcpace-3b-workbench-prereqs-multi
objective: "3.1.15"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    In a new project with billing enabled and nothing else configured, a developer must create and manage Agent Platform Workbench instances with the gcloud CLI. You must follow the principle of least privilege.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable the Dataform API in the project.
    - id: b
      text:
        en: |-
          Enable the Notebooks API (`notebooks.googleapis.com`) in the project.
    - id: c
      text:
        en: |-
          Grant the developer Notebooks Admin (`roles/notebooks.admin`) on the project.
    - id: d
      text:
        en: |-
          Grant the developer Cloud Workstations Admin (`roles/workstations.admin`) on the project.
    - id: e
      text:
        en: |-
          Grant the developer the legacy Owner basic role (`roles/owner`) on the project.
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      Workbench instances are managed through the Notebooks API, which must be enabled in the project. Notebooks Admin is the predefined role that the documentation lists for creating and managing Workbench instances, without the broad project access of a basic role.
  options:
    a:
      en: |-
        The Dataform API is needed for BigQuery notebooks, which are stored as code assets, not for Workbench instances.
    d:
      en: |-
        Cloud Workstations Admin manages Cloud Workstations clusters and configurations, a different product.
    e:
      en: |-
        Owner, a legacy basic role, would work, but it grants full control of the project, which breaks least privilege.
references:
  - title: "Create a Agent Platform Workbench instance | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/notebooks/workbench/instances/create
