id: gcpace-3d-default-sink-exclusion
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A GKE cluster in the project `inv-prod` runs a container named `inventory` that writes millions of `DEBUG` entries per day. All the cluster's logs are routed by the `_Default` sink to the `_Default` bucket, which is in the `global` location. You must stop storing the `DEBUG` entries of the `inventory` container while keeping every other log entry of the project unchanged, with the least administrative effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud logging sinks update _Default --add-exclusion=name=inventory-debug,filter='resource.type="k8s_container" AND resource.labels.container_name="inventory" AND severity=DEBUG'`.
    - id: b
      text:
        en: |-
          Run `gcloud logging sinks update _Default --disabled`, and then create a new sink that excludes the `DEBUG` entries of the `inventory` container.
    - id: c
      text:
        en: |-
          Run `gcloud logging buckets update _Default --location=global --retention-days=1` so that the `DEBUG` entries are deleted after one day.
    - id: d
      text:
        en: |-
          Run `gcloud logging sinks update _Required --add-exclusion=name=inventory-debug,filter='resource.labels.container_name="inventory" AND severity=DEBUG'`.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An exclusion filter on the `_Default` sink prevents the matching entries from being routed to the `_Default` bucket, and every entry that doesn't match the filter keeps flowing as before. The filter targets only the `inventory` container (`k8s_container` resource, `container_name` label) and the `DEBUG` severity.
  options:
    b:
      en: |-
        Disabling the `_Default` sink stops routing every log of the project until a replacement sink with the same destination and filters exists, which is far more effort than adding one exclusion filter.
    c:
      en: |-
        Retention applies to every entry of the bucket, so all the project's logs would be deleted after one day, and the `DEBUG` entries would still be stored first.
    d:
      en: |-
        The `_Required` sink can't be modified, and it only routes Admin Activity, System Event and Access Transparency audit logs, not container logs.
references:
  - title: "Route log entries | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/routing/overview
  - title: "gcloud logging sinks update | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/logging/sinks/update
