id: gcpace-3c-org-sink-include-children
objective: "3.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A retail group with the organization ID `123456789` must send the audit logs of all its projects, including projects created in the future, to the BigQuery dataset `org_audit` in the project `sec-logging`. The project teams' own sinks must keep receiving their logs.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          In each existing project, create a sink whose destination is `bigquery.googleapis.com/projects/sec-logging/datasets/org_audit`.
    - id: b
      text:
        en: |-
          Run `gcloud logging sinks create org-audit bigquery.googleapis.com/projects/sec-logging/datasets/org_audit --organization=123456789 --include-children --log-filter='logName:"cloudaudit.googleapis.com"'`.
    - id: c
      text:
        en: |-
          Run `gcloud logging sinks create org-audit bigquery.googleapis.com/projects/sec-logging/datasets/org_audit --organization=123456789 --include-children --intercept-children --log-filter='logName:"cloudaudit.googleapis.com"'`.
    - id: d
      text:
        en: |-
          Grant the organization sink's writer identity the Logs Writer role and the BigQuery Data Editor role in the project `sec-logging`.
    - id: e
      text:
        en: |-
          Grant the organization sink's writer identity the BigQuery Job User role and the BigQuery Data Viewer role in the project `sec-logging`.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      An aggregated sink at the organization level with `--include-children` routes the matching logs of every child folder and project, including future ones. Without `--intercept-children` it is non-intercepting, so the logs still reach the projects' own sinks. Its writer identity must then be authorized in the destination project: Logs Writer, which the documentation asks for every destination, and BigQuery Data Editor for a dataset.
  options:
    a:
      en: |-
        Per-project sinks don't cover projects created later and must be managed one by one.
    c:
      en: |-
        An intercepting sink keeps the matching logs from reaching the sinks of the child resources, which breaks the project teams' sinks.
    e:
      en: |-
        BigQuery Data Viewer is read-only and BigQuery Job User only runs jobs, so the sink couldn't create tables or write rows; the documentation also asks for Logs Writer for every destination.
references:
  - title: "Collate and route organization- and folder-level logs to supported destinations | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks
