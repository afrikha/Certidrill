id: gcpace-3b-firestore-backup-schedule
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You must back up the Firestore database `(default)` every day and keep each backup for 14 weeks. The team doesn't want to maintain any scheduler job or script.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud firestore export gs://fs-backups --database='(default)'`, run every day by a Cloud Scheduler job
    - id: b
      text:
        en: |-
          `gcloud firestore backups schedules create --database='(default)' --recurrence=weekly --day-of-week=MON --retention=14w`
    - id: c
      text:
        en: |-
          `gcloud firestore databases update --database='(default)' --enable-pitr`
    - id: d
      text:
        en: |-
          `gcloud firestore backups schedules create --database='(default)' --recurrence=daily --retention=14w`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A Firestore backup schedule creates backups automatically, daily or weekly, and keeps each one for the retention that you set, up to 14 weeks. A database can have one daily and one weekly schedule, and a restore always writes the backup to a new database.
  options:
    a:
      en: |-
        Scheduled exports need a Cloud Scheduler job to maintain, which the team wants to avoid.
    b:
      en: |-
        A weekly schedule creates one backup per week, not one every day.
    c:
      en: |-
        Point-in-time recovery keeps versions for a short window, not daily backups retained for 14 weeks.
references:
  - title: "Back up and restore data | Firestore in Native mode | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firestore/native/docs/backups
