id: gcpace-3a-k8s-statefulset-scale-down
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A StatefulSet named ledger runs three Pods (ledger-0, ledger-1 and ledger-2) in a GKE cluster. Each Pod has a PersistentVolumeClaim from the volume claim template data. The StatefulSet uses the default Pod management and PersistentVolumeClaim retention policies. You run `kubectl scale statefulset ledger --replicas=2`.

    What is the result?
body:
  options:
    - id: a
      text:
        en: |-
          ledger-2 is deleted, and its claim data-ledger-2 is kept, so ledger-2 gets the same data if you scale back to 3.
    - id: b
      text:
        en: |-
          ledger-0 is deleted first, and its claim data-ledger-0 is deleted with it.
    - id: c
      text:
        en: |-
          ledger-2 is deleted, and its claim data-ledger-2 is deleted with it, so the disk is released.
    - id: d
      text:
        en: |-
          A random Pod is deleted, and the remaining Pods are renamed so that their ordinals stay contiguous.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With the default OrderedReady policy, a StatefulSet removes Pods in reverse ordinal order, so ledger-2 goes first. The default retention policy is Retain for scale-down, so the claim data-ledger-2 and its disk remain and are bound again to ledger-2 when you scale back up.
  options:
    b:
      en: |-
        Scale-down starts with the highest ordinal, not ledger-0, and claims are kept by default.
    c:
      en: |-
        The claim would only be deleted if the policy set whenScaled to Delete; the default is Retain.
    d:
      en: |-
        StatefulSet Pods keep their names; scale-down removes the highest ordinal and never renames the others.
references:
  - title: "About StatefulSets in GKE | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/statefulset
