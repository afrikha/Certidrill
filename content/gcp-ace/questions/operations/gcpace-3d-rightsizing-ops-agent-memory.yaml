id: gcpace-3d-rightsizing-ops-agent-memory
objective: "3.4.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company reviews the machine type recommendations of its Compute Engine VMs before resizing them. The application team says that the recommended memory sizes don't reflect how much memory the application really uses inside the guest operating system. No agent is installed on the VMs. You want the recommendations to be based on more precise CPU and memory data.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Install the Ops Agent on the VMs, so that the recommender uses the CPU and memory metrics that it collects.
    - id: b
      text:
        en: |-
          Change the VMs to custom machine types, so that the recommender evaluates memory separately from vCPUs.
    - id: c
      text:
        en: |-
          Mark the current recommendations as claimed, so that the recommender generates new recommendations from fresh data.
    - id: d
      text:
        en: |-
          Enable VM Manager OS inventory on the VMs, so that the recommender reads the memory reported by the guest.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Machine type recommendations are based on the last 8 days of Cloud Monitoring data. The Ops Agent is optional, but when it is installed and running, the recommender automatically uses its CPU and memory metrics, which come from inside the guest, for more precise recommendations.
  options:
    b:
      en: |-
        The machine type of the VM doesn't change the data that the recommender analyzes, so the memory data stays as imprecise.
    c:
      en: |-
        Marking a recommendation as claimed only records that someone is working on it; it doesn't change the data that the recommendations use.
    d:
      en: |-
        OS inventory reports the installed packages and operating system details, not memory utilization over time, and the recommender doesn't use it.
references:
  - title: "Apply machine type recommendations to VM instances | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/apply-machine-type-recommendations-for-instances
