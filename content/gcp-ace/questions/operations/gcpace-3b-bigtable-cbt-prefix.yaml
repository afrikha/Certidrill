id: gcpace-3b-bigtable-cbt-prefix
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IoT company stores sensor readings in the Bigtable table `readings`, with row keys such as `device#4711#20261127T0930`. An operator must display the first 20 rows of device 4711 from the command line. The `~/.cbtrc` file already sets the project and the instance.

    Which command should the operator run?
body:
  options:
    - id: a
      text:
        en: |-
          `cbt lookup readings device#4711`
    - id: b
      text:
        en: |-
          `cbt count readings prefix=device#4711`
    - id: c
      text:
        en: |-
          `cbt read readings prefix=device#4711 count=20`
    - id: d
      text:
        en: |-
          `cbt read readings regex=device#4711.*`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `cbt read` reads rows of a table, and its `prefix` argument limits the scan to row keys that start with the given value, while `count` caps the number of rows returned. Because the row keys start with the device ID, the prefix reads only that device's rows.
  options:
    a:
      en: |-
        `cbt lookup` reads one row whose key matches exactly; no row has the key `device#4711` alone.
    b:
      en: |-
        `cbt count` returns the number of matching rows, not their contents.
    d:
      en: |-
        A regular expression without `start`, `end`, `prefix`, or `count` scans the whole table and returns every matching row instead of 20.
references:
  - title: "cbt CLI reference | Bigtable | Google Cloud Documentation"
    url: https://docs.cloud.google.com/bigtable/docs/cbt-reference
