id: gcpace-3d-query-insights-tags
objective: "3.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online shop runs a Cloud SQL for PostgreSQL Enterprise edition instance named `orders-db`. The CPU of the instance is often saturated. The application already adds sqlcommenter comments that tag each query with the controller and route that sent it. You need to see which normalized queries, and which application routes, generate the most database load.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud sql instances patch orders-db --insights-config-query-insights-enabled --insights-config-record-application-tags`
    - id: b
      text:
        en: |-
          `gcloud sql instances patch orders-db --insights-config-query-insights-enabled --insights-config-record-client-address`
    - id: c
      text:
        en: |-
          `gcloud sql instances patch orders-db --database-flags=log_min_duration_statement=1000`
    - id: d
      text:
        en: |-
          `gcloud sql instances patch orders-db --insights-config-query-plans-per-minute=20`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Query Insights shows the database load and ranks normalized queries by total execution time. Recording application tags, which requires queries commented with sqlcommenter, adds the load breakdown by tag, so you can see which routes and controllers cause the load.
  options:
    b:
      en: |-
        This enables Query Insights but records client IP addresses instead of application tags, so the load can't be broken down by route.
    c:
      en: |-
        This flag writes slow statements to the PostgreSQL logs, without aggregating load by normalized query or by application tag.
    d:
      en: |-
        This only changes the query plan sampling rate; it doesn't enable Query Insights or record application tags.
references:
  - title: "Use query insights to improve query performance | Cloud SQL for PostgreSQL | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sql/docs/postgres/using-query-insights
