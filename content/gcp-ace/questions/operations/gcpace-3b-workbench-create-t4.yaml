id: gcpace-3b-workbench-create-t4
objective: "3.1.15"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You must create an Agent Platform Workbench instance named `cv-train` in zone `us-central1-b`, with the `n1-standard-8` machine type and one NVIDIA T4 GPU. The NVIDIA driver must be installed for the data scientists, and you use the gcloud CLI.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute instances create cv-train --zone=us-central1-b --machine-type=n1-standard-8 --accelerator=type=nvidia-tesla-t4,count=1 --maintenance-policy=TERMINATE`
    - id: b
      text:
        en: |-
          `gcloud workbench instances create cv-train --location=us-central1-b --machine-type=n1-standard-8 --accelerator-type=NVIDIA_TESLA_T4 --accelerator-core-count=1`
    - id: c
      text:
        en: |-
          `gcloud workbench instances create cv-train --location=us-central1-b --machine-type=n1-standard-8 --accelerator-type=NVIDIA_TESLA_T4 --accelerator-core-count=1 --install-gpu-driver`
    - id: d
      text:
        en: |-
          `gcloud workbench instances create cv-train --location=us-central1-b --machine-type=n1-standard-8 --accelerator-type=NVIDIA_L4 --accelerator-core-count=1 --install-gpu-driver`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud workbench instances create` sets the GPU with `--accelerator-type` and `--accelerator-core-count`, and `--install-gpu-driver` authorizes Google Cloud to install the GPU driver on the instance. The T4 is an N1-compatible GPU, so it matches the `n1-standard-8` machine type.
  options:
    a:
      en: |-
        This creates a plain Compute Engine VM, not a Workbench instance with JupyterLab and the Workbench features.
    b:
      en: |-
        Without `--install-gpu-driver`, the GPU driver isn't installed, so the data scientists can't use the T4.
    d:
      en: |-
        L4 GPUs come with G2 machine types; they can't be attached to an N1 machine type, and the requirement is a T4.
references:
  - title: "Create a Agent Platform Workbench instance | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/notebooks/workbench/instances/create
  - title: "gcloud workbench instances update | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/workbench/instances/update
