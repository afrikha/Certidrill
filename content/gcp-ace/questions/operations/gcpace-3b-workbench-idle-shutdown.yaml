id: gcpace-3b-workbench-idle-shutdown
objective: "3.1.15"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Data scientists at a pharmaceutical company often leave their Agent Platform Workbench instances running overnight with no notebook activity. You must make the instance `ds-lab-1` in `us-central1-a` shut down automatically after 60 minutes without kernel activity, with the least effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Cloud Scheduler job that calls the Notebooks API every evening at 20:00 to stop the instance `ds-lab-1`.
    - id: b
      text:
        en: |-
          Run `gcloud workbench instances update ds-lab-1 --location=us-central1-a --metadata=idle-timeout-seconds=3600`.
    - id: c
      text:
        en: |-
          Run `gcloud workbench instances update ds-lab-1 --location=us-central1-a --machine-type=e2-standard-2`.
    - id: d
      text:
        en: |-
          Run `gcloud workbench instances update ds-lab-1 --location=us-central1-a --labels=idle-timeout=60`.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Workbench instances have an idle shutdown feature controlled by the `idle-timeout-seconds` metadata key; 3600 seconds stops the instance after an hour without kernel activity, such as running cells. It's built in, so nothing else needs to be scheduled or maintained.
  options:
    a:
      en: |-
        A scheduled job adds a component to maintain and stops the instance at a fixed time, even while someone is still working, instead of after 60 idle minutes.
    c:
      en: |-
        A smaller machine type lowers the hourly cost, but the instance still runs all night.
    d:
      en: |-
        Labels only annotate the instance for filtering and billing; they don't configure idle shutdown.
references:
  - title: "Idle shutdown | Gemini Enterprise Agent Platform | Google Cloud Documentation"
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/notebooks/workbench/instances/idle-shutdown
  - title: "gcloud workbench instances update | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/workbench/instances/update
