id: gcpace-3a-ssh-internal-ip-vpn
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company connects its on-premises network 10.20.0.0/16 to a VPC network through HA VPN. A VM named batch-7 has both an internal and an external IP address. The only SSH firewall rule allows TCP 22 from 10.20.0.0/16. From an on-premises workstation, `gcloud compute ssh batch-7 --zone=us-central1-a` times out. The security team doesn't allow SSH from any other source range.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud compute ssh batch-7 --zone=us-central1-a --tunnel-through-iap` from the workstation.
    - id: b
      text:
        en: |-
          Run `gcloud compute ssh batch-7 --zone=us-central1-a --strict-host-key-checking=no` from the workstation.
    - id: c
      text:
        en: |-
          Run `gcloud compute ssh batch-7 --zone=us-central1-a --internal-ip` from the workstation.
    - id: d
      text:
        en: |-
          Run `gcloud compute ssh batch-7 --zone=us-central1-a --dry-run` from the workstation.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When a VM has an external IP address, `gcloud compute ssh` connects to that address by default, so the traffic reaches the VM from a public source that the firewall rule doesn't allow. `--internal-ip` makes gcloud connect to the internal address over the VPN, which matches the 10.20.0.0/16 rule.
  options:
    a:
      en: |-
        IAP connections arrive from 35.235.240.0/20, which the firewall doesn't allow, and the security team forbids adding that source range.
    b:
      en: |-
        Host key checking affects how the client trusts the server key; it doesn't change the address used, so the connection still times out.
    d:
      en: |-
        `--dry-run` only prints the SSH command that gcloud would run; it doesn't open a connection.
references:
  - title: "gcloud compute ssh | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/compute/ssh
