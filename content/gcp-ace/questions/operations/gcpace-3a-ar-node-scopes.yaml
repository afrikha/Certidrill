id: gcpace-3a-ar-node-scopes
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A node pool named batch-pool was created with the Compute Engine default service account and `--scopes=logging-write,monitoring`. The service account has the Artifact Registry Reader role on the project's Docker repository. Pods scheduled on batch-pool fail to pull images from that repository with a 401 Unauthorized error, while Pods on other node pools of the cluster pull the same images.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the Artifact Registry Reader role to the service account again, directly on the repository instead of the project.
    - id: b
      text:
        en: |-
          Run `gcloud container node-pools update batch-pool --workload-metadata=GKE_METADATA`, and bind the Pods' Kubernetes service account to a reader service account.
    - id: c
      text:
        en: |-
          Run `gcloud container clusters upgrade` for batch-pool so that its nodes are recreated with the latest node image.
    - id: d
      text:
        en: |-
          Create a node pool with `--scopes=gke-default`, move the workloads to it, and then delete batch-pool.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Even with the right IAM role, a node can only pull from a private repository if its access scopes include devstorage.read_only or cloud-platform, and batch-pool has neither. Access scopes can't be changed on existing nodes, so you create a pool with the gke-default scopes, which include read-only storage, and migrate the workloads.
  options:
    a:
      en: |-
        The role is already granted, and other pools pull the same images; the missing piece is the access scope of these nodes.
    b:
      en: |-
        Kubelet image pulls use the node's service account and scopes, not Workload Identity Federation for GKE, so this doesn't fix the pulls.
    c:
      en: |-
        Upgraded or recreated nodes keep the node pool's configuration, including its access scopes.
references:
  - title: "Troubleshoot image pulls | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/troubleshooting/image-pulls
  - title: "Access control with IAM | Artifact Registry | Google Cloud Documentation"
    url: https://docs.cloud.google.com/artifact-registry/docs/access-control
