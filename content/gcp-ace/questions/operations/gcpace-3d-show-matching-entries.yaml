id: gcpace-3d-show-matching-entries
objective: "3.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the Logs Explorer, you expand an error entry from a VM and see that its `jsonPayload.jobId` field has the value `exp-7781`. You need to display every entry in the current time range that has the same `jobId` value, with as few steps as possible.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Click the `exp-7781` value in the expanded entry, and select **Show matching entries**.
    - id: b
      text:
        en: |-
          Click the `exp-7781` value in the expanded entry, and select **Pin to Fields pane**.
    - id: c
      text:
        en: |-
          Expand the entry, select **Copy**, and copy a link to the entry.
    - id: d
      text:
        en: |-
          Click the `insertId` value of the entry, and select **Show matching entries**.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Clicking a field value in an expanded entry and selecting **Show matching entries** adds that field and value to the query, and the Logs Explorer reloads the results with every matching entry.
  options:
    b:
      en: |-
        Pinning a field adds it to the Fields pane for later filtering; it doesn't change the query or the results by itself.
    c:
      en: |-
        A copied link opens the Logs Explorer with this one entry pinned; it doesn't list the other entries of the job.
    d:
      en: |-
        `insertId` identifies this individual entry, so matching on it returns only this entry, not the other entries of the job.
references:
  - title: "View and analyze log entries | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/view/logs-explorer-interface
