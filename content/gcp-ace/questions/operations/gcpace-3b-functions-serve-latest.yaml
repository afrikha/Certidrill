id: gcpace-3b-functions-serve-latest
objective: "3.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company has the HTTP function `label-print`, a Cloud Run function that the team deploys with `gcloud functions deploy`. Last week, an engineer split its traffic 80/20 between two revisions with `gcloud run services update-traffic` to test a change. You are now deploying the final version with `gcloud functions deploy`, and the new revision must receive all the traffic as soon as this deployment command completes, without a second command.

    Which flag should you add to the deployment command?
body:
  options:
    - id: a
      text:
        en: |-
          `--gen2`
    - id: b
      text:
        en: |-
          `--ingress-settings=all`
    - id: c
      text:
        en: |-
          `--serve-all-traffic-latest-revision`
    - id: d
      text:
        en: |-
          `--runtime-update-policy=automatic`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Cloud Run function is a Cloud Run service, so its revisions keep the traffic split that was set with `gcloud run services update-traffic`, and a new revision would get no traffic. The `gcloud functions deploy` flag `--serve-all-traffic-latest-revision` makes the latest revision serve all the traffic as part of the deployment.
  options:
    a:
      en: |-
        `--gen2` selects the current generation of functions; it doesn't change how traffic is split between revisions.
    b:
      en: |-
        Ingress settings control which network sources can reach the function, not which revision serves the requests.
    d:
      en: |-
        The runtime update policy controls how the language runtime receives security updates, not traffic routing.
references:
  - title: "gcloud functions deploy | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/functions/deploy
  - title: "Rollbacks, gradual rollouts, and traffic migration | Cloud Run | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
