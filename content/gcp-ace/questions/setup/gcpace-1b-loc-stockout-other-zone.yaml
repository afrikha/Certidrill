id: gcpace-1b-loc-stockout-other-zone
objective: "1.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research lab creates a GPU VM in zone us-central1-a, and the request fails with the error ZONE_RESOURCE_POOL_EXHAUSTED. The Quotas & System Limits page shows that the project's GPU and CPU quotas in us-central1 still have room. The job can run in any zone of us-central1, and it must start today.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Request a higher GPU quota for us-central1, and create the VM again in us-central1-a once the request is approved.
    - id: b
      text:
        en: |-
          Stop other VMs of the project that run in us-central1-a, and create the VM again in that zone.
    - id: c
      text:
        en: |-
          Create the VM in another zone of us-central1 that offers the GPU type and has capacity.
    - id: d
      text:
        en: |-
          Enable the quota adjuster for the project, and create the VM again in us-central1-a after the next adjustment.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      ZONE_RESOURCE_POOL_EXHAUSTED is a resource availability error: the zone lacks physical capacity, and available quota doesn't guarantee capacity. Trying another zone or region that offers the resource, for example one listed in the error details, is the documented first action.
  options:
    a:
      en: |-
        The error isn't a quota error, so more quota doesn't add hardware to the zone.
    b:
      en: |-
        Google advises against stopping or deleting instances to free resources without a reservation, because the zone might lack capacity to restart them, and freed capacity isn't guaranteed to go to your request.
    d:
      en: |-
        The quota adjuster raises quotas; it can't fix a shortage of capacity in a zone.
references:
  - title: "Troubleshoot resource availability errors | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/troubleshooting/troubleshooting-resource-availability
