id: gcpace-1b-standalone-add-owner
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The founder of a startup is the only Organization Owner of its standalone organization. For continuity, the CTO's Google Account must also become an Organization Owner, so that either of them can manage owners and the lifecycle of the organization.

    What should the founder do?
body:
  options:
    - id: a
      text:
        en: |-
          On the IAM page of the organization, grant the CTO's account the Organization Administrator role.
    - id: b
      text:
        en: |-
          On the IAM page of the organization, grant the CTO's account the Organization Owner role (`roles/cloudowner.admin`).
    - id: c
      text:
        en: |-
          Run `gcloud organizations add-iam-policy-binding` to grant the CTO's account the legacy basic Owner role (`roles/owner`).
    - id: d
      text:
        en: |-
          On the Organization details page, add the CTO's email address as an Organization Owner, and have the CTO accept the invitation.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Owners of a standalone organization are managed from the Organization details page: an existing owner clicks Add organization Owner and enters the principal's email address. The invitee must accept the invitation within 30 days to become an Organization Owner.
  options:
    a:
      en: |-
        Organization Administrator manages IAM policies, but it doesn't make the CTO an owner who controls owners and the organization lifecycle.
    b:
      en: |-
        The Organization Owner role is managed outside IAM, so it isn't granted from the IAM page.
    c:
      en: |-
        The legacy basic Owner role grants permissions on resources; it isn't the Organization Owner role of a standalone organization.
references:
  - title: "Set up standalone organizations | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/standalone-organization-overview
