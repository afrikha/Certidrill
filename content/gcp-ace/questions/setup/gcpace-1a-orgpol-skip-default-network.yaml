id: gcpace-1a-orgpol-skip-default-network
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The network team of a software company designs every VPC network itself. It wants new projects in the organization to be created without the default VPC network and its related resources, so that nobody deploys workloads into it by accident.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Set a policy on the `compute.restrictVpcPeering` constraint at the organization that denies all peering." }
    - id: b
      text: { en: "Enforce the `compute.skipDefaultNetworkCreation` boolean constraint at the organization." }
    - id: c
      text: { en: "Set a policy on the `compute.vmExternalIpAccess` constraint at the organization that denies all values." }
    - id: d
      text: { en: "Set a policy on the `gcp.restrictServiceUsage` constraint at the organization that denies `compute.googleapis.com`." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When `compute.skipDefaultNetworkCreation` is enforced, Google Cloud skips creating the default network and its related resources when a project is created. Enforcing it at the organization applies it to all new projects, and the network team can then create its own VPC networks.
  options:
    a: { en: "This constraint restricts VPC Network Peering; the default network is still created in each new project." }
    c: { en: "This constraint only stops VMs from using external IPv4 addresses; the default network is still created." }
    d: { en: "Denying Compute Engine blocks the service entirely, including the custom VPC networks the team needs." }
references:
  - title: "Organization policy constraints | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
