id: gcpace-1a-iam-instance-admin-role
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team must create, start, stop, and resize Compute Engine VMs, and manage their disks and snapshots, in the project `render-farm`. The network team owns the VPC networks and firewall rules of the project, and the operations team must not be able to change them. The operations team already has the Service Account User role on the service account that the VMs use.

    Which predefined role should you grant to the operations team on the project?
body:
  options:
    - id: a
      text: { en: "Compute Admin (`roles/compute.admin`)" }
    - id: b
      text: { en: "Compute Instance Admin (v1) (`roles/compute.instanceAdmin.v1`)" }
    - id: c
      text: { en: "Compute Network Admin (`roles/compute.networkAdmin`)" }
    - id: d
      text: { en: "Writer (`roles/writer`)" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Compute Instance Admin (v1) gives full control of instances, instance groups, disks, snapshots, and images, with only read and use access to networks and firewall rules. The team can manage its VMs without being able to create or change networks or firewall rules.
  options:
    a: { en: "Compute Admin gives full control of all Compute Engine resources, including networks and firewall rules." }
    c: { en: "Compute Network Admin manages networking resources, not VM instances, so the team couldn't create or resize VMs." }
    d: { en: "The Writer basic role allows creating, modifying, and deleting resources of most services, including networks and firewall rules." }
references:
  - title: "Compute Engine IAM roles and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/access/iam
