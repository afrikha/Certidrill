id: gcpace-1a-dynamic-group-premium
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research institute uses Cloud Identity Free and stores each user's department in the user profile. It wants a group whose membership automatically includes every user whose department is `genomics`, so that IAM roles granted to the group follow staff changes without manual updates.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create the group with `gcloud identity groups create` and the `--dynamic-user-query` flag in the current Cloud Identity Free account." }
    - id: b
      text: { en: "Create an organizational unit named Genomics in the Google Admin console and grant the IAM roles to that organizational unit." }
    - id: c
      text: { en: "Grant the IAM roles to the `domain:` principal of the institute's domain, with an IAM condition on the department attribute." }
    - id: d
      text: { en: "Upgrade the account to Cloud Identity Premium, and then create a dynamic group whose query matches the genomics department." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A dynamic group gets its members from a query on user attributes, such as `user.organizations.exists(org, org.department=='genomics')`, so membership follows profile changes. Dynamic groups require Cloud Identity Premium or an eligible Google Workspace Enterprise edition, so the institute must upgrade first.
  options:
    a: { en: "The flag exists, but dynamic groups aren't available in Cloud Identity Free, so the group can't be created in the current account." }
    b: { en: "Organizational units organize users for Admin console settings; they can't be principals in IAM allow policies." }
    c: { en: "IAM conditions can't evaluate a user's department, and the `domain:` principal would include every user of the domain." }
references:
  - title: "Creating and updating a dynamic group | Cloud Identity | Google Cloud Documentation"
    url: https://docs.cloud.google.com/identity/docs/how-to/create-dynamic-groups
