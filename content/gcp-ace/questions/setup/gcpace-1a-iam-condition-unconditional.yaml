id: gcpace-1a-iam-condition-unconditional
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    In the project `media-assets`, the user `kim@vantor.example` has the Storage Object Viewer role granted on the project without a condition. To limit Kim to the bucket `promo-assets`, an administrator added a second binding of the same role for Kim on the project, with the condition `resource.name.startsWith("projects/_/buckets/promo-assets")`. No other bucket name starts with `promo-assets`, and Kim has no other roles, directly or through groups. A day later, Kim can still read objects in every bucket of the project.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A conditional binding doesn't override an unconditional binding of the same role, so the unconditional grant still applies to every bucket." }
    - id: b
      text: { en: "If the administrator removes the unconditional binding, Kim keeps read access only to objects in the `promo-assets` bucket." }
    - id: c
      text: { en: "Conditional bindings are evaluated before unconditional ones, so the condition is only waiting for the policy change to propagate." }
    - id: d
      text: { en: "A condition in a project-level binding is ignored for Cloud Storage unless every bucket of the project uses uniform bucket-level access." }
    - id: e
      text: { en: "The condition has no effect because the Storage Object Viewer role can't be granted with a condition on a project." }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      When a principal already has a role without a condition, a conditional binding for the same role adds nothing: the unconditional grant gives access to every bucket. Once the unconditional binding is removed, only the conditional binding remains, and it grants the role on resources whose name starts with the `promo-assets` bucket's name.
  options:
    c: { en: "IAM doesn't rank bindings this way, and IAM changes usually take effect within minutes, not a day." }
    d: { en: "Uniform bucket-level access is required for conditions in a bucket's own allow policy; a conditional grant on the project is inherited by the buckets." }
    e: { en: "Predefined roles such as Storage Object Viewer support conditions; only the legacy basic roles don't." }
references:
  - title: "Overview of IAM Conditions | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/conditions-overview
