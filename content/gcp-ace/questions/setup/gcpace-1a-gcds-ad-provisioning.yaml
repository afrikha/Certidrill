id: gcpace-1a-gcds-ad-provisioning
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company manages 3,000 employees and 200 groups in an on-premises Active Directory. It wants these users and groups to be created and kept up to date automatically in its Cloud Identity account, so that it can grant IAM roles to the groups. Active Directory must remain the source of truth.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Export the users and groups to CSV files every week and upload the files in the Google Admin console." }
    - id: b
      text: { en: "Deploy Managed Service for Microsoft Active Directory and create a trust with the on-premises domain." }
    - id: c
      text: { en: "Configure Identity-Aware Proxy to authenticate the users against the on-premises Active Directory." }
    - id: d
      text: { en: "Install Google Cloud Directory Sync on a server that can reach Active Directory, and schedule regular syncs." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Google Cloud Directory Sync (GCDS) reads users and groups from an LDAP directory such as Active Directory and provisions them into Cloud Identity or Google Workspace. Running it on a schedule keeps Cloud Identity aligned with Active Directory, which stays the source of truth.
  options:
    a: { en: "A weekly manual export and upload isn't automatic and leaves Cloud Identity out of date between uploads." }
    b: { en: "Managed Microsoft AD provides domain services for workloads in Google Cloud; it doesn't create users or groups in Cloud Identity." }
    c: { en: "Identity-Aware Proxy controls access to applications for identities that already exist; it doesn't provision accounts or groups." }
references:
  - title: "Active Directory user account provisioning | Cloud Architecture Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/architecture/identity/federating-gcp-with-active-directory-synchronizing-user-accounts
