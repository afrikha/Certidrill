id: gcpace-1c-close-billing-account
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company used a dedicated self-serve Cloud Billing account for a two-week hackathon. All the hackathon projects have since been linked to the company's main billing account. The finance team wants to make sure that the dedicated account can no longer incur charges on its credit card.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Remove every principal from the IAM policy of the dedicated billing account.
    - id: b
      text:
        en: |-
          Create a budget of 0 USD on the dedicated billing account with a 100% threshold.
    - id: c
      text:
        en: |-
          Close the dedicated billing account from its Account management page.
    - id: d
      text:
        en: |-
          Remove the Billing Account Creator role from the hackathon organizers.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Closing a billing account stops billable services in any project still linked to it, so the account can't incur new charges. Billing accounts can't be deleted manually; a closed account is kept for reporting and auditing and can be reopened later if needed.
  options:
    a:
      en: |-
        An account with no active administrator becomes orphaned: it is not closed automatically, and charges continue on its payment method.
    b:
      en: |-
        An alerts-only budget sends notifications but doesn't cap usage or spending.
    d:
      en: |-
        Billing Account Creator only controls the creation of new billing accounts; the dedicated account would stay active.
references:
  - title: "Manage your Cloud Billing account | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/manage-billing-account
