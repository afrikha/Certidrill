id: gcpace-1a-api-disable-effects
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data team no longer queries BigQuery in the project `legacy-marts`, but its datasets are still there. Other enabled services in the project depend on the BigQuery API. To cut costs, a team member proposes to run `gcloud services disable bigquery.googleapis.com --force --project=legacy-marts`.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The `--force` flag also disables the enabled services that depend on the BigQuery API." }
    - id: b
      text: { en: "Disabling the API deletes the datasets, which stops the storage charges of the project." }
    - id: c
      text: { en: "Disabling the API cancels the pending charges for usage that happened before it was disabled." }
    - id: d
      text: { en: "The datasets remain and their storage is still billed, so they must be deleted to stop those charges." }
    - id: e
      text: { en: "Without `--force`, the command disables only the BigQuery API and leaves the dependent services enabled." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      With `--force`, `gcloud services disable` proceeds even though enabled services depend on the target, and it disables those dependent services too. For data-storage services such as BigQuery, disabling the API doesn't delete data, so storage keeps being billed until the datasets are deleted.
  options:
    b: { en: "Disabling a storage service's API doesn't delete its data; the datasets stay and keep generating storage charges." }
    c: { en: "Pending fees and billable usage incurred before the API was disabled are still charged." }
    e: { en: "Without `--force`, disabling a service that enabled services depend on fails with an error instead of leaving the dependents enabled." }
references:
  - title: "Enable and disable services | Service Usage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-usage/docs/enable-disable
  - title: "gcloud services disable | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/services/disable
