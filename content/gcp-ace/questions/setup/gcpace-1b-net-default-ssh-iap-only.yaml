id: gcpace-1b-net-default-ssh-iap-only
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A new project uses the default network with its pre-populated firewall rules. Security requires that SSH connections from outside the VPC network come only from IAP TCP forwarding, whose source range is 35.235.240.0/20. Traffic between the VMs inside the network and all other traffic must not change.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create an ingress rule that allows TCP 22 from 35.235.240.0/20 at priority 1000, and delete the `default-allow-ssh` rule.
    - id: b
      text:
        en: |-
          Create an ingress rule that allows TCP 22 from 35.235.240.0/20 at priority 1000, and keep the `default-allow-ssh` rule.
    - id: c
      text:
        en: |-
          Create an ingress rule that denies TCP 22 from 0.0.0.0/0 at priority 900, and one that allows TCP 22 from 35.235.240.0/20 at priority 1000.
    - id: d
      text:
        en: |-
          Create an ingress rule that denies TCP 22 from 0.0.0.0/0 at priority 65535, and one that allows TCP 22 from 35.235.240.0/20 at priority 1000.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `default-allow-ssh` allows TCP 22 from any source at priority 65534, so it must go. A new rule that allows TCP 22 from the IAP range then lets IAP TCP forwarding through, while `default-allow-internal` keeps allowing traffic between VMs and the implied deny ingress rule blocks SSH from any other external source.
  options:
    b:
      en: |-
        `default-allow-ssh` keeps allowing SSH from the whole internet, so the new rule adds nothing restrictive.
    c:
      en: |-
        The lower number wins: the deny rule at priority 900 is evaluated before the allow rule at 1000 and also blocks the IAP range and the SSH traffic between VMs.
    d:
      en: |-
        A deny rule at priority 65535 is evaluated after `default-allow-ssh` at 65534, so SSH from the internet stays allowed.
references:
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
  - title: "Use IAP for TCP forwarding | Identity-Aware Proxy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding
