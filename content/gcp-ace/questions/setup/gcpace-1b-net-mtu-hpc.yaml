id: gcpace-1b-net-mtu-hpc
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research institute is setting up a dedicated VPC network named hpc-net for tightly coupled simulation VMs. To reduce packet overhead, the VMs must be able to send the largest IP packets that a VPC network supports. The network must not create any subnet automatically.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute networks create hpc-net --subnet-mode=custom`
    - id: b
      text:
        en: |-
          `gcloud compute networks create hpc-net --subnet-mode=custom --mtu=1500`
    - id: c
      text:
        en: |-
          `gcloud compute networks create hpc-net --subnet-mode=custom --mtu=9000`
    - id: d
      text:
        en: |-
          `gcloud compute networks create hpc-net --subnet-mode=custom --mtu=8896`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The MTU of a VPC network can be set from 1300 to 8896 bytes, and 8896 is the largest value. The `--subnet-mode=custom` flag prevents automatic subnets, and the MTU is advertised to the VMs of the network through DHCP.
  options:
    a:
      en: |-
        Without `--mtu`, the network uses the default MTU of 1460 bytes, not the largest supported value.
    b:
      en: |-
        1500 bytes is a valid MTU but far below the 8896-byte maximum.
    c:
      en: |-
        9000 bytes is above the maximum MTU of a VPC network, so the value is rejected.
references:
  - title: "Quickstart: Create and manage VPC networks | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/create-modify-vpc-networks
