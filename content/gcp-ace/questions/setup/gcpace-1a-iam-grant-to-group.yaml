id: gcpace-1a-iam-grant-to-group
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A finance team of 25 analysts needs the BigQuery Data Viewer role in the project `fin-reporting`. Analysts join and leave the team every month, and the cloud team doesn't want to edit the project's allow policy each time. All the analysts belong to the Cloud Identity group `fin-analysts@larkspur.example`, which HR keeps up to date.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Grant the role to each analyst's user account on the project, and remove the grant when an analyst leaves the team." }
    - id: b
      text: { en: "Create a service account that has the role on the project, and share a key for that service account with the analysts." }
    - id: c
      text: { en: "Grant the role on the project to `group:fin-analysts@larkspur.example`, and let team changes happen through group membership." }
    - id: d
      text: { en: "Grant the role on the project to `domain:larkspur.example`, so that every analyst receives it without any further change." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Granting a role to a Google group is simpler than granting it to individual users: members can be added or removed in Cloud Identity without changing the allow policy. A single `gcloud projects add-iam-policy-binding fin-reporting --member=group:fin-analysts@larkspur.example --role=roles/bigquery.dataViewer` covers the whole team.
  options:
    a: { en: "Individual grants require an allow policy change every time the team changes, which the cloud team wants to avoid." }
    b: { en: "Sharing a service account key spreads a long-lived credential and loses the link between actions and individual users." }
    d: { en: "The `domain:` principal includes every account of the domain, not just the analysts, which grants far more access than needed." }
references:
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
  - title: "IAM principals | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/principals-overview
