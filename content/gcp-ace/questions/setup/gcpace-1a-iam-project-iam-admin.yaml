id: gcpace-1a-iam-project-iam-admin
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The help desk lead of a logistics company must grant and revoke IAM roles on the project `fleet-tracking` when access requests are approved. The lead must not be able to create, change, or delete any other resource in the project.

    Which predefined role should you grant to the lead on the project, following the principle of least privilege?
body:
  options:
    - id: a
      text: { en: "Project IAM Admin (`roles/resourcemanager.projectIamAdmin`)" }
    - id: b
      text: { en: "Writer (`roles/writer`)" }
    - id: c
      text: { en: "Browser (`roles/browser`)" }
    - id: d
      text: { en: "Admin (`roles/admin`)" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Project IAM Admin lets a principal manage the allow policy of a project, which is what granting and revoking roles requires. It doesn't include permissions to create or modify the project's other resources.
  options:
    b: { en: "Writer lets the lead create, modify, and delete most resources but doesn't allow managing roles and permissions on the project." }
    c: { en: "Browser gives read access to the hierarchy and the allow policy; it can't change role grants." }
    d: { en: "The Admin basic role can manage roles, but it also allows creating, changing, and deleting resources, which breaks least privilege." }
references:
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
  - title: "Access control for projects with IAM | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/access-control-proj
