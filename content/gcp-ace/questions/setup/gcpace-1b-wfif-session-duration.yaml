id: gcpace-1b-wfif-session-duration
objective: "1.1.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company is creating the workforce identity pool studio-pool in its organization (ID 830115297461). Video editors work in 8-hour shifts, and their console and gcloud sessions must stay valid for a whole shift. The pool has no other special requirement.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud iam workforce-pools create studio-pool --project=media-ops --location=global --session-duration=28800s`
    - id: b
      text:
        en: |-
          `gcloud iam workforce-pools create studio-pool --organization=830115297461 --location=global --session-duration=86400s`
    - id: c
      text:
        en: |-
          `gcloud iam workforce-pools create studio-pool --organization=830115297461 --location=global`
    - id: d
      text:
        en: |-
          `gcloud iam workforce-pools create studio-pool --organization=830115297461 --location=global --session-duration=28800s`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A workforce pool is created under an organization, so `--organization` is required, and `--location=global` is the pool location. `--session-duration` sets how long access tokens and console and gcloud sign-in sessions are valid; it must be between 15 minutes and 12 hours, so 28800s (8 hours) fits.
  options:
    a:
      en: |-
        Workforce pools belong to an organization, not to a project, and the command requires `--organization`.
    b:
      en: |-
        86400s is 24 hours, above the 12-hour maximum, so the value is rejected.
    c:
      en: |-
        Without `--session-duration`, sessions last the default of one hour, so editors would have to sign in again several times per shift.
references:
  - title: "gcloud iam workforce-pools create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/iam/workforce-pools/create
