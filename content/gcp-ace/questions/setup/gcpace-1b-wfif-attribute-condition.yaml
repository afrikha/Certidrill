id: gcpace-1b-wfif-attribute-condition
objective: "1.1.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company federates its IdP with the workforce identity pool retail-pool through the OIDC provider retail-oidc. The IdP sends a role claim for every user. Only users whose role claim is gcp-users may sign in to Google Cloud, and every other user of the IdP must be rejected at sign-in.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM deny policy on the organization that denies all permissions to every principal of retail-pool whose role isn't gcp-users.
    - id: b
      text:
        en: |-
          Run `gcloud iam workforce-pools providers update-oidc retail-oidc --workforce-pool=retail-pool --location=global --attribute-condition="assertion.role == 'gcp-users'"`.
    - id: c
      text:
        en: |-
          Add `attribute.role=assertion.role` to the attribute mapping of retail-oidc, and grant roles only to the principal set whose role attribute is gcp-users.
    - id: d
      text:
        en: |-
          Grant IAM roles only to the principal set of retail-pool whose role attribute is gcp-users, and leave the provider unchanged.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An attribute condition is a CEL expression, set on the provider, that Google Cloud evaluates on the IdP's assertion; identities that don't satisfy it can't sign in. The condition `assertion.role == 'gcp-users'` lets only users with that role claim through.
  options:
    a:
      en: |-
        A deny policy removes permissions after sign-in; the other users can still authenticate to Google Cloud.
    c:
      en: |-
        A custom attribute and role grants control what users can do, but users without the gcp-users role can still sign in.
    d:
      en: |-
        Without a mapped role attribute, this principal set matches nobody, and the provider still accepts every user at sign-in.
references:
  - title: "Manage workforce identity pool providers | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/manage-workforce-identity-pools-providers
  - title: "Workforce Identity Federation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workforce-identity-federation
