id: gcpace-1a-iam-browser-role
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An external compliance reviewer must confirm, for the project `pay-gateway`, which folder and organization the project belongs to and which principals hold roles on it. The reviewer must not be able to see the resources inside the project, such as VMs, buckets, or databases.

    Which role should you grant to the reviewer on the project?
body:
  options:
    - id: a
      text: { en: "Viewer (`roles/viewer`)" }
    - id: b
      text: { en: "Reader (`roles/reader`)" }
    - id: c
      text: { en: "Browser (`roles/browser`)" }
    - id: d
      text: { en: "Project IAM Admin (`roles/resourcemanager.projectIamAdmin`)" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Browser gives read access to browse the hierarchy of a project, including its folder, its organization, and its allow policy. It doesn't include permission to view the resources in the project, which matches the reviewer's needs.
  options:
    a: { en: "Viewer is a legacy basic role with read access to the resources of most services, including VMs, buckets, and databases." }
    b: { en: "Reader is a basic role with read access to the resources of most services, which the reviewer must not have." }
    d: { en: "Project IAM Admin lets the reviewer change the project's allow policy, which goes beyond a read-only review." }
references:
  - title: "Access control for projects with IAM | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/access-control-proj
