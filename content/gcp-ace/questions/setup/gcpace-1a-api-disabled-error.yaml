id: gcpace-1a-api-disabled-error
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer deploys a new service in the project `ingest-prod` that publishes messages to Pub/Sub. Every publish call fails with an error saying that the Cloud Pub/Sub API has not been used in the project before or that it is disabled. The service's service account already has the Pub/Sub Publisher role on the project.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Grant the Pub/Sub Admin role to the service's service account on the `ingest-prod` project." }
    - id: b
      text: { en: "Run `gcloud services enable pubsub.googleapis.com --project=ingest-prod`." }
    - id: c
      text: { en: "Run `gcloud services list --available --project=ingest-prod --filter=\"name:pubsub\"`." }
    - id: d
      text: { en: "Run `gcloud auth application-default login` on the developer's workstation." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An API must be enabled in a project before resources in that project can call it. Enabling `pubsub.googleapis.com` in `ingest-prod` removes the error; the existing Pub/Sub Publisher role then authorizes the publish calls.
  options:
    a: { en: "The error isn't a permission problem: no role works while the API is disabled, and Pub/Sub Admin would also break least privilege." }
    c: { en: "This command only lists the services that the project can enable; it doesn't enable any of them." }
    d: { en: "This refreshes local Application Default Credentials for the developer; it doesn't change the project's enabled APIs." }
references:
  - title: "Enable and disable services | Service Usage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-usage/docs/enable-disable
  - title: "gcloud services enable | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/services/enable
