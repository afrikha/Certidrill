id: gcpace-1c-export-invoice-net-cost
objective: "1.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Finance asks for the cost of each project on the October 2026 invoice, net of credits, so that the total matches the invoice. You write a query with `bq query` against the standard usage cost export table `gcp_billing_export_v1_01A2B3_C4D5E6_F7A8B9`, grouped by `project.id`.

    Which two query choices should you make? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Filter the rows with `invoice.month = '202610'`.
    - id: b
      text:
        en: |-
          Filter the rows with `usage_start_time` between 1 and 31 October 2026.
    - id: c
      text:
        en: |-
          Keep only the rows where `cost_type = 'regular'`.
    - id: d
      text:
        en: |-
          Sum only the `cost` column, because credits are already deducted from it.
    - id: e
      text:
        en: |-
          Add the credit amounts, read with `UNNEST(credits)`, to the sum of `cost`.
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      `invoice.month` (format YYYYMM) identifies the invoice that includes each line item, so it matches the invoice even when usage is reported late. Credits are a repeated field: you read them with `UNNEST(credits)` and add their amounts to the sum of `cost` to obtain the net cost.
  options:
    b:
      en: |-
        Late-reported usage can move line items to another invoice month, so a filter on timestamps may not match the invoice.
    c:
      en: |-
        `cost_type` also has tax, adjustment and rounding error values, which appear on the invoice; dropping them breaks the match.
    d:
      en: |-
        The `cost` column holds the cost before credits; credits are recorded separately in the `credits` field.
references:
  - title: "Structure of Standard data export | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery-tables/standard-usage
