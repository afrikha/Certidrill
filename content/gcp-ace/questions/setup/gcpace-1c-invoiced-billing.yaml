id: gcpace-1c-invoiced-billing
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company plans a large Google Cloud deployment. Its procurement policy requires every vendor to send a monthly invoice that the company pays by wire transfer. Automatic charges on cards or bank accounts are not allowed.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a self-serve billing account, and add the company's bank account as its primary payment method.
    - id: b
      text:
        en: |-
          Check that the company is eligible for invoiced billing, and have Google set up an invoiced billing account.
    - id: c
      text:
        en: |-
          Create a self-serve billing account, and create a budget that emails the monthly cost to procurement.
    - id: d
      text:
        en: |-
          Create a self-serve billing account, and enable the standard usage cost export to BigQuery.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Invoiced (offline) Cloud Billing accounts are paid by check or wire transfer against invoices sent by mail or email. The company must be eligible for invoiced billing, and Google configures the account; it can't be created as a self-serve account.
  options:
    a:
      en: |-
        A self-serve account charges its payment instrument automatically, including a bank account by direct debit, which the procurement policy forbids.
    c:
      en: |-
        A budget only sends alerts about spend; the self-serve account would still charge its payment method automatically.
    d:
      en: |-
        The export copies cost data for analysis; it doesn't change how the account is invoiced or paid.
references:
  - title: "Cloud Billing overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/concepts
  - title: "Manage your Cloud Billing account | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/manage-billing-account
