id: gcpace-1b-loc-gpu-zones
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A machine learning team wants to run inference VMs with NVIDIA L4 GPUs in Europe. GPUs are available only in specific zones, so before it requests quota, the team needs the list of zones that offer this GPU type.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute regions describe europe-west4`
    - id: b
      text:
        en: |-
          `gcloud compute accelerator-types list --filter="name=nvidia-l4"`
    - id: c
      text:
        en: |-
          `gcloud compute zones list --filter="region:europe-west4"`
    - id: d
      text:
        en: |-
          `gcloud compute instances list --filter="guestAccelerators:nvidia-l4"`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud compute accelerator-types list` returns one entry per accelerator type and zone, so filtering on the GPU type name shows every zone where that GPU is offered. Adding `--format="value(zone)"` keeps only the zone names.
  options:
    a:
      en: |-
        Describing a region shows its quotas, status and zones, but not which accelerator types those zones offer.
    c:
      en: |-
        This lists the zones of a region without telling which of them offer L4 GPUs.
    d:
      en: |-
        This lists existing VMs of the project that already use the GPU, not the zones where the GPU type is available.
references:
  - title: "View available regions and zones | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/regions-zones/viewing-regions-zones
