id: gcpace-1a-obs-metrics-scope-setup
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An operations team wants to chart metrics and define alerting policies for 25 production projects from one place in Cloud Monitoring. Following Google's recommendation, it will host the metrics scope in a dedicated project. You will configure the metrics scope from the console.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a project without workloads, add the 25 projects to its metrics scope, and hold the Monitoring Admin role on it and on each of the 25 projects." }
    - id: b
      text: { en: "Use the production project with the most resources as the scoping project, and hold the Monitoring Viewer role on the 24 other projects." }
    - id: c
      text: { en: "Create a project without workloads, add the 25 projects to its metrics scope, and hold the Monitoring Admin role on the new project only." }
    - id: d
      text: { en: "Create an aggregated sink on the production folder that routes all metrics to a log bucket in a new project, and create the policies there." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A metrics scope lets its scoping project chart and alert on the metrics of the projects it monitors, and Google recommends a new project without resources as the scoping project. Changing a metrics scope requires the Monitoring Admin role on the scoping project and on each project that you add.
  options:
    b: { en: "Google recommends a scoping project without resources, and Monitoring Viewer on the other projects isn't enough to add them to the scope." }
    c: { en: "Adding a project to a metrics scope also requires Monitoring Admin on that project, not only on the scoping project." }
    d: { en: "Sinks route log entries, not metrics, so they can't build a cross-project view of metrics." }
references:
  - title: "Metrics scopes overview | Cloud Monitoring | Google Cloud Documentation"
    url: https://docs.cloud.google.com/monitoring/settings
