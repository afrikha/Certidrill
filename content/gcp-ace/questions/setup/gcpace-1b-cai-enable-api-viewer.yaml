id: gcpace-1b-cai-enable-api-viewer
objective: "1.1.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An analyst at a logistics company works from the project audit-tools, where the analyst has the Service Usage Consumer role. The analyst must search the resources of the entire organization with `gcloud asset search-all-resources`, with read-only access. The Cloud Asset Inventory API has never been enabled anywhere in the organization. You must follow the principle of least privilege.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Enable the Cloud Asset Inventory API (`cloudasset.googleapis.com`) in every project of the organization.
    - id: b
      text:
        en: |-
          Enable the Cloud Asset Inventory API (`cloudasset.googleapis.com`) in the audit-tools project.
    - id: c
      text:
        en: |-
          Grant the analyst the Cloud Asset Owner role (`roles/cloudasset.owner`) on the audit-tools project.
    - id: d
      text:
        en: |-
          Grant the analyst the Organization Viewer role (`roles/resourcemanager.organizationViewer`) on the organization.
    - id: e
      text:
        en: |-
          Grant the analyst the Cloud Asset Viewer role (`roles/cloudasset.viewer`) on the organization.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      The Cloud Asset Inventory API must be enabled in the project from which you run the commands, not in every project that you search. The search permission must be granted on the scope that you search, and Cloud Asset Viewer on the organization grants it with read-only access; the analyst's Service Usage Consumer role covers the `serviceusage.services.use` permission that every call needs.
  options:
    a:
      en: |-
        The API is needed only in the project that makes the calls; enabling it everywhere adds work without changing the result.
    c:
      en: |-
        A role on audit-tools doesn't allow searching the organization, and Cloud Asset Owner also manages feeds, which is more than read-only access.
    d:
      en: |-
        Organization Viewer lets the analyst see the organization resource itself, but it doesn't include the Cloud Asset Inventory search permission.
references:
  - title: "Roles and permissions | Cloud Asset Inventory | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/roles-permissions
  - title: "Search for resources | Cloud Asset Inventory | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/searching-resources
