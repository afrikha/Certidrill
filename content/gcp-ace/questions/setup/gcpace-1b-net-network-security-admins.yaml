id: gcpace-1b-net-network-security-admins
objective: "1.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    In a new production project, the network team must create and modify VPC networks, subnets, routes and Cloud Routers. Only the security team may create and modify firewall rules, and neither team manages VMs. You must follow the principle of least privilege.

    Which two role grants should you make on the project? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Grant Compute Admin (`roles/compute.admin`) to the network team.
    - id: b
      text:
        en: |-
          Grant Compute Network Admin (`roles/compute.networkAdmin`) to the network team.
    - id: c
      text:
        en: |-
          Grant Compute Network User (`roles/compute.networkUser`) to the network team.
    - id: d
      text:
        en: |-
          Grant Compute Security Admin (`roles/compute.securityAdmin`) to the security team.
    - id: e
      text:
        en: |-
          Grant Compute Network Admin (`roles/compute.networkAdmin`) to the security team.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Compute Network Admin gives full control over network resources except firewall rules and SSL certificates, which fits the network team. Compute Security Admin is the role for managing firewall rules and SSL certificates, which fits the security team.
  options:
    a:
      en: |-
        Compute Admin also lets the network team manage firewall rules and VMs, which breaks both the separation of duties and least privilege.
    c:
      en: |-
        Network User only lets principals use existing networks and subnets; it doesn't allow creating or modifying them.
    e:
      en: |-
        Network Admin excludes firewall rules, so the security team couldn't manage them, and it would get network permissions it doesn't need.
references:
  - title: "Shared VPC | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/shared-vpc
