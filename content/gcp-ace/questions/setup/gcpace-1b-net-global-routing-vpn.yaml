id: gcpace-1b-net-global-routing-vpn
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer's custom mode VPC network corp-vpc has subnets in us-east1 and us-west1. An HA VPN gateway and a Cloud Router in us-east1 connect it to the on-premises data center with BGP, and the network was created with the default dynamic routing mode. On-premises users can reach the VMs in us-east1 but not those in us-west1, and firewall rules allow the traffic.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a second Cloud Router in us-west1 in corp-vpc, without any BGP session.
    - id: b
      text:
        en: |-
          Configure the Cloud Router in us-east1 to advertise the us-west1 subnet range as a custom route.
    - id: c
      text:
        en: |-
          Run `gcloud compute networks update corp-vpc --bgp-routing-mode=global`.
    - id: d
      text:
        en: |-
          Enable Private Google Access on the us-west1 subnet of corp-vpc.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The default dynamic routing mode is regional: Cloud Routers advertise only the subnets of their own region and program the routes they learn only in that region. In global mode, the Cloud Router in us-east1 advertises the subnets of all regions and programs the learned on-premises routes for the VMs of every region, so us-west1 becomes reachable in both directions.
  options:
    a:
      en: |-
        A Cloud Router without BGP sessions neither learns nor advertises routes, so nothing changes.
    b:
      en: |-
        On-premises would learn a route to us-west1, but in regional mode the routes learned from on-premises are programmed only in us-east1, so the us-west1 VMs have no return route.
    d:
      en: |-
        Private Google Access lets VMs without external IP addresses reach Google APIs; it has no effect on hybrid routing.
references:
  - title: "VPC networks | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/vpc
  - title: "Set routing and best path selection modes | Cloud Router | Google Cloud Documentation"
    url: https://docs.cloud.google.com/network-connectivity/docs/router/how-to/configuring-routing-mode
