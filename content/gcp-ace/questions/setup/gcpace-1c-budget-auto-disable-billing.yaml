id: gcpace-1c-budget-auto-disable-billing
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A research lab's sandbox project runs Compute Engine VMs and stores data in a Cloud Storage bucket. The lab's grant covers at most 500 USD per month, and the lab accepts that resources might be lost when the limit is reached. When the project's cost reaches 500 USD in a month, billing on the project must be disabled automatically.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a budget for the project, and connect a Pub/Sub topic to it for programmatic notifications.
    - id: b
      text:
        en: |-
          Create a budget for the project with an email alert threshold at 100% of 500 USD.
    - id: c
      text:
        en: |-
          Create a spend cap budget of 500 USD that is scoped to the project and to Compute Engine.
    - id: d
      text:
        en: |-
          Deploy a Cloud Run function, triggered by the topic, that disables billing through the Cloud Billing API.
    - id: e
      text:
        en: |-
          Lower the Compute Engine CPU quota of the project so that the VMs can't cost more than 500 USD.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Alerts-only budgets don't stop spending, so the documented pattern is a budget that publishes programmatic notifications to a Pub/Sub topic, and a Cloud Run function subscribed to the topic that removes the project's billing account through the Cloud Billing API when the cost exceeds the budget. The function's service account needs billing permissions, and because notifications are delayed, the budget should be set slightly below the real limit.
  options:
    b:
      en: |-
        A budget email only notifies the billing recipients; it doesn't disable billing or stop usage.
    c:
      en: |-
        Spend cap budgets support only a limited set of services (Gemini API, Gemini Enterprise Agent Platform, Cloud Run and Cloud Run functions), not Compute Engine, and they don't stop persistent resources.
    e:
      en: |-
        Quotas limit the amount of resources that can be created, not their cost; VMs within the quota keep running and accruing charges.
references:
  - title: "Disable billing usage with notifications | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/disable-billing-with-notifications
  - title: "Manage spend cap budgets | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps
