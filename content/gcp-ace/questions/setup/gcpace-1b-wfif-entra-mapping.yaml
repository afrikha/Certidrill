id: gcpace-1b-wfif-entra-mapping
objective: "1.1.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are creating an OIDC provider for Microsoft Entra ID in the workforce identity pool corp-pool. Each federated user must be identified by a stable value that is unique to the user. Administrators must be able to grant roles to Entra groups by using `principalSet://.../group/GROUP_ID` identifiers.

    Which two attribute mappings should you include in the provider? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `google.subject=assertion.oid`
    - id: b
      text:
        en: |-
          `google.display_name=assertion.preferred_username`
    - id: c
      text:
        en: |-
          `google.subject=assertion.groups`
    - id: d
      text:
        en: |-
          `google.groups=assertion.groups`
    - id: e
      text:
        en: |-
          `attribute.department=assertion.department`
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      `google.subject` is the required mapping that identifies each user, and Google's Entra ID guide maps it to the object ID claim `oid`. `google.groups` provides the group IDs used by `principalSet://.../group/GROUP_ID` identifiers; a user in more than 400 groups can't sign in.
  options:
    b:
      en: |-
        `google.display_name` only sets the name shown in the console; it neither identifies users uniquely nor enables group identifiers.
    c:
      en: |-
        The groups claim is shared by many users and can hold several values, so it can't identify one user.
    e:
      en: |-
        A custom attribute enables `principalSet://.../attribute.department/VALUE` identifiers, not group identifiers.
references:
  - title: "Configure Workforce Identity Federation with Microsoft Entra ID and sign in users | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workforce-sign-in-microsoft-entra-id
  - title: "Workforce Identity Federation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workforce-identity-federation
