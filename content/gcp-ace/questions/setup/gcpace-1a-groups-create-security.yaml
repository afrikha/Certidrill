id: gcpace-1a-groups-create-security
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You manage the Cloud Identity account of the domain `orbis.example`. From a provisioning script, you need to create the group `net-admins@orbis.example`. The group must carry the security label, because the company uses that label to identify the groups that are used for access control.

    Which command should the script run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud identity groups create net-admins@orbis.example --organization=orbis.example --display-name="Network admins" --description="Security"`
    - id: b
      text:
        en: |-
          `gcloud identity groups create net-admins@orbis.example --organization=orbis.example --group-type=security --display-name="Network admins"`
    - id: c
      text:
        en: |-
          `gcloud identity groups memberships add --group-email=net-admins@orbis.example --member-email=security@orbis.example`
    - id: d
      text:
        en: |-
          `gcloud iam roles create netAdmins --organization=orbis.example --title="Network admins"`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud identity groups create` creates a Cloud Identity group, and `--group-type=security` creates it as a security group. The `--organization` flag accepts the organization ID or its domain.
  options:
    a: { en: "Without `--group-type`, the command creates a discussion group, which is the default, so the security label is missing." }
    c: { en: "This command adds a member to an existing group; it doesn't create the group or set its type." }
    d: { en: "This command creates a custom IAM role, not a group, and `--organization` expects a numeric organization ID." }
references:
  - title: "gcloud identity groups create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/identity/groups/create
