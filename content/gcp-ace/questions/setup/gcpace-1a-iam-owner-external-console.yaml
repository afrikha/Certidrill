id: gcpace-1a-iam-owner-external-console
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An agency's project `ad-campaigns-2026` belongs to its organization. A contract requires that the legacy basic Owner role (`roles/owner`) on this project be granted to the external auditor `lee@audit-partners.example`, whose account is outside the organization. No organization policy restricts the domains that can be granted roles. Your `gcloud projects add-iam-policy-binding` command for this grant fails.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run the same `gcloud projects add-iam-policy-binding` command again with the `--condition=None` flag." }
    - id: b
      text: { en: "Grant the Owner role to the auditor from the IAM page of the project in the Google Cloud console." }
    - id: c
      text: { en: "Grant the Project IAM Admin role to the auditor so that the auditor can grant the Owner role to the account." }
    - id: d
      text: { en: "Export the policy with `gcloud projects get-iam-policy`, add the binding, and apply it with `gcloud projects set-iam-policy`." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      To grant the Owner role on a project to a user outside your organization, you must use the Google Cloud console; the gcloud CLI can't make this grant. The same rule applies to projects that don't belong to an organization.
  options:
    a: { en: "`--condition=None` only states that the binding has no condition; it doesn't lift the restriction on granting Owner to an external user with gcloud." }
    c: { en: "This gives an external account control over all access to the project, far beyond the contract, instead of making the grant through the supported console path." }
    d: { en: "Setting the whole policy is still a gcloud grant of Owner to an external user, and it risks overwriting concurrent changes." }
references:
  - title: "Manage access to projects, folders, and organizations | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access
