id: gcpace-1a-api-service-usage-admin
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI/CD pipeline runs as the service account `bootstrap@platform-ci.iam.gserviceaccount.com`. For each new application project, the pipeline must enable the APIs that the application needs, and later disable those that are no longer used. It does nothing else in these projects.

    Which role should you grant to the service account on each application project, following the principle of least privilege?
body:
  options:
    - id: a
      text: { en: "Admin (`roles/admin`)" }
    - id: b
      text: { en: "Service Usage Consumer (`roles/serviceusage.serviceUsageConsumer`)" }
    - id: c
      text: { en: "Service Usage Admin (`roles/serviceusage.serviceUsageAdmin`)" }
    - id: d
      text: { en: "Project IAM Admin (`roles/resourcemanager.projectIamAdmin`)" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Enabling and disabling services requires `serviceusage.services.enable` and `serviceusage.services.disable`, which the Service Usage Admin role contains. It doesn't give access to the other resources of the project.
  options:
    a: { en: "Admin is a basic role that grants broad control of most of the project's resources, far more than the pipeline needs." }
    b: { en: "Service Usage Consumer lets a principal use a project's services and quota, but it doesn't include the enable or disable permissions." }
    d: { en: "Project IAM Admin manages the project's allow policy; it doesn't include the permissions to enable or disable services." }
references:
  - title: "Enable and disable services | Service Usage | Google Cloud Documentation"
    url: https://docs.cloud.google.com/service-usage/docs/enable-disable
  - title: "Service Usage roles and permissions | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/roles-permissions/serviceusage
