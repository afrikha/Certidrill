id: gcpace-1c-cross-organization-billing
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting firm pays for a client's project with the firm's own Cloud Billing account, which belongs to the firm's organization. The project, `client-portal`, belongs to the client's organization, and Dana, a client administrator, has the legacy basic Owner role (`roles/owner`) on it. Dana must link the project to the firm's billing account with minimal changes.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Migrate the `client-portal` project to the firm's organization, and then link it to the billing account.
    - id: b
      text:
        en: |-
          Grant Dana the Billing Account Viewer role on the firm's billing account, and ask her to link the project.
    - id: c
      text:
        en: |-
          Grant Dana the Billing Account Creator role on the firm's organization, and ask her to create an account.
    - id: d
      text:
        en: |-
          Grant Dana the Billing Account User role on the firm's billing account, and ask her to link the project.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A billing account is owned by one organization but can pay for projects that belong to another organization. Linking requires a project-side role, which Dana's Owner role includes because it is a superset of Project Billing Manager, and the Billing Account User role on the billing account.
  options:
    a:
      en: |-
        Moving the project between organizations is a large change that isn't needed, because billing accounts can pay for projects in other organizations.
    b:
      en: |-
        Billing Account Viewer is read-only and doesn't confer the right to link or unlink projects.
    c:
      en: |-
        A new billing account would be a different account with its own payments profile, not the firm's existing account.
references:
  - title: "Cloud Billing overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/concepts
  - title: "Cloud Billing access control and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/billing-access
