id: gcpace-1a-api-restrict-service-usage
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team of a public-sector agency decides that no project in the `Analytics` folder may use Filestore, now or in the future. Developers in those projects hold the Service Usage Admin role, and the team doesn't want to change their roles.

    Following Google's recommendation, what should you do?
body:
  options:
    - id: a
      text: { en: "Set a policy on the `serviceuser.services` constraint at the `Analytics` folder that denies `file.googleapis.com`." }
    - id: b
      text: { en: "Replace the developers' Service Usage Admin role with Service Usage Consumer in every project of the folder." }
    - id: c
      text: { en: "Set a policy on the `gcp.restrictServiceUsage` constraint at the `Analytics` folder that denies `file.googleapis.com`." }
    - id: d
      text: { en: "Run `gcloud services disable file.googleapis.com` in each project that the `Analytics` folder contains today." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcp.restrictServiceUsage` defines which resource services can be used in an organization, folder, or project. A deny-list policy on the folder blocks Filestore in every current and future project below it, whatever IAM roles the developers hold. Google recommends this constraint over the older `serviceuser.services`.
  options:
    a: { en: "`serviceuser.services` supports only a few services, such as Compute Engine, Deployment Manager, and Cloud DNS, and Google recommends `gcp.restrictServiceUsage` instead." }
    b: { en: "The team doesn't want to change roles, and the change doesn't block Filestore where it is already enabled or for other principals who can enable services." }
    d: { en: "Developers with Service Usage Admin can enable the API again, and projects created later aren't covered." }
references:
  - title: "Restrict service usage | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/restricting-resources
  - title: "Organization policy constraints | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
