id: gcpace-1b-loc-hyperdisk-zone
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A database team wants to attach Hyperdisk Balanced volumes to new VMs in zone asia-southeast1-b. Before it writes the instance template, the team must confirm from Cloud Shell that this disk type is offered in that zone.

    Which command should the team run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute disks list --zones=asia-southeast1-b --filter="type~hyperdisk-balanced"`
    - id: b
      text:
        en: |-
          `gcloud compute disk-types list --zones=asia-southeast1-b --filter="name=hyperdisk-balanced"`
    - id: c
      text:
        en: |-
          `gcloud compute zones describe asia-southeast1-b`
    - id: d
      text:
        en: |-
          `gcloud compute machine-types list --zones=asia-southeast1-b --filter="name~^c4-"`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Disk types are zonal resources: `gcloud compute disk-types list` returns the disk types offered in each zone, so filtering on the zone and the name shows whether hyperdisk-balanced is available there. The team must still pick a machine series that supports Hyperdisk Balanced.
  options:
    a:
      en: |-
        This lists existing disks of the project; an empty result doesn't tell whether the disk type is offered in the zone.
    c:
      en: |-
        Describing the zone returns details such as its status and CPU platforms, not its disk types.
    d:
      en: |-
        This lists machine types of the zone, not the disk types that the zone offers.
references:
  - title: "Regions and zones | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/regions-zones
