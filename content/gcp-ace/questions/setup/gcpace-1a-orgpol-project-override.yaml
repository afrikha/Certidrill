id: gcpace-1a-orgpol-project-override
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank enforces the boolean constraint that disables service account key creation on its organization. The project `vendor-sftp-bridge` hosts a legacy integration that can authenticate only with a service account key until the vendor upgrades its software. You must allow key creation in this project only, keep the constraint enforced everywhere else, and make as few changes as possible.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Grant the Service Account Key Admin role to the integration team on the `vendor-sftp-bridge` project." }
    - id: b
      text: { en: "Set a policy on the `vendor-sftp-bridge` project that inherits the parent's policy for the constraint." }
    - id: c
      text: { en: "Set a policy on the `vendor-sftp-bridge` project that overrides the parent's policy with enforcement turned off." }
    - id: d
      text: { en: "Remove the policy from the organization and enforce the constraint on each folder except the one that contains the project." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A policy set on a resource can override the policy it would inherit. For a boolean constraint, a project policy that overrides the parent's policy with enforcement off applies only to that project, so key creation is allowed there while the organization policy still applies everywhere else.
  options:
    a: { en: "IAM roles don't bypass organization policies. Even with the role, key creation is still blocked by the enforced constraint." }
    b: { en: "Inheriting the parent's policy keeps the constraint enforced on the project, which is the current situation." }
    d: { en: "This requires many policies, and it also lifts the constraint for every other project in that folder." }
references:
  - title: "Apply organization policies | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/creating-managing-policies
  - title: "Hierarchy evaluation | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/understanding-hierarchy
