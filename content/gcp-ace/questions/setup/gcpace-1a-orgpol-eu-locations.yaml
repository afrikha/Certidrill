id: gcpace-1a-orgpol-eu-locations
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company must make sure that every new resource that lets you choose a location is created only in European Union locations. The rule must apply to all current and future projects in its organization, whoever creates the resources.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Set the `compute/region` property to `europe-west1` in the gcloud configuration of every administrator." }
    - id: b
      text: { en: "Set a policy on the `compute.vmExternalIpAccess` constraint at the organization that denies all values." }
    - id: c
      text: { en: "Set a policy on the `gcp.restrictServiceUsage` constraint at the organization that allows only `in:eu-locations`." }
    - id: d
      text: { en: "Set a policy on the `gcp.resourceLocations` constraint at the organization that allows only `in:eu-locations`." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The `gcp.resourceLocations` constraint limits where location-based resources can be created. Allowing only the `in:eu-locations` value group at the organization applies the rule to every folder and project below it, including future ones, and Google keeps the value group up to date as new EU locations are added.
  options:
    a: { en: "A gcloud property is only a client-side default. It isn't enforced and doesn't apply to the console, the API, or other users." }
    b: { en: "This constraint controls which VMs can have external IPv4 addresses; it has nothing to do with resource locations." }
    c: { en: "`gcp.restrictServiceUsage` restricts which services can be used, and its values are service names, not location groups." }
references:
  - title: "Restrict resource locations | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/defining-locations
