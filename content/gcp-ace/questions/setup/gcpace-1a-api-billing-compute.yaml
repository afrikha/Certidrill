id: gcpace-1a-api-billing-compute
objective: "1.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A team has just created the project `geo-render-dev` in its organization and wants to create the project's first Compute Engine VM. The team members already have the IAM roles they need, and no organization policy blocks Compute Engine.

    Which two actions must be completed before the VM can be created? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Request a CPU quota increase for the region of the VM." }
    - id: b
      text: { en: "Link the project to an active Cloud Billing account." }
    - id: c
      text: { en: "Install the Ops Agent on a template VM in the project." }
    - id: d
      text: { en: "Grant the Admin role (`roles/admin`) to the Compute Engine default service account." }
    - id: e
      text: { en: "Enable the Compute Engine API (`compute.googleapis.com`) in the project." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Before you create a Compute Engine VM, billing must be enabled for the project and the Compute Engine API must be enabled. Both are prerequisites in Google's own procedure for creating a first VM.
  options:
    a: { en: "A new project comes with default quotas that allow a first VM; an increase is needed only for larger usage." }
    c: { en: "The Ops Agent collects telemetry from running VMs; it isn't needed to create one." }
    d: { en: "No extra role on the default service account is needed, and granting it a basic role such as Admin would break least privilege." }
references:
  - title: "Create a Linux VM instance in Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/create-linux-vm-instance
