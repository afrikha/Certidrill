id: gcpace-1c-link-roles-least-privilege
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Developers create projects in the `Dev` folder of your organization. A platform engineer, Mei, must be able to link any project of the `Dev` folder to the billing account `DEV-BA`. She must not be able to change project resources, manage payment methods or view cost data.

    Which two roles should you grant Mei to follow the principle of least privilege? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Project Billing Manager (`roles/billing.projectManager`) on the `Dev` folder
    - id: b
      text:
        en: |-
          Billing Account Administrator (`roles/billing.admin`) on `DEV-BA`
    - id: c
      text:
        en: |-
          Folder Admin (`roles/resourcemanager.folderAdmin`) on the `Dev` folder
    - id: d
      text:
        en: |-
          Billing Account User (`roles/billing.user`) on `DEV-BA`
    - id: e
      text:
        en: |-
          Billing Account Viewer (`roles/billing.viewer`) on `DEV-BA`
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Linking a project to a billing account needs permissions on both sides. Project Billing Manager, granted on the folder and inherited by its projects, lets Mei attach projects to a billing account without any right over their resources, and Billing Account User on `DEV-BA` lets her link projects to that account with very narrow permissions.
  options:
    b:
      en: |-
        Billing Account Administrator also manages payment methods, users and cost data, which exceeds what Mei needs.
    c:
      en: |-
        Folder Admin manages the folder and its projects, which is broader than needed, and it grants nothing on the billing account side of the link.
    e:
      en: |-
        Billing Account Viewer gives read access to costs and payments, which Mei must not see, and it doesn't allow linking projects.
references:
  - title: "Cloud Billing access control and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/billing-access
