id: gcpace-1a-obs-ops-agent-roles
objective: "1.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company installed the Ops Agent on the Compute Engine VM `inv-1` in `europe-west1-b`, which runs as the service account `vm-runtime@shop-prod.iam.gserviceaccount.com`. The service account already has the Logs Writer and Monitoring Metric Writer roles, but no agent logs or metrics appear. The VM was created years ago with the access scope `storage-ro` only.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Stop the VM." }
    - id: b
      text: { en: "Grant the Logging Admin and Monitoring Admin roles to the service account." }
    - id: c
      text: { en: "Run `gcloud auth login` on the VM with an administrator account so that the agent uses those credentials." }
    - id: d
      text: { en: "Run `gcloud compute instances set-service-account inv-1 --zone=europe-west1-b --service-account=vm-runtime@shop-prod.iam.gserviceaccount.com --scopes=cloud-platform`, and then start the VM." }
    - id: e
      text: { en: "Create a key for the service account and store it on the VM for the agent." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The Ops Agent uses the VM's attached service account, and the VM's access scopes must also allow writing logs and metrics: either `cloud-platform` or a logging and a monitoring write scope. Old VMs or VMs whose scopes were changed may lack them. Access scopes can be changed only while the VM is stopped, so you stop it, set the scopes with `set-service-account`, and start it again; the existing roles then authorize the agent.
  options:
    b: { en: "The roles already allow writing logs and metrics; the missing piece is the access scope, and admin roles would break least privilege." }
    c: { en: "The Ops Agent doesn't support authorization with `gcloud auth`; it uses the VM's service account." }
    e: { en: "Google recommends the attached service account over keys, whose private key must be stored locally and can be compromised; a key also isn't needed here." }
references:
  - title: "Authorize the Ops Agent | Google Cloud Observability | Google Cloud Documentation"
    url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/authorization
  - title: "Change the attached service account | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/change-service-account
