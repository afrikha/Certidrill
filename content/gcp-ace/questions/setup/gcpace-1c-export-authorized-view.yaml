id: gcpace-1c-export-authorized-view
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The dataset `billing_data` receives the standard usage cost export of a billing account that pays for 30 projects. Each product team must be able to query only the cost rows of its own project, without copying the data and without any role on the billing account.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant each team the BigQuery Data Viewer role on the `billing_data` dataset.
    - id: b
      text:
        en: |-
          Create an authorized view per team that filters on `project.id`, and share only that view with the team.
    - id: c
      text:
        en: |-
          Configure one billing export per project, each writing to a dataset that the team owns.
    - id: d
      text:
        en: |-
          Grant each team the Billing Account Viewer role, and let it filter the Cloud Billing reports by project.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Google recommends authorized views, filtered on `project.id`, or row-level security to restrict which billing export rows a team can see. Each team queries its view without access to the underlying tables, and no data is copied.
  options:
    a:
      en: |-
        Access to the whole dataset lets every team read the costs of all 30 projects.
    c:
      en: |-
        A billing account supports one dataset per export type, and each usage cost export includes all the projects linked to the account.
    d:
      en: |-
        The teams must not have any role on the billing account, and Billing Account Viewer shows the costs of every project.
references:
  - title: "Export Cloud Billing data to BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery
