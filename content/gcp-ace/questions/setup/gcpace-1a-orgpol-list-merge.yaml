id: gcpace-1a-orgpol-list-merge
objective: "1.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An organization has a policy on the `gcp.resourceLocations` constraint that allows only `in:europe-west1-locations` and `in:europe-west4-locations`. The `Research` folder has its own policy on the same constraint, set to merge with the parent's policy, that allows `in:us-central1-locations`. The `Retail` folder has no policy for this constraint. Neither folder contains subfolders with their own policies.

    Which two statements are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A project in the `Research` folder can create resources in `us-central1`." }
    - id: b
      text: { en: "A project in the `Research` folder can create resources only in `us-central1`." }
    - id: c
      text: { en: "A project in the `Research` folder can create resources in `europe-west4`." }
    - id: d
      text: { en: "A project in the `Retail` folder can create resources in `us-central1`." }
    - id: e
      text: { en: "A project in the `Retail` folder can create resources in any location." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      For a list constraint, a policy that merges with its parent (`inheritFromParent: true`) combines the parent's effective values with its own. Projects in `Research` can therefore use `europe-west1`, `europe-west4`, and `us-central1`.
  options:
    b: { en: "That would be the result of a policy that replaces the parent's policy. With merge, the organization's allowed values still apply." }
    d: { en: "`Retail` has no policy, so its projects inherit the organization's policy, which allows only the two European regions." }
    e: { en: "A folder without its own policy inherits the organization's effective policy; it doesn't fall back to the constraint's default." }
references:
  - title: "Hierarchy evaluation | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/understanding-hierarchy
