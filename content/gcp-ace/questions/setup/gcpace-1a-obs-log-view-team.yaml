id: gcpace-1a-obs-log-view-team
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company routes the logs of 12 application projects to one log bucket, `central-logs`, in the project `obs-hub`. The team that owns the project `payments-api` must be able to read the entries that come from its project in that bucket, and no other entries. The other teams must keep all their logs in the bucket.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create a log view on `central-logs` whose filter matches `payments-api` as the source, and grant the team the Logs View Accessor role on that view." }
    - id: b
      text: { en: "Grant the team the Logs Viewer role on the `obs-hub` project, and share a saved query in the Logs Explorer that filters on `payments-api`." }
    - id: c
      text: { en: "Add exclusion filters to the sinks of the 11 other projects so that only `payments-api` entries reach `central-logs`, then grant the team access." }
    - id: d
      text: { en: "Create a log-based metric that counts the `payments-api` entries in `central-logs`, and share a Cloud Monitoring dashboard with the team." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A log view gives access to only a subset of the entries in a log bucket. With a filter on the `payments-api` source and the Logs View Accessor role granted on that view (or on the project with a condition on the view's name), the team reads its own entries and nothing else in `central-logs`.
  options:
    b: { en: "A saved query only filters what the team chooses to display; the Logs Viewer role isn't limited to the `payments-api` entries." }
    c: { en: "Excluding the other projects' entries removes logs that the other teams must keep in the bucket." }
    d: { en: "A log-based metric counts entries; the team couldn't read the log entries themselves." }
references:
  - title: "Configure log views on a log bucket | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/logs-views
