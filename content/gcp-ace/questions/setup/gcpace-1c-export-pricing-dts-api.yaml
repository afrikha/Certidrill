id: gcpace-1c-export-pricing-dts-api
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The standard usage cost export of your billing account already writes to the dataset `billing_data` in the project `finops-data`. You have the Billing Account Administrator role on the billing account and the BigQuery Admin and Editor (`roles/editor`) roles on `finops-data`. You now need to enable the pricing data export to the same dataset.

    Which additional step is required?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the `billing-export-bigquery@system.gserviceaccount.com` service account the BigQuery Admin role on the project.
    - id: b
      text:
        en: |-
          Create a second dataset for the pricing data, because it can't share a dataset with usage cost data.
    - id: c
      text:
        en: |-
          Enable the BigQuery Data Transfer Service API in the `finops-data` project, which contains the dataset.
    - id: d
      text:
        en: |-
          Enable the detailed usage cost export first, because the pricing data export depends on it.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The pricing data export requires the BigQuery Data Transfer Service API, enabled in the same project as the dataset, in addition to the Billing Account Administrator and BigQuery Admin roles that you already have. Pricing data can take up to 48 hours to appear.
  options:
    a:
      en: |-
        Google adds the export service accounts to the dataset automatically when you enable an export; no manual grant is needed, and pricing data uses a different service account.
    b:
      en: |-
        A single dataset can hold the standard, detailed and pricing data exports.
    d:
      en: |-
        The pricing data export is enabled independently of the detailed usage cost export.
references:
  - title: "Set up Cloud Billing data export to BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery-setup
