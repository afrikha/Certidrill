id: gcpace-1c-check-project-billing-status
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A deployment script fails in the project `data-lab-42` with an error that says billing is disabled for the project. You need to check from the command line which billing account the project is linked to, if any, and whether billing is enabled on it.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud billing accounts list`
    - id: b
      text:
        en: |-
          `gcloud projects describe data-lab-42`
    - id: c
      text:
        en: |-
          `gcloud billing projects describe data-lab-42`
    - id: d
      text:
        en: |-
          `gcloud services list --enabled --project=data-lab-42`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud billing projects describe` shows the billing information of a project: the billing account it is linked to and whether billing is enabled. It is the quickest way to confirm that the project lacks a link to an active billing account.
  options:
    a:
      en: |-
        This command lists the billing accounts that you can access; it doesn't show which account a given project uses.
    b:
      en: |-
        This command shows project metadata such as its number, parent and lifecycle state, not its billing information.
    d:
      en: |-
        This command lists the APIs enabled in the project; it says nothing about the project's billing account.
references:
  - title: "gcloud billing projects describe | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/billing/projects/describe
