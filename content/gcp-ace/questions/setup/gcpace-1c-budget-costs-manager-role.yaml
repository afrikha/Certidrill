id: gcpace-1c-budget-costs-manager-role
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A FinOps analyst must create, edit and delete budgets on the company's Cloud Billing account and view its cost reports. The analyst must not manage payment methods, link projects or change who has access to the billing account.

    Which role should you grant the analyst on the billing account?
body:
  options:
    - id: a
      text:
        en: |-
          Billing Account Costs Manager (`roles/billing.costsManager`)
    - id: b
      text:
        en: |-
          Billing Account Administrator (`roles/billing.admin`)
    - id: c
      text:
        en: |-
          Billing Account Viewer (`roles/billing.viewer`)
    - id: d
      text:
        en: |-
          Billing Account User (`roles/billing.user`)
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Billing Account Costs Manager manages budgets and views and exports cost data for the billing account, without access to pricing data, payment methods, project links or IAM. It is the least-privileged role that lets the analyst create, edit and delete budgets.
  options:
    b:
      en: |-
        Billing Account Administrator can also manage payment methods, project links and other users' roles, which the analyst must not do.
    c:
      en: |-
        Billing Account Viewer is read-only: it shows costs but doesn't allow creating or editing budgets.
    d:
      en: |-
        Billing Account User only allows linking projects to the account, which the analyst must not do, and it doesn't allow managing budgets.
references:
  - title: "Cloud Billing access control and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/billing-access
