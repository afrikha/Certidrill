id: gcpace-1b-standalone-pipeline-sa
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a standalone organization. Its deployment pipeline runs as the service account deployer@ops-tools.iam.gserviceaccount.com and must create new projects under the organization. An administrator tried to invite the service account as an Organization Owner, and the invitation was rejected. You must follow the principle of least privilege.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Grant the service account the Organization Administrator role on the organization.
    - id: b
      text:
        en: |-
          Grant the service account the Project Creator role (`roles/resourcemanager.projectCreator`) on the organization.
    - id: c
      text:
        en: |-
          Invite the service account again as an Organization Owner, and accept the invitation by impersonating it.
    - id: d
      text:
        en: |-
          Grant the service account the Admin role (`roles/admin`) on the ops-tools project.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Service accounts can't be invited to become owners of a standalone organization, but they can receive IAM roles on it. Project Creator on the organization gives the pipeline exactly the permission to create projects under the organization.
  options:
    a:
      en: |-
        Organization Administrator lets a principal manage IAM policies but doesn't include project creation, and it gives the pipeline far more power than needed.
    c:
      en: |-
        Service accounts can't become Organization Owners, whatever account accepts the invitation.
    d:
      en: |-
        Admin on ops-tools gives permissions on that one project; it doesn't allow creating projects under the organization.
references:
  - title: "Set up standalone organizations | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/standalone-organization-overview
