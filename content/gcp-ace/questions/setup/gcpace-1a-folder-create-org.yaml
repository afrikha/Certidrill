id: gcpace-1a-folder-create-org
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company has an organization resource with the ID `418203957116`. The finance department needs its own top-level folder named `Finance`, directly under the organization, so that its projects can be grouped and governed separately. You have the Folder Creator role on the organization.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud projects create finance-root --organization=418203957116 --name="Finance"`.
    - id: b
      text:
        en: |-
          Run `gcloud resource-manager tags keys create finance --parent=organizations/418203957116`.
    - id: c
      text:
        en: |-
          Run `gcloud resource-manager folders create --display-name="Finance" --organization=418203957116`.
    - id: d
      text:
        en: |-
          Run `gcloud resource-manager folders create --display-name="Finance" --folder=418203957116`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `gcloud resource-manager folders create` creates a folder, and `--organization` sets the organization resource as its parent, which makes it a top-level folder. The display name must be unique among the folders that share the same parent. The Folder Creator role on the organization is enough to create it.
  options:
    a: { en: "This command creates a project named Finance, not a folder. A project can't contain other projects, so it can't group the department's projects." }
    b: { en: "This command creates a tag key, which can be attached to resources to scope policies, but it isn't a container in the resource hierarchy." }
    d: { en: "`--folder` expects the ID of a parent folder. The ID given is the organization's, so the command looks for a folder that doesn't exist and fails." }
references:
  - title: "Create folders | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-folders
  - title: "gcloud resource-manager folders create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/resource-manager/folders/create
