id: gcpace-1a-project-id-permanent
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at a travel company created a project with the ID `trips-analytcs-dev`, misspelling "analytics". The deployment scripts reference the project ID, and the team wants the ID to read `trips-analytics-dev`. The project contains only a few test resources that are easy to recreate.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud projects update trips-analytcs-dev --name="trips-analytics-dev"`.
    - id: b
      text:
        en: |-
          In the console, open IAM & Admin > Settings for the project and edit the Project ID field.
    - id: c
      text:
        en: |-
          Shut the project down with `gcloud projects delete`, then run `gcloud projects undelete trips-analytics-dev`.
    - id: d
      text:
        en: |-
          Create a project with the ID `trips-analytics-dev`, recreate the test resources in it, and shut down the old project.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A project ID can be edited only while the project is being created; after that it is permanent. The only way to get the correct ID is to create a new project with it, move or recreate the resources, and then shut down the misspelled project.
  options:
    a: { en: "`gcloud projects update` changes only the display name. The project ID stays `trips-analytcs-dev`, so the scripts still see the wrong ID." }
    b: { en: "The console lets you edit the project name, but the project ID can't be changed after creation." }
    c: { en: "Undelete restores a project that is pending deletion with its original ID. No project with the ID `trips-analytics-dev` exists, so the command fails." }
references:
  - title: "Create projects | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-projects
