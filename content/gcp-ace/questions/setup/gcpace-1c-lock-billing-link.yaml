id: gcpace-1c-lock-billing-link
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The project `payments-prod` must always be paid by the billing account `CORP-BA`. Several owners of the project also have the Billing Account User role on team billing accounts, and last quarter one of them linked `payments-prod` to a team account by mistake. You need a safeguard so that the link can't be moved or removed by a single mistaken action: any such change must require a deliberate extra step first. The owners must keep all their current roles.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a budget for `payments-prod` on `CORP-BA`, and connect it to a Pub/Sub topic that the security team monitors.
    - id: b
      text:
        en: |-
          Lock the link between `payments-prod` and `CORP-BA` from the Account management page of the billing account.
    - id: c
      text:
        en: |-
          Remove the Billing Account Creator role from the domain principal on the organization resource.
    - id: d
      text:
        en: |-
          Grant the project owners the Billing Account Viewer role on `CORP-BA` so that they can check the current link.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      After you link a project to a billing account, you can lock the link: no change between the project and the billing account, such as a move to another account or a removal of the link, can be made until it is unlocked. Unlocking is a separate, explicit action that principals with Project Billing Manager or Project Owner on the project, or Billing Account Administrator on the billing account, can perform, so the lock guards against accidental changes rather than replacing access control. A lock doesn't keep billing enabled if `CORP-BA` itself is closed or suspended.
  options:
    a:
      en: |-
        Budget notifications report spend against an amount; they neither detect nor prevent a change of billing account.
    c:
      en: |-
        Billing Account Creator controls the creation of new billing accounts; the owners could still link the project to the existing team accounts.
    d:
      en: |-
        Billing Account Viewer only adds read access; the owners could still move the project or disable its billing.
references:
  - title: "Secure the link between a project and its billing account | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/secure-project-billing-account-link
