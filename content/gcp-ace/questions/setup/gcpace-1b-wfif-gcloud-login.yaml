id: gcpace-1b-wfif-gcloud-login
objective: "1.1.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Employees of a bank sign in to the console through the workforce identity pool corp-pool and its provider corp-saml. They have no Google Account. They now need to use the gcloud CLI on their laptops with their IdP credentials, and the bank forbids service account keys.

    Which two steps should be performed? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Generate a login configuration file with `gcloud iam workforce-pools create-login-config locations/global/workforcePools/corp-pool/providers/corp-saml --output-file=login.json`.
    - id: b
      text:
        en: |-
          Generate a credential configuration file with `gcloud iam workload-identity-pools create-cred-config` for the corp-saml provider.
    - id: c
      text:
        en: |-
          Run `gcloud auth login --login-config=login.json` on each laptop, and complete the sign-in in the browser.
    - id: d
      text:
        en: |-
          Run `gcloud auth activate-service-account --key-file=login.json` on each laptop, and keep the file in a protected folder.
    - id: e
      text:
        en: |-
          Run `gcloud auth application-default login` on each laptop, and sign in with a Google Account.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      `gcloud iam workforce-pools create-login-config` creates a configuration file for browser-based sign-in through a workforce pool provider. Users then run `gcloud auth login --login-config` with that file, or set it as the default login configuration, and authenticate with their IdP.
  options:
    b:
      en: |-
        Credential configuration files of workload identity pools are for workloads that exchange external credentials, not for employees who sign in through a workforce pool.
    d:
      en: |-
        This command activates a service account key, which the bank forbids, and a login configuration isn't a key file.
    e:
      en: |-
        The employees have no Google Account, and this command only sets up Application Default Credentials for client libraries; it doesn't sign in the gcloud CLI itself.
references:
  - title: "Configure Workforce Identity Federation with Microsoft Entra ID and sign in users | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workforce-sign-in-microsoft-entra-id
