id: gcpace-1a-orgpol-locations-existing
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Last month, a gaming company enforced a `gcp.resourceLocations` policy on its organization that allows only `in:eu-locations`. A Cloud Storage bucket that was created two years ago in `us-central1` is still serving game assets. The compliance team asks what the policy did to this bucket and what remains to be done.

    What should you tell them?
body:
  options:
    - id: a
      text: { en: "The policy deleted the objects stored outside the EU, so the bucket must be recreated in an EU location and refilled." }
    - id: b
      text: { en: "The bucket keeps working because the policy applies only to new resources, so you must move its data to an EU bucket yourself." }
    - id: c
      text: { en: "The bucket became read-only when the policy was enforced, so you must add an exception to the policy to make it writable again." }
    - id: d
      text: { en: "The bucket's data was moved automatically to the EU multi-region, so the applications keep working and nothing else is needed." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The resource locations constraint isn't retroactive: resources created before the policy keep existing and working, and the constraint neither reports nor fixes them. You must find these violations, for example with Security Health Analytics, and migrate the data to a bucket in an allowed location.
  options:
    a: { en: "Organization policies don't delete existing resources or data; the bucket and its objects are untouched." }
    c: { en: "The constraint doesn't change the behavior of existing resources; it only blocks creating new resources in other locations." }
    d: { en: "Google Cloud never relocates existing resources to satisfy a new policy; the bucket stays in `us-central1`." }
references:
  - title: "Restrict resource locations | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/defining-locations
  - title: "Organization Policy overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/overview
