id: gcpace-1a-users-bulk-upload
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nonprofit with 120 staff members is starting to use Google Cloud. It has no directory service, and HR keeps the staff list in a spreadsheet. The nonprofit needs to create Cloud Identity user accounts for all staff members once, with the least effort.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Export the spreadsheet as a CSV file and upload it in the Google Admin console to add all the users at once." }
    - id: b
      text: { en: "Install Google Cloud Directory Sync and configure the spreadsheet as its source directory." }
    - id: c
      text: { en: "Create a workforce identity pool and import the spreadsheet into it as the list of pool members." }
    - id: d
      text: { en: "Run `gcloud identity groups create` once for each staff member, using the staff member's email address." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The Google Admin console can add many users at once from an uploaded CSV file. For a one-time creation of 120 accounts without a directory service, this is the simplest method.
  options:
    b: { en: "GCDS synchronizes from an LDAP directory such as Active Directory; a spreadsheet isn't a supported source." }
    c: { en: "Workforce identity pools federate an external identity provider; they don't create Cloud Identity accounts from a list." }
    d: { en: "This command creates groups, not user accounts." }
references:
  - title: "Create Cloud Identity user accounts | Google Cloud Documentation"
    url: https://docs.cloud.google.com/identity/docs/how-to/create-cloud-identity-user-accounts
