id: gcpace-1a-project-create-folder-flag
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data platform team uses a script that runs `gcloud projects create` for each new pipeline. The projects created last week have no parent resource, so the IAM policies and organization policies of the team's folder don't apply to them. New projects must be created in the folder with the ID `556677889900` and carry the label `cost-center=cc-104`.

    Which command should the script run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects create etl-orders-dev --folder=556677889900 --labels=cost-center=cc-104`
    - id: b
      text:
        en: |-
          `gcloud projects create etl-orders-dev --organization=556677889900 --labels=cost-center=cc-104`
    - id: c
      text:
        en: |-
          `gcloud projects create etl-orders-dev --labels=cost-center=cc-104 --set-as-default`
    - id: d
      text:
        en: |-
          `gcloud resource-manager folders create --display-name=etl-orders-dev --folder=556677889900`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      By default, `gcloud projects create` creates a project without a parent resource. The `--folder` flag places the new project in the given folder, so it inherits the folder's policies, and `--labels` adds the cost-center label at creation.
  options:
    b: { en: "`--organization` expects an organization ID. The ID is a folder's, so the command fails instead of creating the project in the folder." }
    c: { en: "Without `--folder` or `--organization`, the project again has no parent; `--set-as-default` only makes it the default project of the gcloud configuration." }
    d: { en: "This command creates a folder named etl-orders-dev, not a project." }
references:
  - title: "gcloud projects create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/projects/create
  - title: "Create projects | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-projects
