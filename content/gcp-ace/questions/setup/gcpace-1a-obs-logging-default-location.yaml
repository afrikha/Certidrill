id: gcpace-1a-obs-logging-default-location
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A European bank requires that the `_Default` and `_Required` log buckets of every project created from now on in its organization be stored in `europe-west1`. The buckets of existing projects will be handled in a separate project.

    What should you do?
body:
  options:
    - id: a
      text: { en: "After each project is created, run `gcloud logging buckets update _Default --location=europe-west1` in that project." }
    - id: b
      text: { en: "Run `gcloud logging settings update --organization=ORGANIZATION_ID --storage-location=europe-west1` once." }
    - id: c
      text: { en: "Run `gcloud logging settings update --organization=ORGANIZATION_ID --disable-default-sink` once." }
    - id: d
      text: { en: "Run `gcloud config set compute/region europe-west1` on the workstation of everyone who creates projects." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The default resource settings of Cloud Logging, set on an organization or folder, define where the system-created `_Default` and `_Required` buckets of new projects are stored. Child resources inherit the setting; existing buckets aren't moved.
  options:
    a: { en: "A log bucket's location can't be changed after creation, and `--location` only identifies where the bucket to update is." }
    c: { en: "This only stops the `_Default` sink in new projects; it doesn't set where the buckets are stored." }
    d: { en: "This sets a client-side default region for Compute Engine commands; it has no effect on log bucket locations." }
references:
  - title: "Configure default resource settings for Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/default-settings
