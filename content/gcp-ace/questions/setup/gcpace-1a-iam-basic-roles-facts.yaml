id: gcpace-1a-iam-basic-roles-facts
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Before an audit, a startup reviews how it grants basic roles in its staging and production projects. Several engineers hold the legacy Editor role, and the team is considering the newer basic roles.

    Which two statements about basic roles are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The legacy Editor role (`roles/editor`) can be granted with an IAM condition that makes the grant expire on a given date." }
    - id: b
      text: { en: "The Writer role (`roles/writer`) includes the permissions to manage the roles and permissions granted on the project." }
    - id: c
      text: { en: "The Admin (`roles/admin`), Writer (`roles/writer`), and Reader (`roles/reader`) roles support IAM Conditions." }
    - id: d
      text: { en: "Google recommends basic roles for production projects, because their permissions follow new services automatically." }
    - id: e
      text: { en: "In production, Google recommends a predefined or custom role instead of a basic role, unless no alternative exists." }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      The current basic roles are Admin, Writer, and Reader, and unlike the legacy Owner, Editor, and Viewer roles, they support IAM Conditions. Basic roles are very broad, so Google recommends not granting them in production unless there is no alternative, and using the most limited predefined or custom role instead.
  options:
    a: { en: "Conditions can't be added to bindings of the legacy basic roles Owner, Editor, and Viewer." }
    b: { en: "Managing roles and permissions is one of the sensitive tasks that only Admin (or the legacy Owner) adds; Writer doesn't include it." }
    d: { en: "Google advises against basic roles in production precisely because they grant broad, changing sets of permissions." }
references:
  - title: "Roles overview | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/roles-overview
  - title: "Overview of IAM Conditions | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/conditions-overview
