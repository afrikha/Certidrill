id: gcpace-1b-wfif-choose-federation
objective: "1.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A consulting firm manages its 3,000 employees in Okta, which supports OIDC and SAML 2.0. The employees must sign in to the Google Cloud console with their Okta credentials. The security team refuses to synchronize user accounts into Google, and it doesn't want to maintain Cloud Identity accounts.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy Google Cloud Directory Sync to create Cloud Identity users from Okta, and configure single sign-on with Okta.
    - id: b
      text:
        en: |-
          Create a workload identity pool with an Okta OIDC provider in a project, and grant IAM roles to its principals.
    - id: c
      text:
        en: |-
          Create a workforce identity pool in the organization with an Okta provider, and grant IAM roles to its principals.
    - id: d
      text:
        en: |-
          Create one service account per department, and let employees impersonate it after they sign in to Okta.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Workforce Identity Federation lets users of an external IdP that supports OIDC or SAML 2.0 sign in to Google Cloud with single sign-on, without any account being synchronized into Cloud Identity. You create a workforce identity pool at the organization level, add a provider for the IdP, and grant IAM roles to the pool's principals.
  options:
    a:
      en: |-
        Google Cloud Directory Sync copies users into Cloud Identity, which the security team refuses.
    b:
      en: |-
        Workload Identity Federation is designed for automated workloads, not for employees who sign in to the console.
    d:
      en: |-
        Employees still need a Google identity to impersonate a service account, and shared service accounts hide who did what.
references:
  - title: "Workforce Identity Federation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workforce-identity-federation
