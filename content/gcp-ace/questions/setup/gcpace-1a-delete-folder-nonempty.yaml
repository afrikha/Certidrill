id: gcpace-1a-delete-folder-nonempty
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company is retiring its `Legacy` folder. The folder contains an empty subfolder, `Archive`, and one active project, `legacy-cms`, which must be kept and placed under the `Platform` folder. When you run `gcloud resource-manager folders delete` on `Legacy`, the command fails. You have the Folder Admin and Project Mover roles on the organization.

    Which two actions should you perform before you run the delete command again? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Move the `legacy-cms` project to the `Platform` folder." }
    - id: b
      text: { en: "Remove all IAM role bindings from the `Legacy` folder." }
    - id: c
      text: { en: "Disable all the APIs that are enabled in the `legacy-cms` project." }
    - id: d
      text: { en: "Delete the empty `Archive` subfolder." }
    - id: e
      text: { en: "Unlink the `legacy-cms` project from its Cloud Billing account." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A folder must be empty, with no projects and no subfolders, before it can be deleted. Moving `legacy-cms` to `Platform` keeps the project, and deleting the empty `Archive` subfolder removes the last child, so the delete command can then succeed.
  options:
    b: { en: "Role bindings on the folder don't prevent its deletion; the folder's children do." }
    c: { en: "Disabling APIs doesn't take the project out of the folder, which stays non-empty." }
    e: { en: "Unlinking billing doesn't take the project out of the folder, and the project must keep running." }
references:
  - title: "Create folders | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-folders
  - title: "Move a project | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/moving-projects-folders
