id: gcpace-1b-quota-cpus-all-regions
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A startup's new project runs VMs with a total of 20 vCPUs in us-central1. It now needs a 16-vCPU VM in europe-west1, but the creation fails with a quota error. On the Quotas & System Limits page, the CPUs quota of europe-west1 shows 24 vCPUs available, and the CPUs (all regions) quota has a value of 32 vCPUs.

    What should you do so that the VM can be created?
body:
  options:
    - id: a
      text:
        en: |-
          Request an increase of the CPUs (all regions) quota of the project to at least 36 vCPUs.
    - id: b
      text:
        en: |-
          Request an increase of the CPUs quota of europe-west1 for the project to at least 40 vCPUs.
    - id: c
      text:
        en: |-
          Create the VM in another zone of europe-west1 that has more spare vCPU capacity.
    - id: d
      text:
        en: |-
          Request an increase of the CPUs quota of us-central1 for the project to at least 36 vCPUs.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Some new projects have a global CPUs (all regions) quota that counts the vCPUs of every region. With 20 vCPUs already in use, the new VM would bring the total to 36, above the global value of 32, so the request is blocked even though europe-west1 still has regional quota left. Raising the global quota to at least 36 removes the blocker.
  options:
    b:
      en: |-
        The regional quota of europe-west1 already has room for 16 vCPUs; the request is blocked by the global quota, which this increase doesn't change.
    c:
      en: |-
        CPU quotas are counted per region and globally, not per zone, so moving the VM to another zone of the same region still exceeds the all-regions quota.
    d:
      en: |-
        Raising the quota of us-central1 doesn't affect the global total, which still exceeds 32 vCPUs with the new VM.
references:
  - title: "Allocation quotas | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/resource-usage
