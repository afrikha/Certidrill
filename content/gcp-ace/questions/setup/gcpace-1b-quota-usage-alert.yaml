id: gcpace-1b-quota-usage-alert
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research team runs GPU training jobs in a project and wants to know in advance when its usage of the regional GPU quota approaches the quota value, so that it can decide when to request an increase. The team wants an email notification and the least setup effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Enable the quota adjuster for the project so that Google Cloud raises the GPU quota when usage approaches it.
    - id: b
      text:
        en: |-
          On the Quotas & System Limits page, choose Create usage alert for the GPU quota, and select an email notification channel.
    - id: c
      text:
        en: |-
          Create a budget on the project's billing account with an email alert when spending reaches 90 % of the budget.
    - id: d
      text:
        en: |-
          Create a log-based metric on failed VM creation requests, and an alerting policy with an email channel on that metric.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Create usage alert action of the Quotas & System Limits page opens an alert policy template for the selected project-level quota; you choose a notification channel such as email and create the policy. Cloud Monitoring then notifies the team when usage nears the quota value.
  options:
    a:
      en: |-
        The quota adjuster requests increases automatically instead of informing the team, so the team can't decide when to request an increase.
    c:
      en: |-
        Budget alerts are based on spending, not on quota usage, so they can't tell when the GPU quota is nearly reached.
    d:
      en: |-
        This alert fires only after requests have already failed, and it needs more configuration than the built-in usage alert.
references:
  - title: "Set up quota alerts and monitoring | Cloud Quotas | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/quotas/set-up-quota-alerts
