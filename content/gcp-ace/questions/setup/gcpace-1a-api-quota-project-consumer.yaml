id: gcpace-1a-api-quota-project-consumer
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers at an analytics firm run gcloud commands against projects owned by clients. The API quota must be charged to the firm's project `shared-quota`, so the developers add `--billing-project=shared-quota` to their commands. The commands now fail with a permission error about `serviceusage.services.use` on `shared-quota`.

    What should you do to fix the error, following the principle of least privilege?
body:
  options:
    - id: a
      text: { en: "Grant the developers the Service Usage Admin role on the `shared-quota` project." }
    - id: b
      text: { en: "Grant the developers the Service Usage Viewer role on the `shared-quota` project." }
    - id: c
      text: { en: "Grant the developers the Billing Account User role on the billing account of `shared-quota`." }
    - id: d
      text: { en: "Grant the developers the Service Usage Consumer role on the `shared-quota` project." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Using a project as the quota project of a request requires the `serviceusage.services.use` permission on that project. The Service Usage Consumer role contains it without the permissions to enable or disable services.
  options:
    a: { en: "Service Usage Admin includes the permission, but it also lets the developers enable and disable services, which isn't needed." }
    b: { en: "Service Usage Viewer can inspect services but doesn't include `serviceusage.services.use`." }
    c: { en: "Billing Account User lets a principal link projects to the billing account; it doesn't grant use of a project for quota." }
references:
  - title: "Set the quota project | Cloud Quotas | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/quotas/set-quota-project
  - title: "Service Usage roles and permissions | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/roles-permissions/serviceusage
