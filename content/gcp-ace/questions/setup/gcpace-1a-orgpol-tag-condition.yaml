id: gcpace-1a-orgpol-tag-condition
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A university wants to enforce the `compute.requireOsLogin` boolean constraint on all projects of its organization, except the student sandbox projects. The sandbox projects are spread across several folders, and new ones are created every semester.

    Which two actions should you perform? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Add the label `env=sandbox` to each sandbox project, and reference the label in a condition of the organization policy." }
    - id: b
      text: { en: "Create the tag key `env` with the value `sandbox` on the organization, and bind that tag value to each sandbox project." }
    - id: c
      text: { en: "Grant the Organization Policy Administrator role to the owners of the sandbox projects so that they can turn off enforcement." }
    - id: d
      text: { en: "Create an IAM deny policy on the organization that denies OS Login permissions to the principals of the sandbox projects." }
    - id: e
      text: { en: "At the organization, add a rule with enforcement off if `resource.matchTag('ORGANIZATION_ID/env', 'sandbox')` is true, and an enforcing rule." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Organization policies can be enforced conditionally with tags bound to organizations, folders, and projects. Binding the `env/sandbox` tag value to the sandbox projects and adding a conditional rule that uses `resource.matchTag()` exempts them, while the unconditional rule enforces the constraint everywhere else, including future projects that don't carry the tag.
  options:
    a: { en: "Organization policy conditions evaluate tags, not labels; labels can't scope a policy." }
    c: { en: "This hands policy control to many people, who could change any constraint, and requires manual action on each new project." }
    d: { en: "Deny policies restrict IAM permissions; they don't change whether the OS Login constraint is enforced on a project." }
references:
  - title: "Scope organization policies with tags | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/tags-organization-policy
