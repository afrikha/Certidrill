id: gcpace-1b-loc-machine-type-zones
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company plans to run its trading engine on c4d-standard-4 VMs. Machine series aren't offered in every zone, so before the architects choose the deployment regions, they need the list of zones where this machine type is supported.

    Which command returns this list?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute zones describe us-east4-a`
    - id: b
      text:
        en: |-
          `gcloud compute regions list --filter="name~^us-"`
    - id: c
      text:
        en: |-
          `gcloud compute images list --filter="family~c4d"`
    - id: d
      text:
        en: |-
          `gcloud compute machine-types list --filter="name=c4d-standard-4"`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Machine types are zonal resources, so `gcloud compute machine-types list` returns one entry for each zone where a machine type is supported. Filtering on the machine type name returns exactly the zones that offer c4d-standard-4, including AI zones; `--format="value(zone)"` keeps only the zone names.
  options:
    a:
      en: |-
        Describing one zone shows details such as its available CPU platforms, but not the list of zones that support a machine type.
    b:
      en: |-
        This lists the regions with their status and main quotas, without any machine type information.
    c:
      en: |-
        Images are operating system images, not machine types; their names say nothing about where a machine type is offered.
references:
  - title: "View available regions and zones | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/regions-zones/viewing-regions-zones
