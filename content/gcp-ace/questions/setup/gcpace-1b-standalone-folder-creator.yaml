id: gcpace-1b-standalone-folder-creator
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer signed up for the Free Trial, and a standalone organization was created for her Google Account. She is the only Organization Owner and has the Organization Administrator role. When she tries to create a folder under the organization in the console, she gets a permission error. She asks you why before she changes anything.

    What explains the error?
body:
  options:
    - id: a
      text:
        en: |-
          A standalone organization can't contain folders until a Cloud Identity super administrator of a verified domain claims it.
    - id: b
      text:
        en: |-
          A standalone organization must have at least two Organization Owners before folders can be created under it.
    - id: c
      text:
        en: |-
          Neither of her roles includes the permission to create folders; Organization Administrator lets her grant IAM roles, but creating folders requires an additional role.
    - id: d
      text:
        en: |-
          Her Organization Owner role takes effect only after she accepts the invitation email sent when the organization was created.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Organization Owner role controls owners, administrators and the organization's lifecycle, and the Organization Administrator role lets her define allow and deny policies, grant IAM roles and view the hierarchy. Neither includes permissions such as creating folders or projects, which require additional roles. Because she can grant roles, she can then grant herself a role that allows folder creation.
  options:
    a:
      en: |-
        Claiming is optional: it lets a super administrator of a verified domain take over standalone organizations created by users of that domain. Folders don't depend on it.
    b:
      en: |-
        A standalone organization needs at least one active Google Account as owner; a second owner adds continuity but no folder permission.
    d:
      en: |-
        The account that signs up becomes Organization Owner automatically; invitations apply only to owners added later.
references:
  - title: "Set up standalone organizations | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/standalone-organization-overview
