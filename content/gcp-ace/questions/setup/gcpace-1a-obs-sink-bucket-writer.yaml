id: gcpace-1a-obs-sink-bucket-writer
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In the project `checkout-prod`, you are creating two sinks for application logs. The sink `local-app` routes them to the user-defined log bucket `app-logs` in `checkout-prod` itself. The sink `central-app` routes them to the log bucket `app-logs-central` in the project `obs-central`. You must make only the IAM grants that are required for both sinks to write.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Grant the Logs Writer and Logs Bucket Writer roles on `checkout-prod` to the writer identity of `local-app`, and on `obs-central` to the writer identity of `central-app`." }
    - id: b
      text: { en: "Grant the Logs Writer and Logs Bucket Writer roles on `obs-central` to the writer identity of `central-app`, and make no grant for `local-app`." }
    - id: c
      text: { en: "Grant the Logs Bucket Writer role on `obs-central` to the Cloud Logging service account of `obs-central`, and make no grant for `local-app`." }
    - id: d
      text: { en: "Make no grant: sinks whose destination is a log bucket are authorized automatically, whatever project the bucket is in." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When the destination is a log bucket in the same project as the sink, the sink is authorized automatically, so `local-app` needs no grant. For any other destination, the sink's writer identity must be authorized on the destination: the Logs Writer role (`roles/logging.logWriter`) for every destination, plus Logs Bucket Writer (`roles/logging.bucketWriter`) for a log bucket, granted on the project that holds it.
  options:
    a: { en: "A sink that writes to a log bucket in its own project is authorized automatically, so the grants for `local-app` aren't required." }
    c: { en: "A sink writes with its own writer identity, not with an identity of the destination project." }
    d: { en: "Automatic authorization applies only to a log bucket in the sink's own project; `central-app` writes to another project and needs the grants." }
references:
  - title: "Route logs to supported destinations | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/export/configure_export_v2
