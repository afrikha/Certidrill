id: gcpace-1c-link-project-command
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You created the project `web-shop-prod` with the gcloud CLI. You have the Project Billing Manager role on the project and the Billing Account User role on the billing account `0A1B2C-3D4E5F-6A7B8C`. You need to enable billing on the project from Cloud Shell.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud config set billing/quota_project web-shop-prod`
    - id: b
      text:
        en: |-
          `gcloud billing projects link web-shop-prod --billing-account=0A1B2C-3D4E5F-6A7B8C`
    - id: c
      text:
        en: |-
          `gcloud services enable cloudbilling.googleapis.com --project=web-shop-prod`
    - id: d
      text:
        en: |-
          `gcloud billing accounts describe 0A1B2C-3D4E5F-6A7B8C`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      `gcloud billing projects link` links the project to the billing account given in `--billing-account`, and billing is enabled on a project once it is linked to an active billing account. Your two roles provide the permissions needed on the project side and on the billing account side.
  options:
    a:
      en: |-
        The `billing/quota_project` property only sets which project is charged quota for the API calls made by gcloud; it doesn't link any billing account.
    c:
      en: |-
        Enabling the Cloud Billing API lets applications call that API from the project; it doesn't link the project to a billing account.
    d:
      en: |-
        This command only displays the billing account's details; it changes nothing.
references:
  - title: "gcloud billing projects link | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/billing/projects/link
  - title: "Enable, disable, or change billing for a project | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/modify-project
