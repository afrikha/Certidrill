id: gcpace-1a-folder-creator-role
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `Engineering` folder of an e-commerce company contains a dozen team folders. The platform team must be able to create new subfolders under `Engineering`. It must not be able to delete, rename, or move folders, or change who has access to them.

    Which role should you grant to the platform team's group on the `Engineering` folder?
body:
  options:
    - id: a
      text: { en: "Folder Creator (`roles/resourcemanager.folderCreator`)" }
    - id: b
      text: { en: "Folder Admin (`roles/resourcemanager.folderAdmin`)" }
    - id: c
      text: { en: "Folder Editor (`roles/resourcemanager.folderEditor`)" }
    - id: d
      text: { en: "Project Creator (`roles/resourcemanager.projectCreator`)" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Folder Creator grants the permission to create folders, plus read access to folders and projects. It doesn't include deleting, updating, moving, or setting the IAM policy of folders, so it meets the least-privilege requirement.
  options:
    b: { en: "Folder Admin includes every folder permission, including delete, move, and setting IAM policies, which the team must not have." }
    c: { en: "Folder Editor can delete, undelete, and update (rename) folders, but it doesn't include the permission to create them." }
    d: { en: "Project Creator lets the team create projects, not folders." }
references:
  - title: "Access control for folders with IAM | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/access-control-folders
