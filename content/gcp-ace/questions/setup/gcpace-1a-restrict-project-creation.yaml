id: gcpace-1a-restrict-project-creation
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company set up its organization resource last month and immediately removed the Project Creator grant that the whole domain receives on the organization. Now the group `platform-team@northbeam.example` must be able to create projects, but only inside the `Sandbox` folder, not in other folders or directly under the organization.

    Which grant should you make?
body:
  options:
    - id: a
      text: { en: "Grant the Project Creator role to the platform group on the organization." }
    - id: b
      text: { en: "Grant the Project Creator role to the platform group on the `Sandbox` folder." }
    - id: c
      text: { en: "Grant the Folder Creator role to the platform group on the `Sandbox` folder." }
    - id: d
      text: { en: "Grant the Project IAM Admin role to the platform group on the `Sandbox` folder." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Project Creator provides access to create new projects, and a role granted on a folder is inherited by that folder's descendants only. Granted on `Sandbox`, it lets the group create projects there and nowhere else in the hierarchy. The creator of a project is then automatically granted the Owner role on that project.
  options:
    a: { en: "A grant on the organization is inherited by every folder, so the group could create projects anywhere." }
    c: { en: "Folder Creator allows creating folders only; creating projects requires the Project Creator role." }
    d: { en: "Project IAM Admin manages allow policies on projects; it doesn't include the permission to create projects." }
references:
  - title: "Set up a Google Cloud organization resource | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-organization
  - title: "Access control for projects with IAM | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/access-control-proj
