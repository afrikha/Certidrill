id: gcpace-1b-standalone-rename
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data analytics startup received a standalone organization when it signed up, and the organization is named after the founder's username. The company now wants to rename it after the business, Lumenfield Analytics, whose website is lumenfield.io.

    Which new organization name can you set on the Organization details page?
body:
  options:
    - id: a
      text:
        en: |-
          `lumenfield.io`
    - id: b
      text:
        en: |-
          `lumenfield-analytics`
    - id: c
      text:
        en: |-
          `Lumenfield Google Cloud`
    - id: d
      text:
        en: |-
          `lumenfield_analytics`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A standalone organization name can contain only letters, numbers and hyphens, so `lumenfield-analytics` is accepted. Owners can rename the organization at any time from the Organization details page.
  options:
    a:
      en: |-
        Domain names are reserved for Cloud Identity and Google Workspace organizations, and the dot isn't an allowed character.
    c:
      en: |-
        Spaces aren't allowed, and names can't contain common phrases such as "Google Cloud".
    d:
      en: |-
        The underscore isn't allowed: only letters, numbers and hyphens are.
references:
  - title: "Delete, restore, and rename standalone organizations | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/delete-standalone-org
