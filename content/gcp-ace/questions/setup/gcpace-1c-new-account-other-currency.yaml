id: gcpace-1c-new-account-other-currency
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has a self-serve Cloud Billing account that was created with the United States as its country, so it is billed in USD. The company opens a subsidiary in France, a separate legal entity, that must be billed in EUR and pay with its own bank card. Both entities will keep using Google Cloud.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the settings of the existing billing account to change its country to France and its currency to EUR.
    - id: b
      text:
        en: |-
          Create a subaccount of the existing billing account for the subsidiary, and select EUR as its currency.
    - id: c
      text:
        en: |-
          Add the subsidiary's card to the existing payments profile, and make it the primary payment method.
    - id: d
      text:
        en: |-
          Create a new billing account with France as its country and a payments profile for the subsidiary.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The currency of a Cloud Billing account is set automatically from the country chosen at creation, and neither can be changed later: another country requires a new billing account. A new account with France as its country is billed in EUR, its payments profile holds the subsidiary's legal details and card, and you then link the subsidiary's projects to it.
  options:
    a:
      en: |-
        The country and currency of a billing account can't be changed after it is created.
    b:
      en: |-
        Subaccounts are intended for resellers: the parent account, which must use invoiced billing, pays for all subaccount usage, so the subsidiary wouldn't pay its own costs.
    c:
      en: |-
        The account would still be billed in USD under the US entity's payments profile, and the US entity's costs would also be charged to the subsidiary's card.
references:
  - title: "Create a new self-serve Cloud Billing account | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/create-billing-account
  - title: "Cloud Billing overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/concepts
