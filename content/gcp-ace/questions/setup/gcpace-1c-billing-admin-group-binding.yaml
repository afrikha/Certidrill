id: gcpace-1c-billing-admin-group-binding
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Luis created the self-serve Cloud Billing account `01A2B3-C4D5E6-F7A8B9` for a startup and is its only administrator. To avoid an account without any administrator if Luis leaves, the members of the Google group `billing-admins@example.com` must also be able to manage the account's payment methods, its users and its linked projects.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud projects add-iam-policy-binding finops-prod --member=group:billing-admins@example.com --role=roles/billing.admin`.
    - id: b
      text:
        en: |-
          Run `gcloud billing accounts add-iam-policy-binding 01A2B3-C4D5E6-F7A8B9 --member=group:billing-admins@example.com --role=roles/billing.user`.
    - id: c
      text:
        en: |-
          Run `gcloud billing accounts add-iam-policy-binding 01A2B3-C4D5E6-F7A8B9 --member=group:billing-admins@example.com --role=roles/billing.admin`.
    - id: d
      text:
        en: |-
          Run `gcloud billing accounts add-iam-policy-binding 01A2B3-C4D5E6-F7A8B9 --member=group:billing-admins@example.com --role=roles/billing.costsManager`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Billing Account Administrator, granted in the billing account's IAM policy, manages payment methods, the roles of other users and the links to projects. Google recommends having more than one administrator: an account with no active administrator is not closed automatically and keeps charging its payment method.
  options:
    a:
      en: |-
        Billing accounts are not children of projects, so a binding in a project's IAM policy gives no access to the billing account; billing account roles are granted on the billing account or on the organization.
    b:
      en: |-
        Billing Account User only lets principals link projects to the account; it doesn't let them manage payment methods or users.
    d:
      en: |-
        Billing Account Costs Manager manages budgets and views and exports cost data, but it doesn't manage payment methods, users or project links.
references:
  - title: "gcloud billing accounts add-iam-policy-binding | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/billing/accounts/add-iam-policy-binding
  - title: "Cloud Billing access control and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/billing-access
