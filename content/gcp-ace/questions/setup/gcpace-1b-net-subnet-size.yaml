id: gcpace-1b-net-subnet-size
objective: "1.1.9"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A hospital is preparing the IP plan of a custom mode VPC network that will be connected to its on-premises network. Each regional application subnet must hold 60 VMs, each with one internal IPv4 address, and the hospital wants the smallest primary IPv4 range that fits, to save address space.

    Which prefix length should each subnet's primary range use?
body:
  options:
    - id: a
      text:
        en: |-
          /28
    - id: b
      text:
        en: |-
          /27
    - id: c
      text:
        en: |-
          /26
    - id: d
      text:
        en: |-
          /25
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Google Cloud reserves four addresses in every primary IPv4 subnet range: the network address, the default gateway, the second-to-last address and the broadcast address. A /26 range has 64 addresses, which leaves exactly 60 usable addresses for the VMs.
  options:
    a:
      en: |-
        A /28 range has 16 addresses, so only 12 are usable.
    b:
      en: |-
        A /27 range has 32 addresses, so only 28 are usable.
    d:
      en: |-
        A /25 range fits the VMs with 124 usable addresses, but it isn't the smallest range that fits.
references:
  - title: "Subnets | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/subnets
