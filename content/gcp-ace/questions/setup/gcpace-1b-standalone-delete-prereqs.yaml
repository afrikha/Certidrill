id: gcpace-1b-standalone-delete-prereqs
objective: "1.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A training company used a standalone organization for a proof of concept and now wants to delete it. You are one of its two Organization Owners. The organization contains two folders, five projects, a tag key attached to several projects, and a hierarchical firewall policy associated with the organization.

    Which two actions must you complete before you delete the organization from the Organization details page? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Delete all the projects and folders that were created under the organization.
    - id: b
      text:
        en: |-
          Remove the other Organization Owner so that you are the only owner left.
    - id: c
      text:
        en: |-
          Remove the tag key and the hierarchical firewall policy from the organization.
    - id: d
      text:
        en: |-
          Remove your own Organization Owner role so that the organization has no owner left.
    - id: e
      text:
        en: |-
          Claim the organization from the Admin Governance page so that it's managed by Cloud Identity.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Before an Organization Owner can delete a standalone organization, all the projects and folders created under it must be deleted, and active organization resources such as tags, hierarchical firewall policies and access policies must be removed. The deletion then starts a 30-day soft-delete phase during which the organization can be restored.
  options:
    b:
      en: |-
        Several owners can exist when the organization is deleted; every organization owner receives the confirmation email.
    d:
      en: |-
        A standalone organization must always keep at least one active Google Account as owner, and only an owner can delete it.
    e:
      en: |-
        Claiming is done by a Cloud Identity super administrator of a verified domain; it isn't a step of deleting a standalone organization.
references:
  - title: "Delete, restore, and rename standalone organizations | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/delete-standalone-org
  - title: "Set up standalone organizations | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/standalone-organization-overview
