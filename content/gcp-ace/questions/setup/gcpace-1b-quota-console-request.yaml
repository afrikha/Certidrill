id: gcpace-1b-quota-console-request
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company's project needs 96 more vCPUs in us-east1 for a seasonal batch job, and the regional CPUs quota of the project is too low to create the VMs. You have the Quota Administrator role on the project, and you want to submit the request from the Google Cloud console.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Open Compute Engine > Reservations, and create a reservation of 96 vCPUs in us-east1 for the batch job.
    - id: b
      text:
        en: |-
          Open IAM & Admin > Quotas & System Limits, select the CPUs quota of us-east1, click Edit, enter the new value, and submit the request.
    - id: c
      text:
        en: |-
          Open IAM & Admin > Quotas & System Limits, select the CPUs quota of us-east1, and choose Create usage alert to report the shortage.
    - id: d
      text:
        en: |-
          Open Billing > Budgets & alerts, raise the amount of the project's budget, and save the new alert thresholds.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Quota adjustments are requested on the Quotas & System Limits page under IAM & Admin: you select the quota, click Edit, enter the new value (and a justification if asked), and submit the request. Some requests are reviewed, and you receive an email when the request is approved or denied.
  options:
    a:
      en: |-
        A reservation consumes regional quota like the VMs it reserves; it doesn't raise the quota, so the reservation fails for the same reason.
    c:
      en: |-
        A usage alert only notifies your own notification channel when usage nears the quota; it doesn't send any adjustment request to Google.
    d:
      en: |-
        Budgets track spending and send alerts; their amount has no effect on quota values.
references:
  - title: "View and manage quotas | Cloud Quotas | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/quotas/help/request_increase
