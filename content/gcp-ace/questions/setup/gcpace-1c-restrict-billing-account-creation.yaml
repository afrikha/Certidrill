id: gcpace-1c-restrict-billing-account-creation
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Example Corp created its Google Cloud organization last month and kept the default IAM policy of the organization resource. An audit finds several new self-serve billing accounts in the organization that developers created with personal cards, which causes untracked spend. From now on, only the members of the group `finance-team@example.com` must be able to create billing accounts in the organization.

    Which two actions should you take? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Remove the Project Creator role from the `domain:example.com` principal on the organization.
    - id: b
      text:
        en: |-
          Remove the Billing Account Creator role from the `domain:example.com` principal on the organization.
    - id: c
      text:
        en: |-
          Grant `finance-team@example.com` the Billing Account Administrator role on the organization.
    - id: d
      text:
        en: |-
          Grant `finance-team@example.com` the Billing Account Creator role on the organization.
    - id: e
      text:
        en: |-
          Grant `finance-team@example.com` the Billing Account Creator role on each existing billing account.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      When an organization resource is created, all users of the domain receive the Project Creator and Billing Account Creator roles on the organization, which is why any developer could create a billing account. Removing Billing Account Creator from the domain and granting it to the finance group on the organization limits creation to that group.
  options:
    a:
      en: |-
        Project Creator controls who can create projects, not billing accounts; developers could still create billing accounts.
    c:
      en: |-
        Billing Account Administrator manages existing billing accounts but can't create new ones.
    e:
      en: |-
        Billing Account Creator can be granted only on the organization; a binding on a billing account doesn't allow creating accounts.
references:
  - title: "Set up a Google Cloud organization resource | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-organization
  - title: "Cloud Billing access control and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/billing-access
