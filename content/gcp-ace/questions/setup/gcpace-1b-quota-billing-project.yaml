id: gcpace-1b-quota-billing-project
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A platform engineer has the legacy basic Editor role (`roles/editor`) on the project app-prod, where the Cloud Quotas API is enabled. Signed in to gcloud with a user account, the engineer runs `gcloud quotas info list --service=compute.googleapis.com --project=app-prod`. The call fails with an error that says that no quota project is set.

    What should the engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Ask an administrator to grant the Quota Administrator role on app-prod, and run the same command again.
    - id: b
      text:
        en: |-
          Run `gcloud auth application-default login`, and run the same command again.
    - id: c
      text:
        en: |-
          Run the same command again with the flag `--billing-project=app-prod` added.
    - id: d
      text:
        en: |-
          Run `gcloud components install beta`, and run the command again as `gcloud beta quotas info list`.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With user credentials, some APIs need a quota project that is billed for the call. For gcloud, the documented fix is to add `--billing-project` to the command or to set the `billing/quota_project` property. The engineer's Editor role already gives the permissions needed on app-prod.
  options:
    a:
      en: |-
        The error is about the missing quota project, not about permissions, and Editor already includes the quota permissions.
    b:
      en: |-
        Application Default Credentials are used by client libraries and applications; this gcloud command keeps the same user credentials and the same missing quota project.
    d:
      en: |-
        The release track doesn't set a quota project, so the beta command fails in the same way.
references:
  - title: "Troubleshoot quota errors | Cloud Quotas | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/quotas/troubleshoot
