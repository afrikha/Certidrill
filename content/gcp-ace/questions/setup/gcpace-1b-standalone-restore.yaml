id: gcpace-1b-standalone-restore
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Twelve days ago, an Organization Owner of a consulting firm deleted the firm's standalone organization by mistake. The organization ID is referenced in the firm's automation and must not change. You have the Organization Administrator role on the organization.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Sign up again for the Free Trial with the same Google Account so that the organization is created again.
    - id: b
      text:
        en: |-
          Ask a Cloud Identity super administrator to claim the deleted organization from the Admin Governance page.
    - id: c
      text:
        en: |-
          Open the My organizations page, select the organization, and click Restore on its Organization details page.
    - id: d
      text:
        en: |-
          Wait until the organization is purged, and then create a new organization and update the automation.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A deleted standalone organization stays in a 30-day soft-delete phase before it's purged. Within those 30 days, a user with the Organization Administrator role can find it on the My organizations page and restore it from the Organization details page, with the same organization ID.
  options:
    a:
      en: |-
        Standalone organizations are created only for new Free Trial customers, and a new organization would get a new ID.
    b:
      en: |-
        Claiming changes the owners of an active standalone organization; it doesn't restore a deleted one.
    d:
      en: |-
        A new organization gets a new ID, which breaks the requirement, while the original can still be restored.
references:
  - title: "Delete, restore, and rename standalone organizations | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/delete-standalone-org
