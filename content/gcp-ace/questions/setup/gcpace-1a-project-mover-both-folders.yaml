id: gcpace-1a-project-mover-both-folders
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The project `claims-batch` is in the folder `Claims-Dev` and must be moved to the folder `Claims-Prod` in the same organization. A release engineer will perform the move. You must give the engineer only the access needed, by using a predefined role, and you must not grant any role on the organization.

    Which grant should you make?
body:
  options:
    - id: a
      text: { en: "The Project Mover role on the `claims-batch` project and on the `Claims-Prod` folder" }
    - id: b
      text: { en: "The Project Mover role on the `Claims-Prod` folder only" }
    - id: c
      text: { en: "The Project Mover role on the `Claims-Dev` folder and on the `Claims-Prod` folder" }
    - id: d
      text: { en: "The Folder Admin role on `Claims-Prod` and the Folder Viewer role on `Claims-Dev`" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Moving a project requires `resourcemanager.projects.update` on the project and `resourcemanager.projects.move` on both the source and the destination parent. The Project Mover role granted on `Claims-Dev` and `Claims-Prod` provides both: the project inherits the update permission from its current folder, and the move permission is present on both parents.
  options:
    a: { en: "The move permission is also required on the source folder `Claims-Dev`; a grant on the project doesn't provide it on that folder." }
    b: { en: "The move permission is also required on the source folder `Claims-Dev`, where the engineer has no grant." }
    d: { en: "Folder Viewer gives no move permission on the source folder, and Folder Admin on the destination is broader than needed." }
references:
  - title: "Move a project | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/moving-projects-folders
