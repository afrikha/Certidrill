id: gcpace-1b-cai-export-partitioned
objective: "1.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's governance team is writing a weekly job that runs `gcloud asset export --organization=509331884 --content-type=resource --bigquery-table=projects/gov-prj/datasets/gov/tables/asset_snapshots`. The first run creates the table. Every later run must keep the earlier weekly snapshots in the same table, so that analysts can compare snapshots with SQL.

    Which flag should the command include?
body:
  options:
    - id: a
      text:
        en: |-
          `--partition-key=read-time`
    - id: b
      text:
        en: |-
          `--output-bigquery-force`
    - id: c
      text:
        en: |-
          `--per-asset-type`
    - id: d
      text:
        en: |-
          `--snapshot-time="2026-11-23"`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With `--partition-key`, the export writes to a partitioned table with the readTime and requestTime columns, one of which is the partition key. Each new export is appended to its own partition and the other partitions stay intact, so the weekly snapshots accumulate in one table and can be compared on readTime.
  options:
    b:
      en: |-
        On a non-partitioned table, this flag overwrites the whole table with the new snapshot, so the earlier snapshots are lost.
    c:
      en: |-
        This splits the export into one table per asset type; it doesn't keep successive snapshots in the same table.
    d:
      en: |-
        This only sets the time of the snapshot; the second run still fails because the destination table isn't empty.
references:
  - title: "Export asset metadata to BigQuery | Cloud Asset Inventory | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/export-bigquery
