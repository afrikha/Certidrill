id: gcpace-1b-quota-gcloud-views
objective: "1.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Before a migration wave, an engineer at a retail company must check two Compute Engine quotas of the default gcloud project from Cloud Shell: the limit and usage of the in-use IP addresses quota in us-east4, and the limit and usage of the project-wide quota on the number of VPC networks. The engineer doesn't want to use the console.

    Which two commands should the engineer run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute regions describe us-east4`
    - id: b
      text:
        en: |-
          `gcloud compute zones describe us-east4-a`
    - id: c
      text:
        en: |-
          `gcloud compute project-info describe`
    - id: d
      text:
        en: |-
          `gcloud compute networks list`
    - id: e
      text:
        en: |-
          `gcloud compute addresses list --filter="region:us-east4"`
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      `gcloud compute regions describe` returns the regional quotas of a region, such as CPUS, IN_USE_ADDRESSES and STATIC_ADDRESSES, each with its limit and usage. `gcloud compute project-info describe` returns the Compute Engine project resource, which contains the global quotas of the project, such as the number of VPC networks.
  options:
    b:
      en: |-
        Describing a zone shows its status and details such as the available CPU platforms; quotas are reported at the region and project levels, not per zone.
    d:
      en: |-
        This command lists the networks that exist, which gives a count but neither the quota's limit nor its official usage value.
    e:
      en: |-
        This command lists reserved addresses only; the in-use addresses quota also counts ephemeral external addresses, and the list doesn't show the limit.
references:
  - title: "View available regions and zones | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/regions-zones/viewing-regions-zones
  - title: "Allocation quotas | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/resource-usage
