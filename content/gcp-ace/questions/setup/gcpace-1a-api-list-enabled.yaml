id: gcpace-1a-api-list-enabled
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before an audit, you must produce the list of APIs that are currently enabled in the project `hr-portal`, and no other APIs. Your gcloud configuration's default project is a different project.

    Which command should you run?
body:
  options:
    - id: a
      text: { en: "`gcloud services list --available --project=hr-portal`" }
    - id: b
      text: { en: "`gcloud projects describe hr-portal`" }
    - id: c
      text: { en: "`gcloud config list --format=\"text(core.project)\"`" }
    - id: d
      text: { en: "`gcloud services list --enabled --project=hr-portal`" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `gcloud services list --enabled` returns the services that the project has enabled (it is also the default mode), and `--project` targets `hr-portal` instead of the configuration's default project.
  options:
    a: { en: "`--available` returns every service the project can enable, including those already enabled, so the list contains more than the enabled APIs." }
    b: { en: "This shows the project's metadata, such as its number, parent, and lifecycle state, not its enabled APIs." }
    c: { en: "This prints the default project of the active gcloud configuration, not any list of APIs." }
references:
  - title: "gcloud services list | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/services/list
