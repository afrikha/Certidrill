id: gcpace-1b-wfif-pool-admin-role
objective: "1.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An identity engineer at a logistics company must create and manage the workforce identity pools and providers that let employees sign in with the corporate IdP. The engineer must not be able to manage other IAM settings. You must follow the principle of least privilege.

    Which role should you grant to the engineer, and where?
body:
  options:
    - id: a
      text:
        en: |-
          IAM Workforce Pool Admin (`roles/iam.workforcePoolAdmin`) on the organization
    - id: b
      text:
        en: |-
          IAM Workload Identity Pool Admin (`roles/iam.workloadIdentityPoolAdmin`) on the organization
    - id: c
      text:
        en: |-
          IAM Workforce Pool Admin (`roles/iam.workforcePoolAdmin`) on a project of the organization
    - id: d
      text:
        en: |-
          Organization Administrator (`roles/resourcemanager.organizationAdmin`) on the organization
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Workforce identity pools are configured at the organization level, and Google's setup guides require the IAM Workforce Pool Admin role on the organization to configure them. The role covers pools and providers without the right to change other allow policies.
  options:
    b:
      en: |-
        Workload Identity Pool Admin manages workload identity pools for automated workloads, not workforce pools for employees.
    c:
      en: |-
        Workforce pools are children of the organization, so a grant on a project doesn't apply to them.
    d:
      en: |-
        Organization Administrator lets the engineer manage every allow policy of the organization, which breaks least privilege.
references:
  - title: "Configure Workforce Identity Federation with Microsoft Entra ID and sign in users | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workforce-sign-in-microsoft-entra-id
