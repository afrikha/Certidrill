id: gcpace-1c-disable-billing-blockers
objective: "1.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You must disable billing on the project `legacy-batch`, which is no longer used. You have the Project Billing Manager and Project Browser roles on the project and the Billing Account Administrator role on its billing account, but the attempt fails.

    Which two conditions could explain the failure? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          The project still contains running Compute Engine VMs.
    - id: b
      text:
        en: |-
          The project has a budget that is connected to a Pub/Sub topic.
    - id: c
      text:
        en: |-
          The project has an active resource-based committed use discount.
    - id: d
      text:
        en: |-
          The project is a Shared VPC host project with attached service projects.
    - id: e
      text:
        en: |-
          The link between the project and its billing account is locked.
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |-
      Cloud Billing doesn't let you disable billing on a project that has active or pending committed use discounts. A locked link between a project and its billing account must be unlocked before billing can be changed or disabled on the project.
  options:
    a:
      en: |-
        Running resources don't block the change: when billing is disabled, the billable resources of the project are stopped.
    b:
      en: |-
        Budgets and their Pub/Sub notifications only report on spend; they don't prevent disabling billing.
    d:
      en: |-
        Disabling billing on a Shared VPC host project also disables the services in service projects that depend on it, but it isn't blocked.
references:
  - title: "Enable, disable, or change billing for a project | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/modify-project
