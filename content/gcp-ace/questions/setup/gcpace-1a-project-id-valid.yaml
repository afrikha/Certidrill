id: gcpace-1a-project-id-valid
objective: "1.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An insurance company is creating the projects of a new claims platform. Its naming standard proposes the project IDs below, none of which has ever been used.

    Which two project IDs can you use when you create the projects? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "`Claims-Portal-Prod`" }
    - id: b
      text: { en: "`claims-portal-prod`" }
    - id: c
      text: { en: "`2027-claims-prod`" }
    - id: d
      text: { en: "`claims-portal-`" }
    - id: e
      text: { en: "`clm-dw`" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A project ID must be 6 to 30 characters long, contain only lowercase letters, digits, and hyphens, start with a letter, and not end with a hyphen. `claims-portal-prod` (18 characters) and `clm-dw` (exactly 6 characters) meet every rule.
  options:
    a: { en: "Project IDs can't contain uppercase letters." }
    c: { en: "A project ID must start with a letter, not a digit." }
    d: { en: "A project ID can't end with a hyphen." }
references:
  - title: "Create projects | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-projects
