id: gcpace-1c-list-linked-projects
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A finance auditor asks for the list of all projects that are charged to the billing account `01F2E3-D4C5B6-A79807`. You have the required permissions on the billing account.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud billing projects list --billing-account=01F2E3-D4C5B6-A79807`
    - id: b
      text:
        en: |-
          `gcloud projects list --format="table(projectId,parent.id)"`
    - id: c
      text:
        en: |-
          `gcloud billing accounts describe 01F2E3-D4C5B6-A79807`
    - id: d
      text:
        en: |-
          `gcloud billing accounts get-iam-policy 01F2E3-D4C5B6-A79807`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `gcloud billing projects list` with the required `--billing-account` flag lists the projects linked to that billing account, which are the projects it pays for.
  options:
    b:
      en: |-
        This command lists the projects you can access with their parent folder or organization, whatever billing account pays for them.
    c:
      en: |-
        This command shows the billing account's own metadata, such as its name and whether it is open, not its linked projects.
    d:
      en: |-
        This command shows who has which role on the billing account, not which projects are linked to it.
references:
  - title: "gcloud billing projects list | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/billing/projects/list
