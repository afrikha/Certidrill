id: gcpace-1b-quota-adjuster
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company's Compute Engine usage in its project grows steadily, and twice this quarter VM creation failed because a regional quota had been reached. The operations team wants Google Cloud to submit quota increase requests automatically when peak usage approaches a quota value. It doesn't want to write or maintain any script.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a usage alert on each Compute Engine quota, and send the alerts to the operations team's email channel.
    - id: b
      text:
        en: |-
          Create a Cloud Scheduler job that runs `gcloud quotas preferences create` every week with higher preferred values.
    - id: c
      text:
        en: |-
          Enable the quota adjuster on the Configurations tab of the Quotas & System Limits page of the project.
    - id: d
      text:
        en: |-
          Create reservations in each region the project uses, sized for the capacity expected next quarter.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The quota adjuster monitors usage of the supported quotas, including Compute Engine quotas, and submits increase requests for you when peak usage approaches the quota value, typically for 10 to 20 % more. You turn it on per project from the Configurations tab of the Quotas & System Limits page; the project needs enough usage history for the option to be available.
  options:
    a:
      en: |-
        Usage alerts only notify the team, which must still submit every request by hand; they don't request increases automatically.
    b:
      en: |-
        A scheduled job that calls the Cloud Quotas API is a custom script to maintain, and it requests fixed values instead of reacting to actual usage.
    d:
      en: |-
        Reservations consume quota instead of raising it, and they bill the reserved capacity even when it's idle.
references:
  - title: "Use the quota adjuster | Cloud Quotas | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/quotas/quota-adjuster
