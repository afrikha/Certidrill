id: gcpace-1c-budget-forecast-command
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You need a recurring monthly budget of 2,000 USD for the project `web-prod`, which is paid by the billing account `01A2B3-C4D5E6-F7A8B9` (billed in USD). The budget must send an alert as soon as the forecast of the month's spend reaches 100% of the amount, so that the team can act before the money is spent. You start the command as follows:

    ```bash
    gcloud billing budgets create --billing-account=01A2B3-C4D5E6-F7A8B9 \
      --display-name="web-prod-monthly" --budget-amount=2000USD \
      --filter-projects=projects/web-prod \
    ```

    Which flags complete the command?
body:
  options:
    - id: a
      text:
        en: |-
          `--calendar-period=month --threshold-rule=percent=1.0`
    - id: b
      text:
        en: |-
          `--calendar-period=month --threshold-rule=percent=100,basis=forecasted-spend`
    - id: c
      text:
        en: |-
          `--calendar-period=month --threshold-rule=percent=1.0,basis=forecasted-spend`
    - id: d
      text:
        en: |-
          `--start-date=2026-12-01 --end-date=2026-12-31 --threshold-rule=percent=1.0,basis=forecasted-spend`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In `--threshold-rule`, `percent` is a number between 0.0 and 1.0 (1.0 means 100%), and `basis=forecasted-spend` triggers the alert on the forecast for the current period instead of the actual spend. `--calendar-period=month` makes the budget recur every month.
  options:
    a:
      en: |-
        Without `basis`, the rule uses `current-spend`, so the alert is sent only when the actual spend reaches 2,000 USD, which is too late.
    b:
      en: |-
        `percent` is expressed as a fraction where 1.0 equals 100%, so the value 100 doesn't describe a 100% threshold.
    d:
      en: |-
        A start and end date define a custom period that doesn't recur, and budgets with a custom time range can't trigger alerts on forecasted costs.
references:
  - title: "gcloud billing budgets create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/billing/budgets/create
  - title: "Create, edit, or delete budgets and budget alerts | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/budgets
