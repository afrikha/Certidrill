id: gcpace-1b-wfif-federated-console
objective: "1.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company has configured Workforce Identity Federation with its Okta tenant and granted IAM roles to the pool's principals. The federated users have no Google Account. They report that they can't sign in at console.cloud.google.com with their Okta credentials.

    What should you tell them to do?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Google Account with their corporate email address, and use it to sign in at console.cloud.google.com.
    - id: b
      text:
        en: |-
          Sign in through the federated console sign-in page at auth.cloud.google, enter the workforce provider name, and authenticate with Okta.
    - id: c
      text:
        en: |-
          Ask an administrator to grant them the Browser role on the organization, and sign in again at console.cloud.google.com.
    - id: d
      text:
        en: |-
          Ask an administrator to create Cloud Identity accounts for them, and sign in at console.cloud.google.com with those accounts.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Workforce pool users use the federated console (console.cloud.google), not the standard console. They start at the sign-in page at auth.cloud.google, enter the provider name in the form `locations/global/workforcePools/POOL_ID/providers/PROVIDER_ID`, and are redirected to their IdP to authenticate.
  options:
    a:
      en: |-
        A new Google Account is a separate identity with none of the roles granted to the pool's principals.
    c:
      en: |-
        The problem is where they sign in, not their permissions: workforce pool users sign in through the federated console, not the standard one.
    d:
      en: |-
        Creating Cloud Identity accounts defeats the purpose of federation, and the new accounts wouldn't have the roles granted to the pool.
references:
  - title: "Configure Workforce Identity Federation with Microsoft Entra ID and sign in users | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workforce-sign-in-microsoft-entra-id
  - title: "Workforce Identity Federation | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/workforce-identity-federation
