id: gcpace-1b-cai-search-us-location
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A European insurer requires every workload of its Claims folder (ID 482910377) to run in EU locations. A compliance analyst who has the Cloud Asset Viewer role on the folder works from a project outside that folder. With a single command, the analyst must list only the resources of the folder's projects that are located in a US region.

    Which command should the analyst run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud asset search-all-resources --scope=folders/482910377 --query="location:us-*"`
    - id: b
      text:
        en: |-
          `gcloud asset search-all-iam-policies --scope=folders/482910377 --query="resource:us-*"`
    - id: c
      text:
        en: |-
          `gcloud asset export --folder=482910377 --content-type=resource --output-path=gs://claims-audit/assets.json`
    - id: d
      text:
        en: |-
          `gcloud asset search-all-resources --query="location:us-*"`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `gcloud asset search-all-resources` searches the resource metadata of every project in the given scope, here the folder, and the `location:us-*` query keeps only the resources located in US regions. The Cloud Asset Viewer role on the folder gives the analyst the search permission on that scope.
  options:
    b:
      en: |-
        This searches IAM allow policies, and the query matches resource names, not resource locations.
    c:
      en: |-
        An export writes the metadata of all the folder's resources to Cloud Storage; it doesn't return only the US resources, and the analyst would still have to filter the file.
    d:
      en: |-
        Without `--scope`, the search runs on the configured gcloud project, which is outside the Claims folder.
references:
  - title: "Search for resources | Cloud Asset Inventory | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/searching-resources
  - title: "gcloud asset search-all-resources | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/asset/search-all-resources
