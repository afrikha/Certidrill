id: gcpace-1b-wfif-group-principalset
objective: "1.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineering company has configured the workforce identity pool corp-pool with a provider for its IdP. The provider maps `google.groups=assertion.groups`, and the IdP sends the group name media-admins for the members of that group. These members must get the Storage Admin role on the project media-assets.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects add-iam-policy-binding media-assets --role=roles/storage.admin --member="group:media-admins"`
    - id: b
      text:
        en: |-
          `gcloud projects add-iam-policy-binding media-assets --role=roles/storage.admin --member="principalSet://iam.googleapis.com/locations/global/workforcePools/corp-pool/group/media-admins"`
    - id: c
      text:
        en: |-
          `gcloud projects add-iam-policy-binding media-assets --role=roles/storage.admin --member="principal://iam.googleapis.com/locations/global/workforcePools/corp-pool/subject/media-admins"`
    - id: d
      text:
        en: |-
          `gcloud projects add-iam-policy-binding media-assets --role=roles/storage.admin --member="principalSet://iam.googleapis.com/projects/482113305/locations/global/workloadIdentityPools/corp-pool/group/media-admins"`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Groups of a workforce identity pool are identified by `principalSet://iam.googleapis.com/locations/global/workforcePools/POOL_ID/group/GROUP_ID`, where the group ID comes from the `google.groups` mapping. Granting the role to this principal set gives it to every federated user whose assertion contains the group.
  options:
    a:
      en: |-
        The `group:` prefix identifies a Google group by its email address in Cloud Identity or Google Workspace, not a group of the external IdP.
    c:
      en: |-
        A `principal://.../subject/...` identifier designates one user by the `google.subject` value, not the members of a group.
    d:
      en: |-
        Identifiers that contain a project number and `workloadIdentityPools` belong to Workload Identity Federation, not to a workforce pool, which has no project in its path.
references:
  - title: "Principal identifiers | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/principal-identifiers
