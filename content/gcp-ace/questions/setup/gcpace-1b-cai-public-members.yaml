id: gcpace-1b-cai-public-members
objective: "1.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After a data leak at a competitor, a hospital's security team must find every resource in its organization (ID 771902145) whose allow policy grants a role to allUsers or allAuthenticatedUsers. Roles can be granted on projects and on individual resources such as buckets. The team has the Cloud Asset Viewer role on the organization.

    What should the team do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud asset search-all-resources --scope=organizations/771902145 --query="memberTypes:(allUsers OR allAuthenticatedUsers)"`.
    - id: b
      text:
        en: |-
          Run `gcloud projects get-iam-policy` for every project of the organization, and search the output for the two principals.
    - id: c
      text:
        en: |-
          Create a Cloud Asset Inventory feed on the organization with the `iam-policy` content type, and read its Pub/Sub messages.
    - id: d
      text:
        en: |-
          Run `gcloud asset search-all-iam-policies --scope=organizations/771902145 --query="memberTypes:(allUsers OR allAuthenticatedUsers)"`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      `gcloud asset search-all-iam-policies` searches the allow policies of every resource in the scope, including resource-level policies such as bucket policies. The `memberTypes:(allUsers OR allAuthenticatedUsers)` query returns the policies that grant access to the public.
  options:
    a:
      en: |-
        Resource search looks at resource metadata, not at allow policies, so it can't match the principals in policy bindings.
    b:
      en: |-
        Project policies don't show roles granted directly on resources such as buckets, and running the command project by project is slow.
    c:
      en: |-
        A feed only reports changes made after it's created; it doesn't list the policies that already grant public access.
references:
  - title: "Search for IAM allow policies on resources | Cloud Asset Inventory | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/searching-iam-policies
