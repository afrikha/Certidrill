id: gcpace-1b-gca-verify-answer
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Gemini Cloud Assist is set up in the project crm-prod. An engineer asks the Gemini Cloud Assist panel how many Cloud SQL instances the project has in US regions, and plans to put the number in a compliance report. Company policy requires every figure in the report to be verifiable. The engineer has the Cloud Asset Viewer role on the project.

    What should the engineer do?
body:
  options:
    - id: a
      text:
        en: |-
          Put the panel's answer in the report, because Gemini Cloud Assist reads the configuration directly from the project's Cloud APIs.
    - id: b
      text:
        en: |-
          Ask the same question again in the full-page view of the panel, and put the number in the report if both answers match.
    - id: c
      text:
        en: |-
          Run a Cloud Asset Inventory search on crm-prod for Cloud SQL instances in US locations, and report its result.
    - id: d
      text:
        en: |-
          Turn off page context sharing in the panel, ask the question again, and put the new answer in the report.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Gemini Cloud Assist, which is in Preview, can access information about the resources of your environment, but Google warns that its output can be plausible yet incorrect and must be validated before use. A Cloud Asset Inventory search on the project, for example `gcloud asset search-all-resources --scope=projects/crm-prod --asset-types=sqladmin.googleapis.com/Instance --query="location:us-*"`, gives a reproducible number for the report.
  options:
    a:
      en: |-
        Even when Gemini Cloud Assist uses data from your environment, its answers can be wrong, so they can't be used unverified.
    b:
      en: |-
        Two identical answers from the same assistant are still unverified; the full-page view uses the same model and data.
    d:
      en: |-
        Page context sharing only lets the panel use the current console page as context; turning it off doesn't make the answer verified.
references:
  - title: "Use Gemini Cloud Assist in the Google Cloud console | Google Cloud Documentation"
    url: https://docs.cloud.google.com/cloud-assist/chat-panel
  - title: "Search for resources | Cloud Asset Inventory | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/searching-resources
