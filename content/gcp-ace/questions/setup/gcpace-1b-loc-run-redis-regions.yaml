id: gcpace-1b-loc-run-redis-regions
objective: "1.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retailer plans to deploy, in a single new region, a Cloud Run service that stores user sessions in a Memorystore for Redis instance in the same region. Before choosing the region, an engineer wants to check from Cloud Shell that both products are offered there.

    Which two commands should the engineer run? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          `gcloud compute regions list`
    - id: b
      text:
        en: |-
          `gcloud run regions list`
    - id: c
      text:
        en: |-
          `gcloud compute zones list`
    - id: d
      text:
        en: |-
          `gcloud redis regions list`
    - id: e
      text:
        en: |-
          `gcloud container get-server-config --location=us-south1`
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Product availability differs from region to region, so each product must be checked. `gcloud run regions list` lists the regions where Cloud Run is available, and `gcloud redis regions list` lists the regions of Memorystore for Redis.
  options:
    a:
      en: |-
        This lists Compute Engine regions; a region where Compute Engine runs doesn't necessarily offer Cloud Run or Memorystore.
    c:
      en: |-
        This lists Compute Engine zones, which says nothing about Cloud Run or Memorystore.
    e:
      en: |-
        This shows the GKE versions and settings available in one location; the retailer doesn't use GKE.
references:
  - title: "Cloud Run locations | Google Cloud Documentation"
    url: https://docs.cloud.google.com/run/docs/locations
  - title: "Global Locations - Regions & Zones | Google Cloud"
    url: https://cloud.google.com/about/locations
