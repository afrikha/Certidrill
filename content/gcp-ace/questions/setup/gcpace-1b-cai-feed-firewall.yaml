id: gcpace-1b-cai-feed-firewall
objective: "1.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The security team of a retail company wants Cloud Asset Inventory to publish a Pub/Sub message each time a VPC firewall rule is created, updated or deleted in the project shop-prod. The topic projects/sec-ops/topics/fw-changes already exists, and the Cloud Asset Inventory service agent can publish to it.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud asset export --project=shop-prod --asset-types=compute.googleapis.com/Firewall --content-type=resource --output-path=gs://sec-ops-audit/fw.json`
    - id: b
      text:
        en: |-
          `gcloud asset search-all-resources --scope=projects/shop-prod --asset-types=compute.googleapis.com/Firewall`
    - id: c
      text:
        en: |-
          `gcloud asset feeds create fw-feed --project=shop-prod --asset-types=compute.googleapis.com/Firewall --content-type=resource --pubsub-topic=projects/sec-ops/topics/fw-changes`
    - id: d
      text:
        en: |-
          `gcloud asset get-history --project=shop-prod --asset-names=//compute.googleapis.com/projects/shop-prod/global/firewalls/allow-web --content-type=resource --start-time=2026-11-01`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Cloud Asset Inventory feed monitors the assets that match its asset names or types and publishes a notification to a Pub/Sub topic when they change. Creating, updating or deleting a feed can take up to 10 minutes to take effect.
  options:
    a:
      en: |-
        An export writes a one-time snapshot of the firewall rules to Cloud Storage; it doesn't notify anyone of later changes.
    b:
      en: |-
        A search returns the current firewall rules once; it doesn't publish any message when they change.
    d:
      en: |-
        This returns the past changes of one firewall rule; it doesn't send notifications for future changes to any rule.
references:
  - title: "Monitor asset changes with Pub/Sub | Cloud Asset Inventory | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/monitor-asset-changes
