id: gcpace-1c-export-gke-cost-allocation
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Six teams share the GKE Standard cluster `shop-prod`, and each team deploys its workloads in its own namespace. The billing account currently exports only standard usage cost data to BigQuery. Finance wants to query the cluster's costs per namespace in BigQuery.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud container clusters update shop-prod --enable-cost-allocation`, and keep the standard usage cost export.
    - id: b
      text:
        en: |-
          Enable the detailed usage cost export only, because it breaks GKE costs down by namespace automatically.
    - id: c
      text:
        en: |-
          Add a team label to the `shop-prod` cluster, and group the standard usage cost export by that label.
    - id: d
      text:
        en: |-
          Enable the detailed usage cost export, and run `gcloud container clusters update shop-prod --enable-cost-allocation`.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      GKE cost allocation adds the cluster, namespace, workload and Kubernetes labels of Pods as labels on the billing data, and this data appears only in the detailed usage cost export. Both must be enabled; data can take up to three days to appear and is not backfilled.
  options:
    a:
      en: |-
        GKE cost allocation data is available only in the detailed usage cost export, not in the standard export.
    b:
      en: |-
        Without GKE cost allocation enabled on the cluster, the detailed export doesn't break the cluster's costs down by namespace.
    c:
      en: |-
        A cluster label applies to the whole cluster, so it can't separate the costs of the six teams that share it.
references:
  - title: "Get key spending insights for your GKE resource allocation and cluster costs | Google Kubernetes Engine (GKE) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/cost-allocations
  - title: "Export Cloud Billing data to BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery
