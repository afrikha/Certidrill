id: gcpace-1b-standalone-org-signup
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The two founders of a design startup are new to Google Cloud and use personal Google Accounts. They don't own a DNS domain, and they don't want to buy one or to manage Cloud Identity or Google Workspace. From the start, they want an organization resource at the root of their resource hierarchy so that they can use folders and organization policies.

    What should they do?
body:
  options:
    - id: a
      text:
        en: |-
          Sign up for the Free Trial with one of their Google Accounts, accept the terms in the console, and use the standalone organization that is created.
    - id: b
      text:
        en: |-
          Register a DNS domain, sign up for Cloud Identity Free with it, and verify the domain so that the organization resource is created.
    - id: c
      text:
        en: |-
          Create their projects under No organization, and group them later in a folder named after the startup.
    - id: d
      text:
        en: |-
          Open a Cloud Customer Care case to request an organization resource for one of their Google Accounts.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Standalone organizations are available to new Free Trial customers: when a new customer signs up with a Google Account, accepts the terms in the console and signs in, an organization resource is created automatically, without Cloud Identity or a DNS domain. The account owner becomes its Organization Owner and Organization Administrator.
  options:
    b:
      en: |-
        A Cloud Identity organization needs a domain and Cloud Identity administration, which the founders explicitly don't want.
    c:
      en: |-
        Projects under No organization have no organization resource above them, and folders can only be created under an organization.
    d:
      en: |-
        No support case is needed: the standalone organization is created by the sign-up flow itself.
references:
  - title: "Set up standalone organizations | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/standalone-organization-overview
