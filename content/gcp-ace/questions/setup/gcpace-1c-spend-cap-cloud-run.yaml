id: gcpace-1c-spend-cap-cloud-run
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A startup's development project hosts a public demo on Cloud Run, and a traffic spike last month cost far more than planned. From now on, when the estimated monthly Cloud Run cost of the project exceeds 300 USD, new Cloud Run usage must be paused automatically until someone reviews the situation. Billing must stay enabled on the project, no resource may be deleted, and the solution must require the least effort.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Create an alerts-only budget of 300 USD for the project with a threshold at 100% of the actual spend.
    - id: b
      text:
        en: |-
          Create a budget with a Pub/Sub topic and a Cloud Run function that disables billing above 300 USD.
    - id: c
      text:
        en: |-
          Set the maximum number of instances of the Cloud Run service to 1 to keep its cost below 300 USD.
    - id: d
      text:
        en: |-
          Create a spend cap budget of 300 USD that is scoped to the project and to the Cloud Run service.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Spend cap budgets, generally available since October 2026 for a limited set of services that includes Cloud Run, pause usage of the capped service in the project for the rest of the budget period once its cost exceeds the budget. A spend cap budget is scoped to a single project and a single eligible service; only that service is paused, other services keep running, billing isn't disabled, and no resource or data is deleted. Enforcement isn't instant, because cost reporting has some latency, so the amount should be set slightly below the hard limit.
  options:
    a:
      en: |-
        An alerts-only budget sends notifications but doesn't pause or cap any usage.
    b:
      en: |-
        Disabling billing stops every service of the project and might delete resources, and the function is custom code to maintain.
    c:
      en: |-
        A maximum instance count limits scaling but doesn't enforce a cost limit, and it constrains the demo even when spend is low.
references:
  - title: "Manage spend cap budgets | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps
