id: gcpace-1b-loc-cpu-platform-zone
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A simulation workload must run on a specific CPU generation, so its VMs will be created with a minimum CPU platform in zone europe-west10-a. VM creation fails if that CPU platform isn't offered in the zone. Before deploying, you must confirm which CPU platforms the zone offers.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud compute zones describe europe-west10-a`
    - id: b
      text:
        en: |-
          `gcloud compute regions describe europe-west10`
    - id: c
      text:
        en: |-
          `gcloud compute instances describe sim-vm-1 --zone=europe-west10-a`
    - id: d
      text:
        en: |-
          `gcloud compute machine-types describe n2-standard-8 --zone=europe-west10-a`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The output of `gcloud compute zones describe` lists the CPU platforms of the zone under `availableCpuPlatforms`. Checking it before you set `--min-cpu-platform` avoids creation failures, because not every zone offers every CPU platform.
  options:
    b:
      en: |-
        Describing the region returns its quotas, status and list of zones, not the CPU platforms of each zone.
    c:
      en: |-
        Describing an existing VM shows the platform that this VM runs on, not every platform that the zone offers.
    d:
      en: |-
        Describing a machine type shows its vCPUs, memory and limits, not the CPU platforms available in the zone.
references:
  - title: "Specify a minimum CPU platform for compute instances | Compute Engine | Google Cloud Documentation"
    url: https://docs.cloud.google.com/compute/docs/instances/specify-min-cpu-platform
