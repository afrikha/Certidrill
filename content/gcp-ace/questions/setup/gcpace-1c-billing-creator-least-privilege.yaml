id: gcpace-1c-billing-creator-least-privilege
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp has a Google Cloud organization. A finance analyst, Priya, must be able to create new self-serve Cloud Billing accounts for the company's new business units. She must not be able to manage the existing billing accounts or any project resources.

    You need to follow the principle of least privilege. Which role should you grant Priya?
body:
  options:
    - id: a
      text:
        en: |-
          Billing Account Administrator (`roles/billing.admin`) on the organization
    - id: b
      text:
        en: |-
          Billing Account Creator (`roles/billing.creator`) on the organization
    - id: c
      text:
        en: |-
          Billing Account Creator (`roles/billing.creator`) on an existing billing account
    - id: d
      text:
        en: |-
          Project Billing Manager (`roles/billing.projectManager`) on the organization
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Inside an organization, creating a self-serve billing account requires the `billing.accounts.create` permission, which the Billing Account Creator role grants on the organization resource. The role gives no rights over existing billing accounts or project resources; Priya becomes Billing Account Administrator only of the accounts she creates.
  options:
    a:
      en: |-
        Billing Account Administrator manages existing billing accounts (payment methods, users, linked projects), which Priya must not do, and it can't create new billing accounts.
    c:
      en: |-
        Billing Account Creator can be granted only on the organization; a binding on an existing billing account doesn't let anyone create new accounts.
    d:
      en: |-
        Project Billing Manager attaches projects to and detaches them from billing accounts; it doesn't allow creating billing accounts.
references:
  - title: "Cloud Billing access control and permissions | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/billing-access
  - title: "Create a new self-serve Cloud Billing account | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/create-billing-account
