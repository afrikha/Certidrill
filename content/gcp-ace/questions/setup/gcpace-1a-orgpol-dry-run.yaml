id: gcpace-1a-orgpol-dry-run
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team of a retailer plans to block BigQuery and Filestore in the `Stores` folder with the `gcp.restrictServiceUsage` constraint. Several production workloads run in that folder. Before it enforces anything, the team wants to know which requests the policy would block, without blocking any request.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Enforce the policy on the `Stores` folder for one hour, review the Policy Denied audit logs, and then delete the policy." }
    - id: b
      text: { en: "Enforce the policy on a new, empty test project in the `Stores` folder and review that project's Policy Denied audit logs." }
    - id: c
      text: { en: "Run Policy Troubleshooter for IAM on each production service account to see which permissions it would lose." }
    - id: d
      text: { en: "Create the policy on the `Stores` folder in dry-run mode and review the audit logs of the violations that it records." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A dry-run organization policy is evaluated like an enforced one, but violating requests aren't denied: they are only recorded in audit logs. This shows the impact on the production workloads before the policy is enforced.
  options:
    a: { en: "Enforcing the policy, even briefly, blocks the production requests that use BigQuery or Filestore." }
    b: { en: "An empty project has no workloads, so its logs can't show which production requests would be blocked." }
    c: { en: "Policy Troubleshooter explains IAM access decisions; organization policies restrict services independently of IAM permissions." }
references:
  - title: "Restrict service usage | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/restricting-resources
  - title: "Organization Policy overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/overview
