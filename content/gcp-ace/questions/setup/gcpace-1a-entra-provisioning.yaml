id: gcpace-1a-entra-provisioning
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A consultancy uses Microsoft Entra ID as its only identity provider and has no on-premises servers. Its employees need Cloud Identity user accounts, and its Entra ID groups must exist as Google groups. The company wants provisioning to be automatic and doesn't want to install or run any synchronization software.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Install Google Cloud Directory Sync on a Compute Engine VM and schedule it to read the users and groups from Entra ID." }
    - id: b
      text: { en: "Create a workforce identity pool with an Entra ID provider in the organization, and grant roles to the pool's groups." }
    - id: c
      text: { en: "Add the Google Cloud/G Suite Connector by Microsoft gallery app in Entra ID and set its provisioning mode to Automatic." }
    - id: d
      text: { en: "Export the users and groups from Entra ID every week and upload them as CSV files in the Google Admin console." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Entra ID can provision users and groups to Cloud Identity itself: an enterprise application based on the Google Cloud/G Suite Connector by Microsoft gallery app, with automatic provisioning, creates and updates the accounts and groups periodically. No software has to be run by the company.
  options:
    a: { en: "GCDS is software that the company would have to install and operate on a server, which it wants to avoid." }
    b: { en: "Workforce Identity Federation gives Entra ID users access without creating Cloud Identity accounts or Google groups, which the company requires." }
    d: { en: "A weekly manual upload isn't automatic and leaves accounts out of date between uploads." }
references:
  - title: "Microsoft Entra ID (formerly Azure AD) user provisioning and single sign-on | Cloud Architecture Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/architecture/identity/federating-gcp-with-azure-ad-configuring-provisioning-and-single-sign-on
