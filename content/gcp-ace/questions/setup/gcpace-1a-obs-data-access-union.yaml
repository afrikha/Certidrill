id: gcpace-1a-obs-data-access-union
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On the `Finance` folder, Data Access audit logs are enabled for Cloud Storage with the DATA_READ log type. In the project `ledger-files`, which is in that folder, an administrator enables the DATA_WRITE log type for Cloud Storage and leaves DATA_READ unselected at the project level. No exempted principals are configured.

    Which Cloud Storage Data Access audit logs does the project `ledger-files` generate?
body:
  options:
    - id: a
      text: { en: "Only DATA_WRITE logs, because the project's configuration replaces the folder's configuration." }
    - id: b
      text: { en: "Both DATA_READ and DATA_WRITE logs, because the configurations of the hierarchy are combined." }
    - id: c
      text: { en: "Only DATA_READ logs, because the folder's configuration takes precedence over the project's." }
    - id: d
      text: { en: "No Data Access logs, because conflicting configurations turn the log types off for the project." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Data Access audit log configurations combine as a union across the resource hierarchy. A project can add log types to those enabled by its parents, but it can't turn off a type that a parent enabled, so `ledger-files` generates both DATA_READ and DATA_WRITE logs for Cloud Storage.
  options:
    a: { en: "A project configuration doesn't replace its parents' configuration; it can only add log types." }
    c: { en: "The folder's configuration doesn't override the project's; the DATA_WRITE type enabled on the project also applies." }
    d: { en: "The configurations don't conflict: they are combined, and both log types are generated." }
references:
  - title: "Enable Data Access audit logs | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/audit/configure-data-access
