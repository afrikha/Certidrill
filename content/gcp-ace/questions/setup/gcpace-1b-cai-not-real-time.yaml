id: gcpace-1b-cai-not-real-time
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A deployment script of a media company changes the machine type of the VM render-7 in zone us-east1-b, in the project media-prod. Right after the change, and before its next step, the script must confirm that the VM now has the new machine type. The script's service account can read both Compute Engine and Cloud Asset Inventory data.

    Which command should the script run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud asset search-all-resources --scope=projects/media-prod --asset-types=compute.googleapis.com/Instance --query="name:render-7"`
    - id: b
      text:
        en: |-
          `gcloud compute instances describe render-7 --zone=us-east1-b --format="value(machineType)"`
    - id: c
      text:
        en: |-
          `gcloud asset list --project=media-prod --asset-types=compute.googleapis.com/Instance --content-type=resource`
    - id: d
      text:
        en: |-
          `gcloud asset get-history --project=media-prod --asset-names=//compute.googleapis.com/projects/media-prod/zones/us-east1-b/instances/render-7 --content-type=resource --start-time=2026-11-27T08:00:00Z`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cloud Asset Inventory is built for inventory, audit and analytics, and it isn't designed for real-time queries: changes can take time to appear in it. To check the current state right after a change, the script should call the service's own API, here with `gcloud compute instances describe`.
  options:
    a:
      en: |-
        Search results come from the asset inventory, which might not reflect the change yet when the script checks it.
    c:
      en: |-
        Listing assets also reads the inventory, which can lag behind the change, and it returns every VM of the project.
    d:
      en: |-
        The asset history is built from the same inventory, so the newest version might not be there yet when the script runs.
references:
  - title: "Cloud Asset Inventory overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/overview
