id: gcpace-1a-iam-custom-role-path
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You created a custom role with the ID `appDeployer` in the project `orders-web` by running `gcloud iam roles create appDeployer --project=orders-web --file=role.yaml`. You now need to grant this role to the group `web-deployers@quillon.example` on the same project.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud projects add-iam-policy-binding orders-web --member=group:web-deployers@quillon.example --role=roles/appDeployer`
    - id: b
      text:
        en: |-
          `gcloud projects add-iam-policy-binding orders-web --member=group:web-deployers@quillon.example --role=appDeployer`
    - id: c
      text:
        en: |-
          `gcloud projects add-iam-policy-binding orders-web --member=group:web-deployers@quillon.example --role=organizations/orders-web/roles/appDeployer`
    - id: d
      text:
        en: |-
          `gcloud projects add-iam-policy-binding orders-web --member=group:web-deployers@quillon.example --role=projects/orders-web/roles/appDeployer`
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The `--role` flag takes the full name of the role. Predefined roles use the `roles/` prefix, while a custom role is identified by its parent: `projects/PROJECT_ID/roles/ROLE_ID` for a project-level custom role. A project-level custom role can be granted only in the project where it was created, which is the case here.
  options:
    a: { en: "The `roles/` prefix designates predefined roles; no predefined role named appDeployer exists." }
    b: { en: "A bare role ID isn't a valid role name; the custom role must be referenced with its full path." }
    c: { en: "The `organizations/` prefix is for custom roles created at the organization level and requires a numeric organization ID; this role was created in a project." }
references:
  - title: "gcloud projects add-iam-policy-binding | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/projects/add-iam-policy-binding
  - title: "Roles overview | Identity and Access Management (IAM) | Google Cloud Documentation"
    url: https://docs.cloud.google.com/iam/docs/roles-overview
