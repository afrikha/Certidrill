id: gcpace-1c-export-permissions-least-privilege
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An engineer must enable the standard and the detailed usage cost exports of the billing account `01A2B3-C4D5E6-F7A8B9` to an existing BigQuery dataset in the project `finops-data`. The project has billing enabled and is linked to that billing account. You need to grant the engineer only the permissions that this task requires.

    Which two roles should you grant? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Billing Account Administrator on the billing account
    - id: b
      text:
        en: |-
          Billing Account Costs Manager on the billing account
    - id: c
      text:
        en: |-
          BigQuery User on the `finops-data` project
    - id: d
      text:
        en: |-
          BigQuery Data Viewer on the `finops-data` project
    - id: e
      text:
        en: |-
          Billing Account Viewer on the billing account
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      Enabling a standard or detailed usage cost export requires the Billing Account Costs Manager or Billing Account Administrator role on the billing account, plus the BigQuery User role on the project that contains the dataset. Costs Manager is the narrower of the two billing roles.
  options:
    a:
      en: |-
        Billing Account Administrator works but also manages payment methods, users and project links, so it isn't least privilege.
    d:
      en: |-
        BigQuery Data Viewer only reads data; the setup requires the BigQuery User role on the project.
    e:
      en: |-
        Billing Account Viewer is read-only and can't configure exports.
references:
  - title: "Set up Cloud Billing data export to BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery-setup
