id: gcpace-1c-change-billing-account-directly
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The project `analytics-prod` runs Compute Engine VMs and Cloud SQL instances around the clock. It is linked to billing account A, and finance wants billing account B to pay for it from today, without any service interruption. The project has no committed use discounts and no Cloud Marketplace purchases, and you have the required roles on the project and on both billing accounts.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Run `gcloud billing projects link analytics-prod --billing-account=B_ACCOUNT_ID`.
    - id: b
      text:
        en: |-
          Run `gcloud billing projects unlink analytics-prod`, and then link the project to billing account B.
    - id: c
      text:
        en: |-
          Close billing account A so that its projects are moved to billing account B.
    - id: d
      text:
        en: |-
          Create a project linked to billing account B, and migrate the workloads to it.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Running `gcloud billing projects link` on a project that is already linked switches it to the new billing account directly; you don't need to unlink it first, and the move shouldn't interrupt services. Usage before the change is charged to account A and usage after it to account B.
  options:
    b:
      en: |-
        Unlinking disables billing: billable resources in the project stop, and some might be removed and become non-recoverable before you link the project again.
    c:
      en: |-
        Closing a billing account stops the billable services of its linked projects; projects are not moved to another account automatically.
    d:
      en: |-
        A migration to a new project is unnecessary effort and causes downtime, because the existing project can simply be linked to account B.
references:
  - title: "Enable, disable, or change billing for a project | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/modify-project
  - title: "gcloud billing projects unlink | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/billing/projects/unlink
