id: gcpace-1c-payments-profile-business
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineering firm is creating its first Cloud Billing account and must create a new Google payments profile during sign-up. Three people in the finance department must manage the payment methods and view the payments of the firm. The firm doesn't want to recreate the profile later.

    Which account type should you select for the new payments profile?
body:
  options:
    - id: a
      text:
        en: |-
          Business, because this type is meant for companies and supports several users
    - id: b
      text:
        en: |-
          Individual, and then add the two other finance users to the profile later
    - id: c
      text:
        en: |-
          Individual, and then convert the profile to Business when more users need access
    - id: d
      text:
        en: |-
          Individual, because a first self-serve billing account supports only this type
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A payments profile is either Individual or Business, and the type is permanent. The Individual type is for personal use and allows one associated user, while the Business type is meant for multi-user environments such as a finance department.
  options:
    b:
      en: |-
        An Individual payments profile allows only one associated user, so the other finance users couldn't be added.
    c:
      en: |-
        The account type of a payments profile can't be changed after it is created; the firm would have to recreate it.
    d:
      en: |-
        Self-serve billing accounts are not limited to Individual profiles; companies use a Business profile.
references:
  - title: "Create a new self-serve Cloud Billing account | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/create-billing-account
