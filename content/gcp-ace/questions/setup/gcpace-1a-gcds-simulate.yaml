id: gcpace-1a-gcds-simulate
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You configured Google Cloud Directory Sync for a retailer's Active Directory. Some Cloud Identity accounts were created manually in the past, and you worry that the first sync will delete or suspend accounts that don't exist in Active Directory. You need to see exactly which changes the sync would make, without changing anything in Cloud Identity.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run a simulated sync from Configuration Manager and review the changes that it reports." }
    - id: b
      text: { en: "Run a full sync on a weekend, then restore any deleted accounts in the Google Admin console." }
    - id: c
      text: { en: "Schedule the sync to run every hour so that the changes are applied gradually over the day." }
    - id: d
      text: { en: "Change the sync's deletion policy to suspend users, then run a full sync and review the suspended accounts." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A simulated sync in Configuration Manager makes no change to the Cloud Identity account. It reports the users and groups that a real run would create, update, suspend, or delete, so you can fix the configuration, for example with exclusion rules, before going live.
  options:
    b: { en: "A real sync changes Cloud Identity immediately, which is exactly what must be avoided." }
    c: { en: "The schedule only controls when syncs run; every run still applies its changes." }
    d: { en: "Suspending accounts is still a change in Cloud Identity and can lock users out." }
references:
  - title: "Active Directory user account provisioning | Cloud Architecture Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/architecture/identity/federating-gcp-with-active-directory-synchronizing-user-accounts
