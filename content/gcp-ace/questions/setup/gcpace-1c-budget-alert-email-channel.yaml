id: gcpace-1c-budget-alert-email-channel
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A budget on your Cloud Billing account sends its alert emails to the default recipients. The FinOps team also wants the alerts delivered to `finops-alerts@example.com`, a mailing list that is neither a Google account nor a Google group and has no IAM role.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on the option that emails alerts to project owners, and make the mailing list an owner of the project.
    - id: b
      text:
        en: |-
          Create a Cloud Monitoring email notification channel for the mailing list, and link it to the budget.
    - id: c
      text:
        en: |-
          Connect a Pub/Sub topic to the budget, and subscribe the address of the mailing list to the topic.
    - id: d
      text:
        en: |-
          Grant the mailing list the Billing Account Viewer role so that it receives the budget's alert emails.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      By default, budget emails go to the Billing Account Administrators and Billing Account Users. To reach other addresses, you link up to five Cloud Monitoring email notification channels to the budget; only the email channel type is supported for budget alerts.
  options:
    a:
      en: |-
        This option, in Preview, applies only to single-project budgets and emails principals with the Owner role; a mailing list that isn't a Google identity can't hold a role.
    c:
      en: |-
        Pub/Sub delivers messages to pull or push subscriptions, not to email addresses; programmatic notifications are meant for automation.
    d:
      en: |-
        The mailing list isn't a principal that can be granted an IAM role, and Billing Account Viewers are not default recipients of budget emails.
references:
  - title: "Customize budget alert email recipients | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/budgets-notification-recipients
