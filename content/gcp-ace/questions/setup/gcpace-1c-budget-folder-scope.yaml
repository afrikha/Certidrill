id: gcpace-1c-budget-folder-scope
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The marketing department's projects are all in the folder `Marketing` (ID `482910374615`) and are paid by the billing account `01A2B3-C4D5E6-F7A8B9`. Teams create new projects in the folder every month, and their resources are not labeled consistently. You need one budget that tracks the department's spend, including future projects, without editing the budget later.

    Which flag should you add to the `gcloud billing budgets create` command?
body:
  options:
    - id: a
      text:
        en: |-
          `--filter-projects=projects/mkt-web,projects/mkt-data,projects/mkt-ads`
    - id: b
      text:
        en: |-
          `--filter-labels=department=marketing`
    - id: c
      text:
        en: |-
          `--filter-resource-ancestors=folders/482910374615`
    - id: d
      text:
        en: |-
          `--filter-subaccounts=billingAccounts/01A2B3-C4D5E6-F7A8B9`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      `--filter-resource-ancestors` scopes the budget to folders or organizations. A folder-scoped budget applies to every project in the folder that the billing account pays for, including projects created there later, so no edit is needed.
  options:
    a:
      en: |-
        A fixed list of projects doesn't include the projects created later; you would have to edit the budget every month.
    b:
      en: |-
        A label filter includes only labeled usage, and the department's resources are not labeled consistently.
    d:
      en: |-
        Subaccount filters are for reseller billing accounts; they don't restrict the budget to the marketing projects.
references:
  - title: "gcloud billing budgets create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/billing/budgets/create
  - title: "Create, edit, or delete budgets and budget alerts | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/budgets
