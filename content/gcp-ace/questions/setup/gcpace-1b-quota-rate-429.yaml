id: gcpace-1b-quota-rate-429
objective: "1.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A batch application of an insurance company calls a Google Cloud API in bursts at the start of every hour. During the bursts, many calls fail with HTTP 429 and the gRPC status RESOURCE_EXHAUSTED. The Quotas & System Limits page shows that a per-minute requests quota of this API reaches its value during each burst.

    Which two actions should you take to resolve the failures? Choose two.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Make the application retry failed calls with exponential backoff and random jitter.
    - id: b
      text:
        en: |-
          Disable and re-enable the API in the project so that its quota usage counters are reset.
    - id: c
      text:
        en: |-
          Create a budget alert on the API's charges so that usage stays below the quota value.
    - id: d
      text:
        en: |-
          Request a higher value for the per-minute requests quota of the API in the project.
    - id: e
      text:
        en: |-
          Request a higher value for the quota on the number of VM instances in the region.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      HTTP 429 with RESOURCE_EXHAUSTED means a rate quota was exceeded; rate quotas reset at fixed intervals. Google recommends that clients retry with exponential backoff and jitter so that retries spread over time, and you can request a quota adjustment when the workload genuinely needs a higher rate.
  options:
    b:
      en: |-
        Disabling the API breaks the application without resetting anything useful: rate quota usage resets on its own at the end of each interval.
    c:
      en: |-
        Budgets track spending; they neither limit request rates nor change quota values.
    e:
      en: |-
        The VM instances quota is an allocation quota of Compute Engine; it has no effect on the per-minute request quota of the API.
references:
  - title: "Troubleshoot quota errors | Cloud Quotas | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/quotas/troubleshoot
