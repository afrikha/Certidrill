id: gcpace-1b-net-shared-vpc-admin-folder
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is setting up Shared VPC for the projects of its Retail folder. A network engineer must enable a project of that folder as a Shared VPC host project and attach the other projects of the folder to it as service projects. The Organization Administrator wants to grant the engineer only what this task requires.

    Which role should be granted to the engineer, and where?
body:
  options:
    - id: a
      text:
        en: |-
          Compute Network Admin (`roles/compute.networkAdmin`) on the future host project
    - id: b
      text:
        en: |-
          Compute Shared VPC Admin (`roles/compute.xpnAdmin`) on the Retail folder
    - id: c
      text:
        en: |-
          Compute Network User (`roles/compute.networkUser`) on the future host project
    - id: d
      text:
        en: |-
          Organization Administrator (`roles/resourcemanager.organizationAdmin`) on the organization
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Enabling host projects and attaching service projects is done by a Shared VPC Admin, who has the Compute Shared VPC Admin role. An Organization Administrator grants it on the organization or, to limit its reach, on a folder, where it applies to that folder and its nested folders.
  options:
    a:
      en: |-
        Network Admins manage network resources of a project, but the role doesn't include enabling a Shared VPC host project or attaching service projects.
    c:
      en: |-
        Network User lets Service Project Admins use the shared subnets; it doesn't allow configuring Shared VPC.
    d:
      en: |-
        Organization Administrator manages IAM policies for the whole organization, which is far broader than the task and doesn't follow least privilege.
references:
  - title: "Shared VPC | Virtual Private Cloud | Google Cloud Documentation"
    url: https://docs.cloud.google.com/vpc/docs/shared-vpc
