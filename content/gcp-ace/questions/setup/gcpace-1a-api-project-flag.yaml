id: gcpace-1a-api-project-flag
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The default configuration of your gcloud CLI uses the project `sandbox-ml`, and several local scripts rely on that default. You need to enable the Cloud SQL Admin API in the project `billing-db-prod`. The default project of your configuration must not change.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Run `gcloud services enable sqladmin.googleapis.com --project=billing-db-prod`." }
    - id: b
      text: { en: "Run `gcloud services enable sqladmin.googleapis.com --billing-project=billing-db-prod`." }
    - id: c
      text: { en: "Run `gcloud config set project billing-db-prod`, then run `gcloud services enable sqladmin.googleapis.com`." }
    - id: d
      text: { en: "Run `gcloud services enable sqladmin.googleapis.com --async`, then check the returned operation." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      `gcloud services enable` acts on the current project, and the `--project` flag overrides that project for a single command. The API is enabled in `billing-db-prod`, and the configuration still points to `sandbox-ml`.
  options:
    b: { en: "`--billing-project` only sets the project used for quota and billing of the request; the API is still enabled in `sandbox-ml`." }
    c: { en: "This enables the API in the right project, but it changes the configuration's default project, which the scripts depend on." }
    d: { en: "`--async` only returns without waiting; the API is enabled in the default project `sandbox-ml`." }
references:
  - title: "gcloud services enable | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/services/enable
  - title: "Set the quota project | Cloud Quotas | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/quotas/set-quota-project
