id: gcpace-1b-quota-admin-role
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At a logistics company, a capacity planner must view the quotas of the project fleet-prod and submit quota adjustment requests for it. The planner must not get permissions to create, change or delete the project's resources. You must follow the principle of least privilege.

    Which role should you grant the planner on the project?
body:
  options:
    - id: a
      text:
        en: |-
          Quota Viewer (`roles/servicemanagement.quotaViewer`)
    - id: b
      text:
        en: |-
          Service Usage Consumer (`roles/serviceusage.serviceUsageConsumer`)
    - id: c
      text:
        en: |-
          Writer (`roles/writer`)
    - id: d
      text:
        en: |-
          Quota Administrator (`roles/servicemanagement.quotaAdmin`)
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Quota Administrator is the predefined role for requesting quota adjustments: it includes the `serviceusage.quotas.update` and `cloudquotas.quotas.update` permissions together with quota viewing, and nothing to manage the project's resources. It can be granted on a project, a folder or an organization.
  options:
    a:
      en: |-
        Quota Viewer lets the planner see quota values and usage, but it doesn't include the permissions to submit adjustments.
    b:
      en: |-
        Service Usage Consumer lets a principal inspect services and use them in the project; it isn't one of the roles that include the quota-change permissions.
    c:
      en: |-
        Writer is a basic role that lets the planner create, change and delete the resources of most services, which breaks the least-privilege requirement.
references:
  - title: "Quota permissions | Cloud Quotas | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/quotas/permissions
  - title: "View and manage quotas | Cloud Quotas | Google Cloud Documentation"
    url: https://docs.cloud.google.com/docs/quotas/help/request_increase
