id: gcpace-1a-unmanaged-accounts-transfer
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A design studio has just verified its domain `fernhollow.example` in a new Cloud Identity account. About 40 employees already use consumer Google Accounts with their work email addresses, and those accounts own Google Cloud projects and data that must be kept. You need to bring these accounts under the studio's management without creating a second account for any of these identities.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Create Cloud Identity users with the same email addresses in the Google Admin console, then ask the employees to sign in." }
    - id: b
      text: { en: "Run Google Cloud Directory Sync to provision users with the same email addresses from the studio's LDAP directory." }
    - id: c
      text: { en: "Send transfer requests with the transfer tool for unmanaged users, and have the employees accept them." }
    - id: d
      text: { en: "Ask the employees to delete their consumer accounts, then create Cloud Identity users with the same addresses." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      After domain verification, consumer accounts that use the domain appear in the transfer tool for unmanaged users. A transfer request that the user accepts turns the existing account into a managed account, keeping its identity and data, so no duplicate account is created.
  options:
    a: { en: "Creating a managed account with the same address produces a conflicting account: the user ends up with two accounts, and the new one has none of the existing data." }
    b: { en: "GCDS creates new managed accounts with those addresses, which produces the same conflicting accounts as creating them by hand." }
    d: { en: "Deleting the consumer accounts destroys the projects and data that the studio must keep." }
references:
  - title: "Migrate consumer accounts | Cloud Architecture Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/architecture/identity/migrating-consumer-accounts
