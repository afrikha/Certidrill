id: gcpace-1b-loc-spanner-configs
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company is about to create its first Spanner instance and needs a multi-region configuration in North America. The database team wants to see every instance configuration, regional and multi-region, that its project can use before it chooses one.

    Which command should the team run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud spanner instances list`
    - id: b
      text:
        en: |-
          `gcloud spanner instance-configs list`
    - id: c
      text:
        en: |-
          `gcloud compute regions list --filter="name~^us-"`
    - id: d
      text:
        en: |-
          `gcloud sql tiers list`
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Spanner instance's location is set by its instance configuration, which defines its region or set of regions. `gcloud spanner instance-configs list` lists the configurations available to the project, regional and multi-region, so the team can pick one before running `gcloud spanner instances create --config=...`.
  options:
    a:
      en: |-
        This lists the Spanner instances that already exist in the project, and the project has none yet.
    c:
      en: |-
        This lists Compute Engine regions; it says nothing about the Spanner configurations offered in them.
    d:
      en: |-
        This lists Cloud SQL machine tiers, not Spanner instance configurations.
references:
  - title: "Regional, dual-region, and multi-region configurations | Spanner | Google Cloud Documentation"
    url: https://docs.cloud.google.com/spanner/docs/instance-configurations
