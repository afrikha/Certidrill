id: gcpace-1a-orgpol-allowed-domains
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An engineering firm created its organization resource in 2025 and hasn't changed its organization policies since. A partner company has its own Cloud Identity account with the domain `partner-labs.example`. When you grant a role on a project to `user:dana@partner-labs.example`, the request fails with an organization policy error. You must allow the principals of the partner's Cloud Identity account to receive roles and keep blocking every other external identity.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Add the partner's Cloud Identity customer ID, which `gcloud organizations list` shows as DIRECTORY_CUSTOMER_ID, to the allowed values of `iam.allowedPolicyMemberDomains`." }
    - id: b
      text: { en: "Add the domain name `partner-labs.example`, next to your own domain's entry, to the allowed values of the `iam.allowedPolicyMemberDomains` policy." }
    - id: c
      text: { en: "Delete the `iam.allowedPolicyMemberDomains` policy from your organization, and then grant the role to the partner's user again." }
    - id: d
      text: { en: "Turn off enforcement of the service account key creation constraint on the project, and then grant the role to the partner's user again." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Organizations created on or after May 3, 2024 enforce `iam.allowedPolicyMemberDomains` by default, allowing only their own Cloud Identity or Google Workspace account. The constraint identifies accounts by customer ID (or organization principal set), which `gcloud organizations list` returns as DIRECTORY_CUSTOMER_ID. Adding the partner's customer ID to the allowed values lets its principals be granted roles while all other external identities stay blocked.
  options:
    b: { en: "The constraint's allowed values are Cloud Identity or Google Workspace customer IDs or organization principal sets, not domain names." }
    c: { en: "Deleting the policy removes the restriction for every external identity, which the firm must keep blocking." }
    d: { en: "The service account key creation constraint doesn't control which identities can be granted roles; the error comes from domain-restricted sharing." }
references:
  - title: "Restrict identities with domain-restricted sharing | Organization Policy | Google Cloud Documentation"
    url: https://docs.cloud.google.com/organization-policy/restrict-domains
  - title: "Manage Google Cloud security baseline constraints | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/secure-by-default-organizations
