id: gcpace-1c-budget-pubsub-domain-restriction
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have the Billing Account Costs Manager role on your company's billing account and the Pub/Sub Admin role on the project `finops-automation`. You try to connect the Pub/Sub topic `budget-events` of `finops-automation` to a budget for programmatic notifications, but the setup fails. The organization enforces the domain restricted sharing constraint (`iam.allowedPolicyMemberDomains`), which allows only your company's Cloud Identity customer ID.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Ask for the Billing Account Administrator role, because Costs Managers can't connect Pub/Sub topics to budgets.
    - id: b
      text:
        en: |-
          Exempt the `finops-automation` project from the domain restricted sharing constraint, and connect the topic again.
    - id: c
      text:
        en: |-
          Create the topic in another project of the same organization, and connect that topic to the budget.
    - id: d
      text:
        en: |-
          Grant the Pub/Sub Publisher role on the topic to `allUsers`, and connect the topic to the budget again.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Connecting a topic to a budget grants Cloud Billing the Pub/Sub Publisher role on the topic, and a domain restricted sharing policy that allows only your customer ID blocks that grant. Google's guidance is to exempt the project that contains the topic from the constraint; a dedicated FinOps project keeps the exemption narrow.
  options:
    a:
      en: |-
        Billing Account Costs Manager, together with Pub/Sub Admin on the target project, is enough to connect a topic; the failure comes from the organization policy.
    c:
      en: |-
        The constraint is inherited by every project of the organization, so the grant would be blocked in the other project too.
    d:
      en: |-
        `allUsers` is also outside the allowed customer ID, so the grant is blocked, and it would let anyone publish to the topic.
references:
  - title: "Set up programmatic notifications | Cloud Billing | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/budgets-programmatic-notifications
