id: gcpace-1a-obs-org-aggregated-sink
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's organization `801234567890` contains the folder `Regulated`, ID `345678901234`, and several other folders. A security team must route the audit logs of every project in `Regulated`, including projects created there later, to the log bucket `audit-store` in the project `sec-logging`, region `europe-west1`. Projects outside `Regulated` must not be routed. All commands below use the destination `logging.googleapis.com/projects/sec-logging/locations/europe-west1/buckets/audit-store`, written as DEST, and the filter `logName:"cloudaudit.googleapis.com"`, written as FILTER.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud logging sinks create regulated-audit DEST --folder=345678901234 --log-filter='FILTER'`
    - id: b
      text:
        en: |-
          `gcloud logging sinks create regulated-audit DEST --organization=801234567890 --include-children --log-filter='FILTER'`
    - id: c
      text:
        en: |-
          `gcloud logging sinks create regulated-audit DEST --folder=345678901234 --include-children --log-filter='FILTER'`
    - id: d
      text:
        en: |-
          `gcloud logging sinks create regulated-audit DEST --project=sec-logging --log-filter='FILTER'`
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An aggregated sink can be created on a folder as well as on an organization. With `--folder` and `--include-children`, it routes the matching entries of every project and subfolder under `Regulated`, including those created later, and nothing from the rest of the organization. Its writer identity must then be granted Logs Writer and Logs Bucket Writer on `sec-logging`.
  options:
    a: { en: "Without `--include-children`, a folder sink routes only the entries written at the folder level, not those of its projects." }
    b: { en: "An organization sink with `--include-children` routes the audit logs of every project in the organization, including those outside `Regulated`." }
    d: { en: "A sink in `sec-logging` routes only that project's own logs." }
references:
  - title: "gcloud logging sinks create | Google Cloud SDK | Google Cloud Documentation"
    url: https://docs.cloud.google.com/sdk/gcloud/reference/logging/sinks/create
  - title: "Collate and route organization- and folder-level logs to supported destinations | Cloud Logging | Google Cloud Documentation"
    url: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks
