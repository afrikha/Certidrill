id: gcpace-1c-separate-invoices-business-units
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A holding company has one Cloud Billing account that pays for 40 projects. The projects of its two business units are in two folders. The business units are separate legal entities, and from next month each one must receive its own invoice and pay it with its own payment instrument.

    What should you do?
body:
  options:
    - id: a
      text:
        en: |-
          Add a business-unit label to every resource, and split the costs with the standard usage cost export.
    - id: b
      text:
        en: |-
          Create one budget per business unit, scoped to the folder that contains the unit's projects.
    - id: c
      text:
        en: |-
          Create one subaccount per business unit under the existing billing account, and link each unit's projects to it.
    - id: d
      text:
        en: |-
          Create a second billing account with the second entity's payments profile, and link that unit's projects to it.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A Cloud Billing account defines who pays for a set of projects, and its Google payments profile holds the legal entity and its payment instruments. A second billing account, created with the second entity's payments profile, gives that business unit its own statements and payment method once its projects are linked to it.
  options:
    a:
      en: |-
        Labels allocate costs in reports, but there is still one billing account, one invoice and one payment instrument.
    b:
      en: |-
        Budgets only track spend and send alerts; they don't change who is invoiced or how costs are paid.
    c:
      en: |-
        Subaccounts are intended for resellers, and the parent account pays for all of their usage, so the units wouldn't pay separately.
references:
  - title: "Cloud Billing overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/concepts
