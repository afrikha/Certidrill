id: gcpace-1a-obs-dashboard-editor-role
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A product analytics team must create and edit Cloud Monitoring dashboards in the project `web-metrics`. The team must not be able to create or change alerting policies, uptime checks, or the metrics scope.

    Which role should you grant to the team on the project?
body:
  options:
    - id: a
      text: { en: "Monitoring Editor (`roles/monitoring.editor`)" }
    - id: b
      text: { en: "Monitoring Admin (`roles/monitoring.admin`)" }
    - id: c
      text: { en: "Monitoring Dashboard Configuration Editor (`roles/monitoring.dashboardEditor`)" }
    - id: d
      text: { en: "Monitoring Metric Writer (`roles/monitoring.metricWriter`)" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Monitoring Dashboard Configuration Editor gives read-write access to dashboard configurations only. The team can build dashboards without being able to change alerting policies, uptime checks, or the metrics scope.
  options:
    a: { en: "Monitoring Editor gives read-write access to all of Cloud Monitoring, including alerting policies and uptime checks." }
    b: { en: "Monitoring Admin gives full access to Cloud Monitoring, including changes to the metrics scope." }
    d: { en: "Monitoring Metric Writer is for agents and service accounts that write metrics; it gives no console access to dashboards." }
references:
  - title: "Control access with IAM | Cloud Monitoring | Google Cloud Documentation"
    url: https://docs.cloud.google.com/monitoring/access-control
