id: gcpace-1c-export-multiregion-backfill
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    On 15 November, you enable the standard usage cost export of your company's billing account to BigQuery for the first time. The FinOps team, based in Belgium, wants the export dataset to also contain the costs incurred since 1 October, without any manual import.

    Where should you create the BigQuery dataset?
body:
  options:
    - id: a
      text:
        en: |-
          In the EU or US multi-region
    - id: b
      text:
        en: |-
          In the `europe-west1` region, which is closest to the FinOps team
    - id: c
      text:
        en: |-
          In any supported region, and then disable and re-enable the export the next day
    - id: d
      text:
        en: |-
          In any supported region, and also enable the pricing data export
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When you first enable a standard or detailed usage cost export to a multi-region dataset (US or EU), Cloud Billing adds data retroactively from the beginning of the previous month, here 1 October; the backfill can take up to five days. A dataset in a single region only receives data from the moment the export is enabled.
  options:
    b:
      en: |-
        Region datasets don't receive retroactive data, so the October costs would be missing.
    c:
      en: |-
        Disabling and re-enabling an export doesn't backfill previously exported or missing data.
    d:
      en: |-
        Pricing data is never added retroactively, and it doesn't contain any usage costs.
references:
  - title: "Set up Cloud Billing data export to BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery-setup
  - title: "Export Cloud Billing data to BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery
