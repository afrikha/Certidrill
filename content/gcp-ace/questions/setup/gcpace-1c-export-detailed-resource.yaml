id: gcpace-1c-export-detailed-resource
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The finance team of an online retailer wants to analyze in BigQuery the cost of each individual Compute Engine VM and persistent disk paid by the company's billing account, not only the totals per service and SKU.

    Which Cloud Billing export should you enable?
body:
  options:
    - id: a
      text:
        en: |-
          The standard usage cost export to BigQuery
    - id: b
      text:
        en: |-
          The pricing data export to BigQuery
    - id: c
      text:
        en: |-
          The committed use discount metadata export to BigQuery
    - id: d
      text:
        en: |-
          The detailed usage cost export to BigQuery
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The detailed usage cost export contains every field of the standard export plus resource-level cost data, such as the cost of each VM and SSD. It writes to the table `gcp_billing_export_resource_v1_<BILLING_ACCOUNT_ID>` in the chosen dataset.
  options:
    a:
      en: |-
        The standard export reports costs by account, project, service, SKU, label and location, but it doesn't include resource-level cost data.
    b:
      en: |-
        The pricing export contains the prices of the billing account's SKUs, not the cost of the resources that were used.
    c:
      en: |-
        This export, in Preview, contains daily committed use discount metadata to join with other exports; it has no per-resource costs.
references:
  - title: "Export Cloud Billing data to BigQuery | Google Cloud Documentation"
    url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery
