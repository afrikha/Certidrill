id: gcpace-1b-standalone-claim
objective: "1.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer has just set up Cloud Identity with its verified domain example-retail.com. On the Admin Governance page, its super administrator discovers three standalone organizations that employees had created with their example-retail.com accounts, and production projects run in them. The company wants the super administrator to take control of these organizations without moving or recreating any project, and the employees must keep administering them.

    What should the super administrator do?
body:
  options:
    - id: a
      text:
        en: |-
          Claim each standalone organization from the Admin Governance page, knowing that the action can't be undone.
    - id: b
      text:
        en: |-
          Migrate every project to the company's Cloud Identity organization, and then delete the three standalone organizations.
    - id: c
      text:
        en: |-
          Ask each employee to add the super administrator as a second owner, and then remove the employees' Organization Administrator role.
    - id: d
      text:
        en: |-
          Ask each employee to delete their standalone organization, and then restore it within 30 days from the super administrator's account.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Cloud Identity super administrators of a verified domain can claim the standalone organizations created by users of their domain from the Admin Governance page. Claiming replaces the existing owners with the administrator, while the original owners keep the Organization Administrator role and the organization and its projects stay active. The action is irreversible.
  options:
    b:
      en: |-
        Migrating projects moves them, which the company wants to avoid, and it's far more work than claiming the organizations.
    c:
      en: |-
        The employees would stay owners and would lose the administrator role they must keep, which fails both requirements.
    d:
      en: |-
        A standalone organization can be deleted only after all its projects and folders are deleted, and restoring it doesn't change its owners.
references:
  - title: "Set up standalone organizations | Resource Manager | Google Cloud Documentation"
    url: https://docs.cloud.google.com/resource-manager/docs/standalone-organization-overview
