id: gcpace-1b-cai-history-bucket
objective: "1.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An auditor asks for every version of the configuration of the Cloud Storage bucket ledger-exports in the project fin-reports over the last three weeks, because its settings were changed several times. You haven't set up any export or feed for this project. START_TIME stands for the time three weeks ago.

    Which command should you run?
body:
  options:
    - id: a
      text:
        en: |-
          `gcloud asset get-history --project=fin-reports --asset-names=//storage.googleapis.com/ledger-exports --content-type=resource --start-time=START_TIME`
    - id: b
      text:
        en: |-
          `gcloud asset export --project=fin-reports --asset-types=storage.googleapis.com/Bucket --content-type=resource --snapshot-time=START_TIME --output-path=gs://audit-out/buckets.json`
    - id: c
      text:
        en: |-
          `gcloud asset search-all-resources --scope=projects/fin-reports --asset-types=storage.googleapis.com/Bucket --query="name:ledger-exports"`
    - id: d
      text:
        en: |-
          `gcloud asset feeds create ledger-feed --project=fin-reports --asset-names=//storage.googleapis.com/ledger-exports --content-type=resource --pubsub-topic=projects/fin-reports/topics/audit`
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Cloud Asset Inventory keeps the create, update and delete history of assets for up to 35 days. `gcloud asset get-history` returns every version of the named asset that overlaps the time window, so a start time three weeks ago returns all the configurations the bucket had since then.
  options:
    b:
      en: |-
        An export with a snapshot time returns the state of the assets at that single moment, not every version since then.
    c:
      en: |-
        A search returns only the current metadata of the bucket, not its earlier versions.
    d:
      en: |-
        A feed only notifies changes made after it's created, so it can't cover the last three weeks.
references:
  - title: "Cloud Asset Inventory overview | Google Cloud Documentation"
    url: https://docs.cloud.google.com/asset-inventory/docs/overview
