id: gcpace-1b-loc-products-by-region
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A product manager at a travel company is preparing a business case for a Google Cloud region that launched recently near the company's customers. No Google Cloud project exists yet, and she doesn't use the gcloud CLI. She needs an overview of which Google Cloud products are offered in that region.

    What should she consult?
body:
  options:
    - id: a
      text:
        en: |-
          The Quotas & System Limits page of the Google Cloud console
    - id: b
      text:
        en: |-
          The Personalized Service Health dashboard of the Google Cloud console
    - id: c
      text:
        en: |-
          The products available by region on the Google Cloud locations page
    - id: d
      text:
        en: |-
          The Reports page of Cloud Billing in the Google Cloud console
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Cloud locations page lists the products available in each region, with regional and global tabs, and links to tools for detailed checks. Google states that every region offers a base set of products such as Compute Engine, GKE, Cloud Storage and Cloud SQL at launch, while other products follow, so a recent region must be checked product by product.
  options:
    a:
      en: |-
        The Quotas & System Limits page shows the quotas of an existing project, and having quota doesn't mean that a product is offered in a region.
    b:
      en: |-
        Personalized Service Health reports incidents that affect your projects; it isn't a catalog of products per region.
    d:
      en: |-
        Cloud Billing reports analyze the costs of existing billing accounts and projects; they don't list the products of a region.
references:
  - title: "Global Locations - Regions & Zones | Google Cloud"
    url: https://cloud.google.com/about/locations
