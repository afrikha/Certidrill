id: gcpace-1b-net-default-allowed-traffic
objective: "1.1.9"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer creates a new project, keeps the default network with its pre-populated firewall rules, and creates a Linux VM that has an external IP address. No other firewall rule or policy exists. Before exposing the VM, the security team wants to know which incoming traffic from the internet can already reach it.

    Which three types of incoming traffic from the internet are allowed? Choose three.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          TCP traffic on port 22
    - id: b
      text:
        en: |-
          TCP traffic on port 80
    - id: c
      text:
        en: |-
          TCP traffic on port 3389
    - id: d
      text:
        en: |-
          TCP traffic on port 443
    - id: e
      text:
        en: |-
          ICMP traffic
    - id: f
      text:
        en: |-
          UDP traffic on port 53
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      The default network comes with four ingress allow rules at priority 65534: `default-allow-ssh` (TCP 22 from any source), `default-allow-rdp` (TCP 3389 from any source), `default-allow-icmp` (ICMP from any source) and `default-allow-internal`, which only allows traffic from 10.128.0.0/9. Everything else from the internet hits the implied deny ingress rule.
  options:
    b:
      en: |-
        No pre-populated rule allows HTTP from the internet; you must create one, for example for the VMs that serve web traffic.
    d:
      en: |-
        No pre-populated rule allows HTTPS from the internet, so the implied deny ingress rule blocks it.
    f:
      en: |-
        UDP is allowed only by `default-allow-internal`, whose source range is 10.128.0.0/9, not the internet.
references:
  - title: "VPC firewall rules | Cloud Next Generation Firewall | Google Cloud Documentation"
    url: https://docs.cloud.google.com/firewall/docs/firewalls
