id: gcpace-1a-gcds-statements
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An energy company plans to provision its Cloud Identity account from its existing LDAP directory with Google Cloud Directory Sync. The identity team wants to confirm how the tool works before it designs the deployment.

    Which two statements about Google Cloud Directory Sync are true? Choose two.
body:
  choose: 2
  options:
    - id: a
      text: { en: "It runs as a managed service inside the Google Admin console, so the company doesn't need to operate a server." }
    - id: b
      text: { en: "It reads users and groups from the LDAP directory and provisions them into Cloud Identity, without writing changes back." }
    - id: c
      text: { en: "It synchronizes passwords in both directions, so that users can sign in with either their LDAP or their Google password." }
    - id: d
      text: { en: "It replaces single sign-on, because synchronized users authenticate against the LDAP directory automatically." }
    - id: e
      text: { en: "It runs on a server that the company manages, on premises or on a VM, and its sync runs can be scheduled." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      GCDS provisions users and groups one way, from an LDAP directory into Cloud Identity or Google Workspace. It is installed on a Windows or Linux machine that the company runs, preferably on premises, and a scheduled task can start sync runs regularly.
  options:
    a: { en: "GCDS isn't hosted by Google; it is software that you install and run yourself." }
    c: { en: "GCDS doesn't synchronize passwords both ways; the directory remains the source and Google is only the target." }
    d: { en: "Provisioning and authentication are separate: single sign-on is configured separately, for example with SAML." }
references:
  - title: "Active Directory user account provisioning | Cloud Architecture Center | Google Cloud Documentation"
    url: https://docs.cloud.google.com/architecture/identity/federating-gcp-with-active-directory-synchronizing-user-accounts
