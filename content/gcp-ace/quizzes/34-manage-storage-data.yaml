chapter: 34-manage-storage-data
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-34-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Yesterday, a script deleted the object `q3-forecast.xlsx` from the bucket `gs://fin-plans`. The bucket keeps its default protection settings: Object Versioning is disabled and nobody changed the soft delete policy.

        How can you bring the object back?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud storage cp gs://fin-plans/q3-forecast.xlsx#GENERATION gs://fin-plans`." } }
        - { id: b, text: { en: "Run `gcloud storage restore gs://fin-plans/q3-forecast.xlsx`." } }
        - { id: c, text: { en: "Run `gcloud storage buckets update gs://fin-plans --versioning`, and then copy it back." } }
        - { id: d, text: { en: "You cannot, because the object was deleted while Object Versioning was disabled." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Soft delete is on by default with a 7-day retention period, so the deleted object is kept as a soft-deleted object. `gcloud storage restore` restores it; without a generation number, the latest soft-deleted version is restored.
      options:
        a: { en: "Copying a generation is how you restore a noncurrent version in a versioned bucket; a soft-deleted object must be restored first." }
        c: { en: "Enabling Object Versioning now only affects later overwrites and deletions; it does not bring back an object deleted yesterday." }
        d: { en: "Soft delete protects deleted objects independently of Object Versioning, for 7 days by default." }
    references:
      - title: Use soft-deleted objects
        url: https://docs.cloud.google.com/storage/docs/use-soft-deleted-objects
      - title: Soft delete overview
        url: https://docs.cloud.google.com/storage/docs/soft-delete

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-34-02
    objective: "3.2.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A streaming Dataflow job in `us-east1` reads click events from Pub/Sub and must be stopped before a planned replacement. The events that the job has already read and buffered must still be processed and written to their destination.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud dataflow jobs cancel JOB_ID --region=us-east1`." } }
        - { id: b, text: { en: "Run `gcloud dataflow jobs cancel JOB_ID --region=us-east1 --force`." } }
        - { id: c, text: { en: "Run `gcloud dataflow jobs drain JOB_ID --region=us-east1`." } }
        - { id: d, text: { en: "Run `gcloud dataflow jobs describe JOB_ID --region=us-east1`." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Draining a streaming job stops it from reading new input while the service finishes processing the data that is already buffered. Draining applies to streaming pipelines only.
      options:
        a: { en: "Cancelling stops processing immediately, buffered data included, so in-flight data can be lost." }
        b: { en: "Force cancel is a last resort for a job that a regular cancel could not stop; it skips cleanup and can lose data." }
        d: { en: "This command shows the job's details and state; it does not stop the job." }
    references:
      - title: Stop a running Dataflow pipeline
        url: https://docs.cloud.google.com/dataflow/docs/guides/stopping-a-pipeline

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-34-03
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A nightly script runs the following command, and BigQuery rejects it with an error about the table name. The query has no dialect prefix, and it must stay in GoogleSQL.

        ```bash
        bq query 'SELECT store, SAFE_DIVIDE(SUM(margin), SUM(revenue)) AS ratio
          FROM `retail-prj.sales.daily` GROUP BY store'
        ```

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Replace the backticks with square brackets: `[retail-prj:sales.daily]`." } }
        - { id: b, text: { en: "Add `--use_legacy_sql=false` to the `bq query` command." } }
        - { id: c, text: { en: "Add `--location=US` to the `bq query` command." } }
        - { id: d, text: { en: "Add `--nouse_cache` to the `bq query` command." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When the dialect is not specified and the query has no dialect prefix, `bq query` defaults to legacy SQL, which does not accept backtick-quoted `project.dataset.table` names. Setting `--use_legacy_sql=false` runs the query as GoogleSQL.
      options:
        a: { en: "Square brackets are the legacy SQL table syntax; the query would then run in legacy SQL instead of GoogleSQL." }
        c: { en: "The location tells BigQuery where to run the job; it does not change the SQL dialect used to parse the query." }
        d: { en: "Disabling the query cache only forces a fresh execution; the query is still parsed as legacy SQL." }
    references:
      - title: bq command-line tool reference
        url: https://docs.cloud.google.com/bigquery/docs/reference/bq-cli-reference

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-34-04
    objective: "3.2.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A database team has the Database Center Viewer role on the organization. Database Center lists all Cloud SQL and AlloyDB instances and shows availability and data protection health issues, but it reports no security health issue, although several Cloud SQL instances have public IP addresses. Apart from IAM, no Google Cloud security product has been set up in the organization.

        What should you do so that security health issues appear?
    body:
      options:
        - { id: a, text: { en: "Grant the team the Recommender Viewer role (`roles/recommender.viewer`) on the organization." } }
        - { id: b, text: { en: "Enable Data Access audit logs for Cloud SQL and AlloyDB in every project." } }
        - { id: c, text: { en: "Activate Security Command Center for the organization, for use with Database Center." } }
        - { id: d, text: { en: "Grant the team the Cloud SQL Viewer role (`roles/cloudsql.viewer`) on every project." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Database Center takes its security health issues from Security Command Center. Its basic security issues appear with the Built-in tier, all supported security issues with the Premium tier, once Security Command Center is activated for use with Database Center.
      options:
        a: { en: "Recommender Viewer adds the recommender-related health issues; it does not produce the security issues that come from Security Command Center." }
        b: { en: "Audit logs record access to the databases; they do not feed the security health issues of Database Center." }
        d: { en: "Database Center Viewer already shows the instances; product viewer roles add no security analysis." }
    references:
      - title: Set up Database Center
        url: https://docs.cloud.google.com/database-center/docs/set-up-database-center

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-34-05
    objective: "3.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Several times a day, an analyst runs `SELECT * FROM logs.requests LIMIT 20` to look at sample rows of a 6 TiB table that is neither partitioned nor clustered. The project uses on-demand pricing, and the finance team sees that each run is billed for the whole table. The analyst only needs to look at a few rows.

        What should the analyst do to stop paying for these checks?
    body:
      options:
        - { id: a, text: { en: "Change the query to `LIMIT 1`, so that BigQuery stops reading after the first row." } }
        - { id: b, text: { en: "Run `bq head -n 20 logs.requests` to preview the rows of the table." } }
        - { id: c, text: { en: "Add `--maximum_bytes_billed=1000000` to the `bq query` command of the check." } }
        - { id: d, text: { en: "Add `--dry_run` to the `bq query` command of the check, so that it is free." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Previewing table data with the console's table preview or `bq head` is free and does not count against query quotas. It is the recommended way to explore rows instead of running a query.
      options:
        a: { en: "On a table that is not clustered, a `LIMIT` clause does not reduce the bytes read or billed: the query still scans the table." }
        c: { en: "Maximum bytes billed makes the query fail when it would exceed the limit, so the analyst would get no rows." }
        d: { en: "A dry run only validates the query and estimates the bytes it would process; it returns no rows." }
    references:
      - title: Estimate and control costs
        url: https://docs.cloud.google.com/bigquery/docs/best-practices-costs

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-34-06
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A company retires the Cloud SQL for MySQL instance `crm-mysql`, which uses standard backups with a daily automated backup at 02:00 and the default retention. The application writes to it until it is deleted at 18:00 on its last day. Auditors require that the database can be restored as it was at deletion for one year, and the backup must then expire with no manual cleanup.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud sql instances patch crm-mysql --retain-backups-on-delete`, and then delete the instance." } }
        - { id: b, text: { en: "Run `gcloud sql instances delete crm-mysql --enable-final-backup --final-backup-retention-days=365`." } }
        - { id: c, text: { en: "Run `gcloud sql backups create --instance=crm-mysql` at 18:00, and then delete the instance." } }
        - { id: d, text: { en: "Run `gcloud sql instances delete crm-mysql --enable-final-backup`, and keep the default settings." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A final backup is taken when the instance is deleted, so it captures the data as it was at deletion. Its retention can be set from 1 to 365 days for standard backups, after which it expires automatically.
      options:
        a: { en: "Retaining backups keeps the existing automated and on-demand backups, but the latest one dates from 02:00 and misses the writes of the last day." }
        c: { en: "A standard on-demand backup is kept until someone deletes it or the project is deleted, so it would need manual cleanup after a year." }
        d: { en: "Without a retention setting, Cloud SQL keeps the final backup for 30 days only, not one year." }
    references:
      - title: Cloud SQL backups overview
        url: https://docs.cloud.google.com/sql/docs/mysql/backup-recovery/backups

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-34-07
    objective: "3.2.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A media company creates the bucket `gs://studio-masters` as a configurable dual-region bucket in `US-EAST1` and `US-WEST1`. Every object written to it must be encrypted by default with a customer-managed key in Cloud KMS. Upload jobs run as the service account `ingest@studio-prj.iam.gserviceaccount.com`.

        What should you do before you set the bucket's default key?
    body:
      options:
        - { id: a, text: { en: "Create the key in a key ring in `us`, and grant the Cloud Storage service agent Cloud KMS CryptoKey Encrypter/Decrypter on it." } }
        - { id: b, text: { en: "Create the key in a key ring in `us-east1`, and grant the Cloud Storage service agent Cloud KMS CryptoKey Encrypter/Decrypter on it." } }
        - { id: c, text: { en: "Create the key in a key ring in `us`, and grant the `ingest` service account Cloud KMS CryptoKey Encrypter/Decrypter on it." } }
        - { id: d, text: { en: "Create the key in a key ring in `global`, and grant the Cloud Storage service agent Cloud KMS CryptoKey Encrypter/Decrypter on it." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The key ring must be in the location that matches the bucket's location: a configurable dual-region made of US-EAST1 and US-WEST1 uses a key ring in the `us` multi-region. Cloud Storage encrypts and decrypts objects through its service agent, so the service agent, not the uploading identity, needs the Encrypter/Decrypter role on the key.
      options:
        b: { en: "A key ring in one of the two regions does not match the dual-region bucket; this configurable pair needs a key ring in `us`." }
        c: { en: "The uploading service account never uses the key itself: without a grant to the Cloud Storage service agent, encrypted writes fail." }
        d: { en: "A `global` key ring does not match the bucket's location; the key must be in the location that corresponds to the dual-region." }
    references:
      - title: Customer-managed encryption keys
        url: https://docs.cloud.google.com/storage/docs/encryption/customer-managed-keys

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-34-08
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The bucket `gs://cad-vault` has Object Versioning enabled and the default soft delete policy. Two hours ago, an engineer overwrote `site-plan.dwg` with the wrong file. The previous content must become the live version of `site-plan.dwg` again, and no data may be lost.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Run `gcloud storage ls --soft-deleted gs://cad-vault/site-plan.dwg` to find the generation of the previous content." } }
        - { id: b, text: { en: "Run `gcloud storage restore gs://cad-vault/site-plan.dwg#GENERATION` with the generation of the previous content." } }
        - { id: c, text: { en: "Run `gcloud storage ls --all-versions gs://cad-vault/site-plan.dwg` to find the generation of the previous content." } }
        - { id: d, text: { en: "Run `gcloud storage cp gs://cad-vault/site-plan.dwg#GENERATION gs://cad-vault/site-plan.dwg` with that generation." } }
        - { id: e, text: { en: "Run `gcloud storage rm gs://cad-vault/site-plan.dwg` so that the previous generation becomes the live version." } }
    answer: { optionIds: [c, d] }
    explanation:
      correct:
        en: |
          In a versioned bucket, an overwrite turns the previous content into a noncurrent version, which `gcloud storage ls --all-versions` lists with its generation. Copying that generation onto the object name makes it the live version again, and the wrong file becomes a noncurrent version, so nothing is lost.
      options:
        a: { en: "The previous content is a noncurrent version, not a soft-deleted object: an object becomes soft-deleted only when a noncurrent version is deleted." }
        b: { en: "`gcloud storage restore` restores soft-deleted objects; a noncurrent version is restored by copying it." }
        e: { en: "Deleting the live version only makes the wrong file noncurrent; no noncurrent version is promoted, so the object would have no live version." }
    references:
      - title: Use versioned objects
        url: https://docs.cloud.google.com/storage/docs/using-versioned-objects
      - title: Soft delete overview
        url: https://docs.cloud.google.com/storage/docs/soft-delete

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-34-09
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Three weeks ago, a faulty release corrupted documents in the Firestore database `(default)` of a booking application, and the problem was only found today. Point-in-time recovery is enabled, and a daily backup schedule keeps backups for 14 weeks. You must make the data from before the release available as a database that the application can use with the same TTL cleanup and Security Rules as `(default)`.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Run `gcloud firestore databases restore --source-backup=BACKUP_RESOURCE --destination-database='(default)'` with a backup from before the release." } }
        - { id: b, text: { en: "Run `gcloud firestore databases restore --source-backup=BACKUP_RESOURCE --destination-database=bookings-restored` with a backup from before the release." } }
        - { id: c, text: { en: "Read the documents with point-in-time recovery at a timestamp from before the release, and write them to a new database." } }
        - { id: d, text: { en: "Recreate the composite indexes of `(default)` on the new database, because backups do not include index configurations." } }
        - { id: e, text: { en: "Reapply the TTL policies and configure the Security Rules on the new database, because backups do not include them." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          A Firestore restore writes the backup's data to a new database, so you restore a backup from before the release to an unused database ID. Backups include the data and index configurations but not TTL policies or Security Rules, which you must reapply on the restored database.
      options:
        a: { en: "A restore cannot target a database ID that is already in use, so it cannot overwrite `(default)`." }
        c: { en: "Point-in-time recovery keeps 7 days of versions, so a timestamp from three weeks ago is outside its window." }
        d: { en: "Each backup includes the index configurations of the database, so the restored database already has them." }
    references:
      - title: Back up and restore data
        url: https://docs.cloud.google.com/firestore/docs/backups

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-34-10
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The bucket `gs://telemetry-raw` has no Object Versioning and holds 400 million Standard objects, most of them under 4 KiB. A nightly tool also uploads multi-gigabyte archives with XML API multipart uploads, and it sometimes crashes and leaves incomplete uploads. You must move objects larger than 1 MiB to Coldline 30 days after creation without operation charges that exceed the storage savings, and abort incomplete multipart uploads 7 days after they start.

        Which two lifecycle rules should you configure? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Action `SetStorageClass` to `COLDLINE`, with the conditions `age: 30` and `matchesStorageClass: [\"STANDARD\"]`." } }
        - { id: b, text: { en: "Action `SetStorageClass` to `COLDLINE`, with the conditions `age: 30` and `sizeAboveBytes: 1048576`." } }
        - { id: c, text: { en: "Action `AbortIncompleteMultipartUpload`, with the conditions `age: 7` and `sizeAboveBytes: 1048576`." } }
        - { id: d, text: { en: "Action `AbortIncompleteMultipartUpload`, with the condition `age: 7`." } }
        - { id: e, text: { en: "Action `Delete`, with the conditions `age: 7` and `isLive: false`." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Each object that `SetStorageClass` transitions costs one Class A operation, so `sizeAboveBytes` keeps the millions of tiny objects out of the rule, where operation charges would exceed the savings. `AbortIncompleteMultipartUpload` with `age: 7` aborts uploads 7 days after they were initiated and deletes their parts.
      options:
        a: { en: "This rule also moves the hundreds of millions of tiny objects, and one Class A charge per object would exceed the savings on them." }
        c: { en: "`AbortIncompleteMultipartUpload` accepts only the `age`, `matchesPrefix` and `matchesSuffix` conditions; adding `sizeAboveBytes` causes an error." }
        e: { en: "`isLive: false` matches noncurrent object versions, which this bucket does not have; incomplete multipart uploads are not objects that this rule deletes." }
    references:
      - title: Object Lifecycle Management
        url: https://docs.cloud.google.com/storage/docs/lifecycle
