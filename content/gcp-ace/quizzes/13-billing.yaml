chapter: 13-billing
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-13-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A software company is planning the Cloud Billing setup of its new organization. The finance lead asks how projects and Cloud Billing accounts relate to each other before deciding how many accounts to create.

        Which statement is correct?
    body:
      options:
        - { id: a, text: { en: "A billing account can pay for many projects, and a project is linked to one billing account at a time." } }
        - { id: b, text: { en: "A billing account pays for one project, and a project can be linked to several billing accounts." } }
        - { id: c, text: { en: "A billing account can pay only for the projects of the organization that owns the billing account." } }
        - { id: d, text: { en: "A project can run free-tier services without a billing account, and paid services once it is linked." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A Cloud Billing account tracks and pays the costs of all the projects linked to it, so one account can pay for many projects. The link defines which single billing account pays for a given project; changing it moves the project to another account rather than adding a second one.
      options:
        b: { en: "One billing account usually pays for many projects, and a project can't split its costs between two billing accounts." }
        c: { en: "A billing account can also pay for projects that belong to another organization, for example a client's projects." }
        d: { en: "Without an active, linked billing account, a Google Cloud project can't use its enabled services, even the free ones." }
    references:
      - title: Cloud Billing overview
        url: https://docs.cloud.google.com/billing/docs/concepts

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-13-02
    objective: "1.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You create a monthly budget for a project in the Google Cloud console. You enter the target amount and keep the threshold rules that the console proposes, without changing them.

        When will the budget send alert notifications?
    body:
      options:
        - { id: a, text: { en: "When the actual spend reaches 50%, 80% and 100% of the target amount" } }
        - { id: b, text: { en: "When the forecasted spend reaches 50%, 90% and 100% of the target amount" } }
        - { id: c, text: { en: "When the actual spend reaches 50%, 90% and 100% of the target amount" } }
        - { id: d, text: { en: "Only when the actual spend reaches 100% of the target amount" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A new budget proposes three threshold rules by default: 50%, 90% and 100% of the target amount, all calculated on actual spend. You can change the percentages, add rules or switch a rule to forecasted spend, and none of these alerts stops spending.
      options:
        a: { en: "50%, 80% and 100% are the fixed notification thresholds of spend cap budgets, not the defaults of an alerts-only budget." }
        b: { en: "The default rules use actual spend; forecasted spend is an option that you select for each rule." }
        d: { en: "The default configuration has three thresholds, not a single one at 100%." }
    references:
      - title: Create, edit, or delete budgets and budget alerts
        url: https://docs.cloud.google.com/billing/docs/how-to/budgets

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-13-03
    objective: "1.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The project `render-farm` was paid by billing account A since January. On 16 May, after a reorganization, you run `gcloud billing projects link render-farm --billing-account=B_ACCOUNT_ID`, and the project keeps running without interruption.

        How is the project's usage for May billed?
    body:
      options:
        - { id: a, text: { en: "Usage before the change is billed to account A, and usage after the change to account B." } }
        - { id: b, text: { en: "All the May usage is billed to account B, the account linked at the end of the invoice month." } }
        - { id: c, text: { en: "All the May usage is billed to account A, and account B starts paying at the June invoice month." } }
        - { id: d, text: { en: "Usage is billed to account A for two more days, until the reports show the link to account B." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          When a project moves to another billing account, the charges incurred before the move stay with the former account, even those not yet visible in its transaction history. Usage from the change onward is charged to the new account, so the May costs are split by date between A and B.
      options:
        b: { en: "The change isn't retroactive: the new account pays only for usage after the link was changed." }
        c: { en: "The new account starts paying at the change itself, not at the next invoice month." }
        d: { en: "Reports can take up to two days to reflect the move, but this delay doesn't change which account pays." }
    references:
      - title: Enable, disable, or change billing for a project
        url: https://docs.cloud.google.com/billing/docs/how-to/modify-project

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-13-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A product team wants to know as soon as a month costs more than the month before. You need a recurring budget whose target amount is set each month to the previous month's spend, without anyone editing the budget. Last month the project cost 4,200 USD.

        Which flags should you add to the `gcloud billing budgets create` command?
    body:
      options:
        - { id: a, text: "`--last-period-amount --start-date=2026-12-01`" }
        - { id: b, text: "`--budget-amount=4200USD --calendar-period=month`" }
        - { id: c, text: "`--last-period-amount --calendar-period=quarter`" }
        - { id: d, text: "`--last-period-amount --calendar-period=month`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `--last-period-amount` replaces a fixed `--budget-amount`: the target amount is updated at each period with the spend of the previous period. This amount type is available only for recurring calendar periods, and `--calendar-period=month` compares each month with the one before.
      options:
        a: { en: "A start date without a calendar period creates a custom time range, which doesn't recur and can't use last period's spend as its amount." }
        b: { en: "A fixed amount of 4,200 USD stays the same every month, so someone would have to edit it each month." }
        c: { en: "A quarterly period compares each quarter with the previous quarter, not each month with the previous month." }
    references:
      - title: Create, edit, or delete budgets and budget alerts
        url: https://docs.cloud.google.com/billing/docs/how-to/budgets
      - title: gcloud billing budgets create
        url: https://docs.cloud.google.com/sdk/gcloud/reference/billing/budgets/create

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-13-05
    objective: "1.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        On 27 November, the CFO asks for a chart of the costs of each project for each month of the third quarter (July to September), to present at a meeting the next day. The company's billing account has never exported data to BigQuery. You have the Billing Account Viewer role on the account.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Enable the standard usage cost export to a multi-region dataset, and query it once the backfill ends." } }
        - { id: b, text: { en: "Open the Reports page of the billing account, set the range to July to September, and group by project." } }
        - { id: c, text: { en: "Enable the detailed usage cost export to a regional dataset, and query the costs grouped by project." } }
        - { id: d, text: { en: "Enable the pricing data export, and multiply each SKU price by the usage of each project." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Reports page of Cloud Billing reads the account's historical cost data directly, back to 2017, so it needs no export. You can choose a custom time range and group by month and project, and Billing Account Viewer gives the read access that this view requires.
      options:
        a: { en: "The backfill of a multi-region dataset starts at the beginning of the previous month (October here) and can take up to five days, so the third quarter is missing." }
        c: { en: "A regional dataset receives no backfill: data starts on the day the export is enabled, so no data from July to September arrives." }
        d: { en: "Pricing data is never backfilled and contains prices, not usage, and the pricing export also requires Billing Account Administrator." }
    references:
      - title: Analyze billing data and cost trends with Reports
        url: https://docs.cloud.google.com/billing/docs/how-to/reports
      - title: Set up Cloud Billing data export to BigQuery
        url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery-setup

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-13-06
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Example Corp's organization owns six Cloud Billing accounts, and each new subsidiary gets its own billing account, created in the organization by the finance team. The internal audit group `audit@example.com` must be able to read the costs, invoices and transactions of every billing account of the organization, including the accounts created later, with no action when an account is added. The group must not be able to change budgets, exports, payment methods or project links.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Grant the group the Billing Account Viewer role on each of the six existing billing accounts." } }
        - { id: b, text: { en: "Grant the group the Billing Account Viewer role on the organization resource of Example Corp." } }
        - { id: c, text: { en: "Grant the group the Billing Account Costs Manager role on the organization resource of Example Corp." } }
        - { id: d, text: { en: "Grant the group the Billing Account Viewer role on the folder that contains the finance projects." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Billing roles can be granted on the organization, and billing accounts owned by the organization inherit that policy, including accounts created later. Billing Account Viewer gives read-only access to cost and payment information, which is what an audit group needs, with no right to change anything.
      options:
        a: { en: "Grants on each existing account don't cover the billing accounts created later, so the finance team would have to add the group each time." }
        c: { en: "Billing Account Costs Manager can create and edit budgets and configure cost exports, which the audit group must not do." }
        d: { en: "Folders don't contain billing accounts: billing account roles are granted on the organization or on a billing account." }
    references:
      - title: Cloud Billing access control and permissions
        url: https://docs.cloud.google.com/billing/docs/how-to/billing-access

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-13-07
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A startup created a spend cap budget of 1,500 USD for its project `assist-prod`, scoped to the Gemini API. The project also runs a Cloud SQL instance and Compute Engine VMs. On 20 March, the estimated gross cost of the Gemini API in the project exceeds 1,500 USD, and the spend cap is enforced.

        Which two outcomes should the team expect? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The Cloud SQL instance and the VMs of the project are stopped until someone lifts the spend cap." } }
        - { id: b, text: { en: "Gemini API requests already in progress when the cap is enforced complete and are billed." } }
        - { id: c, text: { en: "Billing is disabled on the project, and some of its resources might be deleted without recovery." } }
        - { id: d, text: { en: "The team can raise the amount to 2,000 USD while the cap is enforced, which resumes usage at once." } }
        - { id: e, text: { en: "New Gemini API usage in the project stays paused until 1 April, unless someone lifts the cap first." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          When a spend cap is enforced, new usage of the selected service in the project is paused for the rest of the monthly period, and requests already in flight finish and accrue charges. The cap lifts automatically at the start of the next month, or earlier if someone selects Lift spend cap on the budget.
      options:
        a: { en: "Persistent resources such as compute and storage aren't paused by a spend cap; they keep running and accruing charges." }
        c: { en: "A spend cap doesn't touch the billing link and deletes no resource or data; disabling billing would be a separate, programmatic action." }
        d: { en: "A spend cap budget can't be edited while its cap is enforced: the cap must be lifted first." }
    references:
      - title: Manage spend cap budgets
        url: https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-13-08
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The project `ledger-prod` is linked to the billing account `CORP-BA`, and the link is locked. Finance decides that the project must be paid by another billing account from tomorrow. Kenji, a platform engineer, will perform the move, but he first has to unlock the link. He currently has no role on `ledger-prod` or on `CORP-BA`.

        Which two role grants would each, on its own, allow Kenji to unlock the link? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Billing Account User and Billing Account Viewer on `CORP-BA`" } }
        - { id: b, text: { en: "Billing Account Administrator on `CORP-BA`" } }
        - { id: c, text: { en: "Billing Account Costs Manager on `CORP-BA`" } }
        - { id: d, text: { en: "Owner (`roles/owner`) on `ledger-prod`" } }
        - { id: e, text: { en: "Editor (`roles/editor`) on `ledger-prod`" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Unlocking needs either the project-side roles (Project Billing Manager with Project Browser, or Owner) or the Billing Account Administrator role on the linked billing account. Unlike locking or linking, unlocking doesn't need roles on both sides, so either grant is enough on its own.
      options:
        a: { en: "Billing Account User and Billing Account Viewer, together with project-side roles, let a user lock a link, but they don't allow unlocking it." }
        c: { en: "Billing Account Costs Manager manages budgets and cost data and can't link, unlink or unlock projects." }
        e: { en: "Editor doesn't include the project's billing permissions; Owner and Project Billing Manager do." }
    references:
      - title: Secure the link between a project and its billing account
        url: https://docs.cloud.google.com/billing/docs/how-to/secure-project-billing-account-link

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-13-09
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Since 2024, the standard usage cost export of your billing account writes to the dataset `billing` in the project `team-analytics`, in the US multi-region. The company now centralizes cost data in a new FinOps project, `finops-hub`, which is linked to the same billing account, with a new dataset `billing_central` in the US multi-region. Analysts must keep running queries that cover all the data since 2024, and the export must write only to `billing_central` from now on.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Point the export to `billing_central`, and let the export backfill the new dataset with the data since 2024." } }
        - { id: b, text: { en: "Add `billing_central` as a second destination of the export, and remove `billing` after a full year." } }
        - { id: c, text: { en: "Point the export to `billing_central`, keep `billing`, and combine both datasets in the analysts' queries." } }
        - { id: d, text: { en: "Disable the export, and re-enable it with `billing_central` so that the initial backfill loads all the data." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Changing the project or the dataset of an export doesn't move or backfill the data already exported: the new dataset receives data from the change onward. Keeping the old dataset and joining or combining it with the new one in queries keeps the history since 2024; both datasets are in the US multi-region, so one query can read both.
      options:
        a: { en: "Changing the destination dataset doesn't backfill earlier data into it." }
        b: { en: "A billing account supports only one destination dataset per export type, so the standard export can't write to two datasets." }
        d: { en: "Re-enabling an export doesn't add retroactive data to the new dataset, and even a first backfill only starts at the beginning of the previous month." }
    references:
      - title: Set up Cloud Billing data export to BigQuery
        url: https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery-setup

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-13-10
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A rendering team needs a monthly budget of 8,000 USD for its projects `render-a` and `render-b`. The budget must track only the Compute Engine costs of these projects, measured before committed use discounts, sustained use discounts and promotional credits are deducted. Alerts must go only to the team's Cloud Monitoring notification channel: the billing account's administrators and users must not receive any budget email. The service ID of Compute Engine is `6F81-5844-456A`. You start the command as follows:

        ```bash
        gcloud billing budgets create --billing-account=01A2B3-C4D5E6-F7A8B9 \
          --display-name="render-compute" --budget-amount=8000USD \
          --calendar-period=month \
          --filter-projects=projects/render-a,projects/render-b \
          --threshold-rule=percent=0.8 --threshold-rule=percent=1.0 \
          --notifications-rule-monitoring-notification-channels=projects/render-ops/notificationChannels/4417 \
        ```

        Which three flags complete the command? Choose three.
    body:
      choose: 3
      options:
        - { id: a, text: "`--filter-services=services/6F81-5844-456A`" }
        - { id: b, text: "`--filter-labels=service=compute-engine`" }
        - { id: c, text: "`--credit-types-treatment=exclude-all-credits`" }
        - { id: d, text: "`--credit-types-treatment=include-all-credits`" }
        - { id: e, text: "`--disable-default-iam-recipients`" }
        - { id: f, text: "`--ownership-scope=billing-account`" }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          `--filter-services` takes services in the form `services/SERVICE_ID`, and 6F81-5844-456A is Compute Engine. `--credit-types-treatment=exclude-all-credits` measures spend before discounts and credits, which are otherwise all deducted by default. `--disable-default-iam-recipients` stops the default emails to Billing Account Administrators and Users, so only the linked Monitoring channel is notified.
      options:
        b: { en: "A label filter selects resources that carry a user-defined label; it doesn't select a service, and unlabeled Compute Engine usage would be left out." }
        d: { en: "Including all credits is the default behavior and measures costs net of discounts and credits, the opposite of the requirement." }
        f: { en: "The ownership scope decides which users have full access to the budget's data, not who receives its alert notifications." }
    references:
      - title: gcloud billing budgets create
        url: https://docs.cloud.google.com/sdk/gcloud/reference/billing/budgets/create
      - title: Create, edit, or delete budgets and budget alerts
        url: https://docs.cloud.google.com/billing/docs/how-to/budgets
