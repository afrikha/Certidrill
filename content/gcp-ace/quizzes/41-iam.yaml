chapter: 41-iam
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A museum publishes free photos in the Cloud Storage bucket `gs://open-collection`, which uses uniform bucket-level access. Anyone on the internet, including visitors who have no Google Account, must be able to download the photos. No organization policy and no public access prevention setting blocks public access.

        Which principal should you grant the Storage Object Viewer role on the bucket?
    body:
      options:
        - { id: a, text: "`allAuthenticatedUsers`" }
        - { id: b, text: "`domain:museum.example.org`" }
        - { id: c, text: "`allUsers`" }
        - { id: d, text: "`group:visitors@museum.example.org`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `allUsers` represents anyone on the internet, authenticated or not. Granting it Storage Object Viewer on the bucket makes the objects publicly readable, including by visitors without a Google Account.
      options:
        a: { en: "`allAuthenticatedUsers` covers only users and service accounts signed in with a Google Account, so anonymous visitors would be refused." }
        b: { en: "`domain:` covers the Google Accounts of one Cloud Identity or Google Workspace domain, not the public." }
        d: { en: "A Google group contains only its members' Google Accounts; visitors who aren't members, or have no account, get no access." }
    references:
      - title: IAM principals
        url: https://docs.cloud.google.com/iam/docs/principals-overview

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-41-02
    objective: "4.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A software company is about to move its first application to a production project. The team lead asks which kind of IAM role Google recommends as the default choice when granting access to the teams in production.

        What should you answer?
    body:
      options:
        - { id: a, text: { en: "Legacy basic roles, such as Editor, because they cover every service of the project" } }
        - { id: b, text: { en: "Basic roles, such as Writer, because they support IAM Conditions unlike the legacy ones" } }
        - { id: c, text: { en: "Custom roles copied from basic roles, because the company then controls every permission" } }
        - { id: d, text: { en: "Predefined roles of each service, because Google maintains and updates their permissions" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Predefined roles are the default choice: each one targets a service and a job, and Google updates its permissions as the service evolves. Google advises against granting basic roles in production unless there is no alternative, and custom roles are for cases where no predefined role is narrow enough.
      options:
        a: { en: "Legacy basic roles are very broad across all services, which is why Google advises against them in production." }
        b: { en: "Basic roles such as Writer support conditions, but they are just as broad; they are not recommended in production either." }
        c: { en: "A copy of a basic role is as broad as the original, and custom roles must be maintained by the customer, so they are not the default choice." }
    references:
      - title: Roles overview
        url: https://docs.cloud.google.com/iam/docs/roles-overview

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-41-03
    objective: "4.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        In the project `plant-ops`, the custom role `lineOperator` is granted to six groups. The security team created `lineOperatorV2` and will move the groups to it over the next month. Until then, administrators must be able to see that `lineOperator` should not be used in new bindings, and the existing bindings must keep working.

        What should you do?
    body:
      options:
        - { id: a, text: "`gcloud iam roles update lineOperator --project=plant-ops --stage=DEPRECATED`" }
        - { id: b, text: "`gcloud iam roles update lineOperator --project=plant-ops --stage=DISABLED`" }
        - { id: c, text: "`gcloud iam roles delete lineOperator --project=plant-ops`" }
        - { id: d, text: "`gcloud iam roles update lineOperator --project=plant-ops --stage=BETA`" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Most launch stages of a custom role are informational: they tell administrators whether a role is ready for wide use. Setting `DEPRECATED` flags the role as on its way out without changing what its bindings allow, so the groups keep their access during the migration.
      options:
        b: { en: "`DISABLED` is the one stage with an effect: it inactivates every binding of the role, so the six groups would lose access immediately." }
        c: { en: "Deleting the role makes its bindings ineffective and blocks new bindings, which breaks access before the migration is done." }
        d: { en: "`BETA` is informational too, but it tells administrators that the role is still being tested, not that it should stop being used." }
    references:
      - title: Create and manage custom roles
        url: https://docs.cloud.google.com/iam/docs/creating-custom-roles

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-41-04
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A security engineer holds the Owner role on your organization. She must attach IAM deny policies to several folders, but every attempt fails with a permission error. You must follow the principle of least privilege.

        Which role should you grant her on the organization?
    body:
      options:
        - { id: a, text: { en: "Organization Policy Administrator (`roles/orgpolicy.policyAdmin`)" } }
        - { id: b, text: { en: "Deny Admin (`roles/iam.denyAdmin`)" } }
        - { id: c, text: { en: "Admin basic role (`roles/admin`)" } }
        - { id: d, text: { en: "Organization Administrator (`roles/resourcemanager.organizationAdmin`)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Creating, updating and deleting deny policies requires the `iam.denypolicies.*` permissions of the Deny Admin role, granted on the organization. Even the Owner and Admin roles don't contain the permissions to create IAM deny policies, which is why the attempts fail.
      options:
        a: { en: "Organization Policy Administrator manages organization policy constraints, which restrict configurations; it doesn't manage IAM deny policies." }
        c: { en: "Like Owner, the Admin basic role doesn't include the permissions to create IAM deny policies, and it is far broader than needed." }
        d: { en: "Organization Administrator manages the organization's allow policies and hierarchy, not IAM deny policies." }
    references:
      - title: Deny access to resources
        url: https://docs.cloud.google.com/iam/docs/deny-access
      - title: Roles overview
        url: https://docs.cloud.google.com/iam/docs/roles-overview

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-41-05
    objective: "4.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The allow policy of the project `orders-prod` contains 30 role bindings. A CI pipeline must give the service account `publisher@orders-prod.iam.gserviceaccount.com` the Pub/Sub Publisher role on the project with one command. The other 30 bindings must stay unchanged.

        Which command should the pipeline run?
    body:
      options:
        - { id: a, text: "`gcloud projects set-iam-policy orders-prod binding.json`, where `binding.json` contains only the new binding" }
        - { id: b, text: "`gcloud projects add-iam-policy-binding orders-prod --member=user:publisher@orders-prod.iam.gserviceaccount.com --role=roles/pubsub.publisher`" }
        - { id: c, text: "`gcloud projects add-iam-policy-binding orders-prod --member=serviceAccount:publisher@orders-prod.iam.gserviceaccount.com --role=roles/pubsub.publisher`" }
        - { id: d, text: "`gcloud iam roles update roles/pubsub.publisher --project=orders-prod --add-permissions=pubsub.topics.publish`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `add-iam-policy-binding` adds one principal to one role in the project's allow policy and leaves every other binding as it is. It is the quick, safe way to grant a single role.
      options:
        a: { en: "`set-iam-policy` writes the file as the project's whole allow policy, so a file with one binding removes the 30 others." }
        b: { en: "A service account is identified with the `serviceAccount:` prefix; the `user:` prefix is for Google Accounts of people, so this member does not name the pipeline's service account." }
        d: { en: "Predefined roles can't be edited, and changing a role's permissions does not grant it to anyone." }
    references:
      - title: Manage access to projects, folders, and organizations
        url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-41-06
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The `Finance` folder of an insurer contains 14 projects, and new projects are added every quarter. The internal audit group `audit@example.com` must read the Data Access audit logs, as well as the other logs, of every project in this folder, including future ones. The group must not read logs of projects outside the folder. You must follow the principle of least privilege.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Grant the group the Logs Viewer role (`roles/logging.viewer`) on the `Finance` folder" } }
        - { id: b, text: { en: "Grant the group the Private Logs Viewer role (`roles/logging.privateLogViewer`) on each project of `Finance`" } }
        - { id: c, text: { en: "Grant the group the Private Logs Viewer role (`roles/logging.privateLogViewer`) on the organization" } }
        - { id: d, text: { en: "Grant the group the Private Logs Viewer role (`roles/logging.privateLogViewer`) on the `Finance` folder" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Private Logs Viewer contains the Logs Viewer permissions plus read access to private logs such as Data Access audit logs. Granted on the folder, it is inherited by every project in the folder, including projects created or moved there later, and by no project outside it.
      options:
        a: { en: "Logs Viewer reads the logs in the `_Required` and `_Default` buckets except the Data Access audit logs, which the auditors need." }
        b: { en: "Project-level grants cover today's 14 projects but not the projects added next quarter, which would need new grants each time." }
        c: { en: "A grant on the organization is inherited by every project of the company, including projects outside `Finance`." }
    references:
      - title: Access control with IAM
        url: https://docs.cloud.google.com/logging/docs/access-control
      - title: Using resource hierarchy for access control
        url: https://docs.cloud.google.com/iam/docs/resource-hierarchy-access-control

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-41-07
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A developer gets a permission error when she deletes a Pub/Sub subscription in the project `pay-dev`, which sits in the folder `Payments` of your organization. The organization uses both allow policies and deny policies, attached at several levels. Before you change anything, you must review, with a single gcloud command, every allow policy and every deny policy attached to the project, to its folder and to the organization.

        Which command should you run?
    body:
      options:
        - { id: a, text: "`gcloud projects get-ancestors-iam-policy pay-dev`" }
        - { id: b, text: "`gcloud iam policies list --attachment-point=cloudresourcemanager.googleapis.com/projects/pay-dev --kind=denypolicies`" }
        - { id: c, text: "`gcloud asset search-all-iam-policies --scope=projects/pay-dev`" }
        - { id: d, text: "`gcloud projects get-ancestors-iam-policy pay-dev --include-deny`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `get-ancestors-iam-policy` returns the allow policies of the project and of each of its ancestors, the folder and the organization. The `--include-deny` flag adds the deny policies attached at those levels to the result, so one command shows both kinds of policy across the hierarchy.
      options:
        a: { en: "Without `--include-deny`, the command returns only the allow policies of the project and its ancestors." }
        b: { en: "This lists only the deny policies attached to the project itself: no allow policy, and nothing from the folder or the organization." }
        c: { en: "This searches the allow policies of resources inside the project; it doesn't return deny policies or the policies of the ancestors." }
    references:
      - title: Using resource hierarchy for access control
        url: https://docs.cloud.google.com/iam/docs/resource-hierarchy-access-control
      - title: Deny policies
        url: https://docs.cloud.google.com/iam/docs/deny-overview

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-41-08
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Since the project `render-prod` was created, the group `contractors@example.com` has held the Compute Instance Admin (v1) role on it through a binding without a condition. Last month, to make this access temporary, an administrator added a second binding of the same role for the same group, with the condition `request.time < timestamp("2026-10-31T00:00:00Z")`. It is now November 2026, and the group's members can still manage VMs in the project. The access must end as intended.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Remove the binding without a condition, so that only the expired conditional binding remains for the group" } }
        - { id: b, text: { en: "Move the condition's end date to `2026-10-01T00:00:00Z`, so that the conditional binding expires earlier" } }
        - { id: c, text: { en: "Rewrite the policy with `set-iam-policy` and `version: 3`, so that IAM starts evaluating the condition" } }
        - { id: d, text: { en: "Add a third binding of the same role whose condition uses `request.time >` the end date, to block access" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Conditional role bindings don't override bindings without conditions. While the unconditional binding exists, the group keeps the role whatever the condition says; once it is removed, only the conditional binding applies, and it no longer grants anything after its end date.
      options:
        b: { en: "The condition already returns false, so an earlier date changes nothing; the unconditional binding is what still grants access." }
        c: { en: "The policy already holds the conditional binding, so it is already evaluated; the version is not why the group still has access." }
        d: { en: "Allow bindings only add access; a condition can limit when a binding grants a role, but no allow binding can take away a role granted by another one." }
    references:
      - title: Overview of IAM Conditions
        url: https://docs.cloud.google.com/iam/docs/conditions-overview

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-41-09
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You ran `gcloud projects remove-iam-policy-binding ops-prod --member=user:leo@example.com --role=roles/compute.instanceAdmin.v1`, and the command succeeded. One hour later, Leo can still stop and start VMs in `ops-prod`. No deny policy exists in the organization.

        Which two causes could explain this? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Leo belongs to a Google group that holds a role with the VM start and stop permissions on `ops-prod`." } }
        - { id: b, text: { en: "Leo keeps the role until he signs out of the console, because IAM evaluates roles only at sign-in." } }
        - { id: c, text: { en: "A binding on the folder of `ops-prod` or on the organization grants Leo a role with these permissions." } }
        - { id: d, text: { en: "Leo holds the Compute Viewer role on `ops-prod`, and this role allows starting and stopping VMs." } }
        - { id: e, text: { en: "The `compute.vmExternalIpAccess` organization policy constraint of the project lists Leo's VMs as allowed." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A principal's effective access is the union of the bindings on the resource and on all its ancestors, and of the roles granted to the groups the principal belongs to. Removing Leo's direct binding on the project takes nothing away from a role he gets through a group or through an inherited binding on the folder or the organization.
      options:
        b: { en: "IAM checks the allow policies on each request, and policy changes usually apply within minutes; there is no sign-in cache of roles." }
        d: { en: "Compute Viewer is a read-only role; it lets Leo see VMs but not start or stop them." }
        e: { en: "Organization policies restrict which configurations are allowed; they never grant a principal any permission." }
    references:
      - title: Using resource hierarchy for access control
        url: https://docs.cloud.google.com/iam/docs/resource-hierarchy-access-control
      - title: Manage access to projects, folders, and organizations
        url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-41-10
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Ten days ago, an administrator deleted by mistake the custom role `reportRunner` of the project `bi-prod`. It was granted to three groups on the project, and these groups have had no access since. You must give the three groups their former permissions back today, with the least effort.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Run `gcloud iam roles undelete reportRunner --project=bi-prod` to restore the role with its bindings" } }
        - { id: b, text: { en: "Create a custom role with a new role ID, such as `reportRunnerV2`, with the same permissions" } }
        - { id: c, text: { en: "Create a custom role with the same role ID, `reportRunner`, so the old bindings work again" } }
        - { id: d, text: { en: "Grant the new custom role to the three groups on `bi-prod` with `add-iam-policy-binding`" } }
        - { id: e, text: { en: "Run `gcloud iam roles update reportRunner --project=bi-prod --stage=GA` to reactivate the role" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A deleted custom role can be undeleted only within 7 days; after that, its permanent deletion starts and its role ID can't be reused until the process ends, up to 44 days after the deletion request. The fastest way back is a new role with a new ID and the same permissions, granted again to the three groups.
      options:
        a: { en: "The 7-day undelete window has passed, so the role can no longer be undeleted." }
        c: { en: "The role ID stays reserved until permanent deletion completes, up to 44 days after the deletion request, so it can't be reused on day 10." }
        e: { en: "A deleted role can't be updated, and the launch stage is not what made its bindings ineffective." }
    references:
      - title: Create and manage custom roles
        url: https://docs.cloud.google.com/iam/docs/creating-custom-roles
