chapter: 37-monitoring
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-37-01
    objective: "3.4.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The checkout page of an online store has become slow. Cloud Trace shows that most of the request time is spent waiting for the store's Cloud SQL for PostgreSQL instance. You need to find which SQL statements put the most load on the database.

        Which tool should you use?
    body:
      options:
        - { id: a, text: { en: "Cloud Profiler, to view flame graphs of the CPU time of the application" } }
        - { id: b, text: { en: "Query Insights, to view the database load of each normalized query" } }
        - { id: c, text: { en: "Error Reporting, to view the application errors grouped by stack trace" } }
        - { id: d, text: { en: "The Cloud SQL overprovisioned instance recommender, to view resize advice" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Query Insights is the Cloud SQL diagnostic tool for slow queries. Its dashboard shows database load over time for the top queries, with filters by database, user and client address, and sampled query plans. It has no additional cost.
      options:
        a: { en: "Cloud Profiler shows which functions of the application use CPU or memory; the time here is spent inside the database, not in application code." }
        c: { en: "Error Reporting groups exceptions; a slow query is not an error and would not appear there." }
        d: { en: "This recommender suggests a smaller machine for an underused instance; it does not identify the statements that load the database." }
    references:
      - title: Use query insights to improve query performance
        url: https://docs.cloud.google.com/sql/docs/postgres/using-query-insights

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-37-02
    objective: "3.4.13"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A company's organization contains several hundred projects, and many were created for short experiments years ago. The cloud team wants a list of projects that show little or no activity, so that their owners can be asked to delete them. The team wants the least effort.

        What should the team use?
    body:
      options:
        - { id: a, text: { en: "The IAM recommender, to find the principals that have unused permissions" } }
        - { id: b, text: { en: "The idle VM recommender, to find the instances that have low CPU usage" } }
        - { id: c, text: { en: "The unattended project recommender, to find the projects that look unused" } }
        - { id: d, text: { en: "A Cloud Asset Inventory search, to list the projects by their creation date" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Active Assist includes the unattended project recommender (`google.resourcemanager.projectUtilization.Recommender`), which analyzes usage and recommends reclaiming or removing projects that appear unused. It gives the list directly, without any custom analysis.
      options:
        a: { en: "The IAM recommender suggests removing excess permissions from principals; it does not evaluate whether a project is still used." }
        b: { en: "The idle VM recommender works on individual instances; many abandoned projects have no VM at all, and a project's use is more than its VMs." }
        d: { en: "A project's creation date says nothing about its current activity, and the team would still have to check each project by hand." }
    references:
      - title: Recommenders
        url: https://docs.cloud.google.com/recommender/docs/recommenders

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-37-03
    objective: "3.4.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The Service Health API is enabled in the project `pay-prod` of a payments company, and a PagerDuty notification channel already exists in Cloud Monitoring for the project. The on-call team must be paged automatically each time Google reports an incident that affects a Google Cloud product and location used by `pay-prod`. You want the least effort.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "In the Service Health dashboard, click Create Alert Policy, choose an example template and select the PagerDuty channel." } }
        - { id: b, text: { en: "Subscribe the PagerDuty email address to the feed of the public Google Cloud Service Health page for all products." } }
        - { id: c, text: { en: "Create an uptime check for each public endpoint of `pay-prod`, with an alerting policy that uses the PagerDuty channel." } }
        - { id: d, text: { en: "Schedule a Cloud Run job that calls the Service Health API every five minutes and sends new events to PagerDuty." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Personalized Service Health reports the Google Cloud incidents that affect the products and locations of your project. From the Service Health dashboard, Create Alert Policy offers example templates; you pick one, add the existing notification channel and create the policy, with no code to maintain.
      options:
        b: { en: "The public Service Health page lists every incident for every customer, so the team would be paged for products and regions it does not use." }
        c: { en: "An uptime check detects that your own endpoint fails, not that Google reported an incident, and it misses incidents that do not break these endpoints." }
        d: { en: "Polling the API with a custom job works but adds code and a schedule to maintain, which fails the least-effort requirement." }
    references:
      - title: "Quickstart: Set up an alert"
        url: https://docs.cloud.google.com/service-health/docs/configure-alerts-dashboard

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-37-04
    objective: "3.4.11"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A team has just created a GKE Autopilot cluster that runs GKE version 1.33. Its `orders` Pods, in the namespace `shop`, expose Prometheus metrics on a container port named `metrics`. The team wants these metrics in Google Cloud Managed Service for Prometheus, with the least effort.

        What should the team do?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud container clusters update` with `--enable-managed-prometheus`, then create a `PodMonitoring` in `shop`." } }
        - { id: b, text: { en: "Deploy a Prometheus server with Helm in `shop`, and configure it to scrape the `metrics` port of the Pods." } }
        - { id: c, text: { en: "Create an agent policy that installs the Ops Agent on the cluster nodes, with a Prometheus receiver." } }
        - { id: d, text: { en: "Create a `PodMonitoring` resource in `shop` that selects the `orders` Pods and scrapes the `metrics` port." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          On Autopilot clusters that run GKE 1.25 or later, managed collection is enabled by default and can't be turned off. The collectors don't scrape anything until you declare targets, so a `PodMonitoring` resource in the Pods' namespace is the only step needed.
      options:
        a: { en: "Managed collection is already on for this Autopilot cluster, so the update command is an unnecessary step." }
        b: { en: "Operating your own Prometheus server is exactly the effort that managed collection removes." }
        c: { en: "The Ops Agent is for Compute Engine VMs; Autopilot nodes are managed by Google and are not targets for agent policies." }
    references:
      - title: Get started with managed collection
        url: https://docs.cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-37-05
    objective: "3.4.14"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A Cloud Run service in the project `media-prod` failed between 09:00 and 10:30 today, and its alert closed at 10:30. At 16:00, an engineer who has the Cloud Hub Operator role opens the Cloud Hub Health & troubleshooting page for `media-prod` in project view to review the outage. The page lists the current alerts of other products, but nothing about the morning outage. The Service Health API is enabled in the project.

        What should the engineer do?
    body:
      options:
        - { id: a, text: { en: "Switch the page to the application view, which keeps the alerts of closed outages for each service" } }
        - { id: b, text: { en: "Change the time range of the page so that it includes the morning, instead of the default range" } }
        - { id: c, text: { en: "Ask for the Monitoring AlertPolicy Editor role, so that the page can also list the closed alerts" } }
        - { id: d, text: { en: "Open the Maintenance page of Cloud Hub, which lists past incidents in place of the health page" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          By default, the Health & troubleshooting page shows alerts, Google Cloud incidents and health data for the last hour only. An outage that ended more than five hours earlier is outside that range; widening the time range shows it again.
      options:
        a: { en: "The application view shows an App Hub application instead of the project; it does not change the default one-hour range." }
        c: { en: "The page already shows the project's alerts, so the engineer's access is enough; an editor role on alerting policies changes nothing on this page." }
        d: { en: "The Maintenance page shows planned maintenance and affected resources, not the project's alerts and incidents." }
    references:
      - title: View application and resource health
        url: https://docs.cloud.google.com/hub/docs/health

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-37-06
    objective: "3.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A video company's alerting policy watches its 40 transcoding VMs. It has two metric-threshold conditions on the `gce_instance` resource type, with no grouping: CPU utilization above 90 % for 10 minutes, and disk write operations above a limit for 10 minutes. The policy uses the default combiner. Last night the on-call engineer was paged while one VM had a high CPU and a different VM had heavy disk writes, which is normal. The engineer must be paged only when one VM meets both conditions at the same time.

        What should you change?
    body:
      options:
        - { id: a, text: { en: "Set the combiner of the policy to `OR`, and raise the retest window of each condition to 20 minutes" } }
        - { id: b, text: { en: "Set the combiner of the policy to `AND`, and keep the two conditions on the `gce_instance` type" } }
        - { id: c, text: { en: "Set the combiner of the policy to `AND_WITH_MATCHING_RESOURCE`, and keep the two conditions" } }
        - { id: d, text: { en: "Split the conditions into two policies that both use the engineer's notification channel" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `AND_WITH_MATCHING_RESOURCE` opens an alert only when the same resource causes every condition to be met; the conditions must monitor the same resource type and keep matching labels, which is the case here. The default combiner, `AND`, is met even when different resources meet each condition, which caused last night's page.
      options:
        a: { en: "`OR` pages as soon as any VM meets either condition, which produces more pages, whatever the retest window." }
        b: { en: "`AND` is already the default combiner and is met when different VMs meet the two conditions, which is the current problem." }
        d: { en: "Two separate policies each page on their own condition, so a VM with only high CPU would still page the engineer." }
    references:
      - title: Behavior of metric-based alerting policies
        url: https://docs.cloud.google.com/monitoring/alerts/concepts-indepth

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-37-07
    objective: "3.4.12"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A retail company has an Enhanced Support contract with Google Cloud and uses Gemini Cloud Assist, a Preview offering, in its project `shop-prod`. An SRE has the Gemini Cloud Assist User, Investigation Creator, Cloud Asset Viewer, Monitoring Viewer and Logs Viewer roles on the project. In November 2026, the SRE clicks Investigate on an alert that has a resource label, but the investigation can't be created. Investigations that the SRE ran in March 2026 can still be opened.

        What should you do so that the SRE can run new investigations?
    body:
      options:
        - { id: a, text: { en: "Grant the SRE the Investigation Owner role on the project, in addition to the Investigation Creator role." } }
        - { id: b, text: { en: "Disable and then enable the Gemini Cloud Assist API in `shop-prod` to refresh the project's setup." } }
        - { id: c, text: { en: "Grant the SRE the Gemini Cloud Assist Admin role, which is needed to start investigations from alerts." } }
        - { id: d, text: { en: "Request investigation access through the account team, or move the company to Premium Support." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Gemini Cloud Assist investigations are in Preview. Since April 10, 2026, creating, running and editing investigations is only available to users with a Premium Support contract or to users who requested access through their account team, while older investigations stay viewable. The SRE's roles are already sufficient, so the support contract is what decides.
      options:
        a: { en: "The Investigation Owner role is granted automatically, per investigation, to the account that creates it; granting it does not lift the support restriction." }
        b: { en: "The setup is working, since the console offers the Investigate button and old investigations open; re-enabling the API does not change the access rule." }
        c: { en: "Gemini Cloud Assist Admin adds policy and agent permission management, which the SRE does not need, and it does not lift the support restriction." }
    references:
      - title: Troubleshoot issues with Gemini Cloud Assist investigations
        url: https://docs.cloud.google.com/cloud-assist/investigations

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-37-08
    objective: "3.4.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A food delivery company runs its Go `checkout` service on Cloud Run with the user-managed service account `checkout-sa`, which has no roles. The product team wants a new business metric, the number of abandoned carts, in Cloud Monitoring, where the SREs will query it with PromQL. You must follow Google's recommended approach for metrics computed in application code, and the principle of least privilege.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Instrument the code with the OpenTelemetry SDK, and add the Google-built OpenTelemetry Collector as a sidecar of the service" } }
        - { id: b, text: { en: "Install the Ops Agent in the container image of the service, and start it from the entrypoint script before the application" } }
        - { id: c, text: { en: "Create a `PodMonitoring` resource that selects the `checkout` service and scrapes its metrics endpoint every 30 seconds" } }
        - { id: d, text: { en: "Grant `checkout-sa` the Monitoring Metric Writer role (`roles/monitoring.metricWriter`) on the project" } }
        - { id: e, text: { en: "Grant `checkout-sa` the Logs Writer role (`roles/logging.logWriter`) on the project for the exported metrics" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Google recommends OpenTelemetry for metrics computed in code. On Cloud Run, the application sends OTLP to `localhost`, and a Google-built OpenTelemetry Collector sidecar exports the metrics to Managed Service for Prometheus, where they can be queried with PromQL. The service identity needs only Monitoring Metric Writer to write the time series.
      options:
        b: { en: "The Ops Agent is the agent for Compute Engine VMs; on Cloud Run the supported pattern is a Collector sidecar container." }
        c: { en: "`PodMonitoring` is a Kubernetes resource of managed collection on GKE; it can't target a Cloud Run service." }
        e: { en: "Logs Writer allows writing log entries, not time series, so the Collector could not write the metric with it." }
    references:
      - title: Write OTLP metrics by using an OpenTelemetry Collector sidecar
        url: https://docs.cloud.google.com/run/docs/tutorials/custom-metrics-opentelemetry-sidecar

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-37-09
    objective: "3.4.10"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A bank's batch servers are Linux Compute Engine VMs that still run the legacy Monitoring agent. You must move them to the Ops Agent. The service accounts already have the required roles. The capacity team wants the host metrics, including memory, sampled every 30 seconds instead of every 60 seconds, and the metrics must not be ingested twice.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Keep the legacy Monitoring agent for host metrics, and turn off the built-in `hostmetrics` receiver of the Ops Agent." } }
        - { id: b, text: { en: "Remove the legacy Monitoring agent from each VM before you install the Ops Agent on it." } }
        - { id: c, text: { en: "Redefine the `hostmetrics` receiver with `collection_interval: 30s` in the agent's `config.yaml`, then restart the agent." } }
        - { id: d, text: { en: "Redefine the `hostmetrics` receiver with `collection_interval: 30s` in the agent's `config.yaml`, which is reloaded automatically." } }
        - { id: e, text: { en: "Set `collection_interval: 30s` in the `agentsRule` section of an agent policy that targets the batch VMs." } }
    answer: { optionIds: [b, c] }
    explanation:
      correct:
        en: |
          A legacy Monitoring or Logging agent next to the Ops Agent causes duplicate or conflicting ingestion, so it must be removed first (the install script also has flags to remove it). The user file `/etc/google-cloud-ops-agent/config.yaml` is merged with the built-in configuration, and a receiver declared with the built-in id `hostmetrics` overrides it; the agent applies changes only after a restart.
      options:
        a: { en: "The legacy agent must not stay on a VM that runs the Ops Agent; it is deprecated and conflicts with it." }
        d: { en: "The Ops Agent does not watch its configuration file: a change takes effect only when the agent is restarted." }
        e: { en: "An agent policy only controls the agent package (state and version) and the VMs it applies to; it does not carry the agent's collection settings." }
    references:
      - title: Configure the Ops Agent
        url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/configuration
      - title: Installing the Ops Agent on individual VMs
        url: https://docs.cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/installation

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-37-10
    objective: "3.4.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A new project hosts a Cloud SQL for PostgreSQL Enterprise Plus instance, and only the Cloud SQL Admin API and the Cloud Monitoring API are enabled in it. Query Insights is enabled on the instance with its Enterprise Plus features. A database administrator holds a custom role that contains every `cloudsql.instances.*` permission. In the Query Insights dashboard, the administrator can't see the historical query execution data, and the sampled query plans don't open. You must fix both problems with the least privilege.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Grant the administrator the Database Insights viewer and Cloud SQL viewer roles on the project" } }
        - { id: b, text: { en: "Add the `cloudsql.databases.*` and `cloudsql.users.*` permissions to the administrator's custom role" } }
        - { id: c, text: { en: "Grant the administrator the Cloud Trace Agent role (`roles/cloudtrace.agent`) on the project" } }
        - { id: d, text: { en: "Run `gcloud sql instances patch` with `--insights-config-query-plans-per-minute=20` on the instance" } }
        - { id: e, text: { en: "Enable the Cloud Trace API in the project that hosts the Cloud SQL instance" } }
    answer: { optionIds: [a, e] }
    explanation:
      correct:
        en: |
          For Enterprise Plus instances, the historical query execution data requires the predefined Database Insights viewer and Cloud SQL viewer roles: custom roles and other predefined roles don't provide sufficient permissions. Query plans and their end-to-end views also require the Cloud Trace API to be enabled in the project, which is not the case here.
      options:
        b: { en: "The documentation states that custom roles can't give access to the historical data of Enterprise Plus instances, whatever Cloud SQL permissions they hold." }
        c: { en: "Cloud Trace Agent lets a workload write spans; it doesn't let a person read query plans, and the missing piece is the API itself." }
        d: { en: "The sampling rate controls how many plans are captured per minute; it can't make plans viewable while the Cloud Trace API is disabled." }
    references:
      - title: Use query insights to improve query performance
        url: https://docs.cloud.google.com/sql/docs/postgres/using-query-insights
