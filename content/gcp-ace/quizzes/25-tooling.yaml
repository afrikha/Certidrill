chapter: 25-tooling
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-25-01
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A platform team writes Terraform configurations for its Google Cloud projects. It wants Google Cloud to run these configurations as a managed service, with no Terraform installed on any workstation, and to keep the state file, the logs and the configuration of every revision.

        Which product should the team use?
    body:
      options:
        - { id: a, text: { en: "Deployment Manager" } }
        - { id: b, text: { en: "Config Connector" } }
        - { id: c, text: { en: "Infrastructure Manager" } }
        - { id: d, text: { en: "Fabric FAST" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Infrastructure Manager is Google's managed service for Terraform configurations. Each deployment runs Terraform in an ephemeral Cloud Build environment, and Infrastructure Manager keeps the logs, the configuration, the list of resources and the state file of each revision. It also supports previews before changes are applied.
      options:
        a: { en: "Deployment Manager uses YAML with Jinja or Python templates, not Terraform, and it reached end of support on March 31, 2026; Google points its users to Infrastructure Manager." }
        b: { en: "Config Connector manages Google Cloud resources as Kubernetes objects in a cluster; it does not run Terraform configurations." }
        d: { en: "Fabric FAST is a set of Terraform stages for building an organization landing zone; it is code that you run, not a managed service that runs Terraform." }
    references:
      - title: Infrastructure Manager overview
        url: https://docs.cloud.google.com/infrastructure-manager/docs/overview
      - title: Deployment Manager deprecation
        url: https://docs.cloud.google.com/deployment-manager/docs/deprecations

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-25-02
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An engineer prepared a Terraform change for the production network. Before anything is changed, the infrastructure owner wants to review which resources Terraform would add, modify and destroy.

        Which command should the engineer run?
    body:
      options:
        - { id: a, text: { en: "`terraform validate`" } }
        - { id: b, text: { en: "`terraform plan`" } }
        - { id: c, text: { en: "`terraform fmt`" } }
        - { id: d, text: { en: "`terraform init -upgrade`" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `terraform plan` compares the configuration with the state and the real resources and lists what would be added, modified and destroyed, without applying anything. Google recommends always generating a plan first, and saving it so that the reviewed plan is the one that is applied after approval.
      options:
        a: { en: "`terraform validate` only checks that the configuration is syntactically valid; it does not compute any change." }
        c: { en: "`terraform fmt` rewrites the files in the standard style; it says nothing about the resources." }
        d: { en: "`terraform init -upgrade` prepares the working directory and upgrades the provider versions; it does not show planned changes." }
    references:
      - title: Basic Terraform commands
        url: https://docs.cloud.google.com/docs/terraform/basic-commands
      - title: Best practices for Terraform operations
        url: https://docs.cloud.google.com/docs/terraform/best-practices/operations

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-25-03
    objective: "2.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A developer deploys the application `orders-app` from a shared template in Application Design Center. The deployment creates a Cloud Run service, a Cloud SQL instance and a load balancer in the project `orders-prod`. The operations team wants to see and monitor these resources as a single unit, without registering anything by hand.

        Where will the operations team find the application?
    body:
      options:
        - { id: a, text: { en: "In Service Directory, where the deployment registers each resource as a service" } }
        - { id: b, text: { en: "In Cloud Asset Inventory, where the deployment groups the resources under one label" } }
        - { id: c, text: { en: "In Infrastructure Manager, where the deployment is listed as a Terraform revision" } }
        - { id: d, text: { en: "In App Hub, where the deployment registers the resources as one application" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Deploying an application from Application Design Center automatically registers it in App Hub. App Hub presents the deployed services and workloads as one application, which operations teams use to view and monitor it.
      options:
        a: { en: "Service Directory is a registry of service endpoints for discovery; Application Design Center does not register applications there." }
        b: { en: "Cloud Asset Inventory lists individual resources and their metadata; it is not where Design Center registers the application." }
        c: { en: "Infrastructure Manager is a managed Terraform service; Design Center applications are registered in App Hub, not listed as Infrastructure Manager revisions." }
    references:
      - title: Deploy applications
        url: https://docs.cloud.google.com/application-design-center/docs/deploy-applications

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-25-04
    objective: "2.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An engineer has managed the project `web-prod` with Terraform and a local state file. The team created the Cloud Storage bucket `example-tfstate` with Object Versioning, and the engineer added a `backend "gcs"` block for this bucket to the configuration. The existing state must move to the bucket, and Terraform must use it from now on.

        What should the engineer run next?
    body:
      options:
        - { id: a, text: { en: "`terraform init -reconfigure`" } }
        - { id: b, text: { en: "`terraform apply -refresh-only`" } }
        - { id: c, text: { en: "`terraform init -migrate-state`" } }
        - { id: d, text: { en: "`gcloud storage cp terraform.tfstate gs://example-tfstate/`" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          After a backend is added or changed, `terraform init -migrate-state` initializes the new `gcs` backend, detects the local state and offers to copy it to the bucket. From then on, Terraform reads the latest state from the bucket before each command.
      options:
        a: { en: "`-reconfigure` initializes the new backend while ignoring the existing state, so the bucket would start without the state of the resources already deployed." }
        b: { en: "A refresh-only apply updates the state from the real resources; it does not move the state to another backend." }
        d: { en: "Copying the file by hand does not configure Terraform, and the `gcs` backend expects the state under its prefix with its own object name, so Terraform would not find it." }
    references:
      - title: Store Terraform state in a Cloud Storage bucket
        url: https://docs.cloud.google.com/docs/terraform/resource-management/store-state

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-25-05
    objective: "2.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        In Cloud Shell, an engineer packaged the Helm chart `billing-2.0.1.tgz` with Helm 3.14. The chart must be pushed to the Docker-format Artifact Registry repository `charts` in `us-east1` of the project `fin-prod`. Company policy forbids service account keys.

        Which command should the engineer run before `helm push`?
    body:
      options:
        - { id: a, text: { en: "`gcloud auth print-access-token | helm registry login -u _json_key --password-stdin us-east1-docker.pkg.dev`" } }
        - { id: b, text: { en: "`gcloud auth print-access-token | helm registry login -u oauth2accesstoken --password-stdin us-east1-docker.pkg.dev`" } }
        - { id: c, text: { en: "`cat fin-sa-key.json | helm registry login -u _json_key --password-stdin us-east1-docker.pkg.dev`" } }
        - { id: d, text: { en: "`helm repo add charts https://us-east1-docker.pkg.dev/fin-prod/charts`" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Artifact Registry stores Helm charts as OCI artifacts, and Helm authenticates to the registry host with `helm registry login`. With a short-lived access token, the user name is `oauth2accesstoken` and the token is passed as the password. No key file is involved.
      options:
        a: { en: "The `_json_key` user name expects a service account key file as the password, not an access token." }
        c: { en: "This works technically, but it uses a long-lived service account key, which the company forbids and Google calls the least secure option." }
        d: { en: "`helm repo add` is for classic chart repositories; Artifact Registry is used as an OCI registry with `oci://` URLs after `helm registry login`." }
    references:
      - title: Set up authentication for Helm
        url: https://docs.cloud.google.com/artifact-registry/docs/helm/authentication

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-25-06
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A platform team enabled the Config Connector add-on on the GKE Standard cluster `ops-gke` in the project `ops-prod`, which uses Workload Identity Federation for GKE. Config Connector runs in cluster mode with the Google service account `cnrm-sa@ops-prod.iam.gserviceaccount.com`, bound to the controller's Kubernetes service account. An engineer who has the Pub/Sub Admin role on the project `data-prod` applies a `PubSubTopic` object to a namespace annotated with `cnrm.cloud.google.com/project-id=data-prod`. The object never becomes ready and reports a permission error.

        You must follow the principle of least privilege. What should you do?
    body:
      options:
        - { id: a, text: { en: "Grant the engineer the Service Account User role on `cnrm-sa`." } }
        - { id: b, text: { en: "Grant the Compute Engine default service account of the node pools the Pub/Sub Admin role on `data-prod`." } }
        - { id: c, text: { en: "Grant the GKE service agent of `ops-prod` the Pub/Sub Admin role on `data-prod`." } }
        - { id: d, text: { en: "Grant `cnrm-sa` the Pub/Sub Admin role on `data-prod`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Config Connector controller calls Google Cloud APIs as the Google service account set in its configuration, through Workload Identity Federation for GKE. The permissions of the user who ran `kubectl apply` are not used. `cnrm-sa` therefore needs a role that allows managing Pub/Sub topics in `data-prod`.
      options:
        a: { en: "The engineer doesn't act as `cnrm-sa`; the controller does, through its existing Workload Identity binding, so this grant fixes nothing." }
        b: { en: "With Workload Identity Federation for GKE, the controller does not use the node service account, and a role on it would be broader than needed." }
        c: { en: "The GKE service agent manages the cluster's own infrastructure; Config Connector does not call Pub/Sub with it." }
    references:
      - title: Installing with the GKE add-on
        url: https://docs.cloud.google.com/config-connector/docs/how-to/install-upgrade-uninstall

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-25-07
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The Cloud Storage bucket `example-media-raw` in the project `media-prod` holds 40 TB of footage and was created by hand. The team must now manage it with Config Connector from Git, in the namespace `media`, which is annotated for `media-prod`. The bucket must not be recreated and the data must not be copied. Config Connector must keep reverting manual changes to the bucket, and deleting the Kubernetes object by mistake must never delete the bucket.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Apply a `StorageBucket` object named `media-raw` whose `spec.location` matches the location of the bucket." } }
        - { id: b, text: { en: "Apply a `StorageBucket` object whose `metadata.name` is `example-media-raw` in the namespace `media`." } }
        - { id: c, text: { en: "Set the annotation `cnrm.cloud.google.com/reconcile-interval-in-seconds: \"0\"` on the object." } }
        - { id: d, text: { en: "Set the annotation `cnrm.cloud.google.com/deletion-policy: abandon` on the object." } }
        - { id: e, text: { en: "Apply a `StorageBucket` object for a new bucket, then copy the footage with Storage Transfer Service." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          When the name in a manifest matches an existing resource, Config Connector acquires that resource and starts managing it instead of creating a new one; for a bucket, `metadata.name` must be the bucket name. By default, deleting the object deletes the Google Cloud resource, so the `deletion-policy: abandon` annotation is needed to keep the bucket if the object is deleted.
      options:
        a: { en: "The name `media-raw` doesn't match the existing bucket, so Config Connector would try to create another bucket instead of acquiring `example-media-raw`." }
        c: { en: "An interval of 0 disables drift correction for the resource, so manual changes would no longer be reverted, and the setting can't be undone." }
        e: { en: "Creating a new bucket and copying 40 TB breaks the requirement not to recreate the bucket or copy the data." }
    references:
      - title: Managing and deleting resources
        url: https://docs.cloud.google.com/config-connector/docs/how-to/managing-deleting-resources
      - title: Reconciliation strategy
        url: https://docs.cloud.google.com/config-connector/docs/concepts/reconciliation

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-25-08
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A developer has the Application Operator role (`roles/designcenter.applicationOperator`) on the app-enabled folder and the Service Account User role on the existing service account `adc-deployer` in the management project. She deploys an application from an Application Design Center template, with `adc-deployer` selected, into the target project `orders-prod`. The deployment fails with a permission error when it creates the Cloud Run service and the Cloud SQL instance in `orders-prod`.

        You must follow the principle of least privilege. What should you do?
    body:
      options:
        - { id: a, text: { en: "Grant `adc-deployer` the roles that the template's components need, such as Cloud Run Admin and Cloud SQL Admin, on `orders-prod`." } }
        - { id: b, text: { en: "Grant the developer the roles that the template's components need, such as Cloud Run Admin and Cloud SQL Admin, on `orders-prod`." } }
        - { id: c, text: { en: "Grant the developer the Application Admin role (`roles/designcenter.applicationAdmin`) on the app-enabled folder." } }
        - { id: d, text: { en: "Grant `adc-deployer` the Owner role on the management project, which contains the space and the application." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Application Design Center previews and deploys applications as the selected service account, so that account needs roles to create the template's resources in each target project. The console shows the required roles during deployment. Granting only those roles on `orders-prod` follows least privilege.
      options:
        b: { en: "The resources are created by the deployment service account, not with the developer's own permissions, so roles granted to her don't fix the error." }
        c: { en: "Application Operator already allows deploying applications; the error comes from the service account's missing roles in the target project." }
        d: { en: "The failing resources are in `orders-prod`, so roles on the management project don't help, and Owner is far broader than needed." }
    references:
      - title: Grant roles to your service account
        url: https://docs.cloud.google.com/application-design-center/docs/grant-roles-service-account
      - title: Deploy applications
        url: https://docs.cloud.google.com/application-design-center/docs/deploy-applications

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-25-09
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The folder `platform` contains the projects `ops-prod` and `hr-eu`. The project `hr-eu` has data residency and customer-managed encryption key (CMEK) requirements. The group `ops-eng@example.com` wants to use Gemini Cloud Assist for design help and `gcloud` command generation in `ops-prod` only. No Gemini Cloud Assist API is enabled yet, and the required supporting APIs are already enabled in `ops-prod`.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Run `gcloud services enable geminicloudassist.googleapis.com --project=ops-prod`." } }
        - { id: b, text: { en: "Grant the group `roles/geminicloudassist.user` and `roles/cloudasset.viewer` on `ops-prod`." } }
        - { id: c, text: { en: "Grant the group the Agent Platform User role (`roles/aiplatform.user`) on `ops-prod`." } }
        - { id: d, text: { en: "Set up Gemini Cloud Assist on the `platform` folder in the console, so that every project gets it." } }
        - { id: e, text: { en: "Run `gcloud services enable geminicloudassist.googleapis.com --project=hr-eu` too, so that both projects share one setup." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Gemini Cloud Assist (Preview, which the objective names) is set up per project by enabling `geminicloudassist.googleapis.com` and granting users Gemini Cloud Assist User (`roles/geminicloudassist.user`) and Cloud Asset Viewer (`roles/cloudasset.viewer`). Gemini Cloud Assist can store data in any Google Cloud location, so it must not be enabled in a project with data residency or CMEK requirements such as `hr-eu`.
      options:
        c: { en: "Agent Platform User grants access to Gemini Enterprise Agent Platform resources; Gemini Cloud Assist needs its own user role and Cloud Asset Viewer." }
        d: { en: "Folder setup enables the APIs in every project of the folder, including `hr-eu`, which must not use Gemini Cloud Assist." }
        e: { en: "Gemini Cloud Assist must not be enabled for projects with data residency or CMEK requirements, and the group needs it only in `ops-prod`." }
    references:
      - title: Set up Gemini Cloud Assist
        url: https://docs.cloud.google.com/cloud-assist/set-up-gemini

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-25-10
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A platform team will deploy, with Infrastructure Manager, a Terraform configuration that creates Cloud Storage buckets and Pub/Sub topics in the project `data-prod`. Deployments will run as the new service account `im-deployer@data-prod.iam.gserviceaccount.com`, which has no roles yet. The engineers who run `gcloud infra-manager deployments apply` already have Infra Manager Admin (`roles/config.admin`) on `data-prod` and Service Account User on `im-deployer`.

        You must follow the principle of least privilege. Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Grant the engineers the Storage Admin and Pub/Sub Admin roles on `data-prod`." } }
        - { id: b, text: { en: "Grant `im-deployer` the `roles/config.agent` role on `data-prod`." } }
        - { id: c, text: { en: "Grant `im-deployer` the Owner role (`roles/owner`) on `data-prod`." } }
        - { id: d, text: { en: "Grant `im-deployer` the Storage Admin and Pub/Sub Admin roles on `data-prod`." } }
        - { id: e, text: { en: "Grant the engineers the `roles/config.agent` role on `data-prod`." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Infrastructure Manager runs Terraform as the service account given with `--service-account`. That account needs `roles/config.agent`, which lets it work with deployments, revisions, logs and Terraform state, plus the permissions for the resources that the configuration manages, here Storage Admin and Pub/Sub Admin.
      options:
        a: { en: "The resources are created by `im-deployer`, not with the engineers' own credentials, so these roles don't make the deployment succeed." }
        c: { en: "Owner would work, but it grants far more than the configuration needs, which breaks least privilege." }
        e: { en: "`roles/config.agent` is meant for the service account that Infrastructure Manager runs as; the engineers already have Infra Manager Admin." }
    references:
      - title: Configure the service account
        url: https://docs.cloud.google.com/infrastructure-manager/docs/configure-service-account
      - title: Access control with IAM
        url: https://docs.cloud.google.com/infrastructure-manager/docs/access-control
