chapter: 24-networking
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-24-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        A network engineer adds the subnet `appliances` with the primary IPv4 range `10.20.4.0/28` to a custom mode VPC network for a small group of appliance VMs.

        How many addresses of this primary range can be assigned to VMs?
    body:
      options:
        - { id: a, text: { en: "8" } }
        - { id: b, text: { en: "12" } }
        - { id: c, text: { en: "14" } }
        - { id: d, text: { en: "16" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A `/28` contains 16 addresses, and Google Cloud reserves four addresses of every primary IPv4 range: the network address (`10.20.4.0`), the default gateway (`10.20.4.1`), the second-to-last address (`10.20.4.14`) and the broadcast address (`10.20.4.15`). That leaves 12 addresses for VMs and other resources.
      options:
        a: { en: "Eight is the size of a `/29`, the smallest range a subnet can have, not the number of usable addresses in a `/28`." }
        c: { en: "Fourteen would be right if only the network and broadcast addresses were reserved; Google Cloud also reserves the gateway and the second-to-last address." }
        d: { en: "Sixteen is the total size of the range; four of those addresses are reserved in every primary range." }
    references:
      - title: Subnets
        url: https://docs.cloud.google.com/vpc/docs/subnets

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-24-02
    objective: "2.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Two ingress VPC firewall rules apply to all instances of a network. Both have priority 1000. The rule `allow-https` allows TCP port 443 from `0.0.0.0/0`, and the rule `deny-https-lab` denies TCP port 443 from `198.51.100.0/24`.

        A client at `198.51.100.20` opens an HTTPS connection to a VM in the network. What happens?
    body:
      options:
        - { id: a, text: { en: "The connection is allowed, because the allow rule was created first and is evaluated first" } }
        - { id: b, text: { en: "The connection is denied, because a deny rule wins over an allow rule of the same priority" } }
        - { id: c, text: { en: "The connection is allowed, because an allow rule wins over a deny rule of the same priority" } }
        - { id: d, text: { en: "The second rule was rejected at creation, because two rules can't share a priority" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When several VPC firewall rules match the same traffic, the lowest priority number wins. When matching rules have the same priority, a deny rule takes precedence over an allow rule, so traffic from `198.51.100.20` is denied while other internet clients are still allowed.
      options:
        a: { en: "Creation order plays no role in firewall rule evaluation; only priority, then the deny-over-allow tie-break, decide." }
        c: { en: "The tie-break works the other way: at equal priority, deny overrides allow." }
        d: { en: "VPC firewall rules can share a priority value; unique priorities are required only for rules inside one firewall policy." }
    references:
      - title: VPC firewall rules
        url: https://docs.cloud.google.com/firewall/docs/firewalls

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-24-03
    objective: "2.3.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A startup serves a public API from Compute Engine VMs with external IP addresses in `us-east1`. Its users are spread across North America. To cut network costs, the CTO plans to recreate the external IP addresses of the VMs in Standard Tier instead of Premium Tier.

        Which statement describes the effect of this change?
    body:
      options:
        - { id: a, text: { en: "Inbound traffic still enters Google's network at the point of presence closest to each user, and the VM uptime SLA stays at 99.99%." } }
        - { id: b, text: { en: "Inbound traffic crosses the public internet up to the region of the VMs, and the VM uptime SLA becomes 99.9% instead of 99.99%." } }
        - { id: c, text: { en: "Inbound traffic crosses the public internet up to the region of the VMs, and the VMs lose outbound access through Cloud NAT gateways." } }
        - { id: d, text: { en: "Inbound traffic enters Google's network at the point of presence closest to each user, and the VM uptime SLA becomes 99.9%." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Standard Tier delivers traffic between users and Google Cloud over regular ISP networks: inbound packets enter Google's network in the region of the resource instead of at the nearest point of presence. It is priced lower than Premium Tier, and Google's uptime SLA for VMs is 99.9% in Standard Tier versus 99.99% in Premium Tier.
      options:
        a: { en: "Entry at the closest point of presence and the 99.99% VM SLA are what Premium Tier provides, not Standard Tier." }
        c: { en: "Cloud NAT is supported in both tiers, with regional external IP addresses; Standard Tier does not remove it." }
        d: { en: "Traffic entering at the point of presence closest to the user is the Premium Tier path; in Standard Tier it travels over the internet to the region." }
    references:
      - title: Network Service Tiers overview
        url: https://docs.cloud.google.com/network-tiers/docs/overview

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-24-04
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The subnet `app-eu` (`10.10.0.0/24`, `europe-west1`) of the custom mode VPC network `prod-vpc` has no free addresses left for new VMs. The range `10.10.1.0/24` is not used anywhere in `prod-vpc` or in the networks peered with it. The existing VMs must keep running with their current IP addresses.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "`gcloud compute networks subnets expand-ip-range app-eu --region=europe-west1 --prefix-length=25`" } }
        - { id: b, text: { en: "`gcloud compute networks subnets update app-eu --region=europe-west1 --add-secondary-ranges=extra=10.10.1.0/24`" } }
        - { id: c, text: { en: "`gcloud compute networks subnets expand-ip-range app-eu --region=europe-west1 --prefix-length=23`" } }
        - { id: d, text: { en: "Delete `app-eu`, and create it again in `europe-west1` with the primary range `10.10.0.0/23`." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A subnet's primary IPv4 range can be expanded in place by lowering its prefix length. A `/23` starting at `10.10.0.0` covers `10.10.0.0` to `10.10.1.255`, which only adds the free range. Expansion does not interrupt traffic in the subnet, and existing VMs keep their addresses.
      options:
        a: { en: "A `/25` is a smaller range: a primary range can only be expanded, never shrunk." }
        b: { en: "A secondary range holds alias IP ranges (for example GKE Pods); VM primary internal addresses always come from the primary range." }
        d: { en: "A subnet that contains VMs can't be deleted, and recreating it would mean recreating the VMs, which the requirement forbids." }
    references:
      - title: "Quickstart: Create and manage VPC networks"
        url: https://docs.cloud.google.com/vpc/docs/create-modify-vpc-networks
      - title: Subnets
        url: https://docs.cloud.google.com/vpc/docs/subnets

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-24-05
    objective: "2.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You created a global external Application Load Balancer with the address `203.0.113.10`. Its backend service uses the managed instance group `web-mig` in the custom mode network `shop-vpc`. The VMs have the network tag `web` and serve HTTP on port 80, which the health check probes. The only firewall rule in the network allows SSH from the IAP range. All backends are reported as unhealthy, although the web server answers on each VM.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "`gcloud compute firewall-rules create allow-hc --network=shop-vpc --direction=EGRESS --action=allow --rules=tcp:80 --destination-ranges=35.191.0.0/16 --target-tags=web`" } }
        - { id: b, text: { en: "`gcloud compute firewall-rules create allow-hc --network=shop-vpc --direction=INGRESS --action=allow --rules=tcp:80 --source-ranges=203.0.113.10/32 --target-tags=web`" } }
        - { id: c, text: { en: "`gcloud compute firewall-rules create allow-hc --network=shop-vpc --direction=INGRESS --action=allow --rules=tcp:80 --source-ranges=35.191.0.0/16 --target-tags=web-mig`" } }
        - { id: d, text: { en: "`gcloud compute firewall-rules create allow-hc --network=shop-vpc --direction=INGRESS --action=allow --rules=tcp:80 --source-ranges=35.191.0.0/16 --target-tags=web`" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Health check probes come from Google's prober ranges (`35.191.0.0/16` for this load balancer), not from the load balancer's address. Without an ingress allow rule, the implied deny ingress rule drops the probes and every backend is marked unhealthy. The rule must allow the probed port and target the tag that the VMs actually carry.
      options:
        a: { en: "Egress is already allowed by the implied allow egress rule; the probes are blocked on ingress, so an egress rule changes nothing." }
        b: { en: "Probes and proxied requests don't come from the forwarding rule's IP address, so allowing it does not let the probes in." }
        c: { en: "`web-mig` is the name of the instance group, not a network tag on the VMs, so the rule applies to no VM." }
    references:
      - title: Health checks overview
        url: https://docs.cloud.google.com/load-balancing/docs/health-check-concepts

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-24-06
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        In the project `crm-prod`, the VPC network `crm-vpc` uses only VPC firewall rules; the company will not adopt firewall policies this year. Application VMs run as `app-sa@crm-prod.iam.gserviceaccount.com`. PostgreSQL VMs run as `db-sa@crm-prod.iam.gserviceaccount.com` and have the network tag `db`. Developers' test VMs share the subnet `10.20.0.0/24` with the application VMs. Developers have the Compute Instance Admin (v1) role on the project and no role on either service account.

        Only the application VMs may connect to the databases on TCP port 5432, and developers must not be able to give their test VMs this access. Which command should you run?
    body:
      options:
        - { id: a, text: { en: "`gcloud compute firewall-rules create app-to-db --network=crm-vpc --action=allow --rules=tcp:5432 --source-tags=app --target-tags=db`" } }
        - { id: b, text: { en: "`gcloud compute firewall-rules create app-to-db --network=crm-vpc --action=allow --rules=tcp:5432 --source-service-accounts=app-sa@crm-prod.iam.gserviceaccount.com --target-tags=db`" } }
        - { id: c, text: { en: "`gcloud compute firewall-rules create app-to-db --network=crm-vpc --action=allow --rules=tcp:5432 --source-ranges=10.20.0.0/24 --target-service-accounts=db-sa@crm-prod.iam.gserviceaccount.com`" } }
        - { id: d, text: { en: "`gcloud compute firewall-rules create app-to-db --network=crm-vpc --action=allow --rules=tcp:5432 --source-service-accounts=app-sa@crm-prod.iam.gserviceaccount.com --target-service-accounts=db-sa@crm-prod.iam.gserviceaccount.com`" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Network tags can be changed by anyone who can edit the instance, which includes Compute Instance Admin, so they don't stop developers from tagging a test VM. Running a VM as `app-sa` requires the Service Account User role on it, which the developers lack, so a source service account identifies the application VMs reliably. A VPC firewall rule can't mix service accounts and network tags, so the target must be the databases' service account too.
      options:
        a: { en: "Developers with Compute Instance Admin can add the `app` tag to their own test VMs and gain access to the databases." }
        b: { en: "A VPC firewall rule can't combine service accounts and network tags; with source service accounts, the target must also be service accounts." }
        c: { en: "The source range also contains the developers' test VMs, so they would reach the databases." }
    references:
      - title: VPC firewall rules
        url: https://docs.cloud.google.com/firewall/docs/firewalls

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-24-07
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The project `pay-prod`, in the folder `prod`, has the custom mode network `pay-vpc` with the default firewall policy enforcement order. An old VPC firewall rule, `legacy-ssh`, allows ingress TCP port 22 from `0.0.0.0/0` at priority 1000; it is the only rule that allows SSH, and no workload needs it. The security team associated the global network firewall policy `sec-fw` with `pay-vpc`; its rule at priority 100 denies ingress TCP port 22 from `0.0.0.0/0`. SSH from the internet still reaches the VMs. Company policy already forbids internet SSH in every project of the `prod` folder.

        Which two actions would each block SSH from the internet to the VMs of `pay-vpc`? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Delete the VPC firewall rule `legacy-ssh`." } }
        - { id: b, text: { en: "Change the priority of the `sec-fw` deny rule from 100 to 0 with `gcloud compute network-firewall-policies rules update`." } }
        - { id: c, text: { en: "Change the priority of `legacy-ssh` from 1000 to 65000 with `gcloud compute firewall-rules update`." } }
        - { id: d, text: { en: "Add a rule that denies ingress TCP port 22 from `0.0.0.0/0` to a hierarchical firewall policy associated with the `prod` folder." } }
        - { id: e, text: { en: "Create a VPC firewall rule in `pay-vpc` that denies ingress TCP port 22 from `0.0.0.0/0` at priority 2000." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          With the default enforcement order, Cloud NGFW evaluates hierarchical policies first, then the network's VPC firewall rules, then the global network firewall policy. When a rule matches with allow or deny, all evaluation stops, so `legacy-ssh` allows SSH before `sec-fw` is ever reached. Deleting `legacy-ssh` lets evaluation fall through to the `sec-fw` deny rule, and a deny rule in a hierarchical policy on the folder matches before any VPC firewall rule.
      options:
        b: { en: "A priority only orders rules inside its own policy; the VPC firewall rules are still evaluated before `sec-fw`, whatever its rule priorities." }
        c: { en: "At priority 65000, `legacy-ssh` still matches internet SSH, and it is still evaluated before the network firewall policy, so it keeps allowing SSH." }
        e: { en: "The existing allow rule at priority 1000 matches first, because a lower number wins among VPC firewall rules; a deny at 2000 is never reached." }
    references:
      - title: Evaluation order for firewall policies and rules
        url: https://docs.cloud.google.com/firewall/docs/firewall-policies-rule-eval-order

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-24-08
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The custom mode network `corp-vpc` has the subnets `app-us` (`10.1.0.0/20`, `us-central1`) and `app-eu` (`10.2.0.0/20`, `europe-west1`). An HA VPN gateway and the Cloud Router `cr-us`, in `us-central1` with the default advertisement mode, connect it to the data center over BGP. The network uses the default dynamic routing mode. VMs in `app-us` reach the data center, but VMs in `app-eu` don't, and the data center has no route to `10.2.0.0/20`. Firewall rules on both sides allow the traffic.

        You must fix this with the least effort and without new VPN tunnels. What should you do?
    body:
      options:
        - { id: a, text: { en: "`gcloud compute routers update cr-us --region=us-central1 --advertisement-mode=CUSTOM --set-advertisement-groups=ALL_SUBNETS --set-advertisement-ranges=10.2.0.0/20`" } }
        - { id: b, text: { en: "`gcloud compute networks update corp-vpc --bgp-routing-mode=global`" } }
        - { id: c, text: { en: "`gcloud compute routers create cr-eu --network=corp-vpc --region=europe-west1 --asn=65010`" } }
        - { id: d, text: { en: "`gcloud compute networks update corp-vpc --bgp-best-path-selection-mode=STANDARD`" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The dynamic routing mode is regional by default: a Cloud Router advertises only the subnets of its own region, and the routes it learns are used only in that region. Switching `corp-vpc` to global dynamic routing makes `cr-us` advertise `10.2.0.0/20` to the data center and makes the learned on-premises routes usable from `europe-west1`, with no new tunnel.
      options:
        a: { en: "Advertising `10.2.0.0/20` fixes only the return path; in regional mode the on-premises routes learned by `cr-us` stay unusable for VMs in `europe-west1`." }
        c: { en: "A Cloud Router with no VPN tunnel or BGP session learns and advertises nothing, so it changes no route." }
        d: { en: "The best path selection mode only changes how competing dynamic routes are ranked; it does not extend routes to other regions." }
    references:
      - title: Advertised routes
        url: https://docs.cloud.google.com/network-connectivity/docs/router/concepts/advertised-routes
      - title: Learned routes
        url: https://docs.cloud.google.com/network-connectivity/docs/router/concepts/learned-routes

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-24-09
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A bank's data center sits in a colocation facility where Google's network is present. The bank sends about 20 Gbps of steady traffic to its VPC network over HA VPN tunnels on the internet and wants to replace them. The new link must not cross the public internet and must reduce egress costs, and a regulator requires the traffic to be encrypted in transit with IPsec. The bank does not want to contract with a connectivity provider.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add HA VPN tunnels over the internet until the tunnels carry 20 Gbps in total." } }
        - { id: b, text: { en: "Order Dedicated Interconnect connections, and create their VLAN attachments with IPsec encryption." } }
        - { id: c, text: { en: "Order Partner Interconnect VLAN attachments of 10 Gbps each through a service provider." } }
        - { id: d, text: { en: "Deploy HA VPN gateways and tunnels over the VLAN attachments, with BGP on Cloud Router." } }
        - { id: e, text: { en: "Order Dedicated Interconnect connections, and rely on the link encryption that they apply by default." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Dedicated Interconnect is a direct physical link from the colocation facility: its traffic does not traverse the public internet and it reduces egress costs, which Cloud VPN alone does not. Cloud Interconnect doesn't encrypt traffic by default, so IPsec comes from HA VPN over Cloud Interconnect: VLAN attachments created with IPsec encryption, and HA VPN gateways and tunnels deployed over them with Cloud Router.
      options:
        a: { en: "More tunnels add bandwidth, but the traffic still crosses the internet and VPN alone does not reduce egress costs." }
        c: { en: "Partner Interconnect goes through a service provider, which the bank refuses." }
        e: { en: "Cloud Interconnect doesn't encrypt traffic by default, so the IPsec requirement would not be met." }
    references:
      - title: Cloud Interconnect overview
        url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/overview
      - title: HA VPN over Cloud Interconnect overview
        url: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/ha-vpn-interconnect

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-24-10
    objective: "2.3.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A global external Application Load Balancer serves `www.example.com` through the URL map `web-map`, whose default backend service `web-be` uses a managed instance group. The site's public images and scripts must now be served from the Cloud Storage bucket `example-static` for every path under `/static/`, with Cloud CDN caching them, while all other paths stay on `web-be`. Today the bucket grants access only to the web team.

        Which three commands should you run? Choose three.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "`gcloud storage buckets add-iam-policy-binding gs://example-static --member=allUsers --role=roles/storage.objectViewer`" } }
        - { id: b, text: { en: "`gcloud compute backend-buckets create static-bb --gcs-bucket-name=example-static --enable-cdn`" } }
        - { id: c, text: { en: "`gcloud compute backend-services create static-be --global --load-balancing-scheme=EXTERNAL_MANAGED --enable-cdn`" } }
        - { id: d, text: { en: "`gcloud compute url-maps add-path-matcher web-map --global --path-matcher-name=static-pm --default-service=web-be --backend-service-path-rules=/static/*=static-bb --new-hosts=www.example.com`" } }
        - { id: e, text: { en: "`gcloud compute url-maps add-path-matcher web-map --global --path-matcher-name=static-pm --default-service=web-be --backend-bucket-path-rules=/static/*=static-bb --new-hosts=www.example.com`" } }
        - { id: f, text: { en: "`gcloud compute url-maps add-path-matcher web-map --global --path-matcher-name=static-pm --default-backend-bucket=static-bb --backend-service-path-rules=/static/*=web-be --new-hosts=www.example.com`" } }
    answer: { optionIds: [a, b, e] }
    explanation:
      correct:
        en: |
          A Cloud Storage bucket becomes a load balancer backend through a backend bucket, on which Cloud CDN can be enabled. The URL map then needs a path matcher whose `--backend-bucket-path-rules` send `/static/*` to the backend bucket and whose default service stays `web-be`. Because the content is public, `allUsers` gets Storage Object Viewer on the bucket so that the load balancer can serve the objects to anyone.
      options:
        c: { en: "A backend service takes instance groups or NEGs as backends, not a Cloud Storage bucket; static content needs a backend bucket." }
        d: { en: "`--backend-service-path-rules` maps paths to backend services; `static-bb` is a backend bucket, so the path rule must use `--backend-bucket-path-rules`." }
        f: { en: "This path matcher inverts the routing: every path except `/static/*` would go to the bucket, and only `/static/*` to `web-be`." }
    references:
      - title: Set up a global external Application Load Balancer with Cloud Storage buckets
        url: https://docs.cloud.google.com/load-balancing/docs/https/setup-global-ext-https-buckets
      - title: Backend buckets overview
        url: https://docs.cloud.google.com/load-balancing/docs/backend-bucket
