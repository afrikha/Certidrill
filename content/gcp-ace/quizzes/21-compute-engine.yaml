chapter: 21-compute-engine
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer deploys a small Node.js function with Cloud Run functions, from source code, and asks what Google Cloud actually runs behind it.

        How is the function run?
    body:
      options:
        - { id: a, text: { en: "It runs as a Deployment in a GKE Autopilot cluster that Google creates in your project." } }
        - { id: b, text: { en: "It runs on Compute Engine VMs of a managed instance group that scales on request count." } }
        - { id: c, text: { en: "It is built into a container image and deployed as a Cloud Run service in your project." } }
        - { id: d, text: { en: "It runs in an App Engine standard environment service that Google manages for you." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A function deployed with Cloud Run functions is built automatically into a container image and deployed as a Cloud Run service. It therefore gets Cloud Run's features, such as scaling to zero and traffic splitting between revisions, with no cluster or VM to manage.
      options:
        a: { en: "Cloud Run functions don't create a GKE cluster in your project; GKE is the choice when you need the Kubernetes API." }
        b: { en: "No VM or instance group is created for a function; managed instance groups are a Compute Engine feature you manage yourself." }
        d: { en: "Cloud Run functions (formerly Cloud Functions) run on Cloud Run, not on App Engine." }
    references:
      - title: Compare Cloud Run functions
        url: https://docs.cloud.google.com/run/docs/functions/comparison

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-21-02
    objective: "2.1.4"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        A managed instance group has an autoscaler with a minimum of 2 VMs and a maximum of 10 VMs. Its policy uses two signals: a target CPU utilization and a target load balancing serving capacity. At a given moment, the CPU signal recommends 4 VMs and the load balancing signal recommends 7 VMs.

        To how many VMs does the autoscaler set the group?
    body:
      options:
        - { id: a, text: "4" }
        - { id: b, text: "7" }
        - { id: c, text: "10" }
        - { id: d, text: "11" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With several signals, the autoscaler computes a recommended size for each one and keeps the largest, so that every signal's target is met. Here the load balancing signal needs 7 VMs, which is within the 2 to 10 limits.
      options:
        a: { en: "Keeping the smallest recommendation would leave the load balancing target exceeded; the largest one wins." }
        c: { en: "The maximum is a ceiling, not a target: the group grows to 10 VMs only if a signal recommends 10 or more." }
        d: { en: "Recommendations aren't added together; the autoscaler keeps the largest single recommendation." }
    references:
      - title: Autoscaling groups of instances
        url: https://docs.cloud.google.com/compute/docs/autoscaler

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-21-03
    objective: "2.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A logistics company is moving a reporting server to Compute Engine. The server needs exactly 8 vCPUs and 32 GB of memory, and the company's standards require the N2 machine series. An engineer proposes the custom machine type `n2-custom-8-32768`. You need the lowest cost that meets the requirements.

        Which machine type should you use?
    body:
      options:
        - { id: a, text: "`n2-standard-8`" }
        - { id: b, text: "`n2-custom-8-32768`" }
        - { id: c, text: "`n2-highmem-8`" }
        - { id: d, text: "`n2-custom-8-32768-ext`" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The predefined `n2-standard-8` machine type already has 8 vCPUs and 32 GB of memory. Custom machine types are priced with a 5% premium over the equivalent predefined type, so a custom type is worth it only when no predefined shape fits without wasting resources.
      options:
        b: { en: "This custom type has the same shape as `n2-standard-8` but costs 5% more." }
        c: { en: "`n2-highmem-8` has 64 GB of memory, twice what the server needs, so it costs more." }
        d: { en: "The `-ext` suffix requests extended memory, billed at a higher rate, and 32 GB for 8 vCPUs doesn't need it." }
    references:
      - title: General-purpose machine family for Compute Engine
        url: https://docs.cloud.google.com/compute/docs/general-purpose-machines

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-21-04
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A hospital's project `care-apps` uses SSH keys stored in project metadata, and OS Login is not enabled at the project level. No organization policy applies. The security team wants access to the VM `hr-01` in europe-west1-b to be controlled by IAM roles only, while the other VMs of the project keep their current access model for now.

        Which command should you run?
    body:
      options:
        - { id: a, text: "`gcloud compute instances add-metadata hr-01 --zone=europe-west1-b --metadata=block-project-ssh-keys=TRUE`" }
        - { id: b, text: "`gcloud compute project-info add-metadata --project=care-apps --metadata=enable-oslogin=TRUE`" }
        - { id: c, text: "`gcloud compute instances add-metadata hr-01 --zone=europe-west1-b --metadata=enable-oslogin=TRUE`" }
        - { id: d, text: "`gcloud compute instances add-metadata hr-01 --zone=europe-west1-b --metadata=enable-oslogin-2fa=TRUE`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          OS Login is enabled by the `enable-oslogin=TRUE` metadata key, either in project metadata for every VM or in instance metadata for a single VM. Set on `hr-01` only, it makes that VM ignore metadata-based keys and grant SSH according to the OS Login IAM roles, while the other VMs keep their keys.
      options:
        a: { en: "Blocking project-wide keys still leaves the VM on metadata-based keys from its instance metadata; access isn't controlled by IAM." }
        b: { en: "Project metadata applies OS Login to every VM of the project, not only to `hr-01`." }
        d: { en: "2-Step Verification takes effect only when `enable-oslogin` is also TRUE; on its own it doesn't enable OS Login." }
    references:
      - title: Set up OS Login
        url: https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-21-05
    objective: "2.1.6"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        A manufacturer keeps its plant projects in the folder `plants`, which contains 12 projects today, and a new project is added every month. The project factory enables the OS Config API in every project, and all VMs run images with the OS Config agent. The security team requires that VM Manager be active in every project of the folder, including future projects, and that nobody can set `enable-osconfig` to FALSE.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Enforce the `compute.requireOsConfig` organization policy constraint on the `plants` folder." } }
        - { id: b, text: { en: "Enforce the `compute.requireOsLogin` organization policy constraint on the `plants` folder." } }
        - { id: c, text: { en: "Set the `enable-osconfig=TRUE` key in the metadata of the `plants` folder itself." } }
        - { id: d, text: { en: "Set `enable-osconfig=TRUE` in the project metadata of each of the 12 existing projects." } }
        - { id: e, text: { en: "Grant the OS Config Admin role on the `plants` folder to the service accounts of the VMs." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The `compute.requireOsConfig` constraint sets `enable-osconfig=TRUE` in the metadata of new projects and rejects any request that sets it to FALSE. It doesn't change projects created before the policy was enforced, so the 12 existing projects need the metadata key set once.
      options:
        b: { en: "`compute.requireOsLogin` enforces OS Login for SSH access; it has no effect on VM Manager." }
        c: { en: "Metadata is set on projects and instances; a folder has no metadata, so the key must come from the projects or the constraint." }
        e: { en: "The service account attached to each VM needs no IAM role for VM Manager; it is only used to sign the agent's requests." }
    references:
      - title: Set up VM Manager
        url: https://docs.cloud.google.com/compute/vm-manager/docs/setup

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-21-06
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A video platform serves uploads from the regional managed instance group `ingest-mig` in europe-west1, autoscaled on CPU between 4 and 30 VMs. For two weeks, a data migration runs long sessions on the VMs, and no VM may be removed during that time, including VMs added during the migration. The group must still add VMs when CPU rises. After the migration, the team wants the current autoscaling policy back with a single command.

        Which command should you run before the migration starts?
    body:
      options:
        - { id: a, text: "`gcloud compute instance-groups managed update-autoscaling ingest-mig --region=europe-west1 --mode=off`" }
        - { id: b, text: "`gcloud compute instance-groups managed update-autoscaling ingest-mig --region=europe-west1 --mode=only-scale-out`" }
        - { id: c, text: "`gcloud compute instance-groups managed stop-autoscaling ingest-mig --region=europe-west1`" }
        - { id: d, text: "`gcloud compute instance-groups managed update-autoscaling ingest-mig --region=europe-west1 --min-num-replicas=12`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The `only-scale-out` mode lets the autoscaler add VMs but blocks every scale-in, while the policy (signals, minimum, maximum) is kept. After the migration, `update-autoscaling ingest-mig --region=europe-west1 --mode=on` restores normal scaling with the same configuration.
      options:
        a: { en: "The `off` mode keeps the configuration but stops all automatic resizing, so the group can't add VMs when CPU rises." }
        c: { en: "`stop-autoscaling` deletes the autoscaler configuration, so it would have to be recreated with `set-autoscaling`, and the group would no longer scale out." }
        d: { en: "A higher minimum only stops the group from going below 12 VMs; VMs added above that number can still be removed during the migration." }
    references:
      - title: Manage autoscalers
        url: https://docs.cloud.google.com/compute/docs/autoscaler/managing-autoscalers

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-21-07
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        An animation studio renders frames with workers that pull tasks from a queue; a worker can disappear at any time, and its task is then retried by another worker. The studio wants 40 workers running whenever Compute Engine has capacity, at the lowest compute cost. When Compute Engine reclaims workers, the fleet must return to 40 workers by itself, with no operator action and no custom script.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create an instance template for the workers with the `--provisioning-model=SPOT` flag." } }
        - { id: b, text: { en: "Create 40 Spot VMs with the `--restart-on-failure` flag so that reclaimed VMs restart." } }
        - { id: c, text: { en: "Create a managed instance group with a target size of 40 VMs from the instance template." } }
        - { id: d, text: { en: "Create 40 Spot VMs with the `--instance-termination-action=STOP` flag so they resume later." } }
        - { id: e, text: { en: "Add `--maintenance-policy=MIGRATE` to the template so reclaimed workers move to other hosts." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Spot VMs give the largest discount for fault-tolerant work like rendering, and you create them in a managed instance group through an instance template. When Compute Engine preempts Spot VMs in a MIG, the group keeps trying to recreate them until capacity returns, so the fleet goes back to its target size of 40 without any action.
      options:
        b: { en: "Spot VMs don't support automatic restart: a preempted Spot VM is stopped or deleted, not restarted." }
        d: { en: "With the STOP action, a preempted VM stays in the TERMINATED state until someone or something starts it again, and its disks are still billed." }
        e: { en: "Spot VMs can't live migrate; Compute Engine preempts them instead, whatever the maintenance policy." }
    references:
      - title: Spot VMs
        url: https://docs.cloud.google.com/compute/docs/instances/spot

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-21-08
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A retailer runs PostgreSQL on the VM `pg-01`, an `n2-standard-16` in us-central1-a. Its boot disk and its 1 TB data disk are both Balanced Persistent Disks, and the guest OS supports NVMe. To improve performance, the team must move the database to the `c4-standard-16` machine type during a weekend maintenance window, keeping all the data.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Stop `pg-01`, change its machine type to `c4-standard-16` with `set-machine-type`, and start it with its current disks." } }
        - { id: b, text: { en: "Stop `pg-01`, snapshot both disks, create SSD Persistent Disks from the snapshots, and create a `c4-standard-16` VM that uses them." } }
        - { id: c, text: { en: "Stop `pg-01`, snapshot both disks, create Hyperdisk Extreme volumes from the snapshots, and create a `c4-standard-16` VM that uses them." } }
        - { id: d, text: { en: "Stop `pg-01`, snapshot both disks, create Hyperdisk Balanced volumes from the snapshots, and create a `c4-standard-16` VM that uses them." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          C4 supports only Hyperdisk (and Local SSD on `-lssd` types): it doesn't support Persistent Disk. You can't change a disk's type in place, so you snapshot the stopped VM's disks, create Hyperdisk Balanced volumes from the snapshots, and create the C4 VM with them; Hyperdisk Balanced can be used as a boot disk.
      options:
        a: { en: "The Balanced Persistent Disks can't be attached to a C4 VM, so the machine type change fails while they are attached." }
        b: { en: "SSD Persistent Disk is still Persistent Disk, which C4 doesn't support." }
        c: { en: "Hyperdisk Extreme can't be used as a boot disk, so the new VM can't boot from the volume created from the boot disk snapshot." }
    references:
      - title: General-purpose machine family for Compute Engine
        url: https://docs.cloud.google.com/compute/docs/general-purpose-machines
      - title: Move your workload to a new compute instance
        url: https://docs.cloud.google.com/compute/docs/import/migrate-to-new-vm

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-21-09
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        An insurer keeps its claims database on `claims-data`, a regional SSD Persistent Disk with replicas in europe-west1-b and europe-west1-c. Last week a faulty migration script corrupted several tables; the damage was present in both zones at once, and the only backup was six days old. From now on, the team must be able to restore the disk as it was at most 4 hours before a faulty change, at any time over the last 14 days, with the least operational effort.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Replace `claims-data` with a Hyperdisk Balanced High Availability volume that replicates writes synchronously across the two zones." } }
        - { id: b, text: { en: "Create a snapshot schedule in europe-west1 that runs every 4 hours and keeps snapshots 14 days, and attach it to `claims-data`." } }
        - { id: c, text: { en: "Set up Asynchronous Replication of `claims-data` to a secondary disk in europe-west4, and fail over to it after a faulty change." } }
        - { id: d, text: { en: "Create a Cloud Scheduler job that takes a machine image of the database VM every day and deletes the images older than 14 days." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A regional disk protects against a zone failure, not against bad writes, which are replicated to both zones at once. A snapshot schedule, created in the disk's region with an hourly frequency of 4 hours and a 14-day retention, gives restore points every 4 hours with no script to maintain; attach it with `gcloud compute disks add-resource-policies`.
      options:
        a: { en: "Synchronous replication across zones copies the corrupted writes to both replicas, exactly like the current regional disk." }
        c: { en: "Asynchronous Replication continuously copies every write, corrupted ones included, so the secondary disk soon holds the same damage." }
        d: { en: "A daily machine image gives restore points 24 hours apart, which misses the 4-hour requirement, and the job is extra work to maintain." }
    references:
      - title: Create schedules for disk snapshots
        url: https://docs.cloud.google.com/compute/docs/disks/scheduled-snapshots

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-21-10
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A fintech launched the VM `ledger-batch` in europe-west1-b without an external IP address. The project uses OS Login, and the developers already have the Compute OS Login role on the project and the Service Account User role on the VM's service account. The developers work from home laptops with the gcloud CLI, with no VPN or Interconnect to the VPC. Besides the implied rules, the VPC has one firewall rule that allows all traffic from 10.0.0.0/8.

        Which three actions should you take so that the developers can connect over SSH? Choose three.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Create an ingress firewall rule that allows TCP port 22 to the VM from 35.235.240.0/20." } }
        - { id: b, text: { en: "Create an ingress firewall rule that allows TCP port 22 from 130.211.0.0/22 and 35.191.0.0/16." } }
        - { id: c, text: { en: "Grant the developers the IAP-secured Tunnel User role (`roles/iap.tunnelResourceAccessor`)." } }
        - { id: d, text: { en: "Create a Cloud NAT gateway for the VM's subnet so that SSH sessions from the laptops can reach it." } }
        - { id: e, text: { en: "Have the developers run `gcloud compute ssh ledger-batch --zone=europe-west1-b --tunnel-through-iap`." } }
        - { id: f, text: { en: "Have the developers run `gcloud compute ssh ledger-batch --zone=europe-west1-b --internal-ip`." } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          Without an external IP address or a private connection, the laptops reach the VM through IAP TCP forwarding, which wraps SSH in HTTPS. IAP connects to the VM from 35.235.240.0/20, so a firewall rule must allow TCP 22 from that range, and each user needs the IAP-secured Tunnel User role. `gcloud compute ssh --tunnel-through-iap` then opens the session through IAP (gcloud also falls back to IAP by itself when the VM has no external IP address).
      options:
        b: { en: "130.211.0.0/22 and 35.191.0.0/16 are the source ranges of Google Cloud health checks and load balancer probes, not of IAP TCP forwarding." }
        d: { en: "Cloud NAT handles outbound connections initiated by the VMs only; it never accepts inbound SSH sessions." }
        f: { en: "The internal IP address is reachable only from inside the VPC or over a VPN or Interconnect, which the laptops don't have." }
    references:
      - title: Use IAP for TCP forwarding
        url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding
      - title: Connect to Linux VMs using Identity-Aware Proxy
        url: https://docs.cloud.google.com/compute/docs/connect/ssh-using-iap
