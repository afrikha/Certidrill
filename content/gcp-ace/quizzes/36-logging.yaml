chapter: 36-logging
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-36-01
    objective: "3.4.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A security officer at a financial company asks you to make sure that every future change to the IAM policy of the project `fin-prod` is recorded, together with the identity of the principal who made it. The project uses the default audit logging settings.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Enable the Admin Read log type of the Data Access audit logs for all services of the project" } }
        - { id: b, text: { en: "Enable the Data Write log type of the Data Access audit logs for the IAM service of the project" } }
        - { id: c, text: { en: "Nothing: Admin Activity audit logs already record these changes and can't be turned off" } }
        - { id: d, text: { en: "Create a sink that routes IAM changes to a log bucket, because they aren't stored by default" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Changing IAM permissions is an administrative action that modifies resource configuration, so it is recorded in the Admin Activity audit logs. These logs are always written, including the principal in `authenticationInfo`, and they can't be configured, excluded or disabled.
      options:
        a: { en: "Admin Read covers calls that read configuration or metadata, such as getting an IAM policy, not the changes, which are already logged." }
        b: { en: "Data Write records user-provided data being written; IAM policy changes are configuration changes, covered by Admin Activity logs." }
        d: { en: "Admin Activity logs are stored by default in the `_Required` bucket; no sink is needed to keep them." }
    references:
      - title: "Cloud Audit Logs overview"
        url: https://docs.cloud.google.com/logging/docs/audit

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-36-02
    objective: "3.4.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An auditor asks how long Cloud Logging keeps the Admin Activity audit logs of the project `ops-prod`, and whether you can change that period. The project uses the default Cloud Logging settings.

        What should you answer?
    body:
      options:
        - { id: a, text: { en: "30 days in the `_Default` bucket, and you can raise the retention to 3,650 days" } }
        - { id: b, text: { en: "400 days in the `_Required` bucket, and you can raise the retention at extra cost" } }
        - { id: c, text: { en: "30 days in the `_Required` bucket, and you can raise it once the bucket is locked" } }
        - { id: d, text: { en: "400 days in the `_Required` bucket, at no charge, and you can't change the retention" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The `_Required` sink routes Admin Activity, System Event and Access Transparency logs to the `_Required` bucket, which has a fixed 400-day retention and no storage or retention charge. Its retention can't be changed; to keep these logs longer, route copies to another destination with a sink.
      options:
        a: { en: "The `_Default` sink doesn't receive the Admin Activity logs; they go to the `_Required` bucket." }
        b: { en: "The `_Required` bucket's retention is fixed: it can't be raised, even at extra cost." }
        c: { en: "The retention is 400 days, not 30, and locking a bucket freezes its retention policy; it never extends a retention." }
    references:
      - title: "Configure log buckets"
        url: https://docs.cloud.google.com/logging/docs/buckets
      - title: "Pricing"
        url: https://cloud.google.com/stackdriver/pricing

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-36-03
    objective: "3.4.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Someone deleted the Compute Engine VM `batch-7` in the project `lab-prj` yesterday. In the Logs Explorer of `lab-prj`, you need a query that returns the audit log entries of VM deletions in the project.

        Which query should you run?
    body:
      options:
        - { id: a, text: { en: "`logName:\"cloudaudit.googleapis.com%2Fdata_access\" AND protoPayload.methodName:\"instances.delete\"`" } }
        - { id: b, text: { en: "`logName:\"cloudaudit.googleapis.com%2Fsystem_event\" AND protoPayload.methodName:\"instances.delete\"`" } }
        - { id: c, text: { en: "`logName:\"cloudaudit.googleapis.com%2Factivity\" AND protoPayload.methodName:\"instances.delete\"`" } }
        - { id: d, text: { en: "`logName:\"cloudaudit.googleapis.com%2Factivity\" AND textPayload:\"instances.delete\"`" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Deleting a VM changes resource configuration, so it is recorded in the Admin Activity audit log, whose log name ends in `cloudaudit.googleapis.com%2Factivity`. Audit log entries carry an `AuditLog` in `protoPayload`, and `protoPayload.methodName` names the operation, so a `:` (has) comparison on `instances.delete` selects the deletions.
      options:
        a: { en: "Data Access logs record reads of configuration and reads or writes of user data, not configuration changes such as a VM deletion." }
        b: { en: "System Event logs record changes made by Google Cloud systems, not a deletion requested by a person or a script." }
        d: { en: "Audit log entries have no `textPayload`: the operation is in `protoPayload.methodName`, so this query matches nothing." }
    references:
      - title: "Understanding audit logs"
        url: https://docs.cloud.google.com/logging/docs/audit/understanding-audit-logs
      - title: "Cloud Audit Logs overview"
        url: https://docs.cloud.google.com/logging/docs/audit

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-36-04
    objective: "3.4.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        In the Logs Explorer, you found the Admin Activity audit log entry of the deletion of the VM `batch-7` and expanded it. You need the identity of the user or service account that made the call.

        Which field should you read?
    body:
      options:
        - { id: a, text: { en: "`protoPayload.requestMetadata.callerIp`" } }
        - { id: b, text: { en: "`protoPayload.authenticationInfo.principalEmail`" } }
        - { id: c, text: { en: "`protoPayload.authorizationInfo.resource`" } }
        - { id: d, text: { en: "`protoPayload.resourceName`" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In an audit log entry, `protoPayload.authenticationInfo` holds the identity that performed the operation, and its `principalEmail` field is the email address of the authenticated user or service account.
      options:
        a: { en: "`callerIp` tells from which IP address the call came, not which principal made it." }
        c: { en: "`authorizationInfo` lists the resource and permission that were checked and whether access was granted, not who asked." }
        d: { en: "`resourceName` is the target of the operation, here the deleted VM, not the caller." }
    references:
      - title: "AuditLog"
        url: https://docs.cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-36-05
    objective: "3.4.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A video streaming company must keep the application logs of the project `stream-prod`, about 2 TiB per month, for 7 years. They will be read only if a regulator asks, which happens less than once a year. The operations team keeps using the `_Default` bucket, with its default retention, for troubleshooting. You must minimize the cost of the 7-year copy.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Raise the retention of the `_Default` bucket to 2,555 days" } }
        - { id: b, text: { en: "Route the logs with a sink to a BigQuery dataset, with a 2,555-day table expiration" } }
        - { id: c, text: { en: "Route the logs with a sink to a Cloud Storage bucket whose default storage class is Archive" } }
        - { id: d, text: { en: "Upgrade the `_Default` bucket to Observability Analytics, and link a BigQuery dataset to it" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A sink to Cloud Storage writes the matching entries as files, and the Archive class is Google Cloud's lowest-cost storage for data read less than once a year, still available within milliseconds when needed. Its 365-day minimum duration doesn't matter for a 7-year retention, and the `_Default` bucket keeps its free 30 days for troubleshooting.
      options:
        a: { en: "Log bucket retention beyond 30 days is billed per GiB per month, far more over 7 years than Archive storage for data that is almost never read." }
        b: { en: "The logs need no SQL analysis, and BigQuery storage isn't the lowest-cost option for data that is almost never read; the Archive class is." }
        d: { en: "Upgrading and linking a dataset make the logs queryable with SQL, but they don't extend the 30-day retention of `_Default`." }
    references:
      - title: "Route logs to supported destinations"
        url: https://docs.cloud.google.com/logging/docs/export/configure_export_v2
      - title: "Storage classes"
        url: https://docs.cloud.google.com/storage/docs/storage-classes

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-36-06
    objective: "3.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A media company must record every read of Cloud Storage objects in the project `media-prod`, except the reads of the service account `etl-sa@media-prod.iam.gserviceaccount.com`, which reads millions of objects a day. An organization-level aggregated sink, owned by another team, sends every Data Access audit log entry to the SIEM, which must not receive the reads of `etl-sa` either; you can't change that sink. Data Access audit logs of the other services must stay disabled.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Enable the Data Read log type for Cloud Storage, and add an exclusion filter for the entries of `etl-sa` to the `_Default` sink of `media-prod`" } }
        - { id: b, text: { en: "Enable the Data Read log type for all services (`allServices`) of `media-prod`, and add `etl-sa` as an exempted principal for Data Read" } }
        - { id: c, text: { en: "Enable the Admin Read log type for Cloud Storage in `media-prod`, and add `etl-sa` as an exempted principal for Admin Read" } }
        - { id: d, text: { en: "Enable the Data Read log type for Cloud Storage in `media-prod`, and add `etl-sa` as an exempted principal for Data Read" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Object reads are recorded by the Data Read type of the Data Access audit logs, which is off by default for Cloud Storage. An exempted principal gets no audit log entries for the selected log types: the entries of `etl-sa` are never created, so no sink, including the organization's aggregated sink, can route them to the SIEM.
      options:
        a: { en: "An exclusion filter on `_Default` only stops storage in that bucket; the entries are still written, and the organization's aggregated sink still sends them to the SIEM." }
        b: { en: "Enabling Data Read for `allServices` turns on Data Access logs for every service of the project, which must stay disabled." }
        c: { en: "Admin Read records reads of configuration and metadata, such as bucket settings, not reads of the objects' data." }
    references:
      - title: "Enable Data Access audit logs"
        url: https://docs.cloud.google.com/logging/docs/audit/configure-data-access
      - title: "Route log entries"
        url: https://docs.cloud.google.com/logging/docs/routing/overview

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-36-07
    objective: "3.4.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A retailer's security team runs Splunk Enterprise in its data center, which Dataflow workers in Google Cloud can reach through Cloud Interconnect. Splunk accepts data only through its HTTP Event Collector (HEC) and can't be set up to pull data from Google Cloud. The audit logs of every current and future project in the folder `Retail` must reach Splunk within minutes, with the least operational effort.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Create a folder sink with `--include-children` to a Pub/Sub topic, and have Splunk read the entries from a pull subscription of the topic." } }
        - { id: b, text: { en: "Create a folder sink with `--include-children` to a Pub/Sub topic, and run the Pub/Sub to Splunk Dataflow template on a subscription to send them to HEC." } }
        - { id: c, text: { en: "Create a folder sink with `--include-children` to a Cloud Storage bucket, and have a Splunk add-on download the new log files from the bucket." } }
        - { id: d, text: { en: "Create a sink to a Pub/Sub topic in each project of the folder, and deploy a Cloud Run function on each topic that posts every entry to HEC." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An aggregated sink on the folder with `--include-children` routes the logs of all its current and future projects to one Pub/Sub topic. The Google-provided Pub/Sub to Splunk template reads a subscription and pushes the entries to Splunk HEC, which must be reachable from the Dataflow workers; failed messages go to a dead-letter topic, with no code to write.
      options:
        a: { en: "Splunk can't pull from Google Cloud in this scenario, so it can't read a Pub/Sub subscription." }
        c: { en: "Cloud Storage sinks deliver in hourly batches, which misses the within-minutes requirement, and Splunk can't pull the files anyway." }
        d: { en: "Per-project sinks miss future projects, and writing and running custom functions is more operational effort than a provided template." }
    references:
      - title: "Pub/Sub to Splunk template"
        url: https://docs.cloud.google.com/dataflow/docs/guides/templates/provided/pubsub-to-splunk
      - title: "Route logs to supported destinations"
        url: https://docs.cloud.google.com/logging/docs/export/configure_export_v2

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-36-08
    objective: "3.4.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A logistics company's project `ops-hub` holds the log bucket `central-logs` in the `global` location. Sinks route into it the logs of 20 projects, whose `_Default` sinks are disabled. The payments team must be able to read, in the Logs Explorer, only the entries that come from the project `pay-prod`. No other team's logs may be visible to it, and the logs must not be stored a second time.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Run `gcloud logging views create pay-view --bucket=central-logs --location=global --log-filter='source(\"projects/pay-prod\")' --project=ops-hub`" } }
        - { id: b, text: { en: "Grant the payments team the Logs View Accessor role on the project `ops-hub`, with no IAM condition" } }
        - { id: c, text: { en: "Grant the payments team the Logs Viewer role (`roles/logging.viewer`) on the project `pay-prod`" } }
        - { id: d, text: { en: "Grant the payments team the Logs View Accessor role on the `pay-view` log view only" } }
        - { id: e, text: { en: "Add a sink in `pay-prod` to a new log bucket in `pay-prod`, and grant the team Logs Viewer on `pay-prod`" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          A log view gives access to a subset of the entries of a log bucket, selected by its filter; `source("projects/pay-prod")` keeps only the entries that come from that project. Granting Logs View Accessor (`roles/logging.viewAccessor`) on that view, in the view's IAM policy or with an IAM condition on its resource name, limits the team to it, without copying any log.
      options:
        b: { en: "Without a condition, Logs View Accessor on the project gives access to every view of every bucket in `ops-hub`, including the `_AllLogs` view of `central-logs`." }
        c: { en: "The logs of `pay-prod` are stored only in `central-logs`, because its `_Default` sink is disabled, so a role on `pay-prod` shows nothing." }
        e: { en: "A second sink stores the logs a second time, which the requirements forbid and which is billed again." }
    references:
      - title: "Configure log views on a log bucket"
        url: https://docs.cloud.google.com/logging/docs/logs-views

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-36-09
    objective: "3.4.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        An engineer runs the following query in the Logs Explorer over the last 24 hours. It returns only a handful of entries, although the VMs in `us-east1-b` wrote hundreds of `WARNING` and `ERROR` entries in that period.

        ```text
        resource.type="gce_instance" and resource.labels.zone="us-east1-b"
        severity>=WARNING
        ```

        What should you change so that the query returns all these entries?
    body:
      options:
        - { id: a, text: { en: "Add `AND` at the end of the first line, before the line break" } }
        - { id: b, text: { en: "Put the comparisons of the first line inside parentheses" } }
        - { id: c, text: { en: "Replace `=` with `:` in the two `resource` comparisons" } }
        - { id: d, text: { en: "Replace the lowercase `and` with `AND`" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Boolean operators of the Logging query language must be written in uppercase: a lowercase `and` is parsed as a search term. The query therefore also requires every entry to contain the text `and`, which only a few entries do. With `AND`, the first line is a normal conjunction, and the line break adds an implicit `AND` with the severity comparison.
      options:
        a: { en: "Lines are already joined by an implicit `AND`; adding one leaves the lowercase `and` in place as a search term." }
        b: { en: "Parentheses only group the comparisons; the lowercase `and` inside them is still a search term." }
        c: { en: "The `:` (has) operator matches substrings, which isn't the problem; the search term `and` still filters the entries." }
    references:
      - title: "Logging query language"
        url: https://docs.cloud.google.com/logging/docs/view/logging-query-language

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-36-10
    objective: "3.4.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A deployment pipeline that runs as the service account `deploy-sa@web-prod.iam.gserviceaccount.com` failed to delete the Cloud Storage bucket `old-assets` in the project `web-prod`. In the Logs Explorer, you open the audit log entry of the failed call and expand it. You need to find which IAM permission was checked and whether it was granted, and the error that the call returned.

        Which two fields of the entry should you read? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "`protoPayload.authenticationInfo`" } }
        - { id: b, text: { en: "`protoPayload.authorizationInfo`" } }
        - { id: c, text: { en: "`protoPayload.requestMetadata`" } }
        - { id: d, text: { en: "`protoPayload.status`" } }
        - { id: e, text: { en: "`httpRequest.status`" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          In the `AuditLog` of `protoPayload`, `authorizationInfo` lists each check made for the call: the resource, the required IAM permission and whether it was granted. `status` gives the status of the overall operation, that is, the error code and message returned to the caller.
      options:
        a: { en: "`authenticationInfo` identifies who made the call (here `deploy-sa`), not which permission was checked." }
        c: { en: "`requestMetadata` describes the caller's request, such as its IP address and user agent, not the authorization result." }
        e: { en: "`httpRequest` describes HTTP requests such as load balancer traffic; an audit entry reports the result of the call in `protoPayload.status`." }
    references:
      - title: "AuditLog"
        url: https://docs.cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog
