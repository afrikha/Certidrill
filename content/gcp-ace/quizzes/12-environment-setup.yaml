chapter: 12-environment-setup
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-12-01
    objective: "1.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A hospital's security team must keep a record of every download of objects from the Cloud Storage bucket `scans-archive` in the project `radiology-prod`. The team has the Private Logs Viewer role on the project. In the Logs Explorer, it finds Admin Activity entries for the bucket, but no entry when users download objects. No audit log setting has been changed in the organization.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Set the retention of the project's `_Required` log bucket to a longer period, so that read entries are kept" } }
        - { id: b, text: { en: "Enable Data Access audit logs for Cloud Storage in the project, with the DATA_READ permission type selected" } }
        - { id: c, text: { en: "Create a sink in the project that routes the entries of the `_Required` log bucket to a new log bucket" } }
        - { id: d, text: { en: "Install the Ops Agent on the VMs that download objects, so that their system logs reach Cloud Logging" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Admin Activity audit logs are always written, but Data Access audit logs are disabled by default for every service except some BigQuery services. Enabling them for Cloud Storage with the DATA_READ type, which covers API methods that read user-provided data, makes Cloud Logging record object downloads in the project's `_Default` bucket.
      options:
        a: { en: "The `_Required` bucket's retention can't be changed, and read entries are never written there while Data Access logs are off." }
        c: { en: "A sink can only route entries that are generated; it can't create the Data Access entries that are missing." }
        d: { en: "The Ops Agent collects the VMs' own logs and metrics; it doesn't make Cloud Storage audit the reads of its objects." }
    references:
      - title: Enable Data Access audit logs
        url: https://docs.cloud.google.com/logging/docs/audit/configure-data-access
      - title: Cloud Audit Logs overview
        url: https://docs.cloud.google.com/logging/docs/audit

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-12-02
    objective: "1.1.10"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A partner must add a fixed public IP address of the VM `api-gw`, in the zone `europe-west1-c`, to its allowlist. An engineer reserved a static external IP address in `us-east1` for this purpose, and assigning it to the VM fails.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Assign the address reserved in `us-east1` with another command, because static external addresses are usable in every region" } }
        - { id: b, text: { en: "Reserve a global static external IP address with `gcloud compute addresses create --global`, and assign it to the VM" } }
        - { id: c, text: { en: "Reserve a static external IP address with `gcloud compute addresses create --region=europe-west1`, and assign it to the VM" } }
        - { id: d, text: { en: "Reserve a static internal IP address with `gcloud compute addresses create --subnet`, in `europe-west1`, and assign it" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A static external IP address assigned to a VM is a regional resource: it must be in the same region as the VM's zone. Reserving the address in `europe-west1` and assigning it to `api-gw` gives the partner a fixed public address.
      options:
        a: { en: "The external IP address of a VM must live in the region of the VM's zone, so an address of `us-east1` can't be used in `europe-west1`." }
        b: { en: "Global external IP addresses are for global load balancers, such as external Application Load Balancers, not for a VM's network interface." }
        d: { en: "An internal IP address isn't reachable from the internet, so the partner couldn't use it in its allowlist." }
    references:
      - title: Configure static external IP addresses
        url: https://docs.cloud.google.com/compute/docs/ip-addresses/configure-static-external-ip-address
      - title: IP addresses
        url: https://docs.cloud.google.com/compute/docs/ip-addresses

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-12-03
    objective: "1.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Last month, a retailer had the CPUs quota of its project `shop-prod` raised to 400 vCPUs in `us-east1`, and the project uses 150 of them. The platform team has now created the project `shop-checkout`, in the same folder and linked to the same Cloud Billing account. Creating a 64-vCPU managed instance group in `us-east1` in `shop-checkout` fails with a quota error.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Request an increase of the CPUs quota of `us-east1` in `shop-prod`, which the projects of its folder share" } }
        - { id: b, text: { en: "Request an increase of the CPUs quota of `us-east1` in `shop-checkout`, for the vCPUs that it needs there" } }
        - { id: c, text: { en: "Grant the Quota Administrator role on `shop-prod` to the service account that creates the group in `shop-checkout`" } }
        - { id: d, text: { en: "Request an increase of the CPUs (all regions) quota of `shop-prod`, so that its unused vCPUs go to the folder" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Most quotas apply per project, and a resource's use in one project doesn't affect the quota available in another. The new project `shop-checkout` has its own default quotas, so its CPUs quota in `us-east1` must be raised for the managed instance group.
      options:
        a: { en: "Projects don't share regional quotas through their folder or billing account; raising `shop-prod` changes nothing for `shop-checkout`." }
        c: { en: "Quota Administrator lets a principal view and request quota changes; it doesn't let another project consume `shop-prod`'s quota." }
        d: { en: "The all-regions CPUs quota also belongs to `shop-prod` only; unused quota is never transferred to other projects." }
    references:
      - title: Cloud Quotas overview
        url: https://docs.cloud.google.com/docs/quotas/overview

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-12-04
    objective: "1.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An insurer's application in the project `claims-api` writes its logs to the `_Default` log bucket, in the `global` location. A new rule requires these logs to be kept for two years. The rule may be relaxed next year, so the retention must remain changeable, and you want the least administrative effort.

        Which command should you run?
    body:
      options:
        - { id: a, text: "`gcloud logging buckets update _Default --location=global --retention-days=730 --project=claims-api`" }
        - { id: b, text: "`gcloud logging buckets update _Required --location=global --retention-days=730 --project=claims-api`" }
        - { id: c, text: "`gcloud logging buckets create claims-2y --location=global --retention-days=730 --project=claims-api`" }
        - { id: d, text: "`gcloud logging buckets update _Default --location=global --retention-days=730 --locked --project=claims-api`" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          In a project, the retention of the `_Default` bucket is 30 days by default and can be set from 1 to 3,650 days. Updating it to 730 days keeps the application logs for two years with one command, and the retention can be changed again later. Retention beyond the default period is billed.
      options:
        b: { en: "The `_Required` bucket holds Admin Activity, System Event and Access Transparency logs, and its 400-day retention isn't configurable." }
        c: { en: "A new bucket receives nothing until a sink routes logs to it, so the application logs would still stay in `_Default` for 30 days." }
        d: { en: "Locking a bucket is irreversible and locks its retention policy, so the retention could no longer be shortened next year." }
    references:
      - title: Configure log buckets
        url: https://docs.cloud.google.com/logging/docs/buckets
      - title: Quotas and limits
        url: https://docs.cloud.google.com/logging/quotas

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-12-05
    objective: "1.1.11"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Last month, an administrator set up Gemini Cloud Assist for the `Analytics` folder in the console, and granted the analysts' group the Gemini Cloud Assist User and Cloud Asset Viewer roles on the folder. This week, a project named `churn-lab` was created in the folder, and the analysts can't use Gemini Cloud Assist in it, while it works in the older projects of the folder.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Run the folder setup again with the gcloud CLI, so that it covers every project that was created since the first setup" } }
        - { id: b, text: { en: "Grant the group the Gemini Cloud Assist User role a second time, directly on the `churn-lab` project this time" } }
        - { id: c, text: { en: "Wait until the folder's Gemini Cloud Assist configuration reaches the new project, which can take up to 24 hours" } }
        - { id: d, text: { en: "Set up Gemini Cloud Assist for the `churn-lab` project itself, so that its required APIs are enabled in the project" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Gemini Cloud Assist, a Preview offering, is set up per project or per folder. A folder setup enables the required APIs, such as `geminicloudassist.googleapis.com` and `cloudasset.googleapis.com`, in the folder's existing projects only; a project added later must be set up on its own. The roles granted on the folder are already inherited by `churn-lab`.
      options:
        a: { en: "Folders can be set up only in the console, not with the gcloud CLI, and a folder setup doesn't cover projects created after it." }
        b: { en: "The group already inherits the role from the folder; what the new project lacks is the required APIs, not a role grant." }
        c: { en: "Projects added to a set-up folder never get Gemini Cloud Assist automatically, so waiting changes nothing." }
    references:
      - title: Set up Gemini Cloud Assist
        url: https://docs.cloud.google.com/cloud-assist/set-up-gemini

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-12-06
    objective: "1.1.9"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A media company's custom mode VPC network `media-vpc` has a subnet `render-euw1` in `europe-west1` and a subnet `web-use1` in `us-east1`. The render VMs in `render-euw1` have no external IP addresses and must download packages from third-party repositories on the internet. No connection from the internet may reach these VMs, and the network already has a Cloud Router with a Cloud NAT gateway in `us-east1` for `web-use1`.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Enable Private Google Access on `render-euw1`, so that the render VMs can reach external addresses from their internal IP addresses" } }
        - { id: b, text: { en: "Edit the Cloud NAT gateway in `us-east1`, so that it also translates the primary IP address range of the `render-euw1` subnet" } }
        - { id: c, text: { en: "Create a Cloud Router and a Cloud NAT gateway in `europe-west1` in `media-vpc`, and configure them for the `render-euw1` subnet" } }
        - { id: d, text: { en: "Create an egress firewall rule that allows TCP 443 to `0.0.0.0/0` at priority 1000 for the render VMs of `render-euw1`" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Cloud NAT lets VMs without external IP addresses open outbound connections to the internet and accepts only the responses, never unsolicited inbound connections. A gateway is configured on a Cloud Router and created in the region of the subnets that need NAT, so `render-euw1` needs its own router and gateway in `europe-west1`.
      options:
        a: { en: "Private Google Access only lets internal-only VMs reach the external addresses of Google APIs and services, not third-party repositories." }
        b: { en: "A Cloud NAT gateway serves subnets of its own region only, so the `us-east1` gateway can't translate a `europe-west1` subnet." }
        d: { en: "Egress is already allowed by the implied rule; the VMs still have no external address, so their packets can't reach the internet." }
    references:
      - title: Cloud NAT overview
        url: https://docs.cloud.google.com/nat/docs/overview
      - title: Private Google Access
        url: https://docs.cloud.google.com/vpc/docs/private-google-access

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-12-07
    objective: "1.1.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The project `render-prod` has a regional CPUs quota (quota ID `CPUS-per-project-region`) of 96 vCPUs in `europe-west1`, all in use. For a product launch, the team needs 104 more vCPUs in that region, and no change in any other region. You will submit the request from Cloud Shell, where your gcloud configuration already sets a billing project.

        Which command should you run?
    body:
      options:
        - { id: a, text: "`gcloud quotas preferences create --service=compute.googleapis.com --project=render-prod --quota-id=CPUS-per-project-region --dimensions=region=europe-west1 --preferred-value=104`" }
        - { id: b, text: "`gcloud quotas preferences create --service=cloudquotas.googleapis.com --project=render-prod --quota-id=CPUS-per-project-region --dimensions=region=europe-west1 --preferred-value=200`" }
        - { id: c, text: "`gcloud quotas info list --service=compute.googleapis.com --project=render-prod --filter=\"quotaId=CPUS-per-project-region\"`" }
        - { id: d, text: "`gcloud quotas preferences create --service=compute.googleapis.com --project=render-prod --quota-id=CPUS-per-project-region --dimensions=region=europe-west1 --preferred-value=200`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A quota preference states the quota value that you want, not an increment: 96 vCPUs in use plus 104 more means a preferred value of 200. The service is the one that defines the quota, `compute.googleapis.com`, and the `region=europe-west1` dimension limits the request to that region.
      options:
        a: { en: "A preferred value of 104 asks for a total quota of 104 vCPUs, which adds only 8 vCPUs to the current 96." }
        b: { en: "The CPUs quota is defined by the Compute Engine service, so the request must name `compute.googleapis.com`, not the Cloud Quotas API." }
        c: { en: "`gcloud quotas info list` shows the quota's information, such as its ID and dimensions, but submits no adjustment request." }
    references:
      - title: gcloud quotas preferences create
        url: https://docs.cloud.google.com/sdk/gcloud/reference/quotas/preferences/create
      - title: Manage quotas using the gcloud CLI
        url: https://docs.cloud.google.com/docs/quotas/gcloud-cli-examples

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-12-08
    objective: "1.1.11"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        An auditor at an energy company asks who modified the firewall rule `allow-scada-vpn` in the project `grid-ops` 50 days ago, and what change the request made. The company has never exported Cloud Asset Inventory data or created feeds, and it has never changed the log routing, retention or audit log settings of the project.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud asset get-history` on the firewall rule, with a start time set 50 days before today" } }
        - { id: b, text: { en: "Query the Admin Activity audit logs of `grid-ops` in the Logs Explorer for the update of the rule" } }
        - { id: c, text: { en: "Run `gcloud asset search-all-resources` on `grid-ops`, filtered on the name of the firewall rule" } }
        - { id: d, text: { en: "Query the Data Access audit logs of `grid-ops` in the Logs Explorer for the update of the rule" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Admin Activity audit logs record configuration changes made by API calls, such as updating a firewall rule, with the principal who made them. They are always written to the project's `_Required` bucket, whose 400-day retention covers a change made 50 days ago.
      options:
        a: { en: "Cloud Asset Inventory keeps asset history for 35 days only, and `get-history` requires a start time within the last 35 days." }
        c: { en: "Searching resources returns their current metadata; it doesn't show who changed them or what they looked like before." }
        d: { en: "Configuration changes are Admin Activity entries, and Data Access audit logs are off by default for every service except BigQuery." }
    references:
      - title: Cloud Asset Inventory overview
        url: https://docs.cloud.google.com/asset-inventory/docs/overview
      - title: Cloud Audit Logs overview
        url: https://docs.cloud.google.com/logging/docs/audit

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-12-09
    objective: "1.1.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A software company runs its workloads on the auto mode network `default` of the project `build-farm`. The `default` subnet in `europe-west1`, with the range `10.132.0.0/20`, is almost full. You must add internal addresses to this subnet without recreating it and without changing the IP addresses of existing VMs. The network team also requires that no subnet ever be added to the network automatically when Google opens a new region.

        Which two commands should you run? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: "`gcloud compute networks subnets expand-ip-range default --region=europe-west1 --prefix-length=21`" }
        - { id: b, text: "`gcloud compute networks update default --switch-to-custom-subnet-mode`" }
        - { id: c, text: "`gcloud compute networks subnets expand-ip-range default --region=europe-west1 --prefix-length=19`" }
        - { id: d, text: "`gcloud compute networks update default --bgp-routing-mode=regional`" }
        - { id: e, text: "`gcloud compute networks create default-v2 --subnet-mode=custom`" }
    answer: { optionIds: [b, c] }
    explanation:
      correct:
        en: |
          Converting the network with `--switch-to-custom-subnet-mode` stops the automatic creation of subnets in new regions; the conversion is one-way and keeps the existing subnets. A primary range can be expanded but never shrunk, and a /19 prefix doubles the /20 range in place, within the /16 limit of automatically created subnets, without changing any VM address.
      options:
        a: { en: "A /21 prefix is smaller than the current /20; a subnet's primary IPv4 range can't be shrunk." }
        d: { en: "The dynamic routing mode decides how Cloud Routers learn and advertise routes; it has no effect on automatic subnet creation." }
        e: { en: "A new network means new subnets and migrating the VMs to new addresses, which the requirements forbid." }
    references:
      - title: "Quickstart: Create and manage VPC networks"
        url: https://docs.cloud.google.com/vpc/docs/create-modify-vpc-networks
      - title: Subnets
        url: https://docs.cloud.google.com/vpc/docs/subnets

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-12-10
    objective: "1.1.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A retailer has added its 30 production projects to the metrics scope of the dedicated project `ops-monitoring`. The on-call team must view, from `ops-monitoring` only, the CPU and memory utilization charts of the Compute Engine VMs of all these projects, with read-only access and the least privilege. The charts show CPU utilization, but the memory charts are empty. The VMs' service accounts already have the Logs Writer and Monitoring Metric Writer roles.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Grant the on-call team the Monitoring Viewer role on each of the 30 production projects" } }
        - { id: b, text: { en: "Grant the on-call team the Monitoring Viewer role on the `ops-monitoring` project" } }
        - { id: c, text: { en: "Grant the on-call team the Monitoring Admin role on the `ops-monitoring` project" } }
        - { id: d, text: { en: "Install the Ops Agent on the production VMs, for example with agent policies" } }
        - { id: e, text: { en: "Add the 30 production projects to the log scope of the `ops-monitoring` project" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Monitoring Viewer on the scoping project is enough to view the metrics of every project in its metrics scope; no other permission is needed. CPU utilization is collected without an agent, but memory and disk space utilization require the Ops Agent, whose service account roles are already in place.
      options:
        a: { en: "Roles on the monitored projects aren't needed to read them through the scope, so 30 extra grants break least privilege." }
        c: { en: "Monitoring Admin can also change the scope, dashboards and alerting policies, which exceeds read-only access." }
        e: { en: "A log scope selects what the Logs Explorer shows; it doesn't produce memory metrics or grant access to them." }
    references:
      - title: Metrics scopes overview
        url: https://docs.cloud.google.com/monitoring/settings
      - title: Observe and monitor VMs
        url: https://docs.cloud.google.com/compute/docs/instances/observe-monitor-vms
