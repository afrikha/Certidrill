chapter: 11-projects-hierarchy
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Twelve days ago, an engineer at a travel company shut down the project `fares-staging` by mistake with `gcloud projects delete`. The team wants the same project back, with the same project ID and its resources, working as it did before.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud projects undelete fares-staging`, and then link the project to its Cloud Billing account again" } }
        - { id: b, text: { en: "Run `gcloud projects undelete fares-staging`, and let its Cloud Billing account link come back with the project" } }
        - { id: c, text: { en: "Create a new project with the ID `fares-staging`, and then link it to the same Cloud Billing account" } }
        - { id: d, text: { en: "Wait until the 30-day period ends, and then restore the project from the Manage resources page" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A shut-down project stays in the `DELETE_REQUESTED` state for 30 days, and during that window `gcloud projects undelete` restores it with its ID and most of its resources. Shutting a project down disconnects its Cloud Billing account, and the link is not restored automatically, so you must link the project to a billing account again.
      options:
        b: { en: "Undelete restores the project, but not its billing link: the Cloud Billing account must be relinked manually." }
        c: { en: "A project ID can never be reused, including the ID of a deleted project, and a new project would not contain the old resources." }
        d: { en: "After 30 days, the project and its resources are permanently deleted; restoring is possible only within the window." }
    references:
      - title: Delete and restore projects
        url: https://docs.cloud.google.com/resource-manager/docs/delete-restore-projects

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-11-02
    objective: "1.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer must enable the Cloud Translation API in the project `docs-portal`, which is the default project of her gcloud configuration. The API has never been enabled there, and she doesn't know the service name to pass to `gcloud services enable`.

        Which command shows her the service name?
    body:
      options:
        - { id: a, text: "`gcloud services list --enabled --filter=\"name:translate\"`" }
        - { id: b, text: "`gcloud services list --filter=\"name:translate\"`" }
        - { id: c, text: "`gcloud services list --available --filter=\"name:translate\"`" }
        - { id: d, text: "`gcloud projects describe docs-portal --format=json`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `gcloud services list --available` returns the services that the project can enable, including those not enabled yet, and the filter narrows the list to names that contain `translate`. The `NAME` column gives the value to pass to `gcloud services enable`, such as `translate.googleapis.com`.
      options:
        a: { en: "With `--enabled`, the command lists only the services already enabled in the project, so the Translation API doesn't appear." }
        b: { en: "Without a flag, `gcloud services list` defaults to `--enabled`, so it also misses a service that isn't enabled yet." }
        d: { en: "`gcloud projects describe` shows the project's metadata, such as its number, parent and state, not the services it can use." }
    references:
      - title: Enable and disable services
        url: https://docs.cloud.google.com/service-usage/docs/enable-disable

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-11-03
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An insurance company manages 2,000 employees in an on-premises Active Directory. It has created a Cloud Identity account for its domain and a SAML single sign-on profile that delegates authentication to AD FS. The Google Admin console lists no user accounts other than the two super administrators. When employees try to sign in to the Google Cloud console, AD FS accepts their passwords, but the sign-in to Google fails. Employees must use Cloud Identity accounts, and Active Directory must remain the source of truth.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Assign the SAML single sign-on profile to the organizational unit that is meant to contain the employees" } }
        - { id: b, text: { en: "Deploy Google Cloud Directory Sync to provision the users and groups from Active Directory on a schedule" } }
        - { id: c, text: { en: "Create a workforce identity pool with an AD FS provider, and grant IAM roles to the principals of the pool" } }
        - { id: d, text: { en: "Change the AD FS claim rules so that the SAML response sends the user principal name as the NameID" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Single sign-on only delegates authentication: for a sign-on to succeed, the matching Cloud Identity user must already have been provisioned. Google Cloud Directory Sync reads users and groups from Active Directory and creates and updates them in Cloud Identity on a schedule, one way, so Active Directory stays the source of truth.
      options:
        a: { en: "Assigning the SSO profile decides how existing users authenticate; it doesn't create the missing user accounts." }
        c: { en: "Workforce Identity Federation signs users in without Cloud Identity accounts, which fails the requirement to use Cloud Identity accounts." }
        d: { en: "The NameID only identifies a user who must already exist in Cloud Identity; with no accounts provisioned, every sign-in still fails." }
    references:
      - title: Federate Google Cloud with Active Directory
        url: https://docs.cloud.google.com/architecture/identity/federating-gcp-with-active-directory-introduction

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-11-04
    objective: "1.1.12"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A consultancy federates its partners' identities through the workforce identity pool `partners-pool`. The pool's provider maps `google.subject=assertion.sub` and `attribute.company=assertion.company`, and the IdP sends `harbor-audit` in the `company` claim of every employee of an audit firm. All the employees of that firm, and nobody else, must get the Reader role on the project `audit-evidence`.

        Which member should you use in the `gcloud projects add-iam-policy-binding` command?
    body:
      options:
        - { id: a, text: "`principalSet://iam.googleapis.com/locations/global/workforcePools/partners-pool/group/harbor-audit`" }
        - { id: b, text: "`principal://iam.googleapis.com/locations/global/workforcePools/partners-pool/subject/harbor-audit`" }
        - { id: c, text: "`principalSet://iam.googleapis.com/locations/global/workforcePools/partners-pool/*`" }
        - { id: d, text: "`principalSet://iam.googleapis.com/locations/global/workforcePools/partners-pool/attribute.company/harbor-audit`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A custom attribute mapped in the provider, here `attribute.company`, can be used in a principal set that contains every identity of the pool with that attribute value. Granting Reader to `.../attribute.company/harbor-audit` covers all the firm's employees, including future ones, and no other partner.
      options:
        a: { en: "The `group/` form matches values of `google.groups`, which the provider doesn't map; the company claim is a custom attribute." }
        b: { en: "The `subject/` form identifies one user by the `google.subject` value, which is each user's `sub` claim, not the company name." }
        c: { en: "The `*` principal set contains every identity of the pool, so employees of the other partners would get the role too." }
    references:
      - title: Workforce Identity Federation
        url: https://docs.cloud.google.com/iam/docs/workforce-identity-federation
      - title: Principal identifiers
        url: https://docs.cloud.google.com/iam/docs/principal-identifiers

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-11-05
    objective: "1.1.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        For two years, the founder of an architecture firm has run its Google Cloud projects under No organization, with a billing account and projects owned by her Google Account. The firm owns the domain `lindqvist-arch.example` but has never set up Google Workspace or Cloud Identity. It now wants an organization resource at the root of its projects, to use folders and organization policies.

        What should the firm do?
    body:
      options:
        - { id: a, text: { en: "Sign in to the console again and accept the terms, so that a standalone organization is created for her account" } }
        - { id: b, text: { en: "Create a folder named after the firm in the console, and then move all the existing projects into the folder" } }
        - { id: c, text: { en: "Sign up for Cloud Identity Free with the domain and verify it, and then migrate the projects into the organization" } }
        - { id: d, text: { en: "Create a second billing account with her Google Account, so that an organization resource is created for it" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Standalone organizations are only for new Free Trial customers; they aren't available to existing Google Cloud accounts. Once a Cloud Identity account is associated with the verified domain, an organization resource is created (for an existing Google Cloud user, when a project or billing account is created). Projects under No organization don't join it automatically: they must be migrated into it.
      options:
        a: { en: "An existing Google Cloud account doesn't receive a standalone organization, however many times its user accepts the terms." }
        b: { en: "Folders exist only under an organization resource, so they can't be created before the firm has one." }
        d: { en: "Creating a billing account creates an organization only for a Cloud Identity or Workspace account, not for a consumer Google Account." }
    references:
      - title: Set up standalone organizations
        url: https://docs.cloud.google.com/resource-manager/docs/standalone-organization-overview
      - title: Set up a Google Cloud organization resource
        url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-organization

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-11-06
    objective: "1.1.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A startup's standalone organization has two Organization Owners: the founder's Google Account and the IT lead, who signs in as a principal of the workforce pool `staff-pool`. The founder leaves the company this week, and his account must stop being an owner. The organization must remain fully manageable. Other staff members, including the CFO, have Google Accounts, and the deployment pipeline runs as a service account.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Remove the founder on the Organization details page, and keep the IT lead's workforce principal as the only owner" } }
        - { id: b, text: { en: "Invite the pipeline's service account as an Organization Owner, and remove the founder once it is an owner" } }
        - { id: c, text: { en: "Grant the IT lead's principal the Organization Administrator role, and then remove the founder as an owner" } }
        - { id: d, text: { en: "Invite the CFO's Google Account as an Organization Owner, and remove the founder once the CFO has accepted" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A standalone organization must always keep at least one active Google Account among its Organization Owners; workforce pool principals can be owners but don't satisfy that rule. Inviting another Google Account from the Organization details page, and removing the founder only after the invitation is accepted, keeps a valid owner at every moment.
      options:
        a: { en: "The IT lead is a workforce pool principal, so removing the founder would leave no active Google Account as owner, which isn't allowed." }
        b: { en: "Service accounts can't be Organization Owners, so the invitation would be refused and the founder couldn't be removed." }
        c: { en: "Organization Administrator is an IAM role, not ownership; a workforce owner already receives it, and it doesn't replace a Google Account owner." }
    references:
      - title: Set up standalone organizations
        url: https://docs.cloud.google.com/resource-manager/docs/standalone-organization-overview

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-11-07
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The organization of a logistics company enforces a policy on the legacy `compute.vmExternalIpAccess` list constraint that denies all values. In the project `edi-gateway`, a partner requires that the existing VM `sftp-1`, in the zone `europe-west1-b`, receive an external IP address. No other VM in the project or the rest of the organization may get one. The project's administrator, who holds the Compute Admin role on the project, gets an organization policy error when she assigns the address.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Grant the administrator the Compute Admin role on the organization, and then have her assign the external IP address to `sftp-1` again" } }
        - { id: b, text: { en: "Have an Organization Policy Administrator set a policy on the project that replaces the parent's policy and allows all values for VMs" } }
        - { id: c, text: { en: "Have an Organization Policy Administrator set a policy on the project that allows only `projects/edi-gateway/zones/europe-west1-b/instances/sftp-1`" } }
        - { id: d, text: { en: "Delete the organization's policy, and then enforce the constraint on every folder except the folder that contains `edi-gateway`" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          IAM roles decide who may act, but they never override an organization policy. For `compute.vmExternalIpAccess`, allowed values name VM instances in the form `projects/PROJECT_ID/zones/ZONE/instances/INSTANCE_NAME`. A policy set on the project, which doesn't inherit from its parent, makes this single instance the only one allowed, and the organization's policy still denies every other VM.
      options:
        a: { en: "A broader IAM role doesn't bypass the constraint: the request would fail with the same organization policy error." }
        b: { en: "Allowing all values in the project would let every VM of `edi-gateway` get an external IP address, which the requirement forbids." }
        d: { en: "Removing the policy from the organization exposes the projects of that folder, and any project placed directly under the organization." }
    references:
      - title: Configure static external IP addresses
        url: https://docs.cloud.google.com/compute/docs/ip-addresses/configure-static-external-ip-address
      - title: Hierarchy evaluation
        url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/understanding-hierarchy

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-11-08
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        At a fintech company, two automation pipelines update the allow policy of the project `ledger-prod`. Each one runs `gcloud projects get-iam-policy`, edits the JSON file, and applies it with `gcloud projects set-iam-policy`. Last month, a developer added a step that deletes the `etag` field from the file, because `set-iam-policy` sometimes failed when both pipelines ran at the same time. Since then, role bindings added by one pipeline occasionally disappear a few minutes later.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Keep the `etag` field in the file, and when `set-iam-policy` fails, apply the same file again after copying in the current `etag`" } }
        - { id: b, text: { en: "Keep deleting the `etag` field, and wait seven minutes after each `set-iam-policy` call so that the change can propagate" } }
        - { id: c, text: { en: "Keep deleting the `etag` field, and set the policy `version` to 3 in the file so that IAM merges the concurrent edits" } }
        - { id: d, text: { en: "Keep the `etag` field in the file, and when `set-iam-policy` fails, read the policy again, reapply the edit, and retry" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The `etag` provides optimistic concurrency control: if the policy changed after it was read, the etag no longer matches and the update fails instead of silently overwriting the other pipeline's bindings. The recommended recovery is to retry the whole read-modify-write sequence: read the current policy, apply the edit to it, and set it again.
      options:
        a: { en: "Copying the new etag into the old file bypasses the check: the file still lacks the other pipeline's bindings, which are overwritten." }
        b: { en: "Propagation delay isn't the cause; without an etag, the last write replaces the whole policy, and waiting doesn't bring lost bindings back." }
        c: { en: "Policy version 3 is needed for conditional role bindings; it doesn't make IAM merge two writes, and omitting the etag can even drop conditions." }
    references:
      - title: Understanding allow policies
        url: https://docs.cloud.google.com/iam/docs/allow-policies
      - title: Manage access to projects, folders, and organizations
        url: https://docs.cloud.google.com/iam/docs/granting-changing-revoking-access

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-11-09
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The project `churn-model` sits in the `Data-Dev` folder. On `Data-Dev`, the group `data-devs@corvane.example` has the Writer role, and a policy on the `gcp.resourceLocations` constraint allows only `in:us-locations`. On the project itself, the service account `trainer@churn-model.iam.gserviceaccount.com` has the Storage Object Admin role. A release engineer moves the project to the `Data-Prod` folder, whose policy on the same constraint allows only `in:eu-locations` and which grants the Reader role to the group `data-ops@corvane.example`. The organization sets neither roles nor policies for these principals and this constraint.

        Which two statements are true after the move? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The `trainer` service account still has the Storage Object Admin role on the project." } }
        - { id: b, text: { en: "The `data-devs` group keeps the Writer role on the project until someone removes it there." } }
        - { id: c, text: { en: "New resources can be created in US and EU locations, because the two folder policies are merged." } }
        - { id: d, text: { en: "The `data-ops` group gets the Reader role on the project only once it is granted on the project." } }
        - { id: e, text: { en: "New resources in the project that take a location can be created only in EU locations." } }
    answer: { optionIds: [a, e] }
    explanation:
      correct:
        en: |
          Allow policies and organization policies attached directly to a project move with it, so the service account keeps its role. Inherited policies don't move: after the move, the project inherits its IAM and organization policies from its new parent, so the `Data-Prod` location policy, which allows only EU locations, now applies to new resources.
      options:
        b: { en: "The Writer role was inherited from `Data-Dev`; once the project leaves that folder, the inherited grant no longer applies." }
        c: { en: "Policies merge only along the project's ancestors; `Data-Dev` is no longer one of them, so its US policy stops applying." }
        d: { en: "Roles granted on `Data-Prod` are inherited by every project in the folder, so `data-ops` gets Reader as soon as the move completes." }
    references:
      - title: Move a project
        url: https://docs.cloud.google.com/resource-manager/docs/moving-projects-folders
      - title: Using resource hierarchy for access control
        url: https://docs.cloud.google.com/iam/docs/resource-hierarchy-access-control

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-11-10
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A media company wants every GKE node pool created in its `Production` folder to have node auto-upgrade enabled. No managed or legacy constraint covers this setting. Teams in the other folders must stay free to create node pools without auto-upgrade, and in `Production` a non-compliant request must be blocked, not only reported. You have the Organization Policy Administrator role on the organization.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set a policy on the organization that enforces the custom constraint in its `spec`, with `gcloud org-policies set-policy`" } }
        - { id: b, text: { en: "Define a custom constraint in the organization that allows node pools only if `resource.management.autoUpgrade == true`" } }
        - { id: c, text: { en: "Set a policy on the `Production` folder that enforces the custom constraint only in its `dryRunSpec`, and review the audit logs" } }
        - { id: d, text: { en: "Set a policy on the `Production` folder that enforces the custom constraint in its `spec`, with `gcloud org-policies set-policy`" } }
        - { id: e, text: { en: "Grant the `Production` teams a custom IAM role that leaves out the permission to turn off node auto-upgrade on node pools" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A custom constraint is defined at the organization (`organizations/ORGANIZATION_ID/customConstraints/custom.NAME`, applied with `gcloud org-policies set-custom-constraint`) with a resource type (here `container.googleapis.com/NodePool`), a CEL condition and an action; here only node pools whose auto-upgrade is on are allowed. The constraint does nothing until an organization policy enforces it, and a policy set on the `Production` folder applies to that folder's projects only.
      options:
        a: { en: "A policy on the organization would apply to every folder, so teams outside `Production` could no longer turn auto-upgrade off." }
        c: { en: "A dry-run policy only writes violations to the audit logs; it doesn't block non-compliant requests." }
        e: { en: "IAM permissions control which methods a principal may call, not the values of a resource's fields; that is what custom constraints do." }
    references:
      - title: Create custom constraints
        url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/creating-managing-custom-constraints
      - title: Organization Policy overview
        url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/overview
