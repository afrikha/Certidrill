chapter: 42-service-accounts
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An engineer created a user-managed service account with a typo in its ID: `ordrs-api@shop-prod.iam.gserviceaccount.com`. The team wants the application to run as an account whose email is `orders-api@shop-prod.iam.gserviceaccount.com`.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud iam service-accounts update` on `ordrs-api` with `--display-name=orders-api` to fix the email address." } }
        - { id: b, text: { en: "Create a service account with the ID `orders-api`, grant it the roles, and move the application to it." } }
        - { id: c, text: { en: "Delete `ordrs-api`, then undelete it with its numeric unique ID and choose the new ID `orders-api`." } }
        - { id: d, text: { en: "Open the account's details page in the console, and change its service account ID to `orders-api`." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A service account's ID can't be changed after creation, and the email address is built from it. The only way to get the new email is a new account, which is a different identity: grant it the roles it needs, switch the workload to it, then disable and remove the old one.
      options:
        a: { en: "The display name and description can be updated, but they are labels only; the ID and the email address stay the same." }
        c: { en: "Undelete restores the same account, with its original ID; it doesn't let you choose a new one." }
        d: { en: "The console lets you edit the generated ID only before creation; after that the ID is fixed." }
    references:
      - title: Create service accounts
        url: https://docs.cloud.google.com/iam/docs/service-accounts-create

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-42-02
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A company runs three applications on Compute Engine in one project: a web front end, a billing job and a reporting tool. Each one calls different Google Cloud APIs. Today all three run as the Compute Engine default service account, which has the Editor role. You must follow Google's recommended practice for service accounts.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Keep the default service account, and replace its Editor role with the union of the roles that the three applications need" } }
        - { id: b, text: { en: "Create one user-managed service account for the three applications, and grant it the roles that each application needs" } }
        - { id: c, text: { en: "Create a service account key for each application on the default service account, so that logs show which key was used" } }
        - { id: d, text: { en: "Create one user-managed service account per application, and grant each account only the roles of its own application" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Google recommends a dedicated service account for each application and avoiding default service accounts. Each account then holds only its application's permissions, a compromise affects one workload, and audit logs show which application acted.
      options:
        a: { en: "The default account stays shared by every VM that doesn't choose another account, and each application still gets the permissions of the other two." }
        b: { en: "A shared account gives each application the permissions of the others, and audit logs can't tell which application made a call." }
        c: { en: "Keys are long-lived credentials and a last resort; they don't separate the applications' permissions, which all stay those of the default account." }
    references:
      - title: Best practices for using service accounts securely
        url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-42-03
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        During incident response, the security group of a bank must be able to list, disable and delete the keys of every service account in the project `core-prod`. The group must not create or delete service accounts, attach them to resources or impersonate them. You must use a predefined role and follow the principle of least privilege.

        Which role should you grant the group on the project?
    body:
      options:
        - { id: a, text: { en: "Service Account Admin (`roles/iam.serviceAccountAdmin`)" } }
        - { id: b, text: { en: "Service Account Token Creator (`roles/iam.serviceAccountTokenCreator`)" } }
        - { id: c, text: { en: "Service Account Key Admin (`roles/iam.serviceAccountKeyAdmin`)" } }
        - { id: d, text: { en: "Service Account User (`roles/iam.serviceAccountUser`)" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Service Account Key Admin is the predefined role for managing service account keys: list, disable, enable and delete them. Granted on the project, it covers the keys of every service account there, without the right to manage the accounts themselves, attach them or create tokens.
      options:
        a: { en: "Service Account Admin creates, updates and deletes the accounts and manages their allow policies, which the group must not do." }
        b: { en: "Token Creator lets the group impersonate the accounts, which is explicitly forbidden, and it gives no key management permission." }
        d: { en: "Service Account User lets the group attach the accounts to resources, which is forbidden, and it doesn't manage keys." }
    references:
      - title: Disable and enable service account keys
        url: https://docs.cloud.google.com/iam/docs/keys-disable-enable

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-42-04
    objective: "4.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The group `sre@example.com` holds the Service Account User role on the service account `ops-admin@ops-prod.iam.gserviceaccount.com`. When an SRE runs `gcloud compute instances list --impersonate-service-account=ops-admin@ops-prod.iam.gserviceaccount.com`, the command fails because the permission `iam.serviceAccounts.getAccessToken` is denied. The SREs must impersonate `ops-admin` and no other service account of the project.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Grant the group the Service Account Token Creator role on the `ops-prod` project" } }
        - { id: b, text: { en: "Grant the group the Service Account Token Creator role on the `ops-admin` account" } }
        - { id: c, text: { en: "Grant the group the Service Account Admin role on the `ops-admin` account" } }
        - { id: d, text: { en: "Grant the group the Workload Identity User role on the `ops-admin` account" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Impersonation needs `iam.serviceAccounts.getAccessToken`, which Service Account Token Creator provides; Service Account User only lets a principal attach the account to resources, not create short-lived credentials. Granting Token Creator on the account itself limits impersonation to `ops-admin`.
      options:
        a: { en: "Token Creator on the project lets the group impersonate every service account in the project, which the requirement forbids." }
        c: { en: "Service Account Admin manages the account and its allow policy but doesn't include the permission to create access tokens for it." }
        d: { en: "Workload Identity User is for federated identities, such as GKE workloads or external workloads, not for users who impersonate with gcloud." }
    references:
      - title: Roles for service account authentication
        url: https://docs.cloud.google.com/iam/docs/service-account-permissions
      - title: Service account impersonation
        url: https://docs.cloud.google.com/iam/docs/service-account-impersonation

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-42-05
    objective: "4.2.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You created a node pool in a GKE Standard cluster that runs as the new user-managed service account `gke-nodes@media-prod.iam.gserviceaccount.com`, which has no role yet. The Pods use Workload Identity Federation for GKE for their own API calls, and all images come from a public registry. The nodes' system logs and metrics don't appear in Cloud Logging and Cloud Monitoring. You must follow the principle of least privilege.

        Which role should you grant to `gke-nodes` on the project?
    body:
      options:
        - { id: a, text: { en: "Kubernetes Engine Developer (`roles/container.developer`)" } }
        - { id: b, text: { en: "Logs Writer (`roles/logging.logWriter`)" } }
        - { id: c, text: { en: "Editor (`roles/editor`)" } }
        - { id: d, text: { en: "Kubernetes Engine Default Node Service Account (`roles/container.defaultNodeServiceAccount`)" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          GKE uses the node service account for system tasks such as logging and monitoring. A custom node service account needs at least the Kubernetes Engine Default Node Service Account role on the project, which is the minimal role Google defines for this purpose.
      options:
        a: { en: "Kubernetes Engine Developer gives access to Kubernetes API objects in clusters; it isn't the role that nodes need to send their logs and metrics." }
        b: { en: "Logs Writer would let the nodes send logs but not metrics, so Cloud Monitoring would still have no node data." }
        c: { en: "Editor covers almost every service of the project, far beyond what the nodes need, which fails least privilege." }
    references:
      - title: About service accounts in GKE
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/service-accounts

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-42-06
    objective: "4.2.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A team moves its `invoices` Deployment from a GKE Standard cluster to a new GKE Autopilot cluster in the same project. The Pod template sets `serviceAccountName: invoices-ksa` and the `nodeSelector` `iam.gke.io/gke-metadata-server-enabled: "true"`. The principal identifier of `invoices-ksa` in the namespace `billing` already has the roles it needs. On the Autopilot cluster, the Deployment's Pods are rejected.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud container clusters update` with `--workload-pool` on the Autopilot cluster, then redeploy the manifest." } }
        - { id: b, text: { en: "Create a node pool with `--workload-metadata=GKE_METADATA` in the Autopilot cluster for the Deployment's Pods." } }
        - { id: c, text: { en: "Remove the `iam.gke.io/gke-metadata-server-enabled` nodeSelector from the Pod template, and redeploy it." } }
        - { id: d, text: { en: "Annotate `invoices-ksa` with `iam.gke.io/gcp-service-account`, and keep the nodeSelector in the Pod template." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          In Autopilot, Workload Identity Federation for GKE is always enabled and every node runs the GKE metadata server. Autopilot rejects the `iam.gke.io/gke-metadata-server-enabled` nodeSelector, which is only needed on Standard clusters, so removing it lets the Pods run with the roles already granted to `invoices-ksa`.
      options:
        a: { en: "Workload Identity Federation for GKE is already always on in Autopilot; enabling it again doesn't change the rejected nodeSelector." }
        b: { en: "Google manages Autopilot nodes, and they all already use the GKE metadata server; the `--workload-metadata` setting is for Standard node pools." }
        d: { en: "The annotation is part of the linking method with an IAM service account; the roles are already granted directly, and the nodeSelector would still be rejected." }
    references:
      - title: Authenticate to Google Cloud APIs from GKE workloads
        url: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/workload-identity

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-42-07
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Five SREs make firewall changes in the project `net-prod` only by impersonating `fw-admin@net-prod.iam.gserviceaccount.com`, which has no keys. Last night a firewall rule was deleted, and the Admin Activity audit log entry of the deletion shows `fw-admin` as the caller. The security team must find which SRE deleted the rule.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Read `protoPayload.authenticationInfo.principalEmail` in the entry, which records the SRE behind the service account." } }
        - { id: b, text: { en: "Read `protoPayload.authenticationInfo.serviceAccountDelegationInfo` in the entry, which records the SRE who impersonated." } }
        - { id: c, text: { en: "Enable the Data Access audit logs for IAM, because Admin Activity entries record only the impersonated service account." } }
        - { id: d, text: { en: "Read `protoPayload.requestMetadata.callerIp` in the entry, and match the address against the SREs' workstations." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Most audit logs record both identities when a principal impersonates a service account. The service account appears in `authenticationInfo.principalEmail`, and the principal who created the short-lived credentials appears in `serviceAccountDelegationInfo`, under `firstPartyPrincipal.principalEmail`.
      options:
        a: { en: "`principalEmail` shows the identity that made the call, here `fw-admin`, not the SRE who impersonated it." }
        c: { en: "The Admin Activity entry already contains the delegation information; Data Access logs are not needed, and enabling them now wouldn't cover last night." }
        d: { en: "An IP address is not an identity: addresses can be shared or reassigned, while the entry already names the impersonating principal." }
    references:
      - title: Example logs for service accounts
        url: https://docs.cloud.google.com/iam/docs/audit-logging/examples-service-accounts
      - title: Service account impersonation
        url: https://docs.cloud.google.com/iam/docs/service-account-impersonation

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-42-08
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The zonal managed instance group `batch-mig` in `europe-west1-b` runs 20 VMs created from the instance template `batch-tpl-v1`, which uses the Compute Engine default service account. All the VMs must now run as `batch-sa@etl-prod.iam.gserviceaccount.com` with the `cloud-platform` scope. The VMs must be replaced gradually so that the batch service stays available, and you have Service Account User on `batch-sa`.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create the template `batch-tpl-v2` with the same settings plus `--service-account=batch-sa@etl-prod.iam.gserviceaccount.com --scopes=cloud-platform`" } }
        - { id: b, text: { en: "Edit `batch-tpl-v1` to replace its service account with `batch-sa`, so that the group uses the new identity at its next autohealing check" } }
        - { id: c, text: { en: "Run `gcloud compute instance-groups managed set-instance-template batch-mig --template=batch-tpl-v2`, and let the existing VMs update" } }
        - { id: d, text: { en: "Run `gcloud compute instance-groups managed rolling-action start-update batch-mig --version=template=batch-tpl-v2 --zone=europe-west1-b`" } }
        - { id: e, text: { en: "Stop each VM of the group in turn, run `gcloud compute instances set-service-account` on it, and start it again" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The service account of a MIG's VMs comes from its instance template, so you create a new template with the new account and scope. A rolling update with `rolling-action start-update` then replaces the existing VMs with VMs from the new template gradually, which keeps the service available.
      options:
        b: { en: "Instance templates can't be modified after creation: gcloud has no update command for them, so you must create a new template." }
        c: { en: "`set-instance-template` applies the new template only to VMs added to the group later; the 20 existing VMs keep the old identity." }
        e: { en: "Changes made directly to a group's VMs don't match the group's template, so any VM that the group recreates or autoheals comes back with the old account." }
    references:
      - title: Automatically apply VM configuration updates in a MIG
        url: https://docs.cloud.google.com/compute/docs/instance-groups/rolling-out-updates-to-managed-instance-groups

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-42-09
    objective: "4.2.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Example Corp has two new requirements. First, a batch application in its data center, which gets OIDC tokens from the company's AD FS, must load files into the Cloud Storage bucket `gs://ingest-raw` without any service account key. Second, 300 employees who sign in with Microsoft Entra ID must view BigQuery datasets in the Google Cloud console. The security team forbids copying the employees' accounts into Cloud Identity.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a workload identity pool with an OIDC provider that trusts AD FS, and grant the bucket role to the batch application's principal." } }
        - { id: b, text: { en: "Create a workforce identity pool with an OIDC provider that trusts AD FS, and grant the bucket role to the batch application's principal." } }
        - { id: c, text: { en: "Create a workforce identity pool in the organization with a Microsoft Entra ID provider, and grant the BigQuery roles to its groups." } }
        - { id: d, text: { en: "Create a workload identity pool with a Microsoft Entra ID provider, and grant the BigQuery roles to the employees' principal set." } }
        - { id: e, text: { en: "Sync the employees from Microsoft Entra ID with Google Cloud Directory Sync, and grant the BigQuery roles to their group." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Workload Identity Federation is for applications outside Google Cloud: a workload identity pool with an OIDC provider for AD FS exchanges the batch job's tokens for short-lived federated tokens, and direct resource access on the bucket needs no key. Workforce Identity Federation is for people: a workforce pool, configured at the organization level, lets Entra ID users sign in to the federated console with single sign-on and without any account stored in Cloud Identity.
      options:
        b: { en: "Workforce pools are for human users, and their token exchange quota is shared across the organization; automated workloads should use Workload Identity Federation." }
        d: { en: "Workload identity pools federate applications, not people, and they don't give employees a console sign-in." }
        e: { en: "Google Cloud Directory Sync copies the accounts into Cloud Identity, which the security team forbids." }
    references:
      - title: Workload Identity Federation
        url: https://docs.cloud.google.com/iam/docs/workload-identity-federation
      - title: Workforce Identity Federation
        url: https://docs.cloud.google.com/iam/docs/workforce-identity-federation

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-42-10
    objective: "4.2.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A hospital's organization was created in 2025 and keeps the default organization policies. A legacy lab appliance in the data center can authenticate only with a JSON service account key; it supports neither Workload Identity Federation nor any other credential type. The security team approves keys only for service accounts of the project `lab-legacy`, and every new key there must stop working automatically within 90 days. Keys must stay blocked everywhere else.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "On `lab-legacy`, set a policy that doesn't enforce the `iam.disableServiceAccountKeyCreation` constraint" } }
        - { id: b, text: { en: "On the organization, set a policy that doesn't enforce the `iam.disableServiceAccountKeyCreation` constraint" } }
        - { id: c, text: { en: "On `lab-legacy`, set a policy that doesn't enforce the `iam.disableServiceAccountKeyUpload` constraint" } }
        - { id: d, text: { en: "On `lab-legacy`, set the `iam.serviceAccountKeyExpiryHours` constraint to allow the value `2160h`" } }
        - { id: e, text: { en: "On `lab-legacy`, list the account in `iam.allowServiceAccountCredentialLifetimeExtension` for 90 days" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          In organizations created on or after May 3, 2024, `iam.disableServiceAccountKeyCreation` is enforced by default; a policy on the project that doesn't enforce it allows keys there only. The `iam.serviceAccountKeyExpiryHours` constraint sets how long newly created keys stay valid, and `2160h` (90 days) is its longest allowed value.
      options:
        b: { en: "Lifting the constraint on the organization allows key creation in every project, which breaks the requirement to keep keys blocked elsewhere." }
        c: { en: "The upload constraint controls uploading your own public keys; the appliance needs a key created by Google Cloud, which the creation constraint blocks." }
        e: { en: "The lifetime extension constraint lets access tokens last up to 12 hours; it doesn't apply to service account keys and has no 90-day value." }
    references:
      - title: Restrict IAM service account usage
        url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/restricting-service-accounts
