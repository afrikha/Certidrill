chapter: 33-manage-serverless-ai
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-33-01
    objective: "3.1.10"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An engineer staged version 3 of the Cloud Run service `menu` with `--no-traffic --tag=beta`. The service URL is `https://menu-k3x9q.a.run.app`, and all users still reach the previous revision. Testers must open the staged revision directly.

        Which URL should the testers use?
    body:
      options:
        - { id: a, text: { en: "`https://menu-k3x9q.a.run.app/beta`" } }
        - { id: b, text: { en: "`https://beta.menu-k3x9q.a.run.app`" } }
        - { id: c, text: { en: "`https://beta---menu-k3x9q.a.run.app`" } }
        - { id: d, text: { en: "`https://menu-k3x9q.a.run.app?tag=beta`" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A traffic tag gives its revision a dedicated URL made of the tag name, three hyphens and the service host name. Requests to that URL always reach the tagged revision, even though it receives 0% of the traffic sent to the main service URL.
      options:
        a: { en: "A path on the service URL is passed to the revision that serves the main traffic; tags do not select revisions by path." }
        b: { en: "The tag is not a subdomain of the service host: Cloud Run separates the tag and the service name with three hyphens." }
        d: { en: "Cloud Run has no query parameter that selects a revision; the request would reach the revision serving production traffic." }
    references:
      - title: Rollbacks, gradual rollouts, and traffic migration
        url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-33-02
    objective: "3.1.15"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An Agent Platform Workbench instance with one GPU was shut down overnight by idle shutdown. A finance analyst asks what the project is still billed for while the instance stays shut down, with no scheduled executions.

        What do you answer?
    body:
      options:
        - { id: a, text: { en: "The disk storage of the instance, but no CPU or GPU usage" } }
        - { id: b, text: { en: "The GPU reservation, but no CPU usage or disk storage" } }
        - { id: c, text: { en: "The vCPUs at a reduced rate, but no GPU or disk storage" } }
        - { id: d, text: { en: "Nothing at all, until the instance is started again" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          When a Workbench instance is shut down, by a user or by idle shutdown, CPU and GPU usage charges stop, except for scheduled executions that run during the shutdown. Its disks still exist, so disk storage charges continue.
      options:
        b: { en: "A shut-down instance does not keep billing its GPU, and its disks are still billed." }
        c: { en: "There is no reduced vCPU rate for a shut-down instance: CPU charges stop, while disk charges continue." }
        d: { en: "The boot and data disks are kept while the instance is shut down, and they are billed." }
    references:
      - title: Idle shutdown
        url: https://docs.cloud.google.com/vertex-ai/docs/workbench/instances/idle-shutdown

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-33-03
    objective: "3.1.16"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Forty developers use Cloud Workstations from the configuration `web-ide` (cluster `dev-us`, region `us-central1`). They complain that it takes several minutes each morning before their workstation is ready. Workstations must keep stopping after two hours without user traffic, and the budget allows paying for a few extra VMs.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Update `web-ide` with `--idle-timeout=0` so that workstations are already running each morning" } }
        - { id: b, text: { en: "Update `web-ide` with `--pool-size=5` so that a pool of pre-started VMs is kept" } }
        - { id: c, text: { en: "Update `web-ide` with `--pd-reclaim-policy=retain` so that home disks are reused at startup" } }
        - { id: d, text: { en: "Update `web-ide` with `--running-timeout=0` so that sessions are not limited in duration" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The quick start pool of a workstation configuration keeps a number of VMs in a pre-started state, so that a workstation starts faster. The project is billed for these pooled VMs, which the budget allows, and the idle timeout of two hours stays in place.
      options:
        a: { en: "An idle timeout of 0 means workstations never stop for idleness, which breaks the rule that they stop after two hours without traffic." }
        c: { en: "The reclaim policy only decides whether the persistent disk is kept when a workstation is deleted; it does not shorten startup." }
        d: { en: "The running timeout limits how long a workstation runs after it starts; disabling it does nothing for the time a stopped workstation needs to start." }
    references:
      - title: Create a workstation configuration
        url: https://docs.cloud.google.com/workstations/docs/create-configuration

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-33-04
    objective: "3.1.13"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The Compute Engine VM `render-2` runs on `n1-standard-8` in a zone that offers NVIDIA T4 GPUs, with a 100 GB boot disk and the default host maintenance policy, which live migrates the VM. The team now needs one T4 GPU on this same VM, and the project has GPU quota in the region.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Edit the running VM to add one T4 GPU, then restart it during the next maintenance window to load the GPU" } }
        - { id: b, text: { en: "Stop the VM, change its machine type to `g2-standard-8`, start it, and then install the NVIDIA drivers" } }
        - { id: c, text: { en: "Stop the VM, add one T4 GPU, keep live migration so that it survives host events, and then start it" } }
        - { id: d, text: { en: "Stop the VM, set host maintenance to terminate, add one T4 GPU, start it, and then install the NVIDIA drivers" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          GPUs can be added to an existing N1 VM only while it is stopped. VMs with GPUs cannot live migrate because they are bound to specific hardware, so the host maintenance policy must be set to terminate the VM. After the VM starts, the NVIDIA drivers must be installed for workloads to use the GPU.
      options:
        a: { en: "The GPU configuration of a VM cannot be changed while it runs; the VM must be stopped first." }
        b: { en: "A G2 machine type comes with NVIDIA L4 GPUs, not the T4 GPU that the team needs." }
        c: { en: "A VM with a GPU cannot live migrate, so its host maintenance policy must be set to terminate." }
    references:
      - title: Add or remove GPUs
        url: https://docs.cloud.google.com/compute/docs/gpus/add-remove-gpus

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-33-05
    objective: "3.1.14"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A retailer retires its returns agent, deployed to Agent Runtime as `projects/shop-ai/locations/us-central1/reasoningEngines/7781`. Over the last year, the agent stored user sessions and memories. A developer must remove the agent together with these child resources in one call from the Agent Platform SDK.

        Which call should the developer make?
    body:
      options:
        - { id: a, text: { en: "`client.runtimes.update(name=RESOURCE_NAME, config={\"max_instances\": 0})`" } }
        - { id: b, text: { en: "`client.runtimes.delete(name=RESOURCE_NAME, force=True)`" } }
        - { id: c, text: { en: "`client.runtimes.update(name=RESOURCE_NAME, config={\"min_instances\": 0})`" } }
        - { id: d, text: { en: "`gcloud run services delete returns-agent --region=us-central1`" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The SDK's `delete` method removes a deployed agent by its resource name. Setting `force=True` is the option for an agent that still has resources such as sessions and memory, so that they are deleted with it in the same call.
      options:
        a: { en: "The maximum number of instances must be between 1 and 1,000, and changing scaling settings never deletes the agent or its sessions." }
        c: { en: "Setting the minimum instances to 0 only lets the agent scale down; the agent, its sessions and its memories remain." }
        d: { en: "An agent on Agent Runtime is a `reasoningEngines` resource of Agent Platform, not a Cloud Run service, so Cloud Run commands do not manage it." }
    references:
      - title: Manage deployed agents
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-deployed-agents
      - title: Deploy an agent
        url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-33-06
    objective: "3.1.12"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The Cloud Run service `quotes` in `us-east1` has a service-level maximum of 20 instances. Its traffic is split 95% to the stable revision and 5% to the canary revision `quotes-00031-vex`, which was deployed with `--max-instances=4`. During peaks, the canary returns "no available container instances" errors while the whole service runs only 12 instances. The canary needs up to 3 instances at peak, it must keep exactly 5% of the traffic, and both revisions must keep autoscaling.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud run services update quotes --region=us-east1 --max=60`." } }
        - { id: b, text: { en: "Redeploy the canary image with `--max-instances=10`, and keep the 95/5 traffic split." } }
        - { id: c, text: { en: "Run `gcloud run services update-traffic quotes --region=us-east1 --to-revisions=quotes-00031-vex=15`." } }
        - { id: d, text: { en: "Run `gcloud run services update quotes --region=us-east1 --scaling=20`." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The service-level maximum is divided among the revisions that receive traffic, in proportion to their traffic share: 5% of 20 gives the canary a single instance. The effective limit of a revision is the lower of its share and its own revision-level maximum, so raising the service maximum to 60 gives the canary min(3, 4) = 3 instances without changing the split.
      options:
        b: { en: "The lower value wins: a revision maximum of 10 is still capped by the canary's 5% share of the service maximum, which stays at one instance." }
        c: { en: "Giving the canary 15% of the traffic would provide 3 instances, but the canary must keep exactly 5% of the traffic." }
        d: { en: "`--scaling=20` switches the service to manual scaling with a fixed instance count, so the revisions stop autoscaling." }
    references:
      - title: Set maximum instances for services
        url: https://docs.cloud.google.com/run/docs/configuring/max-instances

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-33-07
    objective: "3.1.11"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The Cloud Run service `ledger-api` in `europe-west4` sends all its traffic to revision `ledger-api-00020-sol`. A pipeline has just deployed revision `ledger-api-00021-kap` with `--no-traffic --tag=candidate`. You must send 10% of the traffic to `ledger-api-00021-kap` and 90% to `ledger-api-00020-sol`. During the test, hotfix revisions may be deployed, and they must not receive any traffic until you assign it explicitly.

        Which two commands each meet these requirements? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "`gcloud run services update-traffic ledger-api --region=europe-west4 --to-revisions=ledger-api-00021-kap=10`" } }
        - { id: b, text: { en: "`gcloud run services update-traffic ledger-api --region=europe-west4 --to-revisions=LATEST=10,ledger-api-00020-sol=90`" } }
        - { id: c, text: { en: "`gcloud run services update-traffic ledger-api --region=europe-west4 --update-tags=candidate=ledger-api-00021-kap`" } }
        - { id: d, text: { en: "`gcloud run services update-traffic ledger-api --region=europe-west4 --to-revisions=ledger-api-00021-kap=10,ledger-api-00020-sol=90`" } }
        - { id: e, text: { en: "`gcloud run services update-traffic ledger-api --region=europe-west4 --to-revisions=LATEST=10`" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Listing both revisions with percentages that total 100 sets the split explicitly. When the assignments total less than 100, gcloud gives the named revision its percentage and scales the revisions that already serve traffic proportionally, so `ledger-api-00020-sol` drops from 100% to 90%. Both commands pin the traffic to named revisions, so a later hotfix revision receives nothing.
      options:
        b: { en: "`LATEST` follows the latest ready revision: today it is `ledger-api-00021-kap`, but the 10% would move to the first hotfix revision deployed during the test." }
        c: { en: "Changing tags never changes traffic percentages; the candidate revision would still receive 0% of the traffic." }
        e: { en: "This gives the right split today, but `LATEST` keeps sending 10% to the newest ready revision, so a hotfix revision would take the canary's traffic." }
    references:
      - title: gcloud run services update-traffic
        url: https://docs.cloud.google.com/sdk/gcloud/reference/run/services/update-traffic
      - title: Rollbacks, gradual rollouts, and traffic migration
        url: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-33-08
    objective: "3.1.13"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A media company runs the Cloud Run service `captioner` in `us-central1`, with one NVIDIA L4 GPU, 4 CPUs and 16 GiB of memory per instance, and the default GPU settings. The service processes batch captioning requests: if a zone fails, the requests can wait until capacity is available again. Finance asks you to lower the cost per GPU second without changing the GPU model or the maximum number of instances.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Run `gcloud run services update captioner --region=us-central1 --gpu=0.5`." } }
        - { id: b, text: { en: "Run `gcloud run services update captioner --region=us-central1 --cpu-throttling`." } }
        - { id: c, text: { en: "Run `gcloud run services update captioner --region=us-central1 --cpu=2 --memory=8Gi`." } }
        - { id: d, text: { en: "Run `gcloud run services update captioner --region=us-central1 --no-gpu-zonal-redundancy`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          GPU zonal redundancy is turned on by default: Cloud Run reserves GPU capacity in several zones of the region, at a higher cost per GPU second. Turning it off lowers that cost, and failover after a zone failure becomes best effort, which this batch workload accepts.
      options:
        a: { en: "Fractional GPUs are a Preview feature that applies to the RTX PRO 6000 GPU; the L4 GPU does not support them." }
        b: { en: "Cloud Run GPUs require instance-based billing, so request-based billing (CPU throttling) cannot be used with a GPU." }
        c: { en: "An L4 GPU requires at least 4 CPUs and 16 GiB of memory per instance, so this update is rejected." }
    references:
      - title: Configure GPU for Cloud Run services
        url: https://docs.cloud.google.com/run/docs/configuring/services/gpu

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-33-09
    objective: "3.1.15"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A data scientist's Agent Platform Workbench instance `genomics-1` in `us-central1-a` runs on `n1-standard-8` with one NVIDIA T4 GPU. A new model needs two GPUs and about 50 GB of memory, and its code is tuned for T4 GPUs. The zone offers T4 and L4 GPUs, and the project has quota for both. The instance must be kept, with its disks and environment, and the data scientist is not using it today.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Run `gcloud workbench instances update genomics-1 --location=us-central1-a --machine-type=g2-standard-24 --accelerator-type=NVIDIA_L4 --accelerator-core-count=2`." } }
        - { id: b, text: { en: "Run `gcloud workbench instances stop genomics-1 --location=us-central1-a`." } }
        - { id: c, text: { en: "Run `gcloud workbench instances upgrade genomics-1 --location=us-central1-a`." } }
        - { id: d, text: { en: "Run `gcloud workbench instances update genomics-1 --location=us-central1-a --machine-type=n1-highmem-8 --accelerator-type=NVIDIA_TESLA_T4 --accelerator-core-count=2`." } }
        - { id: e, text: { en: "Run `gcloud workbench instances reset genomics-1 --location=us-central1-a`." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The machine type and GPUs of a Workbench instance can be changed only while the instance is shut down, so you stop it first. You then update it in place to `n1-highmem-8` (8 vCPUs, 52 GB of memory) with two T4 GPUs, which keeps its disks and environment, and start it again afterwards.
      options:
        a: { en: "Changing between a G2 and a non-G2 machine type is not supported for a Workbench instance, and the code is tuned for T4 GPUs, not L4." }
        c: { en: "Upgrading moves the instance to a newer environment version; it does not change the machine type or the GPUs." }
        e: { en: "Resetting restarts the instance's VM; it does not change its hardware configuration." }
    references:
      - title: Change machine type and configure GPUs of an Agent Platform Workbench instance
        url: https://docs.cloud.google.com/vertex-ai/docs/workbench/instances/change-machine-type

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-33-10
    objective: "3.1.16"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A bank's security team requires that the VMs of the Cloud Workstations configuration `py-ide` (cluster `fin-eu`, region `europe-west1`) have no external IP addresses. Developers must still install Python packages from the public PyPI repository from their workstations. Private Google Access is already enabled on the cluster's subnet, the VPC has the implied firewall rules only, and there is no Cloud NAT gateway.

        Which two actions should you take? Choose two.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a VPC firewall rule that allows egress on TCP port 443 to `0.0.0.0/0` from the workstation VMs." } }
        - { id: b, text: { en: "Create a Cloud Router with a Public NAT gateway for the cluster's subnet in `europe-west1`." } }
        - { id: c, text: { en: "Create a Private Service Connect endpoint for Google APIs in the cluster's VPC network." } }
        - { id: d, text: { en: "Run `gcloud workstations configs update py-ide --cluster=fin-eu --region=europe-west1 --disable-public-ip-addresses`." } }
        - { id: e, text: { en: "Set a service account on `py-ide` that has the Compute Network User role on the cluster's subnet." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Workstation VMs get public IP addresses unless the configuration sets `--disable-public-ip-addresses`. Without them, the VMs need Private Google Access or Cloud NAT, and PyPI is on the internet, not a Google API, so a Public NAT gateway on a Cloud Router gives the VMs outbound internet access without external addresses.
      options:
        a: { en: "Egress is already allowed by the implied rule; a firewall rule gives no path to the internet to a VM without an external IP address." }
        c: { en: "A Private Service Connect endpoint for Google APIs reaches Google services only, like Private Google Access; PyPI stays unreachable." }
        e: { en: "IAM roles on the subnet do not give internet access, and the configuration still assigns public IP addresses." }
    references:
      - title: Create a workstation configuration
        url: https://docs.cloud.google.com/workstations/docs/create-configuration
      - title: Cloud NAT overview
        url: https://docs.cloud.google.com/nat/docs/overview
