chapter: 23-storage-data
questions:
  # ------------------------------------------------------------------ 1
  - id: gcpace-qz-23-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A fitness startup is building Android, iOS and web apps that store each user's workouts as documents. The apps must keep working without a network connection and sync local changes when the device is back online. The team doesn't want to provision or size any database capacity.

        Which database should the team use?
    body:
      options:
        - { id: a, text: { en: "Bigtable, with one table per user and a row key that starts with the workout date" } }
        - { id: b, text: { en: "Cloud SQL for PostgreSQL, with a table of workouts and read replicas for the apps" } }
        - { id: c, text: { en: "Memorystore for Valkey, with one key per workout and persistence enabled" } }
        - { id: d, text: { en: "Firestore in Native mode, with one collection of workout documents per user" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Firestore is a serverless document database that scales automatically without capacity planning. Its Android, Apple and web client libraries cache the data that the app uses, so the app keeps working offline, and they sync local changes to the backend when the device reconnects.
      options:
        a: { en: "Bigtable needs nodes sized by the team, has no offline sync for mobile clients, and a row key that starts with a date creates hotspots." }
        b: { en: "Cloud SQL instances must be sized and managed, and mobile apps can't keep working offline against them without custom sync code." }
        c: { en: "Memorystore is an in-memory cache reached from a VPC network, not a document database that mobile apps use directly with offline sync." }
    references:
      - title: Enable offline data
        url: https://docs.cloud.google.com/firestore/native/docs/manage-data/enable-offline
      - title: Firestore overview
        url: https://docs.cloud.google.com/firestore/native/docs/overview

  # ------------------------------------------------------------------ 2
  - id: gcpace-qz-23-02
    objective: "2.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An insurer copies VM exports to a new Cloud Storage bucket for disaster recovery. Each copy is kept for two years, and the operations team reads it during the quarterly recovery test, about four times a year. You must pick the bucket's default storage class according to Google's guidance on access frequency, at the lowest cost.

        Which storage class should you choose?
    body:
      options:
        - { id: a, text: Standard }
        - { id: b, text: Nearline }
        - { id: c, text: Coldline }
        - { id: d, text: Archive }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Coldline is designed for data read or modified at most once a quarter, and its 90-day minimum storage duration is far below the two-year retention. It stores data for less than Standard or Nearline, and its retrieval fees stay low at four reads a year.
      options:
        a: { en: "Standard has no retrieval fee but the highest storage price, which is wasted on data read four times a year." }
        b: { en: "Nearline targets data read about once a month; for quarterly reads, Coldline's lower storage price makes it cheaper." }
        d: { en: "Archive is for data read less than once a year; four reads a year add retrieval fees that exceed its storage savings." }
    references:
      - title: Storage classes
        url: https://docs.cloud.google.com/storage/docs/storage-classes

  # ------------------------------------------------------------------ 3
  - id: gcpace-qz-23-03
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A marketing team wants the performance data of its Google Ads accounts loaded into a BigQuery dataset every day, so that analysts can join it with sales data. The team wants a managed, scheduled load and doesn't want to write or run any code.

        What should you do?
    body:
      options:
        - { id: a, text: { en: "Create a Storage Transfer Service job that copies the Google Ads data into BigQuery every day." } }
        - { id: b, text: { en: "Create a BigQuery Data Transfer Service transfer for Google Ads that runs every day." } }
        - { id: c, text: { en: "Write a Dataflow pipeline that reads the Google Ads data every day and writes it to BigQuery." } }
        - { id: d, text: { en: "Run a daily cron job on a VM that exports the Google Ads data and then runs `bq load`." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The BigQuery Data Transfer Service automates scheduled, managed transfers into BigQuery from sources such as Google Ads, other Google services, SaaS applications and other clouds. A transfer is configured in the console, with `bq` or with the API, and needs no code.
      options:
        a: { en: "Storage Transfer Service copies files into Cloud Storage from other buckets, clouds or file systems; it doesn't load Google Ads data into BigQuery." }
        c: { en: "A Dataflow pipeline is code that the team must write and maintain, which the team wants to avoid." }
        d: { en: "A cron job on a VM means a server and an export script to maintain, which fails the no-code, managed requirement." }
    references:
      - title: Introduction to the BigQuery Data Transfer Service
        url: https://docs.cloud.google.com/bigquery/docs/dts-introduction

  # ------------------------------------------------------------------ 4
  - id: gcpace-qz-23-04
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A broadcaster stores masters in a dual-region bucket with turbo replication between europe-west1 and europe-west4. Object Versioning is disabled, and the soft delete settings were left at their defaults. An hour ago, a script error deleted 300 objects from the bucket, and the team hopes the copies in the other region are still there.

        Which statement about the deleted objects is true?
    body:
      options:
        - { id: a, text: { en: "They remain readable in the second region for 12 hours, the longest delay of default replication." } }
        - { id: b, text: { en: "They remain readable in the second region for 15 minutes, the recovery point objective of turbo replication." } }
        - { id: c, text: { en: "They are gone from both regions and can't be recovered, because Object Versioning is disabled on the bucket." } }
        - { id: d, text: { en: "They are gone from both regions, but they can be restored as soft-deleted objects within the retention period." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A dual-region bucket is one bucket: deleting an object removes it from the bucket in both regions, so replication doesn't protect against deletions. Soft delete is on by default for new buckets with a 7-day retention, so the deleted objects can be restored during that period. Replication must be combined with protections such as soft delete or Object Versioning.
      options:
        a: { en: "Replication copies new writes between the regions; it doesn't keep deleted objects readable in either region." }
        b: { en: "Turbo replication shortens the time to copy new objects; a deletion isn't delayed, and the object isn't kept in the other region." }
        c: { en: "Soft delete works without Object Versioning and keeps deleted objects for 7 days by default, so they can still be restored." }
    references:
      - title: Soft delete overview
        url: https://docs.cloud.google.com/storage/docs/soft-delete

  # ------------------------------------------------------------------ 5
  - id: gcpace-qz-23-05
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You must create a Cloud SQL for PostgreSQL instance in europe-west1 that has only a private IP address in the VPC network prod-vpc. No Google-managed service has been connected to prod-vpc yet, and the Service Networking API is enabled. You will create the instance with `--network=prod-vpc --no-assign-ip`.

        What should you do first?
    body:
      options:
        - { id: a, text: { en: "Enable Private Google Access on the europe-west1 subnet of prod-vpc so that Cloud SQL can place the instance in it." } }
        - { id: b, text: { en: "Create a Cloud Router and a Cloud NAT gateway for prod-vpc in europe-west1 so that the instance gets a private address." } }
        - { id: c, text: { en: "Allocate a range with `gcloud compute addresses create --global --purpose=VPC_PEERING`, then run `gcloud services vpc-peerings connect`." } }
        - { id: d, text: { en: "Create a peering between prod-vpc and the project's default network with `gcloud compute networks peerings create`." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A private IP Cloud SQL instance needs private services access on the network first. You allocate an internal IP range with the `VPC_PEERING` purpose, then create the private connection to `servicenetworking.googleapis.com` with `gcloud services vpc-peerings connect`. Cloud SQL then takes the instance's address from that range.
      options:
        a: { en: "Private Google Access lets VMs without external IPs reach Google APIs; it doesn't give Cloud SQL a range or a connection in prod-vpc." }
        b: { en: "Cloud NAT translates outbound traffic of VMs to the internet; it plays no part in assigning a private IP to a Cloud SQL instance." }
        d: { en: "Cloud SQL instances run in a Google-managed service producer network; peering prod-vpc with another of your networks doesn't reach it." }
    references:
      - title: Configure private services access
        url: https://docs.cloud.google.com/sql/docs/mysql/configure-private-services-access

  # ------------------------------------------------------------------ 6
  - id: gcpace-qz-23-06
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A media company needs a managed NFS share of 2 TiB for Compute Engine VMs in europe-west1, in the VPC network prod-vpc. The share must keep serving the VMs if one zone of the region fails.

        Which command should you run?
    body:
      options:
        - { id: a, text: "`gcloud filestore instances create media --location=europe-west1-b --tier=ZONAL --file-share=name=media,capacity=2TB --network=name=prod-vpc`" }
        - { id: b, text: "`gcloud filestore instances create media --location=europe-west1 --file-share=name=media,capacity=2TB --network=name=prod-vpc`" }
        - { id: c, text: "`gcloud filestore instances create media --location=europe-west1 --tier=REGIONAL --file-share=name=media,capacity=2TB --network=name=prod-vpc`" }
        - { id: d, text: "`gcloud filestore instances create media --location=europe-west1-b --tier=BASIC_SSD --file-share=name=media,capacity=2TB --network=name=prod-vpc`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Regional tier is designed for regional availability and resilience against zone outages, and it supports a 2 TiB share. A Regional instance is created in a region, so `--location` takes the region name.
      options:
        a: { en: "A Zonal instance lives in a single zone: it stops serving if europe-west1-b fails." }
        b: { en: "Without `--tier`, gcloud creates a Basic HDD instance, a legacy zonal tier that doesn't survive a zone failure." }
        d: { en: "Basic SSD is a legacy zonal tier with a 2.5 TiB minimum: 2 TiB is too small, and the share wouldn't survive a zone failure." }
    references:
      - title: About service tiers
        url: https://docs.cloud.google.com/filestore/docs/service-tiers
      - title: Create an instance
        url: https://docs.cloud.google.com/filestore/docs/creating-instances

  # ------------------------------------------------------------------ 7
  - id: gcpace-qz-23-07
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Every night, the objects of the bucket gs://example-partner-drop must be copied to gs://example-ingest. After each run, gs://example-ingest must match the source exactly, so objects removed from the source must also be removed from the destination, and the source must never be modified. The team wants a managed service and no VM to run. Permissions are already in place.

        What should you do?
    body:
      options:
        - { id: a, text: "`gcloud transfer jobs create gs://example-partner-drop gs://example-ingest --schedule-repeats-every=1d`" }
        - { id: b, text: "`gcloud transfer jobs create gs://example-partner-drop gs://example-ingest --schedule-repeats-every=1d --delete-from=source-after-transfer`" }
        - { id: c, text: "`gcloud transfer jobs create gs://example-partner-drop gs://example-ingest --schedule-repeats-every=1d --delete-from=destination-if-unique`" }
        - { id: d, text: "A nightly cron job on a VM that runs `gcloud storage rsync -r --delete-unmatched-destination-objects gs://example-partner-drop gs://example-ingest`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A Storage Transfer Service job is managed and needs no VM, and `--schedule-repeats-every=1d` runs it every day. `--delete-from=destination-if-unique` deletes objects from the destination when they're no longer at the source, so the destination matches the source after each run without touching it.
      options:
        a: { en: "By default a transfer job deletes nothing, so objects removed from the source would stay in gs://example-ingest." }
        b: { en: "`source-after-transfer` deletes the source objects once they're copied, which modifies the partner's bucket." }
        d: { en: "The rsync command mirrors the buckets, but it needs a VM to run and maintain, which the team doesn't want." }
    references:
      - title: gcloud transfer jobs create
        url: https://docs.cloud.google.com/sdk/gcloud/reference/transfer/jobs/create

  # ------------------------------------------------------------------ 8
  - id: gcpace-qz-23-08
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A QA team needs a Spanner instance in us-central1 for automated integration tests against a few gigabytes of data. The tests use no read-only replicas and no dual-region or multi-region features. You must minimize both the compute capacity and the edition cost.

        Which command should you run?
    body:
      options:
        - { id: a, text: "`gcloud spanner instances create qa --config=regional-us-central1 --description=QA --edition=STANDARD --nodes=1`" }
        - { id: b, text: "`gcloud spanner instances create qa --config=regional-us-central1 --description=QA --edition=STANDARD --processing-units=50`" }
        - { id: c, text: "`gcloud spanner instances create qa --config=regional-us-central1 --description=QA --edition=ENTERPRISE_PLUS --processing-units=100`" }
        - { id: d, text: "`gcloud spanner instances create qa --config=regional-us-central1 --description=QA --edition=STANDARD --processing-units=100`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Spanner compute capacity can be set in processing units, where 1,000 PUs equal one node, and below 1,000 they are set in multiples of 100. 100 PUs is therefore the smallest instance. The Standard edition supports regional configurations and is the lowest edition, which fits tests that need no replicas or multi-region features.
      options:
        a: { en: "One node equals 1,000 processing units, ten times the capacity and the cost of the smallest possible instance." }
        b: { en: "Below 1,000, processing units must be a multiple of 100, so 50 is not a valid capacity." }
        c: { en: "Enterprise Plus is only needed for dual-region and multi-region configurations; it is a higher edition than these tests require." }
    references:
      - title: Compute capacity, nodes and processing units
        url: https://docs.cloud.google.com/spanner/docs/compute-capacity
      - title: Spanner editions overview
        url: https://docs.cloud.google.com/spanner/docs/editions-overview

  # ------------------------------------------------------------------ 9
  - id: gcpace-qz-23-09
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The Spanner instance ledger uses the Standard edition in the regional-us-central1 configuration with 500 processing units set manually. It has no backups and no CMEK-enabled databases. The instance must now keep serving reads and writes during a regional outage by using the nam3 multi-region configuration. The applications must keep using the instance ID ledger, and the change must cause no downtime.

        Which three actions should you take? Choose three.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Run `gcloud spanner instances update ledger --edition=ENTERPRISE`." } }
        - { id: b, text: { en: "Run `gcloud spanner instances update ledger --edition=ENTERPRISE_PLUS`." } }
        - { id: c, text: { en: "Run `gcloud spanner instances update ledger --processing-units=1000`." } }
        - { id: d, text: { en: "Run `gcloud spanner instances move ledger --target-config=nam3`." } }
        - { id: e, text: { en: "Back up each database, and restore the backups into a new nam3 instance." } }
        - { id: f, text: { en: "Export the databases with Dataflow, and import them into a new nam3 instance." } }
    answer: { optionIds: [b, c, d] }
    explanation:
      correct:
        en: |
          Moving an instance to another configuration keeps its ID and causes no downtime. A Standard edition instance can't move directly from a regional to a multi-region configuration: it must first be upgraded to Enterprise Plus, an upgrade with zero downtime. The move also requires at least 1 node (1,000 processing units), so the 500 PUs must be raised first.
      options:
        a: { en: "The Enterprise edition supports regional configurations only; multi-region configurations require Enterprise Plus." }
        e: { en: "A new instance needs a new ID, and writes after the backups would be lost or would require downtime until the switch." }
        f: { en: "Export and import create a new instance with another ID and require stopping writes during the copy, which is downtime." }
    references:
      - title: Move an instance
        url: https://docs.cloud.google.com/spanner/docs/move-instance
      - title: Spanner editions overview
        url: https://docs.cloud.google.com/spanner/docs/editions-overview

  # ------------------------------------------------------------------ 10
  - id: gcpace-qz-23-10
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A delivery app stores its data in the Firestore Native mode database `(default)`, located in us-east1. Management now requires the 99.999% monthly uptime commitment of a Firestore multi-region location in the United States. A maintenance window of a few hours without writes is acceptable, and the app can be reconfigured to use a new database ID, orders-mr.

        Which three actions should you take? Choose three.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Run `gcloud firestore databases create --database=orders-mr --location=nam5 --type=firestore-native`." } }
        - { id: b, text: { en: "Run `gcloud firestore databases update --database='(default)' --enable-pitr` to protect the data." } }
        - { id: c, text: { en: "During the window, run `gcloud firestore export gs://example-fs-moves --database='(default)'`." } }
        - { id: d, text: { en: "Create a backup schedule, and restore the latest backup into orders-mr in nam5 with `gcloud firestore databases restore`." } }
        - { id: e, text: { en: "Import the export with `gcloud firestore import gs://example-fs-moves/EXPORT_PREFIX/ --database=orders-mr`." } }
        - { id: f, text: { en: "Create a database in us-west1, and run a Cloud Run job that copies the changed documents to it every hour." } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          A Firestore database's location can't be changed after it is created, so a new database is needed in a multi-region location such as nam5, which carries the 99.999% commitment. Data exported from one Firestore database can be imported into another: export `(default)` to Cloud Storage during the window, import it into orders-mr, then point the app at the new database.
      options:
        b: { en: "Point-in-time recovery protects against accidental writes and deletions; the database stays in us-east1 with the regional 99.99% commitment." }
        d: { en: "A backup resides in the source database's location, and a restore creates the new database in that same location, not in nam5." }
        f: { en: "Two regional databases each keep the regional 99.99% commitment, and the copy job is custom code to maintain, not multi-region replication." }
    references:
      - title: Locations
        url: https://docs.cloud.google.com/firestore/native/docs/locations
      - title: Exporting and importing data
        url: https://docs.cloud.google.com/firestore/native/docs/manage-data/export-import
