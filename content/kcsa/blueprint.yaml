# KCSA — Kubernetes and Cloud Native Security Associate (CNCF, exam run by The Linux Foundation)
# Sources (checked on 2026-11-23):
#   - Certification page: https://training.linuxfoundation.org/certification/kubernetes-and-cloud-native-security-associate-kcsa/
#     (online, proctored, multiple choice, 90 minutes, beginner level, no prerequisite, 250 USD,
#     one retake included, 12 months to take the exam, certification valid 2 years; domains and
#     competencies with weights 14/22/22/16/16/10 %).
#   - Curriculum: "KCSA Curriculum.pdf" in github.com/cncf/curriculum (master, raw file read; 3 pages).
#     No version number printed and no Kubernetes version stated; PDF last modified 2024-06-24
#     (same date as its last commit). It lists domains and competency names only (see
#     objectives.yaml). kcsa/README.md in the same repository shows a different domain table;
#     the PDF and the LF page agree with each other and are followed.
#   - Multiple Choice Exams, Important Instructions and FAQ (docs.linuxfoundation.org/tc-docs/
#     certification/important-instructions-mc and faq-mc): 60 multiple-choice questions,
#     90 minutes, pass at 75 % or above, results emailed within 24 hours; passing CKS renews KCSA.
#   - Exam languages (docs.linuxfoundation.org/tc-docs/certification/lf-handbook2/language):
#     KCSA is offered in English only (no French).
# No published source mentions multiple-answer questions: single answer only.
# Version: neither a curriculum version nor the Kubernetes version of the KCSA exam is published.
# blueprint.version = 'v1.37', the latest Kubernetes minor release on kubernetes.io/releases on
# 2026-11-23 and the version of the current CKA/CKAD/CKS curricula (same choice as KCNA).
# Content is written for Kubernetes v1.37.
# Exam facts: 60 single-answer multiple-choice questions, 90 minutes, pass at 75 %, score shown
# as a percentage (maxScore 100). No case study, no series.
# Readiness and progression: the AZ-900 rules, with every score threshold divided by 10 because
# the score here is out of 100, not 1,000 (800 -> 80, 650 -> 65, scale 600–850 -> 60–85,
# xp.scoreFrom 400 -> 40 and perPoint 0.5 -> 5 for the same XP, domainGain 50 -> 5,
# mastery 650/700/850 -> 65/70/85, hatTrick min 800 -> 80, comeback gain 150 -> 15), as KCNA.
# active: false until the bank and the course are reviewed and published.
certification:
  code: kcsa
  title: Kubernetes and Cloud Native Security Associate
  vendor: CNCF
  languages: [en]
  active: false
blueprint:
  version: 'v1.37'
  durationMin: 90
  questionCount:
    min: 60
    max: 60
  passScore: 75
  maxScore: 100
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing
  # The real exam has only single-answer multiple-choice questions.
  typeMix:
    single:
      min: 1
      max: 1
  difficultyMix:
    easy: 0.4
    medium: 0.45
    hard: 0.15
  structure:
    caseStudies:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
      placement: end
    series:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
    maxPerObjective: 2
    warningsMin:
    - 10
    - 5
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 80
      domainFloor: 65
      recent: 3
      window: 5
      scale:
        from: 60
        to: 85
      weights:
        level: 0.5
        consistency: 0.2
        domains: 0.2
        freshness: 0.1
      bands:
        progressing: 50
        almost: 70
        ready: 85
      freshness:
        staleDays: 30
        zeroDays: 90
        minNewShare: 0.5
    progression:
      xp:
        base: 50
        scoreFrom: 40
        perPoint: 5
        knownShare: 0.5
        passBonus: 100
        bestBonus: 75
        domainBonus: 50
        domainGain: 5
      levels:
      - xp: 0
        title:
          en: Security curious
      - xp: 150
        title:
          en: Namespace novice
      - xp: 400
        title:
          en: Pod hardener
      - xp: 750
        title:
          en: RBAC apprentice
      - xp: 1200
        title:
          en: Policy enforcer
      - xp: 1750
        title:
          en: Secrets keeper
      - xp: 2400
        title:
          en: Supply chain guardian
      - xp: 3150
        title:
          en: Threat modeler
      - xp: 4000
        title:
          en: Cluster defender
      - xp: 5000
        title:
          en: Cloud native sentinel
      mastery:
        bronze: 65
        silver: 70
        gold: 85
      badges:
        hatTrick:
          count: 3
          min: 80
        regular:
          weeks: 4
        comeback:
          gain: 15
domains:
- code: overview
  order: 1
  weight:
    min: 0.14
    max: 0.14
  title:
    en: Overview of Cloud Native Security
- code: components
  order: 2
  weight:
    min: 0.22
    max: 0.22
  title:
    en: Kubernetes Cluster Component Security
- code: fundamentals
  order: 3
  weight:
    min: 0.22
    max: 0.22
  title:
    en: Kubernetes Security Fundamentals
- code: threats
  order: 4
  weight:
    min: 0.16
    max: 0.16
  title:
    en: Kubernetes Threat Model
- code: platform
  order: 5
  weight:
    min: 0.16
    max: 0.16
  title:
    en: Platform Security
- code: compliance
  order: 6
  weight:
    min: 0.1
    max: 0.1
  title:
    en: Compliance and Security Frameworks
