id: kcsa-2c-tokenrequest-for-users
objective: "2.10.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To avoid running an identity provider, a team proposes to create one ServiceAccount per engineer and to hand out tokens created with the TokenRequest API (`kubectl create token`) for daily `kubectl` access. What does the Kubernetes hardening guide say about this approach?
body:
  options:
    - id: a
      text: { en: "It is the recommended method for people, because the tokens are bound and short-lived" }
    - id: b
      text: { en: "It is acceptable only if the tokens are stored in a Secret of type `kubernetes.io/service-account-token`" }
    - id: c
      text: { en: "It is not recommended for users: tokens cannot be revoked and are hard to distribute safely" }
    - id: d
      text: { en: "It is not possible, because TokenRequest tokens work only inside Pods" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The hardening guide states that the TokenRequest API is not generally recommended for user authentication, because there is no revocation method and distributing credentials to users securely is challenging. For services, it recommends short token lifetimes. People should use an external identity source such as OIDC.
  options:
    a:
      en: |
        Short lifetimes help, but the guide still advises against TokenRequest tokens for people, and ServiceAccounts cannot be added to arbitrary groups.
    b:
      en: |
        Secret-based ServiceAccount tokens are the legacy form: they have no expiry and can be read by anyone who can read Secrets in the namespace, which is worse.
    d:
      en: |
        A TokenRequest token is a bearer token that works from any client that can reach the API server, which is also why a leaked token is dangerous.
references:
  - title: "Hardening Guide - Authentication Mechanisms"
    url: https://kubernetes.io/docs/concepts/security/hardening-guide/authentication-mechanisms/
