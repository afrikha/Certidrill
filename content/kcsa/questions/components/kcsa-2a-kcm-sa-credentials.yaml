id: kcsa-2a-kcm-sa-credentials
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want each controller in kube-controller-manager to run under its own identity, authorized by its own `system:controller:` role, instead of sharing one broad credential. Which flag should you set?
body:
  options:
    - id: a
      text: { en: "`--leader-elect=true`" }
    - id: b
      text: { en: "`--controllers=*`" }
    - id: c
      text: { en: "`--use-service-account-credentials=true`" }
    - id: d
      text: { en: "`--root-ca-file=/etc/kubernetes/pki/ca.crt`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `--use-service-account-credentials`, kube-controller-manager starts each controller with a separate ServiceAccount, authorized by the matching `system:controller:` ClusterRole. Without it, all control loops run with the controller manager's own credential, which must then hold every controller's permissions. The Kubernetes security checklist lists this flag.
  options:
    a:
      en: |
        Leader election makes only one replica active in a highly available control plane. It is an availability feature and does not change identities.
    b:
      en: |
        `--controllers` chooses which controllers are enabled. `*` enables all on-by-default controllers, still under one identity.
    d:
      en: |
        `--root-ca-file` sets the CA bundle placed in ServiceAccount token Secrets. It does not give controllers separate credentials.
references:
  - title: kube-controller-manager
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager/
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
