id: kcsa-2a-noexecute-evict
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A node may be compromised. You want to evict the running Pods that do not tolerate a new taint and keep new Pods from being scheduled there. What should you apply to the node?
body:
  options:
    - id: a
      text: { en: "A taint with the `NoSchedule` effect" }
    - id: b
      text: { en: "A taint with the `PreferNoSchedule` effect" }
    - id: c
      text: { en: "A taint with the `NoExecute` effect" }
    - id: d
      text: { en: "`kubectl cordon` on the node" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `NoExecute` affects Pods already running on the node: those that do not tolerate the taint are evicted immediately, and new Pods without a matching toleration are not scheduled there. Pods that tolerate it can stay, for `tolerationSeconds` if they set it.
  options:
    a:
      en: |
        `NoSchedule` keeps new Pods away but explicitly does not evict Pods that are already running on the node.
    b:
      en: |
        `PreferNoSchedule` is a soft version of `NoSchedule`: the scheduler only tries to avoid the node, and running Pods are not evicted.
    d:
      en: |
        Cordoning marks the node unschedulable for new Pods, but it does not evict the Pods that are already running.
references:
  - title: Taints and Tolerations
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
