id: kcsa-2a-podsecurity-disabled
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A kube-apiserver runs with `--disable-admission-plugins=PodSecurity`, and no other admission webhook or policy is configured. The namespace `shop` has the label `pod-security.kubernetes.io/enforce: restricted`. A user creates a Pod in `shop` whose container sets `privileged: true`. What happens?
body:
  options:
    - id: a
      text: { en: "The Pod is admitted, because nothing evaluates the namespace's Pod Security labels" }
    - id: b
      text: { en: "The Pod is rejected, because the namespace label enforces the Restricted profile by itself" }
    - id: c
      text: { en: "The Pod is rejected, because PodSecurityPolicy takes over when PodSecurity is disabled" }
    - id: d
      text: { en: "The Pod is admitted with a warning, because enforce mode falls back to warn mode" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      PodSecurity is enabled by default, but `--disable-admission-plugins` turns off plugins even if they are in the default set. The `pod-security.kubernetes.io/` namespace labels are only configuration for the PodSecurity admission plugin; with the plugin disabled, nothing checks the Pod against the Pod Security Standards and the privileged Pod is stored.
  options:
    b:
      en: |
        A label is just metadata on the namespace. It takes effect only through the PodSecurity admission plugin, which is disabled here.
    c:
      en: |
        PodSecurityPolicy was removed in Kubernetes v1.25. Nothing replaces PodSecurity automatically when it is disabled.
    d:
      en: |
        Warnings are also produced by the PodSecurity plugin, through the `warn` label. With the plugin disabled there is no enforcement, no warning and no audit annotation.
references:
  - title: Admission Control in Kubernetes
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
