id: kcsa-2c-cni-clusterwide-deny
objective: "2.9.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The cluster uses Cilium as its network plugin. The security team must block traffic from all Pods to a known malicious IP range, in every namespace, and no policy written by a namespace team may allow that traffic again. What should you use?
body:
  options:
    - id: a
      text: { en: "A default deny egress NetworkPolicy in every namespace" }
    - id: b
      text: { en: "A NetworkPolicy in each namespace whose egress `ipBlock` lists the range" }
    - id: c
      text: { en: "A ValidatingAdmissionPolicy that rejects Pods that connect to the range" }
    - id: d
      text: { en: "A CiliumClusterwideNetworkPolicy with a deny rule for the range" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The standard NetworkPolicy API is namespaced and allow-only: it cannot set cluster-wide defaults or explicitly deny traffic. Network plugins add their own policy resources for this. A CiliumClusterwideNetworkPolicy is not namespaced, and Cilium deny rules take precedence over allow rules from any Cilium or Kubernetes policy.
  options:
    a:
      en: |
        Default deny policies are a good baseline, but policies are additive: any team can add a policy that allows egress to the range again.
    b:
      en: |
        An `ipBlock` in an egress rule allows traffic. Policies are additive, so another team's policy could still allow the range.
    c:
      en: |
        Admission control checks API requests when objects are created. It never sees network connections made by running Pods.
references:
  - title: "Deny Policies"
    url: https://docs.cilium.io/en/stable/security/policy/deny/
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
