id: kcsa-2a-ccm-uninitialized-taint
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The kubelets and kube-controller-manager of a cluster run with `--cloud-provider=external`. Newly added nodes stay unschedulable and keep the taint `node.cloudprovider.kubernetes.io/uninitialized:NoSchedule`. What is the most likely cause?
body:
  options:
    - id: a
      text: { en: "The NodeRestriction admission plugin stops the kubelets from removing their own taints" }
    - id: b
      text: { en: "kube-scheduler is bound to `127.0.0.1` and cannot see the new nodes" }
    - id: c
      text: { en: "The new nodes do not have a toleration for the `uninitialized` taint" }
    - id: d
      text: { en: "cloud-controller-manager is not running, so nothing initializes the new nodes" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Components started with `--cloud-provider=external` add this taint to new nodes, marking them as needing a second initialization by the external cloud-controller-manager. Its node controller fills in cloud information and the taint is removed. If cloud-controller-manager is not available, new nodes are left unschedulable.
  options:
    a:
      en: |
        The taint is meant to be cleared through the cloud-controller-manager's initialization, not by the kubelet, so NodeRestriction is not what keeps it in place.
    b:
      en: |
        The bind address only controls where the scheduler's own HTTPS endpoint listens. The scheduler still watches nodes through the API server.
    c:
      en: |
        Tolerations are set on Pods, not on nodes. A node keeps its taint until something removes it.
references:
  - title: Cloud Controller Manager Administration
    url: https://kubernetes.io/docs/tasks/administer-cluster/running-cloud-controller/
