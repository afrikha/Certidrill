id: kcsa-2a-encryption-flag
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which kube-apiserver flag points to the configuration that encrypts Secrets before they are written to etcd?
body:
  options:
    - id: a
      text: { en: "`--etcd-cafile`" }
    - id: b
      text: { en: "`--tls-cert-file`" }
    - id: c
      text: { en: "`--service-account-key-file`" }
    - id: d
      text: { en: "`--encryption-provider-config`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `--encryption-provider-config` names an EncryptionConfiguration file that lists, per resource, the providers used to encrypt data at rest in etcd. Without it, Secrets are stored unencrypted. The file can contain keys, so only the user running kube-apiserver should be able to read it.
  options:
    a:
      en: |
        `--etcd-cafile` is the CA used to secure the connection between the API server and etcd. It protects data in transit, not data stored in etcd.
    b:
      en: |
        `--tls-cert-file` is the API server's serving certificate for HTTPS clients. It does not encrypt stored data.
    c:
      en: |
        `--service-account-key-file` holds the keys used to verify ServiceAccount tokens. It has nothing to do with encryption at rest.
references:
  - title: Encrypting Confidential Data at Rest
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
  - title: kube-apiserver
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
