id: kcsa-2c-csi-driver-role
objective: "2.11.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which component lets a storage vendor expose its storage system, with features such as backend encryption, to Kubernetes workloads without adding code to the Kubernetes repository?
body:
  options:
    - id: a
      text: { en: "A CNI plugin" }
    - id: b
      text: { en: "A container runtime that implements the CRI" }
    - id: c
      text: { en: "A CSI driver" }
    - id: d
      text: { en: "An in-tree volume plugin compiled into Kubernetes" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Container Storage Interface (CSI) defines a standard interface for exposing arbitrary storage systems to container workloads. CSI drivers are out-of-tree plugins, so storage vendors ship them without adding source code to the Kubernetes repository. A StorageClass names the driver as its provisioner and passes it the driver-specific parameters, such as encryption options.
  options:
    a:
      en: |
        A CNI plugin implements the Pod network, not storage.
    b:
      en: |
        The Container Runtime Interface connects the kubelet to the container runtime that runs containers; it does not provision volumes.
    d:
      en: |
        In-tree plugins are code inside the Kubernetes repository, the opposite of what is asked; Kubernetes has been migrating them to CSI drivers.
references:
  - title: "Volumes"
    url: https://kubernetes.io/docs/concepts/storage/volumes/
