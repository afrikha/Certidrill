id: kcsa-2a-ccm-node-controller
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are narrowing the RBAC rules of a cloud-controller-manager that was deployed with `cluster-admin`. Which of its controllers needs full access to Node objects, including deleting them?
body:
  options:
    - id: a
      text: { en: "The route controller" }
    - id: b
      text: { en: "The node controller" }
    - id: c
      text: { en: "The service controller" }
    - id: d
      text: { en: "None: it only reads Node objects" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The node controller updates Node objects with cloud information such as identifiers, labels and addresses, and deletes a Node object when the cloud reports that its server was deleted. It therefore needs full read and write access to Nodes. The other controllers need much less.
  options:
    a:
      en: |
        The route controller configures cloud routes between nodes. It only needs to `get` Node objects.
    c:
      en: |
        The service controller manages cloud load balancers. It needs access to Services and their status, not write access to Nodes.
    d:
      en: |
        The node controller must create, update, patch and delete Node objects, so read-only access would break node initialization and cleanup.
references:
  - title: Cloud Controller Manager
    url: https://kubernetes.io/docs/concepts/architecture/cloud-controller/
