id: kcsa-2c-etcd-client-cert-auth
objective: "2.8.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp runs etcd for its Kubernetes cluster on dedicated hosts. The client port already uses TLS through `--cert-file` and `--key-file`. You must ensure that only clients that present a certificate signed by a trusted certificate authority can connect to the client port. Which etcd settings should you add?
body:
  options:
    - id: a
      text: { en: "`--auto-tls=true`" }
    - id: b
      text: { en: "`--peer-client-cert-auth=true` with `--peer-trusted-ca-file`" }
    - id: c
      text: { en: "`--client-cert-auth=true` with `--trusted-ca-file`" }
    - id: d
      text: { en: "`--listen-client-urls` set to an `https://` address" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `--client-cert-auth=true`, etcd checks every incoming HTTPS request for a client certificate signed by the CA given in `--trusted-ca-file`, and rejects clients without one. Server TLS alone (`--cert-file`, `--key-file`) encrypts the traffic but lets any client connect. The kube-apiserver then connects with its own client certificate (`--etcd-certfile`, `--etcd-keyfile`).
  options:
    a:
      en: |
        `--auto-tls` makes etcd generate self-signed certificates for client connections. It provides encryption but no authentication of clients.
    b:
      en: |
        These flags authenticate peer traffic between etcd members on the peer port, not the clients that connect to the client port.
    d:
      en: |
        An `https://` listen URL only makes the client port use TLS, which is already the case. It does not require clients to present a certificate.
references:
  - title: "Transport security model"
    url: https://etcd.io/docs/v3.5/op-guide/security/
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
