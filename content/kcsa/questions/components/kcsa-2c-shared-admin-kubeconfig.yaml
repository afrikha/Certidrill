id: kcsa-2c-shared-admin-kubeconfig
objective: "2.10.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Five operators share one kubeconfig file that authenticates as a user bound to `cluster-admin`. Which change best supports accountability and least privilege?
body:
  options:
    - id: a
      text: { en: "Store the shared file in an encrypted vault and rotate it every month" }
    - id: b
      text: { en: "Make five copies of the file so that each operator has their own" }
    - id: c
      text: { en: "Give each operator a personal identity bound only to the rights they need" }
    - id: d
      text: { en: "Enable audit logging at the `RequestResponse` level for the shared user" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With personal identities, RBAC can grant each person only the permissions their job needs, audit logs show who did what, and one person's access can be removed without affecting the others. The Kubernetes RBAC guidance asks for minimal rights for users and for `cluster-admin` only where specifically needed.
  options:
    a:
      en: |
        A vault protects the file, but everyone still acts as the same all-powerful user, so actions cannot be attributed and access cannot be removed for one person.
    b:
      en: |
        Copies of the same file carry the same identity and the same `cluster-admin` rights.
    d:
      en: |
        More detailed audit events still record the same shared username, so they cannot show which operator acted, and they reduce no privilege.
references:
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
