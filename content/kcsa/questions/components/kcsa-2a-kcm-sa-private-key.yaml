id: kcsa-2a-kcm-sa-private-key
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    kube-controller-manager is started with `--service-account-private-key-file=/etc/kubernetes/pki/sa.key`. What does kube-controller-manager use this key for?
body:
  options:
    - id: a
      text: { en: "Issuing the bound, time-limited tokens that kubelets request for Pods" }
    - id: b
      text: { en: "Signing legacy ServiceAccount tokens stored in Secrets" }
    - id: c
      text: { en: "Signing kubelet client certificates from approved requests" }
    - id: d
      text: { en: "Encrypting Secrets before they are stored in etcd" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Setting this flag enables legacy Secret-based ServiceAccount tokens, which kube-controller-manager signs with this private key. Anyone who steals the key can forge such tokens, so it must be protected like the CA key.
  options:
    a:
      en: |
        Bound, time-limited tokens are issued by kube-apiserver through the TokenRequest API, not by kube-controller-manager.
    c:
      en: |
        Certificates for approved CertificateSigningRequests are signed with the cluster signing key (`--cluster-signing-key-file`), not with the ServiceAccount key.
    d:
      en: |
        Encryption at rest is configured on kube-apiserver with an EncryptionConfiguration file. The controller manager plays no part in it.
references:
  - title: kube-controller-manager
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager/
