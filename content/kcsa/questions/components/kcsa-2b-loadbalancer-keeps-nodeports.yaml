id: kcsa-2b-loadbalancer-keeps-nodeports
objective: "2.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To reduce exposure, a team changes a Service from `type: NodePort` to `type: LoadBalancer` and leaves every other field at its default value. Which statement about the result is correct?
body:
  options:
    - id: a
      text: { en: "Node ports are still allocated on every node, and a load balancer address is added" }
    - id: b
      text: { en: "Node ports are released, so only the load balancer address accepts traffic" }
    - id: c
      text: { en: "The Service becomes reachable only from Pods inside the cluster" }
    - id: d
      text: { en: "Clients must now present a certificate to the load balancer" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `spec.allocateLoadBalancerNodePorts` defaults to `true`, so a LoadBalancer Service keeps allocating node ports, reachable on every node, and the cloud provider adds a load balancer in front of them. Unless the provider's annotation for an internal load balancer is used, that load balancer is usually reachable from outside. The change adds exposure rather than removing it.
  options:
    b:
      en: |
        Node ports are skipped only when `allocateLoadBalancerNodePorts` is set to `false`, an option meant for load balancers that route directly to Pods. Even then, node ports already allocated are not released automatically.
    c:
      en: |
        That describes a `ClusterIP` Service. A LoadBalancer Service is meant to be reached from outside the cluster.
    d:
      en: |
        A LoadBalancer Service does not add client authentication. Authentication must come from an Ingress or Gateway layer, a mesh or the application.
references:
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
