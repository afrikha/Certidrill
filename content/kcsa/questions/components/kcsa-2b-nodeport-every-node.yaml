id: kcsa-2b-nodeport-every-node
objective: "2.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Deployment with two replicas runs on two nodes of a ten-node cluster. It is exposed by a Service of `type: NodePort` with `nodePort: 30080`. From where is the application reachable?
body:
  options:
    - id: a
      text: { en: "Only through the two nodes that run its Pods" }
    - id: b
      text: { en: "Only from Pods inside the cluster, through the ClusterIP" }
    - id: c
      text: { en: "On port 30080 of every node, by any client that can reach a node" }
    - id: d
      text: { en: "Only through a cloud load balancer created for the Service" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For a NodePort Service, the control plane allocates a port from the `--service-node-port-range` (default 30000-32767) and every node proxies that same port to the Service. Nodes without any of the Pods still accept the traffic, so anyone who can reach any node address reaches the application. Node firewalls should block the node port range from untrusted networks.
  options:
    a:
      en: |
        The port is opened on every node, not only on the nodes that run the Pods. Traffic arriving elsewhere is forwarded to a backend Pod.
    b:
      en: |
        A NodePort Service also has a ClusterIP, but the node port makes it reachable from outside the cluster as well.
    d:
      en: |
        A load balancer is created for `type: LoadBalancer`, not for `NodePort`.
references:
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
