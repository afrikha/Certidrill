id: kcsa-2c-static-token-file
objective: "2.10.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    To give a few administrators quick access, a cluster operator starts the kube-apiserver with `--token-auth-file`, which lists one bearer token for each person. Which risk does the Kubernetes hardening guide associate with this method?
body:
  options:
    - id: a
      text: { en: "Tokens are stored in clear text on control plane disks and last indefinitely" }
    - id: b
      text: { en: "Tokens expire after one hour, so administrators lose access during incidents" }
    - id: c
      text: { en: "Tokens are sent to an external identity provider for every request" }
    - id: d
      text: { en: "Tokens bypass RBAC, because static users belong to `system:masters`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With a static token file, credentials are stored in clear text on the control plane nodes, tokens last indefinitely, users cannot rotate them, there is no lockout against brute force, and any change requires restarting the API server. The guide recommends external authentication, such as OIDC, for clusters with many human users.
  options:
    b:
      en: |
        Static tokens have no expiry at all; that permanence is the problem.
    c:
      en: |
        The API server validates static tokens against the local file; no external provider is involved.
    d:
      en: |
        The file can assign groups, but nothing puts static token users into `system:masters` by default; their rights come from RBAC like any other user.
references:
  - title: "Hardening Guide - Authentication Mechanisms"
    url: https://kubernetes.io/docs/concepts/security/hardening-guide/authentication-mechanisms/
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
