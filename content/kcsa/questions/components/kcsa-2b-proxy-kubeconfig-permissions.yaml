id: kcsa-2b-proxy-kubeconfig-permissions
objective: "2.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    On a cluster where kube-proxy runs as a systemd service, the file `/var/lib/kube-proxy/kubeconfig` holds the credential that kube-proxy uses to call the API server. Which protection should this file have?
body:
  options:
    - id: a
      text: { en: "Owned by root, with mode `600` or more restrictive" }
    - id: b
      text: { en: "Mode `644`, so that monitoring agents can read it" }
    - id: c
      text: { en: "Copied into a ConfigMap, so that every node can read it" }
    - id: d
      text: { en: "Mounted read-only into the application Pods that use Services" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A kubeconfig that contains a credential must be readable only by the account that runs the component: owned by root with mode `600` or stricter, as hardening guides check. Anyone who reads it can call the API server as kube-proxy. The configuration file of kube-proxy deserves the same protection, because it controls how a privileged component behaves.
  options:
    b:
      en: |
        Mode `644` makes the credential readable by every local user and process on the node, including a compromised agent.
    c:
      en: |
        A ConfigMap is not meant for credentials: anyone allowed to read ConfigMaps in that namespace would obtain kube-proxy's credential.
    d:
      en: |
        Applications reach Services through their ClusterIP and DNS names. They never need kube-proxy's credential, and mounting it hands it to them.
references:
  - title: "kube-proxy"
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-proxy/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
