id: kcsa-2b-deny-service-external-ips
objective: "2.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    CVE-2020-8554 showed that a user allowed to create Services could set `spec.externalIPs` to intercept traffic sent to other IP addresses. Which admission plugin rejects new uses of this field?
body:
  options:
    - id: a
      text: { en: "`NodeRestriction`" }
    - id: b
      text: { en: "`DenyServiceExternalIPs`" }
    - id: c
      text: { en: "`AlwaysPullImages`" }
    - id: d
      text: { en: "`PodSecurity`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      DenyServiceExternalIPs is a validating admission plugin that rejects every new use of `externalIPs`: creating a Service with the field or adding values to it. Existing uses are not affected, and the plugin is disabled by default. The Kubernetes security checklist asks that the use of LoadBalancer and ExternalIPs be restricted, and the field itself is deprecated since v1.36.
  options:
    a:
      en: |
        NodeRestriction limits which Node and Pod objects a kubelet can modify. It does not check Services.
    c:
      en: |
        AlwaysPullImages forces image pulls for new Pods so that cached private images cannot be reused without credentials. It does not check Services.
    d:
      en: |
        The PodSecurity plugin checks Pod specs against the Pod Security Standards. Services are outside its scope.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
