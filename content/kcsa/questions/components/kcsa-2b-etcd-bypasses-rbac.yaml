id: kcsa-2b-etcd-bypasses-rbac
objective: "2.8.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker steals a client certificate that etcd trusts and can reach etcd's client port from a compromised node. In Kubernetes RBAC, the attacker's own user may only read Pods in one namespace. What can the attacker read from etcd?
body:
  options:
    - id: a
      text: { en: "Only the Pods of that namespace, because etcd enforces RBAC" }
    - id: b
      text: { en: "Nothing, because etcd answers only the API server's IP address" }
    - id: c
      text: { en: "Every object stored in the cluster, including all Secrets" }
    - id: d
      text: { en: "Every object except Secrets, which only the kubelets store" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      RBAC is enforced by the API server. A client that talks to etcd directly is never checked by it, so a trusted certificate gives access to all stored data, including every Secret, which is only base64-encoded unless encryption at rest is configured. This is why access to etcd is equivalent to root in the cluster.
  options:
    a:
      en: |
        etcd knows nothing about Kubernetes RBAC. With client certificate authentication, it checks that the certificate is trusted, not what the Kubernetes user may do.
    b:
      en: |
        etcd authenticates clients by certificate, not by source address. Limiting the source addresses requires firewall rules, and the attacker here can reach the port.
    d:
      en: |
        Secrets are API objects stored in etcd like the others. Kubelets fetch them through the API server; they do not store them for the cluster.
references:
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
