id: kcsa-2c-coredns-configmap-rbac
objective: "2.9.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ClusterRoleBinding gives the `developers` group a ClusterRole that allows `get` and `update` on `configmaps` in all namespaces, so that developers can manage their applications' settings. Why is this a risk for the whole cluster?
body:
  options:
    - id: a
      text: { en: "Developers can read the data of every Secret in the cluster" }
    - id: b
      text: { en: "Developers can edit the `coredns` ConfigMap and redirect cluster DNS names" }
    - id: c
      text: { en: "Developers can change etcd's TLS settings, which are stored in a ConfigMap" }
    - id: d
      text: { en: "Developers can create privileged Pods in the `kube-system` namespace" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cluster DNS is usually CoreDNS, configured by the Corefile in the `coredns` ConfigMap of `kube-system`. Changing that ConfigMap changes how service discovery behaves for every Pod, so an attacker could resolve Service names to endpoints they control. Write access to cluster DNS configuration must be limited to administrators.
  options:
    a:
      en: |
        Secrets are a separate resource type. Permissions on `configmaps` give no access to `secrets`.
    c:
      en: |
        etcd's TLS settings are command-line flags or files on the etcd hosts, not a ConfigMap in the API.
    d:
      en: |
        Creating Pods requires `create` on `pods`, which this ClusterRole does not grant.
references:
  - title: "Customizing DNS Service"
    url: https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/
  - title: "DNS for Services and Pods"
    url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
