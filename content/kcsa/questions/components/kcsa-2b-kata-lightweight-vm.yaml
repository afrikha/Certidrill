id: kcsa-2b-kata-lightweight-vm
objective: "2.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team wants untrusted tenant workloads to run inside lightweight virtual machines with their own guest kernel, while still being managed as Pods. Which runtime provides this isolation model?
body:
  options:
    - id: a
      text: { en: "runc" }
    - id: b
      text: { en: "gVisor" }
    - id: c
      text: { en: "CRI-O" }
    - id: d
      text: { en: "Kata Containers" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Kata Containers builds lightweight virtual machines that behave like containers, using hardware virtualization and a guest kernel booted by a hypervisor. The workload no longer shares the host kernel directly. Pods use it through a RuntimeClass whose handler is configured in containerd or CRI-O.
  options:
    a:
      en: |
        runc is the default OCI runtime. Its containers are processes that share the host kernel, confined by namespaces, cgroups and security profiles.
    b:
      en: |
        gVisor isolates workloads with an application kernel that runs in user space between the container and the host. It does not start a virtual machine with a guest kernel.
    c:
      en: |
        CRI-O is a high-level runtime that implements the CRI. It can launch Kata Containers through a handler, but it does not provide virtual machine isolation itself.
references:
  - title: "GitHub - kata-containers/kata-containers: Kata Containers is an open source project and community working to build a standard implementation of lightweight Virtual Machines (VMs) that feel and perform like containers, but provide the workload isolation and security advantages of VMs. https://katacontainers.io/"
    url: https://github.com/kata-containers/kata-containers
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
