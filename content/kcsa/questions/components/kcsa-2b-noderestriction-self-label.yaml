id: kcsa-2b-noderestriction-self-label
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Sensitive workloads in a cluster use a node selector on the label `node-restriction.kubernetes.io/tier: pci`. An attacker who controls the kubelet credential of another node tries to add this label to the Node object of that node, to attract the sensitive Pods. Which control rejects the change?
body:
  options:
    - id: a
      text: { en: "The Node authorization mode" }
    - id: b
      text: { en: "The PodSecurity admission plugin" }
    - id: c
      text: { en: "The DenyServiceExternalIPs admission plugin" }
    - id: d
      text: { en: "The NodeRestriction admission plugin" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      NodeRestriction is a validating admission plugin that limits the Node and Pod objects a kubelet can modify. It forbids kubelets from setting labels with the `node-restriction.kubernetes.io/` prefix, which is reserved for administrators to label nodes for workload isolation, so a compromised node cannot declare itself eligible for sensitive workloads.
  options:
    a:
      en: |
        The Node authorizer allows kubelets to write nodes and node status. It decides which kinds of requests a kubelet may make, not which labels it may set: the documentation asks you to enable NodeRestriction to limit those writes.
    b:
      en: |
        The PodSecurity admission plugin checks Pod specs against the Pod Security Standards. It does not evaluate changes to Node objects.
    c:
      en: |
        DenyServiceExternalIPs rejects new uses of the `externalIPs` field of Services. It has nothing to do with Node labels.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
  - title: "Using Node Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/node/
