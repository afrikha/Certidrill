id: kcsa-2b-etcd-stores-all-state
objective: "2.8.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the data that etcd holds in a Kubernetes cluster?
body:
  options:
    - id: a
      text: { en: "All API objects, including Secrets, RBAC rules and workload definitions" }
    - id: b
      text: { en: "Only the Secrets, which etcd encrypts with its own key" }
    - id: c
      text: { en: "Only the node status and the scheduling decisions of Pods" }
    - id: d
      text: { en: "The container images and the logs of running containers" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      etcd is the consistent, highly available key-value store that Kubernetes uses as the backing store for all cluster data: every object created through the API server is stored there, including Secrets, Roles and bindings, and workload definitions. That makes it the most sensitive data store of the cluster.
  options:
    b:
      en: |
        etcd stores every kind of object, not only Secrets, and it does not encrypt them by itself. Encryption at rest is configured on the API server.
    c:
      en: |
        Node status and Pod bindings are stored in etcd, but so is every other API object.
    d:
      en: |
        Images are stored in registries and on the nodes, and container logs on the nodes. They are not API objects in etcd.
references:
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
