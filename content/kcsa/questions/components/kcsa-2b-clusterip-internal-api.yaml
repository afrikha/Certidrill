id: kcsa-2b-clusterip-internal-api
objective: "2.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An internal `inventory` API is called only by other Pods of the same cluster. Which Service type exposes it with the smallest attack surface?
body:
  options:
    - id: a
      text: { en: "`NodePort`" }
    - id: b
      text: { en: "`LoadBalancer`" }
    - id: c
      text: { en: "`ExternalName`" }
    - id: d
      text: { en: "`ClusterIP`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `ClusterIP`, the default type, exposes the Service on a cluster-internal IP only, so it is reachable only from within the cluster. Every Pod of the cluster can still reach it, so add NetworkPolicies to allow only the clients that need it.
  options:
    a:
      en: |
        `NodePort` opens a port on every node, making the API reachable by anyone who can reach a node address.
    b:
      en: |
        `LoadBalancer` adds an external load balancer and, by default, node ports on every node. It exposes the API outside the cluster.
    c:
      en: |
        `ExternalName` returns a DNS CNAME to an external host name, without proxying. It cannot route traffic to the `inventory` Pods.
references:
  - title: "Service"
    url: https://kubernetes.io/docs/concepts/services-networking/service/
