id: kcsa-2a-audit-no-policy
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To record API activity, an administrator adds these flags to kube-apiserver and restarts it:

    ```text
    --audit-log-path=/var/log/kubernetes/audit.log
    --audit-log-maxage=30
    ```

    No audit events are ever written. What is missing?
body:
  options:
    - id: a
      text: { en: "`--audit-policy-file` pointing to an audit policy with rules" }
    - id: b
      text: { en: "`--audit-webhook-config-file` pointing to an external collector" }
    - id: c
      text: { en: "`--profiling=true` to expose the request handlers" }
    - id: d
      text: { en: "`EventRateLimit` added to `--enable-admission-plugins`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The audit policy decides which events are recorded and at which level (None, Metadata, Request, RequestResponse). If `--audit-policy-file` is omitted, no events are logged, whatever backend is configured. The policy file must contain at least one rule.
  options:
    b:
      en: |
        The webhook backend is an alternative or additional destination for events. The log backend set with `--audit-log-path` works on its own once a policy exists.
    c:
      en: |
        `--profiling` controls the `/debug/pprof/` endpoint. It has nothing to do with auditing, and it is already `true` by default.
    d:
      en: |
        EventRateLimit limits how fast Event objects can be written to the API server. It does not produce audit records.
references:
  - title: Auditing
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
