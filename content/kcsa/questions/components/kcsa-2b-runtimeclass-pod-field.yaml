id: kcsa-2b-runtimeclass-pod-field
objective: "2.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cluster administrator has created a RuntimeClass named `gvisor` for untrusted workloads. Which field must a Pod set so that its containers run with this RuntimeClass?
body:
  options:
    - id: a
      text: { en: "`spec.securityContext.seccompProfile`" }
    - id: b
      text: { en: "`spec.runtimeClassName`" }
    - id: c
      text: { en: "`spec.schedulerName`" }
    - id: d
      text: { en: "`spec.priorityClassName`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Pod selects a RuntimeClass with `spec.runtimeClassName`, which tells the kubelet to run the Pod with the runtime handler named in that RuntimeClass. Without the field, the default handler is used. Because whoever writes the Pod sets this field, an admission policy can require it in namespaces that host untrusted code.
  options:
    a:
      en: |
        `seccompProfile` selects a system-call filter for the containers. It does not change the runtime that runs them.
    c:
      en: |
        `schedulerName` chooses which scheduler places the Pod on a node. It does not select a container runtime.
    d:
      en: |
        `priorityClassName` sets the scheduling priority of the Pod and its preemption behavior. It has no effect on isolation.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
