id: kcsa-2a-apiserver-exposure
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The kube-apiserver endpoint of a self-managed cluster is reachable from the whole internet. Administrators work from the corporate network, and nodes reach the API server over the private network. What reduces the exposure of the endpoint?
body:
  options:
    - id: a
      text: { en: "Allow only the private and admin networks, reached through a VPN or bastion" }
    - id: b
      text: { en: "Move the API server from port 6443 to an unusual port with `--secure-port`" }
    - id: c
      text: { en: "Set `--bind-address=127.0.0.1` so that the API server listens only locally" }
    - id: d
      text: { en: "Keep the public endpoint and rely on `--anonymous-auth=false` alone" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Kubernetes API should not be exposed publicly on the internet. Limiting the endpoint to the networks that need it, with administrators connecting through a VPN or bastion host, removes the internet as a source of brute-force attempts and of attacks on unpatched vulnerabilities, while authentication and authorization still apply.
  options:
    b:
      en: |
        A different port only hides the service from casual scans. The endpoint stays reachable from the whole internet.
    c:
      en: |
        The API server's bind address must be reachable by the rest of the cluster and by clients. Listening on localhost only would cut off nodes and administrators.
    d:
      en: |
        Disabling anonymous access is good practice, but the endpoint stays exposed to credential attacks and to any vulnerability in the API server from anywhere on the internet.
references:
  - title: Security Checklist
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: kube-apiserver
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
