id: kcsa-2a-reads-bypass-admission
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team deploys a validating admission webhook that should block every `get` and `list` of Secrets in the `payments` namespace by users outside the payments team. Tests show that other users can still read those Secrets. What should the team use instead?
body:
  options:
    - id: a
      text: { en: "An RBAC Role and RoleBinding that grant read access to Secrets in `payments` only to the payments team" }
    - id: b
      text: { en: "A mutating admission webhook that removes the `data` field from Secrets returned to other users" }
    - id: c
      text: { en: "The same validating webhook with its `failurePolicy` set to `Fail` instead of `Ignore`" }
    - id: d
      text: { en: "A ValidatingAdmissionPolicy with a CEL expression that checks the requesting user's groups" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Admission controllers act only on requests that create, modify, delete or connect to objects. Reads (`get`, `list`, `watch`) bypass the admission layer, so no webhook or policy can block them. Who can read Secrets is decided at the authorization stage, with RBAC rules that grant the read verbs only to the intended subjects.
  options:
    b:
      en: |
        Mutating admission runs on write requests only. It never sees a `get` or `list` response, so it cannot strip data from Secrets that are being read.
    c:
      en: |
        `failurePolicy` decides what happens when the webhook cannot be reached. The webhook is never called for read requests, so the setting changes nothing here.
    d:
      en: |
        A ValidatingAdmissionPolicy is also an admission control. Like webhooks, it cannot block reads, which bypass admission.
references:
  - title: Admission Control in Kubernetes
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
  - title: Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
