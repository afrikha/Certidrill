id: kcsa-2c-pv-create-escalation
objective: "2.11.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To let teams provision their own storage, a ClusterRole bound to the team leads allows `create` on `persistentvolumes`. Why is this permission a security risk?
body:
  options:
    - id: a
      text: { en: "A team lead can create a `hostPath` volume and reach the node's filesystem" }
    - id: b
      text: { en: "A team lead can read the data of every claim in the cluster" }
    - id: c
      text: { en: "A team lead can change the reclaim policy of the default StorageClass" }
    - id: d
      text: { en: "A team lead can delete Secrets in other namespaces through the volume" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Creating arbitrary PersistentVolumes includes creating `hostPath` volumes. A Pod that claims such a volume gets access to the node's filesystem, from which an attacker can read other containers' data or abuse the credentials of system services such as the kubelet. The RBAC good practices reserve PersistentVolume creation for trusted administrators and provisioners; other users should request storage with PersistentVolumeClaims.
  options:
    b:
      en: |
        Creating a PersistentVolume does not grant access to volumes that other claims are already bound to.
    c:
      en: |
        StorageClasses are a separate resource; `create` on `persistentvolumes` gives no right to modify them.
    d:
      en: |
        Secrets are API objects. Creating a PersistentVolume gives no permission on Secrets.
references:
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
