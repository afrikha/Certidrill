id: kcsa-2b-no-new-privs-setuid
objective: "2.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container image includes setuid binaries. You want to prevent the processes of the container from gaining more privileges than their parent process through such binaries. Which securityContext setting does this?
body:
  options:
    - id: a
      text: { en: "`runAsNonRoot: true`" }
    - id: b
      text: { en: "`readOnlyRootFilesystem: true`" }
    - id: c
      text: { en: "`allowPrivilegeEscalation: false`" }
    - id: d
      text: { en: "`seccompProfile.type: RuntimeDefault`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `allowPrivilegeEscalation` controls whether a process can gain more privileges than its parent: set to `false`, it sets the `no_new_privs` flag on the container process, so setuid binaries cannot raise privileges. It defaults to `true`, and it is always `true` for privileged containers or containers with `CAP_SYS_ADMIN`. The Restricted Pod Security Standard requires `false`.
  options:
    a:
      en: |
        `runAsNonRoot` makes the kubelet refuse to start a container that would run as UID 0. It does not stop a non-root process from escalating through a setuid binary afterwards.
    b:
      en: |
        A read-only root filesystem prevents writing new files, but the setuid binaries already in the image can still be executed.
    d:
      en: |
        The runtime's default seccomp profile filters system calls. It does not stop setuid binaries from raising the privileges of a process.
references:
  - title: "Configure a Security Context for a Pod or Container"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
