id: kcsa-2c-netmodel-podcidr-trust
objective: "2.9.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An internal payments API accepts requests without authentication when the source IP address is inside the cluster's Pod CIDR, on the assumption that only the `checkout` service calls it. Why is this control weak?
body:
  options:
    - id: a
      text: { en: "Pod IPs are translated by NAT, so the API always sees the node's IP address" }
    - id: b
      text: { en: "Pod CIDR addresses are public, so any internet host can use them" }
    - id: c
      text: { en: "Every Pod in every namespace has an IP in that range and can reach the API directly" }
    - id: d
      text: { en: "Pod CIDR addresses change at each cluster upgrade, which breaks the check" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the Kubernetes network model, each Pod gets a cluster-wide unique IP and all Pods can communicate without NAT. A source address in the Pod CIDR proves only that the caller is some Pod, in any namespace, including a compromised one. Callers should be identified by authentication, for example mutual TLS with workload identities, and access limited with NetworkPolicies.
  options:
    a:
      en: |
        The model requires Pod-to-Pod traffic without address translation, so the API does see the source Pod IP.
    b:
      en: |
        The Pod CIDR is a cluster-internal range; the weakness is inside the cluster, not on the internet.
    d:
      en: |
        Pod IPs change when Pods are recreated, but the issue is that the range covers every workload, not that it changes.
references:
  - title: "Services, Load Balancing, and Networking"
    url: https://kubernetes.io/docs/concepts/services-networking/
