id: kcsa-2c-hostpath-readonly
objective: "2.11.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A log collector reads files under `/var/log` on each node through a `hostPath` volume. An admission policy already allows `hostPath` volumes only for the `/var/log` directory. According to the Kubernetes documentation, what else must the policy require for this directory restriction to be effective?
body:
  options:
    - id: a
      text: { en: "That the volume uses `type: DirectoryOrCreate`" }
    - id: b
      text: { en: "That the Pod sets `fsGroup` to the group that owns `/var/log`" }
    - id: c
      text: { en: "That every mount of the `hostPath` volume is read-only" }
    - id: d
      text: { en: "That the volume uses the `ReadWriteOncePod` access mode" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The documentation states that restricting `hostPath` to specific directories at admission time is effective only if you also require that every mount of that volume is read-only. With a read-write host mount, the containers of an untrusted Pod may be able to subvert it and reach other parts of the host filesystem, such as kubelet credentials or the container runtime socket.
  options:
    a:
      en: |
        `DirectoryOrCreate` only creates the directory if it is missing. It adds no protection and lets the Pod create paths on the node.
    b:
      en: |
        `fsGroup` changes the ownership of volumes that support it; it is not a safeguard for host directories and does not prevent writes.
    d:
      en: |
        Access modes apply to PersistentVolumes and claims, not to a `hostPath` volume in a Pod spec, and they do not enforce write protection anyway.
references:
  - title: "Volume Types"
    url: https://kubernetes.io/docs/reference/storage/volume-types/
