id: kcsa-2b-cri-client
objective: "2.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    On a node, the kubelet starts the containers of a Pod by calling the Container Runtime Interface (CRI). Which component receives these CRI calls on a typical node?
body:
  options:
    - id: a
      text: { en: "runc" }
    - id: b
      text: { en: "The CNI plugin" }
    - id: c
      text: { en: "containerd" }
    - id: d
      text: { en: "kube-proxy" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The CRI is the gRPC protocol between the kubelet, which acts as the client, and the container runtime, whose endpoint is set with `--container-runtime-endpoint`. High-level runtimes such as containerd and CRI-O implement it: they pull images, manage Pod sandboxes and ask a low-level OCI runtime to create the containers.
  options:
    a:
      en: |
        runc is the low-level OCI runtime that containerd or CRI-O calls to create the container process. It does not implement the CRI.
    b:
      en: |
        A CNI plugin sets up Pod networking when the runtime asks it to. It does not serve the CRI.
    d:
      en: |
        kube-proxy programs Service forwarding rules on the node. It does not start containers.
references:
  - title: "Container Runtime Interface (CRI)"
    url: https://kubernetes.io/docs/concepts/architecture/cri/
