id: kcsa-2b-oci-runtime-role
objective: "2.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which component spawns the container process on a Linux node according to the Open Container Initiative (OCI) runtime specification?
body:
  options:
    - id: a
      text: { en: "runc" }
    - id: b
      text: { en: "CRI-O" }
    - id: c
      text: { en: "The kubelet" }
    - id: d
      text: { en: "crictl" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      runc is a command-line tool for spawning and running containers on Linux according to the OCI specification, and the usual low-level runtime behind containerd and CRI-O. It sets up the Linux namespaces, cgroups and other confinement of the process, so a vulnerability in runc can lead to a container escape and runc must be patched on every node.
  options:
    b:
      en: |
        CRI-O implements the Kubernetes CRI. It delegates the creation of the container process to an OCI-conformant runtime such as runc or Kata Containers.
    c:
      en: |
        The kubelet asks the container runtime to start containers through the CRI. It never creates container processes itself.
    d:
      en: |
        crictl is a command-line client for CRI-compatible runtimes, used to inspect and debug nodes. It sends requests to the runtime and does not create processes itself.
references:
  - title: "GitHub - opencontainers/runc: CLI tool for spawning and running containers according to the OCI specification"
    url: https://github.com/opencontainers/runc
  - title: "cri-o"
    url: https://cri-o.io/
