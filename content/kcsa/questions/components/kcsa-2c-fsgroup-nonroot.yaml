id: kcsa-2c-fsgroup-nonroot
objective: "2.11.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod runs as user 1000 with `runAsNonRoot: true`. The application cannot write to its PersistentVolume, because the files on the volume are owned by root. You must fix this without running the container as root. What should you add?
body:
  options:
    - id: a
      text: { en: "`privileged: true` in the container `securityContext`" }
    - id: b
      text: { en: "`allowPrivilegeEscalation: true` in the container `securityContext`" }
    - id: c
      text: { en: "`runAsUser: 0` in the Pod `securityContext`" }
    - id: d
      text: { en: "`fsGroup` with the application's group ID in the Pod `securityContext`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `fsGroup`, volumes that support ownership management are made owned and writable by that group ID, and all processes of the containers are added to the group as a supplementary group. New files on the volume also get that group, so the non-root application can write without any extra privilege.
  options:
    a:
      en: |
        A privileged container gets almost all host capabilities, a far larger risk than the problem it would hide, and it is forbidden by the Baseline Pod Security Standard.
    b:
      en: |
        This field controls whether a process can gain more privileges than its parent, for example through setuid binaries; it does not change file ownership on the volume.
    c:
      en: |
        User 0 is root, which the requirement forbids and which conflicts with `runAsNonRoot: true`.
references:
  - title: "Configure a Security Context for a Pod or Container"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
