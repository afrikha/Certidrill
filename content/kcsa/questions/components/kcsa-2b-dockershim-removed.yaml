id: kcsa-2b-dockershim-removed
objective: "2.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team plans to upgrade its nodes to Kubernetes v1.37 and wants to keep Docker Engine as the container runtime. Which statement is correct?
body:
  options:
    - id: a
      text: { en: "The kubelet drives Docker Engine through its built-in dockershim" }
    - id: b
      text: { en: "kubeadm installs Docker Engine as the default runtime on new nodes" }
    - id: c
      text: { en: "Images built with Docker must be rebuilt before they run on containerd" }
    - id: d
      text: { en: "Docker Engine can be used only through the external cri-dockerd adapter" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Dockershim was removed from Kubernetes in v1.24, so the kubelet only talks to runtimes that implement the CRI. Docker Engine does not implement the CRI itself: it needs the cri-dockerd adapter, whose socket the kubelet then uses. Many teams move to containerd or CRI-O instead.
  options:
    a:
      en: |
        Dockershim no longer exists: it was removed in v1.24. It is only history, not an option in v1.37.
    b:
      en: |
        kubeadm does not install a container runtime. You install a CRI-compatible runtime on each node before the node joins the cluster.
    c:
      en: |
        Images built with Docker are OCI images. They run unchanged on containerd or CRI-O.
references:
  - title: "Container Runtimes"
    url: https://kubernetes.io/docs/setup/production-environment/container-runtimes/
