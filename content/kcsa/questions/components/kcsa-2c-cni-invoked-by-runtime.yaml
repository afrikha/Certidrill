id: kcsa-2c-cni-invoked-by-runtime
objective: "2.9.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    On the Linux nodes of a Kubernetes v1.37 cluster, which component uses the CNI plugin to set up the network of a new Pod sandbox?
body:
  options:
    - id: a
      text: { en: "The container runtime, such as containerd or CRI-O" }
    - id: b
      text: { en: "The kubelet, through its `--network-plugin` flag" }
    - id: c
      text: { en: "kube-proxy, when it programs the Service rules" }
    - id: d
      text: { en: "The kube-apiserver, when the Pod is admitted" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The container runtime that provides CRI services to the kubelet must be configured to load the CNI plugins that implement the Kubernetes network model. The plugin creates the Pod's interface and IP address, and, depending on the plugin, also enforces NetworkPolicy and encrypts traffic, which is why the choice of plugin matters for security.
  options:
    b:
      en: |
        The kubelet `--network-plugin` and `cni-bin-dir` parameters were removed in Kubernetes v1.24; managing CNI is no longer the kubelet's job.
    c:
      en: |
        kube-proxy implements Service virtual IPs. It does not create Pod network interfaces.
    d:
      en: |
        The API server only stores the Pod object. Networking is set up on the node after the Pod is scheduled.
references:
  - title: "Network Plugins"
    url: https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/
