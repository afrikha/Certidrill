id: kcsa-2a-kcm-bind-address
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On a control plane node, kube-controller-manager listens on `0.0.0.0:10257`. Local health probes must keep working, but the port must not be reachable from other hosts. What should you change?
body:
  options:
    - id: a
      text: { en: "Set `--bind-address=127.0.0.1`" }
    - id: b
      text: { en: "Set `--secure-port=0`" }
    - id: c
      text: { en: "Set `--profiling=false`" }
    - id: d
      text: { en: "Set `--leader-elect=false`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `--bind-address` defaults to `0.0.0.0`, so the secure port 10257 listens on every interface. Binding it to `127.0.0.1` keeps it available to local probes and agents while other hosts can no longer reach it.
  options:
    b:
      en: |
        With `--secure-port=0`, kube-controller-manager does not serve HTTPS at all, so the local health probes would fail too.
    c:
      en: |
        Disabling profiling removes the `/debug/pprof/` endpoint, which is good practice, but the port still listens on every interface.
    d:
      en: |
        Leader election only decides which replica is active. It does not change where the HTTPS endpoint listens.
references:
  - title: kube-controller-manager
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager/
  - title: Ports and Protocols
    url: https://kubernetes.io/docs/reference/networking/ports-and-protocols/
