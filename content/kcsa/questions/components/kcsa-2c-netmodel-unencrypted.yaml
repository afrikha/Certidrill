id: kcsa-2c-netmodel-unencrypted
objective: "2.9.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A `frontend` Pod on `node1` calls a `backend` Pod on `node2` over plain HTTP. The network plugin runs with its default settings and there is no service mesh. An auditor asks whether this traffic is encrypted while it crosses the network between the nodes. What is the correct answer?
body:
  options:
    - id: a
      text: { en: "Yes, because kube-proxy wraps Service traffic in TLS between nodes" }
    - id: b
      text: { en: "Yes, because all cluster traffic uses certificates from the cluster CA" }
    - id: c
      text: { en: "Only when the two Pods run in different namespaces" }
    - id: d
      text: { en: "No, Kubernetes does not encrypt Pod-to-Pod traffic by default" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Kubernetes multi-tenancy documentation states that, by default, all Pods can communicate with each other and all network traffic is unencrypted. Encryption between Pods must be added by the applications (TLS), by a service mesh with mutual TLS, or by the encryption feature of a network plugin.
  options:
    a:
      en: |
        kube-proxy programs rules that route Service virtual IPs to Pods. It does not encrypt any traffic.
    b:
      en: |
        The cluster CA secures connections to and from control plane components, such as the API server and kubelets, not application traffic between Pods.
    c:
      en: |
        Namespaces have no effect on how Pod traffic is carried between nodes; it is unencrypted in every case.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
