id: kcsa-2b-hostport-exposure
objective: "2.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod contains this container:

    ```yaml
    containers:
    - name: web
      image: registry.example.com/shop/web:4.1
      ports:
      - containerPort: 8080
        hostPort: 8080
    ```

    What is the security concern of this configuration?
body:
  options:
    - id: a
      text: { en: "Port 8080 is opened on the IP addresses of the node that runs the Pod" }
    - id: b
      text: { en: "The container shares the node's network namespace and sees its traffic" }
    - id: c
      text: { en: "Port 8080 is opened on every node of the cluster, like a NodePort" }
    - id: d
      text: { en: "The container can bind any port of the node without restriction" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `hostPort` exposes the container on a port of the node where the Pod runs, on all of the node's addresses unless `hostIP` is set. Traffic reaches the container directly, outside any Service, Ingress or Gateway layer and its controls, and the Pod is tied to nodes where the port is free. The Baseline Pod Security Standard says host ports should be disallowed.
  options:
    b:
      en: |
        Sharing the node's network namespace is the effect of `hostNetwork: true`, not of `hostPort`.
    c:
      en: |
        Only the node that runs the Pod opens the port. A NodePort Service, by contrast, opens its port on every node.
    d:
      en: |
        Only the declared port 8080 is bound on the node. The container does not gain access to the node's other ports.
references:
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: "Kubernetes Configuration Good Practices"
    url: https://kubernetes.io/docs/concepts/configuration/overview/
