id: kcsa-2a-kubelet-401
objective: "2.4.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    A kubelet runs with anonymous authentication disabled. A client sends a request to `https://<node-ip>:10250/pods` without any credentials. Which HTTP status does the kubelet return?
body:
  options:
    - id: a
      text: { en: "200 OK, with the list of Pods on the node" }
    - id: b
      text: { en: "401 Unauthorized" }
    - id: c
      text: { en: "403 Forbidden" }
    - id: d
      text: { en: "404 Not Found" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With anonymous access enabled, requests not rejected by another method are treated as `system:anonymous` and passed to authorization. Disabling it makes the kubelet send 401 Unauthorized to unauthenticated requests, so callers without a client certificate or a valid token are stopped before authorization.
  options:
    a:
      en: |
        A 200 response to a caller without credentials is exactly the risk of an open kubelet API: anonymous access combined with `AlwaysAllow` authorization.
    c:
      en: |
        403 is an authorization decision for a request that was authenticated, possibly as `system:anonymous`. With anonymous access disabled, the request does not get that far.
    d:
      en: |
        `/pods` is an existing kubelet endpoint. The request fails because the caller is not authenticated, not because the path is unknown.
references:
  - title: Kubelet authentication/authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
