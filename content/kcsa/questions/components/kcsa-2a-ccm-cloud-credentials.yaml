id: kcsa-2a-ccm-cloud-credentials
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You deploy the cloud-controller-manager of your cloud provider in a self-managed cluster. Which approach to its credentials follows least privilege?
body:
  options:
    - id: a
      text: { en: "A cloud identity scoped to this cluster's node, route and load balancer actions" }
    - id: b
      text: { en: "The cloud account's administrator credentials, so that no Service type ever fails to provision" }
    - id: c
      text: { en: "The same cloud credentials copied to every node, so that kubelets can also query the cloud API" }
    - id: d
      text: { en: "Cloud credentials only, since cloud-controller-manager does not need any Kubernetes RBAC rules" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      cloud-controller-manager needs two sets of permissions: cloud credentials (a token or IAM rules) to call the provider's API, and RBAC rules to talk to the API server. Both should be limited to what its node, route and service controllers do, for this cluster only. The documentation's example manifest binds it to `cluster-admin` only as a starting point to narrow down.
  options:
    b:
      en: |
        Administrator credentials would let a compromise of the cloud-controller-manager reach every resource of the cloud account, far beyond the cluster's needs.
    c:
      en: |
        With an external cloud-controller-manager, node information comes from it, so cloud API access on the kubelets can be restricted. Copying the credentials to every node widens the exposure.
    d:
      en: |
        cloud-controller-manager is also a Kubernetes API client. It needs RBAC rules, for example full access to Node objects and access to Services and their status.
references:
  - title: Cloud Controller Manager Administration
    url: https://kubernetes.io/docs/tasks/administer-cluster/running-cloud-controller/
  - title: Cloud Controller Manager
    url: https://kubernetes.io/docs/concepts/architecture/cloud-controller/
