id: kcsa-2c-encryption-apiserver-vs-disk
objective: "2.8.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The volumes that hold etcd data use full-disk encryption. During a review, `etcdctl get /registry/secrets/payments/db-creds` still shows the Secret data in plain text. You must make Secret values unreadable to anyone who reads etcd through its API or from a snapshot. What should you configure?
body:
  options:
    - id: a
      text: { en: "An EncryptionConfiguration for `secrets`, loaded by the kube-apiserver" }
    - id: b
      text: { en: "The etcd `--cipher-suites` flag, restricted to AES-GCM cipher suites" }
    - id: c
      text: { en: "The `immutable: true` field on every Secret in the `payments` namespace" }
    - id: d
      text: { en: "Full-disk encryption on the worker nodes as well as on the etcd hosts" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Encryption at rest of API resources is done by the kube-apiserver: with an EncryptionConfiguration that lists `secrets` and an encrypting provider first, the API server encrypts Secret data before writing it to etcd. Anyone who reads etcd directly, or a snapshot, then sees ciphertext. The documentation notes that this encryption is in addition to any disk or filesystem encryption, which only protects against theft of the disk itself.
  options:
    b:
      en: |
        `--cipher-suites` selects the TLS cipher suites for connections to etcd. It protects data in transit, not the values stored in etcd.
    c:
      en: |
        Immutable Secrets cannot be changed after creation; their data is stored exactly as before, without encryption.
    d:
      en: |
        Disk encryption is transparent to etcd and to anyone who reads it through its API or takes a snapshot, which is how the data was exposed here.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
