id: kcsa-2c-exec-credential-plugin
objective: "2.10.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A `users` entry of a kubeconfig file contains an `exec` section with `apiVersion: client.authentication.k8s.io/v1`. What does this mechanism do?
body:
  options:
    - id: a
      text: { en: "It makes the API server call an external webhook to authorize each request" }
    - id: b
      text: { en: "It runs a local command that returns a credential, such as a short-lived token" }
    - id: c
      text: { en: "It runs a command inside a Pod of the cluster to obtain a ServiceAccount token" }
    - id: d
      text: { en: "It encrypts the client key stored in the kubeconfig file with a passphrase" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An `exec` entry configures a client-go credential plugin. `kubectl` runs the command, which prints an `ExecCredential` with a bearer token or TLS credentials, optionally with an expiry; the credential is cached until it expires. Plugins integrate authentication protocols that client-go does not support natively, such as LDAP, Kerberos, OAuth2 or SAML.
  options:
    a:
      en: |
        Webhook authorization is configured on the API server. A kubeconfig file only tells the client how to obtain credentials.
    c:
      en: |
        The command runs on the client machine, not in the cluster, and it is not tied to ServiceAccounts.
    d:
      en: |
        Kubeconfig files have no passphrase option, and private keys used for client certificate authentication cannot be password-protected.
references:
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
