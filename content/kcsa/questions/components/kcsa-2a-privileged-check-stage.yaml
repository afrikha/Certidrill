id: kcsa-2a-privileged-check-stage
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    RBAC allows the developers of namespace `shop` to create Pods. You need the API server to reject any Pod in `shop` whose container sets `securityContext.privileged: true`. At which stage of request processing can this rule be enforced?
body:
  options:
    - id: a
      text: { en: "Authentication, by rejecting users who submit privileged Pod specs" }
    - id: b
      text: { en: "Authorization, with an RBAC Role that denies privileged Pods" }
    - id: c
      text: { en: "Admission control, for example with the PodSecurity admission plugin" }
    - id: d
      text: { en: "Scheduling, by leaving privileged Pods without a node" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Rules that depend on specific fields of an object are handled by admission controllers, which are the first stage to see the object content. The built-in PodSecurity plugin, a ValidatingAdmissionPolicy or a policy engine webhook can reject a Pod that requests privileged mode, before it is stored.
  options:
    a:
      en: |
        Authentication only establishes who is calling. It does not look at the object in the request.
    b:
      en: |
        Authorization reviews request attributes such as user, verb, resource and namespace, not the fields of the object. RBAC also has no deny rules: it can only grant permissions.
    d:
      en: |
        The scheduler only assigns Pods that are already stored to nodes. It does not reject objects at the API, so the privileged Pod would already be accepted.
references:
  - title: Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
  - title: Admission Control in Kubernetes
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
