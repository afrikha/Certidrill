id: kcsa-2c-x509-groups-frozen
objective: "2.10.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Bob authenticates with a client certificate whose subject is `CN=bob, O=payments-admins`. He moved to another team, and you removed him from the `payments-admins` group in the corporate directory. A RoleBinding in the `payments` namespace grants the group `payments-admins` the `admin` ClusterRole, and Bob can still manage that namespace. Why?
body:
  options:
    - id: a
      text: { en: "The API server caches directory group memberships until Bob's session ends" }
    - id: b
      text: { en: "Bob's groups are stored in a User object that must be edited with `kubectl edit`" }
    - id: c
      text: { en: "A RoleBinding to a group cannot change while one of its members is connected" }
    - id: d
      text: { en: "His group comes from the certificate's organization field and is fixed until expiry" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With X.509 client certificates, the username is the common name and each organization field is a group. The API server reads them from the certificate, not from the directory, so group memberships cannot change for the lifetime of the certificate. Removing Bob from the directory group has no effect until the certificate expires, or until the CA is re-keyed.
  options:
    a:
      en: |
        Certificate authentication never queries the corporate directory, so there is nothing to cache.
    b:
      en: |
        Kubernetes has no User object; usernames and groups come from the authenticator on each request.
    c:
      en: |
        RBAC objects can be changed at any time and apply to the next request. Changing the binding would affect every member of the group, not only Bob.
references:
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
  - title: "Hardening Guide - Authentication Mechanisms"
    url: https://kubernetes.io/docs/concepts/security/hardening-guide/authentication-mechanisms/
