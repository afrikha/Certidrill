id: kcsa-2c-dns-policy-bypass
objective: "2.9.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team monitors cluster DNS and wants to find Pods whose name lookups do not go to the cluster DNS service. Which Pod setting means that the Pod does not use the cluster DNS service?
body:
  options:
    - id: a
      text: { en: "No `dnsPolicy` field in the Pod spec" }
    - id: b
      text: { en: "`hostNetwork: true` with `dnsPolicy: ClusterFirstWithHostNet`" }
    - id: c
      text: { en: "`enableServiceLinks: false` in the Pod spec" }
    - id: d
      text: { en: "`dnsPolicy: None` with its own `dnsConfig.nameservers`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `dnsPolicy: None`, the Pod ignores the DNS settings of the Kubernetes environment and the kubelet builds its `/etc/resolv.conf` only from `dnsConfig`, so lookups go to the nameservers the Pod chose. Such Pods escape DNS monitoring and may receive answers from an untrusted server; egress NetworkPolicies can limit which DNS servers Pods may reach.
  options:
    a:
      en: |
        When `dnsPolicy` is not set, `ClusterFirst` is used: the kubelet points the Pod's `/etc/resolv.conf` to the cluster DNS service.
    b:
      en: |
        `ClusterFirstWithHostNet` is the policy that makes host-network Pods use the cluster DNS service.
    c:
      en: |
        This field only stops Service information from being injected as environment variables; DNS resolution is unchanged.
references:
  - title: "DNS for Services and Pods"
    url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
