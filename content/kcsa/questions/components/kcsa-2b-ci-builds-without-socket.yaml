id: kcsa-2b-ci-builds-without-socket
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI system builds container images in Pods that mount the node's `/var/run/docker.sock`. The security team wants to remove the risk of a node takeover while the team keeps building images in the cluster. What should the team do?
body:
  options:
    - id: a
      text: { en: "Run the CI Pods with a NetworkPolicy that denies all egress traffic" }
    - id: b
      text: { en: "Run the CI Pods with `automountServiceAccountToken: false`" }
    - id: c
      text: { en: "Run the CI Pods in a dedicated namespace, keeping the socket mount" }
    - id: d
      text: { en: "Run the CI Pods with a daemonless builder and no runtime socket mount" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Access to the runtime socket is control of the node's container runtime, whatever else the Pod is allowed to do. A daemonless image builder builds images inside its own container without talking to the node's runtime, so the `hostPath` mount of the socket can be removed and forbidden by policy.
  options:
    a:
      en: |
        The socket is a local Unix socket on the node. Blocking network egress does not stop the Pod from using it to start a privileged container.
    b:
      en: |
        Removing the API token limits access to the Kubernetes API, but the runtime socket bypasses the API server entirely.
    c:
      en: |
        A namespace limits who can create such Pods, but it is not a node boundary: a compromised CI Pod still controls the runtime of its node.
references:
  - title: "Volume Types"
    url: https://kubernetes.io/docs/reference/storage/volume-types/
