id: kcsa-2b-hostipc-vs-shared-process
objective: "2.7.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Review this Pod spec:

    ```yaml
    spec:
      shareProcessNamespace: true
      hostIPC: true
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 2000
      containers:
      - name: app
        image: registry.example.com/shop/app:2.3
    ```

    Which field weakens the isolation between the Pod and the node?
body:
  options:
    - id: a
      text: { en: "`shareProcessNamespace: true`" }
    - id: b
      text: { en: "`automountServiceAccountToken: false`" }
    - id: c
      text: { en: "`hostIPC: true`" }
    - id: d
      text: { en: "`fsGroup: 2000`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `hostIPC: true` makes the Pod use the host's IPC namespace, so its containers share System V IPC objects and shared memory with processes on the node. The Baseline Pod Security Standard forbids it, together with `hostNetwork` and `hostPID`.
  options:
    a:
      en: |
        `shareProcessNamespace` shares one process namespace between the containers of the same Pod. It weakens isolation between those containers, not between the Pod and the node, and it cannot be combined with `hostPID`.
    b:
      en: |
        Disabling the automatic token mount removes an API credential from the Pod. It reduces exposure.
    d:
      en: |
        `fsGroup` sets the supplementary group that owns the Pod's volumes. It gives no access to node resources.
references:
  - title: "Pod"
    url: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/
  - title: "Share Process Namespace between Containers in a Pod"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/
