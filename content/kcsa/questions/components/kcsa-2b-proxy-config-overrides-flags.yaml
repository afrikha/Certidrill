id: kcsa-2b-proxy-config-overrides-flags
objective: "2.6.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An auditor checks the command line of kube-proxy on a node:

    ```bash
    kube-proxy --config=/var/lib/kube-proxy/config.conf \
      --metrics-bind-address=127.0.0.1:10249
    ```

    The file `config.conf` sets `metricsBindAddress: 0.0.0.0:10249`. On which address does the metrics server of kube-proxy listen?
body:
  options:
    - id: a
      text: { en: "`127.0.0.1:10249`, because command-line flags override the file" }
    - id: b
      text: { en: "Both addresses, because kube-proxy merges the two settings" }
    - id: c
      text: { en: "Neither address, because kube-proxy refuses conflicting settings" }
    - id: d
      text: { en: "`0.0.0.0:10249`, because the flag is ignored when `--config` is set" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The kube-proxy reference states that `--metrics-bind-address`, like `--healthz-bind-address`, `--nodeport-addresses` and `--proxy-mode`, is ignored when a configuration file is given with `--config`. The file is the source of truth, so the metrics endpoint is exposed on all interfaces. An audit of kube-proxy must read its configuration file or ConfigMap, not only its flags.
  options:
    a:
      en: |
        For these settings it is the opposite: when `--config` is set, the flag is ignored and the file value applies.
    b:
      en: |
        kube-proxy does not merge the two values. One metrics bind address is used, taken from the configuration file.
    c:
      en: |
        kube-proxy starts normally. It simply ignores the flag, which makes the misconfiguration easy to miss.
references:
  - title: "kube-proxy"
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-proxy/
