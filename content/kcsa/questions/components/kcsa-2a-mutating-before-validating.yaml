id: kcsa-2a-mutating-before-validating
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In namespace `shop`, a mutating admission webhook injects a logging sidecar container into every new Pod. A ValidatingAdmissionPolicy in the same namespace rejects Pods that have a container without CPU and memory limits. The injected sidecar has no limits. A Deployment's ReplicaSet tries to create a Pod whose application container has limits. What happens?
body:
  options:
    - id: a
      text: { en: "The Pod is admitted, because validation only checks the object as the client submitted it" }
    - id: b
      text: { en: "The Pod is rejected, because validating admission runs after mutation and sees the sidecar" }
    - id: c
      text: { en: "The Pod is admitted, because objects created by controllers skip validating admission" }
    - id: d
      text: { en: "The Pod is admitted without the sidecar, because the policy removes non-compliant containers" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Admission runs in two phases: mutating controllers first, then validating controllers. The validating policy therefore evaluates the final object, including the injected sidecar, and rejects it because one container has no limits. If any admission controller rejects the request, the whole request is rejected immediately.
  options:
    a:
      en: |
        Validating admission runs after mutating admission precisely so that it checks the object that will be stored, not the original submission.
    c:
      en: |
        Controllers are API clients like any other. Their requests go through authentication, authorization and admission.
    d:
      en: |
        Validating admission can only accept or reject a request. It never changes the object; changing objects is the job of mutating admission.
references:
  - title: Admission Control in Kubernetes
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
