id: kcsa-2c-auth-whoami
objective: "2.10.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your cluster authenticates users with OIDC and takes their groups from the identity provider. You want to see the username and the groups that the API server assigns to your current credentials. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl auth whoami`" }
    - id: b
      text: { en: "`kubectl auth can-i --list`" }
    - id: c
      text: { en: "`kubectl config view --minify`" }
    - id: d
      text: { en: "`kubectl get rolebindings --all-namespaces`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl auth whoami` uses the SelfSubjectReview API: the API server returns the username, UID, groups and extra attributes it maps your credentials to after all authenticators have run. This is useful to troubleshoot complex authentication flows and to confirm which identity RBAC will evaluate.
  options:
    b:
      en: |
        `kubectl auth can-i --list` shows the actions you are allowed to perform in a namespace, not your username and groups.
    c:
      en: |
        This shows the local kubeconfig entries for the current context. It does not tell you how the API server interprets the credential.
    d:
      en: |
        Listing bindings shows which subjects have roles, but not which identity your credentials map to; it may also be denied to you.
references:
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
