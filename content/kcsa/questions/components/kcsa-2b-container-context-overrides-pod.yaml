id: kcsa-2b-container-context-overrides-pod
objective: "2.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod has this spec:

    ```yaml
    spec:
      securityContext:
        runAsUser: 1000
      containers:
      - name: app
        image: registry.example.com/shop/app:1.0
      - name: sidecar
        image: registry.example.com/shop/sidecar:1.0
        securityContext:
          runAsUser: 2000
    ```

    As which user ID do the processes of the `sidecar` container run?
body:
  options:
    - id: a
      text: { en: "UID 1000, because the Pod-level setting applies to all containers" }
    - id: b
      text: { en: "UID 2000, because the container-level setting overrides the Pod level" }
    - id: c
      text: { en: "UID 0, because the two settings conflict" }
    - id: d
      text: { en: "UID 1000 for the main process and UID 2000 for its child processes" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Settings in the Pod `securityContext` apply to every container, but settings in a container's `securityContext` apply to that container only and override the Pod level where both are set. The `sidecar` container runs as UID 2000, and the `app` container as UID 1000.
  options:
    a:
      en: |
        The Pod-level value applies only to containers that do not set their own value, such as `app` here.
    c:
      en: |
        There is no conflict: the container value takes precedence. Kubernetes never falls back to root because of two values.
    d:
      en: |
        One `runAsUser` value applies to the container's processes. Child processes keep the user of their parent unless they change it themselves.
references:
  - title: "Configure a Security Context for a Pod or Container"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
