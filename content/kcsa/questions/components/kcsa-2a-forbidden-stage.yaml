id: kcsa-2a-forbidden-stage
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer runs `kubectl get pods -n payments` and receives this error:

    ```text
    Error from server (Forbidden): pods is forbidden: User "dev-anna" cannot list resource "pods" in API group "" in the namespace "payments"
    ```

    Which stage of API request processing rejected the call?
body:
  options:
    - id: a
      text: { en: "Authentication" }
    - id: b
      text: { en: "Mutating admission" }
    - id: c
      text: { en: "Validating admission" }
    - id: d
      text: { en: "Authorization" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The message names the user `dev-anna`, so authentication succeeded. The API server then found that no authorizer allows this user to `list` Pods in `payments` and returned 403 Forbidden, which is the authorization verdict. The fix is an RBAC Role and RoleBinding, if the access is legitimate.
  options:
    a:
      en: |
        A failed authentication returns 401 Unauthorized and the API server would not know the user name. Here the user was identified.
    b:
      en: |
        Admission controllers do not act on read requests such as `list`; reads bypass the admission layer entirely.
    c:
      en: |
        Validating admission also never sees `get`, `list` or `watch` requests. A 403 on a read is always an authorization decision.
references:
  - title: Controlling Access to the Kubernetes API
    url: https://kubernetes.io/docs/concepts/security/controlling-access/
  - title: Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
