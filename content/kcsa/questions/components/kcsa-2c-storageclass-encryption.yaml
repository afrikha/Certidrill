id: kcsa-2c-storageclass-encryption
objective: "2.11.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The CSI driver of your storage backend can encrypt volumes at rest when it provisions them. Every new volume requested by the `payments` team must be encrypted. Where is this option normally set?
body:
  options:
    - id: a
      text: { en: "In the Pod `securityContext`, through the `fsGroup` field" }
    - id: b
      text: { en: "In the `parameters` of the StorageClass that the team's claims use" }
    - id: c
      text: { en: "In an EncryptionConfiguration entry for `persistentvolumeclaims`" }
    - id: d
      text: { en: "In the `accessModes` field of each PersistentVolumeClaim" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A StorageClass names the provisioner (the CSI driver) and passes it `parameters`, which are specific to each driver. Backend features such as encryption at rest are usually enabled there, so every volume dynamically provisioned for claims that use this class gets them. The parameter names are documented by each driver.
  options:
    a:
      en: |
        `fsGroup` sets the group ownership of volume files for the Pod's processes. It does not encrypt anything.
    c:
      en: |
        An EncryptionConfiguration encrypts API objects stored in etcd, not the data written to volumes.
    d:
      en: |
        Access modes describe how a volume can be mounted (single node, many nodes, one Pod); they have no encryption setting.
references:
  - title: "Storage Classes"
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
