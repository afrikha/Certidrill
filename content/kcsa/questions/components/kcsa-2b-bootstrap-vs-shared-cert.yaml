id: kcsa-2b-bootstrap-vs-shared-cert
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp copies the same client certificate and kubeconfig onto every new worker node. A security review recommends kubelet TLS bootstrapping instead. Which security benefit does bootstrapping provide?
body:
  options:
    - id: a
      text: { en: "Kubelets need no certificate, because the API server trusts node IP addresses" }
    - id: b
      text: { en: "Each kubelet obtains its own node certificate, so controls can limit each node separately" }
    - id: c
      text: { en: "Each kubelet receives `cluster-admin` rights until its node becomes ready" }
    - id: d
      text: { en: "Kubelets sign their own client certificates, so no cluster CA key is needed" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With bootstrapping, the kubelet starts with a low-privilege bootstrap token that only lets it submit a CertificateSigningRequest. Once approved, the CSR is signed with the cluster CA and gives the kubelet its own identity, `system:node:<nodeName>`. With a shared certificate, every node has the same identity: the Node authorizer and NodeRestriction cannot tell nodes apart, and one stolen copy works for every node.
  options:
    a:
      en: |
        The API server authenticates kubelets with credentials such as client certificates or tokens. A node IP address is not an authentication method.
    c:
      en: |
        The bootstrap credential is deliberately minimal: through the `system:node-bootstrapper` ClusterRole it can only create and retrieve CSRs.
    d:
      en: |
        The client certificate is signed by the kube-controller-manager with the cluster CA after the CSR is approved. The kubelet does not sign its own client certificate.
references:
  - title: "TLS bootstrapping"
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-tls-bootstrapping/
  - title: "Using Node Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/node/
