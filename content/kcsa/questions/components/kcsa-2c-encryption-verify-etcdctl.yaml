id: kcsa-2c-encryption-verify-etcdctl
objective: "2.8.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You configured encryption at rest for Secrets with the `aescbc` provider and rewrote the existing Secrets. How can you verify that the Secret `db-creds` in the `payments` namespace is really stored encrypted?
body:
  options:
    - id: a
      text: { en: "Run `kubectl get secret db-creds -n payments -o yaml` and check that `data` is unreadable" }
    - id: b
      text: { en: "Run `kubectl describe secret db-creds -n payments` and look for an `Encrypted` condition" }
    - id: c
      text: { en: "Read the Secret's key with `etcdctl` and look for a `k8s:enc:aescbc:v1:` prefix" }
    - id: d
      text: { en: "Check that the Secret's `type` field changed from `Opaque` to an encrypted type" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Encryption at rest is visible only in etcd. Reading the key directly with `etcdctl` should show a value that starts with `k8s:enc:aescbc:v1:` followed by the key name from the EncryptionConfiguration; plain text Secret data would mean the object is not encrypted.
  options:
    a:
      en: |
        The kube-apiserver decrypts resources when it reads them from etcd, so `kubectl` always returns the same base64-encoded data, encrypted at rest or not.
    b:
      en: |
        Secrets have no condition or status that reports encryption at rest; `kubectl describe` shows the same data whatever the storage format.
    d:
      en: |
        The `type` of a Secret describes its content (for example `kubernetes.io/tls`). Encryption at rest never changes it.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
