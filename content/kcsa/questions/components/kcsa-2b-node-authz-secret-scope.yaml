id: kcsa-2b-node-authz-secret-scope
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The API server of a cluster runs with `--authorization-mode=Node,RBAC`. An attacker steals the kubelet credential of the node `worker-3`. With the Node authorizer, which Secrets can the attacker read with that credential?
body:
  options:
    - id: a
      text: { en: "Every Secret in the `kube-system` namespace" }
    - id: b
      text: { en: "Only the Secrets referenced by Pods that are bound to `worker-3`" }
    - id: c
      text: { en: "Every Secret in each namespace that has a Pod on `worker-3`" }
    - id: d
      text: { en: "No Secret at all, because kubelets never read Secrets from the API" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Node authorizer lets a kubelet read Secrets, ConfigMaps, PersistentVolumeClaims and PersistentVolumes only when they are related to Pods bound to the kubelet's own node. A stolen kubelet credential therefore exposes only the Secrets used by the workloads on that node, which limits the blast radius of a node compromise.
  options:
    a:
      en: |
        The Node authorizer grants no namespace-wide access. A Secret in `kube-system` is readable only if a Pod bound to `worker-3` references it.
    c:
      en: |
        The scope is the Pod reference, not the namespace. Other Secrets in the same namespace stay unreadable for this kubelet.
    d:
      en: |
        A kubelet must fetch the Secrets that its Pods mount as volumes or use as environment variables, so the Node authorizer allows those reads.
references:
  - title: "Using Node Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/node/
