id: kcsa-2a-kubelet-flag-overrides
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The kubelet configuration file `/var/lib/kubelet/config.yaml` sets `authentication.anonymous.enabled: false`. The kubelet's service unit starts it like this:

    ```text
    ExecStart=/usr/bin/kubelet --config=/var/lib/kubelet/config.yaml \
      --kubeconfig=/etc/kubernetes/kubelet.conf --anonymous-auth=true
    ```

    Does the kubelet accept anonymous requests?
body:
  options:
    - id: a
      text: { en: "No, because the configuration file takes precedence over deprecated flags" }
    - id: b
      text: { en: "No, because anonymous requests are refused whenever Webhook authentication is on" }
    - id: c
      text: { en: "Only on the read-only port, because the main API always uses the file" }
    - id: d
      text: { en: "Yes, because command-line flags override values from the configuration file" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The kubelet loads its initial configuration from the `--config` file, and command-line flags override the values of that file. `--anonymous-auth=true` therefore re-enables anonymous access. Audit the kubelet's full command line, not only its configuration file, and remove deprecated security flags.
  options:
    a:
      en: |
        Deprecated flags still work and take precedence over the configuration file. Deprecation only means they should be moved into the file.
    b:
      en: |
        Webhook token authentication and anonymous authentication can both be enabled. Requests that no authenticator rejects are then treated as anonymous.
    c:
      en: |
        `--anonymous-auth` applies to the kubelet's main HTTPS API. The read-only port has no authentication at all, whatever this setting.
references:
  - title: kubelet
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
