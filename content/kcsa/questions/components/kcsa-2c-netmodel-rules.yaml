id: kcsa-2c-netmodel-rules
objective: "2.9.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the Kubernetes network model?
body:
  options:
    - id: a
      text: { en: "Pods share the IP address of their node, and other Pods reach them through mapped host ports" }
    - id: b
      text: { en: "Each Pod has its own cluster-wide unique IP address and can reach any other Pod without NAT" }
    - id: c
      text: { en: "Pods reach Pods on other nodes only through a Service, which translates each connection" }
    - id: d
      text: { en: "Each namespace gets an isolated Pod network, and cross-namespace traffic needs a gateway" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the Kubernetes network model, every Pod gets its own unique cluster-wide IP address, and all Pods can communicate with all other Pods, on the same node or on other nodes, directly and without proxies or NAT. Agents on a node, such as the kubelet, can also reach all Pods on that node. This flat, open network is why isolation must be added with NetworkPolicy.
  options:
    a:
      en: |
        Port mapping on a shared host IP is the model of standalone container engines. Kubernetes gives each Pod its own IP address.
    c:
      en: |
        Services provide stable virtual IPs and load balancing, but Pods can reach each other's IP addresses directly without any Service.
    d:
      en: |
        Namespaces do not create separate networks. A Pod can reach Pods in every namespace unless a NetworkPolicy restricts it.
references:
  - title: "Services, Load Balancing, and Networking"
    url: https://kubernetes.io/docs/concepts/services-networking/
