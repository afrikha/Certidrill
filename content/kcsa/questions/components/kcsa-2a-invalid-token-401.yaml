id: kcsa-2a-invalid-token-401
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The kube-apiserver has token authentication configured and anonymous access enabled. A script sends a request with an invalid bearer token. What does the API server do with this request?
body:
  options:
    - id: a
      text: { en: "It treats the request as `system:anonymous` and lets RBAC decide" }
    - id: b
      text: { en: "It rejects the request with 401 Unauthorized at the authentication stage" }
    - id: c
      text: { en: "It authenticates the request and rejects it with 403 Forbidden" }
    - id: d
      text: { en: "It forwards the request to admission control, which rejects it" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Anonymous access only applies to requests that no authenticator rejects, such as a request with no token at all. A request that presents a bearer token that fails authentication is rejected by the token authenticator with 401 Unauthorized; it is not downgraded to an anonymous request.
  options:
    a:
      en: |
        Only requests without credentials are treated as anonymous. An invalid token is actively rejected by the token authenticator.
    c:
      en: |
        403 is an authorization verdict for an identified caller. This request never gets an identity, so it never reaches authorization.
    d:
      en: |
        Admission control runs only after authentication and authorization succeed, and only for write requests.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
  - title: Controlling Access to the Kubernetes API
    url: https://kubernetes.io/docs/concepts/security/controlling-access/
