id: kcsa-2b-rotate-client-cert
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The kubelets of a cluster authenticate to the API server with client certificates that are valid for one year. You want each kubelet to request a new client certificate automatically as its current one approaches expiry. Which kubelet configuration setting enables this?
body:
  options:
    - id: a
      text: { en: "`serverTLSBootstrap: true`" }
    - id: b
      text: { en: "`readOnlyPort: 0`" }
    - id: c
      text: { en: "`authentication.webhook.enabled: true`" }
    - id: d
      text: { en: "`rotateCertificates: true`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `rotateCertificates: true`, the kubelet creates a new CertificateSigningRequest as its client certificate nears expiry and switches to the new certificate. Renewals can be approved automatically when the `system:nodes` group is bound to the `selfnodeclient` approval ClusterRole. Short-lived, renewed certificates reduce the value of a stolen key.
  options:
    a:
      en: |
        `serverTLSBootstrap` makes the kubelet request and rotate its serving certificate, used by its own HTTPS API, not the client certificate it presents to the API server.
    b:
      en: |
        `readOnlyPort: 0` disables the unauthenticated read-only port of the kubelet. It does not affect certificates.
    c:
      en: |
        Webhook authentication lets the kubelet validate bearer tokens sent to its own API through the TokenReview API. It does not renew any certificate.
references:
  - title: "TLS bootstrapping"
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-tls-bootstrapping/
