id: kcsa-2c-encryption-key-backup
objective: "2.8.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Secrets are encrypted at rest with the `secretbox` provider, and the key exists only in the EncryptionConfiguration file on the control plane hosts. All control plane hosts are lost. You restore the latest etcd snapshot onto new hosts that use a newly generated EncryptionConfiguration. Reads of Secrets now fail with errors. What should the backup plan have included?
body:
  options:
    - id: a
      text: { en: "Snapshots taken with `--peer-auto-tls` so that they can be restored on any host" }
    - id: b
      text: { en: "A secure backup of the encryption key, stored separately from the etcd snapshots" }
    - id: c
      text: { en: "Turning off encryption at rest before each snapshot so that backups stay readable" }
    - id: d
      text: { en: "Copies of the etcd snapshots on every worker node, next to the kubelet configuration" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Encrypted resources can be read only with the key that encrypted them; when no provider can decrypt stored data, the API server returns an error for that resource. The Kubernetes documentation asks you to make a secure backup of each encryption key, because losing all copies means deleting the resources encrypted with it. Keeping the key apart from the snapshots also means that a stolen snapshot alone cannot be decrypted.
  options:
    a:
      en: |
        `--peer-auto-tls` is an etcd server flag for self-signed peer certificates. It has nothing to do with snapshots or with the encryption key.
    c:
      en: |
        Disabling encryption would leave every snapshot with readable Secret data, which defeats the purpose of encryption at rest.
    d:
      en: |
        Spreading snapshots to worker nodes exposes the whole cluster state to any compromised node and still does not provide the missing key.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
