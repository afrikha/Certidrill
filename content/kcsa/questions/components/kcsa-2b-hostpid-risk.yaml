id: kcsa-2b-hostpid-risk
objective: "2.7.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod spec sets `hostPID: true`. What does this setting give the Pod's containers?
body:
  options:
    - id: a
      text: { en: "Access to the node's network interfaces and ports" }
    - id: b
      text: { en: "Shared System V IPC and shared memory with the node" }
    - id: c
      text: { en: "Read and write access to the node's root filesystem" }
    - id: d
      text: { en: "Visibility of every process running on the node" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `hostPID: true` makes the Pod use the host's PID namespace: its containers see every process on the node, including those of other containers, and with enough privileges they can inspect or signal them. The Baseline Pod Security Standard forbids sharing host namespaces.
  options:
    a:
      en: |
        Access to the node's network namespace comes from `hostNetwork: true`.
    b:
      en: |
        Sharing the node's IPC namespace comes from `hostIPC: true`.
    c:
      en: |
        Access to node files comes from a `hostPath` volume. It is a volume, not a namespace setting.
references:
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: "Pod"
    url: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/
