id: kcsa-2a-anonymous-health-only
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A load balancer probes the kube-apiserver health endpoints without credentials. Every other endpoint must refuse unauthenticated requests, even if someone later binds a role to the `system:unauthenticated` group by mistake. What should you configure?
body:
  options:
    - id: a
      text: { en: "Start the API server with `--anonymous-auth=false`" }
    - id: b
      text: { en: "Bind `system:unauthenticated` to a ClusterRole that allows only the health paths" }
    - id: c
      text: { en: "Add a ValidatingAdmissionPolicy that rejects requests from `system:anonymous`" }
    - id: d
      text: { en: "Add an AuthenticationConfiguration whose `anonymous` section allows only the health paths" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `anonymous` section of the AuthenticationConfiguration file (stable since v1.34) can list conditions such as `/livez`, `/readyz` and `/healthz`. Only those paths accept anonymous requests; other endpoints are not reachable anonymously even if authorization would allow it. When this section is used, `--anonymous-auth` cannot also be set.
  options:
    a:
      en: |
        Disabling anonymous authentication entirely makes the load balancer's unauthenticated probes fail with 401.
    b:
      en: |
        With a ClusterRoleBinding, anonymous requests are still authenticated on every endpoint and only authorization limits them. A later binding by mistake would open more endpoints, which the requirement forbids.
    c:
      en: |
        Admission controllers do not see read requests such as the probes or `get` calls, so they cannot enforce anonymous access rules.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
