id: kcsa-2b-kube-proxy-service-rules
objective: "2.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which component, running on every node, watches Service and EndpointSlice objects and configures the node so that traffic sent to a Service's ClusterIP reaches one of its backend Pods?
body:
  options:
    - id: a
      text: { en: "kube-proxy" }
    - id: b
      text: { en: "The kubelet" }
    - id: c
      text: { en: "CoreDNS" }
    - id: d
      text: { en: "The cloud-controller-manager" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      kube-proxy implements the virtual IP mechanism of Services. For each Service it configures the node, for example with iptables or nftables rules, to capture traffic sent to the ClusterIP and port and redirect it to one of the Service's endpoints. Because it shapes all Service traffic on the node, its configuration and image must be protected.
  options:
    b:
      en: |
        The kubelet runs the Pods assigned to its node through the container runtime. It does not program Service forwarding rules.
    c:
      en: |
        CoreDNS resolves Service names to their ClusterIPs. It does not forward the traffic sent to those addresses.
    d:
      en: |
        The cloud-controller-manager creates cloud load balancers for `LoadBalancer` Services. It does not program packet rules on each node.
references:
  - title: "Virtual IPs and Service Proxies"
    url: https://kubernetes.io/docs/reference/networking/virtual-ips/
