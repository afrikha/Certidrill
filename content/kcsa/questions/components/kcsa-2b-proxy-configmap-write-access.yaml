id: kcsa-2b-proxy-configmap-write-access
objective: "2.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    kube-proxy runs as a DaemonSet in `kube-system` and reads its KubeProxyConfiguration from the `kube-proxy` ConfigMap. Who should be allowed to modify this ConfigMap?
body:
  options:
    - id: a
      text: { en: "Every namespace administrator, so that they can tune their own Services" }
    - id: b
      text: { en: "The kube-proxy ServiceAccount, so that it can update its own settings" }
    - id: c
      text: { en: "Only the cluster administrators, through tightly scoped RBAC" }
    - id: d
      text: { en: "All authenticated users, because the ConfigMap holds no credential" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The ConfigMap decides how a privileged component behaves on every node: proxy mode, metrics and health bind addresses, and the node addresses that serve NodePort Services. Whoever can change it can expose endpoints on all interfaces or alter traffic handling cluster-wide, so only cluster administrators should have write access.
  options:
    a:
      en: |
        The configuration is shared by every node and every Service. Letting namespace administrators change it gives them power over the whole cluster.
    b:
      en: |
        kube-proxy only needs to read its configuration. Write access would let a compromised kube-proxy make lasting changes.
    d:
      en: |
        A file does not need to contain a credential to be sensitive. Changing it changes the behavior of a privileged component on every node.
references:
  - title: "kube-proxy"
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-proxy/
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
