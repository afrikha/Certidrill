id: kcsa-2c-shared-storageclass-delete
objective: "2.11.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Several tenants, each in its own namespace, use the same StorageClass for dynamically provisioned volumes. A PersistentVolume released by one tenant must never be reused by another namespace with the old data on it. Which StorageClass setting should you use?
body:
  options:
    - id: a
      text: { en: "`reclaimPolicy: Retain`" }
    - id: b
      text: { en: "`reclaimPolicy: Recycle`" }
    - id: c
      text: { en: "`volumeBindingMode: WaitForFirstConsumer`" }
    - id: d
      text: { en: "`reclaimPolicy: Delete`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `Delete`, removing the claim deletes both the PersistentVolume and the storage asset in the backend, so the data cannot reach another tenant. The Kubernetes multi-tenancy guidance recommends this reclaim policy for a shared StorageClass. `Delete` is also the default when a StorageClass sets no reclaim policy.
  options:
    a:
      en: |
        `Retain` keeps the volume in the `Released` state with the previous claimant's data on it until an administrator cleans it up: good for keeping data, bad for isolation.
    b:
      en: |
        A StorageClass accepts only `Delete` or `Retain`. `Recycle`, a basic scrub, is deprecated in favor of dynamic provisioning.
    c:
      en: |
        This setting delays binding and provisioning until a Pod uses the claim. It does not decide what happens to the data afterward.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
  - title: "Persistent Volumes"
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
