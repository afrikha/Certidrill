id: kcsa-2b-node-credential-identity
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator enables the Node authorizer and the NodeRestriction admission plugin. Which identity must each kubelet's credential carry so that both controls apply to it?
body:
  options:
    - id: a
      text: { en: "The user `system:node:<nodeName>` in the group `system:nodes`" }
    - id: b
      text: { en: "The user `system:kubelet` in the group `system:masters`" }
    - id: c
      text: { en: "The ServiceAccount `kubelet` in the `kube-system` namespace" }
    - id: d
      text: { en: "Any user in the group `system:authenticated`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Both controls recognize a kubelet only when its credential places it in the `system:nodes` group with the user name `system:node:<nodeName>`, where `<nodeName>` matches exactly the name of the registered node. The node name in the identity is what lets them limit each kubelet to its own Node object and to the Pods bound to it. Kubelets with other identities are not authorized by the Node mode and are ignored by NodeRestriction.
  options:
    b:
      en: |
        `system:masters` is a superuser group: a kubelet in it would turn any node compromise into a cluster compromise. The Node authorizer does not use this identity.
    c:
      en: |
        Kubelets authenticate with node credentials, usually client certificates, not with a ServiceAccount. The Node authorizer does not recognize a ServiceAccount as a node.
    d:
      en: |
        `system:authenticated` contains every authenticated caller. It carries no node name, so neither control could tell which node's objects the kubelet may access.
references:
  - title: "Using Node Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/node/
