id: kcsa-2c-netmodel-service-port-bypass
objective: "2.9.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `billing` Pods listen on port 8080 for the application and on port 9090 for an unauthenticated admin API. Their ClusterIP Service exposes only port 8080. There is no NetworkPolicy in the cluster. Can a Pod in another namespace reach the admin API?
body:
  options:
    - id: a
      text: { en: "Yes, by connecting directly to a `billing` Pod IP on port 9090" }
    - id: b
      text: { en: "No, because Pods accept only traffic sent through their Service" }
    - id: c
      text: { en: "No, because kube-proxy drops traffic to ports a Service does not list" }
    - id: d
      text: { en: "Only from a Pod running on the same node as the `billing` Pod" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In the Kubernetes network model every Pod has its own IP address and all Pods can communicate directly, without proxies or NAT. A Service only provides a stable virtual IP and load balancing for the ports it lists; it is not an access control. Restricting who may reach port 9090 requires a NetworkPolicy enforced by the network plugin, or authentication on the admin API itself.
  options:
    b:
      en: |
        Pod IPs are directly reachable from any other Pod; nothing forces traffic to go through a Service.
    c:
      en: |
        kube-proxy only handles traffic sent to Service virtual IPs. Traffic to a Pod IP does not depend on Service definitions.
    d:
      en: |
        Pods reach Pods on any node, not only on their own.
references:
  - title: "Services, Load Balancing, and Networking"
    url: https://kubernetes.io/docs/concepts/services-networking/
