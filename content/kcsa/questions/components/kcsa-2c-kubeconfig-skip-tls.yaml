id: kcsa-2c-kubeconfig-skip-tls
objective: "2.10.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A kubeconfig file used by a deployment script contains the cluster entry below. What is the security problem?

    ```yaml
    clusters:
    - name: prod
      cluster:
        server: https://api.prod.example.com:6443
        insecure-skip-tls-verify: true
    ```
body:
  options:
    - id: a
      text: { en: "The client cannot detect an impostor API server and may send it its credentials" }
    - id: b
      text: { en: "The API server stops verifying client certificates for requests from this script" }
    - id: c
      text: { en: "Traffic to the API server is sent unencrypted even though the URL uses `https`" }
    - id: d
      text: { en: "The API server skips authorization for this client, so RBAC no longer applies" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `insecure-skip-tls-verify` skips the validity check of the server's certificate, which makes the HTTPS connection insecure. The connection is still encrypted, but the client cannot tell the real API server from an attacker in the middle, who could capture the token or other credentials it sends. The cluster entry should carry the cluster CA in `certificate-authority` or `certificate-authority-data` instead.
  options:
    b:
      en: |
        The field is a client-side setting about the server's certificate. It does not change how the API server authenticates clients.
    c:
      en: |
        TLS is still negotiated; only the verification of the server's identity is skipped.
    d:
      en: |
        Authorization is decided by the API server for every request; no kubeconfig setting can turn it off.
references:
  - title: "kubeconfig (v1)"
    url: https://kubernetes.io/docs/reference/config-api/kubeconfig.v1/
