id: kcsa-2a-anonymous-403-meaning
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    From a laptop, you run this command without any credentials:

    ```bash
    curl -k https://api.example.com:6443/api/v1/namespaces
    ```

    The response contains:

    ```text
    "message": "namespaces is forbidden: User \"system:anonymous\" cannot list resource \"namespaces\" in API group \"\" at the cluster scope",
    "reason": "Forbidden",
    "code": 403
    ```

    What does this response show?
body:
  options:
    - id: a
      text: { en: "The TLS handshake failed because the client skipped certificate verification" }
    - id: b
      text: { en: "Anonymous authentication is disabled on the API server" }
    - id: c
      text: { en: "The request was accepted as anonymous and then denied by authorization" }
    - id: d
      text: { en: "The API server runs with `--authorization-mode=AlwaysAllow`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With anonymous access enabled, a request that carries no credentials is given the user `system:anonymous` and the group `system:unauthenticated`. Authorization then found no rule that allows that identity to list namespaces and returned 403. The endpoint is still reachable anonymously, so it is worth disabling anonymous access or limiting it to health endpoints.
  options:
    a:
      en: |
        `-k` skips verification of the server certificate, but the connection succeeded: the API server answered with a JSON status.
    b:
      en: |
        If anonymous authentication were disabled, the unauthenticated request would be rejected with 401 Unauthorized, and no user name would appear.
    d:
      en: |
        `AlwaysAllow` approves every request, so the list would have succeeded instead of returning 403.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
  - title: kube-apiserver
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
