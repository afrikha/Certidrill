id: kcsa-2b-stolen-token-invalidate
objective: "2.7.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker copied the token from `/var/run/secrets/kubernetes.io/serviceaccount/token` in a running Pod. The kubelet obtained this token through the TokenRequest API. Which action invalidates the stolen token right away?
body:
  options:
    - id: a
      text: { en: "Delete the Pod that the token is bound to" }
    - id: b
      text: { en: "Delete the token file inside the container" }
    - id: c
      text: { en: "Restart the kubelet on the Pod's node" }
    - id: d
      text: { en: "Set `automountServiceAccountToken: false` on the ServiceAccount" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A projected token is bound to its Pod: deleting the Pod expires its bound tokens, and there is no other specific mechanism to revoke a token issued through TokenRequest. Otherwise the token stays valid until it expires (one hour by default) or until the ServiceAccount is deleted. Short lifetimes and least-privilege roles limit what a stolen token can do meanwhile.
  options:
    b:
      en: |
        The attacker's copy is still a valid token. Removing the file in the container revokes nothing.
    c:
      en: |
        Restarting the kubelet does not revoke tokens that the API server has already issued.
    d:
      en: |
        This setting affects whether future Pods get a token mounted. Tokens that were already issued stay valid.
references:
  - title: "Managing Service Accounts"
    url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
  - title: "Configure Service Accounts for Pods"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
