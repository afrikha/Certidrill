id: kcsa-2a-scheduler-authn-kubeconfig
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    kube-scheduler runs without `--authentication-kubeconfig`. A monitoring agent calls `https://127.0.0.1:10259/metrics` with a valid ServiceAccount bearer token. How does kube-scheduler handle the token?
body:
  options:
    - id: a
      text: { en: "It validates the token locally against the cluster CA certificate" }
    - id: b
      text: { en: "It does not validate the token and treats the request as anonymous" }
    - id: c
      text: { en: "It forwards the token to the kubelet of the node for validation" }
    - id: d
      text: { en: "It validates the token through TokenReview with its default credential" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      kube-scheduler delegates token authentication to the API server with TokenReview, using the kubeconfig given in `--authentication-kubeconfig`. If that flag is empty, all token requests are considered anonymous, so callers cannot be identified and authorization cannot grant them access by identity. Setting both the authentication and authorization kubeconfigs is part of hardening the scheduler.
  options:
    a:
      en: |
        ServiceAccount tokens are not validated with the cluster CA certificate, and kube-scheduler does not validate tokens locally.
    c:
      en: |
        kube-scheduler never calls the kubelet. Token validation, when configured, is done by the API server.
    d:
      en: |
        TokenReview is used only when `--authentication-kubeconfig` points to a kubeconfig with rights to create TokenReviews. Without it, there is no delegation.
references:
  - title: kube-scheduler
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-scheduler/
