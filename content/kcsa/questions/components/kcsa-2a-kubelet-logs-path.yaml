id: kcsa-2a-kubelet-logs-path
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user runs `kubectl logs web-0 -n shop`. Which component opens the connection to the kubelet API of the node that runs `web-0`?
body:
  options:
    - id: a
      text: { en: "kubectl, directly from the user's workstation" }
    - id: b
      text: { en: "kube-scheduler, which knows where the Pod runs" }
    - id: c
      text: { en: "kube-apiserver, on behalf of the user" }
    - id: d
      text: { en: "kube-proxy on the node that runs the Pod" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      kubectl sends the request to kube-apiserver, which authorizes it and then connects to the kubelet's HTTPS API to fetch the logs; `exec`, `attach` and port forwarding work the same way. This is why the kubelet API must accept the API server and why the API server should verify the kubelet's serving certificate.
  options:
    a:
      en: |
        kubectl talks only to the API server. Users do not need, and should not have, network access to the kubelet port of the nodes.
    b:
      en: |
        kube-scheduler only binds Pods to nodes. It does not serve logs or call kubelets.
    d:
      en: |
        kube-proxy implements Service traffic rules. It is not involved in fetching container logs.
references:
  - title: Communication between Nodes and the Control Plane
    url: https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/
