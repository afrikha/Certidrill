id: kcsa-2a-ignored-during-execution
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    PCI Pods use a required node affinity on the node label `pool=pci`, and PCI nodes carry a `NoSchedule` taint that only PCI Pods tolerate. To reuse node `pci-3` for general workloads, an administrator removes its `pool=pci` label and its taint. An hour later, PCI Pods are still running on `pci-3`, next to new general workloads. Why, and what should the administrator have done?
body:
  options:
    - id: a
      text: { en: "The scheduler refreshes node labels only every few hours; wait before reusing the node" }
    - id: b
      text: { en: "Required affinity is checked only at scheduling time; evict the PCI Pods, for example by draining the node" }
    - id: c
      text: { en: "The PCI Pods tolerate the removed taint, which pins them to the node; delete their tolerations" }
    - id: d
      text: { en: "The kubelet restores the removed label at its next heartbeat; use a label the kubelet cannot set" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In `requiredDuringSchedulingIgnoredDuringExecution`, `IgnoredDuringExecution` means that if node labels change after the Pod is scheduled, the Pod keeps running. Removing a label or a `NoSchedule` taint never moves running Pods. Before changing a node's trust level, evict its Pods, for example by draining the node or with a `NoExecute` taint.
  options:
    a:
      en: |
        The scheduler sees label changes through the API server. The PCI Pods stay because running Pods are not re-evaluated against affinity rules, not because of a delay.
    c:
      en: |
        A toleration allows a Pod onto a tainted node; it never pins a Pod to a node. Removing tolerations does not evict running Pods either.
    d:
      en: |
        The label was removed and the problem is that running Pods ignore that change. Protected label prefixes stop kubelets from adding labels, which is not the issue here.
references:
  - title: Assigning Pods to Nodes
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
  - title: Taints and Tolerations
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
