id: kcsa-2c-lowpriv-impersonation
objective: "2.10.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Platform engineers sometimes need cluster-admin rights, but most of their daily work only reads cluster state. You want to reduce accidental changes while keeping a personal identity for each engineer. What does the Kubernetes RBAC guidance suggest?
body:
  options:
    - id: a
      text: { en: "Bind `cluster-admin` to each engineer and ask them to run `--dry-run=server` first" }
    - id: b
      text: { en: "Share one `system:masters` certificate that is kept in a break-glass safe" }
    - id: c
      text: { en: "Give each engineer a read-only kubeconfig plus SSH access to the control plane" }
    - id: d
      text: { en: "Give each engineer a low-privileged account allowed to impersonate an admin" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The RBAC good practices say that administrators should not use `cluster-admin` accounts except where specifically needed, and that a low-privileged account with impersonation rights can avoid accidental modification of cluster resources. Each engineer works as themselves and elevates explicitly, for example with `kubectl --as`, only when needed. The `impersonate` verb is itself powerful, so grant it narrowly.
  options:
    a:
      en: |
        A dry run is optional: every command still runs with full `cluster-admin` rights, so one mistake applies immediately.
    b:
      en: |
        A shared certificate removes personal accountability, and `system:masters` bypasses RBAC and cannot be revoked by removing bindings.
    c:
      en: |
        Root access on control plane hosts is far more powerful than `cluster-admin` and bypasses the API's authorization and audit.
references:
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
