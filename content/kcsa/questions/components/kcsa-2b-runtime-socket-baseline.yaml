id: kcsa-2b-runtime-socket-baseline
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You need to make sure that no Pod in the namespace `apps` can mount the container runtime socket of its node. Which built-in control achieves this?
body:
  options:
    - id: a
      text: { en: "Set `automountServiceAccountToken: false` on the namespace's ServiceAccounts" }
    - id: b
      text: { en: "Label the namespace with `pod-security.kubernetes.io/enforce: baseline`" }
    - id: c
      text: { en: "Apply a default-deny NetworkPolicy to the namespace" }
    - id: d
      text: { en: "Label the namespace with `pod-security.kubernetes.io/warn: privileged`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The runtime socket is a file on the node, so a Pod can reach it only through a `hostPath` volume. The Baseline Pod Security Standard forbids `hostPath` volumes, and the `enforce` mode makes Pod Security Admission reject Pods that violate it. The Restricted profile, which includes Baseline, would block it too.
  options:
    a:
      en: |
        This setting controls whether an API token is mounted. It does not restrict which host files a Pod can mount.
    c:
      en: |
        NetworkPolicy filters IP traffic. The runtime socket is a local Unix socket on the node's filesystem, not a network endpoint.
    d:
      en: |
        The `warn` mode never rejects a Pod, and the Privileged profile allows every setting, so this label blocks nothing.
references:
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: "Volume Types"
    url: https://kubernetes.io/docs/reference/storage/volume-types/
