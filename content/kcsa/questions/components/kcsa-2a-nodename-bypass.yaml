id: kcsa-2a-nodename-bypass
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Pod spec field, when set at creation, makes the schedulers ignore the Pod so that the kubelet on the named node runs it directly?
body:
  options:
    - id: a
      text: { en: "`spec.nodeSelector`" }
    - id: b
      text: { en: "`spec.schedulerName`" }
    - id: c
      text: { en: "`spec.nodeName`" }
    - id: d
      text: { en: "`spec.tolerations`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      If `nodeName` is not empty, the scheduler ignores the Pod and the kubelet on the named node tries to run it; this overrules `nodeSelector` and affinity rules. Because it bypasses placement rules enforced by the scheduler, who may set `nodeName` on new Pods should be controlled with an admission policy.
  options:
    a:
      en: |
        `nodeSelector` is a constraint that the scheduler evaluates when it chooses a node. It does not bypass the scheduler.
    b:
      en: |
        `schedulerName` chooses which scheduler or profile places the Pod. The Pod is still scheduled, just by another scheduler.
    d:
      en: |
        Tolerations let the scheduler place a Pod on tainted nodes. They are evaluated by the scheduler, not a way around it.
references:
  - title: Assigning Pods to Nodes
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
