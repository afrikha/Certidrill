id: kcsa-2c-readonly-sidecar
objective: "2.11.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod has an `app` container that writes reports to a shared volume and an `uploader` sidecar that must only read them. You must prevent the sidecar from modifying the files. What should you configure?
body:
  options:
    - id: a
      text: { en: "The `ReadOnlyMany` access mode on the PersistentVolumeClaim" }
    - id: b
      text: { en: "`fsGroupChangePolicy: OnRootMismatch` in the Pod `securityContext`" }
    - id: c
      text: { en: "`readOnly: true` on the volume mount of the `uploader` container" }
    - id: d
      text: { en: "`readOnlyRootFilesystem: true` in the `app` container `securityContext`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Setting `readOnly: true` on a container's `volumeMounts` entry makes that mount read-only for that container. It does not make the volume itself read-only, so the `app` container can still mount it read-write and write its reports, which is exactly the required split.
  options:
    a:
      en: |
        Access modes are used to match claims and volumes; they do not enforce write protection once the storage is mounted. It would also be wrong for the `app` container, which must write.
    b:
      en: |
        This field only decides when the kubelet changes volume ownership and permissions for `fsGroup`; it gives no container read-only access.
    d:
      en: |
        This makes the `app` container's own root filesystem read-only. It affects neither mounted volumes nor the sidecar.
references:
  - title: "Volumes"
    url: https://kubernetes.io/docs/concepts/storage/volumes/
  - title: "Persistent Volumes"
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
