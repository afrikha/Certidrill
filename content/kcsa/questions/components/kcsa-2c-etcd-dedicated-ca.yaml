id: kcsa-2c-etcd-dedicated-ca
objective: "2.8.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In a self-managed cluster, etcd runs with `--client-cert-auth=true`. Its `--trusted-ca-file` points to the main cluster CA, which also signs the kubelet client certificates and the certificates issued to administrators. Which change does the Kubernetes security guidance recommend?
body:
  options:
    - id: a
      text: { en: "Enable etcd's built-in user and role authentication in addition to certificates" }
    - id: b
      text: { en: "Issue the etcd client and peer certificates from a CA used only for etcd" }
    - id: c
      text: { en: "Switch to `--auto-tls` so that etcd manages its own certificates" }
    - id: d
      text: { en: "Create a NetworkPolicy in `kube-system` that selects the etcd static Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      If etcd trusts the main cluster CA, any certificate signed by that CA, such as a kubelet's or an administrator's, is accepted as an etcd client and gets direct access to all cluster data, bypassing RBAC, admission and audit. The Kubernetes security checklist recommends mutual TLS with etcd using a certificate authority unique to etcd.
  options:
    a:
      en: |
        The Kubernetes documentation states that etcd authentication is not planned for Kubernetes, and it would not stop etcd from trusting certificates from the cluster CA.
    c:
      en: |
        Auto-TLS uses self-signed certificates that encrypt traffic but authenticate no one, which is weaker than the current setup.
    d:
      en: |
        In kubeadm clusters etcd runs on the host network, and network plugins usually do not apply podSelector rules to such Pods. Network rules also do not change which certificates etcd trusts.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
