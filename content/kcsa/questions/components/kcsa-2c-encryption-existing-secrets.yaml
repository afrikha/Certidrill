id: kcsa-2c-encryption-existing-secrets
objective: "2.8.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You configure an EncryptionConfiguration for `secrets` with the `secretbox` provider listed first, and restart the kube-apiserver. When you read Secrets directly from etcd, a Secret created after the restart is encrypted, but a Secret created last week is still stored in plain text. What should you do?
body:
  options:
    - id: a
      text: { en: "Move the `identity` provider to the top of the providers list" }
    - id: b
      text: { en: "Restart the etcd members so that they re-encrypt their stored keys" }
    - id: c
      text: { en: "Replace `secretbox` with `aescbc`, which also encrypts existing data" }
    - id: d
      text: { en: "Rewrite the existing Secrets through the API with `kubectl replace`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The first provider encrypts only what is written after the change; existing objects stay as they were stored. Rewriting every Secret through the API, for example `kubectl get secrets --all-namespaces -o json | kubectl replace -f -`, makes the API server store each one again with the new provider. You can then verify the `k8s:enc:` prefix with `etcdctl`.
  options:
    a:
      en: |
        With `identity` first, new writes are stored without encryption, so encryption at rest would be turned off.
    b:
      en: |
        Encryption is done by the kube-apiserver, not by etcd. Restarting etcd changes nothing in the stored values.
    c:
      en: |
        No provider rewrites existing data on its own, and `aescbc` is weaker than `secretbox` (it is not recommended because of padding oracle attacks).
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
