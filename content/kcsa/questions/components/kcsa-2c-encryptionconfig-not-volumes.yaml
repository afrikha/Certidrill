id: kcsa-2c-encryptionconfig-not-volumes
objective: "2.11.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The kube-apiserver uses an EncryptionConfiguration with a KMS v2 provider for `secrets`. A compliance officer concludes that the data a database Pod writes to its PersistentVolume is therefore encrypted at rest. Is this correct?
body:
  options:
    - id: a
      text: { en: "No: it covers API data in etcd; volume data is encrypted by the storage backend" }
    - id: b
      text: { en: "Yes: the kube-apiserver encrypts each write to a PersistentVolume with the KMS key" }
    - id: c
      text: { en: "Yes, but only for volumes that the container mounts with `readOnly: true`" }
    - id: d
      text: { en: "No, until `persistentvolumes` is added to the resources list of the configuration" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An EncryptionConfiguration controls how the kube-apiserver encrypts API resources that it writes to etcd. Data written by a container to a volume never passes through the API server. Encryption of volume data comes from the storage system, usually enabled through the CSI driver and the parameters of the StorageClass.
  options:
    b:
      en: |
        The API server is not in the data path between a container and its volume; it only stores API objects in etcd.
    c:
      en: |
        A read-only mount only stops that container from writing; it does not encrypt anything.
    d:
      en: |
        Listing `persistentvolumes` would encrypt the PersistentVolume API objects in etcd, not the files stored on the volume.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
  - title: "Storage Classes"
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
