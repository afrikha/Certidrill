id: kcsa-2b-kube-proxy-least-privilege-role
objective: "2.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An audit finds that the identity used by kube-proxy is bound to the `cluster-admin` ClusterRole. Which built-in ClusterRole grants the access that kube-proxy needs and should replace it?
body:
  options:
    - id: a
      text: { en: "`system:node`" }
    - id: b
      text: { en: "`system:node-proxier`" }
    - id: c
      text: { en: "`system:kube-controller-manager`" }
    - id: d
      text: { en: "`edit`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `system:node-proxier` allows access to the resources required by kube-proxy, and its default binding is to the `system:kube-proxy` user. kube-proxy mostly reads Services, EndpointSlices and Nodes. With `cluster-admin`, a compromise of kube-proxy, which already runs privileged on every node, becomes a compromise of the whole cluster.
  options:
    a:
      en: |
        `system:node` is the legacy role for kubelets and includes read access to all Secrets. kube-proxy needs none of that.
    c:
      en: |
        `system:kube-controller-manager` covers the many controllers of the controller manager. It is far broader than what kube-proxy uses.
    d:
      en: |
        `edit` allows creating and modifying most namespaced objects, including reading Secrets. kube-proxy needs none of these write rights.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
