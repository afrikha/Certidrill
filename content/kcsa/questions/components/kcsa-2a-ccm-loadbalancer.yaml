id: kcsa-2a-ccm-loadbalancer
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user creates a Service of `type: LoadBalancer` in a cluster that runs on a cloud provider with an external cloud-controller-manager. Which component calls the cloud provider's API to create the load balancer?
body:
  options:
    - id: a
      text: { en: "kube-proxy on each node" }
    - id: b
      text: { en: "The EndpointSlice controller in kube-controller-manager" }
    - id: c
      text: { en: "The service controller in cloud-controller-manager" }
    - id: d
      text: { en: "The kubelet on the node that runs the backend Pods" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The service controller of the cloud-controller-manager watches Services and calls the cloud provider's API to set up load balancers and related infrastructure when a Service requires them. It therefore holds cloud credentials that can create and delete load balancers, which must be scoped to what the cluster needs.
  options:
    a:
      en: |
        kube-proxy programs the node's packet rules for Services. It does not call any cloud API.
    b:
      en: |
        The EndpointSlice controller keeps the list of ready Pod endpoints of each Service. It does not create cloud resources.
    d:
      en: |
        The kubelet runs containers on its node. With an external cloud-controller-manager, cloud integration is not done by the kubelet.
references:
  - title: Cloud Controller Manager
    url: https://kubernetes.io/docs/concepts/architecture/cloud-controller/
