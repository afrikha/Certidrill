id: kcsa-2b-kube-proxy-daemonset-tamper
objective: "2.6.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An attacker obtains permission to update the `kube-proxy` DaemonSet in the `kube-system` namespace, but has no permission to read Secrets. What is the most serious impact?
body:
  options:
    - id: a
      text: { en: "None, because the RBAC role of kube-proxy cannot read or modify Secrets" }
    - id: b
      text: { en: "The attacker can affect only the Services of the `kube-system` namespace" }
    - id: c
      text: { en: "The attacker can run a privileged image of their choice on every node" }
    - id: d
      text: { en: "Nothing, because DaemonSets in `kube-system` cannot be modified" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Pod template of the kube-proxy DaemonSet runs with host networking and elevated privileges on every node. By changing its image or command, the attacker runs code of their choice with those privileges everywhere: they can redirect any Service's traffic, read credentials stored on the nodes and attack the rest of the cluster. Write access to kube-proxy's DaemonSet and ConfigMap must be limited to cluster administrators.
  options:
    a:
      en: |
        The RBAC role limits what kube-proxy can do through the API. A modified privileged Pod on every node does not need the API to reach node credentials and traffic.
    b:
      en: |
        kube-proxy programs the rules of all Services of the cluster, and the DaemonSet runs on every node, so the impact is not limited to one namespace.
    d:
      en: |
        Objects in `kube-system` are ordinary API objects. Anyone whom RBAC allows to update them can do so.
references:
  - title: "Virtual IPs and Service Proxies"
    url: https://kubernetes.io/docs/reference/networking/virtual-ips/
