id: kcsa-2a-kubelet-config-gap
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which change completes the hardening of this kubelet configuration?

    ```yaml
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    authentication:
      anonymous:
        enabled: false
      webhook:
        enabled: true
      x509:
        clientCAFile: /etc/kubernetes/pki/ca.crt
    authorization:
      mode: Webhook
    readOnlyPort: 10255
    ```
body:
  options:
    - id: a
      text: { en: "Set `readOnlyPort: 0`" }
    - id: b
      text: { en: "Set `authorization.mode: AlwaysAllow`" }
    - id: c
      text: { en: "Remove the `x509.clientCAFile` entry" }
    - id: d
      text: { en: "Set `authentication.webhook.enabled: false`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Anonymous access is off and requests are authenticated and authorized through the API server, but `readOnlyPort: 10255` still opens a port that serves kubelet data with no authentication or authorization. Setting it to `0` disables that port, which is also the configuration file's default.
  options:
    b:
      en: |
        `AlwaysAllow` would authorize every authenticated request, including exec into any container. It weakens the kubelet.
    c:
      en: |
        The client CA file lets the kubelet authenticate the API server's client certificate. Removing it breaks `exec` and `logs` through the API server rather than hardening anything.
    d:
      en: |
        Disabling token authentication only stops bearer-token clients such as monitoring agents from authenticating. The open read-only port remains.
references:
  - title: Kubelet Configuration (v1beta1)
    url: https://kubernetes.io/docs/reference/config-api/kubelet-config.v1beta1/
  - title: Kubelet authentication/authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
