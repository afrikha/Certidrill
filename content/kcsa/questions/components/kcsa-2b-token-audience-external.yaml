id: kcsa-2b-token-audience-external
objective: "2.7.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Pod must authenticate to an external secrets service that accepts Kubernetes ServiceAccount tokens issued for the audience `vault`. The token must expire after two hours and must not be accepted by the Kubernetes API server. What should you configure?
body:
  options:
    - id: a
      text: { en: "A Secret of type `kubernetes.io/service-account-token` mounted in the Pod" }
    - id: b
      text: { en: "The automatically mounted token, sent by the application to the service" }
    - id: c
      text: { en: "A token from `kubectl create token`, stored in a ConfigMap mounted in the Pod" }
    - id: d
      text: { en: "A projected token volume with `audience: vault` and `expirationSeconds: 7200`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A projected `serviceAccountToken` volume lets you set the token's `audience` and `expirationSeconds`, and the kubelet refreshes the token before it expires. A token issued for the `vault` audience is meant for that service only: the API server does not accept it, so a leak from the external service cannot be replayed against the cluster.
  options:
    a:
      en: |
        A Secret-based token is a legacy long-lived credential: it never expires and carries no specific audience, the opposite of the requirements.
    b:
      en: |
        The default token has the API server as its audience. Handing it to an external service lets that service, or anyone who steals it there, call the Kubernetes API as the Pod.
    c:
      en: |
        A ConfigMap is not meant for credentials, and a token stored there is never refreshed: it stops working when it expires and must be replaced by hand.
references:
  - title: "Configure Service Accounts for Pods"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
