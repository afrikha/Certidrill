id: kcsa-2a-noderestriction-not-default
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Kubernetes v1.37 kube-apiserver runs without `--enable-admission-plugins` or `--disable-admission-plugins`. Which of these admission plugins is not active and must be added explicitly?
body:
  options:
    - id: a
      text: { en: "PodSecurity" }
    - id: b
      text: { en: "NodeRestriction" }
    - id: c
      text: { en: "ServiceAccount" }
    - id: d
      text: { en: "ResourceQuota" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      NodeRestriction is not part of the default admission plugin set. It must be added with `--enable-admission-plugins` so that each kubelet can modify only its own Node object and the Pods bound to its node. Many installers add it for you, but the API server does not enable it by default.
  options:
    a:
      en: |
        PodSecurity is enabled by default. It applies the Pod Security Standards configured through namespace labels.
    c:
      en: |
        ServiceAccount is enabled by default. It automates ServiceAccount handling for Pods.
    d:
      en: |
        ResourceQuota is enabled by default. It enforces the ResourceQuota objects of each namespace.
references:
  - title: Admission Control in Kubernetes
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
  - title: kube-apiserver
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
