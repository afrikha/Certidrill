id: kcsa-2b-etcd-write-no-audit
objective: "2.8.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An attacker gains write access to etcd directly, without going through the API server, and adds a ClusterRoleBinding that grants `cluster-admin` to an identity they control. Which statement is correct?
body:
  options:
    - id: a
      text: { en: "The API server ignores the binding, because RBAC objects must be created through the API" }
    - id: b
      text: { en: "The binding takes effect without passing admission control or appearing in the API audit log" }
    - id: c
      text: { en: "The binding appears in the API audit log, because the API server audits every change in etcd" }
    - id: d
      text: { en: "The binding stays inactive until an administrator approves it with `kubectl certificate approve`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The API server serves whatever state etcd holds, so an object written directly into etcd is used like any other, and the RBAC authorizer honors the new binding. Admission control and auditing only see requests that pass through the API server: the direct write is neither validated nor recorded. Direct write access to etcd is therefore a stealthy way to gain and keep cluster-admin rights.
  options:
    a:
      en: |
        The API server has no record of how an object reached etcd. It reads RBAC objects from storage and applies them.
    c:
      en: |
        Audit events are generated for requests handled by the API server. A change made directly in etcd produces no audit event.
    d:
      en: |
        `kubectl certificate approve` approves CertificateSigningRequests. RBAC bindings have no approval step.
references:
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
