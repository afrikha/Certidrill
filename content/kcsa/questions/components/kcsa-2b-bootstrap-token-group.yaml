id: kcsa-2b-bootstrap-token-group
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new node joins a cluster through kubelet TLS bootstrapping. The kubelet authenticates with the bootstrap token found in its bootstrap kubeconfig. As a member of which group does the API server treat this caller?
body:
  options:
    - id: a
      text: { en: "`system:nodes`" }
    - id: b
      text: { en: "`system:masters`" }
    - id: c
      text: { en: "`system:bootstrappers`" }
    - id: d
      text: { en: "`system:serviceaccounts`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When the API server runs with `--enable-bootstrap-token-auth=true`, a caller that presents a bootstrap token is authenticated as a member of `system:bootstrappers`. That group is bound to the `system:node-bootstrapper` ClusterRole, which only allows creating and retrieving CertificateSigningRequests. The kubelet authenticates as a node only after it has received its signed client certificate.
  options:
    a:
      en: |
        `system:nodes` is the group of kubelets that already hold a node client certificate, for example when they renew it. A kubelet with only a bootstrap token is not in it yet.
    b:
      en: |
        `system:masters` is a superuser group. A bootstrap credential is deliberately low-privilege: it only lets the kubelet request a certificate.
    d:
      en: |
        `system:serviceaccounts` contains the ServiceAccounts of the cluster. Bootstrap tokens are a separate authentication method and do not authenticate as a ServiceAccount.
references:
  - title: "TLS bootstrapping"
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-tls-bootstrapping/
