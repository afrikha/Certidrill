id: kcsa-2c-periodic-access-review
objective: "2.10.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Over three years, engineers of Example Corp received RoleBindings whenever they joined a project, but nobody removed them when they moved on. Many engineers now hold rights in namespaces they no longer work in. Which practice from the Kubernetes security checklist addresses this?
body:
  options:
    - id: a
      text: { en: "Enable the `AlwaysPullImages` admission plugin on the kube-apiserver" }
    - id: b
      text: { en: "Run periodic access reviews, no more than 24 months apart" }
    - id: c
      text: { en: "Rotate the cluster CA every year so that old bindings expire" }
    - id: d
      text: { en: "Label every namespace with the Restricted Pod Security Standard" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The security checklist asks for a process of periodic access review, with reviews no more than 24 months apart. Reviews find and remove bindings that people no longer need, so that each person keeps only the rights of their current role, in line with the least-privilege guidance for users.
  options:
    a:
      en: |
        `AlwaysPullImages` forces image pulls with the Pod's credentials to protect private images; it does not review user permissions.
    c:
      en: |
        RBAC bindings are API objects that name users or groups; they do not depend on certificates and never expire when the CA changes.
    d:
      en: |
        Pod Security Standards restrict Pod settings, not the RBAC permissions of human users.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
