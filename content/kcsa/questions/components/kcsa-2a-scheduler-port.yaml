id: kcsa-2a-scheduler-port
objective: "2.3.2"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You are writing firewall rules for control plane nodes. By default, on which port does kube-scheduler serve its HTTPS endpoint for health checks and metrics?
body:
  options:
    - id: a
      text: { en: "6443" }
    - id: b
      text: { en: "10250" }
    - id: c
      text: { en: "10257" }
    - id: d
      text: { en: "10259" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      kube-scheduler serves HTTPS with authentication and authorization on its secure port, 10259 by default. Only local clients need it, so it should be bound to `127.0.0.1` or blocked from other hosts.
  options:
    a:
      en: |
        6443 is the default secure port of kube-apiserver.
    b:
      en: |
        10250 is the kubelet API on every node.
    c:
      en: |
        10257 is the secure port of kube-controller-manager.
references:
  - title: Ports and Protocols
    url: https://kubernetes.io/docs/reference/networking/ports-and-protocols/
  - title: kube-scheduler
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-scheduler/
