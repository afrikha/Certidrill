id: kcsa-2a-preferred-affinity
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Untrusted build Pods must run only on the sandbox nodes, which are labeled `pool=sandbox`. The build Pods use this affinity:

    ```yaml
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
            - key: pool
              operator: In
              values: ["sandbox"]
    ```

    When the sandbox nodes are full, build Pods appear on nodes that run sensitive workloads. What should you change?
body:
  options:
    - id: a
      text: { en: "Raise the `weight` of the preference so that it always wins" }
    - id: b
      text: { en: "Switch to `requiredDuringSchedulingIgnoredDuringExecution`" }
    - id: c
      text: { en: "Change the operator from `In` to `Exists`" }
    - id: d
      text: { en: "Add a toleration for the sandbox nodes to the build Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A preferred node affinity is a soft rule: if no matching node is available, the scheduler still places the Pod elsewhere. A required node affinity works like `nodeSelector` with richer syntax, so the Pod stays pending rather than landing on another node. Preferred rules are never an isolation control.
  options:
    a:
      en: |
        Weights only rank preferences between nodes. However high its weight, a preference is still not a requirement, and 100 is already the maximum value.
    c:
      en: |
        `Exists` matches any node that has a `pool` label, whatever its value, and the rule would still be only a preference.
    d:
      en: |
        A toleration allows Pods onto tainted nodes but never forces them there.
references:
  - title: Assigning Pods to Nodes
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
