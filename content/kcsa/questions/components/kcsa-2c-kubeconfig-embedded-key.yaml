id: kcsa-2c-kubeconfig-embedded-key
objective: "2.10.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer attaches their kubeconfig file to a support ticket. Its `users` entry contains `client-certificate-data` and `client-key-data`. What is the risk?
body:
  options:
    - id: a
      text: { en: "None: the embedded key is encrypted with the cluster CA's key" }
    - id: b
      text: { en: "Anyone who reads the ticket can authenticate as the developer" }
    - id: c
      text: { en: "None: the file works only on the machine where it was created" }
    - id: d
      text: { en: "Anyone who reads the ticket can decrypt the Secrets in etcd" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `-data` fields hold the PEM-encoded certificate and private key, only base64-encoded in the file. Anyone with a copy can use them exactly as the developer does, and because Kubernetes does not support certificate revocation, the credential stays valid until it expires. Kubeconfig files must be protected like passwords and never shared.
  options:
    a:
      en: |
        Base64 is an encoding, not encryption, and client private keys used for Kubernetes authentication cannot be password-protected.
    c:
      en: |
        A kubeconfig file is portable: it contains the server URL, the CA and the credentials, and works from any machine that can reach the API server.
    d:
      en: |
        The file gives the developer's API permissions, not etcd access or the keys used for encryption at rest.
references:
  - title: "kubeconfig (v1)"
    url: https://kubernetes.io/docs/reference/config-api/kubeconfig.v1/
  - title: "Hardening Guide - Authentication Mechanisms"
    url: https://kubernetes.io/docs/concepts/security/hardening-guide/authentication-mechanisms/
