id: kcsa-2b-etcd-only-apiserver
objective: "2.8.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    According to the Kubernetes documentation, which component should ideally be the only one with access to the etcd cluster?
body:
  options:
    - id: a
      text: { en: "The kubelet on each node" }
    - id: b
      text: { en: "kube-controller-manager" }
    - id: c
      text: { en: "kube-scheduler" }
    - id: d
      text: { en: "kube-apiserver" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Access to etcd is equivalent to root permission in the cluster, so ideally only the API server should have access to it. Every other component goes through the API server, where requests are authenticated, authorized, checked by admission and audited. etcd is then restricted to the API servers with TLS client certificates and firewall rules.
  options:
    a:
      en: |
        Kubelets read their Pods and report status through the API server, limited by the Node authorizer. They never need direct etcd access.
    b:
      en: |
        The controllers watch and update objects through the API server. Direct etcd access would bypass every API control.
    c:
      en: |
        The scheduler reads Pods and Nodes and writes bindings through the API server, not through etcd.
references:
  - title: "Operating etcd clusters for Kubernetes"
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
