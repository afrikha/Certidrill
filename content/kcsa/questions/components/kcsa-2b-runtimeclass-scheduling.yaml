id: kcsa-2b-runtimeclass-scheduling
objective: "2.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Only the nodes labeled `sandbox.example.com/gvisor: "true"` have the gVisor handler installed. Which RuntimeClass field makes sure that Pods using this RuntimeClass are placed only on those nodes?
body:
  options:
    - id: a
      text: { en: "`handler`" }
    - id: b
      text: { en: "`overhead.podFixed`" }
    - id: c
      text: { en: "`scheduling.nodeSelector`" }
    - id: d
      text: { en: "`metadata.labels`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `scheduling.nodeSelector` constrains the nodes that can run Pods of this RuntimeClass: at admission it is merged with the Pod's own node selector, keeping only the nodes selected by both. `scheduling.tolerations` can be added when those nodes are tainted for sandboxed workloads.
  options:
    a:
      en: |
        `handler` names the runtime configuration that the node's CRI implementation uses. It does not influence where the Pod is scheduled.
    b:
      en: |
        `overhead` declares the extra resources each Pod of the class consumes, so scheduling and quotas account for them. It does not select nodes.
    d:
      en: |
        Labels on the RuntimeClass object are only metadata about that object. They do not constrain the placement of Pods.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
