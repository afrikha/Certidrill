id: kcsa-2a-kcm-authz-kubeconfig
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Prometheus scrapes `https://127.0.0.1:10257/metrics` on a control plane node with a valid ServiceAccount token, and RBAC allows that ServiceAccount to `get` the `/metrics` path. `/healthz` responds, but `/metrics` always returns 403. kube-controller-manager runs with `--authentication-kubeconfig` set and without `--authorization-kubeconfig`. What is the cause?
body:
  options:
    - id: a
      text: { en: "Prometheus also needs `get` on the `nodes/metrics` subresource of each node" }
    - id: b
      text: { en: "Profiling is enabled, which blocks the metrics endpoint" }
    - id: c
      text: { en: "The token is treated as anonymous, because authentication is not delegated" }
    - id: d
      text: { en: "Authorization is not delegated, so paths that are not always allowed are forbidden" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      kube-controller-manager delegates authorization to the API server with SubjectAccessReview through `--authorization-kubeconfig`. When that flag is empty, every request not skipped by authorization is forbidden. Only the paths in `--authorization-always-allow-paths` (`/healthz`, `/readyz` and `/livez` by default) still work.
  options:
    a:
      en: |
        `nodes/metrics` is the subresource that authorizes access to the kubelet's metrics, not to kube-controller-manager.
    b:
      en: |
        Profiling adds the `/debug/pprof/` endpoint. It does not affect access to `/metrics`.
    c:
      en: |
        `--authentication-kubeconfig` is set, so tokens are validated with TokenReview. Without it, tokens would be treated as anonymous.
references:
  - title: kube-controller-manager
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager/
