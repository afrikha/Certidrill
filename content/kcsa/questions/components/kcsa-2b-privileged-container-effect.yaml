id: kcsa-2b-privileged-container-effect
objective: "2.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container sets `securityContext.privileged: true`. Which statement describes the effect of this setting?
body:
  options:
    - id: a
      text: { en: "It grants only the `NET_BIND_SERVICE` capability to the container" }
    - id: b
      text: { en: "It grants all capabilities and overrides seccomp and AppArmor profiles" }
    - id: c
      text: { en: "It maps root in the container to an unprivileged user on the node" }
    - id: d
      text: { en: "It exempts the container from its CPU and memory limits" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Privileged containers receive all Linux capabilities, and privileged mode overrides hardening such as the seccomp profile, the AppArmor profile and SELinux constraints. The API reference describes their processes as essentially equivalent to root on the host. The Baseline Pod Security Standard forbids privileged containers.
  options:
    a:
      en: |
        `NET_BIND_SERVICE` is added with `capabilities.add`; the Restricted profile even allows it. Privileged mode grants every capability, not one.
    c:
      en: |
        That describes a user namespace, enabled with `hostUsers: false`. Privileged mode does the opposite: it removes confinement.
    d:
      en: |
        Resource limits are enforced through cgroups whether or not the container is privileged.
references:
  - title: "Linux kernel security constraints for Pods and containers"
    url: https://kubernetes.io/docs/concepts/security/linux-kernel-security-constraints/
  - title: "Pod"
    url: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/
