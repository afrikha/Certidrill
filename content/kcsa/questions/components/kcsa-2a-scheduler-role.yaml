id: kcsa-2a-scheduler-role
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does kube-scheduler do with a newly created Pod that has no node assigned?
body:
  options:
    - id: a
      text: { en: "It starts the Pod's containers through the container runtime" }
    - id: b
      text: { en: "It creates the Pod from the template of its ReplicaSet" }
    - id: c
      text: { en: "It programs Service rules so that traffic reaches the Pod" }
    - id: d
      text: { en: "It filters and scores nodes, then binds the Pod to the chosen node" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      kube-scheduler filters the nodes where the Pod can run, scores the feasible ones, and notifies the API server of its choice through a binding. Where a Pod lands decides which workloads share its kernel and which kubelet receives its Secrets, which is why placement matters for security.
  options:
    a:
      en: |
        The kubelet of the chosen node starts the containers. The scheduler never runs containers.
    b:
      en: |
        Pods are created by controllers in kube-controller-manager, such as the ReplicaSet controller. The scheduler only places Pods that already exist.
    c:
      en: |
        kube-proxy, or a CNI plugin that replaces it, implements Service traffic on the nodes.
references:
  - title: Kubernetes Scheduler
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
