id: kcsa-2a-kcm-talks-apiserver
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Through which component does kube-controller-manager read and change the state of the cluster?
body:
  options:
    - id: a
      text: { en: "etcd, which it reads and writes directly" }
    - id: b
      text: { en: "Each kubelet, through its API on port 10250" }
    - id: c
      text: { en: "kube-scheduler, which forwards its changes" }
    - id: d
      text: { en: "kube-apiserver, like any other API client" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      kube-controller-manager is a client of the kube-apiserver. It watches objects and writes changes through the API, and its requests go through authentication, authorization and admission like those of any other client. Only the API server talks to etcd.
  options:
    a:
      en: |
        Only kube-apiserver accesses etcd. Controllers never connect to etcd directly.
    b:
      en: |
        The API server is the component that calls the kubelet API, for example for `exec` and `logs`. Controllers do not call kubelets.
    c:
      en: |
        kube-scheduler is another API client. It does not relay requests for other components.
references:
  - title: kube-controller-manager
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager/
  - title: Controlling Access to the Kubernetes API
    url: https://kubernetes.io/docs/concepts/security/controlling-access/
