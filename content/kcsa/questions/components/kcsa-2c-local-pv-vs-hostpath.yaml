id: kcsa-2c-local-pv-vs-hostpath
objective: "2.11.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A database must keep its data on the local SSD of a specific node. The team proposes a `hostPath` volume in the Pod spec. Which alternative does the Kubernetes documentation suggest when `hostPath` can be avoided?
body:
  options:
    - id: a
      text: { en: "An `emptyDir` volume with `medium: Memory`" }
    - id: b
      text: { en: "A `local` PersistentVolume" }
    - id: c
      text: { en: "An `nfs` volume exported by the node" }
    - id: d
      text: { en: "A `projected` volume" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The documentation says that `hostPath` presents many security risks and suggests defining a `local` PersistentVolume instead. A `local` volume is created by an administrator as a PersistentVolume with node affinity, so the scheduler places the Pod on the right node, and the Pod only references a claim instead of an arbitrary host path.
  options:
    a:
      en: |
        A memory-backed `emptyDir` is a tmpfs that disappears with the Pod and counts against its memory limit; it cannot hold durable database data.
    c:
      en: |
        An NFS share is network storage that needs an NFS server; it does not use the node's local SSD directly.
    d:
      en: |
        A projected volume combines Secrets, ConfigMaps, the downward API and ServiceAccount tokens; it does not provide data storage.
references:
  - title: "Volume Types"
    url: https://kubernetes.io/docs/reference/storage/volume-types/
