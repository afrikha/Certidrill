id: kcsa-2c-cni-mesh-identity
objective: "2.9.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Traffic between nodes is already encrypted by WireGuard in the network plugin. A new requirement says that each service must cryptographically verify the identity of the calling workload, based on its Kubernetes ServiceAccount, before it accepts a connection. Application code must not change. What should you add?
body:
  options:
    - id: a
      text: { en: "A NetworkPolicy that allows ingress only from Pods with a given label" }
    - id: b
      text: { en: "IPsec instead of WireGuard in the network plugin" }
    - id: c
      text: { en: "A service mesh that uses mutual TLS between workloads, such as Linkerd" }
    - id: d
      text: { en: "Projected ServiceAccount tokens mounted in every Pod of the cluster" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A service mesh such as Linkerd gives each workload a certificate bound to its Kubernetes ServiceAccount and uses mutual TLS between meshed Pods, so both sides of every connection are authenticated, without application changes. Network plugin encryption protects the traffic on the wire between nodes but does not prove which workload is talking.
  options:
    a:
      en: |
        Labels and IP addresses are not cryptographic identities, and NetworkPolicy has no TLS or authentication feature.
    b:
      en: |
        Switching the tunnel protocol still encrypts traffic between nodes, not between identified workloads.
    d:
      en: |
        A mounted token is a credential for the Kubernetes API. Using it to identify callers would require code in every service to send and validate tokens.
references:
  - title: "Automatic mTLS"
    url: https://linkerd.io/2/features/automatic-mtls/
