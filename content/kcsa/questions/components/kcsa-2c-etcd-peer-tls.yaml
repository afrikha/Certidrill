id: kcsa-2c-etcd-peer-tls
objective: "2.8.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A three-member etcd cluster replicates data between its members on TCP port 2380. You must encrypt this replication traffic and accept only members that present a certificate signed by the etcd CA. Which group of etcd flags should you configure?
body:
  options:
    - id: a
      text: { en: "`--cert-file`, `--key-file`, `--client-cert-auth` and `--trusted-ca-file`" }
    - id: b
      text: { en: "`--etcd-certfile`, `--etcd-keyfile` and `--etcd-cafile`" }
    - id: c
      text: { en: "`--peer-auto-tls` and `--listen-peer-urls` with an `https://` address" }
    - id: d
      text: { en: "`--peer-cert-file` and `--peer-key-file`, with `--peer-client-cert-auth` and its CA file" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Member-to-member traffic is secured with the `--peer-*` flags: `--peer-cert-file` and `--peer-key-file` set the certificate used on the peer address, and `--peer-client-cert-auth` with `--peer-trusted-ca-file` makes etcd accept only peer requests that carry a certificate signed by that CA. This is mutual TLS between etcd members.
  options:
    a:
      en: |
        These flags secure the client port (2379), used by the kube-apiserver and `etcdctl`, not replication between members.
    b:
      en: |
        These are kube-apiserver flags: they give the API server its client certificate and the CA to verify etcd. They do not configure etcd peers.
    c:
      en: |
        `--peer-auto-tls` generates self-signed certificates: the traffic is encrypted, but peers are not authenticated against the etcd CA.
references:
  - title: "Transport security model"
    url: https://etcd.io/docs/v3.5/op-guide/security/
