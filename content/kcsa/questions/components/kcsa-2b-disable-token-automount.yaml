id: kcsa-2b-disable-token-automount
objective: "2.7.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A web application in the namespace `shop` never calls the Kubernetes API. Which setting stops a ServiceAccount token from being mounted into its Pods?
body:
  options:
    - id: a
      text: { en: "Delete all RoleBindings that reference the `default` ServiceAccount" }
    - id: b
      text: { en: "Set `automountServiceAccountToken: false` on the Pod or its ServiceAccount" }
    - id: c
      text: { en: "Set `hostUsers: false` in the Pod spec" }
    - id: d
      text: { en: "Set `readOnlyRootFilesystem: true` on the container" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Kubernetes security checklist asks that ServiceAccount tokens not be mounted in Pods that don't require them. Setting `automountServiceAccountToken: false` on the ServiceAccount applies to all its Pods; setting it on a Pod applies to that Pod. A compromised application then finds no API credential to steal.
  options:
    a:
      en: |
        RoleBindings decide what the token allows, but the token is still mounted and still authenticates the Pod to the API server.
    c:
      en: |
        `hostUsers: false` runs the Pod in a user namespace. It changes UID mapping, not whether a token is mounted.
    d:
      en: |
        The token is mounted as a separate projected volume, not written into the root filesystem, so it is still there.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Configure Service Accounts for Pods"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
