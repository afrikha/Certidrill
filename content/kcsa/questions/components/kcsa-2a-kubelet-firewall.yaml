id: kcsa-2a-kubelet-firewall
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The kubelets of a cluster are hardened with authentication and Webhook authorization. Which network rule for port 10250 on the nodes keeps `kubectl exec`, `kubectl logs` and metrics collection working while minimizing exposure?
body:
  options:
    - id: a
      text: { en: "Block port 10250 from every source, since all access goes through kube-apiserver" }
    - id: b
      text: { en: "Allow port 10250 only from the control plane and the trusted monitoring agents" }
    - id: c
      text: { en: "Allow port 10250 from every Pod, since kubelet authentication already protects it" }
    - id: d
      text: { en: "Allow port 10250 from the internet, since the kubelet API always uses TLS" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      kube-apiserver itself connects to the kubelet API for `exec`, `logs` and port forwarding, and monitoring agents read kubelet metrics from it. Allowing only these sources keeps those features while removing every other caller, so a weakness in kubelet authentication or authorization cannot be reached from the rest of the network.
  options:
    a:
      en: |
        Users go through the API server, but the API server then calls the kubelet on port 10250. Blocking it breaks `exec`, `logs` and metrics.
    c:
      en: |
        Authentication is one layer. Exposing the port to every Pod gives any compromised workload a path to try misconfigurations or vulnerabilities of the kubelet.
    d:
      en: |
        TLS encrypts traffic but does not decide who may call. The kubelet API must not be exposed publicly on the internet.
references:
  - title: Communication between Nodes and the Control Plane
    url: https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/
  - title: Security Checklist
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
