id: kcsa-2c-cni-policy-no-effect
objective: "2.9.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team creates a default deny ingress NetworkPolicy in the `shop` namespace. `kubectl get networkpolicy -n shop` lists it without any error, but Pods in other namespaces can still connect to the Pods in `shop`. What is the most likely cause?
body:
  options:
    - id: a
      text: { en: "NetworkPolicies take effect only after kube-proxy restarts on each node" }
    - id: b
      text: { en: "The cluster's network plugin does not implement NetworkPolicy" }
    - id: c
      text: { en: "The namespace has no Pod Security Admission `enforce` label" }
    - id: d
      text: { en: "NetworkPolicies apply only to Pods that a Deployment manages" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      NetworkPolicies are enforced by the network plugin, not by the API server. The API stores the object whatever plugin is installed, but creating a NetworkPolicy without a controller that implements it has no effect, and no error is shown. The Kubernetes security checklist therefore asks for CNI plugins that support network policies.
  options:
    a:
      en: |
        kube-proxy implements Services. It does not enforce NetworkPolicies, and restarting it changes nothing here.
    c:
      en: |
        Pod Security Admission checks Pod security settings at admission time. It is unrelated to network traffic filtering.
    d:
      en: |
        NetworkPolicies select Pods by label, whatever controller created them.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
