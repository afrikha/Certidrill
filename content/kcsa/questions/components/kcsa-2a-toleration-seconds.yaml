id: kcsa-2a-toleration-seconds
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    During an incident, you taint node `worker-4` with `quarantine=true:NoExecute`. Pods without a matching toleration are evicted at once. The Pod `agent-x` on that node has this toleration:

    ```yaml
    tolerations:
    - key: quarantine
      operator: Equal
      value: "true"
      effect: NoExecute
      tolerationSeconds: 3600
    ```

    What happens to `agent-x`?
body:
  options:
    - id: a
      text: { en: "It is evicted immediately, like the Pods without a toleration" }
    - id: b
      text: { en: "It stays bound to the node for as long as the taint exists" }
    - id: c
      text: { en: "It is moved to another node at once, then allowed back after one hour" }
    - id: d
      text: { en: "It stays on the node for up to one hour, then it is evicted" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Pod that tolerates a `NoExecute` taint with `tolerationSeconds` remains bound for that number of seconds after the taint is added; then the node lifecycle controller evicts it. During an incident, such tolerations decide how long workloads keep running on the quarantined node.
  options:
    a:
      en: |
        Immediate eviction applies only to Pods that do not tolerate the taint. `agent-x` tolerates it for a limited time.
    b:
      en: |
        Staying bound indefinitely is the behaviour of a matching toleration without `tolerationSeconds`.
    c:
      en: |
        Eviction only removes the Pod from the node; a controller may create a replacement elsewhere. Nothing moves the Pod and brings it back after a delay.
references:
  - title: Taints and Tolerations
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
