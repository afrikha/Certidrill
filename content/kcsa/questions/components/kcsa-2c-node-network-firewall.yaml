id: kcsa-2c-node-network-firewall
objective: "2.9.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Worker nodes expose the kubelet API on TCP port 10250 and SSH on port 22. These ports must be reachable only from the control plane and from an administrative bastion host. Which control should you use?
body:
  options:
    - id: a
      text: { en: "A NetworkPolicy in `kube-system` that selects the kubelet" }
    - id: b
      text: { en: "A Pod Security Admission label on every namespace" }
    - id: c
      text: { en: "Firewall rules or security groups on the node network" }
    - id: d
      text: { en: "A ClusterIP Service in front of the kubelet port" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The kubelet and SSH are host services on the node network, not Pods. Access to node ports is controlled with infrastructure firewalls, such as cloud security groups or host firewalls, that allow the control plane and the bastion host and refuse other sources. The Kubernetes security checklist also requires that the kubelet API is not exposed publicly.
  options:
    a:
      en: |
        NetworkPolicies select Pods by label. The kubelet is a node process, so no NetworkPolicy can select it.
    b:
      en: |
        Pod Security Admission validates Pod specifications at admission time. It does not filter network access to nodes.
    d:
      en: |
        A ClusterIP Service only adds a virtual IP inside the cluster. It does not restrict who can reach the node's own port 10250.
references:
  - title: "Ports and Protocols"
    url: https://kubernetes.io/docs/reference/networking/ports-and-protocols/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
