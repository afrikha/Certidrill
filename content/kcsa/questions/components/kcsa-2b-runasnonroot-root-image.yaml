id: kcsa-2b-runasnonroot-root-image
objective: "2.7.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod sets `runAsNonRoot: true` in its securityContext but sets no `runAsUser`. The default user of the container image is root (UID 0). What happens when the Pod is started on a node?
body:
  options:
    - id: a
      text: { en: "The container runs as a random non-zero UID chosen by the kubelet" }
    - id: b
      text: { en: "The container runs as root, and the kubelet records a warning event" }
    - id: c
      text: { en: "The API server rejects the Pod because `runAsUser` is missing" }
    - id: d
      text: { en: "The kubelet refuses to start the container because it would run as UID 0" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `runAsNonRoot: true` is a check, not a user switch: the kubelet validates at runtime that the image does not run as UID 0 and fails to start the container if it does. To fix it, set a non-zero `runAsUser` or build the image with a non-root default user.
  options:
    a:
      en: |
        The kubelet never picks a UID. Only `runAsUser` or the image's default user decides which UID the process uses.
    b:
      en: |
        The setting is enforced, not advisory: a container that would run as root does not start.
    c:
      en: |
        `runAsUser` is optional, and the API server cannot know the image's default user. The check happens on the node when the container starts.
references:
  - title: "Pod"
    url: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/
  - title: "Configure a Security Context for a Pod or Container"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
