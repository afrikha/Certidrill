id: kcsa-2a-kcm-key-files
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    kube-controller-manager reads the cluster CA private key and the ServiceAccount signing key from files on the control plane host. How should these files be protected?
body:
  options:
    - id: a
      text: { en: "Store them in a ConfigMap in `kube-system` so that every replica can read them" }
    - id: b
      text: { en: "Restrict them to root on the control plane host and never mount them into Pods" }
    - id: c
      text: { en: "Encode them in base64 so that they cannot be read as plain text" }
    - id: d
      text: { en: "Copy them to every worker node so that kubelets can check tokens locally" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Whoever reads these keys can issue trusted client certificates or forge ServiceAccount tokens. They should stay on the control plane hosts with root-only file permissions, out of any Pod and out of unprotected backups. The Kubernetes security checklist also asks for the root certificate to be protected.
  options:
    a:
      en: |
        ConfigMaps are not meant for confidential data, and anyone allowed to read ConfigMaps in `kube-system` would get the keys.
    c:
      en: |
        Base64 is an encoding, not encryption. Anyone can decode it.
    d:
      en: |
        Spreading the private keys to every node multiplies the places an attacker can steal them from. Kubelets do not need these private keys.
references:
  - title: Security Checklist
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: kube-controller-manager
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager/
