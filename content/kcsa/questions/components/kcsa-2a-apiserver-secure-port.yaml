id: kcsa-2a-apiserver-secure-port
objective: "2.1.2"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    A self-managed cluster runs kube-apiserver with its default port settings and no load balancer in front of it. On which TCP port do clients reach the API server over HTTPS?
body:
  options:
    - id: a
      text: { en: "443" }
    - id: b
      text: { en: "6443" }
    - id: c
      text: { en: "8080" }
    - id: d
      text: { en: "10250" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      By default kube-apiserver listens on port 6443, protected by TLS (`--secure-port`). This secure port cannot be switched off. Clients verify the server certificate with the cluster CA in their kubeconfig.
  options:
    a:
      en: |
        Many production clusters expose the API on 443, often through a load balancer, but that is a deployment choice, not the kube-apiserver default.
    c:
      en: |
        Port 8080 was used by the unauthenticated, unencrypted insecure port of old releases. Current kube-apiserver versions no longer serve an insecure port.
    d:
      en: |
        Port 10250 is the kubelet API on each node, not the API server.
references:
  - title: Controlling Access to the Kubernetes API
    url: https://kubernetes.io/docs/concepts/security/controlling-access/
  - title: kube-apiserver
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
