id: kcsa-2a-alwaysallow-first
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A kube-apiserver is started with `--authorization-mode=AlwaysAllow,RBAC`. A user who has no RoleBinding or ClusterRoleBinding runs `kubectl get secrets --all-namespaces`. What happens?
body:
  options:
    - id: a
      text: { en: "The request is denied, because RBAC finds no binding for the user" }
    - id: b
      text: { en: "The request is rejected with 401 Unauthorized, because the user has no binding" }
    - id: c
      text: { en: "The request is allowed, because AlwaysAllow decides before RBAC is consulted" }
    - id: d
      text: { en: "The request is allowed only if the PodSecurity admission plugin accepts it" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Authorizers are checked in the order given on the command line, and the first one that allows or denies a request decides. `AlwaysAllow` approves everything, so RBAC is never consulted and every authenticated user can read every Secret. `AlwaysAllow` must not be used on a cluster where not all API clients are trusted; a typical secure value is `Node,RBAC`.
  options:
    a:
      en: |
        RBAC would deny the request only if it were reached. The earlier `AlwaysAllow` authorizer has already approved it.
    b:
      en: |
        401 is an authentication failure. Bindings are an authorization matter, and the user here is authenticated.
    d:
      en: |
        Admission controllers do not act on read requests, and PodSecurity only evaluates Pods. It plays no part in reading Secrets.
references:
  - title: Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
