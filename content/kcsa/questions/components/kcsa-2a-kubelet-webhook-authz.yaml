id: kcsa-2a-kubelet-webhook-authz
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which KubeletConfiguration setting makes the kubelet ask kube-apiserver, through a SubjectAccessReview, whether each request to its API is allowed?
body:
  options:
    - id: a
      text: { en: "`authentication.webhook.enabled: true`" }
    - id: b
      text: { en: "`authorization.mode: Webhook`" }
    - id: c
      text: { en: "`authentication.x509.clientCAFile`" }
    - id: d
      text: { en: "`readOnlyPort: 0`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `authorization.mode: Webhook`, the kubelet sends a SubjectAccessReview to the API server for each request, so RBAC decides who can use which kubelet endpoint. The other valid value, `AlwaysAllow`, authorizes every authenticated or anonymous request.
  options:
    a:
      en: |
        The authentication webhook validates bearer tokens with the TokenReview API. It answers who is calling, not whether the call is allowed.
    c:
      en: |
        `clientCAFile` enables authentication with X.509 client certificates. It does not authorize requests.
    d:
      en: |
        `readOnlyPort: 0` disables the unauthenticated read-only port. It does not change how the main API authorizes requests.
references:
  - title: Kubelet authentication/authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
  - title: Kubelet Configuration (v1beta1)
    url: https://kubernetes.io/docs/reference/config-api/kubelet-config.v1beta1/
