id: kcsa-2a-scheduler-compromise
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker controls one worker node and also steals the kubeconfig that kube-scheduler uses (`system:kube-scheduler`). How can the attacker most directly abuse the scheduler's identity?
body:
  options:
    - id: a
      text: { en: "Read Secrets directly from etcd with the scheduler's certificate" }
    - id: b
      text: { en: "Bind sensitive Pods to the compromised node to obtain their Secrets" }
    - id: c
      text: { en: "Sign client certificates for new cluster administrators" }
    - id: d
      text: { en: "Rewrite the Service packet rules on every node of the cluster" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The scheduler's job is to bind Pods to nodes. With its identity, the attacker can place sensitive Pods on the node they control; that node's kubelet then legitimately receives the Secrets and ServiceAccount tokens those Pods use. A compromised scheduler is a placement threat: co-locating workloads, steering them to a hostile node, or not scheduling them at all.
  options:
    a:
      en: |
        kube-scheduler talks only to the API server. Only kube-apiserver accesses etcd, which should require its own client certificates.
    c:
      en: |
        Signing certificates requires the cluster CA key used by kube-controller-manager, not the scheduler's credential.
    d:
      en: |
        Service packet rules are programmed by kube-proxy on each node. The scheduler has no role in them.
references:
  - title: Kubernetes Scheduler
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
