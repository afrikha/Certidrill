id: kcsa-2a-nodes-metrics-rbac
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The kubelets use Webhook authorization. A monitoring agent needs to scrape `/metrics` from each kubelet's API. Which permission should its ClusterRole grant?
body:
  options:
    - id: a
      text: { en: "`get` on `nodes/proxy`" }
    - id: b
      text: { en: "`create` on `pods/exec`" }
    - id: c
      text: { en: "`get` on `nodes/metrics`" }
    - id: d
      text: { en: "`get` on `nodes`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With Webhook authorization, the kubelet maps request paths to the `nodes` resource and a subresource: `/metrics/*` maps to `nodes/metrics`, `/stats/*` to `nodes/stats`, `/logs/*` to `nodes/log`. Granting `nodes/metrics` gives the agent exactly what it needs.
  options:
    a:
      en: |
        `nodes/proxy` covers every other kubelet endpoint, including those that execute commands in containers. Even `get` on it is not read-only, so it must not be given to a monitoring tool.
    b:
      en: |
        `pods/exec` lets a user run commands in containers through the API server. It does not authorize scraping kubelet metrics and grants far more power than needed.
    d:
      en: |
        `get` on `nodes` reads Node objects from the API server. The kubelet checks a subresource for its endpoints, so this does not authorize `/metrics`.
references:
  - title: Kubelet authentication/authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
