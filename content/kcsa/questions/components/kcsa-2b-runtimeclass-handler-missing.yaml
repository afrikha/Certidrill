id: kcsa-2b-runtimeclass-handler-missing
objective: "2.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A RuntimeClass named `sandboxed` with `handler: runsc` exists in the cluster. It has no `scheduling` section. A Pod that sets `runtimeClassName: sandboxed` is placed on a node whose container runtime has no `runsc` handler configured. What happens to the Pod?
body:
  options:
    - id: a
      text: { en: "The Pod enters the `Failed` phase, and an event reports the error" }
    - id: b
      text: { en: "The containers start with the node's default runc handler" }
    - id: c
      text: { en: "The API server rejects the Pod during admission" }
    - id: d
      text: { en: "The Pod stays `Pending` until a node with the handler joins" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When the CRI cannot run the handler of the named RuntimeClass, the Pod enters the `Failed` terminal phase and an event gives the error. Kubernetes does not silently fall back to the default runtime, which would remove the sandbox the workload asked for. To avoid the failure, set `scheduling.nodeSelector` (and tolerations if needed) in the RuntimeClass so that its Pods go only to nodes that have the handler.
  options:
    b:
      en: |
        There is no fallback to the default handler: a Pod that asked for a sandbox never runs unsandboxed because a node lacks the handler.
    c:
      en: |
        The RuntimeClass exists, so admission accepts the Pod. The API server does not know which handlers each node's runtime has configured.
    d:
      en: |
        Without a `scheduling` section, the RuntimeClass is assumed to be supported by all nodes, so the scheduler places the Pod on any node instead of waiting.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
