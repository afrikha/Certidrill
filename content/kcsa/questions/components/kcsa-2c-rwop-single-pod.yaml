id: kcsa-2c-rwop-single-pod
objective: "2.11.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Deployment uses a PersistentVolumeClaim with the `ReadWriteOnce` access mode. Two replicas were scheduled on the same node and both wrote to the volume, which corrupted the data. You need a guarantee that only one Pod in the whole cluster can read or write the claim. The volume is provisioned by a CSI driver. Which access mode should the claim use?
body:
  options:
    - id: a
      text: { en: "`ReadOnlyMany`" }
    - id: b
      text: { en: "`ReadWriteOncePod`" }
    - id: c
      text: { en: "`ReadWriteMany`" }
    - id: d
      text: { en: "`ReadWriteOnce`, with node affinity on the PersistentVolume" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `ReadWriteOncePod`, stable since Kubernetes v1.29 and supported for CSI volumes, ensures that only one Pod across the whole cluster can read or write the claim. `ReadWriteOnce` limits the volume to a single node, but several Pods on that node can still use it at the same time, which is what happened here.
  options:
    a:
      en: |
        `ReadOnlyMany` lets many nodes mount the volume read-only. It is the opposite of exclusive access, and access modes do not enforce write protection after mounting.
    c:
      en: |
        `ReadWriteMany` allows read-write mounts from many nodes, which makes concurrent writers more likely, not less.
    d:
      en: |
        Node affinity only decides where the volume can be used. With `ReadWriteOnce`, several Pods on that node can still share it.
references:
  - title: "Persistent Volumes"
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
