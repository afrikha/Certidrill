id: kcsa-2a-kcm-role
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which control plane component runs built-in control loops such as the ReplicaSet, Namespace and garbage collector controllers?
body:
  options:
    - id: a
      text: { en: "kube-controller-manager" }
    - id: b
      text: { en: "kube-scheduler" }
    - id: c
      text: { en: "cloud-controller-manager" }
    - id: d
      text: { en: "kubelet" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      kube-controller-manager is one binary that runs the built-in controllers. Each controller watches the API server and acts to bring the current state to the desired state. Because these loops together create, update and delete objects in almost every namespace, the component's credentials are highly sensitive.
  options:
    b:
      en: |
        kube-scheduler only assigns unscheduled Pods to nodes. It does not run workload or namespace controllers.
    c:
      en: |
        cloud-controller-manager runs only the cloud-specific controllers (node, route and service controllers) that call a cloud provider's API.
    d:
      en: |
        The kubelet is the node agent that runs the containers of the Pods bound to its node. It is not a control plane component.
references:
  - title: kube-controller-manager
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager/
