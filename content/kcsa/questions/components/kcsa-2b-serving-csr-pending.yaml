id: kcsa-2b-serving-csr-pending
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator sets `serverTLSBootstrap: true` in the kubelet configuration of every node. The kubelets create CertificateSigningRequests for their serving certificates, but the requests stay `Pending`, while the renewals of their client certificates are approved automatically. What explains this?
body:
  options:
    - id: a
      text: { en: "The built-in CSR approvers do not approve kubelet serving certificates, for security reasons" }
    - id: b
      text: { en: "Serving certificates can be requested only when `rotateCertificates` is `false`" }
    - id: c
      text: { en: "The NodeRestriction admission plugin blocks the approval of CSRs created by kubelets" }
    - id: d
      text: { en: "The bootstrap tokens of the nodes have expired since the nodes joined" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The CSR approving controllers of core Kubernetes do not approve node serving certificates, for security reasons: an administrator or a custom approver must approve them. A safe approver checks that the request comes from `system:node:<nodeName>` in `system:nodes`, asks only for server authentication, and lists only IP addresses and DNS names that belong to that node. Otherwise a compromised node could obtain a certificate for another node's name or address.
  options:
    b:
      en: |
        `rotateCertificates` renews the client certificate and `serverTLSBootstrap` requests the serving certificate. The two settings are independent and are usually both enabled.
    c:
      en: |
        NodeRestriction limits which Node and Pod objects a kubelet can modify; it does not handle CSR approval. The Node authorizer gives kubelets access to the CSR API, which is why the requests exist.
    d:
      en: |
        The bootstrap token is used only to obtain the first client certificate. These kubelets already hold client certificates, as the approved renewals show.
references:
  - title: "TLS bootstrapping"
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-tls-bootstrapping/
