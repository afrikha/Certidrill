id: kcsa-2b-kube-proxy-host-privileges
objective: "2.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In most clusters, kube-proxy runs as a DaemonSet in `kube-system` with `hostNetwork: true` and elevated privileges, such as the `NET_ADMIN` capability or a privileged container. Why does it need these privileges?
body:
  options:
    - id: a
      text: { en: "It terminates TLS for every Service with the node's private keys" }
    - id: b
      text: { en: "It reads the Secrets of every namespace to authenticate clients" }
    - id: c
      text: { en: "It forwards every Service packet through its own user-space process" }
    - id: d
      text: { en: "It writes packet-forwarding rules in the node's own network namespace" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In iptables or nftables mode, kube-proxy configures packet-forwarding rules through the kernel's netfilter subsystem. Those rules belong to the node, not to a Pod, so kube-proxy needs the host network namespace and the right to change network configuration. Because it runs with these privileges on every node, its DaemonSet, image and configuration must be tightly protected.
  options:
    a:
      en: |
        kube-proxy does not terminate TLS. TLS for incoming traffic is handled by Ingress or Gateway implementations, or by the applications or a service mesh.
    b:
      en: |
        kube-proxy needs to read Services, EndpointSlices and Nodes, not Secrets. It does not authenticate the clients of Services.
    c:
      en: |
        In iptables and nftables modes, kube-proxy only programs rules: the kernel forwards the packets.
references:
  - title: "Virtual IPs and Service Proxies"
    url: https://kubernetes.io/docs/reference/networking/virtual-ips/
