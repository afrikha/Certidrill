id: kcsa-2c-default-storageclass
objective: "2.11.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You created the StorageClass `encrypted-ssd`, whose driver parameters enable encryption at rest. Teams create PersistentVolumeClaims without a `storageClassName`, and the cluster's current default class, `standard`, provisions unencrypted volumes. New claims must get encrypted volumes without any change to the teams' manifests. What should you do?
body:
  options:
    - id: a
      text: { en: "Move the `is-default-class` annotation from `standard` to `encrypted-ssd`" }
    - id: b
      text: { en: "Set `reclaimPolicy: Delete` on `standard` to remove unencrypted volumes" }
    - id: c
      text: { en: "Set `allowVolumeExpansion: false` on `standard` to stop its provisioning" }
    - id: d
      text: { en: "Add `encrypted-ssd` to the kube-apiserver EncryptionConfiguration" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A claim without `storageClassName` uses the default StorageClass, the one annotated with `storageclass.kubernetes.io/is-default-class: "true"`. Moving the annotation to `encrypted-ssd` makes new claims use it. Removing it from `standard` matters, because when several classes are marked default, Kubernetes picks the most recently created one, and the documentation recommends a single default.
  options:
    b:
      en: |
        The reclaim policy decides what happens when a claim is deleted. New claims would still get unencrypted volumes from `standard`.
    c:
      en: |
        `allowVolumeExpansion` only controls whether existing volumes can be grown; `standard` would still provision new volumes.
    d:
      en: |
        An EncryptionConfiguration lists API resources to encrypt in etcd; a StorageClass name there does not encrypt volume data.
references:
  - title: "Storage Classes"
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
