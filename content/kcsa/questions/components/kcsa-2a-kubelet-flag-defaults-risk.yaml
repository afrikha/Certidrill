id: kcsa-2a-kubelet-flag-defaults-risk
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A kubelet is started with command-line flags only, without `--config`, and without `--anonymous-auth` or `--authorization-mode`. Port 10250 of the node is reachable from every Pod in the cluster. What is the risk?
body:
  options:
    - id: a
      text: { en: "Any Pod can call the kubelet API without credentials and run commands in any container on the node" }
    - id: b
      text: { en: "Any Pod can read the node's metrics without credentials, but the API rejects all other calls" }
    - id: c
      text: { en: "Any Pod can write objects directly into etcd by sending them through the kubelet API" }
    - id: d
      text: { en: "No risk, because the kubelet API accepts only clients that present a valid client certificate" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The kubelet flag defaults are `--anonymous-auth=true` and `--authorization-mode=AlwaysAllow`. Unauthenticated requests are therefore accepted as `system:anonymous` and every request is authorized, including the endpoints that execute commands in containers. From there an attacker can read mounted Secrets and ServiceAccount tokens of every Pod on the node.
  options:
    b:
      en: |
        With `AlwaysAllow`, the kubelet does not limit callers to metrics: every endpoint, including exec, is allowed.
    c:
      en: |
        The kubelet does not write to etcd. Only kube-apiserver talks to etcd.
    d:
      en: |
        Client certificate authentication is only one option. With anonymous authentication enabled, requests without a certificate are still accepted as anonymous.
references:
  - title: Kubelet authentication/authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
  - title: kubelet
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
