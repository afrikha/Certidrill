id: kcsa-2b-readonly-rootfs-writable-tmp
objective: "2.7.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application writes temporary files under `/tmp`. You want to set `readOnlyRootFilesystem: true` on its container without breaking the application. What should you add to the Pod?
body:
  options:
    - id: a
      text: { en: "An `emptyDir` volume mounted at `/tmp` in the container" }
    - id: b
      text: { en: "The `DAC_OVERRIDE` capability in `capabilities.add`" }
    - id: c
      text: { en: "`allowPrivilegeEscalation: true` on the container" }
    - id: d
      text: { en: "`fsGroup: 2000` in the Pod securityContext" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `readOnlyRootFilesystem` mounts the container's root filesystem read-only, but volumes mounted into the container keep their own mode. An `emptyDir` at `/tmp` gives the application writable scratch space for the life of the Pod, while the rest of the image stays immutable: an attacker cannot drop tools or modify binaries there.
  options:
    b:
      en: |
        `DAC_OVERRIDE` bypasses file permission checks, but it cannot make a read-only mount writable. It also adds privileges, against the goal of hardening.
    c:
      en: |
        `allowPrivilegeEscalation` controls the `no_new_privs` flag. It has nothing to do with whether the filesystem is writable, and `true` weakens the container.
    d:
      en: |
        `fsGroup` sets the group ownership of volumes. It does not make the read-only root filesystem writable.
references:
  - title: "Configure a Security Context for a Pod or Container"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
