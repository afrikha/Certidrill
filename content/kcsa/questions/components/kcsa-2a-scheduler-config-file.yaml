id: kcsa-2a-scheduler-config-file
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Why must the KubeSchedulerConfiguration file passed to kube-scheduler with `--config` be protected with root-only permissions on the control plane nodes?
body:
  options:
    - id: a
      text: { en: "It sets the scheduling profiles and the scheduler's kubeconfig, which decide placement" }
    - id: b
      text: { en: "It contains the keys that encrypt Secrets before kube-apiserver writes them to etcd" }
    - id: c
      text: { en: "It stores the RoleBindings and ClusterRoleBindings of all users of the cluster" }
    - id: d
      text: { en: "It holds the client certificates of all kubelets that join the cluster" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The KubeSchedulerConfiguration file sets the client connection (the kubeconfig with the scheduler's credential), leader election, profiles and enabled plugins. Whoever can edit it can disable filters such as taint checks or point the scheduler at another identity, which changes where every Pod lands.
  options:
    b:
      en: |
        Encryption keys belong to the EncryptionConfiguration file read by kube-apiserver, or to an external KMS.
    c:
      en: |
        RBAC objects are API objects stored in etcd through the API server, not in a scheduler file.
    d:
      en: |
        Kubelet certificates live on each node. The scheduler does not hold them.
references:
  - title: kube-scheduler Configuration (v1)
    url: https://kubernetes.io/docs/reference/config-api/kube-scheduler-config.v1/
  - title: Scheduler Configuration
    url: https://kubernetes.io/docs/reference/scheduling/config/
