id: kcsa-2c-kubeconfig-merge-precedence
objective: "2.10.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your `~/.kube/config` defines the cluster `prod` (the real API server), the user `alice` with your bearer token, and the context `alice@prod`, which is the current context. To try a vendor tool, you run the commands below. `/tmp/vendor.yaml` defines only a cluster named `prod`, whose `server` is `https://k8s.vendor.example.net`. What happens?

    ```bash
    export KUBECONFIG=/tmp/vendor.yaml:$HOME/.kube/config
    kubectl get pods
    ```
body:
  options:
    - id: a
      text: { en: "`kubectl` uses your own `prod` entry, because the file that sets `current-context` wins" }
    - id: b
      text: { en: "`kubectl` fails, because two files in `KUBECONFIG` define a cluster with the same name" }
    - id: c
      text: { en: "`kubectl` uses the vendor's `prod` entry but sends no credentials, since that file has no user" }
    - id: d
      text: { en: "`kubectl` sends your `alice` token to the vendor's server, because the first file to set a key wins" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When `KUBECONFIG` lists several files, they are merged and the first file to set a particular value or map key wins. The context `alice@prod` comes from your file, but the cluster named `prod` is taken from `/tmp/vendor.yaml`, so `kubectl` connects to the vendor's server with the credentials of user `alice`. This is one reason to use kubeconfig files only from trusted sources and to inspect them before merging.
  options:
    a:
      en: |
        Each map key is resolved separately: the context can come from one file and the cluster definition from another.
    b:
      en: |
        Duplicate names are not an error when files are merged; the first definition is used and later ones are ignored.
    c:
      en: |
        The user entry comes from your file, because the vendor file does not define `alice`, so your token is sent.
references:
  - title: "Organizing Cluster Access Using kubeconfig Files"
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
