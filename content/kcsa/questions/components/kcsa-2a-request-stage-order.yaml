id: kcsa-2a-request-stage-order
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user runs `kubectl apply` to create a Deployment in the `shop` namespace. In which order does the kube-apiserver process the request before the object is written to etcd?
body:
  options:
    - id: a
      text: { en: "Authorization, then authentication, then admission control" }
    - id: b
      text: { en: "Authentication, then authorization, then admission control" }
    - id: c
      text: { en: "Admission control, then authentication, then authorization" }
    - id: d
      text: { en: "Authentication, then admission control, then authorization" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The API server first identifies the caller (authentication, HTTP 401 on failure), then checks whether that identity may perform the verb on the resource (authorization, HTTP 403 on failure), then runs admission controllers on the object itself. Only after admission and object validation is the object stored in etcd.
  options:
    a:
      en: |
        Authorization needs to know who is calling, so it can only run after authentication has produced a user name and groups.
    c:
      en: |
        Admission control is the last stage before validation and persistence. It only sees requests that were already authenticated and authorized.
    d:
      en: |
        Authorization comes before admission. A request that the identity is not allowed to make is rejected with 403 before any admission controller sees the object.
references:
  - title: Controlling Access to the Kubernetes API
    url: https://kubernetes.io/docs/concepts/security/controlling-access/
  - title: Admission Control in Kubernetes
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
