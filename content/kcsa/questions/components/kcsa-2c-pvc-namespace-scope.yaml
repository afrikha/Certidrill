id: kcsa-2c-pvc-namespace-scope
objective: "2.11.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod in the `shop` namespace sets `persistentVolumeClaim.claimName: ledger-data` in one of its volumes. The claim `ledger-data` exists only in the `payments` namespace. What happens?
body:
  options:
    - id: a
      text: { en: "The Pod cannot use the claim: a claim must be in the same namespace as the Pod" }
    - id: b
      text: { en: "The Pod mounts the claim read-only, because it belongs to another namespace" }
    - id: c
      text: { en: "The Pod mounts the claim, if the claim uses the `ReadWriteMany` access mode" }
    - id: d
      text: { en: "The Pod mounts the claim, if its ServiceAccount can get claims in `payments`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      PersistentVolumeClaims are namespaced, and a claim must exist in the same namespace as the Pod that uses it; the Pod looks for `ledger-data` in `shop` only. This lets administrators dedicate storage to a namespace and control it with RBAC on `persistentvolumeclaims`, while PersistentVolumes remain cluster-wide resources managed by administrators.
  options:
    b:
      en: |
        There is no automatic read-only fallback; a claim from another namespace cannot be referenced at all.
    c:
      en: |
        Even with a "Many" access mode, sharing a claim between Pods is possible only within one namespace.
    d:
      en: |
        The Pod's ServiceAccount permissions do not change how the kubelet resolves the claim reference, which is always in the Pod's own namespace.
references:
  - title: "Persistent Volumes"
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
