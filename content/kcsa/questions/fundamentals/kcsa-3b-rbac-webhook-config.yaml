id: kcsa-3b-rbac-webhook-config
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team asks for `update` and `patch` on `validatingwebhookconfigurations` and `mutatingwebhookconfigurations` so that it can manage its own admission webhook. Why do the Kubernetes RBAC good practices treat these permissions as a privilege escalation risk?
body:
  options:
    - id: a
      text: { en: "A webhook they control can read every admitted object, and a mutating one can change it" }
    - id: b
      text: { en: "These permissions let the holder skip authentication on requests sent to the API server" }
    - id: c
      text: { en: "These permissions also include the `escalate` verb on every ClusterRole of the cluster" }
    - id: d
      text: { en: "These permissions give write access to the audit log files on the control plane hosts" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Whoever controls validating or mutating webhook configurations controls webhooks that can read any object admitted to the cluster, and mutating webhooks can also modify admitted objects, for example to inject a container or relax a security setting. Only cluster administrators should hold these rights.
  options:
    b:
      en: |
        Authentication of API requests is unchanged; the risk is the access that the webhook gains to admitted objects.
    c:
      en: |
        RBAC verbs are independent: these grants include nothing on Roles or ClusterRoles.
    d:
      en: |
        RBAC permissions act on API objects; they give no access to files on the control plane hosts.
references:
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
