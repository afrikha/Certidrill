id: kcsa-3c-quota-needs-defaults
objective: "3.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You add the ResourceQuota below to the `reports` namespace. Afterwards, new Pods of existing Deployments are not created, and the error says that the Pods must specify CPU and memory requests. Several teams deploy in this namespace, and you must fix the problem for all of them without editing their manifests. What should you do?

    ```yaml
    apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: compute
      namespace: reports
    spec:
      hard:
        requests.cpu: "10"
        requests.memory: 20Gi
    ```
body:
  options:
    - id: a
      text: { en: "Create a LimitRange in `reports` with `defaultRequest` values for CPU and memory" }
    - id: b
      text: { en: "Create a PriorityClass with `globalDefault: true` for the Pods of the namespace" }
    - id: c
      text: { en: "Label the namespace with `pod-security.kubernetes.io/enforce: baseline`" }
    - id: d
      text: { en: "Replace the quota keys with `limits.cpu` and `limits.memory`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a quota tracks CPU or memory, every new Pod must specify requests or limits for those resources, otherwise admission may reject it. A LimitRange with `defaultRequest` values injects default requests into containers that set none, so the Pods are admitted and still count against the quota, without any manifest change.
  options:
    b:
      en: |
        A PriorityClass sets scheduling priority; it is cluster-scoped and has nothing to do with resource requests.
    c:
      en: |
        A Pod Security Admission label checks security settings of Pods, not resource requests, so the quota still rejects them.
    d:
      en: |
        A quota on `limits.cpu` and `limits.memory` requires every Pod to declare limits instead, so Pods without any resource settings are still rejected.
references:
  - title: "Resource Quotas"
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
  - title: "Limit Ranges"
    url: https://kubernetes.io/docs/concepts/policy/limit-range/
