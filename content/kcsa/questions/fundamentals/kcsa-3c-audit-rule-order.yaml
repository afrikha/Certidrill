id: kcsa-3c-audit-rule-order
objective: "3.7.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A cluster uses the audit policy below. Its author intended to keep Secret values out of the audit log. What is recorded when a user reads a Secret with `kubectl get secret`?

    ```yaml
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
    - level: RequestResponse
      resources:
      - group: ""
    - level: Metadata
      resources:
      - group: ""
        resources: ["secrets"]
    - level: Metadata
    ```
body:
  options:
    - id: a
      text: { en: "Only metadata, because the more specific rule for `secrets` takes precedence" }
    - id: b
      text: { en: "Only metadata, because the least verbose of the matching rules always wins" }
    - id: c
      text: { en: "Nothing, because two rules that match the same request cancel each other out" }
    - id: d
      text: { en: "Metadata and the response body, which contains the Secret data" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Audit policy rules are evaluated in order, and the first matching rule sets the level of the event. The first rule matches every resource of the core API group, Secrets included, so the read is logged at `RequestResponse` and the returned Secret is written to the log. The `secrets` rule must come before the broader rule.
  options:
    a:
      en: |
        Specificity plays no part: the second rule is never reached for Secrets because the first rule already matches them.
    b:
      en: |
        The level is not chosen by comparing the matching rules; the first match in the list decides.
    c:
      en: |
        Matching rules do not cancel each other out. The first match applies, and only a rule with level `None` stops an event from being logged.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
