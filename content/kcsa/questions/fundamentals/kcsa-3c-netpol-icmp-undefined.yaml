id: kcsa-3c-netpol-icmp-undefined
objective: "3.8.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The same default deny NetworkPolicy for ingress and egress is applied in two clusters that use different network plugins, both of which enforce NetworkPolicy. TCP and UDP connections between the Pods are blocked in both clusters, but `ping` between the Pods still succeeds in one of them. What explains the difference?
body:
  options:
    - id: a
      text: { en: "A default deny blocks ICMP only if `policyTypes` lists `Ingress` before `Egress`" }
    - id: b
      text: { en: "ICMP traffic is answered by the nodes, so it never reaches the Pods' policies" }
    - id: c
      text: { en: "The NetworkPolicy API guarantees deny-all only for TCP, UDP and SCTP; ICMP is plugin-defined" }
    - id: d
      text: { en: "Ping is always allowed, because NetworkPolicy rules apply only to named container ports" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      NetworkPolicy works at layer 4 for TCP, UDP and SCTP. For a deny-all policy, only these protocols are guaranteed to be denied; the behaviour for other protocols such as ICMP is undefined and varies between network plugins, which is why one cluster still answers `ping`.
  options:
    a:
      en: |
        The order of the entries in `policyTypes` has no meaning; it only lists the isolated directions.
    b:
      en: |
        Ping between Pods targets the Pods' own addresses. Whether it is filtered depends on the plugin, not on the node answering it.
    d:
      en: |
        Ports can be numbers or named container ports, and rules are not limited to named ports; ICMP simply has no ports and is not covered by the guarantee.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
