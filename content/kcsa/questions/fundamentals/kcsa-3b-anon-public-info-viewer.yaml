id: kcsa-3b-anon-public-info-viewer
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster uses the default RBAC roles and bindings, and anonymous access is enabled. Which default ClusterRole is bound to the group `system:unauthenticated`, and therefore applies to anonymous requests?
body:
  options:
    - id: a
      text: { en: "`system:discovery`" }
    - id: b
      text: { en: "`system:basic-user`" }
    - id: c
      text: { en: "`view`" }
    - id: d
      text: { en: "`system:public-info-viewer`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `system:public-info-viewer` allows read-only access to non-sensitive information about the cluster, and its default ClusterRoleBinding includes both `system:authenticated` and `system:unauthenticated`. Anything an anonymous caller can do beyond that comes from bindings someone added, which is what an audit should look for.
  options:
    a:
      en: |
        `system:discovery` gives access to the API discovery endpoints and is bound only to `system:authenticated`; it was also bound to unauthenticated callers before v1.14.
    b:
      en: |
        `system:basic-user` lets a user read basic information about themselves and is bound only to `system:authenticated` since v1.14.
    c:
      en: |
        `view` is a user-facing role with no default binding; granting it to `system:unauthenticated` would expose most namespaced objects.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
