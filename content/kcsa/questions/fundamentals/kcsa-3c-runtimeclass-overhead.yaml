id: kcsa-3c-runtimeclass-overhead
objective: "3.6.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Untrusted Pods run in lightweight virtual machines with Kata Containers, selected through a RuntimeClass. Each sandbox consumes extra CPU and memory beyond the containers' own requests, and the scheduler does not take it into account. Which RuntimeClass field declares this extra consumption?
body:
  options:
    - id: a
      text: { en: "`overhead`" }
    - id: b
      text: { en: "`handler`" }
    - id: c
      text: { en: "`scheduling`" }
    - id: d
      text: { en: "`metadata.name`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The `overhead` field of a RuntimeClass declares the resources consumed by the Pod sandbox itself. Pods that use the class carry this overhead, so the cluster, including the scheduler, accounts for it when making decisions about Pods and resources. Stronger isolation through a sandbox has this resource cost.
  options:
    b:
      en: |
        `handler` names the runtime configuration of the container runtime on the node; it says nothing about resource consumption.
    c:
      en: |
        `scheduling` holds a node selector and tolerations that steer Pods to nodes supporting the runtime; it does not declare resources.
    d:
      en: |
        `metadata.name` is the name that Pods reference in `runtimeClassName`.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
