id: kcsa-3b-enc-default-identity
objective: "3.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The kube-apiserver of a cluster runs without the `--encryption-provider-config` flag. Which encryption provider applies to the Secrets it writes to etcd?
body:
  options:
    - id: a
      text: { en: "`identity`, which writes the data without encryption" }
    - id: b
      text: { en: "`aescbc`, with a key generated when the cluster was installed" }
    - id: c
      text: { en: "`secretbox`, with a key derived from the cluster CA" }
    - id: d
      text: { en: "`kms` v2, with the key service of the underlying infrastructure" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without `--encryption-provider-config`, encryption at rest is not enabled. The `identity` provider is the default: it writes resources as they are and provides no confidentiality, so anyone with access to etcd or its backups can read the Secrets.
  options:
    b:
      en: |
        No key is generated at installation; `aescbc` is used only when an EncryptionConfiguration lists it.
    c:
      en: |
        `secretbox` is used only when configured, with a key written in the EncryptionConfiguration file, not derived from the CA.
    d:
      en: |
        KMS v2 requires an EncryptionConfiguration and a KMS plugin; nothing enables it by default.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
