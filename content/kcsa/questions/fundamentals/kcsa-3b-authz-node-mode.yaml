id: kcsa-3b-authz-node-mode
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which authorization mode of the API server grants each kubelet only the permissions it needs for the Pods scheduled to its own node, such as reading the Secrets and ConfigMaps that those Pods use?
body:
  options:
    - id: a
      text: { en: "RBAC" }
    - id: b
      text: { en: "Webhook" }
    - id: c
      text: { en: "Node" }
    - id: d
      text: { en: "ABAC" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Node authorizer is a special-purpose mode that authorizes kubelets, identified as `system:node:<nodeName>` in the group `system:nodes`, based on the Pods bound to their node. It is used with the NodeRestriction admission plugin, which limits the Node and Pod objects a kubelet can modify.
  options:
    a:
      en: |
        RBAC grants what Roles and bindings define; it does not compute a kubelet's access from the Pods scheduled to its node.
    b:
      en: |
        Webhook mode sends authorization decisions to an external HTTP service; it is not the built-in mechanism for kubelet access.
    d:
      en: |
        ABAC evaluates static attribute-based policies from a file; it has no knowledge of which Pods run on which node.
references:
  - title: "Using Node Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/node/
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
