id: kcsa-3c-netpol-no-l7
objective: "3.8.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `orders` service must accept only HTTP `GET` requests on the `/orders` path from the `web` service; other methods and paths must be refused. Which control can enforce this?
body:
  options:
    - id: a
      text: { en: "A NetworkPolicy that allows ingress from the `web` Pods on TCP port 8080 only" }
    - id: b
      text: { en: "A service mesh authorization policy, such as an Istio AuthorizationPolicy" }
    - id: c
      text: { en: "A NetworkPolicy with an `ipBlock` peer that lists the `web` Pods' addresses" }
    - id: d
      text: { en: "A ValidatingAdmissionPolicy that checks the requests sent to the `orders` Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      HTTP methods and paths are layer 7 attributes. A service mesh such as Istio enforces authorization policies on workload traffic and can allow, for example, only `GET` on a given path from a given workload identity.
  options:
    a:
      en: |
        NetworkPolicy works on IP addresses, ports and protocols (layers 3 and 4). It can limit the `web` Pods to port 8080, but not to a method or a path.
    c:
      en: |
        An `ipBlock` still matches addresses only, and it is meant for cluster-external ranges because Pod IPs change.
    d:
      en: |
        Admission policies check requests to the Kubernetes API, such as creating objects; they never see the application traffic between services.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - title: "Security"
    url: https://istio.io/latest/docs/concepts/security/
