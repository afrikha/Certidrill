id: kcsa-3b-rbac-namespace-patch
objective: "3.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The namespace `shop` enforces the Restricted Pod Security Standard through Pod Security Admission labels. A team lead asks for a Role, bound with a RoleBinding in `shop`, that allows `patch` on `namespaces`. Why do the Kubernetes RBAC good practices treat this as a privilege escalation risk?
body:
  options:
    - id: a
      text: { en: "They could patch every other namespace, because namespaces are cluster-scoped" }
    - id: b
      text: { en: "Patching the namespace restarts its Pods without their original securityContext" }
    - id: c
      text: { en: "The `patch` verb on namespaces implicitly includes the `bind` and `escalate` verbs" }
    - id: d
      text: { en: "They could change the labels of `shop` and set a more permissive Pod Security level" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A user who can patch a Namespace object can modify its labels. In clusters that use Pod Security Admission, these labels include `pod-security.kubernetes.io/enforce`, so the user could relax `shop` from Restricted to a more permissive level and then run Pods that the administrators meant to forbid.
  options:
    a:
      en: |
        A RoleBinding grants its rules within its own namespace, so the exposure is the `shop` Namespace object itself, which is enough to weaken its policy.
    b:
      en: |
        Changing namespace labels does not restart or modify existing Pods.
    c:
      en: |
        Verbs are independent: `patch` on namespaces grants nothing on roles or bindings. The risk comes from what the labels control.
references:
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
