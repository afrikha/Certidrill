id: kcsa-3b-secret-base64-repo
objective: "3.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer commits the following manifest to a Git repository that every employee can read. What is the exposure?

    ```yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: db-credentials
      namespace: payments
    type: Opaque
    data:
      password: UGF5bWVudHMtMjAyNiE=
    ```
body:
  options:
    - id: a
      text: { en: "None: the value is encrypted with the cluster's encryption key" }
    - id: b
      text: { en: "Anyone who can read the repository can decode the password, so it must be rotated" }
    - id: c
      text: { en: "The value is exposed only if the cluster has no encryption at rest configured" }
    - id: d
      text: { en: "Only users with RBAC `get` permission on Secrets can decode the value" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Values in the `data` field of a Secret are only base64-encoded, and base64 is an encoding, not encryption: anyone who reads the manifest decodes the password in one command. Sharing or committing a Secret manifest makes the secret available to everyone who can read it, so the credential must be treated as compromised and rotated.
  options:
    a:
      en: |
        Nothing in the manifest is encrypted; base64 provides no confidentiality over plain text.
    c:
      en: |
        Encryption at rest protects data stored in etcd; it cannot protect a copy of the manifest kept in a repository.
    d:
      en: |
        RBAC controls access through the Kubernetes API. A manifest in Git is outside the cluster, and decoding base64 needs no permission.
references:
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
