id: kcsa-3b-secret-missing-required
objective: "3.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Deployment in the namespace `shop` mounts the Secret `api-key` as a volume, without `optional: true`. The Secret has not been created yet. What happens to the new Pods?
body:
  options:
    - id: a
      text: { en: "The containers start, with an empty directory mounted in place of the Secret" }
    - id: b
      text: { en: "No container starts; the kubelet retries and reports an Event for the Pod" }
    - id: c
      text: { en: "The API server rejects the Deployment because it references a Secret that does not exist" }
    - id: d
      text: { en: "The kubelet creates an empty Secret named `api-key` so that the Pods can start" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Secrets referenced by a Pod are required by default: none of the Pod's containers start until all non-optional Secrets are available. When the Secret cannot be fetched, the kubelet periodically retries and reports an Event for the Pod. Only a reference marked `optional: true` lets Kubernetes ignore a missing Secret.
  options:
    a:
      en: |
        Without `optional: true`, a missing Secret blocks the containers from starting instead of being skipped.
    c:
      en: |
        The problem appears when the kubelet fetches the Secret for the Pod; the Deployment itself is accepted.
    d:
      en: |
        The kubelet only reads Secrets that exist; it never creates them.
references:
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
