id: kcsa-3b-rbac-wildcard-risk
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To save time, a platform team gives every application team the following rule in a Role of its namespace. Why do the Kubernetes RBAC good practices advise against it?

    ```yaml
    rules:
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["*"]
    ```
body:
  options:
    - id: a
      text: { en: "Wildcards in a Role apply to every namespace, not only to the Role's namespace" }
    - id: b
      text: { en: "Wildcards make the API server skip admission control for matching requests" }
    - id: c
      text: { en: "Wildcards also grant every resource type added later, such as future custom resources" }
    - id: d
      text: { en: "Wildcards are only valid in ClusterRoles, so the Role silently grants nothing" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes is extensible, so a wildcard grants rights to every object type that exists today and also to types created later, such as the resources of a CRD installed next year. In this Role it already covers Secrets, `pods/exec`, Roles and RoleBindings of the namespace. List explicit resources and verbs instead.
  options:
    a:
      en: |
        A Role is namespaced: even with wildcards, its rules only apply inside the Role's namespace.
    b:
      en: |
        Authorization and admission are separate stages; an RBAC rule never bypasses admission control.
    d:
      en: |
        Wildcards are valid in Roles as well as in ClusterRoles; this Role grants full control of its namespace.
references:
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
