id: kcsa-3a-sa-legacy-secret-risk
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During an audit of namespace `ci`, you find a Secret of type `kubernetes.io/service-account-token` that was created manually years ago for the ServiceAccount `deployer`. What is the main risk of this Secret?
body:
  options:
    - id: a
      text: { en: "Its token never expires, and anyone who can read Secrets in `ci` can authenticate as `deployer`" }
    - id: b
      text: { en: "Its token is rotated every hour, so external scripts that use it break regularly" }
    - id: c
      text: { en: "Its token is accepted only by kubelets, so it cannot be used against the API server" }
    - id: d
      text: { en: "Its token is encrypted with the cluster CA key, so it cannot be inspected during audits" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Secret-based ServiceAccount tokens are long-lived: they do not expire and stay valid until the Secret or the ServiceAccount is deleted. They are stored in the Secret, so every user with read access to Secrets in the namespace can take the token and act as the ServiceAccount. Kubernetes stopped generating them automatically in v1.24 and recommends short-lived tokens from the TokenRequest API.
  options:
    b:
      en: |
        Rotation is a property of the bound tokens that the kubelet requests through the TokenRequest API. A Secret-based token is never rotated.
    c:
      en: |
        ServiceAccount tokens are bearer tokens for the API server. A leaked legacy token gives the ServiceAccount's API permissions.
    d:
      en: |
        The token is a signed JSON Web Token stored in the Secret data, which is only base64-encoded. Anyone who reads the Secret can use it.
references:
  - title: Service Accounts
    url: https://kubernetes.io/docs/concepts/security/service-accounts/
  - title: Managing Service Accounts
    url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
