id: kcsa-3a-pss-profile-names
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team is writing its Pod security policy document. Which list contains exactly the profiles defined by the Kubernetes Pod Security Standards?
body:
  options:
    - id: a
      text: { en: "Unrestricted, Baseline and Hardened" }
    - id: b
      text: { en: "Privileged, Default and Restricted" }
    - id: c
      text: { en: "Privileged, Baseline and Restricted" }
    - id: d
      text: { en: "Permissive, Baseline and Strict" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Pod Security Standards define three cumulative profiles: Privileged (unrestricted), Baseline (prevents known privilege escalations) and Restricted (current Pod hardening best practices). These are also the only level values accepted by the Pod Security Admission labels: `privileged`, `baseline` and `restricted`.
  options:
    a:
      en: |
        There is no "Unrestricted" or "Hardened" profile. The unrestricted profile is called Privileged, and the most hardened one is called Restricted.
    b:
      en: |
        There is no "Default" profile. Baseline is the profile that allows the default, minimally specified Pod configuration, but it is not named Default.
    d:
      en: "\"Permissive\" and \"Strict\" are not Pod Security Standards profiles. The most permissive profile is Privileged and the strictest is Restricted."
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
