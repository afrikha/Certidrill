id: kcsa-3a-pss-privileged-purpose
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the Privileged profile of the Pod Security Standards?
body:
  options:
    - id: a
      text: { en: "It forbids host namespaces but allows privileged containers for system Pods" }
    - id: b
      text: { en: "It is unrestricted and is meant for trusted system and infrastructure workloads" }
    - id: c
      text: { en: "It allows privileged containers only for Pods that use a sandboxed RuntimeClass" }
    - id: d
      text: { en: "It allows only the capabilities listed in an administrator-defined allowlist" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Privileged is the entirely unrestricted profile: it allows known privilege escalations, such as access to the node's host network or privileged containers. It is intended for system- and infrastructure-level workloads managed by privileged, trusted users, such as CNI or storage agents.
  options:
    a:
      en: |
        Privileged places no restriction at all, including on host namespaces. Forbidding host namespaces is a Baseline control.
    c:
      en: |
        The Pod Security Standards do not look at the RuntimeClass. A sandboxed runtime can be exempted in the Pod Security Admission configuration, but that is not what the Privileged profile means.
    d:
      en: |
        None of the profiles uses an administrator-defined capability allowlist. Baseline and Restricted use fixed lists, and Privileged has no capability restriction.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
