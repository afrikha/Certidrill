id: kcsa-3a-psa-no-mutation
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before upgrading, a team relied on its PodSecurityPolicies to fill in default security settings for Pods that did not set them. After moving to Pod Security Admission with `enforce: restricted`, many of the same Pod manifests are rejected.

    What explains this?
body:
  options:
    - id: a
      text: { en: "Pod Security Admission enforces only on Deployments, not on Pods created directly" }
    - id: b
      text: { en: "Pod Security Admission fills in default values only in warn mode" }
    - id: c
      text: { en: "Pod Security Admission only validates Pods and never sets default values" }
    - id: d
      text: { en: "The old policies must first be converted into PodSecurityConfiguration objects" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      PodSecurityPolicy could mutate Pods to set defaults for some fields, which the project listed as a source of confusion. Pod Security Admission is a validating admission controller only: it checks the Pod as submitted. The fields must be set in the manifests, or added by a mutating policy engine such as Kyverno.
  options:
    a:
      en: |
        It is the reverse: `enforce` applies to Pod objects, whether they are created directly or by a controller. Workload resources are only checked by `audit` and `warn`.
    b:
      en: |
        No mode mutates Pods. `warn` only returns a warning to the client.
    d:
      en: |
        PodSecurityConfiguration is the configuration of the admission plugin (defaults and exemptions) in the API server's admission configuration file. It is not a per-policy object and there is no automatic conversion.
references:
  - title: "PodSecurityPolicy Deprecation: Past, Present, and Future"
    url: https://kubernetes.io/blog/2021/04/06/podsecuritypolicy-deprecation-past-present-and-future/
  - title: Admission Control in Kubernetes
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
