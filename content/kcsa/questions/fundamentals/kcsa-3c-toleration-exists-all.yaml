id: kcsa-3c-toleration-exists-all
objective: "3.6.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Sensitive node pools of a cluster are protected with `NoSchedule` taints that use different keys. While reviewing a tenant's Deployment, you find the toleration below. What is its effect?

    ```yaml
    tolerations:
    - operator: Exists
    ```
body:
  options:
    - id: a
      text: { en: "It matches no taint, because a toleration without a key is ignored" }
    - id: b
      text: { en: "It tolerates every taint, so the Pods may land on all the dedicated nodes" }
    - id: c
      text: { en: "It tolerates only taints that have no value, whatever their key" }
    - id: d
      text: { en: "It tolerates only `NoExecute` taints, because no effect is specified" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A toleration with an empty `key` and `operator: Exists` matches all keys, values and effects, so these Pods tolerate every taint in the cluster. They can be scheduled on any dedicated node, which defeats taint-based isolation; admission policies should reject such tolerations in tenant namespaces.
  options:
    a:
      en: |
        An empty key is valid with `Exists` and has the widest meaning: it matches every taint.
    c:
      en: |
        `Exists` ignores the value entirely; it does not restrict the match to taints without a value.
    d:
      en: |
        An empty `effect` matches all effects, not only `NoExecute`.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
