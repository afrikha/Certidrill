id: kcsa-3c-audit-serviceaccount-user
objective: "3.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    While reviewing the audit log, you find the event below. Who made this request?

    ```text
    {
      "kind": "Event",
      "apiVersion": "audit.k8s.io/v1",
      "level": "Metadata",
      "stage": "ResponseComplete",
      "verb": "create",
      "user": {
        "username": "system:serviceaccount:shop:builder",
        "groups": ["system:serviceaccounts", "system:serviceaccounts:shop", "system:authenticated"]
      },
      "objectRef": {"resource": "clusterrolebindings", "apiGroup": "rbac.authorization.k8s.io"},
      "responseStatus": {"code": 201}
    }
    ```
body:
  options:
    - id: a
      text: { en: "A client using the credentials of the `builder` ServiceAccount of the `shop` namespace" }
    - id: b
      text: { en: "A human user named `builder` who belongs to a group named `shop`" }
    - id: c
      text: { en: "The kubelet of the node named `shop`, acting for a Pod named `builder`" }
    - id: d
      text: { en: "The API server itself, acting for the controllers of the `shop` namespace" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      ServiceAccounts authenticate with the username `system:serviceaccount:<namespace>:<name>` and belong to the groups `system:serviceaccounts` and `system:serviceaccounts:<namespace>`. This event shows that a client holding a token of the `builder` ServiceAccount in `shop` successfully created a ClusterRoleBinding, a change worth investigating as possible privilege escalation or persistence.
  options:
    b:
      en: |
        Human users do not get the `system:serviceaccount:` prefix, and `shop` here is the namespace of the ServiceAccount, not a user group.
    c:
      en: |
        Kubelets authenticate as `system:node:<nodeName>` in the `system:nodes` group, not as a ServiceAccount.
    d:
      en: |
        The username identifies the ServiceAccount whose credentials were presented, not the API server.
references:
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
