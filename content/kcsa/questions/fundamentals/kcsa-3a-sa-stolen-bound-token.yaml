id: kcsa-3a-sa-stolen-bound-token
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker gets a shell in a Pod of a Kubernetes v1.37 cluster and copies the token in `/var/run/secrets/kubernetes.io/serviceaccount/token`. The Pod uses the default token mounting.

    Until when can the attacker use this token against the API server?
body:
  options:
    - id: a
      text: { en: "Indefinitely, until the ServiceAccount is deleted" }
    - id: b
      text: { en: "Only for requests sent from the IP address of the same node" }
    - id: c
      text: { en: "Until the kubelet on that node is restarted" }
    - id: d
      text: { en: "Until the token expires or the Pod it is bound to is deleted" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The default token is obtained by the kubelet from the TokenRequest API and mounted in a projected volume. It is time-limited and bound to the Pod: the API server rejects it after its expiry, or once the Pod it is bound to has been deleted. The kubelet refreshes the token before it expires, but the copied token keeps its own expiry time.
  options:
    a:
      en: |
        Indefinite validity describes legacy Secret-based tokens. Since v1.22, Pods receive bound, time-limited tokens.
    b:
      en: |
        ServiceAccount tokens are not tied to a source IP address. A bearer token works from wherever the API server is reachable.
    c:
      en: |
        Restarting the kubelet does not invalidate tokens. Validity depends on the token's expiry and on the bound Pod.
references:
  - title: Managing Service Accounts
    url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
