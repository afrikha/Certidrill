id: kcsa-3b-ns-tld-names
objective: "3.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A user who is allowed to create namespaces creates a namespace named `com`, with a Service named `example` in it. Why is this a security concern for workloads in other namespaces?
body:
  options:
    - id: a
      text: { en: "The namespace can read the Secrets of other namespaces whose names it shadows" }
    - id: b
      text: { en: "Namespaces named after a domain are exempt from NetworkPolicy enforcement" }
    - id: c
      text: { en: "Lookups of `example.com` without a trailing dot may resolve to that Service" }
    - id: d
      text: { en: "The Service receives a public DNS record under `.com` that exposes it to the internet" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Service DNS names have the form `<service>.<namespace>.svc.cluster.local`. A namespace named like a public top-level domain gives its Services short names that overlap public DNS records, so workloads in any namespace that look up such a name without a trailing dot are redirected to the Service. Limit namespace creation to trusted users, and optionally block such names with admission control.
  options:
    a:
      en: |
        Shadowing DNS names redirects traffic; it grants no API access to other namespaces' Secrets.
    b:
      en: |
        NetworkPolicy uses Pod and namespace selectors and IP blocks; a namespace's name does not exempt it.
    d:
      en: |
        Cluster DNS names are internal; creating a namespace publishes nothing in public DNS.
references:
  - title: "Namespaces"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
