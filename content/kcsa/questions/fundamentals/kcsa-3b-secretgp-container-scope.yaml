id: kcsa-3b-secretgp-container-scope
objective: "3.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod in the namespace `payments` runs an `api` container and a `log-shipper` sidecar. Only `api` needs the Secret `db-credentials`. How should the Pod spec expose the Secret to follow the Kubernetes Secret good practices?
body:
  options:
    - id: a
      text: { en: "Mount the Secret volume in both containers with `readOnly: true`" }
    - id: b
      text: { en: "Expose the Secret to both containers as environment variables" }
    - id: c
      text: { en: "Mount the Secret volume in both containers with `defaultMode: 0400`" }
    - id: d
      text: { en: "Define the volume mount of the Secret only in the `api` container" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When several containers share a Pod and only one needs a Secret, define the volume mount (or the environment variables) only in that container, so the others have no access to it. A compromised sidecar then cannot read the credentials.
  options:
    a:
      en: |
        A read-only mount still lets the sidecar read the credentials; it only prevents writing to the volume.
    b:
      en: |
        Environment variables are more prone to leakage than files, and exposing them to both containers still gives the sidecar the credentials.
    c:
      en: |
        File permissions do not reliably keep another container of the Pod out, and the sidecar would still have the files mounted; the good practice is not to mount them there at all.
references:
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
