id: kcsa-3b-anon-disable-flag
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security review asks you to make sure that the kube-apiserver never treats requests without credentials as anonymous requests. The API server is configured with command-line flags only. Which flag meets the requirement?
body:
  options:
    - id: a
      text: { en: "`--anonymous-auth=false`" }
    - id: b
      text: { en: "`--authorization-mode=AlwaysDeny`" }
    - id: c
      text: { en: "`--enable-admission-plugins=NodeRestriction`" }
    - id: d
      text: { en: "`--client-ca-file=/etc/kubernetes/pki/ca.crt`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Anonymous access is enabled by default when an authorization mode other than `AlwaysAllow` is used. Starting the API server with `--anonymous-auth=false` disables it, so requests without credentials are no longer accepted as `system:anonymous`.
  options:
    b:
      en: |
        `AlwaysDeny` is an authorization mode meant for testing: it blocks every request, including those of legitimate users, and anonymous requests would still be created.
    c:
      en: |
        NodeRestriction limits which Node and Pod objects a kubelet can modify; it has no effect on anonymous authentication.
    d:
      en: |
        `--client-ca-file` enables X.509 client certificate authentication. Adding an authenticator does not turn anonymous access off.
references:
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
