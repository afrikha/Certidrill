id: kcsa-3b-ns-kube-public
objective: "3.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team wants to publish a ConfigMap containing internal connection strings in the namespace `kube-public`, so that every workload can find it. Why should a security reviewer object?
body:
  options:
    - id: a
      text: { en: "By convention, `kube-public` is readable by all clients, including unauthenticated ones" }
    - id: b
      text: { en: "Objects in `kube-public` are copied into every namespace, multiplying the exposure" }
    - id: c
      text: { en: "`kube-public` is reserved for node Lease objects and rejects ConfigMaps" }
    - id: d
      text: { en: "Objects in `kube-public` are stored outside etcd and cannot be protected" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kube-public` is readable by all clients, including those that are not authenticated. It is mostly reserved for resources that should be visible and readable publicly throughout the cluster; the public aspect is a convention, but it means nothing confidential belongs there.
  options:
    b:
      en: |
        Kubernetes does not replicate objects of `kube-public` into other namespaces.
    c:
      en: |
        Node Lease objects live in `kube-node-lease`; `kube-public` can hold ConfigMaps.
    d:
      en: |
        Objects in `kube-public` are stored in etcd like those of any other namespace.
references:
  - title: "Namespaces"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
