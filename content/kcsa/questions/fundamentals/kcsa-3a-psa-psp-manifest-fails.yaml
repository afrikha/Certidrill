id: kcsa-3a-psa-psp-manifest-fails
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineer copies an old hardening guide and applies this manifest to a Kubernetes v1.37 cluster:

    ```yaml
    apiVersion: policy/v1beta1
    kind: PodSecurityPolicy
    metadata:
      name: restricted
    ```

    The API server rejects it because the kind is not recognised. Why?
body:
  options:
    - id: a
      text: { en: "The PodSecurityPolicy admission plugin must be enabled before the object can be created" }
    - id: b
      text: { en: "PodSecurityPolicy objects can be created only in the `kube-system` namespace" }
    - id: c
      text: { en: "PodSecurityPolicy moved to the `policy/v1` API version, so only the version is wrong" }
    - id: d
      text: { en: "The PodSecurityPolicy API was removed in v1.25 and replaced by Pod Security Admission" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      PodSecurityPolicy was deprecated in v1.21 and removed in v1.25, so a v1.37 API server no longer serves the kind. The built-in replacement is Pod Security Admission, which enforces the Pod Security Standards per namespace through labels.
  options:
    a:
      en: |
        The PodSecurityPolicy admission plugin was removed together with the API. No flag can bring it back in a current release.
    b:
      en: |
        PodSecurityPolicy was a cluster-scoped object, and in any case the API no longer exists.
    c:
      en: |
        PodSecurityPolicy never reached a `policy/v1` version: it was removed while still in `policy/v1beta1`.
references:
  - title: "PodSecurityPolicy Deprecation: Past, Present, and Future"
    url: https://kubernetes.io/blog/2021/04/06/podsecuritypolicy-deprecation-past-present-and-future/
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
