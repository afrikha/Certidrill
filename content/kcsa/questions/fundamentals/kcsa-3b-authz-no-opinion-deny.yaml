id: kcsa-3b-authz-no-opinion-deny
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The API server runs with `--authorization-mode=Node,RBAC`. An authenticated user sends a request that no RBAC rule grants and that the Node authorizer does not handle. What is the outcome?
body:
  options:
    - id: a
      text: { en: "The request is denied with HTTP 403 Forbidden, because no authorizer allowed it" }
    - id: b
      text: { en: "The request is denied with HTTP 401 Unauthorized, because RBAC cannot identify the user" }
    - id: c
      text: { en: "The request is allowed, because neither authorizer explicitly denied it" }
    - id: d
      text: { en: "The request is passed to admission control, which makes the final decision" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Authorizers are checked in the configured order, and the first one that allows or denies decides. When every authorizer has no opinion, the request is denied and the API server responds with HTTP 403 Forbidden: access is denied by default.
  options:
    b:
      en: |
        401 Unauthorized is the answer to a failed authentication. Here the user is authenticated; the denial comes from authorization.
    c:
      en: |
        Kubernetes denies by default: a request must be allowed by some authorizer. 'No opinion' from every mode results in a denial.
    d:
      en: |
        Admission control only handles requests that authorization has already allowed; it cannot grant access that authorization did not.
references:
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
