id: kcsa-3c-netpol-policytypes-default
objective: "3.8.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The NetworkPolicy below is the only one in the `shop` namespace. Shortly after it is applied, clients can no longer connect to the `app: api` Pods. What is the cause?

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: api-egress
      namespace: shop
    spec:
      podSelector:
        matchLabels: {app: api}
      egress:
      - to:
        - podSelector:
            matchLabels: {app: db}
        ports:
        - {protocol: TCP, port: 5432}
    ```
body:
  options:
    - id: a
      text: { en: "Egress rules also filter reply traffic, so the responses sent to clients are dropped" }
    - id: b
      text: { en: "A policy with egress rules isolates every Pod of the namespace for ingress" }
    - id: c
      text: { en: "Without `policyTypes`, the policy also isolates the `api` Pods for ingress, with no rule" }
    - id: d
      text: { en: "The `app: db` peer applies in both directions, so only the database may connect" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When `policyTypes` is omitted, `Ingress` is always set, and `Egress` is set because the policy has egress rules. The `api` Pods are therefore isolated for ingress, and as the policy has no `ingress` rules, no incoming connection is allowed. Setting `policyTypes: [Egress]` restricts only egress.
  options:
    a:
      en: |
        Reply traffic of an allowed connection is allowed implicitly; the problem is that incoming connections are not allowed at all.
    b:
      en: |
        Only the Pods selected by `podSelector` (`app: api`) are isolated; other Pods of `shop` are not affected.
    d:
      en: |
        Rules are directional: the `to` peer of an egress rule only allows outgoing traffic and grants no ingress.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
