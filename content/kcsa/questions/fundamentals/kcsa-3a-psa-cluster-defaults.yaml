id: kcsa-3a-psa-cluster-defaults
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    On a new cluster, namespaces have no Pod Security Admission labels, and privileged Pods are admitted everywhere. The administrator wants every namespace without an `enforce` label to enforce Baseline, without labelling each namespace.

    What should the administrator configure?
body:
  options:
    - id: a
      text: { en: "An `enforce: baseline` label on `kube-system`, inherited by other namespaces" }
    - id: b
      text: { en: "The `defaults` of the PodSecurity configuration in the admission configuration file" }
    - id: c
      text: { en: "A ConfigMap named `pod-security` in `kube-system` with `enforce: baseline`" }
    - id: d
      text: { en: "An `enforce: baseline` setting in the kubelet configuration of every node" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cluster-wide defaults are set in the `PodSecurityConfiguration` of the `PodSecurity` plugin, inside the `AdmissionConfiguration` file passed to kube-apiserver with `--admission-control-config-file`. The defaults apply to every namespace that has no label for that mode. Out of the box, all three modes default to `privileged`, which explains why privileged Pods were admitted.
  options:
    a:
      en: |
        Namespaces do not inherit labels from each other. A label on `kube-system` only affects `kube-system`.
    c:
      en: |
        Pod Security Admission does not read any ConfigMap. Its cluster-wide configuration lives in the API server's admission configuration file.
    d:
      en: |
        Pod Security Admission runs in the API server, not in the kubelet, and the kubelet configuration has no such setting.
references:
  - title: Enforce Pod Security Standards by Configuring the Built-in Admission Controller
    url: https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-admission-controller/
