id: kcsa-3b-authz-abac-to-rbac
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster still uses ABAC authorization. Every permission change requires editing a policy file on each control plane host and restarting the kube-apiserver. The team wants to manage permissions as Kubernetes objects that can be changed through the API, without restarts. Which authorization mode should they adopt?
body:
  options:
    - id: a
      text: { en: "Node" }
    - id: b
      text: { en: "AlwaysDeny" }
    - id: c
      text: { en: "Webhook" }
    - id: d
      text: { en: "RBAC" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      RBAC uses the `rbac.authorization.k8s.io` API group: Roles, ClusterRoles and their bindings are API objects, so permissions are changed dynamically through the Kubernetes API, without restarting the API server. ABAC policies live in a file, and the API server must be restarted to pick up new policy lines.
  options:
    a:
      en: |
        The Node authorizer only covers kubelets; it cannot express permissions for users and ServiceAccounts.
    b:
      en: |
        AlwaysDeny blocks every request and is only meant for testing.
    c:
      en: |
        A webhook can change its decisions without an API server restart, but the policies live in an external service, not in Kubernetes objects managed through the API.
references:
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
  - title: "Using ABAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/abac/
