id: kcsa-3a-psa-fixed-levels
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security architect who used PodSecurityPolicy asks how policies are defined with Pod Security Admission. Which statement is correct?
body:
  options:
    - id: a
      text: { en: "Administrators write a custom policy object per namespace that lists the allowed fields" }
    - id: b
      text: { en: "Each mode applies one of the three Pod Security Standards levels, chosen with namespace labels" }
    - id: c
      text: { en: "Pods select their policy through an RBAC `use` permission granted to their ServiceAccount" }
    - id: d
      text: { en: "Policies are stored as ConfigMaps in `kube-system` that the API server reloads" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Pod Security Admission does not have custom policies: it enforces the predefined Pod Security Standards. For each mode (`enforce`, `audit`, `warn`), a namespace label selects the level `privileged`, `baseline` or `restricted`, optionally pinned to a Kubernetes version. Custom rules need a policy engine or ValidatingAdmissionPolicy.
  options:
    a:
      en: |
        Custom policy objects were the PodSecurityPolicy model. Pod Security Admission only knows the three standard levels.
    c:
      en: |
        Granting policies through the RBAC `use` verb was how PodSecurityPolicy worked, and one of the reasons it was replaced.
    d:
      en: |
        The level of a namespace is stored in its labels. Cluster-wide defaults and exemptions are set in the API server's admission configuration file, not in ConfigMaps.
references:
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
