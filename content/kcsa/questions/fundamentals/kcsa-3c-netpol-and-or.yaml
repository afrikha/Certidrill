id: kcsa-3c-netpol-and-or
objective: "3.8.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The NetworkPolicy below is the only one that selects the `app: api` Pods of the `shop` namespace, and no policy in the cluster restricts egress. Which sources can open connections to these Pods?

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: api-ingress
      namespace: shop
    spec:
      podSelector:
        matchLabels: {app: api}
      ingress:
      - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: web}
        - podSelector:
            matchLabels: {role: frontend}
    ```
body:
  options:
    - id: a
      text: { en: "Any Pod in the `web` namespace, and Pods labelled `role: frontend` in `shop`" }
    - id: b
      text: { en: "Only Pods labelled `role: frontend` that run in the `web` namespace" }
    - id: c
      text: { en: "Pods labelled `role: frontend` in any namespace of the cluster" }
    - id: d
      text: { en: "Any Pod in the `web` or `shop` namespaces, whatever its labels" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The `from` list has two separate entries, which are combined with OR: the `namespaceSelector` entry allows every Pod of the namespace named `web`, and the `podSelector` entry allows Pods labelled `role: frontend` in the policy's own namespace, `shop`. Only an entry that contains both selectors means AND.
  options:
    b:
      en: |
        This would require both selectors in the same list entry (no dash before `podSelector`), which selects frontend Pods inside the `web` namespace.
    c:
      en: |
        A `podSelector` peer without a `namespaceSelector` selects Pods only in the policy's own namespace, not in every namespace.
    d:
      en: |
        Pods of `shop` are allowed only if they carry the `role: frontend` label; the policy does not allow the whole `shop` namespace.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
