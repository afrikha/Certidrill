id: kcsa-3b-mt-namespace-per-tenant
objective: "3.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Five internal teams of Example Corp will share one cluster. The teams trust each other to a degree, and the goal is mainly to prevent accidents and resource conflicts at the lowest cost. Which tenancy model fits?
body:
  options:
    - id: a
      text: { en: "A namespace per team, with RBAC, NetworkPolicies and quotas in each namespace" }
    - id: b
      text: { en: "A dedicated cluster per team" }
    - id: c
      text: { en: "A virtual control plane per team, with its own API server" }
    - id: d
      text: { en: "A single shared namespace, with one ServiceAccount per team" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Namespace isolation is well supported and has a negligible resource cost, which suits soft multi-tenancy between teams of one organization. Each namespace gets its own RBAC, NetworkPolicies, quotas and Pod security settings, while cluster-scoped resources, nodes and the control plane remain shared.
  options:
    b:
      en: |
        A cluster per tenant gives the strongest isolation but at the highest cost and operational complexity, which this scenario does not need.
    c:
      en: |
        Virtual control planes isolate cluster-scoped resources at a higher resource cost; nothing here requires that.
    d:
      en: |
        A shared namespace gives no boundary for RBAC, quotas or network policies between the teams.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
