id: kcsa-3b-secretgp-etcd-disk
objective: "3.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An etcd member of a production cluster is being decommissioned, and its data disk will be returned to a hardware pool. Which Secret good practice applies to this disk?
body:
  options:
    - id: a
      text: { en: "Keep the disk unchanged as an extra backup of the cluster state" }
    - id: b
      text: { en: "Remove the member from the etcd cluster; its local data is then deleted automatically" }
    - id: c
      text: { en: "Wipe or shred the durable storage that etcd used before the disk is reused" }
    - id: d
      text: { en: "Rotate the cluster CA so that the data on the disk can no longer be read" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Secret good practices recommend wiping or shredding the durable storage used by etcd once it is no longer in use. The disk holds the cluster's Secrets, unencrypted unless encryption at rest is configured, so returning it intact would leak them.
  options:
    a:
      en: |
        An uncontrolled copy of etcd data exposes every Secret it contains; backups must be protected, not left on returned hardware.
    b:
      en: |
        Removing a member from the etcd cluster does not erase the data already written to its disk.
    d:
      en: |
        The cluster CA signs certificates; rotating it does not encrypt or erase data already stored on the disk.
references:
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
