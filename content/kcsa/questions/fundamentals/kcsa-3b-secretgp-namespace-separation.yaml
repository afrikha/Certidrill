id: kcsa-3b-secretgp-namespace-separation
objective: "3.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment service and a reporting tool both run in the namespace `apps`, and the reporting team is allowed to create Pods there. The payment database credentials are stored in a Secret in `apps`. Which change best keeps reporting workloads from mounting these credentials?
body:
  options:
    - id: a
      text: { en: "Mark the payment Secret `immutable: true` so that no Pod can change it" }
    - id: b
      text: { en: "Move the payment workloads and Secret to a namespace the reporting team cannot deploy to" }
    - id: c
      text: { en: "Mount the payment Secret with `defaultMode: 0400` in the payment Pods" }
    - id: d
      text: { en: "Encrypt the Secrets of `apps` at rest with the `secretbox` provider" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Anyone who can create a Pod in a namespace can read any Secret of that namespace by mounting it. The Secret good practices therefore recommend separate namespaces to isolate access to mounted Secrets: once the payment Secret lives where the reporting team cannot create Pods, its workloads can no longer mount it.
  options:
    a:
      en: |
        Immutability prevents changes to the Secret, not reading it from a new Pod.
    c:
      en: |
        File permissions apply inside the Pod that mounts the Secret; they do not stop another Pod from mounting it.
    d:
      en: |
        Encryption at rest protects etcd data; a Pod that mounts the Secret receives the decrypted value.
references:
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
