id: kcsa-3b-cani-serviceaccount
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You need to confirm whether the ServiceAccount `deployer` of the namespace `ci` can create Pods in the namespace `shop`. You are allowed to impersonate ServiceAccounts. Which command checks this?
body:
  options:
    - id: a
      text: { en: "`kubectl auth can-i create pods -n ci --as deployer`" }
    - id: b
      text: { en: "`kubectl auth can-i create pods -n shop --as system:serviceaccount:ci:deployer`" }
    - id: c
      text: { en: "`kubectl auth can-i create pods -n shop --as system:serviceaccounts:ci:deployer`" }
    - id: d
      text: { en: "`kubectl auth can-i create pods -n shop --as-group system:serviceaccount:ci:deployer`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A ServiceAccount is impersonated with its full username, `system:serviceaccount:<namespace>:<name>`, and `-n` sets the namespace in which the action is checked, here `shop`. The command answers `yes` or `no` for that identity.
  options:
    a:
      en: |
        `--as deployer` impersonates a normal user named `deployer`, not the ServiceAccount, and `-n ci` checks the wrong namespace.
    c:
      en: |
        `system:serviceaccounts:` (plural) is the prefix of ServiceAccount group names; usernames use `system:serviceaccount:` (singular).
    d:
      en: |
        `--as-group` sets a group, and a ServiceAccount username is not a group name; group impersonation also requires a user given with `--as`.
references:
  - title: "kubectl auth can-i"
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_auth/kubectl_auth_can-i/
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
