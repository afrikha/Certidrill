id: kcsa-3a-psa-enforce-existing-pods
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Namespace `shop` runs a Deployment with three replicas whose containers run as root. You add the label `pod-security.kubernetes.io/enforce: restricted` to the namespace. Later, one of the Pods is deleted when its node is drained.

    What is the result?
body:
  options:
    - id: a
      text: { en: "The label is added with warnings, the running Pods continue, and the replacement Pod is rejected" }
    - id: b
      text: { en: "The label change is refused until every violating Pod in the namespace is deleted" }
    - id: c
      text: { en: "The violating Pods are evicted as soon as the label is added, and none of them is recreated" }
    - id: d
      text: { en: "The running Pods are changed to run as non-root, and the replacement Pod is admitted" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Pod Security Admission acts when Pods are created. When the `enforce` label is added, the plugin only reports the existing violating Pods as warnings; they keep running. When the drained Pod is replaced, the ReplicaSet creates a new Pod, which violates Restricted and is rejected, so the Deployment ends up with fewer replicas than desired.
  options:
    b:
      en: |
        The label change is accepted. Existing violations are returned as warnings, not errors.
    c:
      en: |
        Pod Security Admission never evicts running Pods. Only new Pods are checked against the enforced level.
    d:
      en: |
        Pod Security Admission only validates and never mutates Pods, so nothing changes the user of running or new Pods.
references:
  - title: Enforce Pod Security Standards with Namespace Labels
    url: https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-namespace-labels/
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
