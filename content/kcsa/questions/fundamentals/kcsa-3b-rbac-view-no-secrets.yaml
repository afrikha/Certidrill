id: kcsa-3b-rbac-view-no-secrets
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A support engineer needs read-only access to most objects in the namespace `shop` but must not be able to read Secrets, Roles or RoleBindings. Which built-in ClusterRole should you grant with a RoleBinding in `shop`?
body:
  options:
    - id: a
      text: { en: "`edit`" }
    - id: b
      text: { en: "`admin`" }
    - id: c
      text: { en: "`cluster-admin`" }
    - id: d
      text: { en: "`view`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `view` ClusterRole allows read-only access to most objects in a namespace. It excludes Roles and RoleBindings, and it deliberately excludes Secrets, because reading them would expose ServiceAccount credentials. Granted with a RoleBinding, it applies only to `shop`.
  options:
    a:
      en: |
        `edit` allows writes, and it can read Secrets and run Pods as any ServiceAccount of the namespace.
    b:
      en: |
        `admin` grants read and write access to most namespaced resources, including Roles and RoleBindings.
    c:
      en: |
        `cluster-admin` allows any action; even in a RoleBinding, it gives full control of the namespace.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
