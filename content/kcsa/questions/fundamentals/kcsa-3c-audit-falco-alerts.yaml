id: kcsa-3c-audit-falco-alerts
objective: "3.7.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You want real-time alerts when the Kubernetes API is used in suspicious ways, for example when a user is granted `cluster-admin`. The API server already sends its audit events through the webhook backend. Which project can receive these events and evaluate rules against them?
body:
  options:
    - id: a
      text: { en: "kube-bench, run as a Kubernetes Job" }
    - id: b
      text: { en: "Trivy, run as an image scanner" }
    - id: c
      text: { en: "Falco, with its k8saudit plugin" }
    - id: d
      text: { en: "cert-manager, with a ClusterIssuer" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Falco's k8saudit plugin runs an embedded web server that accepts audit events posted by the API server's webhook backend. Falco evaluates its rules against these events, for example to flag overly broad permissions such as `cluster-admin`, and raises alerts in real time.
  options:
    a:
      en: |
        kube-bench checks the configuration of cluster components against the CIS Kubernetes Benchmark; it does not analyse a stream of API activity.
    b:
      en: |
        Trivy scans images and configurations for vulnerabilities and misconfigurations; it does not consume audit events.
    d:
      en: |
        cert-manager issues and renews certificates; it has no role in analysing audit logs.
references:
  - title: "Kubernetes Audit Events"
    url: https://falco.org/docs/concepts/event-sources/plugins/kubernetes-audit/
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
