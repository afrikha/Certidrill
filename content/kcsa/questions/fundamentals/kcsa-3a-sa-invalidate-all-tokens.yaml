id: kcsa-3a-sa-invalidate-all-tokens
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A CI system obtained several short-lived tokens for the ServiceAccount `deployer` in namespace `ci` with `kubectl create token`, and one of them has leaked. You must make the API server reject every token already issued for `deployer`, immediately.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Delete and recreate the ServiceAccount `deployer`, so that its UID changes" }
    - id: b
      text: { en: "Delete the Secret in `ci` that stores the leaked token" }
    - id: c
      text: { en: "Set `automountServiceAccountToken: false` on the ServiceAccount" }
    - id: d
      text: { en: "Restart the kubelet on every node to rotate all tokens" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Tokens from the TokenRequest API cannot be revoked individually, because there is no central record of them. Each token carries the ServiceAccount's UID, so deleting and recreating the ServiceAccount gives it a new UID and invalidates all tokens issued for the old one. Bindings that name `deployer` apply again to the new ServiceAccount. Validators that check tokens offline instead of through the API server may still accept them until they expire.
  options:
    b:
      en: |
        `kubectl create token` uses the TokenRequest API: the token is returned to the caller and is not stored in any Secret.
    c:
      en: |
        This only stops the token from being mounted into new Pods. Tokens already issued remain valid.
    d:
      en: |
        The kubelet only refreshes tokens of the Pods it runs. Restarting it does not invalidate tokens obtained with `kubectl create token`.
references:
  - title: Managing Service Accounts
    url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
