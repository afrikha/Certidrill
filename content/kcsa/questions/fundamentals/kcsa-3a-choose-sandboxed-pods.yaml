id: kcsa-3a-choose-sandboxed-pods
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp runs untrusted build jobs in Pods that use a RuntimeClass backed by gVisor. An engineer proposes enforcing the Privileged profile in the build namespace, because the sandbox already isolates the Pods from the host kernel.

    What does the Kubernetes documentation say about choosing a profile for sandboxed Pods?
body:
  options:
    - id: a
      text: { en: "Sandboxed Pods are outside the scope of the Pod Security Standards and need no profile" }
    - id: b
      text: { en: "Sandboxed Pods should always run under Privileged, as their runtime already isolates them" }
    - id: c
      text: { en: "Sandboxed Pods cannot run in a namespace that enforces Restricted" }
    - id: d
      text: { en: "No single profile is recommended, because the protection depends on the sandboxing method" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The documentation notes that there is no API standard that marks a Pod as sandboxed and no standard definition of a sandboxed runtime. Some restrictions matter less when a workload is isolated from the host kernel, but the protection depends on the sandbox, so there is no single recommended profile. Granting Privileged to untrusted jobs is not automatically justified.
  options:
    a:
      en: |
        Pods that use a sandboxed RuntimeClass are still evaluated against the namespace's level, unless an administrator explicitly exempts that RuntimeClass in the admission configuration.
    b:
      en: |
        The documentation makes no such recommendation. Privileged is intended for trusted system workloads, not for untrusted jobs.
    c:
      en: |
        The Pod Security Standards do not check `runtimeClassName`. A sandboxed Pod that meets the Restricted controls is admitted.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
