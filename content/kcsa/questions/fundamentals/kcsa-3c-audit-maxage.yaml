id: kcsa-3c-audit-maxage
objective: "3.7.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    kube-apiserver runs with the flag `--audit-log-maxage=30`. What does this setting control?
body:
  options:
    - id: a
      text: { en: "The maximum number of days to keep old audit log files" }
    - id: b
      text: { en: "The maximum size, in megabytes, of the log file before rotation" }
    - id: c
      text: { en: "The maximum number of old audit log files to keep" }
    - id: d
      text: { en: "The maximum time, in seconds, that events wait in the batch buffer" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `--audit-log-maxage` defines the maximum number of days to retain old audit log files on the control plane host. Together with `--audit-log-maxbackup` and `--audit-log-maxsize`, it manages local disk space; long-term retention for compliance should rely on an external store.
  options:
    b:
      en: |
        The size that triggers rotation is set with `--audit-log-maxsize`.
    c:
      en: |
        The number of rotated files to keep is set with `--audit-log-maxbackup`.
    d:
      en: |
        How long a batch waits before it is sent is a batching setting, such as `--audit-webhook-batch-max-wait`, not a log retention setting.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
