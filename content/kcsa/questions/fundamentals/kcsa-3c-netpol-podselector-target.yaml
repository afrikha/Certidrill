id: kcsa-3c-netpol-podselector-target
objective: "3.8.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a NetworkPolicy, what does the top-level `spec.podSelector` field select?
body:
  options:
    - id: a
      text: { en: "The source Pods that are allowed to send traffic to the namespace" }
    - id: b
      text: { en: "The Pods in every namespace whose traffic the policy denies" }
    - id: c
      text: { en: "The Pods in the policy's namespace to which the policy applies" }
    - id: d
      text: { en: "The destination Pods that every Pod of the namespace may reach" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `spec.podSelector` chooses the Pods that the policy applies to, in the namespace of the policy. These Pods become isolated for the directions listed in `policyTypes`, and only the traffic allowed by the `ingress` and `egress` rules reaches or leaves them. An empty selector `{}` selects every Pod of the namespace.
  options:
    a:
      en: |
        Allowed sources are listed as peers in the `from` part of the ingress rules, not in the top-level `podSelector`.
    b:
      en: |
        A NetworkPolicy only selects Pods in its own namespace, and it has no deny rules: it isolates the selected Pods and lists what is allowed.
    d:
      en: |
        Allowed destinations are peers in the `to` part of the egress rules; the top-level selector names the Pods being protected.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
