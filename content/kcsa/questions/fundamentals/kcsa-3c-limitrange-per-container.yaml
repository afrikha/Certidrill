id: kcsa-3c-limitrange-per-container
objective: "3.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the `sandbox` namespace, developers often deploy containers without any resource requests or limits. You must give such containers a default memory request and limit, and reject any container whose memory limit is above 1 GiB. Which object meets both requirements?
body:
  options:
    - id: a
      text: { en: "A ResourceQuota that sets `limits.memory` to `1Gi`" }
    - id: b
      text: { en: "A PriorityClass that sets `preemptionPolicy: Never`" }
    - id: c
      text: { en: "A LimitRange of type `Container` with `default`, `defaultRequest` and `max`" }
    - id: d
      text: { en: "The namespace label `pod-security.kubernetes.io/enforce: restricted`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A LimitRange works per container (or per Pod or PersistentVolumeClaim) in its namespace. At admission it injects the `default` and `defaultRequest` values into containers that set no compute resource requirements, and it rejects with HTTP 403 Forbidden any container that exceeds the `max` value.
  options:
    a:
      en: |
        A ResourceQuota caps the namespace total, so `limits.memory: 1Gi` would allow only 1 GiB for all containers together, and it does not set default values.
    b:
      en: |
        A PriorityClass controls scheduling priority and preemption; it neither sets resource defaults nor checks memory limits.
    d:
      en: |
        The Restricted Pod Security Standard checks security settings such as running as non-root and dropping capabilities. It does not require or limit resource requests.
references:
  - title: "Limit Ranges"
    url: https://kubernetes.io/docs/concepts/policy/limit-range/
