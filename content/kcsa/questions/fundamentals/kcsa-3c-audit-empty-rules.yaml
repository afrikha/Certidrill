id: kcsa-3c-audit-empty-rules
objective: "3.7.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    To keep auditing as light as possible, an administrator writes the audit policy below and passes it to kube-apiserver with `--audit-policy-file`. What is the result?

    ```yaml
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules: []
    ```
body:
  options:
    - id: a
      text: { en: "Every request is logged at the `Metadata` level, the default" }
    - id: b
      text: { en: "Every request is logged at the `RequestResponse` level" }
    - id: c
      text: { en: "The policy is invalid, because a policy must contain at least one rule" }
    - id: d
      text: { en: "Only failed requests are logged, at the `Metadata` level" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `rules` field of an audit policy must be provided, and a policy with zero rules is treated as illegal. To record as little as possible, write explicit rules, for example a single `level: Metadata` rule, and add `level: None` rules for the requests you do not want to keep.
  options:
    a:
      en: |
        There is no default level that applies without a rule; the level always comes from the first matching rule.
    b:
      en: |
        An empty rule list does not mean full logging; such a policy is not accepted at all.
    d:
      en: |
        Audit policies select requests by user, verb, resource or namespace, not by their outcome, and this policy has no rule at all.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
