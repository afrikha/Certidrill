id: kcsa-3b-mt-quota-network
objective: "3.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform uses a namespace per tenant, and each tenant namespace has a ResourceQuota covering CPU, memory, storage and object counts. A tenant complains that a noisy neighbor still degrades its service. According to the Kubernetes multi-tenancy guidance, which kind of shared resource can quotas not protect?
body:
  options:
    - id: a
      text: { en: "The CPU requested by the other tenant's Pods" }
    - id: b
      text: { en: "Network traffic between the tenants' workloads" }
    - id: c
      text: { en: "The number of Pods the other tenant can create" }
    - id: d
      text: { en: "The storage the other tenant requests through PVCs" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Quotas limit compute, storage and object counts per namespace, but they cannot protect against every kind of resource sharing, such as network traffic. Tenants that share nodes and networks can still affect each other, which is one reason to add node isolation or separate clusters for tenants that need stronger guarantees.
  options:
    a:
      en: |
        CPU requests and limits are exactly what a compute ResourceQuota can cap for a namespace.
    c:
      en: |
        Object counts such as `pods` can be capped by a ResourceQuota.
    d:
      en: |
        The total storage requested through PersistentVolumeClaims can be capped by a ResourceQuota.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
