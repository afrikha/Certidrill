id: kcsa-3a-authn-system-authenticated
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During a review, you find a ClusterRoleBinding that grants a ClusterRole to the group `system:authenticated`. Who receives the permissions of that ClusterRole?
body:
  options:
    - id: a
      text: { en: "Only users whose client certificate is signed by the cluster CA" }
    - id: b
      text: { en: "Only ServiceAccounts, because people are not API objects" }
    - id: c
      text: { en: "Every caller that authenticates, users and ServiceAccounts alike" }
    - id: d
      text: { en: "Every caller, including requests sent without any credential" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The API server adds `system:authenticated` to the groups of every request that passes authentication, whatever the method: client certificate, OIDC token, ServiceAccount token and so on. A binding to this group therefore gives the permissions to every identity in the cluster, which is rarely least privilege.
  options:
    a:
      en: |
        The group is not tied to one authentication method. Users authenticated with OIDC or a webhook, and ServiceAccounts, are members too.
    b:
      en: |
        Normal users are not API objects, but they still authenticate and receive the `system:authenticated` group.
    d:
      en: |
        Requests without credentials are anonymous: they get the username `system:anonymous` and the group `system:unauthenticated`, not `system:authenticated`.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
