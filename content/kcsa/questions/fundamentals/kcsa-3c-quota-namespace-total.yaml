id: kcsa-3c-quota-namespace-total
objective: "3.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The `analytics` team shares a cluster with other teams. You must ensure that the sum of the CPU requests of all Pods in the `analytics` namespace never exceeds 20 CPUs. Which object should you create in the namespace?
body:
  options:
    - id: a
      text: { en: "A LimitRange of type `Container` with `max.cpu` set to `20`" }
    - id: b
      text: { en: "A ResourceQuota with `requests.cpu` set to `20`" }
    - id: c
      text: { en: "A PriorityClass with a low value for the team's Pods" }
    - id: d
      text: { en: "A HorizontalPodAutoscaler with `maxReplicas` for each Deployment" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A ResourceQuota limits the aggregate resource consumption of one namespace. With `requests.cpu: "20"`, the sum of the CPU requests of all non-terminal Pods in `analytics` cannot exceed 20 CPUs, and a create or update that would go over the quota is rejected with HTTP 403 Forbidden.
  options:
    a:
      en: |
        A LimitRange constrains each container or Pod individually. A maximum of 20 CPUs per container does not cap the total of the namespace.
    c:
      en: |
        A PriorityClass influences scheduling order and preemption; it does not limit how much CPU the namespace can request.
    d:
      en: |
        A HorizontalPodAutoscaler bounds the replicas of one workload. It does not cap the namespace total, and workloads without an autoscaler are not covered.
references:
  - title: "Resource Quotas"
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
