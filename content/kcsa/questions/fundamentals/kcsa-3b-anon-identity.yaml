id: kcsa-3b-anon-identity
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The API server of a cluster has anonymous access enabled. A client sends a request without any credential, and no authenticator rejects it. Which username and group does the API server assign to the request before authorization?
body:
  options:
    - id: a
      text: { en: "Username `system:anonymous`, group `system:authenticated`" }
    - id: b
      text: { en: "Username `system:unauthenticated`, group `system:anonymous`" }
    - id: c
      text: { en: "Username `system:anonymous`, group `system:unauthenticated`" }
    - id: d
      text: { en: "Username `system:serviceaccount:default:default`, group `system:serviceaccounts`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When anonymous access is enabled, a request that no configured authenticator rejects is treated as an anonymous request, with the username `system:anonymous` and the group `system:unauthenticated`. Authorization then decides what these identities may do, which is why no binding should grant them permissions.
  options:
    a:
      en: |
        `system:authenticated` is added only to requests that an authenticator successfully authenticated. An anonymous request does not receive it.
    b:
      en: |
        The names are reversed: `system:anonymous` is the username and `system:unauthenticated` is the group.
    d:
      en: |
        This is the identity of the `default` ServiceAccount, which requires a valid ServiceAccount token. A request without credentials is not mapped to a ServiceAccount.
references:
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
