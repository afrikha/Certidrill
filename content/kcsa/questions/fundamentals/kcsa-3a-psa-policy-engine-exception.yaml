id: kcsa-3a-psa-policy-engine-exception
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Namespace `shop` must apply the Baseline rules to all its Pods, except the Pods of Deployment `netdiag`, which need the `NET_ADMIN` capability. For organisational reasons, `netdiag` must stay in `shop`.

    Which approach meets the requirement?
body:
  options:
    - id: a
      text: { en: "Exempt the username of the developer who deploys `netdiag`" }
    - id: b
      text: { en: "Label `shop` with `enforce: privileged` and `audit: baseline`" }
    - id: c
      text: { en: "Use a policy engine such as Kyverno in `shop`, with an exception for `netdiag`" }
    - id: d
      text: { en: "Pin `enforce-version` of `shop` to a version that allowed `NET_ADMIN`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The built-in Pod Security Admission controller works per namespace and can exempt only by username, RuntimeClass or namespace, so it cannot make an exception for one workload inside a namespace. A policy engine such as Kyverno or OPA Gatekeeper can enforce Baseline-equivalent rules with a targeted exception for the `netdiag` Pods. The Pod Security Admission `enforce` level of `shop` is then lowered (or the namespace exempted) so that the engine's rules decide.
  options:
    a:
      en: |
        The Pods of a Deployment are created by the ReplicaSet controller, not by the developer, so a username exemption does not apply to them.
    b:
      en: |
        Enforcing Privileged would let every Pod of `shop` bypass the Baseline rules. The audit mode only records violations; it blocks nothing.
    d:
      en: |
        Version pinning keeps an earlier definition of a profile, and no version of Baseline allows adding `NET_ADMIN`.
references:
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
