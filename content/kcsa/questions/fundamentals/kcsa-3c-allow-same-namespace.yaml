id: kcsa-3c-allow-same-namespace
objective: "3.8.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The `shop` namespace has a default deny ingress policy. You must now allow every Pod of `shop` to receive traffic from the other Pods of `shop`, while traffic from other namespaces stays blocked. Which `from` peer should the new policy, with `podSelector: {}`, use?
body:
  options:
    - id: a
      text: { en: "`- namespaceSelector: {}`" }
    - id: b
      text: { en: "`- podSelector: {}`" }
    - id: c
      text: { en: "`- ipBlock` with the cluster's Pod address range" }
    - id: d
      text: { en: "No `from` field, so that the rule matches all sources" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A `podSelector` peer selects Pods in the policy's own namespace, and an empty selector selects all of them. The rule therefore allows ingress from every Pod of `shop` and from nothing else, so the default deny still blocks the other namespaces.
  options:
    a:
      en: |
        An empty `namespaceSelector` selects all namespaces, so every Pod of the cluster would be allowed.
    c:
      en: |
        An `ipBlock` is meant for addresses outside the cluster, and the whole Pod range would include the Pods of every namespace.
    d:
      en: |
        A rule without `from` matches every source, inside and outside the cluster.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
