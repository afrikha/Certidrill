id: kcsa-3a-choose-separate-namespace
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Namespace `shop` enforces the Baseline profile with the built-in Pod Security Admission controller. A new network diagnostics Deployment needs the `NET_ADMIN` capability. All the other workloads of `shop` must stay at Baseline, and the cluster uses no third-party policy engine.

    What should you do?
body:
  options:
    - id: a
      text: { en: "Change the `enforce` label of `shop` to `privileged` and keep `warn` at `baseline`" }
    - id: b
      text: { en: "Exempt the `replicaset-controller` ServiceAccount in the admission configuration" }
    - id: c
      text: { en: "Run the diagnostics Pods in a separate namespace that enforces Privileged" }
    - id: d
      text: { en: "Set `enforce-version` on `shop` to an older Kubernetes minor version" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The built-in controller applies one level per namespace, so the clean solution is to isolate the workload that needs more privileges in its own namespace, enforce the level it needs there, and limit who can deploy to it with RBAC. The documentation stresses that privileges beyond Baseline are application-specific and that Privileged should not be granted broadly.
  options:
    a:
      en: |
        Enforcing Privileged on `shop` would let every Pod of the namespace use host namespaces, privileged mode or any capability. A warning does not block anything.
    b:
      en: |
        Exempting a controller ServiceAccount would exempt every Pod created through a Deployment or ReplicaSet, in every namespace. The documentation warns against it.
    d:
      en: |
        Version pinning keeps the definition of a profile from an earlier release. No version of Baseline allows adding `NET_ADMIN`.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
