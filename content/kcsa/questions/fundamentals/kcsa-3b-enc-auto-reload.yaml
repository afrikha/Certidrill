id: kcsa-3b-enc-auto-reload
objective: "3.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Encryption at rest uses an `aescbc` key stored in the EncryptionConfiguration file. You must add a new key to the file during a key rotation, and the API servers must pick up the change without being restarted. What should be configured?
body:
  options:
    - id: a
      text: { en: "Apply the updated EncryptionConfiguration to the cluster with `kubectl apply`" }
    - id: b
      text: { en: "Start the API servers with `--encryption-provider-config-automatic-reload=true`" }
    - id: c
      text: { en: "Restart etcd so that it loads the new key from the configuration file" }
    - id: d
      text: { en: "Mark every Secret `immutable: true` so that it is encrypted again with the new key" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `--encryption-provider-config-automatic-reload=true`, the API server polls the configuration file and applies changes, so encryption keys can be rotated without restarting it. After the new key becomes the one used for writing, existing Secrets still need to be rewritten to be encrypted with it.
  options:
    a:
      en: |
        The EncryptionConfiguration is a file read by the API server, not an API object applied with `kubectl`.
    c:
      en: |
        etcd stores what the API server writes and knows nothing about encryption providers or keys.
    d:
      en: |
        Immutability prevents changes to a Secret's data; it does not re-encrypt anything, and immutable Secrets cannot be updated.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
