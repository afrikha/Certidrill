id: kcsa-3a-pss-empty-pod-levels
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer creates this Pod. It sets no securityContext at all.

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: web
    spec:
      containers:
      - name: web
        image: registry.example.com/shop/web:1.4.2
    ```

    Which Pod Security Standards profiles does this Pod satisfy?
body:
  options:
    - id: a
      text: { en: "Privileged only" }
    - id: b
      text: { en: "Privileged, Baseline and Restricted" }
    - id: c
      text: { en: "Privileged and Baseline, but not Restricted" }
    - id: d
      text: { en: "None of them until a securityContext is added" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Baseline allows the default, minimally specified Pod configuration: an unset field is accepted for host namespaces, privileged mode, capabilities and seccomp. Restricted, however, requires fields to be set explicitly, such as `runAsNonRoot: true`, `allowPrivilegeEscalation: false`, dropping `ALL` capabilities and a `RuntimeDefault` or `Localhost` seccomp profile, so an empty securityContext fails it.
  options:
    a:
      en: |
        The Pod uses no host namespace, privileged mode, hostPath volume or added capability, so nothing in it violates Baseline.
    b:
      en: |
        Restricted is not satisfied by default values. For example, an unset seccomp profile and a missing `runAsNonRoot: true` are both violations of Restricted.
    d:
      en: |
        Privileged has no requirements at all, and Baseline accepts unset fields, so the Pod already satisfies two profiles.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
