id: kcsa-3a-psa-warn-only-admitted
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The API server uses the default Pod Security Admission configuration. Namespace `shop` has only these labels:

    ```yaml
    metadata:
      name: shop
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    ```

    A developer creates a Pod with a privileged container. `kubectl` prints a warning, but the Pod is created. Why?
body:
  options:
    - id: a
      text: { en: "The Restricted profile does not check the `privileged` field" }
    - id: b
      text: { en: "The audit mode blocks Pods only when an audit webhook backend is configured" }
    - id: c
      text: { en: "The warn and audit modes are skipped for Pods created directly with `kubectl`" }
    - id: d
      text: { en: "No enforce label is set, so the default enforce level, privileged, applies" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `warn` and `audit` modes never block a Pod: they return a warning and annotate the audit log. Blocking requires an `enforce` label. Without one, the namespace uses the cluster default for `enforce`, which is `privileged` unless an administrator changed it in the admission configuration.
  options:
    a:
      en: |
        Restricted includes every Baseline control, and Baseline forbids privileged containers. That is why the warning appears.
    b:
      en: |
        The audit mode never blocks a request, whatever audit backend is used. It only adds an annotation to the audit event.
    c:
      en: |
        The warning shows that the warn mode was applied. Both modes apply to Pods however they are created.
references:
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - title: Enforce Pod Security Standards by Configuring the Built-in Admission Controller
    url: https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-admission-controller/
