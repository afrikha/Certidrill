id: kcsa-3c-audit-generated-by
objective: "3.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An auditor asks which cluster component produces Kubernetes audit events, the chronological records of who called the Kubernetes API, what they did and with what result. Which component generates them?
body:
  options:
    - id: a
      text: { en: "The kubelet on each node" }
    - id: b
      text: { en: "etcd" }
    - id: c
      text: { en: "kube-apiserver" }
    - id: d
      text: { en: "kube-controller-manager" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Auditing is performed inside kube-apiserver. Each request to the Kubernetes API, whether from users, controllers, nodes or Pods, generates an audit event at each stage of its execution; the audit policy filters these events and backends write them out.
  options:
    a:
      en: |
        The kubelet serves its own API on each node, but it does not produce Kubernetes audit events. Requests sent directly to a kubelet are not recorded in the API server's audit log.
    b:
      en: |
        etcd stores the cluster state that the API server persists; it does not record who called the Kubernetes API.
    d:
      en: |
        kube-controller-manager is a client of the API server. Its calls are audited by kube-apiserver like any other client's.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
