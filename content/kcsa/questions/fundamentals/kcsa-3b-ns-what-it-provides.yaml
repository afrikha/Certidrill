id: kcsa-3b-ns-what-it-provides
objective: "3.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes what a namespace provides on its own, without any additional control?
body:
  options:
    - id: a
      text: { en: "A separate network segment that other namespaces cannot reach" }
    - id: b
      text: { en: "Dedicated nodes for the Pods of the namespace" }
    - id: c
      text: { en: "A separate kernel for the containers of the namespace" }
    - id: d
      text: { en: "A scope for object names and for policies such as RBAC Roles" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A namespace isolates groups of API resources in two ways: object names only need to be unique inside it, and many security policies, such as RBAC Roles and NetworkPolicies, are namespace-scoped. Network, node and kernel separation require other controls.
  options:
    a:
      en: |
        Pods are non-isolated by default, whatever their namespace; NetworkPolicies enforced by the network plugin are needed to restrict traffic.
    b:
      en: |
        Pods of all namespaces share the cluster's nodes unless taints, tolerations and node affinity dedicate nodes.
    c:
      en: |
        Containers share the node's kernel whatever their namespace; sandboxed runtimes or virtual machines are needed for a separate kernel.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
