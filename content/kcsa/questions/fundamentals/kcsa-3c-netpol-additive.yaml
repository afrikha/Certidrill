id: kcsa-3c-netpol-additive
objective: "3.8.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two NetworkPolicies in the `orders` namespace select the Pods labelled `app: orders`. Policy A allows ingress from Pods labelled `app: frontend` on TCP port 8080. Policy B allows ingress from Pods labelled `app: metrics` on TCP port 9090. All these Pods run in `orders`, and no policy restricts egress. Which traffic to the `app: orders` Pods is allowed?
body:
  options:
    - id: a
      text: { en: "Only the flow of the policy that was created most recently" }
    - id: b
      text: { en: "Both flows, because the policies are combined as a union" }
    - id: c
      text: { en: "Neither flow, because policies selecting the same Pods conflict" }
    - id: d
      text: { en: "Only traffic that both policies allow, which here is none" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      NetworkPolicies are additive and never conflict. The traffic allowed to a Pod is the union of what every policy that selects it allows, so frontend Pods can reach port 8080 and metrics Pods can reach port 9090. The order in which policies are evaluated or created does not affect the result.
  options:
    a:
      en: |
        Creation time plays no part; every policy that selects the Pods contributes its allowed traffic.
    c:
      en: |
        Policies cannot conflict because they only contain allow rules.
    d:
      en: |
        Policies are not intersected; adding a policy can only allow more traffic to the Pods it selects.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
