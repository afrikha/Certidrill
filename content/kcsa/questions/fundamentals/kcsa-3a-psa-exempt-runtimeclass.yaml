id: kcsa-3a-psa-exempt-runtimeclass
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Cluster administrators decide that Pods which use the RuntimeClass `kata`, in any namespace, must skip Pod Security Admission checks. Which exemption list of the PodSecurity admission configuration should they use?
body:
  options:
    - id: a
      text: { en: "`namespaces`" }
    - id: b
      text: { en: "`usernames`" }
    - id: c
      text: { en: "`podSelectors`" }
    - id: d
      text: { en: "`runtimeClasses`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The PodSecurity configuration supports three exemption dimensions: `usernames`, `runtimeClasses` and `namespaces`. Listing `kata` in `runtimeClasses` exempts Pods and workload resources that specify that RuntimeClass, whatever their namespace. An exempt request skips the enforce, audit and warn modes.
  options:
    a:
      en: |
        A namespace exemption would skip checks for every Pod of the listed namespaces, whatever their runtime, and would not cover `kata` Pods elsewhere.
    b:
      en: |
        A username exemption applies to requests from specific authenticated users. It does not select Pods by runtime.
    c:
      en: |
        There is no Pod selector exemption in the PodSecurity configuration. The only dimensions are usernames, RuntimeClasses and namespaces.
references:
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
  - title: Enforce Pod Security Standards by Configuring the Built-in Admission Controller
    url: https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-admission-controller/
