id: kcsa-3a-authn-sa-namespace-group
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A RoleBinding in namespace `shop` has this subject:

    ```yaml
    subjects:
    - kind: Group
      name: system:serviceaccounts:ci
      apiGroup: rbac.authorization.k8s.io
    ```

    Which identities does the binding apply to?
body:
  options:
    - id: a
      text: { en: "Every ServiceAccount of namespace `ci`" }
    - id: b
      text: { en: "Every ServiceAccount of the cluster" }
    - id: c
      text: { en: "The ServiceAccount named `ci` in namespace `shop`" }
    - id: d
      text: { en: "Every user whose username starts with `ci`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each ServiceAccount authenticates with the username `system:serviceaccount:NAMESPACE:NAME` and belongs to the groups `system:serviceaccounts` and `system:serviceaccounts:NAMESPACE`. The group `system:serviceaccounts:ci` therefore contains all ServiceAccounts of namespace `ci`, which get the Role's permissions in `shop`.
  options:
    b:
      en: |
        All ServiceAccounts of the cluster form the group `system:serviceaccounts`, without a namespace suffix.
    c:
      en: |
        A single ServiceAccount is a subject of kind `ServiceAccount` with a name and namespace, or the username `system:serviceaccount:shop:ci`. The plural group form designates a namespace.
    d:
      en: |
        RBAC matches group names exactly. There is no prefix matching on usernames.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
