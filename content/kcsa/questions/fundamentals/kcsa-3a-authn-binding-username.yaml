id: kcsa-3a-authn-binding-username
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp authenticates engineers with an OpenID Connect provider. An administrator creates a RoleBinding whose subject is `kind: User`, `name: alice@example.com`. No object named `alice@example.com` exists in the cluster.

    How does this binding take effect?
body:
  options:
    - id: a
      text: { en: "It stays inactive until an administrator creates a User object with that name" }
    - id: b
      text: { en: "It applies to any request that an authenticator maps to the username `alice@example.com`" }
    - id: c
      text: { en: "The API server creates a User object for alice the first time she logs in" }
    - id: d
      text: { en: "It applies only when alice presents a client certificate signed by the cluster CA" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes has no object that represents a normal user, and users cannot be added through an API call. RBAC simply compares the username and groups produced by authentication with the subjects of its bindings, so the binding applies to whatever authenticated request carries that username, here from the OIDC token.
  options:
    a:
      en: |
        There is no User kind in the Kubernetes API, so no such object can be created. Only ServiceAccounts are identity objects.
    c:
      en: |
        Authentication never creates objects for normal users. Their identity is managed outside the cluster.
    d:
      en: |
        Any configured authenticator can produce the username. With OIDC, it comes from a claim of the ID token, not from a certificate.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
