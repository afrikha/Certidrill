id: kcsa-3a-sa-automount-precedence
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The ServiceAccount `reporter` in namespace `shop` sets `automountServiceAccountToken: false`. A developer creates a Pod that uses `reporter` and sets `automountServiceAccountToken: true` in the Pod spec.

    What happens?
body:
  options:
    - id: a
      text: { en: "No token is mounted, because the ServiceAccount setting wins" }
    - id: b
      text: { en: "The Pod is rejected, because the two settings conflict" }
    - id: c
      text: { en: "A token is mounted, because the Pod spec takes precedence" }
    - id: d
      text: { en: "A token is mounted only if the namespace allows it with a label" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `automountServiceAccountToken` can be set on the ServiceAccount and on the Pod. When both specify a value, the Pod spec takes precedence, so the token is mounted. Restricting who can create Pods with that ServiceAccount therefore matters as much as the ServiceAccount setting.
  options:
    a:
      en: |
        The ServiceAccount value applies only when the Pod does not set the field.
    b:
      en: |
        Different values on the ServiceAccount and the Pod are not a conflict. The Pod value simply overrides the ServiceAccount value.
    d:
      en: |
        No namespace label controls token mounting. Only the two `automountServiceAccountToken` fields do.
references:
  - title: Configure Service Accounts for Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
