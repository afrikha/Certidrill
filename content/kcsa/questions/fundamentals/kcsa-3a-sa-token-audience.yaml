id: kcsa-3a-sa-token-audience
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod in namespace `shop` must authenticate to an internal Vault service with a Kubernetes ServiceAccount token. The token sent to Vault must be short-lived, and it must not be accepted by the Kubernetes API server if it leaks.

    What should you configure in the Pod?
body:
  options:
    - id: a
      text: { en: "A manually created `kubernetes.io/service-account-token` Secret, mounted as a volume" }
    - id: b
      text: { en: "A projected volume with a `serviceAccountToken` source that sets `audience: vault`" }
    - id: c
      text: { en: "`automountServiceAccountToken: true` set on the Pod's ServiceAccount" }
    - id: d
      text: { en: "A ConfigMap that holds a token generated with `kubectl create token`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A `serviceAccountToken` source in a projected volume makes the kubelet request a short-lived token through the TokenRequest API for the given audience (with an optional `expirationSeconds`), and rotate it. The token's audience claim is `vault`, so Vault can check it, while the API server, which only accepts its own audiences, rejects it.
  options:
    a:
      en: |
        A Secret-based token never expires, and its audience is the API server, so a leak would give API access.
    c:
      en: |
        The automatically mounted token is meant for the API server. It does not have the `vault` audience.
    d:
      en: |
        A token copied into a ConfigMap is not rotated, expires without renewal, and is stored in an object that is not meant for sensitive data.
references:
  - title: Configure Service Accounts for Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
