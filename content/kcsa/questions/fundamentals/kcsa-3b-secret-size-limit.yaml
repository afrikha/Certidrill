id: kcsa-3b-secret-size-limit
objective: "3.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Kubernetes limits each individual Secret to 1 MiB. What is the purpose of this limit?
body:
  options:
    - id: a
      text: { en: "To keep each Secret inside a single encryption block of the `aescbc` provider" }
    - id: b
      text: { en: "To work around base64, which cannot encode values larger than 1 MiB" }
    - id: c
      text: { en: "To discourage very large Secrets that could exhaust API server and kubelet memory" }
    - id: d
      text: { en: "To make sure that every Secret fits in the environment of a container" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Individual Secrets are limited to 1 MiB to discourage very large Secrets that could exhaust the memory of the API server and of the kubelets. Many small Secrets can exhaust memory too, so a ResourceQuota can also limit the number of Secrets in a namespace.
  options:
    a:
      en: |
        The limit is unrelated to encryption providers; it applies whether or not encryption at rest is configured.
    b:
      en: |
        Base64 can encode data of any size; the limit is a protection against resource exhaustion.
    d:
      en: |
        Secrets can be consumed as volumes as well as environment variables; the limit is not tied to environment size.
references:
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
