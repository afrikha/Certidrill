id: kcsa-3a-psa-admission-stage
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user with permission to create Pods in namespace `shop` sends a request to create a privileged Pod. At which stage of the API request does Pod Security Admission evaluate the Pod?
body:
  options:
    - id: a
      text: { en: "During admission control, after authentication and authorization" }
    - id: b
      text: { en: "During authentication, before the caller's identity is known" }
    - id: c
      text: { en: "During authorization, together with the RBAC check" }
    - id: d
      text: { en: "On the node, when the kubelet starts the container" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Pod Security Admission is the `PodSecurity` admission plugin, a validating admission controller built into the API server and enabled by default. Like every admission controller, it runs after the request has been authenticated and authorized, and before the object is persisted in etcd.
  options:
    b:
      en: |
        Authentication only establishes who the caller is. It does not look at the content of the Pod.
    c:
      en: |
        Authorization (for example RBAC) decides whether the user may create Pods at all. It does not inspect the Pod's securityContext; that is the job of admission.
    d:
      en: |
        The decision is taken in the API server before the Pod is stored. A rejected Pod never reaches the scheduler or a kubelet.
references:
  - title: Admission Control in Kubernetes
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
