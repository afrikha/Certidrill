id: kcsa-3b-enc-kms-v1-config
objective: "3.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster upgraded to Kubernetes v1.37 still uses the provider below in its EncryptionConfiguration. What should the team know about it?

    ```yaml
      providers:
      - kms:
          apiVersion: v1
          name: corp-kms
          endpoint: unix:///var/run/kmsplugin/socket.sock
    ```
body:
  options:
    - id: a
      text: { en: "KMS v1 is the recommended version, because KMS v2 is still an alpha feature" }
    - id: b
      text: { en: "KMS v1 and KMS v2 are equivalent; only the plugin socket path differs" }
    - id: c
      text: { en: "KMS v1 is deprecated and disabled by default, so the provider should move to KMS v2" }
    - id: d
      text: { en: "KMS v1 was removed in v1.25, together with PodSecurityPolicy" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      KMS v1 is deprecated since v1.28 and disabled by default since v1.29: using it requires turning on the `KMSv1` feature gate. KMS v2, stable since v1.29, offers significantly better performance and is the version to use for envelope encryption with an external key management service.
  options:
    a:
      en: |
        KMS v2 has been stable since v1.29; it is KMS v1 that is deprecated.
    b:
      en: |
        The two versions differ: KMS v2 generates data encryption keys differently and performs significantly better, and KMS v1 is disabled by default.
    d:
      en: |
        KMS v1 was not removed in v1.25; it was deprecated in v1.28 and is disabled by default since v1.29, but can still be enabled with a feature gate.
references:
  - title: "Using a KMS provider for data encryption"
    url: https://kubernetes.io/docs/tasks/administer-cluster/kms-provider/
