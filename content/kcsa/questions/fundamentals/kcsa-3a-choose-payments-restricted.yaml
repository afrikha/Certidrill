id: kcsa-3a-choose-payments-restricted
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp creates namespace `payments` for a security-critical card processing API. The images are built to run as a non-root user and need no host access.

    Which Pod Security Standards profile should the namespace enforce?
body:
  options:
    - id: a
      text: { en: "Privileged" }
    - id: b
      text: { en: "Baseline" }
    - id: c
      text: { en: "Restricted" }
    - id: d
      text: { en: "No profile, because a NetworkPolicy already isolates the namespace" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Restricted follows current Pod hardening best practices and targets security-critical applications. Workloads that already run as non-root and need no host access can usually meet its requirements (non-root user, no privilege escalation, all capabilities dropped, a seccomp profile) with little effort.
  options:
    a:
      en: |
        Privileged places no restriction on Pods. It is meant for trusted system workloads, not for a sensitive application.
    b:
      en: |
        Baseline only blocks known privilege escalations. It would still allow containers that run as root with all default capabilities, which is weaker than needed for a security-critical service that can meet Restricted.
    d:
      en: |
        A NetworkPolicy controls network traffic between Pods. It does nothing about privileged containers, host access or running as root, which the Pod Security Standards address.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
