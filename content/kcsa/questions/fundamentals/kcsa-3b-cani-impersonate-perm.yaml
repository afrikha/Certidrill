id: kcsa-3b-cani-impersonate-perm
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An auditor runs `kubectl auth can-i list secrets -n payments --as alice` and receives an error saying that they cannot impersonate the user `alice`. Which permission does the auditor's own identity need?
body:
  options:
    - id: a
      text: { en: "`escalate` on `clusterroles` in the `rbac.authorization.k8s.io` group" }
    - id: b
      text: { en: "`get` on `rolebindings` in the `payments` namespace" }
    - id: c
      text: { en: "`create` on `serviceaccounts/token` in the `payments` namespace" }
    - id: d
      text: { en: "`impersonate` on `users`, granted with a ClusterRole and a ClusterRoleBinding" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `--as` sets the `Impersonate-User` header, and the API server checks that the caller may perform the `impersonate` verb on `users` before evaluating the request as `alice`. Impersonation is not namespace-scoped, so RBAC grants it with a ClusterRole and a ClusterRoleBinding; `resourceNames` can limit which users may be impersonated.
  options:
    a:
      en: |
        `escalate` lets someone write roles with more permissions than they hold; it does not authorize impersonation headers.
    b:
      en: |
        Reading RoleBindings shows configuration, but it is not what the API server checks for impersonation headers.
    c:
      en: |
        `create` on `serviceaccounts/token` issues tokens for ServiceAccounts; `--as` does not use it, and `alice` is a user.
references:
  - title: "User Impersonation"
    url: https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  - title: "kubectl auth can-i"
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_auth/kubectl_auth_can-i/
