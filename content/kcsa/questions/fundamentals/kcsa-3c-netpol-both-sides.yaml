id: kcsa-3c-netpol-both-sides
objective: "3.8.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `shop` namespace has a default deny policy for ingress and egress, and a policy that allows DNS egress for all its Pods. You add a policy that allows ingress to the `app: db` Pods from the `app: api` Pods on TCP port 5432. The `api` Pods still cannot connect to the database. What is missing?
body:
  options:
    - id: a
      text: { en: "An ingress rule on the `api` Pods for the replies sent by the `db` Pods" }
    - id: b
      text: { en: "A `namespaceSelector` in the new rule, because `podSelector` peers need one" }
    - id: c
      text: { en: "An egress policy that allows the `api` Pods to reach the `db` Pods on TCP 5432" }
    - id: d
      text: { en: "Removing the default deny policy, because deny policies override allow rules" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For a connection between two Pods, both the egress side of the source and the ingress side of the destination must allow it. The `api` Pods are isolated for egress by the default deny, so a policy selecting them must also allow egress to the `db` Pods on TCP port 5432.
  options:
    a:
      en: |
        Replies of an allowed connection are allowed implicitly; no rule is needed for them.
    b:
      en: |
        A `podSelector` peer without a `namespaceSelector` selects Pods in the policy's own namespace, which is where the `api` Pods run.
    d:
      en: |
        NetworkPolicies contain no deny rules and never override each other: the default deny only isolates the Pods, and allow policies add to it.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
