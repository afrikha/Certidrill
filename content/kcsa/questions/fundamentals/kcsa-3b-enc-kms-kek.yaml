id: kcsa-3b-enc-kms-kek
objective: "3.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Encryption at rest is configured with a KMS v2 provider. In this envelope encryption scheme, what does the key encryption key (KEK), held in the remote key management service, encrypt?
body:
  options:
    - id: a
      text: { en: "Each Secret value directly, one resource at a time" }
    - id: b
      text: { en: "The TLS traffic between the API server and etcd" }
    - id: c
      text: { en: "The EncryptionConfiguration file stored on the control plane hosts" }
    - id: d
      text: { en: "The data encryption keys (DEKs) that encrypt the stored resources" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With envelope encryption, resources are encrypted with data encryption keys (DEKs), and the DEKs are encrypted with a key encryption key (KEK) that stays in the remote KMS. The API server reaches the KMS through a KMS plugin over a UNIX domain socket, so the KEK never has to be written on the control plane hosts.
  options:
    a:
      en: |
        The resources are encrypted with DEKs; the KEK only wraps those DEKs.
    b:
      en: |
        TLS between the API server and etcd uses certificates; it is unrelated to encryption at rest.
    c:
      en: |
        The EncryptionConfiguration file is read by the API server; KMS does not encrypt it.
references:
  - title: "Using a KMS provider for data encryption"
    url: https://kubernetes.io/docs/tasks/administer-cluster/kms-provider/
