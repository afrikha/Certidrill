id: kcsa-3a-restricted-drop-all
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Namespace `payments` enforces the Restricted profile. This Pod is rejected:

    ```yaml
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: registry.example.com/payments/api:3.1.0
        securityContext:
          allowPrivilegeEscalation: false
    ```

    What must you add to the container securityContext so that the Pod is admitted?
body:
  options:
    - id: a
      text: { en: "`readOnlyRootFilesystem: true`" }
    - id: b
      text: { en: "`privileged: false`" }
    - id: c
      text: { en: "`runAsUser: 0`" }
    - id: d
      text: { en: "`capabilities: {drop: [\"ALL\"]}`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Restricted requires every Linux container to drop all capabilities: `capabilities.drop` must include `ALL`, and only `NET_BIND_SERVICE` may be added back. The Pod already sets `runAsNonRoot: true`, a `RuntimeDefault` seccomp profile and `allowPrivilegeEscalation: false`, so the missing drop is the only violation.
  options:
    a:
      en: |
        A read-only root filesystem is good practice, but Restricted does not require it, and it would not fix the missing capability drop.
    b:
      en: |
        An unset `privileged` field already means `false`, so setting it explicitly changes nothing.
    c:
      en: |
        Restricted forbids `runAsUser: 0`. Adding it would create a second violation.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
