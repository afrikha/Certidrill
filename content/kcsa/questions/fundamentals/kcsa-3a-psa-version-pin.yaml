id: kcsa-3a-psa-version-pin
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Namespace `payments` has these labels:

    ```yaml
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    ```

    What is the effect of the `enforce-version` label?
body:
  options:
    - id: a
      text: { en: "Pods are checked against Restricted as defined in v1.37, even after the cluster is upgraded" }
    - id: b
      text: { en: "Pods are rejected if their images were built for a Kubernetes version older than v1.37" }
    - id: c
      text: { en: "The Restricted level is enforced only on nodes whose kubelet runs v1.37" }
    - id: d
      text: { en: "Only clients that use `kubectl` v1.37 can create Pods in the namespace" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The optional `MODE-version` label pins the policy to the definition shipped with a given Kubernetes minor version (or `latest`, the default). When a later release adds a control to a profile, Pods in a pinned namespace keep being checked against the older definition, so an upgrade does not suddenly reject them.
  options:
    b:
      en: |
        Pod Security Admission does not inspect images. The version refers to the definition of the Pod Security Standards.
    c:
      en: |
        Pod Security Admission runs in the API server and does not depend on kubelet versions.
    d:
      en: |
        The label has nothing to do with client versions. Any client authorized to create Pods can do so.
references:
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
