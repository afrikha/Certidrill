id: kcsa-3b-anon-view-binding
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    During an audit you find the following ClusterRoleBinding. The API server runs with `--authorization-mode=Node,RBAC` and the default anonymous settings. What is the risk?

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: legacy-dashboard-read
    subjects:
    - kind: Group
      name: system:unauthenticated
      apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: ClusterRole
      name: view
      apiGroup: rbac.authorization.k8s.io
    ```
body:
  options:
    - id: a
      text: { en: "None: anonymous requests stay disabled unless `--anonymous-auth=true` is set" }
    - id: b
      text: { en: "Any client that reaches the API server without credentials can read most objects in every namespace" }
    - id: c
      text: { en: "Any client without credentials can read the contents of every Secret in the cluster" }
    - id: d
      text: { en: "Only health endpoints such as `/healthz` are exposed, because `view` covers non-resource URLs" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With an authorization mode other than `AlwaysAllow`, anonymous access is enabled by default, and anonymous requests belong to the group `system:unauthenticated`. Binding `view` to that group with a ClusterRoleBinding lets anyone who can reach the API server, with no credential at all, read most namespaced objects in all namespaces. Remove the binding, and disable or restrict anonymous access.
  options:
    a:
      en: |
        Anonymous access is on by default when the authorization mode is not `AlwaysAllow`; `--anonymous-auth=false` is needed to turn it off.
    c:
      en: |
        The `view` ClusterRole deliberately excludes Secrets, because reading them would expose ServiceAccount credentials. The exposure is serious, but Secret contents are not part of it.
    d:
      en: |
        `view` grants read access to namespaced resources such as Pods, Services and ConfigMaps, so the exposure goes well beyond health endpoints.
references:
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
