id: kcsa-3b-cani-list
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want to see every action that your current credentials allow in the namespace `shop`. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl auth whoami -n shop`" }
    - id: b
      text: { en: "`kubectl get rolebindings -n shop -o wide`" }
    - id: c
      text: { en: "`kubectl auth can-i --list -n shop`" }
    - id: d
      text: { en: "`kubectl auth reconcile -n shop`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubectl auth can-i --list` prints all actions allowed for the current user in the namespace, using a `SelfSubjectRulesReview`. The answer reflects every binding of the user and of their groups, whatever the binding type.
  options:
    a:
      en: |
        `kubectl auth whoami` shows the user attributes (username and groups) that the API server sees, not the permissions.
    b:
      en: |
        Listing RoleBindings ignores ClusterRoleBindings, group memberships and the rules of the referenced roles, so it does not give effective permissions.
    d:
      en: |
        `kubectl auth reconcile` creates or updates RBAC objects from a file; it does not report permissions.
references:
  - title: "kubectl auth can-i"
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_auth/kubectl_auth_can-i/
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
