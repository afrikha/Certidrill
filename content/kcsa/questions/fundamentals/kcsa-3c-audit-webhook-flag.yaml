id: kcsa-3c-audit-webhook-flag
objective: "3.7.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You must send the API server's audit events to an external log collection service over HTTPS, in addition to the local log file. Which kube-apiserver flag configures this backend?
body:
  options:
    - id: a
      text: { en: "`--audit-policy-file`" }
    - id: b
      text: { en: "`--authentication-token-webhook-config-file`" }
    - id: c
      text: { en: "`--audit-log-path`" }
    - id: d
      text: { en: "`--audit-webhook-config-file`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The webhook backend sends audit events to a remote web API. `--audit-webhook-config-file` points to its configuration, a kubeconfig-style file that holds the address of the remote service and the credentials used to connect to it. By default this backend buffers events and sends them in batches.
  options:
    a:
      en: |
        `--audit-policy-file` sets which events are recorded and at which level; it does not choose where they are sent.
    b:
      en: |
        This flag configures webhook token authentication, which checks bearer tokens; it has nothing to do with audit events.
    c:
      en: |
        `--audit-log-path` configures the log backend, which writes to a local file or to standard output.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
