id: kcsa-3b-ns-cluster-scoped
objective: "3.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which of these resources is cluster-scoped, so that giving each team its own namespace does not separate it between teams?
body:
  options:
    - id: a
      text: { en: "PersistentVolumeClaim" }
    - id: b
      text: { en: "PersistentVolume" }
    - id: c
      text: { en: "Role" }
    - id: d
      text: { en: "Secret" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Low-level resources such as Nodes and PersistentVolumes are not in any namespace, and neither are namespaces themselves. A PersistentVolume has a lifecycle independent of workloads and namespaces, so namespace-scoped controls alone do not separate it between tenants.
  options:
    a:
      en: |
        A PersistentVolumeClaim is namespaced: it is a namespace's request for storage.
    c:
      en: |
        A Role always belongs to a single namespace.
    d:
      en: |
        Secrets are namespaced objects.
references:
  - title: "Namespaces"
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
