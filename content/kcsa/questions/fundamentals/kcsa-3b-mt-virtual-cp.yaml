id: kcsa-3b-mt-virtual-cp
objective: "3.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Each tenant of a shared platform must be able to install its own CustomResourceDefinitions and admission webhooks without conflicting with other tenants. Tenants may share worker nodes, and the provider wants to avoid running a full cluster per tenant. Which model meets these requirements?
body:
  options:
    - id: a
      text: { en: "A namespace per tenant, with a ResourceQuota on each namespace" }
    - id: b
      text: { en: "A namespace per tenant, with a dedicated node pool for each tenant" }
    - id: c
      text: { en: "One shared namespace with Pod Security Admission set to `restricted`" }
    - id: d
      text: { en: "A virtual control plane per tenant, running on shared nodes" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      CRDs and webhooks are cluster-scoped, so namespace isolation does not apply to them. A virtual control plane per tenant isolates these non-namespaced resources and avoids conflicts between them, at a somewhat higher resource cost, without building a separate cluster for each tenant.
  options:
    a:
      en: |
        Quotas limit consumption per namespace; CRDs and webhooks remain shared by every namespace and can conflict.
    b:
      en: |
        Dedicated nodes separate the data plane, but CRDs and webhooks remain cluster-wide in the single control plane.
    c:
      en: |
        Pod Security Admission restricts Pod settings; it does not let tenants install their own cluster-scoped resources.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
