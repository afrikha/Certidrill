id: kcsa-3c-netpol-no-logging
objective: "3.8.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After a default deny NetworkPolicy is applied, the security team wants a record of the connections that are blocked, to spot misconfigured clients and probing attempts. How can this be achieved?
body:
  options:
    - id: a
      text: { en: "Use flow logging from the network plugin, since the NetworkPolicy API cannot log" }
    - id: b
      text: { en: "Add an audit policy rule at the `RequestResponse` level for `networkpolicies`" }
    - id: c
      text: { en: "List both `Ingress` and `Egress` in `policyTypes` to turn on connection logging" }
    - id: d
      text: { en: "Run `kubectl describe networkpolicy` to display the connections it blocked" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The NetworkPolicy API has no logging of network security events. Visibility into allowed and dropped connections must come from the implementation, for example the flow logging or observability features of a network plugin that offers them.
  options:
    b:
      en: |
        The audit log records calls to the Kubernetes API, such as creating or changing NetworkPolicy objects, not the network connections they block.
    c:
      en: |
        `policyTypes` sets which directions are isolated; it does not enable any logging.
    d:
      en: |
        `kubectl describe` shows how the policy was interpreted (selectors, peers, ports), not traffic statistics.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
