id: kcsa-3c-quota-object-count
objective: "3.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A tenant of a shared cluster runs a faulty controller that keeps creating Secrets in its namespace, and the cluster operator is worried about exhausting control plane storage. You need to limit the number of Secrets that can exist in the tenant's namespace. What should you configure?
body:
  options:
    - id: a
      text: { en: "A LimitRange of type `PersistentVolumeClaim` with a `max` storage value" }
    - id: b
      text: { en: "An API Priority and Fairness FlowSchema for the tenant's ServiceAccount" }
    - id: c
      text: { en: "An EncryptionConfiguration that encrypts Secrets with the `aescbc` provider" }
    - id: d
      text: { en: "A ResourceQuota in the namespace with a maximum for `count/secrets`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A ResourceQuota can limit object counts per namespace, for example `count/secrets` (or `secrets`). Once the maximum is reached, further creations are rejected. The Kubernetes documentation names this use: object count quotas protect against exhausting control plane storage.
  options:
    a:
      en: |
        A LimitRange for PersistentVolumeClaims bounds the storage requested by each claim; it does not limit how many Secrets exist.
    b:
      en: |
        API Priority and Fairness regulates how many requests the API server handles at the same time. A slower controller still accumulates Secrets with no upper bound.
    c:
      en: |
        Encryption at rest protects the confidentiality of stored Secrets; it does not limit their number.
references:
  - title: "Resource Quotas"
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
