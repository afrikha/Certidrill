id: kcsa-3c-taint-repels
objective: "3.6.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A group of nodes must run only the security team's monitoring agents. Any Pod that has not been explicitly allowed onto these nodes must be kept off them by the scheduler. What should you set on the nodes?
body:
  options:
    - id: a
      text: { en: "A taint with the `NoSchedule` effect" }
    - id: b
      text: { en: "A label that the agents reference in a `nodeSelector`" }
    - id: c
      text: { en: "A label that the agents reference in a required node affinity" }
    - id: d
      text: { en: "A label with the `node-restriction.kubernetes.io/` prefix" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A taint lets a node repel Pods: with the `NoSchedule` effect, no new Pod is scheduled on the node unless it has a matching toleration. Only the monitoring agents receive the toleration, so every other Pod is kept away.
  options:
    b:
      en: |
        A `nodeSelector` attracts the Pods that use it to labelled nodes, but it does nothing to keep other Pods off those nodes.
    c:
      en: |
        Node affinity, like a node selector, constrains where the selecting Pods go. Pods without the affinity can still be scheduled on the nodes.
    d:
      en: |
        With NodeRestriction, labels under this prefix cannot be changed by the kubelet, which protects them from a compromised node. A label alone still does not repel any Pod.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
