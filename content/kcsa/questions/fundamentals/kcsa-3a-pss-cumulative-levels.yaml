id: kcsa-3a-pss-cumulative-levels
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod in namespace `payments` satisfies every control of the Restricted profile. The team now wants to move the same Pod to namespace `shop`, which enforces the Baseline profile.

    What can you say about the Pod in `shop`?
body:
  options:
    - id: a
      text: { en: "It is admitted, because Restricted includes every Baseline control" }
    - id: b
      text: { en: "It may be rejected, because Baseline checks fields that Restricted does not check" }
    - id: c
      text: { en: "It is rejected until a Baseline version label is added to namespace `shop`" }
    - id: d
      text: { en: "It is admitted only if its ServiceAccount is exempted from Baseline" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The three profiles are cumulative, from Privileged (most permissive) to Restricted (most restrictive). Restricted contains all the Baseline controls plus additional ones, so a Pod that passes Restricted always passes Baseline.
  options:
    b:
      en: |
        Baseline has no control that Restricted lacks. Restricted is defined as Baseline plus extra requirements.
    c:
      en: |
        The `enforce-version` label is optional and defaults to `latest`. Its absence never causes a rejection.
    d:
      en: |
        Pod Security Admission exemptions are configured by username, RuntimeClass or namespace, and a compliant Pod needs no exemption.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
