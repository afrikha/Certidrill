id: kcsa-3a-psa-audit-mode
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The security team of namespace `shop` wants violations of the Restricted profile to be recorded in the API server audit log, while violating Pods are still created and users see no message. Which Pod Security Admission mode should the namespace label set?
body:
  options:
    - id: a
      text: { en: "`enforce`" }
    - id: b
      text: { en: "`warn`" }
    - id: c
      text: { en: "`audit`" }
    - id: d
      text: { en: "`dryrun`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In `audit` mode, a violation adds an annotation to the event recorded in the audit log, but the request is otherwise allowed. The label is `pod-security.kubernetes.io/audit: restricted`.
  options:
    a:
      en: |
        `enforce` rejects violating Pods, which the team does not want.
    b:
      en: |
        `warn` returns a warning to the user (shown by `kubectl`) and does not annotate the audit log.
    d:
      en: |
        `dryrun` is not a Pod Security Admission mode: the only modes are `enforce`, `audit` and `warn`. A server-side dry run of a label change is a `kubectl` option, not a mode.
references:
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
