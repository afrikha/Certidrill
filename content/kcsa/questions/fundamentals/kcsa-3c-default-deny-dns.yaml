id: kcsa-3c-default-deny-dns
objective: "3.8.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After a default deny policy for ingress and egress is applied in the `payments` namespace, the Pods there fail to resolve Service names such as `ledger.payments.svc`, even for Services they are allowed to reach. What should you add?
body:
  options:
    - id: a
      text: { en: "An egress policy that allows traffic to the cluster DNS Pods on port 53, UDP and TCP" }
    - id: b
      text: { en: "An ingress policy that allows traffic from the cluster DNS Pods on port 53, UDP and TCP" }
    - id: c
      text: { en: "A restart of the cluster DNS Pods, so that they load the new NetworkPolicies" }
    - id: d
      text: { en: "An egress rule with an `ipBlock` for the Pod address range on TCP port 443" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A default deny for egress also blocks DNS queries, so name resolution fails. A separate policy must allow egress from the namespace's Pods to the cluster DNS Pods (in `kube-system`) on port 53 over UDP and TCP.
  options:
    b:
      en: |
        The DNS replies belong to connections that the Pods open, and reply traffic of an allowed connection is allowed implicitly. What is blocked is the outgoing query.
    c:
      en: |
        The DNS Pods are working; the queries never leave the `payments` Pods because their egress is denied.
    d:
      en: |
        DNS uses port 53, not 443, and an `ipBlock` is meant for addresses outside the cluster rather than Pod IPs.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
