id: kcsa-3b-anon-flag-and-file
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An administrator adds the `anonymous` section below to the authentication configuration file of the kube-apiserver, passed with `--authentication-config`. To be safe, they also keep the existing `--anonymous-auth=false` flag. What should the administrator know about this setup?

    ```yaml
    apiVersion: apiserver.config.k8s.io/v1
    kind: AuthenticationConfiguration
    anonymous:
      enabled: true
      conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
    ```
body:
  options:
    - id: a
      text: { en: "The two settings cannot be combined: anonymous access must be configured in the file only" }
    - id: b
      text: { en: "The flag takes precedence, so the health endpoints stop accepting anonymous requests" }
    - id: c
      text: { en: "The file takes precedence, and the API server silently ignores the flag" }
    - id: d
      text: { en: "Both apply: a request is anonymous only when the flag and the file both allow it" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When the `anonymous` field is set in the `AuthenticationConfiguration` file, the `--anonymous-auth` command-line option cannot be set. The file is where anonymous authentication is enabled, disabled, or restricted to endpoints such as `/livez`, `/readyz` and `/healthz`, so the flag must be removed.
  options:
    b:
      en: |
        There is no precedence rule between the two: setting both is not allowed.
    c:
      en: |
        The flag is not silently ignored; the documentation states that it cannot be set when the file configures anonymous access.
    d:
      en: |
        The settings are not combined; only one of the two mechanisms may configure anonymous access.
references:
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
