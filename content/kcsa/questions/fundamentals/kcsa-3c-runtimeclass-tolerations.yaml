id: kcsa-3c-runtimeclass-tolerations
objective: "3.6.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The nodes that run gVisor carry the taint `sandbox=gvisor:NoSchedule` and the label `sandbox: gvisor`. The `gvisor` RuntimeClass sets `scheduling.nodeSelector` to that label. Pods that use the class now stay `Pending`. You want every Pod that uses the class to reach these nodes without editing each Pod. What should you change?
body:
  options:
    - id: a
      text: { en: "Add the matching toleration to `scheduling.tolerations` in the RuntimeClass" }
    - id: b
      text: { en: "Remove `scheduling.nodeSelector` from the RuntimeClass" }
    - id: c
      text: { en: "Change the taint effect on the gVisor nodes to `NoExecute`" }
    - id: d
      text: { en: "Add the label `sandbox: gvisor` to the namespaces of the Pods" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      At admission, the tolerations listed in `scheduling.tolerations` of a RuntimeClass are merged into the Pods that use the class, taking the union with their own tolerations. Together with the merged node selector, the Pods can then be scheduled on the tainted gVisor nodes, while Pods without the class stay off them.
  options:
    b:
      en: |
        Without the node selector the Pods could go to nodes without gVisor, and they still could not tolerate the taint of the gVisor nodes.
    c:
      en: |
        `NoExecute` repels Pods even more strongly, since it also evicts running Pods that do not tolerate the taint.
    d:
      en: |
        Node selection matches node labels; namespace labels play no part in it.
references:
  - title: "Runtime Class"
    url: https://kubernetes.io/docs/concepts/containers/runtime-class/
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
