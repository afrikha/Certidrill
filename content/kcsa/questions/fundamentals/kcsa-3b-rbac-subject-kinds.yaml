id: kcsa-3b-rbac-subject-kinds
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which kinds of subjects can a RoleBinding or a ClusterRoleBinding grant a role to?
body:
  options:
    - id: a
      text: { en: "User, Group and ServiceAccount" }
    - id: b
      text: { en: "User, Group and Namespace" }
    - id: c
      text: { en: "ServiceAccount, Pod and Node" }
    - id: d
      text: { en: "User, ServiceAccount and Secret" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Bindings list subjects of kind `User`, `Group` or `ServiceAccount`. Users and groups are names that authentication returns (they are not API objects), while a ServiceAccount subject also names its namespace.
  options:
    b:
      en: |
        A namespace is not a subject. To grant rights to all ServiceAccounts of a namespace, you bind the group `system:serviceaccounts:<namespace>`.
    c:
      en: |
        Pods and Nodes are not subjects: a Pod acts through its ServiceAccount, and kubelets authenticate as users in the `system:nodes` group.
    d:
      en: |
        A Secret is a resource that rules can grant access to, not a subject that receives permissions.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
