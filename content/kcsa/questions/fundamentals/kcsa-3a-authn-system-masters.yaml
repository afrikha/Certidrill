id: kcsa-3a-authn-system-masters
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To save time, an administrator issues a contractor a client certificate with the subject `/CN=dev1/O=system:masters`, signed by the cluster CA. Why is this a serious security problem?
body:
  options:
    - id: a
      text: { en: "The API server rejects the certificate, because `O` must name an existing namespace" }
    - id: b
      text: { en: "The contractor gets only the permissions bound to the user `dev1`, which are none" }
    - id: c
      text: { en: "The `system:masters` group is reserved for kubelets, so the nodes would stop working" }
    - id: d
      text: { en: "The contractor is in a group that bypasses RBAC, and removing bindings cannot revoke it" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With client certificates, the `O` field sets the groups, so this certificate places dev1 in `system:masters`. Members of that group bypass all RBAC checks and have unrestricted superuser access, which cannot be revoked by removing RoleBindings or ClusterRoleBindings. The certificate itself stays valid until it expires, because Kubernetes does not support certificate revocation.
  options:
    a:
      en: |
        The `O` fields of a client certificate are group names, not namespaces. The certificate is accepted.
    b:
      en: |
        The `O` field adds the group `system:masters`, so the contractor's permissions are not limited to bindings for `dev1`.
    c:
      en: |
        Kubelets authenticate in the group `system:nodes` with usernames `system:node:NODENAME`. Issuing this certificate does not affect nodes.
references:
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
