id: kcsa-3a-authn-oidc-id-token
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster uses OpenID Connect authentication. After a user logs in, the identity provider returns several tokens. Which token does `kubectl` send to the API server as the bearer token?
body:
  options:
    - id: a
      text: { en: "The `access_token`" }
    - id: b
      text: { en: "The `id_token`" }
    - id: c
      text: { en: "The `refresh_token`" }
    - id: d
      text: { en: "A bootstrap token derived from the `access_token`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes uses the `id_token` from the OAuth2 response. It is a signed JSON Web Token that contains the user's claims (issuer, audience, expiry, username, optionally groups). The API server verifies its signature and expiry with the provider's published keys, without contacting the provider for each request.
  options:
    a:
      en: |
        The `access_token` is meant for calling the provider's APIs. Kubernetes does not use it for authentication.
    c:
      en: |
        The `refresh_token` is used by the client to obtain a new `id_token` from the provider. It is never sent to the API server.
    d:
      en: |
        Bootstrap tokens are a separate mechanism, used to join nodes to a cluster. They are not derived from OIDC tokens.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
