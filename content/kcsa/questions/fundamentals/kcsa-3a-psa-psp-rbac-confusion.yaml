id: kcsa-3a-psa-psp-rbac-confusion
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    One reason the Kubernetes project gave for replacing PodSecurityPolicy is that it was hard to tell which policy applied to a given Pod. What caused this confusion?
body:
  options:
    - id: a
      text: { en: "Policies were stored unencrypted in etcd, so they could be changed without anyone noticing" }
    - id: b
      text: { en: "Policies were granted through RBAC to the requesting user or the Pod's ServiceAccount" }
    - id: c
      text: { en: "Policies applied only to Pods in the `default` namespace unless they were copied" }
    - id: d
      text: { en: "Policies were evaluated by each kubelet, which could hold a different copy" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      PodSecurityPolicies were authorized through RBAC: a Pod could use any policy that its creator or its ServiceAccount was allowed to use. This made it easy to grant broader permissions than intended and hard to inspect which policy applied. Pod Security Admission replaces this with one visible level per namespace, set by labels.
  options:
    a:
      en: |
        Encryption of etcd data was not among the reasons given for deprecating PodSecurityPolicy.
    c:
      en: |
        PodSecurityPolicy was cluster-scoped and could apply to Pods in any namespace, depending on RBAC.
    d:
      en: |
        PodSecurityPolicy was enforced by an admission controller in the API server, not by kubelets.
references:
  - title: "PodSecurityPolicy Deprecation: Past, Present, and Future"
    url: https://kubernetes.io/blog/2021/04/06/podsecuritypolicy-deprecation-past-present-and-future/
