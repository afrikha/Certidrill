id: kcsa-3a-authn-oidc-many-users
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    About 200 engineers of Example Corp need direct access to the API server of a production cluster. Which authentication approach does the Kubernetes hardening guidance recommend for them?
body:
  options:
    - id: a
      text: { en: "An external identity provider integrated through OpenID Connect" }
    - id: b
      text: { en: "One client certificate per engineer, signed by the cluster CA" }
    - id: c
      text: { en: "A static token file with one bearer token per engineer" }
    - id: d
      text: { en: "One ServiceAccount token per engineer, stored in a Secret" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For production clusters with many users who access the API directly, the hardening guidance recommends an external authentication source such as OIDC, with short token lifetimes. Accounts are then managed, disabled and grouped in the identity provider rather than in the cluster.
  options:
    b:
      en: |
        Client certificates cannot be revoked individually, and their groups are fixed for the certificate's lifetime. The guidance says they are not suitable for direct user access.
    c:
      en: |
        The static token file stores credentials in clear text on control plane disks and changing it requires an API server restart. It is not recommended for production.
    d:
      en: |
        ServiceAccount Secret tokens never expire, can be read by anyone who can read Secrets in the namespace, and are meant for workloads, not people.
references:
  - title: Hardening Guide - Authentication Mechanisms
    url: https://kubernetes.io/docs/concepts/security/hardening-guide/authentication-mechanisms/
