id: kcsa-3b-authz-webhook-mode
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp wants a central policy service, running outside the cluster, to decide whether each API request is allowed. The API server must make a synchronous HTTP call to that service and wait for its answer. Which authorization mode should be configured?
body:
  options:
    - id: a
      text: { en: "ABAC" }
    - id: b
      text: { en: "Webhook" }
    - id: c
      text: { en: "RBAC" }
    - id: d
      text: { en: "AlwaysAllow" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Webhook mode makes a synchronous HTTP callout and blocks the request until the remote service responds with its decision. It lets an organization keep authorization logic in an external service, written in-house or taken from the ecosystem.
  options:
    a:
      en: |
        ABAC reads attribute-based policies from a local file on the control plane hosts; it does not call an external service.
    c:
      en: |
        RBAC decides from Role and binding objects stored in the cluster, without calling an external service.
    d:
      en: |
        AlwaysAllow approves every request and is only meant for testing; it delegates nothing.
references:
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
