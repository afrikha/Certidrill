id: kcsa-3b-secret-subpath-update
objective: "3.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After a credential rotation, the Secret `api-key` in the namespace `shop` is updated. Pod A mounts the whole Secret as a volume at `/etc/api`. Pod B mounts only the key `token` of the same Secret volume with `subPath`. Neither Pod is restarted. Which Pods eventually see the new value?
body:
  options:
    - id: a
      text: { en: "Only Pod A, because a container that uses `subPath` does not receive Secret updates" }
    - id: b
      text: { en: "Both Pods, immediately, because the API server pushes the change into every mount" }
    - id: c
      text: { en: "Only Pod B, because `subPath` mounts read the Secret again on each file access" }
    - id: d
      text: { en: "Neither Pod, because mounted Secret data never changes until the Pod is recreated" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a Secret mounted as a volume is updated, the kubelet updates the data in the volume using an eventually-consistent approach, so Pod A sees the new value after a short delay. A container that mounts a Secret with `subPath` does not receive automated updates, so Pod B keeps the old credential until it is restarted.
  options:
    b:
      en: |
        Updates are eventually consistent, not immediate, and they do not reach `subPath` mounts.
    c:
      en: |
        It is the opposite: `subPath` mounts are the ones that do not receive automated Secret updates.
    d:
      en: |
        Volume mounts of a Secret are updated by the kubelet; only `subPath` mounts keep the old data.
references:
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
