id: kcsa-3a-authn-request-attributes
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After an authenticator accepts a request, which information does it associate with the request for the authorization step?
body:
  options:
    - id: a
      text: { en: "The name of the kubeconfig context and cluster used by the client" }
    - id: b
      text: { en: "The labels of the namespace that the request targets" }
    - id: c
      text: { en: "The Roles and ClusterRoles bound to the caller" }
    - id: d
      text: { en: "A username, a UID, a list of groups and optional extra fields" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Authenticators attach a username, a UID, groups and optional extra fields to the request. These values are opaque to authentication: they matter only to the authorizer, for example RBAC, which matches them against the subjects of its bindings.
  options:
    a:
      en: |
        Contexts and cluster names exist only in the client's kubeconfig file. They are never sent to the API server.
    b:
      en: |
        Namespace labels are not part of the caller's identity. Authentication only establishes who is calling.
    c:
      en: |
        Roles are looked up by the RBAC authorizer during authorization, using the username and groups. Authentication does not attach them.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
