id: kcsa-3b-rbac-escalate-verb
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    RBAC normally prevents a user from creating or updating a Role that contains permissions they do not hold themselves. Which verb, granted on `roles` or `clusterroles`, removes that protection?
body:
  options:
    - id: a
      text: { en: "`bind`" }
    - id: b
      text: { en: "`escalate`" }
    - id: c
      text: { en: "`impersonate`" }
    - id: d
      text: { en: "`patch`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A user can only create or update a role if they already hold all of its permissions at the same scope, unless they are allowed the `escalate` verb on `roles` or `clusterroles` in the `rbac.authorization.k8s.io` group. Granting `escalate` therefore lets someone write roles more powerful than themselves.
  options:
    a:
      en: |
        `bind` lifts the equivalent check on role bindings: it lets a user bind a role whose permissions they do not hold. It does not allow writing the role itself.
    c:
      en: |
        `impersonate` lets a user act as another user, group or ServiceAccount; it is not the verb checked when roles are written.
    d:
      en: |
        `patch` is an ordinary write verb, and patching a role is still subject to the escalation check.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
