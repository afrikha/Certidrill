id: kcsa-3a-psa-dry-run-label
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before enforcing the Restricted profile on namespace `shop`, you want to see which of its existing Pods would violate it, without changing the namespace. Which command should you run?
body:
  options:
    - id: a
      text: { en: "`kubectl label --dry-run=client --overwrite ns shop pod-security.kubernetes.io/enforce=restricted`" }
    - id: b
      text: { en: "`kubectl label --dry-run=server --overwrite ns shop pod-security.kubernetes.io/enforce=restricted`" }
    - id: c
      text: { en: "`kubectl auth can-i create pods --namespace shop`" }
    - id: d
      text: { en: "`kubectl apply --validate=strict -f shop-namespace.yaml`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When an `enforce` label is added or changed, the admission plugin tests each Pod of the namespace against the new level and returns violations as warnings. With `--dry-run=server`, the API server runs these checks without saving the label, so you get the list of violating Pods with no change.
  options:
    a:
      en: |
        A client-side dry run never reaches the API server, so the Pod Security checks are not run and no violation is reported.
    c:
      en: |
        `kubectl auth can-i` checks RBAC permissions of the caller. It does not evaluate Pods against the Pod Security Standards.
    d:
      en: |
        `--validate=strict` checks the manifest against the API schema, and this command really applies it. It does not evaluate existing Pods.
references:
  - title: Enforce Pod Security Standards with Namespace Labels
    url: https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-namespace-labels/
