id: kcsa-3a-baseline-hostpath-readonly
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Namespace `monitoring` enforces the Baseline profile. A log reader Pod runs as a non-root user and mounts this volume with `readOnly: true`:

    ```yaml
      volumes:
      - name: node-logs
        hostPath:
          path: /var/log
          type: Directory
    ```

    What happens when the Pod is created?
body:
  options:
    - id: a
      text: { en: "It is admitted, because the volume is mounted read-only" }
    - id: b
      text: { en: "It is admitted, because `/var/log` is not a sensitive host path" }
    - id: c
      text: { en: "It is rejected, because Baseline forbids every hostPath volume" }
    - id: d
      text: { en: "It is admitted with a warning, because hostPath is checked only in warn mode" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Baseline control on HostPath volumes allows no `hostPath` volume at all: the field must be undefined. Neither the path nor a read-only mount changes the result, so the Pod is rejected in a namespace that enforces Baseline (or Restricted).
  options:
    a:
      en: |
        Baseline does not look at the mount mode. A read-only hostPath mount still exposes node files, and it is still forbidden.
    b:
      en: |
        The built-in controller has no list of safe host paths. Any `hostPath` volume violates Baseline.
    d:
      en: |
        The mode is chosen per namespace with labels, not per control. With `enforce: baseline`, every Baseline violation, hostPath included, rejects the Pod.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
