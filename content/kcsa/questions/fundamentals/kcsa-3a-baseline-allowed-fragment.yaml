id: kcsa-3a-baseline-allowed-fragment
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Namespace `shop` enforces the Baseline profile. Four developers each set one container-level `securityContext` in otherwise identical Pods. The rest of each Pod spec is empty apart from the image.

    Which Pod is admitted?
body:
  options:
    - id: a
      text: { en: "`securityContext: {appArmorProfile: {type: Unconfined}}`" }
    - id: b
      text: { en: "`securityContext: {runAsUser: 0, allowPrivilegeEscalation: true}`" }
    - id: c
      text: { en: "`securityContext: {procMount: Unmasked}`" }
    - id: d
      text: { en: "`securityContext: {seccompProfile: {type: Unconfined}}`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Baseline does not require a non-root user and does not restrict `allowPrivilegeEscalation`: both are Restricted controls. A container running as UID 0 with privilege escalation allowed is therefore Baseline-compliant, which is why Baseline is said to block known escalations rather than enforce hardening.
  options:
    a:
      en: |
        Baseline allows an AppArmor profile type that is unset, `RuntimeDefault` or `Localhost`. `Unconfined` disables AppArmor confinement and is rejected.
    c:
      en: |
        Baseline requires the default, masked `/proc` mount. `procMount: Unmasked` exposes parts of `/proc` that are normally hidden and is rejected.
    d:
      en: |
        Baseline allows a seccomp profile that is unset, `RuntimeDefault` or `Localhost`. An explicit `Unconfined` profile is prohibited.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
