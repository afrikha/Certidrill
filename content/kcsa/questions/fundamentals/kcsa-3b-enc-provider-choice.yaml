id: kcsa-3b-enc-provider-choice
objective: "3.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A self-managed cluster has no access to any external key management service, so the encryption key must be stored in the EncryptionConfiguration on the control plane hosts. The team has no automated key rotation process. Which provider gives strong encryption under these constraints?
body:
  options:
    - id: a
      text: { en: "`aescbc`" }
    - id: b
      text: { en: "`aesgcm`" }
    - id: c
      text: { en: "`identity`" }
    - id: d
      text: { en: "`secretbox`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `secretbox` (XSalsa20 and Poly1305) is rated strong and fast, with a 32-byte key kept in the configuration file. Without a KMS, it is the local provider that neither carries a known weakness nor requires an automated rotation scheme. Restrict the configuration file so that only the user running the kube-apiserver can read it.
  options:
    a:
      en: |
        `aescbc` is rated weak and not recommended, because CBC is vulnerable to padding oracle attacks.
    b:
      en: |
        `aesgcm` must be rotated every 200,000 writes and is not recommended unless an automated key rotation scheme is in place.
    c:
      en: |
        `identity` stores data unencrypted and provides no confidentiality.
references:
  - title: "Encrypting Confidential Data at Rest"
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
