id: kcsa-3c-audit-recon-403
objective: "3.7.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Audit events are forwarded to a SIEM, and you are writing detection rules. Which pattern in the audit log most likely shows an attacker exploring what a stolen ServiceAccount token can do?
body:
  options:
    - id: a
      text: { en: "Regular `update` requests on Lease objects in `kube-node-lease` by kubelets" }
    - id: b
      text: { en: "Frequent `watch` requests on EndpointSlices by the `system:kube-proxy` user" }
    - id: c
      text: { en: "Many requests on varied resources by one ServiceAccount, mostly answered with 403" }
    - id: d
      text: { en: "Periodic `create` requests on Events by the controllers of kube-controller-manager" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An attacker who holds a token often probes which resources it can reach. In the audit log this appears as one identity sending many requests on unrelated resources, most of them denied with HTTP 403 Forbidden by authorization. Repeated denials from a workload identity that normally makes a few predictable calls are worth an alert.
  options:
    a:
      en: |
        Kubelets update their Lease objects regularly as node heartbeats; this is normal, high-volume activity.
    b:
      en: |
        kube-proxy watches Services and EndpointSlices to program Service routing on each node; this is expected traffic.
    d:
      en: |
        Controllers record Events about the objects they manage as part of normal operation.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
