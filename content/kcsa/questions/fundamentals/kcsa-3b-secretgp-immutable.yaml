id: kcsa-3b-secretgp-immutable
objective: "3.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Secret holds the TLS settings of a payment gateway. You want to prevent any accidental or unwanted update of its data, which could cause an outage. What should you set?
body:
  options:
    - id: a
      text: { en: "`immutable: true` on the Secret" }
    - id: b
      text: { en: "`readOnly: true` on the volume mount" }
    - id: c
      text: { en: "`defaultMode: 0400` on the Secret volume" }
    - id: d
      text: { en: "A ResourceQuota on `count/secrets` in the namespace" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Secret marked `immutable: true` (stable since v1.21) cannot have its data changed, and the marking cannot be reverted: to change the content, delete and recreate the Secret. It also reduces load on the API server, because kubelets do not need to watch immutable Secrets.
  options:
    b:
      en: |
        A read-only mount stops the container from writing to the volume, but the Secret object can still be updated through the API.
    c:
      en: |
        `defaultMode` sets the permissions of the files in the volume; it does not protect the Secret object from updates.
    d:
      en: |
        A ResourceQuota limits how many Secrets the namespace can hold; it does not stop an existing Secret from being modified.
references:
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
