id: kcsa-3a-choose-cni-privileged
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CNI plugin runs as a DaemonSet whose Pods need `hostNetwork: true` and privileged containers to configure node networking. The cluster uses the built-in Pod Security Admission controller.

    How should the Pod Security Standards be applied to this workload?
body:
  options:
    - id: a
      text: { en: "Enforce Baseline in its namespace, because Baseline allows host networking" }
    - id: b
      text: { en: "Enforce Privileged in a dedicated namespace that only administrators can deploy to" }
    - id: c
      text: { en: "Enforce Restricted in its namespace and add the needed capabilities to each container" }
    - id: d
      text: { en: "Enforce Privileged on every namespace so that the DaemonSet can run anywhere" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Host networking and privileged containers are allowed only by the Privileged profile, which is intended for trusted system and infrastructure workloads such as CNI and storage agents. Because the built-in controller applies one level per namespace, the agent should run in its own namespace, with access restricted to administrators, while application namespaces keep Baseline or Restricted.
  options:
    a:
      en: |
        Baseline forbids `hostNetwork: true` and privileged containers, so the agent's Pods would be rejected.
    c:
      en: |
        Restricted is stricter than Baseline: it forbids host networking and privileged mode, and allows only `NET_BIND_SERVICE` to be added.
    d:
      en: |
        The DaemonSet places its Pods on every node, not in every namespace. Applying Privileged everywhere removes protection from all application namespaces for no benefit.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
