id: kcsa-3c-limitrange-existing-pods
objective: "3.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `batch` namespace runs a Deployment whose containers each request and limit 2 CPUs. An administrator then creates a LimitRange in `batch` with a `max` of 1 CPU per container. Later, one of the Deployment's Pods is deleted and its ReplicaSet tries to create a replacement. What happens?
body:
  options:
    - id: a
      text: { en: "The running Pods are evicted as soon as the LimitRange is created" }
    - id: b
      text: { en: "The running Pods keep running, and the replacement Pod is rejected at admission" }
    - id: c
      text: { en: "The replacement Pod is admitted with its CPU limit lowered to 1 CPU" }
    - id: d
      text: { en: "The replacement Pod is admitted because the Deployment predates the LimitRange" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      LimitRange validations occur only when a Pod is admitted, and creating or changing a LimitRange does not affect resources that already exist. The replacement is a new Pod: it is checked against the LimitRange and rejected with HTTP 403 Forbidden because it exceeds the maximum.
  options:
    a:
      en: |
        A LimitRange is not applied to running Pods, so nothing is evicted.
    c:
      en: |
        A LimitRange only fills in missing values with its defaults. It does not rewrite values that a container sets explicitly; a value above the maximum is rejected.
    d:
      en: |
        The check applies to each Pod when it is created. The age of the Deployment or ReplicaSet does not matter.
references:
  - title: "Limit Ranges"
    url: https://kubernetes.io/docs/concepts/policy/limit-range/
