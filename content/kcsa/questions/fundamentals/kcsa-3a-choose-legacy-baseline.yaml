id: kcsa-3a-choose-legacy-baseline
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Namespace `shop` hosts ordinary, non-critical applications. Several third-party images run as root and cannot be rebuilt in the coming months. None of the Pods needs host namespaces, hostPath volumes or extra capabilities.

    The team wants to block known privilege escalations now without breaking these applications. Which profile should `shop` enforce?
body:
  options:
    - id: a
      text: { en: "Baseline" }
    - id: b
      text: { en: "Restricted" }
    - id: c
      text: { en: "Privileged" }
    - id: d
      text: { en: "Restricted, with the namespace listed in the admission exemptions" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Baseline blocks known privilege escalations (host namespaces, privileged containers, hostPath volumes, extra capabilities) but accepts containers that run as root. It is the profile designed for common, non-critical workloads, and the team can audit or warn at Restricted to prepare a later move.
  options:
    b:
      en: |
        Restricted requires `runAsNonRoot: true` and a non-zero user, so the images that run as root would be rejected.
    c:
      en: |
        Privileged blocks nothing, so it does not meet the goal of stopping known privilege escalations.
    d:
      en: |
        An exempted namespace skips every Pod Security Admission check, so in practice nothing would be enforced.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
