id: kcsa-3a-psa-exempt-controller-sa
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team's Deployment in namespace `build` is rejected by Pod Security Admission. To unblock it quickly, an administrator proposes this change to the PodSecurity admission configuration:

    ```yaml
    exemptions:
      usernames: ["system:serviceaccount:kube-system:replicaset-controller"]
    ```

    What is the main risk of this change?
body:
  options:
    - id: a
      text: { en: "None: the exemption applies only to Deployments in the `kube-system` namespace" }
    - id: b
      text: { en: "Anyone who can create a Deployment or ReplicaSet could run Pods that bypass the checks" }
    - id: c
      text: { en: "The ReplicaSet controller loses its permission to create Pods in non-exempt namespaces" }
    - id: d
      text: { en: "Only Pods that users create directly with `kubectl` would bypass the checks" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Pods of a Deployment are created by the ReplicaSet controller, so its ServiceAccount is the requester that Pod Security Admission sees. Exempting it skips the checks for every Pod created from a ReplicaSet, in every namespace, which implicitly exempts every user who can create such workloads. The documentation advises against exempting controller ServiceAccounts.
  options:
    a:
      en: |
        A username exemption is not limited to a namespace. The ServiceAccount lives in `kube-system`, but it creates Pods in every namespace.
    c:
      en: |
        An exemption only skips Pod Security checks. It does not change RBAC permissions.
    d:
      en: |
        It is the opposite: Pods created directly by users are still checked, while every Pod created through a ReplicaSet is exempted.
references:
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
