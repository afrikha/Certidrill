id: kcsa-3c-audit-exec-commands
objective: "3.7.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker used a stolen token to open an interactive shell in a production Pod with `kubectl exec -it`. The incident team finds the `pods/exec` request in the API server audit log. They also need to know which programs the attacker then ran inside the container. Which source can provide this?
body:
  options:
    - id: a
      text: { en: "The audit log, after setting the `pods/exec` rule to `RequestResponse`" }
    - id: b
      text: { en: "A runtime detection tool, such as Falco, that watches system calls" }
    - id: c
      text: { en: "The Pod's events, displayed by `kubectl describe pod`" }
    - id: d
      text: { en: "The container's logs, displayed by `kubectl logs`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes auditing records calls to the Kubernetes API: who opened the exec session, on which Pod, when and with what result. What happens inside the container afterwards consists of processes and system calls on the node, which a runtime security tool such as Falco observes and alerts on, for example when shell binaries are executed.
  options:
    a:
      en: |
        A higher audit level adds the request and response bodies of API calls, but the interactive session that follows is not an API request, so the programs run in the shell are still not recorded.
    c:
      en: |
        Pod events describe lifecycle changes such as scheduling, image pulls and restarts; they do not list the programs run in an exec session.
    d:
      en: |
        Container logs hold the output of the container's main process. A shell opened with `kubectl exec` is a separate process whose activity does not go to these logs.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - title: "The Falco Project"
    url: https://falco.org/docs/
