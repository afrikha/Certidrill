id: kcsa-3a-authn-cert-no-revocation
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An engineer has left Example Corp. Her client certificate for a Kubernetes v1.37 cluster has the subject `/CN=sam/O=dev`, is signed by the cluster CA, and stays valid for another nine months.

    Which statement is correct?
body:
  options:
    - id: a
      text: { en: "Deleting the User object `sam` makes the API server reject the certificate" }
    - id: b
      text: { en: "Running `kubectl certificate deny` on her original CSR revokes the certificate" }
    - id: c
      text: { en: "It stays valid until it expires: remove its permissions or re-key the CA" }
    - id: d
      text: { en: "The API server stops accepting the certificate once the `dev` namespace is deleted" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes v1.37 does not support certificate revocation: a client certificate remains valid until it expires. You must remove what the username `sam` and the group `dev` are granted (which may affect other members of `dev`) or re-key the CA. This is why the hardening guidance discourages client certificates for people.
  options:
    a:
      en: |
        Normal users are not API objects, so there is no User object to delete.
    b:
      en: |
        Denying a CSR only matters before a certificate is issued. It has no effect on a certificate that was already signed.
    d:
      en: |
        The `O` field is a group name, not a namespace. Deleting a namespace does not affect authentication.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
  - title: Hardening Guide - Authentication Mechanisms
    url: https://kubernetes.io/docs/concepts/security/hardening-guide/authentication-mechanisms/
