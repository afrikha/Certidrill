id: kcsa-3c-audit-blocking-strict
objective: "3.7.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A regulated platform requires that no API request is served without an audit record: if the event cannot be recorded when the request is received, the request itself must fail. Which audit backend mode meets this requirement?
body:
  options:
    - id: a
      text: { en: "`batch`" }
    - id: b
      text: { en: "`blocking-strict`" }
    - id: c
      text: { en: "`blocking`" }
    - id: d
      text: { en: "`batch`, with a larger `--audit-webhook-batch-buffer-size`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In `blocking-strict` mode, the API server blocks its responses while each event is processed, like `blocking`, and in addition a failure to record the event at the `RequestReceived` stage makes the whole request fail.
  options:
    a:
      en: |
        `batch` buffers events and writes them asynchronously; a request can complete before its event is recorded, or even if it never is.
    c:
      en: |
        `blocking` waits for each event to be processed before responding, but an audit failure does not make the request fail.
    d:
      en: |
        A larger buffer reduces the risk of dropping events under load, but processing stays asynchronous and a failed write does not fail the request.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
