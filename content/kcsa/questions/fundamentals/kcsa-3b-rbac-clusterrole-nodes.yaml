id: kcsa-3b-rbac-clusterrole-nodes
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You need to define read permissions on Nodes and PersistentVolumes, which are cluster-scoped resources. Which RBAC object defines these permissions?
body:
  options:
    - id: a
      text: { en: "Role" }
    - id: b
      text: { en: "RoleBinding" }
    - id: c
      text: { en: "ClusterRoleBinding" }
    - id: d
      text: { en: "ClusterRole" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A ClusterRole is a non-namespaced set of rules. It is used for cluster-scoped resources such as Nodes and PersistentVolumes, for non-resource URLs, and for namespaced resources across all namespaces. A ClusterRoleBinding then grants it to subjects.
  options:
    a:
      en: |
        A Role always belongs to one namespace and only covers resources inside that namespace.
    b:
      en: |
        A RoleBinding grants permissions defined elsewhere, and only inside its own namespace.
    c:
      en: |
        A ClusterRoleBinding grants a ClusterRole to subjects; the rules themselves are defined in the ClusterRole.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
