id: kcsa-3b-mt-vcp-data-plane
objective: "3.6.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A platform team moved each tenant to its own virtual control plane, while all tenants keep running on the same pool of worker nodes. A security review asks whether a container escape in one tenant's Pod could affect another tenant. What is the correct assessment?
body:
  options:
    - id: a
      text: { en: "Yes: nodes are still shared, so the data plane needs isolation of its own" }
    - id: b
      text: { en: "No: each virtual control plane also gives its tenant separate kubelets and kernels" }
    - id: c
      text: { en: "No: a ResourceQuota in each tenant namespace removes node-level risks" }
    - id: d
      text: { en: "Yes, until each virtual control plane is also given its own etcd data store" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Per-tenant control planes isolate API resources, including cluster-scoped ones, but they do not solve data plane isolation problems such as node-level noisy neighbors or security threats. With shared nodes, an escape reaches the other tenants' Pods on that node; dedicated nodes per tenant (taints and tolerations) or sandboxed runtimes must be added separately.
  options:
    b:
      en: |
        Virtual control planes run on top of the shared nodes; the kubelets and kernels of those nodes remain shared.
    c:
      en: |
        Quotas limit resource consumption; they do nothing against a process that has escaped to the node.
    d:
      en: |
        A data store is part of the control plane; separating it does not separate tenants on the nodes.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
