id: kcsa-3c-allow-all-ingress
objective: "3.8.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The `legacy` namespace contains the NetworkPolicy below. What is its effect on incoming traffic to the Pods of the namespace?

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: legacy-ingress
      namespace: legacy
    spec:
      podSelector: {}
      policyTypes:
      - Ingress
      ingress:
      - {}
    ```
body:
  options:
    - id: a
      text: { en: "All incoming traffic is allowed, and no other policy can deny any of it" }
    - id: b
      text: { en: "All incoming traffic is denied until more specific policies allow it" }
    - id: c
      text: { en: "Only traffic from other Pods of the `legacy` namespace is allowed" }
    - id: d
      text: { en: "The policy selects no Pods, so it has no effect on any traffic" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The empty `podSelector` selects every Pod of the namespace, and the single empty ingress rule matches all sources and ports. Because policies are additive, no other policy can cause an incoming connection to these Pods to be denied.
  options:
    b:
      en: |
        A default deny has no `ingress` rules at all; here one empty rule allows everything.
    c:
      en: |
        Limiting sources to the namespace requires a peer such as `podSelector: {}` in a `from` list; an empty rule has no peer restriction.
    d:
      en: |
        An empty `podSelector` selects all Pods of the namespace, not none.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
