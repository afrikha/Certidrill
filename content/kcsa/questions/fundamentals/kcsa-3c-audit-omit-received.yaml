id: kcsa-3c-audit-omit-received
objective: "3.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every short API request appears twice in your audit log, once when it is received and once when it completes. To halve the volume, you want to keep only the event that also contains the outcome of the request, such as the response status. What should you add to the audit policy?
body:
  options:
    - id: a
      text: { en: "`omitStages: [RequestReceived]` at the top level of the policy" }
    - id: b
      text: { en: "`omitStages: [ResponseComplete]` at the top level of the policy" }
    - id: c
      text: { en: "A first rule with `level: None` for the `RequestReceived` stage" }
    - id: d
      text: { en: "`omitManagedFields: true` at the top level of the policy" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `omitStages` lists stages for which no event is generated, either for the whole policy or for one rule. Omitting `RequestReceived` keeps the `ResponseComplete` event, which carries the same request information plus its result; this is a common setting in audit policies.
  options:
    b:
      en: |
        Omitting `ResponseComplete` keeps only the events generated when requests are received, which do not contain the outcome.
    c:
      en: |
        Rules match requests by user, verb, resource or namespace, not by stage; stages are skipped with `omitStages`. A first `level: None` rule matching every request would stop all logging.
    d:
      en: |
        `omitManagedFields` removes the `managedFields` metadata from the request and response bodies that are logged; it does not reduce the number of events.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - title: "kube-apiserver Audit Configuration (v1)"
    url: https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/
