id: kcsa-3c-audit-request-level
objective: "3.7.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    For changes to ConfigMaps, the security team wants the audit log to contain the object that the client sent in its request. To limit the volume of the log, the bodies of the API server's responses must not be recorded. Which audit level meets these requirements?
body:
  options:
    - id: a
      text: { en: "`None`" }
    - id: b
      text: { en: "`Metadata`" }
    - id: c
      text: { en: "`Request`" }
    - id: d
      text: { en: "`RequestResponse`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `Request` records the event metadata and the request body, but not the response body. For a create, update or patch of a ConfigMap, the log contains what the client sent.
  options:
    a:
      en: |
        `None` drops the matching events entirely.
    b:
      en: |
        `Metadata` records who did what and when, but neither the request body nor the response body.
    d:
      en: |
        `RequestResponse` also records the response body, which the requirement excludes to limit log volume.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
