id: kcsa-3b-secret-stringdata
objective: "3.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Secret manifest sets the same key in both `data` and `stringData`, as shown below. After the manifest is applied, which value does the key `password` hold?

    ```yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: api-key
      namespace: shop
    type: Opaque
    data:
      password: b2xkLXZhbHVl
    stringData:
      password: new-value
    ```
body:
  options:
    - id: a
      text: { en: "`old-value`, because `data` always takes precedence over `stringData`" }
    - id: b
      text: { en: "None: the API server rejects the manifest because the key appears twice" }
    - id: c
      text: { en: "`new-value`, but only for containers that read the Secret as an environment variable" }
    - id: d
      text: { en: "`new-value`, because a key in `stringData` takes precedence over the same key in `data`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `stringData` accepts plain strings and is merged into `data` when the Secret is written. When a key appears in both fields, the `stringData` value takes precedence, so `password` holds `new-value` (`b2xkLXZhbHVl` is the base64 encoding of `old-value`). `stringData` is a writing convenience, not a protection: the value is stored like any other key.
  options:
    a:
      en: |
        The precedence is the other way round: `stringData` overrides `data` for the same key.
    b:
      en: |
        Setting the same key in both fields is allowed; the documented precedence rule resolves the conflict.
    c:
      en: |
        The stored value does not depend on how containers consume the Secret; volumes and environment variables use the same merged data.
references:
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
