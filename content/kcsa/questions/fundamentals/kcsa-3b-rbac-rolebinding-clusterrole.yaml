id: kcsa-3b-rbac-rolebinding-clusterrole
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The ClusterRole `secret-reader` allows `get`, `list` and `watch` on Secrets. The following RoleBinding is created. Where can the user `maria` read Secrets?

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: ci-secrets
      namespace: build
    subjects:
    - kind: User
      name: maria
      apiGroup: rbac.authorization.k8s.io
    roleRef:
      kind: ClusterRole
      name: secret-reader
      apiGroup: rbac.authorization.k8s.io
    ```
body:
  options:
    - id: a
      text: { en: "In every namespace, because the referenced role is a ClusterRole" }
    - id: b
      text: { en: "Only in the `build` namespace, the namespace of the RoleBinding" }
    - id: c
      text: { en: "Nowhere, because a RoleBinding cannot reference a ClusterRole" }
    - id: d
      text: { en: "In every namespace that contains a Role named `secret-reader`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A RoleBinding can reference a ClusterRole; it then grants the ClusterRole's rules only inside the RoleBinding's own namespace. This is the usual way to define a role once and reuse it in several namespaces without granting it cluster-wide.
  options:
    a:
      en: |
        The scope comes from the binding, not from the role: only a ClusterRoleBinding would grant the rules in every namespace.
    c:
      en: |
        A RoleBinding may reference either a Role of the same namespace or a ClusterRole.
    d:
      en: |
        With `kind: ClusterRole` in `roleRef`, the binding uses the ClusterRole itself; it does not look for Roles of the same name in other namespaces.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
