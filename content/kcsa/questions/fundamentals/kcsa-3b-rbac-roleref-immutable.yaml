id: kcsa-3b-rbac-roleref-immutable
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A RoleBinding named `deployers` in the namespace `shop` references the Role `deploy-full`. You must make it reference the less privileged Role `deploy-limited` and keep the same subjects. What should you do?
body:
  options:
    - id: a
      text: { en: "Run `kubectl edit rolebinding deployers -n shop` and change `roleRef.name`" }
    - id: b
      text: { en: "Create a second RoleBinding to `deploy-limited`, which replaces the older binding" }
    - id: c
      text: { en: "Delete the RoleBinding and create a new one that references `deploy-limited`" }
    - id: d
      text: { en: "Add a deny rule for the extra permissions to the Role `deploy-full`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `roleRef` of a binding cannot be changed: an update that modifies it fails with a validation error. To grant another role to the same subjects, delete the binding and create a replacement. This immutability lets administrators allow `update` on a binding to manage its subjects without allowing anyone to change the role it grants.
  options:
    a:
      en: |
        Changing `roleRef` is rejected with a validation error; only the subjects of an existing binding can be changed.
    b:
      en: |
        RBAC is additive: a second binding adds permissions and never replaces the first one, so the subjects would keep `deploy-full`.
    d:
      en: |
        RBAC has no deny rules. Permissions can only be granted, so removing access means changing or removing bindings.
references:
  - title: "Using RBAC Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
