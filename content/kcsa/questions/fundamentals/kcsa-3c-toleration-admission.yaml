id: kcsa-3c-toleration-admission
objective: "3.6.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The PCI nodes of a cluster are tainted `dedicated=pci:NoSchedule`, and only the `pci` namespace should be able to run Pods there. Developers of other namespaces can create Pods, so nothing stops them from adding the matching toleration to their own Pods. Which control can prevent this?
body:
  options:
    - id: a
      text: { en: "An RBAC Role that denies the `tolerations` field to the developers" }
    - id: b
      text: { en: "The label `pod-security.kubernetes.io/enforce: restricted` on their namespaces" }
    - id: c
      text: { en: "A NetworkPolicy that blocks traffic from their namespaces to the PCI nodes" }
    - id: d
      text: { en: "An admission policy that rejects that toleration outside the `pci` namespace" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Anyone who can write a Pod spec can add a toleration, so dedicated nodes rely on admission control to decide which Pods may carry it. A validating admission policy (a ValidatingAdmissionPolicy or a policy engine such as Kyverno or OPA Gatekeeper) can reject Pods with this toleration in any namespace other than `pci`; the Kubernetes documentation also suggests admission controllers that add tolerations and node affinity to the tenant's Pods.
  options:
    a:
      en: |
        RBAC only allows verbs on resources; it has no deny rules and cannot restrict individual fields of a Pod spec.
    b:
      en: |
        The Pod Security Standards check security settings such as privileges, host namespaces and capabilities; tolerations are not among their controls.
    c:
      en: |
        NetworkPolicy filters Pod traffic; it does not influence where the scheduler places Pods.
references:
  - title: "Taints and Tolerations"
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
