id: kcsa-3b-ns-shared-node
objective: "3.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Team A and team B use separate namespaces, each with its own RoleBindings, NetworkPolicies and Pod Security Admission labels. An attacker escapes from a container of a `team-a` Pod to its node. Which team B resources are most directly at risk?
body:
  options:
    - id: a
      text: { en: "None, because each namespace runs its Pods with a separate kernel" }
    - id: b
      text: { en: "Team B Pods running on the same node, because namespaces do not separate nodes" }
    - id: c
      text: { en: "Only team B Secrets, because the escape grants the Roles of `team-b`" }
    - id: d
      text: { en: "Only team B Services exposed with the LoadBalancer type" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Namespaces group API objects; they do not give workloads their own nodes. Pods of different namespaces run side by side and share the node's kernel and kubelet, so an escape to the node reaches every Pod scheduled there. Dedicated nodes (taints, tolerations, node affinity) or sandboxed runtimes separate workloads at that level.
  options:
    a:
      en: |
        Containers on a node share its kernel whatever their namespace.
    c:
      en: |
        Escaping to the node does not grant RBAC Roles of another namespace; the immediate exposure is what runs on that node.
    d:
      en: |
        How a Service is exposed is unrelated; the problem is co-location on the compromised node.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
