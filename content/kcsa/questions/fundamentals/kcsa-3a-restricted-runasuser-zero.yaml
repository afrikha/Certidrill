id: kcsa-3a-restricted-runasuser-zero
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Namespace `payments` enforces the Restricted profile. A Pod sets `runAsNonRoot: true` and a `RuntimeDefault` seccomp profile at Pod level. Its only container sets:

    ```yaml
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
    ```

    What happens when the Pod is created?
body:
  options:
    - id: a
      text: { en: "It is admitted, because the Pod-level `runAsNonRoot` overrides the container's user" }
    - id: b
      text: { en: "It is rejected, because Restricted does not allow `runAsUser` to be 0" }
    - id: c
      text: { en: "It is admitted, and the kubelet picks a non-root user ID automatically" }
    - id: d
      text: { en: "It is rejected, because `runAsNonRoot` must also be set on the container" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Restricted has two separate non-root controls: `runAsNonRoot` must be `true`, and `runAsUser`, when it is set at Pod or container level, must not be `0`. The container explicitly asks for UID 0, so Pod Security Admission rejects the Pod.
  options:
    a:
      en: |
        Container-level fields override Pod-level ones, not the other way round, and Restricted checks `runAsUser` on each container independently of `runAsNonRoot`.
    c:
      en: |
        The kubelet never replaces a requested user ID. In any case, admission rejects the Pod before it reaches a node.
    d:
      en: |
        Container fields may stay unset when the Pod-level `runAsNonRoot` is `true`. The violation is the explicit UID 0.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
