id: kcsa-3a-baseline-capability-add
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Namespace `shop` enforces the Baseline profile. A developer adds one Linux capability to a container with `securityContext.capabilities.add`.

    Which added capability causes the Pod to be rejected?
body:
  options:
    - id: a
      text: { en: "`CHOWN`" }
    - id: b
      text: { en: "`NET_ADMIN`" }
    - id: c
      text: { en: "`NET_BIND_SERVICE`" }
    - id: d
      text: { en: "`KILL`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Baseline lets a container add only capabilities from a fixed list that matches common runtime defaults (such as `CHOWN`, `KILL`, `NET_BIND_SERVICE`, `SETUID`). `NET_ADMIN` is not on that list: it lets a process reconfigure interfaces, routes and firewall rules, so adding it violates Baseline.
  options:
    a:
      en: |
        `CHOWN` is on the list of capabilities that Baseline allows a container to add.
    c:
      en: |
        `NET_BIND_SERVICE` is allowed by Baseline, and it is even the only capability that Restricted allows to be added back.
    d:
      en: |
        `KILL` is on the list of capabilities that Baseline allows a container to add.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
