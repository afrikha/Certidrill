id: kcsa-3c-audit-stages-count
objective: "3.7.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The API server uses the audit policy below. A client sends a single `create` request for a ConfigMap, which completes normally. Which audit events does the API server record for this request?

    ```yaml
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
    - level: Metadata
    ```
body:
  options:
    - id: a
      text: { en: "One event, at the `ResponseComplete` stage" }
    - id: b
      text: { en: "One event, at the `RequestReceived` stage" }
    - id: c
      text: { en: "Two events, at the `RequestReceived` and `ResponseComplete` stages" }
    - id: d
      text: { en: "Three events, at `RequestReceived`, `ResponseStarted` and `ResponseComplete`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The policy omits no stage, so an event is recorded at each stage the request goes through: `RequestReceived` when the audit handler receives it, and `ResponseComplete` when the response has been sent. The two events share the same `auditID`, which identifies the request.
  options:
    a:
      en: |
        Only a policy with `omitStages: ["RequestReceived"]` would leave the `ResponseComplete` event alone; this policy omits nothing.
    b:
      en: |
        `RequestReceived` is not the only stage: a completed request also produces a `ResponseComplete` event.
    d:
      en: |
        `ResponseStarted` is generated only for long-running requests such as `watch`, not for a short `create`.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - title: "kube-apiserver Audit Configuration (v1)"
    url: https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/
