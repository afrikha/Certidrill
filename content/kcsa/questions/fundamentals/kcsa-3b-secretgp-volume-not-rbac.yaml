id: kcsa-3b-secretgp-volume-not-rbac
objective: "3.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application reads its database password at startup by calling the Kubernetes API with its ServiceAccount, which is bound to a Role that allows `get` on Secrets in its namespace. The application never calls the API for anything else. Which change follows the Kubernetes Security Checklist recommendations for Secrets?
body:
  options:
    - id: a
      text: { en: "Replace `get` with `list` so that the application can find its Secret by label" }
    - id: b
      text: { en: "Keep the Role, and add encryption at rest with a KMS v2 provider" }
    - id: c
      text: { en: "Mount the Secret as a volume, remove the Role, and stop mounting the API token" }
    - id: d
      text: { en: "Copy the password into a ConfigMap that the ServiceAccount can read" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Security Checklist recommends giving Pods their secrets through volumes rather than granting the Pod's ServiceAccount RBAC access to Secrets. Because the application no longer needs the API, its ServiceAccount token should not be mounted either (`automountServiceAccountToken: false`), so a compromised Pod exposes only the mounted password, not an API token able to read Secrets.
  options:
    a:
      en: |
        `list` returns the contents of every Secret in the namespace, so it widens access instead of reducing it.
    b:
      en: |
        Encryption at rest is recommended, but it does not change what the ServiceAccount can read through the API.
    d:
      en: |
        ConfigMaps must not hold confidential data.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
