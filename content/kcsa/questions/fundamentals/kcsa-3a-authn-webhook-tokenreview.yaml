id: kcsa-3a-authn-webhook-tokenreview
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster uses webhook token authentication to validate bearer tokens issued by an in-house identity service. When a request with such a token arrives, which object does the API server send to the remote service?
body:
  options:
    - id: a
      text: { en: "A SubjectAccessReview" }
    - id: b
      text: { en: "A TokenRequest" }
    - id: c
      text: { en: "A CertificateSigningRequest" }
    - id: d
      text: { en: "A TokenReview" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With webhook token authentication, the API server POSTs a TokenReview that contains the bearer token to the remote service. The service answers whether the token is authenticated and, if it is, returns the username, UID, groups and extra fields to use for the request.
  options:
    a:
      en: |
        A SubjectAccessReview is sent by the Webhook authorization mode, to ask whether an already authenticated user may perform an action.
    b:
      en: |
        TokenRequest is the API that issues ServiceAccount tokens. It does not validate external tokens.
    c:
      en: |
        A CertificateSigningRequest asks a signer to issue a certificate. It plays no part in validating bearer tokens.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
