id: kcsa-3a-pss-baseline-goal
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the goal of the Baseline profile of the Pod Security Standards?
body:
  options:
    - id: a
      text: { en: "Enforce current Pod hardening best practices, at the cost of some compatibility" }
    - id: b
      text: { en: "Allow every Pod setting, including those that give access to the node" }
    - id: c
      text: { en: "Require every container to run as a non-root user with a seccomp profile" }
    - id: d
      text: { en: "Prevent known privilege escalations while allowing a default Pod configuration" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Baseline is the minimally restrictive profile: it blocks known privilege escalations (host namespaces, privileged containers, hostPath volumes, extra capabilities and so on) while still accepting a default, minimally specified Pod. It targets ordinary, non-critical application workloads.
  options:
    a:
      en: |
        This is the goal of the Restricted profile, which follows current hardening best practices and may break some workloads.
    b:
      en: |
        This describes the Privileged profile, which places no restriction on Pods.
    c:
      en: |
        Running as non-root and setting a seccomp profile are required by Restricted, not Baseline. Baseline accepts a Pod that runs as root with no seccomp profile set.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
