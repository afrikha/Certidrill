id: kcsa-3a-authn-x509-subject
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user authenticates to the API server with a client certificate signed by the CA set in `--client-ca-file`. The certificate subject is `/CN=jane/O=dev/O=ops`.

    Which identity does the API server use for her requests?
body:
  options:
    - id: a
      text: { en: "Username `dev`, groups `jane` and `ops`" }
    - id: b
      text: { en: "Username `jane`, with no groups until a RoleBinding names her" }
    - id: c
      text: { en: "Username `jane`, groups `dev`, `ops` and `system:authenticated`" }
    - id: d
      text: { en: "Username `ops:jane`, group `dev`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With X.509 client certificates, the common name (`CN`) of the subject is the username, and each organization (`O`) field adds a group. The API server also adds `system:authenticated` to every authenticated request, so jane is in `dev`, `ops` and `system:authenticated`.
  options:
    a:
      en: |
        The roles are reversed: `CN` gives the username and `O` gives the groups.
    b:
      en: |
        Groups come from the certificate itself, not from RBAC. RoleBindings only grant permissions to existing usernames and groups.
    d:
      en: |
        The username is the `CN` as it is. The API server does not build it from several fields.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
