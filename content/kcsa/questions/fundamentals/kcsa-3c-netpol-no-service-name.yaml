id: kcsa-3c-netpol-no-service-name
objective: "3.8.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The `app: api` Pods of the `shop` namespace are isolated for egress. They must reach the database through the Service `db` of the same namespace, on TCP port 5432. The Service selects the Pods labelled `app: postgres`. Which egress peer should you use?
body:
  options:
    - id: a
      text: { en: "A `namespaceSelector` that matches `kubernetes.io/metadata.name: db`" }
    - id: b
      text: { en: "An `ipBlock` whose `cidr` is the DNS name `db.shop.svc`" }
    - id: c
      text: { en: "A `podSelector` that matches the label `app: postgres`" }
    - id: d
      text: { en: "No `to` field, with only `port: 5432` in the rule" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The NetworkPolicy API cannot target a Service by name; policies select the Pods behind it by their labels. A `podSelector` peer on `app: postgres` allows the `api` Pods to reach the database Pods of `shop` on port 5432.
  options:
    a:
      en: |
        This selects the Pods of a namespace named `db`, not the Pods behind the Service `db`.
    b:
      en: |
        An `ipBlock` takes an IP range in CIDR notation, not a DNS name.
    d:
      en: |
        An egress rule without `to` matches every destination, so the Pods could reach any host on port 5432.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
