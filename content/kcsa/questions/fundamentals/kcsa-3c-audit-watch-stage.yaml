id: kcsa-3c-audit-watch-stage
objective: "3.7.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Auditing is enabled and no stage is omitted. A user runs `kubectl get pods --watch`, which keeps a `watch` request open on the API server. Which audit stage is generated only for long-running requests such as this one?
body:
  options:
    - id: a
      text: { en: "`RequestReceived`" }
    - id: b
      text: { en: "`ResponseComplete`" }
    - id: c
      text: { en: "`Panic`" }
    - id: d
      text: { en: "`ResponseStarted`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `ResponseStarted` is generated once the response headers are sent and before the response body; it exists only for long-running requests such as `watch`. A short request goes directly from `RequestReceived` to `ResponseComplete`.
  options:
    a:
      en: |
        `RequestReceived` is generated for every request, as soon as the audit handler receives it.
    b:
      en: |
        `ResponseComplete` is generated for every request whose response body has been fully sent.
    c:
      en: |
        `Panic` is generated only when a panic occurs while the request is handled, whatever the type of request.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
