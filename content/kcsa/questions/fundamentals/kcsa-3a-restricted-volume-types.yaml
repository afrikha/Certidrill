id: kcsa-3a-restricted-volume-types
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Namespace `payments` enforces the Restricted profile. All the Pods below are otherwise compliant and each uses a single volume.

    Which Pod is rejected because of its volume type?
body:
  options:
    - id: a
      text: { en: "A Pod that mounts an `nfs` volume from a file server" }
    - id: b
      text: { en: "A Pod that mounts a `persistentVolumeClaim` volume" }
    - id: c
      text: { en: "A Pod that mounts a `projected` volume of Secrets and ConfigMaps" }
    - id: d
      text: { en: "A Pod that mounts an `emptyDir` volume for scratch space" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Restricted allows only these volume types: `configMap`, `csi`, `downwardAPI`, `emptyDir`, `ephemeral`, `persistentVolumeClaim`, `projected` and `secret`. An inline `nfs` volume is not on the list, so the Pod is rejected, even though Baseline (which forbids only hostPath) would accept it. To use NFS storage, the Pod can go through a PersistentVolumeClaim instead.
  options:
    b:
      en: |
        `persistentVolumeClaim` is an allowed volume type in Restricted. The storage details stay in the PersistentVolume, managed by administrators.
    c:
      en: |
        `projected` is an allowed volume type in Restricted. It is also how ServiceAccount tokens are mounted.
    d:
      en: |
        `emptyDir` is an allowed volume type in Restricted.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
