id: kcsa-3b-cani-group-check
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Members of the group `shop-team` authenticate through OIDC. Without using their credentials, you want to verify whether members of that group can delete Deployments in the namespace `shop`. You may impersonate users and groups, and the user name `test-user` has no bindings of its own. Which command should you use?
body:
  options:
    - id: a
      text: { en: "`kubectl auth can-i delete deployments -n shop --as test-user --as-group shop-team`" }
    - id: b
      text: { en: "`kubectl auth can-i delete deployments -n shop --as shop-team`" }
    - id: c
      text: { en: "`kubectl auth can-i delete deployments -n shop --as system:serviceaccounts:shop-team`" }
    - id: d
      text: { en: "`kubectl auth whoami --as test-user --as-group shop-team`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `--as-group` sets the `Impersonate-Group` header, which requires a user set with `--as`. The request is then authorized as `test-user` in the group `shop-team`, so any permission granted to the group produces a `yes`.
  options:
    b:
      en: |
        `--as shop-team` impersonates a user whose name is `shop-team`; bindings to the group of that name do not apply to it.
    c:
      en: |
        `system:serviceaccounts:<namespace>` names the group of all ServiceAccounts of a namespace; it is unrelated to an OIDC group.
    d:
      en: |
        `kubectl auth whoami` only shows the impersonated user attributes; it does not check any permission.
references:
  - title: "User Impersonation"
    url: https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  - title: "kubectl auth can-i"
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_auth/kubectl_auth_can-i/
