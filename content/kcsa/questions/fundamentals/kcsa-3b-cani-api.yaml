id: kcsa-3b-cani-api
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which API does `kubectl auth can-i` use to find out whether the current user may perform an action?
body:
  options:
    - id: a
      text: { en: "SelfSubjectAccessReview" }
    - id: b
      text: { en: "TokenReview" }
    - id: c
      text: { en: "SelfSubjectReview" }
    - id: d
      text: { en: "CertificateSigningRequest" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl auth can-i` sends a `SelfSubjectAccessReview`: the API server evaluates the requested verb and resource for the caller and returns whether it is allowed. It works whatever authorization modes are configured.
  options:
    b:
      en: |
        A `TokenReview` checks whether a bearer token is valid and who it belongs to; it serves authentication, not authorization.
    c:
      en: |
        A `SelfSubjectReview` returns the caller's user attributes, as shown by `kubectl auth whoami`; it says nothing about permissions.
    d:
      en: |
        A CertificateSigningRequest asks for a certificate to be signed; it does not check permissions.
references:
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
  - title: "Authenticating"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
