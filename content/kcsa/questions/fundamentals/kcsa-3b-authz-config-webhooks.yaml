id: kcsa-3b-authz-config-webhooks
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Example Corp wants the API server to consult two external authorization webhooks, one after the other, before RBAC. If a webhook cannot be reached, the request must be denied instead of being passed to the next authorizer. Which configuration supports this?
body:
  options:
    - id: a
      text: { en: "`--authorization-mode=Webhook,Webhook,RBAC` with two `--authorization-webhook-config-file` flags" }
    - id: b
      text: { en: "Two ValidatingWebhookConfigurations whose webhooks set `failurePolicy: Fail`" }
    - id: c
      text: { en: "An `AuthorizationConfiguration` file in `--authorization-config` that lists both webhooks with `failurePolicy: Deny`" }
    - id: d
      text: { en: "`--authorization-mode=Webhook,RBAC,AlwaysDeny`, so that unhandled requests are denied at the end" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The structured authorization configuration (stable since v1.32) is passed with `--authorization-config`. Some capabilities, such as multiple webhooks, a failure policy per webhook and pre-filter rules, are only available with this file; `failurePolicy: Deny` denies the request when the webhook call fails.
  options:
    a:
      en: |
        Flag-based configuration does not support several webhooks or a webhook failure policy, and the webhook flags cannot be combined with `--authorization-config`.
    b:
      en: |
        Validating admission webhooks run during admission control, after authorization; they are not authorizers and cannot make authorization decisions.
    d:
      en: |
        Requests that no authorizer allows are already denied by default, so `AlwaysDeny` adds nothing; it neither adds a second webhook nor defines what happens when a webhook fails.
references:
  - title: "Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/
