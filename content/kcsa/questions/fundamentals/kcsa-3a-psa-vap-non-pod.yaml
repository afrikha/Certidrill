id: kcsa-3a-psa-vap-non-pod
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team wants the API server to reject every Service of type `NodePort` in all namespaces. They want a feature built into Kubernetes v1.37 and do not want to run an admission webhook.

    What should they use?
body:
  options:
    - id: a
      text: { en: "A ValidatingAdmissionPolicy with a CEL expression that matches Services" }
    - id: b
      text: { en: "The `enforce: restricted` Pod Security Admission label on every namespace" }
    - id: c
      text: { en: "Restricted as the default enforce level in the PodSecurity admission configuration" }
    - id: d
      text: { en: "The `nodePortAddresses` setting in the kube-proxy configuration" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      ValidatingAdmissionPolicy (stable since v1.30) validates requests with Common Expression Language rules evaluated inside the API server, with no webhook. A policy that matches Services and a binding with the `Deny` action can reject `type: NodePort`. Pod Security Admission cannot do this, because it only evaluates Pods and Pod templates.
  options:
    b:
      en: |
        The Pod Security Standards only cover Pod fields. A Service is never evaluated by Pod Security Admission.
    c:
      en: |
        Changing the default level still only affects Pods. It has no effect on Service objects.
    d:
      en: |
        `nodePortAddresses` limits the node IP addresses on which kube-proxy serves NodePorts. It does not reject Services at admission.
references:
  - title: Validating Admission Policy
    url: https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
