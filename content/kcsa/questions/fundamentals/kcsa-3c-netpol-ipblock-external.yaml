id: kcsa-3c-netpol-ipblock-external
objective: "3.8.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `app: billing` Pods of the `payments` namespace are already isolated for egress. They must now reach an external payment provider whose API servers use the address range 203.0.113.0/24, on TCP port 443, and no other host on that port. Which peer should the new egress rule use?
body:
  options:
    - id: a
      text: { en: "A `namespaceSelector` that matches `kubernetes.io/metadata.name: payments`" }
    - id: b
      text: { en: "A `podSelector: {}` peer, together with `port: 443`" }
    - id: c
      text: { en: "No `to` field at all, with only `port: 443` in the rule" }
    - id: d
      text: { en: "An `ipBlock` peer with `cidr: 203.0.113.0/24`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An `ipBlock` peer selects IP ranges and is meant for destinations outside the cluster, because Pod IP addresses are ephemeral. A rule with `ipBlock` `cidr: 203.0.113.0/24` and TCP port 443 allows exactly the provider's range; `except` can carve out sub-ranges if needed.
  options:
    a:
      en: |
        A `namespaceSelector` selects Pods in the matching namespaces, here the Pods of `payments`, not external servers.
    b:
      en: |
        `podSelector: {}` selects all Pods of the policy's namespace; it does not match addresses outside the cluster.
    c:
      en: |
        An egress rule without a `to` field matches every destination, so the Pods could reach any host on port 443.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
