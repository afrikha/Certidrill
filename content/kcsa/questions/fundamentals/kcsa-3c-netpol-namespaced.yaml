id: kcsa-3c-netpol-namespaced
objective: "3.8.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator created a default deny-all NetworkPolicy, with `podSelector: {}`, in the `default` namespace, expecting it to protect the whole cluster. The network plugin enforces NetworkPolicy, yet Pods in the `shop` namespace still accept connections from everywhere. What explains this?
body:
  options:
    - id: a
      text: { en: "The policy must also set `namespaceSelector: {}` to cover all namespaces" }
    - id: b
      text: { en: "A default deny applies only to namespaces created after the policy" }
    - id: c
      text: { en: "The Pods of `shop` are only isolated after they are restarted" }
    - id: d
      text: { en: "A NetworkPolicy selects Pods in its own namespace only, so each needs its own" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A NetworkPolicy is a namespaced object, and its `podSelector` selects Pods only in that namespace. The NetworkPolicy API has no default policy that applies to all namespaces, so a default deny must be created in every namespace, for example by automation or a policy engine.
  options:
    a:
      en: |
        `namespaceSelector` is only used in peers, to say which sources or destinations are allowed; it cannot extend the Pods a policy applies to.
    b:
      en: |
        No policy in `default` ever applies to another namespace, whether it was created before or after the policy.
    c:
      en: |
        Restarting the Pods changes nothing, because the policy in `default` does not select them.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
