id: kcsa-3a-baseline-hostpid
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Namespace `shop` enforces the Baseline profile with Pod Security Admission. This Pod is rejected:

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: debug
      namespace: shop
    spec:
      hostPID: true
      securityContext:
        runAsUser: 0
      containers:
      - name: tools
        image: registry.example.com/ops/tools:2.0.1
    ```

    Which setting causes the rejection?
body:
  options:
    - id: a
      text: { en: "`runAsUser: 0`" }
    - id: b
      text: { en: "The image reference uses a tag instead of a digest" }
    - id: c
      text: { en: "The container has no CPU or memory limits" }
    - id: d
      text: { en: "`hostPID: true`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Baseline forbids sharing the host namespaces: `hostNetwork`, `hostPID` and `hostIPC` must be unset or `false`. With `hostPID: true`, the container can see and signal every process of the node, which is a known privilege escalation path.
  options:
    a:
      en: |
        Baseline accepts a Pod that runs as root. Requiring a non-zero user and `runAsNonRoot: true` is part of the Restricted profile only.
    b:
      en: |
        The Pod Security Standards do not check image references. Pinning images by digest is a supply chain practice enforced, if needed, by a policy engine.
    c:
      en: |
        Resource limits are not part of any Pod Security Standards profile. They are enforced with a LimitRange or a ResourceQuota.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
