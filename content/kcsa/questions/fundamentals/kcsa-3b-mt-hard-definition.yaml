id: kcsa-3b-mt-hard-definition
objective: "3.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In Kubernetes multi-tenancy, what does the term "hard" multi-tenancy usually describe?
body:
  options:
    - id: a
      text: { en: "Teams of one organization that share a cluster to reduce costs" }
    - id: b
      text: { en: "A namespace per tenant, each protected by a ResourceQuota" }
    - id: c
      text: { en: "Tenants that do not trust each other and need strong isolation" }
    - id: d
      text: { en: "Tenants that share a control plane but never share worker nodes" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      "Hard" multi-tenancy implies strong isolation and is often used when tenants do not trust each other, for example to guard against data exfiltration or denial of service. "Soft" multi-tenancy implies weaker isolation. The documentation treats both as ends of a spectrum rather than fixed categories.
  options:
    a:
      en: |
        Teams of one organization sharing a cluster is the multi-team use case, usually handled with softer isolation.
    b:
      en: |
        A namespace with a quota is one implementation building block, not the definition of hard multi-tenancy.
    d:
      en: |
        Dedicated nodes are one data plane control, not the definition of hard multi-tenancy.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
