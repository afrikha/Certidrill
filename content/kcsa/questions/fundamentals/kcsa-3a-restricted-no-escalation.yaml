id: kcsa-3a-restricted-no-escalation
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which setting does the Restricted profile of the Pod Security Standards require on every Linux container of a Pod?
body:
  options:
    - id: a
      text: { en: "`readOnlyRootFilesystem: true`" }
    - id: b
      text: { en: "A memory limit in `resources.limits`" }
    - id: c
      text: { en: "`allowPrivilegeEscalation: false`" }
    - id: d
      text: { en: "`imagePullPolicy: Always`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Restricted requires `allowPrivilegeEscalation: false` on every container, init container and ephemeral container. This stops a process from gaining more privileges than its parent, for example through setuid binaries.
  options:
    a:
      en: |
        A read-only root filesystem is a recommended hardening practice, but it is not one of the Restricted controls.
    b:
      en: |
        Resource limits are not part of the Pod Security Standards. A LimitRange or ResourceQuota enforces them.
    d:
      en: |
        The image pull policy is not checked by the Pod Security Standards. Forcing pulls is the job of the AlwaysPullImages admission plugin.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
