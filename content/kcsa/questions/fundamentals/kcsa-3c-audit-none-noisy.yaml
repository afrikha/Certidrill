id: kcsa-3c-audit-none-noisy
objective: "3.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The audit log grows quickly because of frequent `watch` requests from the `system:kube-proxy` user, which you do not need to keep. The policy ends with a `level: Metadata` catch-all rule, and all other requests must still be recorded at that level. How should you change the policy?
body:
  options:
    - id: a
      text: { en: "Add a `level: Request` rule for these requests before the catch-all rule" }
    - id: b
      text: { en: "Add a `level: None` rule for these requests before the catch-all rule" }
    - id: c
      text: { en: "Add `omitStages: [ResponseComplete]` at the top level of the policy" }
    - id: d
      text: { en: "Lower `--audit-log-maxsize` so that the log file is rotated more often" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A rule with level `None` stops matching events from being logged. Rules are evaluated in order and the first match wins, so a rule that matches the `system:kube-proxy` user and the `watch` verb must come before the catch-all rule.
  options:
    a:
      en: |
        `Request` records more data for these events, not less, so the log would grow even faster.
    c:
      en: |
        A top-level `omitStages` applies to every request, so other requests would lose their completion events while the kube-proxy requests would still be logged at the other stages.
    d:
      en: |
        Rotation manages the size of each file on disk; it does not reduce the number of events that are recorded.
references:
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
