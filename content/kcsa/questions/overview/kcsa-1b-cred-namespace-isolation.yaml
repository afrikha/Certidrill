id: kcsa-1b-cred-namespace-isolation
objective: "1.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `orders` application and the `billing` application share the `apps` namespace. Developers of `orders` can create Pods in this namespace, and the security team wants them unable to obtain the database credentials of `billing`, stored in a Secret.

    Which change achieves this?
body:
  options:
    - id: a
      text: { en: "Mark the `billing` Secret `immutable: true`" }
    - id: b
      text: { en: "Mount the `billing` Secret as a volume instead of environment variables" }
    - id: c
      text: { en: "Enable encryption at rest for Secrets on the API server" }
    - id: d
      text: { en: "Move `billing` and its Secret to a separate namespace where `orders` developers can't create Pods" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Anyone who can create a Pod in a namespace can mount any Secret of that namespace into it and read its value, even without RBAC permission on Secrets. The Kubernetes guidance recommends separate namespaces to isolate access to mounted Secrets: a Pod can only use Secrets from its own namespace, and RBAC then limits who can create Pods in the `billing` namespace.
  options:
    a:
      en: |
        `immutable` prevents changes to the data; it doesn't prevent a Pod from mounting and reading the Secret.
    b:
      en: |
        The way `billing` consumes its Secret doesn't stop an `orders` developer's Pod from mounting the same Secret.
    c:
      en: |
        Encryption at rest protects the data in etcd. The API server still decrypts it for Pods that mount it.
references:
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
