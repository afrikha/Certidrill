id: kcsa-1b-digest-vs-signature
objective: "1.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team references all its images by sha256 digest and asks whether it still needs image signatures.

    Which statement is correct?
body:
  options:
    - id: a
      text: { en: "A digest proves the content is unchanged, not who made it; a verified signature proves origin" }
    - id: b
      text: { en: "A digest is a signature added by the registry, so a separate signature adds nothing" }
    - id: c
      text: { en: "A signature replaces the digest, so signed images should be referenced by tag only" }
    - id: d
      text: { en: "A digest proves who built the image, but not that its content hasn't changed" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A digest is the hash of the image content: it guarantees that the image pulled is exactly the one referenced, but anyone can compute the digest of a malicious image. A signature binds the digest to an identity, such as the build pipeline, and admission control verifies it at deploy time. The Kubernetes Security Checklist asks for images referenced by digest, or validated by signature at deploy time.
  options:
    b:
      en: |
        A digest is a content hash, not a signature: it says nothing about who produced the image.
    c:
      en: |
        Signatures are made over the image digest; a tag can still be moved, so referencing by digest remains useful.
    d:
      en: |
        This reverses the two properties: a digest guarantees the content, and it doesn't identify the builder.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
