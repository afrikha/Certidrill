id: kcsa-1b-digest-verify-then-pin
objective: "1.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A release engineer verifies the signature of `registry.example.com/shop/api:3.1` with `cosign verify` and the expected signer identity. The verification succeeds. The engineer then deploys a manifest that references `registry.example.com/shop/api:3.1`, and the cluster has no admission policy for images.

    Why is this weaker than deploying the verified image by its digest?
body:
  options:
    - id: a
      text: { en: "cosign verifies only images that are referenced by tag, not by digest" }
    - id: b
      text: { en: "A signature verified with cosign expires once the Pod is created" }
    - id: c
      text: { en: "The kubelet verifies the signature again and rejects tags that have a signature" }
    - id: d
      text: { en: "The tag could be moved to another image between the verification and the pull on the nodes" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A signature covers an image digest. If the manifest references the tag, the nodes resolve it again at pull time, and someone with push access could have moved it in between, so the image that runs isn't necessarily the one that was verified. Kubernetes recommends specifying a verified image by its digest; verifying at admission time closes the gap for every deployment.
  options:
    a:
      en: |
        cosign can verify an image referenced by tag or by digest; signatures are always attached to a digest.
    b:
      en: |
        A verified signature doesn't expire when a Pod is created; the risk is what the tag points to later.
    c:
      en: |
        The kubelet doesn't verify image signatures; that is the job of an admission controller.
references:
  - title: "Verify Signed Kubernetes Artifacts"
    url: https://kubernetes.io/docs/tasks/administer-cluster/verify-signed-artifacts/
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
