id: kcsa-1b-harden-runasuser-override
objective: "1.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A vendor image has no `USER` instruction, so it runs as root by default, and the team can't rebuild it. The application works as any user ID.

    How can the team make its containers run as an unprivileged user?
body:
  options:
    - id: a
      text: { en: "Set `privileged: false` in the container securityContext" }
    - id: b
      text: { en: "Set `fsGroup: 10001` in the Pod securityContext" }
    - id: c
      text: { en: "Set `allowPrivilegeEscalation: false` in the container securityContext" }
    - id: d
      text: { en: "Set `runAsUser` to a non-zero UID, with `runAsNonRoot: true`, in the securityContext" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `runAsUser` sets the user ID of the container processes and overrides the image's default user, so the image doesn't need to be rebuilt. Adding `runAsNonRoot: true` makes the kubelet refuse to start a container that would still run as UID 0, which protects against a later change of the setting.
  options:
    a:
      en: |
        `privileged: false` is already the default. It doesn't change the user, so the processes still run as root.
    b:
      en: |
        `fsGroup` adds a supplementary group and sets the group ownership of volumes; the processes still run as the image's user, root.
    c:
      en: |
        This blocks privilege gains through setuid binaries, but the processes already run as root.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Configure a Security Context for a Pod or Container"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
