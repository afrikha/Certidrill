id: kcsa-1a-node-immutable-os
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which choice of node operating system reduces the attack surface available to an attacker after a container escape?
body:
  options:
    - id: a
      text: { en: "A general-purpose distribution with a desktop and developer tools installed" }
    - id: b
      text: { en: "Any distribution, as long as every Pod sets `runAsNonRoot: true`" }
    - id: c
      text: { en: "A distribution where administrators install packages on demand over SSH" }
    - id: d
      text: { en: "A minimal, read-only operating system built for running containers" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A container-specific, read-only operating system has few packages and services and resists persistent changes. The Kubernetes documentation recommends such an immutable image for nodes to reduce the attack surface if a container escape happens.
  options:
    a:
      en: |
        Every extra package and service is code that an attacker who reaches the host can exploit or misuse.
    b:
      en: |
        `runAsNonRoot` hardens the container, not the node. Once an attacker escapes to the host, the node's own attack surface is what matters.
    c:
      en: |
        Installing packages on demand makes the node mutable and drifting, and routine SSH access is itself an attack path.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
