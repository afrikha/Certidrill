id: kcsa-1b-cred-protect-after-read
objective: "1.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `shop` API reads its database password from a Secret mounted as a volume. At startup, it writes its full configuration, password included, to its standard output, which a log collector forwards to a central log platform that many engineers can read.

    What should the team do?
body:
  options:
    - id: a
      text: { en: "Consume the Secret through an environment variable instead of a volume" }
    - id: b
      text: { en: "Change the application so that it never logs secret values, and rotate the exposed password" }
    - id: c
      text: { en: "Enable encryption at rest for Secrets on the API server" }
    - id: d
      text: { en: "Mark the Secret `immutable: true` so that its value can't be read again" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Kubernetes can deliver the Secret safely, but the application must still protect the value after reading it: it must not log it in the clear or send it to untrusted parties. The leak happens in the application, so the fix is in the application, and the password already copied into the log platform must be rotated.
  options:
    a:
      en: |
        An environment variable doesn't stop the application from logging the value, and environment variables leak more easily than files.
    c:
      en: |
        Encryption at rest protects Secrets in etcd. It has no effect on what the application writes to its logs.
    d:
      en: |
        `immutable` only prevents changes to the Secret; it doesn't stop the application from reading or logging the value.
references:
  - title: "Good practices for Kubernetes Secrets"
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
