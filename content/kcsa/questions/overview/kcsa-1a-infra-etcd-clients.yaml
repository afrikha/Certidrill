id: kcsa-1a-infra-etcd-clients
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which hosts should be allowed to connect to the etcd client port (TCP 2379) of a cluster?
body:
  options:
    - id: a
      text: { en: "Every node, because each kubelet reads its Pod specs directly from etcd" }
    - id: b
      text: { en: "Every Pod of the `kube-system` namespace, because add-ons store their data in etcd" }
    - id: c
      text: { en: "Every administrator's workstation, so that each administrator can back up etcd" }
    - id: d
      text: { en: "Only the API servers, authenticated with mutual TLS certificates" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Only the API servers talk to etcd. Write access to etcd is effectively root on the whole cluster, and read access exposes every Secret, so etcd should sit behind a firewall that admits only the API servers, with strong credentials such as mutual TLS.
  options:
    a:
      en: |
        Kubelets get their Pods from the API server, never from etcd. Opening etcd to every node turns any node compromise into a cluster compromise.
    b:
      en: |
        Add-ons store their objects through the Kubernetes API, which writes to etcd for them. No Pod needs direct etcd access.
    c:
      en: |
        Backups are taken from the control plane by a controlled process. Opening etcd to many workstations widens access to the most sensitive store of the cluster.
references:
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
  - title: "Ports and Protocols"
    url: https://kubernetes.io/docs/reference/networking/ports-and-protocols/
