id: kcsa-1a-node-patch-immutable
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A kernel vulnerability that allows a container escape is published. Example Corp's nodes run an immutable, image-based operating system.

    How should the nodes be patched?
body:
  options:
    - id: a
      text: { en: "Connect to each node and upgrade the kernel package in place" }
    - id: b
      text: { en: "Set `allowPrivilegeEscalation: false` in every Pod instead of patching" }
    - id: c
      text: { en: "Build a patched node image, then drain each node and replace it" }
    - id: d
      text: { en: "Restart the kubelet on each node so that it loads a fixed kernel" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An immutable operating system is replaced, not modified: build or obtain a node image with the fixed kernel, then drain each old node so that its Pods are evicted gracefully (respecting PodDisruptionBudgets) and replace it with a node built from the new image.
  options:
    a:
      en: |
        A read-only, image-based system isn't patched with a package manager in place, and in-place changes would make nodes drift from the image.
    b:
      en: |
        Pod settings can reduce some exploitation paths, but they don't fix the kernel that every container on the node shares. Patching stays necessary.
    d:
      en: |
        The kubelet runs on top of the kernel. Restarting it doesn't change the kernel the node booted.
references:
  - title: "Safely Drain a Node"
    url: https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
