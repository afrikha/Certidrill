id: kcsa-1b-kernel-namespaces-pid
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineer runs `ps aux` inside a container of a Pod in the `shop` namespace. The output lists only the processes of that container, not the processes of the node or of other Pods.

    Which Linux kernel feature provides this isolation?
body:
  options:
    - id: a
      text: { en: "Control groups (cgroups)" }
    - id: b
      text: { en: "seccomp" }
    - id: c
      text: { en: "AppArmor" }
    - id: d
      text: { en: "Linux namespaces, here the process ID (PID) namespace" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Linux namespaces give a process its own view of a kernel resource. With its own PID namespace, a container sees only its own processes, numbered from 1. Kubernetes can weaken this isolation: `shareProcessNamespace: true` makes the processes of all containers of a Pod visible to each other, and `hostPID: true` puts the Pod in the node's PID namespace.
  options:
    a:
      en: |
        Control groups limit and account for resources such as CPU and memory. They don't decide which processes a container can see.
    b:
      en: |
        seccomp filters system calls. It doesn't give the container its own view of the process table.
    c:
      en: |
        AppArmor confines a program's access to resources by path. It doesn't create a separate process view.
references:
  - title: "Share Process Namespace between Containers in a Pod"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/
