id: kcsa-1a-control-corrective-isolate
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Falco reports that a Pod in namespace `payments` is running a cryptocurrency miner. Which action is a corrective control?
body:
  options:
    - id: a
      text: { en: "Enable API server audit logging at the `Metadata` level for the namespace" }
    - id: b
      text: { en: "Add an admission policy that rejects images from registries outside an allowed list" }
    - id: c
      text: { en: "Isolate the Pod with a deny-all NetworkPolicy, then replace it from a known-good image" }
    - id: d
      text: { en: "Create a Prometheus alert that fires when the CPU usage of the namespace stays high" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Corrective (responsive) controls limit the damage of an incident and restore a safe state. Isolating the compromised Pod contains it while keeping it available for forensic analysis, and redeploying from a known-good image returns the workload to a trusted state. Rotating any credentials the Pod could reach would complete the response.
  options:
    a:
      en: |
        Audit logging records what happens on the API: a detective control. It doesn't contain the running miner.
    b:
      en: |
        An admission policy blocks future deployments: a preventive control. The miner already runs.
    d:
      en: |
        An alert on CPU usage detects the symptom: a detective control, and the miner has already been detected.
references:
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
