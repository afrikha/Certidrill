id: kcsa-1a-infra-port-10250
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A network scan shows that TCP port 10250 of the worker nodes is reachable from the internet. Which component listens on this port, and should be reachable only from the control plane?
body:
  options:
    - id: a
      text: { en: "kube-proxy" }
    - id: b
      text: { en: "etcd" }
    - id: c
      text: { en: "The kubelet API" }
    - id: d
      text: { en: "kube-scheduler" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      TCP 10250 is the kubelet API. It gives significant control over the node and its containers (logs, exec), so it should be reachable only from the control plane, and the Security Checklist asks that the kubelet API is never exposed publicly on the internet.
  options:
    a:
      en: |
        kube-proxy programs Service rules on the node. Its health check port is not 10250.
    b:
      en: |
        etcd listens on TCP 2379 for clients and 2380 for peers, on control plane hosts, not on worker nodes.
    d:
      en: |
        kube-scheduler runs on the control plane and listens on TCP 10259, locally to that host.
references:
  - title: "Ports and Protocols"
    url: https://kubernetes.io/docs/reference/networking/ports-and-protocols/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
