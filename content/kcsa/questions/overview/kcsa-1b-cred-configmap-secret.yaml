id: kcsa-1b-cred-configmap-secret
objective: "1.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Deployment in the `payments` namespace reads its database password from a ConfigMap named `db-config`.

    What should the team change?
body:
  options:
    - id: a
      text: { en: "Keep the ConfigMap and base64-encode the password so that it isn't stored in plain text" }
    - id: b
      text: { en: "Move the password to a Secret, limit read access to it with RBAC, and encrypt Secrets at rest" }
    - id: c
      text: { en: "Move the password into an `ENV` instruction of the image so that no Kubernetes object stores it" }
    - id: d
      text: { en: "Keep the ConfigMap and mark it `immutable: true` so that the password can't be read or changed" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A ConfigMap provides no secrecy or encryption, and the Kubernetes Security Checklist says that ConfigMaps must not hold confidential data. Secrets are the object meant for it, combined with least-privilege RBAC on Secrets and encryption at rest, because Secrets themselves are stored unencrypted in etcd by default.
  options:
    a:
      en: |
        Base64 is an encoding, not encryption: anyone who can read the ConfigMap can decode the value.
    c:
      en: |
        Environment values written into an image are readable by anyone who can pull the image, and changing the password then requires a rebuild.
    d:
      en: |
        `immutable` only prevents changes to the data. It doesn't restrict who can read the ConfigMap.
references:
  - title: "ConfigMaps"
    url: https://kubernetes.io/docs/concepts/configuration/configmap/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
