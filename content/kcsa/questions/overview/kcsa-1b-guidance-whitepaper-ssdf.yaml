id: kcsa-1b-guidance-whitepaper-ssdf
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Example Corp already follows the NIST Secure Software Development Framework (SSDF) for its traditional applications. Its security team now wants a CNCF document that maps SSDF practices and tasks onto the cloud native security lifecycle, to extend the same program to its Kubernetes workloads.

    Which document provides this mapping?
body:
  options:
    - id: a
      text: { en: "NIST SP 800-190, the Application Container Security Guide" }
    - id: b
      text: { en: "The Kubernetes Security Checklist" }
    - id: c
      text: { en: "The CIS Kubernetes Benchmark" }
    - id: d
      text: { en: "Version 2 of the CNCF Cloud Native Security Whitepaper" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Version 2 of the Cloud Native Security Whitepaper, published by CNCF TAG Security in May 2022, added a mapping of NIST SSDF v1.1 practices and tasks to a cloud native security application lifecycle, along with a Secure Defaults section and a summary of the MITRE ATT&CK matrix for containers. Its controls are organized by the lifecycle phases that the Kubernetes documentation also uses.
  options:
    a:
      en: |
        NIST SP 800-190 explains container risks and countermeasures by part of the container stack. It is not a CNCF document and doesn't map the SSDF onto a cloud native lifecycle.
    b:
      en: |
        The Kubernetes Security Checklist is a baseline list of cluster settings. It contains no SSDF mapping.
    c:
      en: |
        The CIS Kubernetes Benchmark gives configuration recommendations for cluster components. It doesn't address development practices.
references:
  - title: "Announcing the Refreshed Cloud Native Security Whitepaper"
    url: https://www.cncf.io/blog/2022/05/18/announcing-the-refreshed-cloud-native-security-whitepaper/
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
