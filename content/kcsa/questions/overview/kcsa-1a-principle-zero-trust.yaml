id: kcsa-1a-principle-zero-trust
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security architecture states that no request is trusted because of where it comes from in the network: every service authenticates its peers with mutual TLS, and every request is authorized, even inside the cluster. Which principle does it describe?
body:
  options:
    - id: a
      text: { en: "Defense in depth" }
    - id: b
      text: { en: "Zero trust" }
    - id: c
      text: { en: "Least privilege" }
    - id: d
      text: { en: "Secure defaults" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Zero trust removes implicit trust based on network location. Each workload proves its identity cryptographically, typically with mutual TLS, and each request is authorized, which limits lateral movement if one microservice is compromised.
  options:
    a:
      en: |
        Defense in depth stacks several independent layers of controls. Zero trust can be one of those layers, but the statement describes how trust is granted, not the layering.
    c:
      en: |
        Least privilege limits how much each identity may do. The statement is about verifying every request regardless of its origin.
    d:
      en: |
        Secure defaults means that the default configuration is the safe one. The statement doesn't talk about defaults.
references:
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
