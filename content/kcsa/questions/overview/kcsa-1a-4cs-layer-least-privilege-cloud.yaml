id: kcsa-1a-4cs-layer-least-privilege-cloud
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Four teams each say that they apply least privilege. Which of their controls belongs to the Cloud layer of the 4Cs model?
body:
  options:
    - id: a
      text: { en: "RoleBindings that give each ServiceAccount only the verbs it needs in its namespace" }
    - id: b
      text: { en: "A node identity that can call only the cloud provider APIs the cluster needs" }
    - id: c
      text: { en: "Container images that run their main process as an unprivileged user" }
    - id: d
      text: { en: "An application database account that can only read the tables it uses" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Cloud layer includes the cluster's access to the cloud provider API, which should be limited to the permissions the cluster needs. The node identity is defined in the provider, not in Kubernetes, and a compromised node or Pod can use whatever that identity allows.
  options:
    a:
      en: |
        RoleBindings are RBAC objects of the Kubernetes API: least privilege applied in the Cluster layer.
    c:
      en: |
        Running the image as an unprivileged user is least privilege applied in the Container layer.
    d:
      en: |
        The permissions the application uses on its own database belong to the Code layer.
references:
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
