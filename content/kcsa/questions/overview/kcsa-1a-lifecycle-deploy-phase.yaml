id: kcsa-1a-lifecycle-deploy-phase
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before a workload is admitted, the cluster verifies the cryptographic signature of its image. Only the release pipeline may create Deployments in the `payments` namespace.

    In which lifecycle phase of cloud native security do these controls apply?
body:
  options:
    - id: a
      text: { en: "Deploy" }
    - id: b
      text: { en: "Distribute" }
    - id: c
      text: { en: "Develop" }
    - id: d
      text: { en: "Runtime" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Deploy phase restricts what can be deployed, who can deploy it and where. It enforces the checks prepared in the Distribute phase, such as verifying the cryptographic identity of image artifacts before they run, and limits deployment rights per namespace.
  options:
    b:
      en: |
        Distribute is where images are built, scanned and signed and where the registry is secured. Checking the signature at admission time happens later, when the workload is deployed.
    c:
      en: |
        Develop covers the design and the code: threat modeling, code review, secure architecture.
    d:
      en: |
        Runtime protects workloads that are already running: API access, compute, storage, networking and observability. These checks happen before the Pods run.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
