id: kcsa-1a-shared-resp-managed-visibility
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An auditor asks Example Corp to show which flags its kube-apiserver runs with and how the etcd files are protected. The cluster is a managed Kubernetes service.

    What should Example Corp expect?
body:
  options:
    - id: a
      text: { en: "It can read the flags by connecting with SSH to the control plane nodes" }
    - id: b
      text: { en: "It can read the flags in the API server Pod of the `kube-system` namespace" }
    - id: c
      text: { en: "It has nothing to provide, because a managed control plane is outside any audit" }
    - id: d
      text: { en: "It relies on the provider's documentation and on the settings and logs the service exposes" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With a managed service the control plane runs in the provider's environment, so the customer can't inspect the API server flags or the etcd files directly. The evidence comes from the provider's documentation and from what the service exposes: configuration options such as endpoint access or encryption, and control plane audit logs when they are offered.
  options:
    a:
      en: |
        Customers of a managed service usually have no shell access to the control plane machines.
    b:
      en: |
        In a managed service the control plane components usually don't run as Pods that the customer can inspect. Static Pods in `kube-system` are typical of self-managed clusters built with kubeadm.
    c:
      en: |
        Shared responsibility moves operations to the provider, not out of the audit. The customer still has to show how its cluster meets its requirements.
references:
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
