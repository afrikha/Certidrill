id: kcsa-1b-guidance-app-checklist
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The developers of the `shop` team want a short checklist, published by the Kubernetes project, to review their own workloads before deployment: ServiceAccount use, Pod and container securityContext, RBAC needs, image scanning and signing, and NetworkPolicies.

    Which guidance fits this need?
body:
  options:
    - id: a
      text: { en: "The CIS Kubernetes Benchmark" }
    - id: b
      text: { en: "The MITRE ATT&CK matrix for containers" }
    - id: c
      text: { en: "The Kubernetes Application Security Checklist" }
    - id: d
      text: { en: "The SLSA specification" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Application Security Checklist on kubernetes.io is written for application developers. It covers the workload itself: a dedicated ServiceAccount without an automounted token unless needed, Pod and container securityContext settings, RBAC, image scanning and signing, NetworkPolicies, and advanced hardening such as seccomp, AppArmor, SELinux and runtime classes. The separate Security Checklist covers the cluster as a whole.
  options:
    a:
      en: |
        The CIS Kubernetes Benchmark, published by the Center for Internet Security, audits the configuration of cluster components such as the API server, etcd and kubelets, not the workloads a team deploys.
    b:
      en: |
        MITRE ATT&CK catalogs attacker tactics and techniques. It helps model threats; it isn't a deployment checklist for developers.
    d:
      en: |
        SLSA defines levels and provenance requirements for software supply chain integrity. It doesn't cover securityContext, RBAC or NetworkPolicies.
references:
  - title: "Application Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/application-security-checklist/
