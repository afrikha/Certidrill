id: kcsa-1a-lifecycle-runtime-infrastructure
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which control applies in the Runtime phase of the cloud native security lifecycle and protects the infrastructure that the cluster runs on, the Cloud layer of the 4Cs model?
body:
  options:
    - id: a
      text: { en: "Signing container images in the build pipeline" }
    - id: b
      text: { en: "Running static analysis on every pull request" }
    - id: c
      text: { en: "Running the nodes on a read-only, immutable operating system" }
    - id: d
      text: { en: "Checking image signatures with an admission policy" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Runtime phase includes the protection of compute, and the Kubernetes page recommends a read-only operating system image for the nodes to reduce the attack surface after a container escape. The node operating system is part of the infrastructure under the cluster, so this control combines the Runtime phase with the Cloud layer.
  options:
    a:
      en: |
        Signing images is a Distribute-phase control of the Container layer: it happens before anything is deployed.
    b:
      en: |
        Static analysis of pull requests is a Develop-phase control of the Code layer.
    d:
      en: |
        Verifying signatures at admission is a Deploy-phase control, configured in the Cluster layer.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
