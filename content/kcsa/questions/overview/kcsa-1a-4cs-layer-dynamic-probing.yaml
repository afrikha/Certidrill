id: kcsa-1a-4cs-layer-dynamic-probing
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The developers of the `payments` service expose only the ports it needs, scan its third-party libraries for known vulnerabilities, and probe the running service for SQL injection and cross-site scripting with OWASP ZAP.

    In which layer of the 4Cs model are these controls?
body:
  options:
    - id: a
      text: { en: "Code" }
    - id: b
      text: { en: "Container" }
    - id: c
      text: { en: "Cluster" }
    - id: d
      text: { en: "Cloud" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Code layer guidance lists limiting exposed ports, scanning third-party dependencies, static code analysis and dynamic probing of the running service for attacks such as SQL injection, cross-site request forgery and cross-site scripting. These controls protect the application that the team writes.
  options:
    b:
      en: |
        The Container layer covers the image, its build-time vulnerability scan, signing, privileges and runtime isolation. Probing the application's behavior for injection flaws tests the code itself.
    c:
      en: |
        The Cluster layer covers Kubernetes components and workload configuration (RBAC, NetworkPolicy, Pod Security Standards), not the application's handling of input.
    d:
      en: |
        The Cloud layer covers the infrastructure under the cluster. None of these controls is configured there.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
