id: kcsa-1a-4cs-compromised-cloud
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp runs a self-managed cluster on cloud virtual machines. The cluster uses RBAC, Pod Security Admission and NetworkPolicy. An attacker steals credentials of the cloud account that can manage the virtual machines and their disks.

    According to the 4Cs model, what is the consequence?
body:
  options:
    - id: a
      text: { en: "The cluster controls still protect the workloads, because the API server enforces RBAC independently of the infrastructure" }
    - id: b
      text: { en: "The cluster controls can be bypassed, because every inner layer relies on the security of the Cloud layer around it" }
    - id: c
      text: { en: "Only the Code layer is exposed, because the attacker reaches the application before reaching the cluster" }
    - id: d
      text: { en: "Only the worker nodes are exposed, because NetworkPolicy keeps the attacker away from the control plane" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each layer of the 4Cs model builds on the layer around it, and weaknesses in the base layers can't be fixed by securing the inner ones. With control of the virtual machines and their disks, the attacker can read the etcd data (including Secrets) or change the nodes without ever sending a request to the API server. Write access to etcd alone is effectively root access to the cluster.
  options:
    a:
      en: |
        RBAC is evaluated only for requests that go through the API server. Reading a disk or taking over a virtual machine through the cloud account never reaches the API server.
    c:
      en: |
        The attacker controls the outermost layer, not the innermost one. From there every inner layer, including the cluster, is exposed.
    d:
      en: |
        NetworkPolicy filters Pod traffic inside the cluster network. It has no effect on what a cloud account can do to the control plane machines and their disks.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
