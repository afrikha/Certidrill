id: kcsa-1a-imds-risk
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Pods of a cluster that runs on cloud virtual machines can send HTTP requests to the instance metadata service at `169.254.169.254`. Why is this a security risk?
body:
  options:
    - id: a
      text: { en: "The service lets Pods change the firewall rules of their node" }
    - id: b
      text: { en: "The service can return the node's cloud credentials or kubelet provisioning data" }
    - id: c
      text: { en: "The service returns the Secrets of every namespace without authentication" }
    - id: d
      text: { en: "The service accepts writes that replace the operating system image of the node" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cloud platforms expose a metadata service to each instance, and by default Pods running on the instance can reach it. It can return the cloud credentials of the node or provisioning data such as kubelet credentials, which an attacker can use to escalate inside the cluster or to other cloud services of the same account.
  options:
    a:
      en: |
        The metadata service is a read-only source of information about the instance. The danger is what it reveals, not a configuration interface for firewalls.
    c:
      en: |
        Kubernetes Secrets are served by the API server and stored in etcd. The metadata service knows nothing about them, although the credentials it returns can lead an attacker toward them.
    d:
      en: |
        The metadata service doesn't change the instance. Its risk is the disclosure of credentials and provisioning data.
references:
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
