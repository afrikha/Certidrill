id: kcsa-1b-registry-node-credentials
objective: "1.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To avoid creating pull Secrets, an administrator configures the credentials of the private registry in the container runtime configuration of every node.

    What is the security drawback of this approach?
body:
  options:
    - id: a
      text: { en: "The credentials expire every time the kubelet restarts" }
    - id: b
      text: { en: "Only static Pods can use credentials configured on the node" }
    - id: c
      text: { en: "Images pulled this way bypass Pod Security Admission" }
    - id: d
      text: { en: "Every Pod on these nodes can pull from the private registry, with no per-namespace control" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Credentials configured on the node apply to all Pods that run there: every Pod can use any private registry configured on the node, so access can't be limited to the namespaces or workloads that need it. Setting them up also requires node-level administration on every node. With `imagePullSecrets`, which Kubernetes recommends, only Pods that supply the credentials can pull.
  options:
    a:
      en: |
        Node-level credentials stay in the runtime configuration across kubelet restarts; their problem is scope, not lifetime.
    b:
      en: |
        Node-level credentials apply to all Pods on the node, not only static Pods.
    c:
      en: |
        Pod Security Admission checks the Pod specification at admission, whatever credentials are used to pull the image.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
