id: kcsa-1b-isolation-userns-capabilities
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Pod sets `hostUsers: false`, and its container adds the `SYS_ADMIN` capability. The security team compares it with the same Pod without a user namespace.

    What does the user namespace change for this capability?
body:
  options:
    - id: a
      text: { en: "The capability is valid only inside the Pod's user namespace, not on the host" }
    - id: b
      text: { en: "Nothing: capabilities granted to a container are always valid on the host" }
    - id: c
      text: { en: "The capability is removed at admission, because user namespaces forbid added capabilities" }
    - id: d
      text: { en: "The capability becomes valid on the host only for files owned by the container's UID" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With a user namespace, capabilities granted to a Pod are limited to that user namespace and mostly invalid outside it: `CAP_SYS_ADMIN` applies only inside the Pod's user namespace, and some capabilities, such as `CAP_SYS_MODULE`, have no effect at all. Without a user namespace, a capability granted to a container is also valid on the host, which is why user namespaces mitigate many container breakout vulnerabilities.
  options:
    b:
      en: |
        That is the situation without a user namespace. With `hostUsers: false`, the capabilities are scoped to the Pod's user namespace.
    c:
      en: |
        User namespaces don't forbid adding capabilities; they limit where the capabilities are effective.
    d:
      en: |
        File ownership doesn't extend a capability to the host. Capabilities of a user-namespace Pod are limited to its own namespace.
references:
  - title: "User Namespaces"
    url: https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/
