id: kcsa-1b-dev-sast-limits
objective: "1.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `payments` team adds a static application security testing (SAST) tool to its pull request checks. A manager concludes that the team no longer needs other security testing.

    Which statement about SAST supports a different conclusion?
body:
  options:
    - id: a
      text: { en: "SAST can only run against a deployed application, so it finds problems too late" }
    - id: b
      text: { en: "SAST finds only vulnerabilities in third-party libraries, not in the team's own code" }
    - id: c
      text: { en: "SAST detects only part of the flaws, gives false positives and can't see configuration issues" }
    - id: d
      text: { en: "SAST requires the application's container image to be signed before it can analyze it" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SAST tools analyze source or compiled code without running it, so they can run in the editor and in every pull request and point to the exact line. However, they detect only a relatively small part of security flaws, produce many false positives, struggle with issues such as authentication and access control, and can't see configuration problems that aren't represented in the code. They complement DAST, dependency analysis and code review; they don't replace them.
  options:
    a:
      en: |
        That describes DAST. SAST analyzes the code itself, without running the application, and can run before merge.
    b:
      en: |
        That describes software composition analysis. SAST examines the code the team writes.
    d:
      en: |
        SAST reads source or compiled code. Image signing plays no role in it.
references:
  - title: "Source Code Analysis Tools | OWASP Foundation"
    url: https://owasp.org/www-community/Source_Code_Analysis_Tools
