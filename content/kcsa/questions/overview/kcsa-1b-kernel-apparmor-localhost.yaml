id: kcsa-1b-kernel-apparmor-localhost
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod in the `payments` namespace sets this container security context:

    ```yaml
    securityContext:
      appArmorProfile:
        type: Localhost
        localhostProfile: payments-api-restricted
    ```

    The `payments-api-restricted` profile was loaded on only two of the ten worker nodes. What must the administrators do so that the Pod runs reliably with this profile?
body:
  options:
    - id: a
      text: { en: "Load the profile on every node where the Pod can be scheduled, or restrict the Pod to labeled nodes that have it" }
    - id: b
      text: { en: "Nothing: the scheduler places the Pod only on nodes where the profile is loaded" }
    - id: c
      text: { en: "Store the profile in a ConfigMap of the namespace, so that the kubelet can load it on any node" }
    - id: d
      text: { en: "Change the type to `Unconfined`, because `Localhost` profiles are only read at node startup" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A `Localhost` AppArmor profile must already be loaded on the node that runs the Pod. Kubernetes has no built-in mechanism to load AppArmor profiles onto nodes, and the scheduler doesn't know which profiles each node has. Load the profile on all the nodes, for example with custom tooling or the Security Profiles Operator, or label the nodes that have it and use a node selector.
  options:
    b:
      en: |
        The scheduler isn't aware of the AppArmor profiles loaded on each node, so it can place the Pod on a node without the profile.
    c:
      en: |
        The kubelet doesn't load AppArmor profiles from ConfigMaps; profiles are loaded into the kernel of each node outside Kubernetes.
    d:
      en: |
        `Unconfined` removes the AppArmor protection entirely, which defeats the purpose of the profile.
references:
  - title: "Restrict a Container's Access to Resources with AppArmor"
    url: https://kubernetes.io/docs/tutorials/security/apparmor/
