id: kcsa-1a-control-preventive-rbac
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which of these controls is preventive?
body:
  options:
    - id: a
      text: { en: "API server audit logs recorded at the `Metadata` level" }
    - id: b
      text: { en: "RBAC permissions that allow a team only `get` and `list` on Deployments" }
    - id: c
      text: { en: "A kube-bench report that lists the failed CIS Benchmark checks" }
    - id: d
      text: { en: "The rotation of the certificates whose private keys have leaked" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A preventive control stops an unwanted action before it happens. RBAC denies every request that no rule allows, so the team can't update or delete Deployments at all.
  options:
    a:
      en: |
        Audit logs record who did what and when. They help find an incident, which makes them detective.
    c:
      en: |
        A kube-bench report finds configuration weaknesses but doesn't fix or block anything: a detective control.
    d:
      en: |
        Rotating leaked certificates limits the damage after an incident: a corrective control.
references:
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
  - title: "Auditing"
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
