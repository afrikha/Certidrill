id: kcsa-1b-scan-rebuild-remediation
objective: "1.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A scheduled scan reports that the base image of the running `shop/api` Deployment contains an operating system package with a critical vulnerability. A patched version of the base image is now available.

    How should the team remediate?
body:
  options:
    - id: a
      text: { en: "Run the package manager with `kubectl exec` in each running container to upgrade the package" }
    - id: b
      text: { en: "Add the vulnerability to the scanner's ignore list, because the image already passed the build scan" }
    - id: c
      text: { en: "Rebuild the image on the patched base image, scan it, and roll out the new image" }
    - id: d
      text: { en: "Restart the Pods so that the kubelet pulls a patched copy of the same image digest" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Container images are immutable snapshots: the fix is to rebuild the image on the updated base, check it with the scanner, and redeploy it through the normal pipeline. Rebuilding regularly with updated dependencies keeps images current. Changes made inside running containers are lost when they restart and leave the image itself vulnerable.
  options:
    a:
      en: |
        Patching inside running containers changes nothing in the image: new or restarted containers come back vulnerable, and production images shouldn't contain a package manager anyway.
    b:
      en: |
        A build-time result doesn't cover vulnerabilities published later. Ignoring a critical, fixable finding leaves the workload exposed.
    d:
      en: |
        A digest identifies fixed content. Pulling the same digest again returns the same vulnerable image.
references:
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
