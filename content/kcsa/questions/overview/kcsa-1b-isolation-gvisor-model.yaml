id: kcsa-1b-isolation-gvisor-model
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team reads that a sandboxed runtime selected through a RuntimeClass runs an application kernel, written in Go, as a user-space process: the workload's system calls are handled by this kernel instead of going directly to the host kernel. Its OCI runtime is called `runsc`.

    Which project is described?
body:
  options:
    - id: a
      text: { en: "Kata Containers" }
    - id: b
      text: { en: "gVisor" }
    - id: c
      text: { en: "runc" }
    - id: d
      text: { en: "containerd" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      gVisor is an application kernel that runs in user space and implements a Linux-like interface, so the application talks to gVisor rather than directly to the host kernel, which limits the host kernel surface it can reach. Its OCI runtime, `runsc`, is configured as a handler in the CRI runtime and selected with a RuntimeClass. It aims at much of the isolation of a virtual machine with a lower footprint.
  options:
    a:
      en: |
        Kata Containers runs each sandbox in a lightweight virtual machine with its own guest kernel, using hardware virtualization; it isn't a user-space kernel.
    c:
      en: |
        runc is the standard low-level OCI runtime: it starts containers directly on the shared host kernel, without a sandbox.
    d:
      en: |
        containerd is a high-level container runtime that implements the CRI and calls an OCI runtime; it doesn't intercept system calls.
references:
  - title: "GitHub - google/gvisor: Application Kernel for Containers"
    url: https://github.com/google/gvisor
  - title: "Application Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/application-security-checklist/
