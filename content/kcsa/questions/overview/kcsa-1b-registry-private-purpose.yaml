id: kcsa-1b-registry-private-purpose
objective: "1.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp's internal application images are currently in a public repository, readable by anyone. The security team asks to move them to a private registry.

    What is the main security benefit?
body:
  options:
    - id: a
      text: { en: "Images in a private registry are encrypted inside running containers" }
    - id: b
      text: { en: "Images in a private registry no longer need vulnerability scanning" }
    - id: c
      text: { en: "Only authorized clients can pull the images, which may contain proprietary code and configuration" }
    - id: d
      text: { en: "Images in a private registry can't be referenced by tag" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes' cloud native security guidance recommends placing container images in a private registry that only allows authorized clients to pull them. Internal images contain the company's code, libraries and sometimes configuration that attackers can study for weaknesses; authentication and authorization on pull and push limit who can read and publish them.
  options:
    a:
      en: |
        A registry controls access to the stored images. It doesn't encrypt the files inside running containers.
    b:
      en: |
        Private images still contain packages with vulnerabilities, so they still need scanning.
    d:
      en: |
        Tags work the same way in private registries; pinning by digest is a separate decision.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
