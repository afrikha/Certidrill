id: kcsa-1b-image-build-secret-mount
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Dockerfile step needs a token to download packages from a private repository during the build. The token must not end up in any layer of the image, nor in its configuration.

    How should the build provide the token?
body:
  options:
    - id: a
      text: { en: "Pass it with a build argument (`ARG`) and use it in the `RUN` instruction" }
    - id: b
      text: { en: "Set it with an `ENV` instruction before the `RUN` instruction" }
    - id: c
      text: { en: "Copy it into the image with `COPY`, use it, and delete it in the next `RUN` instruction" }
    - id: d
      text: { en: "Pass it with `--secret` and expose it to the step with `RUN --mount=type=secret`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A build secret mount exposes the secret to a single build instruction, by default as a file under `/run/secrets/`, and it isn't persisted in the image. The value is passed to the builder with the `--secret` option and made available only to the `RUN` instruction that mounts it.
  options:
    a:
      en: |
        Build arguments persist in the final image, so the token can be read by anyone who can pull it.
    b:
      en: |
        Environment variables set with `ENV` are stored in the image configuration, which anyone who can pull the image can read.
    c:
      en: |
        The layer created by `COPY` keeps the file even if a later instruction deletes it.
references:
  - title: "docs/content/manuals/build/building/secrets.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/secrets.md
