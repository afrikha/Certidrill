id: kcsa-1b-dev-dast
objective: "1.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before each release, the `shop` team wants an automated tool to probe the running staging deployment of its web application from the outside, looking for flaws such as SQL injection and cross-site scripting.

    Which practice is this?
body:
  options:
    - id: a
      text: { en: "Dynamic application security testing (DAST)" }
    - id: b
      text: { en: "Static application security testing (SAST)" }
    - id: c
      text: { en: "Software composition analysis (SCA)" }
    - id: d
      text: { en: "Secret scanning of the repository" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Dynamic application security testing tools scan a running web application, normally from the outside, by sending crafted requests and observing the responses. OWASP ZAP is a well-known example. Probing a deployed staging environment for injection and cross-site scripting is the typical DAST use case.
  options:
    b:
      en: |
        SAST analyzes source code or compiled code without running the application.
    c:
      en: |
        Software composition analysis inventories third-party components and matches them against known vulnerabilities and licenses; it doesn't probe the running application.
    d:
      en: |
        Secret scanning looks for credentials committed to the repository, not for injection flaws in the running application.
references:
  - title: "Vulnerability Scanning Tools | OWASP Foundation"
    url: https://owasp.org/www-community/Vulnerability_Scanning_Tools
