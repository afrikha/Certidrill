id: kcsa-1a-principle-psa-defaults
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Teams create their own namespaces and often forget the Pod Security labels, so their namespaces accept privileged Pods. The platform team wants every namespace without labels to reject privileged Pods, without relying on each team.

    What should the platform team configure?
body:
  options:
    - id: a
      text: { en: "A Falco rule that alerts when a privileged container starts" }
    - id: b
      text: { en: "A ClusterRole that forbids `securityContext.privileged: true` in Pods" }
    - id: c
      text: { en: "The label `pod-security.kubernetes.io/warn: baseline` on the `default` namespace" }
    - id: d
      text: { en: "The `defaults` of the PodSecurity admission configuration, with `enforce: baseline`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The PodSecurity admission configuration, passed to the API server with `--admission-control-config-file`, sets the level applied when a namespace has no mode label. Its built-in default is `privileged`, which is why unlabeled namespaces accept privileged Pods. Setting `enforce: baseline` makes the safe behavior the default, and teams must make an explicit choice to weaken it.
  options:
    a:
      en: |
        Falco detects privileged containers once they run, but it doesn't reject them: the default stays open.
    b:
      en: |
        RBAC authorizes verbs on resources. It can't inspect field values such as `privileged` inside a Pod spec.
    c:
      en: |
        This label affects only the `default` namespace and only produces warnings; the Pods are still admitted.
references:
  - title: "Enforce Pod Security Standards by Configuring the Built-in Admission Controller"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-admission-controller/
  - title: "Pod Security Admission"
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
