id: kcsa-1b-digest-pinning-tradeoff
objective: "1.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `shop` team pins the base image of every Dockerfile by digest, for example:

    ```text
    FROM registry.example.com/base/python:3.13@sha256:3ff9333139be0fa831bc1f07bd8b884d029e13039539830d58f8099954e38da7
    ```

    What new responsibility does this create for the team?
body:
  options:
    - id: a
      text: { en: "Signing the base image again after each build of the application" }
    - id: b
      text: { en: "Updating the pinned digest on purpose, since base image fixes no longer arrive automatically" }
    - id: c
      text: { en: "Adding the base image's digest to the imagePullSecrets of each namespace" }
    - id: d
      text: { en: "Rebuilding the image without the build cache on every pipeline run" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A pinned digest always resolves to the same base image, even if the publisher moves the tag. This protects the supply chain, but the build no longer picks up a patched base image automatically: the team must update the digest on purpose, typically through automated, reviewed pull requests, and rebuild.
  options:
    a:
      en: |
        Pinning doesn't require re-signing the base image; the team signs its own images, whatever their base.
    c:
      en: |
        Pull Secrets contain registry credentials, not image digests.
    d:
      en: |
        Disabling the build cache doesn't help: the pinned digest keeps selecting the same base image.
references:
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
