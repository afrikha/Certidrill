id: kcsa-1a-4cs-cluster-layer-scope
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the 4Cs model, the Cluster layer covers two areas of concern. Which ones?
body:
  options:
    - id: a
      text: { en: "The physical datacenter and the hypervisor that run the nodes" }
    - id: b
      text: { en: "The container images and the container runtime on each node" }
    - id: c
      text: { en: "The application source code and its third-party libraries" }
    - id: d
      text: { en: "The configurable cluster components and the applications running in the cluster" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Cluster layer secures the configurable components of Kubernetes (API server, etcd, kubelet and the others) and the configuration of the workloads that run in the cluster: RBAC, authentication, Secrets, Pod Security Standards, resource management, NetworkPolicy and TLS for Ingress.
  options:
    a:
      en: |
        The datacenter and the hypervisor are the infrastructure of the Cloud layer, the outermost layer of the model.
    b:
      en: |
        Images and the runtime belong to the Container layer, which sits inside the Cluster layer.
    c:
      en: |
        The application and its dependencies form the Code layer, the innermost layer of the model.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
