id: kcsa-1b-kernel-selinux-labels
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team must confine its containers with a Linux security module that assigns labels to processes and files and enforces a policy between those labels, identifying resources by inode rather than by file path.

    Which Pod or container setting configures this module?
body:
  options:
    - id: a
      text: { en: "`securityContext.seLinuxOptions`" }
    - id: b
      text: { en: "`securityContext.appArmorProfile`" }
    - id: c
      text: { en: "`securityContext.seccompProfile`" }
    - id: d
      text: { en: "`securityContext.capabilities`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SELinux uses policies that apply to labels, and it identifies a resource by its inode. Kubernetes sets the SELinux label of the containers with `securityContext.seLinuxOptions` (usually only the `level` field), and the SELinux module must be enabled on the node for the setting to have an effect.
  options:
    b:
      en: |
        AppArmor is the other Linux security module that Kubernetes supports, but it uses profiles that define access by file path, not labels.
    c:
      en: |
        seccomp filters system calls. It doesn't label processes or files.
    d:
      en: |
        Capabilities add or drop units of root privilege. They don't implement a label-based access control policy.
references:
  - title: "Linux kernel security constraints for Pods and containers"
    url: https://kubernetes.io/docs/concepts/security/linux-kernel-security-constraints/
  - title: "Configure a Security Context for a Pod or Container"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
