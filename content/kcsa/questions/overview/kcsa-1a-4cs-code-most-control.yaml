id: kcsa-1a-4cs-code-most-control
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the 4Cs model, which layer is the attack surface over which the application team has the most control?
body:
  options:
    - id: a
      text: { en: "Cloud" }
    - id: b
      text: { en: "Cluster" }
    - id: c
      text: { en: "Code" }
    - id: d
      text: { en: "Container" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Code is the innermost layer: the application, its dependencies and the way it communicates. The application team writes it, so it controls this attack surface most directly, with TLS for traffic in transit, a minimal set of exposed ports, dependency scanning and static and dynamic analysis.
  options:
    a:
      en: |
        The Cloud layer is the infrastructure, operated by the cloud provider and the infrastructure team. The application team usually has the least control over it.
    b:
      en: |
        The Cluster layer is configured by the platform or cluster operators: components, RBAC, admission, NetworkPolicy.
    d:
      en: |
        The Container layer covers images, the runtime and isolation from the node, often shared with the platform team. The application's own logic is in the Code layer.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
