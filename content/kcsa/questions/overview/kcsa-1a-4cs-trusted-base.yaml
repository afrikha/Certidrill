id: kcsa-1a-4cs-trusted-base
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the 4Cs model of cloud native security, which layer is the trusted computing base for all the other layers?
body:
  options:
    - id: a
      text: { en: "Code" }
    - id: b
      text: { en: "Container" }
    - id: c
      text: { en: "Cluster" }
    - id: d
      text: { en: "Cloud" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The 4Cs model draws Cloud, Cluster, Container and Code as nested layers, with Cloud (a cloud provider, co-located servers or a corporate datacenter) outermost. Each layer builds on the layer around it, so the infrastructure is the trusted computing base: if it is compromised or misconfigured, no control in the inner layers can be guaranteed.
  options:
    a:
      en: |
        Code is the innermost layer. It depends on all the other layers and is the attack surface that developers control most directly, not the base of the model.
    b:
      en: |
        The Container layer sits inside the Cluster and Cloud layers. Container isolation relies on the node and the infrastructure beneath it.
    c:
      en: |
        The cluster components run on the infrastructure of the Cloud layer. Someone who controls that infrastructure can bypass them.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
