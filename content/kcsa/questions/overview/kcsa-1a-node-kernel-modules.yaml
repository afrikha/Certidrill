id: kcsa-1a-node-kernel-modules
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hardening guide asks to block the `dccp` and `sctp` kernel modules on the nodes, although no workload uses these protocols. What is the reason?
body:
  options:
    - id: a
      text: { en: "These modules are needed only by control plane components, which worker nodes don't run" }
    - id: b
      text: { en: "An unprivileged process can make the kernel load them by opening a socket, exposing their flaws" }
    - id: c
      text: { en: "These modules let containers bypass NetworkPolicy, because network plugins can't filter them" }
    - id: d
      text: { en: "These modules can be loaded only by privileged containers, which the guide wants to detect" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Even unprivileged processes can cause some network protocol modules to be loaded just by creating a socket of the right type. An attacker in a container could then exploit a vulnerability in a module the administrator assumed was unused. Blocking modules that no workload needs, through modprobe rules or by uninstalling them, removes that kernel code from reach.
  options:
    a:
      en: |
        Control plane components don't need these protocols either. The concern is the kernel attack surface of every node.
    c:
      en: |
        The guidance is about vulnerabilities in kernel code, not about bypassing NetworkPolicy.
    d:
      en: |
        The point of the guidance is the opposite: unprivileged processes can trigger the loading, which is why the modules are blocked outright.
references:
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
