id: kcsa-1b-image-minimal-base
objective: "1.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team proposes switching its production images from a full Linux distribution base image to a distroless image that contains no shell and no package manager. Engineers worry about troubleshooting.

    What is the security benefit, and how is troubleshooting usually handled?
body:
  options:
    - id: a
      text: { en: "Distroless images are signed by the registry; troubleshooting installs a shell at runtime with `kubectl exec`" }
    - id: b
      text: { en: "Distroless images can't be scanned, so they report no vulnerabilities; troubleshooting uses SSH to the node" }
    - id: c
      text: { en: "Fewer packages mean fewer vulnerabilities and attacker tools; troubleshooting uses an ephemeral debug container" }
    - id: d
      text: { en: "Distroless images force a read-only root filesystem; troubleshooting uses a privileged sidecar container" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An image that contains only what the program needs has fewer packages that can be vulnerable and gives an attacker no shell or utilities to work with. The Kubernetes Security Checklist asks for the smallest possible base and no shells or debugging utilities in production images, and recommends an ephemeral debug container when troubleshooting is needed.
  options:
    a:
      en: |
        A base image isn't signed by the registry just because it is distroless, and without a shell or package manager there is nothing to install one with through `kubectl exec`.
    b:
      en: |
        Distroless images can be scanned like any other image. Their benefit is that they contain fewer packages, not that scanners ignore them.
    d:
      en: |
        A read-only root filesystem is set in the Pod's securityContext, not by the base image, and a privileged sidecar would weaken the Pod's security.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
