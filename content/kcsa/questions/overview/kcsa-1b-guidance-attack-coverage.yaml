id: kcsa-1b-guidance-attack-coverage
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp's security operations team runs Falco rules and alerts on Kubernetes audit logs. It wants to check whether these detections cover the techniques that attackers are known to use against containers and Kubernetes, such as deploying a container or escaping to the host.

    Which guidance provides the catalog of techniques to compare against?
body:
  options:
    - id: a
      text: { en: "The CIS Kubernetes Benchmark" }
    - id: b
      text: { en: "The MITRE ATT&CK matrix for containers" }
    - id: c
      text: { en: "The Kubernetes Security Checklist" }
    - id: d
      text: { en: "The SLSA specification" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The MITRE ATT&CK Containers matrix lists adversary tactics and techniques known to target containers and orchestration systems such as Kubernetes, for example Deploy Container, Container Administration Command, Implant Internal Image and Escape to Host. Mapping each detection rule to these techniques shows which ones are covered and where detective controls are missing.
  options:
    a:
      en: |
        The CIS Kubernetes Benchmark lists secure configuration settings for cluster components. It doesn't describe attacker techniques.
    c:
      en: |
        The Kubernetes Security Checklist is a baseline of cluster settings to apply. It isn't a catalog of attacker techniques.
    d:
      en: |
        SLSA covers the integrity of the software supply chain (build levels and provenance), not attacker techniques at runtime.
references:
  - title: "Matrix - Enterprise - Containers | MITRE ATT&CK®"
    url: https://attack.mitre.org/matrices/enterprise/containers/
