id: kcsa-1b-guidance-checklist-baseline
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team plans to implement the Kubernetes Security Checklist from the first item to the last, and then declare the cluster secure.

    Which statement about this plan is correct?
body:
  options:
    - id: a
      text: { en: "The checklist is a non-exhaustive baseline whose order isn't a priority; the cluster's own risks decide the rest" }
    - id: b
      text: { en: "The checklist is ordered by priority, so the first items must be completed before the later ones are started" }
    - id: c
      text: { en: "Completing every item of the checklist certifies the cluster as compliant with the CIS Kubernetes Benchmark" }
    - id: d
      text: { en: "The checklist only applies to managed Kubernetes services, so a self-managed cluster needs the CIS benchmark instead" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Kubernetes Security Checklist states that it is a baseline for cluster security, that it isn't exhaustive, and that the order of its items doesn't indicate priority. Guidance is a starting point: the team chooses and orders controls from its own risks, for example from a threat model, documents exceptions, and checks again over time because configurations drift.
  options:
    b:
      en: |
        The checklist explicitly says that its order is not a priority order.
    c:
      en: |
        The checklist and the CIS Kubernetes Benchmark are different documents, and following a checklist isn't a certification of any kind.
    d:
      en: |
        The checklist targets Kubernetes clusters in general, whoever operates the control plane.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
