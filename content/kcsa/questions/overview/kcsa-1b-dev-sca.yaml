id: kcsa-1b-dev-sca
objective: "1.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team must identify known vulnerabilities and license issues in the open source libraries its application depends on, including the libraries those libraries depend on.

    Which practice addresses this?
body:
  options:
    - id: a
      text: { en: "Dynamic application security testing (DAST) of the deployed application" }
    - id: b
      text: { en: "Static application security testing (SAST) of the team's own source code" }
    - id: c
      text: { en: "Software composition analysis (SCA) of the application's dependencies" }
    - id: d
      text: { en: "Fuzzing the application's input parsers" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Software composition analysis identifies the third-party and open source components of an application, including transitive dependencies, and reports their known vulnerabilities and licenses. It relies on an accurate inventory of components, which dependency manifests and SBOMs provide, and should run on every build because new vulnerabilities are published continuously.
  options:
    a:
      en: |
        DAST probes the running application from the outside. It doesn't list the libraries the application uses or their licenses.
    b:
      en: |
        SAST looks for unsafe patterns in the code the team wrote. It doesn't inventory third-party components or report license issues.
    d:
      en: |
        Fuzzing sends malformed inputs to find crashes and unknown flaws. It doesn't report known vulnerabilities or licenses of dependencies.
references:
  - title: "Component Analysis | OWASP Foundation"
    url: https://owasp.org/www-community/Component_Analysis
