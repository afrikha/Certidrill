id: kcsa-1a-control-psa-labels-types
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The namespace `payments` has these labels:

    ```yaml
    apiVersion: v1
    kind: Namespace
    metadata:
      name: payments
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    ```

    Which statement classifies these controls correctly?
body:
  options:
    - id: a
      text: { en: "All three labels are preventive, because each one rejects the Pods that violate its level" }
    - id: b
      text: { en: "`enforce` is detective for Baseline; `audit` and `warn` are preventive for Restricted" }
    - id: c
      text: { en: "All three labels are detective, because Pod Security Admission only records violations" }
    - id: d
      text: { en: "`enforce` is preventive for Baseline; `audit` and `warn` are detective for Restricted" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In `enforce` mode, a Pod that violates the level is rejected: a preventive control. In `audit` mode a violation adds an annotation to the audit event, and in `warn` mode it returns a warning to the user, but the Pod is allowed: both only report, so they are detective controls.
  options:
    a:
      en: |
        Only `enforce` rejects Pods. `audit` and `warn` let violating Pods through.
    b:
      en: |
        This inverts the modes: `enforce` is the one that blocks, `audit` and `warn` only report.
    c:
      en: |
        Pod Security Admission does block Pods in `enforce` mode. Only `audit` and `warn` just record or display violations.
references:
  - title: "Pod Security Admission"
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
