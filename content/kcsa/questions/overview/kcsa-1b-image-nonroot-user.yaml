id: kcsa-1b-image-nonroot-user
objective: "1.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Many teams build on an internal base image and don't set `runAsUser` in their Pods. The security team wants containers built from this image to run as an unprivileged user by default.

    What should the image maintainers do?
body:
  options:
    - id: a
      text: { en: "Add an `EXPOSE` instruction for a port above 1024" }
    - id: b
      text: { en: "Add a `USER` instruction with a non-root numeric UID and GID" }
    - id: c
      text: { en: "Write the `ENTRYPOINT` instruction in exec form instead of shell form" }
    - id: d
      text: { en: "Add a `LABEL` instruction that sets `runAsNonRoot=true`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `USER` instruction sets the default user of every container started from the image, so containers run unprivileged even when the Pod doesn't set `runAsUser`. The Kubernetes Security Checklist asks for images that run as an unprivileged user, set with `USER` in the Dockerfile or with `runAsUser` and `runAsGroup` in the security context, and Docker recommends an explicit UID and GID.
  options:
    a:
      en: |
        `EXPOSE` only documents a port. The process still runs as the image's default user, which is root when no `USER` is set.
    c:
      en: |
        The exec form avoids a shell wrapper and helps with signal handling, but the process still runs as the image's default user.
    d:
      en: |
        Labels are metadata. Kubernetes doesn't read security settings from image labels.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
