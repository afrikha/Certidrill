id: kcsa-1b-kernel-cgroups-limits
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container in the `shop` namespace declares the following resources:

    ```yaml
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
    ```

    Which Linux kernel feature do the kubelet and the container runtime use to enforce these limits?
body:
  options:
    - id: a
      text: { en: "Linux namespaces" }
    - id: b
      text: { en: "Control groups (cgroups)" }
    - id: c
      text: { en: "seccomp" }
    - id: d
      text: { en: "SELinux" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      On Linux, control groups constrain the resources allocated to processes. The kubelet and the container runtime interface with cgroups to enforce CPU and memory requests and limits: CPU use above the limit is throttled, and a container that uses more memory than its limit can be OOM-killed.
  options:
    a:
      en: |
        Linux namespaces give a process its own view of a resource (process IDs, network stack, mounts, users). They isolate what a process sees, not how much it consumes.
    c:
      en: |
        seccomp filters system calls. It doesn't measure or cap CPU and memory use.
    d:
      en: |
        SELinux labels processes and files and enforces an access policy between labels. It doesn't limit resource consumption.
references:
  - title: "About cgroup v2"
    url: https://kubernetes.io/docs/concepts/architecture/cgroups/
  - title: "Resource Management for Pods and Containers"
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
