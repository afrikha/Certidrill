id: kcsa-1b-image-multistage
objective: "1.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The production image of a Go service contains the Go compiler, a package manager and the source code, although the service only needs its compiled binary to run.

    Which Dockerfile technique removes these build tools from the final image?
body:
  options:
    - id: a
      text: { en: "Add a `USER` instruction so that the service runs as a non-root user" }
    - id: b
      text: { en: "Build with the `--no-cache` option so that intermediate layers are discarded" }
    - id: c
      text: { en: "Pin the base image to a specific tag such as `golang:1.25`" }
    - id: d
      text: { en: "Use a multi-stage build that compiles in one stage and copies only the binary into a minimal final stage" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A multi-stage build splits the Dockerfile into stages: the compiler, the package manager and the source stay in the build stage, and the final stage receives only the artifact copied with `COPY --from`. The final image is smaller and contains fewer packages for vulnerabilities and fewer tools for an attacker.
  options:
    a:
      en: |
        A non-root user is good practice, but the compiler, package manager and source code remain in the image.
    b:
      en: |
        `--no-cache` only stops the builder from reusing cached results. The final image contents are the same.
    c:
      en: |
        Pinning controls which base image version is used. A Go build image still contains the full toolchain.
references:
  - title: "docs/content/manuals/build/building/best-practices.md at main · docker/docs · GitHub"
    url: https://github.com/docker/docs/blob/main/content/manuals/build/building/best-practices.md
