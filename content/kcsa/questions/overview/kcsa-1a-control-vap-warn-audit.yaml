id: kcsa-1a-control-vap-warn-audit
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A ValidatingAdmissionPolicy named `require-non-root` checks that every Pod sets `runAsNonRoot: true`. Its binding is:

    ```yaml
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    metadata:
      name: require-non-root-binding
    spec:
      policyName: require-non-root
      validationActions: [Warn, Audit]
    ```

    Which type of control does this binding make the policy?
body:
  options:
    - id: a
      text: { en: "Preventive, because a Pod that fails validation is denied" }
    - id: b
      text: { en: "Detective, because failing Pods are admitted and the failure is reported" }
    - id: c
      text: { en: "Corrective, because failing Pods are changed to run as non-root" }
    - id: d
      text: { en: "Preventive, because the warning stops the client from sending the request" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `Warn`, a validation failure is returned to the client as a warning; with `Audit`, it is added to the audit event of the request. Neither action denies the request, so violating Pods are created and the policy only reports them, like a detective control. Adding `Deny` (instead of `Warn`) would make it preventive.
  options:
    a:
      en: |
        Requests are denied only when `validationActions` contains `Deny`, which this binding doesn't.
    c:
      en: |
        A ValidatingAdmissionPolicy never changes objects. Mutation is done by mutating admission (for example a MutatingAdmissionPolicy or a webhook).
    d:
      en: |
        The warning is sent in the response, after the request was accepted. It informs the user but doesn't stop anything.
references:
  - title: "Validating Admission Policy"
    url: https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
