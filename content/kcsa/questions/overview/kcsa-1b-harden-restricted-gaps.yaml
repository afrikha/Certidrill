id: kcsa-1b-harden-restricted-gaps
objective: "1.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `payments` namespace enforces the Restricted Pod Security Standard, and all its Pods are admitted. A reviewer checks which recommended hardening settings could still be missing from these Pods.

    Which setting does the Restricted profile not require?
body:
  options:
    - id: a
      text: { en: "`readOnlyRootFilesystem: true`" }
    - id: b
      text: { en: "`allowPrivilegeEscalation: false`" }
    - id: c
      text: { en: "`capabilities.drop` including `ALL`" }
    - id: d
      text: { en: "A `RuntimeDefault` or `Localhost` seccomp profile" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      No Pod Security Standards profile requires a read-only root filesystem, although the Application Security Checklist recommends it. A Pod admitted under Restricted can therefore still have a writable root filesystem, and missing resource limits are not checked either. Add these with policies of your own, such as a ValidatingAdmissionPolicy or a policy engine.
  options:
    b:
      en: |
        Restricted requires `allowPrivilegeEscalation: false` on every Linux container.
    c:
      en: |
        Restricted requires dropping `ALL` capabilities; only `NET_BIND_SERVICE` may be added back.
    d:
      en: |
        Restricted requires the seccomp profile to be explicitly set to `RuntimeDefault` or `Localhost`.
references:
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: "Application Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/application-security-checklist/
