id: kcsa-1b-isolation-shared-kernel
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company plans to run code uploaded by its customers in a Kubernetes cluster. A reviewer argues that standard containers, even with seccomp and dropped capabilities, offer a weaker isolation boundary than virtual machines.

    What is the main reason for this?
body:
  options:
    - id: a
      text: { en: "Containers on a node share the host kernel, so a kernel flaw can lead to an escape to the node" }
    - id: b
      text: { en: "Standard containers can't be given CPU and memory limits, so one customer's code can starve the others" }
    - id: c
      text: { en: "Standard containers always run as root on the node, because the `USER` instruction of an image is ignored" }
    - id: d
      text: { en: "Standard containers can't be selected by NetworkPolicy, so their traffic can't be restricted" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Containers use operating system virtualization: every container on a node runs on the same kernel, so an exploitable kernel flaw is a path to the node. Virtual machines use hardware virtualization and give each workload its own kernel. For untrusted code, the Kubernetes multi-tenancy guidance recommends sandboxing, with virtual machines or user-space kernels, selected through a RuntimeClass.
  options:
    b:
      en: |
        Standard containers do get CPU and memory limits, enforced with cgroups. Resource limits don't change the shared-kernel boundary.
    c:
      en: |
        Kubernetes and the runtime honor the image's `USER` instruction and the Pod's `runAsUser`, so containers can run as non-root users.
    d:
      en: |
        NetworkPolicy selects Pods running in standard containers, provided the network plugin enforces policies.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
