id: kcsa-1b-scan-running-images
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Example Corp scans images in its build pipeline and in its own registry. Several teams also run third-party images pulled directly from public registries, and some old workloads use images that were deleted from the company registry long ago.

    Which addition finds newly published vulnerabilities in everything that actually runs in the clusters?
body:
  options:
    - id: a
      text: { en: "Running kube-bench on every node with the policies target" }
    - id: b
      text: { en: "Signing every image in the company registry with cosign" }
    - id: c
      text: { en: "Enabling the AlwaysPullImages admission plugin" }
    - id: d
      text: { en: "Scheduled scans of the images running in each cluster, for example with Trivy" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Pipeline and registry scans only see the images that pass through them. Scanning what is actually running, for example with Trivy, which can target a Kubernetes cluster, also covers images pulled from other registries or no longer stored internally, and a scheduled run picks up vulnerabilities published after deployment.
  options:
    a:
      en: |
        kube-bench checks configuration against the CIS benchmark. It doesn't scan images for vulnerabilities.
    b:
      en: |
        Signing proves the origin of images built internally. It doesn't find vulnerabilities, and third-party images wouldn't carry the company's signature.
    c:
      en: |
        AlwaysPullImages forces image pulls so that credentials are checked. It doesn't scan anything.
references:
  - title: "GitHub - aquasecurity/trivy: Find vulnerabilities, misconfigurations, secrets, SBOM in containers, Kubernetes, code repositories, clouds and more"
    url: https://github.com/aquasecurity/trivy
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
