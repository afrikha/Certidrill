id: kcsa-1a-lifecycle-phases-structure
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The current Kubernetes documentation page "Cloud Native Security and Kubernetes" follows the CNCF Cloud Native Security Whitepaper. How does it organize security controls?
body:
  options:
    - id: a
      text: { en: "By the STRIDE threat categories, from spoofing to elevation of privilege" }
    - id: b
      text: { en: "By the Pod Security Standards levels Privileged, Baseline and Restricted" }
    - id: c
      text: { en: "By the lifecycle phases Develop, Distribute, Deploy and Runtime" }
    - id: d
      text: { en: "By the four layers Cloud, Cluster, Container and Code" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The page and the whitepaper describe a lifecycle of four continuous phases: Develop, Distribute, Deploy and Runtime, with the controls that apply in each. The 4Cs model says where a control lives; the lifecycle phases say when it applies.
  options:
    a:
      en: |
        STRIDE is a threat modeling framework used to enumerate threats. It doesn't structure the Kubernetes page.
    b:
      en: |
        The Pod Security Standards are one control among many (in the Runtime phase), not the structure of the page.
    d:
      en: |
        The 4Cs layered model was used by an older Kubernetes page. The current page no longer draws it and uses the lifecycle phases instead.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
