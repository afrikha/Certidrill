id: kcsa-1b-scan-ci-gate
objective: "1.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp wants to stop images with critical vulnerabilities that have a fix available from ever being pushed to its registry.

    Where should the vulnerability scan run?
body:
  options:
    - id: a
      text: { en: "In the build pipeline, failing the build when the scanner finds critical vulnerabilities with a fix" }
    - id: b
      text: { en: "In Falco, raising an alert when a container from a vulnerable image starts" }
    - id: c
      text: { en: "In kube-bench, as part of the CIS Kubernetes Benchmark checks of each node" }
    - id: d
      text: { en: "In the API server audit log, by recording the image of each Pod created" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Scanning while the image is built, before it is pushed, lets the pipeline reject the image: the scanner (for example Trivy) compares the image's packages with known vulnerabilities, and a pipeline rule fails the build above an agreed severity. The Kubernetes Security Checklist asks for images to be scanned during creation and deployment, usually in CI/CD.
  options:
    b:
      en: |
        Falco detects suspicious behavior at runtime. It doesn't scan images, and it acts long after the image was pushed.
    c:
      en: |
        kube-bench checks cluster configuration against the CIS benchmark. It doesn't scan images, and it doesn't run in the build pipeline.
    d:
      en: |
        Audit logs record API requests after the fact. They neither scan images nor stop a push to the registry.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "GitHub - aquasecurity/trivy: Find vulnerabilities, misconfigurations, secrets, SBOM in containers, Kubernetes, code repositories, clouds and more"
    url: https://github.com/aquasecurity/trivy
