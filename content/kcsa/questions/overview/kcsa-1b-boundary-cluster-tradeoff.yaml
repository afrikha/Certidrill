id: kcsa-1b-boundary-cluster-tradeoff
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security architect recommends a separate Kubernetes cluster for each customer of a SaaS platform instead of one shared cluster with a namespace per customer.

    What is the main drawback of this model?
body:
  options:
    - id: a
      text: { en: "Separate clusters can't enforce Pod Security Standards" }
    - id: b
      text: { en: "Customers can still reach each other's API objects through a shared etcd" }
    - id: c
      text: { en: "The cost and complexity of operating many clusters" }
    - id: d
      text: { en: "NetworkPolicies no longer work between the Pods of one customer" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A cluster per tenant gives the strongest isolation: nothing is shared, not the control plane, the cluster-scoped resources or the nodes. Its drawback is the cost and the operational complexity of running many clusters, which the Kubernetes multi-tenancy guidance asks you to weigh against the benefit of isolation.
  options:
    a:
      en: |
        Each cluster has its own API server with Pod Security Admission, so Pod Security Standards work as usual.
    b:
      en: |
        Separate clusters have separate etcd instances; nothing is shared between customers.
    d:
      en: |
        NetworkPolicies work inside each cluster as they do in a shared cluster, given a network plugin that enforces them.
references:
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
