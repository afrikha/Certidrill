id: kcsa-1a-4cs-layer-network-access
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security review recommends that etcd be reachable only from the control plane, and that worker nodes accept connections only from the control plane and for NodePort and LoadBalancer Services.

    In which layer of the 4Cs model are these controls?
body:
  options:
    - id: a
      text: { en: "Cluster" }
    - id: b
      text: { en: "Cloud" }
    - id: c
      text: { en: "Container" }
    - id: d
      text: { en: "Code" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Network access to the API server, the nodes and etcd is infrastructure security, listed under the Cloud layer of the 4Cs model. These rules are set in the network around the cluster (firewalls, private networks, access lists), not in Kubernetes objects.
  options:
    a:
      en: |
        Cluster-layer controls are configured in Kubernetes itself: RBAC, Pod Security Standards, NetworkPolicy between Pods, Secrets. Filtering who can reach the machines is done in the infrastructure.
    c:
      en: |
        The Container layer covers images, the runtime and container privileges, not network access to the nodes.
    d:
      en: |
        The Code layer covers the application: TLS, exposed ports of the service, dependencies, code analysis.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
