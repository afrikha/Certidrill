id: kcsa-1a-imds-limit-instance-creds
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The network plugin of a cluster doesn't enforce NetworkPolicy, and it can't be replaced this year. Pods can reach the instance metadata service.

    Which measure still reduces the impact if a Pod is compromised?
body:
  options:
    - id: a
      text: { en: "Create an RBAC Role that denies access to `169.254.169.254`" }
    - id: b
      text: { en: "Limit the permissions of the instance credentials to what the nodes need" }
    - id: c
      text: { en: "Create a default deny NetworkPolicy in every namespace" }
    - id: d
      text: { en: "Label every namespace with `pod-security.kubernetes.io/warn: restricted`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      If Pods can read the node's credentials from the metadata service, the damage depends on what those credentials allow. Limiting the permissions given to instance credentials is one of the mitigations the Kubernetes documentation lists, and it works whatever the network plugin can do.
  options:
    a:
      en: |
        RBAC only grants permissions on the Kubernetes API, it has no deny rules, and the metadata service is not a Kubernetes resource.
    c:
      en: |
        A NetworkPolicy without a network plugin that implements it has no effect.
    d:
      en: |
        The `warn` mode only returns warnings at admission, and Pod Security Standards don't control the egress traffic of Pods.
references:
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
