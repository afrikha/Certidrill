id: kcsa-1a-shared-resp-move-on-prem
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Example Corp moves its workloads from a managed Kubernetes service to a cluster that it installs on its own servers in its own datacenter.

    Which responsibility moves from the provider to Example Corp?
body:
  options:
    - id: a
      text: { en: "Patching and backing up the control plane, and the physical security of the servers" }
    - id: b
      text: { en: "Limiting RBAC bindings to the permissions that each user needs" }
    - id: c
      text: { en: "Scanning container images and setting the securityContext of each Pod" }
    - id: d
      text: { en: "Writing NetworkPolicy objects that isolate the namespaces from each other" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With the managed service, the provider operated the datacenter, the hardware and the control plane. On its own servers, Example Corp now owns all of it: physical security, the hypervisor or operating system, and the hardening, patching and backups of the API server and etcd.
  options:
    b:
      en: |
        RBAC bindings were already Example Corp's responsibility with the managed service. Configuration of the cluster never belongs to the provider.
    c:
      en: |
        Images and Pod settings are workloads: they were already Example Corp's responsibility before the move.
    d:
      en: |
        NetworkPolicy objects are cluster configuration written by the customer in every model, so nothing changes here.
references:
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
