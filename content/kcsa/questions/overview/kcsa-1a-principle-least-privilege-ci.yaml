id: kcsa-1a-principle-least-privilege-ci
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI pipeline uses the ServiceAccount `deployer` to update the image of the Deployments in namespace `shop`, and nothing else. Which grant follows least privilege?
body:
  options:
    - id: a
      text: { en: "A ClusterRoleBinding of `deployer` to the built-in ClusterRole `edit`" }
    - id: b
      text: { en: "A RoleBinding in `shop` of `deployer` to the ClusterRole `cluster-admin`" }
    - id: c
      text: { en: "A Role in `shop` with `get` and `patch` on `deployments`, bound to `deployer`" }
    - id: d
      text: { en: "A Role in `shop` with all verbs (`*`) on all resources (`*`), bound to `deployer`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A namespaced Role bound with a RoleBinding gives rights in `shop` only, and listing the exact verbs and resource avoids wildcards. Reading and patching Deployments is what an image update needs.
  options:
    a:
      en: |
        A ClusterRoleBinding applies in every namespace, and `edit` allows changes to most namespaced resources, far beyond updating Deployments in `shop`.
    b:
      en: |
        The RoleBinding limits `cluster-admin` to `shop`, but it still gives full control of every resource in the namespace, including its Secrets.
    d:
      en: |
        Wildcards grant every verb on every resource type of the namespace, including types created in the future.
references:
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
