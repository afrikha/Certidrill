id: kcsa-1a-4cs-layer-rbac-netpol
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team configures RBAC authorization, enforces a Pod Security Standard in every namespace, and creates NetworkPolicy objects that restrict traffic between Pods.

    In which layer of the 4Cs model are these controls?
body:
  options:
    - id: a
      text: { en: "Cloud" }
    - id: b
      text: { en: "Container" }
    - id: c
      text: { en: "Code" }
    - id: d
      text: { en: "Cluster" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      RBAC, Pod Security Standards and NetworkPolicy are Kubernetes features configured through the API. They secure access to the cluster and the configuration of the workloads running in it, which is the Cluster layer of the 4Cs model.
  options:
    a:
      en: |
        Cloud-layer controls live in the infrastructure around the cluster: firewalls, private networks, cloud identities. These controls are Kubernetes objects.
    b:
      en: |
        Container-layer controls are about images and the runtime: scanning, signing, unprivileged users, runtime classes.
    c:
      en: |
        Code-layer controls are part of the application: TLS, exposed ports, dependencies and code analysis.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
