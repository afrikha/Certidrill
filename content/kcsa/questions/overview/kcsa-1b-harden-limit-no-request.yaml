id: kcsa-1b-harden-limit-no-request
objective: "1.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container in the `shop` namespace declares only a memory limit. No LimitRange or other admission mechanism sets defaults in the namespace.

    ```yaml
    resources:
      limits:
        memory: 512Mi
    ```

    Which memory request does Kubernetes use for this container?
body:
  options:
    - id: a
      text: { en: "None: the container has no request, so the scheduler ignores its memory" }
    - id: b
      text: { en: "Half of the limit, 256Mi" }
    - id: c
      text: { en: "The default request of the node's kubelet configuration" }
    - id: d
      text: { en: "512Mi: the limit is copied as the request" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      If a container specifies a limit but no request for a resource, and no admission mechanism sets a default request, Kubernetes copies the limit and uses it as the request. The scheduler then reserves 512Mi for the container, and the kernel can OOM-kill it if it uses more than its limit, which protects the other workloads of the node.
  options:
    a:
      en: |
        The request isn't left empty when a limit is set; Kubernetes copies the limit.
    b:
      en: |
        Kubernetes doesn't compute a fraction of the limit; it copies the limit as is.
    c:
      en: |
        The kubelet doesn't define default requests for containers; defaults come from a LimitRange or another admission mechanism.
references:
  - title: "Resource Management for Pods and Containers"
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
