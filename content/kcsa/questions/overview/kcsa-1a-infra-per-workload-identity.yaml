id: kcsa-1a-infra-per-workload-identity
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Pod in namespace `reports` must read objects from one cloud storage bucket. An engineer proposes to add this permission to the cloud identity of the worker nodes.

    Which approach better follows least privilege?
body:
  options:
    - id: a
      text: { en: "Give the workload its own cloud identity, mapped to its ServiceAccount, with access to that bucket only" }
    - id: b
      text: { en: "Add the permission to the node identity, and taint the nodes so that only `reports` Pods run there" }
    - id: c
      text: { en: "Add the permission to the node identity, and create an RBAC Role that restricts the bucket to `reports`" }
    - id: d
      text: { en: "Store the cloud account's administrator keys in a Secret that only the `reports` Pod mounts" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A node identity is available to everything that runs on the node, so every Pod there, and anyone who compromises one, would gain access to the bucket. A per-workload identity, which most managed services map to a Kubernetes ServiceAccount, gives the permission to that workload only, and the node identity keeps only what the cluster needs.
  options:
    b:
      en: |
        The credential is still attached to the nodes: every Pod placed there, including DaemonSet Pods, can use it. Placement narrows the exposure but doesn't scope the identity to the workload.
    c:
      en: |
        RBAC authorizes requests to the Kubernetes API. It can't restrict calls that a node's cloud credentials make to the provider's storage API.
    d:
      en: |
        Administrator keys give far more than read access to one bucket, and a long-lived key in a Secret is exposed to anyone who can read that Secret.
references:
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
