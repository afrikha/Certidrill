id: kcsa-1b-boundary-dedicated-nodes-secrets
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The API server uses the Node authorizer, and the `payments` and `marketing` tenants run on separate, dedicated node pools. An attacker escapes from a `marketing` container and takes over the kubelet credentials of its node.

    Why do the dedicated node pools limit which Secrets the attacker can read with these credentials?
body:
  options:
    - id: a
      text: { en: "A kubelet can read only the Secrets of Pods bound to its own node, and only marketing Pods run there" }
    - id: b
      text: { en: "Dedicated nodes encrypt the Secrets of each tenant with a different key" }
    - id: c
      text: { en: "Taints prevent a kubelet from calling the API server for objects of other namespaces" }
    - id: d
      text: { en: "Secrets are stored on the nodes of their tenant instead of in etcd" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Node authorizer lets a kubelet read only the Secrets, ConfigMaps and volumes related to Pods bound to its own node. When each tenant has its own nodes, a compromised kubelet therefore reaches only the Secrets of that tenant. Without dedicated nodes, the same node could also run `payments` Pods and expose their Secrets.
  options:
    b:
      en: |
        Node pools have no effect on how Secrets are encrypted at rest; encryption is configured on the API server.
    c:
      en: |
        Taints only influence scheduling. They don't restrict the API requests a kubelet can make.
    d:
      en: |
        Secrets are always stored in etcd. A node receives a copy only for the Pods it runs, kept in memory.
references:
  - title: "Using Node Authorization"
    url: https://kubernetes.io/docs/reference/access-authn-authz/node/
  - title: "Multi-tenancy"
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
