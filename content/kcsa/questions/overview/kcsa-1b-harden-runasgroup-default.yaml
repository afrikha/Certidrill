id: kcsa-1b-harden-runasgroup-default
objective: "1.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod sets the following security context and nothing else related to users or groups:

    ```yaml
    spec:
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
    ```

    Which primary group ID do the container processes run with?
body:
  options:
    - id: a
      text: { en: "10001, the same value as the user ID" }
    - id: b
      text: { en: "65534, the `nobody` group" }
    - id: c
      text: { en: "0 (root), because `runAsGroup` is omitted" }
    - id: d
      text: { en: "A random group ID chosen by the kubelet for the Pod" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When `runAsGroup` is omitted, the primary group ID of the container processes is root (0); `runAsNonRoot` only checks the user ID. Set `runAsGroup` (and, where needed, `fsGroup`) explicitly to run with an unprivileged group as well.
  options:
    a:
      en: |
        Kubernetes doesn't derive the group from `runAsUser`; without `runAsGroup`, the primary group is 0.
    b:
      en: |
        No `nobody` group is applied by default.
    d:
      en: |
        The kubelet doesn't pick random group IDs; the default primary group is 0.
references:
  - title: "Configure a Security Context for a Pod or Container"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
