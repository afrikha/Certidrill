id: kcsa-1b-registry-cli-password
objective: "1.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator creates a pull Secret on a shared jump host with this command:

    ```bash
    kubectl create secret docker-registry regcred -n shop \
      --docker-server=registry.example.com \
      --docker-username=puller --docker-password='S3cr3t-Pass'
    ```

    What is the risk of this command, and what is a safer alternative?
body:
  options:
    - id: a
      text: { en: "The Secret has no type, so any namespace can use it; add `--type=Opaque` to the command" }
    - id: b
      text: { en: "kubectl stores the password unencoded in the Secret; base64-encode it before passing it" }
    - id: c
      text: { en: "The password can stay in the shell history and be seen by other users; create the Secret from a credentials file" }
    - id: d
      text: { en: "The kubelet writes the password to disk on every node; mount the Secret as a volume instead" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Secrets typed on the command line may be stored unprotected in the shell history, and other users of the machine might see them while `kubectl` is running. A safer way is to create the Secret from an existing Docker configuration file with `kubectl create secret generic regcred --from-file=.dockerconfigjson=<path> --type=kubernetes.io/dockerconfigjson`, or from a manifest kept out of version control.
  options:
    a:
      en: |
        `kubectl create secret docker-registry` creates a Secret of type `kubernetes.io/dockerconfigjson`, and a Pod can only use pull Secrets from its own namespace. `Opaque` isn't a valid type for image pulls.
    b:
      en: |
        kubectl encodes the data itself; base64 is an encoding, not protection, so encoding it by hand would store a double-encoded, wrong value.
    d:
      en: |
        Pull Secrets are passed to the image puller, not mounted into containers, and mounting a Secret as a volume doesn't address the command-line exposure.
references:
  - title: "Pull an Image from a Private Registry"
    url: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
