id: kcsa-1b-isolation-userns-host-namespaces
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer submits this Pod to a Kubernetes v1.37 cluster whose nodes support user namespaces:

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: netprobe
    spec:
      hostUsers: false
      hostNetwork: true
      containers:
      - name: probe
        image: registry.example.com/tools/netprobe:1.2
    ```

    What happens?
body:
  options:
    - id: a
      text: { en: "The Pod runs in a user namespace and in the node's network namespace" }
    - id: b
      text: { en: "The Pod runs in the node's network namespace, and `hostUsers: false` is silently ignored" }
    - id: c
      text: { en: "The Pod is not allowed, because a Pod that uses a user namespace can't use host namespaces" }
    - id: d
      text: { en: "The Pod runs in a user namespace, and `hostNetwork: true` is silently ignored" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a Pod sets `hostUsers: false`, it isn't allowed to use the other host namespaces: `hostNetwork`, `hostIPC` and `hostPID` must not be set to `true`. Sharing the node's network namespace would defeat much of the isolation that the user namespace provides. Run network tooling that needs the host network in a separate, tightly controlled Pod instead.
  options:
    a:
      en: |
        The two settings can't be combined: a user-namespace Pod can't join the node's network namespace.
    b:
      en: |
        Kubernetes doesn't silently drop `hostUsers: false`; the combination is refused.
    d:
      en: |
        `hostNetwork: true` isn't ignored either; the combination is refused.
references:
  - title: "User Namespaces"
    url: https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/
