id: kcsa-1a-control-falco-detective
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Falco raises an alert when a shell starts inside a running container. Which type of security control is this?
body:
  options:
    - id: a
      text: { en: "Detective, because it reports the behavior when it happens" }
    - id: b
      text: { en: "Preventive, because it stops the shell before it starts" }
    - id: c
      text: { en: "Corrective, because it restores the container to a safe state" }
    - id: d
      text: { en: "Preventive, because it rejects the Pod at admission" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Falco watches runtime events such as Linux system calls and raises real-time alerts when they match its rules. It detects and alerts on abnormal behavior; it doesn't block it. That makes it a detective control.
  options:
    b:
      en: |
        Falco doesn't block the process: by the time the alert is raised, the shell is running.
    c:
      en: |
        Falco doesn't repair anything. A corrective action, such as isolating or replacing the Pod, must be taken by people or by separate automation that reacts to the alert.
    d:
      en: |
        Falco is not an admission controller. Rejecting Pods at creation is the job of Pod Security Admission or a policy engine.
references:
  - title: "The Falco Project"
    url: https://falco.org/docs/
