id: kcsa-1a-node-admin-access
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The administrators of Example Corp connect to the worker nodes with SSH from any address, using one key that the whole team shares. Which change hardens this administrative access?
body:
  options:
    - id: a
      text: { en: "Personal, short-lived credentials used through a bastion host, with every session logged" }
    - id: b
      text: { en: "The same shared key, with SSH moved to a non-standard port on each node" }
    - id: c
      text: { en: "The same shared key, stored in a Kubernetes Secret of the `kube-system` namespace" }
    - id: d
      text: { en: "The same shared key, accepted only from Pods running in the `kube-system` namespace" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Administrative access to nodes should be minimized and traceable: individual identities instead of a shared key, short-lived credentials that are rotated automatically, a single controlled entry point instead of SSH from anywhere, and logs of every session.
  options:
    b:
      en: |
        A non-standard port doesn't change who holds the key. A shared, long-lived key can't be attributed to a person or revoked for one person only.
    c:
      en: |
        Storing the key in a Secret exposes it to everyone who can read Secrets in `kube-system` or create Pods there, and it stays shared and long-lived.
    d:
      en: |
        Letting Pods SSH into nodes creates a path from a compromised workload to the host, which is the opposite of hardening.
references:
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
