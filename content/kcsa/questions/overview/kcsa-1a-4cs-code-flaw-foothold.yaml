id: kcsa-1a-4cs-code-flaw-foothold
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Cloud and Cluster layers of a cluster are hardened following current guidance. A web application in namespace `shop` has a command injection flaw, and an attacker uses it to run commands inside the application's container.

    Which statement is consistent with the 4Cs model?
body:
  options:
    - id: a
      text: { en: "Hardened outer layers don't remove the flaw; controls in the Container and Cluster layers now limit how far the attacker gets" }
    - id: b
      text: { en: "The hardened Cloud layer blocks the exploit, because the infrastructure filters every request before it reaches the code" }
    - id: c
      text: { en: "The flaw is harmless, because the API server authenticates every request that the application sends" }
    - id: d
      text: { en: "Only a new Cloud layer control can contain the attacker, because the inner layers can't limit a compromise" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each layer depends on the layers around it, but strong outer layers can't fix a weakness in the code. The attacker now has a foothold in a container: a non-root user, dropped capabilities, the Pod Security Standards, NetworkPolicy and the RBAC permissions of the Pod's ServiceAccount decide how far the attack can go.
  options:
    b:
      en: |
        Network controls of the infrastructure don't inspect the application logic. The malicious input reaches the application as ordinary traffic on an allowed port.
    c:
      en: |
        API server authentication only applies to calls to the Kubernetes API. The attacker runs commands in the container regardless, and could even use a ServiceAccount token mounted in the Pod.
    d:
      en: |
        Inner-layer controls are exactly what contains this compromise: that is the purpose of having several layers of defense.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
