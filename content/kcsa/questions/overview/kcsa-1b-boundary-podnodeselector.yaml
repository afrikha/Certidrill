id: kcsa-1b-boundary-podnodeselector
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Every Pod of the `payments` namespace must run on the nodes labeled `pool=payments`, even when a developer omits the node selector or sets another one. The administrators want a built-in admission plugin that defaults and limits the node selectors of a namespace from an annotation on the namespace.

    Which plugin should they enable?
body:
  options:
    - id: a
      text: { en: "PodTolerationRestriction" }
    - id: b
      text: { en: "NodeRestriction" }
    - id: c
      text: { en: "RuntimeClass" }
    - id: d
      text: { en: "PodNodeSelector" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      PodNodeSelector reads a node selector from a namespace annotation (and from a cluster-wide configuration) and merges it into every Pod of the namespace, rejecting Pods whose own selector conflicts with it. It is disabled by default and still alpha, so check that your cluster supports it; a mutating webhook or a policy engine can achieve the same result. The Kubernetes Security Checklist cites it for keeping Pods on the nodes of their sensitivity tier.
  options:
    a:
      en: |
        PodTolerationRestriction limits and defaults the tolerations of a namespace's Pods. It controls which taints Pods may tolerate, not which nodes they are attracted to.
    b:
      en: |
        NodeRestriction limits the Node and Pod objects that a kubelet can modify. It doesn't set node selectors on Pods.
    c:
      en: |
        The RuntimeClass admission plugin applies the scheduling constraints and overhead of the RuntimeClass a Pod requests; it isn't driven by a namespace annotation.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
