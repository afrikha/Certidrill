id: kcsa-1a-shared-resp-self-managed-vms
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp installs Kubernetes itself with kubeadm on virtual machines rented from a cloud provider.

    Who is responsible for hardening the API server settings and for backing up etcd?
body:
  options:
    - id: a
      text: { en: "The cloud provider, because it operates the virtual machines" }
    - id: b
      text: { en: "Example Corp, because the provider secures only the infrastructure under the virtual machines" }
    - id: c
      text: { en: "The cloud provider, because etcd stores its data on the provider's disks" }
    - id: d
      text: { en: "Nobody, because kubeadm applies a hardened configuration that needs no review" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      On rented virtual machines the provider is responsible for the physical datacenter, the hardware and the virtualization layer. Everything installed on the machines, including the control plane, its flags, etcd and its backups, is operated by Example Corp.
  options:
    a:
      en: |
        The provider runs the virtual machine service, not the software installed inside the machines. A self-managed control plane is the customer's.
    c:
      en: |
        Storing data on the provider's disks doesn't make the provider responsible for the etcd configuration, its access control or its backups.
    d:
      en: |
        kubeadm creates a working cluster, but the operator must still review and harden it (audit logging, encryption at rest, admission settings) and back up etcd.
references:
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
