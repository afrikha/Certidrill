id: kcsa-1a-imds-user-data-secret
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The bootstrap script of the worker nodes is passed as virtual machine user data, and it contains a database password used by a nightly job. Pods can reach the instance metadata service.

    What should be changed?
body:
  options:
    - id: a
      text: { en: "Keep the password in the user data, but encode it in base64" }
    - id: b
      text: { en: "Move the password into a layer of the nightly job's container image" }
    - id: c
      text: { en: "Remove the password from the user data and deliver it through a secret store or a Secret" }
    - id: d
      text: { en: "Run the nightly job's Pods with `automountServiceAccountToken: false`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      User data is provisioning data, and the metadata service returns it to any process on the instance that asks, including Pods. The Kubernetes documentation advises against using provisioning data to deliver secrets: give the job its password through a Kubernetes Secret (encrypted at rest, restricted with RBAC) or an external secret store.
  options:
    a:
      en: |
        base64 is an encoding, not encryption. Anyone who reads the user data decodes the password instantly.
    b:
      en: |
        Anyone who can pull the image can extract its layers and read the password. Secrets don't belong in images.
    d:
      en: |
        This setting only stops the Kubernetes API token from being mounted. The user data stays readable through the metadata service.
references:
  - title: "Securing a Cluster"
    url: https://kubernetes.io/docs/tasks/administer-cluster/securing-a-cluster/
  - title: "Secrets"
    url: https://kubernetes.io/docs/concepts/configuration/secret/
