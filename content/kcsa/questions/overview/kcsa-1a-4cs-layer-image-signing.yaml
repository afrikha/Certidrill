id: kcsa-1a-4cs-layer-image-signing
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team scans its container images for known vulnerabilities during the build, signs the images, and configures them to run as an unprivileged user.

    In which layer of the 4Cs model are these controls?
body:
  options:
    - id: a
      text: { en: "Code" }
    - id: b
      text: { en: "Cluster" }
    - id: c
      text: { en: "Container" }
    - id: d
      text: { en: "Cloud" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Image vulnerability scanning, image signing to establish trust in the content, and running containers with the least operating system privilege are Container-layer controls in the 4Cs model. Stronger isolation with runtime classes is the other control of this layer.
  options:
    a:
      en: |
        The Code layer covers the application itself: TLS, exposed ports, its dependencies, static and dynamic analysis. Building, signing and configuring the image is a Container concern.
    b:
      en: |
        Cluster-layer controls are Kubernetes settings such as RBAC, Pod Security Standards and NetworkPolicy. An admission check of the signature would be a Cluster control, but signing the image is not.
    d:
      en: |
        The Cloud layer is the infrastructure: network access, cloud identities, disks. It doesn't cover the content of images.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
