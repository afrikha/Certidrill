id: kcsa-1b-dev-code-review
objective: "1.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pull request changes the logic that decides which customers can read an order. The pipeline already runs a SAST tool on every pull request.

    Which additional practice is most likely to catch a missing authorization check in this change?
body:
  options:
    - id: a
      text: { en: "An image vulnerability scan of the container image built from the change" }
    - id: b
      text: { en: "A security-aware code review with a required approval before merge" }
    - id: c
      text: { en: "A kube-bench run against the staging cluster" }
    - id: d
      text: { en: "Dropping all Linux capabilities in the Pod's securityContext" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Automated source code analysis finds only a part of security flaws, and authentication and access control problems are among the hardest for tools to detect. A reviewer who understands the business rules can spot a missing authorization check in the logic. The Develop phase of cloud native security includes a security-aware code review process for this reason.
  options:
    a:
      en: |
        An image scan reports known vulnerabilities in packages. It can't see a logic error in the application's own code.
    c:
      en: |
        kube-bench checks the cluster configuration against the CIS benchmark, not application logic.
    d:
      en: |
        Dropping capabilities limits what a compromised process can do on the node. It doesn't detect or fix an authorization flaw in the application.
references:
  - title: "Source Code Analysis Tools | OWASP Foundation"
    url: https://owasp.org/www-community/Source_Code_Analysis_Tools
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
