id: kcsa-1b-digest-latest-tag
objective: "1.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A production Deployment uses the image `registry.example.com/shop/web:latest`. A reviewer asks the team to replace this reference.

    What is the security concern with the `latest` tag in production?
body:
  options:
    - id: a
      text: { en: "The `latest` tag can only be pulled anonymously, so imagePullSecrets are ignored" }
    - id: b
      text: { en: "Images tagged `latest` are never scanned by registries" }
    - id: c
      text: { en: "The tag is mutable, so the image that runs can change without any change to the manifest" }
    - id: d
      text: { en: "The kubelet refuses to verify signatures of images tagged `latest`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A tag can be moved to point to a different image, and `latest` is moved by design. The image that runs then depends on when the Pod starts, not on the reviewed manifest, which makes deployments hard to audit or roll back. Kubernetes recommends avoiding `latest` in production and pinning images, ideally by digest.
  options:
    a:
      en: |
        Pull credentials apply to any tag; `latest` gets no special authentication treatment.
    b:
      en: |
        Registries scan images whatever their tag.
    d:
      en: |
        The kubelet doesn't verify signatures; signature verification is done by admission control, independently of the tag name.
references:
  - title: "Images"
    url: https://kubernetes.io/docs/concepts/containers/images/
