id: kcsa-1a-4cs-defense-in-depth
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Why is the 4Cs model described as an application of defense in depth?
body:
  options:
    - id: a
      text: { en: "It assigns each control to a single layer, so that no control is ever duplicated" }
    - id: b
      text: { en: "It stacks independent controls in several layers, so that one failed control doesn't expose the whole system" }
    - id: c
      text: { en: "It lets a strongly secured Code layer compensate for a weakly secured Cloud layer" }
    - id: d
      text: { en: "It replaces detection and response with preventive controls in every layer" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Defense in depth means several independent layers of protection. In the 4Cs model a container escape meets a hardened node, a stolen token meets RBAC, and a compromised Pod meets NetworkPolicy, so an attacker has to defeat several controls instead of one.
  options:
    a:
      en: |
        Defense in depth accepts overlapping controls on purpose. Avoiding duplication is not its goal.
    c:
      en: |
        The model states the opposite: inner layers can't make up for weak outer layers, because each layer depends on the one around it.
    d:
      en: |
        Defense in depth combines preventive controls with detection and response, because no preventive control is perfect.
references:
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
