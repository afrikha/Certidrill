id: kcsa-1a-infra-api-endpoint-public
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The API server of a cluster has a public address and accepts connections from any internet address. Which change follows infrastructure security guidance?
body:
  options:
    - id: a
      text: { en: "Move the API server from port 6443 to a non-standard port" }
    - id: b
      text: { en: "Make the endpoint private, or allow only the administrators' networks" }
    - id: c
      text: { en: "Keep the endpoint open, because the API server authenticates every request" }
    - id: d
      text: { en: "Publish the API server through a NodePort Service on every node" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Kubernetes Security Checklist asks that the Kubernetes API, the kubelet API and etcd are not exposed publicly on the internet. Use a private endpoint reached through a VPN or a bastion, or restrict a public endpoint to the addresses of the networks that administer the cluster.
  options:
    a:
      en: |
        A different port only hides the endpoint from the simplest scans. Anyone on the internet can still reach it and attack it.
    c:
      en: |
        Authentication is necessary but not enough: an exposed endpoint is open to credential attacks and to any vulnerability in the API server. Network restriction is an independent layer of defense.
    d:
      en: |
        A NodePort Service opens a port on every node, which spreads the exposure instead of reducing it.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Ports and Protocols"
    url: https://kubernetes.io/docs/reference/networking/ports-and-protocols/
