id: kcsa-1b-boundary-control-plane-nodes
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    To save resources, an administrator proposes to let ordinary application Pods run on the control plane nodes, next to the API server.

    Why does the Kubernetes Security Checklist advise against this?
body:
  options:
    - id: a
      text: { en: "Application Pods can't reach the API server from a control plane node" }
    - id: b
      text: { en: "A container breakout could reach the control plane components and their credentials" }
    - id: c
      text: { en: "Control plane nodes don't run a kubelet, so application Pods would never start there" }
    - id: d
      text: { en: "Pod Security Admission isn't evaluated for Pods that run on control plane nodes" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Security Checklist asks for Pods to be placed according to their sensitivity: an application Pod and the API server, for example, should run on separate nodes. If a container breaks out on a node, everything on that node is exposed; keeping application workloads off the control plane nodes stops a breakout from reaching the most sensitive components and their keys.
  options:
    a:
      en: |
        Pods on any node can reach the API server; network access isn't the reason for the separation.
    c:
      en: |
        Control plane nodes commonly run a kubelet (for example to run the control plane as static Pods), so Pods can run there if the scheduler allows it.
    d:
      en: |
        Pod Security Admission is evaluated by the API server at admission, whatever node the Pod is later scheduled to.
references:
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
