id: kcsa-1a-shared-resp-managed-control-plane
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    With a managed Kubernetes service, who patches and hardens the API server and etcd and backs up the control plane?
body:
  options:
    - id: a
      text: { en: "The cluster operator, through SSH access to the control plane nodes" }
    - id: b
      text: { en: "The application developers, through the Deployments they create" }
    - id: c
      text: { en: "The provider, which operates the control plane for the customer" }
    - id: d
      text: { en: "The cluster operator, through an admission policy applied to the control plane" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In a managed Kubernetes service the provider runs the control plane: it hardens, patches and backs up the API server, etcd, the controller manager and the scheduler. This is the part of the work that the shared responsibility model moves away from the customer.
  options:
    a:
      en: |
        Customers of a managed service usually have no access to the control plane machines. Operating them is precisely what the provider takes over.
    b:
      en: |
        Deployments describe workloads. They can't patch or back up control plane components.
    d:
      en: |
        Admission policies validate or mutate API requests. They don't patch the components or back up etcd.
references:
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
