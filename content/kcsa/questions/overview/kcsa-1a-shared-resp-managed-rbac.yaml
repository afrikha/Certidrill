id: kcsa-1a-shared-resp-managed-rbac
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp uses a managed Kubernetes service. An audit finds a ClusterRoleBinding that grants the `cluster-admin` ClusterRole to every authenticated user.

    Who is responsible for removing this binding?
body:
  options:
    - id: a
      text: { en: "Example Corp, because RBAC configuration is always the cluster operator's responsibility" }
    - id: b
      text: { en: "The provider, because it operates the API server that evaluates RBAC" }
    - id: c
      text: { en: "The provider, because a managed service includes hardening the cluster configuration" }
    - id: d
      text: { en: "Nobody, because the managed service resets RBAC bindings at each upgrade" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In the shared responsibility model the provider secures what it operates, such as the control plane of a managed service. The identities, RBAC bindings, workloads and their configuration remain the customer's responsibility in every model. A managed service doesn't mean that the provider secures your configuration.
  options:
    b:
      en: |
        The provider runs the API server, but the RBAC rules it evaluates are the customer's objects. The provider applies the bindings you create; it doesn't decide which ones you need.
    c:
      en: |
        Managed services take over the operation of the control plane, not the access decisions of the customer. Granting `cluster-admin` to everyone is a customer misconfiguration.
    d:
      en: |
        Upgrades keep the RBAC objects stored in the cluster. The binding stays until someone removes it.
references:
  - title: "Cloud Native Security Whitepaper"
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
  - title: "Role Based Access Control Good Practices"
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
