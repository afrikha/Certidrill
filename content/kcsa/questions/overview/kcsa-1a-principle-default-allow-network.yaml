id: kcsa-1a-principle-default-allow-network
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Namespace `orders` was just created and contains no NetworkPolicy. The network plugin of the cluster enforces NetworkPolicy.

    Which statement is true, and which practice applies secure defaults?
body:
  options:
    - id: a
      text: { en: "All ingress and egress of its Pods is allowed; add a default deny policy that selects all Pods" }
    - id: b
      text: { en: "All ingress of its Pods is denied; add policies that allow the traffic each Pod needs" }
    - id: c
      text: { en: "Only traffic inside `orders` is allowed; add a policy that admits the other namespaces" }
    - id: d
      text: { en: "All traffic is denied until a Service exists; create the Services before the Pods" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without any policy, Pods are non-isolated: every inbound and outbound connection is allowed. The Security Checklist asks for a default policy in each namespace that selects all Pods and denies everything, then explicit policies that allow only the needed traffic.
  options:
    b:
      en: |
        Pods become isolated for ingress only when a policy selects them. With no policy, ingress is open.
    c:
      en: |
        Kubernetes doesn't isolate namespaces by default. Traffic from and to other namespaces is allowed too.
    d:
      en: |
        Services don't control whether traffic is allowed. Pods can reach each other's IP addresses directly, with or without a Service.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
