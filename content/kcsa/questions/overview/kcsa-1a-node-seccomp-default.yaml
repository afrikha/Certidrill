id: kcsa-1a-node-seccomp-default
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp wants every container on its nodes to run with the container runtime's default seccomp profile, including the Pods whose manifests don't set any seccomp profile. What should it configure?
body:
  options:
    - id: a
      text: { en: "Enable `seccompDefault` in the kubelet configuration of each node" }
    - id: b
      text: { en: "Enforce the Restricted Pod Security Standard in every namespace" }
    - id: c
      text: { en: "Enforce the Baseline Pod Security Standard in every namespace" }
    - id: d
      text: { en: "Enable AppArmor in the operating system of each node" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without this setting, a container with no seccomp profile runs `Unconfined`, with seccomp disabled. When `seccompDefault` (the `--seccomp-default` flag) is enabled, the kubelet uses the `RuntimeDefault` profile for every workload that doesn't set one, without changing any manifest. The feature is stable since Kubernetes v1.27.
  options:
    b:
      en: |
        Restricted requires that each Pod explicitly sets `RuntimeDefault` or `Localhost`. Pods without a profile are rejected, not given the default profile.
    c:
      en: |
        Baseline only forbids an explicit `Unconfined` profile. Pods without a profile are admitted and still run unconfined.
    d:
      en: |
        AppArmor is a different Linux security module. Enabling it doesn't apply any seccomp profile.
references:
  - title: "Restrict a Container's Syscalls with seccomp"
    url: https://kubernetes.io/docs/tutorials/security/seccomp/
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
