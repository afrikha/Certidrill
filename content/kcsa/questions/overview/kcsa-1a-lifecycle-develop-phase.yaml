id: kcsa-1a-lifecycle-develop-phase
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team builds a threat model that identifies the trust boundaries of a new service, and adds a security-aware code review step to every pull request.

    In which lifecycle phase of cloud native security do these controls apply?
body:
  options:
    - id: a
      text: { en: "Runtime" }
    - id: b
      text: { en: "Deploy" }
    - id: c
      text: { en: "Distribute" }
    - id: d
      text: { en: "Develop" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Develop phase aims at the integrity of the development environment and at designing applications with good security practices. Its controls include a zero trust architecture, a security-aware code review process, a threat model that identifies trust boundaries, and automation such as fuzzing where justified.
  options:
    a:
      en: |
        Runtime controls protect running workloads. A threat model and code review act before any code is built.
    b:
      en: |
        Deploy controls decide what can be deployed, by whom and where, for example through admission checks.
    c:
      en: |
        Distribute controls secure the supply chain of built artifacts: scanning, signing, private registries.
references:
  - title: "Cloud Native Security and Kubernetes"
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
