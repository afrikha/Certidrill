id: kcsa-1b-scan-limits
objective: "1.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team states: "Our image passed the vulnerability scanner with no findings, so it is safe to deploy and we don't need image signing."

    What does a clean scan actually prove?
body:
  options:
    - id: a
      text: { en: "That the image was built by the company's pipeline, because the scanner checks the build provenance" }
    - id: b
      text: { en: "That no known vulnerability was found, not who built the image or whether it was altered" }
    - id: c
      text: { en: "That the image contains no vulnerabilities at all, including ones that haven't been published yet" }
    - id: d
      text: { en: "That the image will stay free of vulnerabilities as long as its tag isn't moved to another image" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A scanner identifies the packages and dependencies in an image and compares them with databases of known vulnerabilities. It doesn't detect unknown flaws, and it doesn't prove where the image came from or that it wasn't altered: that is the role of signing and of signature verification at deploy time. The Kubernetes Application Security Checklist lists scanning and signature validation as two separate items.
  options:
    a:
      en: |
        Vulnerability scanners don't verify provenance or signatures. Proving the origin of an image takes a signature or a provenance attestation.
    c:
      en: |
        Scanners only know published vulnerabilities. Flaws that aren't public yet aren't reported.
    d:
      en: |
        Even with unchanged content, new vulnerabilities are published every day, so a clean image can become vulnerable without any change.
references:
  - title: "Application Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/application-security-checklist/
  - title: "GitHub - aquasecurity/trivy: Find vulnerabilities, misconfigurations, secrets, SBOM in containers, Kubernetes, code repositories, clouds and more"
    url: https://github.com/aquasecurity/trivy
