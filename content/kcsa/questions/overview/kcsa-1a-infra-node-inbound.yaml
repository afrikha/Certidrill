id: kcsa-1a-infra-node-inbound
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp configures the firewall in front of its worker nodes. The cluster exposes some applications with NodePort Services.

    Which inbound traffic should the nodes accept?
body:
  options:
    - id: a
      text: { en: "All TCP traffic from the internet, so that every Service stays reachable" }
    - id: b
      text: { en: "SSH from any address, plus the etcd ports from the other nodes" }
    - id: c
      text: { en: "The kubelet port from the control plane, plus the NodePort Service traffic" }
    - id: d
      text: { en: "Only traffic from the internet on the ports 80 and 443" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Nodes should accept connections only from the control plane on the ports it needs, such as the kubelet API on TCP 10250, plus the traffic of NodePort and LoadBalancer Services. Ideally they have no public address at all.
  options:
    a:
      en: |
        Opening every port exposes the kubelet API and any other service of the node to the internet. Only the ports the Services need should be reachable.
    b:
      en: |
        Open SSH from anywhere is an administrative risk, and etcd ports belong to the control plane, where only the API servers should reach them.
    d:
      en: |
        This blocks the control plane from the kubelet API and blocks the NodePort range, so the cluster and its NodePort Services stop working.
references:
  - title: "Ports and Protocols"
    url: https://kubernetes.io/docs/reference/networking/ports-and-protocols/
  - title: "Security Checklist"
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
