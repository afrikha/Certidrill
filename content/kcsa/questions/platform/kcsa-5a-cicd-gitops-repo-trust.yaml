id: kcsa-5a-cicd-gitops-repo-trust
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After Example Corp adopts GitOps, Flux reconciles the `shop` cluster from a Git repository and reverts any manual change made with `kubectl edit`. Which control becomes most important to prevent an unauthorized change from reaching production?
body:
  options:
    - id: a
      text: { en: "Branch protection with required reviews on the configuration repository" }
    - id: b
      text: { en: "Disabling drift correction so manual changes are kept" }
    - id: c
      text: { en: "A cluster-admin kubeconfig for every developer to fix drift" }
    - id: d
      text: { en: "A shorter reconciliation interval for the Flux controllers" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In GitOps, the Git repository holds the desired state and the agent applies whatever it contains. Whoever can merge to the watched branch can change production, so branch protection, required reviews (and ideally signed commits) on that repository become the key control.
  options:
    b:
      en: |
        Drift correction is a security benefit: it reverts unreviewed manual changes. Disabling it weakens the model.
    c:
      en: |
        Giving every developer cluster-admin bypasses the reviewed Git workflow and widens access to production.
    d:
      en: |
        A shorter interval only applies changes from Git sooner. It does not stop an unauthorized commit.
references:
  - title: Core Concepts
    url: https://fluxcd.io/flux/concepts/
