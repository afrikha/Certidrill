id: kcsa-5b-pki-external-ca
objective: "5.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    To keep the cluster CA private key off the control plane nodes, Example Corp builds a kubeadm cluster in external CA mode: `ca.crt` is present on the nodes, `ca.key` is not, and the company's offline CA issues the control plane certificates.

    Which consequence must the team plan for?
body:
  options:
    - id: a
      text: { en: "The API server can no longer verify client certificates, so users must switch to bearer tokens" }
    - id: b
      text: { en: "ServiceAccount tokens can no longer be issued, because they are signed with `ca.key`" }
    - id: c
      text: { en: "kubeadm keeps renewing every certificate automatically during each control plane upgrade" }
    - id: d
      text: { en: "kube-controller-manager cannot sign CSRs, and automatic kubelet client certificate rotation is disabled" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The built-in signers of kube-controller-manager need the CA private key to issue certificates through the CSR API. Without `ca.key`, they cannot sign, and kubeadm documents that automatic kubelet client certificate rotation is disabled in external CA mode. The team must issue and renew those certificates with its own tooling, in exchange for a CA key that is never exposed on the nodes.
  options:
    a:
      en: |
        Verifying a client certificate needs only the CA certificate (`ca.crt`), which is present. Only signing requires the private key.
    b:
      en: |
        ServiceAccount tokens are signed with the separate ServiceAccount key pair (`sa.key`, `sa.pub`), not with the cluster CA key.
    c:
      en: |
        kubeadm reports externally managed certificates and leaves their renewal to the operator: it cannot renew certificates of a CA whose key it does not have.
references:
  - title: "Certificate Management with kubeadm"
    url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
  - title: "PKI certificates and requirements"
    url: https://kubernetes.io/docs/setup/best-practices/certificates/
