id: kcsa-5a-reg-pull-secret-type
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Pods in the `shop` namespace must pull images from a private registry at `registry.example.com`. The administrator creates a Secret and lists it under `imagePullSecrets` in the Pod spec. Which Secret type does the kubelet accept for this purpose?
body:
  options:
    - id: a
      text: { en: "`Opaque`" }
    - id: b
      text: { en: "`kubernetes.io/basic-auth`" }
    - id: c
      text: { en: "`kubernetes.io/dockerconfigjson`" }
    - id: d
      text: { en: "`kubernetes.io/service-account-token`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Image pull Secrets must be of type `kubernetes.io/dockerconfigjson` (or the legacy `kubernetes.io/dockercfg`). `kubectl create secret docker-registry` creates a Secret of this type from a server, user name and password.
  options:
    a:
      en: |
        `Opaque` is the generic type for arbitrary data. The kubelet does not read registry credentials from it.
    b:
      en: |
        `kubernetes.io/basic-auth` stores a user name and password for basic authentication, but it is not a type accepted in `imagePullSecrets`.
    d:
      en: |
        `kubernetes.io/service-account-token` holds a legacy ServiceAccount token for the Kubernetes API, not registry credentials.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
