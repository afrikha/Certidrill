id: kcsa-5b-kubeadm-check-expiration
objective: "5.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator wants to know when the certificates of a kubeadm control plane expire, including the client certificates embedded in `admin.conf`, `controller-manager.conf` and `scheduler.conf`.

    Which command should the administrator run on a control plane node?
body:
  options:
    - id: a
      text: { en: "`kubectl get csr`" }
    - id: b
      text: { en: "`kubeadm certs check-expiration`" }
    - id: c
      text: { en: "`kubeadm token list`" }
    - id: d
      text: { en: "`kubectl get nodes -o wide`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `kubeadm certs check-expiration` shows the expiration date and residual time of the certificates in `/etc/kubernetes/pki` and of the client certificates embedded in the kubeadm kubeconfig files. It also tells whether a certificate is managed externally. Expiring certificates are then renewed with `kubeadm certs renew`.
  options:
    a:
      en: |
        This lists CertificateSigningRequest objects, which are deleted one hour after approval. It does not show the certificates installed on the control plane.
    c:
      en: |
        This lists the bootstrap tokens used to join nodes, not certificate expiry dates.
    d:
      en: |
        This shows node status, versions and addresses. It gives no information on certificate expiry.
references:
  - title: "Certificate Management with kubeadm"
    url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
