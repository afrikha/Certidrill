id: kcsa-5a-obs-node-logging-agent
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    During an investigation, the team finds that the compromised Pod was evicted from its node, and its container logs were gone. Applications write to stdout and stderr and must not be changed. Which logging architecture keeps container logs available after a Pod or node disappears?
body:
  options:
    - id: a
      text: { en: "Raise the kubelet `containerLogMaxSize` so that rotated files are kept longer" }
    - id: b
      text: { en: "Use `kubectl logs --previous` to read the logs of the evicted Pod" }
    - id: c
      text: { en: "Run a logging agent such as Fluent Bit as a DaemonSet that forwards to central storage" }
    - id: d
      text: { en: "Add a sidecar to each Pod that streams the application log file to its own stdout" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes stores container logs on the node and does not provide cluster-level log storage. When a Pod is evicted, its containers are evicted with their logs. A node-level agent, deployed as a DaemonSet, reads the log files on each node and ships them to a separate back end, without any change to the applications.
  options:
    a:
      en: |
        A larger rotation size keeps more data on the node, but the files are still deleted with the evicted Pod or lost with the node.
    b:
      en: |
        `--previous` returns the logs of a previous instance of a container in a Pod that still exists. It cannot read logs of a Pod that has been evicted from the node.
    d:
      en: |
        A streaming sidecar writes to stdout, which still ends up in node-local files. It also requires changing each Pod.
references:
  - title: Logging Architecture
    url: https://kubernetes.io/docs/concepts/cluster-administration/logging/
