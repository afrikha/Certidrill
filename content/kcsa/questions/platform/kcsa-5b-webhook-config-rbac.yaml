id: kcsa-5b-webhook-config-rbac
objective: "5.7.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Who should be allowed to update or delete the ValidatingWebhookConfiguration and MutatingWebhookConfiguration objects that implement a cluster's security policies?
body:
  options:
    - id: a
      text: { en: "Every developer, so that teams can unblock their own deployments" }
    - id: b
      text: { en: "Only a small group of trusted cluster administrators, with changes audited" }
    - id: c
      text: { en: "Any ServiceAccount of `kube-system`, because webhooks are system components" }
    - id: d
      text: { en: "Nobody, because these objects become immutable once they are created" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Anyone who can modify a webhook configuration can disable a policy, narrow its scope or send objects to a server of their choice. Kubernetes recommends limiting create, update, patch, delete and deletecollection on these objects to trusted entities with RBAC, and audit logs should record every change.
  options:
    a:
      en: |
        A developer who can edit the configuration can switch off the security policy for everyone. Exceptions should go through the administrators.
    c:
      en: |
        Granting the right to every ServiceAccount of `kube-system` gives it to many workloads that do not need it, against least privilege.
    d:
      en: |
        Webhook configurations are ordinary API objects that can be updated and deleted. Their protection comes from RBAC.
references:
  - title: "Admission Webhook Good Practices"
    url: https://kubernetes.io/docs/concepts/cluster-administration/admission-webhooks-good-practices/
