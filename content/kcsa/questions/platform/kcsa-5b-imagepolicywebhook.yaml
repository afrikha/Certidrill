id: kcsa-5b-imagepolicywebhook
objective: "5.7.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp already runs an internal service that decides whether a container image may run, based on its own vulnerability database. The security team wants the kube-apiserver to ask this service about the images of every new Pod, through a built-in admission plugin.

    Which plugin should they enable?
body:
  options:
    - id: a
      text: { en: "`AlwaysPullImages`" }
    - id: b
      text: { en: "`NodeRestriction`" }
    - id: c
      text: { en: "`ImagePolicyWebhook`" }
    - id: d
      text: { en: "`PodSecurity`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `ImagePolicyWebhook` lets a back-end webhook make the admission decision: the API server sends it an `ImageReview` object describing the images, over TLS, and allows or rejects the request according to the answer. The plugin is disabled by default and is configured through the file given to `--admission-control-config-file`.
  options:
    a:
      en: |
        `AlwaysPullImages` forces the pull policy of new Pods to `Always` so that registry credentials are checked. It does not consult any external decision service.
    b:
      en: |
        `NodeRestriction` limits which Node and Pod objects each kubelet can modify. It has nothing to do with images.
    d:
      en: |
        `PodSecurity` checks Pods against the Pod Security Standards (privileges, host namespaces, capabilities). It does not evaluate images.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
