id: kcsa-5a-ir-audit-dropped-events
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The API server sends audit events through the webhook backend in its default `batch` mode to an external collector. Last night the collector was unreachable for an hour, and the team suspects that audit events were lost. Which API server metric reveals events dropped because of export errors?
body:
  options:
    - id: a
      text: { en: "`apiserver_audit_event_total`" }
    - id: b
      text: { en: "`apiserver_request_total`" }
    - id: c
      text: { en: "`apiserver_audit_requests_rejected_total`" }
    - id: d
      text: { en: "`apiserver_audit_error_total`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `apiserver_audit_error_total` counts audit events that failed to be audited properly, labeled by the backend plugin, so an increase shows a gap in the evidence. In batch mode, events wait in a buffer and are dropped when it overflows; alerting on this metric tells responders that the audit trail is incomplete.
  options:
    a:
      en: |
        `apiserver_audit_event_total` counts audit events generated and sent to the audit backend. It does not tell how many were lost.
    b:
      en: |
        `apiserver_request_total` counts API requests served by the API server, whether or not their audit events were delivered.
    c:
      en: |
        This metric counts API requests rejected because of an error in the audit logging backend. It does not count audit events lost from the batch buffer while requests kept succeeding.
references:
  - title: Auditing
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - title: Kubernetes Metrics Reference
    url: https://kubernetes.io/docs/reference/instrumentation/metrics/
