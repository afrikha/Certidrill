id: kcsa-5a-rt-tetragon-enforcement
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp already alerts on suspicious runtime behavior. It now wants an eBPF-based, Kubernetes-aware tool that can also act inside the kernel at the moment a process performs a forbidden action, for example by killing that process. Which project fits?
body:
  options:
    - id: a
      text: { en: "Fluent Bit" }
    - id: b
      text: { en: "OPA Gatekeeper" }
    - id: c
      text: { en: "OpenTelemetry" }
    - id: d
      text: { en: "Tetragon" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Tetragon, a Cilium project, uses eBPF for security observability and runtime enforcement. Its tracing policies can act in the kernel, inline with the operation, for example by sending `SIGKILL` to the process or overriding the return value of the call.
  options:
    a:
      en: |
        Fluent Bit collects and forwards logs. It has no kernel-level enforcement.
    b:
      en: |
        OPA Gatekeeper enforces policies at admission time on API objects. It cannot act on a process that is already running.
    c:
      en: |
        OpenTelemetry collects traces, metrics and logs. It observes but does not enforce.
references:
  - title: "cilium/tetragon: eBPF-based Security Observability and Runtime Enforcement"
    url: https://github.com/cilium/tetragon
