id: kcsa-5b-istio-egress-bypass
objective: "5.6.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Istio mesh routes calls to external services through an egress gateway, where they are monitored and authorized. A penetration test shows that a compromised Pod sent traffic directly to the internet, bypassing its sidecar proxy and the egress gateway.

    What should be added to enforce the egress design?
body:
  options:
    - id: a
      text: { en: "A mesh-wide PeerAuthentication policy in `STRICT` mode for all workloads" }
    - id: b
      text: { en: "NetworkPolicies that block external egress from all Pods except the egress gateway" }
    - id: c
      text: { en: "A second egress gateway in another namespace, for redundancy of the exit point" }
    - id: d
      text: { en: "An AuthorizationPolicy with the `DENY` action attached to the egress gateway" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Istio documents that it cannot securely enforce that all egress traffic flows through the egress gateway: a Pod that bypasses its proxy reaches external services directly. A mechanism outside Istio must enforce it, for example Kubernetes NetworkPolicies that forbid egress traffic not originating from the egress gateway.
  options:
    a:
      en: |
        `STRICT` mode makes workloads accept only mTLS for incoming mesh traffic. It does not stop a Pod from opening connections to the internet.
    c:
      en: |
        Traffic that bypasses the proxy never reaches any gateway, so adding gateways does not close the gap.
    d:
      en: |
        Policies on the egress gateway apply only to traffic that goes through it. The bypassing traffic never does.
references:
  - title: "Egress Gateways"
    url: https://istio.io/latest/docs/tasks/traffic-management/egress/egress-gateway/
