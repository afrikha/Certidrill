id: kcsa-5b-pki-apiserver-kubelet-client
objective: "5.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    For `kubectl logs` and `kubectl exec`, the kube-apiserver connects to the kubelets, which accept only authenticated clients. In a kubeadm cluster, which credential does the API server present to the kubelets?
body:
  options:
    - id: a
      text: { en: "Its etcd client certificate `apiserver-etcd-client`, signed by the etcd CA" }
    - id: b
      text: { en: "The client certificate `apiserver-kubelet-client`, signed by the cluster CA" }
    - id: c
      text: { en: "The `front-proxy-client` certificate, signed by the front-proxy CA" }
    - id: d
      text: { en: "A ServiceAccount token signed with the `sa.key` private key" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      To authenticate itself to the kubelet, the API server needs a client certificate and key pair. kubeadm creates `apiserver-kubelet-client` for this purpose, a client certificate signed by the cluster CA (`kubernetes-ca`), which the kubelets trust for client authentication.
  options:
    a:
      en: |
        `apiserver-etcd-client` is signed by the etcd CA and is used only to connect to etcd. The kubelets do not trust the etcd CA.
    c:
      en: |
        `front-proxy-client` is used when the API server forwards requests to extension API servers of the aggregation layer, not to the kubelets.
    d:
      en: |
        `sa.key` signs ServiceAccount tokens for workloads and controllers. The API server authenticates to the kubelets with a client certificate.
references:
  - title: "PKI certificates and requirements"
    url: https://kubernetes.io/docs/setup/best-practices/certificates/
