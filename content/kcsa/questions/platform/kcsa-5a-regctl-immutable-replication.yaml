id: kcsa-5a-regctl-immutable-replication
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In Example Corp's Harbor registry, the `prod` project has a tag immutability rule that matches all tags, and it already contains `payments/api:2.4.0`. A misconfigured replication job then copies a different image tagged `payments/api:2.4.0` from another registry into `prod`. What is the result?
body:
  options:
    - id: a
      text: { en: "The replicated image cannot overwrite the tag, so `2.4.0` still points to the original image" }
    - id: b
      text: { en: "Replication bypasses immutability rules, so `2.4.0` now points to the replicated image" }
    - id: c
      text: { en: "The original image is deleted and `2.4.0` is removed from the project" }
    - id: d
      text: { en: "Both images are kept, and the kubelet pulls the one that was pushed most recently" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An immutable tagged artifact cannot be altered in any way, whether by re-pushing, re-tagging or replication. The incoming image is refused for that tag, and `payments/api:2.4.0` keeps designating the original content.
  options:
    b:
      en: |
        Harbor applies tag immutability to replication as well as to pushes; replication is not an exception.
    c:
      en: |
        Immutability also prevents deleting the tagged artifact. Nothing is removed.
    d:
      en: |
        A tag in a repository designates one manifest at a time. The kubelet resolves the tag to a single digest; there is no "most recent" choice.
references:
  - title: goharbor/harbor
    url: https://github.com/goharbor/harbor
