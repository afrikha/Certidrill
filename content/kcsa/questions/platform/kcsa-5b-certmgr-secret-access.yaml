id: kcsa-5b-certmgr-secret-access
objective: "5.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security review of a cluster that uses cert-manager asks where the private keys of the certificates issued to applications are kept, and which control protects them.

    Which answer is correct?
body:
  options:
    - id: a
      text: { en: "In the memory of the cert-manager controller only, so no access control is needed" }
    - id: b
      text: { en: "At the ACME server, protected by the account's registered email address" }
    - id: c
      text: { en: "In the `Certificate` objects, protected by restricting `get` on `certificates.cert-manager.io`" }
    - id: d
      text: { en: "In the Secret named by `secretName`, protected by restricting who can read Secrets in that namespace" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      cert-manager stores the signed certificate and its private key (`tls.key`) in the Secret named by the `Certificate`'s `secretName`, in the same namespace. Anyone who can read that Secret gets the key, so RBAC on Secrets (and encryption at rest of Secrets in etcd) protects it.
  options:
    a:
      en: |
        The key is persisted in a Kubernetes Secret so that Ingress controllers and Pods can use it.
    b:
      en: |
        With ACME, cert-manager generates the private key locally and sends only a signing request. The CA never holds the certificate's private key.
    c:
      en: |
        A `Certificate` is a human-readable description of the desired certificate (names, issuer, Secret name). It does not contain the key.
references:
  - title: "Certificate resource"
    url: https://cert-manager.io/docs/usage/certificate/
