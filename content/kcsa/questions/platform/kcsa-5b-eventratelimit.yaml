id: kcsa-5b-eventratelimit
objective: "5.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A misbehaving controller floods the kube-apiserver with requests that create Event objects, and the API server slows down for every client.

    Which built-in admission plugin is designed to limit this kind of flood?
body:
  options:
    - id: a
      text: { en: "`LimitRanger`" }
    - id: b
      text: { en: "`EventRateLimit`" }
    - id: c
      text: { en: "`NamespaceLifecycle`" }
    - id: d
      text: { en: "`PodSecurity`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `EventRateLimit` mitigates an API server flooded by requests to store new Events. It can set limits for the whole server, per namespace, per user, or per source and object. It is an alpha plugin, disabled by default, configured through the admission configuration file.
  options:
    a:
      en: |
        `LimitRanger` applies and enforces the CPU and memory defaults and bounds of LimitRange objects. It does not limit request rates.
    c:
      en: |
        `NamespaceLifecycle` rejects objects in namespaces that are terminating or do not exist. It does not limit how many requests a client sends.
    d:
      en: |
        `PodSecurity` checks Pods against the Pod Security Standards. Events are not Pods.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
