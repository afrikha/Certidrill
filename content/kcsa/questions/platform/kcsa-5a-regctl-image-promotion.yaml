id: kcsa-5a-regctl-image-promotion
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers at Example Corp push images to a development registry. Production clusters may pull only from a production registry, and nobody may push to it directly. How should images reach the production registry?
body:
  options:
    - id: a
      text: { en: "Developers push the same tag to both registries from their workstations" }
    - id: b
      text: { en: "Images that pass scanning, tests and signature checks are copied by digest" }
    - id: c
      text: { en: "Production clusters pull from the development registry through a proxy cache" }
    - id: d
      text: { en: "The production registry pulls the `latest` tag from development every night" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Image promotion copies an image from a lower-trust registry to a higher-trust one only after it passes the required gates. Copying by digest guarantees that production receives exactly the bytes that were tested, and only the promotion process has push rights on production.
  options:
    a:
      en: |
        Direct pushes from workstations break the "nobody pushes to production" rule and skip every gate.
    c:
      en: |
        Pulling through a proxy cache makes production depend on the development registry and lets any developer image reach production.
    d:
      en: |
        Copying `latest` on a schedule promotes whatever was pushed last, without any check, and `latest` is a mutable tag.
references:
  - title: goharbor/harbor
    url: https://github.com/goharbor/harbor
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
