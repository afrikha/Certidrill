id: kcsa-5a-rt-falco-rule-condition
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security engineer reads a Falco rule that detects writes below `/etc` in containers. Which field of the rule contains the filtering expression that Falco evaluates against each event to decide whether the rule matches?
body:
  options:
    - id: a
      text: { en: "`condition`" }
    - id: b
      text: { en: "`output`" }
    - id: c
      text: { en: "`priority`" }
    - id: d
      text: { en: "`desc`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Falco rule has five required fields: `rule`, `condition`, `desc`, `output` and `priority`. The `condition` is the filtering expression applied to events; macros and lists make conditions reusable.
  options:
    b:
      en: |
        `output` is the message Falco produces when the rule matches. It does not decide whether the rule matches.
    c:
      en: |
        `priority` is the severity of the alert, from `EMERGENCY` to `DEBUG`. It does not filter events.
    d:
      en: |
        `desc` is a longer human-readable description of what the rule detects.
references:
  - title: Basic Elements of Falco Rules
    url: https://falco.org/docs/concepts/rules/basic-elements/
