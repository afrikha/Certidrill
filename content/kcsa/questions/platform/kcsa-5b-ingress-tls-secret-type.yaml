id: kcsa-5b-ingress-tls-secret-type
objective: "5.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Ingress must serve HTTPS for `shop.example.com`. Its `spec.tls[].secretName` field references a Secret in the same namespace.

    Which Secret can the Ingress use?
body:
  options:
    - id: a
      text: { en: "A Secret of type `Opaque` with the keys `ca.crt` and `ca.key`" }
    - id: b
      text: { en: "A Secret of type `kubernetes.io/tls` with the keys `tls.crt` and `tls.key`" }
    - id: c
      text: { en: "A Secret of type `kubernetes.io/dockerconfigjson` with the certificate in `.dockerconfigjson`" }
    - id: d
      text: { en: "A Secret of type `kubernetes.io/service-account-token` annotated with the host name" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Ingress secures traffic with a TLS Secret: type `kubernetes.io/tls`, whose keys `tls.crt` and `tls.key` hold the certificate and private key. The certificate must be valid for the host listed under `tls.hosts`, which must match the host of the rules.
  options:
    a:
      en: |
        `ca.crt` and `ca.key` would be a CA key pair, not the server certificate and key the Ingress needs. Storing a CA private key next to an application is also a risk.
    c:
      en: |
        This type stores registry credentials used to pull images with imagePullSecrets. It is not a TLS certificate.
    d:
      en: |
        This type is the legacy long-lived ServiceAccount token Secret. It holds an API token, not a TLS certificate.
references:
  - title: "Ingress"
    url: https://kubernetes.io/docs/concepts/services-networking/ingress/
