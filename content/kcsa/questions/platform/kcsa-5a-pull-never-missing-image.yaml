id: kcsa-5a-pull-never-missing-image
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In an isolated environment, nodes have no access to any registry and images are loaded onto them in advance. A Pod is scheduled with the container below on a node where this image was never loaded. What happens?

    ```yaml
    containers:
    - name: web
      image: registry.example.com/shop/web:2.3.1
      imagePullPolicy: Never
    ```
body:
  options:
    - id: a
      text: { en: "The container does not start, because the kubelet never tries to fetch the image" }
    - id: b
      text: { en: "The kubelet pulls the image once and then stops contacting the registry" }
    - id: c
      text: { en: "The kubelet copies the image from another node that already has it" }
    - id: d
      text: { en: "The scheduler moves the Pod to a node that already has the image" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With `imagePullPolicy: Never`, the kubelet never fetches the image. If the image is present locally, the container starts; otherwise startup fails. Pre-loaded images work only if every node that can run the Pod has the same images.
  options:
    b:
      en: |
        That behavior matches `IfNotPresent`, which pulls when the image is missing. `Never` does not pull at all.
    c:
      en: |
        Nodes make image decisions independently; the kubelet does not copy images between nodes.
    d:
      en: |
        The Pod is already bound to its node, and the scheduler does not move it; the container on that node fails to start.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
