id: kcsa-5b-egress-threat-exfiltration
objective: "5.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The security team plans a default-deny egress NetworkPolicy, with explicit allow rules, for the namespaces that run internet-facing applications.

    Which threat does this control mainly reduce?
body:
  options:
    - id: a
      text: { en: "Clients on the internet sending malicious requests to the applications" }
    - id: b
      text: { en: "Users with broad RBAC rights reading Secrets through the API server" }
    - id: c
      text: { en: "A compromised Pod sending data out or downloading tools from any host" }
    - id: d
      text: { en: "A container escaping to its node through a privileged security context" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      By default a Pod can connect to any destination. Once an attacker controls a Pod, unrestricted egress lets them download tools, exfiltrate data and reach command-and-control servers. A default-deny egress policy limits the Pod to the destinations explicitly allowed (for example DNS and one partner API).
  options:
    a:
      en: |
        Incoming requests are ingress traffic. They are handled by ingress rules, TLS and application controls, not by egress policies.
    b:
      en: |
        Reads through the API server are controlled by RBAC. NetworkPolicies do not evaluate API permissions.
    d:
      en: |
        Container escape is blocked by Pod Security Standards and securityContext settings. Network rules do not stop it.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
