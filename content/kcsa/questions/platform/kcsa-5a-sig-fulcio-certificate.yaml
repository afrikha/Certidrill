id: kcsa-5a-sig-fulcio-certificate
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During keyless signing with Sigstore, which component checks the signer's OIDC identity token and issues a short-lived code-signing certificate bound to that identity and to the signer's public key?
body:
  options:
    - id: a
      text: { en: "Rekor" }
    - id: b
      text: { en: "Cosign" }
    - id: c
      text: { en: "in-toto" }
    - id: d
      text: { en: "Fulcio" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Fulcio is Sigstore's code-signing certificate authority. It verifies the OIDC token presented by the signer and issues a short-lived certificate that binds the identity to the public key used for signing.
  options:
    a:
      en: |
        Rekor is the transparency log. It records signing events so they can be audited; it does not issue certificates.
    b:
      en: |
        Cosign is the client. It generates the key pair, requests the certificate from Fulcio and signs the artifact, but it is not the certificate authority.
    c:
      en: |
        in-toto is a framework and metadata standard for supply chain attestations. It is not part of Sigstore's certificate issuance.
references:
  - title: Overview
    url: https://docs.sigstore.dev/about/overview/
