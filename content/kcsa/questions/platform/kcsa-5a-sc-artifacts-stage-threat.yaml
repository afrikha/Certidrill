id: kcsa-5a-sc-artifacts-stage-threat
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp's threat model lists one threat for each stage of its software supply chain: source, build, artifacts and deployment. Which threat belongs to the artifacts stage?
body:
  options:
    - id: a
      text: { en: "A developer's stolen Git credentials are used to push an unreviewed commit" }
    - id: b
      text: { en: "A compromised CI runner injects code while the image is being compiled" }
    - id: c
      text: { en: "Stolen pipeline credentials are used to apply a manifest to the cluster" }
    - id: d
      text: { en: "An image stored in the registry is replaced under its existing tag" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The artifacts stage covers built images, charts and binaries while they are stored and distributed. Replacing or modifying a package after the build, or compromising the registry that holds it, are threats at this stage; signing, immutable tags and references by digest are its controls.
  options:
    a:
      en: |
        An unauthorized change submitted to the repository is a source stage threat, addressed by branch protection, mandatory review and strong authentication.
    b:
      en: |
        Tampering during compilation is a build stage threat, addressed by hardened, isolated build platforms and signed provenance.
    c:
      en: |
        Applying a manifest with stolen credentials is a deployment stage threat, addressed by admission policies and least-privilege deployment credentials.
references:
  - title: "Threats & mitigations"
    url: https://slsa.dev/spec/v1.0/threats
