id: kcsa-5b-certmgr-clusterissuer
objective: "5.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp runs applications in about twenty namespaces. Every team must obtain TLS certificates with cert-manager from the same ACME account, and the platform team does not want to create an issuer in each namespace.

    What should the platform team create?
body:
  options:
    - id: a
      text: { en: "An `Issuer` in the `cert-manager` namespace" }
    - id: b
      text: { en: "A CertificateSigningRequest for the `kubernetes.io/kube-apiserver-client` signer" }
    - id: c
      text: { en: "A `ClusterIssuer` that the teams' `Certificate` resources reference" }
    - id: d
      text: { en: "A ClusterTrustBundle that contains the ACME CA certificate" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A `ClusterIssuer` is not namespaced, so `Certificate` resources in every namespace can use it by setting `issuerRef.kind: ClusterIssuer`. One ACME `ClusterIssuer` serves all teams.
  options:
    a:
      en: |
        An `Issuer` is namespaced: cert-manager cannot issue certificates from an `Issuer` for a `Certificate` in a different namespace.
    b:
      en: |
        The Kubernetes CSR API with this signer issues client certificates for the kube-apiserver. It does not talk to an ACME CA and does not create application TLS certificates.
    d:
      en: |
        A ClusterTrustBundle distributes CA certificates that clients trust. It does not request or issue certificates.
references:
  - title: "Issuer"
    url: https://cert-manager.io/docs/concepts/issuer/
