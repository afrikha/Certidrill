id: kcsa-5b-admission-plugins-flag
objective: "5.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement correctly describes how built-in admission plugins such as `NodeRestriction` are turned on?
body:
  options:
    - id: a
      text: { en: "They are compiled into the kube-apiserver and turned on with its `--enable-admission-plugins` flag" }
    - id: b
      text: { en: "They run as separate Pods and are registered with a `ValidatingWebhookConfiguration` object" }
    - id: c
      text: { en: "They are turned on for each namespace with a `pod-security.kubernetes.io` label" }
    - id: d
      text: { en: "They are configured in the kubelet configuration file of each node" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Built-in admission plugins are part of the kube-apiserver binary. A default set is enabled, and `--enable-admission-plugins` takes a comma-separated list of additional plugins to invoke (the order does not matter). `NodeRestriction`, for example, is not in the default set and must be listed there.
  options:
    b:
      en: |
        That describes dynamic admission webhooks, which are external HTTPS services. Built-in plugins need no separate Pods.
    c:
      en: |
        These labels configure the levels of the `PodSecurity` plugin for a namespace. They do not turn plugins on or off.
    d:
      en: |
        Admission runs in the kube-apiserver, not in the kubelet.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
