id: kcsa-5a-obs-prometheus-exposure
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer exposes the Prometheus server of the `monitoring` namespace on the internet through a `LoadBalancer` Service, without authentication, so that a dashboard vendor can reach it. Prometheus runs with its default flags. What is the main risk?
body:
  options:
    - id: a
      text: { en: "Anyone can run arbitrary commands on the scraped targets through Prometheus" }
    - id: b
      text: { en: "Anyone can rewrite the scrape configuration through the HTTP API" }
    - id: c
      text: { en: "Anyone can decrypt the Secrets that are stored in etcd" }
    - id: d
      text: { en: "Anyone can query the stored metrics, revealing internal names and topology" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Anyone who reaches the Prometheus HTTP endpoint can query all stored time series and operational data, which reveals namespaces, Pods, services and other internal details, and can overload the server. Prometheus documentation says these endpoints should not be exposed to public networks.
  options:
    a:
      en: |
        Prometheus scrapes metrics from targets; it does not execute commands on them.
    b:
      en: |
        The configuration comes from files on disk, and the admin and lifecycle APIs are disabled by default. Querying is the exposed capability.
    c:
      en: |
        Prometheus has no access to etcd encryption keys or Secret values.
references:
  - title: Security model
    url: https://prometheus.io/docs/operating/security/
