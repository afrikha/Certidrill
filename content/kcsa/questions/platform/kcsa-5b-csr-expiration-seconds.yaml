id: kcsa-5b-csr-expiration-seconds
objective: "5.5.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A developer submits the CertificateSigningRequest below, which an administrator approves. kube-controller-manager runs with the default `--cluster-signing-duration`.

    ```yaml
    apiVersion: certificates.k8s.io/v1
    kind: CertificateSigningRequest
    metadata:
      name: dev-alice
    spec:
      request: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNU  # truncated
      signerName: kubernetes.io/kube-apiserver-client
      expirationSeconds: 63072000  # two years
      usages:
      - client auth
    ```

    What is the validity period of the issued certificate?
body:
  options:
    - id: a
      text: { en: "10 minutes" }
    - id: b
      text: { en: "90 days" }
    - id: c
      text: { en: "1 year" }
    - id: d
      text: { en: "2 years" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When `spec.expirationSeconds` is set, the built-in signers use the smaller of that value and the cluster signing duration. `--cluster-signing-duration` defaults to one year, so the two-year request is capped at one year.
  options:
    a:
      en: |
        600 seconds (10 minutes) is the minimum value allowed for `expirationSeconds`, not a default applied to longer requests.
    b:
      en: |
        90 days is the default `duration` of a cert-manager `Certificate`. The CSR API of Kubernetes does not use it.
    d:
      en: |
        A built-in signer never issues a certificate longer than its configured signing duration, whatever the CSR requests.
references:
  - title: "Certificates and Certificate Signing Requests"
    url: https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/
