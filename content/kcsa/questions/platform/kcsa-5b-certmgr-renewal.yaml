id: kcsa-5b-certmgr-renewal
objective: "5.5.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    A team creates a cert-manager `Certificate` that references a CA issuer. The resource sets none of the fields `duration`, `renewBefore` and `renewBeforePercentage`.

    When does cert-manager renew the certificate after it is issued?
body:
  options:
    - id: a
      text: { en: "After about 30 days" }
    - id: b
      text: { en: "After about 60 days" }
    - id: c
      text: { en: "After about 80 days" }
    - id: d
      text: { en: "After about 89 days" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The default `spec.duration` of a `Certificate` is 90 days. When neither `renewBefore` nor `renewBeforePercentage` is set, cert-manager renews two thirds of the way through the certificate's duration, so about 60 days after issuance, 30 days before expiry.
  options:
    a:
      en: |
        30 days is one third of the default duration. By default renewal happens at two thirds, not one third.
    c:
      en: |
        Renewal 10 days before expiry would need an explicit `renewBefore`. The default leaves a third of the lifetime as a margin.
    d:
      en: |
        Waiting until the last day leaves no margin for issuance failures. The default renews at two thirds of the duration.
references:
  - title: "Certificate resource"
    url: https://cert-manager.io/docs/usage/certificate/
