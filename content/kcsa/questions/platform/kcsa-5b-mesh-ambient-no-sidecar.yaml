id: kcsa-5b-mesh-ambient-no-sidecar
objective: "5.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The platform team of Example Corp wants mutual TLS between the workloads of the `shop` namespace. No proxy container may be added to the Pods, and the Pods that are already running must not be restarted to join the mesh.

    Which data plane model meets these requirements?
body:
  options:
    - id: a
      text: { en: "Istio sidecar mode, with automatic sidecar injection enabled on the namespace" }
    - id: b
      text: { en: "Linkerd, with its proxy injected into each Pod of the namespace" }
    - id: c
      text: { en: "Istio ambient mode, with a ztunnel proxy on each node handling the namespace's traffic" }
    - id: d
      text: { en: "An Istio egress gateway that all Pods of the namespace send their traffic through" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Istio ambient mode is a sidecarless data plane: a single ztunnel proxy per node handles layer 4 functions such as mTLS, authentication and L4 authorization for the Pods of that node. A namespace joins the mesh by adding the label `istio.io/dataplane-mode=ambient`, and the applications do not need to be restarted.
  options:
    a:
      en: |
        Sidecar mode adds an Envoy container to every Pod. Injection happens when a Pod is created, so the running Pods would have to be restarted, and both requirements fail.
    b:
      en: |
        Linkerd's data plane is a sidecar micro-proxy placed in each Pod by its proxy injector when the Pod is created. It adds a container and requires restarting the existing Pods.
    d:
      en: |
        An egress gateway controls traffic leaving the mesh. It does not encrypt or authenticate traffic between the workloads inside the namespace.
references:
  - title: "Overview"
    url: https://istio.io/latest/docs/ambient/overview/
  - title: "Add workloads to the mesh"
    url: https://istio.io/latest/docs/ambient/usage/add-workloads/
