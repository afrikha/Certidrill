id: kcsa-5a-reg-plain-http-registry
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To work around a certificate problem, an administrator configures the container runtime on every node to pull from `registry.example.com` over plain HTTP. Pulls still require a user name and a password. What is the main new risk?
body:
  options:
    - id: a
      text: { en: "The kubelet can no longer read the `imagePullSecrets` of the Pods" }
    - id: b
      text: { en: "Image layers are stored on the nodes without any compression" }
    - id: c
      text: { en: "Pods lose access to the Kubernetes API server through the same connection" }
    - id: d
      text: { en: "A network attacker can read the registry credentials and tamper with pulled images" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Without TLS, the registry credentials and the image content travel in clear text. An attacker on the network path can capture the credentials and serve modified content to the nodes. The Kubernetes documentation recommends encryption in transit with a chain of trust for software distribution, so the certificate problem should be fixed rather than bypassed.
  options:
    a:
      en: |
        The transport protocol to the registry does not change how the kubelet reads pull Secrets from the API server.
    b:
      en: |
        TLS has nothing to do with how image layers are stored on the node.
    c:
      en: |
        Pull traffic to the registry is separate from Pod traffic to the API server, which stays on TLS.
references:
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
