id: kcsa-5a-sbom-contents
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A customer asks Example Corp to deliver a software bill of materials (SBOM) with each container image it ships. What information does an SBOM provide?
body:
  options:
    - id: a
      text: { en: "A cryptographic signature that proves who built the image" }
    - id: b
      text: { en: "The list of system calls the containers are allowed to make" }
    - id: c
      text: { en: "The vulnerabilities that were exploited in the image at runtime" }
    - id: d
      text: { en: "An inventory of the components in the image, with versions and licenses" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An SBOM is a machine-readable inventory of the packages and libraries in a piece of software, with their versions, licensing information and relationships. Formats such as SPDX and CycloneDX standardize it so that tools can process it, for example to check license compliance or match components against vulnerability data.
  options:
    a:
      en: |
        Proof of origin comes from a signature (for example made with cosign) or from signed provenance, not from the SBOM itself.
    b:
      en: |
        Allowed system calls are defined by a seccomp profile, not by an SBOM.
    c:
      en: |
        An SBOM is produced at build time and describes contents. Runtime exploitation is detected by tools such as Falco.
references:
  - title: spdx/spdx-spec
    url: https://github.com/spdx/spdx-spec
  - title: CycloneDX
    url: https://owasp.org/www-project-cyclonedx/
