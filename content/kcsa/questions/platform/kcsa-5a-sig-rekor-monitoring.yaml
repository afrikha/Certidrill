id: kcsa-5a-sig-rekor-monitoring
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp signs its images with Sigstore keyless signing, using the OIDC identity of its CI workflow. The security team wants to find out if that identity is ever used to sign an artifact that the team did not expect. Which Sigstore component should the team monitor?
body:
  options:
    - id: a
      text: { en: "The Fulcio certificate authority's root certificate" }
    - id: b
      text: { en: "The Rekor transparency log" }
    - id: c
      text: { en: "The signatures that cosign attaches in the registry" }
    - id: d
      text: { en: "The OIDC provider's token signing keys" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Rekor is an append-only transparency log that records every signing event, including the certificate and the artifact digest. Because the record is public and tamper-evident, identity owners can monitor it to check that their identity is used only for signatures they expect.
  options:
    a:
      en: |
        The Fulcio root certificate is used to verify that signing certificates chain to Sigstore's root of trust. It does not list who signed what.
    c:
      en: |
        Signatures stored next to images show only artifacts in the registries the team watches. An attacker could sign and publish an artifact elsewhere; Rekor records the event wherever the artifact is stored.
    d:
      en: |
        The OIDC provider's keys prove that identity tokens are genuine. They do not keep a record of artifacts signed with those identities.
references:
  - title: Overview
    url: https://docs.sigstore.dev/about/overview/
