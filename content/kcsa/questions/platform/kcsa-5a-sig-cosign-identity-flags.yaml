id: kcsa-5a-sig-cosign-identity-flags
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A release job verifies an image with the command below before promoting it. What do the `--certificate-identity` and `--certificate-oidc-issuer` options add to the verification?

    ```bash
    cosign verify registry.example.com/shop/web@sha256:3f1c... \
      --certificate-identity=https://ci.example.com/shop/web/build \
      --certificate-oidc-issuer=https://ci.example.com
    ```
body:
  options:
    - id: a
      text: { en: "They tell cosign which registry account to use to download the signature" }
    - id: b
      text: { en: "They make cosign sign the image again with the CI pipeline's identity" }
    - id: c
      text: { en: "They accept the signature only if its certificate names that identity and issuer" }
    - id: d
      text: { en: "They make cosign scan the image for vulnerabilities before checking the signature" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A valid Sigstore signature only proves that someone with a Fulcio certificate signed the digest. These options make cosign also check that the certificate identity is the expected CI workflow and that the identity was issued by the expected OIDC issuer. Without that check, a signature made by any other identity would also be valid.
  options:
    a:
      en: |
        Registry credentials come from the local registry login, not from these options. They describe the expected signer, not the account used to pull.
    b:
      en: |
        `cosign verify` only verifies; signing is done with `cosign sign`.
    d:
      en: |
        Cosign does not scan images for vulnerabilities. Scanning is the job of a scanner such as Trivy.
references:
  - title: Verifying Signatures
    url: https://docs.sigstore.dev/cosign/verifying/verify/
  - title: Overview
    url: https://docs.sigstore.dev/about/overview/
