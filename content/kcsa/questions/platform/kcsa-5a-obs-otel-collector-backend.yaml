id: kcsa-5a-obs-otel-collector-backend
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp deploys the OpenTelemetry Collector and configures its applications to send traces to it. During an incident, the responders want to search the traces of the last 24 hours. Which component must still be added?
body:
  options:
    - id: a
      text: { en: "A Prometheus Pushgateway to store the traces" }
    - id: b
      text: { en: "A tracing back end to which the Collector exports" }
    - id: c
      text: { en: "A Fluent Bit sidecar in each Pod to turn traces into logs" }
    - id: d
      text: { en: "An audit policy that logs every request at `RequestResponse`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The OpenTelemetry Collector receives, processes and exports telemetry in a vendor-neutral way. It is not a storage or analysis system: it sends data to one or more open source or commercial back ends, where traces are stored and searched.
  options:
    a:
      en: |
        The Pushgateway lets short-lived jobs push metrics to Prometheus. It does not store traces.
    c:
      en: |
        Converting traces into logs loses their structure, and the logs would still need a back end. It does not solve the storage gap.
    d:
      en: |
        Audit logs cover Kubernetes API requests, not application traces.
references:
  - title: Collector
    url: https://opentelemetry.io/docs/collector/
