id: kcsa-5a-reg-kubelet-credential-provider
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Example Corp runs some static Pods whose images are in a private registry, and it does not want any long-lived registry password stored in Kubernetes Secrets. The nodes have a cloud identity that can obtain short-lived registry tokens. Which mechanism meets these requirements in Kubernetes v1.37?
body:
  options:
    - id: a
      text: { en: "Add the registry Secret to the `default` ServiceAccount of `kube-system`" }
    - id: b
      text: { en: "Configure a kubelet image credential provider plugin on each node" }
    - id: c
      text: { en: "Rely on the kubelet's built-in in-tree cloud registry credential integration" }
    - id: d
      text: { en: "Enable the `AlwaysPullImages` admission plugin on the API server" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The kubelet can call a credential provider plugin binary that fetches registry credentials dynamically, for example short-lived tokens from the node's cloud identity. It works for static Pods, which cannot reference Secrets or ServiceAccounts, and no static password is stored in a Secret.
  options:
    a:
      en: |
        Static Pods cannot reference ServiceAccounts or Secrets, and this option still stores a long-lived password in a Secret.
    c:
      en: |
        The built-in credential integrations for cloud registries were removed from the kubelet in v1.26. A credential provider plugin replaces them.
    d:
      en: |
        `AlwaysPullImages` forces a pull with valid credentials each time; it does not supply any credentials.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
