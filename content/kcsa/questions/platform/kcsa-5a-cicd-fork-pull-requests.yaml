id: kcsa-5a-cicd-fork-pull-requests
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp's public repository runs CI for every pull request, including pull requests from external forks. The same runners also hold the credentials that push release images to the production registry. What is the best way to reduce the risk?
body:
  options:
    - id: a
      text: { en: "Scan every pull request image for known vulnerabilities before pushing it" }
    - id: b
      text: { en: "Run fork pull requests on separate runners that have no release credentials" }
    - id: c
      text: { en: "Pin every base image used by the pipeline to a digest" }
    - id: d
      text: { en: "Sign the images built from fork pull requests with cosign" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Code in a fork pull request is untrusted and runs inside the pipeline. If it runs where release credentials are available, it can steal them or push images to production. Separate runners without those credentials, and with short-lived scoped credentials for the trusted release jobs, remove that path.
  options:
    a:
      en: |
        A scan finds known vulnerable packages. It does not stop malicious build steps from reading credentials on the runner.
    c:
      en: |
        Pinning base images protects against a changed dependency, not against untrusted code executed by the pipeline.
    d:
      en: |
        Signing images built from untrusted code would make them look trusted. Signing does not prevent credential theft.
references:
  - title: Producing artifacts
    url: https://slsa.dev/spec/v1.0/requirements
