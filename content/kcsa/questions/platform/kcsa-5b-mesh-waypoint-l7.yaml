id: kcsa-5b-mesh-waypoint-l7
objective: "5.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `payments` namespace is enrolled in Istio ambient mode, and only the ztunnel proxies are deployed. The security team now needs a policy that allows the `frontend` workload to send only `GET` requests to the `/orders` path of `payments-api`.

    What must be added to the mesh?
body:
  options:
    - id: a
      text: { en: "A waypoint proxy for the namespace or for the `payments-api` service" }
    - id: b
      text: { en: "A PeerAuthentication policy in `STRICT` mode for the namespace" }
    - id: c
      text: { en: "A NetworkPolicy that allows TCP port 8080 from the `frontend` Pods" }
    - id: d
      text: { en: "A second ztunnel proxy on each node, dedicated to HTTP traffic" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In ambient mode, ztunnel is intentionally limited to layers 3 and 4 (mTLS, authentication, L4 authorization, telemetry) and does not parse HTTP. Rules on HTTP methods and paths are layer 7 policies, which are enforced by a waypoint proxy, an Envoy proxy deployed separately from the application Pods.
  options:
    b:
      en: |
        `STRICT` mode only requires mTLS for incoming connections. It does not express which HTTP methods or paths a caller may use.
    c:
      en: |
        A NetworkPolicy works at layers 3 and 4 (IP addresses, ports). It cannot match an HTTP method or a URL path.
    d:
      en: |
        Ambient mode runs a single ztunnel per node, and ztunnel never processes HTTP. Layer 7 processing comes from waypoints, not from more ztunnel instances.
references:
  - title: "Overview"
    url: https://istio.io/latest/docs/ambient/overview/
  - title: "Ambient data plane"
    url: https://istio.io/latest/docs/ambient/architecture/data-plane/
