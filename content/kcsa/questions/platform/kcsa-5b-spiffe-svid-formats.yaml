id: kcsa-5b-spiffe-svid-formats
objective: "5.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two services authenticate each other with SPIFFE identities over a direct TLS connection. No layer 7 proxy or load balancer sits between them.

    Which SVID format should they use, and why?
body:
  options:
    - id: a
      text: { en: "JWT-SVID, because a token cannot be reused by someone who intercepts it" }
    - id: b
      text: { en: "JWT-SVID, because an X.509-SVID cannot be used to establish TLS connections" }
    - id: c
      text: { en: "X.509-SVID, because it is accepted in every trust domain without a trust bundle" }
    - id: d
      text: { en: "X.509-SVID, because it is the preferred format and a JWT-SVID can be replayed" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The X.509-SVID is the preferred SPIFFE format: it is a certificate that both sides can use for mutual TLS. A JWT-SVID is a bearer token that an attacker who intercepts it can replay to impersonate the workload, so SPIFFE recommends it only when an intermediary such as an L7 proxy prevents end-to-end TLS.
  options:
    a:
      en: |
        The opposite is true: a JWT-SVID is exposed to replay attacks if it is intercepted.
    b:
      en: |
        An X.509-SVID is a certificate designed precisely for TLS and mTLS between workloads.
    c:
      en: |
        An SVID is valid only if it is signed by an authority of its trust domain, which the peer checks with that domain's trust bundle. Other trust domains need federation to trust it.
references:
  - title: "SPIFFE Concepts"
    url: https://spiffe.io/docs/latest/spiffe-about/spiffe-concepts/
