id: kcsa-5a-sbom-cyclonedx-vex
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp wants a single bill of materials standard, backed by OWASP, that covers software components and can also express Vulnerability Exploitability eXchange (VEX) data, to state whether a known vulnerability actually affects a product. Which standard meets this requirement?
body:
  options:
    - id: a
      text: { en: "CycloneDX" }
    - id: b
      text: { en: "SPDX" }
    - id: c
      text: { en: "SLSA provenance" }
    - id: d
      text: { en: "in-toto layout" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CycloneDX is an OWASP full-stack bill of materials standard. Besides SBOMs it supports other BOM types and vulnerability data such as VEX and vulnerability disclosure reports, which suits security-oriented use.
  options:
    b:
      en: |
        SPDX is an SBOM format, but it is a Linux Foundation project, not an OWASP one, so it does not meet the stated requirement.
    c:
      en: |
        SLSA provenance describes how an artifact was built. It is not a bill of materials and carries no vulnerability exploitability data.
    d:
      en: |
        An in-toto layout defines the expected steps of a supply chain. It does not list components or vulnerability status.
references:
  - title: CycloneDX
    url: https://owasp.org/www-project-cyclonedx/
