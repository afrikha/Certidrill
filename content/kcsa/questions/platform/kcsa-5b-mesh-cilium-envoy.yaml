id: kcsa-5b-mesh-cilium-envoy
objective: "5.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster uses Cilium as its network plugin and for its service mesh features. Network-layer traffic is processed by eBPF programs in the Linux kernel.

    Where is HTTP-aware (layer 7) policy enforced for the Pods?
body:
  options:
    - id: a
      text: { en: "In an Envoy sidecar container injected into every Pod" }
    - id: b
      text: { en: "In an Envoy proxy that runs on each node and is shared by its Pods" }
    - id: c
      text: { en: "In kube-proxy, which filters HTTP requests with iptables rules" }
    - id: d
      text: { en: "In the kube-apiserver, through a validating admission webhook" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cilium handles layers 3 and 4 in the kernel with eBPF and sends application-layer protocols such as HTTP to an Envoy proxy. Cilium nodes deploy Envoy per node for HTTP policy enforcement and observability, so no proxy container is added to the Pods.
  options:
    a:
      en: |
        Cilium's service mesh does not inject sidecars. The sidecar model is the one of Istio sidecar mode or Linkerd.
    c:
      en: |
        kube-proxy implements Service virtual IPs at layer 4. It never parses HTTP requests, and Cilium can replace it entirely.
    d:
      en: |
        Admission webhooks check API objects when they are created or changed. They never see the network traffic between Pods.
references:
  - title: "L7-Aware Traffic Management"
    url: https://docs.cilium.io/en/stable/network/servicemesh/l7-traffic-management/
  - title: "Service Mesh"
    url: https://docs.cilium.io/en/stable/network/servicemesh/
