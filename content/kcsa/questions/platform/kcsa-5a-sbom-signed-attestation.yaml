id: kcsa-5a-sbom-signed-attestation
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp's pipeline generates an SBOM for each image and uploads it as a plain JSON file to a shared bucket. Consumers cannot tell whether a given SBOM really describes a given image or was edited later. What should the pipeline do instead?
body:
  options:
    - id: a
      text: { en: "Convert the SBOM from CycloneDX to SPDX before uploading it" }
    - id: b
      text: { en: "Generate the SBOM again each time the image is deployed" }
    - id: c
      text: { en: "Embed the SBOM as a label in the image's Dockerfile" }
    - id: d
      text: { en: "Attach the SBOM to the image digest as a signed attestation" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An attestation is a signed statement about an artifact, whose subject is identified by digest. Attaching the SBOM as a signed attestation (for example with `cosign attest`) binds it to that exact image and lets consumers verify who produced it and that it was not modified, and admission policies can require it.
  options:
    a:
      en: |
        Changing the format does not bind the document to an image or protect it from editing.
    b:
      en: |
        Regenerating at deployment time does not prove what was built in the pipeline, and the new file is no better protected than the old one.
    c:
      en: |
        A label written by the build is not signed separately and adds no verification; whoever can rebuild the image can change it.
references:
  - title: ImageValidatingPolicy
    url: https://kyverno.io/docs/policy-types/image-validating-policy/
  - title: Overview
    url: https://docs.sigstore.dev/about/overview/
