id: kcsa-5a-obs-traces-call-path
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp suspects that a compromised `frontend` service sends requests directly to the internal `ledger` service instead of going through `orders`. The team wants to see, for each request, the chain of services it crossed. Which signal and tool provide this?
body:
  options:
    - id: a
      text: { en: "Distributed traces collected with OpenTelemetry" }
    - id: b
      text: { en: "Kubernetes audit logs from the API server" }
    - id: c
      text: { en: "CPU and memory metrics scraped by Prometheus" }
    - id: d
      text: { en: "SBOMs generated for each service image" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A trace follows one request across services, showing every hop and its timing. OpenTelemetry instruments applications and collects traces (with metrics and logs), so an unexpected call path such as `frontend` to `ledger` becomes visible.
  options:
    b:
      en: |
        Audit logs record requests to the Kubernetes API server, not application traffic between services.
    c:
      en: |
        Resource metrics show how much each Pod consumes, not which service called which.
    d:
      en: |
        An SBOM lists the components of an image. It says nothing about runtime traffic.
references:
  - title: Signals
    url: https://opentelemetry.io/docs/concepts/signals/
