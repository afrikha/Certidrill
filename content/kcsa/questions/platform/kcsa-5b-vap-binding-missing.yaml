id: kcsa-5b-vap-binding-missing
objective: "5.7.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator creates a ValidatingAdmissionPolicy that rejects Deployments with more than 50 replicas. The API server accepts the policy object, but Deployments with 100 replicas are still created in every namespace.

    What is missing?
body:
  options:
    - id: a
      text: { en: "A ValidatingWebhookConfiguration that points to the policy" }
    - id: b
      text: { en: "The `failurePolicy: Fail` setting, which switches enforcement on" }
    - id: c
      text: { en: "A restart of the kube-apiserver so that it loads the CEL expressions" }
    - id: d
      text: { en: "A ValidatingAdmissionPolicyBinding that references the policy" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A ValidatingAdmissionPolicy has no effect on its own: at least one ValidatingAdmissionPolicyBinding must reference it. The binding sets the scope (for example which namespaces) and the `validationActions` (`Deny`, `Warn`, `Audit`).
  options:
    a:
      en: |
        ValidatingAdmissionPolicy is evaluated inside the API server with CEL. It needs no webhook configuration.
    b:
      en: |
        `failurePolicy` decides what happens when the policy is misconfigured or its CEL expression errors, and `Fail` is already the default. It does not activate the policy.
    c:
      en: |
        Policies and bindings are API objects that take effect without restarting the API server.
references:
  - title: "Validating Admission Policy"
    url: https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
