id: kcsa-5b-gatekeeper-template-rego
objective: "5.7.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In OPA Gatekeeper, which object contains the Rego code of a policy and the schema of its parameters?
body:
  options:
    - id: a
      text: { en: "The Constraint" }
    - id: b
      text: { en: "The ConstraintTemplate" }
    - id: c
      text: { en: "The ValidatingAdmissionPolicyBinding" }
    - id: d
      text: { en: "The Kyverno ClusterPolicy" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A ConstraintTemplate describes both the Rego that enforces the policy and the schema of the constraints built from it. The schema works like the arguments of a function, so administrators can tune each use of the template.
  options:
    a:
      en: |
        A Constraint uses a template: its `match` field says which resources it applies to and its `parameters` give the values, but it contains no Rego.
    c:
      en: |
        This object binds a built-in ValidatingAdmissionPolicy, whose rules are written in CEL, not Rego. It is not a Gatekeeper object.
    d:
      en: |
        Kyverno is a different policy engine whose policies are written in YAML and CEL, without Rego.
references:
  - title: "gatekeeper/website/docs/howto.md at master · open-policy-agent/gatekeeper · GitHub"
    url: https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/howto.md
