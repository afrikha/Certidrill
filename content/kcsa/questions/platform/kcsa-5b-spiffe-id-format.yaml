id: kcsa-5b-spiffe-id-format
objective: "5.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security engineer documents the workload identities that SPIRE issues in the trust domain `example.com`.

    Which value is a valid SPIFFE ID?
body:
  options:
    - id: a
      text: { en: "`system:serviceaccount:payments:api`" }
    - id: b
      text: { en: "`CN=api, O=payments`" }
    - id: c
      text: { en: "`spiffe://example.com/ns/payments/sa/api`" }
    - id: d
      text: { en: "`https://example.com/.well-known/payments/api`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A SPIFFE ID is a URI made of the `spiffe://` scheme, the trust domain and a path that identifies the workload. Here the trust domain is `example.com` and the path names the namespace and ServiceAccount of the workload.
  options:
    a:
      en: |
        This is the Kubernetes user name of a ServiceAccount, used by the API server to authorize requests made with its token. It is not a SPIFFE URI.
    b:
      en: |
        This is an X.509 subject, as used by Kubernetes client certificates (CN for the user, O for groups). A SPIFFE ID is a URI with the `spiffe` scheme.
    d:
      en: |
        An `https` URL is not a SPIFFE ID: the scheme must be `spiffe`, followed by the trust domain.
references:
  - title: "SPIFFE Concepts"
    url: https://spiffe.io/docs/latest/spiffe-about/spiffe-concepts/
