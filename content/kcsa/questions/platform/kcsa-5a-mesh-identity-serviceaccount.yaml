id: kcsa-5a-mesh-identity-serviceaccount
objective: "5.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a Kubernetes cluster that runs a service mesh such as Istio or Linkerd, each workload receives a certificate used for mutual TLS. On which Kubernetes attribute is the workload's identity in that certificate based?
body:
  options:
    - id: a
      text: { en: "The Pod's IP address" }
    - id: b
      text: { en: "The name of the node that runs the Pod" }
    - id: c
      text: { en: "The DNS name of the Service in front of the Pod" }
    - id: d
      text: { en: "The Pod's ServiceAccount" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On Kubernetes, Istio uses the service account as the workload's service identity, and Linkerd binds each proxy's certificate to the Pod's ServiceAccount. Authorization rules can then name a caller by identity, such as `cluster.local/ns/shop/sa/frontend`, rather than by address.
  options:
    a:
      en: |
        Pod IP addresses change when Pods are rescheduled and can be spoofed; an identity based on cryptography and the ServiceAccount avoids relying on them.
    b:
      en: |
        Many unrelated workloads share a node, so the node name cannot identify a single workload.
    c:
      en: |
        A Service selects a set of Pods for load balancing; it is not the identity in the workload certificate.
references:
  - title: Security
    url: https://istio.io/latest/docs/concepts/security/
  - title: Automatic mTLS
    url: https://linkerd.io/2-edge/features/automatic-mtls/
