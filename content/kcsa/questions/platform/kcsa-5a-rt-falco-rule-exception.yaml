id: kcsa-5a-rt-falco-rule-exception
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every night, a legitimate backup job in the `ops` namespace starts a shell in its container, and a default Falco rule raises an alert each time. The team wants to stop these expected alerts but keep the rule active for every other workload. What should the team do?
body:
  options:
    - id: a
      text: { en: "Lower the rule's priority to `DEBUG` so the alerts are less visible" }
    - id: b
      text: { en: "Disable the `syscall` event source on the nodes that run the job" }
    - id: c
      text: { en: "Delete the rule from the default rules file" }
    - id: d
      text: { en: "Add an exception to the rule that matches the backup job's container" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Falco rules accept an optional `exceptions` key that defines cases for which the rule does not generate an alert. An exception scoped to the backup job's container (for example by namespace and image) silences the expected behavior while the rule keeps detecting shells everywhere else.
  options:
    a:
      en: |
        Priority changes the severity of every alert from the rule, for all workloads, and the backup job still triggers it.
    b:
      en: |
        Disabling the `syscall` source stops all system call detection on those nodes, not only this rule.
    c:
      en: |
        Deleting the rule removes shell detection for every workload, which the team wants to keep.
references:
  - title: Basic Elements of Falco Rules
    url: https://falco.org/docs/concepts/rules/basic-elements/
