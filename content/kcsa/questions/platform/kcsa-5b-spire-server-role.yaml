id: kcsa-5b-spire-server-role
objective: "5.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a SPIRE deployment, which component acts as the signing authority of the trust domain and stores the registration entries that map SPIFFE IDs to selectors?
body:
  options:
    - id: a
      text: { en: "The SPIRE Server" }
    - id: b
      text: { en: "The SPIRE Agent on each node" }
    - id: c
      text: { en: "The trust bundle of the trust domain" }
    - id: d
      text: { en: "The SPIFFE Workload API" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The SPIRE Server is the signing authority for the identities of its trust domain. It stores registration entries and signing keys, attests nodes, and creates SVIDs when an authenticated agent requests them.
  options:
    b:
      en: |
        The agent runs on every node, attests the workloads that call it, caches their SVIDs and exposes the Workload API. It requests the SVIDs from the server; it is not the signing authority.
    c:
      en: |
        A trust bundle is the public key material (CA certificates or keys) that workloads use to verify SVIDs. It holds no registration entries.
    d:
      en: |
        The Workload API is the local interface through which a workload receives its SPIFFE ID, SVIDs and trust bundles. It is exposed by the agent.
references:
  - title: "SPIRE Concepts"
    url: https://spiffe.io/docs/latest/spire-about/spire-concepts/
