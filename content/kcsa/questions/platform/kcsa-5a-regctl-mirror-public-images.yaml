id: kcsa-5a-regctl-mirror-public-images
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp's Deployments pull base and third-party images directly from a public registry. The security team wants to scan these images before use and keep working if an upstream image is replaced or deleted. Which approach meets both goals?
body:
  options:
    - id: a
      text: { en: "Set `imagePullPolicy: Always` on every container that uses a public image" }
    - id: b
      text: { en: "Add the public registry's credentials to an `imagePullSecrets` entry" }
    - id: c
      text: { en: "Mirror the images into an internal registry, scan them there and pull only from it" }
    - id: d
      text: { en: "Reference the public images with the `latest` tag so updates arrive automatically" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Mirroring (or a proxy cache) copies public images into a registry the company controls. They are scanned before use, remain available if the upstream copy changes or disappears, and an admission policy can reject images from any other registry.
  options:
    a:
      en: |
        `Always` pulls whatever the public tag points to now. It increases the dependency on the upstream registry and adds no scanning.
    b:
      en: |
        Credentials only authenticate to the public registry. Images are still pulled unscanned from upstream.
    d:
      en: |
        `latest` makes deployments pull unknown, changing content from upstream, the opposite of the goal.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
