id: kcsa-5a-sig-keyless-benefit
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp signs images with a long-lived private key stored on its CI server. The team plans to move to Sigstore keyless signing. Which security benefit does keyless signing bring?
body:
  options:
    - id: a
      text: { en: "No long-lived private signing key has to be stored, protected and rotated" }
    - id: b
      text: { en: "Images are encrypted so that only authorized clusters can read their layers" }
    - id: c
      text: { en: "Images no longer need to be scanned for known vulnerabilities" }
    - id: d
      text: { en: "Signatures no longer need to be verified when Pods are admitted" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In keyless signing, the client generates a key pair for one signing, obtains a short-lived certificate from Fulcio tied to an OIDC identity, signs, records the event in Rekor and discards the private key. There is no long-lived key to steal, protect or rotate; trust is anchored in the signer's identity.
  options:
    b:
      en: |
        Signing proves who produced an artifact and that it was not modified. It does not encrypt the image.
    c:
      en: |
        A signature proves origin, not the absence of vulnerabilities. Scanning is still needed.
    d:
      en: |
        Signing is useless unless someone verifies the signature. Verification at admission is still required.
references:
  - title: Overview
    url: https://docs.sigstore.dev/about/overview/
