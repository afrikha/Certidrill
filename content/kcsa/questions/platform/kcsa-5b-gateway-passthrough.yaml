id: kcsa-5b-gateway-passthrough
objective: "5.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment service must terminate TLS itself, inside its Pods: its traffic must not be decrypted anywhere before it reaches them, and no other component may hold its private key. The shared Gateway must still route the connections by host name.

    Which Gateway API configuration meets these requirements?
body:
  options:
    - id: a
      text: { en: "A listener with protocol `TLS` and `tls.mode: Passthrough`, and a `TLSRoute` to the service" }
    - id: b
      text: { en: "A listener with protocol `HTTPS` and `tls.mode: Terminate`, and an `HTTPRoute` to the service" }
    - id: c
      text: { en: "An `HTTPS` listener that terminates TLS, and a `BackendTLSPolicy` attached to the service" }
    - id: d
      text: { en: "An `HTTPS` listener, and a `ReferenceGrant` that lets the Gateway use the service's TLS Secret" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In `Passthrough` mode the TLS session stays encrypted through the Gateway, and the listener's TLS settings do not apply: the backend terminates TLS with its own key. A `TLS` listener in `Passthrough` mode is used with a `TLSRoute`, which routes on the host name presented in the TLS handshake without decrypting the traffic.
  options:
    b:
      en: |
        `Terminate` (the default mode) decrypts traffic at the Gateway, which then needs a certificate and private key for the host. Both requirements fail.
    c:
      en: |
        The Gateway still decrypts the client connection before re-encrypting it to the backend, so the traffic is decrypted outside the Pods.
    d:
      en: |
        A `ReferenceGrant` allows the Gateway to use a Secret from another namespace. The Gateway would then hold the private key and decrypt the traffic.
references:
  - title: "TLS Configuration"
    url: https://gateway-api.sigs.k8s.io/guides/tls/
