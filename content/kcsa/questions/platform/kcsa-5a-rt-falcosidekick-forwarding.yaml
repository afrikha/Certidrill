id: kcsa-5a-rt-falcosidekick-forwarding
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Falco must deliver each alert to a chat channel, to the company's SIEM and to a serverless function that isolates the affected Pod. Which project of the Falco ecosystem is designed to forward Falco events to many such destinations?
body:
  options:
    - id: a
      text: { en: "Alertmanager" }
    - id: b
      text: { en: "Tetragon" }
    - id: c
      text: { en: "Falcosidekick" }
    - id: d
      text: { en: "Fluent Bit" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Falco writes alerts to its own outputs (stdout, a file, syslog, a program or an HTTP endpoint). Falcosidekick, a Falco ecosystem project, receives these events and forwards them to many applications and channels, such as chat tools, SIEMs and functions that automate the response.
  options:
    a:
      en: |
        Alertmanager routes the alerts generated by Prometheus rules. It is part of the Prometheus project, not the Falco ecosystem.
    b:
      en: |
        Tetragon is a separate eBPF observability and enforcement tool from the Cilium project. It does not forward Falco alerts.
    d:
      en: |
        Fluent Bit is a general-purpose log processor from the Fluentd project. It can ship logs, but it is not the Falco project built to fan out Falco events.
references:
  - title: The Falco Project
    url: https://falco.org/docs/
