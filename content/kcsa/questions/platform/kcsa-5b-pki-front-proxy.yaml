id: kcsa-5b-pki-front-proxy
objective: "5.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator reviews the certificate authorities of a kubeadm cluster. Which CA is needed only when the API server aggregation layer is used to serve extension API servers?
body:
  options:
    - id: a
      text: { en: "`kubernetes-ca`, the general cluster CA" }
    - id: b
      text: { en: "`etcd-ca`, the CA of etcd" }
    - id: c
      text: { en: "The ServiceAccount key pair (`sa.key` and `sa.pub`)" }
    - id: d
      text: { en: "`kubernetes-front-proxy-ca`, the front-proxy CA" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The front-proxy CA signs the `front-proxy-client` certificate, which the kube-apiserver presents (`--proxy-client-cert-file`) when it forwards requests to extension API servers. Front-proxy certificates are required only when the aggregation layer is used.
  options:
    a:
      en: |
        The cluster CA is always needed: it signs the API server serving certificate, the API server's kubelet client certificate and the client certificates of users and components.
    b:
      en: |
        The etcd CA is needed whenever the cluster stores its data in etcd with TLS: it signs the etcd server, peer and client certificates.
    c:
      en: |
        The ServiceAccount key pair is not a CA. It is used for ServiceAccount token management, in every cluster.
references:
  - title: "PKI certificates and requirements"
    url: https://kubernetes.io/docs/setup/best-practices/certificates/
