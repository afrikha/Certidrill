id: kcsa-5b-apiserver-proxy-plaintext
objective: "5.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An auditor reviews which control plane connections of a cluster with default settings are protected in transit, because part of the network between the control plane and the nodes is untrusted.

    Which connection is, by default, neither authenticated nor encrypted?
body:
  options:
    - id: a
      text: { en: "Kubelets connecting to the API server on its secure HTTPS port" }
    - id: b
      text: { en: "Pods calling the API server through the `kubernetes` Service" }
    - id: c
      text: { en: "The API server connecting to the kubelet for `kubectl logs`" }
    - id: d
      text: { en: "The API server connecting to a node, Pod or Service through its proxy" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Connections from the API server to a node, Pod or Service through the API server proxy use plain HTTP by default. They are neither authenticated nor encrypted and are not safe to run over untrusted or public networks.
  options:
    a:
      en: |
        Nodes reach the API server over HTTPS, and kubelets authenticate with client certificates.
    b:
      en: |
        The `kubernetes` Service leads to the API server's HTTPS endpoint, and Pods verify it with the root certificate injected with their ServiceAccount credentials.
    c:
      en: |
        This connection terminates at the kubelet's HTTPS endpoint, so it is encrypted. Its default weakness is that the API server does not verify the kubelet's serving certificate.
references:
  - title: "Communication between Nodes and the Control Plane"
    url: https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/
