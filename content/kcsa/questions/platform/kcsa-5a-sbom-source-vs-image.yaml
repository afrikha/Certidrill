id: kcsa-5a-sbom-source-vs-image
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Example Corp generates its SBOMs only from the dependency manifests in each application repository (for example `package.json`). A vulnerability is announced in a system library shipped in the Linux base image of several containers, but searching the SBOMs finds no affected image. What is the most likely reason?
body:
  options:
    - id: a
      text: { en: "SBOMs built from source manifests do not list the packages that the base image brings into the final image" }
    - id: b
      text: { en: "SBOMs in the SPDX format cannot record operating system packages, only application libraries" }
    - id: c
      text: { en: "An SBOM lists only the components that have known vulnerabilities at the time it is generated" }
    - id: d
      text: { en: "An SBOM must be signed before its component list can be searched for a library" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An SBOM describes the artifact it was generated from. One built from the application's dependency manifest lists the application libraries but not the operating system packages inherited from the base image. Generating the SBOM from the built image (or adding one for the base image) closes that gap.
  options:
    b:
      en: |
        SPDX describes software components in general, including system packages. The format is not the limitation.
    c:
      en: |
        An SBOM is an inventory of all components, vulnerable or not. That is what makes it reusable when new vulnerabilities are published.
    d:
      en: |
        A signature protects the integrity of the SBOM; it is not needed to read or search its contents.
references:
  - title: spdx/spdx-spec
    url: https://github.com/spdx/spdx-spec
  - title: CycloneDX
    url: https://owasp.org/www-project-cyclonedx/
