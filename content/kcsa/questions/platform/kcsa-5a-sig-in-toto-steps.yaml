id: kcsa-5a-sig-in-toto-steps
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp wants a consumer of its software to verify which steps of the supply chain were performed, who performed each step and in which order, from development to installation. Which CNCF graduated project is a framework and metadata standard for this?
body:
  options:
    - id: a
      text: { en: "CycloneDX" }
    - id: b
      text: { en: "in-toto" }
    - id: c
      text: { en: "Falco" }
    - id: d
      text: { en: "Harbor" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      in-toto is a framework for securing the integrity of software supply chains. Its metadata makes visible which steps were performed, by whom and in what order, so that the end user can verify the whole chain. in-toto is a CNCF graduated project, and its attestation format is used for statements such as SLSA provenance.
  options:
    a:
      en: |
        CycloneDX is a bill of materials format: it lists the components of an artifact, not the steps that produced it.
    c:
      en: |
        Falco detects suspicious behavior of running containers. It does not describe how software was built.
    d:
      en: |
        Harbor is a container registry that stores, scans and replicates images. It does not record the steps of the supply chain.
references:
  - title: in-toto
    url: https://in-toto.io/
