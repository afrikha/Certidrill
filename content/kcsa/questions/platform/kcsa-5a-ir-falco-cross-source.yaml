id: kcsa-5a-ir-falco-cross-source
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Falco on Example Corp's cluster has both the `syscall` source and the Kubernetes audit plugin enabled. An engineer wants one Falco rule that fires only when a `pods/exec` audit event is followed by a shell system call event in the same Pod. Why will this not work, and where should the correlation be done?
body:
  options:
    - id: a
      text: { en: "The audit plugin drops `pods/exec` events; correlate in the API server audit policy" }
    - id: b
      text: { en: "Rules that join sources need the kernel module driver; correlate after changing driver" }
    - id: c
      text: { en: "Falco rules apply to one source only; correlate the alerts in a SIEM or log back end" }
    - id: d
      text: { en: "Shell events lack Pod metadata; correlate by running Falco as a sidecar in each Pod" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each Falco event source runs separately and its rules match only its own events; Falco does not correlate events from different sources. Both kinds of alerts carry the namespace, Pod and time, so a SIEM or log back end that receives them can join them into one incident.
  options:
    a:
      en: |
        The audit plugin receives whatever the API server's audit policy sends, including `pods/exec`. The audit policy only selects and details events; it cannot correlate them with system calls.
    b:
      en: |
        The driver only captures system calls. No driver lets a rule combine events from different sources.
    d:
      en: |
        Falco enriches system call events with container and Kubernetes metadata such as the Pod and namespace. It runs per node, not as a sidecar.
references:
  - title: Event Sources
    url: https://falco.org/docs/concepts/event-sources/
