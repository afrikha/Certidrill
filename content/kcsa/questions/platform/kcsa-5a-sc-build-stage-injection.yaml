id: kcsa-5a-sc-build-stage-injection
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At Example Corp, the reviewed source code of the `shop` application in Git is unchanged. An attacker compromises a CI runner and modifies the compiled binary while the image is being produced, before it is pushed to the registry. Which stage of the software supply chain did the attacker compromise?
body:
  options:
    - id: a
      text: { en: "Source" }
    - id: b
      text: { en: "Build" }
    - id: c
      text: { en: "Artifacts (registry)" }
    - id: d
      text: { en: "Deployment" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The tampering happened while the CI system was producing the image, which is the build stage. SLSA lists "compromise build process" as a build threat: the source is clean, but the output does not match it. Isolated build platforms and signed provenance are the controls for this stage.
  options:
    a:
      en: |
        The source stage covers commits and declared dependencies. The stem says the reviewed code in Git is unchanged, so the source was not modified.
    c:
      en: |
        The artifacts stage covers images once they are stored in the registry, for example an image replaced or retagged there. Here the image was altered before it was pushed.
    d:
      en: |
        The deployment stage covers applying manifests to the cluster. The image was already malicious before anyone deployed it.
references:
  - title: "Threats & mitigations"
    url: https://slsa.dev/spec/v1.0/threats
