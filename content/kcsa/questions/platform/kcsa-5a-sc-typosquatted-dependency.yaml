id: kcsa-5a-sc-typosquatted-dependency
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer adds a dependency named `reqeusts` to a Python service. It is a typosquatted copy of a popular library and contains a credential stealer. The change was merged without anyone examining the dependency list. Which control at the source stage would most likely have stopped it?
body:
  options:
    - id: a
      text: { en: "Tag immutability rules on the production registry project" }
    - id: b
      text: { en: "Review, pinning and scanning of every dependency change" }
    - id: c
      text: { en: "A fresh, ephemeral runner for each build job" }
    - id: d
      text: { en: "The `AlwaysPullImages` admission plugin on the API server" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A malicious or typosquatted dependency enters through the source stage, when someone declares it. Reviewing dependency changes, pinning dependencies to vetted versions and scanning them catches a misspelled or unknown package before it is built into an image.
  options:
    a:
      en: |
        Immutable tags stop a tag from being overwritten in the registry. The malicious library would be built into a new, legitimately tagged image.
    c:
      en: |
        Ephemeral runners stop one build from affecting the next. The build would faithfully include the malicious dependency that was declared.
    d:
      en: |
        `AlwaysPullImages` forces image pulls with valid credentials. It does not inspect what an image contains.
references:
  - title: "Threats & mitigations"
    url: https://slsa.dev/spec/v1.0/threats
