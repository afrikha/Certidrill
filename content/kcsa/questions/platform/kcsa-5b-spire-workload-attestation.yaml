id: kcsa-5b-spire-workload-attestation
objective: "5.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod in the `payments` namespace, running with the `api` ServiceAccount, calls the SPIFFE Workload API exposed by the SPIRE Agent on its node. The Pod holds no secret or token issued for SPIRE.

    How does the agent decide which SVID to return?
body:
  options:
    - id: a
      text: { en: "It reads a bootstrap token that an administrator stored in a Secret of the Pod's namespace" }
    - id: b
      text: { en: "It checks the calling process with the kernel and the local kubelet, then matches it to registration entries" }
    - id: c
      text: { en: "It returns its own node SVID to every process on the node, since node attestation already succeeded" }
    - id: d
      text: { en: "It sends the Pod's ServiceAccount token to the kube-apiserver, which signs the SVID" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      This is workload attestation: the SPIRE Agent asks local authorities, such as the node's kernel and the kubelet, about the calling process, and compares the result (for example its namespace and ServiceAccount) with the selectors of registration entries. If an entry matches, the agent returns the SVID for that SPIFFE ID. No secret has to be deployed with the application.
  options:
    a:
      en: |
        The Workload API is designed so that callers need no pre-existing secret or token. The identity comes from what the platform can attest about the process.
    c:
      en: |
        The node's identity, obtained through node attestation, is the parent of the workload identities. Each workload receives its own SVID after workload attestation.
    d:
      en: |
        The kube-apiserver does not sign SVIDs. The SPIRE Server is the signing authority of the trust domain.
references:
  - title: "SPIRE Concepts"
    url: https://spiffe.io/docs/latest/spire-about/spire-concepts/
