id: kcsa-5b-webhook-matchconditions
objective: "5.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A validating admission webhook checks Pods in every namespace. To reduce load and latency, it must not be called for requests sent by kubelets (users in the group `system:nodes`), whatever the namespace or labels of the Pod.

    Which field of the webhook configuration can express this condition?
body:
  options:
    - id: a
      text: { en: "`objectSelector`" }
    - id: b
      text: { en: "`namespaceSelector`" }
    - id: c
      text: { en: "`matchConditions`" }
    - id: d
      text: { en: "`rules`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `matchConditions` are CEL expressions evaluated on the admission request, including the requesting user's groups. All of them must be true for the webhook to be called, so a condition that excludes `system:nodes` skips those requests and reduces the number of calls.
  options:
    a:
      en: |
        `objectSelector` matches the labels of the object, not the identity of the user who sends the request.
    b:
      en: |
        `namespaceSelector` matches the labels of the object's namespace. It cannot tell kubelet requests apart.
    d:
      en: |
        `rules` select API groups, versions, resources and operations. They do not consider who makes the request.
references:
  - title: "Dynamic Admission Control"
    url: https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
