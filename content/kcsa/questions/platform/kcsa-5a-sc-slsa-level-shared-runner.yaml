id: kcsa-5a-sc-slsa-level-shared-runner
objective: "5.1.1"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Example Corp builds its images on a hosted build platform. The platform's control plane generates provenance for each image and signs it, and consumers verify that signature. However, all builds of a project reuse the same long-lived runner, and the user-defined build steps can read the provenance signing key. What is the highest SLSA Build level these builds meet?
body:
  options:
    - id: a
      text: { en: "Build L0" }
    - id: b
      text: { en: "Build L1" }
    - id: c
      text: { en: "Build L2" }
    - id: d
      text: { en: "Build L3" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Build L2 requires a hosted build platform that generates and signs the provenance, which these builds have. Build L3 additionally requires hardened builds: one run must not be able to influence another, and the signing secret must be out of reach of user-defined build steps. Both L3 conditions fail here, so the builds stop at L2.
  options:
    a:
      en: |
        Build L0 means no SLSA guarantees at all. These builds produce and sign provenance, which is more than L0.
    b:
      en: |
        Build L1 only requires that provenance exists and is distributed. These builds also meet L2, because a hosted platform signs the provenance.
    d:
      en: |
        Build L3 requires isolation between runs and a signing key that build steps cannot access. A shared long-lived runner and a readable signing key both fail that level.
references:
  - title: Security levels
    url: https://slsa.dev/spec/v1.0/levels
  - title: Producing artifacts
    url: https://slsa.dev/spec/v1.0/requirements
