id: kcsa-5a-pull-default-always
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Four Pods are created, each with one container and no `imagePullPolicy` field. Which image reference gets the `Always` pull policy by default?
body:
  options:
    - id: a
      text: { en: "`registry.example.com/shop/web:2.3.1`" }
    - id: b
      text: { en: "`registry.example.com/shop/web@sha256:9d2b6f0c...`" }
    - id: c
      text: { en: "`registry.example.com/shop/web:2.3.1@sha256:9d2b6f0c...`" }
    - id: d
      text: { en: "`registry.example.com/shop/web`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When `imagePullPolicy` is omitted, Kubernetes sets `Always` if the image has no tag and no digest (which means `:latest`) or uses the `:latest` tag. Any other tag, or a digest, gets `IfNotPresent`.
  options:
    a:
      en: |
        A tag other than `latest` defaults to `IfNotPresent`.
    b:
      en: |
        A reference by digest defaults to `IfNotPresent`: the digest always designates the same content, so a cached copy is valid.
    c:
      en: |
        With both a tag and a digest, the digest is used and the default is `IfNotPresent`.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
