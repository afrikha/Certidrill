id: kcsa-5b-kyverno-yaml
objective: "5.7.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team wants an admission policy engine whose policies are Kubernetes resources written in YAML, with CEL expressions where needed, so that the team does not have to learn Rego.

    Which project fits this requirement?
body:
  options:
    - id: a
      text: { en: "OPA Gatekeeper" }
    - id: b
      text: { en: "Falco" }
    - id: c
      text: { en: "Kyverno" }
    - id: d
      text: { en: "kube-bench" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kyverno policies are declarative Kubernetes resources written in YAML and CEL, with no new language to learn. Kyverno enforces them as an admission controller and can also mutate, generate and clean up resources and verify images.
  options:
    a:
      en: |
        Gatekeeper is an admission policy engine too, but its policy logic is written in Rego inside ConstraintTemplates.
    b:
      en: |
        Falco detects suspicious behavior at runtime from system calls and audit events. It is not an admission policy engine.
    d:
      en: |
        kube-bench checks a cluster's configuration against the CIS Kubernetes Benchmark. It does not admit or reject API requests.
references:
  - title: "Introduction"
    url: https://kyverno.io/docs/introduction/
