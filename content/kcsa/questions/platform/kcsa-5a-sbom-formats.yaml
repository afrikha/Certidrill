id: kcsa-5a-sbom-formats
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A supplier must deliver an SBOM with each image it sells to Example Corp, in a standard format. Which pair consists of two SBOM formats?
body:
  options:
    - id: a
      text: { en: "SLSA and in-toto" }
    - id: b
      text: { en: "OCI and CRI" }
    - id: c
      text: { en: "SPDX and CycloneDX" }
    - id: d
      text: { en: "Rekor and Fulcio" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SPDX (System Package Data Exchange, a Linux Foundation project) and CycloneDX (an OWASP standard) are the two common SBOM formats. Both describe the components of software in a machine-readable form; tools such as Syft or Trivy can produce either.
  options:
    a:
      en: |
        SLSA is a framework of supply chain security levels, and in-toto is a framework for supply chain attestations. Neither is an SBOM format.
    b:
      en: |
        OCI defines image and runtime formats, and CRI is the interface between the kubelet and container runtimes. They do not describe software components.
    d:
      en: |
        Rekor (transparency log) and Fulcio (certificate authority) are Sigstore services for signing, not SBOM formats.
references:
  - title: spdx/spdx-spec
    url: https://github.com/spdx/spdx-spec
  - title: CycloneDX
    url: https://owasp.org/www-project-cyclonedx/
