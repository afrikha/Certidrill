id: kcsa-5b-mutation-final-state
objective: "5.7.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A mutating admission webhook sets `allowPrivilegeEscalation: false` on every container of new Pods. Other teams have since added their own mutating webhooks, and a security review requires a guarantee that every admitted Pod still carries this setting.

    What should be added?
body:
  options:
    - id: a
      text: { en: "Validating admission, such as a ValidatingAdmissionPolicy, that rejects Pods without the setting" }
    - id: b
      text: { en: "`reinvocationPolicy: IfNeeded` on the security webhook so that it always has the last word" }
    - id: c
      text: { en: "A higher priority value on the security webhook so that it runs after the other mutating webhooks" }
    - id: d
      text: { en: "`sideEffects: None` on every mutating webhook of the cluster" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Mutating webhooks run to completion before any validating admission, but there is no stable order between them, so another webhook can overwrite the setting. A validating controller (a ValidatingAdmissionPolicy or a validating webhook) sees the final object and rejects any Pod that lost the setting, which guarantees the result.
  options:
    b:
      en: |
        `IfNeeded` may call the webhook again if other plugins modified the object afterwards, but it does not guarantee the final state. Kubernetes recommends a validating check for that.
    c:
      en: |
        Webhook configurations have no priority field that orders mutating webhooks; the order of mutations is not something to rely on.
    d:
      en: |
        `sideEffects` declares whether a webhook has side effects outside the AdmissionReview, for dry-run requests. It does not protect a mutation from being overwritten.
references:
  - title: "Admission Webhook Good Practices"
    url: https://kubernetes.io/docs/concepts/cluster-administration/admission-webhooks-good-practices/
  - title: "Dynamic Admission Control"
    url: https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
