id: kcsa-5b-egress-gateway-source-ip
objective: "5.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Pods of the `payments` namespace call a partner API. The partner's firewall accepts connections only from a short list of source IP addresses registered in advance. The cluster uses Cilium, its nodes are autoscaled, and Pod IP addresses change.

    Which solution meets the partner's requirement?
body:
  options:
    - id: a
      text: { en: "An egress NetworkPolicy with an `ipBlock` that contains the CIDR of the partner API" }
    - id: b
      text: { en: "A `LoadBalancer` Service with a reserved static IP address in front of the `payments` Pods" }
    - id: c
      text: { en: "A `CiliumEgressGatewayPolicy` that sends this traffic through gateway nodes with predictable egress IPs" }
    - id: d
      text: { en: "`hostNetwork: true` on the `payments` Pods so that they use the IP addresses of their nodes" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Cilium's egress gateway routes connections from selected Pods to selected destination CIDRs through gateway nodes, where they are masqueraded with selected, predictable IP addresses. The partner can then allow those few addresses, whatever the Pod IPs and the number of nodes.
  options:
    a:
      en: |
        An `ipBlock` decides which destinations the Pods may reach. It does not change the source address that the partner's firewall sees.
    b:
      en: |
        A `LoadBalancer` Service gives a stable address to inbound traffic towards the Pods. Outbound connections from the Pods do not use it as their source address.
    d:
      en: |
        Node addresses change when nodes are autoscaled, and `hostNetwork` removes the Pod's network isolation, which the Baseline Pod Security Standard forbids.
references:
  - title: "Egress Gateway"
    url: https://docs.cilium.io/en/stable/network/egress-gateway/egress-gateway/
