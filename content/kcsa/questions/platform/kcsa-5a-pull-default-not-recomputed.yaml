id: kcsa-5a-pull-default-not-recomputed
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Deployment was created with the image `registry.example.com/shop/web:2.3.1` and no `imagePullPolicy` field. Later, an operator changes only the image to `registry.example.com/shop/web:latest`. Which pull policy do the new Pods use?
body:
  options:
    - id: a
      text: { en: "`Always`, because the image now uses the `latest` tag" }
    - id: b
      text: { en: "`IfNotPresent`, the value set when the Deployment was created" }
    - id: c
      text: { en: "`Never`, because the policy cannot change after creation" }
    - id: d
      text: { en: "No policy; the kubelet decides at each container start" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The default pull policy is set once, when the object is created, and stored in the Pod template. Changing the tag to `latest` later does not update it, so the Pods keep `IfNotPresent` and a node with an old `latest` image cached runs that old image. To force a pull, set `imagePullPolicy: Always` explicitly.
  options:
    a:
      en: |
        `latest` gets `Always` only when the field is empty at creation. Here the field already holds `IfNotPresent`.
    c:
      en: |
        `Never` is applied only when someone sets it explicitly. The policy itself can still be edited; it just is not recomputed automatically.
    d:
      en: |
        The field is always filled in at creation; the kubelet applies the stored value rather than choosing one.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
