id: kcsa-5a-pull-always-layer-cache
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operator hesitates to set `imagePullPolicy: Always` on a large image because the node would "download the whole image at every container start". What actually happens when a container with `Always` starts on a node that already ran this image?
body:
  options:
    - id: a
      text: { en: "The kubelet skips the registry because the image is already on the node" }
    - id: b
      text: { en: "The kubelet deletes the cached image and downloads every layer again" }
    - id: c
      text: { en: "The kubelet compares the cached image with its SBOM before starting it" }
    - id: d
      text: { en: "The runtime resolves the tag to a digest and downloads only uncached layers" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With `Always`, the kubelet asks the container runtime to pull each time a container starts. The runtime contacts the registry, resolves the name or tag to a digest, and downloads only the layers it does not have. The registry check also requires valid credentials each time.
  options:
    a:
      en: |
        Skipping the registry when the image is present is the `IfNotPresent` behavior, not `Always`.
    b:
      en: |
        Cached layers are reused; only missing layers are downloaded.
    c:
      en: |
        The kubelet does not read SBOMs. Pull decisions depend only on the pull policy and the registry's answer.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
