id: kcsa-5b-mesh-node-proxy-blast
objective: "5.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp compares a sidecar service mesh with Istio ambient mode, in which one ztunnel proxy per node holds the mTLS certificates of the workloads running on that node. An attacker fully compromises the ztunnel proxy of one node.

    Compared with the compromise of a single sidecar proxy, what is the impact?
body:
  options:
    - id: a
      text: { en: "Only one Pod is affected, exactly as with a compromised sidecar proxy" }
    - id: b
      text: { en: "Every workload of the mesh is affected, because ztunnel uses its own identity for all mTLS connections" }
    - id: c
      text: { en: "No workload is affected, because ztunnel never holds the private keys of workloads" }
    - id: d
      text: { en: "The workloads running on that node are affected, but not the identities of workloads on other nodes" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A node-level proxy serves every mesh workload on its node and holds their certificates, so its compromise affects all of them, while a sidecar only exposes its own Pod. Istio limits the damage: the CA rejects ztunnel requests for identities that are not running on that node, and ztunnel's own identity is never used for mTLS between workloads, so one compromised node does not compromise the whole mesh.
  options:
    a:
      en: |
        That is the blast radius of a sidecar. A ztunnel proxy is shared by all mesh workloads of its node, so more than one Pod is exposed.
    b:
      en: |
        Istio documents the opposite: ztunnel's own identity is never used for workload-to-workload mTLS, and it can only obtain certificates for workloads scheduled on its node.
    c:
      en: |
        ztunnel performs mTLS on behalf of the workloads of its node, so it holds their certificates and keys. A compromise does expose those identities.
references:
  - title: "Ambient data plane"
    url: https://istio.io/latest/docs/ambient/architecture/data-plane/
