id: kcsa-5a-ir-exec-audit-identity
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Falco reports the alert below. The responders need to know which Kubernetes user or ServiceAccount opened this shell. Where should they look?

    ```text
    10:02:14 Warning A shell was spawned in a container with an attached terminal (user=root container_name=web k8s.ns=shop k8s.pod=web-7d9f8 shell=bash)
    ```
body:
  options:
    - id: a
      text: { en: "The `user=root` field of the Falco alert itself" }
    - id: b
      text: { en: "API server audit events for the `exec` subresource of that Pod just before 10:02:14" }
    - id: c
      text: { en: "The logs of the `web` container, shown by `kubectl logs`" }
    - id: d
      text: { en: "The `serviceAccountName` field of the `web-7d9f8` Pod spec" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An interactive shell opened with `kubectl exec` is an API request on the Pod's `exec` subresource, which the audit log records with the requesting user, the source IP and the time. Joining the Falco alert with that audit event by namespace, Pod and time identifies who opened the shell.
  options:
    a:
      en: |
        `user=root` is the Linux user inside the container. It says nothing about the Kubernetes identity that called the API.
    c:
      en: |
        Container logs contain what the application writes to stdout and stderr, not who called the Kubernetes API.
    d:
      en: |
        `serviceAccountName` is the identity the Pod itself runs with, not the identity of the person or tool that opened the shell.
references:
  - title: Auditing
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - title: The Falco Project
    url: https://falco.org/docs/
