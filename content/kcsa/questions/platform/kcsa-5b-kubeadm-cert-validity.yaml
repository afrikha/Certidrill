id: kcsa-5b-kubeadm-cert-validity
objective: "5.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A kubeadm cluster was created 13 months ago and has never been upgraded. Nobody has run any certificate command on it. Today, `kubectl` with `admin.conf` fails with certificate expiry errors, and the control plane components can no longer authenticate.

    What explains this outage?
body:
  options:
    - id: a
      text: { en: "kubeadm leaf certificates are valid for one year and are renewed only by control plane upgrades or `kubeadm certs renew`" }
    - id: b
      text: { en: "kubeadm CA certificates are valid for one year and must be replaced by a manual CA rotation every year" }
    - id: c
      text: { en: "Kubelet client certificate rotation is disabled by default, so the API server rejected every node after one year" }
    - id: d
      text: { en: "CertificateSigningRequest objects are deleted after one year, which invalidates the certificates they issued" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Certificates generated by kubeadm (API server, etcd, front proxy and the client certificates in `admin.conf`, `controller-manager.conf`, `scheduler.conf`) expire after one year. kubeadm renews them automatically during a control plane upgrade, or on demand with `kubeadm certs renew`, after which the control plane Pods must be restarted. A cluster that is never upgraded or renewed hits this expiry.
  options:
    b:
      en: |
        kubeadm CA certificates are valid for 10 years by default. The expired certificates are the one-year leaf certificates.
    c:
      en: |
        kubeadm configures the kubelet for automatic client certificate rotation. In any case, kubelet certificates do not explain why `admin.conf` and the control plane components fail.
    d:
      en: |
        CSR objects are garbage-collected after hours, not years, and deleting a CSR object has no effect on a certificate already issued.
references:
  - title: "Certificate Management with kubeadm"
    url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
