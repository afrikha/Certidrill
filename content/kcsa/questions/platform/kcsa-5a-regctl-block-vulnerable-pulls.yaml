id: kcsa-5a-regctl-block-vulnerable-pulls
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp's Harbor registry scans every image. The security team wants the registry itself to stop clusters from deploying images whose scan shows critical vulnerabilities, whatever namespace or cluster requests them. Which registry feature provides this?
body:
  options:
    - id: a
      text: { en: "A project policy that prevents vulnerable images from being pulled and deployed" }
    - id: b
      text: { en: "A tag immutability rule that matches every tag of the project" }
    - id: c
      text: { en: "A replication rule that copies the images to a second registry" }
    - id: d
      text: { en: "A proxy cache project in front of the public registry" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Besides scanning, Harbor can apply policy checks to a project so that images with vulnerabilities at or above a chosen severity are not served for deployment. The control sits in the registry, so it applies to every client that pulls from that project.
  options:
    b:
      en: |
        Tag immutability keeps a tag pointing at the same artifact. It does not consider scan results.
    c:
      en: |
        Replication copies images, vulnerable or not, to another registry.
    d:
      en: |
        A proxy cache serves and caches images from an upstream registry; by itself it does not block vulnerable images.
references:
  - title: goharbor/harbor
    url: https://github.com/goharbor/harbor
