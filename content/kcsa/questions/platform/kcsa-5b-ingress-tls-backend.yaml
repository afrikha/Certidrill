id: kcsa-5b-ingress-tls-backend
objective: "5.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `shop` Ingress terminates HTTPS for `shop.example.com` with a certificate stored in a TLS Secret and routes requests to the `web` Service on port 8080. A compliance requirement states that customer traffic must stay encrypted all the way to the Pods.

    Which statement is correct?
body:
  options:
    - id: a
      text: { en: "The requirement is met, because the Ingress TLS settings also encrypt traffic from the controller to the Pods" }
    - id: b
      text: { en: "The requirement is met, because traffic sent to a `ClusterIP` Service is encrypted by kube-proxy" }
    - id: c
      text: { en: "The requirement is not met: TLS ends at the Ingress, so backend TLS, TLS passthrough or mesh mTLS is needed" }
    - id: d
      text: { en: "The requirement is not met: a NetworkPolicy must allow only the Ingress controller to reach the Pods" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Ingress API assumes TLS termination at the ingress point: traffic from the controller to the Service and its Pods is plaintext. To encrypt the rest of the path, the controller must re-encrypt to a TLS backend, pass TLS through to the Pods (for example a Gateway listener in `Passthrough` mode), or the cluster must use a service mesh with mTLS.
  options:
    a:
      en: |
        The `tls` section of an Ingress configures only the client-facing connection. The connection to the backend is not covered by it.
    b:
      en: |
        kube-proxy implements Service virtual IPs by forwarding packets; it never encrypts traffic.
    d:
      en: |
        Restricting who may connect to the Pods is good practice, but a NetworkPolicy does not encrypt anything, so the requirement is still not met.
references:
  - title: "Ingress"
    url: https://kubernetes.io/docs/concepts/services-networking/ingress/
