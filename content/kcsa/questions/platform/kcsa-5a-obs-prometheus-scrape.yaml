id: kcsa-5a-obs-prometheus-scrape
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The security team wants an alert when the CPU usage of Pods in the `shop` namespace suddenly jumps, a common sign of cryptomining. Which CNCF graduated project scrapes metrics from HTTP endpoints, stores them as time series and evaluates alerting rules on them?
body:
  options:
    - id: a
      text: { en: "Fluent Bit" }
    - id: b
      text: { en: "Prometheus" }
    - id: c
      text: { en: "Falco" }
    - id: d
      text: { en: "in-toto" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Prometheus pulls metrics by scraping instrumented targets over HTTP, stores them as labeled time series queried with PromQL, and evaluates rules that generate alerts, which Alertmanager then routes. A sustained CPU spike is a typical metrics-based signal.
  options:
    a:
      en: |
        Fluent Bit collects and forwards logs. It is not a time series database and does not evaluate alerting rules on metrics.
    c:
      en: |
        Falco detects suspicious behavior from system calls and other event sources. It does not store CPU metrics.
    d:
      en: |
        in-toto is a supply chain attestation framework, unrelated to runtime metrics.
references:
  - title: Overview
    url: https://prometheus.io/docs/introduction/overview/
