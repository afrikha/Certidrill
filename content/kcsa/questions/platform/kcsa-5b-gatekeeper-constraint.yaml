id: kcsa-5b-gatekeeper-constraint
objective: "5.7.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `K8sRequiredLabels` ConstraintTemplate is installed in a cluster that runs OPA Gatekeeper, and the template is ready. Namespaces without an `owner` label are still created.

    What must the team create to enforce the rule?
body:
  options:
    - id: a
      text: { en: "A Kyverno policy that calls the `K8sRequiredLabels` template for each Namespace" }
    - id: b
      text: { en: "A second ConstraintTemplate that sets `enforcementAction: deny` for Namespaces" }
    - id: c
      text: { en: "A RoleBinding that grants the Gatekeeper ServiceAccount `create` on Namespaces" }
    - id: d
      text: { en: "A `K8sRequiredLabels` Constraint that matches Namespaces, with `owner` as a parameter" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A ConstraintTemplate only defines a policy type. Gatekeeper enforces it when a Constraint of that kind exists: `match` defines the resources it applies to (here Namespaces) and `parameters` give the required labels. Without `enforcementAction`, a Constraint denies violating requests.
  options:
    a:
      en: |
        Kyverno is a separate policy engine and cannot use Gatekeeper templates.
    b:
      en: |
        `enforcementAction` is a field of the Constraint, and `deny` is already its default. A second template still defines no Constraint.
    c:
      en: |
        Gatekeeper evaluates requests as an admission webhook; it does not need to create Namespaces. Without a Constraint, nothing is enforced.
references:
  - title: "gatekeeper/website/docs/howto.md at master · open-policy-agent/gatekeeper · GitHub"
    url: https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/howto.md
