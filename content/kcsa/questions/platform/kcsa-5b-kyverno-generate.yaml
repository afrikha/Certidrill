id: kcsa-5b-kyverno-generate
objective: "5.7.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every new namespace of the cluster must automatically receive a default-deny NetworkPolicy, without any manual step by the namespace owner.

    Which policy feature does this?
body:
  options:
    - id: a
      text: { en: "A Kyverno policy with a generate rule" }
    - id: b
      text: { en: "An OPA Gatekeeper Constraint with `enforcementAction: deny`" }
    - id: c
      text: { en: "A ValidatingAdmissionPolicy bound to Namespace objects" }
    - id: d
      text: { en: "The `restricted` Pod Security Admission level on every namespace" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Besides validating and mutating resources, Kyverno can generate resources. A generate rule triggered by the creation of a Namespace creates the default-deny NetworkPolicy in it, so every new namespace starts isolated.
  options:
    b:
      en: |
        A Gatekeeper Constraint could reject namespaces that break a rule, but it does not create a NetworkPolicy for them.
    c:
      en: |
        A ValidatingAdmissionPolicy only accepts, warns or rejects requests. It cannot create other objects.
    d:
      en: |
        Pod Security Admission checks Pods against the Pod Security Standards. It does not create NetworkPolicies.
references:
  - title: "Introduction"
    url: https://kyverno.io/docs/introduction/
