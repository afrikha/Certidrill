id: kcsa-5a-mesh-linkerd-trust-anchor
objective: "5.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp installed Linkerd a year ago with the default certificates generated by `linkerd install`, and nobody has rotated any certificate since. Meshed workloads use automatic mutual TLS. Which statement about certificate rotation is correct?
body:
  options:
    - id: a
      text: { en: "The trust anchor and issuer need rotation; proxy certificates renew automatically" }
    - id: b
      text: { en: "Proxy certificates need manual rotation; the trust anchor renews automatically" }
    - id: c
      text: { en: "No rotation is needed; Linkerd renews every certificate in the mesh automatically" }
    - id: d
      text: { en: "Only the ServiceAccount tokens of meshed Pods need to be rotated by hand" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Linkerd's identity component issues proxy certificates that expire after 24 hours and are renewed automatically. The default trust anchor and issuer certificates created by `linkerd install` expire after one year and must be rotated, manually or with a tool such as cert-manager, or mTLS between proxies breaks.
  options:
    b:
      en: |
        It is the other way around: short-lived proxy certificates rotate automatically, while the trust anchor does not.
    c:
      en: |
        The trust anchor and issuer are not rotated by Linkerd itself; leaving them to expire causes an outage.
    d:
      en: |
        Proxies derive their identity from bound ServiceAccount tokens, which Kubernetes rotates; the certificates that need attention are the trust anchor and issuer.
references:
  - title: Automatic mTLS
    url: https://linkerd.io/2-edge/features/automatic-mtls/
