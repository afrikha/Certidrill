id: kcsa-5b-port-forward-admin
objective: "5.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator occasionally needs to query the `postgres` database Pod of the `payments` namespace from a laptop. The database Service is of type `ClusterIP`, and the security team does not want the database to be reachable from outside the cluster.

    Which approach meets this requirement?
body:
  options:
    - id: a
      text: { en: "Change the Service to type `NodePort` and connect to the port on any node" }
    - id: b
      text: { en: "Add a `hostPort` to the database container and connect to its node" }
    - id: c
      text: { en: "Use `kubectl port-forward`, which tunnels through the API server and the kubelet" }
    - id: d
      text: { en: "Change the Service to type `LoadBalancer`, limited to the administrator's IP address" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `kubectl port-forward` sends the connection through the API server, which authenticates and authorizes the administrator, and then to the kubelet's HTTPS endpoint, which provides the port-forwarding. Nothing new is exposed, and only users allowed to port-forward to Pods in `payments` can use it.
  options:
    a:
      en: |
        A `NodePort` opens the database port on every node, to anyone who can reach a node.
    b:
      en: |
        A `hostPort` exposes the database on the node's address, and the Baseline Pod Security Standard restricts host ports for this reason.
    d:
      en: |
        A `LoadBalancer` makes the database reachable from outside the cluster, which the security team forbids, even with a source address filter.
references:
  - title: "Communication between Nodes and the Control Plane"
    url: https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/
