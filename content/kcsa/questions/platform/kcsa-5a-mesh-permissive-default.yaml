id: kcsa-5a-mesh-permissive-default
objective: "5.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Istio is installed, and every Pod of the `payments` namespace has a sidecar. No `PeerAuthentication` resource exists anywhere in the mesh. A Pod without a sidecar in the `legacy` namespace sends a plaintext HTTP request to `payments-api`, and no NetworkPolicy blocks it. What happens?
body:
  options:
    - id: a
      text: { en: "The request is rejected, because sidecars accept only mutual TLS by default" }
    - id: b
      text: { en: "The request is accepted, because the effective default mode is `PERMISSIVE`" }
    - id: c
      text: { en: "The request is accepted only if an `AuthorizationPolicy` names the `legacy` namespace" }
    - id: d
      text: { en: "The request is rejected, because Istio creates a NetworkPolicy for each sidecar" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When no `PeerAuthentication` sets a mode, the mesh-wide default is `PERMISSIVE`: workloads accept both mutual TLS and plaintext, which eases migration. To refuse plaintext, the team must apply a `PeerAuthentication` with mode `STRICT` to the mesh, the namespace or the workload.
  options:
    a:
      en: |
        Only `STRICT` mode rejects plaintext, and it must be configured. The default is `PERMISSIVE`.
    c:
      en: |
        A workload with no `AuthorizationPolicy` accepts all requests; no policy has to name the caller.
    d:
      en: |
        Istio does not generate Kubernetes NetworkPolicies. Its controls are applied by the proxies.
references:
  - title: Security
    url: https://istio.io/latest/docs/concepts/security/
