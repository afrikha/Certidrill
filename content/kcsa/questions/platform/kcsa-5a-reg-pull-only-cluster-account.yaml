id: kcsa-5a-reg-pull-only-cluster-account
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp's production clusters pull images with the same registry account that the CI pipeline uses to push them. An attacker who compromises a node could read that pull Secret. Which change limits the damage while keeping deployments working?
body:
  options:
    - id: a
      text: { en: "Make the production repositories public so that clusters need no credentials" }
    - id: b
      text: { en: "Store the shared account's password in a ConfigMap instead of a Secret" }
    - id: c
      text: { en: "Give the clusters and CI one shared admin account with a longer password" }
    - id: d
      text: { en: "Give the clusters a separate pull-only account scoped to the repositories they need" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Clusters only need to read images, so they should use their own credential with pull-only rights on the repositories they run. A stolen cluster credential then cannot push or overwrite images, and push rights stay with the CI identity.
  options:
    a:
      en: |
        Public repositories remove authentication but expose internal images to everyone; the private registry would no longer protect their content.
    b:
      en: |
        A ConfigMap is less protected than a Secret and does not reduce the rights of the account.
    c:
      en: |
        A shared admin account increases the damage of a leak: anyone holding it can push and delete images. Password length does not help once the credential is stolen.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
