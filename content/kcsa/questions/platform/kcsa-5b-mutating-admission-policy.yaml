id: kcsa-5b-mutating-admission-policy
objective: "5.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team runs a small mutating webhook whose only job is to add a default label to new Deployments. The team wants to remove the webhook service, its TLS certificate and its availability risk while keeping the mutation, with a feature built into Kubernetes v1.37.

    What should the team use?
body:
  options:
    - id: a
      text: { en: "A ValidatingAdmissionPolicy whose binding uses the `Warn` validation action" }
    - id: b
      text: { en: "A MutatingAdmissionPolicy with a MutatingAdmissionPolicyBinding" }
    - id: c
      text: { en: "The `LimitRanger` admission plugin with a LimitRange in each namespace" }
    - id: d
      text: { en: "A Pod Security Admission `enforce` label on each namespace" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      MutatingAdmissionPolicy, stable since Kubernetes v1.36 and enabled by default, declares mutations in CEL that the API server applies in-process. It is a declarative alternative to mutating webhooks, so no external service or certificate is needed. Like its validating counterpart, it takes effect only with a binding.
  options:
    a:
      en: |
        A ValidatingAdmissionPolicy can only accept, warn or reject. It never changes the object, so the label would not be added.
    c:
      en: |
        `LimitRanger` applies default resource requests and limits from LimitRange objects. It cannot add labels to Deployments.
    d:
      en: |
        Pod Security Admission validates Pods against the Pod Security Standards. It does not mutate objects.
references:
  - title: "Mutating Admission Policy"
    url: https://kubernetes.io/docs/reference/access-authn-authz/mutating-admission-policy/
