id: kcsa-5a-cicd-gitops-cluster-credentials
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Today, Example Corp's CI pipeline runs `kubectl apply` against five production clusters with a cluster-admin kubeconfig stored in the CI system. The team adopts GitOps with an agent such as Argo CD or Flux running in each cluster. What is the main security benefit?
body:
  options:
    - id: a
      text: { en: "Images no longer need to be signed, because Git commits are reviewed" }
    - id: b
      text: { en: "RBAC is no longer needed in the clusters, because Git controls every change" }
    - id: c
      text: { en: "The CI system can keep its kubeconfig, but in an encrypted variable" }
    - id: d
      text: { en: "The agent pulls from Git, so cluster credentials no longer leave the cluster" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In GitOps, a software agent running inside the cluster pulls the desired state from Git and reconciles the cluster to it. The CI system no longer needs credentials for the clusters, so compromising CI no longer gives cluster-admin access to production.
  options:
    a:
      en: |
        Reviewing manifests in Git does not prove where the images they reference came from. Image signing and verification are still needed.
    b:
      en: |
        The GitOps agent itself runs with Kubernetes RBAC, which should be limited to what it manages, and humans and workloads still need RBAC.
    c:
      en: |
        Keeping a cluster-admin kubeconfig in CI is the push model that GitOps removes. Encrypting the variable does not remove the risk if CI is compromised.
references:
  - title: Argo CD - Declarative GitOps CD for Kubernetes
    url: https://argo-cd.readthedocs.io/en/stable/
  - title: Core Concepts
    url: https://fluxcd.io/flux/concepts/
