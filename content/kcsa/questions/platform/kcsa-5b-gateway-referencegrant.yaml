id: kcsa-5b-gateway-referencegrant
objective: "5.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The platform team runs a Gateway in the `infra` namespace. Its HTTPS listener must use a certificate stored as a Secret in the `certs` namespace, owned by the security team. The listener reports that its certificate reference is invalid.

    What must be created to make this cross-namespace reference valid?
body:
  options:
    - id: a
      text: { en: "A RoleBinding in `infra` that lets the Gateway controller read every Secret of the cluster" }
    - id: b
      text: { en: "A `BackendTLSPolicy` in `certs` that targets the certificate Secret" }
    - id: c
      text: { en: "A `ReferenceGrant` in `infra` that lists the `certs` namespace as a trusted source" }
    - id: d
      text: { en: "A `ReferenceGrant` in `certs` that allows Gateways from `infra` to reference Secrets" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In Gateway API, a reference from a Gateway to a Secret in another namespace is valid only if the namespace that owns the Secret allows it with a `ReferenceGrant`. The grant lives in `certs`, so the security team keeps control over which namespaces can use its certificates.
  options:
    a:
      en: |
        RBAC for the controller does not make the reference valid, and granting read access to every Secret of the cluster breaks least privilege.
    b:
      en: |
        `BackendTLSPolicy` configures TLS from the Gateway to a backend Service (upstream). It does not authorize a listener to use a certificate from another namespace.
    c:
      en: |
        The grant must be created in the namespace of the referenced resource (`certs`), not in the namespace of the Gateway. Otherwise any namespace could grant itself access.
references:
  - title: "TLS Configuration"
    url: https://gateway-api.sigs.k8s.io/guides/tls/
