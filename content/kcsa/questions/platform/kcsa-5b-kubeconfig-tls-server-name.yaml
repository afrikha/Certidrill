id: kcsa-5b-kubeconfig-tls-server-name
objective: "5.6.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Administrators reach a private API server through an SSH tunnel opened on a bastion host, so their kubeconfig uses `server: https://127.0.0.1:6443`. The API server certificate, signed by the cluster CA in `certificate-authority-data`, is valid only for the name `api.internal.example.com`, and `kubectl` fails with a certificate name error.

    Which kubeconfig change fixes the error while keeping full verification of the API server?
body:
  options:
    - id: a
      text: { en: "Set `tls-server-name: api.internal.example.com` in the cluster entry" }
    - id: b
      text: { en: "Set `insecure-skip-tls-verify: true` in the cluster entry" }
    - id: c
      text: { en: "Remove `certificate-authority-data` so that kubectl uses the system trust store" }
    - id: d
      text: { en: "Change the server to `http://127.0.0.1:6443` so that no certificate is checked" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `tls-server-name` sets the name used to check the server certificate; when it is empty, kubectl uses the host name of the server URL (here `127.0.0.1`). Setting it to `api.internal.example.com` makes the name check succeed, while the certificate is still verified against the cluster CA, so an impostor at the end of the tunnel would be detected.
  options:
    b:
      en: |
        This skips the validity check of the server certificate and makes the HTTPS connection insecure: kubectl could send its credentials to an impostor.
    c:
      en: |
        The cluster CA is not in the system trust store, so verification would fail. The name mismatch would also remain.
    d:
      en: |
        The API server's secure port expects TLS, and plain HTTP would send credentials and data unencrypted.
references:
  - title: "kubeconfig (v1)"
    url: https://kubernetes.io/docs/reference/config-api/kubeconfig.v1/
