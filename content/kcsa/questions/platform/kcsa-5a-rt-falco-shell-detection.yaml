id: kcsa-5a-rt-falco-shell-detection
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp's production containers never need an interactive shell. The security team wants to be alerted in real time whenever a shell process starts inside a running container in the cluster. Which tool provides this?
body:
  options:
    - id: a
      text: { en: "Kyverno" }
    - id: b
      text: { en: "Pod Security Admission" }
    - id: c
      text: { en: "Falco" }
    - id: d
      text: { en: "Prometheus" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Falco is a CNCF graduated runtime security tool. It parses system calls from the kernel, enriches them with container and Kubernetes metadata, and raises an alert when a rule matches; its default rules include shell execution in a container.
  options:
    a:
      en: |
        Kyverno is a policy engine that acts at admission time, when a resource is created or updated. It does not see processes started inside running containers.
    b:
      en: |
        Pod Security Admission checks Pod specs against the Pod Security Standards at creation. It does not observe runtime behavior.
    d:
      en: |
        Prometheus collects metrics. It does not observe individual process executions inside containers.
references:
  - title: The Falco Project
    url: https://falco.org/docs/
