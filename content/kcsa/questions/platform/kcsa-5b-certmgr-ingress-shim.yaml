id: kcsa-5b-certmgr-ingress-shim
objective: "5.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    cert-manager is installed and the ClusterIssuer `letsencrypt-prod` is ready. A team creates the Ingress below (rules omitted).

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: web
      namespace: shop
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
    spec:
      tls:
      - hosts:
        - shop.example.com
        secretName: shop-tls
    ```

    What does cert-manager do?
body:
  options:
    - id: a
      text: { en: "It creates a `Certificate` named `shop-tls` in `shop` for `shop.example.com` and stores the result in the `shop-tls` Secret" }
    - id: b
      text: { en: "It configures the Ingress controller to request a new certificate from the ACME server for each client connection" }
    - id: c
      text: { en: "Nothing, because cert-manager acts only on `Certificate` resources that users create themselves" }
    - id: d
      text: { en: "It creates a CertificateSigningRequest for the `kubernetes.io/kubelet-serving` signer and waits for approval" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The ingress-shim component of cert-manager watches Ingress resources with the `cert-manager.io/cluster-issuer` or `cert-manager.io/issuer` annotation. It ensures a `Certificate` exists in the Ingress namespace, named after `tls.secretName`, with the TLS hosts as subject alternative names, and cert-manager stores the signed certificate and key in that Secret for the Ingress controller to use.
  options:
    b:
      en: |
        Certificates are requested once, stored in a Secret and renewed before expiry. They are not requested per connection.
    c:
      en: |
        The annotation is exactly what triggers ingress-shim, which creates the `Certificate` on the team's behalf.
    d:
      en: |
        cert-manager uses its own issuers (here the ACME ClusterIssuer). The `kubernetes.io/kubelet-serving` signer issues kubelet serving certificates only.
references:
  - title: "Annotated Ingress resource"
    url: https://cert-manager.io/docs/usage/ingress/
