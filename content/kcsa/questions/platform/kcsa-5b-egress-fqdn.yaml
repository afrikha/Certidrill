id: kcsa-5b-egress-fqdn
objective: "5.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Pods of the `billing` namespace may send traffic only to `api.partner.example.com` on TCP port 443, and the IP addresses behind that name change often. A default-deny egress NetworkPolicy and a rule that allows DNS already exist.

    Why can't a standard Kubernetes NetworkPolicy express the remaining rule, and what is an alternative?
body:
  options:
    - id: a
      text: { en: "Its peers are Pods, namespaces and IP blocks, not names; a CNI extension such as Cilium `toFQDNs` can do it" }
    - id: b
      text: { en: "It does not support egress rules at all; a service mesh is needed for any outbound control" }
    - id: c
      text: { en: "It supports domain names in `ipBlock` only for port 80; an Ingress is needed for port 443" }
    - id: d
      text: { en: "It supports domain names only through `namespaceSelector`; the namespace must be labeled with the domain" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A NetworkPolicy selects peers with `podSelector`, `namespaceSelector` and `ipBlock`, and `ipBlock` needs cluster-external CIDRs that stay stable. Network plugins extend the API: Cilium DNS-based policies (`toFQDNs` with `matchName`) allow the IP addresses that the name resolves to, with a DNS rule so that Cilium's DNS proxy sees the lookups.
  options:
    b:
      en: |
        NetworkPolicy supports egress rules (`policyTypes: [Egress]`); the existing default-deny egress policy is one. What it lacks is matching by domain name.
    c:
      en: |
        `ipBlock` takes CIDR ranges, never names, and ports are set separately in `ports`. An Ingress handles inbound traffic, not outbound.
    d:
      en: |
        `namespaceSelector` matches namespaces of the cluster by their labels. A label cannot represent an external domain.
references:
  - title: "Network Policies"
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - title: "Layer 3 Policies"
    url: https://docs.cilium.io/en/stable/security/policy/layer3/
