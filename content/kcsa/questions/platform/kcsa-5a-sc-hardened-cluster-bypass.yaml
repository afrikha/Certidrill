id: kcsa-5a-sc-hardened-cluster-bypass
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp enforces the Restricted Pod Security Standard, least-privilege RBAC and default-deny NetworkPolicies. An attacker compromises a popular open source library that the `shop` application uses, and the next release ships the malicious code. Why do these cluster controls fail to stop the attack?
body:
  options:
    - id: a
      text: { en: "The Restricted standard still allows privileged containers in application namespaces" }
    - id: b
      text: { en: "NetworkPolicies apply to Pods created directly, not to Pods created by Deployments" }
    - id: c
      text: { en: "The malicious code ships in an approved image and uses the app's legitimate permissions" }
    - id: d
      text: { en: "RBAC rules do not apply to ServiceAccounts, only to human users" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A supply chain attack enters before the cluster: the code is built into an image that passes the normal release process. The cluster sees a compliant Pod and lets it run with the permissions and network access the application legitimately has. Controls at the source, build and artifact stages, such as dependency review, provenance and signing, are needed in addition to runtime controls.
  options:
    a:
      en: |
        The Restricted standard forbids privileged containers; that is one of the controls of the Baseline level it builds on.
    b:
      en: |
        NetworkPolicies select Pods by labels, whatever created them, including Pods of Deployments.
    d:
      en: |
        RBAC authorizes requests from ServiceAccounts as well as from users and groups.
references:
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
  - title: "Threats & mitigations"
    url: https://slsa.dev/spec/v1.0/threats
