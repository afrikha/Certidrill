id: kcsa-5b-gateway-backend-tls
objective: "5.6.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A shared Gateway must route requests for `shop.example.com` to different Services according to the URL path. A compliance rule also requires encryption on every hop, including from the Gateway to the backend Pods, which serve HTTPS with certificates from an internal CA.

    Which configuration meets both requirements?
body:
  options:
    - id: a
      text: { en: "A `TLS` listener in `Passthrough` mode, with one `TLSRoute` for each backend Service" }
    - id: b
      text: { en: "An `HTTPS` listener that terminates TLS, `HTTPRoute` path rules, and a `BackendTLSPolicy` using the internal CA" }
    - id: c
      text: { en: "An `HTTPS` listener that terminates TLS, and `HTTPRoute` path rules that point to the backend Services" }
    - id: d
      text: { en: "An `HTTPS` listener, `HTTPRoute` path rules, and a NetworkPolicy that admits only the Gateway to the backends" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Routing by URL path requires the Gateway to read HTTP, so it must terminate the client (downstream) TLS. Gateway API configures the Gateway-to-backend (upstream) TLS separately, with a `BackendTLSPolicy` attached to the Service that validates the backend certificates against the internal CA. Every hop is then encrypted.
  options:
    a:
      en: |
        In `Passthrough` mode the Gateway does not decrypt the traffic, so it cannot see URL paths and cannot route on them.
    c:
      en: |
        Without upstream TLS configuration, the connection from the Gateway to the backends is not encrypted, so the compliance rule fails.
    d:
      en: |
        A NetworkPolicy restricts who can connect but does not encrypt anything. The Gateway-to-backend hop stays unencrypted.
references:
  - title: "TLS Configuration"
    url: https://gateway-api.sigs.k8s.io/guides/tls/
