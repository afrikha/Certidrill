id: kcsa-5b-webhook-objectselector-optout
objective: "5.7.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A validating webhook that rejects privileged Pods uses an `objectSelector` that matches the label `policy: enforced`. The platform team's Deployment templates add this label to every Pod, but developers can also create their own Pods.

    Which weakness does this design have?
body:
  options:
    - id: a
      text: { en: "A user can avoid the check by creating a Pod without the label" }
    - id: b
      text: { en: "The webhook also receives every Secret, because `objectSelector` matches all resources" }
    - id: c
      text: { en: "An `objectSelector` forces the webhook's `failurePolicy` to `Ignore`" }
    - id: d
      text: { en: "Pods that carry the label are sent to the webhook without TLS" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The object selector is evaluated against the labels of the object, which the requester controls. Kubernetes recommends using it only for opt-in webhooks, because users can skip the webhook by setting or omitting labels. A security webhook should select requests with `rules`, a `namespaceSelector` or `matchConditions` instead.
  options:
    b:
      en: |
        Which resources reach the webhook is set by its `rules`. The `objectSelector` further narrows them by label; it does not widen them.
    c:
      en: |
        `failurePolicy` is a separate field, with `Fail` as the default. Selectors do not change it.
    d:
      en: |
        The API server always calls webhooks over HTTPS, verifying them with the `caBundle` of the configuration.
references:
  - title: "Dynamic Admission Control"
    url: https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
