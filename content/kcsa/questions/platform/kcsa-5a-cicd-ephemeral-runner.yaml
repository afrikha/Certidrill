id: kcsa-5a-cicd-ephemeral-runner
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp runs all its CI jobs on one long-lived build server. The security team asks for a fresh, isolated build environment that is created for each job and destroyed when the job ends. Which threat does this mainly reduce?
body:
  options:
    - id: a
      text: { en: "A developer committing code that has not been reviewed" }
    - id: b
      text: { en: "A compromised build persisting and tampering with later builds" }
    - id: c
      text: { en: "A tag in the registry being moved to a different image" }
    - id: d
      text: { en: "A Pod in the cluster running as the root user" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With an ephemeral environment per build, nothing that a malicious or compromised job leaves behind survives into the next job. SLSA Build L3 requires exactly this: an ephemeral environment for each build, and no way for one build to persist in or influence the environment of a later build.
  options:
    a:
      en: |
        Unreviewed commits are a source stage threat, addressed by branch protection and mandatory review.
    c:
      en: |
        Moved tags are a registry threat, addressed by immutable tags and references by digest.
    d:
      en: |
        Running as root is a workload configuration issue, addressed by securityContext settings and Pod Security Admission.
references:
  - title: Producing artifacts
    url: https://slsa.dev/spec/v1.0/requirements
