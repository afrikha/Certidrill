id: kcsa-5a-reg-private-network-access
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp's private registry has a public endpoint that anyone on the internet can reach, although only its build agents and cluster nodes ever use it. The security team wants to reduce the registry's exposure without breaking builds or deployments. What should the team do?
body:
  options:
    - id: a
      text: { en: "Restrict network access to the build agents and nodes, for example with a private endpoint" }
    - id: b
      text: { en: "Make every repository public so that no credentials need to cross the internet" }
    - id: c
      text: { en: "Set `imagePullPolicy: Never` so that nodes stop contacting the registry" }
    - id: d
      text: { en: "Move the registry credentials from Secrets into ConfigMaps on each node" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Limiting network access to the registry, through a private endpoint or firewall rules that allow only the build agents and cluster nodes, removes the internet as an attack path while every legitimate client still reaches it. Authentication, authorization and TLS remain in place on top of this.
  options:
    b:
      en: |
        Public repositories expose the images to everyone, which increases exposure instead of reducing it.
    c:
      en: |
        With `Never`, Pods start only if the image is already on the node, so new images could no longer be deployed.
    d:
      en: |
        ConfigMaps are less protected than Secrets, and moving credentials does not reduce who can reach the registry.
references:
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
