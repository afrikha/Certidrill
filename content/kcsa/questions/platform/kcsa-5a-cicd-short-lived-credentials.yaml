id: kcsa-5a-cicd-short-lived-credentials
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp's pipeline pushes images with a registry password that never expires. The password is stored as a variable in the pipeline definition file in Git. Which change best protects the pipeline credentials?
body:
  options:
    - id: a
      text: { en: "Encode the password in base64 inside the pipeline definition file" }
    - id: b
      text: { en: "Copy the password into the build image so it is not visible in Git" }
    - id: c
      text: { en: "Use short-lived tokens scoped to the job, obtained through OIDC federation" }
    - id: d
      text: { en: "Keep the password in Git but rotate it once a year" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Short-lived credentials obtained by the job through workload identity federation (OIDC) are never stored in the repository, expire quickly and grant only what the job needs. A leaked token is useful to an attacker only for minutes and only for that scope.
  options:
    a:
      en: |
        Base64 is an encoding, not encryption. Anyone who reads the file decodes the password immediately.
    b:
      en: |
        A secret baked into an image can be extracted by anyone who pulls the image, which spreads the credential further.
    d:
      en: |
        Yearly rotation leaves a valid long-lived password in Git for months, readable by anyone with repository access.
references:
  - title: Producing artifacts
    url: https://slsa.dev/spec/v1.0/requirements
