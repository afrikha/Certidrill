id: kcsa-5a-regctl-immutable-tags
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An attacker with push rights to Example Corp's registry overwrote the `shop/web:2.3.1` tag with a malicious image, and Deployments that reference that tag started running it. Which registry control prevents a tag that has been pushed once from being overwritten?
body:
  options:
    - id: a
      text: { en: "Scan on push" }
    - id: b
      text: { en: "Policy-based replication" }
    - id: c
      text: { en: "Tag immutability rules" }
    - id: d
      text: { en: "Proxy cache" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A tag immutability rule (in a registry such as Harbor) blocks any push whose tag matches an existing immutable tag, and prevents the tagged artifact from being re-tagged or deleted. `2.3.1` then always designates the same image.
  options:
    a:
      en: |
        Scanning on push checks new images for known vulnerabilities. A malicious image without known CVEs is accepted, and the tag is still overwritten.
    b:
      en: |
        Replication copies images between registries. It does not protect existing tags; it can even spread an overwritten tag.
    d:
      en: |
        A proxy cache serves and caches images from an upstream registry. It does not lock tags in your own projects.
references:
  - title: goharbor/harbor
    url: https://github.com/goharbor/harbor
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
