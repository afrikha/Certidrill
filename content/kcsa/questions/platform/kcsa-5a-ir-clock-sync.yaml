id: kcsa-5a-ir-clock-sync
objective: "5.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During an incident, responders join Falco alerts, API server audit events and node logs by timestamp. On one node, the shell alert appears several minutes before the `pods/exec` audit event that caused it, which makes the timeline unreliable. What is missing?
body:
  options:
    - id: a
      text: { en: "Synchronized clocks (NTP) on every node and control plane component" }
    - id: b
      text: { en: "An audit policy that logs `pods/exec` at the `Metadata` level" }
    - id: c
      text: { en: "A higher priority on the Falco rule that detects shells" }
    - id: d
      text: { en: "A larger `containerLogMaxSize` on the kubelets of that node" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Correlation across sources relies on timestamps written by different machines. If one node's clock drifts, its events are placed at the wrong point of the timeline. Synchronizing all nodes and components with NTP is a prerequisite for reliable incident timelines.
  options:
    b:
      en: |
        The `pods/exec` event is already recorded. The audit level controls how much detail is stored, not the accuracy of the node's clock.
    c:
      en: |
        Falco priority sets the severity of an alert, not its timestamp.
    d:
      en: |
        Log rotation size affects how much data stays on the node, not when events are timestamped.
references:
  - title: Auditing
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - title: Event Sources
    url: https://falco.org/docs/concepts/event-sources/
