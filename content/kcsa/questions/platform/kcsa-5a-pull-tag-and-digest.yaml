id: kcsa-5a-pull-tag-and-digest
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container uses the image below. An attacker with push access later moves the `2.3.1` tag to a malicious image in the same repository. What does a new Pod created after the change run?

    ```yaml
    image: registry.example.com/shop/web:2.3.1@sha256:9d2b6f0c1a7e4b3d8f5a2c6e1b0d9f7a3c5e8b2d4f6a1c3e5b7d9f0a2c4e6b8d
    ```
body:
  options:
    - id: a
      text: { en: "The malicious image, because the tag is resolved before the digest" }
    - id: b
      text: { en: "Nothing; the Pod is rejected because the tag and the digest disagree" }
    - id: c
      text: { en: "The image that matches the digest, because only the digest is used to pull" }
    - id: d
      text: { en: "The malicious image on nodes without a cached copy, the original elsewhere" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a reference contains both a tag and a digest, only the digest is used for pulling. The digest is the hash of the image manifest, so moving the tag has no effect on what this container runs.
  options:
    a:
      en: |
        The tag is ignored for pulling when a digest is present. Moving it cannot change the content selected by the digest.
    b:
      en: |
        Kubernetes does not compare the tag with the digest; the reference is valid and the digest wins.
    d:
      en: |
        Every node pulls by digest, so every node runs the same content whether it had a cached copy or not.
references:
  - title: Images
    url: https://kubernetes.io/docs/concepts/containers/images/
