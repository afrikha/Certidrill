id: kcsa-5b-admission-operations
objective: "5.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which kinds of API requests can admission controllers intercept and reject?
body:
  options:
    - id: a
      text: { en: "Only the requests that create Pods, whatever the namespace or the user" }
    - id: b
      text: { en: "Every request, including the `get`, `list` and `watch` requests that read Secrets" }
    - id: c
      text: { en: "Network connections opened between Pods, filtered at layers 3 and 4" }
    - id: d
      text: { en: "Requests that create, modify or delete objects, and connect requests such as `pods/exec`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Admission controllers apply to requests that create, delete or modify objects, and they can also block connect requests, such as connecting to a Pod through the API server. They do not see reads (`get`, `watch`, `list`), which bypass admission and are controlled by RBAC.
  options:
    a:
      en: |
        Admission applies to all kinds of objects (Deployments, Services, Secrets, CRDs...), not only Pods.
    b:
      en: |
        Reads bypass the admission layer, so admission controllers cannot block them.
    c:
      en: |
        Admission controllers act on API requests. Traffic between Pods is controlled by NetworkPolicies or a service mesh.
references:
  - title: "Admission Control in Kubernetes"
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
