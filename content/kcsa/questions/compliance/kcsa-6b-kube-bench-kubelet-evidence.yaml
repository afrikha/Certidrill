id: kcsa-6b-kube-bench-kubelet-evidence
objective: "6.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An auditor asks Example Corp for evidence that the kubelet on every worker node runs with anonymous authentication disabled and does not use the `AlwaysAllow` authorization mode, as the CIS Kubernetes Benchmark recommends.

    Which tool produces this evidence automatically?
body:
  options:
    - id: a
      text: { en: "Falco" }
    - id: b
      text: { en: "cosign" }
    - id: c
      text: { en: "kube-bench" }
    - id: d
      text: { en: "OPA Gatekeeper" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      kube-bench runs the checks of the CIS Kubernetes Benchmark on the node where it runs: it inspects the flags of the running components and their configuration files, and reports each check with a result and a remediation. The worker node section includes the kubelet checks on anonymous authentication and the authorization mode.
  options:
    a:
      en: |
        Falco detects suspicious runtime behavior from system calls and other event sources. It does not assess component configuration against the CIS Benchmark.
    b:
      en: |
        cosign signs and verifies container images and attestations. It does not inspect kubelet settings.
    d:
      en: |
        OPA Gatekeeper evaluates Kubernetes API objects at admission and in its audit. The kubelet flags and configuration file are on the node, not API objects, so Gatekeeper does not check them.
references:
  - title: "GitHub - aquasecurity/kube-bench: Checks whether Kubernetes is deployed according to security best practices as defined in the CIS Kubernetes Benchmark"
    url: https://github.com/aquasecurity/kube-bench
