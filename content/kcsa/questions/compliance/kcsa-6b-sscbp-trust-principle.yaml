id: kcsa-6b-sscbp-trust-principle
objective: "6.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The first version of the CNCF Software Supply Chain Best Practices is built on four principles. One of them says that every step of the supply chain should be verifiable through cryptographic attestation, and that no step should assume that earlier steps or their outputs are trustworthy.

    Which principle is this?
body:
  options:
    - id: a
      text: { en: "Trust" }
    - id: b
      text: { en: "Automation" }
    - id: c
      text: { en: "Clarity" }
    - id: d
      text: { en: "Mutual authentication" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The trust principle (trust through verification) requires every step to be verified with cryptographic attestation and every trust relationship to be defined explicitly. A consumer then trusts an artifact because the attestations of each step verify, not because of where it came from.
  options:
    b:
      en: |
        Automation reduces human error and configuration drift by automating the supply chain. It does not by itself make each step verifiable.
    c:
      en: |
        Clarity asks for clearly defined build environments with a limited scope and minimal permissions for human and machine identities.
    d:
      en: |
        Mutual authentication asks every entity to authenticate the others with hardened mechanisms and to rotate keys regularly. It is about identities, not about attesting each step's output.
references:
  - title: "Software Supply Chain Best Practices"
    url: https://github.com/cncf/tag-security/blob/main/community/working-groups/supply-chain-security/supply-chain-security-paper/sscsp.md
