id: kcsa-6b-attestation-subject
objective: "6.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The pipeline of Example Corp attaches an SBOM to each image as a signed in-toto attestation. An auditor asks how the attestation is tied to one specific image, so that it cannot be reused for another image.

    Which part of the in-toto Statement does this?
body:
  options:
    - id: a
      text: { en: "The `subject`, which identifies the artifact by its digest" }
    - id: b
      text: { en: "The `predicateType`, which identifies the image repository" }
    - id: c
      text: { en: "The `predicate`, which contains the image tag and its labels" }
    - id: d
      text: { en: "The `_type` field, which records the image name and version" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An in-toto Statement binds a predicate to its `subject`: the artifacts the claim is about, identified by name and cryptographic digest. Because the whole Statement is signed inside its envelope, the attestation only matches an image with that digest, which is why verifiers compare the subject digest with the image they are checking.
  options:
    b:
      en: |
        `predicateType` is a URI that says what kind of claim the predicate holds, for example SLSA provenance or a CycloneDX SBOM. It does not identify the image.
    c:
      en: |
        The `predicate` holds the claim itself, here the SBOM content. A tag can be moved to another image, so a tag would not bind the attestation to one image.
    d:
      en: |
        `_type` identifies the version of the in-toto Statement format, not the artifact.
references:
  - title: "In-Toto Attestations"
    url: https://docs.sigstore.dev/cosign/verifying/attestation/
  - title: "SLSA • Build: Provenance"
    url: https://slsa.dev/spec/v1.2/build-provenance
