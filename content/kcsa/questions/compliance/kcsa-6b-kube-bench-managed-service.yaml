id: kcsa-6b-kube-bench-managed-service
objective: "6.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp runs its workloads on a managed Kubernetes service. The security team runs kube-bench in the cluster and wants to include the CIS checks of the API server, the controller manager and etcd in its compliance report.

    What should the team expect?
body:
  options:
    - id: a
      text: { en: "Only worker nodes can be checked, because the provider runs the control plane" }
    - id: b
      text: { en: "kube-bench checks the control plane through the API server's `/metrics` endpoint" }
    - id: c
      text: { en: "kube-bench reconfigures the control plane to meet the benchmark on its first run" }
    - id: d
      text: { en: "kube-bench checks the control plane when its Job tolerates the control plane taint" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      kube-bench inspects processes and files on the node where it runs. On a managed service, the control plane nodes are operated by the provider and are not accessible, so kube-bench can only check the worker nodes. The project provides job files and benchmark variants for several managed services for that purpose; the control plane part is the provider's responsibility.
  options:
    b:
      en: |
        kube-bench does not use the API server's metrics. It reads process flags and configuration files directly on the node.
    c:
      en: |
        kube-bench never changes configuration; it reports results and remediation text only.
    d:
      en: |
        Tolerations and a node selector are how kube-bench reaches control plane nodes on a self-managed cluster. On a managed service there are no control plane nodes in the cluster to schedule onto.
references:
  - title: "kube-bench/docs/running.md at main · aquasecurity/kube-bench · GitHub"
    url: https://github.com/aquasecurity/kube-bench/blob/main/docs/running.md
