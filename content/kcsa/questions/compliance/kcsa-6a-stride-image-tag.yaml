id: kcsa-6a-stride-image-tag
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker with push access to the company registry replaces the image `registry.example.com/shop/web:2.4` with a modified image under the same tag. New Pods that reference this tag start the modified image. Which STRIDE category is this threat, and which control addresses it?
body:
  options:
    - id: a
      text: { en: "Repudiation; enable audit logging at the RequestResponse level" }
    - id: b
      text: { en: "Denial of service; set a ResourceQuota on the namespace" }
    - id: c
      text: { en: "Information disclosure; encrypt Secrets at rest in etcd" }
    - id: d
      text: { en: "Tampering; reference images by digest and verify signatures at admission" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Replacing an artifact with a modified one violates integrity, which is the Tampering category. A digest identifies the exact image content, so a replaced image no longer matches, and verifying signatures at admission rejects images that the trusted pipeline did not sign.
  options:
    a:
      en: |
        Repudiation is about proving who performed an action. Audit logs would not show the image change, which happens in the registry, and they would not stop the modified image from running.
    b:
      en: |
        A ResourceQuota limits resource consumption in a namespace. The threat is a change to the code that runs, not exhaustion of resources.
    c:
      en: |
        Encrypting Secrets protects their confidentiality. It does nothing about an image whose content was changed.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
  - title: Implant Internal Image, Technique T1525 - Enterprise
    url: https://attack.mitre.org/techniques/T1525/
