id: kcsa-6a-attack-tactic-technique
objective: "6.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the MITRE ATT&CK framework, what is the difference between a tactic and a technique?
body:
  options:
    - id: a
      text: { en: "A tactic is a method, such as Escape to Host; a technique is a goal, such as Privilege Escalation." }
    - id: b
      text: { en: "A tactic is the adversary's goal, such as Persistence; a technique is a method, such as Implant Internal Image." }
    - id: c
      text: { en: "A tactic is a defensive control recommended by MITRE; a technique is the attack that the control blocks." }
    - id: d
      text: { en: "A tactic is a named group of attackers; a technique is a vulnerability identifier from the CVE list." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A tactic is the reason for an action, what the adversary is trying to achieve: for Persistence, to keep their foothold. A technique is how the adversary achieves it, with an identifier such as T1525 for Implant Internal Image, and mitigations and detections are attached to techniques.
  options:
    a:
      en: |
        This reverses the two terms. Escape to Host is a technique (T1611), and Privilege Escalation is the tactic it serves.
    c:
      en: |
        Defensive measures are called mitigations in ATT&CK, and they are linked to techniques. Tactics describe adversary goals, not defenses.
    d:
      en: |
        ATT&CK documents threat groups separately, and techniques are behaviours, not CVE identifiers. A technique such as Exploitation for Privilege Escalation can use many different vulnerabilities.
references:
  - title: Persistence, Tactic TA0003 - Enterprise
    url: https://attack.mitre.org/tactics/TA0003/
  - title: Matrix - Enterprise - Containers
    url: https://attack.mitre.org/matrices/enterprise/containers/
