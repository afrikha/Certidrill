id: kcsa-6a-stride-etcd-backup
objective: "6.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp copies etcd snapshots to an object storage bucket without encrypting them. A threat model notes that anyone who obtains a snapshot can read every Secret of the cluster. Which STRIDE category does this threat represent?
body:
  options:
    - id: a
      text: { en: "Tampering" }
    - id: b
      text: { en: "Information disclosure" }
    - id: c
      text: { en: "Denial of service" }
    - id: d
      text: { en: "Spoofing" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Reading data that one is not authorized to see violates confidentiality, which is the Information disclosure category. The controls are encryption at rest of Secrets in etcd, encrypted backups and strict access control on the bucket.
  options:
    a:
      en: |
        Tampering means modifying data, which violates integrity. The threat described is reading the Secrets, not changing them.
    c:
      en: |
        Denial of service affects availability. Copying or reading a snapshot does not make the cluster unavailable.
    d:
      en: |
        Spoofing is impersonating an identity. Using the stolen credentials later could be spoofing, but the threat recorded here is the exposure of the data itself.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
