id: kcsa-6b-gatekeeper-dryrun
objective: "6.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team adds a new OPA Gatekeeper constraint that requires a `team` label on every Deployment. Before blocking anything, the team wants the constraint to only record which resources violate it, so that it can fix them first.

    Which value should the team set in the constraint's `enforcementAction` field?
body:
  options:
    - id: a
      text: { en: "`deny`" }
    - id: b
      text: { en: "`Ignore`" }
    - id: c
      text: { en: "`dryrun`" }
    - id: d
      text: { en: "`Enforce`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `enforcementAction: dryrun`, the constraint is deployed without rejecting any request, and the resources that violate it are listed in the constraint's `status.violations` by the Gatekeeper audit, which evaluates existing resources every 60 seconds by default. Once the violations are fixed, the team switches the constraint to `deny`.
  options:
    a:
      en: |
        `deny` is the default action: it rejects the admission requests that violate the constraint, which the team wants to avoid for now.
    b:
      en: |
        `Ignore` is a `failurePolicy` value of admission webhooks and admission policies (what to do when the policy cannot be evaluated), not a Gatekeeper enforcement action.
    d:
      en: |
        `Enforce` is a value used by Kyverno policies, not by Gatekeeper, and it would block requests rather than only record violations.
references:
  - title: "gatekeeper/website/docs/violations.md at master · open-policy-agent/gatekeeper · GitHub"
    url: https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/violations.md
  - title: "gatekeeper/website/docs/audit.md at master · open-policy-agent/gatekeeper · GitHub"
    url: https://github.com/open-policy-agent/gatekeeper/blob/master/website/docs/audit.md
