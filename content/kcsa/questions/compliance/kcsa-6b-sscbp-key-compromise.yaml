id: kcsa-6b-sscbp-key-compromise
objective: "6.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp signs its release artifacts. The security architect writes the key management plan by following the artifacts stage of the CNCF Software Supply Chain Best Practices.

    Which approach matches the paper's guidance?
body:
  options:
    - id: a
      text: { en: "Use one long-lived signing key, never rotated, so that consumers' trust stays stable" }
    - id: b
      text: { en: "Rely on image digests alone, because a digest already proves who built the artifact" }
    - id: c
      text: { en: "Assume the keys will be compromised one day, and plan for rotation and revocation" }
    - id: d
      text: { en: "Sign only the final release, never intermediate artifacts, so that fewer keys exist" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The paper tells producers to plan for "when, not if" their keys are compromised: support key rotation and revocation, use multiple keys with thresholds for critical roles, and minimize trust in online or automated keys. Trust should also be limited in scope and expire unless it is renewed.
  options:
    a:
      en: |
        A key that is never rotated stays useful to an attacker indefinitely after a compromise. The paper asks for rotation and revocation.
    b:
      en: |
        A digest proves integrity (the content has not changed) but not origin: anyone can compute the digest of an artifact they built. Signatures and attestations bind an artifact to an identity.
    d:
      en: |
        The paper recommends signing artifacts and their metadata at each stage and attesting each build step, so that trust holds end to end. Fewer signatures do not address key compromise.
references:
  - title: "Software Supply Chain Best Practices v2"
    url: https://tag-security.cncf.io/community/working-groups/supply-chain-security/supply-chain-security-paper-v2/sscbpv2/
