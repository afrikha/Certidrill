id: kcsa-6b-trivy-pipeline-gate
objective: "6.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The CI pipeline of the `shop` team runs this step after it builds an image.

    ```bash
    trivy image --severity CRITICAL --exit-code 1 \
      registry.example.com/shop/cart:1.4.2
    ```

    What is the effect of this step?
body:
  options:
    - id: a
      text: { en: "The step fails if the image has at least one critical vulnerability" }
    - id: b
      text: { en: "The step fails if the image has a vulnerability of any severity" }
    - id: c
      text: { en: "The cluster rejects Pods that use the image if it has a critical vulnerability" }
    - id: d
      text: { en: "The step signs the image when it has no critical vulnerability" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default Trivy exits with code 0 even when it finds issues. `--exit-code 1` makes it return 1 when it reports findings, and `--severity CRITICAL` limits the findings to critical ones, so the CI step fails only on a critical vulnerability and the pipeline stops before the image is released.
  options:
    b:
      en: |
        `--severity CRITICAL` filters the results, so vulnerabilities of lower severity are not reported and do not fail the step.
    c:
      en: |
        Trivy in a pipeline has no effect on the cluster. Rejecting Pods at creation requires an admission controller, such as a policy engine.
    d:
      en: |
        Trivy scans; it does not sign. Signing is done by a tool such as cosign, typically as a later pipeline step.
references:
  - title: "trivy/docs/guide/configuration/filtering.md at main · aquasecurity/trivy · GitHub"
    url: https://github.com/aquasecurity/trivy/blob/main/docs/guide/configuration/filtering.md
  - title: "trivy/docs/docs/configuration/others.md at main · aquasecurity/trivy · GitHub"
    url: https://github.com/aquasecurity/trivy/blob/main/docs/docs/configuration/others.md
