id: kcsa-6b-trivy-config-scan
objective: "6.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `shop` repository keeps its Kubernetes manifests in a `deploy/` directory. The team wants a pull request check that finds insecure settings and hard-coded secrets in these files before anything is applied to a cluster.

    Which command should the CI job run?
body:
  options:
    - id: a
      text: { en: "`trivy image --scanners vuln registry.example.com/shop/cart:1.4.2`" }
    - id: b
      text: { en: "`trivy fs --scanners misconfig,secret ./deploy`" }
    - id: c
      text: { en: "`trivy k8s --report summary cluster`" }
    - id: d
      text: { en: "`kube-bench run --targets policies`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `trivy fs` scans files in a directory, and the `misconfig` and `secret` scanners look for insecure infrastructure-as-code settings and embedded secrets. Run in a pull request, it rejects an insecure manifest before it reaches any cluster.
  options:
    a:
      en: |
        This scans the packages of a built image for known vulnerabilities. It does not analyze the manifests in the repository.
    c:
      en: |
        `trivy k8s` scans a running cluster, so it only finds the problem after the manifests have been applied.
    d:
      en: |
        kube-bench runs CIS Benchmark checks against a live cluster and its nodes. It does not read manifest files in a repository.
references:
  - title: "GitHub - aquasecurity/trivy: Find vulnerabilities, misconfigurations, secrets, SBOM in containers, Kubernetes, code repositories, clouds and more"
    url: https://github.com/aquasecurity/trivy
