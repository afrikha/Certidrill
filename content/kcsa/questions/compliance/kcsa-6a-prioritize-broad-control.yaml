id: kcsa-6a-prioritize-broad-control
objective: "6.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A threat model shows that developers can create Pods with `privileged: true`, with `hostPath` volumes and with `hostPID: true` in their namespaces, which gives several paths to the nodes. Which single control blocks all three threats?
body:
  options:
    - id: a
      text: { en: "A Falco rule that raises an alert whenever a privileged container starts" }
    - id: b
      text: { en: "Pod Security Admission enforcing the `baseline` or `restricted` level on those namespaces" }
    - id: c
      text: { en: "A default-deny NetworkPolicy for ingress and egress in each developer namespace" }
    - id: d
      text: { en: "Encryption at rest of Secrets with an EncryptionConfiguration that uses KMS v2" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Baseline profile of the Pod Security Standards already forbids privileged containers, host namespaces such as `hostPID` and `hostPath` volumes, and Restricted includes all of Baseline. One namespace label in `enforce` mode therefore removes three escape paths at the trust boundary between containers and nodes, which makes it a high-value first control.
  options:
    a:
      en: |
        Falco detects and alerts but does not prevent the Pod from running. It also covers only privileged containers, not the `hostPath` and `hostPID` threats.
    c:
      en: |
        NetworkPolicy filters Pod network traffic. It does not stop a Pod from being created with host access settings.
    d:
      en: |
        Encryption at rest protects Secrets stored in etcd. It has no effect on Pods that break out to their node.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: Pod Security Admission
    url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
