id: kcsa-6a-evidence-who-deleted
objective: "6.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An auditor asks Example Corp to show which identity deleted a Secret in the `payments` namespace three weeks ago. API server auditing is enabled, and the audit events are stored outside the cluster. Which source provides this evidence?
body:
  options:
    - id: a
      text: { en: "The API server audit log" }
    - id: b
      text: { en: "The output of `kubectl get events -n payments`" }
    - id: c
      text: { en: "The logs of the application containers in `payments`" }
    - id: d
      text: { en: "The Kyverno PolicyReport of the `payments` namespace" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Kubernetes auditing records the sequence of actions in the cluster and answers what happened, when, who initiated it and on which object. The audit event of the `delete` request contains the user, the verb, the Secret and the timestamp, which is the evidence the auditor needs.
  options:
    b:
      en: |
        Kubernetes Events report state changes of objects, such as scheduling or image pulls, and they are kept only for a short time. They do not record which user deleted an object.
    c:
      en: |
        Application logs contain what the application chose to write. The deletion was a request to the Kubernetes API, which the application does not see.
    d:
      en: |
        A PolicyReport shows the current compliance results of existing resources against policies. It is not a history of API requests, and a deleted Secret no longer appears in it.
references:
  - title: Auditing
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
