id: kcsa-6a-prioritize-detective-control
objective: "6.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A threat model notes that on-call engineers must keep permission to run `kubectl exec` in production Pods for incident response. An attacker who steals an engineer's credentials could use the same access (the ATT&CK technique Container Administration Command). Removing the permission is not acceptable. What should the team add to its plan for this threat?
body:
  options:
    - id: a
      text: { en: "A ResourceQuota that limits the number of Pods in each production namespace" }
    - id: b
      text: { en: "Nothing, because a threat that cannot be prevented is outside the scope of a threat model" }
    - id: c
      text: { en: "A NetworkPolicy that denies all ingress traffic to production Pods on every port" }
    - id: d
      text: { en: "Detective controls: alerts on exec requests in the audit log and runtime detection of unexpected shells" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a threat cannot be fully prevented, the plan adds controls that detect it and support a response. Exec requests appear in the API server audit log, and a runtime detection tool such as Falco can alert on a shell started in a container; ATT&CK's detection for this technique looks for such unexpected exec activity.
  options:
    a:
      en: |
        A ResourceQuota limits consumption in a namespace. It neither prevents nor detects commands run with `kubectl exec`.
    b:
      en: |
        A threat model records threats that cannot be prevented too, and the plan covers them with detection, response or an explicit risk acceptance.
    c:
      en: |
        `kubectl exec` goes from the client to the API server and then to the kubelet, not through the Pod network. A NetworkPolicy would break the application without blocking exec.
references:
  - title: Container Administration Command, Technique T1609 - Enterprise
    url: https://attack.mitre.org/techniques/T1609/
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
