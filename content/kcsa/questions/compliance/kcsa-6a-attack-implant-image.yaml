id: kcsa-6a-attack-implant-image
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To keep access even after the compromised Pods are deleted, an attacker who obtained push rights to Example Corp's internal registry adds a backdoor to the base image that every team builds from. Which MITRE ATT&CK technique is this?
body:
  options:
    - id: a
      text: { en: "Build Image on Host" }
    - id: b
      text: { en: "Masquerading" }
    - id: c
      text: { en: "Implant Internal Image" }
    - id: d
      text: { en: "Container Administration Command" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Implant Internal Image (T1525) is a Persistence technique: the adversary inserts malicious code into an image stored in the victim's own registry, so that every deployment of that image runs it again. ATT&CK's mitigations include requiring signed images, checking image integrity and limiting who can push or modify images.
  options:
    a:
      en: |
        Build Image on Host (T1612) is building an image directly on a host through the container API to avoid the registry and its controls. Here the attacker modifies an image already in the registry.
    b:
      en: |
        Masquerading is making a malicious object look legitimate, for example a Pod named like a system component. Backdooring a trusted image is described by a more specific technique.
    d:
      en: |
        Container Administration Command (T1609) is running commands in containers through administration interfaces such as `kubectl exec`. It does not change images.
references:
  - title: Implant Internal Image, Technique T1525 - Enterprise
    url: https://attack.mitre.org/techniques/T1525/
