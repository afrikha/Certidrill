id: kcsa-6a-nist-risk-category
objective: "6.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A review finds that a container image stored in the company registry contains a cloud access key in clear text in one of its layers. A build script copied the key into the image. In which risk category of NIST SP 800-190 does this finding belong?
body:
  options:
    - id: a
      text: { en: "Registry risks" }
    - id: b
      text: { en: "Orchestrator risks" }
    - id: c
      text: { en: "Image risks" }
    - id: d
      text: { en: "Host OS risks" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SP 800-190 lists embedded clear-text secrets among the image risks, together with image vulnerabilities, configuration defects, embedded malware and untrusted images. Anyone who can pull the image can read the key, and the guide's countermeasure is to keep secrets out of images and provide them at runtime.
  options:
    a:
      en: |
        Registry risks are about the registry itself: insecure connections, stale images, and insufficient authentication and authorization. The secret is a defect of the image content, wherever the image is stored.
    b:
      en: |
        Orchestrator risks cover administrative access, unauthorized access, inter-container traffic, mixing sensitivity levels and node trust. The key was added during the build, before any orchestrator ran the image.
    d:
      en: |
        Host OS risks concern the node: its attack surface, the shared kernel, host component vulnerabilities, user access rights and file system tampering. The finding is in the image, not on the host.
references:
  - title: SP 800-190, Application Container Security Guide
    url: https://csrc.nist.gov/pubs/sp/800/190/final
