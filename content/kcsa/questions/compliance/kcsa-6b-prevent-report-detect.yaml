id: kcsa-6b-prevent-report-detect
objective: "6.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Example Corp's compliance team sets three requirements for its clusters:

    - Privileged Pods must be rejected when they are created.
    - Existing resources that break this rule must be listed in a report.
    - A shell started inside a running container must raise an alert.

    Which combination meets all three requirements?
body:
  options:
    - id: a
      text: { en: "Falco with its default rules, plus kube-bench as a nightly Job" }
    - id: b
      text: { en: "Kyverno in Enforce mode with background scans, plus Falco" }
    - id: c
      text: { en: "Gatekeeper with `enforcementAction: dryrun`, plus Trivy in the CI pipeline" }
    - id: d
      text: { en: "Kubescape in the CI pipeline, plus Kyverno in Audit mode" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A policy engine in enforcement mode rejects privileged Pods at admission, and Kyverno's background scans record existing violations in policy reports. Falco covers the runtime requirement, because it detects a shell spawned in a container from system calls and raises an alert. Prevention at admission and detection at runtime are complementary: neither covers the other's phase.
  options:
    a:
      en: |
        Falco covers the shell alert, but it does not reject Pods, and kube-bench checks node configuration against the CIS Benchmark, not privileged Pods in the API.
    c:
      en: |
        `dryrun` records violations without rejecting anything, Trivy in CI can be bypassed by direct API calls, and nothing detects a shell at runtime.
    d:
      en: |
        Kyverno in Audit mode only reports, so privileged Pods are still created, and a CI scan does not detect runtime activity.
references:
  - title: "Policy Reports | Kyverno"
    url: https://kyverno.io/docs/policy-reports/
  - title: "The Falco Project"
    url: https://falco.org/docs/
