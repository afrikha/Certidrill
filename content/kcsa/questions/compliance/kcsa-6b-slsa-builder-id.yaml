id: kcsa-6b-slsa-builder-id
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security engineer reviews the SLSA provenance attached to the image `registry.example.com/shop/cart`. The engineer needs to know which build platform produced the image, because that platform mainly determines the SLSA Build level the image can claim.

    Which provenance field should the engineer check?
body:
  options:
    - id: a
      text: { en: "`buildDefinition.externalParameters`" }
    - id: b
      text: { en: "`runDetails.builder.id`" }
    - id: c
      text: { en: "`buildDefinition.resolvedDependencies`" }
    - id: d
      text: { en: "`runDetails.metadata.invocationId`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `runDetails.builder.id` is a URI that identifies the trusted build platform, and the SLSA specification intends it to be the main determinant of the Build level. Consumers accept only specific signer and builder pairs; a builder that is not on their list is treated as Build L1.
  options:
    a:
      en: |
        `externalParameters` records the inputs controlled by the user, such as the repository, ref or workflow. Consumers must check them against their expectations, but they do not identify the build platform.
    c:
      en: |
        `resolvedDependencies` lists the artifacts fetched during the build, such as the resolved source commit, with their digests. It describes inputs, not the builder.
    d:
      en: |
        `invocationId` identifies one particular run, for example to find its logs. It does not say which platform performed the build or what level it meets.
references:
  - title: "SLSA • Build: Provenance"
    url: https://slsa.dev/spec/v1.2/build-provenance
