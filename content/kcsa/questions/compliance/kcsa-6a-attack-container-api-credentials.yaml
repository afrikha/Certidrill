id: kcsa-6a-attack-container-api-credentials
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After compromising a web application Pod, an attacker uses the ServiceAccount token mounted in the Pod to call the Kubernetes API and read the Secrets of the namespace. Which technique of the MITRE ATT&CK Containers matrix describes this activity?
body:
  options:
    - id: a
      text: { en: "Brute Force" }
    - id: b
      text: { en: "Network Service Discovery" }
    - id: c
      text: { en: "Resource Hijacking" }
    - id: d
      text: { en: "Unsecured Credentials: Container API" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Unsecured Credentials: Container API (T1552.007) describes collecting credentials and Secrets through container APIs such as the Kubernetes API, for example with the permissions of a Pod's ServiceAccount. ATT&CK recommends least privilege for ServiceAccounts and disabling their tokens in Pods that do not need API access.
  options:
    a:
      en: |
        Brute Force is guessing passwords or credentials by repeated attempts. The attacker here uses a valid token that is already present in the Pod.
    b:
      en: |
        Network Service Discovery is scanning the network to find listening services. The attacker is reading Secrets through the API, not mapping the network.
    c:
      en: |
        Resource Hijacking is using the victim's compute or bandwidth, for example for cryptomining. Reading Secrets is a credential theft, not resource abuse.
references:
  - title: "Unsecured Credentials: Container API, Sub-technique T1552.007 - Enterprise"
    url: https://attack.mitre.org/techniques/T1552/007/
