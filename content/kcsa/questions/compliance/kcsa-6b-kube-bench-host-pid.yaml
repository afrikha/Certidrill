id: kcsa-6b-kube-bench-host-pid
objective: "6.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The Pod template of the kube-bench Job contains the following settings.

    ```yaml
    spec:
      hostPID: true
      containers:
      - name: kube-bench
        volumeMounts:
        - name: var-lib-kubelet
          mountPath: /var/lib/kubelet
          readOnly: true
    ```

    Why does kube-bench need `hostPID: true`?
body:
  options:
    - id: a
      text: { en: "To restart the kubelet after it fixes a failed check" }
    - id: b
      text: { en: "To be exempted from the Pod Security Admission checks" }
    - id: c
      text: { en: "To send its results to the API server through the node's network" }
    - id: d
      text: { en: "To see the processes running on the node and inspect their flags" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Many CIS checks look at the command-line flags of running components such as the kubelet or the API server. kube-bench needs the host's PID namespace to see those processes, and read access to host directories such as `/etc` and `/var` to check configuration files and their permissions.
  options:
    a:
      en: |
        kube-bench only reports; it prints a remediation for each failed check but changes nothing on the node.
    b:
      en: |
        `hostPID: true` does the opposite: it is a host namespace setting that the Baseline Pod Security Standard forbids, so the kube-bench namespace must allow it (for example with the Privileged level).
    c:
      en: |
        Sharing the node's network would need `hostNetwork`, not `hostPID`. kube-bench writes its results to standard output, read from the Pod's logs.
references:
  - title: "kube-bench/docs/running.md at main · aquasecurity/kube-bench · GitHub"
    url: https://github.com/aquasecurity/kube-bench/blob/main/docs/running.md
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
