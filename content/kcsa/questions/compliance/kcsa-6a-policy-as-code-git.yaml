id: kcsa-6a-policy-as-code-git
objective: "6.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp stores its admission policies, ValidatingAdmissionPolicy and Kyverno resources, in a Git repository. Changes reach the cluster only through reviewed pull requests applied by a pipeline. What compliance benefit does this practice bring?
body:
  options:
    - id: a
      text: { en: "Policies kept in Git are still enforced when the admission controller is disabled." }
    - id: b
      text: { en: "The repository history shows when each control changed and who reviewed the change." }
    - id: c
      text: { en: "The API server no longer needs audit logging, because Git records every request." }
    - id: d
      text: { en: "The Secrets that the policies reference are encrypted at rest in etcd automatically." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Policy as code makes controls versioned, repeatable and reviewable. The Git history and the pull request reviews are evidence of when a control was introduced or changed and who approved it, and the pipeline applies the same policies to every cluster.
  options:
    a:
      en: |
        Git only stores the policy definitions. Enforcement happens in the cluster's admission chain; if the admission controller or policy engine is disabled, nothing is enforced.
    c:
      en: |
        Git records changes to the repository, not requests to the Kubernetes API. Audit logs are still needed to show who did what in the cluster.
    d:
      en: |
        Storing policies in Git has no effect on how the API server stores Secrets. Encryption at rest requires an EncryptionConfiguration on the API server.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
