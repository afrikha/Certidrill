id: kcsa-6b-sscbp-tuf-distribution
objective: "6.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    For the deployments and distribution stage, the CNCF Software Supply Chain Best Practices ask that the system that distributes artifacts provide trust, compromise resilience, integrity and freshness, so that clients detect outdated or rolled-back artifacts.

    Which framework does the paper point to for these properties?
body:
  options:
    - id: a
      text: { en: "SPIFFE and SPIRE" }
    - id: b
      text: { en: "The Update Framework (TUF)" }
    - id: c
      text: { en: "Grafeas" }
    - id: d
      text: { en: "OpenTelemetry" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The paper uses the properties defined by The Update Framework (TUF) and recommends TUF for distribution: delegated, scoped trust, resilience when keys are compromised, and freshness metadata that lets clients detect outdated files and rollback attacks. Notary and the Sigstore root of trust are among its implementations.
  options:
    a:
      en: |
        SPIFFE and SPIRE give workloads short-lived, automatically rotated identities. The paper cites them for workload credentials, not for artifact freshness.
    c:
      en: |
        Grafeas is a metadata store where in-toto attestations and other supply chain metadata can be kept. It does not secure the distribution channel.
    d:
      en: |
        OpenTelemetry collects traces, metrics and logs. It is an observability framework, not a secure distribution system.
references:
  - title: "Software Supply Chain Best Practices v2"
    url: https://tag-security.cncf.io/community/working-groups/supply-chain-security/supply-chain-security-paper-v2/sscbpv2/
