id: kcsa-6a-audit-log-tamper-proof
objective: "6.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A regulation requires Example Corp to keep API server audit logs for one year and to ensure that an administrator with access to the cluster or its control plane nodes cannot erase the record of their own actions. The API server currently writes audit logs to a file on each control plane node. What should the team do?
body:
  options:
    - id: a
      text: { en: "Set `--audit-log-maxage=365` on the API server so that the files stay on the control plane nodes for a year." }
    - id: b
      text: { en: "Raise the audit policy to the RequestResponse level for all resources so that the events contain more detail." }
    - id: c
      text: { en: "Forward the events as they are produced to an external log store that cluster credentials cannot modify, with one-year retention." }
    - id: d
      text: { en: "Copy the audit log every day into a ConfigMap in the `kube-system` namespace, protected by RBAC." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Audit evidence must survive an attacker or insider who controls the cluster. Forwarding audit events immediately (with the webhook backend or a log shipper) to storage outside the cluster, which cluster-level credentials cannot reach, protects them from tampering, and that store enforces the one-year retention.
  options:
    a:
      en: |
        `--audit-log-maxage` sets how many days old audit files are kept, so the retention would be met. But the files stay on the control plane nodes, where an administrator with node access can edit or delete them.
    b:
      en: |
        A higher level records more detail, including request and response bodies, but does not change where the logs are stored or who can erase them. It would also write Secret values to the log.
    d:
      en: |
        A ConfigMap is stored by the same cluster, so a cluster administrator can modify or delete it. ConfigMaps are also limited in size and are not designed for log retention.
references:
  - title: Auditing
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
