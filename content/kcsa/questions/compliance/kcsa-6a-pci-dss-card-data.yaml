id: kcsa-6a-pci-dss-card-data
objective: "6.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp runs an online shop on Kubernetes. Pods in the `payments` namespace receive customers' payment card numbers and store them before passing them to a payment processor. Which framework defines the security requirements that this workload must meet because of the data it handles?
body:
  options:
    - id: a
      text: { en: "PCI DSS" }
    - id: b
      text: { en: "HIPAA" }
    - id: c
      text: { en: "NIST SP 800-190" }
    - id: d
      text: { en: "CIS Kubernetes Benchmark" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Payment Card Industry Data Security Standard (PCI DSS) applies to every organisation that stores, processes or transmits payment card data. Because the `payments` Pods handle card numbers, the systems that run them are in the scope of PCI DSS, and the operator must map its requirements to Kubernetes controls.
  options:
    b:
      en: |
        HIPAA is a United States law that protects health information handled by healthcare organisations and their business associates. An online shop that handles card numbers is not covered because of that data.
    c:
      en: |
        NIST SP 800-190 is guidance on the risks of container technologies and their countermeasures. It is not a framework whose requirements a merchant must meet because it handles card data.
    d:
      en: |
        The CIS Kubernetes Benchmark gives configuration recommendations for Kubernetes components. It can help implement controls, but it is not the framework that card data brings into play.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
