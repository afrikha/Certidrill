id: kcsa-6b-slsa-build-l1
objective: "6.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp has never applied SLSA to its release pipeline. It wants to reach SLSA Build L1, the first level of the Build track.

    Which requirement must the build platform meet at this level?
body:
  options:
    - id: a
      text: { en: "Sign the provenance with a key that user-defined build steps cannot access" }
    - id: b
      text: { en: "Run every build on a hosted platform that isolates runs from each other" }
    - id: c
      text: { en: "Automatically generate provenance that describes how the artifact was built" }
    - id: d
      text: { en: "Rebuild every artifact on two independent builders and compare the outputs" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Build L1, "Provenance exists", asks for a consistent build process on a platform that automatically generates provenance (who built the package, the build process and its top-level inputs), and for that provenance to be distributed to consumers. The provenance may be unsigned at L1, so this level helps against mistakes and documentation gaps, not against tampering.
  options:
    a:
      en: |
        Keeping the signing secrets away from user-defined build steps is a Build L3 (hardened builds) requirement, not an L1 one.
    b:
      en: |
        A hosted build platform is the core of Build L2, and isolation between runs is a Build L3 requirement. L1 only requires that provenance exists.
    d:
      en: |
        No Build level requires two independent builders. The specification mentions an after-the-fact reproducible build only as one possible way to produce L2 provenance.
references:
  - title: "SLSA • Build: Track Basics"
    url: https://slsa.dev/spec/v1.2/build-track-basics
