id: kcsa-6a-stride-spoofing-control
objective: "6.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A STRIDE review of the data flow between administrators' workstations and the API server finds a Spoofing threat: an attacker could reuse a stolen, long-lived credential copied from a kubeconfig file. Which control answers this category of threat?
body:
  options:
    - id: a
      text: { en: "Resource requests and limits with a LimitRange in every namespace" }
    - id: b
      text: { en: "OIDC authentication with individual identities and short-lived tokens" }
    - id: c
      text: { en: "Encryption at rest of Secrets with a KMS v2 provider" }
    - id: d
      text: { en: "A default-deny NetworkPolicy in every application namespace" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Spoofing violates authentication, so its controls strengthen how callers prove their identity. Individual OIDC identities with short-lived tokens, often combined with multi-factor authentication at the identity provider, limit how long a stolen credential works and tie each request to one person.
  options:
    a:
      en: |
        Requests, limits and LimitRange protect availability against resource exhaustion, which is the Denial of service category.
    c:
      en: |
        Encryption at rest protects the confidentiality of stored Secrets (Information disclosure). It does not stop an attacker from authenticating with a stolen credential.
    d:
      en: |
        NetworkPolicy controls traffic between Pods. It does not apply to administrators' connections to the API server, and it does not verify identities.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
