id: kcsa-6b-vap-warn-audit
objective: "6.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster administrator binds a ValidatingAdmissionPolicy that forbids containers without a memory limit.

    ```yaml
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    metadata:
      name: require-memory-limit-binding
    spec:
      policyName: require-memory-limit
      validationActions: [Warn, Audit]
    ```

    A user then creates a Pod without a memory limit. What happens?
body:
  options:
    - id: a
      text: { en: "The Pod is rejected, and the failure is added to the audit event" }
    - id: b
      text: { en: "The Pod is rejected, and the user receives a warning in the response" }
    - id: c
      text: { en: "The Pod is created, and the failure is written to a policy report" }
    - id: d
      text: { en: "The Pod is created, the user gets a warning, and the audit event records the failure" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `validationActions` decides how a validation failure is enforced. `Warn` returns the failure to the client as a warning and `Audit` adds it to the audit event of the request; neither rejects the request. This combination lets administrators measure the impact of a policy before they bind it with `Deny`.
  options:
    a:
      en: |
        Only `Deny` rejects the request, and it is not in the list.
    b:
      en: |
        The request is not rejected without `Deny`. Note that `Deny` and `Warn` may not be used together on the same binding.
    c:
      en: |
        Policy reports are custom resources of policy engines such as Kyverno. A ValidatingAdmissionPolicy records failures in the audit event, not in a report.
references:
  - title: "Validating Admission Policy"
    url: https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
