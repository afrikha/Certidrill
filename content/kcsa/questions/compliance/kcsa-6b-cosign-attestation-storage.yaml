id: kcsa-6b-cosign-attestation-storage
objective: "6.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The release pipeline of the `shop` team runs this command after it builds and pushes an image.

    ```bash
    cosign attest --type cyclonedx --predicate sbom.cdx.json \
      --key cosign.key registry.example.com/shop/cart@sha256:4b1c...
    ```

    Where is the resulting attestation stored, so that the cluster can verify it at deployment time?
body:
  options:
    - id: a
      text: { en: "In a new layer added to the image, which gives the image a new digest" }
    - id: b
      text: { en: "In the registry, as a separate artifact associated with the image digest" }
    - id: c
      text: { en: "In a Kubernetes Secret, in each namespace where the image will run" }
    - id: d
      text: { en: "On the build runner only, in a file next to `sbom.cdx.json`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `cosign attest` wraps the SBOM in an in-toto Statement, signs it in a DSSE envelope and pushes it to the image's registry as a separate artifact tied to the image digest (for example a tag derived from the digest with an `.att` suffix). The image itself is unchanged, and any verifier with access to the registry, such as an admission controller, can fetch and check the attestation.
  options:
    a:
      en: |
        The image is not modified. Changing its layers would change its digest and break the link between the attestation's subject and the image.
    c:
      en: |
        cosign stores attestations in the OCI registry, not in Kubernetes objects. Verifiers in the cluster read them from the registry.
    d:
      en: |
        The attestation is pushed to the registry so that consumers can find it with the image. Keeping it only on the runner would make it useless for verification at deployment.
references:
  - title: "In-Toto Attestations"
    url: https://docs.sigstore.dev/cosign/verifying/attestation/
