id: kcsa-6b-pipeline-scan-bypass
objective: "6.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp scans every manifest in its CI/CD pipeline and fails the pipeline when a Pod runs as privileged. An internal review finds a privileged Pod in the `payments` namespace: a developer with cluster access created it with `kubectl apply` from a laptop.

    Which control closes this gap?
body:
  options:
    - id: a
      text: { en: "Run the manifest scanner on every commit, not only on pull requests" }
    - id: b
      text: { en: "Add the `--exit-code 1` option to the scanner in the pipeline" }
    - id: c
      text: { en: "Enforce the same rule in the cluster with admission control" }
    - id: d
      text: { en: "Generate an SBOM for every image deployed in the namespace" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A CI/CD scan only sees what goes through the pipeline, so anyone who can call the API directly bypasses it. Admission control runs in the API server for every request, whatever its origin: for example the `restricted` or `baseline` Pod Security Standard enforced on the namespace, or a Kyverno, Gatekeeper or ValidatingAdmissionPolicy rule that denies privileged Pods.
  options:
    a:
      en: |
        Scanning more often in the pipeline still misses changes that never go through the pipeline, such as a direct `kubectl apply`.
    b:
      en: |
        The pipeline already fails on privileged Pods. The exit code only affects the pipeline, not requests sent directly to the cluster.
    d:
      en: |
        An SBOM lists the components of an image. It says nothing about the Pod's security settings and blocks nothing.
references:
  - title: "Validating Admission Policy"
    url: https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
  - title: "Pod Security Standards"
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
