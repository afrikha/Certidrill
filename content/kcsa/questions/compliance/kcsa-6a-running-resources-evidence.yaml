id: kcsa-6a-running-resources-evidence
objective: "6.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp adds a Kyverno policy that requires a `team` label on every Deployment. Many Deployments were created months before the policy existed. An auditor asks for evidence showing which of the existing Deployments comply. What should the team provide?
body:
  options:
    - id: a
      text: { en: "The PolicyReport results produced by Kyverno's background scans of existing resources" }
    - id: b
      text: { en: "The audit log entries of the requests that originally created the Deployments" }
    - id: c
      text: { en: "The admission response returned when the Kyverno policy itself was created" }
    - id: d
      text: { en: "The output of `kubectl auth can-i create deployments` for each team" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Admission control only evaluates resources when they are created or updated. Kyverno's background scans also evaluate resources that existed before the policy, and write pass and fail results to PolicyReport and ClusterPolicyReport resources, which show the current compliance state of what is running.
  options:
    b:
      en: |
        The creation requests were made before the policy existed, so their audit events say nothing about compliance with it. Labels may also have changed since then.
    c:
      en: |
        Creating the policy object only validates the policy itself. It does not evaluate the Deployments that are already in the cluster.
    d:
      en: |
        `kubectl auth can-i` checks RBAC permissions. It shows who may create Deployments, not whether existing Deployments carry the required label.
references:
  - title: Policy Reports
    url: https://kyverno.io/docs/policy-reports/
