id: kcsa-6a-pci-scope-reduction
objective: "6.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A shared Kubernetes cluster runs 40 applications. One of them processes payment card data, and the auditor considers every node, namespace and network path of the cluster to be in scope for PCI DSS. The company wants to reduce the number of systems in scope. What should it do?
body:
  options:
    - id: a
      text: { en: "Enable API server audit logging at the RequestResponse level for every namespace of the cluster." }
    - id: b
      text: { en: "Enforce the restricted Pod Security Standard on every namespace of the cluster." }
    - id: c
      text: { en: "Move the card-processing workload to dedicated, network-segmented infrastructure such as its own cluster." }
    - id: d
      text: { en: "Encrypt all Secrets of the cluster at rest with an EncryptionConfiguration that uses KMS v2." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      PCI DSS scope includes the systems that handle card data and every system that can affect their security. Isolating the card-processing workload on its own cluster (or at least dedicated nodes) with strict network segmentation takes the 39 other applications and their nodes out of scope, as NIST SP 800-190 also recommends when it says to group only workloads of the same sensitivity on a host.
  options:
    a:
      en: |
        Detailed audit logging adds evidence and detection, but every system that shares nodes and networks with the card data stays in scope. RequestResponse level would also write request and response bodies, including Secret values, to the log.
    b:
      en: |
        The restricted profile hardens Pods, but the 40 applications still share the same nodes, network and control plane. Hardening does not remove systems from scope.
    d:
      en: |
        Encryption at rest protects stored Secrets, which PCI DSS values, but it does not separate the card-processing workload from the other applications. The scope stays the same.
references:
  - title: SP 800-190, Application Container Security Guide
    url: https://csrc.nist.gov/pubs/sp/800/190/final
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
