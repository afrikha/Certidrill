id: kcsa-6a-revisit-threat-model
objective: "6.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp built a threat model of its cluster last year and prioritized its controls from it. Which event is a reason to revisit the threat model?
body:
  options:
    - id: a
      text: { en: "A developer renames an internal variable in the code of one service." }
    - id: b
      text: { en: "The cluster autoscaler adds two worker nodes of the usual type during a busy day." }
    - id: c
      text: { en: "A new integration lets an external partner call a service in the cluster." }
    - id: d
      text: { en: "The weekly report shows that no certificate is close to its expiry date." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A threat model must be revisited when the architecture changes, to check that the existing controls still fit. A partner integration adds a new external client, a new data flow and a new trust boundary, so new threats and new priorities can appear.
  options:
    a:
      en: |
        Renaming a variable does not change components, data flows or trust boundaries. It does not affect the threat model.
    b:
      en: |
        Adding nodes of the same type under the same configuration scales the existing design without changing it.
    d:
      en: |
        A routine report without findings shows that an existing control works. Nothing in the architecture has changed.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
