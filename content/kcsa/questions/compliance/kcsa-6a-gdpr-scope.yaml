id: kcsa-6a-gdpr-scope
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp is based in Canada and runs its customer portal on a Kubernetes cluster located in Canada. Many of its customers live in the European Union, and the portal stores their names, addresses and email addresses. Which statement about the General Data Protection Regulation (GDPR) is correct for Example Corp?
body:
  options:
    - id: a
      text: { en: "It does not apply, because both the company and its cluster are located outside the European Union." }
    - id: b
      text: { en: "It applies, because the company offers its services to people in the European Union and processes their personal data." }
    - id: c
      text: { en: "It applies only if the portal also stores the payment card numbers of its European customers." }
    - id: d
      text: { en: "It applies only after the company decides to certify its cluster against the regulation." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The GDPR protects the personal data of people in the European Union, and it also applies to organisations outside the EU that offer goods or services to those people. Example Corp must therefore apply appropriate technical and organisational measures, such as encryption, and notify the supervisory authority of a personal data breach within 72 hours.
  options:
    a:
      en: |
        The location of the company and of its servers does not take it out of scope. What matters is that it processes personal data of people in the EU to whom it offers its services.
    c:
      en: |
        Names, addresses and email addresses are personal data. Payment card numbers would add PCI DSS requirements, but they are not needed for the GDPR to apply.
    d:
      en: |
        The GDPR is a regulation, a law that applies whether or not the company seeks any certification. Certification is a feature of voluntary standards such as ISO/IEC 27001.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
