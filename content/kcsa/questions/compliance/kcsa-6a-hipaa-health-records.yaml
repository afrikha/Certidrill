id: kcsa-6a-hipaa-health-records
objective: "6.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A hospital group in the United States moves its patient records application to a Kubernetes cluster. The application stores the medical records of its patients in electronic form. Which regulation sets the safeguards that this data requires?
body:
  options:
    - id: a
      text: { en: "PCI DSS" }
    - id: b
      text: { en: "SOC 2" }
    - id: c
      text: { en: "HIPAA" }
    - id: d
      text: { en: "ISO/IEC 27001" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Health Insurance Portability and Accountability Act (HIPAA) is the United States law that protects health information. Its Security Rule requires administrative, physical and technical safeguards for electronic protected health information (ePHI), which the hospital's records are.
  options:
    a:
      en: |
        PCI DSS protects payment card data. It would apply only to systems that store, process or transmit card numbers, not to medical records.
    b:
      en: |
        SOC 2 is an auditor's report on a service organisation's controls that customers may request. It is not a regulation that applies to health data.
    d:
      en: |
        ISO/IEC 27001 is an international standard for an information security management system that an organisation chooses to certify against. It is not the law that governs health records in the United States.
references:
  - title: "SP 800-66 Rev. 2, Implementing the Health Insurance Portability and Accountability Act (HIPAA) Security Rule: A Cybersecurity Resource Guide"
    url: https://csrc.nist.gov/pubs/sp/800/66/r2/final
