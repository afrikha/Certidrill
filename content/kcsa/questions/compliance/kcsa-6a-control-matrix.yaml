id: kcsa-6a-control-matrix
objective: "6.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before a SOC 2 audit, a platform team prepares a document that lists each requirement it must meet, the Kubernetes controls that implement the requirement, and where the evidence for each control comes from. What is this document?
body:
  options:
    - id: a
      text: { en: "A software bill of materials" }
    - id: b
      text: { en: "A threat model" }
    - id: c
      text: { en: "A control matrix" }
    - id: d
      text: { en: "An audit policy" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A control matrix maps each requirement of a framework to the controls that meet it and to the evidence that proves them, for example "need-to-know access" to namespace-scoped RBAC and to RBAC reviews. Building it is the first step of preparing an audit, and it is the basis of continuous compliance.
  options:
    a:
      en: |
        A software bill of materials lists the components and dependencies of a software artifact. It is evidence for some controls, not the mapping of requirements to controls.
    b:
      en: |
        A threat model identifies what can go wrong in the system and the controls against it. It starts from threats, not from the requirements of a compliance framework.
    d:
      en: |
        An audit policy is the API server configuration that decides which requests are logged and at which level. It produces evidence, but it does not map requirements to controls.
references:
  - title: The Rosetta Stone Guide to Compliance in a Cloud Native World
    url: https://www.cncf.io/wp-content/uploads/2020/08/Final-RosettaStoneGuidetoComplianceinaCloudNativeWorld.pdf
