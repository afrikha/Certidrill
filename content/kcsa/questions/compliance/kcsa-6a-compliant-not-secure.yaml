id: kcsa-6a-compliant-not-secure
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After an external audit, Example Corp's Kubernetes platform is declared compliant with the framework that its customers require. A manager proposes to pause threat modeling and vulnerability scanning until the next audit, one year later. What is the main problem with this proposal?
body:
  options:
    - id: a
      text: { en: "Compliance shows that the required controls existed when audited; it does not prove the platform is secure against new threats." }
    - id: b
      text: { en: "Compliance frameworks forbid any security work between two audits unless it is recorded as a formal exception." }
    - id: c
      text: { en: "An external audit covers only the control plane of a cluster, so the workloads have never been assessed at all." }
    - id: d
      text: { en: "A compliance attestation becomes invalid as soon as a new Kubernetes minor version is released upstream." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Compliance and security are complementary, not interchangeable: a compliant system is not guaranteed to be secure. New vulnerabilities and attack techniques appear every week and a cluster changes constantly, so threat modeling and scanning must continue between audits.
  options:
    b:
      en: |
        No framework forbids security work between audits. Frameworks expect controls such as vulnerability management to operate continuously.
    c:
      en: |
        The scope of an audit is set by the framework and the data involved, and it normally includes the workloads that handle the regulated data. The statement is false and does not describe the real problem.
    d:
      en: |
        An attestation is not tied to upstream Kubernetes releases. The issue is that security must be maintained continuously, not the validity of the report.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
