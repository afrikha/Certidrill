id: kcsa-6b-falco-alert-only
objective: "6.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Falco runs on every node of a cluster with its default configuration. An attacker opens an interactive shell in a running container of the `shop` namespace, and a Falco rule that detects shells in containers matches the event.

    What does Falco do?
body:
  options:
    - id: a
      text: { en: "It kills the shell process and restarts the container" }
    - id: b
      text: { en: "It rejects the exec request at the API server" }
    - id: c
      text: { en: "It cordons the node so that no new Pods are scheduled on it" }
    - id: d
      text: { en: "It emits an alert to its configured outputs" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Falco is a runtime detection tool: when an event matches a rule condition, it emits the rule's output as an alert, with a priority, to its configured channels (standard output, a file, syslog, a program or an HTTP endpoint). Falcosidekick can forward alerts to other systems, where a responder or an automation decides what to do.
  options:
    a:
      en: |
        Falco detects and alerts; it does not kill processes or restart containers. Any response has to be done by a person or another tool that reacts to the alert.
    b:
      en: |
        Falco observes system calls on the node, after the request has been allowed. Blocking an exec request needs RBAC or admission control at the API server.
    c:
      en: |
        Falco does not change the state of nodes or the scheduler. Cordoning is a manual or automated response outside Falco.
references:
  - title: "The Falco Project"
    url: https://falco.org/docs/
  - title: "Basic Elements of Falco Rules"
    url: https://falco.org/docs/concepts/rules/basic-elements/
