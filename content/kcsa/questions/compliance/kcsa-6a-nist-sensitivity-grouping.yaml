id: kcsa-6a-nist-sensitivity-grouping
objective: "6.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster runs a public marketing website and an internal application that processes customer financial records. Each application has its own namespace, but all their Pods share the same pool of worker nodes. Following NIST SP 800-190, what should the team change?
body:
  options:
    - id: a
      text: { en: "Nothing, because separate namespaces already give the isolation that the guide recommends" }
    - id: b
      text: { en: "Run the two applications on separate nodes, for example with taints, tolerations and node affinity" }
    - id: c
      text: { en: "Pull the images of the two applications from two different container registries" }
    - id: d
      text: { en: "Add a different label to each Deployment so that the scheduler spreads their Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SP 800-190 recommends grouping on a single host OS kernel only containers with the same purpose, sensitivity and threat posture, because all containers on a node share its kernel. Dedicated nodes (or a separate cluster) for the financial application mean that a compromise of the public website does not land on the same host as the sensitive data.
  options:
    a:
      en: |
        Namespaces separate names, RBAC and policies in the API, but Pods of different namespaces can still run on the same node and share its kernel. SP 800-190 names mixing workload sensitivity levels on the same hosts as an orchestrator risk.
    c:
      en: |
        Using two registries does not change where the Pods run. The two applications would still share nodes and kernels.
    d:
      en: |
        A different label alone does not change scheduling, and spreading Pods across nodes is not separation: both applications could still run on every node.
references:
  - title: SP 800-190, Application Container Security Guide
    url: https://csrc.nist.gov/pubs/sp/800/190/final
