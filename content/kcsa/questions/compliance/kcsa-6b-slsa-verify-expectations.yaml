id: kcsa-6b-slsa-verify-expectations
objective: "6.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Example Corp verifies the SLSA provenance of every image before deployment. Its verifier checks the provenance signature, checks that the subject digest matches the image, and checks that `builder.id` is a trusted Build L3 platform.

    An attacker cannot write to the `example-corp/cart` repository, but can start builds on the same trusted platform from a repository the attacker controls and push the result to the registry under the cart image name. Which additional check blocks these images?
body:
  options:
    - id: a
      text: { en: "Check that the `predicateType` is the SLSA provenance v1 type" }
    - id: b
      text: { en: "Check that the provenance contains a `byproducts` entry with the build logs" }
    - id: c
      text: { en: "Check that the `externalParameters` name the expected source repository and ref" }
    - id: d
      text: { en: "Check that the provenance `metadata` has a recent `finishedOn` timestamp" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The attacker's images are genuinely built and signed by the trusted platform, so signature, digest and builder checks all pass. SLSA verification also compares the provenance with expectations tied to the package name, such as the canonical source repository and the `externalParameters`. An image built from another repository fails that comparison.
  options:
    a:
      en: |
        The attacker's provenance is produced by the same platform and has the same SLSA provenance predicate type, so this check passes.
    b:
      en: |
        Byproducts such as logs are optional debugging information. Their presence says nothing about which source the image was built from.
    d:
      en: |
        The attacker can trigger a build at any time, so a recent timestamp proves nothing about the origin of the image.
references:
  - title: "SLSA • Build: Verifying artifacts"
    url: https://slsa.dev/spec/v1.2/verifying-artifacts
  - title: "SLSA • Build: Provenance"
    url: https://slsa.dev/spec/v1.2/build-provenance
