id: kcsa-6b-sscbp-publisher
objective: "6.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team wants cloud native guidance that organizes supply chain security recommendations by stage: source code, materials, build pipelines, artifacts, and deployments. It finds the Software Supply Chain Best Practices paper, now in version 2.

    Which group published this paper?
body:
  options:
    - id: a
      text: { en: "The Center for Internet Security (CIS)" }
    - id: b
      text: { en: "The National Institute of Standards and Technology (NIST)" }
    - id: c
      text: { en: "The Kubernetes Special Interest Group for Auth (SIG Auth)" }
    - id: d
      text: { en: "The CNCF Technical Advisory Group for Security (TAG Security)" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Software Supply Chain Best Practices paper comes from the supply chain security working group of the CNCF TAG Security. Version 1 was published in May 2021, and version 2 updates it with personas and current tooling for attestations, SBOMs and VEX.
  options:
    a:
      en: |
        CIS publishes the CIS Benchmarks, including the CIS Kubernetes Benchmark that kube-bench checks. It did not write this paper.
    b:
      en: |
        NIST publishes guides such as SP 800-190, the Application Container Security Guide. It is not the author of the CNCF paper.
    c:
      en: |
        SIG Auth works on Kubernetes authentication, authorization and related features. The supply chain paper is a CNCF TAG Security publication.
references:
  - title: "Software Supply Chain Best Practices v2"
    url: https://tag-security.cncf.io/community/working-groups/supply-chain-security/supply-chain-security-paper-v2/sscbpv2/
