id: kcsa-6a-nist-container-host-os
objective: "6.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp is choosing the operating system of its Kubernetes worker nodes. Following NIST SP 800-190, which choice reduces the attack surface of the hosts?
body:
  options:
    - id: a
      text: { en: "A container-specific host OS that includes only the components needed to run containers" }
    - id: b
      text: { en: "A general-purpose server distribution with debugging tools installed for troubleshooting" }
    - id: c
      text: { en: "The same workstation image that developers use, so that builds behave identically" }
    - id: d
      text: { en: "Any operating system, provided that every container image uses a distroless base" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      NIST SP 800-190 recommends container-specific host operating systems instead of general-purpose ones. A minimal OS built only to run containers has fewer services, packages and network-accessible components, so it offers fewer entry points to an attacker.
  options:
    b:
      en: |
        A general-purpose distribution with extra tools increases the attack surface, which is one of the host OS risks that SP 800-190 names. Troubleshooting tools are also useful to an attacker who reaches the node.
    c:
      en: |
        A developer workstation image contains many packages that a node does not need. Consistency of builds does not justify the larger attack surface on production hosts.
    d:
      en: |
        Distroless images reduce the attack surface inside containers, but the host OS remains a separate layer. All containers share its kernel, so its own attack surface still matters.
references:
  - title: SP 800-190, Application Container Security Guide
    url: https://csrc.nist.gov/pubs/sp/800/190/final
