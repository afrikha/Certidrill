id: kcsa-6a-cis-benchmark-config
objective: "6.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team needs a consensus-based list of configuration recommendations for Kubernetes components, such as the flags of the API server and the file permissions of the kubelet configuration, each with a procedure to audit and to remediate it. Which document should the team use?
body:
  options:
    - id: a
      text: { en: "NIST SP 800-190" }
    - id: b
      text: { en: "CIS Kubernetes Benchmark" }
    - id: c
      text: { en: "MITRE ATT&CK Containers matrix" }
    - id: d
      text: { en: "PCI DSS" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The CIS Kubernetes Benchmark, published by the Center for Internet Security through a community consensus process, is a set of secure configuration recommendations for the control plane, etcd, worker nodes and policies. Each recommendation explains how to check the setting and how to fix it, and tools such as kube-bench automate the checks.
  options:
    a:
      en: |
        NIST SP 800-190 describes the risks of images, registries, orchestrators, containers and host operating systems and the countermeasures for them. It is technology-neutral and does not list Kubernetes flags or file permissions.
    c:
      en: |
        The ATT&CK Containers matrix describes adversary tactics and techniques observed in real attacks. It is a threat knowledge base, not a configuration guide.
    d:
      en: |
        PCI DSS states requirements for protecting payment card data. It says what must be achieved, not how to configure Kubernetes components.
references:
  - title: aquasecurity/kube-bench
    url: https://github.com/aquasecurity/kube-bench
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
