id: kcsa-6b-slsa-scope-limits
objective: "6.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The image `registry.example.com/shop/cart` comes with signed SLSA provenance from a trusted build platform that meets SLSA Build L3. The verification of the provenance succeeds.

    Which statement about this image is true?
body:
  options:
    - id: a
      text: { en: "It contains no known vulnerabilities, because Build L3 platforms are hardened" }
    - id: b
      text: { en: "Each of its dependencies was also built on a SLSA Build L3 platform" }
    - id: c
      text: { en: "Each change to its source code was reviewed by two people before the build" }
    - id: d
      text: { en: "Its build origin can be trusted, but its code may still contain vulnerabilities" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Build L3 gives strong confidence that the image was built by the trusted platform from the recorded inputs, without tampering during or after the build. SLSA does not say whether the code follows secure coding practices or is free of vulnerabilities, so scanning and SBOM-based vulnerability management are still needed.
  options:
    a:
      en: |
        A hardened build protects the build process, not the content. A vulnerable library built faithfully on an L3 platform is still vulnerable.
    b:
      en: |
        The SLSA level of an artifact is independent of the levels of its dependencies. No current level covers an artifact together with its transitive dependencies.
    c:
      en: |
        The Build track says nothing about code review. Protection of the source and its history is the subject of the separate SLSA Source track.
references:
  - title: "SLSA • About SLSA"
    url: https://slsa.dev/spec/v1.2/about
  - title: "SLSA • Build: Track Basics"
    url: https://slsa.dev/spec/v1.2/build-track-basics
