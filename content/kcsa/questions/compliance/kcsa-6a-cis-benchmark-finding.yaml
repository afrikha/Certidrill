id: kcsa-6a-cis-benchmark-finding
objective: "6.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp reviews four security findings in its cluster. Which finding is the kind of issue that the CIS Kubernetes Benchmark is designed to detect?
body:
  options:
    - id: a
      text: { en: "A container image includes a library that has a critical CVE." }
    - id: b
      text: { en: "A process in a running container has started mining cryptocurrency." }
    - id: c
      text: { en: "A Deployment runs an image that the release pipeline did not sign." }
    - id: d
      text: { en: "The kube-apiserver manifest file on control plane nodes is writable by all users." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The CIS Kubernetes Benchmark is a list of secure configuration recommendations for the Kubernetes components, including the ownership and permissions of control plane configuration files, component flags and policies. A world-writable API server manifest is a configuration defect of exactly that kind.
  options:
    a:
      en: |
        Known vulnerabilities in image libraries are found by image scanners such as Trivy. The CIS Benchmark checks how the cluster is configured, not the content of application images.
    b:
      en: |
        Cryptomining in a running container is a runtime event, detected by tools such as Falco. The CIS Benchmark assesses static configuration.
    c:
      en: |
        Image signatures are verified at admission with tools such as Sigstore's policy-controller, Kyverno or Gatekeeper. The CIS Benchmark does not check the provenance of individual images.
references:
  - title: aquasecurity/kube-bench
    url: https://github.com/aquasecurity/kube-bench
