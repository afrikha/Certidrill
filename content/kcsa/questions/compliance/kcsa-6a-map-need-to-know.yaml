id: kcsa-6a-map-need-to-know
objective: "6.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A PCI DSS requirement states that access to cardholder data must be limited to the people whose job requires it. In the cluster, this data is reachable through Secrets in the `payments` namespace. Which Kubernetes control maps most directly to this requirement?
body:
  options:
    - id: a
      text: { en: "An audit policy that records requests on Secrets in `payments` at the Metadata level" }
    - id: b
      text: { en: "Encryption at rest of Secrets with an EncryptionConfiguration on the API server" }
    - id: c
      text: { en: "A ResourceQuota that limits the number of Secrets in the `payments` namespace" }
    - id: d
      text: { en: "Roles and RoleBindings in `payments` that let only the required identities read the Secrets" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The requirement is about need-to-know access, which in Kubernetes is implemented with RBAC least privilege: namespace-scoped Roles and RoleBindings that grant `get` on the Secrets only to the identities that need them. Note that `list` and `watch` also reveal Secret contents, so they must be restricted too.
  options:
    a:
      en: |
        Audit logging maps to the logging and monitoring requirements. It records who accessed the Secrets but does not limit who can access them.
    b:
      en: |
        Encryption at rest maps to the protection of stored data. Anyone whom RBAC allows to read the Secrets still receives them in clear through the API.
    c:
      en: |
        A ResourceQuota limits resource consumption in a namespace. It has nothing to do with who can read the data.
references:
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
