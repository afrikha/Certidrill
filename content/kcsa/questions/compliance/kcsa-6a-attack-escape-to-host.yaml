id: kcsa-6a-attack-escape-to-host
objective: "6.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker gets a shell in a container that runs with `privileged: true`. From that shell, the attacker mounts the node's root disk and starts processes directly on the node, outside any container. Which technique of the MITRE ATT&CK Containers matrix describes this step?
body:
  options:
    - id: a
      text: { en: "Deploy Container" }
    - id: b
      text: { en: "Escape to Host" }
    - id: c
      text: { en: "Container and Resource Discovery" }
    - id: d
      text: { en: "Implant Internal Image" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Escape to Host (T1611) describes breaking out of a container to reach the underlying host, for example through a privileged container or a bind mount of the host file system. Mitigations include the Pod Security Standards, which block privileged containers and host mounts, and not running containers as root.
  options:
    a:
      en: |
        Deploy Container (T1610) is creating a new container, for example through the Kubernetes API, to run malicious code. The attacker here works inside an existing container and breaks out of it.
    c:
      en: |
        Container and Resource Discovery (T1613) is gathering information about Pods, nodes, images and deployments. Starting processes on the node goes beyond discovery.
    d:
      en: |
        Implant Internal Image (T1525) is adding malicious code to an image in the victim's registry to persist. No image is modified in this scenario.
references:
  - title: Escape to Host, Technique T1611 - Enterprise
    url: https://attack.mitre.org/techniques/T1611/
