id: kcsa-6b-falco-event-source
objective: "6.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team deploys Falco as a DaemonSet with its default driver. It wants to understand how Falco notices that a process in a container wrote a file below `/etc`, even though no Kubernetes API request was made.

    Where does Falco get this information?
body:
  options:
    - id: a
      text: { en: "From the system calls of the node's kernel, read through an eBPF probe" }
    - id: b
      text: { en: "From the admission requests that the API server sends to its webhook" }
    - id: c
      text: { en: "From the image layers, which it compares with the registry copy" }
    - id: d
      text: { en: "From the container's standard output, collected by the kubelet" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Falco monitors Linux kernel events, mainly system calls, on each node, with the modern eBPF probe as its default driver (a kernel module is the other option). A file write below `/etc` is a system call that a rule condition can match, whether or not anything went through the Kubernetes API. Plugins add other event sources, such as Kubernetes audit events.
  options:
    b:
      en: |
        Falco is not an admission webhook, and a write inside a running container creates no API request. Admission webhooks are how policy engines such as Kyverno and Gatekeeper see requests.
    c:
      en: |
        Falco does not scan images. Comparing image content with vulnerability data is the job of scanners such as Trivy.
    d:
      en: |
        A process that writes a file usually prints nothing about it. Falco relies on kernel events, not on application logs.
references:
  - title: "The Falco Project"
    url: https://falco.org/docs/
