id: kcsa-6b-kube-bench-job-results
objective: "6.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cluster administrator runs kube-bench as a Kubernetes Job with the `job.yaml` file provided by the project.

    ```bash
    kubectl apply -f job.yaml
    ```

    Where does the administrator read the results of the checks?
body:
  options:
    - id: a
      text: { en: "In a `PolicyReport` resource created in the Job's namespace" }
    - id: b
      text: { en: "In the logs of the Pod that the Job created" }
    - id: c
      text: { en: "In the `status` field of the Job object" }
    - id: d
      text: { en: "In the audit log of the Kubernetes API server" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When kube-bench runs as a Job, it prints its report to standard output, so the results are read from the Pod's logs, for example with `kubectl logs job/kube-bench`. Output flags such as `--json` or `--junit` change the format for tools that collect the results.
  options:
    a:
      en: |
        `PolicyReport` resources are produced by policy engines such as Kyverno. kube-bench does not create them.
    c:
      en: |
        The Job status only records whether its Pods succeeded or failed, not the result of each benchmark check.
    d:
      en: |
        The API server audit log records API requests. The checks run inside the kube-bench container, and their results are not API requests.
references:
  - title: "kube-bench/docs/running.md at main · aquasecurity/kube-bench · GitHub"
    url: https://github.com/aquasecurity/kube-bench/blob/main/docs/running.md
