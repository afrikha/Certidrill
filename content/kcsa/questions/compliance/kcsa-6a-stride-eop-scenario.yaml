id: kcsa-6a-stride-eop-scenario
objective: "6.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team classifies the threats of its cluster with STRIDE. Which of the following threats belongs to the Elevation of privilege category?
body:
  options:
    - id: a
      text: { en: "A user allowed only to create Pods in `dev` runs a Pod as a `dev` ServiceAccount that has permissions the user lacks." }
    - id: b
      text: { en: "A compromised build job changes a configuration file inside an image just before the image is pushed." }
    - id: c
      text: { en: "A client sends a flood of `list` requests that makes the API server slow for every other user." }
    - id: d
      text: { en: "An attacker on the Pod network captures unencrypted HTTP traffic between two services of the cluster." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Elevation of privilege is gaining permissions beyond those granted, which violates authorization. Because a Pod can run as any ServiceAccount of its namespace, permission to create Pods implicitly grants the API access of every ServiceAccount there, so the user gains rights that RBAC did not give them directly.
  options:
    b:
      en: |
        Changing the content of an image modifies an artifact without authorization: Tampering, which violates integrity.
    c:
      en: |
        Flooding the API server so that it cannot serve other users violates availability: Denial of service.
    d:
      en: |
        Reading traffic that one is not meant to see violates confidentiality: Information disclosure.
references:
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
