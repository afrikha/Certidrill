id: kcsa-6b-sscbp-source-stage
objective: "6.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Example Corp is applying the CNCF Software Supply Chain Best Practices. Its first project requires signed commits, multi-factor authentication for contributors, branch protection and an independent review of every change.

    Which stage of the supply chain do these controls secure?
body:
  options:
    - id: a
      text: { en: "Source code" }
    - id: b
      text: { en: "Materials" }
    - id: c
      text: { en: "Build pipelines" }
    - id: d
      text: { en: "Deployments and distribution" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The paper groups commit signing, strong authentication of contributors, protected branches and two-party review under the source code stage. These controls make sure that only reviewed changes from authenticated people enter the code that is built.
  options:
    b:
      en: |
        The materials stage covers second- and third-party dependencies: verifying their checksums and signatures, scanning them and requiring SBOMs and VEX from suppliers.
    c:
      en: |
        The build pipelines stage covers the build workers: single-use and isolated workers, restricted network access, reproducible builds and per-step attestations.
    d:
      en: |
        The deployments and distribution stage covers verifying artifacts and their metadata where they are consumed, for example with an admission controller, and secure distribution with The Update Framework (TUF).
references:
  - title: "Software Supply Chain Best Practices v2"
    url: https://tag-security.cncf.io/community/working-groups/supply-chain-security/supply-chain-security-paper-v2/sscbpv2/
