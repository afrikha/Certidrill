id: kcsa-6a-soc2-report
objective: "6.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company runs its platform on Kubernetes. Its business customers ask for a report in which an auditor gives an opinion on the company's controls relevant to security, availability, processing integrity, confidentiality and privacy. Which report should the company provide?
body:
  options:
    - id: a
      text: { en: "An ISO/IEC 27001 certificate" }
    - id: b
      text: { en: "A CIS Kubernetes Benchmark scan result" }
    - id: c
      text: { en: "A NIST SP 800-190 risk assessment" }
    - id: d
      text: { en: "A SOC 2 report" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A SOC 2 report is issued by an auditor and covers a service organisation's controls against the Trust Services Criteria: security, availability, processing integrity, confidentiality and privacy. Business customers of SaaS providers commonly request it as proof that the provider's controls are in place.
  options:
    a:
      en: |
        An ISO/IEC 27001 certificate shows that the company's information security management system conforms to that standard. It is not an auditor's opinion organised around the five criteria the customers named.
    b:
      en: |
        A CIS Kubernetes Benchmark scan checks the configuration of cluster components. It is a technical self-assessment, not an auditor's report on the company's controls.
    c:
      en: |
        NIST SP 800-190 describes container risks and countermeasures. An assessment based on it is useful guidance, but it is not the attestation report that the customers ask for.
references:
  - title: The Rosetta Stone Guide to Compliance in a Cloud Native World
    url: https://www.cncf.io/wp-content/uploads/2020/08/Final-RosettaStoneGuidetoComplianceinaCloudNativeWorld.pdf
