id: kcsa-6a-prioritize-likelihood-impact
objective: "6.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A threat model of Example Corp's cluster lists four threats. The team can implement only one new control this quarter. Which threat should it address first?
body:
  options:
    - id: a
      text: { en: "A test namespace has no ResourceQuota; likelihood low, impact limited to test workloads." }
    - id: b
      text: { en: "An internal dashboard shows build durations to every employee; likelihood low, impact low." }
    - id: c
      text: { en: "The API server is reachable from the internet and accepts anonymous requests; likelihood high, impact cluster-wide." }
    - id: d
      text: { en: "A yearly batch job runs on an isolated node with an old base image; likelihood low, impact limited to that job." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Threats are ranked by risk, the combination of likelihood and impact. An internet-exposed API server that accepts anonymous requests is easy to reach and sits at the main trust boundary of the cluster, so a successful attack can lead to a full cluster takeover: it comes first.
  options:
    a:
      en: |
        A missing quota in a test namespace can let one workload exhaust test resources, but both likelihood and impact are low. It can wait or be accepted.
    b:
      en: |
        Showing build durations internally exposes little sensitive information. It is the lowest risk of the list.
    d:
      en: |
        The old base image should be rebuilt, but the job runs rarely on an isolated node, which limits both the chance and the effect of an attack.
references:
  - title: OWASP Threat Modeling Project
    url: https://owasp.org/www-project-threat-model/
