id: kcsa-6b-trivy-ignore-unfixed
objective: "6.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pipeline runs `trivy image --severity HIGH,CRITICAL --exit-code 1` on each new image. The build often fails on vulnerabilities for which the distribution has not released any fixed package yet, so developers cannot act on them. The team wants the build to fail only on high and critical vulnerabilities that have a fix, without maintaining a list of CVE IDs.

    Which option should the team add?
body:
  options:
    - id: a
      text: { en: "`--ignore-unfixed`" }
    - id: b
      text: { en: "`--exit-code 0`" }
    - id: c
      text: { en: "`--scanners secret`" }
    - id: d
      text: { en: "`--format cyclonedx`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `--ignore-unfixed` hides vulnerabilities that have no fixed version available, so only actionable findings are reported and can fail the build through `--exit-code 1`. The alternative, a `.trivyignore` file, suppresses findings by ID, which is the list the team does not want to maintain.
  options:
    b:
      en: |
        `--exit-code 0` makes the step always succeed, so even fixable critical vulnerabilities would no longer fail the build.
    c:
      en: |
        `--scanners secret` would scan only for secrets and stop vulnerability scanning altogether.
    d:
      en: |
        `--format cyclonedx` changes the output to a CycloneDX SBOM. It does not filter vulnerabilities.
references:
  - title: "trivy/docs/guide/configuration/filtering.md at main · aquasecurity/trivy · GitHub"
    url: https://github.com/aquasecurity/trivy/blob/main/docs/guide/configuration/filtering.md
