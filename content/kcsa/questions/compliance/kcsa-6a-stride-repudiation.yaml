id: kcsa-6a-stride-repudiation
objective: "6.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Three administrators share one cluster-admin client certificate, and API server auditing is disabled. After a production Deployment is deleted, nobody can prove which administrator deleted it. Which STRIDE category does this threat belong to?
body:
  options:
    - id: a
      text: { en: "Spoofing" }
    - id: b
      text: { en: "Tampering" }
    - id: c
      text: { en: "Repudiation" }
    - id: d
      text: { en: "Elevation of privilege" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Repudiation is the threat that someone can deny an action because the system cannot prove who performed it; it violates non-repudiation. Individual identities for each administrator and API server audit logs stored outside the cluster are the controls that answer it.
  options:
    a:
      en: |
        Spoofing is pretending to be another identity, which violates authentication. Here the administrators are legitimate holders of the shared credential; the problem is proving which of them acted.
    b:
      en: |
        Tampering is the unauthorized modification of data or code, which violates integrity. The deletion was done with valid administrator rights; what is missing is accountability.
    d:
      en: |
        Elevation of privilege means gaining permissions one should not have. Each administrator already had cluster-admin rights.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
