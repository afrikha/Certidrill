id: kcsa-6a-attack-technique-many-tactics
objective: "6.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security engineer reviews the MITRE ATT&CK Containers matrix and notices that the technique Valid Accounts appears in the Initial Access, Persistence and Privilege Escalation columns. What explains this?
body:
  options:
    - id: a
      text: { en: "One technique can serve several adversary goals, so ATT&CK lists it under every tactic it supports." }
    - id: b
      text: { en: "The matrix keeps duplicate entries from older ATT&CK versions for backward compatibility." }
    - id: c
      text: { en: "Each column of the matrix is a different platform, and Valid Accounts exists on three platforms." }
    - id: d
      text: { en: "Tactics are steps that every attack follows in order, and Valid Accounts is needed at each step." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Columns of the matrix are tactics (goals) and the entries are techniques (methods). Using legitimate credentials can give an attacker initial access, keep access over time and give higher privileges, so the same technique is listed under each of these tactics; other techniques, such as Scheduled Task/Job, also appear under several tactics.
  options:
    b:
      en: |
        The repeated entries are not leftovers: they show that the same method serves several goals. The technique has a single identifier in every column.
    c:
      en: |
        The Containers matrix covers one platform, and its columns are tactics, not platforms.
    d:
      en: |
        Tactics are not a mandatory sequence. An attack uses only some tactics, in any order, and the matrix is not a kill chain that every adversary follows.
references:
  - title: Matrix - Enterprise - Containers
    url: https://attack.mitre.org/matrices/enterprise/containers/
