id: kcsa-6b-verify-at-deployment
objective: "6.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp's package registry verifies the SLSA provenance of each image when the image is uploaded. The platform team proposes to verify the provenance again in the cluster, at admission time, before Pods run.

    What does this second verification add?
body:
  options:
    - id: a
      text: { en: "It raises the SLSA Build level of each image from L2 to L3" }
    - id: b
      text: { en: "It removes the need for the build platform to sign the provenance" }
    - id: c
      text: { en: "It confirms that the image has no known vulnerabilities at deployment time" }
    - id: d
      text: { en: "It detects images replaced or altered after upload, in the registry or in transit" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SLSA lists verification at upload by the package ecosystem and verification by the consumer before use, such as at deployment, as complementary options. Verification at the consumer also covers a compromised registry and tampering in transit, which an upload-time check cannot see. The CNCF guidance likewise recommends verifying supply chain metadata at the deployment gate, for example with a Kubernetes admission controller.
  options:
    a:
      en: |
        The Build level depends on the build platform that produced the provenance (its `builder.id`), not on how many times the provenance is verified.
    b:
      en: |
        Verification relies on the signature: without signed provenance there is nothing authentic to verify, at upload or at deployment.
    c:
      en: |
        Provenance describes how the image was built, not which vulnerabilities it contains. Vulnerabilities are found by scanning.
references:
  - title: "SLSA • Build: Verifying artifacts"
    url: https://slsa.dev/spec/v1.2/verifying-artifacts
