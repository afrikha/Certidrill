id: kcsa-6a-residual-risk-accept
objective: "6.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A threat identified in the threat model has a low likelihood and a low impact. The only control available would cost more than the damage it could prevent. What should the team do with this threat?
body:
  options:
    - id: a
      text: { en: "Accept the risk and record the decision and its reason in the threat model." }
    - id: b
      text: { en: "Delete the threat from the model so that the report shows no open items." }
    - id: c
      text: { en: "Block every release until a control for the threat has been implemented." }
    - id: d
      text: { en: "Rate the threat as high impact so that it is handled with the critical ones." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Risk management can mitigate, transfer or accept a risk according to the organisation's risk tolerance. A low-likelihood, low-impact threat whose control costs more than the possible damage is a candidate for acceptance, and the decision is documented so that it can be reviewed when the system changes.
  options:
    b:
      en: |
        Removing a known threat hides it from later reviews. Accepted risks stay in the model with the decision that was taken.
    c:
      en: |
        Blocking all releases for a low risk spends effort out of proportion with the danger and delays the controls that matter more.
    d:
      en: |
        Changing the rating to force action falsifies the model, and the prioritization of every other threat becomes unreliable.
references:
  - title: Cloud Native Security Whitepaper
    url: https://tag-security.cncf.io/community/resources/security-whitepaper/v2/cloud-native-security-whitepaper/
