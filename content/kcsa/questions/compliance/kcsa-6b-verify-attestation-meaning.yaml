id: kcsa-6b-verify-attestation-meaning
objective: "6.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A deployment pipeline runs the following command before it deploys an image, and the command succeeds.

    ```bash
    cosign verify-attestation --type cyclonedx \
      --certificate-identity https://ci.example.com/release@refs/heads/main \
      --certificate-oidc-issuer https://issuer.example.com \
      registry.example.com/shop/cart@sha256:4b1c...
    ```

    What does this success prove?
body:
  options:
    - id: a
      text: { en: "The image has no critical vulnerabilities in the components listed by its SBOM" }
    - id: b
      text: { en: "An attestation of that type for this digest was signed by the expected identity" }
    - id: c
      text: { en: "The SBOM lists every component of the image, including statically linked libraries" }
    - id: d
      text: { en: "The image was built on a hardened platform that meets SLSA Build L3" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `cosign verify-attestation` checks that an in-toto attestation of the given predicate type exists for the image and that its signature verifies, here against a keyless certificate issued to the given identity by the given OIDC issuer. It proves who attested and to which image digest the attestation applies. To check the content of the predicate, a CUE or Rego policy can be added with `--policy`.
  options:
    a:
      en: |
        A signed SBOM is a list of components, not a vulnerability verdict. Finding vulnerabilities needs a scan of the image or of its SBOM.
    c:
      en: |
        The signature proves who produced the SBOM, not that the SBOM is complete. Its accuracy depends on the tool that generated it.
    d:
      en: |
        The command verifies a CycloneDX attestation, not SLSA provenance. The build level would need a provenance attestation and a check of its `builder.id`.
references:
  - title: "In-Toto Attestations"
    url: https://docs.sigstore.dev/cosign/verifying/attestation/
  - title: "cosign/doc/cosign_attest.md at main · sigstore/cosign · GitHub"
    url: https://github.com/sigstore/cosign/blob/main/doc/cosign_attest.md
