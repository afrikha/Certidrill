id: kcsa-6a-nist-800-190-guide
objective: "6.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security architect wants a vendor-neutral NIST publication that explains the main security risks of container images, registries, orchestrators, containers and host operating systems, with countermeasures for each. Which publication should the architect read?
body:
  options:
    - id: a
      text: { en: "NIST SP 800-53" }
    - id: b
      text: { en: "NIST SP 800-204" }
    - id: c
      text: { en: "NIST SP 800-66" }
    - id: d
      text: { en: "NIST SP 800-190" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      NIST SP 800-190, the Application Container Security Guide (September 2017), explains the security concerns of application containers. Its major risks are organised by core component (image, registry, orchestrator, container, host OS), and it gives countermeasures for each of them.
  options:
    a:
      en: |
        NIST SP 800-53 is the general catalog of security and privacy controls for information systems. It is not organised around container components.
    b:
      en: |
        NIST SP 800-204 covers security strategies for microservices-based applications. It does not provide the per-component analysis of container risks that the architect needs.
    c:
      en: |
        NIST SP 800-66 is a resource guide for implementing the HIPAA Security Rule. It addresses the protection of health information, not container technology.
references:
  - title: SP 800-190, Application Container Security Guide
    url: https://csrc.nist.gov/pubs/sp/800/190/final
