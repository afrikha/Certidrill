id: kcsa-6b-slsa-provenance-definition
objective: "6.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A customer asks the platform team of Example Corp to publish SLSA provenance with every container image it ships.

    What information does SLSA provenance provide?
body:
  options:
    - id: a
      text: { en: "Which build platform produced the artifact, from which sources and parameters" }
    - id: b
      text: { en: "Which packages, libraries and licenses the artifact contains, with versions" }
    - id: c
      text: { en: "Which known vulnerabilities affect the artifact and whether they are exploitable" }
    - id: d
      text: { en: "Which nodes of the cluster are allowed to pull and run the artifact" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SLSA provenance is verifiable information about how an artifact was produced: the identity of the build platform (`builder.id`), the build type, the external parameters such as the source repository and ref, and the resolved dependencies. It is expressed as an in-toto attestation whose `subject` identifies the artifacts by digest.
  options:
    b:
      en: |
        A list of components, versions and licenses is a software bill of materials (SBOM), in a format such as SPDX or CycloneDX, not provenance.
    c:
      en: |
        Exploitability statements are the purpose of VEX documents, and vulnerability lists come from scanners. Provenance describes the build, not the vulnerabilities.
    d:
      en: |
        Provenance says nothing about where an artifact may run. Placement is controlled in Kubernetes with scheduling constraints such as node selectors, taints and tolerations.
references:
  - title: "SLSA • Build: Provenance"
    url: https://slsa.dev/spec/v1.2/build-provenance
