id: kcsa-6b-kube-bench-exit-code
objective: "6.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A scheduled compliance job runs `kube-bench run --targets node --exit-code 1` and marks the run as failed when the exit code is not 0. Today's run prints the following results (abridged).

    ```text
    [PASS] 4.2.1 Ensure that the --anonymous-auth argument is set to false (Automated)
    [PASS] 4.2.2 Ensure that the --authorization-mode argument is not set to AlwaysAllow (Automated)
    [WARN] 4.2.4 Verify that the --read-only-port argument is set to 0 (Manual)
    ```

    What is the outcome of the run?
body:
  options:
    - id: a
      text: { en: "It exits with code 1, because a WARN result counts as a failed check" }
    - id: b
      text: { en: "It exits with code 0, because no check failed; the WARN result still needs review" }
    - id: c
      text: { en: "It sets the read-only port to 0, then exits with code 0 once every check passes" }
    - id: d
      text: { en: "It exits with code 1, because `--exit-code` makes every run return that code" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `--exit-code` sets the code that kube-bench returns when one or more checks fail; if none failed, it returns 0. A WARN result is not counted as a FAIL, so this run succeeds. The check marked Manual still has to be reviewed by a person, and that review is part of the compliance evidence.
  options:
    a:
      en: |
        The kube-bench documentation states that WARN does not count as FAIL for the exit code.
    c:
      en: |
        kube-bench never modifies the node configuration. It prints a remediation that an administrator applies.
    d:
      en: |
        The custom exit code is returned only when at least one check fails. A run without failures returns 0.
references:
  - title: "kube-bench/docs/flags-and-commands.md at main · aquasecurity/kube-bench · GitHub"
    url: https://github.com/aquasecurity/kube-bench/blob/main/docs/flags-and-commands.md
