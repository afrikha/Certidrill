id: kcsa-6b-kubescape-manifests
objective: "6.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A platform team wants every pull request that changes YAML manifests or Helm charts to be scanned for misconfigurations against the NSA-CISA and MITRE ATT&CK frameworks. The CI job must fail when the compliance score is below a threshold.

    Which CNCF project should the team use?
body:
  options:
    - id: a
      text: { en: "kube-bench" }
    - id: b
      text: { en: "Falco" }
    - id: c
      text: { en: "cert-manager" }
    - id: d
      text: { en: "Kubescape" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Kubescape, a CNCF incubating project, scans clusters, YAML manifests, Helm charts, repositories and images, and maps misconfigurations to frameworks such as NSA-CISA, MITRE ATT&CK and CIS. In CI, a compliance threshold (for example `--compliance-threshold 80`) makes the scan exit with a failure code when the score is lower.
  options:
    a:
      en: |
        kube-bench checks the configuration of running Kubernetes components on a node against the CIS Kubernetes Benchmark. It does not scan manifests or Helm charts in a pull request.
    b:
      en: |
        Falco detects suspicious behavior of running workloads. It does not analyze manifests before they are applied.
    c:
      en: |
        cert-manager issues and renews TLS certificates in a cluster. It has no manifest scanning feature.
references:
  - title: "GitHub - kubescape/kubescape: Kubescape is an open-source Kubernetes security platform"
    url: https://github.com/kubescape/kubescape
