id: kcsa-4a-esc-hostpath-etc
objective: "4.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On a kubeadm node whose kubelet uses `staticPodPath: /etc/kubernetes/manifests`, a Pod mounts the node's `/etc/kubernetes` directory read-write through a `hostPath` volume. An attacker gains code execution in the container. Which escape path does this mount open?
body:
  options:
    - id: a
      text: { en: "Reading the etcd encryption key from the memory of the API server process" }
    - id: b
      text: { en: "Writing a Pod manifest that the kubelet then runs directly on the node" }
    - id: c
      text: { en: "Setting `privileged: true` on the Pod's own securityContext from inside" }
    - id: d
      text: { en: "Joining the node's PID namespace to send signals to host processes" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The kubelet runs every manifest it finds in its static Pod directory. Writing a file there makes the kubelet start any Pod the attacker wants on the node, for example a privileged Pod that mounts the host's root filesystem, outside the control of the API server. The same directory usually also holds the kubelet's kubeconfig, an exposure of node credentials that the `hostPath` documentation warns about.
  options:
    a:
      en: |
        A mounted directory gives access to files, not to the memory of another process.
    c:
      en: |
        The securityContext belongs to the Pod object stored by the API server. A process in the container cannot change it.
    d:
      en: |
        `hostPID` is a field of the Pod spec. A file mount does not move the container into another namespace.
references:
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
  - title: Static Pods
    url: https://kubernetes.io/docs/concepts/workloads/pods/static-pods/
