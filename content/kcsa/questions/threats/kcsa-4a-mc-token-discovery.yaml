id: kcsa-4a-mc-token-discovery
objective: "4.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker who gained a shell in a Pod of the `orders` namespace runs:

    ```bash
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    kubectl --token="$TOKEN" auth can-i --list
    ```

    What decides which API actions the attacker can perform with this token?
body:
  options:
    - id: a
      text: { en: "The Pod Security Standard enforced on the `orders` namespace" }
    - id: b
      text: { en: "The `securityContext` settings of the container" }
    - id: c
      text: { en: "The NetworkPolicies that select the compromised Pod" }
    - id: d
      text: { en: "The RBAC roles bound to the Pod's ServiceAccount" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The mounted token authenticates the caller as the Pod's ServiceAccount, and the API server authorizes each request with the roles bound to that ServiceAccount. `kubectl auth can-i --list` is a typical discovery step that shows the attacker what they inherited. Giving each workload its own ServiceAccount with minimal RBAC limits the blast radius of a compromised container.
  options:
    a:
      en: |
        Pod Security Standards control how Pods may be configured. They do not authorize API requests made with a token.
    b:
      en: |
        The securityContext restricts the container's processes on the node, not what the API server allows the ServiceAccount to do.
    c:
      en: |
        An egress NetworkPolicy can stop the Pod from reaching the API server, but it does not decide which actions are authorized once a request arrives.
references:
  - title: Service Accounts
    url: https://kubernetes.io/docs/concepts/security/service-accounts/
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
