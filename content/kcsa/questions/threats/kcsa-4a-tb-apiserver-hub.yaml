id: kcsa-4a-tb-apiserver-hub
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a Kubernetes cluster, kubelets, controllers, the scheduler, Pods and `kubectl` users all send their API requests to the same component, which authenticates, authorizes and admits each request. Which component is this central trust boundary?
body:
  options:
    - id: a
      text: { en: "kube-controller-manager" }
    - id: b
      text: { en: "kubelet" }
    - id: c
      text: { en: "kube-apiserver" }
    - id: d
      text: { en: "kube-proxy" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes uses a hub-and-spoke pattern: all API usage from nodes and the Pods they run terminates at the API server, and the other control plane components are not designed to expose remote services. The API server is where authentication, authorization and admission control are applied, which makes it the central trust boundary of the cluster. It is also the only component that should talk to etcd.
  options:
    a:
      en: |
        The controller manager is itself a client of the API server: its controllers watch and update objects through the API. It does not receive the requests of other components.
    b:
      en: |
        The kubelet runs on each node and is a client of the API server. It exposes its own API on port 10250, which the API server uses for logs and `exec`, but cluster requests are not authenticated and authorized there.
    d:
      en: |
        kube-proxy programs Service forwarding rules on each node. It watches Services and EndpointSlices through the API server; it does not process API requests.
references:
  - title: Communication between Nodes and the Control Plane
    url: https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/
