id: kcsa-4b-kms-external-key
objective: "4.6.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp requires that an attacker who steals both an etcd backup and a full copy of a control plane host's disk still cannot read Secret values.

    Which encryption at rest setup meets this requirement?
body:
  options:
    - id: a
      text: { en: "The `aescbc` provider, with its key in the EncryptionConfiguration file" }
    - id: b
      text: { en: "The `kms` v2 provider, with the key encryption key in an external KMS" }
    - id: c
      text: { en: "The `secretbox` provider, with its key in the EncryptionConfiguration file" }
    - id: d
      text: { en: "The `identity` provider, with mutual TLS between the API server and etcd" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With KMS v2, Kubernetes uses envelope encryption: data encryption keys are themselves encrypted by a key encryption key that stays in an external key management service. The control plane disk does not contain that key, so the attacker would also have to compromise the KMS. KMS v2 is stable since v1.29.
  options:
    a:
      en: |
        A local key protects against an etcd compromise but not a host compromise: the key is in the EncryptionConfiguration file on the control plane disk. `aescbc` is also not recommended because of padding oracle attacks.
    c:
      en: |
        `secretbox` is a strong cipher, but its key is also stored on the control plane host, so a copy of that disk reveals it.
    d:
      en: |
        `identity` performs no encryption. Mutual TLS protects data in transit, not the data stored in the backup.
references:
  - title: Encrypting Confidential Data at Rest
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
