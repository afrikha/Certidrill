id: kcsa-4b-exec-reads-secret
objective: "4.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developer Ana is bound to the `view` ClusterRole in the `orders` namespace and to a Role that grants access to the `pods/exec` subresource there. The `orders-api` Pod mounts the Secret `db-password` as a volume. The `view` role does not allow reading Secrets.

    How can Ana still obtain the password?
body:
  options:
    - id: a
      text: { en: "By listing the Events of the namespace, which include the Secret's data" }
    - id: b
      text: { en: "By reading the Pod's spec, which embeds the values of mounted Secrets" }
    - id: c
      text: { en: "By opening a shell in the Pod and reading the mounted Secret file" }
    - id: d
      text: { en: "By describing the ServiceAccount, which prints the Secrets it mounts" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `pods/exec` lets Ana run commands in the containers of the namespace, with the container's view of its filesystem. The mounted Secret is a plain file inside the container, so `cat` on its path reveals the password. RBAC on Secrets does not protect data that a workload already exposes to anyone who can run commands in it.
  options:
    a:
      en: |
        Events describe what happened to objects (scheduling, pulls, failures). They do not contain Secret data.
    b:
      en: |
        A Pod spec refers to a Secret by name (`secretName`); the values are not copied into the Pod object.
    d:
      en: |
        A ServiceAccount does not list the contents of Secrets mounted by Pods, and `view` cannot read Secrets anyway.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: Good practices for Kubernetes Secrets
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
