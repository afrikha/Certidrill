id: kcsa-4a-cpdos-apf
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A misbehaving operator floods the kube-apiserver with requests, and kubelets and controllers start timing out. Which built-in API server feature classifies requests and shares the server's capacity so that one noisy client cannot starve the others?
body:
  options:
    - id: a
      text: { en: "ResourceQuota" }
    - id: b
      text: { en: "API Priority and Fairness" }
    - id: c
      text: { en: "PodDisruptionBudget" }
    - id: d
      text: { en: "LimitRange" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      API Priority and Fairness (APF), stable since Kubernetes v1.29, classifies incoming requests into priority levels, gives each level its own share of the API server's concurrency, and uses fair queuing so that a high-volume flow does not crowd out the others. It improves on the global `--max-requests-inflight` limits, which cannot guarantee that the most important requests get through.
  options:
    a:
      en: |
        A ResourceQuota caps the resources and object counts of a namespace. It does not control the rate of API requests.
    c:
      en: |
        A PodDisruptionBudget limits voluntary disruptions of a workload's Pods. It has nothing to do with API server load.
    d:
      en: |
        A LimitRange sets per-container defaults and bounds for resources. It does not apply to API requests.
references:
  - title: API Priority and Fairness
    url: https://kubernetes.io/docs/concepts/cluster-administration/flow-control/
