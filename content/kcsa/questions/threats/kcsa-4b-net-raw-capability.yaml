id: kcsa-4b-net-raw-capability
objective: "4.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    From a compromised container, an attacker sends forged ARP replies to redirect the traffic of another Pod on the same node.

    Which Linux capability lets a process open the raw sockets needed to craft these packets?
body:
  options:
    - id: a
      text: { en: "`NET_BIND_SERVICE`" }
    - id: b
      text: { en: "`NET_RAW`" }
    - id: c
      text: { en: "`SETUID`" }
    - id: d
      text: { en: "`SYS_CHROOT`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `NET_RAW` allows a process to use raw and packet sockets, which is what forging ARP or IP packets requires. Dropping `ALL` capabilities, as the Restricted Pod Security Standard requires, removes it; `NET_RAW` is not in the list of capabilities that Baseline allows a Pod to add.
  options:
    a:
      en: |
        `NET_BIND_SERVICE` only allows binding to ports below 1024. It is the one capability that Restricted lets a Pod add back.
    c:
      en: |
        `SETUID` allows changing the process user ID. It gives no ability to craft network packets.
    d:
      en: |
        `SYS_CHROOT` allows calling `chroot`. It is unrelated to network sockets.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: Configure a Security Context for a Pod or Container
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
