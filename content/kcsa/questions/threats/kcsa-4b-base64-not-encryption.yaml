id: kcsa-4b-base64-not-encryption
objective: "4.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer runs `kubectl get secret db-creds -o yaml`, sees unreadable strings under `data`, and concludes that the password is encrypted in the cluster. The API server has no encryption configuration.

    Which statement is correct?
body:
  options:
    - id: a
      text: { en: "The values are only base64-encoded, and the Secret is stored unencrypted in etcd" }
    - id: b
      text: { en: "The values are encrypted by the kubelet with a key held on each node" }
    - id: c
      text: { en: "The values are encrypted in etcd by default, and kubectl shows the ciphertext" }
    - id: d
      text: { en: "The values are hashed, so the original password cannot be recovered" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Values in a Secret's `data` field are base64-encoded strings. Base64 is an encoding, not encryption: anyone who can read the object decodes it with `base64 -d`. By default Secrets are stored unencrypted in etcd; encryption at rest must be configured on the API server.
  options:
    b:
      en: |
        The kubelet does not encrypt Secrets. It receives them from the API server and keeps mounted copies in memory (`tmpfs`).
    c:
      en: |
        Without an EncryptionConfiguration, the `identity` behaviour applies and nothing is encrypted. Even with encryption at rest, the API returns decoded data, not ciphertext.
    d:
      en: |
        Base64 is reversible, unlike a hash. Applications need the original value, so Kubernetes never hashes Secret data.
references:
  - title: Secrets
    url: https://kubernetes.io/docs/concepts/configuration/secret/
  - title: Good practices for Kubernetes Secrets
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
