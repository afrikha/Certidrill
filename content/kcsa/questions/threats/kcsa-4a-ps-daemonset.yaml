id: kcsa-4a-ps-daemonset
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An attacker with stolen cluster credentials wants a malicious Pod to run on every node of the cluster, including nodes that the autoscaler adds later. Which workload resource fits this goal?
body:
  options:
    - id: a
      text: { en: "A Deployment with a high replica count" }
    - id: b
      text: { en: "A CronJob that runs every minute" }
    - id: c
      text: { en: "A StatefulSet with one replica per node" }
    - id: d
      text: { en: "A DaemonSet" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A DaemonSet ensures that all (or some) nodes run a copy of a Pod, and adds the Pod to nodes as they join the cluster. Attackers often name such a DaemonSet like a monitoring or logging add-on in `kube-system` so that it blends in. Audit logs and a baseline of the expected DaemonSets help detect it.
  options:
    a:
      en: |
        The scheduler places Deployment replicas wherever they fit: several can land on one node, and new nodes get no replica automatically.
    b:
      en: |
        A CronJob creates Jobs on a schedule. It gives no guarantee of one Pod per node.
    c:
      en: |
        A StatefulSet gives Pods stable identities and storage. It does not place one Pod per node or follow new nodes.
references:
  - title: DaemonSet
    url: https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
  - title: "Create or Modify System Process: Container Service, Sub-technique T1543.005 - Enterprise | MITRE ATT&CK®"
    url: https://attack.mitre.org/techniques/T1543/005/
