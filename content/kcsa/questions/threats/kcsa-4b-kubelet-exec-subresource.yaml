id: kcsa-4b-kubelet-exec-subresource
objective: "4.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The kubelets of a cluster use `Webhook` authorization. A caller that can reach port 10250 sends a request to a kubelet to execute a command in one of its containers.

    For which resource and subresource does the kubelet check the caller's permission with a SubjectAccessReview?
body:
  options:
    - id: a
      text: { en: "`pods/exec`, in the namespace of the target Pod" }
    - id: b
      text: { en: "`nodes/proxy`, on the kubelet's Node object" }
    - id: c
      text: { en: "`nodes/stats`, on the kubelet's Node object" }
    - id: d
      text: { en: "`pods/log`, in the namespace of the target Pod" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The kubelet maps request paths to attributes of its Node object: `/stats` to `nodes/stats`, `/metrics` to `nodes/metrics`, `/logs` to `nodes/log`, `/spec` to `nodes/spec`, and every other path, including command execution, to `nodes/proxy`. Permission on `nodes/proxy` therefore grants command execution in any container of the node.
  options:
    a:
      en: |
        `pods/exec` is checked by the API server when `kubectl exec` goes through it. The kubelet's own authorization uses Node attributes.
    c:
      en: |
        `nodes/stats` covers the `/stats` paths only; it does not allow command execution.
    d:
      en: |
        `pods/log` is an API server subresource. On the kubelet, `/logs` maps to `nodes/log`, and exec maps to `nodes/proxy`.
references:
  - title: Kubelet authentication/authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
