id: kcsa-4a-tm-boundary-crossing
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    On the data flow diagram of a cluster, which data flows deserve the closest attention when the team enumerates threats?
body:
  options:
    - id: a
      text: { en: "Flows between two functions of the same process, such as calls inside the API server" }
    - id: b
      text: { en: "Flows that cross a trust boundary, such as internet traffic reaching an Ingress" }
    - id: c
      text: { en: "Flows whose payload is base64-encoded, such as the data of Secrets read by controllers" }
    - id: d
      text: { en: "Flows that use the cluster DNS service, such as lookups of Service names by Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A trust boundary separates parts of the system with different levels of trust, and attacks have to cross it. Every flow that crosses a boundary is therefore an attack point where authentication, authorization, encryption and input validation must be examined first.
  options:
    a:
      en: |
        Calls inside one process stay at a single trust level. They matter less in a threat model than flows between parties with different trust.
    c:
      en: |
        Base64 is an encoding, not a measure of trust. What makes a flow risky is which boundary it crosses, whatever the format of its data.
    d:
      en: |
        Using a given protocol does not make a flow more exposed. A DNS flow is examined because of the boundaries it crosses, like any other flow.
references:
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
