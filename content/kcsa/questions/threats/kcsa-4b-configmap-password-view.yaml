id: kcsa-4b-configmap-password-view
objective: "4.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Auditors are bound to the built-in `view` ClusterRole in the `billing` namespace through a RoleBinding. The application team stored the database password of `billing` in a ConfigMap named `db-config`.

    What can the auditors see?
body:
  options:
    - id: a
      text: { en: "Nothing: `view` excludes both ConfigMaps and Secrets" }
    - id: b
      text: { en: "Only the keys of the ConfigMap, because `view` masks values" }
    - id: c
      text: { en: "The password, because `view` reads ConfigMaps but not Secrets" }
    - id: d
      text: { en: "The password, but only if the ConfigMap is `immutable: true`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `view` role gives read-only access to most objects of a namespace, including ConfigMaps, but deliberately excludes Secrets. Confidential data placed in a ConfigMap is therefore readable by everyone with `view`. The security checklist requires that ConfigMaps not hold confidential data.
  options:
    a:
      en: |
        `view` excludes Secrets (and RBAC objects), not ConfigMaps.
    b:
      en: |
        RBAC grants or denies access to whole objects. There is no masking of ConfigMap values for any role.
    d:
      en: |
        Immutability prevents updates. It has no effect on who can read the ConfigMap.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: Security Checklist
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
