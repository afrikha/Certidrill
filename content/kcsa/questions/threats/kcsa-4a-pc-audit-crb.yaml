id: kcsa-4a-pc-audit-crb
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which control lets a security team detect that someone created a ClusterRoleBinding granting `cluster-admin` to a new user, and find out who created it and when?
body:
  options:
    - id: a
      text: { en: "Pod Security Admission in `audit` mode" }
    - id: b
      text: { en: "A ResourceQuota on RBAC objects" }
    - id: c
      text: { en: "A default deny NetworkPolicy" }
    - id: d
      text: { en: "A review of the API server audit log" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Kubernetes auditing gives a chronological record of the actions sent to the API server: what happened, when, who initiated it and on which object. With an audit policy that records RBAC objects (at least at the `Metadata` level), reviewing the log reveals new ClusterRoleBindings, especially when compared with a baseline of the bindings that should exist.
  options:
    a:
      en: |
        The `audit` mode of Pod Security Admission annotates audit events for Pods that violate a Pod Security Standard. It does not evaluate RBAC objects.
    b:
      en: |
        A ResourceQuota limits how many objects a namespace may hold; ClusterRoleBindings are cluster-scoped, and a quota records nothing about who created what.
    c:
      en: |
        A NetworkPolicy filters network traffic between Pods. It has no visibility into API operations.
references:
  - title: Auditing
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
