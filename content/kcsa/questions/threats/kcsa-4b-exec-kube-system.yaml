id: kcsa-4b-exec-kube-system
objective: "4.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    To troubleshoot DNS, a support group is granted access to the `pods/exec` subresource in the `kube-system` namespace. The namespace runs the cluster's network agents, kube-proxy and other system components.

    Why is this permission a privilege escalation path?
body:
  options:
    - id: a
      text: { en: "It lets the group delete the `kube-system` namespace and its Pods" }
    - id: b
      text: { en: "It lets the group edit the Roles and RoleBindings of `kube-system`" }
    - id: c
      text: { en: "It implicitly grants the `bind` verb on roles in `kube-system`" }
    - id: d
      text: { en: "Commands run with the system Pods' host access and tokens" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `pods/exec` runs commands inside existing containers with all of their privileges. System components often use host networking, privileged settings, host mounts and powerful ServiceAccounts, so a shell in one of them can lead to node or cluster control. Grant exec in `kube-system` only to cluster administrators, and limit it with `resourceNames` where possible.
  options:
    a:
      en: |
        Deleting a namespace needs `delete` on `namespaces`, which `pods/exec` does not grant.
    b:
      en: |
        Editing Roles needs permissions on `roles`; exec gives no RBAC rights directly.
    c:
      en: |
        Permissions are never implied by other verbs; the risk comes from the privileges of the containers reached.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
