id: kcsa-4a-df-etcd-mtls
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How is the data flow between the kube-apiserver and etcd normally authenticated and protected?
body:
  options:
    - id: a
      text: { en: "The API server sends a ServiceAccount bearer token, which etcd checks with the TokenReview API" }
    - id: b
      text: { en: "Over TLS, with the API server presenting a client certificate that etcd verifies against a trusted CA" }
    - id: c
      text: { en: "Over plain HTTP on port 2379, with a NetworkPolicy that admits only the API server" }
    - id: d
      text: { en: "Through the Konnectivity service, which authenticates the API server with an SSH key" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      etcd is configured to require client certificates (`--client-cert-auth` and `--trusted-ca-file`), and the API server connects with its own certificate and key (`--etcd-certfile`, `--etcd-keyfile`) and verifies etcd with `--etcd-cafile`. Access to etcd is equivalent to root permission in the cluster, so ideally only the API server should be able to reach it.
  options:
    a:
      en: |
        etcd is not a Kubernetes API client and does not validate ServiceAccount tokens. It authenticates its clients with TLS client certificates.
    c:
      en: |
        Plain HTTP would expose every object of the cluster, Secrets included, to anyone on the path. Network restrictions complement TLS and client authentication but never replace them.
    d:
      en: |
        Konnectivity proxies traffic from the control plane to the nodes, not between the API server and etcd. SSH tunnels are a deprecated mechanism for control plane to node traffic.
references:
  - title: Operating etcd clusters for Kubernetes
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
