id: kcsa-4b-hostpath-data-persists
objective: "4.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A batch Pod writes customer export files to a `hostPath` volume at `/data/exports` on `node-2`. The Pod completes and is deleted.

    Where are the export files now?
body:
  options:
    - id: a
      text: { en: "Deleted with the Pod, like the data of an `emptyDir` volume" }
    - id: b
      text: { en: "Still on `node-2`, readable by node users and Pods that mount the path" }
    - id: c
      text: { en: "Moved into etcd and encrypted with the Secret encryption key" }
    - id: d
      text: { en: "Kept only in the container's writable layer until garbage collection" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A `hostPath` volume is a directory of the node's filesystem. Its data persists after the Pod is removed, with no isolation between Pods, so anyone with access to the node, or any later Pod that mounts the same path, can read the files. Sensitive data needs a properly access-controlled volume, and `hostPath` should be blocked by Pod Security Standards.
  options:
    a:
      en: |
        Only ephemeral volumes such as `emptyDir` are deleted with the Pod. `hostPath` data lives on the node.
    c:
      en: |
        etcd stores API objects, not volume data; encryption at rest does not apply to files on a node.
    d:
      en: |
        Files written to a mounted volume go to that volume, not to the container's writable layer.
references:
  - title: Volumes
    url: https://kubernetes.io/docs/concepts/storage/volumes/
