id: kcsa-4a-edos-autoscaling-cost
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team relies on a HorizontalPodAutoscaler and node autoscaling to absorb traffic floods against its public API. Which risk should the team plan for?
body:
  options:
    - id: a
      text: { en: "The HorizontalPodAutoscaler stops scaling as soon as it detects malicious traffic" }
    - id: b
      text: { en: "Scaled-out Pods are created without the NetworkPolicies of the namespace" }
    - id: c
      text: { en: "A flood can scale the workload to its maximum and raise costs without being filtered" }
    - id: d
      text: { en: "The HorizontalPodAutoscaler scales the kube-apiserver instead of the application" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A HorizontalPodAutoscaler adjusts the number of replicas to match observed metrics, up to the maximum that was configured. It cannot tell legitimate traffic from an attack: a sustained flood keeps the workload at its maximum, adds nodes and drives up the bill, and beyond the maximum the service saturates anyway. Combine autoscaling with edge filtering, rate limiting, quotas and cost alerts.
  options:
    a:
      en: |
        The HorizontalPodAutoscaler only looks at metrics such as CPU utilization. It has no notion of malicious traffic.
    b:
      en: |
        NetworkPolicies select Pods by label, so new replicas created from the same template are covered like the others.
    d:
      en: |
        The HorizontalPodAutoscaler scales its target workload resource, such as a Deployment. It does not manage control plane components.
references:
  - title: Horizontal Pod Autoscaling
    url: https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
