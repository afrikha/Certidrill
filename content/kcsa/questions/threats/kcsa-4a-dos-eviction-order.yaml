id: kcsa-4a-dos-eviction-order
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A node runs low on memory and the kubelet starts node-pressure eviction. All Pods on the node have the same priority:

    ```text
    POD     QOS CLASS    MEMORY REQUEST   MEMORY USAGE
    web     Guaranteed   512Mi            480Mi
    cache   Burstable    1Gi              700Mi
    batch   Burstable    256Mi            900Mi
    api     Guaranteed   1Gi              990Mi
    ```

    Which Pod does the kubelet evict first?
body:
  options:
    - id: a
      text: { en: "`web`" }
    - id: b
      text: { en: "`cache`" }
    - id: c
      text: { en: "`batch`" }
    - id: d
      text: { en: "`api`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The kubelet ranks Pods by whether their usage exceeds their requests, then by priority, then by usage relative to requests. Only `batch` uses more memory than it requested, so it is evicted first. Setting realistic requests therefore protects a workload during memory pressure, and a Pod that overruns its request is the first to pay.
  options:
    a:
      en: |
        `web` uses less memory than it requested. Guaranteed Pods and Pods below their requests are evicted last.
    b:
      en: |
        `cache` is Burstable but stays below its request. The QoS class alone is not what the kubelet ranks first.
    d:
      en: |
        `api` has the highest absolute usage but stays within its request. Absolute usage is not the first criterion.
references:
  - title: Node-pressure Eviction
    url: https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/
