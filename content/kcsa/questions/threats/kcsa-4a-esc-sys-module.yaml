id: kcsa-4a-esc-sys-module
objective: "4.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Linux capability would let a process in a container load a module into the node's kernel, and so take full control of the node?
body:
  options:
    - id: a
      text: { en: "`NET_BIND_SERVICE`" }
    - id: b
      text: { en: "`SYS_TIME`" }
    - id: c
      text: { en: "`CHOWN`" }
    - id: d
      text: { en: "`SYS_MODULE`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `CAP_SYS_MODULE` allows loading and unloading kernel modules. Containers share the node's kernel, so a malicious module runs with full privileges on the host: MITRE ATT&CK describes loading a kernel module from a privileged container as an escape to host. The Baseline Pod Security Standard does not allow adding this capability.
  options:
    a:
      en: |
        `NET_BIND_SERVICE` only allows binding to ports below 1024.
    b:
      en: |
        `SYS_TIME` allows setting the system clock. It is a risky host-wide change, but it does not load code into the kernel.
    c:
      en: |
        `CHOWN` allows changing the ownership of files. It gives no access to the kernel.
references:
  - title: "Escape to Host, Technique T1611 - Enterprise | MITRE ATT&CK®"
    url: https://attack.mitre.org/techniques/T1611/
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
