id: kcsa-4b-userns-psa-relaxation
objective: "4.7.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The `build` namespace enforces the Restricted Pod Security Standard. A Pod sets `hostUsers: false`, and its container sets `runAsUser: 0`. Otherwise it meets Restricted: `allowPrivilegeEscalation: false`, `capabilities.drop: ["ALL"]` and a `RuntimeDefault` seccomp profile.

    Is the Pod admitted?
body:
  options:
    - id: a
      text: { en: "Yes: for Pods with user namespaces, `runAsNonRoot` and `runAsUser` are not constrained" }
    - id: b
      text: { en: "No: Restricted always requires `runAsNonRoot: true` and a non-zero user" }
    - id: c
      text: { en: "No: Restricted forbids `hostUsers: false` like the other host settings" }
    - id: d
      text: { en: "Yes, but only because `audit` mode applies to Pods with user namespaces" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For Pods that enable user namespaces, Pod Security Admission does not constrain `runAsNonRoot` and `runAsUser`, even under Baseline or Restricted. This is safe because root in such a Pod is never mapped to a privileged user on the host. The other Restricted controls still apply.
  options:
    b:
      en: |
        That requirement is relaxed for Pods with `hostUsers: false`, because container root is an unprivileged user on the node.
    c:
      en: |
        `hostUsers: false` adds isolation; it is not a host namespace setting and Restricted does not forbid it.
    d:
      en: |
        The namespace's `enforce` mode still applies; the Pod is admitted because the user checks are relaxed, not because the mode changes.
references:
  - title: User Namespaces
    url: https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
