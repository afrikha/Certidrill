id: kcsa-4a-pc-audit-scope
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The audit policy of a cluster records only operations on Pods. The security team wants the audit log to reveal common persistence techniques. Which resources should it add to the policy, at least at the `Metadata` level?
body:
  options:
    - id: a
      text: { en: "RoleBindings, ClusterRoleBindings, webhook configurations, DaemonSets, CronJobs and token requests" }
    - id: b
      text: { en: "Events, Leases and EndpointSlices, because they are the objects that change most often" }
    - id: c
      text: { en: "Only `get` requests on ConfigMaps, recorded with their full request body" }
    - id: d
      text: { en: "Only the Node status updates that the kubelets send at regular intervals" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Persistence through the API leaves creation and update events on these objects: new bindings, mutating webhooks, DaemonSets, CronJobs and tokens requested through `serviceaccounts/token`. The `Metadata` level records who did what, on which object and when, without request bodies. Reviewing these events against a known baseline exposes the attacker's footholds.
  options:
    b:
      en: |
        These high-volume objects reflect normal cluster activity; the example policies of the documentation even lower or drop logging for some of them. They rarely reveal persistence.
    c:
      en: |
        Reading ConfigMaps creates nothing that persists, and recording bodies adds volume without showing new footholds.
    d:
      en: |
        Node status updates are routine heartbeats. They do not show the creation of persistence objects.
references:
  - title: Auditing
    url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
