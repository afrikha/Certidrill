id: kcsa-4b-exposed-web-ui
objective: "4.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cluster web UI is exposed through a `LoadBalancer` Service so that operators can reach it from home. The UI sends every request to the API server with its own ServiceAccount, which is bound to `cluster-admin`, and it does not ask users to log in.

    What is the main risk?
body:
  options:
    - id: a
      text: { en: "Anyone who reaches the UI can act on the cluster with `cluster-admin` rights" }
    - id: b
      text: { en: "Users of the UI can read Pod logs, but RBAC stops them from changing objects" }
    - id: c
      text: { en: "Only users who also hold a kubeconfig file can use the UI's permissions" }
    - id: d
      text: { en: "The load balancer also exposes the etcd client port on the UI's address" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The API server sees only the UI's ServiceAccount, and `cluster-admin` allows any action on any resource cluster-wide. Exposed without login, the UI hands those rights to anyone who can reach its address. Keep such tools private, require authentication, and run them with users' own credentials or least-privilege ServiceAccounts.
  options:
    b:
      en: |
        RBAC evaluates the ServiceAccount the UI uses. With `cluster-admin`, every write is allowed, not only reads.
    c:
      en: |
        The UI does not ask for a login, so nothing ties its use to a kubeconfig file. Its own ServiceAccount token is used for every request.
    d:
      en: |
        A Service forwards only the ports it defines to its selected Pods. It does not expose etcd.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
