id: kcsa-4a-ps-mutating-webhook
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Since last week, every new Pod in the cluster contains an extra container named `metrics-helper` that sends data to an external address. No Deployment, StatefulSet or DaemonSet manifest was changed. Which object did the attacker most likely create to persist?
body:
  options:
    - id: a
      text: { en: "A ValidatingWebhookConfiguration" }
    - id: b
      text: { en: "A DaemonSet in the `kube-system` namespace" }
    - id: c
      text: { en: "A MutatingWebhookConfiguration" }
    - id: d
      text: { en: "A LimitRange in each namespace" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Mutating admission webhooks can modify objects during admission, so a webhook controlled by the attacker can inject a container into every Pod it matches, whatever the manifest says. Users who control `mutatingwebhookconfigurations` can read and modify any object admitted to the cluster, which is why write access to webhook configurations must be restricted and audited.
  options:
    a:
      en: |
        Validating webhooks can only accept or reject requests. They cannot add a container to a Pod.
    b:
      en: |
        A DaemonSet runs its own Pods, one per node. It does not add containers to the Pods of other workloads.
    d:
      en: |
        A LimitRange can inject default resource requests and limits into containers. It cannot add a container.
references:
  - title: Dynamic Admission Control
    url: https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
