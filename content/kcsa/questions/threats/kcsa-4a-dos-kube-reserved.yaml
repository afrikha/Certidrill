id: kcsa-4a-dos-kube-reserved
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On a node, busy Pods consume almost all CPU and memory, and the kubelet and the container runtime become unresponsive. Which kubelet configuration sets resources aside for these daemons, so that the Pods cannot take them?
body:
  options:
    - id: a
      text: { en: "`podPidsLimit`" }
    - id: b
      text: { en: "`maxPods`" }
    - id: c
      text: { en: "`imageGCHighThresholdPercent`" }
    - id: d
      text: { en: "`kubeReserved` and `systemReserved`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default Pods can consume all the capacity of a node and compete with system daemons. `kubeReserved` reserves resources for Kubernetes daemons such as the kubelet and the container runtime, and `systemReserved` for operating system daemons. The node's Allocatable capacity is reduced accordingly: the scheduler does not oversubscribe it, and the kubelet evicts Pods when their total usage exceeds it.
  options:
    a:
      en: |
        `podPidsLimit` caps the number of processes in each Pod. It does not reserve CPU or memory.
    b:
      en: |
        `maxPods` caps how many Pods the node runs, not how much CPU and memory they use.
    c:
      en: |
        This threshold triggers image garbage collection when the image disk fills up. It does not protect CPU or memory.
references:
  - title: Reserve Compute Resources for System Daemons
    url: https://kubernetes.io/docs/tasks/administer-cluster/reserve-compute-resources/
