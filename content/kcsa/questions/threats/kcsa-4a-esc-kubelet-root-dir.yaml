id: kcsa-4a-esc-kubelet-root-dir
objective: "4.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Pod mounts a directory of its node through a `hostPath` volume. The kubelet uses its default root directory. Which mounted path gives a compromised container the most direct access to the volumes, Secret volumes included, of the other Pods on that node?
body:
  options:
    - id: a
      text: { en: "`/var/lib/kubelet`" }
    - id: b
      text: { en: "`/usr/share/zoneinfo`" }
    - id: c
      text: { en: "`/var/cache/apt`" }
    - id: d
      text: { en: "`/srv/app-data`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `/var/lib/kubelet` is the kubelet's default root directory, where it manages the volume mounts of the Pods on the node; its TLS certificates are in `/var/lib/kubelet/pki` by default. A container that mounts it can read other Pods' volumes and Secrets and possibly the kubelet's credentials. The documentation warns that `hostPath` can expose privileged system credentials, and the Baseline Pod Security Standard forbids `hostPath` volumes.
  options:
    b:
      en: |
        This directory holds time zone data, which is not sensitive.
    c:
      en: |
        This is a package manager cache of the node. It holds no data of other Pods.
    d:
      en: |
        This is an application data path of the node. It is unrelated to the volumes that the kubelet mounts for Pods.
references:
  - title: kubelet
    url: https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/
  - title: Volume Types
    url: https://kubernetes.io/docs/reference/storage/volume-types/
