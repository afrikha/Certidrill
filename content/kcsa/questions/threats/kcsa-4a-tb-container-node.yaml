id: kcsa-4a-tb-container-node
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The threat model of the `payments` cluster lists a trust boundary between a container process and the node it runs on. Which group of controls is enforced at that boundary?
body:
  options:
    - id: a
      text: { en: "RBAC authorization and admission control in the API server" }
    - id: b
      text: { en: "Mutual TLS between the API server and the etcd members" }
    - id: c
      text: { en: "ResourceQuota and NetworkPolicy objects in each namespace" }
    - id: d
      text: { en: "Linux namespaces, cgroups, capabilities and seccomp profiles" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A container is a set of processes on the node's kernel. What separates it from the host is enforced by the kernel: Linux namespaces, cgroups, a reduced set of capabilities, seccomp system call filtering, and Linux security modules such as AppArmor or SELinux. Pod Security Admission and sandboxed runtimes reinforce this boundary.
  options:
    a:
      en: |
        RBAC and admission control protect the boundary between API clients and the API server. They decide which Pods may be created, but they do not confine a running process.
    b:
      en: |
        Mutual TLS with etcd protects a data flow inside the control plane. It has no effect on what a container can do to its node.
    c:
      en: |
        Quotas and network policies are controls of the namespace and tenant boundary. They limit consumption and filter traffic, not access from a container to the host kernel or files.
references:
  - title: Linux kernel security constraints for Pods and containers
    url: https://kubernetes.io/docs/concepts/security/linux-kernel-security-constraints/
