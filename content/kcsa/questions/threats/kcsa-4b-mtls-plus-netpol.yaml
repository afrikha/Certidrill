id: kcsa-4b-mtls-plus-netpol
objective: "4.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every workload now runs in a service mesh with strict mutual TLS. No mesh authorization policy has been defined. A team proposes to delete the NetworkPolicies of the `payments` namespace because "all traffic is now encrypted and authenticated".

    What would be the consequence?
body:
  options:
    - id: a
      text: { en: "Every meshed workload could reach `payments`: mTLS authenticates callers but restricts none" }
    - id: b
      text: { en: "Nothing would change, because strict mTLS accepts only the callers allowed by NetworkPolicies" }
    - id: c
      text: { en: "Traffic to `payments` would become unencrypted, because mTLS relies on NetworkPolicies" }
    - id: d
      text: { en: "All traffic to `payments` would be blocked, because the mesh denies every unlisted caller" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Mutual TLS encrypts traffic and proves each workload's identity, but deciding which identities may call a service is the job of authorization policies, which do not exist here. NetworkPolicy decides who can connect at the network level. Removing it without adding authorization policies lets every meshed workload reach `payments`; defense in depth keeps both.
  options:
    b:
      en: |
        The mesh does not read NetworkPolicies. Strict mode only requires that callers use mTLS.
    c:
      en: |
        Encryption comes from the mesh certificates and is independent of NetworkPolicy.
    d:
      en: |
        Without any authorization policy, the mesh allows authenticated requests; nothing is denied by default.
references:
  - title: Security
    url: https://istio.io/latest/docs/concepts/security/
  - title: Network Policies
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
