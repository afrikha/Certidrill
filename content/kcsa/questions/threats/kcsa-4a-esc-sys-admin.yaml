id: kcsa-4a-esc-sys-admin
objective: "4.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer asks to add one Linux capability to a container. Which of these capabilities gives the broadest kernel powers, creates the most direct risk of escape to the node, and is rejected by the Baseline Pod Security Standard?
body:
  options:
    - id: a
      text: { en: "`NET_BIND_SERVICE`" }
    - id: b
      text: { en: "`SYS_ADMIN`" }
    - id: c
      text: { en: "`CHOWN`" }
    - id: d
      text: { en: "`KILL`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `CAP_SYS_ADMIN` covers a wide range of administrative operations, such as mounting filesystems, and the Kubernetes documentation cites it as a capability a root user might use on the node to bypass restrictions. The Baseline standard only lets containers add capabilities from a short allow list (such as `AUDIT_WRITE`, `CHOWN`, `KILL`, `NET_BIND_SERVICE`, `SETUID`), which does not include `SYS_ADMIN`.
  options:
    a:
      en: |
        `NET_BIND_SERVICE` only allows binding to ports below 1024. It is the one capability that even the Restricted standard lets containers add.
    c:
      en: |
        `CHOWN` allows changing file ownership inside the container's view of the filesystem. It is on the Baseline allow list.
    d:
      en: |
        `KILL` allows sending signals to processes the container can see. It is on the Baseline allow list.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: Linux kernel security constraints for Pods and containers
    url: https://kubernetes.io/docs/concepts/security/linux-kernel-security-constraints/
