id: kcsa-4b-service-selector-hijack
objective: "4.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `payments-api` Service in the `payments` namespace selects Pods with the label `app: payments-api`. An attacker who can create Pods in `payments`, but cannot modify Services, starts a Pod that carries the label `app: payments-api`.

    What is the result?
body:
  options:
    - id: a
      text: { en: "The Pod is ignored, because it was not created by the Service's Deployment" }
    - id: b
      text: { en: "The Pod is ignored until its image matches the other endpoints' image" }
    - id: c
      text: { en: "The Pod is ignored until the attacker also edits the EndpointSlice" }
    - id: d
      text: { en: "The Pod becomes an endpoint and receives part of the clients' requests" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Service targets every Pod that matches its selector; the control plane keeps the EndpointSlices up to date automatically. The attacker's Pod receives a share of the traffic and can impersonate the service, collecting requests and credentials. Mutual TLS with workload identities lets clients verify the server, and Pod creation rights should be restricted.
  options:
    a:
      en: |
        Service endpoints are chosen by labels, not by the controller that created the Pod.
    b:
      en: |
        The image plays no part in endpoint selection; only labels and readiness do.
    c:
      en: |
        No manual edit is needed: the EndpointSlice controller adds every ready Pod that matches the selector.
references:
  - title: Service
    url: https://kubernetes.io/docs/concepts/services-networking/service/
