id: kcsa-4a-pc-falco-manifests
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which tool can alert in real time when a process on a node writes a new file into `/etc/kubernetes/manifests`, the kubelet's static Pod directory?
body:
  options:
    - id: a
      text: { en: "Falco" }
    - id: b
      text: { en: "Kyverno" }
    - id: c
      text: { en: "kube-bench" }
    - id: d
      text: { en: "OPA Gatekeeper" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Falco is a runtime security tool that monitors system calls on hosts and in containers and alerts on abnormal behavior in real time, such as writes to sensitive directories. A file dropped in the static Pod directory never goes through the API server, so runtime detection on the node is what catches it.
  options:
    b:
      en: |
        Kyverno is a policy engine that evaluates requests sent to the API server. Writing a file on the node is not an API request.
    c:
      en: |
        kube-bench checks a node's configuration against the CIS Kubernetes Benchmark when someone runs it. It does not monitor file writes as they happen.
    d:
      en: |
        OPA Gatekeeper enforces policies at admission, on API requests only. It cannot see file activity on a node.
references:
  - title: The Falco Project
    url: https://falco.org/docs/
  - title: Static Pods
    url: https://kubernetes.io/docs/concepts/workloads/pods/static-pods/
