id: kcsa-4b-mesh-short-lived-certs
objective: "4.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Linkerd gives each meshed Pod a TLS certificate bound to the Pod's ServiceAccount identity. These certificates expire after 24 hours and are rotated automatically.

    What is the main security benefit of this short lifetime?
body:
  options:
    - id: a
      text: { en: "Pods outside the mesh can join mutual TLS without any certificate" }
    - id: b
      text: { en: "A stolen workload certificate can be used only for a short time" }
    - id: c
      text: { en: "Traffic is encrypted twice, once with each successive certificate" }
    - id: d
      text: { en: "The cluster no longer needs a trust anchor to validate certificates" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Short-lived certificates limit the window in which a stolen key and certificate can be used to impersonate a workload or decrypt its sessions. Automatic rotation means no operator has to renew them, which makes the short lifetime practical.
  options:
    a:
      en: |
        Traffic from Pods outside the mesh is not protected by mutual TLS; certificate lifetime does not change that.
    c:
      en: |
        Each connection is protected by one TLS session. Rotation replaces the certificate; it does not add a second layer of encryption.
    d:
      en: |
        Certificates are still validated against the trust anchor, which operators must manage and rotate.
references:
  - title: Automatic mTLS
    url: https://linkerd.io/2/features/automatic-mtls/
