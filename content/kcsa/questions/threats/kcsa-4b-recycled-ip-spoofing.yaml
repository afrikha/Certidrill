id: kcsa-4b-recycled-ip-spoofing
objective: "4.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The internal `billing` service accepts requests only from a list of Pod IP addresses. After an `invoicing` Pod is deleted, a Pod controlled by an attacker receives its former IP address, and `billing` accepts the attacker's requests.

    Which threat does this scenario illustrate?
body:
  options:
    - id: a
      text: { en: "Eavesdropping on unencrypted traffic" }
    - id: b
      text: { en: "Denial of service against the service" }
    - id: c
      text: { en: "Tampering with objects stored in etcd" }
    - id: d
      text: { en: "Spoofing the identity of a trusted workload" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The attacker is accepted as `invoicing` because `billing` treats an IP address as an identity. Pod IPs are ephemeral and are reassigned, so they prove nothing about the caller. Cryptographic workload identities, such as the certificates of a service mesh with mutual TLS, resist this spoofing.
  options:
    a:
      en: |
        Eavesdropping means reading traffic between other parties. Here the attacker sends its own requests and is wrongly trusted.
    b:
      en: |
        Nothing in the scenario degrades the availability of `billing`; it keeps answering, to the wrong caller.
    c:
      en: |
        The attacker never touches etcd; it exploits the trust that `billing` places in a network address.
references:
  - title: Network Policies
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
  - title: Security
    url: https://istio.io/latest/docs/concepts/security/
