id: kcsa-4b-default-sa-binding
objective: "4.7.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `report-builder` application in the `orders` namespace needs to list ConfigMaps. An administrator binds the required Role to the `default` ServiceAccount of `orders`, because the application's Pods do not set `serviceAccountName`.

    Why does this break least privilege?
body:
  options:
    - id: a
      text: { en: "The binding has no effect, because `default` ServiceAccounts cannot receive roles" }
    - id: b
      text: { en: "The permission applies in every namespace, because `default` is cluster-wide" }
    - id: c
      text: { en: "The `default` ServiceAccount's tokens never expire, unlike other tokens" }
    - id: d
      text: { en: "Every Pod in `orders` that sets no `serviceAccountName` gets the permission" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Pods that do not specify a ServiceAccount run as the namespace's `default` ServiceAccount, so its permissions are available to all of them. The recommended approach is a dedicated ServiceAccount for the application, referenced with `serviceAccountName`, that alone receives the Role.
  options:
    a:
      en: |
        The `default` ServiceAccount can be bound to roles like any other; it simply has no permissions beyond API discovery until then.
    b:
      en: |
        Each namespace has its own `default` ServiceAccount, and a RoleBinding grants rights only in its namespace.
    c:
      en: |
        Pods of every ServiceAccount, `default` included, receive short-lived, rotated tokens through the TokenRequest API.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: Service Accounts
    url: https://kubernetes.io/docs/concepts/security/service-accounts/
