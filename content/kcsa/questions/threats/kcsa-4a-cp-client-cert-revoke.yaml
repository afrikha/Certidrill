id: kcsa-4a-cp-client-cert-revoke
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A contractor's access must be removed. The team disabled the contractor's OIDC account, but the contractor also holds a client certificate with `CN=dev-maria` and no organization field, issued by the cluster CA through an approved CertificateSigningRequest. The certificate expires in 11 months. What is true in Kubernetes v1.37?
body:
  options:
    - id: a
      text: { en: "Disabling the OIDC account also invalidates every certificate issued to the same user" }
    - id: b
      text: { en: "Deleting the CertificateSigningRequest object revokes the certificate it produced" }
    - id: c
      text: { en: "The certificate stays valid until it expires, so remove the RBAC bindings for `dev-maria`" }
    - id: d
      text: { en: "Restarting the API server reloads its revocation list and rejects the certificate" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kubernetes 1.37 does not support certificate revocation: an issued certificate remains valid until it expires. The contractor can still authenticate as `dev-maria`, so the team must remove every RoleBinding and ClusterRoleBinding that grants permissions to that user. If the certificate carried a privileged group such as `system:masters`, only rotating the CA would help.
  options:
    a:
      en: |
        OIDC tokens and X.509 client certificates are separate authentication methods. Disabling the identity provider account has no effect on a certificate signed by the cluster CA.
    b:
      en: |
        The CertificateSigningRequest object is only the request and its record. Deleting it does not affect the certificate already issued.
    d:
      en: |
        The API server has no certificate revocation list to reload, because certificate revocation is not supported.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
