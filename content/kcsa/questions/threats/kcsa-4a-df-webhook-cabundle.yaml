id: kcsa-4a-df-webhook-cabundle
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The API server calls a validating admission webhook that runs as a Service in the `policy` namespace. How does the API server verify that it is talking to the genuine webhook server?
body:
  options:
    - id: a
      text: { en: "It checks the webhook's serving certificate against the `caBundle` of the configuration" }
    - id: b
      text: { en: "It checks the ServiceAccount token of the webhook Pod with the TokenReview API" }
    - id: c
      text: { en: "It relies on a NetworkPolicy in the `policy` namespace that admits only its own traffic" }
    - id: d
      text: { en: "It compares the webhook's IP address with the ClusterIP of the Service" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The webhook configuration's `clientConfig` carries a `caBundle`, and the API server uses it to verify the webhook's TLS serving certificate; for a Service reference, the certificate must be valid for `<service>.<namespace>.svc`. In the other direction, the documentation recommends that the webhook authenticate the API server too, with mutual TLS or other credentials.
  options:
    b:
      en: |
        The API server is the TLS client in this flow. It does not ask the webhook for a ServiceAccount token; it checks the server certificate.
    c:
      en: |
        A NetworkPolicy filters which Pods can send traffic to the webhook Pods. It does not prove the identity of the server the API server reaches.
    d:
      en: |
        IP addresses can be spoofed or reused and are not an identity check. TLS certificate verification is what authenticates the server.
references:
  - title: Dynamic Admission Control
    url: https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
