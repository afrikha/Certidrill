id: kcsa-4a-dos-ephemeral-storage
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A compromised container writes huge files into its writable layer and into a disk-backed `emptyDir` volume, until the node's disk is full and other Pods start failing. Which setting lets the kubelet evict this Pod when it uses more local disk than allowed?
body:
  options:
    - id: a
      text: { en: "`resources.limits.memory` on the container" }
    - id: b
      text: { en: "`resources.limits.ephemeral-storage` on the container" }
    - id: c
      text: { en: "`imagePullPolicy: IfNotPresent` on the container" }
    - id: d
      text: { en: "A `pods` limit in the namespace's ResourceQuota" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The kubelet measures local ephemeral storage used by writable container layers, node-level logs and disk-backed `emptyDir` volumes. When a container's or Pod's usage exceeds its `ephemeral-storage` limit, the kubelet marks the Pod for eviction, which protects the node's disk and the other Pods.
  options:
    a:
      en: |
        A memory limit caps memory, including memory-backed (`tmpfs`) `emptyDir` volumes, but not files on the node's disk.
    c:
      en: |
        The pull policy decides when the image is downloaded. It does not limit what a running container writes.
    d:
      en: |
        Counting Pods in the namespace does not limit the disk usage of a single Pod.
references:
  - title: Local ephemeral storage
    url: https://kubernetes.io/docs/concepts/storage/ephemeral-storage/
