id: kcsa-4b-bind-verb
objective: "4.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    User `lee` can create RoleBindings in the `shop` namespace but does not hold the permissions of the `admin` ClusterRole. RBAC therefore rejects a RoleBinding that grants `admin` to `lee`.

    Which verb on `clusterroles` would let `lee` create this RoleBinding anyway?
body:
  options:
    - id: a
      text: { en: "`escalate`" }
    - id: b
      text: { en: "`impersonate`" }
    - id: c
      text: { en: "`bind`" }
    - id: d
      text: { en: "`patch`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      RBAC lets a user create or update a binding only if they already hold every permission of the referenced role, or if they are allowed the `bind` verb on that role. `bind` on `clusterroles` without `resourceNames` therefore lets `lee` grant `admin`, or even `cluster-admin`, to themselves.
  options:
    a:
      en: |
        `escalate` lifts the check on creating or updating Roles and ClusterRoles with permissions the user lacks. It does not apply to creating bindings.
    b:
      en: |
        `impersonate` applies to users, groups and ServiceAccounts, letting the caller act as another identity. It is not the verb RBAC checks on roles for bindings.
    d:
      en: |
        `patch` on a ClusterRole would modify the role itself, and RBAC would still require holding the permissions added. It does not authorize binding the role.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
