id: kcsa-4a-ps-backdoored-image
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    After an intrusion, Example Corp rotated every user credential and rebuilt all nodes from a clean image. Yet the backdoor comes back each time the `web` Deployment scales out. The Deployment uses `image: registry.example.com/shop/web:2.3`, and the registry's log shows a push to that tag during the intrusion. Why does the backdoor keep coming back?
body:
  options:
    - id: a
      text: { en: "The kubelet restores the writable layer of the old containers when it starts the new Pods" }
    - id: b
      text: { en: "The ReplicaSet keeps a copy of the compromised container filesystem in etcd" }
    - id: c
      text: { en: "The tag `2.3` now points to an image implanted by the attacker, which every new Pod pulls" }
    - id: d
      text: { en: "The rebuilt nodes kept the attacker's static Pod manifests from the previous nodes" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The attacker implanted a modified image in the internal registry under an existing tag (MITRE ATT&CK Implant Internal Image, T1525). Tags are mutable, so every new Pod that pulls `web:2.3` runs the backdoor, even after credentials and nodes are clean. Remediation is to rebuild the image from trusted sources, restrict push rights, reference images by digest and verify their signatures before deployment.
  options:
    a:
      en: |
        Each new container starts from the image layers. The writable layer belongs to one container and is discarded with it.
    b:
      en: |
        etcd stores object definitions, such as the Pod template, not container filesystems.
    d:
      en: |
        Nodes rebuilt from a clean image do not contain the old files. The backdoor arrives with the image pull, not from the node.
references:
  - title: "Implant Internal Image, Technique T1525 - Enterprise | MITRE ATT&CK®"
    url: https://attack.mitre.org/techniques/T1525/
