id: kcsa-4a-edos-quota-lb
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To reduce the attack surface exposed to the internet, cluster administrators want to make sure that no Service of type `LoadBalancer` can be created in the `dev` namespace. Which built-in object enforces this?
body:
  options:
    - id: a
      text: { en: "A ResourceQuota with `services.loadbalancers: \"0\"`" }
    - id: b
      text: { en: "A LimitRange with a `max` of zero for Services" }
    - id: c
      text: { en: "The label `pod-security.kubernetes.io/enforce: baseline`" }
    - id: d
      text: { en: "A default deny ingress NetworkPolicy" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `services.loadbalancers` is a quota on the number of Services of type `LoadBalancer` in a namespace. With a hard limit of `"0"`, any request to create one is rejected with `403 Forbidden`. The `services.nodeports` quota works the same way for node ports.
  options:
    b:
      en: |
        A LimitRange constrains resource values of Pods, containers and PersistentVolumeClaims. It does not apply to Services.
    c:
      en: |
        Pod Security Admission evaluates Pods, for example host ports and host namespaces. It does not check the type of Services.
    d:
      en: |
        A NetworkPolicy filters traffic to Pods. The `LoadBalancer` Service would still be created and get an external address.
references:
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
