id: kcsa-4b-ptrace-hostpid
objective: "4.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A troubleshooting Pod sets `hostPID: true`, and its container runs as root with `capabilities.add: ["SYS_PTRACE"]`.

    What does this combination let a compromised container do?
body:
  options:
    - id: a
      text: { en: "Trace host and Pod processes and read their memory" }
    - id: b
      text: { en: "Load kernel modules into the kernel that the node runs" }
    - id: c
      text: { en: "Bind to ports below 1024 in the node's network namespace" }
    - id: d
      text: { en: "Mount the node's root filesystem inside the container" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `hostPID: true` makes every process of the node visible, and `SYS_PTRACE` allows tracing them: reading and changing their memory, or injecting code. An attacker can steal credentials from other workloads or the node and act with their privileges. Baseline forbids host namespaces and does not allow adding `SYS_PTRACE`.
  options:
    b:
      en: |
        Loading kernel modules requires `SYS_MODULE` or privileged mode.
    c:
      en: |
        Binding low ports needs `NET_BIND_SERVICE`, and acting in the node's network namespace needs `hostNetwork`.
    d:
      en: |
        Mounting the node's filesystem requires a `hostPath` volume or mount privileges such as `SYS_ADMIN`, not `SYS_PTRACE`.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: Configure a Security Context for a Pod or Container
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
