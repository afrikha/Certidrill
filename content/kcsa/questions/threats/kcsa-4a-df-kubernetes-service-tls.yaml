id: kcsa-4a-df-kubernetes-service-tls
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod connects to the API server through the ClusterIP address of the `kubernetes` Service in the `default` namespace. Which statement describes how this connection is protected?
body:
  options:
    - id: a
      text: { en: "kube-proxy terminates TLS on the node, then opens a second TLS session to the API server" }
    - id: b
      text: { en: "kube-proxy only redirects packets to the API server's HTTPS endpoint, and TLS runs end to end" }
    - id: c
      text: { en: "The kubelet proxies the connection and adds the node's client certificate to the request" }
    - id: d
      text: { en: "The connection uses plain HTTP, because the Service address is reachable only from Pods" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `kubernetes` Service has a virtual IP address that kube-proxy redirects to the HTTPS endpoint of the API server. kube-proxy only forwards the packets, so the TLS session runs between the Pod and the API server: the Pod verifies the server with the mounted cluster CA certificate and authenticates with its ServiceAccount token. Connections from Pods to the control plane are secured by default.
  options:
    a:
      en: |
        kube-proxy programs forwarding rules on the node. It holds no certificate for the API server and does not terminate TLS.
    c:
      en: |
        The kubelet is not on this path. Each Pod authenticates with its own ServiceAccount token, never with the node's credentials.
    d:
      en: |
        The API server listens on a secure HTTPS port, and the Service only redirects to it. Being reachable only inside the cluster is not a reason to drop TLS.
references:
  - title: Communication between Nodes and the Control Plane
    url: https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/
