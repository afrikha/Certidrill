id: kcsa-4b-apparmor-path-profiles
objective: "4.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The `catalog` team wants to confine its web server so that, even when compromised, it can only access the files and resources listed in a profile. The profile identifies resources by file path and can run in enforcing mode or in complain mode.

    Which mechanism and field should the team use?
body:
  options:
    - id: a
      text: { en: "AppArmor, through `securityContext.appArmorProfile`" }
    - id: b
      text: { en: "seccomp, through `securityContext.seccompProfile`" }
    - id: c
      text: { en: "SELinux, through `securityContext.seLinuxOptions`" }
    - id: d
      text: { en: "Linux capabilities, through `securityContext.capabilities`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AppArmor is a Linux security module that confines programs to a limited set of resources through profiles that name resources by file path. Each profile runs in enforcing mode, which blocks disallowed access, or complain mode, which only reports it. Kubernetes applies a profile with the `appArmorProfile` field.
  options:
    b:
      en: |
        seccomp filters the system calls a process can make. It does not describe which files or paths a program may access.
    c:
      en: |
        SELinux also provides mandatory access control, but it uses labels and policies, and identifies resources by inode rather than by file path.
    d:
      en: |
        Capabilities split root privileges into units such as `NET_ADMIN`. They do not confine a program to a list of files.
references:
  - title: Linux kernel security constraints for Pods and containers
    url: https://kubernetes.io/docs/concepts/security/linux-kernel-security-constraints/
