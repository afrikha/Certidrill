id: kcsa-4a-ps-static-pod
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After a node compromise, an administrator deletes an unknown Pod with `kubectl delete pod`, but it is back a few seconds later with the same name:

    ```text
    $ kubectl get pods -n kube-system
    NAME                  READY   STATUS    RESTARTS   AGE
    node-agent-worker-2   1/1     Running   0          8s
    ```

    `worker-2` is the hostname of the compromised node. What is the most likely persistence mechanism?
body:
  options:
    - id: a
      text: { en: "A Deployment whose ReplicaSet recreates the Pod" }
    - id: b
      text: { en: "A static Pod manifest in the kubelet's manifest directory on `worker-2`" }
    - id: c
      text: { en: "A Pod spec with `restartPolicy: Always`" }
    - id: d
      text: { en: "A finalizer that prevents the deletion of the Pod" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Static Pods are run directly by the kubelet from manifest files in its `staticPodPath`, without the API server managing them. The API server only shows a mirror Pod, whose name ends with a hyphen and the node's hostname. Deleting the mirror Pod with `kubectl` does not stop the static Pod, and the kubelet recreates the mirror: the manifest file on the node must be removed.
  options:
    a:
      en: |
        Pods created by a ReplicaSet get a generated name with a random suffix, so a replacement would not come back with the same name. They also carry an owner reference to the ReplicaSet.
    c:
      en: |
        The restart policy restarts containers inside an existing Pod. It does not recreate a Pod object that was deleted.
    d:
      en: |
        A finalizer would keep the Pod in the `Terminating` state. It would not show a fresh Pod in the `Running` state with an age of a few seconds.
references:
  - title: Static Pods
    url: https://kubernetes.io/docs/concepts/workloads/pods/static-pods/
