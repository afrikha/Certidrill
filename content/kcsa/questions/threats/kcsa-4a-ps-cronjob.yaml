id: kcsa-4a-ps-cronjob
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A suspicious Pod in the `shop` namespace is deleted, but a new Pod with a different name starts every 15 minutes. The latest one shows:

    ```yaml
    metadata:
      name: log-rotate-29384715-7xk2p
      ownerReferences:
      - apiVersion: batch/v1
        kind: Job
        name: log-rotate-29384715
    ```

    Which object must be removed to stop this persistence?
body:
  options:
    - id: a
      text: { en: "The CronJob that creates the `log-rotate` Jobs" }
    - id: b
      text: { en: "The ReplicaSet that owns the Pod" }
    - id: c
      text: { en: "The static Pod manifest on the node" }
    - id: d
      text: { en: "The Job named `log-rotate-29384715`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Pod is owned by a Job, and Jobs that appear on a repeating schedule are created by a CronJob, which appends a suffix to its own name for each Job. Deleting the Pod or the current Job only ends one run: the CronJob creates a new Job at the next scheduled time. MITRE ATT&CK lists this as Container Orchestration Job (T1053.007).
  options:
    b:
      en: |
        The owner reference shows a Job, not a ReplicaSet.
    c:
      en: |
        A static Pod has no Job owner, and its mirror Pod's name ends with the node's hostname.
    d:
      en: |
        Deleting this Job stops only the current run. The CronJob creates a new Job on the next schedule.
references:
  - title: CronJob
    url: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
  - title: "Matrix - Enterprise - Containers | MITRE ATT&CK®"
    url: https://attack.mitre.org/matrices/enterprise/containers/
