id: kcsa-4b-node-traffic-allowed
objective: "4.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The `payments` namespace has a default-deny ingress NetworkPolicy, enforced by the CNI plugin, and no other policy. An attacker obtains a shell directly on the host `node-4`, which runs some of the `payments` Pods.

    To which `payments` Pods can the attacker open connections from that host?
body:
  options:
    - id: a
      text: { en: "Those on `node-4`, because traffic from a Pod's own node is always allowed" }
    - id: b
      text: { en: "None, because the default-deny policy also applies to node traffic" }
    - id: c
      text: { en: "All of them on every node, because node addresses are exempt cluster-wide" }
    - id: d
      text: { en: "Only those that declare a `hostPort` in their container specification" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a Pod is isolated for ingress, the only connections allowed into it are those from its own node and those allowed by an ingress rule. NetworkPolicy cannot block access from the Pod's resident node, so a node compromise reaches the local Pods regardless of policies. Connections to Pods on other nodes are still subject to their ingress policies.
  options:
    b:
      en: |
        NetworkPolicy always allows traffic to and from the node where a Pod runs; Pods cannot block access from their resident node.
    c:
      en: |
        The exception covers only the Pod's own node. Traffic from `node-4` to Pods on other nodes is filtered like other traffic.
    d:
      en: |
        `hostPort` exposes a container port on the node's address. It does not determine which traffic NetworkPolicy allows.
references:
  - title: Network Policies
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
