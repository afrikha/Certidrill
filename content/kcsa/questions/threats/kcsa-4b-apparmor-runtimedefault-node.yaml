id: kcsa-4b-apparmor-runtimedefault-node
objective: "4.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    To make sure its containers are always confined, a team sets this field explicitly in every container:

    ```yaml
    securityContext:
      appArmorProfile:
        type: RuntimeDefault
    ```

    One of the Pods is scheduled on a node where AppArmor is not enabled. What happens to this Pod?
body:
  options:
    - id: a
      text: { en: "It starts without AppArmor confinement, and the kubelet only logs a warning" }
    - id: b
      text: { en: "It is not admitted on that node, because AppArmor is not enabled there" }
    - id: c
      text: { en: "It is rejected by the API server before the scheduler assigns a node" }
    - id: d
      text: { en: "It starts with the runtime's default seccomp profile in place of AppArmor" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When `appArmorProfile.type` is explicitly set to `RuntimeDefault`, the Pod is not admitted if AppArmor is not enabled on the node. An explicit request for confinement is therefore never silently dropped; the Pod must run on a node that supports AppArmor.
  options:
    a:
      en: |
        Running silently without the requested confinement is what the explicit setting prevents: the Pod is not admitted on a node without AppArmor.
    c:
      en: |
        The API server does not know which security modules each node has enabled. The check happens on the node that receives the Pod.
    d:
      en: |
        seccomp and AppArmor are separate mechanisms. Kubernetes never replaces one with the other.
references:
  - title: Configure a Security Context for a Pod or Container
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
