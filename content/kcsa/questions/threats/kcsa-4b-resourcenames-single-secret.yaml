id: kcsa-4b-resourcenames-single-secret
objective: "4.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The `billing` application must read exactly one Secret, `stripe-key`, in the `billing` namespace, and nothing else in that namespace.

    Which rule should its Role contain?
body:
  options:
    - id: a
      text: { en: "`verbs: [\"get\", \"list\", \"watch\"]` on all `secrets` of `billing`" }
    - id: b
      text: { en: "`verbs: [\"list\"]` on `secrets`, without any `resourceNames`" }
    - id: c
      text: { en: "`verbs: [\"get\"]` on `secrets` with `resourceNames: [\"stripe-key\"]`" }
    - id: d
      text: { en: "No rule: bind the built-in `view` ClusterRole in `billing` instead" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `resourceNames` restricts a rule to named objects, so `get` with `resourceNames: ["stripe-key"]` allows reading that Secret and no other. The Kubernetes guidance is to grant `get` only where needed and to keep `list` and `watch` on Secrets for the most privileged system components.
  options:
    a:
      en: |
        These verbs cover every Secret of the namespace; `list` and `watch` reveal all their contents.
    b:
      en: |
        `list` returns the data of every Secret in the namespace, far more than the one Secret needed.
    d:
      en: |
        `view` does not allow reading Secrets, so the application could not read `stripe-key`.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: Good practices for Kubernetes Secrets
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
