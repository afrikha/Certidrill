id: kcsa-4a-df-konnectivity
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp runs its control plane in a separate network from the worker nodes. The firewall allows connections from the nodes to the control plane, but the security team does not want the API server to open its own connections to the kubelets across the node network. Which mechanism carries control plane to node traffic over connections that agents on the nodes initiate?
body:
  options:
    - id: a
      text: { en: "SSH tunnels opened by the API server to each node" }
    - id: b
      text: { en: "The API server proxy to nodes, Pods and Services" }
    - id: c
      text: { en: "The Konnectivity service, with a server and node agents" }
    - id: d
      text: { en: "The `kubernetes` Service in the `default` namespace" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Konnectivity service provides a TCP-level proxy for control plane to cluster traffic. It has a Konnectivity server in the control plane network and agents in the node network; the agents initiate and maintain the connections to the server, and once it is enabled, all control plane to node traffic goes through them. It replaces the deprecated SSH tunnels.
  options:
    a:
      en: |
        SSH tunnels are deprecated, and the API server opens them to port 22 of each node: the connection direction is the opposite of what the team wants.
    b:
      en: |
        The API server proxy is a way to reach nodes, Pods and Services through the API server. Its connections default to plain HTTP and are opened by the API server; it does not change how traffic crosses the network.
    d:
      en: |
        The `kubernetes` Service lets Pods reach the API server. It serves the node-to-control-plane direction, not control plane to node traffic.
references:
  - title: Communication between Nodes and the Control Plane
    url: https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/
