id: kcsa-4b-edit-role-secrets
objective: "4.6.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Developers are bound to the built-in `edit` ClusterRole in the `shop` namespace through a RoleBinding, so that they can manage their Deployments. The security team asks whether these developers can obtain the values of Secrets in `shop`.

    What is the answer?
body:
  options:
    - id: a
      text: { en: "No: like `view`, the `edit` role excludes Secrets" }
    - id: b
      text: { en: "Yes: `edit` includes read access to the Secrets of `shop`" }
    - id: c
      text: { en: "Only for the Secrets that the developers created themselves" }
    - id: d
      text: { en: "Only their names, because `edit` returns Secrets without data" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `edit` role allows read and write access to most objects in a namespace, including Secrets, and running Pods as any ServiceAccount of the namespace. It does not allow viewing or changing Roles and RoleBindings. Developers who must not see production credentials need a narrower role.
  options:
    a:
      en: |
        Only `view` excludes Secrets. `edit` includes them.
    c:
      en: |
        RBAC does not track who created an object; the permission covers every Secret in `shop`.
    d:
      en: |
        Read access to Secrets returns their data; there is no names-only mode for this role.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
