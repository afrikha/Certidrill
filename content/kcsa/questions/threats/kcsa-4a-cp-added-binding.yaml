id: kcsa-4a-cp-added-binding
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    During an intrusion, an attacker used a stolen token to create a ClusterRoleBinding that grants `cluster-admin` to a new ServiceAccount that the attacker controls. Why is this a persistence technique?
body:
  options:
    - id: a
      text: { en: "It keeps granting cluster-wide rights to the attacker after the stolen token is revoked" }
    - id: b
      text: { en: "It makes the API server stop recording audit events for that ServiceAccount" }
    - id: c
      text: { en: "It turns every token of that ServiceAccount into a credential that never expires" }
    - id: d
      text: { en: "It prevents cluster administrators from deleting that ServiceAccount" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Revoking the credential used for the first access does not remove permissions that the attacker granted to other identities. MITRE ATT&CK lists this as Account Manipulation: Additional Container Cluster Roles (T1098.006). Responders must review RoleBindings and ClusterRoleBindings, and the audit log shows when and by whom each one was created.
  options:
    b:
      en: |
        RBAC bindings have no effect on auditing. The creation of the binding and the later requests of the ServiceAccount are recorded according to the audit policy.
    c:
      en: |
        RBAC decides what an identity may do, not how long its tokens live. Bound tokens still expire.
    d:
      en: |
        An administrator can delete the ServiceAccount and the binding at any time. Doing so is part of the remediation.
references:
  - title: "Matrix - Enterprise - Containers | MITRE ATT&CK®"
    url: https://attack.mitre.org/matrices/enterprise/containers/
