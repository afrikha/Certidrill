id: kcsa-4a-cp-oidc-token-lifetime
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cluster authenticates engineers with OpenID Connect. An engineer's laptop is stolen, and its kubeconfig holds a valid `id_token`. The team disables the engineer's account at the identity provider, which stops issuing new tokens for it. What remains true for the stolen `id_token`?
body:
  options:
    - id: a
      text: { en: "The API server asks the provider about every request, so it rejects the token at once" }
    - id: b
      text: { en: "It stays valid indefinitely, because OIDC ID tokens carry no expiry time" }
    - id: c
      text: { en: "The engineer's RoleBindings cannot be deleted while the token is still valid" }
    - id: d
      text: { en: "It is accepted until it expires, because the API server validates it locally" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Everything needed to validate an `id_token` is inside the token, so the API server checks its signature and expiry without contacting the identity provider. An ID token cannot be revoked: like a certificate, it should be short-lived, a few minutes, to limit the window of a stolen copy. Removing the engineer's RBAC bindings cuts the permissions of the token right away.
  options:
    a:
      en: |
        The API server does not call the provider for each request. It only fetches the provider's public signing keys through OIDC discovery.
    b:
      en: |
        The API server checks that the `id_token` has not expired; the token's lifetime is set by the provider.
    c:
      en: |
        Bindings can be deleted at any time, and deleting them is the fastest way to remove the token's permissions.
references:
  - title: Authenticating
    url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/
