id: kcsa-4a-cpdos-etcd-dedicated
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Why does the Kubernetes documentation recommend running production etcd clusters on dedicated machines or isolated environments?
body:
  options:
    - id: a
      text: { en: "To guarantee etcd's resources, because a starved etcd destabilizes the whole cluster" }
    - id: b
      text: { en: "Because etcd cannot run in containers on the cluster's control plane nodes" }
    - id: c
      text: { en: "Because a dedicated machine removes the need for TLS between the API server and etcd" }
    - id: d
      text: { en: "So that every Pod can query etcd directly without going through the API server" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Keeping etcd stable is critical to the stability of the cluster: every object and every change goes through it. The documentation therefore recommends dedicated machines or isolated environments with guaranteed resources, so that no other workload can starve etcd of CPU, memory or disk.
  options:
    b:
      en: |
        etcd can run in containers, for example as a static Pod on control plane nodes. The recommendation is about guaranteed resources, not packaging.
    c:
      en: |
        Access to etcd is equivalent to root permission in the cluster: TLS and client certificate authentication stay required wherever etcd runs.
    d:
      en: |
        It is the opposite: ideally only the API server should have access to etcd.
references:
  - title: Operating etcd clusters for Kubernetes
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
