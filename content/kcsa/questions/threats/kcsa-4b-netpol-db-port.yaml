id: kcsa-4b-netpol-db-port
objective: "4.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The CNI plugin enforces NetworkPolicy, and this is the only policy that selects the `db` Pods:

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: db-from-api, namespace: shop}
    spec:
      podSelector: {matchLabels: {app: db}}
      policyTypes: [Ingress]
      ingress:
      - from:
        - podSelector: {matchLabels: {app: api}}
        ports:
        - {protocol: TCP, port: 5432}
    ```

    Which Pods can open connections to the `db` Pods?
body:
  options:
    - id: a
      text: { en: "Any Pod in any namespace, on TCP port 5432" }
    - id: b
      text: { en: "The `app: api` Pods of any namespace, on any port" }
    - id: c
      text: { en: "The `app: api` Pods of `shop` on any port, and other Pods on 5432" }
    - id: d
      text: { en: "Only the `app: api` Pods of `shop`, and only on TCP port 5432" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The policy isolates the `db` Pods for ingress and allows a single flow. A `podSelector` alone in `from` selects Pods in the policy's own namespace, and the `ports` list limits that flow to TCP 5432. Limiting both the callers and the port reduces what a compromised Pod can reach.
  options:
    a:
      en: |
        The `from` element restricts the sources to the `app: api` Pods; the port applies only to them.
    b:
      en: |
        Without a `namespaceSelector`, the `podSelector` matches Pods of the `shop` namespace only, and the `ports` list restricts the port.
    c:
      en: |
        The source selector and the port list belong to the same rule, so both conditions apply together to every allowed connection.
references:
  - title: Network Policies
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
