id: kcsa-4a-pc-gitops-baseline
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Example Corp deploys every application namespace with Argo CD from a reviewed Git repository. After an incident, the team wants to find persistence objects that an attacker created directly with `kubectl` in these namespaces, such as an extra Deployment or CronJob. Which approach reveals them most reliably?
body:
  options:
    - id: a
      text: { en: "Run kube-bench on every node and review the failed checks of its report" }
    - id: b
      text: { en: "Compare the cluster with Git and investigate objects found only in the cluster" }
    - id: c
      text: { en: "Enforce the Restricted Pod Security Standard on each application namespace" }
    - id: d
      text: { en: "Rotate the TLS certificates of the API server and of every kubelet" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Detection works best against a known baseline. With GitOps, the repository describes what should exist, so an object that is in the cluster but in no application stands out. Argo CD can report such orphaned resources, top-level namespaced resources that belong to no Argo CD Application; the audit log then shows who created them.
  options:
    a:
      en: |
        kube-bench checks node and control plane configuration against the CIS Kubernetes Benchmark. It does not know which workloads should exist.
    c:
      en: |
        Pod Security Admission applies to new Pods. It neither lists nor removes objects that were already created, and a CronJob with compliant Pods would still be admitted.
    d:
      en: |
        Rotating certificates replaces credentials. It does not reveal or remove objects the attacker created.
references:
  - title: Orphaned Resources Monitoring
    url: https://argo-cd.readthedocs.io/en/stable/user-guide/orphaned-resources/
