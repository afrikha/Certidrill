id: kcsa-4b-nonroot-port-mapping
objective: "4.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The `web` image runs as UID 10001, and its namespace will enforce the Restricted Pod Security Standard. Clients inside the cluster must keep reaching the application on port 80.

    Which approach meets both requirements without granting extra privileges to the container?
body:
  options:
    - id: a
      text: { en: "Run the container as root so that it can bind to port 80" }
    - id: b
      text: { en: "Add the `NET_ADMIN` capability so that the process can bind to port 80" }
    - id: c
      text: { en: "Listen on 8080 and expose the Service on port 80 with `targetPort: 8080`" }
    - id: d
      text: { en: "Publish the container port on the node with `hostPort: 80`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Service maps its `port` to the container's `targetPort`, so clients use port 80 while the process listens on an unprivileged port. The container keeps running as non-root with all capabilities dropped, as Restricted requires, and needs no `NET_BIND_SERVICE`.
  options:
    a:
      en: |
        Restricted requires running as non-root; a root container would be rejected and would also weaken the mitigation.
    b:
      en: |
        Binding low ports is governed by `NET_BIND_SERVICE`, not `NET_ADMIN`. `NET_ADMIN` is a broad network administration capability that Baseline forbids adding, and Restricted allows only `NET_BIND_SERVICE`.
    d:
      en: |
        Host ports are forbidden by Baseline and expose the application on the node's address, which increases exposure.
references:
  - title: Service
    url: https://kubernetes.io/docs/concepts/services-networking/service/
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
