id: kcsa-4a-edos-rate-limit
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Attackers send thousands of valid-looking HTTP requests per second to the login endpoint of an application exposed through an ingress gateway. The network link is not saturated, but the application Pods are overloaded. Which mitigation targets this layer 7 flood?
body:
  options:
    - id: a
      text: { en: "A NetworkPolicy that allows ingress traffic to the Pods only on port 443" }
    - id: b
      text: { en: "Rate limits per client at the ingress gateway, behind a web application firewall" }
    - id: c
      text: { en: "A ResourceQuota that limits the number of Pods in the application's namespace" }
    - id: d
      text: { en: "API Priority and Fairness settings tuned on the kube-apiserver" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A layer 7 flood consists of individually valid requests, so it must be handled by a component that understands requests. A gateway based on a proxy such as Envoy can enforce rate limits and answer `429` to clients over the limit, and a web application firewall filters abusive request patterns before they reach the Pods.
  options:
    a:
      en: |
        The attack already uses port 443. A NetworkPolicy cannot count requests or tell abusive clients from legitimate ones.
    c:
      en: |
        Limiting the number of Pods reduces the capacity available to legitimate users; it does not filter the attack.
    d:
      en: |
        APF protects the Kubernetes API server. Application traffic through the gateway never reaches it.
references:
  - title: Enabling Rate Limits using Envoy
    url: https://istio.io/latest/docs/tasks/policy-enforcement/rate-limit/
