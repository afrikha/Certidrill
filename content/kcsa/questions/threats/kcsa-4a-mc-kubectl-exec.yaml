id: kcsa-4a-mc-kubectl-exec
objective: "4.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker stole the credentials of a developer whose RBAC role covers the `pods/exec` subresource in the `payments` namespace. The application itself has no vulnerability. How can the attacker run arbitrary code in the application's containers?
body:
  options:
    - id: a
      text: { en: "With `kubectl logs`, which sends commands to the container" }
    - id: b
      text: { en: "With `kubectl exec`, which runs a command in a container" }
    - id: c
      text: { en: "With `kubectl port-forward`, which opens a shell on a port" }
    - id: d
      text: { en: "With `kubectl describe pod`, which starts a debug process" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An adversary with enough permissions can execute commands in a running container with `kubectl exec` (MITRE ATT&CK Container Administration Command, T1609). No application flaw is needed: stolen credentials are enough. Restrict `pods/exec` in RBAC, record its use in the audit log, and detect interactive shells at runtime.
  options:
    a:
      en: |
        `kubectl logs` only reads the output of a container. It cannot send commands.
    c:
      en: |
        `kubectl port-forward` forwards a local port to a port of the Pod. It does not start any process in the container.
    d:
      en: |
        `kubectl describe` shows the specification, status and events of the Pod. It runs nothing.
references:
  - title: "Container Administration Command, Technique T1609 - Enterprise | MITRE ATT&CK®"
    url: https://attack.mitre.org/techniques/T1609/
