id: kcsa-4a-tm-dfd-data-store
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    While drawing the data flow diagram of a cluster for its threat model, the team classifies each element as an external entity, a process, a data store or a data flow. Which element should be drawn as a data store?
body:
  options:
    - id: a
      text: { en: "The kube-scheduler" }
    - id: b
      text: { en: "An engineer who runs `kubectl`" }
    - id: c
      text: { en: "The connection from the API server to a kubelet" }
    - id: d
      text: { en: "etcd and its backup snapshots" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A data store holds data at rest. etcd stores all Kubernetes objects, Secrets included, and its snapshot files contain all the state of the cluster, which is why the documentation asks to encrypt them. Threats such as information disclosure and tampering are examined for each data store, along with registries and persistent volumes.
  options:
    a:
      en: |
        The scheduler is a process: it reads unscheduled Pods and writes binding decisions through the API server. It stores nothing itself.
    b:
      en: |
        An engineer is an external entity: someone outside the system who sends requests across the boundary of the API server.
    c:
      en: |
        A connection between two components is a data flow, drawn as an arrow, with its protocol and credentials.
references:
  - title: Operating etcd clusters for Kubernetes
    url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
