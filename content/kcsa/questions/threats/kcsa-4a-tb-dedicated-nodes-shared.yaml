id: kcsa-4a-tb-dedicated-nodes-shared
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    To isolate two tenants, a platform team gives each tenant its own namespace and its own set of nodes, using taints, tolerations and node affinity. Which part of the cluster do the two tenants still share, so that control plane isolation remains necessary?
body:
  options:
    - id: a
      text: { en: "The host kernel of the nodes that run their Pods" }
    - id: b
      text: { en: "The API server and the cluster state stored in etcd" }
    - id: c
      text: { en: "The container runtime that starts their containers" }
    - id: d
      text: { en: "The local disks that back their emptyDir volumes" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Dedicated nodes separate the data plane: each tenant's containers run on different machines, with their own kernel, runtime and local storage. Unless each tenant gets a virtual control plane, both tenants still use the same API server and etcd. An attacker who escapes onto one node can use the permissions of the kubelet or of the Pods on that node against this shared API to move laterally, so RBAC and other control plane protections stay essential.
  options:
    a:
      en: |
        With dedicated nodes, each tenant's Pods run on different machines, so they no longer share a kernel. This is the main benefit of node isolation.
    c:
      en: |
        The container runtime runs on each node. Separate nodes mean separate runtime instances for each tenant.
    d:
      en: |
        emptyDir volumes use storage of the node that runs the Pod. On dedicated nodes, each tenant's volumes are on its own nodes.
references:
  - title: Multi-tenancy
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
