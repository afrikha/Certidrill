id: kcsa-4b-kubectl-proxy-exposed
objective: "4.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    To help colleagues, an operator runs this command on a jump host where their kubeconfig grants `cluster-admin`. Port 8001 of the jump host is reachable from the whole office network.

    ```bash
    kubectl proxy --address=0.0.0.0 --accept-hosts='.*'
    ```

    What is the main risk?
body:
  options:
    - id: a
      text: { en: "Anyone who reaches port 8001 can call the API server with the operator's credentials" }
    - id: b
      text: { en: "Only users who present their own kubeconfig can send requests through the proxy" }
    - id: c
      text: { en: "The proxy exposes the etcd client API on port 8001 without TLS" }
    - id: d
      text: { en: "The proxy disables RBAC for every user of the cluster while it runs" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `kubectl proxy` forwards requests to the API server with the credentials of the kubeconfig it runs with. By default it listens on `127.0.0.1` and accepts only localhost host names; this command opens it to every host that can reach the port, which hands out unauthenticated `cluster-admin` access.
  options:
    b:
      en: |
        The proxy adds the operator's credentials itself; callers do not authenticate to it.
    c:
      en: |
        The proxy talks to the API server, not to etcd. The exposure is the API with the operator's rights.
    d:
      en: |
        RBAC keeps working for everyone else. Requests through the proxy are authorized as the operator, which is the problem.
references:
  - title: kubectl proxy
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_proxy/
