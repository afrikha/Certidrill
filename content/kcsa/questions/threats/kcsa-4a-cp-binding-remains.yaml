id: kcsa-4a-cp-binding-remains
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Responders find that an attacker created the ServiceAccount `metrics-agent` in `kube-system`, a ClusterRoleBinding that binds it to `cluster-admin`, and a Secret of type `kubernetes.io/service-account-token` for it. The responders delete only the token Secret. Why is the cluster still at risk?
body:
  options:
    - id: a
      text: { en: "Deleting the Secret does not invalidate the tokens that were copied from it" }
    - id: b
      text: { en: "Whoever can get a new token for `metrics-agent`, or run a Pod as it, still gets `cluster-admin`" }
    - id: c
      text: { en: "Every ServiceAccount in `kube-system` is automatically a member of `system:masters`" }
    - id: d
      text: { en: "The ClusterRoleBinding keeps its own copy of the token and keeps it valid" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The token Secret is only one credential; the persistence lies in the ServiceAccount and its binding. New tokens can be issued through the TokenRequest API by anyone with `create` on `serviceaccounts/token`, and anyone who can create Pods in `kube-system` can run them as `metrics-agent`. The responders must remove the binding and the ServiceAccount, then review who holds those permissions.
  options:
    a:
      en: |
        For Secret-based tokens, the API server checks the token against its Secret. Once the Secret is deleted, copies of the token no longer authenticate.
    c:
      en: |
        ServiceAccounts belong to the `system:serviceaccounts` groups, not to `system:masters`. Their rights come only from their bindings.
    d:
      en: |
        A binding references subjects and a role. It stores no credential.
references:
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
  - title: Service Accounts
    url: https://kubernetes.io/docs/concepts/security/service-accounts/
