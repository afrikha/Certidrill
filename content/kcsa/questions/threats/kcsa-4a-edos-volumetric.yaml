id: kcsa-4a-edos-volumetric
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A public web shop running on Kubernetes is hit by a volumetric DDoS attack that saturates the network link in front of the cluster's load balancer. Where must this traffic be filtered to keep the shop available?
body:
  options:
    - id: a
      text: { en: "Inside the cluster, with a NetworkPolicy that denies the attacking IP ranges" }
    - id: b
      text: { en: "In the API server, with API Priority and Fairness" }
    - id: c
      text: { en: "Upstream of the link, by the provider's DDoS protection or a mitigation service" }
    - id: d
      text: { en: "On the nodes, by raising the CPU limits of the ingress controller Pods" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a flood exceeds the capacity of the connection, the attack traffic must be intercepted upstream, before it reaches the target, by the hosting provider, the ISP, a CDN or a DDoS mitigation service. Anything inside the cluster sits behind the saturated link and cannot restore the bandwidth.
  options:
    a:
      en: |
        By the time traffic reaches the Pods, it has already consumed the link. NetworkPolicy filters allowed flows; it cannot free bandwidth.
    b:
      en: |
        APF protects the API server from excess API requests. Traffic to the web shop does not go through the API server.
    d:
      en: |
        More CPU for the ingress Pods does not add network capacity in front of the cluster.
references:
  - title: "Network Denial of Service, Technique T1498 - Enterprise | MITRE ATT&CK®"
    url: https://attack.mitre.org/techniques/T1498/
