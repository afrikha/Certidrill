id: kcsa-4a-tm-inputs
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security team starts the threat model of a new Kubernetes deployment. Which three elements form the basis of the model?
body:
  options:
    - id: a
      text: { en: "The CIS Kubernetes Benchmark score, the image scan report, and the list of open CVEs" }
    - id: b
      text: { en: "The Pod Security Standard, the ResourceQuota, and the LimitRange of each namespace" }
    - id: c
      text: { en: "The system's components, the data flows between them, and the trust boundaries they cross" }
    - id: d
      text: { en: "The audit logs of the last month, the Falco alerts, and the API server metrics" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A threat model starts from a description of the system: its components (control plane, nodes, add-ons, workloads, registry, pipelines), the data flows between them, and the trust boundaries where data or control passes between parts with different levels of trust. Kubernetes recommends building a threat model that identifies trust boundaries and using it to identify risks and decide how to treat them.
  options:
    a:
      en: |
        These are outputs of assessment tools. They reveal known misconfigurations and vulnerabilities, but they do not describe the system and miss design-level threats.
    b:
      en: |
        These are controls that the threat model may lead you to choose. They are results of the analysis, not its inputs.
    d:
      en: |
        Logs, alerts and metrics are detection and incident response data. They show what happened, not how the system is built and where it can be attacked.
references:
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
