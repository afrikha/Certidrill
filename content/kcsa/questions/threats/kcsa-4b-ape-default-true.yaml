id: kcsa-4b-ape-default-true
objective: "4.7.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container runs as UID 1000. Its securityContext does not mention `allowPrivilegeEscalation`, and the image contains a setuid-root binary.

    Can a process in this container use the binary to gain root privileges?
body:
  options:
    - id: a
      text: { en: "No, because `allowPrivilegeEscalation` defaults to `false`" }
    - id: b
      text: { en: "No, because a non-root UID can never become root in a container" }
    - id: c
      text: { en: "Yes, because `allowPrivilegeEscalation` defaults to `true` when unset" }
    - id: d
      text: { en: "Yes, but only if the container also runs with `privileged: true`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When `allowPrivilegeEscalation` is not set, it defaults to `true`, so `no_new_privs` is not set and a setuid binary can raise the process to root inside the container. The Restricted Pod Security Standard therefore requires an explicit `allowPrivilegeEscalation: false`.
  options:
    a:
      en: |
        The default is `true`. Only an explicit `false` sets `no_new_privs`.
    b:
      en: |
        Setuid binaries exist precisely to change the effective user, for example to root, unless `no_new_privs` is set.
    d:
      en: |
        Privileged mode is not needed: escalation through setuid works in an ordinary container while `allowPrivilegeEscalation` is `true`.
references:
  - title: Configure a Security Context for a Pod or Container
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
