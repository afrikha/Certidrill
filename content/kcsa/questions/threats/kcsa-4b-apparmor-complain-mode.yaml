id: kcsa-4b-apparmor-complain-mode
objective: "4.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new AppArmor profile is loaded on the nodes in complain mode and referenced by a container with `appArmorProfile.type: Localhost`. An attacker in the container then writes to a path that the profile does not allow.

    What happens to the write?
body:
  options:
    - id: a
      text: { en: "It succeeds, and the violation is only reported" }
    - id: b
      text: { en: "It is blocked, and the container is restarted" }
    - id: c
      text: { en: "It is blocked, and the violation is reported" }
    - id: d
      text: { en: "It fails, because the container never started" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An AppArmor profile in complain mode only reports violations; enforcing mode blocks access to disallowed resources. Complain mode is useful to tune a new profile, but it gives no protection until the profile is switched to enforcing mode.
  options:
    b:
      en: |
        Complain mode does not block anything, and AppArmor never restarts containers.
    c:
      en: |
        Blocking and reporting is the behaviour of enforcing mode, not complain mode.
    d:
      en: |
        A Localhost profile that is loaded on the node, in either mode, lets the container start.
references:
  - title: Linux kernel security constraints for Pods and containers
    url: https://kubernetes.io/docs/concepts/security/linux-kernel-security-constraints/
