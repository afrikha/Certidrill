id: kcsa-4b-userns-requirements
objective: "4.7.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team sets `hostUsers: false` on its Pods to limit the impact of a container escape. The Pods start on recently built nodes but fail on an older node pool.

    Which requirement does the older pool most likely not meet?
body:
  options:
    - id: a
      text: { en: "The `UserNamespacesSupport` feature gate is disabled on its kubelets" }
    - id: b
      text: { en: "Kernel and filesystem support for idmap mounts, and a recent enough runtime" }
    - id: c
      text: { en: "A namespace label that enforces the Privileged Pod Security Standard" }
    - id: d
      text: { en: "The `runAsNonRoot: true` setting in the Pods' security context" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      User namespaces are a Linux feature that needs idmap mount support in the filesystems used, in practice Linux 6.3 or later, and a runtime that supports them, such as containerd 2.0 or later or CRI-O 1.25 or later, with a recent runc or crun. The feature is stable since v1.36.
  options:
    a:
      en: |
        Since the feature became stable, its feature gate is locked: setting it is ignored.
    c:
      en: |
        User namespaces add isolation and work under every Pod Security level; Baseline and Restricted even relax the user checks for them.
    d:
      en: |
        With user namespaces, containers may run as root inside the Pod; `runAsNonRoot` is not a requirement.
references:
  - title: User Namespaces
    url: https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/
