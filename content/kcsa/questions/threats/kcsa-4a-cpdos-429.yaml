id: kcsa-4a-cpdos-429
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A script that lists all Pods in all namespaces in a tight loop starts receiving `HTTP 429 Too Many Requests` responses from the API server. What produced these responses?
body:
  options:
    - id: a
      text: { en: "API Priority and Fairness, because the requests exceeded what their priority level can serve or queue" }
    - id: b
      text: { en: "A ResourceQuota, because the namespace of the script reached its maximum number of objects" }
    - id: c
      text: { en: "RBAC, because the ServiceAccount of the script is not allowed the `list` verb on Pods" }
    - id: d
      text: { en: "The NodeRestriction admission plugin, because the script runs on a node with kubelet credentials" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With API Priority and Fairness, each priority level either queues the requests above its concurrency or rejects them. Excess traffic that cannot be served or queued is rejected with HTTP 429 (Too Many Requests), which protects the API server and the other flows from the noisy script.
  options:
    b:
      en: |
        A quota violation is rejected with `403 Forbidden`, and quotas apply to creating or updating objects, not to `list` requests.
    c:
      en: |
        An authorization denial is returned as `403 Forbidden`, whatever the request rate.
    d:
      en: |
        NodeRestriction limits which Node and Pod objects a kubelet may modify. Admission plugins do not handle read requests such as `list`, and they do not rate-limit.
references:
  - title: API Priority and Fairness
    url: https://kubernetes.io/docs/concepts/cluster-administration/flow-control/
  - title: Resource Quotas
    url: https://kubernetes.io/docs/concepts/policy/resource-quotas/
