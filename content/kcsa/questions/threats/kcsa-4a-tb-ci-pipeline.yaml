id: kcsa-4a-tb-ci-pipeline
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CI pipeline that runs outside the cluster deploys applications with `kubectl apply`, authenticating with an OIDC token. In the threat model, which trust boundary does this data flow cross?
body:
  options:
    - id: a
      text: { en: "The boundary between external clients and the API server" }
    - id: b
      text: { en: "The boundary between a container and its node" }
    - id: c
      text: { en: "The boundary between the control plane and the nodes" }
    - id: d
      text: { en: "The boundary between two tenant namespaces" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The pipeline is an external client: its requests enter the cluster at the API server. Controls at this boundary are TLS, authentication, RBAC authorization, admission control, and limited network exposure of the API endpoint. A stolen pipeline token is a typical threat to record here.
  options:
    b:
      en: |
        The container-to-node boundary concerns a process inside a container that tries to reach the host kernel or files. The pipeline in this scenario does not run in a container of the cluster.
    c:
      en: |
        This boundary lies between node components, such as kubelets, and control plane components. The pipeline is neither.
    d:
      en: |
        The tenant boundary separates workloads and objects of different teams inside the cluster. The flow described starts outside the cluster.
references:
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
