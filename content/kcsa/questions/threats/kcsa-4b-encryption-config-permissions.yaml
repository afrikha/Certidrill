id: kcsa-4b-encryption-config-permissions
objective: "4.6.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Secrets are encrypted at rest with the `secretbox` provider. Its key is stored in the EncryptionConfiguration file on each control plane host.

    How should this file be protected?
body:
  options:
    - id: a
      text: { en: "Make it readable only by the user that runs kube-apiserver" }
    - id: b
      text: { en: "Copy it into a ConfigMap in `kube-system` for recovery" }
    - id: c
      text: { en: "Make it world-readable so that every component can check it" }
    - id: d
      text: { en: "Commit it to the cluster's GitOps repository with the manifests" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The file contains keys that can decrypt the data in etcd, so permissions on every control plane host must allow only the user running kube-apiserver to read it. A locally stored key protects against an etcd compromise but not a host compromise; a KMS v2 provider keeps the key encryption key outside the host.
  options:
    b:
      en: |
        A ConfigMap is stored in etcd and is meant for non-confidential data, so the key would sit next to the data it protects.
    c:
      en: |
        Only kube-apiserver uses the file. Any other reader could extract the key and decrypt etcd data.
    d:
      en: |
        A repository spreads the key to everyone who can read it, defeating the encryption.
references:
  - title: Encrypting Confidential Data at Rest
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
