id: kcsa-4a-mc-running-tools
objective: "4.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After exploiting a vulnerable application in the `shop` namespace, an attacker runs these commands inside the container:

    ```bash
    apt-get update && apt-get install -y nmap
    nmap -p 6443,10250 10.0.0.0/16
    ```

    Which conditions made these commands possible?
body:
  options:
    - id: a
      text: { en: "The container runs as root, with a writable filesystem, a package manager and internet egress" }
    - id: b
      text: { en: "The Pod uses `hostNetwork: true` and its container has the `NET_BIND_SERVICE` capability" }
    - id: c
      text: { en: "The Pod's ServiceAccount is allowed to `list` Pods and Services in the `shop` namespace" }
    - id: d
      text: { en: "The kubelet of the node still serves its unauthenticated read-only port on port 10255" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Installing a tool needs a package manager in the image, root privileges, a writable filesystem and a route to a package repository; scanning then only needs the Pod network. Minimal images without shells or package managers, non-root users, read-only root filesystems and egress NetworkPolicies each remove part of this toolbox.
  options:
    b:
      en: |
        Scanning the Pod network does not require the node's network namespace, and `NET_BIND_SERVICE` only allows binding to ports below 1024.
    c:
      en: |
        RBAC permissions govern calls to the Kubernetes API. Installing a package and scanning ports do not use the API.
    d:
      en: |
        The kubelet's read-only port is a separate exposure on the node. These commands do not use it.
references:
  - title: Security Checklist
    url: https://kubernetes.io/docs/concepts/security/security-checklist/
  - title: "Container Administration Command, Technique T1609 - Enterprise | MITRE ATT&CK®"
    url: https://attack.mitre.org/techniques/T1609/
