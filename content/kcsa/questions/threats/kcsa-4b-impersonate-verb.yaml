id: kcsa-4b-impersonate-verb
objective: "4.7.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A support engineer is bound to this ClusterRole so that they can reproduce problems reported by users:

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: support-helper
    rules:
    - apiGroups: [""]
      resources: ["users", "groups", "serviceaccounts"]
      verbs: ["impersonate"]
    ```

    What is the escalation risk of this ClusterRole?
body:
  options:
    - id: a
      text: { en: "None: impersonation only changes the user name written in the audit log" }
    - id: b
      text: { en: "The engineer can edit any Role to add permissions that they do not hold" }
    - id: c
      text: { en: "The engineer can read the token Secrets of ServiceAccounts in every namespace" }
    - id: d
      text: { en: "The engineer can act as any user, group or ServiceAccount and gain its rights" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `impersonate` verb lets a caller send requests as another identity (for example `kubectl --as=...` or `--as-group=...`), and RBAC then evaluates the impersonated identity's rights. Without `resourceNames`, the engineer can impersonate administrators or privileged groups and gain their access. Restrict impersonation to specific identities.
  options:
    a:
      en: |
        Requests are authorized as the impersonated identity, so its rights are actually used, not just its name.
    b:
      en: |
        Editing roles beyond one's own rights requires the `escalate` verb on `roles` or `clusterroles`, which this ClusterRole does not grant.
    c:
      en: |
        Reading Secrets requires `get`, `list` or `watch` on `secrets`. Impersonation gives the rights of whoever is impersonated, which may or may not include them.
references:
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
