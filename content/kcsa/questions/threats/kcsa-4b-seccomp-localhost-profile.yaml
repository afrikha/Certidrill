id: kcsa-4b-seccomp-localhost-profile
objective: "4.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team wrote a custom seccomp profile that allows only the system calls of the `audit-api` service. The file is installed on every node as `profiles/audit-api.json`, relative to the kubelet's seccomp profile directory.

    Which container setting applies this profile?
body:
  options:
    - id: a
      text: { en: "`seccompProfile: {type: RuntimeDefault, localhostProfile: profiles/audit-api.json}`" }
    - id: b
      text: { en: "A ConfigMap that holds the profile, mounted into the container at `/etc/seccomp`" }
    - id: c
      text: { en: "`seccompProfile: {type: Unconfined}` with `capabilities: {drop: [\"ALL\"]}`" }
    - id: d
      text: { en: "`seccompProfile: {type: Localhost, localhostProfile: profiles/audit-api.json}`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A `Localhost` seccomp profile is a profile file pre-loaded on the node. `localhostProfile` gives its path relative to the kubelet's configured seccomp profile location and may be set only with `type: Localhost`. The Restricted Pod Security Standard accepts both `RuntimeDefault` and `Localhost`.
  options:
    a:
      en: |
        `localhostProfile` must only be set when `type` is `Localhost`. `RuntimeDefault` applies the runtime's bundled profile, not a custom file.
    b:
      en: |
        Seccomp profiles are applied by the kubelet and the runtime from the node when the container starts. A file mounted inside the container is not used as a profile.
    c:
      en: |
        `Unconfined` disables seccomp filtering entirely, which Baseline and Restricted forbid. Dropping capabilities does not filter system calls.
references:
  - title: Configure a Security Context for a Pod or Container
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
