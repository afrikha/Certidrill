id: kcsa-4a-df-webhook-client-auth
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The team that runs a validating admission webhook wants its server to accept only requests that really come from the kube-apiserver. The webhook already serves a certificate that the API server verifies. How can the API server be made to authenticate itself to the webhook?
body:
  options:
    - id: a
      text: { en: "Put the API server's own certificate in the `caBundle` field of the ValidatingWebhookConfiguration" }
    - id: b
      text: { en: "Set `sideEffects: None` on the webhook so that the API server signs each admission request it sends" }
    - id: c
      text: { en: "Add a NetworkPolicy in the webhook's namespace that admits traffic only from the control plane Pods" }
    - id: d
      text: { en: "Start the API server with `--admission-control-config-file` pointing to credentials for the webhook" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, the flow from the API server to a webhook is authenticated in one direction only: the API server checks the webhook's serving certificate. To let the webhook authenticate the API server, the API server is started with `--admission-control-config-file`, whose configuration points to a kubeconfig file holding client credentials (a client certificate for mutual TLS, or a token) for the webhook's host. The webhook then requires and checks these credentials.
  options:
    a:
      en: |
        `caBundle` is the CA that the API server uses to verify the webhook's certificate. It protects the opposite direction and gives the webhook no proof of who is calling.
    b:
      en: |
        `sideEffects` declares whether the webhook changes state outside the object, which matters for dry-run requests. It has nothing to do with authentication.
    c:
      en: |
        Network filtering is not authentication, and the API server often runs with the host network, so it is not a Pod that a policy selector can identify reliably.
references:
  - title: Dynamic Admission Control
    url: https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
