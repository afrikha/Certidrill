id: kcsa-4b-list-secrets-reveals
objective: "4.6.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A monitoring tool is granted this Role so that it can count the Secrets in the `payments` namespace:

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: secret-inventory
      namespace: payments
    rules:
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["list"]
    ```

    The team says the tool cannot read Secret values because it lacks the `get` verb. Is the team right?
body:
  options:
    - id: a
      text: { en: "Yes: a `list` response returns only object names and metadata" }
    - id: b
      text: { en: "No: a `list` response contains the data of every Secret in `payments`" }
    - id: c
      text: { en: "Yes: values are removed unless the caller also holds `watch`" }
    - id: d
      text: { en: "No: `list` lets the tool read the Secrets of every namespace" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Listing Secrets returns the full objects, including their `data`. Granting `list` (or `watch`) on Secrets therefore lets the subject read the contents of all Secrets in scope, not only their names. Such access should be reserved for the most privileged system components.
  options:
    a:
      en: |
        Kubernetes has no names-only list for Secrets through this permission: `kubectl get secrets -n payments -o yaml` with this Role shows every value.
    c:
      en: |
        `list` alone already reveals the contents. `watch` is a separate verb that would also stream the contents of changes.
    d:
      en: |
        A Role and its RoleBinding are namespaced. The exposure is limited to the `payments` namespace, but it covers all Secrets there.
references:
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
  - title: Good practices for Kubernetes Secrets
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
