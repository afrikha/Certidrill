id: kcsa-4b-service-discovery-env-dns
objective: "4.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An attacker has a shell in a compromised Pod. The Pod has no ServiceAccount token mounted, so the attacker cannot query the Kubernetes API.

    How can the attacker still find the addresses of Services to attack next?
body:
  options:
    - id: a
      text: { en: "They cannot: Service addresses are visible only through the API" }
    - id: b
      text: { en: "From EndpointSlice files mounted into every container" }
    - id: c
      text: { en: "From the node's kubeconfig mounted into every container" }
    - id: d
      text: { en: "From `*_SERVICE_HOST` environment variables and cluster DNS" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The kubelet adds `{SVCNAME}_SERVICE_HOST` and `{SVCNAME}_SERVICE_PORT` environment variables for active Services, and the cluster DNS resolves Service names, including those of other namespaces (`name.namespace`). Discovery needs no API access, which is why lateral movement must be stopped by NetworkPolicies and by authentication on each service.
  options:
    a:
      en: |
        Environment variables and DNS publish Service addresses to every Pod, without any API permission.
    b:
      en: |
        EndpointSlices are API objects; they are not mounted into containers.
    c:
      en: |
        The node's kubelet credentials are not mounted into ordinary containers.
references:
  - title: Service
    url: https://kubernetes.io/docs/concepts/services-networking/service/
