id: kcsa-4a-dos-requests-not-cap
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A container declares `requests.memory: 256Mi` and no memory limit. A compromised process inside it allocates memory until its node runs short of memory. Why did the request not prevent this?
body:
  options:
    - id: a
      text: { en: "Requests are enforced only on nodes where swap memory is enabled" }
    - id: b
      text: { en: "Requests apply to init containers only, not to application containers" }
    - id: c
      text: { en: "A request reserves capacity for scheduling; it does not cap the container's usage" }
    - id: d
      text: { en: "Requests are ignored unless the Pod also sets a PriorityClass" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The scheduler uses requests to choose a node with enough capacity, and a container is allowed to use more than its request. Only a limit caps consumption: a container above its memory limit can be OOM-killed. Without a limit, this Pod is merely the likely victim of node-pressure eviction once the node runs short, after other workloads may already have suffered.
  options:
    a:
      en: |
        Swap has nothing to do with how requests work. Requests are a scheduling input on every node.
    b:
      en: |
        Every container can declare requests, and the scheduler counts them for application containers too.
    d:
      en: |
        A PriorityClass affects scheduling order and preemption. Requests are used whether or not a priority is set.
references:
  - title: Resource Management for Pods and Containers
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
