id: kcsa-4a-tm-steps
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team building the threat model of its cluster has listed the components, drawn the data flow diagram and placed the trust boundaries on it. What is the next step?
body:
  options:
    - id: a
      text: { en: "Choose the controls to implement and rank them by cost" }
    - id: b
      text: { en: "Review the model because the architecture has changed" }
    - id: c
      text: { en: "Enumerate the threats to each element and crossing flow" }
    - id: d
      text: { en: "Inventory the components of the control plane and nodes" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Once the system is described, the team asks what can go wrong: it enumerates the threats to each element and to each flow that crosses a trust boundary. A framework such as STRIDE (spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege) helps make this systematic. Controls are chosen afterwards, to treat the identified risks.
  options:
    a:
      en: |
        Controls are chosen after the threats are known, so that they can be ranked by the likelihood and impact of what they mitigate.
    b:
      en: |
        Reviewing the model is an ongoing step, triggered later by changes such as a new ingress, tenant or webhook.
    d:
      en: |
        The inventory of components is the first step, and the team has already done it.
references:
  - title: Cloud Native Security and Kubernetes
    url: https://kubernetes.io/docs/concepts/security/cloud-native-security/
