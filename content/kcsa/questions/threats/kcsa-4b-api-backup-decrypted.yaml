id: kcsa-4b-api-backup-decrypted
objective: "4.6.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Secrets are encrypted at rest with a KMS v2 provider. A backup tool, whose ServiceAccount can read all objects, exports every namespace through the Kubernetes API into an object storage bucket. The bucket is later found to be publicly readable.

    Can readers of the bucket recover the Secret values?
body:
  options:
    - id: a
      text: { en: "Yes: the API returns Secrets decrypted, so the export holds base64-encoded values" }
    - id: b
      text: { en: "No: the export contains KMS-encrypted data that only the external KMS can decrypt" }
    - id: c
      text: { en: "No: the API server strips the data of Secrets from responses to backup tools" }
    - id: d
      text: { en: "Only the Secrets that were created before encryption at rest was enabled" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Encryption at rest protects the data stored in etcd. The API server decrypts Secrets for every client that RBAC allows to read them, so an export made through the API contains the values, only base64-encoded. Such backups must be encrypted and access-controlled themselves, and the exposed credentials must be rotated.
  options:
    b:
      en: |
        Encrypted data is what etcd holds. Reads through the API always return decrypted objects.
    c:
      en: |
        The API returns full Secret objects to any client authorized to read them; there is no special treatment for backup tools.
    d:
      en: |
        All Secrets are returned decrypted through the API, whatever their storage state in etcd.
references:
  - title: Encrypting Confidential Data at Rest
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
