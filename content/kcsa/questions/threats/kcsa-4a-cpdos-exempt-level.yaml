id: kcsa-4a-cpdos-exempt-level
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    API Priority and Fairness runs with its default configuration. Requests from which identity are never queued or rejected by it, because the mandatory `exempt` FlowSchema classifies them into the `exempt` priority level?
body:
  options:
    - id: a
      text: { en: "Members of the `system:nodes` group, such as the kubelets" }
    - id: b
      text: { en: "Any client that sends a `watch` request" }
    - id: c
      text: { en: "Members of the `system:masters` group" }
    - id: d
      text: { en: "ServiceAccounts of the `kube-system` namespace" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The mandatory `exempt` FlowSchema classifies every request from the `system:masters` group into the `exempt` priority level, whose requests are always dispatched immediately. A flood sent with such a credential is therefore not contained by APF, one more reason to keep `system:masters` credentials for break-glass use only.
  options:
    a:
      en: |
        Kubelet requests are classified by the suggested FlowSchemas into non-exempt levels that give them a protected share, but they remain subject to flow control.
    b:
      en: |
        APF does apply to `watch` requests, during their initial burst of notifications. Long-running requests such as `exec` and log tailing are the ones it does not handle.
    d:
      en: |
        Controller ServiceAccounts are matched by suggested FlowSchemas to ordinary priority levels. They are not exempt.
references:
  - title: API Priority and Fairness
    url: https://kubernetes.io/docs/concepts/cluster-administration/flow-control/
