id: kcsa-4b-pod-literal-env
objective: "4.6.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Deployment in the `shop` namespace creates Pods with this container:

    ```yaml
    containers:
    - name: api
      image: registry.example.com/shop/api:2.0
      env:
      - name: DB_PASSWORD
        value: "S3cr3t-2026"
    ```

    Who can read this password through the Kubernetes API?
body:
  options:
    - id: a
      text: { en: "Only users who are allowed to read Secrets in `shop`" }
    - id: b
      text: { en: "Nobody, because the kubelet removes literal values after start" }
    - id: c
      text: { en: "Only the processes running inside the `api` container" }
    - id: d
      text: { en: "Anyone who can read the Pod or Deployment, such as users with `view`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A literal `value` is part of the Pod template, so it is stored in the Deployment and Pod objects. Anyone allowed to read them, including holders of the `view` role, which excludes Secrets but not Pods or Deployments, sees the password. Store it in a Secret and reference it, preferably as a mounted file.
  options:
    a:
      en: |
        RBAC on Secrets protects only Secret objects. This password is not in a Secret.
    b:
      en: |
        The Pod spec is stored in etcd and returned by the API as written; nothing removes the value.
    c:
      en: |
        The value is visible to the container, but also to every API client that can read the workload objects.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - title: Good practices for Kubernetes Secrets
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
