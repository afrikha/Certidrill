id: kcsa-4a-edos-networkpolicy-limits
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The `storefront` Service of type `LoadBalancer` is flooded by many internet clients that send normal-looking HTTPS requests. A team member proposes a NetworkPolicy to stop the flood. Why is a NetworkPolicy not suited to this attack?
body:
  options:
    - id: a
      text: { en: "NetworkPolicies apply only to egress traffic, never to traffic entering Pods" }
    - id: b
      text: { en: "NetworkPolicies allow or deny flows by peer and port, but cannot limit the rate of requests" }
    - id: c
      text: { en: "NetworkPolicies cannot select Pods that are behind a Service of type `LoadBalancer`" }
    - id: d
      text: { en: "NetworkPolicies are enforced by kube-proxy, which ignores traffic from outside the cluster" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A NetworkPolicy works at layers 3 and 4: it allows traffic from selected Pods, namespaces or IP blocks to selected ports. The public Service must accept traffic from any address on port 443, and the policy has no notion of request rate. Rate limiting at the ingress controller or gateway, a web application firewall, and the provider's DDoS protection are the suitable controls.
  options:
    a:
      en: |
        NetworkPolicies can restrict both ingress and egress traffic, selected with `policyTypes`.
    c:
      en: |
        A NetworkPolicy selects Pods by label, whatever the type of the Services that point to them.
    d:
      en: |
        NetworkPolicy is enforced by the network plugin, not by kube-proxy, and an `ipBlock` peer can match traffic from outside the cluster.
references:
  - title: Network Policies
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
