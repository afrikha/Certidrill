id: kcsa-4b-privileged-with-ape-false
objective: "4.7.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    To "make privileged mode safe", a developer gives a container this security context:

    ```yaml
    securityContext:
      privileged: true
      allowPrivilegeEscalation: false
    ```

    What happens when the Pod is submitted?
body:
  options:
    - id: a
      text: { en: "The Pod runs privileged, and setuid binaries can no longer raise privileges" }
    - id: b
      text: { en: "The Pod runs unprivileged, because `allowPrivilegeEscalation: false` takes precedence" }
    - id: c
      text: { en: "The Pod is admitted, and the kubelet silently ignores `privileged: true`" }
    - id: d
      text: { en: "The API server rejects the Pod, because the two settings are inconsistent" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `allowPrivilegeEscalation: false` cannot be set on a container that runs as privileged or has `CAP_SYS_ADMIN`: the combination is inconsistent and is rejected. The two fields control different things: `privileged` gives the container almost full access to the host, while `allowPrivilegeEscalation` only governs `no_new_privs`.
  options:
    a:
      en: |
        The combination is not accepted. Even if it were, `no_new_privs` would not limit a container that already holds every capability.
    b:
      en: |
        Neither field overrides the other; `allowPrivilegeEscalation` does not turn off privileged mode.
    c:
      en: |
        The kubelet does not drop fields from the spec; the inconsistency is caught before the Pod is stored.
references:
  - title: Configure a Security Context for a Pod or Container
    url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
