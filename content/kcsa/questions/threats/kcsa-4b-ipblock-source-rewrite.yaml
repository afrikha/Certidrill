id: kcsa-4b-ipblock-source-rewrite
objective: "4.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An admin UI is exposed through a `LoadBalancer` Service. To limit its exposure, a NetworkPolicy on its Pods allows ingress only from the office range with `ipBlock: {cidr: 203.0.113.0/24}`. After deployment, requests from the office are blocked or allowed inconsistently, depending on the path they take.

    What is the most likely cause?
body:
  options:
    - id: a
      text: { en: "The load balancer or the node may rewrite the client source IP before the policy is applied" }
    - id: b
      text: { en: "`ipBlock` rules are evaluated only for egress traffic, never for ingress traffic" }
    - id: c
      text: { en: "NetworkPolicies never apply to traffic that reaches Pods through a Service" }
    - id: d
      text: { en: "`ipBlock` accepts only Pod CIDR ranges, never addresses outside the cluster" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Cluster ingress often rewrites the source IP of packets, and whether this happens before or after NetworkPolicy processing is not defined: the source can be the client's IP, the load balancer's or the node's. `ipBlock` rules on ingress through a load balancer are therefore unreliable as the only exposure control; restrict access at the load balancer or put the UI behind an authenticated entry point.
  options:
    b:
      en: |
        `ipBlock` can be used in both `from` (ingress) and `to` (egress) rules.
    c:
      en: |
        Traffic delivered through a Service still reaches the Pods and is subject to their policies; the issue is which source IP the policy sees.
    d:
      en: |
        `ipBlock` is meant for cluster-external ranges; Pod IPs are ephemeral and are usually matched with selectors.
references:
  - title: Network Policies
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
