id: kcsa-4a-mc-cryptomining
objective: "4.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The CPU usage of a `web` container has been pinned at its limit for two days, although traffic is normal. Falco reports a process named `kworkerd`, which is not part of the image, holding long-lived outbound connections to an unknown internet host. What is the attacker most likely doing?
body:
  options:
    - id: a
      text: { en: "Escaping to the node through the container runtime socket" }
    - id: b
      text: { en: "Hijacking the container's CPU to mine cryptocurrency" }
    - id: c
      text: { en: "Tampering with the objects stored in etcd" }
    - id: d
      text: { en: "Spoofing the answers of the cluster DNS service" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sustained high CPU from an unknown process, together with outbound connections to an external host, matches resource hijacking for cryptomining (MITRE ATT&CK T1496). It is the most common payload after a container compromise because it needs only CPU and outbound network access. CPU limits contain the cost, and egress restrictions and runtime detection make it harder to run unnoticed.
  options:
    a:
      en: |
        Escape through the runtime socket would show up as new containers started on the node, not as a steady CPU load inside the existing container.
    c:
      en: |
        Tampering with etcd requires access to etcd or the API server; it would not explain a long-running CPU-bound process inside the container.
    d:
      en: |
        DNS spoofing targets name resolution of other workloads. It does not consume the container's CPU for days.
references:
  - title: "Resource Hijacking, Technique T1496 - Enterprise | MITRE ATT&CK®"
    url: https://attack.mitre.org/techniques/T1496/
