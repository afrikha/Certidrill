id: kcsa-4b-secret-volume-tmpfs
objective: "4.6.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod running on `node-2` mounts the Secret `tls-key` as a volume.

    Which statement describes how the kubelet on `node-2` handles this Secret's data?
body:
  options:
    - id: a
      text: { en: "It writes the data to the node's disk and keeps it after the Pod is deleted" }
    - id: b
      text: { en: "It copies every Secret of the namespace to the node when the first Pod starts there" }
    - id: c
      text: { en: "It keeps a copy in a `tmpfs`, off durable storage, and deletes it when the Pod is deleted" }
    - id: d
      text: { en: "It decrypts the data locally with the key from the API server's EncryptionConfiguration" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Secret is sent to a node only if a Pod on that node needs it. For a mounted Secret, the kubelet stores the data in a `tmpfs` so that it is not written to durable storage, and deletes its local copy once the Pod is deleted. Anyone with root on the node, or a privileged container there, can still read it while it is in use.
  options:
    a:
      en: |
        The kubelet deliberately avoids durable storage for Secret volumes and removes the data when the Pod that uses it is deleted.
    b:
      en: |
        Only the Secrets that a Pod on the node requests are sent to that node, not every Secret of the namespace.
    d:
      en: |
        Encryption at rest is done by the API server before writing to etcd; the API server decrypts on read. The kubelet receives the data in clear over TLS and never holds the encryption key.
references:
  - title: Secrets
    url: https://kubernetes.io/docs/concepts/configuration/secret/
