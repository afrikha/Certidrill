id: kcsa-4a-cp-find-token-secrets
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After an incident, a responder wants to list every long-lived ServiceAccount token Secret, in all namespaces, to look for tokens created by the attacker. Which command does this?
body:
  options:
    - id: a
      text: { en: "`kubectl get serviceaccounts -A`" }
    - id: b
      text: { en: "`kubectl get secrets -A --field-selector type=kubernetes.io/service-account-token`" }
    - id: c
      text: { en: "`kubectl auth can-i --list --as=system:serviceaccount:default:default`" }
    - id: d
      text: { en: "`kubectl get secrets -A --field-selector metadata.namespace=kube-system`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Secrets support the `type` field selector, so this command returns every Secret of type `kubernetes.io/service-account-token` in all namespaces. Each one holds a non-expiring token; a Secret that nobody expects, or that was created during the incident, should be deleted.
  options:
    a:
      en: |
        This lists the ServiceAccount objects, not the Secrets that hold their long-lived tokens.
    c:
      en: |
        This shows the permissions of one ServiceAccount. It does not list credentials.
    d:
      en: |
        This lists Secrets of every type, and only in `kube-system`: token Secrets in other namespaces would be missed.
references:
  - title: Field Selectors
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/field-selectors/
  - title: Managing Service Accounts
    url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
