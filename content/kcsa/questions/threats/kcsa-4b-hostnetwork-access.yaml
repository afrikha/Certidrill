id: kcsa-4b-hostnetwork-access
objective: "4.7.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Pod in the `shop` namespace sets `hostNetwork: true`, and its container is compromised.

    Which ability does this setting give the attacker that a container in a normal Pod does not have?
body:
  options:
    - id: a
      text: { en: "Seeing and signalling every process running on the node" }
    - id: b
      text: { en: "Reaching services that listen only on the node's loopback interface" }
    - id: c
      text: { en: "Mounting any directory of the node's filesystem into the container" }
    - id: d
      text: { en: "Loading kernel modules into the kernel of the node" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `hostNetwork: true` the container uses the node's network namespace: it can reach services bound to the node's `localhost`, bind node ports and observe node traffic. NetworkPolicies also usually treat its traffic as node traffic. The Baseline Pod Security Standard forbids host namespaces.
  options:
    a:
      en: |
        Seeing and signalling host processes comes from sharing the process namespace with `hostPID: true`.
    c:
      en: |
        Access to the node's filesystem comes from a `hostPath` volume, not from the network namespace.
    d:
      en: |
        Loading kernel modules needs `SYS_MODULE` or privileged mode; the network namespace does not grant it.
references:
  - title: Pod Security Standards
    url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - title: Network Policies
    url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
