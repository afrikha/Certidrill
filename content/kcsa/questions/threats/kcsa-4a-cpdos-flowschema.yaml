id: kcsa-4a-cpdos-flowschema
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An administrator wants every API request sent by the ServiceAccount `reporting` of the `analytics` namespace to be handled at a low-priority level of API Priority and Fairness. Which object matches these requests and assigns them to that level?
body:
  options:
    - id: a
      text: { en: "A PriorityClass" }
    - id: b
      text: { en: "A PriorityLevelConfiguration" }
    - id: c
      text: { en: "A ResourceQuota with a priority `scopeSelector`" }
    - id: d
      text: { en: "A FlowSchema" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A FlowSchema matches inbound requests, for example by user, group, ServiceAccount, verb or resource, and assigns them to a priority level; the first matching FlowSchema wins. The priority level itself is a PriorityLevelConfiguration, which sets its share of concurrency and whether excess requests are queued or rejected.
  options:
    a:
      en: |
        A PriorityClass sets the scheduling priority and preemption order of Pods. It has no effect on how API requests are handled.
    b:
      en: |
        A PriorityLevelConfiguration defines a level's concurrency share and queuing behavior, but it does not select which requests belong to it.
    c:
      en: |
        A quota scoped by priority limits the resources consumed by Pods of a given PriorityClass. It does not classify API requests.
references:
  - title: API Priority and Fairness
    url: https://kubernetes.io/docs/concepts/cluster-administration/flow-control/
