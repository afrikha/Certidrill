id: kcsa-4a-tb-node-credential-boundary
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An attacker who took over the node `worker-3` uses the kubelet's credentials to try to change the labels of the Node object `worker-5` and to modify Pods that run on other nodes. Which trust boundary is the attacker trying to cross, and which controls enforce it?
body:
  options:
    - id: a
      text: { en: "Nodes and control plane, enforced by the Node authorizer and the NodeRestriction plugin" }
    - id: b
      text: { en: "Container and node, enforced by seccomp profiles and by AppArmor or SELinux" }
    - id: c
      text: { en: "Tenant namespaces, enforced by NetworkPolicy objects and ResourceQuota objects" }
    - id: d
      text: { en: "External clients and API server, enforced by OpenID Connect authentication" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The kubelet authenticates as `system:node:worker-3` in the `system:nodes` group. The Node authorizer limits kubelets to the objects related to their own node, and the NodeRestriction admission plugin limits their writes to their own Node object and the Pods bound to that node. Together they keep a compromised node from taking over the control plane or other nodes.
  options:
    b:
      en: |
        The attacker is already past the container boundary: they act on the node with the kubelet's credentials. seccomp and Linux security modules confine container processes, not API requests.
    c:
      en: |
        The requests target a cluster-scoped Node object and Pods through the API. NetworkPolicy and quotas do not authorize API requests.
    d:
      en: |
        The kubelet's certificate authenticates successfully. What must be limited is what this node identity is authorized to do, not how it logs in.
references:
  - title: Using Node Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/node/
