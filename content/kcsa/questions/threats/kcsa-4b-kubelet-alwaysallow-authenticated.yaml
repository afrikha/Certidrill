id: kcsa-4b-kubelet-alwaysallow-authenticated
objective: "4.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A kubelet has anonymous authentication disabled and validates bearer tokens with the API server (TokenReview), but its authorization mode is still `AlwaysAllow`. An attacker steals the token of a ServiceAccount that has no RBAC permissions and can reach port 10250 of the node.

    What can the attacker do through this kubelet's API?
body:
  options:
    - id: a
      text: { en: "Nothing, because the ServiceAccount has no RBAC permissions" }
    - id: b
      text: { en: "Only read metrics, because `AlwaysAllow` covers read-only paths" }
    - id: c
      text: { en: "Only reach the Pods of the ServiceAccount's own namespace" }
    - id: d
      text: { en: "Run commands in any container that runs on this node" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Disabling anonymous access only ensures that callers are authenticated. With `AlwaysAllow`, every authenticated request is authorized, so any valid token, including a stolen ServiceAccount token, reaches every kubelet API such as exec and logs. `Webhook` authorization makes the kubelet check each request with a SubjectAccessReview, so RBAC applies.
  options:
    a:
      en: |
        RBAC is consulted only in `Webhook` mode. In `AlwaysAllow` mode the kubelet never asks the API server.
    b:
      en: |
        `AlwaysAllow` allows all requests, including command execution, not only read-only paths.
    c:
      en: |
        The kubelet in `AlwaysAllow` mode does not restrict callers by namespace; every Pod on the node is reachable.
references:
  - title: Kubelet authentication/authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
