id: kcsa-4a-mc-initial-access
objective: "4.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A public web application runs in the `shop` namespace. What is the most common way for an outside attacker to first run code inside one of its containers?
body:
  options:
    - id: a
      text: { en: "Logging in to the container over SSH with a default root password" }
    - id: b
      text: { en: "Reading the container's memory through the cluster DNS service" }
    - id: c
      text: { en: "Exploiting a vulnerability in the application or in one of its dependencies" }
    - id: d
      text: { en: "Querying the node's kubelet read-only port to open a shell" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Most container compromises start with the application: a remote code execution flaw in its code or in a library it depends on, reached through its public endpoint (MITRE ATT&CK Exploit Public-Facing Application, T1190). The attacker's code then runs with the container's identity, files, network access and ServiceAccount token. Patching dependencies, scanning images and hardening the Pod limit both the entry point and what follows.
  options:
    a:
      en: |
        Container images normally run a single application and no SSH server, so there is no login service to attack.
    b:
      en: |
        The cluster DNS service resolves names. It gives no access to the memory of a container.
    d:
      en: |
        The kubelet read-only port, when enabled, exposes information about Pods and the node. It offers no way to run commands.
references:
  - title: "Matrix - Enterprise - Containers | MITRE ATT&CK®"
    url: https://attack.mitre.org/matrices/enterprise/containers/
