id: kcsa-4b-update-rolebinding-blocked
objective: "4.7.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In the `shop` namespace, the RoleBinding `admins` references the `admin` ClusterRole. User `kim` has `get`, `update` and `patch` on `rolebindings` in `shop`, but does not hold the permissions of `admin` and has no `bind` permission.

    What happens when `kim` adds herself to the subjects of `admins`?
body:
  options:
    - id: a
      text: { en: "It succeeds, because changing subjects does not change the referenced role" }
    - id: b
      text: { en: "It is rejected, because `kim` lacks the permissions of `admin` and `bind` on it" }
    - id: c
      text: { en: "It succeeds, but the new subject receives only `view`-level access" }
    - id: d
      text: { en: "It is rejected, because the subjects of a RoleBinding are immutable" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      RBAC prevents escalation by editing bindings: a user can create or update a role binding only if they already hold all the permissions of the referenced role, at the same scope, or are allowed the `bind` verb on that role. Editing RBAC objects becomes an escalation path only when `bind` or `escalate` is also granted.
  options:
    a:
      en: |
        The check applies to every create or update of a binding, including a change of subjects.
    c:
      en: |
        RBAC never downgrades a binding; the request is either authorized as written or rejected.
    d:
      en: |
        It is the `roleRef` of a binding that cannot be changed. Subjects can be updated by users who pass the escalation check.
references:
  - title: Using RBAC Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
