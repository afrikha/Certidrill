id: kcsa-4a-tm-tenant-crossing-flow
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The threat model of a shared cluster places a trust boundary between the namespaces of tenant A and tenant B. Which of these data flows crosses that boundary?
body:
  options:
    - id: a
      text: { en: "A Pod of tenant A that connects to a Service of tenant B over the Pod network" }
    - id: b
      text: { en: "A Pod of tenant A that reads a ConfigMap of its own namespace through the API" }
    - id: c
      text: { en: "A container of tenant A that writes temporary files to its own emptyDir volume" }
    - id: d
      text: { en: "The kubelet that pulls tenant A's image from the company's private registry" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Only this flow goes from one tenant's workloads to the other's. By default all Pods can communicate, so the model should record threats such as lateral movement and data access between tenants, and controls such as a default deny NetworkPolicy with explicit allow rules, or mutual TLS with workload identities.
  options:
    b:
      en: |
        This flow crosses the boundary between a workload and the API server, but it stays within tenant A's own data, governed by RBAC in its namespace.
    c:
      en: |
        Writing to the Pod's own volume stays inside the Pod. It does not reach tenant B.
    d:
      en: |
        This is a flow between the node and the registry for tenant A's own image. It does not involve tenant B.
references:
  - title: Multi-tenancy
    url: https://kubernetes.io/docs/concepts/security/multi-tenancy/
