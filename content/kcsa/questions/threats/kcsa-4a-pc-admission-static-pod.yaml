id: kcsa-4a-pc-admission-static-pod
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A cluster enforces the Restricted Pod Security Standard in every namespace except `kube-system`, and a Kyverno policy that admits only images from the company registry in every namespace. An attacker wants to start a privileged container from an image on a public registry. Which technique still works?
body:
  options:
    - id: a
      text: { en: "Creating a DaemonSet with stolen credentials of a user who may create DaemonSets in the `ops` namespace" }
    - id: b
      text: { en: "Creating a CronJob whose Job template runs the privileged container every five minutes" }
    - id: c
      text: { en: "Writing a static Pod manifest into the kubelet's manifest directory on a compromised node" }
    - id: d
      text: { en: "Patching an existing Deployment to add the privileged container to its Pod template" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Admission controls, including Pod Security Admission and Kyverno, evaluate requests sent to the API server. A static Pod is run by the kubelet directly from a local file, without the API server managing it, so an admission policy does not stop the kubelet from starting it. Node access controls, file integrity monitoring and runtime detection such as Falco are the controls that cover this path.
  options:
    a:
      en: |
        The DaemonSet controller creates its Pods through the API server, so Pod Security Admission and the Kyverno policy reject them.
    b:
      en: |
        The Pods created by the CronJob's Jobs are submitted to the API server and are rejected at admission.
    d:
      en: |
        The new Pods of the patched Deployment go through admission and are rejected by both policies.
references:
  - title: Static Pods
    url: https://kubernetes.io/docs/concepts/workloads/pods/static-pods/
