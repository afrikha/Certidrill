id: kcsa-4a-dos-pid-limit
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A compromised container runs a fork bomb that creates processes until the node runs out of process IDs, and the kubelet and container runtime start failing. Which control limits the number of processes that a single Pod can create?
body:
  options:
    - id: a
      text: { en: "A Pod PID limit, set on the kubelet with `podPidsLimit` or `--pod-max-pids`" }
    - id: b
      text: { en: "A ResourceQuota with `pods: \"20\"` in the namespace of the Pod" }
    - id: c
      text: { en: "A memory limit on the container that runs the fork bomb" }
    - id: d
      text: { en: "A LimitRange with a maximum CPU value for each container" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Process IDs are a node resource that can run out without any other limit being reached. A per-Pod PID limit, configured on each node through the kubelet, makes sure that one Pod cannot exhaust them and bring down host daemons such as the kubelet. Node PID reservations and the `pid.available` eviction signal add further protection.
  options:
    b:
      en: |
        The `pods` quota counts Pods in the namespace. It does not limit the processes inside one Pod.
    c:
      en: |
        Processes can be very small, so a fork bomb can exhaust process IDs long before it reaches a memory limit.
    d:
      en: |
        A CPU maximum controls CPU time, not the number of processes a container can create.
references:
  - title: Process ID Limits And Reservations
    url: https://kubernetes.io/docs/concepts/policy/pid-limiting/
