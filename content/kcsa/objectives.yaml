# KCSA objectives — Kubernetes and Cloud Native Security Associate.
# Sources (checked on 2026-11-23): the curriculum PDF "KCSA Curriculum.pdf" of
# github.com/cncf/curriculum (no version number printed; PDF last modified 2024-06-24) and the
# Linux Foundation certification page (training.linuxfoundation.org/certification/
# kubernetes-and-cloud-native-security-associate-kcsa/).
# One group per curriculum competency, with its official name, in the curriculum's order.
# The curriculum lists ONLY competency names (no bullet points under them): the objectives below
# were written by Certidrill (3-4 per competency) to restate precisely what each competency
# covers, from the Kubernetes security documentation (kubernetes.io/docs/concepts/security/ and
# linked pages), the CNCF Cloud Native Security Whitepaper and the CNCF projects in scope.
# "Authorization" (3.4) is listed on the Linux Foundation page but missing from the PDF: kept.
# "Threat Modeling Frameworks" is spelled as in the PDF (the LF page writes "Modelling").
# Facts are stated for Kubernetes v1.37 (blueprint version; the KCSA exam publishes no
# Kubernetes version).
# Codes <domain order>.<competency>.<n>; `code` is the stable key referenced by question files
# and course sections. English only (the exam is offered in English only).
overview:
- group:
    en: 'The 4Cs of Cloud Native Security'
  objectives:
  - code: 1.1.1
    en: 'Describe the 4Cs layered model (Cloud, Cluster, Container, Code) and why each layer depends on the security of the layers around it'
  - code: 1.1.2
    en: 'Identify the security controls that belong to each layer of the 4Cs model'
  - code: 1.1.3
    en: 'Relate the 4Cs model to defense in depth and to the cloud native security lifecycle phases (Develop, Distribute, Deploy, Runtime)'
- group:
    en: 'Cloud Provider and Infrastructure Security'
  objectives:
  - code: 1.2.1
    en: 'Describe the shared responsibility between a cloud or infrastructure provider and the cluster operator, for self-managed clusters and for a managed Kubernetes service'
  - code: 1.2.2
    en: 'Describe infrastructure controls around a cluster: private network access to the control plane and nodes, firewalls, and least-privilege cloud identities for nodes'
  - code: 1.2.3
    en: 'Describe the risk of instance metadata services reachable from Pods and how to restrict access to them'
  - code: 1.2.4
    en: 'Describe host hardening for nodes: minimal or immutable operating systems, patching, and restricted administrative access'
- group:
    en: 'Controls and Frameworks'
  objectives:
  - code: 1.3.1
    en: 'Distinguish preventive, detective and corrective (responsive) security controls and give a Kubernetes example of each'
  - code: 1.3.2
    en: 'Describe the security principles applied to cloud native systems: least privilege, defense in depth, zero trust, and secure defaults'
  - code: 1.3.3
    en: 'Identify the role of security guidance (CIS Kubernetes Benchmark, NIST publications, the CNCF Cloud Native Security Whitepaper, the Kubernetes security checklist) in choosing controls'
- group:
    en: 'Isolation Techniques'
  objectives:
  - code: 1.4.1
    en: 'Describe the Linux kernel features that isolate containers: namespaces, cgroups, capabilities, seccomp, and Linux security modules (AppArmor, SELinux)'
  - code: 1.4.2
    en: 'Compare isolation strengths: containers sharing the host kernel, user namespaces (hostUsers: false), sandboxed runtimes (gVisor, Kata Containers) selected with a RuntimeClass, and virtual machines'
  - code: 1.4.3
    en: 'Describe Kubernetes isolation boundaries: namespaces, dedicated nodes (taints, tolerations, node affinity), and separate clusters'
- group:
    en: 'Artifact Repository and Image Security'
  objectives:
  - code: 1.5.1
    en: 'Describe secure container image practices: minimal or distroless base images, no secrets in image layers, a non-root default user, and multi-stage builds'
  - code: 1.5.2
    en: 'Describe image vulnerability scanning in build pipelines and in registries, and the need to rescan images as new vulnerabilities are published'
  - code: 1.5.3
    en: 'Describe image references by digest versus mutable tags, and image signing and verification before deployment'
  - code: 1.5.4
    en: 'Describe access control for artifact repositories: private registries, authenticated pulls with imagePullSecrets, and restricting which registries a cluster may pull from'
- group:
    en: 'Workload and Application Code Security'
  objectives:
  - code: 1.6.1
    en: 'Describe secure development practices for cloud native applications: dependency management, static and dynamic analysis (SAST, DAST), and code review'
  - code: 1.6.2
    en: 'Describe how workloads should receive credentials and configuration: Secrets mounted as volumes or environment variables, and external secret stores'
  - code: 1.6.3
    en: 'Describe workload hardening with the Pod and container securityContext and resource limits'
components:
- group:
    en: 'API Server'
  objectives:
  - code: 2.1.1
    en: 'Describe the stages of an API request: authentication, authorization, admission control, then validation and persistence in etcd'
  - code: 2.1.2
    en: 'Describe how access to the kube-apiserver is secured: TLS on the secure port, anonymous access disabled or restricted, and limited network exposure of the endpoint'
  - code: 2.1.3
    en: 'Identify API server settings that affect security: authorization modes (Node, RBAC), enabled admission plugins, audit logging, and encryption at rest configuration'
- group:
    en: 'Controller Manager'
  objectives:
  - code: 2.2.1
    en: 'Describe the role of kube-controller-manager and why its credentials are sensitive (it can act on most cluster resources and holds signing keys)'
  - code: 2.2.2
    en: 'Describe hardening of kube-controller-manager: individual ServiceAccount credentials per controller, a secure bind address, and protected key files'
  - code: 2.2.3
    en: 'Describe the role of the cloud-controller-manager and the cloud credentials it uses'
- group:
    en: 'Scheduler'
  objectives:
  - code: 2.3.1
    en: 'Describe the role of kube-scheduler and the impact of a compromised or misconfigured scheduler on workload placement'
  - code: 2.3.2
    en: 'Describe hardening of kube-scheduler: authenticated and authorized access, a secure bind address, and a protected scheduler configuration'
  - code: 2.3.3
    en: 'Describe how node selectors, affinity, taints and tolerations keep workloads of different trust levels on separate nodes'
- group:
    en: 'Kubelet'
  objectives:
  - code: 2.4.1
    en: 'Describe the kubelet API and the risk of anonymous or unauthenticated access to it'
  - code: 2.4.2
    en: 'Describe kubelet hardening: anonymous authentication disabled, Webhook authorization, client certificate authentication, and the read-only port disabled'
  - code: 2.4.3
    en: 'Describe how the Node authorizer and the NodeRestriction admission plugin limit what a kubelet can read and modify'
  - code: 2.4.4
    en: 'Describe kubelet TLS bootstrapping and certificate rotation'
- group:
    en: 'Container Runtime'
  objectives:
  - code: 2.5.1
    en: 'Describe the Container Runtime Interface (CRI), high-level runtimes (containerd, CRI-O) and low-level OCI runtimes (runc)'
  - code: 2.5.2
    en: 'Describe the risk of mounting the container runtime socket into a container'
  - code: 2.5.3
    en: 'Describe sandboxed runtimes (gVisor, Kata Containers) and how a RuntimeClass assigns them to Pods'
- group:
    en: 'KubeProxy'
  objectives:
  - code: 2.6.1
    en: 'Describe the role of kube-proxy in implementing Services on each node and the privileges it needs'
  - code: 2.6.2
    en: 'Describe securing kube-proxy: protected kubeconfig and configuration files, and metrics and health endpoints that are not exposed beyond the node'
  - code: 2.6.3
    en: 'Describe the security implications of Service types that expose workloads outside the cluster (NodePort, LoadBalancer)'
- group:
    en: 'Pod'
  objectives:
  - code: 2.7.1
    en: 'Describe Pod and container securityContext settings: runAsUser, runAsNonRoot, readOnlyRootFilesystem, allowPrivilegeEscalation, capabilities, and seccompProfile'
  - code: 2.7.2
    en: 'Identify risky Pod settings: privileged containers, hostNetwork, hostPID, hostIPC, hostPath volumes, and host ports'
  - code: 2.7.3
    en: 'Describe the ServiceAccount of a Pod: automountServiceAccountToken and projected, time-limited tokens'
- group:
    en: 'Etcd'
  objectives:
  - code: 2.8.1
    en: 'Describe why etcd is the most sensitive data store of a cluster and what an attacker gains with direct access to it'
  - code: 2.8.2
    en: 'Describe etcd hardening: TLS for client and peer traffic, client certificate authentication, and network access limited to the API server'
  - code: 2.8.3
    en: 'Describe encryption at rest of resources stored in etcd and the protection of etcd backups'
- group:
    en: 'Container Networking'
  objectives:
  - code: 2.9.1
    en: 'Describe the Kubernetes network model (every Pod can reach every other Pod by default) and its security implications'
  - code: 2.9.2
    en: 'Describe the role of CNI plugins in enforcing NetworkPolicy and in encrypting Pod-to-Pod traffic'
  - code: 2.9.3
    en: 'Describe the separation of control plane, node and Pod networks and the protection of cluster DNS'
- group:
    en: 'Client Security'
  objectives:
  - code: 2.10.1
    en: 'Describe kubeconfig files and how to protect the credentials they contain'
  - code: 2.10.2
    en: 'Compare client authentication methods (X.509 client certificates, OIDC tokens, client-go credential plugins) and the risks of long-lived credentials'
  - code: 2.10.3
    en: 'Describe least privilege for human users: personal identities instead of shared cluster-admin credentials, and checking permissions with kubectl auth can-i'
- group:
    en: 'Storage'
  objectives:
  - code: 2.11.1
    en: 'Describe storage risks: hostPath volumes, PersistentVolumes shared between workloads, and data left on reclaimed volumes'
  - code: 2.11.2
    en: 'Describe encryption of volumes at rest and in transit and the role of CSI drivers and StorageClasses'
  - code: 2.11.3
    en: 'Describe access control for storage: namespace-scoped PersistentVolumeClaims, access modes, fsGroup and file ownership, and read-only mounts'
fundamentals:
- group:
    en: 'Pod Security Standards'
  objectives:
  - code: 3.1.1
    en: 'Describe the three Pod Security Standards profiles: Privileged, Baseline and Restricted'
  - code: 3.1.2
    en: 'Identify the controls that the Baseline profile enforces (host namespaces, privileged containers, added capabilities, hostPath volumes, host ports)'
  - code: 3.1.3
    en: 'Identify the additional controls of the Restricted profile (running as non-root, no privilege escalation, dropping all capabilities, seccomp profile, allowed volume types)'
  - code: 3.1.4
    en: 'Choose the appropriate profile for a namespace or workload'
- group:
    en: 'Pod Security Admissions'
  objectives:
  - code: 3.2.1
    en: 'Describe the built-in Pod Security Admission controller and why it replaced PodSecurityPolicy (removed in Kubernetes v1.25)'
  - code: 3.2.2
    en: 'Apply Pod Security Standards to a namespace with labels: the enforce, audit and warn modes and version pinning'
  - code: 3.2.3
    en: 'Describe exemptions and cluster-wide defaults set in the admission configuration, and when a third-party policy engine is needed instead'
- group:
    en: 'Authentication'
  objectives:
  - code: 3.3.1
    en: 'Describe how Kubernetes identifies callers: normal users are not API objects, ServiceAccounts are, and groups such as system:authenticated'
  - code: 3.3.2
    en: 'Describe authentication strategies: X.509 client certificates, bearer tokens, OpenID Connect, webhook token authentication, and authenticating proxies'
  - code: 3.3.3
    en: 'Describe ServiceAccount tokens: bound, time-limited tokens from the TokenRequest API in projected volumes, versus legacy long-lived Secret-based tokens'
  - code: 3.3.4
    en: 'Describe anonymous requests (system:anonymous) and why anonymous access should be disabled or tightly limited'
- group:
    en: 'Authorization'
  objectives:
  - code: 3.4.1
    en: 'Describe the authorization modes of the API server: Node, RBAC, Webhook, ABAC, AlwaysAllow and AlwaysDeny'
  - code: 3.4.2
    en: 'Describe the RBAC objects (Role, ClusterRole, RoleBinding, ClusterRoleBinding), their scope, subjects, resources and verbs'
  - code: 3.4.3
    en: 'Apply least privilege with RBAC: avoid wildcards and cluster-admin, and restrict sensitive permissions (reading Secrets, creating Pods, escalate, bind, impersonate)'
  - code: 3.4.4
    en: 'Check effective permissions with kubectl auth can-i and impersonation'
- group:
    en: 'Secrets'
  objectives:
  - code: 3.5.1
    en: 'Describe Kubernetes Secrets, their built-in types, and why base64 encoding is not encryption'
  - code: 3.5.2
    en: 'Describe encryption at rest with an EncryptionConfiguration and its providers (identity, aescbc, aesgcm, secretbox, kms v2)'
  - code: 3.5.3
    en: 'Describe good practices for Secrets: least-privilege RBAC, volumes rather than environment variables, immutable Secrets, and external secret managers'
- group:
    en: 'Isolation and Segmentation'
  objectives:
  - code: 3.6.1
    en: 'Describe namespaces as a unit of isolation and their limits as a security boundary'
  - code: 3.6.2
    en: 'Describe multi-tenancy models: soft and hard multi-tenancy, namespace per tenant, control plane per tenant, and cluster per tenant'
  - code: 3.6.3
    en: 'Describe resource isolation with ResourceQuota and LimitRange'
  - code: 3.6.4
    en: 'Describe node isolation for workloads of different sensitivity: dedicated node pools, taints and tolerations, and RuntimeClass'
- group:
    en: 'Audit Logging'
  objectives:
  - code: 3.7.1
    en: 'Describe Kubernetes auditing: the API server records events at the stages RequestReceived, ResponseStarted, ResponseComplete and Panic'
  - code: 3.7.2
    en: 'Describe audit policy rules and levels: None, Metadata, Request and RequestResponse'
  - code: 3.7.3
    en: 'Describe audit backends (log and webhook) and the protection, retention and analysis of audit logs'
- group:
    en: 'Network Policy'
  objectives:
  - code: 3.8.1
    en: 'Describe NetworkPolicy objects: podSelector, policyTypes, ingress and egress rules, namespaceSelector and ipBlock peers, and how policies combine'
  - code: 3.8.2
    en: 'Implement default deny policies for ingress and egress traffic and allow only required flows such as DNS'
  - code: 3.8.3
    en: 'Describe the limits of NetworkPolicy: enforcement depends on the network plugin, and rules work at layers 3 and 4 only'
threats:
- group:
    en: 'Kubernetes Trust Boundaries and Data Flow'
  objectives:
  - code: 4.1.1
    en: 'Identify the trust boundaries of a cluster: external clients and the API server, control plane and nodes, node and container, namespaces and tenants'
  - code: 4.1.2
    en: 'Describe the data flows between cluster components (API server, etcd, kubelet, controllers, workloads) and how each flow is authenticated and encrypted'
  - code: 4.1.3
    en: 'Describe how a threat model of a Kubernetes deployment is built from its components, data flows and trust boundaries'
- group:
    en: 'Persistence'
  objectives:
  - code: 4.2.1
    en: 'Describe how attackers keep access to a cluster: backdoored images, static Pods, DaemonSets, CronJobs, and malicious admission webhooks'
  - code: 4.2.2
    en: 'Describe credential-based persistence: long-lived ServiceAccount tokens, client certificates, and added RoleBindings'
  - code: 4.2.3
    en: 'Describe controls that prevent or detect persistence: audit log review, trusted images, immutable containers, and runtime detection'
- group:
    en: 'Denial of Service'
  objectives:
  - code: 4.3.1
    en: 'Describe resource exhaustion attacks against nodes and workloads and their mitigation with requests, limits, ResourceQuota and LimitRange'
  - code: 4.3.2
    en: 'Describe denial of service against the control plane (API server, etcd) and protections such as API Priority and Fairness'
  - code: 4.3.3
    en: 'Describe network-level denial of service against exposed services and mitigations at the cluster edge'
- group:
    en: 'Malicious Code Execution and Compromised Applications in Containers'
  objectives:
  - code: 4.4.1
    en: 'Describe how a compromised application in a container is used by an attacker: remote code execution, running tools, and resource abuse such as cryptomining'
  - code: 4.4.2
    en: 'Describe container escape paths: privileged containers, sensitive hostPath mounts, the container runtime socket, excessive capabilities, and kernel vulnerabilities'
  - code: 4.4.3
    en: 'Describe mitigations: read-only root filesystems, non-root users, dropped capabilities, seccomp, AppArmor or SELinux, and sandboxed runtimes'
- group:
    en: 'Attacker on the Network'
  objectives:
  - code: 4.5.1
    en: 'Describe network threats inside a cluster: lateral movement between Pods, eavesdropping on unencrypted traffic, and spoofing'
  - code: 4.5.2
    en: 'Describe the risk of cluster components and tools reachable from the network (kubelet, etcd, dashboards, metadata endpoints)'
  - code: 4.5.3
    en: 'Describe mitigations: NetworkPolicy, mutual TLS, encrypted Pod networking, and minimal exposure of Services'
- group:
    en: 'Access to Sensitive Data'
  objectives:
  - code: 4.6.1
    en: 'Identify where sensitive data lives in a cluster: Secrets in etcd, environment variables, volumes, logs, and container images'
  - code: 4.6.2
    en: 'Describe how attackers reach sensitive data: permissive RBAC on Secrets, mounted ServiceAccount tokens, node access, and unencrypted backups'
  - code: 4.6.3
    en: 'Describe protections for sensitive data: encryption at rest and in transit, least privilege, external secret stores, and keeping secrets out of images and logs'
- group:
    en: 'Privilege Escalation'
  objectives:
  - code: 4.7.1
    en: 'Describe privilege escalation through RBAC: creating Pods that use a more privileged ServiceAccount, the escalate, bind and impersonate verbs, and editing RBAC objects'
  - code: 4.7.2
    en: 'Describe privilege escalation from a container to its node: privileged mode, allowPrivilegeEscalation, setuid binaries, and host namespaces'
  - code: 4.7.3
    en: 'Describe controls that block escalation: the Restricted Pod Security Standard, RBAC least privilege, the NodeRestriction admission plugin, and user namespaces'
platform:
- group:
    en: 'Supply Chain Security'
  objectives:
  - code: 5.1.1
    en: 'Describe the stages of the software supply chain (source, build, artifacts, deployment) and the threats to each stage'
  - code: 5.1.2
    en: 'Describe artifact signing and verification with Sigstore (cosign, Fulcio, Rekor) and provenance attestations (in-toto)'
  - code: 5.1.3
    en: 'Describe software bills of materials (SBOM) in the SPDX and CycloneDX formats and how they are used'
  - code: 5.1.4
    en: 'Describe securing CI/CD pipelines: isolated and ephemeral build environments, protected pipeline credentials, and GitOps deployment'
- group:
    en: 'Image Repository'
  objectives:
  - code: 5.2.1
    en: 'Describe securing a container registry: authentication, authorization, private network access, and imagePullSecrets'
  - code: 5.2.2
    en: 'Describe registry controls: scanning on push, immutable tags, image promotion between registries, and mirrors of public images'
  - code: 5.2.3
    en: 'Describe imagePullPolicy values and why pulling by digest and verifying signatures protects against tampered images'
- group:
    en: 'Observability'
  objectives:
  - code: 5.3.1
    en: 'Describe the security use of logs, metrics and traces, and tools such as Prometheus, OpenTelemetry and Fluentd or Fluent Bit'
  - code: 5.3.2
    en: 'Describe runtime threat detection with Falco rules on system call and Kubernetes audit events, and other eBPF-based tools'
  - code: 5.3.3
    en: 'Describe correlating audit logs, runtime events and alerts for incident response, and protecting the integrity of collected logs'
- group:
    en: 'Service Mesh'
  objectives:
  - code: 5.4.1
    en: 'Describe the security functions of a service mesh: mutual TLS, workload identity, and service-to-service authorization policies'
  - code: 5.4.2
    en: 'Describe service mesh data plane models (sidecar proxies and sidecarless or node-level proxies) in projects such as Istio, Linkerd and Cilium'
  - code: 5.4.3
    en: 'Describe workload identity with SPIFFE and SPIRE'
- group:
    en: 'PKI'
  objectives:
  - code: 5.5.1
    en: 'Describe the Kubernetes PKI: the cluster CA, and the certificates of the API server, kubelets, etcd and the front proxy'
  - code: 5.5.2
    en: 'Describe the CertificateSigningRequest API, signers, and certificate expiry and rotation'
  - code: 5.5.3
    en: 'Describe certificate management for workloads and ingress with cert-manager'
- group:
    en: 'Connectivity'
  objectives:
  - code: 5.6.1
    en: 'Describe securing inbound traffic: TLS termination on Ingress or Gateway API resources and exposing only the required Services'
  - code: 5.6.2
    en: 'Describe controlling outbound traffic: egress NetworkPolicies and egress gateways'
  - code: 5.6.3
    en: 'Describe encryption in transit across the platform (control plane TLS, mesh mTLS, encrypted CNI) and secure administrative access to the cluster (private endpoints, VPN, bastion hosts)'
- group:
    en: 'Admission Control'
  objectives:
  - code: 5.7.1
    en: 'Describe admission controllers: the mutating and validating phases and the built-in admission plugins'
  - code: 5.7.2
    en: 'Describe dynamic admission control with mutating and validating admission webhooks, and ValidatingAdmissionPolicy written in CEL'
  - code: 5.7.3
    en: 'Describe policy engines (OPA Gatekeeper, Kyverno) that enforce policies as code, such as allowed registries, required labels and securityContext rules'
  - code: 5.7.4
    en: 'Describe the availability and security risks of admission webhooks: failurePolicy Fail versus Ignore, timeouts, and protecting the webhook service'
compliance:
- group:
    en: 'Compliance Frameworks'
  objectives:
  - code: 6.1.1
    en: 'Describe the purpose of compliance frameworks and regulations for cloud native environments (PCI DSS, HIPAA, GDPR, SOC 2, ISO/IEC 27001)'
  - code: 6.1.2
    en: 'Describe the CIS Kubernetes Benchmark and NIST SP 800-190, the Application Container Security Guide'
  - code: 6.1.3
    en: 'Describe continuous compliance: mapping controls to requirements and collecting evidence from audit logs and policy reports'
- group:
    en: 'Threat Modeling Frameworks'
  objectives:
  - code: 6.2.1
    en: 'Describe the STRIDE threat categories and apply them to Kubernetes components'
  - code: 6.2.2
    en: 'Describe the MITRE ATT&CK framework for containers: tactics and techniques'
  - code: 6.2.3
    en: 'Use the results of threat modeling to prioritize security controls'
- group:
    en: 'Supply Chain Compliance'
  objectives:
  - code: 6.3.1
    en: 'Describe the SLSA framework: build levels and provenance'
  - code: 6.3.2
    en: 'Describe SBOM and attestation requirements and their verification at deployment time'
  - code: 6.3.3
    en: 'Describe the CNCF supply chain security guidance (Software Supply Chain Best Practices)'
- group:
    en: 'Automation and Tooling'
  objectives:
  - code: 6.4.1
    en: 'Describe automated benchmark assessment with kube-bench'
  - code: 6.4.2
    en: 'Describe image and configuration scanners and policy checks in CI/CD pipelines (for example Trivy, Kubescape)'
  - code: 6.4.3
    en: 'Describe continuous enforcement and reporting with policy engines (Kyverno, OPA Gatekeeper) and runtime detection with Falco'
