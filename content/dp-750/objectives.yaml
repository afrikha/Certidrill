# DP-750 objectives — official study guide, skills measured as of 2026-03-11 (en-us and fr-fr pages, checked on 2026-11-16).
# `code` is the stable key referenced by question files and course sections.
# French is the wording of the fr-fr study guide (partly machine-translated by Microsoft), with straight apostrophes.
environment:
- group:
    en: Select and configure compute in a workspace
    fr: Sélectionner et configurer le calcul dans un espace de travail
  objectives:
  - code: 1.1.1
    en: Choose an appropriate compute type, including job compute, serverless, warehouse, classic compute, and shared compute
    fr: Choisir un type de calcul approprié, notamment le calcul de jobs, le calcul serverless, l'entrepôt de données, le calcul classique et le calcul partagé
  - code: 1.1.2
    en: Configure compute performance settings, including CPU, node count, autoscaling, termination, node type, cluster size, and pooling
    fr: Configurer les paramètres de performances de calcul, notamment le processeur, le nombre de nœuds, la mise à l'échelle automatique, l'arrêt, le type de nœud, la taille du cluster et le regroupement
  - code: 1.1.3
    en: Configure compute feature settings, including Photon acceleration, Azure Databricks runtime/Spark version, and machine learning
    fr: Configurer les paramètres des fonctionnalités de calcul, notamment l'accélération Photon, le runtime Azure Databricks/Spark et le Machine Learning
  - code: 1.1.4
    en: Install libraries for a compute resource
    fr: Installer des bibliothèques pour une ressource de calcul
  - code: 1.1.5
    en: Configure access permissions to a compute resource
    fr: Configurer les autorisations d'accès à une ressource de calcul
- group:
    en: Create and organize objects in Unity Catalog
    fr: Créer et organiser des objets dans le catalogue Unity
  objectives:
  - code: 1.2.1
    en: Apply naming conventions based on requirements, including isolation, development environment, and external sharing
    fr: Appliquer des conventions d'affectation de noms en fonction des exigences, notamment l'isolation, l'environnement de développement et le partage externe
  - code: 1.2.2
    en: Create a catalog based on requirements
    fr: Créer un catalogue en fonction des exigences
  - code: 1.2.3
    en: Create a schema based on requirements
    fr: Créer un schéma en fonction des exigences
  - code: 1.2.4
    en: Create volumes based on requirements
    fr: Créer des volumes en fonction des exigences
  - code: 1.2.5
    en: Create tables, views, and materialized views
    fr: Créer des tables, des vues et des vues matérialisées
  - code: 1.2.6
    en: Implement a foreign catalog by configuring connections
    fr: Implémenter un catalogue étranger en configurant des connexions
  - code: 1.2.7
    en: Implement data definition language (DDL) operations on managed and external tables
    fr: Implémenter des opérations de langage de définition de données (DDL) sur des tables managées et externes
  - code: 1.2.8
    en: Configure AI/BI Genie instructions for data discovery
    fr: Configurer les instructions AI/BI Genie pour la découverte de données
governance:
- group:
    en: Secure Unity Catalog objects
    fr: Sécuriser les objets catalogue Unity
  objectives:
  - code: 2.1.1
    en: Grant privileges to a principal (user, service principal, or group) for securable objects in Unity Catalog
    fr: Accorder des privilèges à un principal (utilisateur, principal de service ou groupe) pour les objets sécurisables dans le catalogue Unity
  - code: 2.1.2
    en: Implement table- and column-level access control and row-level security
    fr: Implémenter le contrôle d'accès au niveau des tables et des colonnes et la sécurité au niveau des lignes
  - code: 2.1.3
    en: Access Azure Key Vault secrets from within Azure Databricks
    fr: Accéder aux secrets Azure Key Vault à partir d'Azure Databricks
  - code: 2.1.4
    en: Authenticate data access by using service principals
    fr: Authentifier l'accès aux données à l'aide d'entités de service
  - code: 2.1.5
    en: Authenticate resource access by using managed identities
    fr: Authentifier l'accès aux ressources à l'aide d'identités managées
- group:
    en: Govern Unity Catalog objects
    fr: Gouverner les objets du catalogue Unity
  objectives:
  - code: 2.2.1
    en: Create, implement, and preserve table and column definitions and descriptions for data discovery
    fr: Créer, implémenter et conserver des définitions de table et de colonne et des descriptions pour la découverte de données
  - code: 2.2.2
    en: Configure attribute-based access control (ABAC) by using tags and policies
    fr: Configurer le contrôle d'accès en fonction des attributs (ABAC) à l'aide de balises et de stratégies
  - code: 2.2.3
    en: Configure row filters and column masks
    fr: Configurer des filtres de lignes et des masques de colonne
  - code: 2.2.4
    en: Apply data retention policies
    fr: Appliquer des stratégies de rétention des données
  - code: 2.2.5
    en: Set up and manage data lineage tracking by using Catalog Explorer, including owner, history, dependencies, and lineage
    fr: Configurer et gérer le suivi de la lignée des données à l'aide de l'Explorateur de Catalogue, y compris le propriétaire, l'historique, les dépendances et la lignée
  - code: 2.2.6
    en: Configure audit logging
    fr: Configurer la journalisation d'audit
  - code: 2.2.7
    en: Design and implement a secure strategy for Delta Sharing
    fr: Concevoir et implémenter une stratégie sécurisée pour le partage Delta
data:
- group:
    en: Design and implement data modeling in Unity Catalog
    fr: Concevoir et implémenter la modélisation des données dans le catalogue Unity
  objectives:
  - code: 3.1.1
    en: Design logic for data ingestion and data source configuration, including extraction type and file type
    fr: Logique de conception pour l'ingestion de données et la configuration de source de données, y compris le type d'extraction et le type de fichier
  - code: 3.1.2
    en: Choose an appropriate data ingestion tool, including Lakeflow Connect, notebooks, and Azure Data Factory
    fr: Choisir un outil d'ingestion de données approprié, notamment Lakeflow Connect, notebooks et Azure Data Factory
  - code: 3.1.3
    en: Choose a data loading method, including batch and streaming
    fr: Choisir une méthode de chargement de données, y compris le traitement par lots et la diffusion en continu
  - code: 3.1.4
    en: Choose a data table format, such as Parquet, Delta, CSV, JSON, or Iceberg
    fr: Choisir un format de table de données, tel que Parquet, Delta, CSV, JSON ou Iceberg
  - code: 3.1.5
    en: Design and implement a data partitioning scheme
    fr: Concevoir et implémenter un schéma de partitionnement de données
  - code: 3.1.6
    en: Choose a slowly changing dimension (SCD) type
    fr: Choisir un type de dimension à variation lente (SCD)
  - code: 3.1.7
    en: Choose granularity on a column or table based on requirements
    fr: Choisir une granularité sur une colonne ou une table en fonction des exigences
  - code: 3.1.8
    en: Design and implement a temporal (history) table to record changes over time
    fr: Concevoir et implémenter une table temporelle (historique) pour enregistrer les modifications au fil du temps
  - code: 3.1.9
    en: Design and implement a clustering strategy, including liquid clustering, Z-ordering, and deletion vectors
    fr: Concevoir et implémenter une stratégie de clustering, y compris le clustering liquide, l'ordre Z et les vecteurs de suppression
  - code: 3.1.10
    en: Choose between managed and unmanaged tables
    fr: Choisir entre les tables managées et non managées
- group:
    en: Ingest data into Unity Catalog
    fr: Ingérer des données dans le catalogue Unity
  objectives:
  - code: 3.2.1
    en: Ingest data by using Lakeflow Connect, including batch and streaming
    fr: Ingérer des données à l'aide de Lakeflow Connect, y compris le traitement par lots et la diffusion en continu
  - code: 3.2.2
    en: Ingest data by using notebooks, including batch and streaming
    fr: Ingérez des données à l'aide de notebooks, aussi bien en traitement par lots qu'en flux
  - code: 3.2.3
    en: Ingest data by using SQL methods, including CREATE TABLE … AS (CTAS), CREATE OR REPLACE TABLE, and COPY INTO
    fr: Ingérer des données à l'aide de méthodes SQL, notamment CREATE TABLE ... AS (CTAS), CREATE OR REPLACE TABLE et COPY INTO
  - code: 3.2.4
    en: Ingest data by using a change data capture (CDC) feed
    fr: Ingérer des données à l'aide d'un flux de capture des changements de données (flux CDC)
  - code: 3.2.5
    en: Ingest data by using Spark Structured Streaming
    fr: Ingérer des données à l'aide de Spark Structured Streaming
  - code: 3.2.6
    en: Ingest streaming data from Azure Event Hubs
    fr: Ingérer des données de streaming à partir d'Azure Event Hubs
  - code: 3.2.7
    en: Ingest data by using Lakeflow Spark Declarative Pipelines, including Auto Loader
    fr: Ingérez des données à l'aide des pipelines déclaratifs Lakeflow Spark, y compris Auto Loader
- group:
    en: Cleanse, transform, and load data into Unity Catalog
    fr: Nettoyer, transformer et charger des données dans le catalogue Unity
  objectives:
  - code: 3.3.1
    en: Profile data to generate summary statistics and assess data distributions
    fr: Profiler les données pour générer des statistiques récapitulatives et évaluer les distributions de données
  - code: 3.3.2
    en: Choose appropriate column data types
    fr: Choisir les types de données de colonne appropriés
  - code: 3.3.3
    en: Identify and resolve duplicate, missing, and null values
    fr: Identifier et résoudre les valeurs dupliquées, manquantes et null
  - code: 3.3.4
    en: Transform data, including filtering, grouping, and aggregating data
    fr: Transformer des données, notamment le filtrage, le regroupement et l'agrégation des données
  - code: 3.3.5
    en: Transform data by using join, union, intersect, and except operators
    fr: Transformez les données au moyen des opérateurs join, union, intersect et except
  - code: 3.3.6
    en: Transform data by denormalizing, pivoting, and unpivoting data
    fr: Transformer des données en dénormalisant, en pivotant et en dépivotant les données
  - code: 3.3.7
    en: Load data by using merge, insert, and append operations
    fr: Charger des données à l'aide des opérations de fusion, d'insertion et d'ajout
- group:
    en: Implement and manage data quality constraints in Unity Catalog
    fr: Implémenter et gérer des contraintes de qualité des données dans le catalogue Unity
  objectives:
  - code: 3.4.1
    en: Implement validation checks, including nullability, data cardinality, and range checking
    fr: Implémenter des vérifications de validation, notamment la nullabilité, la cardinalité des données et la vérification de plage
  - code: 3.4.2
    en: Implement data type checks
    fr: Implémenter des vérifications de type de données
  - code: 3.4.3
    en: Implement schema enforcement and manage schema drift
    fr: Implémenter le respect du schéma et gérer la dérive de schéma
  - code: 3.4.4
    en: Manage data quality with pipeline expectations in Lakeflow Spark Declarative Pipelines
    fr: Assurez la qualité des données grâce aux attentes de pipeline dans les pipelines déclaratifs Lakeflow Spark
pipelines:
- group:
    en: Design and implement data pipelines
    fr: Concevoir et implémenter des pipelines de données
  objectives:
  - code: 4.1.1
    en: Design order of operations for a data pipeline
    fr: Ordre de conception des opérations pour un pipeline de données
  - code: 4.1.2
    en: Choose between notebook and Lakeflow Spark Declarative Pipelines
    fr: Sélectionnez entre les notebooks et les pipelines déclaratifs Lakeflow Spark
  - code: 4.1.3
    en: Design task logic for Lakeflow Jobs
    fr: Conception de la logique de tâche pour les jobs Lakeflow
  - code: 4.1.4
    en: Design and implement error handling in data pipelines, notebooks, and jobs
    fr: Concevez et mettez en œuvre la gestion des erreurs dans les pipelines de données, les notebooks et les tâches
  - code: 4.1.5
    en: Create a data pipeline by using a notebook, including precedence constraints
    fr: Créez un pipeline de données à l'aide d'un notebook, y compris la gestion des contraintes de priorité
  - code: 4.1.6
    en: Create a data pipeline by using Lakeflow Spark Declarative Pipelines
    fr: Créez un pipeline de données au moyen des pipelines déclaratifs Lakeflow Spark
- group:
    en: Implement Lakeflow Jobs
    fr: Mettre en œuvre les tâches Lakeflow
  objectives:
  - code: 4.2.1
    en: Create a job, including setup and configuration
    fr: Créer une tâche, y compris le paramétrage et la configuration
  - code: 4.2.2
    en: Configure job triggers
    fr: Configurer des déclencheurs de travail
  - code: 4.2.3
    en: Schedule a job
    fr: Planifier un travail
  - code: 4.2.4
    en: Configure alerts for a job
    fr: Configurer des alertes pour un travail
  - code: 4.2.5
    en: Configure automatic restarts for a job or a data pipeline
    fr: Configurer des redémarrages automatiques pour un travail ou un pipeline de données
- group:
    en: Implement development lifecycle processes in Azure Databricks
    fr: Implémenter des processus de cycle de vie de développement dans Azure Databricks
  objectives:
  - code: 4.3.1
    en: Apply version control best practices using Git
    fr: Appliquer les meilleures pratiques de contrôle de version à l'aide de Git
  - code: 4.3.2
    en: Manage branching, pull requests, and conflict resolution
    fr: Gestion des branches, des pull requests et de la résolution des conflits
  - code: 4.3.3
    en: Implement a testing strategy, including unit tests, integration tests, end-to-end tests, and user acceptance testing (UAT)
    fr: Implémenter une stratégie de test, notamment des tests unitaires, des tests d'intégration, des tests de bout en bout et des tests d'acceptation utilisateur (UAT)
  - code: 4.3.4
    en: Configure and package Databricks Asset Bundles
    fr: Configurer et empaqueter des bundles de ressources Databricks
  - code: 4.3.5
    en: Deploy a bundle by using the Azure Databricks command-line interface (CLI)
    fr: Déployer un bundle à l'aide de l'interface de ligne de commande Azure Databricks (CLI)
  - code: 4.3.6
    en: Deploy a bundle by using REST APIs
    fr: Déployer un bundle à l'aide d'API REST
- group:
    en: Monitor, troubleshoot, and optimize workloads in Azure Databricks
    fr: Surveiller, dépanner et optimiser les charges de travail dans Azure Databricks
  objectives:
  - code: 4.4.1
    en: Monitor and manage cluster consumption to optimize performance and cost
    fr: Surveiller et gérer la consommation de cluster pour optimiser les performances et les coûts
  - code: 4.4.2
    en: Troubleshoot and repair issues in Lakeflow Jobs, including repair, restart, stop, and run functions
    fr: Résoudre et réparer les problèmes dans les tâches Lakeflow, notamment la réparation, le redémarrage, l'arrêt et l'exécution des tâches
  - code: 4.4.3
    en: Troubleshoot and repair issues in Apache Spark jobs and notebooks, including performance tuning, resolving resource bottlenecks, and cluster restart
    fr: Diagnostiquez et résolvez les problèmes dans les tâches et les notebooks Apache Spark, notamment l'optimisation des performances, l'élimination des goulets d'étranglement liés aux ressources et le redémarrage du cluster
  - code: 4.4.4
    en: Investigate and resolve caching, skewing, spilling, and shuffle issues by using a Directed Acyclic Graph (DAG), the Spark UI, and query profile
    fr: Examiner et résoudre les problèmes de mise en cache, de déséquilibrage, de déversement et de shuffle à l'aide d'un graphe acyclique dirigé (DAG), de l'interface utilisateur Spark et du profil de requête
  - code: 4.4.5
    en: Optimize Delta tables for performance and cost, including OPTIMIZE and VACUUM commands
    fr: Optimiser les tables Delta pour les performances et les coûts, y compris les commandes OPTIMIZE et VACUUM
  - code: 4.4.6
    en: Implement log streaming by using Log Analytics in Azure Monitor
    fr: Mettez en œuvre le streaming des journaux à l'aide de l'analytique des journaux d'activité dans Azure Monitor
  - code: 4.4.7
    en: Configure alerts by using Azure Monitor
    fr: Configurer des alertes à l'aide d'Azure Monitor
