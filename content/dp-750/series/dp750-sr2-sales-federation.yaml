id: dp750-sr2-sales-federation
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso has an Azure Databricks workspace named **ws-contoso** that is enabled for Unity Catalog. Contoso also has an Azure SQL Database named **salesdb** that contains the `dbo.orders` and `dbo.customers` tables. The Azure Databricks compute can reach salesdb over the network. A secret scope named **sales-secrets** contains the keys `sql-user` and `sql-password` for a SQL login that can read salesdb.

    Members of a group named **sales-analysts** use a serverless SQL warehouse named **wh-sales**. They must query the current rows of the salesdb tables from wh-sales. The data must not be copied into Azure Databricks storage, and access must be controlled by Unity Catalog privileges.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso dispose d'un espace de travail Azure Databricks nommé **ws-contoso** activé pour Unity Catalog. Contoso dispose aussi d'une base de données Azure SQL Database nommée **salesdb** qui contient les tables `dbo.orders` et `dbo.customers`. Le calcul Azure Databricks peut joindre salesdb par le réseau. Une étendue de secrets nommée **sales-secrets** contient les clés `sql-user` et `sql-password` d'un compte de connexion SQL autorisé à lire salesdb.

    Les membres d'un groupe nommé **sales-analysts** utilisent un entrepôt SQL serverless nommé **wh-sales**. Ils doivent interroger les lignes actuelles des tables de salesdb depuis wh-sales. Les données ne doivent pas être copiées dans le stockage Azure Databricks, et l'accès doit être contrôlé par des privilèges Unity Catalog.
