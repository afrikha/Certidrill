id: dp750-sr1-failed-transform
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has a Lakeflow Jobs job named **daily-sales** that runs every night on job compute. The job contains the following tasks:

    - **ingest_orders** and **ingest_customers**, which each take about two hours.
    - **transform**, which depends on both ingestion tasks and overwrites the table woodgrove.silver.sales.
    - **load_gold**, which depends on transform, and **refresh_reports**, which depends on load_gold.

    Last night, both ingestion tasks succeeded, transform failed because of a bug in its notebook, and the downstream tasks did not run. You fixed the bug in the workspace notebook that the transform task references.

    You need to complete last night's run. The solution must meet the following requirements:

    - The ingestion tasks must not run again.
    - transform, load_gold and refresh_reports must run in order with the fixed notebook.
    - The run of daily-sales in the job run history must end successfully, because the operations team monitors it.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un travail Lakeflow Jobs nommé **daily-sales** qui s'exécute chaque nuit sur un calcul de travaux (job compute). Le travail contient les tâches suivantes :

    - **ingest_orders** et **ingest_customers**, qui durent chacune environ deux heures.
    - **transform**, qui dépend des deux tâches d'ingestion et remplace le contenu de la table woodgrove.silver.sales.
    - **load_gold**, qui dépend de transform, et **refresh_reports**, qui dépend de load_gold.

    La nuit dernière, les deux tâches d'ingestion ont réussi, transform a échoué à cause d'un bogue dans son notebook, et les tâches en aval ne se sont pas exécutées. Vous avez corrigé le bogue dans le notebook de l'espace de travail que référence la tâche transform.

    Vous devez terminer l'exécution de la nuit dernière. La solution doit répondre aux exigences suivantes :

    - Les tâches d'ingestion ne doivent pas s'exécuter à nouveau.
    - transform, load_gold et refresh_reports doivent s'exécuter dans l'ordre avec le notebook corrigé.
    - L'exécution de daily-sales dans l'historique des exécutions du travail doit se terminer avec succès, car l'équipe d'exploitation la surveille.
