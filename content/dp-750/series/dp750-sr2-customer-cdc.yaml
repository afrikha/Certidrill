id: dp750-sr2-customer-cdc
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders captures the changes of its customer database in a Delta table named `nw_prod.bronze.customers_cdc`. Each row contains `customer_id`, `name`, `city`, `operation` and `event_ts`. The `operation` column contains `INSERT`, `UPDATE` or `DELETE`, and `event_ts` is the time of the change in the source database. Changes can arrive out of order.

    You develop a serverless Lakeflow Spark Declarative Pipeline whose default schema is `nw_prod.silver`. You need to create a table named `customers` that contains exactly one row for each customer that still exists, with its latest values. Deleted customers must not appear, and the table must not contain the `operation` and `event_ts` columns.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders capture les modifications de sa base de données clients dans une table Delta nommée `nw_prod.bronze.customers_cdc`. Chaque ligne contient `customer_id`, `name`, `city`, `operation` et `event_ts`. La colonne `operation` contient `INSERT`, `UPDATE` ou `DELETE`, et `event_ts` est l'heure de la modification dans la base de données source. Les modifications peuvent arriver dans le désordre.

    Vous développez un pipeline déclaratif Lakeflow Spark serverless dont le schéma par défaut est `nw_prod.silver`. Vous devez créer une table nommée `customers` qui contient exactement une ligne pour chaque client qui existe encore, avec ses dernières valeurs. Les clients supprimés ne doivent pas apparaître, et la table ne doit pas contenir les colonnes `operation` et `event_ts`.
