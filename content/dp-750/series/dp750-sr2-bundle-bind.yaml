id: dp750-sr2-bundle-bind
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum has a Declarative Automation Bundles project (formerly Databricks Asset Bundles) in a Git repository. The `databricks.yml` file defines two targets named `dev` and `prod`, and each target points to a different Azure Databricks workspace. The bundle does not define any job yet.

    In the production workspace, a job named **nightly_sales** was created manually in the UI. Its job ID is `731994`, and it has two years of run history.

    You need to manage nightly_sales from the bundle by using the Databricks CLI. After the next deployment to the `prod` target, the production workspace must contain a single nightly_sales job, and its run history must be kept.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum dispose d'un projet Declarative Automation Bundles (anciennement Databricks Asset Bundles) dans un dépôt Git. Le fichier `databricks.yml` définit deux cibles nommées `dev` et `prod`, et chaque cible pointe vers un espace de travail Azure Databricks différent. Le bundle ne définit encore aucun job.

    Dans l'espace de travail de production, un job nommé **nightly_sales** a été créé manuellement dans l'interface utilisateur. Son ID de job est `731994` et il possède deux ans d'historique d'exécutions.

    Vous devez gérer nightly_sales à partir du bundle à l'aide de l'interface CLI Databricks. Après le prochain déploiement sur la cible `prod`, l'espace de travail de production doit contenir un seul job nightly_sales, et son historique d'exécutions doit être conservé.
