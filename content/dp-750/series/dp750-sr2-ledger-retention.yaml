id: dp750-sr2-ledger-retention
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has a Unity Catalog managed Delta table named `fab_prod.finance.ledger`. Predictive optimization is enabled for the account, and the table inherits the setting. The table uses the default retention table properties. All the workloads that read or write the table run on Databricks Runtime 18.0 or later.

    Auditors must be able to query any version of the ledger table from the last 60 days by using time travel, for example with `VERSION AS OF`. Data files that are no longer needed for those 60 days must still be removed automatically to limit storage costs. You need to configure the table.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'une table Delta managée Unity Catalog nommée `fab_prod.finance.ledger`. L'optimisation prédictive est activée pour le compte et la table hérite de ce paramètre. La table utilise les valeurs par défaut des propriétés de table de rétention. Toutes les charges de travail qui lisent ou écrivent la table s'exécutent sur Databricks Runtime 18.0 ou version ultérieure.

    Les auditeurs doivent pouvoir interroger n'importe quelle version de la table ledger des 60 derniers jours à l'aide du voyage dans le temps, par exemple avec `VERSION AS OF`. Les fichiers de données qui ne sont plus nécessaires pour ces 60 jours doivent toujours être supprimés automatiquement afin de limiter les coûts de stockage. Vous devez configurer la table.
