id: dp750-sr2-bookings-drift
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a daily Lakeflow Jobs task that runs a Python notebook. The notebook reads partner files into a DataFrame named `df` and appends it to the Delta table `tailspin_prod.silver.bookings` by using the following code.

    ```python
    df.write.mode("append").saveAsTable("tailspin_prod.silver.bookings")
    ```

    Later in the same Spark session, the notebook appends data to two other tables whose schemas must never change automatically. Yesterday, the partner added a column named `loyalty_tier` to its files, and the write to bookings failed with a schema mismatch error.

    You need to ensure that the write to bookings adds new source columns to the table automatically, now and for future partner changes. The existing rows of bookings must be kept.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'une tâche Lakeflow Jobs quotidienne qui exécute un notebook Python. Le notebook lit des fichiers d'un partenaire dans un DataFrame nommé `df` et l'ajoute à la table Delta `tailspin_prod.silver.bookings` à l'aide du code suivant.

    ```python
    df.write.mode("append").saveAsTable("tailspin_prod.silver.bookings")
    ```

    Plus loin dans la même session Spark, le notebook ajoute des données à deux autres tables dont les schémas ne doivent jamais changer automatiquement. Hier, le partenaire a ajouté une colonne nommée `loyalty_tier` à ses fichiers, et l'écriture dans bookings a échoué avec une erreur d'incompatibilité de schéma.

    Vous devez faire en sorte que l'écriture dans bookings ajoute automatiquement les nouvelles colonnes sources à la table, maintenant et lors des futures modifications du partenaire. Les lignes existantes de bookings doivent être conservées.
