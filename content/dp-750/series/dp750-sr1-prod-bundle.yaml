id: dp750-sr1-prod-bundle
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has a Declarative Automation Bundles project (formerly Databricks Asset Bundles) in a Git repository. The project defines a job with the resource key **daily_sales** that has a nightly schedule. The `databricks.yml` file contains the following targets:

    ```yaml
    targets:
      dev:
        mode: development
        default: true
        workspace:
          host: https://adb-1111111111111111.11.azuredatabricks.net
      prod:
        mode: production
        workspace:
          host: https://adb-2222222222222222.12.azuredatabricks.net
        run_as:
          service_principal_name: 7c1d2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f
    ```

    The bundle has never been deployed to the production workspace. A CI pipeline runs on the main branch and authenticates the Databricks CLI to both workspaces by using a service principal.

    You need to add a step to the pipeline that creates the daily_sales job in the production workspace with its schedule active and its name without a development prefix.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'un projet Declarative Automation Bundles (anciennement Databricks Asset Bundles) dans un dépôt Git. Le projet définit un travail avec la clé de ressource **daily_sales**, qui possède une planification nocturne. Le fichier `databricks.yml` contient les cibles suivantes :

    ```yaml
    targets:
      dev:
        mode: development
        default: true
        workspace:
          host: https://adb-1111111111111111.11.azuredatabricks.net
      prod:
        mode: production
        workspace:
          host: https://adb-2222222222222222.12.azuredatabricks.net
        run_as:
          service_principal_name: 7c1d2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f
    ```

    Le bundle n'a jamais été déployé dans l'espace de travail de production. Un pipeline CI s'exécute sur la branche main et authentifie l'interface CLI Databricks auprès des deux espaces de travail à l'aide d'un principal de service.

    Vous devez ajouter au pipeline une étape qui crée le travail daily_sales dans l'espace de travail de production, avec sa planification active et son nom sans préfixe de développement.
