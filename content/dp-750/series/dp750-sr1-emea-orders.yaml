id: dp750-sr1-emea-orders
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a Unity Catalog managed table named **tailspin.sales.orders** that contains a `region` column of type STRING. Users query the table from a SQL warehouse, and existing dashboards and notebooks reference the table by its name.

    Only two account groups have the SELECT privilege on tailspin.sales.orders:

    - **emea-analysts** must see only the rows where `region` is `'EMEA'`.
    - **sales-leads** must see all the rows.

    Both groups must keep querying tailspin.sales.orders directly, and every column, including `region`, must keep showing its original values.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'une table managée Unity Catalog nommée **tailspin.sales.orders** qui contient une colonne `region` de type STRING. Les utilisateurs interrogent la table à partir d'un entrepôt SQL, et des tableaux de bord et des notebooks existants référencent la table par son nom.

    Seuls deux groupes de compte disposent du privilège SELECT sur tailspin.sales.orders :

    - **emea-analysts** doit voir uniquement les lignes dont `region` vaut `'EMEA'`.
    - **sales-leads** doit voir toutes les lignes.

    Les deux groupes doivent continuer à interroger directement tailspin.sales.orders, et chaque colonne, y compris `region`, doit continuer à afficher ses valeurs d'origine.
