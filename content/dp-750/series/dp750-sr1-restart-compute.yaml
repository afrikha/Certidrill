id: dp750-sr1-restart-compute
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso has an Azure Databricks workspace that contains an all-purpose compute resource named **etl-shared**. etl-shared terminates automatically after 30 minutes of inactivity. Currently, only the workspace admins have permissions on etl-shared.

    A group named **data-engineers** must be able to perform the following actions on etl-shared:

    - Attach notebooks to etl-shared and run them.
    - Start etl-shared when it is terminated, and restart it when it stops responding.

    Members of data-engineers must not be able to change the node type, the autoscaling settings or the libraries of etl-shared. The solution must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso dispose d'un espace de travail Azure Databricks qui contient une ressource de calcul polyvalent (all-purpose) nommée **etl-shared**. etl-shared s'arrête automatiquement après 30 minutes d'inactivité. Actuellement, seuls les administrateurs de l'espace de travail disposent d'autorisations sur etl-shared.

    Un groupe nommé **data-engineers** doit pouvoir effectuer les actions suivantes sur etl-shared :

    - Attacher des notebooks à etl-shared et les exécuter.
    - Démarrer etl-shared lorsqu'il est arrêté, et le redémarrer lorsqu'il ne répond plus.

    Les membres de data-engineers ne doivent pas pouvoir modifier le type de nœud, les paramètres de mise à l'échelle automatique ni les bibliothèques d'etl-shared. La solution doit respecter le principe du moindre privilège.
