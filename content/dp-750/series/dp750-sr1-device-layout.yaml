id: dp750-sr1-device-layout
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam stores IoT telemetry in the Delta table **fabrikam.staging.device_events**, which has the columns `device_id`, `site_id`, `event_ts` and `payload`. You plan to create the Unity Catalog managed table **fabrikam.silver.device_events** from this table by using a notebook attached to compute that runs Databricks Runtime 16.4 LTS.

    Most queries filter on `device_id`, which has about two million distinct values, and on a range of `event_ts`. A few hundred devices produce most of the events. Next year, queries will also filter on `site_id`.

    You need to define the data layout of fabrikam.silver.device_events. The solution must meet the following requirements:

    - Improve data skipping for the current filters.
    - Allow the layout keys to be changed next year without rewriting the existing data.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam stocke des données de télémétrie IoT dans la table Delta **fabrikam.staging.device_events**, qui comporte les colonnes `device_id`, `site_id`, `event_ts` et `payload`. Vous prévoyez de créer la table managée Unity Catalog **fabrikam.silver.device_events** à partir de cette table à l'aide d'un notebook attaché à un calcul qui exécute Databricks Runtime 16.4 LTS.

    La plupart des requêtes filtrent sur `device_id`, qui compte environ deux millions de valeurs distinctes, et sur une plage de `event_ts`. Quelques centaines d'appareils produisent la plupart des événements. L'année prochaine, les requêtes filtreront aussi sur `site_id`.

    Vous devez définir la disposition des données de fabrikam.silver.device_events. La solution doit répondre aux exigences suivantes :

    - Améliorer le saut de données (data skipping) pour les filtres actuels.
    - Permettre de modifier les clés de disposition l'année prochaine sans réécrire les données existantes.
