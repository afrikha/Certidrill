id: dp750-sr1-nightly-orders
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders receives several CSV files with a header row every day in the Unity Catalog volume path **/Volumes/northwind/landing/raw/orders/**. A cleanup process deletes each file from the volume 14 days after its arrival.

    The Delta table **northwind.bronze.orders** already exists and has the same columns as the files. A data engineer schedules a SQL statement to run every night on a SQL warehouse to load the files into northwind.bronze.orders. The solution must meet the following requirements:

    - The rows of each file must be loaded into the table exactly once, even if the nightly statement is run again after a failure.
    - The table must keep all the rows loaded since its creation, including the rows of files that were deleted from the volume.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders reçoit chaque jour plusieurs fichiers CSV avec une ligne d'en-tête dans le chemin du volume Unity Catalog **/Volumes/northwind/landing/raw/orders/**. Un processus de nettoyage supprime chaque fichier du volume 14 jours après son arrivée.

    La table Delta **northwind.bronze.orders** existe déjà et possède les mêmes colonnes que les fichiers. Un ingénieur données planifie une instruction SQL qui s'exécute chaque nuit sur un entrepôt SQL pour charger les fichiers dans northwind.bronze.orders. La solution doit répondre aux exigences suivantes :

    - Les lignes de chaque fichier doivent être chargées dans la table exactement une fois, même si l'instruction nocturne est réexécutée après un échec.
    - La table doit conserver toutes les lignes chargées depuis sa création, y compris celles des fichiers supprimés du volume.
