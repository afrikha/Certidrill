# DP-750 — Implementing Data Engineering Solutions Using Azure Databricks (Microsoft Certified: Azure Databricks Data Engineer Associate)
# Source: official study guide, "Skills measured as of March 11, 2026" (en-us and fr-fr pages checked on 2026-11-16).
# Real exam: 120 minutes (certification page on Microsoft Learn), passing score 700/1000; the page only says
# the exam "may have interactive components": case studies and labs are not announced, and Microsoft does not
# publish the number of questions. One case study and one Yes/No series per simulated exam is the factory
# convention for associate exams. typeMix: more `dropdown` than AZ-104 (SQL/Python code completion).
# Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
