id: dp750-4c-rest-api-behavior
objective: "4.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind is writing a deployment tool that calls the Azure Databricks Jobs API 2.2 directly to read and start the jobs deployed by a Databricks Asset Bundle. Some jobs have more than 100 tasks. The tool authenticates with OAuth access tokens issued to a service principal by the workspace token endpoint.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind écrit un outil de déploiement qui appelle directement l'API Jobs 2.2 d'Azure Databricks pour lire et démarrer les jobs déployés par un bundle de ressources Databricks. Certains jobs ont plus de 100 tâches. L'outil s'authentifie avec des jetons d'accès OAuth émis pour un principal de service par le point de terminaison de jetons de l'espace de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When a jobs/get response contains a next_page_token, the tool must request the next page to receive the remaining tasks of the job."
        fr: "Quand une réponse jobs/get contient un next_page_token, l'outil doit demander la page suivante pour recevoir les tâches restantes du job."
    - id: s2
      text:
        en: "An access token obtained by the tool remains valid for 24 hours."
        fr: "Un jeton d'accès obtenu par l'outil reste valide 24 heures."
    - id: s3
      text:
        en: "A jobs/list request without extra parameters returns the tasks and job clusters of each job."
        fr: "Une requête jobs/list sans paramètre supplémentaire renvoie les tâches et les clusters de job de chaque job."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "In Jobs API 2.2, array fields such as `tasks` and `job_clusters` return at most 100 elements per response, and `next_page_token` signals more pages, passed back as `page_token`. A service principal's OAuth access token is valid for one hour (`expires_in` 3600), after which the tool requests a new one. List requests omit `tasks` and `job_clusters` unless you add `expand_tasks=true`."
    fr: "Dans l'API Jobs 2.2, les champs de tableau comme `tasks` et `job_clusters` renvoient au plus 100 éléments par réponse, et `next_page_token` signale d'autres pages, à repasser dans `page_token`. Un jeton d'accès OAuth d'un principal de service est valide une heure (`expires_in` 3600) ; l'outil en demande ensuite un nouveau. Les requêtes de liste omettent `tasks` et `job_clusters`, sauf si vous ajoutez `expand_tasks=true`."
references:
  - title: Updating from Jobs API 2.1 to 2.2
    url: https://learn.microsoft.com/en-us/azure/databricks/reference/jobs-api-2-2-updates
  - title: Authorize service principal access to Azure Databricks with OAuth
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/auth/oauth-m2m
