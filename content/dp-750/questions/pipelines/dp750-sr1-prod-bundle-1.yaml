id: dp750-sr1-prod-bundle-1
objective: "4.3.5"
type: series_yesno
series: dp750-sr1-prod-bundle
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You add a step that deploys the bundle to the prod target.
  fr: Vous ajoutez une étape qui déploie le bundle sur la cible prod.
body:
  solution:
    en: |
      The pipeline step runs the following command:

      ```bash
      databricks bundle deploy -t prod
      ```
    fr: |
      L'étape du pipeline exécute la commande suivante :

      ```bash
      databricks bundle deploy -t prod
      ```
answer: { value: true }
explanation:
  correct:
    en: "`databricks bundle deploy` deploys the bundle to the remote workspace of the target passed with `-t`. The prod target uses `mode: production`, which deploys the resources as configured: no development name prefix and no pausing of schedules."
    fr: "`databricks bundle deploy` déploie le bundle dans l'espace de travail distant de la cible transmise avec `-t`. La cible prod utilise `mode: production`, qui déploie les ressources telles qu'elles sont configurées : sans préfixe de nom de développement et sans suspension des planifications."
references:
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
  - title: Declarative Automation Bundles deployment modes
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
