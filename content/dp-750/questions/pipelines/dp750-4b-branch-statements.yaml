id: dp750-4b-branch-statements
objective: "4.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Your team uses Git folders connected to a GitHub repository and creates a branch for each feature. You are documenting how branches behave in Azure Databricks.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe utilise des dossiers Git connectés à un dépôt GitHub et crée une branche par fonctionnalité. Vous documentez le comportement des branches dans Azure Databricks.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "When you switch to a branch that doesn't contain a notebook, the notebook stays in the workspace.", fr: "Quand vous basculez sur une branche qui ne contient pas un notebook, ce notebook reste dans l'espace de travail." } }
    - { id: b, text: { en: "A local branch can remain in a Git folder for up to 30 days after its remote branch is deleted.", fr: "Une branche locale peut subsister dans un dossier Git jusqu'à 30 jours après la suppression de sa branche distante." } }
    - { id: c, text: { en: "When you switch back to a branch, its notebooks are recreated with their original IDs and URLs.", fr: "Quand vous revenez sur une branche, ses notebooks sont recréés avec leurs ID et leurs URL d'origine." } }
    - { id: d, text: { en: "Merged branches must be deleted in the Git provider.", fr: "Les branches fusionnées doivent être supprimées chez le fournisseur Git." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Branch deletions are handled in the Git provider. After the remote branch is deleted, the local branch can remain in the Git folder for up to 30 days unless you delete the repository.
    fr: |
      La suppression des branches se fait chez le fournisseur Git. Après la suppression de la branche distante, la branche locale peut subsister dans le dossier Git jusqu'à 30 jours, sauf si vous supprimez le dépôt.
  options:
    a: { en: "Assets that don't exist on the target branch are deleted from the workspace when you switch.", fr: "Les ressources absentes de la branche cible sont supprimées de l'espace de travail lors du changement de branche." }
    c: { en: "Switching back recreates the assets with new IDs and URLs, which can break bookmarks and shared links.", fr: "Revenir sur la branche recrée les ressources avec de nouveaux ID et de nouvelles URL, ce qui peut casser les favoris et les liens partagés." }
references:
  - title: Create and manage Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/git-operations-with-repos
  - title: Azure Databricks Git folder limits and reference
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/limits
