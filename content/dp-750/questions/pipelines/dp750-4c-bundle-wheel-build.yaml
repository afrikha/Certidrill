id: dp750-4c-bundle-wheel-build
objective: "4.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam packages its ETL code as a Python package named **fabrikam_etl** defined in a `pyproject.toml` file managed with Poetry at the root of a Databricks Asset Bundle. The package declares a console script named `main`.

    You need `databricks bundle deploy` to build the Python wheel file, upload it, and create a job task that runs the `main` entry point of the package.

    How should you complete the `databricks.yml` file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam empaquette son code ETL sous forme d'un package Python nommé **fabrikam_etl**, défini dans un fichier `pyproject.toml` géré avec Poetry à la racine d'un bundle de ressources Databricks. Le package déclare un script de console nommé `main`.

    Vous devez faire en sorte que `databricks bundle deploy` génère le fichier wheel Python, le charge et crée une tâche de job qui exécute le point d'entrée `main` du package.

    Comment devez-vous compléter le fichier `databricks.yml` ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    artifacts:
      default:
        type: [[type]]
        build: [[build]]
        path: .

    resources:
      jobs:
        etl_job:
          name: etl-job
          tasks:
            - task_key: main
              job_cluster_key: etl
              [[task]]:
                package_name: fabrikam_etl
                entry_point: main
              libraries:
                - whl: ./dist/*.whl
  slots:
    - id: type
      options:
        - { id: whl, text: whl }
        - { id: jar, text: jar }
        - { id: pypi, text: pypi }
    - id: build
      options:
        - { id: poetrybuild, text: poetry build }
        - { id: poetryinstall, text: poetry install }
        - { id: pipinstall, text: pip install . }
    - id: task
      options:
        - { id: wheeltask, text: python_wheel_task }
        - { id: pytask, text: spark_python_task }
        - { id: nbtask, text: notebook_task }
        - { id: pltask, text: pipeline_task }
answer:
  values: { type: whl, build: poetrybuild, task: wheeltask }
explanation:
  correct:
    en: "The `artifacts` mapping with `type: whl` tells the CLI to build a wheel during deployment by running the `build` command, here `poetry build`, which writes the file to `dist/`. The CLI uploads the wheel listed in `libraries`, and a `python_wheel_task` runs the package's entry point identified by `package_name` and `entry_point`."
    fr: "Le mappage `artifacts` avec `type: whl` indique à l'interface CLI de générer un wheel pendant le déploiement en exécutant la commande `build`, ici `poetry build`, qui écrit le fichier dans `dist/`. L'interface CLI charge le wheel indiqué dans `libraries`, et une tâche `python_wheel_task` exécute le point d'entrée du package identifié par `package_name` et `entry_point`."
  options:
    jar: { en: "jar builds a Java archive, not a Python wheel.", fr: "jar génère une archive Java, pas un wheel Python." }
    pypi: { en: "pypi is a library source for installing published packages, not an artifact type to build.", fr: "pypi est une source de bibliothèques pour installer des packages publiés, pas un type d'artefact à générer." }
    poetryinstall: { en: "poetry install installs dependencies locally; it doesn't produce the wheel in dist/.", fr: "poetry install installe les dépendances localement ; il ne produit pas le wheel dans dist/." }
    pipinstall: { en: "pip install installs the package locally instead of building a wheel file.", fr: "pip install installe le package localement au lieu de générer un fichier wheel." }
    pytask: { en: "spark_python_task runs a Python file, not the entry point of an installed package.", fr: "spark_python_task exécute un fichier Python, pas le point d'entrée d'un package installé." }
    nbtask: { en: "notebook_task runs a notebook and has no package_name or entry_point fields.", fr: "notebook_task exécute un notebook et n'a pas de champs package_name ni entry_point." }
    pltask: { en: "pipeline_task triggers a Lakeflow pipeline update.", fr: "pipeline_task déclenche une mise à jour de pipeline Lakeflow." }
references:
  - title: Build a Python wheel file using Declarative Automation Bundles
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/python-wheel
