id: dp750-4c-rest-run-now
objective: "4.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin's CI/CD pipeline deployed a Databricks Asset Bundle that contains the job **orders_daily** (job ID 11223344). Its tasks are `load_bronze` → `load_silver` → `build_gold`.

    A pipeline step must call the Jobs API directly with a service principal's OAuth access token stored in `$TOKEN`. The step must start a run of the job that executes `load_silver` and the tasks downstream of it, but not `load_bronze`.

    How should you complete the request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le pipeline CI/CD de Tailspin a déployé un bundle de ressources Databricks qui contient le job **orders_daily** (ID de job 11223344). Ses tâches sont `load_bronze` → `load_silver` → `build_gold`.

    Une étape du pipeline doit appeler directement l'API Jobs avec un jeton d'accès OAuth d'un principal de service stocké dans `$TOKEN`. L'étape doit démarrer une exécution du job qui exécute `load_silver` et les tâches en aval, mais pas `load_bronze`.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    curl -X [[method]] "$DATABRICKS_HOST/api/2.2/jobs/[[ep]]" \
      -H "Authorization: [[auth]] $TOKEN" \
      -d '{"job_id": 11223344, "[[field]]": ["load_silver+"]}'
  slots:
    - id: method
      options:
        - { id: post, text: POST }
        - { id: get, text: GET }
        - { id: patch, text: PATCH }
    - id: ep
      options:
        - { id: runnow, text: run-now }
        - { id: submit, text: runs/submit }
        - { id: repair, text: runs/repair }
        - { id: reset, text: reset }
    - id: auth
      options:
        - { id: bearer, text: Bearer }
        - { id: basic, text: Basic }
        - { id: negotiate, text: Negotiate }
    - id: field
      options:
        - { id: only, text: only }
        - { id: rerun, text: rerun_tasks }
        - { id: tasks, text: tasks }
        - { id: params, text: job_parameters }
answer:
  values: { method: post, ep: runnow, auth: bearer, field: only }
explanation:
  correct:
    en: "A run of an existing job starts with `POST /api/2.2/jobs/run-now`, and the OAuth access token goes in the `Authorization: Bearer` header. The `only` field lists the task keys to run; the `+` suffix adds the downstream tasks of `load_silver`. If `only` is omitted, all tasks run."
    fr: "Une exécution d'un job existant démarre avec `POST /api/2.2/jobs/run-now`, et le jeton d'accès OAuth se place dans l'en-tête `Authorization: Bearer`. Le champ `only` liste les clés des tâches à exécuter ; le suffixe `+` ajoute les tâches en aval de `load_silver`. Si `only` est omis, toutes les tâches s'exécutent."
  options:
    get: { en: "run-now is a POST request with a JSON body.", fr: "run-now est une requête POST avec un corps JSON." }
    patch: { en: "run-now is a POST request with a JSON body.", fr: "run-now est une requête POST avec un corps JSON." }
    submit: { en: "runs/submit runs a one-time workload without using the existing job.", fr: "runs/submit lance une charge de travail unique sans utiliser le job existant." }
    repair: { en: "runs/repair reruns tasks of an existing run identified by its run ID; it doesn't start a new run of the job.", fr: "runs/repair réexécute des tâches d'une exécution existante identifiée par son ID d'exécution ; il ne démarre pas de nouvelle exécution du job." }
    reset: { en: "reset overwrites the job settings; it doesn't start a run.", fr: "reset écrase les paramètres du job ; il ne démarre pas d'exécution." }
    basic: { en: "OAuth access tokens are sent as bearer tokens.", fr: "Les jetons d'accès OAuth sont envoyés comme jetons du porteur (bearer)." }
    negotiate: { en: "OAuth access tokens are sent as bearer tokens.", fr: "Les jetons d'accès OAuth sont envoyés comme jetons du porteur (bearer)." }
    rerun: { en: "rerun_tasks belongs to a repair request.", fr: "rerun_tasks appartient à une requête de réparation." }
    tasks: { en: "tasks defines the tasks of a job in create or reset requests.", fr: "tasks définit les tâches d'un job dans les requêtes create ou reset." }
    params: { en: "job_parameters overrides parameter values; it doesn't select tasks.", fr: "job_parameters remplace des valeurs de paramètres ; il ne sélectionne pas de tâches." }
references:
  - title: Trigger a single job run
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-now
  - title: Authorize service principal access to Azure Databricks with OAuth
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/auth/oauth-m2m
