id: dp750-cs2a-table-maintenance
objective: "4.4.5"
type: single
caseStudy: dp750-cs2a-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You add a SQL task to a nightly maintenance job. The task runs on a serverless SQL warehouse.

    You need to meet the table maintenance requirements for wwi_prod.telemetry.bronze_readings. Which statements should the task run?
  fr: |
    Vous ajoutez une tâche SQL à un job de maintenance nocturne. La tâche s'exécute sur un entrepôt SQL serverless.

    Vous devez satisfaire les exigences de maintenance des tables pour wwi_prod.telemetry.bronze_readings. Quelles instructions la tâche doit-elle exécuter ?
body:
  options:
    - { id: optonly, text: { en: "`OPTIMIZE wwi_prod.telemetry.bronze_readings;` only", fr: "Uniquement `OPTIMIZE wwi_prod.telemetry.bronze_readings;`" } }
    - { id: dryrun, text: { en: "`VACUUM wwi_prod.telemetry.bronze_readings DRY RUN;` followed by `OPTIMIZE wwi_prod.telemetry.bronze_readings;`", fr: "`VACUUM wwi_prod.telemetry.bronze_readings DRY RUN;` suivi de `OPTIMIZE wwi_prod.telemetry.bronze_readings;`" } }
    - { id: optvac, text: { en: "`OPTIMIZE wwi_prod.telemetry.bronze_readings;` followed by `VACUUM wwi_prod.telemetry.bronze_readings;`", fr: "`OPTIMIZE wwi_prod.telemetry.bronze_readings;` suivi de `VACUUM wwi_prod.telemetry.bronze_readings;`" } }
    - { id: vac0, text: { en: "`VACUUM wwi_prod.telemetry.bronze_readings RETAIN 0 HOURS;` followed by `OPTIMIZE wwi_prod.telemetry.bronze_readings;`", fr: "`VACUUM wwi_prod.telemetry.bronze_readings RETAIN 0 HOURS;` suivi de `OPTIMIZE wwi_prod.telemetry.bronze_readings;`" } }
answer: { optionId: optvac }
explanation:
  correct:
    en: OPTIMIZE compacts the small files into larger ones, which speeds up the queries. VACUUM then deletes the data files that the table no longer references and that are older than the default retention threshold of 7 days, so storage costs drop while time travel to the versions of the last 7 days stays possible. Because bronze_readings is an external table, predictive optimization, which applies to Unity Catalog managed tables, does not run these commands for you.
    fr: "OPTIMIZE compacte les petits fichiers en fichiers plus grands, ce qui accélère les requêtes. VACUUM supprime ensuite les fichiers de données que la table ne référence plus et qui sont plus anciens que le seuil de rétention par défaut de 7 jours : les coûts de stockage baissent tandis que le voyage dans le temps vers les versions des 7 derniers jours reste possible. Comme bronze_readings est une table externe, l'optimisation prédictive, qui s'applique aux tables managées Unity Catalog, n'exécute pas ces commandes à votre place."
  options:
    optonly:
      en: OPTIMIZE compacts files but does not delete the files that the table no longer references, so storage costs keep growing.
      fr: "OPTIMIZE compacte les fichiers mais ne supprime pas les fichiers que la table ne référence plus : les coûts de stockage continuent d'augmenter."
    dryrun:
      en: "`DRY RUN` only lists the files that VACUUM would delete; nothing is removed."
      fr: "`DRY RUN` liste uniquement les fichiers que VACUUM supprimerait ; rien n'est supprimé."
    vac0:
      en: A zero-hour retention is blocked by the retention safety check and, if the check were disabled, would remove the files needed to query earlier versions of the table.
      fr: Une rétention de zéro heure est bloquée par le contrôle de sécurité de la rétention et, si ce contrôle était désactivé, supprimerait les fichiers nécessaires pour interroger les versions antérieures de la table.
references:
  - title: Optimize data file layout
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/optimize
  - title: Remove unused data files with vacuum
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/vacuum
