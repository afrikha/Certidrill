id: dp750-4b-file-arrival-json
objective: "4.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are defining a Lakeflow job named **litware_invoices_ingest** by using the Jobs API. The job must meet the following requirements:

    - Start a run when new files land in the volume path `/Volumes/litware_prod/raw/landing/invoices/`.
    - Start at most one run every 15 minutes.
    - Start a run only once a batch of files has finished arriving. The files of a batch arrive less than 60 seconds apart.

    How should you complete the job definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez un job Lakeflow nommé **litware_invoices_ingest** à l'aide de l'API Jobs. Le job doit respecter les exigences suivantes :

    - Lancer une exécution quand de nouveaux fichiers arrivent dans le chemin de volume `/Volumes/litware_prod/raw/landing/invoices/`.
    - Lancer au plus une exécution toutes les 15 minutes.
    - Ne lancer une exécution qu'une fois qu'un lot de fichiers a fini d'arriver. Les fichiers d'un lot arrivent à moins de 60 secondes d'intervalle.

    Comment devez-vous compléter la définition du job ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "name": "litware_invoices_ingest",
      "trigger": {
        "pause_status": "UNPAUSED",
        "[[type]]": {
          "url": "/Volumes/litware_prod/raw/landing/invoices/",
          "[[cool]]": 900,
          "[[wait]]": 60
        }
      },
      "tasks": [
        { "task_key": "load_invoices", "notebook_task": { "notebook_path": "/Workspace/Shared/invoices/load_invoices" } }
      ]
    }
  slots:
    - id: type
      options:
        - { id: table, text: table_update }
        - { id: periodic, text: periodic }
        - { id: file, text: file_arrival }
    - id: cool
      options:
        - { id: min, text: min_time_between_triggers_seconds }
        - { id: wait, text: wait_after_last_change_seconds }
        - { id: timeout, text: timeout_seconds }
    - id: wait
      options:
        - { id: timeout, text: timeout_seconds }
        - { id: min, text: min_time_between_triggers_seconds }
        - { id: wait, text: wait_after_last_change_seconds }
answer:
  values: { type: file, cool: min, wait: wait }
explanation:
  correct:
    en: |
      A `file_arrival` trigger watches the volume path. `min_time_between_triggers_seconds` set to 900 is a cooldown that allows at most one run every 15 minutes. `wait_after_last_change_seconds` set to 60 is a debounce: the trigger waits 60 seconds after the latest file, and each new file resets the timer, so the run starts once the batch is complete.
    fr: |
      Un déclencheur `file_arrival` surveille le chemin de volume. `min_time_between_triggers_seconds` défini sur 900 est un temps de récupération qui autorise au plus une exécution toutes les 15 minutes. `wait_after_last_change_seconds` défini sur 60 est un anti-rebond : le déclencheur attend 60 secondes après le dernier fichier, et chaque nouveau fichier remet le minuteur à zéro ; l'exécution démarre donc une fois le lot complet.
  options:
    table: { en: "table_update watches Unity Catalog tables, not files in a volume.", fr: "table_update surveille des tables Unity Catalog, pas des fichiers dans un volume." }
    periodic: { en: "periodic starts runs at a fixed interval, whether or not files arrived.", fr: "periodic lance des exécutions à intervalle fixe, que des fichiers soient arrivés ou non." }
    timeout: { en: "timeout_seconds limits the duration of a run; it isn't a file arrival setting.", fr: "timeout_seconds limite la durée d'une exécution ; ce n'est pas un paramètre de File arrival." }
references:
  - title: Trigger jobs when new files arrive
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/file-arrival-triggers
  - title: Declarative Automation Bundles resources
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/resources
