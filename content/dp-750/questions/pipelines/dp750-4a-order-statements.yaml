id: dp750-4a-order-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing a nightly Lakeflow job that loads **fabrikam.silver** tables, updates the dimension tables **dim_product** and **dim_store**, loads the fact table **fact_sales**, which looks up the keys of both dimensions, and publishes **fabrikam.gold** tables to the business users.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit un job Lakeflow nocturne qui charge les tables **fabrikam.silver**, met à jour les tables de dimension **dim_product** et **dim_store**, charge la table de faits **fact_sales**, qui recherche les clés des deux dimensions, et publie les tables **fabrikam.gold** auprès des utilisateurs métier.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Running OPTIMIZE on the silver tables in a separate task after the gold tables are published keeps the maintenance work from delaying the gold tables.
        fr: |
          Exécuter OPTIMIZE sur les tables silver dans une tâche distincte après la publication des tables gold évite que la maintenance ne retarde les tables gold.
    - id: s2
      text:
        en: |
          Loading fact_sales before dim_product in the same run ensures that sales of products created that day get a valid product key.
        fr: |
          Charger fact_sales avant dim_product dans la même exécution garantit que les ventes des produits créés ce jour-là reçoivent une clé de produit valide.
    - id: s3
      text:
        en: |
          A task that validates the gold data can run in parallel with the task that publishes the data to the business users and still prevent the users from reading invalid data.
        fr: |
          Une tâche qui valide les données gold peut s'exécuter en parallèle de la tâche qui publie les données auprès des utilisateurs métier tout en empêchant ces utilisateurs de lire des données non valides.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Table maintenance runs after the writes, outside the critical path, so it doesn't delay the tables that consumers wait for. Dimensions must be loaded before the facts that look up their keys; otherwise new products have no key yet. A validation that must protect consumers has to finish before publication, and a parallel task can't stop a publication that is already running.
    fr: |
      La maintenance des tables s'exécute après les écritures, hors du chemin critique : elle ne retarde pas les tables qu'attendent les consommateurs. Les dimensions doivent être chargées avant les faits qui recherchent leurs clés ; sinon, les nouveaux produits n'ont pas encore de clé. Une validation qui doit protéger les consommateurs doit se terminer avant la publication, et une tâche parallèle ne peut pas arrêter une publication déjà en cours.
references:
  - title: What is the medallion lakehouse architecture?
    url: https://learn.microsoft.com/en-us/azure/databricks/lakehouse/medallion
  - title: Configure task dependencies
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-if
