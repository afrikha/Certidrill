id: dp750-4c-test-integration-data
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Azure Databricks. A job reads `contoso_prod.sales.raw_orders`, transforms the data, and writes `contoso_prod.sales.orders_clean`. The production tables contain customer personal data.

    You are writing integration tests that check that the ingestion and transformation steps work together on real Azure Databricks resources. The tests must not expose sensitive data and must not affect production tables.

    What should the integration tests run against?
  fr: |
    Contoso utilise Azure Databricks. Un job lit `contoso_prod.sales.raw_orders`, transforme les données et écrit `contoso_prod.sales.orders_clean`. Les tables de production contiennent des données personnelles de clients.

    Vous écrivez des tests d'intégration qui vérifient que les étapes d'ingestion et de transformation fonctionnent ensemble sur des ressources Azure Databricks réelles. Les tests ne doivent pas exposer de données sensibles et ne doivent pas affecter les tables de production.

    Sur quoi les tests d'intégration doivent-ils s'exécuter ?
body:
  options:
    - { id: a, text: { en: "The production tables, by using a test identity that has only the SELECT privilege", fr: "Les tables de production, avec une identité de test qui n'a que le privilège SELECT" } }
    - { id: b, text: { en: "A dedicated test catalog that holds representative, non-sensitive sample data", fr: "Un catalogue de test dédié qui contient des échantillons de données représentatifs et non sensibles" } }
    - { id: c, text: { en: "Synthetic pandas DataFrames created in memory by a pytest fixture", fr: "Des DataFrames pandas synthétiques créés en mémoire par une fixture pytest" } }
    - { id: d, text: { en: "The production tables, during off-peak hours when no job writes to them", fr: "Les tables de production, en heures creuses quand aucun job n'y écrit" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Integration tests verify that several components work together, so they usually run against actual Azure Databricks resources. Microsoft recommends dedicated test catalogs or schemas with representative data samples and no sensitive information, and never running integration tests against production tables."
    fr: "Les tests d'intégration vérifient que plusieurs composants fonctionnent ensemble ; ils s'exécutent donc en général sur des ressources Azure Databricks réelles. Microsoft recommande des catalogues ou des schémas de test dédiés, avec des échantillons de données représentatifs et sans informations sensibles, et de ne jamais exécuter de tests d'intégration sur les tables de production."
  options:
    a:
      en: "Read-only access still exposes the personal data in the production tables to the tests."
      fr: "Un accès en lecture seule expose toujours aux tests les données personnelles des tables de production."
    c:
      en: "In-memory fixtures are the basis of unit tests; they don't exercise real Azure Databricks resources, which integration tests must do."
      fr: "Les fixtures en mémoire sont la base des tests unitaires ; elles ne sollicitent pas de ressources Azure Databricks réelles, ce que doivent faire les tests d'intégration."
    d:
      en: "Running at another time doesn't change the fact that the tests read sensitive production data and can affect production tables."
      fr: "Exécuter les tests à un autre moment ne change rien : ils lisent toujours des données de production sensibles et peuvent affecter les tables de production."
references:
  - title: Implement testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy
