id: dp750-cs1b-feeder-skew
objective: "4.4.4"
type: yesno_statements
caseStudy: dp750-cs1b-city-power-light
difficulty: 2
status: draft
stem:
  en: |
    You open the Spark UI for the last run of daily-feeder-load. The longest stage is the shuffle stage of the aggregation by substation_id. The stage details show no spill statistics. The stage page shows the summary metrics in the exhibit.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ouvrez l'interface utilisateur Spark pour la dernière exécution de daily-feeder-load. L'étape la plus longue est l'étape de shuffle de l'agrégation par substation_id. Les détails de l'étape n'affichent aucune statistique de déversement (spill). La page de l'étape affiche les métriques récapitulatives de la pièce.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
exhibits:
  - id: metrics
    title: { en: "Summary Metrics for 400 Completed Tasks", fr: "Summary Metrics for 400 Completed Tasks" }
    body:
      en: |
        | Metric | Min | 25th percentile | Median | 75th percentile | Max |
        | --- | --- | --- | --- | --- | --- |
        | Duration | 3 s | 8 s | 10 s | 12 s | 41 min |
        | Shuffle Read Size / Records | 41 MB | 96 MB | 112 MB | 130 MB | 27 GB |
      fr: |
        | Métrique | Min | 25e centile | Médiane | 75e centile | Max |
        | --- | --- | --- | --- | --- | --- |
        | Duration | 3 s | 8 s | 10 s | 12 s | 41 min |
        | Shuffle Read Size / Records | 41 Mo | 96 Mo | 112 Mo | 130 Mo | 27 Go |
body:
  statements:
    - id: s1
      text:
        en: The metrics indicate that the stage might have skew.
        fr: Les métriques indiquent que l'étape présente peut-être un déséquilibrage (skew).
    - id: s2
      text:
        en: Adding a random salt to substation_id and aggregating in two stages can reduce the duration of the stage.
        fr: Ajouter un sel aléatoire à substation_id et agréger en deux étapes peut réduire la durée de l'étape.
    - id: s3
      text:
        en: Adding executor memory is the main fix for this stage.
        fr: Ajouter de la mémoire aux exécuteurs est la principale correction pour cette étape.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A stage might have skew when the Max task duration exceeds the 75th percentile by 50% or more; here one task runs 41 minutes against 12 seconds and reads far more shuffle data, so a few substation_id values hold most of the rows. When a few key values dominate an aggregation, salting the skewed keys and aggregating in two stages spreads the work over several tasks. More executor memory addresses spill, and the stage shows no spill statistics.
    fr: |
      Une étape présente peut-être un déséquilibrage quand la durée Max d'une tâche dépasse le 75e centile d'au moins 50 % ; ici une tâche dure 41 minutes contre 12 secondes et lit beaucoup plus de données de shuffle, donc quelques valeurs de substation_id concentrent la plupart des lignes. Quand quelques valeurs de clé dominent une agrégation, saler les clés déséquilibrées et agréger en deux étapes répartit le travail sur plusieurs tâches. Ajouter de la mémoire aux exécuteurs traite le déversement, et l'étape n'affiche aucune statistique de déversement.
references:
  - title: Skew and spill
    url: https://learn.microsoft.com/en-us/azure/databricks/optimizations/spark-ui-guide/long-spark-stage-page
