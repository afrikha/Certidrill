id: dp750-cs1b-failure-alert
objective: "4.4.7"
type: multi
caseStudy: dp750-cs1b-city-power-light
difficulty: 1
status: draft
stem:
  en: |
    You need to implement the alerting for failed job runs. The solution must meet the operations requirements.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez mettre en place les alertes sur les exécutions de jobs en échec. La solution doit respecter les exigences d'exploitation.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: diag, text: { en: "Create a diagnostic setting on adb-cpl-prod that sends the jobs category to law-cpl-ops.", fr: "Créer sur adb-cpl-prod un paramètre de diagnostic qui envoie la catégorie jobs vers law-cpl-ops." } }
    - { id: logalert, text: { en: "Create a log search alert rule on law-cpl-ops that queries DatabricksJobs for failed runs and uses ag-cpl-ops.", fr: "Créer sur law-cpl-ops une règle d'alerte de recherche dans les journaux qui interroge DatabricksJobs pour les exécutions en échec et utilise ag-cpl-ops." } }
    - { id: activity, text: { en: "Create an activity log alert rule on adb-cpl-prod that uses ag-cpl-ops.", fr: "Créer sur adb-cpl-prod une règle d'alerte du journal d'activité qui utilise ag-cpl-ops." } }
    - { id: ama, text: { en: "Install the Azure Monitor Agent on the job clusters by using an init script.", fr: "Installer Azure Monitor Agent sur les clusters de job à l'aide d'un script d'initialisation." } }
    - { id: jobnotif, text: { en: "Add an email notification on failure to each job in adb-cpl-prod.", fr: "Ajouter à chaque job d'adb-cpl-prod une notification par e-mail en cas d'échec." } }
answer: { optionIds: [ diag, logalert ] }
explanation:
  correct:
    en: |
      Diagnostic logs of an Azure Databricks workspace on the Premium plan are streamed to a Log Analytics workspace by a diagnostic setting; the jobs category lands in the DatabricksJobs table. A log search alert rule then runs a query on law-cpl-ops on a schedule and notifies the operations team through the action group ag-cpl-ops.
    fr: |
      Les journaux de diagnostic d'un espace de travail Azure Databricks au plan Premium sont envoyés vers un espace de travail Log Analytics par un paramètre de diagnostic ; la catégorie jobs arrive dans la table DatabricksJobs. Une règle d'alerte de recherche dans les journaux exécute ensuite régulièrement une requête sur law-cpl-ops et prévient l'équipe d'exploitation via le groupe d'actions ag-cpl-ops.
  options:
    activity: { en: "The activity log records Azure Resource Manager operations on the workspace resource, not the runs of jobs inside the workspace.", fr: "Le journal d'activité enregistre les opérations Azure Resource Manager sur la ressource d'espace de travail, pas les exécutions de jobs dans l'espace de travail." }
    ama: { en: "Job run events come from the workspace diagnostic logs; no agent is needed on the clusters to send them.", fr: "Les événements d'exécution de jobs proviennent des journaux de diagnostic de l'espace de travail ; aucun agent n'est nécessaire sur les clusters pour les envoyer." }
    jobnotif: { en: "Job notifications are managed in Azure Databricks, not in Azure Monitor from the data in law-cpl-ops.", fr: "Les notifications de job sont gérées dans Azure Databricks, pas dans Azure Monitor à partir des données de law-cpl-ops." }
references:
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
  - title: Create Azure Monitor log search alert rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule
