id: dp750-4b-git-folder-per-dev
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Five data engineers at Fabrikam share a single Git folder named `/Workspace/Shared/claims-etl`, which is connected to an Azure DevOps repository. When one engineer switches the folder to another branch, the notebooks change for everyone, and work is overwritten.

    You need each engineer to work on a branch without affecting the others. The solution must follow Databricks recommendations.

    What should you do?
  fr: |
    Cinq ingénieurs données de Fabrikam partagent un même dossier Git nommé `/Workspace/Shared/claims-etl`, connecté à un dépôt Azure DevOps. Quand un ingénieur bascule le dossier sur une autre branche, les notebooks changent pour tout le monde, et du travail est écrasé.

    Chaque ingénieur doit travailler sur une branche sans affecter les autres. La solution doit suivre les recommandations de Databricks.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Have each engineer create a personal branch in the shared Git folder.", fr: "Faire créer à chaque ingénieur une branche personnelle dans le dossier Git partagé." } }
    - { id: b, text: { en: "Enable sparse checkout on the shared Git folder.", fr: "Activer le sparse checkout sur le dossier Git partagé." } }
    - { id: c, text: { en: "Grant the engineers Can Run instead of Can Edit on the shared Git folder.", fr: "Accorder aux ingénieurs Can Run au lieu de Can Edit sur le dossier Git partagé." } }
    - { id: d, text: { en: "Have each engineer clone the repository into a Git folder under their own /Workspace/Users/ folder.", fr: "Faire cloner le dépôt par chaque ingénieur dans un dossier Git situé sous son propre dossier /Workspace/Users/." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Git folder has one checked-out branch, so in a shared folder a branch switch affects every user. Each developer clones the repository into their own folder under `/Workspace/Users/<email>/` and works on their own branch, then shares changes through the remote repository.
    fr: |
      Un dossier Git n'a qu'une branche extraite : dans un dossier partagé, un changement de branche affecte tous les utilisateurs. Chaque développeur clone le dépôt dans son propre dossier sous `/Workspace/Users/<email>/` et travaille sur sa propre branche, puis partage ses modifications par le dépôt distant.
  options:
    a: { en: "Branches created in the shared folder still use one checkout, so switching to a personal branch changes the folder for everyone.", fr: "Les branches créées dans le dossier partagé utilisent toujours une seule extraction : basculer sur une branche personnelle change le dossier pour tout le monde." }
    b: { en: "Sparse checkout limits which folders are checked out; it doesn't isolate users.", fr: "Le sparse checkout limite les dossiers extraits ; il n'isole pas les utilisateurs." }
    c: { en: "Can Run would stop the engineers from editing the code they must develop.", fr: "Can Run empêcherait les ingénieurs de modifier le code qu'ils doivent développer." }
references:
  - title: CI/CD with Databricks Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/ci-cd
