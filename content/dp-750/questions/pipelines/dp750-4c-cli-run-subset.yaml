id: dp750-4c-cli-run-subset
objective: "4.3.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam deployed a Databricks Asset Bundle to its `prod` target. The bundle defines a job with the resource key **daily_sales** and the tasks `ingest` → `transform` → `aggregate` → `publish`, where each task depends on the previous one. The default target of the bundle is `dev`.

    After fixing the source data, you need to run `transform` and every task downstream of it in production, but not `ingest`. The command must return immediately instead of waiting for the run to finish.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a déployé un bundle de ressources Databricks sur sa cible `prod`. Le bundle définit un job dont la clé de ressource est **daily_sales**, avec les tâches `ingest` → `transform` → `aggregate` → `publish`, chacune dépendant de la précédente. La cible par défaut du bundle est `dev`.

    Après avoir corrigé les données sources, vous devez exécuter `transform` et toutes les tâches en aval en production, mais pas `ingest`. La commande doit rendre la main immédiatement au lieu d'attendre la fin de l'exécution.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    databricks bundle [[cmd]] [[tgt]] daily_sales --only [[tasks]] [[wait]]
  slots:
    - id: cmd
      options:
        - { id: run, text: run }
        - { id: deploy, text: deploy }
        - { id: open, text: open }
        - { id: summary, text: summary }
    - id: tgt
      options:
        - { id: t, text: "-t prod" }
        - { id: p, text: "-p prod" }
        - { id: var, text: "--var=\"target=prod\"" }
    - id: tasks
      options:
        - { id: down, text: "transform+" }
        - { id: up, text: "+transform" }
        - { id: only, text: transform }
        - { id: both, text: "+transform+" }
    - id: wait
      options:
        - { id: nowait, text: "--no-wait" }
        - { id: restart, text: "--restart" }
        - { id: auto, text: "--auto-approve" }
answer:
  values: { cmd: run, tgt: t, tasks: down, wait: nowait }
explanation:
  correct:
    en: "`bundle run` runs a deployed job by its resource key, and `-t prod` selects the prod target instead of the default dev target. In `--only`, a `+` suffix adds the downstream tasks of a key and a `+` prefix adds its upstream tasks, so `transform+` runs transform, aggregate and publish. `--no-wait` returns without waiting for the run to complete."
    fr: "`bundle run` exécute un job déployé par sa clé de ressource, et `-t prod` sélectionne la cible prod au lieu de la cible dev par défaut. Dans `--only`, un suffixe `+` ajoute les tâches en aval d'une clé et un préfixe `+` ses tâches en amont : `transform+` exécute transform, aggregate et publish. `--no-wait` rend la main sans attendre la fin de l'exécution."
  options:
    deploy: { en: "deploy creates or updates resources; it doesn't start a run.", fr: "deploy crée ou met à jour des ressources ; il ne démarre pas d'exécution." }
    open: { en: "open opens the resource in the workspace.", fr: "open ouvre la ressource dans l'espace de travail." }
    summary: { en: "summary lists the deployed resources.", fr: "summary liste les ressources déployées." }
    p: { en: "-p selects an authentication profile, not a bundle target.", fr: "-p sélectionne un profil d'authentification, pas une cible du bundle." }
    var: { en: "--var sets a custom variable; it doesn't select the target.", fr: "--var définit une variable personnalisée ; il ne sélectionne pas la cible." }
    up: { en: "A + prefix adds the upstream tasks, so ingest would run.", fr: "Un préfixe + ajoute les tâches en amont : ingest s'exécuterait." }
    only: { en: "Without +, only transform runs, not its downstream tasks.", fr: "Sans +, seule transform s'exécute, pas ses tâches en aval." }
    both: { en: "+transform+ adds upstream and downstream tasks, so ingest would run.", fr: "+transform+ ajoute les tâches en amont et en aval : ingest s'exécuterait." }
    restart: { en: "--restart restarts the run if it is already running; the command still waits.", fr: "--restart redémarre l'exécution si elle est déjà en cours ; la commande attend toujours." }
    auto: { en: "--auto-approve isn't an option of bundle run and doesn't control waiting.", fr: "--auto-approve n'est pas une option de bundle run et ne contrôle pas l'attente." }
references:
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
  - title: Trigger a single job run
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-now
