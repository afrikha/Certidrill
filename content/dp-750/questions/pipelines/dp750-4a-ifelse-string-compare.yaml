id: dp750-4a-ifelse-string-compare
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Lakeflow job named **claims_load**. The Python notebook task **score_batch** computes the share of valid rows in the batch as a float and runs `dbutils.jobs.taskValues.set(key="quality_score", value=score)`.

    An If/else condition task named **gate** uses the following condition, and the task **publish_claims** depends on `gate (true)`.

    ```text
    {{tasks.score_batch.values.quality_score}} == 1
    ```

    Yesterday, every row of the batch was valid and score_batch set quality_score to 1.0, but publish_claims didn't run.

    You need publish_claims to run whenever quality_score is 1 or more.

    What should you do?
  fr: |
    Adatum dispose d'un job Lakeflow nommé **claims_load**. La tâche notebook Python **score_batch** calcule la part de lignes valides du lot sous forme de nombre à virgule flottante et exécute `dbutils.jobs.taskValues.set(key="quality_score", value=score)`.

    Une tâche If/else condition nommée **gate** utilise la condition suivante, et la tâche **publish_claims** dépend de `gate (true)`.

    ```text
    {{tasks.score_batch.values.quality_score}} == 1
    ```

    Hier, toutes les lignes du lot étaient valides et score_batch a défini quality_score sur 1.0, mais publish_claims ne s'est pas exécutée.

    Vous devez faire en sorte que publish_claims s'exécute chaque fois que quality_score vaut 1 ou plus.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Put the second operand in quotes so that the condition reads == \"1\".", fr: "Placer le second opérande entre guillemets pour que la condition devienne == \"1\"." }
    - id: b
      text: { en: "Make publish_claims depend on gate (false) instead of gate (true).", fr: "Faire dépendre publish_claims de gate (false) au lieu de gate (true)." }
    - id: c
      text: { en: "Change the operator of the condition from == to >= and keep the second operand 1.", fr: "Remplacer l'opérateur == de la condition par >= et conserver le second opérande 1." }
    - id: d
      text: { en: "Set the Run if dependencies condition of publish_claims to All done.", fr: "Définir la condition Run if dependencies de publish_claims sur All done." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In an If/else condition, `==` and `!=` compare the operands as strings, so "1.0" == "1" is false. The `>`, `>=`, `<` and `<=` operators compare numerically, so 1.0 >= 1 is true, which also matches the requirement of 1 or more.
    fr: |
      Dans une condition If/else, `==` et `!=` comparent les opérandes comme des chaînes : "1.0" == "1" est donc faux. Les opérateurs `>`, `>=`, `<` et `<=` comparent numériquement : 1.0 >= 1 est vrai, ce qui correspond aussi à l'exigence « 1 ou plus ».
  options:
    a:
      en: |
        The comparison is already a string comparison; "1.0" still differs from "1".
      fr: |
        La comparaison est déjà une comparaison de chaînes ; "1.0" reste différent de "1".
    b:
      en: |
        The false branch would run publish_claims when the batch is not fully valid, which reverses the logic.
      fr: |
        La branche false exécuterait publish_claims quand le lot n'est pas entièrement valide, ce qui inverse la logique.
    d:
      en: |
        All done applies to failure states of dependencies; it would run publish_claims after gate whatever the condition result.
      fr: |
        All done porte sur l'état d'exécution des dépendances ; publish_claims s'exécuterait après gate quel que soit le résultat de la condition.
references:
  - title: Add branching logic to a job with the If/else task
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/if-else
