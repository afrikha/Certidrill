id: dp750-4c-jobs-repair-api
objective: "4.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Lakeflow Jobs job named **orders_archive**. In run 455644833, the task `load_orders` failed. The task `archive_orders` is disabled in the job settings, but this time it must run after `load_orders` is fixed.

    An operations script must repair run 455644833 through the Jobs API 2.2 so that both `load_orders` and `archive_orders` run.

    How should you complete the request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un job Lakeflow Jobs nommé **orders_archive**. Dans l'exécution 455644833, la tâche `load_orders` a échoué. La tâche `archive_orders` est désactivée dans les paramètres du job, mais cette fois elle doit s'exécuter après la correction de `load_orders`.

    Un script d'exploitation doit réparer l'exécution 455644833 par l'API Jobs 2.2 pour que `load_orders` et `archive_orders` s'exécutent toutes les deux.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    curl -X POST "$DATABRICKS_HOST/api/2.2/jobs/runs/[[ep]]" \
      -H "Authorization: Bearer $TOKEN" \
      -d '{"[[id]]": 455644833, "[[tasks]]": ["load_orders", "archive_orders"]}'
  slots:
    - id: ep
      options:
        - { id: repair, text: repair }
        - { id: submit, text: submit }
        - { id: cancel, text: cancel }
        - { id: getoutput, text: get-output }
    - id: id
      options:
        - { id: runid, text: run_id }
        - { id: jobid, text: job_id }
        - { id: taskkey, text: task_key }
    - id: tasks
      options:
        - { id: rerun, text: rerun_tasks }
        - { id: only, text: only }
        - { id: tasklist, text: tasks }
answer:
  values: { ep: repair, id: runid, tasks: rerun }
explanation:
  correct:
    en: "`POST /api/2.2/jobs/runs/repair` repairs an existing run identified by its `run_id`. Repairs use each task's run state, not its disabled state, so a disabled task runs only if you list it in `rerun_tasks`, together with the failed task."
    fr: "`POST /api/2.2/jobs/runs/repair` répare une exécution existante identifiée par son `run_id`. Les réparations se basent sur l'état d'exécution de chaque tâche, pas sur son état désactivé : une tâche désactivée ne s'exécute que si vous la listez dans `rerun_tasks`, avec la tâche en échec."
  options:
    submit: { en: "runs/submit starts a one-time run without a job; it doesn't repair run 455644833.", fr: "runs/submit lance une exécution unique sans job ; il ne répare pas l'exécution 455644833." }
    cancel: { en: "runs/cancel stops an active run.", fr: "runs/cancel arrête une exécution active." }
    getoutput: { en: "runs/get-output returns the output of a task run.", fr: "runs/get-output renvoie la sortie d'une exécution de tâche." }
    jobid: { en: "A repair targets a run, not the job.", fr: "Une réparation cible une exécution, pas le job." }
    taskkey: { en: "task_key identifies a task inside a job definition, not the run to repair.", fr: "task_key identifie une tâche dans la définition d'un job, pas l'exécution à réparer." }
    only: { en: "only selects the tasks of a new run started with run-now.", fr: "only sélectionne les tâches d'une nouvelle exécution démarrée avec run-now." }
    tasklist: { en: "tasks defines the tasks of a job in create or reset requests.", fr: "tasks définit les tâches d'un job dans les requêtes create ou reset." }
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
