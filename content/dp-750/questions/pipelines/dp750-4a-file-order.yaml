id: dp750-4a-file-order
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Lakeflow Spark Declarative Pipelines pipeline. Its **transformations** folder contains two SQL source files:

    - **gold_sales.sql** defines the materialized view **sales_by_store**, which reads **orders_silver**.
    - **silver_orders.sql** defines the streaming table **orders_silver**.

    A colleague is concerned that gold_sales.sql sorts first alphabetically and could be processed before silver_orders.sql.

    What should you do to ensure that orders_silver is updated before sales_by_store?
  fr: |
    Northwind Traders dispose d'un pipeline des pipelines déclaratifs Lakeflow Spark. Son dossier **transformations** contient deux fichiers sources SQL :

    - **gold_sales.sql** définit la vue matérialisée **sales_by_store**, qui lit **orders_silver**.
    - **silver_orders.sql** définit la table de diffusion en continu **orders_silver**.

    Un collègue craint que gold_sales.sql, premier dans l'ordre alphabétique, soit traité avant silver_orders.sql.

    Que devez-vous faire pour garantir que orders_silver est mise à jour avant sales_by_store ?
body:
  options:
    - id: a
      text: { en: "Nothing, because the pipeline orders the updates from the dependencies.", fr: "Rien, car le pipeline ordonne les mises à jour d'après les dépendances." }
    - id: b
      text: { en: "Move both definitions into one file, with orders_silver first.", fr: "Déplacer les deux définitions dans un seul fichier, orders_silver en premier." }
    - id: c
      text: { en: "Move gold_sales.sql to a second pipeline that runs after the first.", fr: "Déplacer gold_sales.sql dans un second pipeline exécuté après le premier." }
    - id: d
      text: { en: "Rename the files with numeric prefixes such as 01_ and 02_.", fr: "Renommer les fichiers avec des préfixes numériques comme 01_ et 02_." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A pipeline analyzes the dependencies between its datasets and orders and parallelizes their updates automatically. Source files can be added in any order, so sales_by_store is always updated after orders_silver, which it reads.
    fr: |
      Un pipeline analyse les dépendances entre ses jeux de données, puis ordonne et parallélise automatiquement leurs mises à jour. Les fichiers sources peuvent être ajoutés dans n'importe quel ordre : sales_by_store est donc toujours mise à jour après orders_silver, qu'elle lit.
  options:
    d:
      en: |
        File names have no effect on the update order; the dependency graph decides it.
      fr: |
        Les noms de fichiers n'ont aucun effet sur l'ordre de mise à jour ; c'est le graphe des dépendances qui le détermine.
    b:
      en: |
        The order of definitions within a file doesn't decide the update order either.
      fr: |
        L'ordre des définitions dans un fichier ne détermine pas non plus l'ordre de mise à jour.
    c:
      en: |
        Splitting the pipeline adds orchestration work and loses the automatic dependency handling between the datasets.
      fr: |
        Scinder le pipeline ajoute du travail d'orchestration et fait perdre la gestion automatique des dépendances entre les jeux de données.
references:
  - title: Configure pipelines
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/configure-pipeline
  - title: Pipeline concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/concepts
