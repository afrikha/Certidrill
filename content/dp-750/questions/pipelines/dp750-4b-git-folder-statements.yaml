id: dp750-4b-git-folder-statements
objective: "4.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your team at Northwind Traders develops notebooks in Git folders connected to a GitHub repository. You are writing the team's version control guidelines.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Chez Northwind Traders, votre équipe développe des notebooks dans des dossiers Git connectés à un dépôt GitHub. Vous rédigez les règles de contrôle de version de l'équipe.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Git folders can connect to the remote repository over SSH.", fr: "Les dossiers Git peuvent se connecter au dépôt distant par SSH." } }
    - { id: b, text: { en: "A pull that brings upstream changes to a notebook clears its cell outputs, comments and version history.", fr: "Un pull qui apporte des modifications en amont à un notebook efface ses sorties de cellules, ses commentaires et son historique de versions." } }
    - { id: c, text: { en: "MLflow experiments in a Git folder can be committed to the remote repository.", fr: "Les expériences MLflow d'un dossier Git peuvent être validées dans le dépôt distant." } }
    - { id: d, text: { en: "Commit & Push preserves the state of the notebooks, including their outputs and comments.", fr: "Commit & Push conserve l'état des notebooks, y compris leurs sorties et leurs commentaires." } }
    - { id: e, text: { en: "A working branch in a Git folder can be up to 10 GB.", fr: "Une branche de travail d'un dossier Git peut atteindre 10 Go." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Git operations that change the source of a notebook, such as a pull that brings upstream changes, clear its state: cell outputs, comments, version history and widgets. Commit, push and branch creation keep the notebook state.
    fr: |
      Les opérations Git qui modifient la source d'un notebook, comme un pull qui apporte des modifications en amont, effacent son état : sorties de cellules, commentaires, historique de versions et widgets. Commit, push et la création de branche conservent l'état du notebook.
  options:
    a: { en: "Git folders support HTTPS only; SSH and GPG signing aren't supported.", fr: "Les dossiers Git ne prennent en charge que HTTPS ; SSH et la signature GPG ne sont pas pris en charge." }
    c: { en: "MLflow experiments are an unsupported asset type: they can be moved into a Git folder but not committed.", fr: "Les expériences MLflow sont un type de ressource non pris en charge : on peut les déplacer dans un dossier Git, mais pas les valider." }
    e: { en: "A working branch is limited to 1 GB.", fr: "Une branche de travail est limitée à 1 Go." }
references:
  - title: Azure Databricks Git folder limits and reference
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/limits
  - title: Supported asset types in Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/supported-artifact-types
