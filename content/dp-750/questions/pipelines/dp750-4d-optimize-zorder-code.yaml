id: dp750-4d-optimize-zorder-code
objective: "4.4.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The Delta table **proseware.sales.orders** is partitioned by `order_date` and does not use liquid clustering. Most queries filter on `customer_id`. Older partitions were already optimized.

    You add a SQL task to a nightly job. The task must meet the following requirements:

    - Rewrite only the data of the last seven days.
    - Colocate the rows of the same customer in the same files.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    La table Delta **proseware.sales.orders** est partitionnée par `order_date` et n'utilise pas le liquid clustering. La plupart des requêtes filtrent sur `customer_id`. Les partitions plus anciennes ont déjà été optimisées.

    Vous ajoutez une tâche SQL à un job nocturne. La tâche doit répondre aux exigences suivantes :

    - Réécrire uniquement les données des sept derniers jours.
    - Regrouper les lignes d'un même client dans les mêmes fichiers.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    OPTIMIZE proseware.sales.orders
    [[filter]] order_date >= current_date() - INTERVAL 7 DAYS
    [[colocate]] (customer_id);
  slots:
    - id: filter
      options:
        - { id: where, text: WHERE }
        - { id: having, text: HAVING }
        - { id: partition, text: PARTITION }
        - { id: qualify, text: QUALIFY }
    - id: colocate
      options:
        - { id: clusterby, text: CLUSTER BY }
        - { id: zorderby, text: ZORDER BY }
        - { id: orderby, text: ORDER BY }
        - { id: distributeby, text: DISTRIBUTE BY }
answer:
  values: { filter: where, colocate: zorderby }
explanation:
  correct:
    en: "`OPTIMIZE ... WHERE` limits the rewrite to the rows that match a predicate on partition columns, here the last seven days of `order_date`. `ZORDER BY (customer_id)` colocates the rows of each customer in the same files, which improves data skipping for the queries that filter on it; it is allowed because the table does not use liquid clustering."
    fr: "`OPTIMIZE ... WHERE` limite la réécriture aux lignes qui correspondent à un prédicat sur les colonnes de partition, ici les sept derniers jours de `order_date`. `ZORDER BY (customer_id)` regroupe les lignes de chaque client dans les mêmes fichiers, ce qui améliore l'omission de données pour les requêtes qui filtrent dessus ; il est autorisé car la table n'utilise pas le liquid clustering."
  options:
    filter:
      en: OPTIMIZE accepts only a WHERE clause; HAVING and QUALIFY filter query results, and PARTITION is not a clause of OPTIMIZE.
      fr: OPTIMIZE n'accepte qu'une clause WHERE ; HAVING et QUALIFY filtrent les résultats d'une requête, et PARTITION n'est pas une clause d'OPTIMIZE.
    colocate:
      en: CLUSTER BY sets liquid clustering keys in CREATE TABLE or ALTER TABLE, and ORDER BY and DISTRIBUTE BY are query clauses; none is a clause of OPTIMIZE.
      fr: CLUSTER BY définit les clés de liquid clustering dans CREATE TABLE ou ALTER TABLE, et ORDER BY et DISTRIBUTE BY sont des clauses de requête ; aucune n'est une clause d'OPTIMIZE.
references:
  - title: OPTIMIZE
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-optimize
