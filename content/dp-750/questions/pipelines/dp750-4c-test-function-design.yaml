id: dp750-4c-test-function-design
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin stores its transformation functions in `src/transforms.py` in a Git folder and tests them with pytest. The function `new_bookings(df, since)` returns a DataFrame of the bookings created after `since`, or `False` when no booking matches.

    The unit tests of the function are hard to write and often break, because every test must first check which type the function returned.

    You need to make the function easier to unit test without changing which bookings it returns.

    What should you do?
  fr: |
    Tailspin stocke ses fonctions de transformation dans `src/transforms.py` dans un dossier Git et les teste avec pytest. La fonction `new_bookings(df, since)` renvoie un DataFrame des réservations créées après `since`, ou `False` quand aucune réservation ne correspond.

    Les tests unitaires de la fonction sont difficiles à écrire et échouent souvent, car chaque test doit d'abord vérifier le type renvoyé par la fonction.

    Vous devez rendre la fonction plus facile à tester unitairement sans changer les réservations qu'elle renvoie.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Always return a DataFrame, and return an empty one when no booking matches", fr: "Toujours renvoyer un DataFrame, et renvoyer un DataFrame vide quand aucune réservation ne correspond" } }
    - { id: b, text: { en: "Return None instead of False when no booking matches", fr: "Renvoyer None au lieu de False quand aucune réservation ne correspond" } }
    - { id: c, text: { en: "Move the function into a notebook and call it from the tests with %run", fr: "Déplacer la fonction dans un notebook et l'appeler depuis les tests avec %run" } }
    - { id: d, text: { en: "Replace the unit tests with an end-to-end test of the whole job", fr: "Remplacer les tests unitaires par un test de bout en bout du job entier" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A testable function returns one predictable outcome of a single data type. A function that returns either a DataFrame or `False` forces every test to handle two types; returning a DataFrame in all cases, empty when nothing matches, keeps the same result set and simplifies the assertions."
    fr: "Une fonction testable renvoie un seul résultat prévisible, d'un seul type de données. Une fonction qui renvoie soit un DataFrame, soit `False` oblige chaque test à gérer deux types ; renvoyer un DataFrame dans tous les cas, vide quand rien ne correspond, conserve le même jeu de résultats et simplifie les assertions."
  options:
    b:
      en: "The function still returns two different types, a DataFrame or None, so the tests keep the same problem."
      fr: "La fonction renvoie toujours deux types différents, un DataFrame ou None : les tests gardent le même problème."
    c:
      en: "Microsoft recommends the opposite, keeping functions in .py files outside notebooks so that they can be imported and unit tested."
      fr: "Microsoft recommande l'inverse : garder les fonctions dans des fichiers .py hors des notebooks pour pouvoir les importer et les tester unitairement."
    d:
      en: "An end-to-end test is slow and doesn't replace fast unit tests of a single function; the testing pyramid keeps many unit tests at its base."
      fr: "Un test de bout en bout est lent et ne remplace pas des tests unitaires rapides d'une fonction ; la pyramide des tests conserve beaucoup de tests unitaires à sa base."
references:
  - title: Implement testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy
  - title: Unit testing for Databricks notebooks
    url: https://learn.microsoft.com/en-us/azure/databricks/notebooks/testing
