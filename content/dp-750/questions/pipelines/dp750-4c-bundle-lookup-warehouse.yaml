id: dp750-4c-bundle-lookup-warehouse
objective: "4.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is configuring a Databricks Asset Bundle for a job that refreshes reporting queries. In every workspace, the SQL warehouse that the job must use is named **Shared Reporting**, but its ID differs from one workspace to another.

    You need the bundle to resolve the ID of the warehouse from its name at deployment time, and the job task to use that ID.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys configure un bundle de ressources Databricks pour un job qui actualise des requêtes de rapports. Dans chaque espace de travail, l'entrepôt SQL que le job doit utiliser se nomme **Shared Reporting**, mais son ID diffère d'un espace de travail à l'autre.

    Vous devez faire en sorte que le bundle résolve l'ID de l'entrepôt à partir de son nom au moment du déploiement, et que la tâche du job utilise cet ID.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    variables:
      reporting_warehouse_id:
        description: SQL warehouse used by the refresh job
        [[kw]]:
          [[obj]]: 'Shared Reporting'

    resources:
      jobs:
        refresh_reports:
          name: refresh-reports
          tasks:
            - task_key: refresh
              sql_task:
                warehouse_id: [[ref]]
                file:
                  path: ./sql/refresh.sql
  slots:
    - id: kw
      options:
        - { id: lookup, text: lookup }
        - { id: default, text: default }
        - { id: type, text: type }
    - id: obj
      options:
        - { id: warehouse, text: warehouse }
        - { id: sqlwh, text: sql_warehouse }
        - { id: cluster, text: cluster }
        - { id: query, text: query }
    - id: ref
      options:
        - { id: var, text: "${var.reporting_warehouse_id}" }
        - { id: vars, text: "${variables.reporting_warehouse_id}" }
        - { id: bare, text: "${reporting_warehouse_id}" }
        - { id: res, text: "${resources.reporting_warehouse_id}" }
answer:
  values: { kw: lookup, obj: warehouse, ref: var }
explanation:
  correct:
    en: "A custom variable with a `lookup` resolves a named object to its ID at deployment time; `warehouse` is one of the supported object types, along with `cluster`, `job`, `pipeline`, `query`, `service_principal` and others. The deployment fails if no object or more than one object has that name. You reference a custom variable with `${var.<variable_name>}`."
    fr: "Une variable personnalisée avec `lookup` résout un objet nommé en son ID au moment du déploiement ; `warehouse` fait partie des types d'objets pris en charge, avec `cluster`, `job`, `pipeline`, `query`, `service_principal` et d'autres. Le déploiement échoue si aucun objet, ou plusieurs objets, portent ce nom. Une variable personnalisée se référence avec `${var.<variable_name>}`."
  options:
    default: { en: "A default is a fixed value; it doesn't resolve a name to an ID in each workspace.", fr: "Une valeur default est fixe ; elle ne résout pas un nom en ID dans chaque espace de travail." }
    type: { en: "type only accepts complex, for structured values.", fr: "type n'accepte que complex, pour les valeurs structurées." }
    sqlwh: { en: "sql_warehouses is a resource type of bundles, not a lookup object type; the lookup type is warehouse.", fr: "sql_warehouses est un type de ressource des bundles, pas un type d'objet de lookup ; le type de lookup est warehouse." }
    cluster: { en: "A cluster lookup returns the ID of an all-purpose cluster, not of a SQL warehouse.", fr: "Un lookup cluster renvoie l'ID d'un cluster polyvalent, pas celui d'un entrepôt SQL." }
    query: { en: "A query lookup returns the ID of a saved query, not of a SQL warehouse.", fr: "Un lookup query renvoie l'ID d'une requête enregistrée, pas celui d'un entrepôt SQL." }
    vars: { en: "Custom variables are referenced with the var prefix, not variables.", fr: "Les variables personnalisées se référencent avec le préfixe var, pas variables." }
    bare: { en: "A substitution needs the var prefix to reference a custom variable.", fr: "Une substitution a besoin du préfixe var pour référencer une variable personnalisée." }
    res: { en: "The resources prefix references deployed bundle resources, such as a job ID, not variables.", fr: "Le préfixe resources référence des ressources déployées du bundle, comme l'ID d'un job, pas des variables." }
references:
  - title: Substitutions and variables in Declarative Automation Bundles
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/variables
