id: dp750-4c-spark-diagnostic-tools
objective: "4.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind's nightly notebook on an all-purpose compute resource named **nw-etl** became much slower last night. You are investigating the cause.

    Where should you look for each piece of information? To answer, drag the appropriate locations to the correct information. Each location may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le notebook nocturne de Northwind, sur une ressource de calcul polyvalent nommée **nw-etl**, est devenu beaucoup plus lent la nuit dernière. Vous recherchez la cause.

    Où devez-vous chercher chaque information ? Pour répondre, faites glisser les emplacements appropriés vers les informations correspondantes. Chaque emplacement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: serverload, text: { en: "Server load distribution chart in the Metrics tab", fr: "Graphique Server load distribution de l'onglet Metrics" } }
    - { id: sqldag, text: { en: "SQL DAG in the Spark UI", fr: "DAG SQL dans l'interface utilisateur Spark" } }
    - { id: eventlog, text: { en: "Event log tab of the compute", fr: "Onglet Event log du calcul" } }
    - { id: driverlogs, text: { en: "Driver logs tab of the compute", fr: "Onglet Driver logs du calcul" } }
    - { id: summary, text: { en: "Summary Metrics of a stage in the Spark UI", fr: "Summary Metrics d'une étape dans l'interface utilisateur Spark" } }
  targets:
    - { id: t1, text: { en: "Confirm that the driver, not the workers, is heavily loaded", fr: "Confirmer que c'est le pilote, et non les workers, qui est fortement chargé" } }
    - { id: t2, text: { en: "Find how many files the scan operator of a slow query read", fr: "Trouver combien de fichiers l'opérateur d'analyse d'une requête lente a lus" } }
    - { id: t3, text: { en: "Check whether nw-etl was terminated or its configuration edited during the night", fr: "Vérifier si nw-etl a été arrêté ou si sa configuration a été modifiée pendant la nuit" } }
    - { id: t4, text: { en: "Read the standard error and Log4j output of the notebook code", fr: "Lire l'erreur standard et la sortie Log4j du code du notebook" } }
answer:
  mapping: { t1: serverload, t2: sqldag, t3: eventlog, t4: driverlogs }
explanation:
  correct:
    en: "In the Server load distribution chart, each block is a machine; a busy driver shows one red block while the workers are blue. Clicking the scan operator in the SQL DAG shows the number of files read. The event log records lifecycle events such as creation, termination and configuration edits, kept for 60 days. The driver logs hold the standard output, standard error and Log4j output of notebooks, jobs and libraries."
    fr: "Dans le graphique Server load distribution, chaque bloc est une machine ; un pilote occupé apparaît comme un bloc rouge pendant que les workers sont bleus. Cliquer sur l'opérateur d'analyse dans le DAG SQL affiche le nombre de fichiers lus. Le journal des événements enregistre les événements de cycle de vie comme la création, l'arrêt et les modifications de configuration, conservés 60 jours. Les journaux du pilote contiennent la sortie standard, l'erreur standard et la sortie Log4j des notebooks, des jobs et des bibliothèques."
  options:
    summary: { en: "Stage Summary Metrics compare task durations to detect skew; they don't answer these needs.", fr: "Les Summary Metrics d'une étape comparent les durées des tâches pour détecter le déséquilibrage ; elles ne répondent pas à ces besoins." }
references:
  - title: Gaps between Spark jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/optimizations/spark-ui-guide/spark-job-gaps
  - title: Manage classic compute
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage
