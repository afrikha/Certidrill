id: dp750-4a-dynamic-values
objective: "4.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Lakeflow job named **billing_daily**. Its first task, **extract**, is a Python notebook that sets the task value **row_count**. The next task, **load**, is a notebook task whose parameters must be set by using dynamic value references.

    Which reference should you use for each parameter of load? To answer, drag the appropriate references to the correct parameters. Each reference may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un job Lakeflow nommé **billing_daily**. Sa première tâche, **extract**, est un notebook Python qui définit la valeur de tâche **row_count**. La tâche suivante, **load**, est une tâche notebook dont les paramètres doivent être définis à l'aide de références de valeurs dynamiques.

    Quelle référence devez-vous utiliser pour chaque paramètre de load ? Pour répondre, faites glisser les références appropriées vers les paramètres correspondants. Chaque référence peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: startdate, text: "{{job.start_time.iso_date}}" }
    - { id: runid, text: "{{job.run_id}}" }
    - { id: rows, text: "{{tasks.extract.values.row_count}}" }
    - { id: execcount, text: "{{task.execution_count}}" }
    - { id: trigger, text: "{{job.trigger.type}}" }
    - { id: state, text: "{{tasks.extract.result_state}}" }
  targets:
    - id: t1
      text: { en: "run_date: the date on which the job run started", fr: "run_date : la date de démarrage de l'exécution du job" }
    - id: t2
      text: { en: "audit_run: the identifier of the job run, written to an audit table", fr: "audit_run : l'identificateur de l'exécution du job, écrit dans une table d'audit" }
    - id: t3
      text: { en: "expected_rows: the number of rows counted by extract", fr: "expected_rows : le nombre de lignes comptées par extract" }
    - id: t4
      text: { en: "attempt: the number of runs of load, including retries and repairs", fr: "attempt : le nombre d'exécutions de load, nouvelles tentatives et réparations comprises" }
answer:
  mapping: { t1: startdate, t2: runid, t3: rows, t4: execcount }
explanation:
  correct:
    en: "`{{job.start_time.iso_date}}` gives the UTC start date of the run, `{{job.run_id}}` the unique identifier of the job run, and `{{tasks.extract.values.row_count}}` the task value set by extract. `{{task.execution_count}}` counts the runs of the current task, including retries and repairs."
    fr: "`{{job.start_time.iso_date}}` donne la date de démarrage de l'exécution en UTC, `{{job.run_id}}` l'identificateur unique de l'exécution du job, et `{{tasks.extract.values.row_count}}` la valeur de tâche définie par extract. `{{task.execution_count}}` compte les exécutions de la tâche courante, nouvelles tentatives et réparations comprises."
  options:
    trigger:
      en: |
        job.trigger.type returns the kind of trigger, such as periodic or file_arrival, not a date or a count.
      fr: |
        job.trigger.type renvoie le type de déclencheur, par exemple periodic ou file_arrival, pas une date ni un nombre.
    state:
      en: |
        result_state returns the outcome of extract, such as success, not the value it computed.
      fr: |
        result_state renvoie le résultat de extract, par exemple success, pas la valeur qu'il a calculée.
references:
  - title: Dynamic value references
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/dynamic-value-references
