id: dp750-4b-switch-branch-uncommitted
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You work in your own Git folder on the branch `feature/loyalty-tiers`. You have uncommitted edits to the notebook `tiers.py` that are ready to be shared. A colleague asks you to review a fix on the branch `bugfix/null-points`, which doesn't modify `tiers.py`.

    You need to switch to `bugfix/null-points`. Your edits must not appear on `bugfix/null-points`, and they must not be lost.

    What should you do?
  fr: |
    Vous travaillez dans votre propre dossier Git sur la branche `feature/loyalty-tiers`. Vous avez des modifications non validées du notebook `tiers.py`, prêtes à être partagées. Un collègue vous demande de revoir un correctif sur la branche `bugfix/null-points`, qui ne modifie pas `tiers.py`.

    Vous devez basculer sur `bugfix/null-points`. Vos modifications ne doivent pas apparaître sur `bugfix/null-points`, et elles ne doivent pas être perdues.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Switch to bugfix/null-points; Azure Databricks stashes uncommitted changes when you switch branches.", fr: "Basculer sur bugfix/null-points ; Azure Databricks met de côté les modifications non validées lors d'un changement de branche." } }
    - { id: b, text: { en: "Commit and push the edits on feature/loyalty-tiers, and then switch to bugfix/null-points.", fr: "Valider et pousser les modifications sur feature/loyalty-tiers, puis basculer sur bugfix/null-points." } }
    - { id: c, text: { en: "Discard the edits, and then switch to bugfix/null-points.", fr: "Annuler les modifications, puis basculer sur bugfix/null-points." } }
    - { id: d, text: { en: "Pull feature/loyalty-tiers, and then switch to bugfix/null-points.", fr: "Faire un pull de feature/loyalty-tiers, puis basculer sur bugfix/null-points." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When you switch branches in a Git folder, uncommitted changes carry over to the new branch if they don't conflict with its code. Committing and pushing the edits first keeps them on feature/loyalty-tiers and in the remote repository, so they don't follow you to bugfix/null-points.
    fr: |
      Quand vous changez de branche dans un dossier Git, les modifications non validées sont reportées sur la nouvelle branche si elles n'entrent pas en conflit avec son code. Valider et pousser d'abord les modifications les conserve sur feature/loyalty-tiers et dans le dépôt distant : elles ne vous suivent pas sur bugfix/null-points.
  options:
    a: { en: "Uncommitted changes aren't stashed: because tiers.py doesn't conflict, the edits carry over to bugfix/null-points.", fr: "Les modifications non validées ne sont pas mises de côté : comme tiers.py n'entre pas en conflit, elles sont reportées sur bugfix/null-points." }
    c: { en: "Discarding the edits keeps them off bugfix/null-points, but the edits are lost.", fr: "Annuler les modifications les tient à l'écart de bugfix/null-points, mais elles sont perdues." }
    d: { en: "A pull updates the branch from the remote; the uncommitted edits still carry over when you switch.", fr: "Un pull met à jour la branche depuis le dépôt distant ; les modifications non validées sont toujours reportées au changement de branche." }
references:
  - title: Create and manage Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/git-operations-with-repos
