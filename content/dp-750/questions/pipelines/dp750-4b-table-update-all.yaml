id: dp750-4b-table-update-all
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The tables `contoso_prod.silver.orders` and `contoso_prod.silver.payments` are refreshed every night by two pipelines that other teams own. Each pipeline finishes at a different time between 01:00 and 04:30.

    A Lakeflow job named **contoso_revenue_gold** joins both tables. You need to start contoso_revenue_gold as soon as both tables have been refreshed, and not before.

    What should you configure?
  fr: |
    Les tables `contoso_prod.silver.orders` et `contoso_prod.silver.payments` sont actualisées chaque nuit par deux pipelines appartenant à d'autres équipes. Chaque pipeline se termine à une heure différente, entre 01:00 et 04:30.

    Un job Lakeflow nommé **contoso_revenue_gold** joint les deux tables. Vous devez lancer contoso_revenue_gold dès que les deux tables ont été actualisées, et pas avant.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A table update trigger on both tables, with Trigger when set to Any table is updated", fr: "Un déclencheur Table update sur les deux tables, avec Trigger when défini sur Any table is updated" } }
    - { id: b, text: { en: "A table update trigger on both tables, with Trigger when set to All tables are updated", fr: "Un déclencheur Table update sur les deux tables, avec Trigger when défini sur All tables are updated" } }
    - { id: c, text: { en: "A scheduled trigger that runs every day at 04:30", fr: "Un déclencheur Scheduled qui s'exécute tous les jours à 04:30" } }
    - { id: d, text: { en: "A file arrival trigger on the storage location of the two tables", fr: "Un déclencheur File arrival sur l'emplacement de stockage des deux tables" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A table update trigger starts the job when its monitored tables are updated. With several tables, Trigger when decides whether one update is enough (Any) or all tables must be updated (All). All tables are updated waits for both refreshes, whatever their order and time.
    fr: |
      Un déclencheur Table update lance le job quand ses tables surveillées sont mises à jour. Avec plusieurs tables, Trigger when indique si une seule mise à jour suffit (Any) ou si toutes les tables doivent être mises à jour (All). All tables are updated attend les deux actualisations, quels que soient leur ordre et leur heure.
  options:
    a: { en: "Any table is updated starts the job after the first refresh, before the other table is ready.", fr: "Any table is updated lance le job après la première actualisation, avant que l'autre table soit prête." }
    c: { en: "A fixed time can start before a late refresh, and it delays the job when both tables are ready earlier.", fr: "Une heure fixe peut précéder une actualisation tardive, et elle retarde le job quand les deux tables sont prêtes plus tôt." }
    d: { en: "A file arrival path must not contain external tables or the managed locations of catalogs and schemas.", fr: "Le chemin d'un déclencheur File arrival ne doit pas contenir de tables externes ni les emplacements managés de catalogues et de schémas." }
references:
  - title: Trigger jobs when source tables are updated
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/trigger-table-update
