id: dp750-4c-rest-github-wif
objective: "4.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank deploys a Databricks Asset Bundle with a GitHub Actions workflow that installs the CLI with `databricks/setup-cli` and runs `databricks bundle deploy`. The CLI calls the Azure Databricks REST APIs as a service principal.

    Security policy forbids storing any Databricks token or secret in GitHub, including in GitHub secrets.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank déploie un bundle de ressources Databricks avec un workflow GitHub Actions qui installe l'interface CLI avec `databricks/setup-cli` et exécute `databricks bundle deploy`. L'interface CLI appelle les API REST Azure Databricks en tant que principal de service.

    La stratégie de sécurité interdit de stocker un jeton ou un secret Databricks dans GitHub, y compris dans les secrets GitHub.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a federation policy for GitHub Actions on the service principal whose subject matches the workflow token.", fr: "Créer sur le principal de service une stratégie de fédération pour GitHub Actions dont le sujet correspond au jeton du workflow." } }
    - { id: b, text: { en: "Store an OAuth secret of the service principal in a GitHub secret named DATABRICKS_CLIENT_SECRET.", fr: "Stocker un secret OAuth du principal de service dans un secret GitHub nommé DATABRICKS_CLIENT_SECRET." } }
    - { id: c, text: { en: "Set DATABRICKS_AUTH_TYPE to github-oidc with the host and client ID, and grant the `id-token: write` permission.", fr: "Définir DATABRICKS_AUTH_TYPE sur github-oidc avec l'hôte et l'ID client, et accorder l'autorisation `id-token: write`." } }
    - { id: d, text: { en: "Store a token of the service principal in a GitHub secret and map it to DATABRICKS_TOKEN.", fr: "Stocker un jeton du principal de service dans un secret GitHub et le mapper sur DATABRICKS_TOKEN." } }
    - { id: e, text: { en: "Set DATABRICKS_BUNDLE_TARGET to prod in the workflow and remove the env block.", fr: "Définir DATABRICKS_BUNDLE_TARGET sur prod dans le workflow et supprimer le bloc env." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Workload identity federation lets GitHub Actions exchange its OIDC token for a Databricks token, so no secret is stored. The service principal needs a GitHub Actions federation policy whose subject exactly matches the token subject, and the workflow sets `DATABRICKS_AUTH_TYPE: github-oidc`, `DATABRICKS_HOST` and `DATABRICKS_CLIENT_ID`, with the `id-token: write` permission so that GitHub can issue the token."
    fr: "La fédération des identités de charge de travail permet à GitHub Actions d'échanger son jeton OIDC contre un jeton Databricks, sans stocker de secret. Le principal de service a besoin d'une stratégie de fédération GitHub Actions dont le sujet correspond exactement au sujet du jeton, et le workflow définit `DATABRICKS_AUTH_TYPE: github-oidc`, `DATABRICKS_HOST` et `DATABRICKS_CLIENT_ID`, avec l'autorisation `id-token: write` pour que GitHub puisse émettre le jeton."
  options:
    b: { en: "An OAuth secret stored in GitHub violates the policy.", fr: "Un secret OAuth stocké dans GitHub enfreint la stratégie." }
    d: { en: "A token stored as a GitHub secret violates the policy.", fr: "Un jeton stocké comme secret GitHub enfreint la stratégie." }
    e: { en: "DATABRICKS_BUNDLE_TARGET only selects the target; without authentication settings the CLI can't call the APIs.", fr: "DATABRICKS_BUNDLE_TARGET ne fait que sélectionner la cible ; sans paramètres d'authentification, l'interface CLI ne peut pas appeler les API." }
references:
  - title: GitHub Actions
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/ci-cd/github
  - title: CI/CD on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/ci-cd/
