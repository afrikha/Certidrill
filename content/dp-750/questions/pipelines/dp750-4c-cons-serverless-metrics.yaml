id: dp750-4c-cons-serverless-metrics
objective: "4.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a Lakeflow Jobs workflow named **wf_clickstream** on serverless compute for jobs. The run durations of the workflow have doubled over the last two weeks.

    You need to review the performance of the workflow's runs to find which queries take the most time.

    What should you use?
  fr: |
    Contoso exécute un workflow Lakeflow Jobs nommé **wf_clickstream** sur le calcul serverless pour les jobs. Les durées d'exécution du workflow ont doublé au cours des deux dernières semaines.

    Vous devez examiner les performances des exécutions du workflow pour trouver les requêtes qui prennent le plus de temps.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Metrics tab of the compute resource", fr: "L'onglet Metrics de la ressource de calcul" } }
    - { id: b, text: { en: "Query insights", fr: "Query insights" } }
    - { id: c, text: { en: "The Event log tab of the compute resource", fr: "L'onglet Event log de la ressource de calcul" } }
    - { id: d, text: { en: "The system.billing.usage system table", fr: "La table système system.billing.usage" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Metrics tab is available for all-purpose and jobs compute only. Serverless compute for notebooks and jobs uses query insights instead, which shows the queries run by the workload and their performance."
    fr: "L'onglet Metrics n'est disponible que pour le calcul polyvalent et le calcul de jobs. Le calcul serverless pour les notebooks et les jobs utilise à la place Query insights, qui montre les requêtes exécutées par la charge de travail et leurs performances."
  options:
    a: { en: "Compute metrics aren't available for serverless notebook and job compute.", fr: "Les métriques de calcul ne sont pas disponibles pour le calcul serverless des notebooks et des jobs." }
    c: { en: "The event log records lifecycle events of classic compute, such as creation, termination and edits, not query performance.", fr: "Le journal des événements enregistre les événements de cycle de vie du calcul classique, comme la création, l'arrêt et les modifications, pas les performances des requêtes." }
    d: { en: "The billing table shows DBUs consumed, not which queries take time.", fr: "La table de facturation montre les DBU consommées, pas les requêtes qui prennent du temps." }
references:
  - title: View compute metrics
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/cluster-metrics
