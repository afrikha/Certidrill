seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You generate the job configuration and deploy.
  fr: Vous générez la configuration du job et déployez.
body:
  solution:
    en: |
      You run the following commands from the bundle root folder.

      ```bash
      databricks bundle generate job --existing-job-id 731994 --target prod
      databricks bundle deploy --target prod
      ```
    fr: |
      Vous exécutez les commandes suivantes depuis le dossier racine du bundle.

      ```bash
      databricks bundle generate job --existing-job-id 731994 --target prod
      databricks bundle deploy --target prod
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      `bundle generate job` only writes the job configuration into the bundle files and downloads the referenced notebooks. A deployment matches workspace resources by the IDs tracked in the bundle deployment state, not by name, so this deployment creates a second nightly_sales job without the run history. You must bind the bundle resource to job 731994 before you deploy.
    fr: |
      `bundle generate job` écrit uniquement la configuration du job dans les fichiers du bundle et télécharge les notebooks référencés. Un déploiement associe les ressources de l'espace de travail par les ID suivis dans l'état de déploiement du bundle, et non par leur nom : ce déploiement crée donc un second job nightly_sales sans l'historique d'exécutions. Vous devez lier la ressource du bundle au job 731994 avant de déployer.
references:
  - title: Migrate existing resources to a bundle
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/migrate-resources
