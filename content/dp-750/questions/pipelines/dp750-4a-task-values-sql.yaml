id: dp750-4a-task-values-sql
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fourth Coffee has a Lakeflow job with two tasks. The Python notebook task **compute_cutoff** calculates a cutoff date in the variable **cutoff**. The downstream SQL task **purge_staging** runs on a SQL warehouse and must use that date in the parameter of its query.

    You need to pass the value from compute_cutoff to purge_staging.

    What should you do?
  fr: |
    Fourth Coffee dispose d'un job Lakeflow à deux tâches. La tâche notebook Python **compute_cutoff** calcule une date limite dans la variable **cutoff**. La tâche SQL en aval **purge_staging** s'exécute sur un entrepôt SQL et doit utiliser cette date dans le paramètre de sa requête.

    Vous devez transmettre la valeur de compute_cutoff à purge_staging.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In compute_cutoff, run dbutils.notebook.exit(cutoff), and set the parameter of purge_staging to {{tasks.compute_cutoff.result_state}}.", fr: "Dans compute_cutoff, exécuter dbutils.notebook.exit(cutoff), et définir le paramètre de purge_staging sur {{tasks.compute_cutoff.result_state}}." }
    - id: b
      text: { en: "In compute_cutoff, run dbutils.widgets.text(\"cutoff\", cutoff), and read the widget named cutoff in the query of purge_staging.", fr: "Dans compute_cutoff, exécuter dbutils.widgets.text(\"cutoff\", cutoff), et lire le widget nommé cutoff dans la requête de purge_staging." }
    - id: c
      text: { en: "In compute_cutoff, run spark.conf.set(\"cutoff\", cutoff), and set the parameter of purge_staging to {{job.parameters.cutoff}}.", fr: "Dans compute_cutoff, exécuter spark.conf.set(\"cutoff\", cutoff), et définir le paramètre de purge_staging sur {{job.parameters.cutoff}}." }
    - id: d
      text: { en: "In compute_cutoff, run dbutils.jobs.taskValues.set(key=\"cutoff\", value=cutoff), and set the parameter of purge_staging to {{tasks.compute_cutoff.values.cutoff}}.", fr: "Dans compute_cutoff, exécuter dbutils.jobs.taskValues.set(key=\"cutoff\", value=cutoff), et définir le paramètre de purge_staging sur {{tasks.compute_cutoff.values.cutoff}}." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Task values pass information between the tasks of a job. A Python notebook sets the value with `dbutils.jobs.taskValues.set()`, and any downstream task that supports parameters, including a SQL task, reads it through the dynamic value reference `{{tasks.<task_name>.values.<key>}}`.
    fr: |
      Les valeurs de tâche transmettent des informations entre les tâches d'un job. Un notebook Python définit la valeur avec `dbutils.jobs.taskValues.set()`, et toute tâche en aval qui prend en charge des paramètres, y compris une tâche SQL, la lit avec la référence de valeur dynamique `{{tasks.<task_name>.values.<key>}}`.
  options:
    a:
      en: |
        result_state returns the outcome of the task, such as success, not the string passed to exit().
      fr: |
        result_state renvoie le résultat de la tâche, par exemple success, pas la chaîne passée à exit().
    b:
      en: |
        A widget exists only in the notebook that defines it; another task can't read it.
      fr: |
        Un widget n'existe que dans le notebook qui le définit ; une autre tâche ne peut pas le lire.
    c:
      en: |
        A Spark configuration value stays in the notebook's session and doesn't set a job parameter; job parameters are set when the run starts.
      fr: |
        Une valeur de configuration Spark reste dans la session du notebook et ne définit pas de paramètre de job ; les paramètres de job sont définis au démarrage de l'exécution.
references:
  - title: Use task values to pass information between tasks
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/task-values
