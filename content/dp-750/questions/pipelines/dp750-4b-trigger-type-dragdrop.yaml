id: dp750-4b-trigger-type-dragdrop
objective: "4.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses four Lakeflow jobs. Each job must start automatically according to the following requirements, without paying for compute while it waits.

    Which trigger type should you configure for each job? To answer, drag the appropriate trigger types to the correct jobs. Each trigger type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise quatre jobs Lakeflow. Chaque job doit démarrer automatiquement selon les exigences suivantes, sans payer de calcul pendant l'attente.

    Quel type de déclencheur devez-vous configurer pour chaque job ? Pour répondre, faites glisser les types de déclencheurs appropriés vers les jobs correspondants. Chaque type de déclencheur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sched, text: Scheduled }
    - { id: file, text: File arrival }
    - { id: table, text: Table update }
    - { id: cont, text: Continuous }
    - { id: none, text: { en: "None (manual)", fr: "None (manuel)" } }
  targets:
    - { id: partner, text: { en: "wingtip_partner_files: a partner uploads files to a Unity Catalog volume at unpredictable times.", fr: "wingtip_partner_files : un partenaire dépose des fichiers dans un volume Unity Catalog à des heures imprévisibles." } }
    - { id: kpi, text: { en: "wingtip_kpi_refresh: must start when another team's pipeline updates wingtip_prod.gold.bookings.", fr: "wingtip_kpi_refresh : doit démarrer quand le pipeline d'une autre équipe met à jour wingtip_prod.gold.bookings." } }
    - { id: close, text: { en: "wingtip_ledger_close: must run every day at 23:00.", fr: "wingtip_ledger_close : doit s'exécuter tous les jours à 23:00." } }
    - { id: crm, text: { en: "wingtip_crm_sync: an Azure Data Factory pipeline starts it through the Jobs API after a copy activity.", fr: "wingtip_crm_sync : un pipeline Azure Data Factory le lance via l'API Jobs après une activité de copie." } }
answer:
  mapping: { partner: file, kpi: table, close: sched, crm: none }
explanation:
  correct:
    en: |
      File arrival starts a run when new files land in a volume or an external location. Table update starts a run when monitored tables are updated. Scheduled runs the job at a fixed time. A job started by an external orchestrator through the Jobs API needs no trigger: None (manual).
    fr: |
      File arrival lance une exécution quand de nouveaux fichiers arrivent dans un volume ou un emplacement externe. Table update lance une exécution quand des tables surveillées sont mises à jour. Scheduled exécute le job à heure fixe. Un job lancé par un orchestrateur externe via l'API Jobs n'a besoin d'aucun déclencheur : None (manuel).
  options:
    cont: { en: "Continuous keeps one run always active, so the job pays for compute even when there is nothing to process.", fr: "Continuous garde une exécution toujours active : le job paie du calcul même quand il n'y a rien à traiter." }
references:
  - title: Automate jobs with schedules and triggers
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/triggers
