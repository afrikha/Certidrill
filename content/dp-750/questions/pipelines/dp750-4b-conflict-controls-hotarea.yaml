id: dp750-4b-conflict-controls-hotarea
objective: "4.3.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You are merging `main` into your branch `feature/fx-rates` in a Git folder. The Git folder dialog lists two conflicting notebooks, and it offers the controls shown in the following table.

    Answer each prompt by selecting the appropriate control.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous fusionnez `main` dans votre branche `feature/fx-rates` dans un dossier Git. La boîte de dialogue du dossier Git liste deux notebooks en conflit et propose les contrôles présentés dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le contrôle approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "You edited the first notebook, kept the lines you want, and deleted the conflict markers. Which control do you select for that notebook?", fr: "Vous avez modifié le premier notebook, conservé les lignes voulues et supprimé les marqueurs de conflit. Quel contrôle sélectionnez-vous pour ce notebook ?" }
    - id: p2
      text: { en: "You decide to cancel the merge and return the Git folder to its state before the merge. Which control do you select?", fr: "Vous décidez d'annuler la fusion et de ramener le dossier Git à son état antérieur à la fusion. Quel contrôle sélectionnez-vous ?" }
  grid:
    header: [{ en: "Control", fr: "Contrôle" }]
    rows:
      - [{ text: Keep all current changes, area: keep }]
      - [{ text: Take all incoming changes, area: take }]
      - [{ text: Mark As Resolved, area: resolved }]
      - [{ text: Continue Merge, area: continue }]
      - [{ text: Abort, area: abort }]
answer:
  values: { p1: resolved, p2: abort }
explanation:
  correct:
    en: |
      After you resolve a conflict by hand, keeping the lines you want and deleting the markers, you select Mark As Resolved for that file. Abort cancels the operation and undoes everything it changed. Continue Merge is selected only once all conflicts are resolved, and the Keep all and Take all controls replace your manual edits with one side.
    fr: |
      Après avoir résolu un conflit à la main, en conservant les lignes voulues et en supprimant les marqueurs, vous sélectionnez Mark As Resolved pour ce fichier. Abort annule l'opération et défait tout ce qu'elle a modifié. Continue Merge ne se sélectionne qu'une fois tous les conflits résolus, et les contrôles Keep all et Take all remplacent vos modifications manuelles par l'un des deux côtés.
references:
  - title: Create and manage Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/git-operations-with-repos
