id: dp750-4d-diag-portal-location
objective: "4.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has an Azure Databricks workspace named **adb-tailspin-prod** on the Premium plan and a Log Analytics workspace named **law-tailspin-ops**. You have the Contributor role on both resources.

    You need to stream the audit events of the jobs and clusters services of adb-tailspin-prod to law-tailspin-ops.

    Where should you configure the solution?
  fr: |
    Tailspin dispose d'un espace de travail Azure Databricks nommé **adb-tailspin-prod** sur le plan Premium et d'un espace de travail Log Analytics nommé **law-tailspin-ops**. Vous avez le rôle Contributor sur les deux ressources.

    Vous devez diffuser en continu les événements d'audit des services jobs et clusters d'adb-tailspin-prod vers law-tailspin-ops.

    Où devez-vous configurer la solution ?
body:
  options:
    - { id: a, text: { en: "In the Azure portal, on the Diagnostic settings page of the adb-tailspin-prod resource", fr: "Dans le portail Azure, sur la page Diagnostic settings de la ressource adb-tailspin-prod" } }
    - { id: b, text: { en: "In the Azure portal, on the Agents page of the law-tailspin-ops workspace", fr: "Dans le portail Azure, sur la page Agents de l'espace de travail law-tailspin-ops" } }
    - { id: c, text: { en: "In the Azure Databricks workspace, in the advanced workspace settings for verbose audit logs", fr: "Dans l'espace de travail Azure Databricks, dans les paramètres avancés de l'espace de travail pour les journaux d'audit détaillés" } }
    - { id: d, text: { en: "In the Azure portal, in a data collection rule that targets the cluster virtual machines", fr: "Dans le portail Azure, dans une règle de collecte de données qui cible les machines virtuelles des clusters" } }
answer: { optionId: a }
explanation:
  correct:
    en: Diagnostic log delivery is an Azure diagnostic setting on the Azure Databricks service resource. In its Monitoring section, you open Diagnostic settings, select Turn on diagnostics, enter a name, choose Send to Log Analytics with the workspace, and select the services (jobs, clusters) whose logs you want.
    fr: La livraison des journaux de diagnostic est un paramètre de diagnostic Azure défini sur la ressource du service Azure Databricks. Dans sa section Monitoring, vous ouvrez Diagnostic settings, sélectionnez Turn on diagnostics, saisissez un nom, choisissez Send to Log Analytics avec l'espace de travail, puis sélectionnez les services (jobs, clusters) dont vous voulez les journaux.
  options:
    b:
      en: The Agents page is about connecting machines to the workspace with agents; it does not configure Azure Databricks audit logs.
      fr: La page Agents concerne la connexion de machines à l'espace de travail avec des agents ; elle ne configure pas les journaux d'audit Azure Databricks.
    c:
      en: Verbose audit logs add extra events, such as notebook commands, to the audit logs; they do not choose a destination.
      fr: Les journaux d'audit détaillés ajoutent des événements supplémentaires, comme les commandes de notebook, aux journaux d'audit ; ils ne choisissent pas de destination.
    d:
      en: Audit events of the jobs and clusters services come from the Azure Databricks control plane, not from agents on the cluster virtual machines.
      fr: Les événements d'audit des services jobs et clusters proviennent du plan de contrôle Azure Databricks, pas d'agents installés sur les machines virtuelles des clusters.
references:
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
