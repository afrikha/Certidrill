id: dp750-4c-jobs-repair-steps
objective: "4.4.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a Lakeflow Jobs job named **flights_daily** with five tasks. This morning's run failed. You don't know yet which task failed or why.

    You need to find and fix the cause, and then complete the run without rerunning the tasks that already succeeded.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin dispose d'un job Lakeflow Jobs nommé **flights_daily** avec cinq tâches. L'exécution de ce matin a échoué. Vous ne savez pas encore quelle tâche a échoué ni pourquoi.

    Vous devez trouver et corriger la cause, puis terminer l'exécution sans réexécuter les tâches qui ont déjà réussi.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: matrix, text: { en: "In the Runs tab of the job, select the red cell of the failed task in the matrix view to read its error.", fr: "Dans l'onglet Runs du job, sélectionner la cellule rouge de la tâche en échec dans la vue matricielle pour lire son erreur." } }
    - { id: edit, text: { en: "Select Edit task, correct the configuration, and select Save task.", fr: "Sélectionner Edit task, corriger la configuration, puis sélectionner Save task." } }
    - { id: open, text: { en: "Open the failed run and select Repair run.", fr: "Ouvrir l'exécution en échec et sélectionner Repair run." } }
    - { id: confirm, text: { en: "Review the tasks and parameters in the Repair job run dialog, and then select Repair run.", fr: "Vérifier les tâches et les paramètres dans la boîte de dialogue Repair job run, puis sélectionner Repair run." } }
    - { id: runnow, text: { en: "Select Run now on the job.", fr: "Sélectionner Run now sur le job." } }
    - { id: restart, text: { en: "Select Restart run on the job.", fr: "Sélectionner Restart run sur le job." } }
    - { id: delete, text: { en: "Delete the failed run from the Runs tab.", fr: "Supprimer l'exécution en échec depuis l'onglet Runs." } }
answer:
  sequence: [ matrix, edit, open, confirm ]
explanation:
  correct:
    en: "The matrix view of the Runs tab shows each task's status across runs; selecting a failed task shows its output and error. You fix the task with Edit task, because a repair runs with the current settings. Then you open the failed run, select Repair run, check the unsuccessful and dependent tasks listed in the dialog, and confirm."
    fr: "La vue matricielle de l'onglet Runs montre l'état de chaque tâche au fil des exécutions ; sélectionner une tâche en échec affiche sa sortie et son erreur. Vous corrigez la tâche avec Edit task, car une réparation utilise les paramètres actuels. Vous ouvrez ensuite l'exécution en échec, sélectionnez Repair run, vérifiez les tâches non réussies et dépendantes listées dans la boîte de dialogue, puis confirmez."
  options:
    runnow: { en: "Run now starts a new run of all the tasks, including those that already succeeded.", fr: "Run now démarre une nouvelle exécution de toutes les tâches, y compris celles qui ont déjà réussi." }
    restart: { en: "Restart run applies to continuous jobs.", fr: "Restart run s'applique aux jobs continus." }
    delete: { en: "Deleting the run removes the run that you need to repair.", fr: "Supprimer l'exécution retire l'exécution que vous devez réparer." }
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
