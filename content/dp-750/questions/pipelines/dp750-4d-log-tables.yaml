id: dp750-4d-log-tables
objective: "4.4.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A diagnostic setting streams all the log categories of the Azure Databricks workspace **adb-fabrikam-prod** to the Log Analytics workspace **law-fabrikam-sec**. The security team asks you for several investigations.

    Which table should you query for each investigation? To answer, drag the appropriate tables to the correct investigations. Each table may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un paramètre de diagnostic diffuse en continu toutes les catégories de journaux de l'espace de travail Azure Databricks **adb-fabrikam-prod** vers l'espace de travail Log Analytics **law-fabrikam-sec**. L'équipe sécurité vous demande plusieurs analyses.

    Quelle table devez-vous interroger pour chaque analyse ? Pour répondre, faites glisser les tables appropriées vers les analyses correspondantes. Chaque table peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: jobs, text: DatabricksJobs }
    - { id: clusters, text: DatabricksClusters }
    - { id: secrets, text: DatabricksSecrets }
    - { id: uc, text: DatabricksUnityCatalog }
    - { id: notebook, text: DatabricksNotebook }
    - { id: workspace, text: DatabricksWorkspace }
  targets:
    - id: t1
      text: { en: "Find who permanently deleted an all-purpose cluster", fr: "Trouver qui a supprimé définitivement un cluster universel" }
    - id: t2
      text: { en: "Find which users read a value from a secret scope", fr: "Trouver quels utilisateurs ont lu une valeur dans une étendue de secrets" }
    - id: t3
      text: { en: "Find who changed the grants on a Unity Catalog table", fr: "Trouver qui a modifié les autorisations d'une table Unity Catalog" }
    - id: t4
      text: { en: "List the job runs that failed during the night", fr: "Lister les exécutions de jobs qui ont échoué pendant la nuit" }
answer:
  mapping: { t1: clusters, t2: secrets, t3: uc, t4: jobs }
explanation:
  correct:
    en: Each diagnostic log category lands in its own table. Cluster events (create, delete, permanentDelete, resize...) are in DatabricksClusters, secret access in DatabricksSecrets, Unity Catalog events such as permission changes in DatabricksUnityCatalog, and job run events such as runFailed in DatabricksJobs. DatabricksNotebook and DatabricksWorkspace cover notebook and workspace events.
    fr: Chaque catégorie de journaux de diagnostic arrive dans sa propre table. Les événements de cluster (create, delete, permanentDelete, resize...) sont dans DatabricksClusters, l'accès aux secrets dans DatabricksSecrets, les événements Unity Catalog comme les modifications d'autorisations dans DatabricksUnityCatalog, et les événements d'exécution de jobs comme runFailed dans DatabricksJobs. DatabricksNotebook et DatabricksWorkspace couvrent les événements des notebooks et de l'espace de travail.
references:
  - title: Supported log categories - Microsoft.Databricks/workspaces
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-logs/microsoft-databricks-workspaces-logs
