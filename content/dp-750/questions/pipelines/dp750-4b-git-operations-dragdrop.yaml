id: dp750-4b-git-operations-dragdrop
objective: "4.3.2"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    You work in a Git folder on the branch `feature/vat-rules`, which other engineers also push to. You need to perform four Git operations from the Git folder dialog, as described in the following requirements.

    Which operation should you use for each requirement? To answer, drag the appropriate operations to the correct requirements. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous travaillez dans un dossier Git sur la branche `feature/vat-rules`, sur laquelle d'autres ingénieurs poussent aussi. Vous devez effectuer quatre opérations Git depuis la boîte de dialogue du dossier Git, comme décrit dans les exigences suivantes.

    Quelle opération devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les opérations appropriées vers les exigences correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pull, text: Pull }
    - { id: merge, text: Merge }
    - { id: rebase, text: Rebase }
    - { id: reset, text: Reset }
    - { id: push, text: Commit & Push }
  targets:
    - { id: latest, text: { en: "Bring the commits that colleagues pushed to the remote feature/vat-rules into your Git folder.", fr: "Rapporter dans votre dossier Git les commits que vos collègues ont poussés sur feature/vat-rules distante." } }
    - { id: integrate, text: { en: "Integrate the latest commits of main into feature/vat-rules without rewriting its history.", fr: "Intégrer les derniers commits de main dans feature/vat-rules sans réécrire son historique." } }
    - { id: linear, text: { en: "Replay the commits of feature/vat-rules on top of main to get a linear history, accepting a force push.", fr: "Rejouer les commits de feature/vat-rules par-dessus main pour obtenir un historique linéaire, en acceptant un envoi forcé." } }
    - { id: replace, text: { en: "Make feature/vat-rules identical to main, discarding its own commits locally and remotely.", fr: "Rendre feature/vat-rules identique à main, en abandonnant ses propres commits en local et à distance." } }
answer:
  mapping: { latest: pull, integrate: merge, linear: rebase, replace: reset }
explanation:
  correct:
    en: |
      Pull updates the files of the Git folder to the latest version of the remote branch. Merge integrates another branch and keeps the history, and Databricks recommends it over rebase for Git beginners. Rebase replays your commits on the target branch and runs `git push --force`, which rewrites history for collaborators. Reset is equivalent to `git reset --hard` followed by `git push --force`: it replaces the branch's content and history and discards its commits.
    fr: |
      Pull met à jour les fichiers du dossier Git avec la dernière version de la branche distante. Merge intègre une autre branche en conservant l'historique, et Databricks le recommande plutôt que le rebase aux débutants en Git. Rebase rejoue vos commits sur la branche cible et exécute `git push --force`, ce qui réécrit l'historique pour les collaborateurs. Reset équivaut à `git reset --hard` suivi de `git push --force` : il remplace le contenu et l'historique de la branche et abandonne ses commits.
  options:
    push: { en: "Commit & Push sends your local changes to the remote; it doesn't bring in other commits or replace the branch.", fr: "Commit & Push envoie vos modifications locales vers le dépôt distant ; il ne rapporte pas d'autres commits et ne remplace pas la branche." }
references:
  - title: Create and manage Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/git-operations-with-repos
