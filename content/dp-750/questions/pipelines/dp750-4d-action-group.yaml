id: dp750-4d-action-group
objective: "4.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso streams the diagnostic logs of three Azure Databricks workspaces to a Log Analytics workspace and plans several log search alert rules on the DatabricksJobs and DatabricksClusters tables.

    Each rule must notify the on-call engineers by SMS and email. You need to define the recipients once and reuse them in every rule.

    What should you create?
  fr: |
    Contoso diffuse en continu les journaux de diagnostic de trois espaces de travail Azure Databricks vers un espace de travail Log Analytics et prévoit plusieurs règles d'alerte de recherche dans les journaux sur les tables DatabricksJobs et DatabricksClusters.

    Chaque règle doit avertir les ingénieurs d'astreinte par SMS et par e-mail. Vous devez définir les destinataires une seule fois et les réutiliser dans toutes les règles.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An alert processing rule", fr: "Une règle de traitement des alertes" } }
    - { id: b, text: { en: "A notification destination in Azure Databricks", fr: "Une destination de notification dans Azure Databricks" } }
    - { id: c, text: { en: "An action group", fr: "Un groupe d'actions" } }
    - { id: d, text: { en: "A diagnostic setting", fr: "Un paramètre de diagnostic" } }
answer: { optionId: c }
explanation:
  correct:
    en: An action group holds the notifications (email, SMS, voice, Azure app push) and actions to run when an alert fires. Multiple alert rules can use the same action group, so the recipients are defined once.
    fr: "Un groupe d'actions contient les notifications (e-mail, SMS, appel vocal, notification push de l'application Azure) et les actions à exécuter quand une alerte se déclenche. Plusieurs règles d'alerte peuvent utiliser le même groupe d'actions : les destinataires sont définis une seule fois."
  options:
    a:
      en: An alert processing rule adds or suppresses action groups on fired alerts; it does not define the recipients.
      fr: Une règle de traitement des alertes ajoute ou supprime des groupes d'actions sur les alertes déclenchées ; elle ne définit pas les destinataires.
    b:
      en: Notification destinations are used by Lakeflow Jobs and Databricks SQL alerts, not by Azure Monitor alert rules.
      fr: Les destinations de notification sont utilisées par Lakeflow Jobs et les alertes Databricks SQL, pas par les règles d'alerte Azure Monitor.
    d:
      en: A diagnostic setting routes resource logs to a destination; it does not notify anyone.
      fr: Un paramètre de diagnostic achemine les journaux de ressource vers une destination ; il n'avertit personne.
references:
  - title: Create and manage action groups in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
