id: dp750-4a-foreach-tables
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Lakeflow job named **ingest_erp**. Its Python notebook task **list_tables** reads a control table and sets the task value **tables**, a JSON array of table names. The list changes every day and contains about 40 names.

    For each name in the list, the notebook **/Workspace/etl/load_table** must run with its **table_name** parameter set to that name. No more than five loads may run at the same time.

    The solution must minimize administrative effort when the list changes.

    What should you add to the job?
  fr: |
    Litware dispose d'un job Lakeflow nommé **ingest_erp**. Sa tâche notebook Python **list_tables** lit une table de contrôle et définit la valeur de tâche **tables**, un tableau JSON de noms de tables. La liste change chaque jour et contient environ 40 noms.

    Pour chaque nom de la liste, le notebook **/Workspace/etl/load_table** doit s'exécuter avec son paramètre **table_name** défini sur ce nom. Pas plus de cinq chargements ne doivent s'exécuter en même temps.

    La solution doit réduire au minimum l'effort d'administration lorsque la liste change.

    Que devez-vous ajouter au job ?
body:
  options:
    - id: a
      text: { en: "A For each task with Inputs {{tasks.list_tables.values.tables}}, Concurrency 5, and a nested Notebook task with table_name set to {{input}}", fr: "Une tâche For each avec Inputs {{tasks.list_tables.values.tables}}, Concurrency 5 et une tâche Notebook imbriquée dont table_name vaut {{input}}" }
    - id: b
      text: { en: "A For each task with Inputs {{tasks.list_tables.values.tables}}, Concurrency 5, and a nested For each task that runs load_table", fr: "Une tâche For each avec Inputs {{tasks.list_tables.values.tables}}, Concurrency 5 et une tâche For each imbriquée qui exécute load_table" }
    - id: c
      text: { en: "40 Notebook tasks that depend on list_tables, each with a fixed table_name, and the job's maximum concurrent runs set to 5", fr: "40 tâches Notebook qui dépendent de list_tables, chacune avec un table_name fixe, et le nombre maximal d'exécutions simultanées du job défini sur 5" }
    - id: d
      text: { en: "A Run Job task that calls ingest_erp again for each table, with table_name passed as a job parameter", fr: "Une tâche Run Job qui rappelle ingest_erp pour chaque table, avec table_name transmis comme paramètre de job" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A For each task runs its nested task once per element of its input array, which can be a task value reference. Concurrency sets how many iterations run at the same time, and the nested task reads the current element with `{{input}}`. The list can change without any change to the job.
    fr: |
      Une tâche For each exécute sa tâche imbriquée une fois par élément de son tableau d'entrée, qui peut être une référence à une valeur de tâche. Concurrency définit le nombre d'itérations exécutées en même temps, et la tâche imbriquée lit l'élément courant avec `{{input}}`. La liste peut changer sans aucune modification du job.
  options:
    b:
      en: |
        The nested task of a For each task can't be another For each task.
      fr: |
        La tâche imbriquée d'une tâche For each ne peut pas être une autre tâche For each.
    c:
      en: |
        Fixed tasks must be edited whenever the list changes, and maximum concurrent runs limits whole job runs, not tasks inside a run.
      fr: |
        Des tâches fixes doivent être modifiées chaque fois que la liste change, et le nombre maximal d'exécutions simultanées limite les exécutions du job entier, pas les tâches d'une exécution.
    d:
      en: |
        A Run Job task runs a job once; it doesn't loop over a list, and a job that triggers itself is a circular dependency, which isn't supported.
      fr: |
        Une tâche Run Job exécute un job une seule fois ; elle ne parcourt pas une liste, et un job qui se déclenche lui-même constitue une dépendance circulaire, non prise en charge.
references:
  - title: Use a For each task to run another task in a loop
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/for-each
