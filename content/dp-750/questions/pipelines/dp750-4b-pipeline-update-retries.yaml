id: dp750-4b-pipeline-update-retries
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow job runs a triggered Lakeflow Spark Declarative Pipeline named **fabrikam_iot_sdp** every hour. When a retryable failure occurs, the runtime retries the whole update several times, and a stuck update delays the next hourly update.

    You need to limit the retries of the whole update to two after a retryable failure, without changing the retries of individual flows.

    What should you configure?
  fr: |
    Un job Lakeflow exécute toutes les heures un pipeline déclaratif Lakeflow Spark déclenché nommé **fabrikam_iot_sdp**. En cas d'échec réessayable, le runtime relance plusieurs fois la mise à jour entière, et une mise à jour bloquée retarde la mise à jour horaire suivante.

    Vous devez limiter à deux les nouvelles tentatives de la mise à jour entière après un échec réessayable, sans modifier les nouvelles tentatives des flux individuels.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Set pipelines.maxFlowRetryAttempts to 2 in the pipeline configuration.", fr: "Définir pipelines.maxFlowRetryAttempts sur 2 dans la configuration du pipeline." } }
    - { id: b, text: { en: "Set max_retries to 2 on the pipeline task of the job.", fr: "Définir max_retries sur 2 dans la tâche de pipeline du job." } }
    - { id: c, text: { en: "Set pipelines.numUpdateRetryAttempts to 2 in the pipeline configuration.", fr: "Définir pipelines.numUpdateRetryAttempts sur 2 dans la configuration du pipeline." } }
    - { id: d, text: { en: "Switch the pipeline to continuous mode.", fr: "Passer le pipeline en mode continu." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `pipelines.numUpdateRetryAttempts` is the maximum number of times the runtime retries an update, as a full update, after a retryable failure; it defaults to five for triggered pipelines. It applies to updates that use automatic retry and restart, such as updates started from a job.
    fr: |
      `pipelines.numUpdateRetryAttempts` est le nombre maximal de fois où le runtime relance une mise à jour, en tant que mise à jour complète, après un échec réessayable ; il vaut cinq par défaut pour les pipelines déclenchés. Il s'applique aux mises à jour qui utilisent la relance et le redémarrage automatiques, comme celles lancées depuis un job.
  options:
    a: { en: "pipelines.maxFlowRetryAttempts bounds the retries of a single flow, which must not change.", fr: "pipelines.maxFlowRetryAttempts limite les nouvelles tentatives d'un seul flux, qui ne doivent pas changer." }
    b: { en: "A task retry policy reruns the job task after it fails; it doesn't limit the retries the pipeline runtime performs inside an update.", fr: "Une stratégie de nouvelles tentatives de tâche relance la tâche du job après son échec ; elle ne limite pas les tentatives que le runtime du pipeline effectue au sein d'une mise à jour." }
    d: { en: "Continuous pipelines retry updates without limit by default, which is the opposite of the requirement.", fr: "Les pipelines continus relancent les mises à jour sans limite par défaut, ce qui va à l'encontre de l'exigence." }
references:
  - title: Pipeline properties reference
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/properties
