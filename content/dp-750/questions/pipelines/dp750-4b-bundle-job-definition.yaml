id: dp750-4b-bundle-job-definition
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The notebooks of the Lakeflow job **contoso_orders_daily** are stored in a GitHub repository and edited through Git folders. Changes to the job itself, such as new tasks, schedule changes and compute settings, are made by hand in the Jobs UI and aren't tracked.

    You need the job definition to be versioned in the same repository as the code and reviewed in pull requests. The solution must follow Databricks recommendations.

    What should you do?
  fr: |
    Les notebooks du job Lakeflow **contoso_orders_daily** sont stockés dans un dépôt GitHub et modifiés au moyen de dossiers Git. Les modifications du job lui-même, comme de nouvelles tâches, des changements de planification ou de paramètres de calcul, sont faites à la main dans l'interface Jobs et ne sont pas suivies.

    La définition du job doit être versionnée dans le même dépôt que le code et revue dans des pull requests. La solution doit suivre les recommandations de Databricks.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Define the job as a resource of a bundle (Declarative Automation Bundles, formerly Databricks Asset Bundles) in the repository.", fr: "Définir le job comme ressource d'un bundle (Declarative Automation Bundles, anciennement bundles de ressources Databricks) dans le dépôt." } }
    - { id: b, text: { en: "Save the notebooks in IPYNB format so that their outputs are committed.", fr: "Enregistrer les notebooks au format IPYNB pour que leurs sorties soient validées." } }
    - { id: c, text: { en: "Configure the Git source of the job so that its tasks read the notebooks from the repository.", fr: "Configurer la source Git du job pour que ses tâches lisent les notebooks dans le dépôt." } }
    - { id: d, text: { en: "Clone the repository into a production Git folder that only automation updates.", fr: "Cloner le dépôt dans un dossier Git de production que seule l'automatisation met à jour." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Git folders version files such as notebooks and code, not the configuration of jobs and pipelines. Databricks recommends bundles to define resources such as jobs and pipelines in source files next to the code, so that every change to tasks, schedules or compute goes through the same commits and pull requests.
    fr: |
      Les dossiers Git versionnent des fichiers comme les notebooks et le code, pas la configuration des jobs et des pipelines. Databricks recommande les bundles pour définir des ressources comme les jobs et les pipelines dans des fichiers source à côté du code : chaque modification des tâches, des planifications ou du calcul passe alors par les mêmes commits et pull requests.
  options:
    b: { en: "The IPYNB format versions notebook outputs, not the job definition.", fr: "Le format IPYNB versionne les sorties des notebooks, pas la définition du job." }
    c: { en: "A Git source tells the tasks where to read their code; the job settings still live only in the workspace.", fr: "Une source Git indique aux tâches où lire leur code ; les paramètres du job restent uniquement dans l'espace de travail." }
    d: { en: "A production Git folder deploys code to the workspace, but the job definition is still edited by hand.", fr: "Un dossier Git de production déploie du code dans l'espace de travail, mais la définition du job reste modifiée à la main." }
references:
  - title: CI/CD with Databricks Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/ci-cd
