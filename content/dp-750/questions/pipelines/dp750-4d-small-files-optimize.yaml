id: dp750-4d-small-files-optimize
objective: "4.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A streaming job appends a micro-batch to the Delta table **contoso.iot.bronze_telemetry** every minute. The table now contains more than 150,000 small data files, and queries that scan it are slow. Predictive optimization is disabled for the **contoso** catalog.

    You need to improve the read performance of the table without changing the query results.

    Which command should you run?
  fr: |
    Un job de streaming ajoute un micro-lot à la table Delta **contoso.iot.bronze_telemetry** chaque minute. La table contient désormais plus de 150 000 petits fichiers de données, et les requêtes qui l'analysent sont lentes. L'optimisation prédictive est désactivée pour le catalogue **contoso**.

    Vous devez améliorer les performances de lecture de la table sans modifier les résultats des requêtes.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "VACUUM contoso.iot.bronze_telemetry" }
    - { id: b, text: "ANALYZE TABLE contoso.iot.bronze_telemetry COMPUTE STATISTICS" }
    - { id: c, text: "REFRESH TABLE contoso.iot.bronze_telemetry" }
    - { id: d, text: "OPTIMIZE contoso.iot.bronze_telemetry" }
answer: { optionId: d }
explanation:
  correct:
    en: OPTIMIZE rewrites the many small data files into fewer, larger files (bin-packing), so scans open far fewer files. Readers use snapshot isolation and get the same results before and after, because no data changes. With predictive optimization disabled, nothing runs OPTIMIZE for you.
    fr: "OPTIMIZE réécrit les nombreux petits fichiers de données en fichiers moins nombreux et plus grands (bin-packing) : les analyses ouvrent beaucoup moins de fichiers. Les lecteurs utilisent l'isolation de capture instantanée et obtiennent les mêmes résultats avant et après, car aucune donnée ne change. L'optimisation prédictive étant désactivée, rien n'exécute OPTIMIZE à votre place."
  options:
    a:
      en: VACUUM deletes data files the table no longer references; it does not compact the files the current version uses.
      fr: VACUUM supprime les fichiers de données que la table ne référence plus ; il ne compacte pas les fichiers utilisés par la version actuelle.
    b:
      en: ANALYZE TABLE collects statistics for the query optimizer; it does not reduce the number of files to read.
      fr: ANALYZE TABLE collecte des statistiques pour l'optimiseur de requêtes ; il ne réduit pas le nombre de fichiers à lire.
    c:
      en: REFRESH TABLE invalidates cached metadata and data of the table; it does not rewrite files.
      fr: REFRESH TABLE invalide les métadonnées et les données en cache de la table ; il ne réécrit aucun fichier.
references:
  - title: Optimize data file layout
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/optimize
