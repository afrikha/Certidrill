id: dp750-4b-conflict-markers
objective: "4.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    In your Git folder, you are merging `main` into your branch `feature/refunds`. The notebook `clean_payments.py` contains the following conflict:

    ```text
    <<<<<<< HEAD
    valid = df.filter("amount > 0")
    =======
    valid = df.filter("amount > 0 AND currency IS NOT NULL")
    >>>>>>> main
    ```

    After a review, the team decides to keep the version from `main` for this file and for the other conflicting file.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans votre dossier Git, vous fusionnez `main` dans votre branche `feature/refunds`. Le notebook `clean_payments.py` contient le conflit suivant :

    ```text
    <<<<<<< HEAD
    valid = df.filter("amount > 0")
    =======
    valid = df.filter("amount > 0 AND currency IS NOT NULL")
    >>>>>>> main
    ```

    Après revue, l'équipe décide de conserver la version de `main` pour ce fichier et pour l'autre fichier en conflit.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The line between `<<<<<<< HEAD` and `=======` comes from [[src]].

      To keep the main version of the conflicting files in one action, select [[bulk]].

      When no conflict remains, select [[finish]] to complete the operation.
    fr: |
      La ligne située entre `<<<<<<< HEAD` et `=======` provient de [[src]].

      Pour conserver en une seule action la version de main des fichiers en conflit, sélectionnez [[bulk]].

      Quand il ne reste aucun conflit, sélectionnez [[finish]] pour terminer l'opération.
  slots:
    - id: src
      options:
        - { id: current, text: { en: "the current branch, feature/refunds", fr: "la branche actuelle, feature/refunds" } }
        - { id: incoming, text: { en: "the incoming branch, main", fr: "la branche entrante, main" } }
        - { id: ancestor, text: { en: "the common ancestor of both branches", fr: "l'ancêtre commun des deux branches" } }
    - id: bulk
      options:
        - { id: keep, text: Keep all current changes }
        - { id: take, text: Take all incoming changes }
        - { id: abort, text: Abort }
    - id: finish
      options:
        - { id: push, text: Commit & Push }
        - { id: pull, text: Pull }
        - { id: continue, text: Continue Merge }
answer:
  values: { src: current, bulk: take, finish: continue }
explanation:
  correct:
    en: |
      In a merge, the section between `<<<<<<< HEAD` and `=======` holds your current changes, and the section after `=======` holds the incoming changes, here from main. Take all incoming changes resolves the conflicts with the incoming version in one action. After all conflicts are resolved, Continue Merge completes the merge.
    fr: |
      Lors d'une fusion, la partie située entre `<<<<<<< HEAD` et `=======` contient vos modifications actuelles, et celle qui suit `=======` contient les modifications entrantes, ici de main. Take all incoming changes résout les conflits avec la version entrante en une seule action. Une fois tous les conflits résolus, Continue Merge termine la fusion.
  options:
    incoming: { en: "The incoming version from main is the section after =======.", fr: "La version entrante de main est la partie qui suit =======." }
    ancestor: { en: "The conflict markers show the two sides of the conflict, not the common ancestor.", fr: "Les marqueurs de conflit montrent les deux côtés du conflit, pas l'ancêtre commun." }
    keep: { en: "Keep all current changes would keep the feature/refunds version.", fr: "Keep all current changes conserverait la version de feature/refunds." }
    abort: { en: "Abort cancels the merge instead of resolving it.", fr: "Abort annule la fusion au lieu de la résoudre." }
    push: { en: "Commit & Push isn't how you finish a merge that is in progress; Continue Merge completes it.", fr: "Commit & Push ne termine pas une fusion en cours ; c'est Continue Merge qui la termine." }
    pull: { en: "A pull fetches remote changes; it doesn't complete the merge.", fr: "Un pull récupère les modifications distantes ; il ne termine pas la fusion." }
references:
  - title: Create and manage Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/git-operations-with-repos
