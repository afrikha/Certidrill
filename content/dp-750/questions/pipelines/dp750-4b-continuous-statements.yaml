id: dp750-4b-continuous-statements
objective: "4.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow job named **litware_telemetry_stream** has a continuous trigger with **Task retry mode** set to **On failure**. The job contains a single Structured Streaming task.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un job Lakeflow nommé **litware_telemetry_stream** possède un déclencheur Continuous avec **Task retry mode** défini sur **On failure**. Le job contient une seule tâche Structured Streaming.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add a retry policy with five retries and a 10-minute interval to the task.
        fr: Vous pouvez ajouter à la tâche une stratégie de cinq nouvelles tentatives avec un intervalle de 10 minutes.
    - id: s2
      text:
        en: When the task fails, it is retried with increasing delays up to three times before the run is canceled and a new run starts.
        fr: Quand la tâche échoue, elle est relancée avec des délais croissants jusqu'à trois fois avant que l'exécution soit annulée et qu'une nouvelle exécution démarre.
    - id: s3
      text:
        en: After repeated consecutive failures, the job keeps restarting with an increasing retry period, with no limit on the number of retries.
        fr: Après des échecs consécutifs répétés, le job continue de redémarrer avec une période croissante entre les tentatives, sans limite de nombre de tentatives.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Retry policies can't be used with a continuous job. With Task retry mode set to On failure, a failed task is retried with exponentially increasing delays, up to three retries for a single-task job; then the run is canceled and a new run is triggered. After repeated failures, the whole job restarts with a retry period that grows up to a system maximum, and there is no limit on retries.
    fr: |
      Les stratégies de nouvelles tentatives ne sont pas utilisables avec un job continu. Avec Task retry mode défini sur On failure, une tâche en échec est relancée avec des délais à croissance exponentielle, jusqu'à trois tentatives pour un job à tâche unique ; l'exécution est ensuite annulée et une nouvelle exécution est déclenchée. Après des échecs répétés, le job entier redémarre avec une période qui augmente jusqu'à un maximum fixé par le système, et le nombre de tentatives n'est pas limité.
references:
  - title: Run jobs continuously
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/continuous
