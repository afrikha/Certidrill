id: dp750-4c-rest-endpoints
objective: "4.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware's release automation calls the Azure Databricks Jobs API 2.2 directly, as a service principal, to operate the jobs deployed by its Databricks Asset Bundle.

    Which endpoint should the automation call for each requirement? To answer, drag the appropriate endpoints to the correct requirements. Each endpoint may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'automatisation de mise en production de Proseware appelle directement l'API Jobs 2.2 d'Azure Databricks, en tant que principal de service, pour exploiter les jobs déployés par son bundle de ressources Databricks.

    Quel point de terminaison l'automatisation doit-elle appeler pour chaque exigence ? Pour répondre, faites glisser les points de terminaison appropriés vers les exigences correspondantes. Chaque point de terminaison peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: runnow, text: "POST /api/2.2/jobs/run-now" }
    - { id: update, text: "POST /api/2.2/jobs/update" }
    - { id: repair, text: "POST /api/2.2/jobs/runs/repair" }
    - { id: cancelall, text: "POST /api/2.2/jobs/runs/cancel-all" }
    - { id: reset, text: "POST /api/2.2/jobs/reset" }
    - { id: submit, text: "POST /api/2.2/jobs/runs/submit" }
  targets:
    - { id: t1, text: { en: "Start a run of a deployed job after the deployment step", fr: "Démarrer une exécution d'un job déployé après l'étape de déploiement" } }
    - { id: t2, text: { en: "Change only the timeout of an existing job and keep all its other settings", fr: "Modifier uniquement le délai d'expiration d'un job existant et conserver tous ses autres paramètres" } }
    - { id: t3, text: { en: "Rerun the failed tasks of last night's run and the tasks that depend on them", fr: "Réexécuter les tâches en échec de l'exécution de la nuit dernière et les tâches qui en dépendent" } }
    - { id: t4, text: { en: "Stop every active run of a job before a maintenance window", fr: "Arrêter toutes les exécutions actives d'un job avant une fenêtre de maintenance" } }
answer:
  mapping: { t1: runnow, t2: update, t3: repair, t4: cancelall }
explanation:
  correct:
    en: "`jobs/run-now` triggers a run of an existing job and returns its run ID. `jobs/update` partially updates a job's settings, whereas `jobs/reset` would overwrite all of them. `jobs/runs/repair` reruns selected tasks of an existing run, such as the failed ones. `jobs/runs/cancel-all` cancels all active runs of a job."
    fr: "`jobs/run-now` déclenche une exécution d'un job existant et renvoie son ID d'exécution. `jobs/update` met à jour partiellement les paramètres d'un job, alors que `jobs/reset` les écraserait tous. `jobs/runs/repair` réexécute des tâches choisies d'une exécution existante, comme celles en échec. `jobs/runs/cancel-all` annule toutes les exécutions actives d'un job."
  options:
    reset: { en: "reset replaces every setting of the job, which doesn't keep the other settings unless they're all resent.", fr: "reset remplace tous les paramètres du job, ce qui ne conserve pas les autres paramètres à moins de tous les renvoyer." }
    submit: { en: "runs/submit runs a one-time workload without a job.", fr: "runs/submit exécute une charge de travail unique sans job." }
references:
  - title: Jobs API 2.0
    url: https://learn.microsoft.com/en-us/azure/databricks/reference/jobs-2.0-api
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
