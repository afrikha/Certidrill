id: dp750-cs1c-store-close-logic
objective: "4.1.3"
type: dragdrop
caseStudy: dp750-cs1c-best-for-you-organics
difficulty: 2
status: draft
stem:
  en: |
    You are designing the store-close job.

    What should you configure for each requirement? To answer, drag the appropriate task types or Run if conditions to the correct requirements. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez le job store-close.

    Que devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les types de tâches ou les conditions Run if appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: foreach, text: { en: "For each task", fr: "Tâche For each" } }
    - { id: ifelse, text: { en: "If/else task", fr: "Tâche If/else" } }
    - { id: runjob, text: { en: "Run Job task", fr: "Tâche Run Job" } }
    - { id: alldone, text: { en: "Run if: All done", fr: "Run if : All done" } }
    - { id: onefailed, text: { en: "Run if: At least one failed", fr: "Run if : At least one failed" } }
    - { id: nonefailed, text: { en: "Run if: None failed", fr: "Run if : None failed" } }
  targets:
    - id: perstore
      text: { en: "Run close_store once for each store code returned by list_stores", fr: "Exécuter close_store une fois pour chaque code de magasin renvoyé par list_stores" }
    - id: branch
      text: { en: "Run publish_report or notify_empty depending on the row_count value of validate", fr: "Exécuter publish_report ou notify_empty selon la valeur row_count de validate" }
    - id: cleanup
      text: { en: "Dependency setting of cleanup", fr: "Paramètre de dépendance de cleanup" }
    - id: alert
      text: { en: "Dependency setting of alert_ops", fr: "Paramètre de dépendance d'alert_ops" }
answer:
  mapping: { perstore: foreach, branch: ifelse, cleanup: alldone, alert: onefailed }
explanation:
  correct:
    en: A For each task runs a nested task once for each value of an input list, such as the store codes that list_stores returns as a task value. An If/else task compares values, such as a task value of validate, and runs the tasks of its true or false branch. All done runs cleanup after its dependencies have run, whatever their status, and At least one failed runs alert_ops only when one of load_sales or load_stock fails.
    fr: Une tâche For each exécute une tâche imbriquée une fois pour chaque valeur d'une liste d'entrée, comme les codes de magasin que list_stores renvoie sous forme de valeur de tâche. Une tâche If/else compare des valeurs, comme une valeur de tâche de validate, et exécute les tâches de sa branche true ou false. All done exécute cleanup après l'exécution de ses dépendances, quel que soit leur statut, et At least one failed n'exécute alert_ops que si load_sales ou load_stock échoue.
  options:
    runjob: { en: "A Run Job task starts another existing job; it doesn't loop over values or branch on a condition.", fr: "Une tâche Run Job démarre un autre job existant ; elle ne boucle pas sur des valeurs et ne crée pas de branche conditionnelle." }
    nonefailed: { en: "None failed doesn't run the task when a dependency fails, so it fits neither cleanup nor alert_ops.", fr: "None failed n'exécute pas la tâche quand une dépendance échoue ; elle ne convient donc ni à cleanup ni à alert_ops." }
references:
  - title: Configure task dependencies
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-if
  - title: Configure and edit tasks in Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-task
