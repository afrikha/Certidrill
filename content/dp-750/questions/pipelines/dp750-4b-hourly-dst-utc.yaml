id: dp750-4b-hourly-dst-utc
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Lakeflow job named **litware_meters_hourly** aggregates smart meter readings into `litware_prod.gold.hourly_usage`. It uses an Advanced schedule with the cron expression `0 0 * * * ?` and the time zone Europe/Paris. Max concurrent runs is 1, and each run takes about 10 minutes.

    At the end of October, one hourly run was missing, and the downstream reports showed a gap.

    You need to ensure that the job runs every hour in absolute time, including when daylight saving time begins or ends. The solution must minimize changes to the job.

    What should you do?
  fr: |
    Un job Lakeflow nommé **litware_meters_hourly** agrège des relevés de compteurs intelligents dans `litware_prod.gold.hourly_usage`. Il utilise une planification Advanced avec l'expression cron `0 0 * * * ?` et le fuseau horaire Europe/Paris. Max concurrent runs vaut 1, et chaque exécution dure environ 10 minutes.

    Fin octobre, une exécution horaire a manqué, et les rapports en aval ont présenté un trou.

    Vous devez faire en sorte que le job s'exécute toutes les heures en temps absolu, y compris au début et à la fin de l'heure d'été. La solution doit réduire au minimum les modifications du job.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable queueing for the job.", fr: "Activer la mise en file d'attente pour le job." } }
    - { id: b, text: { en: "Change the cron expression to 0 0 0/1 * * ?.", fr: "Remplacer l'expression cron par 0 0 0/1 * * ?." } }
    - { id: c, text: { en: "Increase the maximum concurrent runs of the job to 2.", fr: "Porter à 2 le nombre maximal d'exécutions simultanées du job." } }
    - { id: d, text: { en: "Change the time zone of the schedule to UTC.", fr: "Remplacer le fuseau horaire de la planification par UTC." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In a time zone that observes daylight saving time, an hourly schedule can be skipped, or appear delayed by an hour or two, when the clocks change. Databricks recommends UTC to run at every hour in absolute time; only the time zone of the schedule changes.
    fr: |
      Dans un fuseau horaire qui applique l'heure d'été, une planification horaire peut être ignorée, ou sembler retardée d'une heure ou deux, au changement d'heure. Databricks recommande UTC pour exécuter le job à chaque heure en temps absolu ; seul le fuseau horaire de la planification change.
  options:
    a: { en: "The run wasn't blocked by a limit: the schedule itself didn't fire, so there was nothing to queue.", fr: "L'exécution n'a pas été bloquée par une limite : la planification elle-même ne s'est pas déclenchée, il n'y avait donc rien à mettre en file d'attente." }
    b: { en: "This expression is also hourly and is still interpreted in Europe/Paris, so the daylight saving issue remains.", fr: "Cette expression est elle aussi horaire et reste interprétée dans Europe/Paris : le problème du changement d'heure demeure." }
    c: { en: "Runs last 10 minutes, so they never overlap; concurrency doesn't explain the missing run.", fr: "Les exécutions durent 10 minutes et ne se chevauchent jamais ; la simultanéité n'explique pas l'exécution manquante." }
references:
  - title: Run jobs on a schedule
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/scheduled
