id: dp750-4b-add-schedule-steps
objective: "4.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a Lakeflow job named **adatum_stock_close** that currently runs only when started manually.

    You need the job to run every day at 22:00 Lisbon local time.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un job Lakeflow nommé **adatum_stock_close** qui ne s'exécute actuellement que lorsqu'il est lancé manuellement.

    Le job doit s'exécuter tous les jours à 22:00, heure locale de Lisbonne.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "In the sidebar, click **Jobs & Pipelines**, and then open adatum_stock_close.", fr: "Dans la barre latérale, cliquer sur **Jobs & Pipelines**, puis ouvrir adatum_stock_close." } }
    - { id: add, text: { en: "In the **Job details** pane, click **Add trigger**.", fr: "Dans le volet **Job details**, cliquer sur **Add trigger**." } }
    - { id: type, text: { en: "Set **Trigger type** to **Scheduled**.", fr: "Définir **Trigger type** sur **Scheduled**." } }
    - { id: adv, text: { en: "Set **Schedule type** to **Advanced**, and then enter 22:00 every day with the time zone Europe/Lisbon.", fr: "Définir **Schedule type** sur **Advanced**, puis saisir 22:00 tous les jours avec le fuseau horaire Europe/Lisbon." } }
    - { id: save, text: { en: "Click **Save**.", fr: "Cliquer sur **Save**." } }
    - { id: cont, text: { en: "Set **Trigger type** to **Continuous**.", fr: "Définir **Trigger type** sur **Continuous**." } }
    - { id: run, text: { en: "Click **Run now**.", fr: "Cliquer sur **Run now**." } }
answer:
  sequence: [ open, add, type, adv, save ]
explanation:
  correct:
    en: |
      Schedules are added in the Job details pane of the job: Add trigger, the Scheduled trigger type, then the schedule type. Only an Advanced schedule lets you set the start time and the time zone. The schedule takes effect when you save it.
    fr: |
      Les planifications s'ajoutent dans le volet Job details du job : Add trigger, le type de déclencheur Scheduled, puis le type de planification. Seule une planification Advanced permet de fixer l'heure de début et le fuseau horaire. La planification prend effet à l'enregistrement.
  options:
    cont: { en: "A continuous trigger keeps a run always active instead of running at 22:00.", fr: "Un déclencheur Continuous garde une exécution toujours active au lieu d'exécuter le job à 22:00." }
    run: { en: "Run now starts one manual run; it doesn't schedule the job.", fr: "Run now lance une exécution manuelle ; il ne planifie pas le job." }
references:
  - title: Run jobs on a schedule
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/scheduled
