id: dp750-4a-task-per-notebook
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs its nightly load with a single notebook task. The task runs a driver notebook that calls five notebooks in sequence with `dbutils.notebook.run()` and raises an exception when one of them fails.

    You plan to replace the driver notebook with a Lakeflow job that has one notebook task per notebook, linked by task dependencies.

    Which two benefits will the new design provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute son chargement nocturne avec une seule tâche notebook. La tâche exécute un notebook pilote qui appelle cinq notebooks à la suite avec `dbutils.notebook.run()` et lève une exception quand l'un d'eux échoue.

    Vous prévoyez de remplacer le notebook pilote par un job Lakeflow comportant une tâche notebook par notebook, reliées par des dépendances de tâches.

    Quels sont les deux avantages qu'apportera la nouvelle conception ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each notebook gets its own retry policy, timeout and notifications.", fr: "Chaque notebook a sa propre stratégie de nouvelles tentatives, son délai d'expiration et ses notifications." } }
    - { id: b, text: { en: "The notebooks share the Python variables and functions defined by the previous notebooks.", fr: "Les notebooks partagent les variables et fonctions Python définies par les notebooks précédents." } }
    - { id: c, text: { en: "After a failure, the run can be repaired from the failed notebook instead of rerunning all five.", fr: "Après un échec, l'exécution peut être réparée à partir du notebook en échec au lieu de réexécuter les cinq." } }
    - { id: d, text: { en: "Each notebook automatically receives the string returned by the previous notebook.", fr: "Chaque notebook reçoit automatiquement la chaîne renvoyée par le notebook précédent." } }
    - { id: e, text: { en: "The notebooks run in the same Spark session, so their temporary views stay available.", fr: "Les notebooks s'exécutent dans la même session Spark : leurs vues temporaires restent donc disponibles." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Retries, timeouts, duration thresholds and notifications are task settings, so separate tasks can each have their own. The job graph shows which task failed, and a repair run reruns only the failed tasks and the tasks that depend on them.
    fr: |
      Les nouvelles tentatives, les délais d'expiration, les seuils de durée et les notifications sont des paramètres de tâche : des tâches distinctes peuvent donc chacune avoir les leurs. Le graphe du job montre quelle tâche a échoué, et une exécution de réparation ne réexécute que les tâches en échec et celles qui en dépendent.
  options:
    b:
      en: |
        Only %run shares variables and functions with the caller; separate tasks don't share Python state.
      fr: |
        Seul %run partage les variables et les fonctions avec l'appelant ; des tâches distinctes ne partagent pas d'état Python.
    d:
      en: |
        Values must be passed explicitly between tasks, with task values and dynamic value references.
      fr: |
        Les valeurs doivent être transmises explicitement entre les tâches, avec les valeurs de tâche et les références de valeurs dynamiques.
    e:
      en: |
        Each task runs separately; temporary views of one task aren't visible to the next one.
      fr: |
        Chaque tâche s'exécute séparément ; les vues temporaires d'une tâche ne sont pas visibles par la suivante.
references:
  - title: Configure and edit tasks in Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-task
  - title: Orchestrate Databricks notebooks and modularize code
    url: https://learn.microsoft.com/en-us/azure/databricks/notebooks/notebook-workflows
