id: dp750-4b-dvr-updated-tables
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Lakeflow job named **adatum_returns_refresh** has a table update trigger. The trigger monitors three tables in the `adatum_prod.silver` schema and starts a run when any of them is updated.

    The first task of the job must receive, as a task parameter, the list of the monitored tables that were updated since the last run.

    Which value should you assign to the task parameter?
  fr: |
    Un job Lakeflow nommé **adatum_returns_refresh** possède un déclencheur Table update. Le déclencheur surveille trois tables du schéma `adatum_prod.silver` et lance une exécution dès que l'une d'elles est mise à jour.

    La première tâche du job doit recevoir, sous forme de paramètre de tâche, la liste des tables surveillées qui ont été mises à jour depuis la dernière exécution.

    Quelle valeur devez-vous attribuer au paramètre de tâche ?
body:
  options:
    - { id: a, text: "`{{job.trigger.type}}`" }
    - { id: b, text: "`{{job.parameters.updated_tables}}`" }
    - { id: c, text: "`{{job.trigger.table_update.updated_tables}}`" }
    - { id: d, text: "`{{tasks.refresh.values.updated_tables}}`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The dynamic value reference `{{job.trigger.table_update.updated_tables}}` returns a JSON list of the tables updated since the last run, in the `<catalog>.<schema>.<table>` format. It is resolved at run time, so the task code can process only the tables that changed.
    fr: |
      La référence de valeur dynamique `{{job.trigger.table_update.updated_tables}}` renvoie une liste JSON des tables mises à jour depuis la dernière exécution, au format `<catalog>.<schema>.<table>`. Elle est résolue à l'exécution : le code de la tâche peut ne traiter que les tables modifiées.
  options:
    a: { en: "job.trigger.type returns the kind of trigger (here table), not the tables.", fr: "job.trigger.type renvoie le type de déclencheur (ici table), pas les tables." }
    b: { en: "job.parameters returns the value of a job parameter that you define yourself; no job parameter holds the updated tables.", fr: "job.parameters renvoie la valeur d'un paramètre de job que vous définissez vous-même ; aucun paramètre de job ne contient les tables mises à jour." }
    d: { en: "tasks.<task_name>.values reads a task value set by an upstream task; the first task has no upstream task.", fr: "tasks.<task_name>.values lit une valeur de tâche définie par une tâche en amont ; la première tâche n'en a pas." }
references:
  - title: Trigger jobs when source tables are updated
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/trigger-table-update
  - title: Dynamic value references
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/dynamic-value-references
