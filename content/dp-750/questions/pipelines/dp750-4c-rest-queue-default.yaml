id: dp750-4c-rest-queue-default
objective: "4.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware's deployment script creates jobs by calling `jobs/create` on the Azure Databricks REST API. Each job has `max_concurrent_runs` set to 1. The script used to call Jobs API 2.1 and was updated to call Jobs API 2.2, without other changes to the request bodies.

    With the old jobs, a run triggered while another run of the same job was active was skipped. With the jobs created by the updated script, such a run now waits until the active run ends.

    You need the jobs created by the updated script to skip such runs again, as before.

    What should you change in the script?
  fr: |
    Le script de déploiement de Litware crée des jobs en appelant `jobs/create` sur l'API REST Azure Databricks. `max_concurrent_runs` est défini sur 1 pour chaque job. Le script appelait l'API Jobs 2.1 et a été modifié pour appeler l'API Jobs 2.2, sans autre changement dans le corps des requêtes.

    Avec les anciens jobs, une exécution déclenchée pendant qu'une autre exécution du même job était active était ignorée (Skipped). Avec les jobs créés par le script modifié, une telle exécution attend désormais la fin de l'exécution active.

    Vous devez faire en sorte que les jobs créés par le script modifié ignorent de nouveau ces exécutions, comme avant.

    Que devez-vous modifier dans le script ?
body:
  options:
    - { id: a, text: { en: "Disable queueing in the queue setting of each jobs/create request", fr: "Désactiver la mise en file d'attente dans le paramètre queue de chaque requête jobs/create" } }
    - { id: b, text: { en: "Raise max_concurrent_runs in each jobs/create request", fr: "Augmenter max_concurrent_runs dans chaque requête jobs/create" } }
    - { id: c, text: { en: "Call jobs/runs/cancel-all before each jobs/run-now request", fr: "Appeler jobs/runs/cancel-all avant chaque requête jobs/run-now" } }
    - { id: d, text: { en: "List every task in the only field of each jobs/run-now request", fr: "Lister toutes les tâches dans le champ only de chaque requête jobs/run-now" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Jobs created with Jobs API 2.2 have queueing enabled by default, whereas jobs created with 2.0 or 2.1 don't. With queueing, a run that would exceed the concurrency limit waits in the queue instead of being skipped. Setting `queue` to disabled in the create request restores the previous behavior."
    fr: "Les jobs créés avec l'API Jobs 2.2 ont la mise en file d'attente activée par défaut, contrairement aux jobs créés avec les versions 2.0 ou 2.1. Avec la mise en file d'attente, une exécution qui dépasserait la limite de simultanéité attend dans la file au lieu d'être ignorée. Désactiver `queue` dans la requête de création rétablit le comportement précédent."
  options:
    b: { en: "More concurrent runs would let the triggered runs start at once instead of being skipped.", fr: "Davantage d'exécutions simultanées permettrait aux exécutions déclenchées de démarrer aussitôt au lieu d'être ignorées." }
    c: { en: "Canceling all runs stops the active run so that the new one runs, the opposite of skipping it.", fr: "Annuler toutes les exécutions arrête l'exécution active pour que la nouvelle s'exécute, l'inverse de l'ignorer." }
    d: { en: "The only field selects which tasks of the run execute; it doesn't control queueing.", fr: "Le champ only sélectionne les tâches de l'exécution ; il ne contrôle pas la mise en file d'attente." }
references:
  - title: Updating from Jobs API 2.1 to 2.2
    url: https://learn.microsoft.com/en-us/azure/databricks/reference/jobs-api-2-2-updates
  - title: Monitor Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/monitor
