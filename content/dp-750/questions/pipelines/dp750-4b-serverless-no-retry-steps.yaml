id: dp750-4b-serverless-no-retry-steps
objective: "4.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow job named **woodgrove_payments_post** runs a notebook task named **post_transfers** on serverless compute. The task sends payment instructions to a banking API and isn't idempotent. It has no retry policy configured.

    You need to ensure that the task runs at most once per job run, even if it fails.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un job Lakeflow nommé **woodgrove_payments_post** exécute sur du calcul serverless une tâche de notebook nommée **post_transfers**. La tâche envoie des ordres de paiement à une API bancaire et n'est pas idempotente. Aucune stratégie de nouvelles tentatives n'est configurée.

    Vous devez faire en sorte que la tâche s'exécute au plus une fois par exécution du job, même en cas d'échec.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: add, text: { en: "In the settings of post_transfers, click **Add** next to **Retries**.", fr: "Dans les paramètres de post_transfers, cliquer sur **Add** à côté de **Retries**." } }
    - { id: clear, text: { en: "In the **Retry Policy** dialog, clear **Enable serverless auto-optimization (may include additional retries)**.", fr: "Dans la boîte de dialogue **Retry Policy**, décocher **Enable serverless auto-optimization (may include additional retries)**." } }
    - { id: confirm, text: { en: "Click **Confirm**.", fr: "Cliquer sur **Confirm**." } }
    - { id: save, text: { en: "Click **Save task**.", fr: "Cliquer sur **Save task**." } }
    - { id: perf, text: { en: "In the **Job details** pane, disable **Performance optimized**.", fr: "Dans le volet **Job details**, désactiver **Performance optimized**." } }
    - { id: conc, text: { en: "Set the maximum concurrent runs of the job to 1.", fr: "Définir le nombre maximal d'exécutions simultanées du job sur 1." } }
answer:
  sequence: [ add, clear, confirm, save ]
explanation:
  correct:
    en: |
      Serverless auto-optimization is on by default and can retry failed tasks. For a non-idempotent task, open the retry policy with Add next to Retries, clear the auto-optimization check box, confirm the dialog, and save the task.
    fr: |
      L'auto-optimisation serverless est activée par défaut et peut relancer les tâches en échec. Pour une tâche non idempotente, ouvrez la stratégie de nouvelles tentatives avec Add à côté de Retries, décochez la case d'auto-optimisation, confirmez la boîte de dialogue, puis enregistrez la tâche.
  options:
    perf: { en: "Performance optimized trades cost for startup speed; it doesn't control retries.", fr: "Performance optimized arbitre entre coût et vitesse de démarrage ; il ne contrôle pas les nouvelles tentatives." }
    conc: { en: "Max concurrent runs limits overlapping runs of the job, not the retries of a task inside a run.", fr: "Max concurrent runs limite les exécutions simultanées du job, pas les nouvelles tentatives d'une tâche au sein d'une exécution." }
references:
  - title: Run your Lakeflow Jobs with serverless compute for workflows
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-serverless-jobs
