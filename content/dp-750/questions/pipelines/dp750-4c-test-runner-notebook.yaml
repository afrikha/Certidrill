id: dp750-4c-test-runner-notebook
objective: "4.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind keeps its transformation functions and their pytest unit tests in `.py` files of a Git folder. A notebook named **run_tests** runs every test under `tests/` as the first task of a Lakeflow Jobs workflow.

    The notebook must meet the following requirements:

    - pytest must not write bytecode or cache files, because the file system it runs on is read-only.
    - The job task must fail when any test fails, so that the downstream deployment task doesn't run.

    How should you complete the notebook code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind conserve ses fonctions de transformation et leurs tests unitaires pytest dans des fichiers `.py` d'un dossier Git. Un notebook nommé **run_tests** exécute tous les tests de `tests/` comme première tâche d'un workflow Lakeflow Jobs.

    Le notebook doit répondre aux exigences suivantes :

    - pytest ne doit écrire ni bytecode ni fichiers de cache, car le système de fichiers sur lequel il s'exécute est en lecture seule.
    - La tâche du job doit échouer dès qu'un test échoue, pour que la tâche de déploiement en aval ne s'exécute pas.

    Comment devez-vous compléter le code du notebook ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    %pip install pytest

    import pytest
    import sys

    [[bytecode]]

    retcode = pytest.main(["tests/", "-v", "-p", [[plugin]]])

    [[check]]
  slots:
    - id: bytecode
      options:
        - { id: dwb, text: "sys.dont_write_bytecode = True" }
        - { id: path, text: "sys.path.append(\"tests/\")" }
        - { id: exit, text: "sys.exit(0)" }
        - { id: limit, text: "sys.setrecursionlimit(10000)" }
    - id: plugin
      options:
        - { id: nocache, text: "\"no:cacheprovider\"" }
        - { id: cache, text: "\"cacheprovider\"" }
        - { id: nowarn, text: "\"no:warnings\"" }
    - id: check
      options:
        - { id: assert, text: "assert retcode == 0, \"Test suite failed\"" }
        - { id: print, text: "print(f\"pytest exit code: {retcode}\")" }
        - { id: nbexit, text: "dbutils.notebook.exit(str(retcode))" }
        - { id: assertne, text: "assert retcode != 0, \"Test suite failed\"" }
answer:
  values: { bytecode: dwb, plugin: nocache, check: assert }
explanation:
  correct:
    en: "`sys.dont_write_bytecode = True` stops Python from writing .pyc files, and `-p no:cacheprovider` disables the pytest cache plugin, so nothing is written to the read-only file system. `pytest.main` returns 0 when all tests pass; the `assert` raises an error otherwise, which fails the notebook task and stops the dependent tasks."
    fr: "`sys.dont_write_bytecode = True` empêche Python d'écrire des fichiers .pyc, et `-p no:cacheprovider` désactive le plug-in de cache de pytest : rien n'est écrit sur le système de fichiers en lecture seule. `pytest.main` renvoie 0 quand tous les tests réussissent ; sinon, l'`assert` lève une erreur, ce qui fait échouer la tâche du notebook et arrête les tâches dépendantes."
  options:
    path: { en: "Adding a path to sys.path changes imports, not bytecode writing.", fr: "Ajouter un chemin à sys.path modifie les importations, pas l'écriture du bytecode." }
    exit: { en: "sys.exit(0) ends the notebook before the tests run.", fr: "sys.exit(0) termine le notebook avant l'exécution des tests." }
    cache: { en: "Without the no: prefix, the cache plugin isn't disabled.", fr: "Sans le préfixe no:, le plug-in de cache n'est pas désactivé." }
    nowarn: { en: "no:warnings disables the warnings plugin; the cache files are still written.", fr: "no:warnings désactive le plug-in d'avertissements ; les fichiers de cache sont toujours écrits." }
    print: { en: "Printing the code doesn't fail the task, so the deployment task would still run.", fr: "Afficher le code ne fait pas échouer la tâche : la tâche de déploiement s'exécuterait quand même." }
    nbexit: { en: "dbutils.notebook.exit ends the notebook successfully with a value; the task doesn't fail.", fr: "dbutils.notebook.exit termine le notebook avec succès en renvoyant une valeur ; la tâche n'échoue pas." }
    assertne: { en: "This assertion fails when all tests pass, the opposite of the requirement.", fr: "Cette assertion échoue quand tous les tests réussissent, l'inverse de l'exigence." }
references:
  - title: Unit testing for Databricks notebooks
    url: https://learn.microsoft.com/en-us/azure/databricks/notebooks/testing
  - title: Implement testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy
