id: dp750-cs4b-repair-run
objective: "4.4.2"
type: single
caseStudy: dp750-cs4b-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the recovery requirement for the last run of job_supplier_prices. What should you do?
  fr: |
    Vous devez satisfaire l'exigence de reprise pour la dernière exécution de job_supplier_prices. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Click Run now on the job so that a new run starts with the fixed notebook.", fr: "Cliquer sur Run now sur le job pour qu'une nouvelle exécution démarre avec le notebook corrigé." } }
    - { id: b, text: { en: "Click Repair run on the failed run so that enrich_products and publish_gold run again.", fr: "Cliquer sur Repair run sur l'exécution en échec pour que enrich_products et publish_gold s'exécutent de nouveau." } }
    - { id: c, text: { en: "Click Restart run on the failed run so that the run starts again from enrich_products.", fr: "Cliquer sur Restart run sur l'exécution en échec pour que l'exécution reprenne à partir de enrich_products." } }
    - { id: d, text: { en: "Set three retries on enrich_products, and then click Run now on the job.", fr: "Définir trois nouvelles tentatives sur enrich_products, puis cliquer sur Run now sur le job." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Repair run reruns only the unsuccessful tasks of a multi-task job run (enrich_products failed and publish_gold was skipped) and their dependents, with the current job and task settings, so the fixed notebook is used. Successful tasks such as ingest_prices and validate_prices are not rerun, which saves their compute.
    fr: |
      Repair run réexécute uniquement les tâches non réussies d'une exécution de job multitâche (enrich_products en échec et publish_gold ignorée) et les tâches qui en dépendent, avec les paramètres actuels du job et des tâches : le notebook corrigé est donc utilisé. Les tâches réussies comme ingest_prices et validate_prices ne sont pas réexécutées, ce qui économise leur calcul.
  options:
    a:
      en: |
        Run now starts a full new run, so ingest_prices and validate_prices would run again.
      fr: |
        Run now démarre une nouvelle exécution complète : ingest_prices et validate_prices s'exécuteraient de nouveau.
    c:
      en: |
        Restart run applies to continuous jobs in exponential backoff; it cancels the active run and starts a new full run.
      fr: |
        Restart run s'applique aux jobs continus en temporisation exponentielle ; il annule l'exécution active et démarre une nouvelle exécution complète.
    d:
      en: |
        Retries only apply to future runs, and Run now would still rerun every task, including ingest_prices.
      fr: |
        Les nouvelles tentatives ne s'appliquent qu'aux exécutions futures, et Run now réexécuterait quand même toutes les tâches, y compris ingest_prices.
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
