id: dp750-4b-runas-sp-user-role
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have the CAN MANAGE permission on a Lakeflow job named **fabrikam_inventory_hourly**. You are not a workspace admin.

    You need to change the **Run as** setting of the job to a service principal named **sp-inventory-prod**. When you open the Run as list, sp-inventory-prod isn't available.

    You need to be able to select sp-inventory-prod. The solution must follow the principle of least privilege.

    What should you obtain?
  fr: |
    Vous disposez de l'autorisation CAN MANAGE sur un job Lakeflow nommé **fabrikam_inventory_hourly**. Vous n'êtes pas administrateur de l'espace de travail.

    Vous devez remplacer le paramètre **Run as** du job par un principal de service nommé **sp-inventory-prod**. Quand vous ouvrez la liste Run as, sp-inventory-prod n'y figure pas.

    Vous devez pouvoir sélectionner sp-inventory-prod. La solution doit respecter le principe du privilège minimum.

    Que devez-vous obtenir ?
body:
  options:
    - { id: a, text: { en: "The IS OWNER permission on fabrikam_inventory_hourly", fr: "L'autorisation IS OWNER sur fabrikam_inventory_hourly" } }
    - { id: b, text: { en: "The Service Principal User role on sp-inventory-prod", fr: "Le rôle Service Principal User sur sp-inventory-prod" } }
    - { id: c, text: { en: "The workspace admin role", fr: "Le rôle d'administrateur de l'espace de travail" } }
    - { id: d, text: { en: "The CAN MANAGE RUN permission on fabrikam_inventory_hourly", fr: "L'autorisation CAN MANAGE RUN sur fabrikam_inventory_hourly" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With CAN MANAGE or IS OWNER on the job, you can set Run as to yourself or to any service principal on which you have the Service Principal User role. You already have CAN MANAGE, so the missing piece is that role on sp-inventory-prod.
    fr: |
      Avec CAN MANAGE ou IS OWNER sur le job, vous pouvez définir Run as sur vous-même ou sur tout principal de service pour lequel vous avez le rôle Service Principal User. Vous avez déjà CAN MANAGE : il ne manque que ce rôle sur sp-inventory-prod.
  options:
    a: { en: "Ownership of the job doesn't let you use a service principal, and only workspace admins can change the owner.", fr: "Être propriétaire du job ne permet pas d'utiliser un principal de service, et seuls les administrateurs de l'espace de travail changent le propriétaire." }
    c: { en: "Workspace admins can set Run as to any service principal, but the admin role grants far more than this task needs.", fr: "Les administrateurs de l'espace de travail peuvent choisir n'importe quel principal de service pour Run as, mais ce rôle accorde bien plus que nécessaire." }
    d: { en: "CAN MANAGE RUN only triggers and cancels runs; it is included in CAN MANAGE, which you already have.", fr: "CAN MANAGE RUN permet seulement de déclencher et d'annuler des exécutions ; il est inclus dans CAN MANAGE, que vous avez déjà." }
references:
  - title: Manage identities, permissions, and privileges for Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/privileges
