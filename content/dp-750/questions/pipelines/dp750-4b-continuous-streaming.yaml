id: dp750-4b-continuous-streaming
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow job named **contoso_clickstream** runs a single notebook task. The notebook uses Auto Loader in `addNewColumns` schema evolution mode to stream JSON files into `contoso_prod.bronze.clicks`. The stream stops on purpose whenever a new column appears, and it can also fail on other errors.

    You need the stream to run all the time and to restart by itself after any failure, with no limit on the number of restarts. The solution must follow Databricks recommendations.

    What should you configure?
  fr: |
    Un job Lakeflow nommé **contoso_clickstream** exécute une seule tâche de notebook. Le notebook utilise Auto Loader en mode d'évolution de schéma `addNewColumns` pour diffuser des fichiers JSON vers `contoso_prod.bronze.clicks`. Le flux s'arrête volontairement à chaque nouvelle colonne, et il peut aussi échouer sur d'autres erreurs.

    Le flux doit s'exécuter en permanence et redémarrer seul après tout échec, sans limite de nombre de redémarrages. La solution doit suivre les recommandations de Databricks.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A scheduled trigger that runs the job every minute", fr: "Un déclencheur Scheduled qui exécute le job toutes les minutes" } }
    - { id: b, text: { en: "A continuous trigger on the job", fr: "Un déclencheur Continuous sur le job" } }
    - { id: c, text: { en: "A retry policy with a high number of retries on the task, and max concurrent runs set to 1", fr: "Une stratégie avec un nombre élevé de nouvelles tentatives sur la tâche, et max concurrent runs défini sur 1" } }
    - { id: d, text: { en: "A file arrival trigger on the source volume", fr: "Un déclencheur File arrival sur le volume source" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Databricks recommends continuous mode for always-on Structured Streaming workloads. A continuous job always has one run active, starts a new run less than 60 seconds after the previous one ends, and retries the whole job with exponential backoff and no limit on retries. The restarted stream picks up the new schema.
    fr: |
      Databricks recommande le mode continu pour les charges de travail Structured Streaming toujours actives. Un job continu a toujours une exécution active, lance une nouvelle exécution moins de 60 secondes après la fin de la précédente et relance le job entier avec une temporisation exponentielle, sans limite de tentatives. Le flux redémarré prend en compte le nouveau schéma.
  options:
    a: { en: "A schedule every minute creates many short runs and doesn't restart a failed stream immediately; the scheduler isn't meant for low latency.", fr: "Une planification toutes les minutes crée de nombreuses exécutions courtes et ne relance pas immédiatement un flux en échec ; le planificateur n'est pas conçu pour une faible latence." }
    c: { en: "An unlimited retry policy with one concurrent run is the legacy pattern that continuous mode replaces, and a fixed number of retries eventually runs out.", fr: "Une stratégie de tentatives illimitées avec une seule exécution simultanée est l'ancien modèle que le mode continu remplace, et un nombre fixe de tentatives finit par s'épuiser." }
    d: { en: "A file arrival trigger starts runs when files arrive; it doesn't restart a failed stream.", fr: "Un déclencheur File arrival lance des exécutions à l'arrivée de fichiers ; il ne relance pas un flux en échec." }
references:
  - title: Run jobs continuously
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/continuous
