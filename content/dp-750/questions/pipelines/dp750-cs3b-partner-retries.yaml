id: dp750-cs3b-partner-retries
objective: "4.2.5"
type: single
caseStudy: dp750-cs3b-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You need to meet operations requirement 6.

    What should you configure?
  fr: |
    Vous devez satisfaire l'exigence d'exploitation 6.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "On the ingest_partner task, add a retry policy with three retries and set Timeout to 20 minutes.", fr: "Sur la tâche ingest_partner, ajouter une stratégie de nouvelles tentatives avec trois tentatives et définir Timeout sur 20 minutes." } }
    - { id: b, text: { en: "On the ingest_partner task, add a retry policy with three retries and set Warning to 20 minutes.", fr: "Sur la tâche ingest_partner, ajouter une stratégie de nouvelles tentatives avec trois tentatives et définir Warning sur 20 minutes." } }
    - { id: c, text: { en: "On the job, set Timeout to 80 minutes and Maximum concurrent runs to 3.", fr: "Sur le job, définir Timeout sur 80 minutes et Maximum concurrent runs sur 3." } }
    - { id: d, text: { en: "On the job, replace the schedule with a continuous trigger so that failed runs restart with an exponential backoff.", fr: "Sur le job, remplacer la planification par un déclencheur continu pour que les exécutions en échec redémarrent avec une temporisation exponentielle." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, most jobs do not retry failed tasks; a retry policy on ingest_partner reruns only that task when it fails. When both Timeout and Retries are configured on a task, the timeout applies to each retry, so every attempt stops after 20 minutes.
    fr: |
      Par défaut, la plupart des jobs ne relancent pas les tâches en échec ; une stratégie de nouvelles tentatives sur ingest_partner relance uniquement cette tâche quand elle échoue. Quand Timeout et Retries sont tous deux configurés sur une tâche, le délai d'expiration s'applique à chaque tentative : chaque tentative s'arrête au bout de 20 minutes.
  options:
    b: { en: "Warning only raises an event when the expected duration is exceeded; it does not stop the attempt.", fr: "Warning déclenche seulement un événement quand la durée attendue est dépassée ; il n'arrête pas la tentative." }
    c: { en: "A job timeout limits the whole run and Maximum concurrent runs allows parallel runs; neither retries the failed task.", fr: "Un délai d'expiration du job limite toute l'exécution, et Maximum concurrent runs autorise des exécutions parallèles ; aucun des deux ne relance la tâche en échec." }
    d: { en: "A continuous job starts a new run as soon as the previous one ends, which does not fit a nightly batch, and its backoff does not limit retries to three.", fr: "Un job continu démarre une nouvelle exécution dès la fin de la précédente, ce qui ne convient pas à un traitement batch nocturne, et sa temporisation ne limite pas les tentatives à trois." }
references:
  - title: Configure and edit tasks in Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-task
