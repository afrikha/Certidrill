id: dp750-4a-serverless-no-retry
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Lakeflow job named **billing_monthly** that runs on serverless compute. No retry policy is configured on its tasks.

    The notebook task **charge_customers** calls a payment provider to charge each customer of **adatum.gold.invoices_due**. The call isn't idempotent: running the task a second time charges the customers again.

    You need to ensure that charge_customers is never rerun automatically after a failure. The other tasks of the job must keep their current behavior.

    What should you do?
  fr: |
    Adatum dispose d'un job Lakeflow nommé **billing_monthly** qui s'exécute sur un calcul serverless. Aucune stratégie de nouvelles tentatives n'est configurée sur ses tâches.

    La tâche notebook **charge_customers** appelle un prestataire de paiement pour débiter chaque client de **adatum.gold.invoices_due**. L'appel n'est pas idempotent : exécuter la tâche une seconde fois débite à nouveau les clients.

    Vous devez vous assurer que charge_customers n'est jamais réexécutée automatiquement après un échec. Les autres tâches du job doivent conserver leur comportement actuel.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the job's maximum concurrent runs to 1.", fr: "Définir le nombre maximal d'exécutions simultanées du job sur 1." }
    - id: b
      text: { en: "Set the Run if condition of charge_customers to All done.", fr: "Définir la condition Run if de charge_customers sur All done." }
    - id: c
      text: { en: "Disallow the serverless auto-optimization retries of charge_customers.", fr: "Interdire les nouvelles tentatives d'auto-optimisation serverless de charge_customers." }
    - id: d
      text: { en: "Set the Timeout of charge_customers to 0 seconds.", fr: "Définir le Timeout de charge_customers sur 0 seconde." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      On serverless compute, auto-optimization retries failed tasks by default even when no retry policy is configured. Disallowing these retries in the retry settings of charge_customers keeps a failed charge from being rerun automatically, while the other tasks keep the default behavior.
    fr: |
      Sur un calcul serverless, l'auto-optimisation relance par défaut les tâches en échec, même si aucune stratégie de nouvelles tentatives n'est configurée. Interdire ces nouvelles tentatives dans les paramètres de nouvelles tentatives de charge_customers empêche qu'un débit en échec soit réexécuté automatiquement, tandis que les autres tâches conservent le comportement par défaut.
  options:
    a:
      en: |
        Maximum concurrent runs limits how many runs of the job overlap; it doesn't prevent a failed task from being retried within a run.
      fr: |
        Le nombre maximal d'exécutions simultanées limite le chevauchement des exécutions du job ; il n'empêche pas une tâche en échec d'être relancée au sein d'une exécution.
    b:
      en: |
        Run if decides whether the task starts based on its dependencies; it has no effect on retries after the task fails.
      fr: |
        Run if décide si la tâche démarre en fonction de ses dépendances ; il n'a aucun effet sur les nouvelles tentatives après l'échec de la tâche.
    d:
      en: |
        A timeout limits how long each attempt can run; it doesn't stop retries.
      fr: |
        Un délai d'expiration limite la durée de chaque tentative ; il n'arrête pas les nouvelles tentatives.
references:
  - title: Configure and edit tasks in Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-task
