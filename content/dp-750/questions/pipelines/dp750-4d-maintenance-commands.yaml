id: dp750-4d-maintenance-commands
objective: "4.4.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You maintain Delta tables in the **woodgrove.ops** schema. The tables use liquid clustering, and the jobs that maintain them run on Databricks Runtime 16.4 LTS.

    Which command should you use for each requirement? To answer, drag the appropriate commands to the correct requirements. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous assurez la maintenance de tables Delta du schéma **woodgrove.ops**. Les tables utilisent le liquid clustering, et les jobs qui assurent leur maintenance s'exécutent sur Databricks Runtime 16.4 LTS.

    Quelle commande devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les commandes appropriées vers les exigences correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: opt, text: "OPTIMIZE table_name" }
    - { id: optfull, text: "OPTIMIZE table_name FULL" }
    - { id: dry, text: "VACUUM table_name DRY RUN" }
    - { id: lite, text: "VACUUM table_name LITE" }
    - { id: analyze, text: "ANALYZE TABLE table_name COMPUTE STATISTICS" }
    - { id: reorg, text: "REORG TABLE table_name APPLY (PURGE)" }
  targets:
    - id: t1
      text: { en: "Incrementally cluster the data written since the last run and compact small files", fr: "Regrouper de façon incrémentielle les données écrites depuis la dernière exécution et compacter les petits fichiers" }
    - id: t2
      text: { en: "Recluster all the existing data after you change the clustering keys", fr: "Regrouper de nouveau toutes les données existantes après un changement des clés de clustering" }
    - id: t3
      text: { en: "List the files that a vacuum would delete, without deleting them", fr: "Lister les fichiers qu'un vacuum supprimerait, sans les supprimer" }
    - id: t4
      text: { en: "Collect column statistics so that the query optimizer can choose better plans", fr: "Collecter des statistiques de colonnes pour que l'optimiseur de requêtes choisisse de meilleurs plans" }
answer:
  mapping: { t1: opt, t2: optfull, t3: dry, t4: analyze }
explanation:
  correct:
    en: On a liquid clustered table, OPTIMIZE clusters new data incrementally and compacts files, while OPTIMIZE FULL rewrites all the data files, which reclusters everything after a change of keys. VACUUM ... DRY RUN returns up to 1,000 files that would be deleted, and ANALYZE TABLE ... COMPUTE STATISTICS collects the statistics that the optimizer uses to plan queries. VACUUM ... LITE deletes unreferenced files found from the Delta log, and REORG TABLE ... APPLY (PURGE) rewrites files to remove soft-deleted data; neither collects statistics.
    fr: "Sur une table avec liquid clustering, OPTIMIZE regroupe les nouvelles données de façon incrémentielle et compacte les fichiers, tandis qu'OPTIMIZE FULL réécrit tous les fichiers de données, ce qui regroupe de nouveau l'ensemble après un changement de clés. VACUUM ... DRY RUN renvoie jusqu'à 1 000 fichiers qui seraient supprimés, et ANALYZE TABLE ... COMPUTE STATISTICS collecte les statistiques que l'optimiseur utilise pour planifier les requêtes. VACUUM ... LITE supprime les fichiers non référencés trouvés à partir du journal Delta, et REORG TABLE ... APPLY (PURGE) réécrit les fichiers pour éliminer les données supprimées de façon réversible ; aucune des deux ne collecte de statistiques."
references:
  - title: Optimize data file layout
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/optimize
  - title: Remove unused data files with vacuum
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/vacuum
