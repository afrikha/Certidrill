id: dp750-4c-bundle-var-precedence
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware deploys a Databricks Asset Bundle whose `databricks.yml` file contains the following excerpt.

    ```yaml
    variables:
      catalog:
        description: Target catalog of the sales job
        default: dev_sales

    targets:
      prod:
        mode: production
        variables:
          catalog: prod_sales
    ```

    In the release pipeline, an earlier step sets the environment variable `BUNDLE_VAR_catalog=uat_sales` and does not clear it. The next step runs `databricks bundle deploy -t prod` without the `--var` option. The project has no `variable-overrides.json` file.

    Which value does the deployment use for `${var.catalog}`?
  fr: |
    Litware déploie un bundle de ressources Databricks dont le fichier `databricks.yml` contient l'extrait suivant.

    ```yaml
    variables:
      catalog:
        description: Target catalog of the sales job
        default: dev_sales

    targets:
      prod:
        mode: production
        variables:
          catalog: prod_sales
    ```

    Dans le pipeline de mise en production, une étape précédente définit la variable d'environnement `BUNDLE_VAR_catalog=uat_sales` et ne l'efface pas. L'étape suivante exécute `databricks bundle deploy -t prod` sans l'option `--var`. Le projet n'a pas de fichier `variable-overrides.json`.

    Quelle valeur le déploiement utilise-t-il pour `${var.catalog}` ?
body:
  options:
    - { id: a, text: dev_sales }
    - { id: b, text: prod_sales }
    - { id: c, text: uat_sales }
    - { id: d, text: { en: "None: the deployment fails because the variable has conflicting values", fr: "Aucune : le déploiement échoue, car la variable a des valeurs contradictoires" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Databricks CLI uses the first value it finds in this order, `--var` options, `BUNDLE_VAR_` environment variables, `variable-overrides.json`, the `variables` mapping of the target, and finally the top-level `default`. With no `--var` option, the leftover `BUNDLE_VAR_catalog` environment variable wins over the prod target mapping, so the job is deployed with uat_sales."
    fr: "L'interface CLI Databricks utilise la première valeur trouvée dans cet ordre, options `--var`, variables d'environnement `BUNDLE_VAR_`, `variable-overrides.json`, mappage `variables` de la cible, puis `default` de niveau supérieur. Sans option `--var`, la variable d'environnement `BUNDLE_VAR_catalog` restée définie l'emporte sur le mappage de la cible prod : le job est déployé avec uat_sales."
  options:
    a: { en: "The top-level default is used only when no other method sets the variable.", fr: "La valeur par défaut de niveau supérieur n'est utilisée que si aucune autre méthode ne définit la variable." }
    b: { en: "The variables mapping of the target comes after BUNDLE_VAR_ environment variables in the precedence order.", fr: "Le mappage variables de la cible vient après les variables d'environnement BUNDLE_VAR_ dans l'ordre de priorité." }
    d: { en: "Several values aren't a conflict: the CLI applies a precedence order and uses the first value found.", fr: "Plusieurs valeurs ne constituent pas un conflit : l'interface CLI applique un ordre de priorité et utilise la première valeur trouvée." }
references:
  - title: Substitutions and variables in Declarative Automation Bundles
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/variables
