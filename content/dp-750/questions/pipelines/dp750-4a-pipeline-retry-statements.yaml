id: dp750-4a-pipeline-retry-statements
objective: "4.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a triggered Lakeflow Spark Declarative Pipelines pipeline named **sales_etl** that loads tables in **contoso.sales**. The pipeline uses the default values of every retry setting. One of its streaming tables has the following expectation.

    ```sql
    CONSTRAINT valid_qty EXPECT (quantity >= 0) ON VIOLATION FAIL UPDATE
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pipeline déclenché des pipelines déclaratifs Lakeflow Spark nommé **sales_etl** qui charge des tables de **contoso.sales**. Le pipeline utilise les valeurs par défaut de tous les paramètres de nouvelles tentatives. L'une de ses tables de diffusion en continu possède l'attente suivante.

    ```sql
    CONSTRAINT valid_qty EXPECT (quantity >= 0) ON VIOLATION FAIL UPDATE
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When you start an update by clicking Run now in the pipeline editor, a retryable error is retried automatically.
        fr: |
          Quand vous lancez une mise à jour en cliquant sur Run now dans l'éditeur du pipeline, une erreur récupérable est relancée automatiquement.
    - id: s2
      text:
        en: |
          When a Pipeline task of a job starts the update, a flow that hits a retryable error is retried up to two times before the update fails.
        fr: |
          Quand une tâche Pipeline d'un job lance la mise à jour, un flux qui rencontre une erreur récupérable est relancé jusqu'à deux fois avant l'échec de la mise à jour.
    - id: s3
      text:
        en: |
          When a row with a negative quantity reaches the table, the update fails and the table update is rolled back.
        fr: |
          Quand une ligne dont la quantité est négative atteint la table, la mise à jour échoue et la mise à jour de la table est annulée.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Manual updates from the editor reuse the compute and disable retries so that errors surface immediately. Updates started by a job, the API or in continuous mode retry specific errors, and pipelines.maxFlowRetryAttempts defaults to two retries per flow. With FAIL UPDATE, an invalid record makes the update fail and the table update is rolled back atomically.
    fr: |
      Les mises à jour manuelles depuis l'éditeur réutilisent le calcul et désactivent les nouvelles tentatives pour que les erreurs apparaissent immédiatement. Les mises à jour lancées par un job, l'API ou en mode continu relancent certaines erreurs, et pipelines.maxFlowRetryAttempts vaut par défaut deux nouvelles tentatives par flux. Avec FAIL UPDATE, un enregistrement non valide fait échouer la mise à jour et la mise à jour de la table est annulée de façon atomique.
references:
  - title: Run a pipeline update
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/updates
  - title: Pipeline properties reference
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/properties
