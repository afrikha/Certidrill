id: dp750-4c-cli-deploy-facts
objective: "4.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum's data engineers deploy a Databricks Asset Bundle named **sales-etl** with the Databricks CLI. The `dev` target uses `mode: development`, and the `prod` target uses `mode: production` with `run_as` set to a service principal. No target overrides the `workspace` paths.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Les ingénieurs données d'Adatum déploient un bundle de ressources Databricks nommé **sales-etl** avec l'interface CLI Databricks. La cible `dev` utilise `mode: development`, et la cible `prod` utilise `mode: production` avec `run_as` défini sur un principal de service. Aucune cible ne remplace les chemins de `workspace`.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "When two engineers deploy to dev, each deployment is stored in the deploying engineer's own folder, so they don't interfere.", fr: "Quand deux ingénieurs déploient sur dev, chaque déploiement est stocké dans le dossier de l'ingénieur qui déploie : ils n'interfèrent pas." } }
    - { id: b, text: { en: "Running databricks bundle validate --output json shows the values of the variables after resolution.", fr: "L'exécution de databricks bundle validate --output json affiche les valeurs des variables après résolution." } }
    - { id: c, text: { en: "Running databricks bundle deploy -t prod --cluster-id with an ID makes the prod jobs run on that existing cluster.", fr: "L'exécution de databricks bundle deploy -t prod --cluster-id avec un ID fait s'exécuter les jobs de prod sur ce cluster existant." } }
    - { id: d, text: { en: "Adding --force to databricks bundle deploy releases a lock left by an interrupted deployment.", fr: "L'ajout de --force à databricks bundle deploy libère un verrou laissé par un déploiement interrompu." } }
    - { id: e, text: { en: "Running databricks bundle destroy -t prod deletes the uploaded files but keeps the deployed jobs.", fr: "L'exécution de databricks bundle destroy -t prod supprime les fichiers chargés mais conserve les jobs déployés." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "A bundle's identity is its `root_path`, by default `~/.bundle/${bundle.name}/${bundle.target}` in the deploying identity's home folder, so deployments by different users don't collide; only identical values interfere. `bundle validate --output json` prints the configuration with substitutions and variables resolved."
    fr: "L'identité d'un bundle est son `root_path`, par défaut `~/.bundle/${bundle.name}/${bundle.target}` dans le dossier personnel de l'identité qui déploie : les déploiements de différents utilisateurs n'entrent pas en collision ; seules des valeurs identiques interfèrent. `bundle validate --output json` affiche la configuration avec les substitutions et les variables résolues."
  options:
    c: { en: "Production mode doesn't allow overriding cluster definitions with --cluster-id or the cluster_id mapping.", fr: "Le mode production n'autorise pas le remplacement des définitions de cluster avec --cluster-id ou le mappage cluster_id." }
    d: { en: "--force overrides validations such as the Git branch check; --force-lock is the option that forces the lock.", fr: "--force contourne des validations comme la vérification de branche Git ; c'est --force-lock qui force le verrou." }
    e: { en: "destroy deletes the resources and the files that the bundle deployed, including the jobs.", fr: "destroy supprime les ressources et les fichiers déployés par le bundle, y compris les jobs." }
references:
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
  - title: Declarative Automation Bundles deployment modes
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
