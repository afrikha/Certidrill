id: dp750-4b-job-permissions-dragdrop
objective: "4.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your workspace contains a Lakeflow job named **northwind_billing**. Three account groups need access to the job. Each group must receive only the permissions it needs (principle of least privilege).

    Which permission should you assign to each group? To answer, drag the appropriate permissions to the correct groups. Each permission may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre espace de travail contient un job Lakeflow nommé **northwind_billing**. Trois groupes de compte doivent accéder au job. Chaque groupe ne doit recevoir que les autorisations dont il a besoin (principe du privilège minimum).

    Quelle autorisation devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les autorisations appropriées vers les groupes correspondants. Chaque autorisation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: owner, text: IS OWNER }
    - { id: manage, text: CAN MANAGE }
    - { id: run, text: CAN MANAGE RUN }
    - { id: view, text: CAN VIEW }
  targets:
    - { id: ops, text: { en: "billing-operators: start runs and cancel runs that hang", fr: "billing-operators : lancer des exécutions et annuler celles qui sont bloquées" } }
    - { id: audit, text: { en: "billing-auditors: view the run history, details and results", fr: "billing-auditors : consulter l'historique, les détails et les résultats des exécutions" } }
    - { id: leads, text: { en: "billing-leads: edit the tasks and pause or resume the schedule", fr: "billing-leads : modifier les tâches et suspendre ou reprendre la planification" } }
answer:
  mapping: { ops: run, audit: view, leads: manage }
explanation:
  correct:
    en: |
      CAN MANAGE RUN triggers and cancels runs. CAN VIEW shows run results, details, history and status. CAN MANAGE edits the job definition, including tasks and permissions, and pauses or resumes a schedule. Each level includes the ones below it, so a higher level would grant more than needed.
    fr: |
      CAN MANAGE RUN permet de déclencher et d'annuler des exécutions. CAN VIEW affiche les résultats, les détails, l'historique et l'état des exécutions. CAN MANAGE permet de modifier la définition du job, y compris ses tâches et ses autorisations, et de suspendre ou reprendre une planification. Chaque niveau inclut ceux du dessous : un niveau supérieur accorderait plus que nécessaire.
  options:
    owner: { en: "IS OWNER can't be assigned to a group, and only workspace admins change the owner.", fr: "IS OWNER ne peut pas être attribué à un groupe, et seuls les administrateurs de l'espace de travail changent le propriétaire." }
references:
  - title: Manage identities, permissions, and privileges for Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/privileges
