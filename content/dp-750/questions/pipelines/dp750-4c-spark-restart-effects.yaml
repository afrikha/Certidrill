id: dp750-4c-spark-restart-effects
objective: "4.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an all-purpose compute resource named **etl-shared** that has three libraries installed and several attached notebooks. A notebook on etl-shared has become unresponsive, and you plan to restart the compute.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une ressource de calcul polyvalent nommée **etl-shared** sur laquelle trois bibliothèques sont installées et plusieurs notebooks sont attachés. Un notebook sur etl-shared ne répond plus, et vous prévoyez de redémarrer le calcul.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "After the restart, the Spark UI of etl-shared still shows the Spark jobs that ran before the restart."
        fr: "Après le redémarrage, l'interface utilisateur Spark d'etl-shared affiche toujours les jobs Spark exécutés avant le redémarrage."
    - id: s2
      text:
        en: "Jobs that are active on etl-shared when you restart it can fail."
        fr: "Les jobs actifs sur etl-shared au moment du redémarrage peuvent échouer."
    - id: s3
      text:
        en: "If etl-shared is terminated and you start it again, it gets a new cluster ID and you must reinstall its libraries."
        fr: "Si etl-shared est arrêté et que vous le redémarrez, il reçoit un nouvel ID de cluster et vous devez réinstaller ses bibliothèques."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "After a restart, the Spark UI shows information for the restarted compute, not the history of the terminated one. A restart can disrupt users and make active jobs fail, so plan it. Starting a terminated compute re-creates it with the same cluster ID, automatically reinstalls its libraries, and reattaches its notebooks."
    fr: "Après un redémarrage, l'interface utilisateur Spark affiche les informations du calcul redémarré, pas l'historique du calcul arrêté. Un redémarrage peut perturber les utilisateurs et faire échouer les jobs actifs : planifiez-le. Démarrer un calcul arrêté le recrée avec le même ID de cluster, réinstalle automatiquement ses bibliothèques et rattache ses notebooks."
references:
  - title: Manage classic compute
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage
