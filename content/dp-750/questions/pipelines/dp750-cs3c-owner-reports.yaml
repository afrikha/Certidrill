id: dp750-cs3c-owner-reports
objective: "4.1.3"
type: dropdown
caseStudy: dp750-cs3c-southridge-video
difficulty: 3
status: draft
stem:
  en: |
    You configure publish_report as a For each task whose nested task runs the publish_owner_report notebook. The task depends on compute_royalties.

    You need to complete the configuration of publish_report to meet royalties job requirement 5.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez publish_report comme une tâche For each dont la tâche imbriquée exécute le notebook publish_owner_report. La tâche dépend de compute_royalties.

    Vous devez compléter la configuration de publish_report pour satisfaire l'exigence 5 du job de redevances.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Task: publish_report (For each)
      Inputs:      [[inputs]]
      Concurrency: [[conc]]
      Nested task: publish_owner_report (Notebook)
        Parameter owner_id = [[ref]]
  slots:
    - id: inputs
      options:
        - { id: taskvalue, text: "{{tasks.compute_royalties.values.owners}}" }
        - { id: jobparam, text: "{{job.parameters.owners}}" }
        - { id: inputref, text: "{{input}}" }
    - id: conc
      options:
        - { id: c1, text: "1" }
        - { id: c4, text: "4" }
        - { id: c60, text: "60" }
    - id: ref
      options:
        - { id: input, text: "{{input}}" }
        - { id: inputkey, text: "{{input.owners}}" }
        - { id: taskvalueref, text: "{{tasks.compute_royalties.values.owners}}" }
answer:
  values: { inputs: taskvalue, conc: c4, ref: input }
explanation:
  correct:
    en: |
      The Inputs of a For each task can reference a task value set by an upstream task with the `{{tasks.<task_name>.values.<task_value_name>}}` syntax, so each night the loop receives the current list of owners. Concurrency sets how many iterations run in parallel (the default is 1), so 4 matches the limit of the portal. Because owners is an array of strings, {{input}} passes the current element, one owner ID, to each iteration.
    fr: |
      Les Inputs d'une tâche For each peuvent référencer une valeur de tâche définie par une tâche en amont avec la syntaxe `{{tasks.<task_name>.values.<task_value_name>}}` : chaque nuit, la boucle reçoit la liste actuelle des propriétaires. Concurrency définit le nombre d'itérations exécutées en parallèle (1 par défaut) : la valeur 4 correspond à la limite du portail. Comme owners est un tableau de chaînes, {{input}} transmet l'élément courant, un ID de propriétaire, à chaque itération.
  options:
    jobparam: { en: "A job parameter is set when the run starts; it cannot contain the list that compute_royalties computes during the run.", fr: "Un paramètre de job est défini au démarrage de l'exécution ; il ne peut pas contenir la liste que compute_royalties calcule pendant l'exécution." }
    inputref: { en: "{{input}} refers to the current element inside the nested task; it cannot be the source array of the loop.", fr: "{{input}} désigne l'élément courant dans la tâche imbriquée ; il ne peut pas être le tableau source de la boucle." }
    c1: { en: "A concurrency of 1 runs the reports one at a time, which is slower than the portal allows.", fr: "Une concurrence de 1 exécute les rapports un par un, plus lentement que ce que le portail autorise." }
    c60: { en: "Up to 60 parallel iterations would exceed the four simultaneous uploads that the portal accepts.", fr: "Jusqu'à 60 itérations parallèles dépasseraient les quatre chargements simultanés que le portail accepte." }
    inputkey: { en: "`{{input.<key>}}` reads a field of an object; the elements of owners are strings, not objects.", fr: "`{{input.<key>}}` lit un champ d'un objet ; les éléments d'owners sont des chaînes, pas des objets." }
    taskvalueref: { en: "This reference passes the whole array to every iteration instead of one owner ID.", fr: "Cette référence transmet le tableau entier à chaque itération au lieu d'un seul ID de propriétaire." }
references:
  - title: Use a For each task to run another task in a loop
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/for-each
