id: dp750-4d-itsm-alert
objective: "4.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has three Azure Databricks workspaces. Diagnostic settings stream their jobs log category to a Log Analytics workspace named **law-wg-ops**. Azure Monitor already has a connection to the IT service management (ITSM) tool of the operations team.

    You need to create an incident in the ITSM tool when a job run fails in any of the workspaces. The operations team must manage a single alert definition for the three workspaces.

    What should you configure?
  fr: |
    Woodgrove dispose de trois espaces de travail Azure Databricks. Des paramètres de diagnostic diffusent en continu leur catégorie de journaux jobs vers un espace de travail Log Analytics nommé **law-wg-ops**. Azure Monitor dispose déjà d'une connexion à l'outil de gestion des services informatiques (ITSM) de l'équipe des opérations.

    Vous devez créer un incident dans l'outil ITSM quand une exécution de job échoue dans l'un des espaces de travail. L'équipe des opérations doit gérer une seule définition d'alerte pour les trois espaces de travail.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A Failure notification on every job, sent to a webhook notification destination", fr: "Une notification Failure sur chaque job, envoyée à une destination de notification webhook" } }
    - { id: b, text: { en: "A log search alert rule on law-wg-ops, with an action group that has an ITSM action", fr: "Une règle d'alerte de recherche dans les journaux sur law-wg-ops, avec un groupe d'actions doté d'une action ITSM" } }
    - { id: c, text: { en: "An activity log alert on each workspace resource, with an action group that has an ITSM action", fr: "Une alerte du journal d'activité sur chaque ressource d'espace de travail, avec un groupe d'actions doté d'une action ITSM" } }
    - { id: d, text: { en: "A Databricks SQL alert in each workspace, sent to an email notification destination", fr: "Une alerte Databricks SQL dans chaque espace de travail, envoyée à une destination de notification e-mail" } }
answer: { optionId: b }
explanation:
  correct:
    en: The job events of the three workspaces are in law-wg-ops, so one log search alert rule scoped to that workspace can query DatabricksJobs for runFailed events. Its action group runs the ITSM action through the existing connection to open the incident.
    fr: "Les événements de jobs des trois espaces de travail sont dans law-wg-ops : une seule règle d'alerte de recherche dans les journaux limitée à cet espace de travail peut interroger DatabricksJobs pour les événements runFailed. Son groupe d'actions exécute l'action ITSM via la connexion existante pour ouvrir l'incident."
  options:
    a:
      en: Job notifications are configured job by job, which is not a single definition, and they do not use the Azure Monitor ITSM connection.
      fr: Les notifications de jobs se configurent job par job, ce qui n'est pas une définition unique, et elles n'utilisent pas la connexion ITSM d'Azure Monitor.
    c:
      en: The activity log records control-plane operations on the Azure resources, not the job runs inside the workspaces, and this needs one rule per workspace.
      fr: Le journal d'activité enregistre les opérations du plan de contrôle sur les ressources Azure, pas les exécutions de jobs dans les espaces de travail, et il faudrait une règle par espace de travail.
    d:
      en: One SQL alert per workspace is not a single definition, and email does not create an incident through the ITSM connection.
      fr: Une alerte SQL par espace de travail n'est pas une définition unique, et l'e-mail ne crée pas d'incident via la connexion ITSM.
references:
  - title: Create and manage action groups in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
  - title: Create Azure Monitor log search alert rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule
