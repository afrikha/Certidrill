id: dp750-4d-alert-condition
objective: "4.4.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The diagnostic logs of the Azure Databricks workspace **adb-litware** are streamed to a Log Analytics workspace. You create a log search alert rule that uses the following query.

    ```kusto
    DatabricksJobs
    | where ActionName == "runFailed"
    ```

    The aggregation granularity of the rule is 15 minutes. The rule must meet the following requirements:

    - Fire as soon as the query returns at least one runFailed event.
    - Run the query every 15 minutes.

    How should you configure the condition of the rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les journaux de diagnostic de l'espace de travail Azure Databricks **adb-litware** sont diffusés en continu vers un espace de travail Log Analytics. Vous créez une règle d'alerte de recherche dans les journaux qui utilise la requête suivante.

    ```kusto
    DatabricksJobs
    | where ActionName == "runFailed"
    ```

    La granularité d'agrégation de la règle est de 15 minutes. La règle doit répondre aux exigences suivantes :

    - Se déclencher dès que la requête renvoie au moins un événement runFailed.
    - Exécuter la requête toutes les 15 minutes.

    Comment devez-vous configurer la condition de la règle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Measure: [[measure]]
      Operator: [[op]]
      Threshold value: [[threshold]]
      Frequency of evaluation: [[freq]]
    fr: |
      Measure : [[measure]]
      Operator : [[op]]
      Threshold value : [[threshold]]
      Frequency of evaluation : [[freq]]
  slots:
    - id: measure
      options:
        - { id: rows, text: Table rows }
        - { id: billed, text: _BilledSize }
        - { id: time, text: TimeGenerated }
    - id: op
      options:
        - { id: gt, text: Greater than }
        - { id: lt, text: Less than }
        - { id: eq, text: Equal to }
    - id: threshold
      options:
        - { id: zero, text: "0" }
        - { id: one, text: "1" }
        - { id: fifteen, text: "15" }
    - id: freq
      options:
        - { id: m1, text: 1 minute }
        - { id: m15, text: 15 minutes }
        - { id: h1, text: 1 hour }
answer:
  values: { measure: rows, op: gt, threshold: zero, freq: m15 }
explanation:
  correct:
    en: Each row returned by the query is a runFailed event, so the measure is Table rows, counted over the 15-minute aggregation granularity. Greater than 0 fires as soon as one event appears. The frequency of evaluation, from 1 minute to 24 hours, sets how often the query runs, here every 15 minutes.
    fr: "Chaque ligne renvoyée par la requête est un événement runFailed : la mesure est Table rows, comptée sur la granularité d'agrégation de 15 minutes. Greater than 0 se déclenche dès qu'un événement apparaît. La fréquence d'évaluation, de 1 minute à 24 heures, définit la fréquence d'exécution de la requête, ici toutes les 15 minutes."
  options:
    billed: { en: "_BilledSize is the size of each record in bytes, not a number of failed runs.", fr: "_BilledSize est la taille de chaque enregistrement en octets, pas un nombre d'exécutions en échec." }
    time: { en: "TimeGenerated is a datetime column, not a measure to compare with a threshold.", fr: "TimeGenerated est une colonne de date, pas une mesure à comparer à un seuil." }
    lt: { en: "Less than would fire when there are few or no failures.", fr: "Less than se déclencherait quand il y a peu ou pas d'échecs." }
    eq: { en: "Equal to fires only for an exact count and misses other numbers of failures.", fr: "Equal to ne se déclenche que pour un nombre exact et manque les autres nombres d'échecs." }
    one: { en: "Greater than 1 needs at least two failures, so a single failed run would not fire the alert.", fr: "Greater than 1 exige au moins deux échecs : une seule exécution en échec ne déclencherait pas l'alerte." }
    fifteen: { en: "Greater than 15 ignores up to 15 failures in a window.", fr: "Greater than 15 ignore jusqu'à 15 échecs par fenêtre." }
references:
  - title: Create Azure Monitor log search alert rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule
