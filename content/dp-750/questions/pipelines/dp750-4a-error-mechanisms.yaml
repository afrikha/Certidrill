id: dp750-4a-error-mechanisms
objective: "4.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs a Lakeflow job that contains notebook tasks and a pipeline task. The pipeline loads the streaming table **northwind.silver.shipments**.

    You need to design the error handling for the following requirements.

    Which mechanism should you use for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute un job Lakeflow qui contient des tâches notebook et une tâche de pipeline. Le pipeline charge la table de diffusion en continu **northwind.silver.shipments**.

    Vous devez concevoir la gestion des erreurs pour répondre aux exigences suivantes.

    Quel mécanisme devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les mécanismes appropriés vers les exigences correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: retry, text: { en: "A retry policy on the task", fr: "Une stratégie de nouvelles tentatives sur la tâche" } }
    - { id: drop, text: { en: "An expectation with ON VIOLATION DROP ROW", fr: "Une attente avec ON VIOLATION DROP ROW" } }
    - { id: fail, text: { en: "An expectation with ON VIOLATION FAIL UPDATE", fr: "Une attente avec ON VIOLATION FAIL UPDATE" } }
    - { id: onefailed, text: { en: "A task with Run if set to At least one failed", fr: "Une tâche dont Run if vaut At least one failed" } }
    - { id: warn, text: { en: "An expectation without an ON VIOLATION clause", fr: "Une attente sans clause ON VIOLATION" } }
    - { id: alldone, text: { en: "A task with Run if set to All done", fr: "Une tâche dont Run if vaut All done" } }
  targets:
    - id: t1
      text: { en: "Rerun a notebook task automatically when it fails because the compute fails to start", fr: "Réexécuter automatiquement une tâche notebook quand elle échoue parce que le calcul ne parvient pas à démarrer" }
    - id: t2
      text: { en: "Keep shipments with a null tracking number out of the table, continue the update and report how many were removed", fr: "Écarter de la table les expéditions sans numéro de suivi, poursuivre la mise à jour et indiquer combien ont été écartées" }
    - id: t3
      text: { en: "Stop the update and leave the table unchanged when a shipment has a negative weight", fr: "Arrêter la mise à jour et laisser la table inchangée quand une expédition a un poids négatif" }
    - id: t4
      text: { en: "Run a compensation notebook only when one of the load tasks failed", fr: "Exécuter un notebook de compensation uniquement quand l'une des tâches de chargement a échoué" }
answer:
  mapping: { t1: retry, t2: drop, t3: fail, t4: onefailed }
explanation:
  correct:
    en: |
      A retry policy reruns a failed task, which absorbs transient failures. DROP ROW removes the invalid records before the write and logs the dropped count. FAIL UPDATE makes the update fail and atomically rolls back the table update. A task whose Run if is At least one failed runs only when a dependency failed; otherwise it is excluded.
    fr: |
      Une stratégie de nouvelles tentatives réexécute une tâche en échec, ce qui absorbe les échecs transitoires. DROP ROW supprime les enregistrements non valides avant l'écriture et journalise leur nombre. FAIL UPDATE fait échouer la mise à jour et annule de façon atomique la mise à jour de la table. Une tâche dont Run if vaut At least one failed ne s'exécute que si une dépendance a échoué ; sinon, elle est exclue.
  options:
    warn:
      en: |
        An expectation without ON VIOLATION only warns; the invalid rows are still written to the table.
      fr: |
        Une attente sans ON VIOLATION ne fait qu'avertir ; les lignes non valides sont tout de même écrites dans la table.
    alldone:
      en: |
        All done runs the task after every run of its dependencies, including successful ones.
      fr: |
        All done exécute la tâche après chaque exécution de ses dépendances, y compris quand elles réussissent.
references:
  - title: Manage data quality with pipeline expectations
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations
  - title: Configure task dependencies
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-if
