id: dp750-cs3c-test-types
objective: "4.3.3"
type: dragdrop
caseStudy: dp750-cs3c-southridge-video
difficulty: 2
status: draft
stem:
  en: |
    You are designing the testing strategy for development lifecycle requirement 3. The team plans the following checks.

    Which type of test should you use for each check? To answer, drag the appropriate test types to the correct checks. Each test type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez la stratégie de test de l'exigence 3 du cycle de vie du développement. L'équipe prévoit les vérifications suivantes.

    Quel type de test devez-vous utiliser pour chaque vérification ? Pour répondre, faites glisser les types de test appropriés vers les vérifications correspondantes. Chaque type de test peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: unit, text: { en: "Unit test", fr: "Test unitaire" } }
    - { id: integration, text: { en: "Integration test", fr: "Test d'intégration" } }
    - { id: e2e, text: { en: "End-to-end test", fr: "Test de bout en bout" } }
    - { id: uat, text: { en: "User acceptance test (UAT)", fr: "Test d'acceptation utilisateur (UAT)" } }
    - { id: perf, text: { en: "Performance test", fr: "Test de performances" } }
  targets:
    - { id: c1, text: { en: "Check, on every commit and with synthetic rows, that the royalty_rate() function of sv_common returns the expected rate", fr: "Vérifier, à chaque commit et avec des lignes synthétiques, que la fonction royalty_rate() de sv_common renvoie le taux attendu" } }
    - { id: c2, text: { en: "Check that the table written by ingest_views in a test catalog is read correctly by aggregate_views", fr: "Vérifier que la table écrite par ingest_views dans un catalogue de test est correctement lue par aggregate_views" } }
    - { id: c3, text: { en: "Run all the tasks of job-royalties from prepared input files to the published report before each release", fr: "Exécuter toutes les tâches de job-royalties, des fichiers d'entrée préparés jusqu'au rapport publié, avant chaque mise en production" } }
    - { id: c4, text: { en: "Have the royalty managers confirm in a staging environment that the report totals match the contracts of the title owners", fr: "Faire confirmer par les gestionnaires des redevances, dans un environnement intermédiaire, que les totaux du rapport correspondent aux contrats des propriétaires des titres" } }
answer:
  mapping: { c1: unit, c2: integration, c3: e2e, c4: uat }
explanation:
  correct:
    en: |
      Unit tests verify individual functions in isolation with synthetic data and are fast enough to run on every change. Integration tests verify that several components work together against real Databricks resources in a test catalog. End-to-end tests run a complete workflow from its inputs to its outputs and are slow, so they run before a release or in the deployment pipeline. UAT lets stakeholders confirm, in a staging environment that mirrors production, that the solution meets the business requirements.
    fr: |
      Les tests unitaires vérifient des fonctions individuelles de façon isolée avec des données synthétiques, et sont assez rapides pour s'exécuter à chaque modification. Les tests d'intégration vérifient que plusieurs composants fonctionnent ensemble sur de vraies ressources Databricks dans un catalogue de test. Les tests de bout en bout exécutent un flux de travail complet de ses entrées à ses sorties et sont lents : ils s'exécutent avant une mise en production ou dans le pipeline de déploiement. L'UAT permet aux parties prenantes de confirmer, dans un environnement intermédiaire qui reflète la production, que la solution répond aux exigences métier.
  options:
    perf:
      en: No check measures the duration or the throughput of the job under load.
      fr: Aucune vérification ne mesure la durée ou le débit du job sous charge.
references:
  - title: Implement testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy
  - title: Unit testing for Databricks notebooks
    url: https://learn.microsoft.com/en-us/azure/databricks/notebooks/testing
