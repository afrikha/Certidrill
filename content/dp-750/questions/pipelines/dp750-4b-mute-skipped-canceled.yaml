id: dp750-4b-mute-skipped-canceled
objective: "4.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A Lakeflow job named **contoso_web_events** runs every 5 minutes. It has a job-level email notification on the Failure event and no task-level notification.

    The team receives alerts for runs that are skipped while a previous run is still active, and for runs that operators cancel manually.

    You need the team to stop receiving alerts for skipped runs and canceled runs. The team must still receive an alert when a run fails.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un job Lakeflow nommé **contoso_web_events** s'exécute toutes les 5 minutes. Il possède une notification par e-mail au niveau du job sur l'événement Failure, et aucune notification au niveau des tâches.

    L'équipe reçoit des alertes pour les exécutions ignorées parce qu'une exécution précédente est encore active, et pour les exécutions que les opérateurs annulent manuellement.

    L'équipe ne doit plus recevoir d'alertes pour les exécutions ignorées et annulées. Elle doit toujours recevoir une alerte quand une exécution échoue.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Select Mute notifications until the last retry.", fr: "Sélectionner Mute notifications until the last retry." } }
    - { id: b, text: { en: "Select Mute notifications for canceled runs.", fr: "Sélectionner Mute notifications for canceled runs." } }
    - { id: c, text: { en: "Replace the Failure event with the Duration warning event.", fr: "Remplacer l'événement Failure par l'événement Duration warning." } }
    - { id: d, text: { en: "Select Mute notifications for skipped runs.", fr: "Sélectionner Mute notifications for skipped runs." } }
    - { id: e, text: { en: "Add the Success event to the notification.", fr: "Ajouter l'événement Success à la notification." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The job notification settings include Mute notifications for skipped runs and Mute notifications for canceled runs. Selecting both silences those two cases, while the Failure notification still fires for runs that fail. Because the job has no task-level notification, nothing else needs to be filtered.
    fr: |
      Les paramètres de notification du job comprennent Mute notifications for skipped runs et Mute notifications for canceled runs. Sélectionner les deux fait taire ces deux cas, tandis que la notification Failure se déclenche toujours pour les exécutions en échec. Le job n'ayant aucune notification de tâche, rien d'autre n'est à filtrer.
  options:
    a: { en: "This task notification option groups the alerts of retried attempts; it doesn't affect skipped or canceled runs.", fr: "Cette option des notifications de tâche regroupe les alertes des tentatives relancées ; elle ne concerne pas les exécutions ignorées ou annulées." }
    c: { en: "Without the Failure event, the team would no longer be alerted when a run fails.", fr: "Sans l'événement Failure, l'équipe ne serait plus alertée quand une exécution échoue." }
    e: { en: "The Success event adds alerts for successful runs instead of removing unwanted ones.", fr: "L'événement Success ajoute des alertes pour les exécutions réussies au lieu de supprimer les alertes indésirables." }
references:
  - title: Add notifications on a job
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications
