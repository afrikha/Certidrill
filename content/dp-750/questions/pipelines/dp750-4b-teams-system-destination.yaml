id: dp750-4b-teams-system-destination
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are the owner of a Lakeflow job named **fabrikam_claims_nightly**. You are not a workspace admin, and no system notification destination exists in the workspace yet.

    You need to post a message to the on-call channel in Microsoft Teams whenever a run of the job fails.

    What should you do?
  fr: |
    Vous êtes propriétaire d'un job Lakeflow nommé **fabrikam_claims_nightly**. Vous n'êtes pas administrateur de l'espace de travail, et aucune destination de notification système n'existe encore dans l'espace de travail.

    Vous devez publier un message dans le canal d'astreinte de Microsoft Teams chaque fois qu'une exécution du job échoue.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a job notification on the Duration warning event and set its destination to your email address.", fr: "Ajouter une notification de job sur l'événement Duration warning et définir votre adresse e-mail comme destination." } }
    - { id: b, text: { en: "Create an Azure Monitor action group that posts to Teams, and add its name as a tag on the job.", fr: "Créer un groupe d'actions Azure Monitor qui publie dans Teams, et ajouter son nom comme étiquette (tag) du job." } }
    - { id: c, text: { en: "Ask a workspace admin to create a Microsoft Teams system destination, and then select it for the Failure event of the job.", fr: "Demander à un administrateur de l'espace de travail de créer une destination système Microsoft Teams, puis la sélectionner pour l'événement Failure du job." } }
    - { id: d, text: { en: "Add a job notification on the Failure event and set its destination to the email address of the on-call engineer.", fr: "Ajouter une notification de job sur l'événement Failure et définir l'adresse e-mail de l'ingénieur d'astreinte comme destination." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Slack, Microsoft Teams, PagerDuty and HTTP webhook destinations are system destinations that an administrator creates in the admin settings (Edit system notifications). Once the destination exists, a user with CAN MANAGE or IS OWNER on the job selects it for the Failure event.
    fr: |
      Les destinations Slack, Microsoft Teams, PagerDuty et webhook HTTP sont des destinations système qu'un administrateur crée dans les paramètres d'administration (Edit system notifications). Une fois la destination créée, un utilisateur qui a CAN MANAGE ou IS OWNER sur le job la sélectionne pour l'événement Failure.
  options:
    a: { en: "Duration warning fires when a run exceeds its expected duration, not when it fails, and the message doesn't reach Teams.", fr: "Duration warning se déclenche quand une exécution dépasse sa durée attendue, pas quand elle échoue, et le message n'arrive pas dans Teams." }
    b: { en: "Job tags label the job and its clusters; they don't send notifications.", fr: "Les étiquettes (tags) qualifient le job et ses clusters ; elles n'envoient pas de notifications." }
    d: { en: "An email notification reaches one mailbox, not the Teams channel.", fr: "Une notification par e-mail arrive dans une boîte aux lettres, pas dans le canal Teams." }
references:
  - title: Add notifications on a job
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications
