id: dp750-4c-bundle-targets-design
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind is creating a Databricks Asset Bundle for a job named **daily_inventory**. The job must be deployed to a development workspace and to a production workspace that have different URLs. In each workspace, the job must write to a different catalog, `nw_dev` or `nw_prod`.

    The job definition must be written only once.

    What should you do?
  fr: |
    Northwind crée un bundle de ressources Databricks pour un job nommé **daily_inventory**. Le job doit être déployé sur un espace de travail de développement et sur un espace de travail de production dont les URL sont différentes. Dans chaque espace de travail, le job doit écrire dans un catalogue différent, `nw_dev` ou `nw_prod`.

    La définition du job ne doit être écrite qu'une seule fois.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Define the job in the top-level resources mapping, and add a sync mapping that lists one folder for each workspace", fr: "Définir le job dans le mappage resources de niveau supérieur, et ajouter un mappage sync qui liste un dossier par espace de travail" } }
    - { id: b, text: { en: "Create two databricks.yml files at the root of the project, one for each workspace, each with its own copy of the job", fr: "Créer deux fichiers databricks.yml à la racine du projet, un par espace de travail, chacun avec sa propre copie du job" } }
    - { id: c, text: { en: "Define the job in the top-level resources mapping, and pass the workspace URL and the catalog as job parameters at run time", fr: "Définir le job dans le mappage resources de niveau supérieur, et passer l'URL de l'espace de travail et le catalogue comme paramètres de job à l'exécution" } }
    - { id: d, text: { en: "Define the job in the top-level resources mapping, and add two targets that each set the workspace host and a catalog variable", fr: "Définir le job dans le mappage resources de niveau supérieur, et ajouter deux cibles qui définissent chacune l'hôte de l'espace de travail et une variable de catalogue" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Targets are the bundle's environments. Each target overrides only the settings it defines, such as `workspace.host` and the value of a custom variable, and inherits the rest, including the job defined once in the top-level `resources` mapping. You then deploy with `databricks bundle deploy -t <target>`."
    fr: "Les cibles sont les environnements du bundle. Chaque cible ne remplace que les paramètres qu'elle définit, comme `workspace.host` et la valeur d'une variable personnalisée, et hérite du reste, y compris du job défini une seule fois dans le mappage `resources` de niveau supérieur. Vous déployez ensuite avec `databricks bundle deploy -t <target>`."
  options:
    b: { en: "A bundle must contain exactly one databricks.yml file at its root, and copying the job breaks the single-definition requirement.", fr: "Un bundle doit contenir exactement un fichier databricks.yml à sa racine, et copier le job enfreint l'exigence d'une définition unique." }
    c: { en: "Job parameters are run-time values passed to tasks; they can't choose the workspace that the job is deployed to.", fr: "Les paramètres de job sont des valeurs d'exécution transmises aux tâches ; ils ne peuvent pas choisir l'espace de travail où le job est déployé." }
    a: { en: "The sync mapping selects which files are synchronized; it doesn't define deployment environments.", fr: "Le mappage sync sélectionne les fichiers synchronisés ; il ne définit pas d'environnements de déploiement." }
references:
  - title: Declarative Automation Bundles configuration
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/settings
