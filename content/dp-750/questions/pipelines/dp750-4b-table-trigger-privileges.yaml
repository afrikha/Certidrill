id: dp750-4b-table-trigger-privileges
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Lakeflow job named **northwind_shipments_kpi** is owned by a user named Ravi and runs as a service principal named **sp-logistics**. sp-logistics has no privileges on the `northwind_prod` catalog.

    You add a table update trigger that monitors the managed table `northwind_prod.silver.shipments`. The trigger fails to evaluate, and the job never starts.

    You need to fix the trigger. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Un job Lakeflow nommé **northwind_shipments_kpi** appartient à un utilisateur nommé Ravi et s'exécute sous un principal de service nommé **sp-logistics**. sp-logistics ne dispose d'aucun privilège sur le catalogue `northwind_prod`.

    Vous ajoutez un déclencheur Table update qui surveille la table managée `northwind_prod.silver.shipments`. L'évaluation du déclencheur échoue, et le job ne démarre jamais.

    Vous devez corriger le déclencheur. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant Ravi USE CATALOG on northwind_prod, USE SCHEMA on northwind_prod.silver and SELECT on the shipments table.", fr: "Accorder à Ravi USE CATALOG sur northwind_prod, USE SCHEMA sur northwind_prod.silver et SELECT sur la table shipments." } }
    - { id: b, text: { en: "Grant sp-logistics USE CATALOG on northwind_prod, USE SCHEMA on northwind_prod.silver and MODIFY on the shipments table.", fr: "Accorder à sp-logistics USE CATALOG sur northwind_prod, USE SCHEMA sur northwind_prod.silver et MODIFY sur la table shipments." } }
    - { id: c, text: { en: "Grant sp-logistics the CAN MANAGE permission on northwind_shipments_kpi.", fr: "Accorder à sp-logistics l'autorisation CAN MANAGE sur northwind_shipments_kpi." } }
    - { id: d, text: { en: "Grant sp-logistics USE CATALOG on northwind_prod, USE SCHEMA on northwind_prod.silver and SELECT on the shipments table.", fr: "Accorder à sp-logistics USE CATALOG sur northwind_prod, USE SCHEMA sur northwind_prod.silver et SELECT sur la table shipments." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A table update trigger is evaluated with the identity in the Run as field of the job, here sp-logistics, not with the owner. That principal needs SELECT on each monitored table plus USE CATALOG and USE SCHEMA on its catalog and schema; without them, the trigger fails to evaluate and the job doesn't run.
    fr: |
      Un déclencheur Table update est évalué avec l'identité du champ Run as du job, ici sp-logistics, et non avec le propriétaire. Ce principal a besoin de SELECT sur chaque table surveillée, ainsi que de USE CATALOG et USE SCHEMA sur son catalogue et son schéma ; sans eux, l'évaluation du déclencheur échoue et le job ne s'exécute pas.
  options:
    a: { en: "Ravi owns the job, but the trigger is evaluated with the Run as identity, sp-logistics.", fr: "Ravi est propriétaire du job, mais le déclencheur est évalué avec l'identité Run as, sp-logistics." }
    b: { en: "MODIFY grants write access and doesn't include SELECT, which the trigger requires.", fr: "MODIFY accorde l'écriture et n'inclut pas SELECT, dont le déclencheur a besoin." }
    c: { en: "A job permission doesn't grant any Unity Catalog privilege on the monitored table.", fr: "Une autorisation sur le job n'accorde aucun privilège Unity Catalog sur la table surveillée." }
references:
  - title: Trigger jobs when source tables are updated
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/trigger-table-update
