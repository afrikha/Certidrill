id: dp750-cs2a-file-trigger
objective: "4.2.2"
type: yesno_statements
caseStudy: dp750-cs2a-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You plan to configure a file arrival trigger on the job that ingests the port schedule files. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de configurer un déclencheur d'arrivée de fichier sur le job qui ingère les fichiers de calendriers portuaires. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The trigger can monitor the path /Volumes/wwi_prod/reference/landing/port_schedules/.
        fr: Le déclencheur peut surveiller le chemin /Volumes/wwi_prod/reference/landing/port_schedules/.
    - id: s2
      text:
        en: The trigger copies the new files into wwi_prod.reference.port_schedules before the job run starts, so the Auto Loader task only needs to process the files that the trigger rejected.
        fr: Le déclencheur copie les nouveaux fichiers dans wwi_prod.reference.port_schedules avant le démarrage de l'exécution du job ; la tâche Auto Loader n'a donc qu'à traiter les fichiers que le déclencheur a rejetés.
    - id: s3
      text:
        en: If you set **Wait after last change in seconds** to 180, a burst of files that lands over two minutes starts a single job run instead of one run per file.
        fr: Si vous définissez **Wait after last change in seconds** sur 180, une rafale de fichiers qui arrive sur deux minutes démarre une seule exécution du job au lieu d'une exécution par fichier.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: File arrival triggers monitor Unity Catalog volumes and external locations, including a subpath such as port_schedules/. The trigger only starts a job run; the job itself must ingest the files, typically with Auto Loader, which tracks the files already processed. Wait after last change in seconds is a debounce timer that restarts at each new file, so the run starts once the burst is over.
    fr: "Les déclencheurs d'arrivée de fichier surveillent les volumes et les emplacements externes Unity Catalog, y compris un sous-chemin tel que port_schedules/. Le déclencheur ne fait que démarrer une exécution du job ; le job lui-même doit ingérer les fichiers, généralement avec Auto Loader, qui suit les fichiers déjà traités. Wait after last change in seconds est un délai d'attente qui redémarre à chaque nouveau fichier : l'exécution démarre donc une fois la rafale terminée."
references:
  - title: Trigger jobs when new files arrive
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/file-arrival-triggers
