id: dp750-4a-at-least-one-region
objective: "4.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a driver notebook that runs **./01_bronze_txn** once for each of two regions, then runs **./02_silver_txn**. Each call of 01_bronze_txn returns the string OK when the region is loaded.

    The driver must meet the following requirements:

    - 02_silver_txn must run when at least one region was loaded.
    - 02_silver_txn must receive the loaded regions in its **regions** widget as a comma-separated list.
    - If no region was loaded, the driver must fail.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un notebook pilote qui exécute **./01_bronze_txn** une fois pour chacune de deux régions, puis exécute **./02_silver_txn**. Chaque appel de 01_bronze_txn renvoie la chaîne OK quand la région est chargée.

    Le pilote doit répondre aux exigences suivantes :

    - 02_silver_txn doit s'exécuter quand au moins une région a été chargée.
    - 02_silver_txn doit recevoir les régions chargées dans son widget **regions** sous forme de liste séparée par des virgules.
    - Si aucune région n'a été chargée, le pilote doit échouer.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    loaded = []
    for region in ["emea", "amer"]:
        try:
            status = dbutils.notebook.run("./01_bronze_txn", 1800, {"region": region})
            if status == "OK":
                loaded.append(region)
        except Exception as e:
            print(f"{region} failed: {e}")

    if [[cond]]:
        raise RuntimeError("No region was loaded")

    dbutils.notebook.run("./02_silver_txn", 1800, {"regions": [[arg]]})
  slots:
    - id: cond
      options:
        - { id: none, text: len(loaded) == 0 }
        - { id: lt2, text: len(loaded) < 2 }
        - { id: emea, text: '"emea" not in loaded' }
    - id: arg
      options:
        - { id: join, text: '",".join(loaded)' }
        - { id: list, text: loaded }
        - { id: count, text: str(len(loaded)) }
answer:
  values: { cond: none, arg: join }
explanation:
  correct:
    en: |
      The driver must fail only when the list of loaded regions is empty, so the test is `len(loaded) == 0`. The arguments of `dbutils.notebook.run()` set widget values, which must be strings, so the list is joined into a comma-separated string.
    fr: |
      Le pilote ne doit échouer que si la liste des régions chargées est vide : le test est donc `len(loaded) == 0`. Les arguments de `dbutils.notebook.run()` définissent des valeurs de widgets, qui doivent être des chaînes : la liste est donc jointe en une chaîne séparée par des virgules.
  options:
    lt2:
      en: |
        This fails the driver when one region failed, although one loaded region is enough.
      fr: |
        Ce test fait échouer le pilote quand une région a échoué, alors qu'une région chargée suffit.
    emea:
      en: |
        This fails the driver when only amer was loaded, which still meets the requirement.
      fr: |
        Ce test fait échouer le pilote quand seule amer a été chargée, ce qui satisfait pourtant l'exigence.
    list:
      en: |
        Parameters and return values of dbutils.notebook.run() must be strings, not Python lists.
      fr: |
        Les paramètres et valeurs de retour de dbutils.notebook.run() doivent être des chaînes, pas des listes Python.
    count:
      en: |
        The number of regions doesn't tell 02_silver_txn which regions were loaded.
      fr: |
        Le nombre de régions n'indique pas à 02_silver_txn quelles régions ont été chargées.
references:
  - title: Orchestrate Databricks notebooks and modularize code
    url: https://learn.microsoft.com/en-us/azure/databricks/notebooks/notebook-workflows
