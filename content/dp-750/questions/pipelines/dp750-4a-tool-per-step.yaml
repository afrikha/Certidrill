id: dp750-4a-tool-per-step
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is designing the data processing of its supplier data in the catalog **northwind_supply**. The team can use notebooks orchestrated by Lakeflow Jobs or a Lakeflow Spark Declarative Pipelines pipeline.

    What should the team use for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit le traitement des données de ses fournisseurs dans le catalogue **northwind_supply**. L'équipe peut utiliser des notebooks orchestrés par Lakeflow Jobs ou un pipeline des pipelines déclaratifs Lakeflow Spark.

    Que doit utiliser l'équipe pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - Profile a new supplier file interactively and chart the distribution of its columns: [[s1]]
      - Ingest the append-only JSON files that suppliers drop in a volume, processing each file once: [[s2]]
      - Maintain the delivery totals per supplier so that they stay correct when silver rows are updated or deleted: [[s3]]
      - After each load, move the processed files to an archive folder: [[s4]]
    fr: |
      - Profiler de façon interactive un nouveau fichier fournisseur et représenter la distribution de ses colonnes : [[s1]]
      - Ingérer les fichiers JSON en ajout seul que les fournisseurs déposent dans un volume, en traitant chaque fichier une seule fois : [[s2]]
      - Maintenir les totaux de livraison par fournisseur pour qu'ils restent exacts quand des lignes silver sont mises à jour ou supprimées : [[s3]]
      - Après chaque chargement, déplacer les fichiers traités vers un dossier d'archive : [[s4]]
  slots:
    - id: s1
      options:
        - { id: nb, text: { en: "A notebook", fr: "Un notebook" } }
        - { id: st, text: { en: "A pipeline streaming table", fr: "Une table de diffusion en continu du pipeline" } }
        - { id: mv, text: { en: "A pipeline materialized view", fr: "Une vue matérialisée du pipeline" } }
        - { id: tv, text: { en: "A pipeline temporary view", fr: "Une vue temporaire du pipeline" } }
    - id: s2
      options:
        - { id: nb, text: { en: "A notebook", fr: "Un notebook" } }
        - { id: st, text: { en: "A pipeline streaming table", fr: "Une table de diffusion en continu du pipeline" } }
        - { id: mv, text: { en: "A pipeline materialized view", fr: "Une vue matérialisée du pipeline" } }
        - { id: tv, text: { en: "A pipeline temporary view", fr: "Une vue temporaire du pipeline" } }
    - id: s3
      options:
        - { id: nb, text: { en: "A notebook", fr: "Un notebook" } }
        - { id: st, text: { en: "A pipeline streaming table", fr: "Une table de diffusion en continu du pipeline" } }
        - { id: mv, text: { en: "A pipeline materialized view", fr: "Une vue matérialisée du pipeline" } }
        - { id: tv, text: { en: "A pipeline temporary view", fr: "Une vue temporaire du pipeline" } }
    - id: s4
      options:
        - { id: nb, text: { en: "A notebook", fr: "Un notebook" } }
        - { id: st, text: { en: "A pipeline streaming table", fr: "Une table de diffusion en continu du pipeline" } }
        - { id: mv, text: { en: "A pipeline materialized view", fr: "Une vue matérialisée du pipeline" } }
        - { id: tv, text: { en: "A pipeline temporary view", fr: "Une vue temporaire du pipeline" } }
answer:
  values: { s1: nb, s2: st, s3: mv, s4: nb }
explanation:
  correct:
    en: |
      Interactive profiling and charts are notebook work, and moving files is a side effect that pipeline dataset code must not perform. A streaming table processes each record of an append-only source once, which suits file ingestion. A materialized view recomputes its results when its sources are updated or deleted, so aggregates stay correct.
    fr: |
      Le profilage interactif et les graphiques relèvent des notebooks, et déplacer des fichiers est un effet de bord que le code des jeux de données d'un pipeline ne doit pas produire. Une table de diffusion en continu traite une seule fois chaque enregistrement d'une source en ajout seul, ce qui convient à l'ingestion de fichiers. Une vue matérialisée recalcule ses résultats quand ses sources sont mises à jour ou supprimées : les agrégats restent exacts.
  options:
    tv:
      en: |
        A temporary view is computed on demand and isn't published, so it can't serve as a maintained table.
      fr: |
        Une vue temporaire est calculée à la demande et n'est pas publiée : elle ne peut pas servir de table maintenue.
