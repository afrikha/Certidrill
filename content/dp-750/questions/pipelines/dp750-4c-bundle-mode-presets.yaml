id: dp750-4c-bundle-mode-presets
objective: "4.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Databricks Asset Bundle that defines a job named **ingest_events** with `max_concurrent_runs: 1` and a Lakeflow Spark Declarative Pipelines pipeline named **events_pipeline**. The bundle has the following target.

    ```yaml
    targets:
      dev:
        default: true
        mode: development
        presets:
          jobs_max_concurrent_runs: 10
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un bundle de ressources Databricks qui définit un job nommé **ingest_events** avec `max_concurrent_runs: 1` et un pipeline Lakeflow Spark Declarative Pipelines nommé **events_pipeline**. Le bundle comporte la cible suivante.

    ```yaml
    targets:
      dev:
        default: true
        mode: development
        presets:
          jobs_max_concurrent_runs: 10
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When two deployments to the dev target start at the same time, the deployment lock makes the second one wait or fail."
        fr: "Quand deux déploiements sur la cible dev démarrent en même temps, le verrou de déploiement fait attendre ou échouer le second."
    - id: s2
      text:
        en: "After `databricks bundle deploy`, the ingest_events job allows at most one concurrent run."
        fr: "Après `databricks bundle deploy`, le job ingest_events autorise au plus une exécution simultanée."
    - id: s3
      text:
        en: "After `databricks bundle deploy`, events_pipeline is deployed with `development` set to true."
        fr: "Après `databricks bundle deploy`, events_pipeline est déployé avec `development` défini sur true."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Development mode disables the deployment lock (you re-enable it with `bundle.deployment.lock.enabled: true`). Presets override the default mode behavior, but a setting defined on an individual resource overrides presets, so ingest_events keeps `max_concurrent_runs: 1`. Development mode marks the related Lakeflow pipelines as `development: true`."
    fr: "Le mode développement désactive le verrou de déploiement (vous le réactivez avec `bundle.deployment.lock.enabled: true`). Les presets remplacent le comportement par défaut du mode, mais un paramètre défini sur une ressource l'emporte sur les presets : ingest_events conserve `max_concurrent_runs: 1`. Le mode développement marque les pipelines Lakeflow concernés avec `development: true`."
references:
  - title: Declarative Automation Bundles deployment modes
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
