id: dp750-4b-bundle-notifications-yaml
objective: "4.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You define a Lakeflow job named **adatum_orders_nightly** in a bundle. The job must meet the following requirements:

    - Email dataops@adatum.com when a run fails.
    - Email dataops@adatum.com when a run lasts longer than 90 minutes, without stopping the run.

    How should you complete the job definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez un job Lakeflow nommé **adatum_orders_nightly** dans un bundle. Le job doit respecter les exigences suivantes :

    - Envoyer un e-mail à dataops@adatum.com quand une exécution échoue.
    - Envoyer un e-mail à dataops@adatum.com quand une exécution dure plus de 90 minutes, sans arrêter l'exécution.

    Comment devez-vous compléter la définition du job ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    resources:
      jobs:
        adatum_orders_nightly:
          name: adatum_orders_nightly
          [[notif]]:
            on_failure:
              - dataops@adatum.com
            [[event]]:
              - dataops@adatum.com
          health:
            rules:
              - metric: [[metric]]
                op: GREATER_THAN
                value: 5400
          tasks:
            - task_key: load_orders
              notebook_task:
                notebook_path: ../src/load_orders.ipynb
  slots:
    - id: notif
      options:
        - { id: settings, text: notification_settings }
        - { id: email, text: email_notifications }
        - { id: webhook, text: webhook_notifications }
    - id: event
      options:
        - { id: duration, text: on_duration_warning_threshold_exceeded }
        - { id: backlog, text: on_streaming_backlog_exceeded }
        - { id: start, text: on_start }
    - id: metric
      options:
        - { id: backsec, text: STREAMING_BACKLOG_SECONDS }
        - { id: runsec, text: RUN_DURATION_SECONDS }
        - { id: backrec, text: STREAMING_BACKLOG_RECORDS }
answer:
  values: { notif: email, event: duration, metric: runsec }
explanation:
  correct:
    en: |
      `email_notifications` lists email addresses per event: `on_failure` for failed runs and `on_duration_warning_threshold_exceeded` for runs that exceed the duration warning threshold. The threshold is a `health` rule on `RUN_DURATION_SECONDS`, here 5,400 seconds (90 minutes). A warning only notifies; unlike `timeout_seconds`, it doesn't stop the run.
    fr: |
      `email_notifications` liste les adresses e-mail par événement : `on_failure` pour les exécutions en échec et `on_duration_warning_threshold_exceeded` pour celles qui dépassent le seuil d'avertissement de durée. Ce seuil est une règle `health` sur `RUN_DURATION_SECONDS`, ici 5 400 secondes (90 minutes). Un avertissement se contente de notifier ; contrairement à `timeout_seconds`, il n'arrête pas l'exécution.
  options:
    settings: { en: "notification_settings only holds options such as no_alert_for_skipped_runs; it has no recipients.", fr: "notification_settings ne contient que des options comme no_alert_for_skipped_runs ; il n'a pas de destinataires." }
    webhook: { en: "webhook_notifications calls system destination IDs, not email addresses.", fr: "webhook_notifications appelle des ID de destinations système, pas des adresses e-mail." }
    backlog: { en: "on_streaming_backlog_exceeded fires on streaming backlog thresholds, not on run duration.", fr: "on_streaming_backlog_exceeded se déclenche sur des seuils de backlog de streaming, pas sur la durée d'exécution." }
    start: { en: "on_start emails when a run starts.", fr: "on_start envoie un e-mail au démarrage d'une exécution." }
    backsec: { en: "STREAMING_BACKLOG_SECONDS measures the consumer delay of streams, not the run duration.", fr: "STREAMING_BACKLOG_SECONDS mesure le retard de consommation des flux, pas la durée d'exécution." }
    backrec: { en: "STREAMING_BACKLOG_RECORDS measures the offset lag of streams.", fr: "STREAMING_BACKLOG_RECORDS mesure le décalage d'offset des flux." }
references:
  - title: Declarative Automation Bundles resources
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/resources
  - title: Add notifications on a job
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications
