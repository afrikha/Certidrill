id: dp750-4a-sdp-favored
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is deciding, for each part of a new sales data platform in the catalog **litware_sales**, whether to implement it with notebooks orchestrated by Lakeflow Jobs or with Lakeflow Spark Declarative Pipelines.

    Which two requirements are better met by Lakeflow Spark Declarative Pipelines?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware détermine, pour chaque partie d'une nouvelle plateforme de données de ventes du catalogue **litware_sales**, s'il faut l'implémenter avec des notebooks orchestrés par Lakeflow Jobs ou avec les pipelines déclaratifs Lakeflow Spark.

    Quelles sont les deux exigences mieux satisfaites par les pipelines déclaratifs Lakeflow Spark ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Record the number of rows that violate each data quality rule without writing logging code", fr: "Enregistrer le nombre de lignes qui enfreignent chaque règle de qualité des données sans écrire de code de journalisation" } }
    - { id: b, text: { en: "Explore a new source interactively and chart the distribution of its values", fr: "Explorer une nouvelle source de façon interactive et représenter la distribution de ses valeurs" } }
    - { id: c, text: { en: "Update the bronze, silver and gold tables in an order derived from their dependencies", fr: "Mettre à jour les tables bronze, silver et gold dans un ordre déduit de leurs dépendances" } }
    - { id: d, text: { en: "Move each processed file to an archive folder after it has been loaded", fr: "Déplacer chaque fichier traité vers un dossier d'archive une fois qu'il a été chargé" } }
    - { id: e, text: { en: "Reuse without changes an existing PySpark script that ends with saveAsTable()", fr: "Réutiliser sans modification un script PySpark existant qui se termine par saveAsTable()" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Expectations record warn and drop metrics for each rule in the pipeline UI with no extra code. A pipeline analyzes the dependencies between its datasets and runs the updates in the right order, with maximum parallelism.
    fr: |
      Les attentes enregistrent les métriques warn et drop de chaque règle dans l'interface utilisateur du pipeline sans code supplémentaire. Un pipeline analyse les dépendances entre ses jeux de données et exécute les mises à jour dans le bon ordre, avec un parallélisme maximal.
  options:
    b:
      en: |
        Interactive exploration and charts are notebook work; a pipeline runs dataset definitions, not ad hoc analysis.
      fr: |
        L'exploration interactive et les graphiques relèvent des notebooks ; un pipeline exécute des définitions de jeux de données, pas des analyses ad hoc.
    d:
      en: |
        Moving files is a side effect, which doesn't belong in pipeline dataset code.
      fr: |
        Déplacer des fichiers est un effet de bord, qui n'a pas sa place dans le code des jeux de données d'un pipeline.
    e:
      en: |
        Pipeline code must not call saveAsTable(); the script would have to be rewritten as dataset definitions.
      fr: |
        Le code d'un pipeline ne doit pas appeler saveAsTable() ; il faudrait réécrire le script sous forme de définitions de jeux de données.
references:
  - title: Pipeline concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/concepts
  - title: Lakeflow pipelines Python language reference
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/developer/python-ref
