id: dp750-4d-external-table-maintenance
objective: "4.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a Unity Catalog external Delta table named **litware.finance.ledger_ext**. An application outside Azure Databricks reads the table from its storage path, so the table must remain an external table. Predictive optimization is enabled on the **litware** catalog.

    A streaming job appends small batches to the table, and a daily `MERGE` updates existing rows. After several months, queries on the table are slow because of many small files, and the storage used by the table keeps growing with files that the current version no longer references.

    You need to resolve both issues.

    What should you do?
  fr: |
    Litware dispose d'une table Delta externe Unity Catalog nommée **litware.finance.ledger_ext**. Une application extérieure à Azure Databricks lit la table depuis son chemin de stockage : la table doit donc rester une table externe. L'optimisation prédictive est activée sur le catalogue **litware**.

    Un job de streaming ajoute de petits lots à la table, et un `MERGE` quotidien met à jour des lignes existantes. Après plusieurs mois, les requêtes sur la table sont lentes à cause de nombreux petits fichiers, et le stockage utilisé par la table ne cesse d'augmenter avec des fichiers que la version actuelle ne référence plus.

    Vous devez résoudre les deux problèmes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run ALTER TABLE litware.finance.ledger_ext ENABLE PREDICTIVE OPTIMIZATION.", fr: "Exécuter ALTER TABLE litware.finance.ledger_ext ENABLE PREDICTIVE OPTIMIZATION." } }
    - { id: b, text: { en: "Schedule a job that runs OPTIMIZE and then VACUUM on the table.", fr: "Planifier un job qui exécute OPTIMIZE puis VACUUM sur la table." } }
    - { id: c, text: { en: "Set the table property delta.autoOptimize.autoCompact to true.", fr: "Définir la propriété de table delta.autoOptimize.autoCompact sur true." } }
    - { id: d, text: { en: "Schedule a job that runs VACUUM ... LITE on the table.", fr: "Planifier un job qui exécute VACUUM ... LITE sur la table." } }
answer: { optionId: b }
explanation:
  correct:
    en: Predictive optimization runs OPTIMIZE and VACUUM only on Unity Catalog managed tables, so an external table must be maintained by your own schedule. OPTIMIZE compacts the small files to speed up queries, and VACUUM then deletes the unreferenced data files older than the retention threshold to reduce storage.
    fr: "L'optimisation prédictive n'exécute OPTIMIZE et VACUUM que sur les tables managées Unity Catalog : une table externe doit être maintenue par votre propre planification. OPTIMIZE compacte les petits fichiers pour accélérer les requêtes, puis VACUUM supprime les fichiers de données non référencés plus anciens que le seuil de rétention pour réduire le stockage."
  options:
    a:
      en: Predictive optimization does not run on external tables, whatever the setting of the table or its catalog.
      fr: L'optimisation prédictive ne s'exécute pas sur les tables externes, quel que soit le paramètre de la table ou de son catalogue.
    c:
      en: Auto compaction combines small files after writes, but it never deletes unreferenced files, so storage keeps growing.
      fr: "Le compactage automatique regroupe les petits fichiers après les écritures, mais il ne supprime jamais les fichiers non référencés : le stockage continue d'augmenter."
    d:
      en: VACUUM removes unreferenced files but does not compact the small files that the current version uses, so queries stay slow.
      fr: "VACUUM supprime les fichiers non référencés mais ne compacte pas les petits fichiers utilisés par la version actuelle : les requêtes restent lentes."
references:
  - title: Predictive optimization for Unity Catalog managed tables
    url: https://learn.microsoft.com/en-us/azure/databricks/optimizations/predictive-optimization
  - title: Remove unused data files with vacuum
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/vacuum
