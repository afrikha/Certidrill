id: dp750-4c-jobs-continuous-restart
objective: "4.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Lakeflow Jobs job named **stream_telemetry** with a continuous trigger. After an expired credential caused several consecutive failures, the **Job details** pane shows that the job is in exponential backoff and that the next retry starts in 40 minutes. No run is active.

    You replaced the credential. You need the job to start a new run immediately and reset its retry period.

    What should you do?
  fr: |
    Fabrikam dispose d'un job Lakeflow Jobs nommé **stream_telemetry** avec un déclencheur continu. Après plusieurs échecs consécutifs dus à des informations d'identification expirées, le volet **Job details** indique que le job est en interruption exponentielle (exponential backoff) et que la prochaine tentative démarre dans 40 minutes. Aucune exécution n'est active.

    Vous avez remplacé les informations d'identification. Vous devez faire en sorte que le job démarre immédiatement une nouvelle exécution et réinitialise sa période de nouvelle tentative.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Raise the Maximum concurrent runs setting of the job", fr: "Augmenter le paramètre Maximum concurrent runs du job" } }
    - { id: b, text: { en: "Select Cancel all queued runs", fr: "Sélectionner Cancel all queued runs" } }
    - { id: c, text: { en: "Increase the maximum number of retries of the task", fr: "Augmenter le nombre maximal de nouvelles tentatives de la tâche" } }
    - { id: d, text: { en: "Select Restart run", fr: "Sélectionner Restart run" } }
answer: { optionId: d }
explanation:
  correct:
    en: "After consecutive failures, Lakeflow Jobs retries a continuous job with exponential backoff. Restart run cancels the active run if there is one, resets the retry period, and starts a new run. While the continuous trigger is active, Restart run replaces the Run now button."
    fr: "Après des échecs consécutifs, Lakeflow Jobs relance un job continu avec une interruption exponentielle. Restart run annule l'exécution active s'il y en a une, réinitialise la période de nouvelle tentative et démarre une nouvelle exécution. Tant que le déclencheur continu est actif, Restart run remplace le bouton Run now."
  options:
    b: { en: "No run is queued, and canceling queued runs doesn't start a new run.", fr: "Aucune exécution n'est en file d'attente, et annuler les exécutions en file d'attente ne démarre pas de nouvelle exécution." }
    c: { en: "Task retries apply inside a run; they don't shorten the backoff of the continuous job.", fr: "Les nouvelles tentatives de tâche s'appliquent dans une exécution ; elles ne raccourcissent pas l'interruption du job continu." }
    a: { en: "Databricks recommends a single concurrent run for continuous jobs, and the setting doesn't reset the backoff.", fr: "Databricks recommande une seule exécution simultanée pour les jobs continus, et ce paramètre ne réinitialise pas l'interruption." }
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
  - title: Trigger a single job run
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-now
