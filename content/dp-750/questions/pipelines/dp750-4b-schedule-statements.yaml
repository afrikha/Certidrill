id: dp750-4b-schedule-statements
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow job named **woodgrove_rates_refresh** has an active scheduled trigger. A run of the job is in progress.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un job Lakeflow nommé **woodgrove_rates_refresh** possède un déclencheur Scheduled actif. Une exécution du job est en cours.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you pause the trigger, the run in progress is canceled.
        fr: Si vous suspendez le déclencheur, l'exécution en cours est annulée.
    - id: s2
      text:
        en: Azure Databricks enforces at least 10 seconds between two runs started by the schedule, whatever the cron expression.
        fr: Azure Databricks impose au moins 10 secondes entre deux exécutions lancées par la planification, quelle que soit l'expression cron.
    - id: s3
      text:
        en: If you change the trigger to a Simple schedule that runs every 12 hours, you can choose the time of its first run.
        fr: Si vous remplacez le déclencheur par une planification Simple toutes les 12 heures, vous pouvez choisir l'heure de sa première exécution.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Pausing a trigger stops new runs from that trigger, and active runs continue. The scheduler enforces a minimum of 10 seconds between runs, regardless of the cron expression. A Simple schedule runs at an interval from a start time that the scheduler chooses; use an Advanced schedule to set the time.
    fr: |
      Suspendre un déclencheur arrête les nouvelles exécutions issues de ce déclencheur, et les exécutions actives se poursuivent. Le planificateur impose au minimum 10 secondes entre les exécutions, quelle que soit l'expression cron. Une planification Simple s'exécute à intervalle régulier à partir d'une heure choisie par le planificateur ; utilisez une planification Advanced pour fixer l'heure.
references:
  - title: Run jobs on a schedule
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/scheduled
  - title: Automate jobs with schedules and triggers
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/triggers
