id: dp750-4a-run-if-statuses
objective: "4.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a Lakeflow job named **inventory_nightly**. The tasks and their dependencies are shown in the following table. During last night's run, **ingest** succeeded and **transform** failed.

    Answer each prompt by selecting the task in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un job Lakeflow nommé **inventory_nightly**. Les tâches et leurs dépendances figurent dans le tableau suivant. Lors de l'exécution de la nuit dernière, **ingest** a réussi et **transform** a échoué.

    Répondez à chaque consigne en sélectionnant la tâche dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The task that ends with the status Upstream failed", fr: "La tâche qui se termine avec l'état Upstream failed" }
    - id: p2
      text: { en: "The task that is excluded and doesn't run", fr: "La tâche qui est exclue et ne s'exécute pas" }
  grid:
    header: [{ en: "Task", fr: "Tâche" }, Depends on, Run if]
    rows:
      - [{ text: ingest, area: ingest }, { text: "-" }, { text: "-" }]
      - [{ text: transform, area: transform }, { text: ingest }, { text: All succeeded }]
      - [{ text: publish, area: publish }, { text: transform }, { text: All succeeded }]
      - [{ text: alert_oncall, area: alert }, { text: transform }, { text: At least one failed }]
      - [{ text: fallback_load, area: fallback }, { text: ingest }, { text: All failed }]
      - [{ text: cleanup, area: cleanup }, { text: "publish, alert_oncall" }, { text: All done }]
answer:
  values: { p1: publish, p2: fallback }
explanation:
  correct:
    en: |
      publish requires all its dependencies to succeed; transform failed, so publish ends as Upstream failed. fallback_load runs only when all its dependencies failed, but ingest succeeded, so its condition isn't met and it is marked Excluded. alert_oncall runs because transform failed, and cleanup runs with All done once publish and alert_oncall are done, whatever their status.
    fr: |
      publish exige la réussite de toutes ses dépendances ; transform a échoué, donc publish se termine avec l'état Upstream failed. fallback_load ne s'exécute que si toutes ses dépendances ont échoué, or ingest a réussi : sa condition n'est pas remplie et elle est marquée Excluded. alert_oncall s'exécute parce que transform a échoué, et cleanup s'exécute avec All done une fois publish et alert_oncall terminées, quel que soit leur état.
references:
  - title: Configure task dependencies
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-if
