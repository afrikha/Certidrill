id: dp750-4b-notification-statements
objective: "4.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are configuring notifications for a multi-task Lakeflow job named **litware_supply_chain**. Some of its tasks have retry policies, and one task is a pipeline task.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez les notifications d'un job Lakeflow multitâche nommé **litware_supply_chain**. Certaines de ses tâches ont des stratégies de nouvelles tentatives, et l'une d'elles est une tâche de pipeline.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A job-level Success notification is sent when a run completes in the Succeeded with failures state.
        fr: Une notification Success au niveau du job est envoyée quand une exécution se termine à l'état Succeeded with failures.
    - id: s2
      text:
        en: A job-level Failure notification is sent each time a task attempt fails and the task is then retried.
        fr: Une notification Failure au niveau du job est envoyée chaque fois qu'une tentative de tâche échoue et que la tâche est ensuite relancée.
    - id: s3
      text:
        en: For the Failure event, the job can notify up to three system destinations.
        fr: Pour l'événement Failure, le job peut notifier jusqu'à trois destinations système.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A run that ends in Succeeded with failures counts as successful, so the Success event fires. Job-level notifications aren't sent when failed tasks are retried; use task notifications to hear about each failed task. A job or a task can use at most three system destinations for each notification event type.
    fr: |
      Une exécution terminée à l'état Succeeded with failures compte comme réussie : l'événement Success se déclenche. Les notifications au niveau du job ne sont pas envoyées quand des tâches en échec sont relancées ; utilisez des notifications de tâche pour être prévenu de chaque tâche en échec. Un job ou une tâche peut utiliser au plus trois destinations système par type d'événement de notification.
references:
  - title: Add notifications on a job
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications
