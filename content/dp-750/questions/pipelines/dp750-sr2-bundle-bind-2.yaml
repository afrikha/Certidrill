series: dp750-sr2-bundle-bind
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You generate the job configuration, bind the job, and deploy.
  fr: Vous générez la configuration du job, liez le job et déployez.
body:
  solution:
    en: |
      You run the following commands from the bundle root folder. The generated resource key is `nightly_sales`.

      ```bash
      databricks bundle generate job --existing-job-id 731994 --target prod
      databricks bundle deployment bind nightly_sales 731994 --target prod
      databricks bundle deploy --target prod
      ```
    fr: |
      Vous exécutez les commandes suivantes depuis le dossier racine du bundle. La clé de ressource générée est `nightly_sales`.

      ```bash
      databricks bundle generate job --existing-job-id 731994 --target prod
      databricks bundle deployment bind nightly_sales 731994 --target prod
      databricks bundle deploy --target prod
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      `bundle generate job` adds the configuration of the existing job to the bundle, and `bundle deployment bind` links the `nightly_sales` resource key to job 731994 for the `prod` target. The next `bundle deploy` therefore updates the existing job in place instead of creating a new one, so the job keeps its ID and its run history.
    fr: |
      `bundle generate job` ajoute la configuration du job existant au bundle, et `bundle deployment bind` lie la clé de ressource `nightly_sales` au job 731994 pour la cible `prod`. Le `bundle deploy` suivant met donc à jour le job existant sur place au lieu d'en créer un nouveau : le job conserve son ID et son historique d'exécutions.
references:
  - title: Migrate existing resources to a bundle
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/migrate-resources
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
