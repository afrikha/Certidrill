id: dp750-4a-driver-timeout-caught
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a notebook task that runs the following driver notebook. The weather enrichment is optional, but the gold load is required.

    ```python
    try:
        dbutils.notebook.run("./02_enrich_weather", 600, {"run_date": run_date})
    except Exception as e:
        print(f"Enrichment skipped: {e}")

    dbutils.notebook.run("./03_gold_flights", 1800, {"run_date": run_date})
    ```

    Today, 02_enrich_weather would need 15 minutes to complete, and 03_gold_flights completes successfully in 10 minutes.

    What is the result of the run?
  fr: |
    Tailspin Toys dispose d'une tâche notebook qui exécute le notebook pilote suivant. L'enrichissement météo est facultatif, mais le chargement gold est obligatoire.

    ```python
    try:
        dbutils.notebook.run("./02_enrich_weather", 600, {"run_date": run_date})
    except Exception as e:
        print(f"Enrichment skipped: {e}")

    dbutils.notebook.run("./03_gold_flights", 1800, {"run_date": run_date})
    ```

    Aujourd'hui, 02_enrich_weather aurait besoin de 15 minutes pour se terminer, et 03_gold_flights se termine avec succès en 10 minutes.

    Quel est le résultat de l'exécution ?
body:
  options:
    - id: a
      text: { en: "The driver waits 15 minutes for 02_enrich_weather to finish, then runs 03_gold_flights, and the task succeeds.", fr: "Le pilote attend 15 minutes que 02_enrich_weather se termine, puis exécute 03_gold_flights, et la tâche réussit." }
    - id: b
      text: { en: "The call to 02_enrich_weather raises an exception after 10 minutes, the driver then runs 03_gold_flights, and the task succeeds.", fr: "L'appel à 02_enrich_weather lève une exception au bout de 10 minutes, le pilote exécute ensuite 03_gold_flights, et la tâche réussit." }
    - id: c
      text: { en: "The call to 02_enrich_weather times out after 10 minutes, the task fails, and 03_gold_flights doesn't run.", fr: "L'appel à 02_enrich_weather expire au bout de 10 minutes, la tâche échoue, et 03_gold_flights ne s'exécute pas." }
    - id: d
      text: { en: "The driver runs 03_gold_flights after 10 minutes, and the task fails because a child notebook timed out.", fr: "Le pilote exécute 03_gold_flights au bout de 10 minutes, et la tâche échoue parce qu'un notebook enfant a expiré." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The second argument of `dbutils.notebook.run()` is a timeout in seconds, and the call throws an exception when the notebook doesn't finish in time. The except block catches it, so the driver goes on to 03_gold_flights. Because no exception escapes the driver, the task ends as succeeded.
    fr: |
      Le deuxième argument de `dbutils.notebook.run()` est un délai d'expiration en secondes, et l'appel lève une exception quand le notebook ne se termine pas à temps. Le bloc except l'intercepte : le pilote passe donc à 03_gold_flights. Comme aucune exception ne sort du pilote, la tâche se termine avec succès.
  options:
    a:
      en: |
        The timeout of 600 seconds applies to the call; the driver doesn't wait for the child beyond it.
      fr: |
        Le délai de 600 secondes s'applique à l'appel ; le pilote n'attend pas l'enfant au-delà.
    c:
      en: |
        The timeout exception is caught by the except block, so it doesn't stop the driver.
      fr: |
        L'exception de dépassement du délai est interceptée par le bloc except : elle n'arrête pas le pilote.
    d:
      en: |
        The task status depends on whether the driver notebook raises an exception; a caught exception doesn't make the task fail.
      fr: |
        L'état de la tâche dépend de la levée d'une exception par le notebook pilote ; une exception interceptée ne fait pas échouer la tâche.
references:
  - title: Orchestrate Databricks notebooks and modularize code
    url: https://learn.microsoft.com/en-us/azure/databricks/notebooks/notebook-workflows
