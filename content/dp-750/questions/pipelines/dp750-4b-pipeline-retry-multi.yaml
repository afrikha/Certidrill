id: dp750-4b-pipeline-retry-multi
objective: "4.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You maintain a Lakeflow Spark Declarative Pipeline named **adatum_billing_sdp** in triggered mode. Its updates are started by a Lakeflow job in production, and developers also run updates from the pipeline editor. No retry property is set in the pipeline configuration.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un pipeline déclaratif Lakeflow Spark nommé **adatum_billing_sdp** en mode déclenché. En production, ses mises à jour sont lancées par un job Lakeflow, et les développeurs exécutent aussi des mises à jour depuis l'éditeur de pipeline. Aucune propriété de nouvelle tentative n'est définie dans la configuration du pipeline.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "When the job starts an update, the runtime restarts the cluster for recoverable errors such as stale credentials.", fr: "Quand le job lance une mise à jour, le runtime redémarre le cluster pour les erreurs récupérables, comme des informations d'identification périmées." } }
    - { id: b, text: { en: "Updates that developers start with Run now from the editor are retried automatically up to five times.", fr: "Les mises à jour que les développeurs lancent avec Run now depuis l'éditeur sont relancées automatiquement jusqu'à cinq fois." } }
    - { id: c, text: { en: "Automatic retries apply only if the pipeline task of the job has a retry policy.", fr: "Les nouvelles tentatives automatiques ne s'appliquent que si la tâche de pipeline du job a une stratégie de nouvelles tentatives." } }
    - { id: d, text: { en: "After a retryable failure, a flow is attempted up to three times in total, including the original attempt.", fr: "Après un échec réessayable, un flux est tenté jusqu'à trois fois au total, tentative initiale comprise." } }
    - { id: e, text: { en: "A Validate update is retried until it succeeds.", fr: "Une mise à jour Validate est relancée jusqu'à ce qu'elle réussisse." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Updates started from a job or the Pipelines API use automatic retry and restart: the cluster is restarted for recoverable errors such as memory leaks or stale credentials. `pipelines.maxFlowRetryAttempts` defaults to two retries, so a flow runs up to three times including the original attempt.
    fr: |
      Les mises à jour lancées depuis un job ou l'API Pipelines utilisent la relance et le redémarrage automatiques : le cluster est redémarré pour les erreurs récupérables comme les fuites de mémoire ou les informations d'identification périmées. `pipelines.maxFlowRetryAttempts` vaut deux nouvelles tentatives par défaut : un flux s'exécute jusqu'à trois fois, tentative initiale comprise.
  options:
    b: { en: "Run now from the editor of a triggered pipeline uses fast-start debugging behavior, which disables pipeline retries so that errors surface immediately.", fr: "Run now depuis l'éditeur d'un pipeline déclenché utilise le comportement de démarrage rapide pour le débogage, qui désactive les nouvelles tentatives pour faire apparaître les erreurs immédiatement." }
    c: { en: "These retries are performed by the pipeline runtime itself; no job retry policy is needed.", fr: "Ces nouvelles tentatives sont effectuées par le runtime du pipeline lui-même ; aucune stratégie de tentatives du job n'est nécessaire." }
    e: { en: "Retries aren't attempted for a Validate update.", fr: "Aucune nouvelle tentative n'est effectuée pour une mise à jour Validate." }
references:
  - title: Run a pipeline update
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/updates
  - title: Pipeline properties reference
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/properties
