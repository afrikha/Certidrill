id: dp750-cs3b-duration-alert
objective: "4.2.4"
type: single
caseStudy: dp750-cs3b-margies-travel
difficulty: 1
status: draft
stem:
  en: |
    You need to configure job-nightly-bookings to meet operations requirement 7. An administrator has already configured a system destination for the on-call engineer.

    What should you configure on the job?
  fr: |
    Vous devez configurer job-nightly-bookings pour satisfaire l'exigence d'exploitation 7. Un administrateur a déjà configuré une destination système pour l'ingénieur d'astreinte.

    Que devez-vous configurer sur le job ?
body:
  options:
    - { id: a, text: { en: "Set Timeout to 90 minutes and add a Failure notification to the system destination.", fr: "Définir Timeout sur 90 minutes et ajouter une notification Failure vers la destination système." } }
    - { id: b, text: { en: "Set Warning to 90 minutes and add a Duration Warning notification to the system destination.", fr: "Définir Warning sur 90 minutes et ajouter une notification Duration Warning vers la destination système." } }
    - { id: c, text: { en: "Set a streaming backlog threshold of 90 minutes and add a notification to the system destination.", fr: "Définir un seuil de backlog de streaming de 90 minutes et ajouter une notification vers la destination système." } }
    - { id: d, text: { en: "Set Maximum concurrent runs to 1 and add a Start notification to the system destination.", fr: "Définir Maximum concurrent runs sur 1 et ajouter une notification Start vers la destination système." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Warning field sets the expected duration of the job. When a run exceeds it, an event is raised, and a Duration Warning notification sends it to the configured destinations while the run continues.
    fr: |
      Le champ Warning définit la durée attendue du job. Quand une exécution la dépasse, un événement est déclenché, et une notification Duration Warning l'envoie aux destinations configurées pendant que l'exécution continue.
  options:
    a: { en: "When a run exceeds Timeout, its status is set to Timed Out, so the run does not continue.", fr: "Quand une exécution dépasse Timeout, son statut passe à Timed Out : l'exécution ne continue pas." }
    c: { en: "Streaming backlog thresholds monitor the backlog of streaming sources, not the duration of a batch run.", fr: "Les seuils de backlog de streaming surveillent le retard des sources de streaming, pas la durée d'une exécution batch." }
    d: { en: "A Start notification is sent when every run starts, not when a run lasts too long.", fr: "Une notification Start est envoyée au démarrage de chaque exécution, pas quand une exécution dure trop longtemps." }
references:
  - title: Add notifications on a job
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications
  - title: Configure and edit Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-job
