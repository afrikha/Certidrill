id: dp750-4c-test-uat-plan
objective: "4.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is building a monthly revenue reporting pipeline in Azure Databricks that writes `woodgrove.reporting.monthly_revenue`. Before the pipeline goes live, the finance team must confirm that the reported totals match the finance system within 1 %.

    You need to plan the user acceptance testing (UAT) of the pipeline.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank crée dans Azure Databricks un pipeline de rapports mensuels de chiffre d'affaires qui écrit `woodgrove.reporting.monthly_revenue`. Avant la mise en service du pipeline, l'équipe financière doit confirmer que les totaux publiés correspondent au système financier à 1 % près.

    Vous devez planifier les tests d'acceptation utilisateur (UAT) du pipeline.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Define the acceptance criteria with the finance stakeholders before development begins.", fr: "Définir les critères d'acceptation avec les parties prenantes financières avant le début du développement." } }
    - { id: b, text: { en: "Replace UAT with automated integration tests on a test schema.", fr: "Remplacer l'UAT par des tests d'intégration automatisés sur un schéma de test." } }
    - { id: c, text: { en: "Run the UAT scenarios on the synthetic fixtures of the unit tests.", fr: "Exécuter les scénarios UAT sur les fixtures synthétiques des tests unitaires." } }
    - { id: d, text: { en: "Let the finance team validate the totals in production after the release.", fr: "Laisser l'équipe financière valider les totaux en production après la mise en production." } }
    - { id: e, text: { en: "Create a staging environment that mirrors production for the business scenarios.", fr: "Créer un environnement intermédiaire (staging) identique à la production pour les scénarios métier." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "UAT checks business value rather than technical correctness. Planning it means agreeing on acceptance criteria with stakeholders before development, then providing a staging environment that mirrors production where stakeholders run realistic business scenarios with documented expected outcomes."
    fr: "L'UAT vérifie la valeur métier plutôt que l'exactitude technique. La planifier consiste à convenir des critères d'acceptation avec les parties prenantes avant le développement, puis à fournir un environnement intermédiaire identique à la production où elles exécutent des scénarios métier réalistes avec des résultats attendus documentés."
  options:
    c:
      en: "Synthetic fixtures check function logic; they can't show that real monthly totals match the finance system."
      fr: "Les fixtures synthétiques vérifient la logique des fonctions ; elles ne peuvent pas montrer que les vrais totaux mensuels correspondent au système financier."
    d:
      en: "Acceptance must happen before the pipeline goes live, in staging, not in production after the release."
      fr: "L'acceptation doit avoir lieu avant la mise en service, en staging, pas en production après la mise en production."
    b:
      en: "Integration tests check that components work together; they don't replace business stakeholders confirming the requirements."
      fr: "Les tests d'intégration vérifient que les composants fonctionnent ensemble ; ils ne remplacent pas la confirmation des exigences par les parties prenantes métier."
references:
  - title: Implement testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy
