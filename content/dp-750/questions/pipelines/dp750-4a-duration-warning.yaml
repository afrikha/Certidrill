id: dp750-4a-duration-warning
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Lakeflow job named **flights_hourly**. Its notebook task **load_flights** usually completes in 20 minutes, but sometimes it slows down because of a large backlog.

    You need to configure load_flights to meet the following requirements:

    - If the task runs for more than 45 minutes, the operations team must be notified, and the task must keep running.
    - If the task runs for more than 2 hours, it must be stopped.

    What should you configure on the load_flights task?
  fr: |
    Tailspin Toys dispose d'un job Lakeflow nommé **flights_hourly**. Sa tâche notebook **load_flights** se termine généralement en 20 minutes, mais elle ralentit parfois à cause d'un retard important.

    Vous devez configurer load_flights pour répondre aux exigences suivantes :

    - Si la tâche dure plus de 45 minutes, l'équipe d'exploitation doit être notifiée, et la tâche doit continuer à s'exécuter.
    - Si la tâche dure plus de 2 heures, elle doit être arrêtée.

    Que devez-vous configurer sur la tâche load_flights ?
body:
  options:
    - id: a
      text: { en: "A Run duration warning of 45 minutes with a notification, and a Timeout of 120 minutes", fr: "Un avertissement Run duration de 45 minutes avec une notification, et un Timeout de 120 minutes" }
    - id: b
      text: { en: "A Run duration warning of 120 minutes with a notification, and a Timeout of 45 minutes", fr: "Un avertissement Run duration de 120 minutes avec une notification, et un Timeout de 45 minutes" }
    - id: c
      text: { en: "A Run duration warning of 45 minutes with a notification, and no Timeout", fr: "Un avertissement Run duration de 45 minutes avec une notification, et aucun Timeout" }
    - id: d
      text: { en: "A Timeout of 45 minutes with a failure notification, and a retry policy with one retry", fr: "Un Timeout de 45 minutes avec une notification d'échec, et une stratégie d'une nouvelle tentative" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Warning value of the Run duration metric sets the expected completion time; when a run exceeds it, an event is triggered that can send a notification while the task continues. The Timeout field sets the maximum duration; a task that doesn't finish in that time is stopped with the status Timed Out.
    fr: |
      La valeur Warning de la métrique Run duration définit la durée d'exécution attendue ; quand une exécution la dépasse, un événement est déclenché et peut envoyer une notification pendant que la tâche continue. Le champ Timeout définit la durée maximale ; une tâche qui ne se termine pas dans ce délai est arrêtée avec l'état Timed Out.
  options:
    d:
      en: |
        A 45-minute timeout stops the task instead of letting it continue, and the retry restarts the work.
      fr: |
        Un délai de 45 minutes arrête la tâche au lieu de la laisser continuer, et la nouvelle tentative recommence le travail.
    b:
      en: |
        The values are reversed; the task would be stopped at 45 minutes and the warning would never fire.
      fr: |
        Les valeurs sont inversées ; la tâche serait arrêtée à 45 minutes et l'avertissement ne se déclencherait jamais.
    c:
      en: |
        Without a timeout, nothing stops the task after 2 hours.
      fr: |
        Sans délai d'expiration, rien n'arrête la tâche au bout de 2 heures.
references:
  - title: Configure and edit tasks in Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-task
