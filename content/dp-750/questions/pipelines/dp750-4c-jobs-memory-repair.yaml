id: dp750-4c-jobs-memory-repair
objective: "4.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Lakeflow Jobs job named **claims_daily** with six tasks that share a job cluster named `claims_cluster`. In today's run, the task `score_claims` failed with executor out-of-memory errors after the data volume doubled. The tasks upstream of `score_claims` succeeded.

    You need to complete today's run without rerunning the tasks that succeeded, and prevent the same error.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un job Lakeflow Jobs nommé **claims_daily** avec six tâches qui partagent un cluster de job nommé `claims_cluster`. Dans l'exécution d'aujourd'hui, la tâche `score_claims` a échoué avec des erreurs de mémoire insuffisante sur les exécuteurs après le doublement du volume de données. Les tâches en amont de `score_claims` ont réussi.

    Vous devez terminer l'exécution d'aujourd'hui sans réexécuter les tâches qui ont réussi, et empêcher que la même erreur se reproduise.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Raise the Maximum concurrent runs setting of the job.", fr: "Augmenter le paramètre Maximum concurrent runs du job." } }
    - { id: b, text: { en: "Open today's failed run and repair it.", fr: "Ouvrir l'exécution en échec d'aujourd'hui et la réparer." } }
    - { id: c, text: { en: "Select Run now with different settings on the job.", fr: "Sélectionner Run now with different settings sur le job." } }
    - { id: d, text: { en: "Select Restart run on the job.", fr: "Sélectionner Restart run sur le job." } }
    - { id: e, text: { en: "Edit the compute of the job to use larger worker instances for claims_cluster.", fr: "Modifier le calcul du job pour utiliser des instances de worker plus grandes pour claims_cluster." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "For insufficient compute, you change the cluster configuration, such as the workers or instance types, in the job's compute settings. A repair then reruns only the unsuccessful tasks and their dependents with the current settings; tasks that shared a job cluster get a new cluster (`claims_cluster_v1`) built from the current configuration."
    fr: "En cas de calcul insuffisant, vous modifiez la configuration du cluster, comme les workers ou les types d'instances, dans les paramètres de calcul du job. Une réparation réexécute ensuite uniquement les tâches non réussies et leurs dépendantes avec les paramètres actuels ; les tâches qui partageaient un cluster de job reçoivent un nouveau cluster (`claims_cluster_v1`) créé à partir de la configuration actuelle."
  options:
    c: { en: "Run now starts a new run; even with some tasks deselected, it doesn't complete today's failed run.", fr: "Run now démarre une nouvelle exécution ; même en désélectionnant des tâches, il ne termine pas l'exécution en échec d'aujourd'hui." }
    d: { en: "Restart run is for continuous jobs in exponential backoff.", fr: "Restart run concerne les jobs continus en interruption exponentielle." }
    a: { en: "Maximum concurrent runs fixes Skipped runs, not out-of-memory errors.", fr: "Maximum concurrent runs corrige les exécutions Skipped, pas les erreurs de mémoire insuffisante." }
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
