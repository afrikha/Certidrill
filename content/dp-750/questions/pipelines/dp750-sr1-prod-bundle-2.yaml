objective: "4.3.5"
type: series_yesno
series: dp750-sr1-prod-bundle
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You add a step that deploys the bundle without specifying a target.
  fr: Vous ajoutez une étape qui déploie le bundle sans spécifier de cible.
body:
  solution:
    en: |
      The pipeline step runs the following command:

      ```bash
      databricks bundle deploy
      ```
    fr: |
      L'étape du pipeline exécute la commande suivante :

      ```bash
      databricks bundle deploy
      ```
answer: { value: false }
explanation:
  correct:
    en: "Without `-t`, the CLI uses the target marked `default: true`, here dev. The job is deployed to the development workspace, its name gets the `[dev <user>]` prefix and its schedule is paused by `mode: development`."
    fr: "Sans `-t`, l'interface CLI utilise la cible marquée `default: true`, ici dev. Le travail est déployé dans l'espace de travail de développement, son nom reçoit le préfixe `[dev <user>]` et sa planification est suspendue par `mode: development`."
references:
  - title: Declarative Automation Bundles configuration
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/settings
  - title: Declarative Automation Bundles deployment modes
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
