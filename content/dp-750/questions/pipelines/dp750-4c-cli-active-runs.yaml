id: dp750-4c-cli-active-runs
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Databricks Asset Bundle that deploys a continuous ingestion pipeline and an hourly job to the `prod` target. A release pipeline deploys the bundle with the Databricks CLI.

    You need to ensure that a deployment never modifies the bundle's jobs or pipelines while one of them is running. When something is running, the release pipeline must stop with an error so that the team can schedule the deployment later.

    Which command should the release pipeline run?
  fr: |
    Contoso dispose d'un bundle de ressources Databricks qui déploie un pipeline d'ingestion continu et un job horaire sur la cible `prod`. Un pipeline de mise en production déploie le bundle avec l'interface CLI Databricks.

    Vous devez vous assurer qu'un déploiement ne modifie jamais les jobs ni les pipelines du bundle pendant que l'un d'eux s'exécute. Quand quelque chose s'exécute, le pipeline de mise en production doit s'arrêter avec une erreur, pour que l'équipe planifie le déploiement plus tard.

    Quelle commande le pipeline de mise en production doit-il exécuter ?
body:
  options:
    - { id: a, text: "databricks bundle deploy -t prod --fail-on-active-runs" }
    - { id: b, text: "databricks bundle deploy -t prod --force-lock" }
    - { id: c, text: "databricks bundle deploy -t prod --auto-approve" }
    - { id: d, text: "databricks bundle run -t prod --restart" }
answer: { optionId: a }
explanation:
  correct:
    en: "`--fail-on-active-runs` makes `bundle deploy` fail if jobs or pipelines of the deployment are running. The pipeline gets an error instead of updating resources that are in use."
    fr: "`--fail-on-active-runs` fait échouer `bundle deploy` si des jobs ou des pipelines du déploiement sont en cours d'exécution. Le pipeline reçoit une erreur au lieu de mettre à jour des ressources en cours d'utilisation."
  options:
    b: { en: "--force-lock removes the protection against concurrent deployments; it doesn't check for running jobs.", fr: "--force-lock supprime la protection contre les déploiements simultanés ; il ne vérifie pas les jobs en cours." }
    c: { en: "--auto-approve skips interactive approvals and deploys even if resources are running.", fr: "--auto-approve ignore les approbations interactives et déploie même si des ressources s'exécutent." }
    d: { en: "bundle run --restart restarts a running job; it doesn't deploy anything.", fr: "bundle run --restart redémarre un job en cours ; il ne déploie rien." }
references:
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
