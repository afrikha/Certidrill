id: dp750-4a-all-failed-page
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fourth Coffee has a Lakeflow job that loads the daily store sales into **fourthcoffee.bronze.store_sales** through two redundant notebook tasks: **ingest_api** reads the point-of-sale API, and **ingest_sftp** reads the files that the stores upload. Either task is enough to load the day's data.

    You add a notebook task named **page_oncall** that depends on ingest_api and ingest_sftp. page_oncall must run only when the day's data couldn't be loaded by either task.

    Which Run if condition should you set on page_oncall?
  fr: |
    Fourth Coffee dispose d'un job Lakeflow qui charge les ventes quotidiennes des magasins dans **fourthcoffee.bronze.store_sales** au moyen de deux tâches notebook redondantes : **ingest_api** lit l'API du système de caisse, et **ingest_sftp** lit les fichiers que chargent les magasins. L'une ou l'autre tâche suffit à charger les données du jour.

    Vous ajoutez une tâche notebook nommée **page_oncall** qui dépend de ingest_api et de ingest_sftp. page_oncall ne doit s'exécuter que si aucune des deux tâches n'a pu charger les données du jour.

    Quelle condition Run if devez-vous définir sur page_oncall ?
body:
  options:
    - id: a
      text: At least one failed
    - id: b
      text: None failed
    - id: c
      text: All done
    - id: d
      text: All failed
answer: { optionId: d }
explanation:
  correct:
    en: |
      All failed runs the task only when every dependency failed; otherwise page_oncall is marked Excluded and doesn't run. Because one successful ingestion is enough, the on-call engineer is paged only when both failed.
    fr: |
      All failed n'exécute la tâche que si toutes ses dépendances ont échoué ; sinon, page_oncall est marquée Excluded et ne s'exécute pas. Comme une seule ingestion réussie suffit, l'ingénieur d'astreinte n'est appelé que si les deux ont échoué.
  options:
    a:
      en: |
        At least one failed would page the on-call engineer when only one ingestion failed, although the other one loaded the data.
      fr: |
        At least one failed appellerait l'ingénieur d'astreinte quand une seule ingestion a échoué, alors que l'autre a chargé les données.
    b:
      en: |
        None failed runs the task when no dependency failed, which is the opposite of the requirement.
      fr: |
        None failed exécute la tâche quand aucune dépendance n'a échoué, ce qui est l'inverse de l'exigence.
    c:
      en: |
        All done runs the task after every run, whatever the results of the ingestions.
      fr: |
        All done exécute la tâche après chaque exécution, quels que soient les résultats des ingestions.
references:
  - title: Configure task dependencies
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-if
