id: dp750-4b-gitignore-outputs
objective: "4.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your team uses a Git folder connected to a GitHub repository. You need to meet the following requirements:

    - The cell outputs of the notebook **forecast_review** must be versioned with its code.
    - The file `local_settings.json`, which is created on each developer's machine and was never committed, must stay out of the repository.
    - The team needs to know what happens to `old_secrets.json`, which was committed last month, if it is added to the same ignore file.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe utilise un dossier Git connecté à un dépôt GitHub. Vous devez respecter les exigences suivantes :

    - Les sorties des cellules du notebook **forecast_review** doivent être versionnées avec son code.
    - Le fichier `local_settings.json`, créé sur chaque poste de développeur et jamais validé, doit rester hors du dépôt.
    - L'équipe doit savoir ce qu'il advient de `old_secrets.json`, validé le mois dernier, s'il est ajouté au même fichier d'exclusion.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Store forecast_review in the [[fmt]] notebook format.

      Add local_settings.json to [[ign]].

      Adding old_secrets.json to the same file [[tracked]].
    fr: |
      Stocker forecast_review au format de notebook [[fmt]].

      Ajouter local_settings.json à [[ign]].

      L'ajout de old_secrets.json au même fichier [[tracked]].
  slots:
    - id: fmt
      options:
        - { id: src, text: { en: "source (.py)", fr: "source (.py)" } }
        - { id: ipynb, text: IPYNB }
        - { id: html, text: HTML }
    - id: ign
      options:
        - { id: gitignore, text: .gitignore }
        - { id: bundle, text: databricks.yml }
        - { id: req, text: requirements.txt }
    - id: tracked
      options:
        - { id: history, text: { en: "doesn't remove it from the repository or its history", fr: "ne le retire ni du dépôt ni de son historique" } }
        - { id: nextcommit, text: { en: "removes it from the repository at the next commit", fr: "le retire du dépôt au prochain commit" } }
        - { id: nextpull, text: { en: "deletes it from the remote branch at the next pull", fr: "le supprime de la branche distante au prochain pull" } }
answer:
  values: { fmt: ipynb, ign: gitignore, tracked: history }
explanation:
  correct:
    en: |
      Outputs of notebooks in source formats (`.py`, `.sql`, `.scala`, `.r`) aren't committed; to version outputs, use the IPYNB format and commit the notebook with its outputs. `.gitignore` keeps untracked files such as local settings out of the repository, but it only affects untracked files: an already committed file stays in the repository and its history until you remove it from Git, for example with git filter-repo.
    fr: |
      Les sorties des notebooks aux formats source (`.py`, `.sql`, `.scala`, `.r`) ne sont pas validées ; pour versionner les sorties, utilisez le format IPYNB et validez le notebook avec ses sorties. `.gitignore` garde hors du dépôt les fichiers non suivis, comme des paramètres locaux, mais il ne concerne que les fichiers non suivis : un fichier déjà validé reste dans le dépôt et son historique jusqu'à ce que vous le retiriez de Git, par exemple avec git filter-repo.
  options:
    src: { en: "Source-format notebooks don't store their outputs in the repository.", fr: "Les notebooks au format source ne stockent pas leurs sorties dans le dépôt." }
    html: { en: "HTML is an export format, not a notebook format that Git folders commit with its code.", fr: "HTML est un format d'exportation, pas un format de notebook que les dossiers Git valident avec son code." }
    bundle: { en: "databricks.yml is the bundle configuration file; it doesn't exclude files from Git.", fr: "databricks.yml est le fichier de configuration d'un bundle ; il n'exclut pas de fichiers de Git." }
    req: { en: "requirements.txt lists Python dependencies.", fr: "requirements.txt liste des dépendances Python." }
references:
  - title: Create and manage Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/git-operations-with-repos
  - title: Azure Databricks Git folder limits and reference
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/limits
