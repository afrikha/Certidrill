id: dp750-4c-spark-ui-diagnosis
objective: "4.4.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a Lakeflow Jobs job that runs a PySpark notebook on classic compute. The job now takes twice as long as last month, and its cost has increased. No task fails.

    You need to diagnose the performance problem by following the recommended Spark UI approach.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank dispose d'un job Lakeflow Jobs qui exécute un notebook PySpark sur un calcul classique. Le job dure désormais deux fois plus longtemps que le mois dernier, et son coût a augmenté. Aucune tâche n'échoue.

    Vous devez diagnostiquer le problème de performances en suivant l'approche recommandée avec l'interface utilisateur Spark.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "Open the Spark UI from the page of the compute.", fr: "Ouvrir l'interface utilisateur Spark depuis la page du calcul." } }
    - { id: timeline, text: { en: "Use the jobs timeline to identify the Spark job that takes the most time.", fr: "Utiliser la chronologie des jobs pour identifier le job Spark qui prend le plus de temps." } }
    - { id: stage, text: { en: "Open the longest stage of that job.", fr: "Ouvrir l'étape la plus longue de ce job." } }
    - { id: skew, text: { en: "Check the stage for skew or spill.", fr: "Vérifier si l'étape présente un déséquilibrage ou un déversement." } }
    - { id: io, text: { en: "Determine whether the stage is I/O bound.", fr: "Déterminer si l'étape est limitée par les E/S." } }
    - { id: restart, text: { en: "Restart the compute to reset the Spark UI.", fr: "Redémarrer le calcul pour réinitialiser l'interface utilisateur Spark." } }
    - { id: workers, text: { en: "Double the number of workers before investigating.", fr: "Doubler le nombre de workers avant d'enquêter." } }
answer:
  sequence: [ open, timeline, stage, skew, io ]
explanation:
  correct:
    en: "The Spark UI guide starts from the compute's Spark UI and the jobs timeline, which reveals failing jobs, gaps and the jobs that dominate the run. You then look at the longest stage, check its stage page for skew or spill, and, if it has neither, determine whether it is I/O bound before looking for other causes."
    fr: "Le guide de l'interface utilisateur Spark part de l'interface Spark du calcul et de la chronologie des jobs, qui révèle les jobs en échec, les écarts et les jobs qui dominent l'exécution. Vous examinez ensuite l'étape la plus longue, vérifiez sur sa page s'il y a déséquilibrage ou déversement et, en l'absence des deux, déterminez si elle est limitée par les E/S avant de chercher d'autres causes."
  options:
    restart: { en: "A restart erases the Spark UI history that you need for the diagnosis.", fr: "Un redémarrage efface l'historique de l'interface Spark dont vous avez besoin pour le diagnostic." }
    workers: { en: "Adding workers before diagnosing raises cost and may not address the cause.", fr: "Ajouter des workers avant le diagnostic augmente le coût et peut ne pas traiter la cause." }
references:
  - title: Diagnose cost and performance issues using the Spark UI
    url: https://learn.microsoft.com/en-us/azure/databricks/optimizations/spark-ui-guide/
  - title: Jobs timeline
    url: https://learn.microsoft.com/en-us/azure/databricks/optimizations/spark-ui-guide/jobs-timeline
