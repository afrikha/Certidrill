id: dp750-4d-alert-prereqs
objective: "4.4.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure Databricks workspace named **adb-fab-prod** on the Premium plan, a Log Analytics workspace named **law-fab-ops** and an action group named **ag-platform**. No diagnostic setting is configured on adb-fab-prod.

    You need to notify ag-platform by using Azure Monitor whenever someone permanently deletes a cluster in adb-fab-prod.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un espace de travail Azure Databricks nommé **adb-fab-prod** sur le plan Premium, d'un espace de travail Log Analytics nommé **law-fab-ops** et d'un groupe d'actions nommé **ag-platform**. Aucun paramètre de diagnostic n'est configuré sur adb-fab-prod.

    Vous devez avertir ag-platform à l'aide d'Azure Monitor chaque fois que quelqu'un supprime définitivement un cluster dans adb-fab-prod.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an activity log alert on adb-fab-prod for the Delete Azure Databricks workspace operation, and select ag-platform.", fr: "Créer une alerte du journal d'activité sur adb-fab-prod pour l'opération de suppression de l'espace de travail Azure Databricks, et sélectionner ag-platform." } }
    - { id: b, text: { en: "Create a diagnostic setting on adb-fab-prod that sends the clusters category to law-fab-ops.", fr: "Créer sur adb-fab-prod un paramètre de diagnostic qui envoie la catégorie clusters vers law-fab-ops." } }
    - { id: c, text: { en: "Create a diagnostic setting on adb-fab-prod that archives the clusters category to a storage account.", fr: "Créer sur adb-fab-prod un paramètre de diagnostic qui archive la catégorie clusters dans un compte de stockage." } }
    - { id: d, text: { en: "Create a log search alert rule scoped to law-fab-ops that queries DatabricksClusters for permanentDelete events, and select ag-platform.", fr: "Créer une règle d'alerte de recherche dans les journaux limitée à law-fab-ops qui interroge DatabricksClusters pour les événements permanentDelete, et sélectionner ag-platform." } }
    - { id: e, text: { en: "Enable verbose audit logs in the advanced settings of adb-fab-prod.", fr: "Activer les journaux d'audit détaillés dans les paramètres avancés d'adb-fab-prod." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Cluster events are audit events of the Azure Databricks workspace, so they must first be streamed to Log Analytics by a diagnostic setting with the clusters category; they land in the DatabricksClusters table. A log search alert rule on law-fab-ops then queries the permanentDelete events and notifies ag-platform.
    fr: "Les événements de cluster sont des événements d'audit de l'espace de travail Azure Databricks : ils doivent d'abord être diffusés vers Log Analytics par un paramètre de diagnostic avec la catégorie clusters ; ils arrivent dans la table DatabricksClusters. Une règle d'alerte de recherche dans les journaux sur law-fab-ops interroge ensuite les événements permanentDelete et avertit ag-platform."
  options:
    a:
      en: The activity log records operations on the workspace resource itself, such as its deletion, not the deletion of clusters inside it.
      fr: Le journal d'activité enregistre les opérations sur la ressource d'espace de travail elle-même, comme sa suppression, pas la suppression des clusters qu'il contient.
    c:
      en: A log search alert queries a Log Analytics workspace; it cannot evaluate logs archived in a storage account.
      fr: Une alerte de recherche dans les journaux interroge un espace de travail Log Analytics ; elle ne peut pas évaluer des journaux archivés dans un compte de stockage.
    e:
      en: Cluster events are part of the standard audit logs; verbose audit logs only add events such as notebook commands.
      fr: Les événements de cluster font partie des journaux d'audit standard ; les journaux d'audit détaillés n'ajoutent que des événements comme les commandes de notebook.
references:
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
  - title: Create Azure Monitor log search alert rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule
