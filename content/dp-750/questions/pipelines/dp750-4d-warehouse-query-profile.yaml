id: dp750-4d-warehouse-query-profile
objective: "4.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A dashboard query that reads **tailspin.gold.daily_bookings** runs on a serverless SQL warehouse named **wh-bi**. An analyst reports that one execution of the query took much longer than usual.

    You need to identify which operators of that execution used the most time and memory, and whether the query performed a shuffle.

    What should you use?
  fr: |
    Une requête de tableau de bord qui lit **tailspin.gold.daily_bookings** s'exécute sur un entrepôt SQL serverless nommé **wh-bi**. Un analyste signale qu'une exécution de la requête a duré bien plus longtemps que d'habitude.

    Vous devez identifier les opérateurs de cette exécution qui ont consommé le plus de temps et de mémoire, et déterminer si la requête a effectué un shuffle.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Monitoring tab of wh-bi", fr: "L'onglet Monitoring de wh-bi" } }
    - { id: b, text: { en: "The query profile of the execution, opened from Query History", fr: "Le profil de requête de l'exécution, ouvert depuis Query History" } }
    - { id: c, text: { en: "The system.billing.usage system table", fr: "La table système system.billing.usage" } }
    - { id: d, text: { en: "The DatabricksSQL table in a Log Analytics workspace", fr: "La table DatabricksSQL d'un espace de travail Log Analytics" } }
answer: { optionId: b }
explanation:
  correct:
    en: The query profile shows the DAG of one query execution with the time spent, the memory peak and the rows of each operator, and the Top operators list highlights the most expensive ones. Shuffle operators show where data was redistributed between executors. You open it from Query History > the query > See query profile.
    fr: Le profil de requête affiche le DAG d'une exécution avec le temps passé, le pic de mémoire et les lignes de chaque opérateur, et la liste Top operators met en évidence les plus coûteux. Les opérateurs Shuffle indiquent où les données ont été redistribuées entre les exécuteurs. Il s'ouvre depuis Query History > la requête > See query profile.
  options:
    a:
      en: The Monitoring tab shows warehouse-level counts of running and queued queries and clusters, not operator metrics of one execution.
      fr: L'onglet Monitoring affiche des compteurs de requêtes et de clusters au niveau de l'entrepôt, pas les métriques des opérateurs d'une exécution.
    c:
      en: The billing table reports DBU consumption, not how a query was executed.
      fr: La table de facturation indique la consommation de DBU, pas la façon dont une requête s'est exécutée.
    d:
      en: Diagnostic logs contain audit events about SQL warehouse operations; they do not contain execution metrics per operator.
      fr: Les journaux de diagnostic contiennent des événements d'audit sur les opérations des entrepôts SQL ; ils ne contiennent pas de métriques d'exécution par opérateur.
references:
  - title: Query profile
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/user/queries/query-profile
