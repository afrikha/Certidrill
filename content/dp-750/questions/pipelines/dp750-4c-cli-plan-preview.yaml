id: dp750-4c-cli-plan-preview
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware maintains a Databricks Asset Bundle with a `prod` target. A developer removed a job from the configuration and renamed a pipeline.

    Before anything is changed in the production workspace, you need to list the resources that a deployment to `prod` would create, update or delete.

    Which command should you run?
  fr: |
    Litware gère un bundle de ressources Databricks qui a une cible `prod`. Un développeur a retiré un job de la configuration et renommé un pipeline.

    Avant toute modification de l'espace de travail de production, vous devez lister les ressources qu'un déploiement sur `prod` créerait, mettrait à jour ou supprimerait.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "databricks bundle validate -t prod" }
    - { id: b, text: "databricks bundle summary -t prod" }
    - { id: c, text: "databricks bundle plan -t prod" }
    - { id: d, text: "databricks bundle open -t prod" }
answer: { optionId: c }
explanation:
  correct:
    en: "`bundle plan` computes the changes that a deployment would make, the resources to create, update or delete, without applying them. Its JSON output (`-o json`) can even be applied later with `bundle deploy --plan` on the direct deployment engine."
    fr: "`bundle plan` calcule les modifications qu'un déploiement apporterait, les ressources à créer, mettre à jour ou supprimer, sans les appliquer. Sa sortie JSON (`-o json`) peut même être appliquée ensuite avec `bundle deploy --plan` sur le moteur de déploiement direct."
  options:
    a: { en: "validate checks the configuration and resolved values but doesn't compare them with what is deployed.", fr: "validate vérifie la configuration et les valeurs résolues, mais ne les compare pas à ce qui est déployé." }
    b: { en: "summary describes what is already deployed, not the changes that the next deployment would make.", fr: "summary décrit ce qui est déjà déployé, pas les modifications que le prochain déploiement apporterait." }
    d: { en: "open opens a deployed resource in the workspace.", fr: "open ouvre une ressource déployée dans l'espace de travail." }
references:
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
