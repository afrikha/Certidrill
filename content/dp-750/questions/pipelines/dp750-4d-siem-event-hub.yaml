id: dp750-4d-siem-event-hub
objective: "4.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure Databricks workspace named **adb-proseware** on the Premium plan. The security team uses a third-party SIEM tool that runs outside Azure and ingests events from a streaming endpoint.

    You need to send the Azure Databricks diagnostic logs to the SIEM tool as they are produced.

    Which destination should you select in the diagnostic setting?
  fr: |
    Proseware dispose d'un espace de travail Azure Databricks nommé **adb-proseware** sur le plan Premium. L'équipe sécurité utilise un outil SIEM tiers qui s'exécute hors d'Azure et ingère des événements depuis un point de terminaison de streaming.

    Vous devez envoyer les journaux de diagnostic Azure Databricks vers l'outil SIEM au fur et à mesure de leur production.

    Quelle destination devez-vous sélectionner dans le paramètre de diagnostic ?
body:
  options:
    - { id: a, text: { en: "Send to Log Analytics workspace", fr: "Envoyer à l'espace de travail Log Analytics" } }
    - { id: b, text: { en: "Archive to a storage account", fr: "Archiver dans un compte de stockage" } }
    - { id: c, text: { en: "Stream to an event hub", fr: "Diffuser en continu vers un hub d'événements" } }
    - { id: d, text: { en: "Deliver to a Unity Catalog volume", fr: "Livrer dans un volume Unity Catalog" } }
answer: { optionId: c }
explanation:
  correct:
    en: Streaming to an event hub is the diagnostic setting destination meant for external tools such as a third-party SIEM, which read the events from Azure Event Hubs as they arrive. It requires an existing Event Hubs namespace and event hub.
    fr: La diffusion en continu vers un hub d'événements est la destination de paramètre de diagnostic prévue pour les outils externes comme un SIEM tiers, qui lisent les événements depuis Azure Event Hubs dès leur arrivée. Elle exige un espace de noms Event Hubs et un hub d'événements existants.
  options:
    a:
      en: Log Analytics stores the logs for KQL queries and Azure Monitor alerts inside Azure; it is not a streaming feed for an external tool.
      fr: Log Analytics stocke les journaux pour les requêtes KQL et les alertes Azure Monitor dans Azure ; ce n'est pas un flux continu pour un outil externe.
    b:
      en: A storage account archives the logs for long-term retention; it does not stream them.
      fr: Un compte de stockage archive les journaux pour une conservation de longue durée ; il ne les diffuse pas en continu.
    d:
      en: A Unity Catalog volume is not a destination of an Azure diagnostic setting.
      fr: Un volume Unity Catalog n'est pas une destination de paramètre de diagnostic Azure.
references:
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
