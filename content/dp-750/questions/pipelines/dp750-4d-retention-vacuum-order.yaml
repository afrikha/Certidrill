id: dp750-4d-retention-vacuum-order
objective: "4.4.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    The Delta table **adatum.claims.silver_claims** is an external table that is updated by frequent `MERGE` operations. Its table properties are at their default values.

    You need to meet the following requirements:

    - Auditors must be able to query any version of the table from the last 14 days.
    - Reduce the storage used by data files that the table no longer references.
    - Review the list of files that will be removed before anything is deleted.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    La table Delta **adatum.claims.silver_claims** est une table externe mise à jour par de fréquentes opérations `MERGE`. Ses propriétés de table sont à leurs valeurs par défaut.

    Vous devez répondre aux exigences suivantes :

    - Les auditeurs doivent pouvoir interroger n'importe quelle version de la table des 14 derniers jours.
    - Réduire le stockage utilisé par les fichiers de données que la table ne référence plus.
    - Examiner la liste des fichiers qui seront supprimés avant toute suppression.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: retention, text: { en: "Set the table property delta.deletedFileRetentionDuration to interval 14 days.", fr: "Définir la propriété de table delta.deletedFileRetentionDuration sur interval 14 days." } }
    - { id: dryrun, text: { en: "Run VACUUM adatum.claims.silver_claims DRY RUN.", fr: "Exécuter VACUUM adatum.claims.silver_claims DRY RUN." } }
    - { id: vacuum, text: { en: "Run VACUUM adatum.claims.silver_claims.", fr: "Exécuter VACUUM adatum.claims.silver_claims." } }
    - { id: logret, text: { en: "Set the table property delta.logRetentionDuration to interval 7 days.", fr: "Définir la propriété de table delta.logRetentionDuration sur interval 7 days." } }
    - { id: check, text: { en: "Set spark.databricks.delta.retentionDurationCheck.enabled to false.", fr: "Définir spark.databricks.delta.retentionDurationCheck.enabled sur false." } }
    - { id: optimize, text: { en: "Run OPTIMIZE adatum.claims.silver_claims.", fr: "Exécuter OPTIMIZE adatum.claims.silver_claims." } }
answer:
  sequence: [ retention, dryrun, vacuum ]
explanation:
  correct:
    en: VACUUM removes the unreferenced data files older than delta.deletedFileRetentionDuration (7 days by default), which would break time travel to versions 8 to 14 days old, so you raise the property to 14 days first. The log retention (30 days by default) already covers 14 days. VACUUM ... DRY RUN lists the files that would be deleted without deleting them, and the final VACUUM deletes them.
    fr: "VACUUM supprime les fichiers de données non référencés plus anciens que delta.deletedFileRetentionDuration (7 jours par défaut), ce qui empêcherait le voyage dans le temps vers les versions de 8 à 14 jours : vous augmentez donc d'abord la propriété à 14 jours. La rétention du journal (30 jours par défaut) couvre déjà 14 jours. VACUUM ... DRY RUN liste les fichiers qui seraient supprimés sans les supprimer, et le VACUUM final les supprime."
  options:
    logret: { en: "History older than the log retention is lost, so 7 days would prevent queries on versions from the last 14 days.", fr: "L'historique plus ancien que la rétention du journal est perdu : 7 jours empêcheraient d'interroger les versions des 14 derniers jours." }
    check: { en: "The safety check only blocks retention shorter than the 7-day minimum; 14 days does not trigger it.", fr: "La vérification de sécurité ne bloque qu'une rétention inférieure au minimum de 7 jours ; 14 jours ne la déclenchent pas." }
    optimize: { en: "OPTIMIZE compacts files for performance; it does not reduce storage and is not required here.", fr: "OPTIMIZE compacte les fichiers pour les performances ; il ne réduit pas le stockage et n'est pas nécessaire ici." }
references:
  - title: Work with table history
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/history
  - title: VACUUM
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-vacuum
