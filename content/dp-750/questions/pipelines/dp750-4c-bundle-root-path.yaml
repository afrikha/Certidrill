id: dp750-4c-bundle-root-path
objective: "4.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank is configuring a Databricks Asset Bundle named **claims-etl**. The job and pipeline definitions are stored in separate YAML files in the `resources/` folder of the project.

    The bundle must meet the following requirements:

    - The `databricks.yml` file must load every resource definition file of the `resources/` folder.
    - In production, all the files of the deployment must be stored under `/Workspace/Shared/.bundle/claims-etl/`, in a subfolder named after the target, instead of the home folder of the deploying identity.

    How should you complete the `databricks.yml` file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank configure un bundle de ressources Databricks nommé **claims-etl**. Les définitions du job et du pipeline sont stockées dans des fichiers YAML distincts du dossier `resources/` du projet.

    Le bundle doit répondre aux exigences suivantes :

    - Le fichier `databricks.yml` doit charger tous les fichiers de définition de ressources du dossier `resources/`.
    - En production, tous les fichiers du déploiement doivent être stockés sous `/Workspace/Shared/.bundle/claims-etl/`, dans un sous-dossier qui porte le nom de la cible, au lieu du dossier personnel de l'identité qui déploie.

    Comment devez-vous compléter le fichier `databricks.yml` ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    bundle:
      name: claims-etl

    [[inc]]:
      - resources/*.yml

    targets:
      prod:
        mode: production
        workspace:
          host: https://adb-2222222222222222.2.azuredatabricks.net
          [[root]]: /Workspace/Shared/.bundle/${bundle.name}/[[sub]]
        run_as:
          service_principal_name: 4d7a1c2e-5b6f-4a3d-9e8c-1f2a3b4c5d6e
  slots:
    - id: inc
      options:
        - { id: include, text: include }
        - { id: sync, text: sync }
        - { id: artifacts, text: artifacts }
        - { id: scripts, text: scripts }
    - id: root
      options:
        - { id: rootpath, text: root_path }
        - { id: artifactpath, text: artifact_path }
        - { id: statepath, text: state_path }
        - { id: resourcepath, text: resource_path }
    - id: sub
      options:
        - { id: target, text: "${bundle.target}" }
        - { id: user, text: "${workspace.current_user.short_name}" }
        - { id: host, text: "${workspace.host}" }
        - { id: jobid, text: "${resources.jobs.claims.id}" }
answer:
  values: { inc: include, root: rootpath, sub: target }
explanation:
  correct:
    en: "`include` lists the additional configuration files or globs that the bundle loads. `workspace.root_path` is the base folder of the deployment, by default `~/.bundle/${bundle.name}/${bundle.target}` in the home folder of the deploying identity; the other workspace paths are derived from it. `${bundle.target}` resolves to the name of the current target, here prod."
    fr: "`include` liste les fichiers de configuration ou les modèles glob supplémentaires que le bundle charge. `workspace.root_path` est le dossier de base du déploiement, par défaut `~/.bundle/${bundle.name}/${bundle.target}` dans le dossier personnel de l'identité qui déploie ; les autres chemins de l'espace de travail en découlent. `${bundle.target}` se résout en nom de la cible actuelle, ici prod."
  options:
    sync: { en: "sync selects which project files are synchronized; it doesn't load configuration files.", fr: "sync sélectionne les fichiers du projet à synchroniser ; il ne charge pas de fichiers de configuration." }
    artifacts: { en: "artifacts defines what to build before deployment, such as a wheel.", fr: "artifacts définit ce qu'il faut générer avant le déploiement, par exemple un wheel." }
    scripts: { en: "scripts defines named commands; it doesn't load resource definitions.", fr: "scripts définit des commandes nommées ; il ne charge pas de définitions de ressources." }
    artifactpath: { en: "artifact_path only sets where built artifacts are uploaded, not all the files of the deployment.", fr: "artifact_path ne définit que l'emplacement de chargement des artefacts générés, pas celui de tous les fichiers du déploiement." }
    statepath: { en: "state_path only sets where the deployment state is stored.", fr: "state_path ne définit que l'emplacement de stockage de l'état du déploiement." }
    resourcepath: { en: "resource_path doesn't set the base folder that holds all the files of the deployment.", fr: "resource_path ne définit pas le dossier de base qui contient tous les fichiers du déploiement." }
    user: { en: "The subfolder must be named after the target, not after the deploying user.", fr: "Le sous-dossier doit porter le nom de la cible, pas celui de l'utilisateur qui déploie." }
    host: { en: "workspace.host resolves to the workspace URL.", fr: "workspace.host se résout en URL de l'espace de travail." }
    jobid: { en: "This substitution resolves to a job ID, not to the target name.", fr: "Cette substitution se résout en ID de job, pas en nom de cible." }
references:
  - title: Declarative Automation Bundles configuration
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/settings
  - title: Substitutions and variables in Declarative Automation Bundles
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/variables
