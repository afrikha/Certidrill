id: dp750-4b-mute-until-last-retry
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow job named **northwind_pos_ingest** contains a task named **load_sales** that has a retry policy of 3 retries. The task has a task-level notification that emails dataops@northwind.com on the Failure event.

    When load_sales fails four times in a row, the team receives four emails.

    You need the team to receive a single email when load_sales has failed on its last retry. The retry policy must remain unchanged.

    What should you do?
  fr: |
    Un job Lakeflow nommé **northwind_pos_ingest** contient une tâche nommée **load_sales** dotée d'une stratégie de 3 nouvelles tentatives. La tâche possède une notification au niveau de la tâche qui envoie un e-mail à dataops@northwind.com sur l'événement Failure.

    Quand load_sales échoue quatre fois de suite, l'équipe reçoit quatre e-mails.

    L'équipe doit recevoir un seul e-mail lorsque load_sales a échoué lors de sa dernière tentative. La stratégie de nouvelles tentatives doit rester inchangée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select Mute notifications for canceled runs in the job notification settings.", fr: "Sélectionner Mute notifications for canceled runs dans les paramètres de notification du job." } }
    - { id: b, text: { en: "Select Mute notifications for skipped runs in the job notification settings.", fr: "Sélectionner Mute notifications for skipped runs dans les paramètres de notification du job." } }
    - { id: c, text: { en: "Set the number of retries of load_sales to 0.", fr: "Définir le nombre de nouvelles tentatives de load_sales sur 0." } }
    - { id: d, text: { en: "Select Mute notifications until the last retry in the notification of load_sales.", fr: "Sélectionner Mute notifications until the last retry dans la notification de load_sales." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Mute notifications until the last retry is a task notification option. With it, the failed attempts that are followed by a retry send nothing, and the failure of the last retry sends one notification.
    fr: |
      Mute notifications until the last retry est une option des notifications de tâche. Avec elle, les tentatives en échec suivies d'une nouvelle tentative n'envoient rien, et l'échec de la dernière tentative envoie une seule notification.
  options:
    a: { en: "This option filters notifications of canceled runs; the attempts here fail, they aren't canceled.", fr: "Cette option filtre les notifications des exécutions annulées ; ici, les tentatives échouent, elles ne sont pas annulées." }
    b: { en: "This option filters notifications of skipped runs, and job-level mute options don't filter task-level notifications.", fr: "Cette option filtre les notifications des exécutions ignorées, et les options de mise en sourdine du job ne filtrent pas les notifications de tâche." }
    c: { en: "Removing the retries changes the retry policy, which must remain unchanged.", fr: "Supprimer les nouvelles tentatives modifie la stratégie, qui doit rester inchangée." }
references:
  - title: Add notifications on a job
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications
