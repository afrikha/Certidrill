id: dp750-4d-optimize-behaviors
objective: "4.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The Delta table **tailspin.web.gold_sessions** uses liquid clustering on `session_date` and `country`. Analysts query the table all day. A job runs on Databricks Runtime 16.4 LTS and maintains the table.

    Which two statements about running `OPTIMIZE` on the table are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    La table Delta **tailspin.web.gold_sessions** utilise le liquid clustering sur `session_date` et `country`. Les analystes interrogent la table toute la journée. Un job s'exécute sur Databricks Runtime 16.4 LTS et assure la maintenance de la table.

    Quelles sont les deux affirmations vraies sur l'exécution d'`OPTIMIZE` sur la table ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Queries that run during OPTIMIZE are not interrupted and return the same results as before.", fr: "Les requêtes exécutées pendant OPTIMIZE ne sont pas interrompues et renvoient les mêmes résultats qu'avant." } }
    - { id: b, text: { en: "OPTIMIZE deletes from storage the small files that it replaces.", fr: "OPTIMIZE supprime du stockage les petits fichiers qu'il remplace." } }
    - { id: c, text: { en: "OPTIMIZE ... ZORDER BY (country) improves the colocation of the table data.", fr: "OPTIMIZE ... ZORDER BY (country) améliore le regroupement des données de la table." } }
    - { id: d, text: { en: "OPTIMIZE ... FULL rewrites all the data files, including data that was already clustered.", fr: "OPTIMIZE ... FULL réécrit tous les fichiers de données, y compris les données déjà regroupées." } }
    - { id: e, text: { en: "OPTIMIZE requires a WHERE clause on a clustering key.", fr: "OPTIMIZE exige une clause WHERE sur une clé de clustering." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: OPTIMIZE changes only the file layout, and readers use snapshot isolation, so running queries are not interrupted and see identical results. OPTIMIZE FULL (Databricks Runtime 16.0 and above) rewrites every data file, which reclusters data that was clustered before, for example after a change of clustering keys.
    fr: "OPTIMIZE ne modifie que l'organisation des fichiers, et les lecteurs utilisent l'isolation de capture instantanée : les requêtes en cours ne sont pas interrompues et voient des résultats identiques. OPTIMIZE FULL (Databricks Runtime 16.0 et versions ultérieures) réécrit tous les fichiers de données, ce qui regroupe de nouveau les données déjà regroupées, par exemple après un changement de clés de clustering."
  options:
    b:
      en: The replaced files are only removed from the transaction log; VACUUM deletes them from storage once they are older than the retention threshold.
      fr: Les fichiers remplacés sont seulement retirés du journal des transactions ; VACUUM les supprime du stockage une fois qu'ils dépassent le seuil de rétention.
    c:
      en: ZORDER BY cannot be used on a table that uses liquid clustering; OPTIMIZE clusters the data by the clustering keys.
      fr: ZORDER BY ne peut pas être utilisé sur une table qui utilise le liquid clustering ; OPTIMIZE regroupe les données selon les clés de clustering.
    e:
      en: WHERE is optional; without it, OPTIMIZE processes the whole table.
      fr: WHERE est facultatif ; sans cette clause, OPTIMIZE traite toute la table.
references:
  - title: OPTIMIZE
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-optimize
  - title: Optimize data file layout
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/optimize
