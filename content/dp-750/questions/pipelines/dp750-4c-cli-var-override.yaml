id: dp750-4c-cli-var-override
objective: "4.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Databricks Asset Bundle with the targets `dev` (default), `qa` and `prod`. The bundle declares a custom variable named `catalog`.

    A release pipeline must deploy the bundle to the `qa` target and set `catalog` to `qa_sales` on the command line. The pipeline runs without any user, so the deployment must not stop for an interactive approval.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un bundle de ressources Databricks avec les cibles `dev` (par défaut), `qa` et `prod`. Le bundle déclare une variable personnalisée nommée `catalog`.

    Un pipeline de mise en production doit déployer le bundle sur la cible `qa` et définir `catalog` sur `qa_sales` dans la ligne de commande. Le pipeline s'exécute sans utilisateur : le déploiement ne doit pas s'arrêter pour une approbation interactive.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    databricks bundle deploy [[t]] qa [[v]]="catalog=qa_sales" [[a]]
  slots:
    - id: t
      options:
        - { id: target, text: "-t" }
        - { id: profile, text: "-p" }
        - { id: select, text: "--select" }
        - { id: cluster, text: "-c" }
    - id: v
      options:
        - { id: var, text: "--var" }
        - { id: params, text: "--params" }
        - { id: nbparams, text: "--notebook-params" }
    - id: a
      options:
        - { id: auto, text: "--auto-approve" }
        - { id: force, text: "--force" }
        - { id: forcelock, text: "--force-lock" }
        - { id: nowait, text: "--no-wait" }
answer:
  values: { t: target, v: var, a: auto }
explanation:
  correct:
    en: "`-t` (`--target`) selects the qa target instead of the default one. `--var=\"name=value\"` sets a custom variable and takes precedence over every other way of setting it. `--auto-approve` skips the interactive approvals that a deployment might otherwise require."
    fr: "`-t` (`--target`) sélectionne la cible qa au lieu de la cible par défaut. `--var=\"name=value\"` définit une variable personnalisée et l'emporte sur toutes les autres façons de la définir. `--auto-approve` ignore les approbations interactives qu'un déploiement pourrait sinon demander."
  options:
    profile: { en: "-p selects an authentication profile of .databrickscfg, not a target.", fr: "-p sélectionne un profil d'authentification de .databrickscfg, pas une cible." }
    select: { en: "--select deploys only the specified resources.", fr: "--select ne déploie que les ressources indiquées." }
    cluster: { en: "-c overrides the cluster of the deployment with a cluster ID.", fr: "-c remplace le cluster du déploiement par un ID de cluster." }
    params: { en: "--params passes job parameters to bundle run, not variables to bundle deploy.", fr: "--params transmet des paramètres de job à bundle run, pas des variables à bundle deploy." }
    nbparams: { en: "--notebook-params passes parameters to notebook tasks of bundle run.", fr: "--notebook-params transmet des paramètres aux tâches de notebook de bundle run." }
    force: { en: "--force overrides blocking validations such as the Git branch check; it doesn't skip approvals.", fr: "--force contourne des validations bloquantes comme la vérification de branche Git ; il n'ignore pas les approbations." }
    forcelock: { en: "--force-lock forces the deployment lock after an interrupted deployment.", fr: "--force-lock force le verrou de déploiement après un déploiement interrompu." }
    nowait: { en: "--no-wait is an option of bundle run.", fr: "--no-wait est une option de bundle run." }
references:
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
  - title: Substitutions and variables in Declarative Automation Bundles
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/variables
