id: dp750-4d-diag-statements
objective: "4.4.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has an Azure Databricks workspace named **adb-wingtip** on the Premium plan. You plan to create a diagnostic setting that sends the jobs, clusters and notebook log categories to a Log Analytics workspace named **law-wingtip**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un espace de travail Azure Databricks nommé **adb-wingtip** sur le plan Premium. Vous prévoyez de créer un paramètre de diagnostic qui envoie les catégories de journaux jobs, clusters et notebook vers un espace de travail Log Analytics nommé **law-wingtip**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Databricks delivers each event to law-wingtip within 15 minutes after it occurs.
        fr: Azure Databricks livre chaque événement à law-wingtip dans les 15 minutes qui suivent.
    - id: s2
      text:
        en: The same diagnostic setting can also archive the selected categories to a storage account.
        fr: Le même paramètre de diagnostic peut aussi archiver les catégories sélectionnées dans un compte de stockage.
    - id: s3
      text:
        en: The diagnostic setting sends the standard output and error logs of the cluster drivers to law-wingtip.
        fr: Le paramètre de diagnostic envoie les journaux de sortie standard et d'erreur des pilotes de cluster vers law-wingtip.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Logs are typically available within 15 minutes, but Azure Databricks does not guarantee a delivery time frame. A diagnostic setting can have several destinations (Log Analytics, a storage account, an event hub) for the same categories. The categories contain audit events of the Azure Databricks services, such as job runs or cluster creation, not the stdout and stderr of the Spark driver.
    fr: "Les journaux sont en général disponibles en 15 minutes, mais Azure Databricks ne garantit aucun délai de livraison. Un paramètre de diagnostic peut avoir plusieurs destinations (Log Analytics, un compte de stockage, un hub d'événements) pour les mêmes catégories. Les catégories contiennent des événements d'audit des services Azure Databricks, comme les exécutions de jobs ou la création de clusters, pas les sorties stdout et stderr du pilote Spark."
references:
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
