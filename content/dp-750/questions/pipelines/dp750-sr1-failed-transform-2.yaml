stem:
  en: You repair last night's run of daily-sales.
  fr: Vous réparez l'exécution de la nuit dernière de daily-sales.
body:
  solution:
    en: You open last night's run of daily-sales, click **Repair run**, keep the tasks listed in the dialog and confirm the repair.
    fr: Vous ouvrez l'exécution de la nuit dernière de daily-sales, cliquez sur **Repair run**, conservez les tâches répertoriées dans la boîte de dialogue et confirmez la réparation.
answer: { value: true }
explanation:
  correct:
    en: A repair re-runs only the unsuccessful tasks of a multi-task run and the tasks that depend on them; successful tasks are not re-run. The unsuccessful tasks run with the current job and task settings, so transform uses the fixed notebook, and because transform overwrites its table, re-running it from the beginning creates no duplicates.
    fr: "Une réparation réexécute uniquement les tâches en échec d'une exécution multitâche et les tâches qui en dépendent ; les tâches réussies ne sont pas réexécutées. Les tâches en échec s'exécutent avec les paramètres actuels du travail et des tâches : transform utilise le notebook corrigé, et comme transform remplace le contenu de sa table, sa réexécution depuis le début ne crée pas de doublons."
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
