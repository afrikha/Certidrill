id: dp750-4b-pipeline-schedule-job
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Lakeflow Spark Declarative Pipeline named **contoso_orders_sdp** in triggered mode. It refreshes the streaming table `contoso_prod.silver.orders` and the materialized view `contoso_prod.gold.daily_sales`.

    You need the pipeline to run an update every day at 02:00. The solution must minimize compute cost outside the update.

    What should you do?
  fr: |
    Vous disposez d'un pipeline déclaratif Lakeflow Spark nommé **contoso_orders_sdp** en mode déclenché. Il actualise la table de diffusion en continu `contoso_prod.silver.orders` et la vue matérialisée `contoso_prod.gold.daily_sales`.

    Le pipeline doit exécuter une mise à jour tous les jours à 02:00. La solution doit réduire au minimum le coût du calcul en dehors de la mise à jour.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Switch the pipeline to continuous mode.", fr: "Passer le pipeline en mode continu." } }
    - { id: b, text: { en: "Create a job with a pipeline task for contoso_orders_sdp, and add a scheduled trigger at 02:00.", fr: "Créer un job avec une tâche de pipeline pour contoso_orders_sdp, et ajouter un déclencheur Scheduled à 02:00." } }
    - { id: c, text: { en: "Add a file arrival trigger on the volume that receives the source files.", fr: "Ajouter un déclencheur File arrival sur le volume qui reçoit les fichiers sources." } }
    - { id: d, text: { en: "Create a job with a pipeline task for contoso_orders_sdp, and add a continuous trigger.", fr: "Créer un job avec une tâche de pipeline pour contoso_orders_sdp, et ajouter un déclencheur Continuous." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A pipeline update is scheduled through a Lakeflow job: a pipeline task runs the update, and a scheduled trigger starts it at 02:00. In triggered mode, the update processes the available data and then stops, and an update started from a job also gets automatic retries.
    fr: |
      Une mise à jour de pipeline se planifie au moyen d'un job Lakeflow : une tâche de pipeline exécute la mise à jour, et un déclencheur Scheduled la lance à 02:00. En mode déclenché, la mise à jour traite les données disponibles puis s'arrête, et une mise à jour lancée depuis un job bénéficie aussi des nouvelles tentatives automatiques.
  options:
    a: { en: "Continuous mode keeps the pipeline running all the time, which costs compute outside 02:00.", fr: "Le mode continu garde le pipeline actif en permanence, ce qui coûte du calcul en dehors de 02:00." }
    c: { en: "A file arrival trigger starts a run whenever files arrive, not at 02:00.", fr: "Un déclencheur File arrival lance une exécution à chaque arrivée de fichiers, pas à 02:00." }
    d: { en: "A continuous trigger starts a new run as soon as the previous one ends, all day long.", fr: "Un déclencheur Continuous lance une nouvelle exécution dès la fin de la précédente, toute la journée." }
references:
  - title: Run jobs on a schedule
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/scheduled
  - title: Run a pipeline update
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/updates
