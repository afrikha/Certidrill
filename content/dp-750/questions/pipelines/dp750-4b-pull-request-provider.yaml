id: dp750-4b-pull-request-provider
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your team stores its Azure Databricks notebooks in an Azure DevOps repository. The `main` branch is protected: every change must be reviewed by another engineer before it reaches `main`.

    In your Git folder, you created the branch `feature/returns-dedup` from `main`, edited two notebooks, and selected **Commit & Push**.

    You need to get your changes into `main`.

    What should you do next?
  fr: |
    Votre équipe stocke ses notebooks Azure Databricks dans un dépôt Azure DevOps. La branche `main` est protégée : toute modification doit être revue par un autre ingénieur avant d'atteindre `main`.

    Dans votre dossier Git, vous avez créé la branche `feature/returns-dedup` à partir de `main`, modifié deux notebooks et sélectionné **Commit & Push**.

    Vous devez intégrer vos modifications dans `main`.

    Que devez-vous faire ensuite ?
body:
  options:
    - { id: a, text: { en: "In the Git folder dialog, merge feature/returns-dedup into main.", fr: "Dans la boîte de dialogue du dossier Git, fusionner feature/returns-dedup dans main." } }
    - { id: b, text: { en: "In the Git folder dialog, rebase feature/returns-dedup onto main.", fr: "Dans la boîte de dialogue du dossier Git, rebaser feature/returns-dedup sur main." } }
    - { id: c, text: { en: "In Azure DevOps, create a pull request from feature/returns-dedup into main, and have it reviewed and merged.", fr: "Dans Azure DevOps, créer une pull request de feature/returns-dedup vers main, puis la faire revoir et fusionner." } }
    - { id: d, text: { en: "In the Git folder dialog, reset main to the state of feature/returns-dedup.", fr: "Dans la boîte de dialogue du dossier Git, réinitialiser main sur l'état de feature/returns-dedup." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Pull requests are created, reviewed and merged in the Git provider, not in Azure Databricks. When you can't commit to the default branch, you push a branch and then use the provider's interface to open a pull request and merge it after review.
    fr: |
      Les pull requests sont créées, revues et fusionnées chez le fournisseur Git, pas dans Azure Databricks. Quand vous ne pouvez pas valider sur la branche par défaut, vous poussez une branche, puis vous utilisez l'interface du fournisseur pour ouvrir une pull request et la fusionner après revue.
  options:
    a: { en: "A merge from the Git folder pushes directly to the target branch, which bypasses the required review and is blocked on a protected branch.", fr: "Une fusion depuis le dossier Git pousse directement vers la branche cible, ce qui contourne la revue exigée et est bloqué sur une branche protégée." }
    b: { en: "A rebase rewrites your branch on top of main; it doesn't bring your changes into main.", fr: "Un rebase réécrit votre branche par-dessus main ; il n'intègre pas vos modifications dans main." }
    d: { en: "A reset force-pushes another branch's state and history, which bypasses the review and discards history.", fr: "Une réinitialisation force l'envoi de l'état et de l'historique d'une autre branche, ce qui contourne la revue et supprime de l'historique." }
references:
  - title: Create and manage Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/git-operations-with-repos
  - title: CI/CD with Databricks Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/ci-cd
