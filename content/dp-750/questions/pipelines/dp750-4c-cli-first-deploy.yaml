id: dp750-4c-cli-first-deploy
objective: "4.3.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You are a data engineer at Proseware. You installed Databricks CLI version 0.218.0 or later on your computer. No bundle project exists yet.

    You need to create a Databricks Asset Bundle project from a default template, deploy it to the `dev` target, and run its sample job. Errors in the configuration must be detected before any resource is created in the workspace.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous êtes ingénieur données chez Proseware. Vous avez installé la version 0.218.0 ou ultérieure de l'interface CLI Databricks sur votre ordinateur. Aucun projet de bundle n'existe encore.

    Vous devez créer un projet de bundle de ressources Databricks à partir d'un modèle par défaut, le déployer sur la cible `dev` et exécuter son job d'exemple. Les erreurs de configuration doivent être détectées avant la création de toute ressource dans l'espace de travail.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: auth, text: { en: "Configure OAuth user-to-machine (U2M) authentication of the CLI to the workspace.", fr: "Configurer l'authentification OAuth utilisateur à machine (U2M) de l'interface CLI auprès de l'espace de travail." } }
    - { id: init, text: { en: "Run databricks bundle init.", fr: "Exécuter databricks bundle init." } }
    - { id: validate, text: { en: "Run databricks bundle validate.", fr: "Exécuter databricks bundle validate." } }
    - { id: deploy, text: { en: "Run databricks bundle deploy -t dev.", fr: "Exécuter databricks bundle deploy -t dev." } }
    - { id: run, text: { en: "Run databricks bundle run -t dev with the job's resource key.", fr: "Exécuter databricks bundle run -t dev avec la clé de ressource du job." } }
    - { id: bind, text: { en: "Run databricks bundle deployment bind for the sample job.", fr: "Exécuter databricks bundle deployment bind pour le job d'exemple." } }
    - { id: destroy, text: { en: "Run databricks bundle destroy -t dev.", fr: "Exécuter databricks bundle destroy -t dev." } }
answer:
  sequence: [ auth, init, validate, deploy, run ]
explanation:
  correct:
    en: "The CLI must first be configured to authenticate to the workspace, with OAuth U2M recommended for a person. `bundle init` creates the project from a template, `bundle validate` checks the configuration before anything is deployed, `bundle deploy -t dev` creates the resources in the dev target, and `bundle run` starts the job by its resource key."
    fr: "L'interface CLI doit d'abord être configurée pour s'authentifier auprès de l'espace de travail, avec OAuth U2M recommandé pour une personne. `bundle init` crée le projet à partir d'un modèle, `bundle validate` vérifie la configuration avant tout déploiement, `bundle deploy -t dev` crée les ressources dans la cible dev, et `bundle run` démarre le job par sa clé de ressource."
  options:
    bind: { en: "deployment bind links an existing workspace resource to the bundle; the sample job doesn't exist before deployment.", fr: "deployment bind lie une ressource existante de l'espace de travail au bundle ; le job d'exemple n'existe pas avant le déploiement." }
    destroy: { en: "destroy deletes the deployed resources, which is the opposite of the goal.", fr: "destroy supprime les ressources déployées, l'inverse de l'objectif." }
references:
  - title: What are Declarative Automation Bundles?
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
