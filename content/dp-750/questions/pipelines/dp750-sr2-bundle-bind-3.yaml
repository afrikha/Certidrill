status: draft
stem:
  en: You generate the job configuration and deploy with the force option.
  fr: Vous générez la configuration du job et déployez avec l'option force.
body:
  solution:
    en: |
      You run the following commands from the bundle root folder.

      ```bash
      databricks bundle generate job --existing-job-id 731994 --target prod
      databricks bundle deploy --target prod --force
      ```
    fr: |
      Vous exécutez les commandes suivantes depuis le dossier racine du bundle.

      ```bash
      databricks bundle generate job --existing-job-id 731994 --target prod
      databricks bundle deploy --target prod --force
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      `--force` only overrides blocking validations, such as a Git branch that does not match the target. It does not link the bundle resource to the existing job, so the deployment still creates a second nightly_sales job without the run history. Only `bundle deployment bind` makes the deployment update job 731994.
    fr: |
      `--force` contourne uniquement les validations bloquantes, comme une branche Git qui ne correspond pas à la cible. Il ne lie pas la ressource du bundle au job existant : le déploiement crée donc toujours un second job nightly_sales sans l'historique d'exécutions. Seul `bundle deployment bind` permet au déploiement de mettre à jour le job 731994.
references:
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
