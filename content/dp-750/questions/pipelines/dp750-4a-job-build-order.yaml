id: dp750-4a-job-build-order
objective: "4.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has three notebooks, **01_bronze_orders**, **02_silver_orders** and **03_gold_sales**, that must run in that order. Today, a driver notebook chains them with `dbutils.notebook.run()`.

    You need to replace the driver notebook with a new Lakeflow job named **orders_nightly** in which each notebook is a separate task. The job must meet the following requirements:

    - Each notebook must run only after the previous one succeeds.
    - A notebook task named **notify_failure** must run only when one of the three tasks fails.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose de trois notebooks, **01_bronze_orders**, **02_silver_orders** et **03_gold_sales**, qui doivent s'exécuter dans cet ordre. Aujourd'hui, un notebook pilote les enchaîne avec `dbutils.notebook.run()`.

    Vous devez remplacer le notebook pilote par un nouveau job Lakeflow nommé **orders_nightly** dans lequel chaque notebook est une tâche distincte. Le job doit répondre aux exigences suivantes :

    - Chaque notebook ne doit s'exécuter qu'après la réussite du précédent.
    - Une tâche notebook nommée **notify_failure** ne doit s'exécuter que si l'une des trois tâches échoue.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: bronze
      text: { en: "Create orders_nightly with a Notebook task that runs 01_bronze_orders.", fr: "Créer orders_nightly avec une tâche Notebook qui exécute 01_bronze_orders." }
    - id: silver
      text: { en: "Add a Notebook task that runs 02_silver_orders and depends on the bronze task, with Run if set to All succeeded.", fr: "Ajouter une tâche Notebook qui exécute 02_silver_orders et dépend de la tâche bronze, avec Run if défini sur All succeeded." }
    - id: gold
      text: { en: "Add a Notebook task that runs 03_gold_sales and depends on the silver task, with Run if set to All succeeded.", fr: "Ajouter une tâche Notebook qui exécute 03_gold_sales et dépend de la tâche silver, avec Run if défini sur All succeeded." }
    - id: notify
      text: { en: "Add notify_failure, make it depend on the three notebook tasks, and set Run if to At least one failed.", fr: "Ajouter notify_failure, la faire dépendre des trois tâches notebook et définir Run if sur At least one failed." }
    - id: driver
      text: { en: "Add a Notebook task that runs the existing driver notebook.", fr: "Ajouter une tâche Notebook qui exécute le notebook pilote existant." }
    - id: alldone
      text: { en: "Add notify_failure, make it depend on 03_gold_sales only, and set Run if to All done.", fr: "Ajouter notify_failure, la faire dépendre uniquement de 03_gold_sales et définir Run if sur All done." }
answer:
  sequence: [ bronze, silver, gold, notify ]
explanation:
  correct:
    en: |
      A task can only depend on tasks that already exist in the job, so you create the tasks in the order of the data flow and wire each one to the previous task with the default All succeeded condition. notify_failure comes last because it depends on all three tasks; with At least one failed, it runs when any of them fails and is excluded otherwise.
    fr: |
      Une tâche ne peut dépendre que de tâches qui existent déjà dans le job : vous créez donc les tâches dans l'ordre du flux de données et reliez chacune à la précédente avec la condition par défaut All succeeded. notify_failure vient en dernier, car elle dépend des trois tâches ; avec At least one failed, elle s'exécute quand l'une d'elles échoue et elle est exclue sinon.
  options:
    driver:
      en: |
        The goal is to replace the driver notebook; running it as a task would keep the steps hidden inside one task.
      fr: |
        L'objectif est de remplacer le notebook pilote ; l'exécuter comme une tâche laisserait les étapes cachées dans une seule tâche.
    alldone:
      en: |
        All done runs after every run, including successful ones, and depending only on 03_gold_sales misses a failure of the earlier tasks.
      fr: |
        All done s'exécute après chaque exécution, y compris réussie, et dépendre uniquement de 03_gold_sales ignore l'échec des tâches précédentes.
references:
  - title: Configure task dependencies
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-if
  - title: Notebook task for jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/tasks/notebook
