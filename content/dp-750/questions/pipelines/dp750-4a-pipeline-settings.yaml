id: dp750-4a-pipeline-settings
objective: "4.1.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware is creating a Lakeflow Spark Declarative Pipelines pipeline on serverless compute that loads tables in **proseware.sales**. The source system delivers new data once per hour.

    The pipeline must meet the following requirements:

    - Refresh the tables once per hour.
    - Minimize compute costs between refreshes.
    - Keep running if the engineer who creates the pipeline leaves the company.

    How should you configure the pipeline? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware crée un pipeline des pipelines déclaratifs Lakeflow Spark sur un calcul serverless qui charge des tables de **proseware.sales**. Le système source livre de nouvelles données une fois par heure.

    Le pipeline doit répondre aux exigences suivantes :

    - Actualiser les tables une fois par heure.
    - Réduire au minimum les coûts de calcul entre les actualisations.
    - Continuer à fonctionner si l'ingénieur qui crée le pipeline quitte l'entreprise.

    Comment devez-vous configurer le pipeline ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - Pipeline mode: [[mode]]
      - Hourly refresh: [[sched]]
      - Run as: [[runas]]
    fr: |
      - Mode du pipeline : [[mode]]
      - Actualisation horaire : [[sched]]
      - Run as : [[runas]]
  slots:
    - id: mode
      options:
        - { id: triggered, text: Triggered }
        - { id: continuous, text: Continuous }
    - id: sched
      options:
        - { id: jobtask, text: { en: "A Pipeline task in a job that has an hourly schedule", fr: "Une tâche Pipeline dans un job doté d'une planification horaire" } }
        - { id: interval, text: { en: "The pipelines.trigger.interval property set to 1 hour", fr: "La propriété pipelines.trigger.interval définie sur 1 heure" } }
        - { id: manual, text: { en: "Run now in the pipeline editor at the start of each hour", fr: "Run now dans l'éditeur du pipeline au début de chaque heure" } }
    - id: runas
      options:
        - { id: sp, text: { en: "A service principal", fr: "Un principal de service" } }
        - { id: creator, text: { en: "The user account of the pipeline creator", fr: "Le compte d'utilisateur du créateur du pipeline" } }
        - { id: admin, text: { en: "The user account of a workspace admin", fr: "Le compte d'utilisateur d'un administrateur de l'espace de travail" } }
answer:
  values: { mode: triggered, sched: jobtask, runas: sp }
explanation:
  correct:
    en: |
      In triggered mode, the default, an update processes the available data and then stops, so no compute runs between refreshes. A triggered pipeline is scheduled with a Pipeline task in a job. A service principal is recommended as the run-as identity because it isn't tied to one person.
    fr: |
      En mode déclenché (Triggered), la valeur par défaut, une mise à jour traite les données disponibles puis s'arrête : aucun calcul ne s'exécute entre les actualisations. Un pipeline déclenché se planifie avec une tâche Pipeline dans un job. Un principal de service est recommandé comme identité d'exécution (run as), car il n'est pas lié à une personne.
  options:
    continuous:
      en: |
        Continuous mode keeps compute running between refreshes, which costs more and isn't needed for hourly data.
      fr: |
        Le mode continu maintient le calcul actif entre les actualisations, ce qui coûte plus cher et n'est pas nécessaire pour des données horaires.
    interval:
      en: |
        pipelines.trigger.interval applies only to continuous pipelines; a triggered pipeline processes each table once per update.
      fr: |
        pipelines.trigger.interval ne s'applique qu'aux pipelines continus ; un pipeline déclenché traite chaque table une fois par mise à jour.
    manual:
      en: |
        Manual runs need someone to start them and also disable retries.
      fr: |
        Les exécutions manuelles exigent que quelqu'un les lance et désactivent en plus les nouvelles tentatives.
    creator:
      en: |
        A user account is tied to one person; Databricks recommends a service principal for this reason.
      fr: |
        Un compte d'utilisateur est lié à une personne ; c'est pourquoi Databricks recommande un principal de service.
    admin:
      en: |
        An admin's user account is also tied to one person, and it grants more privileges than needed.
      fr: |
        Le compte d'utilisateur d'un administrateur est lui aussi lié à une personne, et il accorde plus de privilèges que nécessaire.
references:
  - title: Triggered vs. continuous pipeline mode
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/pipeline-mode
  - title: Configure pipelines
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/configure-pipeline
