id: dp750-4c-test-ci-sequence
objective: "4.3.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Proseware deploys a Databricks Asset Bundle named **orders-etl** that has a `staging` target and a `prod` target. The repository contains unit tests that need no cluster, and integration and end-to-end tests that run as a job on Databricks resources.

    You need to design the release pipeline. The pipeline must fail as early and as cheaply as possible, and no change can reach production before the business stakeholders accept it.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware déploie un bundle de ressources Databricks nommé **orders-etl** qui a une cible `staging` et une cible `prod`. Le dépôt contient des tests unitaires qui n'ont besoin d'aucun cluster, ainsi que des tests d'intégration et de bout en bout qui s'exécutent sous forme de job sur des ressources Databricks.

    Vous devez concevoir le pipeline de mise en production. Le pipeline doit échouer le plus tôt et au moindre coût possible, et aucune modification ne peut arriver en production avant d'avoir été acceptée par les parties prenantes métier.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: unit, text: { en: "Run the unit tests with pytest on the build agent.", fr: "Exécuter les tests unitaires avec pytest sur l'agent de build." } }
    - { id: deploystg, text: { en: "Deploy the bundle to the staging target.", fr: "Déployer le bundle sur la cible staging." } }
    - { id: inttests, text: { en: "Run the integration and end-to-end test job in staging.", fr: "Exécuter le job de tests d'intégration et de bout en bout en staging." } }
    - { id: uat, text: { en: "Have the stakeholders run the UAT scenarios in staging.", fr: "Faire exécuter les scénarios UAT en staging par les parties prenantes." } }
    - { id: deployprod, text: { en: "Deploy the bundle to the prod target.", fr: "Déployer le bundle sur la cible prod." } }
    - { id: e2eprod, text: { en: "Run the end-to-end tests against the production tables.", fr: "Exécuter les tests de bout en bout sur les tables de production." } }
    - { id: unitlate, text: { en: "Run the unit tests on a job cluster in production.", fr: "Exécuter les tests unitaires sur un cluster de job en production." } }
answer:
  sequence: [ unit, deploystg, inttests, uat, deployprod ]
explanation:
  correct:
    en: "Following the testing pyramid, the fast unit tests run first, without any Databricks resource. The bundle is then deployed to staging so that the integration and end-to-end tests can run on real resources. Stakeholders validate the UAT scenarios in staging, and only then is the bundle deployed to production."
    fr: "Selon la pyramide des tests, les tests unitaires rapides s'exécutent d'abord, sans aucune ressource Databricks. Le bundle est ensuite déployé en staging pour que les tests d'intégration et de bout en bout s'exécutent sur des ressources réelles. Les parties prenantes valident les scénarios UAT en staging, et ce n'est qu'ensuite que le bundle est déployé en production."
  options:
    e2eprod: { en: "Tests must never run against production tables.", fr: "Les tests ne doivent jamais s'exécuter sur les tables de production." }
    unitlate: { en: "Unit tests need no cluster and must run first to fail cheaply, not after the release.", fr: "Les tests unitaires n'ont besoin d'aucun cluster et doivent s'exécuter en premier pour échouer à moindre coût, pas après la mise en production." }
references:
  - title: Implement testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy
  - title: CI/CD on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/ci-cd/
