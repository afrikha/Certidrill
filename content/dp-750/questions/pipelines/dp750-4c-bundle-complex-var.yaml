id: dp750-4c-bundle-complex-var
objective: "4.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Databricks Asset Bundle that defines three jobs. Each job uses a job cluster with the same definition: Databricks Runtime version, node type, number of workers and Spark configuration.

    You need to write the cluster definition only once in the bundle and reuse it in the job clusters of the three jobs.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un bundle de ressources Databricks qui définit trois jobs. Chaque job utilise un cluster de job de même définition : version de Databricks Runtime, type de nœud, nombre de workers et configuration Spark.

    Vous devez écrire la définition du cluster une seule fois dans le bundle et la réutiliser dans les clusters de job des trois jobs.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a job parameter that holds the cluster definition to each job.", fr: "Ajouter à chaque job un paramètre de job qui contient la définition du cluster." } }
    - { id: b, text: { en: "Set new_cluster to the variable in the job_clusters mapping of each job.", fr: "Définir new_cluster sur la variable dans le mappage job_clusters de chaque job." } }
    - { id: c, text: { en: "Declare a custom variable with a lookup on cluster that names the definition.", fr: "Déclarer une variable personnalisée avec un lookup sur cluster qui nomme la définition." } }
    - { id: d, text: { en: "Declare a custom variable with `type: complex` whose default is the cluster definition.", fr: "Déclarer une variable personnalisée avec `type: complex` dont la valeur par défaut est la définition du cluster." } }
    - { id: e, text: { en: "List the cluster definition file in the artifacts mapping of the bundle.", fr: "Lister le fichier de définition du cluster dans le mappage artifacts du bundle." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A custom variable is a string by default; `type: complex` lets its default hold a structured value such as a full cluster definition. Each job then references it in its job cluster, for example `new_cluster: ${var.etl_cluster}`, so the definition is written once and resolved at deployment time."
    fr: "Une variable personnalisée est une chaîne par défaut ; `type: complex` permet à sa valeur par défaut de contenir une valeur structurée comme une définition complète de cluster. Chaque job la référence ensuite dans son cluster de job, par exemple `new_cluster: ${var.etl_cluster}` : la définition est écrite une seule fois et résolue au moment du déploiement."
  options:
    c: { en: "A lookup resolves the name of an existing object to its ID; it doesn't hold a cluster definition for new job clusters.", fr: "Un lookup résout le nom d'un objet existant en son ID ; il ne contient pas de définition de cluster pour de nouveaux clusters de job." }
    a: { en: "Job parameters are run-time values passed to tasks; they can't define the job cluster.", fr: "Les paramètres de job sont des valeurs d'exécution transmises aux tâches ; ils ne peuvent pas définir le cluster de job." }
    e: { en: "artifacts defines files to build, such as wheels, not configuration to reuse.", fr: "artifacts définit des fichiers à générer, comme des wheels, pas une configuration à réutiliser." }
references:
  - title: Substitutions and variables in Declarative Automation Bundles
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/variables
