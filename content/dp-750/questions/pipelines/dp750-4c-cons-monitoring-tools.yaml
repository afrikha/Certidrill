id: dp750-4c-cons-monitoring-tools
objective: "4.4.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind's platform team monitors compute consumption in an Azure Databricks account that has six workspaces. The following table lists the tools that the team can use.

    Answer each prompt by selecting the tool that provides the information.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe plateforme de Northwind surveille la consommation de calcul d'un compte Azure Databricks qui compte six espaces de travail. Le tableau suivant liste les outils que l'équipe peut utiliser.

    Répondez à chaque consigne en sélectionnant l'outil qui fournit l'information.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "CPU utilization and number of active tasks of an all-purpose compute resource over the past seven days", fr: "Utilisation du processeur et nombre de tâches actives d'une ressource de calcul polyvalent au cours des sept derniers jours" } 
    - id: p2
      text: { en: "DBUs consumed last month by every job in all six workspaces", fr: "DBU consommées le mois dernier par chaque job dans les six espaces de travail" }
  grid:
    header: [{ en: Tool, fr: Outil }]
    rows:
      - [{ text: { en: "Metrics tab of the compute resource", fr: "Onglet Metrics de la ressource de calcul" }, area: metrics }]
      - [{ text: { en: "Event log tab of the compute resource", fr: "Onglet Event log de la ressource de calcul" }, area: eventlog }]
      - [{ text: { en: "Driver logs tab of the compute resource", fr: "Onglet Driver logs de la ressource de calcul" }, area: driverlogs }]
      - [{ text: Query insights, area: insights }]
      - [{ text: { en: "system.billing.usage system table", fr: "Table système system.billing.usage" }, area: billing }]
answer:
  values: { p1: metrics, p2: billing }
explanation:
  correct:
    en: "The Metrics tab of all-purpose and jobs compute shows hardware charts such as CPU utilization and Spark charts such as active tasks, with history for the last 30 days. The billable usage system table contains the DBUs of the whole account; its data is routed to all regions, so you can query every workspace's usage, grouped by `usage_metadata.job_id`."
    fr: "L'onglet Metrics du calcul polyvalent et du calcul de jobs présente des graphiques matériels, comme l'utilisation du processeur, et des graphiques Spark, comme les tâches actives, avec un historique sur les 30 derniers jours. La table système d'utilisation facturable contient les DBU de tout le compte ; ses données sont acheminées vers toutes les régions, ce qui permet d'interroger l'utilisation de chaque espace de travail, regroupée par `usage_metadata.job_id`."
  options:
    eventlog: { en: "The event log records lifecycle events such as creation, termination and edits, not utilization or DBUs.", fr: "Le journal des événements enregistre des événements de cycle de vie comme la création, l'arrêt et les modifications, pas l'utilisation ni les DBU." }
    driverlogs: { en: "Driver logs hold the standard output, standard error and Log4j output of the code.", fr: "Les journaux du pilote contiennent la sortie standard, l'erreur standard et la sortie Log4j du code." }
    insights: { en: "Query insights replaces the Metrics tab for serverless notebooks and jobs; it doesn't report DBUs for the account.", fr: "Query insights remplace l'onglet Metrics pour les notebooks et les jobs serverless ; il n'indique pas les DBU du compte." }
references:
  - title: View compute metrics
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/cluster-metrics
  - title: Billable usage system table reference
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/billing
