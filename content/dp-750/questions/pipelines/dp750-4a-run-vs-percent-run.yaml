id: dp750-4a-run-vs-percent-run
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a driver notebook that loops over a list of regions. For each region, the driver must run the notebook **./load_region**, pass the region code to its widget **region**, and read a status string that load_region returns when it ends.

    Which statement should you use in the loop of the driver notebook?
  fr: |
    Wingtip Toys dispose d'un notebook pilote qui parcourt une liste de régions. Pour chaque région, le pilote doit exécuter le notebook **./load_region**, transmettre le code de la région à son widget **region** et lire une chaîne d'état que load_region renvoie à la fin de son exécution.

    Quelle instruction devez-vous utiliser dans la boucle du notebook pilote ?
body:
  options:
    - id: a
      text: '%run ./load_region $region="emea"'
    - id: b
      text: 'status = dbutils.jobs.taskValues.get(taskKey="load_region", key="status")'
    - id: c
      text: 'status = dbutils.notebook.run("./load_region", 1800, {"region": region})'
    - id: d
      text: 'status = dbutils.notebook.exit("./load_region")'
answer: { optionId: c }
explanation:
  correct:
    en: "`dbutils.notebook.run()` starts the target notebook as a separate run, sets its widgets from the arguments map, and returns the string that the target passes to `dbutils.notebook.exit()`. It is designed for orchestration, such as running a notebook once per element of a list."
    fr: "`dbutils.notebook.run()` lance le notebook cible dans une exécution distincte, définit ses widgets à partir de la table des arguments et renvoie la chaîne que la cible passe à `dbutils.notebook.exit()`. Il est conçu pour l'orchestration, par exemple pour exécuter un notebook une fois par élément d'une liste."
  options:
    a:
      en: "%run inlines the notebook and doesn't return a value; it must also be alone in its cell, so it can't run inside a loop."
      fr: "%run intègre le notebook en ligne et ne renvoie aucune valeur ; il doit aussi être seul dans sa cellule et ne peut donc pas s'exécuter dans une boucle."
    b:
      en: |
        Task values pass data between tasks of a job; load_region isn't a task of the job, so there is no task value to read.
      fr: |
        Les valeurs de tâche transmettent des données entre les tâches d'un job ; load_region n'est pas une tâche du job, il n'y a donc aucune valeur de tâche à lire.
    d:
      en: |
        exit() ends the current notebook and returns its argument to the caller; it doesn't run another notebook.
      fr: |
        exit() termine le notebook courant et renvoie son argument à l'appelant ; il n'exécute pas un autre notebook.
references:
  - title: Orchestrate Databricks notebooks and modularize code
    url: https://learn.microsoft.com/en-us/azure/databricks/notebooks/notebook-workflows
