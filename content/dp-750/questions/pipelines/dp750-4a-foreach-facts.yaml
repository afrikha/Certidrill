id: dp750-4a-foreach-facts
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans to use a **For each** task in a Lakeflow job to load the data of each of its stores into **wingtip.bronze.store_sales**.

    Which two statements about the For each task are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit d'utiliser une tâche **For each** dans un job Lakeflow pour charger les données de chacun de ses magasins dans **wingtip.bronze.store_sales**.

    Quelles sont les deux affirmations vraies à propos de la tâche For each ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A downstream task can depend directly on the nested task of the For each task.", fr: "Une tâche en aval peut dépendre directement de la tâche imbriquée de la tâche For each." } }
    - { id: b, text: { en: "If you don't change the Concurrency setting, the iterations run one at a time.", fr: "Si vous ne modifiez pas le paramètre Concurrency, les itérations s'exécutent une par une." } }
    - { id: c, text: { en: "The Inputs of the task must be a JSON array typed in the task settings.", fr: "Les Inputs de la tâche doivent être un tableau JSON saisi dans les paramètres de la tâche." } }
    - { id: d, text: { en: "The nested task can't be another For each task.", fr: "La tâche imbriquée ne peut pas être une autre tâche For each." } }
    - { id: e, text: { en: "The nested task must be a Notebook task.", fr: "La tâche imbriquée doit être une tâche Notebook." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The default Concurrency of a For each task is 1, so iterations run sequentially unless you raise it. The nested task can be any standard task type except another For each task.
    fr: |
      La valeur par défaut de Concurrency d'une tâche For each est 1 : les itérations s'exécutent l'une après l'autre, sauf si vous l'augmentez. La tâche imbriquée peut être de n'importe quel type de tâche standard, sauf une autre tâche For each.
  options:
    a:
      en: |
        A downstream task can depend on the For each task, not on its nested task; it can read the nested task's values as a list ordered by iteration.
      fr: |
        Une tâche en aval peut dépendre de la tâche For each, pas de sa tâche imbriquée ; elle peut lire les valeurs de la tâche imbriquée sous forme de liste ordonnée par itération.
    c:
      en: |
        Inputs can also be a task value reference or a job parameter reference.
      fr: |
        Les Inputs peuvent aussi être une référence à une valeur de tâche ou à un paramètre de job.
    e:
      en: |
        The nested task can be any standard Lakeflow Jobs task type, such as a SQL or Python script task.
      fr: |
        La tâche imbriquée peut être de n'importe quel type de tâche standard de Lakeflow Jobs, par exemple une tâche SQL ou Python script.
references:
  - title: Use a For each task to run another task in a loop
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/for-each
