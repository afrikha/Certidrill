id: dp750-4c-cons-auto-termination
objective: "4.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin's data engineers use five all-purpose compute resources interactively from notebooks during the day. The billing data shows that the compute resources often keep running all night after the engineers leave, with no workload.

    You need to reduce the cost of this idle time. The engineers must keep using the same compute resources during the day, and the solution must minimize administrative effort.

    What should you configure on each compute resource?
  fr: |
    Les ingénieurs données de Tailspin utilisent cinq ressources de calcul polyvalent de manière interactive depuis des notebooks pendant la journée. Les données de facturation montrent que ces ressources de calcul restent souvent actives toute la nuit après le départ des ingénieurs, sans aucune charge de travail.

    Vous devez réduire le coût de ce temps d'inactivité. Les ingénieurs doivent continuer à utiliser les mêmes ressources de calcul pendant la journée, et la solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer sur chaque ressource de calcul ?
body:
  options:
    - { id: a, text: { en: "Pinning of the compute resource", fr: "L'épinglage de la ressource de calcul" } }
    - { id: b, text: { en: "Autoscaling with a minimum of one worker", fr: "La mise à l'échelle automatique avec un minimum d'un worker" } }
    - { id: c, text: { en: "Automatic termination after 60 minutes of inactivity", fr: "L'arrêt automatique après 60 minutes d'inactivité" } }
    - { id: d, text: { en: "A larger driver type with fewer workers", fr: "Un type de pilote plus grand avec moins de workers" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Idle compute keeps accruing DBU and cloud instance charges until it terminates. Automatic termination stops the compute after the specified period of inactivity, between 10 and 10,000 minutes, and engineers restart the same compute, with the same ID, libraries and attached notebooks, the next morning."
    fr: "Un calcul inactif continue d'accumuler des frais de DBU et d'instances cloud jusqu'à son arrêt. L'arrêt automatique arrête le calcul après la période d'inactivité indiquée, entre 10 et 10 000 minutes, et les ingénieurs redémarrent le lendemain le même calcul, avec le même ID, les mêmes bibliothèques et les mêmes notebooks attachés."
  options:
    b: { en: "Autoscaling removes extra workers, but the driver and the minimum worker keep running all night.", fr: "La mise à l'échelle automatique retire les workers supplémentaires, mais le pilote et le worker minimal restent actifs toute la nuit." }
    a: { en: "Pinning keeps a terminated compute's configuration from being deleted after 30 days; it doesn't stop the compute.", fr: "L'épinglage empêche la suppression de la configuration d'un calcul arrêté au bout de 30 jours ; il n'arrête pas le calcul." }
    d: { en: "Resizing changes the cost per hour, but the compute still runs all night.", fr: "Redimensionner change le coût horaire, mais le calcul reste actif toute la nuit." }
references:
  - title: Manage classic compute
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage
