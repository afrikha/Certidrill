id: dp750-cs1c-bundle-targets
objective: "4.3.4"
type: dropdown
caseStudy: dp750-cs1c-best-for-you-organics
difficulty: 3
status: draft
stem:
  en: |
    You are editing the databricks.yml file of the replenishment bundle. The application ID of sp-bfyo-deploy is 6f1c3a9e-2b7d-4c4e-9a51-0d8e7b2c4f10.

    How should you complete the file to meet the deployment requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous modifiez le fichier databricks.yml du bundle de réapprovisionnement. L'ID d'application de sp-bfyo-deploy est 6f1c3a9e-2b7d-4c4e-9a51-0d8e7b2c4f10.

    Comment devez-vous compléter le fichier pour respecter les exigences de déploiement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    bundle:
      name: replenishment

    include:
      - resources/*.yml

    targets:
      dev:
        default: true
        [[devmode]]
        workspace:
          host: https://adb-1111111111111111.11.azuredatabricks.net

      prod:
        mode: production
        git:
          [[git]]
        workspace:
          host: https://adb-2222222222222222.12.azuredatabricks.net
        run_as:
          [[runas]]: 6f1c3a9e-2b7d-4c4e-9a51-0d8e7b2c4f10
  slots:
    - id: devmode
      options:
        - { id: development, text: "mode: development" }
        - { id: production, text: "mode: production" }
        - { id: paused, text: "presets: { trigger_pause_status: PAUSED }" }
    - id: git
      options:
        - { id: branch, text: "branch: main" }
        - { id: origin, text: "origin_url: main" }
        - { id: prodbranch, text: "branch: prod" }
    - id: runas
      options:
        - { id: sp, text: "service_principal_name" }
        - { id: user, text: "user_name" }
        - { id: group, text: "group_name" }
answer:
  values: { devmode: development, git: branch, runas: sp }
explanation:
  correct:
    en: "`mode: development` prefixes the deployed resources with `[dev <user name>]` and pauses all schedules and triggers. In production mode, `git: branch: main` makes the deployment validate that the current Git branch is main. `run_as` with `service_principal_name` set to the application ID makes the deployed jobs run as the service principal."
    fr: "`mode: development` préfixe les ressources déployées par `[dev <nom d'utilisateur>]` et suspend toutes les planifications et tous les déclencheurs. En mode production, `git: branch: main` fait vérifier au déploiement que la branche Git actuelle est main. `run_as` avec `service_principal_name` défini sur l'ID d'application fait s'exécuter les jobs déployés en tant que principal de service."
  options:
    production: { en: "Production mode doesn't add a name prefix or pause the schedules.", fr: "Le mode production n'ajoute pas de préfixe de nom et ne suspend pas les planifications." }
    paused: { en: "This preset pauses the triggers but doesn't prefix the job names with the engineer's name.", fr: "Ce préréglage suspend les déclencheurs mais ne préfixe pas les noms des jobs par le nom de l'ingénieur." }
    origin: { en: "origin_url is the URL of the remote repository, not the branch to deploy from.", fr: "origin_url est l'URL du dépôt distant, pas la branche à partir de laquelle déployer." }
    prodbranch: { en: "The requirement names the main branch; prod is the name of the target, not of the branch.", fr: "L'exigence désigne la branche main ; prod est le nom de la cible, pas celui de la branche." }
    user: { en: "user_name runs the jobs as a user, not as the service principal.", fr: "user_name exécute les jobs en tant qu'utilisateur, pas en tant que principal de service." }
    group: { en: "A job can't run as a group; group_name is used in permissions.", fr: "Un job ne peut pas s'exécuter en tant que groupe ; group_name s'utilise dans les autorisations." }
references:
  - title: Declarative Automation Bundles deployment modes
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
