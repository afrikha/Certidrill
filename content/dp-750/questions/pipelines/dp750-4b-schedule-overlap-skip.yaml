id: dp750-4b-schedule-overlap-skip
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow job named **tailspin_bookings_sync** has an Advanced schedule with the cron expression `0 0/15 * * * ?`. The job settings are:

    - Max concurrent runs: 1
    - Queue: disabled

    Runs usually take 8 minutes, but one run at 10:00 takes 22 minutes.

    What happens to the run scheduled at 10:15?
  fr: |
    Un job Lakeflow nommé **tailspin_bookings_sync** possède une planification Advanced avec l'expression cron `0 0/15 * * * ?`. Les paramètres du job sont :

    - Max concurrent runs : 1
    - Queue : désactivé

    Les exécutions durent généralement 8 minutes, mais l'exécution de 10:00 dure 22 minutes.

    Qu'advient-il de l'exécution planifiée à 10:15 ?
body:
  options:
    - { id: a, text: { en: "It is skipped.", fr: "Elle est ignorée." } }
    - { id: b, text: { en: "It waits until the 10:00 run completes, then starts.", fr: "Elle attend la fin de l'exécution de 10:00, puis démarre." } }
    - { id: c, text: { en: "It starts and runs at the same time as the 10:00 run.", fr: "Elle démarre et s'exécute en même temps que l'exécution de 10:00." } }
    - { id: d, text: { en: "It cancels the 10:00 run and starts.", fr: "Elle annule l'exécution de 10:00 et démarre." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a job already has its maximum number of active runs, Azure Databricks skips any new run. Only when queueing is enabled does the run wait, for up to 48 hours, until the limit allows it to start.
    fr: |
      Quand un job a déjà atteint son nombre maximal d'exécutions actives, Azure Databricks ignore toute nouvelle exécution. Ce n'est que si la mise en file d'attente est activée que l'exécution attend, jusqu'à 48 heures, que la limite lui permette de démarrer.
  options:
    b: { en: "Waiting is the queueing behavior, and the queue is disabled.", fr: "L'attente correspond au comportement de la file d'attente, qui est désactivée." }
    c: { en: "Max concurrent runs set to 1 forbids two active runs.", fr: "Max concurrent runs défini sur 1 interdit deux exécutions actives." }
    d: { en: "The scheduler never cancels an active run to start a new one.", fr: "Le planificateur n'annule jamais une exécution active pour en lancer une nouvelle." }
references:
  - title: Configure and edit Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-job
