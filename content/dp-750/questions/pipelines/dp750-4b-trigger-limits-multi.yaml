id: dp750-4b-trigger-limits-multi
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your team is designing the triggers of the Lakeflow jobs in a Unity Catalog-enabled workspace. The workspace has the Multiple Triggers preview enabled.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe conçoit les déclencheurs des jobs Lakeflow d'un espace de travail activé pour Unity Catalog. La préversion Multiple Triggers est activée dans l'espace de travail.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A job can combine a continuous trigger with a scheduled trigger.", fr: "Un job peut combiner un déclencheur Continuous et un déclencheur Scheduled." } }
    - { id: b, text: { en: "A table update trigger can monitor up to 10 tables.", fr: "Un déclencheur Table update peut surveiller jusqu'à 10 tables." } }
    - { id: c, text: { en: "A file arrival trigger checks the storage location about once an hour.", fr: "Un déclencheur File arrival vérifie l'emplacement de stockage environ une fois par heure." } }
    - { id: d, text: { en: "Paused triggers don't count toward the limit of 12,000 active triggers per workspace.", fr: "Les déclencheurs suspendus ne comptent pas dans la limite de 12 000 déclencheurs actifs par espace de travail." } }
    - { id: e, text: { en: "A table update trigger can monitor tables of the legacy Hive metastore.", fr: "Un déclencheur Table update peut surveiller des tables du metastore Hive hérité." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A table update trigger monitors up to 10 managed or Delta tables, and the source tables of a monitored view count toward that limit. A workspace can have up to 12,000 active triggers across all jobs; paused triggers aren't counted.
    fr: |
      Un déclencheur Table update surveille jusqu'à 10 tables managées ou Delta, et les tables sources d'une vue surveillée comptent dans cette limite. Un espace de travail peut avoir jusqu'à 12 000 déclencheurs actifs pour l'ensemble des jobs ; les déclencheurs suspendus ne sont pas comptés.
  options:
    a: { en: "A continuous trigger can't be combined with any other trigger, even with Multiple Triggers.", fr: "Un déclencheur Continuous ne peut être combiné avec aucun autre déclencheur, même avec Multiple Triggers." }
    c: { en: "A file arrival trigger makes a best effort to check for new files every minute.", fr: "Un déclencheur File arrival s'efforce de rechercher de nouveaux fichiers chaque minute." }
    e: { en: "Table update triggers support Unity Catalog objects, such as managed tables, Delta external tables, materialized views and streaming tables.", fr: "Les déclencheurs Table update prennent en charge des objets Unity Catalog, comme les tables managées, les tables externes Delta, les vues matérialisées et les tables de diffusion en continu." }
references:
  - title: Automate jobs with schedules and triggers
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/triggers
  - title: Trigger jobs when source tables are updated
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/trigger-table-update
