id: dp750-4d-diag-permissions
objective: "4.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Azure Databricks workspace named **adb-northwind** on the Premium plan. An engineer named User1 is a workspace admin in Azure Databricks and has the Reader role on the adb-northwind resource in Azure.

    User1 must configure diagnostic log delivery from adb-northwind to a Log Analytics workspace.

    Which two Azure role assignments on the adb-northwind resource allow User1 to perform the task? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un espace de travail Azure Databricks nommé **adb-northwind** sur le plan Premium. Un ingénieur nommé User1 est administrateur de l'espace de travail dans Azure Databricks et a le rôle Reader sur la ressource adb-northwind dans Azure.

    User1 doit configurer la livraison des journaux de diagnostic d'adb-northwind vers un espace de travail Log Analytics.

    Quelles sont les deux attributions de rôles Azure sur la ressource adb-northwind qui permettent à User1 d'effectuer cette tâche ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Owner }
    - { id: b, text: Monitoring Reader }
    - { id: c, text: Contributor }
    - { id: d, text: Log Analytics Reader }
    - { id: e, text: User Access Administrator }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: To configure diagnostic log delivery, you sign in to the Azure portal as an Owner or a Contributor of the Azure Databricks workspace, or with a custom role that has the Microsoft.Databricks/workspaces/assignWorkspaceAdmin/action permission. Being a workspace admin inside Azure Databricks does not grant Azure permissions on the resource.
    fr: Pour configurer la livraison des journaux de diagnostic, vous vous connectez au portail Azure en tant qu'Owner ou Contributor de l'espace de travail Azure Databricks, ou avec un rôle personnalisé qui dispose de l'autorisation Microsoft.Databricks/workspaces/assignWorkspaceAdmin/action. Être administrateur de l'espace de travail dans Azure Databricks n'accorde aucune autorisation Azure sur la ressource.
  options:
    b:
      en: Monitoring Reader can read monitoring data and settings but cannot create a diagnostic setting.
      fr: Monitoring Reader peut lire les données et paramètres de supervision, mais ne peut pas créer de paramètre de diagnostic.
    d:
      en: Log Analytics Reader grants read access to Log Analytics data; it does not allow configuring the diagnostic setting of the workspace resource.
      fr: Log Analytics Reader accorde l'accès en lecture aux données Log Analytics ; il ne permet pas de configurer le paramètre de diagnostic de la ressource.
    e:
      en: User Access Administrator manages role assignments, not the configuration of the resource.
      fr: User Access Administrator gère les attributions de rôles, pas la configuration de la ressource.
references:
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
