stem:
  en: You trigger daily-sales again by using Run now.
  fr: Vous déclenchez à nouveau daily-sales à l'aide de Run now.
body:
  solution:
    en: In the Lakeflow Jobs UI, you open daily-sales and click **Run now**.
    fr: Dans l'interface utilisateur de Lakeflow Jobs, vous ouvrez daily-sales et cliquez sur **Run now**.
answer: { value: false }
explanation:
  correct:
    en: Run now starts a new run of the whole job, so ingest_orders and ingest_customers run again for about two hours. Last night's run also stays failed in the run history, because only a repair of that run completes it.
    fr: "Run now démarre une nouvelle exécution de l'ensemble du travail : ingest_orders et ingest_customers s'exécutent à nouveau pendant environ deux heures. L'exécution de la nuit dernière reste par ailleurs en échec dans l'historique, car seule une réparation de cette exécution la termine."
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
