id: dp750-4a-skip-change-commits
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Lakeflow Spark Declarative Pipelines pipeline on serverless compute. The streaming table **adatum.silver.patients_events** reads **adatum.bronze.patients_events** by using `STREAM`.

    The compliance team now runs DELETE statements on adatum.bronze.patients_events to process erasure requests. Since then, the pipeline update fails because the streaming read encountered a deletion in its source.

    patients_events must keep processing the new rows of the bronze table. The deletions don't need to be propagated by this table, and you must minimize reprocessing.

    What should you do?
  fr: |
    Adatum dispose d'un pipeline des pipelines déclaratifs Lakeflow Spark sur un calcul serverless. La table de diffusion en continu **adatum.silver.patients_events** lit **adatum.bronze.patients_events** avec `STREAM`.

    L'équipe de conformité exécute désormais des instructions DELETE sur adatum.bronze.patients_events pour traiter des demandes d'effacement. Depuis, la mise à jour du pipeline échoue, car la lecture en streaming a rencontré une suppression dans sa source.

    patients_events doit continuer à traiter les nouvelles lignes de la table bronze. Les suppressions n'ont pas besoin d'être propagées par cette table, et vous devez réduire au minimum le retraitement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run a full refresh of adatum.silver.patients_events after each erasure request.", fr: "Exécuter une actualisation complète de adatum.silver.patients_events après chaque demande d'effacement." }
    - id: b
      text: { en: "Add the skipChangeCommits read option to the streaming read of the bronze table.", fr: "Ajouter l'option de lecture skipChangeCommits à la lecture en streaming de la table bronze." }
    - id: c
      text: { en: "Set the table property pipelines.reset.allowed to false on the silver table.", fr: "Définir la propriété de table pipelines.reset.allowed sur false sur la table silver." }
    - id: d
      text: { en: "Change the pipeline mode of the pipeline from triggered to continuous.", fr: "Faire passer le mode du pipeline de déclenché (triggered) à continu (continuous)." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A streaming table is safest with append-only sources, and the read throws an error when it meets a change or a deletion of an existing record. The skipChangeCommits read option makes the stream ignore the commits that change or delete rows and keep processing the appended rows.
    fr: |
      Une table de diffusion en continu est plus sûre avec des sources en ajout seul, et la lecture lève une erreur lorsqu'elle rencontre la modification ou la suppression d'un enregistrement existant. L'option de lecture skipChangeCommits fait ignorer au flux les commits qui modifient ou suppriment des lignes et lui permet de continuer à traiter les lignes ajoutées.
  options:
    a:
      en: |
        A full refresh clears the table and its checkpoints and reprocesses all the source data each time, which maximizes reprocessing.
      fr: |
        Une actualisation complète vide la table et ses points de contrôle, puis retraite toutes les données sources à chaque fois, ce qui maximise le retraitement.
    c:
      en: |
        This property only blocks full refreshes of the table; the streaming read still fails on the deletions.
      fr: |
        Cette propriété bloque seulement les actualisations complètes de la table ; la lecture en streaming échoue toujours sur les suppressions.
    d:
      en: |
        The pipeline mode changes when updates run, not how the stream handles deletions in its source.
      fr: |
        Le mode du pipeline change le moment des mises à jour, pas la façon dont le flux traite les suppressions de sa source.
references:
  - title: CREATE STREAMING TABLE (pipelines)
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/developer/ldp-sql-ref-create-streaming-table
