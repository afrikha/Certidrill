id: dp750-4c-spark-small-files
objective: "4.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a notebook that aggregates sensor readings from the Delta table `contoso.iot.readings`. In the Spark UI, the slowest stage shows no skew and no spill. In the SQL DAG, the scan operator of the table shows that the stage read about 180,000 files, most of them a few kilobytes in size.

    You need to reduce the duration of the stage. The solution must minimize compute cost.

    What should you do?
  fr: |
    Contoso dispose d'un notebook qui agrège des relevés de capteurs de la table Delta `contoso.iot.readings`. Dans l'interface utilisateur Spark, l'étape la plus lente ne montre ni déséquilibrage (skew) ni déversement (spill). Dans le DAG SQL, l'opérateur d'analyse de la table indique que l'étape a lu environ 180 000 fichiers, pour la plupart de quelques kilo-octets.

    Vous devez réduire la durée de l'étape. La solution doit réduire au minimum le coût de calcul.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select a driver type twice as large", fr: "Sélectionner un type de pilote deux fois plus grand" } }
    - { id: b, text: { en: "Double the number of workers of the compute", fr: "Doubler le nombre de workers du calcul" } }
    - { id: c, text: { en: "Run OPTIMIZE on contoso.iot.readings", fr: "Exécuter OPTIMIZE sur contoso.iot.readings" } }
    - { id: d, text: { en: "Restart the compute before each run of the notebook", fr: "Redémarrer le calcul avant chaque exécution du notebook" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Tens of thousands of files or more read by a slow scan point to a small-file problem. Running OPTIMIZE compacts the small files into larger ones, and predictive optimization can then keep the table compacted; the same query reads far fewer files without adding compute."
    fr: "Des dizaines de milliers de fichiers ou plus lus par une analyse lente signalent un problème de petits fichiers. OPTIMIZE compacte les petits fichiers en fichiers plus grands, et l'optimisation prédictive peut ensuite garder la table compactée ; la même requête lit beaucoup moins de fichiers sans ajouter de calcul."
  options:
    b: { en: "More workers raise the cost and don't remove the overhead of opening many tiny files.", fr: "Davantage de workers augmentent le coût et ne suppriment pas la surcharge liée à l'ouverture de nombreux petits fichiers." }
    a: { en: "A larger driver helps an overloaded driver, not a scan of too many files on the workers.", fr: "Un pilote plus grand aide un pilote surchargé, pas une analyse de trop nombreux fichiers sur les workers." }
    d: { en: "A restart doesn't change the file layout of the table.", fr: "Un redémarrage ne modifie pas la disposition des fichiers de la table." }
references:
  - title: Slow Spark stage with little I/O
    url: https://learn.microsoft.com/en-us/azure/databricks/optimizations/spark-ui-guide/slow-spark-stage-low-io
