id: dp750-sr1-prod-bundle-3
objective: "4.3.5"
type: series_yesno
series: dp750-sr1-prod-bundle
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You add a step that validates the bundle for the prod target and then runs the job.
  fr: Vous ajoutez une étape qui valide le bundle pour la cible prod, puis exécute le travail.
body:
  solution:
    en: |
      The pipeline step runs the following commands:

      ```bash
      databricks bundle validate -t prod
      databricks bundle run -t prod daily_sales
      ```
    fr: |
      L'étape du pipeline exécute les commandes suivantes :

      ```bash
      databricks bundle validate -t prod
      databricks bundle run -t prod daily_sales
      ```
answer: { value: false }
explanation:
  correct:
    en: "`databricks bundle validate` only checks that the configuration files are syntactically correct; it does not deploy anything. `databricks bundle run` runs a resource that is already deployed, and since the bundle was never deployed to production, the daily_sales job is never created there."
    fr: "`databricks bundle validate` vérifie uniquement que les fichiers de configuration sont syntaxiquement corrects ; il ne déploie rien. `databricks bundle run` exécute une ressource déjà déployée, et comme le bundle n'a jamais été déployé en production, le travail daily_sales n'y est jamais créé."
references:
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
