id: dp750-4a-choose-sdp
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a new pipeline that ingests JSON files from **/Volumes/contoso/landing/web_events/** into bronze, silver and gold tables in the catalog **contoso_web**.

    The solution must meet the following requirements:

    - The transformations must be declared in SQL.
    - The order in which the tables are updated must be derived automatically from their dependencies.
    - Rows that break a quality rule must be removed, and the number of removed rows must be visible in the UI.
    - Minimize the orchestration code that the team writes and maintains.

    What should you use?
  fr: |
    Contoso crée un nouveau pipeline qui ingère des fichiers JSON de **/Volumes/contoso/landing/web_events/** dans des tables bronze, silver et gold du catalogue **contoso_web**.

    La solution doit répondre aux exigences suivantes :

    - Les transformations doivent être déclarées en SQL.
    - L'ordre de mise à jour des tables doit être déduit automatiquement de leurs dépendances.
    - Les lignes qui enfreignent une règle de qualité doivent être supprimées, et le nombre de lignes supprimées doit être visible dans l'interface utilisateur.
    - Réduire au minimum le code d'orchestration que l'équipe écrit et maintient.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "A driver notebook that calls one SQL notebook per layer with dbutils.notebook.run()", fr: "Un notebook pilote qui appelle un notebook SQL par couche avec dbutils.notebook.run()" }
    - id: b
      text: { en: "Lakeflow Spark Declarative Pipelines with streaming tables, materialized views and expectations", fr: "Les pipelines déclaratifs Lakeflow Spark avec des tables de diffusion en continu, des vues matérialisées et des attentes" }
    - id: c
      text: { en: "One SQL notebook task per layer in a Lakeflow job, with CHECK constraints on the tables", fr: "Une tâche notebook SQL par couche dans un job Lakeflow, avec des contraintes CHECK sur les tables" }
    - id: d
      text: { en: "A Python notebook that runs Structured Streaming queries with foreachBatch for each layer", fr: "Un notebook Python qui exécute des requêtes Structured Streaming avec foreachBatch pour chaque couche" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A pipeline analyzes the dependencies between its datasets and orders and parallelizes their updates. Expectations with ON VIOLATION DROP ROW remove the invalid rows and record the dropped count, shown in the Data quality tab of the pipeline UI.
    fr: |
      Un pipeline analyse les dépendances entre ses jeux de données, puis ordonne et parallélise leurs mises à jour. Les attentes avec ON VIOLATION DROP ROW suppriment les lignes non valides et enregistrent le nombre de lignes supprimées, affiché dans l'onglet Data quality de l'interface utilisateur du pipeline.
  options:
    a:
      en: |
        A driver notebook is orchestration code that the team must write, and it provides no built-in quality metrics.
      fr: |
        Un notebook pilote est du code d'orchestration que l'équipe doit écrire, et il ne fournit aucune métrique de qualité intégrée.
    c:
      en: |
        The job dependencies must be defined by hand, and a CHECK constraint makes the whole write fail instead of dropping the invalid rows.
      fr: |
        Les dépendances du job doivent être définies à la main, et une contrainte CHECK fait échouer toute l'écriture au lieu de supprimer les lignes non valides.
    d:
      en: |
        foreachBatch is imperative Python code, not SQL, and the order of the layers and the quality metrics must be coded by hand.
      fr: |
        foreachBatch est du code Python impératif, pas du SQL, et l'ordre des couches comme les métriques de qualité doivent être codés à la main.
references:
  - title: Pipeline concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/concepts
  - title: Manage data quality with pipeline expectations
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations
