id: dp750-cs4b-price-trigger
objective: "4.2.2"
type: single
caseStudy: dp750-cs4b-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You need to configure job_supplier_prices to meet the price job trigger requirement. What should you configure?
  fr: |
    Vous devez configurer job_supplier_prices pour satisfaire l'exigence de déclenchement du job de prix. Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A file arrival trigger on ext_supplier_drop with Minimum time between triggers in seconds set to 600", fr: "Un déclencheur d'arrivée de fichiers sur ext_supplier_drop avec Minimum time between triggers in seconds défini sur 600" } }
    - { id: b, text: { en: "A scheduled trigger every 15 minutes that runs a first task to check ext_supplier_drop for new files", fr: "Un déclencheur planifié toutes les 15 minutes qui exécute une première tâche de recherche de nouveaux fichiers dans ext_supplier_drop" } }
    - { id: c, text: { en: "A continuous trigger on the job, with ingest_prices configured to process only the new files", fr: "Un déclencheur continu sur le job, avec ingest_prices configurée pour ne traiter que les nouveaux fichiers" } }
    - { id: d, text: { en: "A file arrival trigger on ext_supplier_drop with Wait after last change in seconds set to 300", fr: "Un déclencheur d'arrivée de fichiers sur ext_supplier_drop avec Wait after last change in seconds défini sur 300" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A file arrival trigger starts the job when new files arrive in a Unity Catalog external location, without a schedule or polling code. Wait after last change in seconds delays the run until no new file has arrived for that long; 300 seconds is longer than the two-minute gap between files of a delivery and much shorter than the two hours between deliveries, so the job runs once, after the last file.
    fr: |
      Un déclencheur d'arrivée de fichiers démarre le job quand de nouveaux fichiers arrivent dans un emplacement externe Unity Catalog, sans planification ni code d'interrogation. Wait after last change in seconds retarde l'exécution jusqu'à ce qu'aucun nouveau fichier ne soit arrivé pendant cette durée ; 300 secondes dépassent l'intervalle de deux minutes entre les fichiers d'une livraison et restent bien inférieures aux deux heures entre livraisons : le job s'exécute une fois, après le dernier fichier.
  options:
    a:
      en: |
        Minimum time between triggers is a cooldown between runs: the first run can start as soon as the first file of a delivery arrives, before the delivery is complete.
      fr: |
        Minimum time between triggers est un délai minimal entre deux exécutions : la première exécution peut démarrer dès l'arrivée du premier fichier d'une livraison, avant que celle-ci ne soit complète.
    b:
      en: |
        A scheduled trigger is a fixed schedule, and the checking task is custom polling code; both are excluded by the requirement.
      fr: |
        Un déclencheur planifié est une planification fixe, et la tâche de recherche est du code d'interrogation personnalisé ; l'exigence exclut les deux.
    c:
      en: |
        A continuous trigger starts a new run as soon as the previous one ends, so the job runs all the time instead of once per delivery.
      fr: |
        Un déclencheur continu démarre une nouvelle exécution dès la fin de la précédente : le job s'exécute en permanence au lieu d'une fois par livraison.
references:
  - title: Trigger jobs when new files arrive
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/file-arrival-triggers
