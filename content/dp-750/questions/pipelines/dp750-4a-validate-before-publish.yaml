id: dp750-4a-validate-before-publish
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a Lakeflow job named **finance_daily** that contains three notebook tasks:

    | Task | Depends on | Action |
    | --- | --- | --- |
    | load_silver | | Loads litware.silver.ledger |
    | publish_gold | load_silver | Overwrites litware.gold.revenue, which Power BI reports read |
    | check_quality | publish_gold | Reconciles totals and raises an exception if they don't match |

    Last week, revenue figures that failed the reconciliation appeared in the reports before check_quality failed.

    You need to prevent the reports from showing data that fails the reconciliation.

    What should you do?
  fr: |
    Litware dispose d'un job Lakeflow nommé **finance_daily** qui contient trois tâches notebook :

    | Tâche | Dépend de | Action |
    | --- | --- | --- |
    | load_silver | | Charge litware.silver.ledger |
    | publish_gold | load_silver | Remplace litware.gold.revenue, que lisent les rapports Power BI |
    | check_quality | publish_gold | Rapproche les totaux et lève une exception s'ils ne concordent pas |

    La semaine dernière, des chiffres d'affaires qui ne passaient pas le rapprochement sont apparus dans les rapports avant l'échec de check_quality.

    Vous devez empêcher les rapports d'afficher des données qui ne passent pas le rapprochement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Make check_quality depend on load_silver, and make publish_gold depend on check_quality.", fr: "Faire dépendre check_quality de load_silver, et publish_gold de check_quality." }
    - id: b
      text: { en: "Keep the dependencies, and set the Run if condition of check_quality to All done.", fr: "Conserver les dépendances, et définir la condition Run if de check_quality sur All done." }
    - id: c
      text: { en: "Keep the dependencies, and add a retry policy with three retries to publish_gold.", fr: "Conserver les dépendances, et ajouter à publish_gold une stratégie de trois nouvelles tentatives." }
    - id: d
      text: { en: "Keep the dependencies, and add a failure notification to the check_quality task.", fr: "Conserver les dépendances, et ajouter une notification d'échec à la tâche check_quality." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Validation must run before publication. When check_quality runs on the silver data and publish_gold depends on it with the default All succeeded condition, a failed reconciliation stops the job before the gold table that the reports read is overwritten.
    fr: |
      La validation doit s'exécuter avant la publication. Quand check_quality s'exécute sur les données silver et que publish_gold en dépend avec la condition par défaut All succeeded, un rapprochement en échec arrête le job avant que la table gold lue par les rapports ne soit remplacée.
  options:
    b:
      en: |
        All done only changes when check_quality runs; the check still runs after the data has been published.
      fr: |
        All done ne change que le moment où check_quality s'exécute ; la vérification a toujours lieu après la publication des données.
    c:
      en: |
        Retries rerun publish_gold after a failure; they do nothing about data that is published successfully but is wrong.
      fr: |
        Les nouvelles tentatives réexécutent publish_gold après un échec ; elles ne font rien contre des données publiées avec succès mais incorrectes.
    d:
      en: |
        A notification tells people about the failure, but the reports have already read the published data.
      fr: |
        Une notification informe les personnes de l'échec, mais les rapports ont déjà lu les données publiées.
references:
  - title: Configure task dependencies
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-if
