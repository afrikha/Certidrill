id: dp750-cs3c-git-workflow
objective: "4.3.2"
type: single
caseStudy: dp750-cs3c-southridge-video
difficulty: 1
status: draft
stem:
  en: |
    You need to change the way the engineers work with sv-pipelines to meet development lifecycle requirements 1 and 2.

    What should you recommend?
  fr: |
    Vous devez modifier la façon dont les ingénieurs travaillent avec sv-pipelines pour satisfaire les exigences 1 et 2 du cycle de vie du développement.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep the shared Git folder, and have each engineer commit to main only after running the notebooks in adb-sv-dev.", fr: "Conserver le dossier Git partagé, et demander à chaque ingénieur de ne commiter sur main qu'après avoir exécuté les notebooks dans adb-sv-dev." } }
    - { id: b, text: { en: "Have each engineer clone sv-pipelines into a Git folder under their own user folder, and push to main after a teammate checks the Git folder.", fr: "Demander à chaque ingénieur de cloner sv-pipelines dans un dossier Git de son propre dossier utilisateur, puis de pousser sur main après une vérification du dossier Git par un collègue." } }
    - { id: c, text: { en: "Have each engineer clone sv-pipelines into a Git folder under their own user folder, work on a feature branch, and open a pull request to main.", fr: "Demander à chaque ingénieur de cloner sv-pipelines dans un dossier Git de son propre dossier utilisateur, de travailler sur une branche de fonctionnalité et d'ouvrir une pull request vers main." } }
    - { id: d, text: { en: "Create a production Git folder in adb-sv-prod that every engineer edits, and merge the changes into main once a week.", fr: "Créer dans adb-sv-prod un dossier Git de production que chaque ingénieur modifie, et fusionner les modifications dans main une fois par semaine." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Databricks recommends that each developer work on their own branch, in a Git folder cloned under their own user folder, so that one engineer's changes do not affect the others. Changes reach main through a pull request in the Git provider, where a teammate reviews them before the merge.
    fr: |
      Databricks recommande que chaque développeur travaille sur sa propre branche, dans un dossier Git cloné sous son propre dossier utilisateur, afin que les modifications d'un ingénieur n'affectent pas les autres. Les modifications arrivent sur main par une pull request dans le fournisseur Git, où un collègue les relit avant la fusion.
  options:
    a: { en: "In a shared Git folder, the engineers still work in the same checkout, and nothing enforces a review before changes reach main.", fr: "Dans un dossier Git partagé, les ingénieurs travaillent toujours dans la même copie de travail, et rien n'impose de relecture avant que les modifications n'arrivent sur main." }
    b: { en: "Pushing directly to main bypasses pull requests, so the review is not recorded or enforced before the merge.", fr: "Pousser directement sur main contourne les pull requests : la relecture n'est ni tracée ni imposée avant la fusion." }
    d: { en: "A production Git folder must be updated only by automation when pull requests are merged; engineers should have run-only access to it.", fr: "Un dossier Git de production ne doit être mis à jour que par l'automatisation lors de la fusion des pull requests ; les ingénieurs doivent n'y avoir qu'un accès en exécution." }
references:
  - title: CI/CD with Databricks Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/ci-cd-techniques-with-repos
