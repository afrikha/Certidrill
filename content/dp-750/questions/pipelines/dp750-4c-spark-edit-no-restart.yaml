id: dp750-4c-spark-edit-no-restart
objective: "4.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's analysts are running notebooks on an all-purpose compute resource named **analytics-shared**. Their queries have become slow because the compute is undersized for the current load.

    You need to change the configuration of analytics-shared now. The change must not restart the compute, so that the analysts' work is not disrupted.

    Which change can you make?
  fr: |
    Les analystes de Fabrikam exécutent des notebooks sur une ressource de calcul polyvalent nommée **analytics-shared**. Leurs requêtes sont devenues lentes, car le calcul est sous-dimensionné pour la charge actuelle.

    Vous devez modifier la configuration d'analytics-shared dès maintenant. La modification ne doit pas redémarrer le calcul, pour ne pas perturber le travail des analystes.

    Quelle modification pouvez-vous effectuer ?
body:
  options:
    - { id: a, text: { en: "Increase the number of workers", fr: "Augmenter le nombre de workers" } }
    - { id: b, text: { en: "Add a Spark configuration property", fr: "Ajouter une propriété de configuration Spark" } }
    - { id: c, text: { en: "Select a newer Databricks Runtime version", fr: "Sélectionner une version plus récente de Databricks Runtime" } }
    - { id: d, text: { en: "Add an environment variable", fr: "Ajouter une variable d'environnement" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Editing any attribute of a running compute requires a restart, except for the compute size and the permissions. Increasing the number of workers changes the size, so it applies without disrupting the attached notebooks."
    fr: "La modification de n'importe quel attribut d'un calcul en cours d'exécution exige un redémarrage, sauf pour la taille du calcul et les autorisations. Augmenter le nombre de workers modifie la taille : la modification s'applique sans perturber les notebooks attachés."
  options:
    b: { en: "A Spark configuration change requires a restart of the running compute.", fr: "Une modification de la configuration Spark exige un redémarrage du calcul en cours d'exécution." }
    c: { en: "A runtime change requires a restart of the running compute.", fr: "Un changement de runtime exige un redémarrage du calcul en cours d'exécution." }
    d: { en: "An environment variable change requires a restart of the running compute.", fr: "Une modification de variable d'environnement exige un redémarrage du calcul en cours d'exécution." }
references:
  - title: Manage classic compute
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage
