id: dp750-4b-quartz-cron-weekly
objective: "4.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are defining the schedule of a Lakeflow job named **fabrikam_archive_weekly** by using the Jobs API. The job must run every Sunday at 03:15 UTC.

    How should you complete the schedule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez la planification d'un job Lakeflow nommé **fabrikam_archive_weekly** à l'aide de l'API Jobs. Le job doit s'exécuter chaque dimanche à 03:15 UTC.

    Comment devez-vous compléter la planification ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "schedule": {
        "quartz_cron_expression": "0 [[min]] [[hour]] ? * [[day]]",
        "timezone_id": "[[tz]]",
        "pause_status": "UNPAUSED"
      }
    }
  slots:
    - id: min
      options:
        - { id: m3, text: "3" }
        - { id: m15, text: "15" }
        - { id: m0, text: "0" }
    - id: hour
      options:
        - { id: h15, text: "15" }
        - { id: h0, text: "0" }
        - { id: h3, text: "3" }
    - id: day
      options:
        - { id: sun, text: SUN }
        - { id: sat, text: SAT }
        - { id: wk, text: MON-FRI }
    - id: tz
      options:
        - { id: paris, text: Europe/Paris }
        - { id: utc, text: UTC }
        - { id: ny, text: America/New_York }
answer:
  values: { min: m15, hour: h3, day: sun, tz: utc }
explanation:
  correct:
    en: |
      A Quartz cron expression lists seconds, minutes, hours, day of month, month and day of week, so `0 15 3 ? * SUN` fires at 03:15:00 every Sunday; `?` means no specific day of month. `timezone_id` set to UTC interprets the expression in UTC.
    fr: |
      Une expression cron Quartz indique les secondes, les minutes, les heures, le jour du mois, le mois et le jour de la semaine : `0 15 3 ? * SUN` se déclenche à 03:15:00 chaque dimanche ; `?` signifie aucun jour du mois précis. `timezone_id` défini sur UTC interprète l'expression en UTC.
  options:
    m3: { en: "The second field is the minutes: 3 would run at minute 3.", fr: "Le deuxième champ correspond aux minutes : 3 exécuterait à la minute 3." }
    h15: { en: "The third field is the hours: 15 would run in the afternoon.", fr: "Le troisième champ correspond aux heures : 15 exécuterait l'après-midi." }
    sat: { en: "SAT is Saturday.", fr: "SAT correspond au samedi." }
    wk: { en: "MON-FRI runs on weekdays only.", fr: "MON-FRI n'exécute que les jours ouvrés." }
    paris: { en: "Europe/Paris would run at 03:15 Paris time, which is not 03:15 UTC.", fr: "Europe/Paris exécuterait à 03:15 heure de Paris, ce qui n'est pas 03:15 UTC." }
references:
  - title: Run jobs on a schedule
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/scheduled
  - title: Declarative Automation Bundles resources
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/resources
