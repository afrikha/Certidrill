id: dp750-cs3a-export-trigger
objective: "4.2.2"
type: single
caseStudy: dp750-cs3a-proseware
difficulty: 3
status: draft
stem:
  en: You need to configure job-partner-export to meet gold layer requirement 6. What should you configure?
  fr: Vous devez configurer job-partner-export pour satisfaire l'exigence 6 de la couche gold. Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A table update trigger on silver.sales and silver.refunds with Trigger when set to Any table is updated and Minimum time between triggers set to 600 seconds", fr: "Un déclencheur de mise à jour de table sur silver.sales et silver.refunds, avec Trigger when défini sur Any table is updated et Minimum time between triggers défini sur 600 secondes" } }
    - { id: b, text: { en: "A table update trigger on silver.sales and silver.refunds with Trigger when set to All tables are updated and Wait after last change set to 600 seconds", fr: "Un déclencheur de mise à jour de table sur silver.sales et silver.refunds, avec Trigger when défini sur All tables are updated et Wait after last change défini sur 600 secondes" } }
    - { id: c, text: { en: "A file arrival trigger on the storage location of silver.sales with Wait after last change set to 600 seconds", fr: "Un déclencheur d'arrivée de fichiers sur l'emplacement de stockage de silver.sales, avec Wait after last change défini sur 600 secondes" } }
    - { id: d, text: { en: "A scheduled trigger every 10 minutes with an If/else condition task that compares the versions of both tables", fr: "Un déclencheur planifié toutes les 10 minutes, avec une tâche de condition If/else qui compare les versions des deux tables" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A table update trigger starts a run when Unity Catalog tables are updated, without a continuously running cluster. With All tables are updated, the job waits until both tables have new data. Wait after last change delays the run after an update and restarts the timer at each new commit, so the job starts only after the last commit of the burst.
    fr: |
      Un déclencheur de mise à jour de table démarre une exécution quand des tables Unity Catalog sont mises à jour, sans cluster exécuté en continu. Avec All tables are updated, le job attend que les deux tables aient reçu de nouvelles données. Wait after last change retarde l'exécution après une mise à jour et relance le minuteur à chaque nouveau commit : le job ne démarre qu'après le dernier commit du chargement.
  options:
    a: { en: "Any table is updated starts the job when only one table has new data, and Minimum time between triggers is measured from the end of the previous run, not from the last commit.", fr: "Any table is updated démarre le job quand une seule table a de nouvelles données, et Minimum time between triggers se mesure depuis la fin de l'exécution précédente, pas depuis le dernier commit." }
    c: { en: "A file arrival trigger watches files in a storage location; it ignores silver.refunds and does not react to table commits.", fr: "Un déclencheur d'arrivée de fichiers surveille des fichiers dans un emplacement de stockage ; il ignore silver.refunds et ne réagit pas aux commits de table." }
    d: { en: "A scheduled trigger starts compute every 10 minutes even when no data arrived, which the requirement forbids.", fr: "Un déclencheur planifié démarre du calcul toutes les 10 minutes même quand aucune donnée n'est arrivée, ce que l'exigence interdit." }
references:
  - title: Trigger jobs when source tables are updated
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/trigger-table-update
