id: dp750-4c-test-e2e-timing
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam develops a daily Lakeflow Jobs workflow that loads `fabrikam_test.finance.ledger_raw` and produces `fabrikam_test.finance.daily_summary`. Developers commit to their feature branches many times a day.

    An end-to-end test copies test input files, runs the whole workflow, checks the row count and totals of the summary table, and then cleans up. The test takes about 40 minutes.

    You need to run the end-to-end test without slowing down the developers' commit cycle, and the test must still run before each release.

    When should the test run?
  fr: |
    Fabrikam développe un workflow Lakeflow Jobs quotidien qui charge `fabrikam_test.finance.ledger_raw` et produit `fabrikam_test.finance.daily_summary`. Les développeurs valident (commit) sur leurs branches de fonctionnalité de nombreuses fois par jour.

    Un test de bout en bout copie des fichiers d'entrée de test, exécute tout le workflow, vérifie le nombre de lignes et les totaux de la table de synthèse, puis nettoie les données. Le test dure environ 40 minutes.

    Vous devez exécuter le test de bout en bout sans ralentir le cycle de validation des développeurs, et le test doit quand même s'exécuter avant chaque mise en production.

    Quand le test doit-il s'exécuter ?
body:
  options:
    - { id: a, text: { en: "After every commit, from each developer's Git folder", fr: "Après chaque commit, depuis le dossier Git de chaque développeur" } }
    - { id: b, text: { en: "In the deployment pipeline, before the release to production", fr: "Dans le pipeline de déploiement, avant la mise en production" } }
    - { id: c, text: { en: "After the release, when business users validate the reports", fr: "Après la mise en production, quand les utilisateurs métier valident les rapports" } }
    - { id: d, text: { en: "Never, because the unit tests cover the same functions", fr: "Jamais, car les tests unitaires couvrent les mêmes fonctions" } }
answer: { optionId: b }
explanation:
  correct:
    en: "End-to-end tests validate the complete workflow but are slow, so Microsoft recommends scheduling them off-peak or as part of the deployment pipeline rather than on every code change. Running them in the deployment pipeline keeps the commit cycle fast and still blocks a release that breaks the workflow."
    fr: "Les tests de bout en bout valident le flux complet mais sont lents ; Microsoft recommande donc de les planifier en heures creuses ou dans le pipeline de déploiement plutôt qu'à chaque modification du code. Les exécuter dans le pipeline de déploiement garde un cycle de validation rapide tout en bloquant une mise en production qui casse le workflow."
  options:
    a:
      en: "A 40-minute test after every commit slows down the developers, which the requirement forbids."
      fr: "Un test de 40 minutes après chaque commit ralentit les développeurs, ce que l'exigence interdit."
    c:
      en: "Business validation is user acceptance testing; running the end-to-end test after the release doesn't check the workflow before it reaches production."
      fr: "La validation métier relève des tests d'acceptation utilisateur ; exécuter le test de bout en bout après la mise en production ne vérifie pas le workflow avant son arrivée en production."
    d:
      en: "Unit tests check functions in isolation; they don't prove that the whole workflow produces the expected result."
      fr: "Les tests unitaires vérifient les fonctions isolément ; ils ne prouvent pas que le workflow complet produit le résultat attendu."
references:
  - title: Implement testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy
