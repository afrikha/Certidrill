stem:
  en: You run the three notebooks interactively on all-purpose compute.
  fr: Vous exécutez les trois notebooks de manière interactive sur un calcul polyvalent.
body:
  solution:
    en: You attach the notebooks of transform, load_gold and refresh_reports to an all-purpose compute resource and run them one after the other.
    fr: Vous attachez les notebooks de transform, load_gold et refresh_reports à une ressource de calcul polyvalent (all-purpose) et les exécutez l'un après l'autre.
answer: { value: false }
explanation:
  correct:
    en: Running the notebooks interactively refreshes the tables, but it is not part of the job run, so last night's run of daily-sales stays failed in the job run history. Repairing the run is the way to re-run only the failed and dependent tasks within that run.
    fr: "L'exécution interactive des notebooks actualise les tables, mais elle ne fait pas partie de l'exécution du travail : l'exécution de la nuit dernière de daily-sales reste en échec dans l'historique des exécutions. La réparation de l'exécution permet de réexécuter uniquement les tâches en échec et dépendantes au sein de cette exécution."
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
