id: dp750-4b-job-git-provider-source
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The tasks of a Lakeflow job named **adatum_pricing_nightly** run notebooks stored in the workspace Git folder `/Workspace/Shared/pricing`. Developers sometimes pull or switch branches in that folder while the job runs. Last night, a run failed because its tasks used notebooks from two different commits.

    You need every run to use one consistent version of the code from the `main` branch, whatever Git operations happen in the workspace. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Les tâches d'un job Lakeflow nommé **adatum_pricing_nightly** exécutent des notebooks stockés dans le dossier Git d'espace de travail `/Workspace/Shared/pricing`. Les développeurs font parfois un pull ou changent de branche dans ce dossier pendant l'exécution du job. La nuit dernière, une exécution a échoué parce que ses tâches ont utilisé des notebooks issus de deux commits différents.

    Chaque exécution doit utiliser une version cohérente du code de la branche `main`, quelles que soient les opérations Git effectuées dans l'espace de travail. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable queueing for the job and set max concurrent runs to 1.", fr: "Activer la mise en file d'attente pour le job et définir max concurrent runs sur 1." } }
    - { id: b, text: { en: "Save the notebooks of the folder in IPYNB format.", fr: "Enregistrer les notebooks du dossier au format IPYNB." } }
    - { id: c, text: { en: "Configure the tasks to use the Git provider as their source, on the main branch.", fr: "Configurer les tâches pour qu'elles utilisent le fournisseur Git comme source, sur la branche main." } }
    - { id: d, text: { en: "Enable sparse checkout on /Workspace/Shared/pricing.", fr: "Activer le sparse checkout sur /Workspace/Shared/pricing." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Jobs can run during Git operations on a workspace Git folder, but a run might then mix notebook versions and fail. When the tasks use the Git provider as their source, each run checks out the code from the remote repository, independently of the Git folders in the workspace.
    fr: |
      Les jobs peuvent s'exécuter pendant des opérations Git sur un dossier Git de l'espace de travail, mais une exécution risque alors de mélanger des versions de notebooks et d'échouer. Quand les tâches utilisent le fournisseur Git comme source, chaque exécution extrait le code du dépôt distant, indépendamment des dossiers Git de l'espace de travail.
  options:
    a: { en: "Queueing controls overlapping runs of the job, not the Git operations of developers on the folder.", fr: "La file d'attente gère les exécutions simultanées du job, pas les opérations Git des développeurs sur le dossier." }
    b: { en: "The notebook format decides whether outputs are committed; the folder still changes during pulls.", fr: "Le format du notebook détermine si les sorties sont validées ; le dossier change toujours pendant les pulls." }
    d: { en: "Sparse checkout limits which folders are checked out; pulls and branch switches still change them.", fr: "Le sparse checkout limite les dossiers extraits ; les pulls et changements de branche les modifient toujours." }
references:
  - title: Azure Databricks Git folder limits and reference
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/limits
