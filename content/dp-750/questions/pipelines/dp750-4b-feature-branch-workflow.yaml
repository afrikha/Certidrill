id: dp750-4b-feature-branch-workflow
objective: "4.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores its data engineering code in a GitHub repository whose `main` branch is the deployment branch. A new data engineer must add a deduplication step to the notebook `transactions_silver.py`. The change must be reviewed before it reaches `main`, and the engineer has not cloned the repository yet.

    Which five actions should the engineer perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank stocke son code d'ingénierie des données dans un dépôt GitHub dont la branche `main` est la branche de déploiement. Un nouvel ingénieur données doit ajouter une étape de déduplication au notebook `transactions_silver.py`. La modification doit être revue avant d'atteindre `main`, et l'ingénieur n'a pas encore cloné le dépôt.

    Quelles sont les cinq actions que l'ingénieur doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: clone, text: { en: "Clone the repository into a Git folder under the engineer's /Workspace/Users/ folder.", fr: "Cloner le dépôt dans un dossier Git sous le dossier /Workspace/Users/ de l'ingénieur." } }
    - { id: branch, text: { en: "Create the branch feature/txn-dedup from main.", fr: "Créer la branche feature/txn-dedup à partir de main." } }
    - { id: commit, text: { en: "Edit transactions_silver.py, and then select Commit & Push.", fr: "Modifier transactions_silver.py, puis sélectionner Commit & Push." } }
    - { id: pr, text: { en: "In GitHub, create a pull request into main, and merge it after the review.", fr: "Dans GitHub, créer une pull request vers main, puis la fusionner après la revue." } }
    - { id: pull, text: { en: "Switch the Git folder to main, and then pull the updated branch.", fr: "Basculer le dossier Git sur main, puis faire un pull de la branche mise à jour." } }
    - { id: merge, text: { en: "In the Git folder dialog, merge feature/txn-dedup into main.", fr: "Dans la boîte de dialogue du dossier Git, fusionner feature/txn-dedup dans main." } }
    - { id: reset, text: { en: "Reset main to the state of feature/txn-dedup.", fr: "Réinitialiser main sur l'état de feature/txn-dedup." } }
answer:
  sequence: [ clone, branch, commit, pr, pull ]
explanation:
  correct:
    en: |
      Each developer clones the repository into their own user folder and creates a feature branch from main. After committing and pushing, the developer opens a pull request in the Git provider, where the team reviews and merges it into the deployment branch. Pulling main afterward brings the merged change into the Git folder.
    fr: |
      Chaque développeur clone le dépôt dans son propre dossier utilisateur et crée une branche de fonctionnalité à partir de main. Après le commit et le push, il ouvre une pull request chez le fournisseur Git, où l'équipe la revoit et la fusionne dans la branche de déploiement. Un pull de main rapporte ensuite la modification fusionnée dans le dossier Git.
  options:
    merge: { en: "Merging from the Git folder pushes to main without the required review.", fr: "Fusionner depuis le dossier Git pousse vers main sans la revue exigée." }
    reset: { en: "A reset force-pushes another branch's state and history and bypasses the review.", fr: "Une réinitialisation force l'envoi de l'état et de l'historique d'une autre branche et contourne la revue." }
references:
  - title: CI/CD with Databricks Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/ci-cd
