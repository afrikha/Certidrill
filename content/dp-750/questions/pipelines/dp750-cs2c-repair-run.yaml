id: dp750-cs2c-repair-run
objective: "4.4.2"
type: single
caseStudy: dp750-cs2c-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You need to complete last night's run of fc_nightly_sales with the fixed notebook. The solution must meet the nightly job requirements.

    What should you do?
  fr: |
    Vous devez mener à bien l'exécution de la nuit dernière de fc_nightly_sales avec le notebook corrigé. La solution doit respecter les exigences relatives au job nocturne.

    Que devez-vous faire ?
body:
  options:
    - { id: runnow, text: { en: "Open the job and select Run now", fr: "Ouvrir le job et sélectionner Run now" } }
    - { id: restart, text: { en: "Open last night's run and select Restart run", fr: "Ouvrir l'exécution de la nuit dernière et sélectionner Restart run" } }
    - { id: newjob, text: { en: "Create a job that contains only the failed task and its dependents, and run it", fr: "Créer un job qui contient uniquement la tâche en échec et ses tâches dépendantes, puis l'exécuter" } }
    - { id: repair, text: { en: "Open last night's run and select Repair run", fr: "Ouvrir l'exécution de la nuit dernière et sélectionner Repair run" } }
answer: { optionId: repair }
explanation:
  correct:
    en: A repair run reruns only the unsuccessful tasks of a multi-task run and the tasks that depend on them, here transform_inventory, publish_gold, cleanup_staging and alert_oncall. The tasks that succeeded are not run again, and the rerun uses the current task settings, so it picks up the fixed notebook.
    fr: "Une exécution de réparation réexécute uniquement les tâches non réussies d'une exécution multitâche et les tâches qui en dépendent, ici transform_inventory, publish_gold, cleanup_staging et alert_oncall. Les tâches qui ont réussi ne sont pas réexécutées, et la réexécution utilise les paramètres actuels des tâches : elle prend donc en compte le notebook corrigé."
  options:
    runnow:
      en: Run now starts a new run of every task, including ingest_pos, load_loyalty and transform_sales, which already succeeded.
      fr: Run now démarre une nouvelle exécution de toutes les tâches, y compris ingest_pos, load_loyalty et transform_sales, qui ont déjà réussi.
    restart:
      en: Restart run applies to continuous jobs in exponential backoff; it cancels the active run and starts a new one.
      fr: Restart run s'applique aux jobs continus en temporisation exponentielle ; elle annule l'exécution active et en démarre une nouvelle.
    newjob:
      en: A separate job duplicates the configuration and leaves last night's run of fc_nightly_sales failed, which adds effort without completing the original run.
      fr: Un job distinct duplique la configuration et laisse en échec l'exécution de la nuit dernière de fc_nightly_sales, ce qui ajoute de l'effort sans mener à bien l'exécution d'origine.
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
