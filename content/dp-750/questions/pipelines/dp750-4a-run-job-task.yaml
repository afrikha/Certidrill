id: dp750-4a-run-job-task
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Lakeflow job named **nw_refresh_dimensions** that several teams already run. It contains six tasks that refresh the tables of **northwind.gold**.

    You are creating a new job named **nw_sales_daily**. Its first step must run nw_refresh_dimensions, and a notebook task must run after that step succeeds. The tasks of nw_refresh_dimensions must not be duplicated in the new job.

    Which task type should you use for the first step of nw_sales_daily?
  fr: |
    Northwind Traders dispose d'un job Lakeflow nommé **nw_refresh_dimensions** que plusieurs équipes exécutent déjà. Il contient six tâches qui actualisent les tables de **northwind.gold**.

    Vous créez un nouveau job nommé **nw_sales_daily**. Sa première étape doit exécuter nw_refresh_dimensions, et une tâche notebook doit s'exécuter après la réussite de cette étape. Les tâches de nw_refresh_dimensions ne doivent pas être dupliquées dans le nouveau job.

    Quel type de tâche devez-vous utiliser pour la première étape de nw_sales_daily ?
body:
  options:
    - id: a
      text: For each
    - id: b
      text: Run Job
    - id: c
      text: Pipeline
    - id: d
      text: If/else condition
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Run Job task triggers another job of the workspace from within a job, so the existing job is reused as one step. The notebook task can then depend on the Run Job task, and job parameters can be pushed down to the called job.
    fr: |
      Une tâche Run Job déclenche un autre job de l'espace de travail depuis un job : le job existant est réutilisé comme une seule étape. La tâche notebook peut ensuite dépendre de la tâche Run Job, et des paramètres de job peuvent être transmis au job appelé.
  options:
    a:
      en: |
        A For each task runs one nested task once per element of an array; it doesn't call an existing job as a step.
      fr: |
        Une tâche For each exécute une tâche imbriquée une fois par élément d'un tableau ; elle n'appelle pas un job existant comme étape.
    c:
      en: |
        A Pipeline task runs an update of a Lakeflow pipeline, not another job.
      fr: |
        Une tâche Pipeline lance une mise à jour d'un pipeline Lakeflow, pas un autre job.
    d:
      en: |
        An If/else condition task branches on a boolean expression; it doesn't run any workload.
      fr: |
        Une tâche If/else condition crée une branche selon une expression booléenne ; elle n'exécute aucune charge de travail.
references:
  - title: Run Job task for jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/tasks/run-job
