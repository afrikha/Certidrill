id: dp750-4a-side-effects
objective: "4.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A data engineer at Contoso migrated part of a notebook to a Python source file of a Lakeflow Spark Declarative Pipelines pipeline. The file contains the following code.

    ```python
    from pyspark import pipelines as dp
    from pyspark.sql import functions as F

    @dp.table
    def orders_silver():
        df = (spark.readStream.table("orders_bronze")
              .filter("amount IS NOT NULL")
              .withColumn("order_ts", F.to_timestamp("order_ts")))
        print(df.count())
        df.write.saveAsTable("contoso.audit.orders_copy")
        return df
    ```

    Which two operations should you remove so that the dataset definition follows the coding requirements of pipelines?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un ingénieur données de Contoso a migré une partie d'un notebook vers un fichier source Python d'un pipeline des pipelines déclaratifs Lakeflow Spark. Le fichier contient le code suivant.

    ```python
    from pyspark import pipelines as dp
    from pyspark.sql import functions as F

    @dp.table
    def orders_silver():
        df = (spark.readStream.table("orders_bronze")
              .filter("amount IS NOT NULL")
              .withColumn("order_ts", F.to_timestamp("order_ts")))
        print(df.count())
        df.write.saveAsTable("contoso.audit.orders_copy")
        return df
    ```

    Quelles sont les deux opérations à supprimer pour que la définition du jeu de données respecte les exigences de codage des pipelines ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "spark.readStream.table(\"orders_bronze\")" }
    - { id: b, text: ".filter(\"amount IS NOT NULL\")" }
    - { id: c, text: ".withColumn(\"order_ts\", F.to_timestamp(\"order_ts\"))" }
    - { id: d, text: "df.count()" }
    - { id: e, text: "df.write.saveAsTable(\"contoso.audit.orders_copy\")" }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: |
      A pipeline evaluates dataset code several times during planning and runs, so the function must only build and return a DataFrame. Actions such as count() and writes such as saveAsTable() are listed among the operations that must not appear in pipeline code.
    fr: |
      Un pipeline évalue le code des jeux de données plusieurs fois pendant la planification et les exécutions : la fonction doit seulement construire et renvoyer un DataFrame. Les actions comme count() et les écritures comme saveAsTable() font partie des opérations qui ne doivent pas figurer dans le code d'un pipeline.
  options:
    a:
      en: |
        A streaming read of the bronze dataset is the normal source of a streaming table.
      fr: |
        Une lecture en streaming du jeu de données bronze est la source normale d'une table de diffusion en continu.
    b:
      en: |
        A filter is a transformation of the returned DataFrame, which is allowed.
      fr: |
        Un filtre est une transformation du DataFrame renvoyé, ce qui est autorisé.
    c:
      en: |
        Casting a column is a transformation of the returned DataFrame, which is allowed.
      fr: |
        La conversion d'une colonne est une transformation du DataFrame renvoyé, ce qui est autorisé.
references:
  - title: Lakeflow pipelines Python language reference
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/developer/python-ref
