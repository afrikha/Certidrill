id: dp750-4c-cli-stale-lock
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin deploys a Databricks Asset Bundle to its `prod` target from an Azure DevOps pipeline by running `databricks bundle deploy -t prod`. Yesterday, the build agent crashed in the middle of a deployment.

    Since then, every deployment to `prod` fails because a deployment lock is already held. You confirm that no other deployment is running.

    You need to deploy the bundle without changing its configuration.

    Which option should you add to the command?
  fr: |
    Tailspin déploie un bundle de ressources Databricks sur sa cible `prod` depuis un pipeline Azure DevOps en exécutant `databricks bundle deploy -t prod`. Hier, l'agent de build s'est arrêté brutalement au milieu d'un déploiement.

    Depuis, chaque déploiement sur `prod` échoue, car un verrou de déploiement est déjà détenu. Vous confirmez qu'aucun autre déploiement n'est en cours.

    Vous devez déployer le bundle sans modifier sa configuration.

    Quelle option devez-vous ajouter à la commande ?
body:
  options:
    - { id: a, text: "--force" }
    - { id: b, text: "--force-lock" }
    - { id: c, text: "--auto-approve" }
    - { id: d, text: "--fail-on-active-runs" }
answer: { optionId: b }
explanation:
  correct:
    en: "`--force-lock` forces the acquisition of the deployment lock. It disables the protection against concurrent deployments, so use it only when a previous deployment crashed or was interrupted and left a stale lock, as here."
    fr: "`--force-lock` force l'acquisition du verrou de déploiement. Il désactive la protection contre les déploiements simultanés : utilisez-le uniquement quand un déploiement précédent s'est arrêté brutalement ou a été interrompu en laissant un verrou obsolète, comme ici."
  options:
    a: { en: "--force overrides validations such as the Git branch check of production mode; it doesn't release the lock.", fr: "--force contourne des validations comme la vérification de branche Git du mode production ; il ne libère pas le verrou." }
    c: { en: "--auto-approve skips interactive approvals; the lock still blocks the deployment.", fr: "--auto-approve ignore les approbations interactives ; le verrou bloque toujours le déploiement." }
    d: { en: "--fail-on-active-runs makes the deployment fail when jobs or pipelines are running; it adds a check instead of removing the lock.", fr: "--fail-on-active-runs fait échouer le déploiement quand des jobs ou des pipelines s'exécutent ; il ajoute une vérification au lieu de lever le verrou." }
references:
  - title: bundle command group
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands
