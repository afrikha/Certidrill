id: dp750-4b-file-arrival-statements
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow job named **proseware_scans_ingest** has a file arrival trigger whose storage location is the volume path `/Volumes/proseware_prod/raw/scans/`. File events aren't enabled on the external location that stores the volume.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un job Lakeflow nommé **proseware_scans_ingest** possède un déclencheur File arrival dont l'emplacement de stockage est le chemin de volume `/Volumes/proseware_prod/raw/scans/`. Les événements de fichiers (file events) ne sont pas activés sur l'emplacement externe qui héberge le volume.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A new file written to `/Volumes/proseware_prod/raw/scans/2026/11/` starts a run.
        fr: Un nouveau fichier écrit dans `/Volumes/proseware_prod/raw/scans/2026/11/` lance une exécution.
    - id: s2
      text:
        en: Overwriting an existing file that has the same name in the monitored path starts a run.
        fr: Le remplacement d'un fichier existant portant le même nom dans le chemin surveillé lance une exécution.
    - id: s3
      text:
        en: You can set the storage location to `/Volumes/proseware_prod/raw/scans/*.pdf` so that only PDF files start a run.
        fr: Vous pouvez définir l'emplacement de stockage sur `/Volumes/proseware_prod/raw/scans/*.pdf` pour que seuls les fichiers PDF lancent une exécution.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The trigger checks the configured path recursively, so files in subdirectories count. Only new files start a run: overwriting a file with the same name doesn't. The storage location is the root or a subpath of a volume or an external location, and wildcards such as `*` or `?` aren't allowed; filter the file types in the task code instead.
    fr: |
      Le déclencheur parcourt le chemin configuré de façon récursive : les fichiers des sous-répertoires comptent. Seuls les nouveaux fichiers lancent une exécution : remplacer un fichier portant le même nom ne le fait pas. L'emplacement de stockage est la racine ou un sous-chemin d'un volume ou d'un emplacement externe, et les caractères génériques comme `*` ou `?` ne sont pas autorisés ; filtrez plutôt les types de fichiers dans le code de la tâche.
references:
  - title: Trigger jobs when new files arrive
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/file-arrival-triggers
