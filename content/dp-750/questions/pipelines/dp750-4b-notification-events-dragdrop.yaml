id: dp750-4b-notification-events-dragdrop
objective: "4.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are configuring notifications for three Lakeflow jobs at Tailspin Toys. Each job must notify its team according to the following requirements.

    Which notification event should you select for each requirement? To answer, drag the appropriate events to the correct requirements. Each event may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez les notifications de trois jobs Lakeflow chez Tailspin Toys. Chaque job doit prévenir son équipe selon les exigences suivantes.

    Quel événement de notification devez-vous sélectionner pour chaque exigence ? Pour répondre, faites glisser les événements appropriés vers les exigences correspondantes. Chaque événement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: start, text: Start }
    - { id: success, text: Success }
    - { id: failure, text: Failure }
    - { id: duration, text: Duration warning }
    - { id: backlog, text: Streaming backlog }
  targets:
    - { id: done, text: { en: "Tell analysts that the nightly load has finished, including when it ends in the Succeeded with failures state.", fr: "Informer les analystes que le chargement nocturne est terminé, y compris lorsqu'il se termine à l'état Succeeded with failures." } }
    - { id: slow, text: { en: "Warn the on-call engineer when a run takes longer than its expected duration.", fr: "Avertir l'ingénieur d'astreinte quand une exécution dure plus longtemps que prévu." } }
    - { id: lag, text: { en: "Warn the streaming team when a Structured Streaming task falls behind its source.", fr: "Avertir l'équipe streaming quand une tâche Structured Streaming prend du retard sur sa source." } }
answer:
  mapping: { done: success, slow: duration, lag: backlog }
explanation:
  correct:
    en: |
      Success fires when a run completes, including in the Succeeded with failures state. Duration warning fires when a run exceeds the Warning threshold of its run duration. Streaming backlog fires when the average backlog over 10 minutes exceeds the configured threshold.
    fr: |
      Success se déclenche quand une exécution se termine, y compris à l'état Succeeded with failures. Duration warning se déclenche quand une exécution dépasse le seuil Warning de sa durée. Streaming backlog se déclenche quand le backlog moyen sur 10 minutes dépasse le seuil configuré.
  options:
    failure: { en: "Failure fires only when a run fails, so it doesn't report a load that finished.", fr: "Failure ne se déclenche que lorsqu'une exécution échoue : il ne signale pas un chargement terminé." }
    start: { en: "Start fires when a run begins.", fr: "Start se déclenche au démarrage d'une exécution." }
references:
  - title: Add notifications on a job
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications
