id: dp750-4b-advanced-schedule-tz
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Lakeflow job named **contoso_branch_report** must run at 06:30 Paris local time from Monday to Friday, all year round, including after the changes to and from daylight saving time. It must not run on weekends.

    What should you configure?
  fr: |
    Un job Lakeflow nommé **contoso_branch_report** doit s'exécuter à 06:30, heure locale de Paris, du lundi au vendredi, toute l'année, y compris après les passages à l'heure d'été et à l'heure d'hiver. Il ne doit pas s'exécuter le week-end.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A Simple schedule that runs every 1 day", fr: "Une planification Simple qui s'exécute tous les 1 jour" } }
    - { id: b, text: { en: "An Advanced schedule with the cron expression 0 30 6 ? * MON-FRI and the time zone UTC", fr: "Une planification Advanced avec l'expression cron 0 30 6 ? * MON-FRI et le fuseau horaire UTC" } }
    - { id: c, text: { en: "An Advanced schedule with the cron expression 0 30 6 ? * MON-FRI and the time zone Europe/Paris", fr: "Une planification Advanced avec l'expression cron 0 30 6 ? * MON-FRI et le fuseau horaire Europe/Paris" } }
    - { id: d, text: { en: "An Advanced schedule with the cron expression 0 30 6 * * ? and the time zone Europe/Paris", fr: "Une planification Advanced avec l'expression cron 0 30 6 * * ? et le fuseau horaire Europe/Paris" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An Advanced schedule lets you set the start time and the time zone, and Show Cron Syntax edits it as a Quartz cron expression. `0 30 6 ? * MON-FRI` fires at 06:30 on weekdays, and the Europe/Paris time zone keeps 06:30 local time on both sides of the daylight saving changes.
    fr: |
      Une planification Advanced permet de définir l'heure de début et le fuseau horaire, et Show Cron Syntax permet de la modifier sous forme d'expression cron Quartz. `0 30 6 ? * MON-FRI` se déclenche à 06:30 les jours ouvrés, et le fuseau horaire Europe/Paris conserve 06:30 heure locale de part et d'autre des changements d'heure.
  options:
    a: { en: "A Simple schedule doesn't let you choose the time of the first run, and it also runs on weekends.", fr: "Une planification Simple ne permet pas de choisir l'heure de la première exécution, et elle s'exécute aussi le week-end." }
    b: { en: "In UTC, the job would run at 07:30 or 08:30 Paris time depending on the season.", fr: "En UTC, le job s'exécuterait à 07:30 ou 08:30 heure de Paris selon la saison." }
    d: { en: "This expression fires every day, including Saturday and Sunday.", fr: "Cette expression se déclenche tous les jours, y compris le samedi et le dimanche." }
references:
  - title: Run jobs on a schedule
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/scheduled
