id: dp750-4d-stateful-alert
objective: "4.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A log search alert rule on a Log Analytics workspace evaluates a query on the **DatabricksClusters** table every 5 minutes. The query returns the cluster events whose response contains an error status code, and the rule fires when more than 10 rows are returned. The rule uses an action group that sends email.

    During a two-hour incident, the on-call engineer received 24 emails. You need to modify the rule to meet the following requirements:

    - Send one notification when the condition starts to be met and another when it is no longer met.
    - Send a new notification if the condition is met again after it was resolved, however long the incident lasts.

    What should you do?
  fr: |
    Une règle d'alerte de recherche dans les journaux sur un espace de travail Log Analytics évalue une requête sur la table **DatabricksClusters** toutes les 5 minutes. La requête renvoie les événements de cluster dont la réponse contient un code d'état d'erreur, et la règle se déclenche quand plus de 10 lignes sont renvoyées. La règle utilise un groupe d'actions qui envoie des e-mails.

    Pendant un incident de deux heures, l'ingénieur d'astreinte a reçu 24 e-mails. Vous devez modifier la règle pour répondre aux exigences suivantes :

    - Envoyer une notification quand la condition commence à être remplie et une autre quand elle ne l'est plus.
    - Envoyer une nouvelle notification si la condition est de nouveau remplie après sa résolution, quelle que soit la durée de l'incident.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Mute actions and set Mute actions for to 2 hours.", fr: "Activer Mute actions et définir Mute actions for sur 2 heures." } }
    - { id: b, text: { en: "Set Number of violations to 3 in the advanced options of the condition.", fr: "Définir Number of violations sur 3 dans les options avancées de la condition." } }
    - { id: c, text: { en: "Change Frequency of evaluation to 1 hour.", fr: "Définir Frequency of evaluation sur 1 heure." } }
    - { id: d, text: { en: "Enable Automatically resolve alerts in the advanced options of the details.", fr: "Activer Automatically resolve alerts dans les options avancées des détails." } }
answer: { optionId: d }
explanation:
  correct:
    en: Automatically resolve alerts makes the rule stateful. A stateful alert fires once when the condition is met, does not fire again or run more actions until the condition resolves, and then sends a resolved notification. If the condition is met again later, a new alert fires.
    fr: "Automatically resolve alerts rend la règle avec état (stateful). Une alerte avec état se déclenche une fois quand la condition est remplie, ne se déclenche plus et n'exécute plus d'actions tant que la condition n'est pas résolue, puis envoie une notification de résolution. Si la condition est de nouveau remplie ensuite, une nouvelle alerte se déclenche."
  options:
    a:
      en: Muting waits a fixed period before actions run again, so a longer incident still sends repeated emails, a recurrence within the period is silent, and no resolved notification is sent.
      fr: "La mise en sourdine attend une période fixe avant que les actions s'exécutent de nouveau : un incident plus long envoie encore des e-mails répétés, une récidive pendant la période reste silencieuse et aucune notification de résolution n'est envoyée."
    b:
      en: The number of violations only delays the first firing; the stateless rule still fires at each evaluation afterward.
      fr: Le nombre de violations retarde seulement le premier déclenchement ; la règle sans état se déclenche ensuite toujours à chaque évaluation.
    c:
      en: A lower frequency sends fewer emails but still one per evaluation during the incident, and it delays detection.
      fr: Une fréquence plus faible envoie moins d'e-mails, mais toujours un par évaluation pendant l'incident, et elle retarde la détection.
references:
