id: dp750-cs1c-repair-run
objective: "4.4.2"
type: single
caseStudy: dp750-cs1c-best-for-you-organics
difficulty: 2
status: draft
stem:
  en: |
    You need to complete the last run of nightly-replenishment with the fixed notebook of clean_inventory. The solution must meet the operations requirements.

    What should you do?
  fr: |
    Vous devez terminer la dernière exécution de nightly-replenishment avec le notebook corrigé de clean_inventory. La solution doit respecter les exigences d'exploitation.

    Que devez-vous faire ?
body:
  options:
    - { id: repair, text: { en: "Select Repair run on the failed run so that clean_inventory, forecast and publish run again.", fr: "Sélectionner Repair run sur l'exécution en échec pour que clean_inventory, forecast et publish s'exécutent de nouveau." } }
    - { id: runnow, text: { en: "Select Run now on nightly-replenishment so that ingest_pos and all the following tasks run again.", fr: "Sélectionner Run now sur nightly-replenishment pour qu'ingest_pos et toutes les tâches suivantes s'exécutent de nouveau." } }
    - { id: restart, text: { en: "Select Restart run on the failed run so that the run starts again from ingest_pos.", fr: "Sélectionner Restart run sur l'exécution en échec pour que l'exécution reprenne depuis ingest_pos." } }
    - { id: retries, text: { en: "Add a retry policy to clean_inventory so that clean_inventory is retried in the failed run.", fr: "Ajouter une stratégie de nouvelles tentatives à clean_inventory pour que clean_inventory soit retentée dans l'exécution en échec." } }
answer: { optionId: repair }
explanation:
  correct:
    en: |
      Repair run reruns only the unsuccessful tasks of a multi-task job run and the tasks that depend on them, here clean_inventory, forecast and publish. ingest_pos and clean_sales are not rerun, and the unsuccessful tasks run with the current task settings, so the fixed notebook is used.
    fr: |
      Repair run réexécute uniquement les tâches non réussies d'une exécution de job multitâche et les tâches qui en dépendent, ici clean_inventory, forecast et publish. ingest_pos et clean_sales ne sont pas réexécutées, et les tâches non réussies s'exécutent avec les paramètres de tâche actuels : le notebook corrigé est donc utilisé.
  options:
    runnow: { en: "A new run starts every task again, including the 90-minute ingest_pos task that already succeeded.", fr: "Une nouvelle exécution relance toutes les tâches, y compris la tâche ingest_pos de 90 minutes qui a déjà réussi." }
    restart: { en: "Restart run applies to continuous jobs in exponential backoff and starts a new run; it doesn't reuse the successful tasks.", fr: "Restart run s'applique aux jobs continus en interruption exponentielle et démarre une nouvelle exécution ; il ne réutilise pas les tâches réussies." }
    retries: { en: "A retry policy changes future runs only; it doesn't complete the run that already failed.", fr: "Une stratégie de nouvelles tentatives ne change que les exécutions futures ; elle ne termine pas l'exécution déjà en échec." }
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
