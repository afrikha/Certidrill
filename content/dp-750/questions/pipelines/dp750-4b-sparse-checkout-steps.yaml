id: dp750-4b-sparse-checkout-steps
objective: "4.3.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Proseware hosts a 6 GB repository on GitHub. You only work on the notebooks in its `pipelines/orders` directory. Cloning the whole repository into a Git folder fails because of its size.

    You need to create a Git folder in your user folder that contains only the content you need from the repository.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware héberge sur GitHub un dépôt de 6 Go. Vous ne travaillez que sur les notebooks de son répertoire `pipelines/orders`. Le clonage du dépôt entier dans un dossier Git échoue en raison de sa taille.

    Vous devez créer dans votre dossier utilisateur un dossier Git qui ne contient que le contenu du dépôt dont vous avez besoin.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "In **Workspace**, browse to your user folder, and then click **Create** > **Git folder**.", fr: "Dans **Workspace**, accéder à votre dossier utilisateur, puis cliquer sur **Create** > **Git folder**." } }
    - { id: url, text: { en: "Enter the Git repository URL, and select **GitHub** as the Git provider.", fr: "Saisir l'URL du dépôt Git, puis sélectionner **GitHub** comme fournisseur Git." } }
    - { id: sparse, text: { en: "Select **Sparse checkout mode**, and enter `pipelines/orders` in **Cone patterns**.", fr: "Sélectionner **Sparse checkout mode**, puis saisir `pipelines/orders` dans **Cone patterns**." } }
    - { id: confirm, text: { en: "Click **Create Git folder**.", fr: "Cliquer sur **Create Git folder**." } }
    - { id: ignore, text: { en: "Add the other top-level directories of the repository to `.gitignore`.", fr: "Ajouter les autres répertoires de premier niveau du dépôt à `.gitignore`." } }
    - { id: reset, text: { en: "Select **Reset** from the kebab menu, and then run a Git reset on main.", fr: "Sélectionner **Reset** dans le menu kebab, puis lancer une réinitialisation Git sur main." } }
answer:
  sequence: [ create, url, sparse, confirm ]
explanation:
  correct:
    en: |
      Sparse checkout clones only the directories that match the cone patterns, which keeps the Git folder within the per-operation limits. You enable it in the Create Git folder dialog, after the repository URL and provider, and it can't be disabled later.
    fr: |
      Le sparse checkout ne clone que les répertoires correspondant aux modèles de cône, ce qui maintient le dossier Git dans les limites par opération. Vous l'activez dans la boîte de dialogue Create Git folder, après l'URL du dépôt et le fournisseur, et il ne peut pas être désactivé ensuite.
  options:
    ignore: { en: "`.gitignore` only affects untracked files; it doesn't reduce what a clone downloads.", fr: "`.gitignore` ne concerne que les fichiers non suivis ; il ne réduit pas ce que télécharge un clonage." }
    reset: { en: "A reset replaces the content and history of a branch with another branch; it doesn't limit the checkout.", fr: "Une réinitialisation remplace le contenu et l'historique d'une branche par ceux d'une autre ; elle ne limite pas l'extraction." }
references:
  - title: Create and manage Git folders
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/git-operations-with-repos
  - title: Azure Databricks Git folder limits and reference
    url: https://learn.microsoft.com/en-us/azure/databricks/repos/limits
