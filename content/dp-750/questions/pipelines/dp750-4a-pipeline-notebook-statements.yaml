id: dp750-4a-pipeline-notebook-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Databricks workspace and is comparing notebooks and Lakeflow Spark Declarative Pipelines for a new ingestion process into the catalog **tailspin_ops**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un espace de travail Azure Databricks et compare les notebooks et les pipelines déclaratifs Lakeflow Spark pour un nouveau processus d'ingestion dans le catalogue **tailspin_ops**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Lakeflow Spark Declarative Pipelines require the Premium plan.
        fr: |
          Les pipelines déclaratifs Lakeflow Spark exigent le plan Premium.
    - id: s2
      text:
        en: |
          A function decorated with @dp.table can call count() on its DataFrame to print the number of rows of each update.
        fr: |
          Une fonction décorée avec @dp.table peut appeler count() sur son DataFrame pour afficher le nombre de lignes de chaque mise à jour.
    - id: s3
      text:
        en: |
          One Lakeflow job can run a Notebook task that calls an API and then a Pipeline task that refreshes the tables of a pipeline.
        fr: |
          Un même job Lakeflow peut exécuter une tâche Notebook qui appelle une API, puis une tâche Pipeline qui actualise les tables d'un pipeline.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Lakeflow pipelines require the Premium plan. Dataset code is evaluated several times during planning and runs, so operations such as collect(), count() or toPandas() must not appear in it. A job can mix task types, so a notebook task can prepare the data before a pipeline task refreshes the tables.
    fr: |
      Les pipelines Lakeflow exigent le plan Premium. Le code des jeux de données est évalué plusieurs fois pendant la planification et les exécutions : des opérations comme collect(), count() ou toPandas() ne doivent pas y figurer. Un job peut combiner des types de tâches : une tâche notebook peut préparer les données avant qu'une tâche de pipeline n'actualise les tables.
references:
  - title: Pipeline concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/concepts
  - title: Lakeflow pipelines Python language reference
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/developer/python-ref
