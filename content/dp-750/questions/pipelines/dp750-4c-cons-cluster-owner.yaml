id: dp750-4c-cons-cluster-owner
objective: "4.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum's platform team creates all-purpose compute resources for the analytics teams and then transfers the ownership of each compute resource to a team lead.

    You need to write a query on `system.billing.usage` that reports the DBUs of all-purpose compute for each owner of the compute resources, not for the platform engineer who created them.

    How should the query identify the owner of the compute resource behind each usage record?
  fr: |
    L'équipe plateforme d'Adatum crée des ressources de calcul polyvalent pour les équipes d'analyse, puis transfère la propriété de chaque ressource de calcul à un responsable d'équipe.

    Vous devez écrire une requête sur `system.billing.usage` qui indique les DBU du calcul polyvalent pour chaque propriétaire des ressources de calcul, et non pour l'ingénieur plateforme qui les a créées.

    Comment la requête doit-elle identifier le propriétaire de la ressource de calcul associée à chaque enregistrement d'utilisation ?
body:
  options:
    - { id: a, text: { en: "Use the identity_metadata.run_as column of the usage record", fr: "Utiliser la colonne identity_metadata.run_as de l'enregistrement d'utilisation" } }
    - { id: b, text: { en: "Use the identity_metadata.owned_by column of the usage record", fr: "Utiliser la colonne identity_metadata.owned_by de l'enregistrement d'utilisation" } }
    - { id: c, text: { en: "Join usage_metadata.cluster_id to system.compute.clusters and use its owned_by column", fr: "Joindre usage_metadata.cluster_id à system.compute.clusters et utiliser sa colonne owned_by" } }
    - { id: d, text: { en: "Use the identity_metadata.created_by column of the usage record", fr: "Utiliser la colonne identity_metadata.created_by de l'enregistrement d'utilisation" } }
answer: { optionId: c }
explanation:
  correct:
    en: "For all-purpose compute, `identity_metadata.run_as` contains the user who created the compute, not necessarily its owner. To attribute usage to the owner, join `usage_metadata.cluster_id` to the `system.compute.clusters` table and use its `owned_by` column."
    fr: "Pour le calcul polyvalent, `identity_metadata.run_as` contient l'utilisateur qui a créé le calcul, pas nécessairement son propriétaire. Pour attribuer l'utilisation au propriétaire, joignez `usage_metadata.cluster_id` à la table `system.compute.clusters` et utilisez sa colonne `owned_by`."
  options:
    a: { en: "For all-purpose compute, run_as is the creator, here the platform engineer.", fr: "Pour le calcul polyvalent, run_as est le créateur, ici l'ingénieur plateforme." }
    b: { en: "identity_metadata.owned_by is populated only for SQL warehouse usage.", fr: "identity_metadata.owned_by n'est renseignée que pour l'utilisation des entrepôts SQL." }
    d: { en: "identity_metadata.created_by applies to Databricks Apps and some agent products, not to all-purpose compute.", fr: "identity_metadata.created_by s'applique à Databricks Apps et à certains produits d'agents, pas au calcul polyvalent." }
references:
  - title: Billable usage system table reference
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/billing
