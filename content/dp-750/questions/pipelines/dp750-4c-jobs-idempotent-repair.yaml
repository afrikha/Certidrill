id: dp750-4c-jobs-idempotent-repair
objective: "4.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind has a Lakeflow Jobs job named **orders_etl** with the tasks `extract` → `load_silver` → `build_gold`. The `load_silver` task appends each daily batch to `northwind.sales.silver_orders`.

    Last week, `load_silver` failed after it had appended part of the batch. After the cause was fixed, a repair of the run completed successfully, but `silver_orders` now contains duplicate rows for that day.

    You need to ensure that future repairs of the run never create duplicate rows, while still rerunning only the unsuccessful tasks and their dependents.

    What should you do?
  fr: |
    Northwind dispose d'un job Lakeflow Jobs nommé **orders_etl** avec les tâches `extract` → `load_silver` → `build_gold`. La tâche `load_silver` ajoute (append) chaque lot quotidien à `northwind.sales.silver_orders`.

    La semaine dernière, `load_silver` a échoué après avoir ajouté une partie du lot. Une fois la cause corrigée, une réparation de l'exécution a réussi, mais `silver_orders` contient désormais des lignes en double pour ce jour.

    Vous devez vous assurer que les futures réparations de l'exécution ne créent jamais de lignes en double, tout en ne réexécutant que les tâches non réussies et leurs dépendantes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable load_silver in the job settings before each repair of the run", fr: "Désactiver load_silver dans les paramètres du job avant chaque réparation de l'exécution" } }
    - { id: b, text: { en: "Use Run now instead of Repair run after each failure of the job", fr: "Utiliser Run now au lieu de Repair run après chaque échec du job" } }
    - { id: c, text: { en: "Add a retry policy to load_silver so that it is retried automatically in the same run", fr: "Ajouter une stratégie de nouvelle tentative à load_silver pour qu'elle soit relancée automatiquement dans la même exécution" } }
    - { id: d, text: { en: "Rewrite load_silver to write the batch with MERGE INTO on the order key instead of an append", fr: "Réécrire load_silver pour écrire le lot avec MERGE INTO sur la clé de commande au lieu d'un ajout" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Lakeflow Jobs doesn't make tasks idempotent, and a repaired task restarts from the beginning, so a task that appended part of its output before failing writes those rows again. Microsoft recommends idempotent operations such as merge or overwrite instead of append, so that rerunning the task produces the same result."
    fr: "Lakeflow Jobs ne rend pas les tâches idempotentes, et une tâche réparée repart du début : une tâche qui avait ajouté une partie de sa sortie avant d'échouer réécrit ces lignes. Microsoft recommande des opérations idempotentes comme la fusion (merge) ou l'écrasement plutôt que l'ajout, pour que la réexécution de la tâche produise le même résultat."
  options:
    b: { en: "Run now reruns every task, including extract, and load_silver still appends the rows a second time.", fr: "Run now réexécute toutes les tâches, y compris extract, et load_silver ajoute toujours les lignes une seconde fois." }
    c: { en: "A retry also restarts the task from the beginning, so the partial append is duplicated in the same way.", fr: "Une nouvelle tentative relance elle aussi la tâche depuis le début : l'ajout partiel est dupliqué de la même façon." }
    a: { en: "A disabled task doesn't run, so the batch would never be fully loaded.", fr: "Une tâche désactivée ne s'exécute pas : le lot ne serait jamais entièrement chargé." }
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
