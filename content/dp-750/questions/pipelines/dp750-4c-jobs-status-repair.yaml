id: dp750-4c-jobs-status-repair
objective: "4.4.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware has a Lakeflow Jobs job named **nightly_billing** with the following tasks.

    | Task | Depends on | Run if dependencies |
    | --- | --- | --- |
    | ingest | None | All succeeded |
    | clean | ingest | All succeeded |
    | publish | clean | All succeeded |
    | cleanup | clean | All done |

    In last night's run, ingest succeeded, clean failed because of a wrong notebook path, publish didn't run because its upstream task failed, and cleanup ran and succeeded.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un job Lakeflow Jobs nommé **nightly_billing** avec les tâches suivantes.

    | Tâche | Dépend de | Run if dependencies |
    | --- | --- | --- |
    | ingest | Aucune | All succeeded |
    | clean | ingest | All succeeded |
    | publish | clean | All succeeded |
    | cleanup | clean | All done |

    Lors de l'exécution de la nuit dernière, ingest a réussi, clean a échoué à cause d'un chemin de notebook erroné, publish ne s'est pas exécutée parce que sa tâche en amont a échoué, et cleanup s'est exécutée et a réussi.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The status of last night's run is Succeeded with failures."
        fr: "L'état de l'exécution de la nuit dernière est Succeeded with failures."
    - id: s2
      text:
        en: "A repair of last night's run reruns clean, publish and cleanup, but not ingest."
        fr: "Une réparation de l'exécution de la nuit dernière réexécute clean, publish et cleanup, mais pas ingest."
    - id: s3
      text:
        en: "If you correct the notebook path of clean with Edit task before the repair, the repair still runs clean with the path recorded in last night's run."
        fr: "Si vous corrigez le chemin du notebook de clean avec Edit task avant la réparation, la réparation exécute quand même clean avec le chemin enregistré lors de l'exécution de la nuit dernière."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "A run's status depends on its leaf tasks, publish and cleanup here. Succeeded with failures requires all leaf tasks to succeed; publish didn't, so the run is Failed. A repair reruns the unsuccessful tasks, clean and publish, and the tasks that depend on them, which includes cleanup; ingest succeeded and isn't rerun. Repaired tasks use the current job and task settings, so the corrected path applies."
    fr: "L'état d'une exécution dépend de ses tâches feuilles, ici publish et cleanup. Succeeded with failures exige que toutes les tâches feuilles réussissent ; publish n'a pas réussi, l'exécution est donc Failed. Une réparation réexécute les tâches non réussies, clean et publish, ainsi que les tâches qui en dépendent, dont cleanup ; ingest a réussi et n'est pas réexécutée. Les tâches réparées utilisent les paramètres actuels du job et des tâches : le chemin corrigé s'applique."
references:
  - title: Monitor Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/monitor
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
