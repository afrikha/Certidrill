id: dp750-4c-cons-cost-levers
objective: "4.4.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware is reviewing the classic compute configuration of its Azure Databricks workspace to reduce costs and attribute them to cost centers.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware examine la configuration du calcul classique de son espace de travail Azure Databricks pour réduire les coûts et les attribuer à des centres de coûts.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: autoterm, text: { en: "Automatic termination", fr: "Arrêt automatique" } }
    - { id: autoscale, text: { en: "Autoscaling", fr: "Mise à l'échelle automatique" } }
    - { id: jobcompute, text: { en: "Jobs compute", fr: "Calcul de jobs" } }
    - { id: tags, text: { en: "Custom tags", fr: "Étiquettes personnalisées" } }
    - { id: photon, text: Photon }
    - { id: pin, text: { en: "Pinning", fr: "Épinglage" } }
  targets:
    - { id: t1, text: { en: "Stop an all-purpose compute resource that nobody has used for an hour", fr: "Arrêter une ressource de calcul polyvalent que personne n'a utilisée depuis une heure" } }
    - { id: t2, text: { en: "Remove workers when the load of a long ETL notebook drops, and add them back at peaks", fr: "Retirer des workers quand la charge d'un long notebook ETL baisse, et les rajouter aux pics" } }
    - { id: t3, text: { en: "Run a scheduled job on compute that exists only for the duration of the run", fr: "Exécuter un job planifié sur un calcul qui n'existe que pendant la durée de l'exécution" } }
    - { id: t4, text: { en: "Group the DBUs of the billing records by cost center", fr: "Regrouper par centre de coûts les DBU des enregistrements de facturation" } }
answer:
  mapping: { t1: autoterm, t2: autoscale, t3: jobcompute, t4: tags }
explanation:
  correct:
    en: "Automatic termination stops compute after a period of inactivity. Autoscaling adds and removes workers between a minimum and a maximum based on the load. Jobs compute is created for a run and ends with it, unlike all-purpose compute. Custom tags appear in the `custom_tags` column of `system.billing.usage`, so you can group DBUs by a cost center tag."
    fr: "L'arrêt automatique arrête le calcul après une période d'inactivité. La mise à l'échelle automatique ajoute et retire des workers entre un minimum et un maximum selon la charge. Le calcul de jobs est créé pour une exécution et se termine avec elle, contrairement au calcul polyvalent. Les étiquettes personnalisées figurent dans la colonne `custom_tags` de `system.billing.usage` : vous pouvez regrouper les DBU par étiquette de centre de coûts."
  options:
    photon: { en: "Photon speeds up queries; it doesn't stop compute or attribute costs.", fr: "Photon accélère les requêtes ; il n'arrête pas le calcul et n'attribue pas les coûts." }
    pin: { en: "Pinning keeps the configuration of a terminated compute from being deleted.", fr: "L'épinglage empêche la suppression de la configuration d'un calcul arrêté." }
references:
  - title: Manage classic compute
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage
  - title: Billable usage system table reference
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/billing
