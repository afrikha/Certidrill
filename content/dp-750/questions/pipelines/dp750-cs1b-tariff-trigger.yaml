id: dp750-cs1b-tariff-trigger
objective: "4.2.2"
type: dropdown
caseStudy: dp750-cs1b-city-power-light
difficulty: 3
status: draft
stem:
  en: |
    You create a Lakeflow job named **load-tariffs** that processes the tariff files.

    How should you configure the trigger of load-tariffs to meet the tariffs requirements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un job Lakeflow nommé **load-tariffs** qui traite les fichiers de tarifs.

    Comment devez-vous configurer le déclencheur de load-tariffs pour respecter les exigences relatives aux tarifs ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Trigger type: [[type]]

      Setting to configure: [[setting]]
    fr: |
      Type de déclencheur : [[type]]

      Paramètre à configurer : [[setting]]
  slots:
    - id: type
      options:
        - { id: file, text: "File arrival" }
        - { id: scheduled, text: "Scheduled" }
        - { id: table, text: "Table update" }
        - { id: continuous, text: "Continuous" }
    - id: setting
      options:
        - { id: wait, text: "Wait after last change" }
        - { id: mintime, text: "Minimum time between triggers" }
        - { id: concurrent, text: "Maximum concurrent runs" }
        - { id: timeout, text: "Timeout" }
answer:
  values: { type: file, setting: wait }
explanation:
  correct:
    en: |
      A file arrival trigger starts a run when new files arrive in a monitored Unity Catalog volume or external location, and it starts nothing when no file arrives. Wait after last change delays the run until no new file has arrived for the configured time, so a batch of files copied within 30 seconds produces a single run.
    fr: |
      Un déclencheur d'arrivée de fichiers démarre une exécution quand de nouveaux fichiers arrivent dans un volume ou un emplacement externe Unity Catalog surveillé, et ne démarre rien quand aucun fichier n'arrive. Wait after last change retarde l'exécution jusqu'à ce qu'aucun nouveau fichier ne soit arrivé pendant la durée configurée : un lot de fichiers copiés en 30 secondes produit une seule exécution.
  options:
    scheduled: { en: "A schedule starts runs at fixed times, even when no tariff file was uploaded.", fr: "Une planification démarre des exécutions à heures fixes, même quand aucun fichier de tarifs n'a été déposé." }
    table: { en: "A table update trigger reacts to updates of source tables, not to files uploaded to a volume.", fr: "Un déclencheur de mise à jour de table réagit aux mises à jour de tables sources, pas aux fichiers déposés dans un volume." }
    continuous: { en: "A continuous trigger starts a new run whenever the previous one ends, even when no file was uploaded.", fr: "Un déclencheur continu démarre une nouvelle exécution dès que la précédente se termine, même quand aucun fichier n'a été déposé." }
    mintime: { en: "Minimum time between triggers sets a cooldown between runs; the first files of a batch would still start a run before the rest of the batch is copied.", fr: "Minimum time between triggers impose un délai minimal entre deux exécutions ; les premiers fichiers d'un lot démarreraient quand même une exécution avant la copie du reste du lot." }
    concurrent: { en: "Maximum concurrent runs limits parallel runs; it doesn't group the files of a batch into one run.", fr: "Maximum concurrent runs limite les exécutions parallèles ; il ne regroupe pas les fichiers d'un lot en une seule exécution." }
    timeout: { en: "A timeout stops a run that lasts too long; it doesn't control when runs start.", fr: "Un délai d'expiration arrête une exécution trop longue ; il ne contrôle pas le démarrage des exécutions." }
references:
  - title: Trigger jobs when new files arrive
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/file-arrival-triggers
  - title: Automate jobs with schedules and triggers
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/triggers
