id: dp750-4d-spill-remedies
objective: "4.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow Jobs task runs on classic job compute and aggregates **litware.iot.silver.readings** by `device_id` and `reading_hour`.

    In the Spark UI, the longest stage is the shuffle stage of the aggregation. The stage page shows spill statistics. In the Summary Metrics, the **Max** task duration is close to the **75th percentile**.

    You need to reduce the spill of the stage.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une tâche Lakeflow Jobs s'exécute sur un calcul de jobs classique et agrège **litware.iot.silver.readings** par `device_id` et `reading_hour`.

    Dans l'interface utilisateur Spark, l'étape la plus longue est l'étape de shuffle de l'agrégation. La page de l'étape affiche des statistiques de déversement (spill). Dans les Summary Metrics, la durée de tâche **Max** est proche du **75th percentile**.

    Vous devez réduire le déversement de l'étape.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set spark.sql.shuffle.partitions to auto.", fr: "Définir spark.sql.shuffle.partitions sur auto." } }
    - { id: b, text: { en: "Set spark.databricks.io.cache.enabled to true.", fr: "Définir spark.databricks.io.cache.enabled sur true." } }
    - { id: c, text: { en: "Call coalesce(8) on the DataFrame before the aggregation.", fr: "Appeler coalesce(8) sur le DataFrame avant l'agrégation." } }
    - { id: d, text: { en: "Use a worker instance type that has more memory.", fr: "Utiliser un type d'instance de worker doté de plus de mémoire." } }
    - { id: e, text: { en: "Run VACUUM on litware.iot.silver.readings.", fr: "Exécuter VACUUM sur litware.iot.silver.readings." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Spill happens when the data of a task does not fit in memory. With auto-optimized shuffle (`spark.sql.shuffle.partitions` = `auto`), Spark sizes the shuffle partitions from the data, so each task handles less data. Instances with more memory give each executor more room. Max close to the 75th percentile means there is no skew to fix first.
    fr: "Le déversement se produit quand les données d'une tâche ne tiennent pas en mémoire. Avec le shuffle optimisé automatiquement (`spark.sql.shuffle.partitions` = `auto`), Spark dimensionne les partitions de shuffle d'après les données : chaque tâche traite moins de données. Des instances dotées de plus de mémoire donnent plus de place à chaque exécuteur. Un Max proche du 75th percentile indique qu'il n'y a pas de déséquilibrage à corriger d'abord."
  options:
    b:
      en: The disk cache keeps copies of remote Parquet files on local disks to speed up repeated reads; it does not add execution memory.
      fr: Le cache disque conserve des copies de fichiers Parquet distants sur les disques locaux pour accélérer les lectures répétées ; il n'ajoute pas de mémoire d'exécution.
    c:
      en: Fewer partitions put more data in each task, which increases spill.
      fr: Moins de partitions placent plus de données dans chaque tâche, ce qui augmente le déversement.
    e:
      en: VACUUM deletes unreferenced data files to reduce storage costs; it does not change the memory a shuffle needs.
      fr: VACUUM supprime les fichiers de données non référencés pour réduire le coût de stockage ; il ne change pas la mémoire nécessaire au shuffle.
references:
  - title: Skew and spill
    url: https://learn.microsoft.com/en-us/azure/databricks/optimizations/spark-ui-guide/long-spark-stage-page
