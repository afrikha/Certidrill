id: dp750-4c-jobs-single-task
objective: "4.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a scheduled Lakeflow Jobs job named **load_returns** that contains a single notebook task. Last night's run failed because the notebook referenced a table that was renamed to `contoso.sales.returns_v2`.

    You updated the notebook. You now need to run the job again with the corrected notebook, without waiting for the next scheduled run.

    What should you do?
  fr: |
    Contoso dispose d'un job Lakeflow Jobs planifié nommé **load_returns** qui contient une seule tâche de notebook. L'exécution de la nuit dernière a échoué, car le notebook référençait une table renommée en `contoso.sales.returns_v2`.

    Vous avez mis à jour le notebook. Vous devez maintenant exécuter de nouveau le job avec le notebook corrigé, sans attendre la prochaine exécution planifiée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Open the failed run and select Repair run", fr: "Ouvrir l'exécution en échec et sélectionner Repair run" } }
    - { id: b, text: { en: "Select Run now on the job", fr: "Sélectionner Run now sur le job" } }
    - { id: c, text: { en: "Select Restart run on the job", fr: "Sélectionner Restart run sur le job" } }
    - { id: d, text: { en: "Select Cancel all queued runs on the job", fr: "Sélectionner Cancel all queued runs sur le job" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Repair works only for jobs that orchestrate two or more tasks; to rerun a single-task job, you use Run now, which starts a new run with the latest version of the notebook."
    fr: "La réparation ne fonctionne que pour les jobs qui orchestrent au moins deux tâches ; pour réexécuter un job à une seule tâche, vous utilisez Run now, qui démarre une nouvelle exécution avec la dernière version du notebook."
  options:
    a: { en: "Repair run isn't available for a job that has only one task.", fr: "Repair run n'est pas disponible pour un job qui n'a qu'une seule tâche." }
    c: { en: "Restart run replaces Run now for continuous jobs; load_returns is a scheduled job.", fr: "Restart run remplace Run now pour les jobs continus ; load_returns est un job planifié." }
    d: { en: "Canceling queued runs doesn't start a new run.", fr: "Annuler les exécutions en file d'attente ne démarre pas de nouvelle exécution." }
references:
  - title: Troubleshoot and repair job failures
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/repair-job-failures
