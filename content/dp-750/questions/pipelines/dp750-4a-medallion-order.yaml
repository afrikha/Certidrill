id: dp750-4a-medallion-order
objective: "4.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders receives JSON order files every hour in the Unity Catalog volume **/Volumes/northwind/landing/orders/**. A sales dashboard reads the table **northwind.gold.daily_sales**, which contains revenue per store and per day.

    You are designing the pipeline that feeds the dashboard by following the medallion architecture. The raw records must be kept as received for reprocessing.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders reçoit chaque heure des fichiers de commandes JSON dans le volume Unity Catalog **/Volumes/northwind/landing/orders/**. Un tableau de bord des ventes lit la table **northwind.gold.daily_sales**, qui contient le chiffre d'affaires par magasin et par jour.

    Vous concevez le pipeline qui alimente le tableau de bord en suivant l'architecture en médaillon. Les enregistrements bruts doivent être conservés tels qu'ils ont été reçus pour pouvoir être retraités.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: bronze
      text: { en: "Ingest the new files incrementally into northwind.bronze.orders as received, with the source file path and the load time.", fr: "Ingérer de façon incrémentielle les nouveaux fichiers dans northwind.bronze.orders tels qu'ils sont reçus, avec le chemin du fichier source et l'heure de chargement." }
    - id: silver
      text: { en: "Cast the columns to their data types, remove duplicate order IDs and load northwind.silver.orders.", fr: "Convertir les colonnes dans leurs types de données, supprimer les ID de commande en double et charger northwind.silver.orders." }
    - id: gold
      text: { en: "Aggregate northwind.silver.orders by store and by day into northwind.gold.daily_sales.", fr: "Agréger northwind.silver.orders par magasin et par jour dans northwind.gold.daily_sales." }
    - id: serve
      text: { en: "Refresh the sales dashboard that reads northwind.gold.daily_sales.", fr: "Actualiser le tableau de bord des ventes qui lit northwind.gold.daily_sales." }
    - id: direct
      text: { en: "Aggregate the JSON files of the volume by store and by day directly into northwind.gold.daily_sales.", fr: "Agréger directement les fichiers JSON du volume par magasin et par jour dans northwind.gold.daily_sales." }
    - id: dedupgold
      text: { en: "Remove duplicate order IDs from northwind.gold.daily_sales after the dashboard refresh.", fr: "Supprimer les ID de commande en double de northwind.gold.daily_sales après l'actualisation du tableau de bord." }
answer:
  sequence: [ bronze, silver, gold, serve ]
explanation:
  correct:
    en: |
      Each step can only run after the step that produces what it reads. Bronze keeps the raw records with provenance metadata, silver casts types and deduplicates them, gold aggregates the validated records for the business, and the dashboard is refreshed last, from the gold table.
    fr: |
      Chaque étape ne peut s'exécuter qu'après l'étape qui produit ce qu'elle lit. La couche bronze conserve les enregistrements bruts avec des métadonnées de provenance, la couche silver convertit les types et dédoublonne, la couche gold agrège les enregistrements validés pour le métier, et le tableau de bord est actualisé en dernier, à partir de la table gold.
  options:
    direct:
      en: |
        Aggregating the files directly skips the bronze copy needed for reprocessing and the silver validation and deduplication.
      fr: |
        Agréger directement les fichiers supprime la copie bronze nécessaire au retraitement ainsi que la validation et le dédoublonnage de la couche silver.
    dedupgold:
      en: |
        Deduplication belongs in silver, before aggregation; after the refresh, the dashboard has already shown inflated totals, and an aggregate no longer contains order IDs.
      fr: |
        Le dédoublonnage a sa place dans la couche silver, avant l'agrégation ; après l'actualisation, le tableau de bord a déjà affiché des totaux gonflés, et un agrégat ne contient plus d'ID de commande.
references:
  - title: What is the medallion lakehouse architecture?
    url: https://learn.microsoft.com/en-us/azure/databricks/lakehouse/medallion
