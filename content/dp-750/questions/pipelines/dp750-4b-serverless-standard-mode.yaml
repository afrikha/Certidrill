id: dp750-4b-serverless-standard-mode
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Lakeflow job named **tailspin_flights_nightly** runs its tasks on serverless compute. It starts at 01:00, usually completes in 40 minutes, and its results are needed by 07:00. The **Performance optimized** setting of the job is enabled.

    You need to reduce the cost of the job. A startup latency of several minutes is acceptable.

    What should you do?
  fr: |
    Un job Lakeflow nommé **tailspin_flights_nightly** exécute ses tâches sur du calcul serverless. Il démarre à 01:00, se termine généralement en 40 minutes, et ses résultats sont attendus pour 07:00. Le paramètre **Performance optimized** du job est activé.

    Vous devez réduire le coût du job. Une latence de démarrage de plusieurs minutes est acceptable.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the maximum concurrent runs of the job to 2.", fr: "Porter à 2 le nombre maximal d'exécutions simultanées du job." } }
    - { id: b, text: { en: "Move the tasks to an all-purpose cluster that stays running.", fr: "Déplacer les tâches vers un cluster polyvalent qui reste démarré." } }
    - { id: c, text: { en: "Enable queueing for the job.", fr: "Activer la mise en file d'attente pour le job." } }
    - { id: d, text: { en: "Disable the Performance optimized setting of the job.", fr: "Désactiver le paramètre Performance optimized du job." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With Performance optimized disabled, the serverless tasks run in standard performance mode, which consumes fewer DBUs on the same SKU. The trade-off is a startup latency of about 4 to 6 minutes, which the nightly window easily absorbs.
    fr: |
      Quand Performance optimized est désactivé, les tâches serverless s'exécutent en mode de performances standard, qui consomme moins de DBU pour le même SKU. La contrepartie est une latence de démarrage d'environ 4 à 6 minutes, que la fenêtre nocturne absorbe sans difficulté.
  options:
    a: { en: "Allowing overlapping runs doesn't lower the cost of each run.", fr: "Autoriser des exécutions simultanées ne réduit pas le coût de chaque exécution." }
    b: { en: "An all-purpose cluster that stays running costs more than job compute or serverless compute for a scheduled batch.", fr: "Un cluster polyvalent toujours démarré coûte plus cher que le calcul de jobs ou le calcul serverless pour un traitement planifié." }
    c: { en: "Queueing only makes runs wait when limits are reached; it doesn't change the compute cost.", fr: "La file d'attente fait seulement patienter les exécutions quand les limites sont atteintes ; elle ne change pas le coût du calcul." }
references:
  - title: Run your Lakeflow Jobs with serverless compute for workflows
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-serverless-jobs
