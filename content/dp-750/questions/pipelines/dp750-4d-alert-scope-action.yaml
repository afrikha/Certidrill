id: dp750-4d-alert-scope-action
objective: "4.4.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has three Azure Databricks workspaces named **adb-ts-eu**, **adb-ts-us** and **adb-ts-asia**. Diagnostic settings stream their jobs log category to a Log Analytics workspace named **law-ts-ops**.

    You need to create one log search alert rule that meets the following requirements:

    - Evaluate the runFailed events of the three Azure Databricks workspaces.
    - Raise a separate alert for each Azure Databricks workspace that has failures.
    - Post a message to the Microsoft Teams channel of the data platform team.

    How should you configure the rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose de trois espaces de travail Azure Databricks nommés **adb-ts-eu**, **adb-ts-us** et **adb-ts-asia**. Des paramètres de diagnostic diffusent en continu leur catégorie de journaux jobs vers un espace de travail Log Analytics nommé **law-ts-ops**.

    Vous devez créer une seule règle d'alerte de recherche dans les journaux qui répond aux exigences suivantes :

    - Évaluer les événements runFailed des trois espaces de travail Azure Databricks.
    - Déclencher une alerte distincte pour chaque espace de travail Azure Databricks qui présente des échecs.
    - Publier un message dans le canal Microsoft Teams de l'équipe de la plateforme de données.

    Comment devez-vous configurer la règle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Scope of the rule: [[scope]]
      Split by dimension: [[dim]]
      Action type in the action group: [[action]]
    fr: |
      Étendue de la règle : [[scope]]
      Fractionner par dimension : [[dim]]
      Type d'action dans le groupe d'actions : [[action]]
  slots:
    - id: scope
      options:
        - { id: law, text: { en: "law-ts-ops (Log Analytics workspace)", fr: "law-ts-ops (espace de travail Log Analytics)" } }
        - { id: adb, text: { en: "adb-ts-eu (Azure Databricks workspace)", fr: "adb-ts-eu (espace de travail Azure Databricks)" } }
        - { id: sub, text: { en: "The subscription activity log", fr: "Le journal d'activité de l'abonnement" } }
    - id: dim
      options:
        - { id: resid, text: _ResourceId }
        - { id: reqid, text: RequestId }
        - { id: timegen, text: TimeGenerated }
    - id: action
      options:
        - { id: logic, text: Logic apps }
        - { id: runbook, text: Automation Runbook }
        - { id: eventhubs, text: Event hubs }
        - { id: itsm, text: ITSM }
answer:
  values: { scope: law, dim: resid, action: logic }
explanation:
  correct:
    en: The events of the three workspaces are in law-ts-ops, so a rule scoped to it sees them all. Splitting by the _ResourceId dimension, which identifies the Azure Databricks workspace that produced each record, raises one alert per workspace. A Logic apps action is the action type used to customize notifications such as a post to a Microsoft Teams channel.
    fr: "Les événements des trois espaces de travail sont dans law-ts-ops : une règle limitée à cet espace les voit tous. Le fractionnement par la dimension _ResourceId, qui identifie l'espace de travail Azure Databricks à l'origine de chaque enregistrement, déclenche une alerte par espace de travail. Une action Logic apps est le type d'action utilisé pour personnaliser les notifications, comme une publication dans un canal Microsoft Teams."
  options:
    adb: { en: "A rule scoped to one Azure Databricks workspace would not cover the other two.", fr: "Une règle limitée à un espace de travail Azure Databricks ne couvrirait pas les deux autres." }
    sub: { en: "The activity log does not contain job run events.", fr: "Le journal d'activité ne contient pas les événements d'exécution de jobs." }
    reqid: { en: "RequestId is unique per event, so it would create one alert per record.", fr: "RequestId est unique par événement : il créerait une alerte par enregistrement." }
    timegen: { en: "Timestamps are high-cardinality values that must not be used as dimensions.", fr: "Les horodatages sont des valeurs à forte cardinalité à ne pas utiliser comme dimensions." }
    runbook: { en: "A runbook automates tasks such as stopping resources; it is not the action used to post to Teams.", fr: "Un runbook automatise des tâches comme l'arrêt de ressources ; ce n'est pas l'action utilisée pour publier dans Teams." }
    eventhubs: { en: "An Event hubs action sends the alert to an event hub, not to a Teams channel.", fr: "Une action Event hubs envoie l'alerte vers un hub d'événements, pas vers un canal Teams." }
    itsm: { en: "An ITSM action creates work items in an IT service management tool.", fr: "Une action ITSM crée des éléments de travail dans un outil de gestion des services informatiques." }
references:
  - title: Create and manage action groups in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
  - title: Create Azure Monitor log search alert rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule
