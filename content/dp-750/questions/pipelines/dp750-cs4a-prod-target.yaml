id: dp750-cs4a-prod-target
objective: "4.3.4"
type: dropdown
caseStudy: dp750-cs4a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are updating the databricks.yml file of the bundle project to meet the deployment requirement. The Azure DevOps pipeline will run `databricks bundle deploy -t prod`.

    How should you complete the prod target? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous mettez à jour le fichier databricks.yml du projet de bundle pour satisfaire l'exigence de déploiement. Le pipeline Azure DevOps exécutera `databricks bundle deploy -t prod`.

    Comment devez-vous compléter la cible prod ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: yaml
  template: |
    targets:
      dev:
        mode: development
        default: true
        workspace:
          host: https://adb-1111111111111111.11.azuredatabricks.net
      prod:
        mode: [[mode]]
        workspace:
          host: https://adb-2222222222222222.12.azuredatabricks.net
        git:
          branch: main
        [[identity]]:
          [[principal]]: "<application-id-of-sp-hi-deploy>"
  slots:
    - id: mode
      options:
        - { id: production, text: production }
        - { id: development, text: development }
    - id: identity
      options:
        - { id: permissions, text: permissions }
        - { id: presets, text: presets }
        - { id: run_as, text: run_as }
    - id: principal
      options:
        - { id: user_name, text: user_name }
        - { id: service_principal_name, text: service_principal_name }
        - { id: group_name, text: group_name }
answer:
  values: { mode: production, identity: run_as, principal: service_principal_name }
explanation:
  correct:
    en: |
      In production mode, `bundle deploy` checks that the current Git branch matches the target's git.branch (main), so a deployment from another branch fails unless it is forced. The run_as mapping with service_principal_name makes the deployed jobs run as sp-hi-deploy; the value is the application ID of the service principal.
    fr: |
      En mode production, `bundle deploy` vérifie que la branche Git actuelle correspond à git.branch de la cible (main) : un déploiement depuis une autre branche échoue, sauf s'il est forcé. Le mappage run_as avec service_principal_name fait s'exécuter les jobs déployés en tant que sp-hi-deploy ; la valeur est l'ID d'application du principal de service.
  options:
    mode:
      en: |
        Development mode prefixes resource names with the user name, pauses schedules and triggers, and does not validate the Git branch.
      fr: |
        Le mode development préfixe les noms des ressources avec le nom de l'utilisateur, met en pause les planifications et les déclencheurs, et ne vérifie pas la branche Git.
    identity:
      en: |
        permissions grants access to the deployed resources but does not set the identity that runs them; presets override settings such as name prefixes and pause status.
      fr: |
        permissions accorde l'accès aux ressources déployées sans définir l'identité qui les exécute ; presets remplace des paramètres comme les préfixes de nom et l'état de pause.
    principal:
      en: |
        user_name would keep a personal identity, and the top-level and target run_as mappings do not support groups.
      fr: |
        user_name conserverait une identité personnelle, et les mappages run_as de niveau supérieur et de cible ne prennent pas en charge les groupes.
references:
  - title: Declarative Automation Bundles deployment modes
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
  - title: Specify a run identity for a Declarative Automation Bundles workflow
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/run-as
