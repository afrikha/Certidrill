id: dp750-4d-disk-vs-spark-cache
objective: "4.4.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind data engineers run notebooks on classic all-purpose compute whose workers have local SSD volumes. The notebooks read Delta tables of the **northwind.sales** schema and CSV files from a Unity Catalog volume.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les ingénieurs données de Northwind exécutent des notebooks sur un calcul universel classique dont les workers disposent de volumes SSD locaux. Les notebooks lisent des tables Delta du schéma **northwind.sales** et des fichiers CSV d'un volume Unity Catalog.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a data file of a Delta table is overwritten, the disk cache detects the change and evicts the stale cached data.
        fr: Quand un fichier de données d'une table Delta est remplacé, le cache disque détecte la modification et évince les données obsolètes du cache.
    - id: s2
      text:
        en: To free the space that the disk cache uses for a table, you call unpersist() on the DataFrame that reads the table.
        fr: Pour libérer l'espace que le cache disque utilise pour une table, vous appelez unpersist() sur le DataFrame qui lit la table.
    - id: s3
      text:
        en: You can call cache() on a DataFrame that reads the CSV files to keep its data on the executors for later actions.
        fr: Vous pouvez appeler cache() sur un DataFrame qui lit les fichiers CSV pour conserver ses données sur les exécuteurs pour les actions suivantes.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The disk cache is filled automatically on the first read of Parquet data files, including Delta tables, and it detects created, modified or overwritten files and invalidates stale entries itself. It is evicted in LRU fashion, on file changes or when the cluster restarts; unpersist() only applies to the Spark cache. The Spark cache works on any DataFrame or RDD, whatever the source format.
    fr: "Le cache disque se remplit automatiquement à la première lecture des fichiers de données Parquet, y compris les tables Delta, et il détecte seul les fichiers créés, modifiés ou remplacés pour invalider les entrées obsolètes. Il est évincé en LRU, lors d'une modification de fichier ou au redémarrage du cluster ; unpersist() ne s'applique qu'au cache Spark. Le cache Spark fonctionne sur n'importe quel DataFrame ou RDD, quel que soit le format source."
references:
  - title: Optimize performance with caching on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/optimizations/disk-cache
