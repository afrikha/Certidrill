id: dp750-4d-diag-cli
objective: "4.4.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Databricks workspace on the Premium plan. The variable `DBX_ID` contains the resource ID of the Azure Databricks workspace, and `LAW_ID` contains the resource ID of a Log Analytics workspace named **law-contoso-ops**.

    You need to use the Azure CLI to stream the audit events of Lakeflow Jobs to law-contoso-ops.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail Azure Databricks sur le plan Premium. La variable `DBX_ID` contient l'ID de ressource de l'espace de travail Azure Databricks, et `LAW_ID` contient l'ID de ressource d'un espace de travail Log Analytics nommé **law-contoso-ops**.

    Vous devez utiliser Azure CLI pour diffuser en continu les événements d'audit de Lakeflow Jobs vers law-contoso-ops.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az monitor [[group]] create \
      --name dbx-jobs-to-law \
      --resource "$DBX_ID" \
      --[[dest]] "$LAW_ID" \
      --logs '[{"category": "[[cat]]", "enabled": true}]'
  slots:
    - id: group
      options:
        - { id: diag, text: diagnostic-settings }
        - { id: dcr, text: data-collection rule }
        - { id: lawgrp, text: log-analytics workspace }
        - { id: alert, text: activity-log alert }
    - id: dest
      options:
        - { id: workspace, text: workspace }
        - { id: storage, text: storage-account }
        - { id: eventhub, text: event-hub }
    - id: cat
      options:
        - { id: jobs, text: jobs }
        - { id: tablename, text: DatabricksJobs }
        - { id: action, text: runFailed }
answer:
  values: { group: diag, dest: workspace, cat: jobs }
explanation:
  correct:
    en: "`az monitor diagnostic-settings create` creates the diagnostic setting on the resource given by `--resource`. `--workspace` sends the logs to a Log Analytics workspace, and each entry of `--logs` enables a log category by its name: `jobs` for the Lakeflow Jobs audit events, which then land in the DatabricksJobs table."
    fr: "`az monitor diagnostic-settings create` crée le paramètre de diagnostic sur la ressource indiquée par `--resource`. `--workspace` envoie les journaux vers un espace de travail Log Analytics, et chaque entrée de `--logs` active une catégorie de journaux par son nom : `jobs` pour les événements d'audit de Lakeflow Jobs, qui arrivent ensuite dans la table DatabricksJobs."
  options:
    dcr: { en: "Data collection rules configure collection by the Azure Monitor Agent, not the resource logs of Azure Databricks.", fr: "Les règles de collecte de données configurent la collecte par l'agent Azure Monitor, pas les journaux de ressource d'Azure Databricks." }
    lawgrp: { en: "This command group creates a Log Analytics workspace; it does not route logs to it.", fr: "Ce groupe de commandes crée un espace de travail Log Analytics ; il n'y achemine pas de journaux." }
    alert: { en: "An activity log alert evaluates control-plane operations of Azure resources; it does not stream logs.", fr: "Une alerte du journal d'activité évalue les opérations du plan de contrôle des ressources Azure ; elle ne diffuse pas de journaux." }
    storage: { en: "--storage-account archives the logs to a storage account.", fr: "--storage-account archive les journaux dans un compte de stockage." }
    eventhub: { en: "--event-hub streams the logs to an event hub, not to Log Analytics.", fr: "--event-hub diffuse les journaux vers un hub d'événements, pas vers Log Analytics." }
    tablename: { en: "DatabricksJobs is the destination table in Log Analytics, not the category name.", fr: "DatabricksJobs est la table de destination dans Log Analytics, pas le nom de la catégorie." }
    action: { en: "runFailed is an action name inside the jobs events, not a log category.", fr: "runFailed est un nom d'action dans les événements jobs, pas une catégorie de journaux." }
references:
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
  - title: Supported log categories - Microsoft.Databricks/workspaces
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-logs/microsoft-databricks-workspaces-logs
