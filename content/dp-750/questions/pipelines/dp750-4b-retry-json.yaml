id: dp750-4b-retry-json
objective: "4.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are defining the task **ingest_orders** of a Lakeflow job by using the Jobs API. The task runs on classic jobs compute and must meet the following requirements:

    - Be retried up to three times after a failure.
    - Wait 5 minutes between the start of a failed attempt and the start of the next attempt.
    - Stop any attempt that runs for more than 30 minutes.
    - Retry an attempt that was stopped because it ran too long.

    How should you complete the task definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez la tâche **ingest_orders** d'un job Lakeflow à l'aide de l'API Jobs. La tâche s'exécute sur un calcul de jobs classique et doit respecter les exigences suivantes :

    - Être relancée jusqu'à trois fois après un échec.
    - Attendre 5 minutes entre le début d'une tentative en échec et le début de la tentative suivante.
    - Arrêter toute tentative qui dure plus de 30 minutes.
    - Relancer une tentative arrêtée parce qu'elle a duré trop longtemps.

    Comment devez-vous compléter la définition de la tâche ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "task_key": "ingest_orders",
      "job_cluster_key": "etl_cluster",
      "notebook_task": { "notebook_path": "/Workspace/Shared/orders/01_ingest" },
      "max_retries": 3,
      "min_retry_interval_millis": [[interval]],
      "[[flag]]": true,
      "timeout_seconds": [[timeout]]
    }
  slots:
    - id: interval
      options:
        - { id: i300, text: "300" }
        - { id: i300000, text: "300000" }
        - { id: i5, text: "5" }
    - id: flag
      options:
        - { id: rot, text: retry_on_timeout }
        - { id: last, text: alert_on_last_attempt }
        - { id: dao, text: disable_auto_optimization }
    - id: timeout
      options:
        - { id: t1800000, text: "1800000" }
        - { id: t30, text: "30" }
        - { id: t1800, text: "1800" }
answer:
  values: { interval: i300000, flag: rot, timeout: t1800 }
explanation:
  correct:
    en: |
      The retry interval is in milliseconds, so 5 minutes is 300000; it is measured from the start of the failed attempt to the start of the retry. `timeout_seconds` is in seconds, so 30 minutes is 1800, and when both a timeout and retries are set, the timeout applies to each attempt. `retry_on_timeout`, false by default, makes a timed-out attempt eligible for a retry.
    fr: |
      L'intervalle entre tentatives est en millisecondes : 5 minutes valent 300000 ; il se mesure du début de la tentative en échec au début de la nouvelle tentative. `timeout_seconds` est en secondes : 30 minutes valent 1800, et quand un délai d'expiration et des nouvelles tentatives sont définis, le délai s'applique à chaque tentative. `retry_on_timeout`, false par défaut, permet de relancer une tentative arrêtée pour dépassement de délai.
  options:
    i300: { en: "300 milliseconds is a fraction of a second.", fr: "300 millisecondes représentent une fraction de seconde." }
    i5: { en: "5 milliseconds is almost an immediate retry.", fr: "5 millisecondes correspondent à une nouvelle tentative presque immédiate." }
    last: { en: "alert_on_last_attempt is a notification setting that sends alerts only on the last retry.", fr: "alert_on_last_attempt est un paramètre de notification qui n'alerte qu'à la dernière tentative." }
    dao: { en: "disable_auto_optimization concerns serverless compute, and true would remove the automatic retries of serverless tasks.", fr: "disable_auto_optimization concerne le calcul serverless, et true supprimerait les nouvelles tentatives automatiques des tâches serverless." }
    t1800000: { en: "timeout_seconds is in seconds: 1800000 is about 21 days.", fr: "timeout_seconds est en secondes : 1800000 représente environ 21 jours." }
    t30: { en: "30 seconds would stop almost every attempt.", fr: "30 secondes arrêteraient presque toutes les tentatives." }
references:
  - title: Configure and edit tasks in Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-task
  - title: Add tasks to jobs in Declarative Automation Bundles
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/job-task-types
