id: dp750-cs2c-run-if
objective: "4.1.4"
type: dragdrop
caseStudy: dp750-cs2c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the **Run if dependencies** setting of three tasks of fc_nightly_sales. The solution must meet the nightly job requirements.

    Which setting should you configure for each task? To answer, drag the appropriate settings to the correct tasks. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer le paramètre **Run if dependencies** de trois tâches de fc_nightly_sales. La solution doit respecter les exigences relatives au job nocturne.

    Quel paramètre devez-vous configurer pour chaque tâche ? Pour répondre, faites glisser les paramètres appropriés vers les tâches correctes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: allsucc, text: "All succeeded" }
    - { id: nonefailed, text: "None failed" }
    - { id: alldone, text: "All done" }
    - { id: onefailed, text: "At least one failed" }
    - { id: allfailed, text: "All failed" }
  targets:
    - { id: publish, text: "publish_gold" }
    - { id: cleanup, text: "cleanup_staging" }
    - { id: alert, text: "alert_oncall" }
answer:
  mapping: { publish: allsucc, cleanup: alldone, alert: onefailed }
explanation:
  correct:
    en: All succeeded, the default, runs publish_gold only when both transformations succeed. All done runs cleanup_staging after its dependencies have run, whatever their status. At least one failed runs alert_oncall when either transformation fails; otherwise the task is excluded.
    fr: All succeeded, la valeur par défaut, n'exécute publish_gold que si les deux transformations réussissent. All done exécute cleanup_staging une fois ses dépendances exécutées, quel que soit leur statut. At least one failed exécute alert_oncall quand l'une des transformations échoue ; sinon, la tâche est exclue.
  options:
    nonefailed:
      en: None failed only requires that no dependency failed and that at least one dependency ran, which is weaker than requiring both transformations to succeed.
      fr: None failed exige seulement qu'aucune dépendance n'ait échoué et qu'au moins une dépendance se soit exécutée, ce qui est moins strict que d'exiger la réussite des deux transformations.
    allfailed:
      en: All failed runs alert_oncall only when both transformations fail, so a single failure would raise no alert.
      fr: "All failed n'exécute alert_oncall que si les deux transformations échouent : un seul échec ne déclencherait aucune alerte."
references:
  - title: Configure task dependencies
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-if
