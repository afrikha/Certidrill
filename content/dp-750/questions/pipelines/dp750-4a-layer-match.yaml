id: dp750-4a-layer-match
objective: "4.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso collects readings from industrial devices and is designing a medallion architecture in the catalog **contoso_iot**.

    In which layer should each operation be performed? To answer, drag the appropriate layers to the correct operations. Each layer may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso collecte les relevés d'appareils industriels et conçoit une architecture en médaillon dans le catalogue **contoso_iot**.

    Dans quelle couche chaque opération doit-elle être effectuée ? Pour répondre, faites glisser les couches appropriées vers les opérations correspondantes. Chaque couche peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: bronze, text: Bronze }
    - { id: silver, text: Silver }
    - { id: gold, text: Gold }
  targets:
    - id: t1
      text: { en: "Keep each record as received, with the source file path and the ingestion time", fr: "Conserver chaque enregistrement tel qu'il a été reçu, avec le chemin du fichier source et l'heure d'ingestion" }
    - id: t2
      text: { en: "Cast the measures to numeric types and remove duplicate readings", fr: "Convertir les mesures en types numériques et supprimer les relevés en double" }
    - id: t3
      text: { en: "Compute the hourly average temperature per site for the operations dashboard", fr: "Calculer la température moyenne horaire par site pour le tableau de bord d'exploitation" }
    - id: t4
      text: { en: "Resolve out-of-order device registry updates to keep one validated row per device", fr: "Résoudre les mises à jour désordonnées du registre des appareils pour conserver une ligne validée par appareil" }
answer:
  mapping: { t1: bronze, t2: silver, t3: gold, t4: silver }
explanation:
  correct:
    en: |
      Bronze stores raw data as received, with optional provenance metadata, so it can be reprocessed. Silver enforces the schema, casts types, deduplicates and resolves out-of-order and late-arriving data. Gold holds business-oriented aggregates for dashboards and analytics.
    fr: |
      La couche bronze stocke les données brutes telles qu'elles ont été reçues, avec des métadonnées de provenance facultatives, pour pouvoir les retraiter. La couche silver applique le schéma, convertit les types, dédoublonne et résout les données désordonnées ou arrivées en retard. La couche gold contient les agrégats orientés métier destinés aux tableaux de bord et à l'analytique.
references:
  - title: What is the medallion lakehouse architecture?
    url: https://learn.microsoft.com/en-us/azure/databricks/lakehouse/medallion
