id: dp750-4c-cons-metrics-tab
objective: "4.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank wants to right-size a jobs compute configuration that runs a nightly batch. You plan to use the **Metrics** tab of the compute to analyze the resource usage of the last runs.

    Which two statements about the Metrics tab are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank souhaite dimensionner correctement une configuration de calcul de jobs qui exécute un traitement par lots nocturne. Vous prévoyez d'utiliser l'onglet **Metrics** du calcul pour analyser l'utilisation des ressources des dernières exécutions.

    Quelles sont les deux affirmations vraies concernant l'onglet Metrics ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You can select a time range in the date picker to view metrics from the last 30 days.", fr: "Vous pouvez sélectionner une plage dans le sélecteur de dates pour afficher les métriques des 30 derniers jours." } }
    - { id: b, text: { en: "You can display the Spark metrics, such as active tasks, for one individual worker node.", fr: "Vous pouvez afficher les métriques Spark, comme les tâches actives, pour un seul nœud worker." } }
    - { id: c, text: { en: "The same tab shows the metrics of the serverless compute used by the jobs.", fr: "Le même onglet affiche les métriques du calcul serverless utilisé par les jobs." } }
    - { id: d, text: { en: "You can download the data of a chart as a CSV or Excel file.", fr: "Vous pouvez télécharger les données d'un graphique dans un fichier CSV ou Excel." } }
    - { id: e, text: { en: "The metrics are stored in a storage account of your Azure subscription.", fr: "Les métriques sont stockées dans un compte de stockage de votre abonnement Azure." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Compute metrics are collected every minute and you can view history from the last 30 days with the date picker. Each chart has an overflow menu with Download CSV and Download Excel, which export one row per timestamp."
    fr: "Les métriques de calcul sont collectées chaque minute, et vous pouvez afficher l'historique des 30 derniers jours avec le sélecteur de dates. Chaque graphique dispose d'un menu de débordement avec Download CSV et Download Excel, qui exportent une ligne par horodatage."
  options:
    b: { en: "Spark metrics aren't available for individual nodes; only hardware and GPU metrics are.", fr: "Les métriques Spark ne sont pas disponibles pour un nœud individuel ; seules les métriques matérielles et GPU le sont." }
    c: { en: "Serverless notebook and job compute has no Metrics tab; it uses query insights.", fr: "Le calcul serverless des notebooks et des jobs n'a pas d'onglet Metrics ; il utilise Query insights." }
    e: { en: "Metrics are stored in Azure Databricks-managed storage, not in your storage account.", fr: "Les métriques sont stockées dans un stockage géré par Azure Databricks, pas dans votre compte de stockage." }
references:
  - title: View compute metrics
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/cluster-metrics
