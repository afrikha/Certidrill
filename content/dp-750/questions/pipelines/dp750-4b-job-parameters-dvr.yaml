id: dp750-4b-job-parameters-dvr
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are defining a Lakeflow job named **woodgrove_ledger_daily** by using the Jobs API. Every task of the job must receive the following two parameters, without any change to the task definitions:

    - `run_date`: the date on which the run started, in the YYYY-MM-DD format
    - `run_ref`: the unique identifier of the job run

    How should you complete the job definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez un job Lakeflow nommé **woodgrove_ledger_daily** à l'aide de l'API Jobs. Chaque tâche du job doit recevoir les deux paramètres suivants, sans modifier les définitions des tâches :

    - `run_date` : la date à laquelle l'exécution a démarré, au format AAAA-MM-JJ
    - `run_ref` : l'identifiant unique de l'exécution du job

    Comment devez-vous compléter la définition du job ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "name": "woodgrove_ledger_daily",
      "[[pkey]]": [
        { "name": "run_date", "default": "[[date]]" },
        { "name": "run_ref", "default": "[[ref]]" }
      ],
      "tasks": [
        { "task_key": "post_entries", "notebook_task": { "notebook_path": "/Workspace/Shared/ledger/post_entries" } },
        { "task_key": "close_day", "depends_on": [ { "task_key": "post_entries" } ], "notebook_task": { "notebook_path": "/Workspace/Shared/ledger/close_day" } }
      ]
    }
  slots:
    - id: pkey
      options:
        - { id: base, text: base_parameters }
        - { id: params, text: parameters }
        - { id: tags, text: tags }
    - id: date
      options:
        - { id: isodt, text: "{{job.start_time.iso_datetime}}" }
        - { id: ttype, text: "{{job.trigger.type}}" }
        - { id: isod, text: "{{job.start_time.iso_date}}" }
    - id: ref
      options:
        - { id: runid, text: "{{job.run_id}}" }
        - { id: jobid, text: "{{job.id}}" }
        - { id: taskrun, text: "{{task.run_id}}" }
answer:
  values: { pkey: params, date: isod, ref: runid }
explanation:
  correct:
    en: "Job parameters, defined in the job-level `parameters` array, are passed to every task that accepts parameters. `{{job.start_time.iso_date}}` returns the start date of the run (UTC) as an ISO date, and `{{job.run_id}}` is the unique identifier of the job run."
    fr: "Les paramètres de job, définis dans le tableau `parameters` au niveau du job, sont transmis à chaque tâche qui accepte des paramètres. `{{job.start_time.iso_date}}` renvoie la date de début de l'exécution (UTC) au format de date ISO, et `{{job.run_id}}` est l'identifiant unique de l'exécution du job."
  options:
    base: { en: "base_parameters belongs to a notebook task, so you would have to change each task.", fr: "base_parameters appartient à une tâche de notebook : il faudrait modifier chaque tâche." }
    tags: { en: "Tags label the job and propagate to job clusters; they aren't passed to tasks as parameters.", fr: "Les étiquettes (tags) qualifient le job et se propagent aux clusters de job ; elles ne sont pas transmises aux tâches comme paramètres." }
    isodt: { en: "iso_datetime returns a date and a time, not the YYYY-MM-DD format.", fr: "iso_datetime renvoie une date et une heure, pas le format AAAA-MM-JJ." }
    ttype: { en: "job.trigger.type returns the type of trigger, such as periodic or file_arrival.", fr: "job.trigger.type renvoie le type de déclencheur, par exemple periodic ou file_arrival." }
    jobid: { en: "job.id identifies the job, which is the same for all its runs.", fr: "job.id identifie le job, identique pour toutes ses exécutions." }
    taskrun: { en: "task.run_id identifies the run of the current task, which differs from one task to the next.", fr: "task.run_id identifie l'exécution de la tâche en cours, différente d'une tâche à l'autre." }
references:
  - title: Dynamic value references
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/dynamic-value-references
