id: dp750-4a-ifelse-branch
objective: "4.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Lakeflow job named **orders_daily**. Its Python notebook task **validate** counts the invalid rows of **contoso.silver.orders** and runs the following line.

    ```python
    dbutils.jobs.taskValues.set(key="bad_records", value=bad_count)
    ```

    You add an **If/else condition** task named **check_quality** that depends on validate. When the number of invalid rows is greater than zero, the notebook task **quarantine_report** must run. Otherwise, the pipeline task **publish_gold** must run.

    How should you configure the tasks? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un job Lakeflow nommé **orders_daily**. Sa tâche notebook Python **validate** compte les lignes non valides de **contoso.silver.orders** et exécute la ligne suivante.

    ```python
    dbutils.jobs.taskValues.set(key="bad_records", value=bad_count)
    ```

    Vous ajoutez une tâche **If/else condition** nommée **check_quality** qui dépend de validate. Quand le nombre de lignes non valides est supérieur à zéro, la tâche notebook **quarantine_report** doit s'exécuter. Sinon, c'est la tâche de pipeline **publish_gold** qui doit s'exécuter.

    Comment devez-vous configurer les tâches ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - Condition of check_quality, first operand: [[left]]
      - Condition of check_quality, operator and second operand: [[op]] 0
      - Depends on setting of quarantine_report: [[dep]]
    fr: |
      - Condition de check_quality, premier opérande : [[left]]
      - Condition de check_quality, opérateur et second opérande : [[op]] 0
      - Paramètre Depends on de quarantine_report : [[dep]]
  slots:
    - id: left
      options:
        - { id: tv, text: "{{tasks.validate.values.bad_records}}" }
        - { id: state, text: "{{tasks.validate.result_state}}" }
        - { id: param, text: "{{job.parameters.bad_records}}" }
        - { id: short, text: "{{validate.bad_records}}" }
    - id: op
      options:
        - { id: gt, text: ">" }
        - { id: eq, text: "==" }
        - { id: lt, text: "<" }
        - { id: le, text: "<=" }
    - id: dep
      options:
        - { id: tbranch, text: "check_quality (true)" }
        - { id: fbranch, text: "check_quality (false)" }
        - { id: validate, text: "validate" }
answer:
  values: { left: tv, op: gt, dep: tbranch }
explanation:
  correct:
    en: |
      A task value set by an upstream task is referenced as `{{tasks.<task_name>.values.<key>}}`. The `>` operator compares the operands as numbers, so the condition is true when there are invalid rows. A downstream task that must run when the condition is true depends on `check_quality (true)`; publish_gold depends on `check_quality (false)`.
    fr: |
      Une valeur de tâche définie par une tâche en amont se référence par `{{tasks.<task_name>.values.<key>}}`. L'opérateur `>` compare les opérandes comme des nombres : la condition est vraie quand il existe des lignes non valides. Une tâche en aval qui doit s'exécuter quand la condition est vraie dépend de `check_quality (true)` ; publish_gold dépend de `check_quality (false)`.
  options:
    state:
      en: |
        result_state returns the outcome of validate, such as success or failed, not the number of rows.
      fr: |
        result_state renvoie le résultat de validate, par exemple success ou failed, pas le nombre de lignes.
    param:
      en: |
        A job parameter is set when the run starts; a notebook can't change it with taskValues.set().
      fr: |
        Un paramètre de job est défini au démarrage de l'exécution ; un notebook ne peut pas le modifier avec taskValues.set().
    short:
      en: |
        This isn't a valid dynamic value reference; task values live in the tasks namespace.
      fr: |
        Ce n'est pas une référence de valeur dynamique valide ; les valeurs de tâche se trouvent dans l'espace de noms tasks.
    eq:
      en: "== 0 is true when there are no invalid rows, which is the opposite of the requirement."
      fr: "== 0 est vrai quand il n'y a aucune ligne non valide, ce qui est l'inverse de l'exigence."
    validate:
      en: |
        Depending directly on validate would run quarantine_report every time validate succeeds, whatever the condition result.
      fr: |
        Dépendre directement de validate exécuterait quarantine_report à chaque réussite de validate, quel que soit le résultat de la condition.
references:
  - title: Add branching logic to a job with the If/else task
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/if-else
  - title: Use task values to pass information between tasks
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/task-values
