id: dp750-4c-spark-streaming-restart
objective: "4.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin runs a Structured Streaming notebook that reads flight events continuously on an all-purpose compute resource. The compute has been running without interruption for four months.

    The security team requires the compute to use the latest images for its containers and VM hosts. The solution must minimize the disruption of the stream.

    What should you do?
  fr: |
    Tailspin exécute un notebook Structured Streaming qui lit en continu des événements de vols sur une ressource de calcul polyvalent. Le calcul fonctionne sans interruption depuis quatre mois.

    L'équipe de sécurité exige que le calcul utilise les images les plus récentes pour ses conteneurs et ses hôtes de machines virtuelles. La solution doit réduire au minimum la perturbation du flux.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Pin the compute so that Azure Databricks keeps it updated", fr: "Épingler le calcul pour qu'Azure Databricks le maintienne à jour" } }
    - { id: b, text: { en: "Enable automatic termination after 10 minutes of inactivity", fr: "Activer l'arrêt automatique après 10 minutes d'inactivité" } }
    - { id: c, text: { en: "Schedule regular restarts of the compute during a low-traffic window", fr: "Planifier des redémarrages réguliers du calcul pendant une période de faible trafic" } }
    - { id: d, text: { en: "Increase the number of workers of the compute", fr: "Augmenter le nombre de workers du calcul" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A restart gives the compute the latest images for its containers and VM hosts. Microsoft recommends restarting long-running compute regularly, especially compute that processes streaming data, and you are responsible for doing it; a restart during a low-traffic window limits the impact on the stream."
    fr: "Un redémarrage fournit au calcul les images les plus récentes pour ses conteneurs et ses hôtes de machines virtuelles. Microsoft recommande de redémarrer régulièrement les calculs de longue durée, en particulier ceux qui traitent des données de streaming, et c'est à vous de le faire ; un redémarrage pendant une période de faible trafic limite l'impact sur le flux."
  options:
    b: { en: "Structured Streaming counts as activity, so the compute never becomes inactive, and termination doesn't schedule a restart.", fr: "Structured Streaming compte comme une activité : le calcul ne devient jamais inactif, et l'arrêt ne planifie pas de redémarrage." }
    a: { en: "Pinning only prevents a terminated compute from being deleted after 30 days.", fr: "L'épinglage empêche seulement la suppression d'un calcul arrêté au bout de 30 jours." }
    d: { en: "Resizing applies without a restart, so the compute keeps its current images.", fr: "Le redimensionnement s'applique sans redémarrage : le calcul garde ses images actuelles." }
references:
  - title: Manage classic compute
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage
