id: dp750-4b-task-retry-policy
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Lakeflow job named **proseware_crm_extract** runs nightly on classic jobs compute. Its task **extract_accounts** calls a partner API that sometimes returns transient network errors. When that happens, the task fails, and an engineer starts the job again the next morning.

    You need the task to recover from transient errors on its own during the nightly run.

    What should you configure?
  fr: |
    Un job Lakeflow nommé **proseware_crm_extract** s'exécute chaque nuit sur un calcul de jobs classique. Sa tâche **extract_accounts** appelle l'API d'un partenaire qui renvoie parfois des erreurs réseau temporaires. Dans ce cas, la tâche échoue, et un ingénieur relance le job le lendemain matin.

    La tâche doit se rétablir seule des erreurs temporaires pendant l'exécution nocturne.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A retry policy on extract_accounts, with a number of retries and an interval between attempts", fr: "Une stratégie de nouvelles tentatives sur extract_accounts, avec un nombre de tentatives et un intervalle entre elles" } }
    - { id: b, text: { en: "A repair run of each failed run of the job", fr: "Une réparation (repair run) de chaque exécution en échec du job" } }
    - { id: c, text: { en: "Queueing for the job, with max concurrent runs set to 1", fr: "La mise en file d'attente pour le job, avec max concurrent runs défini sur 1" } }
    - { id: d, text: { en: "A Warning threshold on the Run duration metric of the task", fr: "Un seuil Warning sur la métrique Run duration de la tâche" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For most job configurations, including classic compute, a failed task isn't retried. Clicking Add next to Retries in the task settings defines how many times and how often the task is retried, within the same run.
    fr: |
      Pour la plupart des configurations de jobs, y compris le calcul classique, une tâche en échec n'est pas relancée. Cliquer sur Add à côté de Retries dans les paramètres de la tâche définit combien de fois et à quel intervalle la tâche est relancée, au sein de la même exécution.
  options:
    b: { en: "A repair run is started manually after the run has failed; it isn't an automatic recovery.", fr: "Une réparation se lance manuellement après l'échec de l'exécution ; ce n'est pas un rétablissement automatique." }
    c: { en: "Queueing makes runs wait when limits are reached; it doesn't rerun a failed task.", fr: "La file d'attente fait patienter les exécutions quand les limites sont atteintes ; elle ne relance pas une tâche en échec." }
    d: { en: "A Warning threshold only raises a duration event for notifications.", fr: "Un seuil Warning ne fait que générer un événement de durée pour les notifications." }
references:
  - title: Configure and edit tasks in Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-task
