id: dp750-4b-duration-warning-threshold
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Lakeflow job named **woodgrove_risk_batch** usually completes in 40 minutes. In its job notifications, the **Duration warning** and **Failure** events send emails to riskops@woodgrove.com. No duration or streaming backlog threshold is configured.

    Last week, a run lasted 2 hours and succeeded, but no email was sent.

    You need riskops@woodgrove.com to receive an email when a run lasts longer than 1 hour. Runs that exceed 1 hour must continue until they complete.

    What should you do?
  fr: |
    Un job Lakeflow nommé **woodgrove_risk_batch** se termine généralement en 40 minutes. Dans ses notifications de job, les événements **Duration warning** et **Failure** envoient des e-mails à riskops@woodgrove.com. Aucun seuil de durée ni de backlog de streaming n'est configuré.

    La semaine dernière, une exécution a duré 2 heures et a réussi, mais aucun e-mail n'a été envoyé.

    riskops@woodgrove.com doit recevoir un e-mail quand une exécution dure plus d'une heure. Les exécutions qui dépassent une heure doivent se poursuivre jusqu'à leur fin.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the Timeout threshold of the Run duration metric to 1 hour.", fr: "Définir le seuil Timeout de la métrique Run duration sur 1 heure." } }
    - { id: b, text: { en: "Set the Warning threshold of the Run duration metric to 1 hour.", fr: "Définir le seuil Warning de la métrique Run duration sur 1 heure." } }
    - { id: c, text: { en: "Add a Streaming backlog threshold to the job.", fr: "Ajouter un seuil de backlog de streaming au job." } }
    - { id: d, text: { en: "Move the Duration warning notification from the job to each task.", fr: "Déplacer la notification Duration warning du job vers chaque tâche." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Duration warning event fires only when a run exceeds the Warning threshold of the Run duration metric, which defines the expected completion time. Without that threshold, the event never fires. A warning triggers the notification and lets the run continue.
    fr: |
      L'événement Duration warning ne se déclenche que lorsqu'une exécution dépasse le seuil Warning de la métrique Run duration, qui définit la durée d'exécution attendue. Sans ce seuil, l'événement ne se déclenche jamais. Un avertissement déclenche la notification et laisse l'exécution se poursuivre.
  options:
    a: { en: "Timeout sets the maximum completion time: the run would be stopped with the Timed Out status after 1 hour.", fr: "Timeout fixe la durée maximale : l'exécution serait arrêtée à l'état Timed Out après une heure." }
    c: { en: "Streaming backlog thresholds measure how far streams lag behind, not how long the run lasts.", fr: "Les seuils de backlog de streaming mesurent le retard des flux, pas la durée de l'exécution." }
    d: { en: "Task notifications also need a Warning threshold; moving the notification doesn't define the expected duration.", fr: "Les notifications de tâche ont elles aussi besoin d'un seuil Warning ; déplacer la notification ne définit pas la durée attendue." }
references:
  - title: Configure and edit Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-job
  - title: Add notifications on a job
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications
