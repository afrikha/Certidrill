id: dp750-4d-alert-rule-order
objective: "4.4.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Databricks workspace named **adb-adatum** on the Premium plan, a Log Analytics workspace named **law-adatum** and an action group named **ag-oncall**. No diagnostic setting is configured.

    You need to alert ag-oncall when job runs fail in adb-adatum. You must validate the query on real data before you create the rule.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un espace de travail Azure Databricks nommé **adb-adatum** sur le plan Premium, d'un espace de travail Log Analytics nommé **law-adatum** et d'un groupe d'actions nommé **ag-oncall**. Aucun paramètre de diagnostic n'est configuré.

    Vous devez alerter ag-oncall quand des exécutions de jobs échouent dans adb-adatum. Vous devez valider la requête sur des données réelles avant de créer la règle.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: diag, text: { en: "Create a diagnostic setting on adb-adatum that sends the jobs category to law-adatum.", fr: "Créer sur adb-adatum un paramètre de diagnostic qui envoie la catégorie jobs vers law-adatum." } }
    - { id: query, text: { en: "In law-adatum, run a KQL query that returns the runFailed events of DatabricksJobs.", fr: "Dans law-adatum, exécuter une requête KQL qui renvoie les événements runFailed de DatabricksJobs." } }
    - { id: condition, text: { en: "Select New alert rule, and then set the measurement, threshold and frequency of evaluation on the Condition tab.", fr: "Sélectionner New alert rule, puis définir la mesure, le seuil et la fréquence d'évaluation dans l'onglet Condition." } }
    - { id: actions, text: { en: "On the Actions tab, select ag-oncall.", fr: "Dans l'onglet Actions, sélectionner ag-oncall." } }
    - { id: details, text: { en: "On the Details tab, set the severity and the rule name, and then select Review + create.", fr: "Dans l'onglet Details, définir la gravité et le nom de la règle, puis sélectionner Review + create." } }
    - { id: ama, text: { en: "Install the Azure Monitor Agent on the job compute by using an init script.", fr: "Installer l'agent Azure Monitor sur le calcul de jobs à l'aide d'un script d'initialisation." } }
    - { id: activity, text: { en: "Create an activity log alert scoped to adb-adatum.", fr: "Créer une alerte du journal d'activité limitée à adb-adatum." } }
answer:
  sequence: [ diag, query, condition, actions, details ]
explanation:
  correct:
    en: The job events must reach law-adatum first, through a diagnostic setting with the jobs category. You then run and check the query in Log Analytics and select New alert rule, which creates the rule with that query. The rule wizard continues with the Condition tab (measurement, threshold, frequency), the Actions tab (action group) and the Details tab (severity, name), before Review + create.
    fr: "Les événements de jobs doivent d'abord atteindre law-adatum, via un paramètre de diagnostic avec la catégorie jobs. Vous exécutez et vérifiez ensuite la requête dans Log Analytics, puis sélectionnez New alert rule, ce qui crée la règle avec cette requête. L'assistant continue avec l'onglet Condition (mesure, seuil, fréquence), l'onglet Actions (groupe d'actions) et l'onglet Details (gravité, nom), avant Review + create."
  options:
    ama: { en: "Job events come from the Azure Databricks control plane through the diagnostic setting, not from an agent on the compute.", fr: "Les événements de jobs proviennent du plan de contrôle Azure Databricks via le paramètre de diagnostic, pas d'un agent installé sur le calcul." }
    activity: { en: "The activity log does not contain job runs, only operations on the workspace resource.", fr: "Le journal d'activité ne contient pas les exécutions de jobs, seulement les opérations sur la ressource d'espace de travail." }
references:
  - title: Create Azure Monitor log search alert rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
