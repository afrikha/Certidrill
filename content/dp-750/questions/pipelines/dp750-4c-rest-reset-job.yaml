id: dp750-4c-rest-reset-job
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores the complete settings of a production job, `fab_prod_nightly`, as a JSON file in a Git repository. A release step calls the Azure Databricks REST API directly to apply the file to the existing job.

    After the release, the job must match the file exactly: settings removed from the file, such as an old email notification, must be removed from the job. The job must keep its job ID and its run history.

    Which endpoint should the release step call?
  fr: |
    Fabrikam stocke les paramètres complets d'un job de production, `fab_prod_nightly`, sous forme de fichier JSON dans un dépôt Git. Une étape de mise en production appelle directement l'API REST Azure Databricks pour appliquer le fichier au job existant.

    Après la mise en production, le job doit correspondre exactement au fichier : les paramètres retirés du fichier, comme une ancienne notification par e-mail, doivent être supprimés du job. Le job doit conserver son ID et son historique d'exécutions.

    Quel point de terminaison l'étape de mise en production doit-elle appeler ?
body:
  options:
    - { id: a, text: "POST /api/2.2/jobs/update" }
    - { id: b, text: "POST /api/2.2/jobs/reset" }
    - { id: c, text: "POST /api/2.2/jobs/create" }
    - { id: d, text: "POST /api/2.2/jobs/runs/submit" }
answer: { optionId: b }
explanation:
  correct:
    en: "`jobs/reset` overwrites all the settings of an existing job with the settings in the request, so anything absent from the file disappears while the job ID and run history stay the same. Microsoft recommends Jobs API 2.2 for new and existing clients."
    fr: "`jobs/reset` écrase tous les paramètres d'un job existant par ceux de la requête : tout ce qui est absent du fichier disparaît, tandis que l'ID du job et son historique d'exécutions restent identiques. Microsoft recommande l'API Jobs 2.2 pour les clients nouveaux et existants."
  options:
    a: { en: "jobs/update partially updates a job: settings that the request doesn't mention are kept, so the old notification would remain.", fr: "jobs/update met à jour partiellement un job : les paramètres absents de la requête sont conservés, l'ancienne notification resterait donc." }
    c: { en: "jobs/create creates a new job with a new ID and no history.", fr: "jobs/create crée un nouveau job avec un nouvel ID et sans historique." }
    d: { en: "runs/submit starts a one-time run without creating or changing a job.", fr: "runs/submit lance une exécution unique sans créer ni modifier de job." }
references:
  - title: Jobs API 2.0
    url: https://learn.microsoft.com/en-us/azure/databricks/reference/jobs-2.0-api
