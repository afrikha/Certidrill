id: dp750-4b-runas-service-principal
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your Azure Databricks workspace contains a Lakeflow job named **contoso_sales_daily** that loads the table `contoso_prod.sales.orders` every night. A data engineer named Lena created the job, so she is both its owner and its **Run as** identity.

    Lena leaves the company next month, and her account will then be removed from the workspace.

    You need to ensure that the job keeps running with stable permissions after Lena leaves. The solution must follow Databricks recommendations.

    What should you do?
  fr: |
    Votre espace de travail Azure Databricks contient un job Lakeflow nommé **contoso_sales_daily** qui charge chaque nuit la table `contoso_prod.sales.orders`. Une ingénieure données nommée Lena a créé le job : elle en est donc à la fois la propriétaire et l'identité **Run as**.

    Lena quitte l'entreprise le mois prochain, et son compte sera alors supprimé de l'espace de travail.

    Vous devez faire en sorte que le job continue de s'exécuter avec des autorisations stables après le départ de Lena. La solution doit suivre les recommandations de Databricks.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the IS OWNER permission on the job to the data-engineers account group.", fr: "Attribuer l'autorisation IS OWNER sur le job au groupe de compte data-engineers." } }
    - { id: b, text: { en: "Grant the CAN MANAGE permission on the job to the data-engineers account group.", fr: "Accorder l'autorisation CAN MANAGE sur le job au groupe de compte data-engineers." } }
    - { id: c, text: { en: "Set the Run as setting of the job to a service principal that has the required privileges.", fr: "Définir le paramètre Run as du job sur un principal de service qui dispose des privilèges requis." } }
    - { id: d, text: { en: "Set the Run as setting of the job to the built-in users group.", fr: "Définir le paramètre Run as du job sur le groupe intégré users." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A job runs with the privileges of its Run as identity, which is the creator by default. Databricks recommends running production jobs as a service principal, so that runs keep working when users leave or change roles. Changing Run as requires CAN MANAGE or IS OWNER on the job.
    fr: |
      Un job s'exécute avec les privilèges de son identité Run as, qui est par défaut son créateur. Databricks recommande d'exécuter les jobs de production sous un principal de service, pour que les exécutions continuent de fonctionner quand des utilisateurs partent ou changent de rôle. Modifier Run as demande CAN MANAGE ou IS OWNER sur le job.
  options:
    a: { en: "A group can't be assigned IS OWNER: a job has exactly one owner, which is a user or a service principal.", fr: "Un groupe ne peut pas recevoir IS OWNER : un job a exactement un propriétaire, qui est un utilisateur ou un principal de service." }
    b: { en: "CAN MANAGE lets the group edit the job, but the runs still use the Run as identity, which is still Lena.", fr: "CAN MANAGE permet au groupe de modifier le job, mais les exécutions utilisent toujours l'identité Run as, qui reste Lena." }
    d: { en: "The built-in groups admins, users and account users can't be used as the Run as identity.", fr: "Les groupes intégrés admins, users et account users ne peuvent pas servir d'identité Run as." }
references:
  - title: Manage identities, permissions, and privileges for Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/privileges
