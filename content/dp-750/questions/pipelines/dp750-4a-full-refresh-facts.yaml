id: dp750-4a-full-refresh-facts
objective: "4.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Lakeflow Spark Declarative Pipelines pipeline. The streaming table **events_bronze** reads an Apache Kafka topic that keeps messages for seven days, and the materialized view **events_daily** aggregates events_bronze. The pipeline has run for six months.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un pipeline des pipelines déclaratifs Lakeflow Spark. La table de diffusion en continu **events_bronze** lit une rubrique Apache Kafka qui conserve les messages pendant sept jours, et la vue matérialisée **events_daily** agrège events_bronze. Le pipeline s'exécute depuis six mois.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A full refresh of events_bronze clears its data and flow checkpoints, then reprocesses the records still available in Kafka.", fr: "Une actualisation complète de events_bronze vide ses données et les points de contrôle de ses flux, puis retraite les enregistrements encore disponibles dans Kafka." } }
    - { id: b, text: { en: "Resetting the streaming flow checkpoints of events_bronze also deletes the data already stored in the table.", fr: "La réinitialisation des points de contrôle des flux de events_bronze supprime aussi les données déjà stockées dans la table." } }
    - { id: c, text: { en: "Setting the table property pipelines.reset.allowed to false on events_bronze prevents full refreshes of that table.", fr: "Définir la propriété de table pipelines.reset.allowed sur false sur events_bronze empêche les actualisations complètes de cette table." } }
    - { id: d, text: { en: "After a full refresh, events_bronze still contains the records that Kafka removed after seven days.", fr: "Après une actualisation complète, events_bronze contient toujours les enregistrements que Kafka a supprimés au bout de sept jours." } }
    - { id: e, text: { en: "The property pipelines.reset.allowed is false by default for streaming tables that read from Kafka.", fr: "La propriété pipelines.reset.allowed vaut false par défaut pour les tables de diffusion en continu qui lisent Kafka." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A full refresh clears the streaming table and its flow checkpoints and reprocesses every record of the source, so only what Kafka still retains is reloaded. To protect such a table, set pipelines.reset.allowed to false, which blocks full refreshes of it; the default value is true.
    fr: |
      Une actualisation complète vide la table de diffusion en continu et les points de contrôle de ses flux, puis retraite tous les enregistrements de la source : seul ce que Kafka conserve encore est rechargé. Pour protéger une telle table, définissez pipelines.reset.allowed sur false, ce qui bloque ses actualisations complètes ; la valeur par défaut est true.
  options:
    b:
      en: |
        Resetting the flow checkpoints keeps the table data and then reprocesses all the records of the source; only a full refresh clears the data.
      fr: |
        La réinitialisation des points de contrôle conserve les données de la table, puis retraite tous les enregistrements de la source ; seule une actualisation complète vide les données.
    d:
      en: |
        The full refresh clears the table first, so records that are no longer in Kafka are dropped from the target.
      fr: |
        L'actualisation complète vide d'abord la table : les enregistrements qui ne sont plus dans Kafka disparaissent de la cible.
    e:
      en: |
        pipelines.reset.allowed defaults to true for every table; you must set it to false yourself.
      fr: |
        pipelines.reset.allowed vaut true par défaut pour toutes les tables ; vous devez la définir vous-même sur false.
references:
  - title: Run a pipeline update
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/updates
  - title: Pipeline properties reference
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/properties
