id: dp750-cs2c-log-analytics
objective: "4.4.6"
type: single
caseStudy: dp750-cs2c-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the operations requirement for the job events of adb-fc-prod.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence des opérations relative aux événements de jobs d'adb-fc-prod.

    Que devez-vous faire ?
body:
  options:
    - { id: ama, text: { en: "Add an init script to the job compute that installs the Azure Monitor Agent with a data collection rule for law-fc-ops", fr: "Ajouter au calcul de jobs un script d'initialisation qui installe l'agent Azure Monitor avec une règle de collecte de données pour law-fc-ops" } }
    - { id: notif, text: { en: "Add law-fc-ops as a system notification destination, and select it in the job notifications of fc_nightly_sales", fr: "Ajouter law-fc-ops comme destination de notification système, et la sélectionner dans les notifications du job fc_nightly_sales" } }
    - { id: diag, text: { en: "Create a diagnostic setting on the adb-fc-prod workspace resource that sends the jobs logs to law-fc-ops", fr: "Créer un paramètre de diagnostic sur la ressource d'espace de travail adb-fc-prod qui envoie les journaux jobs vers law-fc-ops" } }
    - { id: storage, text: { en: "Create a diagnostic setting on the storage account of the fc_prod catalog that sends its read logs to law-fc-ops", fr: "Créer un paramètre de diagnostic sur le compte de stockage du catalogue fc_prod qui envoie ses journaux de lecture vers law-fc-ops" } }
answer: { optionId: diag }
explanation:
  correct:
    en: Diagnostic log delivery, available on the Premium plan, is configured in the Diagnostic settings of the Azure Databricks workspace resource in the Azure portal. Selecting the jobs category and Send to Log Analytics streams the job events to law-fc-ops, where the operations team can query them and create log alert rules.
    fr: La remise des journaux de diagnostic, disponible avec le plan Premium, se configure dans les paramètres de diagnostic de la ressource d'espace de travail Azure Databricks dans le portail Azure. Sélectionner la catégorie jobs et Send to Log Analytics envoie les événements de jobs vers law-fc-ops, où l'équipe des opérations peut les interroger et créer des règles d'alerte de journal.
  options:
    ama:
      en: Diagnostic logs of Azure Databricks are delivered through diagnostic settings; installing an agent on the compute would collect machine data, not the workspace job events.
      fr: Les journaux de diagnostic d'Azure Databricks sont remis par les paramètres de diagnostic ; installer un agent sur le calcul collecterait des données de machine, pas les événements de jobs de l'espace de travail.
    notif:
      en: Notification destinations send alerts to targets such as email, Slack, Microsoft Teams, PagerDuty or HTTP webhooks; a Log Analytics workspace is not a destination and would not receive queryable logs.
      fr: Les destinations de notification envoient des alertes vers des cibles comme l'e-mail, Slack, Microsoft Teams, PagerDuty ou des webhooks HTTP ; un espace de travail Log Analytics n'est pas une destination et ne recevrait pas de journaux interrogeables.
    storage:
      en: Storage account logs describe access to blobs and files, not job runs in the Azure Databricks workspace.
      fr: Les journaux du compte de stockage décrivent les accès aux objets blob et aux fichiers, pas les exécutions de jobs de l'espace de travail Azure Databricks.
references:
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
  - title: Add notifications on a job
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications
