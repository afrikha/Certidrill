id: dp750-4b-job-json-concurrency
objective: "4.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are defining a Lakeflow job named **fabrikam_inventory_hourly** by using the Jobs API. The job must meet the following requirements:

    - Never have more than one active run at a time.
    - A run that is triggered while another run is active must wait for it instead of being skipped.
    - Run with the identity of the service principal whose application ID is `8c2f61d4-5b0e-4a3c-9d7e-1f2a3b4c5d6e`.

    How should you complete the job definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez un job Lakeflow nommé **fabrikam_inventory_hourly** à l'aide de l'API Jobs. Le job doit respecter les exigences suivantes :

    - Ne jamais avoir plus d'une exécution active à la fois.
    - Une exécution déclenchée pendant qu'une autre est active doit l'attendre au lieu d'être ignorée.
    - S'exécuter sous l'identité du principal de service dont l'ID d'application est `8c2f61d4-5b0e-4a3c-9d7e-1f2a3b4c5d6e`.

    Comment devez-vous compléter la définition du job ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "name": "fabrikam_inventory_hourly",
      "max_concurrent_runs": [[conc]],
      [[queue]],
      "run_as": { "[[runas]]": "8c2f61d4-5b0e-4a3c-9d7e-1f2a3b4c5d6e" },
      "tasks": [
        {
          "task_key": "refresh_stock",
          "notebook_task": { "notebook_path": "/Workspace/Shared/inventory/refresh_stock" }
        }
      ]
    }
  slots:
    - id: conc
      options:
        - { id: c1, text: "1" }
        - { id: c2, text: "2" }
        - { id: c10, text: "10" }
    - id: queue
      options:
        - { id: qoff, text: "\"queue\": { \"enabled\": false }" }
        - { id: cont, text: "\"continuous\": { \"pause_status\": \"UNPAUSED\" }" }
        - { id: qon, text: "\"queue\": { \"enabled\": true }" }
    - id: runas
      options:
        - { id: user, text: user_name }
        - { id: group, text: group_name }
        - { id: sp, text: service_principal_name }
answer:
  values: { conc: c1, queue: qon, runas: sp }
explanation:
  correct:
    en: "`max_concurrent_runs` set to 1 allows a single active run. When the limit is reached, a new run is skipped unless queueing is enabled; with `queue.enabled` set to true, it waits (up to 48 hours) until it can start. `run_as.service_principal_name` takes the application ID of the service principal."
    fr: "`max_concurrent_runs` défini sur 1 n'autorise qu'une seule exécution active. Quand la limite est atteinte, une nouvelle exécution est ignorée, sauf si la mise en file d'attente est activée ; avec `queue.enabled` à true, elle attend (jusqu'à 48 heures) de pouvoir démarrer. `run_as.service_principal_name` prend l'ID d'application du principal de service."
  options:
    c2: { en: "A value of 2 allows two overlapping runs.", fr: "La valeur 2 autorise deux exécutions simultanées." }
    c10: { en: "A value of 10 allows up to ten overlapping runs.", fr: "La valeur 10 autorise jusqu'à dix exécutions simultanées." }
    qoff: { en: "Without queueing, a run that exceeds the concurrency limit is skipped.", fr: "Sans file d'attente, une exécution qui dépasse la limite de simultanéité est ignorée." }
    cont: { en: "A continuous trigger keeps one run always active; it doesn't make triggered runs wait.", fr: "Un déclencheur continu garde une exécution toujours active ; il ne fait pas attendre les exécutions déclenchées." }
    user: { en: "user_name expects the user name of a person, not a service principal's application ID.", fr: "user_name attend le nom d'un utilisateur, pas l'ID d'application d'un principal de service." }
    group: { en: "group_name expects the name of an account group.", fr: "group_name attend le nom d'un groupe de compte." }
references:
  - title: Configure and edit Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-job
  - title: Declarative Automation Bundles resources
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/resources
