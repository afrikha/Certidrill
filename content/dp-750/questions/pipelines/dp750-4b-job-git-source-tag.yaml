id: dp750-4b-job-git-source-tag
objective: "4.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The tasks of the Lakeflow job **contoso_billing_prod** read their notebooks from a remote Git repository instead of the workspace. The repository is hosted in Azure DevOps at `https://dev.azure.com/contoso/data/_git/billing`.

    Each production release is marked with a Git tag. The job must run exactly the code of the release tagged `v2.4.0`, whatever is later pushed to the branches.

    How should you complete the Git source of the job? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les tâches du job Lakeflow **contoso_billing_prod** lisent leurs notebooks dans un dépôt Git distant plutôt que dans l'espace de travail. Le dépôt est hébergé dans Azure DevOps à l'adresse `https://dev.azure.com/contoso/data/_git/billing`.

    Chaque version de production est marquée par une balise (tag) Git. Le job doit exécuter exactement le code de la version balisée `v2.4.0`, quoi qu'il soit poussé ensuite sur les branches.

    Comment devez-vous compléter la source Git du job ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "git_source": {
        "git_url": "https://dev.azure.com/contoso/data/_git/billing",
        "git_provider": "[[prov]]",
        "[[ref]]": "v2.4.0"
      }
    }
  slots:
    - id: prov
      options:
        - { id: github, text: gitHub }
        - { id: ado, text: azureDevOpsServices }
        - { id: gitlab, text: gitLab }
        - { id: bbs, text: bitbucketServer }
    - id: ref
      options:
        - { id: branch, text: git_branch }
        - { id: commit, text: git_commit }
        - { id: tag, text: git_tag }
answer:
  values: { prov: ado, ref: tag }
explanation:
  correct:
    en: |
      `azureDevOpsServices` is the provider value for a repository hosted in Azure DevOps (Azure Repos). `git_tag` checks out the commit that the tag points to, so every run uses the release v2.4.0; `git_branch`, `git_tag` and `git_commit` are mutually exclusive.
    fr: |
      `azureDevOpsServices` est la valeur de fournisseur pour un dépôt hébergé dans Azure DevOps (Azure Repos). `git_tag` extrait le commit désigné par la balise : chaque exécution utilise la version v2.4.0 ; `git_branch`, `git_tag` et `git_commit` s'excluent mutuellement.
  options:
    github: { en: "gitHub is for repositories hosted on GitHub.", fr: "gitHub concerne les dépôts hébergés sur GitHub." }
    gitlab: { en: "gitLab is for repositories hosted on GitLab.", fr: "gitLab concerne les dépôts hébergés sur GitLab." }
    bbs: { en: "bitbucketServer is for self-managed Bitbucket servers.", fr: "bitbucketServer concerne les serveurs Bitbucket autogérés." }
    branch: { en: "A branch name follows the latest commit pushed to the branch, and v2.4.0 is a tag, not a branch.", fr: "Un nom de branche suit le dernier commit poussé sur la branche, et v2.4.0 est une balise, pas une branche." }
    commit: { en: "git_commit expects a commit hash, not a tag name.", fr: "git_commit attend un hachage de commit, pas un nom de balise." }
references:
  - title: Declarative Automation Bundles resources
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/resources
