id: dp750-4b-new-job-defaults
objective: "4.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You create a new Lakeflow job in the workspace UI and add one notebook task to it. You don't change any job-level setting.

    Which two statements describe the job?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un nouveau job Lakeflow dans l'interface de l'espace de travail et vous y ajoutez une tâche de notebook. Vous ne modifiez aucun paramètre au niveau du job.

    Quelles sont les deux affirmations qui décrivent le job ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Queueing of runs is disabled.", fr: "La mise en file d'attente des exécutions est désactivée." } }
    - { id: b, text: { en: "The job runs only when it is started manually or through the API.", fr: "Le job ne s'exécute que s'il est lancé manuellement ou par l'API." } }
    - { id: c, text: { en: "Runs use the permissions of the workspace admins group.", fr: "Les exécutions utilisent les autorisations du groupe admins de l'espace de travail." } }
    - { id: d, text: { en: "The maximum number of concurrent runs is 1.", fr: "Le nombre maximal d'exécutions simultanées est 1." } }
    - { id: e, text: { en: "The job is created paused and must be resumed before it can run.", fr: "Le job est créé à l'état suspendu et doit être repris avant de pouvoir s'exécuter." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      By default, a job has no trigger, so it runs only when someone starts it with Run now or through the API. Max concurrent runs defaults to 1 for every new job.
    fr: |
      Par défaut, un job n'a aucun déclencheur : il ne s'exécute que si quelqu'un le lance avec Run now ou par l'API. Le nombre maximal d'exécutions simultanées vaut 1 par défaut pour tout nouveau job.
  options:
    a: { en: "Queueing is enabled by default for jobs created in the UI after April 15, 2024.", fr: "La mise en file d'attente est activée par défaut pour les jobs créés dans l'interface après le 15 avril 2024." }
    c: { en: "Runs use the Run as identity, which is the creator of the job by default.", fr: "Les exécutions utilisent l'identité Run as, qui est par défaut le créateur du job." }
    e: { en: "A new job isn't paused; only triggers can be paused and resumed.", fr: "Un nouveau job n'est pas suspendu ; seuls les déclencheurs se suspendent et se reprennent." }
references:
  - title: Configure and edit Lakeflow Jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-job
