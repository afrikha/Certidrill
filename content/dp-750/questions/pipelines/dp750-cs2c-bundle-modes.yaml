id: dp750-cs2c-bundle-modes
objective: "4.3.4"
type: yesno_statements
caseStudy: dp750-cs2c-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You review how the targets of the fc-sales bundle behave when the bundle is deployed with the Azure Databricks CLI. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le comportement des cibles du bundle fc-sales quand le bundle est déployé avec l'interface de ligne de commande Azure Databricks. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a developer runs `databricks bundle deploy -t dev`, the deployed job name starts with `[dev ` followed by the developer's short user name, and the schedule of the job is paused.
        fr: Quand un développeur exécute `databricks bundle deploy -t dev`, le nom du job déployé commence par `[dev ` suivi du nom d'utilisateur court du développeur, et la planification du job est suspendue.
    - id: s2
      text:
        en: Running `databricks bundle deploy -t prod --cluster-id <cluster-id>` deploys fc_nightly_sales so that its tasks run on the existing compute that has that ID.
        fr: L'exécution de `databricks bundle deploy -t prod --cluster-id <cluster-id>` déploie fc_nightly_sales de sorte que ses tâches s'exécutent sur le calcul existant qui porte cet ID.
    - id: s3
      text:
        en: When the release pipeline runs `databricks bundle deploy -t prod` from a feature branch, the deployment fails the Git branch validation unless the command adds `--force`.
        fr: Quand le pipeline de mise en production exécute `databricks bundle deploy -t prod` depuis une branche de fonctionnalité, le déploiement échoue à la validation de la branche Git, sauf si la commande ajoute `--force`.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "In development mode, resource names get the prefix `[dev ${workspace.current_user.short_name}]` and all schedules and triggers are paused, so each developer deploys an isolated copy. Production mode does not allow overriding cluster definitions with `--cluster-id` or the `cluster_id` mapping. Production mode also validates that the current Git branch matches the branch set in the target; `--force` overrides this check."
    fr: "En mode développement, les noms des ressources reçoivent le préfixe `[dev ${workspace.current_user.short_name}]` et toutes les planifications et tous les déclencheurs sont suspendus : chaque développeur déploie ainsi une copie isolée. Le mode production n'autorise pas le remplacement des définitions de cluster avec `--cluster-id` ou le mappage `cluster_id`. Le mode production vérifie aussi que la branche Git actuelle correspond à la branche définie dans la cible ; `--force` contourne cette vérification."
references:
  - title: Declarative Automation Bundles deployment modes
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
