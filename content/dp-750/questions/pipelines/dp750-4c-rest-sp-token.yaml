id: dp750-4c-rest-sp-token
objective: "4.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses a release tool that can only send HTTPS requests. After a Databricks Asset Bundle is deployed, the tool must call the Azure Databricks Jobs API of the workspace `https://adb-1234567890123456.7.azuredatabricks.net` to start the deployed jobs.

    The calls must authenticate as a Databricks service principal named **sp-release**, which has an OAuth secret. No user credential can be used.

    How should the tool obtain the token that it sends in the `Authorization: Bearer` header?
  fr: |
    Contoso utilise un outil de mise en production qui ne peut envoyer que des requêtes HTTPS. Après le déploiement d'un bundle de ressources Databricks, l'outil doit appeler l'API Jobs Azure Databricks de l'espace de travail `https://adb-1234567890123456.7.azuredatabricks.net` pour démarrer les jobs déployés.

    Les appels doivent s'authentifier en tant que principal de service Databricks nommé **sp-release**, qui dispose d'un secret OAuth. Aucune information d'identification d'utilisateur ne peut être utilisée.

    Comment l'outil doit-il obtenir le jeton qu'il envoie dans l'en-tête `Authorization: Bearer` ?
body:
  options:
    - { id: a, text: { en: "Run OAuth user-to-machine (U2M) sign-in with the Databricks CLI on the release server, and reuse its token", fr: "Lancer la connexion OAuth utilisateur à machine (U2M) avec l'interface CLI Databricks sur le serveur de mise en production, et réutiliser son jeton" } }
    - { id: b, text: { en: "Generate a personal access token for the release manager's user account, and store it in the release tool", fr: "Générer un jeton d'accès personnel pour le compte d'utilisateur du responsable des mises en production, et le stocker dans l'outil de mise en production" } }
    - { id: c, text: { en: "Send the client ID of sp-release directly as the bearer token of each request to the Jobs API", fr: "Envoyer directement l'ID client de sp-release comme jeton du porteur de chaque requête à l'API Jobs" } }
    - { id: d, text: { en: "Request a token from the workspace /oidc/v1/token endpoint by using the client ID and secret of sp-release", fr: "Demander un jeton au point de terminaison /oidc/v1/token de l'espace de travail avec l'ID client et le secret de sp-release" } }
answer: { optionId: d }
explanation:
  correct:
    en: "With OAuth machine-to-machine (M2M) authentication, a tool that doesn't support unified authentication posts `grant_type=client_credentials&scope=all-apis` to `https://<databricks-instance>/oidc/v1/token`, authenticating with the service principal's client ID and OAuth secret. The response contains a bearer access token valid for one hour, which the tool passes in the `Authorization` header."
    fr: "Avec l'authentification OAuth machine à machine (M2M), un outil qui ne prend pas en charge l'authentification unifiée envoie `grant_type=client_credentials&scope=all-apis` à `https://<databricks-instance>/oidc/v1/token`, en s'authentifiant avec l'ID client et le secret OAuth du principal de service. La réponse contient un jeton d'accès du porteur valide une heure, que l'outil transmet dans l'en-tête `Authorization`."
  options:
    b: { en: "A personal access token belongs to a user, which the requirement forbids; automation should use a service principal.", fr: "Un jeton d'accès personnel appartient à un utilisateur, ce que l'exigence interdit ; l'automatisation doit utiliser un principal de service." }
    c: { en: "The client ID identifies the service principal but isn't a token; it must be exchanged with the secret for an access token.", fr: "L'ID client identifie le principal de service mais n'est pas un jeton ; il doit être échangé avec le secret contre un jeton d'accès." }
    a: { en: "U2M is an interactive sign-in of a user in a browser, not an authentication of the service principal.", fr: "U2M est une connexion interactive d'un utilisateur dans un navigateur, pas une authentification du principal de service." }
references:
  - title: Authorize service principal access to Azure Databricks with OAuth
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/auth/oauth-m2m
