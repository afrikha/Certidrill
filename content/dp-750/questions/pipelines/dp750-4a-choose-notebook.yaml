id: dp750-4a-choose-notebook
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a nightly Lakeflow job that refreshes the tables of a pipeline in the catalog **woodgrove_fx**.

    You need to add a step that runs before the pipeline. The step must call a partner REST API to download the day's exchange rates, write the response as a JSON file to **/Volumes/woodgrove_fx/landing/rates/**, and post a message with the number of rates to a team chat webhook.

    What should you use for this step?
  fr: |
    Woodgrove Bank dispose d'un job Lakeflow nocturne qui actualise les tables d'un pipeline du catalogue **woodgrove_fx**.

    Vous devez ajouter une étape qui s'exécute avant le pipeline. L'étape doit appeler l'API REST d'un partenaire pour télécharger les taux de change du jour, écrire la réponse sous forme de fichier JSON dans **/Volumes/woodgrove_fx/landing/rates/** et publier un message indiquant le nombre de taux sur le webhook d'une conversation d'équipe.

    Que devez-vous utiliser pour cette étape ?
body:
  options:
    - id: a
      text: { en: "A Python file that defines a @dp.table function in the pipeline", fr: "Un fichier Python qui définit une fonction @dp.table dans le pipeline" }
    - id: b
      text: { en: "A materialized view that is defined in the pipeline", fr: "Une vue matérialisée définie dans le pipeline" }
    - id: c
      text: { en: "A Python notebook that runs as a Notebook task in the job", fr: "Un notebook Python exécuté comme tâche Notebook dans le job" }
    - id: d
      text: { en: "A SQL task that runs on a serverless SQL warehouse", fr: "Une tâche SQL exécutée sur un entrepôt SQL serverless" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Calling an external API, writing a file and posting a message are side effects that imperative Python code handles. A notebook task in the same job can run first, and the pipeline task can depend on it.
    fr: |
      Appeler une API externe, écrire un fichier et publier un message sont des effets de bord que gère du code Python impératif. Une tâche notebook du même job peut s'exécuter en premier, et la tâche de pipeline peut en dépendre.
  options:
    a:
      en: |
        A dataset function must only return a DataFrame; the pipeline evaluates it several times, and it must not write files or perform other side effects.
      fr: |
        Une fonction de jeu de données doit seulement renvoyer un DataFrame ; le pipeline l'évalue plusieurs fois, et elle ne doit ni écrire de fichiers ni produire d'autres effets de bord.
    b:
      en: |
        A materialized view stores the result of a query; it can't call an API or post a message.
      fr: |
        Une vue matérialisée stocke le résultat d'une requête ; elle ne peut ni appeler une API ni publier un message.
    d:
      en: |
        A SQL task runs queries on a warehouse; it can't call a REST API or post to a webhook.
      fr: |
        Une tâche SQL exécute des requêtes sur un entrepôt ; elle ne peut ni appeler une API REST ni publier sur un webhook.
references:
  - title: Lakeflow pipelines Python language reference
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/developer/python-ref
  - title: Notebook task for jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/tasks/notebook
