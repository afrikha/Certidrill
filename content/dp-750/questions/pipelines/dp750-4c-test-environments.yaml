id: dp750-4c-test-environments
objective: "4.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is defining the testing strategy of a claims pipeline in Azure Databricks. The strategy includes the four test types of the testing pyramid. Production tables are in the `adatum_prod` catalog and contain sensitive data.

    Which data or environment should each test type use? To answer, drag the appropriate data sources to the correct test types. Each data source may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum définit la stratégie de test d'un pipeline de sinistres dans Azure Databricks. La stratégie comprend les quatre types de tests de la pyramide des tests. Les tables de production se trouvent dans le catalogue `adatum_prod` et contiennent des données sensibles.

    Quelles données ou quel environnement chaque type de test doit-il utiliser ? Pour répondre, faites glisser les sources de données appropriées vers les types de tests correspondants. Chaque source de données peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fixture, text: { en: "Synthetic data created in memory by a pytest fixture", fr: "Données synthétiques créées en mémoire par une fixture pytest" } }
    - { id: testcat, text: { en: "A dedicated test catalog with representative, non-sensitive samples", fr: "Un catalogue de test dédié avec des échantillons représentatifs et non sensibles" } }
    - { id: files, text: { en: "Test input files processed by the complete workflow", fr: "Des fichiers d'entrée de test traités par le workflow complet" } }
    - { id: staging, text: { en: "A staging environment that mirrors production, used by business stakeholders", fr: "Un environnement intermédiaire identique à la production, utilisé par les parties prenantes métier" } }
    - { id: prod, text: { en: "The production tables of adatum_prod", fr: "Les tables de production d'adatum_prod" } }
  targets:
    - { id: unit, text: { en: "Unit tests", fr: "Tests unitaires" } }
    - { id: integration, text: { en: "Integration tests", fr: "Tests d'intégration" } }
    - { id: e2e, text: { en: "End-to-end tests", fr: "Tests de bout en bout" } }
    - { id: uat, text: { en: "User acceptance testing (UAT)", fr: "Tests d'acceptation utilisateur (UAT)" } }
answer:
  mapping: { unit: fixture, integration: testcat, e2e: files, uat: staging }
explanation:
  correct:
    en: "Unit tests check one function in isolation with reusable synthetic data from fixtures. Integration tests run on real Azure Databricks resources in dedicated test catalogs or schemas. End-to-end tests set up test input files, run the whole workflow, verify the output, and clean up. UAT lets stakeholders run business scenarios in a staging environment that mirrors production. No test type should run against the sensitive production tables."
    fr: "Les tests unitaires vérifient une fonction isolément avec des données synthétiques réutilisables issues de fixtures. Les tests d'intégration s'exécutent sur des ressources Azure Databricks réelles, dans des catalogues ou des schémas de test dédiés. Les tests de bout en bout préparent des fichiers d'entrée de test, exécutent tout le workflow, vérifient la sortie, puis nettoient. L'UAT permet aux parties prenantes d'exécuter des scénarios métier dans un environnement intermédiaire identique à la production. Aucun type de test ne doit s'exécuter sur les tables de production sensibles."
  options:
    prod: { en: "Tests must use separate environments with production-like structure and no sensitive information, never production tables.", fr: "Les tests doivent utiliser des environnements distincts, de structure similaire à la production et sans informations sensibles, jamais les tables de production." }
references:
  - title: Implement testing strategy
    url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy
