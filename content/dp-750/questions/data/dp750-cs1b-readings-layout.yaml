id: dp750-cs1b-readings-layout
objective: "3.1.9"
type: single
caseStudy: dp750-cs1b-city-power-light
difficulty: 1
status: draft
stem:
  en: |
    You need to change the data layout of grid.silver.readings. The solution must meet the table layout requirements.

    Which statement should you run?
  fr: |
    Vous devez modifier la disposition des données de grid.silver.readings. La solution doit respecter les exigences de disposition des tables.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: cluster, text: "ALTER TABLE grid.silver.readings CLUSTER BY (meter_id, reading_date);" }
    - { id: zorder, text: "OPTIMIZE grid.silver.readings ZORDER BY (meter_id, reading_date);" }
    - { id: partition, text: "CREATE OR REPLACE TABLE grid.silver.readings PARTITIONED BY (reading_date) AS SELECT * FROM grid.silver.readings;" }
    - { id: vacuum, text: "VACUUM grid.silver.readings RETAIN 168 HOURS;" }
answer: { optionId: cluster }
explanation:
  correct:
    en: |
      Liquid clustering replaces partitioning and ZORDER, suits filters on high-cardinality columns such as meter_id, and can be enabled on an existing unpartitioned Delta table with ALTER TABLE ... CLUSTER BY. The clustering keys can later be redefined, for example to add feeder_id, without rewriting the existing data.
    fr: |
      Le clustering liquide (liquid clustering) remplace le partitionnement et ZORDER, convient aux filtres sur des colonnes à forte cardinalité comme meter_id et peut être activé sur une table Delta non partitionnée existante avec ALTER TABLE ... CLUSTER BY. Les clés de clustering peuvent ensuite être redéfinies, par exemple pour ajouter feeder_id, sans réécrire les données existantes.
  options:
    zorder: { en: "Liquid clustering replaces ZORDER; only clustering keys can be redefined without rewriting the existing data.", fr: "Le clustering liquide remplace ZORDER ; seules les clés de clustering peuvent être redéfinies sans réécrire les données existantes." }
    partition: { en: "Partitioning doesn't help filters on meter_id, and changing the partition column later requires rewriting the whole table.", fr: "Le partitionnement n'aide pas les filtres sur meter_id, et changer plus tard la colonne de partition impose de réécrire toute la table." }
    vacuum: { en: "VACUUM deletes data files that the table no longer references; it doesn't change the data layout.", fr: "VACUUM supprime les fichiers de données que la table ne référence plus ; il ne modifie pas la disposition des données." }
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
