status: draft
stem:
  en: You create the table partitioned by event date and clustered by device_id.
  fr: Vous créez la table partitionnée par date d'événement avec un clustering sur device_id.
body:
  solution:
    en: |
      You run the following statement:

      ```sql
      CREATE TABLE fabrikam.silver.device_events
      PARTITIONED BY (event_date)
      CLUSTER BY (device_id)
      AS SELECT *, CAST(event_ts AS DATE) AS event_date
      FROM fabrikam.staging.device_events;
      ```
    fr: |
      Vous exécutez l'instruction suivante :

      ```sql
      CREATE TABLE fabrikam.silver.device_events
      PARTITIONED BY (event_date)
      CLUSTER BY (device_id)
      AS SELECT *, CAST(event_ts AS DATE) AS event_date
      FROM fabrikam.staging.device_events;
      ```
answer: { value: false }
explanation:
  correct:
    en: Liquid clustering replaces partitioning and ZORDER and is not compatible with them, so a table cannot be both partitioned and clustered. To cover both filters, `device_id` and `event_ts` must both be clustering keys of an unpartitioned table.
    fr: "Le clustering liquide remplace le partitionnement et ZORDER et n'est pas compatible avec eux : une table partitionnée ne peut pas utiliser le clustering liquide. Pour couvrir les deux filtres, `device_id` et `event_ts` doivent tous deux être des clés de clustering d'une table non partitionnée."
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
