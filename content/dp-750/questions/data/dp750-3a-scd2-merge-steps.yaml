id: dp750-3a-scd2-merge-steps
objective: "3.1.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam chose SCD Type 2 for the dimension **fabrikam.gold.dim_supplier**. The table is loaded by a SQL notebook from the staging table **fabrikam.staging.suppliers**, without Lakeflow Spark Declarative Pipelines. Fact tables must reference each supplier version through a surrogate key.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam a choisi SCD Type 2 pour la dimension **fabrikam.gold.dim_supplier**. La table est chargée par un notebook SQL à partir de la table intermédiaire **fabrikam.staging.suppliers**, sans Lakeflow Spark Declarative Pipelines. Les tables de faits doivent référencer chaque version de fournisseur au moyen d'une clé de substitution.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create the table with a `GENERATED ALWAYS AS IDENTITY` surrogate key and `valid_from`, `valid_to` and `is_current` columns.", fr: "Créer la table avec une clé de substitution `GENERATED ALWAYS AS IDENTITY` et des colonnes `valid_from`, `valid_to` et `is_current`." } }
    - { id: merge, text: { en: "Run a MERGE that closes the current version of each changed supplier and inserts new suppliers.", fr: "Exécuter un MERGE qui clôt la version actuelle de chaque fournisseur modifié et insère les nouveaux fournisseurs." } }
    - { id: insert, text: { en: "Insert a new current version for each supplier whose current version was just closed.", fr: "Insérer une nouvelle version actuelle pour chaque fournisseur dont la version actuelle vient d'être clôturée." } }
    - { id: update, text: { en: "Run an UPDATE that overwrites the changed attributes of the current rows.", fr: "Exécuter un UPDATE qui écrase les attributs modifiés des lignes actuelles." } }
    - { id: vacuum, text: { en: "Run VACUUM to remove the previous versions of the rows.", fr: "Exécuter VACUUM pour supprimer les versions précédentes des lignes." } }
    - { id: truncate, text: { en: "Truncate the dimension table before each load.", fr: "Tronquer la table de dimension avant chaque chargement." } }
answer:
  sequence: [ create, merge, insert ]
explanation:
  correct:
    en: |
      The table needs an identity surrogate key and validity columns before any load. The MERGE matches staged rows with current versions, sets `valid_to` and `is_current = false` on changed rows and inserts unknown suppliers in one transaction. A following INSERT adds the new current version of each supplier whose previous version was closed.
    fr: |
      La table a besoin d'une clé de substitution d'identité et de colonnes de validité avant tout chargement. Le MERGE rapproche les lignes intermédiaires des versions actuelles, définit `valid_to` et `is_current = false` sur les lignes modifiées et insère les fournisseurs inconnus dans une seule transaction. Un INSERT suivant ajoute la nouvelle version actuelle de chaque fournisseur dont la version précédente a été clôturée.
  options:
    update:
      en: |
        Overwriting attributes in place is SCD Type 1 and loses the history.
      fr: |
        Écraser les attributs sur place correspond à SCD Type 1 et fait perdre l'historique.
    vacuum:
      en: |
        VACUUM removes unreferenced data files; it does not manage dimension versions, and removing history defeats SCD Type 2.
      fr: |
        VACUUM supprime les fichiers de données non référencés ; il ne gère pas les versions de dimension, et supprimer l'historique va à l'encontre de SCD Type 2.
    truncate:
      en: |
        Truncating the table deletes all previous versions.
      fr: |
        Tronquer la table supprime toutes les versions précédentes.
references:
  - title: Implement a slowly changing dimension (SCD) type 2
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/7-implement-slowly-changing-dimension-type-2
