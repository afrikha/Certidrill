id: dp750-cs3b-booking-types
objective: "3.3.2"
type: dropdown
caseStudy: dp750-cs3b-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You need to create mt_prod.silver.bookings to meet bookings table requirements 1, 2 and 3.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer mt_prod.silver.bookings pour satisfaire les exigences 1, 2 et 3 de la table des réservations.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE mt_prod.silver.bookings (
      booking_id  STRING NOT NULL,
      hotel_id    STRING,
      customer_id STRING,
      check_in    [[ci]],
      nights      INT,
      amount      [[amt]],
      currency    STRING,
      status      STRING,
      change_ts   TIMESTAMP
    );

    ALTER TABLE mt_prod.silver.bookings
      ADD [[chk]];
  slots:
    - id: ci
      options:
        - { id: ntz, text: TIMESTAMP_NTZ }
        - { id: ts, text: TIMESTAMP }
        - { id: date, text: DATE }
    - id: amt
      options:
        - { id: dec, text: "DECIMAL(12,2)" }
        - { id: dbl, text: DOUBLE }
        - { id: flt, text: FLOAT }
    - id: chk
      options:
        - { id: check, text: "CONSTRAINT valid_nights CHECK (nights BETWEEN 1 AND 60)" }
        - { id: expect, text: "CONSTRAINT valid_nights EXPECT (nights BETWEEN 1 AND 60)" }
        - { id: pk, text: "CONSTRAINT valid_nights PRIMARY KEY (booking_id)" }
answer:
  values: { ci: ntz, amt: dec, chk: check }
explanation:
  correct:
    en: |
      TIMESTAMP_NTZ stores the year, month, day, hour, minute and second without any time zone, so the voucher's local check-in time is kept as is whatever the session time zone. DECIMAL(12,2) is an exact type with two decimal places, unlike the binary floating-point types. A CHECK constraint is enforced by Delta Lake: a write that contains a violating row fails with an error.
    fr: |
      TIMESTAMP_NTZ stocke l'année, le mois, le jour, l'heure, la minute et la seconde sans aucun fuseau horaire : l'heure d'arrivée locale du bon d'échange est conservée telle quelle, quel que soit le fuseau horaire de la session. DECIMAL(12,2) est un type exact à deux décimales, contrairement aux types à virgule flottante binaire. Une contrainte CHECK est appliquée par Delta Lake : une écriture qui contient une ligne non conforme échoue avec une erreur.
  options:
    ts: { en: "TIMESTAMP represents an instant that is displayed in the session time zone, so the value read depends on that setting.", fr: "TIMESTAMP représente un instant affiché dans le fuseau horaire de la session : la valeur lue dépend de ce paramètre." }
    date: { en: "DATE loses the check-in time.", fr: "DATE perd l'heure d'arrivée." }
    dbl: { en: "DOUBLE is an approximate floating-point type that can introduce rounding errors.", fr: "DOUBLE est un type approché à virgule flottante qui peut introduire des erreurs d'arrondi." }
    flt: { en: "FLOAT is an approximate single-precision type, even less suited to amounts than DOUBLE.", fr: "FLOAT est un type approché simple précision, encore moins adapté aux montants que DOUBLE." }
    expect: { en: "EXPECT defines an expectation in a Lakeflow pipeline dataset; it is not a constraint of ALTER TABLE.", fr: "EXPECT définit une attente dans un jeu de données de pipeline Lakeflow ; ce n'est pas une contrainte d'ALTER TABLE." }
    pk: { en: "Primary key constraints are informational only, and this one does not check the number of nights.", fr: "Les contraintes de clé primaire sont uniquement informatives, et celle-ci ne vérifie pas le nombre de nuits." }
references:
  - title: TIMESTAMP_NTZ type
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/data-types/timestamp-ntz-type
  - title: Constraints on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/constraints
