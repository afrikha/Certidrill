id: dp750-3d-quarantine-pattern
objective: "3.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a Lakeflow Spark Declarative Pipelines pipeline whose Python source reads the streaming source **proseware.bronze.claims**. A dictionary named `rules` holds the validation rules, and the columns that the rules use are never null.

    You need to meet the following requirements:

    - The table claims_clean must contain only the claims that pass every rule.
    - The claims that fail at least one rule must be kept in the table claims_quarantine for review.
    - Pipeline updates must not stop because of invalid claims.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un pipeline Lakeflow Spark Declarative Pipelines dont la source Python lit la source de streaming **proseware.bronze.claims**. Un dictionnaire nommé `rules` contient les règles de validation, et les colonnes utilisées par les règles ne sont jamais null.

    Vous devez satisfaire les exigences suivantes :

    - La table claims_clean ne doit contenir que les déclarations de sinistre qui satisfont toutes les règles.
    - Les déclarations qui échouent à au moins une règle doivent être conservées dans la table claims_quarantine pour examen.
    - Les mises à jour du pipeline ne doivent pas s'arrêter à cause de déclarations non valides.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Define claims_clean with `@dp.expect_all_or_fail(rules)` on a read of proseware.bronze.claims."
        fr: "Définir claims_clean avec `@dp.expect_all_or_fail(rules)` sur une lecture de proseware.bronze.claims."
    - id: b
      text:
        en: "Define claims_quarantine with `@dp.expect_all(rules)` on a read of proseware.bronze.claims."
        fr: "Définir claims_quarantine avec `@dp.expect_all(rules)` sur une lecture de proseware.bronze.claims."
    - id: c
      text:
        en: "Define claims_clean with `@dp.expect_all_or_drop(rules)` on a read of proseware.bronze.claims."
        fr: "Définir claims_clean avec `@dp.expect_all_or_drop(rules)` sur une lecture de proseware.bronze.claims."
    - id: d
      text:
        en: "Define claims_quarantine as a read of proseware.bronze.claims filtered on `NOT (` + the rules joined with `AND` + `)`."
        fr: "Définir claims_quarantine comme une lecture de proseware.bronze.claims filtrée sur `NOT (` + les règles jointes par `AND` + `)`."
    - id: e
      text:
        en: "Define claims_clean with `@dp.expect_all(rules)` on a read of proseware.bronze.claims."
        fr: "Définir claims_clean avec `@dp.expect_all(rules)` sur une lecture de proseware.bronze.claims."
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      `expect_all_or_drop` removes every claim that violates at least one rule before the write, so claims_clean holds only valid claims, and the update continues. Expectations never route records elsewhere, so a second table reads the same source with the inverse condition, `NOT` of all the rules combined with `AND`, which keeps exactly the claims that fail at least one rule.
    fr: |
      `expect_all_or_drop` supprime avant l'écriture chaque déclaration qui viole au moins une règle : claims_clean ne contient que des déclarations valides, et la mise à jour continue. Les attentes ne redirigent jamais d'enregistrements ailleurs : une seconde table lit donc la même source avec la condition inverse, `NOT` de toutes les règles combinées par `AND`, ce qui conserve exactement les déclarations qui échouent à au moins une règle.
  options:
    a:
      en: |
        `expect_all_or_fail` stops the update at the first invalid claim, which the requirements forbid.
      fr: |
        `expect_all_or_fail` arrête la mise à jour à la première déclaration non valide, ce que les exigences interdisent.
    b:
      en: |
        A warn expectation keeps every record, so claims_quarantine would also contain all the valid claims.
      fr: |
        Une attente d'avertissement conserve tous les enregistrements : claims_quarantine contiendrait aussi toutes les déclarations valides.
    e:
      en: |
        A warn expectation writes the invalid claims to claims_clean and only counts them.
      fr: |
        Une attente d'avertissement écrit les déclarations non valides dans claims_clean et se contente de les compter.
references:
  - title: Expectation recommendations and advanced patterns
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectation-patterns
  - title: Manage data quality with pipeline expectations
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations
