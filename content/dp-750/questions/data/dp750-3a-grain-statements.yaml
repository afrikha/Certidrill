id: dp750-3a-grain-statements
objective: "3.1.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's data engineering team is debating whether to store sensor readings in **fabrikam.iot.fact_readings** at the atomic grain or at an aggregate grain.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe d'ingénierie des données de Fabrikam se demande s'il faut stocker les mesures des capteurs dans **fabrikam.iot.fact_readings** à la granularité atomique ou à une granularité agrégée.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Aggregate rows can always be produced later from atomic rows.", fr: "Des lignes agrégées peuvent toujours être produites ultérieurement à partir de lignes atomiques." } }
    - { id: b, text: { en: "Atomic rows can be rebuilt later from a per-minute aggregate.", fr: "Des lignes atomiques peuvent être reconstruites ultérieurement à partir d'un agrégat par minute." } }
    - { id: c, text: { en: "Materialized views can maintain aggregate tables over the atomic table.", fr: "Des vues matérialisées peuvent maintenir des tables d'agrégats sur la table atomique." } }
    - { id: d, text: { en: "A finer grain reduces the storage and compute costs of the table.", fr: "Une granularité plus fine réduit les coûts de stockage et de calcul de la table." } }
    - { id: e, text: { en: "The grain of a dimension table can be chosen independently of the fact table grain.", fr: "La granularité d'une table de dimension peut être choisie indépendamment de celle de la table de faits." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The atomic grain gives maximum flexibility because you can always aggregate up, and many teams keep it while adding aggregate tables, which materialized views can maintain automatically, to speed up common queries.
    fr: |
      La granularité atomique offre une flexibilité maximale, car il est toujours possible d'agréger, et de nombreuses équipes la conservent tout en ajoutant des tables d'agrégats, que des vues matérialisées peuvent maintenir automatiquement, pour accélérer les requêtes courantes.
  options:
    b:
      en: |
        Once detail is lost through aggregation, it cannot be recovered.
      fr: |
        Un détail perdu par agrégation ne peut pas être récupéré.
    d:
      en: |
        A finer grain means more rows, which increases storage and compute costs.
      fr: |
        Une granularité plus fine implique davantage de lignes, ce qui augmente les coûts de stockage et de calcul.
    e:
      en: |
        The dimension grain must align with the fact grain so that each fact can find the dimension row or version it references.
      fr: |
        La granularité de la dimension doit s'aligner sur celle des faits, afin que chaque fait retrouve la ligne ou la version de dimension qu'il référence.
references:
  - title: Choose granularity on a column or table based on requirements
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/9-choose-granularity
