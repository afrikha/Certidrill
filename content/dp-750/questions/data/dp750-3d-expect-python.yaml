id: dp750-3d-expect-python
objective: "3.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys defines the streaming table **sales_lines_silver** in the Python source file of a Lakeflow Spark Declarative Pipelines pipeline. The table reads **tailspin.bronze.sales_lines**.

    You need to meet the following requirements:

    - A sales line without a `line_id` value means that the source extract is corrupt: the update must stop.
    - Sales lines that violate any rule of the `rules` dictionary must not be written to the table, and the pipeline must report how many were removed.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys définit la table de streaming **sales_lines_silver** dans le fichier source Python d'un pipeline Lakeflow Spark Declarative Pipelines. La table lit **tailspin.bronze.sales_lines**.

    Vous devez satisfaire les exigences suivantes :

    - Une ligne de vente sans valeur `line_id` signifie que l'extrait source est corrompu : la mise à jour doit s'arrêter.
    - Les lignes de vente qui violent une règle du dictionnaire `rules` ne doivent pas être écrites dans la table, et le pipeline doit indiquer combien ont été supprimées.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from pyspark import [[module]] as dp

    rules = {
        "valid_qty": "quantity BETWEEN 1 AND 1000",
        "valid_price": "unit_price > 0",
    }

    @dp.table(comment="Validated sales lines")
    @dp.[[fail]]("valid_line_id", "line_id IS NOT NULL")
    @dp.[[drop]](rules)
    def sales_lines_silver():
        return spark.readStream.table("tailspin.bronze.sales_lines")
  slots:
    - id: module
      options:
        - { id: sql, text: sql }
        - { id: pipelines, text: pipelines }
        - { id: streaming, text: streaming }
    - id: fail
      options:
        - { id: expect, text: expect }
        - { id: allfail, text: expect_all_or_fail }
        - { id: orfail, text: expect_or_fail }
    - id: drop
      options:
        - { id: alldrop, text: expect_all_or_drop }
        - { id: ordrop, text: expect_or_drop }
        - { id: all, text: expect_all }
answer:
  values: { module: pipelines, fail: orfail, drop: alldrop }
explanation:
  correct:
    en: |
      The current Python module of Lakeflow Spark Declarative Pipelines is imported with `from pyspark import pipelines as dp`. `expect_or_fail` takes one name and one constraint and stops the update when a record violates it. `expect_all_or_drop` takes a dictionary of rules and drops every record that violates at least one of them; the dropped count appears in the data quality metrics.
    fr: |
      Le module Python actuel de Lakeflow Spark Declarative Pipelines s'importe avec `from pyspark import pipelines as dp`. `expect_or_fail` prend un nom et une contrainte et arrête la mise à jour quand un enregistrement la viole. `expect_all_or_drop` prend un dictionnaire de règles et supprime chaque enregistrement qui en viole au moins une ; le nombre d'enregistrements supprimés apparaît dans les métriques de qualité des données.
  options:
    sql:
      en: |
        `pyspark.sql` contains the DataFrame and SQL APIs, not the pipeline decorators.
      fr: |
        `pyspark.sql` contient les API DataFrame et SQL, pas les décorateurs de pipeline.
    streaming:
      en: |
        `pyspark.streaming` is the legacy DStream API, not the pipeline decorators.
      fr: |
        `pyspark.streaming` est l'API DStream héritée, pas les décorateurs de pipeline.
    expect:
      en: |
        `expect` only warns: the record is written and the update continues.
      fr: |
        `expect` ne fait qu'avertir : l'enregistrement est écrit et la mise à jour continue.
    allfail:
      en: |
        `expect_all_or_fail` takes a dictionary of rules, not a name and a constraint.
      fr: |
        `expect_all_or_fail` prend un dictionnaire de règles, pas un nom et une contrainte.
    ordrop:
      en: |
        `expect_or_drop` takes one name and one constraint, not a dictionary of rules.
      fr: |
        `expect_or_drop` prend un nom et une contrainte, pas un dictionnaire de règles.
    all:
      en: |
        `expect_all` keeps the invalid records in the table and only records metrics.
      fr: |
        `expect_all` conserve les enregistrements non valides dans la table et ne fait qu'enregistrer des métriques.
references:
  - title: Manage data quality with pipeline expectations
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations
  - title: Expectation recommendations and advanced patterns
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectation-patterns
