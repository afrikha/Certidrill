id: dp750-3a-copy-into-batch
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The analysts of Proseware work only in SQL. Each night, a partner drops a few hundred JSON files into **/Volumes/proseware/raw/partner_feed/**. The analysts choose a batch load with the `COPY INTO` statement into the Delta table **proseware.partners.bronze_feed**, scheduled in a Lakeflow job.

    Which two statements about this loading method are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Les analystes de Proseware travaillent uniquement en SQL. Chaque nuit, un partenaire dépose quelques centaines de fichiers JSON dans **/Volumes/proseware/raw/partner_feed/**. Les analystes choisissent un chargement par lots avec l'instruction `COPY INTO` vers la table Delta **proseware.partners.bronze_feed**, planifié dans un job Lakeflow.

    Quelles sont les deux affirmations vraies concernant cette méthode de chargement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Files that were already loaded are skipped when the statement runs again.", fr: "Les fichiers déjà chargés sont ignorés lorsque l'instruction s'exécute à nouveau." } }
    - { id: b, text: { en: "The statement needs a checkpoint location to track the files it has loaded.", fr: "L'instruction a besoin d'un emplacement de point de contrôle pour suivre les fichiers chargés." } }
    - { id: c, text: { en: "The statement can run from a query on a SQL warehouse.", fr: "L'instruction peut s'exécuter à partir d'une requête sur un entrepôt SQL." } }
    - { id: d, text: { en: "The statement keeps running and loads new files as soon as they arrive.", fr: "L'instruction reste active et charge les nouveaux fichiers dès leur arrivée." } }
    - { id: e, text: { en: "New columns in the files are added to the target table without setting any option.", fr: "Les nouvelles colonnes des fichiers sont ajoutées à la table cible sans définir aucune option." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "`COPY INTO` is retriable and idempotent: files already loaded are skipped on later runs, so it can be scheduled repeatedly. It runs from a notebook on a cluster or from a query on a SQL warehouse."
    fr: "`COPY INTO` peut être relancée et est idempotente : les fichiers déjà chargés sont ignorés lors des exécutions suivantes, ce qui permet de la planifier de façon répétée. Elle s'exécute depuis un notebook sur un cluster ou depuis une requête sur un entrepôt SQL."
  options:
    b:
      en: |
        Checkpoint locations belong to Structured Streaming and Auto Loader; `COPY INTO` tracks loaded files itself.
      fr: |
        Les emplacements de point de contrôle relèvent de Structured Streaming et d'Auto Loader ; `COPY INTO` suit lui-même les fichiers chargés.
    d:
      en: "`COPY INTO` is a batch operation that ends after it loads the available files; it runs when a schedule or a user triggers it."
      fr: "`COPY INTO` est une opération par lots qui se termine après avoir chargé les fichiers disponibles ; elle s'exécute lorsqu'une planification ou un utilisateur la déclenche."
    e:
      en: |
        Schema evolution requires `mergeSchema` set to `true` in `COPY_OPTIONS`.
      fr: |
        L'évolution du schéma nécessite de définir `mergeSchema` sur `true` dans `COPY_OPTIONS`.
references:
  - title: Get started using COPY INTO to load data
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/copy-into/
  - title: Choose a data ingestion tool
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/3-choose-data-ingestion-tool
