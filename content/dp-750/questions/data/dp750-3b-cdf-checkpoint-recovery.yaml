id: dp750-3b-cdf-checkpoint-recovery
objective: "3.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware keeps the history of the Delta table **proseware.sales.orders** in the append-only table **proseware.audit.orders_history**. A streaming query reads proseware.sales.orders with the readChangeFeed option and writes to the history table.

    The checkpoint of the query is corrupted. The history table contains all the changes up to and including version 75 of proseware.sales.orders, and the change data of version 76 and later is still retained.

    You need to resume the history without duplicate or missing changes. What should you do?
  fr: |
    Proseware conserve l'historique de la table Delta **proseware.sales.orders** dans la table en ajout seul **proseware.audit.orders_history**. Une requête de streaming lit proseware.sales.orders avec l'option readChangeFeed et écrit dans la table d'historique.

    Le point de contrôle de la requête est endommagé. La table d'historique contient toutes les modifications jusqu'à la version 75 incluse de proseware.sales.orders, et les données de modification de la version 76 et des suivantes sont toujours conservées.

    Vous devez reprendre l'historique sans modification en double ni manquante. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Restart the query with startingVersion set to 75 and a new checkpoint location.", fr: "Redémarrer la requête avec startingVersion défini sur 75 et un nouvel emplacement de point de contrôle." } }
    - { id: b, text: { en: "Restart the query with startingVersion set to 76 and the existing checkpoint location.", fr: "Redémarrer la requête avec startingVersion défini sur 76 et l'emplacement de point de contrôle existant." } }
    - { id: c, text: { en: "Restart the query without startingVersion and with a new checkpoint location.", fr: "Redémarrer la requête sans startingVersion et avec un nouvel emplacement de point de contrôle." } }
    - { id: d, text: { en: "Restart the query with startingVersion set to 76 and a new checkpoint location.", fr: "Redémarrer la requête avec startingVersion défini sur 76 et un nouvel emplacement de point de contrôle." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      To recover from a corrupted checkpoint, Microsoft Learn recommends setting startingVersion to the first version that the target hasn't processed and using a new checkpoint location. Version 75 is already in the history table, so the stream must start at version 76.
    fr: |
      Pour récupérer après un point de contrôle endommagé, Microsoft Learn recommande de définir startingVersion sur la première version que la cible n'a pas traitée et d'utiliser un nouvel emplacement de point de contrôle. La version 75 figure déjà dans la table d'historique : le flux doit donc commencer à la version 76.
  options:
    a:
      en: |
        Starting versions are inclusive, so the changes of version 75 would be written twice.
      fr: |
        Les versions de départ sont incluses : les modifications de la version 75 seraient écrites deux fois.
    b:
      en: |
        Starting options apply only to new queries; with the existing checkpoint, the query would still try to resume from the corrupted state.
      fr: |
        Les options de départ ne s'appliquent qu'aux nouvelles requêtes ; avec le point de contrôle existant, la requête tenterait toujours de reprendre à partir de l'état endommagé.
    c:
      en: |
        Without a starting version, a new change feed stream first returns the whole current table as inserts, which duplicates rows in the history table.
      fr: |
        Sans version de départ, un nouveau flux de modifications renvoie d'abord toute la table actuelle sous forme d'insertions, ce qui duplique des lignes dans la table d'historique.
references:
  - title: Use change data feed on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/delta-change-data-feed
