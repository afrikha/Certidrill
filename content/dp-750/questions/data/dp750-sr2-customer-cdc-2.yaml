id: dp750-sr2-customer-cdc-2
objective: "3.2.4"
type: series_yesno
series: dp750-sr2-customer-cdc
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You use a streaming table that filters out the DELETE rows.
  fr: Vous utilisez une table de streaming qui exclut les lignes DELETE.
body:
  solution:
    en: |
      You add the following code to the pipeline.

      ```sql
      CREATE OR REFRESH STREAMING TABLE customers AS
      SELECT * EXCEPT (operation, event_ts)
      FROM stream(nw_prod.bronze.customers_cdc)
      WHERE operation <> 'DELETE';
      ```
    fr: |
      Vous ajoutez le code suivant au pipeline.

      ```sql
      CREATE OR REFRESH STREAMING TABLE customers AS
      SELECT * EXCEPT (operation, event_ts)
      FROM stream(nw_prod.bronze.customers_cdc)
      WHERE operation <> 'DELETE';
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      A streaming table defined this way only appends each new source row. Every insert and update becomes an additional row, so a customer can appear several times, and the earlier rows of a deleted customer stay in the table because the filter only skips the `DELETE` event itself. Applying changes by key, in `event_ts` order, requires an `AUTO CDC` flow.
    fr: |
      Une table de streaming définie de cette façon ajoute uniquement chaque nouvelle ligne source. Chaque insertion et chaque mise à jour devient une ligne supplémentaire : un client peut apparaître plusieurs fois, et les lignes antérieures d'un client supprimé restent dans la table, car le filtre ignore seulement l'événement `DELETE` lui-même. Pour appliquer les modifications par clé, dans l'ordre de `event_ts`, il faut un flux `AUTO CDC`.
references:
  - title: "The AUTO CDC APIs: Simplify change data capture with pipelines"
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/cdc
