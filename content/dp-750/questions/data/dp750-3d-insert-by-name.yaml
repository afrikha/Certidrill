id: dp750-3d-insert-by-name
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a Delta table named **adatum.silver.customers**. A new extract table named **adatum.staging.customer_extract** contains the same columns with the same data types, but in a different order.

    The statement `INSERT INTO adatum.silver.customers SELECT * FROM adatum.staging.customer_extract` writes values into the wrong columns.

    You need to append the extract rows so that each value lands in the column of the same name. The existing rows must be kept.

    What should you do?
  fr: |
    Adatum dispose d'une table Delta nommée **adatum.silver.customers**. Une nouvelle table d'extrait nommée **adatum.staging.customer_extract** contient les mêmes colonnes avec les mêmes types de données, mais dans un ordre différent.

    L'instruction `INSERT INTO adatum.silver.customers SELECT * FROM adatum.staging.customer_extract` écrit des valeurs dans les mauvaises colonnes.

    Vous devez ajouter les lignes de l'extrait pour que chaque valeur arrive dans la colonne de même nom. Les lignes existantes doivent être conservées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `BY NAME` after the target table name.", fr: "Ajouter `BY NAME` après le nom de la table cible." } }
    - { id: b, text: { en: "Add `WITH SCHEMA EVOLUTION` after `INSERT`.", fr: "Ajouter `WITH SCHEMA EVOLUTION` après `INSERT`." } }
    - { id: c, text: { en: "Replace `INSERT INTO` with `INSERT OVERWRITE`.", fr: "Remplacer `INSERT INTO` par `INSERT OVERWRITE`." } }
    - { id: d, text: { en: "Add `REPLACE USING (customer_id)` after the target table name.", fr: "Ajouter `REPLACE USING (customer_id)` après le nom de la table cible." } }
answer:
  optionId: a
explanation:
  correct:
    en: |
      Without a column list, `INSERT` maps the query columns to the table columns by position. `INSERT INTO ... BY NAME` maps them by name instead, so the order of the query columns doesn't matter, and the rows are still appended.
    fr: |
      Sans liste de colonnes, `INSERT` associe les colonnes de la requête à celles de la table par position. `INSERT INTO ... BY NAME` les associe plutôt par nom : l'ordre des colonnes de la requête n'a plus d'importance, et les lignes sont toujours ajoutées.
  options:
    b:
      en: |
        Schema evolution adds new columns or widens types; it doesn't change how the columns are matched.
      fr: |
        L'évolution du schéma ajoute des colonnes ou élargit des types ; elle ne change pas la façon dont les colonnes sont associées.
    c:
      en: |
        `INSERT OVERWRITE` truncates the table, so the existing rows are lost, and the columns are still matched by position.
      fr: |
        `INSERT OVERWRITE` tronque la table : les lignes existantes sont perdues, et les colonnes sont toujours associées par position.
    d:
      en: |
        `REPLACE USING` deletes the existing rows whose `customer_id` appears in the extract, and it doesn't fix the positional mapping.
      fr: |
        `REPLACE USING` supprime les lignes existantes dont le `customer_id` figure dans l'extrait, et ne corrige pas l'association par position.
references:
  - title: INSERT
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-dml-insert-into
