id: dp750-3b-lc-no-changes
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses a Lakeflow Connect ingestion pipeline with an ingestion gateway to ingest the SQL Server table **dbo.orders** into the streaming table **adatum.bronze.orders**. The first run loaded a full snapshot of dbo.orders, and change capture was working.

    Since yesterday, the scheduled runs of the ingestion pipeline succeed, but rows updated in dbo.orders no longer change in adatum.bronze.orders.

    Which two issues could cause this?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise un pipeline d'ingestion Lakeflow Connect avec une passerelle d'ingestion pour ingérer la table SQL Server **dbo.orders** dans la table de streaming **adatum.bronze.orders**. La première exécution a chargé un instantané complet de dbo.orders, et la capture des modifications fonctionnait.

    Depuis hier, les exécutions planifiées du pipeline d'ingestion réussissent, mais les lignes mises à jour dans dbo.orders ne changent plus dans adatum.bronze.orders.

    Quels sont les deux problèmes qui peuvent en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The job that runs the ingestion gateway was stopped.", fr: "Le job qui exécute la passerelle d'ingestion a été arrêté." } }
    - { id: b, text: { en: "The ingestion pipeline runs on serverless compute.", fr: "Le pipeline d'ingestion s'exécute sur du calcul serverless." } }
    - { id: c, text: { en: "Change tracking was disabled on dbo.orders in SQL Server.", fr: "Le suivi des modifications a été désactivé sur dbo.orders dans SQL Server." } }
    - { id: d, text: { en: "The destination adatum.bronze.orders is a streaming table.", fr: "La destination adatum.bronze.orders est une table de streaming." } }
    - { id: e, text: { en: "The schedule of the ingestion pipeline runs it as a task of a Lakeflow Connect job.", fr: "La planification du pipeline d'ingestion l'exécute comme tâche d'un job Lakeflow Connect." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With a database connector, the ingestion gateway captures the changes continuously and stages them; the ingestion pipeline only applies what was staged, so it succeeds without new data when the gateway job is stopped. The connector relies on SQL Server change tracking or CDC to capture incremental changes, so disabling it on the source table stops the capture.
    fr: |
      Avec un connecteur de base de données, la passerelle d'ingestion capture les modifications en continu et les place dans le stockage intermédiaire ; le pipeline d'ingestion n'applique que ce qui a été placé : il réussit sans nouvelles données quand le job de la passerelle est arrêté. Le connecteur s'appuie sur le suivi des modifications ou la CDC de SQL Server pour capturer les modifications incrémentielles : les désactiver sur la table source arrête la capture.
  options:
    b:
      en: |
        Ingestion pipelines run on serverless compute by design.
      fr: |
        Les pipelines d'ingestion s'exécutent par conception sur du calcul serverless.
    d:
      en: |
        Lakeflow Connect always writes to streaming tables.
      fr: |
        Lakeflow Connect écrit toujours dans des tables de streaming.
    e:
      en: |
        Each schedule creates a Lakeflow Connect job with the pipeline as a task; this is the normal behavior.
      fr: |
        Chaque planification crée un job Lakeflow Connect avec le pipeline comme tâche ; c'est le comportement normal.
references:
  - title: Lakeflow Connect connector concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/
  - title: Microsoft SQL Server ingestion connector
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/sql-server-overview
