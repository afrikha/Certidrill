id: dp750-3c-null-dropna-subset
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders loads supplier contacts into a PySpark DataFrame named **df** with the columns **supplier_id**, **name**, **email**, **phone** and **notes**. A contact is usable when it has an email address or a phone number. The **notes** column is often null.

    You need to remove only the rows in which both **email** and **phone** are null before you write to **northwind.silver.supplier_contacts**.

    Which method call should you use?
  fr: |
    Northwind Traders charge les contacts fournisseurs dans un DataFrame PySpark nommé **df** avec les colonnes **supplier_id**, **name**, **email**, **phone** et **notes**. Un contact est utilisable lorsqu'il possède une adresse e-mail ou un numéro de téléphone. La colonne **notes** est souvent null.

    Vous devez supprimer uniquement les lignes dans lesquelles **email** et **phone** sont tous deux null avant d'écrire dans **northwind.silver.supplier_contacts**.

    Quel appel de méthode devez-vous utiliser ?
body:
  options:
    - { id: a, text: "df.dropna(subset=[\"email\", \"phone\"])" }
    - { id: b, text: "df.dropna(how=\"all\", subset=[\"email\", \"phone\"])" }
    - { id: c, text: "df.dropna(how=\"all\")" }
    - { id: d, text: "df.dropna(thresh=2)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `how="all"`, `dropna` drops a row only if all the considered values are null, and `subset` limits the check to **email** and **phone**. A contact with only one of the two values is kept, whatever the value of **notes**.
    fr: |
      Avec `how="all"`, `dropna` ne supprime une ligne que si toutes les valeurs examinées sont null, et `subset` limite la vérification à **email** et **phone**. Un contact qui n'a qu'une des deux valeurs est conservé, quelle que soit la valeur de **notes**.
  options:
    a:
      en: |
        The default `how="any"` drops a row as soon as one of the listed columns is null, so contacts with only an email or only a phone are removed.
      fr: |
        La valeur par défaut `how="any"` supprime une ligne dès que l'une des colonnes listées est null : les contacts qui n'ont qu'un e-mail ou qu'un téléphone sont supprimés.
    c:
      en: |
        Without a subset, the row is dropped only when every column is null, which never happens while supplier_id and name are set.
      fr: |
        Sans subset, la ligne n'est supprimée que si toutes les colonnes sont null, ce qui n'arrive jamais tant que supplier_id et name sont renseignés.
    d:
      en: "`thresh=2` keeps every row with at least two non-null values in any columns, so a row with supplier_id and name but no email or phone is kept."
      fr: "`thresh=2` conserve toute ligne qui a au moins deux valeurs non null dans n'importe quelles colonnes : une ligne avec supplier_id et name mais sans e-mail ni téléphone est conservée."
references:
  - title: dropna
    url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframe/dropna
