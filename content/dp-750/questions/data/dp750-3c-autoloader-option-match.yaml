id: dp750-3c-autoloader-option-match
objective: "3.2.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is writing the Python source of a Lakeflow Spark Declarative Pipeline. A streaming table uses `spark.readStream.format("cloudFiles")` to ingest JSON files from an external location in Azure Data Lake Storage. File events are enabled on the external location.

    Which Auto Loader option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys écrit le code source Python d'un pipeline Lakeflow Spark Declarative Pipelines. Une table de streaming utilise `spark.readStream.format("cloudFiles")` pour ingérer des fichiers JSON depuis un emplacement externe dans Azure Data Lake Storage. Les événements de fichiers sont activés sur l'emplacement externe.

    Quelle option Auto Loader devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hints, text: cloudFiles.schemaHints }
    - { id: infer, text: cloudFiles.inferColumnTypes }
    - { id: events, text: cloudFiles.useManagedFileEvents }
    - { id: existing, text: cloudFiles.includeExistingFiles }
    - { id: maxfiles, text: cloudFiles.maxFilesPerTrigger }
    - { id: overwrites, text: cloudFiles.allowOverwrites }
  targets:
    - id: t_types
      text: { en: "Infer numbers and dates with their real types instead of strings for every column", fr: "Inférer les nombres et les dates avec leur type réel plutôt qu'en chaînes pour toutes les colonnes" }
    - id: t_amount
      text: { en: "Force the amount column to DECIMAL(10,2) while the rest of the schema is inferred", fr: "Imposer DECIMAL(10,2) à la colonne amount tandis que le reste du schéma est inféré" }
    - id: t_discover
      text: { en: "Discover new files through the file events service instead of listing the directory", fr: "Découvrir les nouveaux fichiers au moyen du service d'événements de fichiers au lieu de lister le répertoire" }
    - id: t_new
      text: { en: "Skip the files that are already in the path when the stream starts for the first time", fr: "Ignorer les fichiers déjà présents dans le chemin lors du premier démarrage du flux" }
answer:
  mapping: { t_types: infer, t_amount: hints, t_discover: events, t_new: existing }
explanation:
  correct:
    en: |
      For JSON and CSV, Auto Loader infers every column as a string unless `cloudFiles.inferColumnTypes` is `true`. `cloudFiles.schemaHints` overrides the inferred type of the named columns only. `cloudFiles.useManagedFileEvents` discovers files through the file events service of an external location that has file events enabled. `cloudFiles.includeExistingFiles` set to `false` processes only files that arrive after the stream first starts.
    fr: |
      Pour JSON et CSV, Auto Loader infère toutes les colonnes en chaînes sauf si `cloudFiles.inferColumnTypes` vaut `true`. `cloudFiles.schemaHints` remplace le type inféré des seules colonnes nommées. `cloudFiles.useManagedFileEvents` découvre les fichiers au moyen du service d'événements de fichiers d'un emplacement externe sur lequel ils sont activés. `cloudFiles.includeExistingFiles` défini sur `false` ne traite que les fichiers qui arrivent après le premier démarrage du flux.
  options:
    maxfiles:
      en: "`cloudFiles.maxFilesPerTrigger` limits the number of new files processed in each trigger."
      fr: "`cloudFiles.maxFilesPerTrigger` limite le nombre de nouveaux fichiers traités à chaque déclencheur."
    overwrites:
      en: "`cloudFiles.allowOverwrites` controls whether files that are modified after processing are processed again."
      fr: "`cloudFiles.allowOverwrites` détermine si les fichiers modifiés après leur traitement sont traités à nouveau."
references:
  - title: Spark API options reference
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/options
