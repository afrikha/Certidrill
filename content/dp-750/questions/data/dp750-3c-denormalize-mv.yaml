id: dp750-3c-denormalize-mv
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum keeps normalized silver tables: **adatum.silver.sales** (facts), **adatum.silver.customers** and **adatum.silver.products**. Hundreds of dashboard queries a day join the three tables to read the customer segment and the product category of each sale.

    You need to provide a gold dataset that meets the following requirements:

    - Dashboard queries must not perform the joins at query time.
    - Changes to customer segments and product categories must appear in the dataset after each nightly refresh.
    - The silver tables must stay normalized.

    What should you create?
  fr: |
    Adatum conserve des tables silver normalisées : **adatum.silver.sales** (faits), **adatum.silver.customers** et **adatum.silver.products**. Des centaines de requêtes de tableaux de bord par jour joignent les trois tables pour lire le segment client et la catégorie de produit de chaque vente.

    Vous devez fournir un jeu de données gold qui répond aux exigences suivantes :

    - Les requêtes des tableaux de bord ne doivent pas effectuer les jointures au moment de la requête.
    - Les modifications des segments clients et des catégories de produits doivent apparaître dans le jeu de données après chaque actualisation nocturne.
    - Les tables silver doivent rester normalisées.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A view in the gold schema that joins the sales to the customers and products", fr: "Une vue dans le schéma gold qui joint les ventes aux clients et aux produits" } }
    - { id: b, text: { en: "A materialized view in the gold schema that joins the sales to the customers and products", fr: "Une vue matérialisée dans le schéma gold qui joint les ventes aux clients et aux produits" } }
    - { id: c, text: { en: "A nightly MERGE that adds the segment and category columns to adatum.silver.sales", fr: "Un MERGE nocturne qui ajoute les colonnes de segment et de catégorie à adatum.silver.sales" } }
    - { id: d, text: { en: "A table in the gold schema created once with CREATE TABLE AS SELECT and the joins", fr: "Une table dans le schéma gold créée une seule fois avec CREATE TABLE AS SELECT et les jointures" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Denormalizing joins the dimension attributes into the facts once, so reports read one wide dataset. A materialized view physically stores the results of its query and updates them at each refresh, here on a nightly schedule, which picks up the latest dimension changes while the silver tables stay normalized.
    fr: |
      La dénormalisation joint une seule fois les attributs des dimensions aux faits : les rapports lisent alors un seul jeu de données large. Une vue matérialisée stocke physiquement les résultats de sa requête et les met à jour à chaque actualisation, ici selon une planification nocturne, ce qui intègre les dernières modifications des dimensions tandis que les tables silver restent normalisées.
  options:
    a:
      en: |
        A standard view computes its results on demand, so every dashboard query still runs the joins.
      fr: |
        Une vue standard calcule ses résultats à la demande : chaque requête de tableau de bord exécute donc toujours les jointures.
    c:
      en: |
        Copying dimension attributes into the silver fact table denormalizes the silver layer, which the requirements forbid.
      fr: |
        Copier les attributs des dimensions dans la table de faits silver dénormalise la couche silver, ce que les exigences interdisent.
    d:
      en: |
        A table created once is never updated, so later changes to segments and categories would not appear.
      fr: |
        Une table créée une seule fois n'est jamais mise à jour : les modifications ultérieures des segments et des catégories n'apparaîtraient pas.
references:
  - title: Use standalone materialized views
    url: https://learn.microsoft.com/en-us/azure/databricks/views/materialized
