id: dp750-3a-full-extract-reference
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders loads a reference table of about 2,500 country and currency codes from an operational database into **northwind.ref.country_codes** in Unity Catalog.

    The source table has no timestamp, sequence number or version column, and the database has no change tracking enabled. The team accepts rebuilding the destination table at each run, and the logic must stay as simple as possible.

    Which extraction type should you use?
  fr: |
    Northwind Traders charge une table de référence d'environ 2 500 codes de pays et de devises depuis une base de données opérationnelle vers **northwind.ref.country_codes** dans le catalogue Unity.

    La table source n'a aucune colonne d'horodatage, de numéro de séquence ou de version, et aucun suivi des modifications n'est activé sur la base de données. L'équipe accepte de reconstruire la table de destination à chaque exécution, et la logique doit rester la plus simple possible.

    Quel type d'extraction devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Incremental extraction based on a high-water mark", fr: "Une extraction incrémentielle basée sur une limite supérieure" } }
    - { id: b, text: { en: "Change data capture (CDC) extraction", fr: "Une extraction par capture des changements de données (CDC)" } }
    - { id: c, text: { en: "Full extraction at each run", fr: "Une extraction complète à chaque exécution" } }
    - { id: d, text: { en: "Streaming extraction from a message bus", fr: "Une extraction en streaming depuis un bus de messages" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Full extraction reads the whole dataset at each run. It fits small volumes, sources without change tracking and cases where rebuilding the destination is acceptable, and it needs no state management.
    fr: |
      L'extraction complète lit l'intégralité du jeu de données à chaque exécution. Elle convient aux petits volumes, aux sources sans suivi des modifications et aux cas où la reconstruction de la destination est acceptable, et elle ne nécessite aucune gestion d'état.
  options:
    a:
      en: |
        Incremental extraction needs a reliable change indicator (timestamp, sequence number or version column), which the source does not have.
      fr: |
        L'extraction incrémentielle nécessite un indicateur de changement fiable (horodatage, numéro de séquence ou colonne de version), dont la source est dépourvue.
    b:
      en: |
        CDC needs the source to expose row-level changes, for example through transaction log capture, which is not enabled here.
      fr: |
        La CDC nécessite que la source expose les changements au niveau des lignes, par exemple par la capture du journal des transactions, ce qui n'est pas activé ici.
    d:
      en: |
        Streaming extraction needs a source that publishes events and always-on infrastructure; a small reference table in a database does neither.
      fr: |
        L'extraction en streaming nécessite une source qui publie des événements et une infrastructure toujours active ; une petite table de référence dans une base de données ne répond à aucun de ces critères.
references:
  - title: Design ingestion logic and data source configuration
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/2-design-data-ingestion-logic
