id: dp750-3b-cdf-table-changes
objective: "3.1.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys enabled change data feed on the Delta table **tailspin.ops.bookings** at version 12. The table is now at version 58.

    You need a query that returns, for every change committed from version 40 onward, the new values of the inserted and updated rows. The results must be sorted in commit order.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys a activé le flux de données modifiées (change data feed) sur la table Delta **tailspin.ops.bookings** à la version 12. La table est maintenant à la version 58.

    Vous avez besoin d'une requête qui renvoie, pour chaque modification validée à partir de la version 40, les nouvelles valeurs des lignes insérées et mises à jour. Les résultats doivent être triés dans l'ordre des validations.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT booking_id, status, _change_type, _commit_version
    FROM [[fn]]('tailspin.ops.bookings', 40)
    WHERE _change_type IN ('insert', '[[ct]]')
    ORDER BY [[ord]];
  slots:
    - id: fn
      options:
        - { id: tc, text: table_changes }
        - { id: rf, text: read_files }
        - { id: cfs, text: cloud_files_state }
        - { id: el, text: event_log }
    - id: ct
      options:
        - { id: post, text: update_postimage }
        - { id: pre, text: update_preimage }
        - { id: upd, text: update }
        - { id: ups, text: upsert }
    - id: ord
      options:
        - { id: ver, text: _commit_version }
        - { id: verdesc, text: _commit_version DESC }
        - { id: type, text: _change_type }
answer:
  values: { fn: tc, ct: post, ord: ver }
explanation:
  correct:
    en: |
      table_changes returns the change data feed of a table from a start version (inclusive) to the latest version. An update produces two rows: update_preimage with the old values and update_postimage with the new values. Sorting on _commit_version in ascending order returns the changes in commit order.
    fr: |
      table_changes renvoie le flux de données modifiées d'une table depuis une version de départ (incluse) jusqu'à la dernière version. Une mise à jour produit deux lignes : update_preimage avec les anciennes valeurs et update_postimage avec les nouvelles. Trier sur _commit_version par ordre croissant renvoie les modifications dans l'ordre des validations.
  options:
    rf: { en: "read_files reads files in a storage path, not the changes of a table.", fr: "read_files lit les fichiers d'un chemin de stockage, pas les modifications d'une table." }
    cfs: { en: "cloud_files_state shows the files discovered by an Auto Loader stream.", fr: "cloud_files_state affiche les fichiers découverts par un flux Auto Loader." }
    el: { en: "event_log returns the event log of a pipeline, not row-level changes.", fr: "event_log renvoie le journal des événements d'un pipeline, pas les modifications au niveau des lignes." }
    pre: { en: "update_preimage holds the values before the update.", fr: "update_preimage contient les valeurs antérieures à la mise à jour." }
    upd: { en: "update isn't a value of _change_type.", fr: "update n'est pas une valeur de _change_type." }
    ups: { en: "upsert isn't a value of _change_type.", fr: "upsert n'est pas une valeur de _change_type." }
    verdesc: { en: "DESC returns the most recent commit first.", fr: "DESC renvoie d'abord la validation la plus récente." }
    type: { en: "Sorting on _change_type groups the rows by type and loses the commit order.", fr: "Trier sur _change_type regroupe les lignes par type et fait perdre l'ordre des validations." }
references:
  - title: Use change data feed on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/delta-change-data-feed
