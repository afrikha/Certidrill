id: dp750-3d-stream-after-schema-change
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Lakeflow job that runs a Structured Streaming query. The query reads the Delta table **wingtip.silver.orders** as a streaming source and writes to a gold table. An engineer ran `ALTER TABLE wingtip.silver.orders ADD COLUMNS (gift_wrap BOOLEAN)`, and the streaming query stopped.

    You need to resume processing without reprocessing the data that the query already processed.

    What should you do?
  fr: |
    Wingtip Toys dispose d'un job Lakeflow qui exécute une requête Structured Streaming. La requête lit la table Delta **wingtip.silver.orders** comme source de streaming et écrit dans une table gold. Un ingénieur a exécuté `ALTER TABLE wingtip.silver.orders ADD COLUMNS (gift_wrap BOOLEAN)`, et la requête de streaming s'est arrêtée.

    Vous devez reprendre le traitement sans retraiter les données que la requête a déjà traitées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Delete the checkpoint of the query, and then restart the query."
        fr: "Supprimer le point de contrôle de la requête, puis redémarrer la requête."
    - id: b
      text:
        en: "Set `cloudFiles.schemaEvolutionMode` to `rescue` on the streaming read."
        fr: "Définir `cloudFiles.schemaEvolutionMode` sur `rescue` sur la lecture de streaming."
    - id: c
      text:
        en: "Restart the query with the same checkpoint location."
        fr: "Redémarrer la requête avec le même emplacement de point de contrôle."
    - id: d
      text:
        en: "Run `VACUUM` on wingtip.silver.orders, and then restart the query."
        fr: "Exécuter `VACUUM` sur wingtip.silver.orders, puis redémarrer la requête."
answer:
  optionId: c
explanation:
  correct:
    en: |
      Updating the schema of a Delta table terminates the streams that read from it. Restarting the query with its existing checkpoint picks up the new schema and continues from the last processed version. Configuring retries on the job task makes this restart automatic.
    fr: |
      La mise à jour du schéma d'une table Delta arrête les flux qui la lisent. Redémarrer la requête avec son point de contrôle existant prend en compte le nouveau schéma et reprend à partir de la dernière version traitée. Configurer des nouvelles tentatives sur la tâche du job rend ce redémarrage automatique.
  options:
    a:
      en: |
        Without its checkpoint, the query starts over and reprocesses the whole table.
      fr: |
        Sans son point de contrôle, la requête repart de zéro et retraite toute la table.
    b:
      en: |
        `cloudFiles.schemaEvolutionMode` is an Auto Loader option for files; the source here is a Delta table.
      fr: |
        `cloudFiles.schemaEvolutionMode` est une option Auto Loader pour les fichiers ; la source est ici une table Delta.
    d:
      en: |
        `VACUUM` deletes unreferenced data files; it has no effect on the schema change that stopped the stream.
      fr: |
        `VACUUM` supprime les fichiers de données non référencés ; il n'a aucun effet sur la modification de schéma qui a arrêté le flux.
references:
  - title: Update table schemas with schema evolution
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/update-schema
