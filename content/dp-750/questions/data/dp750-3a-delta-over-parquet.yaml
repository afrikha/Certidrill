id: dp750-3a-delta-over-parquet
objective: "3.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders stores its curated sales data as plain Parquet files in Azure Data Lake Storage. The team plans to convert the data to Delta Lake tables in Unity Catalog.

    Which two capabilities does Delta Lake add that plain Parquet files do not provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders stocke ses données de ventes organisées sous forme de fichiers Parquet simples dans Azure Data Lake Storage. L'équipe prévoit de convertir les données en tables Delta Lake dans le catalogue Unity.

    Quelles sont les deux fonctionnalités ajoutées par Delta Lake que les fichiers Parquet simples ne fournissent pas ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Columnar storage organized in row groups", fr: "Un stockage en colonnes organisé en groupes de lignes" } }
    - { id: b, text: { en: "Column pruning that reads only the referenced columns", fr: "L'élagage de colonnes qui ne lit que les colonnes référencées" } }
    - { id: c, text: { en: "ACID transactions recorded in a transaction log", fr: "Des transactions ACID enregistrées dans un journal des transactions" } }
    - { id: d, text: { en: "Time travel to previous versions of the table", fr: "Le voyage dans le temps vers les versions précédentes de la table" } }
    - { id: e, text: { en: "Column names and types embedded in the file metadata", fr: "Des noms et types de colonnes intégrés aux métadonnées des fichiers" } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Delta Lake extends Parquet data files with a transaction log that records every change, which provides ACID transactions and lets you query or restore previous versions with time travel.
    fr: |
      Delta Lake complète les fichiers de données Parquet par un journal des transactions qui enregistre chaque changement, ce qui fournit les transactions ACID et permet d'interroger ou de restaurer des versions précédentes grâce au voyage dans le temps.
  options:
    a:
      en: |
        Parquet itself is columnar and organizes data into row groups of column chunks.
      fr: |
        Parquet est lui-même un format en colonnes qui organise les données en groupes de lignes composés de blocs de colonnes.
    b:
      en: |
        Column pruning is already a Parquet optimization.
      fr: |
        L'élagage de colonnes est déjà une optimisation de Parquet.
    e:
      en: |
        Parquet files already embed metadata that describes column names and types.
      fr: |
        Les fichiers Parquet intègrent déjà des métadonnées qui décrivent les noms et les types des colonnes.
references:
  - title: Choose a data table format
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/4-choose-data-table-format
