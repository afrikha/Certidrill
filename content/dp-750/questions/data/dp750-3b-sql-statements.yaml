id: dp750-3b-sql-statements
objective: "3.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware's data engineers load data into Unity Catalog Delta tables by using SQL statements that run on a SQL warehouse.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les ingénieurs données de Litware chargent des données dans des tables Delta Unity Catalog à l'aide d'instructions SQL exécutées sur un entrepôt SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After CREATE OR REPLACE TABLE ... AS SELECT runs on an existing table, you can still query the versions created before the replacement by using time travel.
        fr: |
          Après l'exécution de CREATE OR REPLACE TABLE ... AS SELECT sur une table existante, vous pouvez toujours interroger les versions créées avant le remplacement à l'aide du voyage dans le temps.
    - id: s2
      text:
        en: |
          COPY INTO creates the target table if the table doesn't exist.
        fr: |
          COPY INTO crée la table cible si la table n'existe pas.
    - id: s3
      text:
        en: |
          COPY INTO can rename and cast columns before loading them by using FROM (SELECT ... FROM '<path>').
        fr: |
          COPY INTO peut renommer et convertir des colonnes avant de les charger à l'aide de FROM (SELECT ... FROM '<chemin>').
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      REPLACE preserves the table history, the granted privileges, the row filters and the column masks, so earlier versions remain available to time travel within the retention period. COPY INTO loads files into an existing Delta table; it doesn't create it. Its FROM clause accepts a SELECT over the source to project or transform columns before the copy.
    fr: |
      REPLACE conserve l'historique de la table, les privilèges accordés, les filtres de lignes et les masques de colonne : les versions antérieures restent accessibles au voyage dans le temps pendant la période de rétention. COPY INTO charge des fichiers dans une table Delta existante ; il ne la crée pas. Sa clause FROM accepte un SELECT sur la source pour projeter ou transformer des colonnes avant la copie.
references:
  - title: CREATE TABLE [USING]
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-table-using
  - title: COPY INTO
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-copy-into
