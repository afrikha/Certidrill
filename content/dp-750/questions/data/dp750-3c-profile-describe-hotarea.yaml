id: dp750-3c-profile-describe-hotarea
objective: "3.3.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam loads order lines into **fabrikam.bronze.order_lines**. The table contains 10,000 rows. Business rules state that **quantity** must be a positive integer and that **unit_price** must not exceed 500.

    You run `display(spark.read.table("fabrikam.bronze.order_lines").describe())` and get the output shown in the following table.

    Answer each prompt by selecting the appropriate column name in the first row of the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam charge des lignes de commande dans **fabrikam.bronze.order_lines**. La table contient 10 000 lignes. Les règles métier imposent que **quantity** soit un entier positif et que **unit_price** ne dépasse pas 500.

    Vous exécutez `display(spark.read.table("fabrikam.bronze.order_lines").describe())` et obtenez la sortie présentée dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le nom de colonne approprié dans la première ligne du tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The column that contains null values", fr: "La colonne qui contient des valeurs null" }
    - id: p2
      text: { en: "The column that contains at least one value that breaks a business rule", fr: "La colonne qui contient au moins une valeur qui enfreint une règle métier" }
  grid:
    rows:
      - [{ text: summary }, { text: line_id, area: cline }, { text: quantity, area: cqty }, { text: unit_price, area: cprice }, { text: discount_pct, area: cdisc }]
      - [{ text: count }, { text: "10000" }, { text: "10000" }, { text: "10000" }, { text: "8412" }]
      - [{ text: mean }, { text: "5000.5" }, { text: "3.18" }, { text: "42.70" }, { text: "4.95" }]
      - [{ text: stddev }, { text: "2886.9" }, { text: "2.04" }, { text: "61.33" }, { text: "3.10" }]
      - [{ text: min }, { text: "1" }, { text: "-2" }, { text: "0.99" }, { text: "0.0" }]
      - [{ text: max }, { text: "10000" }, { text: "24" }, { text: "489.00" }, { text: "30.0" }]
answer:
  values: { p1: cdisc, p2: cqty }
explanation:
  correct:
    en: |
      The `count` statistic of `describe()` is the number of non-null values in each column. Only **discount_pct** has a count lower than the 10,000 rows of the table, so it has 1,588 nulls. The minimum of **quantity** is -2, which breaks the rule that quantities are positive, while the maximum of **unit_price** stays under 500.
    fr: |
      La statistique `count` de `describe()` est le nombre de valeurs non null de chaque colonne. Seule **discount_pct** a un nombre inférieur aux 10 000 lignes de la table : elle contient donc 1 588 valeurs null. Le minimum de **quantity** vaut -2, ce qui enfreint la règle selon laquelle les quantités sont positives, tandis que le maximum de **unit_price** reste inférieur à 500.
  options:
    cprice:
      en: |
        The maximum unit price is 489.00, within the limit of 500, and the count shows no nulls.
      fr: |
        Le prix unitaire maximal est de 489,00, dans la limite de 500, et le nombre ne montre aucune valeur null.
    cline:
      en: |
        line_id has 10,000 non-null values, and no business rule applies to it.
      fr: |
        line_id compte 10 000 valeurs non null, et aucune règle métier ne s'y applique.
references:
  - title: describe
    url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframe/describe
