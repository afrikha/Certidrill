id: dp750-cs1a-ehr-ingestion
objective: "3.2.1"
type: dropdown
caseStudy: dp750-cs1a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to design the ingestion of the sqldb-ehr tables into Unity Catalog. The solution must meet the ingestion requirements.

    What should you use? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez concevoir l'ingestion des tables de sqldb-ehr dans Unity Catalog. La solution doit respecter les exigences d'ingestion.

    Que devez-vous utiliser ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ingestion tool: [[tool]]

      Feature to enable on the source tables: [[track]]
    fr: |
      Outil d'ingestion : [[tool]]

      Fonctionnalité à activer sur les tables sources : [[track]]
  slots:
    - id: tool
      options:
        - { id: connect, text: { en: "The Lakeflow Connect SQL Server connector", fr: "Le connecteur SQL Server de Lakeflow Connect" } }
        - { id: federation, text: { en: "A foreign catalog that uses a SQL Server connection", fr: "Un catalogue étranger qui utilise une connexion SQL Server" } }
        - { id: copyinto, text: { en: "A COPY INTO statement scheduled in a job", fr: "Une instruction COPY INTO planifiée dans un job" } }
        - { id: autoloader, text: { en: "Auto Loader in a Lakeflow pipeline", fr: "Auto Loader dans un pipeline Lakeflow" } }
    - id: track
      options:
        - { id: ct, text: { en: "Change tracking", fr: "Le suivi des modifications (change tracking)" } }
        - { id: cdc, text: { en: "Change data capture (CDC)", fr: "La capture des changements de données (CDC)" } }
        - { id: cdf, text: { en: "Delta change data feed", fr: "Le flux de données modifiées Delta (change data feed)" } }
        - { id: temporal, text: { en: "System-versioned temporal tables", fr: "Les tables temporelles versionnées par le système" } }
answer:
  values: { tool: connect, track: ct }
explanation:
  correct:
    en: |
      The managed SQL Server connector of Lakeflow Connect ingests SQL Server databases, including Azure SQL Database, incrementally into Unity Catalog without custom code. Change tracking and CDC both let the connector track changes; Databricks recommends change tracking for tables that have a primary key because it is lightweight and has less impact on the source database.
    fr: |
      Le connecteur managé SQL Server de Lakeflow Connect ingère de façon incrémentielle des bases SQL Server, y compris Azure SQL Database, dans Unity Catalog sans code personnalisé. Le suivi des modifications et la CDC permettent tous deux au connecteur de suivre les changements ; Databricks recommande le suivi des modifications pour les tables qui ont une clé primaire, car il est léger et pèse moins sur la base source.
  options:
    federation: { en: "A foreign catalog queries the source in place at each query; it does not ingest the data and would add load on sqldb-ehr.", fr: "Un catalogue étranger interroge la source sur place à chaque requête ; il n'ingère pas les données et ajouterait de la charge sur sqldb-ehr." }
    copyinto: { en: "COPY INTO loads files from cloud storage or a volume, not tables from a database.", fr: "COPY INTO charge des fichiers depuis un stockage cloud ou un volume, pas des tables d'une base de données." }
    autoloader: { en: "Auto Loader ingests new files from cloud storage; it cannot read SQL Server tables.", fr: "Auto Loader ingère les nouveaux fichiers d'un stockage cloud ; il ne peut pas lire des tables SQL Server." }
    cdc: { en: "CDC also works and doesn't require a primary key, but it can have more impact on the performance of the source database.", fr: "La CDC fonctionne aussi et n'exige pas de clé primaire, mais elle peut peser davantage sur les performances de la base source." }
    cdf: { en: "The change data feed is a Delta Lake table feature, not a SQL Server feature.", fr: "Le flux de données modifiées est une fonctionnalité des tables Delta Lake, pas de SQL Server." }
    temporal: { en: "Temporal tables keep row history in SQL Server, but the connector tracks changes with change tracking or CDC.", fr: "Les tables temporelles conservent l'historique des lignes dans SQL Server, mais le connecteur suit les changements avec le suivi des modifications ou la CDC." }
references:
  - title: Microsoft SQL Server ingestion connector
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/sql-server-overview
  - title: Configure Microsoft SQL Server for ingestion into Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/sql-server-source-setup
