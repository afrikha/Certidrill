id: dp750-3a-grain-from-keys
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso loads the fact table **contoso.gold.fact_sales** each night. The load reads the sales order line items of the day and aggregates them by `date_key`, `product_key`, `customer_key` and `store_key`. The table stores these four keys and the measures `quantity` and `net_amount`.

    What is the grain of **fact_sales**?
  fr: |
    Contoso charge chaque nuit la table de faits **contoso.gold.fact_sales**. Le chargement lit les lignes de commande client de la journée et les agrège par `date_key`, `product_key`, `customer_key` et `store_key`. La table stocke ces quatre clés ainsi que les mesures `quantity` et `net_amount`.

    Quelle est la granularité de **fact_sales** ?
body:
  options:
    - { id: a, text: { en: "One row per sales order line item", fr: "Une ligne par ligne de commande client" } }
    - { id: b, text: { en: "One row per product per customer per store per day", fr: "Une ligne par produit, par client, par magasin et par jour" } }
    - { id: c, text: { en: "One row per store per day", fr: "Une ligne par magasin et par jour" } }
    - { id: d, text: { en: "One row per sales order", fr: "Une ligne par commande client" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The grain of a fact table is determined by the combination of its dimension keys. Because the line items are aggregated by date, product, customer and store, each row represents one product for one customer in one store on one day.
    fr: |
      La granularité d'une table de faits est déterminée par la combinaison de ses clés de dimension. Comme les lignes de commande sont agrégées par date, produit, client et magasin, chaque ligne représente un produit pour un client dans un magasin pour un jour donné.
  options:
    a:
      en: |
        The line items are aggregated during the load, so individual line items are no longer stored.
      fr: |
        Les lignes de commande sont agrégées pendant le chargement : les lignes individuelles ne sont plus stockées.
    c:
      en: |
        The product and customer keys are part of the table, so the grain is finer than one row per store per day.
      fr: |
        Les clés produit et client font partie de la table : la granularité est donc plus fine qu'une ligne par magasin et par jour.
    d:
      en: |
        The table has no order key; several orders of the same customer, product, store and day are summed into one row.
      fr: |
        La table n'a pas de clé de commande ; plusieurs commandes d'un même client, produit, magasin et jour sont additionnées dans une seule ligne.
references:
  - title: Choose granularity on a column or table based on requirements
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/9-choose-granularity
