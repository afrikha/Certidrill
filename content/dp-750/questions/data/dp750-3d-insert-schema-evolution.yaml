id: dp750-3d-insert-schema-evolution
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a SQL notebook on Databricks Runtime 18.1. The notebook runs `INSERT INTO contoso.silver.devices SELECT * FROM contoso.staging.devices`, and then loads several other tables in the same session. The source system added a column named `firmware_channel` to contoso.staging.devices, and the insert now fails.

    You need the insert to add `firmware_channel` to contoso.silver.devices and keep the existing rows. The other statements of the session must keep rejecting writes that contain new columns.

    What should you do?
  fr: |
    Contoso exécute un notebook SQL sur Databricks Runtime 18.1. Le notebook exécute `INSERT INTO contoso.silver.devices SELECT * FROM contoso.staging.devices`, puis charge plusieurs autres tables dans la même session. Le système source a ajouté une colonne nommée `firmware_channel` à contoso.staging.devices, et l'insertion échoue désormais.

    Vous devez faire en sorte que l'insertion ajoute `firmware_channel` à contoso.silver.devices et conserve les lignes existantes. Les autres instructions de la session doivent continuer à rejeter les écritures qui contiennent de nouvelles colonnes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run `SET spark.databricks.delta.schema.autoMerge.enabled = true` at the start of the notebook."
        fr: "Exécuter `SET spark.databricks.delta.schema.autoMerge.enabled = true` au début du notebook."
    - id: b
      text:
        en: "Change the statement to `INSERT INTO contoso.silver.devices BY NAME SELECT * FROM contoso.staging.devices`."
        fr: "Remplacer l'instruction par `INSERT INTO contoso.silver.devices BY NAME SELECT * FROM contoso.staging.devices`."
    - id: c
      text:
        en: "Change the statement to `INSERT WITH SCHEMA EVOLUTION INTO contoso.silver.devices SELECT * FROM contoso.staging.devices`."
        fr: "Remplacer l'instruction par `INSERT WITH SCHEMA EVOLUTION INTO contoso.silver.devices SELECT * FROM contoso.staging.devices`."
    - id: d
      text:
        en: "Change the statement to `INSERT OVERWRITE contoso.silver.devices SELECT * FROM contoso.staging.devices`."
        fr: "Remplacer l'instruction par `INSERT OVERWRITE contoso.silver.devices SELECT * FROM contoso.staging.devices`."
answer:
  optionId: c
explanation:
  correct:
    en: |
      In Databricks Runtime 18.1 and above, `INSERT WITH SCHEMA EVOLUTION` enables schema evolution for this statement only: the new source column is added to the target table, and the earlier rows get NULL for it. The other statements of the session still apply schema enforcement.
    fr: |
      Dans Databricks Runtime 18.1 et versions ultérieures, `INSERT WITH SCHEMA EVOLUTION` active l'évolution du schéma pour cette seule instruction : la nouvelle colonne source est ajoutée à la table cible, et les lignes antérieures reçoivent NULL pour cette colonne. Les autres instructions de la session appliquent toujours le schéma.
  options:
    a:
      en: |
        The autoMerge setting enables schema evolution for every write of the session, which the other loads must not get; Databricks doesn't recommend it for production.
      fr: |
        Le paramètre autoMerge active l'évolution du schéma pour toutes les écritures de la session, ce que les autres chargements ne doivent pas obtenir ; Databricks ne le recommande pas en production.
    b:
      en: |
        `BY NAME` matches columns by name, but every query column must exist in the target, so the unknown `firmware_channel` column makes the statement fail.
      fr: |
        `BY NAME` associe les colonnes par nom, mais chaque colonne de la requête doit exister dans la cible : la colonne inconnue `firmware_channel` fait échouer l'instruction.
    d:
      en: |
        `INSERT OVERWRITE` truncates the table, so the existing rows are lost, and it still doesn't evolve the schema.
      fr: |
        `INSERT OVERWRITE` tronque la table : les lignes existantes sont perdues, et le schéma n'évolue toujours pas.
references:
  - title: Update table schemas with schema evolution
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/update-schema
  - title: INSERT
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-dml-insert-into
