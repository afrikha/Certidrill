id: dp750-3c-type-variant
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware ingests application events into **proseware.silver.app_events** on Databricks Runtime 17.3 LTS. Each event has a JSON payload whose fields depend on the event type, and new event types with new fields are added every month. Analysts query nested fields of the payload, such as the device model of a login event, and cast them to the types they need.

    You need to choose the data type of the **payload** column. The solution must not require a schema change when an event type adds fields.

    Which data type should you use?
  fr: |
    Proseware ingère des événements applicatifs dans **proseware.silver.app_events** sur Databricks Runtime 17.3 LTS. Chaque événement contient une charge utile JSON dont les champs dépendent du type d'événement, et de nouveaux types d'événements comportant de nouveaux champs sont ajoutés chaque mois. Les analystes interrogent des champs imbriqués de la charge utile, comme le modèle d'appareil d'un événement de connexion, et les convertissent dans les types dont ils ont besoin.

    Vous devez choisir le type de données de la colonne **payload**. La solution ne doit exiger aucune modification de schéma lorsqu'un type d'événement ajoute des champs.

    Quel type de données devez-vous utiliser ?
body:
  options:
    - { id: a, text: VARIANT }
    - { id: b, text: "STRUCT<device: STRING, action: STRING, duration: INT>" }
    - { id: c, text: "MAP<STRING, STRING>" }
    - { id: d, text: "ARRAY<STRING>" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      VARIANT (Databricks Runtime 15.3 and above) represents semi-structured data such as JSON, with objects, arrays and scalar values of any shape. You create values with `parse_json`, navigate them with the `:` path operator or `variant_get`, and convert fields with `::` or `cast`, without declaring a schema in advance.
    fr: |
      VARIANT (Databricks Runtime 15.3 et versions ultérieures) représente des données semi-structurées comme JSON, avec des objets, des tableaux et des valeurs scalaires de n'importe quelle forme. Vous créez les valeurs avec `parse_json`, vous les parcourez avec l'opérateur de chemin `:` ou `variant_get`, et vous convertissez les champs avec `::` ou `cast`, sans déclarer de schéma à l'avance.
  options:
    b:
      en: |
        A STRUCT has a fixed list of fields, so each new field requires a schema change.
      fr: |
        Un STRUCT a une liste fixe de champs : chaque nouveau champ exige une modification du schéma.
    c:
      en: |
        A MAP of strings flattens the payload to one level of string values and loses the nested objects and the original types.
      fr: |
        Un MAP de chaînes aplatit la charge utile sur un seul niveau de valeurs de chaîne et perd les objets imbriqués et les types d'origine.
    d:
      en: |
        An array of strings keeps a list of values without field names, so analysts cannot query a field by its path.
      fr: |
        Un tableau de chaînes conserve une liste de valeurs sans noms de champs : les analystes ne peuvent pas interroger un champ par son chemin.
references:
  - title: VARIANT type
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/data-types/variant-type
