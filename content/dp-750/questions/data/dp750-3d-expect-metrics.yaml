id: dp750-3d-expect-metrics
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Lakeflow Spark Declarative Pipelines pipeline created in the Jobs & Pipelines UI. The streaming table **contoso.silver.orders** is defined with `@dp.expect_all_or_drop(rules)`.

    A data steward needs to see how many records each rule removed during the latest pipeline update.

    Where should the data steward look?
  fr: |
    Contoso dispose d'un pipeline Lakeflow Spark Declarative Pipelines créé dans l'interface Jobs & Pipelines. La table de streaming **contoso.silver.orders** est définie avec `@dp.expect_all_or_drop(rules)`.

    Un responsable des données doit voir combien d'enregistrements chaque règle a supprimés lors de la dernière mise à jour du pipeline.

    Où le responsable des données doit-il regarder ?
body:
  options:
    - { id: a, text: { en: "The output of `DESCRIBE DETAIL contoso.silver.orders`", fr: "La sortie de `DESCRIBE DETAIL contoso.silver.orders`" } }
    - { id: b, text: { en: "The Lineage tab of the table in Catalog Explorer", fr: "L'onglet Lineage de la table dans Catalog Explorer" } }
    - { id: c, text: { en: "The output of `SHOW TBLPROPERTIES contoso.silver.orders`", fr: "La sortie de `SHOW TBLPROPERTIES contoso.silver.orders`" } }
    - { id: d, text: { en: "The Data quality tab of the orders dataset in the pipeline UI", fr: "L'onglet Data quality du jeu de données orders dans l'interface du pipeline" } }
answer:
  optionId: d
explanation:
  correct:
    en: |
      For warn and drop expectations, the pipeline records metrics such as the number of dropped records. You see them on the **Data quality** tab of the dataset in the pipeline UI, or by querying the pipeline event log.
    fr: |
      Pour les attentes d'avertissement et de suppression, le pipeline enregistre des métriques comme le nombre d'enregistrements supprimés. Vous les consultez dans l'onglet **Data quality** du jeu de données dans l'interface du pipeline, ou en interrogeant le journal des événements du pipeline.
  options:
    a:
      en: |
        `DESCRIBE DETAIL` shows table metadata such as the location, size and file count, not expectation metrics.
      fr: |
        `DESCRIBE DETAIL` affiche les métadonnées de la table comme l'emplacement, la taille et le nombre de fichiers, pas les métriques des attentes.
    b:
      en: |
        The Lineage tab shows upstream and downstream tables and notebooks, not data quality metrics.
      fr: |
        L'onglet Lineage affiche les tables et notebooks en amont et en aval, pas les métriques de qualité des données.
    c:
      en: |
        `SHOW TBLPROPERTIES` lists table properties, including Delta `CHECK` constraints, but not the records dropped by expectations.
      fr: |
        `SHOW TBLPROPERTIES` liste les propriétés de la table, y compris les contraintes `CHECK` de Delta, mais pas les enregistrements supprimés par les attentes.
references:
  - title: Manage data quality with pipeline expectations
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations
