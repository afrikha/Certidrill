id: dp750-3c-join-anti-orphans
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders loads orders into **northwind.silver.orders** and products into **northwind.silver.products**. Some orders reference a **product_id** that does not exist in **northwind.silver.products**.

    You need a query that returns the columns of the orders whose **product_id** has no match in the products table, so that they can be sent to a quarantine table.

    Which join should you use between **orders** (left) and **products** (right)?
  fr: |
    Northwind Traders charge les commandes dans **northwind.silver.orders** et les produits dans **northwind.silver.products**. Certaines commandes référencent un **product_id** qui n'existe pas dans **northwind.silver.products**.

    Vous avez besoin d'une requête qui renvoie les colonnes des commandes dont le **product_id** n'a pas de correspondance dans la table des produits, afin de les envoyer vers une table de quarantaine.

    Quelle jointure devez-vous utiliser entre **orders** (à gauche) et **products** (à droite) ?
body:
  options:
    - { id: a, text: LEFT SEMI JOIN }
    - { id: b, text: LEFT ANTI JOIN }
    - { id: c, text: LEFT OUTER JOIN }
    - { id: d, text: INNER JOIN }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A left anti join returns the rows of the left table reference that have no match in the right table reference, with the columns of the left side only. It returns exactly the orders whose product does not exist.
    fr: |
      Une jointure anti gauche renvoie les lignes de la référence de table de gauche qui n'ont pas de correspondance dans la référence de table de droite, avec uniquement les colonnes du côté gauche. Elle renvoie exactement les commandes dont le produit n'existe pas.
  options:
    a:
      en: |
        A left semi join returns the opposite: the orders that do have a matching product.
      fr: |
        Une jointure semi gauche renvoie l'inverse : les commandes qui ont un produit correspondant.
    c:
      en: |
        A left outer join returns every order, matched or not, with NULL product columns for the orphans; it needs an additional filter.
      fr: |
        Une jointure externe gauche renvoie toutes les commandes, avec ou sans correspondance, avec des colonnes de produit NULL pour les orphelines ; elle nécessite un filtre supplémentaire.
    d:
      en: |
        An inner join returns only the orders that have a matching product.
      fr: |
        Une jointure interne ne renvoie que les commandes qui ont un produit correspondant.
references:
  - title: JOIN
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-join
