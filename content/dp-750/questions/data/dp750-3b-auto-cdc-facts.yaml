id: dp750-3b-auto-cdc-facts
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses the AUTO CDC APIs of Lakeflow Spark Declarative Pipelines to apply CDC feeds from its operational databases to Unity Catalog.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise les API AUTO CDC de Lakeflow Spark Declarative Pipelines pour appliquer à Unity Catalog les flux CDC de ses bases de données opérationnelles.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "AUTO CDC flows can run in pipelines of any edition, including Core.", fr: "Les flux AUTO CDC peuvent s'exécuter dans des pipelines de toute édition, y compris Core." } }
    - { id: b, text: { en: "The sequencing column must have a sortable data type and can't contain NULL values.", fr: "La colonne de séquencement doit avoir un type de données triable et ne peut pas contenir de valeurs NULL." } }
    - { id: c, text: { en: "A change that arrives late with a lower sequence value overwrites the value written by a newer change.", fr: "Une modification arrivée en retard avec une valeur de séquence inférieure écrase la valeur écrite par une modification plus récente." } }
    - { id: d, text: { en: "In a target stored as SCD type 2, the current version of each key has a NULL __END_AT value.", fr: "Dans une cible stockée en SCD de type 2, la version actuelle de chaque clé a une valeur __END_AT NULL." } }
    - { id: e, text: { en: "The target of an AUTO CDC flow is a materialized view.", fr: "La cible d'un flux AUTO CDC est une vue matérialisée." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      AUTO CDC requires a sortable sequencing column and doesn't support NULL sequencing values. SCD type 2 targets get __START_AT and __END_AT columns, and the records whose __END_AT is null are the active versions.
    fr: |
      AUTO CDC exige une colonne de séquencement triable et ne prend pas en charge les valeurs de séquencement NULL. Les cibles SCD de type 2 reçoivent les colonnes __START_AT et __END_AT, et les enregistrements dont __END_AT est nul sont les versions actives.
  options:
    a:
      en: |
        AUTO CDC requires serverless pipelines or the Pro or Advanced edition.
      fr: |
        AUTO CDC exige des pipelines serverless ou l'édition Pro ou Advanced.
    c:
      en: |
        AUTO CDC orders changes by the sequence value, so an older change that arrives late is dropped.
      fr: |
        AUTO CDC ordonne les modifications par la valeur de séquence : une modification plus ancienne arrivée en retard est écartée.
    e:
      en: |
        AUTO CDC flows write to a streaming table created with CREATE OR REFRESH STREAMING TABLE or create_streaming_table.
      fr: |
        Les flux AUTO CDC écrivent dans une table de streaming créée avec CREATE OR REFRESH STREAMING TABLE ou create_streaming_table.
references:
  - title: "The AUTO CDC APIs: Simplify change data capture with pipelines"
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/cdc
