id: dp750-3d-evolution-modes
objective: "3.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum ingests four JSON feeds with Auto Loader. Each stream runs in a Lakeflow job task that retries on failure. The requirements of each feed for handling new columns are listed in the answer area.

    Which value of `cloudFiles.schemaEvolutionMode` should you use for each feed? To answer, drag the appropriate values to the correct feeds. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum ingère quatre flux JSON avec Auto Loader. Chaque flux s'exécute dans une tâche de job Lakeflow qui effectue de nouvelles tentatives en cas d'échec. Les exigences de chaque flux pour la gestion des nouvelles colonnes figurent dans la zone de réponse.

    Quelle valeur de `cloudFiles.schemaEvolutionMode` devez-vous utiliser pour chaque flux ? Pour répondre, faites glisser les valeurs appropriées vers les flux correspondants. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: add, text: addNewColumns }
    - { id: widen, text: addNewColumnsWithTypeWidening }
    - { id: rescue, text: rescue }
    - { id: fail, text: failOnNewColumns }
    - { id: none, text: none }
  targets:
    - id: clicks
      text: { en: "Clicks: the schema is inferred. New columns must be added to the table automatically, and the types of existing columns must never change.", fr: "Clics : le schéma est inféré. Les nouvelles colonnes doivent être ajoutées automatiquement à la table, et les types des colonnes existantes ne doivent jamais changer." }
    - id: invoices
      text: { en: "Invoices: the stream must never stop and the schema must never change, but the values of new columns must be kept.", fr: "Factures : le flux ne doit jamais s'arrêter et le schéma ne doit jamais changer, mais les valeurs des nouvelles colonnes doivent être conservées." }
    - id: payroll
      text: { en: "Payroll: an engineer must update the schema before the stream processes a file that contains a new column.", fr: "Paie : un ingénieur doit mettre à jour le schéma avant que le flux ne traite un fichier contenant une nouvelle colonne." }
    - id: weather
      text: { en: "Weather: a full schema is provided. New columns can be discarded, and the stream must keep running.", fr: "Météo : un schéma complet est fourni. Les nouvelles colonnes peuvent être ignorées, et le flux doit continuer à s'exécuter." }
answer:
  mapping: { clicks: add, invoices: rescue, payroll: fail, weather: none }
explanation:
  correct:
    en: |
      `addNewColumns` stops the stream with an `UnknownFieldException` after adding the new columns to the schema, and the retry resumes with the new schema without changing existing types. `rescue` never evolves the schema and never fails; new columns go to the rescued data column. `failOnNewColumns` keeps failing until someone updates the schema or removes the file. `none`, the default with a provided schema, ignores new columns and keeps running.
    fr: |
      `addNewColumns` arrête le flux avec une `UnknownFieldException` après avoir ajouté les nouvelles colonnes au schéma, et la nouvelle tentative reprend avec le nouveau schéma sans modifier les types existants. `rescue` ne fait jamais évoluer le schéma et n'échoue jamais ; les nouvelles colonnes vont dans la colonne de données récupérées. `failOnNewColumns` continue d'échouer jusqu'à ce que quelqu'un mette à jour le schéma ou retire le fichier. `none`, la valeur par défaut avec un schéma fourni, ignore les nouvelles colonnes et poursuit l'exécution.
  options:
    widen:
      en: |
        `addNewColumnsWithTypeWidening` also widens the types of existing columns, which the clicks feed forbids.
      fr: |
        `addNewColumnsWithTypeWidening` élargit aussi les types des colonnes existantes, ce que le flux des clics interdit.
references:
  - title: Configure schema inference and evolution in Auto Loader
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
