id: dp750-3b-nb-serverless-trigger
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs an ingestion notebook as a task of a Lakeflow Jobs job on serverless compute. The notebook contains the following streaming write:

    ```python
    (df.writeStream
       .option("checkpointLocation", "/Volumes/fabrikam/landing/chk/sensors")
       .trigger(processingTime="1 minute")
       .toTable("fabrikam.bronze.sensors"))
    ```

    The task fails because of the trigger. The task must keep running on serverless compute, and the data in fabrikam.bronze.sensors must be at most 15 minutes old.

    What should you do?
  fr: |
    Fabrikam exécute un notebook d'ingestion en tant que tâche d'un job Lakeflow Jobs sur du calcul serverless. Le notebook contient l'écriture en streaming suivante :

    ```python
    (df.writeStream
       .option("checkpointLocation", "/Volumes/fabrikam/landing/chk/sensors")
       .trigger(processingTime="1 minute")
       .toTable("fabrikam.bronze.sensors"))
    ```

    La tâche échoue à cause du déclencheur. La tâche doit continuer à s'exécuter sur du calcul serverless, et les données de fabrikam.bronze.sensors doivent avoir au plus 15 minutes d'ancienneté.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the trigger to processingTime=\"15 minutes\" and keep the job running.", fr: "Remplacer le déclencheur par processingTime=\"15 minutes\" et laisser le job en cours d'exécution." } }
    - { id: b, text: { en: "Remove the trigger call so that the default trigger is used, and keep the job running.", fr: "Supprimer l'appel trigger pour utiliser le déclencheur par défaut, et laisser le job en cours d'exécution." } }
    - { id: c, text: { en: "Change the trigger to availableNow=True and schedule the job to run every 15 minutes.", fr: "Remplacer le déclencheur par availableNow=True et planifier l'exécution du job toutes les 15 minutes." } }
    - { id: d, text: { en: "Change the trigger to continuous=\"15 minutes\" and keep the job running.", fr: "Remplacer le déclencheur par continuous=\"15 minutes\" et laisser le job en cours d'exécution." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In serverless notebooks and jobs, only the AvailableNow and Once triggers are supported, and Databricks recommends AvailableNow. Each run processes all the available data as an incremental batch and stops, so a 15-minute job schedule keeps the data at most 15 minutes old.
    fr: |
      Dans les notebooks et les jobs serverless, seuls les déclencheurs AvailableNow et Once sont pris en charge, et Databricks recommande AvailableNow. Chaque exécution traite toutes les données disponibles en un lot incrémentiel puis s'arrête : une planification du job toutes les 15 minutes garantit des données d'au plus 15 minutes.
  options:
    a:
      en: |
        Any processing-time interval is a time-based trigger, which serverless compute doesn't support.
      fr: |
        Tout intervalle de traitement est un déclencheur temporel, que le calcul serverless ne prend pas en charge.
    b:
      en: |
        Without a trigger, the stream uses a processing-time trigger with a 0 interval, which serverless compute doesn't support either.
      fr: |
        Sans déclencheur, le flux utilise un déclencheur temporel d'intervalle 0, que le calcul serverless ne prend pas non plus en charge.
    d:
      en: |
        The continuous trigger isn't supported on Azure Databricks.
      fr: |
        Le déclencheur continu n'est pas pris en charge sur Azure Databricks.
references:
  - title: Configure Structured Streaming trigger intervals
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/triggers
