id: dp750-3c-type-decimal-scale
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware loads invoice amounts into **litware.silver.invoices** with the following statement.

    ```sql
    INSERT INTO litware.silver.invoices
    SELECT invoice_id, CAST(amount AS DECIMAL) AS amount
    FROM litware.bronze.invoices;
    ```

    Finance reports that every amount is now a whole number. Amounts have two decimal places and never exceed 9,999,999,999.99. Totals must add up exactly to the cent.

    You need to choose the data type for **amount** in the CAST expression and in the table definition.

    Which data type should you use?
  fr: |
    Litware charge les montants des factures dans **litware.silver.invoices** avec l'instruction suivante.

    ```sql
    INSERT INTO litware.silver.invoices
    SELECT invoice_id, CAST(amount AS DECIMAL) AS amount
    FROM litware.bronze.invoices;
    ```

    Le service financier signale que tous les montants sont désormais des nombres entiers. Les montants ont deux décimales et ne dépassent jamais 9 999 999 999,99. Les totaux doivent tomber juste au centime près.

    Vous devez choisir le type de données d'**amount** dans l'expression CAST et dans la définition de la table.

    Quel type de données devez-vous utiliser ?
body:
  options:
    - { id: a, text: "DECIMAL(10,2)" }
    - { id: b, text: "DECIMAL(12,2)" }
    - { id: c, text: "DECIMAL(12)" }
    - { id: d, text: DOUBLE }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A bare `DECIMAL` means `DECIMAL(10,0)`: precision 10 and scale 0, so the cast drops the decimal places. The scale must be 2, and the precision (total number of digits) must cover the 10 digits before the decimal point plus the 2 after it, so `DECIMAL(12,2)` is required. DECIMAL is an exact type, so sums are exact to the cent.
    fr: |
      Un `DECIMAL` seul signifie `DECIMAL(10,0)` : précision 10 et échelle 0, si bien que la conversion supprime les décimales. L'échelle doit être de 2, et la précision (nombre total de chiffres) doit couvrir les 10 chiffres avant la virgule plus les 2 après : `DECIMAL(12,2)` est donc nécessaire. DECIMAL est un type exact, les sommes sont donc exactes au centime près.
  options:
    a:
      en: "`DECIMAL(10,2)` keeps two decimal places but its maximum is 99,999,999.99, below the largest amount."
      fr: "`DECIMAL(10,2)` conserve deux décimales mais son maximum est de 99 999 999,99, en dessous du plus gros montant."
    c:
      en: "`DECIMAL(12)` has the default scale of 0, so the amounts would still be rounded to whole numbers."
      fr: "`DECIMAL(12)` a l'échelle par défaut de 0 : les montants seraient toujours arrondis à des nombres entiers."
    d:
      en: |
        DOUBLE is a binary floating-point type that cannot represent every two-decimal amount exactly, so totals can drift.
      fr: |
        DOUBLE est un type à virgule flottante binaire qui ne peut pas représenter exactement tous les montants à deux décimales : les totaux peuvent dériver.
references:
  - title: DECIMAL type
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/data-types/decimal-type
