id: dp750-3d-check-constraint-facts
objective: "3.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Delta table named **woodgrove.silver.loans** that contains three years of data. You plan to run the following statement.

    `ALTER TABLE woodgrove.silver.loans ADD CONSTRAINT valid_rate CHECK (rate BETWEEN 0 AND 0.25)`

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'une table Delta nommée **woodgrove.silver.loans** qui contient trois années de données. Vous prévoyez d'exécuter l'instruction suivante.

    `ALTER TABLE woodgrove.silver.loans ADD CONSTRAINT valid_rate CHECK (rate BETWEEN 0 AND 0.25)`

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "The statement fails if an existing row has a rate outside the range."
        fr: "L'instruction échoue si une ligne existante a un taux hors de la plage."
    - id: b
      text:
        en: "After the constraint is added, an insert of 1,000 rows that include one invalid rate writes the 999 valid rows."
        fr: "Une fois la contrainte ajoutée, une insertion de 1 000 lignes comprenant un taux non valide écrit les 999 lignes valides."
    - id: c
      text:
        en: "The constraint can be replaced by one that calls a Python UDF to validate the rate."
        fr: "La contrainte peut être remplacée par une contrainte qui appelle une UDF Python pour valider le taux."
    - id: d
      text:
        en: "The constraint appears in the output of `SHOW TBLPROPERTIES` for the table."
        fr: "La contrainte apparaît dans la sortie de `SHOW TBLPROPERTIES` pour la table."
    - id: e
      text:
        en: "The constraint is checked for inserts but not for `MERGE` statements that update the rate."
        fr: "La contrainte est vérifiée pour les insertions, mais pas pour les instructions `MERGE` qui mettent à jour le taux."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      `ADD CONSTRAINT` verifies that all existing rows satisfy the expression before it adds the constraint, so one bad row makes the statement fail. `CHECK` constraints are listed by `SHOW TBLPROPERTIES` and `DESCRIBE DETAIL`.
    fr: |
      `ADD CONSTRAINT` vérifie que toutes les lignes existantes satisfont l'expression avant d'ajouter la contrainte : une seule ligne non conforme fait échouer l'instruction. Les contraintes `CHECK` sont listées par `SHOW TBLPROPERTIES` et `DESCRIBE DETAIL`.
  options:
    b:
      en: |
        A violation makes the whole transaction fail, so none of the 1,000 rows is written.
      fr: |
        Une violation fait échouer toute la transaction : aucune des 1 000 lignes n'est écrite.
    c:
      en: |
        A `CHECK` expression can't use user-defined functions; it accepts deterministic built-in functions only.
      fr: |
        Une expression `CHECK` ne peut pas utiliser de fonctions définies par l'utilisateur ; elle n'accepte que des fonctions intégrées déterministes.
    e:
      en: |
        Enforced constraints are checked on every write that adds or changes rows, including `MERGE` and `UPDATE`.
      fr: |
        Les contraintes appliquées sont vérifiées à chaque écriture qui ajoute ou modifie des lignes, y compris `MERGE` et `UPDATE`.
references:
  - title: Constraints on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/constraints
