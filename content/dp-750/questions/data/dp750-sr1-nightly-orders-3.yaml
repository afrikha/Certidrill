status: draft
stem:
  en: You schedule a CREATE OR REPLACE TABLE statement that reads the volume path with read_files.
  fr: Vous planifiez une instruction CREATE OR REPLACE TABLE qui lit le chemin du volume avec read_files.
body:
  solution:
    en: |
      The nightly statement is the following:

      ```sql
      CREATE OR REPLACE TABLE northwind.bronze.orders AS
      SELECT * FROM read_files('/Volumes/northwind/landing/raw/orders/', format => 'csv');
      ```
    fr: |
      L'instruction nocturne est la suivante :

      ```sql
      CREATE OR REPLACE TABLE northwind.bronze.orders AS
      SELECT * FROM read_files('/Volumes/northwind/landing/raw/orders/', format => 'csv');
      ```
answer: { value: false }
explanation:
  correct:
    en: Each run replaces the content of the table with the rows of the files currently in the volume, so a rerun creates no duplicates. However, the files are deleted after 14 days, so the rows of older files disappear from the current version of the table at the next run, which breaks the second requirement.
    fr: "Chaque exécution remplace le contenu de la table par les lignes des fichiers présents dans le volume : une réexécution ne crée pas de doublons. Toutefois, les fichiers sont supprimés après 14 jours : les lignes des fichiers plus anciens disparaissent de la version actuelle de la table à l'exécution suivante, ce qui enfreint la deuxième exigence."
references:
  - title: read_files table-valued function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/read_files
