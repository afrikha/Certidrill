id: dp750-3c-reshape-match
objective: "3.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is preparing gold tables from the silver layer of the **contoso** catalog with SQL queries on Databricks Runtime 17.3 LTS.

    Which technique should you use for each requirement? To answer, drag the appropriate techniques to the correct requirements. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prépare des tables gold à partir de la couche silver du catalogue **contoso** avec des requêtes SQL sur Databricks Runtime 17.3 LTS.

    Quelle technique devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les techniques appropriées vers les exigences correspondantes. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pivot, text: PIVOT }
    - { id: unpivot, text: UNPIVOT }
    - { id: unpivotnulls, text: UNPIVOT INCLUDE NULLS }
    - { id: denorm, text: { en: "Join the fact table to its dimension tables", fr: "Joindre la table de faits à ses tables de dimension" } }
    - { id: rollup, text: GROUP BY ROLLUP }
    - { id: unionall, text: UNION ALL }
  targets:
    - id: t_cols
      text: { en: "Turn one row per product and month into one row per product with one column per month", fr: "Transformer une ligne par produit et par mois en une ligne par produit avec une colonne par mois" }
    - id: t_rows
      text: { en: "Turn the columns jan to dec into one row per month, without rows for months that have no value", fr: "Transformer les colonnes jan à dec en une ligne par mois, sans lignes pour les mois qui n'ont pas de valeur" }
    - id: t_rowsnull
      text: { en: "Turn the columns jan to dec into one row per month, including a row with a null value for months that have no value", fr: "Transformer les colonnes jan à dec en une ligne par mois, y compris une ligne avec une valeur null pour les mois qui n'ont pas de valeur" }
    - id: t_wide
      text: { en: "Add the customer segment and product category to each sales row so that reports need no joins", fr: "Ajouter le segment client et la catégorie de produit à chaque ligne de vente afin que les rapports n'aient besoin d'aucune jointure" }
answer:
  mapping: { t_cols: pivot, t_rows: unpivot, t_rowsnull: unpivotnulls, t_wide: denorm }
explanation:
  correct:
    en: |
      PIVOT rotates the values of a column into separate columns. UNPIVOT rotates columns into rows; its default is EXCLUDE NULLS, which filters out the rows whose value is NULL, so keeping those rows requires INCLUDE NULLS. Denormalizing joins the dimension attributes into the facts so that reports read one wide table.
    fr: |
      PIVOT fait pivoter les valeurs d'une colonne en colonnes distinctes. UNPIVOT fait pivoter des colonnes en lignes ; sa valeur par défaut est EXCLUDE NULLS, qui élimine les lignes dont la valeur est NULL : conserver ces lignes exige donc INCLUDE NULLS. La dénormalisation joint les attributs des dimensions aux faits afin que les rapports lisent une seule table large.
  options:
    rollup:
      en: |
        ROLLUP adds subtotal and grand total rows; it does not move values between rows and columns.
      fr: |
        ROLLUP ajoute des lignes de sous-total et de total général ; il ne déplace pas de valeurs entre lignes et colonnes.
    unionall:
      en: |
        UNION ALL stacks the rows of queries with the same columns; it does not add dimension attributes to a row.
      fr: |
        UNION ALL empile les lignes de requêtes qui ont les mêmes colonnes ; il n'ajoute pas d'attributs de dimension à une ligne.
references:
  - title: UNPIVOT clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-unpivot
  - title: PIVOT clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-pivot
