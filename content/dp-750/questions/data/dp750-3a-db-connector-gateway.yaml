id: dp750-3a-db-connector-gateway
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso already ingests Salesforce objects with a Lakeflow Connect SaaS connector. You now plan to ingest the change stream of an Azure SQL database by using the Lakeflow Connect database (CDC) connector for SQL Server, with the standard gateway-based architecture.

    Which two components does the database connector use that the Salesforce connector does not use?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso ingère déjà des objets Salesforce avec un connecteur SaaS Lakeflow Connect. Vous prévoyez maintenant d'ingérer le flux de changements d'une base de données Azure SQL avec le connecteur de base de données (CDC) Lakeflow Connect pour SQL Server, dans l'architecture standard basée sur une passerelle.

    Quels sont les deux composants utilisés par le connecteur de base de données mais pas par le connecteur Salesforce ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Unity Catalog connection that stores the source credentials", fr: "Une connexion du catalogue Unity qui stocke les informations d'identification de la source" } }
    - { id: b, text: { en: "An ingestion gateway", fr: "Une passerelle d'ingestion" } }
    - { id: c, text: { en: "Streaming tables as destination tables", fr: "Des tables de streaming comme tables de destination" } }
    - { id: d, text: { en: "Staging storage that buffers the captured changes", fr: "Un stockage intermédiaire qui met en mémoire tampon les changements capturés" } }
    - { id: e, text: { en: "An ingestion pipeline", fr: "Un pipeline d'ingestion" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Database connectors read the transaction log continuously, so they add an ingestion gateway, which runs in its own job as a continuous task, and staging storage that buffers the captured changes. SaaS and file connectors use only a connection, an ingestion pipeline and destination tables.
    fr: |
      Les connecteurs de base de données lisent le journal des transactions en continu ; ils ajoutent donc une passerelle d'ingestion, qui s'exécute dans son propre job en tant que tâche continue, et un stockage intermédiaire qui met en mémoire tampon les changements capturés. Les connecteurs SaaS et de fichiers n'utilisent qu'une connexion, un pipeline d'ingestion et des tables de destination.
  options:
    a:
      en: |
        Both connector types use a Unity Catalog connection to store authentication details.
      fr: |
        Les deux types de connecteurs utilisent une connexion du catalogue Unity pour stocker les informations d'authentification.
    c:
      en: |
        Both connector types write to streaming tables.
      fr: |
        Les deux types de connecteurs écrivent dans des tables de streaming.
    e:
      en: |
        Both connector types use an ingestion pipeline that writes to the destination tables.
      fr: |
        Les deux types de connecteurs utilisent un pipeline d'ingestion qui écrit dans les tables de destination.
references:
  - title: Lakeflow Connect connector concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/
