id: dp750-3a-grain-design-steps
objective: "3.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is designing the fact table **northwind.gold.fact_shipments** in Unity Catalog. Most reports summarize shipments by week and warehouse, but some analyses need individual shipments.

    You need to design the table so that its grain is explicit and the common reports stay fast.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders conçoit la table de faits **northwind.gold.fact_shipments** dans le catalogue Unity. La plupart des rapports résument les expéditions par semaine et par entrepôt, mais certaines analyses nécessitent les expéditions individuelles.

    Vous devez concevoir la table de sorte que sa granularité soit explicite et que les rapports courants restent rapides.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: identify, text: { en: "Identify the most detailed level of analysis that the business requirements need.", fr: "Identifier le niveau d'analyse le plus détaillé requis par les exigences métier." } }
    - { id: declare, text: { en: "Write the grain statement of the fact table, for example one row per shipment.", fr: "Rédiger la déclaration de granularité de la table de faits, par exemple une ligne par expédition." } }
    - { id: columns, text: { en: "Add the dimension keys and measures that match the declared grain.", fr: "Ajouter les clés de dimension et les mesures qui correspondent à la granularité déclarée." } }
    - { id: mv, text: { en: "Create materialized views that aggregate the table by week and warehouse.", fr: "Créer des vues matérialisées qui agrègent la table par semaine et par entrepôt." } }
    - { id: weekly, text: { en: "Aggregate the source data by week and warehouse before loading the fact table.", fr: "Agréger les données source par semaine et par entrepôt avant de charger la table de faits." } }
    - { id: partition, text: { en: "Partition the fact table by shipment ID.", fr: "Partitionner la table de faits par ID d'expédition." } }
answer:
  sequence: [ identify, declare, columns, mv ]
explanation:
  correct:
    en: |
      The most detailed analysis required sets the minimum grain. Declare the grain explicitly before adding any columns, because the grain statement guides every later design decision; then add the keys and measures that match it. Aggregate tables, which materialized views can maintain, come last as a performance optimization over the atomic data.
    fr: |
      L'analyse la plus détaillée requise fixe la granularité minimale. Déclarez la granularité explicitement avant d'ajouter des colonnes, car la déclaration de granularité guide toutes les décisions de conception suivantes ; ajoutez ensuite les clés et les mesures qui lui correspondent. Les tables d'agrégats, que des vues matérialisées peuvent maintenir, viennent en dernier comme optimisation des performances sur les données atomiques.
  options:
    weekly:
      en: |
        Aggregating before the load loses the individual shipments that some analyses need.
      fr: |
        Agréger avant le chargement fait perdre les expéditions individuelles nécessaires à certaines analyses.
    partition:
      en: |
        A unique ID has very high cardinality and would create one tiny partition per shipment.
      fr: |
        Un ID unique a une cardinalité très élevée et créerait une minuscule partition par expédition.
references:
  - title: Choose granularity on a column or table based on requirements
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/9-choose-granularity
