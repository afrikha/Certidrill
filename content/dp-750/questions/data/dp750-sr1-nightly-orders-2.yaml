id: dp750-sr1-nightly-orders-2
objective: "3.2.3"
type: series_yesno
series: dp750-sr1-nightly-orders
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You schedule a COPY INTO statement that loads the volume path.
  fr: Vous planifiez une instruction COPY INTO qui charge le chemin du volume.
body:
  solution:
    en: |
      The nightly statement is the following:

      ```sql
      COPY INTO northwind.bronze.orders
      FROM '/Volumes/northwind/landing/raw/orders/'
      FILEFORMAT = CSV
      FORMAT_OPTIONS ('header' = 'true');
      ```
    fr: |
      L'instruction nocturne est la suivante :

      ```sql
      COPY INTO northwind.bronze.orders
      FROM '/Volumes/northwind/landing/raw/orders/'
      FILEFORMAT = CSV
      FORMAT_OPTIONS ('header' = 'true');
      ```
answer: { value: true }
explanation:
  correct:
    en: COPY INTO is retriable and idempotent; files of the source location that were already loaded are skipped on later runs, so each nightly run, or a rerun after a failure, loads only the new files. It appends to the existing table, so rows of files deleted from the volume stay in northwind.bronze.orders.
    fr: "COPY INTO peut être réessayé et est idempotent ; les fichiers de l'emplacement source déjà chargés sont ignorés lors des exécutions suivantes : chaque exécution nocturne, ou une réexécution après un échec, ne charge que les nouveaux fichiers. Il ajoute les lignes à la table existante : les lignes des fichiers supprimés du volume restent dans northwind.bronze.orders."
references:
  - title: Get started using COPY INTO to load data
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/copy-into/
