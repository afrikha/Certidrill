id: dp750-3c-eh-basic-tier
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Event Hubs namespace named **evhns-tailspin** in the Basic tier. The namespace contains an event hub named **flight-events**.

    A data engineer writes a notebook that reads **flight-events** with the built-in `kafka` source of Azure Databricks and the bootstrap server **evhns-tailspin.servicebus.windows.net:9093**, and writes the events to **tailspin.bronze.flight_events**. The authentication options are correct, but the query cannot connect to the namespace.

    You need to make the notebook work without changing its code.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un espace de noms Azure Event Hubs nommé **evhns-tailspin** au niveau Basic. L'espace de noms contient un hub d'événements nommé **flight-events**.

    Un ingénieur données écrit un notebook qui lit **flight-events** avec la source `kafka` intégrée d'Azure Databricks et le serveur d'amorçage **evhns-tailspin.servicebus.windows.net:9093**, puis écrit les événements dans **tailspin.bronze.flight_events**. Les options d'authentification sont correctes, mais la requête ne parvient pas à se connecter à l'espace de noms.

    Vous devez faire fonctionner le notebook sans modifier son code.

    Que devez-vous faire ?
body:
  options:
    - { id: c, text: { en: "Change the pricing tier of the namespace to Standard.", fr: "Passer l'espace de noms au niveau tarifaire Standard." } }
    - { id: a, text: { en: "Increase the number of throughput units of the namespace.", fr: "Augmenter le nombre d'unités de débit de l'espace de noms." } }
    - { id: b, text: { en: "Create a dedicated consumer group in flight-events for the notebook.", fr: "Créer un groupe de consommateurs dédié au notebook dans flight-events." } }
    - { id: d, text: { en: "Increase the number of partitions of flight-events.", fr: "Augmenter le nombre de partitions de flight-events." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Kafka endpoint of Event Hubs, on port 9093, exists only in the Standard, Premium and Dedicated tiers. A Basic namespace has no Kafka endpoint, so the built-in Kafka source of Azure Databricks cannot reach it until the namespace moves to Standard or a higher tier.
    fr: |
      Le point de terminaison Kafka d'Event Hubs, sur le port 9093, n'existe qu'aux niveaux Standard, Premium et Dedicated. Un espace de noms Basic n'a pas de point de terminaison Kafka : la source Kafka intégrée d'Azure Databricks ne peut donc pas l'atteindre tant que l'espace de noms n'est pas passé au niveau Standard ou à un niveau supérieur.
  options:
    a:
      en: |
        Throughput units add ingress and egress capacity; they do not add the Kafka endpoint that the Basic tier lacks.
      fr: |
        Les unités de débit ajoutent de la capacité d'entrée et de sortie ; elles n'ajoutent pas le point de terminaison Kafka qui manque au niveau Basic.
    b:
      en: |
        A consumer group gives the reader its own view of the stream, but the connection fails before any consumer group is used, because there is no Kafka endpoint.
      fr: |
        Un groupe de consommateurs donne au lecteur sa propre vue du flux, mais la connexion échoue avant qu'un groupe de consommateurs soit utilisé, car il n'y a pas de point de terminaison Kafka.
    d:
      en: |
        Partitions control parallelism; they do not change the protocols that the namespace accepts.
      fr: |
        Les partitions déterminent le parallélisme ; elles ne changent pas les protocoles acceptés par l'espace de noms.
references:
  - title: Apache Kafka Protocol Support in Azure Event Hubs
    url: https://learn.microsoft.com/en-us/azure/event-hubs/azure-event-hubs-apache-kafka-overview
