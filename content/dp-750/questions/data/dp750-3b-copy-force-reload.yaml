id: dp750-3b-copy-force-reload
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso loads files every night from **/Volumes/contoso/landing/raw/sales/** into the Delta table **contoso.bronze.sales** by using the following statement:

    ```sql
    COPY INTO contoso.bronze.sales
    FROM '/Volumes/contoso/landing/raw/sales/'
    FILEFORMAT = CSV
    FORMAT_OPTIONS ('header' = 'true');
    ```

    A faulty script deleted from contoso.bronze.sales all the rows that came from the files sales_20261110.csv, sales_20261111.csv and sales_20261112.csv. The three files are still in the volume.

    You need to load the rows of these three files again without duplicating the rows of the other files. What should you do?
  fr: |
    Contoso charge chaque nuit des fichiers de **/Volumes/contoso/landing/raw/sales/** dans la table Delta **contoso.bronze.sales** à l'aide de l'instruction suivante :

    ```sql
    COPY INTO contoso.bronze.sales
    FROM '/Volumes/contoso/landing/raw/sales/'
    FILEFORMAT = CSV
    FORMAT_OPTIONS ('header' = 'true');
    ```

    Un script défectueux a supprimé de contoso.bronze.sales toutes les lignes issues des fichiers sales_20261110.csv, sales_20261111.csv et sales_20261112.csv. Les trois fichiers sont toujours dans le volume.

    Vous devez charger de nouveau les lignes de ces trois fichiers sans dupliquer les lignes des autres fichiers. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the nightly statement again without changes.", fr: "Exécuter de nouveau l'instruction nocturne sans la modifier." } }
    - { id: b, text: { en: "Add FILES = ('sales_20261110.csv', 'sales_20261111.csv', 'sales_20261112.csv') to the statement and run it.", fr: "Ajouter FILES = ('sales_20261110.csv', 'sales_20261111.csv', 'sales_20261112.csv') à l'instruction et l'exécuter." } }
    - { id: c, text: { en: "Add COPY_OPTIONS ('force' = 'true') to the statement and run it.", fr: "Ajouter COPY_OPTIONS ('force' = 'true') à l'instruction et l'exécuter." } }
    - { id: d, text: { en: "Add FILES = ('sales_20261110.csv', 'sales_20261111.csv', 'sales_20261112.csv') and COPY_OPTIONS ('force' = 'true') to the statement and run it.", fr: "Ajouter FILES = ('sales_20261110.csv', 'sales_20261111.csv', 'sales_20261112.csv') et COPY_OPTIONS ('force' = 'true') à l'instruction et l'exécuter." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      COPY INTO is idempotent: files that were already loaded are skipped, even if the rows were later deleted from the table. The force copy option disables this behavior, and the FILES list restricts the load to the three files, so only their rows are loaded again.
    fr: |
      COPY INTO est idempotent : les fichiers déjà chargés sont ignorés, même si leurs lignes ont ensuite été supprimées de la table. L'option de copie force désactive ce comportement, et la liste FILES limite le chargement aux trois fichiers : seules leurs lignes sont chargées de nouveau.
  options:
    a:
      en: |
        The three files were already loaded, so the statement skips them.
      fr: |
        Les trois fichiers ont déjà été chargés : l'instruction les ignore.
    b:
      en: |
        Without force, the listed files are still skipped because they were already loaded.
      fr: |
        Sans force, les fichiers listés sont toujours ignorés, car ils ont déjà été chargés.
    c:
      en: |
        force without a file list reloads every file in the folder, which duplicates the rows of the other files.
      fr: |
        force sans liste de fichiers recharge tous les fichiers du dossier, ce qui duplique les lignes des autres fichiers.
references:
  - title: COPY INTO
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-copy-into
