id: dp750-3b-lc-statements
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Lakeflow Connect to ingest Salesforce objects and SQL Server tables into Unity Catalog. History tracking (SCD type 2) is on for the SQL Server table **dbo.accounts**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Lakeflow Connect pour ingérer des objets Salesforce et des tables SQL Server dans Unity Catalog. Le suivi de l'historique (SCD de type 2) est activé pour la table SQL Server **dbo.accounts**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Each schedule that you add to the Salesforce ingestion pipeline creates a Lakeflow Connect job that runs the pipeline as a task.
        fr: |
          Chaque planification que vous ajoutez au pipeline d'ingestion Salesforce crée un job Lakeflow Connect qui exécute le pipeline en tant que tâche.
    - id: s2
      text:
        en: |
          The Salesforce ingestion pipeline needs an ingestion gateway and staging storage to read the source.
        fr: |
          Le pipeline d'ingestion Salesforce a besoin d'une passerelle d'ingestion et d'un stockage intermédiaire pour lire la source.
    - id: s3
      text:
        en: |
          After a full refresh of dbo.accounts, the destination table still contains the row versions recorded before the refresh.
        fr: |
          Après une actualisation complète de dbo.accounts, la table de destination contient toujours les versions de lignes enregistrées avant l'actualisation.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Each schedule added to a managed ingestion pipeline creates a Lakeflow Connect job with the pipeline as a task. SaaS connectors such as Salesforce call the source APIs directly; only database connectors use an ingestion gateway and staging storage. A full refresh replaces the entire table and removes all previous row versions; history is tracked again from the refresh point.
    fr: |
      Chaque planification ajoutée à un pipeline d'ingestion managé crée un job Lakeflow Connect avec le pipeline comme tâche. Les connecteurs SaaS comme Salesforce appellent directement les API de la source ; seuls les connecteurs de base de données utilisent une passerelle d'ingestion et un stockage intermédiaire. Une actualisation complète remplace toute la table et supprime toutes les versions de lignes précédentes ; l'historique est de nouveau suivi à partir du point d'actualisation.
references:
  - title: Lakeflow Connect connector concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/
  - title: Enable history tracking (SCD type 2)
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/scd
