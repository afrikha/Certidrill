id: dp750-cs4a-tracking-method
objective: "3.1.1"
type: dragdrop
caseStudy: dp750-cs4a-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You plan to configure the Lakeflow Connect SQL Server connector to meet the policy ingestion requirement. You must enable a change tracking method on each source table in sqldb-policy.

    Which method should you enable for each table? To answer, drag the appropriate methods to the correct tables. Each method may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de configurer le connecteur SQL Server de Lakeflow Connect pour satisfaire l'exigence d'ingestion des contrats. Vous devez activer une méthode de suivi des modifications sur chaque table source de sqldb-policy.

    Quelle méthode devez-vous activer pour chaque table ? Pour répondre, faites glisser les méthodes appropriées vers les tables correspondantes. Chaque méthode peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: ct, text: { en: "Change tracking", fr: "Suivi des modifications (change tracking)" } }
    - { id: cdc, text: { en: "Change data capture (CDC)", fr: "Capture des changements de données (CDC)" } }
    - { id: temporal, text: { en: "System-versioned temporal table", fr: "Table temporelle avec version système" } }
  targets:
    - { id: policies, text: dbo.policies }
    - { id: coverages, text: dbo.coverages }
    - { id: events, text: dbo.policy_events }
answer:
  mapping: { policies: ct, coverages: ct, events: cdc }
explanation:
  correct:
    en: |
      Databricks recommends change tracking for every table that has a primary key, because it is lightweight on the source database, which meets the requirement to minimize the load on sqldb-policy. Change tracking requires a primary key, so dbo.policy_events, which has none, needs change data capture. If both methods are enabled on a table, the connector uses change tracking.
    fr: |
      Databricks recommande le suivi des modifications (change tracking) pour toute table qui possède une clé primaire, car il pèse peu sur la base source, ce qui répond à l'exigence de réduire la charge sur sqldb-policy. Le suivi des modifications exige une clé primaire : dbo.policy_events, qui n'en a pas, a donc besoin de la capture des changements de données (CDC). Si les deux méthodes sont activées sur une table, le connecteur utilise le suivi des modifications.
  options:
    cdc:
      en: |
        CDC works on tables with a primary key too, but it records every operation and can put more load on the source than change tracking.
      fr: |
        La CDC fonctionne aussi sur les tables dotées d'une clé primaire, mais elle enregistre chaque opération et peut charger davantage la source que le suivi des modifications.
    temporal:
      en: |
        A temporal table keeps history inside SQL Database; it is not one of the two methods that the SQL Server connector uses to read changes.
      fr: |
        Une table temporelle conserve l'historique dans SQL Database ; ce n'est pas l'une des deux méthodes que le connecteur SQL Server utilise pour lire les modifications.
references:
  - title: Configure Microsoft SQL Server for ingestion into Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/sql-server-source-setup
