id: dp750-3c-null-default-country
objective: "3.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum is building **adatum.silver.customers** from **adatum.bronze.customers** with a SQL query. The **country** column is null for some customers. Reports must show the text Unknown instead of a null country, and non-null countries must stay unchanged.

    Which two expressions can you use in the SELECT list? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum crée **adatum.silver.customers** à partir d'**adatum.bronze.customers** avec une requête SQL. La colonne **country** est null pour certains clients. Les rapports doivent afficher le texte Unknown au lieu d'un pays null, et les pays non null doivent rester inchangés.

    Quelles sont les deux expressions que vous pouvez utiliser dans la liste SELECT ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "coalesce(country, 'Unknown') AS country" }
    - { id: b, text: "nullif(country, 'Unknown') AS country" }
    - { id: c, text: "nvl2(country, 'Unknown', country) AS country" }
    - { id: d, text: "nvl(country, 'Unknown') AS country" }
    - { id: e, text: "isnull(country) AS country" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "`coalesce` returns its first non-null argument, so it returns the country when it exists and Unknown otherwise. `nvl(expr1, expr2)` returns `expr2` when `expr1` is null, which is the same result for two arguments."
    fr: "`coalesce` renvoie son premier argument non null : il renvoie le pays lorsqu'il existe et Unknown sinon. `nvl(expr1, expr2)` renvoie `expr2` lorsque `expr1` est null, ce qui donne le même résultat avec deux arguments."
  options:
    b:
      en: "`nullif` returns NULL when its two arguments are equal; it creates nulls instead of replacing them."
      fr: "`nullif` renvoie NULL lorsque ses deux arguments sont égaux ; il crée des null au lieu de les remplacer."
    c:
      en: "`nvl2` returns its second argument when the first is not null, so every known country would become Unknown, and nulls would stay null."
      fr: "`nvl2` renvoie son deuxième argument lorsque le premier n'est pas null : tous les pays connus deviendraient Unknown, et les null resteraient null."
    e:
      en: "`isnull` returns a Boolean that tells whether the value is null; it does not replace it."
      fr: "`isnull` renvoie un booléen qui indique si la valeur est null ; il ne la remplace pas."
references:
  - title: coalesce function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/coalesce
  - title: nvl2 function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/nvl2
