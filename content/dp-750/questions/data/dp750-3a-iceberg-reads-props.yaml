id: dp750-3a-iceberg-reads-props
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an existing Unity Catalog managed Delta table named **contoso.sales.orders**. The table does not use deletion vectors, and all writers run Databricks Runtime 15.4 LTS or above.

    A partner's analytics engine supports only Iceberg and must read the table. Delta must remain the primary format, and the data files must not be duplicated.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une table Delta managée du catalogue Unity nommée **contoso.sales.orders**. La table n'utilise pas de vecteurs de suppression, et tous les rédacteurs exécutent Databricks Runtime 15.4 LTS ou version ultérieure.

    Le moteur d'analytique d'un partenaire ne prend en charge qu'Iceberg et doit lire la table. Delta doit rester le format principal, et les fichiers de données ne doivent pas être dupliqués.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE contoso.sales.orders SET TBLPROPERTIES(
      'delta.columnMapping.mode' = [[cm]],
      [[compat]] = 'true',
      'delta.universalFormat.enabledFormats' = [[fmt]]);
  slots:
    - id: cm
      options:
        - { id: none, text: "'none'" }
        - { id: name, text: "'name'" }
        - { id: iceberg, text: "'iceberg'" }
    - id: compat
      options:
        - { id: compatv2, text: "'delta.enableIcebergCompatV2'" }
        - { id: dv, text: "'delta.enableDeletionVectors'" }
        - { id: cdf, text: "'delta.enableChangeDataFeed'" }
    - id: fmt
      options:
        - { id: fmticeberg, text: "'iceberg'" }
        - { id: fmtparquet, text: "'parquet'" }
        - { id: fmtdelta, text: "'delta'" }
answer:
  values: { cm: name, compat: compatv2, fmt: fmticeberg }
explanation:
  correct:
    en: |
      Iceberg reads (UniForm) generate Iceberg metadata asynchronously alongside the Delta metadata, without rewriting the Parquet files. They require column mapping, `delta.enableIcebergCompatV2` set to `true` and `delta.universalFormat.enabledFormats` set to `iceberg`; on an existing table, column mapping uses the `name` mode.
    fr: |
      Les lectures Iceberg (UniForm) génèrent des métadonnées Iceberg de façon asynchrone à côté des métadonnées Delta, sans réécrire les fichiers Parquet. Elles nécessitent le mappage de colonnes, `delta.enableIcebergCompatV2` défini sur `true` et `delta.universalFormat.enabledFormats` défini sur `iceberg` ; sur une table existante, le mappage de colonnes utilise le mode `name`.
  options:
    cm:
      en: |
        Column mapping must be enabled, so `none` fails, and `iceberg` is not a column mapping mode.
      fr: |
        Le mappage de colonnes doit être activé, donc `none` échoue, et `iceberg` n'est pas un mode de mappage de colonnes.
    compat:
      en: |
        Deletion vectors cannot be enabled on a table with Iceberg reads, and the change data feed has no role in generating Iceberg metadata.
      fr: |
        Les vecteurs de suppression ne peuvent pas être activés sur une table avec lectures Iceberg, et le flux de changements de données ne joue aucun rôle dans la génération des métadonnées Iceberg.
    fmt:
      en: |
        The enabled formats property lists the additional metadata formats to generate, here `iceberg`; Parquet is already the data file format.
      fr: |
        La propriété des formats activés liste les formats de métadonnées supplémentaires à générer, ici `iceberg` ; Parquet est déjà le format des fichiers de données.
references:
  - title: Read Delta Lake tables with Iceberg clients
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/uniform
