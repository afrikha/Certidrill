id: dp750-3c-setop-match
objective: "3.3.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam combines two queries that return the same columns: **q_web**, which reads **fabrikam.silver.web_orders**, and **q_store**, which reads **fabrikam.silver.store_orders**. The queries are written in the order q_web, then q_store.

    Which operator should you use between the two queries for each requirement? To answer, drag the appropriate operators to the correct requirements. Each operator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam combine deux requêtes qui renvoient les mêmes colonnes : **q_web**, qui lit **fabrikam.silver.web_orders**, et **q_store**, qui lit **fabrikam.silver.store_orders**. Les requêtes sont écrites dans l'ordre q_web, puis q_store.

    Quel opérateur devez-vous utiliser entre les deux requêtes pour chaque exigence ? Pour répondre, faites glisser les opérateurs appropriés vers les exigences correspondantes. Chaque opérateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: unionall, text: UNION ALL }
    - { id: union, text: UNION }
    - { id: intersect, text: INTERSECT }
    - { id: except, text: EXCEPT }
    - { id: cross, text: CROSS JOIN }
    - { id: full, text: FULL OUTER JOIN }
  targets:
    - id: all
      text: { en: "Return every row of both queries, duplicates included, at the lowest cost", fr: "Renvoyer toutes les lignes des deux requêtes, doublons compris, au moindre coût" }
    - id: uniq
      text: { en: "Return the rows of both queries, each distinct row only once", fr: "Renvoyer les lignes des deux requêtes, chaque ligne distincte une seule fois" }
    - id: both
      text: { en: "Return only the rows that both queries return", fr: "Renvoyer uniquement les lignes que les deux requêtes renvoient" }
    - id: webonly
      text: { en: "Return the rows of q_web that q_store does not return", fr: "Renvoyer les lignes de q_web que q_store ne renvoie pas" }
answer:
  mapping: { all: unionall, uniq: union, both: intersect, webonly: except }
explanation:
  correct:
    en: |
      UNION returns the rows of both subqueries; DISTINCT is the default for set operators, so UNION removes duplicates and UNION ALL keeps them without the cost of deduplication. INTERSECT returns the rows that are in both subqueries, and EXCEPT returns the rows of the first subquery that are not in the second.
    fr: |
      UNION renvoie les lignes des deux sous-requêtes ; DISTINCT est la valeur par défaut des opérateurs ensemblistes : UNION supprime donc les doublons, et UNION ALL les conserve sans le coût de la déduplication. INTERSECT renvoie les lignes présentes dans les deux sous-requêtes, et EXCEPT renvoie les lignes de la première sous-requête qui ne figurent pas dans la seconde.
  options:
    cross:
      en: |
        A cross join returns the Cartesian product of the two relations, not a combination of their rows.
      fr: |
        Une jointure CROSS JOIN renvoie le produit cartésien des deux relations, pas une combinaison de leurs lignes.
    full:
      en: |
        A full outer join places the matched columns side by side and needs a join condition; it does not stack rows.
      fr: |
        Une jointure FULL OUTER JOIN place côte à côte les colonnes correspondantes et nécessite une condition de jointure ; elle n'empile pas les lignes.
references:
  - title: Set operators
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-setops
