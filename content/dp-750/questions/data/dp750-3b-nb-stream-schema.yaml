id: dp750-3b-nb-stream-schema
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer at Northwind Traders writes the following streaming read in a notebook:

    ```python
    orders = (spark.readStream
        .format("csv")
        .option("header", "true")
        .load("/Volumes/northwind/landing/raw/orders/"))
    ```

    When the cell runs, it fails because no schema is specified. The stream must keep using the plain CSV file source, and the columns are known in advance.

    What should you add to the read?
  fr: |
    Un ingénieur données de Northwind Traders écrit la lecture en streaming suivante dans un notebook :

    ```python
    orders = (spark.readStream
        .format("csv")
        .option("header", "true")
        .load("/Volumes/northwind/landing/raw/orders/"))
    ```

    À l'exécution, la cellule échoue, car aucun schéma n'est spécifié. Le flux doit continuer d'utiliser la source de fichiers CSV simple, et les colonnes sont connues à l'avance.

    Que devez-vous ajouter à la lecture ?
body:
  options:
    - { id: a, text: '.option("cloudFiles.inferColumnTypes", "true")' }
    - { id: b, text: '.option("mergeSchema", "true")' }
    - { id: c, text: '.option("cloudFiles.schemaLocation", "/Volumes/northwind/landing/chk/orders_schema")' }
    - { id: d, text: '.schema("order_id BIGINT, store_id STRING, amount DECIMAL(10,2), order_ts TIMESTAMP")' }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Schema inference and evolution are a benefit of Auto Loader over Structured Streaming used directly on files: the plain CSV streaming source expects you to supply the schema. Because the columns are known, passing a DDL schema string to schema() defines the columns and their types and keeps the plain file source.
    fr: |
      L'inférence et l'évolution du schéma sont un avantage d'Auto Loader par rapport à Structured Streaming utilisé directement sur des fichiers : la source de streaming CSV simple attend que vous fournissiez le schéma. Comme les colonnes sont connues, passer une chaîne de schéma DDL à schema() définit les colonnes et leurs types et conserve la source de fichiers simple.
  options:
    a:
      en: |
        cloudFiles options apply only to the Auto Loader source (cloudFiles), not to the plain CSV source.
      fr: |
        Les options cloudFiles ne s'appliquent qu'à la source Auto Loader (cloudFiles), pas à la source CSV simple.
    b:
      en: |
        mergeSchema controls schema evolution of a Delta write; it doesn't give the reader a schema.
      fr: |
        mergeSchema contrôle l'évolution du schéma lors d'une écriture Delta ; il ne fournit pas de schéma au lecteur.
    c:
      en: |
        The schema location is an Auto Loader option and has no effect on the plain CSV source.
      fr: |
        L'emplacement du schéma est une option d'Auto Loader et n'a aucun effet sur la source CSV simple.
references:
  - title: What is Auto Loader?
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/
  - title: Configure schema inference and evolution in Auto Loader
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
