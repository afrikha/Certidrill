id: dp750-3c-except-not-in-null
objective: "3.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank keeps current customers in **woodgrove.silver.customers**, where **customer_id** is unique and NOT NULL. Customers migrated from a legacy system are listed in **woodgrove.legacy.migrated**, whose **customer_id** column contains some NULL values.

    You need a query that returns the **customer_id** of every current customer who is not listed in **woodgrove.legacy.migrated**.

    Which two queries return the correct result? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank conserve les clients actuels dans **woodgrove.silver.customers**, où **customer_id** est unique et NOT NULL. Les clients migrés depuis un système hérité sont listés dans **woodgrove.legacy.migrated**, dont la colonne **customer_id** contient quelques valeurs NULL.

    Vous avez besoin d'une requête qui renvoie le **customer_id** de chaque client actuel qui n'est pas listé dans **woodgrove.legacy.migrated**.

    Quelles sont les deux requêtes qui renvoient le résultat correct ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "SELECT customer_id FROM woodgrove.silver.customers EXCEPT SELECT customer_id FROM woodgrove.legacy.migrated" }
    - { id: b, text: "SELECT customer_id FROM woodgrove.silver.customers WHERE customer_id NOT IN (SELECT customer_id FROM woodgrove.legacy.migrated)" }
    - { id: c, text: "SELECT c.customer_id FROM woodgrove.silver.customers AS c LEFT ANTI JOIN woodgrove.legacy.migrated AS m ON c.customer_id = m.customer_id" }
    - { id: d, text: "SELECT customer_id FROM woodgrove.silver.customers INTERSECT SELECT customer_id FROM woodgrove.legacy.migrated" }
    - { id: e, text: "SELECT c.customer_id FROM woodgrove.silver.customers AS c LEFT SEMI JOIN woodgrove.legacy.migrated AS m ON c.customer_id = m.customer_id" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      EXCEPT returns the rows of the first query that are not in the second; a NULL in the second query cannot remove a non-null customer ID. A left anti join returns the left rows that have no match on the right, and a NULL key on the right never matches. Both return the current customers who were not migrated.
    fr: |
      EXCEPT renvoie les lignes de la première requête qui ne figurent pas dans la seconde ; un NULL dans la seconde requête ne peut pas supprimer un ID client non null. Une jointure anti gauche renvoie les lignes de gauche sans correspondance à droite, et une clé NULL à droite ne correspond jamais. Les deux renvoient les clients actuels qui n'ont pas été migrés.
  options:
    b:
      en: |
        NOT IN returns UNKNOWN when the list contains a NULL and does not contain the value, so the query returns no rows at all.
      fr: |
        NOT IN renvoie UNKNOWN lorsque la liste contient un NULL et ne contient pas la valeur : la requête ne renvoie donc aucune ligne.
    d:
      en: |
        INTERSECT returns the customers present in both tables, the opposite of the requirement.
      fr: |
        INTERSECT renvoie les clients présents dans les deux tables, l'inverse de l'exigence.
    e:
      en: |
        A left semi join returns the customers that have a match, the migrated ones.
      fr: |
        Une jointure semi gauche renvoie les clients qui ont une correspondance, c'est-à-dire les clients migrés.
references:
  - title: NULL semantics
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-null-semantics
  - title: Set operators
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-setops
