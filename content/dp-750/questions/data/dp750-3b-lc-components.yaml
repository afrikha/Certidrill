id: dp750-3b-lc-components
objective: "3.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso ingests tables from an Azure SQL database into Unity Catalog by using the Lakeflow Connect SQL Server connector with gateway-based change data capture.

    Which component matches each description? To answer, drag the appropriate components to the correct descriptions. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso ingère des tables d'une base de données Azure SQL dans Unity Catalog à l'aide du connecteur SQL Server de Lakeflow Connect avec une capture des changements de données basée sur une passerelle.

    Quel composant correspond à chaque description ? Pour répondre, faites glisser les composants appropriés vers les descriptions correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: connection, text: { en: Connection, fr: Connexion } }
    - { id: gateway, text: { en: Ingestion gateway, fr: Passerelle d'ingestion } }
    - { id: staging, text: { en: Staging storage, fr: Stockage intermédiaire } }
    - { id: pipeline, text: { en: Ingestion pipeline, fr: Pipeline d'ingestion } }
    - { id: foreign, text: { en: Foreign catalog, fr: Catalogue étranger } }
  targets:
    - id: t1
      text: { en: "Unity Catalog securable object that stores the authentication details for the database", fr: "Objet sécurisable Unity Catalog qui stocke les informations d'authentification de la base de données" }
    - id: t2
      text: { en: "Runs as a continuous task in its own job and captures the changes from the database", fr: "S'exécute comme une tâche continue dans son propre job et capture les modifications de la base de données" }
    - id: t3
      text: { en: "Holds the extracted changes until they are applied to the destination", fr: "Conserve les modifications extraites jusqu'à leur application à la destination" }
    - id: t4
      text: { en: "Runs on a schedule and writes the changes to streaming tables", fr: "S'exécute selon une planification et écrit les modifications dans des tables de streaming" }
answer:
  mapping: { t1: connection, t2: gateway, t3: staging, t4: pipeline }
explanation:
  correct:
    en: |
      The connection is a Unity Catalog securable that stores the authentication details for the source. For database connectors, the ingestion gateway runs continuously in its own job to capture changes, and staging storage holds them. The ingestion pipeline runs on its schedule, reads the staged changes and writes them to streaming tables. A foreign catalog belongs to Lakehouse Federation and query-based connectors.
    fr: |
      La connexion est un objet sécurisable Unity Catalog qui stocke les informations d'authentification de la source. Pour les connecteurs de base de données, la passerelle d'ingestion s'exécute en continu dans son propre job pour capturer les modifications, et le stockage intermédiaire les conserve. Le pipeline d'ingestion s'exécute selon sa planification, lit les modifications intermédiaires et les écrit dans des tables de streaming. Un catalogue étranger relève de Lakehouse Federation et des connecteurs basés sur les requêtes.
references:
  - title: Lakeflow Connect connector concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/
