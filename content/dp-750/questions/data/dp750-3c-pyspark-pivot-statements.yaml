id: dp750-3c-pyspark-pivot-statements
objective: "3.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores one row per order in **fabrikam.silver.orders**, with the columns **order_id**, **store_id**, **quarter** and **amount**. Every store has orders in every quarter. A PySpark notebook runs the following code.

    ```python
    df = spark.read.table("fabrikam.silver.orders")
    wide = df.groupBy("store_id").pivot("quarter").sum("amount")
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke une ligne par commande dans **fabrikam.silver.orders**, avec les colonnes **order_id**, **store_id**, **quarter** et **amount**. Chaque magasin a des commandes à chaque trimestre. Un notebook PySpark exécute le code suivant.

    ```python
    df = spark.read.table("fabrikam.silver.orders")
    wide = df.groupBy("store_id").pivot("quarter").sum("amount")
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Spark first computes the distinct values of quarter, which passing a list of values to pivot avoids.", fr: "Spark calcule d'abord les valeurs distinctes de quarter, ce que le passage d'une liste de valeurs à pivot évite." } }
    - { id: b, text: { en: "order_id becomes a grouping column, so wide contains one row per order.", fr: "order_id devient une colonne de regroupement : wide contient donc une ligne par commande." } }
    - { id: c, text: { en: "wide.unpivot(\"store_id\", None, \"quarter\", \"amount\") returns one row per store and quarter.", fr: "wide.unpivot(\"store_id\", None, \"quarter\", \"amount\") renvoie une ligne par magasin et par trimestre." } }
    - { id: d, text: { en: "Unpivoting wide restores the original order rows with their order_id.", fr: "L'application d'unpivot à wide restaure les lignes de commande d'origine avec leur order_id." } }
    - { id: e, text: { en: "wide contains one row per store and quarter, with an amount column.", fr: "wide contient une ligne par magasin et par trimestre, avec une colonne amount." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Without the `values` argument, `pivot` eagerly computes the distinct values of the pivot column to determine the schema; an explicit list avoids this computation. `unpivot` turns the wide format back into a long one, using all the columns that are not identifiers when `values` is not set, so it returns one row per store and quarter. The aggregation itself cannot be reversed.
    fr: |
      Sans l'argument `values`, `pivot` calcule immédiatement les valeurs distinctes de la colonne pivot pour déterminer le schéma ; une liste explicite évite ce calcul. `unpivot` retransforme le format large en format long, en utilisant toutes les colonnes qui ne sont pas des identificateurs lorsque `values` n'est pas défini : il renvoie donc une ligne par magasin et par trimestre. L'agrégation elle-même ne peut pas être annulée.
  options:
    b:
      en: |
        In PySpark, only the columns passed to groupBy are grouping columns; wide contains one row per store.
      fr: |
        En PySpark, seules les colonnes passées à groupBy sont des colonnes de regroupement ; wide contient une ligne par magasin.
    d:
      en: |
        The sum combined the orders; unpivot reverses the pivot but not the aggregation.
      fr: |
        La somme a combiné les commandes ; unpivot annule le pivot mais pas l'agrégation.
    e:
      en: |
        pivot rotates each quarter value into its own column, so wide has one row per store and one column per quarter.
      fr: |
        pivot fait de chaque valeur de trimestre une colonne distincte : wide a une ligne par magasin et une colonne par trimestre.
references:
  - title: pivot (GroupedData)
    url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/groupeddata/pivot
  - title: unpivot
    url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframe/unpivot
