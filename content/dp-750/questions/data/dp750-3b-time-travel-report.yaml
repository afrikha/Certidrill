id: dp750-3b-time-travel-report
objective: "3.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Unity Catalog managed table named **fabrikam.finance.ledger**. The table uses the default retention settings, and VACUUM runs with the default retention threshold.

    The finance team must rerun a report on the data exactly as it was on 2026-11-12 at 00:00, five days ago. The current content of the table must not change.

    Which statement should you run?
  fr: |
    Fabrikam dispose d'une table managée Unity Catalog nommée **fabrikam.finance.ledger**. La table utilise les paramètres de rétention par défaut, et VACUUM s'exécute avec le seuil de rétention par défaut.

    L'équipe financière doit réexécuter un rapport sur les données exactement telles qu'elles étaient le 2026-11-12 à 00:00, il y a cinq jours. Le contenu actuel de la table ne doit pas changer.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "RESTORE TABLE fabrikam.finance.ledger TO TIMESTAMP AS OF '2026-11-12'" }
    - { id: b, text: "SELECT * FROM table_changes('fabrikam.finance.ledger', '2026-11-12')" }
    - { id: c, text: "SELECT * FROM fabrikam.finance.ledger TIMESTAMP AS OF '2026-11-12'" }
    - { id: d, text: "DESCRIBE HISTORY fabrikam.finance.ledger" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Delta time travel returns the state of the table at a past timestamp without modifying it. Five days is within the default seven-day data file retention and the 30-day log retention, so the files of that version are still available.
    fr: |
      Le voyage dans le temps Delta renvoie l'état de la table à un horodatage passé sans la modifier. Cinq jours restent dans la rétention par défaut de sept jours des fichiers de données et de 30 jours du journal : les fichiers de cette version sont donc toujours disponibles.
  options:
    a:
      en: |
        RESTORE TABLE replaces the current state of the table with the past version, which changes the table.
      fr: |
        RESTORE TABLE remplace l'état actuel de la table par la version passée, ce qui modifie la table.
    b:
      en: |
        table_changes returns the row-level changes since a version or timestamp, not the state of the table, and requires change data feed.
      fr: |
        table_changes renvoie les modifications au niveau des lignes depuis une version ou un horodatage, pas l'état de la table, et exige le flux de données modifiées.
    d:
      en: |
        DESCRIBE HISTORY lists the operations made on the table (version, user, timestamp), not its data.
      fr: |
        DESCRIBE HISTORY liste les opérations effectuées sur la table (version, utilisateur, horodatage), pas ses données.
references:
  - title: Work with table history
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/history
