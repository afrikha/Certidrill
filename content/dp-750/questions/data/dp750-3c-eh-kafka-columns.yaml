id: dp750-3c-eh-kafka-columns
objective: "3.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam sends JSON telemetry events to an event hub named **turbines** in the Standard tier namespace **evhns-fabrikam**. A notebook reads the event hub with `spark.readStream.format("kafka")`, subscribes to **turbines** and assigns the result to a DataFrame named **raw**. You plan to parse the events before you write them to **fabrikam.bronze.turbine_events**.

    Which two statements about **raw** are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam envoie des événements de télémétrie JSON vers un hub d'événements nommé **turbines** dans l'espace de noms de niveau Standard **evhns-fabrikam**. Un notebook lit le hub d'événements avec `spark.readStream.format("kafka")`, s'abonne à **turbines** et affecte le résultat à un DataFrame nommé **raw**. Vous prévoyez d'analyser les événements avant de les écrire dans **fabrikam.bronze.turbine_events**.

    Quelles sont les deux affirmations vraies concernant **raw** ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The value column holds the event body as binary data that must be cast or decoded before from_json can parse it.", fr: "La colonne value contient le corps de l'événement sous forme de données binaires à convertir ou décoder avant que from_json puisse l'analyser." } }
    - { id: b, text: { en: "The value column holds the event body as a string that from_json can parse without any conversion.", fr: "La colonne value contient le corps de l'événement sous forme de chaîne que from_json peut analyser sans aucune conversion." } }
    - { id: c, text: { en: "The topic column holds the name of the event hub that each event was read from.", fr: "La colonne topic contient le nom du hub d'événements à partir duquel chaque événement a été lu." } }
    - { id: d, text: { en: "The partition column holds the name of the Event Hubs namespace that each event was read from.", fr: "La colonne partition contient le nom de l'espace de noms Event Hubs à partir duquel chaque événement a été lu." } }
    - { id: e, text: { en: "The DataFrame contains one column for each top-level field of the JSON event body.", fr: "Le DataFrame contient une colonne pour chaque champ de premier niveau du corps JSON de l'événement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The Kafka source returns a fixed schema: `key` and `value` as binary, `topic` as a string, `partition` as an integer, `offset`, `timestamp` and `timestampType`. Because Event Hubs maps a Kafka topic to an event hub, `topic` contains **turbines**, and the body in `value` must be cast to a string (or decoded) before `from_json` extracts its fields.
    fr: |
      La source Kafka renvoie un schéma fixe : `key` et `value` en binaire, `topic` en chaîne, `partition` en entier, `offset`, `timestamp` et `timestampType`. Comme Event Hubs fait correspondre un topic Kafka à un hub d'événements, `topic` contient **turbines**, et le corps contenu dans `value` doit être converti en chaîne (ou décodé) avant que `from_json` en extraie les champs.
  options:
    b:
      en: |
        Keys and values are always deserialized as byte arrays; you must cast `value` to a string first.
      fr: |
        Les clés et les valeurs sont toujours désérialisées en tableaux d'octets ; vous devez d'abord convertir `value` en chaîne.
    d:
      en: |
        The partition column is an integer partition ID; the namespace corresponds to the Kafka cluster in the bootstrap server, not to a column.
      fr: |
        La colonne partition est un ID de partition entier ; l'espace de noms correspond au cluster Kafka du serveur d'amorçage, pas à une colonne.
    e:
      en: |
        The source does not infer the payload schema; the JSON fields appear only after you parse `value` with a schema.
      fr: |
        La source n'infère pas le schéma de la charge utile ; les champs JSON n'apparaissent qu'après l'analyse de `value` avec un schéma.
references:
  - title: Connect to Apache Kafka
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/streaming/kafka
  - title: Apache Kafka Protocol Support in Azure Event Hubs
    url: https://learn.microsoft.com/en-us/azure/event-hubs/azure-event-hubs-apache-kafka-overview
