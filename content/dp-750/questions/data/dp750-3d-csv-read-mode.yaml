id: dp750-3d-csv-read-mode
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys loads a daily CSV file from **/Volumes/tailspin/finance/landing/rates/** by using a batch read in a notebook. The notebook passes the schema `"currency STRING, rate DECIMAL(10,6), rate_day DATE"` to the reader.

    You need to ensure that the read fails as soon as a value doesn't match the data type of its column, for example a `rate` value of `"n/a"`, so that no partial data is loaded.

    Which reader option should you add?
  fr: |
    Tailspin Toys charge un fichier CSV quotidien depuis **/Volumes/tailspin/finance/landing/rates/** à l'aide d'une lecture par lots dans un notebook. Le notebook transmet au lecteur le schéma `"currency STRING, rate DECIMAL(10,6), rate_day DATE"`.

    Vous devez faire en sorte que la lecture échoue dès qu'une valeur ne correspond pas au type de données de sa colonne, par exemple une valeur `rate` égale à `"n/a"`, afin qu'aucune donnée partielle ne soit chargée.

    Quelle option de lecteur devez-vous ajouter ?
body:
  options:
    - { id: a, text: "`.option(\"mode\", \"PERMISSIVE\")`" }
    - { id: b, text: "`.option(\"mode\", \"DROPMALFORMED\")`" }
    - { id: c, text: "`.option(\"mode\", \"FAILFAST\")`" }
    - { id: d, text: "`.option(\"rescuedDataColumn\", \"_rescued_data\")`" }
answer:
  optionId: c
explanation:
  correct:
    en: |
      With a schema, the CSV reader treats a field that doesn't parse as its type as malformed. The `FAILFAST` mode aborts the read when any malformed data is found, so nothing is loaded from the file.
    fr: |
      Avec un schéma, le lecteur CSV considère comme mal formé un champ qui ne s'analyse pas selon son type. Le mode `FAILFAST` interrompt la lecture dès qu'une donnée mal formée est trouvée : rien n'est chargé depuis le fichier.
  options:
    a:
      en: |
        `PERMISSIVE`, the default mode, inserts NULL for the fields that can't be parsed and keeps reading.
      fr: |
        `PERMISSIVE`, le mode par défaut, insère NULL pour les champs qui ne peuvent pas être analysés et poursuit la lecture.
    b:
      en: |
        `DROPMALFORMED` silently drops the lines that contain unparsable fields, so the other lines are loaded.
      fr: |
        `DROPMALFORMED` supprime silencieusement les lignes qui contiennent des champs non analysables : les autres lignes sont chargées.
    d:
      en: |
        With a rescued data column, type mismatches are no longer treated as corrupt: the value goes to `_rescued_data` and the read doesn't fail.
      fr: |
        Avec une colonne de données récupérées, les incompatibilités de type ne sont plus considérées comme corrompues : la valeur va dans `_rescued_data` et la lecture n'échoue pas.
references:
  - title: Read and write CSV files
    url: https://learn.microsoft.com/en-us/azure/databricks/query/formats/csv
