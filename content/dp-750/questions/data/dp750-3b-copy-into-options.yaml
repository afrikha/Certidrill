id: dp750-3b-copy-into-options
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam receives CSV files that have a header row in the volume path **/Volumes/fabrikam/landing/raw/feeds/**. The folder contains the files of several feeds. The Delta table **fabrikam.bronze.returns** already exists.

    You need to load into fabrikam.bronze.returns only the files whose names match `returns_*.csv`. When the files contain new columns, the columns must be added to the table.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam reçoit des fichiers CSV avec une ligne d'en-tête dans le chemin de volume **/Volumes/fabrikam/landing/raw/feeds/**. Le dossier contient les fichiers de plusieurs flux. La table Delta **fabrikam.bronze.returns** existe déjà.

    Vous devez charger dans fabrikam.bronze.returns uniquement les fichiers dont le nom correspond à `returns_*.csv`. Quand les fichiers contiennent de nouvelles colonnes, celles-ci doivent être ajoutées à la table.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    COPY INTO fabrikam.bronze.returns
    FROM '/Volumes/fabrikam/landing/raw/feeds/'
    FILEFORMAT = [[ff]]
    [[sel]] 'returns_*.csv'
    FORMAT_OPTIONS ('header' = 'true', 'inferSchema' = 'true')
    COPY_OPTIONS ('[[opt]]' = 'true');
  slots:
    - id: ff
      options:
        - { id: csv, text: CSV }
        - { id: text, text: TEXT }
        - { id: delta, text: DELTA }
    - id: sel
      options:
        - { id: pattern, text: PATTERN = }
        - { id: files, text: FILES = }
        - { id: validate, text: VALIDATE }
    - id: opt
      options:
        - { id: merge, text: mergeSchema }
        - { id: force, text: force }
        - { id: overwrite, text: overwriteSchema }
answer:
  values: { ff: csv, sel: pattern, opt: merge }
explanation:
  correct:
    en: |
      FILEFORMAT = CSV reads the files with the CSV reader, and the header option is passed in FORMAT_OPTIONS. PATTERN takes a glob pattern that selects the matching files. The mergeSchema copy option lets the schema of the table evolve to match the incoming data.
    fr: |
      FILEFORMAT = CSV lit les fichiers avec le lecteur CSV, et l'option d'en-tête est passée dans FORMAT_OPTIONS. PATTERN prend un modèle glob qui sélectionne les fichiers correspondants. L'option de copie mergeSchema permet au schéma de la table d'évoluer en fonction des données entrantes.
  options:
    text: { en: "TEXT loads each line into a single value column, without parsing the CSV columns.", fr: "TEXT charge chaque ligne dans une seule colonne value, sans analyser les colonnes CSV." }
    delta: { en: "DELTA isn't a COPY INTO file format.", fr: "DELTA n'est pas un format de fichier de COPY INTO." }
    files: { en: "FILES takes a list of file names in parentheses, not a glob pattern.", fr: "FILES prend une liste de noms de fichiers entre parenthèses, pas un modèle glob." }
    validate: { en: "VALIDATE checks the data without writing it; it doesn't select files.", fr: "VALIDATE vérifie les données sans les écrire ; il ne sélectionne pas de fichiers." }
    force: { en: "force disables idempotency and reloads files that were already loaded.", fr: "force désactive l'idempotence et recharge les fichiers déjà chargés." }
    overwrite: { en: "overwriteSchema isn't a COPY INTO copy option.", fr: "overwriteSchema n'est pas une option de copie de COPY INTO." }
references:
  - title: COPY INTO
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-copy-into
