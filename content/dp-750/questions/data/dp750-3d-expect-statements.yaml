id: dp750-3d-expect-statements
objective: "3.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs a triggered Lakeflow Spark Declarative Pipelines pipeline that contains two independent flows. The streaming table **woodgrove.silver.transfers** has the expectation `CONSTRAINT valid_amount EXPECT (amount > 0) ON VIOLATION FAIL UPDATE`. The other flow loads **woodgrove.silver.fx_rates** in parallel.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank exécute un pipeline Lakeflow Spark Declarative Pipelines déclenché qui contient deux flux indépendants. La table de streaming **woodgrove.silver.transfers** a l'attente `CONSTRAINT valid_amount EXPECT (amount > 0) ON VIOLATION FAIL UPDATE`. L'autre flux charge **woodgrove.silver.fx_rates** en parallèle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When a transfer has an amount of 0, the Data quality tab of the transfers dataset shows the number of failed records for that update.
        fr: |
          Quand un virement a un montant de 0, l'onglet Data quality du jeu de données transfers affiche le nombre d'enregistrements en échec pour cette mise à jour.
    - id: s2
      text:
        en: |
          The constraint of valid_amount can be changed to `amount > 0 AND account_id IN (SELECT account_id FROM woodgrove.silver.accounts)`.
        fr: |
          La contrainte de valid_amount peut être remplacée par `amount > 0 AND account_id IN (SELECT account_id FROM woodgrove.silver.accounts)`.
    - id: s3
      text:
        en: |
          When the transfers flow fails because of valid_amount, the fx_rates flow can still complete its update.
        fr: |
          Quand le flux transfers échoue à cause de valid_amount, le flux fx_rates peut quand même terminer sa mise à jour.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      A fail expectation records no metrics, because the update that would report them doesn't complete; the error message identifies the violated expectation instead. An expectation constraint is a SQL Boolean expression evaluated per record and can't contain a subquery that references another table. In a triggered pipeline, a flow that fails on an expectation doesn't make the other parallel flows fail.
    fr: |
      Une attente d'échec n'enregistre aucune métrique, car la mise à jour qui les communiquerait ne se termine pas ; le message d'erreur identifie à la place l'attente violée. La contrainte d'une attente est une expression booléenne SQL évaluée par enregistrement et ne peut pas contenir de sous-requête qui référence une autre table. Dans un pipeline déclenché, un flux qui échoue sur une attente ne fait pas échouer les autres flux parallèles.
references:
  - title: Manage data quality with pipeline expectations
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations
