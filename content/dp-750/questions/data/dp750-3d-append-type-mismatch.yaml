id: dp750-3d-append-type-mismatch
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Delta table named **northwind.silver.stock_levels** in which the `quantity` column is an `INT`. A notebook reads a CSV file without a schema and without schema inference, so every column of the resulting DataFrame `df` is a `STRING`.

    The notebook then runs `df.write.mode("append").saveAsTable("northwind.silver.stock_levels")`. No schema evolution option or setting is configured.

    What is the result of the write?
  fr: |
    Northwind Traders dispose d'une table Delta nommée **northwind.silver.stock_levels** dans laquelle la colonne `quantity` est de type `INT`. Un notebook lit un fichier CSV sans schéma et sans inférence de schéma : chaque colonne du DataFrame `df` obtenu est donc de type `STRING`.

    Le notebook exécute ensuite `df.write.mode("append").saveAsTable("northwind.silver.stock_levels")`. Aucune option ni aucun paramètre d'évolution du schéma n'est configuré.

    Quel est le résultat de l'écriture ?
body:
  options:
    - id: a
      text:
        en: "The `quantity` values are converted to `INT`, and the values that aren't valid integers are written as NULL."
        fr: "Les valeurs `quantity` sont converties en `INT`, et les valeurs qui ne sont pas des entiers valides sont écrites comme NULL."
    - id: b
      text:
        en: "The type of the `quantity` column changes to `STRING`, and all the rows are appended."
        fr: "Le type de la colonne `quantity` devient `STRING`, et toutes les lignes sont ajoutées."
    - id: c
      text:
        en: "The write fails with a schema mismatch error, and no rows are appended."
        fr: "L'écriture échoue avec une erreur d'incompatibilité de schéma, et aucune ligne n'est ajoutée."
    - id: d
      text:
        en: "The rows are appended, and the `quantity` values that aren't valid integers are written to the `_rescued_data` column."
        fr: "Les lignes sont ajoutées, et les valeurs `quantity` qui ne sont pas des entiers valides sont écrites dans la colonne `_rescued_data`."
answer:
  optionId: c
explanation:
  correct:
    en: |
      Delta Lake schema enforcement rejects a write whose column types are incompatible with the table schema, and because the write is a single transaction, nothing is appended. Cast the column explicitly, for example with `try_cast`, before writing, or read the file with a schema.
    fr: |
      L'application du schéma de Delta Lake rejette une écriture dont les types de colonnes sont incompatibles avec le schéma de la table, et comme l'écriture est une transaction unique, rien n'est ajouté. Convertissez la colonne explicitement, par exemple avec `try_cast`, avant l'écriture, ou lisez le fichier avec un schéma.
  options:
    a:
      en: |
        The write doesn't convert values silently; converting with NULL for invalid values is what `try_cast` does when you call it.
      fr: |
        L'écriture ne convertit pas les valeurs silencieusement ; la conversion avec NULL pour les valeurs non valides est ce que fait `try_cast` quand vous l'appelez.
    b:
      en: |
        Even schema evolution doesn't change an `INT` column to `STRING`; replacing a column type requires an overwrite with `overwriteSchema`.
      fr: |
        Même l'évolution du schéma ne change pas une colonne `INT` en `STRING` ; remplacer le type d'une colonne nécessite un remplacement avec `overwriteSchema`.
    d:
      en: |
        The rescued data column is a feature of file readers such as Auto Loader, not of writes to a Delta table.
      fr: |
        La colonne de données récupérées est une fonctionnalité des lecteurs de fichiers comme Auto Loader, pas des écritures dans une table Delta.
references:
  - title: Update table schemas with schema evolution
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/update-schema
