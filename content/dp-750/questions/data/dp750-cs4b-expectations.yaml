id: dp750-cs4b-expectations
objective: "3.4.4"
type: yesno_statements
caseStudy: dp750-cs4b-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You are defining machine_readings in the SQL source of pl-telemetry to meet the data quality requirement. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez machine_readings dans le code source SQL de pl-telemetry pour satisfaire l'exigence de qualité des données. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          For the water temperature rule, you should add `CONSTRAINT temp_present EXPECT (water_temp_c IS NOT NULL) ON VIOLATION DROP ROW`.
        fr: |
          Pour la règle de température de l'eau, vous devez ajouter `CONSTRAINT temp_present EXPECT (water_temp_c IS NOT NULL) ON VIOLATION DROP ROW`.
    - id: s2
      text:
        en: |
          For the pressure rule, you should add `CONSTRAINT pressure_range EXPECT (pressure_bar BETWEEN 7 AND 11) ON VIOLATION FAIL UPDATE`.
        fr: |
          Pour la règle de pression, vous devez ajouter `CONSTRAINT pressure_range EXPECT (pressure_bar BETWEEN 7 AND 11) ON VIOLATION FAIL UPDATE`.
    - id: s3
      text:
        en: |
          When the machine_id expectation stops an update of machine_readings, the readings of that update that passed every expectation are still written to the table.
        fr: |
          Quand l'attente sur machine_id arrête une mise à jour de machine_readings, les mesures de cette mise à jour qui ont satisfait toutes les attentes sont quand même écrites dans la table.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      ON VIOLATION DROP ROW removes invalid records before they are written and logs the number dropped. The pressure rule needs the default warn action, an EXPECT clause without ON VIOLATION, which writes invalid records and records them in the data quality metrics; FAIL UPDATE would stop the update. The machine_id rule uses ON VIOLATION FAIL UPDATE, and a failed table update is rolled back atomically, so no reading of that update is written.
    fr: |
      ON VIOLATION DROP ROW supprime les enregistrements non valides avant leur écriture et journalise le nombre d'enregistrements supprimés. La règle de pression nécessite l'action par défaut (avertissement), une clause EXPECT sans ON VIOLATION, qui écrit les enregistrements non valides et les comptabilise dans les métriques de qualité des données ; FAIL UPDATE arrêterait la mise à jour. La règle sur machine_id utilise ON VIOLATION FAIL UPDATE, et une mise à jour de table en échec est annulée de façon atomique : aucune mesure de cette mise à jour n'est écrite.
references:
  - title: Manage data quality with pipeline expectations
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations
