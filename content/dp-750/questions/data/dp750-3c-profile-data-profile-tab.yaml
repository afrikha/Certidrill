id: dp750-3c-profile-data-profile-tab
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer at Northwind Traders explores the new table **northwind.bronze.shipments** in a Python notebook attached to a cluster that runs Databricks Runtime 17.3 LTS. Before writing any cleansing logic, the engineer wants to see summary statistics and a histogram of the value distribution for every numeric, string and date column.

    The engineer wants to write no code other than reading the table into a DataFrame named **df**.

    What should the engineer do?
  fr: |
    Un ingénieur données de Northwind Traders explore la nouvelle table **northwind.bronze.shipments** dans un notebook Python attaché à un cluster qui exécute Databricks Runtime 17.3 LTS. Avant d'écrire toute logique de nettoyage, l'ingénieur veut voir des statistiques récapitulatives et un histogramme de la distribution des valeurs pour chaque colonne numérique, de chaîne et de date.

    L'ingénieur ne veut écrire aucun code autre que la lecture de la table dans un DataFrame nommé **df**.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Run df.summary() and read the percentiles in the output.", fr: "Exécuter df.summary() et lire les centiles dans la sortie." } }
    - { id: b, text: { en: "Run DESCRIBE TABLE EXTENDED on the table in a SQL cell.", fr: "Exécuter DESCRIBE TABLE EXTENDED sur la table dans une cellule SQL." } }
    - { id: c, text: { en: "Run df.describe() and read the statistics in the output.", fr: "Exécuter df.describe() et lire les statistiques dans la sortie." } }
    - { id: d, text: { en: "Run display(df), then select + > Data Profile next to Table in the output.", fr: "Exécuter display(df), puis sélectionner + > Data Profile à côté de Table dans la sortie." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In Databricks Runtime 9.1 LTS and above, the output of `display(df)` offers **+ > Data Profile** next to **Table**. It runs a command that generates summary statistics for numeric, string and date columns and histograms of the value distribution of each column.
    fr: |
      Dans Databricks Runtime 9.1 LTS et versions ultérieures, la sortie de `display(df)` propose **+ > Data Profile** à côté de **Table**. Cette option exécute une commande qui génère des statistiques récapitulatives pour les colonnes numériques, de chaîne et de date, ainsi que des histogrammes de la distribution des valeurs de chaque colonne.
  options:
    a:
      en: "`summary()` returns a table of statistics, including percentiles, but no histograms."
      fr: "`summary()` renvoie un tableau de statistiques, y compris des centiles, mais aucun histogramme."
    b:
      en: |
        DESCRIBE TABLE EXTENDED shows the columns, their types and the table metadata, not the distribution of the values.
      fr: |
        DESCRIBE TABLE EXTENDED affiche les colonnes, leurs types et les métadonnées de la table, pas la distribution des valeurs.
    c:
      en: "`describe()` returns count, mean, standard deviation, minimum and maximum, but no histograms."
      fr: "`describe()` renvoie le nombre, la moyenne, l'écart type, le minimum et le maximum, mais aucun histogramme."
references:
  - title: "Tutorial: EDA techniques using Databricks notebooks"
    url: https://learn.microsoft.com/en-us/azure/databricks/notebooks/eda-tutorial
