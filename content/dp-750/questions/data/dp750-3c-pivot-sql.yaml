id: dp750-3c-pivot-sql
objective: "3.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys stores bookings in **tailspin.silver.bookings**, with one row per booking and the columns **booking_id**, **agency_id**, **year**, **month** (an INT from 1 to 12) and **amount**.

    You need a query that returns one row per agency and year, with the columns **jan**, **feb** and **mar** that contain the total booking amount of each of the first three months.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys stocke les réservations dans **tailspin.silver.bookings**, avec une ligne par réservation et les colonnes **booking_id**, **agency_id**, **year**, **month** (un INT de 1 à 12) et **amount**.

    Vous avez besoin d'une requête qui renvoie une ligne par agence et par année, avec les colonnes **jan**, **feb** et **mar** qui contiennent le montant total des réservations de chacun des trois premiers mois.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT agency_id, year, jan, feb, mar
    FROM (SELECT [[cols]] FROM tailspin.silver.bookings) AS b
    PIVOT (sum(amount) AS total
      FOR [[forcol]]
      IN ([[vals]]));
  slots:
    - id: cols
      options:
        - { id: star, text: "*" }
        - { id: needed, text: "agency_id, year, month, amount" }
        - { id: nomonth, text: "agency_id, year, amount" }
    - id: forcol
      options:
        - { id: month, text: month }
        - { id: year, text: year }
        - { id: agency, text: agency_id }
    - id: vals
      options:
        - { id: aliases, text: "1 AS jan, 2 AS feb, 3 AS mar" }
        - { id: strings, text: "'jan', 'feb', 'mar'" }
        - { id: names, text: "jan, feb, mar" }
answer:
  values: { cols: needed, forcol: month, vals: aliases }
explanation:
  correct:
    en: |
      PIVOT rotates the values of the FOR column into separate columns, and every input column that is not used in the aggregate or in the FOR list becomes a grouping column. The subquery must therefore keep only agency_id and year as grouping columns, plus month and amount. The IN list contains literal month numbers, and each alias names the generated column.
    fr: |
      PIVOT fait pivoter les valeurs de la colonne FOR en colonnes distinctes, et chaque colonne d'entrée qui n'est utilisée ni dans l'agrégat ni dans la liste FOR devient une colonne de regroupement. La sous-requête ne doit donc conserver qu'agency_id et year comme colonnes de regroupement, plus month et amount. La liste IN contient des numéros de mois littéraux, et chaque alias nomme la colonne générée.
  options:
    star:
      en: |
        With every column, booking_id becomes a grouping column, so the query returns one row per booking instead of one row per agency and year.
      fr: |
        Avec toutes les colonnes, booking_id devient une colonne de regroupement : la requête renvoie une ligne par réservation au lieu d'une ligne par agence et par année.
    nomonth:
      en: |
        The FOR column must be in the input of PIVOT; without month there is nothing to rotate.
      fr: |
        La colonne FOR doit figurer dans l'entrée de PIVOT ; sans month, il n'y a rien à faire pivoter.
    year:
      en: |
        Pivoting on year creates one column per year instead of one column per month.
      fr: |
        Pivoter sur year crée une colonne par année au lieu d'une colonne par mois.
    agency:
      en: |
        Pivoting on agency_id creates one column per agency.
      fr: |
        Pivoter sur agency_id crée une colonne par agence.
    strings:
      en: |
        month contains integers, so the strings jan, feb and mar never match a month value.
      fr: |
        month contient des entiers : les chaînes jan, feb et mar ne correspondent jamais à une valeur de mois.
    names:
      en: |
        Pivot values must be literals; jan, feb and mar are not literals or columns of the input.
      fr: |
        Les valeurs de pivot doivent être des littéraux ; jan, feb et mar ne sont ni des littéraux ni des colonnes de l'entrée.
references:
  - title: PIVOT clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-pivot
