id: dp750-3a-managed-iceberg-write
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware shares the table **litware.supply.shipments** with partner teams that use Trino and Apache Flink. Those engines must both read and write the table through the Iceberg REST Catalog API.

    Azure Databricks jobs must also write to the table, and Unity Catalog must manage the table's metadata and data files. The workspace has serverless compute and predictive optimization enabled.

    How should you create the table?
  fr: |
    Litware partage la table **litware.supply.shipments** avec des équipes partenaires qui utilisent Trino et Apache Flink. Ces moteurs doivent à la fois lire et écrire la table au moyen de l'API Iceberg REST Catalog.

    Des jobs Azure Databricks doivent aussi écrire dans la table, et le catalogue Unity doit gérer les métadonnées et les fichiers de données de la table. Le calcul serverless et l'optimisation prédictive sont activés dans l'espace de travail.

    Comment devez-vous créer la table ?
body:
  options:
    - { id: a, text: { en: "As a managed Delta table with Iceberg reads (UniForm) enabled", fr: "Comme une table Delta managée avec les lectures Iceberg (UniForm) activées" } }
    - { id: b, text: { en: "As an external Parquet table in an external location", fr: "Comme une table Parquet externe dans un emplacement externe" } }
    - { id: c, text: { en: "As a managed table created with `USING iceberg`", fr: "Comme une table managée créée avec `USING iceberg`" } }
    - { id: d, text: { en: "As a foreign Iceberg table through catalog federation", fr: "Comme une table Iceberg étrangère au moyen de la fédération de catalogues" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Unity Catalog managed Iceberg table, created with `USING iceberg`, is governed by Unity Catalog and accessible through the Iceberg REST Catalog API for read and write operations from external engines such as Trino or Flink. It requires serverless compute and predictive optimization, which are enabled.
    fr: |
      Une table Iceberg managée du catalogue Unity, créée avec `USING iceberg`, est gouvernée par le catalogue Unity et accessible via l'API Iceberg REST Catalog en lecture et en écriture depuis des moteurs externes comme Trino ou Flink. Elle nécessite le calcul serverless et l'optimisation prédictive, qui sont activés.
  options:
    a:
      en: |
        Iceberg reads generate Iceberg metadata for a Delta table, but Iceberg client support is read-only; the partner engines could not write.
      fr: |
        Les lectures Iceberg génèrent des métadonnées Iceberg pour une table Delta, mais la prise en charge des clients Iceberg est en lecture seule : les moteurs partenaires ne pourraient pas écrire.
    b:
      en: |
        A Parquet external table has no table format metadata for Iceberg clients, and Unity Catalog manages only its metadata, not its data files.
      fr: |
        Une table Parquet externe ne fournit aucune métadonnée de format de table aux clients Iceberg, et le catalogue Unity ne gère que ses métadonnées, pas ses fichiers de données.
    d:
      en: |
        A foreign Iceberg table is managed by an external catalog and is read-only in Azure Databricks, so the jobs could not write to it.
      fr: |
        Une table Iceberg étrangère est gérée par un catalogue externe et est en lecture seule dans Azure Databricks : les jobs ne pourraient pas y écrire.
references:
  - title: What is Apache Iceberg in Azure Databricks?
    url: https://learn.microsoft.com/en-us/azure/databricks/iceberg/
  - title: Read Delta Lake tables with Iceberg clients
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/uniform
