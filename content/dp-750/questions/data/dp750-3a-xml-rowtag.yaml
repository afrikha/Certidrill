id: dp750-3a-xml-rowtag
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware receives XML files from a supplier portal in an external location. Each file contains a root element that holds many `<shipment>` elements, and each `<shipment>` element must become one row of **litware.supply.bronze_shipments**.

    You plan to read the files with Auto Loader.

    Which two options must you set? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware reçoit des fichiers XML d'un portail fournisseur dans un emplacement externe. Chaque fichier contient un élément racine qui regroupe de nombreux éléments `<shipment>`, et chaque élément `<shipment>` doit devenir une ligne de **litware.supply.bronze_shipments**.

    Vous prévoyez de lire les fichiers avec Auto Loader.

    Quelles sont les deux options que vous devez définir ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`multiLine` set to `true`" }
    - { id: b, text: "`cloudFiles.format` set to `xml`" }
    - { id: c, text: "`header` set to `true`" }
    - { id: d, text: "`rowTag` set to `shipment`" }
    - { id: e, text: "`cloudFiles.partitionColumns` set to `shipment`" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Auto Loader needs `cloudFiles.format` to know the file format, and `xml` is one of its supported values. XML does not map directly to a table, so you must set `rowTag` to the element that becomes a row, here `shipment`.
    fr: |
      Auto Loader a besoin de `cloudFiles.format` pour connaître le format des fichiers, et `xml` fait partie des valeurs prises en charge. XML ne correspond pas directement à une table : vous devez définir `rowTag` sur l'élément qui devient une ligne, ici `shipment`.
  options:
    a:
      en: "`multiLine` is a JSON (and CSV) option for records that span several lines; it does not tell the XML reader which element is a row."
      fr: "`multiLine` est une option JSON (et CSV) pour les enregistrements répartis sur plusieurs lignes ; elle n'indique pas au lecteur XML quel élément constitue une ligne."
    c:
      en: "`header` applies to CSV files, where the first line holds the column names."
      fr: "`header` s'applique aux fichiers CSV, dont la première ligne contient les noms de colonnes."
    e:
      en: "`cloudFiles.partitionColumns` lists Hive-style partition columns to infer from the directory structure, not XML elements."
      fr: "`cloudFiles.partitionColumns` liste des colonnes de partition de style Hive à inférer à partir de l'arborescence des répertoires, pas des éléments XML."
references:
  - title: Read and write XML files
    url: https://learn.microsoft.com/en-us/azure/databricks/query/formats/xml
