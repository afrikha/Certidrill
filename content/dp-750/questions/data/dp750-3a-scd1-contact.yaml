id: dp750-3a-scd1-contact
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys maintains the dimension table **wingtip.gold.dim_store_contact**, which stores the phone number and email address of each store manager.

    When a phone number or email address changes, reports must show only the current value. Nobody analyzes previous contact details, and the design must stay as simple as possible.

    Which slowly changing dimension (SCD) type should you use?
  fr: |
    Wingtip Toys gère la table de dimension **wingtip.gold.dim_store_contact**, qui stocke le numéro de téléphone et l'adresse e-mail du responsable de chaque magasin.

    Lorsqu'un numéro de téléphone ou une adresse e-mail change, les rapports ne doivent afficher que la valeur actuelle. Personne n'analyse les coordonnées précédentes, et la conception doit rester la plus simple possible.

    Quel type de dimension à variation lente (SCD) devez-vous utiliser ?
body:
  options:
    - { id: a, text: SCD Type 0 }
    - { id: b, text: SCD Type 1 }
    - { id: c, text: SCD Type 2 }
    - { id: d, text: SCD Type 3 }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SCD Type 1 overwrites the existing record with the new values. It needs no extra columns or versioning logic and suits contact details and corrections whose history has no value.
    fr: |
      SCD Type 1 écrase l'enregistrement existant avec les nouvelles valeurs. Il ne nécessite ni colonne supplémentaire ni logique de versionnage et convient aux coordonnées et aux corrections dont l'historique n'a pas de valeur.
  options:
    a:
      en: |
        Type 0 never updates attributes after the initial insert, so the reports would show outdated contact details.
      fr: |
        Le type 0 ne met jamais à jour les attributs après l'insertion initiale : les rapports afficheraient des coordonnées obsolètes.
    c:
      en: |
        Type 2 inserts a new row for each version, which adds surrogate keys, validity dates and complexity that nobody needs here.
      fr: |
        Le type 2 insère une nouvelle ligne pour chaque version, ce qui ajoute des clés de substitution, des dates de validité et une complexité inutiles ici.
    d:
      en: |
        Type 3 adds columns for previous values, which keeps history that is not required.
      fr: |
        Le type 3 ajoute des colonnes pour les valeurs précédentes, ce qui conserve un historique non requis.
references:
  - title: Choose a slowly changing dimension (SCD) type
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/6-choose-slowly-changing-dimension-type
