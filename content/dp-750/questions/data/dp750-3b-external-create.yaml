id: dp750-3b-external-create
objective: "3.1.10"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A partner process writes JSON files to `abfss://raw@northwindlake.dfs.core.windows.net/returns/`, a path covered by a Unity Catalog external location. You have the required privileges.

    You need to create a table that lets analysts query the files with SQL without moving them. Dropping the table must not delete the files.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un processus partenaire écrit des fichiers JSON dans `abfss://raw@northwindlake.dfs.core.windows.net/returns/`, un chemin couvert par un emplacement externe Unity Catalog. Vous disposez des privilèges nécessaires.

    Vous devez créer une table qui permet aux analystes d'interroger les fichiers en SQL sans les déplacer. La suppression de la table ne doit pas supprimer les fichiers.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE northwind.bronze.returns_raw
    USING [[fmt]]
    [[loc]] 'abfss://raw@northwindlake.dfs.core.windows.net/returns/';
  slots:
    - id: fmt
      options:
        - { id: json, text: JSON }
        - { id: delta, text: DELTA }
        - { id: iceberg, text: ICEBERG }
        - { id: parquet, text: PARQUET }
    - id: loc
      options:
        - { id: location, text: LOCATION }
        - { id: managed, text: MANAGED LOCATION }
        - { id: extloc, text: EXTERNAL LOCATION }
answer:
  values: { fmt: json, loc: location }
explanation:
  correct:
    en: |
      Specifying a LOCATION makes the table an external table, and external tables support the JSON format. Dropping an external table removes only its metadata from Unity Catalog; the files stay in storage.
    fr: |
      Spécifier une clause LOCATION fait de la table une table externe, et les tables externes prennent en charge le format JSON. Supprimer une table externe ne supprime que ses métadonnées dans Unity Catalog ; les fichiers restent dans le stockage.
  options:
    delta: { en: "The files are JSON files, not a Delta table.", fr: "Les fichiers sont des fichiers JSON, pas une table Delta." }
    iceberg: { en: "The files are JSON files, not an Iceberg table.", fr: "Les fichiers sont des fichiers JSON, pas une table Iceberg." }
    parquet: { en: "The files are JSON files, not Parquet files.", fr: "Les fichiers sont des fichiers JSON, pas des fichiers Parquet." }
    managed: { en: "MANAGED LOCATION sets the managed storage of a catalog or schema; it isn't a clause of CREATE TABLE.", fr: "MANAGED LOCATION définit le stockage managé d'un catalogue ou d'un schéma ; ce n'est pas une clause de CREATE TABLE." }
    extloc: { en: "EXTERNAL LOCATION is a securable object, not a clause of CREATE TABLE.", fr: "EXTERNAL LOCATION est un objet sécurisable, pas une clause de CREATE TABLE." }
references:
  - title: Work with external tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/external
  - title: CREATE TABLE [USING]
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-table-using
