id: dp750-3b-external-privileges
objective: "3.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Unity Catalog external location named **partner_loc** that covers `abfss://partner@contosolake.dfs.core.windows.net/`. The group **ingest-eng** has the USE CATALOG privilege on the catalog **contoso_raw** and the USE SCHEMA privilege on the schema **contoso_raw.partner**.

    Members of ingest-eng must create external tables in contoso_raw.partner over files in partner_loc. You must follow the principle of least privilege.

    Which two privileges should you grant to ingest-eng? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un emplacement externe Unity Catalog nommé **partner_loc** qui couvre `abfss://partner@contosolake.dfs.core.windows.net/`. Le groupe **ingest-eng** dispose du privilège USE CATALOG sur le catalogue **contoso_raw** et du privilège USE SCHEMA sur le schéma **contoso_raw.partner**.

    Les membres d'ingest-eng doivent créer des tables externes dans contoso_raw.partner sur des fichiers de partner_loc. Vous devez respecter le principe du moindre privilège.

    Quels sont les deux privilèges à accorder à ingest-eng ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "CREATE MANAGED STORAGE on the external location partner_loc", fr: "CREATE MANAGED STORAGE sur l'emplacement externe partner_loc" } }
    - { id: b, text: { en: "CREATE TABLE on the schema contoso_raw.partner", fr: "CREATE TABLE sur le schéma contoso_raw.partner" } }
    - { id: c, text: { en: "MODIFY on the schema contoso_raw.partner", fr: "MODIFY sur le schéma contoso_raw.partner" } }
    - { id: d, text: { en: "CREATE EXTERNAL TABLE on the external location partner_loc", fr: "CREATE EXTERNAL TABLE sur l'emplacement externe partner_loc" } }
    - { id: e, text: { en: "CREATE EXTERNAL VOLUME on the external location partner_loc", fr: "CREATE EXTERNAL VOLUME sur l'emplacement externe partner_loc" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Creating an external table requires CREATE EXTERNAL TABLE on the external location that grants access to the LOCATION path, CREATE TABLE and USE SCHEMA on the parent schema, and USE CATALOG on the parent catalog. The group already has USE CATALOG and USE SCHEMA.
    fr: |
      Créer une table externe exige CREATE EXTERNAL TABLE sur l'emplacement externe qui donne accès au chemin LOCATION, CREATE TABLE et USE SCHEMA sur le schéma parent, et USE CATALOG sur le catalogue parent. Le groupe dispose déjà de USE CATALOG et de USE SCHEMA.
  options:
    a:
      en: |
        CREATE MANAGED STORAGE lets a user use the location as managed storage for a catalog or schema, not create external tables.
      fr: |
        CREATE MANAGED STORAGE permet d'utiliser l'emplacement comme stockage managé d'un catalogue ou d'un schéma, pas de créer des tables externes.
    c:
      en: |
        MODIFY lets users change the data of tables; it isn't needed to create a table.
      fr: |
        MODIFY permet de modifier les données des tables ; il n'est pas nécessaire pour créer une table.
    e:
      en: |
        CREATE EXTERNAL VOLUME is for volumes, which govern file access, not tables.
      fr: |
        CREATE EXTERNAL VOLUME concerne les volumes, qui gouvernent l'accès aux fichiers, pas les tables.
references:
  - title: Work with external tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/external
