id: dp750-3b-table-type-hotarea
objective: "3.1.10"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    The schema **litware.sales** contains the objects shown in the following table. Predictive optimization is enabled for the schema, and none of the tables is partitioned. You use compute that runs Databricks Runtime 17.3 LTS.

    Answer each prompt by selecting the appropriate object.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le schéma **litware.sales** contient les objets présentés dans le tableau suivant. L'optimisation prédictive est activée pour le schéma, et aucune des tables n'est partitionnée. Vous utilisez un calcul qui exécute Databricks Runtime 17.3 LTS.

    Répondez à chaque consigne en sélectionnant l'objet approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The only object on which you can enable automatic liquid clustering", fr: "Le seul objet sur lequel vous pouvez activer le clustering liquide automatique" }
    - id: p2
      text: { en: "The only object that you can convert to a managed table by running ALTER TABLE ... SET MANAGED", fr: "Le seul objet que vous pouvez convertir en table managée en exécutant ALTER TABLE ... SET MANAGED" } 
  grid:
    header: [{ en: Name, fr: Nom }, Type, Format]
    rows:
      - [{ text: orders, area: orders }, { text: MANAGED }, { text: DELTA }]
      - [{ text: returns_raw, area: returns }, { text: EXTERNAL }, { text: JSON }]
      - [{ text: inventory_legacy, area: inventory }, { text: EXTERNAL }, { text: DELTA }]
      - [{ text: vw_daily_sales, area: view }, { text: VIEW }, { text: "-" }]
answer:
  values: { p1: orders, p2: inventory }
explanation:
  correct:
    en: |
      Automatic liquid clustering is a feature of Unity Catalog managed tables that requires predictive optimization, so only the managed Delta table orders qualifies. ALTER TABLE ... SET MANAGED converts external tables that use the Delta Lake format, so inventory_legacy can be converted, but returns_raw, which stores JSON files, can't.
    fr: |
      Le clustering liquide automatique est une fonctionnalité des tables managées Unity Catalog qui exige l'optimisation prédictive : seule la table Delta managée orders convient. ALTER TABLE ... SET MANAGED convertit les tables externes au format Delta Lake : inventory_legacy peut être convertie, mais pas returns_raw, qui stocke des fichiers JSON.
references:
  - title: Unity Catalog managed tables for Delta Lake and Apache Iceberg
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/managed
  - title: Convert external or foreign Delta Lake tables to Unity Catalog managed tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/convert-to-managed
