id: dp750-3d-try-cast-detect
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Delta table named **proseware.bronze.invoices_raw** in which the `amount` column is a `STRING`. You query the table from a SQL warehouse on which ANSI mode is enabled.

    You need a query that returns the rows whose `amount` value can't be converted to `DECIMAL(12,2)`. The query must not fail, and rows whose `amount` is null must not be returned.

    Which `WHERE` clause should you use?
  fr: |
    Proseware dispose d'une table Delta nommée **proseware.bronze.invoices_raw** dans laquelle la colonne `amount` est de type `STRING`. Vous interrogez la table depuis un entrepôt SQL sur lequel le mode ANSI est activé.

    Vous avez besoin d'une requête qui renvoie les lignes dont la valeur `amount` ne peut pas être convertie en `DECIMAL(12,2)`. La requête ne doit pas échouer, et les lignes dont l'`amount` est null ne doivent pas être renvoyées.

    Quelle clause `WHERE` devez-vous utiliser ?
body:
  options:
    - { id: a, text: "`WHERE amount IS NOT NULL AND cast(amount AS DECIMAL(12,2)) IS NULL`" }
    - { id: b, text: "`WHERE try_cast(amount AS DECIMAL(12,2)) IS NULL`" }
    - { id: c, text: "`WHERE amount IS NOT NULL AND typeof(amount) <> 'decimal(12,2)'`" }
    - { id: d, text: "`WHERE amount IS NOT NULL AND try_cast(amount AS DECIMAL(12,2)) IS NULL`" }
answer:
  optionId: d
explanation:
  correct:
    en: |
      `try_cast` returns NULL instead of raising an error when a value is malformed or overflows the target type. A non-null `amount` whose `try_cast` result is NULL is therefore a value that doesn't convert, and the `amount IS NOT NULL` condition excludes the rows that were null from the start.
    fr: |
      `try_cast` renvoie NULL au lieu de lever une erreur quand une valeur est mal formée ou dépasse la capacité du type cible. Un `amount` non null dont le résultat de `try_cast` est NULL est donc une valeur qui ne se convertit pas, et la condition `amount IS NOT NULL` exclut les lignes qui étaient null dès le départ.
  options:
    a:
      en: |
        With ANSI mode enabled, `cast` raises an error on the first invalid value, so the query fails.
      fr: |
        Avec le mode ANSI activé, `cast` lève une erreur sur la première valeur non valide : la requête échoue.
    b:
      en: |
        This clause also returns the rows whose `amount` is null, because `try_cast` of NULL is NULL.
      fr: |
        Cette clause renvoie aussi les lignes dont l'`amount` est null, car `try_cast` de NULL donne NULL.
    c:
      en: |
        `typeof` returns the type of the expression, which is `string` for every row, so the clause returns every non-null row.
      fr: |
        `typeof` renvoie le type de l'expression, qui est `string` pour chaque ligne : la clause renvoie chaque ligne non null.
references:
  - title: try_cast function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/try_cast
  - title: ANSI_MODE
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/parameters/ansi_mode
