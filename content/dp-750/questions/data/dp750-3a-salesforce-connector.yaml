id: dp750-3a-salesforce-connector
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware uses Salesforce for its sales pipeline. You need to ingest the Account, Opportunity and Contact objects into the **proseware.crm** schema in Unity Catalog every hour, and only changed records should be read after the first load.

    The solution must minimize development and long-term maintenance effort, including API changes, retries and schema evolution.

    What should you use?
  fr: |
    Proseware utilise Salesforce pour son pipeline commercial. Vous devez ingérer les objets Account, Opportunity et Contact dans le schéma **proseware.crm** du catalogue Unity toutes les heures, et seuls les enregistrements modifiés doivent être lus après le premier chargement.

    La solution doit réduire au minimum l'effort de développement et de maintenance à long terme, y compris les changements d'API, les nouvelles tentatives et l'évolution du schéma.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A notebook that calls the Salesforce REST API and merges the results", fr: "Un notebook qui appelle l'API REST Salesforce et fusionne les résultats" } }
    - { id: b, text: { en: "An Azure Data Factory copy activity that lands files for Auto Loader", fr: "Une activité de copie Azure Data Factory qui dépose des fichiers pour Auto Loader" } }
    - { id: c, text: { en: "A Spark Structured Streaming job with a custom source", fr: "Un job Spark Structured Streaming avec une source personnalisée" } }
    - { id: d, text: { en: "The Lakeflow Connect managed connector for Salesforce", fr: "Le connecteur géré Lakeflow Connect pour Salesforce" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Lakeflow Connect managed connectors are the most managed ingestion layer. They handle source-specific authentication, incremental reads, retries, API maintenance and schema evolution, run on serverless compute and write to streaming tables governed by Unity Catalog.
    fr: |
      Les connecteurs gérés Lakeflow Connect constituent la couche d'ingestion la plus gérée. Ils prennent en charge l'authentification propre à la source, les lectures incrémentielles, les nouvelles tentatives, la maintenance des API et l'évolution du schéma, s'exécutent sur du calcul serverless et écrivent dans des tables de streaming gouvernées par le catalogue Unity.
  options:
    a:
      en: |
        Custom API code works, but you must write and maintain authentication, pagination, rate limiting and change tracking yourself.
      fr: |
        Du code personnalisé pour l'API fonctionne, mais vous devez écrire et maintenir vous-même l'authentification, la pagination, la limitation de débit et le suivi des changements.
    b:
      en: |
        Adding Azure Data Factory introduces a second service and a two-step flow for a source that a managed connector already supports.
      fr: |
        Ajouter Azure Data Factory introduit un second service et un flux en deux étapes pour une source déjà prise en charge par un connecteur géré.
    c:
      en: |
        Structured Streaming is the most customizable layer and requires the most development and maintenance effort.
      fr: |
        Structured Streaming est la couche la plus personnalisable et celle qui demande le plus d'effort de développement et de maintenance.
references:
  - title: Choose a data ingestion tool
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/3-choose-data-ingestion-tool
  - title: What is Lakeflow Connect?
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/overview
