id: dp750-3d-rescued-causes
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam ingests JSON device files into the Delta table **fabrikam.bronze.devices** by using Auto Loader with schema inference, `cloudFiles.schemaHints` set to `"firmware_version INT, last_seen TIMESTAMP"`, and `cloudFiles.schemaEvolutionMode` set to `rescue`.

    Which two situations cause data to be written to the `_rescued_data` column?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam ingère des fichiers JSON d'appareils dans la table Delta **fabrikam.bronze.devices** à l'aide d'Auto Loader avec l'inférence de schéma, `cloudFiles.schemaHints` défini sur `"firmware_version INT, last_seen TIMESTAMP"` et `cloudFiles.schemaEvolutionMode` défini sur `rescue`.

    Quelles sont les deux situations qui entraînent l'écriture de données dans la colonne `_rescued_data` ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "A record has a `firmware_version` value of `\"4.2-beta\"`."
        fr: "Un enregistrement a une valeur `firmware_version` égale à `\"4.2-beta\"`."
    - id: b
      text:
        en: "A record has a null `last_seen` value."
        fr: "Un enregistrement a une valeur `last_seen` null."
    - id: c
      text:
        en: "A file that Auto Loader already processed is listed again in the source directory."
        fr: "Un fichier déjà traité par Auto Loader est de nouveau listé dans le répertoire source."
    - id: d
      text:
        en: "A new file contains a field named `battery_level` that isn't in the schema."
        fr: "Un nouveau fichier contient un champ nommé `battery_level` qui ne figure pas dans le schéma."
    - id: e
      text:
        en: "A record is identical to a record of an earlier file."
        fr: "Un enregistrement est identique à un enregistrement d'un fichier antérieur."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The rescued data column captures the data that doesn't parse against the schema: a value whose type doesn't match, such as text in an `INT` column, a field that is absent from the schema, or a field whose case differs. In `rescue` mode the schema never evolves, so new fields such as `battery_level` go to `_rescued_data` and the stream doesn't fail.
    fr: |
      La colonne de données récupérées capture les données qui ne s'analysent pas selon le schéma : une valeur dont le type ne correspond pas, comme du texte dans une colonne `INT`, un champ absent du schéma ou un champ dont la casse diffère. En mode `rescue`, le schéma n'évolue jamais : les nouveaux champs comme `battery_level` vont dans `_rescued_data` et le flux n'échoue pas.
  options:
    b:
      en: |
        A null value is valid for a nullable column; nothing needs to be rescued.
      fr: |
        Une valeur null est valide pour une colonne nullable ; rien n'a besoin d'être récupéré.
    c:
      en: |
        Auto Loader tracks processed files in its checkpoint and doesn't process them again; this has nothing to do with the rescued data column.
      fr: |
        Auto Loader suit les fichiers traités dans son point de contrôle et ne les retraite pas ; cela n'a aucun rapport avec la colonne de données récupérées.
    e:
      en: |
        Auto Loader doesn't deduplicate records; a duplicate record that matches the schema is written normally.
      fr: |
        Auto Loader ne déduplique pas les enregistrements ; un enregistrement en double conforme au schéma est écrit normalement.
references:
  - title: Configure schema inference and evolution in Auto Loader
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
