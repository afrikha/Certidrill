id: dp750-3b-lc-workday
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware must load several Workday reports into the schema **proseware.hr_bronze** every day. The data must be governed by Unity Catalog, later runs must load only the changed data when the source supports it, and development and maintenance effort must be minimized.

    What should you use?
  fr: |
    Proseware doit charger chaque jour plusieurs rapports Workday dans le schéma **proseware.hr_bronze**. Les données doivent être gouvernées par Unity Catalog, les exécutions suivantes ne doivent charger que les données modifiées quand la source le permet, et l'effort de développement et de maintenance doit être réduit au minimum.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A Lakeflow Connect ingestion pipeline that uses the Workday Reports connector", fr: "Un pipeline d'ingestion Lakeflow Connect qui utilise le connecteur Workday Reports" } }
    - { id: b, text: { en: "A notebook that reads report files exported by Workday to a volume by using Auto Loader", fr: "Un notebook qui lit avec Auto Loader les fichiers de rapports exportés par Workday dans un volume" } }
    - { id: c, text: { en: "A COPY INTO statement that loads report files exported by Workday to a volume", fr: "Une instruction COPY INTO qui charge les fichiers de rapports exportés par Workday dans un volume" } }
    - { id: d, text: { en: "A notebook that calls the Workday REST API and writes the results with saveAsTable", fr: "Un notebook qui appelle l'API REST de Workday et écrit les résultats avec saveAsTable" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Lakeflow Connect managed connectors, including the Workday Reports connector, create ingestion pipelines that are governed by Unity Catalog, run on serverless compute and ingest incrementally, with automatic retries. No export process or custom code is needed.
    fr: |
      Les connecteurs managés Lakeflow Connect, dont le connecteur Workday Reports, créent des pipelines d'ingestion gouvernés par Unity Catalog, qui s'exécutent sur du calcul serverless et ingèrent de façon incrémentielle, avec des nouvelles tentatives automatiques. Aucun processus d'exportation ni code personnalisé n'est nécessaire.
  options:
    b:
      en: |
        Auto Loader requires a separate process that exports the reports to files, which adds development and maintenance.
      fr: |
        Auto Loader exige un processus distinct qui exporte les rapports dans des fichiers, ce qui ajoute du développement et de la maintenance.
    c:
      en: |
        COPY INTO also depends on an export process, and it only appends new files rather than changed data.
      fr: |
        COPY INTO dépend aussi d'un processus d'exportation, et il n'ajoute que de nouveaux fichiers plutôt que les données modifiées.
    d:
      en: |
        Custom API code must handle authentication, paging, incremental logic and retries, which maximizes maintenance.
      fr: |
        Le code d'API personnalisé doit gérer l'authentification, la pagination, la logique incrémentielle et les nouvelles tentatives, ce qui maximise la maintenance.
references:
  - title: Lakeflow Connect connector concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/
