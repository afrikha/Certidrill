id: dp750-3a-mv-dimension-join
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a Lakeflow Spark Declarative Pipelines pipeline, you build **contoso.gold.sales_by_region**. It joins the streaming table **silver_orders** with the dimension table **silver_customers** and aggregates revenue by customer region. The pipeline runs every hour.

    When a customer's region is corrected in **silver_customers**, the totals in **sales_by_region** must reflect the correction at the next update, including for orders that were already processed. The solution must avoid recomputing the full result on every query.

    Which dataset type should you use for **sales_by_region**?
  fr: |
    Dans un pipeline Lakeflow Spark Declarative Pipelines, vous créez **contoso.gold.sales_by_region**. Elle joint la table de streaming **silver_orders** à la table de dimension **silver_customers** et agrège le chiffre d'affaires par région client. Le pipeline s'exécute toutes les heures.

    Lorsque la région d'un client est corrigée dans **silver_customers**, les totaux de **sales_by_region** doivent refléter la correction lors de la mise à jour suivante, y compris pour les commandes déjà traitées. La solution doit éviter de recalculer le résultat complet à chaque requête.

    Quel type de jeu de données devez-vous utiliser pour **sales_by_region** ?
body:
  options:
    - { id: a, text: { en: "A streaming table", fr: "Une table de streaming" } }
    - { id: b, text: { en: "A temporary view", fr: "Une vue temporaire" } }
    - { id: c, text: { en: "A materialized view", fr: "Une vue matérialisée" } }
    - { id: d, text: { en: "A Unity Catalog view", fr: "Une vue du catalogue Unity" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A materialized view caches the query results and refreshes them when the pipeline updates, often incrementally. Its results are always correct at the time of the update because it recomputes joins when the dimension changes.
    fr: |
      Une vue matérialisée met en cache les résultats de la requête et les actualise lors des mises à jour du pipeline, souvent de façon incrémentielle. Ses résultats sont toujours corrects au moment de la mise à jour, car elle recalcule les jointures lorsque la dimension change.
  options:
    a:
      en: |
        A streaming table processes each input row only once, and its joins do not recompute when dimensions change, so already processed orders keep the old region.
      fr: |
        Une table de streaming ne traite chaque ligne d'entrée qu'une seule fois, et ses jointures ne sont pas recalculées quand les dimensions changent : les commandes déjà traitées conservent l'ancienne région.
    b:
      en: |
        A temporary view is not persisted; its query runs again every time it is read.
      fr: |
        Une vue temporaire n'est pas persistante ; sa requête s'exécute à nouveau à chaque lecture.
    d:
      en: |
        A standard view recomputes its results on every query instead of caching them.
      fr: |
        Une vue standard recalcule ses résultats à chaque requête au lieu de les mettre en cache.
references:
  - title: Materialized views
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/concepts/materialized-views
  - title: Streaming tables
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/streaming-tables
