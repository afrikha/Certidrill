id: dp750-3c-ldp-new-column-default
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Lakeflow Spark Declarative Pipeline that defines the following streaming table.

    ```python
    @dp.table(name="proseware.bronze.devices")
    def devices():
        return (spark.readStream.format("cloudFiles")
                  .option("cloudFiles.format", "json")
                  .load("/Volumes/proseware/landing/raw/devices/"))
    ```

    No schema, schema hints or schema evolution mode is set. A supplier starts sending JSON files that contain a new top-level field named **firmware**.

    What happens during the next pipeline update?
  fr: |
    Proseware dispose d'un pipeline Lakeflow Spark Declarative Pipelines qui définit la table de streaming suivante.

    ```python
    @dp.table(name="proseware.bronze.devices")
    def devices():
        return (spark.readStream.format("cloudFiles")
                  .option("cloudFiles.format", "json")
                  .load("/Volumes/proseware/landing/raw/devices/"))
    ```

    Aucun schéma, aucun indicateur de schéma ni aucun mode d'évolution du schéma n'est défini. Un fournisseur commence à envoyer des fichiers JSON qui contiennent un nouveau champ de premier niveau nommé **firmware**.

    Que se passe-t-il lors de la mise à jour suivante du pipeline ?
body:
  options:
    - { id: a, text: { en: "The flow fails after firmware is added to the schema, and the flow processes firmware as a new column when it restarts.", fr: "Le flux échoue après l'ajout de firmware au schéma, puis il traite firmware comme une nouvelle colonne lorsqu'il redémarre." } }
    - { id: b, text: { en: "The flow continues without failing, the schema does not change, and the firmware values are stored in the _rescued_data column.", fr: "Le flux continue sans échouer, le schéma ne change pas et les valeurs de firmware sont stockées dans la colonne _rescued_data." } }
    - { id: c, text: { en: "The flow continues without failing, the schema does not change, and the firmware values are ignored.", fr: "Le flux continue sans échouer, le schéma ne change pas et les valeurs de firmware sont ignorées." } }
    - { id: d, text: { en: "The flow fails and keeps failing until you update the schema or remove the files that contain firmware.", fr: "Le flux échoue et continue d'échouer jusqu'à ce que vous mettiez à jour le schéma ou retiriez les fichiers qui contiennent firmware." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When no schema is provided, Auto Loader uses the `addNewColumns` schema evolution mode. On a new column, the stream fails with an `UnknownFieldException` after Auto Loader adds the column to the schema, and the restarted stream continues with the updated schema. In a pipeline, Azure Databricks manages the schema location for you.
    fr: |
      Lorsqu'aucun schéma n'est fourni, Auto Loader utilise le mode d'évolution du schéma `addNewColumns`. Face à une nouvelle colonne, le flux échoue avec une `UnknownFieldException` après qu'Auto Loader a ajouté la colonne au schéma, et le flux redémarré continue avec le schéma mis à jour. Dans un pipeline, Azure Databricks gère l'emplacement du schéma pour vous.
  options:
    b:
      en: |
        This is the `rescue` mode, which must be set explicitly.
      fr: |
        Il s'agit du mode `rescue`, qui doit être défini explicitement.
    c:
      en: |
        This is the `none` mode, which is the default only when you provide a schema.
      fr: |
        Il s'agit du mode `none`, qui n'est la valeur par défaut que lorsque vous fournissez un schéma.
    d:
      en: |
        This is the `failOnNewColumns` mode, which must be set explicitly.
      fr: |
        Il s'agit du mode `failOnNewColumns`, qui doit être défini explicitement.
references:
  - title: Configure schema inference and evolution in Auto Loader
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
