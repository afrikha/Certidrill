stem:
  en: You create the table with liquid clustering on device_id and event_ts.
  fr: Vous créez la table avec un clustering liquide sur device_id et event_ts.
body:
  solution:
    en: |
      You run the following statement now:

      ```sql
      CREATE TABLE fabrikam.silver.device_events
      CLUSTER BY (device_id, event_ts)
      AS SELECT * FROM fabrikam.staging.device_events;
      ```

      Next year, you will run the following statement:

      ```sql
      ALTER TABLE fabrikam.silver.device_events
      CLUSTER BY (device_id, event_ts, site_id);
      ```
    fr: |
      Vous exécutez maintenant l'instruction suivante :

      ```sql
      CREATE TABLE fabrikam.silver.device_events
      CLUSTER BY (device_id, event_ts)
      AS SELECT * FROM fabrikam.staging.device_events;
      ```

      L'année prochaine, vous exécuterez l'instruction suivante :

      ```sql
      ALTER TABLE fabrikam.silver.device_events
      CLUSTER BY (device_id, event_ts, site_id);
      ```
answer: { value: true }
explanation:
  correct:
    en: Liquid clustering suits filters on high-cardinality columns and tables with heavy skew, and it accepts up to four clustering keys. After `ALTER TABLE ... CLUSTER BY`, later OPTIMIZE and write operations use the new keys, but existing data is not rewritten.
    fr: "Le clustering liquide convient aux filtres sur des colonnes de cardinalité élevée et aux tables avec une forte asymétrie des données, et il accepte jusqu'à quatre clés de clustering. Après `ALTER TABLE ... CLUSTER BY`, les opérations OPTIMIZE et d'écriture suivantes utilisent les nouvelles clés, mais les données existantes ne sont pas réécrites."
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
