id: dp750-3b-copy-validate
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans to load Parquet files from **/Volumes/adatum/landing/raw/claims/** into the existing Delta table **adatum.bronze.claims** by using COPY INTO.

    Before the first load, you must check that all the data parses correctly and matches the schema and constraints of the table. No data must be written during the check.

    What should you add to the COPY INTO statement?
  fr: |
    Adatum prévoit de charger des fichiers Parquet de **/Volumes/adatum/landing/raw/claims/** dans la table Delta existante **adatum.bronze.claims** à l'aide de COPY INTO.

    Avant le premier chargement, vous devez vérifier que toutes les données sont analysées correctement et correspondent au schéma et aux contraintes de la table. Aucune donnée ne doit être écrite pendant la vérification.

    Que devez-vous ajouter à l'instruction COPY INTO ?
body:
  options:
    - { id: a, text: VALIDATE ALL }
    - { id: b, text: VALIDATE 50 ROWS }
    - { id: c, text: "FORMAT_OPTIONS ('mode' = 'FAILFAST')" }
    - { id: d, text: "COPY_OPTIONS ('force' = 'false')" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The VALIDATE clause checks the data without writing it to the table: parsing, schema match or need for schema evolution, and nullability and check constraints. VALIDATE ALL, the default, validates all the data.
    fr: |
      La clause VALIDATE vérifie les données sans les écrire dans la table : analyse, correspondance du schéma ou besoin d'évolution du schéma, et contraintes de nullabilité et de vérification. VALIDATE ALL, la valeur par défaut, valide toutes les données.
  options:
    d:
      en: |
        force = false is the default idempotent behavior; the statement still writes the data.
      fr: |
        force = false est le comportement idempotent par défaut ; l'instruction écrit quand même les données.
    b:
      en: |
        VALIDATE 50 ROWS checks only 50 rows, not all the data.
      fr: |
        VALIDATE 50 ROWS ne vérifie que 50 lignes, pas toutes les données.
    c:
      en: |
        A reader option changes how parsing errors are handled, but the statement still loads the data.
      fr: |
        Une option de lecteur modifie la gestion des erreurs d'analyse, mais l'instruction charge quand même les données.
references:
  - title: COPY INTO
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-copy-into
