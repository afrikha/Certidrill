id: dp750-3b-undrop-managed
objective: "3.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Three days ago, a data engineer accidentally dropped the Unity Catalog managed table **wingtip.sales.orders**. The recovery period of the schema has the default value.

    You need to recover the table and its data. What should you run?
  fr: |
    Il y a trois jours, un ingénieur données a supprimé par erreur la table managée Unity Catalog **wingtip.sales.orders**. La période de récupération du schéma a la valeur par défaut.

    Vous devez récupérer la table et ses données. Que devez-vous exécuter ?
body:
  options:
    - { id: a, text: "RESTORE TABLE wingtip.sales.orders TO TIMESTAMP AS OF current_date() - 4" }
    - { id: b, text: "CREATE TABLE wingtip.sales.orders AS SELECT * FROM wingtip.sales.orders VERSION AS OF 1" }
    - { id: c, text: "CREATE TABLE wingtip.sales.orders LOCATION '<managed storage path of the table>'" }
    - { id: d, text: "UNDROP TABLE wingtip.sales.orders" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a managed table is dropped, Unity Catalog keeps its data files for a recovery period of 7 days by default, and UNDROP TABLE restores the table during that period. After the period, an asynchronous process deletes the files.
    fr: |
      Quand une table managée est supprimée, Unity Catalog conserve ses fichiers de données pendant une période de récupération de 7 jours par défaut, et UNDROP TABLE restaure la table pendant cette période. Ensuite, un processus asynchrone supprime les fichiers.
  options:
    a:
      en: |
        RESTORE TABLE works on an existing table; a dropped table can't be restored to an earlier version.
      fr: |
        RESTORE TABLE fonctionne sur une table existante ; une table supprimée ne peut pas être restaurée vers une version antérieure.
    b:
      en: |
        The dropped table no longer exists, so time travel on it fails.
      fr: |
        La table supprimée n'existe plus : le voyage dans le temps sur cette table échoue.
    c:
      en: |
        You can't create a table over a path in managed storage; the files of managed tables are managed by Unity Catalog.
      fr: |
        Vous ne pouvez pas créer une table sur un chemin du stockage managé ; les fichiers des tables managées sont gérés par Unity Catalog.
references:
  - title: Unity Catalog managed tables for Delta Lake and Apache Iceberg
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/managed
