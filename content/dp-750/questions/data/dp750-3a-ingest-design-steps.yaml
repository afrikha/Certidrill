id: dp750-3a-ingest-design-steps
objective: "3.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum is designing the ingestion of a new ERP source into Unity Catalog. You follow a requirements-driven design approach so that the extraction type and the source file format are justified and documented.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum conçoit l'ingestion d'une nouvelle source ERP dans le catalogue Unity. Vous suivez une démarche de conception guidée par les exigences, afin que le type d'extraction et le format de fichier source soient justifiés et documentés.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: gather, text: { en: "Gather the requirements: data volume, latency, source capabilities, data quality, network and cost.", fr: "Recueillir les exigences : volume de données, latence, capacités de la source, qualité des données, réseau et coût." } }
    - { id: extract, text: { en: "Map the requirements to an extraction type.", fr: "Faire correspondre les exigences à un type d'extraction." } }
    - { id: format, text: { en: "Select the source file format.", fr: "Sélectionner le format de fichier source." } }
    - { id: validate, text: { en: "Validate the design against latency, scale, source support, cost and quality.", fr: "Valider la conception par rapport à la latence, à l'échelle, à la prise en charge par la source, au coût et à la qualité." } }
    - { id: zorder, text: { en: "Run OPTIMIZE with ZORDER BY on the destination table.", fr: "Exécuter OPTIMIZE avec ZORDER BY sur la table de destination." } }
    - { id: vacuum, text: { en: "Run VACUUM on the landing volume.", fr: "Exécuter VACUUM sur le volume d'atterrissage." } }
answer:
  sequence: [ gather, extract, format, validate ]
explanation:
  correct:
    en: |
      The requirements (volume, latency, source capabilities, quality, network, cost) drive the choice of extraction type, which then constrains the file format to request. The final step checks the whole design against latency, scale, source support, cost and quality before you build it.
    fr: |
      Les exigences (volume, latence, capacités de la source, qualité, réseau, coût) déterminent le choix du type d'extraction, qui oriente ensuite le format de fichier à demander. La dernière étape vérifie l'ensemble de la conception par rapport à la latence, à l'échelle, à la prise en charge par la source, au coût et à la qualité avant sa réalisation.
  options:
    zorder:
      en: |
        OPTIMIZE is table maintenance after loading; it is not a step of the ingestion design.
      fr: |
        OPTIMIZE est une opération de maintenance de table après le chargement ; ce n'est pas une étape de la conception de l'ingestion.
    vacuum:
      en: |
        VACUUM removes unreferenced files of a Delta table; it does not apply to a design step or to a volume.
      fr: |
        VACUUM supprime les fichiers non référencés d'une table Delta ; il ne s'agit pas d'une étape de conception et il ne s'applique pas à un volume.
references:
  - title: Design ingestion logic and data source configuration
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/2-design-data-ingestion-logic
