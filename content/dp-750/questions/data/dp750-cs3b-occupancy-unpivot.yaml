id: dp750-cs3b-occupancy-unpivot
objective: "3.3.6"
type: single
caseStudy: dp750-cs3b-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You need to transform mt_prod.bronze.occupancy to meet the occupancy requirement.

    Which query should you use?
  fr: |
    Vous devez transformer mt_prod.bronze.occupancy pour satisfaire l'exigence d'occupation.

    Quelle requête devez-vous utiliser ?
body:
  options:
    - { id: a, text: "SELECT * FROM mt_prod.bronze.occupancy UNPIVOT (occupancy FOR quarter IN (q1, q2, q3, q4))" }
    - { id: b, text: "SELECT * FROM mt_prod.bronze.occupancy UNPIVOT INCLUDE NULLS (occupancy FOR quarter IN (q1, q2, q3, q4))" }
    - { id: c, text: "SELECT * FROM mt_prod.bronze.occupancy PIVOT (SUM(occupancy) FOR quarter IN ('q1', 'q2', 'q3', 'q4'))" }
    - { id: d, text: "SELECT hotel_id, year, explode(array(q1, q2, q3, q4)) AS occupancy FROM mt_prod.bronze.occupancy" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      UNPIVOT turns the four quarter columns into rows, with the column name in quarter and its value in occupancy. The default is EXCLUDE NULLS, which removes the rows whose value is NULL, so INCLUDE NULLS is needed to keep the quarters that a hotel did not report.
    fr: |
      UNPIVOT transforme les quatre colonnes de trimestre en lignes, avec le nom de la colonne dans quarter et sa valeur dans occupancy. La valeur par défaut est EXCLUDE NULLS, qui supprime les lignes dont la valeur est NULL ; INCLUDE NULLS est donc nécessaire pour garder les trimestres qu'un hôtel n'a pas communiqués.
  options:
    a: { en: "Without INCLUDE NULLS, UNPIVOT uses EXCLUDE NULLS and drops the quarters that were not reported.", fr: "Sans INCLUDE NULLS, UNPIVOT utilise EXCLUDE NULLS et supprime les trimestres non communiqués." }
    c: { en: "PIVOT turns rows into columns, the opposite of the transformation required, and the table has no quarter or occupancy column to pivot.", fr: "PIVOT transforme des lignes en colonnes, l'inverse de la transformation demandée, et la table n'a pas de colonnes quarter ou occupancy à faire pivoter." }
    d: { en: "explode creates one row per value but loses the name of the quarter, so the rows cannot be identified.", fr: "explode crée une ligne par valeur mais perd le nom du trimestre : les lignes ne peuvent plus être identifiées." }
references:
  - title: UNPIVOT clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-unpivot
