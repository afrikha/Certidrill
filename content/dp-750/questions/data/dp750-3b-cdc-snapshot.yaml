id: dp750-3b-cdc-snapshot
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The ERP system of Proseware can't produce change records. Every night, it exports a full extract of its product table to a new folder under **/Volumes/proseware/landing/raw/products/**. The extract has no operation column; a product that was deleted in the ERP is simply missing from the next extract.

    In a Lakeflow Spark Declarative Pipelines pipeline, you must maintain the streaming table **dim_product** with the complete history of product changes, including deletions, and minimize custom code.

    What should you use?
  fr: |
    Le système ERP de Proseware ne peut pas produire d'enregistrements de modification. Chaque nuit, il exporte un extrait complet de sa table de produits dans un nouveau dossier sous **/Volumes/proseware/landing/raw/products/**. L'extrait n'a pas de colonne d'opération ; un produit supprimé dans l'ERP est simplement absent de l'extrait suivant.

    Dans un pipeline Lakeflow Spark Declarative Pipelines, vous devez tenir à jour la table de streaming **dim_product** avec l'historique complet des modifications des produits, y compris les suppressions, et réduire au minimum le code personnalisé.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An AUTO CDC flow with SEQUENCE BY the extract date and STORED AS SCD TYPE 2", fr: "Un flux AUTO CDC avec SEQUENCE BY sur la date d'extraction et STORED AS SCD TYPE 2" } }
    - { id: b, text: { en: "A streaming table that appends every extract with Auto Loader", fr: "Une table de streaming qui ajoute chaque extrait avec Auto Loader" } }
    - { id: c, text: { en: "A COPY INTO statement that loads every new extract into dim_product", fr: "Une instruction COPY INTO qui charge chaque nouvel extrait dans dim_product" } }
    - { id: d, text: { en: "An AUTO CDC FROM SNAPSHOT flow with STORED AS SCD TYPE 2", fr: "Un flux AUTO CDC FROM SNAPSHOT avec STORED AS SCD TYPE 2" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AUTO CDC FROM SNAPSHOT (create_auto_cdc_from_snapshot_flow in Python) determines the changes by comparing successive snapshots processed in version order, so a product missing from a newer snapshot is handled as a delete. STORED AS SCD TYPE 2 keeps the history with __START_AT and __END_AT.
    fr: |
      AUTO CDC FROM SNAPSHOT (create_auto_cdc_from_snapshot_flow en Python) détermine les modifications en comparant des instantanés successifs traités dans l'ordre des versions : un produit absent d'un instantané plus récent est traité comme une suppression. STORED AS SCD TYPE 2 conserve l'historique avec __START_AT et __END_AT.
  options:
    a:
      en: |
        AUTO CDC expects change records; without an operation column it can't detect deleted products, and it would process every unchanged row of each extract.
      fr: |
        AUTO CDC attend des enregistrements de modification ; sans colonne d'opération, il ne peut pas détecter les produits supprimés, et il traiterait chaque ligne inchangée de chaque extrait.
    b:
      en: |
        Appending every extract duplicates all the products each night and records neither changes nor deletions.
      fr: |
        Ajouter chaque extrait duplique tous les produits chaque nuit et n'enregistre ni les modifications ni les suppressions.
    c:
      en: |
        COPY INTO only appends the rows of new files; it records neither changes nor deletions.
      fr: |
        COPY INTO ne fait qu'ajouter les lignes des nouveaux fichiers ; il n'enregistre ni les modifications ni les suppressions.
references:
  - title: "The AUTO CDC APIs: Simplify change data capture with pipelines"
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/cdc
