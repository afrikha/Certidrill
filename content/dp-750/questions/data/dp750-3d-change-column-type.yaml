id: dp750-3d-change-column-type
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Delta table named **northwind.silver.orders** in which the `order_day` column is a `STRING` that contains ISO dates such as `2026-11-16`. Analysts need the column to be a `DATE`.

    You need to change the data type of `order_day` to `DATE` and keep all the existing rows.

    What should you do?
  fr: |
    Northwind Traders dispose d'une table Delta nommée **northwind.silver.orders** dans laquelle la colonne `order_day` est de type `STRING` et contient des dates ISO comme `2026-11-16`. Les analystes ont besoin que la colonne soit de type `DATE`.

    Vous devez changer le type de données de `order_day` en `DATE` et conserver toutes les lignes existantes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run `ALTER TABLE northwind.silver.orders ALTER COLUMN order_day TYPE DATE`."
        fr: "Exécuter `ALTER TABLE northwind.silver.orders ALTER COLUMN order_day TYPE DATE`."
    - id: b
      text:
        en: "Read the table, cast `order_day` to `DATE`, and write the result back in `overwrite` mode with the `overwriteSchema` option set to `true`."
        fr: "Lire la table, convertir `order_day` en `DATE` et réécrire le résultat en mode `overwrite` avec l'option `overwriteSchema` définie sur `true`."
    - id: c
      text:
        en: "Read the table, cast `order_day` to `DATE`, and append the result with the `mergeSchema` option set to `true`."
        fr: "Lire la table, convertir `order_day` en `DATE` et ajouter le résultat avec l'option `mergeSchema` définie sur `true`."
    - id: d
      text:
        en: "Enable column mapping on the table, and then rename `order_day` to `order_day_text`."
        fr: "Activer le mappage de colonnes sur la table, puis renommer `order_day` en `order_day_text`."
answer:
  optionId: b
explanation:
  correct:
    en: |
      Changing `STRING` to `DATE` isn't a supported type widening, so the table must be rewritten. Overwriting the table with the cast column and `overwriteSchema` set to `true` replaces the schema and keeps every row.
    fr: |
      Passer de `STRING` à `DATE` n'est pas un élargissement de type pris en charge : la table doit être réécrite. Remplacer la table par la colonne convertie avec `overwriteSchema` défini sur `true` remplace le schéma et conserve chaque ligne.
  options:
    a:
      en: |
        `ALTER COLUMN ... TYPE` only applies supported type widening changes, such as `INT` to `BIGINT`; `STRING` to `DATE` isn't one of them.
      fr: |
        `ALTER COLUMN ... TYPE` n'applique que les élargissements de type pris en charge, comme `INT` vers `BIGINT` ; `STRING` vers `DATE` n'en fait pas partie.
    c:
      en: |
        `mergeSchema` can add columns but can't change the type of an existing column, and appending would duplicate every row.
      fr: |
        `mergeSchema` peut ajouter des colonnes mais ne peut pas changer le type d'une colonne existante, et l'ajout dupliquerait chaque ligne.
    d:
      en: |
        Renaming a column changes its name, not its data type.
      fr: |
        Renommer une colonne change son nom, pas son type de données.
references:
  - title: Update table schemas with schema evolution
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/update-schema
