id: dp750-3a-source-format-match
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing four ingestion flows into Unity Catalog. For each flow, the upstream team will export data in the file format that you specify.

    Which source file format should you request for each flow? To answer, drag the appropriate formats to the correct flows. Each format may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit quatre flux d'ingestion vers le catalogue Unity. Pour chaque flux, l'équipe en amont exportera les données dans le format de fichier que vous indiquerez.

    Quel format de fichier source devez-vous demander pour chaque flux ? Pour répondre, faites glisser les formats appropriés vers les flux correspondants. Chaque format peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: parquet, text: Parquet }
    - { id: csv, text: CSV }
    - { id: xml, text: XML }
    - { id: avro, text: Avro }
    - { id: text, text: { en: "Plain text (TEXT)", fr: "Texte brut (TEXT)" } }
  targets:
    - id: analytics
      text: { en: "A daily export of 300 million sales rows that analytical queries read a few columns at a time; storage must be compressed", fr: "Un export quotidien de 300 millions de lignes de ventes, que les requêtes analytiques lisent quelques colonnes à la fois ; le stockage doit être compressé" }
    - id: events
      text: { en: "High-frequency order events published with a schema registry; the event schema evolves often", fr: "Des événements de commande à haute fréquence publiés avec un registre de schémas ; le schéma des événements évolue souvent" }
    - id: nested
      text: { en: "Product catalog documents with deeply nested elements produced by a legacy system", fr: "Des documents de catalogue produits à éléments profondément imbriqués générés par un système hérité" }
    - id: flat
      text: { en: "A small flat price list that business users also open in spreadsheet tools", fr: "Une petite liste de prix plate que les utilisateurs métier ouvrent aussi dans des tableurs" }
answer:
  mapping: { analytics: parquet, events: avro, nested: xml, flat: csv }
explanation:
  correct:
    en: |
      Parquet is columnar, compresses well, embeds its schema and lets queries read only the columns they need. Avro with a schema registry suits high-frequency streaming with schema evolution. XML represents hierarchical, nested documents. CSV is human-readable and universally supported, which is acceptable for small flat data.
    fr: |
      Parquet est un format en colonnes qui se compresse bien, embarque son schéma et permet aux requêtes de ne lire que les colonnes nécessaires. Avro avec un registre de schémas convient au streaming à haute fréquence avec évolution du schéma. XML représente des documents hiérarchiques et imbriqués. CSV est lisible et universellement pris en charge, ce qui est acceptable pour de petites données plates.
  options:
    text:
      en: |
        Plain text loads each line as a single string value; it carries no columns, types or nesting, so it fits none of the flows.
      fr: |
        Le texte brut charge chaque ligne comme une seule valeur de chaîne ; il ne porte ni colonnes, ni types, ni imbrication, et ne convient donc à aucun des flux.
references:
  - title: Design ingestion logic and data source configuration
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/2-design-data-ingestion-logic
