id: dp750-3c-setop-precedence
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso needs the list of loyalty members who bought online or in a store. A data engineer writes the following query.

    ```sql
    SELECT customer_id FROM contoso.silver.web_buyers
    UNION
    SELECT customer_id FROM contoso.silver.store_buyers
    INTERSECT
    SELECT customer_id FROM contoso.silver.loyalty_members;
    ```

    The result contains web buyers who are not loyalty members.

    What should you do to return the required list?
  fr: |
    Contoso a besoin de la liste des membres du programme de fidélité qui ont acheté en ligne ou en magasin. Un ingénieur données écrit la requête suivante.

    ```sql
    SELECT customer_id FROM contoso.silver.web_buyers
    UNION
    SELECT customer_id FROM contoso.silver.store_buyers
    INTERSECT
    SELECT customer_id FROM contoso.silver.loyalty_members;
    ```

    Le résultat contient des acheteurs en ligne qui ne sont pas membres du programme de fidélité.

    Que devez-vous faire pour renvoyer la liste demandée ?
body:
  options:
    - { id: c, text: { en: "Enclose the first two SELECT statements and the UNION in parentheses.", fr: "Placer les deux premières instructions SELECT et l'UNION entre parenthèses." } }
    - { id: a, text: { en: "Replace UNION with UNION ALL.", fr: "Remplacer UNION par UNION ALL." } }
    - { id: b, text: { en: "Replace INTERSECT with INTERSECT ALL.", fr: "Remplacer INTERSECT par INTERSECT ALL." } }
    - { id: d, text: { en: "Enclose the last two SELECT statements and the INTERSECT in parentheses.", fr: "Placer les deux dernières instructions SELECT et l'INTERSECT entre parenthèses." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When set operations are chained, INTERSECT has a higher precedence than UNION and EXCEPT. The query therefore computes the store buyers who are loyalty members and then adds every web buyer. Parentheses around the UNION make it run first, so INTERSECT filters both web and store buyers.
    fr: |
      Lorsque des opérations ensemblistes sont enchaînées, INTERSECT a une priorité plus élevée qu'UNION et EXCEPT. La requête calcule donc les acheteurs en magasin membres du programme de fidélité, puis ajoute tous les acheteurs en ligne. Des parenthèses autour de l'UNION la font exécuter en premier : INTERSECT filtre alors à la fois les acheteurs en ligne et en magasin.
  options:
    a:
      en: |
        UNION ALL keeps duplicates but does not change the order of evaluation, so the web buyers are still added unfiltered.
      fr: |
        UNION ALL conserve les doublons mais ne change pas l'ordre d'évaluation : les acheteurs en ligne sont toujours ajoutés sans filtre.
    b:
      en: |
        INTERSECT ALL keeps duplicate matches but is still evaluated before the UNION.
      fr: |
        INTERSECT ALL conserve les correspondances en double mais est toujours évalué avant l'UNION.
    d:
      en: |
        These parentheses reproduce the default precedence, so the result does not change.
      fr: |
        Ces parenthèses reproduisent la priorité par défaut : le résultat ne change pas.
references:
  - title: Set operators
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-setops
