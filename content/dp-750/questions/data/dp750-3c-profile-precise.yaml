id: dp750-3c-profile-precise
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank loads card transactions into **woodgrove.bronze.transactions**. The table contains a **merchant_id** column with several million distinct values.

    You are writing a Python notebook, scheduled in a Lakeflow job on Databricks Runtime 17.3 LTS, that must display summary statistics and histograms for every column of the table. The number of distinct values reported for **merchant_id** must be exact, not an approximation.

    Which command should the notebook run after it reads the table into a DataFrame named **df**?
  fr: |
    Woodgrove Bank charge les transactions par carte dans **woodgrove.bronze.transactions**. La table contient une colonne **merchant_id** qui compte plusieurs millions de valeurs distinctes.

    Vous écrivez un notebook Python, planifié dans un job Lakeflow sur Databricks Runtime 17.3 LTS, qui doit afficher des statistiques récapitulatives et des histogrammes pour chaque colonne de la table. Le nombre de valeurs distinctes indiqué pour **merchant_id** doit être exact et non approximatif.

    Quelle commande le notebook doit-il exécuter après avoir lu la table dans un DataFrame nommé **df** ?
body:
  options:
    - { id: a, text: "dbutils.data.summarize(df)" }
    - { id: b, text: "display(df.summary())" }
    - { id: c, text: "dbutils.data.summarize(df, precise=True)" }
    - { id: d, text: "display(df.describe())" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `dbutils.data.summarize` computes and displays summary statistics and histograms of a DataFrame from code. With `precise=True` (Databricks Runtime 10.4 LTS and above), every statistic except the numeric histograms and percentiles is exact, including the distinct count of high-cardinality columns.
    fr: |
      `dbutils.data.summarize` calcule et affiche depuis le code les statistiques récapitulatives et les histogrammes d'un DataFrame. Avec `precise=True` (Databricks Runtime 10.4 LTS et versions ultérieures), toutes les statistiques sauf les histogrammes et les centiles numériques sont exactes, y compris le nombre de valeurs distinctes des colonnes à forte cardinalité.
  options:
    a:
      en: |
        By default, `precise` is false and the distinct count of a high-cardinality column can have about 5 % relative error.
      fr: |
        Par défaut, `precise` vaut false et le nombre de valeurs distinctes d'une colonne à forte cardinalité peut présenter une erreur relative d'environ 5 %.
    b:
      en: "`summary()` returns count, mean, standard deviation, minimum, maximum and percentiles; it shows neither histograms nor distinct counts."
      fr: "`summary()` renvoie le nombre, la moyenne, l'écart type, le minimum, le maximum et des centiles ; il n'affiche ni histogrammes ni nombres de valeurs distinctes."
    d:
      en: "`describe()` returns count, mean, standard deviation, minimum and maximum; it shows neither histograms nor distinct counts."
      fr: "`describe()` renvoie le nombre, la moyenne, l'écart type, le minimum et le maximum ; il n'affiche ni histogrammes ni nombres de valeurs distinctes."
references:
  - title: Databricks Utilities (dbutils) reference
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-utils
