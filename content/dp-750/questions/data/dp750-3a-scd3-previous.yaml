id: dp750-3a-scd3-previous
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is moving products to new price tiers. Analysts need a report that compares each product's sales under its current price tier with its sales under the tier it had just before the change. Earlier tiers are not needed.

    The dimension table **northwind.gold.dim_product** must keep exactly one row per product, and storage must be minimized.

    Which slowly changing dimension (SCD) type should you use for the price tier attribute?
  fr: |
    Northwind Traders fait passer ses produits à de nouveaux niveaux de prix. Les analystes ont besoin d'un rapport qui compare les ventes de chaque produit sous son niveau de prix actuel avec ses ventes sous le niveau qu'il avait juste avant le changement. Les niveaux plus anciens ne sont pas nécessaires.

    La table de dimension **northwind.gold.dim_product** doit conserver exactement une ligne par produit, et le stockage doit être réduit au minimum.

    Quel type de dimension à variation lente (SCD) devez-vous utiliser pour l'attribut de niveau de prix ?
body:
  options:
    - { id: a, text: SCD Type 2 }
    - { id: b, text: SCD Type 1 }
    - { id: c, text: SCD Type 3 }
    - { id: d, text: SCD Type 0 }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SCD Type 3 tracks limited history by adding a column for the previous value, for example `previous_price_tier` beside `current_price_tier`. It keeps one row per member and suits before-and-after comparisons when only the previous value matters and storage is constrained.
    fr: |
      SCD Type 3 suit un historique limité en ajoutant une colonne pour la valeur précédente, par exemple `previous_price_tier` à côté de `current_price_tier`. Il conserve une ligne par membre et convient aux comparaisons avant/après lorsque seule la valeur précédente compte et que le stockage est limité.
  options:
    a:
      en: |
        Type 2 keeps the full history by inserting a new row per version, which breaks the one-row-per-product requirement and uses more storage.
      fr: |
        Le type 2 conserve l'historique complet en insérant une ligne par version, ce qui enfreint l'exigence d'une ligne par produit et utilise plus de stockage.
    b:
      en: |
        Type 1 overwrites the tier, so the previous tier is lost and the comparison is impossible.
      fr: |
        Le type 1 écrase le niveau : le niveau précédent est perdu et la comparaison devient impossible.
    d:
      en: |
        Type 0 never updates the attribute, so the new tier would never be recorded.
      fr: |
        Le type 0 ne met jamais à jour l'attribut : le nouveau niveau ne serait jamais enregistré.
references:
  - title: Choose a slowly changing dimension (SCD) type
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/6-choose-slowly-changing-dimension-type
