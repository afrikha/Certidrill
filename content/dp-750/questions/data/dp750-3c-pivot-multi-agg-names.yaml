id: dp750-3c-pivot-multi-agg-names
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware builds **litware.gold.quarterly_kpis** with the following query.

    ```sql
    SELECT *
    FROM (SELECT region, year, quarter, revenue FROM litware.silver.sales) AS s
    PIVOT (sum(revenue) AS total, avg(revenue) AS mean
      FOR quarter IN (1 AS q1, 2 AS q2, 3 AS q3, 4 AS q4));
    ```

    A dashboard must display the average revenue of the first quarter.

    Which column of **litware.gold.quarterly_kpis** should the dashboard use?
  fr: |
    Litware crée **litware.gold.quarterly_kpis** avec la requête suivante.

    ```sql
    SELECT *
    FROM (SELECT region, year, quarter, revenue FROM litware.silver.sales) AS s
    PIVOT (sum(revenue) AS total, avg(revenue) AS mean
      FOR quarter IN (1 AS q1, 2 AS q2, 3 AS q3, 4 AS q4));
    ```

    Un tableau de bord doit afficher le chiffre d'affaires moyen du premier trimestre.

    Quelle colonne de **litware.gold.quarterly_kpis** le tableau de bord doit-il utiliser ?
body:
  options:
    - { id: a, text: mean_q1 }
    - { id: b, text: q1 }
    - { id: c, text: q1_mean }
    - { id: d, text: mean }
answer: { optionId: c }
explanation:
  correct:
    en: |
      PIVOT generates one column for each combination of IN-list value and aggregate expression. With a single aggregate, the column takes the alias of the value; with several aggregates, it is named `column_alias_agg_column_alias`, so the first-quarter average is q1_mean.
    fr: |
      PIVOT génère une colonne pour chaque combinaison d'une valeur de la liste IN et d'une expression d'agrégation. Avec un seul agrégat, la colonne prend l'alias de la valeur ; avec plusieurs agrégats, elle est nommée `column_alias_agg_column_alias` : la moyenne du premier trimestre est donc q1_mean.
  options:
    a:
      en: |
        The value alias comes first and the aggregate alias second, not the other way around.
      fr: |
        L'alias de la valeur vient en premier et l'alias de l'agrégat en second, et non l'inverse.
    b:
      en: |
        The value alias alone is used only when PIVOT has a single aggregate expression.
      fr: |
        L'alias de la valeur seul n'est utilisé que lorsque PIVOT a une seule expression d'agrégation.
    d:
      en: |
        The aggregate alias alone would not distinguish the four quarters, so PIVOT combines it with the value alias.
      fr: |
        L'alias de l'agrégat seul ne distinguerait pas les quatre trimestres : PIVOT le combine donc avec l'alias de la valeur.
references:
  - title: PIVOT clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-pivot
