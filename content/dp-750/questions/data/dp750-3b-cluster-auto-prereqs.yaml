id: dp750-3b-cluster-auto-prereqs
objective: "3.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an unpartitioned Unity Catalog external Delta table named **adatum.web.sessions**. The filter patterns of the queries on the table change every few weeks. Predictive optimization is disabled for the catalog **adatum**. You use compute that runs Databricks Runtime 17.3 LTS.

    You plan to run `ALTER TABLE adatum.web.sessions CLUSTER BY AUTO` so that Azure Databricks chooses the clustering keys and adapts them over time.

    Which two actions should you perform first? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une table Delta externe Unity Catalog non partitionnée nommée **adatum.web.sessions**. Les modèles de filtrage des requêtes sur la table changent toutes les quelques semaines. L'optimisation prédictive est désactivée pour le catalogue **adatum**. Vous utilisez un calcul qui exécute Databricks Runtime 17.3 LTS.

    Vous prévoyez d'exécuter `ALTER TABLE adatum.web.sessions CLUSTER BY AUTO` pour qu'Azure Databricks choisisse les clés de clustering et les adapte au fil du temps.

    Quelles sont les deux actions à effectuer d'abord ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Convert the table to a managed table by running ALTER TABLE adatum.web.sessions SET MANAGED.", fr: "Convertir la table en table managée en exécutant ALTER TABLE adatum.web.sessions SET MANAGED." } }
    - { id: b, text: { en: "Run OPTIMIZE adatum.web.sessions ZORDER BY on the most filtered columns.", fr: "Exécuter OPTIMIZE adatum.web.sessions ZORDER BY sur les colonnes les plus filtrées." } }
    - { id: c, text: { en: "Set the delta.dataSkippingNumIndexedCols table property to 64.", fr: "Définir la propriété de table delta.dataSkippingNumIndexedCols sur 64." } }
    - { id: d, text: { en: "Enable predictive optimization for the adatum catalog.", fr: "Activer l'optimisation prédictive pour le catalogue adatum." } }
    - { id: e, text: { en: "Partition the table by the session_date column.", fr: "Partitionner la table sur la colonne session_date." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Automatic liquid clustering is available only for Unity Catalog managed tables, and it requires predictive optimization. ALTER TABLE ... SET MANAGED converts an external Delta table to a managed table on Databricks Runtime 17.3 LTS or above, and predictive optimization must be enabled for the catalog or schema that contains it.
    fr: |
      Le clustering liquide automatique n'est disponible que pour les tables managées Unity Catalog et exige l'optimisation prédictive. ALTER TABLE ... SET MANAGED convertit une table Delta externe en table managée sur Databricks Runtime 17.3 LTS ou ultérieur, et l'optimisation prédictive doit être activée pour le catalogue ou le schéma qui la contient.
  options:
    b:
      en: |
        Z-ordering isn't compatible with liquid clustering and doesn't let Azure Databricks choose the keys.
      fr: |
        L'ordre Z n'est pas compatible avec le clustering liquide et ne laisse pas Azure Databricks choisir les clés.
    c:
      en: |
        The number of indexed columns controls statistics collection, not automatic key selection.
      fr: |
        Le nombre de colonnes indexées contrôle la collecte des statistiques, pas la sélection automatique des clés.
    e:
      en: |
        Liquid clustering can't be enabled on a partitioned table.
      fr: |
        Le clustering liquide ne peut pas être activé sur une table partitionnée.
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
  - title: Convert external or foreign Delta Lake tables to Unity Catalog managed tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/convert-to-managed
