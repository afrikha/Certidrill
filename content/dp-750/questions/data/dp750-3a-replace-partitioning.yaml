id: dp750-3a-replace-partitioning
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a 3 TB managed Delta table named **contoso.web.clicks** that is partitioned by `event_date` and `country`. The table has about 40,000 partitions, most of them smaller than 100 MB. Queries filter on `event_date` and `country`.

    You need to change the data layout according to the Databricks recommendations for a table of this size. The table name must not change. Your compute runs Databricks Runtime 18.1.

    Which statement should you run first?
  fr: |
    Contoso dispose d'une table Delta managée de 3 To nommée **contoso.web.clicks**, partitionnée par `event_date` et `country`. La table compte environ 40 000 partitions, dont la plupart font moins de 100 Mo. Les requêtes filtrent sur `event_date` et `country`.

    Vous devez modifier la disposition des données conformément aux recommandations de Databricks pour une table de cette taille. Le nom de la table ne doit pas changer. Votre calcul exécute Databricks Runtime 18.1.

    Quelle instruction devez-vous exécuter en premier ?
body:
  options:
    - { id: a, text: "`ALTER TABLE contoso.web.clicks CLUSTER BY (event_date, country);`" }
    - { id: b, text: "`OPTIMIZE contoso.web.clicks ZORDER BY (event_date, country);`" }
    - { id: c, text: "`VACUUM contoso.web.clicks;`" }
    - { id: d, text: "`ALTER TABLE contoso.web.clicks REPLACE PARTITIONED BY WITH CLUSTER BY (event_date, country);`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For tables between 1 TB and 100 TB, Databricks recommends liquid clustering instead of partitioning. In Databricks Runtime 18.1 and above, `ALTER TABLE ... REPLACE PARTITIONED BY WITH CLUSTER BY` converts a partitioned table to liquid clustering in place; you then run `OPTIMIZE ... FULL` to recluster the existing data.
    fr: |
      Pour les tables de 1 To à 100 To, Databricks recommande le clustering liquide plutôt que le partitionnement. Dans Databricks Runtime 18.1 et versions ultérieures, `ALTER TABLE ... REPLACE PARTITIONED BY WITH CLUSTER BY` convertit sur place une table partitionnée en clustering liquide ; vous exécutez ensuite `OPTIMIZE ... FULL` pour regrouper à nouveau les données existantes.
  options:
    a:
      en: |
        Liquid clustering is not compatible with partitioning, so you cannot simply add clustering keys to a partitioned table.
      fr: |
        Le clustering liquide n'est pas compatible avec le partitionnement : vous ne pouvez pas simplement ajouter des clés de clustering à une table partitionnée.
    b:
      en: |
        You cannot Z-order on partition columns, and Z-ordering does not remove the excessive number of partitions.
      fr: |
        Il n'est pas possible d'appliquer l'ordre Z aux colonnes de partition, et l'ordre Z ne supprime pas le nombre excessif de partitions.
    c:
      en: |
        VACUUM removes files that the table no longer references; it does not change the partitioning or compact small files.
      fr: |
        VACUUM supprime les fichiers que la table ne référence plus ; il ne modifie pas le partitionnement et ne compacte pas les petits fichiers.
references:
  - title: When to partition tables on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/partitions
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
