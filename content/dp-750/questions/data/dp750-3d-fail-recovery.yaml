id: dp750-3d-fail-recovery
objective: "3.4.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs a triggered Lakeflow Spark Declarative Pipelines pipeline. The streaming table **northwind.silver.returns** has the expectation `CONSTRAINT valid_qty EXPECT (quantity > 0) ON VIOLATION FAIL UPDATE`. The latest pipeline update failed.

    You need to identify the record that caused the failure. From now on, returns with a quantity that isn't positive must be left out of the table without stopping the pipeline. The returns of the failed update must then be processed.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders exécute un pipeline Lakeflow Spark Declarative Pipelines déclenché. La table de streaming **northwind.silver.returns** a l'attente `CONSTRAINT valid_qty EXPECT (quantity > 0) ON VIOLATION FAIL UPDATE`. La dernière mise à jour du pipeline a échoué.

    Vous devez identifier l'enregistrement à l'origine de l'échec. Désormais, les retours dont la quantité n'est pas positive doivent être exclus de la table sans arrêter le pipeline. Les retours de la mise à jour en échec doivent ensuite être traités.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: error, text: { en: "Review the error of the failed update in the pipeline event log to find the violated expectation and the input record.", fr: "Examiner l'erreur de la mise à jour en échec dans le journal des événements du pipeline pour trouver l'attente violée et l'enregistrement d'entrée." } }
    - { id: drop, text: { en: "Change the expectation action to `ON VIOLATION DROP ROW`.", fr: "Remplacer l'action de l'attente par `ON VIOLATION DROP ROW`." } }
    - { id: start, text: { en: "Start a new pipeline update.", fr: "Démarrer une nouvelle mise à jour du pipeline." } }
    - { id: metrics, text: { en: "Open the Data quality tab of the returns dataset to read the number of failed records.", fr: "Ouvrir l'onglet Data quality du jeu de données returns pour lire le nombre d'enregistrements en échec." } }
    - { id: delete, text: { en: "Delete from northwind.silver.returns the rows that the failed update wrote.", fr: "Supprimer de northwind.silver.returns les lignes écrites par la mise à jour en échec." } }
    - { id: removeexp, text: { en: "Remove the valid_qty expectation from the table definition.", fr: "Retirer l'attente valid_qty de la définition de la table." } }
answer:
  sequence: [ error, drop, start ]
explanation:
  correct:
    en: |
      For a fail expectation, the error message of the update names the violated expectation and, for many queries, the input record that caused it. Changing the action to `DROP ROW` keeps the pipeline running and leaves invalid returns out of the table. Because the failed table update was rolled back atomically, a new update processes those returns again.
    fr: |
      Pour une attente d'échec, le message d'erreur de la mise à jour nomme l'attente violée et, pour de nombreuses requêtes, l'enregistrement d'entrée qui l'a provoquée. Remplacer l'action par `DROP ROW` laisse le pipeline s'exécuter et exclut les retours non valides de la table. Comme la mise à jour en échec de la table a été annulée de façon atomique, une nouvelle mise à jour traite de nouveau ces retours.
  options:
    metrics:
      en: |
        Fail expectations record no metrics, because the update doesn't complete.
      fr: |
        Les attentes d'échec n'enregistrent aucune métrique, car la mise à jour ne se termine pas.
    delete:
      en: |
        A table update that fails is rolled back, so the failed update wrote no rows.
      fr: |
        Une mise à jour de table qui échoue est annulée : la mise à jour en échec n'a écrit aucune ligne.
    removeexp:
      en: |
        Without the expectation, the returns with a quantity that isn't positive would be written to the table.
      fr: |
        Sans l'attente, les retours dont la quantité n'est pas positive seraient écrits dans la table.
references:
  - title: Manage data quality with pipeline expectations
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations
