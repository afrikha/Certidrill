id: dp750-3c-type-try-cast
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    City Power & Light ingests meter readings with Auto Loader into **cpl.bronze.readings**, where every column is a STRING. You are writing the query that loads **cpl.silver.readings** on a SQL warehouse.

    The solution must meet the following requirements:

    - Store **reading_day**, which arrives as text such as 31/12/2026, as a calendar day.
    - Store **kwh** with exactly three decimal places. A malformed value must produce NULL instead of failing the query.
    - Store **is_estimated**, which contains true or false, with the most appropriate type.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    City Power & Light ingère des relevés de compteurs avec Auto Loader dans **cpl.bronze.readings**, où toutes les colonnes sont de type STRING. Vous écrivez la requête qui charge **cpl.silver.readings** sur un entrepôt SQL.

    La solution doit répondre aux exigences suivantes :

    - Stocker **reading_day**, qui arrive sous forme de texte comme 31/12/2026, en tant que jour calendaire.
    - Stocker **kwh** avec exactement trois décimales. Une valeur mal formée doit produire NULL au lieu de faire échouer la requête.
    - Stocker **is_estimated**, qui contient true ou false, avec le type le plus approprié.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT meter_id,
           [[day]](reading_day, 'dd/MM/yyyy')  AS reading_day,
           [[kwh]]                              AS kwh,
           try_cast(is_estimated AS [[flag]])   AS is_estimated
    FROM cpl.bronze.readings;
  slots:
    - id: day
      options:
        - { id: todate, text: to_date }
        - { id: dateformat, text: date_format }
        - { id: tots, text: to_timestamp }
    - id: kwh
      options:
        - { id: castdec, text: "cast(kwh AS DECIMAL(9,3))" }
        - { id: trydbl, text: "try_cast(kwh AS DOUBLE)" }
        - { id: trydec, text: "try_cast(kwh AS DECIMAL(9,3))" }
    - id: flag
      options:
        - { id: tinyint, text: TINYINT }
        - { id: boolean, text: BOOLEAN }
        - { id: string, text: STRING }
answer:
  values: { day: todate, kwh: trydec, flag: boolean }
explanation:
  correct:
    en: |
      `to_date` parses the text with the given pattern and returns a DATE. `try_cast` returns NULL when a value is malformed or does not fit the target type, where `cast` raises an error, and `DECIMAL(9,3)` keeps exactly three decimal places. BOOLEAN is the type for true and false flags.
    fr: |
      `to_date` analyse le texte avec le modèle indiqué et renvoie une valeur DATE. `try_cast` renvoie NULL lorsqu'une valeur est mal formée ou ne tient pas dans le type cible, là où `cast` lève une erreur, et `DECIMAL(9,3)` conserve exactement trois décimales. BOOLEAN est le type des indicateurs true et false.
  options:
    dateformat:
      en: "`date_format` converts a date or timestamp into a formatted STRING, the opposite direction."
      fr: "`date_format` convertit une date ou un horodatage en STRING mise en forme, soit la direction inverse."
    tots:
      en: "`to_timestamp` returns a TIMESTAMP with a time of day, not a calendar day."
      fr: "`to_timestamp` renvoie un TIMESTAMP avec une heure, pas un jour calendaire."
    castdec:
      en: "`cast` raises an invalid data error on a malformed value, which fails the query."
      fr: "`cast` lève une erreur de données non valides sur une valeur mal formée, ce qui fait échouer la requête."
    trydbl:
      en: |
        DOUBLE is an approximate floating-point type with no fixed number of decimal places.
      fr: |
        DOUBLE est un type à virgule flottante approché sans nombre fixe de décimales.
    tinyint:
      en: |
        TINYINT stores small integers; the strings true and false are not integers.
      fr: |
        TINYINT stocke de petits entiers ; les chaînes true et false ne sont pas des entiers.
    string:
      en: |
        Keeping the flag as STRING allows any text and requires string comparisons in every query.
      fr: |
        Conserver l'indicateur en STRING autorise n'importe quel texte et impose des comparaisons de chaînes dans chaque requête.
references:
  - title: try_cast function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/try_cast
  - title: Data types
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-datatypes
