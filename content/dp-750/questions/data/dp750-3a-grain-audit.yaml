id: dp750-3a-grain-audit
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is designing the fact table **woodgrove.gold.fact_card_payments**. Regulators require the bank to retain every individual card payment for audit purposes, regardless of storage costs. Analysts also build daily and monthly summaries.

    Which grain should you declare for the fact table?
  fr: |
    Woodgrove Bank conçoit la table de faits **woodgrove.gold.fact_card_payments**. Les autorités de régulation exigent que la banque conserve chaque paiement par carte individuel à des fins d'audit, quels que soient les coûts de stockage. Les analystes produisent aussi des synthèses quotidiennes et mensuelles.

    Quelle granularité devez-vous déclarer pour la table de faits ?
body:
  options:
    - { id: a, text: { en: "One row per card per day", fr: "Une ligne par carte et par jour" } }
    - { id: b, text: { en: "One row per merchant per day", fr: "Une ligne par commerçant et par jour" } }
    - { id: c, text: { en: "One row per card per month", fr: "Une ligne par carte et par mois" } }
    - { id: d, text: { en: "One row per card payment", fr: "Une ligne par paiement par carte" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Compliance and audit requirements often force transaction-level detail. The atomic grain, one row per payment, keeps that detail, and the daily and monthly summaries can always be aggregated from it.
    fr: |
      Les exigences de conformité et d'audit imposent souvent un niveau de détail par transaction. La granularité atomique, une ligne par paiement, conserve ce détail, et les synthèses quotidiennes et mensuelles peuvent toujours être agrégées à partir de celle-ci.
  options:
    a:
      en: |
        A daily aggregate per card loses the individual payments, and lost detail cannot be recovered.
      fr: |
        Un agrégat quotidien par carte perd les paiements individuels, et un détail perdu ne peut pas être récupéré.
    b:
      en: |
        Aggregating per merchant and day loses both the individual payments and the card dimension.
      fr: |
        Agréger par commerçant et par jour fait perdre à la fois les paiements individuels et la dimension carte.
    c:
      en: |
        A monthly aggregate is even coarser and cannot meet the audit requirement.
      fr: |
        Un agrégat mensuel est encore plus grossier et ne peut pas répondre à l'exigence d'audit.
references:
  - title: Choose granularity on a column or table based on requirements
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/9-choose-granularity
