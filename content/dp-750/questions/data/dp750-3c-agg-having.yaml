id: dp750-3c-agg-having
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are writing the following query, which reads **contoso.silver.orders**.

    ```sql
    SELECT region, sum(amount) AS revenue
    FROM contoso.silver.orders
    WHERE year(order_ts) = 2026
    GROUP BY region
    ```

    The query must return only the regions whose 2026 revenue is greater than 1,000,000.

    Which clause should you add to the query?
  fr: |
    Vous écrivez la requête suivante, qui lit **contoso.silver.orders**.

    ```sql
    SELECT region, sum(amount) AS revenue
    FROM contoso.silver.orders
    WHERE year(order_ts) = 2026
    GROUP BY region
    ```

    La requête ne doit renvoyer que les régions dont le chiffre d'affaires 2026 dépasse 1 000 000.

    Quelle clause devez-vous ajouter à la requête ?
body:
  options:
    - { id: a, text: "QUALIFY sum(amount) > 1000000" }
    - { id: b, text: "HAVING sum(amount) > 1000000" }
    - { id: c, text: "AND sum(amount) > 1000000, added to the WHERE clause" }
    - { id: d, text: "FILTER (WHERE amount > 1000000), added after sum(amount)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      HAVING filters the groups produced by GROUP BY and can reference aggregate functions, so it keeps only the regions whose summed revenue exceeds the threshold. WHERE filters individual rows before they are grouped.
    fr: |
      HAVING filtre les groupes produits par GROUP BY et peut référencer des fonctions d'agrégation : il ne conserve donc que les régions dont le chiffre d'affaires cumulé dépasse le seuil. WHERE filtre les lignes individuelles avant leur regroupement.
  options:
    a:
      en: |
        QUALIFY filters the results of window functions, and its expressions cannot contain aggregate functions.
      fr: |
        QUALIFY filtre les résultats des fonctions de fenêtrage, et ses expressions ne peuvent pas contenir de fonctions d'agrégation.
    c:
      en: |
        WHERE is evaluated before grouping, so it cannot reference an aggregate function.
      fr: |
        WHERE est évalué avant le regroupement : il ne peut pas référencer une fonction d'agrégation.
    d:
      en: |
        An aggregate FILTER clause selects the rows passed to that aggregate; it would sum only large orders and still return every region.
      fr: |
        Une clause FILTER d'agrégat sélectionne les lignes transmises à cet agrégat ; elle n'additionnerait que les grosses commandes et renverrait toujours toutes les régions.
references:
