id: dp750-3b-ss-checkpoint-shared
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A notebook at Litware starts two streaming queries. The first writes to **litware.bronze.telemetry** and the second to **litware.bronze.alerts**. Both writes use the option `checkpointLocation` set to `/Volumes/litware/raw/chk/main`.

    The queries fail intermittently and their progress is inconsistent. Both queries must resume where they stopped after each restart.

    What should you do?
  fr: |
    Un notebook de Litware démarre deux requêtes de streaming. La première écrit dans **litware.bronze.telemetry** et la seconde dans **litware.bronze.alerts**. Les deux écritures utilisent l'option `checkpointLocation` définie sur `/Volumes/litware/raw/chk/main`.

    Les requêtes échouent par intermittence et leur progression est incohérente. Les deux requêtes doivent reprendre là où elles se sont arrêtées après chaque redémarrage.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the checkpoint directory before each run of the notebook.", fr: "Supprimer le répertoire de point de contrôle avant chaque exécution du notebook." } }
    - { id: b, text: { en: "Set the trigger of both queries to availableNow=True.", fr: "Définir le déclencheur des deux requêtes sur availableNow=True." } }
    - { id: c, text: { en: "Give each query its own checkpoint location.", fr: "Attribuer à chaque requête son propre emplacement de point de contrôle." } }
    - { id: d, text: { en: "Set the output mode of both queries to complete.", fr: "Définir le mode de sortie des deux requêtes sur complete." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A checkpoint stores the offsets, commits, state and query ID of one streaming query. Each query must have a different checkpoint location; multiple queries must never share the same location.
    fr: |
      Un point de contrôle stocke les offsets, les validations, l'état et l'ID d'une seule requête de streaming. Chaque requête doit avoir un emplacement de point de contrôle différent ; plusieurs requêtes ne doivent jamais partager le même emplacement.
  options:
    a:
      en: |
        Deleting the checkpoint makes each run start fresh, so the queries lose their progress and reprocess data.
      fr: |
        Supprimer le point de contrôle fait repartir chaque exécution de zéro : les requêtes perdent leur progression et retraitent les données.
    b:
      en: |
        The trigger controls when micro-batches run; the queries would still share one checkpoint.
      fr: |
        Le déclencheur contrôle le moment où s'exécutent les micro-lots ; les requêtes partageraient toujours un point de contrôle.
    d:
      en: |
        Complete mode works only with streaming aggregations, and it doesn't separate the checkpoints.
      fr: |
        Le mode complete ne fonctionne qu'avec des agrégations en streaming, et il ne sépare pas les points de contrôle.
references:
  - title: Structured Streaming checkpoints
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/checkpoints
