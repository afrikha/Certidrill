id: dp750-3c-unpivot-repivot-steps
objective: "3.3.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has the table **northwind.silver.store_months** with one row per store and year and the columns **store_id**, **region**, **year**, and **m01** to **m12**, which contain the monthly revenue.

    You need to build **northwind.gold.region_quarters** with one row per region and year and the columns **q1** to **q4**, which contain the total revenue of each quarter. You write a single SQL query that uses common table expressions.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose de la table **northwind.silver.store_months** avec une ligne par magasin et par année et les colonnes **store_id**, **region**, **year** et **m01** à **m12**, qui contiennent le chiffre d'affaires mensuel.

    Vous devez créer **northwind.gold.region_quarters** avec une ligne par région et par année et les colonnes **q1** à **q4**, qui contiennent le chiffre d'affaires total de chaque trimestre. Vous écrivez une seule requête SQL qui utilise des expressions de table communes.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: unpivot, text: { en: "UNPIVOT m01 to m12 into a month column and a revenue column.", fr: "Appliquer UNPIVOT à m01 à m12 pour obtenir une colonne month et une colonne revenue." } }
    - { id: quarter, text: { en: "Derive a quarter column from the month column.", fr: "Dériver une colonne quarter de la colonne month." } }
    - { id: select, text: { en: "Select only the region, year, quarter and revenue columns.", fr: "Sélectionner uniquement les colonnes region, year, quarter et revenue." } }
    - { id: pivot, text: { en: "PIVOT sum(revenue) FOR quarter IN (1 AS q1, 2 AS q2, 3 AS q3, 4 AS q4).", fr: "Appliquer PIVOT sum(revenue) FOR quarter IN (1 AS q1, 2 AS q2, 3 AS q3, 4 AS q4)." } }
    - { id: pivotmonths, text: { en: "PIVOT sum(m01) FOR region IN the list of regions.", fr: "Appliquer PIVOT sum(m01) FOR region IN la liste des régions." } }
    - { id: unionall, text: { en: "Combine twelve SELECT statements, one per month column, with UNION.", fr: "Combiner douze instructions SELECT, une par colonne de mois, avec UNION." } }
    - { id: groupstore, text: { en: "GROUP BY store_id, region and year.", fr: "Appliquer GROUP BY store_id, region et year." } }
answer:
  sequence: [ unpivot, quarter, select, pivot ]
explanation:
  correct:
    en: |
      UNPIVOT turns the twelve month columns into rows, which gives a month value from which the quarter can be derived. Before the PIVOT, the input must contain only the grouping columns region and year plus quarter and revenue: every other column, such as store_id or month, would become a grouping column and split the rows. PIVOT then sums the revenue of each quarter into q1 to q4.
    fr: |
      UNPIVOT transforme les douze colonnes de mois en lignes, ce qui fournit une valeur de mois à partir de laquelle le trimestre peut être dérivé. Avant le PIVOT, l'entrée ne doit contenir que les colonnes de regroupement region et year, plus quarter et revenue : toute autre colonne, comme store_id ou month, deviendrait une colonne de regroupement et fractionnerait les lignes. PIVOT additionne ensuite le chiffre d'affaires de chaque trimestre dans q1 à q4.
  options:
    pivotmonths:
      en: |
        Pivoting on region creates one column per region, not one column per quarter.
      fr: |
        Pivoter sur region crée une colonne par région, pas une colonne par trimestre.
    unionall:
      en: |
        UNION removes duplicate rows, so two months with the same revenue for a store would be merged, and the month name would be lost unless added to each query.
      fr: |
        UNION supprime les lignes en double : deux mois au chiffre d'affaires identique pour un magasin seraient fusionnés, et le nom du mois serait perdu s'il n'était pas ajouté à chaque requête.
    groupstore:
      en: |
        Grouping by store_id keeps one row per store, while the result needs one row per region and year.
      fr: |
        Regrouper par store_id conserve une ligne par magasin, alors que le résultat exige une ligne par région et par année.
references:
  - title: UNPIVOT clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-unpivot
  - title: PIVOT clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-pivot
