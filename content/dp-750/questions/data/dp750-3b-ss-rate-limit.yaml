id: dp750-3b-ss-rate-limit
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum starts a new Structured Streaming query that reads the Delta table **adatum.bronze.events**, which already contains 4 TB of data. The first micro-batch is so large that the query fails with out-of-memory errors.

    You need to limit the amount of data processed in each micro-batch to about 50 GB. The compute configuration must not change.

    What should you do?
  fr: |
    Adatum démarre une nouvelle requête Structured Streaming qui lit la table Delta **adatum.bronze.events**, qui contient déjà 4 To de données. Le premier micro-lot est si volumineux que la requête échoue avec des erreurs de mémoire insuffisante.

    Vous devez limiter la quantité de données traitées dans chaque micro-lot à environ 50 Go. La configuration du calcul ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the maxBytesPerTrigger option on the streaming read of adatum.bronze.events.", fr: "Définir l'option maxBytesPerTrigger sur la lecture en streaming d'adatum.bronze.events." } }
    - { id: b, text: { en: "Set the maxBytesPerTrigger option on the streaming write of the query.", fr: "Définir l'option maxBytesPerTrigger sur l'écriture en streaming de la requête." } }
    - { id: c, text: { en: "Set the trigger of the query to processingTime=\"10 minutes\".", fr: "Définir le déclencheur de la requête sur processingTime=\"10 minutes\"." } }
    - { id: d, text: { en: "Set the maxFilesPerTrigger option to 1000 on the streaming read.", fr: "Définir l'option maxFilesPerTrigger sur 1000 sur la lecture en streaming." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For a Delta source, maxBytesPerTrigger sets a soft maximum for the amount of data processed in each micro-batch. Rate limits are source options, so they are set on the streaming read.
    fr: |
      Pour une source Delta, maxBytesPerTrigger définit un maximum souple pour la quantité de données traitées dans chaque micro-lot. Les limites de débit sont des options de la source : elles se définissent sur la lecture en streaming.
  options:
    b:
      en: |
        Rate limits are read options of the source; set on the write, the option doesn't limit the micro-batches.
      fr: |
        Les limites de débit sont des options de lecture de la source ; définie sur l'écriture, l'option ne limite pas les micro-lots.
    c:
      en: |
        The trigger interval controls when micro-batches start, not how much data each one processes.
      fr: |
        L'intervalle du déclencheur contrôle le démarrage des micro-lots, pas la quantité de données que chacun traite.
    d:
      en: |
        1000 is already the default value of maxFilesPerTrigger, so nothing changes.
      fr: |
        1000 est déjà la valeur par défaut de maxFilesPerTrigger : rien ne change.
references:
  - title: Delta Lake table streaming reads and writes
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/delta-lake
