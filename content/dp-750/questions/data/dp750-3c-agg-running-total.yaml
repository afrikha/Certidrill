id: dp750-3c-agg-running-total
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware stores one row per payment in **proseware.silver.payments**, with the columns **payment_id**, **customer_id**, **paid_at** and **amount**. You are building the table **proseware.gold.payment_history**.

    Each row of the table must be one payment, with an additional column that contains the cumulative amount paid by the customer up to and including that payment, in **paid_at** order. Every payment row must be kept.

    Which expression should you add to the SELECT list?
  fr: |
    Proseware stocke une ligne par paiement dans **proseware.silver.payments**, avec les colonnes **payment_id**, **customer_id**, **paid_at** et **amount**. Vous créez la table **proseware.gold.payment_history**.

    Chaque ligne de la table doit être un paiement, avec une colonne supplémentaire qui contient le montant cumulé payé par le client jusqu'à ce paiement inclus, dans l'ordre de **paid_at**. Toutes les lignes de paiement doivent être conservées.

    Quelle expression devez-vous ajouter à la liste SELECT ?
body:
  options:
    - { id: a, text: "sum(amount) OVER (PARTITION BY customer_id)" }
    - { id: b, text: "sum(amount) OVER (PARTITION BY paid_at ORDER BY customer_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)" }
    - { id: c, text: "sum(amount) OVER (PARTITION BY customer_id ORDER BY paid_at ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)" }
    - { id: d, text: "sum(amount) FILTER (WHERE paid_at <= current_timestamp())" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A window function calculates a value for each row from a window of rows, without collapsing them. PARTITION BY restarts the sum for each customer, ORDER BY sorts the payments by time, and the frame from the first row of the partition to the current row produces the running total.
    fr: |
      Une fonction de fenêtrage calcule une valeur pour chaque ligne à partir d'une fenêtre de lignes, sans les regrouper. PARTITION BY fait repartir la somme pour chaque client, ORDER BY trie les paiements dans le temps, et le cadre allant de la première ligne de la partition jusqu'à la ligne actuelle produit le cumul.
  options:
    a:
      en: |
        Without ORDER BY and a frame, every row of a customer receives the customer's total, not a running total.
      fr: |
        Sans ORDER BY ni cadre, chaque ligne d'un client reçoit le total du client, pas un cumul.
    b:
      en: |
        Partitioning by paid_at sums payments made at the same time by different customers instead of the payments of one customer.
      fr: |
        Partitionner par paid_at additionne les paiements effectués au même moment par différents clients au lieu des paiements d'un même client.
    d:
      en: |
        An aggregate with a FILTER clause collapses the rows into groups; it does not return one value per payment.
      fr: |
        Un agrégat avec une clause FILTER regroupe les lignes ; il ne renvoie pas une valeur par paiement.
references:
  - title: Window functions
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-window-functions
