id: dp750-3a-liquid-high-cardinality
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware is designing the managed Delta table **proseware.sales.orders**, which will hold about 8 TB of data. Most queries filter on `customer_id`, which has 30 million distinct values, and some queries also filter on `order_date`. The filter patterns are expected to change over the next year.

    You must follow the Databricks recommendations for data layout.

    Which data layout should you define when you create the table?
  fr: |
    Proseware conçoit la table Delta managée **proseware.sales.orders**, qui contiendra environ 8 To de données. La plupart des requêtes filtrent sur `customer_id`, qui compte 30 millions de valeurs distinctes, et certaines filtrent aussi sur `order_date`. Les modèles de filtrage devraient évoluer au cours de l'année à venir.

    Vous devez suivre les recommandations de Databricks en matière de disposition des données.

    Quelle disposition des données devez-vous définir lors de la création de la table ?
body:
  options:
    - { id: a, text: "`CLUSTER BY (customer_id, order_date)`" }
    - { id: b, text: "`PARTITIONED BY (customer_id)`" }
    - { id: c, text: { en: "`PARTITIONED BY (order_date)`, then a scheduled `OPTIMIZE ... ZORDER BY (customer_id)`", fr: "`PARTITIONED BY (order_date)`, puis un `OPTIMIZE ... ZORDER BY (customer_id)` planifié" } }
    - { id: d, text: { en: "No layout clause, relying only on ingestion time clustering", fr: "Aucune clause de disposition, en s'appuyant uniquement sur le clustering par heure d'ingestion" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Between 1 TB and 100 TB, Databricks recommends liquid clustering instead of partitioning. Liquid clustering works for high-cardinality columns such as `customer_id`, accepts up to four keys, and lets you change the keys later without rewriting existing data.
    fr: |
      Entre 1 To et 100 To, Databricks recommande le clustering liquide plutôt que le partitionnement. Le clustering liquide fonctionne avec des colonnes à cardinalité élevée comme `customer_id`, accepte jusqu'à quatre clés et permet de modifier les clés ultérieurement sans réécrire les données existantes.
  options:
    b:
      en: |
        Partitioning on a column with 30 million values creates millions of small partitions and degrades performance.
      fr: |
        Partitionner sur une colonne de 30 millions de valeurs crée des millions de petites partitions et dégrade les performances.
    c:
      en: |
        Partitioning plus Z-order is the older approach; Databricks recommends liquid clustering over Z-ordering for new tables, and changing a partition scheme requires a rewrite.
      fr: |
        Le partitionnement associé à l'ordre Z est l'approche antérieure ; Databricks recommande le clustering liquide plutôt que l'ordre Z pour les nouvelles tables, et changer un schéma de partitionnement exige une réécriture.
    d:
      en: |
        Ingestion time clustering helps filters that follow the load order, such as dates, but not filters on `customer_id`.
      fr: |
        Le clustering par heure d'ingestion aide les filtres qui suivent l'ordre de chargement, comme les dates, mais pas les filtres sur `customer_id`.
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
  - title: When to partition tables on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/partitions
