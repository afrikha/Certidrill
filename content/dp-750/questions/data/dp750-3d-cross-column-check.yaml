id: dp750-3d-cross-column-check
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a Delta table named **adatum.silver.deliveries**. Notebooks on classic compute and queries on a SQL warehouse write to the table. The `shipped_day` and `delivered_day` columns are both defined as `DATE NOT NULL`.

    You need to ensure that any write fails if it contains a row whose `delivered_day` is earlier than its `shipped_day`.

    What should you do?
  fr: |
    Adatum dispose d'une table Delta nommée **adatum.silver.deliveries**. Des notebooks sur un calcul classique et des requêtes sur un entrepôt SQL écrivent dans la table. Les colonnes `shipped_day` et `delivered_day` sont toutes deux définies en `DATE NOT NULL`.

    Vous devez faire en sorte que toute écriture échoue si elle contient une ligne dont le `delivered_day` est antérieur au `shipped_day`.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add the constraint `CHECK (delivered_day >= shipped_day)` to the table."
        fr: "Ajouter la contrainte `CHECK (delivered_day >= shipped_day)` à la table."
    - id: b
      text:
        en: "Add the expectation `EXPECT (delivered_day >= shipped_day) ON VIOLATION FAIL UPDATE` to the table."
        fr: "Ajouter l'attente `EXPECT (delivered_day >= shipped_day) ON VIOLATION FAIL UPDATE` à la table."
    - id: c
      text:
        en: "Set a row filter on the table that returns only the rows where `delivered_day >= shipped_day`."
        fr: "Définir sur la table un filtre de lignes qui ne renvoie que les lignes où `delivered_day >= shipped_day`."
    - id: d
      text:
        en: "Redefine `delivered_day` as a generated column computed from `shipped_day`."
        fr: "Redéfinir `delivered_day` comme une colonne générée calculée à partir de `shipped_day`."
answer:
  optionId: a
explanation:
  correct:
    en: |
      A `CHECK` constraint is a Boolean expression that every row must satisfy, and it can compare two columns of the same row. Azure Databricks enforces it on every write to the Delta table, whatever the compute, and the transaction fails when a row violates it.
    fr: |
      Une contrainte `CHECK` est une expression booléenne que chaque ligne doit satisfaire, et elle peut comparer deux colonnes de la même ligne. Azure Databricks l'applique à chaque écriture dans la table Delta, quel que soit le calcul, et la transaction échoue quand une ligne la viole.
  options:
    b:
      en: |
        Expectations belong to dataset definitions in Lakeflow Spark Declarative Pipelines; they don't apply to writes from notebooks or warehouse queries.
      fr: |
        Les attentes font partie des définitions de jeux de données de Lakeflow Spark Declarative Pipelines ; elles ne s'appliquent pas aux écritures des notebooks ni des requêtes d'entrepôt.
    c:
      en: |
        A row filter restricts the rows that users can read; it doesn't reject writes.
      fr: |
        Un filtre de lignes restreint les lignes que les utilisateurs peuvent lire ; il ne rejette pas les écritures.
    d:
      en: |
        A generated column computes its value from other columns, so the real delivery date would be lost.
      fr: |
        Une colonne générée calcule sa valeur à partir d'autres colonnes : la date de livraison réelle serait perdue.
references:
  - title: Constraints on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/constraints
