id: dp750-3b-history-statements
objective: "3.1.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Unity Catalog managed table named **northwind.sales.invoices**. On November 1, a data engineer ran the following statement on compute that runs Databricks Runtime 17.3 LTS:

    ```sql
    ALTER TABLE northwind.sales.invoices SET TBLPROPERTIES (delta.enableChangeDataFeed = true);
    ```

    The table uses the default retention settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une table managée Unity Catalog nommée **northwind.sales.invoices**. Le 1er novembre, un ingénieur données a exécuté l'instruction suivante sur un calcul qui exécute Databricks Runtime 17.3 LTS :

    ```sql
    ALTER TABLE northwind.sales.invoices SET TBLPROPERTIES (delta.enableChangeDataFeed = true);
    ```

    La table utilise les paramètres de rétention par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A table_changes query on the versions committed on October 28 returns the changes made that day.
        fr: |
          Une requête table_changes sur les versions validées le 28 octobre renvoie les modifications effectuées ce jour-là.
    - id: s2
      text:
        en: |
          A new streaming query that reads the table with the readChangeFeed option and no starting version first returns the current rows as inserts, then the later changes.
        fr: |
          Une nouvelle requête de streaming qui lit la table avec l'option readChangeFeed et sans version de départ renvoie d'abord les lignes actuelles sous forme d'insertions, puis les modifications ultérieures.
    - id: s3
      text:
        en: |
          If you run RESTORE TABLE on the table, downstream streaming queries that read it can process the restored rows again.
        fr: |
          Si vous exécutez RESTORE TABLE sur la table, les requêtes de streaming en aval qui la lisent peuvent traiter à nouveau les lignes restaurées.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Change data feed records only the changes made after it is enabled, and reading a version from before that raises an error. When a streaming read of the change feed starts, it returns the latest snapshot as insert records, then the subsequent changes. RESTORE is a data-changing operation, so downstream streams can reprocess the restored rows and create duplicates.
    fr: |
      Le flux de données modifiées n'enregistre que les modifications effectuées après son activation, et lire une version antérieure génère une erreur. Au démarrage d'une lecture en streaming du flux de modifications, celle-ci renvoie le dernier instantané sous forme d'enregistrements d'insertion, puis les modifications suivantes. RESTORE est une opération qui modifie les données : les flux en aval peuvent retraiter les lignes restaurées et créer des doublons.
references:
  - title: Use change data feed on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/delta-change-data-feed
  - title: Work with table history
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/history
