id: dp750-3b-ss-starting-offsets
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At Contoso, a Structured Streaming query has been reading the Kafka topic **telemetry** for several weeks with `startingOffsets` set to `earliest`. It writes to **contoso.bronze.telemetry** with a checkpoint location.

    After an outage, a large backlog has built up in the topic. A developer changes `startingOffsets` to `latest` and restarts the query with the same checkpoint location, expecting the backlog to be skipped.

    What happens when the query restarts?
  fr: |
    Chez Contoso, une requête Structured Streaming lit le topic Kafka **telemetry** depuis plusieurs semaines avec `startingOffsets` défini sur `earliest`. Elle écrit dans **contoso.bronze.telemetry** avec un emplacement de point de contrôle.

    Après une panne, un arriéré important s'est accumulé dans le topic. Un développeur remplace `startingOffsets` par `latest` et redémarre la requête avec le même emplacement de point de contrôle, en espérant que l'arriéré sera ignoré.

    Que se passe-t-il au redémarrage de la requête ?
body:
  options:
    - { id: a, text: { en: "The query resumes from the offsets stored in the checkpoint and processes the backlog.", fr: "La requête reprend aux offsets stockés dans le point de contrôle et traite l'arriéré." } }
    - { id: b, text: { en: "The query reprocesses all the data retained in the topic from the oldest offset.", fr: "La requête retraite toutes les données conservées dans le topic à partir du plus ancien offset." } }
    - { id: c, text: { en: "The query fails because the starting offsets don't match the offsets stored in the checkpoint.", fr: "La requête échoue, car les offsets de départ ne correspondent pas aux offsets stockés dans le point de contrôle." } }
    - { id: d, text: { en: "The query skips the backlog and processes only the records that arrive after the restart.", fr: "La requête ignore l'arriéré et ne traite que les enregistrements qui arrivent après le redémarrage." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The checkpoint stores the source offsets processed in each micro-batch, so a restarted query resumes from them without reprocessing data. Starting options such as startingOffsets apply only when a new query starts; with the existing checkpoint, the change is ignored.
    fr: |
      Le point de contrôle stocke les offsets de la source traités dans chaque micro-lot : une requête redémarrée reprend donc à partir de ceux-ci sans retraiter de données. Les options de départ comme startingOffsets ne s'appliquent qu'au démarrage d'une nouvelle requête ; avec le point de contrôle existant, la modification est ignorée.
  options:
    d:
      en: |
        Skipping the backlog would require a new checkpoint location, because startingOffsets is read only by a new query.
      fr: |
        Ignorer l'arriéré exigerait un nouvel emplacement de point de contrôle, car startingOffsets n'est lu que par une nouvelle requête.
    b:
      en: |
        The checkpoint records the offsets already processed, so the query doesn't start again from the oldest offset.
      fr: |
        Le point de contrôle enregistre les offsets déjà traités : la requête ne repart pas du plus ancien offset.
    c:
      en: |
        Changing a starting option doesn't make the restart fail; the option is simply not used.
      fr: |
        Modifier une option de départ ne fait pas échouer le redémarrage ; l'option n'est simplement pas utilisée.
references:
  - title: Structured Streaming checkpoints
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/checkpoints
