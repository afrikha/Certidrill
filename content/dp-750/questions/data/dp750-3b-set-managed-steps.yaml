id: dp750-3b-set-managed-steps
objective: "3.1.10"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a Unity Catalog external Delta table named **fabrikam.hr.employees**. A streaming job writes to the table, and a scheduled job runs OPTIMIZE on it every night. You use compute that runs Databricks Runtime 17.3 LTS.

    You need to convert the table to a managed table. The table must keep its name, history and grants, and write downtime must be minimized.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'une table Delta externe Unity Catalog nommée **fabrikam.hr.employees**. Un job de streaming écrit dans la table, et un job planifié y exécute OPTIMIZE chaque nuit. Vous utilisez un calcul qui exécute Databricks Runtime 17.3 LTS.

    Vous devez convertir la table en table managée. La table doit conserver son nom, son historique et ses autorisations, et l'interruption des écritures doit être réduite au minimum.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pause, text: { en: "Cancel any running OPTIMIZE on the table and pause the nightly OPTIMIZE job.", fr: "Annuler tout OPTIMIZE en cours sur la table et suspendre le job OPTIMIZE nocturne." } }
    - { id: convert, text: { en: "Run ALTER TABLE fabrikam.hr.employees SET MANAGED.", fr: "Exécuter ALTER TABLE fabrikam.hr.employees SET MANAGED." } }
    - { id: restart, text: { en: "Restart the streaming job with the same configuration.", fr: "Redémarrer le job de streaming avec la même configuration." } }
    - { id: copy, text: { en: "Run ALTER TABLE fabrikam.hr.employees SET MANAGED COPY.", fr: "Exécuter ALTER TABLE fabrikam.hr.employees SET MANAGED COPY." } }
    - { id: ctas, text: { en: "Create a managed copy with CREATE TABLE ... AS SELECT, drop the external table and rename the copy.", fr: "Créer une copie managée avec CREATE TABLE ... AS SELECT, supprimer la table externe et renommer la copie." } }
    - { id: unset, text: { en: "Run ALTER TABLE fabrikam.hr.employees UNSET MANAGED.", fr: "Exécuter ALTER TABLE fabrikam.hr.employees UNSET MANAGED." } }
answer:
  sequence: [ pause, convert, restart ]
explanation:
  correct:
    en: |
      Before the conversion, Microsoft Learn asks you to cancel running OPTIMIZE operations and not to schedule new ones. ALTER TABLE ... SET MANAGED copies the data and the Delta log to the managed location while readers and writers keep running, then switches the table with only a brief write pause, keeping its name and history. Existing streams fail after the conversion and must be restarted with the same configuration.
    fr: |
      Avant la conversion, Microsoft Learn demande d'annuler les opérations OPTIMIZE en cours et de ne pas en planifier de nouvelles. ALTER TABLE ... SET MANAGED copie les données et le journal Delta vers l'emplacement managé pendant que lecteurs et rédacteurs continuent de fonctionner, puis bascule la table avec seulement une brève pause des écritures, en conservant son nom et son historique. Les flux existants échouent après la conversion et doivent être redémarrés avec la même configuration.
  options:
    copy:
      en: |
        COPY and MOVE are for foreign tables; with an external table they cause an error.
      fr: |
        COPY et MOVE concernent les tables étrangères ; avec une table externe, ils provoquent une erreur.
    ctas:
      en: |
        A new table created by CTAS doesn't keep the history or the grants of the original table.
      fr: |
        Une nouvelle table créée par CTAS ne conserve ni l'historique ni les autorisations de la table d'origine.
    unset:
      en: |
        UNSET MANAGED rolls a converted table back to its external location.
      fr: |
        UNSET MANAGED ramène une table convertie à son emplacement externe.
references:
  - title: Convert external or foreign Delta Lake tables to Unity Catalog managed tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/convert-to-managed
