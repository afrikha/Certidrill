id: dp750-3b-table-type-match
objective: "3.1.10"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is choosing the Unity Catalog object type for four datasets.

    Which object type should you use for each dataset? To answer, drag the appropriate object types to the correct datasets. Each object type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders choisit le type d'objet Unity Catalog de quatre jeux de données.

    Quel type d'objet devez-vous utiliser pour chaque jeu de données ? Pour répondre, faites glisser les types d'objets appropriés vers les jeux de données correspondants. Chaque type d'objet peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: managed, text: { en: Managed table, fr: Table managée } }
    - { id: external, text: { en: External table, fr: Table externe } }
    - { id: mvol, text: { en: Managed volume, fr: Volume managé } }
    - { id: evol, text: { en: External volume, fr: Volume externe } }
  targets:
    - id: t1
      text: { en: "Delta data queried only from Azure Databricks; maintenance such as OPTIMIZE and VACUUM must be automatic", fr: "Données Delta interrogées uniquement depuis Azure Databricks ; la maintenance comme OPTIMIZE et VACUUM doit être automatique" }
    - id: t2
      text: { en: "Existing Avro files to query with SQL where they are, without converting them", fr: "Fichiers Avro existants à interroger en SQL là où ils se trouvent, sans les convertir" }
    - id: t3
      text: { en: "Parquet data that a non-Databricks engine, which supports no other access method, must read directly from the files in storage", fr: "Données Parquet qu'un moteur autre que Databricks, qui ne prend en charge aucune autre méthode d'accès, doit lire directement dans les fichiers du stockage" }
    - id: t4
      text: { en: "Delta data that must be recoverable with UNDROP for 7 days after a DROP, then deleted automatically", fr: "Données Delta qui doivent être récupérables avec UNDROP pendant 7 jours après un DROP, puis supprimées automatiquement" }
answer:
  mapping: { t1: managed, t2: external, t3: external, t4: managed }
explanation:
  correct:
    en: |
      Managed tables are the default: Unity Catalog manages their files, predictive optimization maintains them, and a dropped managed table can be restored with UNDROP during the 7-day recovery period before its files are deleted. External tables register data in place, including formats that managed tables don't support such as Avro, and suit non-Databricks clients that need direct access to the files. Volumes govern access to files, not tables queried with SQL.
    fr: |
      Les tables managées sont le choix par défaut : Unity Catalog gère leurs fichiers, l'optimisation prédictive les maintient, et une table managée supprimée peut être restaurée avec UNDROP pendant la période de récupération de 7 jours avant la suppression de ses fichiers. Les tables externes inscrivent les données sur place, y compris dans des formats que les tables managées ne prennent pas en charge comme Avro, et conviennent aux clients autres que Databricks qui ont besoin d'un accès direct aux fichiers. Les volumes gouvernent l'accès aux fichiers, pas des tables interrogées en SQL.
references:
  - title: Unity Catalog managed tables for Delta Lake and Apache Iceberg
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/managed
  - title: Work with external tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/external
