stem:
  en: You schedule an INSERT INTO statement that reads the volume path with read_files.
  fr: Vous planifiez une instruction INSERT INTO qui lit le chemin du volume avec read_files.
body:
  solution:
    en: |
      The nightly statement is the following:

      ```sql
      INSERT INTO northwind.bronze.orders
      SELECT * FROM read_files('/Volumes/northwind/landing/raw/orders/', format => 'csv');
      ```
    fr: |
      L'instruction nocturne est la suivante :

      ```sql
      INSERT INTO northwind.bronze.orders
      SELECT * FROM read_files('/Volumes/northwind/landing/raw/orders/', format => 'csv');
      ```
answer: { value: false }
explanation:
  correct:
    en: In a batch query, read_files reads every file present in the path each time the statement runs; it uses Auto Loader and tracks processed files only in streaming table queries. Because each file stays in the volume for 14 days, the nightly INSERT appends its rows up to 14 times, and a rerun after a failure appends them again.
    fr: "Dans une requête par lots, read_files lit tous les fichiers présents dans le chemin à chaque exécution de l'instruction ; il n'utilise Auto Loader et ne suit les fichiers traités que dans les requêtes de tables de streaming. Comme chaque fichier reste 14 jours dans le volume, l'INSERT nocturne ajoute ses lignes jusqu'à 14 fois, et une réexécution après un échec les ajoute à nouveau."
references:
  - title: read_files table-valued function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/read_files
