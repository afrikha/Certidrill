id: dp750-3a-autoloader-csv-infer
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam receives CSV files from field devices in the Unity Catalog volume **/Volumes/fabrikam/raw/landing/devices/**. You are writing a notebook that ingests the files incrementally into **fabrikam.iot.bronze_devices**.

    The solution must meet the following requirements:

    - Infer numeric and date columns with their real data types instead of strings.
    - Persist the inferred schema so that it can evolve over time in **/Volumes/fabrikam/raw/_schemas/devices**.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam reçoit des fichiers CSV provenant d'appareils de terrain dans le volume du catalogue Unity **/Volumes/fabrikam/raw/landing/devices/**. Vous écrivez un notebook qui ingère les fichiers de façon incrémentielle dans **fabrikam.iot.bronze_devices**.

    La solution doit répondre aux exigences suivantes :

    - Inférer les colonnes numériques et de date avec leur type de données réel plutôt qu'en chaînes.
    - Conserver le schéma inféré pour qu'il puisse évoluer au fil du temps dans **/Volumes/fabrikam/raw/_schemas/devices**.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    df = (spark.readStream
      .format([[src]])
      .option("cloudFiles.format", "csv")
      .option("header", "true")
      .option([[types]], "true")
      .option([[loc]], "/Volumes/fabrikam/raw/_schemas/devices")
      .load("/Volumes/fabrikam/raw/landing/devices/"))
  slots:
    - id: src
      options:
        - { id: cloud, text: '"cloudFiles"' }
        - { id: csv, text: '"csv"' }
        - { id: delta, text: '"delta"' }
    - id: types
      options:
        - { id: infercol, text: '"cloudFiles.inferColumnTypes"' }
        - { id: inferschema, text: '"inferSchema"' }
        - { id: hints, text: '"cloudFiles.schemaHints"' }
    - id: loc
      options:
        - { id: schemaloc, text: '"cloudFiles.schemaLocation"' }
        - { id: checkpoint, text: '"checkpointLocation"' }
        - { id: path, text: '"path"' }
answer:
  values: { src: cloud, types: infercol, loc: schemaloc }
explanation:
  correct:
    en: |
      Auto Loader is the `cloudFiles` Structured Streaming source. For CSV, JSON and XML it infers every column as a string unless `cloudFiles.inferColumnTypes` is `true`, and setting `cloudFiles.schemaLocation` enables schema inference and evolution by storing the schema in that directory.
    fr: |
      Auto Loader est la source Structured Streaming `cloudFiles`. Pour CSV, JSON et XML, il infère toutes les colonnes en chaînes sauf si `cloudFiles.inferColumnTypes` vaut `true`, et la définition de `cloudFiles.schemaLocation` active l'inférence et l'évolution du schéma en stockant le schéma dans ce répertoire.
  options:
    csv:
      en: |
        A plain `csv` streaming source is not Auto Loader and does not track discovered files at scale.
      fr: |
        Une source de streaming `csv` simple n'est pas Auto Loader et ne suit pas les fichiers découverts à grande échelle.
    delta:
      en: |
        The source files are CSV, not a Delta table.
      fr: |
        Les fichiers source sont au format CSV, pas une table Delta.
    inferschema:
      en: "`inferSchema` is a DataFrameReader option; with Auto Loader the type inference option is `cloudFiles.inferColumnTypes`."
      fr: "`inferSchema` est une option de DataFrameReader ; avec Auto Loader, l'option d'inférence des types est `cloudFiles.inferColumnTypes`."
    hints:
      en: |
        Schema hints override the types of named columns; they do not turn on type inference for all columns, and they expect a schema string, not `true`.
      fr: |
        Les indicateurs de schéma remplacent le type de colonnes nommées ; ils n'activent pas l'inférence des types pour toutes les colonnes et attendent une chaîne de schéma, pas `true`.
    checkpoint:
      en: "`checkpointLocation` is a writer option that stores stream progress; the reader option that stores the schema is `cloudFiles.schemaLocation`."
      fr: "`checkpointLocation` est une option d'écriture qui stocke la progression du flux ; l'option de lecture qui stocke le schéma est `cloudFiles.schemaLocation`."
references:
  - title: Configure schema inference and evolution in Auto Loader
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
  - title: What is Auto Loader?
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/
