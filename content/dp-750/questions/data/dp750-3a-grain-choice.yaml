id: dp750-3a-grain-choice
objective: "3.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing a star schema in **tailspin.gold**. The requirements are:

    - Analysts must measure the effect of discounts on individual products within each order.
    - Every sale must be attributed to the customer segment that was in effect when the sale occurred, even after the customer changes segment.

    Which grain should you choose for each table? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit un schéma en étoile dans **tailspin.gold**. Les exigences sont les suivantes :

    - Les analystes doivent mesurer l'effet des remises sur chaque produit au sein de chaque commande.
    - Chaque vente doit être attribuée au segment client en vigueur au moment de la vente, même après un changement de segment du client.

    Quelle granularité devez-vous choisir pour chaque table ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      fact_sales: [[fact]]

      dim_customer: [[dim]]
    fr: |
      fact_sales : [[fact]]

      dim_customer : [[dim]]
  slots:
    - id: fact
      options:
        - { id: order, text: { en: "One row per sales order", fr: "Une ligne par commande client" } }
        - { id: line, text: { en: "One row per sales order line item", fr: "Une ligne par ligne de commande client" } }
        - { id: daily, text: { en: "One row per product per store per day", fr: "Une ligne par produit, par magasin et par jour" } }
    - id: dim
      options:
        - { id: percust, text: { en: "One row per customer, updated in place", fr: "Une ligne par client, mise à jour sur place" } }
        - { id: perversion, text: { en: "One row per customer per version", fr: "Une ligne par client et par version" } }
        - { id: permonth, text: { en: "One row per customer per month-end snapshot", fr: "Une ligne par client et par instantané de fin de mois" } }
answer:
  values: { fact: line, dim: perversion }
explanation:
  correct:
    en: |
      Product-level discounts within an order are only visible at the line-item grain. Attributing each sale to the segment in effect at the time requires one dimension row per customer version (SCD Type 2), and the fact rows reference the specific version, so the dimension grain aligns with the fact grain.
    fr: |
      Les remises par produit au sein d'une commande ne sont visibles qu'à la granularité de la ligne de commande. Attribuer chaque vente au segment en vigueur à ce moment-là nécessite une ligne de dimension par version de client (SCD Type 2), et les lignes de faits référencent la version précise : la granularité de la dimension s'aligne ainsi sur celle des faits.
  options:
    fact:
      en: |
        An order-level row mixes all products of the order, and a daily aggregate loses the individual orders.
      fr: |
        Une ligne par commande mélange tous les produits de la commande, et un agrégat quotidien perd les commandes individuelles.
    dim:
      en: |
        Updating in place keeps only the current segment, and month-end snapshots miss segment changes that happen within the month.
      fr: |
        La mise à jour sur place ne conserve que le segment actuel, et les instantanés de fin de mois manquent les changements de segment intervenus en cours de mois.
references:
  - title: Choose granularity on a column or table based on requirements
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/9-choose-granularity
