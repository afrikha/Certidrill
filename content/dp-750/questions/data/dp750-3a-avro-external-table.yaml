id: dp750-3a-avro-external-table
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A third-party system writes Avro files to **abfss://events@stwoodgrove.dfs.core.windows.net/clickstream/** and keeps adding files every hour. The path is in a Unity Catalog external location.

    Analysts must query the data with SQL by using the name **woodgrove.web.clickstream_raw**. The files must stay in Avro at their current location, and the third-party system must keep writing them directly.

    What should you create?
  fr: |
    Un système tiers écrit des fichiers Avro dans **abfss://events@stwoodgrove.dfs.core.windows.net/clickstream/** et continue d'ajouter des fichiers toutes les heures. Le chemin se trouve dans un emplacement externe du catalogue Unity.

    Les analystes doivent interroger les données en SQL au moyen du nom **woodgrove.web.clickstream_raw**. Les fichiers doivent rester au format Avro à leur emplacement actuel, et le système tiers doit continuer à les écrire directement.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A managed Delta table loaded with CREATE TABLE AS SELECT", fr: "Une table Delta managée chargée avec CREATE TABLE AS SELECT" } }
    - { id: b, text: { en: "An external table that uses the AVRO format and the existing path", fr: "Une table externe qui utilise le format AVRO et le chemin existant" } }
    - { id: c, text: { en: "A managed Iceberg table loaded from the files", fr: "Une table Iceberg managée chargée à partir des fichiers" } }
    - { id: d, text: { en: "An external volume on the existing path", fr: "Un volume externe sur le chemin existant" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      External tables can use the DELTA, CSV, JSON, AVRO, PARQUET, ORC and TEXT formats. Databricks recommends them to register a table over existing data that is not compatible with managed tables, such as Avro, or that non-Databricks clients write directly; Unity Catalog manages only the metadata.
    fr: |
      Les tables externes peuvent utiliser les formats DELTA, CSV, JSON, AVRO, PARQUET, ORC et TEXT. Databricks les recommande pour inscrire une table sur des données existantes incompatibles avec les tables managées, comme Avro, ou écrites directement par des clients non Databricks ; le catalogue Unity ne gère que les métadonnées.
  options:
    a:
      en: |
        CREATE TABLE AS SELECT copies the data into a new Delta table, so the files would not stay in Avro and new files would not appear automatically.
      fr: |
        CREATE TABLE AS SELECT copie les données dans une nouvelle table Delta : les fichiers ne resteraient pas au format Avro et les nouveaux fichiers n'apparaîtraient pas automatiquement.
    c:
      en: |
        Managed Iceberg tables store Parquet files in managed storage, so the data would be copied and converted.
      fr: |
        Les tables Iceberg managées stockent des fichiers Parquet dans un stockage managé : les données seraient copiées et converties.
    d:
      en: |
        A volume governs access to files but does not expose them as a table that analysts can query by a three-level table name.
      fr: |
        Un volume gouverne l'accès aux fichiers mais ne les expose pas sous forme de table interrogeable par un nom de table à trois niveaux.
references:
  - title: Work with external tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/external
