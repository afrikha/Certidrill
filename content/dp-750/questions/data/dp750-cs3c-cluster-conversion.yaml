id: dp750-cs3c-cluster-conversion
objective: "3.1.9"
type: dropdown
caseStudy: dp750-cs3c-southridge-video
difficulty: 3
status: draft
stem:
  en: |
    You need to meet data layout requirements 7 and 8. You will run the statements on compute that runs Databricks Runtime 18.1.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences 7 et 8 de disposition des données. Vous exécuterez les instructions sur un calcul qui exécute Databricks Runtime 18.1.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE sv_prod.silver.view_events
      [[conv]];

    [[opt]];
  slots:
    - id: conv
      options:
        - { id: replace, text: "REPLACE PARTITIONED BY WITH CLUSTER BY (title_id, country)" }
        - { id: cluster, text: "CLUSTER BY (title_id, country)" }
        - { id: auto, text: CLUSTER BY AUTO }
    - id: opt
      options:
        - { id: full, text: OPTIMIZE sv_prod.silver.view_events FULL }
        - { id: zorder, text: "OPTIMIZE sv_prod.silver.view_events ZORDER BY (title_id, country)" }
        - { id: vacuum, text: VACUUM sv_prod.silver.view_events }
        - { id: analyze, text: ANALYZE TABLE sv_prod.silver.view_events COMPUTE DELTA STATISTICS }
answer:
  values: { conv: replace, opt: full }
explanation:
  correct:
    en: |
      In Databricks Runtime 18.1 and above, ALTER TABLE … REPLACE PARTITIONED BY WITH CLUSTER BY converts an existing partitioned Delta table to liquid clustering in place, so the table keeps its name and history. Liquid clustering is incremental: OPTIMIZE only rewrites the data that needs clustering, whereas OPTIMIZE … FULL reclusters all the existing data on the new keys, as recommended when you enable clustering for the first time.
    fr: |
      Dans Databricks Runtime 18.1 et versions ultérieures, ALTER TABLE … REPLACE PARTITIONED BY WITH CLUSTER BY convertit sur place une table Delta partitionnée existante au clustering liquide : la table conserve son nom et son historique. Le clustering liquide est incrémentiel : OPTIMIZE ne réécrit que les données qui doivent être clusterisées, alors qu'OPTIMIZE … FULL reclusterise toutes les données existantes sur les nouvelles clés, comme recommandé quand vous activez le clustering pour la première fois.
  options:
    cluster: { en: "ALTER TABLE … CLUSTER BY enables liquid clustering only on an unpartitioned table; clustering is not compatible with partitioning.", fr: "ALTER TABLE … CLUSTER BY n'active le clustering liquide que sur une table non partitionnée ; le clustering n'est pas compatible avec le partitionnement." }
    auto: { en: "CLUSTER BY AUTO lets Azure Databricks choose the keys, whereas the requirement imposes title_id and country.", fr: "CLUSTER BY AUTO laisse Azure Databricks choisir les clés, alors que l'exigence impose title_id et country." }
    zorder: { en: "Z-ordering is not compatible with liquid clustering.", fr: "Le Z-ordering n'est pas compatible avec le clustering liquide." }
    vacuum: { en: "VACUUM removes unused data files; it does not recluster data.", fr: "VACUUM supprime les fichiers de données inutilisés ; il ne reclusterise pas les données." }
    analyze: { en: "Statistics must be recomputed after the conversion only when the partition column is a timestamp; event_date is a DATE, and statistics do not recluster data.", fr: "Les statistiques ne doivent être recalculées après la conversion que lorsque la colonne de partition est un horodatage ; event_date est de type DATE, et les statistiques ne reclusterisent pas les données." }
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
