id: dp750-3c-type-column-match
objective: "3.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is designing the table **northwind.silver.deliveries**, which is used by stores in several time zones. For each column, the type must fit the stated requirement and use as little storage as possible.

    Which data type should you use for each column? To answer, drag the appropriate data types to the correct columns. Each data type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit la table **northwind.silver.deliveries**, utilisée par des magasins situés dans plusieurs fuseaux horaires. Pour chaque colonne, le type doit correspondre à l'exigence indiquée et utiliser le moins de stockage possible.

    Quel type de données devez-vous utiliser pour chaque colonne ? Pour répondre, faites glisser les types de données appropriés vers les colonnes correspondantes. Chaque type de données peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tinyint, text: TINYINT }
    - { id: int, text: INT }
    - { id: ts, text: TIMESTAMP }
    - { id: ntz, text: TIMESTAMP_NTZ }
    - { id: arr, text: "ARRAY<STRING>" }
    - { id: str, text: STRING }
  targets:
    - id: rating
      text: { en: "rating: customer score from 0 to 10", fr: "rating : note du client de 0 à 10" }
    - id: slot
      text: { en: "pickup_slot: local wall-clock time that the store promised, which must read the same in every session time zone", fr: "pickup_slot : heure locale promise par le magasin, qui doit s'afficher de la même façon quel que soit le fuseau horaire de la session" }
    - id: signed
      text: { en: "signed_at: instant at which the customer signed, compared across stores in different time zones", fr: "signed_at : instant de la signature du client, comparé entre magasins de fuseaux horaires différents" }
    - id: tags
      text: { en: "tags: variable-length list of labels such as fragile or express", fr: "tags : liste de longueur variable d'étiquettes comme fragile ou express" }
answer:
  mapping: { rating: tinyint, slot: ntz, signed: ts, tags: arr }
explanation:
  correct:
    en: |
      TINYINT is a 1-byte signed integer, enough for 0 to 10. TIMESTAMP_NTZ stores the date and time fields without any time zone, so the promised local time never shifts. TIMESTAMP represents an instant in the session local time zone, which makes signatures from different stores comparable on one timeline. ARRAY<STRING> holds a sequence of string elements of any length.
    fr: |
      TINYINT est un entier signé sur 1 octet, suffisant pour 0 à 10. TIMESTAMP_NTZ stocke les champs de date et d'heure sans aucun fuseau horaire : l'heure locale promise ne se décale jamais. TIMESTAMP représente un instant dans le fuseau horaire local de la session, ce qui rend comparables sur une même chronologie les signatures de magasins différents. ARRAY<STRING> contient une séquence d'éléments de chaîne de longueur quelconque.
  options:
    int:
      en: |
        INT uses 4 bytes, more than needed for a score from 0 to 10.
      fr: |
        INT utilise 4 octets, plus que nécessaire pour une note de 0 à 10.
    str:
      en: |
        A single STRING would force the labels into a delimited text that must be split in every query.
      fr: |
        Une seule STRING obligerait à stocker les étiquettes dans un texte délimité qu'il faudrait découper dans chaque requête.
references:
  - title: Data types
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-datatypes
  - title: TIMESTAMP_NTZ type
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/data-types/timestamp-ntz-type
