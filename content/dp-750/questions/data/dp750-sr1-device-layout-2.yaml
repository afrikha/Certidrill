stem:
  en: You create the table partitioned by device_id.
  fr: Vous créez la table partitionnée par device_id.
body:
  solution:
    en: |
      You run the following statement:

      ```sql
      CREATE TABLE fabrikam.silver.device_events
      PARTITIONED BY (device_id)
      AS SELECT * FROM fabrikam.staging.device_events;
      ```
    fr: |
      Vous exécutez l'instruction suivante :

      ```sql
      CREATE TABLE fabrikam.silver.device_events
      PARTITIONED BY (device_id)
      AS SELECT * FROM fabrikam.staging.device_events;
      ```
answer: { value: false }
explanation:
  correct:
    en: Partitioning on a column with about two million distinct values creates a huge number of small partitions, and the skew makes a few partitions very large. Changing the partition column next year would also require rewriting the whole table, whereas liquid clustering keys can be redefined without rewriting existing data.
    fr: "Partitionner sur une colonne d'environ deux millions de valeurs distinctes crée un très grand nombre de petites partitions, et l'asymétrie rend quelques partitions très volumineuses. Changer la colonne de partition l'année prochaine nécessiterait aussi de réécrire toute la table, alors que les clés de clustering liquide peuvent être redéfinies sans réécrire les données existantes."
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
