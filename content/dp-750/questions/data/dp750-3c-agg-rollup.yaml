id: dp750-3c-agg-rollup
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware builds the table **litware.gold.revenue_summary** from **litware.silver.sales** in one query. The table must contain the following rows:

    - One row for each combination of **region** and **country**.
    - One subtotal row for each region.
    - One grand total row.

    The table must not contain subtotal rows for a country across all regions.

    Which GROUP BY clause should you use?
  fr: |
    Litware crée la table **litware.gold.revenue_summary** à partir de **litware.silver.sales** en une seule requête. La table doit contenir les lignes suivantes :

    - Une ligne pour chaque combinaison de **region** et de **country**.
    - Une ligne de sous-total pour chaque région.
    - Une ligne de total général.

    La table ne doit pas contenir de lignes de sous-total d'un pays sur l'ensemble des régions.

    Quelle clause GROUP BY devez-vous utiliser ?
body:
  options:
    - { id: a, text: "GROUP BY CUBE (region, country)" }
    - { id: b, text: "GROUP BY region, country" }
    - { id: c, text: "GROUP BY GROUPING SETS ((region, country), (country), ())" }
    - { id: d, text: "GROUP BY ROLLUP (region, country)" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `ROLLUP (region, country)` is equivalent to `GROUPING SETS ((region, country), (region), ())`: the detail rows, one subtotal per region and a grand total. N elements of a ROLLUP produce N+1 grouping sets.
    fr: |
      `ROLLUP (region, country)` équivaut à `GROUPING SETS ((region, country), (region), ())` : les lignes de détail, un sous-total par région et un total général. N éléments d'un ROLLUP produisent N+1 ensembles de regroupement.
  options:
    a:
      en: |
        CUBE produces every combination, 2^N grouping sets, so it also adds a subtotal per country, which the table must not contain.
      fr: |
        CUBE produit toutes les combinaisons, soit 2^N ensembles de regroupement : il ajoute donc aussi un sous-total par pays, que la table ne doit pas contenir.
    b:
      en: |
        A plain GROUP BY returns only the detail rows, without subtotals or a grand total.
      fr: |
        Un GROUP BY simple ne renvoie que les lignes de détail, sans sous-totaux ni total général.
    c:
      en: |
        These grouping sets produce country subtotals instead of region subtotals.
      fr: |
        Ces ensembles de regroupement produisent des sous-totaux par pays au lieu de sous-totaux par région.
references:
  - title: GROUP BY clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-groupby
