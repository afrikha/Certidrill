id: dp750-cs4b-events-layout
objective: "3.1.9"
type: single
caseStudy: dp750-cs4b-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You need to choose the data layout of fc_prod.silver.machine_events_v2 to meet the data layout requirement. What should you use?
  fr: |
    Vous devez choisir la disposition des données de fc_prod.silver.machine_events_v2 pour satisfaire l'exigence de disposition des données. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Partitioning by machine_id and by the date of event_ts", fr: "Un partitionnement par machine_id et par la date de event_ts" } }
    - { id: b, text: { en: "Partitioning by the date of event_ts, with Z-ordering on machine_id", fr: "Un partitionnement par la date de event_ts, avec un ordre Z (ZORDER) sur machine_id" } }
    - { id: c, text: { en: "Liquid clustering on machine_id and event_ts", fr: "Le clustering liquide (liquid clustering) sur machine_id et event_ts" } }
    - { id: d, text: { en: "Partitioning by the date of event_ts, with deletion vectors enabled", fr: "Un partitionnement par la date de event_ts, avec les vecteurs de suppression activés" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Liquid clustering replaces partitioning and Z-ordering and suits filters on high-cardinality columns such as machine_id. You can redefine the clustering keys with ALTER TABLE … CLUSTER BY without rewriting existing data; later OPTIMIZE and write operations use the new keys.
    fr: |
      Le clustering liquide remplace le partitionnement et l'ordre Z (ZORDER) et convient aux filtres sur des colonnes à forte cardinalité comme machine_id. Vous pouvez redéfinir les clés de clustering avec ALTER TABLE … CLUSTER BY sans réécrire les données existantes ; les opérations OPTIMIZE et d'écriture suivantes utilisent les nouvelles clés.
  options:
    a:
      en: |
        Partitioning on a high-cardinality column creates many small partitions and files, the problem of the current table, and changing partition columns requires rewriting the table.
      fr: |
        Un partitionnement sur une colonne à forte cardinalité crée de nombreuses petites partitions et de nombreux petits fichiers, le problème de la table actuelle, et changer les colonnes de partition impose de réécrire la table.
    b:
      en: |
        Z-ordering can speed up machine_id filters, but changing the partition column means rewriting the table, which the requirement forbids.
      fr: |
        L'ordre Z peut accélérer les filtres sur machine_id, mais changer la colonne de partition implique de réécrire la table, ce que l'exigence interdit.
    d:
      en: |
        Deletion vectors speed up deletes, updates and merges; they do not reduce the files read by filters on machine_id.
      fr: |
        Les vecteurs de suppression accélèrent les suppressions, les mises à jour et les fusions ; ils ne réduisent pas les fichiers lus par les filtres sur machine_id.
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
