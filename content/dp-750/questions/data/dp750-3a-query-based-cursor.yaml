id: dp750-3a-query-based-cursor
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware runs a MySQL database that holds a **customers** table. You need to ingest the table into **litware.crm.customers** every two hours.

    - The binary log (binlog) is not enabled, and the database team will not enable it.
    - No component may be deployed in Litware's network for the ingestion.
    - Every row has an `updated_at` column whose value increases each time the row changes.
    - Analysts need every version of a customer, with version metadata, in the destination table.
    - Development and maintenance effort must be minimized.

    How should you configure the ingestion? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exploite une base de données MySQL qui contient une table **customers**. Vous devez ingérer la table dans **litware.crm.customers** toutes les deux heures.

    - Le journal binaire (binlog) n'est pas activé et l'équipe de base de données refuse de l'activer.
    - Aucun composant ne peut être déployé dans le réseau de Litware pour l'ingestion.
    - Chaque ligne possède une colonne `updated_at` dont la valeur augmente à chaque modification de la ligne.
    - Les analystes ont besoin de chaque version d'un client, avec des métadonnées de version, dans la table de destination.
    - L'effort de développement et de maintenance doit être réduit au minimum.

    Comment devez-vous configurer l'ingestion ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ingestion tool: [[tool]]

      Change detection: [[detect]]

      History mode: [[hist]]
    fr: |
      Outil d'ingestion : [[tool]]

      Détection des changements : [[detect]]

      Mode d'historique : [[hist]]
  slots:
    - id: tool
      options:
        - { id: cdc, text: { en: "Lakeflow Connect database (CDC) connector", fr: "Connecteur de base de données (CDC) Lakeflow Connect" } }
        - { id: query, text: { en: "Lakeflow Connect query-based connector", fr: "Connecteur basé sur les requêtes Lakeflow Connect" } }
        - { id: fed, text: { en: "Lakehouse Federation foreign catalog", fr: "Catalogue étranger Lakehouse Federation" } }
        - { id: nb, text: { en: "Notebook with a JDBC MERGE", fr: "Notebook avec un MERGE JDBC" } }
    - id: detect
      options:
        - { id: cursor, text: { en: "Cursor column `updated_at`", fr: "Colonne de curseur `updated_at`" } }
        - { id: binlog, text: { en: "Binary log (binlog)", fr: "Journal binaire (binlog)" } }
        - { id: cdf, text: { en: "Delta change data feed", fr: "Flux de changements de données Delta (change data feed)" } }
    - id: hist
      options:
        - { id: scd1, text: SCD Type 1 }
        - { id: scd2, text: SCD Type 2 }
        - { id: append, text: { en: "Append-only", fr: "Ajout uniquement (append-only)" } }
answer:
  values: { tool: query, detect: cursor, hist: scd2 }
explanation:
  correct:
    en: |
      A query-based connector queries the source tables on a schedule and retrieves the rows whose cursor column value is greater than the high-water mark of the previous run. It needs neither CDC or binlog infrastructure nor an ingestion gateway or staging storage, and its SCD Type 2 history mode keeps every version with version metadata.
    fr: |
      Un connecteur basé sur les requêtes interroge les tables source selon une planification et récupère les lignes dont la valeur de la colonne de curseur est supérieure à la limite supérieure de l'exécution précédente. Il ne nécessite ni infrastructure CDC ou binlog, ni passerelle d'ingestion ou stockage intermédiaire, et son mode d'historique SCD Type 2 conserve chaque version avec des métadonnées de version.
  options:
    tool:
      en: |
        The CDC connector reads the binlog and needs an ingestion gateway; Lakehouse Federation gives read-only live access without copying history; a notebook works but requires custom code to maintain.
      fr: |
        Le connecteur CDC lit le binlog et nécessite une passerelle d'ingestion ; Lakehouse Federation offre un accès en direct en lecture seule sans copie de l'historique ; un notebook fonctionne mais demande du code personnalisé à maintenir.
    detect:
      en: |
        The binlog is not enabled, and the change data feed is a feature of Delta tables, not of a MySQL source.
      fr: |
        Le binlog n'est pas activé, et le flux de changements de données est une fonctionnalité des tables Delta, pas d'une source MySQL.
    hist:
      en: |
        SCD Type 1 overwrites rows without history, and append-only adds rows without version metadata.
      fr: |
        SCD Type 1 écrase les lignes sans historique, et le mode d'ajout uniquement ajoute des lignes sans métadonnées de version.
references:
  - title: Choose a data ingestion tool
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/3-choose-data-ingestion-tool
