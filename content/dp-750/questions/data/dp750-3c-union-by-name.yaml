id: dp750-3c-union-by-name
objective: "3.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso receives monthly order extracts that are loaded into the DataFrames **jan_df** and **feb_df**. The February extract lists the same columns in a different order and adds a **promo_code** column that the January extract does not have. Some orders appear, identical, in both extracts.

    You need to combine the two DataFrames into **contoso.silver.orders_q1** so that values land in the correct columns, January rows have a null **promo_code**, and each identical row appears only once.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso reçoit des extraits mensuels de commandes chargés dans les DataFrames **jan_df** et **feb_df**. L'extrait de février liste les mêmes colonnes dans un ordre différent et ajoute une colonne **promo_code** que l'extrait de janvier n'a pas. Certaines commandes figurent, à l'identique, dans les deux extraits.

    Vous devez combiner les deux DataFrames dans **contoso.silver.orders_q1** afin que les valeurs arrivent dans les bonnes colonnes, que les lignes de janvier aient un **promo_code** null et que chaque ligne identique n'apparaisse qu'une seule fois.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    orders_q1 = (jan_df
        .[[method]](feb_df, [[arg]])
        .[[dedup]]())

    orders_q1.write.mode("overwrite").saveAsTable("contoso.silver.orders_q1")
  slots:
    - id: method
      options:
        - { id: union, text: union }
        - { id: byname, text: unionByName }
        - { id: intersect, text: intersect }
    - id: arg
      options:
        - { id: allowtrue, text: allowMissingColumns=True }
        - { id: allowfalse, text: allowMissingColumns=False }
        - { id: on, text: "on=\"order_id\"" }
    - id: dedup
      options:
        - { id: distinct, text: distinct }
        - { id: dropna, text: dropna }
        - { id: cache, text: cache }
answer:
  values: { method: byname, arg: allowtrue, dedup: distinct }
explanation:
  correct:
    en: |
      `unionByName` resolves columns by name rather than by position, so the reordered February columns line up correctly. With `allowMissingColumns=True`, a column missing from one DataFrame is filled with NULL. Like `union`, it keeps every row, so `distinct()` removes the rows that appear in both extracts.
    fr: |
      `unionByName` résout les colonnes par nom plutôt que par position : les colonnes réordonnées de février s'alignent donc correctement. Avec `allowMissingColumns=True`, une colonne absente d'un DataFrame est remplie avec NULL. Comme `union`, il conserve toutes les lignes : `distinct()` supprime donc les lignes présentes dans les deux extraits.
  options:
    union:
      en: "`union` matches columns by position, so values of the reordered columns would land in the wrong columns, and it does not accept a missing-columns option."
      fr: "`union` fait correspondre les colonnes par position : les valeurs des colonnes réordonnées arriveraient dans les mauvaises colonnes, et il n'accepte pas d'option pour les colonnes manquantes."
    intersect:
      en: "`intersect` returns only the rows present in both DataFrames."
      fr: "`intersect` ne renvoie que les lignes présentes dans les deux DataFrames."
    allowfalse:
      en: |
        False is the default: the missing promo_code column of January makes the union fail.
      fr: |
        False est la valeur par défaut : la colonne promo_code absente de janvier fait échouer l'union.
    on:
      en: "`on` is a parameter of `join`, not of a union."
      fr: "`on` est un paramètre de `join`, pas d'une union."
    dropna:
      en: "`dropna` removes rows that contain nulls, which would remove every January row; it does not remove duplicates."
      fr: "`dropna` supprime les lignes qui contiennent des null, ce qui supprimerait toutes les lignes de janvier ; il ne supprime pas les doublons."
    cache:
      en: "`cache` keeps the DataFrame in memory; it does not change its rows."
      fr: "`cache` conserve le DataFrame en mémoire ; il ne modifie pas ses lignes."
references:
  - title: unionByName
    url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframe/unionbyname
