id: dp750-3c-profile-describe-summary
objective: "3.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum is profiling the table **adatum.silver.invoices** before building gold aggregates. A data engineer compares three ways to profile the table from a Python notebook: `df.describe()`, `df.summary()` and `dbutils.data.summarize(df)`, where **df** contains the whole table.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum profile la table **adatum.silver.invoices** avant de créer des agrégats gold. Un ingénieur données compare trois façons de profiler la table depuis un notebook Python : `df.describe()`, `df.summary()` et `dbutils.data.summarize(df)`, où **df** contient toute la table.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Without arguments, df.summary() returns the 25%, 50% and 75% percentiles in addition to the statistics of df.describe().", fr: "Sans argument, df.summary() renvoie les centiles 25 %, 50 % et 75 % en plus des statistiques de df.describe()." } }
    - { id: b, text: { en: "Without arguments, df.describe() returns the number of null values of each column.", fr: "Sans argument, df.describe() renvoie le nombre de valeurs null de chaque colonne." } }
    - { id: c, text: { en: "dbutils.data.summarize(df) analyzes the complete contents of the DataFrame, which can be expensive on a very large table.", fr: "dbutils.data.summarize(df) analyse tout le contenu du DataFrame, ce qui peut être coûteux sur une très grande table." } }
    - { id: d, text: { en: "dbutils.data.summarize(df) computes its statistics on a random 10 % sample of the rows.", fr: "dbutils.data.summarize(df) calcule ses statistiques sur un échantillon aléatoire de 10 % des lignes." } }
    - { id: e, text: { en: "df.summary() displays a histogram of the value distribution of each column.", fr: "df.summary() affiche un histogramme de la distribution des valeurs de chaque colonne." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      `describe()` returns count, mean, stddev, min and max; `summary()` returns the same statistics plus the 25%, 50% and 75% approximate percentiles by default. `dbutils.data.summarize` analyzes the complete contents of the DataFrame, so it can be very expensive for very large DataFrames; by default, some of its statistics are approximate to reduce the run time.
    fr: |
      `describe()` renvoie count, mean, stddev, min et max ; `summary()` renvoie par défaut les mêmes statistiques plus les centiles approximatifs 25 %, 50 % et 75 %. `dbutils.data.summarize` analyse tout le contenu du DataFrame et peut donc être très coûteux pour de très grands DataFrames ; par défaut, certaines de ses statistiques sont approximatives pour réduire la durée d'exécution.
  options:
    b:
      en: |
        The count returned by `describe()` is the number of non-null values; the number of nulls must be derived from the row count.
      fr: |
        Le count renvoyé par `describe()` est le nombre de valeurs non null ; le nombre de null doit être déduit du nombre de lignes.
    d:
      en: |
        The command does not sample rows: it reads the whole DataFrame and uses approximation algorithms only for some statistics.
      fr: |
        La commande n'échantillonne pas les lignes : elle lit tout le DataFrame et n'utilise des algorithmes d'approximation que pour certaines statistiques.
    e:
      en: "`summary()` returns a DataFrame of statistics; histograms come from the Data Profile tab or `dbutils.data.summarize`."
      fr: "`summary()` renvoie un DataFrame de statistiques ; les histogrammes proviennent de l'onglet Data Profile ou de `dbutils.data.summarize`."
references:
  - title: summary
    url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframe/summary
  - title: Databricks Utilities (dbutils) reference
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-utils
