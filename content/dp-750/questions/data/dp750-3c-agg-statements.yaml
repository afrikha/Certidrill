id: dp750-3c-agg-statements
objective: "3.3.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs the following query against **fabrikam.silver.tickets**, in which **agent_id** is null for tickets that are not assigned yet.

    ```sql
    SELECT agent_id,
           count(*)                    AS tickets,
           count(DISTINCT customer_id) AS customers
    FROM fabrikam.silver.tickets
    WHERE status <> 'spam'
    GROUP BY agent_id;
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute la requête suivante sur **fabrikam.silver.tickets**, dans laquelle **agent_id** est null pour les tickets qui ne sont pas encore attribués.

    ```sql
    SELECT agent_id,
           count(*)                    AS tickets,
           count(DISTINCT customer_id) AS customers
    FROM fabrikam.silver.tickets
    WHERE status <> 'spam'
    GROUP BY agent_id;
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The rows whose status is spam are removed before the rows are grouped.
        fr: |
          Les lignes dont le statut est spam sont supprimées avant le regroupement des lignes.
    - id: s2
      text:
        en: |
          All the unassigned tickets are counted together in a single result row whose agent_id is null.
        fr: |
          Tous les tickets non attribués sont comptés ensemble dans une seule ligne de résultat dont agent_id est null.
    - id: s3
      text:
        en: |
          Tickets whose customer_id is null increase the customers value of their group by one.
        fr: |
          Les tickets dont customer_id est null augmentent de un la valeur customers de leur groupe.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      WHERE filters individual rows before GROUP BY forms the groups. For grouping, NULL values are placed together in the same bucket, so the unassigned tickets form one group with a null agent_id. Aggregate functions ignore NULL values, except `count(*)`, so a null customer_id does not add a distinct customer.
    fr: |
      WHERE filtre les lignes individuelles avant que GROUP BY forme les groupes. Pour le regroupement, les valeurs NULL sont placées ensemble dans le même compartiment : les tickets non attribués forment donc un seul groupe dont agent_id est null. Les fonctions d'agrégation ignorent les valeurs NULL, sauf `count(*)` : un customer_id null n'ajoute donc pas de client distinct.
references:
  - title: NULL semantics
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-null-semantics
  - title: GROUP BY clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-groupby
