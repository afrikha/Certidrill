stem:
  en: You add the mergeSchema option to the append.
  fr: Vous ajoutez l'option mergeSchema à l'ajout.
body:
  solution:
    en: |
      You replace the write to bookings with the following code.

      ```python
      (df.write
        .mode("append")
        .option("mergeSchema", "true")
        .saveAsTable("tailspin_prod.silver.bookings"))
      ```
    fr: |
      Vous remplacez l'écriture dans bookings par le code suivant.

      ```python
      (df.write
        .mode("append")
        .option("mergeSchema", "true")
        .saveAsTable("tailspin_prod.silver.bookings"))
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      Schema enforcement rejects a write whose columns do not exist in the target table. The `mergeSchema` write option enables schema evolution for this write only: source columns that are missing from bookings, such as `loyalty_tier`, are added at the end of the schema, and the existing rows get `NULL` for them. The other writes of the notebook keep schema enforcement.
    fr: |
      L'application du schéma rejette une écriture dont les colonnes n'existent pas dans la table cible. L'option d'écriture `mergeSchema` active l'évolution du schéma pour cette seule écriture : les colonnes sources absentes de bookings, comme `loyalty_tier`, sont ajoutées à la fin du schéma, et les lignes existantes reçoivent `NULL` pour ces colonnes. Les autres écritures du notebook conservent l'application du schéma.
references:
  - title: Update table schemas with schema evolution
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/update-schema
