id: dp750-3b-layout-statements
objective: "3.1.9"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses liquid clustering on the Delta table **wingtip.sales.orders**, which has deletion vectors and row tracking enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise le clustering liquide sur la table Delta **wingtip.sales.orders**, sur laquelle les vecteurs de suppression et le suivi des lignes sont activés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Changing the clustering keys with ALTER TABLE ... CLUSTER BY immediately rewrites the existing data files.
        fr: |
          Modifier les clés de clustering avec ALTER TABLE ... CLUSTER BY réécrit immédiatement les fichiers de données existants.
    - id: s2
      text:
        en: |
          You can run OPTIMIZE ... ZORDER BY on the table to improve data skipping on a column that isn't a clustering key.
        fr: |
          Vous pouvez exécuter OPTIMIZE ... ZORDER BY sur la table pour améliorer le saut de données sur une colonne qui n'est pas une clé de clustering.
    - id: s3
      text:
        en: |
          If you turn off deletion vectors on the table, row-level concurrency is also turned off.
        fr: |
          Si vous désactivez les vecteurs de suppression sur la table, la concurrence au niveau des lignes est également désactivée.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Changing the clustering keys doesn't rewrite existing data; later OPTIMIZE and write operations use the new keys, and OPTIMIZE ... FULL reclusters existing data. Liquid clustering isn't compatible with ZORDER. Row-level concurrency depends on deletion vectors and row tracking, so turning off either one also turns it off.
    fr: |
      Modifier les clés de clustering ne réécrit pas les données existantes ; les OPTIMIZE et les écritures suivants utilisent les nouvelles clés, et OPTIMIZE ... FULL reclusterise les données existantes. Le clustering liquide n'est pas compatible avec ZORDER. La concurrence au niveau des lignes dépend des vecteurs de suppression et du suivi des lignes : désactiver l'un ou l'autre la désactive aussi.
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
