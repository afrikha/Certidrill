id: dp750-3a-delta-default-cdf
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum is creating the silver table **adatum.finance.invoices** in Unity Catalog. All the workloads that read and write the table run in Azure Databricks.

    The table must support ACID transactions and time travel, and downstream pipelines must read its row-level changes through the change data feed.

    Which table format should you use?
  fr: |
    Adatum crée la table silver **adatum.finance.invoices** dans le catalogue Unity. Toutes les charges de travail qui lisent et écrivent la table s'exécutent dans Azure Databricks.

    La table doit prendre en charge les transactions ACID et le voyage dans le temps, et les pipelines en aval doivent lire ses changements au niveau des lignes au moyen du flux de changements de données (change data feed).

    Quel format de table devez-vous utiliser ?
body:
  options:
    - { id: a, text: Apache Iceberg }
    - { id: b, text: Delta Lake }
    - { id: c, text: Parquet }
    - { id: d, text: JSON }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Delta Lake is the default and recommended table format in Azure Databricks. Its transaction log provides ACID transactions and time travel, and the change data feed is specific to Delta Lake because it relies on that log.
    fr: |
      Delta Lake est le format de table par défaut et recommandé dans Azure Databricks. Son journal des transactions fournit les transactions ACID et le voyage dans le temps, et le flux de changements de données est propre à Delta Lake, car il repose sur ce journal.
  options:
    a:
      en: |
        Iceberg also offers ACID transactions and time travel, but the change data feed is a Delta Lake feature, and Iceberg is chosen mainly for interoperability with other engines.
      fr: |
        Iceberg offre aussi les transactions ACID et le voyage dans le temps, mais le flux de changements de données est une fonctionnalité de Delta Lake, et Iceberg se choisit surtout pour l'interopérabilité avec d'autres moteurs.
    c:
      en: |
        Parquet is a file format without a transaction log, so it provides neither ACID transactions nor time travel.
      fr: |
        Parquet est un format de fichier sans journal des transactions : il ne fournit ni transactions ACID ni voyage dans le temps.
    d:
      en: |
        JSON is a text file format suited to landing zones; it has no ACID transactions or time travel.
      fr: |
        JSON est un format de fichier texte adapté aux zones d'atterrissage ; il n'offre ni transactions ACID ni voyage dans le temps.
references:
  - title: Choose a data table format
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/4-choose-data-table-format
