id: dp750-3c-type-statements
objective: "3.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is reviewing the column types of **fabrikam.silver.sensor_readings** before it promotes the table to production. The table has a **reading_ts** column of type TIMESTAMP, a **local_ts** column of type TIMESTAMP_NTZ and a **temperature** column of type FLOAT.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam passe en revue les types de colonnes de **fabrikam.silver.sensor_readings** avant de promouvoir la table en production. La table contient une colonne **reading_ts** de type TIMESTAMP, une colonne **local_ts** de type TIMESTAMP_NTZ et une colonne **temperature** de type FLOAT.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A DECIMAL column can have a precision of up to 38 digits.
        fr: |
          Une colonne DECIMAL peut avoir une précision allant jusqu'à 38 chiffres.
    - id: s2
      text:
        en: |
          The temperature column uses 8 bytes per value.
        fr: |
          La colonne temperature utilise 8 octets par valeur.
    - id: s3
      text:
        en: |
          When the session time zone changes, the displayed values of reading_ts change, while the values of local_ts stay the same.
        fr: |
          Lorsque le fuseau horaire de la session change, les valeurs affichées de reading_ts changent, tandis que les valeurs de local_ts restent les mêmes.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      DECIMAL precision is between 1 and 38, with a default of 10. FLOAT is a 4-byte single-precision floating-point type; DOUBLE is the 8-byte type. TIMESTAMP values are interpreted in the session local time zone, whereas TIMESTAMP_NTZ performs every operation without taking any time zone into account.
    fr: |
      La précision de DECIMAL est comprise entre 1 et 38, avec une valeur par défaut de 10. FLOAT est un type à virgule flottante simple précision sur 4 octets ; DOUBLE est le type sur 8 octets. Les valeurs TIMESTAMP sont interprétées dans le fuseau horaire local de la session, alors que TIMESTAMP_NTZ effectue toutes les opérations sans tenir compte d'aucun fuseau horaire.
references:
  - title: Data types
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-datatypes
  - title: DECIMAL type
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/data-types/decimal-type
