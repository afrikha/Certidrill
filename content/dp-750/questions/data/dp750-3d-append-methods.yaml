id: dp750-3d-append-methods
objective: "3.3.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Delta table named **contoso.sales.orders**. Each day, the new orders arrive in the table **contoso.staging.orders_today**, which has the same columns in the same order. A notebook also exposes these rows as a DataFrame named `new_orders_df`.

    You need to add the new orders to contoso.sales.orders. The existing orders must be kept.

    Which two code snippets should you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une table Delta nommée **contoso.sales.orders**. Chaque jour, les nouvelles commandes arrivent dans la table **contoso.staging.orders_today**, qui a les mêmes colonnes dans le même ordre. Un notebook expose aussi ces lignes sous la forme d'un DataFrame nommé `new_orders_df`.

    Vous devez ajouter les nouvelles commandes à contoso.sales.orders. Les commandes existantes doivent être conservées.

    Quels sont les deux extraits de code à utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`INSERT OVERWRITE contoso.sales.orders SELECT * FROM contoso.staging.orders_today`" }
    - { id: b, text: "`INSERT INTO contoso.sales.orders SELECT * FROM contoso.staging.orders_today`" }
    - { id: c, text: "`new_orders_df.write.mode(\"overwrite\").saveAsTable(\"contoso.sales.orders\")`" }
    - { id: d, text: "`CREATE OR REPLACE TABLE contoso.sales.orders AS SELECT * FROM contoso.staging.orders_today`" }
    - { id: e, text: "`new_orders_df.write.mode(\"append\").saveAsTable(\"contoso.sales.orders\")`" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      `INSERT INTO` adds the query rows to the existing rows of the table, and the DataFrame writer in `append` mode does the same from Python. Neither removes existing data, but neither is idempotent: running them twice for the same day duplicates the orders.
    fr: |
      `INSERT INTO` ajoute les lignes de la requête aux lignes existantes de la table, et le writer de DataFrame en mode `append` fait de même depuis Python. Aucun des deux ne supprime de données existantes, mais aucun n'est idempotent : les exécuter deux fois pour le même jour duplique les commandes.
  options:
    a:
      en: |
        `INSERT OVERWRITE` without a partition specification truncates the table before inserting, so the existing orders are lost.
      fr: |
        `INSERT OVERWRITE` sans spécification de partition tronque la table avant l'insertion : les commandes existantes sont perdues.
    c:
      en: |
        The `overwrite` mode replaces the whole content of the table with the DataFrame.
      fr: |
        Le mode `overwrite` remplace tout le contenu de la table par le DataFrame.
    d:
      en: |
        `CREATE OR REPLACE TABLE ... AS SELECT` replaces the table with the result of the query, so only the new orders remain.
      fr: |
        `CREATE OR REPLACE TABLE ... AS SELECT` remplace la table par le résultat de la requête : seules les nouvelles commandes restent.
references:
  - title: INSERT
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-dml-insert-into
