id: dp750-3c-ldp-autoloader-statements
objective: "3.2.7"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware is moving its notebook-based Auto Loader ingestion to a Lakeflow Spark Declarative Pipeline. The pipeline will contain SQL streaming tables that use `STREAM read_files(...)` and Python streaming tables that use `spark.readStream.format("cloudFiles")`, some of them fed by named append flows.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware migre son ingestion Auto Loader basée sur des notebooks vers un pipeline Lakeflow Spark Declarative Pipelines. Le pipeline contiendra des tables de streaming SQL qui utilisent `STREAM read_files(...)` et des tables de streaming Python qui utilisent `spark.readStream.format("cloudFiles")`, certaines alimentées par des flux d'ajout nommés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Each Python streaming table that uses cloudFiles must set the cloudFiles.schemaLocation option to a path in a volume.
        fr: |
          Chaque table de streaming Python qui utilise cloudFiles doit définir l'option cloudFiles.schemaLocation sur un chemin d'un volume.
    - id: s2
      text:
        en: |
          Without any option, read_files infers the exact types of CSV columns, while cloudFiles infers them as strings.
        fr: |
          Sans aucune option, read_files infère le type exact des colonnes CSV, tandis que cloudFiles les infère en chaînes.
    - id: s3
      text:
        en: |
          After you rename an append flow, the flow resumes from the checkpoint of its previous name.
        fr: |
          Après que vous avez renommé un flux d'ajout, le flux reprend à partir du point de contrôle de son ancien nom.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      In a pipeline, Azure Databricks manages the schema location and the other checkpoint information automatically. The `inferColumnTypes` option defaults to `true` for `read_files`, the opposite of the Auto Loader `cloudFiles` default, which infers JSON and CSV columns as strings. A flow name identifies its streaming checkpoint, so a renamed flow is effectively a new flow and does not carry over the old checkpoint.
    fr: |
      Dans un pipeline, Azure Databricks gère automatiquement l'emplacement du schéma et les autres informations de point de contrôle. L'option `inferColumnTypes` vaut `true` par défaut pour `read_files`, à l'inverse de la valeur par défaut d'Auto Loader avec `cloudFiles`, qui infère les colonnes JSON et CSV en chaînes. Le nom d'un flux identifie son point de contrôle de streaming : un flux renommé est en réalité un nouveau flux et ne reprend pas l'ancien point de contrôle.
references:
  - title: read_files table-valued function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/read_files
  - title: Use flows in Lakeflow pipelines
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/flow-examples
