id: dp750-3d-key-uniqueness
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Delta table named **fabrikam.silver.customers** that declares `CONSTRAINT customers_pk PRIMARY KEY (customer_id)`. A Lakeflow job has a task that loads the table and a second task that publishes it to the gold layer. Analysts found duplicate `customer_id` values in the table.

    You need to ensure that the job stops before the publishing task whenever fabrikam.silver.customers contains a duplicate `customer_id` value.

    What should you do?
  fr: |
    Fabrikam dispose d'une table Delta nommée **fabrikam.silver.customers** qui déclare `CONSTRAINT customers_pk PRIMARY KEY (customer_id)`. Un job Lakeflow comporte une tâche qui charge la table et une seconde tâche qui la publie dans la couche gold. Les analystes ont trouvé des valeurs `customer_id` en double dans la table.

    Vous devez faire en sorte que le job s'arrête avant la tâche de publication chaque fois que fabrikam.silver.customers contient une valeur `customer_id` en double.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add the constraint `CHECK (count(DISTINCT customer_id) = count(*))` to the table so that the load task fails."
        fr: "Ajouter la contrainte `CHECK (count(DISTINCT customer_id) = count(*))` à la table pour que la tâche de chargement échoue."
    - id: b
      text:
        en: "Add the constraint `UNIQUE (customer_id)` to the table so that writes with a duplicate key fail."
        fr: "Ajouter la contrainte `UNIQUE (customer_id)` à la table pour que les écritures avec une clé en double échouent."
    - id: c
      text:
        en: "Add a task that compares `count(*)` with `count(DISTINCT customer_id)` and raises an error when they differ."
        fr: "Ajouter une tâche qui compare `count(*)` à `count(DISTINCT customer_id)` et lève une erreur quand ils diffèrent."
    - id: d
      text:
        en: "Run `ALTER TABLE ... ALTER COLUMN customer_id SET NOT NULL` before the load task runs."
        fr: "Exécuter `ALTER TABLE ... ALTER COLUMN customer_id SET NOT NULL` avant l'exécution de la tâche de chargement."
answer:
  optionId: c
explanation:
  correct:
    en: |
      Primary key constraints in Unity Catalog are informational and don't prevent duplicates. A cardinality check is a query: when the row count differs from the number of distinct keys, the key isn't unique. A task placed between loading and publishing that raises an error makes the job fail before the gold layer is updated.
    fr: |
      Les contraintes de clé primaire du catalogue Unity sont informatives et n'empêchent pas les doublons. Une vérification de cardinalité est une requête : quand le nombre de lignes diffère du nombre de clés distinctes, la clé n'est pas unique. Une tâche placée entre le chargement et la publication qui lève une erreur fait échouer le job avant la mise à jour de la couche gold.
  options:
    a:
      en: |
        A `CHECK` expression is evaluated per row and can't use aggregate functions such as `count`.
      fr: |
        Une expression `CHECK` est évaluée par ligne et ne peut pas utiliser de fonctions d'agrégation comme `count`.
    b:
      en: |
        Unique constraints are informational, like primary keys: they don't reject or detect duplicates.
      fr: |
        Les contraintes d'unicité sont informatives, comme les clés primaires : elles ne rejettent ni ne détectent les doublons.
    d:
      en: |
        `NOT NULL` rejects null values only; duplicate non-null values are still accepted.
      fr: |
        `NOT NULL` rejette uniquement les valeurs null ; les doublons non null sont toujours acceptés.
references:
  - title: Constraints on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/constraints
