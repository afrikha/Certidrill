id: dp750-3c-profile-statements
objective: "3.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso is defining how its data engineers profile new bronze tables such as **contoso.bronze.web_sessions**, which contains a nullable **referrer** column. Some engineers work in SQL notebooks, others in Python notebooks that use pandas DataFrames for small extracts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso définit la façon dont ses ingénieurs données profilent les nouvelles tables bronze comme **contoso.bronze.web_sessions**, qui contient une colonne **referrer** pouvant être null. Certains ingénieurs travaillent dans des notebooks SQL, d'autres dans des notebooks Python qui utilisent des DataFrames pandas pour de petits extraits.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          In SQL, count(*) - count(referrer) returns the number of rows in which referrer is null.
        fr: |
          En SQL, count(*) - count(referrer) renvoie le nombre de lignes dans lesquelles referrer est null.
    - id: s2
      text:
        en: |
          An engineer can run dbutils.data.summarize directly in a SQL cell to profile the table.
        fr: |
          Un ingénieur peut exécuter dbutils.data.summarize directement dans une cellule SQL pour profiler la table.
    - id: s3
      text:
        en: |
          dbutils.data.summarize accepts a pandas DataFrame as well as an Apache Spark DataFrame.
        fr: |
          dbutils.data.summarize accepte un DataFrame pandas aussi bien qu'un DataFrame Apache Spark.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      `count(*)` counts every row, while `count(referrer)` ignores nulls, so the difference is the number of null values. The summarize command calculates and displays summary statistics of an Apache Spark DataFrame or a pandas DataFrame, and it is available for Python, Scala and R, not SQL.
    fr: |
      `count(*)` compte toutes les lignes, alors que `count(referrer)` ignore les null : la différence est donc le nombre de valeurs null. La commande summarize calcule et affiche les statistiques récapitulatives d'un DataFrame Apache Spark ou d'un DataFrame pandas, et elle est disponible en Python, Scala et R, pas en SQL.
references:
  - title: Databricks Utilities (dbutils) reference
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-utils
  - title: count aggregate function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/count
