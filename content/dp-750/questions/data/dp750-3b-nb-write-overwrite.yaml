id: dp750-3b-nb-write-overwrite
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every night, Woodgrove Bank receives a full extract of exchange rates as a CSV file. A notebook reads the file into a DataFrame named `df`.

    The notebook must replace the content of the existing table **woodgrove.ref.fx_rates** with the rows of `df`. The table and its grants must be kept.

    Which line should you add to the notebook?
  fr: |
    Chaque nuit, Woodgrove Bank reçoit un extrait complet des taux de change sous forme de fichier CSV. Un notebook lit le fichier dans un DataFrame nommé `df`.

    Le notebook doit remplacer le contenu de la table existante **woodgrove.ref.fx_rates** par les lignes de `df`. La table et ses autorisations doivent être conservées.

    Quelle ligne devez-vous ajouter au notebook ?
body:
  options:
    - { id: a, text: 'df.write.mode("overwrite").saveAsTable("woodgrove.ref.fx_rates")' }
    - { id: b, text: 'df.write.mode("append").saveAsTable("woodgrove.ref.fx_rates")' }
    - { id: c, text: 'df.write.mode("ignore").saveAsTable("woodgrove.ref.fx_rates")' }
    - { id: d, text: 'df.write.mode("error").saveAsTable("woodgrove.ref.fx_rates")' }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The overwrite mode replaces the content of the existing table in a new table version. The table isn't dropped, so its grants are kept.
    fr: |
      Le mode overwrite remplace le contenu de la table existante dans une nouvelle version de la table. La table n'est pas supprimée : ses autorisations sont donc conservées.
  options:
    b:
      en: |
        The append mode adds the new rows to the old ones, so the table would contain every past extract.
      fr: |
        Le mode append ajoute les nouvelles lignes aux anciennes : la table contiendrait tous les extraits passés.
    c:
      en: |
        The ignore mode does nothing when the table already exists.
      fr: |
        Le mode ignore ne fait rien quand la table existe déjà.
    d:
      en: |
        The error mode, the default, fails when the table already exists.
      fr: |
        Le mode error, par défaut, échoue quand la table existe déjà.
references:
  - title: "Tutorial: Create and manage Delta Lake tables"
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/tutorial
