id: dp750-3a-partition-column
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores IoT telemetry in the Delta table **contoso.iot.events**, which holds 260 TB and grows by about 1.5 TB per day. After benchmarking, the team decided to partition the table.

    The table has the following columns: `event_id` (unique per event), `device_id` (2 million distinct values), `event_ts` (timestamp) and `event_date` (date derived from `event_ts`). Most queries filter on a range of days.

    Which column should you use as the partition column?
  fr: |
    Contoso stocke la télémétrie IoT dans la table Delta **contoso.iot.events**, qui contient 260 To et grossit d'environ 1,5 To par jour. Après des tests de performances, l'équipe a décidé de partitionner la table.

    La table comporte les colonnes suivantes : `event_id` (unique par événement), `device_id` (2 millions de valeurs distinctes), `event_ts` (horodatage) et `event_date` (date dérivée de `event_ts`). La plupart des requêtes filtrent sur une plage de jours.

    Quelle colonne devez-vous utiliser comme colonne de partition ?
body:
  options:
    - { id: a, text: "`event_id`" }
    - { id: b, text: "`device_id`" }
    - { id: c, text: "`event_ts`" }
    - { id: d, text: "`event_date`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Partitioning works only for low or known cardinality columns, such as dates, that match the most common filters. With about 1.5 TB per day, each daily partition holds far more than the recommended minimum of 1 GB, and range filters on days benefit from partition pruning.
    fr: |
      Le partitionnement ne fonctionne que pour des colonnes de cardinalité faible ou connue, comme les dates, qui correspondent aux filtres les plus courants. Avec environ 1,5 To par jour, chaque partition quotidienne dépasse largement le minimum recommandé de 1 Go, et les filtres sur des plages de jours bénéficient de l'élagage de partition.
  options:
    a:
      en: |
        A unique column would create one partition per event, which is extreme over-partitioning.
      fr: |
        Une colonne unique créerait une partition par événement, soit un sur-partitionnement extrême.
    b:
      en: |
        Two million device values would create millions of small partitions; high-cardinality columns fit liquid clustering or Z-order instead.
      fr: |
        Deux millions de valeurs d'appareils créeraient des millions de petites partitions ; les colonnes à cardinalité élevée relèvent plutôt du clustering liquide ou de l'ordre Z.
    c:
      en: |
        Timestamps have high cardinality and would create a huge number of tiny partitions.
      fr: |
        Les horodatages ont une cardinalité élevée et créeraient un très grand nombre de minuscules partitions.
references:
  - title: When to partition tables on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/partitions
