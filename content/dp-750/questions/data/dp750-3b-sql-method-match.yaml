id: dp750-3b-sql-method-match
objective: "3.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has three SQL ingestion requirements:

    - **Migration**: create the new table **tailspin.bronze.orders_archive** once from Parquet files, with the schema derived from the data. The statement must fail if the table already exists, so that existing data is never overwritten by mistake.
    - **Rebuild**: every night, rebuild **tailspin.gold.daily_revenue** from a query whose columns may change. Users must keep their grants, and the existing row filter must stay in place.
    - **Incremental**: several times a day, append only the newly arrived files to the existing table **tailspin.bronze.events**. A rerun after a failure must not duplicate rows.

    Which statement should you use for each requirement? To answer, drag the appropriate statements to the correct requirements. Each statement may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys a trois exigences d'ingestion SQL :

    - **Migration** : créer une seule fois la nouvelle table **tailspin.bronze.orders_archive** à partir de fichiers Parquet, avec un schéma dérivé des données. L'instruction doit échouer si la table existe déjà, afin que des données existantes ne soient jamais écrasées par erreur.
    - **Reconstruction** : chaque nuit, reconstruire **tailspin.gold.daily_revenue** à partir d'une requête dont les colonnes peuvent changer. Les utilisateurs doivent conserver leurs autorisations, et le filtre de lignes existant doit rester en place.
    - **Incrémentiel** : plusieurs fois par jour, ajouter uniquement les fichiers nouvellement arrivés à la table existante **tailspin.bronze.events**. Une réexécution après un échec ne doit pas dupliquer de lignes.

    Quelle instruction devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les instructions appropriées vers les exigences correspondantes. Chaque instruction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ctas, text: "CREATE TABLE ... AS SELECT" }
    - { id: cor, text: "CREATE OR REPLACE TABLE ... AS SELECT" }
    - { id: copy, text: COPY INTO }
    - { id: insert, text: "INSERT INTO ... SELECT * FROM read_files(...)" }
    - { id: drop, text: "DROP TABLE, then CREATE TABLE ... AS SELECT" }
  targets:
    - { id: migration, text: { en: Migration, fr: Migration } }
    - { id: rebuild, text: { en: Rebuild, fr: Reconstruction } }
    - { id: incremental, text: { en: Incremental, fr: Incrémentiel } }
answer:
  mapping: { migration: ctas, rebuild: cor, incremental: copy }
explanation:
  correct:
    en: |
      CTAS creates a table whose schema is derived from the query and fails if the table exists. CREATE OR REPLACE TABLE replaces the content and schema while preserving the history, the grants, the row filters and the column masks. COPY INTO appends files to an existing table and skips files already loaded, so a rerun doesn't duplicate rows.
    fr: |
      CTAS crée une table dont le schéma est dérivé de la requête et échoue si la table existe. CREATE OR REPLACE TABLE remplace le contenu et le schéma tout en conservant l'historique, les autorisations, les filtres de lignes et les masques de colonne. COPY INTO ajoute des fichiers à une table existante et ignore les fichiers déjà chargés : une réexécution ne duplique pas de lignes.
  options:
    insert:
      en: |
        In a batch query, read_files reads every file in the path at each run, so INSERT INTO appends the same rows again.
      fr: |
        Dans une requête par lots, read_files lit chaque fichier du chemin à chaque exécution : INSERT INTO ajoute de nouveau les mêmes lignes.
    drop:
      en: |
        Dropping the table loses its grants, row filter and history; Databricks recommends REPLACE instead.
      fr: |
        Supprimer la table fait perdre ses autorisations, son filtre de lignes et son historique ; Databricks recommande REPLACE à la place.
references:
  - title: CREATE TABLE [USING]
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-table-using
  - title: COPY INTO
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-copy-into
