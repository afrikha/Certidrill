id: dp750-3a-format-statements
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is choosing between Delta Lake and Apache Iceberg for new Unity Catalog managed tables in the **fabrikam.analytics** catalog.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam doit choisir entre Delta Lake et Apache Iceberg pour de nouvelles tables managées du catalogue Unity dans le catalogue **fabrikam.analytics**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Iceberg tables in Azure Databricks store their data in Apache Parquet files.
        fr: |
          Les tables Iceberg dans Azure Databricks stockent leurs données dans des fichiers Apache Parquet.
    - id: s2
      text:
        en: |
          Downstream pipelines can read row-level changes of a managed Iceberg table through the change data feed.
        fr: |
          Les pipelines en aval peuvent lire les changements au niveau des lignes d'une table Iceberg managée au moyen du flux de changements de données (change data feed).
    - id: s3
      text:
        en: |
          Liquid clustering is available for managed Iceberg tables.
        fr: |
          Le clustering liquide est disponible pour les tables Iceberg managées.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Iceberg tables support only the Apache Parquet file format, like Delta Lake, which also builds on Parquet. Liquid clustering and predictive optimization are available for both Delta Lake and managed Iceberg tables, but the change data feed is specific to Delta Lake because it relies on the Delta transaction log.
    fr: |
      Les tables Iceberg ne prennent en charge que le format de fichier Apache Parquet, comme Delta Lake, qui repose lui aussi sur Parquet. Le clustering liquide et l'optimisation prédictive sont disponibles pour Delta Lake et pour les tables Iceberg managées, mais le flux de changements de données est propre à Delta Lake, car il repose sur le journal des transactions Delta.
references:
  - title: Choose a data table format
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/4-choose-data-table-format
  - title: What is Apache Iceberg in Azure Databricks?
    url: https://learn.microsoft.com/en-us/azure/databricks/iceberg/
