id: dp750-3a-grain-aggregate-mv
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware stores retail sales in **proseware.gold.fact_sales_line**, with one row per receipt line item. About 90 % of the queries ask for daily sales by store and product, and these queries scan billions of rows. Auditors occasionally drill down to individual receipts, and regulations require the line items to be retained for seven years.

    You need to reduce the cost and duration of the common queries while meeting the audit and retention requirements. The solution must minimize maintenance effort.

    What should you do?
  fr: |
    Proseware stocke ses ventes au détail dans **proseware.gold.fact_sales_line**, avec une ligne par ligne de ticket de caisse. Environ 90 % des requêtes portent sur les ventes quotidiennes par magasin et par produit, et ces requêtes analysent des milliards de lignes. Les auditeurs descendent parfois jusqu'aux tickets individuels, et la réglementation impose de conserver les lignes de ticket pendant sept ans.

    Vous devez réduire le coût et la durée des requêtes courantes tout en respectant les exigences d'audit et de rétention. La solution doit réduire au minimum l'effort de maintenance.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the table with a daily aggregate by store and product.", fr: "Remplacer la table par un agrégat quotidien par magasin et par produit." } }
    - { id: b, text: { en: "Keep the table and create a materialized view that aggregates it by day, store and product.", fr: "Conserver la table et créer une vue matérialisée qui l'agrège par jour, magasin et produit." } }
    - { id: c, text: { en: "Keep the table and create a standard view that aggregates it by day, store and product.", fr: "Conserver la table et créer une vue standard qui l'agrège par jour, magasin et produit." } }
    - { id: d, text: { en: "Replace the table with an hourly aggregate by store and product.", fr: "Remplacer la table par un agrégat horaire par magasin et par produit." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Keeping the atomic line-item grain meets the audit and retention requirements, and an aggregate table optimizes the common pattern. A materialized view caches the aggregated results and refreshes them, often incrementally, so you get the aggregate without writing and scheduling custom load code.
    fr: |
      Conserver la granularité atomique par ligne de ticket répond aux exigences d'audit et de rétention, et une table d'agrégats optimise le modèle courant. Une vue matérialisée met en cache les résultats agrégés et les actualise, souvent de façon incrémentielle : vous obtenez l'agrégat sans écrire ni planifier de code de chargement personnalisé.
  options:
    a:
      en: |
        Replacing the atomic table loses the individual receipts that auditors need and that regulations require you to retain.
      fr: |
        Remplacer la table atomique fait perdre les tickets individuels dont les auditeurs ont besoin et que la réglementation impose de conserver.
    c:
      en: |
        A standard view recomputes the aggregation on every query, so the common queries still scan billions of rows.
      fr: |
        Une vue standard recalcule l'agrégation à chaque requête : les requêtes courantes analysent toujours des milliards de lignes.
    d:
      en: |
        An hourly aggregate still loses the individual receipts, and it is not the grain that most queries use.
      fr: |
        Un agrégat horaire perd lui aussi les tickets individuels, et ce n'est pas la granularité utilisée par la plupart des requêtes.
references:
