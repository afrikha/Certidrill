id: dp750-3b-ss-kafka-read
objective: "3.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys publishes JSON events to the Apache Kafka topics **orders** and **returns**. You are writing a Structured Streaming query in a notebook that reads both topics.

    The first run of the query must process all the data that is still retained in the topics, and the JSON payload of each record must be parsed with the schema `order_schema`.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys publie des événements JSON dans les topics Apache Kafka **orders** et **returns**. Vous écrivez dans un notebook une requête Structured Streaming qui lit les deux topics.

    La première exécution de la requête doit traiter toutes les données encore conservées dans les topics, et la charge utile JSON de chaque enregistrement doit être analysée avec le schéma `order_schema`.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from pyspark.sql.functions import col, from_json

    raw = (spark.readStream
             .format("kafka")
             .option("kafka.bootstrap.servers", "broker1.tailspintoys.com:9092")
             .option([[sub]], "orders,returns")
             .option("startingOffsets", [[start]])
             .load())

    events = (raw.select(from_json([[val]], order_schema).alias("e"))
                 .select("e.*"))
  slots:
    - id: sub
      options:
        - { id: subscribe, text: '"subscribe"' }
        - { id: pattern, text: '"subscribePattern"' }
        - { id: assign, text: '"assign"' }
    - id: start
      options:
        - { id: earliest, text: '"earliest"' }
        - { id: latest, text: '"latest"' }
    - id: val
      options:
        - { id: cast, text: 'col("value").cast("string")' }
        - { id: raw, text: 'col("value")' }
        - { id: key, text: 'col("key").cast("string")' }
answer:
  values: { sub: subscribe, start: earliest, val: cast }
explanation:
  correct:
    en: |
      The subscribe option takes a comma-separated list of topics. startingOffsets set to earliest makes a new query start from the oldest retained offsets. The Kafka source returns key and value as binary, so the value must be cast to a string before from_json parses it.
    fr: |
      L'option subscribe prend une liste de topics séparés par des virgules. startingOffsets défini sur earliest fait démarrer une nouvelle requête aux plus anciens offsets conservés. La source Kafka renvoie key et value au format binaire : value doit donc être converti en chaîne avant que from_json l'analyse.
  options:
    pattern: { en: "subscribePattern takes a Java regular expression, not a list of topic names.", fr: "subscribePattern prend une expression régulière Java, pas une liste de noms de topics." }
    assign: { en: "assign takes a JSON string of specific topic partitions.", fr: "assign prend une chaîne JSON de partitions de topics précises." }
    latest: { en: "latest starts from new records only, so the retained data isn't processed.", fr: "latest ne démarre qu'avec les nouveaux enregistrements : les données conservées ne sont pas traitées." }
    raw: { en: "value is binary; from_json expects a string.", fr: "value est binaire ; from_json attend une chaîne." }
    key: { en: "The JSON payload is in value, not in key.", fr: "La charge utile JSON se trouve dans value, pas dans key." }
references:
  - title: Connect to Apache Kafka
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/streaming/kafka/
