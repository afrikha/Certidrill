id: dp750-cs2b-scd-types
objective: "3.1.6"
type: dragdrop
caseStudy: dp750-cs2b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are writing the AUTO CDC flows that maintain the dimension tables.

    You need to choose how each dimension table stores changes. The solution must meet the dimension table requirements.

    Which storage option should you use for each table? To answer, drag the appropriate options to the correct tables. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez les flux AUTO CDC qui mettent à jour les tables de dimension.

    Vous devez choisir comment chaque table de dimension stocke les modifications. La solution doit respecter les exigences relatives aux tables de dimension.

    Quelle option de stockage devez-vous utiliser pour chaque table ? Pour répondre, faites glisser les options appropriées vers les tables correctes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: scd1, text: "STORED AS SCD TYPE 1" }
    - { id: scd2, text: "STORED AS SCD TYPE 2" }
    - { id: scd2track, text: "STORED AS SCD TYPE 2 TRACK HISTORY ON * EXCEPT (marketing_opt_in, agent_notes)" }
    - { id: scd2except, text: "STORED AS SCD TYPE 2 TRACK HISTORY ON * EXCEPT (coverage_level, premium_tier)" }
  targets:
    - { id: policyholder, text: "dim_policyholder" }
    - { id: broker, text: "dim_broker" }
    - { id: policy, text: "dim_policy" }
answer:
  mapping: { policyholder: scd2, broker: scd1, policy: scd2track }
explanation:
  correct:
    en: SCD type 2 keeps every version of a row, with `__START_AT` and `__END_AT` columns, so dim_policyholder gets the full history for audits. SCD type 1 overwrites the current row, which fits dim_broker. With `TRACK HISTORY ON * EXCEPT (marketing_opt_in, agent_notes)`, only changes to coverage_level and premium_tier create a new version, while changes to the excluded columns overwrite the current version, which is the behavior required for dim_policy.
    fr: "Le type SCD 2 conserve chaque version d'une ligne, avec les colonnes `__START_AT` et `__END_AT` : dim_policyholder obtient ainsi l'historique complet pour les audits. Le type SCD 1 écrase la ligne actuelle, ce qui convient à dim_broker. Avec `TRACK HISTORY ON * EXCEPT (marketing_opt_in, agent_notes)`, seules les modifications de coverage_level et premium_tier créent une nouvelle version, tandis que les modifications des colonnes exclues écrasent la version actuelle : c'est le comportement exigé pour dim_policy."
  options:
    scd2except:
      en: "`* EXCEPT (coverage_level, premium_tier)` tracks history on every column except the two that must create versions, the opposite of the requirement for dim_policy."
      fr: "`* EXCEPT (coverage_level, premium_tier)` suit l'historique de toutes les colonnes sauf les deux qui doivent créer des versions, soit l'inverse de l'exigence pour dim_policy."
references:
  - title: "The AUTO CDC APIs: Simplify change data capture with pipelines"
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/cdc
