id: dp750-3a-partition-statements
objective: "3.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a 180 TB Delta table named **tailspin.ops.bookings** that is partitioned by `booking_date`. The team is reviewing its data layout options.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une table Delta de 180 To nommée **tailspin.ops.bookings**, partitionnée par `booking_date`. L'équipe passe en revue ses options de disposition des données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can run `OPTIMIZE tailspin.ops.bookings ZORDER BY (booking_date)` to co-locate rows by booking date.
        fr: |
          Vous pouvez exécuter `OPTIMIZE tailspin.ops.bookings ZORDER BY (booking_date)` pour regrouper les lignes par date de réservation.
    - id: s2
      text:
        en: |
          When you Z-order this table on `customer_id`, files are combined only within each partition.
        fr: |
          Lorsque vous appliquez l'ordre Z à cette table sur `customer_id`, les fichiers ne sont combinés qu'à l'intérieur de chaque partition.
    - id: s3
      text:
        en: |
          For a separate 500 GB table that is filtered by date, Databricks recommends partitioning by the date column.
        fr: |
          Pour une autre table de 500 Go filtrée par date, Databricks recommande un partitionnement par la colonne de date.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      You cannot Z-order on columns used for partitioning, and because files are not combined across partition boundaries, Z-ordering happens only within a partition. Databricks recommends not partitioning tables under 1 TB; they benefit from ingestion time clustering or liquid clustering instead.
    fr: |
      Il n'est pas possible d'appliquer l'ordre Z à des colonnes de partitionnement, et comme les fichiers ne sont pas combinés au-delà des limites de partition, l'ordre Z ne s'applique qu'à l'intérieur d'une partition. Databricks recommande de ne pas partitionner les tables de moins de 1 To ; elles bénéficient plutôt du clustering par heure d'ingestion ou du clustering liquide.
references:
  - title: When to partition tables on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/partitions
