id: dp750-3d-constraint-syntax
objective: "3.4.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a Delta table named **woodgrove.silver.payments** that several notebooks and SQL warehouse queries write to. Every existing row has a `payment_id` value and an `amount` greater than 0 and at most 50,000.

    You need to ensure that any write fails if it contains a row whose `payment_id` is null or whose `amount` is not greater than 0 and at most 50,000.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'une table Delta nommée **woodgrove.silver.payments** dans laquelle écrivent plusieurs notebooks et requêtes d'entrepôt SQL. Chaque ligne existante a une valeur `payment_id` et un `amount` supérieur à 0 et inférieur ou égal à 50 000.

    Vous devez faire en sorte que toute écriture échoue si elle contient une ligne dont le `payment_id` est null ou dont l'`amount` n'est pas supérieur à 0 et inférieur ou égal à 50 000.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE woodgrove.silver.payments
      [[id]];

    ALTER TABLE woodgrove.silver.payments
      ADD CONSTRAINT valid_amount [[amount]];
  slots:
    - id: id
      options:
        - { id: pk, text: "ADD CONSTRAINT payments_pk PRIMARY KEY (payment_id)" }
        - { id: notnull, text: "ALTER COLUMN payment_id SET NOT NULL" }
        - { id: unique, text: "ADD CONSTRAINT payments_uq UNIQUE (payment_id)" }
    - id: amount
      options:
        - { id: between, text: "CHECK (amount BETWEEN 0 AND 50000)" }
        - { id: expect, text: "EXPECT (amount > 0 AND amount <= 50000)" }
        - { id: check, text: "CHECK (amount > 0 AND amount <= 50000)" }
answer:
  values: { id: notnull, amount: check }
explanation:
  correct:
    en: |
      Delta tables enforce two kinds of constraints: `NOT NULL` and `CHECK`. `ALTER COLUMN ... SET NOT NULL` rejects null values, and a `CHECK` constraint makes every write fail if one row doesn't satisfy the Boolean expression. Both statements first verify that the existing rows comply.
    fr: |
      Les tables Delta appliquent deux types de contraintes : `NOT NULL` et `CHECK`. `ALTER COLUMN ... SET NOT NULL` rejette les valeurs null, et une contrainte `CHECK` fait échouer toute écriture dont une ligne ne satisfait pas l'expression booléenne. Les deux instructions vérifient d'abord que les lignes existantes sont conformes.
  options:
    pk:
      en: |
        Primary key constraints are informational: Azure Databricks doesn't enforce them on writes.
      fr: |
        Les contraintes de clé primaire sont informatives : Azure Databricks ne les applique pas lors des écritures.
    unique:
      en: |
        Unique constraints are informational and don't reject null values.
      fr: |
        Les contraintes d'unicité sont informatives et ne rejettent pas les valeurs null.
    between:
      en: |
        `BETWEEN 0 AND 50000` includes 0, so an amount of 0 would be accepted.
      fr: |
        `BETWEEN 0 AND 50000` inclut 0 : un montant de 0 serait accepté.
    expect:
      en: |
        `EXPECT` defines an expectation in Lakeflow Spark Declarative Pipelines; it isn't a table constraint for writes from notebooks and warehouses.
      fr: |
        `EXPECT` définit une attente dans Lakeflow Spark Declarative Pipelines ; ce n'est pas une contrainte de table pour les écritures des notebooks et des entrepôts.
references:
  - title: Constraints on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/constraints
