id: dp750-3d-type-functions
objective: "3.4.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    The data engineers of Contoso check data types in SQL on a SQL warehouse on which ANSI mode is enabled. The table **contoso.silver.orders** has a `payload` column of type `VARIANT`.

    Which function or command should you use for each task? To answer, drag the appropriate functions or commands to the correct tasks. Each function or command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les ingénieurs données de Contoso vérifient les types de données en SQL sur un entrepôt SQL sur lequel le mode ANSI est activé. La table **contoso.silver.orders** possède une colonne `payload` de type `VARIANT`.

    Quelle fonction ou commande devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les fonctions ou commandes appropriées vers les tâches correspondantes. Chaque fonction ou commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: typeof, text: typeof }
    - { id: trycast, text: try_cast }
    - { id: cast, text: cast }
    - { id: describe, text: DESCRIBE TABLE }
    - { id: sov, text: schema_of_variant }
  targets:
    - id: expr
      text: { en: "Return the data type of the expression `quantity * unit_price` in a query", fr: "Renvoyer le type de données de l'expression `quantity * unit_price` dans une requête" }
    - id: columns
      text: { en: "List the columns of contoso.silver.orders with their data types", fr: "Lister les colonnes de contoso.silver.orders avec leurs types de données" }
    - id: convert
      text: { en: "Convert a STRING value to INT and get NULL instead of an error when the value isn't a valid integer", fr: "Convertir une valeur STRING en INT et obtenir NULL au lieu d'une erreur quand la valeur n'est pas un entier valide" }
    - id: variant
      text: { en: "Return the type of the value stored in `payload`, such as `DECIMAL(4,1)`", fr: "Renvoyer le type de la valeur stockée dans `payload`, par exemple `DECIMAL(4,1)`" }
answer:
  mapping: { expr: typeof, columns: describe, convert: trycast, variant: sov }
explanation:
  correct:
    en: |
      `typeof` returns the DDL-formatted type of any expression, and `DESCRIBE TABLE` lists the columns of a table with their types. `try_cast` returns NULL when a value is malformed or overflows. For a `VARIANT` value, `typeof` only returns `variant`, so `schema_of_variant` gives the type of the stored value.
    fr: |
      `typeof` renvoie le type au format DDL de n'importe quelle expression, et `DESCRIBE TABLE` liste les colonnes d'une table avec leurs types. `try_cast` renvoie NULL quand une valeur est mal formée ou dépasse la capacité du type. Pour une valeur `VARIANT`, `typeof` renvoie seulement `variant` : `schema_of_variant` donne le type de la valeur stockée.
  options:
    cast:
      en: |
        With ANSI mode enabled, `cast` raises an error on an invalid integer instead of returning NULL.
      fr: |
        Avec le mode ANSI activé, `cast` lève une erreur sur un entier non valide au lieu de renvoyer NULL.
references:
  - title: typeof function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/typeof
  - title: try_cast function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/try_cast
