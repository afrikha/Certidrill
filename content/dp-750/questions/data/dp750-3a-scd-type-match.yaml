id: dp750-3a-scd-type-match
objective: "3.1.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is designing the customer dimension **adatum.gold.dim_customer**. Each attribute is evaluated individually to choose how its changes are handled.

    Which slowly changing dimension (SCD) type should you use for each attribute? To answer, drag the appropriate SCD types to the correct attributes. Each type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit la dimension client **adatum.gold.dim_customer**. Chaque attribut est évalué individuellement pour choisir la façon dont ses changements sont traités.

    Quel type de dimension à variation lente (SCD) devez-vous utiliser pour chaque attribut ? Pour répondre, faites glisser les types SCD appropriés vers les attributs correspondants. Chaque type peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: t0, text: SCD Type 0 }
    - { id: t1, text: SCD Type 1 }
    - { id: t2, text: SCD Type 2 }
    - { id: t3, text: SCD Type 3 }
  targets:
    - id: regdate
      text: { en: "Original registration date, which must keep the value first recorded for audit purposes", fr: "Date d'inscription d'origine, qui doit conserver la valeur enregistrée initialement à des fins d'audit" }
    - id: email
      text: { en: "Email address, for which only the current value matters", fr: "Adresse e-mail, dont seule la valeur actuelle compte" }
    - id: region
      text: { en: "Assigned sales region, where each past sale must be attributed to the region in effect at the time of the sale", fr: "Région commerciale attribuée, chaque vente passée devant être attribuée à la région en vigueur au moment de la vente" }
    - id: segment
      text: { en: "Loyalty segment, where reports compare only the current segment with the immediately previous one", fr: "Segment de fidélité, les rapports comparant uniquement le segment actuel au segment immédiatement précédent" }
answer:
  mapping: { regdate: t0, email: t1, region: t2, segment: t3 }
explanation:
  correct:
    en: |
      Type 0 never changes an attribute after the initial insert, which suits constants and audit requirements. Type 1 overwrites values whose history does not matter. Type 2 inserts a new version row so that facts reference the version in effect at the time. Type 3 adds a previous-value column for before-and-after comparisons.
    fr: |
      Le type 0 ne modifie jamais un attribut après l'insertion initiale, ce qui convient aux constantes et aux exigences d'audit. Le type 1 écrase les valeurs dont l'historique n'a pas d'importance. Le type 2 insère une nouvelle ligne de version afin que les faits référencent la version en vigueur à ce moment-là. Le type 3 ajoute une colonne de valeur précédente pour les comparaisons avant/après.
references:
  - title: Choose a slowly changing dimension (SCD) type
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/6-choose-slowly-changing-dimension-type
