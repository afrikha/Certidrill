id: dp750-3c-null-safe-change
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank compares each day's customer extract **woodgrove.staging.customers** (alias **s**) with **woodgrove.silver.customers** (alias **t**), joined on **customer_id**. The **phone** column is nullable in both tables, and an empty string is a valid value that differs from NULL.

    You need a condition that is true only when the phone number changed, including a change from NULL to a value and from a value to NULL. When both phones are NULL, the condition must be false.

    Which condition should you use?
  fr: |
    Woodgrove Bank compare l'extrait quotidien des clients **woodgrove.staging.customers** (alias **s**) avec **woodgrove.silver.customers** (alias **t**), joints sur **customer_id**. La colonne **phone** accepte les null dans les deux tables, et une chaîne vide est une valeur valide, différente de NULL.

    Vous avez besoin d'une condition qui n'est vraie que lorsque le numéro de téléphone a changé, y compris lors d'un passage de NULL à une valeur et d'une valeur à NULL. Lorsque les deux téléphones sont NULL, la condition doit être fausse.

    Quelle condition devez-vous utiliser ?
body:
  options:
    - { id: a, text: "s.phone <> t.phone" }
    - { id: b, text: "coalesce(s.phone, '') <> coalesce(t.phone, '')" }
    - { id: c, text: "NOT (s.phone <=> t.phone)" }
    - { id: d, text: "s.phone <> t.phone OR s.phone IS NULL OR t.phone IS NULL" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The null-safe equal operator `<=>` returns true when both operands are NULL and false when only one of them is NULL, unlike `=`, which returns NULL in both cases. Its negation is therefore true exactly when the values differ, NULL included, and false when both phones are NULL.
    fr: |
      L'opérateur d'égalité null-safe `<=>` renvoie true lorsque les deux opérandes sont NULL et false lorsqu'un seul d'entre eux l'est, contrairement à `=`, qui renvoie NULL dans les deux cas. Sa négation est donc vraie exactement lorsque les valeurs diffèrent, NULL compris, et fausse lorsque les deux téléphones sont NULL.
  options:
    a:
      en: |
        A comparison with NULL returns NULL, which a condition treats as not satisfied, so changes from or to NULL are missed.
      fr: |
        Une comparaison avec NULL renvoie NULL, qu'une condition considère comme non satisfaite : les passages depuis ou vers NULL sont manqués.
    b:
      en: |
        Replacing NULL with an empty string makes a change between NULL and an empty string invisible, although both are different values here.
      fr: |
        Remplacer NULL par une chaîne vide rend invisible un passage entre NULL et une chaîne vide, alors qu'il s'agit ici de valeurs différentes.
    d:
      en: |
        This condition is also true when both phones are NULL.
      fr: |
        Cette condition est également vraie lorsque les deux téléphones sont NULL.
references:
  - title: NULL semantics
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-null-semantics
