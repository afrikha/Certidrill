id: dp750-3a-cdc-extract-deletes
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso ingests a SQL Server table named **dbo.Contracts** into **contoso.legal.contracts**. The table has 40 million rows and a `modified_at` column that is updated on every insert and update. When a contract is cancelled, the application physically deletes the row.

    The destination table must reflect deleted contracts, and the auditors need the operation type (insert, update or delete) of every change. SQL Server can expose changes from its transaction log.

    Which extraction type should you use?
  fr: |
    Contoso ingère une table SQL Server nommée **dbo.Contracts** dans **contoso.legal.contracts**. La table compte 40 millions de lignes et une colonne `modified_at` mise à jour à chaque insertion et à chaque modification. Lorsqu'un contrat est résilié, l'application supprime physiquement la ligne.

    La table de destination doit refléter les contrats supprimés, et les auditeurs ont besoin du type d'opération (insertion, mise à jour ou suppression) de chaque changement. SQL Server peut exposer les changements à partir de son journal des transactions.

    Quel type d'extraction devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Change data capture (CDC) extraction", fr: "Une extraction par capture des changements de données (CDC)" } }
    - { id: b, text: { en: "Incremental extraction that filters on `modified_at`", fr: "Une extraction incrémentielle qui filtre sur `modified_at`" } }
    - { id: c, text: { en: "Full extraction scheduled every night", fr: "Une extraction complète planifiée chaque nuit" } }
    - { id: d, text: { en: "Periodic snapshot extraction without change metadata", fr: "Une extraction par instantanés périodiques sans métadonnées de changement" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CDC captures individual row-level changes, including deletes, and preserves the operation type of each change. SQL Server exposes these changes from its transaction log, which also lets you build an audit trail.
    fr: |
      La CDC capture chaque changement au niveau des lignes, y compris les suppressions, et conserve le type d'opération de chaque changement. SQL Server expose ces changements à partir de son journal des transactions, ce qui permet aussi de constituer une piste d'audit.
  options:
    b:
      en: |
        A deleted row no longer exists in the source, so a query on `modified_at` never returns it, and the operation type is not recorded.
      fr: |
        Une ligne supprimée n'existe plus dans la source : une requête sur `modified_at` ne la renvoie jamais, et le type d'opération n'est pas enregistré.
    c:
      en: |
        Reloading 40 million rows every night wastes compute, and a full reload does not record the type of each change.
      fr: |
        Recharger 40 millions de lignes chaque nuit gaspille du calcul, et un rechargement complet n'enregistre pas le type de chaque changement.
    d:
      en: |
        Snapshot comparison is the fallback for sources without continuous CDC; it adds processing and still does not give the audit trail of every operation.
      fr: |
        La comparaison d'instantanés est la solution de repli pour les sources sans CDC continue ; elle ajoute du traitement et ne fournit pas la piste d'audit de chaque opération.
references:
  - title: Design ingestion logic and data source configuration
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/2-design-data-ingestion-logic
