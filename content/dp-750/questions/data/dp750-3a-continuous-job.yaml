id: dp750-3a-continuous-job
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a Lakeflow Spark Declarative Pipelines pipeline that reads flight events from Azure Event Hubs into **tailspin.ops.flight_events**. The pipeline's Pipeline mode is Triggered, and a job starts it every hour.

    A new requirement states that new events must be available in the table between 10 and 30 seconds after they arrive. You must follow the Databricks recommendation for running the pipeline.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un pipeline Lakeflow Spark Declarative Pipelines qui lit des événements de vol depuis Azure Event Hubs vers **tailspin.ops.flight_events**. Le mode de pipeline est Triggered, et un job le démarre toutes les heures.

    Une nouvelle exigence impose que les nouveaux événements soient disponibles dans la table entre 10 et 30 secondes après leur arrivée. Vous devez suivre la recommandation de Databricks pour l'exécution du pipeline.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep Pipeline mode set to Triggered and run the pipeline from a continuous job.", fr: "Conserver le mode de pipeline Triggered et exécuter le pipeline à partir d'un job continu." } }
    - { id: b, text: { en: "Set Pipeline mode to Continuous and keep the hourly job schedule.", fr: "Définir le mode de pipeline sur Continuous et conserver la planification horaire du job." } }
    - { id: c, text: { en: "Keep Pipeline mode set to Triggered and set `pipelines.trigger.interval` to 10 seconds.", fr: "Conserver le mode de pipeline Triggered et définir `pipelines.trigger.interval` sur 10 secondes." } }
    - { id: d, text: { en: "Change the job schedule to run the pipeline every minute.", fr: "Modifier la planification du job pour exécuter le pipeline toutes les minutes." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Latency between 10 seconds and a few minutes calls for continuous execution. Databricks recommends wrapping the pipeline in a continuous job, with Pipeline mode left at Triggered (the default), because the job determines the execution mode and takes precedence over the pipeline setting.
    fr: |
      Une latence comprise entre 10 secondes et quelques minutes nécessite une exécution continue. Databricks recommande d'encapsuler le pipeline dans un job continu en laissant le mode de pipeline sur Triggered (la valeur par défaut), car le job détermine le mode d'exécution et prévaut sur le paramètre du pipeline.
  options:
    b:
      en: |
        A scheduled job runs its pipeline as a single update even if Pipeline mode is Continuous, so events still wait up to an hour.
      fr: |
        Un job planifié exécute son pipeline en une seule mise à jour même si le mode de pipeline est Continuous : les événements attendent toujours jusqu'à une heure.
    c:
      en: "`pipelines.trigger.interval` controls how often flows start an update in a continuous pipeline; it does not make a triggered, hourly run continuous."
      fr: "`pipelines.trigger.interval` contrôle la fréquence à laquelle les flux lancent une mise à jour dans un pipeline continu ; il ne rend pas continue une exécution déclenchée toutes les heures."
    d:
      en: |
        Each scheduled run is a separate triggered update, so data can wait up to a minute plus the update time, which exceeds 30 seconds.
      fr: |
        Chaque exécution planifiée est une mise à jour déclenchée distincte : les données peuvent attendre jusqu'à une minute plus la durée de la mise à jour, ce qui dépasse 30 secondes.
references:
  - title: Triggered vs. continuous pipeline mode
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/pipeline-mode
