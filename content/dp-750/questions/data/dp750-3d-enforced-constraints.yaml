id: dp750-3d-enforced-constraints
objective: "3.4.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Delta table named **tailspin.silver.shipments**. The column definitions and constraints of the table are shown in the following table. The table tailspin.silver.carriers exists and has a primary key on `carrier_code`.

    Answer each prompt by selecting the appropriate definition.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une table Delta nommée **tailspin.silver.shipments**. Les définitions de colonnes et les contraintes de la table figurent dans le tableau suivant. La table tailspin.silver.carriers existe et possède une clé primaire sur `carrier_code`.

    Répondez à chaque consigne en sélectionnant la définition appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The definition that makes an insert fail when a row has a weight of 0", fr: "La définition qui fait échouer une insertion quand une ligne a un poids de 0" }
    - id: p2
      text: { en: "The definition that makes an insert fail when a row has no shipment_id value", fr: "La définition qui fait échouer une insertion quand une ligne n'a pas de valeur shipment_id" }
  grid:
    header: [{ en: "Definition", fr: "Définition" }]
    rows:
      - [{ text: "shipment_id BIGINT NOT NULL", area: idnn }]
      - [{ text: "carrier_code STRING", area: carrier }]
      - [{ text: "weight_kg DECIMAL(8,2)", area: weight }]
      - [{ text: "CONSTRAINT shipments_pk PRIMARY KEY (shipment_id)", area: pk }]
      - [{ text: "CONSTRAINT shipments_carrier_fk FOREIGN KEY (carrier_code) REFERENCES tailspin.silver.carriers", area: fk }]
      - [{ text: "CONSTRAINT valid_weight CHECK (weight_kg > 0)", area: ck }]
answer:
  values: { p1: ck, p2: idnn }
explanation:
  correct:
    en: |
      Only `NOT NULL` and `CHECK` constraints are enforced on Delta tables: a write with a row that violates them fails as a whole. The `CHECK (weight_kg > 0)` constraint rejects a weight of 0, and the `NOT NULL` column constraint rejects a missing `shipment_id`.
    fr: |
      Seules les contraintes `NOT NULL` et `CHECK` sont appliquées sur les tables Delta : une écriture contenant une ligne qui les viole échoue entièrement. La contrainte `CHECK (weight_kg > 0)` rejette un poids de 0, et la contrainte de colonne `NOT NULL` rejette un `shipment_id` manquant.
  options:
    pk:
      en: |
        The primary key is informational: it isn't the definition that rejects a null or a duplicate `shipment_id`.
      fr: |
        La clé primaire est informative : ce n'est pas la définition qui rejette un `shipment_id` null ou en double.
    fk:
      en: |
        The foreign key is informational and doesn't check the values against tailspin.silver.carriers.
      fr: |
        La clé étrangère est informative et ne vérifie pas les valeurs par rapport à tailspin.silver.carriers.
    weight:
      en: |
        The data type limits the precision and scale of the value but accepts 0.
      fr: |
        Le type de données limite la précision et l'échelle de la valeur, mais accepte 0.
references:
  - title: Constraints on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/constraints
