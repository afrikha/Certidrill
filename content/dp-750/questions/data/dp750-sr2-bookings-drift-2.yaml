stem:
  en: You switch the write to an overwrite with overwriteSchema.
  fr: Vous remplacez l'écriture par un écrasement avec overwriteSchema.
body:
  solution:
    en: |
      You replace the write to bookings with the following code.

      ```python
      (df.write
        .mode("overwrite")
        .option("overwriteSchema", "true")
        .saveAsTable("tailspin_prod.silver.bookings"))
      ```
    fr: |
      Vous remplacez l'écriture dans bookings par le code suivant.

      ```python
      (df.write
        .mode("overwrite")
        .option("overwriteSchema", "true")
        .saveAsTable("tailspin_prod.silver.bookings"))
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      `overwriteSchema` with the overwrite mode replaces the schema of bookings with the schema of `df`, but it also replaces all the data of the table. Each daily run would delete the existing bookings, which breaks the requirement to keep them.
    fr: |
      `overwriteSchema` avec le mode d'écrasement remplace le schéma de bookings par celui de `df`, mais il remplace aussi toutes les données de la table. Chaque exécution quotidienne supprimerait les réservations existantes, ce qui enfreint l'exigence de les conserver.
references:
  - title: Update table schemas with schema evolution
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/update-schema
