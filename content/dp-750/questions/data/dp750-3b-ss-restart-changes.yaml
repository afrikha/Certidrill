id: dp750-3b-ss-restart-changes
objective: "3.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys runs a Structured Streaming query that reads the Kafka topic **telemetry**, filters the events, counts them per `device_id` in ten-minute windows and writes the result to a Delta table. The query uses a checkpoint location in a Unity Catalog volume and a processing-time trigger.

    You need to modify the query and restart it with the same checkpoint location, without unpredictable failures.

    Which two changes can you make?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys exécute une requête Structured Streaming qui lit le topic Kafka **telemetry**, filtre les événements, les compte par `device_id` dans des fenêtres de dix minutes et écrit le résultat dans une table Delta. La requête utilise un emplacement de point de contrôle dans un volume Unity Catalog et un déclencheur temporel.

    Vous devez modifier la requête et la redémarrer avec le même emplacement de point de contrôle, sans échecs imprévisibles.

    Quelles sont les deux modifications que vous pouvez effectuer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a filter that drops the events whose event_type is heartbeat.", fr: "Ajouter un filtre qui écarte les événements dont l'event_type est heartbeat." } }
    - { id: b, text: { en: "Change the subscribe option of the source to the topic telemetry_v2.", fr: "Remplacer l'option subscribe de la source par le topic telemetry_v2." } }
    - { id: c, text: { en: "Add site_id to the grouping columns of the aggregation.", fr: "Ajouter site_id aux colonnes de regroupement de l'agrégation." } }
    - { id: d, text: { en: "Change the trigger from a processing-time interval to availableNow.", fr: "Remplacer le déclencheur temporel par availableNow." } }
    - { id: e, text: { en: "Replace the Kafka source with an Auto Loader source on a volume path.", fr: "Remplacer la source Kafka par une source Auto Loader sur un chemin de volume." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      With the same checkpoint, adding or removing filters and changing the trigger interval, including switching between time intervals and incremental batches, are generally safe changes.
    fr: |
      Avec le même point de contrôle, ajouter ou supprimer des filtres et modifier l'intervalle du déclencheur, y compris passer d'intervalles de temps à des lots incrémentiels, sont des modifications généralement sûres.
  options:
    b:
      en: |
        Changing the subscribed Kafka topics isn't allowed with the same checkpoint.
      fr: |
        Modifier les topics Kafka auxquels la requête est abonnée n'est pas autorisé avec le même point de contrôle.
    c:
      en: |
        Changing the grouping keys changes the state schema of the aggregation, which isn't allowed.
      fr: |
        Modifier les clés de regroupement change le schéma d'état de l'agrégation, ce qui n'est pas autorisé.
    e:
      en: |
        Changing the type of the input source isn't allowed by default with the same checkpoint.
      fr: |
        Changer le type de la source d'entrée n'est pas autorisé par défaut avec le même point de contrôle.
references:
  - title: Structured Streaming checkpoints
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/checkpoints
