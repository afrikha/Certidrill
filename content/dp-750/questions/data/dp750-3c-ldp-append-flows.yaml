id: dp750-3c-ldp-append-flows
objective: "3.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso receives sales files from its European and American subsidiaries in two separate volumes. You are writing the Python source of a Lakeflow Spark Declarative Pipeline that loads both folders with Auto Loader into the single streaming table **contoso.bronze.sales**.

    Next quarter, a third subsidiary will add its own folder. You must be able to add that source later without a full refresh of **contoso.bronze.sales**.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso reçoit des fichiers de ventes de ses filiales européenne et américaine dans deux volumes distincts. Vous écrivez le code source Python d'un pipeline Lakeflow Spark Declarative Pipelines qui charge les deux dossiers avec Auto Loader dans la seule table de streaming **contoso.bronze.sales**.

    Le trimestre prochain, une troisième filiale ajoutera son propre dossier. Vous devez pouvoir ajouter cette source plus tard sans actualisation complète de **contoso.bronze.sales**.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Declare the target with dp.create_streaming_table(\"contoso.bronze.sales\").", fr: "Déclarer la cible avec dp.create_streaming_table(\"contoso.bronze.sales\")." } }
    - { id: b, text: { en: "Return the union of the two Auto Loader streams from a single function decorated with @dp.table.", fr: "Renvoyer l'union des deux flux Auto Loader depuis une seule fonction décorée avec @dp.table." } }
    - { id: c, text: { en: "Write one function for each folder, decorated with @dp.append_flow(target=\"contoso.bronze.sales\").", fr: "Écrire une fonction par dossier, décorée avec @dp.append_flow(target=\"contoso.bronze.sales\")." } }
    - { id: d, text: { en: "Declare the target with @dp.materialized_view and read both folders with spark.read.", fr: "Déclarer la cible avec @dp.materialized_view et lire les deux dossiers avec spark.read." } }
    - { id: e, text: { en: "Set the table property pipelines.reset.allowed to false on the target.", fr: "Définir la propriété de table pipelines.reset.allowed sur false pour la cible." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Flows defined separately from their target let several sources append to one streaming table, and a new source can be added later without a full refresh. In Python, `dp.create_streaming_table()` creates the target, and each source is a function decorated with `@dp.append_flow(target=...)`. Each flow has its own name, which identifies its streaming checkpoint.
    fr: |
      Des flux définis séparément de leur cible permettent à plusieurs sources d'ajouter des données à une même table de streaming, et une nouvelle source peut être ajoutée plus tard sans actualisation complète. En Python, `dp.create_streaming_table()` crée la cible, et chaque source est une fonction décorée avec `@dp.append_flow(target=...)`. Chaque flux a son propre nom, qui identifie son point de contrôle de streaming.
  options:
    b:
      en: |
        A union in one query is a single flow; adding a third source changes that query, which is what separate append flows avoid.
      fr: |
        Une union dans une seule requête constitue un seul flux ; ajouter une troisième source modifie cette requête, ce que des flux d'ajout distincts permettent d'éviter.
    d:
      en: |
        A materialized view is the result of a batch query, not a streaming table that append flows can target.
      fr: |
        Une vue matérialisée est le résultat d'une requête par lots, pas une table de streaming que des flux d'ajout peuvent cibler.
    e:
      en: |
        This property preserves the data of a table when the pipeline is fully refreshed; it does not let you add a source without a full refresh.
      fr: |
        Cette propriété préserve les données d'une table lorsque le pipeline est entièrement actualisé ; elle ne permet pas d'ajouter une source sans actualisation complète.
references:
  - title: Use flows in Lakeflow pipelines
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/flow-examples
  - title: Load and process data incrementally with Lakeflow pipeline flows
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/flows
