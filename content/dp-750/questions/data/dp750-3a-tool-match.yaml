id: dp750-3a-tool-match
objective: "3.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is planning four ingestion flows into Unity Catalog. Each flow must use the most managed option that meets its requirements.

    Which tool should you use for each flow? To answer, drag the appropriate tools to the correct flows. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum planifie quatre flux d'ingestion vers le catalogue Unity. Chaque flux doit utiliser l'option la plus gérée qui répond à ses exigences.

    Quel outil devez-vous utiliser pour chaque flux ? Pour répondre, faites glisser les outils appropriés vers les flux correspondants. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lfc, text: { en: "Lakeflow Connect managed connector", fr: "Connecteur géré Lakeflow Connect" } }
    - { id: jdbc, text: { en: "Notebook with a JDBC connection", fr: "Notebook avec une connexion JDBC" } }
    - { id: adf, text: Azure Data Factory }
    - { id: autoloader, text: Auto Loader }
    - { id: fed, text: Lakehouse Federation }
  targets:
    - id: servicenow
      text: { en: "Incident and change tables from ServiceNow, loaded incrementally every hour", fr: "Tables d'incidents et de changements de ServiceNow, chargées de façon incrémentielle toutes les heures" }
    - id: custom
      text: { en: "A database that has a JDBC driver but no Lakeflow Connect connector, extracted with custom filtering logic", fr: "Une base de données dotée d'un pilote JDBC mais sans connecteur Lakeflow Connect, extraite avec une logique de filtrage personnalisée" }
    - id: policy
      text: { en: "Data moved from several Azure services into the lakehouse, where company policy mandates a single orchestration service for data movement", fr: "Des données déplacées depuis plusieurs services Azure vers le lakehouse, alors que la stratégie de l'entreprise impose un service d'orchestration unique pour le déplacement des données" }
    - id: files
      text: { en: "Millions of JSON files per day that arrive continuously in Azure Data Lake Storage", fr: "Des millions de fichiers JSON par jour qui arrivent en continu dans Azure Data Lake Storage" }
answer:
  mapping: { servicenow: lfc, custom: jdbc, policy: adf, files: autoloader }
explanation:
  correct:
    en: |
      Managed connectors are the fastest path for supported SaaS applications such as ServiceNow. A notebook with JDBC covers databases without a managed connector and custom extraction logic. Azure Data Factory fits multi-service orchestration and policies that mandate it for data movement. Auto Loader incrementally processes new files in cloud storage at scale.
    fr: |
      Les connecteurs gérés constituent la voie la plus rapide pour les applications SaaS prises en charge comme ServiceNow. Un notebook avec JDBC couvre les bases de données sans connecteur géré et la logique d'extraction personnalisée. Azure Data Factory convient à l'orchestration multiservice et aux stratégies qui l'imposent pour le déplacement des données. Auto Loader traite de façon incrémentielle les nouveaux fichiers du stockage cloud à grande échelle.
  options:
    fed:
      en: |
        Lakehouse Federation provides read-only, live query access to external sources; it does not ingest data into tables.
      fr: |
        Lakehouse Federation fournit un accès en direct et en lecture seule aux sources externes par des requêtes ; il n'ingère pas les données dans des tables.
references:
  - title: Choose a data ingestion tool
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/3-choose-data-ingestion-tool
