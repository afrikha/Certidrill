id: dp750-3c-eh-max-offsets
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso retains seven days of events in an event hub named **orders** in the Standard tier namespace **evhns-contoso**. A new Structured Streaming query reads **orders** through the Kafka endpoint with `startingOffsets` set to `earliest` and writes to **contoso.bronze.orders**.

    During its first run, the query tries to process the entire retained backlog in one micro-batch and the cluster runs out of memory.

    You need to limit the number of events in each micro-batch. Every retained event must still be ingested.

    Which option should you add to the reader?
  fr: |
    Contoso conserve sept jours d'événements dans un hub d'événements nommé **orders** de l'espace de noms de niveau Standard **evhns-contoso**. Une nouvelle requête Structured Streaming lit **orders** par le point de terminaison Kafka avec `startingOffsets` défini sur `earliest` et écrit dans **contoso.bronze.orders**.

    Lors de sa première exécution, la requête tente de traiter tout l'arriéré conservé en un seul micro-lot et le cluster manque de mémoire.

    Vous devez limiter le nombre d'événements de chaque micro-lot. Chaque événement conservé doit tout de même être ingéré.

    Quelle option devez-vous ajouter au lecteur ?
body:
  options:
    - { id: c, text: "maxOffsetsPerTrigger" }
    - { id: a, text: "maxFilesPerTrigger" }
    - { id: b, text: "maxBytesPerTrigger" }
    - { id: d, text: "startingOffsets = \"latest\"" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kafka sources, including the Event Hubs Kafka endpoint, have their own input limit: `maxOffsetsPerTrigger` caps the number of offsets (records) processed per trigger and splits that number across partitions. The backlog is then processed over several micro-batches instead of one.
    fr: |
      Les sources Kafka, y compris le point de terminaison Kafka d'Event Hubs, ont leur propre limite d'entrée : `maxOffsetsPerTrigger` plafonne le nombre d'offsets (enregistrements) traités par déclencheur et répartit ce nombre entre les partitions. L'arriéré est alors traité en plusieurs micro-lots au lieu d'un seul.
  options:
    a:
      en: "`maxFilesPerTrigger` limits the number of files per micro-batch for file-based sources such as Delta Lake and Auto Loader; a Kafka source reads offsets, not files."
      fr: "`maxFilesPerTrigger` limite le nombre de fichiers par micro-lot pour les sources basées sur des fichiers comme Delta Lake et Auto Loader ; une source Kafka lit des offsets, pas des fichiers."
    b:
      en: "`maxBytesPerTrigger` is a soft maximum for file-based sources such as Delta Lake and Auto Loader; Kafka sources use `maxOffsetsPerTrigger`."
      fr: "`maxBytesPerTrigger` est un maximum indicatif pour les sources basées sur des fichiers comme Delta Lake et Auto Loader ; les sources Kafka utilisent `maxOffsetsPerTrigger`."
    d:
      en: |
        Starting from the latest offsets skips the retained events, which breaks the requirement to ingest every retained event.
      fr: |
        Démarrer aux offsets les plus récents ignore les événements conservés, ce qui enfreint l'exigence d'ingérer chaque événement conservé.
references:
  - title: Configure Structured Streaming batch size on Azure Databricks
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/batch-size
  - title: read_kafka table-valued function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/read_kafka
