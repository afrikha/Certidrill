id: dp750-3c-eh-service-credential-steps
objective: "3.2.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Litware runs a Lakeflow job on serverless compute that reads the event hub **shipments** of the Standard tier namespace **evhns-litware** through the Kafka endpoint and writes to **litware.bronze.shipments**. The job runs as the service principal **sp-ingest**, and its notebook sets the reader option `databricks.serviceCredential` to **sc_evh_litware**. No access connector or service credential exists yet.

    You must authenticate without storing any secret. You are a metastore admin. As soon as an access connector exists, the Azure team assigns the **Azure Event Hubs Data Receiver** role on **evhns-litware** to its managed identity.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware exécute un job Lakeflow sur un calcul serverless qui lit le hub d'événements **shipments** de l'espace de noms de niveau Standard **evhns-litware** par le point de terminaison Kafka et écrit dans **litware.bronze.shipments**. Le job s'exécute en tant que principal de service **sp-ingest**, et son notebook définit l'option de lecture `databricks.serviceCredential` sur **sc_evh_litware**. Aucun connecteur d'accès ni aucune information d'identification de service n'existe encore.

    Vous devez vous authentifier sans stocker aucun secret. Vous êtes administrateur du metastore. Dès qu'un connecteur d'accès existe, l'équipe Azure attribue à son identité managée le rôle **Azure Event Hubs Data Receiver** sur **evhns-litware**.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: connector, text: { en: "Create an Access Connector for Azure Databricks resource in Azure.", fr: "Créer une ressource Access Connector for Azure Databricks dans Azure." } }
    - { id: credential, text: { en: "In Catalog Explorer, create the service credential sc_evh_litware with the resource ID of the access connector.", fr: "Dans l'Explorateur de catalogues, créer les informations d'identification de service sc_evh_litware avec l'ID de ressource du connecteur d'accès." } }
    - { id: grant, text: { en: "Grant the ACCESS privilege on the service credential sc_evh_litware to sp-ingest.", fr: "Accorder le privilège ACCESS sur les informations d'identification de service sc_evh_litware à sp-ingest." } }
    - { id: run, text: { en: "Run the job.", fr: "Exécuter le job." } }
    - { id: storagecred, text: { en: "Create a storage credential sc_evh_litware with the resource ID of the access connector.", fr: "Créer des informations d'identification de stockage sc_evh_litware avec l'ID de ressource du connecteur d'accès." } }
    - { id: scope, text: { en: "Create a secret scope and store the namespace connection string in it.", fr: "Créer une étendue de secrets et y stocker la chaîne de connexion de l'espace de noms." } }
    - { id: readfiles, text: { en: "Grant the READ FILES privilege on the service credential sc_evh_litware to sp-ingest.", fr: "Accorder le privilège READ FILES sur les informations d'identification de service sc_evh_litware à sp-ingest." } }
answer:
  sequence: [ connector, credential, grant, run ]
explanation:
  correct:
    en: |
      A Unity Catalog service credential wraps the managed identity of an Azure Databricks access connector, so the connector must exist before you enter its resource ID in the credential. The ACCESS privilege on a service credential lets a principal use it to reach an external cloud service; sp-ingest needs it before the job runs. The Kafka source then gets a Microsoft Entra token for Event Hubs from the credential, and no secret is stored.
    fr: |
      Des informations d'identification de service Unity Catalog encapsulent l'identité managée d'un connecteur d'accès Azure Databricks : le connecteur doit donc exister avant que vous saisissiez son ID de ressource dans les informations d'identification. Le privilège ACCESS sur des informations d'identification de service permet à un principal de les utiliser pour atteindre un service cloud externe ; sp-ingest en a besoin avant l'exécution du job. La source Kafka obtient alors auprès des informations d'identification un jeton Microsoft Entra pour Event Hubs, et aucun secret n'est stocké.
  options:
    storagecred:
      en: |
        Storage credentials govern access to cloud storage; access to a service such as Event Hubs uses a service credential.
      fr: |
        Les informations d'identification de stockage régissent l'accès au stockage cloud ; l'accès à un service comme Event Hubs utilise des informations d'identification de service.
    scope:
      en: |
        A connection string is a secret, which the requirement forbids, and the service credential option does not use it.
      fr: |
        Une chaîne de connexion est un secret, ce que l'exigence interdit, et l'option d'informations d'identification de service ne l'utilise pas.
    readfiles:
      en: |
        READ FILES is a privilege on external locations; the privilege that allows a principal to use a service credential is ACCESS.
      fr: |
        READ FILES est un privilège sur les emplacements externes ; le privilège qui permet à un principal d'utiliser des informations d'identification de service est ACCESS.
references:
  - title: Authentication
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/streaming/kafka/authentication
  - title: Manage service credentials
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-services/manage-service-credentials
