id: dp750-3c-dedup-key-any-row
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys loads booking files into a PySpark DataFrame named **df**. Because partners resend files, the same **booking_id** can appear in several rows, and some of those rows differ in their **ingested_at** column. The rows of a booking contain the same business data, so any one of them can be kept.

    You need to keep exactly one row per **booking_id** before you write to **tailspin.silver.bookings**.

    Which method call should you use?
  fr: |
    Tailspin Toys charge des fichiers de réservations dans un DataFrame PySpark nommé **df**. Comme les partenaires renvoient des fichiers, un même **booking_id** peut apparaître dans plusieurs lignes, et certaines de ces lignes diffèrent par leur colonne **ingested_at**. Les lignes d'une réservation contiennent les mêmes données métier : n'importe laquelle peut donc être conservée.

    Vous devez conserver exactement une ligne par **booking_id** avant d'écrire dans **tailspin.silver.bookings**.

    Quel appel de méthode devez-vous utiliser ?
body:
  options:
    - { id: a, text: "df.distinct()" }
    - { id: b, text: "df.dropDuplicates()" }
    - { id: c, text: "df.dropna(subset=[\"booking_id\"])" }
    - { id: d, text: "df.dropDuplicates([\"booking_id\"])" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `dropDuplicates` with a list of columns considers only those columns when it compares rows, so it keeps one row for each **booking_id** even when **ingested_at** differs. The row kept is arbitrary, which the requirement allows.
    fr: |
      `dropDuplicates` avec une liste de colonnes ne tient compte que de ces colonnes pour comparer les lignes : il conserve donc une ligne par **booking_id**, même lorsque **ingested_at** diffère. La ligne conservée est arbitraire, ce que l'exigence autorise.
  options:
    a:
      en: "`distinct()` removes only rows that are identical in every column, so rows with different ingested_at values remain."
      fr: "`distinct()` ne supprime que les lignes identiques dans toutes les colonnes : les lignes dont ingested_at diffère restent."
    b:
      en: |
        Without a column list, dropDuplicates compares every column, like distinct().
      fr: |
        Sans liste de colonnes, dropDuplicates compare toutes les colonnes, comme distinct().
    c:
      en: "`dropna` removes rows with null values in the listed columns; it does not remove duplicates."
      fr: "`dropna` supprime les lignes qui ont des valeurs null dans les colonnes listées ; il ne supprime pas les doublons."
references:
  - title: dropDuplicates
    url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframe/dropduplicates
