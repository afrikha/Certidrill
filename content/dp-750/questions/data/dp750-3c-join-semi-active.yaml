id: dp750-3c-join-semi-active
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum stores customers in **adatum.silver.customers** and support tickets in **adatum.silver.tickets**. A customer can have many tickets.

    You need a query that returns each customer who opened at least one ticket. The result must contain only the columns of **adatum.silver.customers**, and each customer must appear only once, without using DISTINCT or GROUP BY.

    Which join should you use between **customers** (left) and **tickets** (right)?
  fr: |
    Adatum stocke les clients dans **adatum.silver.customers** et les tickets de support dans **adatum.silver.tickets**. Un client peut avoir de nombreux tickets.

    Vous avez besoin d'une requête qui renvoie chaque client ayant ouvert au moins un ticket. Le résultat ne doit contenir que les colonnes d'**adatum.silver.customers**, et chaque client ne doit apparaître qu'une seule fois, sans utiliser DISTINCT ni GROUP BY.

    Quelle jointure devez-vous utiliser entre **customers** (à gauche) et **tickets** (à droite) ?
body:
  options:
    - { id: a, text: INNER JOIN }
    - { id: b, text: RIGHT OUTER JOIN }
    - { id: c, text: LEFT SEMI JOIN }
    - { id: d, text: LEFT ANTI JOIN }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A left semi join returns the rows of the left side that have a match on the right, with only the left columns. Each customer row is returned once, however many tickets match it.
    fr: |
      Une jointure semi gauche renvoie les lignes du côté gauche qui ont une correspondance à droite, avec uniquement les colonnes de gauche. Chaque ligne client est renvoyée une seule fois, quel que soit le nombre de tickets correspondants.
  options:
    a:
      en: |
        An inner join returns one row per matching pair, so a customer with five tickets appears five times, with the ticket columns.
      fr: |
        Une jointure interne renvoie une ligne par paire correspondante : un client qui a cinq tickets apparaît cinq fois, avec les colonnes des tickets.
    b:
      en: |
        A right outer join keeps every ticket and repeats the customer for each of them.
      fr: |
        Une jointure externe droite conserve tous les tickets et répète le client pour chacun d'eux.
    d:
      en: |
        A left anti join returns the customers who have no ticket.
      fr: |
        Une jointure anti gauche renvoie les clients qui n'ont aucun ticket.
references:
  - title: JOIN
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-join
