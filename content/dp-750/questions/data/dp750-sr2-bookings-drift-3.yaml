stem:
  en: You enable automatic schema merging for the Spark session.
  fr: Vous activez la fusion automatique du schéma pour la session Spark.
body:
  solution:
    en: |
      You add the following line at the start of the notebook and keep the write to bookings unchanged.

      ```python
      spark.conf.set("spark.databricks.delta.schema.autoMerge.enabled", True)
      ```
    fr: |
      Vous ajoutez la ligne suivante au début du notebook et conservez l'écriture dans bookings inchangée.

      ```python
      spark.conf.set("spark.databricks.delta.schema.autoMerge.enabled", True)
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The setting fixes the bookings write, but it enables schema evolution for every write of the Spark session. The appends to the two other tables would also add any new source columns automatically, which their requirements forbid. Databricks recommends a per-write option such as `mergeSchema` instead of this legacy session-wide setting.
    fr: |
      Ce paramètre corrige l'écriture dans bookings, mais il active l'évolution du schéma pour toutes les écritures de la session Spark. Les ajouts dans les deux autres tables ajouteraient eux aussi automatiquement toute nouvelle colonne source, ce que leurs exigences interdisent. Databricks recommande une option par écriture comme `mergeSchema` plutôt que ce paramètre hérité à l'échelle de la session.
references:
  - title: Update table schemas with schema evolution
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/update-schema
