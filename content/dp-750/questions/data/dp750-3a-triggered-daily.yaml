id: dp750-3a-triggered-daily
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Lakeflow Spark Declarative Pipelines pipeline that ingests supplier files with Auto Loader and builds the tables of the **northwind.supply** schema.

    The business reviews the tables once a day at 07:00, so the data must be refreshed once per night. Compute cost must be minimized.

    How should you run the pipeline?
  fr: |
    Northwind Traders dispose d'un pipeline Lakeflow Spark Declarative Pipelines qui ingère des fichiers fournisseurs avec Auto Loader et construit les tables du schéma **northwind.supply**.

    Le métier consulte les tables une fois par jour à 07:00 : les données doivent donc être actualisées une fois par nuit. Le coût de calcul doit être réduit au minimum.

    Comment devez-vous exécuter le pipeline ?
body:
  options:
    - { id: a, text: { en: "Set Pipeline mode to Continuous and keep the pipeline running.", fr: "Définir le mode de pipeline sur Continuous et laisser le pipeline s'exécuter." } }
    - { id: b, text: { en: "Run the pipeline from a continuous job.", fr: "Exécuter le pipeline à partir d'un job continu." } }
    - { id: c, text: { en: "Use the real-time mode trigger on the ingestion flow.", fr: "Utiliser le déclencheur en mode temps réel sur le flux d'ingestion." } }
    - { id: d, text: { en: "Keep Pipeline mode set to Triggered and run the pipeline from a scheduled job.", fr: "Conserver le mode de pipeline Triggered et exécuter le pipeline à partir d'un job planifié." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In triggered mode, the pipeline stops after refreshing all tables with the data available when the update started, so compute runs only as long as the update. A job schedule starts one update per night, which matches a daily freshness requirement.
    fr: |
      En mode déclenché, le pipeline s'arrête après avoir actualisé toutes les tables avec les données disponibles au début de la mise à jour : le calcul ne s'exécute que le temps de la mise à jour. Une planification de job lance une mise à jour par nuit, ce qui répond à une exigence de fraîcheur quotidienne.
  options:
    a:
      en: |
        Continuous mode needs an always-running cluster, which costs more and only reduces latency, which is not required here.
      fr: |
        Le mode continu nécessite un cluster toujours actif, plus coûteux, et ne fait que réduire la latence, ce qui n'est pas requis ici.
    b:
      en: |
        A continuous job keeps the pipeline processing data as it arrives, with always-on compute.
      fr: |
        Un job continu maintient le pipeline en traitement des données dès leur arrivée, avec un calcul toujours actif.
    c:
      en: |
        Real-time mode targets sub-second operational workloads and keeps a long-running query active.
      fr: |
        Le mode temps réel cible les charges de travail opérationnelles inférieures à la seconde et maintient une requête active en permanence.
references:
  - title: Triggered vs. continuous pipeline mode
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/pipeline-mode
