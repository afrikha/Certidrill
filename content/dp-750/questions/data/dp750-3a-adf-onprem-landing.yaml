id: dp750-3a-adf-onprem-landing
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores production orders in an on-premises database whose engine is not supported by Lakeflow Connect or Lakehouse Federation. There is no VPN or Azure ExpressRoute connection between the datacenter and Azure, and the network team will not create one.

    Fabrikam already runs Azure Data Factory with a self-hosted integration runtime installed in the datacenter. You need to bring the orders into **fabrikam.ops.bronze_orders** every night. Transformations must run in Azure Databricks.

    What should you do?
  fr: |
    Fabrikam stocke ses ordres de production dans une base de données locale dont le moteur n'est pris en charge ni par Lakeflow Connect ni par Lakehouse Federation. Il n'existe aucune connexion VPN ou Azure ExpressRoute entre le centre de données et Azure, et l'équipe réseau ne veut pas en créer.

    Fabrikam exécute déjà Azure Data Factory avec un runtime d'intégration auto-hébergé installé dans le centre de données. Vous devez amener les ordres dans **fabrikam.ops.bronze_orders** chaque nuit. Les transformations doivent s'exécuter dans Azure Databricks.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Use an Azure Data Factory copy activity to land the data in Azure Data Lake Storage, then load it with Auto Loader.", fr: "Utiliser une activité de copie Azure Data Factory pour déposer les données dans Azure Data Lake Storage, puis les charger avec Auto Loader." } }
    - { id: b, text: { en: "Use a notebook that reads the database over JDBC and writes to the bronze table.", fr: "Utiliser un notebook qui lit la base de données via JDBC et écrit dans la table bronze." } }
    - { id: c, text: { en: "Use Azure Data Factory mapping data flows to transform the data and write the final tables.", fr: "Utiliser des flux de données de mappage Azure Data Factory pour transformer les données et écrire les tables finales." } }
    - { id: d, text: { en: "Create a foreign catalog on a connection to the database and query it from a job.", fr: "Créer un catalogue étranger sur une connexion à la base de données et l'interroger depuis un job." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without direct network connectivity, Azure Data Factory with a self-hosted integration runtime can extract from the on-premises database and land the data in cloud storage. Azure Databricks then ingests the landed files, for example with Auto Loader, and keeps the transformation logic.
    fr: |
      Sans connectivité réseau directe, Azure Data Factory avec un runtime d'intégration auto-hébergé peut extraire les données de la base locale et les déposer dans un stockage cloud. Azure Databricks ingère ensuite les fichiers déposés, par exemple avec Auto Loader, et conserve la logique de transformation.
  options:
    b:
      en: |
        Direct JDBC access from Azure Databricks to an on-premises database requires VPN or ExpressRoute connectivity, which does not exist.
      fr: |
        L'accès JDBC direct d'Azure Databricks à une base locale nécessite une connectivité VPN ou ExpressRoute, qui n'existe pas.
    c:
      en: |
        The core transformations must stay in Azure Databricks; Azure Data Factory should only move the data into the lakehouse.
      fr: |
        Les transformations principales doivent rester dans Azure Databricks ; Azure Data Factory ne doit servir qu'à déplacer les données vers le lakehouse.
    d:
      en: |
        A foreign catalog relies on Lakehouse Federation, which does not support this engine and also needs network connectivity to the source.
      fr: |
        Un catalogue étranger repose sur Lakehouse Federation, qui ne prend pas en charge ce moteur et nécessite aussi une connectivité réseau vers la source.
references:
  - title: Choose a data ingestion tool
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/3-choose-data-ingestion-tool
