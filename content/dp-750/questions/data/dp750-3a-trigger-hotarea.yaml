id: dp750-3a-trigger-hotarea
objective: "3.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is reviewing the Structured Streaming queries that run in its workspace on a current Databricks Runtime version. The trigger configured for each query is shown in the following table.

    Answer each prompt by selecting the appropriate query.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank passe en revue les requêtes Structured Streaming qui s'exécutent dans son espace de travail sur une version actuelle de Databricks Runtime. Le déclencheur configuré pour chaque requête figure dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la requête appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The query that uses a deprecated trigger", fr: "La requête qui utilise un déclencheur déprécié" }
    - id: p2
      text: { en: "The query designed for sub-second end-to-end latency, such as fraud detection", fr: "La requête conçue pour une latence de bout en bout inférieure à la seconde, par exemple pour la détection de fraude" }
  grid:
    header: [{ en: "Query", fr: "Requête" }, { en: "Source", fr: "Source" }, { en: "Trigger", fr: "Déclencheur" }]
    rows:
      - [{ text: q_cards, area: qcards }, { text: Apache Kafka }, { text: "realTime='5 minutes'" }]
      - [{ text: q_branches, area: qbranches }, { text: Auto Loader }, { text: "processingTime='10 seconds'" }]
      - [{ text: q_rates, area: qrates }, { text: Auto Loader }, { text: "once=True" }]
      - [{ text: q_atm, area: qatm }, { text: Apache Kafka }, { text: { en: "(not specified)", fr: "(non spécifié)" } }]
      - [{ text: q_ledger, area: qledger }, { text: { en: "Delta table", fr: "Table Delta" } }, { text: "availableNow=True" }]
answer:
  values: { p1: qrates, p2: qcards }
explanation:
  correct:
    en: "`Trigger.Once` is deprecated in Databricks Runtime 11.3 LTS and above; `Trigger.AvailableNow` replaces it for incremental batch processing. Real-time mode reaches end-to-end latency under one second and is meant for ultra-low-latency operational workloads; its interval sets the duration of a long-running batch, not the per-record latency."
    fr: "`Trigger.Once` est déprécié dans Databricks Runtime 11.3 LTS et versions ultérieures ; `Trigger.AvailableNow` le remplace pour le traitement incrémentiel par lots. Le mode temps réel atteint une latence de bout en bout inférieure à une seconde et vise les charges de travail opérationnelles à très faible latence ; son intervalle définit la durée d'un lot de longue durée, pas la latence par enregistrement."
  options:
    qatm:
      en: |
        Without a trigger, Structured Streaming uses a 0 ms processing-time interval, which typically gives 3–5 seconds of latency.
      fr: |
        Sans déclencheur, Structured Streaming utilise un intervalle processingTime de 0 ms, ce qui donne généralement une latence de 3 à 5 secondes.
    qbranches:
      en: |
        A processing-time trigger runs fixed-interval micro-batches to balance cost and latency.
      fr: |
        Un déclencheur processingTime exécute des micro-lots à intervalle fixe pour équilibrer coût et latence.
references:
  - title: Configure Structured Streaming trigger intervals
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/triggers
