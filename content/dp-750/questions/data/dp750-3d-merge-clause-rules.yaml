id: dp750-3d-merge-clause-rules
objective: "3.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware loads changes into the Delta table **proseware.silver.subscriptions** by using `MERGE INTO` statements that a SQL warehouse runs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware charge des modifications dans la table Delta **proseware.silver.subscriptions** à l'aide d'instructions `MERGE INTO` exécutées par un entrepôt SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When a statement contains two `WHEN MATCHED` clauses, only the second clause can omit its condition.
        fr: |
          Quand une instruction contient deux clauses `WHEN MATCHED`, seule la seconde clause peut omettre sa condition.
    - id: s2
      text:
        en: |
          When two source rows match the same target row and the matched action is `UPDATE SET *`, the merge updates the target row with the source row that it reads last.
        fr: |
          Quand deux lignes sources correspondent à la même ligne cible et que l'action de correspondance est `UPDATE SET *`, la fusion met à jour la ligne cible avec la ligne source qu'elle lit en dernier.
    - id: s3
      text:
        en: |
          A `WHEN NOT MATCHED BY SOURCE` clause can update columns of the target rows that have no matching row in the source.
        fr: |
          Une clause `WHEN NOT MATCHED BY SOURCE` peut mettre à jour des colonnes des lignes cibles qui n'ont aucune ligne correspondante dans la source.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Clauses of the same kind are evaluated in the order written, and every one except the last must have a condition. When several source rows match one target row for an update, the merge fails with the `DELTA_MULTIPLE_SOURCE_ROW_MATCHING_TARGET_ROW_IN_MERGE` error, so the source must be deduplicated first. `WHEN NOT MATCHED BY SOURCE` accepts `DELETE` or `UPDATE SET column = expr`, for example to flag records that disappeared from a full extract.
    fr: |
      Les clauses d'un même type sont évaluées dans l'ordre d'écriture, et toutes sauf la dernière doivent avoir une condition. Quand plusieurs lignes sources correspondent à une ligne cible pour une mise à jour, la fusion échoue avec l'erreur `DELTA_MULTIPLE_SOURCE_ROW_MATCHING_TARGET_ROW_IN_MERGE` : il faut d'abord dédupliquer la source. `WHEN NOT MATCHED BY SOURCE` accepte `DELETE` ou `UPDATE SET colonne = expr`, par exemple pour marquer les enregistrements qui ont disparu d'un extrait complet.
references:
  - title: MERGE INTO
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-merge-into
