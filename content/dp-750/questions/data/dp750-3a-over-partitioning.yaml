id: dp750-3a-over-partitioning
objective: "3.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum partitioned the Delta table **adatum.web.page_views** by `view_date` and `country`. Users report that queries are slow even though they filter on the partition columns.

    You suspect that the table is over-partitioned.

    Which two observations support this diagnosis?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a partitionné la table Delta **adatum.web.page_views** par `view_date` et `country`. Les utilisateurs signalent des requêtes lentes alors qu'elles filtrent sur les colonnes de partition.

    Vous soupçonnez un sur-partitionnement de la table.

    Quelles sont les deux observations qui étayent ce diagnostic ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Most partition directories contain many files far smaller than the target file size.", fr: "La plupart des répertoires de partition contiennent de nombreux fichiers bien plus petits que la taille de fichier cible." } }
    - { id: b, text: { en: "Queries that filter on `view_date` read only the matching partitions.", fr: "Les requêtes qui filtrent sur `view_date` ne lisent que les partitions correspondantes." } }
    - { id: c, text: { en: "Each partition holds several gigabytes of data.", fr: "Chaque partition contient plusieurs gigaoctets de données." } }
    - { id: d, text: { en: "OPTIMIZE runs on the table take a very long time.", fr: "Les exécutions d'OPTIMIZE sur la table durent très longtemps." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Over-partitioning produces partitions with files smaller than the target file size, which slows queries despite pruning and makes table optimization long. The fix is a coarser partition granularity or, for new designs, liquid clustering.
    fr: |
      Le sur-partitionnement produit des partitions dont les fichiers sont plus petits que la taille cible, ce qui ralentit les requêtes malgré l'élagage et allonge l'optimisation de la table. La solution consiste à adopter une granularité de partition plus grossière ou, pour une nouvelle conception, le clustering liquide.
  options:
    b:
      en: |
        Reading only matching partitions is normal partition pruning, not a symptom.
      fr: |
        Ne lire que les partitions correspondantes est le fonctionnement normal de l'élagage de partition, pas un symptôme.
    c:
      en: |
        Databricks recommends at least 1 GB per partition, so partitions of several gigabytes are healthy.
      fr: |
        Databricks recommande au moins 1 Go par partition : des partitions de plusieurs gigaoctets sont donc saines.
references:
  - title: Design and implement a data partitioning scheme
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/5-design-data-partitioning-scheme
