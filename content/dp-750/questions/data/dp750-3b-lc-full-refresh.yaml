id: dp750-3b-lc-full-refresh
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware uses a Lakeflow Connect ingestion pipeline to ingest 40 SQL Server tables into the schema **litware.bronze**. History tracking is off for all the tables.

    A database administrator renamed a column of the table **dbo.invoices**. Since then, the pipeline fails to ingest dbo.invoices, while the other tables are ingested normally.

    You need to resume the ingestion of dbo.invoices. The solution must minimize the amount of data that is reloaded.

    What should you do?
  fr: |
    Litware utilise un pipeline d'ingestion Lakeflow Connect pour ingérer 40 tables SQL Server dans le schéma **litware.bronze**. Le suivi de l'historique est désactivé pour toutes les tables.

    Un administrateur de base de données a renommé une colonne de la table **dbo.invoices**. Depuis, le pipeline ne parvient plus à ingérer dbo.invoices, tandis que les autres tables sont ingérées normalement.

    Vous devez reprendre l'ingestion de dbo.invoices. La solution doit réduire au minimum la quantité de données rechargées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run a full refresh of all the tables of the pipeline.", fr: "Exécuter une actualisation complète de toutes les tables du pipeline." } }
    - { id: b, text: { en: "Run a full refresh of the dbo.invoices table only.", fr: "Exécuter une actualisation complète de la seule table dbo.invoices." } }
    - { id: c, text: { en: "Restart the ingestion gateway of the pipeline.", fr: "Redémarrer la passerelle d'ingestion du pipeline." } }
    - { id: d, text: { en: "Delete and re-create the Unity Catalog connection to SQL Server.", fr: "Supprimer et recréer la connexion Unity Catalog à SQL Server." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The SQL Server connector doesn't handle column renames incrementally: a renamed column requires a full refresh of the table. Refreshing only dbo.invoices reloads that table from a new snapshot while the other 39 tables continue incrementally.
    fr: |
      Le connecteur SQL Server ne gère pas les renommages de colonnes de façon incrémentielle : une colonne renommée exige une actualisation complète de la table. N'actualiser que dbo.invoices recharge cette table à partir d'un nouvel instantané pendant que les 39 autres tables continuent en mode incrémentiel.
  options:
    a:
      en: |
        A full refresh of the whole pipeline also reloads the 39 tables that aren't affected.
      fr: |
        Une actualisation complète de tout le pipeline recharge aussi les 39 tables non concernées.
    c:
      en: |
        Restarting the gateway doesn't resolve the schema change; the renamed column still requires a full refresh.
      fr: |
        Redémarrer la passerelle ne résout pas la modification de schéma ; la colonne renommée exige toujours une actualisation complète.
    d:
      en: |
        The connection stores the credentials; the other tables are ingested normally, so the connection works.
      fr: |
        La connexion stocke les informations d'identification ; les autres tables sont ingérées normalement, la connexion fonctionne donc.
references:
  - title: Microsoft SQL Server ingestion connector
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/sql-server-overview
