id: dp750-3a-tool-statements
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is standardizing how its data engineers choose ingestion tools for Unity Catalog. Sources include SaaS applications, relational databases and files in Azure Data Lake Storage. The company also uses Azure Data Factory.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys standardise la façon dont ses ingénieurs données choisissent les outils d'ingestion vers le catalogue Unity. Les sources comprennent des applications SaaS, des bases de données relationnelles et des fichiers dans Azure Data Lake Storage. L'entreprise utilise également Azure Data Factory.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Lakeflow Connect SaaS connectors run on serverless compute and write the ingested data to streaming tables.
        fr: |
          Les connecteurs SaaS Lakeflow Connect s'exécutent sur du calcul serverless et écrivent les données ingérées dans des tables de streaming.
    - id: s2
      text:
        en: |
          Databricks recommends implementing the core transformations of lakehouse data in Azure Data Factory data flows.
        fr: |
          Databricks recommande d'implémenter les transformations principales des données du lakehouse dans des flux de données Azure Data Factory.
    - id: s3
      text:
        en: |
          When a source supports both Lakehouse Federation and Lakeflow Connect, Azure Databricks recommends Lakeflow Connect if performance on higher data volumes and lower latency are priorities.
        fr: |
          Lorsqu'une source prend en charge à la fois Lakehouse Federation et Lakeflow Connect, Azure Databricks recommande Lakeflow Connect si les performances sur des volumes de données plus importants et une latence plus faible sont prioritaires.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      SaaS managed connectors run on serverless compute and write to Unity Catalog streaming tables. Azure Data Factory should handle orchestration and data movement into the lakehouse, while transformation logic stays in Azure Databricks rather than in ADF data flows. Lakehouse Federation suits live, read-only access with minimal data movement; for higher volumes and lower latency, Lakeflow Connect is recommended.
    fr: |
      Les connecteurs SaaS gérés s'exécutent sur du calcul serverless et écrivent dans des tables de streaming du catalogue Unity. Azure Data Factory doit prendre en charge l'orchestration et le déplacement des données vers le lakehouse, tandis que la logique de transformation reste dans Azure Databricks plutôt que dans les flux de données ADF. Lakehouse Federation convient à un accès en direct en lecture seule avec un déplacement minimal des données ; pour des volumes plus importants et une latence plus faible, Lakeflow Connect est recommandé.
references:
  - title: Choose a data ingestion tool
    url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/3-choose-data-ingestion-tool
  - title: Connect to external databases and catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/
