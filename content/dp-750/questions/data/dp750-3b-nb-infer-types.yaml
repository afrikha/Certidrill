id: dp750-3b-nb-infer-types
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is developing a notebook that ingests CSV files with Auto Loader into a new table. The stream uses a new schema location and doesn't provide a schema. During testing, every column of the target table has the STRING type.

    The numeric and timestamp columns must get their real types automatically, without listing the columns in the code.

    Which option should you set?
  fr: |
    Tailspin Toys développe un notebook qui ingère des fichiers CSV avec Auto Loader dans une nouvelle table. Le flux utilise un nouvel emplacement de schéma et ne fournit pas de schéma. Lors des tests, chaque colonne de la table cible est de type STRING.

    Les colonnes numériques et d'horodatage doivent obtenir automatiquement leur type réel, sans lister les colonnes dans le code.

    Quelle option devez-vous définir ?
body:
  options:
    - { id: a, text: '.option("cloudFiles.schemaHints", "amount DECIMAL(10,2)")' }
    - { id: b, text: '.option("cloudFiles.inferColumnTypes", "true")' }
    - { id: c, text: '.option("cloudFiles.schemaEvolutionMode", "rescue")' }
    - { id: d, text: '.option("cloudFiles.format", "parquet")' }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For JSON, CSV and XML files, Auto Loader infers every column as a string by default. Setting cloudFiles.inferColumnTypes to true makes it infer the real types from the sample data.
    fr: |
      Pour les fichiers JSON, CSV et XML, Auto Loader infère par défaut chaque colonne comme une chaîne. Définir cloudFiles.inferColumnTypes sur true lui fait inférer les types réels à partir des données échantillonnées.
  options:
    a:
      en: |
        Schema hints force the type of the listed columns only, which requires listing every column.
      fr: |
        Les indications de schéma n'imposent le type que des colonnes listées, ce qui oblige à lister chaque colonne.
    c:
      en: |
        The rescue mode sends unexpected data to _rescued_data; it doesn't change the inferred types.
      fr: |
        Le mode rescue envoie les données inattendues dans _rescued_data ; il ne modifie pas les types inférés.
    d:
      en: |
        The files are CSV files; declaring Parquet would make the read fail.
      fr: |
        Les fichiers sont des fichiers CSV ; déclarer Parquet ferait échouer la lecture.
references:
  - title: Configure schema inference and evolution in Auto Loader
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
