id: dp750-3c-ldp-external-location-steps
objective: "3.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has created a Lakeflow Spark Declarative Pipeline named **pl_claims**. Its source uses Auto Loader to read JSON files from **abfss://claims@stfabrikamraw.dfs.core.windows.net/incoming/** into the streaming table **fabrikam.bronze.claims**. The pipeline runs as the service principal **sp-claims**, which already has the privileges it needs on the **fabrikam.bronze** schema.

    The access connector **ac-fabrikam** has the Storage Blob Data Contributor role on **stfabrikamraw**. No storage credential or external location exists for the storage account. You are a metastore admin.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam a créé un pipeline Lakeflow Spark Declarative Pipelines nommé **pl_claims**. Son code source utilise Auto Loader pour lire des fichiers JSON depuis **abfss://claims@stfabrikamraw.dfs.core.windows.net/incoming/** vers la table de streaming **fabrikam.bronze.claims**. Le pipeline s'exécute en tant que principal de service **sp-claims**, qui dispose déjà des privilèges nécessaires sur le schéma **fabrikam.bronze**.

    Le connecteur d'accès **ac-fabrikam** dispose du rôle Storage Blob Data Contributor sur **stfabrikamraw**. Aucune information d'identification de stockage ni aucun emplacement externe n'existe pour le compte de stockage. Vous êtes administrateur du metastore.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: cred, text: { en: "Create a storage credential that uses the managed identity of ac-fabrikam.", fr: "Créer des informations d'identification de stockage qui utilisent l'identité managée d'ac-fabrikam." } }
    - { id: extloc, text: { en: "Create an external location for the claims container that uses the storage credential.", fr: "Créer un emplacement externe pour le conteneur claims qui utilise les informations d'identification de stockage." } }
    - { id: grant, text: { en: "Grant the READ FILES privilege on the external location to sp-claims.", fr: "Accorder le privilège READ FILES sur l'emplacement externe à sp-claims." } }
    - { id: start, text: { en: "Start an update of pl_claims.", fr: "Démarrer une mise à jour de pl_claims." } }
    - { id: schemaloc, text: { en: "Add the cloudFiles.schemaLocation option to the Auto Loader reader.", fr: "Ajouter l'option cloudFiles.schemaLocation au lecteur Auto Loader." } }
    - { id: secret, text: { en: "Store the storage account key in a secret scope.", fr: "Stocker la clé du compte de stockage dans une étendue de secrets." } }
    - { id: volume, text: { en: "Grant the READ VOLUME privilege on the external location to sp-claims.", fr: "Accorder le privilège READ VOLUME sur l'emplacement externe à sp-claims." } }
answer:
  sequence: [ cred, extloc, grant, start ]
explanation:
  correct:
    en: |
      Auto Loader in a pipeline authenticates to cloud storage through Unity Catalog external locations. An external location combines a storage path with a storage credential, so the credential comes first. The principal that runs the pipeline needs the READ FILES privilege on the external location before an update reads the files.
    fr: |
      Dans un pipeline, Auto Loader s'authentifie auprès du stockage cloud au moyen des emplacements externes Unity Catalog. Un emplacement externe associe un chemin de stockage à des informations d'identification de stockage : celles-ci doivent donc être créées en premier. Le principal qui exécute le pipeline a besoin du privilège READ FILES sur l'emplacement externe avant qu'une mise à jour lise les fichiers.
  options:
    schemaloc:
      en: |
        In a pipeline, Azure Databricks manages the schema location and the checkpoint automatically.
      fr: |
        Dans un pipeline, Azure Databricks gère automatiquement l'emplacement du schéma et le point de contrôle.
    secret:
      en: |
        The storage credential uses the managed identity of the access connector, so no account key is needed.
      fr: |
        Les informations d'identification de stockage utilisent l'identité managée du connecteur d'accès : aucune clé de compte n'est nécessaire.
    volume:
      en: |
        READ VOLUME is a privilege on volumes; the privilege for reading files directly from an external location is READ FILES.
      fr: |
        READ VOLUME est un privilège sur les volumes ; le privilège qui permet de lire des fichiers directement depuis un emplacement externe est READ FILES.
references:
  - title: Load data in pipelines
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/load
  - title: Configure schema inference and evolution in Auto Loader
    url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
