id: dp750-3c-type-bigint-id
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is creating the table **wingtip.silver.clickstream**. The **event_id** column holds whole numbers generated by the web platform. The current highest value is 1,900,000,000, and the platform generates about 300 million new IDs each year.

    You need to choose the data type of **event_id**. The type must store exact whole numbers and use as little storage as possible.

    Which data type should you use?
  fr: |
    Wingtip Toys crée la table **wingtip.silver.clickstream**. La colonne **event_id** contient des nombres entiers générés par la plateforme web. La valeur la plus élevée est actuellement de 1 900 000 000, et la plateforme génère environ 300 millions de nouveaux ID par an.

    Vous devez choisir le type de données d'**event_id**. Le type doit stocker des nombres entiers exacts et utiliser le moins de stockage possible.

    Quel type de données devez-vous utiliser ?
body:
  options:
    - { id: a, text: INT }
    - { id: b, text: DOUBLE }
    - { id: c, text: "DECIMAL(38,0)" }
    - { id: d, text: BIGINT }
answer: { optionId: d }
explanation:
  correct:
    en: |
      INT is a 4-byte signed integer whose maximum is 2,147,483,647, which the IDs will exceed within a year. BIGINT is an 8-byte signed integer, the smallest exact integer type that holds the future values.
    fr: |
      INT est un entier signé sur 4 octets dont le maximum est 2 147 483 647, valeur que les ID dépasseront en moins d'un an. BIGINT est un entier signé sur 8 octets, le plus petit type entier exact capable de contenir les valeurs futures.
  options:
    a:
      en: |
        INT overflows above 2,147,483,647, a value that the IDs will reach in less than a year.
      fr: |
        INT déborde au-delà de 2 147 483 647, valeur que les ID atteindront en moins d'un an.
    b:
      en: |
        DOUBLE is a floating-point type: it cannot guarantee exact values for every large whole number, and it is not meant for identifiers.
      fr: |
        DOUBLE est un type à virgule flottante : il ne peut pas garantir des valeurs exactes pour tous les grands nombres entiers et n'est pas conçu pour des identificateurs.
    c:
      en: |
        DECIMAL(38,0) stores exact whole numbers but needs more storage than BIGINT for values that BIGINT already holds.
      fr: |
        DECIMAL(38,0) stocke des nombres entiers exacts mais exige plus de stockage que BIGINT pour des valeurs que BIGINT contient déjà.
references:
  - title: Data types
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-datatypes
