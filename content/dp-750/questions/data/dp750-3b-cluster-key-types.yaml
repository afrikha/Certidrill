id: dp750-3b-cluster-key-types
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso is creating the unpartitioned Delta table **contoso.iot.readings** with the following columns:

    | Column | Type |
    | --- | --- |
    | reading_id | BIGINT |
    | device | `STRUCT<id: STRING, model: STRING>` |
    | tags | `ARRAY<STRING>` |
    | attributes | `MAP<STRING, STRING>` |
    | reading_ts | TIMESTAMP |

    Statistics are collected on all the columns. Most queries filter on the device ID and on a range of `reading_ts`. You plan to use liquid clustering.

    Which clause should you use?
  fr: |
    Contoso crée la table Delta non partitionnée **contoso.iot.readings** avec les colonnes suivantes :

    | Colonne | Type |
    | --- | --- |
    | reading_id | BIGINT |
    | device | `STRUCT<id: STRING, model: STRING>` |
    | tags | `ARRAY<STRING>` |
    | attributes | `MAP<STRING, STRING>` |
    | reading_ts | TIMESTAMP |

    Les statistiques sont collectées sur toutes les colonnes. La plupart des requêtes filtrent sur l'ID d'appareil et sur une plage de `reading_ts`. Vous prévoyez d'utiliser le clustering liquide.

    Quelle clause devez-vous utiliser ?
body:
  options:
    - { id: a, text: "CLUSTER BY (device, reading_ts)" }
    - { id: b, text: "CLUSTER BY (tags, reading_ts)" }
    - { id: c, text: "CLUSTER BY (device.id, reading_ts)" }
    - { id: d, text: "CLUSTER BY (attributes, reading_ts)" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Clustering keys can be columns of types such as STRING and TIMESTAMP, including a nested field of a struct referenced with dot notation, as long as statistics are collected on them. `device.id` and `reading_ts` match the query filters.
    fr: |
      Les clés de clustering peuvent être des colonnes de types comme STRING et TIMESTAMP, y compris un champ imbriqué d'une structure référencé avec la notation pointée, à condition que des statistiques soient collectées sur elles. `device.id` et `reading_ts` correspondent aux filtres des requêtes.
  options:
    a:
      en: |
        A StructType column can't be a clustering key; only its nested fields can.
      fr: |
        Une colonne StructType ne peut pas être une clé de clustering ; seuls ses champs imbriqués le peuvent.
    b:
      en: |
        ArrayType columns can't be clustering keys, and queries don't filter on tags.
      fr: |
        Les colonnes ArrayType ne peuvent pas être des clés de clustering, et les requêtes ne filtrent pas sur tags.
    d:
      en: |
        MapType columns can't be clustering keys.
      fr: |
        Les colonnes MapType ne peuvent pas être des clés de clustering.
references:
  - title: Use liquid clustering for tables
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/clustering
