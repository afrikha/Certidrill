id: dp750-3b-nb-pattern-match
objective: "3.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso writes three ingestion notebooks that run on classic job compute:

    - **Notebook1** replaces, every night, the content of the small table **contoso.ref.stores** with a full extract.
    - **Notebook2** runs every hour, loads only the files that arrived since its previous run into **contoso.bronze.sales**, then stops.
    - **Notebook3** runs continuously and loads new files into **contoso.bronze.clicks** with a latency of about 30 seconds.

    Which code pattern should you use in each notebook? To answer, drag the appropriate code patterns to the correct notebooks. Each code pattern may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso écrit trois notebooks d'ingestion qui s'exécutent sur un calcul de job classique :

    - **Notebook1** remplace chaque nuit le contenu de la petite table **contoso.ref.stores** par un extrait complet.
    - **Notebook2** s'exécute toutes les heures, charge dans **contoso.bronze.sales** uniquement les fichiers arrivés depuis son exécution précédente, puis s'arrête.
    - **Notebook3** s'exécute en continu et charge les nouveaux fichiers dans **contoso.bronze.clicks** avec une latence d'environ 30 secondes.

    Quel modèle de code devez-vous utiliser dans chaque notebook ? Pour répondre, faites glisser les modèles de code appropriés vers les notebooks correspondants. Chaque modèle de code peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: overwrite, text: 'spark.read ... .write.mode("overwrite").saveAsTable(...)' }
    - { id: append, text: 'spark.read ... .write.mode("append").saveAsTable(...)' }
    - { id: now, text: 'spark.readStream.format("cloudFiles") ... .trigger(availableNow=True).toTable(...)' }
    - { id: proc, text: 'spark.readStream.format("cloudFiles") ... .trigger(processingTime="30 seconds").toTable(...)' }
    - { id: ignore, text: 'spark.read ... .write.mode("ignore").saveAsTable(...)' }
  targets:
    - { id: nb1, text: Notebook1 }
    - { id: nb2, text: Notebook2 }
    - { id: nb3, text: Notebook3 }
answer:
  mapping: { nb1: overwrite, nb2: now, nb3: proc }
explanation:
  correct:
    en: |
      A batch read with the overwrite mode replaces the content of the reference table. Auto Loader tracks processed files in its checkpoint: with availableNow it processes the new files, then stops, which suits an hourly job; with a 30-second processing-time trigger, it runs continuously and starts a micro-batch every 30 seconds.
    fr: |
      Une lecture par lots avec le mode overwrite remplace le contenu de la table de référence. Auto Loader suit les fichiers traités dans son point de contrôle : avec availableNow, il traite les nouveaux fichiers puis s'arrête, ce qui convient à un job horaire ; avec un déclencheur temporel de 30 secondes, il s'exécute en continu et lance un micro-lot toutes les 30 secondes.
  options:
    append:
      en: |
        A batch read with append reads every file in the path at each run, so rows are loaded again and duplicated.
      fr: |
        Une lecture par lots avec append lit chaque fichier du chemin à chaque exécution : les lignes sont chargées de nouveau et dupliquées.
    ignore:
      en: |
        The ignore mode does nothing when the table already exists.
      fr: |
        Le mode ignore ne fait rien quand la table existe déjà.
references:
  - title: Configure Structured Streaming trigger intervals
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/triggers
