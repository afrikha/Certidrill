id: dp750-3b-sql-new-table
objective: "3.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders stores CSV files that have a header row in **/Volumes/northwind/landing/raw/products/**. The table **northwind.bronze.products** doesn't exist yet.

    You need to create northwind.bronze.products and load the data of the files into it by running a single SQL statement.

    Which two statements can you run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders stocke des fichiers CSV avec une ligne d'en-tête dans **/Volumes/northwind/landing/raw/products/**. La table **northwind.bronze.products** n'existe pas encore.

    Vous devez créer northwind.bronze.products et y charger les données des fichiers en exécutant une seule instruction SQL.

    Quelles sont les deux instructions que vous pouvez exécuter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "COPY INTO northwind.bronze.products FROM '/Volumes/northwind/landing/raw/products/' FILEFORMAT = CSV FORMAT_OPTIONS ('header' = 'true')" }
    - { id: b, text: "CREATE TABLE northwind.bronze.products AS SELECT * FROM read_files('/Volumes/northwind/landing/raw/products/', format => 'csv', header => true)" }
    - { id: c, text: "INSERT INTO northwind.bronze.products SELECT * FROM read_files('/Volumes/northwind/landing/raw/products/', format => 'csv', header => true)" }
    - { id: d, text: "CREATE OR REPLACE TABLE northwind.bronze.products AS SELECT * FROM read_files('/Volumes/northwind/landing/raw/products/', format => 'csv', header => true)" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      CTAS creates the table from the result of the query, with the schema derived from the query, and read_files reads the CSV files with their header. CREATE OR REPLACE TABLE ... AS SELECT also creates the table when it doesn't exist.
    fr: |
      CTAS crée la table à partir du résultat de la requête, avec un schéma dérivé de la requête, et read_files lit les fichiers CSV avec leur en-tête. CREATE OR REPLACE TABLE ... AS SELECT crée aussi la table quand elle n'existe pas.
  options:
    a:
      en: |
        COPY INTO loads into an existing Delta table; it fails when the table doesn't exist.
      fr: |
        COPY INTO charge dans une table Delta existante ; il échoue quand la table n'existe pas.
    c:
      en: |
        INSERT INTO requires an existing table.
      fr: |
        INSERT INTO exige une table existante.
references:
  - title: read_files table-valued function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/read_files
  - title: CREATE TABLE [USING]
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-table-using
