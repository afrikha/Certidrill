id: dp750-sr1-emea-orders-3
objective: "2.2.3"
type: series_yesno
series: dp750-sr1-emea-orders
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You create a view filtered on region, grant SELECT on the view to emea-analysts and revoke SELECT on the table.
  fr: Vous créez une vue filtrée sur region, accordez SELECT sur la vue à emea-analysts et révoquez SELECT sur la table.
body:
  solution:
    en: |
      You run the following statements:

      ```sql
      CREATE VIEW tailspin.sales.orders_emea AS
      SELECT * FROM tailspin.sales.orders WHERE region = 'EMEA';

      GRANT SELECT ON VIEW tailspin.sales.orders_emea TO `emea-analysts`;
      REVOKE SELECT ON TABLE tailspin.sales.orders FROM `emea-analysts`;
      ```
    fr: |
      Vous exécutez les instructions suivantes :

      ```sql
      CREATE VIEW tailspin.sales.orders_emea AS
      SELECT * FROM tailspin.sales.orders WHERE region = 'EMEA';

      GRANT SELECT ON VIEW tailspin.sales.orders_emea TO `emea-analysts`;
      REVOKE SELECT ON TABLE tailspin.sales.orders FROM `emea-analysts`;
      ```
answer: { value: false }
explanation:
  correct:
    en: The view does restrict emea-analysts to the EMEA rows, but after the REVOKE its members can no longer query tailspin.sales.orders, and their dashboards and notebooks that reference the table fail. A row filter is the table-level control that restricts rows while users keep querying the table itself.
    fr: "La vue limite bien emea-analysts aux lignes EMEA, mais après le REVOKE ses membres ne peuvent plus interroger tailspin.sales.orders, et leurs tableaux de bord et notebooks qui référencent la table échouent. Un filtre de lignes est le contrôle au niveau de la table qui restreint les lignes tout en laissant les utilisateurs interroger la table elle-même."
references:
  - title: Row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/row-and-column-filters
