id: dp750-2a-browse-discovery
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a Unity Catalog catalog named **litware_prod** that contains several hundred tables across many schemas.

    All the users of the Azure Databricks account must be able to find the tables of litware_prod in Catalog Explorer, view their names, descriptions and tags, and request access. They must not be able to read any data. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Litware dispose d'un catalogue Unity Catalog nommé **litware_prod** qui contient plusieurs centaines de tables réparties dans de nombreux schémas.

    Tous les utilisateurs du compte Azure Databricks doivent pouvoir trouver les tables de litware_prod dans l'Explorateur de catalogues, voir leurs noms, descriptions et balises, et demander l'accès. Ils ne doivent pouvoir lire aucune donnée. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant MANAGE on the catalog litware_prod to the All account users group.", fr: "Accorder MANAGE sur le catalogue litware_prod au groupe All account users." } }
    - { id: b, text: { en: "Grant BROWSE on the catalog litware_prod to the All account users group.", fr: "Accorder BROWSE sur le catalogue litware_prod au groupe All account users." } }
    - { id: c, text: { en: "Grant USE CATALOG on the catalog litware_prod to the All account users group.", fr: "Accorder USE CATALOG sur le catalogue litware_prod au groupe All account users." } }
    - { id: d, text: { en: "Grant SELECT on the catalog litware_prod to the All account users group.", fr: "Accorder SELECT sur le catalogue litware_prod au groupe All account users." } }
answer: { optionId: b }
explanation:
  correct:
    en: BROWSE lets users discover objects, view their metadata (name, description, tags) and request access without USE CATALOG or USE SCHEMA, and it grants no access to data. It is granted once at the catalog level and applies to all the objects of the catalog; Databricks recommends granting it to All account users.
    fr: BROWSE permet de découvrir les objets, de voir leurs métadonnées (nom, description, balises) et de demander l'accès sans USE CATALOG ni USE SCHEMA, et il n'accorde aucun accès aux données. Il s'accorde une seule fois au niveau du catalogue et s'applique à tous ses objets ; Databricks recommande de l'accorder à All account users.
  options:
    c: { en: "USE CATALOG is only a prerequisite to interact with objects in the catalog; BROWSE is the privilege designed for discovering objects and requesting access.", fr: "USE CATALOG n'est qu'un prérequis pour interagir avec les objets du catalogue ; BROWSE est le privilège prévu pour découvrir les objets et demander l'accès." }
    d: { en: "SELECT on the catalog would let users read the data of every table, which the requirements forbid.", fr: "SELECT sur le catalogue permettrait de lire les données de toutes les tables, ce que les exigences interdisent." }
    a: { en: "MANAGE lets users manage privileges and drop objects, and they could grant themselves data access.", fr: "MANAGE permet de gérer les privilèges et de supprimer des objets, et les utilisateurs pourraient s'accorder l'accès aux données." }
references:
  - title: Unity Catalog permissions model concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/access-control/permissions-concepts
