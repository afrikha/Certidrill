id: dp750-2a-comment-on-table
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Unity Catalog managed table named **contoso.sales.orders**. Data consumers search Catalog Explorer for tables by their description, but the table has none.

    You need to add a description to the table without rewriting its data or recreating it.

    Which statement should you run?
  fr: |
    Contoso dispose d'une table managée Unity Catalog nommée **contoso.sales.orders**. Les consommateurs de données recherchent les tables dans l'Explorateur de catalogues d'après leur description, mais cette table n'en a pas.

    Vous devez ajouter une description à la table sans réécrire ses données ni la recréer.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "CREATE OR REPLACE TABLE contoso.sales.orders COMMENT 'Confirmed customer orders, one row per order line' AS SELECT * FROM contoso.sales.orders;" }
    - { id: b, text: "COMMENT ON TABLE contoso.sales.orders IS 'Confirmed customer orders, one row per order line';" }
    - { id: c, text: "ALTER TABLE contoso.sales.orders SET TBLPROPERTIES ('description' = 'Confirmed customer orders, one row per order line');" }
    - { id: d, text: "ALTER TABLE contoso.sales.orders SET TAGS ('description' = 'Confirmed customer orders, one row per order line');" }
answer: { optionId: b }
explanation:
  correct:
    en: COMMENT ON TABLE sets the comment of an existing table, which Catalog Explorer displays as its description; COMMENT ON TABLE ... IS NULL removes it. On a table, the statement requires MODIFY (or ownership through its implied privileges).
    fr: COMMENT ON TABLE définit le commentaire d'une table existante, que l'Explorateur de catalogues affiche comme sa description ; COMMENT ON TABLE ... IS NULL le supprime. Sur une table, l'instruction exige MODIFY (ou la propriété, par ses privilèges implicites).
  options:
    c: { en: "TBLPROPERTIES stores user-defined key-value properties; a property named description is not the table comment.", fr: "TBLPROPERTIES stocke des propriétés clé-valeur définies par l'utilisateur ; une propriété nommée description n'est pas le commentaire de la table." }
    d: { en: "SET TAGS adds tags, which are a separate kind of metadata from the description.", fr: "SET TAGS ajoute des balises, une métadonnée distincte de la description." }
    a: { en: "CREATE OR REPLACE TABLE ... AS SELECT rewrites the data, which the requirements rule out.", fr: "CREATE OR REPLACE TABLE ... AS SELECT réécrit les données, ce que les exigences excluent." }
references:
  - title: COMMENT ON
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-comment
