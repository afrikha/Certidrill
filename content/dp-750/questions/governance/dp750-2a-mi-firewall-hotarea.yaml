id: dp750-2a-mi-firewall-hotarea
objective: "2.1.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a VNet-injected Azure Databricks workspace and an Azure Data Lake Storage account named **stcontosolake**. A Unity Catalog storage credential uses the managed identity of an Access Connector for Azure Databricks named **ac-contoso**. The workspace subnets already reach the storage account through service endpoints.

    The Networking settings of stcontosolake are shown in the following table. You need to ensure that ac-contoso is explicitly allowed through the storage firewall, and that access connectors not listed on the account cannot access it.

    Answer each prompt by selecting the setting you must change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail Azure Databricks à injection de réseau virtuel et d'un compte Azure Data Lake Storage nommé **stcontosolake**. Des informations d'identification de stockage Unity Catalog utilisent l'identité managée d'un connecteur d'accès pour Azure Databricks nommé **ac-contoso**. Les sous-réseaux de l'espace de travail atteignent déjà le compte de stockage par des points de terminaison de service.

    Les paramètres Mise en réseau de stcontosolake figurent dans le tableau suivant. Vous devez faire en sorte qu'ac-contoso soit explicitement autorisé à traverser le pare-feu de stockage, et que les connecteurs d'accès non listés sur le compte ne puissent pas y accéder.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Add ac-contoso so that its managed identity passes the storage firewall", fr: "Ajouter ac-contoso pour que son identité managée traverse le pare-feu de stockage" }
    - id: p2
      text: { en: "Prevent any other access connector in the tenant from accessing the account", fr: "Empêcher tout autre connecteur d'accès du locataire d'accéder au compte" }
  grid:
    caption: { en: "stcontosolake > Networking", fr: "stcontosolake > Mise en réseau" }
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Current value", fr: "Valeur actuelle" }]
    rows:
      - [{ text: { en: "Public network access", fr: "Accès réseau public" }, area: pna }, { text: { en: "Enabled from selected virtual networks and IP addresses", fr: "Activé à partir des réseaux virtuels et adresses IP sélectionnés" } }]
      - [{ text: { en: "Virtual networks", fr: "Réseaux virtuels" }, area: vnet }, { text: { en: "Workspace host and container subnets", fr: "Sous-réseaux hôte et conteneur de l'espace de travail" } }]
      - [{ text: { en: "Firewall address range", fr: "Plage d'adresses du pare-feu" }, area: ip }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: "Resource instances", area: ri }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: { en: "Exceptions: Allow Azure services on the trusted services list to access this storage account", fr: "Exceptions : Autoriser les services Azure figurant sur la liste des services approuvés à accéder à ce compte de stockage" }, area: trusted }, { text: { en: "Selected", fr: "Sélectionné" } }]
answer:
  values: { p1: ri, p2: trusted }
explanation:
  correct:
    en: To allow a specific access connector through the storage firewall, you add the resource type Microsoft.Databricks/accessConnectors and select the connector under Resource instances. While the trusted services exception is selected, any access connector in the same tenant (and any trusted Azure service) can access the account, so you clear it.
    fr: Pour autoriser un connecteur d'accès précis à traverser le pare-feu de stockage, vous ajoutez le type de ressource Microsoft.Databricks/accessConnectors et sélectionnez le connecteur sous Resource instances. Tant que l'exception des services approuvés est sélectionnée, tout connecteur d'accès du même locataire (et tout service Azure approuvé) peut accéder au compte ; vous la désélectionnez donc.
  options:
    pna: { en: "Public network access is already restricted to selected networks; the managed identity can even pass when it is disabled.", fr: "L'accès réseau public est déjà restreint aux réseaux sélectionnés ; l'identité managée peut même passer lorsqu'il est désactivé." }
    vnet: { en: "The virtual network rules already admit the workspace subnets; they do not identify an access connector.", fr: "Les règles de réseau virtuel admettent déjà les sous-réseaux de l'espace de travail ; elles n'identifient pas un connecteur d'accès." }
    ip: { en: "IP ranges do not identify a managed identity.", fr: "Les plages d'adresses IP n'identifient pas une identité managée." }
references:
  - title: Use Azure managed identities in Unity Catalog to access storage
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/azure-managed-identities
