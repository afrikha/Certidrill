id: dp750-2a-secret-get-notebook
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores the password of an Azure SQL Database login as a secret named **sql-password** in an Azure key vault named **kv-contoso-data**. An Azure Key Vault-backed secret scope named **kv-data** references this vault, and you have the READ permission on the scope.

    A Python notebook must retrieve the password as a string to build a JDBC connection, without displaying the value.

    Which code should you use?
  fr: |
    Contoso stocke le mot de passe d'une connexion Azure SQL Database sous forme de secret nommé **sql-password** dans un coffre de clés Azure nommé **kv-contoso-data**. Une étendue de secrets reposant sur Azure Key Vault nommée **kv-data** référence ce coffre, et vous disposez de l'autorisation READ sur l'étendue.

    Un notebook Python doit récupérer le mot de passe sous forme de chaîne pour créer une connexion JDBC, sans afficher la valeur.

    Quel code devez-vous utiliser ?
body:
  options:
    - { id: a, text: "dbutils.secrets.list(\"kv-data\")" }
    - { id: b, text: "dbutils.widgets.get(\"sql-password\")" }
    - { id: c, text: "dbutils.secrets.get(scope=\"kv-data\", key=\"sql-password\")" }
    - { id: d, text: "dbutils.secrets.get(scope=\"kv-contoso-data\", key=\"sql-password\")" }
answer: { optionId: c }
explanation:
  correct:
    en: dbutils.secrets.get(scope, key) returns the string value of a secret from a secret scope; the scope is the Azure Databricks scope name, and the key is the secret name in the vault. Values read this way are shown as [REDACTED] in notebook output.
    fr: dbutils.secrets.get(scope, key) renvoie la valeur chaîne d'un secret d'une étendue de secrets ; l'étendue est le nom de l'étendue Azure Databricks, et la clé est le nom du secret dans le coffre. Les valeurs lues ainsi apparaissent sous la forme [REDACTED] dans la sortie du notebook.
  options:
    d: { en: "The scope argument is the name of the secret scope, kv-data, not the name of the key vault.", fr: "L'argument scope est le nom de l'étendue de secrets, kv-data, et non le nom du coffre de clés." }
    a: { en: "list returns the metadata (key names) of the secrets in the scope, not a value.", fr: "list renvoie les métadonnées (noms de clés) des secrets de l'étendue, pas une valeur." }
    b: { en: "Widgets hold notebook parameters entered by users; they do not read secrets.", fr: "Les widgets contiennent des paramètres de notebook saisis par les utilisateurs ; ils ne lisent pas de secrets." }
references:
  - title: Databricks Utilities (dbutils) reference
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-utils
