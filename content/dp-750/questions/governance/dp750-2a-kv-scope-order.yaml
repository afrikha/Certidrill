id: dp750-2a-kv-scope-order
objective: "2.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure key vault named **kv-litware** that uses the Azure role-based access control permission model and contains the secrets used by ETL notebooks. You have the Owner role on the key vault and are a workspace admin of an Azure Databricks workspace on the Premium plan.

    Members of the group **etl-devs** must read the secrets of kv-litware from their notebooks through a secret scope named **kv-litware**. They must not be able to change the scope or its permissions.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'un coffre de clés Azure nommé **kv-litware** qui utilise le modèle d'autorisation de contrôle d'accès en fonction du rôle Azure et contient les secrets utilisés par les notebooks ETL. Vous disposez du rôle Owner sur le coffre de clés et êtes administrateur d'un espace de travail Azure Databricks avec le plan Premium.

    Les membres du groupe **etl-devs** doivent lire les secrets de kv-litware depuis leurs notebooks par l'intermédiaire d'une étendue de secrets nommée **kv-litware**. Ils ne doivent pas pouvoir modifier l'étendue ni ses autorisations.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rbac, text: { en: "Assign the Key Vault Secrets User role on the key vault to etl-devs.", fr: "Attribuer le rôle Key Vault Secrets User sur le coffre de clés à etl-devs." } }
    - { id: put, text: { en: "Run databricks secrets put-secret to copy each secret into the scope.", fr: "Exécuter databricks secrets put-secret pour copier chaque secret dans l'étendue." } }
    - { id: manage, text: { en: "Run databricks secrets put-acl kv-litware etl-devs MANAGE.", fr: "Exécuter databricks secrets put-acl kv-litware etl-devs MANAGE." } }
    - { id: model, text: { en: "Set the permission model of the key vault to Vault access policy.", fr: "Définir le modèle d'autorisation du coffre de clés sur Stratégie d'accès au coffre (Vault access policy)." } }
    - { id: create, text: { en: "Open https://<databricks-instance>#secrets/createScope and create the scope with the vault's DNS name and resource ID.", fr: "Ouvrir https://<databricks-instance>#secrets/createScope et créer l'étendue avec le nom DNS et l'ID de ressource du coffre." } }
    - { id: acl, text: { en: "Run databricks secrets put-acl kv-litware etl-devs READ.", fr: "Exécuter databricks secrets put-acl kv-litware etl-devs READ." } }
answer:
  sequence: [ model, create, acl ]
explanation:
  correct:
    en: Key Vault-backed scopes support only the Vault access policy permission model, so you switch the vault first. You then create the scope from the case-sensitive #secrets/createScope page with the DNS name and resource ID of the vault. Finally, a READ ACL lets etl-devs read and list the secrets without writing to the scope or managing its permissions.
    fr: Les étendues reposant sur Azure Key Vault ne prennent en charge que le modèle Stratégie d'accès au coffre ; vous basculez donc d'abord le coffre. Vous créez ensuite l'étendue depuis la page #secrets/createScope (sensible à la casse) avec le nom DNS et l'ID de ressource du coffre. Enfin, une ACL READ permet à etl-devs de lire et de lister les secrets sans écrire dans l'étendue ni gérer ses autorisations.
  options:
    rbac: { en: "Users read the secrets through the scope, whose access is controlled by secret ACLs, and the scope does not support Azure RBAC.", fr: "Les utilisateurs lisent les secrets par l'intermédiaire de l'étendue, dont l'accès est contrôlé par les ACL de secret, et l'étendue ne prend pas en charge Azure RBAC." }
    put: { en: "A Key Vault-backed scope is a read-only interface; secrets are managed in Azure Key Vault.", fr: "Une étendue reposant sur Azure Key Vault est une interface en lecture seule ; les secrets se gèrent dans Azure Key Vault." }
    manage: { en: "MANAGE would let etl-devs change the scope's permissions.", fr: "MANAGE permettrait à etl-devs de modifier les autorisations de l'étendue." }
references:
  - title: Workspace secret scopes
    url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets/workspace-secret-scopes
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
