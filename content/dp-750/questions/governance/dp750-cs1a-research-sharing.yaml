id: dp750-cs1a-research-sharing
objective: "2.2.7"
type: single
caseStudy: dp750-cs1a-lamna-healthcare
difficulty: 3
status: draft
stem:
  en: |
    You add clinical.research.deid_admissions to a share named **research_share**.

    You need to give the university research center access to research_share. The solution must meet the research sharing requirements.

    What should you create?
  fr: |
    Vous ajoutez clinical.research.deid_admissions à un partage nommé **research_share**.

    Vous devez donner au centre de recherche universitaire l'accès à research_share. La solution doit respecter les exigences de partage avec la recherche.

    Que devez-vous créer ?
body:
  options:
    - { id: d2d, text: { en: "A Databricks-to-Databricks recipient that uses the research center's sharing identifier", fr: "Un destinataire Databricks-to-Databricks qui utilise l'identifiant de partage du centre de recherche" } }
    - { id: bearer, text: { en: "An open sharing recipient that uses a bearer token sent through an activation link", fr: "Un destinataire de partage ouvert qui utilise un jeton du porteur envoyé par un lien d'activation" } }
    - { id: oidc, text: { en: "An open sharing recipient that uses OIDC federation with the research center's identity provider", fr: "Un destinataire de partage ouvert qui utilise la fédération OIDC avec le fournisseur d'identité du centre de recherche" } }
    - { id: sp, text: { en: "A service principal with SELECT on the table and an OAuth secret given to the research center", fr: "Un principal de service avec SELECT sur la table et un secret OAuth remis au centre de recherche" } }
answer: { optionId: oidc }
explanation:
  correct:
    en: |
      The research center doesn't use Azure Databricks, so it needs open sharing (Databricks-to-Open), which lets tools such as pandas read shared tables. With OIDC federation, Databricks issues short-lived OAuth tokens in exchange for the JWTs of the recipient's own identity provider, so no long-lived secret is sent to the center.
    fr: |
      Le centre de recherche n'utilise pas Azure Databricks ; il lui faut donc le partage ouvert (Databricks-to-Open), qui permet à des outils comme pandas de lire les tables partagées. Avec la fédération OIDC, Databricks délivre des jetons OAuth de courte durée en échange des JWT du fournisseur d'identité du destinataire : aucun secret de longue durée n'est envoyé au centre.
  options:
    d2d: { en: "Databricks-to-Databricks sharing requires the recipient to have a Unity Catalog-enabled Databricks workspace.", fr: "Le partage Databricks-to-Databricks exige que le destinataire dispose d'un espace de travail Databricks activé pour Unity Catalog." }
    bearer: { en: "A bearer token works with pandas, but it is a long-lived credential, which the security policy forbids.", fr: "Un jeton du porteur fonctionne avec pandas, mais c'est une information d'identification de longue durée, ce que la stratégie de sécurité interdit." }
    sp: { en: "This gives an external organization a workspace identity and a long-lived secret instead of using a share and a recipient.", fr: "Cela donne à une organisation externe une identité de l'espace de travail et un secret de longue durée au lieu d'utiliser un partage et un destinataire." }
references:
  - title: What is OpenSharing?
    url: https://learn.microsoft.com/en-us/azure/databricks/delta-sharing/
