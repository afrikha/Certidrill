status: draft
stem:
  en: You set the log retention property to 60 days.
  fr: Vous définissez la propriété de rétention du journal sur 60 jours.
body:
  solution:
    en: |
      You run the following statement and leave the other table properties unchanged.

      ```sql
      ALTER TABLE fab_prod.finance.ledger SET TBLPROPERTIES (
        'delta.logRetentionDuration' = 'interval 60 days'
      );
      ```
    fr: |
      Vous exécutez l'instruction suivante et laissez les autres propriétés de la table inchangées.

      ```sql
      ALTER TABLE fab_prod.finance.ledger SET TBLPROPERTIES (
        'delta.logRetentionDuration' = 'interval 60 days'
      );
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The log retention only keeps the table history. `delta.deletedFileRetentionDuration` stays at its default of 7 days, so the `VACUUM` runs of predictive optimization delete the data files of older versions, and on Databricks Runtime 18.0 time travel queries older than this threshold are blocked. The auditors could only query about the last 7 days.
    fr: |
      La rétention du journal conserve uniquement l'historique de la table. `delta.deletedFileRetentionDuration` reste à sa valeur par défaut de 7 jours : les exécutions de `VACUUM` par l'optimisation prédictive suppriment les fichiers de données des versions plus anciennes et, sur Databricks Runtime 18.0, les requêtes de voyage dans le temps au-delà de ce seuil sont bloquées. Les auditeurs ne pourraient interroger qu'environ les 7 derniers jours.
references:
  - title: Work with table history
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/history
