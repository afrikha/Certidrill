id: dp750-2b-lin-jobs-sql
objective: "2.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to change the schema of the table **sales.gold.daily_revenue**. Before the change, you must list the IDs of the Lakeflow jobs that write to the table, together with the identity that ran each write.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de modifier le schéma de la table **sales.gold.daily_revenue**. Avant cette modification, vous devez lister les ID des jobs Lakeflow qui écrivent dans la table, avec l'identité qui a effectué chaque écriture.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT DISTINCT entity_metadata.job_info.job_id AS job_id, created_by
    FROM [[tbl]]
    WHERE entity_type = [[et]]
      AND [[col]] = 'sales.gold.daily_revenue';
  slots:
    - id: tbl
      options:
        - { id: audit, text: system.access.audit }
        - { id: lineage, text: system.access.table_lineage }
        - { id: query, text: system.query.history }
        - { id: infotables, text: system.information_schema.tables }
    - id: et
      options:
        - { id: notebook, text: "'NOTEBOOK'" }
        - { id: pipeline, text: "'PIPELINE'" }
        - { id: job, text: "'JOB'" }
        - { id: dbsql, text: "'DBSQL_QUERY'" }
    - id: col
      options:
        - { id: target, text: target_table_full_name }
        - { id: source, text: source_table_full_name }
        - { id: entity, text: entity_id }
        - { id: path, text: target_path }
answer:
  values: { tbl: lineage, et: job, col: target }
explanation:
  correct:
    en: |
      system.access.table_lineage records one row per read or write event, with the entity responsible for it. Filtering on entity_type = 'JOB' keeps the events produced by jobs, and target_table_full_name identifies the table that was written; created_by gives the identity that performed the write.
    fr: |
      system.access.table_lineage enregistre une ligne par événement de lecture ou d'écriture, avec l'entité qui en est responsable. Le filtre entity_type = 'JOB' conserve les événements produits par des jobs, et target_table_full_name identifie la table écrite ; created_by indique l'identité qui a effectué l'écriture.
  options:
    audit: { en: "The audit table has no entity_type or target_table_full_name columns.", fr: "La table d'audit n'a pas de colonnes entity_type ni target_table_full_name." }
    source: { en: "source_table_full_name would return the jobs that read the table, not those that write to it.", fr: "source_table_full_name renverrait les jobs qui lisent la table, et non ceux qui y écrivent." }
    path: { en: "target_path is set only for path-based access; a Unity Catalog table write records the table name.", fr: "target_path n'est renseigné que pour un accès par chemin ; l'écriture dans une table Unity Catalog enregistre le nom de la table." }
    pipeline: { en: "PIPELINE identifies Lakeflow Spark Declarative Pipelines updates, not jobs.", fr: "PIPELINE identifie les mises à jour de Lakeflow Spark Declarative Pipelines, pas les jobs." }
references:
  - title: Lineage system tables reference
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/lineage
