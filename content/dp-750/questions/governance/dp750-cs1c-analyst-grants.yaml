id: dp750-cs1c-analyst-grants
objective: "2.1.1"
type: yesno_statements
caseStudy: dp750-cs1c-best-for-you-organics
difficulty: 1
status: draft
stem:
  en: |
    You review the grants of store-analysts in bfyo_prod. No other privilege is granted to store-analysts or to its members.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les autorisations de store-analysts dans bfyo_prod. Aucun autre privilège n'est accordé à store-analysts ni à ses membres.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The members of store-analysts can query the table bfyo_prod.gold.daily_sales.
        fr: Les membres de store-analysts peuvent interroger la table bfyo_prod.gold.daily_sales.
    - id: s2
      text:
        en: If you grant USE SCHEMA on bfyo_prod.gold to store-analysts, its members can query a table that is created in bfyo_prod.gold after the grant.
        fr: Si vous accordez USE SCHEMA sur bfyo_prod.gold à store-analysts, ses membres peuvent interroger une table créée dans bfyo_prod.gold après cette autorisation.
    - id: s3
      text:
        en: The members of store-analysts can view the names and descriptions of the tables in bfyo_prod.silver.
        fr: Les membres de store-analysts peuvent voir les noms et les descriptions des tables de bfyo_prod.silver.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      To query a table, a user needs USE CATALOG on its catalog, USE SCHEMA on its schema and SELECT on the table or a parent; store-analysts lacks USE SCHEMA on gold, so the query fails. Privileges granted on a schema apply to its current and future objects, so once USE SCHEMA is granted, SELECT on the schema covers tables created later. BROWSE on the catalog lets users see the metadata of all its objects, without USE SCHEMA and without access to the data.
    fr: |
      Pour interroger une table, un utilisateur a besoin de USE CATALOG sur son catalogue, de USE SCHEMA sur son schéma et de SELECT sur la table ou sur un parent ; store-analysts n'a pas USE SCHEMA sur gold, donc la requête échoue. Les privilèges accordés sur un schéma s'appliquent à ses objets actuels et futurs : une fois USE SCHEMA accordé, SELECT sur le schéma couvre les tables créées plus tard. BROWSE sur le catalogue permet de voir les métadonnées de tous ses objets, sans USE SCHEMA et sans accès aux données.
references:
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
