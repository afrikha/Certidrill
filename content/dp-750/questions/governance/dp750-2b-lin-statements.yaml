id: dp750-2b-lin-statements
objective: "2.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has two Azure Databricks workspaces, WS1 and WS2, attached to the same Unity Catalog metastore. Data engineers run notebooks and jobs on Unity Catalog-enabled compute in both workspaces. No lineage-specific setting has been configured.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de deux espaces de travail Azure Databricks, WS1 et WS2, attachés au même metastore Unity Catalog. Les ingénieurs données exécutent des notebooks et des jobs sur des calculs compatibles Unity Catalog dans les deux espaces de travail. Aucun paramètre propre à la lignée n'a été configuré.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Column-level lineage is captured for the queries that the notebooks run against Unity Catalog tables.
        fr: |
          La lignée au niveau des colonnes est capturée pour les requêtes que les notebooks exécutent sur des tables Unity Catalog.
    - id: s2
      text:
        en: |
          After a table is renamed, its lineage graph keeps the upstream and downstream connections recorded under the previous name.
        fr: |
          Après le renommage d'une table, son graphe de lignée conserve les connexions en amont et en aval enregistrées sous l'ancien nom.
    - id: s3
      text:
        en: |
          A user in WS2 who has the required privileges on a table can see the lineage that queries run in WS1 produced for that table.
        fr: |
          Un utilisateur de WS2 qui dispose des privilèges nécessaires sur une table peut voir la lignée que les requêtes exécutées dans WS1 ont produite pour cette table.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Unity Catalog captures lineage automatically, down to the column level, for queries run on Unity Catalog compute, and it aggregates lineage across all workspaces attached to the metastore; details of workspace objects such as notebooks in other workspaces are masked. Lineage is not preserved for renamed catalogs, schemas, tables, views or columns.
    fr: |
      Unity Catalog capture automatiquement la lignée, jusqu'au niveau des colonnes, pour les requêtes exécutées sur un calcul Unity Catalog, et agrège la lignée de tous les espaces de travail attachés au metastore ; les détails des objets d'espace de travail, comme les notebooks d'autres espaces de travail, sont masqués. La lignée n'est pas conservée pour les catalogues, schémas, tables, vues ou colonnes renommés.
references:
  - title: Lineage in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/data-lineage
