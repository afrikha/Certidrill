id: dp750-2a-column-comment-code
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Unity Catalog table named **fabrikam.hr.employees**. You run statements from a SQL warehouse and need to:

    - set the descriptions of the existing columns hire_dt and cost_center in a single statement;
    - set the description of the existing column badge_id;
    - remove the current table-level comment, which is out of date.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une table Unity Catalog nommée **fabrikam.hr.employees**. Vous exécutez des instructions depuis un entrepôt SQL et devez :

    - définir les descriptions des colonnes existantes hire_dt et cost_center en une seule instruction ;
    - définir la description de la colonne existante badge_id ;
    - supprimer le commentaire actuel de la table, qui est obsolète.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE fabrikam.hr.employees [[clause]]
      hire_dt COMMENT 'Date the employee joined Fabrikam',
      cost_center COMMENT 'Finance cost center code';

    [[stmt]] COLUMN fabrikam.hr.employees.badge_id IS 'Physical badge identifier';

    COMMENT ON TABLE fabrikam.hr.employees IS [[remove]];
  slots:
    - id: clause
      options:
        - { id: props, text: SET TBLPROPERTIES }
        - { id: alter, text: ALTER COLUMN }
        - { id: add, text: ADD COLUMNS }
    - id: stmt
      options:
        - { id: altertable, text: ALTER TABLE }
        - { id: describe, text: DESCRIBE }
        - { id: comment, text: COMMENT ON }
    - id: remove
      options:
        - { id: strnull, text: "'NULL'" }
        - { id: default, text: DEFAULT }
        - { id: isnull, text: "NULL" }
answer:
  values: { clause: alter, stmt: comment, remove: isnull }
explanation:
  correct:
    en: ALTER TABLE ... ALTER COLUMN <column> COMMENT '<text>' changes the description of an existing column, and Databricks SQL accepts several columns in one statement. COMMENT ON COLUMN <table>.<column> IS '<text>' is an alternative for a single column. COMMENT ON ... IS NULL removes an existing comment.
    fr: ALTER TABLE ... ALTER COLUMN <colonne> COMMENT '<texte>' modifie la description d'une colonne existante, et Databricks SQL accepte plusieurs colonnes dans une seule instruction. COMMENT ON COLUMN <table>.<colonne> IS '<texte>' est une alternative pour une seule colonne. COMMENT ON ... IS NULL supprime un commentaire existant.
  options:
    add: { en: "ADD COLUMNS creates new columns; hire_dt and cost_center already exist.", fr: "ADD COLUMNS crée de nouvelles colonnes ; hire_dt et cost_center existent déjà." }
    props: { en: "SET TBLPROPERTIES sets table properties, not column comments.", fr: "SET TBLPROPERTIES définit des propriétés de table, pas des commentaires de colonne." }
    altertable: { en: "ALTER TABLE has no COLUMN ... IS syntax; the IS form belongs to COMMENT ON.", fr: "ALTER TABLE n'a pas de syntaxe COLUMN ... IS ; la forme IS appartient à COMMENT ON." }
    describe: { en: "DESCRIBE displays metadata; it does not change it.", fr: "DESCRIBE affiche des métadonnées ; il ne les modifie pas." }
    strnull: { en: "'NULL' is a string literal: the comment would become the text NULL.", fr: "'NULL' est une chaîne littérale : le commentaire deviendrait le texte NULL." }
    default: { en: "COMMENT ON accepts a string literal or NULL, not DEFAULT.", fr: "COMMENT ON accepte une chaîne littérale ou NULL, pas DEFAULT." }
references:
  - title: ALTER TABLE ... COLUMN clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-alter-table-manage-column
  - title: COMMENT ON
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-comment
