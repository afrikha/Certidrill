id: dp750-2a-grant-service-principal-id
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Microsoft Entra ID managed service principal with the display name **sp-etl-prod**. The service principal was added to the Azure Databricks account and assigned to the workspace. It already has USE CATALOG on woodgrove and USE SCHEMA on woodgrove.finance.

    You need to run a GRANT statement that gives the service principal the SELECT privilege on the table **woodgrove.finance.ledger**.

    How should you identify the service principal in the TO clause?
  fr: |
    Woodgrove Bank dispose d'un principal de service managé par Microsoft Entra ID dont le nom d'affichage est **sp-etl-prod**. Le principal de service a été ajouté au compte Azure Databricks et affecté à l'espace de travail. Il dispose déjà de USE CATALOG sur woodgrove et de USE SCHEMA sur woodgrove.finance.

    Vous devez exécuter une instruction GRANT qui accorde au principal de service le privilège SELECT sur la table **woodgrove.finance.ledger**.

    Comment devez-vous identifier le principal de service dans la clause TO ?
body:
  options:
    - { id: a, text: { en: "By its Microsoft Entra tenant ID, enclosed in backticks", fr: "Par l'ID de son locataire Microsoft Entra, entre accents graves" } }
    - { id: b, text: { en: "By its application ID, enclosed in backticks", fr: "Par son ID d'application, entre accents graves" } }
    - { id: c, text: { en: "By its display name, enclosed in backticks", fr: "Par son nom d'affichage, entre accents graves" } }
    - { id: d, text: { en: "By the object ID of its enterprise application, enclosed in backticks", fr: "Par l'ID d'objet de son application d'entreprise, entre accents graves" } }
answer: { optionId: b }
explanation:
  correct:
    en: In Unity Catalog GRANT, REVOKE and SHOW GRANTS statements, a service principal is identified by its application ID. Because the ID contains hyphens, you delimit it with backticks, for example GRANT SELECT ON TABLE woodgrove.finance.ledger TO `<application-id>`.
    fr: "Dans les instructions GRANT, REVOKE et SHOW GRANTS d'Unity Catalog, un principal de service est identifié par son ID d'application. Comme l'ID contient des tirets, vous le délimitez par des accents graves, par exemple GRANT SELECT ON TABLE woodgrove.finance.ledger TO `<application-id>`."
  options:
    c: { en: "Display names are not the identifier Unity Catalog uses for service principals in grants.", fr: "Le nom d'affichage n'est pas l'identificateur qu'Unity Catalog utilise pour les principaux de service dans les autorisations." }
    d: { en: "The object ID belongs to Microsoft Entra ID; Unity Catalog grants use the application ID.", fr: "L'ID d'objet appartient à Microsoft Entra ID ; les autorisations Unity Catalog utilisent l'ID d'application." }
    a: { en: "The tenant ID identifies the directory, not a principal.", fr: "L'ID de locataire identifie l'annuaire, pas un principal." }
references:
  - title: Manage privileges in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/
