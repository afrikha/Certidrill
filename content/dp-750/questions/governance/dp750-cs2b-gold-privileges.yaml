id: dp750-cs2b-gold-privileges
objective: "2.1.1"
type: multi
caseStudy: dp750-cs2b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the third security requirement.

    Which three statements should you run? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire la troisième exigence de sécurité.

    Quelles sont les trois instructions que vous devez exécuter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: usecat, text: "GRANT USE CATALOG ON CATALOG claims_prod TO `claims-analysts`;" }
    - { id: browse, text: "GRANT BROWSE ON CATALOG claims_prod TO `claims-analysts`;" }
    - { id: useschema, text: "GRANT USE SCHEMA ON SCHEMA claims_prod.gold TO `claims-analysts`;" }
    - { id: allpriv, text: "GRANT ALL PRIVILEGES ON SCHEMA claims_prod.gold TO `claims-analysts`;" }
    - { id: selschema, text: "GRANT SELECT ON SCHEMA claims_prod.gold TO `claims-analysts`;" }
    - { id: seltable, text: "GRANT SELECT ON TABLE claims_prod.gold.ceded_claims TO `claims-analysts`;" }
answer: { optionIds: [ usecat, useschema, selschema ] }
explanation:
  correct:
    en: To query a table, a principal needs USE CATALOG on its catalog, USE SCHEMA on its schema and SELECT on the table. SELECT granted on the schema is inherited by every current and future table of claims_prod.gold, and USE CATALOG alone grants no access to the data of the other schemas.
    fr: Pour interroger une table, un principal a besoin de USE CATALOG sur son catalogue, de USE SCHEMA sur son schéma et de SELECT sur la table. SELECT accordé sur le schéma est hérité par chaque table actuelle et future de claims_prod.gold, et USE CATALOG seul ne donne accès à aucune donnée des autres schémas.
  options:
    browse:
      en: BROWSE lets users see object metadata in Catalog Explorer; it does not replace USE CATALOG for querying data.
      fr: BROWSE permet de voir les métadonnées des objets dans l'Explorateur de catalogue ; il ne remplace pas USE CATALOG pour interroger des données.
    allpriv:
      en: ALL PRIVILEGES also grants MODIFY and other write privileges, which breaks least privilege.
      fr: ALL PRIVILEGES accorde aussi MODIFY et d'autres privilèges d'écriture, ce qui enfreint le principe des privilèges minimum.
    seltable:
      en: A table-level grant covers only ceded_claims, not the other current and future gold tables.
      fr: Une autorisation au niveau de la table couvre uniquement ceded_claims, pas les autres tables gold actuelles et futures.
references:
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
