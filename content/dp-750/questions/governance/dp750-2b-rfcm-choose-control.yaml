id: dp750-2b-rfcm-choose-control
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin secures data in Unity Catalog. The data governance team lists four requirements.

    Which control should you use for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin sécurise ses données dans Unity Catalog. L'équipe de gouvernance des données dresse la liste de quatre exigences.

    Quel contrôle devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rowfilter, text: { en: "Table-level row filter", fr: "Filtre de lignes au niveau de la table" } }
    - { id: colmask, text: { en: "Table-level column mask", fr: "Masque de colonne au niveau de la table" } }
    - { id: abac, text: { en: "ABAC column mask policy", fr: "Stratégie ABAC de masque de colonne" } }
    - { id: grant, text: { en: "GRANT SELECT on the table", fr: "GRANT SELECT sur la table" } }
    - { id: tag, text: { en: "Governed tag only", fr: "Balise gouvernée seule" } }
  targets:
    - id: t1
      text: { en: "In the ops.crew.pilots table only, replace the license_number value with a redacted value for users outside the crew_admins group.", fr: "Dans la seule table ops.crew.pilots, remplacer la valeur de license_number par une valeur masquée pour les utilisateurs extérieurs au groupe crew_admins." }
    - id: t2
      text: { en: "In the ops.flights.legs table only, show each station manager only the rows of their airport.", fr: "Dans la seule table ops.flights.legs, n'afficher à chaque chef d'escale que les lignes de son aéroport." }
    - id: t3
      text: { en: "Mask every column tagged pii = passport in all current and future tables of the ops catalog.", fr: "Masquer toutes les colonnes portant la balise pii = passport dans toutes les tables actuelles et futures du catalogue ops." }
    - id: t4
      text: { en: "Let the auditors group read every row and column of the ops.finance.fees table.", fr: "Permettre au groupe auditors de lire toutes les lignes et toutes les colonnes de la table ops.finance.fees." }
answer:
  mapping: { t1: colmask, t2: rowfilter, t3: abac, t4: grant }
explanation:
  correct:
    en: |
      A table-level column mask replaces the values of one column of one table, and a table-level row filter hides rows of one table. An ABAC column mask policy attached to the catalog matches tagged columns in every current and future table. Unrestricted read access is a plain SELECT grant.
    fr: |
      Un masque de colonne au niveau de la table remplace les valeurs d'une colonne d'une table, et un filtre de lignes au niveau de la table masque des lignes d'une table. Une stratégie ABAC de masque de colonne attachée au catalogue cible les colonnes balisées dans toutes les tables actuelles et futures. Un accès en lecture sans restriction correspond à un simple GRANT SELECT.
  options:
    tag:
      en: |
        A governed tag only classifies data; without a policy that references it, it does not mask or filter anything.
      fr: |
        Une balise gouvernée ne fait que classifier les données ; sans stratégie qui la référence, elle ne masque ni ne filtre rien.
references:
  - title: Row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/
  - title: Attribute-based access control in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/abac/
