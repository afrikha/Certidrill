id: dp750-2a-sp-m2m-cicd
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses an Azure DevOps pipeline that runs the Databricks CLI against a workspace. The pipeline must authenticate as an Azure Databricks managed service principal named **sp-deploy** by using OAuth machine-to-machine (M2M) authentication. No personal credential may be used.

    You are a workspace admin. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise un pipeline Azure DevOps qui exécute l'interface CLI Databricks sur un espace de travail. Le pipeline doit s'authentifier en tant que principal de service managé par Azure Databricks nommé **sp-deploy** avec l'authentification OAuth machine à machine (M2M). Aucune information d'identification personnelle ne doit être utilisée.

    Vous êtes administrateur de l'espace de travail. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set DATABRICKS_HOST, DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET as secret pipeline variables.", fr: "Définir DATABRICKS_HOST, DATABRICKS_CLIENT_ID et DATABRICKS_CLIENT_SECRET comme variables secrètes du pipeline." } }
    - { id: b, text: { en: "Generate a personal access token for your user and store it as a pipeline variable.", fr: "Générer un jeton d'accès personnel pour votre utilisateur et le stocker comme variable du pipeline." } }
    - { id: c, text: { en: "Set DATABRICKS_TOKEN to the OAuth secret of sp-deploy.", fr: "Définir DATABRICKS_TOKEN sur la clé secrète OAuth de sp-deploy." } }
    - { id: d, text: { en: "Create a client secret for sp-deploy in Microsoft Entra ID and request tokens from the Microsoft Entra ID token endpoint.", fr: "Créer une clé secrète client pour sp-deploy dans Microsoft Entra ID et demander des jetons au point de terminaison de jeton Microsoft Entra ID." } }
    - { id: e, text: { en: "Generate an OAuth secret on the Secrets tab of sp-deploy.", fr: "Générer une clé secrète OAuth dans l'onglet Secrets de sp-deploy." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: For OAuth M2M, an account or workspace admin generates an OAuth secret for the service principal; the secret is shown once, and the client ID is the service principal's application ID. Unified client authentication reads DATABRICKS_HOST, DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET, then requests and refreshes one-hour access tokens automatically.
    fr: Pour OAuth M2M, un administrateur de compte ou d'espace de travail génère une clé secrète OAuth pour le principal de service ; elle n'est affichée qu'une fois, et l'ID client est l'ID d'application du principal de service. L'authentification client unifiée lit DATABRICKS_HOST, DATABRICKS_CLIENT_ID et DATABRICKS_CLIENT_SECRET, puis demande et actualise automatiquement des jetons d'accès d'une heure.
  options:
    b: { en: "A personal access token of your user is a personal credential, which the requirements forbid.", fr: "Un jeton d'accès personnel de votre utilisateur est une information d'identification personnelle, ce que les exigences interdisent." }
    c: { en: "DATABRICKS_TOKEN holds a token such as a personal access token; an OAuth secret is passed as DATABRICKS_CLIENT_SECRET.", fr: "DATABRICKS_TOKEN contient un jeton, par exemple un jeton d'accès personnel ; une clé secrète OAuth se transmet dans DATABRICKS_CLIENT_SECRET." }
    d: { en: "sp-deploy is managed by Azure Databricks, so it has no Microsoft Entra ID application to create a client secret for.", fr: "sp-deploy est managé par Azure Databricks ; il n'a donc pas d'application Microsoft Entra ID pour laquelle créer une clé secrète client." }
references:
  - title: Authorize service principal access to Azure Databricks with OAuth
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/auth/oauth-m2m
