id: dp750-2a-account-group-function
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is creating a dynamic view over the Unity Catalog table **proseware.hr.payroll**. The view must return the salary column only to members of **hr-managers**, an account-level group defined in the Azure Databricks account.

    Which function should you use in the view definition to test the membership of the current user?
  fr: |
    Proseware crée une vue dynamique sur la table Unity Catalog **proseware.hr.payroll**. La vue ne doit renvoyer la colonne salary qu'aux membres de **hr-managers**, un groupe de niveau compte défini dans le compte Azure Databricks.

    Quelle fonction devez-vous utiliser dans la définition de la vue pour tester l'appartenance de l'utilisateur actuel ?
body:
  options:
    - { id: a, text: "is_account_group_member('hr-managers')" }
    - { id: b, text: "is_member('hr-managers')" }
    - { id: c, text: "session_user() = 'hr-managers'" }
    - { id: d, text: "current_catalog() = 'hr-managers'" }
answer: { optionId: a }
explanation:
  correct:
    en: is_account_group_member() returns TRUE when the current user belongs to the given account-level group, and Databricks recommends it for dynamic views over Unity Catalog data.
    fr: is_account_group_member() renvoie TRUE lorsque l'utilisateur actuel appartient au groupe de niveau compte indiqué, et Databricks la recommande pour les vues dynamiques sur les données Unity Catalog.
  options:
    b: { en: "is_member() checks workspace-level groups for Hive metastore compatibility and does not evaluate account-level membership.", fr: "is_member() vérifie les groupes de niveau espace de travail pour la compatibilité avec le metastore Hive et n'évalue pas l'appartenance aux groupes de compte." }
    c: { en: "session_user() returns the email address of the current user, never a group name.", fr: "session_user() renvoie l'adresse e-mail de l'utilisateur actuel, jamais un nom de groupe." }
    d: { en: "current_catalog() returns the current catalog, which has nothing to do with group membership.", fr: "current_catalog() renvoie le catalogue actuel, sans rapport avec l'appartenance à un groupe." }
references:
  - title: Create a dynamic view
    url: https://learn.microsoft.com/en-us/azure/databricks/views/dynamic
