id: dp750-2b-ret-time-travel-code
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Woodgrove has a Unity Catalog managed table named **finance.ledger.entries**. The table uses the default retention settings, and VACUUM runs on it every day.

    Auditors must be able to query any version of the table from the last 60 days by using time travel. The solution must minimize storage costs.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'une table managée Unity Catalog nommée **finance.ledger.entries**. La table utilise les paramètres de rétention par défaut, et VACUUM s'exécute sur celle-ci chaque jour.

    Les auditeurs doivent pouvoir interroger toute version de la table des 60 derniers jours par voyage dans le temps. La solution doit réduire au minimum les coûts de stockage.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE finance.ledger.entries SET TBLPROPERTIES (
      'delta.logRetentionDuration' = '[[log]]',
      'delta.deletedFileRetentionDuration' = '[[files]]'
    );
  slots:
    - id: log
      options:
        - { id: l7, text: interval 7 days }
        - { id: l30, text: interval 30 days }
        - { id: l60, text: interval 60 days }
        - { id: l90, text: interval 90 days }
    - id: files
      options:
        - { id: f30, text: interval 30 days }
        - { id: f60, text: interval 60 days }
        - { id: f90, text: interval 90 days }
        - { id: f365, text: interval 365 days }
answer:
  values: { log: l60, files: f60 }
explanation:
  correct:
    en: |
      Time travel needs both the transaction log entries and the data files of a version. The log is kept for 30 days and VACUUM removes unreferenced files older than 7 days by default, so both properties must be raised to 60 days; a longer value would keep more files and increase storage costs.
    fr: |
      Le voyage dans le temps nécessite à la fois les entrées du journal des transactions et les fichiers de données d'une version. Par défaut, le journal est conservé 30 jours et VACUUM supprime les fichiers non référencés de plus de 7 jours : les deux propriétés doivent donc passer à 60 jours ; une valeur plus longue conserverait davantage de fichiers et augmenterait les coûts de stockage.
  options:
    l30: { en: "30 days is the default log retention; versions older than 30 days would lose their history.", fr: "30 jours est la rétention par défaut du journal ; les versions de plus de 30 jours perdraient leur historique." }
    l7: { en: "The log retention must be at least as long as the deleted file retention and cover the 60 days.", fr: "La rétention du journal doit être au moins aussi longue que celle des fichiers supprimés et couvrir les 60 jours." }
    f30: { en: "VACUUM would remove the files of versions older than 30 days.", fr: "VACUUM supprimerait les fichiers des versions de plus de 30 jours." }
    f365: { en: "365 days meets the requirement but keeps far more files than needed, which increases storage costs.", fr: "365 jours satisfait l'exigence, mais conserve beaucoup plus de fichiers que nécessaire, ce qui augmente les coûts de stockage." }
references:
  - title: Work with table history
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/history
