id: dp750-2a-access-technique-mapping
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Unity Catalog table named **northwind.ops.shipments** with the columns shipment_id, region, driver_phone and cost. A second table, **northwind.ops.carriers**, describes the carriers.

    You need to meet the following access requirements. Each requirement must be met by a single technique.

    Which technique should you use for each requirement? To answer, drag the appropriate techniques to the correct requirements. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une table Unity Catalog nommée **northwind.ops.shipments** avec les colonnes shipment_id, region, driver_phone et cost. Une seconde table, **northwind.ops.carriers**, décrit les transporteurs.

    Vous devez répondre aux exigences d'accès suivantes. Chaque exigence doit être satisfaite par une seule technique.

    Quelle technique devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les techniques appropriées vers les exigences correspondantes. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: filter, text: { en: "Row filter", fr: "Filtre de lignes" } }
    - { id: view, text: { en: "View granted to the partners group", fr: "Vue accordée au groupe partners" } }
    - { id: modify, text: { en: "GRANT MODIFY on the shipments table", fr: "GRANT MODIFY sur la table shipments" } }
    - { id: cluster, text: { en: "Liquid clustering on region", fr: "Clustering liquide sur region" } }
    - { id: grant, text: { en: "GRANT SELECT on the shipments table", fr: "GRANT SELECT sur la table shipments" } }
    - { id: mask, text: { en: "Column mask", fr: "Masque de colonne" } }
  targets:
    - id: t1
      text: { en: "Logistics analysts read every row and column of shipments, without changing data.", fr: "Les analystes logistiques lisent toutes les lignes et colonnes de shipments, sans modifier les données." }
    - id: t2
      text: { en: "Users outside HR who query shipments directly see driver_phone as ***.", fr: "Les utilisateurs hors RH qui interrogent directement shipments voient driver_phone sous la forme ***." }
    - id: t3
      text: { en: "Regional managers who query shipments directly see only the rows of their region.", fr: "Les responsables régionaux qui interrogent directement shipments ne voient que les lignes de leur région." }
    - id: t4
      text: { en: "Partners query a curated dataset that joins shipments and carriers and omits the cost column.", fr: "Les partenaires interrogent un jeu de données organisé qui joint shipments et carriers et omet la colonne cost." }
answer:
  mapping: { t1: grant, t2: mask, t3: filter, t4: view }
explanation:
  correct:
    en: SELECT on the table gives read-only access to all its data. A column mask replaces a column's value at query time, and a row filter excludes rows at query time; both are defined on the table, so they apply to direct queries. A view is the way to share a curated, joined or redacted version of data, and its readers need SELECT on the view only.
    fr: SELECT sur la table donne un accès en lecture seule à toutes ses données. Un masque de colonne remplace la valeur d'une colonne au moment de la requête, et un filtre de lignes exclut des lignes au moment de la requête ; tous deux sont définis sur la table et s'appliquent donc aux requêtes directes. Une vue permet de partager une version organisée, jointe ou expurgée des données, et ses lecteurs n'ont besoin que de SELECT sur la vue.
  options:
    modify: { en: "MODIFY lets users change data, which no requirement asks for.", fr: "MODIFY permet de modifier les données, ce qu'aucune exigence ne demande." }
    cluster: { en: "Liquid clustering optimizes data layout; it does not control access.", fr: "Le clustering liquide optimise la disposition des données ; il ne contrôle pas l'accès." }
references:
  - title: Manually apply row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/manually-apply
  - title: Create a dynamic view
    url: https://learn.microsoft.com/en-us/azure/databricks/views/dynamic
