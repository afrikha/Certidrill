id: dp750-sr2-ledger-retention-1
objective: "2.2.4"
type: series_yesno
series: dp750-sr2-ledger-retention
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You set both retention properties to 60 days.
  fr: Vous définissez les deux propriétés de rétention sur 60 jours.
body:
  solution:
    en: |
      You run the following statement.

      ```sql
      ALTER TABLE fab_prod.finance.ledger SET TBLPROPERTIES (
        'delta.logRetentionDuration' = 'interval 60 days',
        'delta.deletedFileRetentionDuration' = 'interval 60 days'
      );
      ```
    fr: |
      Vous exécutez l'instruction suivante.

      ```sql
      ALTER TABLE fab_prod.finance.ledger SET TBLPROPERTIES (
        'delta.logRetentionDuration' = 'interval 60 days',
        'delta.deletedFileRetentionDuration' = 'interval 60 days'
      );
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      Time travel to a version needs both its transaction log entries and its data files. `delta.logRetentionDuration` (default 30 days) keeps the history, and `delta.deletedFileRetentionDuration` (default 7 days) is the threshold that `VACUUM` uses before it deletes unreferenced data files. With both set to 60 days, the log retention is not lower than the file retention, as Databricks Runtime 18.0 requires, and the `VACUUM` runs of predictive optimization keep removing only the files older than 60 days.
    fr: |
      Le voyage dans le temps vers une version nécessite à la fois ses entrées du journal des transactions et ses fichiers de données. `delta.logRetentionDuration` (30 jours par défaut) conserve l'historique, et `delta.deletedFileRetentionDuration` (7 jours par défaut) est le seuil que `VACUUM` applique avant de supprimer les fichiers de données non référencés. Avec les deux propriétés à 60 jours, la rétention du journal n'est pas inférieure à celle des fichiers, comme l'exige Databricks Runtime 18.0, et les exécutions de `VACUUM` par l'optimisation prédictive continuent de supprimer uniquement les fichiers de plus de 60 jours.
references:
