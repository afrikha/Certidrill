id: dp750-2b-abac-row-filter-code
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has a catalog named **sales**. Tables that contain regulated data are tagged with the governed tag `sensitivity` = `high`. In those tables, the column that stores the customer region is tagged `geo_region`. A function named **sales.governance.non_eu** returns TRUE when its STRING argument is not `EU`.

    You need members of the **us_analysts** group to see no European rows in the tables tagged `sensitivity` = `high`. Other tables in the catalog must not be filtered.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un catalogue nommé **sales**. Les tables qui contiennent des données réglementées portent la balise gouvernée `sensitivity` = `high`. Dans ces tables, la colonne qui stocke la région du client porte la balise `geo_region`. Une fonction nommée **sales.governance.non_eu** renvoie TRUE lorsque son argument STRING n'est pas `EU`.

    Vous devez faire en sorte que les membres du groupe **us_analysts** ne voient aucune ligne européenne dans les tables portant la balise `sensitivity` = `high`. Les autres tables du catalogue ne doivent pas être filtrées.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE POLICY hide_eu_rows
    ON CATALOG sales
    ROW FILTER sales.governance.non_eu
    TO `us_analysts`
    FOR TABLES
    [[when]] has_tag_value('sensitivity', 'high')
    MATCH COLUMNS has_tag('geo_region') AS region
    [[using]] (region);
  slots:
    - id: when
      options:
        - { id: where, text: WHERE }
        - { id: when, text: WHEN }
        - { id: matchtables, text: MATCH TABLES }
        - { id: filter, text: FILTER }
    - id: using
      options:
        - { id: on, text: "ON" }
        - { id: oncolumn, text: ON COLUMN }
        - { id: usingcolumns, text: USING COLUMNS }
        - { id: with, text: WITH }
answer:
  values: { when: when, using: usingcolumns }
explanation:
  correct:
    en: |
      The WHEN clause selects the tables the policy applies to by their tags; without it, the condition defaults to TRUE and every table of the catalog with a geo_region column would be filtered. USING COLUMNS passes the matched column alias as the argument of the row filter function.
    fr: |
      La clause WHEN sélectionne par leurs balises les tables auxquelles la stratégie s'applique ; sans elle, la condition vaut TRUE par défaut et toutes les tables du catalogue ayant une colonne geo_region seraient filtrées. USING COLUMNS passe l'alias de la colonne ciblée comme argument de la fonction de filtre de lignes.
  options:
    on: { en: "ON (column, …) is the syntax of ALTER TABLE … SET ROW FILTER for a table-level filter, not of CREATE POLICY.", fr: "ON (colonne, …) est la syntaxe d'ALTER TABLE … SET ROW FILTER pour un filtre au niveau de la table, pas celle de CREATE POLICY." }
    oncolumn: { en: "ON COLUMN names the column to mask in a column mask policy; a row filter policy does not use it.", fr: "ON COLUMN désigne la colonne à masquer dans une stratégie de masque de colonne ; une stratégie de filtre de lignes ne l'utilise pas." }
    where: { en: "CREATE POLICY has no WHERE clause; tables are selected with WHEN.", fr: "CREATE POLICY n'a pas de clause WHERE ; les tables sont sélectionnées avec WHEN." }
    matchtables: { en: "There is no MATCH TABLES clause; MATCH COLUMNS selects columns and WHEN selects tables.", fr: "Il n'existe pas de clause MATCH TABLES ; MATCH COLUMNS sélectionne des colonnes et WHEN sélectionne des tables." }
references:
  - title: Create and manage row filter and column mask policies
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/abac/policies
