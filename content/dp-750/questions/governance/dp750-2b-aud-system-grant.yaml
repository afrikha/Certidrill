id: dp750-2b-aud-system-grant
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At Northwind, the **auditors** group must query the audit log system table **system.access.audit** from a SQL warehouse. The group currently has no privilege in the system catalog.

    You need to give the group access. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Chez Northwind, le groupe **auditors** doit interroger la table système du journal d'audit **system.access.audit** depuis un entrepôt SQL. Le groupe ne dispose actuellement d'aucun privilège dans le catalogue system.

    Vous devez donner l'accès au groupe. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - id: c
      text: { en: "Assign the account admin role to the auditors group.", fr: "Attribuer le rôle d'administrateur de compte au groupe auditors." }
    - id: b
      text: { en: "Grant USE CATALOG on the system catalog and SELECT on the system.access.audit table.", fr: "Accorder USE CATALOG sur le catalogue system et SELECT sur la table system.access.audit." }
    - id: a
      text: { en: "Grant USE CATALOG on the system catalog, and USE SCHEMA and SELECT on the system.access schema.", fr: "Accorder USE CATALOG sur le catalogue system, ainsi que USE SCHEMA et SELECT sur le schéma system.access." }
    - id: d
      text: { en: "Make the auditors group the metastore admin.", fr: "Désigner le groupe auditors comme administrateur du metastore." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Only users who are both account admin and metastore admin can read system tables by default. Other principals need USE CATALOG on the system catalog plus USE SCHEMA and SELECT on the system schema, which is exactly what this grant provides; system tables are read-only.
    fr: |
      Par défaut, seuls les utilisateurs à la fois administrateurs de compte et administrateurs du metastore peuvent lire les tables système. Les autres principaux ont besoin de USE CATALOG sur le catalogue system, ainsi que de USE SCHEMA et SELECT sur le schéma système, ce que fournit précisément cette attribution ; les tables système sont en lecture seule.
  options:
    c:
      en: |
        The account admin role grants control of the whole account, far beyond reading one system table.
      fr: |
        Le rôle d'administrateur de compte donne le contrôle de tout le compte, bien au-delà de la lecture d'une table système.
    b:
      en: |
        Without USE SCHEMA on system.access, the group cannot reach the table, even with SELECT on it.
      fr: |
        Sans USE SCHEMA sur system.access, le groupe ne peut pas atteindre la table, même avec SELECT sur celle-ci.
    d:
      en: |
        Metastore admin can manage every object of the metastore, which exceeds the need.
      fr: |
        L'administrateur du metastore peut gérer tous les objets du metastore, ce qui dépasse le besoin.
references:
  - title: System tables reference
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/
