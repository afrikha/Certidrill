id: dp750-2a-grant-create-table-code
objective: "2.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Unity Catalog catalog named **fabrikam_dev** that contains three schemas: **bronze**, **silver** and **gold**. An account group named **data-eng** already has the USE CATALOG privilege on fabrikam_dev.

    Members of data-eng must be able to create tables in fabrikam_dev.bronze only. The solution must follow the principle of least privilege.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un catalogue Unity Catalog nommé **fabrikam_dev** qui contient trois schémas : **bronze**, **silver** et **gold**. Un groupe de compte nommé **data-eng** dispose déjà du privilège USE CATALOG sur fabrikam_dev.

    Les membres de data-eng doivent pouvoir créer des tables uniquement dans fabrikam_dev.bronze. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    GRANT USE SCHEMA, [[priv]]
    ON [[sec]] fabrikam_dev.bronze
    TO [[prin]];
  slots:
    - id: priv
      options:
        - { id: modify, text: MODIFY }
        - { id: all, text: ALL PRIVILEGES }
        - { id: schema, text: CREATE SCHEMA }
        - { id: create, text: CREATE TABLE }
    - id: sec
      options:
        - { id: catalog, text: CATALOG }
        - { id: table, text: TABLE }
        - { id: schema, text: SCHEMA }
    - id: prin
      options:
        - { id: quoted, text: "'data-eng'" }
        - { id: bt, text: "`data-eng`" }
        - { id: plain, text: data-eng }
answer:
  values: { priv: create, sec: schema, prin: bt }
explanation:
  correct:
    en: CREATE TABLE on a schema, combined with USE SCHEMA on that schema and USE CATALOG on its catalog, lets a principal create tables in that schema only. The securable type of the two-level name fabrikam_dev.bronze is SCHEMA. Principal names that contain special characters, such as a hyphen, are delimited with backticks.
    fr: CREATE TABLE sur un schéma, avec USE SCHEMA sur ce schéma et USE CATALOG sur son catalogue, permet à un principal de créer des tables uniquement dans ce schéma. Le type d'objet sécurisable du nom à deux niveaux fabrikam_dev.bronze est SCHEMA. Les noms de principaux qui contiennent des caractères spéciaux, comme un tiret, sont délimités par des accents graves.
  options:
    modify: { en: "MODIFY lets users change data in existing tables; it does not let them create tables.", fr: "MODIFY permet de modifier les données de tables existantes ; il ne permet pas de créer des tables." }
    all: { en: "ALL PRIVILEGES grants every privilege on the schema and its children, far beyond creating tables.", fr: "ALL PRIVILEGES accorde tous les privilèges sur le schéma et ses enfants, bien au-delà de la création de tables." }
    schema: { en: "CREATE SCHEMA is granted on a catalog and lets users create schemas, not tables.", fr: "CREATE SCHEMA s'accorde sur un catalogue et permet de créer des schémas, pas des tables." }
    catalog: { en: "fabrikam_dev.bronze is a schema, not a catalog.", fr: "fabrikam_dev.bronze est un schéma, pas un catalogue." }
    table: { en: "fabrikam_dev.bronze is a schema, and CREATE TABLE is not a table privilege.", fr: "fabrikam_dev.bronze est un schéma, et CREATE TABLE n'est pas un privilège de table." }
    plain: { en: "Without backticks, the hyphen makes the principal name invalid.", fr: "Sans accents graves, le tiret rend le nom du principal invalide." }
    quoted: { en: "Single quotes denote a string literal, not a principal identifier.", fr: "Les guillemets simples désignent une chaîne littérale, pas un identificateur de principal." }
references:
  - title: Manage privileges in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
