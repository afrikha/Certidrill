id: dp750-cs4a-reinsurer-share
objective: "2.2.7"
type: multi
caseStudy: dp750-cs4a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You create a share named reinsurance_share in the Humongous Insurance metastore to meet the reinsurance requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un partage nommé reinsurance_share dans le metastore de Humongous Insurance pour satisfaire l'exigence de réassurance.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the recipient with CREATE RECIPIENT … USING ID and the sharing identifier of the Lucerne Re metastore.", fr: "Créer le destinataire avec CREATE RECIPIENT … USING ID et l'identifiant de partage du metastore de Lucerne Re." } }
    - { id: b, text: { en: "Create the recipient with CREATE RECIPIENT without USING ID, and send the activation link to Lucerne Re.", fr: "Créer le destinataire avec CREATE RECIPIENT sans USING ID, puis envoyer le lien d'activation à Lucerne Re." } }
    - { id: c, text: { en: "Add hi_prod.gold.loss_summary to reinsurance_share with the WITH HISTORY clause.", fr: "Ajouter hi_prod.gold.loss_summary à reinsurance_share avec la clause WITH HISTORY." } }
    - { id: d, text: { en: "Add hi_prod.gold.loss_summary to reinsurance_share with the WITHOUT HISTORY clause.", fr: "Ajouter hi_prod.gold.loss_summary à reinsurance_share avec la clause WITHOUT HISTORY." } }
    - { id: e, text: { en: "Bind the hi_prod catalog to a workspace of the Lucerne Re account in read-only mode.", fr: "Lier le catalogue hi_prod à un espace de travail du compte Lucerne Re en lecture seule." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Lucerne Re uses Azure Databricks with Unity Catalog, so Databricks-to-Databricks sharing applies; a recipient created with USING ID and the sharing identifier of its metastore authenticates without any token for the provider to manage. WITHOUT HISTORY shares only the current version, which blocks time travel; the default is WITH HISTORY on Databricks SQL and Databricks Runtime 16.2 and above, so the clause must be explicit.
    fr: |
      Lucerne Re utilise Azure Databricks avec Unity Catalog, donc le partage Databricks-to-Databricks s'applique ; un destinataire créé avec USING ID et l'identifiant de partage de son metastore s'authentifie sans aucun jeton à gérer par le fournisseur. WITHOUT HISTORY ne partage que la version actuelle, ce qui empêche le voyage dans le temps ; la valeur par défaut est WITH HISTORY sur Databricks SQL et Databricks Runtime 16.2 et versions ultérieures : la clause doit donc être explicite.
  options:
    b:
      en: |
        Without USING ID, the recipient uses token authentication, and Humongous Insurance would have to manage the recipient's bearer token.
      fr: |
        Sans USING ID, le destinataire utilise l'authentification par jeton, et Humongous Insurance devrait gérer le jeton du porteur du destinataire.
    c:
      en: |
        WITH HISTORY shares the table history, which lets the recipient run time travel queries on earlier versions.
      fr: |
        WITH HISTORY partage l'historique de la table, ce qui permet au destinataire d'interroger les versions antérieures par voyage dans le temps.
    e:
      en: |
        Workspace-catalog binding only applies to workspaces attached to the same metastore; it cannot give another account access to a catalog.
      fr: |
        La liaison espace de travail-catalogue ne s'applique qu'aux espaces de travail attachés au même metastore ; elle ne peut pas donner accès à un catalogue depuis un autre compte.
references:
  - title: What is OpenSharing?
    url: https://learn.microsoft.com/en-us/azure/databricks/delta-sharing/
  - title: ALTER SHARE
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-alter-share
