id: dp750-2a-kv-scope-isolation
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has one Azure key vault named **kv-shared** that stores secrets for two teams, finance and marketing. An Azure Key Vault-backed secret scope named **shared** references kv-shared, and both the finance and marketing groups have the READ permission on the scope.

    A new policy states that members of the marketing group must not be able to read the finance secrets. Finance notebooks must keep reading their secrets through the shared scope.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un seul coffre de clés Azure nommé **kv-shared** qui stocke les secrets de deux équipes, finance et marketing. Une étendue de secrets reposant sur Azure Key Vault nommée **shared** référence kv-shared, et les groupes finance et marketing disposent de l'autorisation READ sur l'étendue.

    Une nouvelle règle impose que les membres du groupe marketing ne puissent pas lire les secrets de la finance. Les notebooks de la finance doivent continuer à lire leurs secrets par l'étendue shared.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Switch kv-shared to the Azure RBAC permission model and assign Key Vault Secrets User to marketing on the marketing secrets only.", fr: "Basculer kv-shared vers le modèle d'autorisation Azure RBAC et attribuer Key Vault Secrets User à marketing uniquement sur les secrets marketing." } }
    - { id: b, text: { en: "Change the Manage Principal setting of the shared scope from All workspace users to Creator.", fr: "Changer le paramètre Gérer le principal de l'étendue shared de Tous les utilisateurs de l'espace de travail à Créateur." } }
    - { id: c, text: { en: "Move the marketing secrets to a new key vault referenced by a new Key Vault-backed scope, grant marketing READ on the new scope, and remove marketing's ACL on shared.", fr: "Déplacer les secrets marketing vers un nouveau coffre de clés référencé par une nouvelle étendue reposant sur Azure Key Vault, accorder READ à marketing sur la nouvelle étendue et supprimer l'ACL de marketing sur shared." } }
    - { id: d, text: { en: "Run databricks secrets put-acl to grant marketing READ only on the marketing secret keys of the shared scope.", fr: "Exécuter databricks secrets put-acl pour accorder à marketing READ uniquement sur les clés de secrets marketing de l'étendue shared." } }
answer: { optionId: c }
explanation:
  correct:
    en: Secret ACLs are set at the scope level, and a principal with access to a Key Vault-backed scope can read every secret in the vault. Microsoft Learn recommends separate key vault instances to restrict access, so marketing gets its own vault and scope while finance keeps using shared.
    fr: Les ACL de secret se définissent au niveau de l'étendue, et un principal qui a accès à une étendue reposant sur Azure Key Vault peut lire tous les secrets du coffre. Microsoft Learn recommande des instances de coffre de clés distinctes pour restreindre l'accès ; marketing obtient donc son propre coffre et sa propre étendue, tandis que la finance continue d'utiliser shared.
  options:
    d: { en: "put-acl applies to a whole scope; there are no per-secret ACLs.", fr: "put-acl s'applique à une étendue entière ; il n'existe pas d'ACL par secret." }
    a: { en: "Key Vault-backed scopes support only the Vault access policy model; switching to Azure RBAC breaks the scope.", fr: "Les étendues reposant sur Azure Key Vault ne prennent en charge que le modèle Stratégie d'accès au coffre ; basculer vers Azure RBAC rend l'étendue inutilisable." }
    b: { en: "Manage Principal decides who gets MANAGE when the scope is created; it does not restrict which secrets READ principals can read.", fr: "Gérer le principal détermine qui reçoit MANAGE à la création de l'étendue ; il ne restreint pas les secrets lisibles par les principaux disposant de READ." }
references:
  - title: Workspace secret scopes
    url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets/workspace-secret-scopes
