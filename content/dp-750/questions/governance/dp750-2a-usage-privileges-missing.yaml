id: dp750-2a-usage-privileges-missing
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Unity Catalog metastore that contains a catalog named **sales**. The catalog contains a schema named **gold** and a table named **sales.gold.orders**.

    You granted the SELECT privilege on sales.gold.orders to an account group named **bi-analysts**. When members of bi-analysts query the table from a SQL warehouse, they receive a permission error. No other privilege is granted to bi-analysts.

    You need to ensure that the members of bi-analysts can query sales.gold.orders. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso dispose d'un metastore Unity Catalog qui contient un catalogue nommé **sales**. Le catalogue contient un schéma nommé **gold** et une table nommée **sales.gold.orders**.

    Vous avez accordé le privilège SELECT sur sales.gold.orders à un groupe de compte nommé **bi-analysts**. Lorsque les membres de bi-analysts interrogent la table depuis un entrepôt SQL, ils reçoivent une erreur d'autorisation. Aucun autre privilège n'est accordé à bi-analysts.

    Vous devez faire en sorte que les membres de bi-analysts puissent interroger sales.gold.orders. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant USE CATALOG on sales and USE SCHEMA on sales.gold to bi-analysts.", fr: "Accorder USE CATALOG sur sales et USE SCHEMA sur sales.gold à bi-analysts." } }
    - { id: b, text: { en: "Grant SELECT on the schema sales.gold to bi-analysts.", fr: "Accorder SELECT sur le schéma sales.gold à bi-analysts." } }
    - { id: c, text: { en: "Grant BROWSE on the catalog sales to bi-analysts.", fr: "Accorder BROWSE sur le catalogue sales à bi-analysts." } }
    - { id: d, text: { en: "Grant MANAGE on the table sales.gold.orders to bi-analysts.", fr: "Accorder MANAGE sur la table sales.gold.orders à bi-analysts." } }
answer: { optionId: a }
explanation:
  correct:
    en: To read a table, a principal needs SELECT on the table, USE CATALOG on its catalog and USE SCHEMA on its schema. SELECT alone is not enough, and the usage privileges do not give access to any data by themselves, so adding them grants nothing beyond the one table.
    fr: Pour lire une table, un principal a besoin de SELECT sur la table, de USE CATALOG sur son catalogue et de USE SCHEMA sur son schéma. SELECT seul ne suffit pas, et les privilèges d'utilisation ne donnent accès à aucune donnée par eux-mêmes ; les ajouter n'accorde donc rien d'autre que la table visée.
  options:
    b: { en: "SELECT on the schema still lacks USE CATALOG and USE SCHEMA, and it would expose every current and future table of the schema.", fr: "SELECT sur le schéma ne fournit toujours pas USE CATALOG ni USE SCHEMA, et il exposerait toutes les tables actuelles et futures du schéma." }
    c: { en: "BROWSE lets users see metadata and request access; it does not provide the usage privileges required to query data.", fr: "BROWSE permet de voir les métadonnées et de demander l'accès ; il ne fournit pas les privilèges d'utilisation nécessaires pour interroger les données." }
    d: { en: "MANAGE lets a principal manage privileges, rename and drop the table; it is excessive and does not grant USE CATALOG or USE SCHEMA.", fr: "MANAGE permet de gérer les privilèges, de renommer et de supprimer la table ; il est excessif et n'accorde ni USE CATALOG ni USE SCHEMA." }
references:
  - title: Unity Catalog permissions model concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/access-control/permissions-concepts
