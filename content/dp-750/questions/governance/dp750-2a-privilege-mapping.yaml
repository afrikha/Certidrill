id: dp750-2a-privilege-mapping
objective: "2.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Unity Catalog schema named **tailspin.ops** that contains:

    - a volume named **tailspin.ops.landing**;
    - a table named **tailspin.ops.flights**;
    - a SQL function named **tailspin.ops.mask_pnr**.

    Four account groups already have USE CATALOG on tailspin and USE SCHEMA on tailspin.ops. You need to grant each group the privilege it needs on the object concerned. The solution must follow the principle of least privilege.

    Which privilege should you grant to each group? To answer, drag the appropriate privileges to the correct groups. Each privilege may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un schéma Unity Catalog nommé **tailspin.ops** qui contient :

    - un volume nommé **tailspin.ops.landing** ;
    - une table nommée **tailspin.ops.flights** ;
    - une fonction SQL nommée **tailspin.ops.mask_pnr**.

    Quatre groupes de compte disposent déjà de USE CATALOG sur tailspin et de USE SCHEMA sur tailspin.ops. Vous devez accorder à chaque groupe le privilège dont il a besoin sur l'objet concerné. La solution doit respecter le principe du moindre privilège.

    Quel privilège devez-vous accorder à chaque groupe ? Pour répondre, faites glisser les privilèges appropriés vers les groupes correspondants. Chaque privilège peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: exec, text: EXECUTE }
    - { id: select, text: SELECT }
    - { id: modify, text: MODIFY }
    - { id: rf, text: READ FILES }
    - { id: rv, text: READ VOLUME }
    - { id: wv, text: WRITE VOLUME }
  targets:
    - id: ingest
      text: { en: "ingest-team: upload new CSV files to the landing volume", fr: "ingest-team : charger de nouveaux fichiers CSV dans le volume landing" }
    - id: audit
      text: { en: "auditors: list and read the files of the landing volume", fr: "auditors : lister et lire les fichiers du volume landing" }
    - id: analysts
      text: { en: "analysts: call mask_pnr in their queries", fr: "analysts : appeler mask_pnr dans leurs requêtes" }
    - id: reporting
      text: { en: "reporting: query the flights table", fr: "reporting : interroger la table flights" }
answer:
  mapping: { ingest: wv, audit: rv, analysts: exec, reporting: select }
explanation:
  correct:
    en: WRITE VOLUME lets a principal add, modify or delete files in a volume, and READ VOLUME lets it read files and directories. EXECUTE on a function lets a principal invoke it. SELECT on a table lets a principal query it. Each requires USE CATALOG and USE SCHEMA on the parents, which the groups already have.
    fr: WRITE VOLUME permet d'ajouter, de modifier ou de supprimer des fichiers dans un volume, et READ VOLUME de lire ses fichiers et répertoires. EXECUTE sur une fonction permet de l'appeler. SELECT sur une table permet de l'interroger. Chacun exige USE CATALOG et USE SCHEMA sur les parents, dont les groupes disposent déjà.
  options:
    modify: { en: "MODIFY changes the rows of a table; it is not a volume or function privilege.", fr: "MODIFY modifie les lignes d'une table ; ce n'est pas un privilège de volume ni de fonction." }
    rf: { en: "READ FILES applies to an external location, not to a volume.", fr: "READ FILES s'applique à un emplacement externe, pas à un volume." }
references:
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
