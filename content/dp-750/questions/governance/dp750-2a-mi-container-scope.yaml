id: dp750-2a-mi-container-scope
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Data Lake Storage account named **stwoodgrove** that contains the containers finance, hr and marketing. An Access Connector for Azure Databricks named **ac-finance** will back a Unity Catalog storage credential.

    The managed identity of ac-finance must be able to read and write data in the finance container only. It must not have data access to the other containers.

    Which role assignments should you configure for the managed identity?
  fr: |
    Woodgrove Bank dispose d'un compte Azure Data Lake Storage nommé **stwoodgrove** qui contient les conteneurs finance, hr et marketing. Un connecteur d'accès pour Azure Databricks nommé **ac-finance** servira de base à des informations d'identification de stockage Unity Catalog.

    L'identité managée d'ac-finance doit pouvoir lire et écrire des données uniquement dans le conteneur finance. Elle ne doit pas avoir accès aux données des autres conteneurs.

    Quelles attributions de rôles devez-vous configurer pour l'identité managée ?
body:
  options:
    - { id: a, text: { en: "Storage Blob Data Contributor on the storage account", fr: "Storage Blob Data Contributor sur le compte de stockage" } }
    - { id: b, text: { en: "Storage Blob Data Contributor on the finance container only", fr: "Storage Blob Data Contributor sur le conteneur finance uniquement" } }
    - { id: c, text: { en: "Storage Account Contributor on the storage account, and Storage Blob Data Reader on the finance container", fr: "Storage Account Contributor sur le compte de stockage, et Storage Blob Data Reader sur le conteneur finance" } }
    - { id: d, text: { en: "Storage Blob Delegator on the storage account, and Storage Blob Data Contributor on the finance container", fr: "Storage Blob Delegator sur le compte de stockage, et Storage Blob Data Contributor sur le conteneur finance" } }
answer: { optionId: d }
explanation:
  correct:
    en: Microsoft Learn documents a narrower alternative to Storage Blob Data Contributor on the whole account, which is to assign Storage Blob Delegator at the storage account level and Storage Blob Data Contributor on the specific container. The identity can then read and write the finance container only.
    fr: Microsoft Learn documente une alternative plus restreinte à Storage Blob Data Contributor sur tout le compte, qui consiste à attribuer Storage Blob Delegator au niveau du compte de stockage et Storage Blob Data Contributor sur le conteneur concerné. L'identité ne peut alors lire et écrire que dans le conteneur finance.
  options:
    a: { en: "An assignment on the storage account gives data access to every container, including hr and marketing.", fr: "Une attribution sur le compte de stockage donne accès aux données de tous les conteneurs, y compris hr et marketing." }
    b: { en: "The documented container-scoped configuration also requires Storage Blob Delegator on the storage account.", fr: "La configuration documentée limitée à un conteneur exige aussi Storage Blob Delegator sur le compte de stockage." }
    c: { en: "Storage Blob Data Reader does not allow writes, and Storage Account Contributor is a management role that is not needed for data access.", fr: "Storage Blob Data Reader ne permet pas l'écriture, et Storage Account Contributor est un rôle de gestion inutile pour l'accès aux données." }
references:
  - title: Use Azure managed identities in Unity Catalog to access storage
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/azure-managed-identities
