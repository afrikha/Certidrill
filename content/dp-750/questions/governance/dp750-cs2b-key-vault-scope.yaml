id: dp750-cs2b-key-vault-scope
objective: "2.1.3"
type: single
caseStudy: dp750-cs2b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to make the credentials of sqldb-policyadmin available to Azure Databricks. The solution must meet the first security requirement.

    What should you do?
  fr: |
    Vous devez rendre les informations d'identification de sqldb-policyadmin disponibles pour Azure Databricks. La solution doit respecter la première exigence de sécurité.

    Que devez-vous faire ?
body:
  options:
    - { id: dbbacked, text: { en: "Create a Databricks-backed secret scope, and add sqlpa-user and sqlpa-password to the scope", fr: "Créer une étendue de secrets adossée à Databricks, et y ajouter sqlpa-user et sqlpa-password" } }
    - { id: rbac, text: { en: "Switch kv-hi-data to the Azure RBAC permission model, and then create an Azure Key Vault-backed secret scope", fr: "Faire passer kv-hi-data au modèle d'autorisation RBAC Azure, puis créer une étendue de secrets adossée à Azure Key Vault" } }
    - { id: kvbacked, text: { en: "Create an Azure Key Vault-backed secret scope that references kv-hi-data", fr: "Créer une étendue de secrets adossée à Azure Key Vault qui référence kv-hi-data" } }
    - { id: literal, text: { en: "Copy the values of sqlpa-user and sqlpa-password into the OPTIONS of the Unity Catalog connection", fr: "Copier les valeurs de sqlpa-user et sqlpa-password dans les OPTIONS de la connexion Unity Catalog" } }
answer: { optionId: kvbacked }
explanation:
  correct:
    en: An Azure Key Vault-backed secret scope is a read-only interface to the vault, created from its DNS name and resource ID. The secrets stay in kv-hi-data, where the security team keeps creating, updating and rotating them, and Azure Databricks reads the current values.
    fr: Une étendue de secrets adossée à Azure Key Vault est une interface en lecture seule sur le coffre, créée à partir de son nom DNS et de son ID de ressource. Les secrets restent dans kv-hi-data, où l'équipe sécurité continue de les créer, de les mettre à jour et de les renouveler, et Azure Databricks lit les valeurs actuelles.
  options:
    dbbacked:
      en: A Databricks-backed scope stores copies of the secrets in an encrypted database managed by Azure Databricks, and the copies would not follow the rotations made in the vault.
      fr: Une étendue adossée à Databricks stocke des copies des secrets dans une base de données chiffrée gérée par Azure Databricks, et ces copies ne suivraient pas les renouvellements effectués dans le coffre.
    rbac:
      en: Azure Key Vault-backed scopes support only the Vault access policy permission model, which kv-hi-data already uses.
      fr: Les étendues adossées à Azure Key Vault ne prennent en charge que le modèle d'autorisation de stratégie d'accès du coffre, que kv-hi-data utilise déjà.
    literal:
      en: Plaintext credentials in the connection are a copy outside the vault, and Databricks recommends secrets instead.
      fr: Des informations d'identification en clair dans la connexion constituent une copie hors du coffre, et Databricks recommande d'utiliser des secrets à la place.
references:
  - title: Secret management
    url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets/
