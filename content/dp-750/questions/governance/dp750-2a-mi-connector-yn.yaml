id: dp750-2a-mi-connector-yn
objective: "2.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum is configuring an Access Connector for Azure Databricks named **ac-adatum** to back Unity Catalog storage credentials.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum configure un connecteur d'accès pour Azure Databricks nommé **ac-adatum** comme base d'informations d'identification de stockage Unity Catalog.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: ac-adatum can have a system-assigned managed identity and one or more user-assigned managed identities at the same time.
        fr: ac-adatum peut avoir à la fois une identité managée affectée par le système et une ou plusieurs identités managées affectées par l'utilisateur.
    - id: s2
      text:
        en: If you use the system-assigned identity of ac-adatum, you must also enter a managed identity resource ID when you create the storage credential.
        fr: Si vous utilisez l'identité affectée par le système d'ac-adatum, vous devez aussi saisir un ID de ressource d'identité managée lors de la création des informations d'identification de stockage.
    - id: s3
      text:
        en: For best performance, ac-adatum should be in the same region as the storage account.
        fr: Pour de meilleures performances, ac-adatum doit se trouver dans la même région que le compte de stockage.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: An access connector can hold a system-assigned identity, user-assigned identities or both. The managed identity resource ID is provided only for a user-assigned identity; with the system-assigned identity, the access connector ID is enough. Learn recommends matching the connector's region to the storage account and co-locating the connector, workspaces, metastore and storage.
    fr: Un connecteur d'accès peut porter une identité affectée par le système, des identités affectées par l'utilisateur ou les deux. L'ID de ressource de l'identité managée n'est fourni que pour une identité affectée par l'utilisateur ; avec l'identité affectée par le système, l'ID du connecteur d'accès suffit. Learn recommande d'aligner la région du connecteur sur celle du compte de stockage et de regrouper connecteur, espaces de travail, metastore et stockage.
references:
  - title: Use Azure managed identities in Unity Catalog to access storage
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/azure-managed-identities
