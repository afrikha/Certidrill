id: dp750-2a-sp-secret-in-scope
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A notebook at Tailspin Toys authenticates to Azure Data Lake Storage with a Microsoft Entra ID service principal. The client secret of the service principal is currently written in plain text in the notebook.

    The security team requires that notebook users can use the service principal without seeing its client secret, and that the secret can be rotated in Azure Key Vault without editing the notebook.

    What should you do?
  fr: |
    Un notebook de Tailspin Toys s'authentifie auprès d'Azure Data Lake Storage avec un principal de service Microsoft Entra ID. La clé secrète client du principal de service est actuellement écrite en clair dans le notebook.

    L'équipe de sécurité exige que les utilisateurs du notebook puissent utiliser le principal de service sans voir sa clé secrète client, et que la clé puisse être renouvelée dans Azure Key Vault sans modifier le notebook.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Store the client secret in a key vault, create a Key Vault-backed secret scope, and read the secret with dbutils.secrets.get().", fr: "Stocker la clé secrète client dans un coffre de clés, créer une étendue de secrets reposant sur Azure Key Vault et lire le secret avec dbutils.secrets.get()." } }
    - { id: b, text: { en: "Store the client secret in a Databricks-backed secret scope and read it with dbutils.secrets.get().", fr: "Stocker la clé secrète client dans une étendue de secrets reposant sur Databricks et la lire avec dbutils.secrets.get()." } }
    - { id: c, text: { en: "Store the client secret in plain text in an environment variable of the compute resource.", fr: "Stocker la clé secrète client en clair dans une variable d'environnement de la ressource de calcul." } }
    - { id: d, text: { en: "Store the client secret as the default value of a notebook widget.", fr: "Stocker la clé secrète client comme valeur par défaut d'un widget de notebook." } }
answer: { optionId: a }
explanation:
  correct:
    en: Databricks recommends secret scopes for all credentials. A Key Vault-backed scope reads the secret from Azure Key Vault, so a rotation in the vault is picked up without code changes, and values read with dbutils.secrets.get() are redacted in notebook output. Users need only READ on the scope.
    fr: Databricks recommande les étendues de secrets pour toutes les informations d'identification. Une étendue reposant sur Azure Key Vault lit le secret dans Azure Key Vault ; un renouvellement dans le coffre est donc pris en compte sans modifier le code, et les valeurs lues avec dbutils.secrets.get() sont masquées dans la sortie du notebook. Les utilisateurs n'ont besoin que de READ sur l'étendue.
  options:
    b: { en: "A Databricks-backed scope stores the secret in Azure Databricks, so rotating it in Azure Key Vault has no effect.", fr: "Une étendue reposant sur Databricks stocke le secret dans Azure Databricks ; le renouveler dans Azure Key Vault est donc sans effet." }
    c: { en: "Databricks warns against putting credentials in plain text in environment variables or Spark configuration.", fr: "Databricks déconseille de placer des informations d'identification en clair dans des variables d'environnement ou la configuration Spark." }
    d: { en: "A widget default value is stored with the notebook and visible to its users.", fr: "La valeur par défaut d'un widget est stockée avec le notebook et visible par ses utilisateurs." }
references:
  - title: Connect to Azure Data Lake Storage and Blob Storage
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/storage/azure-storage
  - title: Workspace secret scopes
    url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets/workspace-secret-scopes
