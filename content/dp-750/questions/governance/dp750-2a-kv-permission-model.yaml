id: dp750-2a-kv-permission-model
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam created an Azure key vault named **kv-fab-etl** that uses the Azure role-based access control permission model. You have the Owner role on the key vault.

    You need to create an Azure Key Vault-backed secret scope in an Azure Databricks workspace that references kv-fab-etl.

    What should you do first?
  fr: |
    Fabrikam a créé un coffre de clés Azure nommé **kv-fab-etl** qui utilise le modèle d'autorisation de contrôle d'accès en fonction du rôle Azure. Vous disposez du rôle Owner sur le coffre de clés.

    Vous devez créer, dans un espace de travail Azure Databricks, une étendue de secrets reposant sur Azure Key Vault qui référence kv-fab-etl.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable purge protection on kv-fab-etl.", fr: "Activer la protection contre le vidage sur kv-fab-etl." } }
    - { id: b, text: { en: "Create a Databricks-backed secret scope with the same name as the vault.", fr: "Créer une étendue de secrets reposant sur Databricks portant le nom du coffre." } }
    - { id: c, text: { en: "Change the permission model of kv-fab-etl to Vault access policy.", fr: "Changer le modèle d'autorisation de kv-fab-etl en Stratégie d'accès au coffre (Vault access policy)." } }
    - { id: d, text: { en: "Assign the Key Vault Secrets User role on kv-fab-etl to the Azure Databricks application.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-fab-etl à l'application Azure Databricks." } }
answer: { optionId: c }
explanation:
  correct:
    en: Azure Key Vault-backed secret scopes support only the Vault access policy permission model, not Azure RBAC. You switch the vault to Vault access policy, and creating the scope then grants the Get and List permissions to the Azure Databricks application through an access policy.
    fr: Les étendues de secrets reposant sur Azure Key Vault ne prennent en charge que le modèle d'autorisation Stratégie d'accès au coffre, pas Azure RBAC. Vous basculez le coffre sur ce modèle, puis la création de l'étendue accorde les autorisations Get et List à l'application Azure Databricks au moyen d'une stratégie d'accès.
  options:
    d: { en: "Azure RBAC is not supported by Key Vault-backed scopes, so a role assignment does not make scope creation possible.", fr: "Azure RBAC n'est pas pris en charge par les étendues reposant sur Azure Key Vault ; une attribution de rôle ne rend donc pas la création possible." }
    a: { en: "Purge protection protects deleted secrets; it is not a prerequisite for a secret scope.", fr: "La protection contre le vidage protège les secrets supprimés ; ce n'est pas un prérequis d'une étendue de secrets." }
    b: { en: "A Databricks-backed scope stores its own secrets and never references the key vault.", fr: "Une étendue reposant sur Databricks stocke ses propres secrets et ne référence jamais le coffre de clés." }
references:
  - title: Workspace secret scopes
    url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets/workspace-secret-scopes
