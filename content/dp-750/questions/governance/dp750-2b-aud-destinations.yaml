id: dp750-2b-aud-destinations
objective: "2.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has several Azure Databricks workspaces on the Premium plan in the same Azure region. The security team lists four audit requirements.

    Which option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose de plusieurs espaces de travail Azure Databricks avec le plan Premium dans la même région Azure. L'équipe de sécurité dresse la liste de quatre exigences d'audit.

    Quelle option devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: law, text: { en: "Log Analytics workspace (diagnostic setting)", fr: "Espace de travail Log Analytics (paramètre de diagnostic)" } }
    - { id: storage, text: { en: "Azure Storage account (diagnostic setting)", fr: "Compte Stockage Azure (paramètre de diagnostic)" } }
    - { id: eventhub, text: { en: "Azure Event Hubs (diagnostic setting)", fr: "Azure Event Hubs (paramètre de diagnostic)" } }
    - { id: systable, text: { en: "system.access.audit system table", fr: "Table système system.access.audit" } }
    - { id: ama, text: { en: "Azure Monitor Agent", fr: "Agent Azure Monitor" } }
  targets:
    - id: t1
      text: { en: "Run interactive KQL investigations on audit events.", fr: "Mener des investigations interactives en KQL sur les événements d'audit." }
    - id: t2
      text: { en: "Archive exported audit logs for seven years at the lowest cost.", fr: "Archiver les journaux d'audit exportés pendant sept ans au moindre coût." }
    - id: t3
      text: { en: "Stream audit events in real time to a third-party SIEM.", fr: "Diffuser en temps réel les événements d'audit vers un SIEM tiers." }
    - id: t4
      text: { en: "Query the audit events of all the workspaces with SQL in Azure Databricks, without exporting them.", fr: "Interroger en SQL dans Azure Databricks les événements d'audit de tous les espaces de travail, sans les exporter." }
answer:
  mapping: { t1: law, t2: storage, t3: eventhub, t4: systable }
explanation:
  correct:
    en: |
      A diagnostic setting can send the logs to Log Analytics for KQL analysis, to a storage account for low-cost long-term archiving, or to Event Hubs for real-time streaming to a SIEM. The system.access.audit table gives a SQL view of the events of all the workspaces in the region without moving data out of the platform.
    fr: |
      Un paramètre de diagnostic peut envoyer les journaux à Log Analytics pour une analyse en KQL, à un compte de stockage pour un archivage longue durée peu coûteux, ou à Event Hubs pour une diffusion en temps réel vers un SIEM. La table system.access.audit offre une vue SQL des événements de tous les espaces de travail de la région sans sortir les données de la plateforme.
  options:
    ama:
      en: |
        The Azure Monitor Agent collects data from virtual machines; it is not used to deliver Azure Databricks audit logs.
      fr: |
        L'agent Azure Monitor collecte des données sur des machines virtuelles ; il ne sert pas à remettre les journaux d'audit Azure Databricks.
references:
  - title: Configure audit logging
    url: https://learn.microsoft.com/en-us/training/modules/govern-unity-catalog-objects/6-configure-audit-logging
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
