id: dp750-2b-abac-statements
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses attribute-based access control (ABAC) in Unity Catalog. Governed tags classify the data of the **hr** catalog, and several row filter and column mask policies are attached to the catalog and to its schemas.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise le contrôle d'accès en fonction des attributs (ABAC) dans Unity Catalog. Des balises gouvernées classifient les données du catalogue **hr**, et plusieurs stratégies de filtre de lignes et de masque de colonne sont attachées au catalogue et à ses schémas.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A governed tag assigned to the hr.payroll schema is taken into account when a policy evaluates the tags of the tables in hr.payroll.
        fr: |
          Une balise gouvernée attribuée au schéma hr.payroll est prise en compte lorsqu'une stratégie évalue les balises des tables de hr.payroll.
    - id: s2
      text:
        en: |
          A governed tag assigned to the hr.payroll.salaries table is inherited by the columns of the table, so MATCH COLUMNS conditions match those columns.
        fr: |
          Une balise gouvernée attribuée à la table hr.payroll.salaries est héritée par les colonnes de la table, si bien que les conditions MATCH COLUMNS ciblent ces colonnes.
    - id: s3
      text:
        en: |
          When two policies with different masking functions apply to the same column for the same user, the user sees the column masked by the policy attached closest to the table.
        fr: |
          Lorsque deux stratégies avec des fonctions de masquage différentes s'appliquent à la même colonne pour le même utilisateur, celui-ci voit la colonne masquée par la stratégie attachée au plus près de la table.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Tags on a catalog or schema implicitly apply to the objects beneath it during policy evaluation, but tag inheritance stops at the table level and never reaches columns, so each column must be tagged directly. Only one distinct column mask can resolve for a given column and user; if two different masks apply, Azure Databricks blocks access and returns an error instead of choosing one.
    fr: |
      Les balises d'un catalogue ou d'un schéma s'appliquent implicitement aux objets qu'il contient lors de l'évaluation des stratégies, mais l'héritage des balises s'arrête au niveau de la table et n'atteint jamais les colonnes : chaque colonne doit être balisée directement. Un seul masque de colonne distinct peut s'appliquer à une colonne donnée pour un utilisateur ; si deux masques différents s'appliquent, Azure Databricks bloque l'accès et renvoie une erreur au lieu d'en choisir un.
references:
  - title: Apply tags to Unity Catalog securable objects
    url: https://learn.microsoft.com/en-us/azure/databricks/database-objects/tags
  - title: Requirements, quotas, and limitations for row filter and column mask policies
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/abac/requirements
