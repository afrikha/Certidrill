id: dp750-2a-mi-external-location-order
objective: "2.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Access Connector for Azure Databricks named **ac-fab** whose system-assigned managed identity already has the Storage Blob Data Contributor role on the Azure Data Lake Storage account **stfabcurated**. You are a metastore admin.

    Members of the account group **data-eng** must create Unity Catalog external tables under abfss://curated@stfabcurated.dfs.core.windows.net/sales. They already have USE CATALOG, USE SCHEMA and CREATE TABLE on the target schema.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un connecteur d'accès pour Azure Databricks nommé **ac-fab** dont l'identité managée affectée par le système dispose déjà du rôle Storage Blob Data Contributor sur le compte Azure Data Lake Storage **stfabcurated**. Vous êtes administrateur du metastore.

    Les membres du groupe de compte **data-eng** doivent créer des tables externes Unity Catalog sous abfss://curated@stfabcurated.dfs.core.windows.net/sales. Ils disposent déjà de USE CATALOG, USE SCHEMA et CREATE TABLE sur le schéma cible.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: grant, text: { en: "Grant CREATE EXTERNAL TABLE on the external location to data-eng.", fr: "Accorder CREATE EXTERNAL TABLE sur l'emplacement externe à data-eng." } }
    - { id: table, text: { en: "As a member of data-eng, create a table with a LOCATION clause under the sales path.", fr: "En tant que membre de data-eng, créer une table avec une clause LOCATION sous le chemin sales." } }
    - { id: service, text: { en: "Create a service credential that references the resource ID of ac-fab.", fr: "Créer des informations d'identification de service qui référencent l'ID de ressource d'ac-fab." } }
    - { id: mount, text: { en: "Mount the curated container to DBFS with dbutils.fs.mount().", fr: "Monter le conteneur curated dans DBFS avec dbutils.fs.mount()." } }
    - { id: secret, text: { en: "Store a client secret for the identity of ac-fab in a secret scope.", fr: "Stocker une clé secrète client pour l'identité d'ac-fab dans une étendue de secrets." } }
    - { id: cred, text: { en: "Create a storage credential of type Azure Managed Identity that references the resource ID of ac-fab.", fr: "Créer des informations d'identification de stockage de type Azure Managed Identity qui référencent l'ID de ressource d'ac-fab." } }
    - { id: loc, text: { en: "Create an external location for abfss://curated@stfabcurated.dfs.core.windows.net/sales that uses the storage credential.", fr: "Créer un emplacement externe pour abfss://curated@stfabcurated.dfs.core.windows.net/sales qui utilise les informations d'identification de stockage." } }
answer:
  sequence: [ cred, loc, grant, table ]
explanation:
  correct:
    en: The storage credential holds the managed identity of the access connector; an external location combines that credential with a storage path; CREATE EXTERNAL TABLE granted on the external location lets data-eng register external tables under that path, which they then do with a LOCATION clause.
    fr: "Les informations d'identification de stockage portent l'identité managée du connecteur d'accès ; un emplacement externe associe ces informations à un chemin de stockage ; CREATE EXTERNAL TABLE accordé sur l'emplacement externe permet à data-eng d'inscrire des tables externes sous ce chemin, ce qu'ils font ensuite avec une clause LOCATION."
  options:
    service: { en: "Service credentials govern access to external cloud services, not to storage used by external locations.", fr: "Les informations d'identification de service régissent l'accès aux services cloud externes, pas au stockage utilisé par les emplacements externes." }
    mount: { en: "Databricks no longer recommends mounts; Unity Catalog governs storage access with external locations.", fr: "Databricks ne recommande plus les montages ; Unity Catalog régit l'accès au stockage avec des emplacements externes." }
    secret: { en: "A managed identity has no client secret to store or rotate.", fr: "Une identité managée n'a pas de clé secrète client à stocker ni à renouveler." }
references:
  - title: Use Azure managed identities in Unity Catalog to access storage
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/azure-managed-identities
  - title: Connect to an Azure Data Lake Storage Gen2 (ADLS Gen2) external location
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/storage-credentials
