id: dp750-2a-ai-generated-comments
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware data stewards must document the columns of the Unity Catalog table **litware.sales.customers** quickly. A steward who has the MODIFY privilege on the table opens it in Catalog Explorer and clicks **AI generate** above the column headings.

    Which statement describes the result?
  fr: |
    Les responsables des données de Litware doivent documenter rapidement les colonnes de la table Unity Catalog **litware.sales.customers**. Un responsable qui dispose du privilège MODIFY sur la table l'ouvre dans l'Explorateur de catalogues et clique sur **AI generate** au-dessus des en-têtes de colonnes.

    Quelle affirmation décrit le résultat ?
body:
  options:
    - { id: a, text: { en: "The suggested comments are stored as table properties and are not visible in Catalog Explorer to other users.", fr: "Les commentaires suggérés sont stockés comme propriétés de table et ne sont pas visibles par les autres utilisateurs dans l'Explorateur de catalogues." } }
    - { id: b, text: { en: "A suggested comment is generated for each column, and each one is saved only after the steward accepts or edits it.", fr: "Un commentaire suggéré est généré pour chaque colonne, et chacun n'est enregistré qu'après acceptation ou modification par le responsable." } }
    - { id: c, text: { en: "Comments are generated and saved automatically for every table and column of the litware catalog.", fr: "Des commentaires sont générés et enregistrés automatiquement pour toutes les tables et colonnes du catalogue litware." } }
    - { id: d, text: { en: "The suggested comments also tag the columns that contain personal data, so they can be used for data classification.", fr: "Les commentaires suggérés balisent aussi les colonnes contenant des données personnelles ; ils peuvent donc servir à la classification des données." } }
answer: { optionId: b }
explanation:
  correct:
    en: AI-generated comments are suggestions from a large language model based on metadata such as the schema and column names. They are generated on request in Catalog Explorer, must be reviewed, and are saved only when the user accepts or edits them; saving requires ownership or MODIFY on a table.
    fr: Les commentaires générés par IA sont des suggestions d'un grand modèle de langage fondées sur des métadonnées comme le schéma et les noms de colonnes. Ils sont générés à la demande dans l'Explorateur de catalogues, doivent être relus, et ne sont enregistrés que lorsque l'utilisateur les accepte ou les modifie ; l'enregistrement exige la propriété ou MODIFY sur une table.
  options:
    c: { en: "There is no catalog-level toggle; comments are generated per object on request and never saved without review.", fr: "Il n'existe pas d'activation au niveau du catalogue ; les commentaires sont générés par objet à la demande et jamais enregistrés sans relecture." }
    d: { en: "Microsoft Learn states that the model should not be relied on for data classification tasks such as detecting PII columns.", fr: "Microsoft Learn indique qu'il ne faut pas se fier au modèle pour des tâches de classification comme la détection des colonnes de données personnelles." }
    a: { en: "Accepted suggestions become regular comments, visible to users who have BROWSE on the catalog or other privileges on the table.", fr: "Les suggestions acceptées deviennent des commentaires ordinaires, visibles par les utilisateurs qui disposent de BROWSE sur le catalogue ou d'autres privilèges sur la table." }
references:
  - title: Add AI-generated comments to Unity Catalog objects
    url: https://learn.microsoft.com/en-us/azure/databricks/comments/ai-comments
