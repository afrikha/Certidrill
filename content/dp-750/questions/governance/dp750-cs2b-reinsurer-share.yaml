id: dp750-cs2b-reinsurer-share
objective: "2.2.7"
type: single
caseStudy: dp750-cs2b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to give Proseware Re access to the ceded claims. The solution must meet the data access requirements.

    What should you do?
  fr: |
    Vous devez donner à Proseware Re l'accès aux sinistres cédés. La solution doit respecter les exigences d'accès aux données.

    Que devez-vous faire ?
body:
  options:
    - { id: token, text: { en: "Create an open sharing recipient that uses a bearer token, and add ceded_claims to a share with a PARTITION clause for treaty years 2025 and 2026", fr: "Créer un destinataire de partage ouvert qui utilise un jeton du porteur, et ajouter ceded_claims à un partage avec une clause PARTITION pour les exercices de traité 2025 et 2026" } }
    - { id: schema, text: { en: "Create a recipient from the sharing identifier of the Proseware Re metastore, and add the schema claims_prod.gold to a share", fr: "Créer un destinataire à partir de l'identifiant de partage du metastore de Proseware Re, et ajouter le schéma claims_prod.gold à un partage" } }
    - { id: d2d, text: { en: "Create a recipient from the sharing identifier of the Proseware Re metastore, and add ceded_claims to a share with a PARTITION clause for treaty years 2025 and 2026", fr: "Créer un destinataire à partir de l'identifiant de partage du metastore de Proseware Re, et ajouter ceded_claims à un partage avec une clause PARTITION pour les exercices de traité 2025 et 2026" } }
    - { id: extloc, text: { en: "Create an external location on the storage path of ceded_claims, and grant READ FILES on it to a service principal of Proseware Re", fr: "Créer un emplacement externe sur le chemin de stockage de ceded_claims, et accorder READ FILES dessus à un principal de service de Proseware Re" } }
answer: { optionId: d2d }
explanation:
  correct:
    en: Proseware Re has a Unity Catalog metastore, so Databricks-to-Databricks sharing applies; the recipient is created from its sharing identifier and needs no token, so no credential is exchanged or rotated. Adding the partitioned table with `PARTITION (treaty_year = ...)` clauses limits the share to the 2025 and 2026 treaty years.
    fr: "Proseware Re dispose d'un metastore Unity Catalog ; le partage Databricks-à-Databricks s'applique donc. Le destinataire est créé à partir de son identifiant de partage et n'a besoin d'aucun jeton : aucune information d'identification n'est échangée ni renouvelée. Ajouter la table partitionnée avec des clauses `PARTITION (treaty_year = ...)` limite le partage aux exercices de traité 2025 et 2026."
  options:
    token:
      en: Open sharing with a bearer token issues a long-lived token that must be sent to Proseware Re and rotated.
      fr: Le partage ouvert avec un jeton du porteur émet un jeton de longue durée qui doit être transmis à Proseware Re et renouvelé.
    schema:
      en: Sharing the whole gold schema exposes every gold table and every treaty year.
      fr: Partager tout le schéma gold expose chaque table gold et chaque exercice de traité.
    extloc:
      en: External locations govern access to cloud storage for principals of your own account; they do not share data with another Azure Databricks account and cannot restrict files by treaty year.
      fr: Les emplacements externes régissent l'accès au stockage cloud pour les principaux de votre propre compte ; ils ne partagent pas de données avec un autre compte Azure Databricks et ne peuvent pas restreindre les fichiers par exercice de traité.
references:
  - title: Create data recipients for OpenSharing (Databricks-to-Databricks sharing)
    url: https://learn.microsoft.com/en-us/azure/databricks/delta-sharing/create-recipient
  - title: Create shares for OpenSharing
    url: https://learn.microsoft.com/en-us/azure/databricks/delta-sharing/create-share
