id: dp750-2a-sp-concepts-yn
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware is automating data access with service principals in Azure Databricks. Some service principals are managed by Azure Databricks, and others are managed by Microsoft Entra ID.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware automatise l'accès aux données avec des principaux de service dans Azure Databricks. Certains principaux de service sont managés par Azure Databricks, d'autres par Microsoft Entra ID.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A service principal managed by Azure Databricks can authenticate with Databricks OAuth.
        fr: Un principal de service managé par Azure Databricks peut s'authentifier avec OAuth Databricks.
    - id: s2
      text:
        en: An access token obtained with OAuth M2M for a service principal is valid for 24 hours.
        fr: Un jeton d'accès obtenu avec OAuth M2M pour un principal de service est valide 24 heures.
    - id: s3
      text:
        en: An OAuth secret generated for a service principal can be valid for up to two years.
        fr: Une clé secrète OAuth générée pour un principal de service peut être valide jusqu'à deux ans.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Azure Databricks managed service principals authenticate with Databricks OAuth or personal access tokens, and Microsoft Entra ID managed ones with Databricks OAuth or Microsoft Entra ID tokens. Each OAuth access token is valid for one hour and is refreshed automatically by unified client authentication. An OAuth secret lifetime can be set up to 730 days, and a service principal can have up to five OAuth secrets.
    fr: Les principaux de service managés par Azure Databricks s'authentifient avec OAuth Databricks ou des jetons d'accès personnels, et ceux managés par Microsoft Entra ID avec OAuth Databricks ou des jetons Microsoft Entra ID. Chaque jeton d'accès OAuth est valide une heure et est actualisé automatiquement par l'authentification client unifiée. La durée de vie d'une clé secrète OAuth peut aller jusqu'à 730 jours, et un principal de service peut avoir jusqu'à cinq clés secrètes OAuth.
references:
  - title: Service principals
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/users-groups/service-principals
  - title: Authorize service principal access to Azure Databricks with OAuth
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/auth/oauth-m2m
