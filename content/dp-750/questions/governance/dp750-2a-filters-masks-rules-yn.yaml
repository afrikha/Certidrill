id: dp750-2a-filters-masks-rules-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso protects the Unity Catalog table **contoso.hr.people** with a row filter named **hr_region_filter** and a column mask on the national_id column.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso protège la table Unity Catalog **contoso.hr.people** avec un filtre de lignes nommé **hr_region_filter** et un masque de colonne sur la colonne national_id.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add a second row filter to contoso.hr.people so that both filters are applied together.
        fr: Vous pouvez ajouter un second filtre de lignes à contoso.hr.people pour que les deux filtres s'appliquent ensemble.
    - id: s2
      text:
        en: The mask function on national_id must return a value of the column's type or of a type that can be cast to it.
        fr: La fonction de masque sur national_id doit renvoyer une valeur du type de la colonne ou d'un type convertible en ce type.
    - id: s3
      text:
        en: If you run CREATE OR REPLACE TABLE contoso.hr.people with the same column names and without redefining the filter or the mask, both are retained.
        fr: Si vous exécutez CREATE OR REPLACE TABLE contoso.hr.people avec les mêmes noms de colonnes et sans redéfinir le filtre ni le masque, les deux sont conservés.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: A table can have only one row filter; to combine conditions, you put them in a single filter function. A mask function receives the column value and must return the same type or a type castable to it. REPLACE preserves the table history, granted privileges, row filters and column masks (masks are kept when the new table has columns with the same names).
    fr: Une table ne peut avoir qu'un seul filtre de lignes ; pour combiner des conditions, vous les placez dans une seule fonction de filtre. Une fonction de masque reçoit la valeur de la colonne et doit renvoyer le même type ou un type convertible. REPLACE conserve l'historique de la table, les privilèges accordés, les filtres de lignes et les masques de colonne (les masques sont conservés lorsque la nouvelle table a des colonnes de mêmes noms).
references:
  - title: Manually apply row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/manually-apply
  - title: CREATE TABLE [USING]
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-table-using
