id: dp750-2a-secret-acl-mapping
objective: "2.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Databricks workspace on the Premium plan with two secret scopes: **kv-fin**, which is Azure Key Vault-backed, and **dbx-etl**, which is Databricks-backed.

    You need to set secret ACLs for four groups. The solution must follow the principle of least privilege.

    Which permission should you assign to each group? To answer, drag the appropriate permissions to the correct groups. Each permission may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail Azure Databricks avec le plan Premium et deux étendues de secrets : **kv-fin**, qui repose sur Azure Key Vault, et **dbx-etl**, qui repose sur Databricks.

    Vous devez définir les ACL de secret de quatre groupes. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous affecter à chaque groupe ? Pour répondre, faites glisser les autorisations appropriées vers les groupes correspondants. Chaque autorisation peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: write, text: WRITE }
    - { id: manage, text: MANAGE }
    - { id: canmanage, text: CAN MANAGE }
    - { id: attach, text: CAN ATTACH TO }
    - { id: read, text: READ }
  targets:
    - id: analysts
      text: { en: "analysts: read the secrets of kv-fin from notebooks", fr: "analysts : lire les secrets de kv-fin depuis des notebooks" }
    - id: lead
      text: { en: "platform-leads: grant other groups access to kv-fin", fr: "platform-leads : accorder à d'autres groupes l'accès à kv-fin" }
    - id: etl
      text: { en: "etl-team: add and update secrets in dbx-etl, without changing its permissions", fr: "etl-team : ajouter et mettre à jour des secrets dans dbx-etl, sans modifier ses autorisations" }
    - id: audit
      text: { en: "auditors: list the secret names in dbx-etl", fr: "auditors : lister les noms des secrets de dbx-etl" }
answer:
  mapping: { analysts: read, lead: manage, etl: write, audit: read }
explanation:
  correct:
    en: READ lets a principal read the scope and list its secrets. WRITE adds the ability to write to the scope, which only makes sense for a Databricks-backed scope. MANAGE adds the ability to modify the permissions of the scope.
    fr: READ permet à un principal de lire l'étendue et de lister ses secrets. WRITE ajoute la possibilité d'écrire dans l'étendue, ce qui n'a de sens que pour une étendue reposant sur Databricks. MANAGE ajoute la possibilité de modifier les autorisations de l'étendue.
  options:
    canmanage: { en: "CAN MANAGE is a permission level for objects such as compute or jobs, not a secret ACL.", fr: "CAN MANAGE est un niveau d'autorisation pour des objets comme le calcul ou les jobs, pas une ACL de secret." }
    attach: { en: "CAN ATTACH TO is a compute permission.", fr: "CAN ATTACH TO est une autorisation de calcul." }
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
  - title: Workspace secret scopes
    url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets/workspace-secret-scopes
