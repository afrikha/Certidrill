id: dp750-2b-aud-events-hotarea
objective: "2.2.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You investigate activity on the table **finance.core.ledger** at Tailspin. A query on **system.access.audit** returns the events shown in the following table. Verbose audit logs are enabled in the workspace.

    Answer each prompt by selecting the action name of the event that records the activity.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez l'activité sur la table **finance.core.ledger** chez Tailspin. Une requête sur **system.access.audit** renvoie les événements du tableau suivant. Les journaux d'audit détaillés sont activés dans l'espace de travail.

    Répondez à chaque consigne en sélectionnant le nom d'action de l'événement qui enregistre l'activité.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A user changed the privileges on finance.core.ledger.", fr: "Un utilisateur a modifié les privilèges sur finance.core.ledger." }
    - id: p2
      text: { en: "An administrator turned on verbose audit logs.", fr: "Un administrateur a activé les journaux d'audit détaillés." }
  grid:
    header: [service_name, action_name, user_identity.email, { en: "request_params (excerpt)", fr: "request_params (extrait)" }]
    rows:
      - [{ text: unityCatalog }, { text: getTable, area: e1 }, { text: ana@tailspin.com }, { text: "full_name_arg: finance.core.ledger" }]
      - [{ text: unityCatalog }, { text: updatePermissions, area: e2 }, { text: ben@tailspin.com }, { text: "securable_full_name: finance.core.ledger" }]
      - [{ text: notebook }, { text: runCommand, area: e3 }, { text: ana@tailspin.com }, { text: "commandText: SELECT * FROM finance.core.ledger" }]
      - [{ text: workspace }, { text: workspaceConfKeys, area: e4 }, { text: admin@tailspin.com }, { text: "workspaceConfKeys: enableVerboseAuditLogs, workspaceConfValues: true" }]
      - [{ text: unityCatalog }, { text: createTable, area: e5 }, { text: carl@tailspin.com }, { text: "full_name_arg: finance.core.ledger_backup" }]
answer:
  values: { p1: e2, p2: e4 }
explanation:
  correct:
    en: |
      Privilege changes on Unity Catalog objects are logged by the unityCatalog service as updatePermissions events. Turning verbose audit logs on or off emits a workspace event with the action workspaceConfKeys, the request parameter enableVerboseAuditLogs and the value true or false.
    fr: |
      Les modifications de privilèges sur les objets Unity Catalog sont journalisées par le service unityCatalog sous forme d'événements updatePermissions. L'activation ou la désactivation des journaux d'audit détaillés émet un événement du service workspace avec l'action workspaceConfKeys, le paramètre de requête enableVerboseAuditLogs et la valeur true ou false.
references:
  - title: Enable verbose audit logs
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/verbose-logs
  - title: Configure audit logging
    url: https://learn.microsoft.com/en-us/training/modules/govern-unity-catalog-objects/6-configure-audit-logging
