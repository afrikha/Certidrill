id: dp750-2b-rfcm-dedicated-runtime
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a table named **finance.core.invoices**. A column mask is set on its **tax_id** column with ALTER TABLE … ALTER COLUMN … SET MASK.

    A nightly job reads the table from a classic cluster in dedicated access mode that runs Databricks Runtime 14.3 LTS. Since the mask was added, the read fails. The workspace is enabled for serverless compute. The job must keep using dedicated access mode.

    You need the job to read the table, with the mask applied.

    What should you do?
  fr: |
    Litware dispose d'une table nommée **finance.core.invoices**. Un masque de colonne est défini sur sa colonne **tax_id** avec ALTER TABLE … ALTER COLUMN … SET MASK.

    Un job nocturne lit la table depuis un cluster classique en mode d'accès dédié qui exécute Databricks Runtime 14.3 LTS. Depuis l'ajout du masque, la lecture échoue. L'espace de travail est activé pour le calcul serverless. Le job doit continuer à utiliser le mode d'accès dédié.

    Vous devez faire en sorte que le job lise la table, avec le masque appliqué.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable Photon acceleration on the cluster.", fr: "Activer l'accélération Photon sur le cluster." }
    - id: b
      text: { en: "Switch the cluster to Databricks Runtime 14.3 LTS ML.", fr: "Passer le cluster à Databricks Runtime 14.3 LTS ML." }
    - id: c
      text: { en: "Enable autoscaling on the cluster.", fr: "Activer la mise à l'échelle automatique sur le cluster." }
    - id: d
      text: { en: "Upgrade the cluster to Databricks Runtime 15.4 LTS or above.", fr: "Mettre à niveau le cluster vers Databricks Runtime 15.4 LTS ou une version ultérieure." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Dedicated compute on Databricks Runtime 15.3 and below cannot read tables that have row filters or column masks. From Databricks Runtime 15.4 LTS, dedicated compute can read them when the workspace is enabled for serverless compute, because the filtering is performed by serverless fine-grained access control.
    fr: |
      Le calcul dédié sous Databricks Runtime 15.3 et versions antérieures ne peut pas lire les tables qui ont des filtres de lignes ou des masques de colonne. À partir de Databricks Runtime 15.4 LTS, le calcul dédié peut les lire si l'espace de travail est activé pour le calcul serverless, car le filtrage est effectué par le contrôle d'accès affiné serverless.
  options:
    a:
      en: |
        Photon accelerates query execution but does not add support for filtered tables on an older runtime.
      fr: |
        Photon accélère l'exécution des requêtes mais n'ajoute pas la prise en charge des tables filtrées sur un runtime ancien.
    b:
      en: |
        The ML variant of 14.3 LTS has the same limitation as the standard 14.3 LTS runtime.
      fr: |
        La variante ML de 14.3 LTS présente la même limitation que le runtime 14.3 LTS standard.
    c:
      en: |
        Autoscaling changes the number of workers, not the ability of the runtime to read masked tables.
      fr: |
        La mise à l'échelle automatique change le nombre de workers, pas la capacité du runtime à lire les tables masquées.
references:
  - title: Manually apply row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/manually-apply
  - title: Row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/
