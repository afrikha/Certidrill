id: dp750-2b-lin-browse
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data steward at Fabrikam opens the lineage graph of **retail.silver.orders** in Catalog Explorer. Several downstream tables of the **retail** catalog appear as masked nodes, and the steward cannot expand the graph past them.

    You need the steward to explore the lineage of every table in the retail catalog. The steward must not be able to read table data. The solution must follow the principle of least privilege.

    Which privilege should you grant to the steward on the retail catalog?
  fr: |
    Un gestionnaire de données de Fabrikam ouvre le graphe de lignée de **retail.silver.orders** dans l'Explorateur de catalogue. Plusieurs tables en aval du catalogue **retail** apparaissent comme des nœuds masqués, et le gestionnaire ne peut pas développer le graphe au-delà.

    Vous devez permettre au gestionnaire d'explorer la lignée de toutes les tables du catalogue retail. Le gestionnaire ne doit pas pouvoir lire les données des tables. La solution doit respecter le principe du moindre privilège.

    Quel privilège devez-vous accorder au gestionnaire sur le catalogue retail ?
body:
  options:
    - { id: a, text: SELECT }
    - { id: b, text: USE CATALOG }
    - { id: c, text: BROWSE }
    - { id: d, text: MANAGE }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Users need at least BROWSE (or SELECT) on an object to explore its lineage; objects without it appear as masked nodes. BROWSE on the catalog lets the steward see the metadata and lineage of every object in it without reading any data.
    fr: |
      Les utilisateurs ont besoin au moins de BROWSE (ou de SELECT) sur un objet pour explorer sa lignée ; les objets sans ce privilège apparaissent comme des nœuds masqués. BROWSE sur le catalogue permet au gestionnaire de voir les métadonnées et la lignée de tous ses objets sans lire aucune donnée.
  options:
    a:
      en: |
        SELECT would also reveal lineage, but it lets the steward read the table data.
      fr: |
        SELECT révélerait aussi la lignée, mais permettrait au gestionnaire de lire les données des tables.
    b:
      en: |
        USE CATALOG only lets a principal traverse the catalog; it does not make its tables visible in lineage.
      fr: |
        USE CATALOG permet seulement de parcourir le catalogue ; il ne rend pas ses tables visibles dans la lignée.
    d:
      en: |
        MANAGE lets the steward manage privileges on the catalog, which exceeds the need.
      fr: |
        MANAGE permet au gestionnaire de gérer les privilèges du catalogue, ce qui dépasse le besoin.
references:
  - title: Lineage in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/data-lineage
