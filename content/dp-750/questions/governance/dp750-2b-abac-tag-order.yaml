id: dp750-2b-abac-tag-order
objective: "2.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You are an account admin at Proseware. You plan to classify personal data in Unity Catalog so that ABAC policies can target it later.

    The classification must use a tag named `pii` whose only allowed values are `ssn`, `email` and `phone`. Members of the **data_stewards** group will tag the columns themselves. The group already has the APPLY TAG, USE CATALOG and USE SCHEMA privileges on the **prod** catalog.

    Which three actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous êtes administrateur de compte chez Proseware. Vous prévoyez de classifier les données personnelles dans Unity Catalog afin que des stratégies ABAC puissent les cibler ultérieurement.

    La classification doit utiliser une balise nommée `pii` dont les seules valeurs autorisées sont `ssn`, `email` et `phone`. Les membres du groupe **data_stewards** baliseront eux-mêmes les colonnes. Le groupe dispose déjà des privilèges APPLY TAG, USE CATALOG et USE SCHEMA sur le catalogue **prod**.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a governed tag with the key pii and the allowed values ssn, email and phone.", fr: "Créer une balise gouvernée avec la clé pii et les valeurs autorisées ssn, email et phone." } }
    - { id: assign, text: { en: "Grant the ASSIGN permission on the pii governed tag to data_stewards.", fr: "Accorder l'autorisation ASSIGN sur la balise gouvernée pii à data_stewards." } }
    - { id: settag, text: { en: "As a data steward, run ALTER TABLE … ALTER COLUMN … SET TAGS ('pii' = 'ssn') on each column.", fr: "En tant que gestionnaire de données, exécuter ALTER TABLE … ALTER COLUMN … SET TAGS ('pii' = 'ssn') sur chaque colonne." } }
    - { id: createperm, text: { en: "Grant the CREATE permission on governed tags to data_stewards.", fr: "Accorder l'autorisation CREATE sur les balises gouvernées à data_stewards." } }
    - { id: modify, text: { en: "Grant the MODIFY privilege on the prod catalog to data_stewards.", fr: "Accorder le privilège MODIFY sur le catalogue prod à data_stewards." } }
    - { id: tagtable, text: { en: "Tag each table with pii = ssn so that its columns inherit the tag.", fr: "Baliser chaque table avec pii = ssn pour que ses colonnes héritent de la balise." } }
answer:
  sequence: [ create, assign, settag ]
explanation:
  correct:
    en: |
      A governed tag defined at the account level enforces the allowed values, and the permission to assign it can only be granted once the tag exists. Stewards then need ASSIGN on the tag in addition to APPLY TAG on the objects, and they tag each column directly.
    fr: |
      Une balise gouvernée définie au niveau du compte impose les valeurs autorisées, et l'autorisation de l'attribuer ne peut être accordée qu'une fois la balise créée. Les gestionnaires ont ensuite besoin d'ASSIGN sur la balise en plus d'APPLY TAG sur les objets, et ils balisent chaque colonne directement.
  options:
    createperm: { en: "The stewards assign an existing tag; letting them create governed tags exceeds what they need.", fr: "Les gestionnaires attribuent une balise existante ; leur permettre de créer des balises gouvernées dépasse leurs besoins." }
    modify: { en: "MODIFY controls changes to table data, not tag assignment.", fr: "MODIFY contrôle la modification des données des tables, pas l'attribution des balises." }
    tagtable: { en: "Tags do not inherit down to the column level, so table tags are never matched by MATCH COLUMNS.", fr: "Les balises ne sont pas héritées au niveau des colonnes : les balises de table ne sont jamais ciblées par MATCH COLUMNS." }
references:
  - title: Manage permissions on governed tags
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/governed-tags/manage-permissions
  - title: Governed tags
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/governed-tags/
