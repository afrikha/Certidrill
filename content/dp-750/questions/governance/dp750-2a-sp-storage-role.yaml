id: dp750-2a-sp-storage-role
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses a Microsoft Entra ID service principal named **sp-ingest** to authenticate notebooks that read and write files in the Azure Data Lake Storage account **stcontosoraw** by using OAuth 2.0.

    You need to assign an Azure role on stcontosoraw to sp-ingest. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Contoso utilise un principal de service Microsoft Entra ID nommé **sp-ingest** pour authentifier des notebooks qui lisent et écrivent des fichiers dans le compte Azure Data Lake Storage **stcontosoraw** avec OAuth 2.0.

    Vous devez attribuer un rôle Azure sur stcontosoraw à sp-ingest. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Contributor }
    - { id: b, text: Storage Blob Data Contributor }
    - { id: c, text: Storage Blob Data Reader }
    - { id: d, text: Storage Account Contributor }
answer: { optionId: b }
explanation:
  correct:
    en: Storage Blob Data Contributor grants read, write and delete access to blob data, which is the data-plane access the notebooks need. Microsoft Learn assigns this role to the service principal on the storage account.
    fr: Storage Blob Data Contributor accorde l'accès en lecture, écriture et suppression aux données blob, c'est-à-dire l'accès au plan de données dont les notebooks ont besoin. Microsoft Learn attribue ce rôle au principal de service sur le compte de stockage.
  options:
    c: { en: "Storage Blob Data Reader grants read access only; the notebooks also write files.", fr: "Storage Blob Data Reader n'accorde que la lecture ; les notebooks écrivent aussi des fichiers." }
    d: { en: "Storage Account Contributor manages the storage account resource, not access to blob data with OAuth.", fr: "Storage Account Contributor gère la ressource compte de stockage, pas l'accès aux données blob avec OAuth." }
    a: { en: "Contributor is a management-plane role that grants far more than data access.", fr: "Contributor est un rôle du plan de gestion qui accorde bien plus que l'accès aux données." }
references:
  - title: Connect to Azure Data Lake Storage and Blob Storage
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/storage/azure-storage
