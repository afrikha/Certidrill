id: dp750-2b-ret-vacuum-code
objective: "2.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Delta table named **sales.core.transactions**. Before the team changes its maintenance schedule, you must list the unreferenced data files older than the retention threshold that the next cleanup would permanently remove. No file must be deleted.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une table Delta nommée **sales.core.transactions**. Avant que l'équipe modifie sa planification de maintenance, vous devez lister les fichiers de données non référencés plus anciens que le seuil de rétention que le prochain nettoyage supprimerait définitivement. Aucun fichier ne doit être supprimé.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    [[cmd]] sales.core.transactions [[opt]];
  slots:
    - id: cmd
      options:
        - { id: optimize, text: OPTIMIZE }
        - { id: vacuum, text: VACUUM }
        - { id: reorg, text: REORG TABLE }
        - { id: restore, text: RESTORE TABLE }
    - id: opt
      options:
        - { id: lite, text: LITE }
        - { id: full, text: FULL }
        - { id: retain0, text: RETAIN 0 HOURS }
        - { id: dryrun, text: DRY RUN }
answer:
  values: { cmd: vacuum, opt: dryrun }
explanation:
  correct:
    en: |
      VACUUM removes data files that the table no longer references and that are older than the retention threshold. With DRY RUN, it only returns the list of files that would be deleted (up to 1,000) and deletes nothing.
    fr: |
      VACUUM supprime les fichiers de données que la table ne référence plus et qui sont plus anciens que le seuil de rétention. Avec DRY RUN, il renvoie seulement la liste des fichiers qui seraient supprimés (jusqu'à 1 000) et ne supprime rien.
  options:
    optimize: { en: "OPTIMIZE compacts data files; it does not report files eligible for deletion.", fr: "OPTIMIZE compacte les fichiers de données ; il ne signale pas les fichiers pouvant être supprimés." }
    lite: { en: "LITE changes how VACUUM finds the files (from the transaction log) but still deletes them.", fr: "LITE change la façon dont VACUUM trouve les fichiers (à partir du journal des transactions), mais les supprime quand même." }
    full: { en: "FULL is the default mode and deletes the files.", fr: "FULL est le mode par défaut et supprime les fichiers." }
    retain0: { en: "A zero retention would delete every unreferenced file, and the safety check blocks it by default.", fr: "Une rétention nulle supprimerait tous les fichiers non référencés, et le contrôle de sécurité la bloque par défaut." }
references:
  - title: Remove unused data files with vacuum
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/vacuum
  - title: VACUUM
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-vacuum
