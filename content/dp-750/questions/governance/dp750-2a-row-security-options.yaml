id: dp750-2a-row-security-options
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Unity Catalog table named **adatum.retail.transactions** that contains a column named store_country. Members of the account group **analysts-de** query data from a SQL warehouse.

    When members of analysts-de query the data, they must see only the rows where store_country is DE. All columns must remain visible, and the access of other users must not change.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une table Unity Catalog nommée **adatum.retail.transactions** qui contient une colonne nommée store_country. Les membres du groupe de compte **analysts-de** interrogent les données depuis un entrepôt SQL.

    Lorsque les membres d'analysts-de interrogent les données, ils ne doivent voir que les lignes où store_country vaut DE. Toutes les colonnes doivent rester visibles, et l'accès des autres utilisateurs ne doit pas changer.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign to the store_country column a mask function that returns NULL for members of analysts-de when the value is not DE.", fr: "Affecter à la colonne store_country une fonction de masque qui renvoie NULL pour les membres d'analysts-de lorsque la valeur n'est pas DE." } }
    - { id: b, text: { en: "Partition the table by store_country and grant analysts-de SELECT on the DE partition.", fr: "Partitionner la table par store_country et accorder à analysts-de SELECT sur la partition DE." } }
    - { id: c, text: { en: "Add the store_country = 'DE' condition to the GRANT SELECT statement that targets analysts-de.", fr: "Ajouter la condition store_country = 'DE' à l'instruction GRANT SELECT qui cible analysts-de." } }
    - { id: d, text: { en: "Assign to the table a row filter function that returns store_country = 'DE' for members of analysts-de and TRUE for other users.", fr: "Affecter à la table une fonction de filtre de lignes qui renvoie store_country = 'DE' pour les membres d'analysts-de et TRUE pour les autres utilisateurs." } }
    - { id: e, text: { en: "Create a view that filters rows with is_account_group_member('analysts-de') in its WHERE clause, and grant analysts-de SELECT on the view instead of the table.", fr: "Créer une vue qui filtre les lignes avec is_account_group_member('analysts-de') dans sa clause WHERE, et accorder à analysts-de SELECT sur la vue au lieu de la table." } }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: A row filter is a SQL function evaluated for each row at query time on the table itself; rows for which it returns FALSE are excluded, and returning TRUE for other users leaves them unaffected. A dynamic view achieves the same result when the group reads the view instead of the table, because the WHERE clause can test the current user's account group membership.
    fr: Un filtre de lignes est une fonction SQL évaluée pour chaque ligne au moment de la requête sur la table elle-même ; les lignes pour lesquelles elle renvoie FALSE sont exclues, et renvoyer TRUE pour les autres utilisateurs les laisse inchangés. Une vue dynamique obtient le même résultat lorsque le groupe lit la vue au lieu de la table, car la clause WHERE peut tester l'appartenance de l'utilisateur actuel à un groupe de compte.
  options:
    a: { en: "A column mask changes the values returned for a column; the rows remain visible.", fr: "Un masque de colonne change les valeurs renvoyées pour une colonne ; les lignes restent visibles." }
    b: { en: "Unity Catalog privileges apply to securable objects such as tables, not to partitions.", fr: "Les privilèges Unity Catalog s'appliquent à des objets sécurisables comme les tables, pas aux partitions." }
    c: { en: "GRANT has no WHERE condition; row-level logic is implemented with row filters or views.", fr: "GRANT n'a pas de condition WHERE ; la logique au niveau des lignes s'implémente avec des filtres de lignes ou des vues." }
references:
  - title: Manually apply row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/manually-apply
  - title: Create a dynamic view
    url: https://learn.microsoft.com/en-us/azure/databricks/views/dynamic
