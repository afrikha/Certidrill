id: dp750-2b-lin-tabs
objective: "2.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage the Unity Catalog table **retail.gold.store_sales** at Northwind by using Catalog Explorer. You must perform four tasks.

    Which tab of the table should you use for each task? To answer, drag the appropriate tabs to the correct tasks. Each tab may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez la table Unity Catalog **retail.gold.store_sales** de Northwind avec l'Explorateur de catalogue. Vous devez effectuer quatre tâches.

    Quel onglet de la table devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les onglets appropriés vers les tâches correspondantes. Chaque onglet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: overview, text: Overview }
    - { id: sample, text: Sample Data }
    - { id: details, text: Details }
    - { id: history, text: History }
    - { id: lineage, text: Lineage }
  targets:
    - id: t1
      text: { en: "Transfer the ownership of the table to the retail_engineering group.", fr: "Transférer la propriété de la table au groupe retail_engineering." }
    - id: t2
      text: { en: "Identify the operation and the user that produced version 42 of the table.", fr: "Identifier l'opération et l'utilisateur à l'origine de la version 42 de la table." }
    - id: t3
      text: { en: "Find the dashboards that query the table.", fr: "Trouver les tableaux de bord qui interrogent la table." }
    - id: t4
      text: { en: "Check the value of the delta.deletedFileRetentionDuration table property.", fr: "Vérifier la valeur de la propriété de table delta.deletedFileRetentionDuration." }
answer:
  mapping: { t1: overview, t2: history, t3: lineage, t4: details }
explanation:
  correct:
    en: |
      The Overview tab shows the owner, with an edit icon to transfer ownership. The History tab lists each version of a Delta table with its timestamp, operation and user. The Lineage tab shows related tables, jobs and dashboards. The Details tab shows table details, including the table properties.
    fr: |
      L'onglet Overview affiche le propriétaire, avec une icône de modification pour transférer la propriété. L'onglet History liste chaque version d'une table Delta avec son horodatage, son opération et son utilisateur. L'onglet Lineage affiche les tables, jobs et tableaux de bord associés. L'onglet Details affiche les détails de la table, dont ses propriétés.
  options:
    sample:
      en: |
        Sample Data shows sample rows of the table and requires active compute; it does not show ownership, history, lineage or properties.
      fr: |
        Sample Data affiche des exemples de lignes de la table et nécessite un calcul actif ; il n'affiche ni la propriété, ni l'historique, ni la lignée, ni les propriétés.
references:
  - title: Set up and manage data lineage
    url: https://learn.microsoft.com/en-us/training/modules/govern-unity-catalog-objects/5-manage-data-lineage-tracking
  - title: Lineage in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/data-lineage
