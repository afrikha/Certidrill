id: dp750-2b-abac-tag-permissions
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An account admin at Fabrikam created a governed tag named `sensitivity` with the allowed values `low`, `medium` and `high`. A data steward named Steward1 has the USE CATALOG privilege on the **finance** catalog and the USE SCHEMA privilege on the **finance.ledger** schema. Steward1 does not own any object in the schema.

    Steward1 runs the following statement, which fails:

    ```sql
    ALTER TABLE finance.ledger.entries SET TAGS ('sensitivity' = 'high');
    ```

    You need to ensure that Steward1 can run the statement. The solution must follow the principle of least privilege.

    Which two permissions should you grant to Steward1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur de compte de Fabrikam a créé une balise gouvernée nommée `sensitivity` avec les valeurs autorisées `low`, `medium` et `high`. Un gestionnaire de données nommé Steward1 dispose du privilège USE CATALOG sur le catalogue **finance** et du privilège USE SCHEMA sur le schéma **finance.ledger**. Steward1 n'est propriétaire d'aucun objet du schéma.

    Steward1 exécute l'instruction suivante, qui échoue :

    ```sql
    ALTER TABLE finance.ledger.entries SET TAGS ('sensitivity' = 'high');
    ```

    Vous devez faire en sorte que Steward1 puisse exécuter l'instruction. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux autorisations à accorder à Steward1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The MODIFY privilege on finance.ledger.entries", fr: "Le privilège MODIFY sur finance.ledger.entries" } }
    - { id: b, text: { en: "The APPLY TAG privilege on finance.ledger.entries", fr: "Le privilège APPLY TAG sur finance.ledger.entries" } }
    - { id: c, text: { en: "The CREATE permission on governed tags at the account level", fr: "L'autorisation CREATE sur les balises gouvernées au niveau du compte" } }
    - { id: d, text: { en: "The ASSIGN permission on the sensitivity governed tag", fr: "L'autorisation ASSIGN sur la balise gouvernée sensitivity" } }
    - { id: e, text: { en: "The SELECT privilege on finance.ledger.entries", fr: "Le privilège SELECT sur finance.ledger.entries" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      To tag a Unity Catalog object you need APPLY TAG on the object (plus USE CATALOG and USE SCHEMA, which Steward1 already has) unless you own it. Because sensitivity is a governed tag, its own permission model also applies, and only principals with the ASSIGN permission on the tag can assign it.
    fr: |
      Pour baliser un objet Unity Catalog, il faut APPLY TAG sur l'objet (ainsi que USE CATALOG et USE SCHEMA, dont Steward1 dispose déjà), sauf si vous en êtes propriétaire. Comme sensitivity est une balise gouvernée, son propre modèle d'autorisations s'applique aussi, et seuls les principaux disposant de l'autorisation ASSIGN sur la balise peuvent l'attribuer.
  options:
    a:
      en: |
        MODIFY allows adding, updating and deleting data in the table; it is not the privilege that controls tagging.
      fr: |
        MODIFY permet d'ajouter, de modifier et de supprimer des données dans la table ; ce n'est pas le privilège qui contrôle le balisage.
    c:
      en: |
        CREATE lets a principal create new governed tags; Steward1 only needs to assign an existing one.
      fr: |
        CREATE permet de créer de nouvelles balises gouvernées ; Steward1 doit seulement attribuer une balise existante.
    e:
      en: |
        SELECT allows reading the table data, which is neither required nor sufficient to set tags.
      fr: |
        SELECT permet de lire les données de la table, ce qui n'est ni nécessaire ni suffisant pour définir des balises.
references:
  - title: Manage permissions on governed tags
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/governed-tags/manage-permissions
  - title: Apply tags to Unity Catalog securable objects
    url: https://learn.microsoft.com/en-us/azure/databricks/database-objects/tags
