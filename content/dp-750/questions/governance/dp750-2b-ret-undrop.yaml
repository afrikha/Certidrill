id: dp750-2b-ret-undrop
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Two days ago, an engineer at Northwind accidentally dropped a Unity Catalog managed table named **sales.core.orders**. No table with that name has been created since.

    You need to recover the table together with its privileges and table properties.

    Which statement should you run?
  fr: |
    Il y a deux jours, un ingénieur de Northwind a supprimé par erreur une table managée Unity Catalog nommée **sales.core.orders**. Aucune table portant ce nom n'a été créée depuis.

    Vous devez récupérer la table avec ses privilèges et ses propriétés de table.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - id: a
      text: "RESTORE TABLE sales.core.orders TO TIMESTAMP AS OF date_sub(current_date(), 3)"
    - id: b
      text: "UNDROP TABLE sales.core.orders"
    - id: c
      text: "CREATE TABLE sales.core.orders DEEP CLONE sales.core.orders VERSION AS OF 0"
    - id: d
      text: "SELECT * FROM sales.core.orders TIMESTAMP AS OF date_sub(current_date(), 3)"
answer: { optionId: b }
explanation:
  correct:
    en: |
      UNDROP TABLE recovers a dropped managed or external table within the recovery period, which is 7 days by default. The table metadata, including its privileges, column specification and properties, is restored, and ownership returns to the previous owner.
    fr: |
      UNDROP TABLE récupère une table managée ou externe supprimée pendant la période de récupération, qui est de 7 jours par défaut. Les métadonnées de la table, dont ses privilèges, la spécification de ses colonnes et ses propriétés, sont restaurées, et la propriété revient à l'ancien propriétaire.
  options:
    a:
      en: |
        RESTORE TABLE rolls an existing table back to an earlier version; it cannot run on a table that no longer exists.
      fr: |
        RESTORE TABLE ramène une table existante à une version antérieure ; il ne peut pas s'exécuter sur une table qui n'existe plus.
    c:
      en: |
        A clone needs an existing source table, and the dropped table cannot be referenced by name.
      fr: |
        Un clone nécessite une table source existante, et la table supprimée ne peut pas être référencée par son nom.
    d:
      en: |
        Time travel queries read versions of an existing table; they fail once the table is dropped.
      fr: |
        Les requêtes de voyage dans le temps lisent les versions d'une table existante ; elles échouent une fois la table supprimée.
references:
  - title: UNDROP
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-undrop-table
