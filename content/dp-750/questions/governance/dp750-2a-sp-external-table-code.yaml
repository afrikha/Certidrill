id: dp750-2a-sp-external-table-code
objective: "2.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a Unity Catalog external location named **raw_landing** for the path abfss://raw@sttailspin.dfs.core.windows.net/. A Lakeflow job runs as a service principal and must register an external table named **tailspin.raw.events** on the path abfss://raw@sttailspin.dfs.core.windows.net/events.

    A metastore admin grants the privileges first, then the job runs the CREATE TABLE statement. The service principal already has USE CATALOG, USE SCHEMA and CREATE TABLE on the parent catalog and schema. Databricks recommendations must be followed.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un emplacement externe Unity Catalog nommé **raw_landing** pour le chemin abfss://raw@sttailspin.dfs.core.windows.net/. Un job Lakeflow s'exécute en tant que principal de service et doit inscrire une table externe nommée **tailspin.raw.events** sur le chemin abfss://raw@sttailspin.dfs.core.windows.net/events.

    Un administrateur du metastore accorde d'abord les privilèges, puis le job exécute l'instruction CREATE TABLE. Le principal de service dispose déjà de USE CATALOG, USE SCHEMA et CREATE TABLE sur le catalogue et le schéma parents. Les recommandations de Databricks doivent être respectées.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template:
    en: |
      -- Run by the metastore admin
      GRANT [[priv]] ON [[sec]] raw_landing
      TO `3f1b6c2e-8d4a-4b7e-9a0c-5e2d7f1a9b64`;

      -- Run by the job as the service principal
      CREATE TABLE tailspin.raw.events (
        event_id STRING,
        event_ts TIMESTAMP,
        payload STRING
      )
      [[clause]] 'abfss://raw@sttailspin.dfs.core.windows.net/events';
    fr: |
      -- Exécutée par l'administrateur du metastore
      GRANT [[priv]] ON [[sec]] raw_landing
      TO `3f1b6c2e-8d4a-4b7e-9a0c-5e2d7f1a9b64`;

      -- Exécutée par le job en tant que principal de service
      CREATE TABLE tailspin.raw.events (
        event_id STRING,
        event_ts TIMESTAMP,
        payload STRING
      )
      [[clause]] 'abfss://raw@sttailspin.dfs.core.windows.net/events';
  slots:
    - id: priv
      options:
        - { id: ct, text: CREATE TABLE }
        - { id: all, text: ALL PRIVILEGES }
        - { id: cet, text: CREATE EXTERNAL TABLE }
        - { id: wf, text: WRITE FILES }
    - id: sec
      options:
        - { id: cred, text: STORAGE CREDENTIAL }
        - { id: schema, text: SCHEMA }
        - { id: loc, text: EXTERNAL LOCATION }
    - id: clause
      options:
        - { id: url, text: URL }
        - { id: path, text: PATH }
        - { id: location, text: LOCATION }
answer:
  values: { priv: cet, sec: loc, clause: location }
explanation:
  correct:
    en: CREATE EXTERNAL TABLE lets a principal create external tables at a path governed by an external location or storage credential, and Databricks recommends granting it on the external location because it is scoped to a path. The service principal is identified by its application ID in the grant. An external table is created with a LOCATION clause that points to a path under the external location.
    fr: CREATE EXTERNAL TABLE permet à un principal de créer des tables externes sur un chemin régi par un emplacement externe ou des informations d'identification de stockage, et Databricks recommande de l'accorder sur l'emplacement externe, car il est limité à un chemin. Le principal de service est identifié par son ID d'application dans l'autorisation. Une table externe se crée avec une clause LOCATION qui pointe vers un chemin situé sous l'emplacement externe.
  options:
    wf: { en: "WRITE FILES allows writing files directly to the path; it does not allow creating external tables.", fr: "WRITE FILES permet d'écrire des fichiers directement sur le chemin ; il ne permet pas de créer des tables externes." }
    ct: { en: "CREATE TABLE is a schema privilege, which the service principal already has.", fr: "CREATE TABLE est un privilège de schéma, dont le principal de service dispose déjà." }
    all: { en: "ALL PRIVILEGES on the external location grants far more than needed.", fr: "ALL PRIVILEGES sur l'emplacement externe accorde bien plus que nécessaire." }
    cred: { en: "raw_landing is an external location, and Databricks recommends granting CREATE EXTERNAL TABLE on the external location rather than on the credential.", fr: "raw_landing est un emplacement externe, et Databricks recommande d'accorder CREATE EXTERNAL TABLE sur l'emplacement externe plutôt que sur les informations d'identification." }
    schema: { en: "CREATE EXTERNAL TABLE is not a schema privilege, and raw_landing is not a schema.", fr: "CREATE EXTERNAL TABLE n'est pas un privilège de schéma, et raw_landing n'est pas un schéma." }
    url: { en: "URL is used in CREATE EXTERNAL LOCATION, not in CREATE TABLE.", fr: "URL s'utilise dans CREATE EXTERNAL LOCATION, pas dans CREATE TABLE." }
    path: { en: "CREATE TABLE has no PATH clause.", fr: "CREATE TABLE n'a pas de clause PATH." }
references:
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
  - title: CREATE TABLE [USING]
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-table-using
