id: dp750-2a-mi-service-credential-code
objective: "2.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Unity Catalog service credential named **sc-keyvault** that references an Access Connector for Azure Databricks. The managed identity of the connector can read secrets from the Azure key vault **kv-proseware-api**. You have the ACCESS privilege on sc-keyvault.

    A Python notebook that runs on classic compute with a supported Databricks Runtime version must read the secret **partner-api-key** from the vault by using the managed identity. No default service credential is configured on the compute.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'informations d'identification de service Unity Catalog nommées **sc-keyvault** qui référencent un connecteur d'accès pour Azure Databricks. L'identité managée du connecteur peut lire les secrets du coffre de clés Azure **kv-proseware-api**. Vous disposez du privilège ACCESS sur sc-keyvault.

    Un notebook Python qui s'exécute sur un calcul classique avec une version de Databricks Runtime prise en charge doit lire le secret **partner-api-key** du coffre à l'aide de l'identité managée. Aucune information d'identification de service par défaut n'est configurée sur le calcul.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.keyvault.secrets import SecretClient

    credential = [[cred]]
    client = SecretClient(vault_url=[[url]], credential=credential)
    api_key = client.get_secret("partner-api-key").value
  slots:
    - id: cred
      options:
        - { id: default, text: "DefaultAzureCredential()" }
        - { id: provider, text: "dbutils.credentials.getServiceCredentialsProvider('sc-keyvault')" }
        - { id: secrets, text: "dbutils.secrets.get(scope='sc-keyvault', key='partner-api-key')" }
    - id: url
      options:
        - { id: blob, text: "\"https://kv-proseware-api.blob.core.windows.net/\"" }
        - { id: arm, text: "\"https://management.azure.com/\"" }
        - { id: vault, text: "\"https://kv-proseware-api.vault.azure.net/\"" }
answer:
  values: { cred: provider, url: vault }
explanation:
  correct:
    en: dbutils.credentials.getServiceCredentialsProvider() returns a credential provider for the named service credential, which Azure SDK clients accept through their credential parameter; the caller needs ACCESS on the service credential (or ownership). SecretClient takes the vault URL, https://<vault-name>.vault.azure.net/.
    fr: dbutils.credentials.getServiceCredentialsProvider() renvoie un fournisseur d'informations d'identification pour les informations d'identification de service nommées, que les clients du SDK Azure acceptent dans leur paramètre credential ; l'appelant doit disposer d'ACCESS sur les informations d'identification de service (ou en être propriétaire). SecretClient prend l'URL du coffre, https://<nom-coffre>.vault.azure.net/.
  options:
    secrets: { en: "dbutils.secrets reads secret scopes; sc-keyvault is a Unity Catalog service credential, not a secret scope.", fr: "dbutils.secrets lit des étendues de secrets ; sc-keyvault est un objet d'informations d'identification de service Unity Catalog, pas une étendue de secrets." }
    default: { en: "DefaultAzureCredential() uses a service credential only when a default service credential is configured on the compute, which is not the case.", fr: "DefaultAzureCredential() n'utilise des informations d'identification de service que si une valeur par défaut est configurée sur le calcul, ce qui n'est pas le cas." }
    blob: { en: "This is a Blob Storage endpoint, not a key vault URL.", fr: "Il s'agit d'un point de terminaison Stockage Blob, pas de l'URL d'un coffre de clés." }
    arm: { en: "This is the Azure Resource Manager endpoint, not a key vault URL.", fr: "Il s'agit du point de terminaison Azure Resource Manager, pas de l'URL d'un coffre de clés." }
references:
  - title: Use Unity Catalog service credentials to connect to external cloud services
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-services/use-service-credentials
