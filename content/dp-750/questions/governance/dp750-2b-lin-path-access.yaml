id: dp750-2b-lin-path-access
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a notebook that runs on a Unity Catalog-enabled cluster in standard access mode. The notebook reads the files of the external table **sales.bronze.orders** with the following code and writes the result to the managed table **sales.gold.daily_revenue**:

    ```python
    df = spark.read.format("delta").load("abfss://bronze@stcontoso.dfs.core.windows.net/orders")
    ```

    In Catalog Explorer, the lineage graph of sales.gold.daily_revenue does not show sales.bronze.orders as an upstream table.

    You need the lineage graph to show sales.bronze.orders as the upstream table of sales.gold.daily_revenue.

    What should you do?
  fr: |
    Contoso dispose d'un notebook qui s'exécute sur un cluster compatible Unity Catalog en mode d'accès standard. Le notebook lit les fichiers de la table externe **sales.bronze.orders** avec le code suivant et écrit le résultat dans la table managée **sales.gold.daily_revenue** :

    ```python
    df = spark.read.format("delta").load("abfss://bronze@stcontoso.dfs.core.windows.net/orders")
    ```

    Dans l'Explorateur de catalogue, le graphe de lignée de sales.gold.daily_revenue n'affiche pas sales.bronze.orders comme table en amont.

    Vous devez faire en sorte que le graphe de lignée affiche sales.bronze.orders comme table en amont de sales.gold.daily_revenue.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable the change data feed on sales.bronze.orders.", fr: "Activer le flux de données modifiées sur sales.bronze.orders." }
    - id: b
      text: { en: "Read the source with spark.read.table(\"sales.bronze.orders\").", fr: "Lire la source avec spark.read.table(\"sales.bronze.orders\")." }
    - id: c
      text: { en: "Enable verbose audit logs in the workspace.", fr: "Activer les journaux d'audit détaillés dans l'espace de travail." }
    - id: d
      text: { en: "Grant the BROWSE privilege on the sales catalog to the notebook owner.", fr: "Accorder le privilège BROWSE sur le catalogue sales au propriétaire du notebook." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a source is referenced by path, lineage records only the storage path, not a table name, so Catalog Explorer cannot link it to sales.bronze.orders. Referencing the table by its three-level name on Unity Catalog compute lets Unity Catalog capture table-level and column-level lineage automatically.
    fr: |
      Lorsqu'une source est référencée par un chemin, la lignée n'enregistre que le chemin de stockage, pas un nom de table : l'Explorateur de catalogue ne peut donc pas la relier à sales.bronze.orders. Référencer la table par son nom en trois parties sur un calcul Unity Catalog permet à Unity Catalog de capturer automatiquement la lignée au niveau des tables et des colonnes.
  options:
    a:
      en: |
        The change data feed records row-level changes for downstream consumers; it does not affect lineage capture.
      fr: |
        Le flux de données modifiées enregistre les modifications de lignes pour les consommateurs en aval ; il n'influe pas sur la capture de la lignée.
    c:
      en: |
        Verbose audit logs add command text to the audit logs; lineage capture does not depend on them.
      fr: |
        Les journaux d'audit détaillés ajoutent le texte des commandes aux journaux d'audit ; la capture de la lignée n'en dépend pas.
    d:
      en: |
        BROWSE controls who can view lineage; it does not change what is captured for a path-based read.
      fr: |
        BROWSE contrôle qui peut consulter la lignée ; il ne change pas ce qui est capturé pour une lecture par chemin.
references:
  - title: Lineage in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/data-lineage
