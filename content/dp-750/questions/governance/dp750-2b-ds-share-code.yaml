id: dp750-2b-ds-share-code
objective: "2.2.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind shares the table **sales.gold.monthly_summary** with a partner named Fabrikam that uses Azure Databricks with Unity Catalog. Fabrikam must be able to run time travel queries and streaming reads on the shared table.

    You run the following statements from a cluster that runs Databricks Runtime 15.4 LTS.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind partage la table **sales.gold.monthly_summary** avec un partenaire nommé Fabrikam qui utilise Azure Databricks avec Unity Catalog. Fabrikam doit pouvoir exécuter des requêtes de voyage dans le temps et des lectures en streaming sur la table partagée.

    Vous exécutez les instructions suivantes depuis un cluster qui exécute Databricks Runtime 15.4 LTS.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE SHARE IF NOT EXISTS partner_sales;

    ALTER SHARE partner_sales
      ADD TABLE sales.gold.monthly_summary [[hist]];

    CREATE RECIPIENT IF NOT EXISTS fabrikam
      USING ID 'azure:westeurope:2f9c1d4e-7a3b-4c5d-9e8f-0a1b2c3d4e5f';

    GRANT [[priv]] ON SHARE partner_sales TO [[ptype]] fabrikam;
  slots:
    - id: hist
      options:
        - { id: without, text: WITHOUT HISTORY }
        - { id: partition, text: "PARTITION (year = '2026')" }
        - { id: with, text: WITH HISTORY }
    - id: priv
      options:
        - { id: select, text: SELECT }
        - { id: useshare, text: USE SHARE }
        - { id: modify, text: MODIFY }
        - { id: readvolume, text: READ VOLUME }
    - id: ptype
      options:
        - { id: provider, text: PROVIDER }
        - { id: catalog, text: CATALOG }
        - { id: recipient, text: RECIPIENT }
answer:
  values: { hist: with, priv: select, ptype: recipient }
explanation:
  correct:
    en: |
      WITH HISTORY shares the table history, which recipients need for time travel and streaming reads; on compute earlier than Databricks Runtime 16.2, the default for a table is WITHOUT HISTORY, so the clause must be explicit. SELECT is the only privilege that can be granted on a share, and it is granted TO RECIPIENT.
    fr: |
      WITH HISTORY partage l'historique de la table, dont les destinataires ont besoin pour le voyage dans le temps et les lectures en streaming ; sur un calcul antérieur à Databricks Runtime 16.2, la valeur par défaut pour une table est WITHOUT HISTORY : la clause doit donc être explicite. SELECT est le seul privilège qui peut être accordé sur un partage, et il s'accorde avec TO RECIPIENT.
  options:
    without: { en: "WITHOUT HISTORY shares only the current version, which blocks time travel and streaming reads.", fr: "WITHOUT HISTORY ne partage que la version actuelle, ce qui empêche le voyage dans le temps et les lectures en streaming." }
    partition: { en: "A partition clause limits the shared rows; on this runtime the table would still be shared without history.", fr: "Une clause de partition limite les lignes partagées ; sur ce runtime, la table serait toujours partagée sans historique." }
    useshare: { en: "USE SHARE is a metastore privilege delegated to provider users, not a privilege granted to recipients.", fr: "USE SHARE est un privilège de metastore délégué à des utilisateurs du fournisseur, pas un privilège accordé aux destinataires." }
    modify: { en: "Shares are read-only; SELECT is the only privilege on a share.", fr: "Les partages sont en lecture seule ; SELECT est le seul privilège sur un partage." }
    provider: { en: "A provider object represents an organization that shares data with you, not the consumer of your share.", fr: "Un objet fournisseur représente une organisation qui partage des données avec vous, pas le consommateur de votre partage." }
references:
  - title: Create shares for OpenSharing
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/create-share
  - title: Manage access to OpenSharing data shares (for providers)
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/grant-access
