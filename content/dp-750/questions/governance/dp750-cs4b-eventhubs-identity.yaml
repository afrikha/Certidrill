id: dp750-cs4b-eventhubs-identity
objective: "2.1.5"
type: single
caseStudy: dp750-cs4b-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to prepare the authentication of pl-telemetry to meet the telemetry authentication requirement. What should you do?
  fr: |
    Vous devez préparer l'authentification de pl-telemetry pour satisfaire l'exigence d'authentification de la télémétrie. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an Azure Databricks access connector, assign its managed identity the Azure Event Hubs Data Receiver role on evh-fc-telemetry, and create a Unity Catalog storage credential that uses the connector.", fr: "Créer un connecteur d'accès Azure Databricks, attribuer à son identité managée le rôle Azure Event Hubs Data Receiver sur evh-fc-telemetry, puis créer des informations d'identification de stockage Unity Catalog qui utilisent le connecteur." } }
    - { id: b, text: { en: "Create an Azure Databricks access connector, assign its managed identity the Azure Event Hubs Data Owner role on evh-fc-telemetry, and create a Unity Catalog service credential that uses the connector.", fr: "Créer un connecteur d'accès Azure Databricks, attribuer à son identité managée le rôle Azure Event Hubs Data Owner sur evh-fc-telemetry, puis créer des informations d'identification de service Unity Catalog qui utilisent le connecteur." } }
    - { id: c, text: { en: "Create an Azure Databricks access connector, assign its managed identity the Azure Event Hubs Data Receiver role on evh-fc-telemetry, and create a Unity Catalog service credential that uses the connector.", fr: "Créer un connecteur d'accès Azure Databricks, attribuer à son identité managée le rôle Azure Event Hubs Data Receiver sur evh-fc-telemetry, puis créer des informations d'identification de service Unity Catalog qui utilisent le connecteur." } }
    - { id: d, text: { en: "Create a shared access policy with the Listen claim on machine-telemetry, store its connection string in Azure Key Vault, and create an Azure Key Vault-backed secret scope.", fr: "Créer une stratégie d'accès partagé avec la revendication Listen sur machine-telemetry, stocker sa chaîne de connexion dans Azure Key Vault, puis créer une étendue de secrets adossée à Azure Key Vault." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Unity Catalog service credential encapsulates the managed identity of an Azure Databricks access connector and governs access to external Azure services such as Event Hubs, with no secret to store. The pipeline then references it with the databricks.serviceCredential Kafka option. Azure Event Hubs Data Receiver only allows receiving events, which meets the read-only constraint.
    fr: |
      Des informations d'identification de service Unity Catalog encapsulent l'identité managée d'un connecteur d'accès Azure Databricks et régissent l'accès à des services Azure externes comme Event Hubs, sans aucun secret à stocker. Le pipeline les référence ensuite avec l'option Kafka databricks.serviceCredential. Azure Event Hubs Data Receiver permet seulement de recevoir des événements, ce qui respecte la contrainte de lecture seule.
  options:
    a:
      en: |
        A storage credential governs access to cloud storage for external locations and managed storage; it is not used to connect to Event Hubs.
      fr: |
        Des informations d'identification de stockage régissent l'accès au stockage cloud pour les emplacements externes et le stockage managé ; elles ne servent pas à se connecter à Event Hubs.
    b:
      en: |
        Azure Event Hubs Data Owner grants full access, including sending events and managing the namespace, which is more than reading.
      fr: |
        Azure Event Hubs Data Owner accorde un accès complet, y compris l'envoi d'événements et la gestion de l'espace de noms, ce qui dépasse la lecture.
    d:
      en: |
        A connection string is a secret stored in Azure Key Vault and does not use a managed identity, which the requirement forbids.
      fr: |
        Une chaîne de connexion est un secret stocké dans Azure Key Vault et n'utilise pas d'identité managée, ce que l'exigence interdit.
references:
  - title: Create service credentials
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-services/service-credentials
  - title: Authentication
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/streaming/kafka/authentication
