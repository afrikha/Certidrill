id: dp750-sr1-emea-orders-2
objective: "2.2.3"
type: series_yesno
series: dp750-sr1-emea-orders
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You create a function that checks sales-leads membership and set it as a column mask on region.
  fr: Vous créez une fonction qui vérifie l'appartenance à sales-leads et la définissez comme masque de colonne sur region.
body:
  solution:
    en: |
      As the owner of tailspin.sales.orders, you run the following statements:

      ```sql
      CREATE FUNCTION tailspin.sales.region_mask(region STRING)
      RETURN CASE WHEN is_account_group_member('sales-leads') OR region = 'EMEA'
                  THEN region ELSE '***' END;

      ALTER TABLE tailspin.sales.orders
      ALTER COLUMN region SET MASK tailspin.sales.region_mask;
      ```
    fr: |
      En tant que propriétaire de tailspin.sales.orders, vous exécutez les instructions suivantes :

      ```sql
      CREATE FUNCTION tailspin.sales.region_mask(region STRING)
      RETURN CASE WHEN is_account_group_member('sales-leads') OR region = 'EMEA'
                  THEN region ELSE '***' END;

      ALTER TABLE tailspin.sales.orders
      ALTER COLUMN region SET MASK tailspin.sales.region_mask;
      ```
answer: { value: false }
explanation:
  correct:
    en: A column mask replaces the value of the masked column at query time but never removes rows. Members of emea-analysts would still receive every order of every region, with `***` in the region column of the non-EMEA rows, so they would not see only the EMEA rows and the region values would no longer be the original ones.
    fr: "Un masque de colonne remplace la valeur de la colonne masquée au moment de la requête, mais ne supprime jamais de lignes. Les membres d'emea-analysts recevraient toujours toutes les commandes de toutes les régions, avec `***` dans la colonne region des lignes hors EMEA : ils ne verraient donc pas uniquement les lignes EMEA, et les valeurs de region ne seraient plus celles d'origine."
references:
  - title: Manually apply row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/manually-apply
