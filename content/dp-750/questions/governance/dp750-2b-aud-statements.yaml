id: dp750-2b-aud-statements
objective: "2.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum is designing audit logging for its Azure Databricks account. The account contains three workspaces on the Premium plan. System tables are available, and no preview feature is enabled.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit la journalisation d'audit de son compte Azure Databricks. Le compte contient trois espaces de travail avec le plan Premium. Les tables système sont disponibles, et aucune fonctionnalité en préversion n'est activée.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In system.access.audit, account-level events have the value 0 in the workspace_id column.", fr: "Dans system.access.audit, les événements de niveau compte ont la valeur 0 dans la colonne workspace_id." } }
    - { id: b, text: { en: "A diagnostic setting on a workspace also delivers the account-level events.", fr: "Un paramètre de diagnostic sur un espace de travail remet aussi les événements de niveau compte." } }
    - { id: c, text: { en: "system.access.audit keeps the events for 30 days.", fr: "system.access.audit conserve les événements pendant 30 jours." } }
    - { id: d, text: { en: "Diagnostic log delivery requires the workspace to be on the Premium plan.", fr: "La remise des journaux de diagnostic exige que l'espace de travail soit sur le plan Premium." } }
    - { id: e, text: { en: "Verbose audit logs are enabled by default on Premium workspaces.", fr: "Les journaux d'audit détaillés sont activés par défaut sur les espaces de travail Premium." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The audit log system table records account-level events with workspace_id 0, alongside the events of each workspace. Diagnostic log delivery through Azure diagnostic settings requires the Premium plan.
    fr: |
      La table système du journal d'audit enregistre les événements de niveau compte avec workspace_id 0, à côté des événements de chaque espace de travail. La remise des journaux de diagnostic via les paramètres de diagnostic Azure exige le plan Premium.
  options:
    b:
      en: |
        Azure diagnostic logs do not include account-level events; use the system table for them.
      fr: |
        Les journaux de diagnostic Azure n'incluent pas les événements de niveau compte ; utilisez la table système pour ceux-ci.
    c:
      en: |
        The default free retention of system.access.audit is 395 days, not 30 days.
      fr: |
        La rétention gratuite par défaut de system.access.audit est de 395 jours, et non de 30 jours.
    e:
      en: |
        Verbose audit logs are disabled by default; a workspace admin must turn them on.
      fr: |
        Les journaux d'audit détaillés sont désactivés par défaut ; un administrateur de l'espace de travail doit les activer.
references:
  - title: Audit log system table reference
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/audit-logs
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
