id: dp750-2a-transfer-ownership
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Unity Catalog table **contoso.hr.employees** was created by a user who is leaving Contoso. You are a metastore admin.

    You need to make the account group **hr-data-owners** the owner of the table.

    Which statement should you run?
  fr: |
    La table Unity Catalog **contoso.hr.employees** a été créée par un utilisateur qui quitte Contoso. Vous êtes administrateur du metastore.

    Vous devez faire du groupe de compte **hr-data-owners** le propriétaire de la table.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "ALTER TABLE contoso.hr.employees OWNER TO `hr-data-owners`;" }
    - { id: b, text: "GRANT MANAGE ON TABLE contoso.hr.employees TO `hr-data-owners`;" }
    - { id: c, text: "GRANT ALL PRIVILEGES ON TABLE contoso.hr.employees TO `hr-data-owners`;" }
    - { id: d, text: "ALTER TABLE contoso.hr.employees SET TBLPROPERTIES ('owner' = 'hr-data-owners');" }
answer: { optionId: a }
explanation:
  correct:
    en: Ownership of a Unity Catalog object is transferred with ALTER <securable-type> <name> OWNER TO <principal>. A metastore admin, the current owner, the owner of the parent container or a principal with MANAGE can run it. An object has a single owner, which can be a group.
    fr: "La propriété d'un objet Unity Catalog se transfère avec ALTER <type-sécurisable> <nom> OWNER TO <principal>. Un administrateur du metastore, le propriétaire actuel, le propriétaire du conteneur parent ou un principal disposant de MANAGE peut l'exécuter. Un objet a un seul propriétaire, qui peut être un groupe."
  options:
    b: { en: "MANAGE delegates management of the table but does not change its owner.", fr: "MANAGE délègue la gestion de la table mais ne change pas son propriétaire." }
    c: { en: "ALL PRIVILEGES grants capabilities on the table; the original user remains the owner.", fr: "ALL PRIVILEGES accorde des capacités sur la table ; l'utilisateur d'origine reste propriétaire." }
    d: { en: "A table property named owner is only metadata; it does not change Unity Catalog ownership.", fr: "Une propriété de table nommée owner n'est qu'une métadonnée ; elle ne change pas la propriété dans Unity Catalog." }
references:
  - title: Manage privileges in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/
