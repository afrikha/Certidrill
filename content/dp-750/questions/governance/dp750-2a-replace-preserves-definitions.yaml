id: dp750-2a-replace-preserves-definitions
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum rebuilds the Unity Catalog Delta table **adatum.gold.daily_sales** every night with a job that runs DROP TABLE followed by CREATE TABLE ... AS SELECT. The column list sometimes changes, but existing column names are never renamed.

    After each run, the grants on the table, its column masks and its table history are lost, and the data stewards have to reapply the governance settings.

    You need to modify the job so that the grants, the column masks of the columns that keep their names, and the table history are preserved. The table must still be rebuilt from the query.

    What should you do?
  fr: |
    Adatum reconstruit chaque nuit la table Delta Unity Catalog **adatum.gold.daily_sales** avec un job qui exécute DROP TABLE puis CREATE TABLE ... AS SELECT. La liste des colonnes change parfois, mais les colonnes existantes ne sont jamais renommées.

    Après chaque exécution, les autorisations de la table, ses masques de colonne et son historique sont perdus, et les responsables des données doivent réappliquer les paramètres de gouvernance.

    Vous devez modifier le job pour que les autorisations, les masques des colonnes qui conservent leur nom et l'historique de la table soient préservés. La table doit toujours être reconstruite à partir de la requête.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the two statements with CREATE TABLE IF NOT EXISTS ... AS SELECT.", fr: "Remplacer les deux instructions par CREATE TABLE IF NOT EXISTS ... AS SELECT." } }
    - { id: b, text: { en: "Keep the statements and add a task that runs UNDROP TABLE before the CREATE TABLE statement.", fr: "Conserver les instructions et ajouter une tâche qui exécute UNDROP TABLE avant l'instruction CREATE TABLE." } }
    - { id: c, text: { en: "Keep the statements and add a task that reruns the GRANT statements after the CREATE TABLE statement.", fr: "Conserver les instructions et ajouter une tâche qui réexécute les instructions GRANT après l'instruction CREATE TABLE." } }
    - { id: d, text: { en: "Replace the two statements with CREATE OR REPLACE TABLE ... AS SELECT.", fr: "Remplacer les deux instructions par CREATE OR REPLACE TABLE ... AS SELECT." } }
answer: { optionId: d }
explanation:
  correct:
    en: REPLACE replaces the table and its content but preserves the table history, the granted privileges, the row filters and the column masks; masks are retained for columns whose names exist in the new table, even if they are not redefined. Databricks strongly recommends REPLACE instead of dropping and re-creating tables.
    fr: REPLACE remplace la table et son contenu, mais conserve l'historique de la table, les privilèges accordés, les filtres de lignes et les masques de colonne ; les masques sont conservés pour les colonnes dont le nom existe dans la nouvelle table, même s'ils ne sont pas redéfinis. Databricks recommande vivement REPLACE plutôt que de supprimer puis recréer les tables.
  options:
    a: { en: "IF NOT EXISTS skips the creation when the table exists, so the table would no longer be rebuilt.", fr: "IF NOT EXISTS ignore la création lorsque la table existe ; la table ne serait donc plus reconstruite." }
    b: { en: "UNDROP restores a dropped table, which would then conflict with the CREATE TABLE statement; it does not make a rebuild keep its governance settings.", fr: "UNDROP restaure une table supprimée, qui entrerait alors en conflit avec l'instruction CREATE TABLE ; cela ne permet pas à une reconstruction de conserver ses paramètres de gouvernance." }
    c: { en: "Reapplying grants does not restore the column masks or the table history.", fr: "Réappliquer les autorisations ne restaure ni les masques de colonne ni l'historique de la table." }
references:
  - title: CREATE TABLE [USING]
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-table-using
