id: dp750-2b-ret-deletion-vectors
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Delta table named **crm.core.contacts** with deletion vectors enabled. To honor a right-to-be-forgotten request, you run the following statement:

    ```sql
    DELETE FROM crm.core.contacts WHERE contact_id = 48213;
    ```

    You must ensure that the deleted rows are physically removed from the files in storage after the retention period. The VACUUM command will run when the retention period has elapsed.

    Which statement should you run before VACUUM?
  fr: |
    Fabrikam dispose d'une table Delta nommée **crm.core.contacts** dont les vecteurs de suppression sont activés. Pour honorer une demande de droit à l'oubli, vous exécutez l'instruction suivante :

    ```sql
    DELETE FROM crm.core.contacts WHERE contact_id = 48213;
    ```

    Vous devez faire en sorte que les lignes supprimées soient physiquement retirées des fichiers du stockage après la période de rétention. La commande VACUUM s'exécutera une fois la période de rétention écoulée.

    Quelle instruction devez-vous exécuter avant VACUUM ?
body:
  options:
    - id: a
      text: "ALTER TABLE crm.core.contacts SET TBLPROPERTIES ('delta.enableDeletionVectors' = false)"
    - id: b
      text: "ALTER TABLE crm.core.contacts SET TBLPROPERTIES ('delta.deletedFileRetentionDuration' = 'interval 1 days')"
    - id: c
      text: "REORG TABLE crm.core.contacts APPLY (PURGE)"
    - id: d
      text: "RESTORE TABLE crm.core.contacts TO VERSION AS OF 0"
answer: { optionId: c }
explanation:
  correct:
    en: |
      With deletion vectors, DELETE only marks the rows as deleted and leaves them in the existing Parquet files. REORG TABLE … APPLY (PURGE) rewrites those files without the deleted rows; VACUUM can then remove the old files once they are older than the retention period.
    fr: |
      Avec les vecteurs de suppression, DELETE se contente de marquer les lignes comme supprimées et les laisse dans les fichiers Parquet existants. REORG TABLE … APPLY (PURGE) réécrit ces fichiers sans les lignes supprimées ; VACUUM peut ensuite supprimer les anciens fichiers lorsqu'ils dépassent la période de rétention.
  options:
    a:
      en: |
        Disabling deletion vectors affects future writes; the rows already marked as deleted stay in the current files.
      fr: |
        Désactiver les vecteurs de suppression concerne les écritures futures ; les lignes déjà marquées comme supprimées restent dans les fichiers actuels.
    b:
      en: |
        A shorter retention only shortens the wait before VACUUM; the current files still contain the soft-deleted rows.
      fr: |
        Une rétention plus courte ne fait que raccourcir l'attente avant VACUUM ; les fichiers actuels contiennent toujours les lignes supprimées logiquement.
    d:
      en: |
        RESTORE brings back an earlier version of the table, which would reintroduce deleted data instead of removing it.
      fr: |
        RESTORE rétablit une version antérieure de la table, ce qui réintroduirait des données supprimées au lieu de les retirer.
references:
  - title: Remove unused data files with vacuum
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/vacuum
  - title: Apply data retention policies
    url: https://learn.microsoft.com/en-us/training/modules/govern-unity-catalog-objects/4-apply-data-retention-policies
