id: dp750-2b-ds-protocol
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso wants to share two tables and a volume of its **sales** catalog with a partner named Fabrikam by using Delta Sharing. Fabrikam uses an Azure Databricks workspace enabled for Unity Catalog in a different Azure Databricks account.

    The solution must not require Contoso to create, distribute or rotate any credential for Fabrikam.

    Which sharing approach should you use?
  fr: |
    Contoso souhaite partager deux tables et un volume de son catalogue **sales** avec un partenaire nommé Fabrikam à l'aide de Delta Sharing. Fabrikam utilise un espace de travail Azure Databricks activé pour Unity Catalog dans un autre compte Azure Databricks.

    La solution ne doit pas obliger Contoso à créer, distribuer ou faire pivoter des informations d'identification pour Fabrikam.

    Quelle approche de partage devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Open sharing with a recipient that authenticates with a bearer token", fr: "Le partage ouvert avec un destinataire qui s'authentifie avec un jeton du porteur" }
    - id: b
      text: { en: "Databricks-to-Databricks sharing with a recipient created from Fabrikam's sharing identifier", fr: "Le partage Databricks-to-Databricks avec un destinataire créé à partir de l'identifiant de partage de Fabrikam" }
    - id: c
      text: { en: "Open sharing with a recipient that authenticates by using OIDC federation", fr: "Le partage ouvert avec un destinataire qui s'authentifie par fédération OIDC" }
    - id: d
      text: { en: "A workspace-catalog binding of the sales catalog to Fabrikam's workspace", fr: "Une liaison espace de travail-catalogue du catalogue sales à l'espace de travail de Fabrikam" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the recipient has a Unity Catalog-enabled workspace, Databricks-to-Databricks sharing is the preferred protocol. The provider creates the recipient with CREATE RECIPIENT … USING ID and the recipient's sharing identifier; authentication is handled by the platform, so no token is needed, and volumes can be shared along with tables.
    fr: |
      Lorsque le destinataire dispose d'un espace de travail activé pour Unity Catalog, le partage Databricks-to-Databricks est le protocole à privilégier. Le fournisseur crée le destinataire avec CREATE RECIPIENT … USING ID et l'identifiant de partage du destinataire ; l'authentification est gérée par la plateforme, aucun jeton n'est donc nécessaire, et des volumes peuvent être partagés avec les tables.
  options:
    a:
      en: |
        Bearer token recipients require the provider to distribute an activation link and to rotate the token, and open sharing covers tabular data only.
      fr: |
        Les destinataires à jeton du porteur obligent le fournisseur à distribuer un lien d'activation et à faire pivoter le jeton, et le partage ouvert ne couvre que les données tabulaires.
    c:
      en: |
        OIDC federation avoids long-lived tokens but is an open sharing option for non-Databricks recipients, limited to tabular data.
      fr: |
        La fédération OIDC évite les jetons de longue durée, mais c'est une option du partage ouvert pour les destinataires hors Databricks, limitée aux données tabulaires.
    d:
      en: |
        Workspace-catalog binding controls which workspaces of the same metastore can access a catalog; it cannot expose data to another account.
      fr: |
        La liaison espace de travail-catalogue contrôle quels espaces de travail du même metastore peuvent accéder à un catalogue ; elle ne peut pas exposer de données à un autre compte.
references:
  - title: What is OpenSharing?
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/
