id: dp750-2b-aud-verbose
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam sends the audit logs of its Azure Databricks workspace to a Log Analytics workspace by using a diagnostic setting that includes every log category. The security team reports that the logs show which notebooks were run, but not the text of the commands that users run in notebook cells or submit to SQL warehouses.

    You need the audit logs to include the full text of these commands.

    What should you do?
  fr: |
    Fabrikam envoie les journaux d'audit de son espace de travail Azure Databricks à un espace de travail Log Analytics à l'aide d'un paramètre de diagnostic qui inclut toutes les catégories de journaux. L'équipe de sécurité signale que les journaux montrent quels notebooks ont été exécutés, mais pas le texte des commandes que les utilisateurs exécutent dans les cellules des notebooks ou soumettent aux entrepôts SQL.

    Vous devez faire en sorte que les journaux d'audit incluent le texte complet de ces commandes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Grant the security team SELECT on the system.access.audit table.", fr: "Accorder à l'équipe de sécurité SELECT sur la table system.access.audit." }
    - id: b
      text: { en: "Enable cluster log delivery to an Azure Storage account.", fr: "Activer la remise des journaux de cluster vers un compte Stockage Azure." }
    - id: c
      text: { en: "Add a second diagnostic setting that sends the logs to an event hub.", fr: "Ajouter un second paramètre de diagnostic qui envoie les journaux vers un hub d'événements." }
    - id: d
      text: { en: "Turn on Verbose Audit Logs in the workspace admin settings.", fr: "Activer Verbose Audit Logs dans les paramètres d'administration de l'espace de travail." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Verbose audit logs are disabled by default. When a workspace admin turns them on (Admin Settings > Advanced), Azure Databricks logs additional events such as notebook runCommand and databrickssql commandSubmit, which carry the commandText parameter.
    fr: |
      Les journaux d'audit détaillés sont désactivés par défaut. Lorsqu'un administrateur de l'espace de travail les active (Admin Settings > Advanced), Azure Databricks journalise des événements supplémentaires, comme runCommand du service notebook et commandSubmit du service databrickssql, qui contiennent le paramètre commandText.
  options:
    a:
      en: |
        The system table contains the same audit events; without verbose audit logs, the command text is not recorded there either.
      fr: |
        La table système contient les mêmes événements d'audit ; sans journaux d'audit détaillés, le texte des commandes n'y est pas enregistré non plus.
    b:
      en: |
        Cluster log delivery copies driver and worker logs; it is not an audit log feature.
      fr: |
        La remise des journaux de cluster copie les journaux du pilote et des workers ; ce n'est pas une fonctionnalité de journal d'audit.
    c:
      en: |
        Another destination receives the same events, still without the command text.
      fr: |
        Une autre destination reçoit les mêmes événements, toujours sans le texte des commandes.
references:
  - title: Enable verbose audit logs
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/verbose-logs
