id: dp750-2b-ret-predictive-opt
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a schema named **finance.ledger** that contains Unity Catalog managed tables with the default retention settings. Today, no maintenance runs on the tables.

    You need to meet the following requirements:

    - Unreferenced data files must be removed automatically, without creating or scheduling any job.
    - Users must be able to time travel up to 30 days back on the **finance.ledger.entries** table.

    What should you do?
  fr: |
    Adatum dispose d'un schéma nommé **finance.ledger** qui contient des tables managées Unity Catalog avec les paramètres de rétention par défaut. Aujourd'hui, aucune maintenance ne s'exécute sur les tables.

    Vous devez satisfaire les exigences suivantes :

    - Les fichiers de données non référencés doivent être supprimés automatiquement, sans créer ni planifier de job.
    - Les utilisateurs doivent pouvoir remonter jusqu'à 30 jours en arrière par voyage dans le temps sur la table **finance.ledger.entries**.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable predictive optimization on finance.ledger and keep the default retention settings of finance.ledger.entries.", fr: "Activer l'optimisation prédictive sur finance.ledger et conserver les paramètres de rétention par défaut de finance.ledger.entries." }
    - id: b
      text: { en: "Set delta.logRetentionDuration to 30 days on finance.ledger.entries and enable predictive optimization on finance.ledger.", fr: "Définir delta.logRetentionDuration sur 30 jours sur finance.ledger.entries et activer l'optimisation prédictive sur finance.ledger." }
    - id: c
      text: { en: "Set delta.deletedFileRetentionDuration to 30 days on finance.ledger.entries and enable predictive optimization on finance.ledger.", fr: "Définir delta.deletedFileRetentionDuration sur 30 jours sur finance.ledger.entries et activer l'optimisation prédictive sur finance.ledger." }
    - id: d
      text: { en: "Set delta.deletedFileRetentionDuration to 30 days on finance.ledger.entries and create a daily Lakeflow job that runs VACUUM.", fr: "Définir delta.deletedFileRetentionDuration sur 30 jours sur finance.ledger.entries et créer un job Lakeflow quotidien qui exécute VACUUM." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Predictive optimization runs VACUUM automatically on Unity Catalog managed tables, so no job is needed. VACUUM honors delta.deletedFileRetentionDuration, which defaults to 7 days; raising it to 30 days keeps the data files that time travel needs, and the transaction log is already kept for 30 days by default.
    fr: |
      L'optimisation prédictive exécute automatiquement VACUUM sur les tables managées Unity Catalog : aucun job n'est nécessaire. VACUUM respecte delta.deletedFileRetentionDuration, qui vaut 7 jours par défaut ; la porter à 30 jours conserve les fichiers de données nécessaires au voyage dans le temps, et le journal des transactions est déjà conservé 30 jours par défaut.
  options:
    a:
      en: |
        With the default 7-day file retention, the automatic VACUUM would remove the files that time travel needs beyond 7 days.
      fr: |
        Avec la rétention de fichiers par défaut de 7 jours, le VACUUM automatique supprimerait les fichiers nécessaires au voyage dans le temps au-delà de 7 jours.
    b:
      en: |
        The log retention is already 30 days by default; the data files would still be removed after 7 days.
      fr: |
        La rétention du journal est déjà de 30 jours par défaut ; les fichiers de données seraient toujours supprimés après 7 jours.
    d:
      en: |
        A scheduled job meets the retention need but violates the requirement to avoid creating or scheduling jobs.
      fr: |
        Un job planifié répond au besoin de rétention, mais enfreint l'exigence de ne créer ni planifier aucun job.
references:
  - title: Apply data retention policies
    url: https://learn.microsoft.com/en-us/training/modules/govern-unity-catalog-objects/4-apply-data-retention-policies
  - title: Remove unused data files with vacuum
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/vacuum
