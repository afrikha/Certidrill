id: dp750-2a-job-run-as-sp
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind runs a production Lakeflow job named **nightly_gold** that writes to Unity Catalog tables. The job currently runs as the data engineer who created it, and that engineer is leaving the company.

    The job must keep running with the same data access, without depending on the account or the credentials of any individual user.

    What should you do?
  fr: |
    Northwind exécute un job Lakeflow de production nommé **nightly_gold** qui écrit dans des tables Unity Catalog. Le job s'exécute actuellement en tant que l'ingénieur données qui l'a créé, et cet ingénieur quitte l'entreprise.

    Le job doit continuer à s'exécuter avec le même accès aux données, sans dépendre du compte ni des informations d'identification d'un utilisateur individuel.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant a service principal the required Unity Catalog privileges and set it as the job's Run as identity.", fr: "Accorder à un principal de service les privilèges Unity Catalog nécessaires et le définir comme identité Exécuter en tant que du job." } }
    - { id: b, text: { en: "Create a personal access token for a workspace admin and store it in a secret scope used by the job.", fr: "Créer un jeton d'accès personnel pour un administrateur d'espace de travail et le stocker dans une étendue de secrets utilisée par le job." } }
    - { id: c, text: { en: "Change the job's tasks to run on serverless compute.", fr: "Faire exécuter les tâches du job sur un calcul serverless." } }
    - { id: d, text: { en: "Add the leaving engineer's account to the workspace admins group before it is removed.", fr: "Ajouter le compte de l'ingénieur sortant au groupe des administrateurs de l'espace de travail avant sa suppression." } }
answer: { optionId: a }
explanation:
  correct:
    en: A service principal is an identity for automation. Running a job as a service principal, instead of a user, prevents the job from failing when a user leaves the organization or a group changes, and the service principal receives Unity Catalog privileges like any other principal.
    fr: Un principal de service est une identité destinée à l'automatisation. Exécuter un job en tant que principal de service, plutôt qu'en tant qu'utilisateur, évite que le job échoue lorsqu'un utilisateur quitte l'organisation ou qu'un groupe change, et le principal de service reçoit des privilèges Unity Catalog comme tout autre principal.
  options:
    b: { en: "A personal access token still ties the job to an individual user account.", fr: "Un jeton d'accès personnel lie toujours le job au compte d'un utilisateur individuel." }
    c: { en: "The compute type does not change the identity the job runs as.", fr: "Le type de calcul ne change pas l'identité sous laquelle le job s'exécute." }
    d: { en: "The job would still depend on a user account, and admin rights would be excessive.", fr: "Le job dépendrait toujours d'un compte d'utilisateur, et les droits d'administrateur seraient excessifs." }
references:
  - title: Service principals
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/users-groups/service-principals
