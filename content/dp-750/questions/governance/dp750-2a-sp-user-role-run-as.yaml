id: dp750-2a-sp-user-role-run-as
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Eva is a workspace admin at Fabrikam. She created an Azure Databricks managed service principal named **sp-jobs**, so she has the Manager role on it, and she granted sp-jobs the Unity Catalog privileges required by a job named **daily_sales**.

    When Eva edits daily_sales, she cannot set sp-jobs as the Run as identity of the job.

    You need to ensure that Eva can configure the job to run as sp-jobs. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Eva est administratrice d'un espace de travail chez Fabrikam. Elle a créé un principal de service managé par Azure Databricks nommé **sp-jobs** ; elle dispose donc du rôle Manager sur ce principal de service, et elle a accordé à sp-jobs les privilèges Unity Catalog requis par un job nommé **daily_sales**.

    Lorsqu'Eva modifie daily_sales, elle ne peut pas définir sp-jobs comme identité Exécuter en tant que du job.

    Vous devez faire en sorte qu'Eva puisse configurer le job pour qu'il s'exécute en tant que sp-jobs. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Eva the account admin role.", fr: "Attribuer à Eva le rôle d'administrateur de compte." } }
    - { id: b, text: { en: "Generate an OAuth secret for sp-jobs and add it to the job parameters.", fr: "Générer une clé secrète OAuth pour sp-jobs et l'ajouter aux paramètres du job." } }
    - { id: c, text: { en: "Add sp-jobs to the workspace admins group.", fr: "Ajouter sp-jobs au groupe des administrateurs de l'espace de travail." } }
    - { id: d, text: { en: "Assign Eva the User role on sp-jobs.", fr: "Attribuer à Eva le rôle User sur sp-jobs." } }
answer: { optionId: d }
explanation:
  correct:
    en: Principals with the User role on a service principal can run jobs as that service principal. The Manager role, which the creator receives automatically, lets Eva manage roles on sp-jobs but does not include the User role, so she must explicitly assign herself (or be assigned) the User role.
    fr: Les principaux qui disposent du rôle User sur un principal de service peuvent exécuter des jobs en tant que ce principal de service. Le rôle Manager, que le créateur reçoit automatiquement, permet à Eva de gérer les rôles sur sp-jobs mais n'inclut pas le rôle User ; elle doit donc s'attribuer explicitement (ou se voir attribuer) le rôle User.
  options:
    a: { en: "Account admins automatically become managers of all service principals, which still does not include the User role, and the role is excessive.", fr: "Les administrateurs de compte deviennent automatiquement managers de tous les principaux de service, ce qui n'inclut toujours pas le rôle User, et ce rôle est excessif." }
    b: { en: "An OAuth secret is used by external tools to authenticate; it does not let a user select the service principal as a job's Run as identity.", fr: "Une clé secrète OAuth sert aux outils externes pour s'authentifier ; elle ne permet pas à un utilisateur de choisir le principal de service comme identité Exécuter en tant que d'un job." }
    c: { en: "Changing the service principal's own rights does not give Eva permission to use it, and admin rights are excessive.", fr: "Modifier les droits du principal de service lui-même ne donne pas à Eva l'autorisation de l'utiliser, et les droits d'administrateur sont excessifs." }
references:
  - title: Service principals
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/users-groups/service-principals
