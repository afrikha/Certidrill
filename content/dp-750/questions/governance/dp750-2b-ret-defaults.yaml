id: dp750-2b-ret-defaults
objective: "2.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a Delta table named **ops.flights.legs** that uses the default retention settings. VACUUM runs on the table every night.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une table Delta nommée **ops.flights.legs** qui utilise les paramètres de rétention par défaut. VACUUM s'exécute sur la table chaque nuit.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "VACUUM removes unreferenced data files that are older than 7 days.", fr: "VACUUM supprime les fichiers de données non référencés de plus de 7 jours." } }
    - { id: b, text: { en: "VACUUM removes transaction log entries that are older than 7 days.", fr: "VACUUM supprime les entrées du journal des transactions de plus de 7 jours." } }
    - { id: c, text: { en: "DESCRIBE HISTORY returns the operations of the last 30 days.", fr: "DESCRIBE HISTORY renvoie les opérations des 30 derniers jours." } }
    - { id: d, text: { en: "RESTORE TABLE can return the table to a version whose files VACUUM has removed.", fr: "RESTORE TABLE peut ramener la table à une version dont VACUUM a supprimé les fichiers." } }
    - { id: e, text: { en: "Setting delta.logRetentionDuration to 90 days alone enables time travel 90 days back.", fr: "Définir uniquement delta.logRetentionDuration sur 90 jours permet le voyage dans le temps 90 jours en arrière." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      By default, delta.deletedFileRetentionDuration is 7 days, the threshold VACUUM uses for unreferenced files, and delta.logRetentionDuration is 30 days, which is the history DESCRIBE HISTORY reads. Log files are removed automatically after checkpoints, not by VACUUM.
    fr: |
      Par défaut, delta.deletedFileRetentionDuration vaut 7 jours, le seuil qu'utilise VACUUM pour les fichiers non référencés, et delta.logRetentionDuration vaut 30 jours, soit l'historique que lit DESCRIBE HISTORY. Les fichiers journaux sont supprimés automatiquement après les points de contrôle, pas par VACUUM.
  options:
    b:
      en: |
        VACUUM does not govern transaction log files; they are cleaned up after checkpoints, with a 30-day default retention.
      fr: |
        VACUUM ne gère pas les fichiers du journal des transactions ; ils sont nettoyés après les points de contrôle, avec une rétention par défaut de 30 jours.
    d:
      en: |
        You cannot restore a version whose data files were deleted by VACUUM.
      fr: |
        Vous ne pouvez pas restaurer une version dont les fichiers de données ont été supprimés par VACUUM.
    e:
      en: |
        Time travel also needs the data files, which VACUUM removes after 7 days unless delta.deletedFileRetentionDuration is raised too.
      fr: |
        Le voyage dans le temps nécessite aussi les fichiers de données, que VACUUM supprime après 7 jours si delta.deletedFileRetentionDuration n'est pas augmentée également.
references:
  - title: Work with table history
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/history
  - title: Remove unused data files with vacuum
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/vacuum
