id: dp750-2b-rfcm-privileges
objective: "2.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a table named **sales.core.orders** owned by the **sales_owners** group. A function named **sales.security.region_filter** already exists. A data engineer named DE1 is not a member of sales_owners. DE1 has the USE CATALOG privilege on the **sales** catalog and the USE SCHEMA privilege on the **sales.core** and **sales.security** schemas.

    DE1 must run the following statement:

    ```sql
    ALTER TABLE sales.core.orders SET ROW FILTER sales.security.region_filter ON (region);
    ```

    You need to grant DE1 the minimum privileges required.

    Which three privileges should you grant? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une table nommée **sales.core.orders** dont le groupe **sales_owners** est propriétaire. Une fonction nommée **sales.security.region_filter** existe déjà. Un ingénieur données nommé DE1 n'est pas membre de sales_owners. DE1 dispose du privilège USE CATALOG sur le catalogue **sales** et du privilège USE SCHEMA sur les schémas **sales.core** et **sales.security**.

    DE1 doit exécuter l'instruction suivante :

    ```sql
    ALTER TABLE sales.core.orders SET ROW FILTER sales.security.region_filter ON (region);
    ```

    Vous devez accorder à DE1 les privilèges minimaux nécessaires.

    Quels sont les trois privilèges à accorder ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "EXECUTE on sales.security.region_filter", fr: "EXECUTE sur sales.security.region_filter" } }
    - { id: b, text: { en: "MODIFY on sales.core.orders", fr: "MODIFY sur sales.core.orders" } }
    - { id: c, text: { en: "MANAGE on sales.core.orders", fr: "MANAGE sur sales.core.orders" } }
    - { id: d, text: { en: "APPLY TAG on sales.core.orders", fr: "APPLY TAG sur sales.core.orders" } }
    - { id: e, text: { en: "SELECT on sales.core.orders", fr: "SELECT sur sales.core.orders" } }
    - { id: f, text: { en: "CREATE FUNCTION on sales.security", fr: "CREATE FUNCTION sur sales.security" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      To assign a filter function you need EXECUTE on the function in addition to USE CATALOG and USE SCHEMA. To add or remove a filter on an existing table, you must own the table or hold both MANAGE and SELECT on it.
    fr: |
      Pour attribuer une fonction de filtre, il faut EXECUTE sur la fonction en plus de USE CATALOG et USE SCHEMA. Pour ajouter ou supprimer un filtre sur une table existante, il faut en être propriétaire ou disposer à la fois de MANAGE et de SELECT sur la table.
  options:
    b:
      en: |
        MODIFY is needed only when the same statement also changes the table schema, for example when it adds a masked column.
      fr: |
        MODIFY n'est nécessaire que si la même instruction modifie aussi le schéma de la table, par exemple en ajoutant une colonne masquée.
    d:
      en: |
        APPLY TAG controls the assignment of tags, not the binding of a row filter function.
      fr: |
        APPLY TAG contrôle l'attribution des balises, pas l'association d'une fonction de filtre de lignes.
    f:
      en: |
        The function already exists, so DE1 does not need to create one.
      fr: |
        La fonction existe déjà : DE1 n'a pas besoin d'en créer une.
references:
  - title: Manually apply row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/manually-apply
