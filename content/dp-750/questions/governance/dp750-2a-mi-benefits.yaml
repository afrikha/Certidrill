id: dp750-2a-mi-benefits
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Databricks workspace deployed in its own virtual network (VNet injection). The Azure Data Lake Storage account **stlitwaregold** is protected by a storage firewall. The team must choose between a Microsoft Entra ID service principal and a managed identity in an Access Connector for Azure Databricks to back a new Unity Catalog storage credential for stlitwaregold.

    Which two statements support choosing the managed identity?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un espace de travail Azure Databricks déployé dans son propre réseau virtuel (injection de réseau virtuel). Le compte Azure Data Lake Storage **stlitwaregold** est protégé par un pare-feu de stockage. L'équipe doit choisir entre un principal de service Microsoft Entra ID et une identité managée dans un connecteur d'accès pour Azure Databricks pour de nouvelles informations d'identification de stockage Unity Catalog destinées à stlitwaregold.

    Quelles sont les deux affirmations qui justifient le choix de l'identité managée ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A managed identity needs no Azure role assignment on the storage account.", fr: "Une identité managée n'a besoin d'aucune attribution de rôle Azure sur le compte de stockage." } }
    - { id: b, text: { en: "A managed identity storage credential bypasses Unity Catalog privileges on external locations.", fr: "Des informations d'identification de stockage par identité managée contournent les privilèges Unity Catalog sur les emplacements externes." } }
    - { id: c, text: { en: "A managed identity storage credential can be used only from the workspace in which it was created.", fr: "Des informations d'identification de stockage par identité managée ne peuvent être utilisées que depuis l'espace de travail où elles ont été créées." } }
    - { id: d, text: { en: "No client secret has to be stored or rotated.", fr: "Aucune clé secrète client ne doit être stockée ni renouvelée." } }
    - { id: e, text: { en: "Only a managed identity can reach storage protected by network rules from the workspace.", fr: "Seule une identité managée peut atteindre depuis l'espace de travail un stockage protégé par des règles réseau." } }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: With a managed identity, there are no credentials to maintain or rotate. For VNet-injected workspaces that use a storage firewall on Azure Data Lake Storage, the managed identity can connect the workspace to the account, which a service principal cannot do.
    fr: Avec une identité managée, il n'y a aucune information d'identification à maintenir ni à renouveler. Pour les espaces de travail à injection de réseau virtuel qui utilisent un pare-feu de stockage sur Azure Data Lake Storage, l'identité managée peut connecter l'espace de travail au compte, ce qu'un principal de service ne peut pas faire.
  options:
    a: { en: "The managed identity still needs a role such as Storage Blob Data Contributor on the storage account.", fr: "L'identité managée a toujours besoin d'un rôle comme Storage Blob Data Contributor sur le compte de stockage." }
    b: { en: "Users still need Unity Catalog privileges; the credential only defines how Unity Catalog reaches the storage.", fr: "Les utilisateurs ont toujours besoin de privilèges Unity Catalog ; les informations d'identification définissent seulement comment Unity Catalog atteint le stockage." }
    c: { en: "By default, a storage credential can be used from any workspace attached to the metastore; workspace binding is optional.", fr: "Par défaut, des informations d'identification de stockage sont utilisables depuis tout espace de travail attaché au metastore ; la liaison à des espaces de travail est facultative." }
references:
  - title: Use Azure managed identities in Unity Catalog to access storage
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/azure-managed-identities
