id: dp750-2a-mi-service-credential-access
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a Unity Catalog service credential named **sc-eventing** that references an Access Connector for Azure Databricks. Its managed identity has permissions on an Azure service that notebooks call through the Azure SDK.

    Members of the account group **integration-devs** must use sc-eventing in their Python notebooks. The solution must follow the principle of least privilege.

    What should you grant to integration-devs?
  fr: |
    Northwind dispose d'informations d'identification de service Unity Catalog nommées **sc-eventing** qui référencent un connecteur d'accès pour Azure Databricks. Son identité managée dispose d'autorisations sur un service Azure que des notebooks appellent avec le SDK Azure.

    Les membres du groupe de compte **integration-devs** doivent utiliser sc-eventing dans leurs notebooks Python. La solution doit respecter le principe du moindre privilège.

    Que devez-vous accorder à integration-devs ?
body:
  options:
    - { id: a, text: { en: "Ownership of the access connector in the Azure portal", fr: "La propriété du connecteur d'accès dans le portail Azure" } }
    - { id: b, text: { en: "ACCESS on the service credential sc-eventing", fr: "ACCESS sur les informations d'identification de service sc-eventing" } }
    - { id: c, text: { en: "CREATE SERVICE CREDENTIAL on the metastore", fr: "CREATE SERVICE CREDENTIAL sur le metastore" } }
    - { id: d, text: { en: "MANAGE on the service credential sc-eventing", fr: "MANAGE sur les informations d'identification de service sc-eventing" } }
answer: { optionId: b }
explanation:
  correct:
    en: To use a service credential in code, a principal needs the ACCESS privilege on the service credential or must own it. The notebook then obtains a credential provider with dbutils.credentials.getServiceCredentialsProvider('sc-eventing') and passes it to the Azure SDK client.
    fr: Pour utiliser des informations d'identification de service dans du code, un principal a besoin du privilège ACCESS sur celles-ci ou doit en être propriétaire. Le notebook obtient ensuite un fournisseur d'informations d'identification avec dbutils.credentials.getServiceCredentialsProvider('sc-eventing') et le transmet au client du SDK Azure.
  options:
    c: { en: "CREATE SERVICE CREDENTIAL lets a principal create new service credentials; it does not grant use of an existing one.", fr: "CREATE SERVICE CREDENTIAL permet de créer de nouvelles informations d'identification de service ; il n'accorde pas l'utilisation de celles qui existent." }
    d: { en: "MANAGE lets the group manage privileges on the credential and drop it, which exceeds the need.", fr: "MANAGE permet au groupe de gérer les privilèges sur les informations d'identification et de les supprimer, ce qui dépasse le besoin." }
    a: { en: "Azure ownership of the connector is unrelated to Unity Catalog privileges on the service credential.", fr: "La propriété Azure du connecteur est sans rapport avec les privilèges Unity Catalog sur les informations d'identification de service." }
references:
  - title: Use Unity Catalog service credentials to connect to external cloud services
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-services/use-service-credentials
