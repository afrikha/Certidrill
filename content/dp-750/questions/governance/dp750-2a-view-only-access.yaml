id: dp750-2a-view-only-access
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a Unity Catalog table named **wingtip.hr.salaries** and a view named **wingtip.hr.salaries_by_dept** that aggregates the table. The view is owned by the group **hr-admins**, which has SELECT on wingtip.hr.salaries.

    Members of the account group **bi-users** query data only from a SQL warehouse. They already have USE CATALOG on wingtip and USE SCHEMA on wingtip.hr. They must be able to query the view, but must not be able to query wingtip.hr.salaries directly.

    What should you grant to bi-users?
  fr: |
    Wingtip Toys dispose d'une table Unity Catalog nommée **wingtip.hr.salaries** et d'une vue nommée **wingtip.hr.salaries_by_dept** qui agrège la table. Le propriétaire de la vue est le groupe **hr-admins**, qui dispose de SELECT sur wingtip.hr.salaries.

    Les membres du groupe de compte **bi-users** interrogent les données uniquement depuis un entrepôt SQL. Ils disposent déjà de USE CATALOG sur wingtip et de USE SCHEMA sur wingtip.hr. Ils doivent pouvoir interroger la vue, mais ne doivent pas pouvoir interroger directement wingtip.hr.salaries.

    Que devez-vous accorder à bi-users ?
body:
  options:
    - { id: a, text: { en: "SELECT on the view and SELECT on the table wingtip.hr.salaries", fr: "SELECT sur la vue et SELECT sur la table wingtip.hr.salaries" } }
    - { id: b, text: { en: "SELECT on the schema wingtip.hr", fr: "SELECT sur le schéma wingtip.hr" } }
    - { id: c, text: { en: "MANAGE on the view wingtip.hr.salaries_by_dept", fr: "MANAGE sur la vue wingtip.hr.salaries_by_dept" } }
    - { id: d, text: { en: "SELECT on the view wingtip.hr.salaries_by_dept only", fr: "SELECT sur la vue wingtip.hr.salaries_by_dept uniquement" } }
answer: { optionId: d }
explanation:
  correct:
    en: Reading a view requires SELECT on the view plus USE CATALOG and USE SCHEMA on its parents. On a SQL warehouse, Unity Catalog checks the view owner's permissions on the underlying table, so readers do not need SELECT on the table, and the owner must keep that access.
    fr: Lire une vue exige SELECT sur la vue, ainsi que USE CATALOG et USE SCHEMA sur ses parents. Sur un entrepôt SQL, Unity Catalog vérifie les autorisations du propriétaire de la vue sur la table sous-jacente ; les lecteurs n'ont donc pas besoin de SELECT sur la table, et le propriétaire doit conserver cet accès.
  options:
    a: { en: "SELECT on the table lets bi-users query it directly, which the requirements forbid.", fr: "SELECT sur la table permet à bi-users de l'interroger directement, ce que les exigences interdisent." }
    b: { en: "SELECT on the schema applies to all its tables, including wingtip.hr.salaries.", fr: "SELECT sur le schéma s'applique à toutes ses tables, y compris wingtip.hr.salaries." }
    c: { en: "MANAGE lets users manage permissions on the view but does not include SELECT.", fr: "MANAGE permet de gérer les autorisations de la vue mais n'inclut pas SELECT." }
references:
  - title: What is a view?
    url: https://learn.microsoft.com/en-us/azure/databricks/views/
