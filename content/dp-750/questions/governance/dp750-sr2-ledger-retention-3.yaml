status: draft
stem:
  en: You disable predictive optimization for the table.
  fr: Vous désactivez l'optimisation prédictive pour la table.
body:
  solution:
    en: |
      You run the following statement, and nobody runs `VACUUM` on the table manually.

      ```sql
      ALTER TABLE fab_prod.finance.ledger DISABLE PREDICTIVE OPTIMIZATION;
      ```
    fr: |
      Vous exécutez l'instruction suivante, et personne n'exécute `VACUUM` manuellement sur la table.

      ```sql
      ALTER TABLE fab_prod.finance.ledger DISABLE PREDICTIVE OPTIMIZATION;
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Without `VACUUM`, unreferenced data files are never removed, which breaks the storage cost requirement. Time travel still fails beyond the retention properties: the log is kept for its default of 30 days, and on Databricks Runtime 18.0 queries older than `delta.deletedFileRetentionDuration` (7 days by default) are blocked even if the files still exist. You must set both retention properties to 60 days instead.
    fr: |
      Sans `VACUUM`, les fichiers de données non référencés ne sont jamais supprimés, ce qui enfreint l'exigence de coût de stockage. Le voyage dans le temps échoue toujours au-delà des propriétés de rétention : le journal est conservé pendant sa durée par défaut de 30 jours et, sur Databricks Runtime 18.0, les requêtes antérieures à `delta.deletedFileRetentionDuration` (7 jours par défaut) sont bloquées même si les fichiers existent encore. Il faut plutôt définir les deux propriétés de rétention sur 60 jours.
references:
