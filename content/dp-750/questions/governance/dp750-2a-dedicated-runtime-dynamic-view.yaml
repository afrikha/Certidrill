id: dp750-2a-dedicated-runtime-dynamic-view
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data scientist at Contoso uses an all-purpose compute resource in dedicated access mode that runs Databricks Runtime 15.3. She has SELECT on the dynamic view **contoso.sales.orders_redacted** and the usage privileges on its catalog and schema, but no privilege on the underlying table **contoso.sales.orders**. The workspace is enabled for serverless compute.

    Her queries on the view fail. She must keep working from the same compute resource and access mode, and she must not receive any privilege on contoso.sales.orders.

    What should you do?
  fr: |
    Une data scientist de Contoso utilise une ressource de calcul polyvalent en mode d'accès dédié qui exécute Databricks Runtime 15.3. Elle dispose de SELECT sur la vue dynamique **contoso.sales.orders_redacted** et des privilèges d'utilisation sur son catalogue et son schéma, mais d'aucun privilège sur la table sous-jacente **contoso.sales.orders**. L'espace de travail est activé pour le calcul serverless.

    Ses requêtes sur la vue échouent. Elle doit continuer à travailler depuis la même ressource de calcul et le même mode d'accès, et elle ne doit recevoir aucun privilège sur contoso.sales.orders.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant SELECT on contoso.sales.orders to the owner of the view.", fr: "Accorder SELECT sur contoso.sales.orders au propriétaire de la vue." } }
    - { id: b, text: { en: "Enable Photon acceleration on the compute resource.", fr: "Activer l'accélération Photon sur la ressource de calcul." } }
    - { id: c, text: { en: "Grant MANAGE on the view to the data scientist.", fr: "Accorder MANAGE sur la vue à la data scientist." } }
    - { id: d, text: { en: "Change the Databricks Runtime version of the compute resource to 15.4 LTS or above.", fr: "Passer la version de Databricks Runtime de la ressource de calcul à 15.4 LTS ou ultérieure." } }
answer: { optionId: d }
explanation:
  correct:
    en: Dynamic views cannot be read from dedicated compute on Databricks Runtime 15.3 or below. On 15.4 LTS and above, data filtering runs on serverless compute, which the workspace has enabled, and only the view owner's permissions are checked on the underlying table, so the user needs nothing on contoso.sales.orders.
    fr: Les vues dynamiques ne peuvent pas être lues depuis un calcul dédié sous Databricks Runtime 15.3 ou antérieur. À partir de 15.4 LTS, le filtrage des données s'exécute sur le calcul serverless, activé dans l'espace de travail, et seules les autorisations du propriétaire de la vue sont vérifiées sur la table sous-jacente ; l'utilisatrice n'a donc besoin d'aucun privilège sur contoso.sales.orders.
  options:
    a: { en: "The view owner already needs access to the underlying data; the runtime version itself prevents reading dynamic views.", fr: "Le propriétaire de la vue doit déjà avoir accès aux données sous-jacentes ; c'est la version du runtime qui empêche de lire les vues dynamiques." }
    b: { en: "Photon speeds up queries but does not add support for dynamic views on dedicated compute.", fr: "Photon accélère les requêtes mais n'ajoute pas la prise en charge des vues dynamiques sur un calcul dédié." }
    c: { en: "MANAGE does not change the compute requirements, and she already has SELECT on the view.", fr: "MANAGE ne change pas les exigences de calcul, et elle dispose déjà de SELECT sur la vue." }
references:
  - title: Create a dynamic view
    url: https://learn.microsoft.com/en-us/azure/databricks/views/dynamic
  - title: What is a view?
    url: https://learn.microsoft.com/en-us/azure/databricks/views/
