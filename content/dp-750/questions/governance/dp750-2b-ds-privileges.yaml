id: dp750-2b-ds-privileges
objective: "2.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    At Adatum, members of the **sharing_admins** group must create Delta Sharing shares that contain tables of the **sales** catalog, create Databricks-to-Databricks recipients, and grant those recipients access to the shares. The group already has USE CATALOG, USE SCHEMA and SELECT on the sales catalog.

    The members must not be metastore admins. The solution must follow the principle of least privilege.

    Which two privileges on the metastore should you grant to sharing_admins? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Chez Adatum, les membres du groupe **sharing_admins** doivent créer des partages Delta Sharing qui contiennent des tables du catalogue **sales**, créer des destinataires Databricks-to-Databricks et accorder à ces destinataires l'accès aux partages. Le groupe dispose déjà de USE CATALOG, USE SCHEMA et SELECT sur le catalogue sales.

    Les membres ne doivent pas être administrateurs du metastore. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux privilèges sur le metastore à accorder à sharing_admins ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: CREATE PROVIDER }
    - { id: b, text: CREATE SHARE }
    - { id: c, text: CREATE CATALOG }
    - { id: d, text: CREATE RECIPIENT }
    - { id: e, text: USE PROVIDER }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      CREATE SHARE and CREATE RECIPIENT on the metastore delegate the creation of shares and recipients without the metastore admin role. A member who creates a share and a recipient owns both objects, so the member can add tables on which they have SELECT and grant the recipient access to the share.
    fr: |
      CREATE SHARE et CREATE RECIPIENT sur le metastore délèguent la création de partages et de destinataires sans le rôle d'administrateur du metastore. Un membre qui crée un partage et un destinataire est propriétaire des deux objets : il peut donc ajouter des tables sur lesquelles il dispose de SELECT et accorder au destinataire l'accès au partage.
  options:
    a:
      en: |
        CREATE PROVIDER is used on the recipient side to accept data shared by another organization.
      fr: |
        CREATE PROVIDER sert côté destinataire à accepter des données partagées par une autre organisation.
    c:
      en: |
        CREATE CATALOG lets a recipient mount shared data as a catalog; providers do not need it to share.
      fr: |
        CREATE CATALOG permet à un destinataire de monter des données partagées sous forme de catalogue ; les fournisseurs n'en ont pas besoin pour partager.
    e:
      en: |
        USE PROVIDER gives access to provider objects, which represent organizations sharing data with Adatum.
      fr: |
        USE PROVIDER donne accès aux objets fournisseurs, qui représentent les organisations partageant des données avec Adatum.
references:
  - title: Create shares for OpenSharing
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/create-share
  - title: Manage access to OpenSharing data shares (for providers)
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/grant-access
