id: dp750-2b-abac-runtime
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a schema named **ops.telemetry**. A column mask policy is attached to the schema. The policy applies to the `account users` group and masks every column tagged `pii` = `device_owner`.

    A Lakeflow job runs as a service principal named sp-reporting. Its notebook task runs on a classic job cluster in dedicated access mode with Databricks Runtime 15.4 LTS. Since the policy was created, the task fails when it reads tables in ops.telemetry.

    You need the task to read the tables successfully. The policy must continue to mask the tagged columns for sp-reporting.

    What should you do?
  fr: |
    Tailspin dispose d'un schéma nommé **ops.telemetry**. Une stratégie de masque de colonne est attachée au schéma. Elle s'applique au groupe `account users` et masque toutes les colonnes portant la balise `pii` = `device_owner`.

    Un job Lakeflow s'exécute sous l'identité d'un principal de service nommé sp-reporting. Sa tâche de notebook s'exécute sur un cluster de job classique en mode d'accès dédié avec Databricks Runtime 15.4 LTS. Depuis la création de la stratégie, la tâche échoue lorsqu'elle lit les tables d'ops.telemetry.

    Vous devez faire en sorte que la tâche lise correctement les tables. La stratégie doit continuer à masquer les colonnes balisées pour sp-reporting.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add sp-reporting to the EXCEPT clause of the policy.", fr: "Ajouter sp-reporting à la clause EXCEPT de la stratégie." }
    - id: b
      text: { en: "Run the task on serverless compute for jobs.", fr: "Exécuter la tâche sur le calcul serverless pour les jobs." }
    - id: c
      text: { en: "Enable Photon acceleration on the job cluster.", fr: "Activer l'accélération Photon sur le cluster de job." }
    - id: d
      text: { en: "Grant sp-reporting the MANAGE privilege on ops.telemetry.", fr: "Accorder à sp-reporting le privilège MANAGE sur ops.telemetry." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Tables secured by ABAC policies can be read only from serverless compute or from standard or dedicated compute on Databricks Runtime 16.4 or above (dedicated compute also needs fine-grained access control filtering). Runtime 15.4 LTS cannot access ABAC-secured tables, so moving the task to serverless compute fixes the failure while the policy still masks the columns.
    fr: |
      Les tables sécurisées par des stratégies ABAC ne peuvent être lues que depuis le calcul serverless ou depuis un calcul standard ou dédié sous Databricks Runtime 16.4 ou version ultérieure (le calcul dédié nécessite en plus le filtrage par contrôle d'accès affiné). Databricks Runtime 15.4 LTS ne peut pas accéder aux tables sécurisées par ABAC : exécuter la tâche sur le calcul serverless corrige l'échec tout en conservant le masquage.
  options:
    a:
      en: |
        An EXCEPT entry exempts sp-reporting from the policy, so the job would read unmasked data, which violates the requirement.
      fr: |
        Une entrée EXCEPT exempte sp-reporting de la stratégie : le job lirait des données non masquées, ce qui enfreint l'exigence.
    c:
      en: |
        Photon is a query engine; it does not change the runtime version that ABAC requires.
      fr: |
        Photon est un moteur de requête ; il ne change pas la version du runtime exigée par ABAC.
    d:
      en: |
        MANAGE lets the principal manage privileges and policies on the schema; it neither exempts it from the policy nor removes the runtime requirement.
      fr: |
        MANAGE permet au principal de gérer les privilèges et les stratégies du schéma ; il ne l'exempte pas de la stratégie et ne supprime pas l'exigence de version du runtime.
references:
  - title: Requirements, quotas, and limitations for row filter and column mask policies
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/abac/requirements
