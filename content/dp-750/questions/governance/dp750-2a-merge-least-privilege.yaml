id: dp750-2a-merge-least-privilege
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Lakeflow job that runs as a service principal named **sp-merge**. The job runs a MERGE INTO statement that inserts, updates and deletes rows in the Unity Catalog table **adatum.silver.customers**, based on a staging DataFrame held in memory.

    sp-merge already has USE CATALOG on adatum and USE SCHEMA on adatum.silver. The job must not be able to change permissions on the table or affect other tables of the schema.

    Which two privileges should you grant to sp-merge on adatum.silver.customers? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un job Lakeflow qui s'exécute en tant que principal de service nommé **sp-merge**. Le job exécute une instruction MERGE INTO qui insère, met à jour et supprime des lignes dans la table Unity Catalog **adatum.silver.customers**, à partir d'un DataFrame intermédiaire conservé en mémoire.

    sp-merge dispose déjà de USE CATALOG sur adatum et de USE SCHEMA sur adatum.silver. Le job ne doit pas pouvoir modifier les autorisations de la table ni affecter les autres tables du schéma.

    Quels sont les deux privilèges à accorder à sp-merge sur adatum.silver.customers ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: ALL PRIVILEGES }
    - { id: b, text: APPLY TAG }
    - { id: c, text: CREATE TABLE }
    - { id: d, text: SELECT }
    - { id: e, text: MODIFY }
    - { id: f, text: MANAGE }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: MODIFY lets a principal insert, update and delete the data of a table, and Unity Catalog requires the principal to also have SELECT on the table (plus the usage privileges on its parents). Granting both on the table itself keeps the job away from the other tables of the schema.
    fr: MODIFY permet à un principal d'insérer, de mettre à jour et de supprimer les données d'une table, et Unity Catalog exige que le principal dispose aussi de SELECT sur la table (en plus des privilèges d'utilisation sur ses parents). Les accorder sur la table elle-même tient le job à l'écart des autres tables du schéma.
  options:
    f: { en: "MANAGE lets the principal change permissions and drop the table, which the requirements forbid.", fr: "MANAGE permet au principal de modifier les autorisations et de supprimer la table, ce que les exigences interdisent." }
    a: { en: "ALL PRIVILEGES grants more than needed (for example APPLY TAG); SELECT and MODIFY are enough.", fr: "ALL PRIVILEGES accorde plus que nécessaire (par exemple APPLY TAG) ; SELECT et MODIFY suffisent." }
    b: { en: "APPLY TAG adds and edits tags; it does not allow changing rows.", fr: "APPLY TAG ajoute et modifie des balises ; il ne permet pas de modifier les lignes." }
    c: { en: "CREATE TABLE is a schema privilege for creating new tables; the job writes to an existing table.", fr: "CREATE TABLE est un privilège de schéma pour créer des tables ; le job écrit dans une table existante." }
references:
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
