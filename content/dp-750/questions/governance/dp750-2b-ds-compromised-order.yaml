id: dp750-2b-ds-compromised-order
objective: "2.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware shares the share **finance_share** with an external partner through a recipient named **partner_a** that authenticates with a bearer token. The activation link of partner_a was accidentally sent to the wrong person by email.

    You need to secure access to the shared data and restore the partner's access.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware partage le partage **finance_share** avec un partenaire externe via un destinataire nommé **partner_a** qui s'authentifie avec un jeton du porteur. Le lien d'activation de partner_a a été envoyé par erreur à la mauvaise personne par e-mail.

    Vous devez sécuriser l'accès aux données partagées et rétablir l'accès du partenaire.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: revoke, text: { en: "Revoke the access of partner_a to finance_share.", fr: "Révoquer l'accès de partner_a à finance_share." } }
    - { id: rotate0, text: { en: "Rotate the token of partner_a with an expiration of 0 seconds.", fr: "Faire pivoter le jeton de partner_a avec une expiration de 0 seconde." } }
    - { id: send, text: { en: "Send the new activation link to the partner over a secure channel.", fr: "Envoyer le nouveau lien d'activation au partenaire par un canal sécurisé." } }
    - { id: regrant, text: { en: "After the link is accessed, grant partner_a access to finance_share again.", fr: "Une fois le lien utilisé, accorder de nouveau à partner_a l'accès à finance_share." } }
    - { id: rotate24, text: { en: "Rotate the token of partner_a with an expiration of 86,400 seconds.", fr: "Faire pivoter le jeton de partner_a avec une expiration de 86 400 secondes." } }
    - { id: dropshare, text: { en: "Drop finance_share and create it again.", fr: "Supprimer finance_share et le recréer." } }
    - { id: emptyip, text: { en: "Assign an empty IP access list to partner_a.", fr: "Attribuer une liste d'accès IP vide à partner_a." } }
answer:
  sequence: [ revoke, rotate0, send, regrant ]
explanation:
  correct:
    en: |
      For a compromised activation link, you first revoke the recipient's access to the share, then rotate its token with an expiration of 0 so that the old token stops working immediately. You send the new activation link over a secure channel and grant access again only after the partner has used it.
    fr: |
      En cas de lien d'activation compromis, vous révoquez d'abord l'accès du destinataire au partage, puis vous faites pivoter son jeton avec une expiration de 0 afin que l'ancien jeton cesse immédiatement de fonctionner. Vous envoyez le nouveau lien d'activation par un canal sécurisé et vous rétablissez l'accès seulement après que le partenaire l'a utilisé.
  options:
    rotate24: { en: "A 24-hour expiration would leave the compromised token valid for a day.", fr: "Une expiration de 24 heures laisserait le jeton compromis valide pendant une journée." }
    dropshare: { en: "Dropping the share revokes every recipient and does not invalidate the compromised credential.", fr: "Supprimer le partage révoque tous les destinataires et n'invalide pas les informations d'identification compromises." }
    emptyip: { en: "An empty IP access list removes all IP restrictions, which allows access from anywhere.", fr: "Une liste d'accès IP vide supprime toutes les restrictions d'adresse IP, ce qui autorise l'accès depuis n'importe où." }
references:
  - title: Create a recipient object for non-Databricks users using bearer tokens (Databricks-to-Open sharing)
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/create-recipient-token
  - title: Restrict OpenSharing recipient access using IP access lists (Databricks-to-Open sharing)
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/access-list
