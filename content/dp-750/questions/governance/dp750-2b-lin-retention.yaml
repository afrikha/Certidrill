id: dp750-2b-lin-retention
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In November 2026, auditors at Woodgrove ask which upstream tables fed the table **finance.gold.risk_report** in September 2025. The table has been used continuously since 2024 on Unity Catalog compute, and the system tables use their default retention.

    A query on **system.access.table_lineage** returns no rows for September 2025.

    You need to obtain the upstream tables of September 2025.

    What should you use?
  fr: |
    En novembre 2026, les auditeurs de Woodgrove demandent quelles tables en amont alimentaient la table **finance.gold.risk_report** en septembre 2025. La table est utilisée en continu depuis 2024 sur un calcul Unity Catalog, et les tables système utilisent leur rétention par défaut.

    Une requête sur **system.access.table_lineage** ne renvoie aucune ligne pour septembre 2025.

    Vous devez obtenir les tables en amont de septembre 2025.

    Que devez-vous utiliser ?
body:
  options:
    - id: c
      text: { en: "The system.access.column_lineage system table", fr: "La table système system.access.column_lineage" }
    - id: b
      text: { en: "The output of DESCRIBE HISTORY finance.gold.risk_report", fr: "Le résultat de DESCRIBE HISTORY finance.gold.risk_report" }
    - id: a
      text: { en: "The Lineage tab of the table in Catalog Explorer", fr: "L'onglet Lineage de la table dans l'Explorateur de catalogue" }
    - id: d
      text: { en: "The system.access.audit system table", fr: "La table système system.access.audit" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Lineage shown in Catalog Explorer, and returned by the lineage API, is retained indefinitely for events captured after September 1, 2024. The lineage system tables keep only a rolling one-year window, so they no longer contain events from 14 months ago.
    fr: |
      La lignée affichée dans l'Explorateur de catalogue, et renvoyée par l'API de lignée, est conservée indéfiniment pour les événements capturés après le 1er septembre 2024. Les tables système de lignée ne conservent qu'une fenêtre glissante d'un an : elles ne contiennent plus les événements d'il y a 14 mois.
  options:
    c:
      en: |
        The column lineage system table has the same rolling one-year retention as the table lineage system table.
      fr: |
        La table système de lignée des colonnes a la même rétention glissante d'un an que la table système de lignée des tables.
    b:
      en: |
        Table history lists the operations on the table itself, by default for 30 days, and not its upstream sources.
      fr: |
        L'historique de la table liste les opérations effectuées sur la table elle-même, par défaut sur 30 jours, et non ses sources en amont.
    d:
      en: |
        Audit events record who did what, not lineage relationships, and they are also kept for about one year.
      fr: |
        Les événements d'audit enregistrent qui a fait quoi, pas les relations de lignée, et ils sont aussi conservés environ un an.
references:
  - title: Lineage in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/data-lineage
  - title: Lineage system tables reference
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/lineage
