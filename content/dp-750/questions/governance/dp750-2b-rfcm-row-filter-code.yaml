id: dp750-2b-rfcm-row-filter-code
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a table named **sales.core.orders** with a STRING column named **region**. Regional analysts must see only the rows where region is `EMEA`. Members of the **sales_admins** account group must see all the rows.

    You create the function and apply it to the table by running the following statements.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une table nommée **sales.core.orders** avec une colonne STRING nommée **region**. Les analystes régionaux doivent voir uniquement les lignes dont la région est `EMEA`. Les membres du groupe de compte **sales_admins** doivent voir toutes les lignes.

    Vous créez la fonction et l'appliquez à la table en exécutant les instructions suivantes.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE FUNCTION sales.security.emea_filter(region STRING)
      RETURN IF(is_account_group_member('sales_admins'), [[ret]], region = 'EMEA');

    ALTER TABLE sales.core.orders
      SET ROW FILTER sales.security.emea_filter [[kw]] (region);
  slots:
    - id: ret
      options:
        - { id: "false", text: "false" }
        - { id: "true", text: "true" }
        - { id: "null", text: "NULL" }
        - { id: region, text: region }
    - id: kw
      options:
        - { id: usingcolumns, text: USING COLUMNS }
        - { id: with, text: WITH }
        - { id: "on", text: "ON" }
        - { id: for, text: FOR }
answer:
  values: { ret: "true", kw: "on" }
explanation:
  correct:
    en: |
      A row filter function returns a Boolean for each row, and rows for which it returns FALSE are excluded, so returning true for sales_admins keeps every row for them while the others keep only the EMEA rows. ALTER TABLE … SET ROW FILTER function ON (column, …) maps the table columns to the function parameters.
    fr: |
      Une fonction de filtre de lignes renvoie une valeur booléenne pour chaque ligne, et les lignes pour lesquelles elle renvoie FALSE sont exclues : renvoyer true pour sales_admins leur conserve toutes les lignes, tandis que les autres ne gardent que les lignes EMEA. ALTER TABLE … SET ROW FILTER fonction ON (colonne, …) associe les colonnes de la table aux paramètres de la fonction.
  options:
    "false": { en: "Returning false would hide every row from sales_admins.", fr: "Renvoyer false masquerait toutes les lignes pour sales_admins." }
    "null": { en: "A NULL result does not keep the row, so administrators would see nothing.", fr: "Un résultat NULL ne conserve pas la ligne : les administrateurs ne verraient rien." }
    region: { en: "The function must return a Boolean; region is a STRING value.", fr: "La fonction doit renvoyer une valeur booléenne ; region est une valeur STRING." }
    usingcolumns: { en: "USING COLUMNS passes extra arguments to a column mask; a row filter uses ON (…).", fr: "USING COLUMNS passe des arguments supplémentaires à un masque de colonne ; un filtre de lignes utilise ON (…)." }
references:
  - title: Manually apply row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/manually-apply
