id: dp750-2a-manage-privilege-yn
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Unity Catalog table named **northwind.sales.invoices** that is owned by a group named **finance-owners**.

    A user named Ana is not a member of finance-owners. Ana has USE CATALOG on northwind and USE SCHEMA on northwind.sales. On the table, Ana has only the MANAGE privilege.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une table Unity Catalog nommée **northwind.sales.invoices** dont le propriétaire est un groupe nommé **finance-owners**.

    Une utilisatrice nommée Ana n'est pas membre de finance-owners. Ana dispose de USE CATALOG sur northwind et de USE SCHEMA sur northwind.sales. Sur la table, Ana dispose uniquement du privilège MANAGE.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Ana can grant SELECT on northwind.sales.invoices to another group.
        fr: Ana peut accorder SELECT sur northwind.sales.invoices à un autre groupe.
    - id: s2
      text:
        en: Ana can query northwind.sales.invoices without any additional grant.
        fr: Ana peut interroger northwind.sales.invoices sans aucune autorisation supplémentaire.
    - id: s3
      text:
        en: Ana can drop northwind.sales.invoices.
        fr: Ana peut supprimer northwind.sales.invoices.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: MANAGE lets a principal grant and revoke privileges, transfer ownership, rename and drop the object. Unlike ownership, MANAGE does not include the other capabilities on the object, so Ana must first grant herself SELECT before she can read the data.
    fr: MANAGE permet à un principal d'accorder et de révoquer des privilèges, de transférer la propriété, de renommer et de supprimer l'objet. Contrairement à la propriété, MANAGE n'inclut pas les autres capacités sur l'objet ; Ana doit donc d'abord s'accorder SELECT avant de pouvoir lire les données.
references:
  - title: Unity Catalog permissions model concepts
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/access-control/permissions-concepts
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
