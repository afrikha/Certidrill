id: dp750-2a-try-secret-sql
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Key Vault-backed secret scope named **kv-bi**. A Databricks SQL query must compute a hash of the secret stored under the key **api-key**.

    The query is shared by several teams. If the secret cannot be retrieved for the user who runs the query, the expression must return NULL instead of failing the query.

    Which expression should you use?
  fr: |
    Adatum dispose d'une étendue de secrets reposant sur Azure Key Vault nommée **kv-bi**. Une requête Databricks SQL doit calculer un hachage du secret stocké sous la clé **api-key**.

    La requête est partagée par plusieurs équipes. Si le secret ne peut pas être récupéré pour l'utilisateur qui exécute la requête, l'expression doit renvoyer NULL au lieu de faire échouer la requête.

    Quelle expression devez-vous utiliser ?
body:
  options:
    - { id: a, text: "sha2(secret('kv-bi', 'api-key'), 256)" }
    - { id: b, text: "sha2((SELECT key FROM list_secrets() WHERE scope = 'kv-bi'), 256)" }
    - { id: c, text: "sha2(dbutils.secrets.get('kv-bi', 'api-key'), 256)" }
    - { id: d, text: "sha2(try_secret('kv-bi', 'api-key'), 256)" }
answer: { optionId: d }
explanation:
  correct:
    en: The SQL secret(scope, key) function extracts a secret value but raises INVALID_SECRET_LOOKUP when the key cannot be retrieved; try_secret() takes the same arguments and returns NULL instead. Wrapping the secret in a cryptographic function such as sha2() is a supported pattern.
    fr: La fonction SQL secret(scope, key) extrait la valeur d'un secret mais déclenche INVALID_SECRET_LOOKUP lorsque la clé ne peut pas être récupérée ; try_secret() prend les mêmes arguments et renvoie NULL à la place. Envelopper le secret dans une fonction de chiffrement comme sha2() est un modèle pris en charge.
  options:
    a: { en: "secret() raises an error when the lookup fails, which fails the query.", fr: "secret() déclenche une erreur lorsque la recherche échoue, ce qui fait échouer la requête." }
    b: { en: "list_secrets() returns scope and key names, not secret values.", fr: "list_secrets() renvoie des noms d'étendues et de clés, pas les valeurs des secrets." }
    c: { en: "dbutils is a notebook utility for Python, Scala and R; it cannot be called from Databricks SQL.", fr: "dbutils est un utilitaire de notebook pour Python, Scala et R ; il ne peut pas être appelé depuis Databricks SQL." }
references:
  - title: secret function
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/secret
