id: dp750-2b-ds-dynamic-view
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware shares data with regional distributors by using Databricks-to-Databricks Delta Sharing. Each distributor is a recipient with a custom recipient property named `region`.

    The table **sales.core.orders** is not partitioned and has a STRING column named **region**. Each distributor must see only the orders of its own region. The solution must not copy data into new tables and must use a single share for all distributors. You run the statements from a SQL warehouse.

    What should you do?
  fr: |
    Litware partage des données avec ses distributeurs régionaux à l'aide du partage Delta Sharing Databricks-to-Databricks. Chaque distributeur est un destinataire doté d'une propriété de destinataire personnalisée nommée `region`.

    La table **sales.core.orders** n'est pas partitionnée et comporte une colonne STRING nommée **region**. Chaque distributeur ne doit voir que les commandes de sa propre région. La solution ne doit pas copier de données dans de nouvelles tables et doit utiliser un seul partage pour tous les distributeurs. Vous exécutez les instructions depuis un entrepôt SQL.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set a table-level row filter on sales.core.orders that compares region with CURRENT_RECIPIENT('region'), and add the table to the share.", fr: "Définir sur sales.core.orders un filtre de lignes au niveau de la table qui compare region à CURRENT_RECIPIENT('region'), puis ajouter la table au partage." }
    - id: b
      text: { en: "Add sales.core.orders to the share with a PARTITION clause that compares region with the recipient property.", fr: "Ajouter sales.core.orders au partage avec une clause PARTITION qui compare region à la propriété du destinataire." }
    - id: c
      text: { en: "Create a view on sales.core.orders that filters region with CURRENT_RECIPIENT('region'), and add the view to the share.", fr: "Créer sur sales.core.orders une vue qui filtre region avec CURRENT_RECIPIENT('region'), puis ajouter la vue au partage." }
    - id: d
      text: { en: "Create an ABAC row filter policy on sales.core.orders whose TO clause lists the distributor recipients, and add the table to the share.", fr: "Créer sur sales.core.orders une stratégie ABAC de filtre de lignes dont la clause TO liste les destinataires distributeurs, puis ajouter la table au partage." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A shared dynamic view can filter rows with CURRENT_RECIPIENT, which returns a property of the recipient that runs the query, so one share serves every distributor without copying data. The provider cannot query such a view directly; to test it, the provider shares it with itself.
    fr: |
      Une vue dynamique partagée peut filtrer les lignes avec CURRENT_RECIPIENT, qui renvoie une propriété du destinataire qui exécute la requête : un seul partage sert ainsi tous les distributeurs sans copie de données. Le fournisseur ne peut pas interroger directement une telle vue ; pour la tester, il la partage avec lui-même.
  options:
    a:
      en: |
        Providers cannot share tables that have table-level row filters or column masks.
      fr: |
        Les fournisseurs ne peuvent pas partager des tables qui ont des filtres de lignes ou des masques de colonne au niveau de la table.
    b:
      en: |
        A PARTITION clause selects partitions of a partitioned table; sales.core.orders has no partition column.
      fr: |
        Une clause PARTITION sélectionne des partitions d'une table partitionnée ; sales.core.orders n'a pas de colonne de partition.
    d:
      en: |
        ABAC policies apply to account principals and do not govern recipient access; the share owner must even be exempt from the policy to share the table.
      fr: |
        Les stratégies ABAC s'appliquent aux principaux du compte et ne régissent pas l'accès des destinataires ; le propriétaire du partage doit même être exempté de la stratégie pour partager la table.
references:
  - title: Create shares for OpenSharing
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/create-share
  - title: Design secure Delta Sharing strategy
    url: https://learn.microsoft.com/en-us/training/modules/govern-unity-catalog-objects/7-secure-delta-sharing-strategy
