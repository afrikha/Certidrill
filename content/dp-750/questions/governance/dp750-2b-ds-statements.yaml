id: dp750-2b-ds-statements
objective: "2.2.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin is designing its Delta Sharing strategy. Some partners use Azure Databricks with Unity Catalog, and others use open sharing clients with bearer tokens. Some tables of the **ops** catalog are protected by ABAC column mask policies.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin conçoit sa stratégie Delta Sharing. Certains partenaires utilisent Azure Databricks avec Unity Catalog, d'autres des clients de partage ouvert avec des jetons du porteur. Certaines tables du catalogue **ops** sont protégées par des stratégies ABAC de masque de colonne.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An open sharing recipient can download its credential file from the activation link only one time.
        fr: |
          Un destinataire du partage ouvert ne peut télécharger son fichier d'informations d'identification depuis le lien d'activation qu'une seule fois.
    - id: s2
      text:
        en: |
          When you add the ops.flights schema to a share, tables created later in ops.flights also become available to the recipients of the share.
        fr: |
          Lorsque vous ajoutez le schéma ops.flights à un partage, les tables créées ultérieurement dans ops.flights deviennent elles aussi accessibles aux destinataires du partage.
    - id: s3
      text:
        en: |
          A share owner who has SELECT on a table protected by an ABAC column mask policy can add it to a share, and the policy then masks the data for the recipients.
        fr: |
          Un propriétaire de partage qui dispose de SELECT sur une table protégée par une stratégie ABAC de masque de colonne peut l'ajouter à un partage, et la stratégie masque alors les données pour les destinataires.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The credential file of a bearer token recipient can be downloaded only once, so it must be treated as a secret. Sharing a schema gives recipients its current and future tables, views and volumes, which is why schema sharing must be used with care. A table governed by ABAC can be shared only by a share owner who is exempt from the policy, and the policy does not govern recipient access, so recipients get unmasked data.
    fr: |
      Le fichier d'informations d'identification d'un destinataire à jeton du porteur ne peut être téléchargé qu'une seule fois : il doit être traité comme un secret. Le partage d'un schéma donne aux destinataires ses tables, vues et volumes actuels et futurs, d'où la prudence nécessaire avec le partage de schémas. Une table régie par ABAC ne peut être partagée que par un propriétaire de partage exempté de la stratégie, et la stratégie ne régit pas l'accès des destinataires : ceux-ci obtiennent des données non masquées.
references:
  - title: Create a recipient object for non-Databricks users using bearer tokens (Databricks-to-Open sharing)
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/create-recipient-token
  - title: Create shares for OpenSharing
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/create-share
