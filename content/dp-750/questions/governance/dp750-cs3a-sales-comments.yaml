id: dp750-cs3a-sales-comments
objective: "2.2.1"
type: single
caseStudy: dp750-cs3a-proseware
difficulty: 1
status: draft
stem:
  en: You need to meet Shop Assistant requirement 4. What should you do?
  fr: Vous devez satisfaire l'exigence 4 de Shop Assistant. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Edit the table and column descriptions of gold.sales in the knowledge store of Shop Assistant.", fr: "Modifier les descriptions de la table et des colonnes de gold.sales dans la base de connaissances de Shop Assistant." } }
    - { id: b, text: { en: "Add a text instruction to Shop Assistant that describes gold.sales and each of its columns.", fr: "Ajouter à Shop Assistant une instruction texte qui décrit gold.sales et chacune de ses colonnes." } }
    - { id: c, text: { en: "Add COMMENT ON TABLE and COMMENT ON COLUMN statements for gold.sales to the SQL scripts.", fr: "Ajouter aux scripts SQL des instructions COMMENT ON TABLE et COMMENT ON COLUMN pour gold.sales." } }
    - { id: d, text: { en: "Assign governed tags that contain the descriptions to gold.sales and to each of its columns.", fr: "Attribuer à gold.sales et à chacune de ses colonnes des balises gouvernées qui contiennent les descriptions." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      COMMENT ON TABLE and COMMENT ON COLUMN store the descriptions as Unity Catalog metadata, which Catalog Explorer displays and which every Genie agent shows as the default description of the table. Because they are SQL statements, they live in the scripts stored in Git with the table definition.
    fr: |
      COMMENT ON TABLE et COMMENT ON COLUMN stockent les descriptions comme métadonnées Unity Catalog, que Catalog Explorer affiche et que chaque agent Genie présente comme description par défaut de la table. Comme ce sont des instructions SQL, elles se trouvent dans les scripts stockés dans Git avec la définition de la table.
  options:
    a: { en: "Knowledge store settings are scoped to one Genie agent and do not change Unity Catalog metadata, so Catalog Explorer and other agents would not see them.", fr: "Les paramètres de la base de connaissances sont propres à un agent Genie et ne modifient pas les métadonnées Unity Catalog : Catalog Explorer et les autres agents ne les verraient pas." }
    b: { en: "A text instruction belongs to one Genie agent and is not shown in Catalog Explorer.", fr: "Une instruction texte appartient à un seul agent Genie et n'apparaît pas dans Catalog Explorer." }
    d: { en: "Governed tags classify objects for discovery and access policies; they do not set the table and column descriptions.", fr: "Les balises gouvernées classent les objets pour la découverte et les stratégies d'accès ; elles ne définissent pas les descriptions des tables et des colonnes." }
references:
  - title: COMMENT ON
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-comment
  - title: Tune Genie Agent quality
    url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/tune-quality
