id: dp750-2b-ds-token-lifetime
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove shares tables with six external partners by using open sharing. Each partner is a recipient that authenticates with a bearer token. The tokens were issued with the metastore's current recipient token lifetime of one year.

    A new security policy requires every recipient token, including the tokens of the existing recipients, to expire no more than 90 days after it is issued.

    What should you do?
  fr: |
    Woodgrove partage des tables avec six partenaires externes à l'aide du partage ouvert. Chaque partenaire est un destinataire qui s'authentifie avec un jeton du porteur. Les jetons ont été émis avec la durée de vie actuelle des jetons de destinataire du metastore, qui est d'un an.

    Une nouvelle stratégie de sécurité impose que chaque jeton de destinataire, y compris ceux des destinataires existants, expire au plus 90 jours après son émission.

    Que devez-vous faire ?
body:
  options:
    - id: c
      text: { en: "Set the recipient token lifetime of the metastore to 90 days.", fr: "Définir la durée de vie des jetons de destinataire du metastore sur 90 jours." }
    - id: b
      text: { en: "Rotate the token of each existing recipient with an expiration of 0 seconds.", fr: "Faire pivoter le jeton de chaque destinataire existant avec une expiration de 0 seconde." }
    - id: a
      text: { en: "Set the recipient token lifetime of the metastore to 90 days, and then rotate the token of each existing recipient.", fr: "Définir la durée de vie des jetons de destinataire du metastore sur 90 jours, puis faire pivoter le jeton de chaque destinataire existant." }
    - id: d
      text: { en: "Configure an IP access list on each recipient, and then rotate the token of each existing recipient.", fr: "Configurer une liste d'accès IP sur chaque destinataire, puis faire pivoter le jeton de chaque destinataire existant." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      New tokens get the metastore's recipient token lifetime, but changing that default does not apply to tokens that already exist. After you lower the lifetime to 90 days, rotating the token of each existing recipient issues a new token with the 90-day lifetime.
    fr: |
      Les nouveaux jetons reçoivent la durée de vie des jetons de destinataire du metastore, mais la modification de cette valeur par défaut ne s'applique pas aux jetons existants. Après avoir réduit la durée de vie à 90 jours, faire pivoter le jeton de chaque destinataire existant émet un nouveau jeton d'une durée de vie de 90 jours.
  options:
    c:
      en: |
        The new default applies only to new tokens; the existing recipients keep their one-year tokens until they are rotated.
      fr: |
        La nouvelle valeur par défaut ne s'applique qu'aux nouveaux jetons ; les destinataires existants conservent leurs jetons d'un an jusqu'à leur rotation.
    b:
      en: |
        Rotation expires the old token, but the new token still gets the one-year lifetime of the metastore.
      fr: |
        La rotation fait expirer l'ancien jeton, mais le nouveau jeton reçoit toujours la durée de vie d'un an du metastore.
    d:
      en: |
        An IP access list restricts where requests come from; it does not change how long tokens remain valid.
      fr: |
        Une liste d'accès IP restreint la provenance des requêtes ; elle ne change pas la durée de validité des jetons.
references:
  - title: Create a recipient object for non-Databricks users using bearer tokens (Databricks-to-Open sharing)
    url: https://learn.microsoft.com/en-us/azure/databricks/opensharing/create-recipient-token
