id: dp750-2a-mi-access-connector
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso wants Unity Catalog to access an Azure Data Lake Storage account named **stcontosocurated** by using an Azure managed identity instead of a service principal. You plan to create a storage credential of type Azure Managed Identity in Catalog Explorer.

    Which Azure resource should you create first to hold the managed identity?
  fr: |
    Contoso souhaite qu'Unity Catalog accède à un compte Azure Data Lake Storage nommé **stcontosocurated** à l'aide d'une identité managée Azure plutôt que d'un principal de service. Vous prévoyez de créer des informations d'identification de stockage de type Azure Managed Identity dans l'Explorateur de catalogues.

    Quelle ressource Azure devez-vous créer en premier pour porter l'identité managée ?
body:
  options:
    - { id: a, text: { en: "An Azure Key Vault-backed secret scope", fr: "Une étendue de secrets reposant sur Azure Key Vault" } }
    - { id: b, text: { en: "An Access Connector for Azure Databricks", fr: "Un connecteur d'accès pour Azure Databricks (Access Connector for Azure Databricks)" } }
    - { id: c, text: { en: "An app registration in Microsoft Entra ID with a client secret", fr: "Une inscription d'application dans Microsoft Entra ID avec une clé secrète client" } }
    - { id: d, text: { en: "A private endpoint for stcontosocurated", fr: "Un point de terminaison privé pour stcontosocurated" } }
answer: { optionId: b }
explanation:
  correct:
    en: Unity Catalog uses a managed identity through an Access Connector for Azure Databricks, which has a system-assigned managed identity, one or more user-assigned managed identities, or both. You record the connector's resource ID, grant its identity a role on the storage account, and reference the connector in the storage credential.
    fr: Unity Catalog utilise une identité managée par l'intermédiaire d'un connecteur d'accès pour Azure Databricks, qui porte une identité managée affectée par le système, une ou plusieurs identités managées affectées par l'utilisateur, ou les deux. Vous notez l'ID de ressource du connecteur, attribuez un rôle à son identité sur le compte de stockage et référencez le connecteur dans les informations d'identification de stockage.
  options:
    c: { en: "An app registration with a client secret is a service principal, which the requirement replaces.", fr: "Une inscription d'application avec une clé secrète client est un principal de service, que l'exigence veut remplacer." }
    d: { en: "A private endpoint provides network connectivity; it does not provide an identity.", fr: "Un point de terminaison privé fournit une connectivité réseau ; il ne fournit pas d'identité." }
    a: { en: "A secret scope stores secrets; a managed identity removes the need for a secret.", fr: "Une étendue de secrets stocke des secrets ; une identité managée supprime le besoin d'un secret." }
references:
  - title: Use Azure managed identities in Unity Catalog to access storage
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/azure-managed-identities
