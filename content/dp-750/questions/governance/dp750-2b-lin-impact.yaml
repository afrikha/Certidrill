id: dp750-2b-lin-impact
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin plans to drop the column **discount_pct** from the table **sales.silver.orders**. Before the change, you must identify the downstream columns that are derived from discount_pct. All the workloads run on Unity Catalog compute and reference tables by their three-level names.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin prévoit de supprimer la colonne **discount_pct** de la table **sales.silver.orders**. Avant cette modification, vous devez identifier les colonnes en aval dérivées de discount_pct. Toutes les charges de travail s'exécutent sur un calcul Unity Catalog et référencent les tables par leur nom en trois parties.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run DESCRIBE HISTORY sales.silver.orders and review the operationMetrics column.", fr: "Exécuter DESCRIBE HISTORY sales.silver.orders et examiner la colonne operationMetrics." } }
    - { id: b, text: { en: "Query system.access.column_lineage for rows whose source table is sales.silver.orders and whose source column is discount_pct.", fr: "Interroger system.access.column_lineage pour les lignes dont la table source est sales.silver.orders et la colonne source discount_pct." } }
    - { id: c, text: { en: "Query system.access.audit for the updatePermissions events on sales.silver.orders.", fr: "Interroger system.access.audit pour les événements updatePermissions sur sales.silver.orders." } }
    - { id: d, text: { en: "Open the lineage graph of sales.silver.orders in Catalog Explorer and select the discount_pct column.", fr: "Ouvrir le graphe de lignée de sales.silver.orders dans l'Explorateur de catalogue et sélectionner la colonne discount_pct." } }
    - { id: e, text: { en: "Run SHOW GRANTS ON TABLE sales.silver.orders.", fr: "Exécuter SHOW GRANTS ON TABLE sales.silver.orders." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Unity Catalog captures column-level lineage. In the Catalog Explorer lineage graph, selecting a column highlights the upstream and downstream columns linked to it. The system.access.column_lineage table holds the same dependencies, with source_column_name and target_column_name, so a query filtered on the source table and column returns the derived columns.
    fr: |
      Unity Catalog capture la lignée au niveau des colonnes. Dans le graphe de lignée de l'Explorateur de catalogue, la sélection d'une colonne met en évidence les colonnes en amont et en aval qui lui sont liées. La table system.access.column_lineage contient les mêmes dépendances, avec source_column_name et target_column_name : une requête filtrée sur la table et la colonne sources renvoie les colonnes dérivées.
  options:
    a:
      en: |
        Table history lists the operations on the table itself; it does not show which downstream columns depend on it.
      fr: |
        L'historique de la table liste les opérations effectuées sur la table elle-même ; il n'indique pas quelles colonnes en aval en dépendent.
    c:
      en: |
        updatePermissions events track privilege changes, not data dependencies.
      fr: |
        Les événements updatePermissions suivent les modifications de privilèges, pas les dépendances de données.
    e:
      en: |
        SHOW GRANTS lists privileges on the table, not its downstream dependencies.
      fr: |
        SHOW GRANTS liste les privilèges sur la table, pas ses dépendances en aval.
references:
  - title: Lineage in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/data-lineage
  - title: Lineage system tables reference
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/lineage
