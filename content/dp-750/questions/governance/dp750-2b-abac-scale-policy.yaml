id: dp750-2b-abac-scale-policy
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Unity Catalog catalog named **prod** that contains more than 300 tables across 12 schemas. Data stewards tag every column that stores an email address with the governed tag `pii` = `email`. New tables are added to the catalog every week.

    You need to ensure that members of the **analysts** group see masked values in every email column of the catalog, including the columns of tables created in the future. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Contoso dispose d'un catalogue Unity Catalog nommé **prod** qui contient plus de 300 tables réparties dans 12 schémas. Les gestionnaires de données appliquent la balise gouvernée `pii` = `email` à chaque colonne qui stocke une adresse e-mail. De nouvelles tables sont ajoutées au catalogue chaque semaine.

    Vous devez faire en sorte que les membres du groupe **analysts** voient des valeurs masquées dans toutes les colonnes d'adresse e-mail du catalogue, y compris celles des tables créées à l'avenir. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run ALTER TABLE … ALTER COLUMN … SET MASK on each email column of the catalog.", fr: "Exécuter ALTER TABLE … ALTER COLUMN … SET MASK sur chaque colonne d'adresse e-mail du catalogue." }
    - id: b
      text: { en: "Create a dynamic view over each table and grant the analysts group SELECT on the views only.", fr: "Créer une vue dynamique sur chaque table et accorder au groupe analysts SELECT sur les vues uniquement." }
    - id: c
      text: { en: "Create a column mask policy on the prod catalog that matches columns tagged pii = email.", fr: "Créer une stratégie de masque de colonne sur le catalogue prod qui cible les colonnes portant la balise pii = email." }
    - id: d
      text: { en: "Create a row filter policy on the prod catalog that matches tables tagged pii = email.", fr: "Créer une stratégie de filtre de lignes sur le catalogue prod qui cible les tables portant la balise pii = email." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An ABAC column mask policy attached to the catalog is evaluated at query time against the governed tags of every table in the catalog. Its MATCH COLUMNS condition (has_tag_value('pii', 'email')) selects the tagged columns, so a new table is protected as soon as its column carries the tag, with no per-table work.
    fr: |
      Une stratégie ABAC de masque de colonne attachée au catalogue est évaluée au moment de la requête par rapport aux balises gouvernées de toutes les tables du catalogue. Sa condition MATCH COLUMNS (has_tag_value('pii', 'email')) sélectionne les colonnes balisées : une nouvelle table est protégée dès que sa colonne porte la balise, sans aucune action par table.
  options:
    a:
      en: |
        A table-level column mask works, but it must be set on every column of every table, including each new table, which does not minimize administrative effort.
      fr: |
        Un masque de colonne au niveau de la table fonctionne, mais il faut le définir sur chaque colonne de chaque table, y compris chaque nouvelle table, ce qui ne réduit pas l'effort d'administration.
    b:
      en: |
        Dynamic views must be created and maintained per table, and new tables would stay unprotected until someone creates their view.
      fr: |
        Les vues dynamiques doivent être créées et maintenues table par table, et les nouvelles tables resteraient non protégées jusqu'à la création de leur vue.
    d:
      en: |
        A row filter policy hides entire rows; it does not mask the values of a column.
      fr: |
        Une stratégie de filtre de lignes masque des lignes entières ; elle ne masque pas les valeurs d'une colonne.
references:
  - title: Attribute-based access control in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/abac/
  - title: Create and manage row filter and column mask policies
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/abac/policies
