id: dp750-cs1a-managed-identity
objective: "2.1.5"
type: ordering
caseStudy: dp750-cs1a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to make stlamnaclinical available to Unity Catalog as an external location that can store managed tables. The solution must meet the storage and isolation requirements.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez rendre stlamnaclinical disponible dans Unity Catalog sous la forme d'un emplacement externe pouvant stocker des tables managées. La solution doit respecter les exigences de stockage et d'isolation.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: connector, text: { en: "Create an Access Connector for Azure Databricks with a system-assigned managed identity.", fr: "Créer un Access Connector for Azure Databricks avec une identité managée affectée par le système." } }
    - { id: role, text: { en: "Assign the Storage Blob Data Contributor role on stlamnaclinical to the access connector.", fr: "Attribuer le rôle Storage Blob Data Contributor sur stlamnaclinical à l'Access Connector." } }
    - { id: credential, text: { en: "Create a storage credential that references the resource ID of the access connector.", fr: "Créer des informations d'identification de stockage qui référencent l'ID de ressource de l'Access Connector." } }
    - { id: location, text: { en: "Create an external location for the clinical container that uses the storage credential.", fr: "Créer un emplacement externe pour le conteneur clinical qui utilise les informations d'identification de stockage." } }
    - { id: reader, text: { en: "Assign the Storage Blob Data Reader role on stlamnaclinical to the access connector.", fr: "Attribuer le rôle Storage Blob Data Reader sur stlamnaclinical à l'Access Connector." } }
    - { id: secret, text: { en: "Store the client secret of a Microsoft Entra application in an Azure Key Vault-backed secret scope.", fr: "Stocker le secret client d'une application Microsoft Entra dans une étendue de secrets adossée à Azure Key Vault." } }
answer:
  sequence: [ connector, role, credential, location ]
explanation:
  correct:
    en: |
      The managed identity of an Access Connector for Azure Databricks needs no secret to rotate. The connector must first exist and be granted Storage Blob Data Contributor on the storage account; a storage credential then wraps the connector's resource ID, and an external location combines a storage path with that credential.
    fr: |
      L'identité managée d'un Access Connector for Azure Databricks n'a aucun secret à renouveler. Le connecteur doit d'abord exister et recevoir le rôle Storage Blob Data Contributor sur le compte de stockage ; des informations d'identification de stockage encapsulent ensuite l'ID de ressource du connecteur, et un emplacement externe associe un chemin de stockage à ces informations d'identification.
  options:
    reader: { en: "Managed tables are written to the location, so a read-only role is not enough.", fr: "Les tables managées sont écrites dans l'emplacement : un rôle en lecture seule ne suffit pas." }
    secret: { en: "A client secret must be rotated, which the requirements forbid; the managed identity replaces it.", fr: "Un secret client doit être renouvelé, ce que les exigences interdisent ; l'identité managée le remplace." }
references:
  - title: Use Azure managed identities in Unity Catalog to access storage
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/azure-managed-identities
