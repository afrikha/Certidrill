id: dp750-2a-kv-scope-facts
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to create an Azure Key Vault-backed secret scope named **kv-ops** that references an Azure key vault named **kv-woodgrove-ops**. Notebooks will read the secrets with dbutils.secrets.get().

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit de créer une étendue de secrets reposant sur Azure Key Vault nommée **kv-ops** qui référence un coffre de clés Azure nommé **kv-woodgrove-ops**. Les notebooks liront les secrets avec dbutils.secrets.get().

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The values returned by dbutils.secrets.get() are displayed in plain text in the notebook output.", fr: "Les valeurs renvoyées par dbutils.secrets.get() s'affichent en clair dans la sortie du notebook." } }
    - { id: b, text: { en: "You can grant a group READ on one secret of kv-ops without giving it access to the other secrets of the scope.", fr: "Vous pouvez accorder à un groupe READ sur un seul secret de kv-ops sans lui donner accès aux autres secrets de l'étendue." } }
    - { id: c, text: { en: "Creating kv-ops grants the Get and List permissions on kv-woodgrove-ops to the Azure Databricks application.", fr: "La création de kv-ops accorde les autorisations Get et List sur kv-woodgrove-ops à l'application Azure Databricks." } }
    - { id: d, text: { en: "Secrets of kv-ops are added and updated in Azure Key Vault, not with the Databricks CLI.", fr: "Les secrets de kv-ops s'ajoutent et se mettent à jour dans Azure Key Vault, pas avec l'interface CLI Databricks." } }
    - { id: e, text: { en: "kv-ops can be created while kv-woodgrove-ops uses the Azure RBAC permission model.", fr: "kv-ops peut être créée alors que kv-woodgrove-ops utilise le modèle d'autorisation Azure RBAC." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: When you create a Key Vault-backed scope, Azure Databricks receives the Get and List permissions on the vault through a vault access policy. The scope is a read-only interface to the vault, so you create, update and delete its secrets in Azure.
    fr: Lorsque vous créez une étendue reposant sur Azure Key Vault, Azure Databricks reçoit les autorisations Get et List sur le coffre au moyen d'une stratégie d'accès au coffre. L'étendue est une interface en lecture seule vers le coffre ; vous créez, mettez à jour et supprimez donc ses secrets dans Azure.
  options:
    e: { en: "Key Vault-backed scopes support only the Vault access policy permission model.", fr: "Les étendues reposant sur Azure Key Vault ne prennent en charge que le modèle Stratégie d'accès au coffre." }
    a: { en: "Azure Databricks replaces secret values read with dbutils.secrets.get() by [REDACTED] when they are displayed.", fr: "Azure Databricks remplace par [REDACTED] les valeurs de secrets lues avec dbutils.secrets.get() lorsqu'elles sont affichées." }
    b: { en: "Secret ACLs exist only at the scope level; use separate vaults and scopes to isolate secrets.", fr: "Les ACL de secret n'existent qu'au niveau de l'étendue ; utilisez des coffres et des étendues distincts pour isoler des secrets." }
references:
  - title: Workspace secret scopes
    url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets/workspace-secret-scopes
