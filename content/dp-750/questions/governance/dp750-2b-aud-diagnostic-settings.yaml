id: dp750-2b-aud-diagnostic-settings
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Databricks workspace named **dbw-prod** on the Premium plan. The security team uses a Log Analytics workspace named **law-sec** and wants to run KQL queries on the Unity Catalog and job events of dbw-prod.

    You need to send these audit events to law-sec.

    What should you configure?
  fr: |
    Contoso dispose d'un espace de travail Azure Databricks nommé **dbw-prod** avec le plan Premium. L'équipe de sécurité utilise un espace de travail Log Analytics nommé **law-sec** et souhaite exécuter des requêtes KQL sur les événements Unity Catalog et de jobs de dbw-prod.

    Vous devez envoyer ces événements d'audit à law-sec.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A data collection rule for the Azure Monitor Agent, installed on the cluster nodes by an init script", fr: "Une règle de collecte de données pour l'agent Azure Monitor, installé sur les nœuds des clusters par un script d'initialisation" } 
    - id: b
      text: { en: "A diagnostic setting on dbw-prod that sends the unityCatalog and jobs categories to law-sec", fr: "Un paramètre de diagnostic sur dbw-prod qui envoie les catégories unityCatalog et jobs à law-sec" }
    - id: c
      text: { en: "The Verbose Audit Logs setting on the Advanced tab of the workspace admin settings", fr: "Le paramètre Verbose Audit Logs de l'onglet Advanced des paramètres d'administration de l'espace de travail" }
    - id: d
      text: { en: "A diagnostic setting on the subscription that exports the activity log to law-sec", fr: "Un paramètre de diagnostic sur l'abonnement qui exporte le journal d'activité vers law-sec" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Diagnostic log delivery is configured in the Azure portal, under Monitoring > Diagnostic settings of the Azure Databricks workspace resource, on the Premium plan. You choose the log categories, such as unityCatalog and jobs, and a destination such as a Log Analytics workspace, where the events land in tables such as DatabricksUnityCatalog and DatabricksJobs.
    fr: |
      La remise des journaux de diagnostic se configure dans le portail Azure, sous Monitoring > Diagnostic settings de la ressource d'espace de travail Azure Databricks, avec le plan Premium. Vous choisissez les catégories de journaux, comme unityCatalog et jobs, et une destination comme un espace de travail Log Analytics, où les événements arrivent dans des tables telles que DatabricksUnityCatalog et DatabricksJobs.
  options:
    a:
      en: |
        The Azure Monitor Agent collects guest data from virtual machines; Azure Databricks audit events are delivered through diagnostic settings.
      fr: |
        L'agent Azure Monitor collecte les données invitées des machines virtuelles ; les événements d'audit Azure Databricks sont remis via les paramètres de diagnostic.
    c:
      en: |
        Verbose audit logs add command text to the audit events but do not deliver them to Log Analytics.
      fr: |
        Les journaux d'audit détaillés ajoutent le texte des commandes aux événements d'audit, mais ne les remettent pas à Log Analytics.
    d:
      en: |
        The activity log records Azure control-plane operations on resources, not Unity Catalog or job events inside the workspace.
      fr: |
        Le journal d'activité enregistre les opérations du plan de contrôle Azure sur les ressources, pas les événements Unity Catalog ou de jobs de l'espace de travail.
references:
  - title: Configure diagnostic log delivery
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
