id: dp750-2a-secret-reference-code
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Key Vault-backed secret scope named **kv-etl** that contains the secrets **jdbc-pwd** and **api-token**. You own a classic all-purpose compute resource and have the READ permission on kv-etl.

    You need to meet the following requirements:

    - Notebooks attached to the compute resource read the JDBC password with spark.conf.get("spark.fabrikam.jdbc.password"), and the password must not be stored in plain text in the compute configuration.
    - A notebook retrieves api-token as a string.

    How should you complete the configuration and the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une étendue de secrets reposant sur Azure Key Vault nommée **kv-etl** qui contient les secrets **jdbc-pwd** et **api-token**. Vous êtes propriétaire d'une ressource de calcul polyvalent classique et disposez de l'autorisation READ sur kv-etl.

    Vous devez répondre aux exigences suivantes :

    - Les notebooks attachés à la ressource de calcul lisent le mot de passe JDBC avec spark.conf.get("spark.fabrikam.jdbc.password"), et le mot de passe ne doit pas être stocké en clair dans la configuration du calcul.
    - Un notebook récupère api-token sous forme de chaîne.

    Comment devez-vous compléter la configuration et le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template:
    en: |
      # Compute > Advanced > Spark config
      spark.fabrikam.jdbc.password [[ref]]

      # Notebook cell (Python)
      token = dbutils.secrets.[[method]](scope="kv-etl", key="api-token")
    fr: |
      # Calcul > Avancé > Configuration Spark
      spark.fabrikam.jdbc.password [[ref]]

      # Cellule de notebook (Python)
      token = dbutils.secrets.[[method]](scope="kv-etl", key="api-token")
  slots:
    - id: ref
      options:
        - { id: dollar, text: "${secrets/kv-etl/jdbc-pwd}" }
        - { id: fn, text: "secret('kv-etl', 'jdbc-pwd')" }
        - { id: noscope, text: "{{secrets/jdbc-pwd}}" }
        - { id: ok, text: "{{secrets/kv-etl/jdbc-pwd}}" }
    - id: method
      options:
        - { id: list, text: list }
        - { id: listscopes, text: listScopes }
        - { id: get, text: get }
answer:
  values: { ref: ok, method: get }
explanation:
  correct:
    en: A Spark configuration property references a secret with the syntax {{secrets/<scope-name>/<secret-name>}}; the compute owner needs READ on the scope, and the compute must be restarted to pick up a changed secret. dbutils.secrets.get(scope, key) returns the string representation of a secret.
    fr: Une propriété de configuration Spark référence un secret avec la syntaxe {{secrets/<nom-étendue>/<nom-secret>}} ; le propriétaire du calcul doit disposer de READ sur l'étendue, et le calcul doit être redémarré pour prendre en compte un secret modifié. dbutils.secrets.get(scope, key) renvoie la représentation chaîne d'un secret.
  options:
    dollar: { en: "${...} is variable substitution, not the secret reference syntax of Spark configuration.", fr: "${...} est une substitution de variable, pas la syntaxe de référence de secret de la configuration Spark." }
    fn: { en: "secret() is a SQL function; it is not evaluated in a Spark configuration property.", fr: "secret() est une fonction SQL ; elle n'est pas évaluée dans une propriété de configuration Spark." }
    noscope: { en: "The reference must include both the scope name and the secret name.", fr: "La référence doit contenir le nom de l'étendue et le nom du secret." }
    list: { en: "list returns secret metadata, not a value.", fr: "list renvoie les métadonnées des secrets, pas une valeur." }
    listscopes: { en: "listScopes lists the available scopes.", fr: "listScopes liste les étendues disponibles." }
references:
  - title: Use a secret in a Spark configuration property or environment variable
    url: https://learn.microsoft.com/en-us/azure/databricks/security/secrets/secrets-spark-conf-env-var
  - title: Databricks Utilities (dbutils) reference
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-utils
