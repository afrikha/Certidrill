id: dp750-2a-metadata-commands-mapping
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind is documenting the Unity Catalog table **northwind.finance.invoices** for data discovery.

    Which statement should you use for each task? To answer, drag the appropriate statements to the correct tasks. Each statement may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind documente la table Unity Catalog **northwind.finance.invoices** pour la découverte des données.

    Quelle instruction devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les instructions appropriées vers les tâches correspondantes. Chaque instruction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: describe, text: DESCRIBE TABLE EXTENDED }
    - { id: grants, text: SHOW GRANTS }
    - { id: props, text: "ALTER TABLE ... SET TBLPROPERTIES (...)" }
    - { id: commenttable, text: "COMMENT ON TABLE ... IS '...'" }
    - { id: altercol, text: "ALTER TABLE ... ALTER COLUMN ... COMMENT '...'" }
    - { id: settags, text: "ALTER TABLE ... SET TAGS (...)" }
  targets:
    - id: t1
      text: { en: "Set the description of the table", fr: "Définir la description de la table" }
    - id: t2
      text: { en: "Change the description of the amount column", fr: "Modifier la description de la colonne amount" }
    - id: t3
      text: { en: "Attach the key-value tag domain = finance to the table", fr: "Associer la balise clé-valeur domain = finance à la table" }
    - id: t4
      text: { en: "Display the table's comment, owner and other detailed metadata", fr: "Afficher le commentaire, le propriétaire et d'autres métadonnées détaillées de la table" }
answer:
  mapping: { t1: commenttable, t2: altercol, t3: settags, t4: describe }
explanation:
  correct:
    en: COMMENT ON TABLE sets a table comment, and ALTER TABLE ... ALTER COLUMN ... COMMENT changes the description of a column. SET TAGS adds tags, which require the APPLY TAG privilege. DESCRIBE TABLE EXTENDED shows detailed metadata, including the owner and the comment.
    fr: COMMENT ON TABLE définit le commentaire d'une table, et ALTER TABLE ... ALTER COLUMN ... COMMENT modifie la description d'une colonne. SET TAGS ajoute des balises, ce qui exige le privilège APPLY TAG. DESCRIBE TABLE EXTENDED affiche des métadonnées détaillées, notamment le propriétaire et le commentaire.
  options:
    grants: { en: "SHOW GRANTS lists privileges, not descriptions.", fr: "SHOW GRANTS liste les privilèges, pas les descriptions." }
    props: { en: "TBLPROPERTIES are user-defined table properties, distinct from Unity Catalog tags and comments.", fr: "Les TBLPROPERTIES sont des propriétés de table définies par l'utilisateur, distinctes des balises et commentaires Unity Catalog." }
references:
  - title: COMMENT ON
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-comment
  - title: ALTER TABLE ... COLUMN clause
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-alter-table-manage-column
