id: dp750-2a-pipeline-comments-code
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso builds a Lakeflow Spark Declarative Pipelines pipeline in Python. The streaming table **silver_customers** reads the dataset bronze_customers, which has exactly the columns customer_id, email and country.

    The table description and the description of the customer_id column must be defined in the pipeline source code, so that they are applied every time the pipeline updates the table.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un pipeline Lakeflow Spark Declarative Pipelines en Python. La table de streaming **silver_customers** lit le jeu de données bronze_customers, qui contient exactement les colonnes customer_id, email et country.

    La description de la table et celle de la colonne customer_id doivent être définies dans le code source du pipeline, afin d'être appliquées chaque fois que le pipeline met à jour la table.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from pyspark import [[module]] as dp

    @dp.table(
      name="silver_customers",
      [[param]]="Cleansed customer records, one row per customer",
      schema="""
        customer_id BIGINT [[kw]] 'Unique customer key',
        email STRING,
        country STRING
      """
    )
    def silver_customers():
        return spark.readStream.table("bronze_customers")
  slots:
    - id: module
      options:
        - { id: streaming, text: streaming }
        - { id: pipelines, text: pipelines }
        - { id: sql, text: sql }
    - id: param
      options:
        - { id: props, text: table_properties }
        - { id: comment, text: comment }
        - { id: description, text: description }
    - id: kw
      options:
        - { id: description, text: DESCRIPTION }
        - { id: options, text: OPTIONS }
        - { id: comment, text: COMMENT }
answer:
  values: { module: pipelines, param: comment, kw: comment }
explanation:
  correct:
    en: Pipeline datasets are declared with decorators from pyspark.pipelines, imported as dp. The comment parameter of @dp.table holds the table description, and the schema parameter accepts a SQL DDL string in which each column can carry a COMMENT clause. Because the descriptions are part of the pipeline code, every update applies them.
    fr: Les jeux de données d'un pipeline se déclarent avec les décorateurs de pyspark.pipelines, importé sous le nom dp. Le paramètre comment de @dp.table contient la description de la table, et le paramètre schema accepte une chaîne DDL SQL dans laquelle chaque colonne peut porter une clause COMMENT. Comme les descriptions font partie du code du pipeline, chaque mise à jour les applique.
  options:
    sql: { en: "pyspark.sql provides the DataFrame API, not the pipeline decorators.", fr: "pyspark.sql fournit l'API DataFrame, pas les décorateurs de pipeline." }
    streaming: { en: "pyspark.streaming is the legacy DStream API; it does not provide the pipeline decorators.", fr: "pyspark.streaming est l'ancienne API DStream ; il ne fournit pas les décorateurs de pipeline." }
    description: { en: "The decorator parameter and the DDL keyword are both named comment/COMMENT; description is not valid.", fr: "Le paramètre du décorateur et le mot clé DDL s'appellent comment/COMMENT ; description n'est pas valide." }
    props: { en: "table_properties sets table properties, not the table description.", fr: "table_properties définit des propriétés de table, pas la description de la table." }
    options: { en: "OPTIONS is not a column clause of the schema DDL.", fr: "OPTIONS n'est pas une clause de colonne du DDL de schéma." }
references:
  - title: table
    url: https://learn.microsoft.com/en-us/azure/databricks/ldp/developer/ldp-python-ref-table
