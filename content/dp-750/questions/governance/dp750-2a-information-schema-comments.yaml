id: dp750-2a-information-schema-comments
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank wants to improve data discovery in the Unity Catalog catalog **woodgrove**. You need a query that lists every column of the tables and views in the schema **woodgrove.gold** that has no description.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank souhaite améliorer la découverte des données dans le catalogue Unity Catalog **woodgrove**. Vous avez besoin d'une requête qui liste toutes les colonnes des tables et des vues du schéma **woodgrove.gold** qui n'ont pas de description.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT table_name, column_name, data_type
    FROM [[source]]
    WHERE table_schema = 'gold'
      AND [[cond]]
    ORDER BY table_name, ordinal_position;
  slots:
    - id: source
      options:
        - { id: gold, text: woodgrove.gold.columns }
        - { id: audit, text: system.access.audit }
        - { id: columns, text: woodgrove.information_schema.columns }
        - { id: tables, text: woodgrove.information_schema.tables }
    - id: cond
      options:
        - { id: strnull, text: "comment = 'NULL'" }
        - { id: colcomment, text: column_comment IS NULL }
        - { id: desc, text: description IS NULL }
        - { id: isnull, text: comment IS NULL }
answer:
  values: { source: columns, cond: isnull }
explanation:
  correct:
    en: Each Unity Catalog catalog exposes an information_schema whose COLUMNS relation has one row per column, with TABLE_SCHEMA, TABLE_NAME, COLUMN_NAME, DATA_TYPE, ORDINAL_POSITION and COMMENT. A column without a description has a NULL comment. The rows are limited to the relations that the user is privileged to interact with.
    fr: Chaque catalogue Unity Catalog expose un information_schema dont la relation COLUMNS contient une ligne par colonne, avec TABLE_SCHEMA, TABLE_NAME, COLUMN_NAME, DATA_TYPE, ORDINAL_POSITION et COMMENT. Une colonne sans description a un commentaire NULL. Les lignes sont limitées aux relations avec lesquelles l'utilisateur a le privilège d'interagir.
  options:
    tables: { en: "TABLES has one row per table or view, not per column.", fr: "TABLES contient une ligne par table ou vue, pas par colonne." }
    gold: { en: "The information schema lives in the information_schema schema of the catalog, not in the gold schema.", fr: "Le schéma d'informations se trouve dans le schéma information_schema du catalogue, pas dans le schéma gold." }
    audit: { en: "system.access.audit records audit events, not column descriptions.", fr: "system.access.audit enregistre des événements d'audit, pas des descriptions de colonnes." }
    strnull: { en: "A missing comment is NULL, not the text 'NULL'.", fr: "Un commentaire absent vaut NULL, pas le texte 'NULL'." }
    colcomment: { en: "The column is named COMMENT; there is no column_comment column.", fr: "La colonne s'appelle COMMENT ; il n'existe pas de colonne column_comment." }
    desc: { en: "The column is named COMMENT; there is no description column.", fr: "La colonne s'appelle COMMENT ; il n'existe pas de colonne description." }
references:
  - title: COLUMNS
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/information-schema/columns
