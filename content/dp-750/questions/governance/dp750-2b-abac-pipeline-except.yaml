id: dp750-2b-abac-pipeline-except
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has a column mask policy named **mask_iban** attached to the **bank** catalog. The policy applies to the `account users` group and masks every column tagged `pii` = `iban`.

    A Lakeflow Spark Declarative Pipelines pipeline runs as a service principal named sp-etl. It reads tables of the bank catalog and refreshes a materialized view named **bank.gold.account_summary**. After each refresh, the materialized view permanently stores masked IBAN values.

    You need the materialized view to store the original IBAN values. The policy must continue to mask the IBAN columns of the source tables for all other users.

    What should you do?
  fr: |
    Woodgrove dispose d'une stratégie de masque de colonne nommée **mask_iban** attachée au catalogue **bank**. La stratégie s'applique au groupe `account users` et masque toutes les colonnes portant la balise `pii` = `iban`.

    Un pipeline Lakeflow Spark Declarative Pipelines s'exécute sous l'identité d'un principal de service nommé sp-etl. Il lit des tables du catalogue bank et actualise une vue matérialisée nommée **bank.gold.account_summary**. Après chaque actualisation, la vue matérialisée stocke de façon permanente des valeurs IBAN masquées.

    Vous devez faire en sorte que la vue matérialisée stocke les valeurs IBAN d'origine. La stratégie doit continuer à masquer les colonnes IBAN des tables sources pour tous les autres utilisateurs.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Transfer the ownership of the source tables to sp-etl.", fr: "Transférer la propriété des tables sources à sp-etl." }
    - id: b
      text: { en: "Grant sp-etl the MANAGE privilege on the bank catalog.", fr: "Accorder à sp-etl le privilège MANAGE sur le catalogue bank." }
    - id: c
      text: { en: "Run the pipeline as a member of the account admins.", fr: "Exécuter le pipeline sous l'identité d'un administrateur de compte." }
    - id: d
      text: { en: "Add sp-etl to the EXCEPT clause of mask_iban.", fr: "Ajouter sp-etl à la clause EXCEPT de mask_iban." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      During a refresh, policies are evaluated with the pipeline owner or run-as identity, so a masked identity writes masked data into the materialized view. Adding sp-etl to the EXCEPT clause exempts only that identity, while the policy keeps masking the source columns for every other member of account users.
    fr: |
      Lors d'une actualisation, les stratégies sont évaluées avec l'identité du propriétaire du pipeline ou l'identité d'exécution : une identité soumise au masque écrit des données masquées dans la vue matérialisée. Ajouter sp-etl à la clause EXCEPT exempte uniquement cette identité, tandis que la stratégie continue à masquer les colonnes sources pour tous les autres membres d'account users.
  options:
    a:
      en: |
        Table owners cannot override ABAC policies; the owner remains subject to the policy if it is in the TO group.
      fr: |
        Les propriétaires de tables ne peuvent pas contourner les stratégies ABAC ; le propriétaire reste soumis à la stratégie s'il fait partie du groupe TO.
    b:
      en: |
        MANAGE lets sp-etl edit privileges and policies, but it does not exempt it from the mask while it is listed in the policy.
      fr: |
        MANAGE permet à sp-etl de modifier les privilèges et les stratégies, mais ne l'exempte pas du masque tant qu'il est visé par la stratégie.
    c:
      en: |
        Account admins are still members of account users, so the policy would mask their data too; exemptions come only from EXCEPT.
      fr: |
        Les administrateurs de compte restent membres d'account users : la stratégie masquerait aussi leurs données ; les exemptions viennent uniquement de la clause EXCEPT.
references:
  - title: Requirements, quotas, and limitations for row filter and column mask policies
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/abac/requirements
