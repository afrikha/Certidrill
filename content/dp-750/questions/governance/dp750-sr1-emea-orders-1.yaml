id: dp750-sr1-emea-orders-1
objective: "2.2.3"
type: series_yesno
series: dp750-sr1-emea-orders
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You create a function that checks sales-leads membership and set it as the row filter of the table.
  fr: Vous créez une fonction qui vérifie l'appartenance à sales-leads et la définissez comme filtre de lignes de la table.
body:
  solution:
    en: |
      As the owner of tailspin.sales.orders, you run the following statements:

      ```sql
      CREATE FUNCTION tailspin.sales.region_filter(region STRING)
      RETURN IF(is_account_group_member('sales-leads'), true, region = 'EMEA');

      ALTER TABLE tailspin.sales.orders
      SET ROW FILTER tailspin.sales.region_filter ON (region);
      ```
    fr: |
      En tant que propriétaire de tailspin.sales.orders, vous exécutez les instructions suivantes :

      ```sql
      CREATE FUNCTION tailspin.sales.region_filter(region STRING)
      RETURN IF(is_account_group_member('sales-leads'), true, region = 'EMEA');

      ALTER TABLE tailspin.sales.orders
      SET ROW FILTER tailspin.sales.region_filter ON (region);
      ```
answer: { value: true }
explanation:
  correct:
    en: A row filter is a SQL function bound to the table and evaluated for each row; rows for which it returns false are excluded from the results. Members of sales-leads get true for every row, and every other user, including emea-analysts, sees only the EMEA rows, while the table name and the column values stay unchanged.
    fr: "Un filtre de lignes est une fonction SQL liée à la table et évaluée pour chaque ligne ; les lignes pour lesquelles elle renvoie false sont exclues des résultats. Les membres de sales-leads obtiennent true pour chaque ligne, et tous les autres utilisateurs, y compris emea-analysts, ne voient que les lignes EMEA, tandis que le nom de la table et les valeurs des colonnes restent inchangés."
references:
  - title: Manually apply row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/manually-apply
  - title: Row filters and column masks
