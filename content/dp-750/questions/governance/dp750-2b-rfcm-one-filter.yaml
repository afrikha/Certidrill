id: dp750-2b-rfcm-one-filter
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a table named **hr.core.timesheets**. A row filter named **hr.security.region_filter** is set on the table and restricts users to the rows of their region. A new requirement states that users must also see only the rows of their own department.

    You need to enforce both conditions on the table. The solution must not create new tables or views.

    What should you do?
  fr: |
    Contoso dispose d'une table nommée **hr.core.timesheets**. Un filtre de lignes nommé **hr.security.region_filter** est défini sur la table et limite les utilisateurs aux lignes de leur région. Une nouvelle exigence impose que les utilisateurs ne voient aussi que les lignes de leur propre service.

    Vous devez appliquer les deux conditions à la table. La solution ne doit pas créer de nouvelles tables ni de nouvelles vues.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a function that combines both conditions with AND and set it as the row filter of the table.", fr: "Créer une fonction qui combine les deux conditions avec AND et la définir comme filtre de lignes de la table." }
    - id: b
      text: { en: "Create a department filter function and add it to the table as a second row filter.", fr: "Créer une fonction de filtre par service et l'ajouter à la table comme second filtre de lignes." }
    - id: c
      text: { en: "Create a department mask function and set it as the column mask of the department column.", fr: "Créer une fonction de masque par service et la définir comme masque de colonne de la colonne department." }
    - id: d
      text: { en: "Create a department filter function and grant EXECUTE on it to every user group.", fr: "Créer une fonction de filtre par service et accorder EXECUTE sur celle-ci à chaque groupe d'utilisateurs." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Only one distinct row filter resolves for a table and user, so additional conditions must be combined in the same function with AND. You can then set the combined function as the table's row filter, or redefine the existing function with CREATE OR REPLACE FUNCTION.
    fr: |
      Un seul filtre de lignes distinct s'applique à une table pour un utilisateur : les conditions supplémentaires doivent donc être combinées dans la même fonction avec AND. Vous pouvez ensuite définir la fonction combinée comme filtre de lignes de la table, ou redéfinir la fonction existante avec CREATE OR REPLACE FUNCTION.
  options:
    b:
      en: |
        A table cannot resolve two distinct row filters at the same time; the conditions must be in one function.
      fr: |
        Une table ne peut pas appliquer deux filtres de lignes distincts en même temps ; les conditions doivent figurer dans une seule fonction.
    c:
      en: |
        A column mask changes the values of one column but leaves every row visible.
      fr: |
        Un masque de colonne modifie les valeurs d'une colonne mais laisse toutes les lignes visibles.
    d:
      en: |
        Granting EXECUTE lets users call the function; it does not attach the function to the table.
      fr: |
        Accorder EXECUTE permet aux utilisateurs d'appeler la fonction ; cela ne l'associe pas à la table.
references:
  - title: Row filters and column masks
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/
