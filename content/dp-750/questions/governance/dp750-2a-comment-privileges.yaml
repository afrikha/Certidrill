id: dp750-2a-comment-privileges
objective: "2.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a Unity Catalog table named **tailspin.ops.flights** and a view named **tailspin.ops.flights_v** that queries the table. The view is owned by the group **ops-owners**. Lena is not a member of ops-owners and has USE CATALOG and USE SCHEMA on the parents. She runs statements from a SQL warehouse.

    Lena must maintain the descriptions of the table, of its columns and of the view.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une table Unity Catalog nommée **tailspin.ops.flights** et d'une vue nommée **tailspin.ops.flights_v** qui interroge la table. Le propriétaire de la vue est le groupe **ops-owners**. Lena n'est pas membre d'ops-owners et dispose de USE CATALOG et USE SCHEMA sur les parents. Elle exécute des instructions depuis un entrepôt SQL.

    Lena doit tenir à jour les descriptions de la table, de ses colonnes et de la vue.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "With MODIFY on tailspin.ops.flights, Lena can run COMMENT ON TABLE on the table.", fr: "Avec MODIFY sur tailspin.ops.flights, Lena peut exécuter COMMENT ON TABLE sur la table." } }
    - { id: b, text: { en: "With MODIFY on tailspin.ops.flights, Lena can run COMMENT ON COLUMN on the columns of the table.", fr: "Avec MODIFY sur tailspin.ops.flights, Lena peut exécuter COMMENT ON COLUMN sur les colonnes de la table." } }
    - { id: c, text: { en: "With MANAGE on tailspin.ops.flights_v, Lena can change the comment of the view.", fr: "Avec MANAGE sur tailspin.ops.flights_v, Lena peut modifier le commentaire de la vue." } }
    - { id: d, text: { en: "With SELECT on tailspin.ops.flights_v, Lena can change the comment of the view.", fr: "Avec SELECT sur tailspin.ops.flights_v, Lena peut modifier le commentaire de la vue." } }
    - { id: e, text: { en: "With MODIFY on tailspin.ops.flights, Lena can change the comment of the view tailspin.ops.flights_v.", fr: "Avec MODIFY sur tailspin.ops.flights, Lena peut modifier le commentaire de la vue tailspin.ops.flights_v." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: COMMENT ON TABLE and COMMENT ON COLUMN require MODIFY on a table. For a view, you must be its owner; Microsoft Learn states that MANAGE is not sufficient to update a view's definition or description, so Lena needs ownership (for example, membership in ops-owners).
    fr: COMMENT ON TABLE et COMMENT ON COLUMN exigent MODIFY sur une table. Pour une vue, il faut en être propriétaire ; Microsoft Learn indique que MANAGE ne suffit pas pour modifier la définition ou la description d'une vue ; Lena a donc besoin de la propriété (par exemple, être membre d'ops-owners).
  options:
    c: { en: "Updating a view's description requires ownership; MANAGE is not sufficient.", fr: "Modifier la description d'une vue exige la propriété ; MANAGE ne suffit pas." }
    d: { en: "SELECT only allows querying the view.", fr: "SELECT permet seulement d'interroger la vue." }
    e: { en: "Privileges on the underlying table do not apply to the view; commenting a view requires owning the view.", fr: "Les privilèges sur la table sous-jacente ne s'appliquent pas à la vue ; commenter une vue exige d'en être propriétaire." }
references:
  - title: COMMENT ON
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-comment
  - title: Create and manage views
    url: https://learn.microsoft.com/en-us/azure/databricks/views/create-views
