id: dp750-2b-ret-drop-column-order
objective: "2.2.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a Delta table named **crm.core.customers** with column mapping enabled. The table contains a column named **ssn** that carries the governed tag `pii` = `ssn`. No table-level mask is set on the column.

    A new data retention policy states that the ssn column must be removed from the table and that its values must be physically deleted from storage. Assume that the retention period elapses whenever a step requires it.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'une table Delta nommée **crm.core.customers** dont le mappage de colonnes est activé. La table contient une colonne nommée **ssn** qui porte la balise gouvernée `pii` = `ssn`. Aucun masque au niveau de la table n'est défini sur la colonne.

    Une nouvelle stratégie de rétention des données impose de retirer la colonne ssn de la table et de supprimer physiquement ses valeurs du stockage. Considérez que la période de rétention s'écoule chaque fois qu'une étape l'exige.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: unset, text: { en: "Run UNSET TAG ON COLUMN crm.core.customers.ssn pii.", fr: "Exécuter UNSET TAG ON COLUMN crm.core.customers.ssn pii." } }
    - { id: drop, text: { en: "Run ALTER TABLE crm.core.customers DROP COLUMN ssn.", fr: "Exécuter ALTER TABLE crm.core.customers DROP COLUMN ssn." } }
    - { id: reorg, text: { en: "Run REORG TABLE crm.core.customers APPLY (PURGE).", fr: "Exécuter REORG TABLE crm.core.customers APPLY (PURGE)." } }
    - { id: vacuum, text: { en: "Run VACUUM crm.core.customers.", fr: "Exécuter VACUUM crm.core.customers." } }
    - { id: dropmask, text: { en: "Run ALTER TABLE crm.core.customers ALTER COLUMN ssn DROP MASK.", fr: "Exécuter ALTER TABLE crm.core.customers ALTER COLUMN ssn DROP MASK." } }
    - { id: optimize, text: { en: "Run OPTIMIZE crm.core.customers.", fr: "Exécuter OPTIMIZE crm.core.customers." } }
    - { id: restore, text: { en: "Run RESTORE TABLE crm.core.customers TO VERSION AS OF 0.", fr: "Exécuter RESTORE TABLE crm.core.customers TO VERSION AS OF 0." } }
answer:
  sequence: [ unset, drop, reorg, vacuum ]
explanation:
  correct:
    en: |
      A column that carries governed tags cannot be dropped, so you remove the tag first and then drop the column. With column mapping, dropping a column only changes the metadata, so REORG TABLE … APPLY (PURGE) rewrites the files without the dropped data, and VACUUM physically deletes the old files once they pass the retention threshold.
    fr: |
      Une colonne qui porte des balises gouvernées ne peut pas être supprimée : vous retirez d'abord la balise, puis vous supprimez la colonne. Avec le mappage de colonnes, la suppression d'une colonne ne modifie que les métadonnées : REORG TABLE … APPLY (PURGE) réécrit les fichiers sans les données supprimées, et VACUUM supprime physiquement les anciens fichiers une fois le seuil de rétention dépassé.
  options:
    dropmask: { en: "No table-level mask is set on the column, so there is nothing to drop.", fr: "Aucun masque au niveau de la table n'est défini sur la colonne : il n'y a rien à supprimer." }
    optimize: { en: "OPTIMIZE compacts files for performance; it is not the documented step that purges soft-deleted data.", fr: "OPTIMIZE compacte les fichiers pour les performances ; ce n'est pas l'étape documentée qui purge les données supprimées logiquement." }
    restore: { en: "RESTORE would bring back an earlier version, including the data that must be deleted.", fr: "RESTORE rétablirait une version antérieure, y compris les données à supprimer." }
references:
  - title: Apply tags to Unity Catalog securable objects
    url: https://learn.microsoft.com/en-us/azure/databricks/database-objects/tags
  - title: Remove unused data files with vacuum
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/operations/vacuum
