id: dp750-1b-federation-compute
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a foreign catalog named **crm_ext** that mirrors a SQL Server database through Lakehouse Federation. Network connectivity from all the workspace compute to the database is configured, and analysts have the required Unity Catalog privileges on crm_ext.

    The workspace has the compute resources listed in the options.

    Which compute resource can the analysts use to query crm_ext?
  fr: |
    Adatum dispose d'un catalogue étranger nommé **crm_ext** qui reflète une base SQL Server au moyen de Lakehouse Federation. La connectivité réseau entre tout le calcul de l'espace de travail et la base est configurée, et les analystes disposent des privilèges Unity Catalog nécessaires sur crm_ext.

    L'espace de travail dispose des ressources de calcul indiquées dans les options.

    Quelle ressource de calcul les analystes peuvent-ils utiliser pour interroger crm_ext ?
body:
  options:
    - { id: a, text: { en: "A Classic SQL warehouse", fr: "Un entrepôt SQL Classic" } }
    - { id: b, text: { en: "A Serverless SQL warehouse", fr: "Un entrepôt SQL Serverless" } }
    - { id: c, text: { en: "A cluster that runs Databricks Runtime 12.2 LTS in Standard access mode", fr: "Un cluster qui exécute Databricks Runtime 12.2 LTS en mode d'accès Standard" } }
    - { id: d, text: { en: "A cluster that runs Databricks Runtime 15.4 LTS in No isolation shared access mode", fr: "Un cluster qui exécute Databricks Runtime 15.4 LTS en mode d'accès No isolation shared" } }
answer: { optionId: b }
explanation:
  correct:
    en: Lakehouse Federation requires a Pro or Serverless SQL warehouse (version 2023.40 or above), or a cluster on Databricks Runtime 13.3 LTS or above in Standard or Dedicated access mode. Only the Serverless SQL warehouse meets these requirements.
    fr: Lakehouse Federation exige un entrepôt SQL Pro ou Serverless (version 2023.40 ou ultérieure), ou un cluster sous Databricks Runtime 13.3 LTS ou ultérieur en mode d'accès Standard ou Dedicated. Seul l'entrepôt SQL Serverless répond à ces exigences.
  options:
    a:
      en: Classic SQL warehouses are not supported; the warehouse must be Pro or Serverless.
      fr: Les entrepôts SQL Classic ne sont pas pris en charge ; l'entrepôt doit être Pro ou Serverless.
    c:
      en: Federated queries require Databricks Runtime 13.3 LTS or above.
      fr: Les requêtes fédérées exigent Databricks Runtime 13.3 LTS ou ultérieur.
    d:
      en: No isolation shared is a legacy access mode that does not support Unity Catalog; Standard or Dedicated access mode is required.
      fr: No isolation shared est un mode d'accès hérité qui ne prend pas en charge Unity Catalog ; le mode d'accès Standard ou Dedicated est obligatoire.
references:
  - title: Run federated queries on Microsoft SQL Server
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/sql-server
