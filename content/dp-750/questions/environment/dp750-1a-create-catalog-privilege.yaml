id: dp750-1a-create-catalog-privilege
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Members of a group named **data-platform** at Tailspin must be able to create new catalogs in the Unity Catalog metastore. The metastore has a metastore-level managed storage location, so the catalogs don't need their own managed location.

    When a member of data-platform runs `CREATE CATALOG marketing_dev;`, the statement fails with a permission error. The solution must follow the principle of least privilege.

    Which privilege should a metastore admin grant to data-platform?
  fr: |
    Les membres d'un groupe nommé **data-platform** chez Tailspin doivent pouvoir créer de nouveaux catalogues dans le metastore Unity Catalog. Le metastore dispose d'un emplacement de stockage managé au niveau du metastore : les catalogues n'ont donc pas besoin de leur propre emplacement managé.

    Lorsqu'un membre de data-platform exécute `CREATE CATALOG marketing_dev;`, l'instruction échoue avec une erreur d'autorisation. La solution doit respecter le principe du moindre privilège.

    Quel privilège un administrateur du metastore doit-il accorder à data-platform ?
body:
  options:
    - { id: a, text: { en: "USE CATALOG on every existing catalog", fr: "USE CATALOG sur chaque catalogue existant" } }
    - { id: b, text: { en: "CREATE CATALOG on the metastore", fr: "CREATE CATALOG sur le metastore" } }
    - { id: c, text: { en: "CREATE MANAGED STORAGE on an external location", fr: "CREATE MANAGED STORAGE sur un emplacement externe" } }
    - { id: d, text: { en: "CREATE EXTERNAL LOCATION on the metastore", fr: "CREATE EXTERNAL LOCATION sur le metastore" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Creating any type of catalog requires the CREATE CATALOG privilege on the metastore. Because the metastore already has managed storage, no privilege on an external location is needed.
    fr: |
      La création de tout type de catalogue exige le privilège CREATE CATALOG sur le metastore. Comme le metastore dispose déjà d'un stockage managé, aucun privilège sur un emplacement externe n'est nécessaire.
  options:
    a: { en: "USE CATALOG lets users access existing catalogs; it doesn't let them create new ones.", fr: "USE CATALOG permet d'accéder aux catalogues existants ; il ne permet pas d'en créer de nouveaux." }
    c: { en: "CREATE MANAGED STORAGE is needed only when the catalog specifies a managed location.", fr: "CREATE MANAGED STORAGE n'est nécessaire que lorsque le catalogue spécifie un emplacement managé." }
    d: { en: "CREATE EXTERNAL LOCATION lets users create external locations, not catalogs.", fr: "CREATE EXTERNAL LOCATION permet de créer des emplacements externes, pas des catalogues." }
references:
  - title: Create catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/create-catalog
