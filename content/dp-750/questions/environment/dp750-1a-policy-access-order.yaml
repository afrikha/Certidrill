id: dp750-1a-policy-access-order
objective: "1.1.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Members of a group named **bi-devs** at Tailspin don't have the **Unrestricted cluster creation** entitlement, and the only policy they can use is Personal Compute.

    bi-devs must be able to create multi-node all-purpose compute in standard access mode, only through a policy that fixes automatic termination at 60 minutes. You are a workspace admin.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Les membres d'un groupe nommé **bi-devs** chez Tailspin ne disposent pas du droit **Unrestricted cluster creation**, et la seule stratégie qu'ils peuvent utiliser est Personal Compute.

    bi-devs doit pouvoir créer du calcul polyvalent multinœud en mode d'accès standard, uniquement via une stratégie qui fixe l'arrêt automatique à 60 minutes. Vous êtes administrateur de l'espace de travail.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "On the **Policies** tab, click **Create policy** and select the **Shared Compute** family.", fr: "Dans l'onglet **Policies**, cliquer sur **Create policy** et sélectionner la famille **Shared Compute**." } }
    - { id: rule, text: { en: "Add a rule that fixes `autotermination_minutes` to 60, and then create the policy.", fr: "Ajouter une règle qui fixe `autotermination_minutes` à 60, puis créer la stratégie." } }
    - { id: grant, text: { en: "In the permissions of the new policy, grant bi-devs permission to use it.", fr: "Dans les autorisations de la nouvelle stratégie, accorder à bi-devs l'autorisation de l'utiliser." } }
    - { id: unrestricted, text: { en: "Grant the **Unrestricted cluster creation** entitlement to bi-devs.", fr: "Accorder le droit **Unrestricted cluster creation** à bi-devs." } }
    - { id: pool, text: { en: "Grant the **Allow pool creation** entitlement to bi-devs.", fr: "Accorder le droit **Allow pool creation** à bi-devs." } }
    - { id: manage, text: { en: "Grant CAN MANAGE on an existing all-purpose compute resource to bi-devs.", fr: "Accorder CAN MANAGE sur une ressource de calcul polyvalent existante à bi-devs." } }
answer:
  sequence: [ create, rule, grant ]
explanation:
  correct:
    en: |
      The Shared Compute policy family provides multi-node all-purpose compute in standard access mode; you add or override rules, such as a fixed automatic termination, before you create the policy. Users who don't have unrestricted cluster creation can create compute only through the policies they've been granted, so you then grant bi-devs access to the new policy.
    fr: |
      La famille de stratégies Shared Compute fournit du calcul polyvalent multinœud en mode d'accès standard ; vous ajoutez ou remplacez des règles, comme un arrêt automatique fixe, avant de créer la stratégie. Les utilisateurs qui ne disposent pas de la création de clusters sans restriction ne peuvent créer du calcul que via les stratégies qui leur sont accordées : vous accordez donc ensuite à bi-devs l'accès à la nouvelle stratégie.
  options:
    unrestricted: { en: "Unrestricted cluster creation lets users create compute without any policy, which breaks the requirement.", fr: "La création de clusters sans restriction permet de créer du calcul sans aucune stratégie, ce qui enfreint l'exigence." }
    pool: { en: "Pool creation isn't needed to create compute from a policy.", fr: "La création de pools n'est pas nécessaire pour créer du calcul à partir d'une stratégie." }
    manage: { en: "CAN MANAGE on existing compute doesn't let users create new compute.", fr: "CAN MANAGE sur un calcul existant ne permet pas de créer un nouveau calcul." }
references:
  - title: Create and manage compute policies
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/clusters/policies
  - title: Default policies and policy families
    url: https://learn.microsoft.com/en-us/azure/databricks/admin/clusters/policy-families
