id: dp750-1a-lts-runtime
objective: "1.1.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Northwind is configuring classic jobs compute for a production pipeline that writes to `northwind_prod.gold.inventory`. The team must follow the Databricks recommendation for operational job compute and, among the versions that meet it, choose the one with the longest remaining support period.

    The supported Databricks Runtime versions are shown in the **Supported versions** exhibit.

    Which version should you select?
  fr: |
    Northwind configure un calcul de jobs classique pour un pipeline de production qui écrit dans `northwind_prod.gold.inventory`. L'équipe doit suivre la recommandation de Databricks pour le calcul de jobs opérationnel et, parmi les versions qui la respectent, choisir celle dont la période de support restante est la plus longue.

    Les versions de Databricks Runtime prises en charge figurent dans la pièce **Versions prises en charge**.

    Quelle version devez-vous sélectionner ?
exhibits:
  - id: versions
    title: { en: Supported versions, fr: Versions prises en charge }
    body:
      en: |
        | Version | Apache Spark | Release date | End-of-support date |
        | --- | --- | --- | --- |
        | 19 | 4.2.0 | June 15, 2026 | Determined at LTS transition |
        | 18 LTS | 4.1.0 | June 10, 2026 | June 10, 2029 |
        | 17.3 LTS | 4.0.0 | Oct 22, 2025 | Oct 22, 2028 |
        | 14.3 LTS | 3.5.0 | Feb 1, 2024 | Feb 1, 2027 |
      fr: |
        | Version | Apache Spark | Date de publication | Date de fin de support |
        | --- | --- | --- | --- |
        | 19 | 4.2.0 | 15 juin 2026 | Déterminée lors du passage en LTS |
        | 18 LTS | 4.1.0 | 10 juin 2026 | 10 juin 2029 |
        | 17.3 LTS | 4.0.0 | 22 oct. 2025 | 22 oct. 2028 |
        | 14.3 LTS | 3.5.0 | 1er févr. 2024 | 1er févr. 2027 |
body:
  options:
    - { id: a, text: "19" }
    - { id: b, text: 18 LTS }
    - { id: c, text: 17.3 LTS }
    - { id: d, text: 14.3 LTS }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For operational job compute, Databricks recommends a long-term support (LTS) version to avoid compatibility issues, and testing before upgrading. An LTS version receives stability and security fixes for three years after its release, so 18 LTS, supported until June 10, 2029, is the LTS version with the longest remaining support.
    fr: |
      Pour le calcul de jobs opérationnel, Databricks recommande une version à support à long terme (LTS) afin d'éviter les problèmes de compatibilité, et de tester avant toute mise à niveau. Une version LTS reçoit des correctifs de stabilité et de sécurité pendant trois ans après sa publication : 18 LTS, prise en charge jusqu'au 10 juin 2029, est la version LTS dont le support restant est le plus long.
  options:
    a: { en: "Version 19 isn't an LTS version yet; the latest version is recommended for all-purpose compute, not for operational jobs.", fr: "La version 19 n'est pas encore une version LTS ; la dernière version est recommandée pour le calcul polyvalent, pas pour les jobs opérationnels." }
    c: { en: "17.3 LTS meets the recommendation but its support ends earlier, in October 2028.", fr: "17.3 LTS respecte la recommandation mais son support se termine plus tôt, en octobre 2028." }
    d: { en: "14.3 LTS reaches end of support in February 2027.", fr: "Le support de 14.3 LTS se termine en février 2027." }
references:
  - title: Databricks Runtime release notes versions and compatibility
    url: https://learn.microsoft.com/en-us/azure/databricks/release-notes/runtime/
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
