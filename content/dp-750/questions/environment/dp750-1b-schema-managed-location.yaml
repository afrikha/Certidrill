id: dp750-1b-schema-managed-location
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Unity Catalog catalog named **contoso_prod** that has a managed storage location in the container `uc-prod`. The catalog contains several schemas.

    You need to create a schema named **contoso_prod.hr**. The managed tables and managed volumes of the hr schema must be stored in the container `hr-data`, physically isolated from the other schemas. The tables must remain managed tables, and the other schemas must not be affected. An external location that covers `hr-data` exists, and you have the `CREATE MANAGED STORAGE` privilege on it.

    What should you do?
  fr: |
    Contoso dispose d'un catalogue Unity Catalog nommé **contoso_prod** qui possède un emplacement de stockage managé dans le conteneur `uc-prod`. Le catalogue contient plusieurs schémas.

    Vous devez créer un schéma nommé **contoso_prod.hr**. Les tables managées et les volumes managés du schéma hr doivent être stockés dans le conteneur `hr-data`, physiquement isolés des autres schémas. Les tables doivent rester des tables managées, et les autres schémas ne doivent pas être affectés. Un emplacement externe qui couvre `hr-data` existe, et vous disposez du privilège `CREATE MANAGED STORAGE` sur celui-ci.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run ALTER CATALOG contoso_prod SET MANAGED LOCATION with the hr-data path.", fr: "Exécuter ALTER CATALOG contoso_prod SET MANAGED LOCATION avec le chemin hr-data." } }
    - { id: b, text: { en: "Create the schema with a MANAGED LOCATION clause that points to the hr-data path.", fr: "Créer le schéma avec une clause MANAGED LOCATION qui pointe vers le chemin hr-data." } }
    - { id: c, text: { en: "Create the schema with a LOCATION clause that points to the hr-data path.", fr: "Créer le schéma avec une clause LOCATION qui pointe vers le chemin hr-data." } }
    - { id: d, text: { en: "Create each table of the schema with a LOCATION clause under the hr-data path.", fr: "Créer chaque table du schéma avec une clause LOCATION sous le chemin hr-data." } }
answer: { optionId: b }
explanation:
  correct:
    en: In Unity Catalog, the MANAGED LOCATION clause of CREATE SCHEMA sets a storage root for the schema's managed tables and volumes. A schema-level managed location overrides the catalog location, so only the hr schema uses hr-data. The path must be inside an external location on which you have CREATE MANAGED STORAGE.
    fr: Dans Unity Catalog, la clause MANAGED LOCATION de CREATE SCHEMA définit une racine de stockage pour les tables et volumes managés du schéma. Un emplacement managé au niveau du schéma remplace celui du catalogue ; seul le schéma hr utilise donc hr-data. Le chemin doit se trouver dans un emplacement externe sur lequel vous disposez de CREATE MANAGED STORAGE.
  options:
    a:
      en: Changing the catalog location affects the new managed objects of every schema in the catalog that has no location of its own, not only hr.
      fr: Modifier l'emplacement du catalogue affecte les nouveaux objets managés de tous les schémas du catalogue qui n'ont pas leur propre emplacement, pas seulement hr.
    c:
      en: The LOCATION clause of CREATE SCHEMA is for the legacy Hive metastore; Unity Catalog does not support it.
      fr: La clause LOCATION de CREATE SCHEMA est destinée au metastore Hive hérité ; Unity Catalog ne la prend pas en charge.
    d:
      en: A table created with a LOCATION clause is an external table, which breaks the requirement that the tables remain managed.
      fr: Une table créée avec une clause LOCATION est une table externe, ce qui ne respecte pas l'exigence de tables managées.
references:
  - title: Specify a managed storage location in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/managed-storage
  - title: CREATE SCHEMA
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-schema
