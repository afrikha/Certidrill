id: dp750-1a-wheel-volume-source
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a classic compute resource named **etl-shared** that uses standard access mode and Databricks Runtime 16.4 LTS in a workspace enabled for Unity Catalog.

    An internal Python wheel named `contoso_rules-2.0-py3-none-any.whl` must be installed as a compute-scoped library so that every notebook on etl-shared can import it. You must follow Databricks recommendations for where to store the library.

    Where should you store the wheel?
  fr: |
    Contoso dispose d'une ressource de calcul classique nommée **etl-shared** qui utilise le mode d'accès standard et Databricks Runtime 16.4 LTS dans un espace de travail activé pour Unity Catalog.

    Une roue (wheel) Python interne nommée `contoso_rules-2.0-py3-none-any.whl` doit être installée comme bibliothèque limitée au calcul, afin que chaque notebook d'etl-shared puisse l'importer. Vous devez suivre les recommandations de Databricks sur l'emplacement de stockage de la bibliothèque.

    Où devez-vous stocker la roue ?
body:
  options:
    - { id: a, text: { en: "In a folder of the DBFS root that all users can read", fr: "Dans un dossier de la racine DBFS que tous les utilisateurs peuvent lire" } }
    - { id: b, text: { en: "As a workspace library shared with all the users of etl-shared", fr: "Sous forme de bibliothèque d'espace de travail partagée avec tous les utilisateurs d'etl-shared" } }
    - { id: c, text: { en: "In a Unity Catalog volume on which the installing user has READ VOLUME", fr: "Dans un volume Unity Catalog sur lequel l'utilisateur qui installe dispose de READ VOLUME" } }
    - { id: d, text: { en: "In an init script that runs pip install when the compute starts", fr: "Dans un script d'initialisation qui exécute pip install au démarrage du calcul" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For Databricks Runtime 13.3 LTS and above with Unity Catalog, Databricks recommends storing libraries in Unity Catalog volumes. In standard access mode, the library is installed with the identity of the user who installs it, so that user needs read access to the file in the volume.
    fr: |
      À partir de Databricks Runtime 13.3 LTS avec Unity Catalog, Databricks recommande de stocker les bibliothèques dans des volumes Unity Catalog. En mode d'accès standard, la bibliothèque est installée avec l'identité de l'utilisateur qui l'installe : cet utilisateur doit pouvoir lire le fichier dans le volume.
  options:
    a: { en: "Library storage in the DBFS root is deprecated (any workspace user can modify those files) and isn't supported for wheels in standard access mode.", fr: "Le stockage de bibliothèques dans la racine DBFS est déprécié (tout utilisateur de l'espace de travail peut modifier ces fichiers) et n'est pas pris en charge pour les roues en mode d'accès standard." }
    b: { en: "Workspace libraries are deprecated; storing libraries as workspace files is a different, supported option.", fr: "Les bibliothèques d'espace de travail sont dépréciées ; stocker des bibliothèques sous forme de fichiers d'espace de travail est une autre option, prise en charge." }
    d: { en: "Databricks doesn't recommend init scripts for installing libraries.", fr: "Databricks ne recommande pas les scripts d'initialisation pour installer des bibliothèques." }
references:
  - title: Install libraries
    url: https://learn.microsoft.com/en-us/azure/databricks/libraries/
