id: dp750-sr1-restart-compute-3
objective: "1.1.5"
type: series_yesno
series: dp750-sr1-restart-compute
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You grant the CAN RESTART permission on etl-shared to data-engineers.
  fr: Vous accordez l'autorisation CAN RESTART sur etl-shared à data-engineers.
body:
  solution:
    en: In the permissions of etl-shared, you grant the **CAN RESTART** permission to the data-engineers group.
    fr: Dans les autorisations d'etl-shared, vous accordez l'autorisation **CAN RESTART** au groupe data-engineers.
answer: { value: true }
explanation:
  correct:
    en: CAN RESTART includes everything in CAN ATTACH TO and adds starting, restarting and terminating the compute. Editing, resizing, attaching libraries and modifying permissions require CAN MANAGE, so CAN RESTART is the lowest level that meets every requirement.
    fr: "CAN RESTART inclut tout ce que permet CAN ATTACH TO et ajoute le démarrage, le redémarrage et l'arrêt du calcul. La modification, le redimensionnement, l'attachement de bibliothèques et la modification des autorisations nécessitent CAN MANAGE : CAN RESTART est donc le niveau le plus bas qui répond à toutes les exigences."
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
