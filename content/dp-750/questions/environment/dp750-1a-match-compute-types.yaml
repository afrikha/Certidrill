id: dp750-1a-match-compute-types
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Databricks workspace enabled for Unity Catalog. You need to choose the compute for four workloads.

    Which compute should you use for each workload? To answer, drag the appropriate compute types to the correct workloads. Each compute type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un espace de travail Azure Databricks activé pour Unity Catalog. Vous devez choisir le calcul de quatre charges de travail.

    Quel calcul devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les types de calcul appropriés vers les charges de travail correspondantes. Chaque type de calcul peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: wh_sls, text: { en: "Serverless SQL warehouse", fr: "Entrepôt SQL serverless" } }
    - { id: wh_pro, text: { en: "Pro SQL warehouse", fr: "Entrepôt SQL pro" } }
    - { id: wh_cls, text: { en: "Classic SQL warehouse", fr: "Entrepôt SQL classique" } }
    - { id: ap_std, text: { en: "All-purpose compute, standard access mode", fr: "Calcul polyvalent, mode d'accès standard" } }
    - { id: ap_ded, text: { en: "All-purpose compute, dedicated access mode", fr: "Calcul polyvalent, mode d'accès dédié" } }
    - { id: nb_sls, text: { en: "Serverless compute for notebooks", fr: "Calcul serverless pour les notebooks" } }
  targets:
    - { id: t1, text: { en: "Dashboard SQL queries with highly variable demand that must start in seconds", fr: "Requêtes SQL de tableaux de bord à la demande très variable, qui doivent démarrer en quelques secondes" } }
    - { id: t2, text: { en: "SQL queries that need Predictive IO in a region where serverless SQL warehouses aren't available", fr: "Requêtes SQL qui ont besoin de Predictive IO dans une région où les entrepôts SQL serverless ne sont pas disponibles" } }
    - { id: t3, text: { en: "Python and SQL notebooks shared by several engineers with user isolation, on node types that you choose", fr: "Notebooks Python et SQL partagés par plusieurs ingénieurs avec isolation des utilisateurs, sur des types de nœuds que vous choisissez" } }
    - { id: t4, text: { en: "Interactive R notebooks used by one data scientist", fr: "Notebooks R interactifs utilisés par un scientifique des données" } }
answer:
  mapping: { t1: wh_sls, t2: wh_pro, t3: ap_std, t4: ap_ded }
explanation:
  correct:
    en: |
      Serverless SQL warehouses start in seconds and scale rapidly for variable BI demand. Pro warehouses support Photon and Predictive IO and are the choice when serverless isn't available in the region. Standard access mode lets several users share classic compute with isolation between them (Python, SQL, Scala). R isn't supported in standard access mode or on serverless compute, so it needs dedicated access mode.
    fr: |
      Les entrepôts SQL serverless démarrent en quelques secondes et s'adaptent rapidement à une demande BI variable. Les entrepôts pro prennent en charge Photon et Predictive IO et sont le choix quand le serverless n'est pas disponible dans la région. Le mode d'accès standard permet à plusieurs utilisateurs de partager un calcul classique avec isolation entre eux (Python, SQL, Scala). R n'est pris en charge ni en mode d'accès standard ni sur le calcul serverless : il exige le mode d'accès dédié.
  options:
    wh_cls: { en: "A classic warehouse supports Photon but not Predictive IO.", fr: "Un entrepôt classique prend en charge Photon mais pas Predictive IO." }
    nb_sls: { en: "Serverless compute doesn't let you choose node types and doesn't support R.", fr: "Le calcul serverless ne permet pas de choisir les types de nœuds et ne prend pas en charge R." }
references:
  - title: SQL warehouse types
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/sql-warehouse/warehouse-types
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
