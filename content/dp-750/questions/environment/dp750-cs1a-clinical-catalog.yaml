id: dp750-cs1a-clinical-catalog
objective: "1.2.2"
type: multi
caseStudy: dp750-cs1a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    An external location named **ext_clinical** now points to `abfss://clinical@stlamnaclinical.dfs.core.windows.net/`. You have the CREATE MANAGED STORAGE privilege on ext_clinical.

    You need to create the clinical catalog. The solution must meet the storage and isolation requirements.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un emplacement externe nommé **ext_clinical** pointe désormais vers `abfss://clinical@stlamnaclinical.dfs.core.windows.net/`. Vous disposez du privilège CREATE MANAGED STORAGE sur ext_clinical.

    Vous devez créer le catalogue clinical. La solution doit respecter les exigences de stockage et d'isolation.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: managed, text: { en: "Create the catalog with a MANAGED LOCATION clause set to the ext_clinical path.", fr: "Créer le catalogue avec une clause MANAGED LOCATION définie sur le chemin d'ext_clinical." } }
    - { id: bind, text: { en: "Clear All workspaces have access for the catalog and assign it to adb-lamna-prod.", fr: "Désactiver All workspaces have access pour le catalogue et l'affecter à adb-lamna-prod." } }
    - { id: volume, text: { en: "Create an external volume in the catalog that points to the ext_clinical path.", fr: "Créer dans le catalogue un volume externe qui pointe vers le chemin d'ext_clinical." } }
    - { id: revoke, text: { en: "Grant USE CATALOG on the catalog only to the data engineers of adb-lamna-prod.", fr: "Accorder USE CATALOG sur le catalogue uniquement aux ingénieurs données d'adb-lamna-prod." } }
    - { id: metastore, text: { en: "Create a second metastore and attach adb-lamna-prod to it.", fr: "Créer un second metastore et y attacher adb-lamna-prod." } }
answer: { optionIds: [ managed, bind ] }
explanation:
  correct:
    en: "`CREATE CATALOG clinical MANAGED LOCATION '<path>'` stores the catalog's managed tables in a path defined by an external location instead of the metastore-level storage, which requires CREATE MANAGED STORAGE on that external location. Catalogs are open to every workspace attached to the metastore by default; workspace-catalog binding restricts the catalog to adb-lamna-prod, and access from an unbound workspace is denied even for users who hold privileges on the catalog."
    fr: "`CREATE CATALOG clinical MANAGED LOCATION '<chemin>'` stocke les tables managées du catalogue dans un chemin défini par un emplacement externe au lieu du stockage de niveau metastore, ce qui exige CREATE MANAGED STORAGE sur cet emplacement externe. Par défaut, un catalogue est ouvert à tous les espaces de travail attachés au metastore ; la liaison espace de travail-catalogue limite le catalogue à adb-lamna-prod, et l'accès depuis un espace de travail non lié est refusé même aux utilisateurs qui ont des privilèges sur le catalogue."
  options:
    volume: { en: "A volume governs non-tabular files; it doesn't change where the catalog's managed tables are stored.", fr: "Un volume gouverne des fichiers non tabulaires ; il ne change pas l'emplacement de stockage des tables managées du catalogue." }
    revoke: { en: "Privileges are granted to principals, not workspaces; the same engineers use both workspaces, so they could still reach the catalog from adb-lamna-dev.", fr: "Les privilèges sont accordés à des principaux, pas à des espaces de travail ; les mêmes ingénieurs utilisent les deux espaces de travail et pourraient donc atteindre le catalogue depuis adb-lamna-dev." }
    metastore: { en: "A separate metastore isn't needed: binding the catalog to one workspace isolates it inside the existing metastore.", fr: "Un metastore distinct n'est pas nécessaire : lier le catalogue à un espace de travail l'isole au sein du metastore existant." }
references:
  - title: CREATE CATALOG
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-catalog
  - title: Workspace-catalog binding
    url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/binding
