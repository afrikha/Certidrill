id: dp750-1a-dedicated-requirements
objective: "1.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware plans to create one classic all-purpose compute resource in standard access mode for its data team. The workspace is enabled for Unity Catalog. Before creating the compute, you review the team's requirements.

    Which two requirements can't be met in standard access mode and require dedicated access mode?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de créer une ressource de calcul polyvalent classique en mode d'accès standard pour son équipe de données. L'espace de travail est activé pour Unity Catalog. Avant de créer le calcul, vous passez en revue les exigences de l'équipe.

    Quelles sont les deux exigences qui ne peuvent pas être satisfaites en mode d'accès standard et qui exigent le mode d'accès dédié ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run notebooks written in R.", fr: "Exécuter des notebooks écrits en R." } }
    - { id: b, text: { en: "Use Databricks Runtime for Machine Learning.", fr: "Utiliser Databricks Runtime pour Machine Learning." } }
    - { id: c, text: { en: "Run Python UDFs on Unity Catalog tables.", fr: "Exécuter des fonctions définies par l'utilisateur (UDF) Python sur des tables Unity Catalog." } }
    - { id: d, text: { en: "Run Scala notebooks on Databricks Runtime 16.4 LTS.", fr: "Exécuter des notebooks Scala sur Databricks Runtime 16.4 LTS." } }
    - { id: e, text: { en: "Query Unity Catalog tables from SQL cells.", fr: "Interroger des tables Unity Catalog depuis des cellules SQL." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Standard access mode supports Python, SQL and Scala, but not R. Databricks Runtime ML isn't supported in standard access mode either; when you select it, the Auto access mode picks dedicated. Both requirements therefore need dedicated compute, assigned to a user or a group.
    fr: |
      Le mode d'accès standard prend en charge Python, SQL et Scala, mais pas R. Databricks Runtime ML n'est pas non plus pris en charge en mode d'accès standard ; quand vous le sélectionnez, le mode d'accès Auto choisit le mode dédié. Ces deux exigences nécessitent donc un calcul dédié, attribué à un utilisateur ou à un groupe.
  options:
    c: { en: "Python UDFs run on standard compute; only Hive UDFs are unsupported (use Unity Catalog UDFs instead).", fr: "Les UDF Python s'exécutent sur le calcul standard ; seules les UDF Hive ne sont pas prises en charge (utilisez plutôt des UDF Unity Catalog)." }
    d: { en: "Scala is supported in standard access mode on Databricks Runtime 13.3 and above.", fr: "Scala est pris en charge en mode d'accès standard à partir de Databricks Runtime 13.3." }
    e: { en: "SQL on Unity Catalog tables is the core use case of standard access mode.", fr: "Le SQL sur des tables Unity Catalog est le cas d'usage principal du mode d'accès standard." }
references:
  - title: Standard compute requirements and limitations
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/access-mode-limitations
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
