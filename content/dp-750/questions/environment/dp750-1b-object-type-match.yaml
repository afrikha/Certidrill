id: dp750-1b-object-type-match
objective: "1.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware is designing the objects of its Unity Catalog schema **litware_prod.sales**. Each requirement in the answer area describes one object.

    Which type of object should you create for each requirement? To answer, drag the appropriate object types to the correct requirements. Each object type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit les objets de son schéma Unity Catalog **litware_prod.sales**. Chaque exigence de la zone de réponse décrit un objet.

    Quel type d'objet devez-vous créer pour chaque exigence ? Pour répondre, faites glisser les types d'objets appropriés vers les exigences correspondantes. Chaque type d'objet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: managed, text: { en: "Managed table", fr: "Table managée" } }
    - { id: external, text: { en: "External table", fr: "Table externe" } }
    - { id: view, text: { en: "View", fr: "Vue" } }
    - { id: mv, text: { en: "Materialized view", fr: "Vue matérialisée" } }
    - { id: tempview, text: { en: "Temporary view", fr: "Vue temporaire" } }
    - { id: volume, text: { en: "Volume", fr: "Volume" } }
  targets:
    - id: t1
      text: { en: "Store daily revenue aggregates that are precomputed and refreshed on a schedule", fr: "Stocker des agrégats de chiffre d'affaires quotidiens précalculés et actualisés selon une planification" }
    - id: t2
      text: { en: "Expose five columns of the customers table to analysts, always current, without storing data", fr: "Exposer cinq colonnes de la table customers aux analystes, toujours à jour, sans stocker de données" }
    - id: t3
      text: { en: "Hold order rows updated by MERGE statements, with automatic optimization and the lowest storage cost", fr: "Contenir des lignes de commandes mises à jour par des instructions MERGE, avec optimisation automatique et le coût de stockage le plus bas" }
    - id: t4
      text: { en: "Register Avro files that a third-party application keeps writing to an existing ADLS Gen2 path", fr: "Inscrire des fichiers Avro qu'une application tierce continue d'écrire dans un chemin ADLS Gen2 existant" }
answer:
  mapping: { t1: mv, t2: view, t3: managed, t4: external }
explanation:
  correct:
    en: A materialized view stores precomputed results and refreshes them. A view stores only its query and returns current data at query time. Managed tables are the recommended default, with automatic optimization and lower costs. An external table registers data in a format that managed tables do not support, such as Avro, at a path that other clients write to directly.
    fr: Une vue matérialisée stocke des résultats précalculés et les actualise. Une vue ne stocke que sa requête et renvoie des données à jour au moment de la requête. Les tables managées sont le choix par défaut recommandé, avec optimisation automatique et coûts réduits. Une table externe inscrit des données dans un format que les tables managées ne prennent pas en charge, comme Avro, à un chemin dans lequel d'autres clients écrivent directement.
  options:
    tempview: { en: "A temporary view is not registered in the schema and is gone at the end of its session.", fr: "Une vue temporaire n'est pas inscrite dans le schéma et disparaît à la fin de sa session." }
    volume: { en: "Volumes govern non-tabular files; files in a volume cannot be registered as tables.", fr: "Les volumes gouvernent des fichiers non tabulaires ; les fichiers d'un volume ne peuvent pas être inscrits comme tables." }
references:
  - title: What is a view?
    url: https://learn.microsoft.com/en-us/azure/databricks/views/
  - title: Work with external tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/external
