id: dp750-sr1-restart-compute-1
objective: "1.1.5"
type: series_yesno
series: dp750-sr1-restart-compute
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You grant the CAN ATTACH TO permission on etl-shared to data-engineers.
  fr: Vous accordez l'autorisation CAN ATTACH TO sur etl-shared à data-engineers.
body:
  solution:
    en: In the permissions of etl-shared, you grant the **CAN ATTACH TO** permission to the data-engineers group.
    fr: Dans les autorisations d'etl-shared, vous accordez l'autorisation **CAN ATTACH TO** au groupe data-engineers.
answer: { value: false }
explanation:
  correct:
    en: CAN ATTACH TO lets the members attach notebooks and view the Spark UI and compute metrics, but it does not allow them to start, restart or terminate the compute. After an automatic termination, data-engineers could not start etl-shared again.
    fr: "CAN ATTACH TO permet aux membres d'attacher des notebooks et de consulter l'interface utilisateur Spark et les métriques du calcul, mais pas de démarrer, redémarrer ni arrêter le calcul. Après un arrêt automatique, data-engineers ne pourrait pas redémarrer etl-shared."
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
