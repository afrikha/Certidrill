id: dp750-1b-schema-isolated-storage-steps
objective: "1.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You are a metastore admin for Litware. A storage credential named **cred-litware-ml** grants access to the ADLS Gen2 container `ml-data`. No external location covers this container.

    A data engineer named User1 must create a schema named **litware_prod.ml** whose managed tables are stored in `ml-data`. User1 already has the USE CATALOG and CREATE SCHEMA privileges on litware_prod. After the schema is created, the group **grp-ml-engineers** must be able to create tables in it.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous êtes administrateur du metastore de Litware. Des informations d'identification de stockage nommées **cred-litware-ml** donnent accès au conteneur ADLS Gen2 `ml-data`. Aucun emplacement externe ne couvre ce conteneur.

    Un ingénieur données nommé User1 doit créer un schéma nommé **litware_prod.ml** dont les tables managées sont stockées dans `ml-data`. User1 dispose déjà des privilèges USE CATALOG et CREATE SCHEMA sur litware_prod. Une fois le schéma créé, le groupe **grp-ml-engineers** doit pouvoir y créer des tables.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: extloc, text: { en: "Create an external location for the ml-data container that uses cred-litware-ml.", fr: "Créer un emplacement externe pour le conteneur ml-data qui utilise cred-litware-ml." } }
    - { id: grantms, text: { en: "Grant User1 the CREATE MANAGED STORAGE privilege on the external location.", fr: "Accorder à User1 le privilège CREATE MANAGED STORAGE sur l'emplacement externe." } }
    - { id: create, text: { en: "As User1, run CREATE SCHEMA litware_prod.ml with a MANAGED LOCATION clause for the ml-data path.", fr: "En tant que User1, exécuter CREATE SCHEMA litware_prod.ml avec une clause MANAGED LOCATION pour le chemin ml-data." } }
    - { id: grantgrp, text: { en: "Grant grp-ml-engineers the USE SCHEMA and CREATE TABLE privileges on litware_prod.ml.", fr: "Accorder à grp-ml-engineers les privilèges USE SCHEMA et CREATE TABLE sur litware_prod.ml." } }
    - { id: grantext, text: { en: "Grant User1 the CREATE EXTERNAL TABLE privilege on the external location.", fr: "Accorder à User1 le privilège CREATE EXTERNAL TABLE sur l'emplacement externe." } }
    - { id: altercat, text: { en: "Run ALTER CATALOG litware_prod SET MANAGED LOCATION for the ml-data path.", fr: "Exécuter ALTER CATALOG litware_prod SET MANAGED LOCATION pour le chemin ml-data." } }
    - { id: volume, text: { en: "Create an external volume on the ml-data path.", fr: "Créer un volume externe sur le chemin ml-data." } }
answer:
  sequence: [ extloc, grantms, create, grantgrp ]
explanation:
  correct:
    en: A schema managed location must be contained in an external location, so you first create one on top of the storage credential. User1 then needs CREATE MANAGED STORAGE on that external location to set it as the schema's managed location, and runs CREATE SCHEMA with MANAGED LOCATION. Finally, the group needs USE SCHEMA and CREATE TABLE on the new schema (it already exists at that point).
    fr: L'emplacement managé d'un schéma doit être contenu dans un emplacement externe ; vous en créez donc d'abord un à partir des informations d'identification de stockage. User1 a ensuite besoin de CREATE MANAGED STORAGE sur cet emplacement externe pour l'utiliser comme emplacement managé du schéma, puis exécute CREATE SCHEMA avec MANAGED LOCATION. Enfin, le groupe a besoin de USE SCHEMA et CREATE TABLE sur le nouveau schéma (qui existe alors).
  options:
    grantext: { en: "CREATE EXTERNAL TABLE allows external tables on the path; the schema's tables must be managed.", fr: "CREATE EXTERNAL TABLE permet des tables externes sur le chemin ; les tables du schéma doivent être managées." }
    altercat: { en: "This would change the managed location of the whole catalog for new objects, not only of the ml schema.", fr: "Cela modifierait l'emplacement managé de tout le catalogue pour les nouveaux objets, pas seulement celui du schéma ml." }
    volume: { en: "An external volume governs files at a path; it does not provide a managed location for a schema.", fr: "Un volume externe gouverne des fichiers à un chemin ; il ne fournit pas d'emplacement managé à un schéma." }
references:
  - title: Specify a managed storage location in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/managed-storage
  - title: Create schemas
    url: https://learn.microsoft.com/en-us/azure/databricks/schemas/create-schema
