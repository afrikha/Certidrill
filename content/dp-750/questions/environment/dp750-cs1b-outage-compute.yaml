id: dp750-cs1b-outage-compute
objective: "1.1.1"
type: single
caseStudy: dp750-cs1b-city-power-light
difficulty: 2
status: draft
stem:
  en: |
    You create a Lakeflow job that runs the outage detection notebook.

    You need to choose the compute for the job's notebook task. The solution must meet the outage detection requirements.

    What should you use?
  fr: |
    Vous créez un job Lakeflow qui exécute le notebook de détection des pannes.

    Vous devez choisir le calcul de la tâche de notebook du job. La solution doit respecter les exigences de détection des pannes.

    Que devez-vous utiliser ?
body:
  options:
    - { id: serverless, text: { en: "Serverless compute for jobs", fr: "Le calcul serverless pour les jobs" } }
    - { id: jobcompute, text: { en: "A classic job compute cluster defined in the job", fr: "Un cluster de calcul de job classique défini dans le job" } }
    - { id: allpurpose, text: { en: "An all-purpose cluster in dedicated access mode", fr: "Un cluster polyvalent en mode d'accès dédié" } }
    - { id: warehouse, text: { en: "A serverless SQL warehouse", fr: "Un entrepôt SQL serverless" } }
answer: { optionId: jobcompute }
explanation:
  correct:
    en: |
      A job compute cluster is created for a run of the job and can't be used by other jobs or interactive users, so it is dedicated to the outage detection job. Classic compute supports a processing-time trigger, which the outage stream needs to process events every 10 seconds around the clock.
    fr: |
      Un cluster de calcul de job est créé pour une exécution du job et ne peut pas être utilisé par d'autres jobs ni par des utilisateurs interactifs : il est donc dédié au job de détection des pannes. Le calcul classique prend en charge un déclencheur de temps de traitement, nécessaire pour traiter les événements de panne toutes les 10 secondes en continu.
  options:
    serverless: { en: "Serverless notebooks and jobs support only the AvailableNow and Once triggers, so a 10-second processing-time trigger can't run there.", fr: "Les notebooks et jobs serverless ne prennent en charge que les déclencheurs AvailableNow et Once : un déclencheur de temps de traitement de 10 secondes ne peut pas s'y exécuter." }
    allpurpose: { en: "Other jobs and users with the right permission can attach to an all-purpose cluster, and Databricks doesn't recommend it for production jobs.", fr: "D'autres jobs et utilisateurs disposant de l'autorisation adéquate peuvent s'attacher à un cluster polyvalent, et Databricks ne le recommande pas pour les jobs de production." }
    warehouse: { en: "A SQL warehouse runs SQL tasks; it can't run a Python notebook that uses Structured Streaming.", fr: "Un entrepôt SQL exécute des tâches SQL ; il ne peut pas exécuter un notebook Python qui utilise Structured Streaming." }
references:
  - title: Configure Structured Streaming trigger intervals
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/triggers
  - title: Configure compute for jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/compute
