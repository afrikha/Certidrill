id: dp750-1a-job-compute-choices
objective: "1.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has an Azure Databricks workspace enabled for Unity Catalog and serverless compute. You are designing four tasks for Lakeflow Jobs.

    Which compute should you use for each task? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un espace de travail Azure Databricks activé pour Unity Catalog et le calcul serverless. Vous concevez quatre tâches pour Lakeflow Jobs.

    Quel calcul devez-vous utiliser pour chaque tâche ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - A nightly notebook task that can start up to 10 minutes late and must minimize cost: [[nightly]]
      - A notebook task that must start as quickly as possible when a file arrives, with no compute to configure: [[urgent]]
      - A Spark Submit task that runs a legacy application: [[submit]]
      - A SQL task that refreshes the tables used by a dashboard: [[sql]]
    fr: |
      - Une tâche de notebook nocturne qui peut démarrer jusqu'à 10 minutes en retard et doit réduire les coûts au minimum : [[nightly]]
      - Une tâche de notebook qui doit démarrer le plus vite possible à l'arrivée d'un fichier, sans calcul à configurer : [[urgent]]
      - Une tâche Spark Submit qui exécute une application héritée : [[submit]]
      - Une tâche SQL qui actualise les tables utilisées par un tableau de bord : [[sql]]
  slots:
    - id: nightly
      options:
        - { id: off, text: { en: "Serverless compute for jobs, performance optimized disabled", fr: "Calcul serverless pour les jobs, performance optimized désactivé" } }
        - { id: on, text: { en: "Serverless compute for jobs, performance optimized enabled", fr: "Calcul serverless pour les jobs, performance optimized activé" } }
        - { id: classic, text: { en: "Classic jobs compute", fr: "Calcul de jobs classique" } }
        - { id: wh, text: { en: "Serverless SQL warehouse", fr: "Entrepôt SQL serverless" } }
    - id: urgent
      options:
        - { id: off, text: { en: "Serverless compute for jobs, performance optimized disabled", fr: "Calcul serverless pour les jobs, performance optimized désactivé" } }
        - { id: on, text: { en: "Serverless compute for jobs, performance optimized enabled", fr: "Calcul serverless pour les jobs, performance optimized activé" } }
        - { id: classic, text: { en: "Classic jobs compute", fr: "Calcul de jobs classique" } }
        - { id: wh, text: { en: "Serverless SQL warehouse", fr: "Entrepôt SQL serverless" } }
    - id: submit
      options:
        - { id: off, text: { en: "Serverless compute for jobs, performance optimized disabled", fr: "Calcul serverless pour les jobs, performance optimized désactivé" } }
        - { id: on, text: { en: "Serverless compute for jobs, performance optimized enabled", fr: "Calcul serverless pour les jobs, performance optimized activé" } }
        - { id: classic, text: { en: "Classic jobs compute", fr: "Calcul de jobs classique" } }
        - { id: wh, text: { en: "Serverless SQL warehouse", fr: "Entrepôt SQL serverless" } }
    - id: sql
      options:
        - { id: off, text: { en: "Serverless compute for jobs, performance optimized disabled", fr: "Calcul serverless pour les jobs, performance optimized désactivé" } }
        - { id: on, text: { en: "Serverless compute for jobs, performance optimized enabled", fr: "Calcul serverless pour les jobs, performance optimized activé" } }
        - { id: classic, text: { en: "Classic jobs compute", fr: "Calcul de jobs classique" } }
        - { id: wh, text: { en: "Serverless SQL warehouse", fr: "Entrepôt SQL serverless" } }
answer:
  values: { nightly: off, urgent: on, submit: classic, sql: wh }
explanation:
  correct:
    en: |
      With performance optimized disabled, a serverless job consumes fewer DBUs and tolerates a startup latency of about 4 to 6 minutes, which suits the nightly task. Enabling performance optimized makes the job start and run faster for time-sensitive work. Classic jobs compute is the only recommended option for Spark Submit tasks, and a serverless SQL warehouse is recommended for SQL tasks.
    fr: |
      Avec « performance optimized » désactivé, un job serverless consomme moins de DBU et accepte une latence de démarrage de 4 à 6 minutes environ, ce qui convient à la tâche nocturne. L'activation de « performance optimized » fait démarrer et s'exécuter le job plus vite pour un travail urgent. Le calcul de jobs classique est la seule option recommandée pour les tâches Spark Submit, et un entrepôt SQL serverless est recommandé pour les tâches SQL.
  options:
    classic: { en: "Classic jobs compute is needed only for Spark Submit here; for notebooks, serverless needs no configuration.", fr: "Le calcul de jobs classique n'est nécessaire ici que pour Spark Submit ; pour les notebooks, le serverless ne demande aucune configuration." }
    wh: { en: "SQL warehouses run SQL and dbt tasks, not notebook or Spark Submit tasks written in Python.", fr: "Les entrepôts SQL exécutent des tâches SQL et dbt, pas des tâches de notebook ou Spark Submit écrites en Python." }
references:
  - title: Configure compute for jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/compute
  - title: Run your Lakeflow Jobs with serverless compute for workflows
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-serverless-jobs
