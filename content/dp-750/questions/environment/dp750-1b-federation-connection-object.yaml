id: dp750-1b-federation-connection-object
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is configuring Lakehouse Federation to an Azure SQL Database. The security team asks which Unity Catalog object stores the host name, the port and the credentials that Azure Databricks uses to reach the database.

    Which object should you identify?
  fr: |
    Proseware configure Lakehouse Federation vers une base Azure SQL Database. L'équipe de sécurité demande quel objet Unity Catalog stocke le nom d'hôte, le port et les informations d'identification qu'Azure Databricks utilise pour joindre la base.

    Quel objet devez-vous indiquer ?
body:
  options:
    - { id: a, text: { en: "The foreign catalog", fr: "Le catalogue étranger" } }
    - { id: b, text: { en: "The connection", fr: "La connexion" } }
    - { id: c, text: { en: "A storage credential", fr: "Des informations d'identification de stockage" } }
    - { id: d, text: { en: "An external location", fr: "Un emplacement externe" } }
answer: { optionId: b }
explanation:
  correct:
    en: In Lakehouse Federation, the connection stores the access credentials and the location of the external database (host and port, or JDBC URL). The foreign catalog is created from the connection and mirrors the database in Unity Catalog.
    fr: Dans Lakehouse Federation, la connexion stocke les informations d'identification d'accès et l'emplacement de la base externe (hôte et port, ou URL JDBC). Le catalogue étranger est créé à partir de la connexion et reflète la base dans Unity Catalog.
  options:
    a:
      en: The foreign catalog mirrors the database's schemas and tables and refers to the connection; it does not hold the credentials.
      fr: Le catalogue étranger reflète les schémas et tables de la base et fait référence à la connexion ; il ne contient pas les informations d'identification.
    c:
      en: A storage credential gives access to cloud object storage, not to a database.
      fr: Des informations d'identification de stockage donnent accès à un stockage objet cloud, pas à une base de données.
    d:
      en: An external location combines a storage path with a storage credential; it is not used for query federation to a database.
      fr: Un emplacement externe associe un chemin de stockage à des informations d'identification de stockage ; il ne sert pas à la fédération de requêtes vers une base.
references:
  - title: Connect to external databases and catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/
