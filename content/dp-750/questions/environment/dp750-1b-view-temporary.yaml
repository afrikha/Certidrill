id: dp750-1b-view-temporary
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineer develops a notebook that filters the table **tailspin_dev.silver.flights** several times before writing a final result. The intermediate filtered result must be reusable by name in later cells of the same notebook. It must not be registered in Unity Catalog, store no data, and disappear when the notebook detaches from its compute.

    What should you create?
  fr: |
    Un ingénieur données développe un notebook qui filtre plusieurs fois la table **tailspin_dev.silver.flights** avant d'écrire un résultat final. Le résultat filtré intermédiaire doit pouvoir être réutilisé par son nom dans les cellules suivantes du même notebook. Il ne doit pas être inscrit dans Unity Catalog, ne doit stocker aucune donnée et doit disparaître lorsque le notebook se détache de son calcul.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A temporary view", fr: "Une vue temporaire" } }
    - { id: b, text: { en: "A view in the tailspin_dev.silver schema", fr: "Une vue dans le schéma tailspin_dev.silver" } }
    - { id: c, text: { en: "A materialized view", fr: "Une vue matérialisée" } }
    - { id: d, text: { en: "A global temporary view", fr: "Une vue temporaire globale" } }
answer: { optionId: a }
explanation:
  correct:
    en: A temporary view is not persisted or registered in any catalog or schema. In notebooks and jobs, it is scoped to the notebook or script and is dropped when the notebook detaches.
    fr: Une vue temporaire n'est ni persistante ni inscrite dans un catalogue ou un schéma. Dans les notebooks et les jobs, sa portée est le notebook ou le script, et elle est supprimée lorsque le notebook se détache.
  options:
    b:
      en: A view in a schema is a Unity Catalog object that stays registered until it is dropped.
      fr: Une vue dans un schéma est un objet Unity Catalog qui reste inscrit jusqu'à sa suppression.
    c:
      en: A materialized view is registered in Unity Catalog and stores its results.
      fr: Une vue matérialisée est inscrite dans Unity Catalog et stocke ses résultats.
    d:
      en: A global temporary view is a legacy object shared across the workloads of a compute resource, not limited to one notebook; Databricks recommends against it.
      fr: Une vue temporaire globale est un objet hérité partagé entre les charges de travail d'une ressource de calcul, non limité à un notebook ; Databricks déconseille son utilisation.
references:
  - title: What is a view?
    url: https://learn.microsoft.com/en-us/azure/databricks/views/
