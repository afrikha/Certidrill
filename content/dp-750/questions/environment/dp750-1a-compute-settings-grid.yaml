id: dp750-1a-compute-settings-grid
objective: "1.1.2"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a classic all-purpose compute resource named **analytics-shared**. Its configuration is shown in the following table.

    Users report two issues:

    - Notebooks that call `collect()` on large DataFrames fail with out-of-memory errors on the driver.
    - analytics-shared stays running for two hours after the last command, which costs too much.

    Answer each prompt by selecting the setting that you should change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une ressource de calcul polyvalent classique nommée **analytics-shared**. Sa configuration figure dans le tableau suivant.

    Les utilisateurs signalent deux problèmes :

    - Les notebooks qui appellent `collect()` sur de grands DataFrames échouent avec des erreurs de mémoire insuffisante sur le pilote.
    - analytics-shared reste en marche pendant deux heures après la dernière commande, ce qui coûte trop cher.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "Fix the out-of-memory errors caused by collect()", fr: "Corriger les erreurs de mémoire insuffisante causées par collect()" } }
    - { id: p2, text: { en: "Make the compute stop sooner when it's idle", fr: "Faire en sorte que le calcul s'arrête plus tôt lorsqu'il est inactif" } }
  grid:
    header: [{ en: Setting, fr: Paramètre }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: Access mode, area: access }, { text: Standard }]
      - [{ text: Databricks Runtime Version, area: runtime }, { text: 17.3 LTS }]
      - [{ text: Use Photon Acceleration, area: photon }, { text: { en: Selected, fr: Sélectionné } }]
      - [{ text: Worker type, area: worker }, { text: Standard_D8ds_v5 }]
      - [{ text: Enable autoscaling (Min / Max), area: scaling }, { text: 2 / 8 }]
      - [{ text: Driver type, area: driver }, { text: { en: Same as worker, fr: Identique au worker } }]
      - [{ text: Terminate after (minutes of inactivity), area: term }, { text: "120" }]
      - [{ text: Use spot instances, area: spot }, { text: { en: Cleared, fr: Désélectionné } }]
answer:
  values: { p1: driver, p2: term }
explanation:
  correct:
    en: |
      `collect()` brings the results back to the driver, which also keeps notebook state; choose a larger driver type with more memory when you collect large datasets. The compute terminates when the time since the last command exceeds the automatic termination period, so lowering it from 120 minutes makes the compute stop sooner.
    fr: |
      `collect()` rapatrie les résultats sur le pilote, qui conserve aussi l'état des notebooks ; choisissez un type de pilote plus grand, avec plus de mémoire, lorsque vous collectez de grands jeux de données. Le calcul s'arrête lorsque le temps écoulé depuis la dernière commande dépasse la période d'arrêt automatique : la réduire en dessous de 120 minutes arrête le calcul plus tôt.
  options:
    worker: { en: "Larger workers add executor memory, but collect() results land on the driver.", fr: "Des workers plus grands ajoutent de la mémoire aux exécuteurs, mais les résultats de collect() arrivent sur le pilote." }
    scaling: { en: "More workers don't add memory to the driver, and autoscaling doesn't stop idle compute.", fr: "Davantage de workers n'ajoutent pas de mémoire au pilote, et la mise à l'échelle automatique n'arrête pas un calcul inactif." }
references:
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
