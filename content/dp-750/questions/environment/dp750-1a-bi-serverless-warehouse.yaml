id: dp750-1a-bi-serverless-warehouse
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam analysts use AI/BI dashboards and Power BI to query the tables in `fabrikam_prod.gold`. Demand is highly variable: a few queries during most of the day and large bursts at month end. Analysts complain that they wait several minutes each time the compute starts.

    You need to provide compute for these SQL queries. The solution must start in seconds, scale quickly with demand and minimize administrative effort.

    What should you use?
  fr: |
    Les analystes de Fabrikam utilisent des tableaux de bord AI/BI et Power BI pour interroger les tables de `fabrikam_prod.gold`. La demande est très variable : quelques requêtes pendant la majeure partie de la journée et de forts pics en fin de mois. Les analystes se plaignent d'attendre plusieurs minutes à chaque démarrage du calcul.

    Vous devez fournir le calcul pour ces requêtes SQL. La solution doit démarrer en quelques secondes, s'adapter rapidement à la demande et réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A pro SQL warehouse", fr: "Un entrepôt SQL pro" } }
    - { id: b, text: { en: "A serverless SQL warehouse", fr: "Un entrepôt SQL serverless" } }
    - { id: c, text: { en: "A classic SQL warehouse", fr: "Un entrepôt SQL classique" } }
    - { id: d, text: { en: "An all-purpose compute resource in standard access mode", fr: "Une ressource de calcul polyvalent en mode d'accès standard" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A serverless SQL warehouse starts in about 2 to 6 seconds, scales up and down rapidly and supports all Databricks SQL performance features, including Intelligent Workload Management. Databricks recommends it for BI and exploratory workloads with variable demand, and the compute is managed for you.
    fr: |
      Un entrepôt SQL serverless démarre en 2 à 6 secondes environ, monte et descend rapidement en charge et prend en charge toutes les fonctionnalités de performance de Databricks SQL, y compris Intelligent Workload Management. Databricks le recommande pour les charges BI et exploratoires à la demande variable, et le calcul est géré pour vous.
  options:
    a: { en: "A pro warehouse runs in your Azure subscription, takes about 4 minutes to start and scales less responsively.", fr: "Un entrepôt pro s'exécute dans votre abonnement Azure, démarre en 4 minutes environ et s'adapte moins vite." }
    c: { en: "A classic warehouse also takes about 4 minutes to start and offers only entry-level performance.", fr: "Un entrepôt classique démarre lui aussi en 4 minutes environ et n'offre qu'un niveau de performance d'entrée de gamme." }
    d: { en: "All-purpose classic compute is provisioned in your subscription, takes minutes to start and isn't the compute optimized for BI tools and dashboards.", fr: "Le calcul polyvalent classique est provisionné dans votre abonnement, démarre en plusieurs minutes et n'est pas le calcul optimisé pour les outils BI et les tableaux de bord." }
references:
  - title: SQL warehouse types
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/sql-warehouse/warehouse-types
