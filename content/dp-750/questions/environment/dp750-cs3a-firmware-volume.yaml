id: dp750-cs3a-firmware-volume
objective: "1.2.4"
type: dropdown
caseStudy: dp750-cs3a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet firmware logs requirement 7. You have the CREATE EXTERNAL VOLUME privilege on el-firmware.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence 7 relative aux journaux de firmware. Vous disposez du privilège CREATE EXTERNAL VOLUME sur el-firmware.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE [[kind]] pw_prod.raw.firmware_logs
    [[loc]];

    GRANT [[priv]] ON VOLUME pw_prod.raw.firmware_logs TO `maintenance-engineers`;
  slots:
    - id: kind
      options:
        - { id: extvol, text: EXTERNAL VOLUME }
        - { id: vol, text: VOLUME }
        - { id: exttable, text: EXTERNAL TABLE }
    - id: loc
      options:
        - { id: location, text: "LOCATION 'abfss://firmware@stpwvendor.dfs.core.windows.net/logs'" }
        - { id: managed, text: "MANAGED LOCATION 'abfss://firmware@stpwvendor.dfs.core.windows.net/logs'" }
        - { id: options, text: "OPTIONS (path 'abfss://firmware@stpwvendor.dfs.core.windows.net/logs')" }
    - id: priv
      options:
        - { id: readvol, text: READ VOLUME }
        - { id: writevol, text: WRITE VOLUME }
        - { id: readfiles, text: READ FILES }
        - { id: select, text: SELECT }
answer:
  values: { kind: extvol, loc: location, priv: readvol }
explanation:
  correct:
    en: |
      An external volume registers an existing path of an external location in Unity Catalog, so the files stay where Brewtech writes them and users read them with /Volumes/pw_prod/raw/firmware_logs paths. CREATE EXTERNAL VOLUME takes the path in a LOCATION clause. READ VOLUME lets maintenance-engineers read the files without being able to write or delete them; access through the volume path is governed by the privileges on the volume, not on the external location.
    fr: |
      Un volume externe inscrit dans Unity Catalog un chemin existant d'un emplacement externe : les fichiers restent là où Brewtech les écrit, et les utilisateurs les lisent avec des chemins /Volumes/pw_prod/raw/firmware_logs. CREATE EXTERNAL VOLUME reçoit le chemin dans une clause LOCATION. READ VOLUME permet à maintenance-engineers de lire les fichiers sans pouvoir les écrire ni les supprimer ; l'accès par le chemin du volume est régi par les privilèges sur le volume, pas sur l'emplacement externe.
  options:
    vol: { en: "CREATE VOLUME without EXTERNAL creates a managed volume in the managed storage of the schema; the files would have to be copied there.", fr: "CREATE VOLUME sans EXTERNAL crée un volume managé dans le stockage managé du schéma ; il faudrait y copier les fichiers." }
    exttable: { en: "Log files are not tabular data, and a table is not read through /Volumes paths.", fr: "Les fichiers journaux ne sont pas des données tabulaires, et une table ne se lit pas par des chemins /Volumes." }
    managed: { en: "MANAGED LOCATION sets the managed storage of a catalog or schema; it is not the path of an external volume.", fr: "MANAGED LOCATION définit le stockage managé d'un catalogue ou d'un schéma ; ce n'est pas le chemin d'un volume externe." }
    options: { en: "An OPTIONS (path …) clause is not how a volume receives its storage path.", fr: "Une clause OPTIONS (path …) n'est pas la façon dont un volume reçoit son chemin de stockage." }
    writevol: { en: "WRITE VOLUME would let the group add, modify and delete files.", fr: "WRITE VOLUME permettrait au groupe d'ajouter, de modifier et de supprimer des fichiers." }
    readfiles: { en: "READ FILES is a privilege on external locations, not on volumes.", fr: "READ FILES est un privilège sur les emplacements externes, pas sur les volumes." }
    select: { en: "SELECT applies to tables and views, not to volumes.", fr: "SELECT s'applique aux tables et aux vues, pas aux volumes." }
references:
  - title: Create and manage Unity Catalog volumes
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/utility-commands
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
