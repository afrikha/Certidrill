id: dp750-1a-catalog-name-rules
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso's naming convention requires each Unity Catalog catalog name to combine a business unit and an environment, separated by a single character, for example the sales business unit in the dev environment. You can enclose names in backticks in SQL statements.

    Which catalog name can you create?
  fr: |
    La convention d'affectation de noms de Contoso exige que chaque nom de catalogue Unity Catalog combine une unité commerciale et un environnement, séparés par un seul caractère, par exemple l'unité commerciale sales dans l'environnement dev. Vous pouvez placer les noms entre accents graves (backticks) dans les instructions SQL.

    Quel nom de catalogue pouvez-vous créer ?
body:
  options:
    - { id: a, text: "sales dev" }
    - { id: b, text: "sales.dev" }
    - { id: c, text: "sales/dev" }
    - { id: d, text: "sales-dev" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Unity Catalog names can contain special characters such as hyphens if you enclose them in backticks, for example ``CREATE CATALOG `sales-dev` ``. Periods, spaces, forward slashes and control characters are forbidden in every Unity Catalog object name, even with backticks. Names are stored in lowercase and can be up to 255 characters long.
    fr: |
      Les noms Unity Catalog peuvent contenir des caractères spéciaux comme le trait d'union si vous les placez entre accents graves, par exemple ``CREATE CATALOG `sales-dev` ``. Les points, les espaces, les barres obliques et les caractères de contrôle sont interdits dans tout nom d'objet Unity Catalog, même entre accents graves. Les noms sont stockés en minuscules et peuvent compter jusqu'à 255 caractères.
  options:
    a: { en: "Spaces aren't allowed in Unity Catalog names, even with backticks.", fr: "Les espaces ne sont pas autorisés dans les noms Unity Catalog, même entre accents graves." }
    b: { en: "The period separates the levels of the three-level namespace and is forbidden in names.", fr: "Le point sépare les niveaux de l'espace de noms à trois niveaux et est interdit dans les noms." }
    c: { en: "Forward slashes aren't allowed in Unity Catalog names.", fr: "Les barres obliques ne sont pas autorisées dans les noms Unity Catalog." }
references:
  - title: Names
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-names
