id: dp750-1a-jar-standard-order
objective: "1.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has a classic compute resource named **udf-std** that uses standard access mode and Databricks Runtime 16.4 LTS. A JAR file has already been uploaded to `/Volumes/litware_prod/libs/jars/geo-udf-1.0.jar`.

    You have MANAGE ALLOWLIST on the metastore, READ VOLUME on the volume and CAN MANAGE on udf-std. A notebook that is already attached to udf-std must use the classes of the JAR.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'une ressource de calcul classique nommée **udf-std** qui utilise le mode d'accès standard et Databricks Runtime 16.4 LTS. Un fichier JAR a déjà été chargé dans `/Volumes/litware_prod/libs/jars/geo-udf-1.0.jar`.

    Vous disposez de MANAGE ALLOWLIST sur le metastore, de READ VOLUME sur le volume et de CAN MANAGE sur udf-std. Un notebook déjà attaché à udf-std doit utiliser les classes du JAR.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: allow, text: { en: "In Catalog Explorer, add the JAR path to the metastore's **Allowed JARs/Init Scripts** list.", fr: "Dans Catalog Explorer, ajouter le chemin du JAR à la liste **Allowed JARs/Init Scripts** du metastore." } }
    - { id: install, text: { en: "On the **Libraries** tab of udf-std, click **Install new**, select **Volumes** and select the JAR.", fr: "Dans l'onglet **Libraries** d'udf-std, cliquer sur **Install new**, sélectionner **Volumes** et sélectionner le JAR." } }
    - { id: reattach, text: { en: "Detach and reattach the notebook.", fr: "Détacher puis rattacher le notebook." } }
    - { id: wsfile, text: { en: "Copy the JAR to a workspace folder.", fr: "Copier le JAR dans un dossier de l'espace de travail." } }
    - { id: sparkjars, text: { en: "Add the JAR path to the `spark.jars` property in the Spark configuration of udf-std.", fr: "Ajouter le chemin du JAR à la propriété `spark.jars` dans la configuration Spark d'udf-std." } }
    - { id: grant, text: { en: "Grant CAN ATTACH TO on udf-std to the account users group.", fr: "Accorder CAN ATTACH TO sur udf-std au groupe account users." } }
answer:
  sequence: [ allow, install, reattach ]
explanation:
  correct:
    en: |
      In standard access mode, a JAR path must be on the Unity Catalog allowlist before it can be installed, and only a principal with MANAGE ALLOWLIST can add it. You then install the JAR from the volume as a compute-scoped library. A notebook already attached doesn't see a newly installed library until it starts a new session, for example after you detach and reattach it.
    fr: |
      En mode d'accès standard, le chemin d'un JAR doit figurer dans la liste d'autorisation Unity Catalog avant de pouvoir être installé, et seul un principal disposant de MANAGE ALLOWLIST peut l'y ajouter. Vous installez ensuite le JAR depuis le volume comme bibliothèque limitée au calcul. Un notebook déjà attaché ne voit pas une bibliothèque nouvellement installée tant qu'il ne démarre pas une nouvelle session, par exemple après l'avoir détaché puis rattaché.
  options:
    wsfile: { en: "JARs can't be installed from workspace files on standard access mode compute.", fr: "Les JAR ne peuvent pas être installés depuis des fichiers d'espace de travail sur un calcul en mode d'accès standard." }
    sparkjars: { en: "Spark properties that load JARs, such as spark.jars, aren't the supported way to add libraries on standard compute and are blocked from Databricks Runtime 19.", fr: "Les propriétés Spark qui chargent des JAR, comme spark.jars, ne sont pas la méthode prise en charge pour ajouter des bibliothèques sur un calcul standard et sont bloquées à partir de Databricks Runtime 19." }
    grant: { en: "Attach permissions don't control which libraries are allowed or installed.", fr: "Les autorisations d'attachement ne contrôlent pas les bibliothèques autorisées ou installées." }
references:
  - title: Allowlist libraries and init scripts on compute with standard access mode (formerly shared access mode)
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/allowlist
  - title: Compute-scoped libraries
    url: https://learn.microsoft.com/en-us/azure/databricks/libraries/cluster-libraries
