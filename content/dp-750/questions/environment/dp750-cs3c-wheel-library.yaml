id: dp750-cs3c-wheel-library
objective: "1.1.4"
type: single
caseStudy: dp750-cs3c-southridge-video
difficulty: 2
status: draft
stem:
  en: |
    You need to change how sv_common is installed for aggregate_views to meet royalties job requirement 4.

    What should you do?
  fr: |
    Vous devez modifier la façon dont sv_common est installé pour aggregate_views afin de satisfaire l'exigence 4 du job de redevances.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Copy the wheel to the sv_prod.tools.wheels volume and add its /Volumes path as a dependent library of aggregate_views.", fr: "Copier le wheel dans le volume sv_prod.tools.wheels et ajouter son chemin /Volumes comme bibliothèque dépendante d'aggregate_views." } }
    - { id: b, text: { en: "Copy the wheel to /Workspace/Shared/libs as a workspace file and add its path as a dependent library of aggregate_views.", fr: "Copier le wheel dans /Workspace/Shared/libs comme fichier d'espace de travail et ajouter son chemin comme bibliothèque dépendante d'aggregate_views." } }
    - { id: c, text: { en: "Copy the wheel to a dbfs:/libs folder and add its dbfs:/ path as a dependent library of aggregate_views.", fr: "Copier le wheel dans un dossier dbfs:/libs et ajouter son chemin dbfs:/ comme bibliothèque dépendante d'aggregate_views." } }
    - { id: d, text: { en: "Publish the wheel to a Maven repository and add its Maven coordinates as a library of the job cluster.", fr: "Publier le wheel dans un dépôt Maven et ajouter ses coordonnées Maven comme bibliothèque du cluster de jobs." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With Unity Catalog, Databricks recommends installing library files from Unity Catalog volumes, where access is controlled by volume privileges such as the READ VOLUME privilege that sp-sv-jobs already has. A wheel is added to a job task as a dependent library by its /Volumes path.
    fr: |
      Avec Unity Catalog, Databricks recommande d'installer les fichiers de bibliothèque depuis des volumes Unity Catalog, dont l'accès est contrôlé par des privilèges de volume comme le privilège READ VOLUME dont sp-sv-jobs dispose déjà. Un wheel est ajouté à une tâche de job comme bibliothèque dépendante par son chemin /Volumes.
  options:
    b: { en: "Workspace files are a supported library source, but access to them is governed by workspace permissions, not by Unity Catalog privileges.", fr: "Les fichiers d'espace de travail sont une source de bibliothèques prise en charge, mais leur accès est régi par les autorisations de l'espace de travail, pas par des privilèges Unity Catalog." }
    c: { en: "This is still the DBFS root: storing libraries there is deprecated and disabled by default in Databricks Runtime 15.1 and above, and any workspace user can modify the files.", fr: "Il s'agit toujours de la racine DBFS : y stocker des bibliothèques est déprécié et désactivé par défaut dans Databricks Runtime 15.1 et versions ultérieures, et tout utilisateur de l'espace de travail peut modifier les fichiers." }
    d: { en: "Maven coordinates install Java and Scala libraries; a Python wheel is not distributed through Maven.", fr: "Les coordonnées Maven installent des bibliothèques Java et Scala ; un wheel Python ne se distribue pas par Maven." }
references:
  - title: Install libraries
    url: https://learn.microsoft.com/en-us/azure/databricks/libraries/
