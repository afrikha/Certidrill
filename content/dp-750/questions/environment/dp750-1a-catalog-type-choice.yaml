id: dp750-1a-catalog-type-choice
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso needs three new catalogs in its Unity Catalog metastore. Each catalog must meet a different requirement.

    Which type of catalog should you create for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso a besoin de trois nouveaux catalogues dans son metastore Unity Catalog. Chaque catalogue doit répondre à une exigence différente.

    Quel type de catalogue devez-vous créer pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - Read the tables that Fabrikam shares with Contoso through OpenSharing: [[c1]]
      - Query the tables of an Azure SQL database in place through Lakehouse Federation: [[c2]]
      - Store new managed tables in a dedicated storage container for compliance: [[c3]]
    fr: |
      - Lire les tables que Fabrikam partage avec Contoso via OpenSharing : [[c1]]
      - Interroger sur place les tables d'une base de données Azure SQL via Lakehouse Federation : [[c2]]
      - Stocker de nouvelles tables managées dans un conteneur de stockage dédié, pour des raisons de conformité : [[c3]]
  slots:
    - id: c1
      options:
        - { id: std, text: { en: "A standard catalog with a managed location", fr: "Un catalogue standard avec un emplacement managé" } }
        - { id: fgn, text: { en: "A foreign catalog", fr: "Un catalogue étranger" } }
        - { id: shr, text: { en: "A shared catalog", fr: "Un catalogue partagé" } }
    - id: c2
      options:
        - { id: std, text: { en: "A standard catalog with a managed location", fr: "Un catalogue standard avec un emplacement managé" } }
        - { id: fgn, text: { en: "A foreign catalog", fr: "Un catalogue étranger" } }
        - { id: shr, text: { en: "A shared catalog", fr: "Un catalogue partagé" } }
    - id: c3
      options:
        - { id: std, text: { en: "A standard catalog with a managed location", fr: "Un catalogue standard avec un emplacement managé" } }
        - { id: fgn, text: { en: "A foreign catalog", fr: "Un catalogue étranger" } }
        - { id: shr, text: { en: "A shared catalog", fr: "Un catalogue partagé" } }
answer:
  values: { c1: shr, c2: fgn, c3: std }
explanation:
  correct:
    en: |
      A shared catalog organizes the assets of a share and makes them readable in your workspace. A foreign catalog mirrors a database in an external system through Lakehouse Federation and a connection. A standard catalog holds the data and AI assets that Unity Catalog manages; its `MANAGED LOCATION` sets where its managed tables are stored instead of the metastore's storage.
    fr: |
      Un catalogue partagé organise les ressources d'un partage et les rend lisibles dans votre espace de travail. Un catalogue étranger reflète une base de données d'un système externe via Lakehouse Federation et une connexion. Un catalogue standard contient les données et ressources d'IA gérées par Unity Catalog ; son `MANAGED LOCATION` définit où ses tables managées sont stockées, au lieu du stockage du metastore.
references:
  - title: Create catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/create-catalog
