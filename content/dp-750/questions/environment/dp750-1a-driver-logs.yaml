id: dp750-1a-driver-logs
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer named **Ben** has CAN ATTACH TO on a classic compute resource named **etl-shared**. Ben must be able to view the Spark driver logs of etl-shared to troubleshoot his notebooks.

    Ben must not be able to edit or resize etl-shared, install libraries on it or change its permissions. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Un ingénieur données nommé **Ben** dispose de CAN ATTACH TO sur une ressource de calcul classique nommée **etl-shared**. Ben doit pouvoir consulter les journaux du pilote Spark d'etl-shared pour dépanner ses notebooks.

    Ben ne doit pas pouvoir modifier ni redimensionner etl-shared, y installer des bibliothèques ni changer ses autorisations. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant CAN RESTART on etl-shared to Ben.", fr: "Accorder CAN RESTART sur etl-shared à Ben." } }
    - { id: b, text: { en: "Add spark.databricks.acl.needAdminPermissionToViewLogs false to the Spark configuration of etl-shared.", fr: "Ajouter spark.databricks.acl.needAdminPermissionToViewLogs false à la configuration Spark d'etl-shared." } }
    - { id: c, text: { en: "Grant CAN MANAGE on etl-shared to Ben.", fr: "Accorder CAN MANAGE sur etl-shared à Ben." } }
    - { id: d, text: { en: "Grant CAN VIEW on etl-shared to Ben.", fr: "Accorder CAN VIEW sur etl-shared à Ben." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      By default, only principals with CAN MANAGE can view the Spark driver logs. Setting `spark.databricks.acl.needAdminPermissionToViewLogs false` in the compute's Spark configuration lets users with CAN ATTACH TO or CAN RESTART view them, without granting edit rights. Secrets aren't redacted from driver logs, so use this setting with care.
    fr: |
      Par défaut, seuls les principaux disposant de CAN MANAGE peuvent consulter les journaux du pilote Spark. Définir `spark.databricks.acl.needAdminPermissionToViewLogs false` dans la configuration Spark du calcul permet aux utilisateurs disposant de CAN ATTACH TO ou CAN RESTART de les consulter, sans accorder de droits de modification. Les secrets ne sont pas masqués dans les journaux du pilote : utilisez ce paramètre avec prudence.
  options:
    a: { en: "CAN RESTART adds start, restart and terminate rights, but not the right to view driver logs.", fr: "CAN RESTART ajoute les droits de démarrer, redémarrer et arrêter, mais pas celui de consulter les journaux du pilote." }
    c: { en: "CAN MANAGE would let Ben edit, resize and change the permissions of the compute.", fr: "CAN MANAGE permettrait à Ben de modifier et redimensionner le calcul et d'en changer les autorisations." }
    d: { en: "CAN VIEW (Beta) covers the Spark UI and compute metrics, not the driver logs, and it's lower than the CAN ATTACH TO that Ben already has.", fr: "CAN VIEW (bêta) couvre l'interface utilisateur Spark et les métriques du calcul, pas les journaux du pilote, et elle est inférieure à la CAN ATTACH TO dont Ben dispose déjà." }
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
