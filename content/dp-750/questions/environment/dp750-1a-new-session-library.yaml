id: dp750-1a-new-session-library
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several engineers at Fabrikam run notebooks on a classic compute resource named **etl-shared**. You install a Python wheel on etl-shared from the **Libraries** tab, and its status changes to **Installed**.

    A notebook that was already attached to etl-shared still fails with `ModuleNotFoundError` when it imports the package.

    You need to make the library available in that notebook. The solution must not interrupt the notebooks of the other engineers.

    What should you do?
  fr: |
    Plusieurs ingénieurs de Fabrikam exécutent des notebooks sur une ressource de calcul classique nommée **etl-shared**. Vous installez une roue (wheel) Python sur etl-shared depuis l'onglet **Libraries**, et son état passe à **Installed**.

    Un notebook qui était déjà attaché à etl-shared échoue toujours avec `ModuleNotFoundError` lorsqu'il importe le package.

    Vous devez rendre la bibliothèque disponible dans ce notebook. La solution ne doit pas interrompre les notebooks des autres ingénieurs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Restart etl-shared.", fr: "Redémarrer etl-shared." } }
    - { id: b, text: { en: "Uninstall and reinstall the library from the Libraries tab.", fr: "Désinstaller puis réinstaller la bibliothèque depuis l'onglet Libraries." } }
    - { id: c, text: { en: "Change the access mode of etl-shared to Dedicated.", fr: "Changer le mode d'accès d'etl-shared en Dedicated." } }
    - { id: d, text: { en: "Detach and reattach the notebook.", fr: "Détacher puis rattacher le notebook." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A compute-scoped library installed while a notebook is attached isn't visible in that notebook's current session; you must start a new session, for example by detaching and reattaching the notebook. The other notebooks keep running.
    fr: |
      Une bibliothèque limitée au calcul installée pendant qu'un notebook est attaché n'est pas visible dans la session en cours de ce notebook ; vous devez démarrer une nouvelle session, par exemple en détachant puis en rattachant le notebook. Les autres notebooks continuent de s'exécuter.
  options:
    a: { en: "A restart would load the library but interrupts every notebook attached to etl-shared.", fr: "Un redémarrage chargerait la bibliothèque mais interrompt tous les notebooks attachés à etl-shared." }
    b: { en: "Removing a library takes effect only after a restart, and the existing session still wouldn't see it.", fr: "La suppression d'une bibliothèque ne prend effet qu'après un redémarrage, et la session existante ne la verrait toujours pas." }
    c: { en: "Changing the access mode requires editing the compute, which restarts it and doesn't address the session issue.", fr: "Changer le mode d'accès exige de modifier le calcul, ce qui le redémarre, et ne règle pas le problème de session." }
references:
  - title: Compute-scoped libraries
    url: https://learn.microsoft.com/en-us/azure/databricks/libraries/cluster-libraries
