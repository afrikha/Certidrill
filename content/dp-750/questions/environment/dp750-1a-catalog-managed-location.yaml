id: dp750-1a-catalog-managed-location
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove's Unity Catalog metastore for the East US 2 region was created without a metastore-level managed storage location. An external location named **ext_finance** points to `abfss://finance@stwoodgrovefin.dfs.core.windows.net/`.

    You have CREATE CATALOG on the metastore and CREATE MANAGED STORAGE on ext_finance. When you run `CREATE CATALOG finance;`, the statement fails.

    You need to create the finance catalog.

    What should you do?
  fr: |
    Le metastore Unity Catalog de Woodgrove pour la région East US 2 a été créé sans emplacement de stockage managé au niveau du metastore. Un emplacement externe nommé **ext_finance** pointe vers `abfss://finance@stwoodgrovefin.dfs.core.windows.net/`.

    Vous disposez de CREATE CATALOG sur le metastore et de CREATE MANAGED STORAGE sur ext_finance. Lorsque vous exécutez `CREATE CATALOG finance;`, l'instruction échoue.

    Vous devez créer le catalogue finance.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run CREATE CATALOG IF NOT EXISTS finance; instead.", fr: "Exécuter plutôt CREATE CATALOG IF NOT EXISTS finance;." } }
    - { id: b, text: { en: "Ask an account admin to grant you CREATE EXTERNAL LOCATION on the metastore.", fr: "Demander à un administrateur de compte de vous accorder CREATE EXTERNAL LOCATION sur le metastore." } }
    - { id: c, text: { en: "Add a MANAGED LOCATION clause with a path inside ext_finance to the statement.", fr: "Ajouter à l'instruction une clause MANAGED LOCATION avec un chemin situé dans ext_finance." } }
    - { id: d, text: { en: "Create an external volume named finance on ext_finance first.", fr: "Créer d'abord un volume externe nommé finance sur ext_finance." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When no metastore-level managed storage exists, you must specify a managed storage location when you create a standard catalog. The `MANAGED LOCATION` path must be the path of an external location or a subpath of it, and you need CREATE MANAGED STORAGE on that external location.
    fr: |
      Lorsqu'il n'existe pas de stockage managé au niveau du metastore, vous devez spécifier un emplacement de stockage managé lorsque vous créez un catalogue standard. Le chemin `MANAGED LOCATION` doit être celui d'un emplacement externe ou un sous-chemin de celui-ci, et vous devez disposer de CREATE MANAGED STORAGE sur cet emplacement externe.
  options:
    a: { en: "IF NOT EXISTS only avoids an error when the catalog already exists; the storage location is still missing.", fr: "IF NOT EXISTS évite seulement une erreur lorsque le catalogue existe déjà ; l'emplacement de stockage manque toujours." }
    b: { en: "ext_finance already exists; the missing element is the managed location in the CREATE CATALOG statement.", fr: "ext_finance existe déjà ; l'élément manquant est l'emplacement managé dans l'instruction CREATE CATALOG." }
    d: { en: "A volume is created inside a schema, which requires the catalog to exist first.", fr: "Un volume est créé dans un schéma, ce qui exige que le catalogue existe déjà." }
references:
  - title: Create catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/create-catalog
  - title: Specify a managed storage location in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/managed-storage
