id: dp750-1a-shared-job-cluster
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Lakeflow job named **ingest-orders** contains four notebook tasks that run one after the other. Each task is configured with its own classic jobs compute resource, and all four resources have the same configuration.

    Monitoring shows that each job run spends a large part of its duration starting compute.

    You need to reduce the time spent starting compute during each run. The solution must keep classic jobs compute and must not change the notebooks.

    What should you do?
  fr: |
    Un job Lakeflow nommé **ingest-orders** contient quatre tâches de notebook qui s'exécutent l'une après l'autre. Chaque tâche est configurée avec sa propre ressource de calcul de jobs classique, et les quatre ressources ont la même configuration.

    La supervision montre que chaque exécution du job passe une grande partie de sa durée à démarrer du calcul.

    Vous devez réduire le temps passé à démarrer du calcul pendant chaque exécution. La solution doit conserver le calcul de jobs classique et ne doit pas modifier les notebooks.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable autoscaling on the compute resource of each task.", fr: "Activer la mise à l'échelle automatique sur la ressource de calcul de chaque tâche." } }
    - { id: b, text: { en: "Select a larger driver type for the compute resource of each task.", fr: "Sélectionner un type de pilote (driver) plus grand pour la ressource de calcul de chaque tâche." } }
    - { id: c, text: { en: "Configure the four tasks to use one shared jobs compute resource.", fr: "Configurer les quatre tâches pour qu'elles utilisent une seule ressource de calcul de jobs partagée." } }
    - { id: d, text: { en: "Set the maximum concurrent runs of the job to 4.", fr: "Définir le nombre maximal d'exécutions simultanées du job sur 4." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When tasks share a jobs compute resource, the compute starts with the first task that uses it and terminates after the last one finishes, so the run pays the start-up cost once instead of four times. A shared jobs compute resource is scoped to one job run and can't be used by other jobs or runs.
    fr: |
      Lorsque des tâches partagent une ressource de calcul de jobs, le calcul démarre avec la première tâche qui l'utilise et s'arrête après la fin de la dernière : l'exécution paie le temps de démarrage une fois au lieu de quatre. Une ressource de calcul de jobs partagée est limitée à une exécution de job et ne peut pas être utilisée par d'autres jobs ou exécutions.
  options:
    a: { en: "Autoscaling adjusts the number of workers while the compute runs; each task still waits for its own compute to start.", fr: "La mise à l'échelle automatique ajuste le nombre de workers pendant que le calcul tourne ; chaque tâche attend toujours le démarrage de son propre calcul." }
    b: { en: "A larger driver helps with driver memory, for example when collecting large results, not with start-up time.", fr: "Un pilote plus grand aide pour la mémoire du pilote, par exemple pour collecter de gros résultats, pas pour le temps de démarrage." }
    d: { en: "Concurrent runs let several runs of the job overlap; the tasks of each run still start their own compute.", fr: "Les exécutions simultanées permettent à plusieurs exécutions du job de se chevaucher ; les tâches de chaque exécution démarrent toujours leur propre calcul." }
references:
  - title: Configure compute for jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/compute
