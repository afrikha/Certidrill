id: dp750-1a-shared-catalog-sql
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam shares retail data with Contoso by using Databricks-to-Databricks OpenSharing. In Contoso's metastore, the provider object is named **fabrikam** and the share is named **retail_share**. You have USE PROVIDER and CREATE CATALOG on the metastore.

    You need to make the shared data available in a catalog named **fabrikam_retail**. Members of the **retail-analysts** group must be able to query every table in the catalog. The solution must follow the principle of least privilege.

    How should you complete the statements? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam partage des données de vente au détail avec Contoso à l'aide d'OpenSharing Databricks-à-Databricks. Dans le metastore de Contoso, l'objet fournisseur est nommé **fabrikam** et le partage **retail_share**. Vous disposez de USE PROVIDER et de CREATE CATALOG sur le metastore.

    Vous devez rendre les données partagées disponibles dans un catalogue nommé **fabrikam_retail**. Les membres du groupe **retail-analysts** doivent pouvoir interroger toutes les tables du catalogue. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter les instructions ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE CATALOG IF NOT EXISTS fabrikam_retail
      [[src]] fabrikam.retail_share;

    GRANT [[priv]] ON CATALOG fabrikam_retail TO `retail-analysts`;
  slots:
    - id: src
      options:
        - { id: conn, text: USING CONNECTION }
        - { id: share, text: USING SHARE }
        - { id: loc, text: MANAGED LOCATION }
    - id: priv
      options:
        - { id: all, text: ALL PRIVILEGES }
        - { id: browse, text: BROWSE }
        - { id: usecat, text: USE CATALOG }
        - { id: read, text: "USE CATALOG, USE SCHEMA, SELECT" }
answer:
  values: { src: share, priv: read }
explanation:
  correct:
    en: |
      `CREATE CATALOG ... USING SHARE <provider-name>.<share-name>` creates a shared catalog from a share; it requires USE PROVIDER on the metastore or ownership of the provider object. To query tables, users need USE CATALOG, USE SCHEMA and SELECT; granted on the catalog, these privileges apply to all its schemas and tables.
    fr: |
      `CREATE CATALOG ... USING SHARE <nom-fournisseur>.<nom-partage>` crée un catalogue partagé à partir d'un partage ; il exige USE PROVIDER sur le metastore ou la propriété de l'objet fournisseur. Pour interroger des tables, les utilisateurs ont besoin de USE CATALOG, USE SCHEMA et SELECT ; accordés sur le catalogue, ces privilèges s'appliquent à tous ses schémas et à toutes ses tables.
  options:
    conn: { en: "USING CONNECTION creates a foreign catalog through Lakehouse Federation, with CREATE FOREIGN CATALOG.", fr: "USING CONNECTION crée un catalogue étranger via Lakehouse Federation, avec CREATE FOREIGN CATALOG." }
    loc: { en: "MANAGED LOCATION sets the storage of a standard catalog; it doesn't reference a share.", fr: "MANAGED LOCATION définit le stockage d'un catalogue standard ; il ne référence pas un partage." }
    all: { en: "ALL PRIVILEGES grants more than reading the tables.", fr: "ALL PRIVILEGES accorde plus que la lecture des tables." }
    browse: { en: "BROWSE lets users discover metadata without reading data.", fr: "BROWSE permet de découvrir les métadonnées sans lire les données." }
    usecat: { en: "USE CATALOG alone doesn't allow access to schemas or reading tables.", fr: "USE CATALOG seul ne permet ni d'accéder aux schémas ni de lire les tables." }
references:
  - title: Create catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/create-catalog
  - title: CREATE CATALOG
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-catalog
