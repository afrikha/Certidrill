id: dp750-cs1c-loyalty-federation
objective: "1.2.6"
type: single
caseStudy: dp750-cs1c-best-for-you-organics
difficulty: 1
status: draft
stem:
  en: |
    You need to make the loyalty tables available in Unity Catalog. The solution must meet the loyalty data requirements.

    What should you do?
  fr: |
    Vous devez rendre les tables de fidélité disponibles dans Unity Catalog. La solution doit respecter les exigences relatives aux données de fidélité.

    Que devez-vous faire ?
body:
  options:
    - { id: foreign, text: { en: "Create a PostgreSQL connection, and then create a foreign catalog that uses the connection and the loyalty database.", fr: "Créer une connexion PostgreSQL, puis créer un catalogue étranger qui utilise la connexion et la base de données loyalty." } }
    - { id: ingest, text: { en: "Create a Lakeflow Connect ingestion pipeline that loads the loyalty tables into bfyo_prod.bronze.", fr: "Créer un pipeline d'ingestion Lakeflow Connect qui charge les tables de fidélité dans bfyo_prod.bronze." } }
    - { id: external, text: { en: "Create an external location for psql-bfyo-loyalty, and then create external tables on the loyalty tables.", fr: "Créer un emplacement externe pour psql-bfyo-loyalty, puis créer des tables externes sur les tables de fidélité." } }
    - { id: share, text: { en: "Create a share that contains the loyalty database, and then create a catalog by using USING SHARE.", fr: "Créer un partage qui contient la base de données loyalty, puis créer un catalogue avec USING SHARE." } }
answer: { optionId: foreign }
explanation:
  correct:
    en: |
      Lakehouse Federation queries PostgreSQL in place. A connection stores the host and the credentials, and CREATE FOREIGN CATALOG ... USING CONNECTION ... OPTIONS (database 'loyalty') mirrors the database in Unity Catalog, so every query returns the current data without copying it.
    fr: |
      La fédération Lakehouse (Lakehouse Federation) interroge PostgreSQL sur place. Une connexion stocke l'hôte et les informations d'identification, et CREATE FOREIGN CATALOG ... USING CONNECTION ... OPTIONS (database 'loyalty') reflète la base de données dans Unity Catalog ; chaque requête renvoie donc les données actuelles sans les copier.
  options:
    ingest: { en: "An ingestion pipeline copies the data into the lakehouse, which the requirements forbid.", fr: "Un pipeline d'ingestion copie les données dans le lakehouse, ce que les exigences interdisent." }
    external: { en: "External locations and external tables point to cloud storage paths, not to a database server.", fr: "Les emplacements externes et les tables externes pointent vers des chemins de stockage cloud, pas vers un serveur de base de données." }
    share: { en: "A share is created from Unity Catalog objects to give them to other organizations; it can't expose a PostgreSQL database.", fr: "Un partage se crée à partir d'objets Unity Catalog pour les fournir à d'autres organisations ; il ne peut pas exposer une base de données PostgreSQL." }
references:
  - title: Run federated queries on PostgreSQL
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/postgresql
