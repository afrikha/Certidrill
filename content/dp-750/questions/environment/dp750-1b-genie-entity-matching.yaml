id: dp750-1b-genie-entity-matching
objective: "1.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an AI/BI Genie space that uses the table **fabrikam_prod.gold.stores**. The table has no row filter or column mask. Its `state` column stores two-letter codes such as `FL` and `TX`.

    When users ask about "stores in Florida", Genie generates a filter such as `state ILIKE '%Florida%'` and returns no rows. You need Genie to map state names in questions to the codes stored in the column, including codes added to the table later, without maintaining a list of values by hand. Format assistance is enabled on the table.

    What should you do?
  fr: |
    Fabrikam dispose d'un espace AI/BI Genie qui utilise la table **fabrikam_prod.gold.stores**. La table n'a ni filtre de lignes ni masque de colonne. Sa colonne `state` stocke des codes à deux lettres, comme `FL` et `TX`.

    Lorsque les utilisateurs posent une question sur les « magasins de Floride », Genie génère un filtre tel que `state ILIKE '%Florida%'` et ne renvoie aucune ligne. Vous devez faire en sorte que Genie associe les noms d'États des questions aux codes stockés dans la colonne, y compris les codes ajoutés plus tard à la table, sans tenir de liste de valeurs à la main. L'assistance au format (Format assistance) est activée sur la table.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable entity matching on the state column.", fr: "Activer la mise en correspondance d'entités (Entity matching) sur la colonne state." } }
    - { id: b, text: { en: "Add the full state names as synonyms of the state column.", fr: "Ajouter les noms complets des États comme synonymes de la colonne state." } }
    - { id: c, text: { en: "Add a text instruction that lists every state name with its two-letter code.", fr: "Ajouter une instruction textuelle qui liste chaque nom d'État avec son code à deux lettres." } }
    - { id: d, text: { en: "Hide the state column and add a column that stores the full state names.", fr: "Masquer la colonne state et ajouter une colonne qui stocke les noms complets des États." } }
answer: { optionId: a }
explanation:
  correct:
    en: Entity matching stores the distinct values of categorical string columns, such as state codes, so that Genie maps "Florida" to `state = 'FL'`. It requires format assistance, which is already on, and you refresh the stored values from the table menu when the data changes.
    fr: La mise en correspondance d'entités stocke les valeurs distinctes de colonnes de chaînes catégorielles, comme des codes d'État, pour que Genie associe « Florida » à `state = 'FL'`. Elle exige l'assistance au format, déjà activée, et vous actualisez les valeurs stockées depuis le menu de la table lorsque les données changent.
  options:
    b:
      en: Synonyms map business terms to the column itself, not user words to the values stored in it.
      fr: Les synonymes associent des termes métier à la colonne elle-même, pas des mots des utilisateurs aux valeurs qu'elle contient.
    c:
      en: A hand-maintained list in text instructions is exactly what the requirement excludes, and text instructions are less reliable for this mapping.
      fr: Une liste tenue à la main dans les instructions textuelles est précisément ce que l'exigence exclut, et les instructions textuelles sont moins fiables pour cette correspondance.
    d:
      en: Changing the table structure adds data engineering work and does not use Genie's built-in value matching.
      fr: Modifier la structure de la table ajoute du travail d'ingénierie des données et n'utilise pas la correspondance de valeurs intégrée de Genie.
references:
  - title: Tune Genie Agent quality
    url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/tune-quality
