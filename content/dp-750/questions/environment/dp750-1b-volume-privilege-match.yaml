id: dp750-1b-volume-privilege-match
objective: "1.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a managed volume named **contoso_prod.raw.exports** in the schema contoso_prod.raw. All the groups below already have USE CATALOG on contoso_prod and USE SCHEMA on contoso_prod.raw. None of them owns the volume.

    You need to grant each group the privilege it needs. The solution must follow the principle of least privilege.

    Which privilege should you grant for each requirement? To answer, drag the appropriate privileges to the correct requirements. Each privilege may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un volume managé nommé **contoso_prod.raw.exports** dans le schéma contoso_prod.raw. Tous les groupes ci-dessous disposent déjà de USE CATALOG sur contoso_prod et de USE SCHEMA sur contoso_prod.raw. Aucun d'entre eux n'est propriétaire du volume.

    Vous devez accorder à chaque groupe le privilège dont il a besoin. La solution doit respecter le principe du moindre privilège.

    Quel privilège devez-vous accorder pour chaque exigence ? Pour répondre, faites glisser les privilèges appropriés vers les exigences correspondantes. Chaque privilège peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: read, text: READ VOLUME }
    - { id: write, text: WRITE VOLUME }
    - { id: manage, text: MANAGE }
    - { id: createvol, text: CREATE VOLUME }
    - { id: select, text: SELECT }
    - { id: modify, text: MODIFY }
  targets:
    - id: t1
      text: { en: "grp-analysts, on the volume: list the files and read them in notebooks", fr: "grp-analysts, sur le volume : lister les fichiers et les lire dans des notebooks" }
    - id: t2
      text: { en: "grp-loaders, on the volume, in addition to the read privilege: upload and delete files", fr: "grp-loaders, sur le volume, en plus du privilège de lecture : charger et supprimer des fichiers" }
    - id: t3
      text: { en: "grp-stewards, on the volume: grant and revoke privileges on the volume", fr: "grp-stewards, sur le volume : accorder et révoquer des privilèges sur le volume" }
    - id: t4
      text: { en: "grp-engineers, on the schema: create new managed volumes in contoso_prod.raw", fr: "grp-engineers, sur le schéma : créer de nouveaux volumes managés dans contoso_prod.raw" }
answer:
  mapping: { t1: read, t2: write, t3: manage, t4: createvol }
explanation:
  correct:
    en: READ VOLUME lets a principal read and list files. WRITE VOLUME, together with READ VOLUME, lets it create, update and delete files. MANAGE lets a non-owner manage the privileges of the volume, rename it, drop it and transfer its ownership. CREATE VOLUME on the schema lets a principal create volumes in it.
    fr: READ VOLUME permet de lire et de lister des fichiers. WRITE VOLUME, avec READ VOLUME, permet de créer, modifier et supprimer des fichiers. MANAGE permet à un non-propriétaire de gérer les privilèges du volume, de le renommer, de le supprimer et d'en transférer la propriété. CREATE VOLUME sur le schéma permet d'y créer des volumes.
  options:
    select: { en: "SELECT applies to tables, views and materialized views, not to volumes.", fr: "SELECT s'applique aux tables, vues et vues matérialisées, pas aux volumes." }
    modify: { en: "MODIFY changes table data; file writes in a volume require WRITE VOLUME.", fr: "MODIFY modifie les données d'une table ; l'écriture de fichiers dans un volume exige WRITE VOLUME." }
references:
  - title: Privileges for Unity Catalog volumes
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/privileges
