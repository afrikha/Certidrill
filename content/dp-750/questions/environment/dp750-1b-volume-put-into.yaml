id: dp750-1b-volume-put-into
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a managed volume named **litware_prod.ops.config_files**. An on-premises Python application must upload a local file named `rules.json` to the volume every night. The application already connects to a Databricks SQL warehouse by using the Databricks SQL Connector for Python, and the service principal it uses has READ VOLUME and WRITE VOLUME on the volume.

    You need to upload the file by running a SQL statement through the existing connection.

    Which statement should you use?
  fr: |
    Litware dispose d'un volume managé nommé **litware_prod.ops.config_files**. Une application Python locale doit charger chaque nuit un fichier local nommé `rules.json` dans le volume. L'application se connecte déjà à un entrepôt SQL Databricks avec le connecteur Databricks SQL pour Python, et le principal de service qu'elle utilise dispose de READ VOLUME et WRITE VOLUME sur le volume.

    Vous devez charger le fichier en exécutant une instruction SQL au moyen de la connexion existante.

    Quelle instruction devez-vous utiliser ?
body:
  options:
    - { id: a, text: "COPY INTO" }
    - { id: b, text: "LIST" }
    - { id: c, text: "PUT INTO" }
    - { id: d, text: "GET" }
answer: { optionId: c }
explanation:
  correct:
    en: PUT INTO uploads a local file to a volume path. It runs only through the Databricks SQL connectors (Python, Go, Node.js) and the JDBC and ODBC drivers, which matches an application that uses the SQL Connector for Python.
    fr: PUT INTO charge un fichier local vers un chemin de volume. Elle ne s'exécute que par les connecteurs Databricks SQL (Python, Go, Node.js) et les pilotes JDBC et ODBC, ce qui correspond à une application qui utilise le connecteur SQL pour Python.
  options:
    a:
      en: COPY INTO loads data from files that are already in cloud storage or a volume into a Delta table; it does not upload local files.
      fr: COPY INTO charge dans une table Delta les données de fichiers déjà présents dans un stockage cloud ou un volume ; elle ne charge pas de fichiers locaux.
    b:
      en: LIST lists the files of a volume path; it does not upload anything.
      fr: LIST liste les fichiers d'un chemin de volume ; elle ne charge rien.
    d:
      en: GET downloads a file from a volume to the local machine, the opposite direction.
      fr: GET télécharge un fichier d'un volume vers la machine locale, soit le sens inverse.
references:
  - title: Work with files in Unity Catalog volumes
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/volume-files
