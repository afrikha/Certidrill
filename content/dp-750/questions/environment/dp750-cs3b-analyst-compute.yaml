id: dp750-cs3b-analyst-compute
objective: "1.1.2"
type: yesno_statements
caseStudy: dp750-cs3b-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the configuration of cl-analysts.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la configuration de cl-analysts.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "If cl-analysts uses an instance pool that keeps idle instances, its start time is reduced, and the idle instances in the pool are not charged DBUs.", fr: "Si cl-analysts utilise un pool d'instances qui conserve des instances inactives, son temps de démarrage est réduit, et les instances inactives du pool ne sont pas facturées en DBU." } }
    - { id: s2, text: { en: "Because adb-mt-prod uses the Premium plan, cl-analysts can scale up from 2 to 8 workers in at most two scaling events.", fr: "Comme adb-mt-prod utilise le plan Premium, cl-analysts peut passer de 2 à 8 workers en au plus deux événements de mise à l'échelle." } }
    - { id: s3, text: { en: "Setting spark.dynamicAllocation.enabled to true on cl-analysts makes Databricks autoscaling release idle workers faster.", fr: "Définir spark.dynamicAllocation.enabled sur true sur cl-analysts permet à la mise à l'échelle automatique de Databricks de libérer plus vite les workers inactifs." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Compute that takes nodes from the idle instances of a pool starts and autoscales faster; idle pool instances incur Azure VM charges but no DBUs. Premium workspaces use optimized autoscaling, which scales up from the minimum to the maximum in at most two scaling events. Databricks warns against enabling Spark dynamic allocation on compute that uses Databricks autoscaling.
    fr: |
      Un calcul qui prend ses nœuds parmi les instances inactives d'un pool démarre et se met à l'échelle plus vite ; les instances inactives du pool entraînent des frais de machines virtuelles Azure, mais aucun DBU. Les espaces de travail Premium utilisent la mise à l'échelle automatique optimisée, qui passe du minimum au maximum en au plus deux événements de mise à l'échelle. Databricks déconseille d'activer l'allocation dynamique de Spark sur un calcul qui utilise la mise à l'échelle automatique de Databricks.
references:
  - title: Connect to pools
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/pool-index
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
