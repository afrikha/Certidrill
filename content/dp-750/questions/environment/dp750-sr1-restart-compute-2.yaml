id: dp750-sr1-restart-compute-2
objective: "1.1.5"
type: series_yesno
series: dp750-sr1-restart-compute
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You grant the CAN MANAGE permission on etl-shared to data-engineers.
  fr: Vous accordez l'autorisation CAN MANAGE sur etl-shared à data-engineers.
body:
  solution:
    en: In the permissions of etl-shared, you grant the **CAN MANAGE** permission to the data-engineers group.
    fr: Dans les autorisations d'etl-shared, vous accordez l'autorisation **CAN MANAGE** au groupe data-engineers.
answer: { value: false }
explanation:
  correct:
    en: CAN MANAGE includes attaching notebooks and starting or restarting the compute, but it also allows editing and resizing the compute, attaching libraries and modifying its permissions. Members could change the node type, autoscaling and libraries, which the requirements prohibit and which breaks least privilege.
    fr: "CAN MANAGE inclut l'attachement de notebooks et le démarrage ou le redémarrage du calcul, mais il permet aussi de modifier et de redimensionner le calcul, d'attacher des bibliothèques et de modifier ses autorisations. Les membres pourraient changer le type de nœud, la mise à l'échelle automatique et les bibliothèques, ce que les exigences interdisent et ce qui enfreint le moindre privilège."
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
