id: dp750-1b-federation-access-rules
objective: "1.2.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Northwind created a foreign catalog named **hr_ext** that mirrors an Azure SQL Database named hr through a connection named **conn_hr**. The connection is owned by a metastore admin. The database contains the table dbo.employees.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind a créé un catalogue étranger nommé **hr_ext** qui reflète une base Azure SQL Database nommée hr au moyen d'une connexion nommée **conn_hr**. Le propriétaire de la connexion est un administrateur du metastore. La base contient la table dbo.employees.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user who has the required privileges can run UPDATE statements on hr_ext.dbo.employees to correct data in the hr database.
        fr: Un utilisateur disposant des privilèges nécessaires peut exécuter des instructions UPDATE sur hr_ext.dbo.employees pour corriger des données de la base hr.
    - id: s2
      text:
        en: You can give the group grp-hr-readers read access to hr_ext.dbo.employees by using standard Unity Catalog GRANT statements.
        fr: Vous pouvez donner au groupe grp-hr-readers un accès en lecture à hr_ext.dbo.employees au moyen d'instructions GRANT Unity Catalog standard.
    - id: s3
      text:
        en: A user who has USE CATALOG, USE SCHEMA and SELECT on hr_ext, but does not own conn_hr, can query hr_ext.dbo.employees from a cluster in Dedicated access mode.
        fr: Un utilisateur qui dispose de USE CATALOG, USE SCHEMA et SELECT sur hr_ext, mais qui n'est pas propriétaire de conn_hr, peut interroger hr_ext.dbo.employees depuis un cluster en mode d'accès Dedicated.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Query federation to an external database is read-only, so foreign tables cannot be updated and MODIFY cannot be granted on them. Read access is granted with standard Unity Catalog privileges. On Dedicated access mode compute, however, the user must own the underlying connection to query the foreign catalog; standard catalog privileges are enough only on Standard access mode and serverless compute.
    fr: La fédération de requêtes vers une base de données externe fonctionne en lecture seule ; les tables étrangères ne peuvent donc pas être mises à jour et MODIFY ne peut pas leur être accordé. L'accès en lecture s'accorde avec les privilèges Unity Catalog standard. Sur un calcul en mode d'accès Dedicated, en revanche, l'utilisateur doit être propriétaire de la connexion sous-jacente pour interroger le catalogue étranger ; les privilèges de catalogue standard suffisent uniquement sur le mode d'accès Standard et le calcul serverless.
references:
  - title: Manage and work with foreign catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/foreign-catalogs
  - title: Connect to external databases and catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/
