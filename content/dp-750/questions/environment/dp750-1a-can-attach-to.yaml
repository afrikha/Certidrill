id: dp750-1a-can-attach-to
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has a classic all-purpose compute resource named **bi-explore**. An automation starts bi-explore every morning, and the workspace admins terminate it every evening.

    Members of a group named **analysts** must attach notebooks to bi-explore and run them. They must not be able to start, restart or terminate bi-explore. The solution must follow the principle of least privilege.

    Which permission should you grant to analysts on bi-explore?
  fr: |
    Wingtip dispose d'une ressource de calcul polyvalent classique nommée **bi-explore**. Une automatisation démarre bi-explore chaque matin, et les administrateurs de l'espace de travail l'arrêtent chaque soir.

    Les membres d'un groupe nommé **analysts** doivent attacher des notebooks à bi-explore et les exécuter. Ils ne doivent pas pouvoir démarrer, redémarrer ni arrêter bi-explore. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous accorder à analysts sur bi-explore ?
body:
  options:
    - { id: a, text: CAN VIEW }
    - { id: b, text: CAN RESTART }
    - { id: c, text: CAN ATTACH TO }
    - { id: d, text: CAN MANAGE }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CAN ATTACH TO lets a principal attach notebooks to the compute and view the Spark UI and compute metrics. It doesn't allow starting, restarting, terminating or editing the compute.
    fr: |
      CAN ATTACH TO permet à un principal d'attacher des notebooks au calcul et de consulter l'interface utilisateur Spark et les métriques du calcul. Elle ne permet pas de démarrer, redémarrer, arrêter ni modifier le calcul.
  options:
    a: { en: "CAN VIEW (Beta) shows the Spark UI and metrics but doesn't let users attach notebooks.", fr: "CAN VIEW (bêta) affiche l'interface utilisateur Spark et les métriques mais ne permet pas d'attacher des notebooks." }
    b: { en: "CAN RESTART also lets users start, restart and terminate the compute.", fr: "CAN RESTART permet aussi de démarrer, redémarrer et arrêter le calcul." }
    d: { en: "CAN MANAGE allows every action, including editing the compute and changing its permissions.", fr: "CAN MANAGE autorise toutes les actions, y compris la modification du calcul et de ses autorisations." }
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
