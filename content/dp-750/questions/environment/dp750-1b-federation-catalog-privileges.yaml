id: dp750-1b-federation-catalog-privileges
objective: "1.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a Unity Catalog connection named **conn_sqlmi_ops** that is owned by a metastore admin. A data engineer named User1 must create a foreign catalog named **ops_ext** by using conn_sqlmi_ops. User1 has no privileges on the metastore or on the connection.

    You need to grant User1 the required privileges. The solution must follow the principle of least privilege.

    Which two privileges should you grant? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une connexion Unity Catalog nommée **conn_sqlmi_ops** dont le propriétaire est un administrateur du metastore. Un ingénieur données nommé User1 doit créer un catalogue étranger nommé **ops_ext** à l'aide de conn_sqlmi_ops. User1 ne dispose d'aucun privilège sur le metastore ni sur la connexion.

    Vous devez accorder à User1 les privilèges nécessaires. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux privilèges à accorder ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "CREATE CONNECTION on the metastore", fr: "CREATE CONNECTION sur le metastore" } }
    - { id: b, text: { en: "CREATE FOREIGN CATALOG on conn_sqlmi_ops", fr: "CREATE FOREIGN CATALOG sur conn_sqlmi_ops" } }
    - { id: c, text: { en: "USE CONNECTION on conn_sqlmi_ops", fr: "USE CONNECTION sur conn_sqlmi_ops" } }
    - { id: d, text: { en: "CREATE CATALOG on the metastore", fr: "CREATE CATALOG sur le metastore" } }
    - { id: e, text: { en: "CREATE MANAGED STORAGE on an external location", fr: "CREATE MANAGED STORAGE sur un emplacement externe" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Creating a foreign catalog requires the CREATE CATALOG privilege on the metastore, plus either ownership of the connection or the CREATE FOREIGN CATALOG privilege on it. Granting CREATE FOREIGN CATALOG avoids transferring ownership of the connection.
    fr: La création d'un catalogue étranger exige le privilège CREATE CATALOG sur le metastore, ainsi que la propriété de la connexion ou le privilège CREATE FOREIGN CATALOG sur celle-ci. Accorder CREATE FOREIGN CATALOG évite de transférer la propriété de la connexion.
  options:
    a:
      en: CREATE CONNECTION is needed to create a new connection; the connection already exists.
      fr: CREATE CONNECTION sert à créer une nouvelle connexion ; la connexion existe déjà.
    c:
      en: USE CONNECTION lets a principal list and view the connection and use remote_query; it does not allow creating a foreign catalog.
      fr: USE CONNECTION permet de lister et de consulter la connexion et d'utiliser remote_query ; il ne permet pas de créer un catalogue étranger.
    e:
      en: A managed storage location is optional for a foreign catalog and is not needed to create one.
      fr: Un emplacement de stockage managé est facultatif pour un catalogue étranger et n'est pas nécessaire pour en créer un.
references:
  - title: Run federated queries on Microsoft SQL Server
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/sql-server
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
