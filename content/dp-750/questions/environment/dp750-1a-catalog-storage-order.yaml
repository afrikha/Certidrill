id: dp750-1a-catalog-storage-order
objective: "1.2.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Databricks access connector named **ac-contoso-uc**. Its managed identity has the Storage Blob Data Contributor role on a storage account named **stcontosoprod**. You are a metastore admin.

    A group named **platform-engineers**, which has CREATE CATALOG on the metastore, must create a catalog named **prod_ops** whose managed tables are stored in `abfss://ops@stcontosoprod.dfs.core.windows.net/`. No storage credential or external location exists for stcontosoprod yet.

    Which four actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un connecteur d'accès Azure Databricks nommé **ac-contoso-uc**. Son identité managée possède le rôle Storage Blob Data Contributor sur un compte de stockage nommé **stcontosoprod**. Vous êtes administrateur du metastore.

    Un groupe nommé **platform-engineers**, qui dispose de CREATE CATALOG sur le metastore, doit créer un catalogue nommé **prod_ops** dont les tables managées sont stockées dans `abfss://ops@stcontosoprod.dfs.core.windows.net/`. Aucune information d'identification de stockage ni aucun emplacement externe n'existe encore pour stcontosoprod.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: cred, text: { en: "Create a storage credential that uses the managed identity of ac-contoso-uc.", fr: "Créer des informations d'identification de stockage qui utilisent l'identité managée d'ac-contoso-uc." } }
    - { id: loc, text: { en: "Create an external location for abfss://ops@stcontosoprod.dfs.core.windows.net/ that uses the storage credential.", fr: "Créer un emplacement externe pour abfss://ops@stcontosoprod.dfs.core.windows.net/ qui utilise les informations d'identification de stockage." } }
    - { id: grant, text: { en: "Grant CREATE MANAGED STORAGE on the external location to platform-engineers.", fr: "Accorder CREATE MANAGED STORAGE sur l'emplacement externe à platform-engineers." } }
    - { id: cat, text: { en: "As a member of platform-engineers, run CREATE CATALOG prod_ops with a MANAGED LOCATION clause set to the container path.", fr: "En tant que membre de platform-engineers, exécuter CREATE CATALOG prod_ops avec une clause MANAGED LOCATION définie sur le chemin du conteneur." } }
    - { id: mount, text: { en: "Mount the ops container by running dbutils.fs.mount().", fr: "Monter le conteneur ops en exécutant dbutils.fs.mount()." } }
    - { id: volume, text: { en: "Create an external volume that points to the ops container.", fr: "Créer un volume externe qui pointe vers le conteneur ops." } }
    - { id: readfiles, text: { en: "Grant READ FILES on the external location to platform-engineers.", fr: "Accorder READ FILES sur l'emplacement externe à platform-engineers." } }
answer:
  sequence: [ cred, loc, grant, cat ]
explanation:
  correct:
    en: |
      An external location combines a cloud storage path with a storage credential, so the credential that wraps the access connector's managed identity comes first. A catalog's managed location must be the path of an external location or a subpath of it, and the user who creates the catalog needs CREATE MANAGED STORAGE on that external location. platform-engineers can then create the catalog with the `MANAGED LOCATION` clause.
    fr: |
      Un emplacement externe associe un chemin de stockage cloud à des informations d'identification de stockage : les informations d'identification qui encapsulent l'identité managée du connecteur d'accès viennent donc en premier. L'emplacement managé d'un catalogue doit être le chemin d'un emplacement externe ou un sous-chemin de celui-ci, et l'utilisateur qui crée le catalogue doit disposer de CREATE MANAGED STORAGE sur cet emplacement externe. platform-engineers peut alors créer le catalogue avec la clause `MANAGED LOCATION`.
  options:
    mount: { en: "Mounts are a legacy DBFS mechanism that Unity Catalog doesn't use for managed storage.", fr: "Les montages sont un mécanisme DBFS hérité qu'Unity Catalog n'utilise pas pour le stockage managé." }
    volume: { en: "An external volume governs files and lives inside a schema; managed storage can't overlap external volumes.", fr: "Un volume externe gouverne des fichiers et se trouve dans un schéma ; le stockage managé ne peut pas chevaucher des volumes externes." }
    readfiles: { en: "READ FILES allows reading files through the external location, not using it as managed storage.", fr: "READ FILES permet de lire des fichiers via l'emplacement externe, pas de l'utiliser comme stockage managé." }
references:
  - title: Specify a managed storage location in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/managed-storage
  - title: Connect to an Azure Data Lake Storage Gen2 (ADLS Gen2) external location
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/external-locations
