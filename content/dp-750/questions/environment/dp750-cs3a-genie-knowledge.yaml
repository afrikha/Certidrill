id: dp750-cs3a-genie-knowledge
objective: "1.2.8"
type: dragdrop
caseStudy: dp750-cs3a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to configure Shop Assistant to meet Shop Assistant requirements 1, 2 and 3. For each requirement, you must use the most specific element of the knowledge store and use text instructions only for context that does not fit another format.

    What should you configure for each requirement? To answer, drag the appropriate elements to the correct requirements. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer Shop Assistant pour satisfaire les exigences 1, 2 et 3 de Shop Assistant. Pour chaque exigence, vous devez utiliser l'élément le plus spécifique de la base de connaissances (knowledge store) et n'utiliser les instructions texte que pour le contexte qui ne correspond à aucun autre format.

    Que devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: measure, text: { en: "A SQL expression of type Measure", fr: "Une expression SQL de type Measure" } }
    - { id: filter, text: { en: "A SQL expression of type Filter", fr: "Une expression SQL de type Filter" } }
    - { id: synonym, text: { en: "A synonym on a column", fr: "Un synonyme sur une colonne" } }
    - { id: join, text: { en: "A join relationship", fr: "Une relation de jointure" } }
    - { id: text, text: { en: "A text instruction", fr: "Une instruction texte" } }
  targets:
    - { id: r1, text: { en: "Requirement 1: net sales", fr: "Exigence 1 : ventes nettes" } }
    - { id: r2, text: { en: "Requirement 2: active shops", fr: "Exigence 2 : cafés actifs" } }
    - { id: r3, text: { en: "Requirement 3: region", fr: "Exigence 3 : région" } }
answer:
  mapping: { r1: measure, r2: filter, r3: synonym }
explanation:
  correct:
    en: |
      A Measure defines a KPI as an aggregation over rows, here SUM(gross_amount - discount_amount), and Genie applies it exactly as written. A Filter is a boolean condition, here status = 'OPEN', that Genie uses when a question mentions active shops. A column synonym maps the business term "region" to area_name. Text instructions are meant only for global context that fits no other format, and a join relationship only tells Genie how to join tables.
    fr: |
      Une Measure définit un indicateur clé comme une agrégation sur des lignes, ici SUM(gross_amount - discount_amount), et Genie l'applique exactement telle qu'elle est écrite. Un Filter est une condition booléenne, ici status = 'OPEN', que Genie utilise quand une question parle de cafés actifs. Un synonyme de colonne associe le terme métier « région » à area_name. Les instructions texte sont réservées au contexte global qui ne correspond à aucun autre format, et une relation de jointure indique seulement à Genie comment joindre des tables.
  options:
    text:
      en: Business logic defined in SQL expressions gives more consistent results than text instructions, which Genie interprets from natural language.
      fr: La logique métier définie dans des expressions SQL donne des résultats plus cohérents que les instructions texte, que Genie interprète à partir du langage naturel.
    join:
      en: A join relationship defines how two tables are joined (for example many to one); it does not define a metric, a condition or a business term.
      fr: Une relation de jointure définit comment deux tables sont jointes (par exemple plusieurs-à-un) ; elle ne définit ni métrique, ni condition, ni terme métier.
references:
  - title: Tune Genie Agent quality
    url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/tune-quality
