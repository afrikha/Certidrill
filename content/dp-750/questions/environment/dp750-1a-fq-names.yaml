id: dp750-1a-fq-names
objective: "1.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind's naming convention is the following:

    - Catalog: `<environment>_<business_unit>`
    - Schema: the medallion layer (`bronze`, `silver` or `gold`)
    - Table: the business entity

    A recipient catalog created from a partner's share was named `fabrikam-ext`. You need to query the production silver orders table of the sales business unit and the `stores` table of the `retail` schema in the partner catalog.

    How should you complete the statements? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    La convention d'affectation de noms de Northwind est la suivante :

    - Catalogue : `<environment>_<business_unit>`
    - Schéma : la couche de l'architecture en médaillon (`bronze`, `silver` ou `gold`)
    - Table : l'entité métier

    Un catalogue destinataire créé à partir du partage d'un partenaire a été nommé `fabrikam-ext`. Vous devez interroger la table silver des commandes de production de l'unité commerciale sales et la table `stores` du schéma `retail` dans le catalogue du partenaire.

    Comment devez-vous compléter les instructions ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT order_id, amount
    FROM [[fq]];

    SELECT store_id, city
    FROM [[ext]].retail.stores;
  slots:
    - id: fq
      options:
        - { id: silverfirst, text: silver.prod_sales.orders }
        - { id: ok, text: prod_sales.silver.orders }
        - { id: envfirst, text: prod.sales_silver.orders }
        - { id: unitfirst, text: sales.prod_silver.orders }
    - id: ext
      options:
        - { id: dq, text: '"fabrikam-ext"' }
        - { id: sq, text: "'fabrikam-ext'" }
        - { id: bt, text: "`fabrikam-ext`" }
        - { id: br, text: "[fabrikam-ext]" }
answer:
  values: { fq: ok, ext: bt }
explanation:
  correct:
    en: |
      Unity Catalog objects are referenced as `catalog.schema.object`, so the convention gives `prod_sales.silver.orders`. A name that contains a special character such as a hyphen must be enclosed in backticks in SQL.
    fr: |
      Les objets Unity Catalog sont référencés sous la forme `catalogue.schéma.objet` : la convention donne `prod_sales.silver.orders`. Un nom qui contient un caractère spécial comme un trait d'union doit être placé entre accents graves en SQL.
  options:
    silverfirst: { en: "The first level of the namespace is the catalog, not the schema.", fr: "Le premier niveau de l'espace de noms est le catalogue, pas le schéma." }
    envfirst: { en: "The catalog is named <environment>_<business_unit>, so the catalog is prod_sales.", fr: "Le catalogue est nommé <environment>_<business_unit> : le catalogue est donc prod_sales." }
    dq: { en: "Double quotes delimit string literals in Databricks SQL, not identifiers.", fr: "Les guillemets doubles délimitent des littéraux de chaîne en Databricks SQL, pas des identificateurs." }
    sq: { en: "Single quotes delimit string literals.", fr: "Les guillemets simples délimitent des littéraux de chaîne." }
    br: { en: "Square brackets are Transact-SQL syntax, not Databricks SQL.", fr: "Les crochets relèvent de la syntaxe Transact-SQL, pas de Databricks SQL." }
references:
  - title: Names
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-names
