id: dp750-1b-view-query-privileges
objective: "1.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    The group **grp-data-eng** owns a view named **woodgrove_prod.gold.vw_sales** that is defined on the table woodgrove_prod.silver.orders. grp-data-eng has SELECT on the orders table.

    The group **grp-analysts** must query vw_sales from a serverless SQL warehouse. grp-analysts already has USE SCHEMA on woodgrove_prod.gold and woodgrove_prod.silver, and no other privilege. Analysts must not be able to query the orders table directly.

    You need to grant the required privileges to grp-analysts. The solution must follow the principle of least privilege.

    What should you grant? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le groupe **grp-data-eng** est propriétaire d'une vue nommée **woodgrove_prod.gold.vw_sales**, définie sur la table woodgrove_prod.silver.orders. grp-data-eng dispose de SELECT sur la table orders.

    Le groupe **grp-analysts** doit interroger vw_sales depuis un entrepôt SQL serverless. grp-analysts dispose déjà de USE SCHEMA sur woodgrove_prod.gold et woodgrove_prod.silver, et d'aucun autre privilège. Les analystes ne doivent pas pouvoir interroger directement la table orders.

    Vous devez accorder les privilèges nécessaires à grp-analysts. La solution doit respecter le principe du moindre privilège.

    Que devez-vous accorder ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      On the woodgrove_prod catalog: [[cat]]

      On the vw_sales view: [[view]]

      On the orders table: [[table]]
    fr: |
      Sur le catalogue woodgrove_prod : [[cat]]

      Sur la vue vw_sales : [[view]]

      Sur la table orders : [[table]]
  slots:
    - id: cat
      options:
        - { id: browse, text: BROWSE }
        - { id: usecat, text: USE CATALOG }
        - { id: none, text: { en: "No privilege", fr: "Aucun privilège" } }
    - id: view
      options:
        - { id: select, text: SELECT }
        - { id: refresh, text: REFRESH }
        - { id: manage, text: MANAGE }
    - id: table
      options:
        - { id: none, text: { en: "No privilege", fr: "Aucun privilège" } }
        - { id: select, text: SELECT }
        - { id: browse, text: BROWSE }
answer:
  values: { cat: usecat, view: select, table: none }
explanation:
  correct:
    en: To query a view, a user needs SELECT on the view, USE CATALOG on its catalog and USE SCHEMA on its schema. On SQL warehouses, Unity Catalog checks the privileges on the underlying table against the view owner only, so analysts need no privilege on orders, which also keeps them from querying it directly.
    fr: Pour interroger une vue, un utilisateur a besoin de SELECT sur la vue, de USE CATALOG sur son catalogue et de USE SCHEMA sur son schéma. Sur les entrepôts SQL, Unity Catalog vérifie les privilèges sur la table sous-jacente uniquement pour le propriétaire de la vue ; les analystes n'ont donc besoin d'aucun privilège sur orders, ce qui les empêche aussi de l'interroger directement.
  options:
    browse: { en: "BROWSE only exposes metadata; it does not let users access objects in the catalog.", fr: "BROWSE n'expose que les métadonnées ; il ne permet pas d'accéder aux objets du catalogue." }
    refresh: { en: "REFRESH applies to materialized views and does not allow querying.", fr: "REFRESH s'applique aux vues matérialisées et ne permet pas d'interroger." }
    manage: { en: "MANAGE lets users manage privileges and drop the view; it grants more than needed and does not include SELECT.", fr: "MANAGE permet de gérer les privilèges et de supprimer la vue ; il accorde plus que nécessaire et n'inclut pas SELECT." }
references:
  - title: What is a view?
    url: https://learn.microsoft.com/en-us/azure/databricks/views/
