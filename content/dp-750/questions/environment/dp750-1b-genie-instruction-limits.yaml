id: dp750-1b-genie-instruction-limits
objective: "1.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin's Genie Agent for flight operations is approaching the limit of 100 instructions. The agent contains general text instructions, 70 example SQL queries, 12 SQL functions, 15 join relationships, and synonyms on 40 columns. You plan how to reorganize the agent.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Le Genie Agent de Tailspin consacré aux opérations aériennes approche de la limite de 100 instructions. L'agent contient des instructions textuelles générales, 70 exemples de requêtes SQL, 12 fonctions SQL, 15 relations de jointure et des synonymes sur 40 colonnes. Vous planifiez la réorganisation de l'agent.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each example SQL query counts as one instruction.", fr: "Chaque exemple de requête SQL compte pour une instruction." } }
    - { id: b, text: { en: "Each column that has synonyms counts as one instruction.", fr: "Chaque colonne qui possède des synonymes compte pour une instruction." } }
    - { id: c, text: { en: "The general text instructions count as one instruction, whatever their length.", fr: "Les instructions textuelles générales comptent pour une instruction, quelle que soit leur longueur." } }
    - { id: d, text: { en: "Each join relationship counts as one instruction.", fr: "Chaque relation de jointure compte pour une instruction." } }
    - { id: e, text: { en: "SQL functions do not count toward the instruction limit.", fr: "Les fonctions SQL ne comptent pas dans la limite d'instructions." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: An agent allows up to 100 instructions. Each example SQL query and each SQL function counts as one, and the whole general instructions block counts as one. Here the agent uses 1 + 70 + 12 = 83 instructions.
    fr: Un agent autorise jusqu'à 100 instructions. Chaque exemple de requête SQL et chaque fonction SQL compte pour une, et l'ensemble du bloc d'instructions générales compte pour une. Ici, l'agent utilise 1 + 70 + 12 = 83 instructions.
  options:
    b:
      en: Only the general instructions block, example SQL queries and SQL functions count toward the 100-instruction limit; column metadata such as synonyms does not.
      fr: Seuls le bloc d'instructions générales, les exemples de requêtes SQL et les fonctions SQL comptent dans la limite de 100 instructions ; les métadonnées de colonnes comme les synonymes n'y comptent pas.
    d:
      en: Join relationships are knowledge store snippets, which have their own limit, separate from the 100 instructions.
      fr: Les relations de jointure sont des extraits de la base de connaissances, soumis à leur propre limite, distincte des 100 instructions.
    e:
      en: Each SQL function counts as one instruction.
      fr: Chaque fonction SQL compte pour une instruction.
references:
  - title: Create and manage a Genie Agent
    url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/set-up
  - title: Tune Genie Agent quality
    url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/tune-quality
