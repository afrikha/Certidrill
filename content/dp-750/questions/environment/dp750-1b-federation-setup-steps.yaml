id: dp750-1b-federation-setup-steps
objective: "1.2.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure SQL Managed Instance that hosts a database named **hr**. You are a metastore admin of Contoso's Unity Catalog metastore, and the compute can reach the instance over the network.

    You need to let the group **grp-hr-analysts** query the hr database from Azure Databricks through Lakehouse Federation. The SQL login and password must not appear in plain text in any object definition.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'une instance Azure SQL Managed Instance qui héberge une base de données nommée **hr**. Vous êtes administrateur du metastore Unity Catalog de Contoso, et le calcul peut joindre l'instance par le réseau.

    Vous devez permettre au groupe **grp-hr-analysts** d'interroger la base hr depuis Azure Databricks au moyen de Lakehouse Federation. Le nom de connexion SQL et le mot de passe ne doivent apparaître en clair dans aucune définition d'objet.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: secrets, text: { en: "Store the SQL login and password as secrets in a secret scope.", fr: "Stocker le nom de connexion SQL et le mot de passe comme secrets dans une étendue de secrets." } }
    - { id: conn, text: { en: "Run CREATE CONNECTION ... TYPE sqlserver and reference the credentials with the secret() function.", fr: "Exécuter CREATE CONNECTION ... TYPE sqlserver et référencer les informations d'identification avec la fonction secret()." } }
    - { id: catalog, text: { en: "Run CREATE FOREIGN CATALOG ... USING CONNECTION ... OPTIONS (database 'hr').", fr: "Exécuter CREATE FOREIGN CATALOG ... USING CONNECTION ... OPTIONS (database 'hr')." } }
    - { id: grant, text: { en: "Grant grp-hr-analysts USE CATALOG, USE SCHEMA and SELECT on the foreign catalog.", fr: "Accorder à grp-hr-analysts USE CATALOG, USE SCHEMA et SELECT sur le catalogue étranger." } }
    - { id: extloc, text: { en: "Create an external location for the SQL Managed Instance.", fr: "Créer un emplacement externe pour l'instance SQL Managed Instance." } }
    - { id: modify, text: { en: "Grant grp-hr-analysts MODIFY on the foreign catalog.", fr: "Accorder à grp-hr-analysts MODIFY sur le catalogue étranger." } }
    - { id: gateway, text: { en: "Create a Lakeflow Connect ingestion gateway for the hr database.", fr: "Créer une passerelle d'ingestion Lakeflow Connect pour la base hr." } }
answer:
  sequence: [ secrets, conn, catalog, grant ]
explanation:
  correct:
    en: Query federation needs a connection, which stores the host and credentials (Databricks recommends secrets referenced with secret() instead of plain text), then a foreign catalog created from the connection that mirrors one database. Privileges are then granted on the foreign catalog with standard Unity Catalog grants.
    fr: La fédération de requêtes exige une connexion, qui stocke l'hôte et les informations d'identification (Databricks recommande des secrets référencés avec secret() plutôt que du texte en clair), puis un catalogue étranger créé à partir de la connexion, qui reflète une base. Les privilèges sont ensuite accordés sur le catalogue étranger avec les autorisations Unity Catalog standard.
  options:
    extloc: { en: "External locations govern cloud storage paths; query federation to SQL Server needs no external location.", fr: "Les emplacements externes gouvernent des chemins de stockage cloud ; la fédération de requêtes vers SQL Server n'exige pas d'emplacement externe." }
    modify: { en: "Foreign tables are read-only, and MODIFY cannot be granted on them.", fr: "Les tables étrangères sont en lecture seule, et MODIFY ne peut pas leur être accordé." }
    gateway: { en: "An ingestion gateway belongs to Lakeflow Connect, which copies the data instead of federating queries.", fr: "Une passerelle d'ingestion relève de Lakeflow Connect, qui copie les données au lieu de fédérer les requêtes." }
references:
  - title: Run federated queries on Microsoft SQL Server
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/sql-server
