id: dp750-1b-genie-text-instructions
objective: "1.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an AI/BI Genie space that business users query about sales in the tables of **contoso_prod.gold**. Users report that answers about "this fiscal year" use the calendar year, and that amounts are returned with many decimals.

    You need to tell Genie that the fiscal year starts on February 1 and that all amounts must be rounded to two decimals. This guidance applies to every question asked in the space.

    What should you configure?
  fr: |
    Contoso dispose d'un espace AI/BI Genie que des utilisateurs métier interrogent sur les ventes contenues dans les tables de **contoso_prod.gold**. Les utilisateurs signalent que les réponses sur « cet exercice » utilisent l'année civile et que les montants sont renvoyés avec de nombreuses décimales.

    Vous devez indiquer à Genie que l'exercice commence le 1er février et que tous les montants doivent être arrondis à deux décimales. Ces indications s'appliquent à toutes les questions posées dans l'espace.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Text instructions", fr: "Des instructions textuelles" } }
    - { id: b, text: { en: "A join relationship", fr: "Une relation de jointure" } }
    - { id: c, text: { en: "Entity matching on the date columns", fr: "La mise en correspondance d'entités (Entity matching) sur les colonnes de date" } }
    - { id: d, text: { en: "Synonyms on the amount columns", fr: "Des synonymes sur les colonnes de montant" } }
answer: { optionId: a }
explanation:
  correct:
    en: Text (general) instructions hold global context that does not fit elsewhere, such as fiscal calendars, business jargon and formatting rules. They apply to every question in the space and count as a single instruction.
    fr: Les instructions textuelles (générales) contiennent le contexte global qui ne trouve pas sa place ailleurs, comme le calendrier fiscal, le jargon métier et les règles de mise en forme. Elles s'appliquent à toutes les questions de l'espace et comptent pour une seule instruction.
  options:
    b:
      en: A join relationship tells Genie how two tables join; it carries no calendar or formatting rule.
      fr: Une relation de jointure indique à Genie comment deux tables se joignent ; elle ne porte aucune règle de calendrier ou de mise en forme.
    c:
      en: Entity matching stores distinct values of categorical string columns so that Genie maps user terms to the stored values.
      fr: La mise en correspondance d'entités stocke les valeurs distinctes de colonnes de chaînes catégorielles pour que Genie associe les termes des utilisateurs aux valeurs stockées.
    d:
      en: Synonyms help Genie match business terms to a column; they do not define a fiscal year or a rounding rule.
      fr: Les synonymes aident Genie à associer des termes métier à une colonne ; ils ne définissent ni un exercice fiscal ni une règle d'arrondi.
references:
  - title: Tune Genie Agent quality
    url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/tune-quality
  - title: Set up and manage an AI/BI Genie space
    url: https://learn.microsoft.com/en-us/azure/databricks/genie/set-up
