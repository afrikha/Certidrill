seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You create an external location and a catalog with a managed location.
  fr: Vous créez un emplacement externe et un catalogue avec un emplacement managé.
body:
  solution:
    en: |
      You create a storage credential and an external location for a container of the Contoso storage account. You create a catalog named `sales_ext` whose `MANAGED LOCATION` is a path of that external location. Then you grant `sales-analysts` the `USE CATALOG`, `USE SCHEMA` and `SELECT` privileges on `sales_ext`.
    fr: |
      Vous créez des informations d'identification de stockage et un emplacement externe pour un conteneur du compte de stockage de Contoso. Vous créez un catalogue nommé `sales_ext` dont le `MANAGED LOCATION` est un chemin de cet emplacement externe. Vous accordez ensuite à `sales-analysts` les privilèges `USE CATALOG`, `USE SCHEMA` et `SELECT` sur `sales_ext`.
answer: { value: false }
explanation:
  correct:
    en: |
      A storage credential and an external location govern access to cloud object storage, not to a relational database. A standard catalog with a managed location only stores the Unity Catalog tables written to it, so it exposes none of the salesdb tables. Reading salesdb in place requires a connection of type `sqlserver` and a foreign catalog created with `USING CONNECTION`.
    fr: |
      Des informations d'identification de stockage et un emplacement externe régissent l'accès au stockage d'objets cloud, pas à une base de données relationnelle. Un catalogue standard avec un emplacement managé ne stocke que les tables Unity Catalog qui y sont écrites : il n'expose aucune table de salesdb. Pour lire salesdb sur place, il faut une connexion de type `sqlserver` et un catalogue étranger créé avec `USING CONNECTION`.
references:
  - title: Connect to external databases and catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/
  - title: Run federated queries on Microsoft SQL Server
