id: dp750-1a-maven-allowlist
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A classic compute resource named **geo-std** uses standard access mode and Databricks Runtime 16.4 LTS. Several analysts share geo-std, so it must stay in standard access mode.

    You have CAN MANAGE on geo-std. When you install the Maven library `com.fabrikam:geo-utils:1.4.2` on geo-std, the installation fails because the coordinate isn't allowed.

    You need to install the library. The solution must follow the principle of least privilege.

    What should you do first?
  fr: |
    Une ressource de calcul classique nommée **geo-std** utilise le mode d'accès standard et Databricks Runtime 16.4 LTS. Plusieurs analystes partagent geo-std, qui doit donc rester en mode d'accès standard.

    Vous disposez de CAN MANAGE sur geo-std. Lorsque vous installez la bibliothèque Maven `com.fabrikam:geo-utils:1.4.2` sur geo-std, l'installation échoue, car la coordonnée n'est pas autorisée.

    Vous devez installer la bibliothèque. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Ask a user who has MANAGE ALLOWLIST on the metastore to add com.fabrikam:geo-utils:1.4.2 to the allowlist.", fr: "Demander à un utilisateur qui dispose de MANAGE ALLOWLIST sur le metastore d'ajouter com.fabrikam:geo-utils:1.4.2 à la liste d'autorisation." } }
    - { id: b, text: { en: "Change the access mode of geo-std to Dedicated and assign it to the analysts' group.", fr: "Changer le mode d'accès de geo-std en Dedicated et l'attribuer au groupe des analystes." } }
    - { id: c, text: { en: "Download the JAR to a workspace folder and install it from the Workspace source.", fr: "Télécharger le JAR dans un dossier de l'espace de travail et l'installer depuis la source Workspace." } }
    - { id: d, text: { en: "Ask a metastore admin to grant you READ VOLUME on the volume that stores the team's libraries.", fr: "Demander à un administrateur du metastore de vous accorder READ VOLUME sur le volume qui stocke les bibliothèques de l'équipe." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      On standard access mode compute (Databricks Runtime 13.3 LTS and above), JARs, init scripts and Maven coordinates must be on the Unity Catalog allowlist, which is empty by default. Only a principal with MANAGE ALLOWLIST on the metastore can add the full coordinate (groupId:artifactId:version), which is narrower than allowing the whole group or artifact.
    fr: |
      Sur un calcul en mode d'accès standard (à partir de Databricks Runtime 13.3 LTS), les JAR, les scripts d'initialisation et les coordonnées Maven doivent figurer dans la liste d'autorisation Unity Catalog, vide par défaut. Seul un principal disposant de MANAGE ALLOWLIST sur le metastore peut ajouter la coordonnée complète (groupId:artifactId:version), plus restrictive qu'une autorisation de tout le groupe ou de tout l'artefact.
  options:
    b: { en: "Dedicated access mode would remove the allowlist check, but geo-std must stay in standard access mode.", fr: "Le mode d'accès dédié supprimerait la vérification de la liste d'autorisation, mais geo-std doit rester en mode d'accès standard." }
    c: { en: "JARs can't be installed from workspace files on standard or dedicated compute.", fr: "Les JAR ne peuvent pas être installés depuis des fichiers d'espace de travail sur un calcul standard ou dédié." }
    d: { en: "A Maven library is resolved from its coordinate, not read from a volume; volume access doesn't change the allowlist check.", fr: "Une bibliothèque Maven est résolue à partir de sa coordonnée, pas lue dans un volume ; l'accès à un volume ne change rien à la vérification de la liste d'autorisation." }
references:
  - title: Allowlist libraries and init scripts on compute with standard access mode (formerly shared access mode)
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/allowlist
