id: dp750-1a-single-node
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineer at Northwind develops a notebook that uses `spark.read` to load a 200 MB CSV file from `/Volumes/northwind_dev/raw/files/` and then explores the data with pandas. The workload doesn't need distributed processing.

    You need to create classic compute that can run the notebook, including its Spark commands. The solution must minimize cost.

    What should you create?
  fr: |
    Un ingénieur données de Northwind développe un notebook qui utilise `spark.read` pour charger un fichier CSV de 200 Mo depuis `/Volumes/northwind_dev/raw/files/`, puis explore les données avec pandas. La charge de travail n'a pas besoin de traitement distribué.

    Vous devez créer un calcul classique capable d'exécuter le notebook, y compris ses commandes Spark. La solution doit réduire les coûts au minimum.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "Multi-node compute with a fixed size of 0 workers", fr: "Un calcul multinœud d'une taille fixe de 0 worker" } }
    - { id: b, text: { en: "Multi-node compute with autoscaling between 1 and 2 workers", fr: "Un calcul multinœud avec une mise à l'échelle automatique entre 1 et 2 workers" } }
    - { id: c, text: { en: "Single node compute", fr: "Un calcul à nœud unique" } }
    - { id: d, text: { en: "A 2X-Small serverless SQL warehouse", fr: "Un entrepôt SQL serverless de taille 2X-Small" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Single node compute has no workers: Spark runs locally and the driver acts as both master and worker, with one executor thread per logical core minus one for the driver. It runs Spark commands on a single VM, which makes it the cheapest classic option for small, non-distributed workloads.
    fr: |
      Un calcul à nœud unique n'a pas de workers : Spark s'exécute en local et le pilote joue à la fois le rôle de maître et de worker, avec un thread d'exécuteur par cœur logique moins un pour le pilote. Il exécute les commandes Spark sur une seule machine virtuelle, ce qui en fait l'option classique la moins chère pour des charges petites et non distribuées.
  options:
    a: { en: "Multi-node compute needs at least one worker to run Spark jobs; with 0 workers, Spark commands fail.", fr: "Un calcul multinœud a besoin d'au moins un worker pour exécuter des jobs Spark ; avec 0 worker, les commandes Spark échouent." }
    b: { en: "Multi-node compute always runs a driver plus at least one worker VM, which costs more than one VM.", fr: "Un calcul multinœud exécute toujours un pilote plus au moins une machine virtuelle worker, ce qui coûte plus qu'une seule machine virtuelle." }
    d: { en: "A SQL warehouse runs SQL only; it can't run Python code such as pandas.", fr: "Un entrepôt SQL n'exécute que du SQL ; il ne peut pas exécuter de code Python comme pandas." }
references:
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
