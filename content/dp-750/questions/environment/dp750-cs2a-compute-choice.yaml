id: dp750-cs2a-compute-choice
objective: "1.1.1"
type: multi
caseStudy: dp750-cs2a-wide-world-importers
difficulty: 3
status: draft
stem:
  en: |
    You need to choose the compute for the ingest_telemetry job and for the dispatcher dashboards. The solution must meet the telemetry ingestion, analytics and general requirements.

    Which two compute resources should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir le calcul du job ingest_telemetry et celui des tableaux de bord des répartiteurs. La solution doit respecter les exigences d'ingestion de la télémétrie, d'analytique et les exigences générales.

    Quelles sont les deux ressources de calcul que vous devez utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: srvjob, text: { en: "Serverless compute for the ingest_telemetry notebook task", fr: "Le calcul serverless pour la tâche de notebook ingest_telemetry" } }
    - { id: classicjob, text: { en: "Classic jobs compute for the ingest_telemetry notebook task", fr: "Le calcul de jobs classique pour la tâche de notebook ingest_telemetry" } }
    - { id: allpurpose, text: { en: "Classic all-purpose compute for the ingest_telemetry notebook task", fr: "Le calcul polyvalent classique pour la tâche de notebook ingest_telemetry" } }
    - { id: srvwh, text: { en: "A serverless SQL warehouse for the dispatcher dashboards", fr: "Un entrepôt SQL serverless pour les tableaux de bord des répartiteurs" } }
    - { id: prowh, text: { en: "A pro SQL warehouse for the dispatcher dashboards", fr: "Un entrepôt SQL pro pour les tableaux de bord des répartiteurs" } }
    - { id: classicwh, text: { en: "A classic SQL warehouse for the dispatcher dashboards", fr: "Un entrepôt SQL classique pour les tableaux de bord des répartiteurs" } }
answer: { optionIds: [ classicjob, srvwh ] }
explanation:
  correct:
    en: Serverless compute for notebooks and jobs supports only the AvailableNow (and deprecated Once) streaming triggers, so a notebook that uses a processing-time trigger needs classic jobs compute, which is the compute designed for automated workloads. For dashboards, a serverless SQL warehouse starts in seconds, scales rapidly and stops when idle, so nothing is paid while nobody uses it.
    fr: Le calcul serverless pour les notebooks et les jobs ne prend en charge que les déclencheurs de streaming AvailableNow (et Once, déprécié) ; un notebook qui utilise un déclencheur à intervalle de traitement a donc besoin d'un calcul de jobs classique, conçu pour les charges de travail automatisées. Pour les tableaux de bord, un entrepôt SQL serverless démarre en quelques secondes, se met à l'échelle rapidement et s'arrête quand il est inactif ; rien n'est donc facturé quand personne ne l'utilise.
  options:
    srvjob:
      en: "Serverless notebooks and jobs reject `trigger(processingTime=...)` with an unsupported trigger error."
      fr: "Les notebooks et jobs serverless refusent `trigger(processingTime=...)` avec une erreur de déclencheur non pris en charge."
    allpurpose:
      en: All-purpose compute would work but is meant for interactive work; Databricks advises against it for automated jobs, and it costs more than jobs compute.
      fr: Le calcul polyvalent fonctionnerait, mais il est destiné au travail interactif ; Databricks le déconseille pour les jobs automatisés et il coûte plus cher que le calcul de jobs.
    prowh:
      en: A pro SQL warehouse does not start in seconds like a serverless SQL warehouse; Databricks recommends it only when serverless is not available or custom networking is needed.
      fr: Un entrepôt SQL pro ne démarre pas en quelques secondes comme un entrepôt SQL serverless ; Databricks le recommande uniquement quand le serverless n'est pas disponible ou qu'un réseau personnalisé est nécessaire.
    classicwh:
      en: A classic SQL warehouse offers entry-level performance for basic exploration and lacks the fast startup of a serverless SQL warehouse.
      fr: Un entrepôt SQL classique offre des performances d'entrée de gamme pour l'exploration de base et n'a pas le démarrage rapide d'un entrepôt SQL serverless.
references:
  - title: Serverless compute limitations
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/serverless/limitations
  - title: Compute selection recommendations
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/choose-compute
