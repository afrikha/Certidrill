id: dp750-1b-federation-choice
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has an Azure SQL Database named **erp** that contains a few small reference tables. Analysts need to run occasional read-only queries on these tables from Azure Databricks, with access managed by Unity Catalog. The data must not be copied into Azure Databricks, and every query must return the current data of the database.

    What should you create?
  fr: |
    Woodgrove dispose d'une base de données Azure SQL Database nommée **erp** qui contient quelques petites tables de référence. Les analystes doivent exécuter des requêtes occasionnelles en lecture seule sur ces tables depuis Azure Databricks, avec un accès géré par Unity Catalog. Les données ne doivent pas être copiées dans Azure Databricks, et chaque requête doit renvoyer les données actuelles de la base.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A Lakeflow Connect ingestion pipeline for the erp database", fr: "Un pipeline d'ingestion Lakeflow Connect pour la base erp" } }
    - { id: b, text: { en: "A storage credential and an external location for the erp database", fr: "Des informations d'identification de stockage et un emplacement externe pour la base erp" } }
    - { id: c, text: { en: "A connection and a foreign catalog for the erp database", fr: "Une connexion et un catalogue étranger pour la base erp" } }
    - { id: d, text: { en: "An external volume that points to the erp database", fr: "Un volume externe qui pointe vers la base erp" } }
answer: { optionId: c }
explanation:
  correct:
    en: Lakehouse Federation gives governed, read-only access to an external database without migrating the data. A connection stores the host and credentials, and a foreign catalog mirrors the database in Unity Catalog; queries are pushed down to the database, so they return its current data.
    fr: Lakehouse Federation offre un accès gouverné en lecture seule à une base externe sans migrer les données. Une connexion stocke l'hôte et les informations d'identification, et un catalogue étranger reflète la base dans Unity Catalog ; les requêtes sont envoyées (pushdown) à la base et renvoient donc ses données actuelles.
  options:
    a:
      en: Lakeflow Connect ingests (copies) the tables into Unity Catalog, which the requirements exclude.
      fr: Lakeflow Connect ingère (copie) les tables dans Unity Catalog, ce que les exigences excluent.
    b:
      en: Storage credentials and external locations govern access to cloud object storage paths, not to a SQL database.
      fr: Les informations d'identification de stockage et les emplacements externes gouvernent l'accès à des chemins de stockage objet cloud, pas à une base SQL.
    d:
      en: A volume governs files in cloud object storage; it cannot point to a database.
      fr: Un volume gouverne des fichiers dans un stockage objet cloud ; il ne peut pas pointer vers une base de données.
references:
  - title: Connect to external databases and catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/
