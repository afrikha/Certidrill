id: dp750-1a-share-alias
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso stores general ledger entries in `prod_finance.ledger_internal.gl_entries_v3`. An auditing partner, Fabrikam, uses Azure Databricks. A share named **fabrikam_audit** exists, and the Fabrikam recipient already has SELECT on it.

    Fabrikam must query the table as `finance.gl_entries` within the catalog that it creates from the share, without seeing Contoso's internal schema and table names. Contoso's jobs must keep using the current table name, and you must not create any new object in your metastore.

    Which statement should you run?
  fr: |
    Contoso stocke les écritures du grand livre dans `prod_finance.ledger_internal.gl_entries_v3`. Un partenaire d'audit, Fabrikam, utilise Azure Databricks. Un partage nommé **fabrikam_audit** existe, et le destinataire Fabrikam dispose déjà de SELECT dessus.

    Fabrikam doit interroger la table sous le nom `finance.gl_entries` dans le catalogue qu'il crée à partir du partage, sans voir les noms internes du schéma et de la table de Contoso. Les jobs de Contoso doivent continuer à utiliser le nom actuel de la table, et vous ne devez créer aucun nouvel objet dans votre metastore.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "`ALTER SHARE fabrikam_audit ADD SCHEMA prod_finance.ledger_internal;`" }
    - { id: b, text: "`ALTER TABLE prod_finance.ledger_internal.gl_entries_v3 RENAME TO prod_finance.finance.gl_entries;`" }
    - { id: c, text: "`CREATE VIEW prod_finance.finance.gl_entries AS SELECT * FROM prod_finance.ledger_internal.gl_entries_v3;`" }
    - { id: d, text: "`ALTER SHARE fabrikam_audit ADD TABLE prod_finance.ledger_internal.gl_entries_v3 AS finance.gl_entries;`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `AS <alias>` clause of `ALTER SHARE ... ADD TABLE` sets the name, in the format `<schema-name>.<table-name>`, that recipients must use in their queries; once an alias is set, recipients can't use the actual table name. The provider's table keeps its name, and the recipient chooses the catalog name when it creates the catalog from the share.
    fr: |
      La clause `AS <alias>` de `ALTER SHARE ... ADD TABLE` définit le nom, au format `<nom-schéma>.<nom-table>`, que les destinataires doivent utiliser dans leurs requêtes ; une fois l'alias défini, ils ne peuvent plus utiliser le nom réel de la table. La table du fournisseur garde son nom, et le destinataire choisit le nom du catalogue lorsqu'il le crée à partir du partage.
  options:
    a: { en: "A schema share exposes the actual schema and table names, and aliases aren't available for schema shares.", fr: "Un partage de schéma expose les noms réels du schéma et des tables, et les alias ne sont pas disponibles pour les partages de schéma." }
    b: { en: "Renaming the table breaks Contoso's jobs, which must keep using the current name.", fr: "Renommer la table casse les jobs de Contoso, qui doivent continuer à utiliser le nom actuel." }
    c: { en: "A view is a new object in the metastore, and it would still have to be added to the share.", fr: "Une vue est un nouvel objet du metastore, et il faudrait encore l'ajouter au partage." }
references:
  - title: Create shares for OpenSharing
    url: https://learn.microsoft.com/en-us/azure/databricks/delta-sharing/create-share
