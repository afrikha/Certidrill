id: dp750-1a-photon-statements
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin uses SQL warehouses, serverless compute and classic compute in its Azure Databricks workspace. The data engineers review how Photon applies to their workloads.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin utilise des entrepôts SQL, du calcul serverless et du calcul classique dans son espace de travail Azure Databricks. Les ingénieurs données examinent comment Photon s'applique à leurs charges de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Photon is enabled by default on SQL warehouses and on serverless compute.
        fr: Photon est activé par défaut sur les entrepôts SQL et sur le calcul serverless.
    - id: s2
      text:
        en: Photon accelerates stateful Structured Streaming queries.
        fr: Photon accélère les requêtes Structured Streaming avec état.
    - id: s3
      text:
        en: If a query contains an operation that Photon doesn't support, that part of the query runs on the standard Spark engine.
        fr: Si une requête contient une opération que Photon ne prend pas en charge, cette partie de la requête s'exécute sur le moteur Spark standard.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Photon is on by default on SQL warehouses, serverless compute and serverless Lakeflow pipelines. Stateful streaming isn't supported; only stateless streaming with sources and sinks such as Delta and Parquet benefits. Unsupported operations fall back transparently to the Spark runtime for that portion of the query, and the results remain correct.
    fr: |
      Photon est activé par défaut sur les entrepôts SQL, le calcul serverless et les pipelines Lakeflow serverless. Le streaming avec état n'est pas pris en charge ; seul le streaming sans état, avec des sources et récepteurs comme Delta et Parquet, en bénéficie. Les opérations non prises en charge basculent de manière transparente vers le runtime Spark pour cette partie de la requête, et les résultats restent corrects.
references:
  - title: What is Photon?
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/photon
