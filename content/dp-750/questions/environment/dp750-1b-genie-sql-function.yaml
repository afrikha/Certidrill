id: dp750-1b-genie-sql-function
objective: "1.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum's finance team maintains the commission calculation used by several reporting tools. The calculation takes a sales representative ID and a month as inputs and applies tiered rates that change every quarter.

    You are configuring a Genie Agent for sales managers. The following requirements must be met:

    - Genie must apply the finance team's calculation exactly, with the values supplied by users, and return verified answers.
    - The finance team must update the logic in one place for all tools.
    - Genie must not be able to view or change the logic of the calculation.

    What should you add to the agent?
  fr: |
    L'équipe financière d'Adatum maintient le calcul des commissions utilisé par plusieurs outils de création de rapports. Le calcul prend en entrée un ID de commercial et un mois, et applique des taux par paliers qui changent chaque trimestre.

    Vous configurez un Genie Agent destiné aux responsables commerciaux. Les exigences suivantes doivent être respectées :

    - Genie doit appliquer exactement le calcul de l'équipe financière, avec les valeurs fournies par les utilisateurs, et renvoyer des réponses vérifiées.
    - L'équipe financière doit mettre à jour la logique à un seul endroit pour tous les outils.
    - Genie ne doit pas pouvoir consulter ni modifier la logique du calcul.

    Que devez-vous ajouter à l'agent ?
body:
  options:
    - { id: a, text: { en: "A parameterized example SQL query that contains the calculation", fr: "Un exemple de requête SQL paramétrée qui contient le calcul" } }
    - { id: b, text: { en: "A SQL expression of type Measure that contains the calculation", fr: "Une expression SQL de type Measure qui contient le calcul" } }
    - { id: c, text: { en: "A text instruction that describes the tiered rates", fr: "Une instruction textuelle qui décrit les taux par paliers" } }
    - { id: d, text: { en: "A Unity Catalog function added as a SQL function", fr: "Une fonction Unity Catalog ajoutée comme fonction SQL" } }
answer: { optionId: d }
explanation:
  correct:
    en: A Unity Catalog function added to the agent is a trusted asset. Genie can call scalar and table-valued functions with user-supplied parameters and returns a verified answer, but it cannot view or change the function's SQL. The function lives in Unity Catalog, so the finance team maintains it once for every tool, and users need EXECUTE on it.
    fr: Une fonction Unity Catalog ajoutée à l'agent est une ressource approuvée. Genie peut appeler des fonctions scalaires et table avec des paramètres fournis par les utilisateurs et renvoie une réponse vérifiée, mais il ne peut ni consulter ni modifier le SQL de la fonction. La fonction réside dans Unity Catalog ; l'équipe financière la maintient donc une seule fois pour tous les outils, et les utilisateurs ont besoin d'EXECUTE sur celle-ci.
  options:
    a:
      en: A parameterized example query is also a trusted asset, but its SQL is stored in the agent, where Genie reads it, and other tools cannot reuse it.
      fr: Un exemple de requête paramétrée est aussi une ressource approuvée, mais son SQL est stocké dans l'agent, où Genie le lit, et les autres outils ne peuvent pas le réutiliser.
    b:
      en: A Measure is stored in the agent and Genie reads its code; it is not shared with other tools and does not take user inputs as function parameters.
      fr: Une expression Measure est stockée dans l'agent et Genie lit son code ; elle n'est pas partagée avec les autres outils et ne prend pas d'entrées utilisateur comme paramètres de fonction.
    c:
      en: Text instructions are the least consistent way to convey logic and do not produce verified answers.
      fr: Les instructions textuelles sont le moyen le moins cohérent de transmettre une logique et ne produisent pas de réponses vérifiées.
