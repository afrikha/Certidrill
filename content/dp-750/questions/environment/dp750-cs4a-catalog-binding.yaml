id: dp750-cs4a-catalog-binding
objective: "1.2.2"
type: single
caseStudy: dp750-cs4a-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the hi_prod catalog to meet the environment isolation requirement. The engineers keep their SELECT and MODIFY privileges on hi_prod. What should you do?
  fr: |
    Vous devez configurer le catalogue hi_prod pour satisfaire l'exigence d'isolation des environnements. Les ingénieurs conservent leurs privilèges SELECT et MODIFY sur hi_prod. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Clear All workspaces have access, assign adb-hi-prod with read and write access, and assign adb-hi-dev with read-only access.", fr: "Désactiver All workspaces have access, affecter adb-hi-prod en lecture et écriture, puis affecter adb-hi-dev en lecture seule." } }
    - { id: b, text: { en: "Clear All workspaces have access and assign only adb-hi-prod, then create a view of each hi_prod table in hi_dev.", fr: "Désactiver All workspaces have access et affecter uniquement adb-hi-prod, puis créer dans hi_dev une vue de chaque table de hi_prod." } }
    - { id: c, text: { en: "Keep All workspaces have access, and grant the engineers BROWSE on hi_prod instead of SELECT and MODIFY.", fr: "Conserver All workspaces have access et accorder aux ingénieurs BROWSE sur hi_prod au lieu de SELECT et MODIFY." } }
    - { id: d, text: { en: "Attach adb-hi-dev and adb-hi-sandbox to a second metastore, and create a foreign catalog for hi_prod in it.", fr: "Attacher adb-hi-dev et adb-hi-sandbox à un second metastore, puis y créer un catalogue étranger pour hi_prod." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Workspace-catalog binding sets the catalog to ISOLATED, so only the assigned workspaces can reach it, whatever privileges users hold; adb-hi-sandbox is not assigned and gets an error. A binding can be read-only, which blocks every write from adb-hi-dev while the engineers keep their privileges and read and write hi_prod from adb-hi-prod.
    fr: |
      La liaison espace de travail-catalogue passe le catalogue en mode ISOLATED : seuls les espaces de travail affectés peuvent y accéder, quels que soient les privilèges des utilisateurs ; adb-hi-sandbox n'est pas affecté et reçoit une erreur. Une liaison peut être en lecture seule, ce qui bloque toute écriture depuis adb-hi-dev tandis que les ingénieurs conservent leurs privilèges et lisent et écrivent hi_prod depuis adb-hi-prod.
  options:
    b:
      en: |
        A view in hi_dev still reads hi_prod from adb-hi-dev, which is not assigned to the catalog, so the views would fail.
      fr: |
        Une vue dans hi_dev lit toujours hi_prod depuis adb-hi-dev, qui n'est pas affecté au catalogue : les vues échoueraient.
    c:
      en: |
        BROWSE only lets users see metadata, so the engineers could no longer read the data, and the catalog would stay reachable from adb-hi-sandbox.
      fr: |
        BROWSE permet seulement de voir les métadonnées : les ingénieurs ne pourraient plus lire les données, et le catalogue resterait accessible depuis adb-hi-sandbox.
    d:
      en: |
        A foreign catalog mirrors an external database through a connection; it is not a way to expose a Unity Catalog catalog, and splitting metastores adds complexity without meeting the read-only requirement.
      fr: |
        Un catalogue étranger reflète une base de données externe au moyen d'une connexion ; ce n'est pas un moyen d'exposer un catalogue Unity Catalog, et séparer les metastores ajoute de la complexité sans satisfaire l'exigence de lecture seule.
references:
  - title: Workspace-catalog binding
    url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/binding
