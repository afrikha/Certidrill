id: dp750-1b-table-create-or-replace
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a managed Delta table named **adatum_prod.gold.customer_snapshot**. Several groups have been granted SELECT on the table.

    Every night, a job must rebuild the table from a query on adatum_prod.silver.customers. The query sometimes adds new columns, so the schema of the table must follow the query. The table history and the existing grants must be preserved.

    Which statement should the job run?
  fr: |
    Adatum dispose d'une table Delta managée nommée **adatum_prod.gold.customer_snapshot**. Plusieurs groupes disposent de SELECT sur la table.

    Chaque nuit, un job doit reconstruire la table à partir d'une requête sur adatum_prod.silver.customers. La requête ajoute parfois de nouvelles colonnes ; le schéma de la table doit donc suivre la requête. L'historique de la table et les autorisations existantes doivent être conservés.

    Quelle instruction le job doit-il exécuter ?
body:
  options:
    - { id: a, text: "DROP TABLE adatum_prod.gold.customer_snapshot, followed by CREATE TABLE adatum_prod.gold.customer_snapshot AS SELECT ..." }
    - { id: b, text: "INSERT OVERWRITE TABLE adatum_prod.gold.customer_snapshot SELECT ..." }
    - { id: c, text: "CREATE TABLE IF NOT EXISTS adatum_prod.gold.customer_snapshot AS SELECT ..." }
    - { id: d, text: "CREATE OR REPLACE TABLE adatum_prod.gold.customer_snapshot AS SELECT ..." }
answer: { optionId: d }
explanation:
  correct:
    en: CREATE OR REPLACE TABLE ... AS SELECT replaces the content and the schema of a Delta table with the query result, and it preserves the table history and the granted privileges. Databricks recommends replacing a table rather than dropping and re-creating it.
    fr: CREATE OR REPLACE TABLE ... AS SELECT remplace le contenu et le schéma d'une table Delta par le résultat de la requête, en conservant l'historique de la table et les privilèges accordés. Databricks recommande de remplacer une table plutôt que de la supprimer et de la recréer.
  options:
    a:
      en: Dropping the table creates a new table with no history and without the grants made on the old one.
      fr: La suppression de la table crée une nouvelle table sans historique ni les autorisations accordées sur l'ancienne.
    b:
      en: INSERT OVERWRITE replaces the rows but, unless schema evolution is explicitly enabled, keeps the existing table schema, so the query with new columns would fail.
      fr: INSERT OVERWRITE remplace les lignes mais, sauf si l'évolution du schéma est explicitement activée, conserve le schéma existant de la table ; la requête comportant de nouvelles colonnes échouerait.
    c:
      en: IF NOT EXISTS does nothing when the table already exists, so the table would never be rebuilt.
      fr: IF NOT EXISTS ne fait rien si la table existe déjà ; la table ne serait jamais reconstruite.
references:
  - title: CREATE TABLE [USING]
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-table-using
