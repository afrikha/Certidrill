id: dp750-1b-genie-trusted-assets
objective: "1.2.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an AI/BI Genie space for regional sales managers. You need to configure trusted assets so that Genie gives verified answers:

    - An example SQL query must answer "What is the open pipeline for <region>?" for any region that a user names.
    - The space must use the Unity Catalog function **nw_prod.finance.commission_due(region STRING)**.

    You also need to identify the permissions involved.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un espace AI/BI Genie destiné aux responsables commerciaux régionaux. Vous devez configurer des ressources approuvées (trusted assets) pour que Genie fournisse des réponses vérifiées :

    - Un exemple de requête SQL doit répondre à « Quel est le pipeline ouvert pour <région> ? » pour toute région citée par un utilisateur.
    - L'espace doit utiliser la fonction Unity Catalog **nw_prod.finance.commission_due(region STRING)**.

    Vous devez aussi identifier les autorisations en jeu.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Marker in the example query `WHERE a.region = ...`: [[param]]

      Privilege that the space users need on commission_due: [[priv]]

      Minimum Genie space permission to add or remove trusted assets: [[perm]]
    fr: |
      Marqueur dans l'exemple de requête `WHERE a.region = ...` : [[param]]

      Privilège dont les utilisateurs de l'espace ont besoin sur commission_due : [[priv]]

      Autorisation minimale sur l'espace Genie pour ajouter ou retirer des ressources approuvées : [[perm]]
  slots:
    - id: param
      options:
        - { id: at, text: "@region" }
        - { id: dollar, text: "${region}" }
        - { id: colon, text: ":region" }
        - { id: question, text: "?region" }
    - id: priv
      options:
        - { id: select, text: SELECT }
        - { id: execute, text: EXECUTE }
        - { id: modify, text: MODIFY }
        - { id: browse, text: BROWSE }
    - id: perm
      options:
        - { id: view, text: CAN VIEW }
        - { id: run, text: CAN RUN }
        - { id: edit, text: CAN EDIT }
        - { id: manage, text: CAN MANAGE }
answer:
  values: { param: colon, priv: execute, perm: edit }
explanation:
  correct:
    en: "In an example SQL query, a named parameter marker such as `:region` replaces a literal so that one query answers many questions. Users of the space need EXECUTE on any SQL function that Genie uses. Users with at least CAN EDIT on the space can add or remove trusted assets; CAN MANAGE would also work but is not the minimum."
    fr: "Dans un exemple de requête SQL, un marqueur de paramètre nommé comme `:region` remplace une valeur littérale pour qu'une seule requête réponde à de nombreuses questions. Les utilisateurs de l'espace ont besoin d'EXECUTE sur toute fonction SQL utilisée par Genie. Les utilisateurs disposant au moins de CAN EDIT sur l'espace peuvent ajouter ou retirer des ressources approuvées ; CAN MANAGE fonctionnerait aussi, mais ce n'est pas le minimum."
  options:
    at: { en: "Genie parameters use the colon syntax, not @.", fr: "Les paramètres Genie utilisent la syntaxe avec deux-points, pas @." }
    dollar: { en: "The ${...} syntax is not the Genie parameter marker.", fr: "La syntaxe ${...} n'est pas le marqueur de paramètre de Genie." }
    question: { en: "Genie uses named markers that start with a colon.", fr: "Genie utilise des marqueurs nommés qui commencent par un deux-points." }
    select: { en: "SELECT applies to tables and views; calling a function requires EXECUTE.", fr: "SELECT s'applique aux tables et aux vues ; l'appel d'une fonction exige EXECUTE." }
    run: { en: "CAN RUN lets users ask questions in the space, not change its trusted assets.", fr: "CAN RUN permet de poser des questions dans l'espace, pas de modifier ses ressources approuvées." }
references:
  - title: Tune Genie Agent quality
    url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/tune-quality
