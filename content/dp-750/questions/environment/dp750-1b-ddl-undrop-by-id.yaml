id: dp750-1b-ddl-undrop-by-id
objective: "1.2.7"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Three days ago, a job dropped the managed table **northwind_prod.gold.customers**, which had a primary key constraint on `customer_id`. The job then created a new, empty table with the same name. The default recovery period applies.

    You need to restore the dropped table under the name northwind_prod.gold.customers, with its primary key, and keep the new table as northwind_prod.gold.customers_empty. You already ran `SHOW TABLES DROPPED` and know the ID of the dropped table.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Il y a trois jours, un job a supprimé la table managée **northwind_prod.gold.customers**, qui possédait une contrainte de clé primaire sur `customer_id`. Le job a ensuite créé une nouvelle table vide portant le même nom. La période de récupération par défaut s'applique.

    Vous devez restaurer la table supprimée sous le nom northwind_prod.gold.customers, avec sa clé primaire, et conserver la nouvelle table sous le nom northwind_prod.gold.customers_empty. Vous avez déjà exécuté `SHOW TABLES DROPPED` et connaissez l'ID de la table supprimée.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rename, text: { en: "Run ALTER TABLE northwind_prod.gold.customers RENAME TO northwind_prod.gold.customers_empty.", fr: "Exécuter ALTER TABLE northwind_prod.gold.customers RENAME TO northwind_prod.gold.customers_empty." } }
    - { id: undrop, text: { en: "Run UNDROP TABLE WITH ID with the ID of the dropped table.", fr: "Exécuter UNDROP TABLE WITH ID avec l'ID de la table supprimée." } }
    - { id: pk, text: { en: "Run ALTER TABLE northwind_prod.gold.customers ADD CONSTRAINT to recreate the primary key.", fr: "Exécuter ALTER TABLE northwind_prod.gold.customers ADD CONSTRAINT pour recréer la clé primaire." } }
    - { id: restore, text: { en: "Run RESTORE TABLE northwind_prod.gold.customers TO TIMESTAMP AS OF the time before the drop.", fr: "Exécuter RESTORE TABLE northwind_prod.gold.customers TO TIMESTAMP AS OF l'heure précédant la suppression." } }
    - { id: drop, text: { en: "Run DROP TABLE northwind_prod.gold.customers on the new table.", fr: "Exécuter DROP TABLE northwind_prod.gold.customers sur la nouvelle table." } }
    - { id: repair, text: { en: "Run MSCK REPAIR TABLE northwind_prod.gold.customers SYNC METADATA.", fr: "Exécuter MSCK REPAIR TABLE northwind_prod.gold.customers SYNC METADATA." } }
answer:
  sequence: [ rename, undrop, pk ]
explanation:
  correct:
    en: UNDROP fails while a relation with the same name exists, so you first rename the new table. UNDROP TABLE WITH ID then restores the dropped table selected by its ID, with its privileges, columns and properties. Primary and foreign key constraints are not recovered, so you recreate the primary key with ALTER TABLE ... ADD CONSTRAINT.
    fr: UNDROP échoue tant qu'une relation du même nom existe ; vous renommez donc d'abord la nouvelle table. UNDROP TABLE WITH ID restaure ensuite la table supprimée désignée par son ID, avec ses privilèges, ses colonnes et ses propriétés. Les contraintes de clé primaire et étrangère ne sont pas récupérées ; vous recréez donc la clé primaire avec ALTER TABLE ... ADD CONSTRAINT.
  options:
    restore: { en: "RESTORE would act on the new table, whose history does not contain the dropped data.", fr: "RESTORE agirait sur la nouvelle table, dont l'historique ne contient pas les données supprimées." }
    drop: { en: "Dropping the new table would not keep it as customers_empty.", fr: "Supprimer la nouvelle table ne permettrait pas de la conserver sous le nom customers_empty." }
    repair: { en: "MSCK REPAIR TABLE synchronizes the metadata of an existing table; it does not recover a dropped one.", fr: "MSCK REPAIR TABLE synchronise les métadonnées d'une table existante ; il ne récupère pas une table supprimée." }
references:
  - title: UNDROP
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-undrop-table
