id: dp750-1b-ddl-set-managed
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a 400-GB external Delta table named **litware_prod.silver.shipments** in Unity Catalog. All readers and writers run on Databricks Runtime 17.3 LTS. You own the table.

    You need to make shipments a Unity Catalog managed table so that it benefits from predictive optimization. The table must keep its name, and reader and writer downtime must be minimized.

    What should you do?
  fr: |
    Litware dispose d'une table Delta externe de 400 Go nommée **litware_prod.silver.shipments** dans Unity Catalog. Tous les lecteurs et rédacteurs s'exécutent sur Databricks Runtime 17.3 LTS. Vous êtes propriétaire de la table.

    Vous devez faire de shipments une table managée Unity Catalog pour qu'elle bénéficie de l'optimisation prédictive. La table doit garder son nom, et l'interruption pour les lecteurs et les rédacteurs doit être réduite au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a managed copy with CREATE TABLE ... DEEP CLONE, drop the external table, and rename the copy.", fr: "Créer une copie managée avec CREATE TABLE ... DEEP CLONE, supprimer la table externe, puis renommer la copie." } }
    - { id: b, text: { en: "Run ALTER TABLE litware_prod.silver.shipments SET LOCATION with a path in the schema's managed location.", fr: "Exécuter ALTER TABLE litware_prod.silver.shipments SET LOCATION avec un chemin de l'emplacement managé du schéma." } }
    - { id: c, text: { en: "Run ALTER TABLE litware_prod.silver.shipments SET MANAGED.", fr: "Exécuter ALTER TABLE litware_prod.silver.shipments SET MANAGED." } }
    - { id: d, text: { en: "Create a managed copy with CREATE TABLE ... AS SELECT, drop the external table, and rename the copy.", fr: "Créer une copie managée avec CREATE TABLE ... AS SELECT, supprimer la table externe, puis renommer la copie." } }
answer: { optionId: c }
explanation:
  correct:
    en: ALTER TABLE ... SET MANAGED (Databricks Runtime 17.3 LTS or above, or serverless) converts an external Delta table to a managed table in place. It copies the data while readers and writers keep working, then blocks writes only briefly during the switch, and the table keeps its name.
    fr: ALTER TABLE ... SET MANAGED (Databricks Runtime 17.3 LTS ou ultérieur, ou serverless) convertit sur place une table Delta externe en table managée. La commande copie les données pendant que lecteurs et rédacteurs continuent de travailler, puis ne bloque les écritures que brièvement lors de la bascule, et la table garde son nom.
  options:
    a:
      en: A clone, drop and rename sequence makes the table unavailable while you swap names and creates a new table object; SET MANAGED is the documented in-place conversion.
      fr: Une séquence clonage, suppression et renommage rend la table indisponible pendant l'échange des noms et crée un nouvel objet table ; SET MANAGED est la conversion sur place documentée.
    b:
      en: SET LOCATION only points the table at another path without moving the files, and the table remains external.
      fr: SET LOCATION fait seulement pointer la table vers un autre chemin sans déplacer les fichiers, et la table reste externe.
    d:
      en: CTAS rewrites the data into a new table without the table history, and the swap causes downtime.
      fr: CTAS réécrit les données dans une nouvelle table sans l'historique de la table, et l'échange entraîne une interruption.
references:
  - title: Convert external or foreign Delta Lake tables to Unity Catalog managed tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/convert-to-managed
