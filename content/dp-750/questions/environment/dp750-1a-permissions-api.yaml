id: dp750-1a-permissions-api
objective: "1.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a classic compute resource whose cluster ID is `0101-120000-abcd1234`. You need to call the Permissions API to meet the following requirements:

    - The permissions already set on the compute must be kept.
    - Members of the **data-engineers** group must be able to attach notebooks and to start, restart and terminate the compute, but not to edit it.
    - A service principal whose application ID is `8a1f2c3d-5e6f-4a7b-9c8d-1234567890ab` must be able to manage the compute.

    How should you complete the command? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une ressource de calcul classique dont l'ID de cluster est `0101-120000-abcd1234`. Vous devez appeler l'API Permissions pour répondre aux exigences suivantes :

    - Les autorisations déjà définies sur le calcul doivent être conservées.
    - Les membres du groupe **data-engineers** doivent pouvoir attacher des notebooks, et démarrer, redémarrer et arrêter le calcul, mais pas le modifier.
    - Un principal de service dont l'ID d'application est `8a1f2c3d-5e6f-4a7b-9c8d-1234567890ab` doit pouvoir gérer le calcul.

    Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    curl -X [[method]] \
      "https://adb-1234567890123456.7.azuredatabricks.net/api/2.0/permissions/clusters/0101-120000-abcd1234" \
      -H "Authorization: Bearer $DATABRICKS_TOKEN" \
      -H "Content-Type: application/json" \
      -d '{
        "access_control_list": [
          { "group_name": "data-engineers", "permission_level": "[[level]]" },
          { "[[ptype]]": "8a1f2c3d-5e6f-4a7b-9c8d-1234567890ab", "permission_level": "CAN_MANAGE" }
        ]
      }'
  slots:
    - id: method
      options:
        - { id: put, text: PUT }
        - { id: patch, text: PATCH }
        - { id: get, text: GET }
    - id: level
      options:
        - { id: attach, text: CAN_ATTACH_TO }
        - { id: restart, text: CAN_RESTART }
        - { id: manage, text: CAN_MANAGE }
    - id: ptype
      options:
        - { id: user, text: user_name }
        - { id: group, text: group_name }
        - { id: sp, text: service_principal_name }
answer:
  values: { method: patch, level: restart, ptype: sp }
explanation:
  correct:
    en: |
      PATCH updates the permissions of the object, whereas PUT sets them and replaces the existing direct permissions. CAN_RESTART adds starting, restarting and terminating to attaching notebooks, without edit rights. A service principal is identified in an access control list entry by `service_principal_name`, whose value is its application ID.
    fr: |
      PATCH met à jour les autorisations de l'objet, alors que PUT les définit et remplace les autorisations directes existantes. CAN_RESTART ajoute le démarrage, le redémarrage et l'arrêt à l'attachement de notebooks, sans droits de modification. Un principal de service est identifié dans une entrée de liste de contrôle d'accès par `service_principal_name`, dont la valeur est son ID d'application.
  options:
    put: { en: "PUT replaces the existing direct permissions, so current grants would be lost.", fr: "PUT remplace les autorisations directes existantes : les autorisations actuelles seraient perdues." }
    get: { en: "GET only reads the current permissions.", fr: "GET ne fait que lire les autorisations actuelles." }
    attach: { en: "CAN_ATTACH_TO doesn't allow starting, restarting or terminating the compute.", fr: "CAN_ATTACH_TO ne permet pas de démarrer, redémarrer ni arrêter le calcul." }
    manage: { en: "CAN_MANAGE would let data-engineers edit the compute.", fr: "CAN_MANAGE permettrait à data-engineers de modifier le calcul." }
    user: { en: "user_name identifies a user by user name, not a service principal.", fr: "user_name identifie un utilisateur par son nom d'utilisateur, pas un principal de service." }
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
