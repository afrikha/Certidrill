id: dp750-1a-isolate-catalog-cli
objective: "1.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a catalog named **prod_hr** whose isolation mode is OPEN. Company policy requires HR data to be accessible only from the production workspace, whose workspace ID is 1234567890123456, with read and write access.

    You need to configure the isolation of prod_hr by using the Databricks CLI, and then verify the result.

    Which three commands should you run in sequence? To answer, move the appropriate commands from the list of commands to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un catalogue nommé **prod_hr** dont le mode d'isolation est OPEN. La politique de l'entreprise exige que les données RH ne soient accessibles que depuis l'espace de travail de production, dont l'ID est 1234567890123456, avec un accès en lecture et écriture.

    Vous devez configurer l'isolation de prod_hr à l'aide de l'interface CLI Databricks, puis vérifier le résultat.

    Quelles sont les trois commandes à exécuter dans l'ordre ? Pour répondre, déplacez les commandes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: iso
      text: "`databricks catalogs update prod_hr --isolation-mode ISOLATED`"
    - id: bind
      text: |-
        `databricks workspace-bindings update-bindings catalog prod_hr --json '{"add": [{"workspace_id": 1234567890123456, "binding_type": "BINDING_TYPE_READ_WRITE"}]}'`
    - id: get
      text: "`databricks workspace-bindings get-bindings catalog prod_hr`"
    - id: open
      text: "`databricks catalogs update prod_hr --isolation-mode OPEN`"
    - id: ro
      text: |-
        `databricks workspace-bindings update-bindings catalog prod_hr --json '{"add": [{"workspace_id": 1234567890123456, "binding_type": "BINDING_TYPE_READ_ONLY"}]}'`
    - id: create
      text: "`databricks catalogs create prod_hr`"
answer:
  sequence: [ iso, bind, get ]
explanation:
  correct:
    en: |
      Binding a catalog with the CLI is a two-step process: set the catalog's isolation mode to ISOLATED, then add the workspace bindings with `update-bindings`. `BINDING_TYPE_READ_WRITE` gives read and write access. `get-bindings` lists the current bindings so you can verify the configuration.
    fr: |
      La liaison d'un catalogue avec l'interface CLI se fait en deux étapes : définir le mode d'isolation du catalogue sur ISOLATED, puis ajouter les liaisons d'espace de travail avec `update-bindings`. `BINDING_TYPE_READ_WRITE` donne un accès en lecture et écriture. `get-bindings` liste les liaisons actuelles pour vérifier la configuration.
  options:
    open: { en: "OPEN is the default mode, in which every workspace attached to the metastore can access the catalog.", fr: "OPEN est le mode par défaut, dans lequel tous les espaces de travail attachés au metastore peuvent accéder au catalogue." }
    ro: { en: "A read-only binding would block the writes that the production workspace needs.", fr: "Une liaison en lecture seule bloquerait les écritures dont l'espace de travail de production a besoin." }
    create: { en: "prod_hr already exists, and creating a catalog doesn't configure its bindings.", fr: "prod_hr existe déjà, et la création d'un catalogue ne configure pas ses liaisons." }
references:
  - title: Workspace-catalog binding
    url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/binding
