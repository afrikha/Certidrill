id: dp750-1b-schema-create-privileges
objective: "1.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses a Unity Catalog metastore. A data engineer named User1 must create schemas in the catalog **fabrikam_dev** by running `CREATE SCHEMA` statements. The schemas will use the managed storage location of the catalog. User1 currently has no privileges on fabrikam_dev.

    You need to grant User1 the required privileges. The solution must follow the principle of least privilege.

    Which two privileges should you grant to User1 on fabrikam_dev? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise un metastore Unity Catalog. Un ingénieur données nommé User1 doit créer des schémas dans le catalogue **fabrikam_dev** en exécutant des instructions `CREATE SCHEMA`. Les schémas utiliseront l'emplacement de stockage managé du catalogue. User1 ne dispose actuellement d'aucun privilège sur fabrikam_dev.

    Vous devez accorder à User1 les privilèges nécessaires. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux privilèges à accorder à User1 sur fabrikam_dev ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: USE SCHEMA }
    - { id: b, text: USE CATALOG }
    - { id: c, text: CREATE TABLE }
    - { id: d, text: CREATE SCHEMA }
    - { id: e, text: BROWSE }
    - { id: f, text: CREATE MANAGED STORAGE }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Creating a schema in Unity Catalog requires the USE CATALOG and CREATE SCHEMA privileges on the parent catalog. A metastore admin or the catalog owner can grant them.
    fr: La création d'un schéma dans Unity Catalog exige les privilèges USE CATALOG et CREATE SCHEMA sur le catalogue parent. Un administrateur du metastore ou le propriétaire du catalogue peut les accorder.
  options:
    a:
      en: USE SCHEMA lets a principal access objects in existing schemas; it does not allow creating a schema.
      fr: USE SCHEMA permet d'accéder aux objets de schémas existants ; il ne permet pas de créer un schéma.
    c:
      en: CREATE TABLE lets a principal create tables and views in a schema, not create schemas.
      fr: CREATE TABLE permet de créer des tables et des vues dans un schéma, pas de créer des schémas.
    e:
      en: BROWSE only lets a principal discover objects and read their metadata.
      fr: BROWSE permet seulement de découvrir des objets et de consulter leurs métadonnées.
    f:
      en: CREATE MANAGED STORAGE is granted on an external location and is needed only to set a custom managed location, which is not the case here.
      fr: CREATE MANAGED STORAGE s'accorde sur un emplacement externe et n'est nécessaire que pour définir un emplacement managé personnalisé, ce qui n'est pas le cas ici.
references:
  - title: Create schemas
    url: https://learn.microsoft.com/en-us/azure/databricks/schemas/create-schema
  - title: Unity Catalog privileges reference
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges
