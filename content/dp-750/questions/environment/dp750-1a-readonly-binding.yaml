id: dp750-1a-readonly-binding
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has one Unity Catalog metastore attached to two workspaces named **adb-prod** and **adb-dev**. A catalog named **prod_sales** is open to all workspaces.

    The data engineers run production jobs in adb-prod that write to prod_sales, so they hold MODIFY on its tables. In adb-dev, they must be able to query prod_sales to test transformations, but no write to prod_sales must be possible from adb-dev.

    What should you do?
  fr: |
    Woodgrove dispose d'un metastore Unity Catalog attaché à deux espaces de travail nommés **adb-prod** et **adb-dev**. Un catalogue nommé **prod_sales** est ouvert à tous les espaces de travail.

    Les ingénieurs données exécutent dans adb-prod des jobs de production qui écrivent dans prod_sales : ils disposent donc de MODIFY sur ses tables. Dans adb-dev, ils doivent pouvoir interroger prod_sales pour tester des transformations, mais aucune écriture dans prod_sales ne doit être possible depuis adb-dev.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Revoke MODIFY on the tables of prod_sales from the data engineers in adb-dev.", fr: "Révoquer MODIFY sur les tables de prod_sales pour les ingénieurs données dans adb-dev." } }
    - { id: b, text: { en: "Bind prod_sales to adb-prod only, with read and write access.", fr: "Lier prod_sales à adb-prod uniquement, avec un accès en lecture et écriture." } }
    - { id: c, text: { en: "Bind prod_sales to adb-prod with read and write access and to adb-dev with read-only access.", fr: "Lier prod_sales à adb-prod avec un accès en lecture et écriture et à adb-dev avec un accès en lecture seule." } }
    - { id: d, text: { en: "Rename the catalog to prod_sales_ro and grant the data engineers SELECT on it.", fr: "Renommer le catalogue en prod_sales_ro et accorder SELECT dessus aux ingénieurs données." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Workspace-catalog binding restricts a catalog to selected workspaces, and each binding can be read-only. A read-only binding blocks every write operation from that workspace, whatever privileges the users hold, while the read and write binding keeps production jobs in adb-prod working.
    fr: |
      La liaison espace de travail-catalogue limite un catalogue à des espaces de travail choisis, et chaque liaison peut être en lecture seule. Une liaison en lecture seule bloque toute opération d'écriture depuis cet espace de travail, quels que soient les privilèges des utilisateurs, tandis que la liaison en lecture et écriture laisse fonctionner les jobs de production d'adb-prod.
  options:
    a: { en: "Privileges are granted to principals, not per workspace, so revoking MODIFY also breaks the production jobs in adb-prod.", fr: "Les privilèges sont accordés à des principaux, pas par espace de travail : révoquer MODIFY casse aussi les jobs de production d'adb-prod." }
    b: { en: "Users in an unbound workspace can't access the catalog at all, so they couldn't query it from adb-dev.", fr: "Les utilisateurs d'un espace de travail non lié ne peuvent pas du tout accéder au catalogue : ils ne pourraient pas l'interroger depuis adb-dev." }
    d: { en: "A name suffix doesn't enforce anything; the existing MODIFY privileges would still allow writes from adb-dev.", fr: "Un suffixe dans le nom n'impose rien ; les privilèges MODIFY existants permettraient toujours d'écrire depuis adb-dev." }
references:
  - title: Workspace-catalog binding
    url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/binding
