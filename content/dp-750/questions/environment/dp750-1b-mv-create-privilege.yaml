id: dp750-1b-mv-create-privilege
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An analyst named User1 must create standalone materialized views in the schema **fabrikam_prod.reporting** by running CREATE MATERIALIZED VIEW from a Pro SQL warehouse. User1 has the following privileges:

    - USE CATALOG on fabrikam_prod;
    - USE SCHEMA on fabrikam_prod.reporting and fabrikam_prod.silver;
    - SELECT on the source tables in fabrikam_prod.silver.

    You need to grant User1 one additional privilege on fabrikam_prod.reporting. The solution must follow the principle of least privilege.

    Which privilege should you grant?
  fr: |
    Un analyste nommé User1 doit créer des vues matérialisées autonomes dans le schéma **fabrikam_prod.reporting** en exécutant CREATE MATERIALIZED VIEW depuis un entrepôt SQL Pro. User1 dispose des privilèges suivants :

    - USE CATALOG sur fabrikam_prod ;
    - USE SCHEMA sur fabrikam_prod.reporting et fabrikam_prod.silver ;
    - SELECT sur les tables sources de fabrikam_prod.silver.

    Vous devez accorder à User1 un privilège supplémentaire sur fabrikam_prod.reporting. La solution doit respecter le principe du moindre privilège.

    Quel privilège devez-vous accorder ?
body:
  options:
    - { id: a, text: CREATE MATERIALIZED VIEW }
    - { id: b, text: CREATE TABLE }
    - { id: c, text: REFRESH }
    - { id: d, text: MODIFY }
answer: { optionId: a }
explanation:
  correct:
    en: The owner of a new materialized view needs SELECT on the base tables, USE CATALOG and USE SCHEMA, and the CREATE MATERIALIZED VIEW privilege on the target schema. User1 has everything except that last privilege.
    fr: Le propriétaire d'une nouvelle vue matérialisée a besoin de SELECT sur les tables de base, de USE CATALOG et USE SCHEMA, ainsi que du privilège CREATE MATERIALIZED VIEW sur le schéma cible. User1 dispose de tout sauf de ce dernier privilège.
  options:
    b:
      en: CREATE TABLE allows creating tables and views in the schema; materialized views have their own CREATE MATERIALIZED VIEW privilege.
      fr: CREATE TABLE permet de créer des tables et des vues dans le schéma ; les vues matérialisées ont leur propre privilège CREATE MATERIALIZED VIEW.
    c:
      en: REFRESH lets a user refresh an existing materialized view, not create one.
      fr: REFRESH permet d'actualiser une vue matérialisée existante, pas d'en créer une.
    d:
      en: MODIFY lets a user insert, update and delete data in tables; it does not allow creating objects.
      fr: MODIFY permet d'insérer, de mettre à jour et de supprimer des données dans des tables ; il ne permet pas de créer des objets.
