id: dp750-1a-serverless-statements
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Databricks workspace. The data engineering team plans to use serverless compute for notebooks and for Lakeflow Jobs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un espace de travail Azure Databricks. L'équipe d'ingénierie des données prévoit d'utiliser le calcul serverless pour les notebooks et pour Lakeflow Jobs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Serverless compute for notebooks can run notebooks written in R.
        fr: Le calcul serverless pour les notebooks peut exécuter des notebooks écrits en R.
    - id: s2
      text:
        en: Serverless compute for jobs requires the workspace to be enabled for Unity Catalog.
        fr: Le calcul serverless pour les jobs exige que l'espace de travail soit activé pour Unity Catalog.
    - id: s3
      text:
        en: When the performance optimized setting of a serverless job is disabled, the job consumes fewer DBUs but can take several minutes to start.
        fr: Lorsque le paramètre « performance optimized » d'un job serverless est désactivé, le job consomme moins de DBU mais peut mettre plusieurs minutes à démarrer.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Serverless compute doesn't support R, and Scala isn't supported in serverless notebooks. Serverless compute for jobs requires Unity Catalog, workloads compatible with standard access mode and a supported region. With performance optimized disabled (standard mode), the job uses less compute and fewer DBUs, with a startup latency of about 4 to 6 minutes; both modes use the same SKU.
    fr: |
      Le calcul serverless ne prend pas en charge R, et Scala n'est pas pris en charge dans les notebooks serverless. Le calcul serverless pour les jobs exige Unity Catalog, des charges de travail compatibles avec le mode d'accès standard et une région prise en charge. Avec « performance optimized » désactivé (mode standard), le job utilise moins de calcul et moins de DBU, avec une latence de démarrage de 4 à 6 minutes environ ; les deux modes utilisent la même référence (SKU).
references:
  - title: Serverless compute limitations
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/serverless/limitations
  - title: Run your Lakeflow Jobs with serverless compute for workflows
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/run-serverless-jobs
