id: dp750-1a-ml-runtime-photon
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You create a classic all-purpose compute resource in the workspace UI for a feature engineering team at Contoso. You select **Machine learning** and Databricks Runtime **17.3 LTS ML**.

    How should you complete the statements? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une ressource de calcul polyvalent classique dans l'interface utilisateur de l'espace de travail pour une équipe d'ingénierie des caractéristiques de Contoso. Vous sélectionnez **Machine learning** et Databricks Runtime **17.3 LTS ML**.

    Comment devez-vous compléter les affirmations ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Selecting Machine learning sets the access mode to [[mode]].
      On this runtime, Photon acceleration [[photon]].
      If Photon is enabled, the workload expected to run faster is [[gain]].
    fr: |
      Sélectionner Machine learning définit le mode d'accès sur [[mode]].
      Sur ce runtime, l'accélération Photon [[photon]].
      Si Photon est activé, la charge de travail qui devrait s'exécuter plus vite est [[gain]].
  slots:
    - id: mode
      options:
        - { id: std, text: Standard }
        - { id: ded, text: Dedicated }
        - { id: nois, text: No isolation shared }
    - id: photon
      options:
        - { id: never, text: { en: "can't be enabled, because Photon isn't available on ML runtimes", fr: "ne peut pas être activée, car Photon n'est pas disponible sur les runtimes ML" } }
        - { id: can, text: { en: "can be enabled, because the runtime is 15.2 ML or above", fr: "peut être activée, car le runtime est 15.2 ML ou ultérieur" } }
        - { id: forced, text: { en: "is always on and can't be cleared", fr: "est toujours active et ne peut pas être désactivée" } }
    - id: gain
      options:
        - { id: torch, text: { en: "PyTorch model training in Python", fr: "l'entraînement de modèles PyTorch en Python" } }
        - { id: pudf, text: { en: "transformations written as pandas UDFs", fr: "des transformations écrites sous forme d'UDF pandas" } }
        - { id: sql, text: { en: "Spark SQL and DataFrame feature engineering", fr: "l'ingénierie des caractéristiques en Spark SQL et DataFrame" } }
answer:
  values: { mode: ded, photon: can, gain: sql }
explanation:
  correct:
    en: |
      The Machine learning check box sets the access mode to Dedicated, with your account as the dedicated user; you can reassign it to another user or a group under Advanced. Photon can be enabled on Databricks Runtime 15.2 ML and above. It helps Spark SQL, DataFrames and feature engineering, but not non-JVM code such as PyTorch, XGBoost or TensorFlow, or pandas UDFs.
    fr: |
      La case Machine learning définit le mode d'accès sur Dedicated, avec votre compte comme utilisateur dédié ; vous pouvez la réattribuer à un autre utilisateur ou à un groupe dans Advanced. Photon peut être activé à partir de Databricks Runtime 15.2 ML. Il accélère Spark SQL, les DataFrames et l'ingénierie des caractéristiques, mais pas le code non JVM comme PyTorch, XGBoost ou TensorFlow, ni les UDF pandas.
  options:
    std: { en: "Databricks Runtime ML isn't supported in standard access mode.", fr: "Databricks Runtime ML n'est pas pris en charge en mode d'accès standard." }
    never: { en: "Photon is available on Databricks Runtime ML from version 15.2.", fr: "Photon est disponible sur Databricks Runtime ML à partir de la version 15.2." }
    torch: { en: "Python deep learning libraries aren't accelerated by Photon.", fr: "Les bibliothèques d'apprentissage profond Python ne sont pas accélérées par Photon." }
references:
  - title: Databricks Runtime for Machine Learning
    url: https://learn.microsoft.com/en-us/azure/databricks/machine-learning/databricks-runtime-ml
