id: dp750-1a-photon-workloads
objective: "1.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum is evaluating whether to keep Photon acceleration enabled on its classic compute. The team runs several kinds of workloads.

    Which two workloads are expected to benefit the most from Photon?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum évalue s'il faut garder l'accélération Photon activée sur son calcul classique. L'équipe exécute plusieurs types de charges de travail.

    Quelles sont les deux charges de travail qui devraient tirer le plus grand bénéfice de Photon ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Joins and aggregations over large Delta tables", fr: "Jointures et agrégations sur de grandes tables Delta" } }
    - { id: b, text: { en: "Transformations written with the RDD API", fr: "Transformations écrites avec l'API RDD" } }
    - { id: c, text: { en: "MERGE INTO statements on a Delta table that has thousands of columns", fr: "Instructions MERGE INTO sur une table Delta qui compte des milliers de colonnes" } }
    - { id: d, text: { en: "A notebook whose logic is mostly in Python UDFs", fr: "Un notebook dont la logique est surtout dans des UDF Python" } }
    - { id: e, text: { en: "Lookup queries that complete in under one second", fr: "Requêtes de recherche qui se terminent en moins d'une seconde" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Photon speeds up joins and shuffles (hash joins, columnar shuffle) and writes to Delta Lake through its native Parquet writer, including MERGE INTO, with especially large gains on wide tables. It helps most with longer queries over large datasets.
    fr: |
      Photon accélère les jointures et les shuffles (jointures par hachage, shuffle en colonnes) ainsi que les écritures Delta Lake grâce à son writer Parquet natif, y compris MERGE INTO, avec des gains particulièrement importants sur les tables larges. Il est surtout utile pour les requêtes longues sur de grands jeux de données.
  options:
    b: { en: "Photon doesn't support the RDD API; that code runs on the standard Spark engine.", fr: "Photon ne prend pas en charge l'API RDD ; ce code s'exécute sur le moteur Spark standard." }
    d: { en: "UDFs aren't supported by Photon, so that logic gets no acceleration.", fr: "Les UDF ne sont pas prises en charge par Photon : cette logique n'est pas accélérée." }
    e: { en: "Queries under about two seconds see little benefit because planning and scheduling dominate their duration.", fr: "Les requêtes de moins de deux secondes environ en tirent peu de bénéfice, car la planification et l'ordonnancement dominent leur durée." }
references:
  - title: What is Photon?
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/photon
