id: dp750-1a-photon-api
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CI/CD pipeline at Fabrikam creates classic jobs compute by calling the Clusters API. The compute must use Photon to accelerate the SQL and DataFrame transformations that write to `fabrikam_prod.silver.shipments`.

    Which setting should the request body include?
  fr: |
    Un pipeline CI/CD de Fabrikam crée du calcul de jobs classique en appelant l'API Clusters. Le calcul doit utiliser Photon pour accélérer les transformations SQL et DataFrame qui écrivent dans `fabrikam_prod.silver.shipments`.

    Quel paramètre le corps de la requête doit-il contenir ?
body:
  options:
    - { id: a, text: '"photon": true' }
    - { id: b, text: '"enable_serverless_compute": true' }
    - { id: c, text: '"runtime_engine": "STANDARD"' }
    - { id: d, text: '"runtime_engine": "PHOTON"' }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Photon is on by default for classic compute created in the UI, but when you create classic compute or jobs with the Clusters or Jobs API, you must explicitly set `runtime_engine` to `PHOTON`.
    fr: |
      Photon est activé par défaut sur le calcul classique créé dans l'interface utilisateur, mais lorsque vous créez du calcul classique ou des jobs avec l'API Clusters ou Jobs, vous devez explicitement définir `runtime_engine` sur `PHOTON`.
  options:
    a: { en: "`\"photon\": true` is the setting of the Pipelines API, not of the Clusters API.", fr: "`\"photon\": true` est le paramètre de l'API Pipelines, pas de l'API Clusters." }
    b: { en: "enable_serverless_compute belongs to the SQL Warehouses API and creates a serverless warehouse.", fr: "enable_serverless_compute appartient à l'API SQL Warehouses et crée un entrepôt serverless." }
    c: { en: "STANDARD selects the standard Spark engine without Photon.", fr: "STANDARD sélectionne le moteur Spark standard sans Photon." }
references:
  - title: What is Photon?
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/photon
