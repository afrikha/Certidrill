id: dp750-1b-volume-create-read
objective: "1.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A partner delivers CSV files to the ADLS Gen2 directory `abfss://partner@stfabrikamraw.dfs.core.windows.net/drop`, which is covered by a Unity Catalog external location. You have the required privileges.

    You need to register the directory as a volume named **fabrikam_prod.raw.partner_drop** without moving the files, and then query the file `orders_20261115.csv` from a SQL warehouse.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un partenaire dépose des fichiers CSV dans le répertoire ADLS Gen2 `abfss://partner@stfabrikamraw.dfs.core.windows.net/drop`, couvert par un emplacement externe Unity Catalog. Vous disposez des privilèges nécessaires.

    Vous devez inscrire le répertoire comme volume nommé **fabrikam_prod.raw.partner_drop** sans déplacer les fichiers, puis interroger le fichier `orders_20261115.csv` depuis un entrepôt SQL.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE [[kind]] VOLUME IF NOT EXISTS fabrikam_prod.raw.partner_drop
      [[loc]] 'abfss://partner@stfabrikamraw.dfs.core.windows.net/drop'
      COMMENT 'Files delivered by the partner';

    SELECT * FROM csv.`[[path]]`;
  slots:
    - id: kind
      options:
        - { id: managed, text: MANAGED }
        - { id: external, text: EXTERNAL }
        - { id: temp, text: TEMPORARY }
    - id: loc
      options:
        - { id: location, text: LOCATION }
        - { id: mloc, text: MANAGED LOCATION }
        - { id: options, text: OPTIONS }
    - id: path
      options:
        - { id: short, text: /Volumes/raw/partner_drop/orders_20261115.csv }
        - { id: full, text: /Volumes/fabrikam_prod/raw/partner_drop/orders_20261115.csv }
        - { id: mnt, text: dbfs:/mnt/partner_drop/orders_20261115.csv }
        - { id: ws, text: /Workspace/fabrikam_prod/raw/partner_drop/orders_20261115.csv }
answer:
  values: { kind: external, loc: location, path: full }
explanation:
  correct:
    en: "`CREATE EXTERNAL VOLUME ... LOCATION 'path'` registers an existing directory of an external location as a volume; without EXTERNAL the statement creates a managed volume. Volume files are addressed with the path `/Volumes/<catalog>/<schema>/<volume>/<file>`, the same path in SQL, Python and Spark."
    fr: "`CREATE EXTERNAL VOLUME ... LOCATION 'chemin'` inscrit un répertoire existant d'un emplacement externe comme volume ; sans EXTERNAL, l'instruction crée un volume managé. Les fichiers d'un volume s'adressent avec le chemin `/Volumes/<catalogue>/<schéma>/<volume>/<fichier>`, le même en SQL, Python et Spark."
  options:
    managed: { en: "MANAGED is not a keyword of CREATE VOLUME; a managed volume is created by omitting EXTERNAL and LOCATION.", fr: "MANAGED n'est pas un mot clé de CREATE VOLUME ; un volume managé se crée en omettant EXTERNAL et LOCATION." }
    temp: { en: "CREATE VOLUME has no TEMPORARY keyword; it creates a managed or an external volume.", fr: "CREATE VOLUME n'a pas de mot clé TEMPORARY ; l'instruction crée un volume managé ou externe." }
    mloc: { en: "MANAGED LOCATION is a clause of CREATE CATALOG and CREATE SCHEMA, not of CREATE VOLUME.", fr: "MANAGED LOCATION est une clause de CREATE CATALOG et CREATE SCHEMA, pas de CREATE VOLUME." }
    options: { en: "CREATE VOLUME has no OPTIONS clause; the path is set with LOCATION.", fr: "CREATE VOLUME n'a pas de clause OPTIONS ; le chemin se définit avec LOCATION." }
    short: { en: "The volume path must include the catalog name.", fr: "Le chemin du volume doit inclure le nom du catalogue." }
    mnt: { en: "A DBFS mount is not governed by Unity Catalog and is not the volume path.", fr: "Un montage DBFS n'est pas gouverné par Unity Catalog et n'est pas le chemin du volume." }
    ws: { en: "/Workspace contains workspace files, not volumes.", fr: "/Workspace contient les fichiers de l'espace de travail, pas les volumes." }
references:
  - title: CREATE VOLUME
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-volume
  - title: What are Unity Catalog volumes?
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/
