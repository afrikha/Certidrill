id: dp750-1a-compute-pool-permissions
objective: "1.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an instance pool named **pool-etl** and a classic compute resource named **etl-dev**. A group named **etl-devs** must be able to perform the following actions, with the least privilege for each one.

    Which permission level should you grant to etl-devs for each action? To answer, drag the appropriate permission levels to the correct actions. Each permission level may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un pool d'instances nommé **pool-etl** et d'une ressource de calcul classique nommée **etl-dev**. Un groupe nommé **etl-devs** doit pouvoir effectuer les actions suivantes, avec le moindre privilège pour chacune.

    Quel niveau d'autorisation devez-vous accorder à etl-devs pour chaque action ? Pour répondre, faites glisser les niveaux d'autorisation appropriés vers les actions correspondantes. Chaque niveau d'autorisation peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: none, text: NO PERMISSIONS }
    - { id: attach, text: CAN ATTACH TO }
    - { id: restart, text: CAN RESTART }
    - { id: manage, text: CAN MANAGE }
  targets:
    - { id: t1, text: { en: "On pool-etl: create compute that draws its nodes from the pool", fr: "Sur pool-etl : créer un calcul qui prend ses nœuds dans le pool" } }
    - { id: t2, text: { en: "On etl-dev: attach notebooks and run them", fr: "Sur etl-dev : attacher des notebooks et les exécuter" } }
    - { id: t3, text: { en: "On etl-dev: terminate and start the compute", fr: "Sur etl-dev : arrêter et démarrer le calcul" } }
    - { id: t4, text: { en: "On etl-dev: install a library", fr: "Sur etl-dev : installer une bibliothèque" } }
answer:
  mapping: { t1: attach, t2: attach, t3: restart, t4: manage }
explanation:
  correct:
    en: |
      CAN ATTACH TO on a pool lets a principal attach compute to it; editing or deleting the pool requires CAN MANAGE. On compute, CAN ATTACH TO covers attaching notebooks, CAN RESTART adds starting, restarting and terminating, and attaching a library requires CAN MANAGE.
    fr: |
      CAN ATTACH TO sur un pool permet à un principal d'y attacher un calcul ; modifier ou supprimer le pool exige CAN MANAGE. Sur un calcul, CAN ATTACH TO couvre l'attachement de notebooks, CAN RESTART ajoute le démarrage, le redémarrage et l'arrêt, et l'ajout d'une bibliothèque exige CAN MANAGE.
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
