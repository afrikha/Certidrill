id: dp750-1b-schema-create-statement
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing a deployment script for Contoso's Unity Catalog metastore. The script must create a schema named **contoso_prod.finance** and meet the following requirements:

    - The script must not fail when it runs again after the schema has been created.
    - The managed tables of the schema must be stored in the `finance` container, which is covered by an external location.
    - Catalog Explorer must display a description of the schema.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un script de déploiement pour le metastore Unity Catalog de Contoso. Le script doit créer un schéma nommé **contoso_prod.finance** et respecter les exigences suivantes :

    - Le script ne doit pas échouer lorsqu'il est exécuté à nouveau après la création du schéma.
    - Les tables managées du schéma doivent être stockées dans le conteneur `finance`, couvert par un emplacement externe.
    - Catalog Explorer doit afficher une description du schéma.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE SCHEMA [[exists]] contoso_prod.finance
      [[loc]] 'abfss://finance@stcontosouc.dfs.core.windows.net/managed'
      [[desc]] 'Finance reporting tables, owned by the FinOps team';
  slots:
    - id: exists
      options:
        - { id: ine, text: IF NOT EXISTS }
        - { id: ie, text: IF EXISTS }
        - { id: orr, text: OR REPLACE }
    - id: loc
      options:
        - { id: loc, text: LOCATION }
        - { id: mloc, text: MANAGED LOCATION }
        - { id: mstor, text: MANAGED STORAGE }
    - id: desc
      options:
        - { id: dbprop, text: WITH DBPROPERTIES }
        - { id: tblprop, text: TBLPROPERTIES }
        - { id: comment, text: COMMENT }
answer:
  values: { exists: ine, loc: mloc, desc: comment }
explanation:
  correct:
    en: IF NOT EXISTS makes the statement do nothing when the schema already exists, so the script can run again. MANAGED LOCATION sets the storage root of the schema's managed tables in Unity Catalog. COMMENT stores the description that Catalog Explorer displays.
    fr: IF NOT EXISTS fait que l'instruction ne fait rien si le schéma existe déjà ; le script peut donc être réexécuté. MANAGED LOCATION définit la racine de stockage des tables managées du schéma dans Unity Catalog. COMMENT enregistre la description qu'affiche Catalog Explorer.
  options:
    ie: { en: "IF EXISTS is used with DROP statements, not with CREATE SCHEMA.", fr: "IF EXISTS s'utilise avec les instructions DROP, pas avec CREATE SCHEMA." }
    orr: { en: "CREATE SCHEMA has no OR REPLACE clause.", fr: "CREATE SCHEMA ne possède pas de clause OR REPLACE." }
    loc: { en: "LOCATION is for Hive metastore schemas and is not supported in Unity Catalog.", fr: "LOCATION est destiné aux schémas du metastore Hive et n'est pas pris en charge dans Unity Catalog." }
    mstor: { en: "CREATE MANAGED STORAGE is a privilege on an external location, not a clause of CREATE SCHEMA.", fr: "CREATE MANAGED STORAGE est un privilège sur un emplacement externe, pas une clause de CREATE SCHEMA." }
    dbprop: { en: "WITH DBPROPERTIES sets key-value properties, not the schema description.", fr: "WITH DBPROPERTIES définit des propriétés clé-valeur, pas la description du schéma." }
    tblprop: { en: "TBLPROPERTIES applies to tables, not to schemas.", fr: "TBLPROPERTIES s'applique aux tables, pas aux schémas." }
references:
  - title: CREATE SCHEMA
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-schema
