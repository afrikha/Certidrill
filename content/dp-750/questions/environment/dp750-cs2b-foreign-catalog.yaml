id: dp750-cs2b-foreign-catalog
objective: "1.2.6"
type: ordering
caseStudy: dp750-cs2b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    A secret scope named **hi-kv** in adb-hi-prod gives access to the secrets sqlpa-user and sqlpa-password.

    You need to meet the data access requirement of the actuaries. Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une étendue de secrets nommée **hi-kv** dans adb-hi-prod donne accès aux secrets sqlpa-user et sqlpa-password.

    Vous devez satisfaire l'exigence d'accès aux données des actuaires. Quelles sont les trois actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et placez-les dans l'ordre correct.
body:
  count: 3
  actions:
    - { id: grant, text: { en: "Grant the actuaries group USE CATALOG, USE SCHEMA and SELECT on the foreign catalog.", fr: "Accorder au groupe actuaries USE CATALOG, USE SCHEMA et SELECT sur le catalogue étranger." } }
    - { id: storagecred, text: { en: "Create a storage credential that authenticates to sql-hi-policy.database.windows.net.", fr: "Créer des informations d'identification de stockage qui s'authentifient auprès de sql-hi-policy.database.windows.net." } }
    - { id: connection, text: { en: "Run CREATE CONNECTION with TYPE sqlserver and read the user name and password with the secret() function from hi-kv.", fr: "Exécuter CREATE CONNECTION avec TYPE sqlserver et lire le nom d'utilisateur et le mot de passe avec la fonction secret() depuis hi-kv." } }
    - { id: ctas, text: { en: "Run CREATE TABLE AS SELECT to load the PolicyAdmin tables into claims_prod.bronze.", fr: "Exécuter CREATE TABLE AS SELECT pour charger les tables de PolicyAdmin dans claims_prod.bronze." } }
    - { id: foreign, text: { en: "Run CREATE FOREIGN CATALOG with USING CONNECTION and the database option set to PolicyAdmin.", fr: "Exécuter CREATE FOREIGN CATALOG avec USING CONNECTION et l'option database définie sur PolicyAdmin." } }
    - { id: extloc, text: { en: "Create an external location that points to the PolicyAdmin database.", fr: "Créer un emplacement externe qui pointe vers la base de données PolicyAdmin." } }
answer:
  sequence: [ connection, foreign, grant ]
explanation:
  correct:
    en: Lakehouse Federation first needs a Unity Catalog connection of type sqlserver, which can read its credentials from a secret scope with secret(). A foreign catalog then mirrors the PolicyAdmin database through that connection, so queries run in place. Finally, the actuaries need USE CATALOG, USE SCHEMA and SELECT on the foreign catalog to query its tables.
    fr: "La fédération Lakehouse a d'abord besoin d'une connexion Unity Catalog de type sqlserver, qui peut lire ses informations d'identification dans une étendue de secrets avec secret(). Un catalogue étranger reflète ensuite la base de données PolicyAdmin par cette connexion : les requêtes s'exécutent sur place. Enfin, les actuaires ont besoin de USE CATALOG, USE SCHEMA et SELECT sur le catalogue étranger pour interroger ses tables."
  options:
    storagecred:
      en: Storage credentials give access to cloud storage, not to a database server.
      fr: Les informations d'identification de stockage donnent accès au stockage cloud, pas à un serveur de base de données.
    ctas:
      en: CTAS copies the data into Delta tables, which the requirement forbids.
      fr: CTAS copie les données dans des tables Delta, ce que l'exigence interdit.
    extloc:
      en: External locations reference cloud storage paths, not databases.
      fr: Les emplacements externes référencent des chemins de stockage cloud, pas des bases de données.
references:
  - title: Run federated queries on Microsoft SQL Server
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/sql-server
