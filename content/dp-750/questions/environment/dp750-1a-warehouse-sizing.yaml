id: dp750-1a-warehouse-sizing
objective: "1.1.2"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Woodgrove has a serverless SQL warehouse named **wh-finance**. The current configuration uses the default scaling of one cluster.

    The finance team reports two problems:

    - Some complex queries are slow even when only a few users are connected.
    - At month end, about 40 queries run at the same time and many of them are queued.

    You also want wh-finance to stop as soon as possible when it's idle, by using only the workspace UI.

    How should you configure wh-finance? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un entrepôt SQL serverless nommé **wh-finance**. La configuration actuelle utilise la mise à l'échelle par défaut d'un seul cluster.

    L'équipe financière signale deux problèmes :

    - Certaines requêtes complexes sont lentes même lorsque peu d'utilisateurs sont connectés.
    - En fin de mois, environ 40 requêtes s'exécutent en même temps et beaucoup d'entre elles sont mises en file d'attente.

    Vous souhaitez aussi que wh-finance s'arrête le plus tôt possible lorsqu'il est inactif, en utilisant uniquement l'interface utilisateur de l'espace de travail.

    Comment devez-vous configurer wh-finance ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - To reduce the duration of individual complex queries: [[latency]]
      - Maximum number of clusters, following the Databricks sizing guideline: [[maxc]]
      - Auto Stop value: [[stop]] minutes
    fr: |
      - Pour réduire la durée des requêtes complexes individuelles : [[latency]]
      - Nombre maximal de clusters, selon la règle de dimensionnement de Databricks : [[maxc]]
      - Valeur d'Auto Stop : [[stop]] minutes
  slots:
    - id: latency
      options:
        - { id: maxc, text: { en: "Increase the maximum number of clusters", fr: "Augmenter le nombre maximal de clusters" } }
        - { id: size, text: { en: "Increase the cluster size", fr: "Augmenter la taille du cluster" } }
        - { id: stop, text: { en: "Decrease the Auto Stop value", fr: "Diminuer la valeur d'Auto Stop" } }
        - { id: pro, text: { en: "Change the warehouse type to pro", fr: "Changer le type d'entrepôt en pro" } }
    - id: maxc
      options:
        - { id: m1, text: "1" }
        - { id: m2, text: "2" }
        - { id: m4, text: "4" }
        - { id: m40, text: "40" }
    - id: stop
      options:
        - { id: s1, text: "1" }
        - { id: s5, text: "5" }
        - { id: s10, text: "10" }
        - { id: s45, text: "45" }
answer:
  values: { latency: size, maxc: m4, stop: s5 }
explanation:
  correct:
    en: |
      Increasing the cluster size reduces query latency, while increasing the maximum number of clusters handles more concurrent queries; Databricks recommends about one cluster per 10 concurrent queries, so 40 queries need 4 clusters. For a serverless warehouse, the UI accepts an Auto Stop value as low as 5 minutes (the default is 10); only the API allows 1 minute.
    fr: |
      Augmenter la taille du cluster réduit la latence des requêtes, tandis qu'augmenter le nombre maximal de clusters permet de traiter davantage de requêtes simultanées ; Databricks recommande environ un cluster pour 10 requêtes simultanées, soit 4 clusters pour 40 requêtes. Pour un entrepôt serverless, l'interface utilisateur accepte une valeur d'Auto Stop de 5 minutes au minimum (10 par défaut) ; seule l'API permet 1 minute.
  options:
    maxc: { en: "More clusters absorb concurrency; they don't make one complex query faster.", fr: "Davantage de clusters absorbent la simultanéité ; ils ne rendent pas une requête complexe plus rapide." }
    pro: { en: "Pro warehouses lack Intelligent Workload Management and start more slowly than serverless.", fr: "Les entrepôts pro n'ont pas Intelligent Workload Management et démarrent plus lentement que le serverless." }
    m40: { en: "One cluster per query is far above the guideline of one cluster per 10 concurrent queries.", fr: "Un cluster par requête dépasse largement la règle d'un cluster pour 10 requêtes simultanées." }
    s1: { en: "1 minute can be set only through the API, not in the UI.", fr: "1 minute ne peut être définie que par l'API, pas dans l'interface utilisateur." }
    s45: { en: "45 minutes is the default for pro and classic warehouses, not the shortest value.", fr: "45 minutes est la valeur par défaut des entrepôts pro et classiques, pas la plus courte." }
references:
  - title: Create a SQL warehouse
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/sql-warehouse/create
