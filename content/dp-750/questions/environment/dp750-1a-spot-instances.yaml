id: dp750-1a-spot-instances
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs fault-tolerant batch workloads on classic compute and plans to use Azure Spot VMs to reduce cost. Some compute resources will draw their nodes from instance pools, and others won't use a pool.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute des charges de travail par lots tolérantes aux pannes sur un calcul classique et prévoit d'utiliser des machines virtuelles Azure Spot pour réduire les coûts. Certaines ressources de calcul prendront leurs nœuds dans des pools d'instances, d'autres n'utiliseront pas de pool.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On compute that doesn't use a pool, the driver is an on-demand instance and the workers can be spot instances.", fr: "Sur un calcul qui n'utilise pas de pool, le pilote est une instance à la demande et les workers peuvent être des instances spot." } }
    - { id: b, text: { en: "In a pool configured with All Spot, evicted instances are replaced with on-demand instances.", fr: "Dans un pool configuré avec All Spot, les instances évincées sont remplacées par des instances à la demande." } }
    - { id: c, text: { en: "On compute that doesn't use a pool, Azure Databricks tries to replace evicted spot workers and falls back to on-demand instances.", fr: "Sur un calcul qui n'utilise pas de pool, Azure Databricks tente de remplacer les workers spot évincés et se rabat sur des instances à la demande." } }
    - { id: d, text: { en: "Databricks recommends selecting a pool of spot instances as the driver type.", fr: "Databricks recommande de sélectionner un pool d'instances spot comme type de pilote." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Without a pool, compute that uses spot instances keeps the first instance (the driver) on demand and runs the workers on spot VMs; when spot workers are evicted, Azure Databricks tries to acquire replacements and falls back to on-demand instances. A pool set to All Spot launches every node, driver included, on spot instances, and evicted instances aren't replaced with on-demand ones.
    fr: |
      Sans pool, un calcul qui utilise des instances spot garde la première instance (le pilote) à la demande et exécute les workers sur des machines virtuelles spot ; lorsque des workers spot sont évincés, Azure Databricks tente d'en obtenir d'autres et se rabat sur des instances à la demande. Un pool réglé sur All Spot lance tous les nœuds, pilote compris, sur des instances spot, et les instances évincées ne sont pas remplacées par des instances à la demande.
  options:
    b: { en: "In an All Spot pool, on-demand instances don't replace evicted instances.", fr: "Dans un pool All Spot, des instances à la demande ne remplacent pas les instances évincées." }
    d: { en: "Databricks advises against a spot pool for the driver; select an on-demand driver type.", fr: "Databricks déconseille un pool spot pour le pilote ; sélectionnez un type de pilote à la demande." }
references:
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
  - title: Pool configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/pools
