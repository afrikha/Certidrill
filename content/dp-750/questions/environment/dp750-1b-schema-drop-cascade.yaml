id: dp750-1b-schema-drop-cascade
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind has a Unity Catalog schema named **nw_dev.sandbox** that contains the following objects:

    - a managed Delta table named orders;
    - an external Delta table named partner_feed whose files are in `abfss://partner@stnorthwind.dfs.core.windows.net/feed`;
    - a managed volume named exports.

    A developer runs the following statement:

    ```sql
    DROP SCHEMA nw_dev.sandbox CASCADE;
    ```

    What is the result?
  fr: |
    Northwind dispose d'un schéma Unity Catalog nommé **nw_dev.sandbox** qui contient les objets suivants :

    - une table Delta managée nommée orders ;
    - une table Delta externe nommée partner_feed dont les fichiers se trouvent dans `abfss://partner@stnorthwind.dfs.core.windows.net/feed` ;
    - un volume managé nommé exports.

    Un développeur exécute l'instruction suivante :

    ```sql
    DROP SCHEMA nw_dev.sandbox CASCADE;
    ```

    Quel est le résultat ?
body:
  options:
    - id: a
      text: { en: "The schema and its objects are dropped, and the files of orders, partner_feed and exports are deleted immediately.", fr: "Le schéma et ses objets sont supprimés, et les fichiers d'orders, de partner_feed et d'exports sont supprimés immédiatement." }
    - id: b
      text: { en: "The statement fails because the schema contains an external table that must be dropped first.", fr: "L'instruction échoue, car le schéma contient une table externe qui doit d'abord être supprimée." }
    - id: c
      text: { en: "The schema and its objects are dropped, the files of orders and exports are kept for a 7-day recovery window, and the files of partner_feed remain in storage.", fr: "Le schéma et ses objets sont supprimés, les fichiers d'orders et d'exports sont conservés pendant une fenêtre de récupération de 7 jours, et les fichiers de partner_feed restent dans le stockage." }
    - id: d
      text: { en: "The schema and its objects are dropped, the files of orders and exports are deleted immediately, and the files of partner_feed remain in storage.", fr: "Le schéma et ses objets sont supprimés, les fichiers d'orders et d'exports sont supprimés immédiatement, et les fichiers de partner_feed restent dans le stockage." }
answer: { optionId: c }
explanation:
  correct:
    en: In Unity Catalog, DROP SCHEMA ... CASCADE soft-deletes the schema and its child objects. The data files of managed tables and volumes are retained for 7 days so they can be recovered, then purged; the files of external tables and volumes are never deleted by the drop.
    fr: Dans Unity Catalog, DROP SCHEMA ... CASCADE effectue une suppression réversible du schéma et de ses objets enfants. Les fichiers de données des tables et volumes managés sont conservés 7 jours pour pouvoir être récupérés, puis purgés ; les fichiers des tables et volumes externes ne sont jamais supprimés par l'opération.
  options:
    a:
      en: External table files are never deleted when a Unity Catalog object is dropped, and managed data is not deleted immediately. Deleting every file in the location is the behavior of the legacy Hive metastore.
      fr: Les fichiers d'une table externe ne sont jamais supprimés lors de la suppression d'un objet Unity Catalog, et les données managées ne sont pas supprimées immédiatement. La suppression de tous les fichiers de l'emplacement est le comportement du metastore Hive hérité.
    b:
      en: CASCADE drops all the child objects of the schema, whatever their type.
      fr: CASCADE supprime tous les objets enfants du schéma, quel que soit leur type.
    d:
      en: Managed table and volume data are kept for a 7-day recovery window before they are purged.
      fr: Les données des tables et volumes managés sont conservées pendant une fenêtre de récupération de 7 jours avant d'être purgées.
references:
  - title: DROP SCHEMA
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-drop-schema
