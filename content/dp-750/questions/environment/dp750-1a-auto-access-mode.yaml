id: dp750-1a-auto-access-mode
objective: "1.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You create three classic compute resources in the workspace UI and leave the access mode at its default value, **Auto**. The resources use the following configurations.

    Which access mode does Auto select for each compute resource? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez trois ressources de calcul classiques dans l'interface utilisateur de l'espace de travail et laissez le mode d'accès sur sa valeur par défaut, **Auto**. Les ressources utilisent les configurations suivantes.

    Quel mode d'accès Auto sélectionne-t-il pour chaque ressource de calcul ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - etl-std: Databricks Runtime 16.4 LTS, worker type Standard_D8ds_v5: [[c1]]
      - ds-ml: Databricks Runtime 16.4 LTS ML, worker type Standard_D8ds_v5: [[c2]]
      - dl-gpu: Databricks Runtime 16.4 LTS, a GPU-enabled worker type: [[c3]]
    fr: |
      - etl-std : Databricks Runtime 16.4 LTS, type de worker Standard_D8ds_v5 : [[c1]]
      - ds-ml : Databricks Runtime 16.4 LTS ML, type de worker Standard_D8ds_v5 : [[c2]]
      - dl-gpu : Databricks Runtime 16.4 LTS, un type de worker avec GPU : [[c3]]
  slots:
    - id: c1
      options:
        - { id: std, text: Standard }
        - { id: ded, text: Dedicated }
        - { id: nois, text: No isolation shared }
    - id: c2
      options:
        - { id: std, text: Standard }
        - { id: ded, text: Dedicated }
        - { id: nois, text: No isolation shared }
    - id: c3
      options:
        - { id: std, text: Standard }
        - { id: ded, text: Dedicated }
        - { id: nois, text: No isolation shared }
answer:
  values: { c1: std, c2: ded, c3: ded }
explanation:
  correct:
    en: |
      Auto selects Dedicated when you choose a machine learning runtime, a GPU instance type or a Databricks Runtime version lower than 14.3; otherwise it selects Standard. etl-std matches none of these conditions, ds-ml uses an ML runtime and dl-gpu uses a GPU instance type.
    fr: |
      Auto sélectionne Dedicated lorsque vous choisissez un runtime Machine Learning, un type d'instance GPU ou une version de Databricks Runtime antérieure à 14.3 ; sinon, il sélectionne Standard. etl-std ne remplit aucune de ces conditions, ds-ml utilise un runtime ML et dl-gpu un type d'instance GPU.
  options:
    nois: { en: "Auto never selects the legacy No isolation shared mode.", fr: "Auto ne sélectionne jamais le mode hérité No isolation shared." }
references:
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
