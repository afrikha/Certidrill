id: dp750-1a-library-scopes
objective: "1.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum's data engineers need to install packages for four workloads. The workspace uses classic compute and serverless compute.

    Which installation method should you use for each workload? To answer, drag the appropriate methods to the correct workloads. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les ingénieurs données d'Adatum doivent installer des packages pour quatre charges de travail. L'espace de travail utilise du calcul classique et du calcul serverless.

    Quelle méthode d'installation devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les méthodes appropriées vers les charges de travail correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: compute, text: { en: "Compute-scoped library", fr: "Bibliothèque limitée au calcul" } }
    - { id: notebook, text: { en: "Notebook-scoped library installed with %pip", fr: "Bibliothèque limitée au notebook installée avec %pip" } }
    - { id: jobenv, text: { en: "Dependency in the task's serverless environment", fr: "Dépendance dans l'environnement serverless de la tâche" } }
    - { id: policy, text: { en: "Library defined in a compute policy", fr: "Bibliothèque définie dans une stratégie de calcul" } }
    - { id: init, text: { en: "Init script that runs pip install", fr: "Script d'initialisation qui exécute pip install" } }
  targets:
    - { id: t1, text: { en: "Every classic all-purpose compute resource that a team creates must include pandas 2.2.2, and users must not be able to uninstall it.", fr: "Chaque ressource de calcul polyvalent classique créée par une équipe doit inclure pandas 2.2.2, et les utilisateurs ne doivent pas pouvoir le désinstaller." } }
    - { id: t2, text: { en: "One notebook needs a different version of a package than the other notebooks attached to the same classic compute resource.", fr: "Un notebook a besoin d'une version d'un package différente de celle des autres notebooks attachés à la même ressource de calcul classique." } }
    - { id: t3, text: { en: "A Python script task that runs on serverless compute for jobs needs a wheel stored in a volume.", fr: "Une tâche de script Python exécutée sur le calcul serverless pour les jobs a besoin d'une roue (wheel) stockée dans un volume." } }
    - { id: t4, text: { en: "All notebooks attached to one classic compute resource need a JAR, and the compute owner manages its libraries.", fr: "Tous les notebooks attachés à une ressource de calcul classique ont besoin d'un JAR, et le propriétaire du calcul gère ses bibliothèques." } }
answer:
  mapping: { t1: policy, t2: notebook, t3: jobenv, t4: compute }
explanation:
  correct:
    en: |
      Libraries defined in a compute policy are installed on every compute that uses the policy, and users can't install or uninstall libraries there. %pip creates a library for the current notebook only. Serverless jobs don't use compute-scoped libraries: Python script tasks declare their dependencies in an environment. A compute-scoped library is available to all notebooks and jobs on that compute, and JARs can't be installed at the notebook level.
    fr: |
      Les bibliothèques définies dans une stratégie de calcul sont installées sur tout calcul qui utilise la stratégie, et les utilisateurs ne peuvent pas y installer ni désinstaller de bibliothèques. %pip crée une bibliothèque pour le notebook actuel uniquement. Les jobs serverless n'utilisent pas de bibliothèques limitées au calcul : les tâches de script Python déclarent leurs dépendances dans un environnement. Une bibliothèque limitée au calcul est disponible pour tous les notebooks et jobs de ce calcul, et les JAR ne peuvent pas être installés au niveau du notebook.
  options:
    init: { en: "Databricks doesn't recommend init scripts for installing libraries; policies are preferred.", fr: "Databricks ne recommande pas les scripts d'initialisation pour installer des bibliothèques ; les stratégies sont préférables." }
references:
  - title: Install libraries
    url: https://learn.microsoft.com/en-us/azure/databricks/libraries/
  - title: Configure the serverless environment
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/serverless/dependencies
