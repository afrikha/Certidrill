id: dp750-1b-genie-knowledge-store-facts
objective: "1.2.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a Genie Agent built on the following Unity Catalog tables:

    | Table | Configuration |
    | --- | --- |
    | wg_prod.hr.employees | A row filter limits rows by department. Column `salary` is not masked. |
    | wg_prod.hr.departments | Primary key on `dept_id`. |
    | wg_prod.hr.assignments | Foreign key on `dept_id` that references wg_prod.hr.departments. |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un Genie Agent construit sur les tables Unity Catalog suivantes :

    | Table | Configuration |
    | --- | --- |
    | wg_prod.hr.employees | Un filtre de lignes limite les lignes par service. La colonne `salary` n'est pas masquée. |
    | wg_prod.hr.departments | Clé primaire sur `dept_id`. |
    | wg_prod.hr.assignments | Clé étrangère sur `dept_id` qui référence wg_prod.hr.departments. |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Hiding the salary column in the Genie Agent removes the SELECT access of the agent's users to that column in Unity Catalog.
        fr: Masquer la colonne salary dans le Genie Agent retire aux utilisateurs de l'agent l'accès SELECT à cette colonne dans Unity Catalog.
    - id: s2
      text:
        en: Genie saves the relationship between assignments.dept_id and departments.dept_id as a join without you defining it.
        fr: Genie enregistre la relation entre assignments.dept_id et departments.dept_id comme jointure sans que vous la définissiez.
    - id: s3
      text:
        en: You can enable entity matching on the department column of wg_prod.hr.employees.
        fr: Vous pouvez activer la mise en correspondance d'entités (Entity matching) sur la colonne department de wg_prod.hr.employees.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Hidden columns are only removed from Genie's context; they stay in the table and permissions do not change. Primary and foreign keys defined in Unity Catalog are saved as join relationships automatically. Entity matching cannot be enabled on a table that has a row filter or column masks, and a row filter excludes the whole table from prompt matching.
    fr: Les colonnes masquées sont seulement retirées du contexte de Genie ; elles restent dans la table et les autorisations ne changent pas. Les clés primaires et étrangères définies dans Unity Catalog sont enregistrées automatiquement comme relations de jointure. La mise en correspondance d'entités ne peut pas être activée sur une table dotée d'un filtre de lignes ou de masques de colonne, et un filtre de lignes exclut toute la table de la correspondance des invites.
references:
  - title: Tune Genie Agent quality
    url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/tune-quality
