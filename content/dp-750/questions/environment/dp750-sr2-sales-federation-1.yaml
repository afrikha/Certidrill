id: dp750-sr2-sales-federation-1
objective: "1.2.6"
type: series_yesno
series: dp750-sr2-sales-federation
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You create a Lakeflow Connect ingestion pipeline for salesdb.
  fr: Vous créez un pipeline d'ingestion Lakeflow Connect pour salesdb.
body:
  solution:
    en: |
      You create a Lakeflow Connect **SQL Server** ingestion pipeline that loads `dbo.orders` and `dbo.customers` into tables of a catalog named `sales_raw`. Then you grant `sales-analysts` the `USE CATALOG`, `USE SCHEMA` and `SELECT` privileges on `sales_raw`.
    fr: |
      Vous créez un pipeline d'ingestion Lakeflow Connect **SQL Server** qui charge `dbo.orders` et `dbo.customers` dans des tables d'un catalogue nommé `sales_raw`. Vous accordez ensuite à `sales-analysts` les privilèges `USE CATALOG`, `USE SCHEMA` et `SELECT` sur `sales_raw`.
answer: { value: false }
explanation:
  correct:
    en: |
      The SQL Server connector of Lakeflow Connect is an ingestion tool: its pipeline extracts the rows from the source and writes copies of them to Unity Catalog tables. This breaks the requirement that the data must not be copied into Azure Databricks storage. Querying the source in place requires Lakehouse Federation with a connection and a foreign catalog.
    fr: |
      Le connecteur SQL Server de Lakeflow Connect est un outil d'ingestion : son pipeline extrait les lignes de la source et en écrit des copies dans des tables Unity Catalog. Cela enfreint l'exigence selon laquelle les données ne doivent pas être copiées dans le stockage Azure Databricks. Pour interroger la source sur place, il faut Lakehouse Federation avec une connexion et un catalogue étranger.
references:
