id: dp750-1a-environment-catalogs
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has dev, test and prod Azure Databricks workspaces in the West Europe region, and two business units named sales and marketing. You need to organize Unity Catalog objects so that each environment and business unit is isolated, following Databricks recommendations.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'espaces de travail Azure Databricks dev, test et prod dans la région West Europe, et de deux unités commerciales nommées sales et marketing. Vous devez organiser les objets Unity Catalog de sorte que chaque environnement et chaque unité commerciale soient isolés, en suivant les recommandations de Databricks.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Use the region's single metastore for all environments, and create catalogs named after the environment and business unit, such as dev_sales and prod_marketing.", fr: "Utiliser le metastore unique de la région pour tous les environnements et créer des catalogues nommés d'après l'environnement et l'unité commerciale, comme dev_sales et prod_marketing." } }
    - { id: b, text: { en: "Create one metastore per environment in West Europe, and create one catalog per business unit in each metastore.", fr: "Créer un metastore par environnement dans West Europe et créer un catalogue par unité commerciale dans chaque metastore." } }
    - { id: c, text: { en: "Assign the ownership of each production catalog to a group.", fr: "Attribuer la propriété de chaque catalogue de production à un groupe." } }
    - { id: d, text: { en: "Assign the ownership of each production catalog to the lead engineer of the business unit.", fr: "Attribuer la propriété de chaque catalogue de production à l'ingénieur principal de l'unité commerciale." } }
    - { id: e, text: { en: "Create the tables of each environment in hive_metastore, with the environment name as a table name prefix.", fr: "Créer les tables de chaque environnement dans hive_metastore, avec le nom de l'environnement comme préfixe des noms de tables." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Databricks recommends one metastore per region for all development lifecycle scopes and business units; catalogs are the primary unit of data isolation and often correspond to an environment, a team, a business unit or a combination of them. Ownership of production catalogs and schemas should always be assigned to groups, not individual users.
    fr: |
      Databricks recommande un metastore par région pour tous les environnements du cycle de développement et toutes les unités commerciales ; les catalogues sont la principale unité d'isolation des données et correspondent souvent à un environnement, une équipe, une unité commerciale ou une combinaison de ceux-ci. La propriété des catalogues et schémas de production doit toujours être attribuée à des groupes, pas à des utilisateurs individuels.
  options:
    b: { en: "Separation happens through catalogs inside the region's single metastore, not through several metastores.", fr: "La séparation se fait par des catalogues dans le metastore unique de la région, pas par plusieurs metastores." }
    d: { en: "Production ownership must go to groups, so that access doesn't depend on one person.", fr: "La propriété en production doit revenir à des groupes, pour que l'accès ne dépende pas d'une seule personne." }
    e: { en: "hive_metastore is the legacy catalog; a table name prefix provides no governance or isolation.", fr: "hive_metastore est le catalogue hérité ; un préfixe de nom de table n'apporte ni gouvernance ni isolation." }
references:
  - title: Unity Catalog best practices
    url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/best-practices
