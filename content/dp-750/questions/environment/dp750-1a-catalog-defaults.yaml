id: dp750-1a-catalog-defaults
objective: "1.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    At Proseware, you create a standard catalog named **sales_dev** in Catalog Explorer with a managed storage location. In the **Catalog created!** dialog, you select **View catalog**. Later, you change the catalog's managed location by running `ALTER CATALOG sales_dev SET MANAGED LOCATION`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Chez Proseware, vous créez un catalogue standard nommé **sales_dev** dans Catalog Explorer avec un emplacement de stockage managé. Dans la boîte de dialogue **Catalog created!**, vous sélectionnez **View catalog**. Plus tard, vous changez l'emplacement managé du catalogue en exécutant `ALTER CATALOG sales_dev SET MANAGED LOCATION`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: sales_dev contains a schema named default and a schema named information_schema.
        fr: sales_dev contient un schéma nommé default et un schéma nommé information_schema.
    - id: s2
      text:
        en: sales_dev is accessible only from the workspace in which you created it.
        fr: sales_dev n'est accessible que depuis l'espace de travail dans lequel vous l'avez créé.
    - id: s3
      text:
        en: The managed tables that existed before the ALTER CATALOG statement are moved to the new location.
        fr: Les tables managées qui existaient avant l'instruction ALTER CATALOG sont déplacées vers le nouvel emplacement.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Creating a catalog automatically creates the `default` and `information_schema` schemas. **View catalog** accepts the automatic configuration: the catalog is accessible from all workspaces attached to the metastore, and all account users get BROWSE. `ALTER CATALOG ... SET MANAGED LOCATION` affects only new managed tables and volumes; existing managed objects aren't moved.
    fr: |
      La création d'un catalogue crée automatiquement les schémas `default` et `information_schema`. **View catalog** accepte la configuration automatique : le catalogue est accessible depuis tous les espaces de travail attachés au metastore, et tous les utilisateurs du compte reçoivent BROWSE. `ALTER CATALOG ... SET MANAGED LOCATION` n'affecte que les nouvelles tables et les nouveaux volumes managés ; les objets managés existants ne sont pas déplacés.
references:
  - title: Create catalogs
    url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/create-catalog
  - title: Specify a managed storage location in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/managed-storage
