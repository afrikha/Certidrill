id: dp750-1b-ddl-rename-column
objective: "1.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an existing managed Delta table named **fabrikam_prod.silver.customers** that contains a column named `cust_nm`. Column mapping is not enabled on the table.

    You need to rename `cust_nm` to `customer_name`. The data files of the table must not be rewritten.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une table Delta managée existante nommée **fabrikam_prod.silver.customers** qui contient une colonne nommée `cust_nm`. Le mappage de colonnes n'est pas activé sur la table.

    Vous devez renommer `cust_nm` en `customer_name`. Les fichiers de données de la table ne doivent pas être réécrits.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE fabrikam_prod.silver.customers
      SET TBLPROPERTIES ('[[key]]' = '[[value]]');

    ALTER TABLE fabrikam_prod.silver.customers
      [[op]] cust_nm TO customer_name;
  slots:
    - id: key
      options:
        - { id: cdf, text: delta.enableChangeDataFeed }
        - { id: cm, text: delta.columnMapping.mode }
        - { id: dv, text: delta.enableDeletionVectors }
        - { id: rt, text: delta.enableRowTracking }
    - id: value
      options:
        - { id: id, text: id }
        - { id: none, text: none }
        - { id: name, text: name }
        - { id: tval, text: "true" }
    - id: op
      options:
        - { id: rename, text: RENAME COLUMN }
        - { id: alter, text: ALTER COLUMN }
        - { id: renameto, text: RENAME TO }
answer:
  values: { key: cm, value: name, op: rename }
explanation:
  correct:
    en: "Renaming a column of a Delta table without rewriting data files requires column mapping. On an existing table, you enable it with `'delta.columnMapping.mode' = 'name'`, then run `ALTER TABLE ... RENAME COLUMN old TO new`, which is a metadata-only change."
    fr: "Renommer une colonne d'une table Delta sans réécrire les fichiers de données exige le mappage de colonnes. Sur une table existante, vous l'activez avec `'delta.columnMapping.mode' = 'name'`, puis vous exécutez `ALTER TABLE ... RENAME COLUMN ancien TO nouveau`, une modification portant uniquement sur les métadonnées."
  options:
    cdf: { en: "The change data feed records row-level changes; it does not allow renaming columns.", fr: "Le flux de données modifiées enregistre les changements au niveau des lignes ; il ne permet pas de renommer des colonnes." }
    dv: { en: "Deletion vectors optimize deletes and updates; they are unrelated to column renaming.", fr: "Les vecteurs de suppression optimisent les suppressions et mises à jour ; ils n'ont aucun rapport avec le renommage de colonnes." }
    rt: { en: "Row tracking tracks row identity; it does not enable column renaming.", fr: "Le suivi des lignes suit l'identité des lignes ; il ne permet pas de renommer des colonnes." }
    id: { en: "The id mode can be set only when the table is created, not on an existing table.", fr: "Le mode id ne peut être défini qu'à la création de la table, pas sur une table existante." }
    none: { en: "none is the default value, which means column mapping is disabled.", fr: "none est la valeur par défaut, qui signifie que le mappage de colonnes est désactivé." }
    alter: { en: "ALTER COLUMN changes properties of a column such as its comment or default; it does not rename it.", fr: "ALTER COLUMN modifie des propriétés d'une colonne, comme son commentaire ou sa valeur par défaut ; il ne la renomme pas." }
    renameto: { en: "RENAME TO renames the table, not a column.", fr: "RENAME TO renomme la table, pas une colonne." }
references:
  - title: Rename and drop columns with Delta Lake column mapping
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/column-mapping
  - title: ALTER TABLE
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-alter-table
