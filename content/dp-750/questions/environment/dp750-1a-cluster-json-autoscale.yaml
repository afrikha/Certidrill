id: dp750-1a-cluster-json-autoscale
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You use the Clusters API to create a classic compute resource named **etl-orders**. The compute must meet the following requirements:

    - Scale automatically between 2 and 8 workers.
    - Terminate after 45 minutes of inactivity.
    - Draw its worker nodes from an existing instance pool.

    How should you complete the request body? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez l'API Clusters pour créer une ressource de calcul classique nommée **etl-orders**. Le calcul doit répondre aux exigences suivantes :

    - Se mettre à l'échelle automatiquement entre 2 et 8 workers.
    - S'arrêter après 45 minutes d'inactivité.
    - Prendre ses nœuds workers dans un pool d'instances existant.

    Comment devez-vous compléter le corps de la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "cluster_name": "etl-orders",
      "spark_version": "<lts-runtime-version>",
      [[pool]]: "<pool-id>",
      [[scale]],
      [[term]]
    }
  slots:
    - id: pool
      options:
        - { id: inst, text: '"instance_pool_id"' }
        - { id: drv, text: '"driver_instance_pool_id"' }
        - { id: node, text: '"node_type_id"' }
    - id: scale
      options:
        - { id: num, text: '"num_workers": 8' }
        - { id: auto, text: '"autoscale": { "min_workers": 2, "max_workers": 8 }' }
        - { id: zero, text: '"autoscale": { "min_workers": 0, "max_workers": 8 }' }
    - id: term
      options:
        - { id: stop, text: '"auto_stop_mins": 45' }
        - { id: zeroterm, text: '"autotermination_minutes": 0' }
        - { id: autot, text: '"autotermination_minutes": 45' }
answer:
  values: { pool: inst, scale: auto, term: autot }
explanation:
  correct:
    en: |
      `instance_pool_id` sets the pool used by the workers (`driver_instance_pool_id` sets the driver's pool). The `autoscale` object with `min_workers` and `max_workers` enables autoscaling between the two bounds. `autotermination_minutes` sets the inactivity period, which must be between 10 and 10,000 minutes.
    fr: |
      `instance_pool_id` définit le pool utilisé par les workers (`driver_instance_pool_id` définit celui du pilote). L'objet `autoscale` avec `min_workers` et `max_workers` active la mise à l'échelle automatique entre les deux limites. `autotermination_minutes` définit la période d'inactivité, qui doit être comprise entre 10 et 10 000 minutes.
  options:
    drv: { en: "driver_instance_pool_id applies to the driver node only, not to the workers.", fr: "driver_instance_pool_id s'applique uniquement au nœud pilote, pas aux workers." }
    node: { en: "node_type_id expects a VM instance type, not a pool ID.", fr: "node_type_id attend un type d'instance de machine virtuelle, pas un ID de pool." }
    num: { en: "num_workers sets a fixed size; it doesn't enable autoscaling.", fr: "num_workers définit une taille fixe ; il n'active pas la mise à l'échelle automatique." }
    zero: { en: "The minimum must be 2, and multi-node compute can't scale to 0 workers.", fr: "Le minimum doit être 2, et un calcul multinœud ne peut pas descendre à 0 worker." }
    stop: { en: "auto_stop_mins is the Auto Stop setting of the SQL Warehouses API, not of the Clusters API.", fr: "auto_stop_mins est le paramètre Auto Stop de l'API SQL Warehouses, pas de l'API Clusters." }
    zeroterm: { en: "A value of 0 disables automatic termination.", fr: "La valeur 0 désactive l'arrêt automatique." }
references:
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
  - title: Manage classic compute
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage
