id: dp750-1b-volume-drop-behavior
objective: "1.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum has the following Unity Catalog volumes in the schema **adatum_dev.scratch**:

    | Volume | Type | Storage |
    | --- | --- | --- |
    | vol_images | Managed | Managed location of the schema |
    | vol_partner | External | `abfss://partner@stadatum.dfs.core.windows.net/in` |

    Both volumes contain files. You plan to run `DROP VOLUME` for each volume.

    What happens to the files of each volume? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose des volumes Unity Catalog suivants dans le schéma **adatum_dev.scratch** :

    | Volume | Type | Stockage |
    | --- | --- | --- |
    | vol_images | Managé | Emplacement managé du schéma |
    | vol_partner | Externe | `abfss://partner@stadatum.dfs.core.windows.net/in` |

    Les deux volumes contiennent des fichiers. Vous prévoyez d'exécuter `DROP VOLUME` pour chaque volume.

    Qu'advient-il des fichiers de chaque volume ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      vol_images: [[managed]]

      vol_partner: [[external]]
    fr: |
      vol_images : [[managed]]

      vol_partner : [[external]]
  slots:
    - id: managed
      options:
        - { id: kept, text: { en: "The files remain in cloud storage.", fr: "Les fichiers restent dans le stockage cloud." } }
        - { id: marked, text: { en: "The files are marked for deletion and removed after a 7-day retention period.", fr: "Les fichiers sont marqués pour suppression et retirés après une période de rétention de 7 jours." } }
        - { id: fails, text: { en: "The drop fails until you delete the files.", fr: "La suppression échoue tant que vous n'avez pas supprimé les fichiers." } }
        - { id: moved, text: { en: "The files are moved to the managed location of the catalog.", fr: "Les fichiers sont déplacés vers l'emplacement managé du catalogue." } }
    - id: external
      options:
        - { id: kept, text: { en: "The files remain in cloud storage.", fr: "Les fichiers restent dans le stockage cloud." } }
        - { id: marked, text: { en: "The files are marked for deletion and removed after a 7-day retention period.", fr: "Les fichiers sont marqués pour suppression et retirés après une période de rétention de 7 jours." } }
        - { id: fails, text: { en: "The drop fails until you delete the files.", fr: "La suppression échoue tant que vous n'avez pas supprimé les fichiers." } }
        - { id: moved, text: { en: "The files are moved to the managed location of the catalog.", fr: "Les fichiers sont déplacés vers l'emplacement managé du catalogue." } }
answer:
  values: { managed: marked, external: kept }
explanation:
  correct:
    en: Unity Catalog manages the layout and deletion of managed volumes, so dropping vol_images marks its files for deletion, with a 7-day retention. Dropping an external volume removes only the Unity Catalog object; the files of vol_partner stay in the ADLS Gen2 path.
    fr: Unity Catalog gère l'organisation et la suppression des volumes managés ; la suppression de vol_images marque donc ses fichiers pour suppression, avec une rétention de 7 jours. La suppression d'un volume externe ne retire que l'objet Unity Catalog ; les fichiers de vol_partner restent dans le chemin ADLS Gen2.
references:
  - title: What are Unity Catalog volumes?
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/
  - title: Create and manage Unity Catalog volumes
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/utility-commands
