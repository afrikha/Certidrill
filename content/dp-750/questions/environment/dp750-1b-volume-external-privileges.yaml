id: dp750-1b-volume-external-privileges
objective: "1.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has an external location named **loc-landing** that covers the path `abfss://landing@stwoodgrove.dfs.core.windows.net/`. A data engineer named User1 must create an external volume named **wg_prod.bronze.landing_files** on a directory of this path. User1 already has USE CATALOG on wg_prod and USE SCHEMA on wg_prod.bronze.

    You need to grant User1 the additional privileges required. The solution must follow the principle of least privilege.

    Which two privileges should you grant? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un emplacement externe nommé **loc-landing** qui couvre le chemin `abfss://landing@stwoodgrove.dfs.core.windows.net/`. Un ingénieur données nommé User1 doit créer un volume externe nommé **wg_prod.bronze.landing_files** sur un répertoire de ce chemin. User1 dispose déjà de USE CATALOG sur wg_prod et de USE SCHEMA sur wg_prod.bronze.

    Vous devez accorder à User1 les privilèges supplémentaires nécessaires. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux privilèges à accorder ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "CREATE EXTERNAL TABLE on loc-landing", fr: "CREATE EXTERNAL TABLE sur loc-landing" } }
    - { id: b, text: { en: "CREATE MANAGED STORAGE on loc-landing", fr: "CREATE MANAGED STORAGE sur loc-landing" } }
    - { id: c, text: { en: "CREATE EXTERNAL VOLUME on loc-landing", fr: "CREATE EXTERNAL VOLUME sur loc-landing" } }
    - { id: d, text: { en: "CREATE TABLE on wg_prod.bronze", fr: "CREATE TABLE sur wg_prod.bronze" } }
    - { id: e, text: { en: "CREATE VOLUME on wg_prod.bronze", fr: "CREATE VOLUME sur wg_prod.bronze" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: Every volume, managed or external, requires CREATE VOLUME on the parent schema in addition to USE CATALOG and USE SCHEMA. An external volume also requires CREATE EXTERNAL VOLUME on the external location that covers its LOCATION path.
    fr: Tout volume, managé ou externe, exige CREATE VOLUME sur le schéma parent, en plus de USE CATALOG et USE SCHEMA. Un volume externe exige aussi CREATE EXTERNAL VOLUME sur l'emplacement externe qui couvre son chemin LOCATION.
  options:
    a:
      en: CREATE EXTERNAL TABLE allows external tables on the location, not external volumes.
      fr: CREATE EXTERNAL TABLE permet des tables externes sur l'emplacement, pas des volumes externes.
    b:
      en: CREATE MANAGED STORAGE is needed to set a managed location for a catalog or schema.
      fr: CREATE MANAGED STORAGE sert à définir l'emplacement managé d'un catalogue ou d'un schéma.
    d:
      en: CREATE TABLE allows tables and views in the schema, not volumes.
      fr: CREATE TABLE permet de créer des tables et des vues dans le schéma, pas des volumes.
references:
  - title: Privileges for Unity Catalog volumes
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/privileges
  - title: Create and manage Unity Catalog volumes
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/utility-commands
