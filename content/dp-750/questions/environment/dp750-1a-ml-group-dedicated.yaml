id: dp750-1a-ml-group-dedicated
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data scientist at Adatum named Kim trains deep learning models. Kim needs a classic all-purpose compute resource that runs on GPUs, provides popular machine learning libraries without installing them, and reads the feature tables in `adatum_prod.ml.features` through Unity Catalog.

    Only Kim uses the compute resource.

    What should you do?
  fr: |
    Une scientifique des données d'Adatum nommée Kim entraîne des modèles de deep learning. Kim a besoin d'une ressource de calcul polyvalent classique qui s'exécute sur des GPU, fournit des bibliothèques de Machine Learning courantes sans les installer et lit les tables de caractéristiques de `adatum_prod.ml.features` via Unity Catalog.

    Seule Kim utilise la ressource de calcul.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select Machine learning, choose a GPU worker type, and set the access mode to Standard.", fr: "Sélectionner Machine learning, choisir un type de worker GPU et définir le mode d'accès sur Standard." } }
    - { id: b, text: { en: "Select Machine learning, choose a GPU worker type, and assign the Dedicated access mode to Kim.", fr: "Sélectionner Machine learning, choisir un type de worker GPU et attribuer le mode d'accès Dedicated à Kim." } }
    - { id: c, text: { en: "Select Machine learning, choose a general-purpose worker type, and assign the Dedicated access mode to Kim.", fr: "Sélectionner Machine learning, choisir un type de worker à usage général et attribuer le mode d'accès Dedicated à Kim." } }
    - { id: d, text: { en: "Select Machine learning, choose a GPU worker type, and set the access mode to No isolation shared.", fr: "Sélectionner Machine learning, choisir un type de worker GPU et définir le mode d'accès sur No isolation shared." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Databricks Runtime ML includes popular machine learning libraries, so nothing has to be installed. Selecting **Machine learning** sets the access mode to Dedicated with your account as the dedicated user; assign it to Kim, because Databricks Runtime ML reads Unity Catalog data only in dedicated access mode. For GPU-based compute, you select a GPU-enabled instance type as the worker type.
    fr: |
      Databricks Runtime ML inclut des bibliothèques de Machine Learning courantes : rien n'est à installer. Sélectionner **Machine learning** définit le mode d'accès sur Dedicated avec votre compte comme utilisateur dédié ; attribuez-le à Kim, car Databricks Runtime ML ne lit les données Unity Catalog qu'en mode d'accès dédié. Pour un calcul GPU, vous sélectionnez un type d'instance avec GPU comme type de worker.
  options:
    a: { en: "Databricks Runtime ML isn't supported in standard access mode.", fr: "Databricks Runtime ML n'est pas pris en charge en mode d'accès standard." }
    c: { en: "A general-purpose worker type has no GPU, so the training doesn't run on GPUs.", fr: "Un type de worker à usage général n'a pas de GPU : l'entraînement ne s'exécute pas sur des GPU." }
    d: { en: "No isolation shared is a legacy mode that isn't recommended and doesn't give Unity Catalog access.", fr: "No isolation shared est un mode hérité, non recommandé, qui ne donne pas accès à Unity Catalog." }
references:
  - title: Databricks Runtime for Machine Learning
    url: https://learn.microsoft.com/en-us/azure/databricks/machine-learning/databricks-runtime-ml
