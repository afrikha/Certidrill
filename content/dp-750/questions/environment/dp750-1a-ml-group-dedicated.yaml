id: dp750-1a-ml-group-dedicated
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Four data scientists at Adatum are members of a group named **ds-team**. They need to share one classic all-purpose compute resource that runs Databricks Runtime for Machine Learning and reads the feature tables in `adatum_prod.ml.features` through Unity Catalog.

    The solution must minimize the number of compute resources and the administrative effort.

    What should you do?
  fr: |
    Quatre scientifiques des données d'Adatum sont membres d'un groupe nommé **ds-team**. Ils doivent partager une ressource de calcul polyvalent classique qui exécute Databricks Runtime pour Machine Learning et lit les tables de caractéristiques de `adatum_prod.ml.features` via Unity Catalog.

    La solution doit réduire au minimum le nombre de ressources de calcul et l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create one compute resource with Machine learning selected, and set the access mode to Standard.", fr: "Créer une ressource de calcul avec Machine learning sélectionné et définir le mode d'accès sur Standard." } }
    - { id: b, text: { en: "Create one compute resource with Machine learning selected, and assign the dedicated compute to ds-team.", fr: "Créer une ressource de calcul avec Machine learning sélectionné et attribuer le calcul dédié à ds-team." } }
    - { id: c, text: { en: "Create four compute resources with Machine learning selected, each one dedicated to one data scientist.", fr: "Créer quatre ressources de calcul avec Machine learning sélectionné, chacune dédiée à un scientifique des données." } }
    - { id: d, text: { en: "Create one compute resource with Machine learning selected, and set the access mode to No isolation shared.", fr: "Créer une ressource de calcul avec Machine learning sélectionné et définir le mode d'accès sur No isolation shared." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Selecting **Machine learning** sets the access mode to Dedicated, which Databricks Runtime ML requires to access Unity Catalog data. Dedicated compute can be assigned to a group instead of a single user, so the four members of ds-team share one resource, with their permissions down-scoped to the group's permissions.
    fr: |
      Sélectionner **Machine learning** définit le mode d'accès sur Dedicated, que Databricks Runtime ML exige pour accéder aux données Unity Catalog. Un calcul dédié peut être attribué à un groupe au lieu d'un seul utilisateur : les quatre membres de ds-team partagent une seule ressource, avec des autorisations réduites à celles du groupe.
  options:
    a: { en: "Databricks Runtime ML isn't supported in standard access mode.", fr: "Databricks Runtime ML n'est pas pris en charge en mode d'accès standard." }
    c: { en: "Four resources work but don't minimize the number of compute resources or the administrative effort.", fr: "Quatre ressources fonctionnent mais ne réduisent au minimum ni le nombre de ressources de calcul ni l'effort d'administration." }
    d: { en: "No isolation shared is a legacy mode that isn't recommended and doesn't give Unity Catalog access.", fr: "No isolation shared est un mode hérité, non recommandé, qui ne donne pas accès à Unity Catalog." }
references:
  - title: Databricks Runtime for Machine Learning
    url: https://learn.microsoft.com/en-us/azure/databricks/machine-learning/databricks-runtime-ml
