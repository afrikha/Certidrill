id: dp750-1a-bundle-dev-prefix
objective: "1.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware's data engineers deploy their jobs with Declarative Automation Bundles. The bundle defines a target named **dev** with `mode: development` and a target named **prod** with `mode: production`.

    A developer whose short name is **ana** runs `databricks bundle deploy -t dev`. The bundle contains a job named **orders-ingest** and the notebooks that the job runs.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Les ingénieurs données de Litware déploient leurs jobs avec Declarative Automation Bundles. Le bundle définit une cible nommée **dev** avec `mode: development` et une cible nommée **prod** avec `mode: production`.

    Une développeuse dont le nom court est **ana** exécute `databricks bundle deploy -t dev`. Le bundle contient un job nommé **orders-ingest** et les notebooks que le job exécute.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The deployed job is named [dev ana] orders-ingest.", fr: "Le job déployé est nommé [dev ana] orders-ingest." } }
    - { id: b, text: { en: "The deployed notebooks are renamed with the [dev ana] prefix.", fr: "Les notebooks déployés sont renommés avec le préfixe [dev ana]." } }
    - { id: c, text: { en: "Setting presets.name_prefix in the dev target replaces the default [dev ana] prefix.", fr: "Définir presets.name_prefix dans la cible dev remplace le préfixe par défaut [dev ana]." } }
    - { id: d, text: { en: "If the dev target sets both mode and presets, the settings of the mode override the presets.", fr: "Si la cible dev définit à la fois mode et presets, les paramètres du mode remplacent les presets." } }
    - { id: e, text: { en: "The schedule of the deployed job stays active in the dev target.", fr: "La planification du job déployé reste active dans la cible dev." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      In development mode, the bundle prepends `[dev ${workspace.current_user.short_name}]` to the names of resources that aren't deployed as files or notebooks, and tags jobs and pipelines with `dev`, so several developers can deploy the same job side by side. The `name_prefix` preset replaces that default prefix, because presets override the mode defaults.
    fr: |
      En mode développement, le bundle ajoute `[dev ${workspace.current_user.short_name}]` au début du nom des ressources qui ne sont pas déployées sous forme de fichiers ou de notebooks, et étiquette les jobs et pipelines avec `dev` : plusieurs développeurs peuvent ainsi déployer le même job côte à côte. Le preset `name_prefix` remplace ce préfixe par défaut, car les presets l'emportent sur les valeurs par défaut du mode.
  options:
    b: { en: "The prefix applies only to resources that aren't deployed as files or notebooks.", fr: "Le préfixe ne s'applique qu'aux ressources qui ne sont pas déployées sous forme de fichiers ou de notebooks." }
    d: { en: "Presets override the mode defaults, and individual resource settings override presets.", fr: "Les presets l'emportent sur les valeurs par défaut du mode, et les paramètres de chaque ressource l'emportent sur les presets." }
    e: { en: "Development mode pauses all schedules and triggers unless pause_status is set to UNPAUSED.", fr: "Le mode développement suspend toutes les planifications et tous les déclencheurs, sauf si pause_status vaut UNPAUSED." }
references:
  - title: Declarative Automation Bundles deployment modes
    url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
