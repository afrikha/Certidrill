id: dp750-1a-create-catalog-clauses
objective: "1.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum deploys Unity Catalog objects with SQL scripts that run on a SQL warehouse. You are writing the `CREATE CATALOG` statement for a catalog named **prod_hr**, which must meet four requirements.

    Which clause should you use for each requirement? To answer, drag the appropriate clauses to the correct requirements. Each clause may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie ses objets Unity Catalog avec des scripts SQL exécutés sur un entrepôt SQL. Vous écrivez l'instruction `CREATE CATALOG` d'un catalogue nommé **prod_hr**, qui doit répondre à quatre exigences.

    Quelle clause devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les clauses appropriées vers les exigences correspondantes. Chaque clause peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: loc, text: MANAGED LOCATION }
    - { id: ine, text: IF NOT EXISTS }
    - { id: coll, text: DEFAULT COLLATION }
    - { id: comment, text: COMMENT }
    - { id: share, text: USING SHARE }
    - { id: conn, text: USING CONNECTION }
  targets:
    - { id: t1, text: { en: "Store the catalog's managed tables in abfss://hr@stadatumhr.dfs.core.windows.net/managed", fr: "Stocker les tables managées du catalogue dans abfss://hr@stadatumhr.dfs.core.windows.net/managed" } }
    - { id: t2, text: { en: "Rerunning the script must not raise an error when the catalog already exists", fr: "Réexécuter le script ne doit pas déclencher d'erreur lorsque le catalogue existe déjà" } }
    - { id: t3, text: { en: "String comparisons in the objects of the catalog must be case-insensitive by default", fr: "Les comparaisons de chaînes dans les objets du catalogue doivent être insensibles à la casse par défaut" } }
    - { id: t4, text: { en: "Catalog Explorer must display a description of the catalog", fr: "Catalog Explorer doit afficher une description du catalogue" } }
answer:
  mapping: { t1: loc, t2: ine, t3: coll, t4: comment }
explanation:
  correct:
    en: |
      `MANAGED LOCATION` sets the managed storage of the catalog within an external location. `IF NOT EXISTS` makes the statement do nothing when the catalog exists. `DEFAULT COLLATION`, for example `UNICODE_CI_AI`, sets the default collation for objects defined in the catalog; without it, the default is `UTF8_BINARY`. `COMMENT` stores the catalog's description.
    fr: |
      `MANAGED LOCATION` définit le stockage managé du catalogue dans un emplacement externe. `IF NOT EXISTS` fait que l'instruction ne fait rien lorsque le catalogue existe. `DEFAULT COLLATION`, par exemple `UNICODE_CI_AI`, définit le classement par défaut des objets définis dans le catalogue ; sans cette clause, la valeur par défaut est `UTF8_BINARY`. `COMMENT` enregistre la description du catalogue.
  options:
    share: { en: "USING SHARE creates a shared catalog from a provider's share.", fr: "USING SHARE crée un catalogue partagé à partir du partage d'un fournisseur." }
    conn: { en: "USING CONNECTION belongs to CREATE FOREIGN CATALOG for Lakehouse Federation.", fr: "USING CONNECTION appartient à CREATE FOREIGN CATALOG pour Lakehouse Federation." }
references:
  - title: CREATE CATALOG
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-catalog
