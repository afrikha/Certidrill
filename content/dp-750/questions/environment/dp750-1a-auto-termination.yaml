id: dp750-1a-auto-termination
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an all-purpose compute resource named **dev-analytics** in a workspace named **adb-adatum-dev**. Users often leave dev-analytics running overnight without running any command, which generates charges.

    You need dev-analytics to stop automatically after 30 minutes without activity. The solution must not affect the compute while users are running commands.

    What should you configure?
  fr: |
    Adatum dispose d'une ressource de calcul polyvalent nommée **dev-analytics** dans un espace de travail nommé **adb-adatum-dev**. Les utilisateurs laissent souvent dev-analytics en marche la nuit sans exécuter aucune commande, ce qui génère des frais.

    Vous devez faire en sorte que dev-analytics s'arrête automatiquement après 30 minutes sans activité. La solution ne doit pas affecter le calcul pendant que les utilisateurs exécutent des commandes.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Autoscaling with a minimum of one worker", fr: "La mise à l'échelle automatique avec un minimum d'un worker" } }
    - { id: b, text: { en: "Automatic termination after 30 minutes of inactivity", fr: "L'arrêt automatique après 30 minutes d'inactivité" } }
    - { id: c, text: { en: "Spot instances for the worker nodes", fr: "Des instances spot pour les nœuds workers" } }
    - { id: d, text: { en: "A compute policy that limits the DBUs per hour", fr: "Une stratégie de calcul qui limite les DBU par heure" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Automatic termination stops the compute when the time since the last command exceeds the inactivity period that you set, in minutes. The period must be between 10 and 10,000 minutes, and setting it to 0 or clearing the check box disables it.
    fr: |
      L'arrêt automatique arrête le calcul lorsque le temps écoulé depuis la dernière commande dépasse la période d'inactivité définie, en minutes. La période doit être comprise entre 10 et 10 000 minutes ; la valeur 0 ou la case décochée la désactive.
  options:
    a: { en: "Autoscaling changes the number of workers but never stops the driver, so the compute keeps running.", fr: "La mise à l'échelle automatique modifie le nombre de workers mais n'arrête jamais le pilote : le calcul reste en marche." }
    c: { en: "Spot instances lower the price of workers but don't stop idle compute.", fr: "Les instances spot réduisent le prix des workers mais n'arrêtent pas un calcul inactif." }
    d: { en: "A DBU-per-hour limit restricts the size of compute that users can create; it doesn't stop idle compute.", fr: "Une limite de DBU par heure restreint la taille du calcul que les utilisateurs peuvent créer ; elle n'arrête pas un calcul inactif." }
references:
  - title: Manage classic compute
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage
