id: dp750-1b-ddl-undrop-table
objective: "1.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Two days ago, a developer accidentally ran `DROP TABLE` on the managed Delta table **contoso_prod.silver.invoices**. No table with that name has been created since then. The recovery period of the catalog and the schema has never been changed.

    You need to restore the table, including its data and its granted privileges, with the least effort.

    Which statement should you run?
  fr: |
    Il y a deux jours, un développeur a exécuté par erreur `DROP TABLE` sur la table Delta managée **contoso_prod.silver.invoices**. Aucune table portant ce nom n'a été créée depuis. La période de récupération du catalogue et du schéma n'a jamais été modifiée.

    Vous devez restaurer la table, y compris ses données et ses privilèges accordés, avec le moins d'effort possible.

    Quelle instruction devez-vous exécuter ?
body:
  options:
    - { id: a, text: "RESTORE TABLE contoso_prod.silver.invoices TO VERSION AS OF 0" }
    - { id: b, text: "UNDROP TABLE contoso_prod.silver.invoices" }
    - { id: c, text: "CREATE TABLE contoso_prod.silver.invoices CLONE contoso_prod.silver.invoices VERSION AS OF 0" }
    - { id: d, text: "MSCK REPAIR TABLE contoso_prod.silver.invoices SYNC METADATA" }
answer: { optionId: b }
explanation:
  correct:
    en: UNDROP TABLE recovers a dropped Unity Catalog table during its recovery period, which is 7 days by default. The table is restored with its privileges, column specification and properties (primary and foreign key constraints must be recreated).
    fr: UNDROP TABLE récupère une table Unity Catalog supprimée pendant sa période de récupération, de 7 jours par défaut. La table est restaurée avec ses privilèges, sa spécification de colonnes et ses propriétés (les contraintes de clé primaire et étrangère doivent être recréées).
  options:
    a:
      en: RESTORE rolls an existing Delta table back to an earlier version; it cannot act on a table that has been dropped.
      fr: RESTORE ramène une table Delta existante à une version antérieure ; il ne peut pas agir sur une table supprimée.
    c:
      en: A clone needs an existing source table, and the dropped table no longer exists in the catalog.
      fr: Un clone exige une table source existante, et la table supprimée n'existe plus dans le catalogue.
    d:
      en: MSCK REPAIR TABLE ... SYNC METADATA synchronizes the metadata of an existing table; it does not recover a dropped one.
      fr: MSCK REPAIR TABLE ... SYNC METADATA synchronise les métadonnées d'une table existante ; il ne récupère pas une table supprimée.
references:
