id: dp750-1a-classic-job-cluster
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Databricks workspace named **adb-contoso-prod** in a region where serverless compute for jobs isn't available.

    A Lakeflow job named **nightly-sales** runs a Python notebook that writes to `contoso_prod.sales.daily_totals`. The notebook task currently runs on an all-purpose compute resource named **etl-interactive**, which the engineering team keeps running during the day.

    You need to change the compute used by the task. The solution must minimize cost and follow Databricks recommendations for production jobs.

    What should you use?
  fr: |
    Contoso dispose d'un espace de travail Azure Databricks nommé **adb-contoso-prod** dans une région où le calcul serverless pour les jobs n'est pas disponible.

    Un job Lakeflow nommé **nightly-sales** exécute un notebook Python qui écrit dans `contoso_prod.sales.daily_totals`. La tâche de notebook s'exécute actuellement sur une ressource de calcul polyvalent (all-purpose) nommée **etl-interactive**, que l'équipe d'ingénierie laisse en marche pendant la journée.

    Vous devez changer le calcul utilisé par la tâche. La solution doit réduire les coûts au minimum et suivre les recommandations de Databricks pour les jobs de production.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A classic jobs compute resource defined in the job", fr: "Une ressource de calcul de jobs classique définie dans le job" } }
    - { id: b, text: { en: "etl-interactive with automatic termination set to 10 minutes", fr: "etl-interactive avec un arrêt automatique fixé à 10 minutes" } }
    - { id: c, text: { en: "A pro SQL warehouse dedicated to the job", fr: "Un entrepôt SQL pro dédié au job" } }
    - { id: d, text: { en: "A compute resource created from the Personal Compute policy", fr: "Une ressource de calcul créée à partir de la stratégie Personal Compute" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Classic jobs compute is configured as part of the job definition. A compute resource used by a single task starts when the task run begins and terminates when the task finishes, so you pay only for the run. Databricks doesn't recommend all-purpose compute for production jobs.
    fr: |
      Le calcul de jobs classique est configuré dans la définition du job. Une ressource de calcul utilisée par une seule tâche démarre au début de l'exécution de la tâche et s'arrête à la fin de celle-ci : vous ne payez que l'exécution. Databricks ne recommande pas le calcul polyvalent pour les jobs de production.
  options:
    b: { en: "etl-interactive is all-purpose compute, which Databricks doesn't recommend for production jobs, and it keeps running for the team during the day.", fr: "etl-interactive est un calcul polyvalent, que Databricks ne recommande pas pour les jobs de production, et il reste en marche pour l'équipe pendant la journée." }
    c: { en: "SQL warehouses run SQL and dbt tasks; they can't run a Python notebook.", fr: "Les entrepôts SQL exécutent des tâches SQL et dbt ; ils ne peuvent pas exécuter un notebook Python." }
    d: { en: "Personal Compute creates single-machine all-purpose compute for an individual user's interactive work, not compute for production jobs.", fr: "Personal Compute crée un calcul polyvalent sur une seule machine pour le travail interactif d'un utilisateur, pas un calcul pour les jobs de production." }
references:
  - title: Configure compute for jobs
    url: https://learn.microsoft.com/en-us/azure/databricks/jobs/compute
