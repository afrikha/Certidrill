id: dp750-1b-ddl-add-column-privilege
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The group **grp-platform** owns the managed table **tailspin_prod.silver.bookings**. A data engineer named User1 must run the following statement on the table:

    ```sql
    ALTER TABLE tailspin_prod.silver.bookings ADD COLUMNS (loyalty_tier STRING);
    ```

    User1 has USE CATALOG on tailspin_prod, USE SCHEMA on tailspin_prod.silver, and SELECT on the table. You need to grant User1 one additional privilege on the table. The solution must follow the principle of least privilege.

    Which privilege should you grant?
  fr: |
    Le groupe **grp-platform** est propriétaire de la table managée **tailspin_prod.silver.bookings**. Un ingénieur données nommé User1 doit exécuter l'instruction suivante sur la table :

    ```sql
    ALTER TABLE tailspin_prod.silver.bookings ADD COLUMNS (loyalty_tier STRING);
    ```

    User1 dispose de USE CATALOG sur tailspin_prod, de USE SCHEMA sur tailspin_prod.silver et de SELECT sur la table. Vous devez accorder à User1 un privilège supplémentaire sur la table. La solution doit respecter le principe du moindre privilège.

    Quel privilège devez-vous accorder ?
body:
  options:
    - { id: a, text: MANAGE }
    - { id: b, text: ALL PRIVILEGES }
    - { id: c, text: APPLY TAG }
    - { id: d, text: MODIFY }
answer: { optionId: d }
explanation:
  correct:
    en: In Unity Catalog, ADD COLUMN, ALTER COLUMN, DROP COLUMN and SET or UNSET TBLPROPERTIES require the MODIFY privilege on the table, together with SELECT, USE SCHEMA and USE CATALOG.
    fr: Dans Unity Catalog, ADD COLUMN, ALTER COLUMN, DROP COLUMN et SET ou UNSET TBLPROPERTIES exigent le privilège MODIFY sur la table, avec SELECT, USE SCHEMA et USE CATALOG.
  options:
    a:
      en: MANAGE lets a principal manage privileges, change the owner, rename and drop the table; it is not the privilege that ADD COLUMN requires.
      fr: MANAGE permet de gérer les privilèges, de changer le propriétaire, de renommer et de supprimer la table ; ce n'est pas le privilège qu'exige ADD COLUMN.
    b:
      en: ALL PRIVILEGES includes MODIFY but grants far more than needed.
      fr: ALL PRIVILEGES inclut MODIFY mais accorde bien plus que nécessaire.
    c:
      en: APPLY TAG lets a principal add or remove tags; it does not allow schema changes.
      fr: APPLY TAG permet d'ajouter ou de supprimer des balises ; il ne permet pas de modifier le schéma de la table.
references:
  - title: ALTER TABLE
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-alter-table
