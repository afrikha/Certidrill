id: dp750-1a-autoscale-resize
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A classic compute resource named **etl-batch** has a fixed size of 12 workers.

    You edit etl-batch, select **Enable autoscaling**, set **Min** to 5 and **Max** to 10, and save the configuration.

    What happens to the number of workers of etl-batch?
  fr: |
    Une ressource de calcul classique nommée **etl-batch** a une taille fixe de 12 workers.

    Vous modifiez etl-batch, sélectionnez **Enable autoscaling**, définissez **Min** sur 5 et **Max** sur 10, puis enregistrez la configuration.

    Qu'advient-il du nombre de workers d'etl-batch ?
body:
  options:
    - { id: a, text: { en: "It stays at 12 until the next time etl-batch is restarted.", fr: "Il reste à 12 jusqu'au prochain redémarrage d'etl-batch." } }
    - { id: b, text: { en: "It drops to 5 immediately, then grows with the load.", fr: "Il descend immédiatement à 5, puis augmente selon la charge." } }
    - { id: c, text: { en: "It stays at 12 because the edit is rejected.", fr: "Il reste à 12, car la modification est refusée." } }
    - { id: d, text: { en: "It drops to 10 immediately.", fr: "Il descend immédiatement à 10." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When you reconfigure static compute to autoscale, Azure Databricks immediately resizes it to fit within the minimum and maximum bounds. An initial size of 12 with bounds of 5 to 10 drops to 10; a size of 3 would rise to 5, and a size of 6 would stay at 6.
    fr: |
      Lorsque vous reconfigurez un calcul statique pour qu'il se mette à l'échelle automatiquement, Azure Databricks le redimensionne immédiatement dans les limites minimale et maximale. Une taille initiale de 12 avec des limites de 5 à 10 descend à 10 ; une taille de 3 monterait à 5, et une taille de 6 resterait à 6.
  options:
    a: { en: "The resize into the new bounds is immediate; it doesn't wait for a restart.", fr: "Le redimensionnement dans les nouvelles limites est immédiat ; il n'attend pas de redémarrage." }
    b: { en: "The compute is resized only as far as the nearest bound, so 12 becomes 10, not 5.", fr: "Le calcul est redimensionné seulement jusqu'à la limite la plus proche : 12 devient 10, pas 5." }
    c: { en: "A current size outside the bounds doesn't block the change; the compute is resized to fit.", fr: "Une taille actuelle hors limites ne bloque pas la modification ; le calcul est redimensionné pour s'y conformer." }
references:
  - title: Compute configuration reference
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
