id: dp750-1a-pip-restart
objective: "1.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A Python notebook at Northwind needs version 2.0 of an internal package stored as a wheel in workspace files. The package must be available only to this notebook, not to the other notebooks attached to the same compute resource.

    After the installation, the notebook must see the new package before it imports it.

    How should you complete the notebook? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un notebook Python de Northwind a besoin de la version 2.0 d'un package interne stocké sous forme de roue (wheel) dans les fichiers de l'espace de travail. Le package doit être disponible uniquement pour ce notebook, et non pour les autres notebooks attachés à la même ressource de calcul.

    Après l'installation, le notebook doit voir le nouveau package avant de l'importer.

    Comment devez-vous compléter le notebook ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    # Cell 1
    [[install]] /Workspace/Shared/libs/contoso_rules-2.0-py3-none-any.whl

    # Cell 2
    [[restart]]

    # Cell 3
    import contoso_rules
  slots:
    - id: install
      options:
        - { id: sh, text: "%sh pip install" }
        - { id: pip, text: "%pip install" }
        - { id: fs, text: "%fs cp" }
    - id: restart
      options:
        - { id: exit, text: 'dbutils.notebook.exit("restart")' }
        - { id: cache, text: spark.catalog.clearCache() }
        - { id: rp, text: dbutils.library.restartPython() }
answer:
  values: { install: pip, restart: rp }
explanation:
  correct:
    en: |
      `%pip install` creates a notebook-scoped library: only the current notebook and the jobs associated with it can use it, and other notebooks on the same compute aren't affected. `%pip` doesn't restart the Python process automatically, so you run `dbutils.library.restartPython()` to make the new package visible.
    fr: |
      `%pip install` crée une bibliothèque limitée au notebook : seuls le notebook actuel et les jobs qui lui sont associés peuvent l'utiliser, et les autres notebooks du même calcul ne sont pas affectés. `%pip` ne redémarre pas automatiquement le processus Python : vous exécutez `dbutils.library.restartPython()` pour rendre le nouveau package visible.
  options:
    sh: { en: "%sh runs a shell command on the driver only; it doesn't manage the notebook's Python environment.", fr: "%sh exécute une commande shell sur le pilote uniquement ; il ne gère pas l'environnement Python du notebook." }
    fs: { en: "%fs copies files; it doesn't install a package.", fr: "%fs copie des fichiers ; il n'installe pas de package." }
    exit: { en: "dbutils.notebook.exit() ends the notebook run and returns a value; it doesn't restart Python.", fr: "dbutils.notebook.exit() termine l'exécution du notebook et renvoie une valeur ; il ne redémarre pas Python." }
    cache: { en: "clearCache() removes cached tables; it doesn't reload Python packages.", fr: "clearCache() supprime les tables mises en cache ; il ne recharge pas les packages Python." }
references:
  - title: Notebook-scoped Python libraries
    url: https://learn.microsoft.com/en-us/azure/databricks/libraries/notebooks-python-libraries
