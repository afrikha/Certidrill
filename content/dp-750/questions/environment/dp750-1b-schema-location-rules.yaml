id: dp750-1b-schema-location-rules
objective: "1.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a Unity Catalog catalog named **adatum_prod** that has a managed storage location. The catalog contains the following schemas:

    | Schema | Managed location | Content |
    | --- | --- | --- |
    | sales | None | 12 managed tables |
    | iot | `abfss://iot@stadatum.dfs.core.windows.net/managed` | 4 managed tables |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un catalogue Unity Catalog nommé **adatum_prod** qui possède un emplacement de stockage managé. Le catalogue contient les schémas suivants :

    | Schéma | Emplacement managé | Contenu |
    | --- | --- | --- |
    | sales | Aucun | 12 tables managées |
    | iot | `abfss://iot@stadatum.dfs.core.windows.net/managed` | 4 tables managées |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A new managed table created in the sales schema stores its data in the managed location of adatum_prod.
        fr: Une nouvelle table managée créée dans le schéma sales stocke ses données dans l'emplacement managé d'adatum_prod.
    - id: s2
      text:
        en: If you change the managed location of the iot schema by running ALTER SCHEMA ... SET MANAGED LOCATION, the four existing tables are moved to the new location.
        fr: Si vous modifiez l'emplacement managé du schéma iot en exécutant ALTER SCHEMA ... SET MANAGED LOCATION, les quatre tables existantes sont déplacées vers le nouvel emplacement.
    - id: s3
      text:
        en: Running DROP SCHEMA adatum_prod.iot without any other keyword returns an error.
        fr: L'exécution de DROP SCHEMA adatum_prod.iot sans autre mot clé renvoie une erreur.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: A schema without a managed location stores its managed tables in the catalog's managed location, and the metastore location is used only if the catalog has none. Changing a managed location affects only managed tables and volumes created afterward; existing objects are not moved. DROP SCHEMA uses RESTRICT by default, which refuses to drop a schema that is not empty; CASCADE is needed to drop iot and its tables.
    fr: Un schéma sans emplacement managé stocke ses tables managées dans l'emplacement managé du catalogue ; l'emplacement du metastore n'est utilisé que si le catalogue n'en a pas. La modification d'un emplacement managé n'affecte que les tables et volumes managés créés ensuite ; les objets existants ne sont pas déplacés. DROP SCHEMA utilise RESTRICT par défaut, ce qui refuse de supprimer un schéma non vide ; CASCADE est nécessaire pour supprimer iot et ses tables.
references:
  - title: Specify a managed storage location in Unity Catalog
    url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/managed-storage
  - title: DROP SCHEMA
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-drop-schema
