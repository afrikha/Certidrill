id: dp750-1b-mv-dashboard-choice
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a Delta table named **nw_prod.silver.orders** that receives new rows every hour. An AI/BI dashboard runs the same aggregation query on the table hundreds of times a day, and the queries are slow.

    You need to create an object in **nw_prod.gold** that stores the precomputed aggregates and is refreshed automatically every day. The solution must minimize development effort.

    What should you create?
  fr: |
    Northwind dispose d'une table Delta nommée **nw_prod.silver.orders** qui reçoit de nouvelles lignes toutes les heures. Un tableau de bord AI/BI exécute la même requête d'agrégation sur la table des centaines de fois par jour, et les requêtes sont lentes.

    Vous devez créer dans **nw_prod.gold** un objet qui stocke les agrégats précalculés et qui est actualisé automatiquement chaque jour. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A view", fr: "Une vue" } }
    - { id: b, text: { en: "A temporary view", fr: "Une vue temporaire" } }
    - { id: c, text: { en: "A managed table loaded by a CTAS statement in a scheduled job", fr: "Une table managée chargée par une instruction CTAS dans un job planifié" } }
    - { id: d, text: { en: "A materialized view", fr: "Une vue matérialisée" } }
answer: { optionId: d }
explanation:
  correct:
    en: A materialized view stores the results of its query and is refreshed on a schedule (SCHEDULE clause), on upstream updates or manually, incrementally when possible. Repeated dashboard queries read the precomputed results, and the refresh needs no job or code to maintain.
    fr: Une vue matérialisée stocke les résultats de sa requête et est actualisée selon une planification (clause SCHEDULE), lors de mises à jour en amont ou manuellement, de façon incrémentielle lorsque c'est possible. Les requêtes répétées du tableau de bord lisent les résultats précalculés, et l'actualisation n'exige ni job ni code à maintenir.
  options:
    a:
      en: A view stores only its query text and recomputes the aggregation each time it is queried.
      fr: Une vue ne stocke que le texte de sa requête et recalcule l'agrégation à chaque interrogation.
    b:
      en: A temporary view is not registered in Unity Catalog, stores no data and disappears at the end of the notebook or query scope.
      fr: Une vue temporaire n'est pas inscrite dans Unity Catalog, ne stocke aucune donnée et disparaît à la fin de la portée du notebook ou de la requête.
    c:
      en: A scheduled CTAS job would work, but it recomputes everything and adds a job to build and maintain, so it does not minimize development effort.
      fr: Un job CTAS planifié fonctionnerait, mais il recalcule tout et ajoute un job à créer et à maintenir ; il ne réduit donc pas l'effort de développement.
references:
  - title: Use standalone materialized views
    url: https://learn.microsoft.com/en-us/azure/databricks/views/materialized
  - title: What is a view?
    url: https://learn.microsoft.com/en-us/azure/databricks/views/
