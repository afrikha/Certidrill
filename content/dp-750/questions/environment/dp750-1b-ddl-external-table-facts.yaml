id: dp750-1b-ddl-external-table-facts
objective: "1.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an external Delta table named **adatum_prod.bronze.ext_sales** whose files are stored in `abfss://sales@stadatum.dfs.core.windows.net/ext_sales`. The catalog adatum_prod also contains the schemas silver and gold. You own the table and have every required privilege.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une table Delta externe nommée **adatum_prod.bronze.ext_sales** dont les fichiers sont stockés dans `abfss://sales@stadatum.dfs.core.windows.net/ext_sales`. Le catalogue adatum_prod contient aussi les schémas silver et gold. Vous êtes propriétaire de la table et disposez de tous les privilèges nécessaires.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Running DROP TABLE on ext_sales removes the table from Unity Catalog and leaves its data files in the ext_sales path.", fr: "L'exécution de DROP TABLE sur ext_sales retire la table d'Unity Catalog et laisse ses fichiers de données dans le chemin ext_sales." } }
    - { id: b, text: { en: "Running ALTER TABLE ... SET LOCATION on ext_sales moves the existing data files to the new path.", fr: "L'exécution d'ALTER TABLE ... SET LOCATION sur ext_sales déplace les fichiers de données existants vers le nouveau chemin." } }
    - { id: c, text: { en: "You can run ALTER TABLE adatum_prod.bronze.ext_sales RENAME TO adatum_prod.silver.ext_sales.", fr: "Vous pouvez exécuter ALTER TABLE adatum_prod.bronze.ext_sales RENAME TO adatum_prod.silver.ext_sales." } }
    - { id: d, text: { en: "You can run ALTER TABLE adatum_prod.bronze.ext_sales RENAME TO adatum_dev.bronze.ext_sales.", fr: "Vous pouvez exécuter ALTER TABLE adatum_prod.bronze.ext_sales RENAME TO adatum_dev.bronze.ext_sales." } }
    - { id: e, text: { en: "Unity Catalog automatically manages the layout and optimization of the ext_sales data files.", fr: "Unity Catalog gère automatiquement l'organisation et l'optimisation des fichiers de données d'ext_sales." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Dropping an external table removes only its metadata; the files stay in cloud storage until you delete them. For Unity Catalog tables, RENAME TO accepts a target in another schema of the same catalog.
    fr: La suppression d'une table externe ne retire que ses métadonnées ; les fichiers restent dans le stockage cloud jusqu'à ce que vous les supprimiez. Pour les tables Unity Catalog, RENAME TO accepte une cible dans un autre schéma du même catalogue.
  options:
    b:
      en: SET LOCATION changes the location that the table points to; files in the original location are not moved.
      fr: SET LOCATION change l'emplacement vers lequel pointe la table ; les fichiers de l'emplacement d'origine ne sont pas déplacés.
    d:
      en: The new name of a Unity Catalog table must be in the same catalog; adatum_dev is another catalog.
      fr: Le nouveau nom d'une table Unity Catalog doit se trouver dans le même catalogue ; adatum_dev est un autre catalogue.
    e:
      en: Unity Catalog governs queries on external tables but does not manage their lifecycle, optimization or layout; those are managed-table features.
      fr: Unity Catalog gouverne les requêtes sur les tables externes, mais ne gère ni leur cycle de vie, ni leur optimisation, ni leur organisation ; ce sont des fonctionnalités des tables managées.
references:
  - title: Work with external tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/external
  - title: ALTER TABLE
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-alter-table
