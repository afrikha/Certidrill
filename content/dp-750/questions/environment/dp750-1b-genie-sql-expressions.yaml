id: dp750-1b-genie-sql-expressions
objective: "1.2.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware's sales team uses an AI/BI Genie space built on the tables **litware_prod.crm.opportunity** and **litware_prod.crm.accounts**. No primary or foreign key constraints are defined on the tables. You need to add the following business knowledge to the space so that Genie applies it consistently.

    What should you add for each requirement? To answer, drag the appropriate knowledge types to the correct requirements. Each knowledge type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe commerciale de Litware utilise un espace AI/BI Genie construit sur les tables **litware_prod.crm.opportunity** et **litware_prod.crm.accounts**. Aucune contrainte de clé primaire ou étrangère n'est définie sur les tables. Vous devez ajouter à l'espace les connaissances métier suivantes pour que Genie les applique de façon cohérente.

    Que devez-vous ajouter pour chaque exigence ? Pour répondre, faites glisser les types de connaissances appropriés vers les exigences correspondantes. Chaque type de connaissance peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: measure, text: { en: "SQL expression of type Measure", fr: "Expression SQL de type Measure" } }
    - { id: filter, text: { en: "SQL expression of type Filter", fr: "Expression SQL de type Filter" } }
    - { id: field, text: { en: "SQL expression of type Field", fr: "Expression SQL de type Field" } }
    - { id: join, text: { en: "Join relationship", fr: "Relation de jointure" } }
    - { id: entity, text: { en: "Entity matching", fr: "Mise en correspondance d'entités (Entity matching)" } }
    - { id: text, text: { en: "Text instruction", fr: "Instruction textuelle" } }
  targets:
    - id: t1
      text: { en: "Compute the win rate KPI as the share of opportunities in the Closed Won stage", fr: "Calculer l'indicateur de taux de réussite comme la part des opportunités à l'étape Closed Won" }
    - id: t2
      text: { en: "Treat \"big deals\" as opportunities whose amount is greater than 50,000", fr: "Considérer les « grosses affaires » comme les opportunités dont le montant est supérieur à 50 000" }
    - id: t3
      text: { en: "Label each opportunity Small, Medium or Large based on its amount", fr: "Étiqueter chaque opportunité Small, Medium ou Large selon son montant" }
    - id: t4
      text: { en: "Link opportunity.accountid to accounts.id, with many opportunities per account", fr: "Relier opportunity.accountid à accounts.id, avec plusieurs opportunités par compte" }
answer:
  mapping: { t1: measure, t2: filter, t3: field, t4: join }
explanation:
  correct:
    en: SQL expressions define reusable business concepts that Genie applies exactly as written. A Measure is an aggregation such as a KPI, a Filter is a boolean condition, and a Field is a per-row value such as a size tier. A join relationship defines the join condition and the relationship type (here Many to one); without key constraints, Genie cannot create it automatically.
    fr: Les expressions SQL définissent des concepts métier réutilisables que Genie applique tels qu'ils sont écrits. Une expression Measure est une agrégation, comme un indicateur clé, une expression Filter est une condition booléenne, et une expression Field est une valeur par ligne, comme une catégorie de taille. Une relation de jointure définit la condition de jointure et le type de relation (ici Many to one) ; sans contraintes de clé, Genie ne peut pas la créer automatiquement.
  options:
    entity: { en: "Entity matching maps user words to stored values of string columns; it defines no calculation.", fr: "La mise en correspondance d'entités associe les mots des utilisateurs aux valeurs stockées de colonnes de chaînes ; elle ne définit aucun calcul." }
    text: { en: "Text instructions are for global context; SQL expressions are more consistent for business definitions.", fr: "Les instructions textuelles servent au contexte global ; les expressions SQL sont plus cohérentes pour les définitions métier." }
references:
  - title: Tune Genie Agent quality
    url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/tune-quality
