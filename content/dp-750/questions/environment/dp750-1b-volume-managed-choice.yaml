id: dp750-1b-volume-managed-choice
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware runs a document-processing workload in Azure Databricks. Notebooks store and read thousands of scanned PDF files and PNG images in the schema **proseware_prod.documents**. Only Azure Databricks workloads access the files. The schema has a managed storage location.

    You need to store the files so that access is governed by Unity Catalog. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Proseware exécute une charge de travail de traitement de documents dans Azure Databricks. Des notebooks stockent et lisent des milliers de fichiers PDF numérisés et d'images PNG dans le schéma **proseware_prod.documents**. Seules des charges de travail Azure Databricks accèdent aux fichiers. Le schéma possède un emplacement de stockage managé.

    Vous devez stocker les fichiers de façon que l'accès soit gouverné par Unity Catalog. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An external volume", fr: "Un volume externe" } }
    - { id: b, text: { en: "A managed Delta table that has a BINARY column", fr: "Une table Delta managée qui possède une colonne BINARY" } }
    - { id: c, text: { en: "A managed volume", fr: "Un volume managé" } }
    - { id: d, text: { en: "An external table that uses the BINARYFILE format", fr: "Une table externe qui utilise le format BINARYFILE" } }
answer: { optionId: c }
explanation:
  correct:
    en: Volumes govern non-tabular files in Unity Catalog. A managed volume is created in the schema's managed storage, so you manage no storage path or external location, which makes it the simplest choice for Databricks-only workloads.
    fr: Les volumes gouvernent les fichiers non tabulaires dans Unity Catalog. Un volume managé est créé dans le stockage managé du schéma ; vous ne gérez ni chemin de stockage ni emplacement externe, ce qui en fait le choix le plus simple pour des charges de travail exclusivement Databricks.
  options:
    a:
      en: An external volume requires an external location and a storage path to manage; it suits files that other systems must also read or write directly.
      fr: Un volume externe exige un emplacement externe et un chemin de stockage à gérer ; il convient aux fichiers que d'autres systèmes doivent aussi lire ou écrire directement.
    b:
      en: Loading files into a table column adds code and does not give path-based access to the files; volumes are intended for non-tabular data.
      fr: Charger des fichiers dans une colonne de table ajoute du code et ne donne pas d'accès par chemin aux fichiers ; les volumes sont destinés aux données non tabulaires.
    d:
      en: Tables govern tabular data, and an external table also requires an external location. Databricks recommends volumes for non-tabular files.
      fr: Les tables gouvernent des données tabulaires, et une table externe exige aussi un emplacement externe. Databricks recommande les volumes pour les fichiers non tabulaires.
references:
  - title: What are Unity Catalog volumes?
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/
