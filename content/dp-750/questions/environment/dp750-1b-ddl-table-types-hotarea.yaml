id: dp750-1b-ddl-table-types-hotarea
objective: "1.2.7"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    The schema **wingtip_prod.sales** contains the objects shown in the following table. All readers and writers run on Databricks Runtime 17.3 LTS.

    Answer each prompt by selecting the appropriate object in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le schéma **wingtip_prod.sales** contient les objets présentés dans le tableau suivant. Tous les lecteurs et rédacteurs s'exécutent sur Databricks Runtime 17.3 LTS.

    Répondez à chaque consigne en sélectionnant l'objet approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "You drop each object. For which object does Unity Catalog delete the data files once the recovery period ends?", fr: "Vous supprimez chaque objet. Pour quel objet Unity Catalog supprime-t-il les fichiers de données à la fin de la période de récupération ?" }
    - id: p2
      text: { en: "Which table can you convert in place to a managed table by running ALTER TABLE ... SET MANAGED?", fr: "Quelle table pouvez-vous convertir sur place en table managée en exécutant ALTER TABLE ... SET MANAGED ?" }
  grid:
    header: [{ en: Name, fr: Nom }, Type, Format, { en: Location, fr: Emplacement }]
    rows:
      - [{ text: orders, area: orders }, { text: MANAGED }, { text: DELTA }, { text: { en: "Managed location of the schema", fr: "Emplacement managé du schéma" } }]
      - [{ text: partner_feed, area: partner }, { text: EXTERNAL }, { text: DELTA }, { text: "abfss://partner@stwingtip.dfs.core.windows.net/feed" }]
      - [{ text: clickstream_raw, area: clicks }, { text: EXTERNAL }, { text: JSON }, { text: "abfss://raw@stwingtip.dfs.core.windows.net/clicks" }]
      - [{ text: vw_orders_eu, area: view }, { text: VIEW }, { text: { en: "None", fr: "Aucun" } }, { text: { en: "None", fr: "Aucun" } }]
answer:
  values: { p1: orders, p2: partner }
explanation:
  correct:
    en: Dropping a managed table removes it from Unity Catalog, and an asynchronous process deletes its data files after the recovery period (7 days by default); dropping an external table only removes metadata, and a view has no data files. SET MANAGED converts external Delta tables; clickstream_raw uses the JSON format, which the conversion does not support.
    fr: La suppression d'une table managée la retire d'Unity Catalog, et un processus asynchrone supprime ses fichiers de données après la période de récupération (7 jours par défaut) ; la suppression d'une table externe ne retire que les métadonnées, et une vue n'a pas de fichiers de données. SET MANAGED convertit des tables Delta externes ; clickstream_raw utilise le format JSON, que la conversion ne prend pas en charge.
references:
  - title: Unity Catalog managed tables for Delta Lake and Apache Iceberg
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/managed
  - title: Convert external or foreign Delta Lake tables to Unity Catalog managed tables
    url: https://learn.microsoft.com/en-us/azure/databricks/tables/convert-to-managed
