id: dp750-cs2c-compute-acl
objective: "1.1.5"
type: single
caseStudy: dp750-cs2c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the permissions of cl-fc-analytics for the store-analysts group. The solution must meet the operations requirements.

    Which permission should you grant?
  fr: |
    Vous devez configurer les autorisations de cl-fc-analytics pour le groupe store-analysts. La solution doit respecter les exigences des opérations.

    Quelle autorisation devez-vous accorder ?
shuffle: false
body:
  options:
    - { id: view, text: "CAN VIEW" }
    - { id: attach, text: "CAN ATTACH TO" }
    - { id: restart, text: "CAN RESTART" }
    - { id: manage, text: "CAN MANAGE" }
answer: { optionId: attach }
explanation:
  correct:
    en: CAN ATTACH TO lets users attach notebooks to the compute and view its Spark UI and metrics. It does not let them start, restart or terminate the compute, edit or resize it, attach libraries, or change its permissions.
    fr: CAN ATTACH TO permet d'attacher des notebooks au calcul et d'afficher son interface utilisateur Spark et ses métriques. Elle ne permet pas de démarrer, redémarrer ni arrêter le calcul, de le modifier ou de le redimensionner, d'y attacher des bibliothèques ni de changer ses autorisations.
  options:
    view:
      en: CAN VIEW, a Beta permission, shows the Spark UI and metrics but does not allow attaching notebooks.
      fr: CAN VIEW, une autorisation en version bêta, affiche l'interface utilisateur Spark et les métriques mais ne permet pas d'attacher des notebooks.
    restart:
      en: CAN RESTART also lets users start, restart and terminate the compute, which the requirement forbids.
      fr: CAN RESTART permet aussi de démarrer, redémarrer et arrêter le calcul, ce que l'exigence interdit.
    manage:
      en: CAN MANAGE also allows editing the configuration, attaching libraries and changing permissions.
      fr: CAN MANAGE permet aussi de modifier la configuration, d'attacher des bibliothèques et de changer les autorisations.
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
