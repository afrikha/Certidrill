id: dp750-1a-compute-acl-statements
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    In the Adatum workspace, **Kim** is a workspace admin. **Lee**, who isn't an admin, creates a classic compute resource named **lee-dev** and grants CAN RESTART on it to a group named **qa-team**. Later, Lee clones lee-dev to create **lee-dev-copy**. Nobody grants other permissions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans l'espace de travail d'Adatum, **Kim** est administratrice de l'espace de travail. **Lee**, qui n'est pas administrateur, crée une ressource de calcul classique nommée **lee-dev** et accorde CAN RESTART sur celle-ci à un groupe nommé **qa-team**. Plus tard, Lee clone lee-dev pour créer **lee-dev-copy**. Personne n'accorde d'autres autorisations.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Kim can change the permissions of lee-dev.
        fr: Kim peut modifier les autorisations de lee-dev.
    - id: s2
      text:
        en: Members of qa-team can restart lee-dev-copy.
        fr: Les membres de qa-team peuvent redémarrer lee-dev-copy.
    - id: s3
      text:
        en: Lee can edit the configuration of lee-dev.
        fr: Lee peut modifier la configuration de lee-dev.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Workspace admins have CAN MANAGE on all objects in their workspace, including all compute, so Kim can change the permissions. Users automatically get CAN MANAGE on the objects they create, so Lee can edit lee-dev. Cloning copies the compute configuration but not its permissions, so the CAN RESTART grant of qa-team doesn't apply to lee-dev-copy.
    fr: |
      Les administrateurs de l'espace de travail disposent de CAN MANAGE sur tous les objets de leur espace de travail, y compris tout le calcul : Kim peut donc modifier les autorisations. Les utilisateurs obtiennent automatiquement CAN MANAGE sur les objets qu'ils créent : Lee peut donc modifier lee-dev. Le clonage copie la configuration du calcul mais pas ses autorisations : l'autorisation CAN RESTART de qa-team ne s'applique pas à lee-dev-copy.
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
  - title: Manage classic compute
    url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage
