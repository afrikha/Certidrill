id: dp750-1a-warehouse-can-use
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a SQL warehouse named **wh-reports**. Members of a group named **report-writers** must be able to start wh-reports when it's stopped and run queries on it.

    They must not be able to see the queries that other users run on wh-reports, stop it or edit it. The solution must follow the principle of least privilege.

    Which permission should you grant to report-writers on wh-reports?
  fr: |
    Proseware dispose d'un entrepôt SQL nommé **wh-reports**. Les membres d'un groupe nommé **report-writers** doivent pouvoir démarrer wh-reports lorsqu'il est arrêté et y exécuter des requêtes.

    Ils ne doivent pas pouvoir voir les requêtes que les autres utilisateurs exécutent sur wh-reports, l'arrêter ni le modifier. La solution doit respecter le principe du moindre privilège.

    Quelle autorisation devez-vous accorder à report-writers sur wh-reports ?
body:
  options:
    - { id: a, text: CAN VIEW }
    - { id: b, text: CAN MONITOR }
    - { id: c, text: CAN MANAGE }
    - { id: d, text: CAN USE }
answer: { optionId: d }
explanation:
  correct:
    en: |
      CAN USE lets a principal start the warehouse, view its details and run queries, without viewing the warehouse's query list or monitoring tab, and without stopping, editing or deleting it.
    fr: |
      CAN USE permet à un principal de démarrer l'entrepôt, d'en consulter les détails et d'exécuter des requêtes, sans voir la liste des requêtes ni l'onglet de supervision de l'entrepôt, et sans pouvoir l'arrêter, le modifier ni le supprimer.
  options:
    a: { en: "CAN VIEW shows the warehouse details, queries and monitoring tab but doesn't allow starting the warehouse or running queries.", fr: "CAN VIEW affiche les détails, les requêtes et l'onglet de supervision de l'entrepôt mais ne permet ni de le démarrer ni d'exécuter des requêtes." }
    b: { en: "CAN MONITOR also shows the queries of all users and the monitoring tab.", fr: "CAN MONITOR affiche aussi les requêtes de tous les utilisateurs et l'onglet de supervision." }
    c: { en: "CAN MANAGE also allows stopping, editing and deleting the warehouse and changing its permissions.", fr: "CAN MANAGE permet aussi d'arrêter, de modifier et de supprimer l'entrepôt et d'en changer les autorisations." }
references:
  - title: Access control lists
    url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
