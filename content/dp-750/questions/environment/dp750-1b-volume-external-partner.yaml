id: dp750-1b-volume-external-partner
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip receives image and audio files from a partner. The partner's application writes the files directly to the ADLS Gen2 path `abfss://partner@stwingtip.dfs.core.windows.net/media`, and it must keep doing so. An external location named **loc-partner** covers this path.

    You need to make the files available to Azure Databricks notebooks with Unity Catalog governance. The files must not be copied, and they must stay in place if the Unity Catalog object is dropped.

    What should you create?
  fr: |
    Wingtip reçoit des fichiers image et audio d'un partenaire. L'application du partenaire écrit les fichiers directement dans le chemin ADLS Gen2 `abfss://partner@stwingtip.dfs.core.windows.net/media`, et doit continuer à le faire. Un emplacement externe nommé **loc-partner** couvre ce chemin.

    Vous devez rendre les fichiers disponibles pour les notebooks Azure Databricks avec une gouvernance Unity Catalog. Les fichiers ne doivent pas être copiés et doivent rester en place si l'objet Unity Catalog est supprimé.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An external volume registered on the media path", fr: "Un volume externe inscrit sur le chemin media" } }
    - { id: b, text: { en: "A managed volume loaded with the media files", fr: "Un volume managé dans lequel les fichiers media sont chargés" } }
    - { id: c, text: { en: "An external table whose LOCATION is the media path", fr: "Une table externe dont le LOCATION est le chemin media" } }
    - { id: d, text: { en: "A managed table loaded by COPY INTO from the media path", fr: "Une table managée chargée par COPY INTO depuis le chemin media" } }
answer: { optionId: a }
explanation:
  correct:
    en: An external volume adds Unity Catalog governance to an existing directory of an external location without copying the files. External systems can keep writing to the path, and dropping the volume leaves the files in cloud storage.
    fr: Un volume externe ajoute la gouvernance Unity Catalog à un répertoire existant d'un emplacement externe sans copier les fichiers. Les systèmes externes peuvent continuer à écrire dans le chemin, et la suppression du volume laisse les fichiers dans le stockage cloud.
  options:
    b:
      en: A managed volume stores files in Unity Catalog managed storage, so the files would have to be copied, and the partner cannot write to that location.
      fr: Un volume managé stocke les fichiers dans le stockage managé d'Unity Catalog ; les fichiers devraient donc être copiés, et le partenaire ne peut pas écrire à cet emplacement.
    c:
      en: Tables govern tabular data; image and audio files are non-tabular data, which volumes govern.
      fr: Les tables gouvernent des données tabulaires ; les fichiers image et audio sont des données non tabulaires, gouvernées par les volumes.
    d:
      en: COPY INTO copies data into a table, which breaks the no-copy requirement, and the files are not tabular.
      fr: COPY INTO copie les données dans une table, ce qui ne respecte pas l'exigence d'absence de copie, et les fichiers ne sont pas tabulaires.
references:
  - title: What are Unity Catalog volumes?
    url: https://learn.microsoft.com/en-us/azure/databricks/volumes/
