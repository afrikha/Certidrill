id: dp750-1a-jar-sources-standard
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You need to install a Java library as a compute-scoped library on a classic compute resource named **stream-std**. stream-std uses standard access mode and Databricks Runtime 16.4 LTS. The required allowlist entries will be added by a metastore admin.

    Which two library sources can you use?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez installer une bibliothèque Java comme bibliothèque limitée au calcul sur une ressource de calcul classique nommée **stream-std**. stream-std utilise le mode d'accès standard et Databricks Runtime 16.4 LTS. Les entrées nécessaires de la liste d'autorisation seront ajoutées par un administrateur du metastore.

    Quelles sont les deux sources de bibliothèque que vous pouvez utiliser ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: vol, text: { en: "A JAR file in a Unity Catalog volume", fr: "Un fichier JAR dans un volume Unity Catalog" } }
    - { id: ws, text: { en: "A JAR file in workspace files", fr: "Un fichier JAR dans les fichiers de l'espace de travail" } }
    - { id: maven, text: { en: "A Maven coordinate", fr: "Une coordonnée Maven" } }
    - { id: dbfs, text: { en: "A JAR file in the DBFS root", fr: "Un fichier JAR dans la racine DBFS" } }
    - { id: cran, text: { en: "A CRAN package", fr: "Un package CRAN" } }
answer: { optionIds: [ vol, maven ] }
explanation:
  correct:
    en: |
      On standard access mode compute running Databricks Runtime 13.3 LTS and above, JARs can be installed from Unity Catalog volumes, Maven and cloud object storage, after the paths or coordinates are added to the allowlist.
    fr: |
      Sur un calcul en mode d'accès standard à partir de Databricks Runtime 13.3 LTS, les JAR peuvent être installés depuis des volumes Unity Catalog, Maven et le stockage d'objets cloud, une fois les chemins ou coordonnées ajoutés à la liste d'autorisation.
  options:
    ws: { en: "JARs in workspace files aren't supported on standard or dedicated compute.", fr: "Les JAR dans les fichiers de l'espace de travail ne sont pas pris en charge sur un calcul standard ou dédié." }
    dbfs: { en: "Libraries in the DBFS root aren't supported in standard access mode.", fr: "Les bibliothèques de la racine DBFS ne sont pas prises en charge en mode d'accès standard." }
    cran: { en: "CRAN provides R packages, which standard access mode doesn't support.", fr: "CRAN fournit des packages R, que le mode d'accès standard ne prend pas en charge." }
references:
  - title: Install libraries
    url: https://learn.microsoft.com/en-us/azure/databricks/libraries/
