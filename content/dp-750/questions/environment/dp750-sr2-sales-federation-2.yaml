stem:
  en: You create a connection and a foreign catalog.
  fr: Vous créez une connexion et un catalogue étranger.
body:
  solution:
    en: |
      You run the following statements.

      ```sql
      CREATE CONNECTION salesdb_conn TYPE sqlserver
      OPTIONS (
        host 'contoso-sales.database.windows.net',
        port '1433',
        user secret ('sales-secrets', 'sql-user'),
        password secret ('sales-secrets', 'sql-password')
      );

      CREATE FOREIGN CATALOG sales_ext USING CONNECTION salesdb_conn
      OPTIONS (database 'salesdb');

      GRANT USE CATALOG, USE SCHEMA, SELECT ON CATALOG sales_ext TO `sales-analysts`;
      ```
    fr: |
      Vous exécutez les instructions suivantes.

      ```sql
      CREATE CONNECTION salesdb_conn TYPE sqlserver
      OPTIONS (
        host 'contoso-sales.database.windows.net',
        port '1433',
        user secret ('sales-secrets', 'sql-user'),
        password secret ('sales-secrets', 'sql-password')
      );

      CREATE FOREIGN CATALOG sales_ext USING CONNECTION salesdb_conn
      OPTIONS (database 'salesdb');

      GRANT USE CATALOG, USE SCHEMA, SELECT ON CATALOG sales_ext TO `sales-analysts`;
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      Lakehouse Federation supports Azure SQL Database through the `sqlserver` connection type. The foreign catalog mirrors the schemas and tables of salesdb in Unity Catalog, and queries are pushed down to the source, so the analysts read the current rows without any copy. The grants on the catalog are inherited by its schemas and tables, and serverless SQL warehouses are supported for federated queries.
    fr: |
      Lakehouse Federation prend en charge Azure SQL Database via le type de connexion `sqlserver`. Le catalogue étranger reflète les schémas et les tables de salesdb dans Unity Catalog et les requêtes sont envoyées à la source : les analystes lisent les lignes actuelles sans aucune copie. Les privilèges accordés sur le catalogue sont hérités par ses schémas et ses tables, et les entrepôts SQL serverless sont pris en charge pour les requêtes fédérées.
references:
  - title: Run federated queries on Microsoft SQL Server
    url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/sql-server
