id: dp750-1b-schema-alter-owner-tags
objective: "1.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a Unity Catalog schema named **tailspin_prod.sales** that was created by a former employee. You need to:

    - make the group **grp-sales-owners** the owner of the schema;
    - add the Unity Catalog tag `data_domain` with the value `sales` to the schema;
    - display the schema information, including its properties.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un schéma Unity Catalog nommé **tailspin_prod.sales**, créé par un ancien employé. Vous devez :

    - faire du groupe **grp-sales-owners** le propriétaire du schéma ;
    - ajouter au schéma la balise Unity Catalog `data_domain` avec la valeur `sales` ;
    - afficher les informations du schéma, y compris ses propriétés.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER SCHEMA tailspin_prod.sales [[owner]] `grp-sales-owners`;

    ALTER SCHEMA tailspin_prod.sales [[tags]] ('data_domain' = 'sales');

    DESCRIBE SCHEMA [[describe]] tailspin_prod.sales;
  slots:
    - id: owner
      options:
        - { id: grant, text: GRANT OWNERSHIP TO }
        - { id: ownerto, text: OWNER TO }
        - { id: rename, text: RENAME TO }
    - id: tags
      options:
        - { id: dbprop, text: SET DBPROPERTIES }
        - { id: tblprop, text: SET TBLPROPERTIES }
        - { id: settags, text: SET TAGS }
    - id: describe
      options:
        - { id: extended, text: EXTENDED }
        - { id: detail, text: DETAIL }
        - { id: history, text: HISTORY }
answer:
  values: { owner: ownerto, tags: settags, describe: extended }
explanation:
  correct:
    en: "`ALTER SCHEMA ... [SET] OWNER TO principal` transfers ownership; Databricks recommends a group as owner. `SET TAGS` adds Unity Catalog tags to the schema (it requires the APPLY TAG privilege or ownership). `DESCRIBE SCHEMA EXTENDED` returns the schema information including its properties."
    fr: "`ALTER SCHEMA ... [SET] OWNER TO principal` transfère la propriété ; Databricks recommande un groupe comme propriétaire. `SET TAGS` ajoute des balises Unity Catalog au schéma (il faut le privilège APPLY TAG ou la propriété). `DESCRIBE SCHEMA EXTENDED` renvoie les informations du schéma, y compris ses propriétés."
  options:
    grant: { en: "Ownership is transferred with ALTER ... OWNER TO, not with a GRANT clause.", fr: "La propriété se transfère avec ALTER ... OWNER TO, pas avec une clause GRANT." }
    rename: { en: "RENAME TO would rename an object; schema renaming is not even supported in SQL.", fr: "RENAME TO renommerait un objet ; le renommage d'un schéma n'est d'ailleurs pas pris en charge en SQL." }
    dbprop: { en: "SET DBPROPERTIES sets Spark key-value properties, not Unity Catalog tags.", fr: "SET DBPROPERTIES définit des propriétés clé-valeur Spark, pas des balises Unity Catalog." }
    tblprop: { en: "TBLPROPERTIES applies to tables, not to schemas.", fr: "TBLPROPERTIES s'applique aux tables, pas aux schémas." }
    detail: { en: "DESCRIBE DETAIL returns the details of a Delta table, not of a schema.", fr: "DESCRIBE DETAIL renvoie les détails d'une table Delta, pas d'un schéma." }
    history: { en: "DESCRIBE HISTORY returns the operations of a Delta table.", fr: "DESCRIBE HISTORY renvoie les opérations d'une table Delta." }
references:
  - title: ALTER SCHEMA
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-alter-schema
  - title: CREATE SCHEMA
    url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-create-schema
