chapter: 43-development-lifecycle
questions:
  # ------------------------------------------------------------------ 1
  - id: dp750-qz-43-01
    objective: "4.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso's data engineers follow the branch naming convention that Microsoft Learn recommends for Git folders. You need to create a branch to fix an issue: rows with a null `amount` make the notebook `clean_payments` fail.

        Which branch name should you use?
      fr: |
        Les ingénieurs données de Contoso suivent la convention de nommage des branches que Microsoft Learn recommande pour les dossiers Git. Vous devez créer une branche pour corriger un problème : des lignes dont `amount` est null font échouer le notebook `clean_payments`.

        Quel nom de branche devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "`feature/null-amounts`" }
        - { id: b, text: "`users/null-amounts`" }
        - { id: c, text: "`bugfix/null-amounts`" }
        - { id: d, text: "`main/null-amounts`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The convention uses a prefix that tells the purpose of the branch: `bugfix/issue-description` for fixes, `feature/feature-name` for new functionality and `users/username/description` for personal development work. A fix for null amounts is a bug fix.
        fr: |
          La convention utilise un préfixe qui indique le but de la branche : `bugfix/issue-description` pour les correctifs, `feature/feature-name` pour une nouvelle fonctionnalité et `users/username/description` pour le travail de développement personnel. Corriger les montants null est un correctif.
      options:
        a: { en: "The feature/ prefix is for new functionality, not for fixing an existing defect.", fr: "Le préfixe feature/ est destiné à une nouvelle fonctionnalité, pas à la correction d'un défaut existant." }
        b: { en: "The users/ prefix is for personal development work and is followed by the user name, then the description.", fr: "Le préfixe users/ est destiné au travail de développement personnel et est suivi du nom d'utilisateur, puis de la description." }
        d: { en: "main is the deployment branch; work is done on a separate branch created from main, not named after it.", fr: "main est la branche de déploiement ; le travail se fait sur une branche distincte créée à partir de main, pas nommée d'après elle." }
    references:
      - title: Manage Branching and Pull Requests - Training
        url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/3-manage-branching-pull-requests-conflicts

  # ------------------------------------------------------------------ 2
  - id: dp750-qz-43-02
    objective: "4.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is designing the testing strategy of its Azure Databricks pipelines according to the testing pyramid.

        Which type of test should be the most numerous?
      fr: |
        Fabrikam conçoit la stratégie de test de ses pipelines Azure Databricks selon la pyramide des tests.

        Quel type de test doit être le plus nombreux ?
    body:
      options:
        - { id: a, text: { en: "End-to-end tests", fr: "Les tests de bout en bout" } }
        - { id: b, text: { en: "Integration tests", fr: "Les tests d'intégration" } }
        - { id: c, text: { en: "User acceptance tests", fr: "Les tests d'acceptation utilisateur" } }
        - { id: d, text: { en: "Unit tests", fr: "Les tests unitaires" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The base of the pyramid is made of many fast unit tests that check individual functions in isolation. Above them come fewer integration tests, and at the top a small number of end-to-end tests and UAT scenarios.
        fr: |
          La base de la pyramide est constituée de nombreux tests unitaires rapides qui vérifient des fonctions isolément. Au-dessus viennent moins de tests d'intégration, et au sommet un petit nombre de tests de bout en bout et de scénarios UAT.
      options:
        a: { en: "End-to-end tests run complete workflows; they are slow and sit at the top of the pyramid, in small numbers.", fr: "Les tests de bout en bout exécutent des flux complets ; ils sont lents et se trouvent au sommet de la pyramide, en petit nombre." }
        b: { en: "Integration tests are the middle layer: fewer than unit tests, because they need real Databricks resources.", fr: "Les tests d'intégration forment la couche intermédiaire : moins nombreux que les tests unitaires, car ils demandent de vraies ressources Databricks." }
        c: { en: "UAT scenarios are run by stakeholders on business cases and sit at the top of the pyramid.", fr: "Les scénarios UAT sont exécutés par les parties prenantes sur des cas métier et se trouvent au sommet de la pyramide." }
    references:
      - title: Implement Testing Strategy - Training
        url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy

  # ------------------------------------------------------------------ 3
  - id: dp750-qz-43-03
    objective: "4.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware deployed a bundle to its `prod` target last week. An operator must configure an external scheduler with the ID of one of the deployed jobs, and asks for the list of the deployed resources with a link to each of them in the workspace.

        The bundle must not be changed or redeployed.

        Which command should you run?
      fr: |
        Litware a déployé un bundle sur sa cible `prod` la semaine dernière. Un opérateur doit configurer un planificateur externe avec l'ID de l'un des jobs déployés, et demande la liste des ressources déployées avec un lien vers chacune d'elles dans l'espace de travail.

        Le bundle ne doit être ni modifié ni redéployé.

        Quelle commande devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "databricks bundle validate -t prod" }
        - { id: b, text: "databricks bundle summary -t prod" }
        - { id: c, text: "databricks bundle plan -t prod" }
        - { id: d, text: "databricks bundle deploy -t prod --auto-approve" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `bundle summary` outputs the identity of the deployment and its resources, with a deep link to each resource in the workspace; the links contain the resource IDs. It reads the deployed state and changes nothing.
        fr: |
          `bundle summary` affiche l'identité du déploiement et ses ressources, avec un lien direct vers chaque ressource dans l'espace de travail ; les liens contiennent les ID des ressources. La commande lit l'état déployé et ne modifie rien.
      options:
        a: { en: "validate checks the configuration and prints the identity summary, but not the deployed resources with their links.", fr: "validate vérifie la configuration et affiche le résumé de l'identité, mais pas les ressources déployées avec leurs liens." }
        c: { en: "plan shows the actions that a deployment would perform, not the IDs of the resources already deployed.", fr: "plan montre les actions qu'effectuerait un déploiement, pas les ID des ressources déjà déployées." }
        d: { en: "deploy redeploys the bundle, which the requirement forbids; --auto-approve only skips the prompts.", fr: "deploy redéploie le bundle, ce que l'exigence interdit ; --auto-approve ne fait qu'ignorer les invites." }
    references:
      - title: bundle command group - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands

  # ------------------------------------------------------------------ 4
  - id: dp750-qz-43-04
    objective: "4.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind's bundle defines a job with the resource key **daily_sales**. The job reads the catalog name from the custom variable `${var.catalog}`, which the `prod` target sets to `prod_sales`.

        Analysts sometimes need to rerun the deployed job in production for an earlier business date. Each time, the date must apply to that single run only, without redeploying the bundle.

        What should you do?
      fr: |
        Le bundle de Northwind définit un job dont la clé de ressource est **daily_sales**. Le job lit le nom du catalogue dans la variable personnalisée `${var.catalog}`, que la cible `prod` définit sur `prod_sales`.

        Les analystes doivent parfois réexécuter le job déployé en production pour une date métier antérieure. Chaque fois, la date doit s'appliquer à cette seule exécution, sans redéployer le bundle.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Declare a custom variable `run_date`, and pass `--var` to `databricks bundle run`.", fr: "Déclarer une variable personnalisée `run_date`, et passer `--var` à `databricks bundle run`." } }
        - { id: b, text: { en: "Declare a job parameter `run_date` in the job, and set its value for the run.", fr: "Déclarer un paramètre de job `run_date` dans le job, et définir sa valeur pour l'exécution." } }
        - { id: c, text: { en: "Declare a custom variable `run_date`, and set `BUNDLE_VAR_run_date` before the run.", fr: "Déclarer une variable personnalisée `run_date`, et définir `BUNDLE_VAR_run_date` avant l'exécution." } }
        - { id: d, text: { en: "Set `run_date` in the `base_parameters` of the task, and redeploy with each date.", fr: "Définir `run_date` dans les `base_parameters` de la tâche, et redéployer avec chaque date." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Bundle variables are resolved at deployment time: a run executes the job as it was deployed, so a variable value passed at run time has no effect. A job parameter is passed to the tasks of the run and can be overridden for each run, for example with `bundle run --params` or Run now with different parameters.
        fr: |
          Les variables de bundle sont résolues au moment du déploiement : une exécution lance le job tel qu'il a été déployé, donc une valeur de variable passée au moment de l'exécution n'a aucun effet. Un paramètre de job est transmis aux tâches de l'exécution et peut être remplacé à chaque exécution, par exemple avec `bundle run --params` ou Run now avec d'autres paramètres.
      options:
        a: { en: "--var sets a deployment-time value; on bundle run it doesn't change the already deployed job.", fr: "--var définit une valeur de déploiement ; avec bundle run, elle ne modifie pas le job déjà déployé." }
        c: { en: "BUNDLE_VAR_ variables are read when the bundle is deployed; the date would need a new deployment.", fr: "Les variables BUNDLE_VAR_ sont lues au déploiement du bundle ; la date demanderait un nouveau déploiement." }
        d: { en: "base_parameters are part of the deployed task definition: changing the date requires a new deployment each time.", fr: "Les base_parameters font partie de la définition déployée de la tâche : changer la date demande un nouveau déploiement à chaque fois." }
    references:
      - title: Substitutions and variables in Declarative Automation Bundles - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/variables

  # ------------------------------------------------------------------ 5
  - id: dp750-qz-43-05
    objective: "4.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An admin at Tailspin created the production Git folder `/Workspace/Production/claims-etl` on the `main` branch of a GitHub repository. Engineers have the Can Run permission on the folder.

        A GitHub Actions workflow must update the folder through the Repos API each time a pull request is merged into main. The workflow authenticates as a service principal named **sp-release**, which can edit the folder. The update fails because sp-release can't pull from the remote repository.

        What should you do?
      fr: |
        Un administrateur de Tailspin a créé le dossier Git de production `/Workspace/Production/claims-etl` sur la branche `main` d'un dépôt GitHub. Les ingénieurs disposent de l'autorisation Can Run sur le dossier.

        Un workflow GitHub Actions doit mettre à jour le dossier par l'API Repos chaque fois qu'une pull request est fusionnée dans main. Le workflow s'authentifie en tant que principal de service nommé **sp-release**, qui peut modifier le dossier. La mise à jour échoue parce que sp-release ne peut pas tirer (pull) depuis le dépôt distant.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Grant sp-release the Can Run permission on the production Git folder.", fr: "Accorder à sp-release l'autorisation Can Run sur le dossier Git de production." } }
        - { id: b, text: { en: "Move the production Git folder under the /Workspace/Users/ folder of sp-release.", fr: "Déplacer le dossier Git de production sous le dossier /Workspace/Users/ de sp-release." } }
        - { id: c, text: { en: "Give the engineers Can Edit so that one of them pulls main after each merge.", fr: "Donner Can Edit aux ingénieurs pour que l'un d'eux tire main après chaque fusion." } }
        - { id: d, text: { en: "Configure a Git credential for sp-release that can access the GitHub repository.", fr: "Configurer pour sp-release des informations d'identification Git qui accèdent au dépôt GitHub." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A Git folder pulls from the remote repository with the Git credential of the identity that runs the operation. For automation, you create or use a service principal and configure a Git credential for it, so that it can access the repository and update the production Git folder when pull requests are merged.
        fr: |
          Un dossier Git tire depuis le dépôt distant avec les informations d'identification Git de l'identité qui exécute l'opération. Pour l'automatisation, vous créez ou utilisez un principal de service et configurez pour lui des informations d'identification Git, afin qu'il accède au dépôt et mette à jour le dossier Git de production quand des pull requests sont fusionnées.
      options:
        a: { en: "sp-release can already edit the folder; workspace permissions don't give access to the GitHub repository.", fr: "sp-release peut déjà modifier le dossier ; les autorisations de l'espace de travail ne donnent pas accès au dépôt GitHub." }
        b: { en: "Production Git folders are created outside user folders, and moving the folder doesn't give access to the repository.", fr: "Les dossiers Git de production sont créés hors des dossiers utilisateur, et déplacer le dossier ne donne pas accès au dépôt." }
        c: { en: "Production Git folders should be updated only by automation, with run-only access for most users.", fr: "Les dossiers Git de production ne doivent être mis à jour que par l'automatisation, avec un accès en exécution seule pour la plupart des utilisateurs." }
    references:
      - title: CI/CD with Databricks Git folders - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/repos/ci-cd

  # ------------------------------------------------------------------ 6
  - id: dp750-qz-43-06
    objective: "4.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum's bundle defines two jobs: **load_orders**, and **refresh_reports**, which has a daily schedule. The bundle has a `dev` target in development mode and a `prod` target in production mode, and each target deploys to a different workspace.

        The bundle must meet the following requirements:

        - The first task of refresh_reports must run the whole load_orders job.
        - The ID of load_orders, which differs in each workspace, must be resolved when the bundle is deployed.
        - In the dev target, the schedule of refresh_reports must fire every day. Other schedules can stay paused in dev.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le bundle d'Adatum définit deux jobs : **load_orders**, et **refresh_reports**, qui a une planification quotidienne. Le bundle a une cible `dev` en mode development et une cible `prod` en mode production, et chaque cible déploie dans un espace de travail différent.

        Le bundle doit répondre aux exigences suivantes :

        - La première tâche de refresh_reports doit exécuter tout le job load_orders.
        - L'ID de load_orders, qui diffère dans chaque espace de travail, doit être résolu au déploiement du bundle.
        - Dans la cible dev, la planification de refresh_reports doit se déclencher chaque jour. Les autres planifications peuvent rester en pause dans dev.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: yaml
      template: |
        resources:
          jobs:
            load_orders:
              name: load_orders
              tasks:
                - task_key: load
                  notebook_task:
                    notebook_path: ../src/load_orders.ipynb
            refresh_reports:
              name: refresh_reports
              schedule:
                quartz_cron_expression: '0 0 6 * * ?'
                timezone_id: UTC
                [[pause]]: UNPAUSED
              tasks:
                - task_key: run_load
                  [[tasktype]]:
                    job_id: [[ref]]
                - task_key: publish
                  depends_on:
                    - task_key: run_load
                  notebook_task:
                    notebook_path: ../src/publish.ipynb
      slots:
        - id: pause
          options:
            - { id: trigger, text: "trigger_pause_status" }
            - { id: status, text: "pause_status" }
            - { id: maxruns, text: "max_concurrent_runs" }
        - id: tasktype
          options:
            - { id: pipeline, text: "pipeline_task" }
            - { id: notebook, text: "notebook_task" }
            - { id: runjob, text: "run_job_task" }
            - { id: condition, text: "condition_task" }
        - id: ref
          options:
            - { id: id, text: "${resources.jobs.load_orders.id}" }
            - { id: name, text: "${resources.jobs.load_orders.name}" }
            - { id: var, text: "${var.load_orders_id}" }
    answer:
      values: { pause: status, tasktype: runjob, ref: id }
    explanation:
      correct:
        en: |
          Development mode pauses every schedule and trigger, but a resource's own setting wins: `schedule.pause_status: UNPAUSED` keeps that one schedule active. A `run_job_task` runs another job, identified by its `job_id`. The substitution `${resources.jobs.load_orders.id}` resolves, at deployment, to the ID of the load_orders job deployed in the same target, so each workspace gets its own ID.
        fr: |
          Le mode development met en pause toutes les planifications et tous les déclencheurs, mais le paramètre propre à une ressource l'emporte : `schedule.pause_status: UNPAUSED` garde cette planification active. Une tâche `run_job_task` exécute un autre job, identifié par son `job_id`. La substitution `${resources.jobs.load_orders.id}` est résolue, au déploiement, en l'ID du job load_orders déployé dans la même cible : chaque espace de travail reçoit son propre ID.
      options:
        trigger: { en: "trigger_pause_status is a preset of a target, not a field of a job schedule.", fr: "trigger_pause_status est un preset de cible, pas un champ de la planification d'un job." }
        name: { en: "job_id expects the numeric ID of the job, not its name.", fr: "job_id attend l'ID numérique du job, pas son nom." }
        var: { en: "No custom variable holds the ID; a variable would need a value per target, while the substitution resolves it automatically.", fr: "Aucune variable personnalisée ne contient l'ID ; une variable demanderait une valeur par cible, alors que la substitution le résout automatiquement." }
    references:
      - title: Declarative Automation Bundles deployment modes - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
      - title: Substitutions and variables in Declarative Automation Bundles - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/variables

  # ------------------------------------------------------------------ 7
  - id: dp750-qz-43-07
    objective: "4.3.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank deploys a bundle named **risk-etl** to its `prod` target from a CI pipeline that runs the Databricks CLI as a service principal. The bundle defines the jobs **daily_risk** and **cleanup_tmp**, and both are deployed.

        In the next release, a developer removes cleanup_tmp from the configuration and changes the `name` field of daily_risk to `daily_risk_v2`, keeping its resource key.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank déploie un bundle nommé **risk-etl** sur sa cible `prod` depuis un pipeline CI qui exécute l'interface CLI Databricks en tant que principal de service. Le bundle définit les jobs **daily_risk** et **cleanup_tmp**, et les deux sont déployés.

        Dans la version suivante, un développeur retire cleanup_tmp de la configuration et remplace le champ `name` de daily_risk par `daily_risk_v2`, en conservant sa clé de ressource.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: The next `databricks bundle deploy -t prod` deletes the cleanup_tmp job from the workspace.
            fr: Le prochain `databricks bundle deploy -t prod` supprime le job cleanup_tmp de l'espace de travail.
        - id: s2
          text:
            en: The next deployment deletes daily_risk and creates a new job named daily_risk_v2.
            fr: Le prochain déploiement supprime daily_risk et crée un nouveau job nommé daily_risk_v2.
        - id: s3
          text:
            en: If a run of daily_risk is active, `databricks bundle run -t prod --restart daily_risk` cancels it and starts a new run.
            fr: Si une exécution de daily_risk est active, `databricks bundle run -t prod --restart daily_risk` l'annule et lance une nouvelle exécution.
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A deployment tracks resources by ID in the workspace state, not by name. A resource removed from the configuration is removed from the target workspace, so cleanup_tmp is deleted, while a new name under the same resource key updates the existing job, which keeps its ID and run history. `bundle run --restart` restarts the run if it is already running, which cancels the active run and starts a new one.
        fr: |
          Un déploiement suit les ressources par ID dans l'état de l'espace de travail, pas par nom. Une ressource retirée de la configuration est supprimée de l'espace de travail cible : cleanup_tmp est donc supprimé, alors qu'un nouveau nom sous la même clé de ressource met à jour le job existant, qui garde son ID et son historique d'exécutions. `bundle run --restart` redémarre l'exécution si elle est déjà en cours : l'exécution active est annulée et une nouvelle démarre.
    references:
      - title: bundle command group - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/bundle-commands

  # ------------------------------------------------------------------ 8
  - id: dp750-qz-43-08
    objective: "4.3.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware deploys only code to its production workspace: the notebooks are in the production Git folder `/Workspace/Production/risk`, which tracks the `main` branch. The jobs that run these notebooks are managed by the platform team, and the release process must not create or change any job.

        You are designing the release step of the CI/CD system. The step must meet the following requirements:

        - The folder must contain the new code within minutes of each change reaching main.
        - No user account or user credential can be used.
        - No manual action is allowed.

        How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware ne déploie que du code dans son espace de travail de production : les notebooks sont dans le dossier Git de production `/Workspace/Production/risk`, qui suit la branche `main`. Les jobs qui exécutent ces notebooks sont gérés par l'équipe plateforme, et le processus de mise en production ne doit créer ni modifier aucun job.

        Vous concevez l'étape de mise en production du système CI/CD. L'étape doit répondre aux exigences suivantes :

        - Le dossier doit contenir le nouveau code dans les minutes qui suivent l'arrivée de chaque modification dans main.
        - Aucun compte utilisateur ni aucune information d'identification d'utilisateur ne peut être utilisé.
        - Aucune action manuelle n'est autorisée.

        Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Start the step: [[when]]

          Authenticate the step as: [[identity]]

          In the step, call: [[op]]
        fr: |
          Lancer l'étape : [[when]]

          Authentifier l'étape en tant que : [[identity]]

          Dans l'étape, appeler : [[op]]
      slots:
        - id: when
          options:
            - { id: opened, text: { en: "when a pull request into main is opened", fr: "quand une pull request vers main est ouverte" } }
            - { id: merged, text: { en: "when a pull request is merged into main", fr: "quand une pull request est fusionnée dans main" } }
            - { id: nightly, text: { en: "every night at 02:00, from a scheduled job", fr: "chaque nuit à 02:00, depuis un job planifié" } }
        - id: identity
          options:
            - { id: admin, text: { en: "the workspace admin who created the folder", fr: "l'administrateur de l'espace de travail qui a créé le dossier" } }
            - { id: pat, text: { en: "the release manager, with a personal access token", fr: "le responsable des mises en production, avec un jeton d'accès personnel" } }
            - { id: sp, text: { en: "a service principal that has a Git credential", fr: "un principal de service qui a des informations d'identification Git" } }
        - id: op
          options:
            - { id: deploy, text: { en: "databricks bundle deploy -t prod", fr: "databricks bundle deploy -t prod" } }
            - { id: repos, text: { en: "the Repos API, to update the folder to main", fr: "l'API Repos, pour mettre à jour le dossier sur main" } }
            - { id: reset, text: { en: "the Jobs API jobs/reset endpoint for each job", fr: "le point de terminaison jobs/reset de l'API Jobs pour chaque job" } }
    answer:
      values: { when: merged, identity: sp, op: repos }
    explanation:
      correct:
        en: |
          A production Git folder is updated only by automation when pull requests are merged into its deployment branch. The automation runs as a service principal that has a Git credential for the repository, which avoids any user credential. Updating the folder through the Repos API (for example with the `repos.update` call of the Databricks SDK for Python) refreshes the code without touching the jobs.
        fr: |
          Un dossier Git de production n'est mis à jour que par l'automatisation, quand des pull requests sont fusionnées dans sa branche de déploiement. L'automatisation s'exécute en tant que principal de service doté d'informations d'identification Git pour le dépôt, ce qui évite toute information d'identification d'utilisateur. Mettre à jour le dossier par l'API Repos (par exemple avec l'appel `repos.update` du SDK Databricks pour Python) actualise le code sans toucher aux jobs.
      options:
        opened: { en: "An opened pull request isn't merged yet: its code hasn't reached main.", fr: "Une pull request ouverte n'est pas encore fusionnée : son code n'a pas atteint main." }
        nightly: { en: "A nightly job is the fallback when no CI/CD system exists; it doesn't deliver the code within minutes.", fr: "Un job nocturne est la solution de repli sans système CI/CD ; il ne livre pas le code en quelques minutes." }
        admin: { en: "The admin is a user account, which the requirements exclude.", fr: "L'administrateur est un compte utilisateur, ce que les exigences excluent." }
        pat: { en: "A personal access token is a user credential, which the requirements exclude.", fr: "Un jeton d'accès personnel est une information d'identification d'utilisateur, ce que les exigences excluent." }
        deploy: { en: "Proseware has no bundle here, and a bundle deployment creates and updates jobs, which the release must not do.", fr: "Proseware n'a pas de bundle ici, et un déploiement de bundle crée et met à jour des jobs, ce que la mise en production ne doit pas faire." }
        reset: { en: "jobs/reset replaces job settings: it changes jobs and doesn't update the code of the folder.", fr: "jobs/reset remplace les paramètres d'un job : il modifie des jobs et ne met pas à jour le code du dossier." }
    references:
      - title: CI/CD with Databricks Git folders - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/repos/ci-cd

  # ------------------------------------------------------------------ 9
  - id: dp750-qz-43-09
    objective: "4.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        At Fabrikam, the function `dedupe_orders(df)` is defined in a cell of the notebook **clean_orders**, which also writes its result to `fabrikam_prod.silver.orders`. The project is in a Git folder and has a `tests/unit/` folder.

        You need to add unit tests for dedupe_orders that meet the following requirements:

        - pytest discovers the tests automatically when it runs `tests/`.
        - The tests read no table and never run the write to fabrikam_prod.silver.orders.
        - The test data is reusable across tests and contains no production data.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Chez Fabrikam, la fonction `dedupe_orders(df)` est définie dans une cellule du notebook **clean_orders**, qui écrit aussi son résultat dans `fabrikam_prod.silver.orders`. Le projet se trouve dans un dossier Git et contient un dossier `tests/unit/`.

        Vous devez ajouter des tests unitaires pour dedupe_orders qui répondent aux exigences suivantes :

        - pytest découvre les tests automatiquement quand il exécute `tests/`.
        - Les tests ne lisent aucune table et n'exécutent jamais l'écriture dans fabrikam_prod.silver.orders.
        - Les données de test sont réutilisables d'un test à l'autre et ne contiennent aucune donnée de production.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Move dedupe_orders into `src/transforms.py`, and import it into clean_orders.", fr: "Déplacer dedupe_orders dans `src/transforms.py`, et l'importer dans clean_orders." } }
        - { id: b, text: { en: "Write the tests in `tests/unit/transforms_checks.py`, with a `@pytest.fixture` of synthetic rows.", fr: "Écrire les tests dans `tests/unit/transforms_checks.py`, avec une `@pytest.fixture` de lignes synthétiques." } }
        - { id: c, text: { en: "Write the tests in `tests/unit/test_transforms.py`, with a `@pytest.fixture` of synthetic rows.", fr: "Écrire les tests dans `tests/unit/test_transforms.py`, avec une `@pytest.fixture` de lignes synthétiques." } }
        - { id: d, text: { en: "Run clean_orders from the test file with `%run`, and then call dedupe_orders.", fr: "Exécuter clean_orders depuis le fichier de test avec `%run`, puis appeler dedupe_orders." } }
        - { id: e, text: { en: "Load a sample of fabrikam_prod.silver.orders into a test catalog for the tests.", fr: "Charger un échantillon de fabrikam_prod.silver.orders dans un catalogue de test pour les tests." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Databricks recommends storing functions in `.py` files of the Git folder and importing them into notebooks: the tests can then import dedupe_orders without running the notebook and its write. pytest collects files whose names start with `test_` or end with `_test.py`, and a `@pytest.fixture` provides reusable synthetic data that mirrors the production structure without exposing production data.
        fr: |
          Databricks recommande de placer les fonctions dans des fichiers `.py` du dossier Git et de les importer dans les notebooks : les tests peuvent alors importer dedupe_orders sans exécuter le notebook ni son écriture. pytest collecte les fichiers dont le nom commence par `test_` ou se termine par `_test.py`, et une `@pytest.fixture` fournit des données synthétiques réutilisables qui reproduisent la structure de production sans exposer de données de production.
      options:
        b: { en: "transforms_checks.py neither starts with test_ nor ends with _test.py, so pytest doesn't collect it.", fr: "transforms_checks.py ne commence pas par test_ et ne se termine pas par _test.py : pytest ne le collecte pas." }
        d: { en: "%run executes the whole notebook, including its write to the production table.", fr: "%run exécute tout le notebook, y compris son écriture dans la table de production." }
        e: { en: "A test catalog with table samples is for integration tests; these unit tests must read no table and use no production data.", fr: "Un catalogue de test avec des échantillons de tables sert aux tests d'intégration ; ces tests unitaires ne doivent lire aucune table ni utiliser de données de production." }
    references:
      - title: Implement Testing Strategy - Training
        url: https://learn.microsoft.com/en-us/training/modules/implement-development-lifecycle-processes-in-azure-databricks/4-implement-testing-strategy

  # ------------------------------------------------------------------ 10
  - id: dp750-qz-43-10
    objective: "4.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso's bundle has the following `prod` target. No service principal is available yet, so the jobs must run as a user named lena@contoso.com, and Lena deploys from the `main` branch.

        ```yaml
        targets:
          prod:
            mode: production
            git:
              branch: main
            workspace:
              host: https://adb-2222222222222222.12.azuredatabricks.net
              root_path: /Workspace/Users/lena@contoso.com/.bundle/${bundle.name}/${bundle.target}
        ```

        `databricks bundle deploy -t prod` fails the validations of production mode. You need the deployment to pass these validations without bypassing any of them.

        Which two changes should you make to the prod target? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le bundle de Contoso a la cible `prod` suivante. Aucun principal de service n'est encore disponible : les jobs doivent donc s'exécuter en tant qu'utilisateur nommé lena@contoso.com, et Lena déploie depuis la branche `main`.

        ```yaml
        targets:
          prod:
            mode: production
            git:
              branch: main
            workspace:
              host: https://adb-2222222222222222.12.azuredatabricks.net
              root_path: /Workspace/Users/lena@contoso.com/.bundle/${bundle.name}/${bundle.target}
        ```

        `databricks bundle deploy -t prod` échoue aux validations du mode production. Le déploiement doit réussir ces validations sans en contourner aucune.

        Quelles sont les deux modifications que vous devez apporter à la cible prod ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set root_path to a shared folder, such as `/Workspace/Shared/.bundle/${bundle.name}/${bundle.target}`.", fr: "Définir root_path sur un dossier partagé, comme `/Workspace/Shared/.bundle/${bundle.name}/${bundle.target}`." } }
        - { id: b, text: { en: "Add `run_as` with Lena's user name, and a `permissions` mapping for the target.", fr: "Ajouter `run_as` avec le nom d'utilisateur de Lena, et un mappage `permissions` pour la cible." } }
        - { id: c, text: { en: "Add `presets` with `name_prefix` and `trigger_pause_status` set for the target.", fr: "Ajouter des `presets` avec `name_prefix` et `trigger_pause_status` définis pour la cible." } }
        - { id: d, text: { en: "Remove the `git` mapping so that the branch of the deployment isn't checked.", fr: "Supprimer le mappage `git` pour que la branche du déploiement ne soit pas vérifiée." } }
        - { id: e, text: { en: "Add `cluster_id` with the ID of an existing cluster that runs the production jobs.", fr: "Ajouter `cluster_id` avec l'ID d'un cluster existant qui exécute les jobs de production." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          When `run_as` isn't a service principal, production mode adds two checks: `root_path` (and `artifact_path`, `file_path`, `state_path`) must not be overridden to a specific user, and the `run_as` and `permissions` mappings must be specified. A shared root path and explicit `run_as` and `permissions` meet both. Lena deploys from main, so the `git.branch` check already passes.
        fr: |
          Quand `run_as` n'est pas un principal de service, le mode production ajoute deux vérifications : `root_path` (ainsi que `artifact_path`, `file_path`, `state_path`) ne doit pas être remplacé par un chemin propre à un utilisateur, et les mappages `run_as` et `permissions` doivent être définis. Un chemin racine partagé et des mappages `run_as` et `permissions` explicites satisfont les deux. Lena déploie depuis main : la vérification `git.branch` réussit déjà.
      options:
        c: { en: "Presets adjust names, schedules and other settings; they don't satisfy the run_as, permissions and path checks.", fr: "Les presets ajustent les noms, les planifications et d'autres paramètres ; ils ne satisfont pas les vérifications de run_as, de permissions et de chemin." }
        d: { en: "The branch check already passes from main, and removing it weakens the safeguards instead of fixing the failing ones.", fr: "La vérification de branche réussit déjà depuis main, et la supprimer affaiblit les protections au lieu de corriger celles qui échouent." }
        e: { en: "Production mode doesn't allow overriding cluster definitions with cluster_id or --cluster-id.", fr: "Le mode production n'autorise pas le remplacement des définitions de cluster par cluster_id ou --cluster-id." }
    references:
      - title: Declarative Automation Bundles deployment modes - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/deployment-modes
