chapter: 33-ingestion
questions:
  # ------------------------------------------------------------------ 1
  - id: dp750-qz-33-01
    objective: "3.2.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is writing the SQL source of a Lakeflow Spark Declarative Pipelines pipeline. The streaming table **fabrikam.bronze.invoices** must load the JSON files that arrive in the volume path **/Volumes/fabrikam/landing/raw/invoices/** incrementally, by using Auto Loader.

        Which clause should the query of the streaming table use to read the files?
      fr: |
        Fabrikam écrit la source SQL d'un pipeline Lakeflow Spark Declarative Pipelines. La table de streaming **fabrikam.bronze.invoices** doit charger de façon incrémentielle, au moyen d'Auto Loader, les fichiers JSON qui arrivent dans le chemin de volume **/Volumes/fabrikam/landing/raw/invoices/**.

        Quelle clause la requête de la table de streaming doit-elle utiliser pour lire les fichiers ?
    body:
      options:
        - { id: a, text: "FROM read_files('/Volumes/fabrikam/landing/raw/invoices/', format => 'json')" }
        - { id: b, text: "FROM cloud_files_state('/Volumes/fabrikam/landing/raw/invoices/')" }
        - { id: c, text: "FROM STREAM read_files('/Volumes/fabrikam/landing/raw/invoices/', format => 'json')" }
        - { id: d, text: "FROM json.`/Volumes/fabrikam/landing/raw/invoices/`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `read_files` uses Auto Loader when it runs in the query of a streaming table, and the `STREAM` keyword is required there. The streaming table then discovers the new files and processes each one once, while the pipeline manages the checkpoint and the schema location.
        fr: |
          `read_files` utilise Auto Loader quand elle s'exécute dans la requête d'une table de streaming, et le mot clé `STREAM` y est obligatoire. La table de streaming découvre alors les nouveaux fichiers et traite chacun une seule fois, tandis que le pipeline gère le point de contrôle et l'emplacement du schéma.
      options:
        a: { en: "Without STREAM, read_files is a batch read of all the files of the path; a streaming table query must use STREAM to get Auto Loader.", fr: "Sans STREAM, read_files est une lecture par lots de tous les fichiers du chemin ; la requête d'une table de streaming doit utiliser STREAM pour bénéficier d'Auto Loader." }
        b: { en: "cloud_files_state returns the state of the files that an Auto Loader stream has discovered; it doesn't read their content.", fr: "cloud_files_state renvoie l'état des fichiers qu'un flux Auto Loader a découverts ; elle ne lit pas leur contenu." }
        d: { en: "Querying the path directly is a batch read of every file; it doesn't use Auto Loader and doesn't track the files already processed.", fr: "Interroger directement le chemin est une lecture par lots de chaque fichier ; cela n'utilise pas Auto Loader et ne suit pas les fichiers déjà traités." }
    references:
      - title: read_files table-valued function - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/read_files
      - title: Load data in pipelines - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/ldp/load

  # ------------------------------------------------------------------ 2
  - id: dp750-qz-33-02
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware plans to ingest Salesforce objects into the schema **litware.bronze** by using a Lakeflow Connect ingestion pipeline.

        Which objects does the pipeline write to in litware.bronze, and on which compute does it run?
      fr: |
        Litware prévoit d'ingérer des objets Salesforce dans le schéma **litware.bronze** au moyen d'un pipeline d'ingestion Lakeflow Connect.

        Dans quels objets de litware.bronze le pipeline écrit-il, et sur quel calcul s'exécute-t-il ?
    body:
      options:
        - { id: a, text: { en: "Materialized views, refreshed by a pipeline that runs on serverless compute", fr: "Des vues matérialisées, actualisées par un pipeline qui s'exécute sur le calcul serverless" } }
        - { id: b, text: { en: "Streaming tables, updated by a pipeline that runs on serverless compute", fr: "Des tables de streaming, mises à jour par un pipeline qui s'exécute sur le calcul serverless" } }
        - { id: c, text: { en: "Streaming tables, updated by a pipeline that runs on classic job compute that you size", fr: "Des tables de streaming, mises à jour par un pipeline qui s'exécute sur un calcul de job classique que vous dimensionnez" } }
        - { id: d, text: { en: "External Delta tables, loaded by COPY INTO statements that run on a SQL warehouse", fr: "Des tables Delta externes, chargées par des instructions COPY INTO qui s'exécutent sur un entrepôt SQL" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Lakeflow Connect managed connectors are built on serverless compute and Lakeflow pipelines. The ingestion pipeline writes the source objects to streaming tables in the destination catalog and schema: a full load on the first run, then only the changed data when the source supports it.
        fr: |
          Les connecteurs managés Lakeflow Connect reposent sur le calcul serverless et les pipelines Lakeflow. Le pipeline d'ingestion écrit les objets sources dans des tables de streaming du catalogue et du schéma de destination : un chargement complet à la première exécution, puis uniquement les données modifiées quand la source le permet.
      options:
        a: { en: "The connector writes streaming tables, which process new records incrementally; materialized views aren't its destination.", fr: "Le connecteur écrit des tables de streaming, qui traitent les nouveaux enregistrements de façon incrémentielle ; les vues matérialisées ne sont pas sa destination." }
        c: { en: "Managed ingestion pipelines run on serverless compute; you don't configure a classic cluster for them.", fr: "Les pipelines d'ingestion managés s'exécutent sur le calcul serverless ; vous ne configurez pas de cluster classique pour eux." }
        d: { en: "COPY INTO loads files from storage; Lakeflow Connect reads the SaaS source through its connection and writes streaming tables.", fr: "COPY INTO charge des fichiers depuis un stockage ; Lakeflow Connect lit la source SaaS par sa connexion et écrit des tables de streaming." }
    references:
      - title: Lakeflow Connect connector concepts - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/

  # ------------------------------------------------------------------ 3
  - id: dp750-qz-33-03
    objective: "3.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A data engineer at Adatum starts a Structured Streaming query in a Python notebook and assigns the returned object to a variable named `query`. The query writes to **adatum.bronze.clicks**.

        From the notebook code, the engineer needs the number of input rows per second and the duration of each of the last few micro-batches of the query.

        What should the engineer use?
      fr: |
        Un ingénieur données d'Adatum démarre une requête Structured Streaming dans un notebook Python et affecte l'objet renvoyé à une variable nommée `query`. La requête écrit dans **adatum.bronze.clicks**.

        Depuis le code du notebook, l'ingénieur a besoin du nombre de lignes d'entrée par seconde et de la durée de chacun des derniers micro-lots de la requête.

        Que doit utiliser l'ingénieur ?
    body:
      options:
        - { id: a, text: "query.status" }
        - { id: b, text: "query.explain()" }
        - { id: c, text: "query.awaitTermination()" }
        - { id: d, text: "query.recentProgress" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `recentProgress` returns an array of the most recent progress updates of the query. Each update describes one micro-batch, with metrics such as `batchId`, `numInputRows`, `inputRowsPerSecond`, `processedRowsPerSecond` and the `durationMs` values. `lastProgress` returns only the latest one.
        fr: |
          `recentProgress` renvoie un tableau des mises à jour de progression les plus récentes de la requête. Chaque mise à jour décrit un micro-lot, avec des métriques comme `batchId`, `numInputRows`, `inputRowsPerSecond`, `processedRowsPerSecond` et les valeurs `durationMs`. `lastProgress` ne renvoie que la dernière.
      options:
        a: { en: "status describes what the query is doing now, as a dict; it doesn't hold the metrics of past micro-batches.", fr: "status décrit ce que fait la requête en ce moment, sous forme de dictionnaire ; il ne contient pas les métriques des micro-lots passés." }
        b: { en: "explain() prints the logical and physical plans of the query for debugging, not its runtime metrics.", fr: "explain() affiche les plans logique et physique de la requête pour le débogage, pas ses métriques d'exécution." }
        c: { en: "awaitTermination() blocks the notebook until the query stops or fails; it returns no metrics.", fr: "awaitTermination() bloque le notebook jusqu'à l'arrêt ou l'échec de la requête ; il ne renvoie aucune métrique." }
    references:
      - title: StreamingQuery - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/streamingquery
      - title: Monitoring Structured Streaming queries on Azure Databricks - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/stream-monitoring

  # ------------------------------------------------------------------ 4
  - id: dp750-qz-33-04
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Every night, a notebook at Proseware reads the shipments of the day into a DataFrame named `df` and runs the following line.

        ```python
        df.write.saveAsTable("proseware.bronze.shipments")
        ```

        The first run created the table. The second run failed with an error that says the table already exists.

        Each run must add the shipments of the day to the rows already in the table. What should you change?
      fr: |
        Chaque nuit, un notebook de Proseware lit les expéditions du jour dans un DataFrame nommé `df` et exécute la ligne suivante.

        ```python
        df.write.saveAsTable("proseware.bronze.shipments")
        ```

        La première exécution a créé la table. La deuxième exécution a échoué avec une erreur indiquant que la table existe déjà.

        Chaque exécution doit ajouter les expéditions du jour aux lignes déjà présentes dans la table. Que devez-vous modifier ?
    body:
      options:
        - { id: a, text: "df.write.mode(\"ignore\").saveAsTable(\"proseware.bronze.shipments\")" }
        - { id: b, text: "df.write.mode(\"overwrite\").saveAsTable(\"proseware.bronze.shipments\")" }
        - { id: c, text: "df.write.mode(\"append\").saveAsTable(\"proseware.bronze.shipments\")" }
        - { id: d, text: "df.write.option(\"mergeSchema\", \"true\").saveAsTable(\"proseware.bronze.shipments\")" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The default save mode of `saveAsTable` is `error` (`errorifexists`): when the table exists, the write throws an exception. The `append` mode adds the rows of the DataFrame to the existing table, matching the columns by name.
        fr: |
          Le mode d'enregistrement par défaut de `saveAsTable` est `error` (`errorifexists`) : quand la table existe, l'écriture lève une exception. Le mode `append` ajoute les lignes du DataFrame à la table existante, en faisant correspondre les colonnes par leur nom.
      options:
        a: { en: "ignore does nothing when the table exists, so the shipments of the day would never be written.", fr: "ignore ne fait rien quand la table existe : les expéditions du jour ne seraient donc jamais écrites." }
        b: { en: "overwrite replaces the content of the table, so only the shipments of the last day would remain.", fr: "overwrite remplace le contenu de la table : seules les expéditions du dernier jour resteraient." }
        d: { en: "mergeSchema lets the write add new columns, but the mode stays the default error mode, so the run still fails.", fr: "mergeSchema permet à l'écriture d'ajouter de nouvelles colonnes, mais le mode reste le mode error par défaut : l'exécution échoue toujours." }
    references:
      - title: saveAsTable - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframewriter/saveAsTable

  # ------------------------------------------------------------------ 5
  - id: dp750-qz-33-05
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders uses a Lakeflow Connect ingestion pipeline with an ingestion gateway to ingest SQL Server tables into the schema **northwind.bronze**. The pipeline uses the default settings. Analysts query **northwind.bronze.products** throughout the day.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders utilise un pipeline d'ingestion Lakeflow Connect avec une passerelle d'ingestion pour ingérer des tables SQL Server dans le schéma **northwind.bronze**. Le pipeline utilise les paramètres par défaut. Les analystes interrogent **northwind.bronze.products** tout au long de la journée.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When a database administrator renames a column of dbo.products, the pipeline starts a full refresh of northwind.bronze.products by itself.", fr: "Quand un administrateur de base de données renomme une colonne de dbo.products, le pipeline lance de lui-même une actualisation complète de northwind.bronze.products." }
        - id: s2
          text: { en: "While the snapshot of a full refresh of dbo.products is in progress, analysts can still query the existing data of northwind.bronze.products.", fr: "Pendant l'instantané d'une actualisation complète de dbo.products, les analystes peuvent toujours interroger les données existantes de northwind.bronze.products." }
        - id: s3
          text: { en: "You can configure a full refresh window so that the snapshots of full refreshes run only at the hours and on the days that you choose.", fr: "Vous pouvez configurer une fenêtre d'actualisation complète pour que les instantanés des actualisations complètes ne s'exécutent qu'aux heures et aux jours que vous choisissez." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          The auto full refresh policy, which can react to column renames, truncates and incompatible schema changes, is off by default: without it, you trigger the full refresh yourself. During the snapshot, the destination streaming table keeps its existing data and stays available for queries; the refresh is then applied in a single update. A full refresh window schedules when the snapshots run.
        fr: |
          La stratégie d'actualisation complète automatique, qui peut réagir aux renommages de colonnes, aux troncatures et aux modifications de schéma incompatibles, est désactivée par défaut : sans elle, vous déclenchez vous-même l'actualisation complète. Pendant l'instantané, la table de streaming de destination conserve ses données existantes et reste disponible pour les requêtes ; l'actualisation est ensuite appliquée en une seule mise à jour. Une fenêtre d'actualisation complète planifie le moment où les instantanés s'exécutent.
      options:
        s1: { en: "Auto full refresh must be enabled at the pipeline or table level; by default, a rename requires a manual full refresh.", fr: "L'actualisation complète automatique doit être activée au niveau du pipeline ou de la table ; par défaut, un renommage exige une actualisation complète manuelle." }
    references:
      - title: Fully refresh target tables - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/full-refresh

  # ------------------------------------------------------------------ 6
  - id: dp750-qz-33-06
    objective: "3.2.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Lakeflow Spark Declarative Pipelines pipeline whose Python source contains the following streaming table.

        ```python
        @dp.table(name="contoso.bronze.readings")
        def readings():
            return (spark.readStream.format("cloudFiles")
                      .option("cloudFiles.format", "json")
                      .schema("device_id STRING, reading DECIMAL(10,3), read_ts TIMESTAMP")
                      .load("/Volumes/contoso/landing/raw/readings/"))
        ```

        Next month, the device vendor will add new top-level fields to the JSON files. The solution must meet the following requirements:

        - The device_id, reading and read_ts columns keep exactly the types shown in the code.
        - Every new field becomes a new column of contoso.bronze.readings without any further code change.
        - The update can fail once when a new field appears, if it then continues with the new column after a retry.

        What should you do?
      fr: |
        Contoso dispose d'un pipeline Lakeflow Spark Declarative Pipelines dont la source Python contient la table de streaming suivante.

        ```python
        @dp.table(name="contoso.bronze.readings")
        def readings():
            return (spark.readStream.format("cloudFiles")
                      .option("cloudFiles.format", "json")
                      .schema("device_id STRING, reading DECIMAL(10,3), read_ts TIMESTAMP")
                      .load("/Volumes/contoso/landing/raw/readings/"))
        ```

        Le mois prochain, le fournisseur des appareils ajoutera de nouveaux champs de premier niveau aux fichiers JSON. La solution doit répondre aux exigences suivantes :

        - Les colonnes device_id, reading et read_ts conservent exactement les types indiqués dans le code.
        - Chaque nouveau champ devient une nouvelle colonne de contoso.bronze.readings sans autre modification du code.
        - La mise à jour peut échouer une fois quand un nouveau champ apparaît, si elle continue ensuite avec la nouvelle colonne après une nouvelle tentative.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the schema call and add the option cloudFiles.schemaEvolutionMode set to addNewColumns.", fr: "Conserver l'appel à schema et ajouter l'option cloudFiles.schemaEvolutionMode définie sur addNewColumns." } }
        - { id: b, text: { en: "Keep the schema call and add the option cloudFiles.schemaEvolutionMode set to rescue.", fr: "Conserver l'appel à schema et ajouter l'option cloudFiles.schemaEvolutionMode définie sur rescue." } }
        - { id: c, text: { en: "Replace the schema call with the option cloudFiles.inferColumnTypes set to true.", fr: "Remplacer l'appel à schema par l'option cloudFiles.inferColumnTypes définie sur true." } }
        - { id: d, text: { en: "Replace the schema call with the option cloudFiles.schemaHints set to the same three columns.", fr: "Remplacer l'appel à schema par l'option cloudFiles.schemaHints définie sur les trois mêmes colonnes." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          When a schema is provided, the default evolution mode is `none`: new fields are ignored. `addNewColumns`, which fails the stream once, adds the new columns and continues after the restart, isn't allowed with a provided schema, but it works when the known columns are given as schema hints. Without a schema, `addNewColumns` is the default mode, and the hints keep the three columns at their exact types.
        fr: |
          Quand un schéma est fourni, le mode d'évolution par défaut est `none` : les nouveaux champs sont ignorés. `addNewColumns`, qui fait échouer le flux une fois, ajoute les nouvelles colonnes et continue après le redémarrage, n'est pas autorisé avec un schéma fourni, mais il fonctionne quand les colonnes connues sont données comme indicateurs de schéma. Sans schéma, `addNewColumns` est le mode par défaut, et les indicateurs maintiennent les trois colonnes à leurs types exacts.
      options:
        a: { en: "addNewColumns isn't allowed when the schema of the stream is provided; it works only when the schema is given as hints.", fr: "addNewColumns n'est pas autorisé quand le schéma du flux est fourni ; il ne fonctionne que si le schéma est donné sous forme d'indicateurs." }
        b: { en: "In rescue mode, the schema never evolves: the new fields go to the `_rescued_data` column instead of becoming columns.", fr: "En mode rescue, le schéma n'évolue jamais : les nouveaux champs vont dans la colonne `_rescued_data` au lieu de devenir des colonnes." }
        c: { en: "Inference picks the types from sample data, so reading isn't guaranteed to stay DECIMAL(10,3).", fr: "L'inférence choisit les types à partir d'un échantillon des données : rien ne garantit que reading reste en DECIMAL(10,3)." }
    references:
      - title: Configure schema inference and evolution in Auto Loader - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/auto-loader/schema

  # ------------------------------------------------------------------ 7
  - id: dp750-qz-33-07
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys receives JSON booking files several times a day in the volume path **/Volumes/tailspin/landing/raw/bookings/**, which already contains 2,000 files. The fields of the files vary from one partner to another, and partners add new fields over time. The table **tailspin.bronze.bookings** doesn't exist yet.

        You must implement the ingestion with SQL statements that run in a scheduled job. The solution must meet the following requirements:

        - Each file, including the 2,000 existing files, is loaded exactly once, even when a run is retried after a failure.
        - The columns of the table come from the fields of the files, and new fields become new columns.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys reçoit plusieurs fois par jour des fichiers JSON de réservations dans le chemin de volume **/Volumes/tailspin/landing/raw/bookings/**, qui contient déjà 2 000 fichiers. Les champs des fichiers varient d'un partenaire à l'autre, et les partenaires ajoutent de nouveaux champs au fil du temps. La table **tailspin.bronze.bookings** n'existe pas encore.

        Vous devez implémenter l'ingestion avec des instructions SQL exécutées dans un job planifié. La solution doit répondre aux exigences suivantes :

        - Chaque fichier, y compris les 2 000 fichiers existants, est chargé exactement une fois, même quand une exécution est relancée après un échec.
        - Les colonnes de la table proviennent des champs des fichiers, et les nouveaux champs deviennent de nouvelles colonnes.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Run `CREATE TABLE IF NOT EXISTS tailspin.bronze.bookings;` without a column list, before the first load.", fr: "Exécuter `CREATE TABLE IF NOT EXISTS tailspin.bronze.bookings;` sans liste de colonnes, avant le premier chargement." } }
        - { id: b, text: { en: "Run `CREATE TABLE tailspin.bronze.bookings AS SELECT * FROM read_files(...)` once on the path, before the first scheduled run.", fr: "Exécuter une fois `CREATE TABLE tailspin.bronze.bookings AS SELECT * FROM read_files(...)` sur le chemin, avant la première exécution planifiée." } }
        - { id: c, text: { en: "Schedule `COPY INTO` on the path with `FILEFORMAT = JSON`, `FORMAT_OPTIONS ('mergeSchema' = 'true')` and `COPY_OPTIONS ('mergeSchema' = 'true')`.", fr: "Planifier `COPY INTO` sur le chemin avec `FILEFORMAT = JSON`, `FORMAT_OPTIONS ('mergeSchema' = 'true')` et `COPY_OPTIONS ('mergeSchema' = 'true')`." } }
        - { id: d, text: { en: "Schedule `COPY INTO` on the path with `FILEFORMAT = JSON` and `COPY_OPTIONS ('force' = 'true')`.", fr: "Planifier `COPY INTO` sur le chemin avec `FILEFORMAT = JSON` et `COPY_OPTIONS ('force' = 'true')`." } }
        - { id: e, text: { en: "Schedule `INSERT INTO tailspin.bronze.bookings BY NAME SELECT * FROM read_files(...)` on the path.", fr: "Planifier `INSERT INTO tailspin.bronze.bookings BY NAME SELECT * FROM read_files(...)` sur le chemin." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          `COPY INTO` must target an existing Delta table, but the table can be created without a schema. `mergeSchema` in `FORMAT_OPTIONS` infers and merges the schema across the source files, and `mergeSchema` in `COPY_OPTIONS` evolves the table schema with the new fields. `COPY INTO` skips the files it has already loaded, so a retried run loads nothing twice.
        fr: |
          `COPY INTO` doit cibler une table Delta existante, mais la table peut être créée sans schéma. `mergeSchema` dans `FORMAT_OPTIONS` infère et fusionne le schéma de l'ensemble des fichiers sources, et `mergeSchema` dans `COPY_OPTIONS` fait évoluer le schéma de la table avec les nouveaux champs. `COPY INTO` ignore les fichiers qu'il a déjà chargés : une exécution relancée ne charge donc rien deux fois.
      options:
        b: { en: "The CTAS loads the 2,000 files outside COPY INTO, so they aren't among the files COPY INTO has loaded: its first run loads them a second time.", fr: "Le CTAS charge les 2 000 fichiers en dehors de COPY INTO : ils ne font pas partie des fichiers chargés par COPY INTO, dont la première exécution les charge une seconde fois." }
        d: { en: "force disables idempotency: every run reloads all the files of the path and duplicates the rows.", fr: "force désactive l'idempotence : chaque exécution recharge tous les fichiers du chemin et duplique les lignes." }
        e: { en: "INSERT INTO with read_files reads every file of the path at each run, so the rows are duplicated, and it doesn't add new columns.", fr: "INSERT INTO avec read_files lit tous les fichiers du chemin à chaque exécution : les lignes sont dupliquées, et de nouvelles colonnes ne sont pas ajoutées." }
    references:
      - title: Common data loading patterns using COPY INTO - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/copy-into/examples

  # ------------------------------------------------------------------ 8
  - id: dp750-qz-33-08
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        The core banking system of Woodgrove Bank sends account changes to the Delta table **woodgrove.bronze.account_cdc**, which has the following columns:

        - `account_id`, `status`, `branch_id` and `credit_limit`
        - `op`: `INSERT`, `UPDATE` or `DELETE`
        - `commit_seq`: a BIGINT that the source assigns in commit order
        - `ingested_at`: the time at which the record reached Azure Databricks

        Records can reach Azure Databricks out of order. An `UPDATE` record contains values only for the data columns that changed; its other data columns are NULL.

        You are writing the SQL source of a Lakeflow Spark Declarative Pipelines pipeline. The streaming table **accounts** must meet the following requirements:

        - It contains one row per account with the current values.
        - A data column that an `UPDATE` record doesn't change keeps its previous value.
        - Accounts deleted in the source are removed.
        - `op`, `commit_seq` and `ingested_at` aren't stored.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le système bancaire central de Woodgrove Bank envoie les modifications des comptes vers la table Delta **woodgrove.bronze.account_cdc**, qui contient les colonnes suivantes :

        - `account_id`, `status`, `branch_id` et `credit_limit`
        - `op` : `INSERT`, `UPDATE` ou `DELETE`
        - `commit_seq` : un BIGINT que la source attribue dans l'ordre des validations
        - `ingested_at` : l'heure à laquelle l'enregistrement est arrivé dans Azure Databricks

        Les enregistrements peuvent arriver dans Azure Databricks dans le désordre. Un enregistrement `UPDATE` ne contient des valeurs que pour les colonnes de données qui ont changé ; ses autres colonnes de données sont NULL.

        Vous écrivez la source SQL d'un pipeline Lakeflow Spark Declarative Pipelines. La table de streaming **accounts** doit répondre aux exigences suivantes :

        - Elle contient une ligne par compte avec les valeurs actuelles.
        - Une colonne de données qu'un enregistrement `UPDATE` ne modifie pas conserve sa valeur précédente.
        - Les comptes supprimés dans la source sont retirés.
        - `op`, `commit_seq` et `ingested_at` ne sont pas stockées.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        CREATE OR REFRESH STREAMING TABLE accounts;

        CREATE FLOW accounts_cdc AS AUTO CDC INTO accounts
        FROM stream(woodgrove.bronze.account_cdc)
        KEYS (account_id)
        [[nulls]]
        APPLY AS DELETE WHEN op = 'DELETE'
        SEQUENCE BY [[seq]]
        COLUMNS * EXCEPT ([[except]])
        STORED AS SCD TYPE 1;
      slots:
        - id: nulls
          options:
            - { id: ignore, text: IGNORE NULL UPDATES }
            - { id: ignorekey, text: IGNORE NULL UPDATES ON (account_id) }
            - { id: truncate, text: "APPLY AS TRUNCATE WHEN op = 'UPDATE'" }
        - id: seq
          options:
            - { id: ingested, text: ingested_at }
            - { id: commit, text: commit_seq }
            - { id: struct, text: "STRUCT(ingested_at, commit_seq)" }
        - id: except
          options:
            - { id: oponly, text: op }
            - { id: three, text: "op, commit_seq, ingested_at" }
            - { id: withkey, text: "account_id, op, commit_seq, ingested_at" }
    answer:
      values: { nulls: ignore, seq: commit, except: three }
    explanation:
      correct:
        en: |
          With `IGNORE NULL UPDATES`, the columns of a matching change that are NULL keep their existing values in the target, which handles partial updates; without it, NULLs overwrite the values. `SEQUENCE BY` must use the logical order of the changes in the source, `commit_seq`, to handle records that arrive out of order. `COLUMNS * EXCEPT` removes the three technical columns while keeping the key and the data columns.
        fr: |
          Avec `IGNORE NULL UPDATES`, les colonnes NULL d'une modification correspondante conservent leurs valeurs existantes dans la cible, ce qui gère les mises à jour partielles ; sans cette clause, les NULL écrasent les valeurs. `SEQUENCE BY` doit utiliser l'ordre logique des modifications dans la source, `commit_seq`, pour traiter les enregistrements qui arrivent dans le désordre. `COLUMNS * EXCEPT` retire les trois colonnes techniques en conservant la clé et les colonnes de données.
      options:
        ignorekey: { en: "With a column list, only the listed columns keep their values when NULL; status, branch_id and credit_limit would still be overwritten by NULLs.", fr: "Avec une liste de colonnes, seules les colonnes listées conservent leur valeur quand elles sont NULL ; status, branch_id et credit_limit seraient toujours écrasées par des NULL." }
        truncate: { en: "APPLY AS TRUNCATE WHEN empties the whole target table when the condition is true; it would wipe the table at every update.", fr: "APPLY AS TRUNCATE WHEN vide toute la table cible quand la condition est vraie ; il effacerait la table à chaque mise à jour." }
        ingested: { en: "ingested_at is the arrival order, not the order of the changes in the source; out-of-order records would leave a wrong final state.", fr: "ingested_at est l'ordre d'arrivée, pas l'ordre des modifications dans la source ; les enregistrements arrivés dans le désordre laisseraient un état final erroné." }
        struct: { en: "The STRUCT is ordered by its first field, ingested_at, so the changes would still be applied in arrival order.", fr: "Le STRUCT est ordonné d'abord par son premier champ, ingested_at : les modifications seraient donc toujours appliquées dans l'ordre d'arrivée." }
        oponly: { en: "Excluding only op would store commit_seq and ingested_at in the target table.", fr: "N'exclure que op stockerait commit_seq et ingested_at dans la table cible." }
        withkey: { en: "Excluding account_id would remove the key column from the target, which must contain one row per account.", fr: "Exclure account_id retirerait la colonne de clé de la cible, qui doit contenir une ligne par compte." }
    references:
      - title: AUTO CDC INTO (pipelines) - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/ldp/developer/ldp-sql-ref-apply-changes-into

  # ------------------------------------------------------------------ 9
  - id: dp750-qz-33-09
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Six days ago, Fabrikam created a Structured Streaming query that reads the Apache Kafka topic **orders**, parses the JSON value of each record and appends the result to the Delta table **fabrikam.bronze.orders**. The query sets `startingOffsets` to `latest` and uses the checkpoint location **/Volumes/fabrikam/raw/chk/orders_v1**. No other process writes to the table. The topic retains seven days of records.

        A parsing bug has written wrong amounts for the last five days. After you fix the parsing code, fabrikam.bronze.orders must contain every record retained in the topic, parsed with the fixed code, exactly once.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Il y a six jours, Fabrikam a créé une requête Structured Streaming qui lit le topic Apache Kafka **orders**, analyse la valeur JSON de chaque enregistrement et ajoute le résultat à la table Delta **fabrikam.bronze.orders**. La requête définit `startingOffsets` sur `latest` et utilise l'emplacement de point de contrôle **/Volumes/fabrikam/raw/chk/orders_v1**. Aucun autre processus n'écrit dans la table. Le topic conserve sept jours d'enregistrements.

        Un bogue d'analyse a écrit des montants erronés pendant les cinq derniers jours. Après la correction du code d'analyse, fabrikam.bronze.orders doit contenir chaque enregistrement conservé dans le topic, analysé avec le code corrigé, exactement une fois.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set startingOffsets to earliest and restart the query with the checkpoint location orders_v1.", fr: "Définir startingOffsets sur earliest et redémarrer la requête avec l'emplacement de point de contrôle orders_v1." } }
        - { id: b, text: { en: "Delete the rows of the last five days from fabrikam.bronze.orders before you start the query.", fr: "Supprimer de fabrikam.bronze.orders les lignes des cinq derniers jours avant de démarrer la requête." } }
        - { id: c, text: { en: "Set startingOffsets to earliest and start the query with the new checkpoint location orders_v2.", fr: "Définir startingOffsets sur earliest et démarrer la requête avec le nouvel emplacement de point de contrôle orders_v2." } }
        - { id: d, text: { en: "Delete all the rows of fabrikam.bronze.orders before you start the query.", fr: "Supprimer toutes les lignes de fabrikam.bronze.orders avant de démarrer la requête." } }
        - { id: e, text: { en: "Set the trigger to availableNow=True and restart the query with the checkpoint location orders_v1.", fr: "Définir le déclencheur sur availableNow=True et redémarrer la requête avec l'emplacement de point de contrôle orders_v1." } }
    answer: { optionIds: [c, d] }
    explanation:
      correct:
        en: |
          For a streaming query, `startingOffsets` applies only when a new query starts; a resumed query always uses its checkpoint. A new checkpoint location with `earliest` therefore reprocesses the seven retained days. Because those days include the six days already in the table, all the existing rows must be deleted first, or the reprocessed records would appear twice.
        fr: |
          Pour une requête de streaming, `startingOffsets` ne s'applique que quand une nouvelle requête démarre ; une requête reprise utilise toujours son point de contrôle. Un nouvel emplacement de point de contrôle avec `earliest` retraite donc les sept jours conservés. Comme ces jours incluent les six jours déjà présents dans la table, toutes les lignes existantes doivent d'abord être supprimées, sinon les enregistrements retraités apparaîtraient deux fois.
      options:
        a: { en: "With the same checkpoint, the query resumes from the stored offsets and ignores startingOffsets: nothing is reprocessed.", fr: "Avec le même point de contrôle, la requête reprend aux offsets stockés et ignore startingOffsets : rien n'est retraité." }
        b: { en: "Reprocessing from earliest also reloads the sixth day, whose rows would stay in the table and appear twice.", fr: "Le retraitement depuis earliest recharge aussi le sixième jour, dont les lignes resteraient dans la table et apparaîtraient deux fois." }
        e: { en: "availableNow changes when the query stops, not where it starts: with the same checkpoint, it only processes the new records.", fr: "availableNow change le moment où la requête s'arrête, pas son point de départ : avec le même point de contrôle, elle ne traite que les nouveaux enregistrements." }
    references:
      - title: Spark API options reference - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/spark/api-options

  # ------------------------------------------------------------------ 10
  - id: dp750-qz-33-10
    objective: "3.2.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso sends telemetry events to an event hub named **telemetry** in the Standard tier Azure Event Hubs namespace **evhns-contoso**. Shared access key authentication is disabled on the namespace. The Microsoft Entra service principal **sp-telemetry** has the Azure Event Hubs Data Receiver role on the namespace, and its client secret is stored in the secret **sp-telemetry-secret** of the secret scope **kv-contoso**.

        You are writing a notebook that runs on a cluster in dedicated access mode on Databricks Runtime 17.3 LTS. The variables `tenant_id` and `client_id` already contain the tenant ID and the application ID of sp-telemetry. The notebook must read the event hub through its Kafka endpoint by authenticating as sp-telemetry, and the client secret must not appear in the notebook.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso envoie des événements de télémétrie vers un hub d'événements nommé **telemetry** dans l'espace de noms Azure Event Hubs **evhns-contoso** de niveau Standard. L'authentification par clé d'accès partagé est désactivée sur l'espace de noms. Le principal de service Microsoft Entra **sp-telemetry** dispose du rôle Azure Event Hubs Data Receiver sur l'espace de noms, et sa clé secrète client est stockée dans le secret **sp-telemetry-secret** de l'étendue de secrets **kv-contoso**.

        Vous écrivez un notebook qui s'exécute sur un cluster en mode d'accès dédié sous Databricks Runtime 17.3 LTS. Les variables `tenant_id` et `client_id` contiennent déjà l'ID de locataire et l'ID d'application de sp-telemetry. Le notebook doit lire le hub d'événements par son point de terminaison Kafka en s'authentifiant en tant que sp-telemetry, et la clé secrète client ne doit pas apparaître dans le notebook.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        client_secret = [[secret]]
        server = "evhns-contoso.servicebus.windows.net"

        jaas = ("kafkashaded.org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required "
                f'clientId="{client_id}" clientSecret="{client_secret}" '
                f'scope="[[scope]]" ssl.protocol="SSL";')

        events = (spark.readStream.format("kafka")
            .option("kafka.bootstrap.servers", f"{server}:9093")
            .option("subscribe", "telemetry")
            .option("kafka.security.protocol", "SASL_SSL")
            .option("kafka.sasl.mechanism", "[[mech]]")
            .option("kafka.sasl.jaas.config", jaas)
            .option("kafka.sasl.oauthbearer.token.endpoint.url",
                    f"https://login.microsoft.com/{tenant_id}/oauth2/v2.0/token")
            .option("kafka.sasl.login.callback.handler.class", "[[handler]]")
            .load())
      slots:
        - id: secret
          options:
            - { id: widget, text: "dbutils.widgets.get(\"sp-telemetry-secret\")" }
            - { id: secrets, text: "dbutils.secrets.get(scope=\"kv-contoso\", key=\"sp-telemetry-secret\")" }
            - { id: conf, text: "spark.conf.get(\"kv-contoso.sp-telemetry-secret\")" }
        - id: scope
          options:
            - { id: arm, text: "https://management.azure.com/.default" }
            - { id: ns, text: "https://{server}/.default" }
            - { id: storage, text: "https://storage.azure.com/.default" }
        - id: mech
          options:
            - { id: plain, text: PLAIN }
            - { id: oauth, text: OAUTHBEARER }
            - { id: scram, text: SCRAM-SHA-256 }
        - id: handler
          options:
            - { id: unshaded, text: org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerLoginCallbackHandler }
            - { id: shaded, text: kafkashaded.org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerLoginCallbackHandler }
            - { id: module, text: kafkashaded.org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule }
    answer:
      values: { secret: secrets, scope: ns, mech: oauth, handler: shaded }
    explanation:
      correct:
        en: |
          With a Microsoft Entra service principal, the client secret is read from the secret scope, and the Kafka client requests an OAuth token whose scope is the namespace host followed by `/.default`. The SASL mechanism is `OAUTHBEARER`, and the login callback handler is the OAuth bearer handler. Azure Databricks ships shaded Kafka client libraries, so every class name in the authentication options must start with `kafkashaded.`.
        fr: |
          Avec un principal de service Microsoft Entra, la clé secrète client est lue dans l'étendue de secrets, et le client Kafka demande un jeton OAuth dont l'étendue est l'hôte de l'espace de noms suivi de `/.default`. Le mécanisme SASL est `OAUTHBEARER`, et le gestionnaire de rappel de connexion est celui d'OAuth bearer. Azure Databricks fournit des bibliothèques clientes Kafka ombrées : chaque nom de classe des options d'authentification doit donc commencer par `kafkashaded.`.
      options:
        widget: { en: "A widget value is typed by the user and shown in the notebook; it doesn't read the secret scope.", fr: "La valeur d'un widget est saisie par l'utilisateur et affichée dans le notebook ; elle ne lit pas l'étendue de secrets." }
        conf: { en: "spark.conf.get reads a Spark configuration value, not a secret of the secret scope.", fr: "spark.conf.get lit une valeur de configuration Spark, pas un secret de l'étendue de secrets." }
        arm: { en: "This scope requests a token for Azure Resource Manager, not for the Event Hubs namespace that the Kafka client connects to.", fr: "Cette étendue demande un jeton pour Azure Resource Manager, pas pour l'espace de noms Event Hubs auquel le client Kafka se connecte." }
        storage: { en: "This scope requests a token for Azure Storage, not for the Event Hubs namespace.", fr: "Cette étendue demande un jeton pour le Stockage Azure, pas pour l'espace de noms Event Hubs." }
        plain: { en: "PLAIN goes with a connection string, and shared access key authentication is disabled on the namespace.", fr: "PLAIN va avec une chaîne de connexion, et l'authentification par clé d'accès partagé est désactivée sur l'espace de noms." }
        scram: { en: "SCRAM is a password-based mechanism; authentication with a Microsoft Entra service principal uses OAUTHBEARER.", fr: "SCRAM est un mécanisme fondé sur un mot de passe ; l'authentification avec un principal de service Microsoft Entra utilise OAUTHBEARER." }
        unshaded: { en: "Unshaded Kafka class names raise an error on Azure Databricks; the shaded kafkashaded. prefix is required.", fr: "Les noms de classes Kafka non ombrés provoquent une erreur sur Azure Databricks ; le préfixe ombré kafkashaded. est obligatoire." }
        module: { en: "The login module already appears in the JAAS configuration; the callback handler option needs the callback handler class.", fr: "Le module de connexion figure déjà dans la configuration JAAS ; l'option du gestionnaire de rappel exige la classe du gestionnaire de rappel." }
    references:
      - title: Authentication - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/connect/streaming/kafka/authentication
