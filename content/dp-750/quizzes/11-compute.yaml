chapter: 11-compute
questions:
  # ------------------------------------------------------------------ 1
  - id: dp750-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The DP-750 study guide uses the term "shared compute". At Contoso, several data engineers must share one classic all-purpose compute resource. Each engineer's code must be isolated from the code of the others, and Unity Catalog must govern their access to data.

        Which configuration should you select when you create the compute resource?
      fr: |
        Le guide d'étude du DP-750 emploie le terme « calcul partagé ». Chez Contoso, plusieurs ingénieurs données doivent partager une même ressource de calcul universel classique. Le code de chaque ingénieur doit être isolé de celui des autres, et Unity Catalog doit gouverner leur accès aux données.

        Quelle configuration devez-vous sélectionner lors de la création de la ressource de calcul ?
    body:
      options:
        - { id: a, text: { en: "Dedicated access mode", fr: "Le mode d'accès Dedicated" } }
        - { id: b, text: { en: "Standard access mode", fr: "Le mode d'accès Standard" } }
        - { id: c, text: { en: "No isolation shared access mode", fr: "Le mode d'accès No isolation shared" } }
        - { id: d, text: { en: "Single node compute", fr: "Le calcul à nœud unique (Single node)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Standard access mode, formerly called shared access mode, lets several users share one compute resource while Lakeguard isolates their code and Unity Catalog governs their data access. It is what the study guide calls shared compute, and Databricks recommends it for classic compute unless a workload needs a dedicated-only feature.
        fr: |
          Le mode d'accès Standard, anciennement appelé mode d'accès partagé (shared), permet à plusieurs utilisateurs de partager une ressource de calcul pendant que Lakeguard isole leur code et qu'Unity Catalog gouverne leur accès aux données. C'est ce que le guide d'étude appelle le calcul partagé, et Databricks le recommande pour le calcul classique, sauf si une charge de travail exige une fonctionnalité réservée au mode dédié.
      options:
        a: { en: "Dedicated access mode (formerly single user) assigns the compute to one user or one group, not to several isolated users.", fr: "Le mode d'accès Dedicated (anciennement Single user) attribue le calcul à un utilisateur ou à un groupe, pas à plusieurs utilisateurs isolés." }
        c: { en: "No isolation shared is a legacy mode without user isolation and without Unity Catalog: it meets neither requirement.", fr: "No isolation shared est un mode hérité sans isolation des utilisateurs et sans Unity Catalog : il ne répond à aucune des deux exigences." }
        d: { en: "Single node sets the number of nodes, not who can share the compute or how users are isolated.", fr: "Le nœud unique fixe le nombre de nœuds, pas qui peut partager le calcul ni comment les utilisateurs sont isolés." }
    references:
      - title: Compute configuration reference
        url: https://learn.microsoft.com/en-us/azure/databricks/compute/configure
      - title: Standard compute overview
        url: https://learn.microsoft.com/en-us/azure/databricks/compute/standard-overview

  # ------------------------------------------------------------------ 2
  - id: dp750-qz-11-02
    objective: "1.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind has a SQL warehouse named **wh-sales**. Members of a group named **perf-team** investigate slow dashboards. They must run their own test queries on wh-sales, see the queries that every other user runs on it and open its monitoring tab.

        perf-team must not be able to stop, edit or delete wh-sales. The solution must follow the principle of least privilege.

        Which permission should you grant to perf-team on wh-sales?
      fr: |
        Northwind dispose d'un entrepôt SQL nommé **wh-sales**. Les membres d'un groupe nommé **perf-team** analysent des tableaux de bord lents. Ils doivent exécuter leurs propres requêtes de test sur wh-sales, voir les requêtes que tous les autres utilisateurs y exécutent et ouvrir son onglet de supervision.

        perf-team ne doit pas pouvoir arrêter, modifier ni supprimer wh-sales. La solution doit respecter le principe du moindre privilège.

        Quelle autorisation devez-vous accorder à perf-team sur wh-sales ?
    body:
      options:
        - { id: a, text: CAN VIEW }
        - { id: b, text: CAN USE }
        - { id: c, text: CAN MONITOR }
        - { id: d, text: CAN MANAGE }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          CAN MONITOR includes everything CAN USE allows (start the warehouse, run queries) and adds viewing all the warehouse queries and its monitoring tab. It doesn't allow stopping, editing or deleting the warehouse, or changing its permissions, which only IS OWNER and CAN MANAGE allow.
        fr: |
          CAN MONITOR inclut tout ce que permet CAN USE (démarrer l'entrepôt, exécuter des requêtes) et y ajoute la consultation de toutes les requêtes de l'entrepôt et de son onglet de supervision. Il ne permet ni d'arrêter, ni de modifier, ni de supprimer l'entrepôt, ni d'en changer les autorisations, ce que seuls IS OWNER et CAN MANAGE permettent.
      options:
        a: { en: "CAN VIEW shows the warehouse details, queries and monitoring tab, but it doesn't allow running queries.", fr: "CAN VIEW affiche les détails, les requêtes et l'onglet de supervision de l'entrepôt, mais ne permet pas d'exécuter des requêtes." }
        b: { en: "CAN USE starts the warehouse and runs queries, but it doesn't show the queries of other users or the monitoring tab.", fr: "CAN USE démarre l'entrepôt et exécute des requêtes, mais n'affiche ni les requêtes des autres utilisateurs ni l'onglet de supervision." }
        d: { en: "CAN MANAGE also allows stopping, editing and deleting the warehouse: it breaks least privilege.", fr: "CAN MANAGE permet aussi d'arrêter, de modifier et de supprimer l'entrepôt : il enfreint le moindre privilège." }
    references:
      - title: Access control lists
        url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/

  # ------------------------------------------------------------------ 3
  - id: dp750-qz-11-03
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A classic compute resource named **etl-shared** at Fabrikam has version 1.4 of an internal package named `fab_geo` installed as a compute-scoped library. Several notebooks are attached to etl-shared.

        In one of these notebooks, a data engineer installs version 1.5 of the package with `%pip install` from a wheel in a volume, restarts the Python process with `dbutils.library.restartPython()`, and then runs `import fab_geo`.

        Which version of fab_geo does each notebook use?
      fr: |
        Une ressource de calcul classique nommée **etl-shared** chez Fabrikam dispose de la version 1.4 d'un package interne nommé `fab_geo`, installée comme bibliothèque à l'étendue du calcul. Plusieurs notebooks sont attachés à etl-shared.

        Dans l'un de ces notebooks, un ingénieur données installe la version 1.5 du package avec `%pip install` à partir d'un wheel stocké dans un volume, redémarre le processus Python avec `dbutils.library.restartPython()`, puis exécute `import fab_geo`.

        Quelle version de fab_geo chaque notebook utilise-t-il ?
    body:
      options:
        - { id: a, text: { en: "Version 1.4 in this notebook and in the other notebooks", fr: "La version 1.4 dans ce notebook et dans les autres notebooks" } }
        - { id: b, text: { en: "Version 1.5 in this notebook and in the other notebooks", fr: "La version 1.5 dans ce notebook et dans les autres notebooks" } }
        - { id: c, text: { en: "Version 1.5 in this notebook, version 1.4 in the other notebooks", fr: "La version 1.5 dans ce notebook, la version 1.4 dans les autres notebooks" } }
        - { id: d, text: { en: "Version 1.4 in this notebook, version 1.5 in the other notebooks", fr: "La version 1.4 dans ce notebook, la version 1.5 dans les autres notebooks" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          For Python, a notebook-scoped library installed with `%pip` takes precedence over a compute-scoped library, which takes precedence over the libraries included in Databricks Runtime. Notebook-scoped libraries don't affect the other notebooks on the same compute, so they keep importing the compute-scoped version 1.4.
        fr: |
          En Python, une bibliothèque à l'étendue du notebook installée avec `%pip` est prioritaire sur une bibliothèque à l'étendue du calcul, elle-même prioritaire sur les bibliothèques incluses dans Databricks Runtime. Les bibliothèques à l'étendue du notebook n'affectent pas les autres notebooks du même calcul : ils continuent d'importer la version 1.4 installée à l'étendue du calcul.
      options:
        a: { en: "The compute-scoped version doesn't win: notebook-scoped libraries have a higher precedence in the notebook that installed them.", fr: "La version à l'étendue du calcul ne l'emporte pas : les bibliothèques à l'étendue du notebook sont prioritaires dans le notebook qui les a installées." }
        b: { en: "`%pip install` only changes the environment of the notebook session that runs it, not of the other notebooks on the compute.", fr: "`%pip install` ne modifie que l'environnement de la session de notebook qui l'exécute, pas celui des autres notebooks du calcul." }
        d: { en: "This reverses both rules: the installing notebook gets 1.5, and the other notebooks keep the compute-scoped 1.4.", fr: "Cette réponse inverse les deux règles : le notebook qui installe obtient la 1.5, et les autres notebooks gardent la 1.4 à l'étendue du calcul." }
    references:
      - title: Install libraries
        url: https://learn.microsoft.com/en-us/azure/databricks/libraries/

  # ------------------------------------------------------------------ 4
  - id: dp750-qz-11-04
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has an all-purpose compute resource named **q-close** whose node types, Spark settings and libraries were tuned for the quarterly financial close. The finance team uses q-close for a few days at the end of each quarter, and it stays terminated the rest of the time.

        Last quarter, a similar compute resource was missing from the compute list when the team needed it again. You need to keep the configuration of q-close available from one quarter to the next. The solution must minimize cost and administrative effort.

        What should you do?
      fr: |
        Adatum dispose d'une ressource de calcul universel nommée **q-close** dont les types de nœuds, les paramètres Spark et les bibliothèques ont été réglés pour la clôture financière trimestrielle. L'équipe finance utilise q-close quelques jours à la fin de chaque trimestre, et la ressource reste arrêtée le reste du temps.

        Au trimestre précédent, une ressource de calcul similaire avait disparu de la liste du calcul quand l'équipe en a eu de nouveau besoin. Vous devez conserver la configuration de q-close d'un trimestre à l'autre. La solution doit réduire au minimum le coût et l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Clear the Auto Termination checkbox of q-close so that it never terminates.", fr: "Décocher la case Auto Termination de q-close pour qu'elle ne s'arrête jamais." } }
        - { id: b, text: { en: "Set the automatic termination of q-close to 10,000 minutes of inactivity.", fr: "Fixer l'arrêt automatique de q-close à 10 000 minutes d'inactivité." } }
        - { id: c, text: { en: "Ask a workspace admin to pin q-close in the compute list.", fr: "Demander à un administrateur de l'espace de travail d'épingler q-close dans la liste du calcul." } }
        - { id: d, text: { en: "Clone q-close at the end of each quarter and terminate the clone.", fr: "Cloner q-close à la fin de chaque trimestre et arrêter le clone." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A compute resource is permanently deleted 30 days after it terminates, unless it is pinned or restarted. An administrator can pin an all-purpose compute to keep its configuration indefinitely (up to 100 pinned resources), at no running cost because it stays terminated.
        fr: |
          Une ressource de calcul est supprimée définitivement 30 jours après son arrêt, sauf si elle est épinglée ou redémarrée. Un administrateur peut épingler un calcul universel pour conserver sa configuration sans limite de durée (100 ressources épinglées au maximum), sans coût d'exécution puisqu'elle reste arrêtée.
      options:
        a: { en: "A compute that never terminates keeps its configuration, but its VMs and DBUs are billed for the whole quarter.", fr: "Un calcul qui ne s'arrête jamais conserve sa configuration, mais ses VM et ses DBU sont facturés tout le trimestre." }
        b: { en: "10,000 minutes is about 7 days: q-close still terminates, and it is deleted 30 days later, after costing a week of idle running.", fr: "10 000 minutes représentent environ 7 jours : q-close s'arrête quand même, puis est supprimée 30 jours plus tard, après avoir coûté une semaine d'inactivité." }
        d: { en: "A terminated clone is itself deleted after 30 days, so the quarterly cloning adds effort without solving the problem.", fr: "Un clone arrêté est lui-même supprimé au bout de 30 jours : le clonage trimestriel ajoute de l'effort sans résoudre le problème." }
    references:
      - title: Manage classic compute
        url: https://learn.microsoft.com/en-us/azure/databricks/compute/clusters-manage

  # ------------------------------------------------------------------ 5
  - id: dp750-qz-11-05
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        To reduce DBU consumption, a data engineer at Tailspin clears **Use Photon Acceleration** on the classic jobs compute of a nightly job. The job runs a `MERGE INTO` statement on the large Delta table **tailspin_prod.silver.bookings**, with a selective join condition that matches rows in a few files only.

        After the change, the MERGE reads many more files of the table than before.

        Which feature no longer applies to the MERGE statement?
      fr: |
        Pour réduire la consommation de DBU, un ingénieur données de Tailspin décoche **Use Photon Acceleration** sur le calcul de jobs classique d'un job nocturne. Le job exécute une instruction `MERGE INTO` sur la grande table Delta **tailspin_prod.silver.bookings**, avec une condition de jointure sélective qui ne correspond qu'aux lignes de quelques fichiers.

        Après la modification, le MERGE lit beaucoup plus de fichiers de la table qu'auparavant.

        Quelle fonctionnalité ne s'applique plus à l'instruction MERGE ?
    body:
      options:
        - { id: a, text: { en: "Adaptive query execution", fr: "L'exécution adaptative des requêtes (adaptive query execution)" } }
        - { id: b, text: { en: "Dynamic file pruning", fr: "L'élagage dynamique de fichiers (dynamic file pruning)" } }
        - { id: c, text: { en: "Predictive optimization", fr: "L'optimisation prédictive (predictive optimization)" } }
        - { id: d, text: { en: "Data skipping with Delta file statistics", fr: "Le saut de données avec les statistiques de fichiers Delta" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Dynamic file pruning in `MERGE`, `UPDATE` and `DELETE` statements requires Photon, like predictive I/O. Without Photon, the MERGE can no longer skip the target files that the join condition doesn't match at run time, so it reads more files.
        fr: |
          L'élagage dynamique de fichiers dans les instructions `MERGE`, `UPDATE` et `DELETE` exige Photon, comme Predictive I/O. Sans Photon, le MERGE ne peut plus ignorer à l'exécution les fichiers cibles que la condition de jointure ne retient pas : il lit donc davantage de fichiers.
      options:
        a: { en: "Adaptive query execution is an Apache Spark feature that doesn't depend on Photon.", fr: "L'exécution adaptative des requêtes est une fonctionnalité d'Apache Spark qui ne dépend pas de Photon." }
        c: { en: "Predictive optimization is a Unity Catalog service that runs maintenance on managed tables; it doesn't depend on the engine of the job compute.", fr: "L'optimisation prédictive est un service Unity Catalog qui exécute la maintenance des tables managées ; elle ne dépend pas du moteur du calcul de jobs." }
        d: { en: "Data skipping uses the statistics stored in the Delta log and works on the standard Spark engine as well.", fr: "Le saut de données utilise les statistiques stockées dans le journal Delta et fonctionne aussi avec le moteur Spark standard." }
    references:
      - title: What is Photon?
        url: https://learn.microsoft.com/en-us/azure/databricks/compute/photon

  # ------------------------------------------------------------------ 6
  - id: dp750-qz-11-06
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso's platform team creates SQL warehouses from a CI/CD pipeline by calling the SQL Warehouses API. The workspace is in a region that supports serverless SQL warehouses. Two new warehouses are needed:

        - **wh-bi** serves AI/BI dashboards whose demand comes in bursts. The warehouse must start in seconds and use intelligent workload management.
        - **wh-fed** runs Lakehouse Federation queries against a SQL Server database that is reachable only through Contoso's own virtual network, which is connected to the on-premises network. Its queries need Predictive IO.

        How should you complete the request bodies? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe plateforme de Contoso crée des entrepôts SQL depuis un pipeline CI/CD en appelant l'API SQL Warehouses. L'espace de travail se trouve dans une région qui prend en charge les entrepôts SQL serverless. Deux nouveaux entrepôts sont nécessaires :

        - **wh-bi** sert des tableaux de bord AI/BI dont la demande arrive par pics. L'entrepôt doit démarrer en quelques secondes et utiliser la gestion intelligente des charges de travail.
        - **wh-fed** exécute des requêtes Lakehouse Federation sur une base de données SQL Server joignable uniquement par le réseau virtuel de Contoso, lui-même connecté au réseau local. Ses requêtes ont besoin de Predictive IO.

        Comment devez-vous compléter les corps de requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: text
      template: |
        POST /api/2.0/sql/warehouses
        {
          "name": "wh-bi",
          "cluster_size": "Small",
          [[bi]]
        }

        POST /api/2.0/sql/warehouses
        {
          "name": "wh-fed",
          "cluster_size": "Small",
          [[fed]]
        }
      slots:
        - id: bi
          options:
            - { id: protrue, text: "\"warehouse_type\": \"pro\", \"enable_serverless_compute\": true" }
            - { id: profalse, text: "\"warehouse_type\": \"pro\", \"enable_serverless_compute\": false" }
            - { id: classictrue, text: "\"warehouse_type\": \"classic\", \"enable_serverless_compute\": true" }
            - { id: classicfalse, text: "\"warehouse_type\": \"classic\", \"enable_serverless_compute\": false" }
        - id: fed
          options:
            - { id: protrue, text: "\"warehouse_type\": \"pro\", \"enable_serverless_compute\": true" }
            - { id: profalse, text: "\"warehouse_type\": \"pro\", \"enable_serverless_compute\": false" }
            - { id: classictrue, text: "\"warehouse_type\": \"classic\", \"enable_serverless_compute\": true" }
            - { id: classicfalse, text: "\"warehouse_type\": \"classic\", \"enable_serverless_compute\": false" }
    answer:
      values: { bi: protrue, fed: profalse }
    explanation:
      correct:
        en: |
          With default parameters, the SQL Warehouses API creates a classic warehouse. A serverless warehouse, the only type with intelligent workload management and a startup of a few seconds, requires `enable_serverless_compute` set to `true` together with `warehouse_type` set to `pro`. Databricks recommends a pro warehouse when it must reach databases through your own network for federation or a hybrid architecture; pro supports Predictive IO, which classic doesn't.
        fr: |
          Avec les paramètres par défaut, l'API SQL Warehouses crée un entrepôt classique. Un entrepôt serverless, le seul type doté de la gestion intelligente des charges de travail et d'un démarrage en quelques secondes, exige `enable_serverless_compute` à `true` avec `warehouse_type` à `pro`. Databricks recommande un entrepôt pro quand il doit joindre des bases de données par votre propre réseau, pour la fédération ou une architecture hybride ; le type pro prend en charge Predictive IO, contrairement au type classique.
      options:
        profalse: { en: "For wh-bi, a pro warehouse takes minutes to start and has no intelligent workload management.", fr: "Pour wh-bi, un entrepôt pro met plusieurs minutes à démarrer et n'a pas de gestion intelligente des charges de travail." }
        classictrue: { en: "Serverless is enabled together with the pro warehouse type, not with the classic type.", fr: "Le serverless s'active avec le type d'entrepôt pro, pas avec le type classique." }
        classicfalse: { en: "A classic warehouse supports neither Predictive IO nor intelligent workload management.", fr: "Un entrepôt classique ne prend en charge ni Predictive IO ni la gestion intelligente des charges de travail." }
    references:
      - title: SQL warehouse types
        url: https://learn.microsoft.com/en-us/azure/databricks/compute/sql-warehouse/warehouse-types

  # ------------------------------------------------------------------ 7
  - id: dp750-qz-11-07
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has an instance pool named **pool-etl** of on-demand instances, with **Min Idle** set to 4, **Max Capacity** set to 10 and the custom tag `team=platform`.

        Two classic all-purpose compute resources draw their driver and their workers from pool-etl:

        - **etl-a**: autoscaling from 2 to 8 workers, custom tag `costcenter=sales`;
        - **etl-b**: a fixed size of 5 workers, custom tag `costcenter=hr`.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un pool d'instances nommé **pool-etl**, composé d'instances à la demande, avec **Min Idle** fixé à 4, **Max Capacity** fixé à 10 et l'étiquette personnalisée `team=platform`.

        Deux ressources de calcul universel classiques puisent leur pilote et leurs workers dans pool-etl :

        - **etl-a** : mise à l'échelle automatique de 2 à 8 workers, étiquette personnalisée `costcenter=sales` ;
        - **etl-b** : une taille fixe de 5 workers, étiquette personnalisée `costcenter=hr`.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "When etl-b runs with its 5 workers, etl-a can't have more than 3 workers, because its requests for further instances fail.", fr: "Quand etl-b s'exécute avec ses 5 workers, etl-a ne peut pas avoir plus de 3 workers, car ses demandes d'instances supplémentaires échouent." } }
        - { id: b, text: { en: "Azure Databricks charges DBUs for the 4 instances that pool-etl keeps idle when no compute uses them.", fr: "Azure Databricks facture des DBU pour les 4 instances que pool-etl garde inactives quand aucun calcul ne les utilise." } }
        - { id: c, text: { en: "The 4 instances that pool-etl keeps idle incur Azure VM charges even when no compute uses them.", fr: "Les 4 instances que pool-etl garde inactives entraînent des frais de VM Azure même quand aucun calcul ne les utilise." } }
        - { id: d, text: { en: "The Azure VMs of etl-a carry the tag costcenter=sales, so the Azure VM costs can be split by cost center.", fr: "Les VM Azure d'etl-a portent l'étiquette costcenter=sales : les coûts des VM Azure peuvent donc être répartis par centre de coûts." } }
        - { id: e, text: { en: "Because they draw their nodes from a pool, etl-a and etl-b can't use autoscaling.", fr: "Comme ils puisent leurs nœuds dans un pool, etl-a et etl-b ne peuvent pas utiliser la mise à l'échelle automatique." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Max Capacity caps the used and idle instances of the pool: etl-b uses 6 instances (5 workers and its driver), so etl-a can use at most 4 (its driver and 3 workers), and any further request fails. Azure Databricks charges no DBUs for idle pool instances, but the instance provider still bills the VMs, which is the cost of keeping Min Idle above 0.
        fr: |
          Max Capacity plafonne les instances utilisées et inactives du pool : etl-b utilise 6 instances (5 workers et son pilote), donc etl-a peut en utiliser 4 au plus (son pilote et 3 workers), et toute demande supplémentaire échoue. Azure Databricks ne facture aucun DBU pour les instances inactives d'un pool, mais le fournisseur d'instances facture toujours les VM : c'est le coût d'un Min Idle supérieur à 0.
      options:
        b: { en: "Idle instances in a pool aren't charged DBUs; only the instance provider bills them.", fr: "Les instances inactives d'un pool ne sont pas facturées en DBU ; seul le fournisseur d'instances les facture." }
        d: { en: "For compute launched from a pool, compute tags only reach DBU usage reports; only the pool tags propagate to the cloud instances.", fr: "Pour un calcul lancé depuis un pool, les étiquettes du calcul n'atteignent que les rapports d'utilisation des DBU ; seules les étiquettes du pool se propagent aux instances cloud." }
        e: { en: "Compute attached to a pool can autoscale: the pool also reduces autoscaling time when idle instances are available.", fr: "Un calcul attaché à un pool peut se mettre à l'échelle automatiquement : le pool réduit aussi le temps de mise à l'échelle quand des instances inactives sont disponibles." }
    references:
      - title: Pool best practices
        url: https://learn.microsoft.com/en-us/azure/databricks/compute/pool-best-practices
      - title: Connect to pools
        url: https://learn.microsoft.com/en-us/azure/databricks/compute/pool-index

  # ------------------------------------------------------------------ 8
  - id: dp750-qz-11-08
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has a classic compute resource named **ds-shared** in standard access mode on Databricks Runtime 16.4 LTS. Several data scientists run notebooks on ds-shared all day long. Its Python dependencies are installed as one compute-scoped library from the file `/Volumes/wg_prod/tools/envs/requirements.txt`.

        You edit requirements.txt to upgrade one package. The new version must be installed on ds-shared today, and the notebooks that other users are running must not be interrupted. The users who need the upgrade will start a new notebook session.

        What should you do?
      fr: |
        Woodgrove dispose d'une ressource de calcul classique nommée **ds-shared** en mode d'accès Standard sur Databricks Runtime 16.4 LTS. Plusieurs data scientists exécutent des notebooks sur ds-shared toute la journée. Ses dépendances Python sont installées comme une seule bibliothèque à l'étendue du calcul à partir du fichier `/Volumes/wg_prod/tools/envs/requirements.txt`.

        Vous modifiez requirements.txt pour mettre à niveau un package. La nouvelle version doit être installée sur ds-shared aujourd'hui, et les notebooks que les autres utilisateurs exécutent ne doivent pas être interrompus. Les utilisateurs qui ont besoin de la mise à niveau démarreront une nouvelle session de notebook.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Uninstall the requirements.txt library, install it again from the volume, and restart ds-shared.", fr: "Désinstaller la bibliothèque requirements.txt, la réinstaller depuis le volume, puis redémarrer ds-shared." } }
        - { id: b, text: { en: "Restart ds-shared so that it installs the edited requirements.txt library at startup.", fr: "Redémarrer ds-shared pour qu'il installe la bibliothèque requirements.txt modifiée au démarrage." } }
        - { id: c, text: { en: "Reinstall the requirements.txt library from the Libraries tab of ds-shared.", fr: "Réinstaller la bibliothèque requirements.txt depuis l'onglet Libraries de ds-shared." } }
        - { id: d, text: { en: "Add the upgraded package to the allowlist, then detach and reattach the notebooks.", fr: "Ajouter le package mis à niveau à la liste d'autorisation, puis détacher et rattacher les notebooks." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          To update a compute-scoped library, you normally uninstall the old version and install the new one, and an uninstall only takes effect at the next restart. A requirements.txt file is the exception: when its content changes, you simply reinstall it, with no uninstall and no restart, so the running notebooks aren't interrupted.
        fr: |
          Pour mettre à jour une bibliothèque à l'étendue du calcul, vous désinstallez en général l'ancienne version puis installez la nouvelle, et une désinstallation ne prend effet qu'au redémarrage suivant. Un fichier requirements.txt fait exception : quand son contenu change, il suffit de le réinstaller, sans désinstallation ni redémarrage ; les notebooks en cours ne sont donc pas interrompus.
      options:
        a: { en: "Uninstalling and reinstalling isn't needed for a requirements.txt file, and the restart interrupts every notebook on ds-shared.", fr: "Désinstaller et réinstaller n'est pas nécessaire pour un fichier requirements.txt, et le redémarrage interrompt tous les notebooks de ds-shared." }
        b: { en: "Restarting the compute stops the notebooks that other users are running, which the requirements forbid.", fr: "Redémarrer le calcul arrête les notebooks que les autres utilisateurs exécutent, ce que les exigences interdisent." }
        d: { en: "The allowlist covers JARs, Maven coordinates and init scripts on standard access mode, and reattaching a notebook installs nothing.", fr: "La liste d'autorisation concerne les JAR, les coordonnées Maven et les scripts d'initialisation en mode Standard, et rattacher un notebook n'installe rien." }
    references:
      - title: Compute-scoped libraries
        url: https://learn.microsoft.com/en-us/azure/databricks/libraries/cluster-libraries

  # ------------------------------------------------------------------ 9
  - id: dp750-qz-11-09
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware has a classic all-purpose compute resource named **etl-std** in standard access mode. Its Spark configuration contains no log-related property. The permissions on etl-std are the following:

        | Principal | Permission on etl-std |
        | --- | --- |
        | Group **ops** | CAN RESTART |
        | Group **analysts** | CAN ATTACH TO |
        | User **Dana** | CAN MANAGE |

        The analysts group has USE CATALOG, USE SCHEMA and SELECT on the table `litware_prod.sales.orders` and its parents. Dana holds no Unity Catalog privilege on litware_prod.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'une ressource de calcul universel classique nommée **etl-std** en mode d'accès Standard. Sa configuration Spark ne contient aucune propriété liée aux journaux. Les autorisations sur etl-std sont les suivantes :

        | Principal | Autorisation sur etl-std |
        | --- | --- |
        | Groupe **ops** | CAN RESTART |
        | Groupe **analysts** | CAN ATTACH TO |
        | Utilisatrice **Dana** | CAN MANAGE |

        Le groupe analysts dispose de USE CATALOG, USE SCHEMA et SELECT sur la table `litware_prod.sales.orders` et ses parents. Dana ne détient aucun privilège Unity Catalog sur litware_prod.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A member of ops can terminate etl-std while a member of analysts is running a notebook on it.", fr: "Un membre d'ops peut arrêter etl-std pendant qu'un membre d'analysts y exécute un notebook." } }
        - { id: s2, text: { en: "A member of ops can add a property to the Spark configuration of etl-std so that the analysts can read its driver logs.", fr: "Un membre d'ops peut ajouter une propriété à la configuration Spark d'etl-std pour que les analysts puissent lire ses journaux du pilote." } }
        - { id: s3, text: { en: "Dana can query litware_prod.sales.orders from a notebook attached to etl-std.", fr: "Dana peut interroger litware_prod.sales.orders depuis un notebook attaché à etl-std." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          CAN RESTART allows starting, restarting and terminating the compute, whoever is using it at the time. Changing the Spark configuration is an edit of the compute, which requires CAN MANAGE, even though `spark.databricks.acl.needAdminPermissionToViewLogs false` is the right property to open driver logs to CAN ATTACH TO users. CAN MANAGE on a compute grants no data access: on standard access mode, Dana's queries are checked against her own Unity Catalog privileges, and she has no SELECT on the table.
        fr: |
          CAN RESTART permet de démarrer, de redémarrer et d'arrêter le calcul, quel que soit l'utilisateur qui s'en sert à ce moment. Modifier la configuration Spark est une modification du calcul, qui exige CAN MANAGE, même si `spark.databricks.acl.needAdminPermissionToViewLogs false` est bien la propriété qui ouvre les journaux du pilote aux utilisateurs CAN ATTACH TO. CAN MANAGE sur un calcul ne donne aucun accès aux données : en mode d'accès Standard, les requêtes de Dana sont vérifiées par rapport à ses propres privilèges Unity Catalog, et elle n'a pas SELECT sur la table.
      options:
        s2: { en: "Editing the compute, including its Spark configuration, requires CAN MANAGE; CAN RESTART only controls its state.", fr: "Modifier le calcul, y compris sa configuration Spark, exige CAN MANAGE ; CAN RESTART ne contrôle que son état." }
        s3: { en: "Querying a table requires SELECT on it plus USE CATALOG and USE SCHEMA, whatever the permission on the compute.", fr: "Interroger une table exige SELECT sur celle-ci, plus USE CATALOG et USE SCHEMA, quelle que soit l'autorisation sur le calcul." }
    references:
      - title: Access control lists
        url: https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/
      - title: Unity Catalog privileges reference
        url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/manage-privileges/privileges

  # ------------------------------------------------------------------ 10
  - id: dp750-qz-11-10
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum is moving a Python notebook from a classic all-purpose compute resource in dedicated access mode to serverless compute for notebooks. The workspace is enabled for Unity Catalog. The notebook contains the following code:

        ```python
        rows = [("FR", 120), ("DE", 95)]
        targets = spark.sparkContext.parallelize(rows).toDF(["country", "target"])
        spark.sql("CACHE TABLE adatum_prod.gold.sales")
        sales = spark.table("adatum_prod.gold.sales")
        report = sales.join(targets, "country")
        ```

        On serverless compute, the notebook fails. You need the notebook to run on serverless compute and return the same result.

        Which two changes should you make? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum déplace un notebook Python d'une ressource de calcul universel classique en mode d'accès Dedicated vers le calcul serverless pour notebooks. L'espace de travail est activé pour Unity Catalog. Le notebook contient le code suivant :

        ```python
        rows = [("FR", 120), ("DE", 95)]
        targets = spark.sparkContext.parallelize(rows).toDF(["country", "target"])
        spark.sql("CACHE TABLE adatum_prod.gold.sales")
        sales = spark.table("adatum_prod.gold.sales")
        report = sales.join(targets, "country")
        ```

        Sur le calcul serverless, le notebook échoue. Vous devez faire en sorte que le notebook s'exécute sur le calcul serverless et renvoie le même résultat.

        Quelles sont les deux modifications que vous devez apporter ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Build targets with `spark.createDataFrame(rows, [\"country\", \"target\"])`.", fr: "Construire targets avec `spark.createDataFrame(rows, [\"country\", \"target\"])`." } }
        - { id: b, text: { en: "Build targets in a Scala cell that calls `sc.parallelize(rows)`.", fr: "Construire targets dans une cellule Scala qui appelle `sc.parallelize(rows)`." } }
        - { id: c, text: { en: "Remove the CACHE TABLE statement and call `sales.cache()` after reading the table.", fr: "Supprimer l'instruction CACHE TABLE et appeler `sales.cache()` après la lecture de la table." } }
        - { id: d, text: { en: "Remove the CACHE TABLE statement and call `sales.checkpoint()` after reading the table.", fr: "Supprimer l'instruction CACHE TABLE et appeler `sales.checkpoint()` après la lecture de la table." } }
        - { id: e, text: { en: "Store targets in a global temporary view and read it back with `spark.table()`.", fr: "Stocker targets dans une vue temporaire globale et la relire avec `spark.table()`." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Serverless compute supports only Spark Connect APIs: RDD APIs such as `sparkContext.parallelize` aren't available, and `spark.createDataFrame` builds the same DataFrame. `CACHE TABLE` raises an exception on serverless compute, while `df.cache()` and `df.persist()` are supported and don't change the result.
        fr: |
          Le calcul serverless ne prend en charge que les API Spark Connect : les API RDD comme `sparkContext.parallelize` n'y sont pas disponibles, et `spark.createDataFrame` construit le même DataFrame. `CACHE TABLE` lève une exception sur le calcul serverless, alors que `df.cache()` et `df.persist()` sont pris en charge et ne modifient pas le résultat.
      options:
        b: { en: "Scala isn't supported in notebooks on serverless compute, and the RDD API isn't supported either.", fr: "Scala n'est pas pris en charge dans les notebooks sur le calcul serverless, et l'API RDD ne l'est pas non plus." }
        d: { en: "`df.checkpoint()` is in the list of cache APIs that raise an exception on serverless compute.", fr: "`df.checkpoint()` fait partie des API de cache qui lèvent une exception sur le calcul serverless." }
        e: { en: "Global temporary views aren't supported on serverless compute, and targets would still be built with the RDD API.", fr: "Les vues temporaires globales ne sont pas prises en charge sur le calcul serverless, et targets serait toujours construit avec l'API RDD." }
    references:
      - title: Serverless compute limitations
        url: https://learn.microsoft.com/en-us/azure/databricks/compute/serverless/limitations
