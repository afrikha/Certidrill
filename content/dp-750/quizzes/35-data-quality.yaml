chapter: 35-data-quality
questions:
  # ------------------------------------------------------------------ 1
  - id: dp750-qz-35-01
    objective: "3.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Delta table named **contoso.silver.order_lines** in Unity Catalog. The table declares a primary key on `line_id` and a foreign key on `order_id` that references **contoso.silver.orders**.

        You need to display the key constraints declared on contoso.silver.order_lines from a notebook.

        Which statement should you run?
      fr: |
        Contoso dispose d'une table Delta nommée **contoso.silver.order_lines** dans Unity Catalog. La table déclare une clé primaire sur `line_id` et une clé étrangère sur `order_id` qui référence **contoso.silver.orders**.

        Vous devez afficher les contraintes de clé déclarées sur contoso.silver.order_lines depuis un notebook.

        Quelle instruction devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`SHOW TBLPROPERTIES contoso.silver.order_lines`" }
        - { id: b, text: "`DESCRIBE HISTORY contoso.silver.order_lines`" }
        - { id: c, text: "`DESCRIBE TABLE EXTENDED contoso.silver.order_lines`" }
        - { id: d, text: "`SHOW COLUMNS IN contoso.silver.order_lines`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Primary key and foreign key constraints are informational constraints stored with the table definition. You can see them with `DESCRIBE TABLE EXTENDED`, with `SHOW CREATE TABLE` or by querying `information_schema`.
        fr: |
          Les contraintes de clé primaire et de clé étrangère sont des contraintes informationnelles enregistrées avec la définition de la table. Vous les voyez avec `DESCRIBE TABLE EXTENDED`, avec `SHOW CREATE TABLE` ou en interrogeant `information_schema`.
      options:
        a: { en: "`SHOW TBLPROPERTIES` is where the enforced CHECK constraints appear, not the informational key constraints.", fr: "`SHOW TBLPROPERTIES` est l'endroit où apparaissent les contraintes CHECK appliquées, pas les contraintes de clé informationnelles." }
        b: { en: "`DESCRIBE HISTORY` lists the operations and versions of the table, not its constraints.", fr: "`DESCRIBE HISTORY` liste les opérations et les versions de la table, pas ses contraintes." }
        d: { en: "`SHOW COLUMNS` returns only the column names, without types or constraints.", fr: "`SHOW COLUMNS` renvoie uniquement les noms des colonnes, sans types ni contraintes." }
    references:
      - title: Constraints on Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/tables/constraints

  # ------------------------------------------------------------------ 2
  - id: dp750-qz-35-02
    objective: "3.4.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a Lakeflow Spark Declarative Pipelines pipeline whose streaming tables use expectations with the warn and drop actions.

        A data steward needs a SQL query that returns, for every pipeline update, the number of passed and failed records of each expectation, to feed a dashboard.

        What should the query read?
      fr: |
        Fabrikam dispose d'un pipeline Lakeflow Spark Declarative Pipelines dont les tables de diffusion en continu utilisent des attentes avec les actions warn et drop.

        Un gestionnaire de données a besoin d'une requête SQL qui renvoie, pour chaque mise à jour du pipeline, le nombre d'enregistrements réussis et en échec de chaque attente, afin d'alimenter un tableau de bord.

        Que doit lire la requête ?
    body:
      options:
        - { id: a, text: { en: "The `flow_progress` events of the pipeline event log", fr: "Les événements `flow_progress` du journal des événements du pipeline" } }
        - { id: b, text: { en: "The output of `DESCRIBE HISTORY` for each streaming table", fr: "La sortie de `DESCRIBE HISTORY` pour chaque table de diffusion en continu" } }
        - { id: c, text: { en: "The audit log system table `system.access.audit`", fr: "La table système du journal d'audit `system.access.audit`" } }
        - { id: d, text: { en: "The output of `SHOW TBLPROPERTIES` for each streaming table", fr: "La sortie de `SHOW TBLPROPERTIES` pour chaque table de diffusion en continu" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Besides the Data quality tab of the pipeline UI, expectation metrics are written to the pipeline event log. The `flow_progress` events contain `data_quality.expectations`, with the name, dataset, passed records and failed records of each expectation, which a SQL query can aggregate per update.
        fr: |
          En plus de l'onglet Data quality de l'interface du pipeline, les métriques des attentes sont écrites dans le journal des événements du pipeline. Les événements `flow_progress` contiennent `data_quality.expectations`, avec le nom, le jeu de données, les enregistrements réussis et en échec de chaque attente, qu'une requête SQL peut agréger par mise à jour.
      options:
        b: { en: "The table history lists write operations and their operation metrics, not the results of each expectation.", fr: "L'historique de la table liste les opérations d'écriture et leurs métriques d'opération, pas les résultats de chaque attente." }
        c: { en: "The audit log records who did what in the account; it doesn't contain record-level data quality metrics.", fr: "Le journal d'audit enregistre qui a fait quoi dans le compte ; il ne contient pas de métriques de qualité des données par enregistrement." }
        d: { en: "Table properties describe the table configuration; expectation results aren't stored there.", fr: "Les propriétés de la table décrivent sa configuration ; les résultats des attentes n'y sont pas stockés." }
    references:
      - title: Pipeline event log
        url: https://learn.microsoft.com/en-us/azure/databricks/ldp/monitor-event-logs
      - title: Manage data quality with pipeline expectations
        url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations

  # ------------------------------------------------------------------ 3
  - id: dp750-qz-35-03
    objective: "3.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum ingests CSV files with headers into the Delta table **adatum.bronze.invoices** by using Auto Loader. The stream sets `cloudFiles.format` and `cloudFiles.schemaLocation` and no other schema option.

        Some files contain `amount` values such as `12,50`. The rows that contain these values are in adatum.bronze.invoices, the stream never failed, and the `_rescued_data` column is null for every row.

        Why wasn't the value `12,50` written to `_rescued_data`?
      fr: |
        Adatum ingère des fichiers CSV avec en-têtes dans la table Delta **adatum.bronze.invoices** au moyen d'Auto Loader. Le flux définit `cloudFiles.format` et `cloudFiles.schemaLocation`, et aucune autre option de schéma.

        Certains fichiers contiennent des valeurs `amount` comme `12,50`. Les lignes qui contiennent ces valeurs se trouvent dans adatum.bronze.invoices, le flux n'a jamais échoué, et la colonne `_rescued_data` est null pour toutes les lignes.

        Pourquoi la valeur `12,50` n'a-t-elle pas été écrite dans `_rescued_data` ?
    body:
      options:
        - { id: a, text: { en: "Auto Loader fills the rescued data column for JSON files only, not for CSV files.", fr: "Auto Loader remplit la colonne de données récupérées uniquement pour les fichiers JSON, pas pour les fichiers CSV." } }
        - { id: b, text: { en: "Auto Loader inferred all the CSV columns as STRING, so these values match their column type.", fr: "Auto Loader a déduit toutes les colonnes CSV en STRING, donc ces valeurs correspondent au type de leur colonne." } }
        - { id: c, text: { en: "Auto Loader adds the rescued data column only when the rescuedDataColumn option is set.", fr: "Auto Loader n'ajoute la colonne de données récupérées que si l'option rescuedDataColumn est définie." } }
        - { id: d, text: { en: "Auto Loader rescues mismatched values only after a restart in the addNewColumns mode.", fr: "Auto Loader ne récupère les valeurs incompatibles qu'après un redémarrage en mode addNewColumns." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Without `cloudFiles.inferColumnTypes` or schema hints, Auto Loader infers CSV and JSON columns as STRING. Any text fits a STRING column, so there is no type mismatch to rescue. To catch such values, give amount a type with a schema hint, or cast it later with `try_cast`.
        fr: |
          Sans `cloudFiles.inferColumnTypes` ni indicateurs de schéma, Auto Loader déduit les colonnes CSV et JSON en STRING. Tout texte convient à une colonne STRING : il n'y a donc aucune incompatibilité de type à récupérer. Pour détecter ces valeurs, donnez un type à amount avec un indicateur de schéma, ou convertissez-la plus tard avec `try_cast`.
      options:
        a: { en: "The rescued data column works for CSV as well as JSON: it captures type mismatches, missing columns and case mismatches.", fr: "La colonne de données récupérées fonctionne pour CSV comme pour JSON : elle capture les incompatibilités de type, les colonnes absentes et les différences de casse." }
        c: { en: "With schema inference, Auto Loader adds `_rescued_data` automatically; the option only renames it or adds it to a provided schema.", fr: "Avec la déduction de schéma, Auto Loader ajoute automatiquement `_rescued_data` ; l'option sert seulement à la renommer ou à l'ajouter à un schéma fourni." }
        d: { en: "addNewColumns handles new columns by failing and restarting; it doesn't delay the rescue of values that don't match their type.", fr: "addNewColumns gère les nouvelles colonnes en échouant puis en redémarrant ; il ne retarde pas la récupération des valeurs qui ne correspondent pas à leur type." }
    references:
      - title: Configure schema inference and evolution in Auto Loader
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema

  # ------------------------------------------------------------------ 4
  - id: dp750-qz-35-04
    objective: "3.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A notebook task at Woodgrove Bank runs the following statement every night. No schema evolution keyword, option or session setting is used.

        ```sql
        MERGE INTO woodgrove.silver.accounts AS t
        USING woodgrove.staging.account_changes AS s
        ON t.account_id = s.account_id
        WHEN MATCHED THEN UPDATE SET *
        WHEN NOT MATCHED THEN INSERT *
        ```

        Yesterday, the source system added a column named `risk_band` to woodgrove.staging.account_changes. The silver table doesn't have this column.

        What happens during tonight's run?
      fr: |
        Une tâche de notebook de Woodgrove Bank exécute chaque nuit l'instruction suivante. Aucun mot clé, aucune option ni aucun paramètre de session d'évolution du schéma n'est utilisé.

        ```sql
        MERGE INTO woodgrove.silver.accounts AS t
        USING woodgrove.staging.account_changes AS s
        ON t.account_id = s.account_id
        WHEN MATCHED THEN UPDATE SET *
        WHEN NOT MATCHED THEN INSERT *
        ```

        Hier, le système source a ajouté une colonne nommée `risk_band` à woodgrove.staging.account_changes. La table silver ne contient pas cette colonne.

        Que se passe-t-il lors de l'exécution de cette nuit ?
    body:
      options:
        - { id: a, text: { en: "The merge fails with a schema mismatch error, and the silver table isn't changed.", fr: "Le merge échoue avec une erreur d'incompatibilité de schéma, et la table silver n'est pas modifiée." } }
        - { id: b, text: { en: "The merge adds risk_band to the silver table and sets it to NULL for the existing rows.", fr: "Le merge ajoute risk_band à la table silver et la définit à NULL pour les lignes existantes." } }
        - { id: c, text: { en: "The merge succeeds and writes the risk_band values to the _rescued_data column of the silver table.", fr: "Le merge réussit et écrit les valeurs de risk_band dans la colonne _rescued_data de la table silver." } }
        - { id: d, text: { en: "The merge succeeds on the existing columns, and risk_band is ignored and not added.", fr: "Le merge réussit sur les colonnes existantes, et risk_band est ignorée et n'est pas ajoutée." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Without schema evolution, `UPDATE SET *` and `INSERT *` only update or insert the columns that exist in the target: extra source columns are ignored and the table schema stays the same. Only an explicit reference to a column that the target doesn't have, such as `SET t.risk_band = s.risk_band`, makes the statement fail.
        fr: |
          Sans évolution du schéma, `UPDATE SET *` et `INSERT *` ne mettent à jour ou n'insèrent que les colonnes qui existent dans la cible : les colonnes supplémentaires de la source sont ignorées et le schéma de la table ne change pas. Seule une référence explicite à une colonne absente de la cible, comme `SET t.risk_band = s.risk_band`, fait échouer l'instruction.
      options:
        a: { en: "`MERGE` with `*` doesn't fail on extra source columns; it fails only when an action names a column that the target lacks.", fr: "`MERGE` avec `*` n'échoue pas sur les colonnes supplémentaires de la source ; il échoue seulement quand une action nomme une colonne absente de la cible." }
        b: { en: "Adding the column requires `MERGE WITH SCHEMA EVOLUTION` (or another evolution setting), which isn't used here.", fr: "L'ajout de la colonne exige `MERGE WITH SCHEMA EVOLUTION` (ou un autre paramètre d'évolution), qui n'est pas utilisé ici." }
        c: { en: "The rescued data column belongs to file readers such as Auto Loader; a Delta MERGE doesn't write to it.", fr: "La colonne de données récupérées appartient aux lecteurs de fichiers comme Auto Loader ; un MERGE Delta n'y écrit pas." }
    references:
      - title: Update table schemas with schema evolution
        url: https://learn.microsoft.com/en-us/azure/databricks/tables/update-schema

  # ------------------------------------------------------------------ 5
  - id: dp750-qz-35-05
    objective: "3.4.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys has the following Delta table in Unity Catalog. Some existing rows have a null `carrier` value. An external application writes to the table with an open-source Delta Lake client.

        ```sql
        CREATE TABLE tailspin.silver.shipments (
          shipment_id BIGINT NOT NULL,
          carrier     STRING,
          weight_kg   DECIMAL(8, 2),
          CONSTRAINT shipments_pk PRIMARY KEY (shipment_id)
        );
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose de la table Delta suivante dans Unity Catalog. Certaines lignes existantes ont une valeur `carrier` null. Une application externe écrit dans la table avec un client Delta Lake open source.

        ```sql
        CREATE TABLE tailspin.silver.shipments (
          shipment_id BIGINT NOT NULL,
          carrier     STRING,
          weight_kg   DECIMAL(8, 2),
          CONSTRAINT shipments_pk PRIMARY KEY (shipment_id)
        );
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "An INSERT of a row whose shipment_id already exists in the table fails because of shipments_pk.", fr: "Un INSERT d'une ligne dont le shipment_id existe déjà dans la table échoue à cause de shipments_pk." }
        - id: s2
          text: { en: "Running `ALTER TABLE tailspin.silver.shipments ALTER COLUMN carrier SET NOT NULL` fails.", fr: "L'exécution de `ALTER TABLE tailspin.silver.shipments ALTER COLUMN carrier SET NOT NULL` échoue." }
        - id: s3
          text: { en: "Adding the constraint `CHECK (weight_kg > 0)` can upgrade the writer protocol of the table and affect the external client.", fr: "L'ajout de la contrainte `CHECK (weight_kg > 0)` peut mettre à niveau le protocole d'écriture de la table et affecter le client externe." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Primary keys are informational in Unity Catalog: they aren't enforced, so a duplicate shipment_id is written. Before it adds `NOT NULL`, Azure Databricks checks all the existing rows, so the statement fails because some carriers are null. Adding a constraint upgrades the table writer protocol when its writer version is below 3, which can affect external Delta Lake clients.
        fr: |
          Les clés primaires sont informationnelles dans Unity Catalog : elles ne sont pas appliquées, donc un shipment_id en double est écrit. Avant d'ajouter `NOT NULL`, Azure Databricks vérifie toutes les lignes existantes : l'instruction échoue donc, car certains carriers sont null. L'ajout d'une contrainte met à niveau le protocole d'écriture de la table quand sa version d'écriture est inférieure à 3, ce qui peut affecter les clients Delta Lake externes.
    references:
      - title: Constraints on Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/tables/constraints

  # ------------------------------------------------------------------ 6
  - id: dp750-qz-35-06
    objective: "3.4.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys runs the following notebook code in a task of a Lakeflow job. It ingests JSON event files into the Delta table **tailspin.bronze.events** with Auto Loader. No schema is provided, and `cloudFiles.schemaEvolutionMode` isn't set.

        ```python
        (spark.readStream.format("cloudFiles")
            .option("cloudFiles.format", "json")
            .option(<reader option>, "/Volumes/tailspin/bronze/_meta/events")
            .load("/Volumes/tailspin/landing/events/")
          .writeStream
            .option("checkpointLocation", "/Volumes/tailspin/bronze/_meta/events")
            .option(<writer option>, "true")
            .trigger(availableNow=True)
            .toTable("tailspin.bronze.events"))
        ```

        The source application regularly adds fields to its events. You need to meet the following requirements:

        - Each new field must become a column of tailspin.bronze.events without manual intervention.
        - The types of the existing columns must not change.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys exécute le code de notebook suivant dans une tâche d'un job Lakeflow. Il ingère des fichiers d'événements JSON dans la table Delta **tailspin.bronze.events** avec Auto Loader. Aucun schéma n'est fourni, et `cloudFiles.schemaEvolutionMode` n'est pas défini.

        ```python
        (spark.readStream.format("cloudFiles")
            .option("cloudFiles.format", "json")
            .option(<reader option>, "/Volumes/tailspin/bronze/_meta/events")
            .load("/Volumes/tailspin/landing/events/")
          .writeStream
            .option("checkpointLocation", "/Volumes/tailspin/bronze/_meta/events")
            .option(<writer option>, "true")
            .trigger(availableNow=True)
            .toTable("tailspin.bronze.events"))
        ```

        L'application source ajoute régulièrement des champs à ses événements. Vous devez satisfaire les exigences suivantes :

        - Chaque nouveau champ doit devenir une colonne de tailspin.bronze.events sans intervention manuelle.
        - Les types des colonnes existantes ne doivent pas changer.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          - Reader option: [[reader]]
          - Writer option: [[writer]]
          - Setting of the job task: [[task]]
        fr: |
          - Option du lecteur : [[reader]]
          - Option de l'écriture : [[writer]]
          - Paramètre de la tâche du job : [[task]]
      slots:
        - id: reader
          options:
            - { id: hints, text: "`cloudFiles.schemaHints`" }
            - { id: location, text: "`cloudFiles.schemaLocation`" }
            - { id: infer, text: "`cloudFiles.inferColumnTypes`" }
            - { id: badrec, text: "`badRecordsPath`" }
        - id: writer
          options:
            - { id: overwrite, text: "`overwriteSchema`" }
            - { id: rescued, text: "`rescuedDataColumn`" }
            - { id: merge, text: "`mergeSchema`" }
        - id: task
          options:
            - { id: timeout, text: { en: "A timeout", fr: "Un délai d'expiration" } }
            - { id: retry, text: { en: "A retry policy", fr: "Une stratégie de nouvelle tentative" } }
            - { id: warning, text: { en: "A duration warning", fr: "Un avertissement de durée" } }
            - { id: alldone, text: { en: "Run if set to All done", fr: "Run if défini sur All done" } }
    answer:
      values: { reader: location, writer: merge, task: retry }
    explanation:
      correct:
        en: |
          `cloudFiles.schemaLocation` enables schema inference and evolution; without a provided schema, the default mode is `addNewColumns`, which never changes existing types. When a new field appears, the stream fails with `UnknownFieldException` after adding the column to the schema, so the job task needs a retry policy to restart it automatically. On the write side, `mergeSchema` lets the Delta table accept the new column instead of rejecting the write by schema enforcement.
        fr: |
          `cloudFiles.schemaLocation` active la déduction et l'évolution du schéma ; sans schéma fourni, le mode par défaut est `addNewColumns`, qui ne change jamais les types existants. Quand un nouveau champ apparaît, le flux échoue avec `UnknownFieldException` après avoir ajouté la colonne au schéma : la tâche du job a donc besoin d'une stratégie de nouvelle tentative pour le redémarrer automatiquement. Côté écriture, `mergeSchema` permet à la table Delta d'accepter la nouvelle colonne au lieu de rejeter l'écriture par l'application du schéma.
      options:
        hints: { en: "Schema hints force the types of some columns; they don't enable schema tracking, which needs a schema location.", fr: "Les indicateurs de schéma imposent le type de certaines colonnes ; ils n'activent pas le suivi du schéma, qui exige un emplacement de schéma." }
        overwrite: { en: "`overwriteSchema` replaces the schema on an overwrite; it doesn't apply to appends from a stream.", fr: "`overwriteSchema` remplace le schéma lors d'un remplacement ; il ne s'applique pas aux ajouts d'un flux." }
        timeout: { en: "A timeout stops a long attempt; it doesn't restart the stream after the expected UnknownFieldException.", fr: "Un délai d'expiration arrête une tentative trop longue ; il ne redémarre pas le flux après l'UnknownFieldException attendue." }
    references:
      - title: Configure schema inference and evolution in Auto Loader
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
      - title: Update table schemas with schema evolution
        url: https://learn.microsoft.com/en-us/azure/databricks/tables/update-schema

  # ------------------------------------------------------------------ 7
  - id: dp750-qz-35-07
    objective: "3.4.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam runs a Lakeflow Spark Declarative Pipelines pipeline in continuous mode. Its SQL source defines the following datasets:

        - The temporary view **readings_checked** reads **fabrikam.bronze.readings** and has the expectation `CONSTRAINT valid_unit EXPECT (unit IN ('C', 'F'))`.
        - The streaming table **readings_silver** reads readings_checked and has the expectation `CONSTRAINT valid_sensor EXPECT (sensor_id IS NOT NULL) ON VIOLATION FAIL UPDATE`.
        - The materialized view **readings_hourly** aggregates readings_silver.

        A reading without a `sensor_id` value has just reached readings_silver.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam exécute un pipeline Lakeflow Spark Declarative Pipelines en mode continu. Sa source SQL définit les jeux de données suivants :

        - La vue temporaire **readings_checked** lit **fabrikam.bronze.readings** et a l'attente `CONSTRAINT valid_unit EXPECT (unit IN ('C', 'F'))`.
        - La table de diffusion en continu **readings_silver** lit readings_checked et a l'attente `CONSTRAINT valid_sensor EXPECT (sensor_id IS NOT NULL) ON VIOLATION FAIL UPDATE`.
        - La vue matérialisée **readings_hourly** agrège readings_silver.

        Une lecture sans valeur `sensor_id` vient d'atteindre readings_silver.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "readings_hourly stops being updated as well.", fr: "readings_hourly cesse également d'être mise à jour." }
        - id: s2
          text: { en: "Before this failure, the readings that violated valid_unit were kept out of readings_silver.", fr: "Avant cet échec, les lectures qui violaient valid_unit étaient exclues de readings_silver." }
        - id: s3
          text: { en: "If the pipeline is restarted without changing the code or the source data, readings_silver fails again on the same reading.", fr: "Si le pipeline est redémarré sans modifier le code ni les données sources, readings_silver échoue de nouveau sur la même lecture." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          In a continuous pipeline, a fail expectation stops the flow and all the flows that depend on it, so readings_hourly stops too. valid_unit has no `ON VIOLATION` clause: it only warns, so the invalid units passed through the view into readings_silver and only appear in the metrics. The failed update is rolled back and the reading hasn't been processed, so a restart reads it again and fails until the code or the data is fixed.
        fr: |
          Dans un pipeline continu, une attente fail arrête le flux et tous les flux qui en dépendent : readings_hourly s'arrête donc aussi. valid_unit n'a pas de clause `ON VIOLATION` : elle se contente d'avertir, si bien que les unités non valides sont passées par la vue jusqu'à readings_silver et n'apparaissent que dans les métriques. La mise à jour en échec est annulée et la lecture n'a pas été traitée : un redémarrage la relit et échoue tant que le code ou les données ne sont pas corrigés.
      options:
        s2: { en: "A warn expectation, even on a view, never filters records; DROP ROW would be needed to keep them out.", fr: "Une attente warn, même sur une vue, ne filtre jamais d'enregistrements ; DROP ROW serait nécessaire pour les exclure." }
    references:
      - title: Manage data quality with pipeline expectations
        url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations

  # ------------------------------------------------------------------ 8
  - id: dp750-qz-35-08
    objective: "3.4.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders publishes the Delta table **northwind.gold.store_day_sales**, with the columns `store_id`, `sale_day` and `revenue`. In a Lakeflow job, a Python task runs the query below and then raises an exception when `n` differs from `k` or when `missing_store` or `out_of_range` is greater than 0.

        The task must fail when the table meets at least one of the following conditions:

        - Two rows or more exist for the same store and the same day.
        - A row has no store_id value.
        - A revenue value is lower than 0 or greater than 500000.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders publie la table Delta **northwind.gold.store_day_sales**, avec les colonnes `store_id`, `sale_day` et `revenue`. Dans un job Lakeflow, une tâche Python exécute la requête ci-dessous, puis lève une exception quand `n` diffère de `k` ou quand `missing_store` ou `out_of_range` est supérieur à 0.

        La tâche doit échouer quand la table remplit au moins l'une des conditions suivantes :

        - Il existe au moins deux lignes pour le même magasin et le même jour.
        - Une ligne n'a pas de valeur store_id.
        - Une valeur revenue est inférieure à 0 ou supérieure à 500000.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        SELECT count(*) AS n,
               [[card]] AS k,
               count_if([[nulls]]) AS missing_store,
               count_if([[range]]) AS out_of_range
        FROM northwind.gold.store_day_sales;
      slots:
        - id: card
          options:
            - { id: approx, text: "approx_count_distinct(store_id)" }
            - { id: sum, text: "count(DISTINCT store_id) + count(DISTINCT sale_day)" }
            - { id: pair, text: "count(DISTINCT store_id, sale_day)" }
            - { id: plain, text: "count(store_id)" }
        - id: nulls
          options:
            - { id: eqnull, text: "store_id = NULL" }
            - { id: isnull, text: "store_id IS NULL" }
            - { id: empty, text: "store_id = ''" }
        - id: range
          options:
            - { id: and, text: "revenue < 0 AND revenue > 500000" }
            - { id: between, text: "revenue BETWEEN 0 AND 500000" }
            - { id: notbetween, text: "revenue NOT BETWEEN 0 AND 500000" }
    answer:
      values: { card: pair, nulls: isnull, range: notbetween }
    explanation:
      correct:
        en: |
          The grain of the table is one row per store and per day, so the cardinality check compares `count(*)` with the exact number of distinct (store_id, sale_day) pairs. A null is detected with `IS NULL` only. `NOT BETWEEN 0 AND 500000` is true for a value lower than 0 or greater than 500000. Unique and primary keys aren't enforced on Delta tables, which is why a job runs such a query before publishing.
        fr: |
          Le grain de la table est d'une ligne par magasin et par jour : la vérification de cardinalité compare donc `count(*)` au nombre exact de couples (store_id, sale_day) distincts. Une valeur null ne se détecte qu'avec `IS NULL`. `NOT BETWEEN 0 AND 500000` est vrai pour une valeur inférieure à 0 ou supérieure à 500000. Les clés uniques et primaires ne sont pas appliquées sur les tables Delta, c'est pourquoi un job exécute une telle requête avant de publier.
      options:
        approx: { en: "An approximate count can miss duplicates, and it counts stores, not store-day pairs.", fr: "Un comptage approximatif peut manquer des doublons, et il compte les magasins, pas les couples magasin-jour." }
        sum: { en: "Adding the distinct stores and the distinct days doesn't give the number of distinct pairs.", fr: "Additionner les magasins distincts et les jours distincts ne donne pas le nombre de couples distincts." }
        eqnull: { en: "A comparison with NULL returns NULL, never true, so no row would be counted.", fr: "Une comparaison avec NULL renvoie NULL, jamais true : aucune ligne ne serait comptée." }
        and: { en: "A value can't be both lower than 0 and greater than 500000: this condition is never true.", fr: "Une valeur ne peut pas être à la fois inférieure à 0 et supérieure à 500000 : cette condition n'est jamais vraie." }
    references:
      - title: Constraints on Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/tables/constraints

  # ------------------------------------------------------------------ 9
  - id: dp750-qz-35-09
    objective: "3.4.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has a Lakeflow Spark Declarative Pipelines pipeline whose SQL source defines the materialized view **stores_silver** and the streaming table **orders_silver**, which reads `STREAM(orders_bronze)`. Each order has a `store_id` value.

        You need to meet the following requirements:

        - orders_silver must not contain orders whose store_id doesn't exist in stores_silver.
        - The number of orders removed for this reason must appear in the data quality metrics of the pipeline.
        - Pipeline updates must continue when such orders arrive.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un pipeline Lakeflow Spark Declarative Pipelines dont la source SQL définit la vue matérialisée **stores_silver** et la table de diffusion en continu **orders_silver**, qui lit `STREAM(orders_bronze)`. Chaque commande a une valeur `store_id`.

        Vous devez satisfaire les exigences suivantes :

        - orders_silver ne doit pas contenir de commandes dont le store_id n'existe pas dans stores_silver.
        - Le nombre de commandes supprimées pour cette raison doit apparaître dans les métriques de qualité des données du pipeline.
        - Les mises à jour du pipeline doivent continuer quand de telles commandes arrivent.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - id: a
          text:
            en: "Add `CONSTRAINT known_store EXPECT (store_id IN (SELECT store_id FROM stores_silver)) ON VIOLATION DROP ROW` to orders_silver."
            fr: "Ajouter `CONSTRAINT known_store EXPECT (store_id IN (SELECT store_id FROM stores_silver)) ON VIOLATION DROP ROW` à orders_silver."
        - id: b
          text:
            en: "In the query of orders_silver, left outer join the orders to stores_silver and return stores_silver.store_id as known_store_id."
            fr: "Dans la requête de orders_silver, effectuer une jointure externe gauche des commandes avec stores_silver et renvoyer stores_silver.store_id comme known_store_id."
        - id: c
          text:
            en: "Add `CONSTRAINT known_store EXPECT (known_store_id IS NOT NULL) ON VIOLATION FAIL UPDATE` to orders_silver."
            fr: "Ajouter `CONSTRAINT known_store EXPECT (known_store_id IS NOT NULL) ON VIOLATION FAIL UPDATE` à orders_silver."
        - id: d
          text:
            en: "Declare `FOREIGN KEY (store_id) REFERENCES stores_silver` on orders_silver so that orders with an unknown store are rejected."
            fr: "Déclarer `FOREIGN KEY (store_id) REFERENCES stores_silver` sur orders_silver afin que les commandes d'un magasin inconnu soient rejetées."
        - id: e
          text:
            en: "Add `CONSTRAINT known_store EXPECT (known_store_id IS NOT NULL) ON VIOLATION DROP ROW` to orders_silver."
            fr: "Ajouter `CONSTRAINT known_store EXPECT (known_store_id IS NOT NULL) ON VIOLATION DROP ROW` à orders_silver."
    answer: { optionIds: [ b, e ] }
    explanation:
      correct:
        en: |
          An expectation is evaluated on each record and can't contain a subquery on another table. You therefore bring the lookup result into the record with a left outer join: orders of an unknown store get a null known_store_id. A drop expectation on that column then removes them before the write, records the dropped count in the metrics and lets the update continue.
        fr: |
          Une attente est évaluée sur chaque enregistrement et ne peut pas contenir de sous-requête sur une autre table. Vous amenez donc le résultat de la recherche dans l'enregistrement par une jointure externe gauche : les commandes d'un magasin inconnu reçoivent un known_store_id null. Une attente drop sur cette colonne les supprime ensuite avant l'écriture, enregistre le nombre de lignes supprimées dans les métriques et laisse la mise à jour continuer.
      options:
        a: { en: "The constraint of an expectation can't use a subquery that references another table.", fr: "La contrainte d'une attente ne peut pas utiliser de sous-requête qui référence une autre table." }
        c: { en: "FAIL UPDATE stops the update at the first unknown store, which breaks the third requirement, and records no metrics.", fr: "FAIL UPDATE arrête la mise à jour au premier magasin inconnu, ce qui enfreint la troisième exigence, et n'enregistre aucune métrique." }
        d: { en: "Foreign keys are informational and aren't enforced: they reject nothing and produce no metrics.", fr: "Les clés étrangères sont informationnelles et ne sont pas appliquées : elles ne rejettent rien et ne produisent aucune métrique." }
    references:
      - title: Expectation recommendations and advanced patterns
        url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectation-patterns
      - title: Manage data quality with pipeline expectations
        url: https://learn.microsoft.com/en-us/azure/databricks/ldp/expectations

  # ------------------------------------------------------------------ 10
  - id: dp750-qz-35-10
    objective: "3.4.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A notebook task at Proseware ingests JSON order files with Auto Loader and appends them to **proseware.bronze.orders** with `mergeSchema` set to `true`. The task has a retry policy. The reader currently uses the following options:

        ```python
        .option("cloudFiles.format", "json")
        .option("cloudFiles.schemaLocation", "/Volumes/proseware/bronze/_meta/orders")
        .schema("order_id STRING, amount DECIMAL(12,2), order_day DATE, channel STRING")
        ```

        The source now adds fields without notice. You need to meet the following requirements:

        - `amount` must be read as `DECIMAL(12,2)` and `order_day` as `DATE`. The other columns can use the types that Auto Loader infers.
        - Values that don't match these types must be kept in the `_rescued_data` column.
        - New fields must be added to the table schema automatically.

        What should you do?
      fr: |
        Une tâche de notebook de Proseware ingère des fichiers de commandes JSON avec Auto Loader et les ajoute à **proseware.bronze.orders** avec `mergeSchema` défini sur `true`. La tâche a une stratégie de nouvelle tentative. Le lecteur utilise actuellement les options suivantes :

        ```python
        .option("cloudFiles.format", "json")
        .option("cloudFiles.schemaLocation", "/Volumes/proseware/bronze/_meta/orders")
        .schema("order_id STRING, amount DECIMAL(12,2), order_day DATE, channel STRING")
        ```

        La source ajoute désormais des champs sans préavis. Vous devez satisfaire les exigences suivantes :

        - `amount` doit être lue en `DECIMAL(12,2)` et `order_day` en `DATE`. Les autres colonnes peuvent utiliser les types déduits par Auto Loader.
        - Les valeurs qui ne correspondent pas à ces types doivent être conservées dans la colonne `_rescued_data`.
        - Les nouveaux champs doivent être ajoutés automatiquement au schéma de la table.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the schema() call, and set cloudFiles.schemaEvolutionMode to addNewColumns.", fr: "Conserver l'appel schema(), et définir cloudFiles.schemaEvolutionMode sur addNewColumns." } }
        - { id: b, text: { en: "Keep the schema() call, and set rescuedDataColumn to _rescued_data.", fr: "Conserver l'appel schema(), et définir rescuedDataColumn sur _rescued_data." } }
        - { id: c, text: { en: "Remove the schema() call, and set cloudFiles.inferColumnTypes to true.", fr: "Supprimer l'appel schema(), et définir cloudFiles.inferColumnTypes sur true." } }
        - { id: d, text: { en: "Remove the schema() call, and set cloudFiles.schemaHints to the two typed columns.", fr: "Supprimer l'appel schema(), et définir cloudFiles.schemaHints sur les deux colonnes typées." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Without a provided schema, Auto Loader infers the schema, adds `_rescued_data` automatically and uses the `addNewColumns` mode, so new fields are added after the expected restart that the retry policy performs. The schema hint `amount DECIMAL(12,2), order_day DATE` forces the two types, and values that don't match them are rescued. Schema hints are used only when no schema is provided, which is why the schema() call must go.
        fr: |
          Sans schéma fourni, Auto Loader déduit le schéma, ajoute automatiquement `_rescued_data` et utilise le mode `addNewColumns` : les nouveaux champs sont ajoutés après le redémarrage attendu qu'effectue la stratégie de nouvelle tentative. L'indicateur de schéma `amount DECIMAL(12,2), order_day DATE` impose les deux types, et les valeurs qui ne leur correspondent pas sont récupérées. Les indicateurs de schéma ne sont utilisés que si aucun schéma n'est fourni : c'est pourquoi l'appel schema() doit disparaître.
      options:
        a: { en: "addNewColumns isn't allowed when the stream schema is provided; it works only with an inferred schema, possibly with hints.", fr: "addNewColumns n'est pas autorisé quand le schéma du flux est fourni ; il ne fonctionne qu'avec un schéma déduit, éventuellement avec des indicateurs." }
        b: { en: "With a provided schema, the default mode is none: new fields are ignored, so they never reach the table schema.", fr: "Avec un schéma fourni, le mode par défaut est none : les nouveaux champs sont ignorés et n'atteignent donc jamais le schéma de la table." }
        c: { en: "Type inference picks the types from the data, so amount isn't guaranteed to be DECIMAL(12,2) nor order_day to be DATE.", fr: "La déduction des types choisit les types d'après les données : rien ne garantit que amount soit DECIMAL(12,2) ni que order_day soit DATE." }
    references:
      - title: Configure schema inference and evolution in Auto Loader
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
