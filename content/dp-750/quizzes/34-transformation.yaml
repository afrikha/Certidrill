chapter: 34-transformation
questions:
  # ------------------------------------------------------------------ 1
  - id: dp750-qz-34-01
    objective: "3.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A data engineer at Contoso runs a query in a notebook and gets a results table with 40 columns. The engineer wants to see profiling statistics for three of these columns only, without writing any more code.

        What should the engineer do?
      fr: |
        Un ingénieur données de Contoso exécute une requête dans un notebook et obtient une table de résultats de 40 colonnes. L'ingénieur veut voir les statistiques de profilage de trois de ces colonnes uniquement, sans écrire de code supplémentaire.

        Que doit faire l'ingénieur ?
    body:
      options:
        - { id: a, text: { en: "Pin the three column headers so that they stay visible in the results table.", fr: "Épingler les trois en-têtes de colonne pour qu'ils restent visibles dans la table de résultats." } }
        - { id: b, text: { en: "Run DESCRIBE TABLE EXTENDED on the table that the query reads.", fr: "Exécuter DESCRIBE TABLE EXTENDED sur la table que lit la requête." } }
        - { id: c, text: { en: "Select the three column headers in the results table, then open the selection details.", fr: "Sélectionner les trois en-têtes de colonne dans la table de résultats, puis ouvrir les détails de la sélection." } }
        - { id: d, text: { en: "Run dbutils.data.summarize on a DataFrame that holds the result of the query.", fr: "Exécuter dbutils.data.summarize sur un DataFrame qui contient le résultat de la requête." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          In a notebook results table, you can select several column headers (Ctrl or Cmd + click) and click **Open selection details**. When column headers are selected, the side pane displays profiling statistics for those columns, with no extra code.
        fr: |
          Dans une table de résultats de notebook, vous pouvez sélectionner plusieurs en-têtes de colonne (Ctrl ou Cmd + clic) puis cliquer sur **Open selection details**. Quand des en-têtes de colonne sont sélectionnés, le volet latéral affiche les statistiques de profilage de ces colonnes, sans code supplémentaire.
      options:
        a: { en: "Pinning keeps the columns visible while you scroll; it doesn't compute any statistic.", fr: "L'épinglage garde les colonnes visibles pendant le défilement ; il ne calcule aucune statistique." }
        b: { en: "DESCRIBE TABLE EXTENDED returns the metadata of the table, such as columns, types and properties, not the distribution of the values.", fr: "DESCRIBE TABLE EXTENDED renvoie les métadonnées de la table, comme les colonnes, les types et les propriétés, pas la distribution des valeurs." }
        d: { en: "dbutils.data.summarize is more code, and it profiles every column of the DataFrame rather than the three selected ones.", fr: "dbutils.data.summarize demande du code supplémentaire, et il profile toutes les colonnes du DataFrame plutôt que les trois colonnes choisies." }
    references:
      - title: Notebook outputs and results - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/notebooks/notebook-outputs

  # ------------------------------------------------------------------ 2
  - id: dp750-qz-34-02
    objective: "3.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank is creating the table **woodgrove.silver.customers**. The **birth_date** column stores the date of birth of each customer, such as 1984-06-23. The value must be the same in every session time zone, and no time of day is needed.

        Which data type should you use for birth_date?
      fr: |
        Woodgrove Bank crée la table **woodgrove.silver.customers**. La colonne **birth_date** stocke la date de naissance de chaque client, par exemple 1984-06-23. La valeur doit être la même dans tous les fuseaux horaires de session, et aucune heure de la journée n'est nécessaire.

        Quel type de données devez-vous utiliser pour birth_date ?
    body:
      options:
        - { id: a, text: TIMESTAMP }
        - { id: b, text: DATE }
        - { id: c, text: TIMESTAMP_NTZ }
        - { id: d, text: STRING }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `DATE` holds a year, a month and a day, without a time zone, which is exactly a calendar day such as a date of birth. Its values don't shift when the session time zone changes, and date functions and comparisons work on it directly.
        fr: |
          `DATE` contient une année, un mois et un jour, sans fuseau horaire, ce qui correspond exactement à un jour du calendrier comme une date de naissance. Ses valeurs ne changent pas quand le fuseau horaire de la session change, et les fonctions et comparaisons de dates s'y appliquent directement.
      options:
        a: { en: "TIMESTAMP is an instant displayed in the session time zone, so the day shown can change with the time zone, and it stores a useless time of day.", fr: "TIMESTAMP est un instant affiché dans le fuseau horaire de la session : le jour affiché peut changer avec le fuseau, et il stocke une heure inutile." }
        c: { en: "TIMESTAMP_NTZ doesn't shift with the time zone, but it stores a time of day that the column doesn't need.", fr: "TIMESTAMP_NTZ ne change pas avec le fuseau horaire, mais il stocke une heure de la journée dont la colonne n'a pas besoin." }
        d: { en: "A STRING accepts invalid values and prevents date arithmetic and correct comparisons without conversion.", fr: "Un STRING accepte des valeurs non valides et empêche les calculs de dates et les comparaisons correctes sans conversion." }
    references:
      - title: DATE type - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/data-types/date-type

  # ------------------------------------------------------------------ 3
  - id: dp750-qz-34-03
    objective: "3.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum builds **adatum.silver.contacts** from **adatum.bronze.contacts** with a SQL query. In bronze, the **email** column is NULL for some contacts, an empty string for others, and a string made only of spaces for others. Valid email addresses never have leading or trailing spaces.

        In silver, every missing email must be NULL, and valid email addresses must stay unchanged.

        Which expression should you use in the SELECT list?
      fr: |
        Adatum construit **adatum.silver.contacts** à partir d'**adatum.bronze.contacts** avec une requête SQL. Dans bronze, la colonne **email** est NULL pour certains contacts, une chaîne vide pour d'autres, et une chaîne composée uniquement d'espaces pour d'autres encore. Les adresses e-mail valides n'ont jamais d'espaces au début ni à la fin.

        Dans silver, chaque e-mail manquant doit être NULL, et les adresses e-mail valides doivent rester inchangées.

        Quelle expression devez-vous utiliser dans la liste SELECT ?
    body:
      options:
        - { id: a, text: "trim(nullif(email, '')) AS email" }
        - { id: b, text: "nullif(trim(email), '') AS email" }
        - { id: c, text: "coalesce(trim(email), '') AS email" }
        - { id: d, text: "CASE WHEN email = '' THEN NULL ELSE email END AS email" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `trim` turns a string made only of spaces into an empty string, then `nullif` returns NULL when its two arguments are equal, so both kinds of blank values become NULL. A NULL email stays NULL, and a valid address, which has no surrounding spaces, comes out unchanged.
        fr: |
          `trim` transforme une chaîne composée uniquement d'espaces en chaîne vide, puis `nullif` renvoie NULL quand ses deux arguments sont égaux : les deux sortes de valeurs vides deviennent donc NULL. Un e-mail NULL reste NULL, et une adresse valide, qui n'a pas d'espaces autour, ressort inchangée.
      options:
        a: { en: "nullif runs first, so a string of spaces isn't equal to '' and passes through; trim then turns it into an empty string instead of NULL.", fr: "nullif s'exécute d'abord : une chaîne d'espaces n'est pas égale à '' et passe ; trim la transforme ensuite en chaîne vide au lieu de NULL." }
        c: { en: "coalesce does the opposite: it replaces NULL emails with an empty string, and the blank values stay empty strings.", fr: "coalesce fait l'inverse : il remplace les e-mails NULL par une chaîne vide, et les valeurs vides restent des chaînes vides." }
        d: { en: "The CASE expression handles empty strings, but a string made only of spaces isn't equal to '' and stays in the column.", fr: "L'expression CASE traite les chaînes vides, mais une chaîne composée uniquement d'espaces n'est pas égale à '' et reste dans la colonne." }
    references:
      - title: nullif function - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/nullif

  # ------------------------------------------------------------------ 4
  - id: dp750-qz-34-04
    objective: "3.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam stores order lines in **fabrikam.silver.sales**, with the columns **region**, **channel** and **amount**. Neither region nor channel contains NULL values. You are writing the single query that builds **fabrikam.gold.channel_revenue**.

        The table must contain one row for each combination of region and channel, and one subtotal row for each channel across all the regions. It must contain no subtotal row per region and no grand total row.

        Which GROUP BY clause should you use?
      fr: |
        Fabrikam stocke des lignes de commande dans **fabrikam.silver.sales**, avec les colonnes **region**, **channel** et **amount**. Ni region ni channel ne contient de valeurs NULL. Vous écrivez la requête unique qui construit **fabrikam.gold.channel_revenue**.

        La table doit contenir une ligne pour chaque combinaison de région et de canal, et une ligne de sous-total pour chaque canal toutes régions confondues. Elle ne doit contenir aucune ligne de sous-total par région ni de ligne de total général.

        Quelle clause GROUP BY devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "GROUP BY ROLLUP (channel, region)" }
        - { id: b, text: "GROUP BY CUBE (region, channel)" }
        - { id: c, text: "GROUP BY ROLLUP (region, channel)" }
        - { id: d, text: "GROUP BY GROUPING SETS ((region, channel), (channel))" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `GROUPING SETS` produces exactly the listed groupings, as a union of one `GROUP BY` per set: `(region, channel)` gives the detail rows and `(channel)` the subtotal of each channel, with NULL in region. No other grouping, and therefore no grand total, is added.
        fr: |
          `GROUPING SETS` produit exactement les regroupements listés, comme une union d'un `GROUP BY` par ensemble : `(region, channel)` donne les lignes de détail et `(channel)` le sous-total de chaque canal, avec NULL dans region. Aucun autre regroupement, et donc aucun total général, n'est ajouté.
      options:
        a: { en: "ROLLUP (channel, region) is GROUPING SETS ((channel, region), (channel), ()): the last set adds a grand total row.", fr: "ROLLUP (channel, region) équivaut à GROUPING SETS ((channel, region), (channel), ()) : le dernier ensemble ajoute une ligne de total général." }
        b: { en: "CUBE adds every combination: subtotals per region, per channel and a grand total.", fr: "CUBE ajoute toutes les combinaisons : des sous-totaux par région, par canal et un total général." }
        c: { en: "ROLLUP (region, channel) adds a subtotal per region and a grand total, but no subtotal per channel.", fr: "ROLLUP (region, channel) ajoute un sous-total par région et un total général, mais aucun sous-total par canal." }
    references:
      - title: GROUP BY clause - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-groupby

  # ------------------------------------------------------------------ 5
  - id: dp750-qz-34-05
    objective: "3.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A PySpark notebook at Litware reads **litware.silver.store_quarters** into a DataFrame named `wide_df`, with the columns **store_id**, **year**, **q1**, **q2**, **q3** and **q4**. Each quarter column contains the revenue of the quarter.

        You need a DataFrame with one row per store, year and quarter, and the columns **store_id**, **year**, **quarter** (which contains q1, q2, q3 or q4) and **revenue**.

        Which code should you use?
      fr: |
        Un notebook PySpark de Litware lit **litware.silver.store_quarters** dans un DataFrame nommé `wide_df`, avec les colonnes **store_id**, **year**, **q1**, **q2**, **q3** et **q4**. Chaque colonne de trimestre contient le chiffre d'affaires du trimestre.

        Vous avez besoin d'un DataFrame avec une ligne par magasin, année et trimestre, et les colonnes **store_id**, **year**, **quarter** (qui contient q1, q2, q3 ou q4) et **revenue**.

        Quel code devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "wide_df.unpivot([\"q1\", \"q2\", \"q3\", \"q4\"], [\"store_id\", \"year\"], \"quarter\", \"revenue\")" }
        - { id: b, text: "wide_df.unpivot([\"store_id\", \"year\"], [\"q1\", \"q2\", \"q3\", \"q4\"], \"revenue\", \"quarter\")" }
        - { id: c, text: "wide_df.unpivot([\"store_id\", \"year\"], [\"q1\", \"q2\", \"q3\", \"q4\"], \"quarter\", \"revenue\")" }
        - { id: d, text: "wide_df.groupBy(\"store_id\", \"year\").pivot(\"quarter\").sum(\"revenue\")" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `unpivot(ids, values, variableColumnName, valueColumnName)` keeps the identifier columns, turns each value column into one row, writes the name of the source column into the variable column and its content into the value column. Here the identifiers are store_id and year, the variable column is quarter and the value column is revenue.
        fr: |
          `unpivot(ids, values, variableColumnName, valueColumnName)` conserve les colonnes d'identifiant, transforme chaque colonne de valeur en une ligne, écrit le nom de la colonne source dans la colonne de variable et son contenu dans la colonne de valeur. Ici, les identifiants sont store_id et year, la colonne de variable est quarter et la colonne de valeur est revenue.
      options:
        a: { en: "The first argument is the list of identifiers; this call would keep the quarter columns and unpivot store_id and year.", fr: "Le premier argument est la liste des identifiants ; cet appel conserverait les colonnes de trimestre et dépivoterait store_id et year." }
        b: { en: "The last two arguments are swapped: the column named revenue would contain q1 to q4 and the column named quarter the amounts.", fr: "Les deux derniers arguments sont inversés : la colonne nommée revenue contiendrait q1 à q4 et la colonne nommée quarter les montants." }
        d: { en: "pivot does the opposite transformation, and wide_df has no quarter or revenue column to pivot.", fr: "pivot effectue la transformation inverse, et wide_df n'a pas de colonne quarter ni revenue à pivoter." }
    references:
      - title: unpivot - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframe/unpivot

  # ------------------------------------------------------------------ 6
  - id: dp750-qz-34-06
    objective: "3.3.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A data engineer at Tailspin Toys writes the following query to build the regional revenue dashboard table **tailspin.gold.region_kpis** from the order history. In **tailspin.silver.orders**, the region, channel and amount columns never contain NULL values.

        ```sql
        SELECT region,
               channel,
               sum(amount)                          AS revenue,
               count(*) FILTER (WHERE amount > 500) AS large_orders
        FROM tailspin.silver.orders
        WHERE status = 'shipped'
        GROUP BY GROUPING SETS ((region, channel), (region), ())
        HAVING sum(amount) > 100000;
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un ingénieur données de Tailspin Toys écrit la requête suivante pour construire la table de tableau de bord du chiffre d'affaires régional **tailspin.gold.region_kpis** à partir de l'historique des commandes. Dans **tailspin.silver.orders**, les colonnes region, channel et amount ne contiennent jamais de valeurs NULL.

        ```sql
        SELECT region,
               channel,
               sum(amount)                          AS revenue,
               count(*) FILTER (WHERE amount > 500) AS large_orders
        FROM tailspin.silver.orders
        WHERE status = 'shipped'
        GROUP BY GROUPING SETS ((region, channel), (region), ())
        HAVING sum(amount) > 100000;
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The result can contain rows in which region is NULL and channel is not NULL.", fr: "Le résultat peut contenir des lignes dans lesquelles region est NULL et channel n'est pas NULL." }
        - id: s2
          text: { en: "The grand total row appears only when the revenue of all the shipped orders exceeds 100,000.", fr: "La ligne de total général n'apparaît que si le chiffre d'affaires de toutes les commandes expédiées dépasse 100 000." }
        - id: s3
          text: { en: "In each row, large_orders counts the orders of the group whose amount exceeds 500, whatever their status.", fr: "Dans chaque ligne, large_orders compte les commandes du groupe dont le montant dépasse 500, quel que soit leur statut." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The grouping sets produce the detail rows per region and channel, a subtotal per region (channel NULL) and a grand total (both NULL), but no row per channel across regions. HAVING filters every row produced by the grouping, the grand total included. WHERE runs before the aggregation, and FILTER only restricts the rows passed to its aggregate, so large_orders counts shipped orders above 500.
        fr: |
          Les ensembles de regroupement produisent les lignes de détail par région et canal, un sous-total par région (channel NULL) et un total général (les deux NULL), mais aucune ligne par canal toutes régions confondues. HAVING filtre chaque ligne produite par le regroupement, total général compris. WHERE s'exécute avant l'agrégation, et FILTER ne restreint que les lignes transmises à son agrégat : large_orders compte donc les commandes expédiées de plus de 500.
      options:
        s1: { en: "A channel subtotal would need the set (channel), which the GROUPING SETS clause doesn't list.", fr: "Un sous-total par canal exigerait l'ensemble (channel), que la clause GROUPING SETS ne liste pas." }
        s3: { en: "The WHERE clause removes the orders that aren't shipped before any aggregate, FILTER included, sees them.", fr: "La clause WHERE retire les commandes non expédiées avant qu'un agrégat, FILTER compris, ne les voie." }
    references:
      - title: GROUP BY clause - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-groupby
      - title: HAVING clause - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-qry-select-having

  # ------------------------------------------------------------------ 7
  - id: dp750-qz-34-07
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso loads order lines with Auto Loader into **contoso.bronze.order_lines**, where every column is a STRING. The **quantity** column is NULL when the quantity wasn't known at order time, and it sometimes contains malformed text such as `N/A` or `12 pcs`. The **unit_price** column has two decimal places and never exceeds 99,999.99.

        You are writing the two statements below, which run on a SQL warehouse where ANSI_MODE has its default value, TRUE. The solution must meet the following requirements:

        - The first statement never fails because of a malformed value; a malformed quantity or price becomes NULL.
        - quantity is stored as INT, and unit_price is stored with exactly two decimal places so that totals add up to the cent.
        - The second statement returns the number of rows whose quantity is malformed. Rows whose quantity was NULL in bronze must not be counted.

        How should you complete the statements? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso charge des lignes de commande avec Auto Loader dans **contoso.bronze.order_lines**, où chaque colonne est un STRING. La colonne **quantity** est NULL quand la quantité n'était pas connue au moment de la commande, et elle contient parfois un texte mal formé comme `N/A` ou `12 pcs`. La colonne **unit_price** a deux décimales et ne dépasse jamais 99 999,99.

        Vous écrivez les deux instructions ci-dessous, qui s'exécutent sur un entrepôt SQL où ANSI_MODE a sa valeur par défaut, TRUE. La solution doit répondre aux exigences suivantes :

        - La première instruction n'échoue jamais à cause d'une valeur mal formée ; une quantité ou un prix mal formé devient NULL.
        - quantity est stocké en INT, et unit_price est stocké avec exactement deux décimales pour que les totaux tombent juste au centime.
        - La deuxième instruction renvoie le nombre de lignes dont la quantité est mal formée. Les lignes dont la quantité était NULL dans bronze ne doivent pas être comptées.

        Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        CREATE OR REPLACE TABLE contoso.silver.order_lines AS
        SELECT order_id,
               quantity    AS raw_quantity,
               [[qty]]     AS quantity,
               [[price]]   AS unit_price
        FROM contoso.bronze.order_lines;

        SELECT [[bad]] AS malformed_quantities
        FROM contoso.silver.order_lines;
      slots:
        - id: qty
          options:
            - { id: cast, text: cast(quantity AS INT) }
            - { id: colon, text: "quantity::INT" }
            - { id: try, text: try_cast(quantity AS INT) }
        - id: price
          options:
            - { id: dec52, text: "try_cast(unit_price AS DECIMAL(5,2))" }
            - { id: dec72, text: "try_cast(unit_price AS DECIMAL(7,2))" }
            - { id: dbl, text: try_cast(unit_price AS DOUBLE) }
        - id: bad
          options:
            - { id: allnull, text: count_if(quantity IS NULL) }
            - { id: nulls, text: count(*) - count(raw_quantity) }
            - { id: failed, text: count_if(quantity IS NULL AND raw_quantity IS NOT NULL) }
    answer:
      values: { qty: try, price: dec72, bad: failed }
    explanation:
      correct:
        en: |
          `try_cast` returns NULL instead of an error when a value is malformed or doesn't fit the target type. `DECIMAL(7,2)` stores exactly two decimals and up to five integer digits, enough for 99,999.99. A failed conversion is a row whose converted quantity is NULL while the raw value isn't, which excludes the quantities that were already NULL in bronze.
        fr: |
          `try_cast` renvoie NULL au lieu d'une erreur quand une valeur est mal formée ou ne tient pas dans le type cible. `DECIMAL(7,2)` stocke exactement deux décimales et jusqu'à cinq chiffres entiers, ce qui suffit pour 99 999,99. Une conversion en échec est une ligne dont la quantité convertie est NULL alors que la valeur brute ne l'est pas, ce qui exclut les quantités déjà NULL dans bronze.
      options:
        cast: { en: "With ANSI mode on, cast raises an error on a malformed value such as N/A, so the statement fails.", fr: "Avec le mode ANSI activé, cast lève une erreur sur une valeur mal formée comme N/A : l'instruction échoue." }
        colon: { en: "The :: operator is the cast syntax, so it fails on malformed values like cast.", fr: "L'opérateur :: est la syntaxe de cast : il échoue donc sur les valeurs mal formées comme cast." }
        dec52: { en: "DECIMAL(5,2) holds at most 999.99; try_cast silently turns every larger price into NULL.", fr: "DECIMAL(5,2) contient au plus 999,99 ; try_cast transforme silencieusement tout prix supérieur en NULL." }
        dbl: { en: "DOUBLE is binary floating point: amounts such as 0.10 aren't represented exactly, so totals drift.", fr: "DOUBLE est une virgule flottante binaire : des montants comme 0,10 ne sont pas représentés exactement, et les totaux dérivent." }
        allnull: { en: "This count includes the rows whose quantity was already NULL in bronze.", fr: "Ce décompte inclut les lignes dont la quantité était déjà NULL dans bronze." }
        nulls: { en: "This expression counts the NULL raw quantities, which are exactly the rows that must not be counted.", fr: "Cette expression compte les quantités brutes NULL, c'est-à-dire exactement les lignes qui ne doivent pas être comptées." }
    references:
      - title: try_cast function - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/functions/try_cast

  # ------------------------------------------------------------------ 8
  - id: dp750-qz-34-08
    objective: "3.3.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware receives a daily extract of ticket scans from its stadium gates. A PySpark notebook loads the extracts of today and yesterday into the DataFrames `today_df` and `yesterday_df`, which have the same columns in the same order, and registers them as the temporary views **today** and **yesterday**. Identical rows are legitimate: a gate can record the same scan several times, and each copy counts.

        You need the rows of today's extract that aren't in yesterday's extract, keeping the copies. For example, a row that appears three times today and once yesterday must appear twice in the result.

        Which two snippets return the required result? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware reçoit chaque jour un extrait des scans de billets de ses portiques de stade. Un notebook PySpark charge les extraits d'aujourd'hui et d'hier dans les DataFrames `today_df` et `yesterday_df`, qui ont les mêmes colonnes dans le même ordre, et les inscrit comme vues temporaires **today** et **yesterday**. Les lignes identiques sont légitimes : un portique peut enregistrer plusieurs fois le même scan, et chaque copie compte.

        Vous avez besoin des lignes de l'extrait d'aujourd'hui qui ne figurent pas dans l'extrait d'hier, en conservant les copies. Par exemple, une ligne présente trois fois aujourd'hui et une fois hier doit apparaître deux fois dans le résultat.

        Quels sont les deux extraits de code qui renvoient le résultat attendu ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "today_df.subtract(yesterday_df)" }
        - { id: b, text: "today_df.exceptAll(yesterday_df)" }
        - { id: c, text: "today_df.join(yesterday_df, on=today_df.columns, how=\"left_anti\")" }
        - { id: d, text: "spark.sql(\"SELECT * FROM today EXCEPT ALL SELECT * FROM yesterday\")" }
        - { id: e, text: "spark.sql(\"SELECT * FROM today EXCEPT SELECT * FROM yesterday\")" }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          `exceptAll` returns the rows of the first DataFrame that aren't in the second while preserving duplicates: each matching row of the second DataFrame cancels only one copy. It is the equivalent of `EXCEPT ALL` in SQL, which gives the same result on the temporary views. Both resolve the columns by position, which works because the columns are in the same order.
        fr: |
          `exceptAll` renvoie les lignes du premier DataFrame absentes du second en conservant les doublons : chaque ligne correspondante du second DataFrame n'annule qu'une seule copie. C'est l'équivalent de `EXCEPT ALL` en SQL, qui donne le même résultat sur les vues temporaires. Les deux résolvent les colonnes par position, ce qui fonctionne car les colonnes sont dans le même ordre.
      options:
        a: { en: "subtract is the equivalent of EXCEPT DISTINCT: the row present three times today and once yesterday disappears completely.", fr: "subtract est l'équivalent d'EXCEPT DISTINCT : la ligne présente trois fois aujourd'hui et une fois hier disparaît complètement." }
        c: { en: "A left anti join removes every left row that has at least one match, so all three copies are removed.", fr: "Une jointure anti gauche retire chaque ligne de gauche qui a au moins une correspondance : les trois copies sont donc retirées." }
        e: { en: "EXCEPT is DISTINCT by default in SQL: it removes the row entirely and returns each remaining row only once.", fr: "EXCEPT est DISTINCT par défaut en SQL : il retire entièrement la ligne et ne renvoie chaque ligne restante qu'une seule fois." }
    references:
      - title: exceptAll - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframe/exceptAll
      - title: subtract - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/pyspark/reference/classes/dataframe/subtract

  # ------------------------------------------------------------------ 9
  - id: dp750-qz-34-09
    objective: "3.3.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Every night, a job at Litware loads the positions of one business day into the Delta table **litware.silver.positions**, which isn't partitioned. The job runs the following statement on a SQL warehouse.

        ```sql
        INSERT INTO litware.silver.positions
        REPLACE WHERE business_day = '2026-11-23'
        SELECT * FROM litware.staging.positions_batch;
        ```

        Tonight, the statement failed and wrote nothing. Because of a late upstream delivery, litware.staging.positions_batch contains all the positions of 2026-11-23 and 40 corrected positions of 2026-11-20. A separate correction job will reload the positions of 2026-11-20 tomorrow.

        Tonight's load must replace the rows of 2026-11-23 with those of the batch, and the rows of every other business day must stay unchanged. What should you do?
      fr: |
        Chaque nuit, un job de Litware charge les positions d'un jour ouvré dans la table Delta **litware.silver.positions**, qui n'est pas partitionnée. Le job exécute l'instruction suivante sur un entrepôt SQL.

        ```sql
        INSERT INTO litware.silver.positions
        REPLACE WHERE business_day = '2026-11-23'
        SELECT * FROM litware.staging.positions_batch;
        ```

        Cette nuit, l'instruction a échoué sans rien écrire. À cause d'une livraison tardive en amont, litware.staging.positions_batch contient toutes les positions du 2026-11-23 et 40 positions corrigées du 2026-11-20. Un job de correction distinct rechargera demain les positions du 2026-11-20.

        Le chargement de cette nuit doit remplacer les lignes du 2026-11-23 par celles du lot, et les lignes de tous les autres jours ouvrés doivent rester inchangées. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace REPLACE WHERE business_day = '2026-11-23' with REPLACE USING (business_day), and run the statement again.", fr: "Remplacer REPLACE WHERE business_day = '2026-11-23' par REPLACE USING (business_day), puis exécuter de nouveau l'instruction." } }
        - { id: b, text: { en: "Add WHERE business_day = '2026-11-23' to the SELECT of the statement, and run the statement again.", fr: "Ajouter WHERE business_day = '2026-11-23' au SELECT de l'instruction, puis exécuter de nouveau l'instruction." } }
        - { id: c, text: { en: "Set spark.databricks.delta.replaceWhere.constraintCheck.enabled to false, and run the statement again.", fr: "Définir spark.databricks.delta.replaceWhere.constraintCheck.enabled sur false, puis exécuter de nouveau l'instruction." } }
        - { id: d, text: { en: "Replace the statement with INSERT OVERWRITE litware.silver.positions SELECT * FROM the batch table.", fr: "Remplacer l'instruction par INSERT OVERWRITE litware.silver.positions SELECT * FROM la table du lot." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `REPLACE WHERE` validates that every written row matches the predicate and fails by default when a value falls outside it, which is why nothing was written. Filtering the query on the same day makes every row match, so the statement atomically replaces the rows of 2026-11-23 and leaves the other days alone.
        fr: |
          `REPLACE WHERE` vérifie que chaque ligne écrite correspond au prédicat et échoue par défaut quand une valeur en sort, ce qui explique que rien n'ait été écrit. Filtrer la requête sur le même jour fait correspondre chaque ligne : l'instruction remplace alors de façon atomique les lignes du 2026-11-23 et ne touche pas aux autres jours.
      options:
        a: { en: "REPLACE USING replaces the rows of every business_day value of the batch: all the positions of 2026-11-20 would be replaced by the 40 corrected ones.", fr: "REPLACE USING remplace les lignes de chaque valeur de business_day du lot : toutes les positions du 2026-11-20 seraient remplacées par les 40 positions corrigées." }
        c: { en: "This setting applies only to classic compute, and it inserts the rows outside the predicate: the 40 rows of 2026-11-20 would be added next to the existing ones.", fr: "Ce paramètre ne s'applique qu'au calcul classique, et il insère les lignes hors du prédicat : les 40 lignes du 2026-11-20 seraient ajoutées à côté des lignes existantes." }
        d: { en: "INSERT OVERWRITE without a predicate replaces the content of the whole table, so every other business day would be lost.", fr: "INSERT OVERWRITE sans prédicat remplace le contenu de toute la table : tous les autres jours ouvrés seraient perdus." }
    references:
      - title: Selectively overwrite data with Delta Lake - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/delta/selective-overwrite

  # ------------------------------------------------------------------ 10
  - id: dp750-qz-34-10
    objective: "3.3.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum keeps the customers of every region in the Delta table **adatum.silver.customers**, with the columns **customer_id**, **name**, **region** and **segment**. Every night, the European CRM sends **adatum.staging.eu_customers**: a full snapshot of the customers whose region is `EU`, one row per customer. Starting tonight, the snapshot has the same columns as the table plus a new column, **loyalty_tier**.

        You are writing the statement that a SQL warehouse runs after the snapshot arrives. The solution must meet the following requirements:

        - EU customers of the snapshot that exist in the table get all their values updated, loyalty_tier included; new customers are inserted.
        - loyalty_tier is added to adatum.silver.customers automatically.
        - EU customers that are missing from the snapshot are deleted from the table.
        - The customers of the other regions stay unchanged.

        How should you complete the statement? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum conserve les clients de toutes les régions dans la table Delta **adatum.silver.customers**, avec les colonnes **customer_id**, **name**, **region** et **segment**. Chaque nuit, le CRM européen envoie **adatum.staging.eu_customers** : un instantané complet des clients dont la région est `EU`, une ligne par client. À partir de cette nuit, l'instantané a les mêmes colonnes que la table plus une nouvelle colonne, **loyalty_tier**.

        Vous écrivez l'instruction qu'un entrepôt SQL exécute après l'arrivée de l'instantané. La solution doit répondre aux exigences suivantes :

        - Les clients EU de l'instantané qui existent dans la table voient toutes leurs valeurs mises à jour, loyalty_tier compris ; les nouveaux clients sont insérés.
        - loyalty_tier est ajoutée automatiquement à adatum.silver.customers.
        - Les clients EU absents de l'instantané sont supprimés de la table.
        - Les clients des autres régions restent inchangés.

        Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        [[head]] adatum.silver.customers AS t
        USING adatum.staging.eu_customers AS s
        ON t.customer_id = s.customer_id
        WHEN MATCHED THEN [[upd]]
        WHEN NOT MATCHED THEN INSERT *
        [[bysrc]];
      slots:
        - id: head
          options:
            - { id: plain, text: MERGE INTO }
            - { id: evo, text: MERGE WITH SCHEMA EVOLUTION INTO }
        - id: upd
          options:
            - { id: star, text: UPDATE SET * }
            - { id: explicit, text: "UPDATE SET t.name = s.name, t.region = s.region, t.segment = s.segment" }
            - { id: delete, text: DELETE }
        - id: bysrc
          options:
            - { id: all, text: WHEN NOT MATCHED BY SOURCE THEN DELETE }
            - { id: target, text: "WHEN NOT MATCHED BY SOURCE AND t.region = 'EU' THEN DELETE" }
            - { id: source, text: "WHEN NOT MATCHED BY SOURCE AND s.region = 'EU' THEN DELETE" }
    answer:
      values: { head: evo, upd: star, bysrc: target }
    explanation:
      correct:
        en: |
          `WITH SCHEMA EVOLUTION` updates the schema of the target to match the source, so loyalty_tier is added, and `UPDATE SET *` then writes every source column, the new one included, to the matched rows. `WHEN NOT MATCHED BY SOURCE` acts on target rows that have no source row; its condition may reference only target columns, and `t.region = 'EU'` limits the deletion to the European customers.
        fr: |
          `WITH SCHEMA EVOLUTION` met à jour le schéma de la cible pour qu'il corresponde à la source : loyalty_tier est donc ajoutée, et `UPDATE SET *` écrit ensuite chaque colonne de la source, la nouvelle comprise, dans les lignes correspondantes. `WHEN NOT MATCHED BY SOURCE` agit sur les lignes de la cible qui n'ont pas de ligne source ; sa condition ne peut référencer que des colonnes de la cible, et `t.region = 'EU'` limite la suppression aux clients européens.
      options:
        plain: { en: "Without schema evolution, UPDATE SET * and INSERT * set only the columns of the target, so loyalty_tier is never added.", fr: "Sans évolution de schéma, UPDATE SET * et INSERT * ne définissent que les colonnes de la cible : loyalty_tier n'est jamais ajoutée." }
        explicit: { en: "This update doesn't assign loyalty_tier, so existing customers would keep a NULL loyalty tier.", fr: "Cette mise à jour n'affecte pas loyalty_tier : les clients existants garderaient un niveau de fidélité NULL." }
        delete: { en: "DELETE would remove every EU customer present in the snapshot instead of updating it.", fr: "DELETE supprimerait chaque client EU présent dans l'instantané au lieu de le mettre à jour." }
        all: { en: "Without a condition, the clause deletes every target row absent from the snapshot, which includes all the customers of the other regions.", fr: "Sans condition, la clause supprime chaque ligne de la cible absente de l'instantané, ce qui inclut tous les clients des autres régions." }
        source: { en: "The condition of WHEN NOT MATCHED BY SOURCE can reference only target columns: there is no source row to read.", fr: "La condition de WHEN NOT MATCHED BY SOURCE ne peut référencer que des colonnes de la cible : il n'y a aucune ligne source à lire." }
    references:
      - title: MERGE INTO - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/delta-merge-into
