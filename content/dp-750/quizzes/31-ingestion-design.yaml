chapter: 31-ingestion-design
questions:
  # ------------------------------------------------------------------ 1
  - id: dp750-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware ingests a PostgreSQL database that has no managed connector in its environment. A notebook reads the **orders** table over JDBC and writes to **litware.erp.bronze_orders**. The database account requires a password.

        Where should the notebook get the password from?
      fr: |
        Litware ingère une base de données PostgreSQL qui n'a pas de connecteur managé dans son environnement. Un notebook lit la table **orders** via JDBC et écrit dans **litware.erp.bronze_orders**. Le compte de la base de données exige un mot de passe.

        Où le notebook doit-il obtenir le mot de passe ?
    body:
      options:
        - { id: a, text: { en: "From the default value of a notebook widget", fr: "De la valeur par défaut d'un widget du notebook" } }
        - { id: b, text: { en: "From a variable defined in a shared notebook run with %run", fr: "D'une variable définie dans un notebook partagé exécuté avec %run" } }
        - { id: c, text: { en: "From a secret scope, read with dbutils.secrets.get", fr: "D'une étendue de secrets, lue avec dbutils.secrets.get" } }
        - { id: d, text: { en: "From a table property of litware.erp.bronze_orders", fr: "D'une propriété de la table litware.erp.bronze_orders" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Database credentials belong in Databricks secrets, never in code or in clear-text configuration. The notebook reads the value at run time with `dbutils.secrets.get`, so the password never appears in the code.
        fr: |
          Les informations d'identification d'une base de données doivent être stockées dans des secrets Databricks, jamais dans le code ni dans une configuration en clair. Le notebook lit la valeur à l'exécution avec `dbutils.secrets.get` : le mot de passe n'apparaît jamais dans le code.
      options:
        a: { en: "A widget default value is stored in clear text with the notebook and visible to anyone who can open it.", fr: "La valeur par défaut d'un widget est stockée en clair avec le notebook et visible par toute personne qui peut l'ouvrir." }
        b: { en: "A shared notebook is still code: the password would be hard-coded and readable by every user of that notebook.", fr: "Un notebook partagé reste du code : le mot de passe y serait codé en dur et lisible par chaque utilisateur de ce notebook." }
        d: { en: "Table properties are metadata readable by anyone who can describe the table; they aren't a secret store.", fr: "Les propriétés de table sont des métadonnées lisibles par toute personne qui peut décrire la table ; ce n'est pas un magasin de secrets." }
    references:
      - title: Design ingestion logic and data source configuration
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/2-design-data-ingestion-logic
      - title: Choose a data ingestion tool
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/3-choose-data-ingestion-tool

  # ------------------------------------------------------------------ 2
  - id: dp750-qz-31-02
    objective: "3.1.4"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        Contoso creates the new tables of the catalog **contoso_prod** as Unity Catalog managed tables, so that predictive optimization maintains them and the data files are deleted automatically after a `DROP TABLE`.

        Which two table formats can these managed tables use?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso crée les nouvelles tables du catalogue **contoso_prod** sous forme de tables managées Unity Catalog, afin que l'optimisation prédictive les entretienne et que les fichiers de données soient supprimés automatiquement après un `DROP TABLE`.

        Quels sont les deux formats de table que ces tables managées peuvent utiliser ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "Parquet" }
        - { id: b, text: "Delta Lake" }
        - { id: c, text: "CSV" }
        - { id: d, text: "Apache Iceberg" }
        - { id: e, text: "Avro" }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Unity Catalog managed tables exist for Delta Lake and Apache Iceberg only. Delta is the default when `CREATE TABLE` has no `USING` clause; an Iceberg table needs `USING iceberg`.
        fr: |
          Les tables managées Unity Catalog n'existent que pour Delta Lake et Apache Iceberg. Delta est la valeur par défaut quand `CREATE TABLE` n'a pas de clause `USING` ; une table Iceberg exige `USING iceberg`.
      options:
        a: { en: "Plain Parquet is a file format; Parquet tables are supported only as external tables.", fr: "Le Parquet brut est un format de fichier ; les tables Parquet ne sont prises en charge que comme tables externes." }
        c: { en: "CSV is supported only for external tables; convert landed CSV files to Delta for persistent analytics.", fr: "Le CSV n'est pris en charge que pour les tables externes ; convertissez les fichiers CSV déposés en Delta pour l'analytique persistante." }
        e: { en: "Avro is supported only for external tables.", fr: "L'Avro n'est pris en charge que pour les tables externes." }
    references:
      - title: Unity Catalog managed tables for Delta Lake and Apache Iceberg
        url: https://learn.microsoft.com/en-us/azure/databricks/tables/managed

  # ------------------------------------------------------------------ 3
  - id: dp750-qz-31-03
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam ingests its SQL Server sales database into **fabrikam.sales** with the Lakeflow Connect SQL Server connector, in the standard architecture with an ingestion gateway. The ingestion pipeline has two schedules: one every hour on weekdays and one every six hours on weekends.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam ingère sa base de données de ventes SQL Server dans **fabrikam.sales** avec le connecteur SQL Server de Lakeflow Connect, dans l'architecture standard avec une passerelle d'ingestion. Le pipeline d'ingestion a deux planifications : une toutes les heures en semaine et une toutes les six heures le week-end.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Lakeflow Connect created one job for each of the two schedules, and the ingestion pipeline is a task of each job.", fr: "Lakeflow Connect a créé un job pour chacune des deux planifications, et le pipeline d'ingestion est une tâche de chaque job." } }
        - { id: s2, text: { en: "The ingestion gateway starts with each scheduled run of the ingestion pipeline and stops when the run ends.", fr: "La passerelle d'ingestion démarre à chaque exécution planifiée du pipeline d'ingestion et s'arrête à la fin de l'exécution." } }
        - { id: s3, text: { en: "After the first run has loaded the selected tables, later runs ingest only the data that changed since the previous run.", fr: "Une fois que la première exécution a chargé les tables sélectionnées, les exécutions suivantes n'ingèrent que les données modifiées depuis l'exécution précédente." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          For each schedule added to an ingestion pipeline, Lakeflow Connect creates a job whose task is the pipeline. For database connectors, the ingestion gateway runs in its own job as a continuous task, extracting changes into staging storage. The first run ingests all the selected data while change tracking starts; later runs use it to ingest only what changed.
        fr: |
          Pour chaque planification ajoutée à un pipeline d'ingestion, Lakeflow Connect crée un job dont la tâche est le pipeline. Pour les connecteurs de base de données, la passerelle d'ingestion s'exécute dans son propre job comme tâche continue et extrait les modifications vers le stockage intermédiaire. La première exécution ingère toutes les données sélectionnées pendant que le suivi des modifications démarre ; les exécutions suivantes s'en servent pour n'ingérer que ce qui a changé.
      options:
        s2: { en: "The gateway doesn't follow the pipeline schedules: it runs continuously so that no change is missed between runs.", fr: "La passerelle ne suit pas les planifications du pipeline : elle s'exécute en continu pour qu'aucune modification ne soit manquée entre deux exécutions." }
    references:
      - title: Lakeflow Connect connector concepts
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/
      - title: Microsoft SQL Server ingestion connector
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/sql-server-overview

  # ------------------------------------------------------------------ 4
  - id: dp750-qz-31-04
    objective: "3.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind is creating the Delta table **northwind.retail.sales_history**. It will hold 15 years of sales, about 1.8 TB in total, growing by about 120 GB per year. Most queries filter on `sale_ts` ranges that cover one or more quarters. The table has a `sale_ts` timestamp column and a `store_id` column with 4,000 distinct values.

        The team decided to partition the table and must follow the Databricks partitioning guidance.

        Which partitioning scheme should you use?
      fr: |
        Northwind crée la table Delta **northwind.retail.sales_history**. Elle contiendra 15 ans de ventes, environ 1,8 To au total, avec une croissance d'environ 120 Go par an. La plupart des requêtes filtrent sur des plages de `sale_ts` qui couvrent un ou plusieurs trimestres. La table a une colonne d'horodatage `sale_ts` et une colonne `store_id` qui compte 4 000 valeurs distinctes.

        L'équipe a décidé de partitionner la table et doit suivre les recommandations de Databricks en matière de partitionnement.

        Quel schéma de partitionnement devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Partition by a `sale_date` column, one partition per day", fr: "Partitionner par une colonne `sale_date`, une partition par jour" } }
        - { id: b, text: { en: "Partition by a `sale_month` column, one partition per month", fr: "Partitionner par une colonne `sale_month`, une partition par mois" } }
        - { id: c, text: { en: "Partition by the `sale_ts` column, one partition per timestamp value", fr: "Partitionner par la colonne `sale_ts`, une partition par valeur d'horodatage" } }
        - { id: d, text: { en: "Partition by the `store_id` column, one partition per store", fr: "Partitionner par la colonne `store_id`, une partition par magasin" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Each partition should hold at least 1 GB. About 120 GB per year gives roughly 10 GB per month, but only about 0.33 GB per day. Monthly partitions meet the size rule, and quarter ranges still prune all the months outside the range.
        fr: |
          Chaque partition devrait contenir au moins 1 Go. Environ 120 Go par an donnent à peu près 10 Go par mois, mais seulement 0,33 Go environ par jour. Des partitions mensuelles respectent la règle de taille, et les plages trimestrielles élaguent toujours tous les mois situés hors de la plage.
      options:
        a: { en: "Daily partitions would hold about 0.33 GB each, below the 1 GB minimum: the table would be over-partitioned.", fr: "Des partitions quotidiennes contiendraient environ 0,33 Go chacune, sous le minimum de 1 Go : la table serait surpartitionnée." }
        c: { en: "A timestamp has a very high cardinality and would create millions of tiny partitions.", fr: "Un horodatage a une cardinalité très élevée et créerait des millions de partitions minuscules." }
        d: { en: "4,000 stores give about 0.45 GB per partition, and most queries don't filter on the store.", fr: "4 000 magasins donnent environ 0,45 Go par partition, et la plupart des requêtes ne filtrent pas sur le magasin." }
    references:
      - title: Design and implement a data partitioning scheme
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/5-design-data-partitioning-scheme

  # ------------------------------------------------------------------ 5
  - id: dp750-qz-31-05
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys loads JSON files from **/Volumes/tailspin/raw/landing/bookings/** into **tailspin.ops.bronze_bookings**. Two loading designs are under review:

        - Design A: a notebook that runs `spark.read.json()` on the landing folder and appends the result to the table.
        - Design B: an Auto Loader query with a checkpoint location and `trigger(availableNow=True)`.

        A Lakeflow job runs the chosen design every hour.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys charge des fichiers JSON depuis **/Volumes/tailspin/raw/landing/bookings/** dans **tailspin.ops.bronze_bookings**. Deux conceptions de chargement sont à l'étude :

        - Conception A : un notebook qui exécute `spark.read.json()` sur le dossier d'atterrissage et ajoute le résultat à la table.
        - Conception B : une requête Auto Loader avec un emplacement de point de contrôle et `trigger(availableNow=True)`.

        Un job Lakeflow exécute la conception retenue toutes les heures.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "With design A, each run loads again the files that previous runs already loaded, unless the code tracks them itself.", fr: "Avec la conception A, chaque exécution recharge les fichiers déjà chargés par les exécutions précédentes, sauf si le code en assure lui-même le suivi." } }
        - { id: s2, text: { en: "With design B, the query keeps running and waits for new files after it has processed the available ones.", fr: "Avec la conception B, la requête reste active et attend de nouveaux fichiers après avoir traité les fichiers disponibles." } }
        - { id: s3, text: { en: "With design B, a run that restarts after a failure skips the files that the checkpoint records as processed.", fr: "Avec la conception B, une exécution qui redémarre après un échec ignore les fichiers que le point de contrôle enregistre comme traités." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A batch read processes the bounded dataset it is given: rerunning it on the same folder reads the old files again. A streaming source such as Auto Loader records its progress in the checkpoint, so a restart resumes after the last processed files. `availableNow` processes all the available data, possibly in several batches, and then stops the query.
        fr: |
          Une lecture par lots traite le jeu de données borné qu'on lui donne : la relancer sur le même dossier relit les anciens fichiers. Une source de streaming comme Auto Loader enregistre sa progression dans le point de contrôle, si bien qu'un redémarrage reprend après les derniers fichiers traités. `availableNow` traite toutes les données disponibles, éventuellement en plusieurs lots, puis arrête la requête.
      options:
        s2: { en: "availableNow is an incremental batch trigger: the query stops once the available files are processed, so no compute runs between job runs.", fr: "availableNow est un déclencheur de lots incrémentiels : la requête s'arrête une fois les fichiers disponibles traités, donc aucun calcul ne tourne entre les exécutions du job." }
    references:
      - title: Configure Structured Streaming trigger intervals
        url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/triggers
      - title: What is Auto Loader?
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/

  # ------------------------------------------------------------------ 6
  - id: dp750-qz-31-06
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum is designing the extraction of four operational tables into the **adatum.erp** schema. For each table, the requirements and the capabilities of the source are shown in the answer area. Each table must use the simplest extraction type that meets all its requirements.

        Which extraction type should you use for each table? To answer, drag the appropriate extraction types to the correct tables. Each extraction type may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum conçoit l'extraction de quatre tables opérationnelles vers le schéma **adatum.erp**. Pour chaque table, les exigences et les capacités de la source figurent dans la zone de réponse. Chaque table doit utiliser le type d'extraction le plus simple qui répond à toutes ses exigences.

        Quel type d'extraction devez-vous utiliser pour chaque table ? Pour répondre, faites glisser les types d'extraction appropriés vers les tables correspondantes. Chaque type d'extraction peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: full, text: { en: "Full extraction", fr: "Extraction complète" } }
        - { id: incr, text: { en: "Incremental extraction", fr: "Extraction incrémentielle" } }
        - { id: stream, text: { en: "Streaming extraction", fr: "Extraction en streaming" } }
        - { id: cdc, text: { en: "Change data capture (CDC)", fr: "Capture des changements de données (CDC)" } }
      targets:
        - { id: orders, text: { en: "orders: 90 million rows; an updated_at column is set on every insert and update; rows are never deleted; hourly freshness", fr: "orders : 90 millions de lignes ; une colonne updated_at est renseignée à chaque insertion et mise à jour ; les lignes ne sont jamais supprimées ; fraîcheur horaire" } }
        - { id: contracts, text: { en: "contracts: 20,000 rows; auditors need the operation type of every insert, update and delete; SQL Server change data capture is enabled on the table", fr: "contracts : 20 000 lignes ; les auditeurs ont besoin du type d'opération de chaque insertion, mise à jour et suppression ; la capture des changements de données SQL Server est activée sur la table" } }
        - { id: suppliers, text: { en: "suppliers: 15,000 rows; no timestamp, sequence or version column and no change tracking at the source; deleted suppliers must disappear; a nightly rebuild is acceptable", fr: "suppliers : 15 000 lignes ; aucune colonne d'horodatage, de séquence ni de version et aucun suivi des modifications à la source ; les fournisseurs supprimés doivent disparaître ; une reconstruction chaque nuit est acceptable" } }
        - { id: sessions, text: { en: "web_sessions: 2 billion rows; append-only; each new row gets a higher session_seq number; daily freshness", fr: "web_sessions : 2 milliards de lignes ; ajout uniquement ; chaque nouvelle ligne reçoit un numéro session_seq plus élevé ; fraîcheur quotidienne" } }
    answer:
      mapping: { orders: incr, contracts: cdc, suppliers: full, sessions: incr }
    explanation:
      correct:
        en: |
          orders and web_sessions are large and have a reliable change indicator (a timestamp, or an increasing sequence number) with no deletes to track: incremental extraction with a stored high-water mark fits. contracts is small, but only CDC preserves the operation type that the audit requires. suppliers has no change indicator and is small enough to rebuild: a full extraction also removes deleted rows at each rebuild.
        fr: |
          orders et web_sessions sont volumineuses et disposent d'un indicateur de modification fiable (un horodatage, ou un numéro de séquence croissant) sans suppressions à suivre : l'extraction incrémentielle avec une limite haute mémorisée convient. contracts est petite, mais seule la CDC conserve le type d'opération qu'exige l'audit. suppliers n'a aucun indicateur de modification et reste assez petite pour être reconstruite : une extraction complète élimine aussi les lignes supprimées à chaque reconstruction.
      options:
        stream: { en: "Streaming extraction needs a source that publishes events and always-on compute; no table here needs freshness in seconds.", fr: "L'extraction en streaming exige une source qui publie des événements et un calcul toujours actif ; aucune table ici n'exige une fraîcheur de quelques secondes." }
        full: { en: "A full extraction of contracts would rebuild the table but lose the operation type of each change.", fr: "Une extraction complète de contracts reconstruirait la table mais perdrait le type d'opération de chaque modification." }
    references:
      - title: Design ingestion logic and data source configuration
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/2-design-data-ingestion-logic

  # ------------------------------------------------------------------ 7
  - id: dp750-qz-31-07
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Woodgrove Bank runs an Azure SQL database named **sqldb-cards**. Rows deleted in the source must also be removed from **woodgrove.cards** in Unity Catalog, and the ingestion must read the transaction log rather than query the tables. You will use the Lakeflow Connect SQL Server connector in the standard architecture with an ingestion gateway. The solution must minimize development effort.

        No ingestion component exists yet.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Woodgrove Bank exploite une base de données Azure SQL nommée **sqldb-cards**. Les lignes supprimées dans la source doivent aussi être retirées de **woodgrove.cards** dans Unity Catalog, et l'ingestion doit lire le journal des transactions plutôt qu'interroger les tables. Vous utiliserez le connecteur SQL Server de Lakeflow Connect dans l'architecture standard avec une passerelle d'ingestion. La solution doit réduire au minimum l'effort de développement.

        Aucun composant d'ingestion n'existe encore.

        Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 4
      actions:
        - { id: pipeline, text: { en: "Create the ingestion pipeline that references the gateway and writes to woodgrove.cards.", fr: "Créer le pipeline d'ingestion qui référence la passerelle et écrit dans woodgrove.cards." } }
        - { id: source, text: { en: "Enable change tracking or change data capture on the source tables in sqldb-cards.", fr: "Activer le suivi des modifications ou la capture des changements de données sur les tables sources de sqldb-cards." } }
        - { id: gateway, text: { en: "Create the ingestion gateway, which extracts the changes into staging storage.", fr: "Créer la passerelle d'ingestion, qui extrait les modifications vers le stockage intermédiaire." } }
        - { id: secret, text: { en: "Store the SQL password in a secret scope and pass it to the pipeline with dbutils.secrets.get.", fr: "Stocker le mot de passe SQL dans une étendue de secrets et le transmettre au pipeline avec dbutils.secrets.get." } }
        - { id: connection, text: { en: "Create a Unity Catalog connection to the SQL server in Catalog Explorer.", fr: "Créer une connexion Unity Catalog vers le serveur SQL dans Catalog Explorer." } }
        - { id: foreign, text: { en: "Create a foreign catalog from the connection to read the source tables.", fr: "Créer un catalogue étranger à partir de la connexion pour lire les tables sources." } }
    answer:
      sequence: [source, connection, gateway, pipeline]
    explanation:
      correct:
        en: |
          The source must expose its changes first, through SQL Server change tracking or CDC. The Unity Catalog connection then stores the server endpoint and credentials. The gateway uses the connection to extract changes continuously into staging storage, and the ingestion pipeline references the gateway to apply them to streaming tables.
        fr: |
          La source doit d'abord exposer ses modifications, via le suivi des modifications ou la CDC de SQL Server. La connexion Unity Catalog stocke ensuite le point de terminaison du serveur et les informations d'identification. La passerelle utilise la connexion pour extraire les modifications en continu vers le stockage intermédiaire, et le pipeline d'ingestion référence la passerelle pour les appliquer à des tables de streaming.
      options:
        secret: { en: "Managed connectors authenticate through the Unity Catalog connection: no credential is needed in the pipeline configuration.", fr: "Les connecteurs managés s'authentifient via la connexion Unity Catalog : aucune information d'identification n'est nécessaire dans la configuration du pipeline." }
        foreign: { en: "A foreign catalog is for Lakehouse Federation queries against the live source; it doesn't ingest changes.", fr: "Un catalogue étranger sert aux requêtes Lakehouse Federation sur la source en direct ; il n'ingère pas les modifications." }
    references:
      - title: Microsoft SQL Server ingestion connector
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/sql-server-overview
      - title: Lakeflow Connect connector concepts
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/lakeflow-connect/

  # ------------------------------------------------------------------ 8
  - id: dp750-qz-31-08
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware's supply-chain team stores its shipment data as Apache Iceberg tables in Snowflake, registered in Snowflake Horizon Catalog. Snowflake must remain the only writer and the owner of the table metadata.

        Analysts must query the tables from Azure Databricks with Unity Catalog governance. Queries must always return the latest committed snapshot, and the data must not be copied into Azure Databricks storage.

        What should you use?
      fr: |
        L'équipe logistique de Proseware stocke ses données d'expédition sous forme de tables Apache Iceberg dans Snowflake, inscrites dans Snowflake Horizon Catalog. Snowflake doit rester le seul rédacteur et le propriétaire des métadonnées des tables.

        Les analystes doivent interroger les tables depuis Azure Databricks avec la gouvernance d'Unity Catalog. Les requêtes doivent toujours retourner le dernier instantané validé, et les données ne doivent pas être copiées dans le stockage Azure Databricks.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Managed Iceberg tables loaded from the Snowflake tables", fr: "Des tables Iceberg managées chargées depuis les tables Snowflake" } }
        - { id: b, text: { en: "Managed Delta tables with Iceberg reads (UniForm) enabled", fr: "Des tables Delta managées avec les lectures Iceberg (UniForm) activées" } }
        - { id: c, text: { en: "Foreign Iceberg tables accessed through a catalog connection", fr: "Des tables Iceberg étrangères accessibles via une connexion de catalogue" } }
        - { id: d, text: { en: "External Parquet tables on the folders of the Iceberg data files", fr: "Des tables Parquet externes sur les dossiers des fichiers de données Iceberg" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Iceberg tables owned by another catalog, such as Snowflake Horizon Catalog or AWS Glue, are read in Azure Databricks as foreign tables through a connection to that catalog. Unity Catalog governs the access, the other catalog keeps the metadata and the writes, and each query reads the current snapshot without copying the data.
        fr: |
          Les tables Iceberg détenues par un autre catalogue, comme Snowflake Horizon Catalog ou AWS Glue, sont lues dans Azure Databricks comme tables étrangères via une connexion à ce catalogue. Unity Catalog gouverne l'accès, l'autre catalogue conserve les métadonnées et les écritures, et chaque requête lit l'instantané actuel sans copier les données.
      options:
        a: { en: "Loading managed Iceberg tables copies the data into Unity Catalog storage and makes Unity Catalog the owner of the copy, which then goes stale.", fr: "Charger des tables Iceberg managées copie les données dans le stockage Unity Catalog et fait d'Unity Catalog le propriétaire de la copie, qui devient ensuite obsolète." }
        b: { en: "UniForm works in the other direction: it lets Iceberg clients read Delta tables that Azure Databricks owns.", fr: "UniForm fonctionne dans l'autre sens : il permet aux clients Iceberg de lire des tables Delta détenues par Azure Databricks." }
        d: { en: "Reading the data files as plain Parquet ignores the Iceberg metadata, so queries can include files that are no longer part of the current snapshot.", fr: "Lire les fichiers de données comme du Parquet brut ignore les métadonnées Iceberg : les requêtes peuvent inclure des fichiers qui ne font plus partie de l'instantané actuel." }
    references:
      - title: Choose a data table format
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/4-choose-data-table-format

  # ------------------------------------------------------------------ 9
  - id: dp750-qz-31-09
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank is choosing the loading method of three tables. Each table must meet its freshness requirement at the lowest compute cost, and every source record must be loaded exactly once.

        - **card_alerts**: card authorizations arrive in Azure Event Hubs. Suspicious authorizations must be flagged within 10 seconds.
        - **branch_kpis**: files arrive in a volume all day. The dashboard is refreshed once an hour, and no compute may run between two refreshes.
        - **fx_rates**: every night, the source system drops one file that contains the complete current list of 300 exchange rates. The table must contain exactly the rows of the latest file.

        Which loading method should you use for each table? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank choisit la méthode de chargement de trois tables. Chaque table doit respecter son exigence de fraîcheur au coût de calcul le plus bas, et chaque enregistrement source doit être chargé exactement une fois.

        - **card_alerts** : les autorisations de carte arrivent dans Azure Event Hubs. Les autorisations suspectes doivent être signalées dans les 10 secondes.
        - **branch_kpis** : des fichiers arrivent dans un volume toute la journée. Le tableau de bord est actualisé une fois par heure, et aucun calcul ne doit tourner entre deux actualisations.
        - **fx_rates** : chaque nuit, le système source dépose un fichier qui contient la liste actuelle complète de 300 taux de change. La table doit contenir exactement les lignes du dernier fichier.

        Quelle méthode de chargement devez-vous utiliser pour chaque table ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          card_alerts: [[alerts]]

          branch_kpis: [[kpis]]

          fx_rates: [[rates]]
        fr: |
          card_alerts : [[alerts]]

          branch_kpis : [[kpis]]

          fx_rates : [[rates]]
      slots:
        - id: alerts
          options:
            - { id: always, text: { en: "Always-on stream with the default trigger", fr: "Flux toujours actif avec le déclencheur par défaut" } }
            - { id: hourly, text: { en: "Always-on stream with processingTime='1 hour'", fr: "Flux toujours actif avec processingTime='1 hour'" } }
            - { id: avail, text: { en: "availableNow stream started by a scheduled job", fr: "Flux availableNow démarré par un job planifié" } }
            - { id: batch, text: { en: "Batch read that overwrites the table, started by a scheduled job", fr: "Lecture par lots qui remplace la table, démarrée par un job planifié" } }
        - id: kpis
          options:
            - { id: always, text: { en: "Always-on stream with the default trigger", fr: "Flux toujours actif avec le déclencheur par défaut" } }
            - { id: hourly, text: { en: "Always-on stream with processingTime='1 hour'", fr: "Flux toujours actif avec processingTime='1 hour'" } }
            - { id: avail, text: { en: "availableNow stream started by a scheduled job", fr: "Flux availableNow démarré par un job planifié" } }
            - { id: batch, text: { en: "Batch read that overwrites the table, started by a scheduled job", fr: "Lecture par lots qui remplace la table, démarrée par un job planifié" } }
        - id: rates
          options:
            - { id: always, text: { en: "Always-on stream with the default trigger", fr: "Flux toujours actif avec le déclencheur par défaut" } }
            - { id: hourly, text: { en: "Always-on stream with processingTime='1 hour'", fr: "Flux toujours actif avec processingTime='1 hour'" } }
            - { id: avail, text: { en: "availableNow stream started by a scheduled job", fr: "Flux availableNow démarré par un job planifié" } }
            - { id: batch, text: { en: "Batch read that overwrites the table, started by a scheduled job", fr: "Lecture par lots qui remplace la table, démarrée par un job planifié" } }
    answer:
      values: { alerts: always, kpis: avail, rates: batch }
    explanation:
      correct:
        en: |
          A latency of a few seconds needs an always-on stream; the default trigger, a 0 ms processing-time interval, typically gives 3 to 5 seconds of latency. For an hourly refresh with no compute in between, an availableNow stream processes every new file exactly once thanks to its checkpoint, then stops until the next scheduled run. The rates file is a complete snapshot: a nightly batch read that overwrites the table leaves exactly the latest rows.
        fr: |
          Une latence de quelques secondes exige un flux toujours actif ; le déclencheur par défaut, un intervalle processingTime de 0 ms, donne généralement une latence de 3 à 5 secondes. Pour une actualisation horaire sans calcul entre-temps, un flux availableNow traite chaque nouveau fichier exactement une fois grâce à son point de contrôle, puis s'arrête jusqu'à la prochaine exécution planifiée. Le fichier de taux est un instantané complet : une lecture par lots nocturne qui remplace la table ne laisse que les lignes du dernier fichier.
      options:
        hourly: { en: "processingTime='1 hour' gives hourly batches, but the query and its compute keep running between them, which branch_kpis forbids.", fr: "processingTime='1 hour' donne des lots horaires, mais la requête et son calcul restent actifs entre deux lots, ce que branch_kpis interdit." }
        avail: { en: "For fx_rates, a stream would append each night's file to the previous rows instead of replacing them; for card_alerts, scheduled runs can't reach 10 seconds.", fr: "Pour fx_rates, un flux ajouterait le fichier de chaque nuit aux lignes précédentes au lieu de les remplacer ; pour card_alerts, des exécutions planifiées ne peuvent pas atteindre 10 secondes." }
        batch: { en: "For branch_kpis, an overwrite from a batch read would reprocess every file at each run instead of only the new ones.", fr: "Pour branch_kpis, un remplacement par une lecture par lots retraiterait tous les fichiers à chaque exécution au lieu des seuls nouveaux fichiers." }
    references:
      - title: Configure Structured Streaming trigger intervals
        url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/triggers

  # ------------------------------------------------------------------ 10
  - id: dp750-qz-31-10
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso's architecture team reviews five Delta tables. For each table, the following table shows its size, the period of data it holds and the column that most queries filter on.

        | Table | Size | Data period | Most filtered column |
        | --- | --- | --- | --- |
        | events | 240 TB | 3 years | `event_date` |
        | invoices | 700 GB | 5 years | `invoice_date` |
        | clicks | 90 TB | 2 years | `session_id` (billions of distinct values) |
        | telemetry | 5 TB | 1 year | `device_type` (6 values) |
        | app_logs | 2 TB | 10 years | `log_date` |

        The team will partition a table on its most filtered column only where the Databricks partitioning guidance allows it.

        Which two tables should the team partition?

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe d'architecture de Contoso examine cinq tables Delta. Pour chaque table, le tableau suivant indique sa taille, la période de données qu'elle contient et la colonne sur laquelle filtrent la plupart des requêtes.

        | Table | Taille | Période de données | Colonne la plus filtrée |
        | --- | --- | --- | --- |
        | events | 240 To | 3 ans | `event_date` |
        | invoices | 700 Go | 5 ans | `invoice_date` |
        | clicks | 90 To | 2 ans | `session_id` (des milliards de valeurs distinctes) |
        | telemetry | 5 To | 1 an | `device_type` (6 valeurs) |
        | app_logs | 2 To | 10 ans | `log_date` |

        L'équipe partitionnera une table sur sa colonne la plus filtrée uniquement là où les recommandations de Databricks en matière de partitionnement le permettent.

        Quelles sont les deux tables que l'équipe doit partitionner ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "events" }
        - { id: b, text: "invoices" }
        - { id: c, text: "clicks" }
        - { id: d, text: "telemetry" }
        - { id: e, text: "app_logs" }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Partitioning is recommended only above 1 TB, with at least 1 GB per partition, on a low-cardinality column that most queries filter on. events gives about 220 GB per day over some 1,100 daily partitions. telemetry gives six partitions of several hundred gigabytes each on a column with six values.
        fr: |
          Le partitionnement n'est recommandé qu'au-delà de 1 To, avec au moins 1 Go par partition, sur une colonne à faible cardinalité sur laquelle filtrent la plupart des requêtes. events donne environ 220 Go par jour sur quelque 1 100 partitions quotidiennes. telemetry donne six partitions de plusieurs centaines de gigaoctets chacune sur une colonne à six valeurs.
      options:
        b: { en: "invoices holds less than 1 TB: Databricks recommends not partitioning it.", fr: "invoices contient moins de 1 To : Databricks recommande de ne pas la partitionner." }
        c: { en: "session_id has billions of distinct values, which would create billions of tiny partitions.", fr: "session_id a des milliards de valeurs distinctes, ce qui créerait des milliards de partitions minuscules." }
        e: { en: "2 TB over 10 years is about 0.55 GB per day: daily partitions on log_date stay below the 1 GB minimum.", fr: "2 To sur 10 ans représentent environ 0,55 Go par jour : des partitions quotidiennes sur log_date restent sous le minimum de 1 Go." }
    references:
      - title: Design and implement a data partitioning scheme
        url: https://learn.microsoft.com/en-us/training/modules/design-implement-data-modeling-unity-catalog/5-design-data-partitioning-scheme
