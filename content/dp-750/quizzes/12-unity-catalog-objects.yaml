chapter: 12-unity-catalog-objects
questions:
  # ------------------------------------------------------------------ 1
  - id: dp750-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has one Unity Catalog metastore in the North Europe region. The finance unit needs development, test and production environments. Jobs are promoted from one environment to the next, and they must keep the same schema and table names in every environment.

        Which organization should you use?
      fr: |
        Fabrikam dispose d'un seul metastore Unity Catalog dans la région Europe Nord. L'unité finance a besoin d'environnements de développement, de test et de production. Les jobs sont promus d'un environnement au suivant et doivent conserver les mêmes noms de schémas et de tables dans chaque environnement.

        Quelle organisation devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "One catalog named finance, with schemas such as dev_silver, test_silver and prod_silver", fr: "Un catalogue nommé finance, avec des schémas tels que dev_silver, test_silver et prod_silver" } }
        - { id: b, text: { en: "Catalogs named dev_finance, test_finance and prod_finance, each with the same schemas", fr: "Des catalogues nommés dev_finance, test_finance et prod_finance, chacun avec les mêmes schémas" } }
        - { id: c, text: { en: "One catalog named finance, with each table name suffixed by _dev, _test or _prod", fr: "Un catalogue nommé finance, avec chaque nom de table suffixé par _dev, _test ou _prod" } }
        - { id: d, text: { en: "Three metastores named dev, test and prod, each with a catalog named finance", fr: "Trois metastores nommés dev, test et prod, chacun avec un catalogue nommé finance" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Catalogs usually correspond to an environment scope, a team or a business unit, and the region's single metastore serves every lifecycle scope. With one catalog per environment, the schema and table names stay identical, so a promoted job only changes the catalog name, which can be a parameter.
        fr: |
          Les catalogues correspondent en général à une étendue d'environnement, à une équipe ou à une unité métier, et le metastore unique de la région sert toutes les étendues du cycle de vie. Avec un catalogue par environnement, les noms de schémas et de tables restent identiques : un job promu ne change que le nom du catalogue, qui peut être un paramètre.
      options:
        a: { en: "Environment-prefixed schema names change from one environment to the next, which breaks the promotion requirement.", fr: "Des noms de schémas préfixés par l'environnement changent d'un environnement à l'autre, ce qui contredit l'exigence de promotion." }
        c: { en: "Suffixed table names differ in every environment, so every query must change when a job is promoted.", fr: "Des noms de tables suffixés diffèrent dans chaque environnement : chaque requête doit changer quand un job est promu." }
        d: { en: "Azure Databricks uses one metastore per region for all lifecycle scopes; isolation starts at the catalog level.", fr: "Azure Databricks utilise un metastore par région pour toutes les étendues du cycle de vie ; l'isolation commence au niveau du catalogue." }
    references:
      - title: Unity Catalog best practices
        url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/best-practices

  # ------------------------------------------------------------------ 2
  - id: dp750-qz-12-02
    objective: "1.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso's metastore has a metastore-level storage location. The catalog **contoso_prod** has a managed location in the container `uc-prod`, and its schema **contoso_prod.legal** has a managed location in the container `legal-data`.

        You run `CREATE VOLUME contoso_prod.legal.contracts;`.

        Where are the files of the contracts volume stored?
      fr: |
        Le metastore de Contoso dispose d'un emplacement de stockage au niveau du metastore. Le catalogue **contoso_prod** a un emplacement managé dans le conteneur `uc-prod`, et son schéma **contoso_prod.legal** a un emplacement managé dans le conteneur `legal-data`.

        Vous exécutez `CREATE VOLUME contoso_prod.legal.contracts;`.

        Où les fichiers du volume contracts sont-ils stockés ?
    body:
      options:
        - { id: a, text: { en: "In the metastore-level storage location", fr: "Dans l'emplacement de stockage du metastore" } }
        - { id: b, text: { en: "In the managed location of the catalog, in uc-prod", fr: "Dans l'emplacement managé du catalogue, dans uc-prod" } }
        - { id: c, text: { en: "In the managed location of the schema, in legal-data", fr: "Dans l'emplacement managé du schéma, dans legal-data" } }
        - { id: d, text: { en: "Nowhere until you add a LOCATION clause to the statement", fr: "Nulle part tant que vous n'ajoutez pas de clause LOCATION à l'instruction" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `CREATE VOLUME` without `EXTERNAL` creates a managed volume. Managed tables and volumes are stored in the lowest managed location of the hierarchy: the schema location when the schema has one, otherwise the catalog location, otherwise the metastore location.
        fr: |
          `CREATE VOLUME` sans `EXTERNAL` crée un volume managé. Les tables et volumes managés sont stockés dans l'emplacement managé le plus bas de la hiérarchie : celui du schéma quand le schéma en a un, sinon celui du catalogue, sinon celui du metastore.
      options:
        a: { en: "The metastore location is used only when neither the schema nor the catalog has a managed location.", fr: "L'emplacement du metastore n'est utilisé que si ni le schéma ni le catalogue n'ont d'emplacement managé." }
        b: { en: "A schema-level managed location overrides the catalog-level location.", fr: "Un emplacement managé au niveau du schéma l'emporte sur celui du catalogue." }
        d: { en: "A LOCATION clause belongs to an external volume; a managed volume uses the managed storage of its schema.", fr: "Une clause LOCATION concerne un volume externe ; un volume managé utilise le stockage managé de son schéma." }
    references:
      - title: Specify a managed storage location in Unity Catalog
        url: https://learn.microsoft.com/en-us/azure/databricks/connect/unity-catalog/cloud-storage/managed-storage

  # ------------------------------------------------------------------ 3
  - id: dp750-qz-12-03
    objective: "1.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind has a materialized view named **nw_prod.gold.sales_by_store**. Last night, a team backfilled two years of corrected rows into its source table.

        A job must now make the materialized view reprocess all the source data. The job step must not wait for the refresh to finish.

        Which statement should the job run?
      fr: |
        Northwind dispose d'une vue matérialisée nommée **nw_prod.gold.sales_by_store**. Hier soir, une équipe a rechargé deux ans de lignes corrigées dans sa table source.

        Un job doit maintenant faire retraiter toutes les données sources par la vue matérialisée. L'étape du job ne doit pas attendre la fin de l'actualisation.

        Quelle instruction le job doit-il exécuter ?
    body:
      options:
        - { id: a, text: "`REFRESH MATERIALIZED VIEW nw_prod.gold.sales_by_store ASYNC;`" }
        - { id: b, text: "`REFRESH MATERIALIZED VIEW nw_prod.gold.sales_by_store FULL;`" }
        - { id: c, text: "`REFRESH MATERIALIZED VIEW nw_prod.gold.sales_by_store FULL ASYNC;`" }
        - { id: d, text: "`REFRESH MATERIALIZED VIEW nw_prod.gold.sales_by_store FULL SYNC;`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `FULL` makes the materialized view process all the data available in the source instead of refreshing incrementally. `ASYNC` starts the refresh as a background pipeline job and returns immediately; without it, `REFRESH` is synchronous. The two keywords can be combined in one statement.
        fr: |
          `FULL` fait traiter par la vue matérialisée toutes les données disponibles dans la source au lieu d'une actualisation incrémentielle. `ASYNC` lance l'actualisation comme un job de pipeline en arrière-plan et rend la main immédiatement ; sans ce mot clé, `REFRESH` est synchrone. Les deux mots clés peuvent être combinés dans une même instruction.
      options:
        a: { en: "Without FULL, the refresh can be incremental and doesn't necessarily reprocess all the source data.", fr: "Sans FULL, l'actualisation peut être incrémentielle et ne retraite pas forcément toutes les données sources." }
        b: { en: "Without ASYNC, REFRESH is synchronous: the job step waits until the data load completes.", fr: "Sans ASYNC, REFRESH est synchrone : l'étape du job attend la fin du chargement des données." }
        d: { en: "SYNC is the default behavior and blocks until the refresh completes, which the job step must avoid.", fr: "SYNC est le comportement par défaut et bloque jusqu'à la fin de l'actualisation, ce que l'étape du job doit éviter." }
    references:
      - title: REFRESH (MATERIALIZED VIEW or STREAMING TABLE)
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-refresh-full

  # ------------------------------------------------------------------ 4
  - id: dp750-qz-12-04
    objective: "1.2.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin has a managed Delta table named **tailspin_prod.silver.invoices** that already contains millions of rows.

        You need to add a column named `currency` of type STRING. Rows inserted later without a currency value must get `'EUR'`. The existing rows can keep a NULL currency.

        Which statements should you run?
      fr: |
        Tailspin dispose d'une table Delta managée nommée **tailspin_prod.silver.invoices** qui contient déjà des millions de lignes.

        Vous devez ajouter une colonne nommée `currency` de type STRING. Les lignes insérées plus tard sans valeur de devise doivent recevoir `'EUR'`. Les lignes existantes peuvent garder une devise NULL.

        Quelles instructions devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`ALTER TABLE tailspin_prod.silver.invoices ADD COLUMN currency STRING DEFAULT 'EUR';`" }
        - { id: b, text: "`ALTER TABLE tailspin_prod.silver.invoices ADD COLUMN currency STRING;` then `ALTER TABLE tailspin_prod.silver.invoices ALTER COLUMN currency SET DEFAULT 'EUR';`" }
        - { id: c, text: "`ALTER TABLE tailspin_prod.silver.invoices ADD COLUMN currency STRING;` then `ALTER TABLE tailspin_prod.silver.invoices ALTER COLUMN currency SET NOT NULL;`" }
        - { id: d, text: "`ALTER TABLE tailspin_prod.silver.invoices SET TBLPROPERTIES ('delta.columnMapping.mode' = 'name');` then `ALTER TABLE tailspin_prod.silver.invoices ADD COLUMN currency STRING DEFAULT 'EUR';`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          You can't define a `DEFAULT` value when you add a column to an existing Delta table: the added column is NULL for the existing rows. After adding the column, `ALTER COLUMN ... SET DEFAULT` defines the default, which applies only to rows inserted afterward.
        fr: |
          Vous ne pouvez pas définir de valeur `DEFAULT` quand vous ajoutez une colonne à une table Delta existante : la colonne ajoutée vaut NULL pour les lignes existantes. Une fois la colonne ajoutée, `ALTER COLUMN ... SET DEFAULT` définit la valeur par défaut, qui ne s'applique qu'aux lignes insérées ensuite.
      options:
        a: { en: "A DEFAULT clause isn't allowed in ADD COLUMN on an existing Delta table, so the statement fails.", fr: "Une clause DEFAULT n'est pas autorisée dans ADD COLUMN sur une table Delta existante : l'instruction échoue." }
        c: { en: "SET NOT NULL validates the existing rows, which are all NULL, and it defines no default value anyway.", fr: "SET NOT NULL valide les lignes existantes, qui sont toutes NULL, et ne définit de toute façon aucune valeur par défaut." }
        d: { en: "Column mapping is needed to rename or drop columns; it doesn't allow a DEFAULT clause in ADD COLUMN.", fr: "Le mappage de colonnes sert à renommer ou supprimer des colonnes ; il n'autorise pas de clause DEFAULT dans ADD COLUMN." }
    references:
      - title: ALTER TABLE ... COLUMN clause
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-alter-table-manage-column

  # ------------------------------------------------------------------ 5
  - id: dp750-qz-12-05
    objective: "1.2.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An analyst at Adatum created a Genie Agent on a serverless SQL warehouse. The agent uses the tables `adatum_prod.gold.sales` and `adatum_prod.gold.forecast`. A group named **regional-managers** has CAN RUN on the agent, and USE CATALOG, USE SCHEMA and SELECT on the sales table only.

        When the managers ask about forecasts, Genie can't return the data, although the analyst gets answers to the same questions. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Un analyste d'Adatum a créé un Genie Agent sur un entrepôt SQL serverless. L'agent utilise les tables `adatum_prod.gold.sales` et `adatum_prod.gold.forecast`. Un groupe nommé **regional-managers** dispose de CAN RUN sur l'agent, ainsi que de USE CATALOG, USE SCHEMA et SELECT sur la seule table sales.

        Quand les responsables posent des questions sur les prévisions, Genie ne peut pas renvoyer les données, alors que l'analyste obtient des réponses aux mêmes questions. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Grant regional-managers CAN USE on the SQL warehouse of the agent.", fr: "Accorder à regional-managers CAN USE sur l'entrepôt SQL de l'agent." } }
        - { id: b, text: { en: "Grant regional-managers CAN MANAGE on the Genie Agent.", fr: "Accorder à regional-managers CAN MANAGE sur le Genie Agent." } }
        - { id: c, text: { en: "Grant regional-managers SELECT on the forecast table.", fr: "Accorder à regional-managers SELECT sur la table forecast." } }
        - { id: d, text: { en: "Add an example SQL query on the forecast table to the agent.", fr: "Ajouter à l'agent un exemple de requête SQL sur la table forecast." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The author's compute credentials are embedded in the Genie Agent for warehouse access, but data access is always evaluated with each end user's own Unity Catalog permissions. The managers already have USE CATALOG and USE SCHEMA, so SELECT on the forecast table is the missing privilege.
        fr: |
          Les informations d'identification de calcul de l'auteur sont intégrées au Genie Agent pour l'accès à l'entrepôt, mais l'accès aux données est toujours évalué avec les propres autorisations Unity Catalog de chaque utilisateur final. Les responsables disposent déjà de USE CATALOG et USE SCHEMA : SELECT sur la table forecast est le privilège manquant.
      options:
        a: { en: "End users don't need warehouse permissions: queries run with the compute credentials embedded by the author.", fr: "Les utilisateurs finaux n'ont pas besoin d'autorisations sur l'entrepôt : les requêtes s'exécutent avec les informations d'identification de calcul intégrées par l'auteur." }
        b: { en: "CAN MANAGE on the agent lets users configure and share it, but it grants no access to Unity Catalog data.", fr: "CAN MANAGE sur l'agent permet de le configurer et de le partager, mais ne donne aucun accès aux données Unity Catalog." }
        d: { en: "An example query still runs with the end user's permissions, so it can't read a table the managers have no SELECT on.", fr: "Un exemple de requête s'exécute toujours avec les autorisations de l'utilisateur final : il ne peut pas lire une table sur laquelle les responsables n'ont pas SELECT." }
    references:
      - title: Create and manage a Genie Agent
        url: https://learn.microsoft.com/en-us/azure/databricks/genie-agents/set-up

  # ------------------------------------------------------------------ 6
  - id: dp750-qz-12-06
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A partner's application writes Parquet files to `abfss://partner@stwingtip.dfs.core.windows.net/orders`, and it must keep writing there. This path is registered as the external volume **wingtip_prod.raw.partner_orders**, which data engineers used to explore the files.

        Analysts now need to query the data with SQL as a Unity Catalog table named **wingtip_prod.raw.partner_orders_t**, which always reflects the files written by the partner. The data must not be copied, and the partner's files must stay where they are. You hold every privilege required. The engineers no longer need the volume.

        What should you do?
      fr: |
        L'application d'un partenaire écrit des fichiers Parquet dans `abfss://partner@stwingtip.dfs.core.windows.net/orders` et doit continuer à y écrire. Ce chemin est inscrit comme volume externe **wingtip_prod.raw.partner_orders**, que les ingénieurs données utilisaient pour explorer les fichiers.

        Les analystes doivent désormais interroger les données en SQL comme une table Unity Catalog nommée **wingtip_prod.raw.partner_orders_t**, qui reflète toujours les fichiers écrits par le partenaire. Les données ne doivent pas être copiées, et les fichiers du partenaire doivent rester où ils sont. Vous détenez tous les privilèges nécessaires. Les ingénieurs n'ont plus besoin du volume.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create partner_orders_t with USING PARQUET and a LOCATION set to /Volumes/wingtip_prod/raw/partner_orders.", fr: "Créer partner_orders_t avec USING PARQUET et une LOCATION fixée à /Volumes/wingtip_prod/raw/partner_orders." } }
        - { id: b, text: { en: "Drop the external volume, then create partner_orders_t as an external table whose LOCATION is the abfss path.", fr: "Supprimer le volume externe, puis créer partner_orders_t comme table externe dont la LOCATION est le chemin abfss." } }
        - { id: c, text: { en: "Create partner_orders_t as a managed table with CREATE TABLE AS SELECT from read_files() on the volume path.", fr: "Créer partner_orders_t comme table managée avec CREATE TABLE AS SELECT depuis read_files() sur le chemin du volume." } }
        - { id: d, text: { en: "Create partner_orders_t as a materialized view on read_files() over the volume path, refreshed every hour.", fr: "Créer partner_orders_t comme vue matérialisée sur read_files() sur le chemin du volume, actualisée toutes les heures." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Files in a volume can't be registered as a Unity Catalog table: volumes are for path-based access only. Dropping an external volume removes only the Unity Catalog object, and its files stay in cloud storage. An external table on the same abfss path then reads the partner's files in place, with no copy.
        fr: |
          Les fichiers d'un volume ne peuvent pas être inscrits comme table Unity Catalog : les volumes servent uniquement à l'accès par chemin. Supprimer un volume externe ne retire que l'objet Unity Catalog, et ses fichiers restent dans le stockage cloud. Une table externe sur le même chemin abfss lit alors les fichiers du partenaire sur place, sans copie.
      options:
        a: { en: "A /Volumes path can't be the location of a table, because files in volumes can't be registered as tables.", fr: "Un chemin /Volumes ne peut pas être l'emplacement d'une table, car les fichiers des volumes ne peuvent pas être inscrits comme tables." }
        c: { en: "CREATE TABLE AS SELECT copies the data into managed storage, and the copy doesn't follow the partner's new files.", fr: "CREATE TABLE AS SELECT copie les données dans le stockage managé, et la copie ne suit pas les nouveaux fichiers du partenaire." }
        d: { en: "A materialized view stores precomputed results, which is a copy, and is current only after each refresh.", fr: "Une vue matérialisée stocke des résultats précalculés, donc une copie, et n'est à jour qu'après chaque actualisation." }
    references:
      - title: What are Unity Catalog volumes?
        url: https://learn.microsoft.com/en-us/azure/databricks/volumes/

  # ------------------------------------------------------------------ 7
  - id: dp750-qz-12-07
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove has the following objects in Unity Catalog:

        | Object | Type | Details |
        | --- | --- | --- |
        | wg_prod.silver.orders | Managed Delta table | Row tracking isn't enabled. |
        | wg_prod.gold.vw_orders | View on orders | Owned by grp-data-eng, which has SELECT on orders. |
        | wg_prod.gold.mv_daily | Materialized view on orders | Created from a serverless SQL warehouse. |

        The group **grp-analysts** has USE CATALOG and USE SCHEMA on the catalog and schemas, and SELECT on vw_orders and mv_daily. It has no privilege on the orders table.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose des objets suivants dans Unity Catalog :

        | Objet | Type | Détails |
        | --- | --- | --- |
        | wg_prod.silver.orders | Table Delta managée | Le suivi des lignes (row tracking) n'est pas activé. |
        | wg_prod.gold.vw_orders | Vue sur orders | Détenue par grp-data-eng, qui dispose de SELECT sur orders. |
        | wg_prod.gold.mv_daily | Vue matérialisée sur orders | Créée depuis un entrepôt SQL serverless. |

        Le groupe **grp-analysts** dispose de USE CATALOG et USE SCHEMA sur le catalogue et les schémas, et de SELECT sur vw_orders et mv_daily. Il n'a aucun privilège sur la table orders.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A member of grp-analysts can query vw_orders from dedicated compute that runs Databricks Runtime 15.3.", fr: "Un membre de grp-analysts peut interroger vw_orders depuis un calcul dédié qui exécute Databricks Runtime 15.3." } }
        - { id: s2, text: { en: "A member of grp-analysts can query mv_daily as it was yesterday by adding TIMESTAMP AS OF to the query.", fr: "Un membre de grp-analysts peut interroger mv_daily tel qu'il était hier en ajoutant TIMESTAMP AS OF à la requête." } }
        - { id: s3, text: { en: "For mv_daily to support incremental refresh, row tracking must be enabled on the orders table.", fr: "Pour que mv_daily prenne en charge l'actualisation incrémentielle, le suivi des lignes doit être activé sur la table orders." } }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          On dedicated compute on Databricks Runtime 15.3 and below, Unity Catalog checks the permissions of both the view owner and the view user on the underlying data, so the analysts would also need SELECT on orders. Time travel queries aren't supported on materialized views. Incremental refresh requires Delta sources with row tracking enabled, and Databricks also recommends deletion vectors.
        fr: |
          Sur un calcul dédié en Databricks Runtime 15.3 et versions antérieures, Unity Catalog vérifie sur les données sous-jacentes les autorisations du propriétaire de la vue et celles de son utilisateur : les analystes auraient donc aussi besoin de SELECT sur orders. Les requêtes de voyage dans le temps ne sont pas prises en charge sur les vues matérialisées. L'actualisation incrémentielle exige des sources Delta avec le suivi des lignes activé, et Databricks recommande aussi les vecteurs de suppression.
      options:
        s1: { en: "Only SQL warehouses, standard compute and dedicated compute on 15.4 LTS and above check the view owner's permissions alone.", fr: "Seuls les entrepôts SQL, le calcul standard et le calcul dédié en 15.4 LTS et versions ultérieures vérifient uniquement les autorisations du propriétaire de la vue." }
        s2: { en: "TIMESTAMP AS OF and VERSION AS OF are time travel queries, which materialized views don't support.", fr: "TIMESTAMP AS OF et VERSION AS OF sont des requêtes de voyage dans le temps, que les vues matérialisées ne prennent pas en charge." }
    references:
      - title: What is a view?
        url: https://learn.microsoft.com/en-us/azure/databricks/views/
      - title: Use standalone materialized views
        url: https://learn.microsoft.com/en-us/azure/databricks/views/materialized

  # ------------------------------------------------------------------ 8
  - id: dp750-qz-12-08
    objective: "1.2.7"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware's schema **litware_prod.supply** contains Delta tables. All Azure Databricks compute runs Databricks Runtime 17.3 LTS. You must handle three situations, each with one statement and the least data movement.

        Which statement should you use for each situation? To answer, drag the appropriate statements to the correct situations. Each statement may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le schéma **litware_prod.supply** de Litware contient des tables Delta. Tout le calcul Azure Databricks exécute Databricks Runtime 17.3 LTS. Vous devez traiter trois situations, chacune avec une seule instruction et le moins de déplacement de données possible.

        Quelle instruction devez-vous utiliser pour chaque situation ? Pour répondre, faites glisser les instructions appropriées vers les situations correspondantes. Chaque instruction peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: unset, text: "`ALTER TABLE ... UNSET MANAGED`" }
        - { id: sync, text: "`MSCK REPAIR TABLE ... SYNC METADATA`" }
        - { id: type, text: "`ALTER TABLE ... ALTER COLUMN qty TYPE BIGINT`" }
        - { id: restore, text: "`RESTORE TABLE ... TO TIMESTAMP AS OF`" }
        - { id: setloc, text: "`ALTER TABLE ... SET LOCATION`" }
        - { id: ctas, text: "`CREATE OR REPLACE TABLE ... AS SELECT`" }
      targets:
        - { id: t1, text: { en: "Four days ago, you converted the external table partner_stock to a managed table with SET MANAGED. A partner's tool that can't work with managed tables must use it again: make partner_stock an external table again.", fr: "Il y a quatre jours, vous avez converti la table externe partner_stock en table managée avec SET MANAGED. Un outil d'un partenaire qui ne sait pas utiliser les tables managées doit s'en servir de nouveau : refaire de partner_stock une table externe." } }
        - { id: t2, text: { en: "A Spark application outside Azure Databricks writes to the external table shipments, and Catalog Explorer shows outdated metadata: update the Unity Catalog metadata from the table's transaction log.", fr: "Une application Spark extérieure à Azure Databricks écrit dans la table externe shipments, et Catalog Explorer affiche des métadonnées obsolètes : mettre à jour les métadonnées Unity Catalog à partir du journal des transactions de la table." } }
        - { id: t3, text: { en: "Change the qty column of the managed table order_lines, which has type widening enabled, from INT to BIGINT without rewriting the data files.", fr: "Changer la colonne qty de la table managée order_lines, sur laquelle l'élargissement de type est activé, de INT en BIGINT sans réécrire les fichiers de données." } }
    answer:
      mapping: { t1: unset, t2: sync, t3: type }
    explanation:
      correct:
        en: |
          Within 14 days of a `SET MANAGED` conversion, `UNSET MANAGED` rolls the table back to an external table; Databricks keeps the writes made after the conversion. `SYNC METADATA` reads the transaction log of a Delta table and updates its metadata in the catalog service. With type widening enabled, `ALTER COLUMN ... TYPE` changes INT to BIGINT by updating the schema only, without rewriting the data files.
        fr: |
          Dans les 14 jours qui suivent une conversion `SET MANAGED`, `UNSET MANAGED` ramène la table à une table externe ; Databricks conserve les écritures faites après la conversion. `SYNC METADATA` lit le journal des transactions d'une table Delta et met à jour ses métadonnées dans le service de catalogue. Avec l'élargissement de type activé, `ALTER COLUMN ... TYPE` passe de INT à BIGINT en ne modifiant que le schéma, sans réécrire les fichiers de données.
      options:
        restore: { en: "RESTORE TABLE returns the table data to an earlier version; it doesn't undo a conversion to a managed table.", fr: "RESTORE TABLE ramène les données de la table à une version antérieure ; il n'annule pas une conversion en table managée." }
        setloc: { en: "SET LOCATION points the table to another path; it neither rolls back a conversion nor refreshes metadata from the log.", fr: "SET LOCATION fait pointer la table vers un autre chemin ; il n'annule pas une conversion et ne rafraîchit pas les métadonnées à partir du journal." }
        ctas: { en: "CREATE OR REPLACE TABLE AS SELECT rewrites all the data, which the type change must avoid.", fr: "CREATE OR REPLACE TABLE AS SELECT réécrit toutes les données, ce que le changement de type doit éviter." }
    references:
      - title: Convert external or foreign Delta Lake tables to Unity Catalog managed tables
        url: https://learn.microsoft.com/en-us/azure/databricks/tables/convert-external-managed
      - title: REPAIR TABLE
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-repair-table

  # ------------------------------------------------------------------ 9
  - id: dp750-qz-12-09
    objective: "1.2.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware runs a MySQL database named **loyalty** on Azure Database for MySQL. A data engineer named **User1** must create a Unity Catalog connection to the server, then create a foreign catalog named **loyalty_ext** from that connection. No connection to the server exists yet.

        User1 isn't a metastore admin and has no privilege on the metastore. You need to grant User1 the privileges required. The solution must follow the principle of least privilege.

        Which two privileges should you grant? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware exploite une base de données MySQL nommée **loyalty** sur Azure Database pour MySQL. Un ingénieur données nommé **User1** doit créer une connexion Unity Catalog vers le serveur, puis créer à partir de cette connexion un catalogue étranger nommé **loyalty_ext**. Aucune connexion vers le serveur n'existe encore.

        User1 n'est pas administrateur du metastore et ne dispose d'aucun privilège sur le metastore. Vous devez accorder à User1 les privilèges nécessaires. La solution doit respecter le principe du moindre privilège.

        Quels sont les deux privilèges que vous devez accorder ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "CREATE CONNECTION on the metastore", fr: "CREATE CONNECTION sur le metastore" } }
        - { id: b, text: { en: "CREATE FOREIGN CATALOG on the new connection", fr: "CREATE FOREIGN CATALOG sur la nouvelle connexion" } }
        - { id: c, text: { en: "CREATE CATALOG on the metastore", fr: "CREATE CATALOG sur le metastore" } }
        - { id: d, text: { en: "CREATE EXTERNAL LOCATION on the metastore", fr: "CREATE EXTERNAL LOCATION sur le metastore" } }
        - { id: e, text: { en: "CREATE STORAGE CREDENTIAL on the metastore", fr: "CREATE STORAGE CREDENTIAL sur le metastore" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Creating a connection requires the metastore admin role or CREATE CONNECTION on the metastore, and the user who creates the connection becomes its owner. Creating a foreign catalog requires CREATE CATALOG on the metastore plus either ownership of the connection or CREATE FOREIGN CATALOG on it: as the owner, User1 needs no additional privilege on the connection.
        fr: |
          Créer une connexion exige le rôle d'administrateur du metastore ou CREATE CONNECTION sur le metastore, et l'utilisateur qui crée la connexion en devient le propriétaire. Créer un catalogue étranger exige CREATE CATALOG sur le metastore, plus la propriété de la connexion ou CREATE FOREIGN CATALOG sur celle-ci : en tant que propriétaire, User1 n'a besoin d'aucun privilège supplémentaire sur la connexion.
      options:
        b: { en: "CREATE FOREIGN CATALOG is needed only by a user who doesn't own the connection; User1 will own the connection it creates.", fr: "CREATE FOREIGN CATALOG n'est nécessaire qu'à un utilisateur qui ne possède pas la connexion ; User1 possédera la connexion qu'il crée." }
        d: { en: "External locations govern paths in cloud storage; query federation to MySQL goes through the connection over JDBC.", fr: "Les emplacements externes gouvernent des chemins du stockage cloud ; la fédération de requêtes vers MySQL passe par la connexion, en JDBC." }
        e: { en: "A storage credential gives access to cloud storage, not to a database; the connection stores the database credentials.", fr: "Des informations d'identification de stockage donnent accès au stockage cloud, pas à une base de données ; la connexion contient les informations d'identification de la base." }
    references:
      - title: Run federated queries on MySQL
        url: https://learn.microsoft.com/en-us/azure/databricks/query-federation/mysql

  # ------------------------------------------------------------------ 10
  - id: dp750-qz-12-10
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum's Unity Catalog metastore is attached to three workspaces: **adb-prod**, **adb-dev** and **adb-sandbox**. Signed in to adb-dev, a data engineer named User1 creates a catalog named **hr_prod** in Catalog Explorer and, when Catalog Explorer confirms the creation, chooses **View catalog** rather than configuring the catalog.

        Later, a metastore admin clears **All workspaces have access** on hr_prod, assigns adb-prod with read and write access, and assigns adb-dev with read-only access.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le metastore Unity Catalog d'Adatum est attaché à trois espaces de travail : **adb-prod**, **adb-dev** et **adb-sandbox**. Connecté à adb-dev, un ingénieur données nommé User1 crée un catalogue nommé **hr_prod** dans Catalog Explorer et, quand Catalog Explorer confirme la création, choisit **View catalog** plutôt que de configurer le catalogue.

        Plus tard, un administrateur du metastore décoche **All workspaces have access** sur hr_prod, attribue adb-prod avec un accès en lecture et en écriture, et attribue adb-dev avec un accès en lecture seule.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Right after User1 created hr_prod, all account users held the BROWSE privilege on it.", fr: "Juste après la création de hr_prod par User1, tous les utilisateurs du compte détenaient le privilège BROWSE sur celui-ci." } }
        - { id: s2, text: { en: "Working in Catalog Explorer in adb-dev, User1 could have restricted hr_prod to adb-prod alone.", fr: "En travaillant dans Catalog Explorer dans adb-dev, User1 aurait pu limiter hr_prod au seul adb-prod." } }
        - { id: s3, text: { en: "A user who holds SELECT on the tables of hr_prod and queries them from adb-sandbox receives an error.", fr: "Un utilisateur qui détient SELECT sur les tables de hr_prod et les interroge depuis adb-sandbox reçoit une erreur." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Choosing View catalog instead of configuring it leaves the catalog open to all workspaces and grants BROWSE to all account users. When you restrict a catalog to specific workspaces in Catalog Explorer, the current workspace must be included, so User1 couldn't leave adb-dev out from adb-dev. A workspace that isn't in the assigned list gets an error on the catalog, which overrides the privileges that users hold.
        fr: |
          Choisir View catalog au lieu de configurer le catalogue le laisse ouvert à tous les espaces de travail et accorde BROWSE à tous les utilisateurs du compte. Quand vous limitez un catalogue à des espaces de travail précis dans Catalog Explorer, l'espace de travail actuel doit être inclus : depuis adb-dev, User1 ne pouvait pas exclure adb-dev. Un espace de travail absent de la liste attribuée reçoit une erreur sur le catalogue, ce qui l'emporte sur les privilèges que détiennent les utilisateurs.
      options:
        s2: { en: "The current workspace must be included when you assign a catalog to workspaces; a metastore admin could bind it to adb-prod from adb-prod.", fr: "L'espace de travail actuel doit être inclus quand vous attribuez un catalogue à des espaces de travail ; un administrateur pourrait le lier à adb-prod depuis adb-prod." }
    references:
      - title: Create catalogs
        url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/create-catalog
      - title: Workspace-catalog binding
        url: https://learn.microsoft.com/en-us/azure/databricks/catalogs/binding
