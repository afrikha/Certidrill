chapter: 42-lakeflow-jobs
questions:
  # ------------------------------------------------------------------ 1
  - id: dp750-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Lakeflow job named **adatum_claims_daily** has its **Run as** setting set to a service principal named **sp-claims**. A support engineer who has the CAN MANAGE RUN permission on the job clicks **Run now**.

        Whose permissions does the run use to read and write data?
      fr: |
        Le paramètre **Run as** d'un job Lakeflow nommé **adatum_claims_daily** est défini sur un principal de service nommé **sp-claims**. Un ingénieur de support qui dispose de l'autorisation CAN MANAGE RUN sur le job clique sur **Run now**.

        Les autorisations de qui l'exécution utilise-t-elle pour lire et écrire les données ?
    body:
      options:
        - { id: a, text: { en: "The permissions of the engineer who clicked Run now", fr: "Les autorisations de l'ingénieur qui a cliqué sur Run now" } }
        - { id: b, text: { en: "The permissions of sp-claims, the Run as identity of the job", fr: "Les autorisations de sp-claims, l'identité Run as du job" } }
        - { id: c, text: { en: "The permissions of the job owner, whatever Run as is set to", fr: "Les autorisations du propriétaire du job, quel que soit Run as" } }
        - { id: d, text: { en: "The permissions of the workspace admins group of the workspace", fr: "Les autorisations du groupe des administrateurs de l'espace de travail" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A job run always uses the permissions of the identity in the Run as setting, including a run started manually with Run now. CAN MANAGE RUN only lets the engineer trigger and cancel runs: it doesn't make the run use the engineer's own privileges.
        fr: |
          Une exécution de job utilise toujours les autorisations de l'identité définie dans Run as, y compris une exécution lancée manuellement avec Run now. CAN MANAGE RUN permet seulement à l'ingénieur de déclencher et d'annuler des exécutions : l'exécution n'utilise pas ses propres privilèges.
      options:
        a: { en: "The user who starts the run doesn't lend their privileges to it; granting them SELECT doesn't fix a run that lacks privileges.", fr: "L'utilisateur qui lance l'exécution ne lui prête pas ses privilèges ; lui accorder SELECT ne corrige pas une exécution à qui il manque des privilèges." }
        c: { en: "The owner is only the default Run as identity; here Run as is set to a service principal, which takes precedence.", fr: "Le propriétaire n'est que l'identité Run as par défaut ; ici Run as est défini sur un principal de service, qui prévaut." }
        d: { en: "No job runs with the privileges of the admins group; admins can change settings, but the run uses the Run as identity.", fr: "Aucun job ne s'exécute avec les privilèges du groupe des administrateurs ; ils peuvent modifier les paramètres, mais l'exécution utilise l'identité Run as." }
    references:
      - title: Manage identities, permissions, and privileges for Lakeflow Jobs - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/privileges

  # ------------------------------------------------------------------ 2
  - id: dp750-qz-42-02
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans to add a file arrival trigger to a Lakeflow job. The trigger will monitor a Unity Catalog volume to which suppliers upload files a few times a day. The finance team asks what the trigger itself costs while it waits for new files.

        What should you answer?
      fr: |
        Fabrikam prévoit d'ajouter un déclencheur File arrival à un job Lakeflow. Le déclencheur surveillera un volume Unity Catalog dans lequel des fournisseurs chargent des fichiers quelques fois par jour. L'équipe financière demande ce que coûte le déclencheur lui-même pendant qu'il attend de nouveaux fichiers.

        Que devez-vous répondre ?
    body:
      options:
        - { id: a, text: { en: "The DBUs of a small jobs cluster that checks the volume every minute", fr: "Les DBU d'un petit cluster de jobs qui vérifie le volume chaque minute" } }
        - { id: b, text: { en: "The serverless DBUs of each check, billed about once per minute", fr: "Les DBU serverless de chaque vérification, facturées environ une fois par minute" } }
        - { id: c, text: { en: "No Azure Databricks cost, only the cloud provider's cost of listing files", fr: "Aucun coût Azure Databricks, seulement le coût de listage des fichiers chez le fournisseur cloud" } }
        - { id: d, text: { en: "A fixed DBU charge for each hour during which the trigger is active", fr: "Un montant fixe de DBU pour chaque heure pendant laquelle le déclencheur est actif" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A file arrival trigger checks for new files about every minute, but this check adds no Azure Databricks cost. You pay only the cloud provider's charges for listing the files of the storage location; compute is billed only when the trigger starts a run.
        fr: |
          Un déclencheur File arrival recherche de nouveaux fichiers environ chaque minute, mais cette vérification n'ajoute aucun coût Azure Databricks. Vous ne payez que les frais du fournisseur cloud pour le listage des fichiers de l'emplacement de stockage ; le calcul n'est facturé que lorsque le déclencheur lance une exécution.
      options:
        a: { en: "No cluster runs between runs: the check is done by the service, not by jobs compute.", fr: "Aucun cluster ne tourne entre les exécutions : la vérification est faite par le service, pas par un calcul de jobs." }
        b: { en: "The checks don't consume serverless DBUs; only the triggered runs consume compute.", fr: "Les vérifications ne consomment pas de DBU serverless ; seules les exécutions déclenchées consomment du calcul." }
        d: { en: "There is no hourly charge for an active trigger; Azure Databricks bills nothing for the trigger itself.", fr: "Il n'existe aucune facturation horaire d'un déclencheur actif ; Azure Databricks ne facture rien pour le déclencheur lui-même." }
    references:
      - title: Trigger jobs when new files arrive - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/file-arrival-triggers

  # ------------------------------------------------------------------ 3
  - id: dp750-qz-42-03
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A partner publishes new exchange rates at 00:00, 06:00, 12:00 and 18:00 UTC every day. A Lakeflow job named **woodgrove_fx_rates** loads them into `woodgrove_prod.ref.fx_rates`.

        You need the job to start at each of these four times.

        What should you configure?
      fr: |
        Un partenaire publie de nouveaux taux de change à 00:00, 06:00, 12:00 et 18:00 UTC chaque jour. Un job Lakeflow nommé **woodgrove_fx_rates** les charge dans `woodgrove_prod.ref.fx_rates`.

        Le job doit démarrer à chacune de ces quatre heures.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A Simple schedule that runs every 6 hours", fr: "Une planification Simple qui s'exécute toutes les 6 heures" } }
        - { id: b, text: { en: "An Advanced schedule with `0 0/6 * * * ?` and the time zone UTC", fr: "Une planification Advanced avec `0 0/6 * * * ?` et le fuseau horaire UTC" } }
        - { id: c, text: { en: "An Advanced schedule with `0 0 6 * * ?` and the time zone UTC", fr: "Une planification Advanced avec `0 0 6 * * ?` et le fuseau horaire UTC" } }
        - { id: d, text: { en: "An Advanced schedule with `0 0 0/6 * * ?` and the time zone UTC", fr: "Une planification Advanced avec `0 0 0/6 * * ?` et le fuseau horaire UTC" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A Quartz cron expression lists seconds, minutes, hours, day of month, month and day of week. `0 0 0/6 * * ?` fires at second 0 and minute 0 of every sixth hour starting at 0, so at 00:00, 06:00, 12:00 and 18:00 in the UTC time zone of the Advanced schedule.
        fr: |
          Une expression cron Quartz comporte les secondes, les minutes, les heures, le jour du mois, le mois et le jour de la semaine. `0 0 0/6 * * ?` se déclenche à la seconde 0 et à la minute 0 de chaque sixième heure à partir de 0, donc à 00:00, 06:00, 12:00 et 18:00 dans le fuseau horaire UTC de la planification Advanced.
      options:
        a: { en: "A Simple schedule repeats the interval, but you can't choose the time of its first run, so the runs may not fall on the hour.", fr: "Une planification Simple répète l'intervalle, mais vous ne pouvez pas choisir l'heure de sa première exécution : les exécutions risquent de ne pas tomber à l'heure pile." }
        b: { en: "`0/6` is in the minutes field: the job would start every 6 minutes.", fr: "`0/6` est dans le champ des minutes : le job démarrerait toutes les 6 minutes." }
        c: { en: "This expression fires once a day, at 06:00 only.", fr: "Cette expression se déclenche une fois par jour, à 06:00 uniquement." }
    references:
      - title: Run jobs on a schedule - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/scheduled

  # ------------------------------------------------------------------ 4
  - id: dp750-qz-42-04
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You are configuring the notifications of a Lakeflow job named **tailspin_fares_nightly**. An administrator has created an HTTP webhook system destination named **ops-hook**. A data engineer named Ana has the CAN MANAGE RUN permission on the job. The task **load_fares** of the job has a retry policy.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous configurez les notifications d'un job Lakeflow nommé **tailspin_fares_nightly**. Un administrateur a créé une destination système webhook HTTP nommée **ops-hook**. Une ingénieure données nommée Ana dispose de l'autorisation CAN MANAGE RUN sur le job. La tâche **load_fares** du job a une stratégie de nouvelles tentatives.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Ana can add a Failure notification that sends to ops-hook on the job.
            fr: Ana peut ajouter au job une notification Failure envoyée à ops-hook.
        - id: s2
          text:
            en: If ops-hook is selected for the Failure event of the job, it receives a payload whose `event_type` is `jobs.on_failure` when a run fails.
            fr: Si ops-hook est sélectionnée pour l'événement Failure du job, elle reçoit une charge utile dont l'`event_type` est `jobs.on_failure` quand une exécution échoue.
        - id: s3
          text:
            en: You can select Mute notifications until the last retry in the job-level notification settings.
            fr: Vous pouvez sélectionner Mute notifications until the last retry dans les paramètres de notification au niveau du job.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Adding or editing notifications requires CAN MANAGE or IS OWNER on the job; CAN MANAGE RUN only triggers and cancels runs, so Ana can't do it. A webhook destination receives a JSON payload with an `event_type` such as `jobs.on_start`, `jobs.on_success`, `jobs.on_failure` or `jobs.on_duration_warning_threshold_exceeded`, which gives automation a stable schema. Mute notifications until the last retry is an option of task notifications, not of the job notification settings.
        fr: |
          Ajouter ou modifier des notifications demande CAN MANAGE ou IS OWNER sur le job ; CAN MANAGE RUN permet seulement de déclencher et d'annuler des exécutions, donc Ana ne peut pas le faire. Une destination webhook reçoit une charge utile JSON avec un `event_type` comme `jobs.on_start`, `jobs.on_success`, `jobs.on_failure` ou `jobs.on_duration_warning_threshold_exceeded`, ce qui donne à l'automatisation un schéma stable. Mute notifications until the last retry est une option des notifications de tâche, pas des paramètres de notification du job.
    references:
      - title: Add notifications on a job - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications

  # ------------------------------------------------------------------ 5
  - id: dp750-qz-42-05
    objective: "4.2.5"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        The task **load_ledger** of a Lakeflow job runs on classic jobs compute. Its retry policy allows 2 retries with a retry interval of 10 minutes.

        During a run, the first attempt of load_ledger starts at 02:00 and fails at 02:04.

        At what time does the first retry start, at the earliest?
      fr: |
        La tâche **load_ledger** d'un job Lakeflow s'exécute sur un calcul de jobs classique. Sa stratégie de nouvelles tentatives autorise 2 nouvelles tentatives avec un intervalle de 10 minutes.

        Pendant une exécution, la première tentative de load_ledger démarre à 02:00 et échoue à 02:04.

        À quelle heure la première nouvelle tentative démarre-t-elle, au plus tôt ?
    body:
      options:
        - { id: a, text: "02:04" }
        - { id: b, text: "02:10" }
        - { id: c, text: "02:14" }
        - { id: d, text: "02:20" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The retry interval is measured from the start of the failed attempt to the start of the next attempt, not from the failure. The attempt started at 02:00, so with a 10-minute interval the retry starts at 02:10 at the earliest, 6 minutes after the failure.
        fr: |
          L'intervalle de nouvelle tentative se mesure entre le début de la tentative en échec et le début de la tentative suivante, pas à partir de l'échec. La tentative a démarré à 02:00 : avec un intervalle de 10 minutes, la nouvelle tentative démarre au plus tôt à 02:10, soit 6 minutes après l'échec.
      options:
        a: { en: "A retry policy with an interval doesn't restart the task immediately after the failure.", fr: "Une stratégie de nouvelles tentatives avec un intervalle ne relance pas la tâche immédiatement après l'échec." }
        c: { en: "02:14 measures the interval from the failure; Azure Databricks measures it from the start of the failed attempt.", fr: "02:14 mesure l'intervalle à partir de l'échec ; Azure Databricks le mesure à partir du début de la tentative en échec." }
        d: { en: "02:20 would add the interval twice; there is a single 10-minute interval before the first retry.", fr: "02:20 ajouterait l'intervalle deux fois ; il n'y a qu'un intervalle de 10 minutes avant la première nouvelle tentative." }
    references:
      - title: Configure and edit tasks in Lakeflow Jobs - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-task

  # ------------------------------------------------------------------ 6
  - id: dp750-qz-42-06
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso uses an Azure Data Factory pipeline to start a Lakeflow job named **contoso_sales_region** through the Jobs API. At 02:00, the pipeline starts five runs of the job at the same time, each with a different value of the job parameter `region`. Each run takes about 50 minutes on its own job cluster.

        The job has Max concurrent runs set to 1 and the queue enabled. The five runs complete one after the other, and the last region is ready only after 06:00. The workspace limits on concurrent runs aren't reached.

        You need the five regional runs to execute at the same time, and no run must be skipped. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Contoso utilise un pipeline Azure Data Factory pour lancer un job Lakeflow nommé **contoso_sales_region** par l'API Jobs. À 02:00, le pipeline lance en même temps cinq exécutions du job, chacune avec une valeur différente du paramètre de job `region`. Chaque exécution dure environ 50 minutes sur son propre cluster de job.

        Le job a Max concurrent runs défini sur 1 et la file d'attente activée. Les cinq exécutions se terminent l'une après l'autre, et la dernière région n'est prête qu'après 06:00. Les limites d'exécutions simultanées de l'espace de travail ne sont pas atteintes.

        Les cinq exécutions régionales doivent s'exécuter en même temps, et aucune exécution ne doit être ignorée. La solution doit réduire au minimum l'effort d'administration.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Disable the queue of the job, and keep Max concurrent runs set to 1.", fr: "Désactiver la file d'attente du job, et conserver Max concurrent runs sur 1." } }
        - { id: b, text: { en: "Create four copies of the job, and start one copy for each region.", fr: "Créer quatre copies du job, et lancer une copie pour chaque région." } }
        - { id: c, text: { en: "Enable Performance optimized so that each queued run starts faster.", fr: "Activer Performance optimized pour que chaque exécution en file démarre plus vite." } }
        - { id: d, text: { en: "Set Max concurrent runs of the job to 5, and keep the queue enabled.", fr: "Définir Max concurrent runs du job sur 5, et conserver la file d'attente activée." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Max concurrent runs caps the active runs of a job; with 1 and the queue enabled, the four extra runs wait in the queue and run one after the other. Raising the value to 5 lets the five runs, which differ only by their input parameter, run at the same time in the same job, and the queue still protects any run beyond the limit.
        fr: |
          Max concurrent runs limite les exécutions actives d'un job ; avec 1 et la file d'attente activée, les quatre exécutions en plus attendent dans la file et s'exécutent l'une après l'autre. Passer la valeur à 5 permet aux cinq exécutions, qui ne diffèrent que par leur paramètre d'entrée, de s'exécuter en même temps dans le même job, et la file protège toujours une exécution au-delà de la limite.
      options:
        a: { en: "Without the queue, a run that exceeds Max concurrent runs is skipped: four regions would not be processed at all.", fr: "Sans file d'attente, une exécution qui dépasse Max concurrent runs est ignorée : quatre régions ne seraient pas traitées du tout." }
        b: { en: "Copies would work, but five jobs to maintain is more administrative effort than one setting.", fr: "Des copies fonctionneraient, mais cinq jobs à maintenir demandent plus d'effort d'administration qu'un seul paramètre." }
        c: { en: "Performance optimized affects the startup of serverless tasks; the runs would still wait for each other.", fr: "Performance optimized agit sur le démarrage des tâches serverless ; les exécutions s'attendraient toujours les unes les autres." }
    references:
      - title: Configure and edit Lakeflow Jobs - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-job

  # ------------------------------------------------------------------ 7
  - id: dp750-qz-42-07
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware has a Lakeflow job named **litware_orders_hourly** with two tasks, **ingest** and **publish**. The ingest task has a retry policy of three retries. Analysts receive alerts from a Failure notification set on the publish task. An administrator has created two system destinations: an HTTP webhook named **itsm-hook** and a Microsoft Teams channel named **ops-teams**.

        The job must meet the following notification requirements:

        - R1: The ITSM tool must parse a message with a fixed schema each time a run of the job fails.
        - R2: The ingest team must be told about each failed attempt of ingest, including attempts that a later retry fixes.
        - R3: The analysts must stop receiving the publish alerts for runs that operators cancel.

        Which configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un job Lakeflow nommé **litware_orders_hourly** avec deux tâches, **ingest** et **publish**. La tâche ingest a une stratégie de trois nouvelles tentatives. Les analystes reçoivent des alertes d'une notification Failure définie sur la tâche publish. Un administrateur a créé deux destinations système : un webhook HTTP nommé **itsm-hook** et un canal Microsoft Teams nommé **ops-teams**.

        Le job doit répondre aux exigences de notification suivantes :

        - R1 : l'outil ITSM doit analyser un message au schéma fixe chaque fois qu'une exécution du job échoue.
        - R2 : l'équipe ingest doit être informée de chaque tentative en échec de ingest, y compris les tentatives qu'une nouvelle tentative ultérieure corrige.
        - R3 : les analystes ne doivent plus recevoir les alertes de publish pour les exécutions que les opérateurs annulent.

        Quelle configuration devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: hook, text: { en: "A job notification on Failure sent to itsm-hook", fr: "Une notification de job sur Failure envoyée à itsm-hook" } }
        - { id: teams, text: { en: "A job notification on Failure sent to ops-teams", fr: "Une notification de job sur Failure envoyée à ops-teams" } }
        - { id: taskfail, text: { en: "A task notification on Failure set on ingest", fr: "Une notification de tâche sur Failure définie sur ingest" } }
        - { id: jobfail, text: { en: "A job notification on Failure sent to the ingest team", fr: "Une notification de job sur Failure envoyée à l'équipe ingest" } }
        - { id: taskmute, text: { en: "Mute notifications for canceled runs in the publish task notification", fr: "Mute notifications for canceled runs dans la notification de la tâche publish" } }
        - { id: jobmute, text: { en: "Mute notifications for canceled runs in the job notification settings", fr: "Mute notifications for canceled runs dans les paramètres de notification du job" } }
      targets:
        - { id: r1, text: { en: "R1: fixed-schema message to the ITSM tool for each failed run", fr: "R1 : message au schéma fixe vers l'outil ITSM pour chaque exécution en échec" } }
        - { id: r2, text: { en: "R2: an alert for each failed attempt of ingest", fr: "R2 : une alerte pour chaque tentative en échec de ingest" } }
        - { id: r3, text: { en: "R3: no publish alerts for canceled runs", fr: "R3 : aucune alerte de publish pour les exécutions annulées" } }
    answer:
      mapping: { r1: hook, r2: taskfail, r3: taskmute }
    explanation:
      correct:
        en: |
          The content of Slack and Microsoft Teams messages can change, so a tool that needs a specific schema must use a webhook destination, which receives a JSON payload such as `jobs.on_failure`. Job-level notifications aren't sent when failed tasks are retried; a task notification on ingest reports every failed attempt. Job-level mute settings don't filter task-level notifications, so the canceled-run filter must be set on the publish task notification itself.
        fr: |
          Le contenu des messages Slack et Microsoft Teams peut changer : un outil qui a besoin d'un schéma précis doit utiliser une destination webhook, qui reçoit une charge utile JSON comme `jobs.on_failure`. Les notifications du job ne sont pas envoyées quand des tâches en échec sont relancées ; une notification de tâche sur ingest signale chaque tentative en échec. Les paramètres de mise en sourdine du job ne filtrent pas les notifications des tâches : le filtre des exécutions annulées doit être défini sur la notification de la tâche publish elle-même.
      options:
        teams: { en: "Teams messages are meant for people; their format can change, so automation must not parse them.", fr: "Les messages Teams sont destinés à des personnes ; leur format peut changer, l'automatisation ne doit donc pas les analyser." }
        jobfail: { en: "A job-level notification isn't sent for the attempts that are retried, so the team would miss the failures that a retry fixes.", fr: "Une notification au niveau du job n'est pas envoyée pour les tentatives relancées : l'équipe manquerait les échecs qu'une nouvelle tentative corrige." }
        jobmute: { en: "The job-level option filters only job-level notifications; the analysts' alerts come from the task notification.", fr: "L'option du job ne filtre que les notifications du job ; les alertes des analystes viennent de la notification de tâche." }
    references:
      - title: Add notifications on a job - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/notifications

  # ------------------------------------------------------------------ 8
  - id: dp750-qz-42-08
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware runs a Lakeflow job named **proseware_events_hourly** on classic jobs compute, with a schedule that starts it every hour. Its only task runs a notebook that uses Auto Loader with `cloudFiles.schemaEvolutionMode` set to `addNewColumns` and `trigger(availableNow=True)` to load JSON files into `proseware_prod.bronze.events`. The task has no retry policy.

        When a file brings a new column, the run fails, and the new column is loaded only by the next hourly run.

        You need the new columns to be loaded during the same run in which they are detected, without manual action. The solution must keep the hourly schedule and must not keep compute running between runs.

        What should you do?
      fr: |
        Proseware exécute un job Lakeflow nommé **proseware_events_hourly** sur un calcul de jobs classique, avec une planification qui le lance toutes les heures. Sa seule tâche exécute un notebook qui utilise Auto Loader avec `cloudFiles.schemaEvolutionMode` défini sur `addNewColumns` et `trigger(availableNow=True)` pour charger des fichiers JSON dans `proseware_prod.bronze.events`. La tâche n'a aucune stratégie de nouvelles tentatives.

        Quand un fichier apporte une nouvelle colonne, l'exécution échoue, et la nouvelle colonne n'est chargée que par l'exécution horaire suivante.

        Les nouvelles colonnes doivent être chargées pendant l'exécution même au cours de laquelle elles sont détectées, sans action manuelle. La solution doit conserver la planification horaire et ne doit pas laisser de calcul actif entre les exécutions.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace the hourly schedule with a continuous trigger on the job.", fr: "Remplacer la planification horaire par un déclencheur Continuous sur le job." } }
        - { id: b, text: { en: "Add a retry policy to the task, with at least one retry.", fr: "Ajouter à la tâche une stratégie de nouvelles tentatives, avec au moins une tentative." } }
        - { id: c, text: { en: "Set cloudFiles.schemaEvolutionMode to rescue in the notebook.", fr: "Définir cloudFiles.schemaEvolutionMode sur rescue dans le notebook." } }
        - { id: d, text: { en: "Repair each failed run of the job from its run details page.", fr: "Réparer chaque exécution en échec du job depuis sa page de détails." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In `addNewColumns` mode, Auto Loader stops the stream on purpose when it detects a new column, after updating the schema. A retry policy on the task restarts it in the same run, and the restarted stream reads with the new schema and loads the column. The hourly schedule stays in place, and the job cluster ends with the run.
        fr: |
          En mode `addNewColumns`, Auto Loader arrête volontairement le flux quand il détecte une nouvelle colonne, après avoir mis à jour le schéma. Une stratégie de nouvelles tentatives sur la tâche le redémarre dans la même exécution, et le flux redémarré lit avec le nouveau schéma et charge la colonne. La planification horaire est conservée, et le cluster de job s'arrête avec l'exécution.
      options:
        a: { en: "A continuous trigger would restart the stream, but it removes the hourly schedule and keeps a run, and its compute, always active.", fr: "Un déclencheur Continuous redémarrerait le flux, mais il supprime la planification horaire et garde une exécution, et son calcul, toujours actifs." }
        c: { en: "In rescue mode the schema doesn't evolve: the new fields go to the rescued data column instead of new columns.", fr: "En mode rescue, le schéma n'évolue pas : les nouveaux champs vont dans la colonne de données récupérées au lieu de nouvelles colonnes." }
        d: { en: "A repair run is a manual action after the run has failed; the requirement excludes manual action.", fr: "Une réparation est une action manuelle après l'échec de l'exécution ; l'exigence exclut toute action manuelle." }
    references:
      - title: Configure schema inference and evolution in Auto Loader - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/ingestion/cloud-object-storage/auto-loader/schema
      - title: Configure and edit tasks in Lakeflow Jobs - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-task

  # ------------------------------------------------------------------ 9
  - id: dp750-qz-42-09
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A Lakeflow job named **northwind_iot_rollup** has an Advanced schedule with the cron expression `0 0/10 * * * ?` and the time zone UTC. Max concurrent runs is 1, and the queue is enabled. Most runs take 6 minutes, but the run that starts at 10:00 takes 25 minutes.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un job Lakeflow nommé **northwind_iot_rollup** a une planification Advanced avec l'expression cron `0 0/10 * * * ?` et le fuseau horaire UTC. Max concurrent runs vaut 1, et la file d'attente est activée. La plupart des exécutions durent 6 minutes, mais l'exécution qui démarre à 10:00 dure 25 minutes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: The run scheduled at 10:10 is skipped because the 10:00 run is still active.
            fr: L'exécution planifiée à 10:10 est ignorée parce que l'exécution de 10:00 est encore active.
        - id: s2
          text:
            en: If a cloud issue delays the scheduler at 11:00, the 11:00 run starts as soon as the service is available again.
            fr: Si un problème cloud retarde le planificateur à 11:00, l'exécution de 11:00 démarre dès que le service est de nouveau disponible.
        - id: s3
          text:
            en: A run that waits in the queue is canceled if it hasn't started within 60 minutes.
            fr: Une exécution qui attend dans la file est annulée si elle n'a pas démarré dans les 60 minutes.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          When the job has reached Max concurrent runs, a new run is skipped only if queueing is disabled; here the 10:10 run is queued and starts when the 10:00 run ends. The scheduler isn't designed for low latency: network or cloud issues can delay runs by several minutes, and a delayed scheduled run starts as soon as the service is available. A queued run can wait up to 48 hours, not 60 minutes.
        fr: |
          Quand le job a atteint Max concurrent runs, une nouvelle exécution n'est ignorée que si la file d'attente est désactivée ; ici, l'exécution de 10:10 est mise en file et démarre à la fin de celle de 10:00. Le planificateur n'est pas conçu pour une faible latence : des problèmes réseau ou cloud peuvent retarder les exécutions de plusieurs minutes, et une exécution planifiée retardée démarre dès que le service est disponible. Une exécution en file peut attendre jusqu'à 48 heures, pas 60 minutes.
    references:
      - title: Run jobs on a schedule - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/scheduled
      - title: Configure and edit Lakeflow Jobs - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/configure-job

  # ------------------------------------------------------------------ 10
  - id: dp750-qz-42-10
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum's suppliers upload CSV files to a Unity Catalog external location named **ext_supplier_drop** at unpredictable times. Each upload is a batch of up to 300 files written over about three minutes, with less than 30 seconds between two files. The location already holds more than 40,000 files. You are the owner of ext_supplier_drop.

        The workspace already has 50 jobs that use file arrival triggers, and file events aren't enabled on any external location.

        A Lakeflow job named **adatum_supplier_load** must load the files into `adatum_prod.bronze.supplier_files` and meet the following requirements:

        - Start one run per batch, once the batch has finished arriving.
        - Process each file exactly once.
        - Don't pay for compute while no files arrive.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les fournisseurs d'Adatum chargent des fichiers CSV dans un emplacement externe Unity Catalog nommé **ext_supplier_drop** à des heures imprévisibles. Chaque chargement est un lot de 300 fichiers au plus, écrits en trois minutes environ, avec moins de 30 secondes entre deux fichiers. L'emplacement contient déjà plus de 40 000 fichiers. Vous êtes le propriétaire de ext_supplier_drop.

        L'espace de travail compte déjà 50 jobs qui utilisent des déclencheurs File arrival, et les événements de fichiers (file events) ne sont activés sur aucun emplacement externe.

        Un job Lakeflow nommé **adatum_supplier_load** doit charger les fichiers dans `adatum_prod.bronze.supplier_files` et répondre aux exigences suivantes :

        - Lancer une exécution par lot, une fois que le lot a fini d'arriver.
        - Traiter chaque fichier exactement une fois.
        - Ne pas payer de calcul tant qu'aucun fichier n'arrive.

        Quelles sont les trois actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Enable file events on ext_supplier_drop, then add a file arrival trigger on it.", fr: "Activer les événements de fichiers sur ext_supplier_drop, puis y ajouter un déclencheur File arrival." } }
        - { id: b, text: { en: "Set Minimum time between triggers in seconds of the trigger to 180.", fr: "Définir Minimum time between triggers in seconds du déclencheur sur 180." } }
        - { id: c, text: { en: "Set Wait after last change in seconds of the trigger to 60.", fr: "Définir Wait after last change in seconds du déclencheur sur 60." } }
        - { id: d, text: { en: "Set the path of the trigger to ext_supplier_drop/*.csv to ignore other files.", fr: "Définir le chemin du déclencheur sur ext_supplier_drop/*.csv pour ignorer les autres fichiers." } }
        - { id: e, text: { en: "In the task, read the files with Auto Loader and trigger(availableNow=True).", fr: "Dans la tâche, lire les fichiers avec Auto Loader et trigger(availableNow=True)." } }
        - { id: f, text: { en: "Replace the file arrival trigger with a continuous trigger on the job.", fr: "Remplacer le déclencheur File arrival par un déclencheur Continuous sur le job." } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          Without file events, at most 50 jobs per workspace can use file arrival triggers and the location can hold at most 10,000 files, so the new trigger needs file events, which the location owner can enable. Wait after last change resets its timer on each new file, so 60 seconds starts the run only after the last file of the batch. Auto Loader with `availableNow` processes only the files not yet loaded, exactly once, and then stops, so no compute runs between batches.
        fr: |
          Sans événements de fichiers, 50 jobs au plus par espace de travail peuvent utiliser des déclencheurs File arrival et l'emplacement contient au plus 10 000 fichiers : le nouveau déclencheur a besoin des événements de fichiers, que le propriétaire de l'emplacement peut activer. Wait after last change remet son minuteur à zéro à chaque nouveau fichier : 60 secondes lancent l'exécution seulement après le dernier fichier du lot. Auto Loader avec `availableNow` ne traite que les fichiers pas encore chargés, exactement une fois, puis s'arrête : aucun calcul ne tourne entre les lots.
      options:
        b: { en: "A minimum time between triggers is a cooldown: the first file of a batch can still start a run while the rest of the batch arrives.", fr: "Un temps minimum entre déclenchements est un temps de récupération : le premier fichier d'un lot peut toujours lancer une exécution pendant que le reste du lot arrive." }
        d: { en: "Trigger paths can't contain wildcards; the trigger monitors a root or subpath recursively.", fr: "Les chemins de déclencheur ne peuvent pas contenir de caractères génériques ; le déclencheur surveille une racine ou un sous-chemin de façon récursive." }
        f: { en: "A continuous trigger keeps a run, and its compute, always active, even when no files arrive.", fr: "Un déclencheur Continuous garde une exécution, et son calcul, toujours actifs, même quand aucun fichier n'arrive." }
    references:
      - title: Trigger jobs when new files arrive - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/jobs/file-arrival-triggers
