chapter: 22-governance
questions:
  # ------------------------------------------------------------------ 1
  - id: dp750-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        At Litware, data stewards tag the columns that contain personal data with the tag `pii`. Data consumers need a list of all the tagged columns of the Unity Catalog catalog **retail**, with the name of the table of each column.

        Which object should you query?
      fr: |
        Chez Litware, les gestionnaires de données balisent les colonnes qui contiennent des données personnelles avec la balise `pii`. Les consommateurs de données ont besoin de la liste de toutes les colonnes balisées du catalogue Unity Catalog **retail**, avec le nom de la table de chaque colonne.

        Quel objet devez-vous interroger ?
    body:
      options:
        - { id: a, text: "`retail.information_schema.table_tags`" }
        - { id: b, text: "`retail.information_schema.columns`" }
        - { id: c, text: "`system.access.column_lineage`" }
        - { id: d, text: "`retail.information_schema.column_tags`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `INFORMATION_SCHEMA.COLUMN_TAGS` returns one row per column tag, with the catalog, schema, table and column names and the tag name and value. Filtering on `tag_name = 'pii'` lists the tagged columns, and users see only the columns they have permission to interact with.
        fr: |
          `INFORMATION_SCHEMA.COLUMN_TAGS` renvoie une ligne par balise de colonne, avec les noms du catalogue, du schéma, de la table et de la colonne, et le nom et la valeur de la balise. Un filtre sur `tag_name = 'pii'` liste les colonnes balisées, et les utilisateurs ne voient que les colonnes avec lesquelles ils ont l'autorisation d'interagir.
      options:
        a: { en: "TABLE_TAGS holds the tags set on tables, not the tags set on their columns.", fr: "TABLE_TAGS contient les balises posées sur les tables, pas celles posées sur leurs colonnes." }
        b: { en: "COLUMNS describes the columns (type, comment...) but doesn't contain their tags.", fr: "COLUMNS décrit les colonnes (type, commentaire...) mais ne contient pas leurs balises." }
        c: { en: "The column lineage system table records how columns are derived from each other, not their tags.", fr: "La table système de lignée de colonne enregistre la façon dont les colonnes dérivent les unes des autres, pas leurs balises." }
    references:
      - title: COLUMN_TAGS - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/information-schema/column_tags

  # ------------------------------------------------------------------ 2
  - id: dp750-qz-22-02
    objective: "2.2.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure Databricks workspace named **dbw-prod** on the Premium plan. You have the Contributor role on dbw-prod.

        In the Azure portal, you open **Diagnostic settings** for dbw-prod and try to send the audit logs to a Log Analytics workspace. The portal reports that the subscription is not registered to use **microsoft.insights**.

        What should you do before you retry?
      fr: |
        Contoso dispose d'un espace de travail Azure Databricks nommé **dbw-prod** sur le plan Premium. Vous disposez du rôle Contributor sur dbw-prod.

        Dans le portail Azure, vous ouvrez **Diagnostic settings** pour dbw-prod et tentez d'envoyer les journaux d'audit vers un espace de travail Log Analytics. Le portail signale que l'abonnement n'est pas inscrit pour utiliser **microsoft.insights**.

        Que devez-vous faire avant de réessayer ?
    body:
      options:
        - { id: a, text: { en: "Turn on Verbose Audit Logs in the workspace admin settings.", fr: "Activer Verbose Audit Logs dans les paramètres d'administration de l'espace de travail." } }
        - { id: b, text: { en: "Register the microsoft.insights resource provider in the subscription.", fr: "Inscrire le fournisseur de ressources microsoft.insights dans l'abonnement." } }
        - { id: c, text: { en: "Ask for the Owner role on dbw-prod in place of Contributor.", fr: "Demander le rôle Owner sur dbw-prod à la place de Contributor." } }
        - { id: d, text: { en: "Grant yourself SELECT on the system.access.audit table.", fr: "Vous accorder SELECT sur la table system.access.audit." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Diagnostic settings depend on the microsoft.insights resource provider of Azure Monitor. When the subscription isn't registered for it, you register the provider, as the Azure diagnostics troubleshooting guidance describes, and then configure the diagnostic setting again.
        fr: |
          Les paramètres de diagnostic dépendent du fournisseur de ressources microsoft.insights d'Azure Monitor. Quand l'abonnement n'y est pas inscrit, vous inscrivez le fournisseur, comme le décrivent les instructions de dépannage des diagnostics Azure, puis vous configurez de nouveau le paramètre de diagnostic.
      options:
        a: { en: "Verbose audit logs add command text to the events; they don't register the subscription for diagnostic settings.", fr: "Les journaux d'audit détaillés ajoutent le texte des commandes aux événements ; ils n'inscrivent pas l'abonnement pour les paramètres de diagnostic." }
        c: { en: "Contributor is enough to configure diagnostic log delivery; the error is about the subscription, not your role.", fr: "Contributor suffit pour configurer la remise des journaux de diagnostic ; l'erreur porte sur l'abonnement, pas sur votre rôle." }
        d: { en: "The audit system table is a separate option; privileges on it don't affect Azure diagnostic settings.", fr: "La table système d'audit est une option distincte ; des privilèges sur elle n'ont aucun effet sur les paramètres de diagnostic Azure." }
    references:
      - title: Configure diagnostic log delivery - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery

  # ------------------------------------------------------------------ 3
  - id: dp750-qz-22-03
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A notebook at Fabrikam reads the Unity Catalog table **sales.silver.orders** with `spark.read.table()`. It computes a new column named risk_score from the amount and country columns by using a Python UDF, and it writes the result to the table **sales.gold.scored_orders**.

        You open the lineage graph of sales.gold.scored_orders in Catalog Explorer. What lineage do you find for risk_score?
      fr: |
        Un notebook de Fabrikam lit la table Unity Catalog **sales.silver.orders** avec `spark.read.table()`. Il calcule une nouvelle colonne nommée risk_score à partir des colonnes amount et country au moyen d'une UDF Python, et il écrit le résultat dans la table **sales.gold.scored_orders**.

        Vous ouvrez le graphe de lignée de sales.gold.scored_orders dans l'Explorateur de catalogues. Quelle lignée trouvez-vous pour risk_score ?
    body:
      options:
        - { id: a, text: { en: "Column lineage from amount and country of sales.silver.orders to risk_score", fr: "Une lignée de colonne depuis amount et country de sales.silver.orders vers risk_score" } }
        - { id: b, text: { en: "Table-level lineage from sales.silver.orders, without column lineage for risk_score", fr: "Une lignée au niveau de la table depuis sales.silver.orders, sans lignée de colonne pour risk_score" } }
        - { id: c, text: { en: "No lineage for sales.gold.scored_orders, because the notebook calls a UDF", fr: "Aucune lignée pour sales.gold.scored_orders, car le notebook appelle une UDF" } }
        - { id: d, text: { en: "Column lineage for risk_score after you enable UDF lineage in the workspace settings", fr: "Une lignée de colonne pour risk_score une fois la lignée des UDF activée dans les paramètres de l'espace de travail" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Unity Catalog captures lineage automatically for DataFrame and SQL queries on Unity Catalog tables, but a UDF gives table-level lineage only. The graph therefore links sales.silver.orders to sales.gold.scored_orders, while the column computed by the UDF has no column lineage.
        fr: |
          Unity Catalog capture automatiquement la lignée des requêtes DataFrame et SQL sur des tables Unity Catalog, mais une UDF ne donne qu'une lignée au niveau de la table. Le graphe relie donc sales.silver.orders à sales.gold.scored_orders, tandis que la colonne calculée par l'UDF n'a pas de lignée de colonne.
      options:
        a: { en: "Column-level lineage isn't captured through UDFs; only the table-level link is recorded.", fr: "La lignée au niveau des colonnes n'est pas capturée à travers les UDF ; seul le lien au niveau de la table est enregistré." }
        c: { en: "A UDF doesn't stop lineage capture: the table-level link between the two tables is still recorded.", fr: "Une UDF n'empêche pas la capture de la lignée : le lien au niveau de la table entre les deux tables est bien enregistré." }
        d: { en: "Lineage has no setting to enable, and no setting adds column-level lineage through UDFs.", fr: "La lignée n'a aucun paramètre à activer, et aucun paramètre n'ajoute de lignée de colonne à travers les UDF." }
    references:
      - title: Lineage in Unity Catalog - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/data-lineage

  # ------------------------------------------------------------------ 4
  - id: dp750-qz-22-04
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        At Adatum, a member of the group **data-eng** will create the new Unity Catalog table **sales.silver.leads**. data-eng has the usage privileges and CREATE TABLE on sales.silver, and the usage privileges on sales.gov.

        From the moment the table exists, members of the account group **sales-admins** must see all its rows, and other users only the rows where region is `EU`. The solution must follow the principle of least privilege.

        How should you complete the statements? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Chez Adatum, un membre du groupe **data-eng** va créer la nouvelle table Unity Catalog **sales.silver.leads**. data-eng dispose des privilèges d'utilisation et de CREATE TABLE sur sales.silver, et des privilèges d'utilisation sur sales.gov.

        Dès que la table existe, les membres du groupe de compte **sales-admins** doivent voir toutes ses lignes, et les autres utilisateurs uniquement les lignes dont region vaut `EU`. La solution doit respecter le principe du moindre privilège.

        Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        -- Run by the owner of the function
        CREATE FUNCTION sales.gov.eu_rows(region STRING)
        RETURN [[expr]];

        GRANT [[priv]] ON FUNCTION sales.gov.eu_rows TO `data-eng`;

        -- Run by a member of data-eng
        CREATE TABLE sales.silver.leads (lead_id BIGINT, region STRING)
          [[clause]] sales.gov.eu_rows ON (region);
      slots:
        - id: expr
          options:
            - { id: or, text: "is_account_group_member('sales-admins') OR region = 'EU'" }
            - { id: and, text: "is_account_group_member('sales-admins') AND region = 'EU'" }
            - { id: case, text: "CASE WHEN is_account_group_member('sales-admins') THEN region ELSE NULL END" }
        - id: priv
          options:
            - { id: execute, text: EXECUTE }
            - { id: manage, text: MANAGE }
            - { id: select, text: SELECT }
        - id: clause
          options:
            - { id: with, text: WITH ROW FILTER }
            - { id: set, text: SET ROW FILTER }
            - { id: mask, text: MASK }
    answer:
      values: { expr: or, priv: execute, clause: with }
    explanation:
      correct:
        en: |
          A row filter function returns a BOOLEAN, and a row is kept when it returns TRUE: the OR expression keeps every row for sales-admins and the EU rows for the others. Assigning the function needs EXECUTE on it, plus the usage privileges and CREATE TABLE for a new table. `WITH ROW FILTER` in `CREATE TABLE` attaches the filter at creation, so the table is never readable unfiltered.
        fr: |
          Une fonction de filtre de lignes renvoie un BOOLEAN, et une ligne est conservée quand elle renvoie TRUE : l'expression OR conserve toutes les lignes pour sales-admins et les lignes EU pour les autres. Attribuer la fonction exige EXECUTE sur celle-ci, plus les privilèges d'utilisation et CREATE TABLE pour une nouvelle table. `WITH ROW FILTER` dans `CREATE TABLE` attache le filtre dès la création ; la table n'est donc jamais lisible sans filtre.
      options:
        and: { en: "With AND, sales-admins would also see only the EU rows, and other users would see none.", fr: "Avec AND, sales-admins ne verrait lui aussi que les lignes EU, et les autres utilisateurs n'en verraient aucune." }
        case: { en: "This expression returns a STRING, like a mask; a row filter function must return a BOOLEAN.", fr: "Cette expression renvoie un STRING, comme un masque ; une fonction de filtre de lignes doit renvoyer un BOOLEAN." }
        manage: { en: "MANAGE on a function allows granting and dropping it, which is more than using it in a filter.", fr: "MANAGE sur une fonction permet d'accorder des privilèges dessus et de la supprimer, ce qui dépasse son utilisation dans un filtre." }
        select: { en: "SELECT applies to tables and views; a function is assigned with EXECUTE.", fr: "SELECT s'applique aux tables et aux vues ; une fonction s'attribue avec EXECUTE." }
        set: { en: "`SET ROW FILTER` is the ALTER TABLE syntax for an existing table, not a CREATE TABLE clause.", fr: "`SET ROW FILTER` est la syntaxe d'ALTER TABLE pour une table existante, pas une clause de CREATE TABLE." }
        mask: { en: "`MASK` attaches a column mask to a column definition; it doesn't filter rows.", fr: "`MASK` attache un masque de colonne à une définition de colonne ; il ne filtre pas les lignes." }
    references:
      - title: ROW FILTER clause - Azure Databricks - Databricks SQL
        url: https://learn.microsoft.com/en-us/azure/databricks/sql/language-manual/sql-ref-syntax-ddl-row-filter

  # ------------------------------------------------------------------ 5
  - id: dp750-qz-22-05
    objective: "2.2.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has two Azure Databricks workspaces, **dbw-sales** and **dbw-finance**, attached to the same Unity Catalog metastore. The catalog **sales** is accessible from both workspaces.

        Members of the account group **fin-analysts** work in dbw-finance and must query the table **sales.gold.revenue** in read-only mode. The solution must not copy data and must minimize administrative effort.

        What should you do?
      fr: |
        Contoso dispose de deux espaces de travail Azure Databricks, **dbw-sales** et **dbw-finance**, attachés au même metastore Unity Catalog. Le catalogue **sales** est accessible depuis les deux espaces de travail.

        Les membres du groupe de compte **fin-analysts** travaillent dans dbw-finance et doivent interroger la table **sales.gold.revenue** en lecture seule. La solution ne doit pas copier de données et doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add the table to a share, and grant the share to a Databricks-to-Databricks recipient for the metastore.", fr: "Ajouter la table à un partage, puis accorder le partage à un destinataire Databricks-to-Databricks pour le metastore." } }
        - { id: b, text: { en: "Add the table to a share, and send an activation link to fin-analysts through an open sharing recipient.", fr: "Ajouter la table à un partage, puis envoyer un lien d'activation à fin-analysts par un destinataire de partage ouvert." } }
        - { id: c, text: { en: "Grant fin-analysts USE CATALOG on sales, USE SCHEMA on sales.gold, and SELECT on the table.", fr: "Accorder à fin-analysts USE CATALOG sur sales, USE SCHEMA sur sales.gold et SELECT sur la table." } }
        - { id: d, text: { en: "Create a deep clone of the table in a catalog of dbw-finance, and grant fin-analysts SELECT on it.", fr: "Créer un clone profond de la table dans un catalogue de dbw-finance, puis accorder SELECT dessus à fin-analysts." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Workspaces attached to the same metastore share its catalogs, so Unity Catalog privileges manage access across them: no Delta Sharing is needed. The three grants give read access to the table, and SELECT alone doesn't allow any change to the data.
        fr: |
          Les espaces de travail attachés au même metastore partagent ses catalogues ; les privilèges Unity Catalog gèrent donc l'accès de l'un à l'autre, sans partage Delta. Les trois privilèges donnent l'accès en lecture à la table, et SELECT seul ne permet aucune modification des données.
      options:
        a: { en: "Databricks-to-Databricks sharing targets a different metastore; within one metastore, grants are enough.", fr: "Le partage Databricks-to-Databricks vise un autre metastore ; dans un même metastore, des privilèges suffisent." }
        b: { en: "Open sharing serves recipients outside Databricks and adds token management that isn't needed here.", fr: "Le partage ouvert sert des destinataires hors Databricks et ajoute une gestion de jetons inutile ici." }
        d: { en: "A deep clone copies the data, which the requirements forbid, and must then be kept up to date.", fr: "Un clone profond copie les données, ce que les exigences interdisent, et doit ensuite être tenu à jour." }
    references:
      - title: What is OpenSharing? - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/delta-sharing/

  # ------------------------------------------------------------------ 6
  - id: dp750-qz-22-06
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a Unity Catalog managed table named **finance.gold.journal** with the default retention settings. Predictive optimization runs VACUUM on the table.

        A new data retention policy states the following requirements:

        - Auditors must be able to time travel to any version of the last 45 days.
        - DESCRIBE HISTORY must return the operations of the last 365 days.
        - Storage costs must be minimized.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'une table managée Unity Catalog nommée **finance.gold.journal** avec les paramètres de rétention par défaut. L'optimisation prédictive exécute VACUUM sur la table.

        Une nouvelle stratégie de rétention des données énonce les exigences suivantes :

        - Les auditeurs doivent pouvoir voyager dans le temps vers n'importe quelle version des 45 derniers jours.
        - DESCRIBE HISTORY doit renvoyer les opérations des 365 derniers jours.
        - Les coûts de stockage doivent être réduits au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set delta.deletedFileRetentionDuration to 45 days, and keep the default delta.logRetentionDuration.", fr: "Définir delta.deletedFileRetentionDuration sur 45 jours et conserver la valeur par défaut de delta.logRetentionDuration." } }
        - { id: b, text: { en: "Set delta.deletedFileRetentionDuration to 45 days and delta.logRetentionDuration to 365 days.", fr: "Définir delta.deletedFileRetentionDuration sur 45 jours et delta.logRetentionDuration sur 365 jours." } }
        - { id: c, text: { en: "Set delta.deletedFileRetentionDuration to 365 days and delta.logRetentionDuration to 45 days.", fr: "Définir delta.deletedFileRetentionDuration sur 365 jours et delta.logRetentionDuration sur 45 jours." } }
        - { id: d, text: { en: "Set delta.deletedFileRetentionDuration to 365 days and delta.logRetentionDuration to 365 days.", fr: "Définir delta.deletedFileRetentionDuration sur 365 jours et delta.logRetentionDuration sur 365 jours." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          deletedFileRetentionDuration sets how long VACUUM keeps unreferenced data files, so it sets how far back time travel works: 45 days meets the auditors' need without keeping older files. logRetentionDuration sets how long the table history is kept, so it must be 365 days. On Unity Catalog managed tables, logRetentionDuration must also be greater than or equal to deletedFileRetentionDuration, which 365 and 45 respect.
        fr: |
          deletedFileRetentionDuration fixe la durée pendant laquelle VACUUM conserve les fichiers de données non référencés, donc la profondeur du voyage dans le temps : 45 jours répondent au besoin des auditeurs sans garder de fichiers plus anciens. logRetentionDuration fixe la durée de conservation de l'historique de la table ; elle doit donc valoir 365 jours. Sur les tables managées Unity Catalog, logRetentionDuration doit aussi être supérieure ou égale à deletedFileRetentionDuration, ce que 365 et 45 respectent.
      options:
        a: { en: "The default log retention of 30 days keeps only 30 days of history, and it would be shorter than the 45-day file retention, which managed tables don't allow.", fr: "La rétention par défaut du journal, 30 jours, ne garde que 30 jours d'historique, et elle serait inférieure à la rétention de fichiers de 45 jours, ce que les tables managées n'autorisent pas." }
        c: { en: "The history would cover only 45 days, and the log retention can't be shorter than the file retention on managed tables.", fr: "L'historique ne couvrirait que 45 jours, et la rétention du journal ne peut pas être inférieure à la rétention des fichiers sur les tables managées." }
        d: { en: "Keeping unreferenced data files for 365 days meets the requirements but raises storage costs far beyond the 45 days required.", fr: "Conserver les fichiers de données non référencés pendant 365 jours répond aux exigences, mais augmente les coûts de stockage bien au-delà des 45 jours exigés." }
    references:
      - title: Work with table history - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/delta/history

  # ------------------------------------------------------------------ 7
  - id: dp750-qz-22-07
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum attaches the following policy to the Unity Catalog catalog **ins_prod**. The ssn columns of the tables are tagged with the governed tag `pii` = `ssn`.

        ```text
        CREATE POLICY mask_ssn
        ON CATALOG ins_prod
        COLUMN MASK ins_prod.gov.mask_ssn
        TO `account users`
        EXCEPT `sp-dr`
        FOR TABLES
        MATCH COLUMNS has_tag_value('pii', 'ssn') AS ssn
        ON COLUMN ssn;
        ```

        No other policy, row filter or column mask exists in ins_prod. A disaster recovery job runs as the service principal **sp-dr**, which has the privileges required to read the tables of ins_prod and to create tables in the catalog **ins_dr**.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum attache la stratégie suivante au catalogue Unity Catalog **ins_prod**. Les colonnes ssn des tables sont balisées avec la balise gouvernée `pii` = `ssn`.

        ```text
        CREATE POLICY mask_ssn
        ON CATALOG ins_prod
        COLUMN MASK ins_prod.gov.mask_ssn
        TO `account users`
        EXCEPT `sp-dr`
        FOR TABLES
        MATCH COLUMNS has_tag_value('pii', 'ssn') AS ssn
        ON COLUMN ssn;
        ```

        Aucune autre stratégie, aucun filtre de lignes et aucun masque de colonne n'existe dans ins_prod. Un job de reprise d'activité s'exécute en tant que principal de service **sp-dr**, qui dispose des privilèges nécessaires pour lire les tables d'ins_prod et pour créer des tables dans le catalogue **ins_dr**.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The job running as sp-dr can create a deep clone of ins_prod.claims.people in the ins_dr catalog.", fr: "Le job qui s'exécute en tant que sp-dr peut créer un clone profond d'ins_prod.claims.people dans le catalogue ins_dr." }
        - id: s2
          text: { en: "An analyst who queries ins_prod.claims.people from standard compute on Databricks Runtime 16.4 LTS sees masked ssn values.", fr: "Un analyste qui interroge ins_prod.claims.people depuis un calcul standard sous Databricks Runtime 16.4 LTS voit des valeurs ssn masquées." }
        - id: s3
          text: { en: "The owner of ins_prod.claims.people can show the real ssn values to all users by running ALTER TABLE ... ALTER COLUMN ssn DROP MASK.", fr: "Le propriétaire d'ins_prod.claims.people peut montrer les vraies valeurs ssn à tous les utilisateurs en exécutant ALTER TABLE ... ALTER COLUMN ssn DROP MASK." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Clones aren't supported on tables under ABAC policies, except when they are run by a principal listed in the EXCEPT clause of every applicable policy, which sp-dr is. Standard compute on Databricks Runtime 16.4 or above can read ABAC-secured tables, and the analyst, a member of account users, gets the mask. Table owners can't override or remove ABAC policies: DROP MASK removes only a table-level mask.
        fr: |
          Les clones ne sont pas pris en charge sur les tables soumises à des stratégies ABAC, sauf s'ils sont exécutés par un principal listé dans la clause EXCEPT de chaque stratégie applicable, ce qui est le cas de sp-dr. Le calcul standard sous Databricks Runtime 16.4 ou ultérieur peut lire les tables sécurisées par ABAC, et l'analyste, membre d'account users, reçoit le masque. Les propriétaires de tables ne peuvent ni contourner ni supprimer les stratégies ABAC : DROP MASK ne retire qu'un masque au niveau de la table.
      options:
        s3: { en: "The mask comes from a catalog-level policy, which the table owner can neither override nor remove.", fr: "Le masque vient d'une stratégie au niveau du catalogue, que le propriétaire de la table ne peut ni contourner ni supprimer." }
    references:
      - title: Requirements, quotas, and limitations for row filter and column mask policies - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/abac/requirements
      - title: Row filters and column masks - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/filters-and-masks/

  # ------------------------------------------------------------------ 8
  - id: dp750-qz-22-08
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware protects the ssn column of the Unity Catalog table **hr.core.employees** with a table-level column mask that shows the real values only to the group **hr-admins**. The ssn column is also tagged with the governed tag `pii` = `ssn`.

        A payroll provider that uses Azure Databricks in another account must receive this table through Delta Sharing, with the real ssn values. The share is owned by the group **share-admins**. All other internal users must keep seeing masked ssn values.

        What should you do?
      fr: |
        Proseware protège la colonne ssn de la table Unity Catalog **hr.core.employees** avec un masque de colonne au niveau de la table qui ne montre les vraies valeurs qu'au groupe **hr-admins**. La colonne ssn est également balisée avec la balise gouvernée `pii` = `ssn`.

        Un prestataire de paie qui utilise Azure Databricks dans un autre compte doit recevoir cette table par le partage Delta, avec les vraies valeurs ssn. Le propriétaire du partage est le groupe **share-admins**. Tous les autres utilisateurs internes doivent continuer à voir des valeurs ssn masquées.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the table-level mask, and add hr.core.employees to the share so that the recipient reads the unmasked values.", fr: "Conserver le masque au niveau de la table, puis ajouter hr.core.employees au partage pour que le destinataire lise les valeurs non masquées." } }
        - { id: b, text: { en: "Keep the table-level mask, and add the whole hr.core schema to the share so that it includes hr.core.employees.", fr: "Conserver le masque au niveau de la table, puis ajouter tout le schéma hr.core au partage pour qu'il inclue hr.core.employees." } }
        - { id: c, text: { en: "Replace the mask with a pii = ssn mask policy for account users except hr-admins, then share the table.", fr: "Remplacer le masque par une stratégie de masque pii = ssn pour account users sauf hr-admins, puis partager la table." } }
        - { id: d, text: { en: "Replace the mask with a pii = ssn mask policy for account users except hr-admins and share-admins, then share the table.", fr: "Remplacer le masque par une stratégie de masque pii = ssn pour account users sauf hr-admins et share-admins, puis partager la table." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A table with a table-level row filter or column mask can't be shared. A table under ABAC policies can be shared when the share owner is in the EXCEPT clause of the policies, and the policies then don't govern the recipient, who reads the real values. Internal users other than hr-admins and share-admins keep getting the mask.
        fr: |
          Une table dotée d'un filtre de lignes ou d'un masque de colonne au niveau de la table ne peut pas être partagée. Une table soumise à des stratégies ABAC peut l'être quand le propriétaire du partage figure dans la clause EXCEPT des stratégies ; celles-ci ne régissent alors pas le destinataire, qui lit les vraies valeurs. Les utilisateurs internes autres que hr-admins et share-admins continuent de recevoir le masque.
      options:
        a: { en: "Tables with table-level row filters or column masks can't be added to a share.", fr: "Les tables dotées de filtres de lignes ou de masques de colonne au niveau de la table ne peuvent pas être ajoutées à un partage." }
        b: { en: "Schema sharing filters out the tables that have row filters or column masks, so hr.core.employees wouldn't be shared.", fr: "Le partage de schéma exclut les tables dotées de filtres de lignes ou de masques de colonne ; hr.core.employees ne serait donc pas partagée." }
        c: { en: "A table under an ABAC policy can be shared only if the share owner, share-admins, is in the EXCEPT clause.", fr: "Une table soumise à une stratégie ABAC ne peut être partagée que si le propriétaire du partage, share-admins, figure dans la clause EXCEPT." }
    references:
      - title: Create shares for OpenSharing - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/delta-sharing/create-share
      - title: Requirements, quotas, and limitations for row filter and column mask policies - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/data-governance/unity-catalog/abac/requirements

  # ------------------------------------------------------------------ 9
  - id: dp750-qz-22-09
    objective: "2.2.7"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin Toys shares the table **sales.gold.orders**, partitioned by region, with a retailer named Wingtip by using open sharing. The recipient **wingtip** authenticates with a bearer token. The security team lists four requirements. Each requirement must be met by a single setting, without creating any table or view.

        Which setting should you use for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys partage la table **sales.gold.orders**, partitionnée par region, avec un détaillant nommé Wingtip par le partage ouvert. Le destinataire **wingtip** s'authentifie avec un jeton du porteur. L'équipe de sécurité liste quatre exigences. Chaque exigence doit être satisfaite par un seul paramètre, sans créer de table ni de vue.

        Quel paramètre devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: partition, text: { en: "A PARTITION clause in ALTER SHARE ... ADD TABLE", fr: "Une clause PARTITION dans ALTER SHARE ... ADD TABLE" } }
        - { id: alias, text: { en: "An AS clause in ALTER SHARE ... ADD TABLE", fr: "Une clause AS dans ALTER SHARE ... ADD TABLE" } }
        - { id: nohist, text: { en: "WITHOUT HISTORY in ALTER SHARE ... ADD TABLE", fr: "WITHOUT HISTORY dans ALTER SHARE ... ADD TABLE" } }
        - { id: ipacl, text: { en: "An IP access list on the recipient", fr: "Une liste d'accès IP sur le destinataire" } }
        - { id: rotate, text: { en: "A token rotation with an expiration of 0 seconds", fr: "Une rotation du jeton avec une expiration de 0 seconde" } }
        - { id: cdf, text: { en: "The change data feed enabled on the table", fr: "Le flux de données modifiées activé sur la table" } }
      targets:
        - id: rows
          text: { en: "Wingtip receives only the rows of the region EMEA.", fr: "Wingtip ne reçoit que les lignes de la région EMEA." }
        - id: name
          text: { en: "Wingtip doesn't learn the catalog, schema and table names used internally.", fr: "Wingtip ne découvre pas les noms de catalogue, de schéma et de table utilisés en interne." }
        - id: version
          text: { en: "Wingtip can query only the current version of the data, without time travel or streaming reads.", fr: "Wingtip ne peut interroger que la version courante des données, sans voyage dans le temps ni lectures en streaming." }
        - id: network
          text: { en: "Wingtip can call the sharing server only from its corporate public IP ranges.", fr: "Wingtip ne peut appeler le serveur de partage que depuis ses plages d'adresses IP publiques d'entreprise." }
    answer:
      mapping: { rows: partition, name: alias, version: nohist, network: ipacl }
    explanation:
      correct:
        en: |
          A PARTITION clause shares only the matching partitions of a partitioned table, and an AS alias replaces the real name: recipients can't use the actual table name. WITHOUT HISTORY limits the recipient to the current version, whereas WITH HISTORY, the default on recent runtimes, enables time travel and streaming reads. An IP access list restricts the IP addresses from which an open sharing recipient reaches the sharing server, its activation link and its credential file.
        fr: |
          Une clause PARTITION ne partage que les partitions correspondantes d'une table partitionnée, et un alias AS remplace le vrai nom : les destinataires ne peuvent pas utiliser le nom réel de la table. WITHOUT HISTORY limite le destinataire à la version courante, alors que WITH HISTORY, la valeur par défaut des runtimes récents, permet le voyage dans le temps et les lectures en streaming. Une liste d'accès IP limite les adresses IP depuis lesquelles un destinataire de partage ouvert atteint le serveur de partage, son lien d'activation et son fichier d'informations d'identification.
      options:
        rotate: { en: "Rotating with 0 seconds expires the current token at once; it answers a leaked credential, not a network restriction.", fr: "Une rotation avec 0 seconde fait expirer le jeton courant immédiatement ; elle répond à une information d'identification divulguée, pas à une restriction réseau." }
        cdf: { en: "The change data feed adds row-level change history for recipients; it doesn't restrict what they see.", fr: "Le flux de données modifiées ajoute un historique des modifications ligne par ligne pour les destinataires ; il ne restreint pas ce qu'ils voient." }
    references:
      - title: Create shares for OpenSharing - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/delta-sharing/create-share
      - title: Restrict OpenSharing recipient access using IP access lists (Databricks-to-Open sharing) - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/delta-sharing/access-list

  # ------------------------------------------------------------------ 10
  - id: dp750-qz-22-10
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has two Azure Databricks workspaces on the Premium plan:

        - **dbw-weu**, in West Europe, attached to the West Europe Unity Catalog metastore
        - **dbw-eus**, in East US, attached to the East US Unity Catalog metastore

        The account group **compliance** has USE CATALOG on the system catalog and USE SCHEMA and SELECT on system.access in the West Europe metastore only. Its members query **system.access.audit** from a SQL warehouse in dbw-weu and find no Unity Catalog event of dbw-eus.

        You need the compliance team to review the Unity Catalog audit events of dbw-eus in the audit system table. The solution must follow the principle of least privilege.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose de deux espaces de travail Azure Databricks sur le plan Premium :

        - **dbw-weu**, en Europe Ouest, attaché au metastore Unity Catalog d'Europe Ouest
        - **dbw-eus**, dans l'Est des États-Unis, attaché au metastore Unity Catalog de l'Est des États-Unis

        Le groupe de compte **compliance** dispose de USE CATALOG sur le catalogue system, et de USE SCHEMA et SELECT sur system.access, dans le metastore d'Europe Ouest uniquement. Ses membres interrogent **system.access.audit** depuis un entrepôt SQL de dbw-weu et n'y trouvent aucun événement Unity Catalog de dbw-eus.

        Vous devez permettre à l'équipe de conformité d'examiner les événements d'audit Unity Catalog de dbw-eus dans la table système d'audit. La solution doit respecter le principe du moindre privilège.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "In the East US metastore, grant compliance USE CATALOG on system, and USE SCHEMA and SELECT on system.access.", fr: "Dans le metastore de l'Est des États-Unis, accorder à compliance USE CATALOG sur system, et USE SCHEMA et SELECT sur system.access." } }
        - { id: b, text: { en: "Have the compliance team run its queries on system.access.audit from a SQL warehouse in dbw-eus.", fr: "Faire exécuter par l'équipe de conformité ses requêtes sur system.access.audit depuis un entrepôt SQL de dbw-eus." } }
        - { id: c, text: { en: "Turn on Verbose Audit Logs in the workspace admin settings of dbw-eus.", fr: "Activer Verbose Audit Logs dans les paramètres d'administration de l'espace de travail de dbw-eus." } }
        - { id: d, text: { en: "Add a diagnostic setting on dbw-eus that sends the unityCatalog category to the system.access schema.", fr: "Ajouter sur dbw-eus un paramètre de diagnostic qui envoie la catégorie unityCatalog vers le schéma system.access." } }
        - { id: e, text: { en: "Assign the account admin role to the compliance group so that it sees the events of every region.", fr: "Attribuer le rôle d'administrateur de compte au groupe compliance pour qu'il voie les événements de toutes les régions." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Most audit events are available only in the region of the workspace that produced them, so the events of dbw-eus must be read from compute in East US, through the system catalog of the East US metastore. Privileges are granted per metastore, so the compliance group needs USE CATALOG on system and USE SCHEMA and SELECT on system.access in that metastore too.
        fr: |
          La plupart des événements d'audit ne sont disponibles que dans la région de l'espace de travail qui les a produits ; les événements de dbw-eus doivent donc être lus depuis un calcul situé dans l'Est des États-Unis, par le catalogue system du metastore de cette région. Les privilèges s'accordent par metastore ; le groupe compliance a donc aussi besoin de USE CATALOG sur system, et de USE SCHEMA et SELECT sur system.access, dans ce metastore.
      options:
        c: { en: "Verbose audit logs add command text to the events of a workspace; they don't make events visible in another region.", fr: "Les journaux d'audit détaillés ajoutent le texte des commandes aux événements d'un espace de travail ; ils ne rendent pas les événements visibles dans une autre région." }
        d: { en: "Diagnostic settings send logs to Log Analytics, a storage account or an event hub, not to a Unity Catalog system schema.", fr: "Les paramètres de diagnostic envoient les journaux vers Log Analytics, un compte de stockage ou un hub d'événements, pas vers un schéma système Unity Catalog." }
        e: { en: "The account admin role is far broader than reading audit events, and it doesn't remove the regional availability of the events.", fr: "Le rôle d'administrateur de compte est bien plus large que la lecture des événements d'audit, et il ne supprime pas la disponibilité régionale des événements." }
    references:
      - title: Audit log system table reference - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/admin/system-tables/audit-logs
      - title: Configure diagnostic log delivery - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/audit-log-delivery
