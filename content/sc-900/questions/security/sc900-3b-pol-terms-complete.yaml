id: sc900-3b-pol-terms-complete
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Defender for Cloud, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur Microsoft Defender pour le cloud, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[rule]] is a rule about a specific security condition that you want controlled.

      [[group]] is a collection of such rules grouped toward a specific goal.

      [[result]] is presented when an assessment finds resources that do not comply with a rule.
    fr: |
      [[rule]] est une règle sur une condition de sécurité précise que vous voulez contrôler.

      [[group]] est un ensemble de telles règles regroupées dans un but précis.

      [[result]] est présentée lorsqu'une évaluation trouve des ressources qui ne respectent pas une règle.
  slots:
    - id: rule
      options:
        - { id: def, text: { en: "An Azure Policy definition", fr: "Une définition Azure Policy" } }
        - { id: init, text: { en: "A security initiative", fr: "Une initiative de sécurité" } }
        - { id: rec, text: { en: "A security recommendation", fr: "Une recommandation de sécurité" } }
        - { id: alert, text: { en: "A security alert", fr: "Une alerte de sécurité" } }
    - id: group
      options:
        - { id: def, text: { en: "An Azure Policy definition", fr: "Une définition Azure Policy" } }
        - { id: init, text: { en: "A security initiative", fr: "Une initiative de sécurité" } }
        - { id: rec, text: { en: "A security recommendation", fr: "Une recommandation de sécurité" } }
        - { id: alert, text: { en: "A security alert", fr: "Une alerte de sécurité" } }
    - id: result
      options:
        - { id: def, text: { en: "An Azure Policy definition", fr: "Une définition Azure Policy" } }
        - { id: init, text: { en: "A security initiative", fr: "Une initiative de sécurité" } }
        - { id: rec, text: { en: "A security recommendation", fr: "Une recommandation de sécurité" } }
        - { id: alert, text: { en: "A security alert", fr: "Une alerte de sécurité" } }
answer:
  values: { rule: def, group: init, result: rec }
explanation:
  correct:
    en: "An Azure Policy definition is a rule about a specific security condition that you want controlled. A security initiative is a collection of policy definitions grouped toward a specific goal, such as the Microsoft cloud security benchmark. When a policy finds noncompliant resources, the finding is presented as a security recommendation with remediation steps."
    fr: "Une définition Azure Policy est une règle sur une condition de sécurité précise que vous voulez contrôler. Une initiative de sécurité est un ensemble de définitions de stratégie regroupées dans un but précis, comme le benchmark de sécurité cloud Microsoft. Quand une stratégie trouve des ressources non conformes, le résultat est présenté sous la forme d'une recommandation de sécurité accompagnée d'étapes de correction."
  options:
    alert:
      en: "A security alert is raised by a Defender plan when a threat is detected; it is not the result of a compliance assessment."
      fr: "Une alerte de sécurité est émise par un plan Defender quand une menace est détectée ; ce n'est pas le résultat d'une évaluation de conformité."
references:
  - title: Describe how security policies, standards, and recommendations improve cloud security posture
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure
