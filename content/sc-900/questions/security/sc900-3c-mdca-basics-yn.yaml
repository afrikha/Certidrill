id: sc900-3c-mdca-basics-yn
objective: "3.4.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender for Cloud Apps, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender pour les applications cloud, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Defender for Cloud Apps protects only the SaaS applications that Microsoft publishes."
        fr: "Microsoft Defender pour les applications cloud protège uniquement les applications SaaS éditées par Microsoft."
    - id: s2
      text:
        en: "The features of Microsoft Defender for Cloud Apps are found under the Cloud apps node of the Microsoft Defender portal."
        fr: "Les fonctionnalités de Microsoft Defender pour les applications cloud se trouvent sous le nœud Applications cloud (Cloud apps) du portail Microsoft Defender."
    - id: s3
      text:
        en: "Microsoft Defender for Cloud Apps assesses the risk of the cloud apps that it discovers."
        fr: "Microsoft Defender pour les applications cloud évalue le risque des applications cloud qu'il découvre."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Defender for Cloud Apps is a cross-SaaS solution: it discovers and protects apps from many vendors, and its app governance covers OAuth apps registered with Microsoft Entra ID, Google and Salesforce. It is accessed through the Cloud apps node of the Microsoft Defender portal. Each app that cloud discovery identifies is assessed against more than 90 risk indicators."
    fr: "Defender pour les applications cloud couvre l'ensemble des applications SaaS : il découvre et protège les applications de nombreux éditeurs, et sa gouvernance des applications couvre les applications OAuth inscrites auprès de Microsoft Entra ID, de Google et de Salesforce. Il est accessible sous le nœud Applications cloud du portail Microsoft Defender. Chaque application identifiée par la découverte du cloud est évaluée selon plus de 90 indicateurs de risque."
references:
  - title: Describe Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/5-describe-microsoft-cloud-app-security
