id: sc900-3d-ti-standalone-converged
objective: "3.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The standalone Microsoft Defender Threat Intelligence (Defender TI) product has been retired.

    Into which products have its capabilities converged?
  fr: |
    Le produit autonome Microsoft Defender Threat Intelligence (Defender TI) a été mis hors service.

    Vers quels produits ses fonctionnalités ont-elles convergé ?
body:
  options:
    - id: a
      text: { en: "Microsoft Defender for Cloud and Azure Monitor", fr: "Microsoft Defender pour le cloud et Azure Monitor" }
    - id: b
      text: { en: "Microsoft Defender XDR and Microsoft Sentinel", fr: "Microsoft Defender XDR et Microsoft Sentinel" }
    - id: c
      text: { en: "Microsoft Entra ID Protection and Microsoft Defender for Identity", fr: "Microsoft Entra ID Protection et Microsoft Defender pour Identity" }
    - id: d
      text: { en: "Microsoft Purview and the Service Trust Portal", fr: "Microsoft Purview et le Portail d'approbation des services" }
answer: { optionId: b }
explanation:
  correct:
    en: "The standalone Defender TI product was retired on August 1, 2026. Its threat intelligence capabilities converged into Microsoft Defender XDR and Microsoft Sentinel, where they are used directly in the Microsoft Defender portal, under Threat intelligence."
    fr: "Le produit autonome Defender TI a été mis hors service le 1er août 2026. Ses fonctionnalités de renseignement sur les menaces ont convergé vers Microsoft Defender XDR et Microsoft Sentinel, où elles s'utilisent directement dans le portail Microsoft Defender, sous Threat Intelligence."
  options:
    a:
      en: "Defender for Cloud protects cloud resources and Azure Monitor collects telemetry; neither received the Defender TI capabilities."
      fr: "Defender pour le cloud protège les ressources cloud et Azure Monitor collecte la télémétrie ; aucun des deux n'a reçu les fonctionnalités de Defender TI."
    c:
      en: "These two services protect identities; threat intelligence is not delivered through them."
      fr: "Ces deux services protègent les identités ; le renseignement sur les menaces n'est pas fourni par eux."
    d:
      en: "Microsoft Purview covers compliance and data protection, and the Service Trust Portal publishes audit reports about Microsoft cloud services."
      fr: "Microsoft Purview couvre la conformité et la protection des données, et le Portail d'approbation des services publie des rapports d'audit sur les services cloud de Microsoft."
references:
  - title: Describe Microsoft Defender Threat Intelligence
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6b-describe-defender-threat-intelligence
  - title: Use Intel explorer in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-intelligence-explorer
