id: sc900-3c-siem-enrichment
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An analyst at Litware opens an alert in the company's SIEM and SOAR platform. Threat intelligence about the source IP address, the history of the user account and the compliance status of the device have already been added to the alert by the platform.

    Which capability does this describe?
  fr: |
    Un analyste de Litware ouvre une alerte dans la plateforme SIEM et SOAR de l'entreprise. La plateforme a déjà ajouté à l'alerte du renseignement sur les menaces concernant l'adresse IP source, l'historique du compte d'utilisateur et l'état de conformité de l'appareil.

    De quelle fonctionnalité s'agit-il ?
body:
  options:
    - id: a
      text: { en: "Log aggregation", fr: "L'agrégation de journaux" }
    - id: b
      text: { en: "Severity scoring", fr: "L'attribution d'un niveau de gravité" }
    - id: c
      text: { en: "Automatic enrichment", fr: "L'enrichissement automatique" }
    - id: d
      text: { en: "Incident grouping", fr: "Le regroupement en incidents" }
answer: { optionId: c }
explanation:
  correct:
    en: "Automatic enrichment adds context to an alert before an analyst looks at it: threat intelligence, user account history, device compliance status, location data. With incident grouping and severity scoring, it is one of the ways modern SIEM and SOAR platforms reduce alert fatigue, because the analyst no longer gathers that context by hand."
    fr: "L'enrichissement automatique ajoute du contexte à une alerte avant qu'un analyste ne la consulte : renseignement sur les menaces, historique du compte d'utilisateur, état de conformité de l'appareil, données de localisation. Avec le regroupement en incidents et l'attribution d'un niveau de gravité, c'est l'un des moyens par lesquels les plateformes SIEM et SOAR modernes réduisent la fatigue des alertes, car l'analyste ne rassemble plus ce contexte à la main."
  options:
    a:
      en: "Log aggregation gathers raw logs and events from many sources into one platform; it happens before any alert exists."
      fr: "L'agrégation de journaux rassemble dans une seule plateforme les journaux et les événements bruts de nombreuses sources ; elle a lieu avant qu'une alerte n'existe."
    b:
      en: "Severity scoring assigns a level such as low, medium or high to an alert; it ranks the alert, it does not attach context to it."
      fr: "L'attribution d'un niveau de gravité donne à une alerte un niveau comme faible, moyen ou élevé ; elle classe l'alerte, elle n'y attache pas de contexte."
    d:
      en: "Incident grouping consolidates related alerts from different sources into one incident; the scenario describes context added to a single alert."
      fr: "Le regroupement en incidents réunit en un seul incident les alertes liées venues de sources différentes ; le scénario décrit du contexte ajouté à une seule alerte."
references:
  - title: Define the concepts of SIEM and SOAR
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar
