id: sc900-3c-sentinel-hunting
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security analysts of Woodgrove Bank want to search the data in Microsoft Sentinel for suspicious activity that has not triggered any alert.

    Which Microsoft Sentinel capability should the analysts use?
  fr: |
    Les analystes de sécurité de Woodgrove Bank veulent rechercher, dans les données de Microsoft Sentinel, des activités suspectes qui n'ont déclenché aucune alerte.

    Quelle fonctionnalité de Microsoft Sentinel les analystes doivent-ils utiliser ?
body:
  options:
    - id: a
      text: { en: "Analytics rules", fr: "Les règles d'analyse" }
    - id: b
      text: { en: "Data connectors", fr: "Les connecteurs de données" }
    - id: c
      text: { en: "Automation rules", fr: "Les règles d'automatisation" }
    - id: d
      text: { en: "Hunting", fr: "Le repérage (hunting)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Hunting is the proactive side of Microsoft Sentinel: analysts run hunting queries across the data to find threats before an alert is triggered. When a query reveals something significant, it can be turned into a detection rule so that the same activity raises alerts in the future."
    fr: "Le repérage est le côté proactif de Microsoft Sentinel : les analystes exécutent des requêtes de repérage sur les données pour trouver les menaces avant qu'une alerte ne soit déclenchée. Quand une requête révèle un élément important, elle peut être transformée en règle de détection pour que la même activité émette des alertes à l'avenir."
  options:
    a:
      en: "Analytics rules run regularly and generate alerts; the analysts are looking for activity that no rule has caught."
      fr: "Les règles d'analyse s'exécutent régulièrement et émettent des alertes ; les analystes cherchent une activité qu'aucune règle n'a détectée."
    b:
      en: "Data connectors bring data into Sentinel; they do not search it."
      fr: "Les connecteurs de données font entrer les données dans Sentinel ; ils ne les explorent pas."
    c:
      en: "Automation rules act on incidents that already exist; they do not look for undetected activity."
      fr: "Les règles d'automatisation agissent sur des incidents qui existent déjà ; elles ne recherchent pas d'activité non détectée."
references:
  - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management
  - title: What is Microsoft Sentinel security information and event management (SIEM)?
    url: https://learn.microsoft.com/en-us/azure/sentinel/overview
