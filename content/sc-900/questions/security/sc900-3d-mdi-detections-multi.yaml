id: sc900-3d-mdi-detections-multi
objective: "3.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two activities can Microsoft Defender for Identity detect?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux activités que Microsoft Defender pour Identity peut détecter ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A malicious macro in a document attached to an email message", fr: "Une macro malveillante dans un document joint à un e-mail" }
    - id: b
      text: { en: "An attacker who moves laterally toward a domain administrator account", fr: "Un attaquant qui se déplace latéralement vers un compte d'administrateur du domaine" }
    - id: c
      text: { en: "An employee who uploads files to an unsanctioned cloud storage app", fr: "Un employé qui charge des fichiers dans une application de stockage cloud non approuvée" }
    - id: d
      text: { en: "A laptop that runs a software version with a known vulnerability", fr: "Un ordinateur portable qui exécute une version de logiciel présentant une vulnérabilité connue" }
    - id: e
      text: { en: "An attempt to list the group memberships of an Active Directory domain", fr: "Une tentative d'énumération des appartenances aux groupes d'un domaine Active Directory" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Defender for Identity follows identity-based attacks along the kill chain. Enumerating users, groups and resources is reconnaissance, and progressing through the network toward sensitive accounts such as domain administrators is lateral movement. Both are detected from the signals that the sensors collect on the identity servers."
    fr: "Defender pour Identity suit les attaques fondées sur l'identité tout au long de la chaîne d'attaque. L'énumération des utilisateurs, des groupes et des ressources relève de la reconnaissance, et la progression dans le réseau vers des comptes sensibles comme les administrateurs du domaine relève du mouvement latéral. Les deux sont détectés à partir des signaux que les capteurs collectent sur les serveurs d'identité."
  options:
    a:
      en: "Malicious content in email attachments is detected by Microsoft Defender for Office 365."
      fr: "Le contenu malveillant des pièces jointes des e-mails est détecté par Microsoft Defender pour Office 365."
    c:
      en: "The use of unsanctioned cloud apps (shadow IT) is revealed by Microsoft Defender for Cloud Apps."
      fr: "L'utilisation d'applications cloud non approuvées (informatique fantôme) est révélée par Microsoft Defender pour les applications cloud."
    d:
      en: "Vulnerable software on devices is found by Microsoft Defender Vulnerability Management."
      fr: "Les logiciels vulnérables sur les appareils sont trouvés par la Gestion des vulnérabilités Microsoft Defender."
references:
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
  - title: Microsoft Defender for Identity overview
    url: https://learn.microsoft.com/en-us/defender-for-identity/what-is
