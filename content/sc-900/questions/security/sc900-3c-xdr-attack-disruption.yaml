id: sc900-3c-xdr-attack-disruption
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    While a ransomware attack is still in progress at Adatum, Microsoft Defender XDR identifies the devices and the accounts that the attacker controls and contains them in real time, which stops the attack from spreading.

    Which Microsoft Defender XDR capability does this describe?
  fr: |
    Alors qu'une attaque par rançongiciel est encore en cours chez Adatum, Microsoft Defender XDR identifie les appareils et les comptes que l'attaquant contrôle et les contient en temps réel, ce qui empêche l'attaque de se propager.

    De quelle fonctionnalité de Microsoft Defender XDR s'agit-il ?
body:
  options:
    - id: a
      text: { en: "Self-healing", fr: "L'autoréparation" }
    - id: b
      text: { en: "Automatic attack disruption", fr: "L'interruption automatique des attaques" }
    - id: c
      text: { en: "Cross-product threat hunting", fr: "Le repérage des menaces dans tous les produits" }
    - id: d
      text: { en: "Combined incidents queue", fr: "La file d'attente d'incidents combinée" }
answer: { optionId: b }
explanation:
  correct:
    en: "Automatic attack disruption correlates high-fidelity signals from the suite into one high-confidence incident, identifies the assets under the attacker's control and contains them while the attack is under way, for example by isolating a device or disabling an account. Its goal is to limit lateral movement early, without waiting for a human."
    fr: "L'interruption automatique des attaques corrèle des signaux de haute fidélité de la suite en un seul incident de haute fiabilité, identifie les ressources contrôlées par l'attaquant et les contient pendant que l'attaque se déroule, par exemple en isolant un appareil ou en désactivant un compte. Son but est de limiter tôt le mouvement latéral, sans attendre une intervention humaine."
  options:
    a:
      en: "Self-healing returns affected devices, identities and mailboxes to a secure state by automatic remediation; it repairs the damage rather than containing an attack in progress."
      fr: "L'autoréparation remet dans un état sûr les appareils, les identités et les boîtes aux lettres touchés, par une correction automatique ; elle répare les dégâts au lieu de contenir une attaque en cours."
    c:
      en: "Cross-product threat hunting lets analysts query raw data with their own queries; it is a manual, proactive search, not an automatic containment."
      fr: "Le repérage des menaces dans tous les produits permet aux analystes d'interroger les données brutes avec leurs propres requêtes ; c'est une recherche manuelle et proactive, pas un endiguement automatique."
    d:
      en: "The combined incidents queue groups related alerts and assets so that analysts see the whole attack; it shows the attack, it does not contain it."
      fr: "La file d'attente d'incidents combinée regroupe les alertes et les ressources liées pour que les analystes voient toute l'attaque ; elle montre l'attaque, elle ne la contient pas."
references:
  - title: Describe Microsoft Defender XDR services
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services
  - title: Automatic attack disruption in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/automatic-attack-disruption
