id: sc900-3b-mdc-solution-type
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which type of solution is Microsoft Defender for Cloud?
  fr: |
    Quel type de solution est Microsoft Defender pour le cloud ?
body:
  options:
    - id: a
      text: { en: "A security information and event management (SIEM) solution", fr: "Une solution de gestion des informations et des événements de sécurité (SIEM)" }
    - id: b
      text: { en: "A cloud access security broker (CASB)", fr: "Un broker de sécurité d'accès au cloud (CASB)" }
    - id: c
      text: { en: "A cloud-native application protection platform (CNAPP)", fr: "Une plateforme de protection des applications cloud natives (CNAPP)" }
    - id: d
      text: { en: "An identity provider (IdP)", fr: "Un fournisseur d'identité (IdP)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft Defender for Cloud is a cloud-native application protection platform (CNAPP): a set of security measures and practices that protect cloud-based applications from cyberthreats and vulnerabilities. It combines DevSecOps, cloud security posture management (CSPM) and a cloud workload protection platform (CWPP)."
    fr: "Microsoft Defender pour le cloud est une plateforme de protection des applications cloud natives (CNAPP) : un ensemble de mesures et de pratiques de sécurité qui protègent les applications cloud contre les cybermenaces et les vulnérabilités. Il réunit le DevSecOps, la gestion de la posture de sécurité cloud (CSPM) et une plateforme de protection des charges de travail cloud (CWPP)."
  options:
    a:
      en: "The SIEM solution of Microsoft is Microsoft Sentinel, which collects and correlates security data from many sources."
      fr: "La solution SIEM de Microsoft est Microsoft Sentinel, qui collecte et met en corrélation des données de sécurité issues de nombreuses sources."
    b:
      en: "The cloud access security broker role is played by Microsoft Defender for Cloud Apps, which protects the use of SaaS applications."
      fr: "Le rôle de broker de sécurité d'accès au cloud est tenu par Microsoft Defender pour les applications cloud, qui protège l'utilisation des applications SaaS."
    d:
      en: "The identity provider of Microsoft is Microsoft Entra ID."
      fr: "Le fournisseur d'identité de Microsoft est Microsoft Entra ID."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
  - title: What is Microsoft Defender for Cloud?
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
