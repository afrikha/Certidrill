id: sc900-3b-pol-posture-cycle
objective: "3.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company enables Microsoft Defender for Cloud on a new Azure subscription that contains a storage account open to public network access.

    Which four events occur in sequence until the security posture of the subscription improves? To answer, move the appropriate events from the list of events to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise active Microsoft Defender pour le cloud sur un nouvel abonnement Azure qui contient un compte de stockage ouvert à l'accès réseau public.

    Quels sont les quatre événements qui se succèdent jusqu'à ce que la posture de sécurité de l'abonnement s'améliore ? Pour répondre, déplacez les événements appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: fix, text: { en: "An administrator applies the remediation steps to the storage account.", fr: "Un administrateur applique les étapes de correction au compte de stockage." } }
    - { id: rec, text: { en: "A security recommendation is presented for the storage account.", fr: "Une recommandation de sécurité est présentée pour le compte de stockage." } }
    - { id: alert, text: { en: "A Defender plan raises a security alert for the storage account.", fr: "Un plan Defender émet une alerte de sécurité pour le compte de stockage." } }
    - { id: assign, text: { en: "The Microsoft cloud security benchmark is assigned to the subscription.", fr: "Le benchmark de sécurité cloud Microsoft est attribué à l'abonnement." } }
    - { id: stp, text: { en: "An auditor downloads a report from the Service Trust Portal.", fr: "Un auditeur télécharge un rapport depuis le Portail d'approbation des services." } }
    - { id: assess, text: { en: "The resources are assessed against the policies of the benchmark.", fr: "Les ressources sont évaluées par rapport aux stratégies du benchmark." } }
answer:
  sequence: [ assign, assess, rec, fix ]
explanation:
  correct:
    en: |
      Policies, standards and recommendations work as a cycle. The Microsoft cloud security benchmark is assigned automatically when Defender for Cloud is first enabled; the resources are then assessed against its policies; a policy that finds a noncompliant resource is presented as a recommendation with remediation steps; applying these steps removes the weakness and improves the posture.
    fr: |
      Les stratégies, les normes et les recommandations forment un cycle. Le benchmark de sécurité cloud Microsoft est attribué automatiquement à la première activation de Defender pour le cloud ; les ressources sont ensuite évaluées par rapport à ses stratégies ; une stratégie qui trouve une ressource non conforme est présentée sous la forme d'une recommandation avec des étapes de correction ; appliquer ces étapes supprime la faiblesse et améliore la posture.
  options:
    alert: { en: "A security alert reports a detected threat. Here nothing attacks the storage account: its configuration is the issue, and that is handled by a recommendation.", fr: "Une alerte de sécurité signale une menace détectée. Ici, rien n'attaque le compte de stockage : c'est sa configuration qui pose problème, ce que traite une recommandation." }
    stp: { en: "The Service Trust Portal publishes audit reports about Microsoft cloud services; it plays no part in assessing or hardening your resources.", fr: "Le Portail d'approbation des services publie des rapports d'audit sur les services cloud de Microsoft ; il n'intervient pas dans l'évaluation ni le renforcement de vos ressources." }
references:
  - title: Describe how security policies, standards, and recommendations improve cloud security posture
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure
  - title: Secure score in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
