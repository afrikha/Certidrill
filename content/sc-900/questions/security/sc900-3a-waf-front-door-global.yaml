id: sc900-3a-waf-front-door-global
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs a web application in several Azure regions for customers around the world. Proseware wants a web application firewall that stops malicious requests at the edge of the Microsoft network, close to their source, with the same protection for all regions.

    With which service should Proseware deploy Azure Web Application Firewall?
  fr: |
    Proseware exécute une application web dans plusieurs régions Azure pour des clients du monde entier. Proseware veut un pare-feu d'applications web qui arrête les requêtes malveillantes à la périphérie du réseau Microsoft, près de leur source, avec la même protection pour toutes les régions.

    Avec quel service Proseware doit-elle déployer Azure Web Application Firewall ?
body:
  options:
    - id: a
      text: "Azure Application Gateway"
    - id: b
      text: "Azure Front Door"
    - id: c
      text: { en: "Azure Firewall", fr: "Le Pare-feu Azure" }
    - id: d
      text: "Azure DDoS Protection"
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Web Application Firewall isn't used alone: it is deployed with another service. On Azure Front Door, the global application delivery platform of Microsoft, it gives global protection: requests are inspected at the network edge, and attacks are blocked close to their source before they reach the infrastructure of the application."
    fr: "Azure Web Application Firewall ne s'utilise pas seul : il se déploie avec un autre service. Sur Azure Front Door, la plateforme mondiale de distribution d'applications de Microsoft, il apporte une protection mondiale : les requêtes sont inspectées à la périphérie du réseau, et les attaques sont bloquées près de leur source avant d'atteindre l'infrastructure de l'application."
  options:
    a:
      en: "WAF on Azure Application Gateway gives regional protection to the applications behind the gateway; it suits an application hosted in a single region."
      fr: "WAF sur Azure Application Gateway apporte une protection régionale aux applications situées derrière la passerelle ; il convient à une application hébergée dans une seule région."
    c:
      en: "Azure Firewall is a separate network firewall for virtual networks; Azure Web Application Firewall isn't deployed with it."
      fr: "Le Pare-feu Azure est un pare-feu réseau distinct, destiné aux réseaux virtuels ; Azure Web Application Firewall ne se déploie pas avec lui."
    d:
      en: "Azure DDoS Protection complements a web application firewall at layers 3 and 4, but it doesn't host one."
      fr: "Azure DDoS Protection complète un pare-feu d'applications web aux couches 3 et 4, mais il n'en héberge pas."
references:
  - title: Describe Web Application Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/4-describe-web-application-firewall
  - title: What Is Azure Web Application Firewall on Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview
