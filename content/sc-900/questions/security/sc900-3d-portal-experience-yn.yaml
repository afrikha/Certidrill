id: sc900-3d-portal-experience-yn
objective: "3.4.8"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about the Microsoft Defender portal, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le portail Microsoft Defender, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "To access the Microsoft Defender portal, a user must be assigned an appropriate role, such as Security Reader."
        fr: "Pour accéder au portail Microsoft Defender, un utilisateur doit se voir attribuer un rôle approprié, comme Security Reader."
    - id: s2
      text:
        en: "Incidents from Microsoft Sentinel and incidents from Microsoft Defender XDR can appear in the same incident queue of the Microsoft Defender portal."
        fr: "Les incidents de Microsoft Sentinel et ceux de Microsoft Defender XDR peuvent apparaître dans la même file d'attente d'incidents du portail Microsoft Defender."
    - id: s3
      text:
        en: "When an administrator customizes the navigation pane of the Microsoft Defender portal, the change applies to the other administrators of the organization."
        fr: "Quand un administrateur personnalise le volet de navigation du portail Microsoft Defender, la modification s'applique aux autres administrateurs de l'organisation."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Access to the portal requires an appropriate Microsoft Entra role, such as Global Reader, Security Reader, Security Operator or Security Administrator. Because the portal is a unified platform, its incident queue shows the incidents of the Microsoft Defender XDR solutions together with those of Microsoft Sentinel. The customization of the navigation pane, which shows or hides functions and services, is specific to each user: other admins do not see it."
    fr: "L'accès au portail exige un rôle Microsoft Entra approprié, comme Global Reader, Security Reader, Security Operator ou Security Administrator. Comme le portail est une plateforme unifiée, sa file d'attente d'incidents présente les incidents des solutions Microsoft Defender XDR avec ceux de Microsoft Sentinel. La personnalisation du volet de navigation, qui affiche ou masque des fonctions et des services, est propre à chaque utilisateur : les autres administrateurs ne la voient pas."
references:
  - title: Describe the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/7-describe-microsoft-defender-portal
  - title: Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/overview-defender-portal
