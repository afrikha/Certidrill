id: sc900-3d-portal-advanced-hunting
objective: "3.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An analyst at Litware wants to write queries that explore up to 30 days of raw data in the Microsoft Defender portal, in order to proactively look for signs of a threat.

    Which feature should the analyst use?
  fr: |
    Un analyste de Litware veut écrire des requêtes qui explorent jusqu'à 30 jours de données brutes dans le portail Microsoft Defender, afin de rechercher de manière proactive les signes d'une menace.

    Quelle fonctionnalité l'analyste doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "Threat analytics", fr: "L'analyse des menaces (threat analytics)" }
    - id: b
      text: { en: "Action center", fr: "Le Centre de notifications (Action center)" }
    - id: c
      text: { en: "Advanced hunting", fr: "Le repérage avancé (advanced hunting)" }
    - id: d
      text: { en: "Submissions", fr: "Les soumissions (Submissions)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Advanced hunting is the query-based threat hunting tool of the Microsoft Defender portal. It explores up to 30 days of raw data to locate threat indicators and entities, with queries written in Kusto Query Language or built with a guided query builder."
    fr: "Le repérage avancé est l'outil de repérage des menaces par requêtes du portail Microsoft Defender. Il explore jusqu'à 30 jours de données brutes pour localiser des indicateurs de menace et des entités, avec des requêtes écrites en langage de requête Kusto ou construites avec un générateur de requêtes guidé."
  options:
    a:
      en: "Threat analytics provides reports written by Microsoft security researchers; the analyst does not query raw data there."
      fr: "L'analyse des menaces fournit des rapports rédigés par les chercheurs en sécurité de Microsoft ; l'analyste n'y interroge pas de données brutes."
    b:
      en: "The Action center lists pending and completed remediation actions; it is not a query tool."
      fr: "Le Centre de notifications liste les actions de correction en attente et terminées ; ce n'est pas un outil de requête."
    d:
      en: "Submissions is where admins send messages, URLs and attachments to Microsoft for analysis."
      fr: "Les soumissions permettent aux administrateurs d'envoyer des messages, des URL et des pièces jointes à Microsoft pour analyse."
references:
  - title: Proactively hunt for threats with advanced hunting in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-overview
  - title: Describe the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/7-describe-microsoft-defender-portal
