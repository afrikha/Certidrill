id: sc900-3a-waf-layer
objective: "3.1.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    At which layer of the OSI model does Azure Web Application Firewall protect web applications?
  fr: |
    À quelle couche du modèle OSI Azure Web Application Firewall protège-t-il les applications web ?
body:
  options:
    - id: a
      text: { en: "Layer 2 (data link)", fr: "Couche 2 (liaison de données)" }
    - id: b
      text: { en: "Layer 3 (network)", fr: "Couche 3 (réseau)" }
    - id: c
      text: { en: "Layer 4 (transport)", fr: "Couche 4 (transport)" }
    - id: d
      text: { en: "Layer 7 (application)", fr: "Couche 7 (application)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Web Application Firewall works at layer 7, the application layer: it inspects the HTTP and HTTPS requests sent to web applications. This is why it complements Azure DDoS Protection, which covers layers 3 and 4."
    fr: "Azure Web Application Firewall travaille à la couche 7, la couche application : il inspecte les requêtes HTTP et HTTPS envoyées aux applications web. C'est pourquoi il complète Azure DDoS Protection, qui couvre les couches 3 et 4."
  options:
    a:
      en: "The data link layer handles the transfer of frames between neighbouring devices; a web application firewall doesn't work there."
      fr: "La couche liaison de données gère le transfert de trames entre équipements voisins ; un pare-feu d'applications web n'y intervient pas."
    b:
      en: "The network layer is one of the two layers covered by Azure DDoS Protection, and network security groups filter there by IP address."
      fr: "La couche réseau est l'une des deux couches couvertes par Azure DDoS Protection, et les groupes de sécurité réseau y filtrent par adresse IP."
    c:
      en: "The transport layer is covered by Azure DDoS Protection and by network security groups, which filter by port and protocol."
      fr: "La couche transport est couverte par Azure DDoS Protection et par les groupes de sécurité réseau, qui filtrent par port et protocole."
references:
  - title: Describe Web Application Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/4-describe-web-application-firewall
  - title: Azure DDoS Protection Overview
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
