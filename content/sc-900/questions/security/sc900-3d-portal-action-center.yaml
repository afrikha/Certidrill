id: sc900-3d-portal-action-center
objective: "3.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After several automated investigations, a security operator at Adatum wants to review, in one location, the pending and completed remediation actions for devices, email content and identities.

    Which feature of the Microsoft Defender portal should the operator use?
  fr: |
    Après plusieurs investigations automatisées, un opérateur de sécurité d'Adatum veut passer en revue, à un seul endroit, les actions de correction en attente et terminées pour les appareils, le contenu des e-mails et les identités.

    Quelle fonctionnalité du portail Microsoft Defender l'opérateur doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "Reports", fr: "Les rapports (Reports)" }
    - id: b
      text: { en: "Submissions", fr: "Les soumissions (Submissions)" }
    - id: c
      text: { en: "Advanced hunting", fr: "Le repérage avancé (advanced hunting)" }
    - id: d
      text: { en: "Action center", fr: "Le Centre de notifications (Action center)" }
answer: { optionId: d }
explanation:
  correct:
    en: "The unified Action center, under Investigation & response, brings together the remediation actions of Microsoft Defender for Endpoint and Microsoft Defender for Office 365. It shows in a single list the actions that are pending, for example those that wait for approval, and the actions that are completed, for devices, email and collaboration content, and identities."
    fr: "Le Centre de notifications unifié, sous Investigation et réponse, rassemble les actions de correction de Microsoft Defender pour point de terminaison et de Microsoft Defender pour Office 365. Il présente dans une seule liste les actions en attente, par exemple celles qui attendent une approbation, et les actions terminées, pour les appareils, le contenu d'e-mail et de collaboration, et les identités."
  options:
    a:
      en: "Reports give statistics and trends on the security of the organization; they do not list the remediation actions to review."
      fr: "Les rapports donnent des statistiques et des tendances sur la sécurité de l'organisation ; ils ne listent pas les actions de correction à passer en revue."
    b:
      en: "Submissions is used to send suspicious messages, URLs and attachments to Microsoft for analysis."
      fr: "Les soumissions servent à envoyer à Microsoft des messages, des URL et des pièces jointes suspects pour analyse."
    c:
      en: "Advanced hunting queries raw data to find threats; it is not the list of remediation actions."
      fr: "Le repérage avancé interroge les données brutes pour trouver des menaces ; ce n'est pas la liste des actions de correction."
references:
  - title: Describe the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/7-describe-microsoft-defender-portal
  - title: Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/overview-defender-portal
