id: sc900-3d-mdvm-capabilities-yn
objective: "3.4.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender Vulnerability Management, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la Gestion des vulnérabilités Microsoft Defender, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Defender Vulnerability Management can measure the compliance of devices against security benchmarks such as those of the Center for Internet Security (CIS)."
        fr: "La Gestion des vulnérabilités Microsoft Defender peut mesurer la conformité des appareils par rapport à des benchmarks de sécurité comme ceux du Center for Internet Security (CIS)."
    - id: s2
      text:
        en: "Microsoft Defender Vulnerability Management detects risk on a device only while the device is connected to the corporate network."
        fr: "La Gestion des vulnérabilités Microsoft Defender détecte les risques sur un appareil uniquement pendant que celui-ci est connecté au réseau de l'entreprise."
    - id: s3
      text:
        en: "Microsoft Defender Vulnerability Management can block a vulnerable application for specific groups of devices."
        fr: "La Gestion des vulnérabilités Microsoft Defender peut bloquer une application vulnérable pour des groupes d'appareils précis."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Security baselines assessment uses customizable profiles to measure compliance against benchmarks such as CIS and STIG. Built-in and agentless scanners keep monitoring and detecting risk even when devices are not connected to the corporate network. Among the remediation capabilities, vulnerable applications can be blocked for chosen device groups."
    fr: "L'évaluation des bases de référence de sécurité utilise des profils personnalisables pour mesurer la conformité par rapport à des benchmarks comme CIS et STIG. Des analyseurs intégrés et sans agent continuent de surveiller et de détecter les risques même quand les appareils ne sont pas connectés au réseau de l'entreprise. Parmi les fonctionnalités de correction, les applications vulnérables peuvent être bloquées pour des groupes d'appareils choisis."
references:
  - title: Describe Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6a-describe-defender-vulnerability-management
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
