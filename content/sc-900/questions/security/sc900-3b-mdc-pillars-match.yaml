id: sc900-3b-mdc-pillars-match
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the corresponding capability of Microsoft Defender for Cloud.

    To answer, drag the appropriate capability to each description. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la fonctionnalité correspondante de Microsoft Defender pour le cloud.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque description. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cspm, text: { en: "Cloud security posture management (CSPM)", fr: "Gestion de la posture de sécurité cloud (CSPM)" } }
    - { id: cwpp, text: { en: "Cloud workload protection platform (CWPP)", fr: "Plateforme de protection des charges de travail cloud (CWPP)" } }
    - { id: dev, text: "DevSecOps" }
    - { id: siem, text: { en: "Security information and event management (SIEM)", fr: "Gestion des informations et des événements de sécurité (SIEM)" } }
  targets:
    - id: t1
      text: { en: "Provides specific protections for servers, containers, storage and databases", fr: "Fournit des protections propres aux serveurs, aux conteneurs, au stockage et aux bases de données" }
    - id: t2
      text: { en: "Unifies security management at the code level across several pipelines", fr: "Unifie la gestion de la sécurité au niveau du code dans plusieurs pipelines" }
    - id: t3
      text: { en: "Continuously assesses resources and surfaces actions that prevent breaches", fr: "Évalue les ressources en continu et fait ressortir les actions qui évitent les violations" }
answer:
  mapping: { t1: cwpp, t2: dev, t3: cspm }
explanation:
  correct:
    en: "Defender for Cloud organizes its capabilities into three pillars. The cloud workload protection platform brings protections specific to servers, containers, storage, databases and other workloads. DevSecOps unifies security management at the code level across multicloud and multiple-pipeline environments. Cloud security posture management continuously assesses the systems and surfaces the actions that prevent breaches."
    fr: "Defender pour le cloud organise ses fonctionnalités en trois piliers. La plateforme de protection des charges de travail cloud apporte des protections propres aux serveurs, aux conteneurs, au stockage, aux bases de données et à d'autres charges de travail. Le DevSecOps unifie la gestion de la sécurité au niveau du code dans des environnements multicloud et multi-pipelines. La gestion de la posture de sécurité cloud évalue les systèmes en continu et fait ressortir les actions qui évitent les violations."
  options:
    siem:
      en: "SIEM, the collection and correlation of security data from many sources, is the role of Microsoft Sentinel, not a pillar of Defender for Cloud."
      fr: "Le SIEM, c'est-à-dire la collecte et la mise en corrélation de données de sécurité issues de nombreuses sources, est le rôle de Microsoft Sentinel et non un pilier de Defender pour le cloud."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
