id: sc900-3a-fw-features-match
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the Azure Firewall feature that it describes.

    To answer, drag the appropriate feature to each description. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la fonctionnalité du Pare-feu Azure qu'elle décrit.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque description. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: snat, text: { en: "Source network address translation (SNAT)", fr: "Traduction d'adresses réseau sources (SNAT)" } }
    - { id: dnat, text: { en: "Destination network address translation (DNAT)", fr: "Traduction d'adresses réseau de destination (DNAT)" } }
    - { id: ti, text: { en: "Threat intelligence-based filtering", fr: "Filtrage basé sur le renseignement sur les menaces" } }
    - { id: fqdn, text: { en: "Application-level filtering", fr: "Filtrage au niveau de l'application" } }
    - { id: ha, text: { en: "Built-in high availability", fr: "Haute disponibilité intégrée" } }
  targets:
    - id: t1
      text:
        en: "Lets traffic that comes from the internet reach a resource of a virtual network that has only a private IP address"
        fr: "Permet au trafic venant d'internet d'atteindre une ressource d'un réseau virtuel qui n'a qu'une adresse IP privée"
    - id: t2
      text:
        en: "Alerts on, and can deny, traffic to or from IP addresses and domains that are known to be malicious"
        fr: "Signale, et peut refuser, le trafic depuis ou vers des adresses IP et des domaines connus pour être malveillants"
    - id: t3
      text:
        en: "Lets the resources of a virtual network reach internet destinations behind an Azure public IP address"
        fr: "Permet aux ressources d'un réseau virtuel d'atteindre des destinations sur internet derrière une adresse IP publique Azure"
answer:
  mapping: { t1: dnat, t2: ti, t3: snat }
explanation:
  correct:
    en: "DNAT translates a public IP address of the firewall to the private IP address of a resource, so that traffic that originates from the internet can reach it. SNAT translates the private IP address of a resource to an Azure public IP address, so that the resource can reach internet destinations. Threat intelligence relies on the Microsoft threat intelligence feed to alert on, and optionally deny, traffic to or from known malicious IP addresses and domains."
    fr: "La DNAT traduit une adresse IP publique du pare-feu en l'adresse IP privée d'une ressource, pour que le trafic provenant d'internet puisse l'atteindre. La SNAT traduit l'adresse IP privée d'une ressource en une adresse IP publique Azure, pour que la ressource puisse atteindre des destinations sur internet. Le renseignement sur les menaces s'appuie sur le flux de renseignement sur les menaces de Microsoft pour signaler, et éventuellement refuser, le trafic depuis ou vers des adresses IP et des domaines malveillants connus."
  options:
    fqdn:
      en: "Application-level filtering controls access to fully qualified domain names over protocols such as HTTP and HTTPS; it doesn't translate addresses and doesn't use a list of malicious sources."
      fr: "Le filtrage au niveau de l'application contrôle l'accès à des noms de domaine complets sur des protocoles comme HTTP et HTTPS ; il ne traduit pas d'adresses et n'utilise pas de liste de sources malveillantes."
    ha:
      en: "Built-in high availability keeps the firewall running during failures; it isn't a filtering or translation feature."
      fr: "La haute disponibilité intégrée maintient le pare-feu en service pendant les pannes ; ce n'est pas une fonctionnalité de filtrage ni de traduction."
references:
  - title: Describe Azure Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall
  - title: Azure Firewall features by SKU
    url: https://learn.microsoft.com/en-us/azure/firewall/features
