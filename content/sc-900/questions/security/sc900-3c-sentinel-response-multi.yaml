id: sc900-3c-sentinel-response-multi
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Microsoft Sentinel. Each new high-severity incident must be assigned to an analyst automatically, and the user account involved must be disabled by a workflow, without manual intervention.

    Which two Microsoft Sentinel features should Contoso use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise Microsoft Sentinel. Chaque nouvel incident de gravité élevée doit être attribué automatiquement à un analyste, et le compte d'utilisateur impliqué doit être désactivé par un flux de travail, sans intervention manuelle.

    Quelles sont les deux fonctionnalités de Microsoft Sentinel que Contoso doit utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Workbooks", fr: "Les classeurs (workbooks)" }
    - id: b
      text: { en: "Automation rules", fr: "Les règles d'automatisation" }
    - id: c
      text: { en: "Hunting queries", fr: "Les requêtes de repérage" }
    - id: d
      text: { en: "Data connectors", fr: "Les connecteurs de données" }
    - id: e
      text: { en: "Playbooks", fr: "Les playbooks" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Automation rules manage incident handling centrally: with a condition such as the severity, a rule can assign the incident to an analyst and trigger a playbook. The playbook is the workflow, built on Azure Logic Apps, that carries out remediation actions such as disabling the account."
    fr: "Les règles d'automatisation gèrent le traitement des incidents de façon centralisée : avec une condition comme la gravité, une règle peut attribuer l'incident à un analyste et déclencher un playbook. Le playbook est le flux de travail, construit sur Azure Logic Apps, qui exécute les actions de correction comme la désactivation du compte."
  options:
    a:
      en: "Workbooks visualize data in reports; they neither assign incidents nor act on accounts."
      fr: "Les classeurs visualisent les données dans des rapports ; ils n'attribuent pas d'incidents et n'agissent pas sur les comptes."
    c:
      en: "Hunting queries serve the proactive search for undetected threats, not the response to an incident."
      fr: "Les requêtes de repérage servent à la recherche proactive de menaces non détectées, pas à la réponse à un incident."
    d:
      en: "Data connectors ingest data from sources; they play no part in the response."
      fr: "Les connecteurs de données ingèrent les données des sources ; ils ne jouent aucun rôle dans la réponse."
references:
  - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management
  - title: "Automation in Microsoft Sentinel: Security orchestration, automation, and response (SOAR)"
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/automation
