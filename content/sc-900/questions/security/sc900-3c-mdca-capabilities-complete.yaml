id: sc900-3c-mdca-capabilities-complete
objective: "3.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Defender for Cloud Apps, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur Microsoft Defender pour les applications cloud, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Together with Microsoft Entra Conditional Access, Microsoft Defender for Cloud Apps uses [[c1]] to monitor and control user sessions in cloud apps in real time.

      To detect unusual behavior of users in cloud apps, it uses [[c2]].

      A cloud access security broker acts as [[c3]] between enterprise users and the cloud resources they use.
    fr: |
      Avec l'accès conditionnel Microsoft Entra, Microsoft Defender pour les applications cloud utilise [[c1]] pour surveiller et contrôler en temps réel les sessions des utilisateurs dans les applications cloud.

      Pour détecter un comportement inhabituel des utilisateurs dans les applications cloud, il utilise [[c2]].

      Un broker de sécurité d'accès au cloud joue le rôle de [[c3]] entre les utilisateurs de l'entreprise et les ressources cloud qu'ils utilisent.
  slots:
    - id: c1
      options:
        - { id: caac, text: { en: "Conditional Access app control", fr: "le contrôle d'application par accès conditionnel (Conditional Access app control)" } }
        - { id: pim, text: "Privileged Identity Management" }
        - { id: links, text: { en: "Safe Links", fr: "Liens sécurisés (Safe Links)" } }
    - id: c2
      options:
        - { id: sim, text: { en: "attack simulation training", fr: "la formation à la simulation d'attaque" } }
        - { id: ueba, text: { en: "user and entity behavior analytics (UEBA)", fr: "l'analyse du comportement des utilisateurs et des entités (UEBA)" } }
        - { id: reviews, text: { en: "access reviews", fr: "les révisions d'accès" } }
    - id: c3
      options:
        - { id: idp, text: { en: "an identity provider", fr: "fournisseur d'identité" } }
        - { id: logs, text: { en: "a log repository", fr: "référentiel de journaux" } }
        - { id: gate, text: { en: "a gatekeeper", fr: "gardien" } }
answer:
  values: { c1: caac, c2: ueba, c3: gate }
explanation:
  correct:
    en: "Conditional Access app control works with Microsoft Entra Conditional Access to monitor and control access to cloud apps and browser sessions in real time, for example to block the download of sensitive files to unmanaged devices. User and entity behavior analytics (UEBA) is the built-in capability that spots anomalous behavior. A cloud access security broker is a gatekeeper that brokers access between enterprise users and the cloud resources they use."
    fr: "Le contrôle d'application par accès conditionnel fonctionne avec l'accès conditionnel Microsoft Entra pour surveiller et contrôler en temps réel l'accès aux applications cloud et les sessions de navigateur, par exemple pour bloquer le téléchargement de fichiers sensibles vers des appareils non gérés. L'analyse du comportement des utilisateurs et des entités (UEBA) est la fonctionnalité intégrée qui repère les comportements anormaux. Un broker de sécurité d'accès au cloud est un gardien qui régule l'accès entre les utilisateurs de l'entreprise et les ressources cloud qu'ils utilisent."
references:
  - title: Conditional Access app control in Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad
  - title: Describe Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/5-describe-microsoft-cloud-app-security
