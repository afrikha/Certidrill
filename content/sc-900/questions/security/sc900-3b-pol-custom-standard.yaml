id: sc900-3b-pol-custom-standard
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has internal security rules that no built-in standard of Microsoft Defender for Cloud covers. The bank wants Defender for Cloud to assess its resources against these rules.

    What should the bank do?
  fr: |
    Woodgrove Bank applique des règles de sécurité internes qu'aucune norme intégrée de Microsoft Defender pour le cloud ne couvre. La banque veut que Defender pour le cloud évalue ses ressources par rapport à ces règles.

    Que doit faire la banque ?
body:
  options:
    - id: a
      text: { en: "Add the PCI DSS regulatory compliance standard", fr: "Ajouter la norme de conformité réglementaire PCI DSS" }
    - id: b
      text: { en: "Enable the Defender for Servers plan", fr: "Activer le plan Defender for Servers" }
    - id: c
      text: { en: "Run a query in the cloud security explorer", fr: "Exécuter une requête dans l'explorateur de sécurité du cloud" }
    - id: d
      text: { en: "Create a custom security standard", fr: "Créer une norme de sécurité personnalisée" }
answer: { optionId: d }
explanation:
  correct:
    en: "Besides security benchmarks and regulatory compliance standards, Defender for Cloud supports custom standards: organization-defined standards that align the assessments with internal security policies. The resources are then assessed against them like against any other standard."
    fr: "En plus des benchmarks de sécurité et des normes de conformité réglementaire, Defender pour le cloud prend en charge les normes personnalisées : des normes définies par l'organisation qui alignent les évaluations sur les stratégies de sécurité internes. Les ressources sont alors évaluées par rapport à elles comme par rapport à toute autre norme."
  options:
    a:
      en: "PCI DSS is a built-in industry standard for payment card data; it does not contain the bank's own rules."
      fr: "PCI DSS est une norme sectorielle intégrée pour les données de cartes de paiement ; elle ne contient pas les règles propres à la banque."
    b:
      en: "Defender for Servers is a workload protection plan that detects threats on machines; it does not define what the resources are assessed against."
      fr: "Defender for Servers est un plan de protection des charges de travail qui détecte les menaces sur les machines ; il ne définit pas ce par rapport à quoi les ressources sont évaluées."
    c:
      en: "A query in the cloud security explorer answers a question once; it does not set up a continuous assessment against a set of rules."
      fr: "Une requête dans l'explorateur de sécurité du cloud répond à une question ponctuelle ; elle ne met pas en place une évaluation continue par rapport à un ensemble de règles."
references:
  - title: Security policies in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/security-policy-concept
  - title: Describe how security policies, standards, and recommendations improve cloud security posture
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure
