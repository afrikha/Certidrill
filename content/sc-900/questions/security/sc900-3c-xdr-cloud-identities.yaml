id: sc900-3c-xdr-cloud-identities
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which service works alongside Microsoft Defender for Identity in Microsoft Defender XDR to protect cloud identities from identity-based risks?
  fr: |
    Quel service travaille aux côtés de Microsoft Defender pour Identity dans Microsoft Defender XDR pour protéger les identités cloud contre les risques liés à l'identité ?
body:
  options:
    - id: a
      text: "Microsoft Entra ID Protection"
    - id: b
      text: "Microsoft Entra Privileged Identity Management"
    - id: c
      text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" }
    - id: d
      text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" }
answer: { optionId: a }
explanation:
  correct:
    en: "Microsoft Entra ID Protection is the Defender XDR service for cloud identities. It uses what Microsoft has learned across Microsoft Entra organizations and consumer accounts to detect risky users and risky sign-ins, while Defender for Identity relies on the signals of the identity infrastructure, starting with on-premises Active Directory."
    fr: "Microsoft Entra ID Protection est le service de Defender XDR pour les identités cloud. Il s'appuie sur ce que Microsoft a appris des organisations Microsoft Entra et des comptes grand public pour détecter les utilisateurs à risque et les connexions à risque, tandis que Defender pour Identity s'appuie sur les signaux de l'infrastructure d'identité, à commencer par Active Directory local."
  options:
    b:
      en: "Privileged Identity Management gives just-in-time, time-bound access to privileged roles; it is a governance feature, not a risk detection service of Defender XDR."
      fr: "Privileged Identity Management donne un accès juste-à-temps et limité dans le temps aux rôles privilégiés ; c'est une fonctionnalité de gouvernance, pas un service de détection des risques de Defender XDR."
    c:
      en: "Defender for Cloud Apps protects SaaS applications and the data in them, not the identities themselves."
      fr: "Defender pour les applications cloud protège les applications SaaS et les données qu'elles contiennent, pas les identités elles-mêmes."
    d:
      en: "Defender for Cloud protects cloud resources and workloads such as virtual machines and databases; it is not a service of the Defender XDR suite."
      fr: "Defender pour le cloud protège les ressources et les charges de travail cloud comme les machines virtuelles et les bases de données ; ce n'est pas un service de la suite Defender XDR."
references:
  - title: Describe Microsoft Defender XDR services
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services
