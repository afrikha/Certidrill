id: sc900-3a-fw-fqdn-outbound
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders wants the virtual machines of its Azure virtual networks to reach only approved websites on the internet. The websites are identified by their fully qualified domain names (FQDNs), not by IP addresses.

    What should Northwind Traders use?
  fr: |
    Northwind Traders veut que les machines virtuelles de ses réseaux virtuels Azure n'atteignent sur internet que des sites web approuvés. Les sites web sont identifiés par leur nom de domaine complet (FQDN), et non par des adresses IP.

    Que doit utiliser Northwind Traders ?
body:
  options:
    - id: a
      text: { en: "Azure Firewall", fr: "Le Pare-feu Azure" }
    - id: b
      text: { en: "A network security group", fr: "Un groupe de sécurité réseau" }
    - id: c
      text: "Azure Web Application Firewall"
    - id: d
      text: "Azure DDoS Protection"
answer: { optionId: a }
explanation:
  correct:
    en: "Azure Firewall filters traffic at the network level, by IP address, port and protocol, and at the application level: it can filter protocols such as HTTP and HTTPS and control access to fully qualified domain names. Outbound traffic of the virtual networks can therefore be limited to a list of approved FQDNs."
    fr: "Le Pare-feu Azure filtre le trafic au niveau du réseau, par adresse IP, port et protocole, et au niveau de l'application : il peut filtrer des protocoles comme HTTP et HTTPS et contrôler l'accès à des noms de domaine complets. Le trafic sortant des réseaux virtuels peut donc être limité à une liste de FQDN approuvés."
  options:
    b:
      en: "The rules of a network security group identify a source or a destination by IP address, service tag or application security group, not by FQDN."
      fr: "Les règles d'un groupe de sécurité réseau identifient une source ou une destination par adresse IP, balise de service ou groupe de sécurité d'application, pas par FQDN."
    c:
      en: "Azure Web Application Firewall inspects the requests that arrive at a web application; it doesn't control the websites that virtual machines can reach."
      fr: "Azure Web Application Firewall inspecte les requêtes qui arrivent sur une application web ; il ne contrôle pas les sites web que les machines virtuelles peuvent atteindre."
    d:
      en: "Azure DDoS Protection mitigates denial-of-service attacks against public endpoints; it doesn't filter outbound traffic."
      fr: "Azure DDoS Protection atténue les attaques par déni de service contre des points de terminaison publics ; il ne filtre pas le trafic sortant."
references:
  - title: Describe Azure Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall
  - title: Azure Firewall features by SKU
    url: https://learn.microsoft.com/en-us/azure/firewall/features
