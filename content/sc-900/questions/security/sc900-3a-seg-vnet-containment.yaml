id: sc900-3a-seg-vnet-containment
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam deploys its payroll workload in one Azure virtual network and its marketing workload in another virtual network of the same subscription. Fabrikam configures nothing else.

    Which statement describes the traffic between the two workloads?
  fr: |
    Fabrikam déploie sa charge de travail de paie dans un réseau virtuel Azure et sa charge de travail de marketing dans un autre réseau virtuel du même abonnement. Fabrikam ne configure rien d'autre.

    Quelle affirmation décrit le trafic entre les deux charges de travail ?
body:
  options:
    - id: a
      text:
        en: "All traffic is allowed, because the two virtual networks are in the same subscription."
        fr: "Tout le trafic est autorisé, car les deux réseaux virtuels sont dans le même abonnement."
    - id: b
      text:
        en: "Only web traffic on ports 80 and 443 is allowed, until other ports are opened."
        fr: "Seul le trafic web sur les ports 80 et 443 est autorisé, tant que d'autres ports ne sont pas ouverts."
    - id: c
      text:
        en: "No traffic is allowed until the communication is explicitly provisioned."
        fr: "Aucun trafic n'est autorisé tant que la communication n'est pas explicitement configurée."
    - id: d
      text:
        en: "No traffic is allowed, and two virtual networks of the same subscription can never be connected."
        fr: "Aucun trafic n'est autorisé, et deux réseaux virtuels du même abonnement ne peuvent jamais être connectés."
answer: { optionId: c }
explanation:
  correct:
    en: "A virtual network provides network-level containment of its resources: by default, no traffic is allowed across virtual networks, and the communication must be explicitly provisioned, for example with a virtual network peering. Placing workloads in separate virtual networks is therefore a first level of segmentation."
    fr: "Un réseau virtuel assure le confinement au niveau du réseau de ses ressources : par défaut, aucun trafic n'est autorisé entre réseaux virtuels, et la communication doit être explicitement configurée, par exemple par un peering de réseaux virtuels. Placer des charges de travail dans des réseaux virtuels distincts constitue donc un premier niveau de segmentation."
  options:
    a:
      en: "Belonging to the same subscription doesn't connect virtual networks; each one stays isolated until it is connected."
      fr: "L'appartenance au même abonnement ne connecte pas les réseaux virtuels ; chacun reste isolé tant qu'il n'est pas connecté."
    b:
      en: "No port is open between two virtual networks that aren't connected; the isolation doesn't depend on the port."
      fr: "Aucun port n'est ouvert entre deux réseaux virtuels non connectés ; l'isolation ne dépend pas du port."
    d:
      en: "The isolation is only the default: two virtual networks, in the same subscription or not, can be connected, for example with a virtual network peering."
      fr: "L'isolation n'est que le comportement par défaut : deux réseaux virtuels, du même abonnement ou non, peuvent être connectés, par exemple par un peering de réseaux virtuels."
references:
  - title: Describe network segmentation in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
