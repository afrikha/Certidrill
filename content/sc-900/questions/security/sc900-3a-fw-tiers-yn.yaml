id: sc900-3a-fw-tiers-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about the tiers of Azure Firewall, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les niveaux du Pare-feu Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Azure Firewall Basic can deny traffic based on threat intelligence."
        fr: "Le Pare-feu Azure Basic peut refuser du trafic sur la base du renseignement sur les menaces."
    - id: s2
      text:
        en: "Azure Firewall Standard provides filtering from layer 3 to layer 7."
        fr: "Le Pare-feu Azure Standard assure un filtrage de la couche 3 à la couche 7."
    - id: s3
      text:
        en: "Azure Firewall Premium adds a signature-based intrusion detection and prevention system (IDPS)."
        fr: "Le Pare-feu Azure Premium ajoute un système de détection et de prévention des intrusions (IDPS) basé sur les signatures."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Azure Firewall Basic, designed for small and medium-sized businesses, supports threat intelligence in alert mode only: it signals the traffic but doesn't block it. Standard filters from layer 3 to layer 7 and both alerts on and blocks traffic to or from known malicious IP addresses and domains. Premium adds a signature-based IDPS for highly sensitive and regulated environments."
    fr: "Le Pare-feu Azure Basic, conçu pour les petites et moyennes entreprises, prend en charge le renseignement sur les menaces en mode alerte uniquement : il signale le trafic mais ne le bloque pas. Standard filtre de la couche 3 à la couche 7 et, à la fois, signale et bloque le trafic depuis ou vers des adresses IP et des domaines malveillants connus. Premium ajoute un IDPS basé sur les signatures pour les environnements très sensibles et réglementés."
  options:
    s1:
      en: "In the Basic tier, threat intelligence works in alert mode only; denying this traffic requires the Standard or Premium tier."
      fr: "Au niveau Basic, le renseignement sur les menaces fonctionne en mode alerte uniquement ; refuser ce trafic nécessite le niveau Standard ou Premium."
references:
  - title: What is Azure Firewall?
    url: https://learn.microsoft.com/en-us/azure/firewall/overview
  - title: Choose the right Azure Firewall SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
