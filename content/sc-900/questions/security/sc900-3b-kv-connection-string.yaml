id: sc900-3b-kv-connection-string
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A web application keeps the connection string of its database in a configuration file. You need to move the connection string to a central, secured store that the application reads at run time.

    Which Azure service should you use?
  fr: |
    Une application web conserve la chaîne de connexion de sa base de données dans un fichier de configuration. Vous devez déplacer la chaîne de connexion vers un magasin central et sécurisé que l'application lit à l'exécution.

    Quel service Azure devez-vous utiliser ?
body:
  options:
    - id: a
      text: Azure Key Vault
    - id: b
      text: Azure Bastion
    - id: c
      text: { en: "Azure Firewall", fr: "Pare-feu Azure" }
    - id: d
      text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure Key Vault is a cloud service for securely storing and accessing secrets such as passwords, API keys and connection strings. The application retrieves the secret from the vault at run time, so it no longer has to be kept in code or in configuration files."
    fr: "Azure Key Vault est un service cloud qui stocke des secrets, comme des mots de passe, des clés d'API et des chaînes de connexion, et en sécurise l'accès. L'application récupère le secret dans le coffre à l'exécution : il n'a donc plus à figurer dans le code ni dans les fichiers de configuration."
  options:
    b:
      en: "Azure Bastion secures the RDP and SSH sessions of administrators to virtual machines; it stores no application secret."
      fr: "Azure Bastion sécurise les sessions RDP et SSH des administrateurs vers les machines virtuelles ; il ne stocke aucun secret d'application."
    c:
      en: "Azure Firewall filters network traffic; it is not a store for secrets."
      fr: "Le Pare-feu Azure filtre le trafic réseau ; ce n'est pas un magasin de secrets."
    d:
      en: "Defender for Cloud assesses the security posture and detects threats; it does not store the secrets of applications."
      fr: "Defender pour le cloud évalue la posture de sécurité et détecte les menaces ; il ne stocke pas les secrets des applications."
references:
  - title: Describe Azure Key Vault
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/8-describe-ways-azure-encrypts-data
  - title: About Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
