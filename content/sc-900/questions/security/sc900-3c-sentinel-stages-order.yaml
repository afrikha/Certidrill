id: sc900-3c-sentinel-stages-order
objective: "3.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to use Microsoft Sentinel to handle threats from end to end.

    Which four actions does Microsoft Sentinel perform in sequence, from the arrival of the data to the mitigation of a threat? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys prévoit d'utiliser Microsoft Sentinel pour traiter les menaces de bout en bout.

    Quelles sont les quatre actions que Microsoft Sentinel effectue dans l'ordre, de l'arrivée des données à l'atténuation d'une menace ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: respond, text: { en: "Respond to the incident by using automation rules and playbooks.", fr: "Répondre à l'incident à l'aide de règles d'automatisation et de playbooks." } }
    - { id: label, text: { en: "Encrypt the documents involved by using sensitivity labels.", fr: "Chiffrer les documents concernés à l'aide d'étiquettes de confidentialité." } }
    - { id: detect, text: { en: "Detect threats by using analytics rules that raise alerts and create an incident.", fr: "Détecter les menaces à l'aide de règles d'analyse qui émettent des alertes et créent un incident." } }
    - { id: collect, text: { en: "Collect security data by using data connectors.", fr: "Collecter les données de sécurité à l'aide de connecteurs de données." } }
    - { id: review, text: { en: "Recertify the access of the users involved by using access reviews.", fr: "Recertifier l'accès des utilisateurs concernés à l'aide de révisions d'accès." } }
    - { id: investigate, text: { en: "Investigate the incident to understand the scope and the root cause of the attack.", fr: "Examiner l'incident pour comprendre l'étendue et la cause racine de l'attaque." } }
answer:
  sequence: [ collect, detect, investigate, respond ]
explanation:
  correct:
    en: |
      Microsoft Sentinel works in four stages. It first collects data at cloud scale through data connectors. Analytics rules then detect threats in that data, raise alerts and group them into an incident. Analysts investigate the incident to understand its full scope and root cause, and automation rules and playbooks finally respond to limit the impact.
    fr: |
      Microsoft Sentinel travaille en quatre étapes. Il collecte d'abord les données à l'échelle du cloud grâce aux connecteurs de données. Les règles d'analyse détectent ensuite les menaces dans ces données, émettent des alertes et les regroupent en un incident. Les analystes examinent l'incident pour en comprendre toute l'étendue et la cause racine, et les règles d'automatisation et les playbooks répondent enfin pour limiter l'impact.
  options:
    label: { en: "Sensitivity labels are a Microsoft Purview capability that classifies and protects content; they are not a stage of Microsoft Sentinel.", fr: "Les étiquettes de confidentialité sont une fonctionnalité de Microsoft Purview qui classifie et protège le contenu ; ce n'est pas une étape de Microsoft Sentinel." }
    review: { en: "Access reviews belong to Microsoft Entra ID Governance and recertify access periodically; Microsoft Sentinel does not perform them.", fr: "Les révisions d'accès relèvent de Microsoft Entra ID Governance et recertifient l'accès périodiquement ; Microsoft Sentinel ne les effectue pas." }
references:
  - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management
