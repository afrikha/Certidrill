id: sc900-3b-pol-recommendation-content
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two items does a security recommendation of Microsoft Defender for Cloud provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux éléments fournis par une recommandation de sécurité de Microsoft Defender pour le cloud ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The steps to remediate the issue", fr: "Les étapes de correction du problème" } }
    - { id: b, text: { en: "The IP address of the attacker", fr: "L'adresse IP de l'attaquant" } }
    - { id: c, text: { en: "The resources affected by the issue", fr: "Les ressources concernées par le problème" } }
    - { id: d, text: { en: "The users whose sign-ins are risky", fr: "Les utilisateurs dont les connexions sont risquées" } }
    - { id: e, text: { en: "The retention period of the audit log", fr: "La durée de conservation du journal d'audit" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Each recommendation provides a short description of the security issue, the remediation steps, the affected resources, and its severity and risk factors. It describes a weakness in the configuration to correct, not an attack."
    fr: "Chaque recommandation fournit une brève description du problème de sécurité, les étapes de correction, les ressources concernées, ainsi que sa gravité et ses facteurs de risque. Elle décrit une faiblesse de configuration à corriger, pas une attaque."
  options:
    b: { en: "A recommendation reports a misconfiguration, not an attack: there is no attacker to identify.", fr: "Une recommandation signale une configuration incorrecte, pas une attaque : il n'y a pas d'attaquant à identifier." }
    d: { en: "Risky sign-ins are reported by Microsoft Entra ID Protection.", fr: "Les connexions risquées sont signalées par Protection Microsoft Entra ID." }
    e: { en: "Audit log retention is a setting of Microsoft Purview Audit, unrelated to recommendations.", fr: "La conservation du journal d'audit est un paramètre de Microsoft Purview Audit, sans rapport avec les recommandations." }
references:
  - title: Describe how security policies, standards, and recommendations improve cloud security posture
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure
  - title: Security policies in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/security-policy-concept
