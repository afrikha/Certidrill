id: sc900-3b-mdc-ai-yn
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A company builds generative AI applications in Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise développe des applications d'IA générative dans Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Microsoft Defender for Cloud can discover the generative AI applications and workloads of the company.
        fr: Microsoft Defender pour le cloud peut découvrir les applications et les charges de travail d'IA générative de l'entreprise.
    - id: s2
      text:
        en: Microsoft Defender for Cloud applies sensitivity labels to the prompts that users send to the AI applications.
        fr: Microsoft Defender pour le cloud applique des étiquettes de confidentialité aux invites que les utilisateurs envoient aux applications d'IA.
    - id: s3
      text:
        en: Microsoft Defender for Cloud can detect prompt injection attacks against the AI applications.
        fr: Microsoft Defender pour le cloud peut détecter les attaques par injection d'invites contre les applications d'IA.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Beyond its three pillars, Defender for Cloud discovers and protects generative AI applications and workloads: it catalogs the AI models, applications and services in use and assesses their posture. Its AI threat protection detects threats such as prompt injection, data leakage and credential theft. Sensitivity labels are a Microsoft Purview Information Protection capability, not a Defender for Cloud one."
    fr: "Au-delà de ses trois piliers, Defender pour le cloud découvre et protège les applications et les charges de travail d'IA générative : il répertorie les modèles, les applications et les services d'IA utilisés et évalue leur posture. Sa protection contre les menaces pour l'IA détecte des menaces comme l'injection d'invites, la fuite de données et le vol d'informations d'identification. Les étiquettes de confidentialité relèvent de la protection des informations de Microsoft Purview, pas de Defender pour le cloud."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
  - title: What is Microsoft Defender for Cloud?
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
