id: sc900-3a-ddos-layers
objective: "3.1.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    At which layers of the OSI model does Azure DDoS Protection mitigate attacks?
  fr: |
    À quelles couches du modèle OSI Azure DDoS Protection atténue-t-il les attaques ?
body:
  options:
    - id: a
      text: { en: "Layer 2 (data link) and layer 3 (network)", fr: "Couche 2 (liaison de données) et couche 3 (réseau)" }
    - id: b
      text: { en: "Layer 3 (network) and layer 4 (transport)", fr: "Couche 3 (réseau) et couche 4 (transport)" }
    - id: c
      text: { en: "Layer 4 (transport) and layer 7 (application)", fr: "Couche 4 (transport) et couche 7 (application)" }
    - id: d
      text: { en: "Layer 7 (application) only", fr: "Couche 7 (application) uniquement" }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure DDoS Protection analyzes network traffic and discards what looks like a DDoS attack at layer 3 (network) and layer 4 (transport). Web applications that also need protection at layer 7 combine it with a web application firewall."
    fr: "Azure DDoS Protection analyse le trafic réseau et écarte ce qui ressemble à une attaque DDoS à la couche 3 (réseau) et à la couche 4 (transport). Les applications web qui ont aussi besoin d'une protection à la couche 7 l'associent à un pare-feu d'applications web."
  options:
    a:
      en: "Azure DDoS Protection doesn't work at the data link layer; its mitigation covers the network and transport layers."
      fr: "Azure DDoS Protection n'intervient pas à la couche liaison de données ; son atténuation couvre les couches réseau et transport."
    c:
      en: "Layer 4 is covered, but layer 7 isn't: application-layer attacks are handled by a web application firewall."
      fr: "La couche 4 est couverte, mais pas la couche 7 : les attaques de la couche application relèvent d'un pare-feu d'applications web."
    d:
      en: "Layer 7 is the layer that Azure DDoS Protection doesn't cover; it is the layer of a web application firewall."
      fr: "La couche 7 est justement celle qu'Azure DDoS Protection ne couvre pas ; c'est celle d'un pare-feu d'applications web."
references:
  - title: Describe Azure DDoS protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection
  - title: Azure DDoS Protection Overview
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
