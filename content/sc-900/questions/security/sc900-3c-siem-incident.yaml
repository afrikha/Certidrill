id: sc900-3c-siem-incident
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a security information and event management (SIEM) system, what is an incident?
  fr: |
    Dans un système de gestion des informations et des événements de sécurité (SIEM), qu'est-ce qu'un incident ?
body:
  options:
    - id: a
      text: { en: "A group of related alerts that forms a case file to investigate", fr: "Un groupe d'alertes liées qui forme un dossier à examiner" }
    - id: b
      text: { en: "A single log entry that a data source sends to the platform", fr: "Une entrée de journal unique qu'une source de données envoie à la plateforme" }
    - id: c
      text: { en: "A sequence of automated actions that responds to a threat", fr: "Une séquence d'actions automatisées qui répond à une menace" }
    - id: d
      text: { en: "A visual report that summarizes the security data collected", fr: "Un rapport visuel qui résume les données de sécurité collectées" }
answer: { optionId: a }
explanation:
  correct:
    en: "A SIEM generates alerts when it identifies suspicious activity, then automatically groups the alerts that belong together into an incident. The incident is the case file that represents one potential threat: analysts assign it and investigate it as a whole instead of handling each alert separately."
    fr: "Un SIEM émet des alertes quand il repère une activité suspecte, puis regroupe automatiquement les alertes qui vont ensemble en un incident. L'incident est le dossier qui représente une menace potentielle : les analystes l'attribuent et l'examinent comme un tout au lieu de traiter chaque alerte séparément."
  options:
    b:
      en: "A log entry is raw data. Many entries are aggregated and correlated before the SIEM raises an alert, and several alerts form an incident."
      fr: "Une entrée de journal est une donnée brute. De nombreuses entrées sont agrégées et corrélées avant que le SIEM n'émette une alerte, et plusieurs alertes forment un incident."
    c:
      en: "A sequence of automated response actions is a playbook, a SOAR concept."
      fr: "Une séquence d'actions de réponse automatisées est un playbook, une notion du SOAR."
    d:
      en: "A visual report presents data; it is not the object that analysts triage and investigate."
      fr: "Un rapport visuel présente des données ; ce n'est pas l'objet que les analystes trient et examinent."
references:
  - title: Define the concepts of SIEM and SOAR
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar
