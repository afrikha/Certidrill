id: sc900-3a-fw-stateful
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Azure Firewall keeps track of the active connections and uses the context of the traffic to decide whether a packet is allowed.

    Which term describes this type of firewall?
  fr: |
    Le Pare-feu Azure garde la trace des connexions actives et s'appuie sur le contexte du trafic pour décider si un paquet est autorisé.

    Quel terme décrit ce type de pare-feu ?
body:
  options:
    - id: a
      text: { en: "Stateless", fr: "Sans état" }
    - id: b
      text: { en: "Host-based", fr: "Basé sur l'hôte" }
    - id: c
      text: { en: "Signature-based", fr: "Basé sur les signatures" }
    - id: d
      text: { en: "Stateful", fr: "Avec état" }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Firewall is a fully stateful firewall: it tracks the state of the active connections and makes its decisions based on the context of the traffic, not on each packet taken in isolation."
    fr: "Le Pare-feu Azure est un pare-feu entièrement avec état : il suit l'état des connexions actives et prend ses décisions selon le contexte du trafic, et non paquet par paquet de façon isolée."
  options:
    a:
      en: "A stateless firewall evaluates each packet on its own, without remembering the connection to which it belongs."
      fr: "Un pare-feu sans état évalue chaque paquet séparément, sans mémoriser la connexion à laquelle il appartient."
    b:
      en: "A host-based firewall runs on the machine that it protects; Azure Firewall is a managed network service."
      fr: "Un pare-feu basé sur l'hôte s'exécute sur la machine qu'il protège ; le Pare-feu Azure est un service réseau managé."
    c:
      en: "Signature-based describes detection that looks for known malicious patterns, as the intrusion detection and prevention system of Azure Firewall Premium does; it doesn't refer to connection tracking."
      fr: "« Basé sur les signatures » décrit une détection qui recherche des motifs malveillants connus, comme le fait le système de détection et de prévention des intrusions du Pare-feu Azure Premium ; le terme ne désigne pas le suivi des connexions."
references:
  - title: Describe Azure Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall
  - title: What is Azure Firewall?
    url: https://learn.microsoft.com/en-us/azure/firewall/overview
