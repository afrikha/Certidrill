id: sc900-3b-pol-default-standard
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You enable Microsoft Defender for Cloud on an Azure subscription for the first time.

    Which security standard is assigned to the subscription automatically?
  fr: |
    Vous activez Microsoft Defender pour le cloud sur un abonnement Azure pour la première fois.

    Quelle norme de sécurité est attribuée automatiquement à l'abonnement ?
body:
  options:
    - id: a
      text: "ISO/IEC 27001"
    - id: b
      text: "PCI DSS"
    - id: c
      text: { en: "Microsoft cloud security benchmark (MCSB)", fr: "Benchmark de sécurité cloud Microsoft (MCSB)" }
    - id: d
      text: "NIST SP 800-53"
answer: { optionId: c }
explanation:
  correct:
    en: "The Microsoft cloud security benchmark (MCSB) is the default, built-in security initiative: it is assigned automatically when you first enable Defender for Cloud. It is a Microsoft-authored set of security and compliance guidelines for Azure and multicloud environments."
    fr: "Le benchmark de sécurité cloud Microsoft (MCSB) est l'initiative de sécurité intégrée par défaut : il est attribué automatiquement quand vous activez Defender pour le cloud pour la première fois. C'est un ensemble de recommandations de sécurité et de conformité rédigé par Microsoft pour Azure et les environnements multicloud."
  options:
    a:
      en: "ISO/IEC 27001 is a regulatory standard that you can add to your compliance assessments; it is not assigned by default."
      fr: "ISO/IEC 27001 est une norme réglementaire que vous pouvez ajouter à vos évaluations de conformité ; elle n'est pas attribuée par défaut."
    b:
      en: "PCI DSS is an industry standard that you can add next to the MCSB; it is not assigned by default."
      fr: "PCI DSS est une norme sectorielle que vous pouvez ajouter à côté du MCSB ; elle n'est pas attribuée par défaut."
    d:
      en: "NIST SP 800-53 can be added as a regulatory standard; the MCSB builds on NIST controls but is a distinct standard."
      fr: "NIST SP 800-53 peut être ajoutée comme norme réglementaire ; le MCSB s'appuie sur des contrôles du NIST mais constitue une norme distincte."
references:
  - title: Describe how security policies, standards, and recommendations improve cloud security posture
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure
  - title: Regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
