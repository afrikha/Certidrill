id: sc900-3d-ti-basics-yn
objective: "3.4.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Threat Intelligence, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Threat Intelligence, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Threat Intelligence helps analysts with incident response and threat hunting."
        fr: "Microsoft Threat Intelligence aide les analystes dans la réponse aux incidents et le repérage des menaces."
    - id: s2
      text:
        en: "Microsoft Threat Intelligence is used to apply sensitivity labels to documents."
        fr: "Microsoft Threat Intelligence sert à appliquer des étiquettes de confidentialité aux documents."
    - id: s3
      text:
        en: "Microsoft Threat Intelligence is accessed from the Microsoft Purview portal."
        fr: "Microsoft Threat Intelligence est accessible depuis le portail Microsoft Purview."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Microsoft Threat Intelligence gives security teams context about threats, which supports triage, incident response and threat hunting. Sensitivity labels belong to Microsoft Purview Information Protection. The threat intelligence capabilities are found under Threat intelligence in the Microsoft Defender portal, the portal of security operations."
    fr: "Microsoft Threat Intelligence donne aux équipes de sécurité du contexte sur les menaces, ce qui aide au triage, à la réponse aux incidents et au repérage des menaces. Les étiquettes de confidentialité relèvent de Microsoft Purview Information Protection. Les fonctionnalités de renseignement sur les menaces se trouvent sous Threat Intelligence dans le portail Microsoft Defender, le portail des opérations de sécurité."
references:
  - title: Describe Microsoft Defender Threat Intelligence
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6b-describe-defender-threat-intelligence
  - title: Threat intelligence in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/defender-threat-intelligence
