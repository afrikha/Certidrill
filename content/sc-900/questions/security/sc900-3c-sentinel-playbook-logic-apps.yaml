id: sc900-3c-sentinel-playbook-logic-apps
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    On which Azure service are Microsoft Sentinel playbooks built?
  fr: |
    Sur quel service Azure les playbooks de Microsoft Sentinel sont-ils construits ?
body:
  options:
    - id: a
      text: "Azure Automation"
    - id: b
      text: "Azure Functions"
    - id: c
      text: "Azure Logic Apps"
    - id: d
      text: "Azure Event Grid"
answer: { optionId: c }
explanation:
  correct:
    en: "A Microsoft Sentinel playbook is a collection of response and remediation actions based on an Azure Logic Apps workflow. It therefore benefits from the connectors of Logic Apps to act on other systems, for example to open a ticket in an IT service management tool or to disable an account."
    fr: "Un playbook Microsoft Sentinel est un ensemble d'actions de réponse et de correction fondé sur un flux de travail Azure Logic Apps. Il profite donc des connecteurs de Logic Apps pour agir sur d'autres systèmes, par exemple pour ouvrir un ticket dans un outil de gestion des services informatiques ou pour désactiver un compte."
  options:
    a:
      en: "Azure Automation runs runbooks for the management of resources; Sentinel playbooks are not built on it."
      fr: "Azure Automation exécute des runbooks pour la gestion des ressources ; les playbooks de Sentinel ne sont pas construits dessus."
    b:
      en: "Azure Functions runs code on demand; a playbook is a Logic Apps workflow, not a function."
      fr: "Azure Functions exécute du code à la demande ; un playbook est un flux de travail Logic Apps, pas une fonction."
    d:
      en: "Azure Event Grid routes events between services; it does not define the response workflow of a playbook."
      fr: "Azure Event Grid achemine des événements entre des services ; il ne définit pas le flux de travail de réponse d'un playbook."
references:
  - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management
  - title: "Automation in Microsoft Sentinel: Security orchestration, automation, and response (SOAR)"
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/automation
