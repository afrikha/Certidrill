id: sc900-3b-cwp-key-vault-plan
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores the secrets of its applications in Azure Key Vault. The security team wants to be alerted of unusual and potentially harmful attempts to access the key vaults.

    What should the company enable?
  fr: |
    Une entreprise stocke les secrets de ses applications dans Azure Key Vault. L'équipe de sécurité veut être alertée des tentatives inhabituelles et potentiellement dangereuses d'accès aux coffres de clés.

    Que doit activer l'entreprise ?
body:
  options:
    - id: a
      text: { en: "The Premium tier of Azure Key Vault", fr: "Le niveau Premium d'Azure Key Vault" }
    - id: b
      text: { en: "The Defender for Storage plan", fr: "Le plan Defender for Storage" }
    - id: c
      text: { en: "The Defender for Resource Manager plan", fr: "Le plan Defender for Resource Manager" }
    - id: d
      text: { en: "The Defender for Key Vault plan", fr: "Le plan Defender for Key Vault" }
answer: { optionId: d }
explanation:
  correct:
    en: "Defender for Key Vault is the workload protection plan that provides advanced threat protection for Azure Key Vault: it detects unusual and potentially harmful attempts to access or exploit key vaults and raises security alerts."
    fr: "Defender for Key Vault est le plan de protection des charges de travail qui fournit une protection avancée contre les menaces pour Azure Key Vault : il détecte les tentatives inhabituelles et potentiellement dangereuses d'accès aux coffres de clés ou d'exploitation de ceux-ci, et émet des alertes de sécurité."
  options:
    a:
      en: "The Premium tier adds HSM-protected keys; it does not detect suspicious access attempts."
      fr: "Le niveau Premium ajoute des clés protégées par HSM ; il ne détecte pas les tentatives d'accès suspectes."
    b:
      en: "Defender for Storage detects potentially harmful activity on storage accounts, not on key vaults."
      fr: "Defender for Storage détecte les activités potentiellement dangereuses sur les comptes de stockage, pas sur les coffres de clés."
    c:
      en: "Defender for Resource Manager monitors resource management operations, not the access to the contents of key vaults."
      fr: "Defender for Resource Manager surveille les opérations de gestion des ressources, pas l'accès au contenu des coffres de clés."
references:
  - title: Describe the enhanced security of Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
  - title: What is Microsoft Defender for Cloud?
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
