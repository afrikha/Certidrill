id: sc900-3c-xdr-complete
objective: "3.4.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Defender XDR, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur Microsoft Defender XDR, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Defender XDR is [[x1]] suite.

      It coordinates protection across endpoints, identities, email and [[x2]].

      It groups related alerts and the impacted assets into [[x3]].
    fr: |
      Microsoft Defender XDR est une suite [[x1]].

      Elle coordonne la protection sur les points de terminaison, les identités, l'e-mail et [[x2]].

      Elle regroupe les alertes liées et les ressources touchées dans [[x3]].
  slots:
    - id: x1
      options:
        - { id: grc, text: { en: "a governance, risk and compliance", fr: "de gouvernance, de risque et de conformité" } }
        - { id: xdr, text: { en: "an extended detection and response", fr: "de détection et de réponse étendues" } }
        - { id: iga, text: { en: "an identity governance and administration", fr: "de gouvernance et d'administration des identités" } }
    - id: x2
      options:
        - { id: apps, text: { en: "applications", fr: "les applications" } }
        - { id: dc, text: { en: "physical datacenters", fr: "les centres de données physiques" } }
        - { id: regs, text: { en: "regulatory assessments", fr: "les évaluations réglementaires" } }
    - id: x3
      options:
        - { id: work, text: { en: "workbooks", fr: "des classeurs (workbooks)" } }
        - { id: reviews, text: { en: "access reviews", fr: "des révisions d'accès" } }
        - { id: inc, text: { en: "incidents", fr: "des incidents" } }
answer:
  values: { x1: xdr, x2: apps, x3: inc }
explanation:
  correct:
    en: "XDR stands for extended detection and response. Defender XDR coordinates detection, prevention, investigation and response across four domains: endpoints, identities, email and applications. Related alerts, suspicious events and impacted assets from all the services are grouped into incidents, so that analysts see the whole attack in one place."
    fr: "XDR signifie détection et réponse étendues (extended detection and response). Defender XDR coordonne la détection, la prévention, l'investigation et la réponse sur quatre domaines : les points de terminaison, les identités, l'e-mail et les applications. Les alertes liées, les événements suspects et les ressources touchées de tous les services sont regroupés en incidents, pour que les analystes voient toute l'attaque au même endroit."
references:
  - title: Describe Microsoft Defender XDR services
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services
