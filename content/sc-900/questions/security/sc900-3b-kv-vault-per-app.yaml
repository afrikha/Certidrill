id: sc900-3b-kv-vault-per-app
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs three applications, each maintained by a different team of developers. Each application and its team must have access only to the secrets of that application.

    What should the company do in Azure Key Vault?
  fr: |
    Une entreprise exécute trois applications, chacune maintenue par une équipe de développeurs différente. Chaque application et son équipe ne doivent avoir accès qu'aux secrets de cette application.

    Que doit faire l'entreprise dans Azure Key Vault ?
body:
  options:
    - id: a
      text: { en: "Create one key vault for all the applications and enable logging", fr: "Créer un seul coffre de clés pour toutes les applications et activer la journalisation" }
    - id: b
      text: { en: "Create one key vault per application and restrict access to each vault", fr: "Créer un coffre de clés par application et restreindre l'accès à chaque coffre" }
    - id: c
      text: { en: "Create one key vault for all the applications in the Premium tier", fr: "Créer un seul coffre de clés pour toutes les applications au niveau Premium" }
    - id: d
      text: { en: "Create one key vault per Azure region and replicate the secrets", fr: "Créer un coffre de clés par région Azure et répliquer les secrets" }
answer: { optionId: b }
explanation:
  correct:
    en: "Key Vault supports the segregation of secrets: you can create one key vault per application and restrict the secrets it contains to that application and its team of developers. An application then reaches only the vault it is allowed to access, which applies the least privilege principle."
    fr: "Key Vault prend en charge la séparation des secrets : vous pouvez créer un coffre de clés par application et réserver les secrets qu'il contient à cette application et à son équipe de développeurs. Une application n'atteint alors que le coffre auquel elle est autorisée à accéder, ce qui applique le principe du moindre privilège."
  options:
    a:
      en: "Logging shows who accessed the secrets, but a single shared vault does not separate the secrets of the three applications."
      fr: "La journalisation montre qui a accédé aux secrets, mais un coffre unique partagé ne sépare pas les secrets des trois applications."
    c:
      en: "The Premium tier adds HSM-protected keys; it does not separate the secrets of one application from those of another."
      fr: "Le niveau Premium ajoute des clés protégées par HSM ; il ne sépare pas les secrets d'une application de ceux d'une autre."
    d:
      en: "Key Vault already replicates its contents to a secondary region by itself; one vault per region does not separate the applications."
      fr: "Key Vault réplique déjà de lui-même son contenu vers une région secondaire ; un coffre par région ne sépare pas les applications."
references:
  - title: Describe Azure Key Vault
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/8-describe-ways-azure-encrypts-data
