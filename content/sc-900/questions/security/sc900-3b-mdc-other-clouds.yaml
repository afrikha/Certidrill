id: sc900-3b-mdc-other-clouds
objective: "3.2.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Besides Azure, in which cloud platforms can Microsoft Defender for Cloud protect resources?
  fr: |
    En dehors d'Azure, sur quelles plateformes cloud Microsoft Defender pour le cloud peut-il protéger des ressources ?
body:
  options:
    - id: a
      text: { en: "Amazon Web Services (AWS) only", fr: "Amazon Web Services (AWS) uniquement" }
    - id: b
      text: { en: "Google Cloud Platform (GCP) only", fr: "Google Cloud Platform (GCP) uniquement" }
    - id: c
      text: { en: "Amazon Web Services (AWS) and Google Cloud Platform (GCP)", fr: "Amazon Web Services (AWS) et Google Cloud Platform (GCP)" }
    - id: d
      text: { en: "None: only Azure resources are protected", fr: "Aucune : seules les ressources Azure sont protégées" }
answer: { optionId: c }
explanation:
  correct:
    en: "Defender for Cloud is a multicloud solution: you can connect Amazon Web Services and Google Cloud Platform accounts, and their resources then receive posture assessment and workload protection alongside the Azure resources. It also covers on-premises environments."
    fr: "Defender pour le cloud est une solution multicloud : vous pouvez connecter des comptes Amazon Web Services et Google Cloud Platform, dont les ressources bénéficient alors de l'évaluation de la posture et de la protection des charges de travail au même titre que les ressources Azure. Il couvre aussi les environnements locaux."
  options:
    a:
      en: "GCP accounts can be connected as well as AWS accounts."
      fr: "Les comptes GCP peuvent être connectés tout comme les comptes AWS."
    b:
      en: "AWS accounts can be connected as well as GCP accounts."
      fr: "Les comptes AWS peuvent être connectés tout comme les comptes GCP."
    d:
      en: "Although it is an Azure service, Defender for Cloud is not limited to Azure resources."
      fr: "Bien qu'il s'agisse d'un service Azure, Defender pour le cloud ne se limite pas aux ressources Azure."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
  - title: What is Microsoft Defender for Cloud?
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
