id: sc900-3c-mdo-basics-yn
objective: "3.4.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender for Office 365, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender pour Office 365, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The features of Microsoft Defender for Office 365 are managed in the Microsoft Purview portal."
        fr: "Les fonctionnalités de Microsoft Defender pour Office 365 se gèrent dans le portail Microsoft Purview."
    - id: s2
      text:
        en: "Microsoft Defender for Office 365 protects against malicious links in email messages."
        fr: "Microsoft Defender pour Office 365 protège contre les liens malveillants dans les e-mails."
    - id: s3
      text:
        en: "Microsoft Defender for Office 365 includes anti-phishing protection against messages that appear to come from trusted senders."
        fr: "Microsoft Defender pour Office 365 comprend une protection anti-hameçonnage contre les messages qui semblent provenir d'expéditeurs de confiance."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Defender for Office 365 is accessed through the Microsoft Defender portal, under the Email & collaboration node; the Microsoft Purview portal is for compliance and data protection. Safe Links protects against malicious URLs used in phishing and other attacks. Anti-phishing protection detects spoofed messages that pretend to come from legitimate or trusted senders in order to steal sensitive information."
    fr: "Defender pour Office 365 est accessible dans le portail Microsoft Defender, sous le nœud E-mail et collaboration ; le portail Microsoft Purview sert à la conformité et à la protection des données. Liens sécurisés protège contre les URL malveillantes utilisées dans l'hameçonnage et d'autres attaques. La protection anti-hameçonnage détecte les messages usurpés qui prétendent venir d'expéditeurs légitimes ou de confiance pour voler des informations sensibles."
references:
  - title: Describe Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/3-describe-defender-office
