id: sc900-3c-sentinel-workbooks
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Microsoft Sentinel feature do you use to create interactive visual reports on the data that Microsoft Sentinel has collected?
  fr: |
    Quelle fonctionnalité de Microsoft Sentinel utilisez-vous pour créer des rapports visuels interactifs sur les données que Microsoft Sentinel a collectées ?
body:
  options:
    - id: a
      text: { en: "Workbooks", fr: "Les classeurs (workbooks)" }
    - id: b
      text: { en: "Playbooks", fr: "Les playbooks" }
    - id: c
      text: { en: "Watchlists", fr: "Les watchlists" }
    - id: d
      text: { en: "Automation rules", fr: "Les règles d'automatisation" }
answer: { optionId: a }
explanation:
  correct:
    en: "Workbooks are the reporting feature of Microsoft Sentinel: interactive visual reports built from templates or created from scratch, available once a data source is connected. They show the data; they take no action on it."
    fr: "Les classeurs sont la fonctionnalité de rapport de Microsoft Sentinel : des rapports visuels interactifs construits à partir de modèles ou créés de toutes pièces, disponibles dès qu'une source de données est connectée. Ils montrent les données ; ils n'agissent pas dessus."
  options:
    b:
      en: "A playbook is a workflow of response and remediation actions, not a report."
      fr: "Un playbook est un flux de travail d'actions de réponse et de correction, pas un rapport."
    c:
      en: "A watchlist is a list of your own reference data, such as high-value assets, that Sentinel correlates with events."
      fr: "Une watchlist est une liste de vos propres données de référence, comme les ressources de grande valeur, que Sentinel corrèle avec les événements."
    d:
      en: "Automation rules manage how incidents are handled: assign, change status, run a playbook."
      fr: "Les règles d'automatisation gèrent le traitement des incidents : attribuer, changer l'état, exécuter un playbook."
references:
  - title: What is Microsoft Sentinel security information and event management (SIEM)?
    url: https://learn.microsoft.com/en-us/azure/sentinel/overview
