id: sc900-3d-mdi-onprem-ad-scenario
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an on-premises Active Directory forest. The security team wants to be alerted when someone tries to guess the passwords of domain accounts through repeated attempts or changes the membership of sensitive groups. The solution must monitor the domain controllers.

    Which service should the team use?
  fr: |
    Proseware dispose d'une forêt Active Directory locale. L'équipe de sécurité veut être alertée quand quelqu'un tente de deviner les mots de passe de comptes du domaine par des essais répétés ou modifie l'appartenance à des groupes sensibles. La solution doit surveiller les contrôleurs de domaine.

    Quel service l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: "Microsoft Entra ID Protection"
    - id: b
      text: { en: "Microsoft Defender for Identity", fr: "Microsoft Defender pour Identity" }
    - id: c
      text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" }
    - id: d
      text: { en: "Microsoft Defender for Office 365", fr: "Microsoft Defender pour Office 365" }
answer: { optionId: b }
explanation:
  correct:
    en: "Defender for Identity uses sensors on the identity servers of the organization, starting with the domain controllers, to read their events and network traffic. From these signals it detects identity-based attacks such as brute-force attempts, repeated failed authentications and suspicious changes of group membership."
    fr: "Defender pour Identity utilise des capteurs sur les serveurs d'identité de l'organisation, à commencer par les contrôleurs de domaine, pour lire leurs événements et leur trafic réseau. À partir de ces signaux, il détecte les attaques fondées sur l'identité, comme les tentatives par force brute, les échecs d'authentification répétés et les modifications suspectes de l'appartenance aux groupes."
  options:
    a:
      en: "Microsoft Entra ID Protection detects risky sign-ins and risky users of Microsoft Entra ID; it does not monitor on-premises domain controllers."
      fr: "Microsoft Entra ID Protection détecte les connexions à risque et les utilisateurs à risque de Microsoft Entra ID ; il ne surveille pas les contrôleurs de domaine locaux."
    c:
      en: "Defender for Cloud Apps protects the use of SaaS applications and the data in them, not the domain controllers of Active Directory."
      fr: "Defender pour les applications cloud protège l'utilisation des applications SaaS et les données qu'elles contiennent, pas les contrôleurs de domaine d'Active Directory."
    d:
      en: "Defender for Office 365 protects email and collaboration tools against threats such as phishing and malware."
      fr: "Defender pour Office 365 protège l'e-mail et les outils de collaboration contre des menaces comme l'hameçonnage et les programmes malveillants."
references:
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
  - title: Microsoft Defender for Identity overview
    url: https://learn.microsoft.com/en-us/defender-for-identity/what-is
