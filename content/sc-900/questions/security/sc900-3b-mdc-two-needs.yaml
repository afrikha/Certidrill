id: sc900-3b-mdc-two-needs
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders runs virtual machines, databases and storage in Azure and in Amazon Web Services (AWS). The company needs hardening recommendations for the resources of both clouds, and alerts when one of these workloads is attacked. The solution must use a single product.

    Which product should Northwind Traders use?
  fr: |
    Northwind Traders exécute des machines virtuelles, des bases de données et du stockage dans Azure et dans Amazon Web Services (AWS). L'entreprise a besoin de recommandations de renforcement pour les ressources des deux clouds, et d'alertes quand l'une de ces charges de travail est attaquée. La solution doit reposer sur un seul produit.

    Quel produit Northwind Traders doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" }
    - id: b
      text: { en: "Microsoft Defender for Endpoint", fr: "Microsoft Defender pour point de terminaison" }
    - id: c
      text: Microsoft Sentinel
    - id: d
      text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" }
answer: { optionId: d }
explanation:
  correct:
    en: "Defender for Cloud combines cloud security posture management, which produces hardening recommendations, with a cloud workload protection platform, which raises security alerts for servers, databases, storage and other workloads. Both apply to Azure and to connected AWS accounts."
    fr: "Defender pour le cloud associe la gestion de la posture de sécurité cloud, qui produit des recommandations de renforcement, à une plateforme de protection des charges de travail cloud, qui émet des alertes de sécurité pour les serveurs, les bases de données, le stockage et d'autres charges de travail. Les deux s'appliquent à Azure et aux comptes AWS connectés."
  options:
    a:
      en: "Despite its similar name, Defender for Cloud Apps protects the use of SaaS applications; it does not harden virtual machines, databases or storage."
      fr: "Malgré son nom proche, Defender pour les applications cloud protège l'utilisation des applications SaaS ; il ne renforce pas les machines virtuelles, les bases de données ou le stockage."
    b:
      en: "Defender for Endpoint protects endpoints such as computers and servers; it gives no posture recommendations for databases and storage."
      fr: "Defender pour point de terminaison protège les points de terminaison comme les ordinateurs et les serveurs ; il ne donne pas de recommandations de posture pour les bases de données et le stockage."
    c:
      en: "Microsoft Sentinel is a SIEM and SOAR solution that analyzes the data it collects; it does not assess the configuration of cloud resources to produce hardening recommendations."
      fr: "Microsoft Sentinel est une solution SIEM et SOAR qui analyse les données qu'elle collecte ; elle n'évalue pas la configuration des ressources cloud pour produire des recommandations de renforcement."
references:
  - title: What is Microsoft Defender for Cloud?
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
