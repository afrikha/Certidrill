id: sc900-3a-ddos-waf-combination
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso publishes a web application from an Azure virtual network. Contoso must protect the application against network-layer floods that saturate its bandwidth, and against SQL injection.

    Which two services should Contoso use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso publie une application web depuis un réseau virtuel Azure. Contoso doit protéger l'application contre les inondations de la couche réseau qui saturent sa bande passante, et contre l'injection SQL.

    Quels sont les deux services que Contoso doit utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Azure Bastion" }
    - { id: b, text: "Azure DDoS Protection" }
    - { id: c, text: "Azure Key Vault" }
    - { id: d, text: "Azure Web Application Firewall" }
    - { id: e, text: { en: "Network security groups", fr: "Des groupes de sécurité réseau" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Azure DDoS Protection mitigates volumetric and protocol attacks at layers 3 and 4, and Azure Web Application Firewall protects the web application at layer 7 against exploits such as SQL injection. Neither covers every attack vector alone: used together, they give multi-layered protection, in line with defense in depth."
    fr: "Azure DDoS Protection atténue les attaques volumétriques et de protocole aux couches 3 et 4, et Azure Web Application Firewall protège l'application web à la couche 7 contre des attaques comme l'injection SQL. Aucun des deux ne couvre seul tous les vecteurs d'attaque : utilisés ensemble, ils apportent une protection multicouche, conforme à la défense en profondeur."
  options:
    a:
      en: "Azure Bastion provides secure RDP and SSH connectivity to virtual machines; it doesn't protect a published web application."
      fr: "Azure Bastion fournit une connectivité RDP et SSH sécurisée aux machines virtuelles ; il ne protège pas une application web publiée."
    c:
      en: "Azure Key Vault stores secrets, keys and certificates; it doesn't filter network traffic."
      fr: "Azure Key Vault stocke des secrets, des clés et des certificats ; il ne filtre pas le trafic réseau."
    e:
      en: "A network security group allows or denies traffic by IP address, port and protocol; it neither absorbs floods nor inspects HTTP requests for SQL injection."
      fr: "Un groupe de sécurité réseau autorise ou refuse le trafic par adresse IP, port et protocole ; il n'absorbe pas les inondations et n'inspecte pas les requêtes HTTP à la recherche d'injection SQL."
references:
  - title: Describe Azure DDoS protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection
  - title: Types of attacks Azure DDoS Protection mitigates
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/types-of-attacks
