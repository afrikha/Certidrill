id: sc900-3c-xdr-incident-alerts
objective: "3.4.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    An incident in Microsoft Defender XDR at Northwind Traders groups the alerts shown in the following table. Each alert was raised by a different service of the suite.

    Answer each prompt by selecting the appropriate alert.

    NOTE: Each correct selection is worth one point.
  fr: |
    Chez Northwind Traders, un incident de Microsoft Defender XDR regroupe les alertes du tableau suivant. Chaque alerte a été émise par un service différent de la suite.

    Répondez à chaque consigne en sélectionnant l'alerte appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The alert raised by Microsoft Defender for Identity", fr: "L'alerte émise par Microsoft Defender pour Identity" }
    - id: p2
      text: { en: "The alert raised by Microsoft Entra ID Protection", fr: "L'alerte émise par Microsoft Entra ID Protection" }
  grid:
    header: [{ en: "Alert", fr: "Alerte" }, { en: "Affected asset", fr: "Ressource touchée" }]
    rows:
      - [{ text: { en: "A message with a malicious link was delivered", fr: "Un message contenant un lien malveillant a été remis" }, area: a1 }, { text: { en: "Mailbox of a user", fr: "Boîte aux lettres d'un utilisateur" } }]
      - [{ text: { en: "Leaked credentials were detected for a cloud-only user account", fr: "Des informations d'identification divulguées ont été détectées pour un compte d'utilisateur cloud uniquement" }, area: a2 }, { text: { en: "Microsoft Entra user account", fr: "Compte d'utilisateur Microsoft Entra" } }]
      - [{ text: { en: "A suspicious script ran and tried to disable the antivirus", fr: "Un script suspect s'est exécuté et a tenté de désactiver l'antivirus" }, area: a3 }, { text: { en: "Windows laptop", fr: "Ordinateur portable Windows" } }]
      - [{ text: { en: "A lateral movement attempt toward a sensitive account was detected", fr: "Une tentative de mouvement latéral vers un compte sensible a été détectée" }, area: a4 }, { text: { en: "Domain controller of the on-premises Active Directory", fr: "Contrôleur de domaine d'Active Directory local" } }]
      - [{ text: { en: "A user downloaded an unusually large number of files", fr: "Un utilisateur a téléchargé un nombre inhabituel de fichiers" }, area: a5 }, { text: { en: "SaaS file storage app", fr: "Application SaaS de stockage de fichiers" } }]
answer:
  values: { p1: a4, p2: a2 }
explanation:
  correct:
    en: "Defender for Identity uses sensors on domain controllers to detect attacks on the identity infrastructure, such as lateral movement inside the on-premises Active Directory domain. Microsoft Entra ID Protection protects cloud identities: leaked credentials are one of the risks it detects for Microsoft Entra accounts. The message with a malicious link comes from Defender for Office 365, the script on the laptop from Defender for Endpoint, and the unusual download in a SaaS app from Defender for Cloud Apps."
    fr: "Defender pour Identity utilise des capteurs sur les contrôleurs de domaine pour détecter les attaques contre l'infrastructure d'identité, comme le mouvement latéral dans le domaine Active Directory local. Microsoft Entra ID Protection protège les identités cloud : les informations d'identification divulguées sont l'un des risques qu'il détecte pour les comptes Microsoft Entra. Le message contenant un lien malveillant vient de Defender pour Office 365, le script sur l'ordinateur portable de Defender pour point de terminaison, et le téléchargement inhabituel dans une application SaaS de Defender pour les applications cloud."
references:
  - title: Describe Microsoft Defender XDR services
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
