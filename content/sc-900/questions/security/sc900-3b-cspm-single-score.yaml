id: sc900-3b-cspm-single-score
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Microsoft Defender for Cloud aggregates the security findings on your cloud resources into a single value that shows your current security situation at a glance.

    What is this value called?
  fr: |
    Microsoft Defender pour le cloud agrège les résultats de sécurité de vos ressources cloud en une valeur unique qui montre d'un coup d'œil votre situation de sécurité actuelle.

    Comment s'appelle cette valeur ?
body:
  options:
    - id: a
      text: { en: "Compliance score", fr: "Score de conformité" }
    - id: b
      text: { en: "Secure score", fr: "Score de sécurité" }
    - id: c
      text: { en: "Alert severity", fr: "Gravité de l'alerte" }
    - id: d
      text: { en: "Sign-in risk level", fr: "Niveau de risque de connexion" }
answer: { optionId: b }
explanation:
  correct:
    en: "The secure score is the central feature of CSPM in Defender for Cloud. Defender for Cloud continually assesses cross-cloud resources for security issues and aggregates all the findings into this single score; the higher the score, the lower the identified risk level."
    fr: "Le score de sécurité est la fonctionnalité centrale de la CSPM dans Defender pour le cloud. Defender pour le cloud évalue en continu les ressources de tous les clouds à la recherche de problèmes de sécurité et agrège tous les résultats en ce score unique ; plus le score est élevé, plus le niveau de risque identifié est faible."
  options:
    a:
      en: "The compliance score belongs to Compliance Manager in Microsoft Purview and measures progress on regulatory improvement actions."
      fr: "Le score de conformité appartient au Gestionnaire de conformité de Microsoft Purview et mesure l'avancement des actions d'amélioration réglementaires."
    c:
      en: "A severity is attached to each individual security alert; it does not summarize the posture of all the resources."
      fr: "Une gravité est associée à chaque alerte de sécurité ; elle ne résume pas la posture de l'ensemble des ressources."
    d:
      en: "The sign-in risk level is computed by Microsoft Entra ID Protection for a sign-in, not for cloud resources."
      fr: "Le niveau de risque de connexion est calculé par Protection Microsoft Entra ID pour une connexion, pas pour des ressources cloud."
references:
  - title: Describe Cloud security posture management
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management
  - title: Secure score in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
