id: sc900-3d-mdvm-certificates-inventory
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders wants a central inventory of the digital certificates installed on its devices, in order to identify certificates before they expire and to detect weak signature algorithms.

    What should the company use?
  fr: |
    Northwind Traders veut un inventaire central des certificats numériques installés sur ses appareils, afin de repérer les certificats avant leur expiration et de détecter les algorithmes de signature faibles.

    Que doit utiliser l'entreprise ?
body:
  options:
    - id: a
      text: Azure Key Vault
    - id: b
      text: { en: "Microsoft Defender Vulnerability Management", fr: "Gestion des vulnérabilités Microsoft Defender" }
    - id: c
      text: "Microsoft Entra ID Protection"
    - id: d
      text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" }
answer: { optionId: b }
explanation:
  correct:
    en: "The continuous asset discovery of Defender Vulnerability Management builds consolidated inventories of software, digital certificates, browser extensions, hardware and firmware. Its digital certificates assessment lists the certificates found across the organization on one page, points out those that are about to expire and detects weak signature algorithms."
    fr: "La détection continue des ressources de la Gestion des vulnérabilités Microsoft Defender constitue des inventaires consolidés des logiciels, des certificats numériques, des extensions de navigateur, du matériel et des microprogrammes. Son évaluation des certificats numériques liste sur une seule page les certificats trouvés dans l'organisation, signale ceux qui vont expirer et détecte les algorithmes de signature faibles."
  options:
    a:
      en: "Azure Key Vault stores and manages the secrets, keys and certificates that applications use; it does not inventory the certificates installed on devices."
      fr: "Azure Key Vault stocke et gère les secrets, les clés et les certificats utilisés par les applications ; il ne fait pas l'inventaire des certificats installés sur les appareils."
    c:
      en: "Microsoft Entra ID Protection detects risky sign-ins and risky users; it does not examine certificates on devices."
      fr: "Microsoft Entra ID Protection détecte les connexions à risque et les utilisateurs à risque ; il n'examine pas les certificats des appareils."
    d:
      en: "Defender for Cloud Apps gives visibility over SaaS applications and their data, not over what is installed on devices."
      fr: "Defender pour les applications cloud apporte de la visibilité sur les applications SaaS et leurs données, pas sur ce qui est installé sur les appareils."
references:
  - title: Describe Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6a-describe-defender-vulnerability-management
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
