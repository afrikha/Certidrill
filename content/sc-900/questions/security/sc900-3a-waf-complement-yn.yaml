id: sc900-3a-waf-complement-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Azure Web Application Firewall (WAF), select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Web Application Firewall (WAF), sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "WAF on Azure Application Gateway provides regional protection for the applications behind the gateway."
        fr: "WAF sur Azure Application Gateway apporte une protection régionale aux applications situées derrière la passerelle."
    - id: s2
      text:
        en: "Azure WAF and Azure DDoS Protection can be used together to protect the same web application."
        fr: "Azure WAF et Azure DDoS Protection peuvent être utilisés ensemble pour protéger la même application web."
    - id: s3
      text:
        en: "Azure WAF filters the outbound traffic of virtual machines by fully qualified domain name."
        fr: "Azure WAF filtre le trafic sortant des machines virtuelles par nom de domaine complet."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "On Azure Application Gateway, WAF protects the applications behind the gateway in one region, whereas WAF on Azure Front Door gives global protection. WAF (layer 7) and Azure DDoS Protection (layers 3 and 4) are designed to be combined, for multi-layered protection. WAF inspects the requests sent to web applications; filtering outbound traffic by fully qualified domain name is a capability of Azure Firewall."
    fr: "Sur Azure Application Gateway, WAF protège les applications situées derrière la passerelle dans une région, alors que WAF sur Azure Front Door apporte une protection mondiale. WAF (couche 7) et Azure DDoS Protection (couches 3 et 4) sont conçus pour être associés, pour une protection multicouche. WAF inspecte les requêtes envoyées aux applications web ; le filtrage du trafic sortant par nom de domaine complet est une fonctionnalité du Pare-feu Azure."
  options:
    s3:
      en: "This describes the application rules of Azure Firewall. WAF deals with the requests that arrive at a web application."
      fr: "Cela décrit les règles d'application du Pare-feu Azure. WAF s'occupe des requêtes qui arrivent sur une application web."
references:
  - title: Describe Web Application Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/4-describe-web-application-firewall
  - title: Describe Azure Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall
