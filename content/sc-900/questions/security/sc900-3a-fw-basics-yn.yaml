id: sc900-3a-fw-basics-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Firewall, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le Pare-feu Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Azure Firewall can span multiple availability zones."
        fr: "Le Pare-feu Azure peut s'étendre sur plusieurs zones de disponibilité."
    - id: s2
      text:
        en: "The logs of Azure Firewall can be sent to Azure Monitor."
        fr: "Les journaux du Pare-feu Azure peuvent être envoyés à Azure Monitor."
    - id: s3
      text:
        en: "To make Azure Firewall highly available, you must deploy additional load balancers."
        fr: "Pour rendre le Pare-feu Azure hautement disponible, vous devez déployer des équilibreurs de charge supplémentaires."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Azure Firewall can span multiple availability zones for more resilience. Its logs can be sent to Azure Monitor, to a Log Analytics workspace or to Event Hubs in order to track activity and diagnose issues. High availability is built into the service, so no additional load balancer is needed."
    fr: "Le Pare-feu Azure peut s'étendre sur plusieurs zones de disponibilité pour plus de résilience. Ses journaux peuvent être envoyés à Azure Monitor, à un espace de travail Log Analytics ou à Event Hubs pour suivre l'activité et diagnostiquer les problèmes. La haute disponibilité est intégrée au service : aucun équilibreur de charge supplémentaire n'est nécessaire."
  options:
    s3:
      en: "Redundancy is included in the service: high availability doesn't depend on load balancers that you would add."
      fr: "La redondance est incluse dans le service : la haute disponibilité ne dépend pas d'équilibreurs de charge que vous ajouteriez."
references:
  - title: Describe Azure Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall
  - title: Azure Firewall features by SKU
    url: https://learn.microsoft.com/en-us/azure/firewall/features
