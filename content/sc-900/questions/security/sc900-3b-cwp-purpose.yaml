id: sc900-3b-cwp-purpose
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the purpose of the cloud workload protection capabilities of Microsoft Defender for Cloud?
  fr: |
    À quoi servent les fonctionnalités de protection des charges de travail cloud de Microsoft Defender pour le cloud ?
body:
  options:
    - id: a
      text: { en: "To detect and resolve threats to resources, workloads and services", fr: "À détecter et à résoudre les menaces qui visent les ressources, les charges de travail et les services" }
    - id: b
      text: { en: "To classify and label the sensitive documents of the organization", fr: "À classifier et à étiqueter les documents sensibles de l'organisation" }
    - id: c
      text: { en: "To review periodically the access rights of users and guests", fr: "À réviser périodiquement les droits d'accès des utilisateurs et des invités" }
    - id: d
      text: { en: "To publish the audit reports of the Microsoft cloud services", fr: "À publier les rapports d'audit des services cloud de Microsoft" }
answer: { optionId: a }
explanation:
  correct:
    en: "Through its cloud workload protection capabilities, Defender for Cloud detects and helps resolve threats to resources, workloads and services. These protections are delivered by Microsoft Defender plans that are specific to the types of resources in your subscriptions."
    fr: "Grâce à ses fonctionnalités de protection des charges de travail cloud, Defender pour le cloud détecte les menaces qui visent les ressources, les charges de travail et les services, et aide à les résoudre. Ces protections sont fournies par des plans Microsoft Defender propres aux types de ressources de vos abonnements."
  options:
    b:
      en: "Classifying and labeling documents is done with sensitivity labels in Microsoft Purview."
      fr: "La classification et l'étiquetage des documents se font avec les étiquettes de confidentialité de Microsoft Purview."
    c:
      en: "Reviewing access rights periodically is the role of access reviews in Microsoft Entra ID Governance."
      fr: "La révision périodique des droits d'accès est le rôle des révisions d'accès de Gouvernance Microsoft Entra ID."
    d:
      en: "Audit reports about Microsoft cloud services are published in the Service Trust Portal."
      fr: "Les rapports d'audit sur les services cloud de Microsoft sont publiés dans le Portail d'approbation des services."
references:
  - title: Describe the enhanced security of Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
