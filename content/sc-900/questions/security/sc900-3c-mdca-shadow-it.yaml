id: sc900-3c-mdca-shadow-it
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The IT department of Proseware suspects that employees use cloud apps that it has never approved. It wants to identify the cloud apps that are really in use, based on the organization's network traffic.

    Which Microsoft Defender for Cloud Apps capability should the IT department use?
  fr: |
    Le service informatique de Proseware soupçonne des employés d'utiliser des applications cloud qu'il n'a jamais approuvées. Il veut identifier les applications cloud réellement utilisées, à partir du trafic réseau de l'organisation.

    Quelle fonctionnalité de Microsoft Defender pour les applications cloud le service informatique doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "App governance", fr: "La gouvernance des applications (app governance)" }
    - id: b
      text: { en: "Cloud discovery", fr: "La découverte du cloud (cloud discovery)" }
    - id: c
      text: { en: "Conditional Access app control", fr: "Le contrôle d'application par accès conditionnel (Conditional Access app control)" }
    - id: d
      text: { en: "SaaS security posture management (SSPM)", fr: "La gestion de la posture de sécurité SaaS (SSPM)" }
answer: { optionId: b }
explanation:
  correct:
    en: "Cloud discovery analyzes network traffic data against an extensive catalog of cloud apps to identify the apps that users access across the organization, including unapproved ones, known as shadow IT. Each discovered app is then assessed against more than 90 risk indicators."
    fr: "La découverte du cloud analyse les données du trafic réseau en les comparant à un vaste catalogue d'applications cloud pour identifier les applications auxquelles les utilisateurs accèdent dans toute l'organisation, y compris celles qui ne sont pas approuvées, l'informatique fantôme (shadow IT). Chaque application découverte est ensuite évaluée selon plus de 90 indicateurs de risque."
  options:
    a:
      en: "App governance gives visibility and control over OAuth apps that access data on behalf of users; it does not find apps from network traffic."
      fr: "La gouvernance des applications apporte visibilité et contrôle sur les applications OAuth qui accèdent aux données au nom des utilisateurs ; elle ne repère pas les applications à partir du trafic réseau."
    c:
      en: "Conditional Access app control monitors and controls sessions in apps that are already known and onboarded; it does not discover unknown apps."
      fr: "Le contrôle d'application par accès conditionnel surveille et contrôle les sessions dans des applications déjà connues et intégrées ; il ne découvre pas les applications inconnues."
    d:
      en: "SaaS security posture management surfaces misconfigurations of connected apps; it assumes the apps are known and connected."
      fr: "La gestion de la posture de sécurité SaaS fait ressortir les erreurs de configuration des applications connectées ; elle suppose que les applications sont connues et connectées."
references:
  - title: Describe Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/5-describe-microsoft-cloud-app-security
  - title: Cloud app discovery overview
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/set-up-cloud-discovery
