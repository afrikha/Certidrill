id: sc900-3c-mde-experts-hunting
objective: "3.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The security operations center of Northwind Traders is understaffed. The company wants Microsoft to hunt proactively for threats in its endpoint data on its behalf, and to give the analysts prioritized findings with additional context.

    What should Northwind Traders use?
  fr: |
    Le centre des opérations de sécurité de Northwind Traders manque de personnel. L'entreprise veut que Microsoft recherche à sa place, de façon proactive, les menaces dans les données de ses points de terminaison, et fournisse aux analystes des résultats hiérarchisés avec du contexte supplémentaire.

    Que doit utiliser Northwind Traders ?
body:
  options:
    - id: a
      text: { en: "Advanced hunting in the Microsoft Defender portal", fr: "Le repérage avancé (advanced hunting) du portail Microsoft Defender" }
    - id: b
      text: { en: "Hunting queries in Microsoft Sentinel", fr: "Les requêtes de repérage de Microsoft Sentinel" }
    - id: c
      text: "Microsoft Defender Experts for Hunting"
    - id: d
      text: { en: "Automated investigation and remediation in Microsoft Defender for Endpoint", fr: "L'investigation et la correction automatisées de Microsoft Defender pour point de terminaison" }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft Defender Experts for Hunting is a managed threat hunting service: Microsoft experts hunt proactively, prioritize what they find and add context and insights, which helps a security operations center identify and respond to threats quickly and accurately. The other options are tools that the company's own analysts or algorithms operate."
    fr: "Microsoft Defender Experts for Hunting est un service managé de repérage des menaces : des experts de Microsoft recherchent les menaces de façon proactive, hiérarchisent ce qu'ils trouvent et ajoutent du contexte et des analyses, ce qui aide un centre des opérations de sécurité à identifier les menaces et à y répondre vite et avec précision. Les autres options sont des outils que les analystes de l'entreprise ou des algorithmes font fonctionner."
  options:
    a:
      en: "Advanced hunting is a query tool: the company's own analysts must write and run the queries over the raw data."
      fr: "Le repérage avancé est un outil de requête : ce sont les analystes de l'entreprise qui doivent écrire et exécuter les requêtes sur les données brutes."
    b:
      en: "Hunting queries in Microsoft Sentinel are also run by the organization's analysts; no Microsoft expert hunts on their behalf."
      fr: "Les requêtes de repérage de Microsoft Sentinel sont elles aussi exécutées par les analystes de l'organisation ; aucun expert de Microsoft ne recherche les menaces à leur place."
    d:
      en: "Automated investigation and remediation uses inspection algorithms to examine alerts and resolve breaches; it is automation, not a service delivered by human experts."
      fr: "L'investigation et la correction automatisées utilisent des algorithmes d'inspection pour examiner les alertes et résoudre les violations ; c'est de l'automatisation, pas un service rendu par des experts humains."
references:
  - title: Describe Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/4-describe-defender-endpoint
