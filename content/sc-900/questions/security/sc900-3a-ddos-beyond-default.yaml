id: sc900-3a-ddos-beyond-default
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Every Azure service already benefits from the default DDoS infrastructure protection of the Azure platform.

    What does DDoS Network Protection add to this default protection?
  fr: |
    Tous les services Azure bénéficient déjà de la protection d'infrastructure DDoS par défaut de la plateforme Azure.

    Qu'est-ce que DDoS Network Protection ajoute à cette protection par défaut ?
body:
  options:
    - id: a
      text: { en: "Mitigation of common network-layer attacks against Azure services", fr: "L'atténuation des attaques courantes de la couche réseau contre les services Azure" }
    - id: b
      text: { en: "Inspection of HTTP requests to block SQL injection", fr: "L'inspection des requêtes HTTP pour bloquer l'injection SQL" }
    - id: c
      text: { en: "Filtering of outbound traffic by fully qualified domain name", fr: "Le filtrage du trafic sortant par nom de domaine complet" }
    - id: d
      text: { en: "Attack telemetry and alerts, with mitigation tuned to the application's traffic", fr: "La télémétrie et les alertes sur les attaques, avec une atténuation réglée sur le trafic de l'application" }
answer: { optionId: d }
explanation:
  correct:
    en: "The default infrastructure protection uses a threshold that is higher than what most applications can handle, and it provides no telemetry or alerting. Azure DDoS Protection adds dedicated monitoring, a traffic profile tuned to the protected application, and metrics and alerts before, during and after an attack."
    fr: "La protection d'infrastructure par défaut utilise un seuil plus élevé que ce que la plupart des applications peuvent supporter, et elle ne fournit ni télémétrie ni alertes. Azure DDoS Protection ajoute une surveillance dédiée, un profil de trafic réglé sur l'application protégée, ainsi que des métriques et des alertes avant, pendant et après une attaque."
  options:
    a:
      en: "The default infrastructure protection already defends Azure services against common network-layer attacks; this isn't an addition."
      fr: "La protection d'infrastructure par défaut défend déjà les services Azure contre les attaques courantes de la couche réseau ; ce n'est pas un ajout."
    b:
      en: "Inspecting HTTP requests is the role of Azure Web Application Firewall; Azure DDoS Protection works at layers 3 and 4."
      fr: "L'inspection des requêtes HTTP est le rôle d'Azure Web Application Firewall ; Azure DDoS Protection travaille aux couches 3 et 4."
    c:
      en: "Filtering outbound traffic by fully qualified domain name is a capability of Azure Firewall."
      fr: "Le filtrage du trafic sortant par nom de domaine complet est une fonctionnalité du Pare-feu Azure."
references:
  - title: Describe Azure DDoS protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection
  - title: About Azure DDoS Protection Tier Comparison
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison
