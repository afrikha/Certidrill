id: sc900-3c-mdca-info-protection-multi
objective: "3.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam connects its SaaS applications to Microsoft Defender for Cloud Apps and finds files that contain sensitive data.

    Which two controls can Microsoft Defender for Cloud Apps apply to protect these files?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam connecte ses applications SaaS à Microsoft Defender pour les applications cloud et y trouve des fichiers qui contiennent des données sensibles.

    Quels sont les deux contrôles que Microsoft Defender pour les applications cloud peut appliquer pour protéger ces fichiers ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Open the files in a virtual environment to detonate them", fr: "Ouvrir les fichiers dans un environnement virtuel pour les faire détoner" }
    - id: b
      text: { en: "Block the download of the files to unmanaged devices", fr: "Bloquer le téléchargement des fichiers vers les appareils non gérés" }
    - id: c
      text: { en: "Install a sensor on the domain controllers", fr: "Installer un capteur sur les contrôleurs de domaine" }
    - id: d
      text: { en: "Isolate from the network the devices that hold the files", fr: "Isoler du réseau les appareils qui contiennent les fichiers" }
    - id: e
      text: { en: "Apply a sensitivity label to the files", fr: "Appliquer une étiquette de confidentialité aux fichiers" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "The information protection capabilities of Defender for Cloud Apps scan connected apps for files that hold sensitive data, then apply controls: add a sensitivity label, block downloads to an unmanaged device, or remove external collaborators from confidential files."
    fr: "Les fonctionnalités de protection des informations de Defender pour les applications cloud recherchent dans les applications connectées les fichiers qui contiennent des données sensibles, puis appliquent des contrôles : ajouter une étiquette de confidentialité, bloquer les téléchargements vers un appareil non géré ou retirer les collaborateurs externes des fichiers confidentiels."
  options:
    a:
      en: "Detonation in a virtual environment is how Safe Attachments in Defender for Office 365 looks for malware; it does not protect sensitive data."
      fr: "La détonation dans un environnement virtuel est la façon dont Pièces jointes sécurisées (Safe Attachments), dans Defender pour Office 365, recherche les programmes malveillants ; elle ne protège pas les données sensibles."
    c:
      en: "Sensors on domain controllers belong to Defender for Identity, which watches the identity infrastructure."
      fr: "Les capteurs sur les contrôleurs de domaine relèvent de Defender pour Identity, qui surveille l'infrastructure d'identité."
    d:
      en: "Isolating a device is a response action of Defender for Endpoint against a compromised device."
      fr: "Isoler un appareil est une action de réponse de Defender pour point de terminaison face à un appareil compromis."
references:
  - title: Describe Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/5-describe-microsoft-cloud-app-security
