id: sc900-3d-mdvm-basics-yn
objective: "3.4.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender Vulnerability Management, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la Gestion des vulnérabilités Microsoft Defender, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Defender Vulnerability Management is used to discover the SaaS applications that employees access."
        fr: "La Gestion des vulnérabilités Microsoft Defender sert à découvrir les applications SaaS auxquelles les employés accèdent."
    - id: s2
      text:
        en: "Microsoft Defender Vulnerability Management covers devices that run macOS and Linux, in addition to Windows."
        fr: "La Gestion des vulnérabilités Microsoft Defender couvre les appareils qui exécutent macOS et Linux, en plus de Windows."
    - id: s3
      text:
        en: "Microsoft Defender Vulnerability Management uses threat intelligence and breach likelihood predictions to prioritize vulnerabilities."
        fr: "La Gestion des vulnérabilités Microsoft Defender utilise le renseignement sur les menaces et des prédictions de probabilité de violation pour hiérarchiser les vulnérabilités."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Discovering the SaaS applications in use is the cloud discovery capability of Microsoft Defender for Cloud Apps. Defender Vulnerability Management gives asset visibility and assessments for Windows, macOS, Linux, Android, iOS and network devices. To decide what to fix first, it relies on Microsoft threat intelligence, breach likelihood predictions, business context and device assessments."
    fr: "La découverte des applications SaaS utilisées est la fonctionnalité de découverte du cloud de Microsoft Defender pour les applications cloud. La Gestion des vulnérabilités Microsoft Defender apporte la visibilité sur les ressources et des évaluations pour Windows, macOS, Linux, Android, iOS et les appareils réseau. Pour décider quoi corriger en premier, elle s'appuie sur le renseignement sur les menaces de Microsoft, des prédictions de probabilité de violation, le contexte métier et l'évaluation des appareils."
references:
  - title: Describe Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6a-describe-defender-vulnerability-management
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
