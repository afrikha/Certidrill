id: sc900-3b-cwp-plans-yn
objective: "3.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the Microsoft Defender plans of Microsoft Defender for Cloud, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les plans Microsoft Defender de Microsoft Defender pour le cloud, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Defender plans are specific to the types of resources in your subscriptions.
        fr: Les plans Defender sont propres aux types de ressources de vos abonnements.
    - id: s2
      text:
        en: The Defender plans are included in the free Foundational CSPM plan.
        fr: Les plans Defender sont inclus dans le plan gratuit CSPM de base (Foundational CSPM).
    - id: s3
      text:
        en: Several Defender plans can be enabled separately and run at the same time.
        fr: Plusieurs plans Defender peuvent être activés séparément et fonctionner en même temps.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Cloud workload protection is delivered through Defender plans specific to resource types, such as servers, storage or databases. These plans are paid plans that add enhanced security features; Foundational CSPM only covers continuous assessment, recommendations and the secure score. The plans can be enabled separately and run simultaneously to defend the compute, data and service layers."
    fr: "La protection des charges de travail cloud est fournie par des plans Defender propres aux types de ressources, comme les serveurs, le stockage ou les bases de données. Ces plans sont payants et ajoutent des fonctionnalités de sécurité améliorées ; le CSPM de base ne couvre que l'évaluation continue, les recommandations et le score de sécurité. Les plans peuvent être activés séparément et fonctionner simultanément pour défendre les couches de calcul, de données et de services."
references:
  - title: Describe the enhanced security of Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
  - title: What is Microsoft Defender for Cloud?
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
