id: sc900-3b-bastion-tls-scope-yn
objective: "3.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Bastion sessions use TLS on port 443 and pass through corporate firewalls that allow standard HTTPS traffic.
        fr: Les sessions Azure Bastion utilisent TLS sur le port 443 et traversent les pare-feu d'entreprise qui autorisent le trafic HTTPS standard.
    - id: s2
      text:
        en: Azure Bastion filters the network traffic between the subnets of a virtual network.
        fr: Azure Bastion filtre le trafic réseau entre les sous-réseaux d'un réseau virtuel.
    - id: s3
      text:
        en: A single Azure Bastion deployment can serve all the virtual machines of the virtual network in which it is provisioned.
        fr: Un seul déploiement d'Azure Bastion peut desservir toutes les machines virtuelles du réseau virtuel dans lequel il est approvisionné.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Whatever the connection method, Bastion traffic goes over TLS on port 443, so it crosses corporate firewalls that allow HTTPS without opening other ports. Bastion provides RDP and SSH connectivity; filtering traffic between subnets is the job of network security groups or Azure Firewall. Bastion is deployed per virtual network, not per virtual machine: all the virtual machines of that network can use it."
    fr: "Quelle que soit la méthode de connexion, le trafic Bastion passe par TLS sur le port 443 : il traverse donc les pare-feu d'entreprise qui autorisent HTTPS, sans ouvrir d'autres ports. Bastion fournit une connectivité RDP et SSH ; filtrer le trafic entre sous-réseaux est le rôle des groupes de sécurité réseau ou du Pare-feu Azure. Bastion se déploie par réseau virtuel et non par machine virtuelle : toutes les machines virtuelles de ce réseau peuvent l'utiliser."
references:
  - title: Describe Azure Bastion
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/7-describe-azure-bastion-just-in-time-access
