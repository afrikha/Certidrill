id: sc900-3a-ddos-attack-name
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Thousands of compromised devices send traffic to the public website of Litware at the same time, until customers can no longer reach it.

    Which type of attack is this?
  fr: |
    Des milliers d'appareils compromis envoient en même temps du trafic vers le site web public de Litware, jusqu'à ce que les clients ne puissent plus y accéder.

    De quel type d'attaque s'agit-il ?
body:
  options:
    - id: a
      text: { en: "A brute-force attack on user passwords", fr: "Une attaque par force brute sur les mots de passe" }
    - id: b
      text: { en: "A phishing attack that targets employees", fr: "Une attaque par hameçonnage visant les employés" }
    - id: c
      text: { en: "A distributed denial-of-service (DDoS) attack", fr: "Une attaque par déni de service distribué (DDoS)" }
    - id: d
      text: { en: "A SQL injection attack on the database", fr: "Une attaque par injection SQL sur la base de données" }
answer: { optionId: c }
explanation:
  correct:
    en: "A distributed denial-of-service attack overwhelms the resources of an application or a server from many sources at once, so that it becomes slow or unresponsive for genuine users. It usually targets a public-facing endpoint that can be reached through the internet."
    fr: "Une attaque par déni de service distribué submerge les ressources d'une application ou d'un serveur depuis de nombreuses sources à la fois, de sorte qu'elle devient lente ou ne répond plus aux utilisateurs légitimes. Elle vise en général un point de terminaison public, accessible depuis internet."
  options:
    a:
      en: "A brute-force attack tries many passwords to break into an account; its goal is access, not the saturation of a service."
      fr: "Une attaque par force brute essaie de nombreux mots de passe pour pénétrer dans un compte ; son but est l'accès, pas la saturation d'un service."
    b:
      en: "A phishing attack tricks a person into revealing credentials or other information, typically through a fraudulent message."
      fr: "Une attaque par hameçonnage pousse une personne à révéler des informations d'identification ou d'autres informations, en général par un message frauduleux."
    d:
      en: "A SQL injection attack inserts malicious code into the input fields of an application to read or change its database; it doesn't rely on the volume of traffic."
      fr: "Une attaque par injection SQL insère du code malveillant dans les champs de saisie d'une application pour lire ou modifier sa base de données ; elle ne repose pas sur le volume de trafic."
references:
  - title: Describe Azure DDoS protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection
