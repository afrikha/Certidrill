id: sc900-3b-cwp-features-yn
objective: "3.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the enhanced security features of Microsoft Defender for Cloud, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les fonctionnalités de sécurité améliorées de Microsoft Defender pour le cloud, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Defender for Databases protects Azure SQL databases only.
        fr: Defender for Databases protège uniquement les bases de données Azure SQL.
    - id: s2
      text:
        en: After Amazon Web Services (AWS) and Google Cloud Platform (GCP) accounts are connected, the workloads on those platforms can be protected.
        fr: Une fois les comptes Amazon Web Services (AWS) et Google Cloud Platform (GCP) connectés, les charges de travail de ces plateformes peuvent être protégées.
    - id: s3
      text:
        en: Vulnerability scanning is available for virtual machines and container registries.
        fr: L'analyse des vulnérabilités est disponible pour les machines virtuelles et les registres de conteneurs.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Defender for Databases protects the whole database estate: Azure SQL, open-source relational databases and Azure Cosmos DB. Multicloud security lets you connect AWS and GCP accounts to protect the resources and workloads on those platforms. Vulnerability scanning covers virtual machines, container registries and SQL resources, with the findings shown in Defender for Cloud."
    fr: "Defender for Databases protège l'ensemble du parc de bases de données : Azure SQL, les bases de données relationnelles open source et Azure Cosmos DB. La sécurité multicloud permet de connecter des comptes AWS et GCP pour protéger les ressources et les charges de travail de ces plateformes. L'analyse des vulnérabilités couvre les machines virtuelles, les registres de conteneurs et les ressources SQL, et ses résultats s'affichent dans Defender pour le cloud."
references:
  - title: Describe the enhanced security of Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
