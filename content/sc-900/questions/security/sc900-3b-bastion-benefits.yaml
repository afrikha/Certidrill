id: sc900-3b-bastion-benefits
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two benefits does Azure Bastion provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux avantages apportés par Azure Bastion ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Secrets used by applications are rotated automatically.", fr: "Les secrets utilisés par les applications sont renouvelés automatiquement." } }
    - { id: b, text: { en: "Virtual machines are protected against port scanning from the internet.", fr: "Les machines virtuelles sont protégées contre l'analyse des ports depuis Internet." } }
    - { id: c, text: { en: "Web applications are protected against SQL injection attacks.", fr: "Les applications web sont protégées contre les attaques par injection SQL." } }
    - { id: d, text: { en: "Volumetric attacks against public IP addresses are absorbed.", fr: "Les attaques volumétriques contre les adresses IP publiques sont absorbées." } }
    - { id: e, text: { en: "Remote access is hardened in one place, kept up to date by Azure.", fr: "L'accès à distance est renforcé en un seul endroit, tenu à jour par Azure." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "With Azure Bastion, the virtual machines are not exposed to the internet, which protects them against port scanning by malicious users outside the virtual network. Bastion sits at the perimeter of the virtual network and is kept hardened and up to date by the Azure platform, so you do not harden the remote access of each virtual machine individually."
    fr: "Avec Azure Bastion, les machines virtuelles ne sont pas exposées à Internet, ce qui les protège contre l'analyse des ports par des utilisateurs malveillants extérieurs au réseau virtuel. Bastion se place au périmètre du réseau virtuel et la plateforme Azure le maintient renforcé et à jour : vous ne renforcez donc pas l'accès à distance de chaque machine virtuelle une par une."
  options:
    a: { en: "Managing application secrets is the role of Azure Key Vault, not of Azure Bastion.", fr: "La gestion des secrets d'application est le rôle d'Azure Key Vault, pas d'Azure Bastion." }
    c: { en: "Protection of web applications against SQL injection comes from Azure Web Application Firewall.", fr: "La protection des applications web contre l'injection SQL relève d'Azure Web Application Firewall." }
    d: { en: "Mitigating volumetric attacks is the role of Azure DDoS Protection.", fr: "L'atténuation des attaques volumétriques est le rôle d'Azure DDoS Protection." }
references:
  - title: Describe Azure Bastion
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/7-describe-azure-bastion-just-in-time-access
