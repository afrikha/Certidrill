id: sc900-3a-nsg-default-rules-yn
objective: "3.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You create a network security group (NSG) and add no security rule to it. You associate the NSG with a subnet.

    For each of the following statements about the default rules of the NSG, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un groupe de sécurité réseau (NSG) sans y ajouter de règle de sécurité. Vous associez le NSG à un sous-réseau.

    Pour chacune des affirmations suivantes sur les règles par défaut du NSG, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The default rules allow inbound traffic that comes from the internet."
        fr: "Les règles par défaut autorisent le trafic entrant qui vient d'internet."
    - id: s2
      text:
        en: "The default rules allow inbound traffic that comes from other resources of the virtual network."
        fr: "Les règles par défaut autorisent le trafic entrant qui vient d'autres ressources du réseau virtuel."
    - id: s3
      text:
        en: "The default rules deny outbound traffic to the internet."
        fr: "Les règles par défaut refusent le trafic sortant vers internet."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Azure creates three inbound and three outbound default rules in every NSG. Inbound, traffic from the virtual network (AllowVnetInBound) and from the Azure load balancer is allowed, and everything else, including traffic from the internet, is denied (DenyAllInBound). Outbound, traffic to the virtual network and to the internet (AllowInternetOutBound) is allowed, and the rest is denied."
    fr: "Azure crée trois règles par défaut entrantes et trois sortantes dans chaque NSG. En entrée, le trafic venant du réseau virtuel (AllowVnetInBound) et de l'équilibreur de charge Azure est autorisé, et tout le reste, y compris le trafic venant d'internet, est refusé (DenyAllInBound). En sortie, le trafic vers le réseau virtuel et vers internet (AllowInternetOutBound) est autorisé, et le reste est refusé."
  options:
    s1:
      en: "Inbound traffic from the internet matches only DenyAllInBound; it must be allowed by a rule that you add."
      fr: "Le trafic entrant venant d'internet ne correspond qu'à DenyAllInBound ; il doit être autorisé par une règle que vous ajoutez."
    s3:
      en: "The default rule AllowInternetOutBound allows outbound traffic to the internet; you add a rule with a higher priority to deny it."
      fr: "La règle par défaut AllowInternetOutBound autorise le trafic sortant vers internet ; pour le refuser, vous ajoutez une règle de priorité plus élevée."
references:
  - title: Describe Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/6-describe-azure-network-security-groups
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
