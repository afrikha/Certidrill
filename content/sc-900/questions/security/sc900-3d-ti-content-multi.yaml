id: sc900-3d-ti-content-multi
objective: "3.4.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two types of information does Microsoft Threat Intelligence provide to security analysts?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux types d'informations que Microsoft Threat Intelligence fournit aux analystes de sécurité ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Knowledge about tracked threat actors and the tools that they use", fr: "Des connaissances sur les acteurs de menace suivis et les outils qu'ils utilisent" }
    - id: b
      text: { en: "The compliance score of the organization against a regulation", fr: "Le score de conformité de l'organisation par rapport à une réglementation" }
    - id: c
      text: { en: "The list of users who are eligible for privileged directory roles", fr: "La liste des utilisateurs éligibles à des rôles d'annuaire privilégiés" }
    - id: d
      text: { en: "Articles about attacks, linked to their indicators of compromise", fr: "Des articles sur des attaques, reliés à leurs indicateurs de compromission" }
    - id: e
      text: { en: "The retention period that applies to each mailbox of the tenant", fr: "La période de rétention qui s'applique à chaque boîte aux lettres du locataire" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Microsoft Threat Intelligence gathers what Microsoft knows about threat actors, their tools and the vulnerabilities that they exploit, and keeps it up to date. It also publishes articles about threat actors, tooling, attacks and vulnerabilities, each connected to the key indicators of compromise that analysts can then investigate."
    fr: "Microsoft Threat Intelligence rassemble ce que Microsoft sait des acteurs de menace, de leurs outils et des vulnérabilités qu'ils exploitent, et le tient à jour. Il publie aussi des articles sur les acteurs de menace, les outils, les attaques et les vulnérabilités, chacun relié aux principaux indicateurs de compromission que les analystes peuvent ensuite examiner."
  options:
    b:
      en: "The compliance score is calculated by Compliance Manager in Microsoft Purview."
      fr: "Le score de conformité est calculé par le Gestionnaire de conformité de Microsoft Purview."
    c:
      en: "Eligible role assignments are managed in Microsoft Entra Privileged Identity Management."
      fr: "Les attributions de rôles éligibles se gèrent dans Microsoft Entra Privileged Identity Management."
    e:
      en: "Retention periods come from the retention policies and retention labels of Microsoft Purview."
      fr: "Les périodes de rétention viennent des stratégies de rétention et des étiquettes de rétention de Microsoft Purview."
references:
  - title: Describe Microsoft Defender Threat Intelligence
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6b-describe-defender-threat-intelligence
  - title: Threat intelligence in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/defender-threat-intelligence
