id: sc900-3b-bastion-basics-yn
objective: "3.1.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A virtual machine needs a public IP address to accept connections made through Azure Bastion.
        fr: Une machine virtuelle a besoin d'une adresse IP publique pour accepter les connexions établies via Azure Bastion.
    - id: s2
      text:
        en: With Azure Bastion, you can open an RDP or SSH session to a virtual machine from the Azure portal, in a browser.
        fr: Avec Azure Bastion, vous pouvez ouvrir une session RDP ou SSH sur une machine virtuelle depuis le portail Azure, dans un navigateur.
    - id: s3
      text:
        en: An agent must be installed on each virtual machine that you connect to through Azure Bastion.
        fr: Un agent doit être installé sur chaque machine virtuelle à laquelle vous vous connectez via Azure Bastion.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Azure Bastion connects to a virtual machine through its private IP address, so the virtual machine needs no public IP address. The session opens in the Azure portal in an HTML5 web client. The virtual machines need neither an agent nor special client software."
    fr: "Azure Bastion se connecte à une machine virtuelle par son adresse IP privée : la machine virtuelle n'a donc besoin d'aucune adresse IP publique. La session s'ouvre dans le portail Azure, dans un client web HTML5. Les machines virtuelles n'ont besoin ni d'un agent ni d'un logiciel client particulier."
references:
  - title: Describe Azure Bastion
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/7-describe-azure-bastion-just-in-time-access
