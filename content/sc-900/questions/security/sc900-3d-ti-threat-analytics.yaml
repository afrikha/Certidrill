id: sc900-3d-ti-threat-analytics
objective: "3.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team of Woodgrove Bank hears about a new ransomware campaign. The team wants a report written by Microsoft security researchers that analyzes the threat and shows whether it is active in the bank's network and whether the applicable protections are in place.

    What should the team use in the Microsoft Defender portal?
  fr: |
    L'équipe de sécurité de Woodgrove Bank entend parler d'une nouvelle campagne de rançongiciel. Elle veut un rapport rédigé par les chercheurs en sécurité de Microsoft, qui analyse la menace et montre si elle est active dans le réseau de la banque et si les protections applicables sont en place.

    Que doit utiliser l'équipe dans le portail Microsoft Defender ?
body:
  options:
    - id: a
      text: { en: "Attack simulation training", fr: "La formation à la simulation d'attaque" }
    - id: b
      text: { en: "Advanced hunting", fr: "Le repérage avancé (advanced hunting)" }
    - id: c
      text: { en: "Threat analytics", fr: "L'analyse des menaces (threat analytics)" }
    - id: d
      text: { en: "Microsoft Secure Score", fr: "Le Degré de sécurisation Microsoft (Microsoft Secure Score)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Threat analytics is the in-product threat intelligence written by Microsoft security researchers. Each report analyzes a tracked threat, gives defensive guidance and adds data from the organization's own network, which tells whether the threat is active there and whether the applicable protections are in place."
    fr: "L'analyse des menaces est le renseignement sur les menaces intégré au produit et rédigé par les chercheurs en sécurité de Microsoft. Chaque rapport analyse une menace suivie, donne des conseils de défense et ajoute des données du réseau de l'organisation, ce qui indique si la menace y est active et si les protections applicables sont en place."
  options:
    a:
      en: "Attack simulation training runs simulated attacks to train users; it does not report on real campaigns."
      fr: "La formation à la simulation d'attaque exécute des attaques simulées pour former les utilisateurs ; elle ne rend pas compte des campagnes réelles."
    b:
      en: "Advanced hunting lets analysts query raw data themselves; it is not a report written by Microsoft researchers."
      fr: "Le repérage avancé permet aux analystes d'interroger eux-mêmes les données brutes ; ce n'est pas un rapport rédigé par les chercheurs de Microsoft."
    d:
      en: "Microsoft Secure Score summarizes the overall security posture as a number; it does not analyze a particular campaign."
      fr: "Le Degré de sécurisation Microsoft résume la posture de sécurité globale par un nombre ; il n'analyse pas une campagne particulière."
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
  - title: Describe Microsoft Defender Threat Intelligence
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6b-describe-defender-threat-intelligence
