id: sc900-3c-mde-basics-yn
objective: "3.4.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender for Endpoint, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender pour point de terminaison, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Defender for Endpoint provides both preventative protection and post-breach detection."
        fr: "Microsoft Defender pour point de terminaison apporte à la fois une protection préventive et une détection après violation."
    - id: s2
      text:
        en: "Microsoft Defender for Endpoint supports only devices that run Windows."
        fr: "Microsoft Defender pour point de terminaison prend en charge uniquement les appareils Windows."
    - id: s3
      text:
        en: "Microsoft Defender for Endpoint uses threat intelligence to identify attacker tools, techniques and procedures."
        fr: "Microsoft Defender pour point de terminaison utilise le renseignement sur les menaces pour identifier les outils, les techniques et les procédures des attaquants."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Defender for Endpoint is a unified endpoint platform for preventative protection, post-breach detection, automated investigation and response. It supports Windows, macOS, Linux, Android and iOS. Threat intelligence is one of its core technologies, with endpoint behavioral sensors and cloud security analytics: it lets the service recognize attacker tools, techniques and procedures and raise alerts when they appear in the collected data."
    fr: "Defender pour point de terminaison est une plateforme unifiée de protection préventive, de détection après violation, d'investigation automatisée et de réponse pour les points de terminaison. Il prend en charge Windows, macOS, Linux, Android et iOS. Le renseignement sur les menaces est l'une de ses technologies de base, avec les capteurs comportementaux des points de terminaison et l'analytique de sécurité cloud : il permet au service de reconnaître les outils, les techniques et les procédures des attaquants et d'émettre des alertes quand ils apparaissent dans les données collectées."
references:
  - title: Describe Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/4-describe-defender-endpoint
  - title: Microsoft Defender for Endpoint overview
    url: https://learn.microsoft.com/en-us/defender-endpoint/microsoft-defender-endpoint
