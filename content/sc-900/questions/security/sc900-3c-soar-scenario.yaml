id: sc900-3c-soar-scenario
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The security operations team of Fabrikam wants the following to happen without any manual step each time an alert reports a suspicious sign-in: the user account is disabled, a ticket is opened in the help desk system and the team is notified.

    Which type of solution provides this capability?
  fr: |
    L'équipe des opérations de sécurité de Fabrikam veut que les actions suivantes se produisent sans aucune étape manuelle chaque fois qu'une alerte signale une connexion suspecte : le compte de l'utilisateur est désactivé, un ticket est ouvert dans le système de support et l'équipe est prévenue.

    Quel type de solution fournit cette fonctionnalité ?
body:
  options:
    - id: a
      text: { en: "Security information and event management (SIEM)", fr: "Gestion des informations et des événements de sécurité (SIEM)" }
    - id: b
      text: { en: "Cloud workload protection platform (CWPP)", fr: "Plateforme de protection des charges de travail cloud (CWPP)" }
    - id: c
      text: { en: "Cloud security posture management (CSPM)", fr: "Gestion de la posture de sécurité cloud (CSPM)" }
    - id: d
      text: { en: "Security orchestration, automation, and response (SOAR)", fr: "Orchestration, automatisation et réponse en matière de sécurité (SOAR)" }
answer: { optionId: d }
explanation:
  correct:
    en: "A SOAR system takes the alerts of a SIEM and of other security tools and triggers automated workflows that handle the response. Disabling an account, opening a ticket and notifying the team in one automated sequence is the typical content of a SOAR playbook."
    fr: "Un système SOAR prend les alertes d'un SIEM et d'autres outils de sécurité et déclenche des flux de travail automatisés qui traitent la réponse. Désactiver un compte, ouvrir un ticket et prévenir l'équipe en une seule séquence automatisée est le contenu type d'un playbook SOAR."
  options:
    a:
      en: "A SIEM collects and correlates the data and raises the alert about the sign-in; acting on the alert automatically is what SOAR adds."
      fr: "Un SIEM collecte et corrèle les données et émet l'alerte sur la connexion ; agir automatiquement sur l'alerte est ce qu'ajoute le SOAR."
    b:
      en: "A CWPP protects workloads such as servers, containers and databases and raises security alerts; it does not orchestrate a response across the help desk and identity systems."
      fr: "Une CWPP protège des charges de travail comme les serveurs, les conteneurs et les bases de données et émet des alertes de sécurité ; elle n'orchestre pas une réponse entre le système de support et le système d'identité."
    c:
      en: "CSPM evaluates how cloud resources are configured and recommends improvements; it does not respond to alerts."
      fr: "La CSPM évalue la configuration des ressources cloud et recommande des améliorations ; elle ne répond pas aux alertes."
references:
  - title: Define the concepts of SIEM and SOAR
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar
