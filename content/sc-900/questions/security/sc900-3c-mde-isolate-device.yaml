id: sc900-3c-mde-isolate-device
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A laptop at Woodgrove Bank is compromised. An analyst needs to disconnect the laptop from the network while it stays connected to the Microsoft Defender for Endpoint service, so that it remains monitored.

    Which response action should the analyst take in Microsoft Defender for Endpoint?
  fr: |
    Un ordinateur portable de Woodgrove Bank est compromis. Un analyste doit déconnecter l'ordinateur du réseau tout en le laissant connecté au service Microsoft Defender pour point de terminaison, pour qu'il reste surveillé.

    Quelle action de réponse l'analyste doit-il effectuer dans Microsoft Defender pour point de terminaison ?
body:
  options:
    - id: a
      text: { en: "Isolate device", fr: "Isolate device (isoler l'appareil)" }
    - id: b
      text: { en: "Run antivirus scan", fr: "Run antivirus scan (exécuter une analyse antivirus)" }
    - id: c
      text: { en: "Restrict app execution", fr: "Restrict app execution (restreindre l'exécution des applications)" }
    - id: d
      text: { en: "Collect investigation package", fr: "Collect investigation package (collecter un package d'investigation)" }
answer: { optionId: a }
explanation:
  correct:
    en: "The Isolate device action disconnects the compromised device from the network, which prevents the attacker from using it to move further, and keeps its connectivity to the Defender for Endpoint service. The security team can therefore continue to monitor and investigate the device during the isolation."
    fr: "L'action Isolate device déconnecte du réseau l'appareil compromis, ce qui empêche l'attaquant de s'en servir pour aller plus loin, et conserve sa connectivité au service Defender pour point de terminaison. L'équipe de sécurité peut donc continuer à surveiller et à examiner l'appareil pendant l'isolement."
  options:
    b:
      en: "An antivirus scan looks for malware and remediates it on the device; the device stays on the network."
      fr: "Une analyse antivirus recherche les programmes malveillants et les corrige sur l'appareil ; l'appareil reste sur le réseau."
    c:
      en: "Restricting app execution lets only Microsoft-signed files run on the device; it does not cut its network connections."
      fr: "Restreindre l'exécution des applications ne laisse s'exécuter sur l'appareil que les fichiers signés par Microsoft ; cela ne coupe pas ses connexions réseau."
    d:
      en: "An investigation package gathers forensic data about the current state of the device; it changes nothing in its connectivity."
      fr: "Un package d'investigation rassemble des données d'investigation sur l'état actuel de l'appareil ; il ne change rien à sa connectivité."
references:
  - title: Take response actions on a device
    url: https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts
