id: sc900-3c-mdo-scope-multi
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Against which two types of threats does Microsoft Defender for Office 365 protect an organization?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contre quels deux types de menaces Microsoft Defender pour Office 365 protège-t-il une organisation ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Phishing links and harmful attachments in email messages", fr: "Les liens d'hameçonnage et les pièces jointes nuisibles dans les e-mails" }
    - id: b
      text: { en: "Brute-force attacks against on-premises domain controllers", fr: "Les attaques par force brute contre les contrôleurs de domaine locaux" }
    - id: c
      text: { en: "Misconfigured storage accounts in an Azure subscription", fr: "Les comptes de stockage mal configurés dans un abonnement Azure" }
    - id: d
      text: { en: "Malware in files shared in Microsoft Teams and SharePoint", fr: "Les programmes malveillants dans les fichiers partagés dans Microsoft Teams et SharePoint" }
    - id: e
      text: { en: "Unpatched software vulnerabilities on laptops", fr: "Les vulnérabilités logicielles non corrigées sur les ordinateurs portables" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Defender for Office 365 is the email and collaboration security service of the suite. It protects against threats such as phishing and malware that arrive through email links and attachments, and it extends that protection to collaboration tools such as SharePoint, OneDrive and Teams."
    fr: "Defender pour Office 365 est le service de sécurité de l'e-mail et de la collaboration de la suite. Il protège contre les menaces comme l'hameçonnage et les programmes malveillants qui arrivent par les liens et les pièces jointes des e-mails, et il étend cette protection aux outils de collaboration comme SharePoint, OneDrive et Teams."
  options:
    b:
      en: "Attacks on on-premises Active Directory are detected by Microsoft Defender for Identity, through its sensors on domain controllers."
      fr: "Les attaques contre Active Directory local sont détectées par Microsoft Defender pour Identity, grâce à ses capteurs sur les contrôleurs de domaine."
    c:
      en: "The configuration of Azure resources is assessed by Microsoft Defender for Cloud."
      fr: "La configuration des ressources Azure est évaluée par Microsoft Defender pour le cloud."
    e:
      en: "Vulnerabilities on devices are discovered and prioritized by Microsoft Defender Vulnerability Management, with Microsoft Defender for Endpoint."
      fr: "Les vulnérabilités des appareils sont découvertes et hiérarchisées par la Gestion des vulnérabilités Microsoft Defender, avec Microsoft Defender pour point de terminaison."
references:
  - title: Describe Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/3-describe-defender-office
  - title: Microsoft Defender for Office 365 overview
    url: https://learn.microsoft.com/en-us/defender-office-365/mdo-about
