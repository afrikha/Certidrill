id: sc900-3b-bastion-peering-scope
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Azure subscription contains three virtual networks named VNet1, VNet2 and VNet3. Azure Bastion (Standard SKU) is deployed in VNet1. VNet1 is peered with VNet2. VNet3 is not peered with any virtual network.

    To which virtual machines can administrators connect through this Azure Bastion deployment?
  fr: |
    Un abonnement Azure contient trois réseaux virtuels nommés VNet1, VNet2 et VNet3. Azure Bastion (SKU Standard) est déployé dans VNet1. Un peering relie VNet1 et VNet2. VNet3 n'est relié par peering à aucun réseau virtuel.

    À quelles machines virtuelles les administrateurs peuvent-ils se connecter via ce déploiement d'Azure Bastion ?
body:
  options:
    - id: a
      text: { en: "The virtual machines in VNet1 only", fr: "Les machines virtuelles de VNet1 uniquement" }
    - id: b
      text: { en: "The virtual machines in VNet1 and VNet3 only", fr: "Les machines virtuelles de VNet1 et VNet3 uniquement" }
    - id: c
      text: { en: "The virtual machines in VNet1 and VNet2 only", fr: "Les machines virtuelles de VNet1 et VNet2 uniquement" }
    - id: d
      text: { en: "The virtual machines in VNet1, VNet2 and VNet3", fr: "Les machines virtuelles de VNet1, VNet2 et VNet3" }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Bastion is deployed per virtual network, with support for virtual network peering. Once provisioned, it serves the virtual machines of its own virtual network and those of the peered virtual networks: here VNet1 and VNet2."
    fr: "Azure Bastion se déploie par réseau virtuel et prend en charge le peering de réseaux virtuels. Une fois approvisionné, il dessert les machines virtuelles de son propre réseau virtuel et celles des réseaux virtuels reliés par peering : ici VNet1 et VNet2."
  options:
    a:
      en: "A dedicated Bastion deployment also reaches the virtual machines of the virtual networks peered with its own."
      fr: "Un déploiement Bastion dédié atteint aussi les machines virtuelles des réseaux virtuels reliés par peering au sien."
    b:
      en: "VNet3 is not peered with VNet1, so Bastion has no path to it, while VNet2 is peered and is reachable."
      fr: "VNet3 n'est pas relié par peering à VNet1 : Bastion n'a aucun chemin vers lui, alors que VNet2, relié par peering, est accessible."
    d:
      en: "Bastion is not deployed per subscription: being in the same subscription does not make VNet3 reachable."
      fr: "Bastion ne se déploie pas par abonnement : appartenir au même abonnement ne rend pas VNet3 accessible."
references:
  - title: Describe Azure Bastion
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/7-describe-azure-bastion-just-in-time-access
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
