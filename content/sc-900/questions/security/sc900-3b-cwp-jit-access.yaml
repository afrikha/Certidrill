id: sc900-3b-cwp-jit-access
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Azure virtual machines of Fabrikam have management ports that are reachable from the internet and undergo brute-force attempts. Fabrikam wants inbound traffic to these ports to be blocked by default and allowed only when an authorized user requests access, from the IP address of that user and for a limited time.

    What should Fabrikam use?
  fr: |
    Les machines virtuelles Azure de Fabrikam ont des ports de gestion accessibles depuis Internet et subissent des tentatives d'attaque par force brute. Fabrikam veut que le trafic entrant vers ces ports soit bloqué par défaut et autorisé uniquement quand un utilisateur autorisé demande l'accès, depuis l'adresse IP de cet utilisateur et pour une durée limitée.

    Que doit utiliser Fabrikam ?
body:
  options:
    - id: a
      text: Microsoft Entra Privileged Identity Management
    - id: b
      text: { en: "Just-in-time VM access in Microsoft Defender for Cloud", fr: "L'accès juste-à-temps aux machines virtuelles dans Microsoft Defender pour le cloud" }
    - id: c
      text: Azure Bastion
    - id: d
      text: Azure DDoS Protection
answer: { optionId: b }
explanation:
  correct:
    en: "Just-in-time VM access, an enhanced security feature of Defender for Servers, locks down inbound traffic to the management ports of virtual machines. When a user with the required permissions requests access, Defender for Cloud allows the traffic to the selected ports from the relevant IP address for the specified amount of time, which reduces the exposure to brute-force attacks."
    fr: "L'accès juste-à-temps aux machines virtuelles, fonctionnalité de sécurité améliorée de Defender for Servers, verrouille le trafic entrant vers les ports de gestion des machines virtuelles. Quand un utilisateur disposant des autorisations requises demande l'accès, Defender pour le cloud autorise le trafic vers les ports sélectionnés depuis l'adresse IP concernée pendant la durée indiquée, ce qui réduit l'exposition aux attaques par force brute."
  options:
    a:
      en: "Privileged Identity Management also works just in time, but for the activation of privileged roles; it does not open or close network ports."
      fr: "Privileged Identity Management fonctionne aussi « juste-à-temps », mais pour l'activation de rôles privilégiés ; il n'ouvre ni ne ferme de ports réseau."
    c:
      en: "Azure Bastion provides RDP and SSH sessions to virtual machines through their private IP addresses; it does not open ports on request for the IP address of a user and for a limited time."
      fr: "Azure Bastion fournit des sessions RDP et SSH vers les machines virtuelles par leur adresse IP privée ; il n'ouvre pas de ports sur demande pour l'adresse IP d'un utilisateur et pour une durée limitée."
    d:
      en: "Azure DDoS Protection mitigates volumetric attacks; it does not control who can reach the management ports."
      fr: "Azure DDoS Protection atténue les attaques volumétriques ; il ne contrôle pas qui peut atteindre les ports de gestion."
references:
  - title: Just-in-time machine access in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview
  - title: Describe the enhanced security of Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
