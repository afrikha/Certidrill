id: sc900-3b-cspm-basics-yn
objective: "3.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A higher secure score in Microsoft Defender for Cloud indicates a higher level of identified risk.
        fr: Un score de sécurité plus élevé dans Microsoft Defender pour le cloud indique un niveau de risque identifié plus élevé.
    - id: s2
      text:
        en: The free Foundational CSPM plan includes the secure score.
        fr: Le plan gratuit CSPM de base (Foundational CSPM) inclut le score de sécurité.
    - id: s3
      text:
        en: CSPM in Microsoft Defender for Cloud provides hardening recommendations based on the misconfigurations it identifies.
        fr: La CSPM de Microsoft Defender pour le cloud fournit des recommandations de renforcement fondées sur les configurations incorrectes qu'elle identifie.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "The higher the secure score, the lower the identified risk level. Foundational CSPM, which is free, includes asset discovery, continuous assessment with security recommendations, and the secure score. CSPM provides hardening recommendations based on the security misconfigurations and weaknesses that it identifies."
    fr: "Plus le score de sécurité est élevé, plus le niveau de risque identifié est faible. Le CSPM de base (Foundational CSPM), gratuit, inclut la découverte des ressources, l'évaluation continue avec des recommandations de sécurité, et le score de sécurité. La CSPM fournit des recommandations de renforcement fondées sur les configurations incorrectes et les faiblesses de sécurité qu'elle identifie."
references:
  - title: Describe Cloud security posture management
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
