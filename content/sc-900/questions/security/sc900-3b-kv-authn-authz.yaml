id: sc900-3b-kv-authn-authz
objective: "3.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An application must read a secret stored in Azure Key Vault.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application doit lire un secret stocké dans Azure Key Vault.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The identity of the application is established through [[authn]].

      The operations that the application may perform on the vault are determined by Azure role-based access control (Azure RBAC) or by [[authz]].
    fr: |
      L'identité de l'application est établie par [[authn]].

      Les opérations que l'application peut effectuer sur le coffre sont déterminées par le contrôle d'accès en fonction du rôle Azure (Azure RBAC) ou par [[authz]].
  slots:
    - id: authn
      options:
        - { id: sas, text: { en: "a shared access signature (SAS)", fr: "une signature d'accès partagé (SAS)" } }
        - { id: entra, text: "Microsoft Entra ID" }
        - { id: nsg, text: { en: "a network security group (NSG)", fr: "un groupe de sécurité réseau (NSG)" } }
    - id: authz
      options:
        - { id: kvpol, text: { en: "a Key Vault access policy", fr: "une stratégie d'accès Key Vault" } }
        - { id: ca, text: { en: "a Conditional Access policy", fr: "une stratégie d'accès conditionnel" } }
        - { id: rule, text: { en: "an Azure Firewall rule", fr: "une règle du Pare-feu Azure" } }
answer:
  values: { authn: entra, authz: kvpol }
explanation:
  correct:
    en: "A caller needs authentication and authorization before it gets access to a key vault. Authentication, which establishes the identity of the caller, is done through Microsoft Entra ID. Authorization, which determines the operations the caller may perform, is done through Azure RBAC or a Key Vault access policy."
    fr: "Un appelant doit être authentifié puis autorisé avant d'accéder à un coffre de clés. L'authentification, qui établit l'identité de l'appelant, passe par Microsoft Entra ID. L'autorisation, qui détermine les opérations que l'appelant peut effectuer, passe par Azure RBAC ou par une stratégie d'accès Key Vault."
  options:
    sas:
      en: "A shared access signature delegates access to Azure Storage resources; it does not authenticate callers of Key Vault."
      fr: "Une signature d'accès partagé délègue l'accès à des ressources de Stockage Azure ; elle n'authentifie pas les appelants de Key Vault."
    ca:
      en: "A Conditional Access policy sets the conditions of a sign-in in Microsoft Entra ID; it does not list the operations allowed on the vault's secrets, keys and certificates."
      fr: "Une stratégie d'accès conditionnel fixe les conditions d'une connexion dans Microsoft Entra ID ; elle n'énumère pas les opérations autorisées sur les secrets, les clés et les certificats du coffre."
references:
  - title: Describe Azure Key Vault
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/8-describe-ways-azure-encrypts-data
  - title: About Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
