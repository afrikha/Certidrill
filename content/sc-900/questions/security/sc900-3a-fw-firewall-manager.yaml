id: sc900-3a-fw-firewall-manager
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs Azure Firewall in several subscriptions. Fabrikam wants to define a common set of network and application rules once and apply it to all its firewalls.

    What should Fabrikam use?
  fr: |
    Fabrikam exploite le Pare-feu Azure dans plusieurs abonnements. Fabrikam veut définir une seule fois un jeu commun de règles de réseau et d'application et l'appliquer à tous ses pare-feux.

    Que doit utiliser Fabrikam ?
body:
  options:
    - id: a
      text: "Microsoft Sentinel"
    - id: b
      text: "Azure Monitor"
    - id: c
      text: "Azure Firewall Manager"
    - id: d
      text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Firewall Manager is the central place to manage Azure Firewall instances across subscriptions. Instead of configuring each firewall separately, you define the rules in firewall policies and apply them to the firewalls of the tenant."
    fr: "Azure Firewall Manager est l'emplacement central pour gérer les instances du Pare-feu Azure de plusieurs abonnements. Au lieu de configurer chaque pare-feu séparément, vous définissez les règles dans des stratégies de pare-feu et vous les appliquez aux pare-feux du locataire."
  options:
    a:
      en: "Microsoft Sentinel collects and analyzes security data (SIEM) and automates the response (SOAR); it doesn't define firewall rules."
      fr: "Microsoft Sentinel collecte et analyse les données de sécurité (SIEM) et automatise la réponse (SOAR) ; il ne définit pas de règles de pare-feu."
    b:
      en: "Azure Monitor receives the logs and metrics of Azure Firewall; it doesn't manage its rules."
      fr: "Azure Monitor reçoit les journaux et les métriques du Pare-feu Azure ; il n'en gère pas les règles."
    d:
      en: "Microsoft Defender for Cloud assesses the security posture and protects workloads; firewall policies are managed elsewhere."
      fr: "Microsoft Defender pour le cloud évalue la posture de sécurité et protège les charges de travail ; les stratégies de pare-feu se gèrent ailleurs."
references:
  - title: Describe Azure Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall
  - title: What is Azure Firewall?
    url: https://learn.microsoft.com/en-us/azure/firewall/overview
