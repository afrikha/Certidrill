id: sc900-3a-nsg-rule-table
objective: "3.1.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A virtual machine named **VM1** has a public IP address. A network security group named **NSG1** is associated with the network interface of VM1, and no other network security group applies to VM1. The inbound security rules of NSG1 are shown in the following table.

    For each type of traffic, select the rule that decides whether the traffic is allowed or denied.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée **VM1** possède une adresse IP publique. Un groupe de sécurité réseau nommé **NSG1** est associé à l'interface réseau de VM1, et aucun autre groupe de sécurité réseau ne s'applique à VM1. Les règles de sécurité entrantes de NSG1 figurent dans le tableau suivant.

    Pour chaque type de trafic, sélectionnez la règle qui décide si le trafic est autorisé ou refusé.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "SSH (TCP 22) from a computer on the internet to VM1", fr: "SSH (TCP 22) depuis un ordinateur sur internet vers VM1" }
    - id: p2
      text: { en: "HTTP (TCP 80) from a computer on the internet to VM1", fr: "HTTP (TCP 80) depuis un ordinateur sur internet vers VM1" }
  grid:
    header: [{ en: "Priority", fr: "Priorité" }, { en: "Name", fr: "Nom" }, "Port", { en: "Source", fr: "Source" }, "Action"]
    rows:
      - [{ text: "100" }, { text: Allow-HTTPS, area: r100 }, { text: "443" }, { text: Internet }, { text: Allow }]
      - [{ text: "200" }, { text: Deny-SSH-Internet, area: r200 }, { text: "22" }, { text: Internet }, { text: Deny }]
      - [{ text: "300" }, { text: Allow-SSH-Any, area: r300 }, { text: "22" }, { text: Any }, { text: Allow }]
      - [{ text: "65000" }, { text: AllowVnetInBound, area: r65000 }, { text: Any }, { text: VirtualNetwork }, { text: Allow }]
      - [{ text: "65001" }, { text: AllowAzureLoadBalancerInBound, area: r65001 }, { text: Any }, { text: AzureLoadBalancer }, { text: Allow }]
      - [{ text: "65500" }, { text: DenyAllInBound, area: r65500 }, { text: Any }, { text: Any }, { text: Deny }]
answer:
  values: { p1: r200, p2: r65500 }
explanation:
  correct:
    en: "Rules are processed from the lowest priority number to the highest, and processing stops at the first rule that matches the traffic. SSH from the internet matches Deny-SSH-Internet (200) before Allow-SSH-Any (300), so it is denied. HTTP on port 80 from the internet matches none of the first five rules and is denied by the default rule DenyAllInBound (65500)."
    fr: "Les règles sont traitées du plus petit numéro de priorité au plus grand, et le traitement s'arrête à la première règle qui correspond au trafic. SSH venant d'internet correspond à Deny-SSH-Internet (200) avant Allow-SSH-Any (300) : il est donc refusé. HTTP sur le port 80 venant d'internet ne correspond à aucune des cinq premières règles et est refusé par la règle par défaut DenyAllInBound (65500)."
  options:
    r300:
      en: "Allow-SSH-Any also matches SSH from the internet, but a rule with a lower priority number has already matched, so this rule isn't processed."
      fr: "Allow-SSH-Any correspond aussi à SSH venant d'internet, mais une règle de numéro de priorité plus petit a déjà correspondu : cette règle n'est donc pas traitée."
    r100:
      en: "Allow-HTTPS concerns port 443 only; HTTP on port 80 doesn't match it."
      fr: "Allow-HTTPS ne concerne que le port 443 ; HTTP sur le port 80 ne lui correspond pas."
    r65000:
      en: "AllowVnetInBound allows only traffic whose source is the virtual network; a computer on the internet isn't part of it."
      fr: "AllowVnetInBound n'autorise que le trafic dont la source est le réseau virtuel ; un ordinateur sur internet n'en fait pas partie."
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  - title: How Network Security Groups Filter Network Traffic in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
