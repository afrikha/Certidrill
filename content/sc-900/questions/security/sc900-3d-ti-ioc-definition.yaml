id: sc900-3d-ti-ioc-definition
objective: "3.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A threat intelligence article about an attack lists the IP addresses, domains and URLs that reveal that a system has been touched by this attack.

    What are these artifacts called?
  fr: |
    Un article de renseignement sur les menaces consacré à une attaque liste les adresses IP, les domaines et les URL qui révèlent qu'un système a été touché par cette attaque.

    Comment appelle-t-on ces artefacts ?
body:
  options:
    - id: a
      text: { en: "Sensitive information types", fr: "Des types d'informations sensibles" }
    - id: b
      text: { en: "Security baselines", fr: "Des bases de référence de sécurité" }
    - id: c
      text: { en: "Lateral movement paths", fr: "Des chemins de mouvement latéral" }
    - id: d
      text: { en: "Indicators of compromise (IOCs)", fr: "Des indicateurs de compromission (IOC)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Indicators of compromise (IOCs) are the observable traces of an attack, such as IP addresses, domains, URLs and files. The articles of Microsoft Threat Intelligence link each threat to its key IOCs, and analysts can search and investigate these indicators in the Microsoft Defender portal."
    fr: "Les indicateurs de compromission (IOC) sont les traces observables d'une attaque, comme des adresses IP, des domaines, des URL et des fichiers. Les articles de Microsoft Threat Intelligence relient chaque menace à ses principaux IOC, et les analystes peuvent rechercher et examiner ces indicateurs dans le portail Microsoft Defender."
  options:
    a:
      en: "Sensitive information types are patterns, such as credit card numbers, that Microsoft Purview uses to classify data."
      fr: "Les types d'informations sensibles sont des modèles, comme les numéros de carte de crédit, que Microsoft Purview utilise pour classifier les données."
    b:
      en: "Security baselines are reference configurations against which the settings of devices are measured."
      fr: "Les bases de référence de sécurité sont des configurations de référence auxquelles on compare les paramètres des appareils."
    c:
      en: "Lateral movement paths show how an attacker could move from account to account toward sensitive accounts; they are a Microsoft Defender for Identity concept."
      fr: "Les chemins de mouvement latéral montrent comment un attaquant pourrait passer de compte en compte vers des comptes sensibles ; c'est une notion de Microsoft Defender pour Identity."
references:
  - title: Describe Microsoft Defender Threat Intelligence
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6b-describe-defender-threat-intelligence
  - title: Threat intelligence in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/defender-threat-intelligence
