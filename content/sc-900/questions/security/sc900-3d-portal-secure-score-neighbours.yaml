id: sc900-3d-portal-secure-score-neighbours
objective: "3.4.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security administrator at Wingtip Toys wants a single number that measures the security posture of the organization's Microsoft 365 identities, apps and devices, together with recommended actions to raise it.

    What should the administrator use?
  fr: |
    Un administrateur de sécurité de Wingtip Toys veut un nombre unique qui mesure la posture de sécurité des identités, des applications et des appareils Microsoft 365 de l'organisation, accompagné d'actions recommandées pour l'augmenter.

    Que doit utiliser l'administrateur ?
body:
  options:
    - id: a
      text: { en: "Microsoft Secure Score in the Microsoft Defender portal", fr: "Le Degré de sécurisation Microsoft (Microsoft Secure Score) du portail Microsoft Defender" }
    - id: b
      text: { en: "Compliance score in Microsoft Purview Compliance Manager", fr: "Le score de conformité du Gestionnaire de conformité Microsoft Purview" }
    - id: c
      text: { en: "Secure score in Microsoft Defender for Cloud", fr: "Le score de sécurité de Microsoft Defender pour le cloud" }
    - id: d
      text: { en: "Exposure score in Microsoft Defender Vulnerability Management", fr: "Le score d'exposition de la Gestion des vulnérabilités Microsoft Defender" }
answer: { optionId: a }
explanation:
  correct:
    en: "Microsoft Secure Score, in the Microsoft Defender portal, measures the security posture of an organization across its Microsoft 365 identities, apps and devices. A higher number means that more recommended actions have been taken, and each recommended action shows the points that it can bring."
    fr: "Le Degré de sécurisation Microsoft (Microsoft Secure Score), dans le portail Microsoft Defender, mesure la posture de sécurité d'une organisation pour ses identités, ses applications et ses appareils Microsoft 365. Un nombre plus élevé signifie que davantage d'actions recommandées ont été réalisées, et chaque action recommandée indique les points qu'elle peut rapporter."
  options:
    b:
      en: "The compliance score measures progress in completing the improvement actions tied to regulations and standards; it is about compliance, not security posture."
      fr: "Le score de conformité mesure la progression dans la réalisation des actions d'amélioration liées aux réglementations et aux normes ; il porte sur la conformité, pas sur la posture de sécurité."
    c:
      en: "The secure score of Defender for Cloud measures the posture of cloud resources in Azure and in other connected clouds, not of Microsoft 365 identities and apps."
      fr: "Le score de sécurité de Defender pour le cloud mesure la posture des ressources cloud dans Azure et dans les autres clouds connectés, pas celle des identités et des applications Microsoft 365."
    d:
      en: "The exposure score reflects only the exposure of devices to threats and vulnerabilities, and a lower value is better."
      fr: "Le score d'exposition reflète uniquement l'exposition des appareils aux menaces et aux vulnérabilités, et une valeur plus basse est préférable."
references:
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
  - title: Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/overview-defender-portal
