id: sc900-3c-mde-secure-score-devices
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has onboarded its laptops and PCs to Microsoft Defender for Endpoint. The security team wants to assess the security state of these devices, identify unprotected systems and get recommended actions to improve.

    What should the team use?
  fr: |
    Contoso a intégré ses ordinateurs portables et ses PC à Microsoft Defender pour point de terminaison. L'équipe de sécurité veut évaluer l'état de sécurité de ces appareils, repérer les systèmes non protégés et obtenir des actions recommandées pour l'améliorer.

    Que doit utiliser l'équipe ?
body:
  options:
    - id: a
      text: { en: "Compliance score in Compliance Manager", fr: "Le score de conformité du Gestionnaire de conformité" }
    - id: b
      text: { en: "Secure score in Microsoft Defender for Cloud", fr: "Le score de sécurité de Microsoft Defender pour le cloud" }
    - id: c
      text: { en: "User risk in Microsoft Entra ID Protection", fr: "Le risque utilisateur de Microsoft Entra ID Protection" }
    - id: d
      text: { en: "Microsoft Secure Score for Devices", fr: "Le Score de sécurité Microsoft pour les appareils" }
answer: { optionId: d }
explanation:
  correct:
    en: "Microsoft Secure Score for Devices is a capability of Defender for Endpoint. It dynamically assesses the security state of the enterprise network, identifies unprotected systems and proposes recommended actions that raise the overall security of the organization's devices."
    fr: "Le Score de sécurité Microsoft pour les appareils (Microsoft Secure Score for Devices) est une fonctionnalité de Defender pour point de terminaison. Il évalue de façon dynamique l'état de sécurité du réseau de l'entreprise, repère les systèmes non protégés et propose des actions recommandées qui élèvent la sécurité globale des appareils de l'organisation."
  options:
    a:
      en: "The compliance score measures progress on improvement actions tied to regulations and standards, in Microsoft Purview; it does not assess the security configuration of devices."
      fr: "Le score de conformité mesure l'avancement des actions d'amélioration liées aux réglementations et aux normes, dans Microsoft Purview ; il n'évalue pas la configuration de sécurité des appareils."
    b:
      en: "The secure score of Defender for Cloud reflects the posture of cloud resources in Azure and other clouds, not that of the laptops and PCs onboarded to Defender for Endpoint."
      fr: "Le score de sécurité de Defender pour le cloud reflète la posture des ressources cloud dans Azure et dans d'autres clouds, pas celle des ordinateurs portables et des PC intégrés à Defender pour point de terminaison."
    c:
      en: "User risk is the probability that an identity is compromised; it concerns accounts, not the security state of devices."
      fr: "Le risque utilisateur est la probabilité qu'une identité soit compromise ; il concerne les comptes, pas l'état de sécurité des appareils."
references:
  - title: Describe Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/4-describe-defender-endpoint
