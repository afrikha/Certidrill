id: sc900-3b-cwp-servers-complete
objective: "3.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Defender for Cloud, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur Microsoft Defender pour le cloud, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Defender for Servers adds threat detection and advanced defenses for [[os]] machines.

      For endpoint detection and response (EDR), Defender for Servers includes [[edr]].

      When a Defender plan detects a threat, it raises [[out]] that indicates the nature and the severity of the threat.
    fr: |
      Defender for Servers ajoute la détection des menaces et des défenses avancées pour les machines [[os]].

      Pour la détection et la réponse des points de terminaison (EDR), Defender for Servers inclut [[edr]].

      Quand un plan Defender détecte une menace, il émet [[out]] qui indique la nature et la gravité de la menace.
  slots:
    - id: os
      options:
        - { id: win, text: { en: "Windows only", fr: "Windows uniquement" } }
        - { id: lin, text: { en: "Linux only", fr: "Linux uniquement" } }
        - { id: both, text: { en: "Windows and Linux", fr: "Windows et Linux" } }
    - id: edr
      options:
        - { id: mde, text: { en: "Microsoft Defender for Endpoint", fr: "Microsoft Defender pour point de terminaison" } }
        - { id: mdi, text: { en: "Microsoft Defender for Identity", fr: "Microsoft Defender pour Identity" } }
        - { id: mdo, text: { en: "Microsoft Defender for Office 365", fr: "Microsoft Defender pour Office 365" } }
    - id: out
      options:
        - { id: rec, text: { en: "a security recommendation", fr: "une recommandation de sécurité" } }
        - { id: alert, text: { en: "a security alert", fr: "une alerte de sécurité" } }
        - { id: review, text: { en: "an access review", fr: "une révision d'accès" } }
answer:
  values: { os: both, edr: mde, out: alert }
explanation:
  correct:
    en: "Defender for Servers protects Windows and Linux machines and includes Microsoft Defender for Endpoint for comprehensive endpoint detection and response. When the environment is threatened, the Defender plans raise security alerts that indicate the nature and severity of the threat so that you can plan the response."
    fr: "Defender for Servers protège les machines Windows et Linux et inclut Microsoft Defender pour point de terminaison pour une détection et une réponse complètes des points de terminaison. Quand l'environnement est menacé, les plans Defender émettent des alertes de sécurité qui indiquent la nature et la gravité de la menace pour vous permettre de planifier la réponse."
  options:
    mdi:
      en: "Defender for Identity detects threats against identities of Active Directory; it is not the EDR component of Defender for Servers."
      fr: "Defender pour Identity détecte les menaces contre les identités d'Active Directory ; ce n'est pas le composant EDR de Defender for Servers."
    rec:
      en: "A security recommendation comes from posture management: it reports a configuration to harden, not a detected threat."
      fr: "Une recommandation de sécurité relève de la gestion de la posture : elle signale une configuration à renforcer, pas une menace détectée."
references:
  - title: Describe the enhanced security of Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
  - title: Security alerts and incidents
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-overview
