id: sc900-3c-siem-soar-functions-match
objective: "3.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each SIEM or SOAR concept to its description.

    To answer, drag the appropriate concept to each description. Each concept may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque notion du SIEM ou du SOAR à sa description.

    Pour répondre, faites glisser la notion appropriée vers chaque description. Chaque notion peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: agg, text: { en: "Log aggregation", fr: "Agrégation de journaux" } }
    - { id: corr, text: { en: "Correlation", fr: "Corrélation" } }
    - { id: alert, text: { en: "Alerting", fr: "Alertes" } }
    - { id: orch, text: { en: "Orchestration", fr: "Orchestration" } }
    - { id: play, text: "Playbook" }
  targets:
    - id: t1
      text: { en: "Connecting different security tools and systems so that they work together", fr: "Connecter différents outils et systèmes de sécurité pour qu'ils travaillent ensemble" }
    - id: t2
      text: { en: "Gathering events from firewalls, servers, identity systems and applications into a single platform", fr: "Rassembler dans une seule plateforme les événements des pare-feux, des serveurs, des systèmes d'identité et des applications" }
    - id: t3
      text: { en: "A predefined sequence of automated actions triggered by a specific type of alert or incident", fr: "Une séquence prédéfinie d'actions automatisées déclenchée par un type précis d'alerte ou d'incident" }
    - id: t4
      text: { en: "Analyzing the data for patterns, relationships and anomalies that might indicate a threat", fr: "Analyser les données à la recherche de schémas, de relations et d'anomalies qui pourraient indiquer une menace" }
answer:
  mapping: { t1: orch, t2: agg, t3: play, t4: corr }
explanation:
  correct:
    en: "Orchestration is the SOAR concept of making separate tools cooperate, for example querying the identity system and a threat intelligence feed at the same time. Log aggregation consolidates logs and events from many sources in the SIEM. A playbook is the predefined automated sequence that SOAR runs for a given alert or incident type. Correlation is the SIEM analysis that links events to reveal a threat."
    fr: "L'orchestration est la notion SOAR qui consiste à faire coopérer des outils distincts, par exemple interroger en même temps le système d'identité et un flux de renseignement sur les menaces. L'agrégation de journaux regroupe dans le SIEM les journaux et les événements de nombreuses sources. Un playbook est la séquence automatisée prédéfinie que le SOAR exécute pour un type donné d'alerte ou d'incident. La corrélation est l'analyse du SIEM qui relie les événements pour révéler une menace."
  options:
    alert:
      en: "Alerting is the SIEM function that notifies analysts when suspicious activity is identified; none of the descriptions is about raising a notification."
      fr: "Les alertes sont la fonction du SIEM qui prévient les analystes quand une activité suspecte est repérée ; aucune des descriptions ne porte sur l'émission d'une notification."
references:
  - title: Define the concepts of SIEM and SOAR
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar
