id: sc900-3a-seg-purpose-yn
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about network segmentation, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la segmentation de réseau, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Network segmentation is used to group related assets that are part of the same workload."
        fr: "La segmentation de réseau sert à regrouper des ressources liées qui font partie de la même charge de travail."
    - id: s2
      text:
        en: "Placing the parts of a workload in separate segments lets you control the traffic to and from those segments."
        fr: "Placer les parties d'une charge de travail dans des segments distincts permet de contrôler le trafic à destination et en provenance de ces segments."
    - id: s3
      text:
        en: "In Azure, each network segment requires its own subscription."
        fr: "Dans Azure, chaque segment de réseau nécessite son propre abonnement."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "The main reasons for network segmentation are to group related assets that are part of, or support, a workload, to isolate resources, and to apply the governance policies of the organization. When workloads or parts of a workload sit in separate segments, the traffic to and from each segment can be controlled to secure the communication paths. In Azure, segments are built with virtual networks and subnets, and a single subscription can hold many of them."
    fr: "Les principales raisons de segmenter un réseau sont de regrouper les ressources liées qui font partie d'une charge de travail ou la soutiennent, d'isoler des ressources et d'appliquer les stratégies de gouvernance de l'organisation. Lorsque des charges de travail, ou des parties d'une charge de travail, se trouvent dans des segments distincts, le trafic à destination et en provenance de chaque segment peut être contrôlé pour sécuriser les chemins de communication. Dans Azure, les segments se construisent avec des réseaux virtuels et des sous-réseaux, et un seul abonnement peut en contenir beaucoup."
  options:
    s3:
      en: "Segments are virtual networks and subnets; several of them can be created in the same subscription."
      fr: "Les segments sont des réseaux virtuels et des sous-réseaux ; plusieurs peuvent être créés dans le même abonnement."
references:
  - title: Describe network segmentation in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
