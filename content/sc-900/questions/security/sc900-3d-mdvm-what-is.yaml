id: sc900-3d-mdvm-what-is
objective: "3.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys wants to continuously discover the software weaknesses and the misconfigurations of its Windows, macOS and Linux devices, and to fix first those that present the highest risk.

    Which Microsoft Defender XDR service should the company use?
  fr: |
    Tailspin Toys veut découvrir en continu les faiblesses logicielles et les erreurs de configuration de ses appareils Windows, macOS et Linux, et corriger en premier celles qui présentent le risque le plus élevé.

    Quel service Microsoft Defender XDR l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" }
    - id: b
      text: { en: "Microsoft Defender for Identity", fr: "Microsoft Defender pour Identity" }
    - id: c
      text: { en: "Microsoft Defender Vulnerability Management", fr: "Gestion des vulnérabilités Microsoft Defender" }
    - id: d
      text: { en: "Microsoft Defender for Office 365", fr: "Microsoft Defender pour Office 365" }
answer: { optionId: c }
explanation:
  correct:
    en: "Defender Vulnerability Management takes a risk-based approach to discover, prioritize and remediate vulnerabilities and misconfigurations. It covers Windows, macOS, Linux, Android, iOS and network devices, and it ranks its security recommendations so that the most dangerous weaknesses are handled first."
    fr: "La Gestion des vulnérabilités Microsoft Defender applique une approche basée sur les risques pour découvrir, hiérarchiser et corriger les vulnérabilités et les erreurs de configuration. Elle couvre Windows, macOS, Linux, Android, iOS et les appareils réseau, et elle classe ses recommandations de sécurité pour que les faiblesses les plus dangereuses soient traitées en premier."
  options:
    a:
      en: "Defender for Cloud Apps discovers and protects the SaaS applications that users access; it does not assess the software installed on devices."
      fr: "Defender pour les applications cloud découvre et protège les applications SaaS auxquelles les utilisateurs accèdent ; il n'évalue pas les logiciels installés sur les appareils."
    b:
      en: "Defender for Identity detects identity-based attacks from the signals of the identity infrastructure, not software weaknesses on devices."
      fr: "Defender pour Identity détecte les attaques fondées sur l'identité à partir des signaux de l'infrastructure d'identité, pas les faiblesses logicielles des appareils."
    d:
      en: "Defender for Office 365 protects email and collaboration tools against threats such as phishing and malware."
      fr: "Defender pour Office 365 protège l'e-mail et les outils de collaboration contre des menaces comme l'hameçonnage et les programmes malveillants."
references:
  - title: Describe Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6a-describe-defender-vulnerability-management
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
