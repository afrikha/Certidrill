id: sc900-3b-cspm-explorer-vs-path
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security team that uses the Defender CSPM plan does not want to wait for recommendations to surface. The team wants to ask its own questions about the environment, for example "Which virtual machines exposed to the internet can read a storage account?", by building queries.

    Which capability should the team use?
  fr: |
    Une équipe de sécurité qui utilise le plan Defender CSPM ne veut pas attendre que des recommandations apparaissent. Elle veut poser ses propres questions sur l'environnement, par exemple « Quelles machines virtuelles exposées à Internet peuvent lire un compte de stockage ? », en construisant des requêtes.

    Quelle fonctionnalité l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Attack path analysis", fr: "L'analyse du chemin d'attaque" }
    - id: b
      text: { en: "Governance", fr: "La gouvernance" }
    - id: c
      text: { en: "Cloud security explorer", fr: "L'explorateur de sécurité du cloud" }
    - id: d
      text: { en: "Secure score", fr: "Le score de sécurité" }
answer: { optionId: c }
explanation:
  correct:
    en: "The cloud security explorer is the query-based tool of Defender CSPM: teams run graph-based queries across the resources to ask specific security questions instead of waiting for recommendations. It serves proactive exploration of the security state of the environment."
    fr: "L'explorateur de sécurité du cloud est l'outil de requête de Defender CSPM : les équipes exécutent des requêtes basées sur un graphe sur les ressources pour poser des questions de sécurité précises au lieu d'attendre des recommandations. Il sert à explorer de façon proactive l'état de sécurité de l'environnement."
  options:
    a:
      en: "Attack path analysis models by itself the paths that an attacker could follow to high-value resources; the team does not write the questions."
      fr: "L'analyse du chemin d'attaque modélise d'elle-même les chemins qu'un attaquant pourrait suivre vers des ressources de grande valeur ; l'équipe n'écrit pas les questions."
    b:
      en: "Governance assigns recommendations to owners with due dates; it is not a query tool."
      fr: "La gouvernance attribue des recommandations à des propriétaires avec des échéances ; ce n'est pas un outil de requête."
    d:
      en: "The secure score summarizes the posture in one value; it does not answer specific questions about resources."
      fr: "Le score de sécurité résume la posture en une valeur ; il ne répond pas à des questions précises sur les ressources."
references:
  - title: Describe Cloud security posture management
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management
