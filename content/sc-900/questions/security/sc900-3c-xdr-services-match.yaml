id: sc900-3c-xdr-services-match
objective: "3.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each Microsoft Defender XDR service to its description.

    To answer, drag the appropriate service to each description. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque service Microsoft Defender XDR à sa description.

    Pour répondre, faites glisser le service approprié vers chaque description. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mde, text: { en: "Microsoft Defender for Endpoint", fr: "Microsoft Defender pour point de terminaison" } }
    - { id: mdo, text: { en: "Microsoft Defender for Office 365", fr: "Microsoft Defender pour Office 365" } }
    - { id: mdi, text: { en: "Microsoft Defender for Identity", fr: "Microsoft Defender pour Identity" } }
    - { id: mdca, text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" } }
    - { id: mdvm, text: { en: "Microsoft Defender Vulnerability Management", fr: "Gestion des vulnérabilités Microsoft Defender" } }
  targets:
    - id: t1
      text: { en: "Provides visibility, data controls and threat protection across SaaS applications", fr: "Apporte la visibilité, le contrôle des données et la protection contre les menaces sur les applications SaaS" }
    - id: t2
      text: { en: "Provides preventative protection, post-breach detection, automated investigation and response for devices", fr: "Apporte la protection préventive, la détection après violation, l'investigation automatisée et la réponse pour les appareils" }
    - id: t3
      text: { en: "Uses sensors on domain controllers to detect threats that target on-premises Active Directory", fr: "Utilise des capteurs sur les contrôleurs de domaine pour détecter les menaces qui visent Active Directory local" }
    - id: t4
      text: { en: "Safeguards against threats posed by email messages, links and collaboration tools", fr: "Protège contre les menaces portées par les e-mails, les liens et les outils de collaboration" }
answer:
  mapping: { t1: mdca, t2: mde, t3: mdi, t4: mdo }
explanation:
  correct:
    en: "Defender for Cloud Apps is the cross-SaaS solution of the suite. Defender for Endpoint is the endpoint platform, for devices such as laptops, phones and tablets. Defender for Identity reads the signals of the identity infrastructure through sensors installed on domain controllers. Defender for Office 365 protects email, URLs and collaboration tools such as Teams and SharePoint."
    fr: "Defender pour les applications cloud est la solution de la suite qui couvre l'ensemble des applications SaaS. Defender pour point de terminaison est la plateforme des points de terminaison, pour les appareils comme les ordinateurs portables, les téléphones et les tablettes. Defender pour Identity lit les signaux de l'infrastructure d'identité grâce à des capteurs installés sur les contrôleurs de domaine. Defender pour Office 365 protège l'e-mail, les URL et les outils de collaboration comme Teams et SharePoint."
  options:
    mdvm:
      en: "Defender Vulnerability Management provides continuous asset visibility and risk-based assessments to find and fix vulnerabilities and misconfigurations; none of the descriptions is about vulnerabilities."
      fr: "La Gestion des vulnérabilités Microsoft Defender apporte une visibilité continue sur les ressources et des évaluations fondées sur les risques pour trouver et corriger les vulnérabilités et les erreurs de configuration ; aucune des descriptions ne porte sur les vulnérabilités."
references:
  - title: Describe Microsoft Defender XDR services
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
