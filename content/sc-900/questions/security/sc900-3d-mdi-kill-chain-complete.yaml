id: sc900-3d-mdi-kill-chain-complete
objective: "3.4.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Microsoft Defender for Identity detects suspicious activity at each stage of the cyberattack kill chain.

    To complete the sentences, select the appropriate stage in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Microsoft Defender pour Identity détecte les activités suspectes à chaque étape de la chaîne de cyberattaque (kill chain).

    Pour compléter les phrases, sélectionnez l'étape appropriée dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Attempts to enumerate the users and the groups of the domain belong to the [[k1]] stage.

      Brute-force attacks and repeated failed authentications belong to the [[k2]] stage.

      Remote code execution on a domain controller, once the attacker controls Active Directory, belongs to the [[k3]] stage.
    fr: |
      Les tentatives d'énumération des utilisateurs et des groupes du domaine relèvent de l'étape [[k1]].

      Les attaques par force brute et les échecs d'authentification répétés relèvent de l'étape [[k2]].

      L'exécution de code à distance sur un contrôleur de domaine, une fois que l'attaquant contrôle Active Directory, relève de l'étape [[k3]].
  slots:
    - id: k1
      options:
        - { id: lat, text: { en: "lateral movement", fr: "du mouvement latéral" } }
        - { id: rec, text: { en: "reconnaissance", fr: "de la reconnaissance" } }
        - { id: dom, text: { en: "domain dominance", fr: "de la domination du domaine" } }
        - { id: cred, text: { en: "compromised credentials", fr: "des informations d'identification compromises" } }
    - id: k2
      options:
        - { id: cred, text: { en: "compromised credentials", fr: "des informations d'identification compromises" } }
        - { id: dom, text: { en: "domain dominance", fr: "de la domination du domaine" } }
        - { id: rec, text: { en: "reconnaissance", fr: "de la reconnaissance" } }
        - { id: lat, text: { en: "lateral movement", fr: "du mouvement latéral" } }
    - id: k3
      options:
        - { id: rec, text: { en: "reconnaissance", fr: "de la reconnaissance" } }
        - { id: lat, text: { en: "lateral movement", fr: "du mouvement latéral" } }
        - { id: cred, text: { en: "compromised credentials", fr: "des informations d'identification compromises" } }
        - { id: dom, text: { en: "domain dominance", fr: "de la domination du domaine" } }
answer:
  values: { k1: rec, k2: cred, k3: dom }
explanation:
  correct:
    en: "During reconnaissance, the attacker gathers information, for example by listing user names and group memberships. The compromised credentials stage covers brute-force attacks, failed authentications and suspicious changes of group membership. Domain dominance is the behavior of an attacker who has gained control of Active Directory, such as remote code execution on a domain controller. Lateral movement, the remaining stage, is the progression inside the network toward sensitive users."
    fr: "Pendant la reconnaissance, l'attaquant collecte des informations, par exemple en listant les noms d'utilisateurs et les appartenances aux groupes. L'étape des informations d'identification compromises couvre les attaques par force brute, les échecs d'authentification et les modifications suspectes de l'appartenance aux groupes. La domination du domaine est le comportement d'un attaquant qui a pris le contrôle d'Active Directory, comme l'exécution de code à distance sur un contrôleur de domaine. Le mouvement latéral, l'étape restante, est la progression à l'intérieur du réseau vers les utilisateurs sensibles."
references:
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
  - title: Microsoft Defender for Identity overview
    url: https://learn.microsoft.com/en-us/defender-for-identity/what-is
