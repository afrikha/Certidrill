id: sc900-3d-mdi-sensor-location
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware plans to deploy Microsoft Defender for Identity to protect its on-premises Active Directory domain.

    On which type of server should Litware install the Defender for Identity sensors?
  fr: |
    Litware prévoit de déployer Microsoft Defender pour Identity pour protéger son domaine Active Directory local.

    Sur quel type de serveur Litware doit-elle installer les capteurs de Defender pour Identity ?
body:
  options:
    - id: a
      text: { en: "File servers", fr: "Les serveurs de fichiers" }
    - id: b
      text: { en: "Print servers", fr: "Les serveurs d'impression" }
    - id: c
      text: { en: "Database servers", fr: "Les serveurs de bases de données" }
    - id: d
      text: { en: "Domain controllers", fr: "Les contrôleurs de domaine" }
answer: { optionId: d }
explanation:
  correct:
    en: "The sensors of Defender for Identity are installed on the identity servers of the organization: the domain controllers, and the servers that run Active Directory Federation Services (AD FS) or Active Directory Certificate Services (AD CS). The sensor reads the event logs and the network traffic of the server, parses them and sends the parsed information to the cloud service."
    fr: "Les capteurs de Defender pour Identity s'installent sur les serveurs d'identité de l'organisation : les contrôleurs de domaine, et les serveurs qui exécutent Active Directory Federation Services (AD FS) ou Active Directory Certificate Services (AD CS). Le capteur lit les journaux d'événements et le trafic réseau du serveur, les analyse et envoie les informations analysées au service cloud."
  options:
    a:
      en: "A file server stores shared documents; it does not authenticate the users of the domain, so it carries no identity signal for the sensor."
      fr: "Un serveur de fichiers stocke des documents partagés ; il n'authentifie pas les utilisateurs du domaine et ne porte donc aucun signal d'identité pour le capteur."
    b:
      en: "A print server manages print queues; it is not part of the identity infrastructure that the sensor monitors."
      fr: "Un serveur d'impression gère des files d'attente d'impression ; il ne fait pas partie de l'infrastructure d'identité que le capteur surveille."
    c:
      en: "A database server hosts application data; the authentication of domain accounts is handled by the domain controllers."
      fr: "Un serveur de bases de données héberge des données applicatives ; l'authentification des comptes du domaine est assurée par les contrôleurs de domaine."
references:
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
