id: sc900-3a-seg-assume-breach
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso places each workload in its own network segment, so that an attacker who compromises one segment is contained there.

    Which Zero Trust principle does this design apply?
  fr: |
    Contoso place chaque charge de travail dans son propre segment de réseau, pour qu'un attaquant qui compromet un segment y reste confiné.

    Quel principe de la Confiance Zéro (Zero Trust) cette conception applique-t-elle ?
body:
  options:
    - id: a
      text: { en: "Verify explicitly", fr: "Vérifier explicitement" }
    - id: b
      text: { en: "Assume breach", fr: "Supposer une violation" }
    - id: c
      text: { en: "Use least privilege access", fr: "Utiliser l'accès selon le moindre privilège" }
    - id: d
      text: { en: "Shared responsibility", fr: "Responsabilité partagée" }
answer: { optionId: b }
explanation:
  correct:
    en: "Network segmentation supports the Zero Trust principle \"assume breach\": the design considers that an attacker will get in, so the ability to contain the attacker is vital. If one segment is compromised, its impact is limited and the attacker is prevented from moving laterally through the rest of the network."
    fr: "La segmentation de réseau soutient le principe de la Confiance Zéro « supposer une violation » : la conception part de l'idée qu'un attaquant entrera, et la capacité à le contenir est donc vitale. Si un segment est compromis, son impact est limité et l'attaquant est empêché de se déplacer latéralement dans le reste du réseau."
  options:
    a:
      en: "\"Verify explicitly\" means authenticating and authorizing each request from all available signals; it concerns the access decision, not containment."
      fr: "« Vérifier explicitement » signifie authentifier et autoriser chaque demande à partir de tous les signaux disponibles ; cela concerne la décision d'accès, pas le confinement."
    c:
      en: "\"Use least privilege access\" limits what an identity may do and for how long; it doesn't describe the separation of a network into segments."
      fr: "« Utiliser l'accès selon le moindre privilège » limite ce qu'une identité peut faire et pendant combien de temps ; cela ne décrit pas la séparation d'un réseau en segments."
    d:
      en: "Shared responsibility describes how security tasks are divided between the cloud provider and the customer; it isn't a Zero Trust principle."
      fr: "La responsabilité partagée décrit la répartition des tâches de sécurité entre le fournisseur de cloud et le client ; ce n'est pas un principe de la Confiance Zéro."
references:
  - title: Describe network segmentation in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
