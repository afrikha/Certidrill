id: sc900-3a-fw-central-service
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has virtual networks in several Azure subscriptions. Contoso wants one managed service that filters the traffic of all these virtual networks with a single set of network and application rules.

    Which service should Contoso use?
  fr: |
    Contoso possède des réseaux virtuels dans plusieurs abonnements Azure. Contoso veut un service managé unique qui filtre le trafic de tous ces réseaux virtuels avec un seul jeu de règles de réseau et d'application.

    Quel service Contoso doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "A network security group", fr: "Un groupe de sécurité réseau" }
    - id: b
      text: { en: "Azure Firewall", fr: "Le Pare-feu Azure" }
    - id: c
      text: "Azure Bastion"
    - id: d
      text: "Azure DDoS Protection"
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Firewall is a managed, cloud-based network security service. It can be deployed in any virtual network, but the recommended approach is a centralized virtual network through which the other virtual networks and the on-premises network route their traffic. This gives centralized control of the traffic of virtual networks across subscriptions."
    fr: "Le Pare-feu Azure est un service de sécurité réseau managé, basé sur le cloud. Il peut être déployé dans n'importe quel réseau virtuel, mais l'approche recommandée est un réseau virtuel centralisé par lequel les autres réseaux virtuels et le réseau local acheminent leur trafic. On obtient ainsi un contrôle centralisé du trafic des réseaux virtuels de plusieurs abonnements."
  options:
    a:
      en: "A network security group filters traffic of the subnets and network interfaces with which it is associated, inside a virtual network; it isn't a central service."
      fr: "Un groupe de sécurité réseau filtre le trafic des sous-réseaux et des interfaces réseau auxquels il est associé, à l'intérieur d'un réseau virtuel ; ce n'est pas un service central."
    c:
      en: "Azure Bastion provides secure RDP and SSH connectivity to virtual machines; it doesn't filter the traffic of virtual networks."
      fr: "Azure Bastion fournit une connectivité RDP et SSH sécurisée aux machines virtuelles ; il ne filtre pas le trafic des réseaux virtuels."
    d:
      en: "Azure DDoS Protection mitigates denial-of-service attacks at layers 3 and 4; it doesn't apply filtering rules to traffic."
      fr: "Azure DDoS Protection atténue les attaques par déni de service aux couches 3 et 4 ; il n'applique pas de règles de filtrage au trafic."
references:
  - title: Describe Azure Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall
