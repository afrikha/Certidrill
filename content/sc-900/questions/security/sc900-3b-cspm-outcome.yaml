id: sc900-3b-cspm-outcome
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which of the following is produced by cloud security posture management (CSPM) rather than by cloud workload protection?
  fr: |
    Lequel des éléments suivants est produit par la gestion de la posture de sécurité cloud (CSPM) plutôt que par la protection des charges de travail cloud ?
body:
  options:
    - id: a
      text: { en: "An alert about a brute-force attack in progress on a virtual machine", fr: "Une alerte sur une attaque par force brute en cours sur une machine virtuelle" }
    - id: b
      text: { en: "A recommendation to restrict the public network access of a storage account", fr: "Une recommandation de restreindre l'accès réseau public d'un compte de stockage" }
    - id: c
      text: { en: "An alert about potentially harmful activity on a storage account", fr: "Une alerte sur une activité potentiellement dangereuse sur un compte de stockage" }
    - id: d
      text: { en: "An alert about a prompt injection attempt on a generative AI application", fr: "Une alerte sur une tentative d'injection d'invites sur une application d'IA générative" }
answer: { optionId: b }
explanation:
  correct:
    en: "CSPM assesses how resources are configured and produces hardening recommendations, for example to close a public network access left open. Cloud workload protection watches running workloads and raises security alerts when it detects a threat."
    fr: "La CSPM évalue la configuration des ressources et produit des recommandations de renforcement, par exemple fermer un accès réseau public laissé ouvert. La protection des charges de travail cloud surveille les charges de travail en exécution et émet des alertes de sécurité quand elle détecte une menace."
  options:
    a:
      en: "An attack in progress on a machine is a threat detected by a workload protection plan such as Defender for Servers."
      fr: "Une attaque en cours sur une machine est une menace détectée par un plan de protection des charges de travail comme Defender for Servers."
    c:
      en: "Harmful activity on a storage account is detected by the Defender for Storage workload protection plan."
      fr: "Une activité dangereuse sur un compte de stockage est détectée par le plan de protection des charges de travail Defender for Storage."
    d:
      en: "A prompt injection attempt is a threat detected by the workload protection plan for AI services."
      fr: "Une tentative d'injection d'invites est une menace détectée par le plan de protection des charges de travail destiné aux services d'IA."
references:
  - title: Describe Cloud security posture management
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management
  - title: Describe the enhanced security of Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
