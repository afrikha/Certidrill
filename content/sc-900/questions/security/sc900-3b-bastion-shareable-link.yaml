id: sc900-3b-bastion-shareable-link
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Azure Bastion with the Standard SKU. An external consultant must connect to one virtual machine but has no access to the Azure portal.

    Which Azure Bastion feature should the company use?
  fr: |
    Une entreprise utilise Azure Bastion avec le SKU Standard. Un consultant externe doit se connecter à une machine virtuelle, mais il n'a pas accès au portail Azure.

    Quelle fonctionnalité d'Azure Bastion l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Host scaling", fr: "La mise à l'échelle de l'hôte" }
    - id: b
      text: { en: "Session recording", fr: "L'enregistrement des sessions" }
    - id: c
      text: { en: "A shareable link", fr: "Un lien partageable" }
    - id: d
      text: { en: "Private-only deployment", fr: "Le déploiement privé uniquement" }
answer: { optionId: c }
explanation:
  correct:
    en: "A shareable link lets an authorized user connect to a virtual machine through Azure Bastion without going through the Azure portal. Shareable links are available in the Standard and Premium SKUs."
    fr: "Un lien partageable permet à un utilisateur autorisé de se connecter à une machine virtuelle via Azure Bastion sans passer par le portail Azure. Les liens partageables sont disponibles dans les SKU Standard et Premium."
  options:
    a:
      en: "Host scaling adds Bastion instances to support more concurrent sessions; it does not change how a user reaches the service."
      fr: "La mise à l'échelle de l'hôte ajoute des instances Bastion pour prendre en charge davantage de sessions simultanées ; elle ne change pas la façon dont un utilisateur atteint le service."
    b:
      en: "Session recording keeps a record of the sessions for audits and belongs to the Premium SKU; it does not give access to a user."
      fr: "L'enregistrement des sessions conserve une trace des sessions pour les audits et relève du SKU Premium ; il ne donne pas d'accès à un utilisateur."
    d:
      en: "Private-only deployment (Premium SKU) deploys Bastion without a public IP address; it does not help a user who has no portal access."
      fr: "Le déploiement privé uniquement (SKU Premium) déploie Bastion sans adresse IP publique ; il n'aide pas un utilisateur qui n'a pas accès au portail."
references:
  - title: "What is Azure Bastion?"
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
  - title: Describe Azure Bastion
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/7-describe-azure-bastion-just-in-time-access
