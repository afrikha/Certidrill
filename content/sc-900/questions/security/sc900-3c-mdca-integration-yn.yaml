id: sc900-3c-mdca-integration-yn
objective: "3.4.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The signals of Microsoft Defender for Cloud Apps are correlated with those of the other Microsoft Defender XDR services for incident-level detection and response."
        fr: "Les signaux de Microsoft Defender pour les applications cloud sont corrélés avec ceux des autres services Microsoft Defender XDR pour une détection et une réponse au niveau de l'incident."
    - id: s2
      text:
        en: "The SaaS security posture management data of Microsoft Defender for Cloud Apps appears in Microsoft Secure Score."
        fr: "Les données de gestion de la posture de sécurité SaaS de Microsoft Defender pour les applications cloud apparaissent dans le Degré de sécurisation Microsoft (Microsoft Secure Score)."
    - id: s3
      text:
        en: "Microsoft Defender for Cloud Apps is the service that protects Azure virtual machines and Azure storage accounts."
        fr: "Microsoft Defender pour les applications cloud est le service qui protège les machines virtuelles Azure et les comptes de stockage Azure."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Defender for Cloud Apps is part of Microsoft's XDR solution: its signals are correlated with those of the rest of the Defender suite, which gives incident-level detection, investigation and response. Its SSPM data is provided automatically in Microsoft Secure Score for supported, connected apps. Azure virtual machines and storage accounts are cloud workloads protected by Microsoft Defender for Cloud, a different product despite the similar name."
    fr: "Defender pour les applications cloud fait partie de la solution XDR de Microsoft : ses signaux sont corrélés avec ceux du reste de la suite Defender, ce qui donne une détection, une investigation et une réponse au niveau de l'incident. Ses données SSPM sont fournies automatiquement dans le Degré de sécurisation Microsoft pour les applications prises en charge et connectées. Les machines virtuelles et les comptes de stockage Azure sont des charges de travail cloud protégées par Microsoft Defender pour le cloud, un produit différent malgré la ressemblance des noms."
references:
  - title: Describe Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/5-describe-microsoft-cloud-app-security
  - title: Microsoft Defender for Cloud Apps overview
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/what-is-defender-for-cloud-apps
