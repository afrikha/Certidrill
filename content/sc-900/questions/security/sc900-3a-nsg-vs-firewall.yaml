id: sc900-3a-nsg-vs-firewall
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which statement describes how network security groups (NSGs) and Azure Firewall differ?
  fr: |
    Quelle affirmation décrit la différence entre les groupes de sécurité réseau (NSG) et le Pare-feu Azure ?
body:
  options:
    - id: a
      text:
        en: "NSGs protect web applications at layer 7; Azure Firewall filters only by IP address and port at layers 3 and 4."
        fr: "Les NSG protègent les applications web à la couche 7 ; le Pare-feu Azure ne filtre que par adresse IP et port aux couches 3 et 4."
    - id: b
      text:
        en: "NSGs filter traffic within virtual networks; Azure Firewall is a centralized firewall across virtual networks and subscriptions."
        fr: "Les NSG filtrent le trafic à l'intérieur des réseaux virtuels ; le Pare-feu Azure est un pare-feu centralisé pour plusieurs réseaux virtuels et abonnements."
    - id: c
      text:
        en: "NSGs filter the traffic of on-premises networks; Azure Firewall filters only the traffic between two Azure regions."
        fr: "Les NSG filtrent le trafic des réseaux locaux ; le Pare-feu Azure ne filtre que le trafic entre deux régions Azure."
    - id: d
      text:
        en: "NSGs replace Azure Firewall inside a virtual network; the two services are never used on the same traffic."
        fr: "Les NSG remplacent le Pare-feu Azure à l'intérieur d'un réseau virtuel ; les deux services ne s'utilisent jamais sur le même trafic."
answer: { optionId: b }
explanation:
  correct:
    en: "NSGs provide distributed, network-layer filtering that limits the traffic to resources within the virtual networks of each subscription. Azure Firewall is a fully stateful, centralized network firewall as a service, with network- and application-level protection across virtual networks and subscriptions. The two complement each other for defense in depth."
    fr: "Les NSG assurent un filtrage distribué, à la couche réseau, qui limite le trafic vers les ressources à l'intérieur des réseaux virtuels de chaque abonnement. Le Pare-feu Azure est un pare-feu réseau centralisé, entièrement avec état, fourni sous forme de service, avec une protection aux niveaux réseau et application pour plusieurs réseaux virtuels et abonnements. Les deux se complètent pour la défense en profondeur."
  options:
    a:
      en: "It is the opposite: NSGs filter at the network layer, and Azure Firewall adds application-level filtering. Protecting web applications at layer 7 is the role of a web application firewall."
      fr: "C'est l'inverse : les NSG filtrent à la couche réseau, et le Pare-feu Azure ajoute un filtrage au niveau de l'application. Protéger les applications web à la couche 7 est le rôle d'un pare-feu d'applications web."
    c:
      en: "An NSG is associated with subnets and network interfaces of Azure virtual networks, and Azure Firewall filters the traffic that is routed through it, whatever its origin."
      fr: "Un NSG s'associe aux sous-réseaux et aux interfaces réseau des réseaux virtuels Azure, et le Pare-feu Azure filtre le trafic acheminé par lui, quelle que soit son origine."
    d:
      en: "NSGs and Azure Firewall are complementary: the same traffic can go through the central firewall and then be filtered by an NSG close to the resource."
      fr: "Les NSG et le Pare-feu Azure sont complémentaires : le même trafic peut passer par le pare-feu central puis être filtré par un NSG au plus près de la ressource."
references:
  - title: Describe Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/6-describe-azure-network-security-groups
