id: sc900-3d-ti-sentences-complete
objective: "3.4.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Threat Intelligence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur Microsoft Threat Intelligence, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the Microsoft Defender portal, the threat intelligence capabilities are found under the [[t1]] node.

      In [[t2]], analysts search threat intelligence by keyword, by indicator or by CVE ID.

      The threat analytics dashboard highlights the latest threats, the high-impact threats and the threats with the [[t3]].
    fr: |
      Dans le portail Microsoft Defender, les fonctionnalités de renseignement sur les menaces se trouvent sous le nœud [[t1]].

      Dans [[t2]], les analystes recherchent du renseignement sur les menaces par mot clé, par indicateur ou par ID CVE.

      Le tableau de bord de l'analyse des menaces (threat analytics) met en avant les dernières menaces, les menaces à fort impact et les menaces présentant [[t3]].
  slots:
    - id: t1
      options:
        - { id: assets, text: { en: "Assets", fr: "Ressources (Assets)" } }
        - { id: ti, text: { en: "Threat intelligence", fr: "Threat Intelligence" } }
        - { id: reports, text: { en: "Reports", fr: "Rapports (Reports)" } }
    - id: t2
      options:
        - { id: intel, text: { en: "Intel explorer", fr: "l'Explorateur Intel (Intel explorer)" } }
        - { id: content, text: { en: "Content explorer", fr: "l'Explorateur de contenu (Content explorer)" } }
        - { id: activity, text: { en: "Activity explorer", fr: "l'Explorateur d'activités (Activity explorer)" } }
    - id: t3
      options:
        - { id: oldest, text: { en: "oldest publication date", fr: "la date de publication la plus ancienne" } }
        - { id: score, text: { en: "lowest compliance score", fr: "le score de conformité le plus bas" } }
        - { id: expo, text: { en: "highest exposure", fr: "l'exposition la plus élevée" } }
answer:
  values: { t1: ti, t2: intel, t3: expo }
explanation:
  correct:
    en: "The Threat intelligence node of the Microsoft Defender portal groups the threat intelligence capabilities. Intel explorer is where analysts search by keyword, indicator or CVE ID to start gathering intelligence; Content explorer and Activity explorer are data classification tools of Microsoft Purview. The threat analytics dashboard sorts reports into latest threats, high-impact threats and highest exposure threats, where exposure depends on the severity of the related vulnerabilities and on the number of devices that could be exploited."
    fr: "Le nœud Threat Intelligence du portail Microsoft Defender regroupe les fonctionnalités de renseignement sur les menaces. L'Explorateur Intel est l'endroit où les analystes recherchent par mot clé, indicateur ou ID CVE pour commencer à collecter du renseignement ; l'Explorateur de contenu et l'Explorateur d'activités sont des outils de classification des données de Microsoft Purview. Le tableau de bord de l'analyse des menaces classe les rapports en dernières menaces, menaces à fort impact et menaces à l'exposition la plus élevée, l'exposition dépendant de la gravité des vulnérabilités associées et du nombre d'appareils qui pourraient être exploités."
references:
  - title: Describe Microsoft Defender Threat Intelligence
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6b-describe-defender-threat-intelligence
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
