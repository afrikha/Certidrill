id: sc900-3b-mdc-shift-left
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The DevSecOps capability of Microsoft Defender for Cloud supports an approach that is sometimes called "shift-left security".

    What does this approach consist of?
  fr: |
    La fonctionnalité DevSecOps de Microsoft Defender pour le cloud soutient une approche parfois appelée « shift-left security ».

    En quoi consiste cette approche ?
body:
  options:
    - id: a
      text: { en: "Moving security checks earlier in the software development process", fr: "Déplacer les contrôles de sécurité plus tôt dans le processus de développement logiciel" }
    - id: b
      text: { en: "Moving the responsibility for security from the customer to the cloud provider", fr: "Déplacer la responsabilité de la sécurité du client vers le fournisseur de cloud" }
    - id: c
      text: { en: "Moving workloads from on-premises datacenters to a cloud platform", fr: "Déplacer les charges de travail des centres de données locaux vers une plateforme cloud" }
    - id: d
      text: { en: "Moving the handling of security alerts to an automated playbook", fr: "Déplacer le traitement des alertes de sécurité vers un playbook automatisé" }
answer: { optionId: a }
explanation:
  correct:
    en: "DevSecOps integrates security practices into every phase of the software development lifecycle. It is called shift-left security because the security checks move earlier in the process: built-in scans catch issues while the code is being written rather than at deployment."
    fr: "Le DevSecOps intègre les pratiques de sécurité à chaque phase du cycle de vie du développement logiciel. On parle de « shift-left security » parce que les contrôles de sécurité sont déplacés plus tôt dans le processus : des analyses intégrées détectent les problèmes pendant l'écriture du code plutôt qu'au déploiement."
  options:
    b:
      en: "The split of responsibilities between customer and provider is the shared responsibility model, which depends on the service type."
      fr: "La répartition des responsabilités entre le client et le fournisseur relève du modèle de responsabilité partagée, qui dépend du type de service."
    c:
      en: "Moving workloads to the cloud is a migration; it says nothing about when security checks take place."
      fr: "Déplacer des charges de travail vers le cloud est une migration ; cela ne dit rien du moment où ont lieu les contrôles de sécurité."
    d:
      en: "Automating the response to alerts with playbooks is security orchestration, automation and response (SOAR), which happens after deployment."
      fr: "Automatiser la réponse aux alertes avec des playbooks relève de l'orchestration, de l'automatisation et de la réponse en matière de sécurité (SOAR), qui intervient après le déploiement."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
