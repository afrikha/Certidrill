id: sc900-3b-cspm-capabilities-match
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each need to the Defender CSPM capability that meets it.

    To answer, drag the appropriate capability to each need. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque besoin à la fonctionnalité de Defender CSPM qui y répond.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque besoin. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: aispm, text: { en: "AI security posture management (AI SPM)", fr: "Gestion de la posture de sécurité de l'IA (AI SPM)" } }
    - { id: apa, text: { en: "Attack path analysis", fr: "Analyse du chemin d'attaque" } }
    - { id: cse, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité du cloud" } }
    - { id: dspm, text: { en: "Data security posture management (DSPM)", fr: "Gestion de la posture de sécurité des données (DSPM)" } }
    - { id: gov, text: { en: "Governance", fr: "Gouvernance" } }
  targets:
    - id: t1
      text: { en: "Assign a recommendation to a resource owner with a due date for remediation", fr: "Attribuer une recommandation au propriétaire d'une ressource avec une échéance de correction" }
    - id: t2
      text: { en: "Discover the datastores that contain personal data or financial records", fr: "Découvrir les magasins de données qui contiennent des données personnelles ou des données financières" }
    - id: t3
      text: { en: "Keep a catalog of the generative AI models, applications and services in use", fr: "Tenir un catalogue des modèles, des applications et des services d'IA générative utilisés" }
    - id: t4
      text: { en: "Model how an attacker could chain vulnerabilities to reach a high-value resource", fr: "Modéliser la façon dont un attaquant pourrait enchaîner des vulnérabilités pour atteindre une ressource de grande valeur" }
answer:
  mapping: { t1: gov, t2: dspm, t3: aispm, t4: apa }
explanation:
  correct:
    en: "Governance drives accountability: administrators assign recommendations to resource owners and set due dates. DSPM automatically discovers the datastores that contain sensitive information and assesses their posture. AI SPM maintains an AI bill of materials, a catalog of the generative AI models, applications and services in use. Attack path analysis models how vulnerabilities could be chained together to reach high-value resources."
    fr: "La gouvernance responsabilise les équipes : les administrateurs attribuent les recommandations aux propriétaires des ressources et fixent des échéances. La DSPM découvre automatiquement les magasins de données qui contiennent des informations sensibles et évalue leur posture. L'AI SPM tient une AI Bill of Materials (AI BOM), c'est-à-dire un catalogue des modèles, des applications et des services d'IA générative utilisés. L'analyse du chemin d'attaque modélise la façon dont des vulnérabilités pourraient être enchaînées pour atteindre des ressources de grande valeur."
  options:
    cse:
      en: "The cloud security explorer runs graph-based queries so that teams can ask their own security questions about the environment."
      fr: "L'explorateur de sécurité du cloud exécute des requêtes basées sur un graphe pour que les équipes posent leurs propres questions de sécurité sur l'environnement."
references:
  - title: Describe Cloud security posture management
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management
