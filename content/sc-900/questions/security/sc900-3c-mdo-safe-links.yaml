id: sc900-3c-mdo-safe-links
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At Proseware, attackers send email messages whose URLs point to harmless pages at delivery time and are redirected to phishing sites a few hours later.

    Which Microsoft Defender for Office 365 feature verifies a URL each time a user clicks it?
  fr: |
    Chez Proseware, des attaquants envoient des e-mails dont les URL pointent vers des pages inoffensives au moment de la remise, puis sont redirigées vers des sites d'hameçonnage quelques heures plus tard.

    Quelle fonctionnalité de Microsoft Defender pour Office 365 vérifie une URL chaque fois qu'un utilisateur clique dessus ?
body:
  options:
    - id: a
      text: { en: "Safe Links", fr: "Liens sécurisés (Safe Links)" }
    - id: b
      text: { en: "Safe Attachments", fr: "Pièces jointes sécurisées (Safe Attachments)" }
    - id: c
      text: { en: "Connection filtering", fr: "Filtrage des connexions" }
    - id: d
      text: { en: "Anti-spam protection", fr: "Protection anti-courrier indésirable" }
answer: { optionId: a }
explanation:
  correct:
    en: "Safe Links scans URLs in incoming messages and, above all, verifies them at the time of the click, in email, Microsoft Teams and supported Office apps. A link that was clean when the message arrived and became malicious afterwards is therefore still blocked when the user selects it."
    fr: "Liens sécurisés analyse les URL des messages entrants et, surtout, les vérifie au moment du clic, dans les e-mails, Microsoft Teams et les applications Office prises en charge. Un lien qui était sain à l'arrivée du message et qui est devenu malveillant ensuite est donc tout de même bloqué quand l'utilisateur le sélectionne."
  options:
    b:
      en: "Safe Attachments detonates attached files in a virtual environment; it does not verify URLs when users click them."
      fr: "Pièces jointes sécurisées fait détoner les fichiers joints dans un environnement virtuel ; la fonctionnalité ne vérifie pas les URL quand les utilisateurs cliquent dessus."
    c:
      en: "Connection filtering identifies good or bad source email servers by their IP address when the message arrives."
      fr: "Le filtrage des connexions identifie les bons ou les mauvais serveurs de messagerie sources d'après leur adresse IP, à l'arrivée du message."
    d:
      en: "Anti-spam protection uses content filtering to separate junk email from legitimate email at delivery; it does not act at the time of a click."
      fr: "La protection anti-courrier indésirable utilise le filtrage de contenu pour séparer le courrier indésirable du courrier légitime à la remise ; elle n'agit pas au moment d'un clic."
references:
  - title: Safe Links in Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/safe-links-about
  - title: Describe Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/3-describe-defender-office
