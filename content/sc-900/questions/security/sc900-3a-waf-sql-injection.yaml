id: sc900-3a-waf-sql-injection
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank wants centralized protection of its web applications against SQL injection and cross-site scripting.

    Which service should Woodgrove Bank use?
  fr: |
    Woodgrove Bank veut une protection centralisée de ses applications web contre l'injection SQL et le scripting inter-site.

    Quel service Woodgrove Bank doit-elle utiliser ?
body:
  options:
    - id: a
      text: "Azure DDoS Protection"
    - id: b
      text: { en: "A network security group", fr: "Un groupe de sécurité réseau" }
    - id: c
      text: "Azure Web Application Firewall"
    - id: d
      text: "Azure Bastion"
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Web Application Firewall (WAF) provides centralized protection of web applications against common exploits and vulnerabilities, such as SQL injection and cross-site scripting. It inspects the requests sent to the applications, so the attacks are stopped before they reach the application code."
    fr: "Azure Web Application Firewall (WAF) offre une protection centralisée des applications web contre les attaques et les vulnérabilités courantes, comme l'injection SQL et le scripting inter-site. Il inspecte les requêtes envoyées aux applications : les attaques sont arrêtées avant d'atteindre le code de l'application."
  options:
    a:
      en: "Azure DDoS Protection mitigates denial-of-service attacks at layers 3 and 4; it doesn't examine the content of web requests."
      fr: "Azure DDoS Protection atténue les attaques par déni de service aux couches 3 et 4 ; il n'examine pas le contenu des requêtes web."
    b:
      en: "A network security group allows or denies traffic by IP address, port and protocol; it can't recognize malicious code inside an HTTP request."
      fr: "Un groupe de sécurité réseau autorise ou refuse le trafic par adresse IP, port et protocole ; il ne sait pas reconnaître du code malveillant dans une requête HTTP."
    d:
      en: "Azure Bastion secures the RDP and SSH connections of administrators to virtual machines; it doesn't protect web applications."
      fr: "Azure Bastion sécurise les connexions RDP et SSH des administrateurs aux machines virtuelles ; il ne protège pas les applications web."
references:
  - title: Describe Web Application Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/4-describe-web-application-firewall
  - title: Introduction to Azure Web Application Firewall
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/overview
