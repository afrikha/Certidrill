id: sc900-3c-mde-complete
objective: "3.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Defender for Endpoint, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur Microsoft Defender pour point de terminaison, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Defender for Endpoint is [[e1]].

      It helps to prevent, detect, investigate and respond to advanced threats on [[e2]].

      Its features are found under the [[e3]] node of the Microsoft Defender portal.
    fr: |
      Microsoft Defender pour point de terminaison est [[e1]].

      Il aide à prévenir, détecter et examiner les menaces avancées, et à y répondre, sur [[e2]].

      Ses fonctionnalités se trouvent sous le nœud [[e3]] du portail Microsoft Defender.
  slots:
    - id: e1
      options:
        - { id: casb, text: { en: "a cloud access security broker", fr: "un broker de sécurité d'accès au cloud" } }
        - { id: idgov, text: { en: "an identity governance service", fr: "un service de gouvernance des identités" } }
        - { id: epp, text: { en: "an endpoint security platform", fr: "une plateforme de sécurité des points de terminaison" } }
    - id: e2
      options:
        - { id: dev, text: { en: "devices such as laptops, phones and tablets", fr: "les appareils comme les ordinateurs portables, les téléphones et les tablettes" } }
        - { id: mail, text: { en: "mailboxes and shared documents", fr: "les boîtes aux lettres et les documents partagés" } }
        - { id: saas, text: { en: "SaaS applications and their data", fr: "les applications SaaS et leurs données" } }
    - id: e3
      options:
        - { id: cloudapps, text: { en: "Cloud apps", fr: "Applications cloud (Cloud apps)" } }
        - { id: endpoints, text: { en: "Endpoints", fr: "Points de terminaison (Endpoints)" } }
        - { id: email, text: { en: "Email & collaboration", fr: "E-mail et collaboration (Email & collaboration)" } }
answer:
  values: { e1: epp, e2: dev, e3: endpoints }
explanation:
  correct:
    en: "Defender for Endpoint is an enterprise endpoint security platform that protects endpoints such as laptops, phones, tablets and PCs. In the Microsoft Defender portal, its features appear under the Endpoints node. The Email & collaboration node holds the features of Defender for Office 365, which protects mailboxes and shared documents, and the Cloud apps node those of Defender for Cloud Apps, the cloud access security broker that protects SaaS applications."
    fr: "Defender pour point de terminaison est une plateforme de sécurité des points de terminaison pour l'entreprise, qui protège les points de terminaison comme les ordinateurs portables, les téléphones, les tablettes et les PC. Dans le portail Microsoft Defender, ses fonctionnalités apparaissent sous le nœud Points de terminaison. Le nœud E-mail et collaboration contient les fonctionnalités de Defender pour Office 365, qui protège les boîtes aux lettres et les documents partagés, et le nœud Applications cloud celles de Defender pour les applications cloud, le broker de sécurité d'accès au cloud qui protège les applications SaaS."
references:
  - title: Describe Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/4-describe-defender-endpoint
  - title: Describe the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/7-describe-microsoft-defender-portal
