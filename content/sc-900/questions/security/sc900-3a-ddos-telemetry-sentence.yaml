id: sc900-3a-ddos-telemetry-sentence
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When Azure DDoS Protection detects an attack, it [[act]] the attack traffic and forwards the remaining traffic to its destination.

      The metrics of an attack are exposed through [[mon]], where alerts can be configured.

      During an attack, the mitigation flow logs can be streamed to [[siem]] for near real-time monitoring.
    fr: |
      Lorsque Azure DDoS Protection détecte une attaque, il [[act]] le trafic d'attaque et transmet le reste du trafic à sa destination.

      Les métriques d'une attaque sont exposées par [[mon]], où des alertes peuvent être configurées.

      Pendant une attaque, les journaux de flux d'atténuation peuvent être diffusés vers [[siem]] pour une surveillance en temps quasi réel.
  slots:
    - id: act
      options:
        - { id: encrypt, text: { en: "encrypts", fr: "chiffre" } }
        - { id: drop, text: { en: "drops", fr: "écarte" } }
        - { id: archive, text: { en: "archives", fr: "archive" } }
    - id: mon
      options:
        - { id: monitor, text: "Azure Monitor" }
        - { id: bastion, text: "Azure Bastion" }
        - { id: kv, text: "Azure Key Vault" }
    - id: siem
      options:
        - { id: fwm, text: "Azure Firewall Manager" }
        - { id: entra, text: "Microsoft Entra ID" }
        - { id: sentinel, text: "Microsoft Sentinel" }
answer:
  values: { act: drop, mon: monitor, siem: sentinel }
explanation:
  correct:
    en: "Once an attack is detected, the traffic to the protected resource goes through the DDoS protection service, which drops the attack traffic and forwards the rest. The telemetry is available through Azure Monitor: summarized metrics for each attack and alerts at the start, during and at the end of an attack. Mitigation flow logs can be streamed to Microsoft Sentinel or to another SIEM system."
    fr: "Dès qu'une attaque est détectée, le trafic à destination de la ressource protégée passe par le service de protection DDoS, qui écarte le trafic d'attaque et transmet le reste. La télémétrie est disponible par Azure Monitor : des métriques résumées pour chaque attaque et des alertes au début, pendant et à la fin d'une attaque. Les journaux de flux d'atténuation peuvent être diffusés vers Microsoft Sentinel ou vers un autre système SIEM."
  options:
    bastion:
      en: "Azure Bastion provides RDP and SSH connectivity to virtual machines; it isn't a monitoring service."
      fr: "Azure Bastion fournit une connectivité RDP et SSH aux machines virtuelles ; ce n'est pas un service de supervision."
    kv:
      en: "Azure Key Vault stores secrets, keys and certificates; it doesn't expose attack metrics."
      fr: "Azure Key Vault stocke des secrets, des clés et des certificats ; il n'expose pas de métriques d'attaque."
    fwm:
      en: "Azure Firewall Manager centralizes the management of firewall policies; it doesn't analyze logs as a SIEM does."
      fr: "Azure Firewall Manager centralise la gestion des stratégies de pare-feu ; il n'analyse pas les journaux comme le fait un SIEM."
references:
  - title: Describe Azure DDoS protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection
  - title: Azure DDoS Protection Overview
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
