id: sc900-3c-mdca-sspm
objective: "3.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum subscribes to several business applications that different vendors deliver as online services, for example for customer relationship management and human resources. The security team wants to be told when the security settings of one of these applications are misconfigured, and to get the recommended actions that would strengthen its posture.

    What should Adatum use?
  fr: |
    Adatum est abonnée à plusieurs applications métier que différents éditeurs fournissent sous forme de services en ligne, par exemple pour la gestion de la relation client et les ressources humaines. L'équipe de sécurité veut être prévenue quand les paramètres de sécurité de l'une de ces applications sont mal configurés, et obtenir les actions recommandées qui renforceraient sa posture.

    Que doit utiliser Adatum ?
body:
  options:
    - id: a
      text: { en: "SaaS security posture management (SSPM) in Microsoft Defender for Cloud Apps", fr: "La gestion de la posture de sécurité SaaS (SSPM) de Microsoft Defender pour les applications cloud" }
    - id: b
      text: { en: "Cloud security posture management (CSPM) in Microsoft Defender for Cloud", fr: "La gestion de la posture de sécurité cloud (CSPM) de Microsoft Defender pour le cloud" }
    - id: c
      text: { en: "Attack surface reduction in Microsoft Defender for Endpoint", fr: "La réduction de la surface d'attaque de Microsoft Defender pour point de terminaison" }
    - id: d
      text: { en: "Compliance Manager in Microsoft Purview", fr: "Le Gestionnaire de conformité de Microsoft Purview" }
answer: { optionId: a }
explanation:
  correct:
    en: "SaaS security posture management in Defender for Cloud Apps surfaces the misconfigurations of each connected SaaS app and recommends specific actions, based on industry standards and on the best practices of the app provider. The resulting data also appears in Microsoft Secure Score."
    fr: "La gestion de la posture de sécurité SaaS de Defender pour les applications cloud fait ressortir les erreurs de configuration de chaque application SaaS connectée et recommande des actions précises, fondées sur les normes du secteur et sur les bonnes pratiques de l'éditeur de l'application. Les données obtenues apparaissent aussi dans le Degré de sécurisation Microsoft (Microsoft Secure Score)."
  options:
    b:
      en: "CSPM in Defender for Cloud assesses the configuration of cloud resources such as virtual machines, storage and databases in Azure and other clouds, not the settings of SaaS applications."
      fr: "La CSPM de Defender pour le cloud évalue la configuration des ressources cloud comme les machines virtuelles, le stockage et les bases de données dans Azure et dans d'autres clouds, pas les paramètres des applications SaaS."
    c:
      en: "Attack surface reduction hardens the configuration of devices; it has no view of SaaS application settings."
      fr: "La réduction de la surface d'attaque renforce la configuration des appareils ; elle n'a aucune vue sur les paramètres des applications SaaS."
    d:
      en: "Compliance Manager tracks improvement actions against regulations and standards and produces a compliance score; it is not a security posture tool for SaaS apps."
      fr: "Le Gestionnaire de conformité suit les actions d'amélioration par rapport aux réglementations et aux normes et produit un score de conformité ; ce n'est pas un outil de posture de sécurité pour les applications SaaS."
references:
  - title: Describe Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/5-describe-microsoft-cloud-app-security
  - title: Microsoft Defender for Cloud Apps overview
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/what-is-defender-for-cloud-apps
