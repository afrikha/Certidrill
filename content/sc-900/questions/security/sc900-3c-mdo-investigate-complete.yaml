id: sc900-3c-mdo-investigate-complete
objective: "3.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A security operations team uses Microsoft Defender for Office 365 to investigate email threats.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe des opérations de sécurité utilise Microsoft Defender pour Office 365 pour examiner les menaces liées à l'e-mail.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To see the malware detected in email in near real time and start an automated investigation, the team uses [[m1]].

      To identify and categorize a coordinated phishing attack that targets many users, the team uses [[m2]].

      To check whether a given message was received, rejected, deferred or delivered, the team uses [[m3]].
    fr: |
      Pour voir en temps quasi réel les programmes malveillants détectés dans les e-mails et lancer une investigation automatisée, l'équipe utilise [[m1]].

      Pour identifier et classer une attaque d'hameçonnage coordonnée qui vise de nombreux utilisateurs, l'équipe utilise [[m2]].

      Pour vérifier si un message donné a été reçu, rejeté, différé ou remis, l'équipe utilise [[m3]].
  slots:
    - id: m1
      options:
        - { id: sim, text: { en: "Attack simulation training", fr: "la Formation à la simulation d'attaque" } }
        - { id: camp, text: { en: "Campaigns", fr: "les campagnes" } }
        - { id: trace, text: { en: "Message trace", fr: "le Suivi des messages" } }
        - { id: expl, text: { en: "Threat Explorer", fr: "l'Explorateur de menaces" } }
    - id: m2
      options:
        - { id: sim, text: { en: "Attack simulation training", fr: "la Formation à la simulation d'attaque" } }
        - { id: camp, text: { en: "Campaigns", fr: "les campagnes" } }
        - { id: trace, text: { en: "Message trace", fr: "le Suivi des messages" } }
        - { id: expl, text: { en: "Threat Explorer", fr: "l'Explorateur de menaces" } }
    - id: m3
      options:
        - { id: sim, text: { en: "Attack simulation training", fr: "la Formation à la simulation d'attaque" } }
        - { id: camp, text: { en: "Campaigns", fr: "les campagnes" } }
        - { id: trace, text: { en: "Message trace", fr: "le Suivi des messages" } }
        - { id: expl, text: { en: "Threat Explorer", fr: "l'Explorateur de menaces" } }
answer:
  values: { m1: expl, m2: camp, m3: trace }
explanation:
  correct:
    en: "Threat Explorer (also called Explorer) is the near real-time tool with which security operations teams see detected malware, investigate malicious email and start an automated investigation and response process. Campaigns identifies and categorizes coordinated phishing and malware email attacks. Message trace follows a message through the organization and shows its final status. Attack simulation training is not an investigation tool: it runs simulated attacks to train users."
    fr: "L'Explorateur de menaces (aussi appelé Explorateur) est l'outil en temps quasi réel avec lequel les équipes des opérations de sécurité voient les programmes malveillants détectés, examinent les e-mails malveillants et lancent un processus d'investigation et de réponse automatisées. Les campagnes identifient et classent les attaques coordonnées d'hameçonnage et de programmes malveillants par e-mail. Le Suivi des messages suit un message dans l'organisation et montre son état final. La Formation à la simulation d'attaque n'est pas un outil d'investigation : elle lance des attaques simulées pour former les utilisateurs."
references:
  - title: Describe Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/3-describe-defender-office
