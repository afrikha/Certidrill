id: sc900-3b-pol-basics-yn
objective: "3.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The security policies of Microsoft Defender for Cloud are backed by Azure Policy.
        fr: Les stratégies de sécurité de Microsoft Defender pour le cloud reposent sur Azure Policy.
    - id: s2
      text:
        en: A security policy results in a security recommendation when resources are not compliant with it.
        fr: Une stratégie de sécurité donne lieu à une recommandation de sécurité quand des ressources n'y sont pas conformes.
    - id: s3
      text:
        en: Microsoft Defender for Cloud issues security recommendations only after an attack is detected on a resource.
        fr: Microsoft Defender pour le cloud n'émet des recommandations de sécurité qu'après la détection d'une attaque sur une ressource.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Defender for Cloud security policies are backed by Azure Policy, the governance service of Azure. Each policy results in a security recommendation when resources are not compliant with it. Recommendations come from the periodic assessment of the configuration of resources, not from attacks: a detected threat produces a security alert instead."
    fr: "Les stratégies de sécurité de Defender pour le cloud reposent sur Azure Policy, le service de gouvernance d'Azure. Chaque stratégie donne lieu à une recommandation de sécurité quand des ressources n'y sont pas conformes. Les recommandations proviennent de l'évaluation périodique de la configuration des ressources, pas des attaques : une menace détectée produit, elle, une alerte de sécurité."
references:
  - title: Describe how security policies, standards, and recommendations improve cloud security posture
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure
