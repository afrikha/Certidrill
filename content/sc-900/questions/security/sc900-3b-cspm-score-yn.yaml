id: sc900-3b-cspm-score-yn
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the secure score of Microsoft Defender for Cloud, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le score de sécurité de Microsoft Defender pour le cloud, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The recommendations that contribute to the secure score are grouped into security controls.
        fr: Les recommandations qui contribuent au score de sécurité sont regroupées en contrôles de sécurité.
    - id: s2
      text:
        en: The secure score takes into account resources in Azure, Amazon Web Services (AWS) and Google Cloud Platform (GCP).
        fr: Le score de sécurité prend en compte les ressources dans Azure, Amazon Web Services (AWS) et Google Cloud Platform (GCP).
    - id: s3
      text:
        en: The secure score measures the completion of the improvement actions of Compliance Manager.
        fr: Le score de sécurité mesure la réalisation des actions d'amélioration du Gestionnaire de conformité.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Recommendations are grouped into security controls, each a logical group of related recommendations that reflects an attack surface. The improvement actions of Compliance Manager feed the compliance score in Microsoft Purview, a different indicator. Defender for Cloud assesses cross-cloud resources, so the secure score covers Azure, AWS and GCP."
    fr: "Les recommandations sont regroupées en contrôles de sécurité, chacun étant un groupe logique de recommandations liées qui reflète une surface d'attaque. Les actions d'amélioration du Gestionnaire de conformité alimentent le score de conformité de Microsoft Purview, un indicateur différent. Defender pour le cloud évalue les ressources de tous les clouds : le score de sécurité couvre donc Azure, AWS et GCP."
references:
  - title: Describe Cloud security posture management
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management
  - title: Secure score in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
