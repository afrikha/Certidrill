id: sc900-3b-kv-problems-match
objective: "3.1.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each need to the Azure Key Vault capability that meets it.

    To answer, drag the appropriate capability to each need. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque besoin à la fonctionnalité d'Azure Key Vault qui y répond.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque besoin. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cert, text: { en: "Certificate management", fr: "Gestion des certificats" } }
    - { id: ident, text: { en: "Identity management", fr: "Gestion des identités" } }
    - { id: key, text: { en: "Key management", fr: "Gestion des clés" } }
    - { id: secret, text: { en: "Secrets management", fr: "Gestion des secrets" } }
  targets:
    - id: t1
      text: { en: "Store the password and the API key that an application uses, and tightly control access to them", fr: "Stocker le mot de passe et la clé d'API qu'utilise une application, et en contrôler étroitement l'accès" }
    - id: t2
      text: { en: "Provision and deploy the TLS/SSL certificate of a website", fr: "Approvisionner et déployer le certificat TLS/SSL d'un site web" }
    - id: t3
      text: { en: "Create and control the encryption keys used to encrypt data", fr: "Créer et contrôler les clés de chiffrement utilisées pour chiffrer des données" }
answer:
  mapping: { t1: secret, t2: cert, t3: key }
explanation:
  correct:
    en: "Key Vault solves three problems. Secrets management stores tokens, passwords, API keys and other secrets and tightly controls access to them. Certificate management provisions, manages and deploys public and private TLS/SSL certificates. Key management creates and controls the encryption keys used to encrypt data."
    fr: "Key Vault résout trois problèmes. La gestion des secrets stocke des jetons, des mots de passe, des clés d'API et d'autres secrets, et en contrôle étroitement l'accès. La gestion des certificats approvisionne, gère et déploie des certificats TLS/SSL publics et privés. La gestion des clés crée et contrôle les clés de chiffrement utilisées pour chiffrer les données."
  options:
    ident:
      en: "Identity management is the role of Microsoft Entra ID, which Key Vault relies on to authenticate its callers."
      fr: "La gestion des identités est le rôle de Microsoft Entra ID, sur lequel Key Vault s'appuie pour authentifier ses appelants."
references:
  - title: Describe Azure Key Vault
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/8-describe-ways-azure-encrypts-data
