id: sc900-3c-mde-technology-yn
objective: "3.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender for Endpoint, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender pour point de terminaison, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Behavioral sensors embedded in Windows collect and process signals from the operating system for Microsoft Defender for Endpoint."
        fr: "Des capteurs comportementaux intégrés à Windows collectent et traitent les signaux du système d'exploitation pour Microsoft Defender pour point de terminaison."
    - id: s2
      text:
        en: "Web protection in Microsoft Defender for Endpoint regulates access to malicious domains and URLs."
        fr: "La protection web de Microsoft Defender pour point de terminaison régule l'accès aux domaines et aux URL malveillants."
    - id: s3
      text:
        en: "Microsoft Defender for Endpoint protects mailboxes by detonating email attachments before the messages are delivered."
        fr: "Microsoft Defender pour point de terminaison protège les boîtes aux lettres en faisant détoner les pièces jointes des e-mails avant la remise des messages."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Endpoint behavioral sensors are built into Windows 10 and later: they collect and process behavioral signals from the operating system. Network protection and web protection, part of attack surface reduction, regulate access to malicious IP addresses, domains and URLs. Detonating attachments before delivery is the role of Safe Attachments in Microsoft Defender for Office 365, the service that protects email."
    fr: "Les capteurs comportementaux des points de terminaison sont intégrés à Windows 10 et aux versions ultérieures : ils collectent et traitent les signaux comportementaux du système d'exploitation. La protection réseau et la protection web, qui font partie de la réduction de la surface d'attaque, régulent l'accès aux adresses IP, aux domaines et aux URL malveillants. Faire détoner les pièces jointes avant la remise est le rôle de Pièces jointes sécurisées (Safe Attachments) dans Microsoft Defender pour Office 365, le service qui protège l'e-mail."
references:
  - title: Describe Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/4-describe-defender-endpoint
