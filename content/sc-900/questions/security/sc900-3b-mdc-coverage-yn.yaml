id: sc900-3b-mdc-coverage-yn
objective: "3.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Microsoft Defender for Cloud covers workloads that run in on-premises environments.
        fr: Microsoft Defender pour le cloud couvre les charges de travail exécutées dans des environnements locaux.
    - id: s2
      text:
        en: Microsoft Defender for Cloud helps manage security at the code level across several development pipelines.
        fr: Microsoft Defender pour le cloud aide à gérer la sécurité au niveau du code dans plusieurs pipelines de développement.
    - id: s3
      text:
        en: Microsoft Defender for Cloud protects only virtual machines.
        fr: Microsoft Defender pour le cloud protège uniquement les machines virtuelles.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Defender for Cloud covers resources and workloads in Azure, in other clouds and in on-premises environments. Its workload protections are specific to servers, containers, storage, databases and other workloads, not only virtual machines. Its DevSecOps capability unifies security management at the code level across multicloud and multiple-pipeline environments."
    fr: "Defender pour le cloud couvre les ressources et les charges de travail dans Azure, dans d'autres clouds et dans des environnements locaux. Ses protections de charges de travail sont propres aux serveurs, aux conteneurs, au stockage, aux bases de données et à d'autres charges de travail, pas seulement aux machines virtuelles. Sa fonctionnalité DevSecOps unifie la gestion de la sécurité au niveau du code dans des environnements multicloud et multi-pipelines."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
