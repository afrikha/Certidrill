id: sc900-3a-seg-onprem-s2s
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys wants to extend the network of its datacenter into an Azure virtual network, so that the servers in the datacenter and the virtual machines in Azure communicate through an encrypted connection.

    What should Wingtip Toys use?
  fr: |
    Wingtip Toys veut étendre le réseau de son centre de données à un réseau virtuel Azure, pour que les serveurs du centre de données et les machines virtuelles dans Azure communiquent par une connexion chiffrée.

    Que doit utiliser Wingtip Toys ?
body:
  options:
    - id: a
      text: { en: "A virtual network peering", fr: "Un peering de réseaux virtuels" }
    - id: b
      text: { en: "A network security group", fr: "Un groupe de sécurité réseau" }
    - id: c
      text: { en: "A site-to-site VPN", fr: "Un VPN site à site" }
    - id: d
      text: "Azure Bastion"
answer: { optionId: c }
explanation:
  correct:
    en: "A virtual network can be connected to an on-premises network, which extends the private network of the organization into Azure. A site-to-site VPN links the VPN device of the datacenter to a VPN gateway in the virtual network, and the traffic travels through an encrypted tunnel."
    fr: "Un réseau virtuel peut être connecté à un réseau local, ce qui étend le réseau privé de l'organisation dans Azure. Un VPN site à site relie l'appareil VPN du centre de données à une passerelle VPN du réseau virtuel, et le trafic circule dans un tunnel chiffré."
  options:
    a:
      en: "A virtual network peering connects two Azure virtual networks to each other, not a datacenter to Azure."
      fr: "Un peering de réseaux virtuels connecte deux réseaux virtuels Azure entre eux, pas un centre de données à Azure."
    b:
      en: "A network security group filters traffic with allow and deny rules; it doesn't create connectivity between networks."
      fr: "Un groupe de sécurité réseau filtre le trafic par des règles d'autorisation et de refus ; il ne crée pas de connectivité entre réseaux."
    d:
      en: "Azure Bastion gives administrators RDP and SSH access to virtual machines from the Azure portal; it doesn't connect two networks."
      fr: "Azure Bastion donne aux administrateurs un accès RDP et SSH aux machines virtuelles depuis le portail Azure ; il ne connecte pas deux réseaux."
references:
  - title: Describe network segmentation in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
  - title: What is Azure Virtual Network?
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
