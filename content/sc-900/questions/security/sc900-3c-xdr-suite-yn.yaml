id: sc900-3c-xdr-suite-yn
objective: "3.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender XDR, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender XDR, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Defender XDR is used only after a breach has occurred; it provides no preventive protection."
        fr: "Microsoft Defender XDR ne sert qu'après une violation ; il n'apporte aucune protection préventive."
    - id: s2
      text:
        en: "Microsoft Defender for Office 365 is one of the services of Microsoft Defender XDR."
        fr: "Microsoft Defender pour Office 365 est l'un des services de Microsoft Defender XDR."
    - id: s3
      text:
        en: "Microsoft Defender XDR groups related alerts from its services into a single incident."
        fr: "Microsoft Defender XDR regroupe en un seul incident les alertes liées issues de ses services."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Defender XDR is a pre-breach and post-breach suite: it coordinates prevention as well as detection, investigation and response. Defender for Office 365 is one of its services, with Defender for Endpoint, Defender for Identity, Defender for Cloud Apps and others. Its combined incidents queue groups the related alerts and impacted assets of all the services into one incident that tells the full attack story."
    fr: "Defender XDR est une suite qui agit avant et après une violation : elle coordonne la prévention aussi bien que la détection, l'investigation et la réponse. Defender pour Office 365 est l'un de ses services, avec Defender pour point de terminaison, Defender pour Identity, Defender pour les applications cloud et d'autres. Sa file d'attente d'incidents combinée regroupe les alertes liées et les ressources touchées de tous les services en un seul incident qui raconte toute l'histoire de l'attaque."
references:
  - title: Describe Microsoft Defender XDR services
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services
