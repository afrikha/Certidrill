id: sc900-3a-nsg-tags-sentence
objective: "3.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about the security rules of a network security group (NSG), select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur les règles de sécurité d'un groupe de sécurité réseau (NSG), sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      As the source or destination of a rule, [[tag]] represents a group of IP address prefixes from a given Azure service.

      [[asg]] groups virtual machines according to the structure of an application, so that a rule refers to the group instead of IP addresses.

      The default security rules of an NSG [[def]].
    fr: |
      Comme source ou destination d'une règle, [[tag]] représente un groupe de préfixes d'adresses IP d'un service Azure donné.

      [[asg]] regroupe des machines virtuelles selon la structure d'une application, pour qu'une règle désigne le groupe plutôt que des adresses IP.

      Les règles de sécurité par défaut d'un NSG [[def]].
  slots:
    - id: tag
      options:
        - { id: asg, text: { en: "an application security group", fr: "un groupe de sécurité d'application" } }
        - { id: st, text: { en: "a service tag", fr: "une balise de service" } }
        - { id: port, text: { en: "a port range", fr: "une plage de ports" } }
    - id: asg
      options:
        - { id: asg, text: { en: "An application security group", fr: "Un groupe de sécurité d'application" } }
        - { id: st, text: { en: "A service tag", fr: "Une balise de service" } }
        - { id: peer, text: { en: "A virtual network peering", fr: "Un peering de réseaux virtuels" } }
    - id: def
      options:
        - { id: remove, text: { en: "can be removed, but can't be overridden by other rules", fr: "peuvent être supprimées, mais pas remplacées par d'autres règles" } }
        - { id: none, text: { en: "can be neither removed nor overridden by other rules", fr: "ne peuvent être ni supprimées ni remplacées par d'autres règles" } }
        - { id: override, text: { en: "can't be removed, but can be overridden by other rules", fr: "ne peuvent pas être supprimées, mais peuvent être remplacées par d'autres règles" } }
answer:
  values: { tag: st, asg: asg, def: override }
explanation:
  correct:
    en: "A service tag represents a group of IP address prefixes from a given Azure service, which avoids maintaining the addresses yourself. An application security group groups virtual machines by their role in an application, such as web servers or database servers; rules that refer to the group apply automatically to the virtual machines added to it. The default rules can't be removed, but new rules with a higher priority override them."
    fr: "Une balise de service représente un groupe de préfixes d'adresses IP d'un service Azure donné, ce qui évite de tenir à jour les adresses soi-même. Un groupe de sécurité d'application regroupe des machines virtuelles selon leur rôle dans une application, par exemple serveurs web ou serveurs de base de données ; les règles qui désignent le groupe s'appliquent automatiquement aux machines virtuelles qui y sont ajoutées. Les règles par défaut ne peuvent pas être supprimées, mais de nouvelles règles de priorité plus élevée les remplacent."
  options:
    port:
      en: "A port range is a separate property of a rule; it designates ports, not the IP addresses of a service."
      fr: "Une plage de ports est une propriété distincte d'une règle ; elle désigne des ports, pas les adresses IP d'un service."
    peer:
      en: "A virtual network peering connects two virtual networks; it doesn't group virtual machines for security rules."
      fr: "Un peering de réseaux virtuels connecte deux réseaux virtuels ; il ne regroupe pas des machines virtuelles pour des règles de sécurité."
    remove:
      en: "It is the opposite: the default rules stay in the NSG, and rules that you add take precedence over them."
      fr: "C'est l'inverse : les règles par défaut restent dans le NSG, et les règles que vous ajoutez ont la priorité sur elles."
references:
  - title: Describe Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/6-describe-azure-network-security-groups
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
