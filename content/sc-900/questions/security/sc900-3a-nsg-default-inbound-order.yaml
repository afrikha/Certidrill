id: sc900-3a-nsg-default-inbound-order
objective: "3.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A network security group (NSG) contains only its default security rules. A packet arrives from the internet, and the NSG evaluates it against the default inbound rules until one of them matches.

    In which order does the NSG process its three default inbound rules? To answer, move the three appropriate rules from the list of rules to the answer area and arrange them in the order in which they are processed.
  fr: |
    Un groupe de sécurité réseau (NSG) ne contient que ses règles de sécurité par défaut. Un paquet arrive d'internet, et le NSG le compare aux règles entrantes par défaut jusqu'à ce que l'une d'elles corresponde.

    Dans quel ordre le NSG traite-t-il ses trois règles entrantes par défaut ? Pour répondre, déplacez les trois règles appropriées de la liste des règles vers la zone de réponse et classez-les dans l'ordre où elles sont traitées.
body:
  count: 3
  actions:
    - id: outnet
      text:
        en: "**AllowInternetOutBound**, which allows traffic to the internet"
        fr: "**AllowInternetOutBound**, qui autorise le trafic vers internet"
    - id: inlb
      text:
        en: "**AllowAzureLoadBalancerInBound**, which allows traffic from the Azure load balancer"
        fr: "**AllowAzureLoadBalancerInBound**, qui autorise le trafic venant de l'équilibreur de charge Azure"
    - id: indeny
      text:
        en: "**DenyAllInBound**, which denies all traffic"
        fr: "**DenyAllInBound**, qui refuse tout le trafic"
    - id: outvnet
      text:
        en: "**AllowVnetOutBound**, which allows traffic to the virtual network"
        fr: "**AllowVnetOutBound**, qui autorise le trafic vers le réseau virtuel"
    - id: invnet
      text:
        en: "**AllowVnetInBound**, which allows traffic from the virtual network"
        fr: "**AllowVnetInBound**, qui autorise le trafic venant du réseau virtuel"
    - id: outdeny
      text:
        en: "**DenyAllOutBound**, which denies all traffic"
        fr: "**DenyAllOutBound**, qui refuse tout le trafic"
answer:
  sequence: [ invnet, inlb, indeny ]
explanation:
  correct:
    en: |
      Rules are processed from the lowest priority number to the highest, and processing stops at the first rule that matches. Among the default inbound rules, AllowVnetInBound has the lowest number and is processed first, then AllowAzureLoadBalancerInBound, and DenyAllInBound comes last: it denies whatever the previous rules didn't allow, such as a packet from the internet.
    fr: |
      Les règles sont traitées du plus petit numéro de priorité au plus grand, et le traitement s'arrête à la première règle qui correspond. Parmi les règles entrantes par défaut, AllowVnetInBound a le plus petit numéro et est traitée en premier, puis vient AllowAzureLoadBalancerInBound, et DenyAllInBound arrive en dernier : elle refuse tout ce que les règles précédentes n'ont pas autorisé, par exemple un paquet venant d'internet.
  options:
    outnet: { en: "This default rule is an outbound rule; it isn't evaluated for a packet that arrives.", fr: "Cette règle par défaut est une règle sortante ; elle n'est pas évaluée pour un paquet qui arrive." }
    outvnet: { en: "This default rule applies to outbound traffic to the virtual network, not to inbound traffic.", fr: "Cette règle par défaut s'applique au trafic sortant vers le réseau virtuel, pas au trafic entrant." }
    outdeny: { en: "This rule is the last of the default outbound rules; the inbound rules end with DenyAllInBound.", fr: "Cette règle est la dernière des règles sortantes par défaut ; les règles entrantes se terminent par DenyAllInBound." }
references:
  - title: Describe Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/6-describe-azure-network-security-groups
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
