id: sc900-3a-seg-subnets-yn
objective: "3.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    An Azure virtual network contains several subnets.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel Azure contient plusieurs sous-réseaux.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Azure routes traffic between the subnets only after you create custom routes."
        fr: "Azure n'achemine le trafic entre les sous-réseaux qu'après la création d'itinéraires personnalisés."
    - id: s2
      text:
        en: "Each subnet can have its own access controls."
        fr: "Chaque sous-réseau peut avoir ses propres contrôles d'accès."
    - id: s3
      text:
        en: "Both network security groups and Azure Firewall can filter the traffic between the subnets."
        fr: "Les groupes de sécurité réseau comme le Pare-feu Azure peuvent filtrer le trafic entre les sous-réseaux."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Azure automatically routes traffic between the subnets of a virtual network and the connected networks; custom routes are optional and only change how the traffic flows. Segmentation between subnets therefore relies on filtering: each subnet can have its own controls, and network security groups and Azure Firewall filter the traffic between subnets to decide what is allowed in and out of each part of the network."
    fr: "Azure achemine automatiquement le trafic entre les sous-réseaux d'un réseau virtuel et les réseaux connectés ; les itinéraires personnalisés sont facultatifs et ne font que modifier le chemin du trafic. La segmentation entre sous-réseaux repose donc sur le filtrage : chaque sous-réseau peut avoir ses propres contrôles, et les groupes de sécurité réseau et le Pare-feu Azure filtrent le trafic entre sous-réseaux pour décider de ce qui peut entrer et sortir de chaque partie du réseau."
  options:
    s1:
      en: "Routing between the subnets of a virtual network works by default; this is why creating subnets alone doesn't isolate them, and filtering is needed."
      fr: "Le routage entre les sous-réseaux d'un réseau virtuel fonctionne par défaut ; c'est pourquoi la seule création de sous-réseaux ne les isole pas et qu'un filtrage est nécessaire."
references:
  - title: Describe network segmentation in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
  - title: What is Azure Virtual Network?
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
