id: sc900-3a-waf-central-benefits
objective: "3.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum protects all its web applications with one centralized web application firewall.

    Which two benefits does this approach provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum protège toutes ses applications web avec un seul pare-feu d'applications web centralisé.

    Quels sont les deux avantages de cette approche ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "A known vulnerability can be patched in one place instead of in each web application."
        fr: "Une vulnérabilité connue peut être corrigée à un seul endroit plutôt que dans chaque application web."
    - id: b
      text:
        en: "The secrets and certificates of the applications are kept in a hardware security module."
        fr: "Les secrets et les certificats des applications sont conservés dans un module de sécurité matériel."
    - id: c
      text:
        en: "Administrators connect to the web servers over RDP without a public IP address."
        fr: "Les administrateurs se connectent aux serveurs web par RDP sans adresse IP publique."
    - id: d
      text:
        en: "The security management of the web applications is simpler."
        fr: "La gestion de la sécurité des applications web est plus simple."
    - id: e
      text:
        en: "Volumetric attacks on layers 3 and 4 are absorbed before they reach the applications."
        fr: "Les attaques volumétriques des couches 3 et 4 sont absorbées avant d'atteindre les applications."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A centralized web application firewall makes security management simpler and shortens the reaction to a threat: a known vulnerability is patched in one place, instead of securing each web application separately. Application administrators also get better assurance of protection against threats and intrusions."
    fr: "Un pare-feu d'applications web centralisé simplifie la gestion de la sécurité et raccourcit la réaction à une menace : une vulnérabilité connue se corrige à un seul endroit, au lieu de sécuriser chaque application web séparément. Les administrateurs d'applications ont aussi une meilleure assurance de protection contre les menaces et les intrusions."
  options:
    b:
      en: "Storing secrets, keys and certificates, with hardware security modules in the Premium tier, is the role of Azure Key Vault."
      fr: "Le stockage des secrets, des clés et des certificats, avec des modules de sécurité matériels au niveau Premium, est le rôle d'Azure Key Vault."
    c:
      en: "Secure RDP and SSH connectivity to machines that have no public IP address is provided by Azure Bastion."
      fr: "La connectivité RDP et SSH sécurisée à des machines sans adresse IP publique est fournie par Azure Bastion."
    e:
      en: "Attacks on layers 3 and 4 are mitigated by Azure DDoS Protection; a web application firewall works at layer 7."
      fr: "Les attaques des couches 3 et 4 sont atténuées par Azure DDoS Protection ; un pare-feu d'applications web travaille à la couche 7."
references:
  - title: Describe Web Application Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/4-describe-web-application-firewall
  - title: Introduction to Azure Web Application Firewall
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/overview
