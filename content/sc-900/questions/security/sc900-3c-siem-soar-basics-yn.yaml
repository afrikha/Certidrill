id: sc900-3c-siem-soar-basics-yn
objective: "3.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A SIEM system groups related alerts into incidents that analysts investigate."
        fr: "Un système SIEM regroupe les alertes liées en incidents que les analystes examinent."
    - id: s2
      text:
        en: "The main purpose of a SOAR system is to store log data for long-term retention."
        fr: "Le but principal d'un système SOAR est de stocker les données de journaux pour une conservation à long terme."
    - id: s3
      text:
        en: "Microsoft Sentinel provides both SIEM and SOAR capabilities."
        fr: "Microsoft Sentinel fournit à la fois des fonctionnalités SIEM et SOAR."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Incident creation is a SIEM function: related alerts are grouped into a case file. A SOAR system does not store logs; its purpose is to orchestrate security tools and automate the response to alerts. Microsoft Sentinel is a cloud-native solution that combines SIEM and SOAR in a single platform."
    fr: "La création d'incidents est une fonction du SIEM : les alertes liées sont regroupées en un dossier. Un système SOAR ne stocke pas les journaux ; son but est d'orchestrer les outils de sécurité et d'automatiser la réponse aux alertes. Microsoft Sentinel est une solution native cloud qui réunit SIEM et SOAR dans une seule plateforme."
references:
  - title: Define the concepts of SIEM and SOAR
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar
  - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management
