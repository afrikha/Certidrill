id: sc900-3d-mdi-posture-secure-score
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Microsoft Defender for Identity proactively assesses the identity posture of an organization and proposes improvements.

    Where are these security assessments made available?
  fr: |
    Microsoft Defender pour Identity évalue de manière proactive la posture des identités d'une organisation et propose des améliorations.

    Où ces évaluations de sécurité sont-elles mises à disposition ?
body:
  options:
    - id: a
      text: { en: "In Compliance Manager, with the improvement actions", fr: "Dans le Gestionnaire de conformité, avec les actions d'amélioration" }
    - id: b
      text: { en: "In the Service Trust Portal, with the audit reports", fr: "Dans le Portail d'approbation des services, avec les rapports d'audit" }
    - id: c
      text: { en: "In Microsoft Secure Score, with the recommended actions", fr: "Dans le Degré de sécurisation Microsoft (Microsoft Secure Score), avec les actions recommandées" }
    - id: d
      text: { en: "In Microsoft Entra access reviews, with the review results", fr: "Dans les révisions d'accès Microsoft Entra, avec les résultats des révisions" }
answer: { optionId: c }
explanation:
  correct:
    en: "The identity security posture assessments of Defender for Identity are available from Microsoft Secure Score, in the Microsoft Defender portal. They point out risky configurations and exposures of the identity infrastructure and give guidance to correct them, which raises the score."
    fr: "Les évaluations de la posture de sécurité des identités de Defender pour Identity sont disponibles dans le Degré de sécurisation Microsoft (Microsoft Secure Score), dans le portail Microsoft Defender. Elles signalent les configurations à risque et les expositions de l'infrastructure d'identité et donnent des conseils pour les corriger, ce qui augmente le score."
  options:
    a:
      en: "Compliance Manager measures progress toward regulatory requirements with a compliance score; it does not carry the posture assessments of Defender for Identity."
      fr: "Le Gestionnaire de conformité mesure la progression vers les exigences réglementaires avec un score de conformité ; il ne porte pas les évaluations de posture de Defender pour Identity."
    b:
      en: "The Service Trust Portal publishes audit reports and other documents about Microsoft cloud services, not assessments of your own environment."
      fr: "Le Portail d'approbation des services publie des rapports d'audit et d'autres documents sur les services cloud de Microsoft, pas des évaluations de votre propre environnement."
    d:
      en: "Access reviews check whether users still need their access; they are not where Defender for Identity reports its posture assessments."
      fr: "Les révisions d'accès vérifient si les utilisateurs ont toujours besoin de leurs accès ; ce n'est pas là que Defender pour Identity publie ses évaluations de posture."
references:
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
