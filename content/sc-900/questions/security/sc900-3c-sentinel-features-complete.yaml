id: sc900-3c-sentinel-features-complete
objective: "3.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Sentinel, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur Microsoft Sentinel, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Sentinel uses [[f1]] to ingest security data from Microsoft and non-Microsoft sources.

      It uses [[f2]] to query the collected data regularly and generate alerts.

      It uses [[f3]] to run a set of remediation actions as a workflow.
    fr: |
      Microsoft Sentinel utilise [[f1]] pour ingérer les données de sécurité de sources Microsoft et non-Microsoft.

      Il utilise [[f2]] pour interroger régulièrement les données collectées et émettre des alertes.

      Il utilise [[f3]] pour exécuter un ensemble d'actions de correction sous forme de flux de travail.
  slots:
    - id: f1
      options:
        - { id: rules, text: { en: "analytics rules", fr: "des règles d'analyse" } }
        - { id: conn, text: { en: "data connectors", fr: "des connecteurs de données" } }
        - { id: play, text: { en: "playbooks", fr: "des playbooks" } }
        - { id: work, text: { en: "workbooks", fr: "des classeurs (workbooks)" } }
    - id: f2
      options:
        - { id: rules, text: { en: "analytics rules", fr: "des règles d'analyse" } }
        - { id: conn, text: { en: "data connectors", fr: "des connecteurs de données" } }
        - { id: play, text: { en: "playbooks", fr: "des playbooks" } }
        - { id: work, text: { en: "workbooks", fr: "des classeurs (workbooks)" } }
    - id: f3
      options:
        - { id: rules, text: { en: "analytics rules", fr: "des règles d'analyse" } }
        - { id: conn, text: { en: "data connectors", fr: "des connecteurs de données" } }
        - { id: play, text: { en: "playbooks", fr: "des playbooks" } }
        - { id: work, text: { en: "workbooks", fr: "des classeurs (workbooks)" } }
answer:
  values: { f1: conn, f2: rules, f3: play }
explanation:
  correct:
    en: "Data connectors are the collection stage: they bring in data from Microsoft services, other platforms and custom sources. Analytics rules are the detection stage: they run on the collected data and raise alerts, which are grouped into incidents. Playbooks belong to the response stage: workflows that execute remediation actions. Workbooks only visualize data in reports."
    fr: "Les connecteurs de données sont l'étape de collecte : ils font entrer les données des services Microsoft, d'autres plateformes et de sources personnalisées. Les règles d'analyse sont l'étape de détection : elles s'exécutent sur les données collectées et émettent des alertes, regroupées en incidents. Les playbooks relèvent de l'étape de réponse : des flux de travail qui exécutent des actions de correction. Les classeurs se limitent à visualiser les données dans des rapports."
references:
  - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management
