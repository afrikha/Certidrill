id: sc900-3b-bastion-complete
objective: "3.1.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Bastion provides secure [[proto]] connectivity to virtual machines.

      Azure Bastion opens the connection to a virtual machine by using the virtual machine's [[ip]].

      Azure Bastion is [[kind]].
    fr: |
      Azure Bastion fournit aux machines virtuelles une connectivité [[proto]] sécurisée.

      Azure Bastion ouvre la connexion vers une machine virtuelle en utilisant [[ip]] de celle-ci.

      Azure Bastion est [[kind]].
  slots:
    - id: proto
      options:
        - { id: web, text: { en: "HTTP and HTTPS", fr: "HTTP et HTTPS" } }
        - { id: rdpssh, text: { en: "RDP and SSH", fr: "RDP et SSH" } }
        - { id: files, text: { en: "SMB and NFS", fr: "SMB et NFS" } }
    - id: ip
      options:
        - { id: pub, text: { en: "public IP address", fr: "l'adresse IP publique" } }
        - { id: dns, text: { en: "public DNS name", fr: "le nom DNS public" } }
        - { id: priv, text: { en: "private IP address", fr: "l'adresse IP privée" } }
    - id: kind
      options:
        - { id: paas, text: { en: "a fully managed platform as a service (PaaS) service", fr: "un service PaaS (platform as a service) entièrement managé" } }
        - { id: agent, text: { en: "an agent that you install on each virtual machine", fr: "un agent que vous installez sur chaque machine virtuelle" } }
        - { id: jump, text: { en: "a virtual machine that you patch and harden yourself", fr: "une machine virtuelle que vous corrigez et renforcez vous-même" } }
answer:
  values: { proto: rdpssh, ip: priv, kind: paas }
explanation:
  correct:
    en: "Azure Bastion gives secure RDP and SSH connectivity to virtual machines over TLS. It opens the session by using the private IP address of the virtual machine, which therefore needs no public IP address. It is a fully platform-managed PaaS service that Microsoft keeps hardened and up to date."
    fr: "Azure Bastion fournit une connectivité RDP et SSH sécurisée aux machines virtuelles, sur TLS. Il ouvre la session en utilisant l'adresse IP privée de la machine virtuelle, qui n'a donc besoin d'aucune adresse IP publique. C'est un service PaaS entièrement managé par la plateforme, que Microsoft maintient renforcé et à jour."
  options:
    agent:
      en: "The virtual machines need no agent and no special client software."
      fr: "Les machines virtuelles n'ont besoin d'aucun agent ni d'aucun logiciel client particulier."
    jump:
      en: "A jump box that you maintain yourself is what Azure Bastion replaces: the Azure platform hardens and updates the service."
      fr: "Une machine de rebond que vous maintenez vous-même est ce qu'Azure Bastion remplace : la plateforme Azure renforce et met à jour le service."
references:
  - title: Describe Azure Bastion
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/7-describe-azure-bastion-just-in-time-access
