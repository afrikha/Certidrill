id: sc900-3b-cspm-defender-adds
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses only the free Foundational CSPM plan of Microsoft Defender for Cloud.

    Which two capabilities would the company gain by enabling the Defender CSPM plan?

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise uniquement le plan gratuit CSPM de base (Foundational CSPM) de Microsoft Defender pour le cloud.

    Quelles sont les deux fonctionnalités que l'entreprise obtiendrait en activant le plan Defender CSPM ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attack path analysis", fr: "L'analyse du chemin d'attaque" } }
    - { id: b, text: { en: "Secure score", fr: "Le score de sécurité" } }
    - { id: c, text: { en: "Security recommendations", fr: "Les recommandations de sécurité" } }
    - { id: d, text: { en: "Cloud security explorer", fr: "L'explorateur de sécurité du cloud" } }
    - { id: e, text: { en: "Asset inventory", fr: "L'inventaire des ressources" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Attack path analysis and the cloud security explorer are advanced posture capabilities that belong to the paid Defender CSPM plan, together with governance, DSPM and AI SPM. The other three capabilities are already part of Foundational CSPM."
    fr: "L'analyse du chemin d'attaque et l'explorateur de sécurité du cloud sont des fonctionnalités de posture avancées qui relèvent du plan payant Defender CSPM, avec la gouvernance, la DSPM et l'AI SPM. Les trois autres fonctionnalités font déjà partie du CSPM de base (Foundational CSPM)."
  options:
    b: { en: "The secure score is available to every Defender for Cloud customer, including with Foundational CSPM.", fr: "Le score de sécurité est accessible à tous les clients de Defender pour le cloud, y compris avec le CSPM de base." }
    c: { en: "Continuous assessment with security recommendations is included in Foundational CSPM.", fr: "L'évaluation continue avec des recommandations de sécurité est incluse dans le CSPM de base." }
    e: { en: "Asset discovery and inventory are included in Foundational CSPM.", fr: "La découverte et l'inventaire des ressources sont inclus dans le CSPM de base." }
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
  - title: Describe Cloud security posture management
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management
