id: sc900-3c-mdca-casb
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What type of solution is Microsoft Defender for Cloud Apps?
  fr: |
    Quel type de solution est Microsoft Defender pour les applications cloud ?
body:
  options:
    - id: a
      text: { en: "A security information and event management (SIEM) system", fr: "Un système de gestion des informations et des événements de sécurité (SIEM)" }
    - id: b
      text: { en: "An endpoint detection and response (EDR) platform", fr: "Une plateforme de détection et de réponse des points de terminaison (EDR)" }
    - id: c
      text: { en: "A cloud workload protection platform (CWPP)", fr: "Une plateforme de protection des charges de travail cloud (CWPP)" }
    - id: d
      text: { en: "A cloud access security broker (CASB)", fr: "Un broker de sécurité d'accès au cloud (CASB)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Defender for Cloud Apps is a cloud access security broker: a gatekeeper that brokers access in real time between enterprise users and the cloud resources they use. Around that role, it discovers cloud app usage and shadow IT, protects information and defends SaaS applications against threats."
    fr: "Defender pour les applications cloud est un broker de sécurité d'accès au cloud : un gardien qui régule en temps réel l'accès entre les utilisateurs de l'entreprise et les ressources cloud qu'ils utilisent. Autour de ce rôle, il découvre l'usage des applications cloud et l'informatique fantôme, protège les informations et défend les applications SaaS contre les menaces."
  options:
    a:
      en: "The Microsoft SIEM is Microsoft Sentinel, which collects and correlates data from the whole organization."
      fr: "Le SIEM de Microsoft est Microsoft Sentinel, qui collecte et corrèle les données de toute l'organisation."
    b:
      en: "Endpoint detection and response is a capability of Microsoft Defender for Endpoint, which protects devices."
      fr: "La détection et la réponse des points de terminaison sont une fonctionnalité de Microsoft Defender pour point de terminaison, qui protège les appareils."
    c:
      en: "Cloud workload protection for servers, containers and databases is provided by Microsoft Defender for Cloud."
      fr: "La protection des charges de travail cloud pour les serveurs, les conteneurs et les bases de données est fournie par Microsoft Defender pour le cloud."
references:
  - title: Describe Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/5-describe-microsoft-cloud-app-security
  - title: Microsoft Defender for Cloud Apps overview
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/what-is-defender-for-cloud-apps
