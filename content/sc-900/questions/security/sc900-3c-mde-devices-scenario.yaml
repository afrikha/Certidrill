id: sc900-3c-mde-devices-scenario
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys wants to detect, investigate and respond to advanced threats on the Windows laptops and the Android phones of its employees.

    Which Microsoft Defender XDR service should Tailspin Toys use?
  fr: |
    Tailspin Toys veut détecter et examiner les menaces avancées sur les ordinateurs portables Windows et les téléphones Android de ses employés, et y répondre.

    Quel service Microsoft Defender XDR Tailspin Toys doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Microsoft Defender for Identity", fr: "Microsoft Defender pour Identity" }
    - id: b
      text: { en: "Microsoft Defender for Endpoint", fr: "Microsoft Defender pour point de terminaison" }
    - id: c
      text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" }
    - id: d
      text: { en: "Microsoft Defender for Office 365", fr: "Microsoft Defender pour Office 365" }
answer: { optionId: b }
explanation:
  correct:
    en: "Defender for Endpoint is the enterprise endpoint security platform: it helps prevent, detect, investigate and respond to advanced threats on endpoints such as laptops, phones, tablets and PCs. It supports Windows, macOS, Linux, Android and iOS."
    fr: "Defender pour point de terminaison est la plateforme de sécurité des points de terminaison pour l'entreprise : elle aide à prévenir, détecter et examiner les menaces avancées, et à y répondre, sur les points de terminaison comme les ordinateurs portables, les téléphones, les tablettes et les PC. Elle prend en charge Windows, macOS, Linux, Android et iOS."
  options:
    a:
      en: "Defender for Identity detects threats against the identity infrastructure, such as on-premises Active Directory, not threats on devices."
      fr: "Defender pour Identity détecte les menaces contre l'infrastructure d'identité, comme Active Directory local, pas les menaces sur les appareils."
    c:
      en: "Defender for Cloud Apps protects SaaS applications and the data they hold."
      fr: "Defender pour les applications cloud protège les applications SaaS et les données qu'elles contiennent."
    d:
      en: "Defender for Office 365 protects email and collaboration tools against threats such as phishing and malware."
      fr: "Defender pour Office 365 protège l'e-mail et les outils de collaboration contre les menaces comme l'hameçonnage et les programmes malveillants."
references:
  - title: Describe Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/4-describe-defender-endpoint
  - title: Microsoft Defender for Endpoint overview
    url: https://learn.microsoft.com/en-us/defender-endpoint/microsoft-defender-endpoint
