id: sc900-3a-nsg-stateful-response
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A network security group (NSG) contains an inbound security rule that allows HTTPS requests from the internet to a web server.

    Which statement describes how the NSG treats the responses of the web server to these requests?
  fr: |
    Un groupe de sécurité réseau (NSG) contient une règle de sécurité entrante qui autorise les requêtes HTTPS venant d'internet vers un serveur web.

    Quelle affirmation décrit la façon dont le NSG traite les réponses du serveur web à ces requêtes ?
body:
  options:
    - id: a
      text:
        en: "The responses are allowed automatically, because the NSG keeps track of the allowed connections."
        fr: "Les réponses sont autorisées automatiquement, car le NSG garde la trace des connexions autorisées."
    - id: b
      text:
        en: "The responses are denied until an outbound rule with the same priority allows them."
        fr: "Les réponses sont refusées tant qu'une règle sortante de même priorité ne les autorise pas."
    - id: c
      text:
        en: "The responses are allowed only if the NSG is associated with a network interface."
        fr: "Les réponses ne sont autorisées que si le NSG est associé à une interface réseau."
    - id: d
      text:
        en: "The responses are denied, because an NSG filters inbound traffic only."
        fr: "Les réponses sont refusées, car un NSG ne filtre que le trafic entrant."
answer: { optionId: a }
explanation:
  correct:
    en: "Network security groups are stateful: a flow record is created for each existing connection. When an inbound rule allows a connection, the response to that connection is allowed without a matching outbound rule, and the same applies in the other direction."
    fr: "Les groupes de sécurité réseau sont avec état : un enregistrement de flux est créé pour chaque connexion existante. Lorsqu'une règle entrante autorise une connexion, la réponse à cette connexion est autorisée sans règle sortante correspondante, et il en va de même dans l'autre sens."
  options:
    b:
      en: "No matching outbound rule is needed for the response; a rule is required only for connections that are started in the outbound direction."
      fr: "Aucune règle sortante correspondante n'est nécessaire pour la réponse ; une règle n'est requise que pour les connexions initiées dans le sens sortant."
    c:
      en: "The behavior is the same whether the NSG is associated with a subnet or with a network interface."
      fr: "Le comportement est le même, que le NSG soit associé à un sous-réseau ou à une interface réseau."
    d:
      en: "An NSG has inbound and outbound security rules; it filters both directions, and it still lets the responses to allowed connections through."
      fr: "Un NSG possède des règles de sécurité entrantes et sortantes ; il filtre les deux sens, et laisse malgré tout passer les réponses aux connexions autorisées."
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
