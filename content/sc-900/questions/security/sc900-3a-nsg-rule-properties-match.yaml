id: sc900-3a-nsg-rule-properties-match
objective: "3.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the property of a network security group (NSG) security rule that it describes.

    To answer, drag the appropriate property to each description. Each property may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la propriété d'une règle de sécurité de groupe de sécurité réseau (NSG) qu'elle décrit.

    Pour répondre, faites glisser la propriété appropriée vers chaque description. Chaque propriété peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: prio, text: { en: "Priority", fr: "Priorité" } }
    - { id: dir, text: { en: "Direction", fr: "Direction" } }
    - { id: act, text: { en: "Action", fr: "Action" } }
    - { id: proto, text: { en: "Protocol", fr: "Protocole" } }
    - { id: port, text: { en: "Port range", fr: "Plage de ports" } }
  targets:
    - id: t1
      text:
        en: "States whether the rule applies to inbound or to outbound traffic"
        fr: "Indique si la règle s'applique au trafic entrant ou au trafic sortant"
    - id: t2
      text:
        en: "Determines which rule is processed first when several rules exist"
        fr: "Détermine quelle règle est traitée en premier lorsque plusieurs règles existent"
    - id: t3
      text:
        en: "Takes a value such as TCP, UDP or ICMP"
        fr: "Prend une valeur comme TCP, UDP ou ICMP"
    - id: t4
      text:
        en: "States whether the traffic that matches the rule is allowed or denied"
        fr: "Indique si le trafic qui correspond à la règle est autorisé ou refusé"
answer:
  mapping: { t1: dir, t2: prio, t3: proto, t4: act }
explanation:
  correct:
    en: "Each security rule of an NSG has a priority, which sets the order of processing from the lowest number to the highest; a direction, inbound or outbound; a protocol, which is TCP, UDP, ICMP or Any; and an action, allow or deny, applied to the traffic that matches the rule. A rule also has a name, a source or destination, and a port range."
    fr: "Chaque règle de sécurité d'un NSG possède une priorité, qui fixe l'ordre de traitement du plus petit nombre au plus grand ; une direction, entrante ou sortante ; un protocole, soit TCP, UDP, ICMP ou Any ; et une action, autoriser ou refuser, appliquée au trafic qui correspond à la règle. Une règle a aussi un nom, une source ou une destination, et une plage de ports."
  options:
    port:
      en: "The port range designates one port or a range of ports, such as 443; it gives neither the protocol nor the order of the rules."
      fr: "La plage de ports désigne un port ou une plage de ports, par exemple 443 ; elle ne donne ni le protocole ni l'ordre des règles."
references:
  - title: Describe Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/6-describe-azure-network-security-groups
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
