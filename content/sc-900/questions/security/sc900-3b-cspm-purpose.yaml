id: sc900-3b-cspm-purpose
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does cloud security posture management (CSPM) do in Microsoft Defender for Cloud?
  fr: |
    Que fait la gestion de la posture de sécurité cloud (CSPM) dans Microsoft Defender pour le cloud ?
body:
  options:
    - id: a
      text: { en: "It collects logs from many sources and correlates them into incidents.", fr: "Elle collecte des journaux de nombreuses sources et les met en corrélation en incidents." }
    - id: b
      text: { en: "It verifies the identity of users before they access resources.", fr: "Elle vérifie l'identité des utilisateurs avant qu'ils n'accèdent aux ressources." }
    - id: c
      text: { en: "It runs automated playbooks in response to security alerts.", fr: "Elle exécute des playbooks automatisés en réponse aux alertes de sécurité." }
    - id: d
      text: { en: "It assesses how resources are configured and gives hardening guidance.", fr: "Elle évalue la configuration des ressources et donne des conseils de renforcement." }
answer: { optionId: d }
explanation:
  correct:
    en: "CSPM gives visibility into the current security situation: Defender for Cloud continually assesses the resources for security issues such as misconfigurations, and provides hardening guidance to improve the security posture."
    fr: "La CSPM donne de la visibilité sur la situation de sécurité actuelle : Defender pour le cloud évalue en continu les ressources à la recherche de problèmes de sécurité, comme des configurations incorrectes, et fournit des conseils de renforcement pour améliorer la posture de sécurité."
  options:
    a:
      en: "Collecting and correlating security data into incidents describes a SIEM solution such as Microsoft Sentinel."
      fr: "Collecter des données de sécurité et les mettre en corrélation en incidents décrit une solution SIEM comme Microsoft Sentinel."
    b:
      en: "Verifying the identity of users is authentication, performed by an identity provider such as Microsoft Entra ID."
      fr: "Vérifier l'identité des utilisateurs est l'authentification, assurée par un fournisseur d'identité comme Microsoft Entra ID."
    c:
      en: "Running playbooks in response to alerts describes security orchestration, automation and response (SOAR)."
      fr: "Exécuter des playbooks en réponse aux alertes décrit l'orchestration, l'automatisation et la réponse en matière de sécurité (SOAR)."
references:
  - title: Describe Cloud security posture management
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management
