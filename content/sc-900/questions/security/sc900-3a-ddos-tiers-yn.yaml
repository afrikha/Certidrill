id: sc900-3a-ddos-tiers-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about DDoS protection in Azure, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la protection DDoS dans Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An Azure service for which no DDoS Protection tier is enabled has no protection against DDoS attacks."
        fr: "Un service Azure pour lequel aucun niveau de DDoS Protection n'est activé n'a aucune protection contre les attaques DDoS."
    - id: s2
      text:
        en: "DDoS IP Protection has the same core engineering features as DDoS Network Protection."
        fr: "DDoS IP Protection offre les mêmes fonctionnalités d'ingénierie de base que DDoS Network Protection."
    - id: s3
      text:
        en: "DDoS IP Protection is enabled on a virtual network and protects every resource in it."
        fr: "DDoS IP Protection s'active sur un réseau virtuel et protège toutes les ressources qu'il contient."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Every Azure service is covered by the default DDoS infrastructure protection, at no extra cost and without configuration, even when no tier is enabled. The two tiers share the same core engineering features; they differ in scope and in value-added services. DDoS IP Protection follows a pay-per-protected-IP model and is enabled on a public IP address, whereas DDoS Network Protection is enabled on a virtual network and protects the resources in it."
    fr: "Tous les services Azure sont couverts par la protection d'infrastructure DDoS par défaut, sans coût supplémentaire ni configuration, même lorsqu'aucun niveau n'est activé. Les deux niveaux partagent les mêmes fonctionnalités d'ingénierie de base ; ils diffèrent par leur portée et par les services à valeur ajoutée. DDoS IP Protection suit un modèle de paiement par adresse IP protégée et s'active sur une adresse IP publique, alors que DDoS Network Protection s'active sur un réseau virtuel et protège les ressources qu'il contient."
  options:
    s1:
      en: "The default infrastructure protection always applies; what is missing without a tier is telemetry, alerting and a profile tuned to the application."
      fr: "La protection d'infrastructure par défaut s'applique toujours ; sans niveau activé, il manque la télémétrie, les alertes et un profil réglé sur l'application."
    s3:
      en: "This describes DDoS Network Protection. DDoS IP Protection is enabled for an individual public IP address."
      fr: "Cela décrit DDoS Network Protection. DDoS IP Protection s'active pour une adresse IP publique individuelle."
references:
  - title: About Azure DDoS Protection Tier Comparison
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison
  - title: Azure DDoS Protection Overview
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
