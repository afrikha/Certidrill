id: sc900-3b-cwp-plans-match
objective: "3.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each protection to the Microsoft Defender plan that provides it.

    To answer, drag the appropriate plan to each protection. Each plan may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque protection au plan Microsoft Defender qui la fournit.

    Pour répondre, faites glisser le plan approprié vers chaque protection. Chaque plan peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: app, text: "Defender for App Service" }
    - { id: cont, text: "Defender for Containers" }
    - { id: db, text: "Defender for Databases" }
    - { id: rm, text: "Defender for Resource Manager" }
    - { id: srv, text: "Defender for Servers" }
    - { id: sto, text: "Defender for Storage" }
  targets:
    - id: t1
      text: { en: "Attack detection for Azure SQL, open-source relational databases and Azure Cosmos DB", fr: "Détection des attaques pour Azure SQL, les bases de données relationnelles open source et Azure Cosmos DB" }
    - id: t2
      text: { en: "Environment hardening and run-time threat detection for Kubernetes environments", fr: "Renforcement de l'environnement et détection des menaces à l'exécution pour les environnements Kubernetes" }
    - id: t3
      text: { en: "Automatic monitoring of the resource management operations of the organization", fr: "Surveillance automatique des opérations de gestion des ressources de l'organisation" }
    - id: t4
      text: { en: "Detection of potentially harmful activity on Azure Storage accounts", fr: "Détection des activités potentiellement dangereuses sur les comptes de stockage Azure" }
answer:
  mapping: { t1: db, t2: cont, t3: rm, t4: sto }
explanation:
  correct:
    en: "Each Defender plan is specific to a type of resource. Defender for Databases protects the database estate: Azure SQL, open-source relational databases and Azure Cosmos DB. Defender for Containers secures Kubernetes environments with hardening and run-time threat detection. Defender for Resource Manager monitors resource management operations. Defender for Storage detects potentially harmful activity on Azure Storage accounts."
    fr: "Chaque plan Defender est propre à un type de ressource. Defender for Databases protège le parc de bases de données : Azure SQL, les bases de données relationnelles open source et Azure Cosmos DB. Defender for Containers sécurise les environnements Kubernetes par le renforcement et la détection des menaces à l'exécution. Defender for Resource Manager surveille les opérations de gestion des ressources. Defender for Storage détecte les activités potentiellement dangereuses sur les comptes de stockage Azure."
  options:
    app:
      en: "Defender for App Service identifies attacks that target applications running on App Service."
      fr: "Defender for App Service identifie les attaques qui visent les applications exécutées sur App Service."
    srv:
      en: "Defender for Servers adds threat detection and advanced defenses for Windows and Linux machines."
      fr: "Defender for Servers ajoute la détection des menaces et des défenses avancées pour les machines Windows et Linux."
references:
  - title: Describe the enhanced security of Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
