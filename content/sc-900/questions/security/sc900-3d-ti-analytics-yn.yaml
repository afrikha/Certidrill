id: sc900-3d-ti-analytics-yn
objective: "3.4.7"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about threat analytics in the Microsoft Defender portal, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'analyse des menaces (threat analytics) dans le portail Microsoft Defender, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A threat analytics report describes a threat and leaves the defensive guidance to other tools."
        fr: "Un rapport d'analyse des menaces décrit une menace et laisse les conseils de défense à d'autres outils."
    - id: s2
      text:
        en: "A threat analytics report combines the analysis of a threat with data from your own environment."
        fr: "Un rapport d'analyse des menaces associe l'analyse d'une menace à des données de votre propre environnement."
    - id: s3
      text:
        en: "Threat analytics reports are written by the security team of each customer organization."
        fr: "Les rapports d'analyse des menaces sont rédigés par l'équipe de sécurité de chaque organisation cliente."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Each threat analytics report contains the analysis of a tracked threat together with extensive guidance on how to defend against it, including recommended actions. It also brings in data from the organization's network to show whether the threat is active and whether protections apply. The reports come from Microsoft security researchers, not from the customer."
    fr: "Chaque rapport d'analyse des menaces contient l'analyse d'une menace suivie ainsi que des conseils détaillés pour s'en défendre, dont des actions recommandées. Il intègre aussi des données du réseau de l'organisation pour montrer si la menace est active et si des protections s'appliquent. Les rapports proviennent des chercheurs en sécurité de Microsoft, pas du client."
references:
  - title: Threat analytics in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/threat-analytics
  - title: Describe Microsoft Defender Threat Intelligence
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6b-describe-defender-threat-intelligence
