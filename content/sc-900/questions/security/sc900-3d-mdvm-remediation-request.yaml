id: sc900-3d-mdvm-remediation-request
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security administrator at Wingtip Toys reviews a security recommendation in Microsoft Defender Vulnerability Management. The administrator wants the IT team to deploy the fix and wants to hand over the work through a built-in workflow.

    Which capability should the administrator use?
  fr: |
    Un administrateur de sécurité de Wingtip Toys examine une recommandation de sécurité dans la Gestion des vulnérabilités Microsoft Defender. Il veut que l'équipe informatique déploie le correctif et veut lui transmettre le travail par un flux de travail intégré.

    Quelle fonctionnalité l'administrateur doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "Remediation requests", fr: "Les demandes de correction" }
    - id: b
      text: { en: "Security baselines assessment", fr: "L'évaluation des bases de référence de sécurité" }
    - id: c
      text: { en: "Network share assessment", fr: "L'évaluation des partages réseau" }
    - id: d
      text: { en: "Block vulnerable applications", fr: "Le blocage des applications vulnérables" }
answer: { optionId: a }
explanation:
  correct:
    en: "From a specific security recommendation, a remediation request creates a task for the IT team in Microsoft Intune. Security administrators and IT administrators then collaborate through this built-in workflow, and the progress of the remediation can be followed in real time."
    fr: "À partir d'une recommandation de sécurité précise, une demande de correction crée une tâche pour l'équipe informatique dans Microsoft Intune. Les administrateurs de sécurité et les administrateurs informatiques collaborent ensuite par ce flux de travail intégré, et l'avancement de la correction peut être suivi en temps réel."
  options:
    b:
      en: "Security baselines assessment measures the compliance of devices against benchmarks; it does not hand a fix over to the IT team."
      fr: "L'évaluation des bases de référence de sécurité mesure la conformité des appareils par rapport à des benchmarks ; elle ne transmet pas un correctif à l'équipe informatique."
    c:
      en: "Network share assessment evaluates vulnerable configurations of internal network shares; it is a discovery tool, not a hand-over workflow."
      fr: "L'évaluation des partages réseau évalue les configurations vulnérables des partages réseau internes ; c'est un outil de détection, pas un flux de transmission."
    d:
      en: "Blocking a vulnerable application is a mitigation applied to device groups by the security team itself; it does not ask the IT team to deploy the fix."
      fr: "Le blocage d'une application vulnérable est une atténuation que l'équipe de sécurité applique elle-même à des groupes d'appareils ; il ne demande pas à l'équipe informatique de déployer le correctif."
references:
  - title: Describe Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6a-describe-defender-vulnerability-management
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
