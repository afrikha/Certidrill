id: sc900-3d-portal-areas-match
objective: "3.4.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each content to the area of the Microsoft Defender portal where it is found.

    To answer, drag the appropriate area to each content. Each area may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque contenu à la zone du portail Microsoft Defender où il se trouve.

    Pour répondre, faites glisser la zone appropriée vers chaque contenu. Chaque zone peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: expo, text: { en: "Exposure management", fr: "Gestion de l'exposition (Exposure management)" } }
    - { id: inv, text: { en: "Investigation & response", fr: "Investigation et réponse (Investigation & response)" } }
    - { id: assets, text: { en: "Assets", fr: "Ressources (Assets)" } }
    - { id: rep, text: { en: "Reports", fr: "Rapports (Reports)" } }
    - { id: ti, text: { en: "Threat intelligence", fr: "Threat Intelligence" } }
  targets:
    - id: t1
      text: { en: "The inventory of devices and the inventory of identities", fr: "L'inventaire des appareils et l'inventaire des identités" }
    - id: t2
      text: { en: "Incidents and alerts, hunting, actions and submissions", fr: "Les incidents et les alertes, le repérage, les actions et les soumissions" }
    - id: t3
      text: { en: "The secure score and the attack surface of the organization", fr: "Le degré de sécurisation (secure score) et la surface d'attaque de l'organisation" }
    - id: t4
      text: { en: "A general security report that branches into endpoints, email, cloud apps and identities", fr: "Un rapport de sécurité général qui se décline par points de terminaison, e-mail, applications cloud et identités" }
answer:
  mapping: { t1: assets, t2: inv, t3: expo, t4: rep }
explanation:
  correct:
    en: "Assets holds the inventory of protected and discovered assets, including devices and identities. Investigation & response contains the incidents and alerts, hunting, and actions and submissions. Exposure management gives the unified view of the security posture, with the secure score and the attack surface. Reports unifies the security reports, starting from a general report and branching into specific areas."
    fr: "Ressources contient l'inventaire des ressources protégées et découvertes, dont les appareils et les identités. Investigation et réponse contient les incidents et les alertes, le repérage, et les actions et soumissions. Gestion de l'exposition donne la vue unifiée de la posture de sécurité, avec le degré de sécurisation et la surface d'attaque. Rapports unifie les rapports de sécurité, à partir d'un rapport général qui se décline par domaines."
  options:
    ti:
      en: "Threat intelligence gives access to Microsoft's knowledge about threats, such as threat analytics reports; none of the contents listed is found there."
      fr: "Threat Intelligence donne accès aux connaissances de Microsoft sur les menaces, comme les rapports d'analyse des menaces ; aucun des contenus listés ne s'y trouve."
references:
  - title: Describe the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/7-describe-microsoft-defender-portal
  - title: Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/overview-defender-portal
