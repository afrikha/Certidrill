id: sc900-3a-waf-basics-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure Web Application Firewall (WAF), select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure Web Application Firewall (WAF), sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Azure WAF protects web applications against remote file inclusion."
        fr: "Azure WAF protège les applications web contre l'inclusion de fichiers distants."
    - id: s2
      text:
        en: "Azure WAF mitigates volumetric attacks on the network layer, such as UDP floods."
        fr: "Azure WAF atténue les attaques volumétriques de la couche réseau, comme les inondations UDP."
    - id: s3
      text:
        en: "Azure WAF is installed as an agent on each web server that it protects."
        fr: "Azure WAF s'installe sous la forme d'un agent sur chaque serveur web qu'il protège."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Azure WAF protects web applications against common exploits, including SQL injection, cross-site scripting and remote file inclusion. Attacks on the network and transport layers are handled by Azure DDoS Protection, not by WAF. WAF is a centralized protection deployed with a service placed in front of the applications, such as Azure Application Gateway or Azure Front Door; nothing is installed on the web servers."
    fr: "Azure WAF protège les applications web contre les attaques courantes, dont l'injection SQL, le scripting inter-site et l'inclusion de fichiers distants. Les attaques des couches réseau et transport relèvent d'Azure DDoS Protection, pas de WAF. WAF est une protection centralisée, déployée avec un service placé devant les applications, comme Azure Application Gateway ou Azure Front Door ; rien n'est installé sur les serveurs web."
  options:
    s2:
      en: "A UDP flood targets layers 3 and 4; Azure DDoS Protection mitigates it, while WAF handles application-layer attacks."
      fr: "Une inondation UDP vise les couches 3 et 4 ; Azure DDoS Protection l'atténue, tandis que WAF traite les attaques de la couche application."
    s3:
      en: "WAF inspects the requests centrally, before they reach the servers; it has no agent."
      fr: "WAF inspecte les requêtes de façon centralisée, avant qu'elles n'atteignent les serveurs ; il n'a pas d'agent."
references:
  - title: Describe Web Application Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/4-describe-web-application-firewall
  - title: Introduction to Azure Web Application Firewall
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/overview
