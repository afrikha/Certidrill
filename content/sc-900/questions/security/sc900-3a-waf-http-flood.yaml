id: sc900-3a-waf-http-flood
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has enabled Azure DDoS Protection on the virtual network that hosts its website.

    Which attack still requires Azure Web Application Firewall to be mitigated?
  fr: |
    Tailspin Toys a activé Azure DDoS Protection sur le réseau virtuel qui héberge son site web.

    Quelle attaque nécessite encore Azure Web Application Firewall pour être atténuée ?
body:
  options:
    - id: a
      text: { en: "A UDP flood", fr: "Une inondation UDP" }
    - id: b
      text: { en: "A SYN flood", fr: "Une inondation SYN" }
    - id: c
      text: { en: "An ICMP flood", fr: "Une inondation ICMP" }
    - id: d
      text: { en: "An HTTP flood", fr: "Une inondation HTTP" }
answer: { optionId: d }
explanation:
  correct:
    en: "An HTTP flood overwhelms an application with a high volume of HTTP requests at the application layer (layer 7). It is a type of DDoS attack that Azure DDoS Protection alone doesn't cover, because that service works at layers 3 and 4. Azure Web Application Firewall detects and blocks the abnormal traffic patterns at layer 7."
    fr: "Une inondation HTTP submerge une application par un volume élevé de requêtes HTTP à la couche application (couche 7). C'est un type d'attaque DDoS qu'Azure DDoS Protection ne couvre pas à lui seul, car ce service travaille aux couches 3 et 4. Azure Web Application Firewall détecte et bloque les modèles de trafic anormaux à la couche 7."
  options:
    a:
      en: "A UDP flood is a volumetric attack on the network layer; Azure DDoS Protection absorbs it."
      fr: "Une inondation UDP est une attaque volumétrique de la couche réseau ; Azure DDoS Protection l'absorbe."
    b:
      en: "A SYN flood is a protocol attack that exploits a weakness of the layer 3 and layer 4 protocol stack; Azure DDoS Protection mitigates it."
      fr: "Une inondation SYN est une attaque de protocole qui exploite une faiblesse de la pile de protocoles des couches 3 et 4 ; Azure DDoS Protection l'atténue."
    c:
      en: "An ICMP flood is a volumetric attack; it is mitigated by Azure DDoS Protection."
      fr: "Une inondation ICMP est une attaque volumétrique ; elle est atténuée par Azure DDoS Protection."
references:
  - title: Describe Web Application Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/4-describe-web-application-firewall
  - title: Types of attacks Azure DDoS Protection mitigates
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/types-of-attacks
