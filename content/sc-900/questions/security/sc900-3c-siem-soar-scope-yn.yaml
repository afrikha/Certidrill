id: sc900-3c-siem-soar-scope-yn
objective: "3.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about SIEM and SOAR, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le SIEM et le SOAR, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A SIEM system collects data from on-premises infrastructure as well as from cloud services."
        fr: "Un système SIEM collecte les données de l'infrastructure locale aussi bien que celles des services cloud."
    - id: s2
      text:
        en: "In a SOAR playbook, a security analyst starts each action manually."
        fr: "Dans un playbook SOAR, un analyste de sécurité lance chaque action manuellement."
    - id: s3
      text:
        en: "The workflows of a SOAR system act only on the alerts that a SIEM system produces."
        fr: "Les flux de travail d'un système SOAR agissent uniquement sur les alertes produites par un système SIEM."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "A SIEM covers the whole digital environment, whether the sources are on-premises, in the cloud or both. A playbook is a predefined sequence of automated actions: the steps run without a human starting each one, which shortens the time between detection and containment. SOAR takes alerts from a SIEM and from other security tools, so its workflows are not limited to SIEM alerts."
    fr: "Un SIEM couvre tout l'environnement numérique, que les sources soient en local, dans le cloud ou les deux. Un playbook est une séquence prédéfinie d'actions automatisées : les étapes s'exécutent sans qu'une personne lance chacune d'elles, ce qui réduit le délai entre la détection et l'endiguement. Le SOAR prend les alertes d'un SIEM et d'autres outils de sécurité : ses flux de travail ne se limitent donc pas aux alertes du SIEM."
references:
  - title: Define the concepts of SIEM and SOAR
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar
