id: sc900-3d-portal-basics-yn
objective: "3.4.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the Microsoft Defender portal, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le portail Microsoft Defender, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Microsoft Defender portal is used to create and publish retention labels."
        fr: "Le portail Microsoft Defender sert à créer et à publier des étiquettes de rétention."
    - id: s2
      text:
        en: "The Microsoft Defender portal gives access to Microsoft Sentinel capabilities."
        fr: "Le portail Microsoft Defender donne accès aux fonctionnalités de Microsoft Sentinel."
    - id: s3
      text:
        en: "The cards displayed on the home page of the Microsoft Defender portal depend on the role of the user."
        fr: "Les cartes affichées sur la page d'accueil du portail Microsoft Defender dépendent du rôle de l'utilisateur."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Retention labels are created and published in the Microsoft Purview portal, which hosts the compliance and data governance solutions. The left navigation pane of the Microsoft Defender portal gives access to the Microsoft Defender XDR services and to Microsoft Sentinel. Because the portal uses role-based access control, the cards and the data of the home page vary with the role of the signed-in user."
    fr: "Les étiquettes de rétention se créent et se publient dans le portail Microsoft Purview, qui héberge les solutions de conformité et de gouvernance des données. Le volet de navigation gauche du portail Microsoft Defender donne accès aux services Microsoft Defender XDR et à Microsoft Sentinel. Comme le portail utilise le contrôle d'accès en fonction du rôle, les cartes et les données de la page d'accueil varient selon le rôle de l'utilisateur connecté."
references:
  - title: Describe the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/7-describe-microsoft-defender-portal
