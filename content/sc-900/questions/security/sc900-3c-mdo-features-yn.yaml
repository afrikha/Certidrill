id: sc900-3c-mdo-features-yn
objective: "3.4.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender for Office 365, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender pour Office 365, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Safe Links verifies links in Microsoft Teams as well as links in email messages."
        fr: "Liens sécurisés (Safe Links) vérifie les liens dans Microsoft Teams aussi bien que les liens dans les e-mails."
    - id: s2
      text:
        en: "Safe Attachments replaces the anti-malware scan of Microsoft 365: an attachment that it opens is not scanned by the anti-malware engine."
        fr: "Pièces jointes sécurisées (Safe Attachments) remplace l'analyse anti-programme malveillant de Microsoft 365 : une pièce jointe que la fonctionnalité ouvre n'est pas analysée par le moteur anti-programme malveillant."
    - id: s3
      text:
        en: "Attack simulation training delivers live malware to users' devices to test whether the antivirus software blocks it."
        fr: "La Formation à la simulation d'attaque (Attack simulation training) remet de vrais programmes malveillants sur les appareils des utilisateurs pour vérifier que l'antivirus les bloque."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Safe Links performs its time-of-click verification in email, in Microsoft Teams and in supported Office apps. Safe Attachments is an extra layer, not a replacement: it applies to attachments that the anti-malware protection has already scanned, and then detonates them in a virtual environment. Attack simulation training runs realistic but harmless simulations aimed at the behavior of users, to identify and train the vulnerable ones; it does not test antivirus software."
    fr: "Liens sécurisés effectue sa vérification au moment du clic dans les e-mails, dans Microsoft Teams et dans les applications Office prises en charge. Pièces jointes sécurisées est une couche supplémentaire, pas un remplacement : la fonctionnalité s'applique aux pièces jointes que la protection anti-programme malveillant a déjà analysées, puis les fait détoner dans un environnement virtuel. La Formation à la simulation d'attaque lance des simulations réalistes mais inoffensives qui visent le comportement des utilisateurs, pour repérer et former ceux qui sont vulnérables ; elle ne teste pas l'antivirus."
references:
  - title: Safe Links in Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/safe-links-about
  - title: Safe Attachments in Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/safe-attachments-about
