id: sc900-3b-cwp-database-alerts
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware uses Microsoft Defender for Cloud with the free Foundational CSPM plan only. Its Azure SQL databases already follow every security recommendation. Litware now wants to be alerted when one of the databases is attacked.

    What should Litware do?
  fr: |
    Litware utilise Microsoft Defender pour le cloud avec le seul plan gratuit CSPM de base (Foundational CSPM). Ses bases de données Azure SQL respectent déjà toutes les recommandations de sécurité. Litware veut maintenant être alertée quand l'une des bases de données est attaquée.

    Que doit faire Litware ?
body:
  options:
    - id: a
      text: { en: "Enable the Defender CSPM plan", fr: "Activer le plan Defender CSPM" }
    - id: b
      text: { en: "Enable the Defender for Databases plan", fr: "Activer le plan Defender for Databases" }
    - id: c
      text: { en: "Add a regulatory compliance standard", fr: "Ajouter une norme de conformité réglementaire" }
    - id: d
      text: { en: "Assign owners to the recommendations", fr: "Attribuer des propriétaires aux recommandations" }
answer: { optionId: b }
explanation:
  correct:
    en: "Detecting attacks is cloud workload protection, delivered by a Defender plan specific to the resource type. Defender for Databases provides attack detection and threat response for Azure SQL and the other database types, and raises security alerts. Posture management, even fully satisfied, only assesses configuration."
    fr: "Détecter les attaques relève de la protection des charges de travail cloud, fournie par un plan Defender propre au type de ressource. Defender for Databases apporte la détection des attaques et la réponse aux menaces pour Azure SQL et les autres types de bases de données, et émet des alertes de sécurité. La gestion de la posture, même entièrement satisfaite, ne fait qu'évaluer la configuration."
  options:
    a:
      en: "Defender CSPM adds advanced posture capabilities such as attack path analysis; it remains posture management and does not detect attacks on databases."
      fr: "Defender CSPM ajoute des fonctionnalités de posture avancées comme l'analyse du chemin d'attaque ; il reste de la gestion de la posture et ne détecte pas les attaques sur les bases de données."
    c:
      en: "A regulatory standard adds compliance assessments shown in the regulatory compliance dashboard; it detects no threat."
      fr: "Une norme réglementaire ajoute des évaluations de conformité affichées dans le tableau de bord de conformité réglementaire ; elle ne détecte aucune menace."
    d:
      en: "Assigning owners is governance of the remediation of recommendations; it does not produce alerts."
      fr: "Attribuer des propriétaires relève de la gouvernance de la correction des recommandations ; cela ne produit pas d'alertes."
references:
  - title: Describe the enhanced security of Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
  - title: Security alerts and incidents
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-overview
