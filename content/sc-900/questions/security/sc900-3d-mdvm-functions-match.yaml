id: sc900-3d-mdvm-functions-match
objective: "3.4.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each capability of Microsoft Defender Vulnerability Management to the function that it belongs to.

    To answer, drag the appropriate function to each capability. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque fonctionnalité de la Gestion des vulnérabilités Microsoft Defender à la fonction dont elle relève.

    Pour répondre, faites glisser la fonction appropriée vers chaque fonctionnalité. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: disc, text: { en: "Continuous asset discovery and monitoring", fr: "Détection et surveillance continues des ressources" } }
    - { id: prio, text: { en: "Risk-based intelligent prioritization", fr: "Hiérarchisation intelligente basée sur les risques" } }
    - { id: rem, text: { en: "Remediation and tracking", fr: "Correction et suivi" } }
    - { id: disrupt, text: { en: "Automatic attack disruption", fr: "Interruption automatique des attaques" } }
    - { id: sim, text: { en: "Attack simulation training", fr: "Formation à la simulation d'attaque" } }
  targets:
    - id: t1
      text: { en: "Focus on the vulnerabilities that are currently exploited in the wild", fr: "Concentration sur les vulnérabilités actuellement exploitées dans la nature" }
    - id: t2
      text: { en: "Real-time view of the status and progress of the fixes across the organization", fr: "Vue en temps réel de l'état et de l'avancement des correctifs dans l'organisation" }
    - id: t3
      text: { en: "Inventories of software, digital certificates, browser extensions, hardware and firmware", fr: "Inventaires des logiciels, des certificats numériques, des extensions de navigateur, du matériel et des microprogrammes" }
answer:
  mapping: { t1: prio, t2: rem, t3: disc }
explanation:
  correct:
    en: "Defender Vulnerability Management has three functions. Continuous asset discovery and monitoring builds the consolidated inventories. Risk-based intelligent prioritization aligns the recommendations with emerging threats, such as vulnerabilities exploited in the wild, with active breaches and with high-value assets. Remediation and tracking covers remediation requests, the blocking of vulnerable applications and the real-time status of remediation."
    fr: "La Gestion des vulnérabilités Microsoft Defender remplit trois fonctions. La détection et la surveillance continues des ressources constituent les inventaires consolidés. La hiérarchisation intelligente basée sur les risques aligne les recommandations sur les menaces émergentes, comme les vulnérabilités exploitées dans la nature, sur les violations en cours et sur les ressources de grande valeur. La correction et le suivi couvrent les demandes de correction, le blocage des applications vulnérables et l'état de la correction en temps réel."
  options:
    disrupt:
      en: "Automatic attack disruption is a Microsoft Defender XDR capability that contains an attack in progress; it is not a function of vulnerability management."
      fr: "L'interruption automatique des attaques est une fonctionnalité de Microsoft Defender XDR qui contient une attaque en cours ; ce n'est pas une fonction de la gestion des vulnérabilités."
    sim:
      en: "Attack simulation training belongs to Microsoft Defender for Office 365 and trains users with simulated attacks."
      fr: "La formation à la simulation d'attaque appartient à Microsoft Defender pour Office 365 et forme les utilisateurs par des attaques simulées."
references:
  - title: Describe Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6a-describe-defender-vulnerability-management
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
