id: sc900-3a-nsg-association-yn
objective: "3.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about network security groups (NSGs), select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les groupes de sécurité réseau (NSG), sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The same NSG can be associated with several subnets."
        fr: "Le même NSG peut être associé à plusieurs sous-réseaux."
    - id: s2
      text:
        en: "Two NSGs can be associated with the same subnet."
        fr: "Deux NSG peuvent être associés au même sous-réseau."
    - id: s3
      text:
        en: "An NSG can be associated with the network interface of a virtual machine."
        fr: "Un NSG peut être associé à l'interface réseau d'une machine virtuelle."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "An NSG is associated with a virtual network subnet or with a network interface of a virtual machine. Each subnet and each network interface accepts only one NSG, but the same NSG can be associated with as many subnets and network interfaces as you choose."
    fr: "Un NSG s'associe à un sous-réseau de réseau virtuel ou à une interface réseau de machine virtuelle. Chaque sous-réseau et chaque interface réseau n'accepte qu'un seul NSG, mais le même NSG peut être associé à autant de sous-réseaux et d'interfaces réseau que vous le souhaitez."
  options:
    s2:
      en: "A subnet takes one NSG at most. A second level of filtering is possible only on the network interfaces of the virtual machines."
      fr: "Un sous-réseau accepte un seul NSG au plus. Un second niveau de filtrage n'est possible que sur les interfaces réseau des machines virtuelles."
references:
  - title: Describe Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/6-describe-azure-network-security-groups
