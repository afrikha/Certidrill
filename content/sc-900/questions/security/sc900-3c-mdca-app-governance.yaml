id: sc900-3c-mdca-app-governance
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Users at Litware have consented to several OAuth apps that can read their Microsoft 365 data. The security team wants to see which permissions these apps hold, detect apps that are unused or that behave abnormally, and apply policies to them.

    Which Microsoft Defender for Cloud Apps capability should the security team use?
  fr: |
    Des utilisateurs de Litware ont donné leur consentement à plusieurs applications OAuth qui peuvent lire leurs données Microsoft 365. L'équipe de sécurité veut voir quelles autorisations ces applications détiennent, détecter celles qui sont inutilisées ou qui se comportent de façon anormale, et leur appliquer des stratégies.

    Quelle fonctionnalité de Microsoft Defender pour les applications cloud l'équipe de sécurité doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Cloud discovery", fr: "La découverte du cloud (cloud discovery)" }
    - id: b
      text: { en: "Information protection", fr: "La protection des informations" }
    - id: c
      text: { en: "App governance", fr: "La gouvernance des applications (app governance)" }
    - id: d
      text: { en: "Cloud app catalog", fr: "Le catalogue d'applications cloud" }
answer: { optionId: c }
explanation:
  correct:
    en: "App governance provides in-depth visibility and control over OAuth apps: which apps can access data, with which permissions, granted by which users. It watches for unused apps, monitors credentials, raises alerts on anomalous app activity and supports policies that limit or block risky apps."
    fr: "La gouvernance des applications apporte une visibilité et un contrôle approfondis sur les applications OAuth : quelles applications peuvent accéder aux données, avec quelles autorisations, accordées par quels utilisateurs. Elle repère les applications inutilisées, surveille les informations d'identification, émet des alertes sur l'activité anormale des applications et prend en charge des stratégies qui limitent ou bloquent les applications à risque."
  options:
    a:
      en: "Cloud discovery identifies the cloud apps in use from network traffic; it does not analyze the permissions that users granted to OAuth apps."
      fr: "La découverte du cloud identifie les applications cloud utilisées à partir du trafic réseau ; elle n'analyse pas les autorisations que les utilisateurs ont accordées aux applications OAuth."
    b:
      en: "Information protection finds sensitive files in connected apps and applies controls such as sensitivity labels; it does not govern OAuth apps."
      fr: "La protection des informations trouve les fichiers sensibles dans les applications connectées et applique des contrôles comme les étiquettes de confidentialité ; elle ne gouverne pas les applications OAuth."
    d:
      en: "The cloud app catalog is reference information about known cloud apps and their risk; it shows nothing about the apps consented to in the tenant."
      fr: "Le catalogue d'applications cloud est une information de référence sur les applications cloud connues et leur risque ; il ne montre rien des applications ayant reçu un consentement dans le locataire."
references:
  - title: Describe Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/5-describe-microsoft-cloud-app-security
  - title: App governance in Microsoft Defender for Cloud Apps
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/app-governance-manage-app-governance
