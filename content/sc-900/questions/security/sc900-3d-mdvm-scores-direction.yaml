id: sc900-3d-mdvm-scores-direction
objective: "3.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The overview page of Microsoft Defender Vulnerability Management shows the exposure score and Microsoft Secure Score for Devices. The IT team of Adatum remediates most of the vulnerabilities and misconfigurations reported for the company's devices.

    How are the two scores expected to change?
  fr: |
    La page de vue d'ensemble de la Gestion des vulnérabilités Microsoft Defender affiche le score d'exposition et le Score de sécurité Microsoft pour les appareils (Microsoft Secure Score for Devices). L'équipe informatique d'Adatum corrige la plupart des vulnérabilités et des erreurs de configuration signalées pour les appareils de l'entreprise.

    Comment les deux scores devraient-ils évoluer ?
body:
  options:
    - id: a
      text: { en: "The exposure score increases and Microsoft Secure Score for Devices increases.", fr: "Le score d'exposition augmente et le Score de sécurité Microsoft pour les appareils augmente." }
    - id: b
      text: { en: "The exposure score decreases and Microsoft Secure Score for Devices decreases.", fr: "Le score d'exposition diminue et le Score de sécurité Microsoft pour les appareils diminue." }
    - id: c
      text: { en: "The exposure score increases and Microsoft Secure Score for Devices decreases.", fr: "Le score d'exposition augmente et le Score de sécurité Microsoft pour les appareils diminue." }
    - id: d
      text: { en: "The exposure score decreases and Microsoft Secure Score for Devices increases.", fr: "Le score d'exposition diminue et le Score de sécurité Microsoft pour les appareils augmente." }
answer: { optionId: d }
explanation:
  correct:
    en: "The two scores read in opposite directions. The exposure score reflects how exposed the devices are to threats and vulnerabilities: a lower score means less exposure, so remediation brings it down. Microsoft Secure Score for Devices reflects the security configuration posture of the devices: a higher score means more resilient devices, and it rises when recommendations are remediated."
    fr: "Les deux scores se lisent en sens inverse. Le score d'exposition reflète l'exposition des appareils aux menaces et aux vulnérabilités : un score plus bas signifie une exposition moindre, donc la correction le fait baisser. Le Score de sécurité Microsoft pour les appareils reflète la posture de configuration de sécurité des appareils : un score plus élevé signifie des appareils plus résilients, et il monte quand les recommandations sont corrigées."
  options:
    a:
      en: "A rising exposure score would mean that the devices are more exposed, which is the opposite of what remediation achieves."
      fr: "Un score d'exposition en hausse signifierait que les appareils sont plus exposés, soit l'inverse de l'effet d'une correction."
    b:
      en: "Microsoft Secure Score for Devices rewards a better security configuration: it goes up, not down, when misconfigurations are fixed."
      fr: "Le Score de sécurité Microsoft pour les appareils récompense une meilleure configuration de sécurité : il monte, et ne baisse pas, quand les erreurs de configuration sont corrigées."
    c:
      en: "This is the evolution expected when the security of the devices degrades, not when weaknesses are remediated."
      fr: "C'est l'évolution attendue quand la sécurité des appareils se dégrade, pas quand les faiblesses sont corrigées."
references:
  - title: Exposure score in Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/tvm-exposure-score
  - title: Microsoft Secure Score for Devices
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/tvm-microsoft-secure-score-devices
