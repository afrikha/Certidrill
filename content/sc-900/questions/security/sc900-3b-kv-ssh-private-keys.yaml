id: sc900-3b-kv-ssh-private-keys
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Administrators open SSH sessions to Linux virtual machines through Azure Bastion and authenticate with SSH private keys. The company wants the private keys kept in a central store in which access to them is controlled and logged.

    Where should the company store the private keys?
  fr: |
    Des administrateurs ouvrent des sessions SSH sur des machines virtuelles Linux via Azure Bastion et s'authentifient avec des clés privées SSH. L'entreprise veut conserver les clés privées dans un magasin central où leur accès est contrôlé et journalisé.

    Où l'entreprise doit-elle stocker les clés privées ?
body:
  options:
    - id: a
      text: { en: "In Azure Bastion", fr: "Dans Azure Bastion" }
    - id: b
      text: { en: "In a network security group (NSG)", fr: "Dans un groupe de sécurité réseau (NSG)" }
    - id: c
      text: { en: "In Azure Key Vault", fr: "Dans Azure Key Vault" }
    - id: d
      text: { en: "In Microsoft Defender for Cloud", fr: "Dans Microsoft Defender pour le cloud" }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Key Vault is the service that stores secrets and tightly controls access to them, with logging of how and when they are used. Azure Bastion can use an SSH private key stored in Key Vault when it connects to a Linux virtual machine."
    fr: "Azure Key Vault est le service qui stocke des secrets et en contrôle étroitement l'accès, avec journalisation de leur utilisation. Azure Bastion peut utiliser une clé privée SSH stockée dans Key Vault lorsqu'il se connecte à une machine virtuelle Linux."
  options:
    a:
      en: "Azure Bastion secures the session to the virtual machine; it is not a store for credentials."
      fr: "Azure Bastion sécurise la session vers la machine virtuelle ; ce n'est pas un magasin d'informations d'identification."
    b:
      en: "A network security group holds traffic rules, not secrets."
      fr: "Un groupe de sécurité réseau contient des règles de trafic, pas des secrets."
    d:
      en: "Defender for Cloud assesses posture and raises security alerts; it does not store keys."
      fr: "Defender pour le cloud évalue la posture et émet des alertes de sécurité ; il ne stocke pas de clés."
references:
  - title: Describe Azure Key Vault
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/8-describe-ways-azure-encrypts-data
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
