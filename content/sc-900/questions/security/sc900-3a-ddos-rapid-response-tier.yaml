id: sc900-3a-ddos-rapid-response-tier
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam hosts its online store in an Azure virtual network. During a DDoS attack, Fabrikam wants the help of Microsoft DDoS experts to investigate, and it wants cost protection for the resources that scale out because of the attack.

    Which protection should Fabrikam use?
  fr: |
    Fabrikam héberge sa boutique en ligne dans un réseau virtuel Azure. Pendant une attaque DDoS, Fabrikam veut l'aide des experts DDoS de Microsoft pour mener l'investigation, et elle veut une protection des coûts pour les ressources qui montent en charge à cause de l'attaque.

    Quelle protection Fabrikam doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "DDoS Network Protection", fr: "DDoS Network Protection" }
    - id: b
      text: { en: "DDoS IP Protection", fr: "DDoS IP Protection" }
    - id: c
      text: { en: "The default DDoS infrastructure protection", fr: "La protection d'infrastructure DDoS par défaut" }
    - id: d
      text: { en: "Azure Web Application Firewall", fr: "Azure Web Application Firewall" }
answer: { optionId: a }
explanation:
  correct:
    en: "DDoS Network Protection is enabled on a virtual network and includes value-added services: DDoS rapid response support, cost protection and a discount on WAF. The DDoS rapid response team helps with the investigation during an active attack and with the analysis afterwards."
    fr: "DDoS Network Protection s'active sur un réseau virtuel et inclut des services à valeur ajoutée : le support de réponse rapide DDoS, la protection des coûts et une remise sur WAF. L'équipe de réponse rapide DDoS aide à l'investigation pendant une attaque en cours et à l'analyse après coup."
  options:
    b:
      en: "DDoS IP Protection has the same core features, paid per protected IP address, but it doesn't include rapid response support or cost protection."
      fr: "DDoS IP Protection offre les mêmes fonctionnalités de base, payées par adresse IP protégée, mais n'inclut ni le support de réponse rapide ni la protection des coûts."
    c:
      en: "The default infrastructure protection has no cost and no configuration, but it offers neither expert support nor cost protection."
      fr: "La protection d'infrastructure par défaut n'a ni coût ni configuration, mais elle n'offre ni l'aide d'experts ni la protection des coûts."
    d:
      en: "Azure Web Application Firewall protects web applications at layer 7 against exploits such as SQL injection; it doesn't provide the DDoS rapid response team."
      fr: "Azure Web Application Firewall protège les applications web à la couche 7 contre des attaques comme l'injection SQL ; il ne donne pas accès à l'équipe de réponse rapide DDoS."
references:
  - title: Describe Azure DDoS protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection
  - title: About Azure DDoS Protection Tier Comparison
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison
