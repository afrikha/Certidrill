id: sc900-3b-bastion-portal-rdp-ssh
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your company runs virtual machines in an Azure virtual network. Administrators need RDP and SSH access to the virtual machines directly from the Azure portal, and the virtual machines must have no public IP address.

    Which Azure service should you use?
  fr: |
    Votre entreprise exécute des machines virtuelles dans un réseau virtuel Azure. Les administrateurs ont besoin d'un accès RDP et SSH aux machines virtuelles directement depuis le portail Azure, et les machines virtuelles ne doivent avoir aucune adresse IP publique.

    Quel service Azure devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Azure Firewall", fr: "Pare-feu Azure" }
    - id: b
      text: Azure Bastion
    - id: c
      text: { en: "A network security group (NSG)", fr: "Un groupe de sécurité réseau (NSG)" }
    - id: d
      text: Azure Key Vault
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Bastion is a fully managed service that you provision inside a virtual network. It gives RDP and SSH connectivity to the virtual machines from the Azure portal over TLS and reaches them through their private IP addresses, so they need no public IP address."
    fr: "Azure Bastion est un service entièrement managé que vous approvisionnez dans un réseau virtuel. Il fournit une connectivité RDP et SSH aux machines virtuelles depuis le portail Azure, sur TLS, et les atteint par leur adresse IP privée : elles n'ont donc besoin d'aucune adresse IP publique."
  options:
    a:
      en: "Azure Firewall filters and inspects network traffic centrally; it does not provide an RDP or SSH session in the Azure portal."
      fr: "Le Pare-feu Azure filtre et inspecte le trafic réseau de façon centralisée ; il ne fournit pas de session RDP ou SSH dans le portail Azure."
    c:
      en: "A network security group allows or denies traffic with rules; it does not provide remote connectivity to a virtual machine that has no public IP address."
      fr: "Un groupe de sécurité réseau autorise ou refuse le trafic à l'aide de règles ; il ne fournit pas de connectivité à distance vers une machine virtuelle sans adresse IP publique."
    d:
      en: "Azure Key Vault stores secrets, keys and certificates; it does not open remote sessions to virtual machines."
      fr: "Azure Key Vault stocke des secrets, des clés et des certificats ; il n'ouvre pas de sessions à distance sur les machines virtuelles."
references:
  - title: Describe Azure Bastion
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/7-describe-azure-bastion-just-in-time-access
  - title: "What is Azure Bastion?"
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
