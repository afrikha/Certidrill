id: sc900-3c-mdo-zap
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A phishing message reaches the Exchange Online mailboxes of 40 users at Fabrikam. One hour later, the message is identified as malicious.

    Which feature retroactively detects and neutralizes malicious messages that have already been delivered?
  fr: |
    Un message d'hameçonnage arrive dans les boîtes aux lettres Exchange Online de 40 utilisateurs de Fabrikam. Une heure plus tard, le message est identifié comme malveillant.

    Quelle fonctionnalité détecte et neutralise rétroactivement les messages malveillants déjà remis ?
body:
  options:
    - id: a
      text: { en: "Quarantine policies", fr: "Les stratégies de mise en quarantaine" }
    - id: b
      text: { en: "Zero-hour auto purge (ZAP)", fr: "La purge automatique zéro heure (ZAP)" }
    - id: c
      text: { en: "Safe Attachments", fr: "Pièces jointes sécurisées (Safe Attachments)" }
    - id: d
      text: { en: "Message trace", fr: "Le Suivi des messages (Message trace)" }
answer: { optionId: b }
explanation:
  correct:
    en: "Zero-hour auto purge (ZAP) is a response capability: it retroactively detects phishing, spam or malware messages that were already delivered to Exchange Online mailboxes and neutralizes them. It covers the case where a message is recognized as malicious only after its delivery."
    fr: "La purge automatique zéro heure (ZAP) est une fonctionnalité de réponse : elle détecte rétroactivement les messages d'hameçonnage, de courrier indésirable ou de programmes malveillants déjà remis dans les boîtes aux lettres Exchange Online et les neutralise. Elle couvre le cas où un message n'est reconnu comme malveillant qu'après sa remise."
  options:
    a:
      en: "Quarantine policies define what users can do with messages that are already in quarantine; they do not remove delivered messages from mailboxes."
      fr: "Les stratégies de mise en quarantaine définissent ce que les utilisateurs peuvent faire des messages déjà en quarantaine ; elles ne retirent pas des boîtes aux lettres les messages remis."
    c:
      en: "Safe Attachments checks attachments in a virtual environment before delivery; it does not act on messages that are already in mailboxes."
      fr: "Pièces jointes sécurisées vérifie les pièces jointes dans un environnement virtuel avant la remise ; la fonctionnalité n'agit pas sur les messages déjà présents dans les boîtes aux lettres."
    d:
      en: "Message trace shows the path and the final status of a message; it is an investigation tool that changes nothing in the mailboxes."
      fr: "Le Suivi des messages montre le parcours et l'état final d'un message ; c'est un outil d'investigation qui ne change rien dans les boîtes aux lettres."
references:
  - title: Describe Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/3-describe-defender-office
