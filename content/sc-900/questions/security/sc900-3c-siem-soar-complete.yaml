id: sc900-3c-siem-soar-complete
objective: "3.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A [[t1]] system provides visibility: it aggregates and correlates log data from many sources to surface threats.

      A [[t2]] system provides speed: it runs automated workflows in response to alerts.

      Microsoft Sentinel is [[t3]].
    fr: |
      Un système [[t1]] apporte la visibilité : il agrège et corrèle les données de journaux de nombreuses sources pour faire ressortir les menaces.

      Un système [[t2]] apporte la vitesse : il exécute des flux de travail automatisés en réponse aux alertes.

      Microsoft Sentinel est [[t3]].
  slots:
    - id: t1
      options:
        - { id: casb, text: "CASB" }
        - { id: siem, text: "SIEM" }
        - { id: soar, text: "SOAR" }
    - id: t2
      options:
        - { id: casb, text: "CASB" }
        - { id: siem, text: "SIEM" }
        - { id: soar, text: "SOAR" }
    - id: t3
      options:
        - { id: siemonly, text: { en: "a SIEM solution only", fr: "une solution SIEM uniquement" } }
        - { id: soaronly, text: { en: "a SOAR solution only", fr: "une solution SOAR uniquement" } }
        - { id: both, text: { en: "both a SIEM and a SOAR solution", fr: "à la fois une solution SIEM et SOAR" } }
answer:
  values: { t1: siem, t2: soar, t3: both }
explanation:
  correct:
    en: "SIEM brings visibility by collecting, correlating and surfacing threats; SOAR brings speed by automating the response. Microsoft Sentinel is a cloud-native solution that delivers both. A cloud access security broker (CASB) is a different kind of tool: it controls the access of users to cloud apps."
    fr: "Le SIEM apporte la visibilité en collectant, en corrélant et en faisant ressortir les menaces ; le SOAR apporte la vitesse en automatisant la réponse. Microsoft Sentinel est une solution native cloud qui fournit les deux. Un broker de sécurité d'accès au cloud (CASB) est un outil d'une autre nature : il contrôle l'accès des utilisateurs aux applications cloud."
references:
  - title: Define the concepts of SIEM and SOAR
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar
