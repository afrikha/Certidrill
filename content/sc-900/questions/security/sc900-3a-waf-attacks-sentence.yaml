id: sc900-3a-waf-attacks-sentence
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Azure Web Application Firewall protects web applications against several common attacks.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Azure Web Application Firewall protège les applications web contre plusieurs attaques courantes.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In [[a1]], the attacker inserts malicious code into input fields to read or change the data of the backend database.

      In [[a2]], the attacker injects malicious scripts into web pages that other users view, for example to steal their session tokens.

      In [[a3]], the attacker tricks the application into loading a malicious file from another server, which then runs on the web server.
    fr: |
      Dans [[a1]], l'attaquant insère du code malveillant dans des champs de saisie pour lire ou modifier les données de la base de données principale.

      Dans [[a2]], l'attaquant injecte des scripts malveillants dans des pages web consultées par d'autres utilisateurs, par exemple pour voler leurs jetons de session.

      Dans [[a3]], l'attaquant amène l'application à charger un fichier malveillant depuis un autre serveur, fichier qui s'exécute alors sur le serveur web.
  slots:
    - id: a1
      options:
        - { id: xss, text: { en: "a cross-site scripting attack", fr: "une attaque par scripting inter-site" } }
        - { id: flood, text: { en: "an HTTP flood", fr: "une inondation HTTP" } }
        - { id: sqli, text: { en: "a SQL injection attack", fr: "une attaque par injection SQL" } }
        - { id: rfi, text: { en: "a remote file inclusion attack", fr: "une attaque par inclusion de fichiers distants" } }
    - id: a2
      options:
        - { id: xss, text: { en: "a cross-site scripting attack", fr: "une attaque par scripting inter-site" } }
        - { id: flood, text: { en: "an HTTP flood", fr: "une inondation HTTP" } }
        - { id: sqli, text: { en: "a SQL injection attack", fr: "une attaque par injection SQL" } }
        - { id: rfi, text: { en: "a remote file inclusion attack", fr: "une attaque par inclusion de fichiers distants" } }
    - id: a3
      options:
        - { id: xss, text: { en: "a cross-site scripting attack", fr: "une attaque par scripting inter-site" } }
        - { id: flood, text: { en: "an HTTP flood", fr: "une inondation HTTP" } }
        - { id: sqli, text: { en: "a SQL injection attack", fr: "une attaque par injection SQL" } }
        - { id: rfi, text: { en: "a remote file inclusion attack", fr: "une attaque par inclusion de fichiers distants" } }
answer:
  values: { a1: sqli, a2: xss, a3: rfi }
explanation:
  correct:
    en: "SQL injection inserts malicious SQL code into input fields to manipulate or extract the data of the backend database. Cross-site scripting injects malicious scripts into pages viewed by other users, whose browser then runs them. Remote file inclusion makes the application include a malicious remote file, which runs on the server and can give unauthorized access."
    fr: "L'injection SQL insère du code SQL malveillant dans des champs de saisie pour manipuler ou extraire les données de la base de données principale. Le scripting inter-site injecte des scripts malveillants dans des pages consultées par d'autres utilisateurs, dont le navigateur les exécute. L'inclusion de fichiers distants fait inclure à l'application un fichier distant malveillant, qui s'exécute sur le serveur et peut donner un accès non autorisé."
  options:
    flood:
      en: "An HTTP flood sends a high volume of HTTP requests to overwhelm the application; it relies on volume, not on injected code or files."
      fr: "Une inondation HTTP envoie un volume élevé de requêtes HTTP pour submerger l'application ; elle repose sur le volume, pas sur du code ou des fichiers injectés."
references:
  - title: Describe Web Application Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/4-describe-web-application-firewall
