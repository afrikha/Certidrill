id: sc900-3d-portal-unified-secops
objective: "3.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Defender XDR, Microsoft Sentinel and Microsoft Defender for Cloud. The security operations team wants a single place to detect, investigate and respond to threats across these products.

    Which portal should the team use?
  fr: |
    Fabrikam utilise Microsoft Defender XDR, Microsoft Sentinel et Microsoft Defender pour le cloud. L'équipe des opérations de sécurité veut un lieu unique pour détecter et examiner les menaces de l'ensemble de ces produits et y répondre.

    Quel portail l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "The Microsoft Purview portal", fr: "Le portail Microsoft Purview" }
    - id: b
      text: { en: "The Microsoft Defender portal", fr: "Le portail Microsoft Defender" }
    - id: c
      text: { en: "The Microsoft Entra admin center", fr: "Le Centre d'administration Microsoft Entra" }
    - id: d
      text: { en: "The Microsoft 365 admin center", fr: "Le Centre d'administration Microsoft 365" }
answer: { optionId: b }
explanation:
  correct:
    en: "The Microsoft Defender portal is Microsoft's unified security operations platform. It combines Microsoft Defender XDR, Microsoft Sentinel, Microsoft Defender for Cloud, Microsoft Threat Intelligence and Microsoft Security Exposure Management, so that protection, detection, investigation and response happen in one central place."
    fr: "Le portail Microsoft Defender est la plateforme d'opérations de sécurité unifiée de Microsoft. Il réunit Microsoft Defender XDR, Microsoft Sentinel, Microsoft Defender pour le cloud, Microsoft Threat Intelligence et Microsoft Security Exposure Management, pour que la protection, la détection, l'investigation et la réponse aient lieu en un seul endroit central."
  options:
    a:
      en: "The Microsoft Purview portal is the home of compliance and data protection solutions such as sensitivity labels, data loss prevention, eDiscovery and audit."
      fr: "Le portail Microsoft Purview héberge les solutions de conformité et de protection des données comme les étiquettes de confidentialité, la protection contre la perte de données, eDiscovery et l'audit."
    c:
      en: "The Microsoft Entra admin center manages identities and access, for example users, groups and Conditional Access policies."
      fr: "Le Centre d'administration Microsoft Entra gère les identités et les accès, par exemple les utilisateurs, les groupes et les stratégies d'accès conditionnel."
    d:
      en: "The Microsoft 365 admin center manages the Microsoft 365 subscription, its users and its licenses; it is not a security operations tool."
      fr: "Le Centre d'administration Microsoft 365 gère l'abonnement Microsoft 365, ses utilisateurs et ses licences ; ce n'est pas un outil d'opérations de sécurité."
references:
  - title: Describe the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/7-describe-microsoft-defender-portal
  - title: Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/overview-defender-portal
