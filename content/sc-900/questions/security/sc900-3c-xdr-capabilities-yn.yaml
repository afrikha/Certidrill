id: sc900-3c-xdr-capabilities-yn
objective: "3.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Defender for Cloud is the Microsoft Defender XDR service that protects SaaS applications."
        fr: "Microsoft Defender pour le cloud est le service de Microsoft Defender XDR qui protège les applications SaaS."
    - id: s2
      text:
        en: "Self-healing in Microsoft Defender XDR uses automatic actions to return affected devices, user identities and mailboxes to a secure state."
        fr: "L'autoréparation de Microsoft Defender XDR utilise des actions automatiques pour remettre dans un état sûr les appareils, les identités d'utilisateur et les boîtes aux lettres touchés."
    - id: s3
      text:
        en: "In Microsoft Defender XDR, each service keeps its alerts in a separate queue and the suite does not correlate them."
        fr: "Dans Microsoft Defender XDR, chaque service garde ses alertes dans une file d'attente distincte et la suite ne les corrèle pas."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "The Defender XDR service for SaaS applications is Microsoft Defender for Cloud Apps; Microsoft Defender for Cloud is a separate product that protects cloud resources and workloads. Self-healing remediates impacted devices, identities and mailboxes with AI-powered automatic actions and playbooks. The suite correlates the alerts of all its services: related alerts and assets are grouped automatically in one combined incidents queue."
    fr: "Le service de Defender XDR pour les applications SaaS est Microsoft Defender pour les applications cloud ; Microsoft Defender pour le cloud est un produit distinct qui protège les ressources et les charges de travail cloud. L'autoréparation corrige les appareils, les identités et les boîtes aux lettres touchés par des actions automatiques et des playbooks fondés sur l'IA. La suite corrèle les alertes de tous ses services : les alertes et les ressources liées sont regroupées automatiquement dans une seule file d'attente d'incidents combinée."
references:
  - title: Describe Microsoft Defender XDR services
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services
  - title: What is Microsoft Defender XDR?
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-365-defender
