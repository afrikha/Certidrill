id: sc900-3d-portal-nodes-complete
objective: "3.4.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about the navigation pane of the Microsoft Defender portal, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur le volet de navigation du portail Microsoft Defender, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The features of Microsoft Defender for Office 365 are found under [[p1]].

      The features of Microsoft Defender for Identity are found under [[p2]].

      Microsoft Defender for Cloud is accessed under [[p3]].
    fr: |
      Les fonctionnalités de Microsoft Defender pour Office 365 se trouvent sous [[p1]].

      Les fonctionnalités de Microsoft Defender pour Identity se trouvent sous [[p2]].

      Microsoft Defender pour le cloud est accessible sous [[p3]].
  slots:
    - id: p1
      options:
        - { id: mail, text: { en: "Email & collaboration", fr: "E-mail et collaboration (Email & collaboration)" } }
        - { id: apps, text: { en: "Cloud apps", fr: "Applications cloud (Cloud apps)" } }
        - { id: endp, text: { en: "Endpoints", fr: "Points de terminaison (Endpoints)" } }
    - id: p2
      options:
        - { id: apps, text: { en: "Cloud apps", fr: "Applications cloud (Cloud apps)" } }
        - { id: ident, text: { en: "Identities", fr: "Identités (Identities)" } }
        - { id: endp, text: { en: "Endpoints", fr: "Points de terminaison (Endpoints)" } }
    - id: p3
      options:
        - { id: apps, text: { en: "Cloud apps", fr: "Applications cloud (Cloud apps)" } }
        - { id: mail, text: { en: "Email & collaboration", fr: "E-mail et collaboration (Email & collaboration)" } }
        - { id: cloud, text: { en: "Cloud security", fr: "Sécurité du cloud (Cloud security)" } }
answer:
  values: { p1: mail, p2: ident, p3: cloud }
explanation:
  correct:
    en: "The navigation pane has one node per Defender XDR service: Email & collaboration for Defender for Office 365, Identities for Defender for Identity, Endpoints for Defender for Endpoint and Cloud apps for Defender for Cloud Apps. Defender for Cloud, which protects cloud resources and workloads, is a different product from Defender for Cloud Apps: it is reached under Cloud security."
    fr: "Le volet de navigation comporte un nœud par service Defender XDR : E-mail et collaboration pour Defender pour Office 365, Identités pour Defender pour Identity, Points de terminaison pour Defender pour point de terminaison et Applications cloud pour Defender pour les applications cloud. Defender pour le cloud, qui protège les ressources et les charges de travail cloud, est un produit différent de Defender pour les applications cloud : on y accède sous Sécurité du cloud."
references:
  - title: Describe the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/7-describe-microsoft-defender-portal
