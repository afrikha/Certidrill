id: sc900-3a-seg-basics-yn
objective: "3.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure virtual networks, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les réseaux virtuels Azure, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Resources in the same virtual network can communicate with each other without their traffic going over the public internet."
        fr: "Les ressources d'un même réseau virtuel peuvent communiquer entre elles sans que leur trafic passe par l'internet public."
    - id: s2
      text:
        en: "An Azure subscription can contain only one virtual network in each region."
        fr: "Un abonnement Azure ne peut contenir qu'un seul réseau virtuel par région."
    - id: s3
      text:
        en: "An Azure virtual network can be connected to an on-premises network."
        fr: "Un réseau virtuel Azure peut être connecté à un réseau local."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Resources of the same virtual network communicate securely with each other, without using the public internet. An organization can create multiple virtual networks per region in a subscription, and multiple subnets in each of them. A virtual network can also be connected to an on-premises network, through a site-to-site VPN, a point-to-site VPN or Azure ExpressRoute."
    fr: "Les ressources d'un même réseau virtuel communiquent entre elles de façon sécurisée, sans emprunter l'internet public. Une organisation peut créer plusieurs réseaux virtuels par région dans un abonnement, et plusieurs sous-réseaux dans chacun d'eux. Un réseau virtuel peut aussi être connecté à un réseau local, par un VPN site à site, un VPN point à site ou Azure ExpressRoute."
  options:
    s2:
      en: "Several virtual networks can exist in the same region and subscription; this is one way to separate workloads."
      fr: "Plusieurs réseaux virtuels peuvent exister dans la même région et le même abonnement ; c'est une façon de séparer les charges de travail."
references:
  - title: Describe network segmentation in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
