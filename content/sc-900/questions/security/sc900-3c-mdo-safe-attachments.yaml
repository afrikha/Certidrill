id: sc900-3c-mdo-safe-attachments
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Microsoft Defender for Office 365 feature opens email attachments in a virtual environment to observe what happens before the messages are delivered?
  fr: |
    Quelle fonctionnalité de Microsoft Defender pour Office 365 ouvre les pièces jointes des e-mails dans un environnement virtuel pour observer ce qui se passe avant la remise des messages ?
body:
  options:
    - id: a
      text: { en: "Safe Links", fr: "Liens sécurisés (Safe Links)" }
    - id: b
      text: { en: "Attack simulation training", fr: "Formation à la simulation d'attaque (Attack simulation training)" }
    - id: c
      text: { en: "Safe Attachments", fr: "Pièces jointes sécurisées (Safe Attachments)" }
    - id: d
      text: { en: "Message trace", fr: "Suivi des messages (Message trace)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Safe Attachments adds a layer of protection against malware: after the regular anti-malware scan, it opens the attachment in a virtual environment and watches its behavior, a process called detonation. A harmful attachment is caught even when no signature knows it yet."
    fr: "Pièces jointes sécurisées ajoute une couche de protection contre les programmes malveillants : après l'analyse anti-programme malveillant habituelle, la fonctionnalité ouvre la pièce jointe dans un environnement virtuel et observe son comportement, un processus appelé détonation. Une pièce jointe nuisible est interceptée même si aucune signature ne la connaît encore."
  options:
    a:
      en: "Safe Links protects against malicious URLs by checking them when the user clicks; it does not open attachments."
      fr: "Liens sécurisés protège contre les URL malveillantes en les vérifiant quand l'utilisateur clique ; la fonctionnalité n'ouvre pas les pièces jointes."
    b:
      en: "Attack simulation training sends simulated attacks to users to find and train those who are vulnerable; it does not inspect real messages."
      fr: "La Formation à la simulation d'attaque envoie des attaques simulées aux utilisateurs pour repérer et former ceux qui sont vulnérables ; elle n'inspecte pas les vrais messages."
    d:
      en: "Message trace follows a message through the organization to show whether it was received, rejected, deferred or delivered."
      fr: "Le Suivi des messages suit un message dans l'organisation pour montrer s'il a été reçu, rejeté, différé ou remis."
references:
  - title: Describe Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/3-describe-defender-office
  - title: Safe Attachments in Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/defender-office-365/safe-attachments-about
