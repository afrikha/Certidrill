id: sc900-3a-nsg-what-is
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware wants to allow or deny the network traffic to and from the virtual machines of one subnet, with rules based on IP addresses, ports and protocols. The control must be associated directly with the subnet.

    What should Litware use?
  fr: |
    Litware veut autoriser ou refuser le trafic réseau à destination et en provenance des machines virtuelles d'un sous-réseau, avec des règles fondées sur les adresses IP, les ports et les protocoles. Le contrôle doit être associé directement au sous-réseau.

    Que doit utiliser Litware ?
body:
  options:
    - id: a
      text: { en: "Azure Firewall", fr: "Le Pare-feu Azure" }
    - id: b
      text: "Azure Web Application Firewall"
    - id: c
      text: "Azure DDoS Protection"
    - id: d
      text: { en: "A network security group", fr: "Un groupe de sécurité réseau" }
answer: { optionId: d }
explanation:
  correct:
    en: "A network security group (NSG) filters network traffic to and from Azure resources in a virtual network, such as virtual machines. It consists of security rules that allow or deny inbound and outbound traffic, and it is associated with a subnet or with a network interface."
    fr: "Un groupe de sécurité réseau (NSG) filtre le trafic réseau à destination et en provenance des ressources Azure d'un réseau virtuel, comme les machines virtuelles. Il se compose de règles de sécurité qui autorisent ou refusent le trafic entrant et sortant, et il s'associe à un sous-réseau ou à une interface réseau."
  options:
    a:
      en: "Azure Firewall is a centralized service through which traffic is routed; it isn't associated with a subnet to filter the traffic of its virtual machines."
      fr: "Le Pare-feu Azure est un service centralisé par lequel le trafic est acheminé ; il ne s'associe pas à un sous-réseau pour filtrer le trafic de ses machines virtuelles."
    b:
      en: "Azure Web Application Firewall protects web applications at layer 7 against exploits such as SQL injection; it doesn't filter by IP address and port on a subnet."
      fr: "Azure Web Application Firewall protège les applications web à la couche 7 contre des attaques comme l'injection SQL ; il ne filtre pas par adresse IP et port sur un sous-réseau."
    c:
      en: "Azure DDoS Protection mitigates denial-of-service attacks; it has no allow and deny rules."
      fr: "Azure DDoS Protection atténue les attaques par déni de service ; il n'a pas de règles d'autorisation et de refus."
references:
  - title: Describe Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/6-describe-azure-network-security-groups
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
