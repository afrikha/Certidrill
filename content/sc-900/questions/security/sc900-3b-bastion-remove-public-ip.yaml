id: sc900-3b-bastion-remove-public-ip
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The Azure virtual machines of Fabrikam each have a public IP address, with the RDP port open to the internet. Fabrikam decides to remove the public IP addresses from all the virtual machines. Administrators who work from home must still open RDP sessions to the virtual machines from the Azure portal, without a VPN.

    What should Fabrikam use?
  fr: |
    Les machines virtuelles Azure de Fabrikam ont chacune une adresse IP publique, avec le port RDP ouvert sur Internet. Fabrikam décide de retirer les adresses IP publiques de toutes les machines virtuelles. Les administrateurs qui travaillent à domicile doivent continuer à ouvrir des sessions RDP sur les machines virtuelles depuis le portail Azure, sans VPN.

    Que doit utiliser Fabrikam ?
body:
  options:
    - id: a
      text: { en: "Just-in-time VM access in Microsoft Defender for Cloud", fr: "L'accès juste-à-temps aux machines virtuelles dans Microsoft Defender pour le cloud" }
    - id: b
      text: { en: "A network security group (NSG)", fr: "Un groupe de sécurité réseau (NSG)" }
    - id: c
      text: Azure DDoS Protection
    - id: d
      text: Azure Bastion
answer: { optionId: d }
explanation:
  correct:
    en: "Azure Bastion gives RDP and SSH connectivity from the Azure portal to virtual machines that have only private IP addresses: the session reaches Bastion over TLS and Bastion connects to the private IP address of the virtual machine. No public IP address and no VPN are needed."
    fr: "Azure Bastion fournit une connectivité RDP et SSH depuis le portail Azure vers des machines virtuelles qui n'ont que des adresses IP privées : la session atteint Bastion sur TLS et Bastion se connecte à l'adresse IP privée de la machine virtuelle. Aucune adresse IP publique ni aucun VPN ne sont nécessaires."
  options:
    a:
      en: "Just-in-time VM access keeps the management ports closed and opens them on request for a limited time; it does not give a path to a virtual machine that has no public IP address."
      fr: "L'accès juste-à-temps garde les ports de gestion fermés et les ouvre sur demande pour une durée limitée ; il ne donne pas de chemin vers une machine virtuelle sans adresse IP publique."
    b:
      en: "A network security group only allows or denies traffic; it cannot make a virtual machine without a public IP address reachable from the internet."
      fr: "Un groupe de sécurité réseau ne fait qu'autoriser ou refuser le trafic ; il ne rend pas accessible depuis Internet une machine virtuelle sans adresse IP publique."
    c:
      en: "Azure DDoS Protection mitigates volumetric attacks against public IP addresses; it provides no remote administration."
      fr: "Azure DDoS Protection atténue les attaques volumétriques contre les adresses IP publiques ; il ne fournit aucune administration à distance."
references:
  - title: Describe Azure Bastion
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/7-describe-azure-bastion-just-in-time-access
  - title: Just-in-time machine access in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview
