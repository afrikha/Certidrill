id: sc900-3a-seg-subnets-tiers
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has one Azure virtual network that hosts web servers and database servers. Adatum wants to divide this virtual network into segments, so that each group of servers has its own access controls.

    What should Adatum create?
  fr: |
    Adatum possède un réseau virtuel Azure qui héberge des serveurs web et des serveurs de base de données. Adatum veut diviser ce réseau virtuel en segments, pour que chaque groupe de serveurs ait ses propres contrôles d'accès.

    Que doit créer Adatum ?
body:
  options:
    - id: a
      text: { en: "Subnets", fr: "Des sous-réseaux" }
    - id: b
      text: { en: "Virtual network peerings", fr: "Des peerings de réseaux virtuels" }
    - id: c
      text: { en: "Site-to-site VPN connections", fr: "Des connexions VPN site à site" }
    - id: d
      text: { en: "Public IP addresses", fr: "Des adresses IP publiques" }
answer: { optionId: a }
explanation:
  correct:
    en: "Subnets are smaller network segments created inside a virtual network. They divide it into parts that have different security requirements or functions, for example web servers in one subnet and database servers in another, each with its own controls on the traffic that may flow."
    fr: "Les sous-réseaux sont des segments de réseau plus petits créés à l'intérieur d'un réseau virtuel. Ils le divisent en parties aux exigences de sécurité ou aux fonctions différentes, par exemple les serveurs web dans un sous-réseau et les serveurs de base de données dans un autre, chacun avec ses propres contrôles sur le trafic autorisé."
  options:
    b:
      en: "A virtual network peering connects two separate virtual networks; it doesn't divide one virtual network."
      fr: "Un peering de réseaux virtuels connecte deux réseaux virtuels distincts ; il ne divise pas un réseau virtuel."
    c:
      en: "A site-to-site VPN connects an on-premises network to a virtual network; it doesn't create segments inside it."
      fr: "Un VPN site à site connecte un réseau local à un réseau virtuel ; il ne crée pas de segments à l'intérieur de celui-ci."
    d:
      en: "A public IP address makes a resource reachable from the internet; it doesn't separate groups of servers."
      fr: "Une adresse IP publique rend une ressource accessible depuis internet ; elle ne sépare pas des groupes de serveurs."
references:
  - title: Describe network segmentation in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
