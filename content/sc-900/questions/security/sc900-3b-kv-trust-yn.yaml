id: sc900-3b-kv-trust-yn
objective: "3.1.7"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Key Vault replicates the contents of a vault within its region and to a secondary region.
        fr: Azure Key Vault réplique le contenu d'un coffre dans sa région et vers une région secondaire.
    - id: s2
      text:
        en: The Standard tier and the Premium tier both provide secrets management, key management and certificate management.
        fr: Le niveau Standard et le niveau Premium fournissent tous deux la gestion des secrets, la gestion des clés et la gestion des certificats.
    - id: s3
      text:
        en: Azure Key Vault is designed so that Microsoft can extract your keys to restore them if you lose them.
        fr: Azure Key Vault est conçu pour que Microsoft puisse extraire vos clés afin de les restaurer si vous les perdez.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Key Vault replicates the contents of a vault within the region and to a secondary region, which gives high availability without an administrator having to trigger a failover. It is designed so that Microsoft does not see or extract your data: secrets, keys and certificates are for your use only. The two tiers have the same core capabilities and differ only in the hardware protection of keys."
    fr: "Key Vault réplique le contenu d'un coffre dans la région et vers une région secondaire, ce qui assure une haute disponibilité sans qu'un administrateur ait à déclencher un basculement. Il est conçu pour que Microsoft ne voie pas et n'extraie pas vos données : les secrets, les clés et les certificats sont réservés à votre usage. Les deux niveaux ont les mêmes fonctionnalités de base et ne diffèrent que par la protection matérielle des clés."
references:
  - title: Describe Azure Key Vault
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/8-describe-ways-azure-encrypts-data
  - title: About Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
