id: sc900-3b-pol-compliance-dashboard
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A compliance team added the ISO/IEC 27001 standard to the assessments of its Azure subscriptions in Microsoft Defender for Cloud. The team wants to see, for each control of the standard, how many resources pass or fail it.

    Which Defender for Cloud feature should the team use?
  fr: |
    Une équipe de conformité a ajouté la norme ISO/IEC 27001 aux évaluations de ses abonnements Azure dans Microsoft Defender pour le cloud. Elle veut voir, pour chaque contrôle de la norme, combien de ressources le réussissent ou y échouent.

    Quelle fonctionnalité de Defender pour le cloud l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "The regulatory compliance dashboard", fr: "Le tableau de bord de conformité réglementaire" }
    - id: b
      text: { en: "The cloud security explorer", fr: "L'explorateur de sécurité du cloud" }
    - id: c
      text: { en: "The security alerts page", fr: "La page des alertes de sécurité" }
    - id: d
      text: { en: "Attack path analysis", fr: "L'analyse du chemin d'attaque" }
answer: { optionId: a }
explanation:
  correct:
    en: "When you add a regulatory standard, Defender for Cloud assesses the environment against it and shows the status in the regulatory compliance dashboard. The dashboard displays each control of a standard and indicates how many resources pass or fail it, which helps the team find the gaps."
    fr: "Quand vous ajoutez une norme réglementaire, Defender pour le cloud évalue l'environnement par rapport à elle et affiche l'état dans le tableau de bord de conformité réglementaire. Le tableau de bord présente chaque contrôle d'une norme et indique combien de ressources le réussissent ou y échouent, ce qui aide l'équipe à repérer les écarts."
  options:
    b:
      en: "The cloud security explorer runs graph-based queries to hunt for risks; it does not report compliance control by control."
      fr: "L'explorateur de sécurité du cloud exécute des requêtes basées sur un graphe pour rechercher des risques ; il ne rend pas compte de la conformité contrôle par contrôle."
    c:
      en: "Security alerts report detected threats, not the compliance status against a standard."
      fr: "Les alertes de sécurité signalent des menaces détectées, pas l'état de conformité par rapport à une norme."
    d:
      en: "Attack path analysis models how an attacker could reach high-value resources; it is not a compliance report."
      fr: "L'analyse du chemin d'attaque modélise la façon dont un attaquant pourrait atteindre des ressources de grande valeur ; ce n'est pas un rapport de conformité."
references:
  - title: Describe how security policies, standards, and recommendations improve cloud security posture
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure
  - title: Regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
