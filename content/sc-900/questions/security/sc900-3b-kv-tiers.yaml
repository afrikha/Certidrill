id: sc900-3b-kv-tiers
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Azure Key Vault is offered in a Standard tier and a Premium tier.

    What does the Premium tier add to the Standard tier?
  fr: |
    Azure Key Vault est proposé en un niveau Standard et un niveau Premium.

    Qu'ajoute le niveau Premium au niveau Standard ?
body:
  options:
    - id: a
      text: { en: "Management of TLS/SSL certificates", fr: "La gestion des certificats TLS/SSL" }
    - id: b
      text: { en: "Authentication through Microsoft Entra ID", fr: "L'authentification par Microsoft Entra ID" }
    - id: c
      text: { en: "Logging of the access to keys and secrets", fr: "La journalisation des accès aux clés et aux secrets" }
    - id: d
      text: { en: "Keys protected by a hardware security module (HSM)", fr: "Des clés protégées par un module de sécurité matériel (HSM)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Both tiers provide the same core capabilities: secrets, key and certificate management. The Standard tier protects keys with software, while the Premium tier offers HSM-protected keys, generated and stored in a tamper-resistant hardware device that they never leave."
    fr: "Les deux niveaux fournissent les mêmes fonctionnalités de base : gestion des secrets, des clés et des certificats. Le niveau Standard protège les clés de façon logicielle, alors que le niveau Premium offre des clés protégées par HSM, générées et stockées dans un dispositif matériel résistant aux falsifications dont elles ne sortent jamais."
  options:
    a:
      en: "Certificate management is a core capability available in both tiers."
      fr: "La gestion des certificats est une fonctionnalité de base disponible dans les deux niveaux."
    b:
      en: "Every caller of Key Vault is authenticated through Microsoft Entra ID, whatever the tier."
      fr: "Tout appelant de Key Vault est authentifié par Microsoft Entra ID, quel que soit le niveau."
    c:
      en: "Logging lets you monitor how and when keys and secrets are accessed; it does not depend on the Premium tier."
      fr: "La journalisation permet de surveiller comment et quand les clés et les secrets sont consultés ; elle ne dépend pas du niveau Premium."
references:
  - title: Describe Azure Key Vault
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/8-describe-ways-azure-encrypts-data
  - title: About Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
