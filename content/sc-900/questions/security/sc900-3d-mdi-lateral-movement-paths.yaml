id: sc900-3d-mdi-lateral-movement-paths
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team of Fabrikam wants to know, before any attack takes place, how an attacker who compromises an ordinary account could reach the sensitive accounts of the on-premises Active Directory domain.

    What should the team use?
  fr: |
    L'équipe de sécurité de Fabrikam veut savoir, avant toute attaque, comment un attaquant qui compromet un compte ordinaire pourrait atteindre les comptes sensibles du domaine Active Directory local.

    Que doit utiliser l'équipe ?
body:
  options:
    - id: a
      text: { en: "Lateral movement paths in Microsoft Defender for Identity", fr: "Les chemins de mouvement latéral de Microsoft Defender pour Identity" }
    - id: b
      text: { en: "Attack simulation training in Microsoft Defender for Office 365", fr: "La formation à la simulation d'attaque de Microsoft Defender pour Office 365" }
    - id: c
      text: { en: "Cloud discovery in Microsoft Defender for Cloud Apps", fr: "La découverte du cloud de Microsoft Defender pour les applications cloud" }
    - id: d
      text: { en: "Access reviews in Microsoft Entra ID Governance", fr: "Les révisions d'accès de Microsoft Entra ID Governance" }
answer: { optionId: a }
explanation:
  correct:
    en: "As part of its proactive assessment of the identity posture, Defender for Identity continuously looks for the sensitive accounts that are exposed through the riskiest lateral movement paths. A lateral movement path shows how an attacker could move from one account to another until a sensitive account is reached, so the team can close the path before it is used."
    fr: "Dans le cadre de son évaluation proactive de la posture des identités, Defender pour Identity recherche en continu les comptes sensibles exposés par les chemins de mouvement latéral les plus risqués. Un chemin de mouvement latéral montre comment un attaquant pourrait passer d'un compte à un autre jusqu'à atteindre un compte sensible : l'équipe peut ainsi fermer le chemin avant qu'il ne soit utilisé."
  options:
    b:
      en: "Attack simulation training sends simulated phishing messages to users to train them; it does not analyze the accounts of Active Directory."
      fr: "La formation à la simulation d'attaque envoie aux utilisateurs des messages d'hameçonnage simulés pour les former ; elle n'analyse pas les comptes d'Active Directory."
    c:
      en: "Cloud discovery identifies the cloud apps that users access; it shows nothing about movement between the accounts of a domain."
      fr: "La découverte du cloud identifie les applications cloud auxquelles les utilisateurs accèdent ; elle ne montre rien des déplacements entre les comptes d'un domaine."
    d:
      en: "Access reviews ask reviewers to confirm that users still need their group memberships, app access or roles; they do not model the route an attacker could take."
      fr: "Les révisions d'accès demandent à des réviseurs de confirmer que les utilisateurs ont toujours besoin de leurs appartenances aux groupes, de leurs accès aux applications ou de leurs rôles ; elles ne modélisent pas le chemin qu'un attaquant pourrait emprunter."
references:
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
  - title: Microsoft Defender for Identity overview
    url: https://learn.microsoft.com/en-us/defender-for-identity/what-is
