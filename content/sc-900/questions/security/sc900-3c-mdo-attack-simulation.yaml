id: sc900-3c-mdo-attack-simulation
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys wants to find out which employees are likely to fall for a phishing message, and to train those employees, before a real attack reaches the company.

    What should Wingtip Toys use?
  fr: |
    Wingtip Toys veut savoir quels employés risquent de se laisser prendre par un message d'hameçonnage, et former ces employés, avant qu'une véritable attaque n'atteigne l'entreprise.

    Que doit utiliser Wingtip Toys ?
body:
  options:
    - id: a
      text: { en: "Campaigns in Microsoft Defender for Office 365", fr: "Les campagnes de Microsoft Defender pour Office 365" }
    - id: b
      text: { en: "Threat Explorer in Microsoft Defender for Office 365", fr: "L'Explorateur de menaces (Threat Explorer) de Microsoft Defender pour Office 365" }
    - id: c
      text: { en: "Safe Links in Microsoft Defender for Office 365", fr: "Liens sécurisés (Safe Links) de Microsoft Defender pour Office 365" }
    - id: d
      text: { en: "Attack simulation training in Microsoft Defender for Office 365", fr: "La Formation à la simulation d'attaque (Attack simulation training) de Microsoft Defender pour Office 365" }
answer: { optionId: d }
explanation:
  correct:
    en: "Attack simulation training lets administrators run realistic but harmless attack scenarios, such as a simulated phishing message, against the organization's own users. It identifies the users who react in a risky way and delivers training to them."
    fr: "La Formation à la simulation d'attaque permet aux administrateurs de lancer des scénarios d'attaque réalistes mais inoffensifs, comme un message d'hameçonnage simulé, contre les propres utilisateurs de l'organisation. Elle repère les utilisateurs qui réagissent de façon risquée et leur délivre une formation."
  options:
    a:
      en: "Campaigns identifies and categorizes coordinated phishing and malware attacks that really targeted the organization; it does not test users."
      fr: "Les campagnes identifient et classent les attaques coordonnées d'hameçonnage et de programmes malveillants qui ont réellement visé l'organisation ; elles ne testent pas les utilisateurs."
    b:
      en: "Threat Explorer is an investigation tool for threats detected in real email; it does not simulate attacks or assign training."
      fr: "L'Explorateur de menaces est un outil d'investigation des menaces détectées dans les vrais e-mails ; il ne simule pas d'attaques et n'attribue pas de formation."
    c:
      en: "Safe Links blocks malicious URLs at the time of the click; it protects users but does not measure or improve their behavior."
      fr: "Liens sécurisés bloque les URL malveillantes au moment du clic ; la fonctionnalité protège les utilisateurs mais ne mesure pas et n'améliore pas leur comportement."
references:
  - title: Describe Microsoft Defender for Office 365
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/3-describe-defender-office
  - title: Get started using Attack simulation training
    url: https://learn.microsoft.com/en-us/defender-office-365/attack-simulation-training-get-started
