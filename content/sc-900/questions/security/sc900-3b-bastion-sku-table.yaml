id: sc900-3b-bastion-sku-table
objective: "3.1.6"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Azure Bastion is available in the four SKUs shown in the following table.

    Answer each prompt by selecting the appropriate SKU.

    NOTE: Each correct selection is worth one point.
  fr: |
    Azure Bastion est disponible dans les quatre SKU présentés dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le SKU approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The lowest SKU that lets administrators connect from the native RDP or SSH client of their computer", fr: "Le SKU le plus bas qui permet aux administrateurs de se connecter depuis le client RDP ou SSH natif de leur ordinateur" }
    - id: p2
      text: { en: "The SKU required to record the sessions for compliance audits", fr: "Le SKU nécessaire pour enregistrer les sessions à des fins d'audit de conformité" }
  grid:
    header: [SKU, { en: "Infrastructure", fr: "Infrastructure" }, { en: "Capacity", fr: "Capacité" }]
    rows:
      - [{ text: Developer, area: dev }, { text: { en: "Shared", fr: "Partagée" } }, { text: { en: "One virtual machine connection at a time", fr: "Une connexion à une machine virtuelle à la fois" } }]
      - [{ text: Basic, area: basic }, { text: { en: "Dedicated", fr: "Dédiée" } }, { text: { en: "Fixed", fr: "Fixe" } }]
      - [{ text: Standard, area: std }, { text: { en: "Dedicated", fr: "Dédiée" } }, { text: { en: "Host scaling", fr: "Mise à l'échelle de l'hôte" } }]
      - [{ text: Premium, area: prem }, { text: { en: "Dedicated", fr: "Dédiée" } }, { text: { en: "Host scaling", fr: "Mise à l'échelle de l'hôte" } }]
answer:
  values: { p1: std, p2: prem }
explanation:
  correct:
    en: "Browser-based connections from the Azure portal exist in every SKU, but native client connections start with the Standard SKU, together with shareable links, custom ports and file transfer. Session recording, like private-only deployment, is reserved for the Premium SKU."
    fr: "Les connexions par navigateur depuis le portail Azure existent dans tous les SKU, mais les connexions par client natif commencent au SKU Standard, avec les liens partageables, les ports personnalisés et le transfert de fichiers. L'enregistrement des sessions, comme le déploiement privé uniquement, est réservé au SKU Premium."
  options:
    dev:
      en: "The Developer SKU is free, uses shared infrastructure and offers browser-based connections only."
      fr: "Le SKU Developer est gratuit, utilise une infrastructure partagée et n'offre que les connexions par navigateur."
    basic:
      en: "The Basic SKU is a dedicated deployment with the core capabilities only: no native client and no session recording."
      fr: "Le SKU Basic est un déploiement dédié limité aux fonctionnalités de base : ni client natif ni enregistrement des sessions."
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
  - title: Describe Azure Bastion
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/7-describe-azure-bastion-just-in-time-access
