id: sc900-3a-fw-deploy-sentence
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Firewall is [[kind]].

      The recommended approach is to deploy it in [[where]].

      With this model, the other virtual networks and the on-premises network [[route]].
    fr: |
      Le Pare-feu Azure est [[kind]].

      L'approche recommandée consiste à le déployer dans [[where]].

      Avec ce modèle, les autres réseaux virtuels et le réseau local [[route]].
  slots:
    - id: kind
      options:
        - { id: agent, text: { en: "an agent installed on each virtual machine", fr: "un agent installé sur chaque machine virtuelle" } }
        - { id: appliance, text: { en: "a hardware appliance hosted in your datacenter", fr: "une appliance matérielle hébergée dans votre centre de données" } }
        - { id: managed, text: { en: "a managed, cloud-based network security service", fr: "un service de sécurité réseau managé, basé sur le cloud" } }
    - id: where
      options:
        - { id: central, text: { en: "a centralized virtual network", fr: "un réseau virtuel centralisé" } }
        - { id: each, text: { en: "every subnet of every virtual network", fr: "chaque sous-réseau de chaque réseau virtuel" } }
        - { id: nic, text: { en: "the network interface of each virtual machine", fr: "l'interface réseau de chaque machine virtuelle" } }
    - id: route
      options:
        - { id: own, text: { en: "each need their own firewall", fr: "ont chacun besoin de leur propre pare-feu" } }
        - { id: through, text: { en: "route their traffic through the firewall", fr: "acheminent leur trafic par le pare-feu" } }
        - { id: direct, text: { en: "send their traffic directly to the internet", fr: "envoient leur trafic directement vers internet" } }
answer:
  values: { kind: managed, where: central, route: through }
explanation:
  correct:
    en: "Azure Firewall is a managed, cloud-based network security service that provides threat protection for the workloads that run in Azure. It can be deployed in any virtual network, but the best approach is a centralized virtual network through which all the other virtual networks and the on-premises network route their traffic. One firewall then controls the traffic of virtual networks across subscriptions."
    fr: "Le Pare-feu Azure est un service de sécurité réseau managé, basé sur le cloud, qui protège contre les menaces les charges de travail exécutées dans Azure. Il peut être déployé dans n'importe quel réseau virtuel, mais la meilleure approche est un réseau virtuel centralisé par lequel tous les autres réseaux virtuels et le réseau local acheminent leur trafic. Un seul pare-feu contrôle alors le trafic des réseaux virtuels de plusieurs abonnements."
  options:
    agent:
      en: "Azure Firewall is a network service; nothing is installed on the virtual machines that it protects."
      fr: "Le Pare-feu Azure est un service réseau ; rien n'est installé sur les machines virtuelles qu'il protège."
    nic:
      en: "A network security group, not Azure Firewall, is associated with a network interface or a subnet."
      fr: "C'est un groupe de sécurité réseau, et non le Pare-feu Azure, qui s'associe à une interface réseau ou à un sous-réseau."
    own:
      en: "The central model exists precisely to avoid one firewall for each network."
      fr: "Le modèle central existe justement pour éviter un pare-feu par réseau."
references:
  - title: Describe Azure Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall
