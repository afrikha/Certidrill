id: sc900-3a-seg-peering-sentence
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about virtual network peering, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur le peering de réseaux virtuels, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A virtual network peering connects two virtual networks so that their resources communicate [[how]].

      A peering between virtual networks located in different Azure regions is called [[global]].

      The traffic between peered virtual networks travels over [[path]].
    fr: |
      Un peering de réseaux virtuels connecte deux réseaux virtuels pour que leurs ressources communiquent [[how]].

      Un peering entre des réseaux virtuels situés dans des régions Azure différentes s'appelle [[global]].

      Le trafic entre des réseaux virtuels reliés par un peering circule sur [[path]].
  slots:
    - id: how
      options:
        - { id: same, text: { en: "as if they were in the same virtual network", fr: "comme si elles étaient dans le même réseau virtuel" } }
        - { id: pip, text: { en: "only through their public IP addresses", fr: "uniquement par leurs adresses IP publiques" } }
        - { id: bastion, text: { en: "only through an Azure Bastion host", fr: "uniquement par un hôte Azure Bastion" } }
    - id: global
      options:
        - { id: s2s, text: { en: "a site-to-site VPN", fr: "un VPN site à site" } }
        - { id: gp, text: { en: "a global virtual network peering", fr: "un peering de réseaux virtuels mondial" } }
        - { id: p2s, text: { en: "a point-to-site VPN", fr: "un VPN point à site" } }
    - id: path
      options:
        - { id: internet, text: { en: "the public internet", fr: "l'internet public" } }
        - { id: onprem, text: { en: "the on-premises network", fr: "le réseau local" } }
        - { id: backbone, text: { en: "the Azure backbone network", fr: "le réseau principal (backbone) d'Azure" } }
answer:
  values: { how: same, global: gp, path: backbone }
explanation:
  correct:
    en: "A virtual network peering connects two virtual networks so that the resources of either network communicate as if they were in the same virtual network. It also works across Azure regions, where it is called global virtual network peering. The traffic between peered virtual networks uses the Azure backbone network, not the public internet, which keeps it private."
    fr: "Un peering de réseaux virtuels connecte deux réseaux virtuels pour que les ressources de l'un et de l'autre communiquent comme si elles étaient dans le même réseau virtuel. Il fonctionne aussi entre régions Azure, où il s'appelle peering de réseaux virtuels mondial. Le trafic entre réseaux virtuels reliés par un peering emprunte le réseau principal (backbone) d'Azure, et non l'internet public, ce qui le garde privé."
  options:
    s2s:
      en: "A site-to-site VPN connects an on-premises network to a virtual network; it isn't a kind of peering."
      fr: "Un VPN site à site connecte un réseau local à un réseau virtuel ; ce n'est pas une forme de peering."
    p2s:
      en: "A point-to-site VPN connects a single computer to a virtual network."
      fr: "Un VPN point à site connecte un seul ordinateur à un réseau virtuel."
    pip:
      en: "Peered virtual networks communicate with their private IP addresses; no public IP address is involved."
      fr: "Les réseaux virtuels reliés par un peering communiquent avec leurs adresses IP privées ; aucune adresse IP publique n'intervient."
references:
  - title: Describe network segmentation in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
  - title: What is Azure Virtual Network?
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
