id: sc900-3b-pol-standards-yn
objective: "3.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender for Cloud, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender pour le cloud, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Microsoft cloud security benchmark (MCSB) gives implementation guidance for Azure only.
        fr: Le benchmark de sécurité cloud Microsoft (MCSB) donne des conseils de mise en œuvre pour Azure uniquement.
    - id: s2
      text:
        en: Remediating a single recommendation can improve compliance with several standards at the same time.
        fr: Corriger une seule recommandation peut améliorer la conformité à plusieurs normes en même temps.
    - id: s3
      text:
        en: The MCSB builds on controls from the Center for Internet Security (CIS) and the National Institute of Standards and Technology (NIST).
        fr: Le MCSB s'appuie sur des contrôles du Center for Internet Security (CIS) et du National Institute of Standards and Technology (NIST).
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "The MCSB provides guidance for Azure and also for Amazon Web Services and Google Cloud Platform, which serves multicloud organizations. One recommendation often maps to controls of several standards: enabling MFA for privileged accounts, for example, supports ISO 27001, NIST and PCI DSS requirements at once. The MCSB builds on CIS and NIST controls with a focus on cloud-centric security."
    fr: "Le MCSB fournit des conseils pour Azure, mais aussi pour Amazon Web Services et Google Cloud Platform, ce qui sert les organisations multicloud. Une même recommandation correspond souvent à des contrôles de plusieurs normes : activer la MFA pour les comptes privilégiés, par exemple, répond à la fois à des exigences d'ISO 27001, du NIST et de PCI DSS. Le MCSB s'appuie sur les contrôles du CIS et du NIST, avec un accent sur la sécurité propre au cloud."
references:
  - title: Describe how security policies, standards, and recommendations improve cloud security posture
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure
