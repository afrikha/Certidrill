id: sc900-3c-sentinel-automation-yn
objective: "3.3.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Sentinel, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Sentinel, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A playbook can run automatically when an automation rule triggers it, and it can also be run on demand."
        fr: "Un playbook peut s'exécuter automatiquement quand une règle d'automatisation le déclenche, et il peut aussi être exécuté à la demande."
    - id: s2
      text:
        en: "To assign an incident to an analyst, an automation rule must call a playbook."
        fr: "Pour attribuer un incident à un analyste, une règle d'automatisation doit appeler un playbook."
    - id: s3
      text:
        en: "A hunting query that produces a significant finding can be turned into a rule that generates alerts."
        fr: "Une requête de repérage qui produit un résultat important peut être transformée en règle qui émet des alertes."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Playbooks run in response to an automation rule or on demand, as a one-click response for an analyst. An automation rule can assign, tag or close an incident and change its status by itself; it calls a playbook only for more advanced actions. A hunting query that proves useful can be promoted to a detection rule, so that the activity raises alerts automatically from then on."
    fr: "Les playbooks s'exécutent en réponse à une règle d'automatisation ou à la demande, comme réponse en un clic pour un analyste. Une règle d'automatisation peut à elle seule attribuer, étiqueter ou fermer un incident et changer son état ; elle n'appelle un playbook que pour des actions plus avancées. Une requête de repérage qui se révèle utile peut être promue en règle de détection, pour que l'activité émette désormais des alertes automatiquement."
references:
  - title: "Automation in Microsoft Sentinel: Security orchestration, automation, and response (SOAR)"
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/automation
  - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management
