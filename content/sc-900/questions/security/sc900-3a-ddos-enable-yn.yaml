id: sc900-3a-ddos-enable-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Azure DDoS Protection, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Azure DDoS Protection, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "DDoS Network Protection can be enabled on a virtual network that already contains resources."
        fr: "DDoS Network Protection peut être activée sur un réseau virtuel qui contient déjà des ressources."
    - id: s2
      text:
        en: "Enabling DDoS Network Protection requires changes to the protected applications."
        fr: "L'activation de DDoS Network Protection exige de modifier les applications protégées."
    - id: s3
      text:
        en: "When Azure DDoS Protection detects an attack, the mitigation starts automatically."
        fr: "Lorsque Azure DDoS Protection détecte une attaque, l'atténuation démarre automatiquement."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "DDoS Network Protection is simple to enable on any new or existing virtual network, and it requires no application or resource changes. Traffic is monitored around the clock, and as soon as an attack is detected the mitigation is instant and automatic: the attack traffic is dropped and the rest is forwarded to its destination."
    fr: "DDoS Network Protection s'active simplement sur tout réseau virtuel, nouveau ou existant, et n'exige aucune modification des applications ni des ressources. Le trafic est surveillé en permanence, et dès qu'une attaque est détectée, l'atténuation est immédiate et automatique : le trafic d'attaque est écarté et le reste est transmis à sa destination."
  options:
    s2:
      en: "The protection is applied by the Azure network in front of the resources; the applications aren't changed."
      fr: "La protection est appliquée par le réseau Azure en amont des ressources ; les applications ne sont pas modifiées."
references:
  - title: Describe Azure DDoS protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection
  - title: Azure DDoS Protection Overview
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
