id: sc900-3c-siem-definition
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which type of solution collects data from across the entire digital estate of an organization, on-premises and in the cloud, and then analyzes that data to surface potential threats?
  fr: |
    Quel type de solution collecte les données de tout le patrimoine numérique d'une organisation, en local et dans le cloud, puis analyse ces données pour faire ressortir les menaces potentielles ?
body:
  options:
    - id: a
      text: { en: "Cloud access security broker (CASB)", fr: "Broker de sécurité d'accès au cloud (CASB)" }
    - id: b
      text: { en: "Security information and event management (SIEM)", fr: "Gestion des informations et des événements de sécurité (SIEM)" }
    - id: c
      text: { en: "Security orchestration, automation, and response (SOAR)", fr: "Orchestration, automatisation et réponse en matière de sécurité (SOAR)" }
    - id: d
      text: { en: "Cloud security posture management (CSPM)", fr: "Gestion de la posture de sécurité cloud (CSPM)" }
answer: { optionId: b }
explanation:
  correct:
    en: "A SIEM system gathers logs and security events from infrastructure, software, services and resources wherever they run, and consolidates them in one platform. It then correlates the data, raises alerts and groups related alerts into incidents, which gives analysts one view of the security activity of the whole organization."
    fr: "Un système SIEM rassemble les journaux et les événements de sécurité de l'infrastructure, des logiciels, des services et des ressources, où qu'ils s'exécutent, et les regroupe dans une seule plateforme. Il corrèle ensuite les données, émet des alertes et regroupe les alertes liées en incidents, ce qui donne aux analystes une vue unique de l'activité de sécurité de toute l'organisation."
  options:
    a:
      en: "A CASB sits between users and the cloud apps they use: it brokers and controls that access, it does not centralize the logs of the whole estate."
      fr: "Un CASB se place entre les utilisateurs et les applications cloud qu'ils utilisent : il régule et contrôle cet accès, il ne centralise pas les journaux de tout le patrimoine."
    c:
      en: "SOAR starts from the alerts that a SIEM and other tools raise and automates the response; collecting and analyzing the data is the role of the SIEM."
      fr: "Le SOAR part des alertes émises par un SIEM et par d'autres outils et automatise la réponse ; collecter et analyser les données est le rôle du SIEM."
    d:
      en: "CSPM assesses the configuration of cloud resources and recommends hardening actions; it is not a log collection and threat detection platform."
      fr: "La CSPM évalue la configuration des ressources cloud et recommande des actions de renforcement ; ce n'est pas une plateforme de collecte de journaux et de détection des menaces."
references:
  - title: Define the concepts of SIEM and SOAR
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar
