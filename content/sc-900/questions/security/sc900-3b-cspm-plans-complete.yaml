id: sc900-3b-cspm-plans-complete
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[auto]] is enabled by default on any subscription or account that is onboarded to Microsoft Defender for Cloud.

      [[adv]] is an optional plan that provides attack path analysis and the cloud security explorer.

      Data security posture management (DSPM) is available with the Defender CSPM plan or with [[dspm]].
    fr: |
      [[auto]] est activé par défaut sur tout abonnement ou compte intégré à Microsoft Defender pour le cloud.

      [[adv]] est un plan facultatif qui fournit l'analyse du chemin d'attaque et l'explorateur de sécurité du cloud.

      La gestion de la posture de sécurité des données (DSPM) est disponible avec le plan Defender CSPM ou avec [[dspm]].
  slots:
    - id: auto
      options:
        - { id: dcspm, text: "Defender CSPM" }
        - { id: srv, text: "Defender for Servers" }
        - { id: fcspm, text: { en: "Foundational CSPM", fr: "Le CSPM de base (Foundational CSPM)" } }
    - id: adv
      options:
        - { id: dcspm, text: "Defender CSPM" }
        - { id: srv, text: "Defender for Servers" }
        - { id: fcspm, text: { en: "Foundational CSPM", fr: "Le CSPM de base (Foundational CSPM)" } }
    - id: dspm
      options:
        - { id: kv, text: "Defender for Key Vault" }
        - { id: sto, text: "Defender for Storage" }
        - { id: rm, text: "Defender for Resource Manager" }
answer:
  values: { auto: fcspm, adv: dcspm, dspm: sto }
explanation:
  correct:
    en: "Foundational CSPM offers the basic multicloud posture capabilities for free and is enabled by default on every onboarded subscription or account. Defender CSPM is the optional plan with the advanced capabilities: attack path analysis, cloud security explorer, governance, DSPM and AI SPM. DSPM, which discovers datastores holding sensitive data, also comes with Defender for Storage."
    fr: "Le CSPM de base (Foundational CSPM) offre gratuitement les fonctionnalités de posture multicloud de base et est activé par défaut sur chaque abonnement ou compte intégré. Defender CSPM est le plan facultatif qui apporte les fonctionnalités avancées : analyse du chemin d'attaque, explorateur de sécurité du cloud, gouvernance, DSPM et AI SPM. La DSPM, qui découvre les magasins de données contenant des données sensibles, est aussi fournie avec Defender for Storage."
  options:
    srv:
      en: "Defender for Servers is a workload protection plan for Windows and Linux machines, not a posture management plan."
      fr: "Defender for Servers est un plan de protection des charges de travail pour les machines Windows et Linux, pas un plan de gestion de la posture."
    kv:
      en: "Defender for Key Vault detects threats that target key vaults; it does not discover datastores with sensitive data."
      fr: "Defender for Key Vault détecte les menaces qui visent les coffres de clés ; il ne découvre pas les magasins de données contenant des données sensibles."
references:
  - title: Describe Cloud security posture management
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management
  - title: What is Microsoft Defender for Cloud?
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
