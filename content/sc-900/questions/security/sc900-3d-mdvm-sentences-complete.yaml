id: sc900-3d-mdvm-sentences-complete
objective: "3.4.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Defender Vulnerability Management, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur la Gestion des vulnérabilités Microsoft Defender, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Defender Vulnerability Management uses [[d1]] approach to discover, prioritize and remediate vulnerabilities and misconfigurations.

      Its consolidated inventories cover software applications, digital certificates, hardware and firmware, and [[d2]].

      In the Microsoft Defender portal, the Vulnerability management section is found under [[d3]].
    fr: |
      La Gestion des vulnérabilités Microsoft Defender utilise une approche [[d1]] pour découvrir, hiérarchiser et corriger les vulnérabilités et les erreurs de configuration.

      Ses inventaires consolidés couvrent les applications logicielles, les certificats numériques, le matériel et les microprogrammes, et [[d2]].

      Dans le portail Microsoft Defender, la section Gestion des vulnérabilités (Vulnerability management) se trouve sous [[d3]].
  slots:
    - id: d1
      options:
        - { id: sig, text: { en: "a signature-based", fr: "basée sur les signatures" } }
        - { id: risk, text: { en: "a risk-based", fr: "basée sur les risques" } }
        - { id: perim, text: { en: "a perimeter-based", fr: "basée sur le périmètre" } }
    - id: d2
      options:
        - { id: mbx, text: { en: "user mailboxes", fr: "les boîtes aux lettres des utilisateurs" } }
        - { id: labels, text: { en: "sensitivity labels", fr: "les étiquettes de confidentialité" } }
        - { id: ext, text: { en: "browser extensions", fr: "les extensions de navigateur" } }
    - id: d3
      options:
        - { id: expo, text: { en: "Exposure management", fr: "Gestion de l'exposition (Exposure management)" } }
        - { id: mail, text: { en: "Email & collaboration", fr: "E-mail et collaboration (Email & collaboration)" } }
        - { id: apps, text: { en: "Cloud apps", fr: "Applications cloud (Cloud apps)" } }
answer:
  values: { d1: risk, d2: ext, d3: expo }
explanation:
  correct:
    en: "Defender Vulnerability Management is risk-based: it ranks weaknesses by the danger they represent instead of treating them all alike. Its inventories give a real-time view of software applications, digital certificates, hardware and firmware, and browser extensions. In the Microsoft Defender portal, the Vulnerability management section sits under Exposure management, which reflects its integration with Microsoft Security Exposure Management."
    fr: "La Gestion des vulnérabilités Microsoft Defender est basée sur les risques : elle classe les faiblesses selon le danger qu'elles représentent au lieu de les traiter toutes de la même façon. Ses inventaires donnent une vue en temps réel des applications logicielles, des certificats numériques, du matériel et des microprogrammes, et des extensions de navigateur. Dans le portail Microsoft Defender, la section Gestion des vulnérabilités se trouve sous Gestion de l'exposition, ce qui reflète son intégration à Microsoft Security Exposure Management."
references:
  - title: Describe Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6a-describe-defender-vulnerability-management
  - title: What is Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management
