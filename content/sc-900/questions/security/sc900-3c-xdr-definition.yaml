id: sc900-3c-xdr-definition
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Microsoft solution is a unified pre-breach and post-breach enterprise defense suite that coordinates detection, prevention, investigation and response across endpoints, identities, email and applications?
  fr: |
    Quelle solution Microsoft est une suite unifiée de défense d'entreprise, avant et après violation, qui coordonne la détection, la prévention, l'investigation et la réponse sur les points de terminaison, les identités, l'e-mail et les applications ?
body:
  options:
    - id: a
      text: "Microsoft Purview"
    - id: b
      text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" }
    - id: c
      text: "Microsoft Entra ID Governance"
    - id: d
      text: "Microsoft Defender XDR"
answer: { optionId: d }
explanation:
  correct:
    en: "Microsoft Defender XDR (extended detection and response) brings the signals of several Defender services into one platform. Because attacks move from a phishing email to a device, an identity and cloud apps, the suite correlates those domains to show how the attack entered, what it affected and how to stop it."
    fr: "Microsoft Defender XDR (détection et réponse étendues) réunit les signaux de plusieurs services Defender dans une seule plateforme. Comme les attaques passent d'un e-mail d'hameçonnage à un appareil, à une identité et aux applications cloud, la suite corrèle ces domaines pour montrer comment l'attaque est entrée, ce qu'elle a touché et comment l'arrêter."
  options:
    a:
      en: "Microsoft Purview covers data governance, data protection and compliance, not threat detection and response."
      fr: "Microsoft Purview couvre la gouvernance des données, leur protection et la conformité, pas la détection des menaces et la réponse."
    b:
      en: "Microsoft Defender for Cloud protects cloud resources and workloads in Azure and other clouds; it is a different product from the Defender XDR suite."
      fr: "Microsoft Defender pour le cloud protège les ressources et les charges de travail cloud dans Azure et dans d'autres clouds ; c'est un produit distinct de la suite Defender XDR."
    c:
      en: "Microsoft Entra ID Governance manages the lifecycle of identities and of their access, for example with access reviews."
      fr: "Microsoft Entra ID Governance gère le cycle de vie des identités et de leurs accès, par exemple avec les révisions d'accès."
references:
  - title: Describe Microsoft Defender XDR services
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services
  - title: What is Microsoft Defender XDR?
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-365-defender
