id: sc900-3b-kv-basics-yn
objective: "3.1.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Applications can retrieve their secrets from Azure Key Vault at run time instead of storing them in their code.
        fr: Les applications peuvent récupérer leurs secrets dans Azure Key Vault à l'exécution au lieu de les stocker dans leur code.
    - id: s2
      text:
        en: Azure Key Vault authenticates callers against its own user database, separate from Microsoft Entra ID.
        fr: Azure Key Vault authentifie les appelants auprès de sa propre base d'utilisateurs, distincte de Microsoft Entra ID.
    - id: s3
      text:
        en: Azure Key Vault can automate the renewal of certificates purchased from public certificate authorities.
        fr: Azure Key Vault peut automatiser le renouvellement des certificats achetés auprès d'autorités de certification publiques.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Centralizing secrets in Key Vault means that developers no longer store security information in application code: the application reads it from the vault when it runs. Every caller, user or application, is authenticated through Microsoft Entra ID. For certificates purchased from public certificate authorities, Key Vault automates tasks such as enrollment and renewal."
    fr: "Centraliser les secrets dans Key Vault évite aux développeurs de stocker des informations de sécurité dans le code des applications : l'application les lit dans le coffre à l'exécution. Chaque appelant, utilisateur ou application, est authentifié par Microsoft Entra ID. Pour les certificats achetés auprès d'autorités de certification publiques, Key Vault automatise des tâches comme l'inscription et le renouvellement."
references:
  - title: Describe Azure Key Vault
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/8-describe-ways-azure-encrypts-data
