id: sc900-3d-mdi-basics-yn
objective: "3.4.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender for Identity, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender pour Identity, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Defender for Identity is a cloud-based security solution."
        fr: "Microsoft Defender pour Identity est une solution de sécurité basée sur le cloud."
    - id: s2
      text:
        en: "Microsoft Defender for Identity can detect brute-force attacks against the accounts of an on-premises Active Directory domain."
        fr: "Microsoft Defender pour Identity peut détecter les attaques par force brute contre les comptes d'un domaine Active Directory local."
    - id: s3
      text:
        en: "Microsoft Defender for Identity scans email attachments for malware before they are delivered."
        fr: "Microsoft Defender pour Identity recherche les programmes malveillants dans les pièces jointes des e-mails avant leur remise."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Defender for Identity is a cloud service: only its sensors run on the identity servers of the organization, and the analysis takes place in the cloud. Brute-force attacks and failed authentications are part of the compromised credentials stage that it detects. Scanning email attachments is the role of Safe Attachments in Microsoft Defender for Office 365."
    fr: "Defender pour Identity est un service cloud : seuls ses capteurs s'exécutent sur les serveurs d'identité de l'organisation, et l'analyse a lieu dans le cloud. Les attaques par force brute et les échecs d'authentification font partie de l'étape des informations d'identification compromises qu'il détecte. L'analyse des pièces jointes des e-mails est le rôle des Pièces jointes sécurisées (Safe Attachments) de Microsoft Defender pour Office 365."
references:
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
