id: sc900-3a-seg-vnet-building-block
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the fundamental building block of an organization's private network in Azure?
  fr: |
    Quel est le composant de base du réseau privé d'une organisation dans Azure ?
body:
  options:
    - id: a
      text: { en: "A network security group", fr: "Un groupe de sécurité réseau" }
    - id: b
      text: { en: "An Azure Firewall instance", fr: "Une instance du Pare-feu Azure" }
    - id: c
      text: { en: "An Azure Bastion host", fr: "Un hôte Azure Bastion" }
    - id: d
      text: { en: "An Azure virtual network", fr: "Un réseau virtuel Azure" }
answer: { optionId: d }
explanation:
  correct:
    en: "An Azure virtual network (VNet) is the fundamental building block of a private network in Azure. It resembles a traditional network operated in a datacenter, with the scale, availability and isolation of the Azure infrastructure, and it provides network-level containment of the resources that it holds."
    fr: "Un réseau virtuel Azure (VNet) est le composant de base d'un réseau privé dans Azure. Il ressemble à un réseau traditionnel exploité dans un centre de données, avec la mise à l'échelle, la disponibilité et l'isolation de l'infrastructure Azure, et il assure le confinement au niveau du réseau des ressources qu'il contient."
  options:
    a:
      en: "A network security group filters traffic inside a virtual network; it is applied to an existing network, not the network itself."
      fr: "Un groupe de sécurité réseau filtre le trafic à l'intérieur d'un réseau virtuel ; il s'applique à un réseau existant, ce n'est pas le réseau lui-même."
    b:
      en: "Azure Firewall is a security service deployed in a virtual network to filter traffic centrally."
      fr: "Le Pare-feu Azure est un service de sécurité déployé dans un réseau virtuel pour filtrer le trafic de façon centralisée."
    c:
      en: "Azure Bastion is deployed in a virtual network to give secure RDP and SSH access to its virtual machines."
      fr: "Azure Bastion se déploie dans un réseau virtuel pour donner un accès RDP et SSH sécurisé à ses machines virtuelles."
references:
  - title: Describe network segmentation in Azure
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
  - title: What is Azure Virtual Network?
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
