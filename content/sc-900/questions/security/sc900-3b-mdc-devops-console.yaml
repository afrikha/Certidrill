id: sc900-3b-mdc-devops-console
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Defender for Cloud lets security teams manage DevOps security across multi-pipeline environments such as [[env]].

      In a central console, the teams review the findings of scans of [[scan]].
    fr: |
      Microsoft Defender pour le cloud permet aux équipes de sécurité de gérer la sécurité DevOps dans des environnements multi-pipelines tels que [[env]].

      Dans une console centrale, les équipes consultent les résultats des analyses [[scan]].
  slots:
    - id: env
      options:
        - { id: m365, text: { en: "Exchange Online and SharePoint", fr: "Exchange Online et SharePoint" } }
        - { id: pipe, text: { en: "GitHub and Azure DevOps", fr: "GitHub et Azure DevOps" } }
        - { id: idp, text: { en: "Microsoft Entra ID and Active Directory", fr: "Microsoft Entra ID et Active Directory" } }
    - id: scan
      options:
        - { id: mail, text: { en: "email attachments and links", fr: "des pièces jointes et des liens des e-mails" } }
        - { id: signin, text: { en: "user sign-ins and their risk level", fr: "des connexions des utilisateurs et de leur niveau de risque" } }
        - { id: code, text: { en: "code, secrets and open-source dependencies", fr: "du code, des secrets et des dépendances open source" } }
answer:
  values: { env: pipe, scan: code }
explanation:
  correct:
    en: "The DevOps security of Defender for Cloud lets security teams manage security across multi-pipeline environments such as GitHub and Azure DevOps. Its central console shows the findings of code, secrets and open-source dependency vulnerability scans across these environments."
    fr: "La sécurité DevOps de Defender pour le cloud permet aux équipes de sécurité de gérer la sécurité dans des environnements multi-pipelines comme GitHub et Azure DevOps. Sa console centrale présente les résultats des analyses de vulnérabilités du code, des secrets et des dépendances open source dans ces environnements."
  options:
    mail:
      en: "Scanning email attachments and links is done by Microsoft Defender for Office 365."
      fr: "L'analyse des pièces jointes et des liens des e-mails est le rôle de Microsoft Defender pour Office 365."
    signin:
      en: "Assessing the risk of user sign-ins is done by Microsoft Entra ID Protection."
      fr: "L'évaluation du risque des connexions des utilisateurs est le rôle de Protection Microsoft Entra ID."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
