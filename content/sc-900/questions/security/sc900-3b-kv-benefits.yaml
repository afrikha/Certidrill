id: sc900-3b-kv-benefits
objective: "3.1.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two benefits does Azure Key Vault provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux avantages apportés par Azure Key Vault ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Application secrets are centralized instead of being stored in code.", fr: "Les secrets des applications sont centralisés au lieu d'être stockés dans le code." } }
    - { id: b, text: { en: "Virtual machines no longer need a public IP address for RDP access.", fr: "Les machines virtuelles n'ont plus besoin d'adresse IP publique pour l'accès RDP." } }
    - { id: c, text: { en: "Network traffic to an application is filtered by priority rules.", fr: "Le trafic réseau vers une application est filtré par des règles à priorité." } }
    - { id: d, text: { en: "Access to keys and secrets can be logged and monitored.", fr: "L'accès aux clés et aux secrets peut être journalisé et surveillé." } }
    - { id: e, text: { en: "Misconfigured resources are listed with a secure score.", fr: "Les ressources mal configurées sont listées avec un score de sécurité." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Key Vault centralizes the storage of application secrets, which reduces the chance of an accidental leak because the secrets are no longer in application code. It also supports logging, so you can monitor how and when keys and secrets are accessed and detect unauthorized attempts."
    fr: "Key Vault centralise le stockage des secrets des applications, ce qui réduit le risque de fuite accidentelle puisque les secrets ne sont plus dans le code. Il prend aussi en charge la journalisation : vous pouvez surveiller comment et quand les clés et les secrets sont consultés et détecter les tentatives non autorisées."
  options:
    b: { en: "Giving RDP access to virtual machines that have no public IP address is the role of Azure Bastion.", fr: "Donner un accès RDP à des machines virtuelles sans adresse IP publique est le rôle d'Azure Bastion." }
    c: { en: "Filtering traffic with rules evaluated by priority describes a network security group.", fr: "Filtrer le trafic avec des règles évaluées par priorité décrit un groupe de sécurité réseau." }
    e: { en: "Assessing configurations and computing a secure score is done by Microsoft Defender for Cloud.", fr: "Évaluer les configurations et calculer un score de sécurité est le rôle de Microsoft Defender pour le cloud." }
references:
  - title: Describe Azure Key Vault
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/8-describe-ways-azure-encrypts-data
