id: sc900-3a-ddos-attack-types-match
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the type of attack that it describes.

    To answer, drag the appropriate type of attack to each description. Each type of attack may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description au type d'attaque qu'elle décrit.

    Pour répondre, faites glisser le type d'attaque approprié vers chaque description. Chaque type d'attaque peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vol, text: { en: "Volumetric attack", fr: "Attaque volumétrique" } }
    - { id: proto, text: { en: "Protocol attack", fr: "Attaque de protocole" } }
    - { id: res, text: { en: "Resource (application) layer attack", fr: "Attaque de la couche ressource (application)" } }
    - { id: spray, text: { en: "Password spray attack", fr: "Attaque par pulvérisation de mots de passe" } }
    - { id: phish, text: { en: "Phishing attack", fr: "Attaque par hameçonnage" } }
  targets:
    - id: t1
      text:
        en: "Exhausts the resources of a server with false requests that exploit weaknesses of layer 3 and layer 4, for example a SYN flood"
        fr: "Épuise les ressources d'un serveur par de fausses requêtes qui exploitent des faiblesses des couches 3 et 4, par exemple une inondation SYN"
    - id: t2
      text:
        en: "Targets the packets of a website to disrupt the transmission of data between hosts, for example an HTTP flood"
        fr: "Vise les paquets d'un site web pour perturber la transmission des données entre hôtes, par exemple une inondation HTTP"
    - id: t3
      text:
        en: "Floods the network with seemingly legitimate traffic until the available bandwidth is saturated, for example a UDP flood"
        fr: "Inonde le réseau d'un trafic en apparence légitime jusqu'à saturer la bande passante disponible, par exemple une inondation UDP"
answer:
  mapping: { t1: proto, t2: res, t3: vol }
explanation:
  correct:
    en: "The three most frequent types of DDoS attack are volumetric attacks, which overwhelm the bandwidth with a large volume of traffic; protocol attacks, which exhaust server resources by exploiting weaknesses in layer 3 and layer 4 protocols; and resource (application) layer attacks, which target web application packets. Azure DDoS Protection mitigates the first two, and a web application firewall handles the third."
    fr: "Les trois types d'attaques DDoS les plus fréquents sont les attaques volumétriques, qui submergent la bande passante par un grand volume de trafic ; les attaques de protocole, qui épuisent les ressources des serveurs en exploitant des faiblesses des protocoles des couches 3 et 4 ; et les attaques de la couche ressource (application), qui visent les paquets des applications web. Azure DDoS Protection atténue les deux premières, et un pare-feu d'applications web traite la troisième."
  options:
    spray:
      en: "A password spray attack tries a few common passwords against many accounts; it is an identity attack, not a denial of service."
      fr: "Une attaque par pulvérisation de mots de passe essaie quelques mots de passe courants sur de nombreux comptes ; c'est une attaque d'identité, pas un déni de service."
    phish:
      en: "A phishing attack tricks a person into revealing information; it doesn't saturate a network or a server."
      fr: "Une attaque par hameçonnage pousse une personne à révéler des informations ; elle ne sature ni un réseau ni un serveur."
references:
  - title: Describe Azure DDoS protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection
  - title: Types of attacks Azure DDoS Protection mitigates
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/types-of-attacks
