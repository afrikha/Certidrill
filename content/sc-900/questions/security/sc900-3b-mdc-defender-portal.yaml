id: sc900-3b-mdc-defender-portal
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Microsoft Defender for Cloud is integrated into the Microsoft Defender portal.

    What does this integration bring to security teams?
  fr: |
    Microsoft Defender pour le cloud est intégré au portail Microsoft Defender.

    Qu'apporte cette intégration aux équipes de sécurité ?
body:
  options:
    - id: a
      text: { en: "The compliance score of Compliance Manager is computed from cloud resources.", fr: "Le score de conformité du Gestionnaire de conformité est calculé à partir des ressources cloud." }
    - id: b
      text: { en: "They see and act on threats across cloud, hybrid and code environments in one place.", fr: "Elles voient et traitent au même endroit les menaces des environnements cloud, hybrides et de code." }
    - id: c
      text: { en: "Every security recommendation is remediated automatically without any review.", fr: "Chaque recommandation de sécurité est corrigée automatiquement sans aucune vérification." }
    - id: d
      text: { en: "The Defender plans become free for the subscriptions shown in the portal.", fr: "Les plans Defender deviennent gratuits pour les abonnements affichés dans le portail." }
answer: { optionId: b }
explanation:
  correct:
    en: "Threat protection was already part of the Defender portal; the integration of Defender for Cloud adds posture management to it. Security teams therefore see and act on threats across cloud, hybrid and code environments from one place, without switching between tools and portals."
    fr: "La protection contre les menaces faisait déjà partie du portail Defender ; l'intégration de Defender pour le cloud y ajoute la gestion de la posture. Les équipes de sécurité voient et traitent donc au même endroit les menaces des environnements cloud, hybrides et de code, sans passer d'un outil ou d'un portail à l'autre."
  options:
    a:
      en: "The compliance score belongs to Compliance Manager in the Microsoft Purview portal and measures regulatory improvement actions."
      fr: "Le score de conformité appartient au Gestionnaire de conformité, dans le portail Microsoft Purview, et mesure les actions d'amélioration réglementaires."
    c:
      en: "Recommendations still have to be remediated; the portal integration only unifies where the teams work."
      fr: "Les recommandations doivent toujours être corrigées ; l'intégration au portail ne fait qu'unifier l'endroit où les équipes travaillent."
    d:
      en: "The portal in which you work has no effect on pricing: the Defender plans remain paid plans."
      fr: "Le portail dans lequel vous travaillez n'a aucun effet sur la tarification : les plans Defender restent payants."
references:
  - title: Describe Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
