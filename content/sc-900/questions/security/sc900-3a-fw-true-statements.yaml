id: sc900-3a-fw-true-statements
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about Azure Firewall are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies à propos du Pare-feu Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "It must be deployed in every virtual network whose traffic it filters."
        fr: "Il doit être déployé dans chaque réseau virtuel dont il filtre le trafic."
    - id: b
      text:
        en: "It scales to accommodate changing traffic flows."
        fr: "Il s'adapte à l'évolution des flux de trafic par une mise à l'échelle."
    - id: c
      text:
        en: "It is deployed with Azure Application Gateway or Azure Front Door."
        fr: "Il se déploie avec Azure Application Gateway ou Azure Front Door."
    - id: d
      text:
        en: "It provides RDP and SSH connectivity to virtual machines from the Azure portal."
        fr: "Il fournit une connectivité RDP et SSH aux machines virtuelles depuis le portail Azure."
    - id: e
      text:
        en: "It can enforce rules on both inbound and outbound traffic."
        fr: "Il peut appliquer des règles au trafic entrant comme au trafic sortant."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Azure Firewall scales with the traffic, so that you don't need to budget for peak traffic. Its network and application rules are created and enforced for inbound and outbound traffic, based on IP addresses, ports, protocols and fully qualified domain names."
    fr: "Le Pare-feu Azure se met à l'échelle avec le trafic : il n'est pas nécessaire de prévoir un budget pour les pics. Ses règles de réseau et d'application sont créées et appliquées pour le trafic entrant et sortant, selon les adresses IP, les ports, les protocoles et les noms de domaine complets."
  options:
    a:
      en: "Azure Firewall is typically deployed in one centralized virtual network, and the other virtual networks route their traffic through it."
      fr: "Le Pare-feu Azure se déploie en général dans un seul réseau virtuel centralisé, et les autres réseaux virtuels acheminent leur trafic par lui."
    c:
      en: "This describes Azure Web Application Firewall, which is deployed with services such as Azure Application Gateway or Azure Front Door."
      fr: "Cela décrit Azure Web Application Firewall, qui se déploie avec des services comme Azure Application Gateway ou Azure Front Door."
    d:
      en: "This describes Azure Bastion, which gives RDP and SSH access to virtual machines without exposing them to the internet."
      fr: "Cela décrit Azure Bastion, qui donne un accès RDP et SSH aux machines virtuelles sans les exposer à internet."
references:
  - title: Describe Azure Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall
