id: sc900-3d-mdi-data-response-yn
objective: "3.4.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Defender for Identity, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Defender pour Identity, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "From the Microsoft Defender portal, an analyst can disable a compromised user account in on-premises Active Directory."
        fr: "Depuis le portail Microsoft Defender, un analyste peut désactiver un compte d'utilisateur compromis dans Active Directory local."
    - id: s2
      text:
        en: "The Defender for Identity sensor forwards a full copy of the network traffic of each domain controller to the cloud service."
        fr: "Le capteur de Defender pour Identity transmet au service cloud une copie intégrale du trafic réseau de chaque contrôleur de domaine."
    - id: s3
      text:
        en: "Microsoft Defender for Identity compares the activity of each user with a behavioral baseline to identify anomalies."
        fr: "Microsoft Defender pour Identity compare l'activité de chaque utilisateur à une base de référence de son comportement pour repérer les anomalies."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Defender for Identity offers remediation actions that act directly on on-premises identities, such as disabling the user in Active Directory or resetting the password. The sensor parses the event logs and the network traffic locally and sends only the parsed information to the cloud service. The service monitors activity, permissions and group membership to learn a baseline for each user, then flags what departs from it."
    fr: "Defender pour Identity propose des actions de correction qui agissent directement sur les identités locales, comme la désactivation de l'utilisateur dans Active Directory ou la réinitialisation du mot de passe. Le capteur analyse localement les journaux d'événements et le trafic réseau et n'envoie au service cloud que les informations analysées. Le service surveille l'activité, les autorisations et l'appartenance aux groupes pour établir une base de référence par utilisateur, puis signale ce qui s'en écarte."
references:
  - title: Describe Microsoft Defender for Identity
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity
  - title: Microsoft Defender for Identity overview
    url: https://learn.microsoft.com/en-us/defender-for-identity/what-is
