id: sc900-3c-sentinel-basics-yn
objective: "3.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Sentinel, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Sentinel, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Sentinel can collect security data from clouds other than Azure, such as AWS and GCP."
        fr: "Microsoft Sentinel peut collecter les données de sécurité de clouds autres qu'Azure, comme AWS et GCP."
    - id: s2
      text:
        en: "Analytics rules in Microsoft Sentinel generate alerts and group related alerts into incidents."
        fr: "Les règles d'analyse de Microsoft Sentinel émettent des alertes et regroupent les alertes liées en incidents."
    - id: s3
      text:
        en: "To use Microsoft Sentinel, an organization installs it on servers in its own datacenter."
        fr: "Pour utiliser Microsoft Sentinel, une organisation l'installe sur des serveurs de son propre centre de données."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Microsoft Sentinel collects and correlates signals from users, devices, applications and infrastructure on-premises, in Azure and in other clouds such as AWS and GCP, through data connectors. Its analytics rules query the collected data, raise alerts and group related alerts into incidents. Sentinel is a cloud-native service: there is no server to install."
    fr: "Microsoft Sentinel collecte et corrèle les signaux des utilisateurs, des appareils, des applications et de l'infrastructure, en local, dans Azure et dans d'autres clouds comme AWS et GCP, grâce aux connecteurs de données. Ses règles d'analyse interrogent les données collectées, émettent des alertes et regroupent les alertes liées en incidents. Sentinel est un service natif cloud : il n'y a aucun serveur à installer."
references:
  - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management
