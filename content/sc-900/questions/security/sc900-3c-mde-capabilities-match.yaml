id: sc900-3c-mde-capabilities-match
objective: "3.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each Microsoft Defender for Endpoint capability to its description.

    To answer, drag the appropriate capability to each description. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque fonctionnalité de Microsoft Defender pour point de terminaison à sa description.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque description. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: asr, text: { en: "Attack surface reduction", fr: "Réduction de la surface d'attaque" } }
    - { id: ngp, text: { en: "Next-generation protection", fr: "Protection de nouvelle génération" } }
    - { id: edr, text: { en: "Endpoint detection and response", fr: "Détection et réponse des points de terminaison (EDR)" } }
    - { id: air, text: { en: "Automated investigation and remediation", fr: "Investigation et correction automatisées" } }
    - { id: score, text: { en: "Microsoft Secure Score for Devices", fr: "Score de sécurité Microsoft pour les appareils" } }
  targets:
    - id: t1
      text: { en: "Examines alerts with inspection algorithms and takes immediate action to resolve breaches, which reduces the volume of alerts", fr: "Examine les alertes avec des algorithmes d'inspection et agit immédiatement pour résoudre les violations, ce qui réduit le volume des alertes" }
    - id: t2
      text: { en: "Is the first layer of defense: ensures that configuration settings are properly set and that exploit mitigation techniques are applied", fr: "Constitue la première couche de défense : veille à ce que les paramètres de configuration soient correctement définis et que les techniques d'atténuation des exploits soient appliquées" }
    - id: t3
      text: { en: "Provides near real-time detections of advanced attacks and lets analysts prioritize alerts and take response actions", fr: "Fournit des détections en temps quasi réel des attaques avancées et permet aux analystes de hiérarchiser les alertes et de lancer des actions de réponse" }
    - id: t4
      text: { en: "Includes Microsoft Defender Antivirus with behavior-based, real-time and cloud-delivered protection", fr: "Comprend Microsoft Defender Antivirus avec une protection comportementale, en temps réel et assurée par le cloud" }
answer:
  mapping: { t1: air, t2: asr, t3: edr, t4: ngp }
explanation:
  correct:
    en: "Automated investigation and remediation examines alerts by itself and resolves breaches, so that analysts handle fewer alerts. Attack surface reduction hardens the device before any attack: it is the first layer of defense. Endpoint detection and response detects advanced attacks in near real time and gives analysts the means to respond. Next-generation protection is the antivirus layer, built on Microsoft Defender Antivirus and cloud-delivered protection."
    fr: "L'investigation et la correction automatisées examinent les alertes par elles-mêmes et résolvent les violations, de sorte que les analystes traitent moins d'alertes. La réduction de la surface d'attaque renforce l'appareil avant toute attaque : c'est la première couche de défense. La détection et la réponse des points de terminaison détectent les attaques avancées en temps quasi réel et donnent aux analystes les moyens de répondre. La protection de nouvelle génération est la couche antivirus, fondée sur Microsoft Defender Antivirus et la protection assurée par le cloud."
  options:
    score:
      en: "Microsoft Secure Score for Devices assesses the security state of the devices and recommends improvements; it neither detects nor blocks threats."
      fr: "Le Score de sécurité Microsoft pour les appareils évalue l'état de sécurité des appareils et recommande des améliorations ; il ne détecte pas et ne bloque pas les menaces."
references:
  - title: Describe Microsoft Defender for Endpoint
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/4-describe-defender-endpoint
