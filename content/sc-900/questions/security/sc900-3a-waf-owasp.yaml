id: sc900-3a-waf-owasp
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Azure Web Application Firewall defends web applications against a set of well-known threats, such as SQL injection and cross-site scripting.

    Which reference defines these threats?
  fr: |
    Azure Web Application Firewall défend les applications web contre un ensemble de menaces bien connues, comme l'injection SQL et le scripting inter-site.

    Quelle référence définit ces menaces ?
body:
  options:
    - id: a
      text: { en: "The OWASP core rule set", fr: "L'ensemble de règles de base OWASP" }
    - id: b
      text: { en: "The MITRE ATT&CK framework", fr: "Le framework MITRE ATT&CK" }
    - id: c
      text: { en: "The Microsoft cloud security benchmark", fr: "Le benchmark de sécurité cloud Microsoft" }
    - id: d
      text: { en: "The NIST Cybersecurity Framework", fr: "Le NIST Cybersecurity Framework" }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure Web Application Firewall defends against the threats defined in the core rule set of the Open Web Application Security Project (OWASP). This set of generic attack detection rules is designed as a baseline for any web application firewall."
    fr: "Azure Web Application Firewall défend contre les menaces définies dans l'ensemble de règles de base de l'Open Web Application Security Project (OWASP). Cet ensemble de règles génériques de détection d'attaques est conçu comme une base de référence pour tout pare-feu d'applications web."
  options:
    b:
      en: "MITRE ATT&CK is a knowledge base of the tactics and techniques of attackers, used for threat detection and hunting; it isn't a rule set for a web application firewall."
      fr: "MITRE ATT&CK est une base de connaissances des tactiques et techniques des attaquants, utilisée pour la détection et la chasse des menaces ; ce n'est pas un ensemble de règles pour un pare-feu d'applications web."
    c:
      en: "The Microsoft cloud security benchmark is a set of security best practices and recommendations for cloud resources, used by Microsoft Defender for Cloud."
      fr: "Le benchmark de sécurité cloud Microsoft est un ensemble de bonnes pratiques et de recommandations de sécurité pour les ressources cloud, utilisé par Microsoft Defender pour le cloud."
    d:
      en: "The NIST Cybersecurity Framework guides the management of cybersecurity risk in an organization; it doesn't define detection rules for web attacks."
      fr: "Le NIST Cybersecurity Framework guide la gestion du risque de cybersécurité d'une organisation ; il ne définit pas de règles de détection des attaques web."
references:
  - title: Describe Web Application Firewall
    url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/4-describe-web-application-firewall
  - title: What Is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
