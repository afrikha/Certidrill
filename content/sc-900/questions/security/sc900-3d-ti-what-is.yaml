id: sc900-3d-ti-what-is
objective: "3.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before they can assess a suspicious IP address or domain, the analysts of Contoso collect data by hand from separate sources such as DNS records, WHOIS information and malware databases. They want this data aggregated and enriched in a single interface of the Microsoft Defender portal.

    What should the analysts use?
  fr: |
    Avant de pouvoir évaluer une adresse IP ou un domaine suspect, les analystes de Contoso collectent à la main des données dans des sources distinctes comme les enregistrements DNS, les informations WHOIS et les bases de données de programmes malveillants. Ils veulent que ces données soient agrégées et enrichies dans une interface unique du portail Microsoft Defender.

    Que doivent utiliser les analystes ?
body:
  options:
    - id: a
      text: "Microsoft Threat Intelligence"
    - id: b
      text: { en: "Microsoft Secure Score", fr: "Degré de sécurisation Microsoft (Microsoft Secure Score)" }
    - id: c
      text: { en: "Microsoft Defender Vulnerability Management", fr: "Gestion des vulnérabilités Microsoft Defender" }
    - id: d
      text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" }
answer: { optionId: a }
explanation:
  correct:
    en: "Microsoft Threat Intelligence aggregates and enriches threat data from many sources so that analysts can concentrate on understanding the adversary instead of gathering raw data. It supports triage, incident response, threat hunting and the analysis of attacker infrastructure, and it is reached under Threat intelligence in the Microsoft Defender portal."
    fr: "Microsoft Threat Intelligence agrège et enrichit des données sur les menaces issues de nombreuses sources, pour que les analystes se concentrent sur la compréhension de l'adversaire plutôt que sur la collecte de données brutes. Il sert au triage, à la réponse aux incidents, au repérage des menaces et à l'analyse de l'infrastructure des attaquants, et il est accessible sous Threat Intelligence dans le portail Microsoft Defender."
  options:
    b:
      en: "Microsoft Secure Score measures the security posture of the organization and recommends actions; it does not enrich suspicious indicators."
      fr: "Le Degré de sécurisation Microsoft mesure la posture de sécurité de l'organisation et recommande des actions ; il n'enrichit pas les indicateurs suspects."
    c:
      en: "Defender Vulnerability Management finds and prioritizes the weaknesses of your own devices; it is not a source of data about external IP addresses and domains."
      fr: "La Gestion des vulnérabilités Microsoft Defender trouve et hiérarchise les faiblesses de vos propres appareils ; ce n'est pas une source de données sur les adresses IP et les domaines externes."
    d:
      en: "Defender for Cloud Apps protects the use of SaaS applications; it does not aggregate threat data such as DNS and WHOIS records."
      fr: "Defender pour les applications cloud protège l'utilisation des applications SaaS ; il n'agrège pas de données sur les menaces comme les enregistrements DNS et WHOIS."
references:
  - title: Describe Microsoft Defender Threat Intelligence
    url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6b-describe-defender-threat-intelligence
  - title: Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/unified-secops/overview-defender-portal
