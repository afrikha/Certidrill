id: sc900-4b-audit-standard-retention
objective: "4.4.3"
type: single
difficulty: 1
shuffle: false
status: draft
stem:
  en: |
    Litware uses Audit (Standard) in Microsoft Purview and has no Audit (Premium) license.

    For how long are the audit records of Litware retained by default?
  fr: |
    Litware utilise Audit (Standard) dans Microsoft Purview et n'a aucune licence Audit (Premium).

    Pendant combien de temps les enregistrements d'audit de Litware sont-ils conservés par défaut ?
body:
  options:
    - { id: a, text: { en: "90 days", fr: "90 jours" } }
    - { id: b, text: { en: "180 days", fr: "180 jours" } }
    - { id: c, text: { en: "One year", fr: "Un an" } }
    - { id: d, text: { en: "10 years", fr: "10 ans" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Audit (Standard) retains audit records for 180 days, which lets an organization search the activities of roughly the past six months."
    fr: "Audit (Standard) conserve les enregistrements d'audit pendant 180 jours, ce qui permet à une organisation de rechercher les activités des six derniers mois environ."
  options:
    a:
      en: "90 days was the former default of Audit (Standard); it applies only to records generated before October 17, 2023."
      fr: "90 jours était l'ancienne valeur par défaut d'Audit (Standard) ; elle ne s'applique qu'aux enregistrements générés avant le 17 octobre 2023."
    c:
      en: "One year is the default of Audit (Premium) for Microsoft Entra ID, Exchange, OneDrive and SharePoint records."
      fr: "Un an est la valeur par défaut d'Audit (Premium) pour les enregistrements Microsoft Entra ID, Exchange, OneDrive et SharePoint."
    d:
      en: "Retention for up to 10 years requires Audit (Premium), an audit log retention policy and an add-on license."
      fr: "Une rétention allant jusqu'à 10 ans exige Audit (Premium), une stratégie de rétention des journaux d'audit et une licence de module complémentaire."
references:
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
  - title: Describe audit in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/2-describe-audit
