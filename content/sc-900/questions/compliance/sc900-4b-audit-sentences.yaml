id: sc900-4b-audit-sentences
objective: "4.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Purview Audit, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur Microsoft Purview Audit, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When an audited activity occurs, an audit record is stored in [[log]].

      The results of a search made with the audit log search tool can be exported to [[fmt]].

      To import audit data into a security information and event management (SIEM) solution, an organization can use [[api]].
    fr: |
      Quand une activité auditée se produit, un enregistrement d'audit est stocké dans [[log]].

      Les résultats d'une recherche effectuée avec l'outil de recherche dans le journal d'audit peuvent être exportés vers [[fmt]].

      Pour importer des données d'audit dans une solution de gestion des informations et des événements de sécurité (SIEM), une organisation peut utiliser [[api]].
  slots:
    - id: log
      options:
        - { id: review, text: { en: "a review set", fr: "un ensemble de révision" } }
        - { id: unified, text: { en: "the unified audit log", fr: "le journal d'audit unifié" } }
        - { id: explorer, text: { en: "Content explorer", fr: "l'Explorateur de contenu" } }
    - id: fmt
      options:
        - { id: csv, text: { en: "a CSV file", fr: "un fichier CSV" } }
        - { id: plan, text: { en: "a file plan", fr: "un plan de fichiers" } }
        - { id: case, text: { en: "an eDiscovery case", fr: "un cas eDiscovery" } }
    - id: api
      options:
        - { id: sdk, text: { en: "the Microsoft Information Protection SDK", fr: "le SDK Microsoft Information Protection" } }
        - { id: stp, text: { en: "the Service Trust Portal", fr: "le Portail d'approbation des services" } }
        - { id: mgmt, text: { en: "the Office 365 Management Activity API", fr: "l'API Activité de gestion Office 365" } }
answer:
  values: { log: unified, fmt: csv, api: mgmt }
explanation:
  correct:
    en: "Audited operations of users and administrators are captured, recorded and retained in the unified audit log of the organization. The audit log search tool of the Microsoft Purview portal searches it by activity, user and date range, and its results can be exported to a CSV file for analysis in Excel. The Office 365 Management Activity API gives programmatic access to the audit records, for example to feed a SIEM solution."
    fr: "Les opérations auditées des utilisateurs et des administrateurs sont capturées, enregistrées et conservées dans le journal d'audit unifié de l'organisation. L'outil de recherche dans le journal d'audit du portail Microsoft Purview y recherche par activité, utilisateur et plage de dates, et ses résultats peuvent être exportés dans un fichier CSV pour être analysés dans Excel. L'API Activité de gestion Office 365 donne un accès par programmation aux enregistrements d'audit, par exemple pour alimenter une solution SIEM."
references:
  - title: Describe audit in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/2-describe-audit
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
