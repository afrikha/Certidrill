id: sc900-4b-ret-configurations-hotarea
objective: "4.3.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has the Microsoft Purview configurations shown in the following table.

    Answer each prompt by selecting the configuration that produces the described result.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose des configurations Microsoft Purview présentées dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la configuration qui produit le résultat décrit.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "Without any action from users, every document of every SharePoint site stays preserved for seven years, even if its author deletes it."
        fr: "Sans aucune action des utilisateurs, chaque document de chaque site SharePoint reste préservé pendant sept ans, même si son auteur le supprime."
    - id: p2
      text:
        en: "In a document library of a SharePoint site, a user selects a label that sets how long one particular document is kept."
        fr: "Dans une bibliothèque de documents d'un site SharePoint, un utilisateur sélectionne une étiquette qui fixe la durée de conservation d'un document précis."
  grid:
    header:
      - { en: "Name", fr: "Nom" }
      - Type
      - { en: "Applies to", fr: "S'applique à" }
      - { en: "Setting", fr: "Paramètre" }
    rows:
      - - { text: Config1, area: c1 }
        - { text: { en: "Retention label policy", fr: "Stratégie d'étiquette de rétention" } }
        - { text: { en: "All SharePoint sites", fr: "Tous les sites SharePoint" } }
        - { text: { en: "Publishes the retention label Contract, which retains items for seven years", fr: "Publie l'étiquette de rétention Contract, qui conserve les éléments pendant sept ans" } }
      - - { text: Config2, area: c2 }
        - { text: { en: "Sensitivity label policy", fr: "Stratégie d'étiquetage de confidentialité" } }
        - { text: { en: "All users", fr: "Tous les utilisateurs" } }
        - { text: { en: "Publishes the sensitivity label Confidential, which encrypts items", fr: "Publie l'étiquette de confidentialité Confidential, qui chiffre les éléments" } }
      - - { text: Config3, area: c3 }
        - { text: { en: "Retention policy", fr: "Stratégie de rétention" } }
        - { text: { en: "All SharePoint sites", fr: "Tous les sites SharePoint" } }
        - { text: { en: "Retains items for seven years", fr: "Conserve les éléments pendant sept ans" } }
      - - { text: Config4, area: c4 }
        - { text: { en: "Retention policy", fr: "Stratégie de rétention" } }
        - { text: { en: "Teams channel messages", fr: "Messages de canal Teams" } }
        - { text: { en: "Deletes items after one year", fr: "Supprime les éléments au bout d'un an" } }
      - - { text: Config5, area: c5 }
        - { text: { en: "Data loss prevention (DLP) policy", fr: "Stratégie de protection contre la perte de données (DLP)" } }
        - { text: { en: "All SharePoint sites", fr: "Tous les sites SharePoint" } }
        - { text: { en: "Blocks the external sharing of items that contain credit card numbers", fr: "Bloque le partage externe des éléments qui contiennent des numéros de carte de crédit" } }
answer:
  values: { p1: c3, p2: c1 }
explanation:
  correct:
    en: "A retention policy applies the same settings to all the content of its locations, with no interaction from users: Config3 preserves every document of the SharePoint sites for seven years, and a deleted document is kept as a copy in a secure location. A retention label policy publishes labels that users then apply to individual items: with Config1, a user applies the Contract label to the chosen document. Config2 publishes a label that protects content but has no retention period, Config4 concerns Teams messages only, and Config5 controls sharing, not retention."
    fr: "Une stratégie de rétention applique les mêmes paramètres à tout le contenu de ses emplacements, sans interaction des utilisateurs : Config3 préserve pendant sept ans chaque document des sites SharePoint, et un document supprimé est gardé sous forme de copie dans un emplacement sécurisé. Une stratégie d'étiquette de rétention publie des étiquettes que les utilisateurs appliquent ensuite à des éléments précis : avec Config1, un utilisateur applique l'étiquette Contract au document choisi. Config2 publie une étiquette qui protège le contenu mais n'a pas de période de rétention, Config4 ne concerne que les messages Teams, et Config5 contrôle le partage, pas la rétention."
references:
  - title: Learn about retention policies and retention labels
    url: https://learn.microsoft.com/en-us/purview/retention
  - title: Describe Data Lifecycle Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/6-describe-data-lifecycle-management
