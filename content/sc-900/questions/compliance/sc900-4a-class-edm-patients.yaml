id: sc900-4a-class-edm-patients
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hospital of the Northwind group wants to detect the record numbers of its actual patients in emails and documents. The detection must rely on the values stored in the patient database, so that other numbers of the same format are not matched.

    Which classifier should the hospital use?
  fr: |
    Un hôpital du groupe Northwind veut détecter les numéros de dossier de ses patients réels dans les e-mails et les documents. La détection doit s'appuyer sur les valeurs stockées dans la base de données des patients, afin que d'autres numéros de même format ne soient pas reconnus.

    Quel classifieur l'hôpital doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "A built-in sensitive information type", fr: "Un type d'informations sensibles intégré" }
    - id: b
      text: { en: "A pre-trained classifier", fr: "Un classifieur préentraîné" }
    - id: c
      text: { en: "An exact data match (EDM) sensitive information type", fr: "Un type d'informations sensibles à correspondance exacte des données (EDM)" }
    - id: d
      text: { en: "A named entity sensitive information type", fr: "Un type d'informations sensibles d'entité nommée" }
answer: { optionId: c }
explanation:
  correct:
    en: "An exact data match (EDM) sensitive information type refers to exact values in a database of sensitive information, instead of a generic pattern. It detects only the values that really exist in the source table, such as the record numbers of actual patients, which produces fewer false positives."
    fr: "Un type d'informations sensibles à correspondance exacte des données (EDM) se réfère à des valeurs exactes d'une base d'informations sensibles, au lieu d'un modèle générique. Il ne détecte que les valeurs qui existent réellement dans la table source, comme les numéros de dossier des patients réels, ce qui produit moins de faux positifs."
  options:
    a:
      en: "A built-in sensitive information type matches a generic pattern defined by Microsoft; it would match any number of the right format."
      fr: "Un type d'informations sensibles intégré reconnaît un modèle générique défini par Microsoft ; il reconnaîtrait tout numéro au bon format."
    b:
      en: "A pre-trained classifier recognizes a category of content, such as resumes or financial documents, not specific values."
      fr: "Un classifieur préentraîné reconnaît une catégorie de contenu, comme des CV ou des documents financiers, pas des valeurs précises."
    d:
      en: "Named entity sensitive information types detect person names, physical addresses and medical terms, not the values of a customer database."
      fr: "Les types d'informations sensibles d'entité nommée détectent des noms de personnes, des adresses postales et des termes médicaux, pas les valeurs d'une base de données du client."
references:
  - title: Learn about exact data match based sensitive information types
    url: https://learn.microsoft.com/en-us/purview/sit-learn-about-exact-data-match-based-sits
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
