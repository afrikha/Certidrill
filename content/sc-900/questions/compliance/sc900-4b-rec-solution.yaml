id: sc900-4b-rec-solution
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders signs contracts that have legal importance. For these contracts, the company must restrict the actions that users can perform, log the activities on each contract, and keep proof when a contract is deleted at the end of its retention period.

    Which Microsoft Purview solution should Northwind Traders use?
  fr: |
    Northwind Traders signe des contrats qui ont une importance juridique. Pour ces contrats, l'entreprise doit restreindre les actions que les utilisateurs peuvent effectuer, journaliser les activités sur chaque contrat et garder une preuve quand un contrat est supprimé à la fin de sa période de rétention.

    Quelle solution Microsoft Purview Northwind Traders doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Data Loss Prevention", fr: "La protection contre la perte de données (Data Loss Prevention)" } }
    - { id: b, text: { en: "Insider Risk Management", fr: "La gestion des risques internes (Insider Risk Management)" } }
    - { id: c, text: { en: "Records Management", fr: "La gestion des enregistrements (Records Management)" } }
    - { id: d, text: { en: "eDiscovery", fr: "eDiscovery" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft Purview Records Management manages regulatory, legal and business-critical records. When an item is declared a record, restrictions block certain actions on it, activities on it are logged, and proof of disposition is kept when it is deleted at the end of its retention period."
    fr: "La gestion des enregistrements Microsoft Purview gère les enregistrements réglementaires, juridiques et critiques pour l'activité. Quand un élément est déclaré comme enregistrement, des restrictions bloquent certaines actions, les activités sur l'élément sont journalisées et une preuve de destruction est conservée quand il est supprimé à la fin de sa période de rétention."
  options:
    a:
      en: "Data Loss Prevention stops sensitive items from being shared inappropriately; it doesn't manage the lifecycle of records."
      fr: "La protection contre la perte de données empêche le partage inapproprié d'éléments sensibles ; elle ne gère pas le cycle de vie des enregistrements."
    b:
      en: "Insider Risk Management detects and investigates risky activities of users."
      fr: "La gestion des risques internes détecte et examine les activités à risque des utilisateurs."
    d:
      en: "eDiscovery finds, preserves and exports content as evidence for a legal case; it doesn't declare records or keep proof of their disposition."
      fr: "eDiscovery recherche, préserve et exporte du contenu comme preuve pour une affaire juridique ; il ne déclare pas d'enregistrements et ne garde pas de preuve de leur destruction."
references:
  - title: Describe Microsoft Purview Records Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/7-describe-records-management
  - title: Learn about records management
    url: https://learn.microsoft.com/en-us/purview/records-management
