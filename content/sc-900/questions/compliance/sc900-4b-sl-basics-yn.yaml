id: sc900-4b-sl-basics-yn
objective: "4.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about sensitivity labels in Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les étiquettes de confidentialité de Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A document can have several sensitivity labels of the organization applied at the same time."
        fr: "Un document peut avoir plusieurs étiquettes de confidentialité de l'organisation appliquées en même temps."
    - id: s2
      text:
        en: "A sensitivity label stays with a document that is sent by email to a recipient outside the organization."
        fr: "Une étiquette de confidentialité reste attachée à un document envoyé par e-mail à un destinataire extérieur à l'organisation."
    - id: s3
      text:
        en: "A sensitivity label can be used only to classify content, without applying any protection."
        fr: "Une étiquette de confidentialité peut servir uniquement à classifier du contenu, sans appliquer aucune protection."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "An item that supports sensitivity labels has a single label of the organization at a time. The label is persistent: it is stored in the metadata of the file or email and travels with the content wherever it goes. Protection is optional: a label can simply tag content so that it can be reported on, and protection settings such as encryption can be added if needed."
    fr: "Un élément qui prend en charge les étiquettes de confidentialité n'a qu'une seule étiquette de l'organisation à la fois. L'étiquette est persistante : elle est stockée dans les métadonnées du fichier ou de l'e-mail et suit le contenu partout où il va. La protection est facultative : une étiquette peut simplement marquer le contenu pour les rapports, et des paramètres de protection comme le chiffrement peuvent être ajoutés si nécessaire."
references:
  - title: Describe sensitivity labels and policies in Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/3-describe-sensitivity-labels-policies
  - title: Learn about sensitivity labels
    url: https://learn.microsoft.com/en-us/purview/sensitivity-labels
