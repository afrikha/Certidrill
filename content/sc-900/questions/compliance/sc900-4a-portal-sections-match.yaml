id: sc900-4a-portal-sections-match
objective: "4.2.1"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    The Microsoft Purview portal groups its solutions into sections. Match each solution to its section.

    To answer, drag the appropriate section to each solution. Each section may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le portail Microsoft Purview regroupe ses solutions en sections. Associez chaque solution à sa section.

    Pour répondre, faites glisser la section appropriée vers chaque solution. Chaque section peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: sec, text: { en: "Data Security", fr: "Sécurité des données (Data Security)" } }
    - { id: gov, text: { en: "Data Governance", fr: "Gouvernance des données (Data Governance)" } }
    - { id: risk, text: { en: "Risk & Compliance", fr: "Risque et conformité (Risk & Compliance)" } }
  targets:
    - id: t1
      text: { en: "Data Loss Prevention", fr: "Protection contre la perte de données (Data Loss Prevention)" }
    - id: t2
      text: { en: "eDiscovery", fr: "eDiscovery" }
    - id: t3
      text: { en: "Unified Catalog", fr: "Unified Catalog" }
    - id: t4
      text: { en: "Insider Risk Management", fr: "Gestion des risques internes (Insider Risk Management)" }
answer:
  mapping: { t1: sec, t2: risk, t3: gov, t4: sec }
explanation:
  correct:
    en: "The data security solutions protect sensitive data wherever it is used: Information Protection, Data Loss Prevention and Insider Risk Management. The risk and compliance solutions help meet legal and regulatory obligations: Compliance Manager, eDiscovery and Communication Compliance, among others. The data governance solutions, such as Unified Catalog, help discover and govern the data of the whole data estate."
    fr: "Les solutions de sécurité des données protègent les données sensibles partout où elles sont utilisées : protection des informations, protection contre la perte de données et gestion des risques internes. Les solutions de risque et conformité aident à respecter les obligations légales et réglementaires : Gestionnaire de conformité, eDiscovery et conformité des communications, entre autres. Les solutions de gouvernance des données, comme Unified Catalog, aident à découvrir et à gouverner les données de tout le patrimoine de données."
references:
  - title: Learn about the Microsoft Purview portal
    url: https://learn.microsoft.com/en-us/purview/purview-portal
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
