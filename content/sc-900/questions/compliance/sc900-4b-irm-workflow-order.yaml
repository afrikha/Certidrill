id: sc900-4b-irm-workflow-order
objective: "4.4.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys wants Microsoft Purview Insider Risk Management to handle the case of a user who copies confidential files to a personal cloud storage service.

    Which five events occur in sequence in the insider risk management workflow? To answer, move the appropriate events from the list of events to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys veut que la gestion des risques internes Microsoft Purview traite le cas d'un utilisateur qui copie des fichiers confidentiels vers un service de stockage cloud personnel.

    Quels sont les cinq événements qui se produisent, dans l'ordre, dans le flux de travail de la gestion des risques internes ? Pour répondre, déplacez les événements appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: investigate, text: { en: "An investigator examines the activity of the user in the case.", fr: "Un enquêteur examine l'activité de l'utilisateur dans le cas." } }
    - { id: tip, text: { en: "A policy tip asks the user to justify the copy of the files.", fr: "Un conseil de stratégie demande à l'utilisateur de justifier la copie des fichiers." } }
    - { id: policy, text: { en: "An administrator creates an insider risk policy from a template.", fr: "Un administrateur crée une stratégie de risque interne à partir d'un modèle." } }
    - { id: action, text: { en: "The case is resolved, for example by sending a reminder notice to the user.", fr: "Le cas est résolu, par exemple par l'envoi d'un rappel à l'utilisateur." } }
    - { id: alert, text: { en: "An alert is generated because risk indicators match the conditions of the policy.", fr: "Une alerte est générée parce que des indicateurs de risque correspondent aux conditions de la stratégie." } }
    - { id: record, text: { en: "The files are marked as regulatory records.", fr: "Les fichiers sont marqués comme enregistrements réglementaires." } }
    - { id: triage, text: { en: "A reviewer triages the alert and opens a case.", fr: "Un réviseur trie l'alerte et ouvre un cas." } }
answer:
  sequence: [ policy, alert, triage, investigate, action ]
explanation:
  correct:
    en: |
      The insider risk management workflow has five steps: policies, alerts, triage, investigate and action. A policy is created from a template and defines the risk indicators to examine. Indicators that match the policy generate an alert, a reviewer triages it and opens a case when the activity needs a deeper look, the case is investigated, and finally the reviewer acts: a reminder notice to the user, or an escalation for a legal investigation.
    fr: |
      Le flux de travail de la gestion des risques internes comporte cinq étapes : stratégies, alertes, triage, examen et action. Une stratégie est créée à partir d'un modèle et définit les indicateurs de risque à examiner. Les indicateurs qui correspondent à la stratégie génèrent une alerte, un réviseur la trie et ouvre un cas quand l'activité mérite un examen approfondi, le cas est examiné, et enfin le réviseur agit : un rappel à l'utilisateur, ou une transmission pour une investigation juridique.
  options:
    tip: { en: "A policy tip belongs to data loss prevention, which acts when the content is shared; it isn't a step of the insider risk management workflow.", fr: "Un conseil de stratégie relève de la protection contre la perte de données, qui agit au moment du partage du contenu ; ce n'est pas une étape du flux de travail de la gestion des risques internes." }
    record: { en: "Regulatory records are declared with retention labels in records management, not by insider risk management.", fr: "Les enregistrements réglementaires se déclarent avec des étiquettes de rétention dans la gestion des enregistrements, pas par la gestion des risques internes." }
references:
  - title: Describe insider risk management in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/5-describe-insider-risk-management
  - title: Learn about Insider Risk Management
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management
