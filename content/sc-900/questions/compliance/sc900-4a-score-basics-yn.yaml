id: sc900-4a-score-basics-yn
objective: "4.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the compliance score, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le score de conformité, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A compliance score of 100 percent guarantees that the organization complies with all the regulations that apply to it."
        fr: "Un score de conformité de 100 % garantit que l'organisation respecte toutes les réglementations qui s'appliquent à elle."
    - id: s2
      text:
        en: "A higher compliance score indicates that the organization completed more of the recommended improvement actions."
        fr: "Un score de conformité plus élevé indique que l'organisation a réalisé davantage d'actions d'amélioration recommandées."
    - id: s3
      text:
        en: "The overall compliance score is displayed on the dashboard of Compliance Manager."
        fr: "Le score de conformité global est affiché sur le tableau de bord du Gestionnaire de conformité."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "The compliance score measures the progress in completing recommended improvement actions: the more actions are completed, the higher the score. It is shown on the Compliance Manager dashboard. The recommendations of Compliance Manager are not a guarantee of compliance: the organization remains responsible for evaluating the effectiveness of its controls in its own regulatory environment."
    fr: "Le score de conformité mesure l'avancement dans la réalisation des actions d'amélioration recommandées : plus il y a d'actions réalisées, plus le score est élevé. Il est affiché sur le tableau de bord du Gestionnaire de conformité. Les recommandations du Gestionnaire de conformité ne sont pas une garantie de conformité : l'organisation reste responsable d'évaluer l'efficacité de ses contrôles dans son propre environnement réglementaire."
references:
  - title: Compliance Manager scoring
    url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring
