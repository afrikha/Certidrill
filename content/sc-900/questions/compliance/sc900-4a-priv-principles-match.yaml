id: sc900-4a-priv-principles-match
objective: "4.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each commitment of Microsoft to the privacy principle that it belongs to.

    To answer, drag the appropriate principle to each commitment. Each principle may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque engagement de Microsoft au principe de confidentialité dont il relève.

    Pour répondre, faites glisser le principe approprié vers chaque engagement. Chaque principe peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: control, text: { en: "You control your data", fr: "Vous contrôlez vos données" } }
    - { id: location, text: { en: "Know where your data is located", fr: "Savoir où se trouvent vos données" } }
    - { id: secured, text: { en: "Your data is secured at rest and in transit", fr: "Vos données sont sécurisées au repos et en transit" } }
    - { id: defends, text: { en: "Microsoft defends your data", fr: "Microsoft défend vos données" } }
  targets:
    - id: t1
      text: { en: "Microsoft challenges government requests for customer data where it can lawfully do so.", fr: "Microsoft conteste les demandes gouvernementales portant sur les données des clients quand la loi le lui permet." }
    - id: t2
      text: { en: "Microsoft uses the data only to provide the services that the customer has chosen.", fr: "Microsoft n'utilise les données que pour fournir les services que le client a choisis." }
    - id: t3
      text: { en: "Encryption uses two or more independent layers, so that the compromise of one layer doesn't expose the data.", fr: "Le chiffrement utilise au moins deux couches indépendantes, afin que la compromission d'une couche n'expose pas les données." }
answer:
  mapping: { t1: defends, t2: control, t3: secured }
explanation:
  correct:
    en: "Defending customer data covers government requests: Microsoft gives no government direct access, redirects requests to the customer and challenges them in court where it lawfully can. Controlling your data means that the data belongs to the customer and is used only to provide the chosen services, never for advertising. Securing data at rest and in transit relies on defense in depth, with two or more independent layers of encryption."
    fr: "Défendre les données des clients concerne les demandes gouvernementales : Microsoft ne donne d'accès direct à aucun gouvernement, redirige les demandes vers le client et les conteste en justice quand la loi le lui permet. Contrôler ses données signifie que les données appartiennent au client et ne servent qu'à fournir les services choisis, jamais à la publicité. La sécurisation des données au repos et en transit repose sur la défense en profondeur, avec au moins deux couches de chiffrement indépendantes."
  options:
    location:
      en: "This principle is about data residency: customers can determine where their data is stored."
      fr: "Ce principe porte sur la résidence des données : les clients peuvent déterminer où leurs données sont stockées."
references:
  - title: Describe Microsoft's privacy principles
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles
