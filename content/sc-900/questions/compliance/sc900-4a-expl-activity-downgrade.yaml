id: sc900-4a-expl-activity-downgrade
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank suspects that some users change the sensitivity label of documents from Confidential to Public before they share the documents.

    Which Microsoft Purview tool shows these label changes?
  fr: |
    Woodgrove Bank soupçonne certains utilisateurs de remplacer l'étiquette de confidentialité Confidentiel de documents par l'étiquette Public avant de partager ces documents.

    Quel outil de Microsoft Purview montre ces changements d'étiquette ?
body:
  options:
    - id: a
      text: { en: "Activity explorer", fr: "L'Explorateur d'activités" }
    - id: b
      text: { en: "Content explorer", fr: "L'Explorateur de contenu" }
    - id: c
      text: { en: "Compliance Manager", fr: "Le Gestionnaire de conformité" }
    - id: d
      text: { en: "Trainable classifiers", fr: "Les classifieurs entraînables" }
answer: { optionId: a }
explanation:
  correct:
    en: "Activity explorer gives a historical view of the activities on labeled content: labels applied, changed or removed, including downgrades such as a change from Confidential to Public. It helps to spot unexpected behavior and to decide whether more protection is needed."
    fr: "L'Explorateur d'activités donne une vue historique des activités sur le contenu étiqueté : étiquettes appliquées, modifiées ou supprimées, y compris les rétrogradations comme le passage de Confidentiel à Public. Il aide à repérer des comportements inattendus et à décider s'il faut davantage de protection."
  options:
    b:
      en: "Content explorer shows the current state: which items carry which label and where. It doesn't show the history of label changes."
      fr: "L'Explorateur de contenu montre l'état actuel : quels éléments portent quelle étiquette et où. Il ne montre pas l'historique des changements d'étiquette."
    c:
      en: "Compliance Manager tracks improvement actions and a compliance score, not user activities on documents."
      fr: "Le Gestionnaire de conformité suit des actions d'amélioration et un score de conformité, pas les activités des utilisateurs sur les documents."
    d:
      en: "Trainable classifiers recognize categories of content; they don't report what users do with labels."
      fr: "Les classifieurs entraînables reconnaissent des catégories de contenu ; ils ne rapportent pas ce que les utilisateurs font des étiquettes."
references:
  - title: Get started with Activity explorer
    url: https://learn.microsoft.com/en-us/purview/data-classification-activity-explorer
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
