id: sc900-4b-ret-basics-yn
objective: "4.3.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about retention in Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la rétention dans Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Retention settings can delete content after a specified period without retaining it first."
        fr: "Des paramètres de rétention peuvent supprimer du contenu après une période définie sans le conserver au préalable."
    - id: s2
      text:
        en: "An email can have several retention labels applied at the same time."
        fr: "Un e-mail peut avoir plusieurs étiquettes de rétention appliquées en même temps."
    - id: s3
      text:
        en: "A single retention policy can apply to several locations, such as Exchange mailboxes and SharePoint sites."
        fr: "Une même stratégie de rétention peut s'appliquer à plusieurs emplacements, comme des boîtes aux lettres Exchange et des sites SharePoint."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Retention settings have three possible outcomes: retain only, delete only, or retain and then delete; a delete-only setting removes content after a period without any obligation to keep it. An email or a document can have only one retention label at a time. A retention policy assigns the same settings at the level of a site or mailbox, and one policy can cover multiple locations."
    fr: "Les paramètres de rétention ont trois issues possibles : conserver uniquement, supprimer uniquement, ou conserver puis supprimer ; un paramètre de suppression uniquement retire le contenu après une période sans obligation de le garder. Un e-mail ou un document ne peut avoir qu'une seule étiquette de rétention à la fois. Une stratégie de rétention attribue les mêmes paramètres au niveau d'un site ou d'une boîte aux lettres, et une même stratégie peut couvrir plusieurs emplacements."
references:
  - title: Describe Data Lifecycle Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/6-describe-data-lifecycle-management
  - title: Learn about retention policies and retention labels
    url: https://learn.microsoft.com/en-us/purview/retention
