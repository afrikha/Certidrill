id: sc900-4b-irm-sentences
objective: "4.4.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Purview Insider Risk Management, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur la gestion des risques internes Microsoft Purview, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Insider risk policies are created from predefined [[tpl]].

      Alerts are generated automatically when [[ind]] match the conditions of a policy.

      By default, the users who appear in alerts are [[names]].
    fr: |
      Les stratégies de risque interne sont créées à partir de [[tpl]] prédéfinis.

      Des alertes sont générées automatiquement quand des [[ind]] correspondent aux conditions d'une stratégie.

      Par défaut, les utilisateurs qui apparaissent dans les alertes sont [[names]].
  slots:
    - id: tpl
      options:
        - { id: plans, text: { en: "file plans", fr: "plans de fichiers" } }
        - { id: sets, text: { en: "review sets", fr: "ensembles de révision" } }
        - { id: templates, text: { en: "templates", fr: "modèles" } }
    - id: ind
      options:
        - { id: indicators, text: { en: "risk indicators", fr: "indicateurs de risque" } }
        - { id: tips, text: { en: "policy tips", fr: "conseils de stratégie" } }
        - { id: markings, text: { en: "content markings", fr: "marquages de contenu" } }
    - id: names
      options:
        - { id: full, text: { en: "shown with their full names", fr: "affichés avec leur nom complet" } }
        - { id: pseudo, text: { en: "pseudonymized", fr: "pseudonymisés" } }
        - { id: blocked, text: { en: "blocked from signing in", fr: "empêchés de se connecter" } }
answer:
  values: { tpl: templates, ind: indicators, names: pseudo }
explanation:
  correct:
    en: "Insider risk policies are built from predefined policy templates, such as Data theft by departing users or Data leaks, and conditions that define which risk indicators are examined. When risk indicators match these conditions, alerts are generated automatically for reviewers. The solution is built with privacy by design: users are pseudonymized by default, which balances the privacy of users against the risk for the organization."
    fr: "Les stratégies de risque interne sont construites à partir de modèles de stratégie prédéfinis, comme Vol de données par des utilisateurs sortants ou Fuites de données, et de conditions qui définissent les indicateurs de risque examinés. Quand des indicateurs de risque correspondent à ces conditions, des alertes sont générées automatiquement pour les réviseurs. La solution est conçue avec la confidentialité dès la conception : les utilisateurs sont pseudonymisés par défaut, ce qui équilibre la vie privée des utilisateurs et le risque pour l'organisation."
references:
  - title: Learn about Insider Risk Management
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management
  - title: Describe insider risk management in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/5-describe-insider-risk-management
