id: sc900-4b-edisc-case
objective: "4.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The legal team of Tailspin Toys conducts two separate investigations with Microsoft Purview eDiscovery. For each investigation, the searches and the preserved content must be grouped together and be accessible only to the people who are assigned to that investigation.

    What should the legal team create for each investigation?
  fr: |
    L'équipe juridique de Tailspin Toys mène deux investigations distinctes avec Microsoft Purview eDiscovery. Pour chaque investigation, les recherches et le contenu préservé doivent être regroupés et accessibles uniquement aux personnes affectées à cette investigation.

    Que doit créer l'équipe juridique pour chaque investigation ?
body:
  options:
    - { id: a, text: { en: "A case", fr: "Un cas" } }
    - { id: b, text: { en: "A review set", fr: "Un ensemble de révision" } }
    - { id: c, text: { en: "An export", fr: "Une exportation" } }
    - { id: d, text: { en: "A hold", fr: "Une mise en attente" } }
answer: { optionId: a }
explanation:
  correct:
    en: "In eDiscovery, the case is the central unit of an investigation: it contains all the searches, holds and review sets that relate to it. The membership of the case controls who can access it, so each investigation stays separate."
    fr: "Dans eDiscovery, le cas est l'unité centrale d'une investigation : il contient toutes les recherches, les mises en attente et les ensembles de révision qui s'y rapportent. L'appartenance au cas détermine qui peut y accéder : chaque investigation reste donc séparée."
  options:
    b:
      en: "A review set is created inside a case to analyze collected content; it doesn't group the searches and holds of an investigation."
      fr: "Un ensemble de révision se crée dans un cas pour analyser le contenu collecté ; il ne regroupe pas les recherches et les mises en attente d'une investigation."
    c:
      en: "An export copies search results into a package to download."
      fr: "Une exportation copie des résultats de recherche dans un package à télécharger."
    d:
      en: "A hold preserves the content of locations and is itself part of a case."
      fr: "Une mise en attente préserve le contenu d'emplacements et fait elle-même partie d'un cas."
references:
  - title: Learn about eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc
  - title: Describe eDiscovery
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/3-describe-ediscovery
