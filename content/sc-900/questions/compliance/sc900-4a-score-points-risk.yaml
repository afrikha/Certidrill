id: sc900-4a-score-points-risk
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In Compliance Manager, Fabrikam completes two improvement actions. The first action adds 27 points to the compliance score, and the second action adds 1 point.

    What determines the number of points of an improvement action?
  fr: |
    Dans le Gestionnaire de conformité, Fabrikam réalise deux actions d'amélioration. La première action ajoute 27 points au score de conformité, et la seconde ajoute 1 point.

    Qu'est-ce qui détermine le nombre de points d'une action d'amélioration ?
body:
  options:
    - id: a
      text: { en: "The number of users that the action affects", fr: "Le nombre d'utilisateurs concernés par l'action" }
    - id: b
      text: { en: "The potential risk that the action addresses", fr: "Le risque potentiel que l'action traite" }
    - id: c
      text: { en: "The license that the action requires", fr: "La licence que l'action exige" }
    - id: d
      text: { en: "The time that the action takes to implement", fr: "Le temps nécessaire pour implémenter l'action" }
answer: { optionId: b }
explanation:
  correct:
    en: "The compliance score is risk-based: each improvement action has a point value that depends on the potential risk involved. An action that prevents a specific risk and can't be bypassed is worth the most points (27), while a detective or corrective action that relies on users is worth the fewest (1)."
    fr: "Le score de conformité est fondé sur les risques : chaque action d'amélioration a une valeur en points qui dépend du risque potentiel en jeu. Une action qui prévient un risque précis et ne peut pas être contournée vaut le plus de points (27), alors qu'une action détective ou corrective qui dépend des utilisateurs en vaut le moins (1)."
  options:
    a:
      en: "The points don't depend on how many users are in the scope of an action."
      fr: "Les points ne dépendent pas du nombre d'utilisateurs concernés par une action."
    c:
      en: "Licensing determines which features and assessments are available, not the value of an action."
      fr: "Les licences déterminent quelles fonctionnalités et quelles évaluations sont disponibles, pas la valeur d'une action."
    d:
      en: "The implementation effort isn't part of the calculation; only the type of action, which reflects the risk, counts."
      fr: "L'effort d'implémentation n'entre pas dans le calcul ; seul compte le type d'action, qui reflète le risque."
references:
  - title: Compliance Manager scoring
    url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring
