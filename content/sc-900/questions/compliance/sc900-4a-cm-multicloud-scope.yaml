id: sc900-4a-cm-multicloud-scope
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs workloads in Microsoft 365, in Microsoft Azure and in Amazon Web Services (AWS).

    Which statement describes the scope of the assessments in Compliance Manager?
  fr: |
    Adatum exécute des charges de travail dans Microsoft 365, dans Microsoft Azure et dans Amazon Web Services (AWS).

    Quelle affirmation décrit le périmètre des évaluations du Gestionnaire de conformité ?
body:
  options:
    - id: a
      text: { en: "They can cover Microsoft 365 only.", fr: "Elles ne peuvent couvrir que Microsoft 365." }
    - id: b
      text: { en: "They can cover Microsoft 365 and Azure, but no other cloud.", fr: "Elles peuvent couvrir Microsoft 365 et Azure, mais aucun autre cloud." }
    - id: c
      text: { en: "They can cover Azure and AWS, but not Microsoft 365.", fr: "Elles peuvent couvrir Azure et AWS, mais pas Microsoft 365." }
    - id: d
      text: { en: "They can cover Microsoft 365, Azure and other clouds such as AWS.", fr: "Elles peuvent couvrir Microsoft 365, Azure et d'autres clouds comme AWS." }
answer: { optionId: d }
explanation:
  correct:
    en: "Compliance Manager helps assess and manage compliance across a multicloud environment. Through its integration with Microsoft Defender for Cloud, it assesses the compliance posture of Microsoft 365, Microsoft Azure, Amazon Web Services and Google Cloud Platform from a single interface."
    fr: "Le Gestionnaire de conformité aide à évaluer et à gérer la conformité dans tout un environnement multicloud. Grâce à son intégration à Microsoft Defender pour le cloud, il évalue la posture de conformité de Microsoft 365, de Microsoft Azure, d'Amazon Web Services et de Google Cloud Platform à partir d'une seule interface."
  options:
    a:
      en: "Microsoft 365 is covered, but Compliance Manager isn't limited to it."
      fr: "Microsoft 365 est couvert, mais le Gestionnaire de conformité ne s'y limite pas."
    b:
      en: "Non-Microsoft clouds such as AWS and Google Cloud Platform are supported as well."
      fr: "Les clouds non-Microsoft comme AWS et Google Cloud Platform sont également pris en charge."
    c:
      en: "Microsoft 365 is the first environment that Compliance Manager assesses: it continuously collects signals from it."
      fr: "Microsoft 365 est le premier environnement que le Gestionnaire de conformité évalue : il en collecte les signaux en continu."
references:
  - title: Multicloud support in Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager-multicloud
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
