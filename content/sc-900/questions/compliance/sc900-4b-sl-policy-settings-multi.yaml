id: sc900-4b-sl-policy-settings-multi
objective: "4.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has created sensitivity labels and now prepares a sensitivity label policy to publish them.

    Which two settings can Proseware configure in the sensitivity label policy? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware a créé des étiquettes de confidentialité et prépare maintenant une stratégie d'étiquetage de confidentialité pour les publier.

    Quels sont les deux paramètres que Proseware peut configurer dans la stratégie d'étiquetage de confidentialité ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The text of the watermark that is added to labeled documents", fr: "Le texte du filigrane ajouté aux documents étiquetés" } }
    - { id: b, text: { en: "A default label for the new documents and emails of the users", fr: "Une étiquette par défaut pour les nouveaux documents et e-mails des utilisateurs" } }
    - { id: c, text: { en: "The number of years during which labeled documents are retained", fr: "Le nombre d'années pendant lesquelles les documents étiquetés sont conservés" } }
    - { id: d, text: { en: "The obligation to apply a label before saving a document", fr: "L'obligation d'appliquer une étiquette avant d'enregistrer un document" } }
    - { id: e, text: { en: "A hold that preserves the mailboxes of the users", fr: "Une mise en attente qui préserve les boîtes aux lettres des utilisateurs" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A sensitivity label policy publishes labels to users and groups and sets how they are used: it can apply a default label to new documents and emails, and it can make labeling mandatory before a document is saved or an email is sent. It can also require a justification to lower or remove a label and give a link to a help page."
    fr: "Une stratégie d'étiquetage de confidentialité publie des étiquettes pour des utilisateurs et des groupes et règle leur utilisation : elle peut appliquer une étiquette par défaut aux nouveaux documents et e-mails, et rendre l'étiquetage obligatoire avant l'enregistrement d'un document ou l'envoi d'un e-mail. Elle peut aussi exiger une justification pour abaisser ou retirer une étiquette et donner un lien vers une page d'aide."
  options:
    a:
      en: "Content markings such as watermarks are settings of the label itself, not of the policy that publishes it."
      fr: "Les marquages de contenu comme les filigranes sont des paramètres de l'étiquette elle-même, pas de la stratégie qui la publie."
    c:
      en: "Retention periods are set with retention labels and retention policies, not with sensitivity labels."
      fr: "Les périodes de rétention se définissent avec des étiquettes de rétention et des stratégies de rétention, pas avec des étiquettes de confidentialité."
    e:
      en: "A hold is created in an eDiscovery case to preserve content for an investigation."
      fr: "Une mise en attente se crée dans un cas eDiscovery pour préserver du contenu en vue d'une investigation."
references:
  - title: Describe sensitivity labels and policies in Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/3-describe-sensitivity-labels-policies
  - title: Learn about sensitivity labels
    url: https://learn.microsoft.com/en-us/purview/sensitivity-labels
