id: sc900-4a-score-corrective-action
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In Compliance Manager, the points of an improvement action depend on whether the action is preventative, detective or corrective.

    Which improvement action is an example of a corrective action?
  fr: |
    Dans le Gestionnaire de conformité, les points d'une action d'amélioration dépendent du fait que l'action est préventive, détective ou corrective.

    Quelle action d'amélioration est un exemple d'action corrective ?
body:
  options:
    - id: a
      text: { en: "Encrypting data at rest", fr: "Chiffrer les données au repos" }
    - id: b
      text: { en: "Enforcing separation of duties", fr: "Appliquer la séparation des tâches" }
    - id: c
      text: { en: "Monitoring privileged administrative actions", fr: "Surveiller les actions d'administration privilégiées" }
    - id: d
      text: { en: "Responding to a privacy incident", fr: "Répondre à un incident de confidentialité" }
answer: { optionId: d }
explanation:
  correct:
    en: "A corrective action limits the adverse effects of a security incident: it reduces the immediate impact and reverses the damage where possible. Responding to a privacy incident, to limit the damage and restore systems after a breach, is the typical example."
    fr: "Une action corrective limite les effets néfastes d'un incident de sécurité : elle réduit l'impact immédiat et répare les dégâts quand c'est possible. Répondre à un incident de confidentialité, pour limiter les dégâts et rétablir les systèmes après une violation, en est l'exemple type."
  options:
    a:
      en: "Encrypting data at rest is a preventative action: it addresses a specific risk, the exposure of data after an attack or a breach."
      fr: "Chiffrer les données au repos est une action préventive : elle traite un risque précis, l'exposition des données après une attaque ou une violation."
    b:
      en: "Separation of duties is a preventative action: it manages conflicts of interest and guards against fraud."
      fr: "La séparation des tâches est une action préventive : elle gère les conflits d'intérêts et protège contre la fraude."
    c:
      en: "Monitoring privileged administrative actions is a detective action: it watches systems to identify irregular behaviors or breaches."
      fr: "Surveiller les actions d'administration privilégiées est une action détective : elle observe les systèmes pour repérer des comportements anormaux ou des violations."
references:
  - title: Compliance Manager scoring
    url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring
