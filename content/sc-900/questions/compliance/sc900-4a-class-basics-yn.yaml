id: sc900-4a-class-basics-yn
objective: "4.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about data classification in Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la classification des données dans Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Sensitive information types identify content by patterns, such as a regular expression or a list of keywords."
        fr: "Les types d'informations sensibles identifient le contenu au moyen de modèles, comme une expression régulière ou une liste de mots clés."
    - id: s2
      text:
        en: "A pre-trained classifier provided by Microsoft must be trained with samples of your organization before it is used."
        fr: "Un classifieur préentraîné fourni par Microsoft doit être entraîné avec des échantillons de votre organisation avant d'être utilisé."
    - id: s3
      text:
        en: "Microsoft Purview provides built-in sensitive information types for data such as bank account numbers and passport numbers."
        fr: "Microsoft Purview fournit des types d'informations sensibles intégrés pour des données comme les numéros de compte bancaire et les numéros de passeport."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Sensitive information types are pattern-based classifiers: their primary element is a regular expression, a keyword list, a keyword dictionary or a function. Microsoft creates and maintains built-in types for data such as credit card, passport, bank account and health service numbers. Pre-trained classifiers are created and trained by Microsoft: they are ready to use without any training; only custom trainable classifiers need samples."
    fr: "Les types d'informations sensibles sont des classifieurs fondés sur des modèles : leur élément principal est une expression régulière, une liste de mots clés, un dictionnaire de mots clés ou une fonction. Microsoft crée et maintient des types intégrés pour des données comme les numéros de carte de crédit, de passeport, de compte bancaire et d'assurance maladie. Les classifieurs préentraînés sont créés et entraînés par Microsoft : ils sont prêts à l'emploi sans aucun entraînement ; seuls les classifieurs entraînables personnalisés ont besoin d'échantillons."
references:
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
  - title: Learn about trainable classifiers
    url: https://learn.microsoft.com/en-us/purview/trainable-classifiers-learn-about
