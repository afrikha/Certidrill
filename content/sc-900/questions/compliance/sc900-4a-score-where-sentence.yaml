id: sc900-4a-score-where-sentence
objective: "4.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences about the compliance score, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur le score de conformité, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The compliance score measures the progress in completing actions that reduce the risks around [[about]].

      The score is calculated by [[tool]].

      The score is displayed in [[portal]].
    fr: |
      Le score de conformité mesure l'avancement dans la réalisation d'actions qui réduisent les risques liés [[about]].

      Le score est calculé par [[tool]].

      Le score est affiché dans [[portal]].
  slots:
    - id: about
      options:
        - { id: malware, text: { en: "malware and phishing attacks", fr: "aux programmes malveillants et aux attaques par hameçonnage" } }
        - { id: data, text: { en: "data protection and regulatory standards", fr: "à la protection des données et aux normes réglementaires" } }
        - { id: signin, text: { en: "risky users and risky sign-ins", fr: "aux utilisateurs à risque et aux connexions à risque" } }
    - id: tool
      options:
        - { id: cm, text: { en: "Compliance Manager", fr: "le Gestionnaire de conformité" } }
        - { id: xdr, text: { en: "Microsoft Defender XDR", fr: "Microsoft Defender XDR" } }
        - { id: stp, text: { en: "the Service Trust Portal", fr: "le Portail d'approbation des services" } }
    - id: portal
      options:
        - { id: defender, text: { en: "the Microsoft Defender portal", fr: "le portail Microsoft Defender" } }
        - { id: entra, text: { en: "the Microsoft Entra admin center", fr: "le Centre d'administration Microsoft Entra" } }
        - { id: purview, text: { en: "the Microsoft Purview portal", fr: "le portail Microsoft Purview" } }
answer:
  values: { about: data, tool: cm, portal: purview }
explanation:
  correct:
    en: "Compliance Manager, a solution of the Microsoft Purview portal, calculates the compliance score. The score measures the progress in completing improvement actions that reduce the risks around data protection and regulatory standards. It must not be confused with Microsoft Secure Score, which measures the security posture and is shown in the Microsoft Defender portal."
    fr: "Le Gestionnaire de conformité, une solution du portail Microsoft Purview, calcule le score de conformité. Le score mesure l'avancement dans la réalisation des actions d'amélioration qui réduisent les risques liés à la protection des données et aux normes réglementaires. Il ne faut pas le confondre avec le Degré de sécurisation Microsoft (Microsoft Secure Score), qui mesure la posture de sécurité et s'affiche dans le portail Microsoft Defender."
  options:
    signin:
      en: "Risky users and risky sign-ins are detected by Microsoft Entra ID Protection."
      fr: "Les utilisateurs à risque et les connexions à risque sont détectés par Protection Microsoft Entra ID."
    stp:
      en: "The Service Trust Portal publishes documents about Microsoft's compliance; it calculates no score for a customer."
      fr: "Le Portail d'approbation des services publie des documents sur la conformité de Microsoft ; il ne calcule aucun score pour un client."
references:
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
  - title: Compliance Manager scoring
    url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring
