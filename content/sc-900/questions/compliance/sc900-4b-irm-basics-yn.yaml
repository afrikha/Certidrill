id: sc900-4b-irm-basics-yn
objective: "4.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Purview Insider Risk Management, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la gestion des risques internes Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When the activity of a user matches an insider risk policy, Insider Risk Management blocks the activity instead of generating an alert."
        fr: "Quand l'activité d'un utilisateur correspond à une stratégie de risque interne, la gestion des risques internes bloque l'activité au lieu de générer une alerte."
    - id: s2
      text:
        en: "Insider Risk Management can detect risky activities that are inadvertent, as well as activities that are malicious."
        fr: "La gestion des risques internes peut détecter des activités à risque involontaires, ainsi que des activités malveillantes."
    - id: s3
      text:
        en: "Before any insider risk policy is created, insider risk analytics can evaluate the potential insider risks of the organization."
        fr: "Avant la création de toute stratégie de risque interne, l'analytique des risques internes peut évaluer les risques internes potentiels de l'organisation."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Insider Risk Management detects, investigates and acts on risky activities, whether they are malicious or inadvertent. It doesn't block the activity when it happens: risk indicators that match the conditions of a policy generate alerts, which reviewers triage and investigate. Insider risk analytics evaluates potential risks without any policy, which helps decide the type and the scope of the policies to create."
    fr: "La gestion des risques internes détecte et examine les activités à risque, qu'elles soient malveillantes ou involontaires, puis permet d'agir. Elle ne bloque pas l'activité au moment où elle se produit : les indicateurs de risque qui correspondent aux conditions d'une stratégie génèrent des alertes, que des réviseurs trient et examinent. L'analytique des risques internes évalue les risques potentiels sans aucune stratégie, ce qui aide à décider du type et de l'étendue des stratégies à créer."
references:
  - title: Describe insider risk management in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/5-describe-insider-risk-management
  - title: Learn about Insider Risk Management
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management
