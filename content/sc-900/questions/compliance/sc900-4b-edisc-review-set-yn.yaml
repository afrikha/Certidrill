id: sc900-4b-edisc-review-set-yn
objective: "4.4.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Purview eDiscovery, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Purview eDiscovery, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "By default, every licensed user of an organization can run eDiscovery searches on the mailboxes of the organization."
        fr: "Par défaut, tout utilisateur de l'organisation doté d'une licence peut effectuer des recherches eDiscovery dans les boîtes aux lettres de l'organisation."
    - id: s2
      text:
        en: "A document that is encrypted by a sensitivity label can be decrypted automatically when it is added to a review set."
        fr: "Un document chiffré par une étiquette de confidentialité peut être déchiffré automatiquement quand il est ajouté à un ensemble de révision."
    - id: s3
      text:
        en: "Adding an item to a review set removes the item from its original content location."
        fr: "L'ajout d'un élément à un ensemble de révision retire l'élément de son emplacement de contenu d'origine."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "To use eDiscovery, a user must be assigned the appropriate permissions; a license alone gives no access to the content of other users. Decryption is a premium feature: emails protected by Microsoft Purview Message Encryption and documents protected by sensitivity labels are decrypted automatically when they are added to a review set. A review set holds a static copy: collected items are copied from their original location, where they stay."
    fr: "Pour utiliser eDiscovery, un utilisateur doit avoir reçu les autorisations appropriées ; une licence seule ne donne aucun accès au contenu des autres utilisateurs. Le déchiffrement est une fonctionnalité premium : les e-mails protégés par le chiffrement de messages Microsoft Purview et les documents protégés par des étiquettes de confidentialité sont déchiffrés automatiquement quand ils sont ajoutés à un ensemble de révision. Un ensemble de révision contient une copie statique : les éléments collectés sont copiés depuis leur emplacement d'origine, où ils restent."
references:
  - title: Describe eDiscovery
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/3-describe-ediscovery
  - title: Learn about eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc
