id: sc900-4a-class-sit-parts-sentence
objective: "4.3.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    To complete the sentences about the parts of a sensitive information type, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur les parties d'un type d'informations sensibles, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      What a sensitive information type looks for first, such as a regular expression, is [[main]].

      A keyword such as "Social Security Number" found near a nine-digit number is [[evidence]].

      The maximum number of characters between this keyword and the nine-digit number is [[distance]].
    fr: |
      Ce qu'un type d'informations sensibles recherche en premier, par exemple une expression régulière, est [[main]].

      Un mot clé comme « Social Security Number » trouvé près d'un nombre à neuf chiffres est [[evidence]].

      Le nombre maximal de caractères entre ce mot clé et le nombre à neuf chiffres est [[distance]].
  slots:
    - id: main
      options:
        - { id: conf, text: { en: "the confidence level", fr: "le niveau de confiance (confidence level)" } }
        - { id: prim, text: { en: "the primary element", fr: "l'élément principal (primary element)" } }
        - { id: prox, text: { en: "the proximity", fr: "la proximité (proximity)" } }
        - { id: supp, text: { en: "a supporting element", fr: "un élément de prise en charge (supporting element)" } }
    - id: evidence
      options:
        - { id: conf, text: { en: "the confidence level", fr: "le niveau de confiance (confidence level)" } }
        - { id: prim, text: { en: "the primary element", fr: "l'élément principal (primary element)" } }
        - { id: prox, text: { en: "the proximity", fr: "la proximité (proximity)" } }
        - { id: supp, text: { en: "a supporting element", fr: "un élément de prise en charge (supporting element)" } }
    - id: distance
      options:
        - { id: conf, text: { en: "the confidence level", fr: "le niveau de confiance (confidence level)" } }
        - { id: prim, text: { en: "the primary element", fr: "l'élément principal (primary element)" } }
        - { id: prox, text: { en: "the proximity", fr: "la proximité (proximity)" } }
        - { id: supp, text: { en: "a supporting element", fr: "un élément de prise en charge (supporting element)" } }
answer:
  values: { main: prim, evidence: supp, distance: prox }
explanation:
  correct:
    en: "The pattern of a sensitive information type has four parts. The primary element is the main thing the type looks for: a regular expression, a keyword list, a keyword dictionary or a function. A supporting element is corroborating evidence that increases the confidence of a match, such as a keyword near the number. The proximity is the maximum number of characters between the supporting element and the primary element."
    fr: "Le modèle d'un type d'informations sensibles comprend quatre parties. L'élément principal est ce que le type recherche avant tout : une expression régulière, une liste de mots clés, un dictionnaire de mots clés ou une fonction. Un élément de prise en charge est une preuve complémentaire qui augmente la confiance dans une correspondance, par exemple un mot clé près du nombre. La proximité est le nombre maximal de caractères entre l'élément de prise en charge et l'élément principal."
  options:
    conf:
      en: "The confidence level is low, medium or high: it reflects how much supporting evidence was found with the primary element."
      fr: "Le niveau de confiance est faible, moyen ou élevé : il reflète la quantité de preuves trouvées avec l'élément principal."
references:
  - title: Learn about sensitive information types
    url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-learn-about
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
