id: sc900-4a-portal-three-portals-sentence
objective: "4.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To create a retention policy for the mailboxes of the organization, an administrator uses [[retention]].

      To investigate an incident that groups several related alerts, a security analyst uses [[incident]].

      To create a Conditional Access policy, an administrator uses [[access]].
    fr: |
      Pour créer une stratégie de rétention pour les boîtes aux lettres de l'organisation, un administrateur utilise [[retention]].

      Pour examiner un incident qui regroupe plusieurs alertes liées, un analyste de sécurité utilise [[incident]].

      Pour créer une stratégie d'accès conditionnel, un administrateur utilise [[access]].
  slots:
    - id: retention
      options:
        - { id: defender, text: { en: "the Microsoft Defender portal", fr: "le portail Microsoft Defender" } }
        - { id: entra, text: { en: "the Microsoft Entra admin center", fr: "le Centre d'administration Microsoft Entra" } }
        - { id: purview, text: { en: "the Microsoft Purview portal", fr: "le portail Microsoft Purview" } }
        - { id: stp, text: { en: "the Service Trust Portal", fr: "le Portail d'approbation des services" } }
    - id: incident
      options:
        - { id: defender, text: { en: "the Microsoft Defender portal", fr: "le portail Microsoft Defender" } }
        - { id: entra, text: { en: "the Microsoft Entra admin center", fr: "le Centre d'administration Microsoft Entra" } }
        - { id: purview, text: { en: "the Microsoft Purview portal", fr: "le portail Microsoft Purview" } }
        - { id: stp, text: { en: "the Service Trust Portal", fr: "le Portail d'approbation des services" } }
    - id: access
      options:
        - { id: defender, text: { en: "the Microsoft Defender portal", fr: "le portail Microsoft Defender" } }
        - { id: entra, text: { en: "the Microsoft Entra admin center", fr: "le Centre d'administration Microsoft Entra" } }
        - { id: purview, text: { en: "the Microsoft Purview portal", fr: "le portail Microsoft Purview" } }
        - { id: stp, text: { en: "the Service Trust Portal", fr: "le Portail d'approbation des services" } }
answer:
  values: { retention: purview, incident: defender, access: entra }
explanation:
  correct:
    en: "Retention policies belong to data lifecycle management, a Microsoft Purview solution managed in the Microsoft Purview portal. Incidents and alerts of Microsoft Defender XDR are investigated in the Microsoft Defender portal. Conditional Access is a Microsoft Entra capability, configured in the Microsoft Entra admin center."
    fr: "Les stratégies de rétention relèvent de la gestion du cycle de vie des données, une solution Microsoft Purview gérée dans le portail Microsoft Purview. Les incidents et les alertes de Microsoft Defender XDR s'examinent dans le portail Microsoft Defender. L'accès conditionnel est une fonctionnalité de Microsoft Entra, configurée dans le Centre d'administration Microsoft Entra."
  options:
    stp:
      en: "The Service Trust Portal publishes audit reports and compliance documents about Microsoft cloud services; nothing is configured there."
      fr: "Le Portail d'approbation des services publie des rapports d'audit et des documents de conformité sur les services cloud Microsoft ; rien ne s'y configure."
references:
  - title: Learn about the Microsoft Purview portal
    url: https://learn.microsoft.com/en-us/purview/purview-portal
