id: sc900-4b-sl-publish-sentences
objective: "4.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences about sensitivity labels, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur les étiquettes de confidentialité, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A sensitivity label is stored in [[meta]] in the metadata of a file, so that other apps and services can read it.

      A sensitivity label policy publishes labels to [[target]].

      A sensitivity label policy can require [[change]] when a user removes a label or replaces it with a less sensitive one.
    fr: |
      Une étiquette de confidentialité est stockée [[meta]] dans les métadonnées d'un fichier, afin que d'autres applications et services puissent la lire.

      Une stratégie d'étiquetage de confidentialité publie des étiquettes pour [[target]].

      Une stratégie d'étiquetage de confidentialité peut exiger [[change]] quand un utilisateur retire une étiquette ou la remplace par une étiquette moins sensible.
  slots:
    - id: meta
      options:
        - { id: hash, text: { en: "a hashed form", fr: "sous forme hachée" } }
        - { id: clear, text: { en: "clear text", fr: "en texte clair" } }
        - { id: enc, text: { en: "an encrypted form", fr: "sous forme chiffrée" } }
    - id: target
      options:
        - { id: users, text: { en: "users and groups", fr: "des utilisateurs et des groupes" } }
        - { id: devices, text: { en: "onboarded devices", fr: "des appareils intégrés" } }
        - { id: subs, text: { en: "Azure subscriptions", fr: "des abonnements Azure" } }
    - id: change
      options:
        - { id: approval, text: { en: "the approval of an administrator", fr: "l'approbation d'un administrateur" } }
        - { id: mfa, text: { en: "multifactor authentication", fr: "l'authentification multifacteur" } }
        - { id: just, text: { en: "a justification", fr: "une justification" } }
answer:
  values: { meta: clear, target: users, change: just }
explanation:
  correct:
    en: "A sensitivity label is stored in clear text in the metadata of files and emails, which lets third-party apps and services read it and apply their own protective actions. Labels are published to users and groups by a sensitivity label policy, unlike retention labels, which are published to locations. The policy can require the user to justify removing a label or replacing it with a lower one; no administrator has to approve the change."
    fr: "Une étiquette de confidentialité est stockée en texte clair dans les métadonnées des fichiers et des e-mails, ce qui permet à des applications et services tiers de la lire et d'appliquer leurs propres mesures de protection. Les étiquettes sont publiées pour des utilisateurs et des groupes par une stratégie d'étiquetage de confidentialité, contrairement aux étiquettes de rétention, publiées dans des emplacements. La stratégie peut exiger que l'utilisateur justifie le retrait d'une étiquette ou son remplacement par une étiquette inférieure ; aucun administrateur n'a à approuver le changement."
references:
  - title: Learn about sensitivity labels
    url: https://learn.microsoft.com/en-us/purview/sensitivity-labels
  - title: Describe sensitivity labels and policies in Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/3-describe-sensitivity-labels-policies
