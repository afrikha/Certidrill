id: sc900-4a-class-sit-pattern
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso wants to identify the documents that contain credit card numbers. Credit card numbers follow a known pattern.

    Which data classification capability of Microsoft Purview meets this need?
  fr: |
    Contoso veut identifier les documents qui contiennent des numéros de carte de crédit. Les numéros de carte de crédit suivent un modèle connu.

    Quelle fonctionnalité de classification des données de Microsoft Purview répond à ce besoin ?
body:
  options:
    - id: a
      text: { en: "A sensitive information type", fr: "Un type d'informations sensibles" }
    - id: b
      text: { en: "A trainable classifier", fr: "Un classifieur entraînable" }
    - id: c
      text: { en: "A retention label", fr: "Une étiquette de rétention" }
    - id: d
      text: { en: "Activity explorer", fr: "L'Explorateur d'activités" }
answer: { optionId: a }
explanation:
  correct:
    en: "Sensitive information types are pattern-based classifiers: they detect data such as credit card numbers, social security numbers or bank account numbers by using a regular expression or keywords, with supporting evidence. Microsoft Purview provides a built-in sensitive information type for credit card numbers."
    fr: "Les types d'informations sensibles sont des classifieurs fondés sur des modèles : ils détectent des données comme les numéros de carte de crédit, de sécurité sociale ou de compte bancaire au moyen d'une expression régulière ou de mots clés, avec des éléments de preuve. Microsoft Purview fournit un type d'informations sensibles intégré pour les numéros de carte de crédit."
  options:
    b:
      en: "A trainable classifier uses machine learning to recognize what an item is, such as a contract or a resume; it is meant for content that no pattern describes."
      fr: "Un classifieur entraînable utilise le machine learning pour reconnaître ce qu'est un élément, par exemple un contrat ou un CV ; il est destiné au contenu qu'aucun modèle ne décrit."
    c:
      en: "A retention label defines how long an item is kept; it doesn't detect the content of documents."
      fr: "Une étiquette de rétention définit la durée de conservation d'un élément ; elle ne détecte pas le contenu des documents."
    d:
      en: "Activity explorer shows what users do with labeled content; it relies on classification but doesn't define what to detect."
      fr: "L'Explorateur d'activités montre ce que les utilisateurs font du contenu étiqueté ; il s'appuie sur la classification, mais ne définit pas ce qu'il faut détecter."
references:
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
  - title: Learn about sensitive information types
    url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-learn-about
