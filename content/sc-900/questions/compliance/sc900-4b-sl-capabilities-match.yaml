id: sc900-4b-sl-capabilities-match
objective: "4.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each requirement to the sensitivity label capability that meets it.

    To answer, drag the appropriate capability to each requirement. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque besoin à la fonctionnalité des étiquettes de confidentialité qui y répond.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque besoin. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: auto, text: { en: "Automatic labeling", fr: "Étiquetage automatique" } }
    - { id: marking, text: { en: "Content marking", fr: "Marquage du contenu" } }
    - { id: mandatory, text: { en: "Mandatory labeling", fr: "Étiquetage obligatoire" } }
    - { id: encryption, text: { en: "Encryption", fr: "Chiffrement" } }
    - { id: container, text: { en: "Protection of containers", fr: "Protection des conteneurs" } }
  targets:
    - id: footer
      text: { en: "The footer of every page of a labeled document shows the text \"Internal use only\".", fr: "Le pied de page de chaque page d'un document étiqueté affiche le texte « Usage interne uniquement »." }
    - id: guests
      text: { en: "A labeled Microsoft 365 group is private, and external users are kept out of it.", fr: "Un groupe Microsoft 365 étiqueté est privé, et les utilisateurs externes en sont tenus à l'écart." }
    - id: legal
      text: { en: "Only the members of the Legal department can open a labeled document.", fr: "Seuls les membres du service juridique peuvent ouvrir un document étiqueté." }
    - id: card
      text: { en: "A document receives the label as soon as a credit card number is detected in it.", fr: "Un document reçoit l'étiquette dès qu'un numéro de carte de crédit y est détecté." }
answer:
  mapping: { footer: marking, guests: container, legal: encryption, card: auto }
explanation:
  correct:
    en: "Content marking adds headers, footers and watermarks to labeled content. A label for containers controls settings such as the privacy and the access of external users for teams, Microsoft 365 groups and SharePoint sites. Encryption limits access to the users or groups that are given permissions. Automatic labeling applies the label when chosen sensitive information types are found. Mandatory labeling isn't a label capability: it is a label policy setting that forces users to choose a label."
    fr: "Le marquage du contenu ajoute des en-têtes, des pieds de page et des filigranes au contenu étiqueté. Une étiquette pour les conteneurs contrôle des paramètres comme la confidentialité et l'accès des utilisateurs externes pour les équipes, les groupes Microsoft 365 et les sites SharePoint. Le chiffrement limite l'accès aux utilisateurs ou aux groupes qui reçoivent des autorisations. L'étiquetage automatique applique l'étiquette quand des types d'informations sensibles choisis sont détectés. L'étiquetage obligatoire n'est pas une fonctionnalité de l'étiquette : c'est un paramètre de la stratégie d'étiquetage, qui oblige les utilisateurs à choisir une étiquette."
references:
  - title: Learn about sensitivity labels
    url: https://learn.microsoft.com/en-us/purview/sensitivity-labels
  - title: Describe sensitivity labels and policies in Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/3-describe-sensitivity-labels-policies
