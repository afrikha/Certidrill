id: sc900-4b-irm-departing-user
objective: "4.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware wants to be alerted when an employee who has resigned downloads an unusual number of files and copies them to a personal cloud storage service. Resignation dates that come from the human resources system must be taken into account, and each alert must be investigated.

    Which Microsoft Purview solution should Litware use?
  fr: |
    Litware veut être alertée quand un employé démissionnaire télécharge un nombre inhabituel de fichiers et les copie vers un service de stockage cloud personnel. Les dates de démission issues du système des ressources humaines doivent être prises en compte, et chaque alerte doit être examinée.

    Quelle solution Microsoft Purview Litware doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Insider Risk Management", fr: "La gestion des risques internes (Insider Risk Management)" } }
    - { id: b, text: { en: "Data Loss Prevention", fr: "La protection contre la perte de données (Data Loss Prevention)" } }
    - { id: c, text: { en: "Records Management", fr: "La gestion des enregistrements (Records Management)" } }
    - { id: d, text: { en: "eDiscovery", fr: "eDiscovery" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Insider Risk Management correlates signals to detect, investigate and act on risky activities of users. Its template for data theft by departing users can use resignation dates imported by an HR connector and raises alerts on activities such as mass downloads or copies to personal cloud services; reviewers then triage and investigate the alerts."
    fr: "La gestion des risques internes corrèle des signaux pour détecter et examiner les activités à risque des utilisateurs, puis agir. Son modèle de vol de données par des utilisateurs sortants peut utiliser les dates de démission importées par un connecteur RH et émet des alertes sur des activités comme des téléchargements massifs ou des copies vers des services cloud personnels ; des réviseurs trient ensuite les alertes et les examinent."
  options:
    b:
      en: "Data Loss Prevention acts on the content of an item at the moment it is shared; it doesn't follow the behavior of a user who is leaving, based on HR signals."
      fr: "La protection contre la perte de données agit sur le contenu d'un élément au moment où il est partagé ; elle ne suit pas le comportement d'un utilisateur sur le départ à partir de signaux RH."
    c:
      en: "Records Management manages the retention and the disposition of records."
      fr: "La gestion des enregistrements gère la rétention et la destruction des enregistrements."
    d:
      en: "eDiscovery searches for and preserves content as evidence once an investigation or a legal case exists; it doesn't raise alerts on user activity."
      fr: "eDiscovery recherche et préserve du contenu comme preuve une fois qu'une investigation ou une affaire juridique existe ; il n'émet pas d'alertes sur l'activité des utilisateurs."
references:
  - title: Describe insider risk management in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/5-describe-insider-risk-management
  - title: Learn about Insider Risk Management policy templates
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management-policy-templates
