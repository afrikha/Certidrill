id: sc900-4a-expl-activity-needs-multi
objective: "4.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has several needs related to its sensitive data.

    Which two needs does Activity explorer meet?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a plusieurs besoins liés à ses données sensibles.

    Quels sont les deux besoins auxquels l'Explorateur d'activités répond ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Review which labeled files users copied to a network share", fr: "Passer en revue les fichiers étiquetés que des utilisateurs ont copiés sur un partage réseau" }
    - id: b
      text: { en: "View the number of items that contain passport numbers in each location", fr: "Afficher le nombre d'éléments qui contiennent des numéros de passeport dans chaque emplacement" }
    - id: c
      text: { en: "Open a labeled document stored in SharePoint to read its contents", fr: "Ouvrir un document étiqueté stocké dans SharePoint pour en lire le contenu" }
    - id: d
      text: { en: "Review the events in which content matched a DLP policy", fr: "Passer en revue les événements dans lesquels du contenu a correspondu à une stratégie DLP" }
    - id: e
      text: { en: "Assign improvement actions to the owners of the data", fr: "Attribuer des actions d'amélioration aux propriétaires des données" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Activity explorer reports on the activities related to labeled and sensitive content: labeling activities, files copied to removable media or to network shares, other endpoint activities such as printing, and DLP policy match events from locations such as Exchange, SharePoint, OneDrive and Teams."
    fr: "L'Explorateur d'activités rend compte des activités liées au contenu étiqueté et sensible : activités d'étiquetage, fichiers copiés sur un support amovible ou un partage réseau, autres activités sur les points de terminaison comme l'impression, et événements de correspondance avec des stratégies DLP provenant d'emplacements comme Exchange, SharePoint, OneDrive et Teams."
  options:
    b:
      en: "Counting the items that contain a sensitive information type, by location, is what Content explorer does."
      fr: "Compter les éléments qui contiennent un type d'informations sensibles, par emplacement, est ce que fait l'Explorateur de contenu."
    c:
      en: "Opening an item to view its contents is done in Content explorer, by a member of the Content Explorer Content viewer role group."
      fr: "Ouvrir un élément pour en afficher le contenu se fait dans l'Explorateur de contenu, par un membre du groupe de rôles Content Explorer Content viewer."
    e:
      en: "Improvement actions are assigned in Compliance Manager."
      fr: "Les actions d'amélioration s'attribuent dans le Gestionnaire de conformité."
references:
  - title: Get started with Activity explorer
    url: https://learn.microsoft.com/en-us/purview/data-classification-activity-explorer
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
