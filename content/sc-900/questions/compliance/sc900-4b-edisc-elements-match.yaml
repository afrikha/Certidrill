id: sc900-4b-edisc-elements-match
objective: "4.4.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the Microsoft Purview eDiscovery element that it describes.

    To answer, drag the appropriate element to each description. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à l'élément de Microsoft Purview eDiscovery qu'elle décrit.

    Pour répondre, faites glisser l'élément approprié vers chaque description. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: export, text: { en: "Export", fr: "Exportation" } }
    - { id: search, text: { en: "Search", fr: "Recherche" } }
    - { id: reviewset, text: { en: "Review set", fr: "Ensemble de révision" } }
    - { id: hold, text: { en: "Hold", fr: "Mise en attente" } }
  targets:
    - id: t1
      text: { en: "Preserves the content of a mailbox or a site so that it can't be deleted during the investigation.", fr: "Préserve le contenu d'une boîte aux lettres ou d'un site pour qu'il ne puisse pas être supprimé pendant l'investigation." }
    - id: t2
      text: { en: "A secure and static copy of collected content that reviewers filter, tag and analyze.", fr: "Une copie sécurisée et statique du contenu collecté, que les réviseurs filtrent, balisent et analysent." }
    - id: t3
      text: { en: "Copies items into a package that is downloaded to a local computer.", fr: "Copie des éléments dans un package téléchargé sur un ordinateur local." }
answer:
  mapping: { t1: hold, t2: reviewset, t3: export }
explanation:
  correct:
    en: "A hold preserves the content of a location from inadvertent or intentional deletion while the investigation lasts. A review set is a secure location that holds a static copy of the collected items, which reviewers search, filter, tag and analyze. An export copies items from their original location and packages them so that they can be downloaded to a local computer. A search only finds the content that matches a query in the chosen locations."
    fr: "Une mise en attente préserve le contenu d'un emplacement contre une suppression involontaire ou volontaire pendant la durée de l'investigation. Un ensemble de révision est un emplacement sécurisé qui contient une copie statique des éléments collectés, que les réviseurs recherchent, filtrent, balisent et analysent. Une exportation copie des éléments depuis leur emplacement d'origine et les regroupe dans un package téléchargeable sur un ordinateur local. Une recherche se contente de trouver le contenu qui correspond à une requête dans les emplacements choisis."
references:
  - title: Describe eDiscovery
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/3-describe-ediscovery
  - title: Learn about eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc
