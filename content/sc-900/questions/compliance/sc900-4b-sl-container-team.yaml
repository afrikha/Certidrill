id: sc900-4b-sl-container-team
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a sensitivity label named **Project-Confidential** that is configured only to protect containers (groups and sites). An owner applies the label to a team in Microsoft Teams.

    What is the effect of the label?
  fr: |
    Litware dispose d'une étiquette de confidentialité nommée **Project-Confidential**, configurée uniquement pour protéger des conteneurs (groupes et sites). Un propriétaire applique l'étiquette à une équipe dans Microsoft Teams.

    Quel est l'effet de l'étiquette ?
body:
  options:
    - id: a
      text:
        en: "The label encrypts the files stored in the team, so that only the members of the team can open them."
        fr: "L'étiquette chiffre les fichiers stockés dans l'équipe, afin que seuls les membres de l'équipe puissent les ouvrir."
    - id: b
      text:
        en: "The label is applied automatically to the files stored in the team, without encrypting them."
        fr: "L'étiquette est appliquée automatiquement aux fichiers stockés dans l'équipe, sans les chiffrer."
    - id: c
      text:
        en: "The label controls settings such as the privacy and the external access of the team, without labeling its files."
        fr: "L'étiquette contrôle des paramètres comme la confidentialité et l'accès externe de l'équipe, sans étiqueter ses fichiers."
    - id: d
      text:
        en: "The label retains the messages posted in the team for a set period, and then it deletes them."
        fr: "L'étiquette conserve les messages publiés dans l'équipe pendant une période définie, puis elle les supprime."
answer: { optionId: c }
explanation:
  correct:
    en: "A sensitivity label applied to a container, such as a team, a Microsoft 365 group or a SharePoint site, controls access to the container: for example its privacy and the access of external users. It doesn't label the items stored inside; documents need their own label to be classified or encrypted."
    fr: "Une étiquette de confidentialité appliquée à un conteneur, comme une équipe, un groupe Microsoft 365 ou un site SharePoint, contrôle l'accès au conteneur : par exemple sa confidentialité et l'accès des utilisateurs externes. Elle n'étiquette pas les éléments stockés à l'intérieur ; les documents ont besoin de leur propre étiquette pour être classifiés ou chiffrés."
  options:
    a:
      en: "Encryption is a setting of labels for files and emails; a container label doesn't encrypt the files stored in the container."
      fr: "Le chiffrement est un paramètre des étiquettes pour les fichiers et les e-mails ; une étiquette de conteneur ne chiffre pas les fichiers stockés dans le conteneur."
    b:
      en: "Items in a labeled container don't inherit the label of the container."
      fr: "Les éléments d'un conteneur étiqueté n'héritent pas de l'étiquette du conteneur."
    d:
      en: "Keeping and deleting Teams messages is the job of a retention policy, not of a sensitivity label."
      fr: "Conserver et supprimer les messages Teams est le rôle d'une stratégie de rétention, pas d'une étiquette de confidentialité."
references:
  - title: Learn about sensitivity labels
    url: https://learn.microsoft.com/en-us/purview/sensitivity-labels
  - title: Describe sensitivity labels and policies in Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/3-describe-sensitivity-labels-policies
