id: sc900-4a-expl-details-yn
objective: "4.3.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about the explorers of Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les explorateurs de Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Content explorer shows the history of the changes that users made to the label of a document."
        fr: "L'Explorateur de contenu montre l'historique des modifications que les utilisateurs ont apportées à l'étiquette d'un document."
    - id: s2
      text:
        en: "The data displayed in Activity explorer comes from the Microsoft 365 audit logs."
        fr: "Les données affichées dans l'Explorateur d'activités proviennent des journaux d'audit de Microsoft 365."
    - id: s3
      text:
        en: "Activity explorer reports on the activities of the last 12 months."
        fr: "L'Explorateur d'activités rend compte des activités des 12 derniers mois."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Content explorer is a snapshot of the current state: which items are labeled or classified, and where. The history of what was done with labeled content, including label changes, is in Activity explorer. Activity explorer gathers its data from the Microsoft 365 unified audit logs and reports on up to 30 days of data."
    fr: "L'Explorateur de contenu est un instantané de l'état actuel : quels éléments sont étiquetés ou classifiés, et où. L'historique de ce qui a été fait du contenu étiqueté, dont les changements d'étiquette, se trouve dans l'Explorateur d'activités. L'Explorateur d'activités tire ses données des journaux d'audit unifiés de Microsoft 365 et rend compte de 30 jours de données au maximum."
references:
  - title: Get started with Activity explorer
    url: https://learn.microsoft.com/en-us/purview/data-classification-activity-explorer
  - title: Get started with content explorer
    url: https://learn.microsoft.com/en-us/purview/data-classification-content-explorer
