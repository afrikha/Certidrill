id: sc900-4a-expl-activity-benefit
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    What is a benefit of Activity explorer in Microsoft Purview?
  fr: |
    Quel est un avantage de l'Explorateur d'activités de Microsoft Purview ?
body:
  options:
    - id: a
      text: { en: "It displays the contents of every item that has a sensitivity label.", fr: "Il affiche le contenu de chaque élément qui a une étiquette de confidentialité." }
    - id: b
      text: { en: "It helps determine whether the protection controls in place are effective.", fr: "Il aide à déterminer si les contrôles de protection en place sont efficaces." }
    - id: c
      text: { en: "It calculates a score for the progress toward regulatory compliance.", fr: "Il calcule un score pour l'avancement vers la conformité réglementaire." }
    - id: d
      text: { en: "It trains classifiers from samples of the documents of the organization.", fr: "Il entraîne des classifieurs à partir d'échantillons des documents de l'organisation." }
answer: { optionId: b }
explanation:
  correct:
    en: "Activity explorer shows what users do with labeled content: label changes, files copied to removable media or to network shares, printing, DLP policy matches. Reviewing these activities lets an organization evaluate whether its controls, such as DLP policies, are effective and where additional protection is needed."
    fr: "L'Explorateur d'activités montre ce que les utilisateurs font du contenu étiqueté : changements d'étiquette, fichiers copiés sur un support amovible ou un partage réseau, impression, correspondances avec des stratégies DLP. Passer ces activités en revue permet à une organisation d'évaluer si ses contrôles, comme les stratégies DLP, sont efficaces et où une protection supplémentaire est nécessaire."
  options:
    a:
      en: "Viewing the contents of classified items is a capability of Content explorer, for users in the appropriate role group."
      fr: "Afficher le contenu des éléments classifiés est une fonctionnalité de l'Explorateur de contenu, pour les utilisateurs du groupe de rôles approprié."
    c:
      en: "The score for regulatory progress is the compliance score of Compliance Manager."
      fr: "Le score d'avancement réglementaire est le score de conformité du Gestionnaire de conformité."
    d:
      en: "Custom trainable classifiers are trained from samples in the classifier creation process, not in Activity explorer."
      fr: "Les classifieurs entraînables personnalisés s'entraînent à partir d'échantillons lors de la création du classifieur, pas dans l'Explorateur d'activités."
references:
  - title: Get started with Activity explorer
    url: https://learn.microsoft.com/en-us/purview/data-classification-activity-explorer
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
