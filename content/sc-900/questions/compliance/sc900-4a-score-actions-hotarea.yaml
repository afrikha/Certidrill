id: sc900-4a-score-actions-hotarea
objective: "4.2.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    In Compliance Manager, Proseware reviews the improvement actions shown in the following table. None of the actions is completed.

    Answer each prompt by selecting the appropriate action.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans le Gestionnaire de conformité, Proseware passe en revue les actions d'amélioration présentées dans le tableau suivant. Aucune action n'est réalisée.

    Répondez à chaque consigne en sélectionnant l'action appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The action that adds the most points to the compliance score when it is completed", fr: "L'action qui ajoute le plus de points au score de conformité une fois réalisée" }
    - id: p2
      text: { en: "The action that monitors systems to identify irregular behaviors or breaches", fr: "L'action qui surveille les systèmes pour repérer des comportements anormaux ou des violations" }
  grid:
    header:
      - { en: "Improvement action", fr: "Action d'amélioration" }
      - { en: "Type", fr: "Type" }
      - { en: "Mandatory or discretionary", fr: "Obligatoire ou discrétionnaire" }
    rows:
      - - { text: Action1, area: a1 }
        - { text: { en: "Preventative", fr: "Préventive" } }
        - { text: { en: "Discretionary", fr: "Discrétionnaire" } }
      - - { text: Action2, area: a2 }
        - { text: { en: "Detective", fr: "Détective" } }
        - { text: { en: "Mandatory", fr: "Obligatoire" } }
      - - { text: Action3, area: a3 }
        - { text: { en: "Preventative", fr: "Préventive" } }
        - { text: { en: "Mandatory", fr: "Obligatoire" } }
      - - { text: Action4, area: a4 }
        - { text: { en: "Corrective", fr: "Corrective" } }
        - { text: { en: "Mandatory", fr: "Obligatoire" } }
answer:
  values: { p1: a3, p2: a2 }
explanation:
  correct:
    en: "Points reflect risk. A preventative action addresses a specific risk and earns more than a detective or corrective action; a mandatory action, which can't be bypassed, earns more than a discretionary one, which relies on users following a policy. Action3, preventative and mandatory, is worth 27 points, against 9 for Action1 and 3 each for Action2 and Action4. A detective action, such as Action2, actively monitors systems to identify irregular conditions or behaviors that represent a risk, or to detect intrusions or breaches; a corrective action such as Action4 limits the effects of an incident that has occurred."
    fr: "Les points reflètent le risque. Une action préventive traite un risque précis et rapporte plus qu'une action détective ou corrective ; une action obligatoire, qui ne peut pas être contournée, rapporte plus qu'une action discrétionnaire, qui dépend du respect d'une règle par les utilisateurs. Action3, préventive et obligatoire, vaut 27 points, contre 9 pour Action1 et 3 chacune pour Action2 et Action4. Une action détective, comme Action2, surveille activement les systèmes pour repérer des conditions ou des comportements anormaux qui représentent un risque, ou pour détecter des intrusions ou des violations ; une action corrective comme Action4 limite les effets d'un incident survenu."
references:
  - title: Compliance Manager scoring
    url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring
