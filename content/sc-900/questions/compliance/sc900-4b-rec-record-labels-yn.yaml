id: sc900-4b-rec-record-labels-yn
objective: "4.3.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about records in Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les enregistrements dans Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A retention label can mark an email as a record."
        fr: "Une étiquette de rétention peut marquer un e-mail comme enregistrement."
    - id: s2
      text:
        en: "A retention label that marks items as records can be applied automatically, without any action from users."
        fr: "Une étiquette de rétention qui marque les éléments comme enregistrements peut être appliquée automatiquement, sans aucune action des utilisateurs."
    - id: s3
      text:
        en: "After an item is marked as a regulatory record, a records administrator can shorten its retention period."
        fr: "Une fois un élément marqué comme enregistrement réglementaire, un administrateur des enregistrements peut raccourcir sa période de rétention."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Records are declared with retention labels, for documents and for emails alike. A label that marks items as records can be applied by users or applied automatically, for example when sensitive information or keywords are found. A regulatory record adds stricter controls: the label can't be removed and the retention period can't be made shorter once the label is applied."
    fr: "Les enregistrements se déclarent avec des étiquettes de rétention, pour les documents comme pour les e-mails. Une étiquette qui marque les éléments comme enregistrements peut être appliquée par les utilisateurs ou appliquée automatiquement, par exemple quand des informations sensibles ou des mots clés sont détectés. Un enregistrement réglementaire ajoute des contrôles plus stricts : l'étiquette ne peut pas être retirée et la période de rétention ne peut pas être raccourcie une fois l'étiquette appliquée."
references:
  - title: Learn about records management
    url: https://learn.microsoft.com/en-us/purview/records-management
  - title: Describe Microsoft Purview Records Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/7-describe-records-management
