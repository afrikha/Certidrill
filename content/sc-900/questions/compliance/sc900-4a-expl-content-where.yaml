id: sc900-4a-expl-content-where
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A compliance administrator of Litware needs to see how many items contain passport numbers and in which SharePoint sites and mailboxes these items are stored.

    What should the administrator use?
  fr: |
    Un administrateur de conformité de Litware a besoin de voir combien d'éléments contiennent des numéros de passeport et dans quels sites SharePoint et quelles boîtes aux lettres ces éléments sont stockés.

    Que doit utiliser l'administrateur ?
body:
  options:
    - id: a
      text: { en: "Activity explorer", fr: "L'Explorateur d'activités" }
    - id: b
      text: { en: "Compliance Manager", fr: "Le Gestionnaire de conformité" }
    - id: c
      text: { en: "Content explorer", fr: "L'Explorateur de contenu" }
    - id: d
      text: { en: "The Service Trust Portal", fr: "Le Portail d'approbation des services" }
answer: { optionId: c }
explanation:
  correct:
    en: "Content explorer shows a current snapshot of the items that have a sensitivity label, a retention label or that are classified as a sensitive information type. It tells how many items are classified as sensitive and where they are stored, by location, in Exchange, SharePoint, OneDrive and Teams."
    fr: "L'Explorateur de contenu montre un instantané actuel des éléments qui ont une étiquette de confidentialité, une étiquette de rétention ou qui sont classifiés comme un type d'informations sensibles. Il indique combien d'éléments sont classifiés comme sensibles et où ils sont stockés, par emplacement, dans Exchange, SharePoint, OneDrive et Teams."
  options:
    a:
      en: "Activity explorer shows what users do with labeled content over time, not the inventory of sensitive items by location."
      fr: "L'Explorateur d'activités montre ce que les utilisateurs font du contenu étiqueté au fil du temps, pas l'inventaire des éléments sensibles par emplacement."
    b:
      en: "Compliance Manager assesses compliance with regulations and tracks improvement actions; it doesn't list the items that contain sensitive data."
      fr: "Le Gestionnaire de conformité évalue la conformité aux réglementations et suit des actions d'amélioration ; il ne liste pas les éléments qui contiennent des données sensibles."
    d:
      en: "The Service Trust Portal publishes compliance documents about Microsoft cloud services; it doesn't look at a customer's content."
      fr: "Le Portail d'approbation des services publie des documents de conformité sur les services cloud Microsoft ; il n'examine pas le contenu d'un client."
references:
  - title: Get started with content explorer
    url: https://learn.microsoft.com/en-us/purview/data-classification-content-explorer
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
