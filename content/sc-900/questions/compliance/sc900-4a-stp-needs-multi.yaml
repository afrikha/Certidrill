id: sc900-4a-stp-needs-multi
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans to move regulated data to Microsoft cloud services and has several needs.

    Which two needs does the Service Trust Portal meet?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit de déplacer des données réglementées vers les services cloud Microsoft et a plusieurs besoins.

    Quels sont les deux besoins auxquels le Portail d'approbation des services répond ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Find documents on how Microsoft cloud services address the GDPR", fr: "Trouver des documents sur la façon dont les services cloud Microsoft prennent en compte le RGPD" }
    - id: b
      text: { en: "Assign improvement actions to the administrators of Wingtip Toys", fr: "Attribuer des actions d'amélioration aux administrateurs de Wingtip Toys" }
    - id: c
      text: { en: "Read the business continuity and disaster recovery documents of Microsoft cloud services", fr: "Lire les documents de continuité d'activité et de reprise d'activité des services cloud Microsoft" }
    - id: d
      text: { en: "Identify the documents of Wingtip Toys that contain credit card numbers", fr: "Identifier les documents de Wingtip Toys qui contiennent des numéros de carte de crédit" }
    - id: e
      text: { en: "Search the activities that the users of Wingtip Toys performed in Microsoft 365", fr: "Rechercher les activités que les utilisateurs de Wingtip Toys ont effectuées dans Microsoft 365" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The Service Trust Portal publishes information about the compliance of Microsoft cloud services. Its Certifications, Regulations, and Standards category covers regulations such as the GDPR, and its Reports, Whitepapers, and Artifacts category includes business continuity and disaster recovery documents. The portal doesn't examine the data or the activities of a customer tenant."
    fr: "Le Portail d'approbation des services publie des informations sur la conformité des services cloud Microsoft. Sa catégorie Certifications, réglementations et normes couvre des réglementations comme le RGPD, et sa catégorie Rapports, livres blancs et artefacts comprend des documents de continuité d'activité et de reprise d'activité. Le portail n'examine ni les données ni les activités du locataire d'un client."
  options:
    b:
      en: "Improvement actions are assigned to users in Compliance Manager, which assesses the organization's own compliance."
      fr: "Les actions d'amélioration sont attribuées à des utilisateurs dans le Gestionnaire de conformité, qui évalue la conformité de l'organisation elle-même."
    d:
      en: "Finding the items of the tenant that contain a sensitive information type is the role of Content explorer in Microsoft Purview."
      fr: "Trouver les éléments du locataire qui contiennent un type d'informations sensibles est le rôle de l'Explorateur de contenu dans Microsoft Purview."
    e:
      en: "User and administrator activities are searched with Microsoft Purview Audit, not in the Service Trust Portal."
      fr: "Les activités des utilisateurs et des administrateurs se recherchent avec Audit Microsoft Purview, pas dans le Portail d'approbation des services."
references:
  - title: Get started with the Microsoft Service Trust Portal
    url: https://learn.microsoft.com/en-us/purview/get-started-with-service-trust-portal
  - title: Describe the offerings of the Service Trust portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal
