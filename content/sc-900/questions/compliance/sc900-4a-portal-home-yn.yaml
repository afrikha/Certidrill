id: sc900-4a-portal-home-yn
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the Microsoft Purview portal, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le portail Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The user accounts and the groups of the organization are created in the Microsoft Purview portal."
        fr: "Les comptes d'utilisateur et les groupes de l'organisation se créent dans le portail Microsoft Purview."
    - id: s2
      text:
        en: "The Microsoft Purview portal replaces the Microsoft Purview compliance portal."
        fr: "Le portail Microsoft Purview remplace le portail de conformité Microsoft Purview."
    - id: s3
      text:
        en: "The Microsoft Purview portal lists related portals, such as the Microsoft Defender portal and the Service Trust Portal."
        fr: "Le portail Microsoft Purview liste des portails associés, comme le portail Microsoft Defender et le Portail d'approbation des services."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Users and groups are created in the Microsoft Entra admin center; the Microsoft Purview portal manages the roles and permissions of its own solutions. The features of the retired Microsoft Purview compliance portal and of the classic governance portal moved to the Microsoft Purview portal. Its Solutions page includes a list of related portals: Microsoft Defender, Microsoft Entra, Microsoft Fabric, Microsoft Priva and Microsoft Service Trust."
    fr: "Les utilisateurs et les groupes se créent dans le Centre d'administration Microsoft Entra ; le portail Microsoft Purview gère les rôles et les autorisations de ses propres solutions. Les fonctionnalités du portail de conformité Microsoft Purview, mis hors service, et du portail de gouvernance classique ont été déplacées dans le portail Microsoft Purview. Sa page Solutions comprend une liste de portails associés : Microsoft Defender, Microsoft Entra, Microsoft Fabric, Microsoft Priva et Microsoft Service Trust."
references:
  - title: Learn about the Microsoft Purview portal
    url: https://learn.microsoft.com/en-us/purview/purview-portal
