id: sc900-4b-dlp-basics-yn
objective: "4.3.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about data loss prevention (DLP) in Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la protection contre la perte de données (DLP) de Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The purpose of a DLP policy is to keep sensitive items for a fixed period and then delete them."
        fr: "Le but d'une stratégie DLP est de conserver les éléments sensibles pendant une période fixe, puis de les supprimer."
    - id: s2
      text:
        en: "A DLP policy can protect sensitive items in Microsoft Teams chat and channel messages."
        fr: "Une stratégie DLP peut protéger les éléments sensibles dans les messages de conversation et de canal Microsoft Teams."
    - id: s3
      text:
        en: "A DLP policy can protect sensitive items that are stored in on-premises file shares."
        fr: "Une stratégie DLP peut protéger les éléments sensibles stockés dans des partages de fichiers locaux."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "DLP helps prevent users from sharing sensitive data inappropriately: its policies identify, monitor and automatically protect sensitive items. Keeping content for a period and deleting it is the role of retention policies and retention labels. DLP policies apply to Microsoft 365 services, including Exchange, SharePoint, OneDrive and Teams chat and channel messages, and also to Office apps, devices, on-premises file shares and on-premises SharePoint."
    fr: "La DLP aide à empêcher les utilisateurs de partager des données sensibles de façon inappropriée : ses stratégies identifient, surveillent et protègent automatiquement les éléments sensibles. Conserver du contenu pendant une période puis le supprimer est le rôle des stratégies de rétention et des étiquettes de rétention. Les stratégies DLP s'appliquent aux services Microsoft 365, dont Exchange, SharePoint, OneDrive et les messages de conversation et de canal Teams, mais aussi aux applications Office, aux appareils, aux partages de fichiers locaux et à SharePoint local."
references:
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
  - title: Describe data loss prevention in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/4-describe-data-loss-prevention
