id: sc900-4b-rec-regulatory
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A regulator requires Woodgrove Bank to keep loan agreements for ten years. Once a loan agreement is labeled, nobody, not even a Global Administrator, must be able to remove the label.

    What should Woodgrove Bank apply to the loan agreements?
  fr: |
    Un régulateur impose à Woodgrove Bank de conserver les contrats de prêt pendant dix ans. Une fois un contrat de prêt étiqueté, personne, pas même un Global Administrator, ne doit pouvoir retirer l'étiquette.

    Que doit appliquer Woodgrove Bank aux contrats de prêt ?
body:
  options:
    - id: a
      text: { en: "A retention label that marks items as a record", fr: "Une étiquette de rétention qui marque les éléments comme enregistrement" }
    - id: b
      text: { en: "A retention label that marks items as a regulatory record", fr: "Une étiquette de rétention qui marque les éléments comme enregistrement réglementaire" }
    - id: c
      text: { en: "A sensitivity label that encrypts the labeled items", fr: "Une étiquette de confidentialité qui chiffre les éléments étiquetés" }
    - id: d
      text: { en: "A retention policy that retains items for ten years", fr: "Une stratégie de rétention qui conserve les éléments pendant dix ans" }
answer: { optionId: b }
explanation:
  correct:
    en: "A regulatory record has the strictest controls. After the label is applied to an item, nobody, not even a global administrator, can remove it, and the retention period can't be made shorter."
    fr: "Un enregistrement réglementaire a les contrôles les plus stricts. Une fois l'étiquette appliquée à un élément, personne, pas même un administrateur général, ne peut la retirer, et la période de rétention ne peut pas être raccourcie."
  options:
    a:
      en: "A record that isn't regulatory has fewer restrictions: for example, the administrator of the site that stores a locked record can still remove its label."
      fr: "Un enregistrement qui n'est pas réglementaire a moins de restrictions : par exemple, l'administrateur du site qui stocke un enregistrement verrouillé peut encore retirer son étiquette."
    c:
      en: "A sensitivity label controls who can open an item; it doesn't set how long the item is kept, and it can be changed."
      fr: "Une étiquette de confidentialité contrôle qui peut ouvrir un élément ; elle ne fixe pas sa durée de conservation, et elle peut être changée."
    d:
      en: "A retention policy applies at the level of a site or mailbox and puts no label on items; an administrator can also modify or remove the policy."
      fr: "Une stratégie de rétention s'applique au niveau d'un site ou d'une boîte aux lettres et ne place aucune étiquette sur les éléments ; un administrateur peut aussi modifier ou supprimer la stratégie."
references:
  - title: Learn about records management
    url: https://learn.microsoft.com/en-us/purview/records-management
  - title: Describe Microsoft Purview Records Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/7-describe-records-management
