id: sc900-4b-dlp-teams-passport
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At Fabrikam, an employee pastes the passport number of a customer into a Microsoft Teams chat with a guest. Fabrikam wants such messages to be blocked automatically and the sender to be told why.

    What should Fabrikam use?
  fr: |
    Chez Fabrikam, un employé colle le numéro de passeport d'un client dans une conversation Microsoft Teams avec un invité. Fabrikam veut que de tels messages soient bloqués automatiquement et que l'expéditeur en connaisse la raison.

    Que doit utiliser Fabrikam ?
body:
  options:
    - { id: a, text: { en: "A retention policy", fr: "Une stratégie de rétention" } }
    - { id: b, text: { en: "An eDiscovery hold", fr: "Une mise en attente eDiscovery" } }
    - { id: c, text: { en: "An audit log retention policy", fr: "Une stratégie de rétention des journaux d'audit" } }
    - { id: d, text: { en: "A data loss prevention (DLP) policy", fr: "Une stratégie de protection contre la perte de données (DLP)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A DLP policy identifies, monitors and automatically protects sensitive items, including in Teams chat and channel messages. When a message contains sensitive information that the policy covers, the information isn't displayed to the recipients and a policy tip explains to the sender why the message was blocked."
    fr: "Une stratégie DLP identifie, surveille et protège automatiquement les éléments sensibles, y compris dans les messages de conversation et de canal Teams. Quand un message contient des informations sensibles couvertes par la stratégie, elles ne sont pas affichées aux destinataires et un conseil de stratégie explique à l'expéditeur pourquoi le message a été bloqué."
  options:
    a:
      en: "A retention policy keeps or deletes Teams messages after a period; it doesn't inspect them for sensitive information."
      fr: "Une stratégie de rétention conserve ou supprime les messages Teams après une période ; elle n'y recherche pas d'informations sensibles."
    b:
      en: "An eDiscovery hold preserves content for an investigation; it doesn't stop a message from being shared."
      fr: "Une mise en attente eDiscovery préserve du contenu pour une investigation ; elle n'empêche pas le partage d'un message."
    c:
      en: "An audit log retention policy sets how long audit records are kept."
      fr: "Une stratégie de rétention des journaux d'audit fixe la durée de conservation des enregistrements d'audit."
references:
  - title: Describe data loss prevention in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/4-describe-data-loss-prevention
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
