id: sc900-4b-audit-premium-adds-multi
objective: "4.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Audit (Standard) and considers Audit (Premium).

    Which two capabilities does Audit (Premium) add to Audit (Standard)? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Audit (Standard) et envisage Audit (Premium).

    Quelles sont les deux fonctionnalités qu'Audit (Premium) ajoute à Audit (Standard) ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The audit log search tool in the Microsoft Purview portal", fr: "L'outil de recherche dans le journal d'audit du portail Microsoft Purview" } }
    - { id: b, text: { en: "Intelligent insights, such as what a user searched for in Exchange Online", fr: "Des insights intelligents, comme ce qu'un utilisateur a recherché dans Exchange Online" } }
    - { id: c, text: { en: "The export of audit records to a CSV file", fr: "L'exportation des enregistrements d'audit dans un fichier CSV" } }
    - { id: d, text: { en: "Auditing that is enabled by default", fr: "Un audit activé par défaut" } }
    - { id: e, text: { en: "Higher bandwidth access to the Office 365 Management Activity API", fr: "Un accès à bande passante supérieure à l'API Activité de gestion Office 365" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Audit (Premium) includes everything in Audit (Standard) and adds audit log retention policies, longer retention of audit records, intelligent insights that help determine the scope of a possible breach, and higher bandwidth access to the Office 365 Management Activity API, which lets an organization pull audit data faster."
    fr: "Audit (Premium) comprend tout Audit (Standard) et ajoute les stratégies de rétention des journaux d'audit, une rétention plus longue des enregistrements d'audit, des insights intelligents qui aident à déterminer l'étendue d'une éventuelle violation, et un accès à bande passante supérieure à l'API Activité de gestion Office 365, qui permet à une organisation de récupérer plus vite les données d'audit."
  options:
    a:
      en: "The audit log search tool is already part of Audit (Standard)."
      fr: "L'outil de recherche dans le journal d'audit fait déjà partie d'Audit (Standard)."
    c:
      en: "Exporting audit records to a CSV file is already possible with Audit (Standard)."
      fr: "L'exportation des enregistrements d'audit dans un fichier CSV est déjà possible avec Audit (Standard)."
    d:
      en: "Audit (Standard) is already enabled by default for organizations that have the appropriate subscription."
      fr: "Audit (Standard) est déjà activé par défaut pour les organisations qui ont l'abonnement approprié."
references:
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
  - title: Describe audit in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/2-describe-audit
