id: sc900-4a-stp-categories-yn
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the content categories of the Service Trust Portal, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les catégories de contenu du Portail d'approbation des services, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Resources for your Organization category shows the same documents to every Microsoft customer."
        fr: "La catégorie Ressources pour votre organisation montre les mêmes documents à tous les clients de Microsoft."
    - id: s2
      text:
        en: "The Industry and Regional Resources category contains documents intended for financial services organizations."
        fr: "La catégorie Ressources sectorielles et régionales contient des documents destinés aux organisations de services financiers."
    - id: s3
      text:
        en: "The Certifications, Regulations, and Standards category contains information related to standards such as ISO/IEC and SOC."
        fr: "La catégorie Certifications, réglementations et normes contient des informations relatives à des normes comme ISO/IEC et SOC."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Resources for your Organization lists documents that are restricted by tenant, based on the subscription and the permissions of the organization: two customers don't necessarily see the same documents. Industry and Regional Resources contains documents by industry, including financial services, healthcare and life sciences, media and entertainment and United States government, and by region. Certifications, Regulations, and Standards shows how Microsoft cloud services meet standards and regulations such as ISO/IEC, SOC, GDPR, FedRAMP and PCI DSS."
    fr: "Ressources pour votre organisation liste des documents restreints par locataire, selon l'abonnement et les autorisations de l'organisation : deux clients ne voient pas forcément les mêmes documents. Ressources sectorielles et régionales contient des documents par secteur, dont les services financiers, les soins de santé et les sciences de la vie, les médias et le divertissement et le gouvernement des États-Unis, et par région. Certifications, réglementations et normes montre comment les services cloud Microsoft respectent des normes et des réglementations comme ISO/IEC, SOC, le RGPD, FedRAMP et PCI DSS."
references:
  - title: Describe the offerings of the Service Trust portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal
  - title: Get started with the Microsoft Service Trust Portal
    url: https://learn.microsoft.com/en-us/purview/get-started-with-service-trust-portal
