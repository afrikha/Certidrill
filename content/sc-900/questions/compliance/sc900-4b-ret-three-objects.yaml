id: sc900-4b-ret-three-objects
objective: "4.3.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences about retention in Microsoft Purview, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur la rétention dans Microsoft Purview, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[item]] assigns retention settings to an individual item, such as a document or an email.

      [[container]] assigns the same retention settings to all the content of a location, such as a site or a mailbox.

      [[publish]] makes retention labels available in chosen locations, so that users can apply them.
    fr: |
      [[item]] attribue des paramètres de rétention à un élément précis, comme un document ou un e-mail.

      [[container]] attribue les mêmes paramètres de rétention à tout le contenu d'un emplacement, comme un site ou une boîte aux lettres.

      [[publish]] rend des étiquettes de rétention disponibles dans des emplacements choisis, afin que les utilisateurs puissent les appliquer.
  slots:
    - id: item
      options:
        - { id: policy, text: { en: "A retention policy", fr: "Une stratégie de rétention" } }
        - { id: label, text: { en: "A retention label", fr: "Une étiquette de rétention" } }
        - { id: labelpolicy, text: { en: "A retention label policy", fr: "Une stratégie d'étiquette de rétention" } }
    - id: container
      options:
        - { id: policy, text: { en: "A retention policy", fr: "Une stratégie de rétention" } }
        - { id: label, text: { en: "A retention label", fr: "Une étiquette de rétention" } }
        - { id: labelpolicy, text: { en: "A retention label policy", fr: "Une stratégie d'étiquette de rétention" } }
    - id: publish
      options:
        - { id: policy, text: { en: "A retention policy", fr: "Une stratégie de rétention" } }
        - { id: label, text: { en: "A retention label", fr: "Une étiquette de rétention" } }
        - { id: labelpolicy, text: { en: "A retention label policy", fr: "Une stratégie d'étiquette de rétention" } }
answer:
  values: { item: label, container: policy, publish: labelpolicy }
explanation:
  correct:
    en: "A retention label works at the item level: a folder, a document or an email, and different items of the same location can have different settings. A retention policy works at the level of a site or a mailbox, and every item inherits the settings of its container. Retention labels are published through a retention label policy, which specifies the locations where the labels can be used."
    fr: "Une étiquette de rétention agit au niveau de l'élément : un dossier, un document ou un e-mail, et des éléments d'un même emplacement peuvent avoir des paramètres différents. Une stratégie de rétention agit au niveau d'un site ou d'une boîte aux lettres, et chaque élément hérite des paramètres de son conteneur. Les étiquettes de rétention sont publiées par une stratégie d'étiquette de rétention, qui précise les emplacements où les étiquettes peuvent être utilisées."
references:
  - title: Describe Data Lifecycle Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/6-describe-data-lifecycle-management
  - title: Learn about retention policies and retention labels
    url: https://learn.microsoft.com/en-us/purview/retention
