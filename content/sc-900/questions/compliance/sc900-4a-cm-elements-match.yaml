id: sc900-4a-cm-elements-match
objective: "4.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the element of Compliance Manager that it defines.

    To answer, drag the appropriate element to each description. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à l'élément du Gestionnaire de conformité qu'elle définit.

    Pour répondre, faites glisser l'élément approprié vers chaque description. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: assess, text: { en: "Assessment", fr: "Évaluation" } }
    - { id: action, text: { en: "Improvement action", fr: "Action d'amélioration" } }
    - { id: ctrl, text: { en: "Control", fr: "Contrôle" } }
    - { id: score, text: { en: "Compliance score", fr: "Score de conformité" } }
    - { id: template, text: { en: "Regulatory template", fr: "Modèle de réglementation" } }
  targets:
    - id: t1
      text: { en: "A requirement of a regulation, standard or policy", fr: "Une exigence d'une réglementation, d'une norme ou d'une stratégie" }
    - id: t2
      text: { en: "Recommended guidance that can be assigned to a user and that stores evidence and notes", fr: "Une recommandation qui peut être attribuée à un utilisateur et qui conserve des preuves et des notes" }
    - id: t3
      text: { en: "A grouping of controls from a specific regulation, standard or policy", fr: "Un regroupement de contrôles issus d'une réglementation, d'une norme ou d'une stratégie précise" }
answer:
  mapping: { t1: ctrl, t2: action, t3: assess }
explanation:
  correct:
    en: "A control is a requirement of a regulation, standard or policy: it defines how to assess and manage system configuration, organizational process and the people responsible for meeting the requirement. An improvement action is recommended guidance that helps meet a control; it can be assigned to a user and keeps the evidence, the notes and the status updates. An assessment groups the controls of one regulation, standard or policy, for example ISO/IEC 27001."
    fr: "Un contrôle est une exigence d'une réglementation, d'une norme ou d'une stratégie : il définit comment évaluer et gérer la configuration des systèmes, les processus de l'organisation et les personnes chargées de satisfaire l'exigence. Une action d'amélioration est une recommandation qui aide à satisfaire un contrôle ; elle peut être attribuée à un utilisateur et conserve les preuves, les notes et les mises à jour d'état. Une évaluation regroupe les contrôles d'une réglementation, d'une norme ou d'une stratégie, par exemple ISO/IEC 27001."
  options:
    score:
      en: "The compliance score measures the progress in completing improvement actions."
      fr: "Le score de conformité mesure l'avancement dans la réalisation des actions d'amélioration."
    template:
      en: "A regulatory template is the model, provided for a regulation or certification, from which an assessment is created."
      fr: "Un modèle de réglementation est le modèle, fourni pour une réglementation ou une certification, à partir duquel une évaluation est créée."
references:
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
