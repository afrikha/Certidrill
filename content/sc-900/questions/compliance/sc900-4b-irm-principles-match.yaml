id: sc900-4b-irm-principles-match
objective: "4.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Microsoft Purview Insider Risk Management is built on four principles.

    Match each description to the principle that it describes. To answer, drag the appropriate principle to each description. Each principle may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    La gestion des risques internes Microsoft Purview repose sur quatre principes.

    Associez chaque description au principe qu'elle décrit. Pour répondre, faites glisser le principe approprié vers chaque description. Chaque principe peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: integrated, text: { en: "Integrated", fr: "Intégré" } }
    - { id: transparency, text: { en: "Transparency", fr: "Transparence" } }
    - { id: actionable, text: { en: "Actionable", fr: "Actionnable" } }
    - { id: configurable, text: { en: "Configurable", fr: "Configurable" } }
  targets:
    - id: t1
      text: { en: "The privacy of users is balanced against the risk for the organization, with a privacy-by-design architecture.", fr: "La vie privée des utilisateurs est mise en balance avec le risque pour l'organisation, grâce à une architecture de confidentialité dès la conception." }
    - id: t2
      text: { en: "Policies are adapted to the industry, the geography and the business groups.", fr: "Les stratégies sont adaptées au secteur, à la zone géographique et aux groupes métier." }
    - id: t3
      text: { en: "Insights enable reviewer notifications, data investigations and user investigations.", fr: "Des informations permettent des notifications aux réviseurs, des investigations sur les données et des investigations sur les utilisateurs." }
answer:
  mapping: { t1: transparency, t2: configurable, t3: actionable }
explanation:
  correct:
    en: "Transparency balances user privacy against organizational risk through privacy by design; for example, users are pseudonymized by default. Configurable means that policies can be set according to industry, geography and business groups. Actionable means that the solution gives insights that lead to reviewer notifications, data investigations and user investigations. The fourth principle, integrated, refers to a workflow that is integrated across Microsoft Purview solutions."
    fr: "La transparence met en balance la vie privée des utilisateurs et le risque pour l'organisation grâce à la confidentialité dès la conception ; par exemple, les utilisateurs sont pseudonymisés par défaut. Configurable signifie que les stratégies se règlent selon le secteur, la zone géographique et les groupes métier. Actionnable signifie que la solution fournit des informations qui débouchent sur des notifications aux réviseurs, des investigations sur les données et des investigations sur les utilisateurs. Le quatrième principe, intégré, désigne un flux de travail intégré à travers les solutions Microsoft Purview."
references:
  - title: Describe insider risk management in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/5-describe-insider-risk-management
  - title: Learn about Insider Risk Management
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management
