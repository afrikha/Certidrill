id: sc900-4a-priv-government-yn
objective: "4.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A government agency asks Microsoft for data that Adatum stores in Microsoft cloud services.

    For each of the following statements about the privacy principles of Microsoft, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une agence gouvernementale demande à Microsoft des données qu'Adatum stocke dans les services cloud Microsoft.

    Pour chacune des affirmations suivantes sur les principes de confidentialité de Microsoft, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft refuses to disclose the data even when the law requires the disclosure."
        fr: "Microsoft refuse de divulguer les données même quand la loi exige leur divulgation."
    - id: s2
      text:
        en: "When it is legally permitted, Microsoft notifies Adatum of the request."
        fr: "Quand la loi le permet, Microsoft informe Adatum de la demande."
    - id: s3
      text:
        en: "The position of Microsoft is that the agency should address its request to Microsoft rather than to Adatum."
        fr: "La position de Microsoft est que l'agence doit adresser sa demande à Microsoft plutôt qu'à Adatum."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Microsoft doesn't give any government direct or unfettered access to customer data, and it challenges government requests where it can lawfully do so. However, it doesn't promise never to disclose: it won't disclose data unless the customer directs it to or the law requires it. Where legally permitted, Microsoft promptly notifies the customer and provides a copy of the request. Its position is that government requests for a customer's data should be directed to the customer, not to Microsoft."
    fr: "Microsoft ne donne à aucun gouvernement un accès direct ou sans entrave aux données des clients, et conteste les demandes gouvernementales quand la loi le lui permet. En revanche, il ne promet pas de ne jamais divulguer : il ne divulgue pas de données, sauf sur instruction du client ou quand la loi l'exige. Quand la loi le permet, Microsoft informe rapidement le client et lui fournit une copie de la demande. Sa position est que les demandes gouvernementales portant sur les données d'un client doivent être adressées au client, pas à Microsoft."
references:
  - title: Describe Microsoft's privacy principles
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles
