id: sc900-4b-audit-ten-years
objective: "4.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A regulation requires Woodgrove Bank to keep the audit records of its traders for seven years.

    What should Woodgrove Bank use?
  fr: |
    Une réglementation impose à Woodgrove Bank de garder pendant sept ans les enregistrements d'audit de ses traders.

    Que doit utiliser Woodgrove Bank ?
body:
  options:
    - id: a
      text: { en: "The default audit log retention policy of Audit (Premium)", fr: "La stratégie de rétention des journaux d'audit par défaut d'Audit (Premium)" }
    - id: b
      text: { en: "A retention policy for the Exchange mailboxes of the traders", fr: "Une stratégie de rétention pour les boîtes aux lettres Exchange des traders" }
    - id: c
      text: { en: "A retention label that marks audit records as regulatory records", fr: "Une étiquette de rétention qui marque les enregistrements d'audit comme enregistrements réglementaires" }
    - id: d
      text: { en: "An audit log retention policy with the 10-year retention add-on license", fr: "Une stratégie de rétention des journaux d'audit avec la licence de module complémentaire de rétention sur 10 ans" }
answer: { optionId: d }
explanation:
  correct:
    en: "With Audit (Premium), audit log retention policies keep audit records for up to one year, and for up to 10 years for the users who have the required add-on license. A policy can target specific users, which fits the traders."
    fr: "Avec Audit (Premium), les stratégies de rétention des journaux d'audit gardent les enregistrements d'audit jusqu'à un an, et jusqu'à 10 ans pour les utilisateurs qui ont la licence de module complémentaire requise. Une stratégie peut cibler des utilisateurs précis, ce qui convient aux traders."
  options:
    a:
      en: "The default policy of Audit (Premium) keeps Microsoft Entra ID, Exchange, OneDrive and SharePoint records for one year, not seven."
      fr: "La stratégie par défaut d'Audit (Premium) garde un an, et non sept, les enregistrements Microsoft Entra ID, Exchange, OneDrive et SharePoint."
    b:
      en: "A retention policy for mailboxes retains emails; audit records aren't stored in the mailboxes of the users."
      fr: "Une stratégie de rétention pour les boîtes aux lettres conserve des e-mails ; les enregistrements d'audit ne sont pas stockés dans les boîtes aux lettres des utilisateurs."
    c:
      en: "Retention labels apply to items such as documents and emails; the retention of audit records is set with audit log retention policies."
      fr: "Les étiquettes de rétention s'appliquent à des éléments comme les documents et les e-mails ; la rétention des enregistrements d'audit se règle avec des stratégies de rétention des journaux d'audit."
references:
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
  - title: Describe audit in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/2-describe-audit
