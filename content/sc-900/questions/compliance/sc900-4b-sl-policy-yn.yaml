id: sc900-4b-sl-policy-yn
objective: "4.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about sensitivity label policies, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les stratégies d'étiquetage de confidentialité, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A sensitivity label becomes available in the Office apps of a user after a label policy publishes it to the user."
        fr: "Une étiquette de confidentialité devient disponible dans les applications Office d'un utilisateur une fois qu'une stratégie d'étiquetage l'a publiée pour cet utilisateur."
    - id: s2
      text:
        en: "A sensitivity label policy sets how long labeled documents are retained before they are deleted."
        fr: "Une stratégie d'étiquetage de confidentialité fixe la durée pendant laquelle les documents étiquetés sont conservés avant d'être supprimés."
    - id: s3
      text:
        en: "A user can replace the default label that a label policy applied to a new document."
        fr: "Un utilisateur peut remplacer l'étiquette par défaut qu'une stratégie d'étiquetage a appliquée à un nouveau document."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Sensitivity labels do nothing until a label policy publishes them to users or groups; they then appear in the Office apps of those users. A label policy can set a default label, but the user can change it when the document or email is mislabeled. Retention periods aren't part of sensitivity labeling: they are set with retention labels and retention policies."
    fr: "Les étiquettes de confidentialité ne font rien tant qu'une stratégie d'étiquetage ne les a pas publiées pour des utilisateurs ou des groupes ; elles apparaissent alors dans les applications Office de ces utilisateurs. Une stratégie d'étiquetage peut définir une étiquette par défaut, mais l'utilisateur peut la changer si le document ou l'e-mail est mal étiqueté. Les périodes de rétention ne relèvent pas des étiquettes de confidentialité : elles se définissent avec des étiquettes de rétention et des stratégies de rétention."
references:
  - title: Describe sensitivity labels and policies in Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/3-describe-sensitivity-labels-policies
  - title: Learn about sensitivity labels
    url: https://learn.microsoft.com/en-us/purview/sensitivity-labels
