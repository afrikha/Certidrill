id: sc900-4a-class-trainable-contracts
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam wants to identify its supplier contracts automatically. The contracts contain no common pattern or keyword, but Fabrikam can provide hundreds of examples of them.

    What should Fabrikam create?
  fr: |
    Fabrikam veut identifier automatiquement ses contrats fournisseurs. Les contrats ne contiennent ni modèle ni mot clé commun, mais Fabrikam peut en fournir des centaines d'exemples.

    Que doit créer Fabrikam ?
body:
  options:
    - id: a
      text: { en: "A custom sensitive information type", fr: "Un type d'informations sensibles personnalisé" }
    - id: b
      text: { en: "An exact data match (EDM) sensitive information type", fr: "Un type d'informations sensibles à correspondance exacte des données (EDM)" }
    - id: c
      text: { en: "A named entity sensitive information type", fr: "Un type d'informations sensibles d'entité nommée" }
    - id: d
      text: { en: "A custom trainable classifier", fr: "Un classifieur entraînable personnalisé" }
answer: { optionId: d }
explanation:
  correct:
    en: "Trainable classifiers use machine learning to classify an item based on what it is, not on a pattern. They suit content that is unique to an organization, such as its contracts or invoices. For a custom trainable classifier, the organization provides samples of the content to recognize."
    fr: "Les classifieurs entraînables utilisent le machine learning pour classifier un élément selon ce qu'il est, et non selon un modèle. Ils conviennent au contenu propre à une organisation, comme ses contrats ou ses factures. Pour un classifieur entraînable personnalisé, l'organisation fournit des échantillons du contenu à reconnaître."
  options:
    a:
      en: "A custom sensitive information type is built from regular expressions, keywords and keyword dictionaries; the contracts have no such pattern."
      fr: "Un type d'informations sensibles personnalisé se construit à partir d'expressions régulières, de mots clés et de dictionnaires de mots clés ; les contrats n'ont pas de modèle de ce genre."
    b:
      en: "Exact data match looks for exact values taken from a database of sensitive information, not for a category of documents."
      fr: "La correspondance exacte des données recherche des valeurs exactes tirées d'une base d'informations sensibles, pas une catégorie de documents."
    c:
      en: "Named entity sensitive information types are provided by Microsoft to detect person names, physical addresses and medical terms; they can't be created."
      fr: "Les types d'informations sensibles d'entité nommée sont fournis par Microsoft pour détecter des noms de personnes, des adresses postales et des termes médicaux ; ils ne peuvent pas être créés."
references:
  - title: Learn about trainable classifiers
    url: https://learn.microsoft.com/en-us/purview/trainable-classifiers-learn-about
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
