id: sc900-4a-expl-compare-yn
objective: "4.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the explorers of Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les explorateurs de Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Content explorer shows the items that have a sensitivity label, a retention label or a sensitive information type."
        fr: "L'Explorateur de contenu montre les éléments qui ont une étiquette de confidentialité, une étiquette de rétention ou un type d'informations sensibles."
    - id: s2
      text:
        en: "Activity explorer is the tool used to create and publish sensitivity labels."
        fr: "L'Explorateur d'activités est l'outil qui sert à créer et à publier des étiquettes de confidentialité."
    - id: s3
      text:
        en: "Activity explorer shows activities such as the copy of a labeled file to removable media."
        fr: "L'Explorateur d'activités montre des activités comme la copie d'un fichier étiqueté sur un support amovible."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Content explorer gives a current snapshot of the items that have a sensitivity label, a retention label or that are classified as a sensitive information type. Activity explorer is a reporting tool: it shows the activities on labeled content, such as label changes, files copied to removable media or network shares and printing. Sensitivity labels are created and published with label policies in Microsoft Purview Information Protection, not in an explorer."
    fr: "L'Explorateur de contenu donne un instantané actuel des éléments qui ont une étiquette de confidentialité, une étiquette de rétention ou qui sont classifiés comme un type d'informations sensibles. L'Explorateur d'activités est un outil de rapport : il montre les activités sur le contenu étiqueté, comme les changements d'étiquette, la copie de fichiers sur un support amovible ou un partage réseau et l'impression. Les étiquettes de confidentialité se créent et se publient avec des stratégies d'étiquetage dans Protection des informations Microsoft Purview, pas dans un explorateur."
references:
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
