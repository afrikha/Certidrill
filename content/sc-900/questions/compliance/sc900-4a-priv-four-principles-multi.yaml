id: sc900-4a-priv-four-principles-multi
objective: "4.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two statements are privacy principles of Microsoft?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations qui sont des principes de confidentialité de Microsoft ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Verify explicitly", fr: "Vérifier explicitement" }
    - id: b
      text: { en: "You control your data", fr: "Vous contrôlez vos données" }
    - id: c
      text: { en: "Assume breach", fr: "Supposer une violation" }
    - id: d
      text: { en: "Use least privilege access", fr: "Utiliser l'accès selon le moindre privilège" }
    - id: e
      text: { en: "Microsoft defends your data", fr: "Microsoft défend vos données" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Microsoft states its approach to privacy in four principles: you control your data, you know where your data is located, your data is secured at rest and in transit, and Microsoft defends your data. They describe what Microsoft commits to as a cloud provider."
    fr: "Microsoft énonce son approche de la confidentialité en quatre principes : vous contrôlez vos données, vous savez où elles se trouvent, elles sont sécurisées au repos et en transit, et Microsoft défend vos données. Ils décrivent ce à quoi Microsoft s'engage en tant que fournisseur de cloud."
  options:
    a:
      en: "Verify explicitly is a guiding principle of the Zero Trust model: always authenticate and authorize based on all available data points."
      fr: "Vérifier explicitement est un principe directeur du modèle Confiance Zéro : toujours authentifier et autoriser en fonction de tous les points de données disponibles."
    c:
      en: "Assume breach is a guiding principle of the Zero Trust model, not a privacy principle."
      fr: "Supposer une violation est un principe directeur du modèle Confiance Zéro, pas un principe de confidentialité."
    d:
      en: "Least privilege access is a guiding principle of the Zero Trust model: it limits user access to what is needed."
      fr: "L'accès selon le moindre privilège est un principe directeur du modèle Confiance Zéro : il limite l'accès des utilisateurs à ce qui est nécessaire."
references:
  - title: Describe Microsoft's privacy principles
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles
