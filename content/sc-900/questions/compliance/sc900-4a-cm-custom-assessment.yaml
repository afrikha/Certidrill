id: sc900-4a-cm-custom-assessment
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware must track its compliance with an internal security policy. None of the regulations that Compliance Manager provides corresponds to this policy.

    What should Litware do?
  fr: |
    Litware doit suivre sa conformité à une stratégie de sécurité interne. Aucune des réglementations fournies par le Gestionnaire de conformité ne correspond à cette stratégie.

    Que doit faire Litware ?
body:
  options:
    - id: a
      text: { en: "Request a new audit report", fr: "Demander un nouveau rapport d'audit" }
    - id: b
      text: { en: "Create a custom assessment", fr: "Créer une évaluation personnalisée" }
    - id: c
      text: { en: "Create a custom sensitive information type", fr: "Créer un type d'informations sensibles personnalisé" }
    - id: d
      text: { en: "Create a custom trainable classifier", fr: "Créer un classifieur entraînable personnalisé" }
answer: { optionId: b }
explanation:
  correct:
    en: "Besides its prebuilt assessments, based on more than 360 regulatory templates, Compliance Manager lets an organization build custom assessments for its unique compliance needs, such as an internal policy. The custom assessment then has its own controls, improvement actions and score."
    fr: "En plus de ses évaluations prédéfinies, fondées sur plus de 360 modèles de réglementation, le Gestionnaire de conformité permet à une organisation de créer des évaluations personnalisées pour ses besoins de conformité propres, comme une stratégie interne. L'évaluation personnalisée a alors ses propres contrôles, actions d'amélioration et score."
  options:
    a:
      en: "Audit reports are published in the Service Trust Portal and concern Microsoft cloud services; they don't track a customer's internal policy."
      fr: "Les rapports d'audit sont publiés dans le Portail d'approbation des services et concernent les services cloud Microsoft ; ils ne suivent pas la stratégie interne d'un client."
    c:
      en: "A sensitive information type detects sensitive data in content by pattern; it doesn't measure compliance with a policy."
      fr: "Un type d'informations sensibles détecte des données sensibles dans le contenu au moyen d'un modèle ; il ne mesure pas la conformité à une stratégie."
    d:
      en: "A trainable classifier recognizes a category of content from examples; it isn't a compliance assessment."
      fr: "Un classifieur entraînable reconnaît une catégorie de contenu à partir d'exemples ; ce n'est pas une évaluation de conformité."
references:
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
