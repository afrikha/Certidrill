id: sc900-4a-priv-residency-principle
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders chooses Microsoft 365 because Microsoft offers data residency options that let the company determine in which geography its data is stored.

    Which privacy principle of Microsoft does this illustrate?
  fr: |
    Northwind Traders choisit Microsoft 365 parce que Microsoft propose des options de résidence des données qui permettent à l'entreprise de déterminer dans quelle zone géographique ses données sont stockées.

    Quel principe de confidentialité de Microsoft cela illustre-t-il ?
body:
  options:
    - id: a
      text: { en: "You control your data", fr: "Vous contrôlez vos données" }
    - id: b
      text: { en: "Your data is secured at rest and in transit", fr: "Vos données sont sécurisées au repos et en transit" }
    - id: c
      text: { en: "Know where your data is located", fr: "Savoir où se trouvent vos données" }
    - id: d
      text: { en: "Microsoft defends your data", fr: "Microsoft défend vos données" }
answer: { optionId: c }
explanation:
  correct:
    en: "The principle about data location states that customers of Microsoft commercial cloud services can determine where their data is stored. Microsoft offers data residency options around the world and is transparent about how data is stored and processed."
    fr: "Le principe sur l'emplacement des données indique que les clients des services cloud commerciaux de Microsoft peuvent déterminer où leurs données sont stockées. Microsoft propose des options de résidence des données dans le monde entier et fait preuve de transparence sur la façon dont les données sont stockées et traitées."
  options:
    a:
      en: "This principle is about ownership and use: the data belongs to the customer, and Microsoft uses it only to provide the chosen services."
      fr: "Ce principe porte sur la propriété et l'utilisation : les données appartiennent au client, et Microsoft ne les utilise que pour fournir les services choisis."
    b:
      en: "This principle is about encryption of stored data and of data that moves over a network, not about the place of storage."
      fr: "Ce principe porte sur le chiffrement des données stockées et des données qui circulent sur un réseau, pas sur le lieu de stockage."
    d:
      en: "This principle is about how Microsoft responds to government requests for customer data."
      fr: "Ce principe porte sur la façon dont Microsoft répond aux demandes gouvernementales portant sur les données des clients."
references:
  - title: Describe Microsoft's privacy principles
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles
