id: sc900-4a-stp-three-tools-sentence
objective: "4.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To download the ISO/IEC 27001 audit report of Microsoft Azure, an organization uses [[report]].

      To track how far the organization itself has implemented the controls of ISO/IEC 27001, it uses [[progress]].

      To obtain a measurement of its security posture in the Microsoft Defender portal, it uses [[posture]].
    fr: |
      Pour télécharger le rapport d'audit ISO/IEC 27001 de Microsoft Azure, une organisation utilise [[report]].

      Pour suivre dans quelle mesure l'organisation elle-même a implémenté les contrôles d'ISO/IEC 27001, elle utilise [[progress]].

      Pour obtenir une mesure de sa posture de sécurité dans le portail Microsoft Defender, elle utilise [[posture]].
  slots:
    - id: report
      options:
        - { id: cm, text: { en: "Compliance Manager", fr: "le Gestionnaire de conformité" } }
        - { id: ss, text: { en: "Microsoft Secure Score", fr: "le Degré de sécurisation Microsoft (Microsoft Secure Score)" } }
        - { id: stp, text: { en: "the Service Trust Portal", fr: "le Portail d'approbation des services" } }
    - id: progress
      options:
        - { id: cm, text: { en: "Compliance Manager", fr: "le Gestionnaire de conformité" } }
        - { id: ss, text: { en: "Microsoft Secure Score", fr: "le Degré de sécurisation Microsoft (Microsoft Secure Score)" } }
        - { id: stp, text: { en: "the Service Trust Portal", fr: "le Portail d'approbation des services" } }
    - id: posture
      options:
        - { id: cm, text: { en: "Compliance Manager", fr: "le Gestionnaire de conformité" } }
        - { id: ss, text: { en: "Microsoft Secure Score", fr: "le Degré de sécurisation Microsoft (Microsoft Secure Score)" } }
        - { id: stp, text: { en: "the Service Trust Portal", fr: "le Portail d'approbation des services" } }
answer:
  values: { report: stp, progress: cm, posture: ss }
explanation:
  correct:
    en: "The Service Trust Portal publishes the audit reports that external auditors produce about Microsoft cloud services: it is about Microsoft's compliance. Compliance Manager, in the Microsoft Purview portal, assesses the organization's own environment against a regulation or standard and tracks the improvement actions. Microsoft Secure Score, in the Microsoft Defender portal, is a measurement of the organization's security posture, not of its regulatory compliance."
    fr: "Le Portail d'approbation des services publie les rapports d'audit que des auditeurs externes produisent sur les services cloud Microsoft : il concerne la conformité de Microsoft. Le Gestionnaire de conformité, dans le portail Microsoft Purview, évalue l'environnement de l'organisation elle-même par rapport à une réglementation ou une norme et suit les actions d'amélioration. Le Degré de sécurisation Microsoft (Microsoft Secure Score), dans le portail Microsoft Defender, mesure la posture de sécurité de l'organisation, pas sa conformité réglementaire."
references:
  - title: Describe the offerings of the Service Trust portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
