id: sc900-4a-portal-missing-card
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two administrators of Adatum sign in to the Microsoft Purview portal. On the home page, the first administrator sees a solution card for Insider Risk Management. The second administrator doesn't see this card.

    What explains the difference?
  fr: |
    Deux administrateurs d'Adatum se connectent au portail Microsoft Purview. Sur la page d'accueil, le premier administrateur voit une carte de solution pour la gestion des risques internes (Insider Risk Management). Le second ne voit pas cette carte.

    Qu'est-ce qui explique cette différence ?
body:
  options:
    - id: a
      text: { en: "The home page shows only the solutions that each user opened most recently.", fr: "La page d'accueil ne montre que les solutions que chaque utilisateur a ouvertes le plus récemment." }
    - id: b
      text: { en: "The home page shows only the solution cards that each user chose to pin.", fr: "La page d'accueil ne montre que les cartes de solution que chaque utilisateur a choisi d'épingler." }
    - id: c
      text: { en: "The home page shows only the solutions that each user has permission to access.", fr: "La page d'accueil ne montre que les solutions auxquelles chaque utilisateur est autorisé à accéder." }
    - id: d
      text: { en: "The home page shows only the solutions for which each user started a trial.", fr: "La page d'accueil ne montre que les solutions pour lesquelles chaque utilisateur a démarré un essai." }
answer: { optionId: c }
explanation:
  correct:
    en: "What a user sees in the Microsoft Purview portal depends on the user's permissions and on the organization's subscription. The solution cards for solutions that a user can't access don't appear on the home page. The two administrators belong to the same organization, so the difference comes from their permissions."
    fr: "Ce qu'un utilisateur voit dans le portail Microsoft Purview dépend de ses autorisations et de l'abonnement de l'organisation. Les cartes des solutions auxquelles un utilisateur n'a pas accès n'apparaissent pas sur la page d'accueil. Les deux administrateurs appartiennent à la même organisation : la différence vient donc de leurs autorisations."
  options:
    a:
      en: "Recently used solutions appear as quick links in the left navigation; they don't decide which solution cards exist on the home page."
      fr: "Les solutions utilisées récemment apparaissent sous forme de liens rapides dans le volet de navigation gauche ; elles ne déterminent pas quelles cartes de solution existent sur la page d'accueil."
    b:
      en: "The solution cards of the home page can't be customized by users."
      fr: "Les cartes de solution de la page d'accueil ne peuvent pas être personnalisées par les utilisateurs."
    d:
      en: "The portal proposes trials and recommendations in a separate section; a card doesn't depend on a trial that the user started."
      fr: "Le portail propose des essais et des recommandations dans une section distincte ; une carte ne dépend pas d'un essai démarré par l'utilisateur."
references:
  - title: Learn about the Microsoft Purview portal
    url: https://learn.microsoft.com/en-us/purview/purview-portal
