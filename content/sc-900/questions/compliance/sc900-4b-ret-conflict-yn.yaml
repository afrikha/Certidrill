id: sc900-4b-ret-conflict-yn
objective: "4.3.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about retention in Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la rétention dans Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If one retention policy deletes a document after three years and another policy retains the same document for five years, the document is kept for five years."
        fr: "Si une stratégie de rétention supprime un document au bout de trois ans et qu'une autre stratégie conserve ce même document pendant cinq ans, le document est gardé pendant cinq ans."
    - id: s2
      text:
        en: "If two retention policies retain the same document, one for three years and the other for seven years, the document is kept for seven years."
        fr: "Si deux stratégies de rétention conservent le même document, l'une pendant trois ans et l'autre pendant sept ans, le document est gardé pendant sept ans."
    - id: s3
      text:
        en: "The settings of a retention policy follow a document that is moved to a site that the policy doesn't cover."
        fr: "Les paramètres d'une stratégie de rétention suivent un document déplacé vers un site que la stratégie ne couvre pas."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "When several retention settings apply to the same content, retention wins over deletion: content that must be retained isn't permanently deleted by another setting. Then the longest retention period wins. With a retention policy, items inherit the settings from their container, so the settings don't travel with an item that moves elsewhere; the settings of a retention label do travel with the item inside the Microsoft 365 tenant."
    fr: "Quand plusieurs paramètres de rétention s'appliquent au même contenu, la rétention l'emporte sur la suppression : un contenu qui doit être conservé n'est pas supprimé définitivement par un autre paramètre. Ensuite, la période de rétention la plus longue l'emporte. Avec une stratégie de rétention, les éléments héritent des paramètres de leur conteneur : les paramètres ne suivent donc pas un élément déplacé ailleurs ; ceux d'une étiquette de rétention, eux, suivent l'élément à l'intérieur du locataire Microsoft 365."
references:
  - title: Learn about retention policies and retention labels
    url: https://learn.microsoft.com/en-us/purview/retention
  - title: Describe Data Lifecycle Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/6-describe-data-lifecycle-management
