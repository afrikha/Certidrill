id: sc900-4a-cm-purpose
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank must comply with ISO/IEC 27001. The compliance team needs a tool that assesses the Microsoft 365 environment of the bank against this standard and recommends the actions to implement.

    What should the team use?
  fr: |
    Woodgrove Bank doit se conformer à ISO/IEC 27001. L'équipe de conformité a besoin d'un outil qui évalue l'environnement Microsoft 365 de la banque par rapport à cette norme et recommande les actions à implémenter.

    Que doit utiliser l'équipe ?
body:
  options:
    - id: a
      text: { en: "Service Trust Portal", fr: "Portail d'approbation des services" }
    - id: b
      text: { en: "Microsoft Secure Score", fr: "Degré de sécurisation Microsoft (Microsoft Secure Score)" }
    - id: c
      text: { en: "Compliance Manager", fr: "Gestionnaire de conformité" }
    - id: d
      text: { en: "Content explorer", fr: "Explorateur de contenu" }
answer: { optionId: c }
explanation:
  correct:
    en: "Compliance Manager helps an organization automatically assess and manage its compliance. It provides prebuilt assessments for common standards and regulations, such as ISO/IEC 27001, with step-by-step guidance on the improvement actions and a score that measures progress."
    fr: "Le Gestionnaire de conformité aide une organisation à évaluer et à gérer automatiquement sa conformité. Il fournit des évaluations prédéfinies pour des normes et des réglementations courantes, comme ISO/IEC 27001, avec des conseils pas à pas sur les actions d'amélioration et un score qui mesure l'avancement."
  options:
    a:
      en: "The Service Trust Portal publishes the audit reports on Microsoft's own cloud services; it doesn't assess a customer's environment."
      fr: "Le Portail d'approbation des services publie les rapports d'audit sur les services cloud de Microsoft ; il n'évalue pas l'environnement d'un client."
    b:
      en: "Microsoft Secure Score measures the security posture in the Microsoft Defender portal; it isn't organized by regulation or standard."
      fr: "Le Degré de sécurisation Microsoft mesure la posture de sécurité dans le portail Microsoft Defender ; il n'est pas organisé par réglementation ou par norme."
    d:
      en: "Content explorer shows which items are labeled or contain sensitive information and where they are stored."
      fr: "L'Explorateur de contenu montre quels éléments sont étiquetés ou contiennent des informations sensibles et où ils sont stockés."
references:
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
