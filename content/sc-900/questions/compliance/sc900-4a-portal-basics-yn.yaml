id: sc900-4a-portal-basics-yn
objective: "4.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the Microsoft Purview portal, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le portail Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Microsoft Purview portal gives access to data security, data governance, and risk and compliance solutions."
        fr: "Le portail Microsoft Purview donne accès à des solutions de sécurité des données, de gouvernance des données et de risque et conformité."
    - id: s2
      text:
        en: "Security analysts use the Microsoft Purview portal to investigate the incidents that Microsoft Defender XDR correlates."
        fr: "Les analystes de sécurité utilisent le portail Microsoft Purview pour examiner les incidents que Microsoft Defender XDR met en corrélation."
    - id: s3
      text:
        en: "Data loss prevention (DLP) policies are managed in the Microsoft Purview portal."
        fr: "Les stratégies de protection contre la perte de données (DLP) se gèrent dans le portail Microsoft Purview."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "The Microsoft Purview portal is the unified experience for the data security, data governance, and risk and compliance solutions of Microsoft Purview. Data Loss Prevention is one of its data security solutions. Incidents and alerts of Microsoft Defender XDR are investigated in the Microsoft Defender portal."
    fr: "Le portail Microsoft Purview est l'expérience unifiée des solutions de sécurité des données, de gouvernance des données et de risque et conformité de Microsoft Purview. La protection contre la perte de données est l'une de ses solutions de sécurité des données. Les incidents et les alertes de Microsoft Defender XDR s'examinent dans le portail Microsoft Defender."
references:
  - title: Learn about the Microsoft Purview portal
    url: https://learn.microsoft.com/en-us/purview/purview-portal
