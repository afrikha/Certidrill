id: sc900-4a-stp-my-library
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A compliance officer at Woodgrove Bank regularly consults the same documents in the Service Trust Portal. She wants to find them in one place and to receive an email when one of them is updated.

    Which feature of the Service Trust Portal should she use?
  fr: |
    Une responsable de la conformité de Woodgrove Bank consulte régulièrement les mêmes documents dans le Portail d'approbation des services. Elle veut les retrouver au même endroit et recevoir un e-mail quand l'un d'eux est mis à jour.

    Quelle fonctionnalité du Portail d'approbation des services doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "My Library", fr: "Ma bibliothèque (My Library)" }
    - id: b
      text: { en: "My Download History", fr: "Mon historique de téléchargement (My Download History)" }
    - id: c
      text: { en: "All Documents", fr: "Tous les documents (All Documents)" }
    - id: d
      text: { en: "Resources for your Organization", fr: "Ressources pour votre organisation (Resources for your Organization)" }
answer: { optionId: a }
explanation:
  correct:
    en: "With Save to library, a user adds documents to My Library and finds them in one place. The Notification Settings of My Library send an email to an address of the organization when a saved document is updated."
    fr: "Avec Enregistrer dans la bibliothèque, un utilisateur ajoute des documents à Ma bibliothèque et les retrouve au même endroit. Les Paramètres de notification de Ma bibliothèque envoient un e-mail à une adresse de l'organisation quand un document enregistré est mis à jour."
  options:
    b:
      en: "My Download History lists the documents that the user downloaded and lets the user export this list; it doesn't send update notifications."
      fr: "Mon historique de téléchargement liste les documents que l'utilisateur a téléchargés et permet d'exporter cette liste ; il n'envoie pas de notifications de mise à jour."
    c:
      en: "All Documents lists every available document by category; it isn't a personal selection and it doesn't notify the user."
      fr: "Tous les documents liste tous les documents disponibles par catégorie ; ce n'est pas une sélection personnelle et l'utilisateur n'est pas prévenu."
    d:
      en: "Resources for your Organization shows the documents restricted to the tenant, based on its subscription and permissions; the user doesn't choose them."
      fr: "Ressources pour votre organisation montre les documents restreints au locataire, selon son abonnement et ses autorisations ; l'utilisateur ne les choisit pas."
references:
  - title: Get started with the Microsoft Service Trust Portal
    url: https://learn.microsoft.com/en-us/purview/get-started-with-service-trust-portal
  - title: Describe the offerings of the Service Trust portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal
