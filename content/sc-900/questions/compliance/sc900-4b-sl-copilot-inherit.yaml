id: sc900-4b-sl-copilot-inherit
objective: "4.3.3"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Adatum publishes three sensitivity labels. From the least restrictive to the most restrictive, they are **General**, **Confidential** and **Highly Confidential**.

    A user asks Microsoft 365 Copilot a question. To answer, Copilot uses three files that the user is allowed to open: one labeled General, one labeled Confidential and one labeled Highly Confidential.

    Which sensitivity label does the response of Copilot inherit?
  fr: |
    Adatum publie trois étiquettes de confidentialité. De la moins restrictive à la plus restrictive, ce sont **General**, **Confidential** et **Highly Confidential**.

    Un utilisateur pose une question à Microsoft 365 Copilot. Pour répondre, Copilot utilise trois fichiers que l'utilisateur est autorisé à ouvrir : un fichier étiqueté General, un fichier étiqueté Confidential et un fichier étiqueté Highly Confidential.

    De quelle étiquette de confidentialité la réponse de Copilot hérite-t-elle ?
body:
  options:
    - { id: a, text: General }
    - { id: b, text: Confidential }
    - { id: c, text: Highly Confidential }
    - { id: d, text: { en: "No label", fr: "Aucune étiquette" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft 365 Copilot recognizes the sensitivity labels of the items it uses. When a response draws on several labeled items, it inherits the most restrictive label, which is typically the label that has the highest priority: here Highly Confidential."
    fr: "Microsoft 365 Copilot reconnaît les étiquettes de confidentialité des éléments qu'il utilise. Quand une réponse s'appuie sur plusieurs éléments étiquetés, elle hérite de l'étiquette la plus restrictive, qui est en général celle dont la priorité est la plus élevée : ici Highly Confidential."
  options:
    a:
      en: "General is the least restrictive of the three labels; inheriting it would expose content from the two more sensitive files."
      fr: "General est la moins restrictive des trois étiquettes ; en hériter exposerait le contenu des deux fichiers plus sensibles."
    b:
      en: "Copilot doesn't take a middle label: it takes the most restrictive label among the items used."
      fr: "Copilot ne prend pas une étiquette intermédiaire : il prend l'étiquette la plus restrictive parmi les éléments utilisés."
    d:
      en: "The labels of the source items are honored by Copilot; the response isn't left unlabeled."
      fr: "Copilot respecte les étiquettes des éléments sources ; la réponse ne reste pas sans étiquette."
references:
  - title: Describe sensitivity labels and policies in Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/3-describe-sensitivity-labels-policies
  - title: Learn about sensitivity labels
    url: https://learn.microsoft.com/en-us/purview/sensitivity-labels
