id: sc900-4a-cm-controls-yn
objective: "4.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam creates an assessment in Compliance Manager. The assessment contains Microsoft managed controls, shared controls and controls that Fabrikam manages.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée une évaluation dans le Gestionnaire de conformité. L'évaluation contient des contrôles gérés par Microsoft, des contrôles partagés et des contrôles gérés par Fabrikam.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Fabrikam is responsible for implementing the Microsoft managed controls of the assessment."
        fr: "Fabrikam est responsable de l'implémentation des contrôles gérés par Microsoft de l'évaluation."
    - id: s2
      text:
        en: "For the actions that Microsoft manages, Compliance Manager shows implementation details and audit results."
        fr: "Pour les actions gérées par Microsoft, le Gestionnaire de conformité montre les détails d'implémentation et les résultats d'audit."
    - id: s3
      text:
        en: "An administrator of Fabrikam must manually update the status of every improvement action."
        fr: "Un administrateur de Fabrikam doit mettre à jour manuellement l'état de chaque action d'amélioration."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Microsoft managed controls are controls for Microsoft cloud services that Microsoft itself implements; the customer implements its own controls and its part of the shared controls. For the actions managed by Microsoft, Compliance Manager displays the implementation details and the audit results. Compliance Manager continuously assesses controls by detecting settings in the Microsoft 365 environment and automatically updates the status of technical actions, so not every status is updated by hand."
    fr: "Les contrôles gérés par Microsoft sont des contrôles des services cloud Microsoft que Microsoft implémente lui-même ; le client implémente ses propres contrôles et sa part des contrôles partagés. Pour les actions gérées par Microsoft, le Gestionnaire de conformité affiche les détails d'implémentation et les résultats d'audit. Le Gestionnaire de conformité évalue les contrôles en continu en détectant les paramètres de l'environnement Microsoft 365 et met à jour automatiquement l'état des actions techniques : tous les états ne sont donc pas mis à jour à la main."
references:
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
  - title: Working with improvement actions in Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager-improvement-actions
