id: sc900-4b-dlp-alerts-devices-yn
objective: "4.3.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about data loss prevention (DLP) in Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la protection contre la perte de données (DLP) de Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "DLP alerts are routed to the Microsoft Defender portal, where they are combined into incidents."
        fr: "Les alertes DLP sont acheminées vers le portail Microsoft Defender, où elles sont regroupées en incidents."
    - id: s2
      text:
        en: "A file that is stored on a Windows 11 device must be uploaded to OneDrive before a DLP policy can apply to it."
        fr: "Un fichier stocké sur un appareil Windows 11 doit être chargé dans OneDrive avant qu'une stratégie DLP puisse s'y appliquer."
    - id: s3
      text:
        en: "The activities that DLP monitors are recorded in the Microsoft 365 audit log and shown in Activity explorer."
        fr: "Les activités surveillées par la DLP sont enregistrées dans le journal d'audit Microsoft 365 et affichées dans l'Explorateur d'activités."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "When alerts are configured, DLP shows them in its own alert dashboard in the Microsoft Purview portal and also routes them to the Microsoft Defender portal, where they are automatically combined into incidents. Endpoint DLP applies policies to sensitive items that are physically stored on onboarded Windows and macOS devices: the files don't have to be in a cloud service. All the activities that DLP monitors are recorded in the Microsoft 365 audit log by default and routed to Activity explorer."
    fr: "Quand des alertes sont configurées, la DLP les affiche dans son propre tableau de bord des alertes du portail Microsoft Purview et les achemine aussi vers le portail Microsoft Defender, où elles sont automatiquement regroupées en incidents. Endpoint DLP applique les stratégies aux éléments sensibles stockés physiquement sur des appareils Windows et macOS intégrés : les fichiers n'ont pas besoin d'être dans un service cloud. Toutes les activités surveillées par la DLP sont enregistrées par défaut dans le journal d'audit Microsoft 365 et acheminées vers l'Explorateur d'activités."
references:
  - title: Describe data loss prevention in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/4-describe-data-loss-prevention
  - title: Learn about Endpoint data loss prevention
    url: https://learn.microsoft.com/en-us/purview/endpoint-dlp-learn-about
