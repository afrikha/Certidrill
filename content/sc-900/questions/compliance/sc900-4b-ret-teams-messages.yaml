id: sc900-4b-ret-teams-messages
objective: "4.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware wants the channel messages of Microsoft Teams to be deleted automatically one year after they are posted.

    What should Proseware create?
  fr: |
    Proseware veut que les messages de canal de Microsoft Teams soient supprimés automatiquement un an après leur publication.

    Que doit créer Proseware ?
body:
  options:
    - { id: a, text: { en: "A retention label that users apply to the messages", fr: "Une étiquette de rétention que les utilisateurs appliquent aux messages" } }
    - { id: b, text: { en: "A retention policy that applies to the messages", fr: "Une stratégie de rétention qui s'applique aux messages" } }
    - { id: c, text: { en: "A retention label that is applied automatically to the messages", fr: "Une étiquette de rétention appliquée automatiquement aux messages" } }
    - { id: d, text: { en: "A sensitivity label that is applied to the teams", fr: "Une étiquette de confidentialité appliquée aux équipes" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Teams messages are among the locations that support retention policies only. A retention policy for Teams channel messages can delete the messages after the chosen period, with the same settings for every message of the location."
    fr: "Les messages Teams font partie des emplacements qui ne prennent en charge que les stratégies de rétention. Une stratégie de rétention pour les messages de canal Teams peut supprimer les messages après la période choisie, avec les mêmes paramètres pour tous les messages de l'emplacement."
  options:
    a:
      en: "Retention labels can be published to Exchange, SharePoint, OneDrive and Microsoft 365 groups, but Teams messages don't support retention labels."
      fr: "Les étiquettes de rétention peuvent être publiées dans Exchange, SharePoint, OneDrive et les groupes Microsoft 365, mais les messages Teams ne prennent pas en charge les étiquettes de rétention."
    c:
      en: "Applying a retention label automatically is also limited to the locations that support retention labels, which Teams messages don't."
      fr: "L'application automatique d'une étiquette de rétention est elle aussi limitée aux emplacements qui prennent en charge les étiquettes de rétention, ce qui n'est pas le cas des messages Teams."
    d:
      en: "A sensitivity label applied to a team controls settings such as the privacy of a team; it doesn't delete messages."
      fr: "Une étiquette de confidentialité appliquée à une équipe contrôle des paramètres comme la confidentialité d'une équipe ; elle ne supprime pas les messages."
references:
  - title: Learn about retention policies and retention labels
    url: https://learn.microsoft.com/en-us/purview/retention
