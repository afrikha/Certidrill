id: sc900-4a-priv-encryption-sentence
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about the privacy principle "Your data is secured at rest and in transit", select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur le principe de confidentialité « Vos données sont sécurisées au repos et en transit », sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For data at rest, the Microsoft Cloud offers encryption capabilities up to [[rest]].

      For data in transit, Microsoft uses industry-standard encrypted transport protocols such as [[transit]].

      Customers can keep control of their encryption keys and other secrets by using [[keys]].
    fr: |
      Pour les données au repos, le cloud Microsoft offre des fonctionnalités de chiffrement allant jusqu'à [[rest]].

      Pour les données en transit, Microsoft utilise des protocoles de transport chiffrés standard du secteur, comme [[transit]].

      Les clients peuvent garder le contrôle de leurs clés de chiffrement et de leurs autres secrets en utilisant [[keys]].
  slots:
    - id: rest
      options:
        - { id: sha, text: "SHA-256" }
        - { id: aes, text: "AES-256" }
        - { id: md5, text: "MD5" }
    - id: transit
      options:
        - { id: http, text: { en: "HTTP and FTP", fr: "HTTP et FTP" } }
        - { id: dns, text: { en: "DNS and DHCP", fr: "DNS et DHCP" } }
        - { id: tls, text: { en: "TLS and IPsec", fr: "TLS et IPsec" } }
    - id: keys
      options:
        - { id: akv, text: "Azure Key Vault" }
        - { id: bastion, text: "Azure Bastion" }
        - { id: stp, text: { en: "the Service Trust Portal", fr: "le Portail d'approbation des services" } }
answer:
  values: { rest: aes, transit: tls, keys: akv }
explanation:
  correct:
    en: "For data at rest, the Microsoft Cloud offers a range of encryption capabilities up to AES-256. For data in transit, Microsoft uses industry-standard encrypted transport protocols, such as Transport Layer Security (TLS) and Internet Protocol Security (IPsec). Azure Key Vault gives customers control over passwords, encryption keys and other secrets."
    fr: "Pour les données au repos, le cloud Microsoft offre un éventail de fonctionnalités de chiffrement allant jusqu'à AES-256. Pour les données en transit, Microsoft utilise des protocoles de transport chiffrés standard du secteur, comme TLS (Transport Layer Security) et IPsec (Internet Protocol Security). Azure Key Vault donne aux clients le contrôle des mots de passe, des clés de chiffrement et des autres secrets."
  options:
    sha:
      en: "SHA-256 is a hash function: it produces a fixed-length digest that can't be decrypted, so it doesn't encrypt stored data."
      fr: "SHA-256 est une fonction de hachage : elle produit une empreinte de longueur fixe qui ne peut pas être déchiffrée ; elle ne chiffre donc pas les données stockées."
    md5:
      en: "MD5 is a hash function, not an encryption algorithm."
      fr: "MD5 est une fonction de hachage, pas un algorithme de chiffrement."
    http:
      en: "HTTP and FTP transfer data without encrypting it."
      fr: "HTTP et FTP transfèrent les données sans les chiffrer."
    bastion:
      en: "Azure Bastion provides secure RDP and SSH connectivity to virtual machines; it doesn't store keys or secrets."
      fr: "Azure Bastion fournit une connectivité RDP et SSH sécurisée aux machines virtuelles ; il ne stocke ni clés ni secrets."
references:
  - title: Describe Microsoft's privacy principles
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles
