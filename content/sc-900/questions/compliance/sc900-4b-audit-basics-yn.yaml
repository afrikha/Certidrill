id: sc900-4b-audit-basics-yn
objective: "4.4.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Purview Audit, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Purview Audit, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Audit (Standard) is enabled by default for the organizations that have the appropriate subscription."
        fr: "Audit (Standard) est activé par défaut pour les organisations qui ont l'abonnement approprié."
    - id: s2
      text:
        en: "The unified audit log records the operations of administrators, as well as the operations of users."
        fr: "Le journal d'audit unifié enregistre les opérations des administrateurs, ainsi que celles des utilisateurs."
    - id: s3
      text:
        en: "When Microsoft Purview Audit records a suspicious activity, it places the mailbox of the user on hold."
        fr: "Quand Microsoft Purview Audit enregistre une activité suspecte, il place la boîte aux lettres de l'utilisateur en attente."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Audit (Standard) is turned on by default for organizations that have the appropriate subscription: nothing has to be configured to start recording. The unified audit log captures thousands of user and admin operations across dozens of Microsoft services. Audit only records and retains these operations so that they can be searched; preserving a mailbox with a hold is done in an eDiscovery case."
    fr: "Audit (Standard) est activé par défaut pour les organisations qui ont l'abonnement approprié : rien n'est à configurer pour commencer à enregistrer. Le journal d'audit unifié capture des milliers d'opérations d'utilisateurs et d'administrateurs dans des dizaines de services Microsoft. Audit se limite à enregistrer et à conserver ces opérations pour qu'on puisse les rechercher ; préserver une boîte aux lettres par une mise en attente se fait dans un cas eDiscovery."
references:
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
  - title: Describe audit in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/2-describe-audit
