id: sc900-4b-edisc-locations-multi
objective: "4.4.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware uses Microsoft Purview eDiscovery for an investigation.

    Which two content locations can Proseware search by using eDiscovery? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise Microsoft Purview eDiscovery pour une investigation.

    Quels sont les deux emplacements de contenu dans lesquels Proseware peut effectuer des recherches avec eDiscovery ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Azure SQL databases", fr: "Les bases de données Azure SQL" } }
    - { id: b, text: { en: "Exchange mailboxes", fr: "Les boîtes aux lettres Exchange" } }
    - { id: c, text: { en: "Microsoft Teams", fr: "Microsoft Teams" } }
    - { id: d, text: { en: "The local disks of the laptops of the users", fr: "Les disques locaux des ordinateurs portables des utilisateurs" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "eDiscovery identifies, reviews and manages content in Microsoft 365 services: Exchange mailboxes, Microsoft Teams, Microsoft 365 groups, OneDrive accounts, SharePoint sites and Viva Engage."
    fr: "eDiscovery identifie, examine et gère le contenu des services Microsoft 365 : boîtes aux lettres Exchange, Microsoft Teams, groupes Microsoft 365, comptes OneDrive, sites SharePoint et Viva Engage."
  options:
    a:
      en: "Azure SQL databases are Azure resources, not Microsoft 365 content locations that eDiscovery searches."
      fr: "Les bases de données Azure SQL sont des ressources Azure, pas des emplacements de contenu Microsoft 365 dans lesquels eDiscovery recherche."
    d:
      en: "Files that exist only on the local disk of a device aren't in a Microsoft 365 service, so an eDiscovery search doesn't reach them."
      fr: "Les fichiers qui n'existent que sur le disque local d'un appareil ne sont pas dans un service Microsoft 365 : une recherche eDiscovery ne les atteint donc pas."
references:
  - title: Describe eDiscovery
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/3-describe-ediscovery
  - title: Learn about eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc
