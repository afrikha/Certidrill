id: sc900-4b-audit-who-deleted
objective: "4.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Last week, a confidential file was deleted from a SharePoint site of Contoso. The security team must find out which user deleted the file and when.

    Which Microsoft Purview solution should the security team use?
  fr: |
    La semaine dernière, un fichier confidentiel a été supprimé d'un site SharePoint de Contoso. L'équipe de sécurité doit découvrir quel utilisateur a supprimé le fichier et à quel moment.

    Quelle solution Microsoft Purview l'équipe de sécurité doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Content explorer", fr: "L'Explorateur de contenu" } }
    - { id: b, text: { en: "Audit", fr: "Audit" } }
    - { id: c, text: { en: "Compliance Manager", fr: "Le gestionnaire de conformité (Compliance Manager)" } }
    - { id: d, text: { en: "Records Management", fr: "La gestion des enregistrements (Records Management)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Microsoft Purview Audit records the operations of users and administrators, such as the access, the sharing or the deletion of a file in SharePoint, in the unified audit log. By searching the log for an activity, a user or a date range, investigators determine who did what and when."
    fr: "Microsoft Purview Audit enregistre dans le journal d'audit unifié les opérations des utilisateurs et des administrateurs, comme la consultation, le partage ou la suppression d'un fichier dans SharePoint. En recherchant dans le journal une activité, un utilisateur ou une plage de dates, les enquêteurs déterminent qui a fait quoi et quand."
  options:
    a:
      en: "Content explorer shows a current snapshot of the items that have a label or contain sensitive information; it doesn't keep the history of who deleted a file."
      fr: "L'Explorateur de contenu montre un instantané actuel des éléments qui ont une étiquette ou contiennent des informations sensibles ; il ne garde pas l'historique de qui a supprimé un fichier."
    c:
      en: "Compliance Manager assesses the compliance posture of the organization against regulations and standards."
      fr: "Le gestionnaire de conformité évalue la posture de conformité de l'organisation par rapport aux réglementations et aux normes."
    d:
      en: "Records Management manages the retention and the disposition of items declared as records; it isn't a tool to search the activities of users."
      fr: "La gestion des enregistrements gère la rétention et la destruction des éléments déclarés comme enregistrements ; ce n'est pas un outil de recherche des activités des utilisateurs."
references:
  - title: Describe audit in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/2-describe-audit
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
