id: sc900-4b-audit-records-yn
objective: "4.4.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Purview Audit, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Purview Audit, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "With Audit (Premium), the audit records of Microsoft Teams are retained for one year by default."
        fr: "Avec Audit (Premium), les enregistrements d'audit de Microsoft Teams sont conservés un an par défaut."
    - id: s2
      text:
        en: "When a user enters a prompt in Microsoft 365 Copilot, the activity is recorded in the unified audit log."
        fr: "Quand un utilisateur saisit une invite dans Microsoft 365 Copilot, l'activité est enregistrée dans le journal d'audit unifié."
    - id: s3
      text:
        en: "With Audit (Premium), the audit records of Exchange are retained for one year by default."
        fr: "Avec Audit (Premium), les enregistrements d'audit d'Exchange sont conservés un an par défaut."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "With Audit (Premium), a default audit log retention policy keeps the records of Microsoft Entra ID, Exchange, OneDrive and SharePoint for one year. The records of all the other services, including Microsoft Teams, are kept for 180 days unless an audit log retention policy sets a longer period. Interactions with Microsoft 365 Copilot are audited: when a user enters a prompt or receives a response, the activity is logged automatically in the unified audit log."
    fr: "Avec Audit (Premium), une stratégie de rétention des journaux d'audit par défaut garde un an les enregistrements de Microsoft Entra ID, d'Exchange, de OneDrive et de SharePoint. Les enregistrements de tous les autres services, dont Microsoft Teams, sont gardés 180 jours, sauf si une stratégie de rétention des journaux d'audit fixe une période plus longue. Les interactions avec Microsoft 365 Copilot sont auditées : quand un utilisateur saisit une invite ou reçoit une réponse, l'activité est consignée automatiquement dans le journal d'audit unifié."
references:
  - title: Learn about auditing solutions in Microsoft Purview
    url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
  - title: Describe audit in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/2-describe-audit
