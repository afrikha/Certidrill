id: sc900-4a-cm-basics-yn
objective: "4.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Compliance Manager, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le Gestionnaire de conformité, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Compliance Manager provides prebuilt assessments for common industry and regional regulations and standards."
        fr: "Le Gestionnaire de conformité fournit des évaluations prédéfinies pour des réglementations et des normes sectorielles et régionales courantes."
    - id: s2
      text:
        en: "An improvement action can be assigned to a user for implementation and testing."
        fr: "Une action d'amélioration peut être attribuée à un utilisateur pour l'implémentation et les tests."
    - id: s3
      text:
        en: "Compliance Manager is a solution of the Microsoft Defender portal."
        fr: "Le Gestionnaire de conformité est une solution du portail Microsoft Defender."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Compliance Manager offers prebuilt assessments based on common regional and industry regulations and standards, and custom assessments. Its improvement actions can be assigned to users for implementation and testing, and they store the evidence, the notes and the status updates. Compliance Manager is one of the risk and compliance solutions of the Microsoft Purview portal, not of the Microsoft Defender portal."
    fr: "Le Gestionnaire de conformité propose des évaluations prédéfinies fondées sur des réglementations et des normes régionales et sectorielles courantes, ainsi que des évaluations personnalisées. Ses actions d'amélioration peuvent être attribuées à des utilisateurs pour l'implémentation et les tests, et elles conservent les preuves, les notes et les mises à jour d'état. Le Gestionnaire de conformité est l'une des solutions de risque et conformité du portail Microsoft Purview, pas du portail Microsoft Defender."
references:
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
