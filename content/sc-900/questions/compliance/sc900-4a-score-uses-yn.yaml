id: sc900-4a-score-uses-yn
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the compliance score, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le score de conformité, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The compliance score helps an organization prioritize the improvement actions that have the highest potential impact."
        fr: "Le score de conformité aide une organisation à hiérarchiser les actions d'amélioration qui ont le plus fort impact potentiel."
    - id: s2
      text:
        en: "The actions that Microsoft completed as the cloud service provider contribute points to the compliance score."
        fr: "Les actions que Microsoft a réalisées en tant que fournisseur de services cloud apportent des points au score de conformité."
    - id: s3
      text:
        en: "The compliance score measures the security posture of the devices onboarded to Microsoft Defender for Endpoint."
        fr: "Le score de conformité mesure la posture de sécurité des appareils intégrés à Microsoft Defender pour point de terminaison."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Because each improvement action is scored by the risk it addresses, the compliance score helps to prioritize the actions with the highest potential impact, to track progress over time and to report the status to leadership and auditors. The score combines two kinds of points: your points, from the actions that the organization completes, and Microsoft-managed points, from the actions that Microsoft already completed as the cloud service provider. The security posture of devices is measured by Microsoft Secure Score in the Microsoft Defender portal."
    fr: "Comme chaque action d'amélioration est notée selon le risque qu'elle traite, le score de conformité aide à hiérarchiser les actions qui ont le plus fort impact potentiel, à suivre l'avancement dans le temps et à rendre compte de l'état à la direction et aux auditeurs. Le score combine deux sortes de points : vos points, issus des actions que l'organisation réalise, et les points gérés par Microsoft, issus des actions que Microsoft a déjà réalisées en tant que fournisseur de services cloud. La posture de sécurité des appareils est mesurée par le Degré de sécurisation Microsoft (Microsoft Secure Score) dans le portail Microsoft Defender."
references:
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
  - title: Microsoft Secure Score
    url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score
