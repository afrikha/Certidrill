id: sc900-4b-irm-template-security
objective: "4.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso wants to detect users who disable security features or install unwanted software on their devices. The detection must rely on alerts from Microsoft Defender for Endpoint.

    Which insider risk management policy template should Contoso use?
  fr: |
    Contoso veut détecter les utilisateurs qui désactivent des fonctionnalités de sécurité ou installent des logiciels indésirables sur leurs appareils. La détection doit s'appuyer sur les alertes de Microsoft Defender pour point de terminaison.

    Quel modèle de stratégie de gestion des risques internes Contoso doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Data leaks", fr: "Fuites de données (Data leaks)" } }
    - { id: b, text: { en: "Data theft by departing users", fr: "Vol de données par des utilisateurs sortants (Data theft by departing users)" } }
    - { id: c, text: { en: "Risky AI usage", fr: "Utilisation risquée de l'IA (Risky AI usage)" } }
    - { id: d, text: { en: "Security policy violations", fr: "Violations de stratégie de sécurité (Security policy violations)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The Security policy violations template detects risky security activities, such as disabling security features or installing malware or unwanted software. It uses the alerts of Microsoft Defender for Endpoint as its signals."
    fr: "Le modèle Violations de stratégie de sécurité détecte les activités de sécurité à risque, comme la désactivation de fonctionnalités de sécurité ou l'installation de programmes malveillants ou de logiciels indésirables. Il utilise comme signaux les alertes de Microsoft Defender pour point de terminaison."
  options:
    a:
      en: "Data leaks detects the inappropriate sharing of sensitive or confidential information, accidental or deliberate."
      fr: "Fuites de données détecte le partage inapproprié d'informations sensibles ou confidentielles, accidentel ou délibéré."
    b:
      en: "Data theft by departing users detects the exfiltration of data by users who are leaving the organization."
      fr: "Vol de données par des utilisateurs sortants détecte l'exfiltration de données par des utilisateurs qui quittent l'organisation."
    c:
      en: "Risky AI usage detects activities such as sending sensitive data to AI services."
      fr: "Utilisation risquée de l'IA détecte des activités comme l'envoi de données sensibles à des services d'IA."
references:
  - title: Learn about Insider Risk Management policy templates
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management-policy-templates
  - title: Describe insider risk management in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/5-describe-insider-risk-management
