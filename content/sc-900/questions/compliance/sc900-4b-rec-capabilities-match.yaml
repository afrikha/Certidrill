id: sc900-4b-rec-capabilities-match
objective: "4.3.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the Microsoft Purview Records Management capability that it describes.

    To answer, drag the appropriate capability to each description. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la fonctionnalité de la gestion des enregistrements Microsoft Purview qu'elle décrit.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque description. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: proof, text: { en: "Proof of disposition", fr: "Preuve de destruction" } }
    - { id: event, text: { en: "Event-based retention", fr: "Rétention basée sur des événements" } }
    - { id: plan, text: { en: "File plan", fr: "Plan de fichiers" } }
    - { id: review, text: { en: "Disposition review", fr: "Révision de destruction" } }
  targets:
    - id: t1
      text: { en: "Import an existing retention schedule, and view and manage all the retention labels in one location.", fr: "Importer un calendrier de rétention existant, puis consulter et gérer toutes les étiquettes de rétention au même endroit." }
    - id: t2
      text: { en: "Designated persons examine an item at the end of its retention period, then approve its deletion or extend its retention.", fr: "Des personnes désignées examinent un élément à la fin de sa période de rétention, puis approuvent sa suppression ou prolongent sa rétention." }
    - id: t3
      text: { en: "A confirmation of how and when a record was permanently deleted, which can be shown to auditors.", fr: "Une confirmation de la façon dont un enregistrement a été supprimé définitivement et du moment de cette suppression, présentable à des auditeurs." }
answer:
  mapping: { t1: plan, t2: review, t3: proof }
explanation:
  correct:
    en: "A file plan lets an organization import a retention schedule from another system and manage all its retention labels, with their periods and descriptive information, in one location. A disposition review makes designated reviewers examine an item before it is permanently deleted: they approve the deletion or extend the retention period. Proof of disposition is the record that confirms how and when an item was deleted. Event-based retention is something else: it starts the retention period when an event occurs."
    fr: "Un plan de fichiers permet à une organisation d'importer un calendrier de rétention depuis un autre système et de gérer au même endroit toutes ses étiquettes de rétention, avec leurs périodes et des informations descriptives. Une révision de destruction fait examiner un élément par des réviseurs désignés avant sa suppression définitive : ils approuvent la suppression ou prolongent la période de rétention. La preuve de destruction est la trace qui confirme comment et quand un élément a été supprimé. La rétention basée sur des événements est autre chose : elle fait démarrer la période de rétention quand un événement se produit."
references:
  - title: Describe Microsoft Purview Records Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/7-describe-records-management
  - title: Disposition of content
    url: https://learn.microsoft.com/en-us/purview/disposition
