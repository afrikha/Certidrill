id: sc900-4a-stp-pen-test-category
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team of Tailspin Toys wants to read the attestations of the penetration tests that third parties performed on Microsoft cloud services.

    In which category of the Service Trust Portal are these documents published?
  fr: |
    L'équipe de sécurité de Tailspin Toys veut lire les attestations des tests d'intrusion que des tiers ont menés sur les services cloud Microsoft.

    Dans quelle catégorie du Portail d'approbation des services ces documents sont-ils publiés ?
body:
  options:
    - id: a
      text: { en: "Certifications, Regulations, and Standards", fr: "Certifications, réglementations et normes" }
    - id: b
      text: { en: "Industry and Regional Resources", fr: "Ressources sectorielles et régionales" }
    - id: c
      text: { en: "Resources for your Organization", fr: "Ressources pour votre organisation" }
    - id: d
      text: { en: "Reports, Whitepapers, and Artifacts", fr: "Rapports, livres blancs et artefacts" }
answer: { optionId: d }
explanation:
  correct:
    en: "The Reports, Whitepapers, and Artifacts category groups general documents: business continuity and disaster recovery, third-party attestations of penetration tests and security assessments, privacy and data protection resources, FAQ and whitepapers."
    fr: "La catégorie Rapports, livres blancs et artefacts regroupe des documents généraux : continuité d'activité et reprise d'activité, attestations par des tiers de tests d'intrusion et d'évaluations de sécurité, ressources sur la confidentialité et la protection des données, FAQ et livres blancs."
  options:
    a:
      en: "This category shows how Microsoft cloud services meet standards and regulations such as ISO/IEC, SOC, GDPR, FedRAMP and PCI DSS."
      fr: "Cette catégorie montre comment les services cloud Microsoft respectent des normes et des réglementations comme ISO/IEC, SOC, le RGPD, FedRAMP et PCI DSS."
    b:
      en: "This category contains documents by industry, such as financial services or healthcare, and by region."
      fr: "Cette catégorie contient des documents par secteur, comme les services financiers ou les soins de santé, et par région."
    c:
      en: "This category lists the documents that apply to your organization, restricted by tenant according to its subscription and permissions."
      fr: "Cette catégorie liste les documents qui s'appliquent à votre organisation, restreints par locataire selon son abonnement et ses autorisations."
references:
  - title: Describe the offerings of the Service Trust portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal
  - title: Get started with the Microsoft Service Trust Portal
    url: https://learn.microsoft.com/en-us/purview/get-started-with-service-trust-portal
