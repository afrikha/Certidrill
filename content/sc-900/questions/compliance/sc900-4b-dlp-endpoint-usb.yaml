id: sc900-4b-dlp-endpoint-usb
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The employees of Tailspin Toys keep design files that contain sensitive information on their Windows 11 laptops. Tailspin Toys wants to stop the employees from copying these files to USB drives and from printing them.

    Which Microsoft Purview capability should Tailspin Toys use?
  fr: |
    Les employés de Tailspin Toys conservent sur leurs ordinateurs portables Windows 11 des fichiers de conception qui contiennent des informations sensibles. Tailspin Toys veut empêcher les employés de copier ces fichiers sur des clés USB et de les imprimer.

    Quelle fonctionnalité Microsoft Purview Tailspin Toys doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Endpoint DLP", fr: "La DLP de point de terminaison (Endpoint DLP)" } }
    - { id: b, text: { en: "Activity explorer", fr: "L'Explorateur d'activités" } }
    - { id: c, text: { en: "Insider Risk Management", fr: "La gestion des risques internes (Insider Risk Management)" } }
    - { id: d, text: { en: "Content explorer", fr: "L'Explorateur de contenu" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Endpoint data loss prevention (Endpoint DLP) extends DLP policies to sensitive items that are physically stored on onboarded Windows and macOS devices. It can audit and restrict activities such as copying an item to a removable USB device or to a network share, or printing it."
    fr: "La protection contre la perte de données de point de terminaison (Endpoint DLP) étend les stratégies DLP aux éléments sensibles stockés physiquement sur des appareils Windows et macOS intégrés. Elle peut auditer et restreindre des activités comme la copie d'un élément sur un périphérique USB amovible ou sur un partage réseau, ou son impression."
  options:
    b:
      en: "Activity explorer shows what users did with sensitive content, such as a copy to a USB device; it reports the activity but doesn't prevent it."
      fr: "L'Explorateur d'activités montre ce que les utilisateurs ont fait du contenu sensible, par exemple une copie sur un périphérique USB ; il rapporte l'activité mais ne l'empêche pas."
    c:
      en: "Insider Risk Management raises alerts on risky user behavior so that it can be investigated; its purpose isn't to restrict an action on a device."
      fr: "La gestion des risques internes émet des alertes sur les comportements à risque des utilisateurs pour qu'ils soient examinés ; son but n'est pas de restreindre une action sur un appareil."
    d:
      en: "Content explorer shows which sensitive items exist and where they are stored."
      fr: "L'Explorateur de contenu montre quels éléments sensibles existent et où ils sont stockés."
references:
  - title: Learn about Endpoint data loss prevention
    url: https://learn.microsoft.com/en-us/purview/endpoint-dlp-learn-about
  - title: Describe data loss prevention in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/4-describe-data-loss-prevention
