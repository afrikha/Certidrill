id: sc900-4b-dlp-sentences
objective: "4.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about data loss prevention (DLP) in Microsoft Purview, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur la protection contre la perte de données (DLP) de Microsoft Purview, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To detect sensitive items, DLP relies on [[how]].

      For a sensitive item at rest, a DLP policy can lock the item and move it to [[rest]].

      A DLP policy can be created as a custom policy or from [[tpl]], for example for financial data or for medical and health data.
    fr: |
      Pour détecter les éléments sensibles, la DLP s'appuie sur [[how]].

      Pour un élément sensible au repos, une stratégie DLP peut verrouiller l'élément et le déplacer vers [[rest]].

      Une stratégie DLP peut être créée comme stratégie personnalisée ou à partir [[tpl]], par exemple pour les données financières ou pour les données médicales et de santé.
  slots:
    - id: how
      options:
        - { id: name, text: { en: "the names of the files", fr: "les noms des fichiers" } }
        - { id: deep, text: { en: "deep content analysis", fr: "une analyse approfondie du contenu" } }
        - { id: size, text: { en: "the size of the files", fr: "la taille des fichiers" } }
    - id: rest
      options:
        - { id: quar, text: { en: "a secure quarantine location", fr: "un emplacement de quarantaine sécurisé" } }
        - { id: review, text: { en: "a review set", fr: "un ensemble de révision" } }
        - { id: log, text: { en: "the unified audit log", fr: "le journal d'audit unifié" } }
    - id: tpl
      options:
        - { id: fileplan, text: { en: "a file plan", fr: "d'un plan de fichiers" } }
        - { id: sens, text: { en: "a sensitivity label policy", fr: "d'une stratégie d'étiquetage de confidentialité" } }
        - { id: template, text: { en: "a predefined template", fr: "d'un modèle prédéfini" } }
answer:
  values: { how: deep, rest: quar, tpl: template }
explanation:
  correct:
    en: "DLP doesn't run a simple text scan: it uses deep content analysis, which combines keyword matches, regular expressions, internal function validation, secondary matches close to the primary match, and machine learning. For data at rest, a policy can lock a sensitive item and move it to a secure quarantine location. A DLP policy is created from a predefined template, in categories such as financial data, medical and health data or privacy data, or as a custom policy; a file plan belongs to records management and a sensitivity label policy publishes labels."
    fr: "La DLP ne fait pas une simple analyse de texte : elle utilise une analyse approfondie du contenu, qui combine correspondances de mots clés, expressions régulières, validation par des fonctions internes, correspondances secondaires proches de la correspondance principale et machine learning. Pour les données au repos, une stratégie peut verrouiller un élément sensible et le déplacer vers un emplacement de quarantaine sécurisé. Une stratégie DLP se crée à partir d'un modèle prédéfini, dans des catégories comme les données financières, les données médicales et de santé ou les données de confidentialité, ou comme stratégie personnalisée ; un plan de fichiers relève de la gestion des enregistrements et une stratégie d'étiquetage de confidentialité publie des étiquettes."
references:
  - title: Describe data loss prevention in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/4-describe-data-loss-prevention
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
