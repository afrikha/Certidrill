id: sc900-4b-edisc-ocr
objective: "4.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    For a legal case, Northwind Traders adds scanned contracts that are stored as image files to a review set in Microsoft Purview eDiscovery. The reviewers must be able to search for words that appear in the images.

    Which premium eDiscovery feature makes this possible?
  fr: |
    Pour une affaire juridique, Northwind Traders ajoute des contrats numérisés, stockés sous forme de fichiers image, à un ensemble de révision dans Microsoft Purview eDiscovery. Les réviseurs doivent pouvoir rechercher des mots qui figurent dans les images.

    Quelle fonctionnalité premium d'eDiscovery rend cela possible ?
body:
  options:
    - { id: a, text: { en: "Conversation threading", fr: "Le regroupement des conversations en fils (conversation threading)" } }
    - { id: b, text: { en: "Decryption", fr: "Le déchiffrement" } }
    - { id: c, text: { en: "Tagging", fr: "L'ajout de balises (tagging)" } }
    - { id: d, text: { en: "Optical character recognition (OCR)", fr: "La reconnaissance optique de caractères (OCR)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "When content is added to a review set, optical character recognition extracts the text from images and includes it with the content. The text of the images can then be found by the queries that reviewers run in the review set."
    fr: "Quand du contenu est ajouté à un ensemble de révision, la reconnaissance optique de caractères extrait le texte des images et l'inclut avec le contenu. Le texte des images peut alors être trouvé par les requêtes que les réviseurs exécutent dans l'ensemble de révision."
  options:
    a:
      en: "Conversation threading collects the whole conversation around a Teams or Viva Engage message, so that it is reviewed in context."
      fr: "Le regroupement des conversations en fils collecte toute la conversation autour d'un message Teams ou Viva Engage, afin de l'examiner dans son contexte."
    b:
      en: "Decryption gives access to content that is protected by Microsoft encryption technologies, such as documents encrypted by a sensitivity label."
      fr: "Le déchiffrement donne accès au contenu protégé par les technologies de chiffrement de Microsoft, comme les documents chiffrés par une étiquette de confidentialité."
    c:
      en: "Tags let reviewers record their opinion about an item, for example that it isn't relevant."
      fr: "Les balises permettent aux réviseurs de consigner leur avis sur un élément, par exemple qu'il n'est pas pertinent."
references:
  - title: Describe eDiscovery
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/3-describe-ediscovery
  - title: Learn about eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc
