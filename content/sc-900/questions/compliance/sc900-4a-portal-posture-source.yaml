id: sc900-4a-portal-posture-source
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The home page of the Microsoft Purview portal displays a summary of the compliance posture of the organization.

    Which solution provides this information?
  fr: |
    La page d'accueil du portail Microsoft Purview affiche un résumé de la posture de conformité de l'organisation.

    Quelle solution fournit ces informations ?
body:
  options:
    - id: a
      text: { en: "Microsoft Purview Audit", fr: "Audit Microsoft Purview" }
    - id: b
      text: { en: "Compliance Manager", fr: "Gestionnaire de conformité" }
    - id: c
      text: { en: "Microsoft Secure Score", fr: "Degré de sécurisation Microsoft (Microsoft Secure Score)" }
    - id: d
      text: { en: "Activity explorer", fr: "Explorateur d'activités" }
answer: { optionId: b }
explanation:
  correct:
    en: "The compliance posture section of the home page summarizes the progress of the assessments in Compliance Manager and links to it. Compliance Manager is the Microsoft Purview solution that assesses compliance with regulations and standards and calculates the compliance score."
    fr: "La section sur la posture de conformité de la page d'accueil résume l'avancement des évaluations du Gestionnaire de conformité et renvoie vers celui-ci. Le Gestionnaire de conformité est la solution Microsoft Purview qui évalue la conformité aux réglementations et aux normes et calcule le score de conformité."
  options:
    a:
      en: "Audit records user and administrator activities so that they can be searched; it doesn't measure a compliance posture."
      fr: "Audit enregistre les activités des utilisateurs et des administrateurs pour qu'elles puissent être recherchées ; il ne mesure pas une posture de conformité."
    c:
      en: "Microsoft Secure Score measures the security posture and is shown in the Microsoft Defender portal."
      fr: "Le Degré de sécurisation Microsoft mesure la posture de sécurité et s'affiche dans le portail Microsoft Defender."
    d:
      en: "Activity explorer shows what users do with labeled content, not the progress toward regulations."
      fr: "L'Explorateur d'activités montre ce que les utilisateurs font du contenu étiqueté, pas l'avancement par rapport aux réglementations."
references:
  - title: Learn about the Microsoft Purview portal
    url: https://learn.microsoft.com/en-us/purview/purview-portal
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
