id: sc900-4b-sl-encrypt-finance
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank stores budget workbooks in Microsoft 365. Only the members of the Finance group must be able to open a workbook, even when a copy is sent by email outside the organization or saved to a USB drive.

    What should Woodgrove Bank apply to the workbooks?
  fr: |
    Woodgrove Bank stocke des classeurs budgétaires dans Microsoft 365. Seuls les membres du groupe Finance doivent pouvoir ouvrir un classeur, même lorsqu'une copie est envoyée par e-mail hors de l'organisation ou enregistrée sur une clé USB.

    Que doit appliquer Woodgrove Bank aux classeurs ?
body:
  options:
    - { id: a, text: { en: "A retention label", fr: "Une étiquette de rétention" } }
    - { id: b, text: { en: "A sensitivity label", fr: "Une étiquette de confidentialité" } }
    - { id: c, text: { en: "A data loss prevention (DLP) policy", fr: "Une stratégie de protection contre la perte de données (DLP)" } }
    - { id: d, text: { en: "An audit log retention policy", fr: "Une stratégie de rétention des journaux d'audit" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A sensitivity label can encrypt a document and limit access to the users or groups that the administrator chooses. The label and its protection are stored with the file, so they stay with every copy, wherever it is saved or sent."
    fr: "Une étiquette de confidentialité peut chiffrer un document et limiter l'accès aux utilisateurs ou aux groupes choisis par l'administrateur. L'étiquette et sa protection sont stockées avec le fichier : elles suivent donc chaque copie, où qu'elle soit enregistrée ou envoyée."
  options:
    a:
      en: "A retention label sets how long an item is kept and what happens afterward; it doesn't control who can open the item."
      fr: "Une étiquette de rétention fixe la durée de conservation d'un élément et ce qu'il devient ensuite ; elle ne contrôle pas qui peut l'ouvrir."
    c:
      en: "A DLP policy detects and blocks the inappropriate sharing of sensitive items; it doesn't encrypt a file so that a copy stays unreadable for other people."
      fr: "Une stratégie DLP détecte et bloque le partage inapproprié d'éléments sensibles ; elle ne chiffre pas un fichier pour qu'une copie reste illisible pour d'autres personnes."
    d:
      en: "An audit log retention policy sets how long audit records are kept; it doesn't protect documents."
      fr: "Une stratégie de rétention des journaux d'audit fixe la durée de conservation des enregistrements d'audit ; elle ne protège pas les documents."
references:
  - title: Describe sensitivity labels and policies in Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/3-describe-sensitivity-labels-policies
  - title: Learn about sensitivity labels
    url: https://learn.microsoft.com/en-us/purview/sensitivity-labels
