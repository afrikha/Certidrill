id: sc900-4a-expl-facts-sentence
objective: "4.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about the explorers of Microsoft Purview, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur les explorateurs de Microsoft Purview, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Content explorer shows [[content]].

      Activity explorer shows [[activity]].

      Access to the items in Content explorer is highly restricted because Content explorer [[why]].
    fr: |
      L'Explorateur de contenu montre [[content]].

      L'Explorateur d'activités montre [[activity]].

      L'accès aux éléments dans l'Explorateur de contenu est très restreint parce que l'Explorateur de contenu [[why]].
  slots:
    - id: content
      options:
        - { id: hist, text: { en: "a history of the activities performed on labeled content", fr: "un historique des activités effectuées sur le contenu étiqueté" } }
        - { id: actions, text: { en: "a list of the improvement actions assigned to users", fr: "une liste des actions d'amélioration attribuées aux utilisateurs" } }
        - { id: snap, text: { en: "a current snapshot of the labeled or classified items", fr: "un instantané actuel des éléments étiquetés ou classifiés" } }
    - id: activity
      options:
        - { id: hist, text: { en: "a history of the activities performed on labeled content", fr: "un historique des activités effectuées sur le contenu étiqueté" } }
        - { id: actions, text: { en: "a list of the improvement actions assigned to users", fr: "une liste des actions d'amélioration attribuées aux utilisateurs" } }
        - { id: snap, text: { en: "a current snapshot of the labeled or classified items", fr: "un instantané actuel des éléments étiquetés ou classifiés" } }
    - id: why
      options:
        - { id: read, text: { en: "allows reading the contents of scanned files", fr: "permet de lire le contenu des fichiers analysés" } }
        - { id: label, text: { en: "changes the labels of the items that it displays", fr: "modifie les étiquettes des éléments qu'il affiche" } }
        - { id: delete, text: { en: "deletes the items after they are reviewed", fr: "supprime les éléments après leur examen" } }
answer:
  values: { content: snap, activity: hist, why: read }
explanation:
  correct:
    en: "Content explorer is a current snapshot of the items that have a sensitivity label, a retention label or a sensitive information type, with their location. Activity explorer is a historical view of what was done with labeled content. Because Content explorer lets authorized users open scanned source content, access to its items is limited to the members of dedicated role groups."
    fr: "L'Explorateur de contenu est un instantané actuel des éléments qui ont une étiquette de confidentialité, une étiquette de rétention ou un type d'informations sensibles, avec leur emplacement. L'Explorateur d'activités est une vue historique de ce qui a été fait du contenu étiqueté. Comme l'Explorateur de contenu permet aux utilisateurs autorisés d'ouvrir le contenu source analysé, l'accès à ses éléments est limité aux membres de groupes de rôles dédiés."
  options:
    actions:
      en: "Improvement actions and their owners are listed in Compliance Manager."
      fr: "Les actions d'amélioration et leurs propriétaires sont listés dans le Gestionnaire de conformité."
    label:
      en: "Content explorer is a viewing tool: it doesn't change the labels of the items."
      fr: "L'Explorateur de contenu est un outil de consultation : il ne modifie pas les étiquettes des éléments."
references:
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
  - title: Get started with content explorer
    url: https://learn.microsoft.com/en-us/purview/data-classification-content-explorer
