id: sc900-4a-priv-control-yn
objective: "4.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the privacy principles of Microsoft, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les principes de confidentialité de Microsoft, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft mines the data of its cloud customers for advertising purposes."
        fr: "Microsoft exploite les données de ses clients cloud à des fins publicitaires."
    - id: s2
      text:
        en: "A customer can delete its data from Microsoft cloud services at any time."
        fr: "Un client peut supprimer ses données des services cloud Microsoft à tout moment."
    - id: s3
      text:
        en: "Microsoft complies with ISO/IEC 27018, a code of practice for cloud privacy."
        fr: "Microsoft se conforme à ISO/IEC 27018, un code de bonnes pratiques pour la confidentialité dans le cloud."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Microsoft doesn't share customer data with advertiser-supported services and doesn't mine it for marketing research or advertising: it uses the data only to provide the services that the customer has chosen. The data belongs to the customer, who can access, modify or delete it at any time. Microsoft complies with broadly applicable privacy laws and standards, including ISO/IEC 27018, the international code of practice for cloud privacy."
    fr: "Microsoft ne partage pas les données des clients avec des services financés par la publicité et ne les exploite pas à des fins d'études de marché ou de publicité : il ne les utilise que pour fournir les services que le client a choisis. Les données appartiennent au client, qui peut y accéder, les modifier ou les supprimer à tout moment. Microsoft se conforme aux lois et aux normes de confidentialité largement applicables, dont ISO/IEC 27018, le code international de bonnes pratiques pour la confidentialité dans le cloud."
references:
  - title: Describe Microsoft's privacy principles
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles
