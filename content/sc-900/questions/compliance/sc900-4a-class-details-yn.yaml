id: sc900-4a-class-details-yn
objective: "4.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about data classification in Microsoft Purview, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la classification des données dans Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A sensitive information type learns to recognize content by analyzing hundreds of sample documents."
        fr: "Un type d'informations sensibles apprend à reconnaître le contenu en analysant des centaines d'échantillons de documents."
    - id: s2
      text:
        en: "Named entity sensitive information types detect person names and physical addresses."
        fr: "Les types d'informations sensibles d'entité nommée détectent des noms de personnes et des adresses postales."
    - id: s3
      text:
        en: "Sensitive information types and trainable classifiers can be used as conditions in data loss prevention (DLP) policies."
        fr: "Les types d'informations sensibles et les classifieurs entraînables peuvent servir de conditions dans les stratégies de protection contre la perte de données (DLP)."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Learning from examples is what a trainable classifier does; a sensitive information type matches a pattern, with supporting evidence and a confidence level. Named entity sensitive information types detect person names, physical addresses and medical terms and conditions. Both kinds of classifiers feed other solutions: they can be used in DLP policies, for the automatic application of sensitivity labels and for retention label policies."
    fr: "Apprendre à partir d'exemples est ce que fait un classifieur entraînable ; un type d'informations sensibles reconnaît un modèle, avec des éléments de preuve et un niveau de confiance. Les types d'informations sensibles d'entité nommée détectent des noms de personnes, des adresses postales et des termes et affections médicaux. Les deux sortes de classifieurs alimentent d'autres solutions : ils peuvent servir dans les stratégies DLP, pour l'application automatique d'étiquettes de confidentialité et pour les stratégies d'étiquette de rétention."
references:
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
  - title: Learn about sensitive information types
    url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-learn-about
