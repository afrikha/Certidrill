id: sc900-4a-stp-sign-in-account
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The Service Trust Portal is a public site, but some of its resources are available only to authenticated users.

    Which type of account gives access to these resources?
  fr: |
    Le Portail d'approbation des services est un site public, mais certaines de ses ressources ne sont accessibles qu'aux utilisateurs authentifiés.

    Quel type de compte donne accès à ces ressources ?
body:
  options:
    - id: a
      text: { en: "An account in an on-premises Active Directory domain", fr: "Un compte d'un domaine Active Directory local" }
    - id: b
      text: { en: "A local administrator account on a Windows device", fr: "Un compte d'administrateur local sur un appareil Windows" }
    - id: c
      text: { en: "A Microsoft Entra organization account", fr: "Un compte d'organisation Microsoft Entra" }
    - id: d
      text: { en: "A managed identity of an Azure resource", fr: "Une identité managée d'une ressource Azure" }
answer: { optionId: c }
explanation:
  correct:
    en: "To open the protected resources of the Service Trust Portal, a user signs in with a Microsoft cloud services account, that is, a Microsoft Entra organization account. The user must also accept the Microsoft non-disclosure agreement for compliance materials."
    fr: "Pour ouvrir les ressources protégées du Portail d'approbation des services, un utilisateur se connecte avec un compte de services cloud Microsoft, c'est-à-dire un compte d'organisation Microsoft Entra. Il doit aussi accepter l'accord de confidentialité de Microsoft pour les documents de conformité."
  options:
    a:
      en: "An on-premises Active Directory account authenticates against domain controllers; the portal expects a cloud account of Microsoft Entra ID."
      fr: "Un compte Active Directory local s'authentifie auprès de contrôleurs de domaine ; le portail attend un compte cloud de Microsoft Entra ID."
    b:
      en: "A local account exists only on one device and can't sign in to a Microsoft cloud site."
      fr: "Un compte local n'existe que sur un appareil et ne permet pas de se connecter à un site cloud de Microsoft."
    d:
      en: "A managed identity is a workload identity that an Azure resource uses to access other resources; a person can't sign in to a portal with it."
      fr: "Une identité managée est une identité de charge de travail qu'une ressource Azure utilise pour accéder à d'autres ressources ; une personne ne peut pas s'en servir pour se connecter à un portail."
references:
  - title: Get started with the Microsoft Service Trust Portal
    url: https://learn.microsoft.com/en-us/purview/get-started-with-service-trust-portal
  - title: Describe the offerings of the Service Trust portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal
