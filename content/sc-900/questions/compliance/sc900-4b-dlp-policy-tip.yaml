id: sc900-4b-dlp-policy-tip
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user writes an email that contains several bank account numbers. Before the email is sent, a message appears in Outlook to warn the user that the email contains sensitive information that shouldn't be shared with the external recipient.

    What does a data loss prevention (DLP) policy use to display this warning?
  fr: |
    Un utilisateur rédige un e-mail qui contient plusieurs numéros de compte bancaire. Avant l'envoi, un message apparaît dans Outlook pour avertir l'utilisateur que l'e-mail contient des informations sensibles qui ne devraient pas être partagées avec le destinataire externe.

    Qu'utilise une stratégie de protection contre la perte de données (DLP) pour afficher cet avertissement ?
body:
  options:
    - { id: a, text: { en: "A content marking", fr: "Un marquage de contenu" } }
    - { id: b, text: { en: "A disposition review", fr: "Une révision de destruction" } }
    - { id: c, text: { en: "A policy tip", fr: "Un conseil de stratégie" } }
    - { id: d, text: { en: "A review set", fr: "Un ensemble de révision" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A policy tip is the pop-up notification that a DLP policy shows to a user who might be sharing a sensitive item inappropriately. It educates the user and, depending on the policy, can let the user override a block by giving a justification."
    fr: "Un conseil de stratégie est la notification qu'une stratégie DLP affiche à un utilisateur qui risque de partager un élément sensible de façon inappropriée. Il sensibilise l'utilisateur et, selon la stratégie, peut lui permettre de passer outre un blocage en donnant une justification."
  options:
    a:
      en: "A content marking is a header, a footer or a watermark that a sensitivity label adds to content."
      fr: "Un marquage de contenu est un en-tête, un pied de page ou un filigrane qu'une étiquette de confidentialité ajoute au contenu."
    b:
      en: "A disposition review lets a reviewer decide what happens to an item at the end of its retention period."
      fr: "Une révision de destruction permet à un réviseur de décider du sort d'un élément à la fin de sa période de rétention."
    d:
      en: "A review set is a copy of collected content that is analyzed in an eDiscovery case."
      fr: "Un ensemble de révision est une copie du contenu collecté, analysée dans un cas eDiscovery."
references:
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
  - title: Describe data loss prevention in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/4-describe-data-loss-prevention
