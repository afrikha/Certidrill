id: sc900-4b-edisc-purpose
objective: "4.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is involved in a lawsuit. The legal department must find the emails and the documents that relate to the lawsuit and deliver them as evidence.

    Which Microsoft Purview solution should the legal department use?
  fr: |
    Fabrikam est impliquée dans un procès. Le service juridique doit trouver les e-mails et les documents liés au procès et les fournir comme preuves.

    Quelle solution Microsoft Purview le service juridique doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Compliance Manager", fr: "Le gestionnaire de conformité (Compliance Manager)" } }
    - { id: b, text: { en: "Insider Risk Management", fr: "La gestion des risques internes (Insider Risk Management)" } }
    - { id: c, text: { en: "eDiscovery", fr: "eDiscovery" } }
    - { id: d, text: { en: "Audit", fr: "Audit" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Electronic discovery, or eDiscovery, is the process of identifying and delivering electronic information that can be used as evidence in legal cases. Microsoft Purview eDiscovery searches the content of Microsoft 365 services, preserves it and exports it."
    fr: "La découverte électronique, ou eDiscovery, est le processus qui consiste à identifier et à fournir des informations électroniques utilisables comme preuves dans des affaires juridiques. Microsoft Purview eDiscovery recherche le contenu des services Microsoft 365, le préserve et l'exporte."
  options:
    a:
      en: "Compliance Manager assesses the compliance posture of the organization and suggests improvement actions."
      fr: "Le gestionnaire de conformité évalue la posture de conformité de l'organisation et propose des actions d'amélioration."
    b:
      en: "Insider Risk Management detects and investigates risky activities of users; it doesn't deliver content as evidence."
      fr: "La gestion des risques internes détecte et examine les activités à risque des utilisateurs ; elle ne fournit pas de contenu comme preuve."
    d:
      en: "Audit records the activities of users and administrators: it shows who did what, not the content of emails and documents."
      fr: "Audit enregistre les activités des utilisateurs et des administrateurs : il montre qui a fait quoi, pas le contenu des e-mails et des documents."
references:
  - title: Describe eDiscovery
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/3-describe-ediscovery
  - title: Learn about eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc
