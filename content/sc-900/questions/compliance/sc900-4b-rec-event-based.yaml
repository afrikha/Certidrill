id: sc900-4b-rec-event-based
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum must keep the personnel file of each employee for seven years after the employee leaves the company. The date on which a file was created must not be used to calculate the retention period.

    Which records management capability should Adatum use?
  fr: |
    Adatum doit conserver le dossier personnel de chaque employé pendant sept ans après le départ de l'employé. La date de création d'un dossier ne doit pas servir à calculer la période de rétention.

    Quelle fonctionnalité de la gestion des enregistrements Adatum doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Event-based retention", fr: "La rétention basée sur des événements" } }
    - { id: b, text: { en: "Disposition review", fr: "La révision de destruction" } }
    - { id: c, text: { en: "Proof of disposition", fr: "La preuve de destruction" } }
    - { id: d, text: { en: "File plan", fr: "Le plan de fichiers" } }
answer: { optionId: a }
explanation:
  correct:
    en: "With event-based retention, the retention period starts when a specific event occurs, such as the end of an employment, the expiration of a contract or the end of life of a product, instead of starting from a fixed point such as the creation of the item."
    fr: "Avec la rétention basée sur des événements, la période de rétention démarre quand un événement précis se produit, comme la fin d'un emploi, l'expiration d'un contrat ou la fin de vie d'un produit, au lieu de démarrer à un point fixe comme la création de l'élément."
  options:
    b:
      en: "A disposition review lets reviewers approve the deletion of an item at the end of its retention period; it doesn't decide when the period starts."
      fr: "Une révision de destruction permet à des réviseurs d'approuver la suppression d'un élément à la fin de sa période de rétention ; elle ne décide pas du début de la période."
    c:
      en: "Proof of disposition confirms how and when a record was deleted."
      fr: "La preuve de destruction confirme comment et quand un enregistrement a été supprimé."
    d:
      en: "A file plan is the place where all the retention labels are viewed and managed."
      fr: "Un plan de fichiers est l'endroit où toutes les étiquettes de rétention sont consultées et gérées."
references:
  - title: Describe Microsoft Purview Records Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/7-describe-records-management
  - title: Learn about records management
    url: https://learn.microsoft.com/en-us/purview/records-management
