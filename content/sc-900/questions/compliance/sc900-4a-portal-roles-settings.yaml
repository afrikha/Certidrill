id: sc900-4a-portal-roles-settings
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator of Proseware must review the roles and scopes that control access to the Microsoft Purview solutions.

    Where in the Microsoft Purview portal are roles and scopes located?
  fr: |
    Un administrateur de Proseware doit passer en revue les rôles et les étendues qui contrôlent l'accès aux solutions Microsoft Purview.

    Où les rôles et les étendues se trouvent-ils dans le portail Microsoft Purview ?
body:
  options:
    - id: a
      text: { en: "In Settings", fr: "Dans les Paramètres (Settings)" }
    - id: b
      text: { en: "In the Knowledge Center", fr: "Dans le Centre de connaissances (Knowledge Center)" }
    - id: c
      text: { en: "In Content explorer", fr: "Dans l'Explorateur de contenu" }
    - id: d
      text: { en: "In Compliance Manager", fr: "Dans le Gestionnaire de conformité" }
answer: { optionId: a }
explanation:
  correct:
    en: "The Microsoft Purview portal is a single entry point for navigation, search, settings and the management of roles and permissions. Settings are centralized: portal-wide settings, solution settings, and roles and scopes are all found under Settings."
    fr: "Le portail Microsoft Purview est un point d'entrée unique pour la navigation, la recherche, les paramètres et la gestion des rôles et des autorisations. Les paramètres sont centralisés : les paramètres du portail, ceux des solutions, ainsi que les rôles et les étendues se trouvent tous sous Paramètres."
  options:
    b:
      en: "The Knowledge Center offers articles, product demos, tutorials and learning materials."
      fr: "Le Centre de connaissances propose des articles, des démonstrations de produits, des tutoriels et des supports d'apprentissage."
    c:
      en: "Content explorer shows the items that are labeled or contain sensitive information; access to it is granted through role groups, but they aren't managed there."
      fr: "L'Explorateur de contenu montre les éléments étiquetés ou contenant des informations sensibles ; son accès est accordé par des groupes de rôles, mais ils ne se gèrent pas à cet endroit."
    d:
      en: "Compliance Manager manages assessments and improvement actions, not the roles of the portal."
      fr: "Le Gestionnaire de conformité gère des évaluations et des actions d'amélioration, pas les rôles du portail."
references:
  - title: Learn about the Microsoft Purview portal
    url: https://learn.microsoft.com/en-us/purview/purview-portal
