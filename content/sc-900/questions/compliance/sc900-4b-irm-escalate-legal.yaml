id: sc900-4b-irm-escalate-legal
objective: "4.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At Adatum, the investigation of an insider risk management case shows a serious violation. The legal department must now review the case, and the related content must be preserved and exported.

    To which Microsoft Purview solution can the reviewer escalate the case?
  fr: |
    Chez Adatum, l'examen d'un cas de gestion des risques internes révèle une violation grave. Le service juridique doit maintenant étudier le cas, et le contenu associé doit être préservé et exporté.

    Vers quelle solution Microsoft Purview le réviseur peut-il transmettre le cas ?
body:
  options:
    - { id: a, text: { en: "Audit", fr: "Audit" } }
    - { id: b, text: { en: "eDiscovery", fr: "eDiscovery" } }
    - { id: c, text: { en: "Compliance Manager", fr: "Le gestionnaire de conformité (Compliance Manager)" } }
    - { id: d, text: { en: "Data Loss Prevention", fr: "La protection contre la perte de données (Data Loss Prevention)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The last step of the insider risk management workflow is action. A reviewer can resolve a case by sending a reminder notice to the user, or escalate a serious case to eDiscovery for a legal investigation; eDiscovery then preserves, reviews and exports the content."
    fr: "La dernière étape du flux de travail de la gestion des risques internes est l'action. Un réviseur peut résoudre un cas en envoyant un rappel à l'utilisateur, ou transmettre un cas grave à eDiscovery pour une investigation juridique ; eDiscovery permet alors de préserver, d'examiner et d'exporter le contenu."
  options:
    a:
      en: "Audit records who did what; an insider risk case isn't escalated to it, and it doesn't preserve or export content."
      fr: "Audit enregistre qui a fait quoi ; un cas de risque interne ne lui est pas transmis, et il ne préserve ni n'exporte de contenu."
    c:
      en: "Compliance Manager assesses and tracks the compliance posture of the organization against regulations."
      fr: "Le gestionnaire de conformité évalue et suit la posture de conformité de l'organisation par rapport aux réglementations."
    d:
      en: "Data Loss Prevention blocks the inappropriate sharing of sensitive items; it has no case to investigate for the legal department."
      fr: "La protection contre la perte de données bloque le partage inapproprié d'éléments sensibles ; elle n'a pas de cas à faire examiner par le service juridique."
references:
  - title: Describe insider risk management in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/5-describe-insider-risk-management
  - title: Learn about Insider Risk Management
    url: https://learn.microsoft.com/en-us/purview/insider-risk-management
