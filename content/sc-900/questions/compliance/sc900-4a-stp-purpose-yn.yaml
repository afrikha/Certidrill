id: sc900-4a-stp-purpose-yn
objective: "4.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the Service Trust Portal, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le Portail d'approbation des services, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Service Trust Portal publishes audit reports on Microsoft cloud services that external auditors produced."
        fr: "Le Portail d'approbation des services publie des rapports d'audit sur les services cloud Microsoft produits par des auditeurs externes."
    - id: s2
      text:
        en: "The Service Trust Portal calculates a compliance score for the Microsoft 365 tenant of your organization."
        fr: "Le Portail d'approbation des services calcule un score de conformité pour le locataire Microsoft 365 de votre organisation."
    - id: s3
      text:
        en: "The Service Trust Portal provides whitepapers written by Microsoft on how its cloud services protect data."
        fr: "Le Portail d'approbation des services fournit des livres blancs rédigés par Microsoft sur la façon dont ses services cloud protègent les données."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "The Service Trust Portal is Microsoft's public site for audit reports produced by external auditors and for other compliance information about its cloud services, including whitepapers written by Microsoft. It documents the compliance of Microsoft's services; it doesn't assess a customer tenant. The compliance score is calculated by Compliance Manager, in the Microsoft Purview portal."
    fr: "Le Portail d'approbation des services est le site public de Microsoft pour les rapports d'audit produits par des auditeurs externes et pour d'autres informations de conformité sur ses services cloud, dont des livres blancs rédigés par Microsoft. Il documente la conformité des services de Microsoft ; il n'évalue pas le locataire d'un client. Le score de conformité est calculé par le Gestionnaire de conformité, dans le portail Microsoft Purview."
references:
  - title: Describe the offerings of the Service Trust portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal
