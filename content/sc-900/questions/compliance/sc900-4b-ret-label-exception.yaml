id: sc900-4b-ret-label-exception
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a retention policy that retains the documents of a SharePoint site for five years and then deletes them. A few contracts stored on the site must be retained for ten years. The other documents must still be deleted after five years.

    What should Fabrikam use for the contracts?
  fr: |
    Fabrikam dispose d'une stratégie de rétention qui conserve les documents d'un site SharePoint pendant cinq ans, puis les supprime. Quelques contrats stockés sur le site doivent être conservés pendant dix ans. Les autres documents doivent toujours être supprimés au bout de cinq ans.

    Que doit utiliser Fabrikam pour les contrats ?
body:
  options:
    - { id: a, text: { en: "A second retention policy that retains the content of the site for ten years", fr: "Une deuxième stratégie de rétention qui conserve le contenu du site pendant dix ans" } }
    - { id: b, text: { en: "A sensitivity label that is applied to each contract", fr: "Une étiquette de confidentialité appliquée à chaque contrat" } }
    - { id: c, text: { en: "A retention label that is applied to each contract", fr: "Une étiquette de rétention appliquée à chaque contrat" } }
    - { id: d, text: { en: "A data loss prevention (DLP) policy for the site", fr: "Une stratégie de protection contre la perte de données (DLP) pour le site" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A retention policy gives the same settings to all the content of a site, whereas a retention label assigns settings to an individual item. The two can be combined: the policy keeps every document for five years, and a retention label with a ten-year period on the contracts keeps only these items longer, because the longest retention period wins."
    fr: "Une stratégie de rétention donne les mêmes paramètres à tout le contenu d'un site, alors qu'une étiquette de rétention attribue des paramètres à un élément précis. Les deux se combinent : la stratégie conserve chaque document pendant cinq ans, et une étiquette de rétention de dix ans sur les contrats conserve plus longtemps ces seuls éléments, car la période de rétention la plus longue l'emporte."
  options:
    a:
      en: "A retention policy applies to all the content of the site: every document would be retained for ten years, not only the contracts."
      fr: "Une stratégie de rétention s'applique à tout le contenu du site : tous les documents seraient conservés dix ans, pas seulement les contrats."
    b:
      en: "A sensitivity label classifies and protects an item; it has no retention period."
      fr: "Une étiquette de confidentialité classifie et protège un élément ; elle n'a pas de période de rétention."
    d:
      en: "A DLP policy prevents the inappropriate sharing of sensitive items; it doesn't retain content."
      fr: "Une stratégie DLP empêche le partage inapproprié d'éléments sensibles ; elle ne conserve pas de contenu."
references:
  - title: Describe Data Lifecycle Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/6-describe-data-lifecycle-management
  - title: Learn about retention policies and retention labels
    url: https://learn.microsoft.com/en-us/purview/retention
