id: sc900-4b-dlp-actions-multi
objective: "4.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A user tries to share a file that contains health records with a person outside the organization. The file matches a data loss prevention (DLP) policy.

    Which two actions can the DLP policy take? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un utilisateur tente de partager un fichier qui contient des dossiers médicaux avec une personne extérieure à l'organisation. Le fichier correspond à une stratégie de protection contre la perte de données (DLP).

    Quelles sont les deux actions que la stratégie DLP peut effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Block the sharing, and let the user override the block by giving a justification.", fr: "Bloquer le partage, et laisser l'utilisateur passer outre le blocage en donnant une justification." } }
    - { id: b, text: { en: "Mark the file as a regulatory record, so that its label can never be removed.", fr: "Marquer le fichier comme enregistrement réglementaire, afin que son étiquette ne puisse jamais être retirée." } }
    - { id: c, text: { en: "Place the mailbox of the user on hold, so that its content is preserved.", fr: "Placer la boîte aux lettres de l'utilisateur en attente, afin que son contenu soit préservé." } }
    - { id: d, text: { en: "Show a policy tip that warns the user about the sensitive content.", fr: "Afficher un conseil de stratégie qui avertit l'utilisateur de la présence de contenu sensible." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "When the conditions of a DLP policy are met, the policy can show a policy tip that warns the user, block the sharing while allowing an override with a justification, or block the sharing with no override. These protective actions happen at the moment of the activity."
    fr: "Quand les conditions d'une stratégie DLP sont remplies, la stratégie peut afficher un conseil de stratégie qui avertit l'utilisateur, bloquer le partage en autorisant un passage outre avec justification, ou bloquer le partage sans possibilité de passer outre. Ces actions de protection ont lieu au moment de l'activité."
  options:
    b:
      en: "An item becomes a regulatory record through a retention label, in records management."
      fr: "Un élément devient un enregistrement réglementaire par une étiquette de rétention, dans la gestion des enregistrements."
    c:
      en: "A hold on a mailbox is created in an eDiscovery case to preserve content for an investigation."
      fr: "Une mise en attente d'une boîte aux lettres se crée dans un cas eDiscovery pour préserver du contenu en vue d'une investigation."
references:
  - title: Learn about data loss prevention
    url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
  - title: Describe data loss prevention in Microsoft Purview
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/4-describe-data-loss-prevention
