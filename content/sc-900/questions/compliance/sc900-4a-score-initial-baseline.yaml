id: sc900-4a-score-initial-baseline
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator of Northwind Traders opens Compliance Manager for the first time. A compliance score is already displayed, although Northwind Traders hasn't created any assessment.

    What is this initial score based on?
  fr: |
    Un administrateur de Northwind Traders ouvre le Gestionnaire de conformité pour la première fois. Un score de conformité est déjà affiché, alors que Northwind Traders n'a créé aucune évaluation.

    Sur quoi ce score initial est-il fondé ?
body:
  options:
    - id: a
      text: { en: "The Microsoft 365 data protection baseline", fr: "La base de référence de protection des données Microsoft 365" }
    - id: b
      text: { en: "The Microsoft Secure Score of the tenant", fr: "Le Degré de sécurisation Microsoft (Microsoft Secure Score) du locataire" }
    - id: c
      text: { en: "The average score of the organizations of the same industry", fr: "Le score moyen des organisations du même secteur" }
    - id: d
      text: { en: "The audit reports of the Service Trust Portal", fr: "Les rapports d'audit du Portail d'approbation des services" }
answer: { optionId: a }
explanation:
  correct:
    en: "Compliance Manager gives every organization an initial score based on the Microsoft 365 data protection baseline, a set of controls that covers key regulations and standards for data protection and general data governance. This default assessment is provided to all organizations, and Compliance Manager already collects signals from the Microsoft 365 environment at the first visit."
    fr: "Le Gestionnaire de conformité donne à chaque organisation un score initial fondé sur la base de référence de protection des données Microsoft 365, un ensemble de contrôles qui couvre les principales réglementations et normes de protection des données et de gouvernance générale des données. Cette évaluation par défaut est fournie à toutes les organisations, et le Gestionnaire de conformité collecte déjà les signaux de l'environnement Microsoft 365 lors de la première visite."
  options:
    b:
      en: "Microsoft Secure Score is a separate measurement of the security posture, shown in the Microsoft Defender portal."
      fr: "Le Degré de sécurisation Microsoft est une mesure distincte de la posture de sécurité, affichée dans le portail Microsoft Defender."
    c:
      en: "The initial score comes from the organization's own environment assessed against a default set of controls, not from other organizations."
      fr: "Le score initial vient de l'environnement de l'organisation elle-même, évalué par rapport à un ensemble de contrôles par défaut, pas d'autres organisations."
    d:
      en: "The audit reports of the Service Trust Portal concern Microsoft cloud services and aren't used to score a customer."
      fr: "Les rapports d'audit du Portail d'approbation des services concernent les services cloud Microsoft et ne servent pas à noter un client."
references:
  - title: Compliance Manager scoring
    url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
