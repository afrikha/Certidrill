id: sc900-4a-class-custom-classifier-steps
objective: "4.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys wants a custom trainable classifier that recognizes its design documents.

    Which three actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys veut un classifieur entraînable personnalisé qui reconnaît ses documents de conception.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: regex, text: { en: "Define a regular expression as the primary element.", fr: "Définir une expression régulière comme élément principal." } }
    - { id: publish, text: { en: "Publish the classifier.", fr: "Publier le classifieur." } }
    - { id: seed, text: { en: "Provide samples that belong to the category and samples that don't.", fr: "Fournir des échantillons qui appartiennent à la catégorie et des échantillons qui n'y appartiennent pas." } }
    - { id: hash, text: { en: "Upload a hashed table of sensitive values.", fr: "Charger une table hachée de valeurs sensibles." } }
    - { id: verify, text: { en: "Review the predictions of the classifier and sort them into correct and incorrect results.", fr: "Passer en revue les prédictions du classifieur et les trier en résultats corrects et incorrects." } }
    - { id: label, text: { en: "Publish a sensitivity label policy to the users.", fr: "Publier une stratégie d'étiquetage de confidentialité pour les utilisateurs." } }
answer:
  sequence: [ seed, verify, publish ]
explanation:
  correct:
    en: |
      A custom trainable classifier is created in three stages. First, seeding: the organization provides samples that are definitely in the category and samples that are definitely not, from which Microsoft Purview builds a prediction model. Then the results are verified: the predictions are sorted into true positives, true negatives, false positives and false negatives to improve accuracy. Finally the classifier is published, and it can then classify items in locations such as SharePoint, Exchange and OneDrive.
    fr: |
      Un classifieur entraînable personnalisé se crée en trois étapes. D'abord l'amorçage : l'organisation fournit des échantillons qui appartiennent à coup sûr à la catégorie et des échantillons qui n'y appartiennent pas, à partir desquels Microsoft Purview construit un modèle de prédiction. Ensuite les résultats sont vérifiés : les prédictions sont triées en vrais positifs, vrais négatifs, faux positifs et faux négatifs pour améliorer la précision. Enfin le classifieur est publié, et il peut alors classifier des éléments dans des emplacements comme SharePoint, Exchange et OneDrive.
  options:
    regex:
      en: "A regular expression as primary element defines a sensitive information type, which matches a pattern; a trainable classifier learns from samples."
      fr: "Une expression régulière comme élément principal définit un type d'informations sensibles, qui reconnaît un modèle ; un classifieur entraînable apprend à partir d'échantillons."
    hash:
      en: "Uploading a hashed table of sensitive values belongs to exact data match (EDM) sensitive information types."
      fr: "Charger une table hachée de valeurs sensibles relève des types d'informations sensibles à correspondance exacte des données (EDM)."
    label:
      en: "A sensitivity label policy makes labels available to users; it isn't a step of the creation of a classifier."
      fr: "Une stratégie d'étiquetage de confidentialité met des étiquettes à la disposition des utilisateurs ; ce n'est pas une étape de la création d'un classifieur."
references:
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
  - title: Learn about trainable classifiers
    url: https://learn.microsoft.com/en-us/purview/trainable-classifiers-learn-about
