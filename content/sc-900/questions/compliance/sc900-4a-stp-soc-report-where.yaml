id: sc900-4a-stp-soc-report-where
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external auditor asks Fabrikam for the latest SOC 2 report on the Microsoft cloud services that the company uses.

    Where can this report be downloaded?
  fr: |
    Un auditeur externe demande à Fabrikam le dernier rapport SOC 2 sur les services cloud Microsoft que l'entreprise utilise.

    Où ce rapport peut-il être téléchargé ?
body:
  options:
    - id: a
      text: { en: "Microsoft Purview Compliance Manager", fr: "Gestionnaire de conformité Microsoft Purview" }
    - id: b
      text: { en: "Service Trust Portal", fr: "Portail d'approbation des services" }
    - id: c
      text: { en: "Microsoft Defender portal", fr: "Portail Microsoft Defender" }
    - id: d
      text: { en: "Microsoft Entra admin center", fr: "Centre d'administration Microsoft Entra" }
answer: { optionId: b }
explanation:
  correct:
    en: "The Service Trust Portal is the public site where Microsoft publishes the audit reports that external auditors produce about its cloud services, together with other compliance information. Its Certifications, Regulations, and Standards category includes the SOC 1, 2 and 3 reports, which can be downloaded."
    fr: "Le Portail d'approbation des services est le site public où Microsoft publie les rapports d'audit que des auditeurs externes produisent sur ses services cloud, ainsi que d'autres informations de conformité. Sa catégorie Certifications, réglementations et normes comprend les rapports SOC 1, 2 et 3, qui peuvent être téléchargés."
  options:
    a:
      en: "Compliance Manager assesses the compliance of your own environment and proposes improvement actions; it isn't the place where Microsoft publishes the audit reports on its services."
      fr: "Le Gestionnaire de conformité évalue la conformité de votre propre environnement et propose des actions d'amélioration ; ce n'est pas l'endroit où Microsoft publie les rapports d'audit sur ses services."
    c:
      en: "The Microsoft Defender portal is used to investigate incidents and alerts and to manage the security posture, not to obtain audit reports."
      fr: "Le portail Microsoft Defender sert à examiner les incidents et les alertes et à gérer la posture de sécurité, pas à obtenir des rapports d'audit."
    d:
      en: "The Microsoft Entra admin center manages identities, such as users, groups and Conditional Access policies."
      fr: "Le Centre d'administration Microsoft Entra gère les identités : utilisateurs, groupes et stratégies d'accès conditionnel, par exemple."
references:
  - title: Describe the offerings of the Service Trust portal
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal
  - title: Get started with the Microsoft Service Trust Portal
    url: https://learn.microsoft.com/en-us/purview/get-started-with-service-trust-portal
