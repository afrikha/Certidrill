id: sc900-4a-expl-content-viewer-role
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In Content explorer, an administrator of Adatum can see the list of the items that contain sensitive information and the location of each item. However, the administrator can't open an item to view its contents.

    Which role group must the administrator be added to?
  fr: |
    Dans l'Explorateur de contenu, un administrateur d'Adatum peut voir la liste des éléments qui contiennent des informations sensibles et l'emplacement de chaque élément. En revanche, il ne peut pas ouvrir un élément pour en afficher le contenu.

    À quel groupe de rôles l'administrateur doit-il être ajouté ?
body:
  options:
    - id: a
      text: Content Explorer List viewer
    - id: b
      text: Information Protection Readers
    - id: c
      text: Compliance Manager Assessors
    - id: d
      text: Content Explorer Content viewer
answer: { optionId: d }
explanation:
  correct:
    en: "Access to the items in Content explorer is highly restricted, because it allows reading the contents of scanned files. Two independent role groups control it: Content Explorer List viewer lets a user see each item and its location in the list view, and Content Explorer Content viewer lets a user view the contents of each item. The administrator already sees the list, so the missing membership is Content Explorer Content viewer."
    fr: "L'accès aux éléments dans l'Explorateur de contenu est très restreint, car il permet de lire le contenu des fichiers analysés. Deux groupes de rôles indépendants le contrôlent : Content Explorer List viewer permet de voir chaque élément et son emplacement dans la vue de liste, et Content Explorer Content viewer permet d'afficher le contenu de chaque élément. L'administrateur voit déjà la liste : l'appartenance qui lui manque est donc Content Explorer Content viewer."
  options:
    a:
      en: "Content Explorer List viewer gives the list of items and their location, which the administrator already has; it doesn't allow opening the contents."
      fr: "Content Explorer List viewer donne la liste des éléments et leur emplacement, ce que l'administrateur a déjà ; il ne permet pas d'en ouvrir le contenu."
    b:
      en: "Information Protection Readers gives access to Content explorer itself, but not to the list of items or to their contents."
      fr: "Information Protection Readers donne accès à l'Explorateur de contenu lui-même, mais pas à la liste des éléments ni à leur contenu."
    c:
      en: "Compliance Manager Assessors is a role group of Compliance Manager, used to assess improvement actions; it has no effect in Content explorer."
      fr: "Compliance Manager Assessors est un groupe de rôles du Gestionnaire de conformité, utilisé pour évaluer des actions d'amélioration ; il n'a aucun effet dans l'Explorateur de contenu."
references:
  - title: Get started with content explorer
    url: https://learn.microsoft.com/en-us/purview/data-classification-content-explorer
