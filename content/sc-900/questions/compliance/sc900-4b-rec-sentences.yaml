id: sc900-4b-rec-sentences
objective: "4.3.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Purview Records Management, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur la gestion des enregistrements Microsoft Purview, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Records management builds on the retention capabilities of [[base]].

      An item is declared a record by applying [[label]] to it.
    fr: |
      La gestion des enregistrements s'appuie sur les fonctionnalités de rétention de [[base]].

      Un élément est déclaré comme enregistrement lorsqu'on lui applique [[label]].
  slots:
    - id: base
      options:
        - { id: dlp, text: { en: "Microsoft Purview Data Loss Prevention", fr: "la protection contre la perte de données Microsoft Purview" } }
        - { id: dlm, text: { en: "Microsoft Purview Data Lifecycle Management", fr: "la gestion du cycle de vie des données Microsoft Purview" } }
        - { id: irm, text: { en: "Microsoft Purview Insider Risk Management", fr: "la gestion des risques internes Microsoft Purview" } }
    - id: label
      options:
        - { id: sens, text: { en: "a sensitivity label", fr: "une étiquette de confidentialité" } }
        - { id: policy, text: { en: "a DLP policy", fr: "une stratégie DLP" } }
        - { id: ret, text: { en: "a retention label", fr: "une étiquette de rétention" } }
answer:
  values: { base: dlm, label: ret }
explanation:
  correct:
    en: "Data Lifecycle Management retains the content that an organization needs and deletes the rest; Records Management builds on these retention capabilities and adds more control for items that have legal, regulatory or critical business importance. An administrator configures retention labels that mark items as records; documents and emails become records when such a label is applied to them. Sensitivity labels classify and protect content but never declare records."
    fr: "La gestion du cycle de vie des données conserve le contenu dont une organisation a besoin et supprime le reste ; la gestion des enregistrements s'appuie sur ces fonctionnalités de rétention et ajoute du contrôle pour les éléments qui ont une importance juridique, réglementaire ou critique pour l'activité. Un administrateur configure des étiquettes de rétention qui marquent les éléments comme enregistrements ; les documents et les e-mails deviennent des enregistrements quand une telle étiquette leur est appliquée. Les étiquettes de confidentialité classifient et protègent le contenu, mais ne déclarent jamais d'enregistrements."
references:
  - title: Describe Microsoft Purview Records Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/7-describe-records-management
  - title: Learn about records management
    url: https://learn.microsoft.com/en-us/purview/records-management
