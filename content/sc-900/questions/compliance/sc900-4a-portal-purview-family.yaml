id: sc900-4a-portal-purview-family
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Microsoft solution family helps an organization govern, protect and manage its data, and gives access to data security, data governance, and risk and compliance solutions from a single portal?
  fr: |
    Quelle famille de solutions Microsoft aide une organisation à gouverner, protéger et gérer ses données, et donne accès à des solutions de sécurité des données, de gouvernance des données et de risque et conformité à partir d'un portail unique ?
body:
  options:
    - id: a
      text: Microsoft Defender XDR
    - id: b
      text: Microsoft Entra
    - id: c
      text: Microsoft Sentinel
    - id: d
      text: Microsoft Purview
answer: { optionId: d }
explanation:
  correct:
    en: "Microsoft Purview is the family of solutions that helps an organization govern, protect and manage its data. The Microsoft Purview portal is the unified entry point to its data security, data governance, and risk and compliance solutions."
    fr: "Microsoft Purview est la famille de solutions qui aide une organisation à gouverner, protéger et gérer ses données. Le portail Microsoft Purview est le point d'entrée unifié de ses solutions de sécurité des données, de gouvernance des données et de risque et conformité."
  options:
    a:
      en: "Microsoft Defender XDR detects and responds to threats across endpoints, identities, email and apps; its portal is the Microsoft Defender portal."
      fr: "Microsoft Defender XDR détecte les menaces et y répond sur les points de terminaison, les identités, la messagerie et les applications ; son portail est le portail Microsoft Defender."
    b:
      en: "Microsoft Entra is the family of identity and network access products, managed in the Microsoft Entra admin center."
      fr: "Microsoft Entra est la famille de produits d'identité et d'accès réseau, gérée dans le Centre d'administration Microsoft Entra."
    c:
      en: "Microsoft Sentinel is a SIEM and SOAR solution that collects security data and detects threats; it doesn't govern or classify data."
      fr: "Microsoft Sentinel est une solution SIEM et SOAR qui collecte des données de sécurité et détecte des menaces ; il ne gouverne pas et ne classifie pas les données."
references:
  - title: Learn about the Microsoft Purview portal
    url: https://learn.microsoft.com/en-us/purview/purview-portal
