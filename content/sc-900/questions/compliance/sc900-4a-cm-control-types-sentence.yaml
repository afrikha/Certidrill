id: sc900-4a-cm-control-types-sentence
objective: "4.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences about the types of controls in Compliance Manager, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur les types de contrôles du Gestionnaire de conformité, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A Microsoft managed control is implemented by [[managed]].

      A shared control is implemented by [[shared]].

      The controls that Compliance Manager names "your controls" are also called [[yours]].
    fr: |
      Un contrôle géré par Microsoft est implémenté par [[managed]].

      Un contrôle partagé est implémenté par [[shared]].

      Les contrôles que le Gestionnaire de conformité nomme « vos contrôles » sont aussi appelés [[yours]].
  slots:
    - id: managed
      options:
        - { id: org, text: { en: "your organization only", fr: "votre organisation seulement" } }
        - { id: ms, text: { en: "Microsoft only", fr: "Microsoft seulement" } }
        - { id: both, text: { en: "both your organization and Microsoft", fr: "votre organisation et Microsoft" } }
    - id: shared
      options:
        - { id: org, text: { en: "your organization only", fr: "votre organisation seulement" } }
        - { id: ms, text: { en: "Microsoft only", fr: "Microsoft seulement" } }
        - { id: both, text: { en: "both your organization and Microsoft", fr: "votre organisation et Microsoft" } }
    - id: yours
      options:
        - { id: actions, text: { en: "improvement actions", fr: "actions d'amélioration" } }
        - { id: customer, text: { en: "customer managed controls", fr: "contrôles gérés par le client" } }
        - { id: assess, text: { en: "assessments", fr: "évaluations" } }
answer:
  values: { managed: ms, shared: both, yours: customer }
explanation:
  correct:
    en: "Compliance Manager tracks three types of controls, which reflect the shared responsibility model. Microsoft managed controls are controls for Microsoft cloud services, which Microsoft implements. Your controls, also called customer managed controls, are implemented and managed by your organization. For shared controls, your organization and Microsoft share the responsibility of implementation."
    fr: "Le Gestionnaire de conformité suit trois types de contrôles, qui reflètent le modèle de responsabilité partagée. Les contrôles gérés par Microsoft sont des contrôles des services cloud Microsoft, que Microsoft implémente. Vos contrôles, aussi appelés contrôles gérés par le client, sont implémentés et gérés par votre organisation. Pour les contrôles partagés, votre organisation et Microsoft se partagent la responsabilité de l'implémentation."
  options:
    actions:
      en: "An improvement action is recommended guidance that helps meet a control; it isn't a type of control."
      fr: "Une action d'amélioration est une recommandation qui aide à satisfaire un contrôle ; ce n'est pas un type de contrôle."
    assess:
      en: "An assessment is a grouping of controls from a specific regulation, standard or policy."
      fr: "Une évaluation est un regroupement de contrôles issus d'une réglementation, d'une norme ou d'une stratégie précise."
references:
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
