id: sc900-4a-priv-data-owner
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores its documents and emails in Microsoft 365, which it bought through a reseller.

    According to the privacy principles of Microsoft, who owns this data?
  fr: |
    Contoso stocke ses documents et ses e-mails dans Microsoft 365, acheté par l'intermédiaire d'un revendeur.

    Selon les principes de confidentialité de Microsoft, à qui ces données appartiennent-elles ?
body:
  options:
    - id: a
      text: { en: "Microsoft", fr: "À Microsoft" }
    - id: b
      text: { en: "Contoso and Microsoft jointly", fr: "À Contoso et à Microsoft conjointement" }
    - id: c
      text: { en: "The reseller", fr: "Au revendeur" }
    - id: d
      text: { en: "Contoso", fr: "À Contoso" }
answer: { optionId: d }
explanation:
  correct:
    en: "The first privacy principle is that you control your data: the data that a customer puts in the Microsoft cloud belongs to the customer, who can access, modify or delete it at any time. Microsoft uses it only to provide the services that the customer has chosen."
    fr: "Le premier principe de confidentialité est que vous contrôlez vos données : les données qu'un client place dans le cloud Microsoft appartiennent au client, qui peut y accéder, les modifier ou les supprimer à tout moment. Microsoft ne les utilise que pour fournir les services que le client a choisis."
  options:
    a:
      en: "Microsoft processes the data to deliver the service, but it doesn't become its owner."
      fr: "Microsoft traite les données pour fournir le service, mais n'en devient pas propriétaire."
    b:
      en: "Ownership isn't shared: the shared responsibility model divides security tasks, not the ownership of customer data."
      fr: "La propriété n'est pas partagée : le modèle de responsabilité partagée répartit des tâches de sécurité, pas la propriété des données du client."
    c:
      en: "The way the subscription was purchased has no effect on who owns the data stored in the service."
      fr: "Le mode d'achat de l'abonnement n'a aucun effet sur la propriété des données stockées dans le service."
references:
  - title: Describe Microsoft's privacy principles
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles
