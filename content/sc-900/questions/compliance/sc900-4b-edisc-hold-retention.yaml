id: sc900-4b-edisc-hold-retention
objective: "4.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    At Woodgrove Bank, a retention policy deletes the emails of all the mailboxes two years after they are received. For a legal case, an eDiscovery hold is placed on the mailbox of a manager.

    What happens to the emails of this mailbox that become older than two years while the hold is in place?
  fr: |
    Chez Woodgrove Bank, une stratégie de rétention supprime les e-mails de toutes les boîtes aux lettres deux ans après leur réception. Pour une affaire juridique, une mise en attente eDiscovery est placée sur la boîte aux lettres d'un responsable.

    Que deviennent les e-mails de cette boîte aux lettres qui dépassent l'âge de deux ans pendant que la mise en attente est en place ?
body:
  options:
    - id: a
      text:
        en: "They are permanently deleted, because the retention policy was created before the hold."
        fr: "Ils sont supprimés définitivement, car la stratégie de rétention a été créée avant la mise en attente."
    - id: b
      text:
        en: "They are copied to a review set, and then they are permanently deleted from the mailbox."
        fr: "Ils sont copiés dans un ensemble de révision, puis ils sont supprimés définitivement de la boîte aux lettres."
    - id: c
      text:
        en: "They are preserved, and they aren't permanently deleted as long as the hold is in place."
        fr: "Ils sont préservés, et ils ne sont pas supprimés définitivement tant que la mise en attente est en place."
    - id: d
      text:
        en: "They are exported automatically, and then they are permanently deleted from the mailbox."
        fr: "Ils sont exportés automatiquement, puis ils sont supprimés définitivement de la boîte aux lettres."
answer: { optionId: c }
explanation:
  correct:
    en: "A hold preserves the content of a location from inadvertent or intentional deletion during an investigation. When a delete action and a preservation apply to the same content, retention wins over deletion, and an eDiscovery hold counts as a retention: the emails are not permanently deleted until the hold is released."
    fr: "Une mise en attente préserve le contenu d'un emplacement contre une suppression involontaire ou volontaire pendant une investigation. Quand une action de suppression et une préservation s'appliquent au même contenu, la rétention l'emporte sur la suppression, et une mise en attente eDiscovery compte comme une rétention : les e-mails ne sont pas supprimés définitivement tant que la mise en attente n'est pas levée."
  options:
    a:
      en: "The order in which the policy and the hold were created doesn't matter: preservation takes precedence over deletion."
      fr: "L'ordre de création de la stratégie et de la mise en attente ne compte pas : la préservation prime sur la suppression."
    b:
      en: "A hold preserves content in place; it doesn't copy it to a review set, which reviewers fill from search results."
      fr: "Une mise en attente préserve le contenu sur place ; elle ne le copie pas dans un ensemble de révision, que les réviseurs alimentent à partir de résultats de recherche."
    d:
      en: "An export is started by a person from search results or a review set; a hold doesn't export anything."
      fr: "Une exportation est lancée par une personne à partir de résultats de recherche ou d'un ensemble de révision ; une mise en attente n'exporte rien."
references:
  - title: Learn about retention policies and retention labels
    url: https://learn.microsoft.com/en-us/purview/retention
  - title: Create holds in eDiscovery
    url: https://learn.microsoft.com/en-us/purview/edisc-hold-create
