id: sc900-4b-ret-deleted-copy
objective: "4.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso applies a retention policy that retains all the documents of a SharePoint site for five years. One year after creating a document on the site, a user deletes it.

    What happens to the document?
  fr: |
    Contoso applique une stratégie de rétention qui conserve pendant cinq ans tous les documents d'un site SharePoint. Un an après avoir créé un document sur le site, un utilisateur le supprime.

    Que devient le document ?
body:
  options:
    - id: a
      text:
        en: "The deletion is refused, and the document stays in the library where the user stored it."
        fr: "La suppression est refusée, et le document reste dans la bibliothèque où l'utilisateur l'avait stocké."
    - id: b
      text:
        en: "The document leaves the library, and it is permanently deleted because the user is its author."
        fr: "Le document quitte la bibliothèque, et il est supprimé définitivement parce que l'utilisateur en est l'auteur."
    - id: c
      text:
        en: "The document leaves the library, and it is moved to the OneDrive account of the user."
        fr: "Le document quitte la bibliothèque, et il est déplacé vers le compte OneDrive de l'utilisateur."
    - id: d
      text:
        en: "The document leaves the library, and a copy is kept in a secure location of the site."
        fr: "Le document quitte la bibliothèque, et une copie est gardée dans un emplacement sécurisé du site."
answer: { optionId: d }
explanation:
  correct:
    en: "Content that is subject to retention stays in its original location and users keep working with it as usual, including deleting it. When retained content is edited or deleted, a copy is automatically kept in a secure location that isn't visible to most people, until the retention period ends."
    fr: "Le contenu soumis à la rétention reste à son emplacement d'origine et les utilisateurs continuent à travailler avec lui comme d'habitude, y compris en le supprimant. Quand du contenu conservé est modifié ou supprimé, une copie est automatiquement gardée dans un emplacement sécurisé, invisible pour la plupart des personnes, jusqu'à la fin de la période de rétention."
  options:
    a:
      en: "A retention policy doesn't block users from deleting content; blocking deletion is a restriction of items that are declared records."
      fr: "Une stratégie de rétention n'empêche pas les utilisateurs de supprimer du contenu ; bloquer la suppression est une restriction des éléments déclarés comme enregistrements."
    b:
      en: "Retaining content prevents its permanent deletion, whoever deletes it."
      fr: "Conserver du contenu empêche sa suppression définitive, quelle que soit la personne qui le supprime."
    c:
      en: "The copy isn't given back to the user: it goes to a secure location of the site, which most users can't see."
      fr: "La copie n'est pas rendue à l'utilisateur : elle va dans un emplacement sécurisé du site, que la plupart des utilisateurs ne voient pas."
references:
  - title: Describe Data Lifecycle Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/6-describe-data-lifecycle-management
  - title: Learn about retention policies and retention labels
    url: https://learn.microsoft.com/en-us/purview/retention
