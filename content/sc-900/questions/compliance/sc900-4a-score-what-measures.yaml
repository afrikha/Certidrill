id: sc900-4a-score-what-measures
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What does the compliance score of Compliance Manager measure?
  fr: |
    Que mesure le score de conformité du Gestionnaire de conformité ?
body:
  options:
    - id: a
      text: { en: "The security posture of the organization, as shown in the Microsoft Defender portal", fr: "La posture de sécurité de l'organisation, telle que la montre le portail Microsoft Defender" }
    - id: b
      text: { en: "The number of DLP policy matches that were detected during the last 30 days", fr: "Le nombre de correspondances avec des stratégies DLP détectées au cours des 30 derniers jours" }
    - id: c
      text: { en: "The progress of the organization in completing recommended improvement actions", fr: "L'avancement de l'organisation dans la réalisation des actions d'amélioration recommandées" }
    - id: d
      text: { en: "The percentage of users who signed in by using multifactor authentication", fr: "Le pourcentage d'utilisateurs qui se sont connectés avec l'authentification multifacteur" }
answer: { optionId: c }
explanation:
  correct:
    en: "The compliance score measures the progress of an organization in completing the improvement actions that Compliance Manager recommends to meet regulations, standards and policies. Points are awarded for each completed action and combined into an overall score."
    fr: "Le score de conformité mesure l'avancement d'une organisation dans la réalisation des actions d'amélioration que le Gestionnaire de conformité recommande pour respecter des réglementations, des normes et des stratégies. Des points sont attribués pour chaque action réalisée et combinés en un score global."
  options:
    a:
      en: "The security posture is measured by Microsoft Secure Score, in the Microsoft Defender portal."
      fr: "La posture de sécurité est mesurée par le Degré de sécurisation Microsoft (Microsoft Secure Score), dans le portail Microsoft Defender."
    b:
      en: "DLP policy matches are events shown in the DLP reports and in Activity explorer; they aren't what the score counts."
      fr: "Les correspondances avec des stratégies DLP sont des événements montrés dans les rapports DLP et dans l'Explorateur d'activités ; ce n'est pas ce que le score compte."
    d:
      en: "The use of multifactor authentication is reported by Microsoft Entra ID; the compliance score is built from improvement actions."
      fr: "L'utilisation de l'authentification multifacteur est rapportée par Microsoft Entra ID ; le score de conformité se construit à partir d'actions d'amélioration."
references:
  - title: Compliance Manager scoring
    url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
