id: sc900-4a-class-classifiers-match
objective: "4.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each need to the type of classifier of Microsoft Purview that meets it.

    To answer, drag the appropriate classifier to each need. Each classifier may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque besoin au type de classifieur de Microsoft Purview qui y répond.

    Pour répondre, faites glisser le classifieur approprié vers chaque besoin. Chaque classifieur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: builtin, text: { en: "Built-in sensitive information type", fr: "Type d'informations sensibles intégré" } }
    - { id: custom, text: { en: "Custom sensitive information type", fr: "Type d'informations sensibles personnalisé" } }
    - { id: named, text: { en: "Named entity sensitive information type", fr: "Type d'informations sensibles d'entité nommée" } }
    - { id: pre, text: { en: "Pre-trained classifier", fr: "Classifieur préentraîné" } }
    - { id: trained, text: { en: "Custom trainable classifier", fr: "Classifieur entraînable personnalisé" } }
  targets:
    - id: t1
      text: { en: "Detect the project codes of the organization by using a regular expression that an administrator defines", fr: "Détecter les codes de projet de l'organisation au moyen d'une expression régulière définie par un administrateur" }
    - id: t2
      text: { en: "Detect resumes by using machine learning, without providing any sample", fr: "Détecter des CV grâce au machine learning, sans fournir aucun échantillon" }
    - id: t3
      text: { en: "Detect the names of persons and physical addresses", fr: "Détecter des noms de personnes et des adresses postales" }
    - id: t4
      text: { en: "Detect bank account numbers by using a pattern that Microsoft created and maintains", fr: "Détecter des numéros de compte bancaire au moyen d'un modèle créé et maintenu par Microsoft" }
answer:
  mapping: { t1: custom, t2: pre, t3: named, t4: builtin }
explanation:
  correct:
    en: "A custom sensitive information type is defined by the organization with regular expressions, keywords and keyword dictionaries, for data such as employee IDs or project codes. Pre-trained classifiers are trained by Microsoft and ready to use for categories such as resumes, financial documents or harassment. Named entity sensitive information types detect person names, physical addresses and medical terms. Built-in sensitive information types are created and maintained by Microsoft for common data such as bank account or credit card numbers."
    fr: "Un type d'informations sensibles personnalisé est défini par l'organisation avec des expressions régulières, des mots clés et des dictionnaires de mots clés, pour des données comme des identifiants d'employé ou des codes de projet. Les classifieurs préentraînés sont entraînés par Microsoft et prêts à l'emploi pour des catégories comme les CV, les documents financiers ou le harcèlement. Les types d'informations sensibles d'entité nommée détectent des noms de personnes, des adresses postales et des termes médicaux. Les types d'informations sensibles intégrés sont créés et maintenus par Microsoft pour des données courantes comme les numéros de compte bancaire ou de carte de crédit."
  options:
    trained:
      en: "A custom trainable classifier requires the organization to provide samples of the content to recognize."
      fr: "Un classifieur entraînable personnalisé exige que l'organisation fournisse des échantillons du contenu à reconnaître."
references:
  - title: Describe the data classification capabilities of Microsoft Purview Information Protection
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/2-identify-sensitive-data
  - title: Learn about sensitive information types
    url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-learn-about
