id: sc900-4a-priv-subcontractors
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Microsoft engages a subcontractor that needs access to customer data to deliver part of a cloud service.

    According to the privacy principles of Microsoft, which statement about the subcontractor is true?
  fr: |
    Microsoft fait appel à un sous-traitant qui a besoin d'accéder aux données des clients pour fournir une partie d'un service cloud.

    Selon les principes de confidentialité de Microsoft, quelle affirmation sur ce sous-traitant est vraie ?
body:
  options:
    - id: a
      text: { en: "It can use the data for its own marketing research.", fr: "Il peut utiliser les données pour ses propres études de marché." }
    - id: b
      text: { en: "It can perform only the functions that it was engaged to provide.", fr: "Il ne peut exécuter que les fonctions pour lesquelles il a été engagé." }
    - id: c
      text: { en: "It becomes the owner of the data that it processes.", fr: "Il devient propriétaire des données qu'il traite." }
    - id: d
      text: { en: "It is exempt from the privacy commitments made by Microsoft.", fr: "Il est dispensé des engagements de confidentialité pris par Microsoft." }
answer: { optionId: b }
explanation:
  correct:
    en: "Under the principle that you control your data, subcontractors and subprocessors that need access to customer data can perform only the functions they were engaged to provide. They are bound by the same contractual privacy commitments that Microsoft makes to its customers."
    fr: "Selon le principe « Vous contrôlez vos données », les sous-traitants qui ont besoin d'accéder aux données des clients ne peuvent exécuter que les fonctions pour lesquelles ils ont été engagés. Ils sont liés par les mêmes engagements contractuels de confidentialité que ceux que Microsoft prend envers ses clients."
  options:
    a:
      en: "Customer data isn't mined for marketing research or advertising, neither by Microsoft nor by its subcontractors."
      fr: "Les données des clients ne sont pas exploitées à des fins d'études de marché ou de publicité, ni par Microsoft ni par ses sous-traitants."
    c:
      en: "The data keeps belonging to the customer, whoever processes it."
      fr: "Les données continuent d'appartenir au client, quel que soit celui qui les traite."
    d:
      en: "Subcontractors are bound by the same contractual privacy commitments as Microsoft."
      fr: "Les sous-traitants sont liés par les mêmes engagements contractuels de confidentialité que Microsoft."
references:
  - title: Describe Microsoft's privacy principles
    url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles
