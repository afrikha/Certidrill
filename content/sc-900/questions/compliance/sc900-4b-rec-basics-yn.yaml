id: sc900-4b-rec-basics-yn
objective: "4.3.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Purview Records Management, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la gestion des enregistrements Microsoft Purview, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When an item is declared a record, restrictions block certain actions on it, such as deleting it."
        fr: "Quand un élément est déclaré comme enregistrement, des restrictions bloquent certaines actions sur cet élément, comme sa suppression."
    - id: s2
      text:
        en: "The activities that are performed on an item declared as a record are logged."
        fr: "Les activités effectuées sur un élément déclaré comme enregistrement sont journalisées."
    - id: s3
      text:
        en: "The main purpose of records management is to stop users from sharing sensitive files with people outside the organization."
        fr: "Le but principal de la gestion des enregistrements est d'empêcher les utilisateurs de partager des fichiers sensibles avec des personnes extérieures à l'organisation."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Records management helps an organization manage its regulatory, legal and business-critical records. Declaring an item a record puts restrictions in place that block certain activities, logs the activities about the item, and keeps proof of disposition at the end of the retention period. Stopping the inappropriate sharing of sensitive files is the purpose of data loss prevention."
    fr: "La gestion des enregistrements aide une organisation à gérer ses enregistrements réglementaires, juridiques et critiques pour l'activité. Déclarer un élément comme enregistrement met en place des restrictions qui bloquent certaines activités, journalise les activités sur l'élément et conserve une preuve de destruction à la fin de la période de rétention. Empêcher le partage inapproprié de fichiers sensibles est le but de la protection contre la perte de données."
references:
  - title: Describe Microsoft Purview Records Management
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/7-describe-records-management
  - title: Learn about records management
    url: https://learn.microsoft.com/en-us/purview/records-management
