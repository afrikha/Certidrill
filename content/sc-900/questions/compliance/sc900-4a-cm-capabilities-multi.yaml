id: sc900-4a-cm-capabilities-multi
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two capabilities does Compliance Manager provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux fonctionnalités que le Gestionnaire de conformité fournit ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A risk-based score that measures the progress in completing improvement actions", fr: "Un score fondé sur les risques qui mesure l'avancement dans la réalisation des actions d'amélioration" }
    - id: b
      text: { en: "Audit reports on Microsoft cloud services that external auditors produced", fr: "Des rapports d'audit sur les services cloud Microsoft produits par des auditeurs externes" }
    - id: c
      text: { en: "Automatic blocking of the emails that contain sensitive information", fr: "Le blocage automatique des e-mails qui contiennent des informations sensibles" }
    - id: d
      text: { en: "A mapping of regulatory controls to recommended improvement actions", fr: "Une mise en correspondance des contrôles réglementaires avec des actions d'amélioration recommandées" }
    - id: e
      text: { en: "Detection of the risky sign-ins of the users of the organization", fr: "La détection des connexions à risque des utilisateurs de l'organisation" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Compliance Manager translates regulations and standards into controls, maps these controls to recommended improvement actions with step-by-step guidance, and calculates a risk-based compliance score that measures the progress in completing the actions."
    fr: "Le Gestionnaire de conformité traduit les réglementations et les normes en contrôles, met ces contrôles en correspondance avec des actions d'amélioration recommandées, accompagnées de conseils pas à pas, et calcule un score de conformité fondé sur les risques, qui mesure l'avancement dans la réalisation des actions."
  options:
    b:
      en: "The audit reports of external auditors on Microsoft cloud services are published in the Service Trust Portal."
      fr: "Les rapports d'audit d'auditeurs externes sur les services cloud Microsoft sont publiés dans le Portail d'approbation des services."
    c:
      en: "Blocking the sharing of sensitive information is the role of data loss prevention (DLP) policies."
      fr: "Bloquer le partage d'informations sensibles est le rôle des stratégies de protection contre la perte de données (DLP)."
    e:
      en: "Risky sign-ins are detected by Microsoft Entra ID Protection."
      fr: "Les connexions à risque sont détectées par Protection Microsoft Entra ID."
references:
  - title: Describe Compliance Manager
    url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
  - title: Microsoft Purview Compliance Manager
    url: https://learn.microsoft.com/en-us/purview/compliance-manager
