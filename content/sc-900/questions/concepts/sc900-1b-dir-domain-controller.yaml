id: sc900-1b-dir-domain-controller
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is a server that runs Active Directory Domain Services (AD DS) called?
  fr: |
    Comment appelle-t-on un serveur qui exécute Active Directory Domain Services (AD DS) ?
body:
  options:
    - id: a
      text: { en: "A member server", fr: "Un serveur membre" }
    - id: b
      text: { en: "A DNS server", fr: "Un serveur DNS" }
    - id: c
      text: { en: "A federation server", fr: "Un serveur de fédération" }
    - id: d
      text: { en: "A domain controller", fr: "Un contrôleur de domaine" }
answer: { optionId: d }
explanation:
  correct:
    en: "A server that runs AD DS is a domain controller. It stores information about the members of the domain, such as users, devices and groups, verifies their credentials at sign-in and defines their access rights to network resources."
    fr: "Un serveur qui exécute AD DS est un contrôleur de domaine. Il stocke les informations sur les membres du domaine, comme les utilisateurs, les appareils et les groupes, vérifie leurs informations d'identification à la connexion et définit leurs droits d'accès aux ressources du réseau."
  options:
    a:
      en: "A member server is joined to the domain but doesn't run AD DS: it relies on the domain controllers to authenticate users."
      fr: "Un serveur membre est joint au domaine, mais n'exécute pas AD DS : il s'appuie sur les contrôleurs de domaine pour authentifier les utilisateurs."
    b:
      en: "A DNS server resolves names to IP addresses; that role doesn't make it a directory server."
      fr: "Un serveur DNS résout des noms en adresses IP ; ce rôle n'en fait pas un serveur d'annuaire."
    c:
      en: "A federation server runs Active Directory Federation Services (AD FS) and issues tokens to external services; the directory itself is held by AD DS."
      fr: "Un serveur de fédération exécute Active Directory Federation Services (AD FS) et émet des jetons pour des services externes ; l'annuaire lui-même est tenu par AD DS."
references:
  - title: Describe the concept of directory services and Active Directory
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/5-describe-concept-of-directory-services-active-directory
  - title: Active Directory Domain Services overview
    url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/virtual-dc/active-directory-domain-services-overview
