id: sc900-1b-idp-role
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An organization uses modern authentication.

    When a user signs in to an application, which component verifies the user's credentials and issues a security token?
  fr: |
    Une organisation utilise l'authentification moderne.

    Quand un utilisateur se connecte à une application, quel composant vérifie ses informations d'identification et émet un jeton de sécurité ?
body:
  options:
    - id: a
      text: { en: "The identity provider", fr: "Le fournisseur d'identité" }
    - id: b
      text: { en: "The application that the user opens", fr: "L'application que l'utilisateur ouvre" }
    - id: c
      text: { en: "The web API that the application calls", fr: "L'API web que l'application appelle" }
    - id: d
      text: { en: "The user's device", fr: "L'appareil de l'utilisateur" }
answer: { optionId: a }
explanation:
  correct:
    en: "With modern authentication, applications delegate authentication to a central identity provider. The application directs the user to the identity provider, which verifies the credentials and issues a security token. The application trusts the identity provider and accepts the token as proof of the sign-in."
    fr: "Avec l'authentification moderne, les applications délèguent l'authentification à un fournisseur d'identité central. L'application dirige l'utilisateur vers le fournisseur d'identité, qui vérifie les informations d'identification et émet un jeton de sécurité. L'application approuve le fournisseur d'identité et accepte le jeton comme preuve de la connexion."
  options:
    b:
      en: "The application no longer checks credentials itself: it redirects the user and only validates the token that it receives."
      fr: "L'application ne vérifie plus elle-même les informations d'identification : elle redirige l'utilisateur et se contente de valider le jeton qu'elle reçoit."
    c:
      en: "A web API is a protected resource: it validates the tokens presented to it but doesn't issue them."
      fr: "Une API web est une ressource protégée : elle valide les jetons qu'on lui présente, mais ne les émet pas."
    d:
      en: "The device presents the token to the application; it isn't the trusted party that verifies credentials for the organization."
      fr: "L'appareil présente le jeton à l'application ; il n'est pas la partie approuvée qui vérifie les informations d'identification pour l'organisation."
references:
  - title: Describe the role of the identity provider
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/4-describe-role-identity-provider
