id: sc900-1a-grc-sovereignty
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders collects customer data in one country, stores it in a second country and processes it in a third. Its legal team explains that the data is therefore subject to the laws of all three countries.

    Which concept is the legal team describing?
  fr: |
    Northwind Traders collecte des données de clients dans un pays, les stocke dans un deuxième et les traite dans un troisième. Son équipe juridique explique que ces données sont donc soumises aux lois des trois pays.

    Quel concept l'équipe juridique décrit-elle ?
body:
  options:
    - id: a
      text: { en: "Data privacy", fr: "La confidentialité des données" }
    - id: b
      text: { en: "Data residency", fr: "La résidence des données" }
    - id: c
      text: { en: "Governance", fr: "La gouvernance" }
    - id: d
      text: { en: "Data sovereignty", fr: "La souveraineté des données" }
answer: { optionId: d }
explanation:
  correct:
    en: "Data sovereignty is the concept that data falls under the laws and regulations of the country or region in which it is physically collected, held or processed. Data that crosses several jurisdictions can therefore be subject to the laws of each of them."
    fr: "La souveraineté des données est le concept selon lequel les données relèvent des lois et des réglementations du pays ou de la région où elles sont physiquement collectées, conservées ou traitées. Des données qui traversent plusieurs juridictions peuvent donc être soumises aux lois de chacune d'elles."
  options:
    a:
      en: "Data privacy concerns the appropriate handling of personal data: transparency, consent and the rights of individuals, not the question of which country's laws apply."
      fr: "La confidentialité des données concerne le traitement approprié des données personnelles : transparence, consentement et droits des personnes, et non la question de savoir quelles lois nationales s'appliquent."
    b:
      en: "Data residency concerns the rules on the physical locations where data may be stored and on its international transfers, not the fact that local laws apply to it."
      fr: "La résidence des données concerne les règles sur les emplacements physiques où les données peuvent être stockées et sur leurs transferts internationaux, et non le fait que les lois locales s'y appliquent."
    c:
      en: "Governance is the organization's own system of rules, practices and processes, not a legal principle attached to the location of data."
      fr: "La gouvernance est le système de règles, de pratiques et de processus propre à l'organisation, et non un principe juridique lié à l'emplacement des données."
references:
  - title: Describe governance, risk, and compliance (GRC) concepts
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/6-describe-compliance-concepts
