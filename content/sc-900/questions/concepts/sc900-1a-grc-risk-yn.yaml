id: sc900-1a-grc-risk-yn
objective: "1.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about risk management, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la gestion des risques, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The goal of risk management is to eliminate every risk that the organization faces."
        fr: "L'objectif de la gestion des risques est d'éliminer tous les risques auxquels l'organisation est exposée."
    - id: s2
      text:
        en: "A natural disaster that destroys a datacenter is an example of an external risk."
        fr: "Une catastrophe naturelle qui détruit un centre de données est un exemple de risque externe."
    - id: s3
      text:
        en: "An employee who accidentally exposes confidential data is an example of an internal risk."
        fr: "Un employé qui expose accidentellement des données confidentielles est un exemple de risque interne."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Every organization faces risk; risk management doesn't aim to remove it all but to understand each threat well enough to decide how to respond. External risks come from outside, such as cyberattacks, natural disasters or supplier failures. Internal risks come from within, such as accidental data exposure by employees, insider threats or fraud."
    fr: "Toute organisation est exposée à des risques ; la gestion des risques ne vise pas à les supprimer tous, mais à comprendre chaque menace suffisamment pour décider comment y répondre. Les risques externes viennent de l'extérieur : cyberattaques, catastrophes naturelles ou défaillances de fournisseurs. Les risques internes viennent de l'intérieur : exposition accidentelle de données par des employés, menaces internes ou fraude."
references:
  - title: Describe governance, risk, and compliance (GRC) concepts
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/6-describe-compliance-concepts
