id: sc900-1a-zt-model-yn
objective: "1.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the Zero Trust model, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le modèle Confiance Zéro (Zero Trust), sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Zero Trust is a security strategy, not a single product that an organization deploys."
        fr: "La Confiance Zéro est une stratégie de sécurité, et non un produit unique qu'une organisation déploie."
    - id: s2
      text:
        en: "In the Zero Trust model, a request that comes from inside the corporate network is trusted by default."
        fr: "Dans le modèle Confiance Zéro, une demande provenant de l'intérieur du réseau de l'entreprise est approuvée par défaut."
    - id: s3
      text:
        en: "The Zero Trust model covers user identities only; devices and applications are outside its scope."
        fr: "Le modèle Confiance Zéro couvre uniquement les identités des utilisateurs ; les appareils et les applications sont hors de son champ."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Zero Trust is a strategy, not a product or a single technology. It treats every access request as untrusted wherever it originates, so being on the corporate network grants nothing by itself. The model spans identities, devices, applications, data, infrastructure and networks, tied together by visibility, automation and orchestration."
    fr: "La Confiance Zéro est une stratégie, pas un produit ni une technologie unique. Elle traite chaque demande d'accès comme non approuvée, d'où qu'elle vienne : se trouver sur le réseau de l'entreprise ne donne donc aucun droit en soi. Le modèle couvre les identités, les appareils, les applications, les données, l'infrastructure et les réseaux, reliés par la visibilité, l'automatisation et l'orchestration."
references:
  - title: Describe the Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/4-describe-zero-trust-model
  - title: Zero Trust as a security foundation
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
