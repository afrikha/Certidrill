id: sc900-1b-idp-tokens-sentence
objective: "1.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      After a user signs in, the identity provider issues [[proof]], which tells the application who the user is.

      To read the user's calendar through an API, the application presents [[permission]].

      Inside a token, each piece of information about the identity, such as the display name, is [[piece]].
    fr: |
      Une fois l'utilisateur connecté, le fournisseur d'identité émet [[proof]], qui indique à l'application qui est l'utilisateur.

      Pour lire le calendrier de l'utilisateur au moyen d'une API, l'application présente [[permission]].

      Dans un jeton, chaque information sur l'identité, par exemple le nom d'affichage, est [[piece]].
  slots:
    - id: proof
      options:
        - { id: access, text: { en: "an access token", fr: "un jeton d'accès" } }
        - { id: idt, text: { en: "an ID token", fr: "un jeton d'ID" } }
        - { id: refresh, text: { en: "a refresh token", fr: "un jeton d'actualisation" } }
    - id: permission
      options:
        - { id: access, text: { en: "an access token", fr: "un jeton d'accès" } }
        - { id: idt, text: { en: "an ID token", fr: "un jeton d'ID" } }
        - { id: refresh, text: { en: "a refresh token", fr: "un jeton d'actualisation" } }
    - id: piece
      options:
        - { id: factor, text: { en: "an authentication factor", fr: "un facteur d'authentification" } }
        - { id: cred, text: { en: "a credential", fr: "une information d'identification" } }
        - { id: claim, text: { en: "a claim", fr: "une revendication" } }
answer:
  values: { proof: idt, permission: access, piece: claim }
explanation:
  correct:
    en: "An ID token is the proof that the user signed in: the application uses it to know who the user is (authentication). An access token gives the application permission to access a specific resource on the user's behalf, such as calendar data behind an API (authorization). Tokens carry their information as claims: identifier, display name, roles, issue and expiration times."
    fr: "Un jeton d'ID est la preuve que l'utilisateur s'est connecté : l'application s'en sert pour savoir qui est l'utilisateur (authentification). Un jeton d'accès donne à l'application la permission d'accéder à une ressource précise pour le compte de l'utilisateur, par exemple des données de calendrier derrière une API (autorisation). Les jetons portent leurs informations sous forme de revendications : identifiant, nom d'affichage, rôles, heures d'émission et d'expiration."
  options:
    refresh:
      en: "A refresh token is exchanged for a new access token when the current one is about to expire; it neither identifies the user to the application nor is presented to the API."
      fr: "Un jeton d'actualisation s'échange contre un nouveau jeton d'accès quand le jeton en cours est sur le point d'expirer ; il n'identifie pas l'utilisateur auprès de l'application et n'est pas présenté à l'API."
    cred:
      en: "A credential is the evidence that the user gives to the identity provider, such as a password; the token is what the provider issues after verifying it."
      fr: "Une information d'identification est la preuve que l'utilisateur fournit au fournisseur d'identité, par exemple un mot de passe ; le jeton est ce que le fournisseur émet après l'avoir vérifiée."
    factor:
      en: "An authentication factor is a category of proof (know, have, are), not a piece of data carried by a token."
      fr: "Un facteur d'authentification est une catégorie de preuve (savoir, posséder, être), pas une donnée portée par un jeton."
references:
  - title: Describe the role of the identity provider
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/4-describe-role-identity-provider
  - title: Tokens and claims overview
    url: https://learn.microsoft.com/en-us/entra/identity-platform/security-tokens
