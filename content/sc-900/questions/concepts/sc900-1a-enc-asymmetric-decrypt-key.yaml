id: sc900-1a-enc-asymmetric-decrypt-key
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum wants its suppliers to send it confidential documents by using asymmetric encryption. A supplier encrypts a document with Adatum's public key.

    Which key is needed to decrypt the document?
  fr: |
    Adatum souhaite que ses fournisseurs lui envoient des documents confidentiels en utilisant le chiffrement asymétrique. Un fournisseur chiffre un document avec la clé publique d'Adatum.

    Quelle clé est nécessaire pour déchiffrer le document ?
body:
  options:
    - id: a
      text: { en: "Adatum's public key", fr: "La clé publique d'Adatum" }
    - id: b
      text: { en: "Adatum's private key", fr: "La clé privée d'Adatum" }
    - id: c
      text: { en: "The supplier's public key", fr: "La clé publique du fournisseur" }
    - id: d
      text: { en: "The supplier's private key", fr: "La clé privée du fournisseur" }
answer: { optionId: b }
explanation:
  correct:
    en: "In asymmetric encryption the two keys of a pair work together: data encrypted with a public key can be decrypted only with the private key of the same pair. Adatum can publish its public key freely, and only Adatum, which holds the private key, can read what was encrypted with it."
    fr: "Dans le chiffrement asymétrique, les deux clés d'une paire fonctionnent ensemble : des données chiffrées avec une clé publique ne peuvent être déchiffrées qu'avec la clé privée de la même paire. Adatum peut diffuser librement sa clé publique, et seule Adatum, qui détient la clé privée, peut lire ce qui a été chiffré avec elle."
  options:
    a:
      en: "The public key encrypted the document; it can't decrypt it, otherwise anyone who has it could read the document."
      fr: "La clé publique a chiffré le document ; elle ne peut pas le déchiffrer, sinon quiconque la possède pourrait lire le document."
    c:
      en: "The supplier's keys form another pair, unrelated to the key that encrypted the document."
      fr: "Les clés du fournisseur forment une autre paire, sans lien avec la clé qui a chiffré le document."
    d:
      en: "The supplier's private key belongs to another pair; it would serve to sign the document, not to decrypt it."
      fr: "La clé privée du fournisseur appartient à une autre paire ; elle servirait à signer le document, pas à le déchiffrer."
references:
  - title: Describe encryption and hashing
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/5-describe-encryption-hashing
