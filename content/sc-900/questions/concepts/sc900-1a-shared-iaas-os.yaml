id: sc900-1a-shared-iaas-os
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a line-of-business application on Azure virtual machines (IaaS).

    According to the shared responsibility model, which task is Contoso responsible for?
  fr: |
    Contoso exécute une application métier sur des machines virtuelles Azure (IaaS).

    Selon le modèle de responsabilité partagée, de quelle tâche Contoso est-elle responsable ?
body:
  options:
    - id: a
      text: { en: "Securing the physical hosts that run the virtual machines", fr: "Sécuriser les hôtes physiques qui exécutent les machines virtuelles" }
    - id: b
      text: { en: "Maintaining the physical network of the datacenter", fr: "Assurer la maintenance du réseau physique du centre de données" }
    - id: c
      text: { en: "Patching the operating system of the virtual machines", fr: "Appliquer les correctifs au système d'exploitation des machines virtuelles" }
    - id: d
      text: { en: "Controlling physical access to the datacenter", fr: "Contrôler l'accès physique au centre de données" }
answer: { optionId: c }
explanation:
  correct:
    en: "With IaaS, the cloud provider secures the physical datacenter, the network hardware and the host machines. Everything the customer installs and configures on top of them stays with the customer, starting with the operating system of the virtual machines, then the applications and the data."
    fr: "En IaaS, le fournisseur de cloud sécurise le centre de données physique, le matériel réseau et les machines hôtes. Tout ce que le client installe et configure par-dessus reste à sa charge, à commencer par le système d'exploitation des machines virtuelles, puis les applications et les données."
  options:
    a:
      en: "The physical hosts belong to the cloud provider in every cloud service model."
      fr: "Les hôtes physiques relèvent du fournisseur de cloud dans tous les modèles de service cloud."
    b:
      en: "The physical network of the datacenter is operated and secured by the cloud provider."
      fr: "Le réseau physique du centre de données est exploité et sécurisé par le fournisseur de cloud."
    d:
      en: "Physical security of the datacenter is always the cloud provider's responsibility."
      fr: "La sécurité physique du centre de données incombe toujours au fournisseur de cloud."
references:
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/2-describe-shared-responsibility-model
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
