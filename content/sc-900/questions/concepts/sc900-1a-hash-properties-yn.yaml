id: sc900-1a-hash-properties-yn
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about hashing, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le hachage, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Hashing the same input with the same algorithm always produces the same hash value."
        fr: "Hacher la même entrée avec le même algorithme produit toujours la même valeur de hachage."
    - id: s2
      text:
        en: "A system can check the password that a user enters by comparing hash values, without storing the password itself."
        fr: "Un système peut contrôler le mot de passe saisi par un utilisateur en comparant des valeurs de hachage, sans stocker le mot de passe lui-même."
    - id: s3
      text:
        en: "A hash value can be converted back to the original data by using the correct key."
        fr: "Une valeur de hachage peut être reconvertie en données d'origine à l'aide de la bonne clé."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Hashing is deterministic: the same input always gives the same fixed-length hash. This is what lets a system store only the hash of a password and compare it with the hash of the password entered at sign-in. Hashing is one-way and uses no key, so the input can't be recovered from the hash; reversibility with a key is the mark of encryption."
    fr: "Le hachage est déterministe : la même entrée donne toujours le même hachage de longueur fixe. C'est ce qui permet à un système de ne stocker que le hachage d'un mot de passe et de le comparer au hachage du mot de passe saisi à la connexion. Le hachage est à sens unique et n'utilise aucune clé : l'entrée ne peut donc pas être retrouvée à partir du hachage ; la réversibilité avec une clé caractérise le chiffrement."
references:
  - title: Describe encryption and hashing
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/5-describe-encryption-hashing
