id: sc900-1a-shared-paas-code
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum develops a web application and deploys it to a platform as a service (PaaS) offering in Azure.

    According to the shared responsibility model, what is Adatum responsible for?
  fr: |
    Adatum développe une application web et la déploie sur une offre PaaS (platform as a service) dans Azure.

    Selon le modèle de responsabilité partagée, de quoi Adatum est-elle responsable ?
body:
  options:
    - id: a
      text: { en: "Securing the code and the configuration of the application", fr: "Sécuriser le code et la configuration de l'application" }
    - id: b
      text: { en: "Patching the operating system of the servers that host the application", fr: "Appliquer les correctifs au système d'exploitation des serveurs qui hébergent l'application" }
    - id: c
      text: { en: "Replacing the failed hardware of the physical hosts", fr: "Remplacer le matériel défaillant des hôtes physiques" }
    - id: d
      text: { en: "Maintaining the runtime environment that executes the application", fr: "Assurer la maintenance de l'environnement d'exécution de l'application" }
answer: { optionId: a }
explanation:
  correct:
    en: "With PaaS, the provider secures the physical infrastructure and also the operating system and the runtime environment. The customer keeps what it brings to the platform: the application code, its configuration, the access controls and the data."
    fr: "En PaaS, le fournisseur sécurise l'infrastructure physique, mais aussi le système d'exploitation et l'environnement d'exécution. Le client conserve ce qu'il apporte à la plateforme : le code de l'application, sa configuration, les contrôles d'accès et les données."
  options:
    b:
      en: "The operating system is managed by the provider in PaaS; the customer patches it only in IaaS."
      fr: "En PaaS, le système d'exploitation est géré par le fournisseur ; le client n'y applique les correctifs qu'en IaaS."
    c:
      en: "Physical hosts are the provider's responsibility in every cloud model."
      fr: "Les hôtes physiques relèvent du fournisseur dans tous les modèles cloud."
    d:
      en: "The runtime environment is part of what the provider takes over with PaaS."
      fr: "L'environnement d'exécution fait partie de ce que le fournisseur prend en charge en PaaS."
references:
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/2-describe-shared-responsibility-model
