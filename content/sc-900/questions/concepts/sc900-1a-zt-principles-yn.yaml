id: sc900-1a-zt-principles-yn
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the Zero Trust guiding principles, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les principes directeurs de la Confiance Zéro (Zero Trust), sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Granting an administrator role only for the two hours needed to complete a task is an application of the principle of least privilege access."
        fr: "Accorder un rôle d'administrateur uniquement pendant les deux heures nécessaires à une tâche est une application du principe « utiliser l'accès selon le moindre privilège »."
    - id: s2
      text:
        en: "Under the verify explicitly principle, a request is approved as soon as the user enters a correct password, whatever the device or the location."
        fr: "Selon le principe « vérifier explicitement », une demande est approuvée dès que l'utilisateur saisit un mot de passe correct, quels que soient l'appareil et l'emplacement."
    - id: s3
      text:
        en: "The verify explicitly principle uses signals such as the compliance status of the device and the classification of the data to decide whether to grant access."
        fr: "Le principe « vérifier explicitement » utilise des signaux tels que l'état de conformité de l'appareil et la classification des données pour décider d'accorder ou non l'accès."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Least privilege access gives only the access that is needed, for only as long as it is needed: just-in-time and just-enough access. Verify explicitly means authenticating and authorizing on all available signals, not on a single factor such as a password or a network location: user identity, sign-in location, device and its compliance, application, data classification and anomalies."
    fr: "L'accès selon le moindre privilège ne donne que l'accès nécessaire, et seulement le temps nécessaire : accès juste-à-temps et juste suffisant. Vérifier explicitement signifie authentifier et autoriser à partir de tous les signaux disponibles, et non d'un seul facteur comme un mot de passe ou un emplacement réseau : identité de l'utilisateur, emplacement de connexion, appareil et conformité de celui-ci, application, classification des données et anomalies."
references:
  - title: Describe the Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/4-describe-zero-trust-model
  - title: Zero Trust as a security foundation
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
