id: sc900-1a-enc-data-states
objective: "1.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Encryption protects data in each of its states.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le chiffrement protège les données dans chacun de leurs états.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Files stored on the hard disk of a server are data [[s1]].

      A web page that a browser downloads over HTTPS is data [[s2]].

      Confidential computing, which processes data inside a secure enclave, protects data [[s3]].
    fr: |
      Les fichiers stockés sur le disque dur d'un serveur sont des données [[s1]].

      Une page web qu'un navigateur télécharge via HTTPS correspond à des données [[s2]].

      L'informatique confidentielle, qui traite les données dans une enclave sécurisée, protège les données [[s3]].
  slots:
    - id: s1
      options:
        - { id: transit, text: { en: "in transit", fr: "en transit" } }
        - { id: use, text: { en: "in use", fr: "en cours d'utilisation" } }
        - { id: rest, text: { en: "at rest", fr: "au repos" } }
    - id: s2
      options:
        - { id: transit, text: { en: "in transit", fr: "en transit" } }
        - { id: use, text: { en: "in use", fr: "en cours d'utilisation" } }
        - { id: rest, text: { en: "at rest", fr: "au repos" } }
    - id: s3
      options:
        - { id: transit, text: { en: "in transit", fr: "en transit" } }
        - { id: use, text: { en: "in use", fr: "en cours d'utilisation" } }
        - { id: rest, text: { en: "at rest", fr: "au repos" } }
answer:
  values: { s1: rest, s2: transit, s3: use }
explanation:
  correct:
    en: "Data at rest is stored on a physical device such as a disk, a database or a storage account. Data in transit moves across a network; HTTPS protects it with TLS. Data in use is being processed in memory, where it is normally decrypted; confidential computing keeps it protected inside secure enclaves."
    fr: "Les données au repos sont stockées sur un support physique tel qu'un disque, une base de données ou un compte de stockage. Les données en transit circulent sur un réseau ; HTTPS les protège avec TLS. Les données en cours d'utilisation sont traitées en mémoire, où elles sont normalement déchiffrées ; l'informatique confidentielle les garde protégées dans des enclaves sécurisées."
references:
  - title: Describe encryption and hashing
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/5-describe-encryption-hashing
