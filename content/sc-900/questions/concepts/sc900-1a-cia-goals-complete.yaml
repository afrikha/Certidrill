id: sc900-1a-cia-goals-complete
objective: "1.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Security controls serve the three goals of the CIA triad.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les contrôles de sécurité servent les trois objectifs de la triade CIA.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Encrypting customer records so that only authorized employees can read them protects [[g1]].

      Using digital signatures to detect records that were changed without authorization protects [[g2]].

      Running an application on redundant servers with automatic failover protects [[g3]].
    fr: |
      Chiffrer les dossiers des clients pour que seuls les employés autorisés puissent les lire protège [[g1]].

      Utiliser des signatures numériques pour détecter les dossiers modifiés sans autorisation protège [[g2]].

      Exécuter une application sur des serveurs redondants avec basculement automatique protège [[g3]].
  slots:
    - id: g1
      options:
        - { id: avail, text: { en: "availability", fr: "la disponibilité" } }
        - { id: conf, text: { en: "confidentiality", fr: "la confidentialité" } }
        - { id: integ, text: { en: "integrity", fr: "l'intégrité" } }
    - id: g2
      options:
        - { id: avail, text: { en: "availability", fr: "la disponibilité" } }
        - { id: conf, text: { en: "confidentiality", fr: "la confidentialité" } }
        - { id: integ, text: { en: "integrity", fr: "l'intégrité" } }
    - id: g3
      options:
        - { id: avail, text: { en: "availability", fr: "la disponibilité" } }
        - { id: conf, text: { en: "confidentiality", fr: "la confidentialité" } }
        - { id: integ, text: { en: "integrity", fr: "l'intégrité" } }
answer:
  values: { g1: conf, g2: integ, g3: avail }
explanation:
  correct:
    en: "Confidentiality keeps information readable only by those who are authorized, which is what encryption and access control achieve. Integrity keeps data accurate and unmodified except by authorized changes; hashing and digital signatures reveal tampering. Availability keeps data and systems reachable when authorized users need them, thanks to redundancy, failover and backups."
    fr: "La confidentialité garantit que seules les personnes autorisées peuvent lire l'information : c'est le rôle du chiffrement et du contrôle d'accès. L'intégrité garantit que les données restent exactes et non modifiées, sauf par des changements autorisés ; le hachage et les signatures numériques révèlent toute altération. La disponibilité garantit que les données et les systèmes restent accessibles quand les utilisateurs autorisés en ont besoin, grâce à la redondance, au basculement et aux sauvegardes."
references:
  - title: Describe defense in depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/3-describe-defense-depth
