id: sc900-1a-shared-models-yn
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about the shared responsibility model, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le modèle de responsabilité partagée, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "In an infrastructure as a service (IaaS) model, the cloud provider is responsible for the physical network."
        fr: "Dans un modèle IaaS (infrastructure as a service), le fournisseur de cloud est responsable du réseau physique."
    - id: s2
      text:
        en: "In a platform as a service (PaaS) model, the customer is responsible for the operating system that hosts the application."
        fr: "Dans un modèle PaaS (platform as a service), le client est responsable du système d'exploitation qui héberge l'application."
    - id: s3
      text:
        en: "In an on-premises datacenter, the organization is responsible for the entire stack, from the building to the data."
        fr: "Dans un centre de données local, l'organisation est responsable de toute la pile, du bâtiment aux données."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "In the cloud, the provider always secures the physical datacenter, the physical network and the physical hosts, IaaS included. With PaaS the provider also takes over the operating system and the runtime environment, so the customer no longer manages them. On-premises, nothing is shared: the organization secures everything itself."
    fr: "Dans le cloud, le fournisseur sécurise toujours le centre de données physique, le réseau physique et les hôtes physiques, y compris en IaaS. En PaaS, le fournisseur prend aussi en charge le système d'exploitation et l'environnement d'exécution : le client ne les gère plus. En local, rien n'est partagé : l'organisation sécurise tout elle-même."
references:
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/2-describe-shared-responsibility-model
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
