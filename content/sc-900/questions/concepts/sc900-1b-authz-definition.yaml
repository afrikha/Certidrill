id: sc900-1b-authz-definition
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user has signed in to a document management system.

    Which process determines whether the user can delete a document?
  fr: |
    Un utilisateur s'est connecté à un système de gestion de documents.

    Quel processus détermine si l'utilisateur peut supprimer un document ?
body:
  options:
    - id: a
      text: { en: "Authorization", fr: "L'autorisation" }
    - id: b
      text: { en: "Authentication", fr: "L'authentification" }
    - id: c
      text: { en: "Federation", fr: "La fédération" }
    - id: d
      text: { en: "Auditing", fr: "L'audit" }
answer: { optionId: a }
explanation:
  correct:
    en: "Authorization is the process of determining what an authenticated identity is allowed to do. Once the user is signed in, the system evaluates the user's permissions for each request, such as deleting a document, and grants or denies it."
    fr: "L'autorisation est le processus qui détermine ce qu'une identité authentifiée a le droit de faire. Une fois l'utilisateur connecté, le système évalue ses autorisations pour chaque demande, par exemple la suppression d'un document, et l'accorde ou la refuse."
  options:
    b:
      en: "Authentication proved who the user is at sign-in; it says nothing about what the user may do afterward."
      fr: "L'authentification a prouvé qui est l'utilisateur à la connexion ; elle ne dit rien de ce qu'il peut faire ensuite."
    c:
      en: "Federation is a trust relationship between identity providers: it concerns where users authenticate, not their permissions on a document."
      fr: "La fédération est une relation d'approbation entre fournisseurs d'identité : elle concerne l'endroit où les utilisateurs s'authentifient, pas leurs autorisations sur un document."
    d:
      en: "Auditing records who did what and when; it doesn't decide whether an action is allowed."
      fr: "L'audit enregistre qui a fait quoi et quand ; il ne décide pas si une action est permise."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
  - title: Authentication vs. authorization
    url: https://learn.microsoft.com/en-us/entra/identity-platform/authentication-vs-authorization
