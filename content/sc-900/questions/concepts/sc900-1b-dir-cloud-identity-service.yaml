id: sc900-1b-dir-cloud-identity-service
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is a new company that has no on-premises servers. Its employees use Windows, macOS, iOS and Android devices and work only with SaaS applications.

    Proseware needs an identity service that Microsoft operates and that requires no infrastructure to deploy.

    What should Proseware use?
  fr: |
    Proseware est une nouvelle entreprise qui n'a aucun serveur local. Ses employés utilisent des appareils Windows, macOS, iOS et Android et travaillent uniquement avec des applications SaaS.

    Proseware a besoin d'un service d'identité exploité par Microsoft, sans infrastructure à déployer.

    Que doit utiliser Proseware ?
body:
  options:
    - id: a
      text: "Active Directory Domain Services (AD DS)"
    - id: b
      text: "Active Directory Federation Services (AD FS)"
    - id: c
      text: "Microsoft Entra ID"
    - id: d
      text: "Microsoft Entra Connect"
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft Entra ID is Microsoft's cloud-based identity and access management service. It follows an identity as a service (IDaaS) model: Microsoft operates and maintains the infrastructure, and the organization manages its users, devices and access policies. It works across platforms and device types and integrates with cloud and SaaS applications."
    fr: "Microsoft Entra ID est le service cloud de gestion des identités et des accès de Microsoft. Il suit un modèle d'identité en tant que service (IDaaS) : Microsoft exploite et maintient l'infrastructure, et l'organisation gère ses utilisateurs, ses appareils et ses stratégies d'accès. Il fonctionne sur toutes les plateformes et tous les types d'appareils et s'intègre aux applications cloud et SaaS."
  options:
    a:
      en: "AD DS runs on domain controllers that the organization deploys, and it doesn't natively support SaaS applications or non-Windows mobile devices."
      fr: "AD DS s'exécute sur des contrôleurs de domaine que l'organisation déploie, et il ne prend pas en charge nativement les applications SaaS ni les appareils mobiles non Windows."
    b:
      en: "AD FS is a server role that extends an on-premises Active Directory to external services: it requires servers and an existing AD DS."
      fr: "AD FS est un rôle serveur qui étend un Active Directory local à des services externes : il exige des serveurs et un AD DS existant."
    d:
      en: "Microsoft Entra Connect synchronizes the identities of an existing on-premises Active Directory to the cloud; it isn't an identity service by itself."
      fr: "Microsoft Entra Connect synchronise vers le cloud les identités d'un Active Directory local existant ; ce n'est pas un service d'identité à lui seul."
references:
  - title: Describe the concept of directory services and Active Directory
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/5-describe-concept-of-directory-services-active-directory
  - title: Compare Active Directory to Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/compare
