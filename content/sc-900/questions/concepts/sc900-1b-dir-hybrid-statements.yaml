id: sc900-1b-dir-hybrid-statements
objective: "1.2.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys runs Active Directory Domain Services (AD DS) on-premises and connects it to Microsoft Entra ID so that identities are synchronized.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys exécute Active Directory Domain Services (AD DS) en local et le connecte à Microsoft Entra ID pour que les identités soient synchronisées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Users can access on-premises resources and cloud resources with the same credentials."
        fr: "Les utilisateurs peuvent accéder aux ressources locales et aux ressources cloud avec les mêmes informations d'identification."
    - id: s2
      text:
        en: "Remote users need a VPN connection to the corporate network to authenticate to Microsoft Entra ID."
        fr: "Les utilisateurs distants ont besoin d'une connexion VPN au réseau d'entreprise pour s'authentifier auprès de Microsoft Entra ID."
    - id: s3
      text:
        en: "Microsoft operates and maintains the AD DS infrastructure of Wingtip Toys."
        fr: "Microsoft exploite et maintient l'infrastructure AD DS de Wingtip Toys."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Connecting AD DS to Microsoft Entra ID so that identities are synchronized is a hybrid identity: users reach on-premises and cloud resources with the same credentials. Microsoft Entra ID is designed for the internet and works without a VPN or on-premises infrastructure; it is direct authentication to AD DS that requires a VPN from outside the corporate network. The identity as a service model, in which Microsoft operates the underlying infrastructure, applies to Microsoft Entra ID: the organization still runs its own AD DS domain controllers."
    fr: "Connecter AD DS à Microsoft Entra ID pour que les identités soient synchronisées constitue une identité hybride : les utilisateurs atteignent les ressources locales et cloud avec les mêmes informations d'identification. Microsoft Entra ID est conçu pour Internet et fonctionne sans VPN ni infrastructure locale ; c'est l'authentification directe auprès d'AD DS qui exige un VPN hors du réseau d'entreprise. Le modèle d'identité en tant que service, où Microsoft exploite l'infrastructure sous-jacente, s'applique à Microsoft Entra ID : l'organisation continue d'exploiter ses propres contrôleurs de domaine AD DS."
references:
  - title: Describe the concept of directory services and Active Directory
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/5-describe-concept-of-directory-services-active-directory
