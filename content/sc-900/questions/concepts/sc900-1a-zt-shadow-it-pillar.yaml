id: sc900-1a-zt-shadow-it-pillar
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Employees of Proseware sign up for file-sharing and messaging services that the IT department never approved (shadow IT).

    Which Zero Trust pillar covers discovering this usage and controlling the permissions that users grant to these services?
  fr: |
    Des employés de Proseware s'inscrivent à des services de partage de fichiers et de messagerie que le service informatique n'a jamais approuvés (informatique fantôme, ou shadow IT).

    Quel pilier de la Confiance Zéro (Zero Trust) couvre la découverte de cet usage et le contrôle des autorisations que les utilisateurs accordent à ces services ?
body:
  options:
    - id: a
      text: { en: "Infrastructure", fr: "Infrastructure" }
    - id: b
      text: { en: "Devices", fr: "Appareils" }
    - id: c
      text: { en: "Networks", fr: "Réseaux" }
    - id: d
      text: { en: "Applications", fr: "Applications" }
answer: { optionId: d }
explanation:
  correct:
    en: "The applications pillar requires visibility into every application used in the environment, including the unsanctioned ones that employees adopt without approval. It also covers the permissions that applications request and that users grant them over their data."
    fr: "Le pilier des applications exige une visibilité sur toutes les applications utilisées dans l'environnement, y compris celles, non approuvées, que les employés adoptent sans validation. Il couvre aussi les autorisations que les applications demandent et que les utilisateurs leur accordent sur leurs données."
  options:
    a:
      en: "The infrastructure pillar concerns servers and cloud resources: their versions, their configuration and just-in-time administrative access."
      fr: "Le pilier de l'infrastructure concerne les serveurs et les ressources cloud : leurs versions, leur configuration et l'accès d'administration juste-à-temps."
    b:
      en: "The devices pillar concerns the health and compliance of the laptops and phones that access resources."
      fr: "Le pilier des appareils concerne l'intégrité et la conformité des ordinateurs portables et des téléphones qui accèdent aux ressources."
    c:
      en: "The networks pillar concerns segmentation, traffic encryption and monitoring."
      fr: "Le pilier des réseaux concerne la segmentation, le chiffrement du trafic et la surveillance."
references:
  - title: Describe the Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/4-describe-zero-trust-model
