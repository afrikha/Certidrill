id: sc900-1b-idp-protocols-match
objective: "1.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Identity providers and applications communicate by using industry-standard protocols.

    Match each description to a protocol. To answer, drag the appropriate protocol to each description. Each protocol may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les fournisseurs d'identité et les applications communiquent au moyen de protocoles standard.

    Associez chaque description à un protocole. Pour répondre, faites glisser le protocole approprié vers chaque description. Chaque protocole peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: saml, text: "SAML" }
    - { id: kerb, text: "Kerberos" }
    - { id: oidc, text: "OpenID Connect" }
    - { id: oauth, text: "OAuth 2.0" }
  targets:
    - id: t1
      text: { en: "Authorization: lets an application obtain access tokens to reach protected resources on behalf of a user", fr: "Autorisation : permet à une application d'obtenir des jetons d'accès pour atteindre des ressources protégées pour le compte d'un utilisateur" }
    - id: t2
      text: { en: "Authentication for modern cloud and mobile applications: lets an application verify the identity of a user and obtain basic profile information", fr: "Authentification pour les applications cloud et mobiles modernes : permet à une application de vérifier l'identité d'un utilisateur et d'obtenir des informations de profil de base" }
    - id: t3
      text: { en: "XML-based standard, common in enterprise scenarios to integrate older applications and for federation between organizations", fr: "Standard fondé sur XML, courant en entreprise pour intégrer des applications anciennes et pour la fédération entre organisations" }
answer:
  mapping: { t1: oauth, t2: oidc, t3: saml }
explanation:
  correct:
    en: "OAuth 2.0 is used for authorization: applications obtain access tokens that grant permission to access protected resources on the user's behalf. OpenID Connect, built on top of OAuth 2.0, is used for authentication in modern cloud and mobile applications. SAML is an XML-based standard that is common in enterprise scenarios, especially with older applications and for federation. Kerberos is the protocol that Active Directory Domain Services uses to authenticate users to on-premises applications."
    fr: "OAuth 2.0 sert à l'autorisation : les applications obtiennent des jetons d'accès qui donnent la permission d'accéder à des ressources protégées pour le compte de l'utilisateur. OpenID Connect, construit au-dessus d'OAuth 2.0, sert à l'authentification dans les applications cloud et mobiles modernes. SAML est un standard fondé sur XML, courant en entreprise, surtout avec les applications anciennes et pour la fédération. Kerberos est le protocole qu'Active Directory Domain Services utilise pour authentifier les utilisateurs auprès des applications locales."
references:
  - title: Describe the role of the identity provider
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/4-describe-role-identity-provider
  - title: Authentication vs. authorization
    url: https://learn.microsoft.com/en-us/entra/identity-platform/authentication-vs-authorization
