id: sc900-1b-authz-denied-after-signin
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A user at Litware signs in to the company portal with a password and a fingerprint, and the portal opens. When the user selects the payroll application, a message says that the user doesn't have permission to view the page.

    Which statement describes what happened?
  fr: |
    Un utilisateur de Litware se connecte au portail de l'entreprise avec un mot de passe et une empreinte digitale, et le portail s'ouvre. Quand il sélectionne l'application de paie, un message indique qu'il n'a pas l'autorisation d'afficher la page.

    Quelle affirmation décrit ce qui s'est passé ?
body:
  options:
    - id: a
      text: { en: "Authentication failed, so authorization wasn't evaluated.", fr: "L'authentification a échoué, donc l'autorisation n'a pas été évaluée." }
    - id: b
      text: { en: "Authorization succeeded, and authentication denied the request.", fr: "L'autorisation a réussi, et l'authentification a refusé la demande." }
    - id: c
      text: { en: "Authentication succeeded, and authorization denied the request.", fr: "L'authentification a réussi, et l'autorisation a refusé la demande." }
    - id: d
      text: { en: "Authentication succeeded, so authorization wasn't evaluated.", fr: "L'authentification a réussi, donc l'autorisation n'a pas été évaluée." }
answer: { optionId: c }
explanation:
  correct:
    en: "The portal opened, so the user proved their identity: authentication succeeded. The system then evaluated the user's permissions for the payroll application and refused the request: that is an authorization decision. The two processes are distinct, and authorization is evaluated for each access request after authentication."
    fr: "Le portail s'est ouvert, donc l'utilisateur a prouvé son identité : l'authentification a réussi. Le système a ensuite évalué les autorisations de l'utilisateur pour l'application de paie et a refusé la demande : c'est une décision d'autorisation. Les deux processus sont distincts, et l'autorisation est évaluée pour chaque demande d'accès après l'authentification."
  options:
    a:
      en: "A failed authentication would have stopped the user at sign-in, before the portal opened."
      fr: "Une authentification en échec aurait arrêté l'utilisateur à la connexion, avant l'ouverture du portail."
    b:
      en: "The order is fixed: authentication comes first, and a permission message is the result of authorization, not of authentication."
      fr: "L'ordre est fixe : l'authentification vient en premier, et un message sur les autorisations est le résultat de l'autorisation, pas de l'authentification."
    d:
      en: "A successful authentication doesn't skip authorization: the permission message shows that the request was evaluated and denied."
      fr: "Une authentification réussie ne dispense pas de l'autorisation : le message sur les autorisations montre que la demande a été évaluée et refusée."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
