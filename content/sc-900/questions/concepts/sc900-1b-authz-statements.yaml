id: sc900-1b-authz-statements
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about authorization, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'autorisation, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A user who authenticates successfully is authorized to access all the resources of the organization."
        fr: "Un utilisateur qui s'authentifie avec succès est autorisé à accéder à toutes les ressources de l'organisation."
    - id: s2
      text:
        en: "An authorization decision can depend on an attribute of the user, such as the department."
        fr: "Une décision d'autorisation peut dépendre d'un attribut de l'utilisateur, par exemple son service."
    - id: s3
      text:
        en: "Granting users only the minimum access that they need reduces the damage that a compromised account can cause."
        fr: "Accorder aux utilisateurs seulement l'accès minimal dont ils ont besoin réduit les dégâts qu'un compte compromis peut causer."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Authentication only confirms the identity: authorization then evaluates each request and can deny it, so a signed-in user doesn't get access to everything. Authorization decisions rely on roles, permissions and attributes such as the department, the location or the job function. The principle of least privilege limits what an attacker can reach with a compromised account, and it also lowers the risk of accidental data loss."
    fr: "L'authentification ne fait que confirmer l'identité : l'autorisation évalue ensuite chaque demande et peut la refuser, si bien qu'un utilisateur connecté n'a pas accès à tout. Les décisions d'autorisation s'appuient sur des rôles, des autorisations et des attributs comme le service, l'emplacement ou la fonction. Le principe du moindre privilège limite ce qu'un attaquant peut atteindre avec un compte compromis, et il réduit aussi le risque de perte accidentelle de données."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
