id: sc900-1a-signature-proves-multi
objective: "1.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso sends a contract to a partner and applies a digital signature to it. The contract itself isn't encrypted.

    Which two guarantees does the digital signature give to the partner?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso envoie un contrat à un partenaire et y appose une signature numérique. Le contrat lui-même n'est pas chiffré.

    Quelles sont les deux garanties que la signature numérique apporte au partenaire ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Only the partner is able to read the contract.", fr: "Seul le partenaire est en mesure de lire le contrat." }
    - id: b
      text: { en: "The contract really comes from Contoso.", fr: "Le contrat provient réellement de Contoso." }
    - id: c
      text: { en: "The contract can be opened only once.", fr: "Le contrat ne peut être ouvert qu'une seule fois." }
    - id: d
      text: { en: "The contract wasn't modified after it was signed.", fr: "Le contrat n'a pas été modifié après sa signature." }
    - id: e
      text: { en: "The contract stays unreadable while it crosses the network.", fr: "Le contrat reste illisible pendant qu'il traverse le réseau." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A digital signature is created with the sender's private key and checked with the sender's public key. A valid check proves authenticity, because only Contoso holds that private key, and integrity, because any change made after signing invalidates the signature."
    fr: "Une signature numérique est créée avec la clé privée de l'expéditeur et contrôlée avec sa clé publique. Un contrôle valide prouve l'authenticité, car seule Contoso détient cette clé privée, et l'intégrité, car toute modification apportée après la signature invalide celle-ci."
  options:
    a:
      en: "Restricting who can read the contract is confidentiality, which requires encryption; a signature doesn't hide the content."
      fr: "Limiter qui peut lire le contrat relève de la confidentialité, qui exige un chiffrement ; une signature ne masque pas le contenu."
    c:
      en: "A signature can be verified as many times as needed and doesn't limit how often the document is opened."
      fr: "Une signature peut être vérifiée autant de fois que nécessaire et ne limite pas le nombre d'ouvertures du document."
    e:
      en: "Protecting data in transit from being read requires encryption, for example TLS; a signed document stays readable."
      fr: "Empêcher la lecture des données en transit exige un chiffrement, par exemple TLS ; un document signé reste lisible."
references:
  - title: Describe encryption and hashing
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/5-describe-encryption-hashing
