id: sc900-1a-grc-privacy
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A regulation requires Fabrikam to tell individuals which personal data it collects about them, to obtain their consent, and to let them access, correct or delete that data.

    Which concept does this regulation address?
  fr: |
    Une réglementation impose à Fabrikam d'indiquer aux personnes quelles données personnelles elle collecte à leur sujet, d'obtenir leur consentement et de leur permettre de consulter, de corriger ou de supprimer ces données.

    De quel concept cette réglementation traite-t-elle ?
body:
  options:
    - id: a
      text: { en: "Data residency", fr: "La résidence des données" }
    - id: b
      text: { en: "Data privacy", fr: "La confidentialité des données" }
    - id: c
      text: { en: "Data sovereignty", fr: "La souveraineté des données" }
    - id: d
      text: { en: "Risk management", fr: "La gestion des risques" }
answer: { optionId: b }
explanation:
  correct:
    en: "Data privacy is the appropriate handling of personal data, meaning any information that relates to an identified or identifiable individual. Privacy laws demand transparency about what is collected, consent where required, and rights for individuals over their data."
    fr: "La confidentialité des données désigne le traitement approprié des données personnelles, c'est-à-dire de toute information relative à une personne identifiée ou identifiable. Les lois sur la protection de la vie privée exigent la transparence sur ce qui est collecté, le consentement lorsqu'il est requis et des droits pour les personnes sur leurs données."
  options:
    a:
      en: "Data residency deals with the physical locations where data may be stored, not with the rights of individuals."
      fr: "La résidence des données traite des emplacements physiques où les données peuvent être stockées, pas des droits des personnes."
    c:
      en: "Data sovereignty deals with which country's or region's laws apply to data, depending on where it is collected, held or processed."
      fr: "La souveraineté des données traite des lois nationales ou régionales qui s'appliquent aux données selon le lieu où elles sont collectées, conservées ou traitées."
    d:
      en: "Risk management is identifying, assessing and responding to threats; it isn't specific to personal data."
      fr: "La gestion des risques consiste à identifier, évaluer et traiter les menaces ; elle n'est pas propre aux données personnelles."
references:
  - title: Describe governance, risk, and compliance (GRC) concepts
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/6-describe-compliance-concepts
