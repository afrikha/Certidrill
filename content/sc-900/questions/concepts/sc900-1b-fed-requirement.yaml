id: sc900-1b-fed-requirement
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses a single identity provider for all its applications.

    Which requirement makes it necessary to establish a trust relationship with another identity provider?
  fr: |
    Tailspin Toys utilise un seul fournisseur d'identité pour toutes ses applications.

    Quelle exigence rend nécessaire l'établissement d'une relation d'approbation avec un autre fournisseur d'identité ?
body:
  options:
    - id: a
      text: { en: "Employees must sign in once and then open every Tailspin Toys application without another prompt.", fr: "Les employés doivent se connecter une fois, puis ouvrir toutes les applications de Tailspin Toys sans nouvelle demande." }
    - id: b
      text: { en: "Employees must approve a notification on their phone after they enter their password.", fr: "Les employés doivent approuver une notification sur leur téléphone après avoir saisi leur mot de passe." }
    - id: c
      text: { en: "Employees who leave the company must lose access to every application when their account is disabled.", fr: "Les employés qui quittent l'entreprise doivent perdre l'accès à toutes les applications quand leur compte est désactivé." }
    - id: d
      text: { en: "Employees of a partner company must open a Tailspin Toys portal with the credentials of their own company.", fr: "Les employés d'une entreprise partenaire doivent ouvrir un portail de Tailspin Toys avec les informations d'identification de leur propre entreprise." }
answer: { optionId: d }
explanation:
  correct:
    en: "The partner's employees authenticate with their own company's identity provider. For Tailspin Toys to accept that authentication, its identity provider must trust the partner's: that trust relationship between two separate identity providers is federation. The other requirements are met inside the single identity provider of Tailspin Toys."
    fr: "Les employés du partenaire s'authentifient auprès du fournisseur d'identité de leur propre entreprise. Pour que Tailspin Toys accepte cette authentification, son fournisseur d'identité doit approuver celui du partenaire : cette relation d'approbation entre deux fournisseurs d'identité distincts est la fédération. Les autres exigences sont satisfaites au sein de l'unique fournisseur d'identité de Tailspin Toys."
  options:
    a:
      en: "This is single sign-on: one sign-in for many applications that trust the same identity provider. No second provider is involved."
      fr: "C'est l'authentification unique : une seule connexion pour de nombreuses applications qui approuvent le même fournisseur d'identité. Aucun second fournisseur n'intervient."
    b:
      en: "This is multifactor authentication, a policy that the identity provider of Tailspin Toys applies by itself."
      fr: "C'est l'authentification multifacteur, une stratégie que le fournisseur d'identité de Tailspin Toys applique seul."
    c:
      en: "This is the centralized control that a single identity provider already gives: disabling the account removes access to all the connected applications."
      fr: "C'est le contrôle centralisé qu'un fournisseur d'identité unique donne déjà : désactiver le compte retire l'accès à toutes les applications connectées."
references:
  - title: Describe the concept of federation
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/6-describe-concept-federation
  - title: Describe the role of the identity provider
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/4-describe-role-identity-provider
