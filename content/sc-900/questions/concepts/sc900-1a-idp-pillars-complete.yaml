id: sc900-1a-idp-pillars-complete
objective: "1.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    An identity infrastructure rests on four pillars.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une infrastructure d'identité repose sur quatre piliers.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[p1]] is the process of verifying that an identity is who or what it claims to be.

      [[p2]] is the process of determining what a verified identity is allowed to do.

      [[p3]] is the tracking and recording of who did what, when and from where.
    fr: |
      [[p1]] est le processus qui vérifie qu'une identité est bien qui ou ce qu'elle prétend être.

      [[p2]] est le processus qui détermine ce qu'une identité vérifiée a le droit de faire.

      [[p3]] est le suivi et l'enregistrement de qui a fait quoi, quand et d'où.
  slots:
    - id: p1
      options:
        - { id: admin, text: { en: "Administration", fr: "L'administration" } }
        - { id: authn, text: { en: "Authentication", fr: "L'authentification" } }
        - { id: authz, text: { en: "Authorization", fr: "L'autorisation" } }
        - { id: audit, text: { en: "Auditing", fr: "L'audit" } }
    - id: p2
      options:
        - { id: admin, text: { en: "Administration", fr: "L'administration" } }
        - { id: authn, text: { en: "Authentication", fr: "L'authentification" } }
        - { id: authz, text: { en: "Authorization", fr: "L'autorisation" } }
        - { id: audit, text: { en: "Auditing", fr: "L'audit" } }
    - id: p3
      options:
        - { id: admin, text: { en: "Administration", fr: "L'administration" } }
        - { id: authn, text: { en: "Authentication", fr: "L'authentification" } }
        - { id: authz, text: { en: "Authorization", fr: "L'autorisation" } }
        - { id: audit, text: { en: "Auditing", fr: "L'audit" } }
answer:
  values: { p1: authn, p2: authz, p3: audit }
explanation:
  correct:
    en: "Authentication challenges an identity for credentials to prove that it is what it claims to be. Authorization then evaluates the permissions and the context of the request to grant or restrict access. Auditing covers sign-in logs, activity reports and alerts, which serve compliance and the investigation of incidents."
    fr: "L'authentification demande à une identité des informations d'identification pour prouver qu'elle est bien ce qu'elle prétend être. L'autorisation évalue ensuite les autorisations et le contexte de la demande pour accorder ou restreindre l'accès. L'audit couvre les journaux de connexion, les rapports d'activité et les alertes, qui servent la conformité et l'investigation des incidents."
  options:
    admin:
      en: "Administration is the creation, management and governance of identities, from provisioning to deprovisioning."
      fr: "L'administration est la création, la gestion et la gouvernance des identités, de l'approvisionnement au déprovisionnement."
references:
  - title: Define identity as the primary security perimeter
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/3-define-identity-primary-security-perimeter
