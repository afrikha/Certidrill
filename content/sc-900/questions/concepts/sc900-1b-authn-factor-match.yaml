id: sc900-1b-authn-factor-match
objective: "1.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each category of authentication factor to an example. To answer, drag the appropriate example to each category. Each example may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque catégorie de facteur d'authentification à un exemple. Pour répondre, faites glisser l'exemple approprié vers chaque catégorie. Chaque exemple peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: card, text: { en: "A smart card", fr: "Une carte à puce" } }
    - { id: role, text: { en: "A role assignment", fr: "Une attribution de rôle" } }
    - { id: face, text: { en: "A facial scan", fr: "Une reconnaissance du visage" } }
    - { id: pin, text: { en: "A PIN", fr: "Un code PIN" } }
  targets:
    - id: know
      text: { en: "Something you know", fr: "Quelque chose que vous savez" }
    - id: have
      text: { en: "Something you have", fr: "Quelque chose que vous possédez" }
    - id: are
      text: { en: "Something you are", fr: "Quelque chose que vous êtes" }
answer:
  mapping: { know: pin, have: card, are: face }
explanation:
  correct:
    en: "A PIN is a secret that the user memorizes: something you know. A smart card is a physical object that the user carries: something you have. A facial scan is a biometric characteristic: something you are. A role assignment isn't a credential: it serves authorization, after the identity has been proved."
    fr: "Un code PIN est un secret que l'utilisateur mémorise : quelque chose que vous savez. Une carte à puce est un objet physique que l'utilisateur porte sur lui : quelque chose que vous possédez. Une reconnaissance du visage porte sur une caractéristique biométrique : quelque chose que vous êtes. Une attribution de rôle n'est pas une information d'identification : elle sert à l'autorisation, une fois l'identité prouvée."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
