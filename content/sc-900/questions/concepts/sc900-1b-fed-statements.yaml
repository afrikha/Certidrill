id: sc900-1b-fed-statements
objective: "1.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about federation, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la fédération, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Federation requires both organizations to use identity providers from the same vendor."
        fr: "La fédération exige que les deux organisations utilisent des fournisseurs d'identité du même éditeur."
    - id: s2
      text:
        en: "With federation, users are authenticated by the identity provider of their own organization."
        fr: "Avec la fédération, les utilisateurs sont authentifiés par le fournisseur d'identité de leur propre organisation."
    - id: s3
      text:
        en: "In a business-to-business collaboration, federation avoids issuing a separate set of credentials to each partner user."
        fr: "Dans une collaboration interentreprises (B2B), la fédération évite de délivrer un jeu d'informations d'identification distinct à chaque utilisateur partenaire."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Federation works across vendors and platforms, because identity providers exchange security tokens through industry-standard protocols. The user's home identity provider performs the authentication and vouches for the user; the other organization accepts that authentication because of the trust relationship. In a partnership, employees therefore use their own company credentials to reach the shared resources, and administrators configure one trust instead of managing individual accounts."
    fr: "La fédération fonctionne entre éditeurs et plateformes différents, car les fournisseurs d'identité échangent des jetons de sécurité au moyen de protocoles standard. Le fournisseur d'identité d'origine de l'utilisateur effectue l'authentification et se porte garant de lui ; l'autre organisation accepte cette authentification en raison de la relation d'approbation. Dans un partenariat, les employés utilisent donc les informations d'identification de leur propre entreprise pour atteindre les ressources partagées, et les administrateurs configurent une seule approbation au lieu de gérer des comptes individuels."
references:
  - title: Describe the concept of federation
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/6-describe-concept-federation
