id: sc900-1a-did-segmentation-layer
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys divides its Azure environment into isolated zones and filters the traffic between them, so that a compromised server can't communicate freely with the other servers.

    Which layer of defense in depth does this control belong to?
  fr: |
    Tailspin Toys divise son environnement Azure en zones isolées et filtre le trafic entre elles, pour qu'un serveur compromis ne puisse pas communiquer librement avec les autres serveurs.

    De quelle couche de la défense en profondeur ce contrôle relève-t-il ?
body:
  options:
    - id: a
      text: { en: "Perimeter", fr: "Périmètre" }
    - id: b
      text: { en: "Network", fr: "Réseau" }
    - id: c
      text: { en: "Compute", fr: "Calcul" }
    - id: d
      text: { en: "Application", fr: "Application" }
answer: { optionId: b }
explanation:
  correct:
    en: "The network layer controls the communication between resources inside a network. Segmentation and network security groups restrict that traffic, so that the compromise of one resource doesn't automatically expose the others."
    fr: "La couche réseau contrôle les communications entre les ressources à l'intérieur d'un réseau. La segmentation et les groupes de sécurité réseau restreignent ce trafic, de sorte que la compromission d'une ressource n'expose pas automatiquement les autres."
  options:
    a:
      en: "The perimeter layer protects the boundary of the network against large-scale attacks from outside, for example with DDoS protection and perimeter firewalls."
      fr: "La couche de périmètre protège la frontière du réseau contre les attaques externes à grande échelle, par exemple avec la protection DDoS et les pare-feux de périmètre."
    c:
      en: "The compute layer protects the virtual machines themselves: patching, closing unused ports, restricting administrative access."
      fr: "La couche de calcul protège les machines virtuelles elles-mêmes : correctifs, fermeture des ports inutilisés, restriction des accès d'administration."
    d:
      en: "The application layer deals with vulnerabilities in the application, for example through secure development and input validation."
      fr: "La couche d'application traite les vulnérabilités de l'application, par exemple par le développement sécurisé et la validation des entrées."
references:
  - title: Describe defense in depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/3-describe-defense-depth
