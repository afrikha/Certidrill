id: sc900-1a-cia-lost-key
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank encrypts its archived contracts. The only copy of the encryption key is lost, and nobody, including the authorized employees, can open the archives any longer. No data was disclosed or modified.

    Which goal of the CIA triad is no longer met?
  fr: |
    Woodgrove Bank chiffre ses contrats archivés. L'unique copie de la clé de chiffrement est perdue, et plus personne, y compris les employés autorisés, ne peut ouvrir les archives. Aucune donnée n'a été divulguée ni modifiée.

    Quel objectif de la triade CIA n'est plus atteint ?
body:
  options:
    - id: a
      text: { en: "Confidentiality", fr: "Confidentialité" }
    - id: b
      text: { en: "Integrity", fr: "Intégrité" }
    - id: c
      text: { en: "Availability", fr: "Disponibilité" }
answer: { optionId: c }
explanation:
  correct:
    en: "Availability means that data and systems are accessible to authorized users when they need them. Encryption serves confidentiality, but when the key is lost the data becomes permanently inaccessible to its legitimate users: the three goals can conflict and have to be balanced."
    fr: "La disponibilité signifie que les données et les systèmes sont accessibles aux utilisateurs autorisés quand ils en ont besoin. Le chiffrement sert la confidentialité, mais lorsque la clé est perdue, les données deviennent définitivement inaccessibles à leurs utilisateurs légitimes : les trois objectifs peuvent entrer en conflit et doivent être équilibrés."
  options:
    a:
      en: "Confidentiality is intact: no unauthorized person has read the contracts, which are still encrypted."
      fr: "La confidentialité est intacte : aucune personne non autorisée n'a lu les contrats, qui sont toujours chiffrés."
    b:
      en: "Integrity is intact: the scenario states that the data wasn't modified."
      fr: "L'intégrité est intacte : le scénario précise que les données n'ont pas été modifiées."
references:
  - title: Describe defense in depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/3-describe-defense-depth
