id: sc900-1a-did-layers-match
objective: "1.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each security control to the layer of defense in depth to which it belongs.

    To answer, drag the appropriate layer to each control. Each layer may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque contrôle de sécurité à la couche de défense en profondeur dont il relève.

    Pour répondre, faites glisser la couche appropriée vers chaque contrôle. Chaque couche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: phys, text: { en: "Physical security", fr: "Sécurité physique" } }
    - { id: idacc, text: { en: "Identity and access", fr: "Identité et accès" } }
    - { id: perim, text: { en: "Perimeter", fr: "Périmètre" } }
    - { id: net, text: { en: "Network", fr: "Réseau" } }
    - { id: comp, text: { en: "Compute", fr: "Calcul" } }
    - { id: data, text: { en: "Data", fr: "Données" } }
  targets:
    - id: t1
      text: { en: "A DDoS protection service that filters attack traffic before it disrupts the services", fr: "Un service de protection DDoS qui filtre le trafic d'attaque avant qu'il ne perturbe les services" }
    - id: t2
      text: { en: "Badge readers that control who enters the server rooms", fr: "Des lecteurs de badges qui contrôlent qui entre dans les salles de serveurs" }
    - id: t3
      text: { en: "Regular patching of the operating system of the virtual machines", fr: "L'application régulière des correctifs au système d'exploitation des machines virtuelles" }
    - id: t4
      text: { en: "Conditional access policies that evaluate the sign-in location and the device compliance", fr: "Des stratégies d'accès conditionnel qui évaluent l'emplacement de connexion et la conformité de l'appareil" }
answer:
  mapping: { t1: perim, t2: phys, t3: comp, t4: idacc }
explanation:
  correct:
    en: "DDoS protection defends the boundary of the network against large-scale attacks from outside: it is a perimeter control. Badge readers limit physical access to the hardware. Keeping operating systems patched protects compute resources. Conditional access policies authenticate and authorize users before access is granted, which is the identity and access layer."
    fr: "La protection DDoS défend la frontière du réseau contre les attaques externes à grande échelle : c'est un contrôle de périmètre. Les lecteurs de badges limitent l'accès physique au matériel. Maintenir les systèmes d'exploitation à jour protège les ressources de calcul. Les stratégies d'accès conditionnel authentifient et autorisent les utilisateurs avant d'accorder l'accès, ce qui correspond à la couche d'identité et d'accès."
  options:
    net:
      en: "The network layer controls communication between resources inside the network, for example with segmentation and network security groups."
      fr: "La couche réseau contrôle les communications entre les ressources à l'intérieur du réseau, par exemple par la segmentation et les groupes de sécurité réseau."
    data:
      en: "The data layer covers access control on the data itself, its encryption and its classification."
      fr: "La couche des données couvre le contrôle d'accès aux données elles-mêmes, leur chiffrement et leur classification."
references:
  - title: Describe defense in depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/3-describe-defense-depth
