id: sc900-1b-idp-central-statements
objective: "1.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum connects all its applications to a central identity provider.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum connecte toutes ses applications à un fournisseur d'identité central.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Each application must keep its own store of usernames and passwords."
        fr: "Chaque application doit conserver sa propre base de noms d'utilisateur et de mots de passe."
    - id: s2
      text:
        en: "Disabling a user account in the identity provider removes the user's access to all the connected applications."
        fr: "Désactiver un compte d'utilisateur dans le fournisseur d'identité retire à l'utilisateur l'accès à toutes les applications connectées."
    - id: s3
      text:
        en: "Adatum can apply a multifactor authentication requirement to all the connected applications from one place."
        fr: "Adatum peut appliquer une exigence d'authentification multifacteur à toutes les applications connectées depuis un seul endroit."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "An identity provider creates, maintains and manages identity information for the applications, which delegate authentication to it instead of managing their own user accounts. Because every application depends on the same account, disabling it in the identity provider immediately removes access everywhere. Authentication policies, including multifactor authentication requirements, are defined once and apply consistently to all the applications."
    fr: "Un fournisseur d'identité crée, tient à jour et gère les informations d'identité pour les applications, qui lui délèguent l'authentification au lieu de gérer leurs propres comptes d'utilisateur. Comme toutes les applications dépendent du même compte, le désactiver dans le fournisseur d'identité retire immédiatement l'accès partout. Les stratégies d'authentification, y compris les exigences d'authentification multifacteur, sont définies une fois et s'appliquent de façon cohérente à toutes les applications."
references:
  - title: Describe the role of the identity provider
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/4-describe-role-identity-provider
