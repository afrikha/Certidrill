id: sc900-1b-idp-sso
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    All the applications of Northwind Traders trust the same identity provider. Users sign in once to the identity provider, then open each application without entering their credentials again.

    Which capability does this describe?
  fr: |
    Toutes les applications de Northwind Traders approuvent le même fournisseur d'identité. Les utilisateurs se connectent une fois au fournisseur d'identité, puis ouvrent chaque application sans ressaisir leurs informations d'identification.

    Quelle fonctionnalité cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Multifactor authentication", fr: "L'authentification multifacteur" }
    - id: b
      text: { en: "Single sign-on", fr: "L'authentification unique" }
    - id: c
      text: { en: "Federation", fr: "La fédération" }
    - id: d
      text: { en: "Self-service password reset", fr: "La réinitialisation de mot de passe en libre-service" }
answer: { optionId: b }
explanation:
  correct:
    en: "With single sign-on (SSO), a user signs in once to the identity provider and is then signed in to every application that trusts that same identity provider. The provider issues tokens that the user presents to each application, which validates them without asking for credentials again."
    fr: "Avec l'authentification unique (SSO), un utilisateur se connecte une fois au fournisseur d'identité, puis est connecté à toutes les applications qui approuvent ce même fournisseur d'identité. Le fournisseur émet des jetons que l'utilisateur présente à chaque application, qui les valide sans redemander d'informations d'identification."
  options:
    a:
      en: "Multifactor authentication strengthens a sign-in by requiring factors from different categories; it doesn't remove the following sign-in prompts."
      fr: "L'authentification multifacteur renforce une connexion en exigeant des facteurs de catégories différentes ; elle ne supprime pas les demandes de connexion suivantes."
    c:
      en: "Federation is a trust relationship between two different identity providers; here every application relies on a single identity provider."
      fr: "La fédération est une relation d'approbation entre deux fournisseurs d'identité différents ; ici, toutes les applications s'appuient sur un seul fournisseur d'identité."
    d:
      en: "Self-service password reset lets users change a forgotten password themselves; users still sign in to applications as before."
      fr: "La réinitialisation de mot de passe en libre-service permet aux utilisateurs de changer eux-mêmes un mot de passe oublié ; ils se connectent toujours aux applications comme avant."
references:
  - title: Describe the role of the identity provider
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/4-describe-role-identity-provider
  - title: What is single sign-on in Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-single-sign-on
