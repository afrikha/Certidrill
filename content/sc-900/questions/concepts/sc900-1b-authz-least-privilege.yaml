id: sc900-1b-authz-least-privilege
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An accountant at Woodgrove Bank only needs to view invoices. An administrator grants the accountant read access to the invoice library and no other permission.

    Which principle does the administrator apply?
  fr: |
    Un comptable de Woodgrove Bank a seulement besoin de consulter des factures. Un administrateur lui accorde l'accès en lecture à la bibliothèque de factures et aucune autre autorisation.

    Quel principe l'administrateur applique-t-il ?
body:
  options:
    - id: a
      text: { en: "Defense in depth", fr: "La défense en profondeur" }
    - id: b
      text: { en: "Assume breach", fr: "Supposer une violation" }
    - id: c
      text: { en: "Verify explicitly", fr: "Vérifier explicitement" }
    - id: d
      text: { en: "Least privilege", fr: "Le moindre privilège" }
answer: { optionId: d }
explanation:
  correct:
    en: "The principle of least privilege applies to authorization: each user gets only the minimum access needed to do the job, and no more. Read access to the invoices is all the accountant needs. If the account is compromised, the damage stays limited."
    fr: "Le principe du moindre privilège s'applique à l'autorisation : chaque utilisateur reçoit seulement l'accès minimal nécessaire à son travail, et rien de plus. L'accès en lecture aux factures est tout ce dont le comptable a besoin. Si le compte est compromis, les dégâts restent limités."
  options:
    a:
      en: "Defense in depth stacks several layers of protection so that a second layer stops an attack that passes the first; it isn't about sizing one user's permissions."
      fr: "La défense en profondeur empile plusieurs couches de protection pour qu'une deuxième couche arrête une attaque qui franchit la première ; elle ne porte pas sur le dimensionnement des autorisations d'un utilisateur."
    b:
      en: "Assume breach means designing as if an attacker were already inside: segmenting, encrypting and monitoring."
      fr: "Supposer une violation consiste à concevoir comme si un attaquant était déjà entré : segmenter, chiffrer et surveiller."
    c:
      en: "Verify explicitly means authenticating and authorizing every request from all the available signals; it doesn't say how much access to grant."
      fr: "Vérifier explicitement consiste à authentifier et autoriser chaque demande à partir de tous les signaux disponibles ; cela ne dit pas quelle quantité d'accès accorder."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
