id: sc900-1b-dir-adds-capabilities
objective: "1.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs Active Directory Domain Services (AD DS) on its corporate network and uses no other identity solution.

    Which two capabilities does AD DS provide natively?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute Active Directory Domain Services (AD DS) sur son réseau d'entreprise et n'utilise aucune autre solution d'identité.

    Quelles sont les deux fonctionnalités qu'AD DS fournit nativement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Applying Group Policy settings to control the configuration of devices", fr: "Appliquer des paramètres de stratégie de groupe pour contrôler la configuration des appareils" } }
    - { id: b, text: { en: "Signing users in to SaaS applications by using OpenID Connect", fr: "Connecter les utilisateurs à des applications SaaS au moyen d'OpenID Connect" } }
    - { id: c, text: { en: "Authenticating users to on-premises applications by using Kerberos", fr: "Authentifier les utilisateurs auprès des applications locales au moyen de Kerberos" } }
    - { id: d, text: { en: "Managing the iOS and Android devices of the employees", fr: "Gérer les appareils iOS et Android des employés" } }
    - { id: e, text: { en: "Authenticating remote users who have no VPN connection", fr: "Authentifier les utilisateurs distants qui n'ont pas de connexion VPN" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AD DS was designed for on-premises, domain-based networks. It lets an organization apply Group Policy settings to control device configurations and authenticate users to on-premises applications with established protocols such as Kerberos and NTLM. It also gives each user a single identity for the on-premises systems."
    fr: "AD DS a été conçu pour les réseaux locaux organisés en domaines. Il permet à une organisation d'appliquer des paramètres de stratégie de groupe pour contrôler la configuration des appareils et d'authentifier les utilisateurs auprès des applications locales avec des protocoles établis comme Kerberos et NTLM. Il donne aussi à chaque utilisateur une identité unique pour les systèmes locaux."
  options:
    b:
      en: "AD DS doesn't natively support modern protocols such as OpenID Connect and OAuth 2.0, and doesn't natively authenticate users to SaaS applications: that requires synchronization tools or federation services."
      fr: "AD DS ne prend pas en charge nativement les protocoles modernes comme OpenID Connect et OAuth 2.0, et n'authentifie pas nativement les utilisateurs auprès des applications SaaS : il faut des outils de synchronisation ou des services de fédération."
    d:
      en: "AD DS doesn't natively manage iOS, Android or other non-Windows devices; additional solutions are needed."
      fr: "AD DS ne gère pas nativement les appareils iOS, Android ou autres appareils non Windows ; il faut des solutions supplémentaires."
    e:
      en: "Users who work away from the corporate network need a VPN connection to authenticate directly to AD DS."
      fr: "Les utilisateurs qui travaillent hors du réseau d'entreprise ont besoin d'une connexion VPN pour s'authentifier directement auprès d'AD DS."
references:
  - title: Describe the concept of directory services and Active Directory
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/5-describe-concept-of-directory-services-active-directory
  - title: Compare Active Directory to Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/compare
