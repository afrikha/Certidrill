id: sc900-1a-zt-principle-name
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which of the following is a guiding principle of the Zero Trust model?
  fr: |
    Parmi les propositions suivantes, laquelle est un principe directeur du modèle Confiance Zéro (Zero Trust) ?
body:
  options:
    - id: a
      text: { en: "Trust the internal network", fr: "Faire confiance au réseau interne" }
    - id: b
      text: { en: "Assume breach", fr: "Supposer une violation" }
    - id: c
      text: { en: "Defend the perimeter first", fr: "Défendre d'abord le périmètre" }
    - id: d
      text: { en: "Verify once, then trust", fr: "Vérifier une fois, puis faire confiance" }
answer: { optionId: b }
explanation:
  correct:
    en: "Zero Trust rests on three guiding principles: verify explicitly, use least privilege access and assume breach. Assume breach means designing security as if an attacker will eventually get through, so that the damage stays limited and the intrusion is detected quickly."
    fr: "La Confiance Zéro repose sur trois principes directeurs : vérifier explicitement, utiliser l'accès selon le moindre privilège et supposer une violation. Supposer une violation, c'est concevoir la sécurité comme si un attaquant allait finir par entrer, afin de limiter les dégâts et de détecter rapidement l'intrusion."
  options:
    a:
      en: "This is the assumption of the traditional perimeter model, which Zero Trust rejects: no network is trusted by default."
      fr: "C'est l'hypothèse du modèle de périmètre traditionnel, que la Confiance Zéro rejette : aucun réseau n'est approuvé par défaut."
    c:
      en: "Zero Trust considers that the network perimeter alone is no longer a reliable security boundary."
      fr: "La Confiance Zéro considère que le périmètre réseau seul n'est plus une frontière de sécurité fiable."
    d:
      en: "Zero Trust verifies every access request, including those of users who are already authenticated."
      fr: "La Confiance Zéro vérifie chaque demande d'accès, y compris celles des utilisateurs déjà authentifiés."
references:
  - title: Describe the Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/4-describe-zero-trust-model
  - title: Zero Trust as a security foundation
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
