id: sc900-1a-grc-compliance-yn
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about governance, risk and compliance (GRC), select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la gouvernance, le risque et la conformité (GRC), sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An organization that complies with all the regulations that apply to it is protected against all security threats."
        fr: "Une organisation qui se conforme à toutes les réglementations qui s'appliquent à elle est protégée contre toutes les menaces de sécurité."
    - id: s2
      text:
        en: "Governance is the process of identifying, assessing and responding to the threats that can affect the organization's objectives."
        fr: "La gouvernance est le processus qui consiste à identifier, évaluer et traiter les menaces susceptibles d'affecter les objectifs de l'organisation."
    - id: s3
      text:
        en: "Data residency requirements can restrict the physical locations in which an organization stores its data."
        fr: "Les exigences de résidence des données peuvent restreindre les emplacements physiques dans lesquels une organisation stocke ses données."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "Compliance sets the minimum that laws and regulations require; security is broader, and a compliant organization can still have significant vulnerabilities. Identifying, assessing and responding to threats defines risk management, whereas governance is the system of rules, practices and processes that directs and controls the organization. Data residency rules govern where data may physically be stored and how it may be transferred or accessed internationally."
    fr: "La conformité fixe le minimum exigé par les lois et les réglementations ; la sécurité est plus large, et une organisation conforme peut encore présenter des vulnérabilités importantes. Identifier, évaluer et traiter les menaces définit la gestion des risques, alors que la gouvernance est le système de règles, de pratiques et de processus qui dirige et contrôle l'organisation. Les règles de résidence des données régissent les lieux où les données peuvent être physiquement stockées et la façon dont elles peuvent être transférées ou consultées à l'international."
references:
  - title: Describe governance, risk, and compliance (GRC) concepts
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/6-describe-compliance-concepts
