id: sc900-1a-shared-saas-keep-multi
objective: "1.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans to move its email from servers in its own datacenter to a software as a service (SaaS) offering.

    Which two responsibilities will Northwind Traders keep after the move?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit de déplacer sa messagerie, hébergée sur des serveurs de son propre centre de données, vers une offre SaaS (software as a service).

    Quelles sont les deux responsabilités que Northwind Traders conservera après la migration ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Patching the operating system of the mail servers", fr: "Appliquer les correctifs au système d'exploitation des serveurs de messagerie" }
    - id: b
      text: { en: "Classifying and protecting the data stored in the mailboxes", fr: "Classifier et protéger les données stockées dans les boîtes aux lettres" }
    - id: c
      text: { en: "Maintaining the network hardware of the datacenter", fr: "Assurer la maintenance du matériel réseau du centre de données" }
    - id: d
      text: { en: "Updating the mail server software to new versions", fr: "Mettre à jour le logiciel serveur de messagerie vers les nouvelles versions" }
    - id: e
      text: { en: "Managing the user accounts and their authentication methods", fr: "Gérer les comptes d'utilisateur et leurs méthodes d'authentification" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "With SaaS, the provider manages the entire application stack and the infrastructure below it. The customer still owns its data, which it must classify and protect, and its identities: user accounts, authentication methods and access permissions."
    fr: "En SaaS, le fournisseur gère toute la pile applicative et l'infrastructure sous-jacente. Le client reste propriétaire de ses données, qu'il doit classifier et protéger, et de ses identités : comptes d'utilisateur, méthodes d'authentification et autorisations d'accès."
  options:
    a:
      en: "The operating system is the provider's responsibility in SaaS, as it already is in PaaS."
      fr: "Le système d'exploitation relève du fournisseur en SaaS, comme c'est déjà le cas en PaaS."
    c:
      en: "Network hardware in the datacenter belongs to the provider in every cloud model."
      fr: "Le matériel réseau du centre de données relève du fournisseur dans tous les modèles cloud."
    d:
      en: "In SaaS, the provider maintains and updates the application itself."
      fr: "En SaaS, c'est le fournisseur qui maintient et met à jour l'application elle-même."
references:
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/2-describe-shared-responsibility-model
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
