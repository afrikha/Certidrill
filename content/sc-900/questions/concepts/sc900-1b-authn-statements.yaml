id: sc900-1b-authn-statements
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about authentication, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'authentification, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Signing in with only a fingerprint is single-factor authentication."
        fr: "Se connecter avec une empreinte digitale seule est une authentification à un seul facteur."
    - id: s2
      text:
        en: "A successful authentication determines which resources the user can access."
        fr: "Une authentification réussie détermine les ressources auxquelles l'utilisateur peut accéder."
    - id: s3
      text:
        en: "A username on its own is sufficient proof of a user's identity."
        fr: "Un nom d'utilisateur suffit à lui seul à prouver l'identité d'un utilisateur."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Single-factor authentication uses one factor, whatever its category: a fingerprint alone is one factor, even if it is stronger than a password. Authentication only succeeds or fails: it confirms the identity, and authorization then decides what that identity can access. A username isn't a proof, because other people can know or guess it: authentication requires credentials such as a password, a device or a biometric characteristic."
    fr: "L'authentification à un seul facteur utilise un seul facteur, quelle que soit sa catégorie : une empreinte digitale seule est un facteur, même s'il est plus fort qu'un mot de passe. L'authentification ne fait que réussir ou échouer : elle confirme l'identité, puis l'autorisation décide de ce à quoi cette identité peut accéder. Un nom d'utilisateur n'est pas une preuve, car d'autres personnes peuvent le connaître ou le deviner : l'authentification exige des informations d'identification comme un mot de passe, un appareil ou une caractéristique biométrique."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
