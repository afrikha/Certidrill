id: sc900-1b-authn-stolen-password
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The users of Fabrikam sign in to a web application with a username and a password.

    Fabrikam wants to reduce the risk that an attacker who steals a password through phishing can sign in as the user.

    What should Fabrikam require?
  fr: |
    Les utilisateurs de Fabrikam se connectent à une application web avec un nom d'utilisateur et un mot de passe.

    Fabrikam veut réduire le risque qu'un attaquant qui vole un mot de passe par hameçonnage puisse se connecter à la place de l'utilisateur.

    Que doit exiger Fabrikam ?
body:
  options:
    - id: a
      text: { en: "Single sign-on", fr: "L'authentification unique" }
    - id: b
      text: { en: "The principle of least privilege", fr: "Le principe du moindre privilège" }
    - id: c
      text: { en: "Multifactor authentication", fr: "L'authentification multifacteur" }
    - id: d
      text: { en: "A federation trust", fr: "Une approbation de fédération" }
answer: { optionId: c }
explanation:
  correct:
    en: "With a password alone, the sign-in is single-factor: whoever holds the password has everything needed to impersonate the user. Multifactor authentication adds a factor from another category, such as a phone or a fingerprint, that the attacker doesn't have. A stolen password is then no longer enough."
    fr: "Avec un mot de passe seul, la connexion est à un seul facteur : celui qui détient le mot de passe a tout ce qu'il faut pour se faire passer pour l'utilisateur. L'authentification multifacteur ajoute un facteur d'une autre catégorie, par exemple un téléphone ou une empreinte digitale, que l'attaquant n'a pas. Un mot de passe volé ne suffit alors plus."
  options:
    a:
      en: "Single sign-on reduces the number of sign-in prompts, but the one sign-in that remains is still protected by the password alone."
      fr: "L'authentification unique réduit le nombre de demandes de connexion, mais la seule connexion qui reste est toujours protégée par le mot de passe seul."
    b:
      en: "Least privilege limits what a compromised account can do after sign-in; it doesn't make the sign-in itself harder."
      fr: "Le moindre privilège limite ce qu'un compte compromis peut faire après la connexion ; il ne rend pas la connexion elle-même plus difficile."
    d:
      en: "A federation trust lets users of another identity provider access the application; it adds no proof to a password sign-in."
      fr: "Une approbation de fédération laisse les utilisateurs d'un autre fournisseur d'identité accéder à l'application ; elle n'ajoute aucune preuve à une connexion par mot de passe."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
