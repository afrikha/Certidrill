id: sc900-1a-zt-assume-breach-scenario
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    At Wingtip Toys, every user signs in with multifactor authentication from a compliant device and holds only the permissions that the job requires. The security team still encrypts all traffic end to end and deploys analytics to detect an intrusion quickly.

    Which Zero Trust principle do these additional measures apply?
  fr: |
    Chez Wingtip Toys, chaque utilisateur se connecte avec l'authentification multifacteur depuis un appareil conforme et ne détient que les autorisations nécessaires à son poste. L'équipe de sécurité chiffre malgré tout l'ensemble du trafic de bout en bout et déploie des outils d'analyse pour détecter rapidement une intrusion.

    Quel principe de la Confiance Zéro (Zero Trust) ces mesures supplémentaires appliquent-elles ?
body:
  options:
    - id: a
      text: { en: "Verify explicitly", fr: "Vérifier explicitement" }
    - id: b
      text: { en: "Use least privilege access", fr: "Utiliser l'accès selon le moindre privilège" }
    - id: c
      text: { en: "Assume breach", fr: "Supposer une violation" }
answer: { optionId: c }
explanation:
  correct:
    en: "Assume breach means designing security as if an attacker will get in despite the other controls. End-to-end encryption makes intercepted data unreadable, and monitoring with analytics detects the intrusion quickly and limits the damage, alongside the segmentation of access."
    fr: "Supposer une violation, c'est concevoir la sécurité comme si un attaquant allait entrer malgré les autres contrôles. Le chiffrement de bout en bout rend illisibles les données interceptées, et la surveillance avec des outils d'analyse détecte rapidement l'intrusion et limite les dégâts, en complément de la segmentation des accès."
  options:
    a:
      en: "Verify explicitly is already covered by the multifactor authentication and the device compliance check performed at sign-in."
      fr: "Vérifier explicitement est déjà couvert par l'authentification multifacteur et le contrôle de conformité de l'appareil effectués à la connexion."
    b:
      en: "Least privilege access is already covered by the permissions limited to what each job requires."
      fr: "L'accès selon le moindre privilège est déjà couvert par les autorisations limitées à ce que chaque poste exige."
references:
  - title: Describe the Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/4-describe-zero-trust-model
  - title: Zero Trust as a security foundation
    url: https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
