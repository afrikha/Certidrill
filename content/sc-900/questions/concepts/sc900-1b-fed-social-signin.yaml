id: sc900-1b-fed-social-signin
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The online store of Adatum lets customers sign in with an existing Google or GitHub account instead of creating a new account. The store trusts these providers to authenticate the customers.

    Which concept does this describe?
  fr: |
    La boutique en ligne d'Adatum laisse les clients se connecter avec un compte Google ou GitHub existant au lieu de créer un nouveau compte. La boutique approuve ces fournisseurs pour authentifier les clients.

    Quel concept cela décrit-il ?
body:
  options:
    - id: a
      text: { en: "Federation", fr: "La fédération" }
    - id: b
      text: { en: "Multifactor authentication", fr: "L'authentification multifacteur" }
    - id: c
      text: { en: "Directory synchronization", fr: "La synchronisation d'annuaires" }
    - id: d
      text: { en: "Authorization", fr: "L'autorisation" }
answer: { optionId: a }
explanation:
  correct:
    en: "Federation gives access to services across organizational boundaries through a trust relationship between separate identity providers. When a consumer application accepts the accounts of a social identity provider, it trusts that provider to authenticate the user: this is a federated sign-in, and the customer needs no new account."
    fr: "La fédération donne accès à des services par-delà les frontières des organisations grâce à une relation d'approbation entre des fournisseurs d'identité distincts. Quand une application grand public accepte les comptes d'un fournisseur d'identité de réseau social, elle approuve ce fournisseur pour authentifier l'utilisateur : c'est une connexion fédérée, et le client n'a pas besoin d'un nouveau compte."
  options:
    b:
      en: "Multifactor authentication requires several factors at sign-in; the scenario describes who authenticates the customer, not how many factors are used."
      fr: "L'authentification multifacteur exige plusieurs facteurs à la connexion ; le scénario décrit qui authentifie le client, pas le nombre de facteurs utilisés."
    c:
      en: "Directory synchronization copies identities from one directory to another, for example from AD DS to Microsoft Entra ID; here no account is copied to the store."
      fr: "La synchronisation d'annuaires copie des identités d'un annuaire vers un autre, par exemple d'AD DS vers Microsoft Entra ID ; ici, aucun compte n'est copié vers la boutique."
    d:
      en: "Authorization decides what a signed-in customer may do in the store; it comes after the authentication that the scenario describes."
      fr: "L'autorisation décide de ce qu'un client connecté peut faire dans la boutique ; elle vient après l'authentification que décrit le scénario."
references:
  - title: Describe the concept of federation
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/6-describe-concept-federation
