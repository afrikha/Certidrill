id: sc900-1a-shared-retained-yn
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses IaaS, PaaS and SaaS services from the same cloud provider.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise des services IaaS, PaaS et SaaS du même fournisseur de cloud.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If Woodgrove Bank grants overly broad access to a cloud storage service and data is exposed, the misconfiguration is the cloud provider's responsibility."
        fr: "Si Woodgrove Bank accorde un accès trop large à un service de stockage cloud et que des données sont exposées, cette erreur de configuration relève de la responsabilité du fournisseur de cloud."
    - id: s2
      text:
        en: "Woodgrove Bank is responsible for protecting the laptops and phones that its employees use to connect to the SaaS services."
        fr: "Woodgrove Bank est responsable de la protection des ordinateurs portables et des téléphones que ses employés utilisent pour se connecter aux services SaaS."
    - id: s3
      text:
        en: "The cloud provider is responsible for the physical datacenter for the IaaS, PaaS and SaaS services alike."
        fr: "Le fournisseur de cloud est responsable du centre de données physique pour les services IaaS, PaaS comme SaaS."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Some responsibilities never leave the customer, whatever the service model: its data, its identities and access, its endpoints and the configuration choices it makes inside the service. A permissive access setting is therefore the customer's error even though the platform itself is secure. The physical datacenter, network and hosts are the provider's in all three cloud models."
    fr: "Certaines responsabilités ne quittent jamais le client, quel que soit le modèle de service : ses données, ses identités et accès, ses points de terminaison et les choix de configuration qu'il fait dans le service. Un paramètre d'accès trop permissif est donc l'erreur du client, même si la plateforme elle-même est sécurisée. Le centre de données, le réseau et les hôtes physiques relèvent du fournisseur dans les trois modèles cloud."
references:
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/2-describe-shared-responsibility-model
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
