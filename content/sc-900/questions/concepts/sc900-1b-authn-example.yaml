id: sc900-1b-authn-example
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which action is an example of authentication?
  fr: |
    Quelle action est un exemple d'authentification ?
body:
  options:
    - id: a
      text: { en: "An administrator assigns a role to a user.", fr: "Un administrateur attribue un rôle à un utilisateur." }
    - id: b
      text: { en: "A user unlocks a phone with a facial scan.", fr: "Un utilisateur déverrouille un téléphone par reconnaissance du visage." }
    - id: c
      text: { en: "A file server lets a user read a folder but not modify it.", fr: "Un serveur de fichiers laisse un utilisateur lire un dossier, mais pas le modifier." }
    - id: d
      text: { en: "An auditor reviews the sign-in logs of an application.", fr: "Un auditeur examine les journaux de connexion d'une application." }
answer: { optionId: b }
explanation:
  correct:
    en: "Authentication is the process of proving that you are who you say you are. Unlocking a phone with a facial scan is such a proof: the device checks a biometric credential before it lets the user in. It answers the question \"who are you?\", not \"what may you do?\"."
    fr: "L'authentification est le processus qui prouve que vous êtes bien qui vous dites être. Déverrouiller un téléphone par reconnaissance du visage est une telle preuve : l'appareil vérifie une information d'identification biométrique avant de laisser entrer l'utilisateur. Elle répond à la question « qui êtes-vous ? », pas à « que pouvez-vous faire ? »."
  options:
    a:
      en: "Assigning a role defines what a user will be allowed to do: it prepares authorization and doesn't verify anyone's identity."
      fr: "Attribuer un rôle définit ce qu'un utilisateur aura le droit de faire : cela prépare l'autorisation et ne vérifie l'identité de personne."
    c:
      en: "Allowing read access and refusing changes is an authorization decision, made for a user whose identity is already known."
      fr: "Permettre la lecture et refuser la modification est une décision d'autorisation, prise pour un utilisateur dont l'identité est déjà connue."
    d:
      en: "Reviewing sign-in logs is auditing: it tracks what happened after the fact and doesn't prove an identity."
      fr: "Examiner les journaux de connexion relève de l'audit : on suit ce qui s'est passé après coup, sans prouver une identité."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
