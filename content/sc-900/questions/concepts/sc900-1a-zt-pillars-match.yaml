id: sc900-1a-zt-pillars-match
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each requirement to the Zero Trust pillar to which it applies.

    To answer, drag the appropriate pillar to each requirement. Each pillar may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque exigence au pilier de la Confiance Zéro (Zero Trust) auquel elle s'applique.

    Pour répondre, faites glisser le pilier approprié vers chaque exigence. Chaque pilier peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ident, text: { en: "Identities", fr: "Identités" } }
    - { id: dev, text: { en: "Devices", fr: "Appareils" } }
    - { id: apps, text: { en: "Applications", fr: "Applications" } }
    - { id: data, text: { en: "Data", fr: "Données" } }
    - { id: infra, text: { en: "Infrastructure", fr: "Infrastructure" } }
    - { id: net, text: { en: "Networks", fr: "Réseaux" } }
  targets:
    - id: t1
      text: { en: "Classification, labeling and encryption, so that protection still applies outside the organization's environment", fr: "Classification, étiquetage et chiffrement, pour que la protection s'applique encore hors de l'environnement de l'organisation" }
    - id: t2
      text: { en: "Health and compliance monitoring of every endpoint that accesses resources, with access blocked or restricted when the check fails", fr: "Surveillance de l'intégrité et de la conformité de chaque point de terminaison qui accède aux ressources, avec accès bloqué ou restreint en cas d'échec du contrôle" }
    - id: t3
      text: { en: "Continuous assessment of versions and configuration, and just-in-time access to administrative interfaces", fr: "Évaluation continue des versions et de la configuration, et accès juste-à-temps aux interfaces d'administration" }
    - id: t4
      text: { en: "Segmentation, down to micro-segmentation, and end-to-end encryption of traffic", fr: "Segmentation, jusqu'à la micro-segmentation, et chiffrement du trafic de bout en bout" }
answer:
  mapping: { t1: data, t2: dev, t3: infra, t4: net }
explanation:
  correct:
    en: "Data must carry its own protection through classification, labeling and encryption. Devices are a large attack surface, so access decisions take their health and compliance into account. Infrastructure, on-premises or in the cloud, is assessed continuously and administered with just-in-time access. Networks are segmented, including inside each zone, with traffic encrypted and monitored."
    fr: "Les données doivent porter leur propre protection grâce à la classification, à l'étiquetage et au chiffrement. Les appareils forment une grande surface d'attaque : les décisions d'accès tiennent donc compte de leur intégrité et de leur conformité. L'infrastructure, locale ou cloud, est évaluée en continu et administrée avec un accès juste-à-temps. Les réseaux sont segmentés, y compris à l'intérieur de chaque zone, avec un trafic chiffré et surveillé."
  options:
    ident:
      en: "The identities pillar asks to verify users, services and devices with strong authentication, then to apply least privilege."
      fr: "Le pilier des identités demande de vérifier les utilisateurs, les services et les appareils par une authentification forte, puis d'appliquer le moindre privilège."
    apps:
      en: "The applications pillar asks to discover every application in use, including shadow IT, and to control their permissions."
      fr: "Le pilier des applications demande de découvrir toutes les applications utilisées, y compris l'informatique fantôme (shadow IT), et de contrôler leurs autorisations."
references:
  - title: Describe the Zero Trust model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/4-describe-zero-trust-model
