id: sc900-1a-enc-symmetric
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which cryptographic technique uses the same key to encrypt and to decrypt data?
  fr: |
    Quelle technique cryptographique utilise la même clé pour chiffrer et pour déchiffrer les données ?
body:
  options:
    - id: a
      text: { en: "Asymmetric encryption", fr: "Le chiffrement asymétrique" }
    - id: b
      text: { en: "Hashing", fr: "Le hachage" }
    - id: c
      text: { en: "Digital signature", fr: "La signature numérique" }
    - id: d
      text: { en: "Symmetric encryption", fr: "Le chiffrement symétrique" }
answer: { optionId: d }
explanation:
  correct:
    en: "Symmetric encryption uses a single key for both operations. It is fast and suited to large volumes of data; its difficulty is sharing that key securely between the parties."
    fr: "Le chiffrement symétrique utilise une seule clé pour les deux opérations. Il est rapide et adapté aux gros volumes de données ; sa difficulté est de partager cette clé de façon sûre entre les parties."
  options:
    a:
      en: "Asymmetric encryption uses a pair of different keys: what the public key encrypts, only the private key decrypts."
      fr: "Le chiffrement asymétrique utilise une paire de clés différentes : ce que la clé publique chiffre, seule la clé privée le déchiffre."
    b:
      en: "Hashing uses no key and is one-way: a hash is never decrypted."
      fr: "Le hachage n'utilise aucune clé et il est à sens unique : un hachage ne se déchiffre jamais."
    c:
      en: "A digital signature relies on a key pair: the private key signs and the public key verifies."
      fr: "Une signature numérique repose sur une paire de clés : la clé privée signe et la clé publique vérifie."
references:
  - title: Describe encryption and hashing
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/5-describe-encryption-hashing
