id: sc900-1a-idp-deprovisioning-pillar
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    When an employee leaves Proseware, the IT team deletes the employee's user account on the same day, as the company's identity lifecycle policy requires.

    Which pillar of an identity infrastructure does this task belong to?
  fr: |
    Lorsqu'un employé quitte Proseware, l'équipe informatique supprime son compte d'utilisateur le jour même, comme l'exige la stratégie de cycle de vie des identités de l'entreprise.

    De quel pilier d'une infrastructure d'identité cette tâche relève-t-elle ?
body:
  options:
    - id: a
      text: { en: "Administration", fr: "Administration" }
    - id: b
      text: { en: "Authentication", fr: "Authentification" }
    - id: c
      text: { en: "Authorization", fr: "Autorisation" }
    - id: d
      text: { en: "Auditing", fr: "Audit" }
answer: { optionId: a }
explanation:
  correct:
    en: "Administration covers the whole lifecycle of identities: how they are created (provisioning), updated when roles change and removed when a user leaves (deprovisioning), together with the policies that govern this management. Deleting a leaver's account is deprovisioning."
    fr: "L'administration couvre tout le cycle de vie des identités : leur création (approvisionnement), leur mise à jour quand les rôles changent et leur suppression quand un utilisateur part (déprovisionnement), ainsi que les stratégies qui encadrent cette gestion. Supprimer le compte d'un employé sortant est un déprovisionnement."
  options:
    b:
      en: "Authentication verifies at sign-in that an identity is who it claims to be; it doesn't manage the existence of accounts."
      fr: "L'authentification vérifie à la connexion qu'une identité est bien qui elle prétend être ; elle ne gère pas l'existence des comptes."
    c:
      en: "Authorization determines what an existing, authenticated identity may do; removing the identity itself is a lifecycle task."
      fr: "L'autorisation détermine ce qu'une identité existante et authentifiée peut faire ; supprimer l'identité elle-même est une tâche de cycle de vie."
    d:
      en: "Auditing records who did what, when and from where; it tracks actions but doesn't remove accounts."
      fr: "L'audit enregistre qui a fait quoi, quand et d'où ; il suit les actions, mais ne supprime pas de comptes."
references:
  - title: Define identity as the primary security perimeter
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/3-define-identity-primary-security-perimeter
