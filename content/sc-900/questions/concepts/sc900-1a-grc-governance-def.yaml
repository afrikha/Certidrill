id: sc900-1a-grc-governance-def
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which term designates the set of rules, practices and processes by which an organization directs and controls its activities?
  fr: |
    Quel terme désigne l'ensemble des règles, des pratiques et des processus par lesquels une organisation dirige et contrôle ses activités ?
body:
  options:
    - id: a
      text: { en: "Governance", fr: "La gouvernance" }
    - id: b
      text: { en: "Compliance", fr: "La conformité" }
    - id: c
      text: { en: "Risk management", fr: "La gestion des risques" }
    - id: d
      text: { en: "Data sovereignty", fr: "La souveraineté des données" }
answer: { optionId: a }
explanation:
  correct:
    en: "Governance is the framework an organization gives itself to direct and control what it does: for example the rules that define who can access which resources, who holds administrative privileges and what happens when a rule is broken. Risk management and compliance operate on that structure."
    fr: "La gouvernance est le cadre qu'une organisation se donne pour diriger et contrôler ce qu'elle fait : par exemple les règles qui définissent qui peut accéder à quelles ressources, qui détient des privilèges d'administration et ce qui se passe quand une règle est enfreinte. La gestion des risques et la conformité s'appuient sur cette structure."
  options:
    b:
      en: "Compliance is adhering to the laws, regulations, standards and policies that apply to the organization."
      fr: "La conformité consiste à respecter les lois, les réglementations, les normes et les stratégies qui s'appliquent à l'organisation."
    c:
      en: "Risk management is identifying, assessing and responding to threats or events that can affect the organization's objectives."
      fr: "La gestion des risques consiste à identifier, évaluer et traiter les menaces ou les événements qui peuvent affecter les objectifs de l'organisation."
    d:
      en: "Data sovereignty is the idea that data is subject to the laws of the country or region where it is collected, held or processed."
      fr: "La souveraineté des données est l'idée que les données sont soumises aux lois du pays ou de la région où elles sont collectées, conservées ou traitées."
references:
  - title: Describe governance, risk, and compliance (GRC) concepts
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/6-describe-compliance-concepts
