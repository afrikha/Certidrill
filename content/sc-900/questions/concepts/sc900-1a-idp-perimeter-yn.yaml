id: sc900-1a-idp-perimeter-yn
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about identity as the security perimeter, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'identité comme périmètre de sécurité, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A device, such as a laptop or an IoT sensor, can have an identity of its own."
        fr: "Un appareil, tel qu'un ordinateur portable ou un capteur IoT, peut avoir sa propre identité."
    - id: s2
      text:
        en: "When identity is the security perimeter, access decisions depend mainly on whether the request comes from inside the corporate network."
        fr: "Quand l'identité est le périmètre de sécurité, les décisions d'accès dépendent principalement du fait que la demande provient ou non de l'intérieur du réseau de l'entreprise."
    - id: s3
      text:
        en: "An attacker who steals the credentials of a cloud account can bypass the defenses of the network perimeter."
        fr: "Un attaquant qui vole les informations d'identification d'un compte cloud peut contourner les défenses du périmètre réseau."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "An identity is the set of attributes that characterize a person, a device or a software component, so devices have identities just as users do. With identity as the perimeter, the question is no longer where a request comes from but who or what makes it and whether it should be trusted. Firewalls and VPN gateways don't stop an attacker who signs in to a cloud service with stolen credentials, which is why the network perimeter alone is no longer reliable."
    fr: "Une identité est l'ensemble des attributs qui caractérisent une personne, un appareil ou un composant logiciel : les appareils ont donc des identités, tout comme les utilisateurs. Avec l'identité comme périmètre, la question n'est plus de savoir d'où vient une demande, mais qui ou quoi la fait et s'il faut lui faire confiance. Les pare-feux et les passerelles VPN n'arrêtent pas un attaquant qui se connecte à un service cloud avec des informations d'identification volées : c'est pourquoi le périmètre réseau seul n'est plus fiable."
references:
  - title: Define identity as the primary security perimeter
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/3-define-identity-primary-security-perimeter
