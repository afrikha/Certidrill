id: sc900-1a-did-layers-yn
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about defense in depth, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la défense en profondeur, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A defense-in-depth strategy relies on one strong control at the network perimeter to protect all the resources."
        fr: "Une stratégie de défense en profondeur repose sur un contrôle fort unique, placé au périmètre du réseau, pour protéger toutes les ressources."
    - id: s2
      text:
        en: "Closing the unused network ports of a virtual machine is a control of the compute layer."
        fr: "Fermer les ports réseau inutilisés d'une machine virtuelle est un contrôle de la couche de calcul."
    - id: s3
      text:
        en: "Validating user input to prevent SQL injection is a control of the data layer."
        fr: "Valider les entrées des utilisateurs pour empêcher l'injection SQL est un contrôle de la couche des données."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Defense in depth stacks several overlapping layers instead of depending on a single perimeter: if one layer is breached, the next one still stands in the way. Closing unnecessary ports, like patching, protects compute resources. Input validation against SQL injection or cross-site scripting belongs to the application layer; the data layer is about access control on the data, its encryption and its classification."
    fr: "La défense en profondeur empile plusieurs couches qui se recouvrent au lieu de dépendre d'un périmètre unique : si une couche est franchie, la suivante fait encore obstacle. Fermer les ports inutiles, comme appliquer les correctifs, protège les ressources de calcul. La validation des entrées contre l'injection SQL ou les scripts intersites relève de la couche d'application ; la couche des données concerne le contrôle d'accès aux données, leur chiffrement et leur classification."
references:
  - title: Describe defense in depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/3-describe-defense-depth
