id: sc900-1a-idp-workload-identity
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At Litware, a containerized billing service calls a database API every night. No person signs in when the service runs.

    Which type of identity represents this service?
  fr: |
    Chez Litware, un service de facturation conteneurisé appelle l'API d'une base de données chaque nuit. Personne ne se connecte lorsque le service s'exécute.

    Quel type d'identité représente ce service ?
body:
  options:
    - id: a
      text: { en: "A device identity", fr: "Une identité d'appareil" }
    - id: b
      text: { en: "An agent identity", fr: "Une identité d'agent" }
    - id: c
      text: { en: "A human identity", fr: "Une identité humaine" }
    - id: d
      text: { en: "A workload identity", fr: "Une identité de charge de travail" }
answer: { optionId: d }
explanation:
  correct:
    en: "Workload identities represent software: applications, services, containerized workloads and automated processes that access APIs, databases and other resources without a human user being involved. Like the other identities, they must be authenticated and authorized."
    fr: "Les identités de charge de travail représentent des logiciels : applications, services, charges de travail conteneurisées et processus automatisés qui accèdent à des API, des bases de données et d'autres ressources sans intervention d'un utilisateur humain. Comme les autres identités, elles doivent être authentifiées et autorisées."
  options:
    a:
      en: "Device identities represent hardware such as laptops, phones, tablets and IoT sensors."
      fr: "Les identités d'appareil représentent du matériel : ordinateurs portables, téléphones, tablettes et capteurs IoT."
    b:
      en: "Agent identities represent AI agents that act on behalf of users or processes; a scheduled billing service isn't an AI agent."
      fr: "Les identités d'agent représentent des agents IA qui agissent pour le compte d'utilisateurs ou de processus ; un service de facturation planifié n'est pas un agent IA."
    c:
      en: "Human identities represent people who sign in: employees, contractors, partners and customers."
      fr: "Les identités humaines représentent des personnes qui se connectent : employés, sous-traitants, partenaires et clients."
references:
  - title: Define identity as the primary security perimeter
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/3-define-identity-primary-security-perimeter
