id: sc900-1b-authn-mfa-combos
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso requires multifactor authentication for every sign-in.

    Which two sign-in methods meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exige l'authentification multifacteur à chaque connexion.

    Quelles sont les deux méthodes de connexion qui répondent à cette exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A password, then a PIN", fr: "Un mot de passe, puis un code PIN" } }
    - { id: b, text: { en: "A password, then the approval of a notification on the user's phone", fr: "Un mot de passe, puis l'approbation d'une notification sur le téléphone de l'utilisateur" } }
    - { id: c, text: { en: "A fingerprint, then a facial scan", fr: "Une empreinte digitale, puis une reconnaissance du visage" } }
    - { id: d, text: { en: "A hardware security key, then a fingerprint", fr: "Une clé de sécurité matérielle, puis une empreinte digitale" } }
    - { id: e, text: { en: "A password, then the answer to a security question", fr: "Un mot de passe, puis la réponse à une question de sécurité" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Multifactor authentication requires two or more factors from different categories: something you know, something you have, something you are. A password (know) with a notification approved on a phone (have), and a hardware security key (have) with a fingerprint (are), each combine two categories. An attacker would have to compromise two independent credentials."
    fr: "L'authentification multifacteur exige au moins deux facteurs de catégories différentes : quelque chose que vous savez, que vous possédez, que vous êtes. Un mot de passe (savoir) avec une notification approuvée sur un téléphone (posséder), et une clé de sécurité matérielle (posséder) avec une empreinte digitale (être), combinent chacun deux catégories. Un attaquant devrait compromettre deux informations d'identification indépendantes."
  options:
    a:
      en: "A password and a PIN are both something you know: two secrets of the same category remain a single factor."
      fr: "Un mot de passe et un code PIN sont tous deux quelque chose que vous savez : deux secrets de la même catégorie restent un seul facteur."
    c:
      en: "A fingerprint and a facial scan are both something you are: the two checks belong to the same category."
      fr: "Une empreinte digitale et une reconnaissance du visage sont toutes deux quelque chose que vous êtes : les deux contrôles appartiennent à la même catégorie."
    e:
      en: "A security question is something you know, like the password: the category is the same."
      fr: "Une question de sécurité est quelque chose que vous savez, comme le mot de passe : la catégorie est la même."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
