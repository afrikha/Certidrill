id: sc900-1b-dir-concepts-sentence
objective: "1.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A structured repository that stores information about the objects of a network, such as users, devices and groups, is [[repo]].

      Active Directory was designed to manage [[net]] networks.

      A configuration in which AD DS is connected to Microsoft Entra ID so that identities are synchronized is called [[conf]].
    fr: |
      Un référentiel structuré qui stocke des informations sur les objets d'un réseau, comme les utilisateurs, les appareils et les groupes, est [[repo]].

      Active Directory a été conçu pour gérer des réseaux [[net]].

      Une configuration dans laquelle AD DS est connecté à Microsoft Entra ID pour que les identités soient synchronisées s'appelle [[conf]].
  slots:
    - id: repo
      options:
        - { id: token, text: { en: "a security token", fr: "un jeton de sécurité" } }
        - { id: dir, text: { en: "a directory", fr: "un annuaire" } }
        - { id: dc, text: { en: "a domain controller", fr: "un contrôleur de domaine" } }
    - id: net
      options:
        - { id: onprem, text: { en: "on-premises, domain-based", fr: "locaux, organisés en domaines" } }
        - { id: cloud, text: { en: "cloud-only", fr: "cloud uniquement" } }
        - { id: p2p, text: { en: "peer-to-peer", fr: "pair à pair" } }
    - id: conf
      options:
        - { id: sso, text: { en: "single sign-on", fr: "l'authentification unique" } }
        - { id: mfa, text: { en: "multifactor authentication", fr: "l'authentification multifacteur" } }
        - { id: hybrid, text: { en: "hybrid identity", fr: "l'identité hybride" } }
answer:
  values: { repo: dir, net: onprem, conf: hybrid }
explanation:
  correct:
    en: "A directory is a structured repository of information about network objects; a directory service stores that data and makes it available to users, administrators, applications and services. Active Directory, first released with Windows 2000 Server, was designed for on-premises, domain-based networks. Organizations that run AD DS can connect it to Microsoft Entra ID so that identities are synchronized: this is hybrid identity."
    fr: "Un annuaire est un référentiel structuré d'informations sur les objets d'un réseau ; un service d'annuaire stocke ces données et les met à la disposition des utilisateurs, des administrateurs, des applications et des services. Active Directory, publié pour la première fois avec Windows 2000 Server, a été conçu pour les réseaux locaux organisés en domaines. Les organisations qui exploitent AD DS peuvent le connecter à Microsoft Entra ID pour que les identités soient synchronisées : c'est l'identité hybride."
  options:
    dc:
      en: "A domain controller is a server that runs AD DS and hosts the directory; it isn't the repository of information itself."
      fr: "Un contrôleur de domaine est un serveur qui exécute AD DS et héberge l'annuaire ; ce n'est pas le référentiel d'informations lui-même."
    token:
      en: "A security token is issued by an identity provider after a sign-in and expires after a set period."
      fr: "Un jeton de sécurité est émis par un fournisseur d'identité après une connexion et expire au bout d'une durée définie."
    sso:
      en: "Single sign-on means signing in once to access several applications; it doesn't name the connection between AD DS and Microsoft Entra ID."
      fr: "L'authentification unique consiste à se connecter une fois pour accéder à plusieurs applications ; elle ne désigne pas la connexion entre AD DS et Microsoft Entra ID."
references:
  - title: Describe the concept of directory services and Active Directory
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/5-describe-concept-of-directory-services-active-directory
