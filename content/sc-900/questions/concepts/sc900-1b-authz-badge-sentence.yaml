id: sc900-1b-authz-badge-sentence
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A guard checks the photo badge of an employee at the entrance of a building: this corresponds to [[entrance]].

      The badge then opens the employee's office but not the server room: this corresponds to [[doors]].

      In an information system, the second check bases its decisions on [[basis]].
    fr: |
      Un agent de sécurité vérifie le badge avec photo d'un employé à l'entrée d'un immeuble : cela correspond à [[entrance]].

      Le badge ouvre ensuite le bureau de l'employé, mais pas la salle des serveurs : cela correspond à [[doors]].

      Dans un système d'information, le second contrôle fonde ses décisions sur [[basis]].
  slots:
    - id: entrance
      options:
        - { id: authz, text: { en: "authorization", fr: "l'autorisation" } }
        - { id: audit, text: { en: "auditing", fr: "l'audit" } }
        - { id: authn, text: { en: "authentication", fr: "l'authentification" } }
    - id: doors
      options:
        - { id: authz, text: { en: "authorization", fr: "l'autorisation" } }
        - { id: audit, text: { en: "auditing", fr: "l'audit" } }
        - { id: authn, text: { en: "authentication", fr: "l'authentification" } }
    - id: basis
      options:
        - { id: creds, text: { en: "credentials, such as a password or a fingerprint", fr: "des informations d'identification, comme un mot de passe ou une empreinte digitale" } }
        - { id: roles, text: { en: "roles, permissions and attributes", fr: "des rôles, des autorisations et des attributs" } }
        - { id: trust, text: { en: "trust relationships between identity providers", fr: "des relations d'approbation entre fournisseurs d'identité" } }
answer:
  values: { entrance: authn, doors: authz, basis: roles }
explanation:
  correct:
    en: "Checking the badge at the entrance proves who the employee is: authentication, which always comes first. Opening some doors and not others decides what that employee may do: authorization, which follows a successful authentication. Authorization relies on roles (administrator, manager), permissions (read, write, delete) and attributes (department, location)."
    fr: "Vérifier le badge à l'entrée prouve qui est l'employé : c'est l'authentification, qui vient toujours en premier. Ouvrir certaines portes et pas d'autres décide de ce que cet employé peut faire : c'est l'autorisation, qui suit une authentification réussie. L'autorisation s'appuie sur des rôles (administrateur, responsable), des autorisations (lire, écrire, supprimer) et des attributs (service, emplacement)."
  options:
    audit:
      en: "Auditing tracks who did what, when and from where; it neither proves an identity nor grants access."
      fr: "L'audit suit qui a fait quoi, quand et d'où ; il ne prouve pas une identité et n'accorde aucun accès."
    creds:
      en: "Credentials are what authentication verifies, not what authorization evaluates."
      fr: "Les informations d'identification sont ce que l'authentification vérifie, pas ce que l'autorisation évalue."
    trust:
      en: "Trust relationships between identity providers are the basis of federation."
      fr: "Les relations d'approbation entre fournisseurs d'identité sont le fondement de la fédération."
references:
  - title: Define authentication and authorization
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization
