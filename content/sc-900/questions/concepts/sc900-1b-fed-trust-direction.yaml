id: sc900-1b-fed-trust-direction
objective: "1.2.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso configures its identity provider to trust the identity provider of Fabrikam. No other trust relationship is configured.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso configure son fournisseur d'identité pour approuver le fournisseur d'identité de Fabrikam. Aucune autre relation d'approbation n'est configurée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Fabrikam users can access Contoso resources by authenticating with the identity provider of Fabrikam."
        fr: "Les utilisateurs de Fabrikam peuvent accéder aux ressources de Contoso en s'authentifiant auprès du fournisseur d'identité de Fabrikam."
    - id: s2
      text:
        en: "Contoso users can access Fabrikam resources by authenticating with the identity provider of Contoso."
        fr: "Les utilisateurs de Contoso peuvent accéder aux ressources de Fabrikam en s'authentifiant auprès du fournisseur d'identité de Contoso."
    - id: s3
      text:
        en: "Fabrikam users must receive a second username and password from Contoso to access Contoso resources."
        fr: "Les utilisateurs de Fabrikam doivent recevoir de Contoso un second nom d'utilisateur et un second mot de passe pour accéder aux ressources de Contoso."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Contoso trusts Fabrikam's identity provider, so Contoso accepts the authentication that Fabrikam performs: Fabrikam users reach Contoso resources with the credentials they already have, without a second account. A trust relationship isn't automatically bidirectional: Fabrikam doesn't trust Contoso's identity provider, so Contoso users get no access to Fabrikam resources until a trust in the other direction is explicitly configured."
    fr: "Contoso approuve le fournisseur d'identité de Fabrikam, donc Contoso accepte l'authentification effectuée par Fabrikam : les utilisateurs de Fabrikam atteignent les ressources de Contoso avec les informations d'identification qu'ils ont déjà, sans second compte. Une relation d'approbation n'est pas automatiquement bidirectionnelle : Fabrikam n'approuve pas le fournisseur d'identité de Contoso, donc les utilisateurs de Contoso n'ont aucun accès aux ressources de Fabrikam tant qu'une approbation dans l'autre sens n'est pas configurée explicitement."
references:
  - title: Describe the concept of federation
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/6-describe-concept-federation
