id: sc900-1a-hash-salt-purpose
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web application stores the hash of each user's password. The developers add a unique random value, called a salt, to each password before hashing it.

    What is the purpose of the salt?
  fr: |
    Une application web stocke le hachage du mot de passe de chaque utilisateur. Les développeurs ajoutent une valeur aléatoire unique, appelée sel, à chaque mot de passe avant de le hacher.

    À quoi sert le sel ?
body:
  options:
    - id: a
      text: { en: "To let administrators recover a forgotten password from its hash", fr: "À permettre aux administrateurs de retrouver un mot de passe oublié à partir de son hachage" }
    - id: b
      text: { en: "To encrypt each hash with a key that only the application holds", fr: "À chiffrer chaque hachage avec une clé que seule l'application détient" }
    - id: c
      text: { en: "To make two identical passwords produce two different hashes", fr: "À faire en sorte que deux mots de passe identiques produisent deux hachages différents" }
    - id: d
      text: { en: "To reduce the length of the hashes stored in the database", fr: "À réduire la longueur des hachages stockés dans la base de données" }
answer: { optionId: c }
explanation:
  correct:
    en: "Hashing is deterministic, so without a salt two users with the same password have the same hash, and attackers can look hashes up in precomputed tables of common passwords. A different random salt for each password gives different hashes and makes those precomputed tables useless."
    fr: "Le hachage est déterministe : sans sel, deux utilisateurs qui ont le même mot de passe ont le même hachage, et les attaquants peuvent rechercher les hachages dans des tables précalculées de mots de passe courants. Un sel aléatoire différent pour chaque mot de passe donne des hachages différents et rend ces tables précalculées inutilisables."
  options:
    a:
      en: "Hashing stays one-way with or without a salt: the password can't be recovered from the hash."
      fr: "Le hachage reste à sens unique, avec ou sans sel : le mot de passe ne peut pas être retrouvé à partir du hachage."
    b:
      en: "A salt is not a key and salting is not encryption; hashing uses no key."
      fr: "Un sel n'est pas une clé et le salage n'est pas du chiffrement ; le hachage n'utilise aucune clé."
    d:
      en: "A hash has a fixed length set by the algorithm; the salt doesn't change it."
      fr: "Un hachage a une longueur fixe déterminée par l'algorithme ; le sel ne la modifie pas."
references:
  - title: Describe encryption and hashing
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/5-describe-encryption-hashing
