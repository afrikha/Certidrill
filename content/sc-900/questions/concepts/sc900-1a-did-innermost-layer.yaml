id: sc900-1a-did-innermost-layer
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a defense-in-depth strategy, which layer is the innermost one, which all the other layers ultimately protect?
  fr: |
    Dans une stratégie de défense en profondeur, quelle est la couche la plus interne, celle que toutes les autres couches protègent en fin de compte ?
body:
  options:
    - id: a
      text: { en: "Physical security", fr: "Sécurité physique" }
    - id: b
      text: { en: "Perimeter", fr: "Périmètre" }
    - id: c
      text: { en: "Compute", fr: "Calcul" }
    - id: d
      text: { en: "Data", fr: "Données" }
answer: { optionId: d }
explanation:
  correct:
    en: "The layers go from physical security on the outside to data at the center. Data is the innermost layer because it is what attackers are after; it is protected by access control, encryption and classification."
    fr: "Les couches vont de la sécurité physique, à l'extérieur, jusqu'aux données, au centre. Les données constituent la couche la plus interne, car ce sont elles que visent les attaquants ; elles sont protégées par le contrôle d'accès, le chiffrement et la classification."
  options:
    a:
      en: "Physical security is the outermost layer: it limits access to the buildings and the hardware."
      fr: "La sécurité physique est la couche la plus externe : elle limite l'accès aux bâtiments et au matériel."
    b:
      en: "The perimeter layer protects the boundary of the network, far from the center of the model."
      fr: "La couche de périmètre protège la frontière du réseau, loin du centre du modèle."
    c:
      en: "The compute layer protects virtual machines and containers; the application and data layers lie further inside."
      fr: "La couche de calcul protège les machines virtuelles et les conteneurs ; les couches d'application et de données se trouvent plus à l'intérieur."
references:
  - title: Describe defense in depth
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/3-describe-defense-depth
