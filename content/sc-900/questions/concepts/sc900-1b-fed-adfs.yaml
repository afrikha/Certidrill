id: sc900-1b-fed-adfs
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware stores its user accounts in an on-premises Active Directory. Litware wants these users to access cloud applications.

    Authentication must be performed by a server in the datacenter of Litware, which issues the tokens that the cloud services accept.

    What should Litware deploy?
  fr: |
    Litware stocke ses comptes d'utilisateur dans un Active Directory local. Litware veut que ces utilisateurs accèdent à des applications cloud.

    L'authentification doit être effectuée par un serveur du centre de données de Litware, qui émet les jetons que les services cloud acceptent.

    Que doit déployer Litware ?
body:
  options:
    - id: a
      text: "Active Directory Certificate Services (AD CS)"
    - id: b
      text: "Active Directory Federation Services (AD FS)"
    - id: c
      text: "Active Directory Domain Services (AD DS)"
    - id: d
      text: "Microsoft Entra Connect"
answer: { optionId: b }
explanation:
  correct:
    en: "Active Directory Federation Services (AD FS) is a Windows Server role that lets an organization share identity information securely with external services. On-premises Active Directory users authenticate against the on-premises AD FS server, which issues tokens that the cloud services accept. All user authentication therefore takes place on-premises."
    fr: "Active Directory Federation Services (AD FS) est un rôle Windows Server qui permet à une organisation de partager de façon sécurisée des informations d'identité avec des services externes. Les utilisateurs de l'Active Directory local s'authentifient auprès du serveur AD FS local, qui émet des jetons que les services cloud acceptent. Toute l'authentification des utilisateurs a donc lieu en local."
  options:
    a:
      en: "AD CS is the Windows Server role that issues and manages public key infrastructure (PKI) certificates; it doesn't issue sign-in tokens to cloud services."
      fr: "AD CS est le rôle Windows Server qui émet et gère des certificats d'infrastructure à clé publique (PKI) ; il n'émet pas de jetons de connexion pour des services cloud."
    c:
      en: "AD DS is the directory that Litware already runs: it authenticates users to on-premises applications but doesn't natively authenticate them to cloud applications."
      fr: "AD DS est l'annuaire que Litware exploite déjà : il authentifie les utilisateurs auprès des applications locales, mais ne les authentifie pas nativement auprès des applications cloud."
    d:
      en: "Microsoft Entra Connect synchronizes on-premises identities to Microsoft Entra ID; it isn't the server that authenticates users and issues the tokens."
      fr: "Microsoft Entra Connect synchronise les identités locales vers Microsoft Entra ID ; ce n'est pas le serveur qui authentifie les utilisateurs et émet les jetons."
references:
  - title: Describe the concept of federation
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/6-describe-concept-federation
  - title: What is federation with Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/whatis-fed
