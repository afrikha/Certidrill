id: sc900-1a-shared-migration-complete
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware moves a workload from its own datacenter to the cloud in two steps.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déplace une charge de travail de son propre centre de données vers le cloud en deux étapes.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When Litware moves the workload from its on-premises servers to virtual machines in the cloud (IaaS), responsibility for [[s1]] passes to the cloud provider.

      When Litware later moves the workload from the virtual machines to a platform as a service (PaaS) offering, responsibility for [[s2]] also passes to the cloud provider.
    fr: |
      Lorsque Litware déplace la charge de travail de ses serveurs locaux vers des machines virtuelles dans le cloud (IaaS), la responsabilité [[s1]] passe au fournisseur de cloud.

      Lorsque Litware déplace ensuite la charge de travail des machines virtuelles vers une offre PaaS (platform as a service), la responsabilité [[s2]] passe elle aussi au fournisseur de cloud.
  slots:
    - id: s1
      options:
        - { id: os, text: { en: "the operating system", fr: "du système d'exploitation" } }
        - { id: accounts, text: { en: "the user accounts", fr: "des comptes d'utilisateur" } }
        - { id: hosts, text: { en: "the physical hosts", fr: "des hôtes physiques" } }
        - { id: data, text: { en: "the application data", fr: "des données de l'application" } }
    - id: s2
      options:
        - { id: code, text: { en: "the application code", fr: "du code de l'application" } }
        - { id: os, text: { en: "the operating system", fr: "du système d'exploitation" } }
        - { id: accounts, text: { en: "the user accounts", fr: "des comptes d'utilisateur" } }
        - { id: data, text: { en: "the application data", fr: "des données de l'application" } }
answer:
  values: { s1: hosts, s2: os }
explanation:
  correct:
    en: "Leaving the on-premises datacenter for IaaS hands the physical layers to the provider: the datacenter, the network hardware and the hosts. The operating system of the virtual machines is still the customer's in IaaS; it only becomes the provider's with PaaS, together with the runtime environment."
    fr: "Quitter le centre de données local pour l'IaaS confie les couches physiques au fournisseur : le centre de données, le matériel réseau et les hôtes. Le système d'exploitation des machines virtuelles reste à la charge du client en IaaS ; il ne passe au fournisseur qu'avec le PaaS, en même temps que l'environnement d'exécution."
  options:
    accounts:
      en: "User accounts and their access stay with the customer in every model."
      fr: "Les comptes d'utilisateur et leurs accès restent à la charge du client dans tous les modèles."
    data:
      en: "The customer always remains responsible for its data."
      fr: "Le client reste toujours responsable de ses données."
    code:
      en: "With PaaS, the customer still secures the code of the application that it deploys."
      fr: "En PaaS, le client sécurise toujours le code de l'application qu'il déploie."
references:
  - title: Describe the shared responsibility model
    url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/2-describe-shared-responsibility-model
  - title: Shared responsibility in the cloud
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
