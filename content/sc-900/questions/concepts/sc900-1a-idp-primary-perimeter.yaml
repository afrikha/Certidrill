id: sc900-1a-idp-primary-perimeter
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Employees of Contoso work from home on personal devices and use SaaS applications that are hosted outside the corporate network.

    In this context, what serves as the primary security perimeter?
  fr: |
    Les employés de Contoso travaillent à domicile sur des appareils personnels et utilisent des applications SaaS hébergées en dehors du réseau de l'entreprise.

    Dans ce contexte, qu'est-ce qui sert de périmètre de sécurité principal ?
body:
  options:
    - id: a
      text: { en: "The corporate firewall", fr: "Le pare-feu de l'entreprise" }
    - id: b
      text: { en: "Identity", fr: "L'identité" }
    - id: c
      text: { en: "The VPN gateway", fr: "La passerelle VPN" }
    - id: d
      text: { en: "The office network", fr: "Le réseau des bureaux" }
answer: { optionId: b }
explanation:
  correct:
    en: "When users, devices and applications are outside the corporate network, the organization can no longer rely on controlling what is on its network. Identity becomes the boundary: each access decision starts by verifying who or what makes the request and what it is authorized to do."
    fr: "Quand les utilisateurs, les appareils et les applications se trouvent hors du réseau de l'entreprise, l'organisation ne peut plus compter sur le contrôle de ce qui se trouve sur son réseau. L'identité devient la frontière : chaque décision d'accès commence par vérifier qui ou quoi fait la demande et ce que cette identité est autorisée à faire."
  options:
    a:
      en: "A firewall protects the edge of the corporate network, which this traffic never crosses."
      fr: "Un pare-feu protège la bordure du réseau de l'entreprise, que ce trafic ne traverse jamais."
    c:
      en: "A VPN gateway is part of the traditional network perimeter; SaaS applications are reached directly over the internet."
      fr: "Une passerelle VPN fait partie du périmètre réseau traditionnel ; les applications SaaS sont jointes directement par Internet."
    d:
      en: "The office network no longer contains the users, the devices or the applications of this scenario."
      fr: "Le réseau des bureaux ne contient plus ni les utilisateurs, ni les appareils, ni les applications de ce scénario."
references:
  - title: Define identity as the primary security perimeter
    url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/3-define-identity-primary-security-perimeter
