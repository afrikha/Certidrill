id: sc900-2a-auth-qr-code
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The frontline workers of Wingtip Toys share mobile devices in the stores. They must sign in without typing a username or a password, by scanning a code printed on their badge and entering a PIN.

    Which authentication method should Wingtip Toys enable?
  fr: |
    Les employés de première ligne de Wingtip Toys partagent des appareils mobiles dans les magasins. Ils doivent se connecter sans saisir de nom d'utilisateur ni de mot de passe, en scannant un code imprimé sur leur badge et en saisissant un code PIN.

    Quelle méthode d'authentification Wingtip Toys doit-elle activer ?
body:
  options:
    - { id: a, text: { en: "Voice call verification", fr: "La vérification par appel vocal" } }
    - { id: b, text: { en: "Certificate-based authentication", fr: "L'authentification basée sur un certificat" } }
    - { id: c, text: { en: "Software OATH tokens", fr: "Les jetons OATH logiciels" } }
    - { id: d, text: { en: "QR code authentication", fr: "L'authentification par code QR" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      QR code authentication is designed mainly for frontline workers who use shared devices. The user scans a unique QR code, which can be printed on a badge, and enters a numeric PIN, so no username or password is typed. It is a primary sign-in method only: it can't serve as a second factor.
    fr: |
      L'authentification par code QR est conçue principalement pour les employés de première ligne qui utilisent des appareils partagés. L'utilisateur scanne un code QR unique, qui peut être imprimé sur un badge, et saisit un code PIN numérique : aucun nom d'utilisateur ni mot de passe n'est saisi. C'est une méthode de connexion principale uniquement : elle ne peut pas servir de second facteur.
  options:
    a:
      en: "A voice call is a secondary method only: an automated call asks the user to press a key, after another method has been used to sign in."
      fr: "L'appel vocal est une méthode secondaire uniquement : un appel automatisé demande à l'utilisateur d'appuyer sur une touche, après une connexion faite avec une autre méthode."
    b:
      en: "Certificate-based authentication relies on an X.509 certificate issued to the user, not on a code printed on a badge."
      fr: "L'authentification basée sur un certificat repose sur un certificat X.509 délivré à l'utilisateur, pas sur un code imprimé sur un badge."
    c:
      en: "Software OATH tokens generate one-time codes in an authenticator app, as a second factor after a primary sign-in."
      fr: "Les jetons OATH logiciels génèrent des codes à usage unique dans une application d'authentification, comme second facteur après une connexion principale."
references:
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
  - title: Authentication methods in Microsoft Entra ID - QR code authentication method
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-qr-code
