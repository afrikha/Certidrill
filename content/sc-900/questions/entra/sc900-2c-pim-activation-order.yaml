id: sc900-2c-pim-activation-order
objective: "2.4.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso manages Microsoft Entra roles with Privileged Identity Management (PIM). The Exchange Administrator role requires an approval to be activated. A user named User1, who has no role, must be able to use the Exchange Administrator role for a maintenance task tonight, without holding the role permanently.

    Which three actions occur in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso gère les rôles Microsoft Entra avec Privileged Identity Management (PIM). Le rôle Exchange Administrator exige une approbation pour être activé. Un utilisateur nommé User1, qui n'a aucun rôle, doit pouvoir utiliser le rôle Exchange Administrator pour une tâche de maintenance ce soir, sans détenir le rôle en permanence.

    Quelles sont les trois actions qui se succèdent dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: approve, text: { en: "An approver approves the request of User1.", fr: "Un approbateur approuve la demande de User1." } }
    - { id: active, text: { en: "An administrator gives User1 a permanent active assignment for the role.", fr: "Un administrateur donne à User1 une attribution active permanente pour le rôle." } }
    - { id: activate, text: { en: "User1 requests the activation of the role.", fr: "User1 demande l'activation du rôle." } }
    - { id: review, text: { en: "User1 completes an access review of the role.", fr: "User1 effectue une révision d'accès du rôle." } }
    - { id: eligible, text: { en: "An administrator makes User1 eligible for the role.", fr: "Un administrateur rend User1 éligible pour le rôle." } }
    - { id: dismiss, text: { en: "An administrator dismisses the user risk of User1.", fr: "Un administrateur rejette le risque utilisateur de User1." } }
answer:
  sequence: [ eligible, activate, approve ]
explanation:
  correct:
    en: "An administrator first creates an eligible assignment, which gives User1 the right to activate the role but no privilege yet. When the task comes, User1 requests the activation. Because the role requires an approval, the request stays pending until an approver accepts it; User1 is then active for the configured duration."
    fr: "Un administrateur crée d'abord une attribution éligible, qui donne à User1 le droit d'activer le rôle mais encore aucun privilège. Le moment venu, User1 demande l'activation. Comme le rôle exige une approbation, la demande reste en attente jusqu'à ce qu'un approbateur l'accepte ; User1 est alors actif pour la durée configurée."
  options:
    active: { en: "A permanent active assignment gives the role all the time, which the requirement excludes.", fr: "Une attribution active permanente donne le rôle en permanence, ce que l'exigence exclut." }
    review: { en: "An access review recertifies existing assignments; it isn't a step of an activation.", fr: "Une révision d'accès recertifie des attributions existantes ; ce n'est pas une étape d'une activation." }
    dismiss: { en: "Dismissing a user risk is an ID Protection action, unrelated to the activation of a role.", fr: "Rejeter un risque utilisateur est une action de Protection Microsoft Entra ID, sans rapport avec l'activation d'un rôle." }
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
  - title: Activate a Microsoft Entra role in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-activate-role
