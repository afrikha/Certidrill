id: sc900-2b-pwd-custom-banned-list
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has Microsoft Entra ID P1 licenses.

    Tailspin Toys wants to prevent its users from choosing passwords that contain the name of the company or the names of its products.

    What should Tailspin Toys configure?
  fr: |
    Tailspin Toys dispose de licences Microsoft Entra ID P1.

    Tailspin Toys veut empêcher ses utilisateurs de choisir des mots de passe qui contiennent le nom de l'entreprise ou les noms de ses produits.

    Que doit configurer Tailspin Toys ?
body:
  options:
    - id: a
      text: { en: "The global banned password list", fr: "La liste globale de mots de passe interdits" }
    - id: b
      text: { en: "A custom banned password list", fr: "Une liste personnalisée de mots de passe interdits" }
    - id: c
      text: { en: "Smart lockout", fr: "Le verrouillage intelligent" }
    - id: d
      text: { en: "Self-service password reset", fr: "La réinitialisation de mot de passe en libre-service" }
answer: { optionId: b }
explanation:
  correct:
    en: "A custom banned password list holds terms that are specific to the organization, such as brand names, product names and locations. Microsoft Entra Password Protection combines these terms with the global list and checks every password that is changed or reset against them."
    fr: "Une liste personnalisée de mots de passe interdits contient des termes propres à l'organisation, comme des noms de marques, des noms de produits et des lieux. La protection par mot de passe Microsoft Entra combine ces termes avec la liste globale et vérifie par rapport à eux chaque mot de passe changé ou réinitialisé."
  options:
    a:
      en: "The global banned password list is maintained by Microsoft and applied automatically; an organization can't add its own terms to it."
      fr: "La liste globale de mots de passe interdits est tenue par Microsoft et appliquée automatiquement ; une organisation ne peut pas y ajouter ses propres termes."
    c:
      en: "Smart lockout locks out attackers who try to guess a password; it doesn't control which passwords users choose."
      fr: "Le verrouillage intelligent bloque les attaquants qui tentent de deviner un mot de passe ; il ne contrôle pas les mots de passe que les utilisateurs choisissent."
    d:
      en: "Self-service password reset lets users change or reset their password themselves; it doesn't define which terms are banned."
      fr: "La réinitialisation de mot de passe en libre-service laisse les utilisateurs changer ou réinitialiser eux-mêmes leur mot de passe ; elle ne définit pas les termes interdits."
references:
  - title: Eliminate bad passwords using Microsoft Entra Password Protection
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad
