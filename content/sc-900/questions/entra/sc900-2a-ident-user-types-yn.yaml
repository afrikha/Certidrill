id: sc900-2a-ident-user-types-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about user identities in Microsoft Entra ID, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les identités d'utilisateur dans Microsoft Entra ID, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: By default, guests have the same privileges as members.
        fr: Par défaut, les invités ont les mêmes privilèges que les membres.
    - id: s2
      text:
        en: An internal guest signs in with the credentials of their home organization.
        fr: Un invité interne se connecte avec les informations d'identification de son organisation d'origine.
    - id: s3
      text:
        en: An external member authenticates with an external account and has member-level access to the resources of your tenant.
        fr: Un membre externe s'authentifie avec un compte externe et dispose d'un accès de niveau membre aux ressources de votre locataire.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      The user type, Member or Guest, describes the relationship of the user to the tenant: by default, guests have limited privileges relative to members. Internal or external describes where the user authenticates: an internal guest has an account in your own tenant, whereas B2B collaboration users sign in with their own credentials. An external member authenticates externally but has the Member user type, which is common in multi-tenant organizations.
    fr: |
      Le type d'utilisateur, Membre ou Invité, décrit la relation de l'utilisateur avec le locataire : par défaut, les invités ont des privilèges limités par rapport aux membres. Interne ou externe décrit l'endroit où l'utilisateur s'authentifie : un invité interne a un compte dans votre propre locataire, alors que les utilisateurs de la collaboration B2B se connectent avec leurs propres informations d'identification. Un membre externe s'authentifie à l'extérieur mais a le type d'utilisateur Membre, ce qui est courant dans les organisations multilocataires.
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
