id: sc900-2a-ident-workload-sentences
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A workload identity is an identity that is assigned to [[what]] so that it can authenticate to and access other services and resources.

      A service principal is essentially an identity for [[sp]].

      A managed identity is [[mi]] whose credentials are managed automatically in Microsoft Entra ID.
    fr: |
      Une identité de charge de travail est une identité attribuée à [[what]] pour lui permettre de s'authentifier et d'accéder à d'autres services et ressources.

      Un principal de service est pour l'essentiel l'identité d'[[sp]].

      Une identité managée est [[mi]] dont les informations d'identification sont gérées automatiquement dans Microsoft Entra ID.
  slots:
    - id: what
      options:
        - { id: device, text: { en: "a physical device", fr: "un appareil physique" } }
        - { id: software, text: { en: "a software workload", fr: "une charge de travail logicielle" } }
        - { id: partner, text: { en: "an external partner", fr: "un partenaire externe" } }
    - id: sp
      options:
        - { id: app, text: { en: "an application", fr: "une application" } }
        - { id: group, text: { en: "a security group", fr: "un groupe de sécurité" } }
        - { id: admin, text: { en: "an administrator", fr: "un administrateur" } }
    - id: mi
      options:
        - { id: guest, text: { en: "a type of guest user", fr: "un type d'utilisateur invité" } }
        - { id: devid, text: { en: "a type of device identity", fr: "un type d'identité d'appareil" } }
        - { id: sp, text: { en: "a type of service principal", fr: "un type de principal de service" } }
answer:
  values: { what: software, sp: app, mi: sp }
explanation:
  correct:
    en: |
      A workload identity is assigned to a software workload, such as an application, a service, a script or a container, so that it can authenticate and access other services. In Microsoft Entra, workload identities are applications, service principals and managed identities. A service principal is the identity of an application in a tenant, and a managed identity is a service principal whose credentials Microsoft Entra ID manages for the developers.
    fr: |
      Une identité de charge de travail est attribuée à une charge de travail logicielle, comme une application, un service, un script ou un conteneur, pour qu'elle puisse s'authentifier et accéder à d'autres services. Dans Microsoft Entra, les identités de charge de travail sont les applications, les principaux de service et les identités managées. Un principal de service est l'identité d'une application dans un locataire, et une identité managée est un principal de service dont Microsoft Entra ID gère les informations d'identification à la place des développeurs.
  options:
    device:
      en: "Hardware such as phones, laptops and printers is represented by device identities."
      fr: "Le matériel, comme les téléphones, les ordinateurs portables et les imprimantes, est représenté par des identités d'appareil."
    partner:
      en: "An external partner is a person, represented by a user identity, usually a guest."
      fr: "Un partenaire externe est une personne, représentée par une identité d'utilisateur, en général un invité."
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
  - title: What are workload identities?
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identities-overview
