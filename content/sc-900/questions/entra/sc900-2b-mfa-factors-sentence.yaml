id: sc900-2b-mfa-factors-sentence
objective: "2.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences about Microsoft Entra multifactor authentication, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur l'authentification multifacteur Microsoft Entra, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Entra multifactor authentication requires [[count]] among the following: something you know, something you have and something you are.

      [[are]] is an example of something you are.

      The additional verification is requested [[when]].
    fr: |
      L'authentification multifacteur Microsoft Entra exige [[count]] parmi les suivants : quelque chose que vous savez, quelque chose que vous possédez et quelque chose que vous êtes.

      [[are]] est un exemple de quelque chose que vous êtes.

      La vérification supplémentaire est demandée [[when]].
  slots:
    - id: count
      options:
        - { id: one, text: { en: "only one factor", fr: "un seul facteur" } }
        - { id: two, text: { en: "two or more factors", fr: "au moins deux facteurs" } }
        - { id: three, text: { en: "all three factors", fr: "les trois facteurs" } }
    - id: are
      options:
        - { id: pin, text: { en: "A PIN", fr: "Un code PIN" } }
        - { id: key, text: { en: "A hardware key", fr: "Une clé matérielle" } }
        - { id: face, text: { en: "A face scan", fr: "Une reconnaissance du visage" } }
    - id: when
      options:
        - { id: signin, text: { en: "during the Microsoft Entra sign-in", fr: "pendant la connexion Microsoft Entra" } }
        - { id: app, text: { en: "by each application, after the sign-in", fr: "par chaque application, après la connexion" } }
        - { id: expired, text: { en: "only when the password has expired", fr: "uniquement lorsque le mot de passe a expiré" } }
answer:
  values: { count: two, are: face, when: signin }
explanation:
  correct:
    en: "Microsoft Entra multifactor authentication requires two or more of the three categories of factors. Something you are is a biometric characteristic, such as a face scan or a fingerprint. The prompt for the additional verification is part of the Microsoft Entra sign-in event itself."
    fr: "L'authentification multifacteur Microsoft Entra exige au moins deux des trois catégories de facteurs. Quelque chose que vous êtes est une caractéristique biométrique, comme une reconnaissance du visage ou une empreinte digitale. La demande de vérification supplémentaire fait partie de l'événement de connexion Microsoft Entra lui-même."
  options:
    one:
      en: "A single factor is single-factor authentication, whatever its category."
      fr: "Un seul facteur donne une authentification à un seul facteur, quelle que soit sa catégorie."
    three:
      en: "Two categories are enough; the three categories aren't all required."
      fr: "Deux catégories suffisent ; les trois ne sont pas toutes exigées."
    pin:
      en: "A PIN is a memorized secret: something you know."
      fr: "Un code PIN est un secret mémorisé : quelque chose que vous savez."
    key:
      en: "A hardware key is an object that the user holds: something you have."
      fr: "Une clé matérielle est un objet que l'utilisateur détient : quelque chose que vous possédez."
    app:
      en: "Applications don't run the verification themselves: Microsoft Entra ID handles it during the sign-in."
      fr: "Les applications n'effectuent pas elles-mêmes la vérification : Microsoft Entra ID s'en charge pendant la connexion."
    expired:
      en: "Multifactor authentication isn't tied to the expiration of the password."
      fr: "L'authentification multifacteur n'est pas liée à l'expiration du mot de passe."
references:
  - title: "How it works: Microsoft Entra multifactor authentication"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-howitworks
  - title: Describe multifactor authentication
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/3-describe-multi-factor-authentication
