id: sc900-2a-auth-authenticator-yn
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the Microsoft Authenticator app, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'application Microsoft Authenticator, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Microsoft Authenticator can be used only after the user has typed a password.
        fr: Microsoft Authenticator ne peut être utilisé qu'après la saisie d'un mot de passe par l'utilisateur.
    - id: s2
      text:
        en: Microsoft Authenticator can hold a device-bound passkey.
        fr: Microsoft Authenticator peut contenir une clé d'accès liée à l'appareil.
    - id: s3
      text:
        en: Microsoft Authenticator can generate OATH verification codes.
        fr: Microsoft Authenticator peut générer des codes de vérification OATH.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Microsoft Authenticator supports passwordless sign-in: the user matches in the app the number shown on the sign-in screen, without typing a password. The app can also hold a passkey, which is device-bound and unlocked with biometrics or the device PIN. In addition, it approves push notifications for multifactor authentication and works as a software OATH token that generates verification codes.
    fr: |
      Microsoft Authenticator prend en charge la connexion sans mot de passe : l'utilisateur fait correspondre dans l'application le numéro affiché sur l'écran de connexion, sans saisir de mot de passe. L'application peut aussi contenir une clé d'accès, liée à l'appareil et déverrouillée par la biométrie ou le code PIN de l'appareil. Elle approuve en outre les notifications Push de l'authentification multifacteur et fonctionne comme un jeton OATH logiciel qui génère des codes de vérification.
references:
  - title: Authentication methods in Microsoft Entra ID - Microsoft Authenticator app
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-authenticator-app
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
