id: sc900-2a-ident-managed-types-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about managed identities, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les identités managées, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A system-assigned managed identity can be shared by several Azure resources.
        fr: Une identité managée affectée par le système peut être partagée par plusieurs ressources Azure.
    - id: s2
      text:
        en: A user-assigned managed identity still exists after the resources that use it are deleted.
        fr: Une identité managée affectée par l'utilisateur existe encore après la suppression des ressources qui l'utilisent.
    - id: s3
      text:
        en: An organization pays an additional fee for each managed identity that it creates.
        fr: Une organisation paie un supplément pour chaque identité managée qu'elle crée.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A system-assigned managed identity is enabled directly on one Azure resource and is tied to it: it can't be shared, and Azure deletes it with the resource. A user-assigned managed identity is a standalone Azure resource that can be assigned to one or more resources; it is managed separately and stays until it is explicitly deleted. Both types can be used at no extra cost.
    fr: |
      Une identité managée affectée par le système est activée directement sur une ressource Azure et lui est liée : elle ne peut pas être partagée, et Azure la supprime avec la ressource. Une identité managée affectée par l'utilisateur est une ressource Azure autonome qui peut être attribuée à une ou plusieurs ressources ; elle se gère séparément et reste jusqu'à sa suppression explicite. Les deux types s'utilisent sans coût supplémentaire.
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
