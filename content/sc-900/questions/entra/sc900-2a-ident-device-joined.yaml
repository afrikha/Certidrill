id: sc900-2a-ident-device-joined
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has no on-premises Active Directory. The company buys Windows 11 laptops for its employees, who must sign in to the laptops with their organizational account.

    Which type of device identity should Tailspin Toys use for the laptops?
  fr: |
    Tailspin Toys n'a pas d'Active Directory local. L'entreprise achète des ordinateurs portables Windows 11 pour ses employés, qui doivent s'y connecter avec leur compte professionnel.

    Quel type d'identité d'appareil Tailspin Toys doit-elle utiliser pour ces ordinateurs portables ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra joined", fr: "Joint à Microsoft Entra" } }
    - { id: b, text: { en: "Microsoft Entra registered", fr: "Inscrit à Microsoft Entra" } }
    - { id: c, text: { en: "Microsoft Entra hybrid joined", fr: "Jonction hybride à Microsoft Entra" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Microsoft Entra joined device is joined to Microsoft Entra ID through an organizational account, which is then used to sign in to the device. These devices are generally owned by the organization, as the laptops of Tailspin Toys are. No on-premises Active Directory is needed.
    fr: |
      Un appareil joint à Microsoft Entra est joint à Microsoft Entra ID au moyen d'un compte professionnel, qui sert ensuite à se connecter à l'appareil. Ces appareils appartiennent en général à l'organisation, comme les ordinateurs portables de Tailspin Toys. Aucun Active Directory local n'est nécessaire.
  options:
    b:
      en: "Microsoft Entra registered supports bring your own device (BYOD) and mobile scenarios, in which users access resources from a personal device."
      fr: "L'inscription à Microsoft Entra répond aux scénarios BYOD (apportez votre propre appareil) et mobiles, dans lesquels les utilisateurs accèdent aux ressources depuis un appareil personnel."
    c:
      en: "A Microsoft Entra hybrid joined device is joined to an on-premises Active Directory and to Microsoft Entra ID; Tailspin Toys has no on-premises Active Directory."
      fr: "Un appareil à jonction hybride Microsoft Entra est joint à un Active Directory local et à Microsoft Entra ID ; Tailspin Toys n'a pas d'Active Directory local."
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
  - title: What is a device identity?
    url: https://learn.microsoft.com/en-us/entra/identity/devices/overview
