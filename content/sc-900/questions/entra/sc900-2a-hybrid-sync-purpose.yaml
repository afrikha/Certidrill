id: sc900-2a-hybrid-sync-purpose
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso implements hybrid identity between its on-premises Active Directory and Microsoft Entra ID.

    What is the role of synchronization in this solution?
  fr: |
    Contoso met en œuvre l'identité hybride entre son Active Directory local et Microsoft Entra ID.

    Quel est le rôle de la synchronisation dans cette solution ?
body:
  options:
    - { id: a, text: { en: "Validating the password of a user against the on-premises Active Directory at each sign-in", fr: "Valider le mot de passe d'un utilisateur auprès de l'Active Directory local à chaque connexion" } }
    - { id: b, text: { en: "Establishing a trust relationship between two identity providers", fr: "Établir une relation d'approbation entre deux fournisseurs d'identité" } }
    - { id: c, text: { en: "Making sure that identity information for on-premises users and groups matches the cloud", fr: "S'assurer que les informations d'identité des utilisateurs et des groupes locaux correspondent à celles du cloud" } }
    - { id: d, text: { en: "Requiring a second form of identification from users who sign in from outside the office", fr: "Exiger une deuxième forme d'identification des utilisateurs qui se connectent hors du bureau" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Hybrid identity is accomplished through provisioning and synchronization. Provisioning creates in Microsoft Entra ID the identity of a user who exists in Active Directory, and synchronization then makes sure that identity information for on-premises users and groups matches the cloud. A change made on-premises, such as a new group member, is therefore reflected in Microsoft Entra ID.
    fr: |
      L'identité hybride s'obtient par le provisionnement et la synchronisation. Le provisionnement crée dans Microsoft Entra ID l'identité d'un utilisateur qui existe dans Active Directory, puis la synchronisation s'assure que les informations d'identité des utilisateurs et des groupes locaux correspondent à celles du cloud. Une modification faite en local, comme un nouveau membre de groupe, se retrouve donc dans Microsoft Entra ID.
  options:
    a:
      en: "Validating passwords against the on-premises Active Directory at sign-in describes pass-through authentication, a sign-in method."
      fr: "Valider les mots de passe auprès de l'Active Directory local à la connexion décrit l'authentification directe, une méthode de connexion."
    b:
      en: "A trust relationship between identity providers describes federation."
      fr: "Une relation d'approbation entre fournisseurs d'identité décrit la fédération."
    d:
      en: "Requiring a second form of identification describes multifactor authentication."
      fr: "Exiger une deuxième forme d'identification décrit l'authentification multifacteur."
references:
  - title: Describe hybrid identity
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/4-describe-concept-of-hybrid-identity
  - title: What is hybrid identity with Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/whatis-hybrid-identity
