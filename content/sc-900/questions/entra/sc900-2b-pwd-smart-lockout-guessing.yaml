id: sc900-2b-pwd-smart-lockout-guessing
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An attacker repeatedly tries to guess the password of a user account in the Microsoft Entra tenant of Contoso.

    Which feature temporarily stops the attacker's attempts while it tries to keep the account available to the genuine user?
  fr: |
    Un attaquant tente à plusieurs reprises de deviner le mot de passe d'un compte d'utilisateur dans le locataire Microsoft Entra de Contoso.

    Quelle fonctionnalité arrête temporairement les tentatives de l'attaquant tout en cherchant à laisser le compte disponible pour le véritable utilisateur ?
body:
  options:
    - id: a
      text: { en: "Self-service password reset", fr: "La réinitialisation de mot de passe en libre-service" }
    - id: b
      text: { en: "Password writeback", fr: "La réécriture du mot de passe" }
    - id: c
      text: { en: "A custom banned password list", fr: "Une liste personnalisée de mots de passe interdits" }
    - id: d
      text: { en: "Smart lockout", fr: "Le verrouillage intelligent" }
answer: { optionId: d }
explanation:
  correct:
    en: "Smart lockout locks out bad actors who try to guess passwords or use brute-force methods. It tells apart the sign-ins of valid users from those of attackers and unknown sources, so that the attacker is locked out while the genuine user can continue to work. It is always on in every tenant."
    fr: "Le verrouillage intelligent bloque les personnes malveillantes qui tentent de deviner des mots de passe ou utilisent des méthodes par force brute. Il distingue les connexions des utilisateurs légitimes de celles des attaquants et des sources inconnues : l'attaquant est bloqué pendant que le véritable utilisateur continue à travailler. Il est toujours actif dans tous les locataires."
  options:
    a:
      en: "Self-service password reset lets the user change or reset a password; it doesn't stop repeated guesses."
      fr: "La réinitialisation de mot de passe en libre-service laisse l'utilisateur changer ou réinitialiser un mot de passe ; elle n'arrête pas les tentatives répétées."
    b:
      en: "Password writeback sends a password changed in the cloud back to the on-premises directory."
      fr: "La réécriture du mot de passe renvoie vers l'annuaire local un mot de passe changé dans le cloud."
    c:
      en: "A custom banned password list acts when a password is chosen, not when someone tries to guess it."
      fr: "Une liste personnalisée de mots de passe interdits agit au moment où un mot de passe est choisi, pas quand quelqu'un tente de le deviner."
references:
  - title: Protect user accounts from attacks with Microsoft Entra smart lockout
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-smart-lockout
