id: sc900-2c-gov-entitlement-yn
objective: "2.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about entitlement management, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la gestion des droits d'utilisation, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A single access package can give access to groups, applications and SharePoint sites."
        fr: "Un même package d'accès peut donner accès à des groupes, à des applications et à des sites SharePoint."
    - id: s2
      text:
        en: "Requests for an access package are approved by users who hold the Global Administrator role and by nobody else."
        fr: "Les demandes d'un package d'accès sont approuvées par les utilisateurs qui détiennent le rôle Global Administrator, et par personne d'autre."
    - id: s3
      text:
        en: "An assignment to an access package can end automatically after a period that a policy defines."
        fr: "Une attribution à un package d'accès peut prendre fin automatiquement après une durée définie par une stratégie."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "An access package bundles memberships of security groups, Microsoft 365 groups and teams, enterprise applications and SharePoint Online sites. Each policy of the package names the approvers, who can be managers or other business decision makers, so access decisions are delegated to the people who know the need rather than reserved for administrators. The policy also sets how long an assignment lasts, so that access doesn't persist indefinitely."
    fr: "Un package d'accès regroupe des appartenances à des groupes de sécurité, à des groupes Microsoft 365 et à des équipes, des applications d'entreprise et des sites SharePoint Online. Chaque stratégie du package désigne les approbateurs, qui peuvent être des responsables ou d'autres décideurs métier : les décisions d'accès sont déléguées aux personnes qui connaissent le besoin au lieu d'être réservées aux administrateurs. La stratégie fixe aussi la durée d'une attribution, pour que l'accès ne persiste pas indéfiniment."
references:
  - title: What is entitlement management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
