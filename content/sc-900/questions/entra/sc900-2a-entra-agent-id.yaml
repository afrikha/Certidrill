id: sc900-2a-entra-agent-id
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum deploys AI agents that act autonomously on company data. Each agent must have its own governed identity, with a human sponsor who is accountable for it.

    Which product of the Microsoft Entra family should Adatum use?
  fr: |
    Adatum déploie des agents IA qui agissent de façon autonome sur les données de l'entreprise. Chaque agent doit avoir sa propre identité gouvernée, avec un sponsor humain qui en répond.

    Quel produit de la famille Microsoft Entra Adatum doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Microsoft Entra Workload ID" }
    - { id: b, text: "Microsoft Entra External ID" }
    - { id: c, text: "Microsoft Entra Agent ID" }
    - { id: d, text: "Microsoft Entra Verified ID" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft Entra Agent ID is an identity and security framework that extends Microsoft Entra to AI agents. It provides purpose-built identities to authenticate, authorize, govern and protect agents, and each agent identity has a sponsor, a person or a group accountable for it. Conditional Access, identity protection and identity governance then apply to the agents.
    fr: |
      Microsoft Entra Agent ID est un cadre d'identité et de sécurité qui étend Microsoft Entra aux agents IA. Il fournit des identités conçues pour authentifier, autoriser, gouverner et protéger les agents, et chaque identité d'agent a un sponsor, une personne ou un groupe qui en répond. L'accès conditionnel, la protection des identités et la gouvernance des identités s'appliquent alors aux agents.
  options:
    a:
      en: "Microsoft Entra Workload ID manages traditional workload identities, that is, applications, service principals and managed identities; agent identities are distinct from them."
      fr: "Microsoft Entra Workload ID gère les identités de charge de travail classiques, c'est-à-dire les applications, les principaux de service et les identités managées ; les identités d'agent en sont distinctes."
    b:
      en: "Microsoft Entra External ID gives people outside the organization, such as partners, guests and customers, access to applications."
      fr: "Microsoft Entra External ID donne aux personnes extérieures à l'organisation, comme les partenaires, les invités et les clients, l'accès aux applications."
    d:
      en: "Microsoft Entra Verified ID issues and verifies digital credentials about people, such as a diploma; it doesn't give identities to agents."
      fr: "Microsoft Entra Verified ID émet et vérifie des justificatifs numériques sur des personnes, comme un diplôme ; il ne donne pas d'identité aux agents."
references:
