id: sc900-2a-ident-external-id-customers
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum publishes a mobile application for consumers. The customers must be able to register by themselves and to sign in with a social account such as Google or Facebook.

    What should Adatum use to manage the identities of the customers?
  fr: |
    Adatum publie une application mobile destinée aux consommateurs. Les clients doivent pouvoir s'inscrire eux-mêmes et se connecter avec un compte de réseau social comme Google ou Facebook.

    Que doit utiliser Adatum pour gérer les identités des clients ?
body:
  options:
    - { id: a, text: "Microsoft Entra Domain Services" }
    - { id: b, text: "Microsoft Entra External ID" }
    - { id: c, text: "Microsoft Entra Workload ID" }
    - { id: d, text: "Microsoft Entra Cloud Sync" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft Entra External ID lets people outside the organization access applications with an identity that they bring, including social identity providers such as Google or Facebook. For applications published to consumers, it provides customer identity and access management (CIAM) in an external tenant: self-service registration, personalized sign-in and customer account management.
    fr: |
      Microsoft Entra External ID permet à des personnes extérieures à l'organisation d'accéder à des applications avec une identité qu'elles apportent, y compris celle de fournisseurs d'identité sociaux comme Google ou Facebook. Pour les applications publiées à destination des consommateurs, il fournit la gestion des identités et des accès des clients (CIAM) dans un locataire externe : inscription en libre-service, connexion personnalisée et gestion des comptes clients.
  options:
    a:
      en: "Microsoft Entra Domain Services provides managed domain services such as domain join and Kerberos to legacy applications; it doesn't manage customer accounts."
      fr: "Microsoft Entra Domain Services fournit des services de domaine managés, comme la jonction de domaine et Kerberos, à des applications anciennes ; il ne gère pas de comptes clients."
    c:
      en: "Microsoft Entra Workload ID manages the identities of software, such as applications and services, not the identities of people."
      fr: "Microsoft Entra Workload ID gère les identités de logiciels, comme les applications et les services, pas celles de personnes."
    d:
      en: "Microsoft Entra Cloud Sync synchronizes the users and groups of an on-premises Active Directory to Microsoft Entra ID."
      fr: "Microsoft Entra Cloud Sync synchronise les utilisateurs et les groupes d'un Active Directory local vers Microsoft Entra ID."
references:
  - title: Describe external identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/5-describe-external-identities
