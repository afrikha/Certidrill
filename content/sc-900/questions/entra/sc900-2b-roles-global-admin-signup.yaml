id: sc900-2b-roles-global-admin-signup
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Microsoft Entra role is automatically assigned to the person who signs up for a new Microsoft Entra tenant?
  fr: |
    Quel rôle Microsoft Entra est automatiquement attribué à la personne qui crée un nouveau locataire Microsoft Entra en s'y inscrivant ?
body:
  options:
    - { id: a, text: User Administrator }
    - { id: b, text: Security Administrator }
    - { id: c, text: Global Administrator }
    - { id: d, text: Billing Administrator }
answer: { optionId: c }
explanation:
  correct:
    en: "The person who signs up for the tenant becomes a Global Administrator. This role has access to all the administrative features of Microsoft Entra ID and can assign administrator roles to other users, which is why it should be held by very few people."
    fr: "La personne qui s'inscrit pour créer le locataire devient Global Administrator. Ce rôle donne accès à toutes les fonctionnalités d'administration de Microsoft Entra ID et permet d'attribuer des rôles d'administrateur à d'autres utilisateurs : c'est pourquoi très peu de personnes devraient le détenir."
  options:
    a:
      en: "User Administrator manages users and groups; it is assigned by an administrator, not automatically at sign-up."
      fr: "User Administrator gère les utilisateurs et les groupes ; il est attribué par un administrateur, pas automatiquement à l'inscription."
    b:
      en: "Security Administrator manages security settings across several services; it isn't granted at sign-up."
      fr: "Security Administrator gère des paramètres de sécurité dans plusieurs services ; il n'est pas accordé à l'inscription."
    d:
      en: "Billing Administrator makes purchases and manages subscriptions; it isn't granted at sign-up."
      fr: "Billing Administrator effectue des achats et gère les abonnements ; il n'est pas accordé à l'inscription."
references:
  - title: Describe Microsoft Entra roles and role-based access control (RBAC)
    url: https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/3-describe-azure-role-based-access-control
  - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
