id: sc900-2b-pwd-smart-lockout-yn
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra smart lockout, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur le verrouillage intelligent de Microsoft Entra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An administrator must enable smart lockout before it protects the accounts of a tenant."
        fr: "Un administrateur doit activer le verrouillage intelligent pour qu'il protège les comptes d'un locataire."
    - id: s2
      text:
        en: "Smart lockout keeps separate lockout counters for sign-ins from familiar locations and from unfamiliar locations."
        fr: "Le verrouillage intelligent tient des compteurs de verrouillage distincts pour les connexions depuis des emplacements familiers et depuis des emplacements inconnus."
    - id: s3
      text:
        en: "Smart lockout rejects a new password that matches a term of the global banned password list."
        fr: "Le verrouillage intelligent rejette un nouveau mot de passe qui correspond à un terme de la liste globale de mots de passe interdits."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Smart lockout is always on for all Microsoft Entra customers, with default settings. It counts failed sign-ins from familiar and unfamiliar locations separately, so an attacker in an unknown location can be locked out while the user keeps signing in from a usual location. Rejecting weak passwords when they are chosen is the job of Microsoft Entra Password Protection and its banned password lists, not of smart lockout."
    fr: "Le verrouillage intelligent est toujours actif pour tous les clients Microsoft Entra, avec des paramètres par défaut. Il compte séparément les échecs de connexion depuis les emplacements familiers et inconnus : un attaquant situé dans un emplacement inconnu peut être bloqué pendant que l'utilisateur continue à se connecter depuis un emplacement habituel. Rejeter les mots de passe faibles au moment où ils sont choisis est le travail de la protection par mot de passe Microsoft Entra et de ses listes de mots de passe interdits, pas du verrouillage intelligent."
references:
  - title: Protect user accounts from attacks with Microsoft Entra smart lockout
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-smart-lockout
