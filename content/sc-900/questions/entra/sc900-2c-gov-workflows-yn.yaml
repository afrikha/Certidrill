id: sc900-2c-gov-workflows-yn
objective: "2.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about lifecycle workflows, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les workflows de cycle de vie, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Lifecycle workflows require administrators to activate their privileged roles before they use them."
        fr: "Les workflows de cycle de vie obligent les administrateurs à activer leurs rôles privilégiés avant de s'en servir."
    - id: s2
      text:
        en: "A lifecycle workflow can apply to the users of one department, based on an attribute of their account."
        fr: "Un workflow de cycle de vie peut s'appliquer aux utilisateurs d'un seul service, d'après un attribut de leur compte."
    - id: s3
      text:
        en: "A lifecycle workflow can disable the account of an employee who leaves the organization."
        fr: "Un workflow de cycle de vie peut désactiver le compte d'un employé qui quitte l'organisation."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Activating a privileged role before using it is how Privileged Identity Management works, not lifecycle workflows. A lifecycle workflow has execution conditions: a scope, which selects users by attributes such as the department, and a trigger, which says when it runs. Its tasks cover joiners, movers and leavers, including disabling and removing the accounts of people who leave."
    fr: "Activer un rôle privilégié avant de s'en servir est le fonctionnement de Privileged Identity Management, pas des workflows de cycle de vie. Un workflow de cycle de vie a des conditions d'exécution : une étendue, qui sélectionne les utilisateurs d'après des attributs comme le service, et un déclencheur, qui dit quand il s'exécute. Ses tâches couvrent les arrivées, les changements de poste et les départs, y compris la désactivation et la suppression des comptes des personnes qui partent."
references:
  - title: What are lifecycle workflows?
    url: https://learn.microsoft.com/en-us/entra/id-governance/what-are-lifecycle-workflows
