id: sc900-2b-ca-assignments-risk-yn
objective: "2.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra Conditional Access, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'accès conditionnel Microsoft Entra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A Conditional Access policy that uses sign-in risk as a condition relies on signals from Microsoft Entra ID Protection."
        fr: "Une stratégie d'accès conditionnel qui utilise le risque de connexion comme condition s'appuie sur des signaux de Protection Microsoft Entra ID."
    - id: s2
      text:
        en: "When several assignments are configured in a Conditional Access policy, the policy applies as soon as one of them is satisfied."
        fr: "Lorsque plusieurs affectations sont configurées dans une stratégie d'accès conditionnel, la stratégie s'applique dès que l'une d'elles est remplie."
    - id: s3
      text:
        en: "Conditional Access is included in Microsoft Entra ID Free."
        fr: "L'accès conditionnel est inclus dans Microsoft Entra ID Free."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Sign-in risk and user risk are calculated by Microsoft Entra ID Protection, and Conditional Access uses them as conditions. All the assignments of a policy are combined with a logical AND: the policy is triggered only when every configured assignment is satisfied. Conditional Access requires Microsoft Entra ID P1; organizations on the free tier use security defaults instead."
    fr: "Le risque de connexion et le risque utilisateur sont calculés par Protection Microsoft Entra ID, et l'accès conditionnel les utilise comme conditions. Toutes les affectations d'une stratégie sont combinées par un ET logique : la stratégie ne se déclenche que si chaque affectation configurée est remplie. L'accès conditionnel demande Microsoft Entra ID P1 ; les organisations au niveau gratuit utilisent à la place les paramètres de sécurité par défaut."
references:
  - title: Build a Conditional Access policy
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-policies
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
