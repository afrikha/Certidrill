id: sc900-2a-hybrid-onprem-validation-multi
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank synchronizes its on-premises Active Directory with Microsoft Entra ID. The security policy of the bank states that the passwords of users must be validated on-premises, never by a cloud service.

    Which two sign-in methods comply with the policy? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank synchronise son Active Directory local avec Microsoft Entra ID. La stratégie de sécurité de la banque impose que les mots de passe des utilisateurs soient validés en local, jamais par un service cloud.

    Quelles sont les deux méthodes de connexion conformes à cette stratégie ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Pass-through authentication", fr: "L'authentification directe" } }
    - { id: b, text: { en: "Password hash synchronization", fr: "La synchronisation de hachage du mot de passe" } }
    - { id: c, text: { en: "Cloud-only user accounts", fr: "Des comptes d'utilisateur uniquement cloud" } }
    - { id: d, text: { en: "Federation with Active Directory Federation Services (AD FS)", fr: "La fédération avec Active Directory Federation Services (AD FS)" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      With pass-through authentication, lightweight agents installed on-premises validate the password of the user directly against the on-premises Active Directory: password validation doesn't happen in the cloud. With federation, Microsoft Entra ID hands off authentication to an on-premises system such as AD FS, so all user authentication occurs on-premises. Both methods keep password validation inside the bank.
    fr: |
      Avec l'authentification directe, des agents légers installés en local valident le mot de passe de l'utilisateur directement auprès de l'Active Directory local : la validation du mot de passe n'a pas lieu dans le cloud. Avec la fédération, Microsoft Entra ID délègue l'authentification à un système local comme AD FS : toute l'authentification des utilisateurs a donc lieu en local. Les deux méthodes maintiennent la validation des mots de passe à l'intérieur de la banque.
  options:
    b:
      en: "With password hash synchronization, Microsoft Entra ID validates the password in the cloud, against a hash synchronized from Active Directory."
      fr: "Avec la synchronisation de hachage du mot de passe, Microsoft Entra ID valide le mot de passe dans le cloud, par rapport à un hachage synchronisé depuis Active Directory."
    c:
      en: "A cloud-only account exists only in Microsoft Entra ID, which stores and validates its credentials."
      fr: "Un compte uniquement cloud n'existe que dans Microsoft Entra ID, qui stocke et valide ses informations d'identification."
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
  - title: User sign-in with Microsoft Entra pass-through authentication
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-pta
