id: sc900-2c-pim-activation-ends
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A user has an eligible assignment for the Security Administrator role in Microsoft Entra Privileged Identity Management. The user activates the role for four hours.

    What happens at the end of the four hours?
  fr: |
    Un utilisateur possède une attribution éligible pour le rôle Security Administrator dans Microsoft Entra Privileged Identity Management. L'utilisateur active le rôle pour quatre heures.

    Que se passe-t-il au bout des quatre heures ?
body:
  options:
    - id: a
      text: { en: "The user keeps the role until an administrator removes the assignment.", fr: "L'utilisateur garde le rôle jusqu'à ce qu'un administrateur supprime l'attribution." }
    - id: b
      text: { en: "The user loses the role and can't activate it again without a new assignment.", fr: "L'utilisateur perd le rôle et ne peut plus l'activer sans une nouvelle attribution." }
    - id: c
      text: { en: "The user keeps the role but must complete an access review to use it.", fr: "L'utilisateur garde le rôle mais doit effectuer une révision d'accès pour s'en servir." }
    - id: d
      text: { en: "The user loses the role but remains eligible to activate it again.", fr: "L'utilisateur perd le rôle mais reste éligible pour l'activer de nouveau." }
answer: { optionId: d }
explanation:
  correct:
    en: "An activation makes an eligible user active for a preconfigured period. When the period ends, PIM removes the active assignment, so the privileges stop. The eligible assignment isn't affected: the user can activate the role again the next time it is needed."
    fr: "Une activation rend un utilisateur éligible actif pour une durée préconfigurée. À la fin de cette durée, PIM supprime l'attribution active : les privilèges cessent. L'attribution éligible n'est pas touchée : l'utilisateur pourra activer de nouveau le rôle la prochaine fois qu'il en aura besoin."
  options:
    a:
      en: "An activation is limited in time; the role doesn't stay active until someone removes it."
      fr: "Une activation est limitée dans le temps ; le rôle ne reste pas actif jusqu'à ce que quelqu'un le retire."
    b:
      en: "Only the activation expires. The eligibility remains, so no new assignment is needed."
      fr: "Seule l'activation expire. L'éligibilité demeure : aucune nouvelle attribution n'est nécessaire."
    c:
      en: "The role is deactivated at the end of the period, and reactivating it doesn't depend on an access review."
      fr: "Le rôle est désactivé à la fin de la durée, et sa réactivation ne dépend pas d'une révision d'accès."
references:
  - title: Activate a Microsoft Entra role in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-activate-role
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
