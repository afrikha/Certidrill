id: sc900-2c-gov-scope-yn
objective: "2.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra ID Governance, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Gouvernance Microsoft Entra ID, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Entra ID Governance can create and update user identities from a human resources system such as Workday."
        fr: "Gouvernance Microsoft Entra ID peut créer et mettre à jour des identités d'utilisateurs à partir d'un système de ressources humaines comme Workday."
    - id: s2
      text:
        en: "Microsoft Entra ID Governance can govern access to on-premises applications as well as to cloud applications."
        fr: "Gouvernance Microsoft Entra ID peut gouverner l'accès aux applications locales comme aux applications cloud."
    - id: s3
      text:
        en: "Microsoft Entra ID Governance correlates the alerts of several security products to investigate security incidents."
        fr: "Gouvernance Microsoft Entra ID met en corrélation les alertes de plusieurs produits de sécurité pour examiner des incidents de sécurité."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Inbound provisioning from HR sources such as Workday or SuccessFactors keeps user identities up to date and is part of the identity lifecycle. ID Governance addresses access across services and applications, both on-premises and in the cloud. Correlating alerts to investigate incidents is the job of a security operations tool such as Microsoft Sentinel or Microsoft Defender XDR, not of identity governance."
    fr: "Le provisionnement entrant à partir de sources RH comme Workday ou SuccessFactors tient à jour les identités des utilisateurs et fait partie du cycle de vie des identités. Gouvernance Microsoft Entra ID traite l'accès à l'ensemble des services et des applications, locaux comme cloud. Mettre en corrélation des alertes pour examiner des incidents est le rôle d'un outil d'opérations de sécurité comme Microsoft Sentinel ou Microsoft Defender XDR, pas de la gouvernance des identités."
references:
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
