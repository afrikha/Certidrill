id: sc900-2b-mfa-basics-yn
objective: "2.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra multifactor authentication, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'authentification multifacteur Microsoft Entra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A sign-in that requires a password and a fingerprint scan is multifactor authentication."
        fr: "Une connexion qui exige un mot de passe et une empreinte digitale est une authentification multifacteur."
    - id: s2
      text:
        en: "A phone that is registered with Microsoft Authenticator is an example of something you are."
        fr: "Un téléphone inscrit auprès de Microsoft Authenticator est un exemple de quelque chose que vous êtes."
    - id: s3
      text:
        en: "Each application must be modified so that it can display the multifactor authentication prompt."
        fr: "Chaque application doit être modifiée pour pouvoir afficher la demande d'authentification multifacteur."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "A password is something you know and a fingerprint is something you are: two categories, so the sign-in is multifactor. A registered phone is a trusted device, that is, something you have; something you are refers to biometrics. The verification prompt is part of the Microsoft Entra sign-in, which requests and processes the challenge itself, so applications need no change."
    fr: "Un mot de passe est quelque chose que vous savez et une empreinte digitale est quelque chose que vous êtes : deux catégories, la connexion est donc multifacteur. Un téléphone inscrit est un appareil de confiance, c'est-à-dire quelque chose que vous possédez ; quelque chose que vous êtes désigne la biométrie. La demande de vérification fait partie de la connexion Microsoft Entra, qui demande et traite elle-même la vérification : les applications n'ont pas à être modifiées."
references:
  - title: "How it works: Microsoft Entra multifactor authentication"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-howitworks
