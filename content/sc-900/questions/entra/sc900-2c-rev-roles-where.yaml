id: sc900-2c-rev-roles-where
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has many users who are assigned the Global Administrator role. Adatum wants each of these users to be recertified every six months, so that the assignments that are no longer justified are removed.

    Where should Adatum create the access review?
  fr: |
    De nombreux utilisateurs d'Adatum détiennent le rôle Global Administrator. Adatum veut que chacun de ces utilisateurs soit recertifié tous les six mois, afin que les attributions qui ne se justifient plus soient supprimées.

    Où Adatum doit-elle créer la révision d'accès ?
body:
  options:
    - id: a
      text: { en: "In entitlement management", fr: "Dans la gestion des droits d'utilisation" }
    - id: b
      text: { en: "In Privileged Identity Management", fr: "Dans Privileged Identity Management" }
    - id: c
      text: { en: "In Microsoft Entra ID Protection", fr: "Dans Protection Microsoft Entra ID" }
    - id: d
      text: { en: "In lifecycle workflows", fr: "Dans les workflows de cycle de vie" }
answer: { optionId: b }
explanation:
  correct:
    en: "Where a review is created depends on what is reviewed. Reviews of group memberships and of application access are created in access reviews, reviews of access package assignments in entitlement management, and reviews of Microsoft Entra roles and Azure resource roles in Privileged Identity Management, which manages those role assignments."
    fr: "L'endroit où une révision se crée dépend de ce qui est révisé. Les révisions des appartenances aux groupes et de l'accès aux applications se créent dans les révisions d'accès, celles des attributions de packages d'accès dans la gestion des droits d'utilisation, et celles des rôles Microsoft Entra et des rôles de ressources Azure dans Privileged Identity Management, qui gère ces attributions de rôles."
  options:
    a:
      en: "Entitlement management hosts the reviews of access package assignments, not of role assignments."
      fr: "La gestion des droits d'utilisation héberge les révisions des attributions de packages d'accès, pas celles des attributions de rôles."
    c:
      en: "ID Protection reports risky users and risky sign-ins; it doesn't recertify role assignments."
      fr: "Protection Microsoft Entra ID signale les utilisateurs et les connexions à risque ; elle ne recertifie pas les attributions de rôles."
    d:
      en: "Lifecycle workflows run tasks for joiners, movers and leavers; they aren't reviews in which someone approves or denies access."
      fr: "Les workflows de cycle de vie exécutent des tâches lors des arrivées, des changements de poste et des départs ; ce ne sont pas des révisions où quelqu'un approuve ou refuse un accès."
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
  - title: Create an access review of Azure resource and Microsoft Entra roles in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-create-roles-and-resource-roles-review
