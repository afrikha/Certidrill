id: sc900-2a-auth-phishing-resistant-multi
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam wants its administrators to sign in only with phishing-resistant authentication methods.

    Which two methods can the administrators use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam veut que ses administrateurs se connectent uniquement avec des méthodes d'authentification résistantes au hameçonnage.

    Quelles sont les deux méthodes que les administrateurs peuvent utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "SMS verification code", fr: "Code de vérification par SMS" } }
    - { id: b, text: { en: "FIDO2 security key", fr: "Clé de sécurité FIDO2" } }
    - { id: c, text: { en: "Software OATH token", fr: "Jeton OATH logiciel" } }
    - { id: d, text: { en: "Voice call", fr: "Appel vocal" } }
    - { id: e, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Phishing-resistant methods use public key cryptography bound to the origin of the legitimate sign-in site, so the credential can't be used on a fraudulent site, replayed or shared. Microsoft lists Windows Hello for Business, Platform Credential for macOS, passkeys (FIDO2 security keys, passkeys in Microsoft Authenticator and synced passkeys) and certificate-based authentication. A FIDO2 security key and Windows Hello for Business both qualify.
    fr: |
      Les méthodes résistantes au hameçonnage utilisent une cryptographie à clé publique liée à l'origine du site de connexion légitime : l'information d'identification ne peut donc être ni utilisée sur un site frauduleux, ni rejouée, ni partagée. Microsoft cite Windows Hello Entreprise, Platform Credential for macOS, les clés d'accès (clés de sécurité FIDO2, clés d'accès dans Microsoft Authenticator et clés d'accès synchronisées) et l'authentification basée sur un certificat. Une clé de sécurité FIDO2 et Windows Hello Entreprise en font toutes deux partie.
  options:
    a:
      en: "A code received by SMS can be typed on a fake sign-in page or obtained by social engineering; Microsoft recommends moving away from SMS."
      fr: "Un code reçu par SMS peut être saisi sur une fausse page de connexion ou obtenu par ingénierie sociale ; Microsoft recommande d'abandonner le SMS."
    c:
      en: "A one-time code from an OATH token isn't bound to the sign-in site: a user can be tricked into typing it on a fraudulent page."
      fr: "Un code à usage unique issu d'un jeton OATH n'est pas lié au site de connexion : un utilisateur peut être amené par ruse à le saisir sur une page frauduleuse."
    d:
      en: "A voice call only asks the user to press a key; it doesn't check which site requested the sign-in, and Microsoft recommends moving away from it."
      fr: "Un appel vocal demande seulement à l'utilisateur d'appuyer sur une touche ; il ne vérifie pas quel site a demandé la connexion, et Microsoft recommande de l'abandonner."
references:
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
  - title: Microsoft Entra authentication overview
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-methods
