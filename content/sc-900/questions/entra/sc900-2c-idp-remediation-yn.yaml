id: sc900-2c-idp-remediation-yn
objective: "2.4.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Entra ID Protection with risk-based Conditional Access policies.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Protection Microsoft Entra ID avec des stratégies d'accès conditionnel basées sur les risques.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Some risk detections are calculated in real time during the sign-in, and others are calculated offline after the sign-in."
        fr: "Certaines détections de risque sont calculées en temps réel pendant la connexion, et d'autres sont calculées hors connexion après la connexion."
    - id: s2
      text:
        en: "After a user completes the multifactor authentication that a sign-in risk policy requires, the sign-in risk stays open until an administrator dismisses it."
        fr: "Une fois qu'un utilisateur a effectué l'authentification multifacteur exigée par une stratégie de risque de connexion, le risque de connexion reste ouvert jusqu'à ce qu'un administrateur le rejette."
    - id: s3
      text:
        en: "Microsoft Entra ID Protection can detect risks for workload identities such as service principals."
        fr: "Protection Microsoft Entra ID peut détecter des risques pour des identités de charge de travail comme des principaux de service."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Real-time detections are calculated at sign-in, so a policy can react immediately; offline detections are calculated afterward and can take up to 48 hours to appear. When the user completes the control that the risk-based policy requires, such as multifactor authentication, the risk is remediated automatically, with no administrator action. ID Protection also detects risks for workload identities, for example leaked credentials or suspicious sign-ins of a service principal."
    fr: "Les détections en temps réel sont calculées à la connexion, ce qui permet à une stratégie de réagir immédiatement ; les détections hors connexion sont calculées après coup et peuvent mettre jusqu'à 48 heures à apparaître. Quand l'utilisateur satisfait au contrôle exigé par la stratégie basée sur les risques, comme l'authentification multifacteur, le risque est corrigé automatiquement, sans action d'un administrateur. Protection Microsoft Entra ID détecte aussi des risques pour les identités de charge de travail, par exemple des informations d'identification divulguées ou des connexions suspectes d'un principal de service."
references:
  - title: Risk detection types and levels
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-risk-detection-types
  - title: Securing workload identities
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-workload-identity-risk
