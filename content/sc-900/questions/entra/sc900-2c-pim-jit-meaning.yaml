id: sc900-2c-pim-jit-meaning
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Microsoft Entra Privileged Identity Management provides just-in-time access to privileged roles.

    What does just-in-time access mean?
  fr: |
    Microsoft Entra Privileged Identity Management fournit un accès juste-à-temps aux rôles privilégiés.

    Que signifie l'accès juste-à-temps ?
body:
  options:
    - id: a
      text: { en: "Users receive the privileges as soon as their account is created.", fr: "Les utilisateurs reçoivent les privilèges dès la création de leur compte." }
    - id: b
      text: { en: "Users receive the privileges only on devices that are compliant.", fr: "Les utilisateurs ne reçoivent les privilèges que sur des appareils conformes." }
    - id: c
      text: { en: "Users receive the privileges only when they need them, temporarily.", fr: "Les utilisateurs ne reçoivent les privilèges que lorsqu'ils en ont besoin, temporairement." }
    - id: d
      text: { en: "Users receive the privileges only after a yearly review of their access.", fr: "Les utilisateurs ne reçoivent les privilèges qu'après une révision annuelle de leur accès." }
answer: { optionId: c }
explanation:
  correct:
    en: "With just-in-time access, users get temporary permissions to perform privileged tasks, and the permissions end when they expire. Access is granted only when it is needed, which reduces the time during which a compromised or careless account can misuse a privileged role."
    fr: "Avec l'accès juste-à-temps, les utilisateurs obtiennent des autorisations temporaires pour effectuer des tâches privilégiées, et ces autorisations prennent fin à leur expiration. L'accès n'est accordé que lorsqu'il est nécessaire, ce qui réduit le temps pendant lequel un compte compromis ou négligent peut faire un mauvais usage d'un rôle privilégié."
  options:
    a:
      en: "Privileges granted at account creation and kept afterward are standing access, the opposite of just-in-time access."
      fr: "Des privilèges accordés à la création du compte et conservés ensuite constituent un accès permanent, l'inverse de l'accès juste-à-temps."
    b:
      en: "Restricting access to compliant devices is a Conditional Access condition, not the meaning of just-in-time."
      fr: "Limiter l'accès aux appareils conformes est une condition d'accès conditionnel, pas le sens de juste-à-temps."
    d:
      en: "A yearly recertification is an access review; just-in-time is about when and for how long the privileges are usable."
      fr: "Une recertification annuelle est une révision d'accès ; le juste-à-temps porte sur le moment et la durée pendant lesquels les privilèges sont utilisables."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
