id: sc900-2a-hybrid-definition
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs some applications in its own datacenter and others in the cloud. Each user must have one common identity for authentication and authorization to all the applications, wherever they are hosted.

    Which concept meets this requirement?
  fr: |
    Litware exécute certaines applications dans son propre centre de données et d'autres dans le cloud. Chaque utilisateur doit avoir une identité commune pour l'authentification et l'autorisation auprès de toutes les applications, où qu'elles soient hébergées.

    Quel concept répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Hybrid identity", fr: "L'identité hybride" } }
    - { id: b, text: { en: "B2B collaboration", fr: "La collaboration B2B" } }
    - { id: c, text: { en: "Managed identity", fr: "L'identité managée" } }
    - { id: d, text: { en: "Decentralized identity", fr: "L'identité décentralisée" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Microsoft's identity solutions span on-premises and cloud-based capabilities and create a common user identity for authentication and authorization to all resources, regardless of location. This is called hybrid identity. It is accomplished through provisioning and synchronization between the on-premises Active Directory and Microsoft Entra ID.
    fr: |
      Les solutions d'identité de Microsoft couvrent des fonctionnalités locales et cloud, et créent une identité d'utilisateur commune pour l'authentification et l'autorisation auprès de toutes les ressources, quel que soit leur emplacement. C'est ce qu'on appelle l'identité hybride. Elle s'obtient par le provisionnement et la synchronisation entre l'Active Directory local et Microsoft Entra ID.
  options:
    b:
      en: "B2B collaboration lets external partners and guests access the resources of the organization with their own credentials; it doesn't unify the identity of the employees."
      fr: "La collaboration B2B permet à des partenaires et à des invités externes d'accéder aux ressources de l'organisation avec leurs propres informations d'identification ; elle n'unifie pas l'identité des employés."
    c:
      en: "A managed identity is a workload identity that lets an Azure resource authenticate to other services; it isn't an identity for users."
      fr: "Une identité managée est une identité de charge de travail qui permet à une ressource Azure de s'authentifier auprès d'autres services ; ce n'est pas une identité pour des utilisateurs."
    d:
      en: "Decentralized identity is the model of verifiable credentials that users hold themselves, as in Microsoft Entra Verified ID."
      fr: "L'identité décentralisée est le modèle des justificatifs vérifiables que les utilisateurs détiennent eux-mêmes, comme dans Microsoft Entra Verified ID."
references:
  - title: Describe hybrid identity
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/4-describe-concept-of-hybrid-identity
  - title: What is hybrid identity with Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/whatis-hybrid-identity
