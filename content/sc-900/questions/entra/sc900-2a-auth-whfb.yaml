id: sc900-2a-auth-whfb
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The employees of Contoso sign in to their Windows 11 laptops with facial recognition or a PIN instead of a password. The credential is tied to the laptop.

    Which authentication method do the employees use?
  fr: |
    Les employés de Contoso se connectent à leur ordinateur portable Windows 11 par reconnaissance faciale ou avec un code PIN, au lieu d'un mot de passe. L'information d'identification est liée à l'ordinateur portable.

    Quelle méthode d'authentification les employés utilisent-ils ?
body:
  options:
    - { id: a, text: { en: "Temporary Access Pass", fr: "Passe d'accès temporaire (Temporary Access Pass)" } }
    - { id: b, text: { en: "Hardware OATH token", fr: "Jeton OATH matériel" } }
    - { id: c, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
    - { id: d, text: { en: "SMS-based authentication", fr: "Authentification par SMS" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Windows Hello for Business replaces passwords with strong two-factor authentication on the device. It combines a key or a certificate tied to the device with a PIN (something you know) or biometrics such as a fingerprint or facial recognition (something you are). An attacker would need both the device and the PIN or the biometric trait.
    fr: |
      Windows Hello Entreprise remplace les mots de passe par une authentification forte à deux facteurs sur l'appareil. Il combine une clé ou un certificat lié à l'appareil avec un code PIN (quelque chose que vous savez) ou la biométrie, comme une empreinte digitale ou la reconnaissance faciale (quelque chose que vous êtes). Un attaquant aurait besoin à la fois de l'appareil et du code PIN ou du trait biométrique.
  options:
    a:
      en: "A Temporary Access Pass is a time-limited passcode that an administrator issues, for example to onboard a user; it involves neither biometrics nor the device."
      fr: "Un passe d'accès temporaire est un code secret à durée limitée émis par un administrateur, par exemple pour intégrer un utilisateur ; il ne fait intervenir ni la biométrie ni l'appareil."
    b:
      en: "A hardware OATH token is a small device that displays one-time codes; it is used as a second factor, not to sign in to Windows with a face or a PIN."
      fr: "Un jeton OATH matériel est un petit appareil qui affiche des codes à usage unique ; il sert de second facteur, pas à se connecter à Windows avec un visage ou un code PIN."
    d:
      en: "SMS-based authentication sends a verification code to a mobile phone; the credential isn't tied to the laptop."
      fr: "L'authentification par SMS envoie un code de vérification sur un téléphone mobile ; l'information d'identification n'est pas liée à l'ordinateur portable."
references:
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
  - title: Windows Hello for Business
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/hello-for-business/
