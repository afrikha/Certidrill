id: sc900-2a-auth-methods-match
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the authentication method that it describes.

    To answer, drag the appropriate method to each description. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la méthode d'authentification qu'elle décrit.

    Pour répondre, faites glisser la méthode appropriée vers chaque description. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: passkey, text: { en: "Passkey (FIDO2)", fr: "Clé d'accès (FIDO2)" } }
    - { id: hw, text: { en: "Hardware OATH token", fr: "Jeton OATH matériel" } }
    - { id: voice, text: { en: "Voice call", fr: "Appel vocal" } }
    - { id: sms, text: { en: "SMS", fr: "SMS" } }
    - { id: tap, text: { en: "Temporary Access Pass", fr: "Passe d'accès temporaire (Temporary Access Pass)" } }
  targets:
    - id: t1
      text:
        en: "A small device displays a one-time code that is refreshed every 30 or 60 seconds"
        fr: "Un petit appareil affiche un code à usage unique actualisé toutes les 30 ou 60 secondes"
    - id: t2
      text:
        en: "A key pair is created at registration, and the credential only works on the site where it was registered"
        fr: "Une paire de clés est créée lors de l'inscription, et l'information d'identification ne fonctionne que sur le site où elle a été inscrite"
    - id: t3
      text:
        en: "The user answers the phone and presses the # key to complete the verification"
        fr: "L'utilisateur décroche son téléphone et appuie sur la touche # pour terminer la vérification"
answer:
  mapping: { t1: hw, t2: passkey, t3: voice }
explanation:
  correct:
    en: |
      A hardware OATH token is a small device that displays a time-based one-time code refreshed every 30 or 60 seconds. A passkey (FIDO2) relies on a key pair created at registration and is bound to the site where it was registered, which makes it phishing-resistant. With voice call verification, an automated call is made to the registered number and the user presses # to complete the sign-in.
    fr: |
      Un jeton OATH matériel est un petit appareil qui affiche un code à usage unique basé sur le temps, actualisé toutes les 30 ou 60 secondes. Une clé d'accès (FIDO2) repose sur une paire de clés créée lors de l'inscription et elle est liée au site où elle a été inscrite, ce qui la rend résistante au hameçonnage. Avec la vérification par appel vocal, un appel automatisé est passé au numéro inscrit et l'utilisateur appuie sur # pour terminer la connexion.
  options:
    sms:
      en: "SMS-based authentication sends a text message with a verification code that the user types; no call is answered."
      fr: "L'authentification par SMS envoie un SMS contenant un code de vérification que l'utilisateur saisit ; il n'y a aucun appel à décrocher."
    tap:
      en: "A Temporary Access Pass is a time-limited passcode issued by an administrator, not a code displayed by a device."
      fr: "Un passe d'accès temporaire est un code secret à durée limitée émis par un administrateur, pas un code affiché par un appareil."
references:
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
  - title: Authentication methods in Microsoft Entra ID - OATH tokens
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-oath-tokens
