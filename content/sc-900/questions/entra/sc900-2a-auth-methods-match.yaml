id: sc900-2a-auth-methods-match
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the authentication method that it describes.

    To answer, drag the appropriate method to each description. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la méthode d'authentification qu'elle décrit.

    Pour répondre, faites glisser la méthode appropriée vers chaque description. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: passkey, text: { en: "Passkey (FIDO2)", fr: "Clé d'accès (FIDO2)" } }
    - { id: sw, text: { en: "Software OATH token", fr: "Jeton OATH logiciel" } }
    - { id: voice, text: { en: "Voice call", fr: "Appel vocal" } }
    - { id: sms, text: { en: "SMS", fr: "SMS" } }
    - { id: tap, text: { en: "Temporary Access Pass", fr: "Passe d'accès temporaire (Temporary Access Pass)" } }
  targets:
    - id: t1
      text:
        en: "An authenticator app on the phone generates a time-based one-time code that changes at a fixed interval"
        fr: "Une application d'authentification sur le téléphone génère un code à usage unique basé sur le temps, qui change à intervalle fixe"
    - id: t2
      text:
        en: "A key pair is created at registration, and the credential only works on the site where it was registered"
        fr: "Une paire de clés est créée lors de l'inscription, et l'information d'identification ne fonctionne que sur le site où elle a été inscrite"
    - id: t3
      text:
        en: "The user answers the phone and presses the # key to complete the verification"
        fr: "L'utilisateur décroche son téléphone et appuie sur la touche # pour terminer la vérification"
answer:
  mapping: { t1: sw, t2: passkey, t3: voice }
explanation:
  correct:
    en: |
      A software OATH token is an authenticator app, such as Microsoft Authenticator, that generates time-based one-time codes, each valid for a short, fixed interval. A passkey (FIDO2) relies on a key pair created at registration and is bound to the site where it was registered, which makes it phishing-resistant. With voice call verification, an automated call is made to the registered number and the user presses # to complete the sign-in.
    fr: |
      Un jeton OATH logiciel est une application d'authentification, comme Microsoft Authenticator, qui génère des codes à usage unique basés sur le temps, chacun valable pendant un court intervalle fixe. Une clé d'accès (FIDO2) repose sur une paire de clés créée lors de l'inscription et elle est liée au site où elle a été inscrite, ce qui la rend résistante au hameçonnage. Avec la vérification par appel vocal, un appel automatisé est passé au numéro inscrit et l'utilisateur appuie sur # pour terminer la connexion.
  options:
    sms:
      en: "SMS-based authentication sends a text message with a verification code to the user, and no call is answered: the code isn't generated by an app."
      fr: "L'authentification par SMS envoie à l'utilisateur un SMS contenant un code de vérification, et il n'y a aucun appel à décrocher : le code n'est pas généré par une application."
    tap:
      en: "A Temporary Access Pass is a time-limited passcode issued by an administrator, not a code generated by an app."
      fr: "Un passe d'accès temporaire est un code secret à durée limitée émis par un administrateur, pas un code généré par une application."
references:
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
  - title: Authentication methods in Microsoft Entra ID - OATH tokens
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-oath-tokens
