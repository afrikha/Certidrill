id: sc900-2b-ca-signin-sequence
objective: "2.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A Conditional Access policy requires multifactor authentication for all the users who access an application named **App1**.

    A user who isn't signed in yet opens App1.

    Which four events occur in sequence? To answer, move the appropriate events from the list of events to the answer area and arrange them in the correct order.
  fr: |
    Une stratégie d'accès conditionnel exige l'authentification multifacteur pour tous les utilisateurs qui accèdent à une application nommée **App1**.

    Un utilisateur qui n'est pas encore connecté ouvre App1.

    Quels sont les quatre événements qui se produisent, dans l'ordre ? Pour répondre, déplacez les événements appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: approve, text: { en: "An administrator approves the sign-in request.", fr: "Un administrateur approuve la demande de connexion." } }
    - { id: mfa, text: { en: "The user is prompted for multifactor authentication and completes it.", fr: "L'utilisateur est invité à effectuer l'authentification multifacteur et la réussit." } }
    - { id: first, text: { en: "The user completes first-factor authentication with a username and a password.", fr: "L'utilisateur réussit l'authentification du premier facteur avec un nom d'utilisateur et un mot de passe." } }
    - { id: access, text: { en: "Access to App1 is granted.", fr: "L'accès à App1 est accordé." } }
    - { id: reset, text: { en: "The user resets the password by using self-service password reset.", fr: "L'utilisateur réinitialise son mot de passe avec la réinitialisation de mot de passe en libre-service." } }
    - { id: eval, text: { en: "Conditional Access evaluates the signals of the sign-in against the policy.", fr: "L'accès conditionnel évalue les signaux de la connexion par rapport à la stratégie." } }
answer:
  sequence: [ first, eval, mfa, access ]
explanation:
  correct:
    en: |
      Conditional Access policies are enforced after first-factor authentication is completed, so the user first proves the password. Conditional Access then collects the details of the session and evaluates them against the policies that apply. Because the policy requires multifactor authentication, the user is prompted for it, and access is granted once every requirement is satisfied.
    fr: |
      Les stratégies d'accès conditionnel sont appliquées une fois l'authentification du premier facteur terminée : l'utilisateur prouve donc d'abord son mot de passe. L'accès conditionnel collecte ensuite les détails de la session et les évalue par rapport aux stratégies qui s'appliquent. Comme la stratégie exige l'authentification multifacteur, l'utilisateur y est invité, et l'accès est accordé une fois toutes les exigences satisfaites.
  options:
    approve: { en: "Conditional Access decides automatically from signals; no administrator approves individual sign-ins.", fr: "L'accès conditionnel décide automatiquement à partir de signaux ; aucun administrateur n'approuve chaque connexion." }
    reset: { en: "A password reset isn't part of a sign-in that only requires multifactor authentication.", fr: "Une réinitialisation de mot de passe ne fait pas partie d'une connexion qui exige seulement l'authentification multifacteur." }
references:
  - title: Build a Conditional Access policy
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-policies
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
