id: sc900-2c-pim-characteristics-match
objective: "2.4.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each description to the characteristic of Microsoft Entra Privileged Identity Management that it illustrates.

    To answer, drag the appropriate characteristic to each description. Each characteristic may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la caractéristique de Microsoft Entra Privileged Identity Management qu'elle illustre.

    Pour répondre, faites glisser la caractéristique appropriée vers chaque description. Chaque caractéristique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: approval, text: { en: "Approval-based", fr: "Basé sur l'approbation" } }
    - { id: auditable, text: { en: "Auditable", fr: "Auditable" } }
    - { id: timebound, text: { en: "Time-bound", fr: "Limité dans le temps" } }
    - { id: visible, text: { en: "Visible", fr: "Visible" } }
    - { id: risk, text: { en: "Risk-based", fr: "Basé sur les risques" } }
  targets:
    - id: t1
      text: { en: "A role assignment has a start date and an end date.", fr: "Une attribution de rôle a une date de début et une date de fin." }
    - id: t2
      text: { en: "The complete history of privileged access can be downloaded.", fr: "L'historique complet des accès privilégiés peut être téléchargé." }
    - id: t3
      text: { en: "A designated person must accept the request before the role is activated.", fr: "Une personne désignée doit accepter la demande avant que le rôle soit activé." }
    - id: t4
      text: { en: "Emails are sent when privileged roles are activated.", fr: "Des e-mails sont envoyés quand des rôles privilégiés sont activés." }
answer:
  mapping: { t1: timebound, t2: auditable, t3: approval, t4: visible }
explanation:
  correct:
    en: "PIM is time-bound because assignments carry start and end dates, auditable because an audit history can be downloaded for internal or external audits, approval-based because an approval can be required to activate a role, and visible because notifications are sent when privileged roles are activated."
    fr: "PIM est limité dans le temps car les attributions portent des dates de début et de fin, auditable car un historique d'audit peut être téléchargé pour les audits internes ou externes, basé sur l'approbation car une approbation peut être exigée pour activer un rôle, et visible car des notifications sont envoyées quand des rôles privilégiés sont activés."
  options:
    risk:
      en: "Risk-based describes the Conditional Access policies that use the risk calculated by ID Protection; it isn't a characteristic of PIM."
      fr: "« Basé sur les risques » décrit les stratégies d'accès conditionnel qui utilisent le risque calculé par Protection Microsoft Entra ID ; ce n'est pas une caractéristique de PIM."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
