id: sc900-2a-ident-m365-group
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A project team at Litware needs a shared mailbox, a shared calendar, shared files and a SharePoint site.

    What should you create in Microsoft Entra ID for the team?
  fr: |
    Une équipe projet de Litware a besoin d'une boîte aux lettres partagée, d'un calendrier partagé, de fichiers partagés et d'un site SharePoint.

    Que devez-vous créer dans Microsoft Entra ID pour cette équipe ?
body:
  options:
    - { id: a, text: { en: "A security group", fr: "Un groupe de sécurité" } }
    - { id: b, text: { en: "An administrative unit", fr: "Une unité administrative" } }
    - { id: c, text: { en: "A user-assigned managed identity", fr: "Une identité managée affectée par l'utilisateur" } }
    - { id: d, text: { en: "A Microsoft 365 group", fr: "Un groupe Microsoft 365" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Microsoft 365 group is used for collaboration: its members get access to a shared mailbox, a calendar, files and SharePoint sites. Its members can only be users, including users outside the organization.
    fr: |
      Un groupe Microsoft 365 sert à la collaboration : ses membres ont accès à une boîte aux lettres partagée, à un calendrier, à des fichiers et à des sites SharePoint. Ses membres ne peuvent être que des utilisateurs, y compris des utilisateurs extérieurs à l'organisation.
  options:
    a:
      en: "A security group manages the access of users and devices to shared resources; it doesn't come with a mailbox, a calendar or a SharePoint site."
      fr: "Un groupe de sécurité gère l'accès des utilisateurs et des appareils à des ressources partagées ; il ne s'accompagne ni d'une boîte aux lettres, ni d'un calendrier, ni d'un site SharePoint."
    b:
      en: "An administrative unit restricts the scope of an administrative role to a part of the directory; it provides no collaboration resource."
      fr: "Une unité administrative limite l'étendue d'un rôle d'administration à une partie de l'annuaire ; elle ne fournit aucune ressource de collaboration."
    c:
      en: "A managed identity is a workload identity for Azure resources, not a way to group people."
      fr: "Une identité managée est une identité de charge de travail pour des ressources Azure, pas un moyen de regrouper des personnes."
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
  - title: Learn about group types, membership types, and access management
    url: https://learn.microsoft.com/en-us/entra/fundamentals/concept-learn-about-groups
