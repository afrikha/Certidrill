id: sc900-2a-entra-id-sentences
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Entra ID is Microsoft's cloud-based [[kind]] service.

      An instance of Microsoft Entra ID that holds the information of a single organization is [[instance]].

      Administrators configure and manage the Microsoft Entra products in [[portal]].
    fr: |
      Microsoft Entra ID est le service cloud de [[kind]] de Microsoft.

      Une instance de Microsoft Entra ID qui contient les informations d'une seule organisation est [[instance]].

      Les administrateurs configurent et gèrent les produits Microsoft Entra dans [[portal]].
  slots:
    - id: kind
      options:
        - { id: siem, text: { en: "security information and event management", fr: "gestion des informations et des événements de sécurité" } }
        - { id: iam, text: { en: "identity and access management", fr: "gestion des identités et des accès" } }
        - { id: mdm, text: { en: "mobile device management", fr: "gestion des appareils mobiles" } }
    - id: instance
      options:
        - { id: sub, text: { en: "a subscription", fr: "un abonnement" } }
        - { id: mg, text: { en: "a management group", fr: "un groupe d'administration" } }
        - { id: tenant, text: { en: "a tenant", fr: "un locataire" } }
    - id: portal
      options:
        - { id: entra, text: { en: "the Microsoft Entra admin center", fr: "le Centre d'administration Microsoft Entra" } }
        - { id: purview, text: { en: "the Microsoft Purview portal", fr: "le portail Microsoft Purview" } }
        - { id: defender, text: { en: "the Microsoft Defender portal", fr: "le portail Microsoft Defender" } }
answer:
  values: { kind: iam, instance: tenant, portal: entra }
explanation:
  correct:
    en: |
      Microsoft Entra ID is the cloud-based identity and access management service of Microsoft: it authenticates identities and controls their access to resources. A tenant is an instance of Microsoft Entra ID for one organization, with its users, groups, devices and application registrations. The Microsoft Entra admin center is the web portal in which all the Microsoft Entra products are configured and managed.
    fr: |
      Microsoft Entra ID est le service cloud de gestion des identités et des accès de Microsoft : il authentifie les identités et contrôle leur accès aux ressources. Un locataire est une instance de Microsoft Entra ID pour une organisation, avec ses utilisateurs, ses groupes, ses appareils et ses inscriptions d'applications. Le Centre d'administration Microsoft Entra est le portail web dans lequel tous les produits Microsoft Entra se configurent et se gèrent.
  options:
    siem:
      en: "Security information and event management is the role of Microsoft Sentinel, which collects and analyzes security data."
      fr: "La gestion des informations et des événements de sécurité est le rôle de Microsoft Sentinel, qui collecte et analyse des données de sécurité."
    sub:
      en: "A subscription is an agreement to use a Microsoft cloud service; it relies on a tenant but isn't an instance of Microsoft Entra ID."
      fr: "Un abonnement est un accord d'utilisation d'un service cloud Microsoft ; il s'appuie sur un locataire mais n'est pas une instance de Microsoft Entra ID."
    purview:
      en: "The Microsoft Purview portal is used for data security, data governance and compliance solutions."
      fr: "Le portail Microsoft Purview sert aux solutions de sécurité des données, de gouvernance des données et de conformité."
references:
  - title: Describe Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/2-describe-azure-active-directory
  - title: Describe Microsoft Entra
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/1a-describe-microsoft-entra
