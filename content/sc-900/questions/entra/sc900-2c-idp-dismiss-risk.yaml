id: sc900-2c-idp-dismiss-risk
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Microsoft Entra ID Protection reports a user of Northwind Traders as a risky user. After an investigation, an administrator concludes that the account isn't compromised: the detections came from a business trip of the user.

    The administrator must close the risk without requiring any action from the user. What should the administrator do?
  fr: |
    Protection Microsoft Entra ID signale un utilisateur de Northwind Traders comme utilisateur à risque. Après examen, un administrateur conclut que le compte n'est pas compromis : les détections provenaient d'un déplacement professionnel de l'utilisateur.

    L'administrateur doit clore le risque sans exiger aucune action de l'utilisateur. Que doit faire l'administrateur ?
body:
  options:
    - id: a
      text: { en: "Confirm that the user is compromised", fr: "Confirmer que l'utilisateur est compromis" }
    - id: b
      text: { en: "Reset the password of the user", fr: "Réinitialiser le mot de passe de l'utilisateur" }
    - id: c
      text: { en: "Block the user from signing in", fr: "Bloquer la connexion de l'utilisateur" }
    - id: d
      text: { en: "Dismiss the user risk", fr: "Rejeter le risque utilisateur" }
answer: { optionId: d }
explanation:
  correct:
    en: "When an investigation shows that the detections are false positives, an administrator dismisses the user risk. The risk state changes from at risk to dismissed, the password isn't changed, and the user isn't asked for anything."
    fr: "Quand l'examen montre que les détections sont des faux positifs, un administrateur rejette le risque utilisateur. L'état du risque passe d'« à risque » à « rejeté », le mot de passe n'est pas modifié, et rien n'est demandé à l'utilisateur."
  options:
    a:
      en: "Confirming the compromise states the opposite of the conclusion and keeps the account at risk until it is remediated."
      fr: "Confirmer la compromission affirme l'inverse de la conclusion et maintient le compte à risque jusqu'à sa correction."
    b:
      en: "A password reset remediates the risk, but the user receives a temporary password and must change it at the next sign-in."
      fr: "Une réinitialisation du mot de passe corrige le risque, mais l'utilisateur reçoit un mot de passe temporaire et doit le changer à la connexion suivante."
    c:
      en: "Blocking sign-in stops a legitimate user from working and doesn't close the risk."
      fr: "Bloquer la connexion empêche un utilisateur légitime de travailler et ne clôt pas le risque."
references:
  - title: Remediate risks and unblock users
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
