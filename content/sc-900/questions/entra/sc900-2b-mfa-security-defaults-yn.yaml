id: sc900-2b-mfa-security-defaults-yn
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about security defaults in Microsoft Entra ID, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les paramètres de sécurité par défaut de Microsoft Entra ID, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Security defaults are available in a tenant that uses only Microsoft Entra ID Free licenses."
        fr: "Les paramètres de sécurité par défaut sont disponibles dans un locataire qui n'utilise que des licences Microsoft Entra ID Free."
    - id: s2
      text:
        en: "Security defaults let an administrator select the applications for which multifactor authentication is required."
        fr: "Les paramètres de sécurité par défaut permettent à un administrateur de sélectionner les applications pour lesquelles l'authentification multifacteur est exigée."
    - id: s3
      text:
        en: "Security defaults are enabled when a new Microsoft Entra tenant is created."
        fr: "Les paramètres de sécurité par défaut sont activés à la création d'un nouveau locataire Microsoft Entra."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Security defaults require no license: they are offered to every tenant, including those on the free tier. They can't be customized: they are on or off for the whole tenant, and choosing the applications, users or locations that require multifactor authentication is the role of Conditional Access. Microsoft turns security defaults on for new tenants when they are created."
    fr: "Les paramètres de sécurité par défaut ne demandent aucune licence : ils sont proposés à tous les locataires, y compris ceux du niveau gratuit. Ils ne se personnalisent pas : ils sont activés ou désactivés pour tout le locataire, et choisir les applications, les utilisateurs ou les emplacements qui exigent l'authentification multifacteur est le rôle de l'accès conditionnel. Microsoft active les paramètres de sécurité par défaut sur les nouveaux locataires dès leur création."
references:
  - title: Security defaults in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
  - title: Describe multifactor authentication
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/3-describe-multi-factor-authentication
