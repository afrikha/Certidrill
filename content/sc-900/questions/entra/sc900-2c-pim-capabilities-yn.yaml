id: sc900-2c-pim-capabilities-yn
objective: "2.4.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra Privileged Identity Management (PIM), select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Entra Privileged Identity Management (PIM), sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "PIM can require an approval before a user activates a privileged role."
        fr: "PIM peut exiger une approbation avant qu'un utilisateur active un rôle privilégié."
    - id: s2
      text:
        en: "PIM can send notifications when privileged roles are activated."
        fr: "PIM peut envoyer des notifications quand des rôles privilégiés sont activés."
    - id: s3
      text:
        en: "PIM analyzes sign-ins to detect the accounts whose credentials were leaked."
        fr: "PIM analyse les connexions pour détecter les comptes dont les informations d'identification ont été divulguées."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "PIM can require approval to activate privileged roles and sends notifications when those roles are activated, which makes privileged access approval-based and visible. Detecting leaked credentials and risky sign-ins is the job of Microsoft Entra ID Protection; PIM limits when and for how long a privileged role can be used."
    fr: "PIM peut exiger une approbation pour activer les rôles privilégiés et envoie des notifications quand ces rôles sont activés : l'accès privilégié est ainsi basé sur l'approbation et visible. Détecter les informations d'identification divulguées et les connexions à risque est le rôle de Protection Microsoft Entra ID ; PIM limite quand et pendant combien de temps un rôle privilégié est utilisable."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
