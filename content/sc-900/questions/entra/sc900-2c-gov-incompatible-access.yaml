id: sc900-2c-gov-incompatible-access
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses entitlement management with two access packages named **Payment creators** and **Payment approvers**. A user who already has Payment creators must be prevented from requesting Payment approvers.

    What should Woodgrove Bank configure on the Payment approvers access package?
  fr: |
    Woodgrove Bank utilise la gestion des droits d'utilisation avec deux packages d'accès nommés **Payment creators** et **Payment approvers**. Un utilisateur qui possède déjà Payment creators ne doit pas pouvoir demander Payment approvers.

    Que doit configurer Woodgrove Bank sur le package d'accès Payment approvers ?
body:
  options:
    - id: a
      text: { en: "An approval in several stages", fr: "Une approbation en plusieurs étapes" }
    - id: b
      text: { en: "An expiration date for assignments", fr: "Une date d'expiration des attributions" }
    - id: c
      text: { en: "An access review of assignments", fr: "Une révision d'accès des attributions" }
    - id: d
      text: { en: "A separation of duties check", fr: "Une vérification de séparation des tâches" }
answer: { optionId: d }
explanation:
  correct:
    en: "Separation of duties checks mark an access package as incompatible with another access package or with a group. A user who already holds the incompatible access can't request the package, which prevents one person from accumulating conflicting rights such as creating and approving payments."
    fr: "Les vérifications de séparation des tâches marquent un package d'accès comme incompatible avec un autre package d'accès ou avec un groupe. Un utilisateur qui détient déjà l'accès incompatible ne peut pas demander le package, ce qui empêche une même personne de cumuler des droits en conflit, comme créer et approuver des paiements."
  options:
    a:
      en: "An approval in several stages adds approvers, but an approver could still accept the request; it doesn't prevent the request."
      fr: "Une approbation en plusieurs étapes ajoute des approbateurs, mais un approbateur pourrait encore accepter la demande ; elle n'empêche pas la demande."
    b:
      en: "An expiration date ends an assignment after a period; it doesn't stop a user from holding both packages at the same time."
      fr: "Une date d'expiration met fin à une attribution après un délai ; elle n'empêche pas un utilisateur de détenir les deux packages en même temps."
    c:
      en: "An access review checks afterward whether users still need the package; the conflicting access would already have been granted."
      fr: "Une révision d'accès vérifie après coup si les utilisateurs ont encore besoin du package ; l'accès en conflit aurait déjà été accordé."
references:
  - title: Configure separation of duties checks for an access package in entitlement management
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-access-package-incompatible
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
