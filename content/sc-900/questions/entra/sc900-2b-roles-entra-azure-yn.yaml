id: sc900-2b-roles-entra-azure-yn
objective: "2.3.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant and an Azure subscription that trusts the tenant.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un locataire Microsoft Entra et d'un abonnement Azure qui approuve ce locataire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "By default, the Global Administrator role grants access to the virtual machines of the Azure subscription."
        fr: "Par défaut, le rôle Global Administrator donne accès aux machines virtuelles de l'abonnement Azure."
    - id: s2
      text:
        en: "The Owner role on the Azure subscription lets a user create user accounts in Microsoft Entra ID."
        fr: "Le rôle Owner sur l'abonnement Azure permet à un utilisateur de créer des comptes d'utilisateurs dans Microsoft Entra ID."
    - id: s3
      text:
        en: "A Global Administrator can elevate their access to manage access to all the Azure subscriptions of the tenant."
        fr: "Un Global Administrator peut élever son accès pour gérer l'accès à tous les abonnements Azure du locataire."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "Microsoft Entra roles and Azure roles are separate systems that don't span each other by default: a Global Administrator manages Microsoft Entra ID and Microsoft 365 services but has no access to Azure resources, and the Owner of a subscription manages Azure resources but not Microsoft Entra users. A Global Administrator can, however, turn on the elevation of access, which grants the User Access Administrator Azure role on all the subscriptions of the tenant."
    fr: "Les rôles Microsoft Entra et les rôles Azure sont des systèmes distincts qui, par défaut, ne se recoupent pas : un Global Administrator gère Microsoft Entra ID et les services Microsoft 365 mais n'a aucun accès aux ressources Azure, et l'Owner d'un abonnement gère les ressources Azure mais pas les utilisateurs Microsoft Entra. Un Global Administrator peut toutefois activer l'élévation de l'accès, qui lui accorde le rôle Azure User Access Administrator sur tous les abonnements du locataire."
references:
  - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
