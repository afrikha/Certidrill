id: sc900-2b-ca-auth-strength
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso wants its administrators to access the Microsoft Entra admin center only after they sign in with a phishing-resistant method, such as a passkey (FIDO2) or Windows Hello for Business. A sign-in with a password followed by a text message must not be accepted.

    Which grant control should Contoso select in the Conditional Access policy?
  fr: |
    Contoso veut que ses administrateurs n'accèdent au Centre d'administration Microsoft Entra qu'après s'être connectés avec une méthode résistante au hameçonnage, comme une clé d'accès (FIDO2) ou Windows Hello Entreprise. Une connexion par mot de passe suivi d'un SMS ne doit pas être acceptée.

    Quel contrôle d'octroi Contoso doit-elle sélectionner dans la stratégie d'accès conditionnel ?
body:
  options:
    - id: a
      text: { en: "Require multifactor authentication", fr: "Exiger l'authentification multifacteur" }
    - id: b
      text: { en: "Require authentication strength", fr: "Exiger une force d'authentification" }
    - id: c
      text: { en: "Require password change", fr: "Exiger un changement de mot de passe" }
    - id: d
      text: { en: "Require device to be marked as compliant", fr: "Exiger que l'appareil soit marqué comme conforme" }
answer: { optionId: b }
explanation:
  correct:
    en: "An authentication strength specifies which combinations of authentication methods are accepted. The built-in phishing-resistant MFA strength accepts only methods such as Windows Hello for Business, FIDO2 passkeys and certificate-based authentication, so a password followed by a text message doesn't satisfy the policy."
    fr: "Une force d'authentification précise quelles combinaisons de méthodes d'authentification sont acceptées. La force intégrée MFA résistante au hameçonnage n'accepte que des méthodes comme Windows Hello Entreprise, les clés d'accès FIDO2 et l'authentification basée sur un certificat : un mot de passe suivi d'un SMS ne satisfait donc pas la stratégie."
  options:
    a:
      en: "Require multifactor authentication is satisfied by any method that completes MFA, including a password followed by a text message."
      fr: "Exiger l'authentification multifacteur est satisfait par toute méthode qui complète la MFA, y compris un mot de passe suivi d'un SMS."
    c:
      en: "Require password change is used with user risk to make a user set a new password; it doesn't select the sign-in methods."
      fr: "Exiger un changement de mot de passe s'utilise avec le risque utilisateur pour faire définir un nouveau mot de passe ; il ne sélectionne pas les méthodes de connexion."
    d:
      en: "A compliant device is a condition on the device, not on the authentication method that the user presents."
      fr: "Un appareil conforme est une condition sur l'appareil, pas sur la méthode d'authentification que l'utilisateur présente."
references:
  - title: Describe Conditional Access
    url: https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/2-describe-conditional-access-azure-ad
  - title: "Conditional Access: Grant"
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant
