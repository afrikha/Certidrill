id: sc900-2a-entra-family-match
objective: "2.1.1"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Match each description to the product of the Microsoft Entra family that it describes.

    To answer, drag the appropriate product to each description. Each product may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description au produit de la famille Microsoft Entra qu'elle décrit.

    Pour répondre, faites glisser le produit approprié vers chaque description. Chaque produit peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: extid, text: Microsoft Entra External ID }
    - { id: verid, text: Microsoft Entra Verified ID }
    - { id: priv, text: Microsoft Entra Private Access }
    - { id: inet, text: Microsoft Entra Internet Access }
    - { id: wid, text: Microsoft Entra Workload ID }
  targets:
    - id: t1
      text:
        en: "Issues digital credentials, based on open decentralized identity standards, that a third party can verify independently"
        fr: "Émet des justificatifs numériques, fondés sur des standards ouverts d'identité décentralisée, qu'un tiers peut vérifier de façon indépendante"
    - id: t2
      text:
        en: "Gives remote employees access to the applications of the corporate network without a VPN"
        fr: "Donne aux employés distants l'accès aux applications du réseau d'entreprise sans VPN"
    - id: t3
      text:
        en: "Secures the access of employees to internet resources and SaaS applications, with web content filtering"
        fr: "Sécurise l'accès des employés aux ressources Internet et aux applications SaaS, avec un filtrage du contenu web"
answer:
  mapping: { t1: verid, t2: priv, t3: inet }
explanation:
  correct:
    en: |
      Microsoft Entra Verified ID is a credential verification service based on open decentralized identity standards: an organization issues verifiable credentials that users keep and present. Microsoft Entra Private Access secures access to private applications and resources, such as those of the corporate network, without a VPN. Microsoft Entra Internet Access secures access to internet resources, including SaaS applications and Microsoft 365, and lets administrators filter web content.
    fr: |
      Microsoft Entra Verified ID est un service de vérification de justificatifs fondé sur des standards ouverts d'identité décentralisée : une organisation émet des justificatifs vérifiables que les utilisateurs conservent et présentent. Microsoft Entra Private Access sécurise l'accès aux applications et aux ressources privées, comme celles du réseau d'entreprise, sans VPN. Microsoft Entra Internet Access sécurise l'accès aux ressources Internet, y compris les applications SaaS et Microsoft 365, et permet aux administrateurs de filtrer le contenu web.
  options:
    extid:
      en: "Microsoft Entra External ID gives partners, guests and customers access to applications and resources; it concerns people outside the organization."
      fr: "Microsoft Entra External ID donne aux partenaires, aux invités et aux clients l'accès aux applications et aux ressources ; il concerne des personnes extérieures à l'organisation."
    wid:
      en: "Microsoft Entra Workload ID manages the identities and the access of applications, services and containers, not the access of employees."
      fr: "Microsoft Entra Workload ID gère les identités et les accès des applications, des services et des conteneurs, pas l'accès des employés."
references:
  - title: Describe Microsoft Entra
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/1a-describe-microsoft-entra
