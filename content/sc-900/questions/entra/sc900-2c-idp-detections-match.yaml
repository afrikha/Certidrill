id: sc900-2c-idp-detections-match
objective: "2.4.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the Microsoft Entra ID Protection risk detection that it describes.

    To answer, drag the appropriate risk detection to each description. Each risk detection may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description à la détection de risque de Protection Microsoft Entra ID qu'elle décrit.

    Pour répondre, faites glisser la détection de risque appropriée vers chaque description. Chaque détection de risque peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: spray, text: { en: "Password spray", fr: "Pulvérisation de mots de passe" } }
    - { id: travel, text: { en: "Atypical travel", fr: "Voyage atypique" } }
    - { id: leaked, text: { en: "Leaked credentials", fr: "Informations d'identification divulguées" } }
    - { id: anon, text: { en: "Anonymous IP address", fr: "Adresse IP anonyme" } }
    - { id: reported, text: { en: "User reported suspicious activity", fr: "L'utilisateur a signalé une activité suspecte" } }
  targets:
    - id: t1
      text: { en: "A sign-in comes from a Tor browser or from an anonymizing VPN.", fr: "Une connexion provient d'un navigateur Tor ou d'un VPN d'anonymisation." }
    - id: t2
      text: { en: "The valid user name and password of a user are found in a known data breach.", fr: "Le nom d'utilisateur et le mot de passe valides d'un utilisateur sont trouvés dans une fuite de données connue." }
    - id: t3
      text: { en: "Two sign-ins of the same user come from geographically distant locations, at least one of which is unusual for the user.", fr: "Deux connexions du même utilisateur proviennent d'emplacements géographiquement éloignés, dont l'un au moins est inhabituel pour l'utilisateur." }
    - id: t4
      text: { en: "An attacker tries a few common passwords against many accounts and finds a valid one.", fr: "Un attaquant essaie quelques mots de passe courants sur de nombreux comptes et en trouve un valide." }
answer:
  mapping: { t1: anon, t2: leaked, t3: travel, t4: spray }
explanation:
  correct:
    en: "Anonymous IP address flags a sign-in from an address that hides the identity or the location of its user, such as Tor or an anonymous VPN. Leaked credentials means that valid credentials of the user were found in a breach. Atypical travel identifies two sign-ins from distant locations when at least one is atypical for the user. Password spray is an attack in which common passwords are tried against many identities."
    fr: "Adresse IP anonyme signale une connexion depuis une adresse qui masque l'identité ou l'emplacement de son utilisateur, comme Tor ou un VPN anonyme. Informations d'identification divulguées signifie que des informations d'identification valides de l'utilisateur ont été trouvées dans une fuite. Voyage atypique identifie deux connexions depuis des emplacements éloignés quand l'un au moins est atypique pour l'utilisateur. La pulvérisation de mots de passe est une attaque où des mots de passe courants sont essayés sur de nombreuses identités."
  options:
    reported:
      en: "This detection is raised when a user denies a multifactor authentication prompt and reports it as suspicious; none of the descriptions mentions such a report."
      fr: "Cette détection est déclenchée quand un utilisateur refuse une demande d'authentification multifacteur et la signale comme suspecte ; aucune des descriptions ne mentionne un tel signalement."
references:
  - title: What are risk detections?
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
