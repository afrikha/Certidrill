id: sc900-2b-roles-entra-azure-sentence
objective: "2.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[vm]] grant permissions to manage resources such as virtual machines and storage accounts.

      [[users]] grant permissions to manage resources such as users, groups and applications.

      Global Administrator and User Administrator are [[examples]].
    fr: |
      [[vm]] accordent des autorisations de gestion de ressources comme les machines virtuelles et les comptes de stockage.

      [[users]] accordent des autorisations de gestion de ressources comme les utilisateurs, les groupes et les applications.

      Global Administrator et User Administrator sont [[examples]].
  slots:
    - id: vm
      options:
        - { id: entra, text: { en: "Microsoft Entra roles", fr: "Les rôles Microsoft Entra" } }
        - { id: azure, text: { en: "Azure roles", fr: "Les rôles Azure" } }
        - { id: defaults, text: { en: "Security defaults", fr: "Les paramètres de sécurité par défaut" } }
    - id: users
      options:
        - { id: entra, text: { en: "Microsoft Entra roles", fr: "Les rôles Microsoft Entra" } }
        - { id: azure, text: { en: "Azure roles", fr: "Les rôles Azure" } }
        - { id: defaults, text: { en: "Security defaults", fr: "Les paramètres de sécurité par défaut" } }
    - id: examples
      options:
        - { id: entra, text: { en: "Microsoft Entra roles", fr: "des rôles Microsoft Entra" } }
        - { id: azure, text: { en: "Azure roles", fr: "des rôles Azure" } }
        - { id: defaults, text: { en: "security defaults", fr: "des paramètres de sécurité par défaut" } }
answer:
  values: { vm: azure, users: entra, examples: entra }
explanation:
  correct:
    en: "Azure roles, managed by Azure role-based access control, control access to Azure resources such as virtual machines and storage; Owner, Contributor and Reader are Azure roles. Microsoft Entra roles control access to Microsoft Entra resources such as users, groups and applications; Global Administrator and User Administrator are Microsoft Entra roles. The two systems are separate."
    fr: "Les rôles Azure, gérés par le contrôle d'accès en fonction du rôle Azure, contrôlent l'accès aux ressources Azure comme les machines virtuelles et le stockage ; Owner, Contributor et Reader sont des rôles Azure. Les rôles Microsoft Entra contrôlent l'accès aux ressources Microsoft Entra comme les utilisateurs, les groupes et les applications ; Global Administrator et User Administrator sont des rôles Microsoft Entra. Les deux systèmes sont distincts."
  options:
    defaults:
      en: "Security defaults are a baseline of identity protections, such as mandatory multifactor authentication; they grant no management permission."
      fr: "Les paramètres de sécurité par défaut sont un socle de protections des identités, comme l'authentification multifacteur obligatoire ; ils n'accordent aucune autorisation de gestion."
references:
  - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
  - title: Describe Microsoft Entra roles and role-based access control (RBAC)
    url: https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/3-describe-azure-role-based-access-control
