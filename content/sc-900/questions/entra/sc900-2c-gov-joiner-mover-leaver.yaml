id: sc900-2c-gov-joiner-mover-leaver
objective: "2.4.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Lifecycle workflows in Microsoft Entra ID Governance automate tasks for three categories of users.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les workflows de cycle de vie de Gouvernance Microsoft Entra ID automatisent des tâches pour trois catégories d'utilisateurs.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      An employee who is transferred from the marketing department to the sales department is [[c1]].

      An employee who retires next month and whose access must be removed is [[c2]].

      A person who is hired and needs an account and access on the first day is [[c3]].
    fr: |
      Un employé muté du service marketing au service commercial correspond à [[c1]].

      Un employé qui prend sa retraite le mois prochain et dont l'accès doit être retiré correspond à [[c2]].

      Une personne embauchée, qui a besoin d'un compte et d'un accès dès le premier jour, correspond à [[c3]].
  slots:
    - id: c1
      options:
        - { id: joiner, text: { en: "a joiner", fr: "une arrivée (joiner)" } }
        - { id: mover, text: { en: "a mover", fr: "un changement de poste (mover)" } }
        - { id: leaver, text: { en: "a leaver", fr: "un départ (leaver)" } }
    - id: c2
      options:
        - { id: joiner, text: { en: "a joiner", fr: "une arrivée (joiner)" } }
        - { id: mover, text: { en: "a mover", fr: "un changement de poste (mover)" } }
        - { id: leaver, text: { en: "a leaver", fr: "un départ (leaver)" } }
    - id: c3
      options:
        - { id: joiner, text: { en: "a joiner", fr: "une arrivée (joiner)" } }
        - { id: mover, text: { en: "a mover", fr: "un changement de poste (mover)" } }
        - { id: leaver, text: { en: "a leaver", fr: "un départ (leaver)" } }
answer:
  values: { c1: mover, c2: leaver, c3: joiner }
explanation:
  correct:
    en: "A mover is a person who moves between boundaries inside the organization and may need more or different access, like an employee who goes from marketing to sales. A leaver leaves the scope of needing access, for example by retiring, so access has to be removed. A joiner enters the scope of needing access, like a new employee."
    fr: "Un changement de poste (mover) concerne une personne qui franchit une limite interne de l'organisation et peut avoir besoin d'un accès supplémentaire ou différent, comme un employé qui passe du marketing au commercial. Un départ (leaver) concerne une personne qui n'a plus besoin d'accès, par exemple parce qu'elle prend sa retraite : l'accès doit être retiré. Une arrivée (joiner) concerne une personne qui commence à avoir besoin d'un accès, comme un nouvel employé."
references:
  - title: What are lifecycle workflows?
    url: https://learn.microsoft.com/en-us/entra/id-governance/what-are-lifecycle-workflows
