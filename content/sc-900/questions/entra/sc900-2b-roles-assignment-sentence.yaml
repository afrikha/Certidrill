id: sc900-2b-roles-assignment-sentence
objective: "2.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentence about role assignments in Microsoft Entra ID, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase sur les attributions de rôles dans Microsoft Entra ID, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Microsoft Entra ID, a role assignment attaches [[what]] to [[who]] at [[where]].
    fr: |
      Dans Microsoft Entra ID, une attribution de rôle rattache [[what]] à [[who]] pour [[where]].
  slots:
    - id: what
      options:
        - { id: package, text: { en: "an access package", fr: "un package d'accès" } }
        - { id: definition, text: { en: "a role definition", fr: "une définition de rôle" } }
        - { id: policy, text: { en: "a Conditional Access policy", fr: "une stratégie d'accès conditionnel" } }
    - id: who
      options:
        - { id: principal, text: { en: "a security principal", fr: "un principal de sécurité" } }
        - { id: rg, text: { en: "a resource group", fr: "un groupe de ressources" } }
        - { id: license, text: { en: "a license", fr: "une licence" } }
    - id: where
      options:
        - { id: location, text: { en: "a particular location", fr: "un emplacement donné" } }
        - { id: session, text: { en: "a particular session", fr: "une session donnée" } }
        - { id: scope, text: { en: "a particular scope", fr: "une étendue donnée" } }
answer:
  values: { what: definition, who: principal, where: scope }
explanation:
  correct:
    en: "A role assignment has three elements. The role definition is the collection of permissions. The security principal is the identity that receives them: a user, a group or a service principal. The scope limits where the permissions apply: the whole tenant, an administrative unit or a single Microsoft Entra resource such as one application. Access is granted by creating a role assignment and revoked by removing it."
    fr: "Une attribution de rôle comporte trois éléments. La définition de rôle est l'ensemble des autorisations. Le principal de sécurité est l'identité qui les reçoit : un utilisateur, un groupe ou un principal de service. L'étendue limite l'endroit où les autorisations s'appliquent : tout le locataire, une unité administrative ou une seule ressource Microsoft Entra, comme une application. L'accès s'accorde en créant une attribution de rôle et se révoque en la supprimant."
  options:
    package:
      en: "An access package bundles resources that users request through entitlement management; it isn't part of a role assignment."
      fr: "Un package d'accès regroupe des ressources que les utilisateurs demandent par la gestion des droits d'utilisation ; il ne fait pas partie d'une attribution de rôle."
    policy:
      en: "A Conditional Access policy sets the conditions of a sign-in; it isn't attached by a role assignment."
      fr: "Une stratégie d'accès conditionnel fixe les conditions d'une connexion ; elle n'est pas rattachée par une attribution de rôle."
    rg:
      en: "A resource group is a container of Azure resources, not an identity that receives permissions."
      fr: "Un groupe de ressources est un conteneur de ressources Azure, pas une identité qui reçoit des autorisations."
    license:
      en: "A license gives the right to use a product; it isn't an identity."
      fr: "Une licence donne le droit d'utiliser un produit ; ce n'est pas une identité."
    location:
      en: "Locations are used by Conditional Access, not by role assignments."
      fr: "Les emplacements sont utilisés par l'accès conditionnel, pas par les attributions de rôles."
    session:
      en: "A role assignment isn't tied to a sign-in session."
      fr: "Une attribution de rôle n'est pas liée à une session de connexion."
references:
  - title: Overview of role-based access control in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview
