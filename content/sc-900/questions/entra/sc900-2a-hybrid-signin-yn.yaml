id: sc900-2a-hybrid-signin-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the sign-in methods of hybrid identity, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les méthodes de connexion de l'identité hybride, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Pass-through authentication relies on agents that run on on-premises servers.
        fr: L'authentification directe s'appuie sur des agents qui s'exécutent sur des serveurs locaux.
    - id: s2
      text:
        en: With password hash synchronization, users sign in to Microsoft 365 with the same password that they use on-premises.
        fr: Avec la synchronisation de hachage du mot de passe, les utilisateurs se connectent à Microsoft 365 avec le même mot de passe qu'en local.
    - id: s3
      text:
        en: With password hash synchronization, Microsoft Entra ID stores the passwords of users in clear text.
        fr: Avec la synchronisation de hachage du mot de passe, Microsoft Entra ID stocke les mots de passe des utilisateurs en texte clair.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Pass-through authentication uses one or more lightweight agents installed on-premises, which validate passwords against the on-premises Active Directory. Password hash synchronization synchronizes a hash of the password of each user to Microsoft Entra ID, so users sign in to services such as Microsoft 365 with the password that they use on-premises. Only a hash is synchronized: passwords are never stored in clear text.
    fr: |
      L'authentification directe utilise un ou plusieurs agents légers installés en local, qui valident les mots de passe auprès de l'Active Directory local. La synchronisation de hachage du mot de passe synchronise un hachage du mot de passe de chaque utilisateur vers Microsoft Entra ID : les utilisateurs se connectent donc à des services comme Microsoft 365 avec le mot de passe qu'ils utilisent en local. Seul un hachage est synchronisé : les mots de passe ne sont jamais stockés en texte clair.
references:
  - title: What is password hash synchronization with Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/whatis-phs
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
