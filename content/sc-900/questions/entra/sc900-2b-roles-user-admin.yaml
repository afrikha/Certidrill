id: sc900-2b-roles-user-admin
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new member of the IT team of Northwind Traders must create user accounts and manage groups in Microsoft Entra ID.

    The solution must follow the principle of least privilege.

    Which Microsoft Entra role should you assign?
  fr: |
    Un nouveau membre de l'équipe informatique de Northwind Traders doit créer des comptes d'utilisateurs et gérer des groupes dans Microsoft Entra ID.

    La solution doit respecter le principe du moindre privilège.

    Quel rôle Microsoft Entra devez-vous attribuer ?
body:
  options:
    - { id: a, text: Global Administrator }
    - { id: b, text: Billing Administrator }
    - { id: c, text: Global Reader }
    - { id: d, text: User Administrator }
answer: { optionId: d }
explanation:
  correct:
    en: "User Administrator can create and manage all aspects of users and groups, which is exactly what the task requires. Assigning the least privileged role that does the job limits the damage if the account is ever compromised."
    fr: "User Administrator peut créer et gérer tous les aspects des utilisateurs et des groupes, ce qui correspond exactement à la tâche. Attribuer le rôle le moins privilégié qui suffit limite les dégâts si le compte est un jour compromis."
  options:
    a:
      en: "Global Administrator can manage all the administrative features of Microsoft Entra ID: far more than the task requires."
      fr: "Global Administrator peut gérer toutes les fonctionnalités d'administration de Microsoft Entra ID : bien plus que ce que la tâche demande."
    b:
      en: "Billing Administrator makes purchases and manages subscriptions; it doesn't manage users or groups."
      fr: "Billing Administrator effectue des achats et gère les abonnements ; il ne gère ni les utilisateurs ni les groupes."
    c:
      en: "Global Reader can read what a Global Administrator can see, but can't create or update anything."
      fr: "Global Reader peut lire ce qu'un Global Administrator peut voir, mais ne peut rien créer ni modifier."
references:
  - title: Describe Microsoft Entra roles and role-based access control (RBAC)
    url: https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/3-describe-azure-role-based-access-control
  - title: Microsoft Entra built-in roles
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference
