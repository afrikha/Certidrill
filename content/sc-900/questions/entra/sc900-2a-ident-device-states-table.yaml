id: sc900-2a-ident-device-states-table
objective: "2.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has an on-premises Active Directory and a Microsoft Entra tenant. The devices of three employees are shown in the following table.

    Answer each prompt by selecting the appropriate device.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un Active Directory local et d'un locataire Microsoft Entra. Les appareils de trois employés figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant l'appareil approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The device that should be Microsoft Entra hybrid joined", fr: "L'appareil qui doit être à jonction hybride Microsoft Entra" }
    - id: p2
      text: { en: "The device that should be Microsoft Entra registered", fr: "L'appareil qui doit être inscrit à Microsoft Entra" }
  grid:
    header:
      - { en: "Device", fr: "Appareil" }
      - { en: "Owner", fr: "Propriétaire" }
      - { en: "Description", fr: "Description" }
    rows:
      - - { text: "Device1", area: dev1 }
        - { text: { en: "The employee", fr: "L'employé" } }
        - { text: { en: "Android phone used to read work email", fr: "Téléphone Android utilisé pour lire les e-mails professionnels" } }
      - - { text: "Device2", area: dev2 }
        - { text: "Wingtip Toys" }
        - { text: { en: "Windows 11 laptop of a remote employee, never joined to the on-premises domain; sign-in to Windows with the organizational account", fr: "Ordinateur portable Windows 11 d'un employé distant, jamais joint au domaine local ; connexion à Windows avec le compte professionnel" } }
      - - { text: "Device3", area: dev3 }
        - { text: "Wingtip Toys" }
        - { text: { en: "Windows 11 desktop joined to the on-premises Active Directory domain", fr: "Ordinateur de bureau Windows 11 joint au domaine Active Directory local" } }
answer:
  values: { p1: dev3, p2: dev1 }
explanation:
  correct:
    en: |
      A Microsoft Entra hybrid joined device is joined to the on-premises Active Directory and to Microsoft Entra ID: this fits Device3, which is already in the on-premises domain. Microsoft Entra registered supports bring your own device and mobile scenarios, in which a user accesses the resources of the organization from a personal device such as Device1. Device2, owned by the organization and signed in to with an organizational account without any on-premises domain, is a Microsoft Entra joined device.
    fr: |
      Un appareil à jonction hybride Microsoft Entra est joint à l'Active Directory local et à Microsoft Entra ID : cela correspond à Device3, qui est déjà dans le domaine local. L'inscription à Microsoft Entra répond aux scénarios BYOD et mobiles, dans lesquels un utilisateur accède aux ressources de l'organisation depuis un appareil personnel comme Device1. Device2, qui appartient à l'organisation et sur lequel on se connecte avec un compte professionnel sans domaine local, est un appareil joint à Microsoft Entra.
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
  - title: What is a device identity?
    url: https://learn.microsoft.com/en-us/entra/identity/devices/overview
