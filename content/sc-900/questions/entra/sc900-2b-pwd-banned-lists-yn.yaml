id: sc900-2b-pwd-banned-lists-yn
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra Password Protection, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la protection par mot de passe Microsoft Entra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An administrator can turn off the global banned password list after configuring a custom banned password list."
        fr: "Un administrateur peut désactiver la liste globale de mots de passe interdits après avoir configuré une liste personnalisée de mots de passe interdits."
    - id: s2
      text:
        en: "The global banned password list is applied automatically to the users of every Microsoft Entra tenant."
        fr: "La liste globale de mots de passe interdits est appliquée automatiquement aux utilisateurs de tous les locataires Microsoft Entra."
    - id: s3
      text:
        en: "When a password is evaluated, the terms of the custom banned password list are combined with those of the global banned password list."
        fr: "Lorsqu'un mot de passe est évalué, les termes de la liste personnalisée de mots de passe interdits sont combinés avec ceux de la liste globale."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "The global banned password list has nothing to enable or configure, and it can't be disabled. It is applied automatically to all the users of a tenant when they change or reset their password. A custom list adds the organization's own terms: both lists are combined and the password is validated against the combined set."
    fr: "La liste globale de mots de passe interdits n'a rien à activer ni à configurer, et elle ne peut pas être désactivée. Elle s'applique automatiquement à tous les utilisateurs d'un locataire lorsqu'ils changent ou réinitialisent leur mot de passe. Une liste personnalisée ajoute les termes propres à l'organisation : les deux listes sont combinées et le mot de passe est validé par rapport à l'ensemble."
references:
  - title: Eliminate bad passwords using Microsoft Entra Password Protection
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad
