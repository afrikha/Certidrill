id: sc900-2b-mfa-ca-granular
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has Microsoft Entra ID P1 licenses.

    The members of the Finance group must be prompted for multifactor authentication only when they sign in from outside the corporate network. The other users must not be affected.

    What should Proseware use?
  fr: |
    Proseware dispose de licences Microsoft Entra ID P1.

    Les membres du groupe Finance doivent être invités à effectuer l'authentification multifacteur uniquement lorsqu'ils se connectent depuis l'extérieur du réseau de l'entreprise. Les autres utilisateurs ne doivent pas être concernés.

    Que doit utiliser Proseware ?
body:
  options:
    - id: a
      text: { en: "Security defaults", fr: "Les paramètres de sécurité par défaut" }
    - id: b
      text: { en: "Microsoft Entra Password Protection", fr: "La protection par mot de passe Microsoft Entra" }
    - id: c
      text: { en: "Microsoft Entra Privileged Identity Management", fr: "Microsoft Entra Privileged Identity Management" }
    - id: d
      text: { en: "Conditional Access", fr: "L'accès conditionnel" }
answer: { optionId: d }
explanation:
  correct:
    en: "Conditional Access gives granular control over multifactor authentication: a policy can target a group and take the network location of the sign-in into account before it requires the additional verification. It is included in Microsoft Entra ID P1."
    fr: "L'accès conditionnel donne un contrôle granulaire sur l'authentification multifacteur : une stratégie peut cibler un groupe et tenir compte de l'emplacement réseau de la connexion avant d'exiger la vérification supplémentaire. Il est inclus dans Microsoft Entra ID P1."
  options:
    a:
      en: "Security defaults are either on or off for the whole tenant: they can't be limited to one group or to one location."
      fr: "Les paramètres de sécurité par défaut sont activés ou désactivés pour tout le locataire : ils ne peuvent pas être limités à un groupe ou à un emplacement."
    b:
      en: "Microsoft Entra Password Protection blocks weak passwords when they are changed or reset; it doesn't prompt for a second factor."
      fr: "La protection par mot de passe Microsoft Entra bloque les mots de passe faibles lors d'un changement ou d'une réinitialisation ; elle ne demande pas de second facteur."
    c:
      en: "Privileged Identity Management governs the activation of privileged roles, not the sign-ins of the members of a business group."
      fr: "Privileged Identity Management encadre l'activation des rôles privilégiés, pas les connexions des membres d'un groupe métier."
references:
  - title: "How it works: Microsoft Entra multifactor authentication"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-howitworks
  - title: Security defaults in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
