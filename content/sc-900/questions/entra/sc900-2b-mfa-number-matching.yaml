id: sc900-2b-mfa-number-matching
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The users of Litware complete multifactor authentication by approving notifications in Microsoft Authenticator.

    An attacker who knows the password of a user triggers many sign-in requests, hoping that the user will approve one of the notifications by mistake.

    Which capability is designed to defeat this attack?
  fr: |
    Les utilisateurs de Litware effectuent l'authentification multifacteur en approuvant des notifications dans Microsoft Authenticator.

    Un attaquant qui connaît le mot de passe d'un utilisateur déclenche de nombreuses demandes de connexion, en espérant que l'utilisateur approuvera l'une des notifications par erreur.

    Quelle fonctionnalité est conçue pour mettre cette attaque en échec ?
body:
  options:
    - id: a
      text: { en: "Smart lockout", fr: "Le verrouillage intelligent" }
    - id: b
      text: { en: "A custom banned password list", fr: "Une liste personnalisée de mots de passe interdits" }
    - id: c
      text: { en: "Number matching", fr: "La correspondance de numéro" }
    - id: d
      text: { en: "A Temporary Access Pass", fr: "Un passe d'accès temporaire" }
answer: { optionId: c }
explanation:
  correct:
    en: "With number matching, the sign-in screen shows a number that the user must type in Microsoft Authenticator to approve the request. A user who didn't start the sign-in doesn't see that number and can't approve the attacker's request by a simple tap, which defeats MFA fatigue attacks."
    fr: "Avec la correspondance de numéro, l'écran de connexion affiche un numéro que l'utilisateur doit saisir dans Microsoft Authenticator pour approuver la demande. Un utilisateur qui n'a pas lancé la connexion ne voit pas ce numéro et ne peut pas approuver la demande de l'attaquant d'un simple appui, ce qui met en échec les attaques par fatigue MFA."
  options:
    a:
      en: "Smart lockout reacts to failed password attempts; here the attacker already has the correct password."
      fr: "Le verrouillage intelligent réagit aux tentatives de mot de passe infructueuses ; ici, l'attaquant possède déjà le bon mot de passe."
    b:
      en: "A custom banned password list prevents users from choosing weak passwords; it plays no part in the approval of a notification."
      fr: "Une liste personnalisée de mots de passe interdits empêche les utilisateurs de choisir des mots de passe faibles ; elle n'intervient pas dans l'approbation d'une notification."
    d:
      en: "A Temporary Access Pass is a time-limited passcode that an administrator issues to onboard a user or recover an account."
      fr: "Un passe d'accès temporaire est un code secret à durée limitée qu'un administrateur émet pour intégrer un utilisateur ou récupérer un compte."
references:
  - title: Describe multifactor authentication
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/3-describe-multi-factor-authentication
  - title: How number matching works in MFA push notifications for Authenticator - Authentication methods policy
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-mfa-number-match
