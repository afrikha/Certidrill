id: sc900-2b-mfa-legacy-auth-reason
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Security defaults are enabled in the Microsoft Entra tenant of Tailspin Toys. Sign-ins that use legacy authentication protocols, such as IMAP and POP3, are blocked.

    Why do security defaults block these protocols?
  fr: |
    Les paramètres de sécurité par défaut sont activés dans le locataire Microsoft Entra de Tailspin Toys. Les connexions qui utilisent des protocoles d'authentification hérités, comme IMAP et POP3, sont bloquées.

    Pourquoi les paramètres de sécurité par défaut bloquent-ils ces protocoles ?
body:
  options:
    - id: a
      text: { en: "They are reserved for tenants that have Microsoft Entra ID P2 licenses.", fr: "Ils sont réservés aux locataires qui ont des licences Microsoft Entra ID P2." }
    - id: b
      text: { en: "They prevent users from resetting their own password.", fr: "Ils empêchent les utilisateurs de réinitialiser eux-mêmes leur mot de passe." }
    - id: c
      text: { en: "They work only on devices that aren't registered in Microsoft Entra ID.", fr: "Ils ne fonctionnent que sur des appareils non inscrits dans Microsoft Entra ID." }
    - id: d
      text: { en: "They don't support multifactor authentication.", fr: "Ils ne prennent pas en charge l'authentification multifacteur." }
answer: { optionId: d }
explanation:
  correct:
    en: "Legacy authentication protocols can't prompt for a second factor. As long as they are allowed, an attacker who has a password can sign in through them and bypass multifactor authentication, so security defaults block them."
    fr: "Les protocoles d'authentification hérités ne peuvent pas demander de second facteur. Tant qu'ils sont autorisés, un attaquant qui détient un mot de passe peut se connecter par leur intermédiaire et contourner l'authentification multifacteur : les paramètres de sécurité par défaut les bloquent donc."
  options:
    a:
      en: "Legacy protocols aren't tied to a license; security defaults themselves are available at no cost."
      fr: "Les protocoles hérités ne sont liés à aucune licence ; les paramètres de sécurité par défaut eux-mêmes sont disponibles sans frais."
    b:
      en: "Self-service password reset doesn't depend on the mail protocols that a client uses."
      fr: "La réinitialisation de mot de passe en libre-service ne dépend pas des protocoles de messagerie qu'un client utilise."
    c:
      en: "Legacy authentication is a matter of protocol, not of device registration: any client that uses these protocols is concerned."
      fr: "L'authentification héritée est une question de protocole, pas d'inscription de l'appareil : tout client qui utilise ces protocoles est concerné."
references:
  - title: Security defaults in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
