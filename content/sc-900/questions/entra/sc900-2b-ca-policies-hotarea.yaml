id: sc900-2b-ca-policies-hotarea
objective: "2.3.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum has the Conditional Access policies shown in the following table. All the policies are turned on. **Office** is a named location that contains the IP address ranges of Adatum's offices.

    Answer each prompt by selecting the policy that produces the described result.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose des stratégies d'accès conditionnel présentées dans le tableau suivant. Toutes les stratégies sont activées. **Office** est un emplacement nommé qui contient les plages d'adresses IP des bureaux d'Adatum.

    Répondez à chaque consigne en sélectionnant la stratégie qui produit le résultat décrit.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "An employee who has no administrator role is refused when opening App1 from home.", fr: "Un employé sans rôle d'administrateur se voit refuser l'ouverture d'App1 depuis son domicile." }
    - id: p2
      text: { en: "A consultant who was invited as a guest must accept a legal notice before opening App2.", fr: "Un consultant, ajouté comme utilisateur invité, doit accepter une mention légale avant d'ouvrir App2." }
  grid:
    header:
      - { en: "Policy", fr: "Stratégie" }
      - { en: "Users", fr: "Utilisateurs" }
      - { en: "Target resources", fr: "Ressources cibles" }
      - { en: "Network", fr: "Réseau" }
      - { en: "Access control", fr: "Contrôle d'accès" }
    rows:
      - - { text: CA1, area: ca1 }
        - { text: { en: "Users who have an administrator role", fr: "Utilisateurs ayant un rôle d'administrateur" } }
        - { text: { en: "All resources", fr: "Toutes les ressources" } }
        - { text: { en: "Any location", fr: "Tout emplacement" } }
        - { text: { en: "Grant: require multifactor authentication", fr: "Accorder : exiger l'authentification multifacteur" } }
      - - { text: CA2, area: ca2 }
        - { text: { en: "All users", fr: "Tous les utilisateurs" } }
        - { text: App1 }
        - { text: { en: "Any location except Office", fr: "Tout emplacement sauf Office" } }
        - { text: { en: "Block access", fr: "Bloquer l'accès" } }
      - - { text: CA3, area: ca3 }
        - { text: { en: "Guest users", fr: "Utilisateurs invités" } }
        - { text: App2 }
        - { text: { en: "Any location", fr: "Tout emplacement" } }
        - { text: { en: "Grant: require terms of use", fr: "Accorder : exiger des conditions d'utilisation" } }
      - - { text: CA4, area: ca4 }
        - { text: { en: "All users", fr: "Tous les utilisateurs" } }
        - { text: { en: "All resources", fr: "Toutes les ressources" } }
        - { text: { en: "Any location", fr: "Tout emplacement" } }
        - { text: { en: "Session: sign-in frequency of 8 hours", fr: "Session : fréquence de connexion de 8 heures" } }
answer:
  values: { p1: ca2, p2: ca3 }
explanation:
  correct:
    en: "A policy applies only when all its assignments match the sign-in. The employee is covered by All users, opens App1 and signs in from a location other than Office: CA2 matches and blocks access. The guest opening App2 matches CA3, whose grant control requires the acceptance of terms of use before access. CA1 concerns administrators only, and CA4 sets how often users must sign in again: it neither blocks access nor presents terms of use."
    fr: "Une stratégie ne s'applique que si toutes ses affectations correspondent à la connexion. L'employé fait partie de Tous les utilisateurs, ouvre App1 et se connecte depuis un emplacement autre qu'Office : CA2 correspond et bloque l'accès. L'invité qui ouvre App2 correspond à CA3, dont le contrôle d'octroi exige l'acceptation de conditions d'utilisation avant l'accès. CA1 ne concerne que les administrateurs, et CA4 fixe la fréquence à laquelle les utilisateurs doivent se reconnecter : elle ne bloque pas l'accès et ne présente pas de conditions d'utilisation."
references:
  - title: Build a Conditional Access policy
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-policies
  - title: "Conditional Access: Grant"
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant
