id: sc900-2a-hybrid-pta-account-state
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders plans a hybrid identity solution with the following requirements:

    - A sign-in must be refused immediately when the on-premises account of the user is disabled, or when the user signs in outside the sign-in hours allowed in Active Directory.
    - No federation servers must be deployed.

    Which sign-in method should Northwind Traders use?
  fr: |
    Northwind Traders prévoit une solution d'identité hybride avec les exigences suivantes :

    - Une connexion doit être refusée immédiatement lorsque le compte local de l'utilisateur est désactivé, ou lorsque l'utilisateur se connecte en dehors des heures de connexion autorisées dans Active Directory.
    - Aucun serveur de fédération ne doit être déployé.

    Quelle méthode de connexion Northwind Traders doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Pass-through authentication", fr: "L'authentification directe" } }
    - { id: b, text: { en: "Password hash synchronization", fr: "La synchronisation de hachage du mot de passe" } }
    - { id: c, text: { en: "Federation with Active Directory Federation Services (AD FS)", fr: "La fédération avec Active Directory Federation Services (AD FS)" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Pass-through authentication validates each sign-in directly against the on-premises Active Directory, through lightweight agents. The on-premises account states are therefore enforced at sign-in: access is denied when the account is disabled, locked out or expired, or when the attempt falls outside the allowed sign-in hours. The method needs only agents, not federation servers.
    fr: |
      L'authentification directe valide chaque connexion directement auprès de l'Active Directory local, par l'intermédiaire d'agents légers. Les états du compte local sont donc appliqués à la connexion : l'accès est refusé lorsque le compte est désactivé, verrouillé ou expiré, ou lorsque la tentative a lieu en dehors des heures de connexion autorisées. La méthode ne demande que des agents, pas de serveurs de fédération.
  options:
    b:
      en: "With password hash synchronization, Microsoft Entra ID validates the password in the cloud: a change of on-premises account state isn't enforced immediately, and sign-in hours aren't checked."
      fr: "Avec la synchronisation de hachage du mot de passe, Microsoft Entra ID valide le mot de passe dans le cloud : un changement d'état du compte local n'est pas appliqué immédiatement, et les heures de connexion ne sont pas vérifiées."
    c:
      en: "Federation with AD FS also enforces the on-premises account states, but it requires federation servers and proxies, which the second requirement excludes."
      fr: "La fédération avec AD FS applique elle aussi les états du compte local, mais elle demande des serveurs de fédération et des proxys, ce que la deuxième exigence exclut."
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
  - title: User sign-in with Microsoft Entra pass-through authentication
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-pta
