id: sc900-2a-entra-capabilities-multi
objective: "2.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two capabilities does Microsoft Entra ID provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux fonctionnalités que fournit Microsoft Entra ID ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Applying Group Policy objects to domain-joined servers", fr: "Appliquer des objets de stratégie de groupe à des serveurs joints à un domaine" } }
    - { id: b, text: { en: "Signing employees in to Microsoft 365 and SaaS applications with one identity", fr: "Connecter les employés à Microsoft 365 et à des applications SaaS avec une seule identité" } }
    - { id: c, text: { en: "Filtering the network traffic between Azure virtual networks", fr: "Filtrer le trafic réseau entre des réseaux virtuels Azure" } }
    - { id: d, text: { en: "Requiring multifactor authentication to access important resources", fr: "Exiger l'authentification multifacteur pour accéder aux ressources importantes" } }
    - { id: e, text: { en: "Encrypting documents by applying sensitivity labels to them", fr: "Chiffrer des documents en leur appliquant des étiquettes de confidentialité" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Microsoft Entra ID is an identity and access management service. It lets employees sign in with one identity to external services such as Microsoft 365 and SaaS applications, as well as to internal applications. It also lets IT administrators control access according to business requirements, for example by requiring multifactor authentication for important resources.
    fr: |
      Microsoft Entra ID est un service de gestion des identités et des accès. Il permet aux employés de se connecter avec une seule identité à des services externes comme Microsoft 365 et les applications SaaS, ainsi qu'aux applications internes. Il permet aussi aux administrateurs informatiques de contrôler l'accès selon les besoins de l'entreprise, par exemple en exigeant l'authentification multifacteur pour les ressources importantes.
  options:
    a:
      en: "Group Policy is a feature of Active Directory Domain Services, and of the managed domains of Microsoft Entra Domain Services, not of Microsoft Entra ID."
      fr: "La stratégie de groupe est une fonctionnalité d'Active Directory Domain Services, et des domaines managés de Microsoft Entra Domain Services, pas de Microsoft Entra ID."
    c:
      en: "Network traffic is filtered by network security services such as network security groups and Azure Firewall."
      fr: "Le trafic réseau est filtré par des services de sécurité réseau comme les groupes de sécurité réseau et le Pare-feu Azure."
    e:
      en: "Sensitivity labels belong to Microsoft Purview Information Protection."
      fr: "Les étiquettes de confidentialité relèvent de Microsoft Purview Information Protection."
references:
  - title: Describe Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/2-describe-azure-active-directory
