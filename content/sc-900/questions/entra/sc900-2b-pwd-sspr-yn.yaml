id: sc900-2b-pwd-sspr-yn
objective: "2.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra self-service password reset (SSPR), select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur la réinitialisation de mot de passe en libre-service (SSPR) de Microsoft Entra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An administrator decides whether one or two authentication methods are required to reset a password."
        fr: "Un administrateur décide si une ou deux méthodes d'authentification sont exigées pour réinitialiser un mot de passe."
    - id: s2
      text:
        en: "SSPR is limited to users who have forgotten their password."
        fr: "SSPR est limitée aux utilisateurs qui ont oublié leur mot de passe."
    - id: s3
      text:
        en: "A user must have registered an authentication method that the administrator allows before resetting a password with SSPR."
        fr: "Un utilisateur doit avoir inscrit une méthode d'authentification autorisée par l'administrateur avant de réinitialiser un mot de passe avec SSPR."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "The administrator sets the number of methods required for a reset to one or two. SSPR covers three scenarios: a user who knows the password changes it, a user who forgot it resets it, and a locked-out user unlocks the account. In every case the user must be enabled for SSPR and must have registered the authentication methods that the administrator enabled."
    fr: "L'administrateur fixe à une ou deux le nombre de méthodes exigées pour une réinitialisation. SSPR couvre trois scénarios : un utilisateur qui connaît son mot de passe le change, un utilisateur qui l'a oublié le réinitialise, et un utilisateur verrouillé déverrouille son compte. Dans tous les cas, l'utilisateur doit être activé pour SSPR et avoir inscrit les méthodes d'authentification que l'administrateur a activées."
references:
  - title: "How it works: Microsoft Entra self-service password reset"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
  - title: Describe self-service password reset
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/4-describe-self-service-password-reset
