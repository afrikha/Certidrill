id: sc900-2c-rev-recommendations
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs an access review of the members of a group. For each member, the reviewers see a recommendation to approve or to deny the access.

    On what can these recommendations be based?
  fr: |
    Litware mène une révision d'accès des membres d'un groupe. Pour chaque membre, les réviseurs voient une recommandation d'approuver ou de refuser l'accès.

    Sur quoi ces recommandations peuvent-elles se fonder ?
body:
  options:
    - id: a
      text: { en: "Whether the user registered a multifactor authentication method", fr: "Le fait que l'utilisateur ait inscrit ou non une méthode d'authentification multifacteur" }
    - id: b
      text: { en: "Whether the user's device is marked as compliant", fr: "Le fait que l'appareil de l'utilisateur soit marqué ou non comme conforme" }
    - id: c
      text: { en: "Whether the user signed in during the last 30 days", fr: "Le fait que l'utilisateur se soit connecté ou non au cours des 30 derniers jours" }
    - id: d
      text: { en: "Whether the user activated a privileged role this month", fr: "Le fait que l'utilisateur ait activé ou non un rôle privilégié ce mois-ci" }
answer: { optionId: c }
explanation:
  correct:
    en: "Access reviews can show decision helpers to reviewers. With the helper based on sign-in activity, users who signed in during the past 30 days are recommended for approval, and the others are recommended for denial, because an account that isn't used probably no longer needs the access."
    fr: "Les révisions d'accès peuvent présenter aux réviseurs des aides à la décision. Avec l'aide fondée sur l'activité de connexion, l'approbation est recommandée pour les utilisateurs qui se sont connectés au cours des 30 derniers jours, et le refus pour les autres, car un compte inutilisé n'a probablement plus besoin de l'accès."
  options:
    a:
      en: "The registration of authentication methods isn't a criterion of access review recommendations."
      fr: "L'inscription de méthodes d'authentification n'est pas un critère des recommandations des révisions d'accès."
    b:
      en: "Device compliance is a signal for Conditional Access, not a criterion of access review recommendations."
      fr: "La conformité de l'appareil est un signal pour l'accès conditionnel, pas un critère des recommandations des révisions d'accès."
    d:
      en: "Role activations belong to Privileged Identity Management; they don't drive the recommendations of a group membership review."
      fr: "Les activations de rôles relèvent de Privileged Identity Management ; elles ne déterminent pas les recommandations d'une révision d'appartenance à un groupe."
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
