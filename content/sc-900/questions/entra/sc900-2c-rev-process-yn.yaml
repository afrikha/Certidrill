id: sc900-2c-rev-process-yn
objective: "2.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs an access review of the members of a group. The review lasts 14 days.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware mène une révision d'accès des membres d'un groupe. La révision dure 14 jours.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The owners of the group can be the reviewers."
        fr: "Les propriétaires du groupe peuvent être les réviseurs."
    - id: s2
      text:
        en: "A member is removed from the group at the moment when a reviewer denies the member's access, on the second day of the review."
        fr: "Un membre est retiré du groupe au moment où un réviseur refuse son accès, le deuxième jour de la révision."
    - id: s3
      text:
        en: "The reviewers must hold the Global Administrator role."
        fr: "Les réviseurs doivent détenir le rôle Global Administrator."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "The reviewers of a group can be its owners, selected users or groups, the managers of the users, or the users themselves; no administrator role is needed to review. Decisions are only recorded while the review is in progress: no access changes until the review is completed and its results are applied, automatically or by an administrator."
    fr: "Les réviseurs d'un groupe peuvent être ses propriétaires, des utilisateurs ou des groupes sélectionnés, les responsables des utilisateurs, ou les utilisateurs eux-mêmes ; aucun rôle d'administrateur n'est nécessaire pour réviser. Pendant la révision, les décisions sont seulement enregistrées : aucun accès ne change tant que la révision n'est pas terminée et que ses résultats ne sont pas appliqués, automatiquement ou par un administrateur."
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
  - title: Complete an access review of groups and applications in access reviews
    url: https://learn.microsoft.com/en-us/entra/id-governance/complete-access-review
