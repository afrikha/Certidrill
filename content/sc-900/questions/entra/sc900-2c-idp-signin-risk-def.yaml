id: sc900-2c-idp-signin-risk-def
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Microsoft Entra ID Protection calculates a sign-in risk and a user risk.

    What does the sign-in risk represent?
  fr: |
    Protection Microsoft Entra ID calcule un risque de connexion et un risque utilisateur.

    Que représente le risque de connexion ?
body:
  options:
    - id: a
      text: { en: "The probability that the account of a user is compromised", fr: "La probabilité que le compte d'un utilisateur soit compromis" }
    - id: b
      text: { en: "The probability that a given authentication request doesn't come from the owner of the identity", fr: "La probabilité qu'une demande d'authentification donnée ne vienne pas du propriétaire de l'identité" }
    - id: c
      text: { en: "The probability that the device used for a sign-in doesn't comply with the organization's policies", fr: "La probabilité que l'appareil utilisé pour une connexion ne respecte pas les stratégies de l'organisation" }
    - id: d
      text: { en: "The probability that a user leaks confidential data of the organization on purpose", fr: "La probabilité qu'un utilisateur divulgue volontairement des données confidentielles de l'organisation" }
answer: { optionId: b }
explanation:
  correct:
    en: "The sign-in risk concerns one authentication request: it is the probability that the request isn't made by the legitimate owner of the identity, for example because it comes from an anonymous IP address. The user risk concerns the account as a whole and can remain after the sign-in."
    fr: "Le risque de connexion concerne une demande d'authentification : c'est la probabilité que la demande ne vienne pas du propriétaire légitime de l'identité, par exemple parce qu'elle provient d'une adresse IP anonyme. Le risque utilisateur concerne le compte dans son ensemble et peut subsister après la connexion."
  options:
    a:
      en: "The probability that an account is compromised is the user risk, raised for example by leaked credentials."
      fr: "La probabilité qu'un compte soit compromis est le risque utilisateur, que font monter par exemple des informations d'identification divulguées."
    c:
      en: "Device compliance is evaluated by a device management solution and used by Conditional Access; it isn't a risk calculated by ID Protection."
      fr: "La conformité de l'appareil est évaluée par une solution de gestion des appareils et utilisée par l'accès conditionnel ; ce n'est pas un risque calculé par Protection Microsoft Entra ID."
    d:
      en: "Intentional data leaks by users are the subject of insider risk management in Microsoft Purview."
      fr: "Les fuites de données volontaires par des utilisateurs relèvent de la gestion des risques internes de Microsoft Purview."
references:
  - title: Risk detection types and levels
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-risk-detection-types
  - title: Risk-based access policies
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-policies
