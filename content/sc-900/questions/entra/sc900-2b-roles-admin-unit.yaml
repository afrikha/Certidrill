id: sc900-2b-roles-admin-unit
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has offices in Paris and Montreal. All the users are in the same Microsoft Entra tenant.

    The support technicians in Montreal must be able to reset the passwords of the users of the Montreal office only. The Helpdesk Administrator role contains the permissions they need.

    What should you use to limit the role assignment to the users of the Montreal office?
  fr: |
    Wingtip Toys a des bureaux à Paris et à Montréal. Tous les utilisateurs sont dans le même locataire Microsoft Entra.

    Les techniciens de support de Montréal doivent pouvoir réinitialiser les mots de passe des utilisateurs du bureau de Montréal uniquement. Le rôle Helpdesk Administrator contient les autorisations dont ils ont besoin.

    Que devez-vous utiliser pour limiter l'attribution de rôle aux utilisateurs du bureau de Montréal ?
body:
  options:
    - id: a
      text: { en: "A custom role", fr: "Un rôle personnalisé" }
    - id: b
      text: { en: "An administrative unit", fr: "Une unité administrative" }
    - id: c
      text: { en: "A named location", fr: "Un emplacement nommé" }
    - id: d
      text: { en: "A resource group", fr: "Un groupe de ressources" }
answer: { optionId: b }
explanation:
  correct:
    en: "An administrative unit is a Microsoft Entra container for users, groups or devices. A role assigned at the scope of an administrative unit applies only to the objects it contains: the Helpdesk Administrator role scoped to a unit that holds the Montreal users lets the technicians manage those users and no others."
    fr: "Une unité administrative est un conteneur Microsoft Entra pour des utilisateurs, des groupes ou des appareils. Un rôle attribué à l'étendue d'une unité administrative ne s'applique qu'aux objets qu'elle contient : le rôle Helpdesk Administrator limité à une unité qui regroupe les utilisateurs de Montréal permet aux techniciens de gérer ces utilisateurs et aucun autre."
  options:
    a:
      en: "A custom role changes which permissions are granted, not the set of users on which they apply; here the built-in role already has the right permissions."
      fr: "Un rôle personnalisé change les autorisations accordées, pas l'ensemble des utilisateurs sur lesquels elles s'appliquent ; ici, le rôle intégré a déjà les bonnes autorisations."
    c:
      en: "A named location is a set of IP address ranges or countries used by Conditional Access; it isn't a scope for a role assignment."
      fr: "Un emplacement nommé est un ensemble de plages d'adresses IP ou de pays utilisé par l'accès conditionnel ; ce n'est pas une étendue d'attribution de rôle."
    d:
      en: "A resource group is a scope for Azure roles and contains Azure resources, not Microsoft Entra users."
      fr: "Un groupe de ressources est une étendue pour les rôles Azure et contient des ressources Azure, pas des utilisateurs Microsoft Entra."
references:
  - title: Administrative units in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/administrative-units
  - title: Overview of role-based access control in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview
