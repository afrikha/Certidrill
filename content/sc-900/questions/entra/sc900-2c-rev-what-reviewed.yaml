id: sc900-2c-rev-what-reviewed
objective: "2.4.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two types of access can an organization recertify by using access reviews in Microsoft Entra?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux types d'accès qu'une organisation peut recertifier avec les révisions d'accès de Microsoft Entra ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The sensitivity labels applied to documents", fr: "Les étiquettes de confidentialité appliquées aux documents" } }
    - { id: b, text: { en: "The memberships of groups", fr: "Les appartenances aux groupes" } }
    - { id: c, text: { en: "The firewall rules of virtual networks", fr: "Les règles de pare-feu des réseaux virtuels" } }
    - { id: d, text: { en: "The assignments of users to applications", fr: "Les affectations d'utilisateurs aux applications" } }
    - { id: e, text: { en: "The retention policies of mailboxes", fr: "Les stratégies de rétention des boîtes aux lettres" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Access reviews cover the access rights that Microsoft Entra manages: memberships of security groups and Microsoft 365 groups, users assigned to connected applications, Microsoft Entra roles, Azure resource roles and access package assignments."
    fr: "Les révisions d'accès portent sur les droits d'accès que Microsoft Entra gère : appartenances aux groupes de sécurité et aux groupes Microsoft 365, utilisateurs affectés aux applications connectées, rôles Microsoft Entra, rôles de ressources Azure et attributions de packages d'accès."
  options:
    a:
      en: "Sensitivity labels classify and protect content in Microsoft Purview; they aren't access rights that reviewers recertify."
      fr: "Les étiquettes de confidentialité classifient et protègent le contenu dans Microsoft Purview ; ce ne sont pas des droits d'accès que des réviseurs recertifient."
    c:
      en: "Firewall rules are network security settings in Azure; access reviews deal with the access of identities."
      fr: "Les règles de pare-feu sont des paramètres de sécurité réseau dans Azure ; les révisions d'accès traitent de l'accès des identités."
    e:
      en: "Retention policies are a data lifecycle capability of Microsoft Purview, unrelated to who has access."
      fr: "Les stratégies de rétention sont une fonctionnalité de gestion du cycle de vie des données de Microsoft Purview, sans rapport avec qui a un accès."
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
