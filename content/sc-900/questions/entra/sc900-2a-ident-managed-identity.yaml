id: sc900-2a-ident-managed-identity
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware hosts a web application in Azure App Service. The application must authenticate to Azure Key Vault.

    The developers must not store or renew any credential.

    Which type of identity should the application use?
  fr: |
    Proseware héberge une application web dans Azure App Service. L'application doit s'authentifier auprès d'Azure Key Vault.

    Les développeurs ne doivent stocker ni renouveler aucune information d'identification.

    Quel type d'identité l'application doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "A service principal with a client secret", fr: "Un principal de service avec un secret client" } }
    - { id: b, text: { en: "A managed identity", fr: "Une identité managée" } }
    - { id: c, text: { en: "A user account shared by the developers", fr: "Un compte d'utilisateur partagé par les développeurs" } }
    - { id: d, text: { en: "A service principal with a certificate", fr: "Un principal de service avec un certificat" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A managed identity is a type of service principal that is managed automatically in Microsoft Entra ID: developers have no credential to store, protect or renew. An Azure resource such as a web app uses it to obtain a token for any service that supports Microsoft Entra authentication, such as Azure Key Vault. Managed identities are available at no extra cost.
    fr: |
      Une identité managée est un type de principal de service géré automatiquement dans Microsoft Entra ID : les développeurs n'ont aucune information d'identification à stocker, à protéger ou à renouveler. Une ressource Azure comme une application web s'en sert pour obtenir un jeton auprès de tout service qui prend en charge l'authentification Microsoft Entra, comme Azure Key Vault. Les identités managées sont disponibles sans coût supplémentaire.
  options:
    a:
      en: "A client secret is a credential that the developers must store somewhere, protect and renew before it expires."
      fr: "Un secret client est une information d'identification que les développeurs doivent stocker quelque part, protéger et renouveler avant son expiration."
    c:
      en: "A user account represents a person; the application would have to store its password, and a shared account can't be attributed to anyone."
      fr: "Un compte d'utilisateur représente une personne ; l'application devrait stocker son mot de passe, et un compte partagé ne peut être attribué à personne."
    d:
      en: "A certificate is also a credential of the service principal: the developers must deploy it with the application and renew it."
      fr: "Un certificat est lui aussi une information d'identification du principal de service : les développeurs doivent le déployer avec l'application et le renouveler."
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
