id: sc900-2a-auth-authenticator-sequence
objective: "2.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A user of Proseware is enabled for passwordless sign-in with Microsoft Authenticator and signs in to Microsoft 365 from a computer.

    Which three steps occur in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Un utilisateur de Proseware est activé pour la connexion sans mot de passe avec Microsoft Authenticator et se connecte à Microsoft 365 depuis un ordinateur.

    Quelles sont les trois étapes qui se succèdent ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pwd, text: { en: "The user types their password on the sign-in page.", fr: "L'utilisateur saisit son mot de passe sur la page de connexion." } }
    - { id: match, text: { en: "The user matches the number in the Authenticator app and confirms with biometrics or a PIN.", fr: "L'utilisateur fait correspondre le numéro dans l'application Authenticator et confirme par la biométrie ou un code PIN." } }
    - { id: name, text: { en: "The user enters their username on the sign-in page.", fr: "L'utilisateur saisit son nom d'utilisateur sur la page de connexion." } }
    - { id: sms, text: { en: "The user types a verification code received by SMS.", fr: "L'utilisateur saisit un code de vérification reçu par SMS." } }
    - { id: number, text: { en: "The sign-in page displays a number.", fr: "La page de connexion affiche un numéro." } }
    - { id: key, text: { en: "The user inserts a FIDO2 security key in the computer.", fr: "L'utilisateur insère une clé de sécurité FIDO2 dans l'ordinateur." } }
answer:
  sequence: [ name, number, match ]
explanation:
  correct:
    en: |
      With passwordless sign-in in Microsoft Authenticator, the user enters a username and, instead of a password prompt, the sign-in page displays a number. The user then matches this number in the Authenticator app on their phone and confirms with biometrics or a PIN. The phone (something you have) and the biometric trait or PIN (something you are or know) replace the password.
    fr: |
      Avec la connexion sans mot de passe de Microsoft Authenticator, l'utilisateur saisit un nom d'utilisateur et, au lieu d'une demande de mot de passe, la page de connexion affiche un numéro. L'utilisateur fait ensuite correspondre ce numéro dans l'application Authenticator sur son téléphone et confirme par la biométrie ou un code PIN. Le téléphone (quelque chose que vous possédez) et le trait biométrique ou le code PIN (quelque chose que vous êtes ou savez) remplacent le mot de passe.
  options:
    pwd:
      en: "No password is typed: the number shown on the sign-in page replaces the password prompt."
      fr: "Aucun mot de passe n'est saisi : le numéro affiché sur la page de connexion remplace la demande de mot de passe."
    sms:
      en: "A code received by SMS belongs to SMS-based authentication, a different method."
      fr: "Un code reçu par SMS relève de l'authentification par SMS, une autre méthode."
    key:
      en: "A FIDO2 security key is another passwordless method, a device-bound passkey; it isn't part of sign-in with Authenticator."
      fr: "Une clé de sécurité FIDO2 est une autre méthode sans mot de passe, une clé d'accès liée à l'appareil ; elle ne fait pas partie de la connexion avec Authenticator."
references:
  - title: Authentication methods in Microsoft Entra ID - Microsoft Authenticator app
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-authenticator-app
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
