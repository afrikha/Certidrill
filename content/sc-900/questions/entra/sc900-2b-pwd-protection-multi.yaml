id: sc900-2b-pwd-protection-multi
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two statements about Microsoft Entra Password Protection are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies sur la protection par mot de passe Microsoft Entra ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It lets users who forgot their password choose a new one without the help desk.", fr: "Elle laisse les utilisateurs qui ont oublié leur mot de passe en choisir un nouveau sans le support technique." } }
    - { id: b, text: { en: "It recognizes a banned term even when a character is substituted, for example `@` for `a`.", fr: "Elle reconnaît un terme interdit même lorsqu'un caractère est substitué, par exemple `@` à la place de `a`." } }
    - { id: c, text: { en: "It publishes the content of the global banned password list in the Microsoft Entra admin center.", fr: "Elle publie le contenu de la liste globale de mots de passe interdits dans le Centre d'administration Microsoft Entra." } }
    - { id: d, text: { en: "It can be extended to on-premises Active Directory Domain Services by installing agents on domain controllers.", fr: "Elle peut être étendue à Active Directory Domain Services en local par l'installation d'agents sur les contrôleurs de domaine." } }
    - { id: e, text: { en: "It sends password changes made in the cloud back to the on-premises directory.", fr: "Elle renvoie vers l'annuaire local les changements de mot de passe faits dans le cloud." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Microsoft Entra Password Protection detects and blocks known weak passwords and their variants: it normalizes a password, undoing common substitutions such as `@` for `a`, before comparing it with the banned terms. In a hybrid environment, a DC agent installed on domain controllers, helped by a proxy service, applies the same global and custom lists to password changes made in on-premises AD DS."
    fr: "La protection par mot de passe Microsoft Entra détecte et bloque les mots de passe faibles connus et leurs variantes : elle normalise un mot de passe, en annulant les substitutions courantes comme `@` pour `a`, avant de le comparer aux termes interdits. Dans un environnement hybride, un agent DC installé sur les contrôleurs de domaine, aidé d'un service proxy, applique les mêmes listes globale et personnalisée aux changements de mot de passe faits dans AD DS en local."
  options:
    a: { en: "This describes self-service password reset.", fr: "Cela décrit la réinitialisation de mot de passe en libre-service." }
    c: { en: "Microsoft doesn't publish the content of the global banned password list.", fr: "Microsoft ne publie pas le contenu de la liste globale de mots de passe interdits." }
    e: { en: "This describes password writeback.", fr: "Cela décrit la réécriture du mot de passe." }
references:
  - title: Eliminate bad passwords using Microsoft Entra Password Protection
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad
  - title: Enforce on-premises Microsoft Entra Password Protection for Active Directory Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad-on-premises
