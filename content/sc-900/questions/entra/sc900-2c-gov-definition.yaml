id: sc900-2c-gov-definition
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which Microsoft Entra solution helps an organization make sure that the right people have the right access to the right resources, by governing the identity lifecycle, the access lifecycle and the privileged access lifecycle?
  fr: |
    Quelle solution Microsoft Entra aide une organisation à garantir que les bonnes personnes ont le bon accès aux bonnes ressources, en gouvernant le cycle de vie des identités, le cycle de vie des accès et le cycle de vie des accès privilégiés ?
body:
  options:
    - id: a
      text: { en: "Microsoft Entra ID Protection", fr: "Protection Microsoft Entra ID" }
    - id: b
      text: { en: "Microsoft Entra Conditional Access", fr: "L'accès conditionnel Microsoft Entra" }
    - id: c
      text: { en: "Microsoft Entra ID Governance", fr: "Gouvernance Microsoft Entra ID" }
    - id: d
      text: { en: "Microsoft Entra Verified ID", fr: "Vérification d'identité Microsoft Entra (Verified ID)" }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft Entra ID Governance is the identity governance solution of Microsoft Entra. It automates identity and access processes so that people get the access they need, keep it only while they need it, and so that auditors can check the controls. It covers the identity lifecycle, the access lifecycle and the privileged access lifecycle."
    fr: "Gouvernance Microsoft Entra ID est la solution de gouvernance des identités de Microsoft Entra. Elle automatise les processus d'identité et d'accès pour que les personnes obtiennent l'accès dont elles ont besoin, ne le gardent que tant qu'il est nécessaire, et pour que les auditeurs puissent vérifier les contrôles. Elle couvre le cycle de vie des identités, celui des accès et celui des accès privilégiés."
  options:
    a:
      en: "ID Protection detects, investigates and remediates identity-based risks such as leaked credentials; it doesn't govern who should have access."
      fr: "Protection Microsoft Entra ID détecte, examine et corrige les risques liés aux identités, comme les informations d'identification divulguées ; elle ne gouverne pas qui doit avoir un accès."
    b:
      en: "Conditional Access evaluates signals at sign-in to allow, block or challenge an access request; it doesn't manage lifecycles."
      fr: "L'accès conditionnel évalue des signaux à la connexion pour autoriser, bloquer ou soumettre à vérification une demande d'accès ; il ne gère pas de cycles de vie."
    d:
      en: "Verified ID issues and verifies digital credentials about a person; it isn't an access governance solution."
      fr: "Verified ID émet et vérifie des justificatifs numériques concernant une personne ; ce n'est pas une solution de gouvernance des accès."
references:
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
