id: sc900-2a-entra-developers-sso
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The developers of Northwind Traders build a web application for the employees of the company.

    What can the developers do by using Microsoft Entra ID?
  fr: |
    Les développeurs de Northwind Traders créent une application web pour les employés de l'entreprise.

    Que peuvent faire les développeurs avec Microsoft Entra ID ?
body:
  options:
    - { id: a, text: { en: "Add single sign-on (SSO) to the application with a standards-based approach", fr: "Ajouter l'authentification unique (SSO) à l'application avec une approche fondée sur des standards" } }
    - { id: b, text: { en: "Scan the source code of the application to find vulnerabilities", fr: "Analyser le code source de l'application pour y trouver des vulnérabilités" } }
    - { id: c, text: { en: "Filter malicious HTTP requests before they reach the application", fr: "Filtrer les requêtes HTTP malveillantes avant qu'elles n'atteignent l'application" } }
    - { id: d, text: { en: "Store the encryption keys of the application in a hardware security module", fr: "Stocker les clés de chiffrement de l'application dans un module de sécurité matériel" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For developers, Microsoft Entra ID is a standards-based way to add single sign-on to their applications, so that users sign in with the credentials they already have. Its APIs also let developers build personalized experiences from existing organizational data. The application relies on Microsoft Entra ID instead of managing its own accounts and passwords.
    fr: |
      Pour les développeurs, Microsoft Entra ID est un moyen fondé sur des standards d'ajouter l'authentification unique à leurs applications : les utilisateurs se connectent avec les informations d'identification qu'ils ont déjà. Ses API permettent aussi de créer des expériences personnalisées à partir des données existantes de l'organisation. L'application s'appuie sur Microsoft Entra ID au lieu de gérer ses propres comptes et mots de passe.
  options:
    b:
      en: "Code scanning is a security capability of development and cloud protection tools; Microsoft Entra ID manages identities and access."
      fr: "L'analyse du code est une fonctionnalité de sécurité des outils de développement et de protection du cloud ; Microsoft Entra ID gère les identités et les accès."
    c:
      en: "Filtering malicious HTTP requests is the role of Azure Web Application Firewall."
      fr: "Le filtrage des requêtes HTTP malveillantes est le rôle d'Azure Web Application Firewall."
    d:
      en: "Storing keys, secrets and certificates is the role of Azure Key Vault."
      fr: "Le stockage des clés, des secrets et des certificats est le rôle d'Azure Key Vault."
references:
  - title: Describe Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/2-describe-azure-active-directory
