id: sc900-2c-idp-feature
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware wants to be informed when the credentials of one of its users appear in a data breach, and when a user signs in from an anonymous IP address. Each of these events must be given a risk level.

    Which Microsoft Entra feature should Proseware use?
  fr: |
    Proseware veut être informée quand les informations d'identification d'un de ses utilisateurs apparaissent dans une fuite de données, et quand un utilisateur se connecte depuis une adresse IP anonyme. Chacun de ces événements doit recevoir un niveau de risque.

    Quelle fonctionnalité Microsoft Entra Proseware doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Microsoft Entra Privileged Identity Management", fr: "Microsoft Entra Privileged Identity Management" }
    - id: b
      text: { en: "Microsoft Entra password protection", fr: "La protection par mot de passe Microsoft Entra" }
    - id: c
      text: { en: "Microsoft Entra ID Protection", fr: "Protection Microsoft Entra ID" }
    - id: d
      text: { en: "Microsoft Entra ID Governance", fr: "Gouvernance Microsoft Entra ID" }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft Entra ID Protection detects identity-based risks from the signals that Microsoft analyzes, such as leaked credentials, the use of an anonymous IP address or password spray attacks. Each detection has a risk level, and the risks appear in reports that administrators use to investigate and remediate."
    fr: "Protection Microsoft Entra ID détecte les risques liés aux identités à partir des signaux que Microsoft analyse, comme les informations d'identification divulguées, l'utilisation d'une adresse IP anonyme ou les attaques par pulvérisation de mots de passe. Chaque détection a un niveau de risque, et les risques figurent dans des rapports que les administrateurs utilisent pour examiner et corriger."
  options:
    a:
      en: "Privileged Identity Management provides just-in-time access to privileged roles; it doesn't detect leaked credentials or anonymous IP addresses."
      fr: "Privileged Identity Management fournit un accès juste-à-temps aux rôles privilégiés ; il ne détecte ni les informations d'identification divulguées ni les adresses IP anonymes."
    b:
      en: "Password protection blocks weak and banned passwords when users choose a password; it doesn't calculate a risk for sign-ins or accounts."
      fr: "La protection par mot de passe bloque les mots de passe faibles et interdits quand les utilisateurs choisissent un mot de passe ; elle ne calcule pas de risque pour les connexions ou les comptes."
    d:
      en: "ID Governance manages who should have access and for how long; risk detection belongs to ID Protection."
      fr: "Gouvernance Microsoft Entra ID gère qui doit avoir un accès et pour combien de temps ; la détection des risques relève de Protection Microsoft Entra ID."
references:
  - title: What is Microsoft Entra ID Protection?
    url: https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection
