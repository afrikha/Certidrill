id: sc900-2c-rev-usecases-yn
objective: "2.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about the use of access reviews, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'utilisation des révisions d'accès, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Access reviews give administrators just-in-time access to privileged roles."
        fr: "Les révisions d'accès donnent aux administrateurs un accès juste-à-temps aux rôles privilégiés."
    - id: s2
      text:
        en: "Access reviews are suited to a group whose membership can't be maintained automatically by a rule."
        fr: "Les révisions d'accès conviennent à un groupe dont l'appartenance ne peut pas être maintenue automatiquement par une règle."
    - id: s3
      text:
        en: "Access reviews can show auditors that the exceptions to an access policy are checked regularly."
        fr: "Les révisions d'accès peuvent montrer aux auditeurs que les exceptions à une stratégie d'accès sont vérifiées régulièrement."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Just-in-time access to privileged roles is provided by Privileged Identity Management; an access review only confirms or removes existing access. Reviews are recommended when automation isn't possible, for example when the data needed for a membership rule isn't in Microsoft Entra ID. They are also used to maintain the exception list of a policy and to give auditors proof that the exceptions are reviewed."
    fr: "L'accès juste-à-temps aux rôles privilégiés est fourni par Privileged Identity Management ; une révision d'accès se limite à confirmer ou à retirer un accès existant. Les révisions sont recommandées quand l'automatisation n'est pas possible, par exemple quand les données nécessaires à une règle d'appartenance ne sont pas dans Microsoft Entra ID. Elles servent aussi à tenir à jour la liste d'exceptions d'une stratégie et à prouver aux auditeurs que ces exceptions sont révisées."
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
