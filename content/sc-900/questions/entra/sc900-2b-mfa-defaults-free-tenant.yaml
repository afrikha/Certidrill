id: sc900-2b-mfa-defaults-free-tenant
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Entra tenant that uses only Microsoft Entra ID Free licenses.

    Fabrikam wants all its users to register for multifactor authentication. The solution must not require additional licenses and must minimize administrative effort.

    What should Fabrikam enable?
  fr: |
    Fabrikam dispose d'un locataire Microsoft Entra qui n'utilise que des licences Microsoft Entra ID Free.

    Fabrikam veut que tous ses utilisateurs s'inscrivent à l'authentification multifacteur. La solution ne doit pas demander de licences supplémentaires et doit réduire au minimum l'effort d'administration.

    Que doit activer Fabrikam ?
body:
  options:
    - id: a
      text: { en: "Conditional Access", fr: "L'accès conditionnel" }
    - id: b
      text: { en: "Security defaults", fr: "Les paramètres de sécurité par défaut" }
    - id: c
      text: { en: "Microsoft Entra ID Protection", fr: "Protection Microsoft Entra ID" }
    - id: d
      text: { en: "Microsoft Entra Privileged Identity Management", fr: "Microsoft Entra Privileged Identity Management" }
answer: { optionId: b }
explanation:
  correct:
    en: "Security defaults are a preconfigured set of identity protections that Microsoft offers to every tenant at no extra cost, including tenants on the free tier. One setting turns them on for the whole tenant: all users must then register for multifactor authentication, with no policy to design."
    fr: "Les paramètres de sécurité par défaut sont un ensemble préconfiguré de protections des identités que Microsoft propose à tous les locataires sans coût supplémentaire, y compris ceux du niveau gratuit. Un seul réglage les active pour tout le locataire : tous les utilisateurs doivent alors s'inscrire à l'authentification multifacteur, sans stratégie à concevoir."
  options:
    a:
      en: "Conditional Access can require multifactor authentication, but it needs Microsoft Entra ID P1 licenses and policies that you design."
      fr: "L'accès conditionnel peut exiger l'authentification multifacteur, mais il demande des licences Microsoft Entra ID P1 et des stratégies que vous concevez."
    c:
      en: "Microsoft Entra ID Protection detects risky users and risky sign-ins; it is a Microsoft Entra ID P2 feature."
      fr: "Protection Microsoft Entra ID détecte les utilisateurs et les connexions à risque ; c'est une fonctionnalité de Microsoft Entra ID P2."
    d:
      en: "Privileged Identity Management provides just-in-time activation of privileged roles; it doesn't register all users for multifactor authentication, and it requires premium licenses."
      fr: "Privileged Identity Management fournit l'activation juste-à-temps des rôles privilégiés ; il n'inscrit pas tous les utilisateurs à l'authentification multifacteur, et il demande des licences Premium."
references:
  - title: Security defaults in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
  - title: Describe multifactor authentication
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/3-describe-multi-factor-authentication
