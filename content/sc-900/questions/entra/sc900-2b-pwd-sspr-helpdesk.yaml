id: sc900-2b-pwd-sspr-helpdesk
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The help desk of Adatum spends much of its time setting new passwords for users who forgot theirs.

    Adatum wants these users to set a new password on their own, after they prove their identity.

    Which Microsoft Entra feature should Adatum enable?
  fr: |
    Le support technique d'Adatum passe une grande partie de son temps à définir de nouveaux mots de passe pour les utilisateurs qui ont oublié le leur.

    Adatum veut que ces utilisateurs définissent eux-mêmes un nouveau mot de passe, après avoir prouvé leur identité.

    Quelle fonctionnalité Microsoft Entra Adatum doit-elle activer ?
body:
  options:
    - id: a
      text: { en: "Smart lockout", fr: "Le verrouillage intelligent" }
    - id: b
      text: { en: "Microsoft Entra Password Protection", fr: "La protection par mot de passe Microsoft Entra" }
    - id: c
      text: { en: "Self-service password reset", fr: "La réinitialisation de mot de passe en libre-service" }
    - id: d
      text: { en: "Security defaults", fr: "Les paramètres de sécurité par défaut" }
answer: { optionId: c }
explanation:
  correct:
    en: "Self-service password reset (SSPR) lets users change or reset their password, or unlock their account, without an administrator or the help desk. Users first verify their identity with the authentication methods they registered, which reduces help desk calls and lost productivity."
    fr: "La réinitialisation de mot de passe en libre-service (SSPR) laisse les utilisateurs changer ou réinitialiser leur mot de passe, ou déverrouiller leur compte, sans administrateur ni support technique. Ils vérifient d'abord leur identité avec les méthodes d'authentification qu'ils ont inscrites, ce qui réduit les appels au support et la perte de productivité."
  options:
    a:
      en: "Smart lockout protects accounts against password guessing; it doesn't help a user who forgot a password."
      fr: "Le verrouillage intelligent protège les comptes contre les tentatives de deviner un mot de passe ; il n'aide pas un utilisateur qui a oublié le sien."
    b:
      en: "Microsoft Entra Password Protection rejects weak passwords; it doesn't let users reset a forgotten password."
      fr: "La protection par mot de passe Microsoft Entra rejette les mots de passe faibles ; elle ne permet pas aux utilisateurs de réinitialiser un mot de passe oublié."
    d:
      en: "Security defaults enforce a baseline that includes multifactor authentication; they don't provide password reset."
      fr: "Les paramètres de sécurité par défaut appliquent un socle qui comprend l'authentification multifacteur ; ils ne fournissent pas de réinitialisation de mot de passe."
references:
  - title: Describe self-service password reset
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/4-describe-self-service-password-reset
  - title: "How it works: Microsoft Entra self-service password reset"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
