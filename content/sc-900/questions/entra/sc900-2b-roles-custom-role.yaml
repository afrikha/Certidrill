id: sc900-2b-roles-custom-role
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has Microsoft Entra ID P1 licenses.

    The support team of Proseware must be able to update the credentials of application registrations, and nothing else. Every built-in Microsoft Entra role that includes this permission also includes other permissions.

    What should Proseware create?
  fr: |
    Proseware dispose de licences Microsoft Entra ID P1.

    L'équipe de support de Proseware doit pouvoir mettre à jour les informations d'identification des inscriptions d'applications, et rien d'autre. Tous les rôles Microsoft Entra intégrés qui comprennent cette autorisation en comprennent aussi d'autres.

    Que doit créer Proseware ?
body:
  options:
    - id: a
      text: { en: "A custom role", fr: "Un rôle personnalisé" }
    - id: b
      text: { en: "An administrative unit", fr: "Une unité administrative" }
    - id: c
      text: { en: "A Conditional Access policy", fr: "Une stratégie d'accès conditionnel" }
    - id: d
      text: { en: "A security group", fr: "Un groupe de sécurité" }
answer: { optionId: a }
explanation:
  correct:
    en: "Built-in roles have a fixed set of permissions that can't be modified. When no built-in role fits, an organization creates a custom role: it selects the permissions it wants from a preset list, then assigns the role. Custom roles require Microsoft Entra ID P1 or P2."
    fr: "Les rôles intégrés ont un ensemble fixe d'autorisations qui ne peut pas être modifié. Quand aucun rôle intégré ne convient, une organisation crée un rôle personnalisé : elle sélectionne les autorisations voulues dans une liste prédéfinie, puis attribue le rôle. Les rôles personnalisés demandent Microsoft Entra ID P1 ou P2."
  options:
    b:
      en: "An administrative unit restricts a role to a subset of users, groups or devices; it doesn't change the permissions that the role contains."
      fr: "Une unité administrative restreint un rôle à un sous-ensemble d'utilisateurs, de groupes ou d'appareils ; elle ne change pas les autorisations que le rôle contient."
    c:
      en: "A Conditional Access policy decides under which conditions a sign-in is allowed; it grants no administrative permission."
      fr: "Une stratégie d'accès conditionnel décide à quelles conditions une connexion est autorisée ; elle n'accorde aucune autorisation d'administration."
    d:
      en: "A security group gathers users; on its own it carries no permission to manage application registrations."
      fr: "Un groupe de sécurité rassemble des utilisateurs ; à lui seul, il ne porte aucune autorisation de gestion des inscriptions d'applications."
references:
  - title: Overview of role-based access control in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview
  - title: Describe Microsoft Entra roles and role-based access control (RBAC)
    url: https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/3-describe-azure-role-based-access-control
