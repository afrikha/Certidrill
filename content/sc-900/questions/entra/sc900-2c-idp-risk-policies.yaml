id: sc900-2c-idp-risk-policies
objective: "2.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank wants to automate the response to the risks that Microsoft Entra ID Protection detects.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank veut automatiser la réponse aux risques que Protection Microsoft Entra ID détecte.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When an employee signs in from an anonymous IP address, a policy based on the [[r1]] can require multifactor authentication.

      When the credentials of an employee are found in a data breach, a policy based on the [[r2]] can require a secure password change.

      Both policies are created in [[r3]].
    fr: |
      Quand un employé se connecte depuis une adresse IP anonyme, une stratégie basée sur le [[r1]] peut exiger l'authentification multifacteur.

      Quand les informations d'identification d'un employé sont trouvées dans une fuite de données, une stratégie basée sur le [[r2]] peut exiger un changement de mot de passe sécurisé.

      Les deux stratégies se créent dans [[r3]].
  slots:
    - id: r1
      options:
        - { id: insider, text: { en: "insider risk", fr: "risque interne" } }
        - { id: signin, text: { en: "sign-in risk", fr: "risque de connexion" } }
        - { id: user, text: { en: "user risk", fr: "risque utilisateur" } }
    - id: r2
      options:
        - { id: insider, text: { en: "insider risk", fr: "risque interne" } }
        - { id: signin, text: { en: "sign-in risk", fr: "risque de connexion" } }
        - { id: user, text: { en: "user risk", fr: "risque utilisateur" } }
    - id: r3
      options:
        - { id: ar, text: { en: "access reviews", fr: "les révisions d'accès" } }
        - { id: ca, text: { en: "Conditional Access", fr: "l'accès conditionnel" } }
        - { id: pim, text: "Privileged Identity Management" }
answer:
  values: { r1: signin, r2: user, r3: ca }
explanation:
  correct:
    en: "An anonymous IP address is a property of one sign-in, so it raises the sign-in risk; passing multifactor authentication proves that the request comes from the owner of the identity. Leaked credentials put the account itself in doubt, so they raise the user risk, which a secure password change remediates. Both are risk-based Conditional Access policies: ID Protection supplies the risk level, and Conditional Access applies the control. Insider risk belongs to Microsoft Purview."
    fr: "Une adresse IP anonyme est une propriété d'une connexion : elle fait monter le risque de connexion ; réussir l'authentification multifacteur prouve que la demande vient du propriétaire de l'identité. Des informations d'identification divulguées mettent en doute le compte lui-même : elles font monter le risque utilisateur, qu'un changement de mot de passe sécurisé corrige. Les deux sont des stratégies d'accès conditionnel basées sur les risques : Protection Microsoft Entra ID fournit le niveau de risque, et l'accès conditionnel applique le contrôle. Le risque interne relève de Microsoft Purview."
references:
  - title: Risk-based access policies
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-policies
  - title: Configure and enable risk policies
    url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-configure-risk-policies
