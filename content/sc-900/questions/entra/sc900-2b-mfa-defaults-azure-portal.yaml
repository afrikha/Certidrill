id: sc900-2b-mfa-defaults-azure-portal
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Security defaults are enabled in the Microsoft Entra tenant of Northwind Traders.

    A user who has no administrator role signs in to the Azure portal.

    What do security defaults require for this sign-in?
  fr: |
    Les paramètres de sécurité par défaut sont activés dans le locataire Microsoft Entra de Northwind Traders.

    Un utilisateur qui n'a aucun rôle d'administrateur se connecte au portail Azure.

    Qu'exigent les paramètres de sécurité par défaut pour cette connexion ?
body:
  options:
    - id: a
      text: { en: "Multifactor authentication", fr: "L'authentification multifacteur" }
    - id: b
      text: { en: "A password only", fr: "Un mot de passe seulement" }
    - id: c
      text: { en: "The approval of an administrator", fr: "L'approbation d'un administrateur" }
    - id: d
      text: { en: "A password change", fr: "Un changement de mot de passe" }
answer: { optionId: a }
explanation:
  correct:
    en: "Security defaults protect privileged activities: any user who accesses the Azure portal, Azure PowerShell or the Azure CLI must complete multifactor authentication, whether the user is an administrator or not. For other sign-ins, users without an administrator role are prompted only when necessary."
    fr: "Les paramètres de sécurité par défaut protègent les activités privilégiées : tout utilisateur qui accède au portail Azure, à Azure PowerShell ou à Azure CLI doit effectuer l'authentification multifacteur, qu'il soit administrateur ou non. Pour les autres connexions, les utilisateurs sans rôle d'administrateur ne sont sollicités que lorsque c'est nécessaire."
  options:
    b:
      en: "A password alone is not enough: the protection of Azure management applies to all users, not only to administrators."
      fr: "Un mot de passe seul ne suffit pas : la protection de la gestion d'Azure s'applique à tous les utilisateurs, pas seulement aux administrateurs."
    c:
      en: "Security defaults contain no approval workflow; approving the activation of a role is a capability of Privileged Identity Management."
      fr: "Les paramètres de sécurité par défaut ne comportent aucun flux d'approbation ; approuver l'activation d'un rôle est une fonctionnalité de Privileged Identity Management."
    d:
      en: "Security defaults don't force a password change; requiring a password change is a Conditional Access control used with user risk."
      fr: "Les paramètres de sécurité par défaut n'imposent pas de changement de mot de passe ; exiger un changement de mot de passe est un contrôle d'accès conditionnel utilisé avec le risque utilisateur."
references:
  - title: Security defaults in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
