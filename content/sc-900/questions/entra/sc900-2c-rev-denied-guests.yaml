id: sc900-2c-rev-denied-guests
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys creates an access review that covers only the guest users of a group.

    Besides removing their membership of the group, which action can the review apply automatically to the guests whose access is denied?
  fr: |
    Tailspin Toys crée une révision d'accès qui porte uniquement sur les utilisateurs invités d'un groupe.

    Outre le retrait de leur appartenance au groupe, quelle action la révision peut-elle appliquer automatiquement aux invités dont l'accès est refusé ?
body:
  options:
    - id: a
      text: { en: "Convert their accounts to member accounts for 30 days, then remove them from the tenant", fr: "Convertir leurs comptes en comptes de membres pendant 30 jours, puis les supprimer du locataire" }
    - id: b
      text: { en: "Require them to change their password within 30 days, then remove them from the tenant", fr: "Leur imposer de changer leur mot de passe sous 30 jours, puis les supprimer du locataire" }
    - id: c
      text: { en: "Move them to an administrative unit for 30 days, then remove them from the tenant", fr: "Les déplacer dans une unité administrative pendant 30 jours, puis les supprimer du locataire" }
    - id: d
      text: { en: "Block them from signing in for 30 days, then remove them from the tenant", fr: "Bloquer leur connexion pendant 30 jours, puis les supprimer du locataire" }
answer: { optionId: d }
explanation:
  correct:
    en: "A review scoped to guest users only offers two actions for the guests who are denied: remove their membership of the reviewed resource, or block them from signing in for 30 days and then remove them from the tenant. During the 30 days an administrator can restore the access, which makes the review a way to clean up guest accounts that nobody needs any more."
    fr: "Une révision limitée aux utilisateurs invités propose deux actions pour les invités refusés : supprimer leur appartenance à la ressource révisée, ou bloquer leur connexion pendant 30 jours puis les supprimer du locataire. Pendant ces 30 jours, un administrateur peut rétablir l'accès : la révision devient ainsi un moyen de nettoyer les comptes d'invités dont plus personne n'a besoin."
  options:
    a:
      en: "An access review never changes a guest account into a member account."
      fr: "Une révision d'accès ne transforme jamais un compte d'invité en compte de membre."
    b:
      en: "An access review never imposes a password change; a denied guest loses access, with no remediation step."
      fr: "Une révision d'accès n'impose jamais de changement de mot de passe ; un invité refusé perd son accès, sans étape de correction."
    c:
      en: "Administrative units delegate administration; an access review doesn't move users into them."
      fr: "Les unités administratives servent à déléguer l'administration ; une révision d'accès n'y déplace pas d'utilisateurs."
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
  - title: Complete an access review of groups and applications in access reviews
    url: https://learn.microsoft.com/en-us/entra/id-governance/complete-access-review
