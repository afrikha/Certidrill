id: sc900-2b-ca-basics-yn
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra Conditional Access, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'accès conditionnel Microsoft Entra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Conditional Access is an authentication method that replaces multifactor authentication."
        fr: "L'accès conditionnel est une méthode d'authentification qui remplace l'authentification multifacteur."
    - id: s2
      text:
        en: "A Conditional Access policy can be assigned to the members of a specific group."
        fr: "Une stratégie d'accès conditionnel peut être affectée aux membres d'un groupe précis."
    - id: s3
      text:
        en: "Conditional Access policies are enforced after first-factor authentication is completed."
        fr: "Les stratégies d'accès conditionnel sont appliquées une fois l'authentification du premier facteur terminée."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Conditional Access isn't an authentication method: it is the policy engine that decides when a control such as multifactor authentication is required. A policy can target all users, specific users or groups, directory roles or guests. Policies are enforced after the first factor is completed, which is why Conditional Access isn't meant to be a frontline defense against attacks such as denial of service."
    fr: "L'accès conditionnel n'est pas une méthode d'authentification : c'est le moteur de stratégie qui décide quand un contrôle comme l'authentification multifacteur est exigé. Une stratégie peut cibler tous les utilisateurs, des utilisateurs ou des groupes précis, des rôles d'annuaire ou des invités. Les stratégies sont appliquées une fois le premier facteur terminé : c'est pourquoi l'accès conditionnel n'est pas conçu comme une défense de première ligne contre des attaques comme le déni de service."
references:
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
  - title: Describe Conditional Access
    url: https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/2-describe-conditional-access-azure-ad
