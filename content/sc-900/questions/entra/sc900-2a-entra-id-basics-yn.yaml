id: sc900-2a-entra-id-basics-yn
objective: "2.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra ID, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Microsoft Entra ID, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Microsoft Entra ID can be used as a standalone service, without an on-premises Active Directory.
        fr: Microsoft Entra ID peut s'utiliser comme service autonome, sans Active Directory local.
    - id: s2
      text:
        en: To use Microsoft Entra ID, an organization must deploy domain controllers on Azure virtual machines.
        fr: Pour utiliser Microsoft Entra ID, une organisation doit déployer des contrôleurs de domaine sur des machines virtuelles Azure.
    - id: s3
      text:
        en: Microsoft Entra ID provides identities to the employees of an organization only.
        fr: Microsoft Entra ID fournit des identités uniquement aux employés d'une organisation.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Microsoft Entra ID can be synchronized with an existing on-premises Active Directory or with other directory services, or be used alone. It is a cloud service that Microsoft operates: the organization deploys no domain controller. It gives identities to employees, but also to guests, to workloads such as applications and services, and to AI agents.
    fr: |
      Microsoft Entra ID peut être synchronisé avec un Active Directory local existant ou avec d'autres services d'annuaire, ou s'utiliser seul. C'est un service cloud que Microsoft exploite : l'organisation ne déploie aucun contrôleur de domaine. Il donne des identités aux employés, mais aussi aux invités, aux charges de travail comme les applications et les services, et aux agents IA.
references:
  - title: Describe Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/2-describe-azure-active-directory
