id: sc900-2c-rev-purpose
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is the purpose of access reviews in Microsoft Entra?
  fr: |
    À quoi servent les révisions d'accès dans Microsoft Entra ?
body:
  options:
    - id: a
      text: { en: "To make sure that only the right people continue to have access", fr: "À s'assurer que seules les bonnes personnes continuent d'avoir un accès" }
    - id: b
      text: { en: "To make sure that administrator roles are active only for a few hours", fr: "À s'assurer que les rôles d'administrateur ne sont actifs que quelques heures" }
    - id: c
      text: { en: "To make sure that sign-ins from unusual locations are challenged", fr: "À s'assurer que les connexions depuis des emplacements inhabituels sont soumises à vérification" }
    - id: d
      text: { en: "To make sure that documents shared with guests are encrypted", fr: "À s'assurer que les documents partagés avec des invités sont chiffrés" }
answer: { optionId: a }
explanation:
  correct:
    en: "Access reviews let organizations review group memberships, access to applications and role assignments on a regular basis. People change teams or leave and guests stay in groups; a review removes the access that is no longer needed, which reduces both the security risk and the audit findings caused by excessive access."
    fr: "Les révisions d'accès permettent aux organisations de réviser régulièrement les appartenances aux groupes, l'accès aux applications et les attributions de rôles. Les personnes changent d'équipe ou partent et des invités restent dans des groupes ; une révision retire l'accès devenu inutile, ce qui réduit à la fois le risque de sécurité et les constats d'audit dus à un excès d'accès."
  options:
    b:
      en: "Limiting how long an administrator role is active is what Privileged Identity Management does."
      fr: "Limiter la durée pendant laquelle un rôle d'administrateur est actif est le rôle de Privileged Identity Management."
    c:
      en: "Challenging unusual sign-ins is done by ID Protection together with risk-based Conditional Access policies."
      fr: "Soumettre à vérification les connexions inhabituelles relève de Protection Microsoft Entra ID, associée à des stratégies d'accès conditionnel basées sur les risques."
    d:
      en: "Encrypting shared documents is an information protection capability of Microsoft Purview, such as sensitivity labels."
      fr: "Chiffrer des documents partagés est une fonctionnalité de protection des informations de Microsoft Purview, comme les étiquettes de confidentialité."
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
