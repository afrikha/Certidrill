id: sc900-2a-entra-identity-secure-score
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The security team of Fabrikam wants an indicator, expressed as a percentage, that shows how well the Microsoft Entra tenant follows the identity security recommendations of Microsoft. The indicator must come with a list of improvement actions.

    What should the team use?
  fr: |
    L'équipe de sécurité de Fabrikam veut un indicateur, exprimé en pourcentage, qui montre dans quelle mesure le locataire Microsoft Entra suit les recommandations de Microsoft pour la sécurité des identités. L'indicateur doit s'accompagner d'une liste d'actions d'amélioration.

    Que doit utiliser l'équipe ?
body:
  options:
    - { id: a, text: { en: "Access reviews", fr: "Les révisions d'accès" } }
    - { id: b, text: { en: "Compliance score", fr: "Le score de conformité" } }
    - { id: c, text: { en: "Identity secure score", fr: "Le score d'identité sécurisée" } }
    - { id: d, text: { en: "Sign-in logs", fr: "Les journaux de connexion" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Identity secure score is a percentage that indicates how well the tenant aligns with the best-practice recommendations of Microsoft for identity security. Its improvement actions are tailored to the configuration of the tenant, and the score helps to measure the identity security posture and to plan improvements. It is available in all editions of Microsoft Entra ID.
    fr: |
      Le score d'identité sécurisée est un pourcentage qui indique dans quelle mesure le locataire suit les bonnes pratiques recommandées par Microsoft pour la sécurité des identités. Ses actions d'amélioration sont adaptées à la configuration du locataire, et le score aide à mesurer la posture de sécurité des identités et à planifier des améliorations. Il est disponible dans toutes les éditions de Microsoft Entra ID.
  options:
    a:
      en: "Access reviews let an organization check regularly whether users still need their group memberships, application access and role assignments; they produce no score."
      fr: "Les révisions d'accès permettent à une organisation de vérifier régulièrement si les utilisateurs ont encore besoin de leurs appartenances aux groupes, de leurs accès aux applications et de leurs attributions de rôles ; elles ne produisent aucun score."
    b:
      en: "Compliance score, in Microsoft Purview Compliance Manager, measures progress toward regulatory and data protection requirements, not the identity security posture."
      fr: "Le score de conformité, dans le Gestionnaire de conformité Microsoft Purview, mesure la progression vers les exigences réglementaires et de protection des données, pas la posture de sécurité des identités."
    d:
      en: "Sign-in logs record each sign-in to the tenant; they are raw activity data, without a percentage or improvement actions."
      fr: "Les journaux de connexion enregistrent chaque connexion au locataire ; ce sont des données d'activité brutes, sans pourcentage ni actions d'amélioration."
references:
  - title: Describe Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/2-describe-azure-active-directory
