id: sc900-2c-gov-lifecycles-match
objective: "2.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each lifecycle that Microsoft Entra ID Governance governs to the feature that is designed for it.

    To answer, drag the appropriate feature to each lifecycle. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque cycle de vie gouverné par Gouvernance Microsoft Entra ID à la fonctionnalité conçue pour lui.

    Pour répondre, faites glisser la fonctionnalité appropriée vers chaque cycle de vie. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sspr, text: { en: "Self-service password reset", fr: "Réinitialisation de mot de passe en libre-service" } }
    - { id: em, text: { en: "Entitlement management", fr: "Gestion des droits d'utilisation" } }
    - { id: idp, text: { en: "Microsoft Entra ID Protection", fr: "Protection Microsoft Entra ID" } }
    - { id: pim, text: "Privileged Identity Management" }
    - { id: lcw, text: { en: "Lifecycle workflows", fr: "Workflows de cycle de vie" } }
  targets:
    - id: t1
      text: { en: "Identity lifecycle: tasks to run when a person joins, changes position or leaves", fr: "Cycle de vie des identités : des tâches à exécuter quand une personne arrive, change de poste ou part" }
    - id: t2
      text: { en: "Access lifecycle: requests, approvals and expiration of access to groups, applications and sites", fr: "Cycle de vie des accès : demandes, approbations et expiration de l'accès à des groupes, des applications et des sites" }
    - id: t3
      text: { en: "Privileged access lifecycle: administrator roles that are held only while they are needed", fr: "Cycle de vie des accès privilégiés : des rôles d'administrateur détenus seulement tant qu'ils sont nécessaires" }
answer:
  mapping: { t1: lcw, t2: em, t3: pim }
explanation:
  correct:
    en: "Lifecycle workflows automate tasks for joiners, movers and leavers, which is the identity lifecycle. Entitlement management automates access requests, approvals, assignments and expiration through access packages, which is the access lifecycle. Privileged Identity Management provides just-in-time access to administrator roles, which is the privileged access lifecycle."
    fr: "Les workflows de cycle de vie automatisent des tâches pour les personnes qui arrivent, changent de poste ou partent : c'est le cycle de vie des identités. La gestion des droits d'utilisation automatise les demandes d'accès, les approbations, les attributions et l'expiration au moyen de packages d'accès : c'est le cycle de vie des accès. Privileged Identity Management fournit un accès juste-à-temps aux rôles d'administrateur : c'est le cycle de vie des accès privilégiés."
  options:
    sspr:
      en: "Self-service password reset lets users reset their own password; it is an authentication capability, not a governance feature."
      fr: "La réinitialisation de mot de passe en libre-service permet aux utilisateurs de réinitialiser eux-mêmes leur mot de passe ; c'est une fonctionnalité d'authentification, pas de gouvernance."
    idp:
      en: "ID Protection detects and remediates identity-based risks; it doesn't govern a lifecycle."
      fr: "Protection Microsoft Entra ID détecte et corrige les risques liés aux identités ; elle ne gouverne pas un cycle de vie."
references:
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
