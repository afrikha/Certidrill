id: sc900-2c-idp-detect-investigate
objective: "2.4.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence about Microsoft Entra ID Protection, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase sur Protection Microsoft Entra ID, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Entra ID Protection helps organizations detect, [[v1]] and [[v2]] identity-based risks.
    fr: |
      Protection Microsoft Entra ID aide les organisations à détecter, à [[v1]] et à [[v2]] les risques liés aux identités.
  slots:
    - id: v1
      options:
        - { id: encrypt, text: { en: "encrypt", fr: "chiffrer" } }
        - { id: investigate, text: { en: "investigate", fr: "examiner" } }
        - { id: provision, text: { en: "provision", fr: "provisionner" } }
    - id: v2
      options:
        - { id: remediate, text: { en: "remediate", fr: "corriger" } }
        - { id: archive, text: { en: "archive", fr: "archiver" } }
        - { id: delegate, text: { en: "delegate", fr: "déléguer" } }
answer:
  values: { v1: investigate, v2: remediate }
explanation:
  correct:
    en: "ID Protection is built around three steps. It detects risks from the signals that Microsoft analyzes, lets administrators investigate them in the risk detections, risky sign-ins and risky users reports, and remediates them, automatically with risk-based Conditional Access policies or manually by an administrator."
    fr: "Protection Microsoft Entra ID s'articule autour de trois étapes. Elle détecte les risques à partir des signaux que Microsoft analyse, permet aux administrateurs de les examiner dans les rapports des détections de risque, des connexions à risque et des utilisateurs à risque, et les corrige, automatiquement avec des stratégies d'accès conditionnel basées sur les risques ou manuellement par un administrateur."
references:
  - title: What is Microsoft Entra ID Protection?
    url: https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection
