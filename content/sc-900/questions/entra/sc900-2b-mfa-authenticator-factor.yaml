id: sc900-2b-mfa-authenticator-factor
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user of Contoso signs in to Microsoft 365 with a password. The user then approves a notification on a phone that is registered with Microsoft Authenticator.

    Which category of authentication factor does the second step represent?
  fr: |
    Un utilisateur de Contoso se connecte à Microsoft 365 avec un mot de passe. Il approuve ensuite une notification sur un téléphone inscrit auprès de Microsoft Authenticator.

    Quelle catégorie de facteur d'authentification la seconde étape représente-t-elle ?
body:
  options:
    - id: a
      text: { en: "Something you know", fr: "Quelque chose que vous savez" }
    - id: b
      text: { en: "Something you are", fr: "Quelque chose que vous êtes" }
    - id: c
      text: { en: "Something you have", fr: "Quelque chose que vous possédez" }
answer: { optionId: c }
explanation:
  correct:
    en: "The registered phone is a trusted device that the user carries and that an attacker can't easily duplicate: it is something you have. Combined with the password, which is something you know, the sign-in uses two categories of factors and is therefore multifactor authentication."
    fr: "Le téléphone inscrit est un appareil de confiance que l'utilisateur porte sur lui et qu'un attaquant ne peut pas facilement dupliquer : c'est quelque chose que vous possédez. Associé au mot de passe, qui est quelque chose que vous savez, il donne une connexion qui utilise deux catégories de facteurs, donc une authentification multifacteur."
  options:
    a:
      en: "Something you know is a memorized secret, such as the password of the first step or a PIN."
      fr: "Quelque chose que vous savez est un secret mémorisé, comme le mot de passe de la première étape ou un code PIN."
    b:
      en: "Something you are is a biometric characteristic, such as a fingerprint or a face scan; the scenario relies on possession of the phone."
      fr: "Quelque chose que vous êtes est une caractéristique biométrique, comme une empreinte digitale ou une reconnaissance du visage ; le scénario repose sur la possession du téléphone."
references:
  - title: "How it works: Microsoft Entra multifactor authentication"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-howitworks
