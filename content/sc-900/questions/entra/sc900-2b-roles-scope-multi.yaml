id: sc900-2b-roles-scope-multi
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    At which two scopes can a Microsoft Entra role be assigned?

    NOTE: Each correct selection is worth one point.
  fr: |
    À quelles deux étendues un rôle Microsoft Entra peut-il être attribué ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A management group", fr: "Un groupe d'administration" } }
    - { id: b, text: { en: "The tenant", fr: "Le locataire" } }
    - { id: c, text: { en: "A resource group", fr: "Un groupe de ressources" } }
    - { id: d, text: { en: "A subscription", fr: "Un abonnement" } }
    - { id: e, text: { en: "An administrative unit", fr: "Une unité administrative" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A Microsoft Entra role is assigned at the scope of the tenant, which covers the whole organization, of an administrative unit, which covers the users, groups or devices it contains, or of a single Microsoft Entra resource such as one application."
    fr: "Un rôle Microsoft Entra s'attribue à l'étendue du locataire, qui couvre toute l'organisation, d'une unité administrative, qui couvre les utilisateurs, groupes ou appareils qu'elle contient, ou d'une seule ressource Microsoft Entra, comme une application."
  options:
    a: { en: "A management group is a scope of Azure roles: it groups Azure subscriptions.", fr: "Un groupe d'administration est une étendue des rôles Azure : il regroupe des abonnements Azure." }
    c: { en: "A resource group is a scope of Azure roles: it contains Azure resources.", fr: "Un groupe de ressources est une étendue des rôles Azure : il contient des ressources Azure." }
    d: { en: "A subscription is a scope of Azure roles, not of Microsoft Entra roles.", fr: "Un abonnement est une étendue des rôles Azure, pas des rôles Microsoft Entra." }
references:
  - title: Overview of role-based access control in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview
  - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
