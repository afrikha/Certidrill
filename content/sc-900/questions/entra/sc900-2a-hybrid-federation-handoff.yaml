id: sc900-2a-hybrid-federation-handoff
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum compares the sign-in methods for hybrid identity.

    With which method does Microsoft Entra ID hand off the authentication process to a separate trusted system, with its own servers and proxies, that Adatum deploys and manages?
  fr: |
    Adatum compare les méthodes de connexion pour l'identité hybride.

    Avec quelle méthode Microsoft Entra ID délègue-t-il le processus d'authentification à un système approuvé distinct, doté de ses propres serveurs et proxys, qu'Adatum déploie et gère ?
body:
  options:
    - { id: a, text: { en: "Password hash synchronization", fr: "La synchronisation de hachage du mot de passe" } }
    - { id: b, text: { en: "Pass-through authentication", fr: "L'authentification directe" } }
    - { id: c, text: { en: "Certificate-based authentication", fr: "L'authentification basée sur un certificat" } }
    - { id: d, text: { en: "Federation", fr: "La fédération" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With federated authentication, Microsoft Entra ID hands off the authentication process to a separate trusted authentication system, such as Active Directory Federation Services (AD FS), which validates the password of the user. This system is managed outside Microsoft Entra ID and requires the most infrastructure: federation servers, proxies in the perimeter network and load balancing.
    fr: |
      Avec l'authentification fédérée, Microsoft Entra ID délègue le processus d'authentification à un système d'authentification approuvé distinct, comme Active Directory Federation Services (AD FS), qui valide le mot de passe de l'utilisateur. Ce système se gère en dehors de Microsoft Entra ID et demande le plus d'infrastructure : serveurs de fédération, proxys dans le réseau de périmètre et équilibrage de charge.
  options:
    a:
      en: "With password hash synchronization, Microsoft Entra ID validates the credentials itself, against a synchronized hash of the password."
      fr: "Avec la synchronisation de hachage du mot de passe, Microsoft Entra ID valide lui-même les informations d'identification, par rapport à un hachage synchronisé du mot de passe."
    b:
      en: "Pass-through authentication only needs lightweight agents on existing servers; Microsoft Entra ID keeps the sign-in process and the agents validate the password against Active Directory."
      fr: "L'authentification directe ne demande que des agents légers sur des serveurs existants ; Microsoft Entra ID conserve le processus de connexion et les agents valident le mot de passe auprès d'Active Directory."
    c:
      en: "With Microsoft Entra certificate-based authentication, users authenticate with a certificate directly against Microsoft Entra ID, without a federation system."
      fr: "Avec l'authentification basée sur un certificat de Microsoft Entra, les utilisateurs s'authentifient avec un certificat directement auprès de Microsoft Entra ID, sans système de fédération."
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
  - title: What is federation with Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/whatis-fed
