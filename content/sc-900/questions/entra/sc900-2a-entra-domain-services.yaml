id: sc900-2a-entra-domain-services
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware moves a legacy application to Azure virtual machines. The application requires domain join, Group Policy and Kerberos authentication, and it can't be modified to use modern authentication.

    Litware doesn't want to deploy or patch domain controllers.

    What should Litware use?
  fr: |
    Litware migre une application ancienne vers des machines virtuelles Azure. L'application exige la jonction de domaine, la stratégie de groupe et l'authentification Kerberos, et elle ne peut pas être modifiée pour utiliser l'authentification moderne.

    Litware ne veut ni déployer de contrôleurs de domaine ni leur appliquer de correctifs.

    Que doit utiliser Litware ?
body:
  options:
    - { id: a, text: "Microsoft Entra Connect Sync" }
    - { id: b, text: "Active Directory Federation Services (AD FS)" }
    - { id: c, text: "Microsoft Entra Workload ID" }
    - { id: d, text: "Microsoft Entra Domain Services" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft Entra Domain Services provides managed domain services: domain join, Group Policy, LDAP and Kerberos or NTLM authentication. Microsoft deploys, patches and monitors the domain controllers, so Litware has none to manage. The service is intended for legacy applications hosted in Azure that can't use modern authentication.
    fr: |
      Microsoft Entra Domain Services fournit des services de domaine managés : jonction de domaine, stratégie de groupe, LDAP et authentification Kerberos ou NTLM. Microsoft déploie les contrôleurs de domaine, leur applique les correctifs et les surveille : Litware n'en a aucun à gérer. Le service est destiné aux applications anciennes hébergées dans Azure qui ne peuvent pas utiliser l'authentification moderne.
  options:
    a:
      en: "Microsoft Entra Connect Sync synchronizes the identities of an on-premises Active Directory to Microsoft Entra ID; it provides neither domain join nor Group Policy."
      fr: "Microsoft Entra Connect Sync synchronise les identités d'un Active Directory local vers Microsoft Entra ID ; il ne fournit ni jonction de domaine ni stratégie de groupe."
    b:
      en: "AD FS is a federation service that an organization runs on its own servers to authenticate users; it isn't a managed domain."
      fr: "AD FS est un service de fédération que l'organisation exécute sur ses propres serveurs pour authentifier les utilisateurs ; ce n'est pas un domaine managé."
    c:
      en: "Microsoft Entra Workload ID manages and protects the identities of applications and services; it doesn't offer domain join or Kerberos to virtual machines."
      fr: "Microsoft Entra Workload ID gère et protège les identités des applications et des services ; il n'offre ni jonction de domaine ni Kerberos aux machines virtuelles."
references:
  - title: What is Microsoft Entra Domain Services?
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/overview
  - title: Describe Microsoft Entra
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/1a-describe-microsoft-entra
