id: sc900-2a-entra-tenant-details-yn
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra tenants, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les locataires Microsoft Entra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each tenant is a security and administrative boundary that has its own tenant ID.
        fr: Chaque locataire est une limite de sécurité et d'administration qui a son propre ID de locataire.
    - id: s2
      text:
        en: A tenant can contain several directories.
        fr: Un locataire peut contenir plusieurs annuaires.
    - id: s3
      text:
        en: An organization can add a custom domain name to its tenant, in addition to the initial onmicrosoft.com domain name.
        fr: Une organisation peut ajouter un nom de domaine personnalisé à son locataire, en plus du nom de domaine initial onmicrosoft.com.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A tenant is an instance of Microsoft Entra ID for a single organization: it has a unique tenant ID and forms a security and administrative boundary. A tenant consists of only one directory, the logical container of its identity objects, which is why the two words are often used interchangeably. The tenant receives an initial domain name such as contoso.onmicrosoft.com, and the organization can add its own custom domain names.
    fr: |
      Un locataire est une instance de Microsoft Entra ID pour une seule organisation : il a un ID de locataire unique et forme une limite de sécurité et d'administration. Un locataire ne comprend qu'un seul annuaire, le conteneur logique de ses objets d'identité : c'est pourquoi les deux mots sont souvent employés l'un pour l'autre. Le locataire reçoit un nom de domaine initial comme contoso.onmicrosoft.com, et l'organisation peut ajouter ses propres noms de domaine personnalisés.
references:
  - title: Describe Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/2-describe-azure-active-directory
  - title: Describe Microsoft Entra
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/1a-describe-microsoft-entra
