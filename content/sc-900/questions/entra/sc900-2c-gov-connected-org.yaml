id: sc900-2c-gov-connected-org
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso works with a partner named Fabrikam, which has its own Microsoft Entra tenant. Fabrikam users who don't yet have an account in the Contoso directory must be able to request an access package of Contoso.

    What should Contoso add in entitlement management to make Fabrikam users eligible to request the access package?
  fr: |
    Contoso travaille avec un partenaire nommé Fabrikam, qui possède son propre locataire Microsoft Entra. Les utilisateurs de Fabrikam qui n'ont pas encore de compte dans l'annuaire de Contoso doivent pouvoir demander un package d'accès de Contoso.

    Que doit ajouter Contoso dans la gestion des droits d'utilisation pour que les utilisateurs de Fabrikam puissent demander le package d'accès ?
body:
  options:
    - id: a
      text: { en: "A connected organization", fr: "Une organisation connectée" }
    - id: b
      text: { en: "An administrative unit", fr: "Une unité administrative" }
    - id: c
      text: { en: "A custom domain name", fr: "Un nom de domaine personnalisé" }
    - id: d
      text: { en: "A catalog", fr: "Un catalogue" }
answer: { optionId: a }
explanation:
  correct:
    en: "A connected organization is an external Microsoft Entra directory or domain with which the organization has a relationship. A policy of the access package can name it so that its users can request the package; an approved requester who isn't yet in the directory is invited automatically as a guest and receives the access."
    fr: "Une organisation connectée est un annuaire Microsoft Entra ou un domaine externe avec lequel l'organisation entretient une relation. Une stratégie du package d'accès peut la désigner pour que ses utilisateurs puissent demander le package ; un demandeur approuvé qui n'est pas encore dans l'annuaire est invité automatiquement et reçoit l'accès."
  options:
    b:
      en: "An administrative unit limits the scope of administrator roles inside the tenant; it doesn't let external users request access."
      fr: "Une unité administrative limite l'étendue de rôles d'administrateur dans le locataire ; elle ne permet pas à des utilisateurs externes de demander un accès."
    c:
      en: "A custom domain name is a domain that the tenant itself owns for its own users; Fabrikam users stay in their own tenant."
      fr: "Un nom de domaine personnalisé est un domaine que le locataire possède pour ses propres utilisateurs ; les utilisateurs de Fabrikam restent dans leur propre locataire."
    d:
      en: "A catalog is the container of resources and access packages; it doesn't define which external organizations can request them."
      fr: "Un catalogue est le conteneur des ressources et des packages d'accès ; il ne définit pas quelles organisations externes peuvent les demander."
references:
  - title: What is entitlement management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview
