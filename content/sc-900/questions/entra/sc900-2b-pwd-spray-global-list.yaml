id: sc900-2b-pwd-spray-global-list
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a password spray attack, an attacker tries a few commonly used passwords against a large number of accounts, so that no single account reaches a lockout threshold.

    Which Microsoft Entra capability reduces the success of this attack by rejecting commonly used passwords when users choose them?
  fr: |
    Dans une attaque par pulvérisation de mots de passe, un attaquant essaie quelques mots de passe très courants sur un grand nombre de comptes, de sorte qu'aucun compte n'atteint un seuil de verrouillage.

    Quelle fonctionnalité Microsoft Entra réduit le succès de cette attaque en rejetant les mots de passe très courants au moment où les utilisateurs les choisissent ?
body:
  options:
    - id: a
      text: { en: "Smart lockout", fr: "Le verrouillage intelligent" }
    - id: b
      text: { en: "Password writeback", fr: "La réécriture du mot de passe" }
    - id: c
      text: { en: "The global banned password list", fr: "La liste globale de mots de passe interdits" }
    - id: d
      text: { en: "Self-service password reset", fr: "La réinitialisation de mot de passe en libre-service" }
answer: { optionId: c }
explanation:
  correct:
    en: "The global banned password list contains the weak passwords and base terms that Microsoft finds in its security telemetry, which are the ones that password spray attacks use. It is applied automatically to every tenant, so a user who changes or resets a password can't pick one of them."
    fr: "La liste globale de mots de passe interdits contient les mots de passe faibles et les termes de base que Microsoft repère dans sa télémétrie de sécurité, ceux qu'utilisent les attaques par pulvérisation de mots de passe. Elle s'applique automatiquement à tous les locataires : un utilisateur qui change ou réinitialise son mot de passe ne peut pas en choisir un."
  options:
    a:
      en: "Smart lockout counts failed attempts on an account; a password spray is designed to stay under that threshold, and smart lockout doesn't control the passwords that users choose."
      fr: "Le verrouillage intelligent compte les tentatives infructueuses sur un compte ; une pulvérisation de mots de passe est conçue pour rester sous ce seuil, et le verrouillage intelligent ne contrôle pas les mots de passe que les utilisateurs choisissent."
    b:
      en: "Password writeback copies cloud password changes to the on-premises directory; it doesn't evaluate the strength of a password."
      fr: "La réécriture du mot de passe copie vers l'annuaire local les changements de mot de passe faits dans le cloud ; elle n'évalue pas la force d'un mot de passe."
    d:
      en: "Self-service password reset lets users reset their password themselves; the rejection of weak passwords comes from Microsoft Entra Password Protection."
      fr: "La réinitialisation de mot de passe en libre-service laisse les utilisateurs réinitialiser eux-mêmes leur mot de passe ; le rejet des mots de passe faibles vient de la protection par mot de passe Microsoft Entra."
references:
  - title: Eliminate bad passwords using Microsoft Entra Password Protection
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad
  - title: Describe password protection and management capabilities
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/5-describe-password-protection-management
