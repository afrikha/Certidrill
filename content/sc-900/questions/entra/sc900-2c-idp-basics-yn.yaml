id: sc900-2c-idp-basics-yn
objective: "2.4.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra ID Protection, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur Protection Microsoft Entra ID, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Microsoft Entra ID Protection gives users a privileged role for a limited time after an approval."
        fr: "Protection Microsoft Entra ID donne aux utilisateurs un rôle privilégié pour une durée limitée après une approbation."
    - id: s2
      text:
        en: "Microsoft Entra ID Protection classifies the risks that it detects as low, medium or high."
        fr: "Protection Microsoft Entra ID classe les risques qu'elle détecte en niveau faible, moyen ou élevé."
    - id: s3
      text:
        en: "Microsoft Entra ID Protection can detect that a sign-in comes from an anonymous IP address."
        fr: "Protection Microsoft Entra ID peut détecter qu'une connexion provient d'une adresse IP anonyme."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Giving a privileged role for a limited time after an approval is what Privileged Identity Management does. ID Protection detects identity-based risks, such as a sign-in from an anonymous IP address, and assigns them a risk level of low, medium or high that reflects how confident Microsoft is that the account or the sign-in is compromised."
    fr: "Donner un rôle privilégié pour une durée limitée après une approbation est le rôle de Privileged Identity Management. Protection Microsoft Entra ID détecte les risques liés aux identités, comme une connexion depuis une adresse IP anonyme, et leur attribue un niveau de risque faible, moyen ou élevé, qui reflète le degré de certitude de Microsoft quant à la compromission du compte ou de la connexion."
references:
  - title: What is Microsoft Entra ID Protection?
    url: https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection
  - title: Risk detection types and levels
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-risk-detection-types
