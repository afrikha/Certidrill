id: sc900-2a-hybrid-phs-outage
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam synchronizes its on-premises Active Directory with Microsoft Entra ID. Users must be able to sign in to Microsoft 365 with their usual password even when all the on-premises servers of Fabrikam are unavailable.

    Which sign-in method should Fabrikam use?
  fr: |
    Fabrikam synchronise son Active Directory local avec Microsoft Entra ID. Les utilisateurs doivent pouvoir se connecter à Microsoft 365 avec leur mot de passe habituel même lorsque tous les serveurs locaux de Fabrikam sont indisponibles.

    Quelle méthode de connexion Fabrikam doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Pass-through authentication", fr: "L'authentification directe" } }
    - { id: b, text: { en: "Password hash synchronization", fr: "La synchronisation de hachage du mot de passe" } }
    - { id: c, text: { en: "Federation with Active Directory Federation Services (AD FS)", fr: "La fédération avec Active Directory Federation Services (AD FS)" } }
    - { id: d, text: { en: "Federation with PingFederate", fr: "La fédération avec PingFederate" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With password hash synchronization, a hash of the password of each user is synchronized to Microsoft Entra ID, which validates the credentials itself, in the cloud. Sign-in therefore doesn't depend on any on-premises server, and users keep the same password as on-premises. For this reason, Microsoft recommends enabling password hash synchronization even as a backup for the other methods.
    fr: |
      Avec la synchronisation de hachage du mot de passe, un hachage du mot de passe de chaque utilisateur est synchronisé vers Microsoft Entra ID, qui valide lui-même les informations d'identification, dans le cloud. La connexion ne dépend donc d'aucun serveur local, et les utilisateurs gardent le même mot de passe qu'en local. C'est pourquoi Microsoft recommande d'activer la synchronisation de hachage du mot de passe, même en secours des autres méthodes.
  options:
    a:
      en: "Pass-through authentication validates each password against the on-premises Active Directory through on-premises agents: sign-in fails when these servers are unavailable."
      fr: "L'authentification directe valide chaque mot de passe auprès de l'Active Directory local par l'intermédiaire d'agents locaux : la connexion échoue lorsque ces serveurs sont indisponibles."
    c:
      en: "With federation, all user authentication occurs on-premises, on the AD FS servers: sign-in depends on them."
      fr: "Avec la fédération, toute l'authentification des utilisateurs a lieu en local, sur les serveurs AD FS : la connexion en dépend."
    d:
      en: "PingFederate is another federation system that the organization hosts: authentication still depends on the infrastructure of Fabrikam."
      fr: "PingFederate est un autre système de fédération hébergé par l'organisation : l'authentification dépend toujours de l'infrastructure de Fabrikam."
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
  - title: What is password hash synchronization with Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/whatis-phs
