id: sc900-2b-roles-categories-match
objective: "2.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Microsoft Entra built-in roles fall into three broad categories.

    Match each category to a role that belongs to it. To answer, drag the appropriate role to each category. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les rôles intégrés de Microsoft Entra se répartissent en trois grandes catégories.

    Associez chaque catégorie à un rôle qui en fait partie. Pour répondre, faites glisser le rôle approprié vers chaque catégorie. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: exchange, text: Exchange Administrator }
    - { id: contributor, text: Contributor }
    - { id: security, text: Security Administrator }
    - { id: user, text: User Administrator }
  targets:
    - id: entra
      text: { en: "Microsoft Entra-specific role: manages resources that exist only in Microsoft Entra ID", fr: "Rôle propre à Microsoft Entra : gère des ressources qui n'existent que dans Microsoft Entra ID" }
    - id: service
      text: { en: "Service-specific role: manages the features of one Microsoft 365 service", fr: "Rôle propre à un service : gère les fonctionnalités d'un service Microsoft 365" }
    - id: cross
      text: { en: "Cross-service role: grants access across several services", fr: "Rôle interservices : donne accès à plusieurs services" }
answer:
  mapping: { entra: user, service: exchange, cross: security }
explanation:
  correct:
    en: "User Administrator manages users and groups, which exist only in Microsoft Entra ID: it is a Microsoft Entra-specific role, like Application Administrator and Groups Administrator. Exchange Administrator manages one Microsoft 365 service, like the Intune, SharePoint and Teams Administrator roles. Security Administrator spans several security services, as Compliance Administrator does for compliance. Contributor isn't a Microsoft Entra role: it is an Azure role that manages Azure resources."
    fr: "User Administrator gère les utilisateurs et les groupes, qui n'existent que dans Microsoft Entra ID : c'est un rôle propre à Microsoft Entra, comme Application Administrator et Groups Administrator. Exchange Administrator gère un seul service Microsoft 365, comme les rôles Intune Administrator, SharePoint Administrator et Teams Administrator. Security Administrator couvre plusieurs services de sécurité, comme Compliance Administrator pour la conformité. Contributor n'est pas un rôle Microsoft Entra : c'est un rôle Azure qui gère des ressources Azure."
references:
  - title: Understand roles in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/concept-understand-roles
  - title: Describe Microsoft Entra roles and role-based access control (RBAC)
    url: https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/3-describe-azure-role-based-access-control
