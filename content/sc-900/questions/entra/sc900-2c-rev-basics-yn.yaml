id: sc900-2c-rev-basics-yn
objective: "2.4.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about access reviews, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les révisions d'accès, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An access review can be scheduled to recur, for example every month or every quarter."
        fr: "Une révision d'accès peut être planifiée de façon récurrente, par exemple chaque mois ou chaque trimestre."
    - id: s2
      text:
        en: "An access review can cover the guest users who are members of a group."
        fr: "Une révision d'accès peut porter sur les utilisateurs invités qui sont membres d'un groupe."
    - id: s3
      text:
        en: "An access review requires the reviewed users to complete multifactor authentication at each sign-in."
        fr: "Une révision d'accès impose aux utilisateurs révisés l'authentification multifacteur à chaque connexion."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Reviews can recur weekly, monthly, quarterly or annually, and reviewers are notified at the start of each occurrence. Confirming that guests still have a legitimate need is one of the main uses of access reviews. A review checks whether access is still needed; requiring multifactor authentication at sign-in is done with Conditional Access."
    fr: "Les révisions peuvent se répéter chaque semaine, chaque mois, chaque trimestre ou chaque année, et les réviseurs sont avertis au début de chaque occurrence. Confirmer que les invités ont encore un besoin légitime est l'un des principaux usages des révisions d'accès. Une révision vérifie si un accès est encore nécessaire ; exiger l'authentification multifacteur à la connexion se fait avec l'accès conditionnel."
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
