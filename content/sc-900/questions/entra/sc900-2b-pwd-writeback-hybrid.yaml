id: sc900-2b-pwd-writeback-hybrid
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank synchronizes the users of its on-premises Active Directory Domain Services (AD DS) domain to Microsoft Entra ID.

    The users reset forgotten passwords in the cloud by using self-service password reset. The new password must apply immediately to the on-premises AD DS account as well.

    Which feature should Woodgrove Bank enable?
  fr: |
    Woodgrove Bank synchronise les utilisateurs de son domaine Active Directory Domain Services (AD DS) local vers Microsoft Entra ID.

    Les utilisateurs réinitialisent dans le cloud leurs mots de passe oubliés avec la réinitialisation de mot de passe en libre-service. Le nouveau mot de passe doit s'appliquer aussitôt au compte AD DS local également.

    Quelle fonctionnalité Woodgrove Bank doit-elle activer ?
body:
  options:
    - id: a
      text: { en: "Password writeback", fr: "La réécriture du mot de passe" }
    - id: b
      text: { en: "Password hash synchronization", fr: "La synchronisation de hachage du mot de passe" }
    - id: c
      text: { en: "Pass-through authentication", fr: "L'authentification directe" }
    - id: d
      text: { en: "Microsoft Entra Password Protection", fr: "La protection par mot de passe Microsoft Entra" }
answer: { optionId: a }
explanation:
  correct:
    en: "Password writeback sends a password that is changed or reset in the cloud back to the on-premises AD DS environment in real time, after checking it against the on-premises password policy. Without writeback, a user whose password is managed on-premises can't complete a self-service reset."
    fr: "La réécriture du mot de passe renvoie en temps réel vers l'environnement AD DS local un mot de passe changé ou réinitialisé dans le cloud, après l'avoir vérifié par rapport à la stratégie de mot de passe locale. Sans réécriture, un utilisateur dont le mot de passe est géré en local ne peut pas terminer une réinitialisation en libre-service."
  options:
    b:
      en: "Password hash synchronization goes the other way: it lets Microsoft Entra ID validate sign-ins against a synchronized hash of the on-premises password."
      fr: "La synchronisation de hachage du mot de passe va dans l'autre sens : elle permet à Microsoft Entra ID de valider les connexions par rapport à un hachage synchronisé du mot de passe local."
    c:
      en: "Pass-through authentication has the on-premises Active Directory validate sign-ins; on its own it doesn't bring a cloud password reset back on-premises."
      fr: "Avec l'authentification directe, l'Active Directory local valide les connexions ; à elle seule, elle ne ramène pas en local une réinitialisation de mot de passe faite dans le cloud."
    d:
      en: "Microsoft Entra Password Protection blocks weak passwords; it doesn't copy a new password to another directory."
      fr: "La protection par mot de passe Microsoft Entra bloque les mots de passe faibles ; elle ne copie pas un nouveau mot de passe vers un autre annuaire."
references:
  - title: How does self-service password reset writeback work in Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-writeback
  - title: "How it works: Microsoft Entra self-service password reset"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
