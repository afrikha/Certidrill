id: sc900-2b-ca-grant-controls-match
objective: "2.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware is designing Conditional Access policies.

    Match each requirement to the access control that meets it. To answer, drag the appropriate control to each requirement. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit des stratégies d'accès conditionnel.

    Associez chaque exigence au contrôle d'accès qui y répond. Pour répondre, faites glisser le contrôle approprié vers chaque exigence. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mfa, text: { en: "Require multifactor authentication", fr: "Exiger l'authentification multifacteur" } }
    - { id: tou, text: { en: "Require terms of use", fr: "Exiger des conditions d'utilisation" } }
    - { id: block, text: { en: "Block access", fr: "Bloquer l'accès" } }
    - { id: pwd, text: { en: "Require password change", fr: "Exiger un changement de mot de passe" } }
    - { id: compliant, text: { en: "Require device to be marked as compliant", fr: "Exiger que l'appareil soit marqué comme conforme" } }
  targets:
    - id: country
      text: { en: "Sign-ins from countries where Litware has no activity must be refused.", fr: "Les connexions depuis les pays où Litware n'a aucune activité doivent être refusées." }
    - id: device
      text: { en: "Only devices that meet Litware's security requirements may open the finance application.", fr: "Seuls les appareils qui respectent les exigences de sécurité de Litware peuvent ouvrir l'application de finance." }
    - id: guest
      text: { en: "Guest users must agree to Litware's usage rules before they open the partner portal.", fr: "Les utilisateurs invités doivent accepter les règles d'usage de Litware avant d'ouvrir le portail des partenaires." }
    - id: risk
      text: { en: "A user whose account is at high user risk must choose a new password.", fr: "Un utilisateur dont le compte présente un risque utilisateur élevé doit choisir un nouveau mot de passe." }
answer:
  mapping: { country: block, device: compliant, guest: tou, risk: pwd }
explanation:
  correct:
    en: "Block access is the most restrictive decision and suits sign-ins from unwanted locations. Requiring a device marked as compliant limits access to devices that meet the organization's compliance requirements. Terms of use make users acknowledge a document before access is granted. Require password change is used with the user risk condition, so that a user whose credentials may be compromised sets a new password. Requiring multifactor authentication adds a second verification but fits none of these four requirements exactly."
    fr: "Bloquer l'accès est la décision la plus restrictive et convient aux connexions depuis des emplacements indésirables. Exiger un appareil marqué comme conforme limite l'accès aux appareils qui respectent les exigences de conformité de l'organisation. Les conditions d'utilisation font accepter un document aux utilisateurs avant que l'accès soit accordé. Exiger un changement de mot de passe s'utilise avec la condition de risque utilisateur, pour qu'un utilisateur dont les informations d'identification sont peut-être compromises définisse un nouveau mot de passe. Exiger l'authentification multifacteur ajoute une seconde vérification mais ne correspond exactement à aucune de ces quatre exigences."
references:
  - title: "Conditional Access: Grant"
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
