id: sc900-2b-mfa-defaults-vs-ca-yn
objective: "2.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses security defaults in its Microsoft Entra tenant and is considering Conditional Access.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise les paramètres de sécurité par défaut dans son locataire Microsoft Entra et envisage l'accès conditionnel.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Woodgrove Bank must turn off security defaults when it replaces them with its own Conditional Access policies."
        fr: "Woodgrove Bank doit désactiver les paramètres de sécurité par défaut lorsqu'elle les remplace par ses propres stratégies d'accès conditionnel."
    - id: s2
      text:
        en: "With security defaults, a user who holds the Global Administrator role is required to perform multifactor authentication at every sign-in."
        fr: "Avec les paramètres de sécurité par défaut, un utilisateur qui détient le rôle Global Administrator doit effectuer l'authentification multifacteur à chaque connexion."
    - id: s3
      text:
        en: "With security defaults, an administrator can exclude a group of users from multifactor authentication."
        fr: "Avec les paramètres de sécurité par défaut, un administrateur peut exclure un groupe d'utilisateurs de l'authentification multifacteur."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Security defaults and Conditional Access policies aren't used together: an organization that implements Conditional Access policies to replace security defaults must disable security defaults. Security defaults require administrators, including Global Administrators, to complete multifactor authentication each time they sign in. Security defaults offer no customization, so excluding users or groups requires Conditional Access."
    fr: "Les paramètres de sécurité par défaut et les stratégies d'accès conditionnel ne s'utilisent pas ensemble : une organisation qui met en place des stratégies d'accès conditionnel pour remplacer les paramètres de sécurité par défaut doit désactiver ces derniers. Les paramètres de sécurité par défaut exigent des administrateurs, dont les Global Administrators, l'authentification multifacteur à chaque connexion. Ils n'offrent aucune personnalisation : exclure des utilisateurs ou des groupes demande l'accès conditionnel."
references:
  - title: Security defaults in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
