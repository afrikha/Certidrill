id: sc900-2c-gov-onboarding-workflow
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders wants to automate the arrival of new employees. Seven days before the hire date of each new employee, an email that contains a Temporary Access Pass must be sent to the employee's manager, without any action from the IT department.

    Which Microsoft Entra ID Governance feature should Northwind Traders use?
  fr: |
    Northwind Traders veut automatiser l'arrivée des nouveaux employés. Sept jours avant la date d'embauche de chaque nouvel employé, un e-mail contenant un passe d'accès temporaire doit être envoyé au responsable de l'employé, sans aucune action du service informatique.

    Quelle fonctionnalité de Gouvernance Microsoft Entra ID Northwind Traders doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Access reviews", fr: "Les révisions d'accès" }
    - id: b
      text: { en: "Privileged Identity Management", fr: "Privileged Identity Management" }
    - id: c
      text: { en: "Entitlement management", fr: "La gestion des droits d'utilisation" }
    - id: d
      text: { en: "Lifecycle workflows", fr: "Les workflows de cycle de vie" }
answer: { optionId: d }
explanation:
  correct:
    en: "Lifecycle workflows automate tasks at the key moments of a user's lifecycle: before the start date, when the person changes position, and at departure. A workflow combines tasks, such as sending an email to the manager with a Temporary Access Pass, with a trigger based on a user attribute such as the hire date."
    fr: "Les workflows de cycle de vie automatisent des tâches aux moments clés du cycle de vie d'un utilisateur : avant la date d'arrivée, lors d'un changement de poste et au départ. Un workflow associe des tâches, comme l'envoi au responsable d'un e-mail contenant un passe d'accès temporaire, à un déclencheur fondé sur un attribut de l'utilisateur tel que la date d'embauche."
  options:
    a:
      en: "Access reviews ask reviewers to confirm periodically that users still need their access; they don't run onboarding tasks."
      fr: "Les révisions d'accès demandent à des réviseurs de confirmer périodiquement que les utilisateurs ont encore besoin de leur accès ; elles n'exécutent pas de tâches d'intégration."
    b:
      en: "Privileged Identity Management gives just-in-time access to privileged roles; it doesn't automate tasks before a hire date."
      fr: "Privileged Identity Management donne un accès juste-à-temps aux rôles privilégiés ; il n'automatise pas de tâches avant une date d'embauche."
    c:
      en: "Entitlement management handles requests, approvals and expiration of access packages; sending an email before a hire date is a lifecycle workflow task."
      fr: "La gestion des droits d'utilisation gère les demandes, les approbations et l'expiration des packages d'accès ; l'envoi d'un e-mail avant une date d'embauche est une tâche de workflow de cycle de vie."
references:
  - title: What are lifecycle workflows?
    url: https://learn.microsoft.com/en-us/entra/id-governance/what-are-lifecycle-workflows
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
