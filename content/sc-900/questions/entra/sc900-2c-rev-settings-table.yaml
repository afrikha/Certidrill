id: sc900-2c-rev-settings-table
objective: "2.4.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has the four access reviews shown in the following table.

    Answer each prompt by selecting, in the **Review** column, the review that meets the description.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose des quatre révisions d'accès présentées dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant, dans la colonne **Révision**, la révision qui correspond à la description.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "Each user states personally whether they still need the access."
        fr: "Chaque utilisateur indique lui-même s'il a encore besoin de l'accès."
    - id: p2
      text:
        en: "Every three months, the users who are denied lose their access without an administrator having to apply the results."
        fr: "Tous les trois mois, les utilisateurs refusés perdent leur accès sans qu'un administrateur ait à appliquer les résultats."
  grid:
    header:
      - { en: "Review", fr: "Révision" }
      - { en: "What is reviewed", fr: "Ce qui est révisé" }
      - { en: "Reviewers", fr: "Réviseurs" }
      - { en: "Recurrence", fr: "Périodicité" }
      - { en: "Results", fr: "Résultats" }
    rows:
      - - { text: "Review1", area: r1 }
        - { text: { en: "Members of the group Sales-EU", fr: "Membres du groupe Sales-EU" } }
        - { text: { en: "Group owners", fr: "Propriétaires du groupe" } }
        - { text: { en: "Quarterly", fr: "Trimestrielle" } }
        - { text: { en: "Applied automatically", fr: "Appliqués automatiquement" } }
      - - { text: "Review2", area: r2 }
        - { text: { en: "Guests of the team Project-Alpha", fr: "Invités de l'équipe Project-Alpha" } }
        - { text: { en: "Selected users", fr: "Utilisateurs sélectionnés" } }
        - { text: { en: "Monthly", fr: "Mensuelle" } }
        - { text: { en: "Applied manually", fr: "Appliqués manuellement" } }
      - - { text: "Review3", area: r3 }
        - { text: { en: "Users assigned to the application App1", fr: "Utilisateurs affectés à l'application App1" } }
        - { text: { en: "Users review their own access", fr: "Les utilisateurs révisent leur propre accès" } }
        - { text: { en: "Annual", fr: "Annuelle" } }
        - { text: { en: "Applied automatically", fr: "Appliqués automatiquement" } }
      - - { text: "Review4", area: r4 }
        - { text: { en: "Members of the group Finance", fr: "Membres du groupe Finance" } }
        - { text: { en: "Managers of users", fr: "Responsables des utilisateurs" } }
        - { text: { en: "Quarterly", fr: "Trimestrielle" } }
        - { text: { en: "Applied manually", fr: "Appliqués manuellement" } }
answer:
  values: { p1: r3, p2: r1 }
explanation:
  correct:
    en: "Review3 is a self-review: the users review their own access instead of an owner, a manager or a selected reviewer. Review1 is the only review that both recurs every quarter and applies its results automatically, so denied access is removed when each occurrence ends. Review4 also runs every quarter, but an administrator has to apply its results, and Review3 applies its results automatically only once a year."
    fr: "Review3 est une autorévision : les utilisateurs révisent leur propre accès, à la place d'un propriétaire, d'un responsable ou d'un réviseur sélectionné. Review1 est la seule révision à la fois trimestrielle et dont les résultats s'appliquent automatiquement : l'accès refusé est retiré à la fin de chaque occurrence. Review4 a lieu aussi chaque trimestre, mais un administrateur doit appliquer ses résultats, et Review3 n'applique automatiquement ses résultats qu'une fois par an."
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
