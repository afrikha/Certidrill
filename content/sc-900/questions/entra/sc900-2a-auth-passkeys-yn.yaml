id: sc900-2a-auth-passkeys-yn
objective: "2.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about passkeys (FIDO2) in Microsoft Entra ID, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les clés d'accès (FIDO2) dans Microsoft Entra ID, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A passkey in Microsoft Authenticator is a synced passkey.
        fr: Une clé d'accès dans Microsoft Authenticator est une clé d'accès synchronisée.
    - id: s2
      text:
        en: The private key of a synced passkey is available on several devices of the user through a cloud passkey provider.
        fr: La clé privée d'une clé d'accès synchronisée est disponible sur plusieurs appareils de l'utilisateur grâce à un fournisseur cloud de clés d'accès.
    - id: s3
      text:
        en: When a user registers a passkey, the private key is sent to Microsoft Entra ID.
        fr: Lorsqu'un utilisateur inscrit une clé d'accès, la clé privée est envoyée à Microsoft Entra ID.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A passkey is a key pair created at registration: the private key is stored securely on the side of the user, and only the public key is registered with Microsoft Entra ID. With a device-bound passkey, such as a FIDO2 security key or a passkey in Microsoft Authenticator, the private key never leaves one physical device. With a synced passkey, a cloud passkey provider such as Apple iCloud Keychain or Google Password Manager syncs the private key across the devices of the user.
    fr: |
      Une clé d'accès est une paire de clés créée lors de l'inscription : la clé privée est stockée de façon sécurisée du côté de l'utilisateur, et seule la clé publique est inscrite auprès de Microsoft Entra ID. Avec une clé d'accès liée à l'appareil, comme une clé de sécurité FIDO2 ou une clé d'accès dans Microsoft Authenticator, la clé privée ne quitte jamais un appareil physique donné. Avec une clé d'accès synchronisée, un fournisseur cloud de clés d'accès comme Apple iCloud Keychain ou Google Password Manager synchronise la clé privée entre les appareils de l'utilisateur.
references:
  - title: Authentication methods in Microsoft Entra ID - passkeys (FIDO2)
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-passwordless
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
