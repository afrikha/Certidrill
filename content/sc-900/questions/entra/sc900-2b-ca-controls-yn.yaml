id: sc900-2b-ca-controls-yn
objective: "2.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Conditional Access policies, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les stratégies d'accès conditionnel, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A Conditional Access policy can take into account the country from which a user signs in."
        fr: "Une stratégie d'accès conditionnel peut tenir compte du pays depuis lequel un utilisateur se connecte."
    - id: s2
      text:
        en: "A Conditional Access policy can block access to an application."
        fr: "Une stratégie d'accès conditionnel peut bloquer l'accès à une application."
    - id: s3
      text:
        en: "A Conditional Access policy in report-only mode blocks the users who don't meet its requirements."
        fr: "Une stratégie d'accès conditionnel en mode rapport seul (Report-only) bloque les utilisateurs qui ne satisfont pas ses exigences."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "IP location is a common signal: administrators can define IP address ranges and whole countries or regions to block or allow. Block access is the most restrictive decision of a policy. In report-only mode a policy is evaluated and its result is logged, but its controls aren't enforced: nobody is blocked or prompted."
    fr: "L'emplacement IP est un signal courant : les administrateurs peuvent définir des plages d'adresses IP et des pays ou régions entiers à bloquer ou à autoriser. Bloquer l'accès est la décision la plus restrictive d'une stratégie. En mode rapport seul, une stratégie est évaluée et son résultat est consigné, mais ses contrôles ne sont pas appliqués : personne n'est bloqué ni sollicité."
references:
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
  - title: Analyze Conditional Access Policy Impact
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-report-only
