id: sc900-2a-auth-methods-sentences
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[m1]] shows a number on the sign-in screen, which the user matches in an app on their phone.

      [[m2]] lets a user authenticate with an X.509 certificate directly against Microsoft Entra ID.

      [[m3]] sends a text message that contains a verification code to the registered mobile number of the user.
    fr: |
      [[m1]] affiche sur l'écran de connexion un numéro que l'utilisateur fait correspondre dans une application sur son téléphone.

      [[m2]] permet à un utilisateur de s'authentifier avec un certificat X.509 directement auprès de Microsoft Entra ID.

      [[m3]] envoie au numéro de mobile inscrit de l'utilisateur un SMS qui contient un code de vérification.
  slots:
    - id: m1
      options:
        - { id: whfb, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
        - { id: auth, text: { en: "Passwordless sign-in with Microsoft Authenticator", fr: "La connexion sans mot de passe avec Microsoft Authenticator" } }
        - { id: qr, text: { en: "QR code authentication", fr: "L'authentification par code QR" } }
    - id: m2
      options:
        - { id: cba, text: { en: "Certificate-based authentication", fr: "L'authentification basée sur un certificat" } }
        - { id: tap, text: { en: "A Temporary Access Pass", fr: "Un passe d'accès temporaire (Temporary Access Pass)" } }
        - { id: oath, text: { en: "A hardware OATH token", fr: "Un jeton OATH matériel" } }
    - id: m3
      options:
        - { id: voice, text: { en: "Voice call verification", fr: "La vérification par appel vocal" } }
        - { id: email, text: { en: "An email one-time passcode", fr: "Un code secret à usage unique par e-mail" } }
        - { id: sms, text: { en: "SMS-based authentication", fr: "L'authentification par SMS" } }
answer:
  values: { m1: auth, m2: cba, m3: sms }
explanation:
  correct:
    en: |
      With passwordless sign-in in Microsoft Authenticator, a number appears on the sign-in screen and the user matches it in the app, then confirms with biometrics or a PIN. Certificate-based authentication lets users authenticate with X.509 certificates directly against their Microsoft Entra identity, without federated infrastructure such as AD FS. SMS-based authentication sends a text message with a verification code to the registered mobile number.
    fr: |
      Avec la connexion sans mot de passe de Microsoft Authenticator, un numéro apparaît sur l'écran de connexion et l'utilisateur le fait correspondre dans l'application, puis confirme par la biométrie ou un code PIN. L'authentification basée sur un certificat permet aux utilisateurs de s'authentifier avec des certificats X.509 directement auprès de leur identité Microsoft Entra, sans infrastructure fédérée comme AD FS. L'authentification par SMS envoie un SMS contenant un code de vérification au numéro de mobile inscrit.
  options:
    whfb:
      en: "Windows Hello for Business unlocks a credential tied to the Windows device with a PIN or biometrics; no number is matched on a phone."
      fr: "Windows Hello Entreprise déverrouille une information d'identification liée à l'appareil Windows avec un code PIN ou la biométrie ; aucun numéro n'est à faire correspondre sur un téléphone."
    oath:
      en: "A hardware OATH token displays time-based one-time codes; it doesn't use an X.509 certificate."
      fr: "Un jeton OATH matériel affiche des codes à usage unique basés sur le temps ; il n'utilise pas de certificat X.509."
    voice:
      en: "Voice call verification makes an automated call to the registered number; no text message is sent."
      fr: "La vérification par appel vocal passe un appel automatisé au numéro inscrit ; aucun SMS n'est envoyé."
references:
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
  - title: What is Microsoft Entra certificate-based authentication?
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-certificate-based-authentication
