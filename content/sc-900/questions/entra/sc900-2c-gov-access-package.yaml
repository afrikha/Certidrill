id: sc900-2c-gov-access-package
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every member of a new project at Contoso needs a Microsoft Teams team, a SharePoint site and an application. Contoso wants employees to request all three in a single request that a project lead approves, and the access must end automatically after six months.

    What should Contoso create in entitlement management?
  fr: |
    Chaque membre d'un nouveau projet de Contoso a besoin d'une équipe Microsoft Teams, d'un site SharePoint et d'une application. Contoso veut que les employés demandent les trois en une seule demande qu'un chef de projet approuve, et l'accès doit prendre fin automatiquement au bout de six mois.

    Que doit créer Contoso dans la gestion des droits d'utilisation ?
body:
  options:
    - id: a
      text: { en: "An administrative unit", fr: "Une unité administrative" }
    - id: b
      text: { en: "An access package", fr: "Un package d'accès" }
    - id: c
      text: { en: "A dynamic membership group", fr: "Un groupe d'appartenance dynamique" }
    - id: d
      text: { en: "A lifecycle workflow", fr: "Un workflow de cycle de vie" }
answer: { optionId: b }
explanation:
  correct:
    en: "An access package bundles the resources that a person needs for a project or a task: group and team memberships, applications and SharePoint sites. Its policies define who can request it, who approves the request and when the assignment expires, which matches the three requirements."
    fr: "Un package d'accès regroupe les ressources dont une personne a besoin pour un projet ou une tâche : appartenances à des groupes et à des équipes, applications et sites SharePoint. Ses stratégies définissent qui peut le demander, qui approuve la demande et quand l'attribution expire, ce qui répond aux trois exigences."
  options:
    a:
      en: "An administrative unit restricts the scope of an administrator role to a subset of users, groups or devices; it grants no access to resources."
      fr: "Une unité administrative limite l'étendue d'un rôle d'administrateur à un sous-ensemble d'utilisateurs, de groupes ou d'appareils ; elle ne donne aucun accès à des ressources."
    c:
      en: "A dynamic membership group adds and removes members by a rule on their attributes; users don't request it and nobody approves."
      fr: "Un groupe d'appartenance dynamique ajoute et retire ses membres selon une règle sur leurs attributs ; les utilisateurs ne le demandent pas et personne n'approuve."
    d:
      en: "A lifecycle workflow runs tasks when a person joins, moves or leaves; it isn't a bundle of resources that users request."
      fr: "Un workflow de cycle de vie exécute des tâches quand une personne arrive, change de poste ou part ; ce n'est pas un lot de ressources que les utilisateurs demandent."
references:
  - title: What is entitlement management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview
