id: sc900-2c-idp-risky-users-report
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security analyst at Adatum wants a list of the accounts that Microsoft Entra ID Protection considers at risk, whether the risk comes from their sign-ins or from other detections such as leaked credentials.

    Which ID Protection report should the analyst open?
  fr: |
    Un analyste de sécurité d'Adatum veut la liste des comptes que Protection Microsoft Entra ID considère comme à risque, que le risque vienne de leurs connexions ou d'autres détections comme des informations d'identification divulguées.

    Quel rapport de Protection Microsoft Entra ID l'analyste doit-il ouvrir ?
body:
  options:
    - id: a
      text: { en: "Risky users", fr: "Utilisateurs à risque" }
    - id: b
      text: { en: "Risky sign-ins", fr: "Connexions à risque" }
    - id: c
      text: { en: "Risk detections", fr: "Détections de risque" }
    - id: d
      text: { en: "Risky workload identities", fr: "Identités de charge de travail à risque" }
answer: { optionId: a }
explanation:
  correct:
    en: "ID Protection offers three main reports. The risky users report lists a user when the user has one or more risky sign-ins, one or more risk detections, or both; it is the report to open for a list of accounts at risk."
    fr: "Protection Microsoft Entra ID propose trois rapports principaux. Le rapport des utilisateurs à risque répertorie un utilisateur dès qu'il a une ou plusieurs connexions à risque, une ou plusieurs détections de risque, ou les deux ; c'est le rapport à ouvrir pour obtenir la liste des comptes à risque."
  options:
    b:
      en: "The risky sign-ins report lists sign-ins to which risk detections apply; it wouldn't show an account whose only detection isn't linked to a sign-in."
      fr: "Le rapport des connexions à risque répertorie les connexions auxquelles s'appliquent des détections de risque ; il ne montrerait pas un compte dont la seule détection n'est pas liée à une connexion."
    c:
      en: "The risk detections report lists every detection one by one, not the accounts."
      fr: "Le rapport des détections de risque répertorie chaque détection une par une, pas les comptes."
    d:
      en: "The risky workload identities report concerns applications and service principals, not user accounts."
      fr: "Le rapport des identités de charge de travail à risque concerne les applications et les principaux de service, pas les comptes d'utilisateurs."
references:
  - title: What is Microsoft Entra ID Protection?
    url: https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection
