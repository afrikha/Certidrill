id: sc900-2b-roles-billing-admin
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An employee of the finance department of Fabrikam must purchase licenses and manage the subscriptions of the organization. The employee must not be able to manage user accounts.

    The solution must follow the principle of least privilege.

    Which Microsoft Entra role should you assign?
  fr: |
    Un employé du service financier de Fabrikam doit acheter des licences et gérer les abonnements de l'organisation. Il ne doit pas pouvoir gérer les comptes d'utilisateurs.

    La solution doit respecter le principe du moindre privilège.

    Quel rôle Microsoft Entra devez-vous attribuer ?
body:
  options:
    - { id: a, text: License Administrator }
    - { id: b, text: User Administrator }
    - { id: c, text: Billing Administrator }
    - { id: d, text: Global Administrator }
answer: { optionId: c }
explanation:
  correct:
    en: "Billing Administrator makes purchases, manages subscriptions and performs common billing tasks such as updating payment information. It gives no permission to create or manage users, so it meets the need with the least privilege."
    fr: "Billing Administrator effectue des achats, gère les abonnements et réalise les tâches de facturation courantes comme la mise à jour des informations de paiement. Il ne donne aucune autorisation de créer ou de gérer des utilisateurs : il répond donc au besoin avec le moindre privilège."
  options:
    a:
      en: "License Administrator assigns product licenses to users and groups; it can't purchase licenses or manage subscriptions."
      fr: "License Administrator attribue des licences de produits aux utilisateurs et aux groupes ; il ne peut pas acheter de licences ni gérer les abonnements."
    b:
      en: "User Administrator manages users and groups, which the employee must not be able to do."
      fr: "User Administrator gère les utilisateurs et les groupes, ce que l'employé ne doit pas pouvoir faire."
    d:
      en: "Global Administrator could make the purchases, but it also manages every administrative feature, including users."
      fr: "Global Administrator pourrait effectuer les achats, mais il gère aussi toutes les fonctionnalités d'administration, dont les utilisateurs."
references:
  - title: Describe Microsoft Entra roles and role-based access control (RBAC)
    url: https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/3-describe-azure-role-based-access-control
  - title: Microsoft Entra built-in roles
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference
