id: sc900-2a-hybrid-cloud-sync-sentences
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For hybrid identity, the synchronization tool that Microsoft recommends for new deployments is [[tool]].

      With this tool, the organization only needs to deploy [[component]] in its on-premises environment.

      The provisioning configuration is stored [[where]].
    fr: |
      Pour l'identité hybride, l'outil de synchronisation que Microsoft recommande pour les nouveaux déploiements est [[tool]].

      Avec cet outil, l'organisation n'a besoin de déployer dans son environnement local qu'[[component]].

      La configuration du provisionnement est stockée [[where]].
  slots:
    - id: tool
      options:
        - { id: connect, text: "Microsoft Entra Connect Sync" }
        - { id: cloud, text: "Microsoft Entra Cloud Sync" }
        - { id: adfs, text: "Active Directory Federation Services (AD FS)" }
    - id: component
      options:
        - { id: agent, text: { en: "a lightweight provisioning agent", fr: "un agent de provisionnement léger" } }
        - { id: farm, text: { en: "a farm of federation servers", fr: "une batterie de serveurs de fédération" } }
        - { id: server, text: { en: "a synchronization server with its database", fr: "un serveur de synchronisation avec sa base de données" } }
    - id: where
      options:
        - { id: ad, text: { en: "in the on-premises Active Directory", fr: "dans l'Active Directory local" } }
        - { id: local, text: { en: "on the server that runs the agent", fr: "sur le serveur qui exécute l'agent" } }
        - { id: entra, text: { en: "in Microsoft Entra ID", fr: "dans Microsoft Entra ID" } }
answer:
  values: { tool: cloud, component: agent, where: entra }
explanation:
  correct:
    en: |
      Microsoft Entra Cloud Sync is the synchronization tool that Microsoft recommends for hybrid identity. It relies on a lightweight provisioning agent that acts as a bridge between Active Directory and Microsoft Entra ID: the agent is the only component to deploy on-premises. The provisioning configuration is stored in Microsoft Entra ID and managed as part of the service.
    fr: |
      Microsoft Entra Cloud Sync est l'outil de synchronisation que Microsoft recommande pour l'identité hybride. Il s'appuie sur un agent de provisionnement léger qui sert de pont entre Active Directory et Microsoft Entra ID : l'agent est le seul composant à déployer en local. La configuration du provisionnement est stockée dans Microsoft Entra ID et gérée dans le cadre du service.
  options:
    connect:
      en: "Microsoft Entra Connect Sync is the earlier tool, based on an on-premises synchronization server, that Cloud Sync is replacing."
      fr: "Microsoft Entra Connect Sync est l'outil antérieur, fondé sur un serveur de synchronisation local, que Cloud Sync remplace."
    adfs:
      en: "AD FS is a federation service that authenticates users; it doesn't synchronize identities."
      fr: "AD FS est un service de fédération qui authentifie les utilisateurs ; il ne synchronise pas les identités."
    farm:
      en: "Federation servers are needed for federated sign-in, not for synchronization."
      fr: "Les serveurs de fédération servent à la connexion fédérée, pas à la synchronisation."
references:
  - title: Describe hybrid identity
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/4-describe-concept-of-hybrid-identity
  - title: What is Microsoft Entra Cloud Sync?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/what-is-cloud-sync
