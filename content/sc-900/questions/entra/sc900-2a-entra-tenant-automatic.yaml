id: sc900-2a-entra-tenant-automatic
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has never used a Microsoft cloud service. Contoso subscribes to Microsoft 365 for its 200 employees.

    What does Contoso get automatically with the subscription?
  fr: |
    Contoso n'a jamais utilisé de service cloud Microsoft. Contoso s'abonne à Microsoft 365 pour ses 200 employés.

    Qu'obtient automatiquement Contoso avec cet abonnement ?
body:
  options:
    - { id: a, text: { en: "An Active Directory Domain Services (AD DS) forest", fr: "Une forêt Active Directory Domain Services (AD DS)" } }
    - { id: b, text: { en: "A Microsoft Entra tenant", fr: "Un locataire Microsoft Entra" } }
    - { id: c, text: { en: "A Microsoft Entra Domain Services managed domain", fr: "Un domaine managé Microsoft Entra Domain Services" } }
    - { id: d, text: { en: "A Microsoft Entra External ID external tenant", fr: "Un locataire externe Microsoft Entra External ID" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Subscribers to Microsoft 365, Azure or Dynamics 365 automatically have access to Microsoft Entra ID. Contoso receives a tenant, that is, an instance of Microsoft Entra ID dedicated to the organization, which holds its users, groups, devices and application registrations. The Microsoft 365 accounts of the 200 employees are stored in this tenant.
    fr: |
      Les abonnés à Microsoft 365, à Azure ou à Dynamics 365 ont automatiquement accès à Microsoft Entra ID. Contoso reçoit un locataire, c'est-à-dire une instance de Microsoft Entra ID dédiée à l'organisation, qui contient ses utilisateurs, ses groupes, ses appareils et ses inscriptions d'applications. Les comptes Microsoft 365 des 200 employés sont stockés dans ce locataire.
  options:
    a:
      en: "An AD DS forest is an on-premises directory that an organization deploys on its own domain controllers; a Microsoft 365 subscription doesn't create one."
      fr: "Une forêt AD DS est un annuaire local que l'organisation déploie sur ses propres contrôleurs de domaine ; un abonnement Microsoft 365 n'en crée pas."
    c:
      en: "Microsoft Entra Domain Services is a separate service that an organization deploys when legacy applications need domain join, LDAP or Kerberos; it isn't created with the subscription."
      fr: "Microsoft Entra Domain Services est un service distinct, que l'organisation déploie lorsque des applications anciennes ont besoin de la jonction de domaine, de LDAP ou de Kerberos ; il n'est pas créé avec l'abonnement."
    d:
      en: "An external tenant is created on purpose to publish applications to consumers or business customers; the employees of Contoso are in a workforce tenant."
      fr: "Un locataire externe se crée volontairement pour publier des applications destinées à des consommateurs ou à des clients professionnels ; les employés de Contoso sont dans un locataire de main-d'œuvre."
references:
  - title: Describe Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/2-describe-azure-active-directory
