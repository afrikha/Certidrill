id: sc900-2c-idp-tasks
objective: "2.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two tasks can an organization perform by using Microsoft Entra ID Protection?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux tâches qu'une organisation peut effectuer avec Protection Microsoft Entra ID ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Give administrators just-in-time access to privileged roles", fr: "Donner aux administrateurs un accès juste-à-temps aux rôles privilégiés" } }
    - { id: b, text: { en: "Send risk data to a SIEM tool such as Microsoft Sentinel", fr: "Envoyer les données de risque à un outil SIEM comme Microsoft Sentinel" } }
    - { id: c, text: { en: "Ask group owners to recertify the members of their groups", fr: "Demander aux propriétaires de groupes de recertifier les membres de leurs groupes" } }
    - { id: d, text: { en: "Detect that the credentials of a user were leaked", fr: "Détecter que les informations d'identification d'un utilisateur ont été divulguées" } }
    - { id: e, text: { en: "Let partner users request a bundle of resources", fr: "Permettre à des utilisateurs partenaires de demander un lot de ressources" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "ID Protection detects identity-based risks, among them leaked credentials, lets administrators investigate them and remediates them. Its risk data can also be exported to other tools, for example to Microsoft Sentinel or another security information and event management (SIEM) solution, for further investigation and correlation."
    fr: "Protection Microsoft Entra ID détecte les risques liés aux identités, dont les informations d'identification divulguées, permet aux administrateurs de les examiner et les corrige. Ses données de risque peuvent aussi être exportées vers d'autres outils, par exemple Microsoft Sentinel ou une autre solution de gestion des informations et des événements de sécurité (SIEM), pour un examen et une corrélation plus poussés."
  options:
    a:
      en: "Just-in-time access to privileged roles is provided by Privileged Identity Management."
      fr: "L'accès juste-à-temps aux rôles privilégiés est fourni par Privileged Identity Management."
    c:
      en: "Periodic recertification of group members is done with access reviews."
      fr: "La recertification périodique des membres de groupes se fait avec les révisions d'accès."
    e:
      en: "Requests for a bundle of resources, including by partner users, are handled by entitlement management with access packages."
      fr: "Les demandes d'un lot de ressources, y compris par des utilisateurs partenaires, sont gérées par la gestion des droits d'utilisation avec des packages d'accès."
references:
  - title: What is Microsoft Entra ID Protection?
    url: https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection
