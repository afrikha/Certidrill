id: sc900-2c-pim-azure-roles
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Microsoft Entra Privileged Identity Management (PIM) to provide just-in-time access to Microsoft Entra roles.

    To which other privileged access can PIM provide just-in-time access?
  fr: |
    Contoso utilise Microsoft Entra Privileged Identity Management (PIM) pour fournir un accès juste-à-temps aux rôles Microsoft Entra.

    À quel autre accès privilégié PIM peut-il fournir un accès juste-à-temps ?
body:
  options:
    - id: a
      text: { en: "Azure resource roles, such as Owner of a subscription", fr: "Les rôles de ressources Azure, comme Owner d'un abonnement" }
    - id: b
      text: { en: "Local administrator accounts of Windows devices", fr: "Les comptes d'administrateur local des appareils Windows" }
    - id: c
      text: { en: "Administrator accounts of on-premises Active Directory domains", fr: "Les comptes d'administrateur des domaines Active Directory locaux" }
    - id: d
      text: { en: "Root user accounts of Amazon Web Services (AWS)", fr: "Les comptes d'utilisateur racine d'Amazon Web Services (AWS)" }
answer: { optionId: a }
explanation:
  correct:
    en: "PIM manages three kinds of privileged access: Microsoft Entra roles, Azure resource roles such as Owner or User Access Administrator, and, with PIM for Groups, membership or ownership of groups. For each of them, a user can be made eligible and activate the access only when it is needed."
    fr: "PIM gère trois sortes d'accès privilégiés : les rôles Microsoft Entra, les rôles de ressources Azure comme Owner ou User Access Administrator et, avec PIM pour les groupes, l'appartenance à des groupes ou leur propriété. Pour chacun, un utilisateur peut être rendu éligible et n'activer l'accès que lorsqu'il en a besoin."
  options:
    b:
      en: "Local administrator accounts of devices aren't role assignments in Microsoft Entra ID or Azure, so PIM doesn't manage them."
      fr: "Les comptes d'administrateur local des appareils ne sont pas des attributions de rôles dans Microsoft Entra ID ou Azure : PIM ne les gère pas."
    c:
      en: "PIM is a service of Microsoft Entra ID; it doesn't manage accounts of on-premises Active Directory Domain Services."
      fr: "PIM est un service de Microsoft Entra ID ; il ne gère pas les comptes d'Active Directory Domain Services locaux."
    d:
      en: "PIM covers Microsoft Entra roles, Azure resource roles and groups, not the root accounts of another cloud provider."
      fr: "PIM couvre les rôles Microsoft Entra, les rôles de ressources Azure et les groupes, pas les comptes racine d'un autre fournisseur de cloud."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
