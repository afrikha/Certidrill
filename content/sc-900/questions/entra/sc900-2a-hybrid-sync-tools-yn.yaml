id: sc900-2a-hybrid-sync-tools-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements about the synchronization tools of hybrid identity, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les outils de synchronisation de l'identité hybride, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: New synchronization features are developed primarily for Microsoft Entra Connect Sync.
        fr: Les nouvelles fonctionnalités de synchronisation sont développées principalement pour Microsoft Entra Connect Sync.
    - id: s2
      text:
        en: Microsoft Entra Cloud Sync supports environments with several Active Directory forests that are disconnected from each other.
        fr: Microsoft Entra Cloud Sync prend en charge les environnements comportant plusieurs forêts Active Directory déconnectées les unes des autres.
    - id: s3
      text:
        en: Deploying several Microsoft Entra Cloud Sync provisioning agents provides high availability.
        fr: Le déploiement de plusieurs agents de provisionnement Microsoft Entra Cloud Sync assure la haute disponibilité.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Microsoft Entra Connect Sync is the earlier on-premises synchronization tool, which Cloud Sync is replacing: new identity and synchronization features are developed primarily on the Cloud Sync platform. Cloud Sync supports disconnected multi-forest environments, for example after a merger or an acquisition. It also supports several active provisioning agents, so synchronization continues when one agent is unavailable.
    fr: |
      Microsoft Entra Connect Sync est l'outil de synchronisation local antérieur, que Cloud Sync remplace : les nouvelles fonctionnalités d'identité et de synchronisation sont développées principalement sur la plateforme Cloud Sync. Cloud Sync prend en charge les environnements à plusieurs forêts déconnectées, par exemple après une fusion ou une acquisition. Il prend aussi en charge plusieurs agents de provisionnement actifs : la synchronisation continue donc lorsqu'un agent est indisponible.
references:
  - title: Describe hybrid identity
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/4-describe-concept-of-hybrid-identity
  - title: What is Microsoft Entra Cloud Sync?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/what-is-cloud-sync
