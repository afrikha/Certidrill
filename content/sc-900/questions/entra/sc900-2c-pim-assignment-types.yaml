id: sc900-2c-pim-assignment-types
objective: "2.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An organization assigns Microsoft Entra roles by using Privileged Identity Management.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une organisation attribue des rôles Microsoft Entra avec Privileged Identity Management.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A user who has [[t1]] assignment must perform an action, such as a multifactor authentication check, before using the role.

      A user who has [[t2]] assignment has the privileges of the role without performing any action.

      An assignment that can be used only between a start date and an end date is [[t3]].
    fr: |
      Un utilisateur qui possède une attribution [[t1]] doit effectuer une action, comme une vérification par authentification multifacteur, avant de se servir du rôle.

      Un utilisateur qui possède une attribution [[t2]] dispose des privilèges du rôle sans effectuer aucune action.

      Une attribution utilisable uniquement entre une date de début et une date de fin est [[t3]].
  slots:
    - id: t1
      options:
        - { id: active, text: { en: "an active", fr: "active" } }
        - { id: eligible, text: { en: "an eligible", fr: "éligible" } }
        - { id: expired, text: { en: "an expired", fr: "expirée" } }
    - id: t2
      options:
        - { id: active, text: { en: "an active", fr: "active" } }
        - { id: eligible, text: { en: "an eligible", fr: "éligible" } }
        - { id: expired, text: { en: "an expired", fr: "expirée" } }
    - id: t3
      options:
        - { id: approval, text: { en: "approval-based", fr: "basée sur l'approbation" } }
        - { id: permanent, text: { en: "permanent", fr: "permanente" } }
        - { id: timebound, text: { en: "time-bound", fr: "limitée dans le temps" } }
answer:
  values: { t1: eligible, t2: active, t3: timebound }
explanation:
  correct:
    en: "An eligible assignment requires the user to activate the role before each use, for example with a multifactor authentication check, a justification or an approval. An active assignment gives the privileges with no action. Both types can be permanent or time-bound; a time-bound assignment is valid only between its start and end dates."
    fr: "Une attribution éligible oblige l'utilisateur à activer le rôle avant chaque utilisation, par exemple avec une vérification par authentification multifacteur, une justification ou une approbation. Une attribution active donne les privilèges sans aucune action. Les deux types peuvent être permanents ou limités dans le temps ; une attribution limitée dans le temps n'est valable qu'entre ses dates de début et de fin."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
