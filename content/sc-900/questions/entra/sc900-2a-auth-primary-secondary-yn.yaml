id: sc900-2a-auth-primary-secondary-yn
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about authentication methods in Microsoft Entra ID, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les méthodes d'authentification dans Microsoft Entra ID, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: SMS can be used both as a primary authentication method and as the second factor of multifactor authentication.
        fr: Le SMS peut servir à la fois de méthode d'authentification principale et de second facteur de l'authentification multifacteur.
    - id: s2
      text:
        en: A voice call can be used as a primary authentication method.
        fr: Un appel vocal peut servir de méthode d'authentification principale.
    - id: s3
      text:
        en: A Temporary Access Pass can be used as a primary authentication method.
        fr: Un passe d'accès temporaire (Temporary Access Pass) peut servir de méthode d'authentification principale.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A primary method is used to sign in; a secondary method only adds a factor for multifactor authentication or self-service password reset. SMS-based authentication can be a primary method and also a secondary factor. A voice call is supported only as a secondary method, whereas a Temporary Access Pass lets a user sign in, for example to register other methods.
    fr: |
      Une méthode principale sert à se connecter ; une méthode secondaire ajoute seulement un facteur pour l'authentification multifacteur ou la réinitialisation de mot de passe en libre-service. L'authentification par SMS peut être une méthode principale et aussi un facteur secondaire. L'appel vocal n'est pris en charge que comme méthode secondaire, alors qu'un passe d'accès temporaire permet à un utilisateur de se connecter, par exemple pour inscrire d'autres méthodes.
references:
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
  - title: Microsoft Entra authentication overview
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-methods
