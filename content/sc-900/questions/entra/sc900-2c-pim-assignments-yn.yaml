id: sc900-2c-pim-assignments-yn
objective: "2.4.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank manages the Microsoft Entra roles of its administrators with Privileged Identity Management (PIM).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank gère les rôles Microsoft Entra de ses administrateurs avec Privileged Identity Management (PIM).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "PIM prevents the removal of the last active Global Administrator role assignment."
        fr: "PIM empêche la suppression de la dernière attribution active du rôle Global Administrator."
    - id: s2
      text:
        en: "A user who activates an eligible assignment receives fewer permissions than a user who has an active assignment of the same role."
        fr: "Un utilisateur qui active une attribution éligible reçoit moins d'autorisations qu'un utilisateur qui possède une attribution active du même rôle."
    - id: s3
      text:
        en: "PIM can require a user to enter a business justification when activating a role."
        fr: "PIM peut imposer à un utilisateur de saisir une justification métier lorsqu'il active un rôle."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "PIM protects the tenant against a lockout by preventing the removal of the last active Global Administrator and Privileged Role Administrator role assignments. An eligible assignment and an active assignment of a role give exactly the same access; the only difference is that the eligible user must activate the role first, because the access isn't needed all the time. A justification can be required at activation so that the organization knows why the role was used."
    fr: "PIM protège le locataire contre un verrouillage en empêchant la suppression des dernières attributions actives des rôles Global Administrator et Privileged Role Administrator. Une attribution éligible et une attribution active d'un rôle donnent exactement le même accès ; la seule différence est que l'utilisateur éligible doit d'abord activer le rôle, car l'accès n'est pas nécessaire en permanence. Une justification peut être exigée à l'activation pour que l'organisation sache pourquoi le rôle a été utilisé."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
