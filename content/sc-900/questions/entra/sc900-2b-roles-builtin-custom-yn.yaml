id: sc900-2b-roles-builtin-custom-yn
objective: "2.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about Microsoft Entra roles, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les rôles Microsoft Entra, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An administrator can change the permissions that a built-in Microsoft Entra role contains."
        fr: "Un administrateur peut modifier les autorisations que contient un rôle Microsoft Entra intégré."
    - id: s2
      text:
        en: "A custom Microsoft Entra role is built by selecting permissions from a preset list."
        fr: "Un rôle Microsoft Entra personnalisé se construit en sélectionnant des autorisations dans une liste prédéfinie."
    - id: s3
      text:
        en: "A Microsoft Entra role can be assigned so that it applies to a single application registration only."
        fr: "Un rôle Microsoft Entra peut être attribué de façon à ne s'appliquer qu'à une seule inscription d'application."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Built-in roles are provided by Microsoft with a fixed set of permissions that can't be modified. A custom role is a collection of permissions that the organization selects from a preset list, the same permissions that built-in roles use. A role assignment grants the permissions at a scope: the whole tenant, an administrative unit or a single Microsoft Entra resource, such as one application registration."
    fr: "Les rôles intégrés sont fournis par Microsoft avec un ensemble fixe d'autorisations qui ne peut pas être modifié. Un rôle personnalisé est un ensemble d'autorisations que l'organisation sélectionne dans une liste prédéfinie, les mêmes autorisations que celles des rôles intégrés. Une attribution de rôle accorde les autorisations à une étendue : tout le locataire, une unité administrative ou une seule ressource Microsoft Entra, comme une inscription d'application."
references:
  - title: Overview of role-based access control in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview
  - title: Describe Microsoft Entra roles and role-based access control (RBAC)
    url: https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/3-describe-azure-role-based-access-control
