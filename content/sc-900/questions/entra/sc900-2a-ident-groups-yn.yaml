id: sc900-2a-ident-groups-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements about groups in Microsoft Entra ID, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur les groupes dans Microsoft Entra ID, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Microsoft 365 group can include devices as members.
        fr: Un groupe Microsoft 365 peut compter des appareils parmi ses membres.
    - id: s2
      text:
        en: With dynamic membership, rules add identities to the group and remove them from it automatically.
        fr: Avec l'appartenance dynamique, des règles ajoutent des identités au groupe et les en retirent automatiquement.
    - id: s3
      text:
        en: A security group can include devices and service principals as members.
        fr: Un groupe de sécurité peut compter des appareils et des principaux de service parmi ses membres.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The members of a Microsoft 365 group can only be users, because the group exists for collaboration. Membership of a group is either assigned, that is, selected manually, or dynamic, in which case rules add and remove identities automatically. A security group, used to manage access to shared resources, accepts users, devices, other groups and service principals as members.
    fr: |
      Les membres d'un groupe Microsoft 365 ne peuvent être que des utilisateurs, car ce groupe existe pour la collaboration. L'appartenance à un groupe est soit affectée, c'est-à-dire choisie manuellement, soit dynamique : des règles ajoutent et retirent alors automatiquement des identités. Un groupe de sécurité, qui sert à gérer l'accès à des ressources partagées, accepte comme membres des utilisateurs, des appareils, d'autres groupes et des principaux de service.
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
  - title: Learn about group types, membership types, and access management
    url: https://learn.microsoft.com/en-us/entra/fundamentals/concept-learn-about-groups
