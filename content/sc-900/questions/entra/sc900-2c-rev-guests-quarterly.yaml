id: sc900-2c-rev-guests-quarterly
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has several Microsoft Teams teams that include guest users. Every quarter, the owner of each team must confirm which guests still need to be members, and the guests who aren't confirmed must be removed from the team.

    What should Fabrikam use?
  fr: |
    Fabrikam possède plusieurs équipes Microsoft Teams qui comprennent des utilisateurs invités. Chaque trimestre, le propriétaire de chaque équipe doit confirmer quels invités ont encore besoin d'en être membres, et les invités non confirmés doivent être retirés de l'équipe.

    Que doit utiliser Fabrikam ?
body:
  options:
    - id: a
      text: { en: "Privileged Identity Management", fr: "Privileged Identity Management" }
    - id: b
      text: { en: "Microsoft Entra ID Protection", fr: "Protection Microsoft Entra ID" }
    - id: c
      text: { en: "Conditional Access", fr: "L'accès conditionnel" }
    - id: d
      text: { en: "Access reviews", fr: "Les révisions d'accès" }
answer: { optionId: d }
explanation:
  correct:
    en: "Access reviews let an organization check on a recurring schedule, for example every quarter, that only the right people keep their access. Group owners can be the reviewers: they approve or deny each guest, and the access that was denied is removed when the results are applied."
    fr: "Les révisions d'accès permettent à une organisation de vérifier de façon récurrente, par exemple chaque trimestre, que seules les bonnes personnes gardent leur accès. Les propriétaires de groupes peuvent être les réviseurs : ils approuvent ou refusent chaque invité, et l'accès refusé est retiré quand les résultats sont appliqués."
  options:
    a:
      en: "Privileged Identity Management gives just-in-time access to privileged roles; the need here is a periodic recertification of team membership."
      fr: "Privileged Identity Management donne un accès juste-à-temps aux rôles privilégiés ; le besoin est ici une recertification périodique de l'appartenance à des équipes."
    b:
      en: "ID Protection detects risky sign-ins and compromised accounts; it doesn't ask owners whether guests still need access."
      fr: "Protection Microsoft Entra ID détecte les connexions à risque et les comptes compromis ; elle ne demande pas aux propriétaires si les invités ont encore besoin d'un accès."
    c:
      en: "Conditional Access decides at sign-in whether to allow, block or challenge an access; it doesn't remove memberships."
      fr: "L'accès conditionnel décide à la connexion d'autoriser, de bloquer ou de soumettre à vérification un accès ; il ne retire pas d'appartenances."
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
