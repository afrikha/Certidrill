id: sc900-2b-ca-policy-parts-sentence
objective: "2.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences about the parts of a Conditional Access policy, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur les parties d'une stratégie d'accès conditionnel, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[who]] define when the policy applies: the users, the target resources, the network and conditions such as the device platform.

      [[decide]] determine whether access is blocked or allowed, for example by requiring multifactor authentication.

      [[after]] limit the experience once access is allowed, for example by setting the sign-in frequency.
    fr: |
      [[who]] définissent quand la stratégie s'applique : les utilisateurs, les ressources cibles, le réseau et des conditions comme la plateforme de l'appareil.

      [[decide]] déterminent si l'accès est bloqué ou autorisé, par exemple en exigeant l'authentification multifacteur.

      [[after]] limitent l'expérience une fois l'accès autorisé, par exemple en fixant la fréquence de connexion.
  slots:
    - id: who
      options:
        - { id: grant, text: { en: "Grant controls", fr: "Les contrôles d'octroi" } }
        - { id: session, text: { en: "Session controls", fr: "Les contrôles de session" } }
        - { id: assign, text: { en: "Assignments", fr: "Les affectations" } }
    - id: decide
      options:
        - { id: grant, text: { en: "Grant controls", fr: "Les contrôles d'octroi" } }
        - { id: session, text: { en: "Session controls", fr: "Les contrôles de session" } }
        - { id: assign, text: { en: "Assignments", fr: "Les affectations" } }
    - id: after
      options:
        - { id: grant, text: { en: "Grant controls", fr: "Les contrôles d'octroi" } }
        - { id: session, text: { en: "Session controls", fr: "Les contrôles de session" } }
        - { id: assign, text: { en: "Assignments", fr: "Les affectations" } }
answer:
  values: { who: assign, decide: grant, after: session }
explanation:
  correct:
    en: "A Conditional Access policy combines assignments and access controls. Assignments answer who, what and where: users, target resources, network and conditions; all of them must be satisfied for the policy to apply. Grant controls then block access or grant it, possibly with requirements such as multifactor authentication or a compliant device. Session controls, such as sign-in frequency or Conditional Access App Control, limit what happens within the session after access is granted."
    fr: "Une stratégie d'accès conditionnel combine des affectations et des contrôles d'accès. Les affectations répondent aux questions qui, quoi et où : utilisateurs, ressources cibles, réseau et conditions ; elles doivent toutes être remplies pour que la stratégie s'applique. Les contrôles d'octroi bloquent ensuite l'accès ou l'accordent, éventuellement avec des exigences comme l'authentification multifacteur ou un appareil conforme. Les contrôles de session, comme la fréquence de connexion ou le contrôle d'application par accès conditionnel, limitent ce qui se passe dans la session une fois l'accès accordé."
references:
  - title: Build a Conditional Access policy
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-policies
  - title: "Conditional Access: Session"
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-session
