id: sc900-2c-rev-decisions-complete
objective: "2.4.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs an access review of the employees who are members of a security group.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso mène une révision d'accès des employés membres d'un groupe de sécurité.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      During the review, each reviewer chooses to [[d1]] the continued access of each employee.

      When the results of the review are applied, the employees whose access was denied [[d2]].
    fr: |
      Pendant la révision, chaque réviseur choisit [[d1]] le maintien de l'accès de chaque employé.

      Quand les résultats de la révision sont appliqués, les employés dont l'accès a été refusé [[d2]].
  slots:
    - id: d1
      options:
        - { id: activate, text: { en: "activate or deactivate", fr: "d'activer ou de désactiver" } }
        - { id: approve, text: { en: "approve or deny", fr: "d'approuver ou de refuser" } }
        - { id: dismiss, text: { en: "dismiss or confirm as compromised", fr: "de rejeter ou de confirmer comme compromis" } }
    - id: d2
      options:
        - { id: deleted, text: { en: "are deleted from the directory", fr: "sont supprimés de l'annuaire" } }
        - { id: password, text: { en: "must change their password", fr: "doivent changer leur mot de passe" } }
        - { id: removed, text: { en: "are removed from the group", fr: "sont retirés du groupe" } }
answer:
  values: { d1: approve, d2: removed }
explanation:
  correct:
    en: "In an access review, reviewers approve or deny each user's continued access. Activating a role belongs to Privileged Identity Management, and dismissing a risk or confirming a compromise belongs to ID Protection. Applying the results removes the reviewed access only: the employees leave the group, but their accounts and passwords aren't touched."
    fr: "Dans une révision d'accès, les réviseurs approuvent ou refusent le maintien de l'accès de chaque utilisateur. Activer un rôle relève de Privileged Identity Management, et rejeter un risque ou confirmer une compromission relève de Protection Microsoft Entra ID. L'application des résultats retire uniquement l'accès révisé : les employés quittent le groupe, mais leurs comptes et leurs mots de passe ne sont pas touchés."
references:
  - title: Complete an access review of groups and applications in access reviews
    url: https://learn.microsoft.com/en-us/entra/id-governance/complete-access-review
