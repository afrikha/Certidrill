id: sc900-2b-mfa-defaults-protections-multi
objective: "2.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys enables security defaults in its Microsoft Entra tenant.

    Which two protections do security defaults provide?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys active les paramètres de sécurité par défaut dans son locataire Microsoft Entra.

    Quelles sont les deux protections fournies par les paramètres de sécurité par défaut ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "All users are required to register for multifactor authentication.", fr: "Tous les utilisateurs doivent s'inscrire à l'authentification multifacteur." } }
    - { id: b, text: { en: "Sign-ins from outside the country of the organization are blocked.", fr: "Les connexions depuis l'extérieur du pays de l'organisation sont bloquées." } }
    - { id: c, text: { en: "Legacy authentication protocols are blocked.", fr: "Les protocoles d'authentification hérités sont bloqués." } }
    - { id: d, text: { en: "Access is limited to devices that are marked as compliant.", fr: "L'accès est limité aux appareils marqués comme conformes." } }
    - { id: e, text: { en: "Users are required to accept terms of use.", fr: "Les utilisateurs doivent accepter des conditions d'utilisation." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Security defaults are a fixed baseline: all users must register for multifactor authentication, administrators must use it at every sign-in, users must use it when necessary, legacy authentication protocols are blocked and privileged activities such as access to the Azure portal are protected."
    fr: "Les paramètres de sécurité par défaut sont un socle fixe : tous les utilisateurs doivent s'inscrire à l'authentification multifacteur, les administrateurs doivent l'utiliser à chaque connexion, les utilisateurs quand c'est nécessaire, les protocoles d'authentification hérités sont bloqués et les activités privilégiées comme l'accès au portail Azure sont protégées."
  options:
    b: { en: "Blocking sign-ins by country requires a Conditional Access policy based on locations.", fr: "Bloquer les connexions selon le pays demande une stratégie d'accès conditionnel fondée sur les emplacements." }
    d: { en: "Requiring a compliant device is a grant control of Conditional Access.", fr: "Exiger un appareil conforme est un contrôle d'octroi de l'accès conditionnel." }
    e: { en: "Requiring terms of use is a grant control of Conditional Access.", fr: "Exiger des conditions d'utilisation est un contrôle d'octroi de l'accès conditionnel." }
references:
  - title: Security defaults in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
