id: sc900-2b-ca-report-only
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam creates a Conditional Access policy that blocks sign-ins from outside the countries where Fabrikam operates.

    Before the policy blocks anyone, Fabrikam wants to see in the sign-in logs which sign-ins it would affect.

    What should Fabrikam use?
  fr: |
    Fabrikam crée une stratégie d'accès conditionnel qui bloque les connexions depuis l'extérieur des pays où Fabrikam exerce son activité.

    Avant que la stratégie ne bloque qui que ce soit, Fabrikam veut voir dans les journaux de connexion quelles connexions elle toucherait.

    Que doit utiliser Fabrikam ?
body:
  options:
    - id: a
      text: { en: "Security defaults", fr: "Les paramètres de sécurité par défaut" }
    - id: b
      text: { en: "The sign-in frequency session control", fr: "Le contrôle de session Fréquence de connexion" }
    - id: c
      text: { en: "An access review", fr: "Une révision d'accès" }
    - id: d
      text: { en: "Report-only mode", fr: "Le mode rapport seul (Report-only)" }
answer: { optionId: d }
explanation:
  correct:
    en: "Report-only is a policy state: the policy is evaluated at each sign-in, but its grant and session controls aren't enforced, so nobody is blocked or prompted. The result that the policy would have had is recorded in the sign-in logs, which lets administrators measure the impact before they turn the policy on."
    fr: "Le mode rapport seul est un état de la stratégie : celle-ci est évaluée à chaque connexion, mais ses contrôles d'octroi et de session ne sont pas appliqués, si bien que personne n'est bloqué ni sollicité. Le résultat que la stratégie aurait eu est consigné dans les journaux de connexion, ce qui permet aux administrateurs de mesurer l'impact avant d'activer la stratégie."
  options:
    a:
      en: "Security defaults are a fixed baseline for the whole tenant; they don't simulate a Conditional Access policy."
      fr: "Les paramètres de sécurité par défaut sont un socle fixe pour tout le locataire ; ils ne simulent pas une stratégie d'accès conditionnel."
    b:
      en: "Sign-in frequency sets how long a user stays signed in before reauthenticating; it is an enforced control, not a test mode."
      fr: "La fréquence de connexion fixe la durée pendant laquelle un utilisateur reste connecté avant de se réauthentifier ; c'est un contrôle appliqué, pas un mode de test."
    c:
      en: "An access review checks whether users still need a group membership, an application or a role."
      fr: "Une révision d'accès vérifie si des utilisateurs ont encore besoin d'une appartenance à un groupe, d'une application ou d'un rôle."
references:
  - title: Analyze Conditional Access Policy Impact
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-report-only
