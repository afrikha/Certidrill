id: sc900-2a-ident-external-guest
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam works with a consultant who is employed by Contoso. In the Fabrikam tenant, the consultant signs in with her Contoso account and has limited privileges compared with the employees of Fabrikam.

    Which type of user is the consultant in the Fabrikam tenant?
  fr: |
    Fabrikam travaille avec une consultante employée par Contoso. Dans le locataire de Fabrikam, la consultante se connecte avec son compte Contoso et dispose de privilèges limités par rapport aux employés de Fabrikam.

    Quel type d'utilisateur la consultante est-elle dans le locataire de Fabrikam ?
body:
  options:
    - { id: a, text: { en: "Internal member", fr: "Membre interne" } }
    - { id: b, text: { en: "Internal guest", fr: "Invité interne" } }
    - { id: c, text: { en: "External guest", fr: "Invité externe" } }
    - { id: d, text: { en: "External member", fr: "Membre externe" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A user is described by where they authenticate and by their user type. The consultant authenticates with an account of another organization, so she is external, and her limited privileges correspond to the Guest user type. External guests are the usual case of B2B collaboration with consultants, vendors and partners.
    fr: |
      Un utilisateur se décrit par l'endroit où il s'authentifie et par son type d'utilisateur. La consultante s'authentifie avec un compte d'une autre organisation : elle est donc externe, et ses privilèges limités correspondent au type d'utilisateur Invité. Les invités externes sont le cas habituel de la collaboration B2B avec des consultants, des fournisseurs et des partenaires.
  options:
    a:
      en: "An internal member has an account in the Fabrikam tenant and the Member user type: this is the case of the employees of Fabrikam."
      fr: "Un membre interne a un compte dans le locataire de Fabrikam et le type d'utilisateur Membre : c'est le cas des employés de Fabrikam."
    b:
      en: "An internal guest has the Guest user type but authenticates with an account created in the Fabrikam tenant, a legacy scenario."
      fr: "Un invité interne a le type d'utilisateur Invité mais s'authentifie avec un compte créé dans le locataire de Fabrikam, un scénario hérité."
    d:
      en: "An external member authenticates with an external account but has member-level access, which is common between the tenants of a multi-tenant organization."
      fr: "Un membre externe s'authentifie avec un compte externe mais dispose d'un accès de niveau membre, ce qui est courant entre les locataires d'une organisation multilocataire."
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
