id: sc900-2a-auth-roles-sentences
objective: "2.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    To complete the sentences about the authentication methods of Microsoft Entra ID, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur les méthodes d'authentification de Microsoft Entra ID, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[role]] authentication method is only available as an additional factor, for multifactor authentication or self-service password reset.

      [[primaryonly]] can be used to sign in, but not as the second factor of multifactor authentication.

      [[sspronly]] can verify a tenant member for self-service password reset, but not for multifactor authentication.
    fr: |
      [[role]] n'est disponible que comme facteur supplémentaire, pour l'authentification multifacteur ou la réinitialisation de mot de passe en libre-service.

      [[primaryonly]] peut servir à se connecter, mais pas de second facteur de l'authentification multifacteur.

      [[sspronly]] peut vérifier un membre du locataire pour la réinitialisation de mot de passe en libre-service, mais pas pour l'authentification multifacteur.
  slots:
    - id: role
      options:
        - { id: primary, text: { en: "A primary", fr: "Une méthode d'authentification principale" } }
        - { id: secondary, text: { en: "A secondary", fr: "Une méthode d'authentification secondaire" } }
        - { id: passwordless, text: { en: "A passwordless", fr: "Une méthode d'authentification sans mot de passe" } }
    - id: primaryonly
      options:
        - { id: sms, text: { en: "SMS", fr: "Le SMS" } }
        - { id: tap, text: { en: "A Temporary Access Pass", fr: "Un passe d'accès temporaire (Temporary Access Pass)" } }
        - { id: qr, text: { en: "A QR code", fr: "Un code QR" } }
    - id: sspronly
      options:
        - { id: email, text: { en: "An email one-time passcode", fr: "Un code secret à usage unique par e-mail" } }
        - { id: voice, text: { en: "A voice call", fr: "Un appel vocal" } }
        - { id: oath, text: { en: "A software OATH token", fr: "Un jeton OATH logiciel" } }
answer:
  values: { role: secondary, primaryonly: qr, sspronly: email }
explanation:
  correct:
    en: |
      A primary method is used to sign in to an application or a device, whereas a secondary method is only available as an additional factor for multifactor authentication or self-service password reset. QR code authentication is a primary method that can't serve as a second factor. An email one-time passcode can verify a tenant member for self-service password reset only.
    fr: |
      Une méthode principale sert à se connecter à une application ou à un appareil, alors qu'une méthode secondaire n'est disponible que comme facteur supplémentaire pour l'authentification multifacteur ou la réinitialisation de mot de passe en libre-service. L'authentification par code QR est une méthode principale qui ne peut pas servir de second facteur. Un code secret à usage unique par e-mail ne peut vérifier un membre du locataire que pour la réinitialisation de mot de passe en libre-service.
  options:
    sms:
      en: "SMS can be used to sign in and also as the second factor of multifactor authentication."
      fr: "Le SMS peut servir à se connecter et aussi de second facteur de l'authentification multifacteur."
    tap:
      en: "A Temporary Access Pass can be used to sign in and also satisfies multifactor authentication."
      fr: "Un passe d'accès temporaire peut servir à se connecter et satisfait aussi l'authentification multifacteur."
    voice:
      en: "A voice call is a secondary method for both multifactor authentication and self-service password reset."
      fr: "L'appel vocal est une méthode secondaire à la fois pour l'authentification multifacteur et pour la réinitialisation de mot de passe en libre-service."
    oath:
      en: "A software OATH token is a secondary method for both multifactor authentication and self-service password reset."
      fr: "Un jeton OATH logiciel est une méthode secondaire à la fois pour l'authentification multifacteur et pour la réinitialisation de mot de passe en libre-service."
references:
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
  - title: Microsoft Entra authentication overview
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-methods
