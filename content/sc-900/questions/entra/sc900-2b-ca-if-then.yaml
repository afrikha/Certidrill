id: sc900-2b-ca-if-then
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which description corresponds to a Microsoft Entra Conditional Access policy?
  fr: |
    Quelle description correspond à une stratégie d'accès conditionnel Microsoft Entra ?
body:
  options:
    - id: a
      text: { en: "An if-then statement that requires an action before a user accesses a resource", fr: "Une instruction si-alors qui exige une action avant qu'un utilisateur accède à une ressource" }
    - id: b
      text: { en: "A list of banned terms that users are prevented from using in a password", fr: "Une liste de termes interdits que les utilisateurs ne peuvent pas utiliser dans un mot de passe" }
    - id: c
      text: { en: "A collection of permissions that is assigned to an administrator at a scope", fr: "Un ensemble d'autorisations attribué à un administrateur à une étendue" }
    - id: d
      text: { en: "A recurring review that confirms whether users still need their access", fr: "Une révision périodique qui confirme si les utilisateurs ont encore besoin de leur accès" }
answer: { optionId: a }
explanation:
  correct:
    en: "At its simplest, a Conditional Access policy is an if-then statement: if a user wants to access a resource, then the user must complete an action, for example multifactor authentication to access Microsoft 365. Conditional Access brings signals together, makes a decision and enforces it."
    fr: "Dans sa forme la plus simple, une stratégie d'accès conditionnel est une instruction si-alors : si un utilisateur veut accéder à une ressource, alors il doit accomplir une action, par exemple l'authentification multifacteur pour accéder à Microsoft 365. L'accès conditionnel rassemble des signaux, prend une décision et l'applique."
  options:
    b:
      en: "This describes a banned password list of Microsoft Entra Password Protection."
      fr: "Cela décrit une liste de mots de passe interdits de la protection par mot de passe Microsoft Entra."
    c:
      en: "This describes a Microsoft Entra role and its assignment."
      fr: "Cela décrit un rôle Microsoft Entra et son attribution."
    d:
      en: "This describes an access review."
      fr: "Cela décrit une révision d'accès."
references:
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
