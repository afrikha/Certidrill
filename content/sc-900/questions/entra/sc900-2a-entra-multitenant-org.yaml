id: sc900-2a-entra-multitenant-org
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank acquired two companies. Because of data residency regulations, each of the three entities keeps its own instance of Microsoft Entra ID.

    Which term describes Woodgrove Bank?
  fr: |
    Woodgrove Bank a acquis deux entreprises. En raison de réglementations sur la résidence des données, chacune des trois entités conserve sa propre instance de Microsoft Entra ID.

    Quel terme décrit Woodgrove Bank ?
body:
  options:
    - { id: a, text: { en: "A hybrid organization", fr: "Une organisation hybride" } }
    - { id: b, text: { en: "A federated organization", fr: "Une organisation fédérée" } }
    - { id: c, text: { en: "A cloud-only organization", fr: "Une organisation uniquement cloud" } }
    - { id: d, text: { en: "A multi-tenant organization", fr: "Une organisation multilocataire" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An instance of Microsoft Entra ID is a tenant, and an organization that has more than one instance is a multi-tenant organization. Typical reasons are mergers and acquisitions, independent subsidiaries or business units, and geographic regions with different data residency regulations. Each tenant remains its own security and administrative boundary.
    fr: |
      Une instance de Microsoft Entra ID est un locataire, et une organisation qui possède plusieurs instances est une organisation multilocataire. Les raisons habituelles sont les fusions et acquisitions, des filiales ou des divisions indépendantes, et des régions géographiques soumises à des réglementations différentes sur la résidence des données. Chaque locataire reste sa propre limite de sécurité et d'administration.
  options:
    a:
      en: "Hybrid refers to an organization that combines an on-premises Active Directory with Microsoft Entra ID; the scenario describes several cloud instances."
      fr: "« Hybride » désigne une organisation qui combine un Active Directory local et Microsoft Entra ID ; le scénario décrit plusieurs instances cloud."
    b:
      en: "Federation is a trust relationship in which one identity provider accepts the authentication done by another; it doesn't mean having several tenants."
      fr: "La fédération est une relation d'approbation dans laquelle un fournisseur d'identité accepte l'authentification faite par un autre ; elle ne signifie pas avoir plusieurs locataires."
    c:
      en: "Cloud-only means that the organization has no on-premises directory; the term says nothing about the number of tenants."
      fr: "« Uniquement cloud » signifie que l'organisation n'a pas d'annuaire local ; le terme ne dit rien du nombre de locataires."
references:
  - title: Describe Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/2-describe-azure-active-directory
