id: sc900-2b-pwd-sspr-scenarios-match
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Microsoft Entra self-service password reset (SSPR) supports several scenarios.

    Match each user situation to the SSPR scenario that applies. To answer, drag the appropriate scenario to each situation. Each scenario may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    La réinitialisation de mot de passe en libre-service (SSPR) de Microsoft Entra prend en charge plusieurs scénarios.

    Associez chaque situation d'un utilisateur au scénario SSPR qui s'applique. Pour répondre, faites glisser le scénario approprié vers chaque situation. Chaque scénario peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: unlock, text: { en: "Account unlock", fr: "Déverrouillage du compte" } }
    - { id: writeback, text: { en: "Password writeback", fr: "Réécriture du mot de passe" } }
    - { id: change, text: { en: "Password change", fr: "Changement de mot de passe" } }
    - { id: reset, text: { en: "Password reset", fr: "Réinitialisation de mot de passe" } }
  targets:
    - id: knows
      text: { en: "The user knows the current password and wants to replace it with a new one.", fr: "L'utilisateur connaît son mot de passe actuel et veut le remplacer par un nouveau." }
    - id: forgot
      text: { en: "The user is unable to sign in because the password is forgotten.", fr: "L'utilisateur n'arrive pas à se connecter parce qu'il a oublié son mot de passe." }
    - id: locked
      text: { en: "The user is locked out after too many failed sign-ins, and wants to keep the current password.", fr: "L'utilisateur est verrouillé après trop d'échecs de connexion et veut garder son mot de passe actuel." }
answer:
  mapping: { knows: change, forgot: reset, locked: unlock }
explanation:
  correct:
    en: "SSPR covers three situations. A password change is for a user who knows the password and wants a new one. A password reset is for a user who can't sign in, for example because the password is forgotten. An account unlock is for a user who is locked out and gets back in without changing the password. Password writeback isn't a user scenario: it is the hybrid feature that sends cloud password changes back to the on-premises directory."
    fr: "SSPR couvre trois situations. Le changement de mot de passe concerne un utilisateur qui connaît son mot de passe et en veut un nouveau. La réinitialisation concerne un utilisateur qui ne peut pas se connecter, par exemple parce qu'il a oublié son mot de passe. Le déverrouillage concerne un utilisateur verrouillé qui retrouve l'accès sans changer de mot de passe. La réécriture du mot de passe n'est pas un scénario utilisateur : c'est la fonctionnalité hybride qui renvoie vers l'annuaire local les changements de mot de passe faits dans le cloud."
references:
  - title: Describe self-service password reset
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/4-describe-self-service-password-reset
  - title: "How it works: Microsoft Entra self-service password reset"
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
