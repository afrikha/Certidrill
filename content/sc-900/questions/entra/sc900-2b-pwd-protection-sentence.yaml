id: sc900-2b-pwd-protection-sentence
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    To complete the sentences about Microsoft Entra Password Protection, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases sur la protection par mot de passe Microsoft Entra, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Entra Password Protection evaluates a password [[when]].

      A custom banned password list can contain up to [[limit]] terms.

      Before a password is compared with the banned terms, it is [[norm]], so that a variant such as `C0nt0s0` is treated like `contoso`.
    fr: |
      La protection par mot de passe Microsoft Entra évalue un mot de passe [[when]].

      Une liste personnalisée de mots de passe interdits peut contenir jusqu'à [[limit]] termes.

      Avant d'être comparé aux termes interdits, un mot de passe est [[norm]], si bien qu'une variante comme `C0nt0s0` est traitée comme `contoso`.
  slots:
    - id: when
      options:
        - { id: signin, text: { en: "each time the user signs in", fr: "à chaque connexion de l'utilisateur" } }
        - { id: change, text: { en: "when the user changes or resets it", fr: "lorsque l'utilisateur le change ou le réinitialise" } }
        - { id: daily, text: { en: "once a day, for all the users of the tenant", fr: "une fois par jour, pour tous les utilisateurs du locataire" } }
    - id: limit
      options:
        - { id: n100, text: "100" }
        - { id: n1000, text: { en: "1,000", fr: "1 000" } }
        - { id: n10000, text: { en: "10,000", fr: "10 000" } }
    - id: norm
      options:
        - { id: encrypted, text: { en: "encrypted", fr: "chiffré" } }
        - { id: hashed, text: { en: "hashed", fr: "haché" } }
        - { id: normalized, text: { en: "normalized", fr: "normalisé" } }
answer:
  values: { when: change, limit: n1000, norm: normalized }
explanation:
  correct:
    en: "A password is checked against the banned password lists when the user changes or resets it. The custom list is limited to 1,000 terms: it is meant for a few base terms of the organization, because the algorithm finds their variants. The first step is normalization: uppercase letters become lowercase and common substitutions are reversed, for example `0` becomes `o` and `@` becomes `a`."
    fr: "Un mot de passe est vérifié par rapport aux listes de mots de passe interdits lorsque l'utilisateur le change ou le réinitialise. La liste personnalisée est limitée à 1 000 termes : elle est faite pour quelques termes de base de l'organisation, car l'algorithme en repère les variantes. La première étape est la normalisation : les majuscules deviennent des minuscules et les substitutions courantes sont inversées, par exemple `0` devient `o` et `@` devient `a`."
  options:
    signin:
      en: "Existing passwords aren't evaluated at sign-in; the check runs when a password is set."
      fr: "Les mots de passe existants ne sont pas évalués à la connexion ; la vérification a lieu lorsqu'un mot de passe est défini."
    daily:
      en: "There is no periodic scan of the passwords of a tenant."
      fr: "Il n'y a pas d'analyse périodique des mots de passe d'un locataire."
    encrypted:
      en: "Encrypting a password doesn't make its variants look alike."
      fr: "Chiffrer un mot de passe ne fait pas se ressembler ses variantes."
    hashed:
      en: "Two different strings give two different hashes: hashing wouldn't reveal that a password is a variant of a banned term."
      fr: "Deux chaînes différentes donnent deux hachages différents : le hachage ne révélerait pas qu'un mot de passe est une variante d'un terme interdit."
references:
  - title: Eliminate bad passwords using Microsoft Entra Password Protection
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad
