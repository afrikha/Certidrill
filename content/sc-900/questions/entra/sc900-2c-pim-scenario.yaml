id: sc900-2c-pim-scenario
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware wants its administrators to hold the Global Administrator role only when they have a task to perform. An administrator must request the role, an approver must accept the request, and the role must be withdrawn automatically after two hours.

    What should Litware use?
  fr: |
    Litware veut que ses administrateurs ne détiennent le rôle Global Administrator que lorsqu'ils ont une tâche à effectuer. Un administrateur doit demander le rôle, un approbateur doit accepter la demande, et le rôle doit être retiré automatiquement au bout de deux heures.

    Que doit utiliser Litware ?
body:
  options:
    - id: a
      text: { en: "Microsoft Entra ID Protection", fr: "Protection Microsoft Entra ID" }
    - id: b
      text: { en: "Microsoft Entra Privileged Identity Management", fr: "Microsoft Entra Privileged Identity Management" }
    - id: c
      text: { en: "Microsoft Entra access reviews", fr: "Les révisions d'accès Microsoft Entra" }
    - id: d
      text: { en: "Microsoft Entra Conditional Access", fr: "L'accès conditionnel Microsoft Entra" }
answer: { optionId: b }
explanation:
  correct:
    en: "Privileged Identity Management (PIM) provides just-in-time, time-bound and approval-based access to privileged roles. An eligible administrator activates the role when it is needed, an approval can be required, and the activation expires after the configured duration."
    fr: "Privileged Identity Management (PIM) fournit un accès aux rôles privilégiés juste-à-temps, limité dans le temps et basé sur l'approbation. Un administrateur éligible active le rôle quand il en a besoin, une approbation peut être exigée, et l'activation expire à la fin de la durée configurée."
  options:
    a:
      en: "ID Protection detects and remediates identity risks such as leaked credentials; it doesn't grant roles on request."
      fr: "Protection Microsoft Entra ID détecte et corrige les risques liés aux identités, comme les informations d'identification divulguées ; elle n'accorde pas de rôles à la demande."
    c:
      en: "Access reviews check periodically whether users still need an access; they don't give a role for two hours."
      fr: "Les révisions d'accès vérifient périodiquement si les utilisateurs ont encore besoin d'un accès ; elles ne donnent pas un rôle pour deux heures."
    d:
      en: "Conditional Access applies conditions to sign-ins; it doesn't manage requests, approvals and expiration of role assignments."
      fr: "L'accès conditionnel applique des conditions aux connexions ; il ne gère ni les demandes, ni les approbations, ni l'expiration des attributions de rôles."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
