id: sc900-2c-pim-groups
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At Tailspin Toys, a security group named **Cloud-Ops** gives its members access to several Azure subscriptions and to Microsoft Intune. Engineers must become members of Cloud-Ops only when they have an intervention to perform: they must activate their membership with a justification, for at most eight hours.

    What should Tailspin Toys use?
  fr: |
    Chez Tailspin Toys, un groupe de sécurité nommé **Cloud-Ops** donne à ses membres l'accès à plusieurs abonnements Azure et à Microsoft Intune. Les ingénieurs ne doivent devenir membres de Cloud-Ops que lorsqu'ils ont une intervention à effectuer : ils doivent activer leur appartenance avec une justification, pour huit heures au maximum.

    Que doit utiliser Tailspin Toys ?
body:
  options:
    - id: a
      text: { en: "A dynamic membership rule on the group", fr: "Une règle d'appartenance dynamique sur le groupe" }
    - id: b
      text: { en: "An access review of the group", fr: "Une révision d'accès du groupe" }
    - id: c
      text: { en: "Privileged Identity Management for Groups", fr: "Privileged Identity Management pour les groupes" }
    - id: d
      text: { en: "A lifecycle workflow that adds users to the group", fr: "Un workflow de cycle de vie qui ajoute des utilisateurs au groupe" }
answer: { optionId: c }
explanation:
  correct:
    en: "PIM for Groups extends just-in-time access to the membership and the ownership of a group. Engineers are made eligible members; they activate the membership when they need it, and the policy of the group can require a justification, multifactor authentication or an approval and limits the activation time."
    fr: "PIM pour les groupes étend l'accès juste-à-temps à l'appartenance à un groupe et à sa propriété. Les ingénieurs sont rendus membres éligibles ; ils activent l'appartenance quand ils en ont besoin, et la stratégie du groupe peut exiger une justification, l'authentification multifacteur ou une approbation et limite la durée d'activation."
  options:
    a:
      en: "A dynamic rule adds members according to their attributes, for as long as the rule matches; nobody activates anything for a few hours."
      fr: "Une règle dynamique ajoute des membres selon leurs attributs, tant que la règle correspond ; personne n'active quoi que ce soit pour quelques heures."
    b:
      en: "An access review recertifies the existing members periodically; it doesn't give a temporary membership on demand."
      fr: "Une révision d'accès recertifie périodiquement les membres existants ; elle ne donne pas une appartenance temporaire à la demande."
    d:
      en: "A lifecycle workflow reacts to joiner, mover and leaver events; it isn't an activation that an engineer triggers for one intervention."
      fr: "Un workflow de cycle de vie réagit aux arrivées, aux changements de poste et aux départs ; ce n'est pas une activation qu'un ingénieur déclenche pour une intervention."
references:
  - title: Privileged Identity Management (PIM) for Groups
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/concept-pim-for-groups
