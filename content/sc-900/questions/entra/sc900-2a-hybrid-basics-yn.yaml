id: sc900-2a-hybrid-basics-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements about hybrid identity, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes sur l'identité hybride, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In the most common scenario, a user who exists in Active Directory is provisioned into Microsoft Entra ID.
        fr: Dans le scénario le plus courant, un utilisateur qui existe dans Active Directory est provisionné dans Microsoft Entra ID.
    - id: s2
      text:
        en: With hybrid identity, a user needs one account for on-premises applications and a separate account for cloud applications.
        fr: Avec l'identité hybride, un utilisateur a besoin d'un compte pour les applications locales et d'un compte distinct pour les applications cloud.
    - id: s3
      text:
        en: Hybrid identity requires an organization to move its domain controllers to Azure.
        fr: L'identité hybride impose à une organisation de déplacer ses contrôleurs de domaine vers Azure.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Hybrid identity creates one common identity for authentication and authorization to all resources, on-premises and in the cloud, so a user doesn't need separate accounts. The most common provisioning scenario is a user who already exists in Active Directory and is provisioned into Microsoft Entra ID. The on-premises Active Directory stays where it is: only an agent or a synchronization tool connects it to Microsoft Entra ID.
    fr: |
      L'identité hybride crée une identité commune pour l'authentification et l'autorisation auprès de toutes les ressources, locales et cloud : un utilisateur n'a donc pas besoin de comptes distincts. Le scénario de provisionnement le plus courant est celui d'un utilisateur qui existe déjà dans Active Directory et qui est provisionné dans Microsoft Entra ID. L'Active Directory local reste où il est : seul un agent ou un outil de synchronisation le relie à Microsoft Entra ID.
references:
  - title: Describe hybrid identity
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/4-describe-concept-of-hybrid-identity
