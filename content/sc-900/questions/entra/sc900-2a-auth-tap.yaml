id: sc900-2a-auth-tap
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A new employee of Litware has no authentication method registered yet. An administrator wants to give her a time-limited passcode that she can use to sign in and to register a passkey.

    What should the administrator issue?
  fr: |
    Une nouvelle employée de Litware n'a encore inscrit aucune méthode d'authentification. Un administrateur veut lui remettre un code secret à durée limitée, avec lequel elle pourra se connecter et inscrire une clé d'accès.

    Que doit émettre l'administrateur ?
body:
  options:
    - { id: a, text: { en: "A Temporary Access Pass", fr: "Un passe d'accès temporaire (Temporary Access Pass)" } }
    - { id: b, text: { en: "An email one-time passcode", fr: "Un code secret à usage unique par e-mail" } }
    - { id: c, text: { en: "A hardware OATH token", fr: "Un jeton OATH matériel" } }
    - { id: d, text: { en: "A QR code with a PIN", fr: "Un code QR avec un code PIN" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Temporary Access Pass is a time-limited passcode that an administrator issues to a user. The user signs in with it and can then register other authentication methods, including passwordless ones such as a passkey. It is useful to onboard new users and to recover access when a user has lost their credentials.
    fr: |
      Un passe d'accès temporaire (Temporary Access Pass) est un code secret à durée limitée qu'un administrateur émet pour un utilisateur. L'utilisateur se connecte avec ce code et peut ensuite inscrire d'autres méthodes d'authentification, y compris des méthodes sans mot de passe comme une clé d'accès. Il sert à intégrer les nouveaux utilisateurs et à rétablir l'accès d'un utilisateur qui a perdu ses informations d'identification.
  options:
    b:
      en: "An email one-time passcode verifies a tenant member for self-service password reset; a member can't sign in with it to register a passkey."
      fr: "Un code secret à usage unique par e-mail vérifie un membre du locataire pour la réinitialisation de mot de passe en libre-service ; un membre ne peut pas s'en servir pour se connecter et inscrire une clé d'accès."
    c:
      en: "A hardware OATH token generates one-time codes that serve only as a second factor; it can't be the primary sign-in of a user who has no other method."
      fr: "Un jeton OATH matériel génère des codes à usage unique qui ne servent que de second facteur ; il ne peut pas être la connexion principale d'un utilisateur qui n'a aucune autre méthode."
    d:
      en: "QR code authentication is a sign-in method for frontline workers on shared devices; it isn't a passcode designed to register other methods."
      fr: "L'authentification par code QR est une méthode de connexion pour les employés de première ligne sur des appareils partagés ; ce n'est pas un code secret conçu pour inscrire d'autres méthodes."
references:
  - title: Describe authentication methods
    url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods
  - title: Configure Temporary Access Pass to register passwordless authentication methods
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-temporary-access-pass
