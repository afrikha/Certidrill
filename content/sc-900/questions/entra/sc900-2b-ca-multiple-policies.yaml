id: sc900-2b-ca-multiple-policies
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two Conditional Access policies apply to a user who signs in to an application. The first policy requires multifactor authentication. The second policy requires a device that is marked as compliant.

    What is required for the user to be granted access?
  fr: |
    Deux stratégies d'accès conditionnel s'appliquent à un utilisateur qui se connecte à une application. La première exige l'authentification multifacteur. La seconde exige un appareil marqué comme conforme.

    Que faut-il pour que l'accès soit accordé à l'utilisateur ?
body:
  options:
    - id: a
      text: { en: "Either multifactor authentication or a compliant device", fr: "Soit l'authentification multifacteur, soit un appareil conforme" }
    - id: b
      text: { en: "Only the requirement of the policy that was created first", fr: "Uniquement l'exigence de la stratégie créée en premier" }
    - id: c
      text: { en: "Both multifactor authentication and a compliant device", fr: "À la fois l'authentification multifacteur et un appareil conforme" }
    - id: d
      text: { en: "Only the requirement of the policy that was modified last", fr: "Uniquement l'exigence de la stratégie modifiée en dernier" }
answer: { optionId: c }
explanation:
  correct:
    en: "Several Conditional Access policies can apply to the same sign-in, and all of them must be satisfied. When one policy requires multifactor authentication and another requires a compliant device, the user must complete multifactor authentication and use a compliant device."
    fr: "Plusieurs stratégies d'accès conditionnel peuvent s'appliquer à une même connexion, et elles doivent toutes être satisfaites. Quand une stratégie exige l'authentification multifacteur et une autre un appareil conforme, l'utilisateur doit effectuer l'authentification multifacteur et utiliser un appareil conforme."
  options:
    a:
      en: "The choice between controls exists only inside one policy, with the option to require one of the selected controls; separate policies add up."
      fr: "Le choix entre des contrôles n'existe qu'à l'intérieur d'une stratégie, avec l'option qui exige un des contrôles sélectionnés ; des stratégies distinctes se cumulent."
    b:
      en: "Conditional Access policies have no order of precedence based on their creation date."
      fr: "Les stratégies d'accès conditionnel n'ont pas d'ordre de priorité fondé sur leur date de création."
    d:
      en: "The date of the last change of a policy gives it no priority over the others."
      fr: "La date de dernière modification d'une stratégie ne lui donne aucune priorité sur les autres."
references:
  - title: Build a Conditional Access policy
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-policies
