id: sc900-2a-hybrid-scim
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The provisioning agent of Microsoft Entra Cloud Sync provisions and deprovisions users and groups in Microsoft Entra ID.

    Which specification does the agent use with Microsoft Entra ID to exchange this identity information?
  fr: |
    L'agent de provisionnement de Microsoft Entra Cloud Sync provisionne et déprovisionne des utilisateurs et des groupes dans Microsoft Entra ID.

    Quelle spécification l'agent utilise-t-il avec Microsoft Entra ID pour échanger ces informations d'identité ?
body:
  options:
    - { id: a, text: "Security Assertion Markup Language (SAML)" }
    - { id: b, text: "System for Cross-domain Identity Management (SCIM)" }
    - { id: c, text: "OpenID Connect (OIDC)" }
    - { id: d, text: "Lightweight Directory Access Protocol (LDAP)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Cloud Sync provisioning agent uses the System for Cross-domain Identity Management (SCIM) specification with Microsoft Entra ID to provision and deprovision users and groups. SCIM is a standard that automates the exchange of user and group identity information between identity domains.
    fr: |
      L'agent de provisionnement de Cloud Sync utilise la spécification System for Cross-domain Identity Management (SCIM) avec Microsoft Entra ID pour provisionner et déprovisionner des utilisateurs et des groupes. SCIM est un standard qui automatise l'échange d'informations d'identité d'utilisateurs et de groupes entre des domaines d'identité.
  options:
    a:
      en: "SAML is an authentication and federation protocol that carries assertions about a signed-in user; it doesn't create or delete accounts."
      fr: "SAML est un protocole d'authentification et de fédération qui transporte des assertions sur un utilisateur connecté ; il ne crée ni ne supprime de comptes."
    c:
      en: "OpenID Connect is an authentication protocol by which an application learns who the user is; it isn't a provisioning standard."
      fr: "OpenID Connect est un protocole d'authentification par lequel une application apprend qui est l'utilisateur ; ce n'est pas un standard de provisionnement."
    d:
      en: "LDAP is a protocol for querying a directory such as Active Directory; it isn't the specification that the agent uses with Microsoft Entra ID."
      fr: "LDAP est un protocole d'interrogation d'un annuaire comme Active Directory ; ce n'est pas la spécification que l'agent utilise avec Microsoft Entra ID."
references:
  - title: Describe hybrid identity
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/4-describe-concept-of-hybrid-identity
  - title: What is Microsoft Entra Cloud Sync?
