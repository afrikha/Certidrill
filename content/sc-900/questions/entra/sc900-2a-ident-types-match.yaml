id: sc900-2a-ident-types-match
objective: "2.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each example to the type of identity that represents it in Microsoft Entra ID.

    To answer, drag the appropriate identity type to each example. Each identity type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque exemple au type d'identité qui le représente dans Microsoft Entra ID.

    Pour répondre, faites glisser le type d'identité approprié vers chaque exemple. Chaque type d'identité peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: user, text: { en: "User identity", fr: "Identité d'utilisateur" } }
    - { id: device, text: { en: "Device identity", fr: "Identité d'appareil" } }
    - { id: workload, text: { en: "Workload identity", fr: "Identité de charge de travail" } }
    - { id: agent, text: { en: "Agent identity", fr: "Identité d'agent" } }
  targets:
    - id: t1
      text:
        en: "A script that runs every night and reads the files of a storage account"
        fr: "Un script qui s'exécute chaque nuit et lit les fichiers d'un compte de stockage"
    - id: t2
      text:
        en: "A consultant of a partner company who is invited to work on a project"
        fr: "Un consultant d'une entreprise partenaire, invité à travailler sur un projet"
    - id: t3
      text:
        en: "A laptop that the company provides to an employee"
        fr: "Un ordinateur portable que l'entreprise fournit à un employé"
answer:
  mapping: { t1: workload, t2: user, t3: device }
explanation:
  correct:
    en: |
      A workload identity is assigned to software, such as an application, a service, a script or a container. A user identity represents a person, whether an employee or an external user such as a consultant, a vendor or a partner. A device identity represents hardware, such as a mobile phone, a laptop, a server or a printer.
    fr: |
      Une identité de charge de travail est attribuée à un logiciel, comme une application, un service, un script ou un conteneur. Une identité d'utilisateur représente une personne, qu'il s'agisse d'un employé ou d'un utilisateur externe comme un consultant, un fournisseur ou un partenaire. Une identité d'appareil représente du matériel, comme un téléphone mobile, un ordinateur portable, un serveur ou une imprimante.
  options:
    agent:
      en: "An agent identity is a specialized identity for an AI agent; none of the examples is an AI agent."
      fr: "Une identité d'agent est une identité spécialisée pour un agent IA ; aucun des exemples n'est un agent IA."
references:
  - title: Describe types of identities
    url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types
