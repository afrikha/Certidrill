id: sc900-2c-gov-questions
objective: "2.4.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two questions does Microsoft Entra ID Governance help an organization answer?

    NOTE: Each correct selection is worth one point.
  fr: |
    À quelles deux questions Gouvernance Microsoft Entra ID aide-t-elle une organisation à répondre ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Which devices are missing security updates?", fr: "Quels appareils n'ont pas reçu les mises à jour de sécurité ?" } }
    - { id: b, text: { en: "Which identities should have access to which resources?", fr: "Quelles identités doivent avoir accès à quelles ressources ?" } }
    - { id: c, text: { en: "Which email messages contain malicious links?", fr: "Quels e-mails contiennent des liens malveillants ?" } }
    - { id: d, text: { en: "Which virtual networks are exposed to the internet?", fr: "Quels réseaux virtuels sont exposés à Internet ?" } }
    - { id: e, text: { en: "Can auditors verify that the access controls are working effectively?", fr: "Les auditeurs peuvent-ils vérifier que les contrôles d'accès fonctionnent efficacement ?" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Identity governance is about who should have access to what, what people do with that access, whether organizational controls exist to manage access, and whether auditors can verify that those controls work. The two selected questions are among these four."
    fr: "La gouvernance des identités porte sur qui doit avoir accès à quoi, sur ce que les personnes font de cet accès, sur l'existence de contrôles organisationnels pour gérer l'accès, et sur la possibilité pour les auditeurs de vérifier que ces contrôles fonctionnent. Les deux questions sélectionnées font partie de ces quatre."
  options:
    a:
      en: "Missing updates on devices are an endpoint management and endpoint protection subject, not an identity governance one."
      fr: "Les mises à jour manquantes sur les appareils relèvent de la gestion et de la protection des points de terminaison, pas de la gouvernance des identités."
    c:
      en: "Malicious links in email are detected by Microsoft Defender for Office 365."
      fr: "Les liens malveillants dans les e-mails sont détectés par Microsoft Defender pour Office 365."
    d:
      en: "Network exposure is assessed by infrastructure security services such as Microsoft Defender for Cloud."
      fr: "L'exposition des réseaux est évaluée par des services de sécurité de l'infrastructure comme Microsoft Defender pour le cloud."
references:
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
