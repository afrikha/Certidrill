# SC-900 objectives — official study guide, skills measured as of 2026-10-21 (en-us page, checked on 2026-11-16).
# The fr-fr page was still at the 2026-07-28 outline: French comes from it; 2.1.2 and 3.4.7 (changed on 2026-10-21)
# are our translations — re-sync when the fr-fr page is updated. Verb forms harmonized on 2.1.1 and 3.4.4 ("Décrire").
# `code` is the stable key referenced by question files and course sections.
concepts:
- group:
    en: Describe security and compliance concepts
    fr: Décrire les concepts liés à la sécurité et à la conformité
  objectives:
  - code: 1.1.1
    en: Describe the shared responsibility model
    fr: Décrire le modèle de responsabilité partagée
  - code: 1.1.2
    en: Describe defense-in-depth
    fr: Décrire la défense en profondeur
  - code: 1.1.3
    en: Describe the Zero Trust model
    fr: Décrire le modèle de confiance zéro
  - code: 1.1.4
    en: Describe encryption and hashing
    fr: Décrire le chiffrement et le hachage
  - code: 1.1.5
    en: Describe Governance, Risk, and Compliance (GRC) concepts
    fr: Décrire les concepts de gouvernance, de risque et de conformité (GRC)
- group:
    en: Define identity concepts
    fr: Définir des concepts d'identité
  objectives:
  - code: 1.2.1
    en: Define identity as the primary security perimeter
    fr: Définir l'identité comme périmètre de sécurité principal
  - code: 1.2.2
    en: Define authentication
    fr: Définir l'authentification
  - code: 1.2.3
    en: Define authorization
    fr: Définir l'autorisation
  - code: 1.2.4
    en: Describe identity providers
    fr: Décrire les fournisseurs d'identité
  - code: 1.2.5
    en: Describe the concept of directory services and Active Directory
    fr: Décrire le concept des services d'annuaire et d'Active Directory
  - code: 1.2.6
    en: Describe the concept of federation
    fr: Décrire le concept de fédération
