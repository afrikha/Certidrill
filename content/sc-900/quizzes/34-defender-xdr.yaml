chapter: 34-defender-xdr
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-34-01
    objective: "3.4.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An analyst at Woodgrove Bank wants to read the knowledge that Microsoft keeps up to date about a threat actor group known to target banks: who it targets, how it operates and which tools it uses.

        What should the analyst open under Threat intelligence in the Microsoft Defender portal?
      fr: |
        Un analyste de Woodgrove Bank veut lire les connaissances que Microsoft tient à jour sur un groupe d'acteurs de menace connu pour cibler les banques : qui il cible, comment il opère et quels outils il utilise.

        Que doit ouvrir l'analyste sous Threat Intelligence dans le portail Microsoft Defender ?
    body:
      options:
        - { id: a, text: { en: "Intel projects", fr: "Les projets Intel (Intel projects)" } }
        - { id: b, text: { en: "Intel profiles", fr: "Les profils Intel (Intel profiles)" } }
        - { id: c, text: { en: "Advanced hunting", fr: "Le repérage avancé (Advanced hunting)" } }
        - { id: d, text: { en: "Action center", fr: "Le centre de notifications (Action center)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Intel profiles are Microsoft's curated repository of knowledge on tracked threat actors, malicious tools and vulnerabilities. Microsoft's threat intelligence experts update them continuously, so that analysts can see who might be targeting them and how.
        fr: |
          Les profils Intel sont le référentiel organisé par Microsoft des connaissances sur les acteurs de menace suivis, les outils malveillants et les vulnérabilités. Les experts en renseignement sur les menaces de Microsoft les mettent à jour en continu, pour que les analystes voient qui pourrait les cibler et comment.
      options:
        a: { en: "Intel projects organize the indicators that the analyst's own team gathers during an investigation; they don't hold Microsoft's knowledge about an actor.", fr: "Les projets Intel organisent les indicateurs que l'équipe de l'analyste rassemble pendant une investigation ; ils ne contiennent pas les connaissances de Microsoft sur un acteur." }
        c: { en: "Advanced hunting runs queries over the organization's own raw data; it doesn't provide curated profiles of threat actors.", fr: "Le repérage avancé exécute des requêtes sur les données brutes de l'organisation ; il ne fournit pas de profils organisés d'acteurs de menace." }
        d: { en: "The Action center lists pending and completed remediation actions; it isn't a threat intelligence resource.", fr: "Le centre de notifications liste les actions de correction en attente et terminées ; ce n'est pas une ressource de renseignement sur les menaces." }
    references:
      - title: Describe Microsoft Defender Threat Intelligence
        url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6b-describe-defender-threat-intelligence

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-34-02
    objective: "3.4.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which Microsoft Defender for Endpoint capability provides the antivirus protection of devices, with behavior-based, real-time and cloud-delivered protection against emerging threats?
      fr: |
        Quelle fonctionnalité de Microsoft Defender pour point de terminaison fournit la protection antivirus des appareils, avec une protection comportementale, en temps réel et assurée par le cloud contre les menaces émergentes ?
    body:
      options:
        - { id: a, text: { en: "Attack surface reduction", fr: "Réduction de la surface d'attaque" } }
        - { id: b, text: { en: "Endpoint detection and response", fr: "Détection et réponse des points de terminaison" } }
        - { id: c, text: { en: "Next-generation protection", fr: "Protection de nouvelle génération" } }
        - { id: d, text: { en: "Automated investigation and remediation", fr: "Investigation et correction automatisées" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Next-generation protection is built on Microsoft Defender Antivirus and is designed to catch emerging threats: behavior-based, heuristic and real-time protection, plus cloud-delivered protection that detects and blocks new threats almost instantly.
        fr: |
          La protection de nouvelle génération repose sur Microsoft Defender Antivirus et est conçue pour intercepter les menaces émergentes : protection comportementale, heuristique et en temps réel, plus une protection assurée par le cloud qui détecte et bloque les nouvelles menaces presque instantanément.
      options:
        a: { en: "Attack surface reduction is the first layer of defense: it hardens the configuration and includes network and web protection, not the antivirus.", fr: "La réduction de la surface d'attaque est la première couche de défense : elle renforce la configuration et comprend la protection réseau et la protection web, pas l'antivirus." }
        b: { en: "EDR detects advanced attacks in near real time and gives analysts response actions; it isn't the antivirus engine.", fr: "L'EDR détecte les attaques avancées en temps quasi réel et donne aux analystes des actions de réponse ; ce n'est pas le moteur antivirus." }
        d: { en: "Automated investigation and remediation examines alerts and resolves breaches automatically; it doesn't provide the antivirus protection itself.", fr: "L'investigation et la correction automatisées examinent les alertes et résolvent automatiquement les violations ; elles ne fournissent pas elles-mêmes la protection antivirus." }
    references:
      - title: Describe Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/4-describe-defender-endpoint

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-34-03
    objective: "3.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Employees of the finance department at Contoso receive email messages that use the name of the chief financial officer and come from the domain contos0.com, registered by an attacker. The messages ask for an urgent wire transfer and contain no link and no attachment.

        Which Microsoft Defender for Office 365 feature is designed to detect these messages?
      fr: |
        Les employés du service financier de Contoso reçoivent des e-mails qui utilisent le nom du directeur financier et proviennent du domaine contos0.com, enregistré par un attaquant. Les messages demandent un virement urgent et ne contiennent ni lien ni pièce jointe.

        Quelle fonctionnalité de Microsoft Defender pour Office 365 est conçue pour détecter ces messages ?
    body:
      options:
        - { id: a, text: { en: "Safe Links", fr: "Liens sécurisés (Safe Links)" } }
        - { id: b, text: { en: "Attack simulation training", fr: "Formation à la simulation d'attaque (Attack simulation training)" } }
        - { id: c, text: { en: "Safe Attachments", fr: "Pièces jointes sécurisées (Safe Attachments)" } }
        - { id: d, text: { en: "Anti-phishing protection", fr: "Protection anti-hameçonnage" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The anti-phishing policies of Defender for Office 365 include user impersonation and domain impersonation protection: they detect senders or domains that look similar to a real person or domain, such as a look-alike of contoso.com. Impersonation protection is available only in Defender for Office 365, not in the basic protection of every cloud mailbox.
        fr: |
          Les stratégies anti-hameçonnage de Defender pour Office 365 comprennent la protection contre l'emprunt d'identité d'utilisateur et de domaine : elles détectent les expéditeurs ou les domaines qui ressemblent à une personne ou à un domaine réel, comme un sosie de contoso.com. La protection contre l'emprunt d'identité n'existe que dans Defender pour Office 365, pas dans la protection de base de toute boîte aux lettres cloud.
      options:
        a: { en: "Safe Links checks URLs at the time of the click; these messages contain no link.", fr: "Liens sécurisés vérifie les URL au moment du clic ; ces messages ne contiennent aucun lien." }
        b: { en: "Attack simulation training trains users with simulated attacks; it doesn't detect real incoming messages.", fr: "La formation à la simulation d'attaque forme les utilisateurs par des attaques simulées ; elle ne détecte pas les vrais messages entrants." }
        c: { en: "Safe Attachments detonates attachments in a virtual environment; these messages carry no attachment.", fr: "Pièces jointes sécurisées fait détoner les pièces jointes dans un environnement virtuel ; ces messages ne portent aucune pièce jointe." }
    references:
      - title: Anti-phishing policies in cloud organizations
        url: https://learn.microsoft.com/en-us/defender-office-365/anti-phishing-policies-about

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-34-04
    objective: "3.4.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam deploys Microsoft Defender for Endpoint on its Windows and macOS laptops. Before the rollout, the security lead writes a one-page note for the managers that explains what each layer of the product does, from prevention to response.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam déploie Microsoft Defender pour point de terminaison sur ses ordinateurs portables Windows et macOS. Avant le déploiement, le responsable de la sécurité rédige pour les managers une note d'une page qui explique ce que fait chaque couche du produit, de la prévention à la réponse.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To harden the configuration of the laptops and block access to malicious domains and URLs before any attack, Fabrikam relies on [[s1]].

          To spot an advanced attack in near real time and give its analysts the tools to see the scope of the breach and act on it, Fabrikam relies on [[s2]].

          To have the alerts examined and the breaches resolved without an analyst, Fabrikam relies on [[s3]].
        fr: |
          Pour renforcer la configuration des ordinateurs portables et bloquer l'accès aux domaines et aux URL malveillants avant toute attaque, Fabrikam s'appuie sur [[s1]].

          Pour repérer une attaque avancée en temps quasi réel et donner à ses analystes les outils pour voir l'étendue de la violation et agir, Fabrikam s'appuie sur [[s2]].

          Pour faire examiner les alertes et résoudre les violations sans analyste, Fabrikam s'appuie sur [[s3]].
      slots:
        - id: s1
          options:
            - { id: asr, text: { en: "attack surface reduction", fr: "la réduction de la surface d'attaque" } }
            - { id: edr1, text: { en: "endpoint detection and response", fr: "la détection et la réponse des points de terminaison" } }
            - { id: air1, text: { en: "automated investigation and remediation", fr: "l'investigation et la correction automatisées" } }
        - id: s2
          options:
            - { id: asr2, text: { en: "attack surface reduction", fr: "la réduction de la surface d'attaque" } }
            - { id: edr, text: { en: "endpoint detection and response", fr: "la détection et la réponse des points de terminaison" } }
            - { id: air2, text: { en: "automated investigation and remediation", fr: "l'investigation et la correction automatisées" } }
        - id: s3
          options:
            - { id: asr3, text: { en: "attack surface reduction", fr: "la réduction de la surface d'attaque" } }
            - { id: edr3, text: { en: "endpoint detection and response", fr: "la détection et la réponse des points de terminaison" } }
            - { id: air, text: { en: "automated investigation and remediation", fr: "l'investigation et la correction automatisées" } }
    answer: { values: { s1: asr, s2: edr, s3: air } }
    explanation:
      correct:
        en: |
          Attack surface reduction is the first layer of defense: it hardens the configuration and includes network and web protection against malicious IP addresses, domains and URLs. Endpoint detection and response provides near real-time, actionable detections and lets analysts see the full scope of a breach and take response actions. Automated investigation and remediation examines alerts and takes immediate action to resolve breaches, which reduces the alert volume.
        fr: |
          La réduction de la surface d'attaque est la première couche de défense : elle renforce la configuration et comprend la protection réseau et la protection web contre les adresses IP, les domaines et les URL malveillants. La détection et la réponse des points de terminaison fournissent des détections exploitables en temps quasi réel et permettent aux analystes de voir toute l'étendue d'une violation et de prendre des actions de réponse. L'investigation et la correction automatisées examinent les alertes et agissent immédiatement pour résoudre les violations, ce qui réduit le volume d'alertes.
      options:
        edr1: { en: "EDR detects attacks that are already under way; hardening and blocking malicious URLs beforehand is attack surface reduction.", fr: "L'EDR détecte les attaques déjà en cours ; renforcer la configuration et bloquer les URL malveillantes en amont relève de la réduction de la surface d'attaque." }
        air2: { en: "Automated investigation acts without analysts; the second sentence describes the tools that analysts use, which is EDR.", fr: "L'investigation automatisée agit sans analyste ; la deuxième phrase décrit les outils qu'utilisent les analystes, c'est-à-dire l'EDR." }
        edr3: { en: "EDR gives analysts the means to respond; resolving breaches without an analyst is automated investigation and remediation.", fr: "L'EDR donne aux analystes les moyens de répondre ; résoudre les violations sans analyste relève de l'investigation et de la correction automatisées." }
    references:
      - title: Describe Microsoft Defender for Endpoint
        url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/4-describe-defender-endpoint

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-34-05
    objective: "3.4.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        After an outage caused by an expired certificate, Litware wants a central inventory of the digital certificates installed on its devices, so that it can find the certificates before they expire and spot those that use weak signature algorithms.

        Which service should Litware use?
      fr: |
        Après une panne causée par un certificat expiré, Litware veut un inventaire central des certificats numériques installés sur ses appareils, pour trouver les certificats avant leur expiration et repérer ceux qui utilisent des algorithmes de signature faibles.

        Quel service Litware doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "Microsoft Defender for Identity", fr: "Microsoft Defender pour Identity" } }
        - { id: b, text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" } }
        - { id: c, text: "Microsoft Threat Intelligence" }
        - { id: d, text: { en: "Microsoft Defender Vulnerability Management", fr: "Gestion des vulnérabilités Microsoft Defender" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Continuous asset discovery and monitoring in Defender Vulnerability Management provides consolidated inventories of software, digital certificates, hardware and firmware, and browser extensions. Its central certificate inventory identifies certificates before they expire and detects weak signature algorithms.
        fr: |
          La détection et la surveillance continues des ressources de la Gestion des vulnérabilités Microsoft Defender fournissent des inventaires consolidés des logiciels, des certificats numériques, du matériel et des microprogrammes, et des extensions de navigateur. Son inventaire central des certificats repère les certificats avant leur expiration et détecte les algorithmes de signature faibles.
      options:
        a: { en: "Defender for Identity can monitor servers running Active Directory Certificate Services to detect identity attacks, but it doesn't inventory the certificates installed on devices.", fr: "Defender pour Identity peut surveiller les serveurs qui exécutent les services de certificats Active Directory pour détecter les attaques d'identité, mais il n'inventorie pas les certificats installés sur les appareils." }
        b: { en: "Defender for Cloud Apps protects SaaS applications and their data; device certificates are outside its scope.", fr: "Defender pour les applications cloud protège les applications SaaS et leurs données ; les certificats des appareils sortent de son périmètre." }
        c: { en: "Microsoft Threat Intelligence provides knowledge about external threats, not an inventory of the organization's own certificates.", fr: "Microsoft Threat Intelligence fournit des connaissances sur les menaces externes, pas un inventaire des certificats de l'organisation." }
    references:
      - title: Describe Microsoft Defender Vulnerability Management
        url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6a-describe-defender-vulnerability-management

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-34-06
    objective: "3.4.8"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum splits its administration between three people: one handles security operations, one handles data compliance and one handles identities. During an audit, each of them must show the task they performed this week in the Microsoft portal where it belongs.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum répartit son administration entre trois personnes : l'une gère les opérations de sécurité, une autre la conformité des données et la troisième les identités. Lors d'un audit, chacune doit montrer la tâche qu'elle a effectuée cette semaine dans le portail Microsoft auquel elle appartient.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To triage an incident that combines alerts from Defender for Endpoint and Defender for Office 365, the security operations administrator uses [[p1]].

          To create a data loss prevention (DLP) policy that stops credit card numbers from being shared outside the company, the compliance administrator uses [[p2]].

          To create a Conditional Access policy that requires multifactor authentication for the finance users, the identity administrator uses [[p3]].
        fr: |
          Pour trier un incident qui combine des alertes de Defender pour point de terminaison et de Defender pour Office 365, l'administrateur des opérations de sécurité utilise [[p1]].

          Pour créer une stratégie de protection contre la perte de données (DLP) qui empêche le partage des numéros de carte de crédit hors de l'entreprise, l'administrateur de la conformité utilise [[p2]].

          Pour créer une stratégie d'accès conditionnel qui exige l'authentification multifacteur pour les utilisateurs de la finance, l'administrateur des identités utilise [[p3]].
      slots:
        - id: p1
          options:
            - { id: def1, text: { en: "the Microsoft Defender portal", fr: "le portail Microsoft Defender" } }
            - { id: pur1, text: { en: "the Microsoft Purview portal", fr: "le portail Microsoft Purview" } }
            - { id: ent1, text: { en: "the Microsoft Entra admin center", fr: "le Centre d'administration Microsoft Entra" } }
            - { id: m3651, text: { en: "the Microsoft 365 admin center", fr: "le Centre d'administration Microsoft 365" } }
        - id: p2
          options:
            - { id: def2, text: { en: "the Microsoft Defender portal", fr: "le portail Microsoft Defender" } }
            - { id: pur2, text: { en: "the Microsoft Purview portal", fr: "le portail Microsoft Purview" } }
            - { id: ent2, text: { en: "the Microsoft Entra admin center", fr: "le Centre d'administration Microsoft Entra" } }
            - { id: m3652, text: { en: "the Microsoft 365 admin center", fr: "le Centre d'administration Microsoft 365" } }
        - id: p3
          options:
            - { id: def3, text: { en: "the Microsoft Defender portal", fr: "le portail Microsoft Defender" } }
            - { id: pur3, text: { en: "the Microsoft Purview portal", fr: "le portail Microsoft Purview" } }
            - { id: ent3, text: { en: "the Microsoft Entra admin center", fr: "le Centre d'administration Microsoft Entra" } }
            - { id: m3653, text: { en: "the Microsoft 365 admin center", fr: "le Centre d'administration Microsoft 365" } }
    answer: { values: { p1: def1, p2: pur2, p3: ent3 } }
    explanation:
      correct:
        en: |
          The Microsoft Defender portal is the single place for security operations: incidents group the related alerts of the Defender XDR services. Compliance and data protection solutions, such as DLP, labels, eDiscovery and audit, are in the Microsoft Purview portal. Identities and Conditional Access are managed in the Microsoft Entra admin center.
        fr: |
          Le portail Microsoft Defender est le lieu unique des opérations de sécurité : les incidents y regroupent les alertes liées des services Defender XDR. Les solutions de conformité et de protection des données, comme la DLP, les étiquettes, eDiscovery et l'audit, se trouvent dans le portail Microsoft Purview. Les identités et l'accès conditionnel se gèrent dans le Centre d'administration Microsoft Entra.
      options:
        pur1: { en: "The Purview portal hosts compliance solutions; incidents from Defender XDR services are triaged in the Defender portal.", fr: "Le portail Purview héberge les solutions de conformité ; les incidents des services Defender XDR se trient dans le portail Defender." }
        def2: { en: "The Defender portal is for security operations; DLP is a Microsoft Purview solution, managed in the Purview portal.", fr: "Le portail Defender sert aux opérations de sécurité ; la DLP est une solution Microsoft Purview, gérée dans le portail Purview." }
        def3: { en: "Conditional Access is a Microsoft Entra ID feature; its policies are created in the Microsoft Entra admin center.", fr: "L'accès conditionnel est une fonctionnalité de Microsoft Entra ID ; ses stratégies se créent dans le Centre d'administration Microsoft Entra." }
        m3653: { en: "The Microsoft 365 admin center manages users, licenses and services of Microsoft 365, not Conditional Access policies.", fr: "Le Centre d'administration Microsoft 365 gère les utilisateurs, les licences et les services de Microsoft 365, pas les stratégies d'accès conditionnel." }
    references:
      - title: Describe the Microsoft Defender portal
        url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/7-describe-microsoft-defender-portal
      - title: Learn about the Microsoft Purview portal
        url: https://learn.microsoft.com/en-us/purview/purview-portal

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-34-07
    objective: "3.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        The security team of Tailspin Toys works in the Microsoft Defender portal, where it uses several Microsoft security products. A manager asks which of these products are part of the Microsoft Defender XDR suite.

        Which two products are services of Microsoft Defender XDR?

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe de sécurité de Tailspin Toys travaille dans le portail Microsoft Defender, où elle utilise plusieurs produits de sécurité Microsoft. Un responsable demande lesquels de ces produits font partie de la suite Microsoft Defender XDR.

        Quels sont les deux produits qui sont des services de Microsoft Defender XDR ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "Microsoft Sentinel" }
        - { id: b, text: { en: "Microsoft Defender Vulnerability Management", fr: "Gestion des vulnérabilités Microsoft Defender" } }
        - { id: c, text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" } }
        - { id: d, text: { en: "Microsoft Defender for Identity", fr: "Microsoft Defender pour Identity" } }
        - { id: e, text: { en: "Microsoft Purview Insider Risk Management", fr: "Gestion des risques internes Microsoft Purview" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The Defender XDR suite includes Defender for Endpoint, Defender Vulnerability Management, Defender for Office 365, Defender for Identity, Microsoft Entra ID Protection and Defender for Cloud Apps. Microsoft Sentinel and Defender for Cloud are also used in the Defender portal, but they are separate products whose data the portal brings together with that of Defender XDR.
        fr: |
          La suite Defender XDR comprend Defender pour point de terminaison, la Gestion des vulnérabilités Microsoft Defender, Defender pour Office 365, Defender pour Identity, Microsoft Entra ID Protection et Defender pour les applications cloud. Microsoft Sentinel et Defender pour le cloud s'utilisent aussi dans le portail Defender, mais ce sont des produits distincts dont le portail réunit les données avec celles de Defender XDR.
      options:
        a: { en: "Microsoft Sentinel is a SIEM and SOAR that is used in the Defender portal; it isn't one of the Defender XDR services.", fr: "Microsoft Sentinel est un SIEM et un SOAR qui s'utilise dans le portail Defender ; ce n'est pas l'un des services Defender XDR." }
        c: { en: "Defender for Cloud protects Azure, AWS and GCP resources; it is accessed from the Defender portal but isn't part of the Defender XDR suite.", fr: "Defender pour le cloud protège les ressources Azure, AWS et GCP ; il est accessible depuis le portail Defender mais ne fait pas partie de la suite Defender XDR." }
        e: { en: "Insider Risk Management is a Microsoft Purview solution, managed in the Purview portal, not a Defender XDR service.", fr: "La gestion des risques internes est une solution Microsoft Purview, gérée dans le portail Purview, pas un service Defender XDR." }
    references:
      - title: Describe Microsoft Defender XDR services
        url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-34-08
    objective: "3.4.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contractors of Northwind Traders use their own unmanaged laptops to open the company's CRM, a non-Microsoft SaaS app, in a web browser. They must keep the ability to view the records, but downloads must be blocked in real time during their sessions. Nothing can be installed on their laptops.

        What should Northwind Traders use?
      fr: |
        Les prestataires de Northwind Traders utilisent leurs propres ordinateurs portables non gérés pour ouvrir le CRM de l'entreprise, une application SaaS d'un autre éditeur que Microsoft, dans un navigateur web. Ils doivent garder la possibilité de consulter les enregistrements, mais les téléchargements doivent être bloqués en temps réel pendant leurs sessions. Rien ne peut être installé sur leurs ordinateurs portables.

        Que doit utiliser Northwind Traders ?
    body:
      options:
        - { id: a, text: { en: "A Conditional Access policy that requires a compliant device to open the CRM", fr: "Une stratégie d'accès conditionnel qui exige un appareil conforme pour ouvrir le CRM" } }
        - { id: b, text: { en: "Cloud discovery in Microsoft Defender for Cloud Apps, with the CRM marked as sanctioned", fr: "La découverte du cloud dans Microsoft Defender pour les applications cloud, avec le CRM marqué comme approuvé" } }
        - { id: c, text: { en: "Conditional Access app control in Microsoft Defender for Cloud Apps, with a session policy", fr: "Le contrôle d'application par accès conditionnel dans Microsoft Defender pour les applications cloud, avec une stratégie de session" } }
        - { id: d, text: { en: "Microsoft Defender for Endpoint, with web protection turned on for the contractor laptops", fr: "Microsoft Defender pour point de terminaison, avec la protection web activée sur les ordinateurs des prestataires" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Conditional Access app control works with Microsoft Entra Conditional Access: users are routed to Defender for Cloud Apps, which monitors and controls their browser sessions in real time. A session policy can block downloads on unmanaged devices while leaving access open, and nothing has to be installed on the device.
        fr: |
          Le contrôle d'application par accès conditionnel fonctionne avec l'accès conditionnel Microsoft Entra : les utilisateurs sont redirigés vers Defender pour les applications cloud, qui surveille et contrôle leurs sessions de navigateur en temps réel. Une stratégie de session peut bloquer les téléchargements sur les appareils non gérés tout en laissant l'accès ouvert, et rien ne doit être installé sur l'appareil.
      options:
        a: { en: "Requiring a compliant device would block the contractors' unmanaged laptops entirely, but they must keep the ability to view the records.", fr: "Exiger un appareil conforme bloquerait complètement les ordinateurs non gérés des prestataires, alors qu'ils doivent garder la possibilité de consulter les enregistrements." }
        b: { en: "Cloud discovery finds and rates the cloud apps in use; it doesn't control what happens inside a user's session.", fr: "La découverte du cloud trouve et évalue les applications cloud utilisées ; elle ne contrôle pas ce qui se passe dans la session d'un utilisateur." }
        d: { en: "Defender for Endpoint must be onboarded on the device, which is excluded here, and web protection blocks malicious sites rather than downloads from an approved app.", fr: "Defender pour point de terminaison doit être intégré sur l'appareil, ce qui est exclu ici, et la protection web bloque les sites malveillants plutôt que les téléchargements depuis une application approuvée." }
    references:
      - title: Conditional Access app control in Microsoft Defender for Cloud Apps
        url: https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-34-09
    objective: "3.4.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware runs an on-premises Active Directory forest with domain controllers, servers running Active Directory Federation Services (AD FS) and Active Directory Certificate Services (AD CS). The security team plans to deploy Microsoft Defender for Identity and prepares notes for the deployment.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware exploite une forêt Active Directory locale avec des contrôleurs de domaine, des serveurs qui exécutent les services de fédération Active Directory (AD FS) et les services de certificats Active Directory (AD CS). L'équipe de sécurité prévoit de déployer Microsoft Defender pour Identity et prépare des notes pour le déploiement.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Defender for Identity sensors can be installed on the AD FS and AD CS servers, in addition to the domain controllers.", fr: "Les capteurs de Defender pour Identity peuvent être installés sur les serveurs AD FS et AD CS, en plus des contrôleurs de domaine." } }
        - { id: s2, text: { en: "To detect identity attacks, Defender for Identity needs its sensor on each workstation that users sign in to.", fr: "Pour détecter les attaques d'identité, Defender pour Identity a besoin de son capteur sur chaque poste de travail sur lequel les utilisateurs se connectent." } }
        - { id: s3, text: { en: "When an attacker uses a compromised account to reach other computers and more sensitive accounts, Defender for Identity reports it as lateral movement.", fr: "Quand un attaquant utilise un compte compromis pour atteindre d'autres ordinateurs et des comptes plus sensibles, Defender pour Identity le signale comme un mouvement latéral." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          Defender for Identity installs software sensors on the identity infrastructure servers: domain controllers and servers running AD FS and AD CS. The sensors parse logs and network traffic locally and send the parsed information to the cloud service, so no agent is needed on the users' workstations. Among the stages of the attack that it detects, lateral movement covers attempts to move inside the network to gain control of more sensitive users.
        fr: |
          Defender pour Identity installe des capteurs logiciels sur les serveurs de l'infrastructure d'identité : les contrôleurs de domaine et les serveurs qui exécutent AD FS et AD CS. Les capteurs analysent localement les journaux et le trafic réseau et envoient les informations analysées au service cloud : aucun agent n'est donc nécessaire sur les postes de travail des utilisateurs. Parmi les étapes d'attaque qu'il détecte, le mouvement latéral couvre les tentatives de se déplacer dans le réseau pour prendre le contrôle d'utilisateurs plus sensibles.
      options:
        s2: { en: "The sensors run on the identity infrastructure servers, which see the authentication traffic; workstations don't need one. Protecting the devices themselves is the role of Defender for Endpoint.", fr: "Les capteurs s'exécutent sur les serveurs de l'infrastructure d'identité, qui voient le trafic d'authentification ; les postes de travail n'en ont pas besoin. Protéger les appareils eux-mêmes est le rôle de Defender pour point de terminaison." }
    references:
      - title: Describe Microsoft Defender for Identity
        url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/6-describe-defender-identity

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-34-10
    objective: "3.4.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Microsoft Defender XDR groups four alerts into a single incident at Wingtip Toys. The organization uses Microsoft Entra ID for its cloud identities and keeps an on-premises Active Directory domain.

        Which service raised each alert? To answer, drag the appropriate service to each alert. Each service may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Microsoft Defender XDR regroupe quatre alertes en un seul incident chez Wingtip Toys. L'organisation utilise Microsoft Entra ID pour ses identités cloud et conserve un domaine Active Directory local.

        Quel service a émis chaque alerte ? Pour répondre, faites glisser le service approprié vers chaque alerte. Chaque service peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: idp, text: "Microsoft Entra ID Protection" }
        - { id: mde, text: { en: "Microsoft Defender for Endpoint", fr: "Microsoft Defender pour point de terminaison" } }
        - { id: mdi, text: { en: "Microsoft Defender for Identity", fr: "Microsoft Defender pour Identity" } }
        - { id: mdca, text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" } }
        - { id: mdo, text: { en: "Microsoft Defender for Office 365", fr: "Microsoft Defender pour Office 365" } }
        - { id: mdvm, text: { en: "Microsoft Defender Vulnerability Management", fr: "Gestion des vulnérabilités Microsoft Defender" } }
      targets:
        - { id: t1, text: { en: "A sign-in to Microsoft Entra ID from an anonymous IP address is flagged as risky", fr: "Une connexion à Microsoft Entra ID depuis une adresse IP anonyme est signalée comme à risque" } }
        - { id: t2, text: { en: "A suspicious process runs on the laptop of the same user and contacts an unknown server", fr: "Un processus suspect s'exécute sur l'ordinateur portable du même utilisateur et contacte un serveur inconnu" } }
        - { id: t3, text: { en: "Repeated failed authentications against domain accounts are seen on a domain controller", fr: "Des échecs d'authentification répétés sur des comptes du domaine sont observés sur un contrôleur de domaine" } }
        - { id: t4, text: { en: "The user's account downloads an unusual volume of files from a third-party SaaS app", fr: "Le compte de l'utilisateur télécharge un volume inhabituel de fichiers depuis une application SaaS tierce" } }
    answer: { mapping: { t1: idp, t2: mde, t3: mdi, t4: mdca } }
    explanation:
      correct:
        en: |
          Risky sign-ins to Microsoft Entra ID are detected by Microsoft Entra ID Protection, which protects cloud identities. A suspicious process on a device is an endpoint detection of Defender for Endpoint. Repeated failed authentications seen on a domain controller are a compromised credentials detection of Defender for Identity, whose sensors watch the on-premises Active Directory. Anomalous activity in a SaaS app, such as an unusual download volume, is detected by Defender for Cloud Apps. Defender XDR correlates these alerts into one incident.
        fr: |
          Les connexions à risque à Microsoft Entra ID sont détectées par Microsoft Entra ID Protection, qui protège les identités cloud. Un processus suspect sur un appareil est une détection de point de terminaison de Defender pour point de terminaison. Des échecs d'authentification répétés observés sur un contrôleur de domaine sont une détection d'informations d'identification compromises de Defender pour Identity, dont les capteurs surveillent l'Active Directory local. Une activité anormale dans une application SaaS, comme un volume de téléchargement inhabituel, est détectée par Defender pour les applications cloud. Defender XDR corrèle ces alertes en un seul incident.
      options:
        mdo: { en: "Defender for Office 365 protects email and collaboration tools; none of the alerts concerns a message, a link or an attachment.", fr: "Defender pour Office 365 protège l'e-mail et les outils de collaboration ; aucune des alertes ne concerne un message, un lien ou une pièce jointe." }
        mdvm: { en: "Defender Vulnerability Management finds and prioritizes vulnerabilities and misconfigurations; it doesn't raise alerts on attacker activity like these.", fr: "La Gestion des vulnérabilités Microsoft Defender trouve et hiérarchise les vulnérabilités et les erreurs de configuration ; elle n'émet pas d'alertes sur une activité d'attaquant comme celles-ci." }
    references:
      - title: Describe Microsoft Defender XDR services
        url: https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/2-describe-services
