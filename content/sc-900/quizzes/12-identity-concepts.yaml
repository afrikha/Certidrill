chapter: 12-identity-concepts
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-12-01
    objective: "1.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A user has already signed in to an application.

        Which question does authorization answer next?
      fr: |
        Un utilisateur s'est déjà connecté à une application.

        À quelle question l'autorisation répond-elle ensuite ?
    body:
      options:
        - { id: a, text: { en: "Who is this user?", fr: "Qui est cet utilisateur ?" } }
        - { id: b, text: { en: "Who did what, and when?", fr: "Qui a fait quoi, et quand ?" } }
        - { id: c, text: { en: "Which device does the user have?", fr: "Quel appareil l'utilisateur possède-t-il ?" } }
        - { id: d, text: { en: "What is this user allowed to do?", fr: "Qu'est-ce que cet utilisateur a le droit de faire ?" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Authorization determines what an authenticated identity is allowed to do: which applications, files, data or features it can access. It always comes after a successful authentication and bases its decision on roles, permissions and attributes.
        fr: |
          L'autorisation détermine ce qu'une identité authentifiée a le droit de faire : à quelles applications, quels fichiers, quelles données ou quelles fonctionnalités elle peut accéder. Elle vient toujours après une authentification réussie et fonde sa décision sur des rôles, des autorisations et des attributs.
      options:
        a: { en: "Establishing who the user is, is the question that authentication answers, before authorization.", fr: "Établir qui est l'utilisateur est la question à laquelle répond l'authentification, avant l'autorisation." }
        b: { en: "Tracking who did what and when is the role of auditing, another pillar of the identity infrastructure.", fr: "Suivre qui a fait quoi et quand est le rôle de l'audit, un autre pilier de l'infrastructure d'identité." }
        c: { en: "A device that the user has can be an authentication factor (something you have); it doesn't define the user's permissions.", fr: "Un appareil que possède l'utilisateur peut être un facteur d'authentification (quelque chose que vous possédez) ; il ne définit pas les autorisations de l'utilisateur." }
    references:
      - title: Define authentication and authorization
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-12-02
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso deploys an AI agent that schedules meetings and answers routine requests on behalf of its employees.

        Which type of identity represents this AI agent?
      fr: |
        Contoso déploie un agent IA qui planifie des réunions et répond aux demandes courantes pour le compte de ses employés.

        Quel type d'identité représente cet agent IA ?
    body:
      options:
        - { id: a, text: { en: "A human identity", fr: "Une identité humaine" } }
        - { id: b, text: { en: "An agent identity", fr: "Une identité d'agent" } }
        - { id: c, text: { en: "A device identity", fr: "Une identité d'appareil" } }
        - { id: d, text: { en: "A workload identity", fr: "Une identité de charge de travail" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Agent identities represent AI agents that act on behalf of users or processes. Like the other identity types, they must be authenticated and authorized, and they need their own governance and lifecycle management.
        fr: |
          Les identités d'agent représentent les agents IA qui agissent pour le compte d'utilisateurs ou de processus. Comme les autres types d'identités, elles doivent être authentifiées et autorisées, et elles ont besoin de leur propre gouvernance et de leur propre gestion du cycle de vie.
      options:
        a: { en: "Human identities represent people: employees, contractors, partners and customers. The agent acts for them but isn't one of them.", fr: "Les identités humaines représentent des personnes : employés, sous-traitants, partenaires et clients. L'agent agit pour elles mais n'en est pas une." }
        c: { en: "Device identities represent laptops, phones, tablets and IoT sensors, not software that acts for users.", fr: "Les identités d'appareil représentent des ordinateurs portables, des téléphones, des tablettes et des capteurs IoT, pas un logiciel qui agit pour des utilisateurs." }
        d: { en: "Workload identities represent applications, services and automated processes that run without a person; AI agents acting for users have their own identity type.", fr: "Les identités de charge de travail représentent les applications, services et processus automatisés qui s'exécutent sans personne ; les agents IA qui agissent pour des utilisateurs ont leur propre type d'identité." }
    references:
      - title: Define identity as the primary security perimeter
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/3-define-identity-primary-security-perimeter

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-12-03
    objective: "1.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        After a user signs in, an identity provider issues a security token that the applications accept as proof of the sign-in. Among its claims, the token carries an expiration time.

        Why are these tokens time-limited?
      fr: |
        Après la connexion d'un utilisateur, un fournisseur d'identité émet un jeton de sécurité que les applications acceptent comme preuve de la connexion. Parmi ses revendications, le jeton porte une heure d'expiration.

        Pourquoi ces jetons ont-ils une durée limitée ?
    body:
      options:
        - { id: a, text: { en: "To make users enter their credentials in each application", fr: "Pour obliger les utilisateurs à saisir leurs informations d'identification dans chaque application" } }
        - { id: b, text: { en: "To let each application check the user's password again", fr: "Pour permettre à chaque application de vérifier à nouveau le mot de passe de l'utilisateur" } }
        - { id: c, text: { en: "To keep a stolen token from being usable indefinitely", fr: "Pour empêcher qu'un jeton volé reste utilisable indéfiniment" } }
        - { id: d, text: { en: "To prevent the user from signing in on a second device", fr: "Pour empêcher l'utilisateur de se connecter sur un second appareil" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A token is accepted as proof by every application that trusts the identity provider. Limiting its lifetime means that an attacker who steals a token can only use it for a short time, after which a new sign-in is needed.
        fr: |
          Un jeton est accepté comme preuve par toutes les applications qui font confiance au fournisseur d'identité. Limiter sa durée de vie signifie qu'un attaquant qui vole un jeton ne peut l'utiliser que peu de temps, après quoi une nouvelle connexion est nécessaire.
      options:
        a: { en: "With single sign-on, users sign in once to the identity provider and then open each application without entering their credentials again.", fr: "Avec l'authentification unique, les utilisateurs se connectent une fois au fournisseur d'identité, puis ouvrent chaque application sans ressaisir leurs informations d'identification." }
        b: { en: "With modern authentication, applications never check passwords themselves: the identity provider does, then issues the token.", fr: "Avec l'authentification moderne, les applications ne vérifient jamais elles-mêmes les mots de passe : c'est le fournisseur d'identité qui le fait, puis émet le jeton." }
        d: { en: "The expiration time limits how long a token stays valid; it doesn't restrict the number of devices from which the user signs in.", fr: "L'heure d'expiration limite la durée de validité d'un jeton ; elle ne restreint pas le nombre d'appareils à partir desquels l'utilisateur se connecte." }
    references:
      - title: Describe the role of the identity provider
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/4-describe-role-identity-provider

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-12-04
    objective: "1.2.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware runs an Active Directory Domain Services (AD DS) domain on servers in its datacenter. Its employees now use more and more cloud applications from laptops, tablets and phones of different brands. Before it decides how to support them, the IT team compares AD DS with Microsoft Entra ID.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware exploite un domaine Active Directory Domain Services (AD DS) sur des serveurs de son centre de données. Ses employés utilisent désormais de plus en plus d'applications cloud depuis des ordinateurs portables, des tablettes et des téléphones de différentes marques. Avant de décider comment les prendre en charge, l'équipe informatique compare AD DS avec Microsoft Entra ID.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "AD DS authenticates users to on-premises applications by using OpenID Connect and OAuth 2.0."
            fr: "AD DS authentifie les utilisateurs auprès des applications locales à l'aide d'OpenID Connect et d'OAuth 2.0."
        - id: s2
          text:
            en: "Microsoft Entra ID can manage identities for devices that run operating systems other than Windows."
            fr: "Microsoft Entra ID peut gérer les identités d'appareils qui exécutent d'autres systèmes d'exploitation que Windows."
        - id: s3
          text:
            en: "To use Microsoft Entra ID, Litware must deploy and maintain domain controllers in the cloud."
            fr: "Pour utiliser Microsoft Entra ID, Litware doit déployer et maintenir des contrôleurs de domaine dans le cloud."
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          AD DS authenticates users to on-premises applications with Kerberos and NTLM; modern protocols such as OpenID Connect and OAuth 2.0 are those of Microsoft Entra ID. Microsoft Entra ID is designed for the internet and works across platforms and device types. It is identity as a service: Microsoft runs the infrastructure, and there are no domain controllers for the customer to deploy.
        fr: |
          AD DS authentifie les utilisateurs auprès des applications locales avec Kerberos et NTLM ; les protocoles modernes comme OpenID Connect et OAuth 2.0 sont ceux de Microsoft Entra ID. Microsoft Entra ID est conçu pour Internet et fonctionne sur toutes les plateformes et tous les types d'appareils. C'est une identité en tant que service : Microsoft exploite l'infrastructure, et le client n'a aucun contrôleur de domaine à déployer.
    references:
      - title: Describe the concept of directory services and Active Directory
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/5-describe-concept-of-directory-services-active-directory

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-12-05
    objective: "1.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has configured its identity provider to trust the identity provider of Fabrikam, so Fabrikam employees already open Contoso's project portal with their Fabrikam credentials. Contoso employees must now open Fabrikam's supplier portal with their Contoso credentials, without receiving a second account.

        What should be configured?
      fr: |
        Contoso a configuré son fournisseur d'identité pour qu'il fasse confiance au fournisseur d'identité de Fabrikam : les employés de Fabrikam ouvrent donc déjà le portail de projets de Contoso avec leurs informations d'identification Fabrikam. Les employés de Contoso doivent maintenant ouvrir le portail fournisseurs de Fabrikam avec leurs informations d'identification Contoso, sans recevoir de second compte.

        Que faut-il configurer ?
    body:
      options:
        - { id: a, text: { en: "Nothing more, because the existing trust works in both directions", fr: "Rien de plus, car l'approbation existante fonctionne dans les deux sens" } }
        - { id: b, text: { en: "Contoso's identity provider, so that it trusts Fabrikam's identity provider", fr: "Le fournisseur d'identité de Contoso, pour qu'il fasse confiance à celui de Fabrikam" } }
        - { id: c, text: { en: "Fabrikam's identity provider, so that it trusts Contoso's identity provider", fr: "Le fournisseur d'identité de Fabrikam, pour qu'il fasse confiance à celui de Contoso" } }
        - { id: d, text: { en: "An account in Fabrikam's directory for each employee of Contoso", fr: "Un compte dans l'annuaire de Fabrikam pour chaque employé de Contoso" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A federation trust isn't automatically bidirectional. The existing trust lets Contoso accept the authentications performed by Fabrikam's identity provider. For Fabrikam to accept the authentications performed by Contoso's identity provider, Fabrikam's identity provider must be configured to trust Contoso's as well.
        fr: |
          Une approbation de fédération n'est pas automatiquement bidirectionnelle. L'approbation existante permet à Contoso d'accepter les authentifications effectuées par le fournisseur d'identité de Fabrikam. Pour que Fabrikam accepte les authentifications effectuées par le fournisseur d'identité de Contoso, le fournisseur d'identité de Fabrikam doit à son tour être configuré pour faire confiance à celui de Contoso.
      options:
        a: { en: "If A trusts B, B doesn't trust A unless that trust is configured too.", fr: "Si A fait confiance à B, B ne fait pas confiance à A tant que cette approbation n'est pas configurée aussi." }
        b: { en: "This trust already exists: it is the one that lets Fabrikam employees open Contoso's portal, not the reverse.", fr: "Cette approbation existe déjà : c'est elle qui permet aux employés de Fabrikam d'ouvrir le portail de Contoso, pas l'inverse." }
        d: { en: "Separate accounts in Fabrikam's directory are exactly the second accounts that the requirement excludes.", fr: "Des comptes distincts dans l'annuaire de Fabrikam sont justement les seconds comptes que l'exigence exclut." }
    references:
      - title: Describe the concept of federation
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/6-describe-concept-federation

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-12-06
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Before it enforces multifactor authentication for every employee, Woodgrove Bank reviews the sign-in methods in use at its branches today. The security team classifies each method by the category of authentication factor it relies on: something you know, something you have or something you are.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Avant d'imposer l'authentification multifacteur à tous ses employés, Woodgrove Bank passe en revue les méthodes de connexion utilisées aujourd'hui dans ses agences. L'équipe de sécurité classe chaque méthode selon la catégorie de facteur d'authentification sur laquelle elle repose : quelque chose que vous savez, que vous possédez ou que vous êtes.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The answer to a security question, such as the name of a first pet, is something you [[f1]].

          A one-time code generated by an authenticator app on the employee's registered phone proves something you [[f2]].

          A smart card that the employee inserts and then unlocks with a PIN [[f3]].
        fr: |
          La réponse à une question de sécurité, comme le nom d'un premier animal de compagnie, est quelque chose que vous [[f1]].

          Un code à usage unique généré par une application d'authentification sur le téléphone inscrit de l'employé prouve quelque chose que vous [[f2]].

          Une carte à puce que l'employé insère puis déverrouille avec un code PIN [[f3]].
      slots:
        - id: f1
          options:
            - { id: know, text: { en: "know", fr: "savez" } }
            - { id: have, text: { en: "have", fr: "possédez" } }
            - { id: are, text: { en: "are", fr: "êtes" } }
        - id: f2
          options:
            - { id: know, text: { en: "know", fr: "savez" } }
            - { id: have, text: { en: "have", fr: "possédez" } }
            - { id: are, text: { en: "are", fr: "êtes" } }
        - id: f3
          options:
            - { id: mfa, text: { en: "is multifactor authentication, because it combines two categories of factors", fr: "est une authentification multifacteur, car elle combine deux catégories de facteurs" } }
            - { id: oneobj, text: { en: "isn't multifactor authentication, because the employee presents a single object", fr: "n'est pas une authentification multifacteur, car l'employé présente un seul objet" } }
            - { id: samecat, text: { en: "isn't multifactor authentication, because the PIN and the card are the same category", fr: "n'est pas une authentification multifacteur, car le code PIN et la carte sont de la même catégorie" } }
    answer:
      values: { f1: know, f2: have, f3: mfa }
    explanation:
      correct:
        en: |
          A security question is a secret that the user remembers, like a password or a PIN: something you know. A one-time code generated on the registered phone proves that the employee holds that phone, which is something you have, even though the code is typed. A smart card is something you have and its PIN is something you know: two different categories, which is multifactor authentication.
        fr: |
          Une question de sécurité est un secret que l'utilisateur mémorise, comme un mot de passe ou un code PIN : quelque chose que vous savez. Un code à usage unique généré sur le téléphone inscrit prouve que l'employé détient ce téléphone, c'est-à-dire quelque chose que vous possédez, même si le code est saisi au clavier. Une carte à puce est quelque chose que vous possédez et son code PIN quelque chose que vous savez : deux catégories différentes, soit une authentification multifacteur.
      options:
        oneobj: { en: "What counts is the number of factor categories, not the number of objects: the card and the PIN are two factors.", fr: "Ce qui compte est le nombre de catégories de facteurs, pas le nombre d'objets : la carte et le code PIN sont deux facteurs." }
        samecat: { en: "The card is something you have and the PIN something you know: they belong to different categories.", fr: "La carte est quelque chose que vous possédez et le code PIN quelque chose que vous savez : ils appartiennent à des catégories différentes." }
    references:
      - title: Define authentication and authorization
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/2-define-authentication-authorization

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-12-07
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum replaces the sign-in code of its applications with a central identity provider. The architects compare the protocols that the identity provider supports for authentication and authorization.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum remplace le code de connexion de ses applications par un fournisseur d'identité central. Les architectes comparent les protocoles que le fournisseur d'identité prend en charge pour l'authentification et l'autorisation.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "OAuth 2.0 is mainly used to prove the identity of the user to the application.", fr: "OAuth 2.0 sert principalement à prouver l'identité de l'utilisateur auprès de l'application." } }
        - { id: b, text: { en: "OpenID Connect is built on top of OAuth 2.0 and adds the authentication of the user.", fr: "OpenID Connect est construit au-dessus d'OAuth 2.0 et y ajoute l'authentification de l'utilisateur." } }
        - { id: c, text: { en: "SAML is the protocol designed for the authentication of modern mobile applications.", fr: "SAML est le protocole conçu pour l'authentification des applications mobiles modernes." } }
        - { id: d, text: { en: "OAuth 2.0 lets an application obtain access tokens to call an API on behalf of a user.", fr: "OAuth 2.0 permet à une application d'obtenir des jetons d'accès pour appeler une API pour le compte d'un utilisateur." } }
        - { id: e, text: { en: "An access token obtained through OAuth 2.0 proves to the application that the user signed in.", fr: "Un jeton d'accès obtenu par OAuth 2.0 prouve à l'application que l'utilisateur s'est connecté." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          OpenID Connect handles authentication for modern cloud and mobile applications, and it is built on top of OAuth 2.0. OAuth 2.0 handles authorization: it lets an application obtain access tokens to reach protected resources, such as an API, on the user's behalf.
        fr: |
          OpenID Connect gère l'authentification des applications cloud et mobiles modernes, et il est construit au-dessus d'OAuth 2.0. OAuth 2.0 gère l'autorisation : il permet à une application d'obtenir des jetons d'accès pour atteindre des ressources protégées, comme une API, pour le compte de l'utilisateur.
      options:
        a: { en: "OAuth 2.0 is an authorization protocol; proving who the user is falls to OpenID Connect, which is built on it.", fr: "OAuth 2.0 est un protocole d'autorisation ; prouver qui est l'utilisateur revient à OpenID Connect, construit au-dessus." }
        c: { en: "SAML is common in enterprises, for older applications and federation between organizations; OpenID Connect is the protocol of modern cloud and mobile applications.", fr: "SAML est courant en entreprise, pour les applications plus anciennes et la fédération entre organisations ; OpenID Connect est le protocole des applications cloud et mobiles modernes." }
        e: { en: "Proof that the user signed in is the role of the ID token; an access token grants access to a resource on the user's behalf.", fr: "La preuve que l'utilisateur s'est connecté est le rôle du jeton d'ID ; un jeton d'accès donne accès à une ressource pour le compte de l'utilisateur." }
    references:
      - title: Describe the role of the identity provider
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/4-describe-role-identity-provider

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-12-08
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        The identity team of Proseware lists four of its recurring tasks. Match each task to the pillar of the identity infrastructure to which it belongs.

        To answer, drag the appropriate pillar to each task. Each pillar may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe d'identité de Proseware liste quatre de ses tâches récurrentes. Associez chaque tâche au pilier de l'infrastructure d'identité dont elle relève.

        Pour répondre, faites glisser le pilier approprié vers chaque tâche. Chaque pilier peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: admin, text: { en: "Administration", fr: "Administration" } }
        - { id: authn, text: { en: "Authentication", fr: "Authentification" } }
        - { id: authz, text: { en: "Authorization", fr: "Autorisation" } }
        - { id: audit, text: { en: "Auditing", fr: "Audit" } }
      targets:
        - id: t1
          text: { en: "Create the account of a new contractor and give it the roles of the position", fr: "Créer le compte d'un nouveau sous-traitant et lui donner les rôles du poste" }
        - id: t2
          text: { en: "Challenge a user for a second factor before the sign-in is accepted", fr: "Demander un second facteur à un utilisateur avant que la connexion soit acceptée" }
        - id: t3
          text: { en: "Analyze the sign-in logs to find which accounts an attacker used and what was accessed", fr: "Analyser les journaux de connexion pour savoir quels comptes un attaquant a utilisés et à quoi il a accédé" }
        - id: t4
          text: { en: "Update the group memberships of an employee who moves to another department", fr: "Mettre à jour les appartenances aux groupes d'un employé qui change de service" }
    answer:
      mapping: { t1: admin, t2: authn, t3: audit, t4: admin }
    explanation:
      correct:
        en: |
          Administration covers the lifecycle of identities: provisioning a new account with the roles of its position and updating it when the role changes are both administration tasks. Challenging the user for credentials before accepting the sign-in is authentication. Tracking who did what, when and from where, including to scope a breach from the sign-in logs, is auditing.
        fr: |
          L'administration couvre le cycle de vie des identités : provisionner un nouveau compte avec les rôles de son poste et le mettre à jour quand le rôle change sont deux tâches d'administration. Demander des informations d'identification à l'utilisateur avant d'accepter la connexion relève de l'authentification. Suivre qui a fait quoi, quand et d'où, y compris pour délimiter une violation à partir des journaux de connexion, relève de l'audit.
      options:
        authz: { en: "Authorization evaluates the permissions and the context of a request when access is attempted; assigning roles and group memberships in advance is part of administering the identity.", fr: "L'autorisation évalue les autorisations et le contexte d'une demande au moment de l'accès ; attribuer à l'avance des rôles et des appartenances aux groupes fait partie de l'administration de l'identité." }
    references:
      - title: Define identity as the primary security perimeter
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/3-define-identity-primary-security-perimeter

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-12-09
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys is moving all its servers to the cloud and plans to retire its on-premises Active Directory Domain Services (AD DS) domain. Microsoft Entra ID will be its only identity service. The administrators list the capabilities that they use today or will need.

        Which capability does Microsoft Entra ID provide natively?
      fr: |
        Tailspin Toys migre tous ses serveurs vers le cloud et prévoit de mettre hors service son domaine Active Directory Domain Services (AD DS) local. Microsoft Entra ID sera son seul service d'identité. Les administrateurs listent les fonctionnalités qu'ils utilisent aujourd'hui ou dont ils auront besoin.

        Quelle fonctionnalité Microsoft Entra ID fournit-il nativement ?
    body:
      options:
        - { id: a, text: { en: "Organizing users and computers into organizational units (OUs)", fr: "Organiser les utilisateurs et les ordinateurs en unités d'organisation (UO)" } }
        - { id: b, text: { en: "Applying Group Policy objects (GPOs) to the Windows computers", fr: "Appliquer des objets de stratégie de groupe (GPO) aux ordinateurs Windows" } }
        - { id: c, text: { en: "Authenticating users to applications by using the NTLM protocol", fr: "Authentifier les utilisateurs auprès des applications avec le protocole NTLM" } }
        - { id: d, text: { en: "Signing users in to SaaS applications by using OpenID Connect", fr: "Connecter les utilisateurs aux applications SaaS avec OpenID Connect" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Microsoft Entra ID is a cloud identity service built on modern protocols, such as OpenID Connect, OAuth 2.0 and SAML, and it integrates natively with SaaS applications. It isn't AD DS hosted in the cloud: the domain-based concepts of AD DS don't carry over to it.
        fr: |
          Microsoft Entra ID est un service d'identité cloud fondé sur des protocoles modernes, comme OpenID Connect, OAuth 2.0 et SAML, et il s'intègre nativement aux applications SaaS. Ce n'est pas AD DS hébergé dans le cloud : les concepts d'AD DS liés au domaine ne s'y transposent pas.
      options:
        a: { en: "Organizational units are an AD DS concept; Microsoft Entra ID has no organizational units.", fr: "Les unités d'organisation sont un concept d'AD DS ; Microsoft Entra ID n'a pas d'unités d'organisation." }
        b: { en: "Group Policy applies to Windows devices joined to an AD DS domain; Microsoft Entra ID has no Group Policy.", fr: "La stratégie de groupe s'applique aux appareils Windows joints à un domaine AD DS ; Microsoft Entra ID n'a pas de stratégie de groupe." }
        c: { en: "NTLM and Kerberos are the authentication protocols of AD DS on on-premises networks, not the modern protocols of Microsoft Entra ID.", fr: "NTLM et Kerberos sont les protocoles d'authentification d'AD DS sur les réseaux locaux, pas les protocoles modernes de Microsoft Entra ID." }
    references:
      - title: Describe the concept of directory services and Active Directory
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/5-describe-concept-of-directory-services-active-directory

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-12-10
    objective: "1.2.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders uses its identity provider for single sign-on to all its internal applications. Northwind has also set up federation with a partner, Contoso: Northwind's identity provider accepts the authentications performed by Contoso's identity provider, and Contoso employees open Northwind's project portal with their Contoso credentials.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders utilise son fournisseur d'identité pour l'authentification unique à toutes ses applications internes. Northwind a aussi mis en place une fédération avec un partenaire, Contoso : le fournisseur d'identité de Northwind accepte les authentifications effectuées par celui de Contoso, et les employés de Contoso ouvrent le portail de projets de Northwind avec leurs informations d'identification Contoso.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The single sign-on of Northwind employees to Northwind's internal applications relies on the trust with Contoso's identity provider."
            fr: "L'authentification unique des employés de Northwind aux applications internes de Northwind repose sur l'approbation avec le fournisseur d'identité de Contoso."
        - id: s2
          text:
            en: "After Contoso disables an employee's account in its own identity provider, that employee can no longer sign in to Northwind's project portal."
            fr: "Une fois que Contoso a désactivé le compte d'un employé dans son propre fournisseur d'identité, cet employé ne peut plus se connecter au portail de projets de Northwind."
        - id: s3
          text:
            en: "Because of the trust, a Contoso employee who authenticates successfully can access every Northwind resource."
            fr: "Grâce à l'approbation, un employé de Contoso qui s'authentifie avec succès peut accéder à toutes les ressources de Northwind."
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Single sign-on works inside one identity provider: Northwind employees rely only on Northwind's identity provider, whatever trusts it has with others. With federation, Contoso employees authenticate with Contoso's identity provider, so an account disabled there can no longer produce the authentication that Northwind accepts. The trust covers authentication only: what each Contoso employee may do in Northwind's environment is still decided by authorization.
        fr: |
          L'authentification unique fonctionne au sein d'un seul fournisseur d'identité : les employés de Northwind ne dépendent que du fournisseur d'identité de Northwind, quelles que soient ses approbations avec d'autres. Avec la fédération, les employés de Contoso s'authentifient auprès du fournisseur d'identité de Contoso : un compte désactivé là-bas ne peut plus produire l'authentification que Northwind accepte. L'approbation ne couvre que l'authentification : ce que chaque employé de Contoso peut faire dans l'environnement de Northwind reste décidé par l'autorisation.
    references:
      - title: Describe the concept of federation
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/6-describe-concept-federation
      - title: Describe the role of the identity provider
        url: https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/4-describe-role-identity-provider
