chapter: 22-authentication
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-22-01
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Microsoft Entra tenant in the Azure public cloud and uses smart lockout with its default settings.

        What does smart lockout do by default when someone keeps entering wrong passwords for a user account?
      fr: |
        Contoso dispose d'un locataire Microsoft Entra dans le cloud public Azure et utilise le verrouillage intelligent avec ses paramètres par défaut.

        Que fait le verrouillage intelligent par défaut lorsque quelqu'un saisit sans cesse de mauvais mots de passe pour un compte d'utilisateur ?
    body:
      options:
        - { id: a, text: { en: "It locks the account for 30 minutes after 3 failed attempts.", fr: "Il verrouille le compte 30 minutes après 3 tentatives infructueuses." } }
        - { id: b, text: { en: "It locks the account for one minute after 10 failed attempts.", fr: "Il verrouille le compte une minute après 10 tentatives infructueuses." } }
        - { id: c, text: { en: "It locks the account until an administrator unlocks it, after 5 failed attempts.", fr: "Il verrouille le compte jusqu'à ce qu'un administrateur le déverrouille, après 5 tentatives infructueuses." } }
        - { id: d, text: { en: "It locks the account for 24 hours after 10 failed attempts.", fr: "Il verrouille le compte 24 heures après 10 tentatives infructueuses." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Smart lockout is always on. By default, in Azure public cloud tenants, it locks the account for one minute after 10 failed attempts. The genuine user can sign in again quickly, while an attacker who guesses passwords is slowed down.
        fr: |
          Le verrouillage intelligent est toujours actif. Par défaut, dans les locataires du cloud public Azure, il verrouille le compte une minute après 10 tentatives infructueuses. Le véritable utilisateur peut vite se reconnecter, tandis qu'un attaquant qui devine des mots de passe est ralenti.
      options:
        a: { en: "Three attempts is the default threshold of Azure US Government tenants, and the first lockout lasts one minute, not 30.", fr: "Trois tentatives est le seuil par défaut des locataires Azure US Government, et le premier verrouillage dure une minute, pas 30." }
        c: { en: "Smart lockout locks the account temporarily and unlocks it automatically; no administrator action is needed.", fr: "Le verrouillage intelligent verrouille le compte temporairement et le déverrouille automatiquement ; aucune action d'un administrateur n'est nécessaire." }
        d: { en: "The threshold of 10 attempts is right, but the default lockout lasts one minute, not 24 hours.", fr: "Le seuil de 10 tentatives est juste, mais le verrouillage par défaut dure une minute, pas 24 heures." }
    references:
      - title: Protect user accounts from attacks with Microsoft Entra smart lockout
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-smart-lockout

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-22-02
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An employee of Fabrikam signs in to a Windows 11 laptop by using Windows Hello for Business and a PIN.

        Which element provides the "something you have" factor of this sign-in?
      fr: |
        Un employé de Fabrikam se connecte à un ordinateur portable Windows 11 en utilisant Windows Hello Entreprise et un code PIN.

        Quel élément fournit le facteur « quelque chose que vous possédez » de cette connexion ?
    body:
      options:
        - { id: a, text: { en: "The PIN, which never leaves the laptop", fr: "Le code PIN, qui ne quitte jamais l'ordinateur portable" } }
        - { id: b, text: { en: "The private key, protected by the laptop's security module", fr: "La clé privée, protégée par le module de sécurité de l'ordinateur portable" } }
        - { id: c, text: { en: "The account password, stored in Microsoft Entra ID", fr: "Le mot de passe du compte, stocké dans Microsoft Entra ID" } }
        - { id: d, text: { en: "The employee's face, recognized by the laptop's camera", fr: "Le visage de l'employé, reconnu par la caméra de l'ordinateur portable" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Windows Hello for Business combines a credential tied to the device with a gesture. The private key, protected by the security module of the laptop, is something you have; the PIN that unlocks it is something you know, and biometrics would replace it with something you are.
        fr: |
          Windows Hello Entreprise combine une information d'identification liée à l'appareil avec un geste. La clé privée, protégée par le module de sécurité de l'ordinateur portable, est quelque chose que vous possédez ; le code PIN qui la déverrouille est quelque chose que vous savez, et la biométrie le remplacerait par quelque chose que vous êtes.
      options:
        a: { en: "The PIN is something you know, even though it stays on the device.", fr: "Le code PIN est quelque chose que vous savez, même s'il reste sur l'appareil." }
        c: { en: "Windows Hello for Business replaces the password, and a password is something you know.", fr: "Windows Hello Entreprise remplace le mot de passe, et un mot de passe est quelque chose que vous savez." }
        d: { en: "Facial recognition is something you are, and in this sign-in the employee uses a PIN, not biometrics.", fr: "La reconnaissance du visage est quelque chose que vous êtes, et dans cette connexion l'employé utilise un code PIN, pas la biométrie." }
    references:
      - title: Windows Hello for Business overview
        url: https://learn.microsoft.com/en-us/windows/security/identity-protection/hello-for-business/
      - title: Describe authentication methods
        url: https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/2-describe-authentication-methods

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-22-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Security defaults are enabled in the Microsoft Entra tenant of Adatum. A sales employee who holds no administrator role has registered Microsoft Authenticator, and signs in to Microsoft 365 and Microsoft Teams every day.

        When do security defaults require this employee to perform multifactor authentication?
      fr: |
        Les paramètres de sécurité par défaut sont activés dans le locataire Microsoft Entra d'Adatum. Une commerciale qui ne détient aucun rôle d'administrateur a inscrit Microsoft Authenticator et se connecte chaque jour à Microsoft 365 et à Microsoft Teams.

        Quand les paramètres de sécurité par défaut exigent-ils de cette employée une authentification multifacteur ?
    body:
      options:
        - { id: a, text: { en: "At every sign-in, like the users who hold an administrator role", fr: "À chaque connexion, comme les utilisateurs qui détiennent un rôle d'administrateur" } }
        - { id: b, text: { en: "Never, because security defaults only protect the administrator accounts", fr: "Jamais, car les paramètres de sécurité par défaut ne protègent que les comptes d'administrateur" } }
        - { id: c, text: { en: "Only when the password of the employee expires or is reset", fr: "Uniquement quand le mot de passe de l'employée expire ou est réinitialisé" } }
        - { id: d, text: { en: "When Microsoft judges it necessary, based on factors such as location", fr: "Quand Microsoft le juge nécessaire, selon des facteurs comme l'emplacement" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Security defaults require administrators to do multifactor authentication at every sign-in, but require other users to do it only when necessary. Microsoft decides when to prompt, based on factors such as location, device, role and task; accessing a privileged resource such as the Azure portal also triggers it.
        fr: |
          Les paramètres de sécurité par défaut exigent des administrateurs l'authentification multifacteur à chaque connexion, mais ne l'exigent des autres utilisateurs que lorsque c'est nécessaire. Microsoft décide quand la demander, selon des facteurs comme l'emplacement, l'appareil, le rôle et la tâche ; l'accès à une ressource privilégiée comme le portail Azure la déclenche aussi.
      options:
        a: { en: "MFA at every sign-in applies to the users who hold the administrator roles listed by security defaults, not to all users.", fr: "La MFA à chaque connexion s'applique aux utilisateurs qui détiennent les rôles d'administrateur listés par les paramètres de sécurité par défaut, pas à tous les utilisateurs." }
        b: { en: "Security defaults protect all users: everyone must register for MFA, and users are prompted when necessary.", fr: "Les paramètres de sécurité par défaut protègent tous les utilisateurs : chacun doit s'inscrire à la MFA, et les utilisateurs sont sollicités quand c'est nécessaire." }
        c: { en: "Security defaults don't tie MFA to password expiration or reset; prompts depend on the risk of the sign-in.", fr: "Les paramètres de sécurité par défaut ne lient pas la MFA à l'expiration ou à la réinitialisation du mot de passe ; les demandes dépendent du risque de la connexion." }
    references:
      - title: Security defaults in Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-22-04
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has Microsoft Entra ID P1 licenses and only cloud user accounts, with no on-premises directory. A custom banned password list contains the name of the company and the names of its products. Self-service password reset (SSPR) is enabled for all the users, and smart lockout uses its default settings.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose de licences Microsoft Entra ID P1 et uniquement de comptes d'utilisateur cloud, sans annuaire local. Une liste personnalisée de mots de passe interdits contient le nom de l'entreprise et les noms de ses produits. La réinitialisation de mot de passe en libre-service (SSPR) est activée pour tous les utilisateurs, et le verrouillage intelligent utilise ses paramètres par défaut.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When a user resets a forgotten password with SSPR, the new password is checked against the global and the custom banned password lists.", fr: "Quand un utilisateur réinitialise un mot de passe oublié avec SSPR, le nouveau mot de passe est comparé à la liste globale et à la liste personnalisée de mots de passe interdits." }
        - id: s2
          text: { en: "Northwind Traders could keep using the custom banned password list if it had only Microsoft Entra ID Free licenses.", fr: "Northwind Traders pourrait continuer à utiliser la liste personnalisée de mots de passe interdits si elle n'avait que des licences Microsoft Entra ID Free." }
        - id: s3
          text: { en: "After a first lockout, an attacker who keeps entering wrong passwords for the same account is locked out for longer periods.", fr: "Après un premier verrouillage, un attaquant qui continue à saisir de mauvais mots de passe pour le même compte est verrouillé pendant des durées plus longues." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Microsoft Entra Password Protection checks a password each time it's changed or reset, so a password chosen during SSPR is compared with the global list combined with the custom list. For cloud-only users, the global list works with the Free edition, but the custom list requires Microsoft Entra ID P1 or P2. Smart lockout locks the account for one minute at first, then for longer periods if the failed attempts continue.
        fr: |
          La protection par mot de passe Microsoft Entra vérifie un mot de passe à chaque changement ou réinitialisation : un mot de passe choisi pendant une SSPR est donc comparé à la liste globale combinée avec la liste personnalisée. Pour des utilisateurs cloud uniquement, la liste globale fonctionne avec l'édition Free, mais la liste personnalisée demande Microsoft Entra ID P1 ou P2. Le verrouillage intelligent verrouille d'abord le compte une minute, puis plus longtemps si les tentatives infructueuses continuent.
      options:
        s2: { en: "The custom banned password list requires Microsoft Entra ID P1 or P2; with Free licenses only the global list applies.", fr: "La liste personnalisée de mots de passe interdits demande Microsoft Entra ID P1 ou P2 ; avec des licences Free, seule la liste globale s'applique." }
    references:
      - title: Eliminate bad passwords using Microsoft Entra Password Protection
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad
      - title: Protect user accounts from attacks with Microsoft Entra smart lockout
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-smart-lockout

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-22-05
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The designers of Wingtip Toys work on Mac computers that the company manages. Wingtip Toys wants them to sign in to Microsoft Entra ID with a phishing-resistant credential that is bound to their Mac.

        Which authentication method should Wingtip Toys use?
      fr: |
        Les graphistes de Wingtip Toys travaillent sur des ordinateurs Mac gérés par l'entreprise. Wingtip Toys veut qu'ils se connectent à Microsoft Entra ID avec une information d'identification résistante au hameçonnage et liée à leur Mac.

        Quelle méthode d'authentification Wingtip Toys doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
        - { id: b, text: { en: "Microsoft Authenticator push notifications with number matching", fr: "Les notifications Push de Microsoft Authenticator avec correspondance de numéro" } }
        - { id: c, text: { en: "Platform Credential for macOS", fr: "Platform Credential for macOS" } }
        - { id: d, text: { en: "SMS sign-in", fr: "La connexion par SMS" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Platform Credential for macOS provisions a hardware-bound cryptographic key in the secure enclave of the Mac and is listed by Microsoft among the phishing-resistant methods, with Windows Hello for Business, passkeys and certificate-based authentication.
        fr: |
          Platform Credential for macOS crée une clé de chiffrement liée au matériel dans l'enclave sécurisée du Mac, et Microsoft le range parmi les méthodes résistantes au hameçonnage, avec Windows Hello Entreprise, les clés d'accès et l'authentification basée sur un certificat.
      options:
        a: { en: "Windows Hello for Business is phishing-resistant, but it's the method of Windows devices, not of Macs.", fr: "Windows Hello Entreprise résiste au hameçonnage, mais c'est la méthode des appareils Windows, pas des Mac." }
        b: { en: "Number matching defeats MFA fatigue, but a push notification isn't a phishing-resistant method, and it isn't bound to the Mac.", fr: "La correspondance de numéro met en échec la fatigue MFA, mais une notification Push n'est pas une méthode résistante au hameçonnage, et elle n'est pas liée au Mac." }
        d: { en: "SMS codes can be phished, and Microsoft recommends moving away from them.", fr: "Les codes SMS peuvent être hameçonnés, et Microsoft recommande de les abandonner." }
    references:
      - title: Microsoft Entra authentication overview
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-methods
      - title: macOS Platform Single Sign-on overview
        url: https://learn.microsoft.com/en-us/entra/identity/devices/macos-psso

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-22-06
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso wants each employee to register one authentication method, other than a password, that can be used both as the second factor of multifactor authentication and to verify the employee's identity during self-service password reset (SSPR).

        Which two methods meet the requirement? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso veut que chaque employé inscrive une méthode d'authentification, autre qu'un mot de passe, utilisable à la fois comme second facteur de l'authentification multifacteur et pour vérifier l'identité de l'employé pendant une réinitialisation de mot de passe en libre-service (SSPR).

        Quelles sont les deux méthodes qui répondent à l'exigence ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Passkey (FIDO2)", fr: "Clé d'accès (FIDO2)" } }
        - { id: b, text: { en: "Voice call", fr: "Appel vocal" } }
        - { id: c, text: { en: "Temporary Access Pass", fr: "Passe d'accès temporaire" } }
        - { id: d, text: { en: "Software OATH token", fr: "Jeton OATH logiciel" } }
        - { id: e, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
        - { id: f, text: { en: "Email one-time passcode", fr: "Code secret à usage unique par e-mail" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A voice call and a software OATH token can't be the primary sign-in, but they can complete MFA and they can verify a user during SSPR. The other methods each lack one of the two uses.
        fr: |
          Un appel vocal et un jeton OATH logiciel ne peuvent pas servir de connexion principale, mais ils peuvent compléter la MFA et vérifier un utilisateur pendant une SSPR. Il manque à chacune des autres méthodes l'un des deux usages.
      options:
        a: { en: "A passkey can sign in and satisfy MFA, but it can't be used to verify a user for SSPR.", fr: "Une clé d'accès peut servir à se connecter et satisfaire la MFA, mais elle ne permet pas de vérifier un utilisateur pour SSPR." }
        c: { en: "A Temporary Access Pass is a time-limited passcode for onboarding and recovery; it can satisfy MFA but isn't an SSPR method.", fr: "Un passe d'accès temporaire est un code secret à durée limitée pour l'intégration et la récupération ; il peut satisfaire la MFA, mais ce n'est pas une méthode SSPR." }
        e: { en: "Windows Hello for Business is a sign-in method tied to a device; it can't verify a user for SSPR.", fr: "Windows Hello Entreprise est une méthode de connexion liée à un appareil ; il ne permet pas de vérifier un utilisateur pour SSPR." }
        f: { en: "For tenant members, an email one-time passcode can only be used for SSPR, not for MFA.", fr: "Pour les membres du locataire, un code secret à usage unique par e-mail ne sert qu'à SSPR, pas à la MFA." }
    references:
      - title: Microsoft Entra authentication overview
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-methods
      - title: "How it works: Microsoft Entra self-service password reset"
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-22-07
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has Microsoft Entra ID Free licenses, and security defaults are enabled in its tenant. Adatum has a new requirement: the members of the Sales group must not be prompted for multifactor authentication when they sign in from the head office, and must be prompted everywhere else. The other users must keep at least the protection that they have today.

        What should Adatum do?
      fr: |
        Adatum dispose de licences Microsoft Entra ID Free, et les paramètres de sécurité par défaut sont activés dans son locataire. Adatum a une nouvelle exigence : les membres du groupe Sales ne doivent pas être invités à l'authentification multifacteur quand ils se connectent depuis le siège, et doivent l'être partout ailleurs. Les autres utilisateurs doivent conserver au moins la protection dont ils disposent aujourd'hui.

        Que doit faire Adatum ?
    body:
      options:
        - { id: a, text: { en: "Keep security defaults, and exclude the head office IP addresses from MFA for the Sales group.", fr: "Conserver les paramètres de sécurité par défaut, et exclure de la MFA les adresses IP du siège pour le groupe Sales." } }
        - { id: b, text: { en: "Acquire Microsoft Entra ID P1 licenses, create a Conditional Access policy for Sales, and keep security defaults for the others.", fr: "Acquérir des licences Microsoft Entra ID P1, créer une stratégie d'accès conditionnel pour Sales, et conserver les paramètres de sécurité par défaut pour les autres." } }
        - { id: c, text: { en: "Acquire Microsoft Entra ID P1 licenses, create Conditional Access policies for all users, then turn off security defaults.", fr: "Acquérir des licences Microsoft Entra ID P1, créer des stratégies d'accès conditionnel pour tous les utilisateurs, puis désactiver les paramètres de sécurité par défaut." } }
        - { id: d, text: { en: "Keep the Free licenses, and turn off number matching for the members of the Sales group at the head office.", fr: "Conserver les licences Free, et désactiver la correspondance de numéro pour les membres du groupe Sales au siège." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A requirement that depends on the group and the location needs Conditional Access, which requires Microsoft Entra ID P1. Security defaults and Conditional Access policies aren't used together: an organization that replaces security defaults with its own policies must turn security defaults off, so it must also create policies that keep protecting the other users.
        fr: |
          Une exigence qui dépend du groupe et de l'emplacement demande l'accès conditionnel, qui requiert Microsoft Entra ID P1. Les paramètres de sécurité par défaut et les stratégies d'accès conditionnel ne s'utilisent pas ensemble : une organisation qui remplace les paramètres de sécurité par défaut par ses propres stratégies doit les désactiver, et doit donc aussi créer des stratégies qui continuent à protéger les autres utilisateurs.
      options:
        a: { en: "Security defaults can't be customized: there are no exclusions by user, group or location.", fr: "Les paramètres de sécurité par défaut ne sont pas personnalisables : il n'y a pas d'exclusion par utilisateur, groupe ou emplacement." }
        b: { en: "Security defaults and Conditional Access policies can't be combined; security defaults must be turned off when Conditional Access replaces them.", fr: "Les paramètres de sécurité par défaut et les stratégies d'accès conditionnel ne se combinent pas ; il faut désactiver les paramètres de sécurité par défaut quand l'accès conditionnel les remplace." }
        d: { en: "Number matching only changes how a push notification is approved; it doesn't decide when MFA is required.", fr: "La correspondance de numéro ne change que la façon d'approuver une notification Push ; elle ne décide pas quand la MFA est exigée." }
    references:
      - title: Security defaults in Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
      - title: Microsoft Entra licensing
        url: https://learn.microsoft.com/en-us/entra/fundamentals/licensing

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-22-08
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank synchronizes its on-premises Active Directory Domain Services (AD DS) domain with Microsoft Entra ID and has Microsoft Entra ID P1 licenses. A custom banned password list blocks the name of the bank and the names of its products. The employees usually change their password on their domain-joined computers by pressing Ctrl+Alt+Del. An audit shows that these new passwords can contain banned terms.

        You need the banned password lists to apply to these password changes too. What should you do?
      fr: |
        Woodgrove Bank synchronise son domaine Active Directory Domain Services (AD DS) local avec Microsoft Entra ID et dispose de licences Microsoft Entra ID P1. Une liste personnalisée de mots de passe interdits bloque le nom de la banque et les noms de ses produits. Les employés changent habituellement leur mot de passe sur leurs ordinateurs joints au domaine, en appuyant sur Ctrl+Alt+Suppr. Un audit montre que ces nouveaux mots de passe peuvent contenir des termes interdits.

        Vous devez faire en sorte que les listes de mots de passe interdits s'appliquent aussi à ces changements de mot de passe. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable password writeback, so that the password changes go through Microsoft Entra ID.", fr: "Activer la réécriture du mot de passe, pour que les changements de mot de passe passent par Microsoft Entra ID." } }
        - { id: b, text: { en: "Enable password hash synchronization, so that the new passwords are evaluated in the cloud.", fr: "Activer la synchronisation de hachage du mot de passe, pour que les nouveaux mots de passe soient évalués dans le cloud." } }
        - { id: c, text: { en: "Lower the smart lockout threshold, so that the domain controllers reject the weak passwords.", fr: "Abaisser le seuil du verrouillage intelligent, pour que les contrôleurs de domaine rejettent les mots de passe faibles." } }
        - { id: d, text: { en: "Deploy Microsoft Entra Password Protection for AD DS, with its agent on the domain controllers.", fr: "Déployer la protection par mot de passe Microsoft Entra pour AD DS, avec son agent sur les contrôleurs de domaine." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A password changed with Ctrl+Alt+Del is processed by an on-premises domain controller, not by Microsoft Entra ID. Microsoft Entra Password Protection extends to AD DS through agents installed on the domain controllers, which check password changes and resets against the global and custom banned password lists.
        fr: |
          Un mot de passe changé avec Ctrl+Alt+Suppr est traité par un contrôleur de domaine local, pas par Microsoft Entra ID. La protection par mot de passe Microsoft Entra s'étend à AD DS grâce à des agents installés sur les contrôleurs de domaine, qui comparent les changements et les réinitialisations de mot de passe à la liste globale et à la liste personnalisée de mots de passe interdits.
      options:
        a: { en: "Password writeback works in the other direction: it writes passwords changed or reset in the cloud back to AD DS.", fr: "La réécriture du mot de passe fonctionne dans l'autre sens : elle réécrit dans AD DS les mots de passe changés ou réinitialisés dans le cloud." }
        b: { en: "Password hash synchronization copies a hash after the change has been accepted on-premises; it doesn't reject a password.", fr: "La synchronisation de hachage du mot de passe copie un hachage une fois le changement accepté en local ; elle ne rejette aucun mot de passe." }
        c: { en: "Smart lockout counts failed sign-ins; it never evaluates the content of a new password.", fr: "Le verrouillage intelligent compte les connexions infructueuses ; il n'évalue jamais le contenu d'un nouveau mot de passe." }
    references:
      - title: Enforce on-premises Microsoft Entra Password Protection for Active Directory Domain Services
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad-on-premises
      - title: Eliminate bad passwords using Microsoft Entra Password Protection
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-password-ban-bad

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-22-09
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware requires multifactor authentication for all its users. Most users sign in with a password, then approve a Microsoft Authenticator push notification that uses number matching. The administrators sign in with a passkey (FIDO2) stored on a security key that they unlock with a PIN.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware exige l'authentification multifacteur pour tous ses utilisateurs. La plupart des utilisateurs se connectent avec un mot de passe, puis approuvent une notification Push de Microsoft Authenticator qui utilise la correspondance de numéro. Les administrateurs se connectent avec une clé d'accès (FIDO2) stockée sur une clé de sécurité qu'ils déverrouillent avec un code PIN.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Number matching makes the sign-in of most users phishing-resistant.", fr: "La correspondance de numéro rend la connexion de la plupart des utilisateurs résistante au hameçonnage." }
        - id: s2
          text: { en: "The sign-in of most users combines something they know with something they have.", fr: "La connexion de la plupart des utilisateurs combine quelque chose qu'ils savent avec quelque chose qu'ils possèdent." }
        - id: s3
          text: { en: "The administrators meet the MFA requirement even though they never type a password.", fr: "Les administrateurs satisfont l'exigence de MFA bien qu'ils ne saisissent jamais de mot de passe." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Number matching defeats MFA fatigue, where a user approves a prompt they didn't request, but a push notification doesn't bind the credential to the legitimate sign-in site, so it isn't phishing-resistant. A password (know) plus a registered phone (have) is MFA. A passkey on a security key unlocked with a PIN combines something you have and something you know: it's a passwordless method that satisfies MFA on its own.
        fr: |
          La correspondance de numéro met en échec la fatigue MFA, où un utilisateur approuve une demande qu'il n'a pas déclenchée, mais une notification Push ne lie pas l'information d'identification au site de connexion légitime : elle n'est donc pas résistante au hameçonnage. Un mot de passe (savoir) plus un téléphone inscrit (posséder) constituent une MFA. Une clé d'accès sur une clé de sécurité déverrouillée par un code PIN combine quelque chose que vous possédez et quelque chose que vous savez : c'est une méthode sans mot de passe qui satisfait à elle seule la MFA.
      options:
        s1: { en: "The phishing-resistant methods are Windows Hello for Business, passkeys, Platform Credential for macOS and certificate-based authentication; push notifications aren't among them.", fr: "Les méthodes résistantes au hameçonnage sont Windows Hello Entreprise, les clés d'accès, Platform Credential for macOS et l'authentification basée sur un certificat ; les notifications Push n'en font pas partie." }
    references:
      - title: Microsoft Entra authentication overview
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-methods
      - title: "How it works: Microsoft Entra multifactor authentication"
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mfa-howitworks

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-22-10
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Fabrikam enabled self-service password reset (SSPR) for all its users, with one method required, and allows every method that Microsoft Entra ID supports for SSPR. None of the four users below holds an administrator role. The table shows the methods that each user has, in addition to a password.

        Answer each prompt by selecting the appropriate user.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a activé la réinitialisation de mot de passe en libre-service (SSPR) pour tous ses utilisateurs, avec une méthode exigée, et autorise toutes les méthodes que Microsoft Entra ID prend en charge pour SSPR. Aucun des quatre utilisateurs ci-dessous ne détient de rôle d'administrateur. Le tableau indique les méthodes dont dispose chaque utilisateur, en plus d'un mot de passe.

        Répondez à chaque invite en sélectionnant l'utilisateur approprié.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - { id: p1, text: { en: "The only user who can reset a forgotten password with SSPR", fr: "Le seul utilisateur qui peut réinitialiser un mot de passe oublié avec SSPR" } }
        - { id: p2, text: { en: "The only user whose methods can neither complete MFA nor verify the user for SSPR", fr: "Le seul utilisateur dont les méthodes ne peuvent ni compléter la MFA ni le vérifier pour SSPR" } }
      grid:
        header:
          - { en: "User", fr: "Utilisateur" }
          - { en: "Methods in addition to the password", fr: "Méthodes en plus du mot de passe" }
        rows:
          - - { text: User1, area: user1 }
            - { text: { en: "Passkey (FIDO2) on a security key, Windows Hello for Business", fr: "Clé d'accès (FIDO2) sur une clé de sécurité, Windows Hello Entreprise" } }
          - - { text: User2, area: user2 }
            - { text: { en: "QR code with a PIN, on a shared store device", fr: "Code QR avec un code PIN, sur un appareil partagé du magasin" } }
          - - { text: User3, area: user3 }
            - { text: { en: "SMS on a mobile phone", fr: "SMS sur un téléphone mobile" } }
          - - { text: User4, area: user4 }
            - { text: { en: "Certificate-based authentication, Temporary Access Pass", fr: "Authentification basée sur un certificat, passe d'accès temporaire" } }
    answer:
      values: { p1: user3, p2: user2 }
    explanation:
      correct:
        en: |
          SSPR verifies users with methods such as Microsoft Authenticator notifications, OATH tokens, SMS, voice calls and email one-time passcodes; passkeys, Windows Hello for Business, certificate-based authentication, Temporary Access Passes and QR codes aren't SSPR methods, so only User3 can reset the password. QR code authentication is a primary sign-in method only: it can't complete MFA or SSPR. User1's and User4's methods can't be used for SSPR, but they can satisfy MFA.
        fr: |
          SSPR vérifie les utilisateurs avec des méthodes comme les notifications Microsoft Authenticator, les jetons OATH, le SMS, l'appel vocal et le code secret à usage unique par e-mail ; les clés d'accès, Windows Hello Entreprise, l'authentification basée sur un certificat, le passe d'accès temporaire et le code QR ne sont pas des méthodes SSPR : seul User3 peut donc réinitialiser son mot de passe. L'authentification par code QR est uniquement une méthode de connexion principale : elle ne peut compléter ni la MFA ni SSPR. Les méthodes de User1 et de User4 ne servent pas à SSPR, mais elles peuvent satisfaire la MFA.
      options:
        user1: { en: "A passkey and Windows Hello for Business are strong sign-in methods, but neither can verify a user for SSPR.", fr: "Une clé d'accès et Windows Hello Entreprise sont des méthodes de connexion fortes, mais aucune ne permet de vérifier un utilisateur pour SSPR." }
        user4: { en: "Certificate-based authentication and a Temporary Access Pass can satisfy MFA, so User4 doesn't match the second prompt, but neither is an SSPR method.", fr: "L'authentification basée sur un certificat et le passe d'accès temporaire peuvent satisfaire la MFA, donc User4 ne correspond pas à la seconde invite, mais aucun n'est une méthode SSPR." }
    references:
      - title: Microsoft Entra authentication overview
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-methods
      - title: "How it works: Microsoft Entra self-service password reset"
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
