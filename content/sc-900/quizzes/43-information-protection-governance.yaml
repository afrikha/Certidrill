chapter: 43-information-protection-governance
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-43-01
    objective: "4.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        In Microsoft Purview, sensitive information types and trainable classifiers are the two kinds of classifiers.

        What is their main purpose?
      fr: |
        Dans Microsoft Purview, les types d'informations sensibles et les classifieurs entraînables sont les deux sortes de classifieurs.

        Quel est leur objectif principal ?
    body:
      options:
        - { id: a, text: { en: "Encrypt every document of the tenant so that only its owner can open it", fr: "Chiffrer chaque document du locataire pour que seul son propriétaire puisse l'ouvrir" } }
        - { id: b, text: { en: "Record which users opened, shared or deleted each file of the tenant", fr: "Enregistrer quels utilisateurs ont ouvert, partagé ou supprimé chaque fichier du locataire" } }
        - { id: c, text: { en: "Identify sensitive items so that labels, DLP and retention can act on them", fr: "Identifier les éléments sensibles pour que les étiquettes, la DLP et la rétention puissent agir dessus" } }
        - { id: d, text: { en: "Keep every email for a fixed period and then delete it automatically", fr: "Conserver chaque e-mail pendant une période fixe, puis le supprimer automatiquement" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Classifiers recognize sensitive content: sensitive information types by a pattern, trainable classifiers by what the content is. Other features then use this result as a condition, for example to apply a sensitivity label automatically, to trigger a DLP policy or to auto-apply a retention label.
        fr: |
          Les classifieurs reconnaissent le contenu sensible : les types d'informations sensibles par un modèle, les classifieurs entraînables par ce qu'est le contenu. D'autres fonctionnalités utilisent ensuite ce résultat comme condition, par exemple pour appliquer automatiquement une étiquette de confidentialité, déclencher une stratégie DLP ou appliquer automatiquement une étiquette de rétention.
      options:
        a: { en: "Classifiers don't protect anything; encryption is an option of a sensitivity label, applied to chosen content only.", fr: "Les classifieurs ne protègent rien ; le chiffrement est une option d'une étiquette de confidentialité, appliquée seulement au contenu choisi." }
        b: { en: "Recording user and administrator activities is the role of Microsoft Purview Audit and its unified audit log.", fr: "Enregistrer les activités des utilisateurs et des administrateurs est le rôle de Microsoft Purview Audit et de son journal d'audit unifié." }
        d: { en: "Keeping and deleting content is done by retention policies and retention labels (data lifecycle management), not by classifiers.", fr: "Conserver et supprimer du contenu est le rôle des stratégies et des étiquettes de rétention (gestion du cycle de vie des données), pas des classifieurs." }
    references:
      - title: Learn about sensitive information types
        url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-learn-about
      - title: Learn about trainable classifiers
        url: https://learn.microsoft.com/en-us/purview/trainable-classifiers-learn-about

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-43-02
    objective: "4.3.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        At Adatum, a user moves a document from one SharePoint site to another site of the same Microsoft 365 tenant.

        After the move, which retention settings still apply to the document because they travel with it?
      fr: |
        Chez Adatum, un utilisateur déplace un document d'un site SharePoint vers un autre site du même locataire Microsoft 365.

        Après le déplacement, quels paramètres de rétention s'appliquent encore au document parce qu'ils le suivent ?
    body:
      options:
        - { id: a, text: { en: "Those of the retention policy that covers the first site", fr: "Ceux de la stratégie de rétention qui couvre le premier site" } }
        - { id: b, text: { en: "Those of the retention label applied to the document", fr: "Ceux de l'étiquette de rétention appliquée au document" } }
        - { id: c, text: { en: "Those of the eDiscovery hold placed on the first site", fr: "Ceux de la mise en attente eDiscovery placée sur le premier site" } }
        - { id: d, text: { en: "Those of the DLP policy that covers the first site", fr: "Ceux de la stratégie DLP qui couvre le premier site" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A retention label works at the item level: its retention settings travel with the content when it moves to another location of the same Microsoft 365 tenant. That is the reason to choose a label instead of a policy when settings must follow the content.
        fr: |
          Une étiquette de rétention agit au niveau de l'élément : ses paramètres de rétention suivent le contenu quand il est déplacé vers un autre emplacement du même locataire Microsoft 365. C'est la raison de choisir une étiquette plutôt qu'une stratégie quand les paramètres doivent suivre le contenu.
      options:
        a: { en: "A retention policy works at the container level: content inherits its settings only while it stays in the location the policy covers.", fr: "Une stratégie de rétention agit au niveau du conteneur : le contenu n'hérite de ses paramètres que tant qu'il reste dans l'emplacement couvert par la stratégie." }
        c: { en: "A hold preserves the content of the locations of an eDiscovery case; it isn't a retention setting attached to the document.", fr: "Une mise en attente préserve le contenu des emplacements d'un cas eDiscovery ; ce n'est pas un paramètre de rétention attaché au document." }
        d: { en: "A DLP policy protects sensitive items against inappropriate sharing; it has no retention settings.", fr: "Une stratégie DLP protège les éléments sensibles contre un partage inapproprié ; elle n'a aucun paramètre de rétention." }
    references:
      - title: Learn about retention policies and retention labels
        url: https://learn.microsoft.com/en-us/purview/retention

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-43-03
    objective: "4.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has published a sensitivity label named **Confidential**. When a user writes a Word document that contains bank account numbers, Word must suggest the Confidential label. The user must remain free to accept or dismiss the suggestion.

        What should Litware configure?
      fr: |
        Litware a publié une étiquette de confidentialité nommée **Confidential**. Quand un utilisateur rédige un document Word qui contient des numéros de compte bancaire, Word doit suggérer l'étiquette Confidential. L'utilisateur doit rester libre d'accepter ou d'ignorer la suggestion.

        Que doit configurer Litware ?
    body:
      options:
        - { id: a, text: { en: "An auto-labeling policy for SharePoint and OneDrive that applies the label to the files at rest", fr: "Une stratégie d'étiquetage automatique pour SharePoint et OneDrive qui applique l'étiquette aux fichiers au repos" } }
        - { id: b, text: { en: "A sensitivity label policy that applies Confidential as the default label of new documents", fr: "Une stratégie d'étiquetage de confidentialité qui applique Confidential comme étiquette par défaut des nouveaux documents" } }
        - { id: c, text: { en: "A sensitivity label policy that requires users to apply a label before they save a document", fr: "Une stratégie d'étiquetage de confidentialité qui oblige les utilisateurs à appliquer une étiquette avant d'enregistrer un document" } }
        - { id: d, text: { en: "Auto-labeling in the settings of the Confidential label, set to recommend the label to the user", fr: "L'étiquetage automatique dans les paramètres de l'étiquette Confidential, réglé pour recommander l'étiquette à l'utilisateur" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Auto-labeling configured in the label itself works in the Office apps while the user edits the document: when the bank account numbers are detected, Word can recommend the label, and the user accepts or dismisses the recommendation. The label can also be set to apply automatically instead.
        fr: |
          L'étiquetage automatique configuré dans l'étiquette elle-même fonctionne dans les applications Office pendant que l'utilisateur modifie le document : quand les numéros de compte bancaire sont détectés, Word peut recommander l'étiquette, et l'utilisateur accepte ou ignore la recommandation. L'étiquette peut aussi être réglée pour s'appliquer automatiquement.
      options:
        a: { en: "An auto-labeling policy labels content already saved in SharePoint or OneDrive, without the user; it doesn't support recommended labeling.", fr: "Une stratégie d'étiquetage automatique étiquette le contenu déjà enregistré dans SharePoint ou OneDrive, sans l'utilisateur ; elle ne prend pas en charge l'étiquetage recommandé." }
        b: { en: "A default label is applied to every new document, whether or not it contains bank account numbers, and nothing is suggested.", fr: "Une étiquette par défaut s'applique à tous les nouveaux documents, qu'ils contiennent ou non des numéros de compte bancaire, et rien n'est suggéré." }
        c: { en: "Mandatory labeling forces the user to choose a label for every document, but it doesn't suggest Confidential when sensitive data is detected.", fr: "L'étiquetage obligatoire force l'utilisateur à choisir une étiquette pour chaque document, mais il ne suggère pas Confidential quand des données sensibles sont détectées." }
    references:
      - title: Automatically apply a sensitivity label to Microsoft 365 data
        url: https://learn.microsoft.com/en-us/purview/apply-sensitivity-label-automatically

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-43-04
    objective: "4.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam applies a retention label that marks items as records to its signed contracts in SharePoint. The default records management settings of the tenant are used. A user opens a contract whose record is locked.

        Which action is blocked for the user?
      fr: |
        Fabrikam applique à ses contrats signés dans SharePoint une étiquette de rétention qui marque les éléments comme enregistrements. Les paramètres par défaut de gestion des enregistrements du locataire sont utilisés. Un utilisateur ouvre un contrat dont l'enregistrement est verrouillé.

        Quelle action est bloquée pour l'utilisateur ?
    body:
      options:
        - { id: a, text: { en: "Copy the contract to another document library", fr: "Copier le contrat dans une autre bibliothèque de documents" } }
        - { id: b, text: { en: "Rename the contract in its document library", fr: "Renommer le contrat dans sa bibliothèque de documents" } }
        - { id: c, text: { en: "Edit the text in the body of the contract", fr: "Modifier le texte dans le corps du contrat" } }
        - { id: d, text: { en: "Move the contract to another folder of the site", fr: "Déplacer le contrat dans un autre dossier du site" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A locked record can't be edited and can't be deleted: these restrictions are what records management adds to an ordinary retention label. Other actions stay possible, such as copying the item, moving it within the same site, and by default editing its properties.
        fr: |
          Un enregistrement verrouillé ne peut être ni modifié ni supprimé : ces restrictions sont ce que la gestion des enregistrements ajoute à une étiquette de rétention ordinaire. D'autres actions restent possibles, comme copier l'élément, le déplacer dans le même site et, par défaut, modifier ses propriétés.
      options:
        a: { en: "Copying is allowed for every kind of record, including regulatory records.", fr: "La copie est autorisée pour tous les types d'enregistrements, y compris les enregistrements réglementaires." }
        b: { en: "Renaming edits the properties of the item, which is allowed by default for a locked record; only a tenant setting can block it.", fr: "Renommer modifie les propriétés de l'élément, ce qui est autorisé par défaut pour un enregistrement verrouillé ; seul un paramètre du locataire peut le bloquer." }
        d: { en: "Moving an item within its container (here, the site) is allowed for records.", fr: "Déplacer un élément à l'intérieur de son conteneur (ici, le site) est autorisé pour les enregistrements." }
    references:
      - title: Learn about records management
        url: https://learn.microsoft.com/en-us/purview/records-management

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-43-05
    objective: "4.3.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso is planning its data loss prevention (DLP) policies in Microsoft Purview. Its employees write documents in the Office desktop apps, chat with customers in Microsoft Teams, and the design team works on MacBook laptops. The security team wants to know what the policies will be able to protect before it writes them.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso planifie ses stratégies de protection contre la perte de données (DLP) dans Microsoft Purview. Ses employés rédigent des documents dans les applications de bureau Office, conversent avec les clients dans Microsoft Teams, et l'équipe de conception travaille sur des ordinateurs portables MacBook. L'équipe de sécurité veut savoir ce que les stratégies pourront protéger avant de les rédiger.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A DLP policy can protect sensitive information in documents that users edit in Word, Excel and PowerPoint.", fr: "Une stratégie DLP peut protéger les informations sensibles des documents que les utilisateurs modifient dans Word, Excel et PowerPoint." } }
        - { id: s2, text: { en: "When a DLP policy blocks a Teams chat message that contains sensitive information, the recipients still see the message, with a warning.", fr: "Quand une stratégie DLP bloque un message de conversation Teams qui contient des informations sensibles, les destinataires voient toujours le message, avec un avertissement." } }
        - { id: s3, text: { en: "A DLP policy can protect sensitive files that are stored on devices running macOS.", fr: "Une stratégie DLP peut protéger les fichiers sensibles stockés sur des appareils qui exécutent macOS." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          DLP policies cover the Office apps (Word, Excel, PowerPoint), Microsoft 365 services such as Exchange, SharePoint, OneDrive and Teams, and devices running Windows or recent versions of macOS through endpoint DLP. In a Teams chat, a blocked message isn't displayed: the sensitive information never reaches the recipients.
        fr: |
          Les stratégies DLP couvrent les applications Office (Word, Excel, PowerPoint), des services Microsoft 365 comme Exchange, SharePoint, OneDrive et Teams, ainsi que les appareils Windows ou exécutant des versions récentes de macOS grâce à la DLP de point de terminaison. Dans une conversation Teams, un message bloqué n'est pas affiché : les informations sensibles n'atteignent jamais les destinataires.
      options:
        s2: { en: "The blocked message isn't displayed to the recipients; the warning is the policy tip shown to the sender.", fr: "Le message bloqué n'est pas affiché aux destinataires ; l'avertissement est le conseil de stratégie montré à l'expéditeur." }
    references:
      - title: Learn about data loss prevention
        url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-43-06
    objective: "4.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The compliance team of Northwind Traders uses Content explorer and Activity explorer in the Microsoft Purview portal. Endpoint DLP is enabled on the Windows devices of the company. Some emails that contain card numbers were never labeled, and the team suspects that labeled price lists are printed and taken out of the offices.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe de conformité de Northwind Traders utilise l'Explorateur de contenu et l'Explorateur d'activités dans le portail Microsoft Purview. La DLP de point de terminaison est activée sur les appareils Windows de l'entreprise. Certains e-mails qui contiennent des numéros de carte n'ont jamais été étiquetés, et l'équipe soupçonne que des listes de prix étiquetées sont imprimées et emportées hors des bureaux.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Content explorer can show an email that contains a credit card number, even if no label is applied to the email.", fr: "L'Explorateur de contenu peut montrer un e-mail qui contient un numéro de carte de crédit, même si aucune étiquette n'est appliquée à l'e-mail." } }
        - { id: s2, text: { en: "Content explorer shows, for each labeled item, the users who opened the item during the last 30 days.", fr: "L'Explorateur de contenu montre, pour chaque élément étiqueté, les utilisateurs qui ont ouvert l'élément au cours des 30 derniers jours." } }
        - { id: s3, text: { en: "Activity explorer can show that a user printed a labeled file from a Windows device.", fr: "L'Explorateur d'activités peut montrer qu'un utilisateur a imprimé un fichier étiqueté depuis un appareil Windows." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          Content explorer is a current snapshot of the items that have a sensitivity label, a retention label or a sensitive information type: an unlabeled email that contains a credit card number qualifies through the sensitive information type. Who did what with the content, over up to 30 days, is the job of Activity explorer, which reports endpoint actions such as printing a file.
        fr: |
          L'Explorateur de contenu est un instantané actuel des éléments qui ont une étiquette de confidentialité, une étiquette de rétention ou un type d'informations sensibles : un e-mail sans étiquette qui contient un numéro de carte de crédit y figure grâce au type d'informations sensibles. Qui a fait quoi avec le contenu, sur 30 jours au plus, relève de l'Explorateur d'activités, qui rapporte des actions sur les points de terminaison comme l'impression d'un fichier.
      options:
        s2: { en: "Content explorer shows what sensitive items exist and where, not their history; the 30-day activity history is in Activity explorer.", fr: "L'Explorateur de contenu montre quels éléments sensibles existent et où, pas leur historique ; l'historique d'activités de 30 jours se trouve dans l'Explorateur d'activités." }
    references:
      - title: Get started with Content Explorer (classic)
        url: https://learn.microsoft.com/en-us/purview/data-classification-content-explorer
      - title: Get started with activity explorer
        url: https://learn.microsoft.com/en-us/purview/data-classification-activity-explorer

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-43-07
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank created a custom sensitive information type that detects its 10-digit customer account numbers with a regular expression. The type also matches many other 10-digit numbers, such as phone numbers, and its DLP policy now raises many false positives. The bank has no list of its actual account numbers that it could upload to Microsoft Purview.

        What should the bank do to reduce the false positives?
      fr: |
        Woodgrove Bank a créé un type d'informations sensibles personnalisé qui détecte ses numéros de compte client à 10 chiffres avec une expression régulière. Le type correspond aussi à beaucoup d'autres nombres à 10 chiffres, comme des numéros de téléphone, et sa stratégie DLP produit maintenant de nombreux faux positifs. La banque ne dispose d'aucune liste de ses numéros de compte réels qu'elle pourrait charger dans Microsoft Purview.

        Que doit faire la banque pour réduire les faux positifs ?
    body:
      options:
        - { id: a, text: { en: "Add a keyword such as \"account number\" as a supporting element that must appear close to the number", fr: "Ajouter un mot clé comme « numéro de compte » comme élément de prise en charge qui doit figurer près du nombre" } }
        - { id: b, text: { en: "Replace the custom type with an exact data match (EDM) type that compares numbers with real accounts", fr: "Remplacer le type personnalisé par un type à correspondance exacte des données (EDM) qui compare les nombres aux comptes réels" } }
        - { id: c, text: { en: "Lower the confidence level that the DLP policy requires, so that weaker matches are filtered out", fr: "Abaisser le niveau de confiance exigé par la stratégie DLP, pour que les correspondances plus faibles soient écartées" } }
        - { id: d, text: { en: "Replace the custom type with a pre-trained classifier that recognizes financial documents", fr: "Remplacer le type personnalisé par un classifieur préentraîné qui reconnaît les documents financiers" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A sensitive information type combines a primary element (here, the regular expression) with supporting elements, such as keywords, that must appear within a set proximity. Requiring this corroborating evidence raises the confidence of the true matches and leaves out the phone numbers that have no such keyword nearby.
        fr: |
          Un type d'informations sensibles combine un élément principal (ici, l'expression régulière) avec des éléments de prise en charge, comme des mots clés, qui doivent figurer à une proximité donnée. Exiger cette preuve complémentaire augmente la confiance des vraies correspondances et écarte les numéros de téléphone qui n'ont pas un tel mot clé à proximité.
      options:
        b: { en: "An EDM type looks for exact values taken from a table of the sensitive data, and the bank has no such list to upload.", fr: "Un type EDM recherche des valeurs exactes tirées d'une table des données sensibles, et la banque n'a pas de telle liste à charger." }
        c: { en: "A lower confidence level accepts matches with less supporting evidence: it increases false positives instead of reducing them.", fr: "Un niveau de confiance plus bas accepte des correspondances avec moins de preuves : il augmente les faux positifs au lieu de les réduire." }
        d: { en: "A trainable classifier recognizes categories of documents; it would flag financial documents in general, not the account numbers themselves.", fr: "Un classifieur entraînable reconnaît des catégories de documents ; il signalerait les documents financiers en général, pas les numéros de compte eux-mêmes." }
    references:
      - title: Learn about sensitive information types
        url: https://learn.microsoft.com/en-us/purview/sit-sensitive-information-type-learn-about

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-43-08
    objective: "4.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys stores files in SharePoint sites and in the OneDrive accounts of its users. Files that contain passport numbers can be in any of these locations. These files must automatically become inaccessible to people outside the organization, without any action from users. The other files of the same sites must stay shareable with partners, and no file may be encrypted.

        What should Tailspin Toys use?
      fr: |
        Tailspin Toys stocke des fichiers dans des sites SharePoint et dans les comptes OneDrive de ses utilisateurs. Les fichiers qui contiennent des numéros de passeport peuvent se trouver dans n'importe lequel de ces emplacements. Ces fichiers doivent automatiquement devenir inaccessibles aux personnes extérieures à l'organisation, sans aucune action des utilisateurs. Les autres fichiers des mêmes sites doivent rester partageables avec les partenaires, et aucun fichier ne doit être chiffré.

        Que doit utiliser Tailspin Toys ?
    body:
      options:
        - { id: a, text: { en: "A sensitivity label for containers, applied to every site with external sharing turned off", fr: "Une étiquette de confidentialité pour conteneurs, appliquée à chaque site avec le partage externe désactivé" } }
        - { id: b, text: { en: "An auto-labeling policy that applies an encrypting sensitivity label to the files with passport numbers", fr: "Une stratégie d'étiquetage automatique qui applique aux fichiers avec numéros de passeport une étiquette de confidentialité qui chiffre" } }
        - { id: c, text: { en: "A DLP policy for SharePoint and OneDrive that blocks external access to the files with passport numbers", fr: "Une stratégie DLP pour SharePoint et OneDrive qui bloque l'accès externe aux fichiers avec numéros de passeport" } }
        - { id: d, text: { en: "A retention label policy that auto-applies a retention label to the files with passport numbers", fr: "Une stratégie d'étiquette de rétention qui applique automatiquement une étiquette de rétention aux fichiers avec numéros de passeport" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A DLP policy analyzes the content of the files at rest in SharePoint and OneDrive and, when passport numbers are detected, can block people outside the organization from accessing these files. It acts item by item and automatically, leaves the other files shareable and doesn't encrypt anything.
        fr: |
          Une stratégie DLP analyse le contenu des fichiers au repos dans SharePoint et OneDrive et, quand des numéros de passeport sont détectés, peut empêcher les personnes extérieures à l'organisation d'accéder à ces fichiers. Elle agit élément par élément et automatiquement, laisse les autres fichiers partageables et ne chiffre rien.
      options:
        a: { en: "A container label controls external sharing for the whole site, so the other files couldn't be shared with partners either; it doesn't cover OneDrive accounts.", fr: "Une étiquette de conteneur contrôle le partage externe de tout le site : les autres fichiers ne pourraient plus être partagés avec les partenaires ; elle ne couvre pas les comptes OneDrive." }
        b: { en: "This would protect the right files automatically, but through encryption, which the requirements forbid.", fr: "Cela protégerait automatiquement les bons fichiers, mais par le chiffrement, que les exigences interdisent." }
        d: { en: "A retention label decides how long the files are kept; it doesn't control who can access them.", fr: "Une étiquette de rétention décide combien de temps les fichiers sont conservés ; elle ne contrôle pas qui peut y accéder." }
    references:
      - title: Learn about data loss prevention
        url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-43-09
    objective: "4.3.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware's engineers store maintenance reports, written in English, in several SharePoint sites, mixed with other documents. The reports have no fixed format and no common number or keyword, but Proseware can provide hundreds of examples of them. Each report must be kept for 10 years, even if it is moved to another site of the tenant, without users having to label anything.

        Which two actions should Proseware perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les ingénieurs de Proseware stockent des rapports de maintenance, rédigés en anglais, dans plusieurs sites SharePoint, mêlés à d'autres documents. Les rapports n'ont ni format fixe, ni numéro ou mot clé commun, mais Proseware peut en fournir des centaines d'exemples. Chaque rapport doit être conservé 10 ans, même s'il est déplacé vers un autre site du locataire, sans que les utilisateurs aient à étiqueter quoi que ce soit.

        Quelles sont les deux actions que Proseware doit effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a retention policy that keeps the content of the sites for 10 years", fr: "Créer une stratégie de rétention qui conserve le contenu des sites pendant 10 ans" } }
        - { id: b, text: { en: "Create a custom trainable classifier from sample maintenance reports", fr: "Créer un classifieur entraînable personnalisé à partir d'exemples de rapports de maintenance" } }
        - { id: c, text: { en: "Create a custom sensitive information type that matches the reports", fr: "Créer un type d'informations sensibles personnalisé qui reconnaît les rapports" } }
        - { id: d, text: { en: "Publish a 10-year retention label to the sites for the engineers", fr: "Publier une étiquette de rétention de 10 ans dans les sites pour les ingénieurs" } }
        - { id: e, text: { en: "Auto-apply a 10-year retention label to the content the classifier finds", fr: "Appliquer automatiquement une étiquette de rétention de 10 ans au contenu trouvé par le classifieur" } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          A category of documents with no common pattern is recognized by a custom trainable classifier, trained on samples (custom classifiers support English content). A retention label policy can then auto-apply a 10-year retention label to the content that the classifier recognizes: no user action is needed, only the reports are labeled, and the label's settings travel with each report inside the tenant.
        fr: |
          Une catégorie de documents sans modèle commun se reconnaît avec un classifieur entraînable personnalisé, entraîné sur des exemples (les classifieurs personnalisés prennent en charge le contenu en anglais). Une stratégie d'étiquette de rétention peut ensuite appliquer automatiquement une étiquette de rétention de 10 ans au contenu que le classifieur reconnaît : aucune action des utilisateurs n'est nécessaire, seuls les rapports sont étiquetés, et les paramètres de l'étiquette suivent chaque rapport dans le locataire.
      options:
        a: { en: "A retention policy applies the same settings to all the content of the sites, not only to the reports, and its settings don't follow a report moved to another site.", fr: "Une stratégie de rétention applique les mêmes paramètres à tout le contenu des sites, pas seulement aux rapports, et ses paramètres ne suivent pas un rapport déplacé vers un autre site." }
        c: { en: "A sensitive information type looks for a pattern, such as a regular expression or keywords, and the reports have none.", fr: "Un type d'informations sensibles recherche un modèle, comme une expression régulière ou des mots clés, et les rapports n'en ont aucun." }
        d: { en: "A published label must be applied by the engineers themselves, which the requirement excludes.", fr: "Une étiquette publiée doit être appliquée par les ingénieurs eux-mêmes, ce que l'exigence exclut." }
    references:
      - title: Learn about trainable classifiers
        url: https://learn.microsoft.com/en-us/purview/trainable-classifiers-learn-about
      - title: Learn about retention policies and retention labels
        url: https://learn.microsoft.com/en-us/purview/retention

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-43-10
    objective: "4.3.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso stores the minutes of its board meetings as Word documents in a SharePoint site. The default settings of the tenant are used. The requirements are:

        - Only the members of the Board group can open the minutes, even after a copy leaves Microsoft 365.
        - Each document is kept for 10 years, and users can't delete it during this period.
        - The site administrator can still remove the retention label from a document that was labeled by mistake.
        - At the end of the 10 years, the company secretary approves each deletion.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso stocke les procès-verbaux de ses conseils d'administration sous forme de documents Word dans un site SharePoint. Les paramètres par défaut du locataire sont utilisés. Les exigences sont les suivantes :

        - Seuls les membres du groupe Board peuvent ouvrir les procès-verbaux, même après qu'une copie a quitté Microsoft 365.
        - Chaque document est conservé 10 ans, et les utilisateurs ne peuvent pas le supprimer pendant cette période.
        - L'administrateur du site peut toujours retirer l'étiquette de rétention d'un document étiqueté par erreur.
        - À la fin des 10 ans, le secrétaire général approuve chaque suppression.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To control who can open the minutes, apply [[open]].

          To keep the minutes for 10 years and block their deletion, apply [[keep]].

          To have the secretary approve each deletion, configure [[end]].

          Each document then has [[count]].
        fr: |
          Pour contrôler qui peut ouvrir les procès-verbaux, appliquez [[open]].

          Pour conserver les procès-verbaux 10 ans et bloquer leur suppression, appliquez [[keep]].

          Pour que le secrétaire général approuve chaque suppression, configurez [[end]].

          Chaque document a alors [[count]].
      slots:
        - id: open
          options:
            - { id: dlp, text: { en: "a DLP policy that blocks external sharing", fr: "une stratégie DLP qui bloque le partage externe" } }
            - { id: sens, text: { en: "a sensitivity label that encrypts the content", fr: "une étiquette de confidentialité qui chiffre le contenu" } }
            - { id: cont, text: { en: "a sensitivity label for the site container", fr: "une étiquette de confidentialité pour le conteneur du site" } }
        - id: keep
          options:
            - { id: plain, text: { en: "a retention label that doesn't mark items as records", fr: "une étiquette de rétention qui ne marque pas les éléments comme enregistrements" } }
            - { id: record, text: { en: "a retention label that marks items as records", fr: "une étiquette de rétention qui marque les éléments comme enregistrements" } }
            - { id: regul, text: { en: "a retention label that marks items as regulatory records", fr: "une étiquette de rétention qui marque les éléments comme enregistrements réglementaires" } }
            - { id: policy, text: { en: "a retention policy for the site", fr: "une stratégie de rétention pour le site" } }
        - id: end
          options:
            - { id: dispolabel, text: { en: "a disposition review in the retention label", fr: "une révision de destruction dans l'étiquette de rétention" } }
            - { id: dispopolicy, text: { en: "a disposition review in a retention policy", fr: "une révision de destruction dans une stratégie de rétention" } }
            - { id: override, text: { en: "a DLP policy that allows an override", fr: "une stratégie DLP qui autorise un contournement" } }
        - id: count
          options:
            - { id: two, text: { en: "one sensitivity label and one retention label", fr: "une étiquette de confidentialité et une étiquette de rétention" } }
            - { id: one, text: { en: "one label only, of either kind", fr: "une seule étiquette, de l'une ou l'autre sorte" } }
            - { id: tworet, text: { en: "two retention labels", fr: "deux étiquettes de rétention" } }
    answer: { values: { open: sens, keep: record, end: dispolabel, count: two } }
    explanation:
      correct:
        en: |
          Encryption by a sensitivity label persists with the content, so only the Board can open a copy wherever it goes. A record label blocks deletion while still letting the container administrator remove the label; a regulatory record label can't be removed by anyone. Disposition review is a setting of retention labels only. A document can have one sensitivity label and one retention label at the same time.
        fr: |
          Le chiffrement d'une étiquette de confidentialité persiste avec le contenu : seul le conseil peut ouvrir une copie, où qu'elle aille. Une étiquette d'enregistrement bloque la suppression tout en laissant l'administrateur du conteneur retirer l'étiquette ; une étiquette d'enregistrement réglementaire ne peut être retirée par personne. La révision de destruction est un paramètre des étiquettes de rétention uniquement. Un document peut avoir en même temps une étiquette de confidentialité et une étiquette de rétention.
      options:
        dlp: { en: "DLP acts when content is shared from Microsoft 365; it can't control who opens a copy that has already left.", fr: "La DLP agit quand le contenu est partagé depuis Microsoft 365 ; elle ne peut pas contrôler qui ouvre une copie déjà sortie." }
        cont: { en: "A container label sets the privacy and sharing of the site; it doesn't protect the files themselves.", fr: "Une étiquette de conteneur règle la confidentialité et le partage du site ; elle ne protège pas les fichiers eux-mêmes." }
        plain: { en: "With an ordinary retention label, users can still delete the document; only a copy is kept.", fr: "Avec une étiquette de rétention ordinaire, les utilisateurs peuvent encore supprimer le document ; seule une copie est conservée." }
        regul: { en: "Nobody, not even the site administrator, can remove a regulatory record label, which breaks the third requirement.", fr: "Personne, pas même l'administrateur du site, ne peut retirer une étiquette d'enregistrement réglementaire, ce qui enfreint la troisième exigence." }
        policy: { en: "A retention policy doesn't block deletion (a copy is kept) and has no label that an administrator could remove.", fr: "Une stratégie de rétention ne bloque pas la suppression (une copie est conservée) et n'a pas d'étiquette qu'un administrateur pourrait retirer." }
        dispopolicy: { en: "Retention policies don't support disposition review.", fr: "Les stratégies de rétention ne prennent pas en charge la révision de destruction." }
        one: { en: "An item has one label of each kind at most, not one label in total.", fr: "Un élément a au plus une étiquette de chaque sorte, pas une seule étiquette au total." }
    references:
      - title: Learn about records management
        url: https://learn.microsoft.com/en-us/purview/records-management
      - title: Learn about retention policies and retention labels
        url: https://learn.microsoft.com/en-us/purview/retention
