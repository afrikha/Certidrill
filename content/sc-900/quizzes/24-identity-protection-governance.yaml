chapter: 24-identity-protection-governance
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-24-01
    objective: "2.4.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A user of Contoso receives a multifactor authentication prompt that they didn't start. The user denies the prompt and reports it as suspicious.

        Which kind of risk does Microsoft Entra ID Protection associate with this detection?
      fr: |
        Un utilisateur de Contoso reçoit une demande d'authentification multifacteur qu'il n'a pas déclenchée. L'utilisateur refuse la demande et la signale comme suspecte.

        À quel type de risque Protection Microsoft Entra ID associe-t-elle cette détection ?
    body:
      options:
        - { id: a, text: { en: "Sign-in risk", fr: "Risque de connexion" } }
        - { id: b, text: { en: "Insider risk", fr: "Risque interne" } }
        - { id: c, text: { en: "User risk", fr: "Risque utilisateur" } }
        - { id: d, text: { en: "Workload identity risk", fr: "Risque d'identité de charge de travail" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          User reported suspicious activity is a user risk detection: a prompt the user didn't start suggests that someone else knows the password, so the account itself is probably compromised. User risk is the probability that an identity or account is compromised, which is why ID Protection lists this detection with leaked credentials.
        fr: |
          L'activité suspecte signalée par l'utilisateur est une détection de risque utilisateur : une demande que l'utilisateur n'a pas déclenchée laisse penser que quelqu'un d'autre connaît le mot de passe, donc que le compte lui-même est probablement compromis. Le risque utilisateur est la probabilité qu'une identité ou un compte soit compromis ; c'est pourquoi Protection Microsoft Entra ID range cette détection avec les informations d'identification divulguées.
      options:
        a: { en: "Sign-in risk concerns one authentication request, such as a sign-in from an anonymous IP address; this report points to a compromised account.", fr: "Le risque de connexion concerne une demande d'authentification, comme une connexion depuis une adresse IP anonyme ; ce signalement désigne un compte compromis." }
        b: { en: "Insider risk belongs to Microsoft Purview Insider Risk Management, which looks at risky user activities on data, not at sign-ins.", fr: "Le risque interne relève de la gestion des risques internes de Microsoft Purview, qui examine les activités à risque sur les données, pas les connexions." }
        d: { en: "Workload identity risk concerns service principals and applications; a person answering a prompt isn't a workload identity.", fr: "Le risque d'identité de charge de travail concerne les principaux de service et les applications ; une personne qui répond à une demande n'est pas une identité de charge de travail." }
    references:
      - title: What are risk detections? - Microsoft Entra ID Protection
        url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-24-02
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam wants each employee whose Department attribute is Sales to become a member of the Sales-All group automatically, and to leave the group automatically when the attribute changes. Nobody requests or approves this access.

        What should Fabrikam use?
      fr: |
        Fabrikam veut que chaque employé dont l'attribut Department vaut Sales devienne automatiquement membre du groupe Sales-All, et quitte automatiquement le groupe quand l'attribut change. Personne ne demande ni n'approuve cet accès.

        Que doit utiliser Fabrikam ?
    body:
      options:
        - { id: a, text: { en: "An access package with an approval policy", fr: "Un package d'accès avec une stratégie d'approbation" } }
        - { id: b, text: { en: "A recurring access review of the group", fr: "Une révision d'accès récurrente du groupe" } }
        - { id: c, text: { en: "Privileged Identity Management for Groups", fr: "Privileged Identity Management pour les groupes" } }
        - { id: d, text: { en: "A dynamic membership group", fr: "Un groupe d'appartenance dynamique" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A dynamic membership group updates its members from a rule on user attributes: users who match the rule are added, and users who stop matching it are removed. It is one of the access lifecycle capabilities of Microsoft Entra ID Governance, and it needs no request, approval or reviewer.
        fr: |
          Un groupe d'appartenance dynamique met à jour ses membres à partir d'une règle sur les attributs des utilisateurs : les utilisateurs qui correspondent à la règle sont ajoutés, et ceux qui cessent d'y correspondre sont retirés. C'est l'une des fonctionnalités du cycle de vie des accès de Gouvernance Microsoft Entra ID, et elle ne demande ni demande d'accès, ni approbation, ni réviseur.
      options:
        a: { en: "An access package is designed for access that users request and that someone approves; here nobody requests anything.", fr: "Un package d'accès est conçu pour un accès que les utilisateurs demandent et que quelqu'un approuve ; ici personne ne demande rien." }
        b: { en: "An access review asks reviewers to confirm existing access periodically; it doesn't add members when their department changes.", fr: "Une révision d'accès demande à des réviseurs de confirmer périodiquement un accès existant ; elle n'ajoute pas de membres quand leur service change." }
        c: { en: "PIM for Groups gives eligible users just-in-time membership or ownership after an activation, not a membership driven by an attribute.", fr: "PIM pour les groupes donne à des utilisateurs éligibles une appartenance ou une propriété juste-à-temps après activation, pas une appartenance pilotée par un attribut." }
    references:
      - title: Microsoft Entra ID Governance - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-24-03
    objective: "2.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Consultants of a partner company request access to a Contoso project. When the project sponsor approves a request, the consultant must be invited into the Contoso directory, and the consultant's account must be removed from the directory automatically when the approved access period ends, without anyone having to review it.

        Which feature should Contoso use?
      fr: |
        Les consultants d'une entreprise partenaire demandent l'accès à un projet de Contoso. Quand le sponsor du projet approuve une demande, le consultant doit être invité dans l'annuaire de Contoso, et son compte doit être supprimé automatiquement de l'annuaire à la fin de la période d'accès approuvée, sans que personne ait à le réviser.

        Quelle fonctionnalité Contoso doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "Entitlement management", fr: "La gestion des droits d'utilisation" } }
        - { id: b, text: { en: "Access reviews", fr: "Les révisions d'accès" } }
        - { id: c, text: { en: "Lifecycle workflows", fr: "Les workflows de cycle de vie" } }
        - { id: d, text: { en: "PIM for Groups", fr: "PIM pour les groupes" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Entitlement management handles requests, approvals and expiration through access package policies. When an external identity is approved, it is invited automatically into the directory; when its access expires and it has no other access package assignment, its B2B guest account can be removed automatically.
        fr: |
          La gestion des droits d'utilisation traite les demandes, les approbations et l'expiration par les stratégies des packages d'accès. Quand une identité externe est approuvée, elle est invitée automatiquement dans l'annuaire ; quand son accès expire et qu'elle n'a aucune autre attribution de package d'accès, son compte invité B2B peut être supprimé automatiquement.
      options:
        b: { en: "Access reviews can remove guests, but only after reviewers deny their access; the requirement asks for removal at the end of the approved period, without a review.", fr: "Les révisions d'accès peuvent retirer des invités, mais seulement après que des réviseurs ont refusé leur accès ; le besoin demande une suppression à la fin de la période approuvée, sans révision." }
        c: { en: "Lifecycle workflows run tasks at key dates of an employee's lifecycle, such as the hire date; they don't process access requests from partners.", fr: "Les workflows de cycle de vie exécutent des tâches à des dates clés du cycle de vie d'un employé, comme la date d'embauche ; ils ne traitent pas les demandes d'accès de partenaires." }
        d: { en: "PIM for Groups gives eligible users just-in-time group membership; it doesn't invite external users on request or remove their accounts.", fr: "PIM pour les groupes donne à des utilisateurs éligibles une appartenance juste-à-temps à un groupe ; il n'invite pas d'utilisateurs externes sur demande et ne supprime pas leurs comptes." }
    references:
      - title: What is entitlement management? - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-24-04
    objective: "2.4.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        The governance team of Woodgrove Bank is deciding which recertification campaigns it will run next year, after an audit found access that nobody had checked for a long time. The bank gives project access through access packages, hosts its applications in Azure subscriptions whose owners change often, and monitors its sign-ins with Microsoft Entra ID Protection.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe de gouvernance de Woodgrove Bank choisit les campagnes de recertification qu'elle mènera l'an prochain, après qu'un audit a trouvé des accès que personne n'avait vérifiés depuis longtemps. La banque donne l'accès aux projets par des packages d'accès, héberge ses applications dans des abonnements Azure dont les propriétaires changent souvent, et surveille ses connexions avec Protection Microsoft Entra ID.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "An access review can recertify the assignments of an access package.", fr: "Une révision d'accès peut recertifier les attributions d'un package d'accès." } }
        - { id: s2, text: { en: "An access review can recertify Azure resource roles, such as the Owner role on a subscription.", fr: "Une révision d'accès peut recertifier des rôles de ressources Azure, comme le rôle Owner sur un abonnement." } }
        - { id: s3, text: { en: "An access review lets a security analyst investigate the sign-ins that ID Protection flagged as risky.", fr: "Une révision d'accès permet à un analyste de sécurité d'examiner les connexions que Protection Microsoft Entra ID a signalées comme à risque." } }
    answer: { values: { s1: true, s2: true, s3: false } }
    explanation:
      correct:
        en: |
          Access reviews cover group memberships, application assignments, access package assignments (created in entitlement management), and Microsoft Entra roles and Azure resource roles (created in Privileged Identity Management). They recertify who still needs access; investigating risky sign-ins is done in the ID Protection reports.
        fr: |
          Les révisions d'accès couvrent les appartenances aux groupes, les affectations aux applications, les attributions de packages d'accès (créées dans la gestion des droits d'utilisation), ainsi que les rôles Microsoft Entra et les rôles de ressources Azure (créées dans Privileged Identity Management). Elles recertifient qui a encore besoin d'un accès ; l'examen des connexions à risque se fait dans les rapports de Protection Microsoft Entra ID.
      options:
        s3: { en: "Risky sign-ins are investigated in the Risky sign-ins report of ID Protection; an access review asks reviewers to approve or deny continued access.", fr: "Les connexions à risque s'examinent dans le rapport des connexions à risque de Protection Microsoft Entra ID ; une révision d'accès demande à des réviseurs d'approuver ou de refuser le maintien d'un accès." }
    references:
      - title: What are access reviews? - Microsoft Entra - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-24-05
    objective: "2.4.4"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        An administrator of Adatum investigates two cases that Microsoft Entra ID Protection reported. In the first, a sign-in flagged for unfamiliar sign-in properties was the user on a new laptop. In the second, the investigation proves that an attacker signed in with the password of another user.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un administrateur d'Adatum examine deux cas signalés par Protection Microsoft Entra ID. Dans le premier, une connexion signalée pour des propriétés de connexion inhabituelles était l'utilisateur sur un nouvel ordinateur portable. Dans le second, l'enquête prouve qu'un attaquant s'est connecté avec le mot de passe d'un autre utilisateur.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          For the first case, the administrator selects [[first]], so that similar sign-ins aren't considered risky in the future.

          For the second case, the administrator selects [[second]], so that the account stays risky until it is remediated.
        fr: |
          Pour le premier cas, l'administrateur sélectionne [[first]], pour que les connexions semblables ne soient plus considérées comme à risque.

          Pour le second cas, l'administrateur sélectionne [[second]], pour que le compte reste à risque jusqu'à sa correction.
      slots:
        - id: first
          options:
            - { id: compsignin, text: { en: "Confirm sign-in compromised", fr: "Confirmer que la connexion est compromise" } }
            - { id: safe, text: { en: "Confirm sign-in safe", fr: "Confirmer que la connexion est sûre" } }
            - { id: compuser, text: { en: "Confirm user compromised", fr: "Confirmer que l'utilisateur est compromis" } }
        - id: second
          options:
            - { id: dismiss, text: { en: "Dismiss user risk", fr: "Rejeter le risque utilisateur" } }
            - { id: safe2, text: { en: "Confirm sign-in safe", fr: "Confirmer que la connexion est sûre" } }
            - { id: compuser2, text: { en: "Confirm user compromised", fr: "Confirmer que l'utilisateur est compromis" } }
    answer: { values: { first: safe, second: compuser2 } }
    explanation:
      correct:
        en: |
          Confirm sign-in safe marks a false positive: ID Protection learns that similar sign-ins shouldn't be considered risky. Confirm user compromised marks a true positive: ID Protection sets the user risk to high and adds the detection Admin confirmed user compromised, and the user stays risky until remediation steps are taken, for example a secure password change required by a risk-based Conditional Access policy.
        fr: |
          Confirmer que la connexion est sûre signale un faux positif : Protection Microsoft Entra ID apprend que les connexions semblables ne doivent pas être considérées comme à risque. Confirmer que l'utilisateur est compromis signale un vrai positif : Protection Microsoft Entra ID fixe le risque utilisateur à élevé et ajoute la détection Admin confirmed user compromised, et l'utilisateur reste à risque jusqu'à la correction, par exemple un changement de mot de passe sécurisé exigé par une stratégie d'accès conditionnel basée sur les risques.
      options:
        compsignin: { en: "Confirming the sign-in compromised states the opposite of the conclusion: the user was legitimate.", fr: "Confirmer que la connexion est compromise affirme l'inverse de la conclusion : l'utilisateur était légitime." }
        compuser: { en: "The legitimate user wasn't compromised; confirming the compromise would raise the user risk to high.", fr: "L'utilisateur légitime n'a pas été compromis ; confirmer la compromission ferait passer son risque utilisateur à élevé." }
        dismiss: { en: "Dismissing the user risk is for a risk that is real but not malicious; it would close the case of an account that an attacker used.", fr: "Rejeter le risque utilisateur convient à un risque réel mais non malveillant ; cela clôturerait le cas d'un compte qu'un attaquant a utilisé." }
        safe2: { en: "Confirming the sign-in safe would declare the attacker's sign-in a false positive.", fr: "Confirmer que la connexion est sûre déclarerait la connexion de l'attaquant comme un faux positif." }
    references:
      - title: Provide risk feedback in Microsoft Entra ID Protection - Microsoft Entra ID Protection
        url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-risk-feedback
      - title: What is Microsoft Entra ID Protection? - Microsoft Entra ID Protection
        url: https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-24-06
    objective: "2.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The auditors of Adatum set two requirements for the Global Administrator and Security Administrator roles: the security team must be notified each time someone starts using one of these roles, and a complete history of these privileged uses must be downloadable for the yearly audit. The administrators must keep the ability to use the roles when they need them.

        What should Adatum use?
      fr: |
        Les auditeurs d'Adatum fixent deux exigences pour les rôles Global Administrator et Security Administrator : l'équipe de sécurité doit être avertie chaque fois que quelqu'un commence à utiliser l'un de ces rôles, et un historique complet de ces utilisations privilégiées doit pouvoir être téléchargé pour l'audit annuel. Les administrateurs doivent garder la possibilité d'utiliser les rôles quand ils en ont besoin.

        Que doit utiliser Adatum ?
    body:
      options:
        - { id: a, text: { en: "Microsoft Entra ID Protection, with its risk data exported to Microsoft Sentinel", fr: "Protection Microsoft Entra ID, avec ses données de risque exportées vers Microsoft Sentinel" } }
        - { id: b, text: { en: "Monthly access reviews of the two roles, with the results applied automatically", fr: "Des révisions d'accès mensuelles des deux rôles, avec des résultats appliqués automatiquement" } }
        - { id: c, text: { en: "Privileged Identity Management, with eligible assignments for the two roles", fr: "Privileged Identity Management, avec des attributions éligibles pour les deux rôles" } }
        - { id: d, text: { en: "A Conditional Access policy that requires multifactor authentication for the two roles", fr: "Une stratégie d'accès conditionnel qui exige l'authentification multifacteur pour les deux rôles" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With eligible assignments, administrators activate a role when they need it, and Privileged Identity Management sends notifications when privileged roles are activated. PIM also keeps the history of role assignments and activations, and its audit history can be downloaded for an internal or external audit.
        fr: |
          Avec des attributions éligibles, les administrateurs activent un rôle quand ils en ont besoin, et Privileged Identity Management envoie des notifications quand des rôles privilégiés sont activés. PIM conserve aussi l'historique des attributions et des activations de rôles, et cet historique d'audit peut être téléchargé pour un audit interne ou externe.
      options:
        a: { en: "ID Protection detects identity risks such as leaked credentials; its data describes risky sign-ins and users, not the moments when a privileged role starts being used.", fr: "Protection Microsoft Entra ID détecte des risques liés aux identités comme les informations d'identification divulguées ; ses données décrivent des connexions et des utilisateurs à risque, pas les moments où un rôle privilégié commence à être utilisé." }
        b: { en: "Access reviews periodically confirm who still holds a role; with permanent assignments there is no moment of use to notify, and the reviews record decisions, not uses.", fr: "Les révisions d'accès confirment périodiquement qui détient encore un rôle ; avec des attributions permanentes, il n'y a aucun moment d'utilisation à signaler, et les révisions consignent des décisions, pas des utilisations." }
        d: { en: "Conditional Access adds a requirement at sign-in, but it neither notifies the security team when a role is used nor keeps a history of privileged uses.", fr: "L'accès conditionnel ajoute une exigence à la connexion, mais il n'avertit pas l'équipe de sécurité quand un rôle est utilisé et ne conserve pas d'historique des utilisations privilégiées." }
    references:
      - title: What is Privileged Identity Management? - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-24-07
    objective: "2.4.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A security analyst of Fabrikam starts the weekly investigation in Microsoft Entra ID Protection. The analyst first needs every authentication attempt that has one or more risk detections, and then the detail of each detection, such as a leaked credentials detection, with its type.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un analyste de sécurité de Fabrikam commence l'examen hebdomadaire dans Protection Microsoft Entra ID. L'analyste a d'abord besoin de chaque tentative d'authentification qui comporte une ou plusieurs détections de risque, puis du détail de chaque détection, comme une détection d'informations d'identification divulguées, avec son type.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To list the authentication attempts, the analyst opens the [[attempts]] report.

          To see each individual detection with its type, the analyst opens the [[detail]] report.
        fr: |
          Pour lister les tentatives d'authentification, l'analyste ouvre le rapport [[attempts]].

          Pour voir chaque détection individuelle avec son type, l'analyste ouvre le rapport [[detail]].
      slots:
        - id: attempts
          options:
            - { id: users, text: { en: "risky users", fr: "des utilisateurs à risque" } }
            - { id: signins, text: { en: "risky sign-ins", fr: "des connexions à risque" } }
            - { id: detections, text: { en: "risk detections", fr: "des détections de risque" } }
        - id: detail
          options:
            - { id: users2, text: { en: "risky users", fr: "des utilisateurs à risque" } }
            - { id: signins2, text: { en: "risky sign-ins", fr: "des connexions à risque" } }
            - { id: detections2, text: { en: "risk detections", fr: "des détections de risque" } }
    answer: { values: { attempts: signins, detail: detections2 } }
    explanation:
      correct:
        en: |
          ID Protection has three investigation reports. A risky sign-in is reported when one or more risk detections are reported for that sign-in, so the risky sign-ins report lists the authentication attempts. Each risk detected is reported as a risk detection, so the risk detections report shows every detection, including offline ones such as leaked credentials that aren't tied to a sign-in.
        fr: |
          Protection Microsoft Entra ID a trois rapports d'examen. Une connexion à risque est signalée quand une ou plusieurs détections de risque sont signalées pour cette connexion : le rapport des connexions à risque liste donc les tentatives d'authentification. Chaque risque détecté est signalé comme une détection de risque : le rapport des détections de risque montre donc chaque détection, y compris les détections hors connexion comme les informations d'identification divulguées, qui ne sont liées à aucune connexion.
      options:
        users: { en: "The risky users report lists accounts, whose risk can come from several sign-ins and detections; it doesn't list the authentication attempts one by one.", fr: "Le rapport des utilisateurs à risque liste des comptes, dont le risque peut venir de plusieurs connexions et détections ; il ne liste pas les tentatives d'authentification une par une." }
        detections: { en: "The risk detections report lists detections, some of which, like leaked credentials, aren't sign-ins at all.", fr: "Le rapport des détections de risque liste des détections, dont certaines, comme les informations d'identification divulguées, ne sont pas du tout des connexions." }
        signins2: { en: "Leaked credentials is an offline user risk detection that isn't attached to a sign-in, so the risky sign-ins report doesn't show it.", fr: "Les informations d'identification divulguées sont une détection de risque utilisateur hors connexion, qui n'est rattachée à aucune connexion : le rapport des connexions à risque ne la montre pas." }
    references:
      - title: What is Microsoft Entra ID Protection? - Microsoft Entra ID Protection
        url: https://learn.microsoft.com/en-us/entra/id-protection/overview-identity-protection
      - title: What are risk detections? - Microsoft Entra ID Protection
        url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-24-08
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys lists its governance requirements for the coming year and wants to know which of them access reviews can meet.

        Which two requirements can Tailspin Toys meet by using access reviews?

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys liste ses exigences de gouvernance pour l'année à venir et veut savoir lesquelles les révisions d'accès peuvent satisfaire.

        Quelles deux exigences Tailspin Toys peut-elle satisfaire en utilisant les révisions d'accès ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The access of partners ends on the end date that was approved with their request", fr: "L'accès des partenaires prend fin à la date de fin approuvée avec leur demande" } }
        - { id: b, text: { en: "Every quarter, the members of a Teams team confirm themselves that they still need their membership", fr: "Chaque trimestre, les membres d'une équipe Teams confirment eux-mêmes qu'ils ont encore besoin de leur appartenance" } }
        - { id: c, text: { en: "The Exchange Administrator role can be used for only two hours after an approval", fr: "Le rôle Exchange Administrator ne peut être utilisé que deux heures après une approbation" } }
        - { id: d, text: { en: "Every six months, designated reviewers recertify the assignments of an access package", fr: "Tous les six mois, des réviseurs désignés recertifient les attributions d'un package d'accès" } }
        - { id: e, text: { en: "A user whose password appeared in a data breach must change it at the next sign-in", fr: "Un utilisateur dont le mot de passe est apparu dans une fuite de données doit le changer à la connexion suivante" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Access reviews recertify existing access on a recurring schedule. A review of group members, Microsoft 365 groups behind Teams teams included, can be a self-review in which each member states whether they still need access. Reviews of access package assignments are created in entitlement management, with designated reviewers.
        fr: |
          Les révisions d'accès recertifient un accès existant de façon récurrente. Une révision des membres d'un groupe, y compris des groupes Microsoft 365 derrière les équipes Teams, peut être une autorévision dans laquelle chaque membre indique s'il a encore besoin de l'accès. Les révisions des attributions de packages d'accès se créent dans la gestion des droits d'utilisation, avec des réviseurs désignés.
      options:
        a: { en: "An end date approved with a request is an expiration set by an access package policy in entitlement management, applied without any reviewer.", fr: "Une date de fin approuvée avec une demande est une expiration fixée par une stratégie de package d'accès dans la gestion des droits d'utilisation, appliquée sans aucun réviseur." }
        c: { en: "Limiting the use of a role to a few hours after an approval is a just-in-time activation in Privileged Identity Management.", fr: "Limiter l'utilisation d'un rôle à quelques heures après une approbation est une activation juste-à-temps dans Privileged Identity Management." }
        e: { en: "A leaked password is a user risk detected by ID Protection, and the password change is required by a risk-based Conditional Access policy.", fr: "Un mot de passe divulgué est un risque utilisateur détecté par Protection Microsoft Entra ID, et le changement de mot de passe est exigé par une stratégie d'accès conditionnel basée sur les risques." }
    references:
      - title: What are access reviews? - Microsoft Entra - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-24-09
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Northwind Traders is preparing its identity governance plan for next year. The security architect lists four access requirements collected from the project managers, the group owners, the HR department and the administrators, and wants each of them met by the Microsoft Entra feature designed for it.

        Which feature should Northwind Traders use for each requirement? To answer, drag the appropriate feature to each requirement. Each feature may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders prépare son plan de gouvernance des identités pour l'an prochain. L'architecte de sécurité liste quatre exigences d'accès recueillies auprès des chefs de projet, des propriétaires de groupes, du service RH et des administrateurs, et veut que chacune soit satisfaite par la fonctionnalité Microsoft Entra conçue pour elle.

        Quelle fonctionnalité Northwind Traders doit-elle utiliser pour chaque exigence ? Pour répondre, faites glisser la fonctionnalité appropriée vers chaque exigence. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: em, text: { en: "Entitlement management", fr: "Gestion des droits d'utilisation" } }
        - { id: ar, text: { en: "Access reviews", fr: "Révisions d'accès" } }
        - { id: pim, text: { en: "Privileged Identity Management", fr: "Privileged Identity Management" } }
        - { id: lcw, text: { en: "Lifecycle workflows", fr: "Workflows de cycle de vie" } }
        - { id: idp, text: { en: "Microsoft Entra ID Protection", fr: "Protection Microsoft Entra ID" } }
      targets:
        - { id: t1, text: { en: "Access that a project member requested and a manager approved ends on its end date, with no reviewer involved.", fr: "Un accès qu'un membre de projet a demandé et qu'un responsable a approuvé prend fin à sa date de fin, sans aucun réviseur." } }
        - { id: t2, text: { en: "Access that was granted long ago stays in place only if a group owner confirms it each quarter.", fr: "Un accès accordé il y a longtemps n'est maintenu que si un propriétaire du groupe le confirme chaque trimestre." } }
        - { id: t3, text: { en: "On an employee's last working day, the employee is removed from all groups and the account is disabled.", fr: "Le dernier jour de travail d'un employé, celui-ci est retiré de tous les groupes et son compte est désactivé." } }
        - { id: t4, text: { en: "An administrator role can be used for at most two hours at a time, and only after a business justification.", fr: "Un rôle d'administrateur ne peut être utilisé que deux heures au plus à la fois, et seulement après une justification métier." } }
    answer: { mapping: { t1: em, t2: ar, t3: lcw, t4: pim } }
    explanation:
      correct:
        en: |
          Entitlement management applies the expiration of an access package policy to access that was requested and approved. Access reviews recertify existing access on a schedule, with reviewers such as group owners. Lifecycle workflows run leaver tasks such as removing the user from all groups and disabling the account. Privileged Identity Management makes roles time-bound and can require a justification at activation.
        fr: |
          La gestion des droits d'utilisation applique l'expiration d'une stratégie de package d'accès à un accès demandé et approuvé. Les révisions d'accès recertifient un accès existant de façon récurrente, avec des réviseurs comme les propriétaires de groupes. Les workflows de cycle de vie exécutent des tâches de départ comme le retrait de l'utilisateur de tous les groupes et la désactivation du compte. Privileged Identity Management limite les rôles dans le temps et peut exiger une justification à l'activation.
      options:
        idp: { en: "ID Protection detects and remediates identity risks; none of the four requirements concerns a risky sign-in or a compromised account.", fr: "Protection Microsoft Entra ID détecte et corrige les risques liés aux identités ; aucune des quatre exigences ne concerne une connexion à risque ou un compte compromis." }
    references:
      - title: Microsoft Entra ID Governance - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
      - title: Lifecycle Workflows tasks and definitions - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/lifecycle-workflow-tasks

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-24-10
    objective: "2.4.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        At Litware, User1 has an eligible assignment for the Exchange Administrator role in Privileged Identity Management (PIM); activation requires an approval and lasts at most four hours. Microsoft Entra ID Protection now reports User1 at high user risk, and a risk-based Conditional Access policy requires a secure password change for high user risk.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Chez Litware, User1 a une attribution éligible pour le rôle Exchange Administrator dans Privileged Identity Management (PIM) ; l'activation exige une approbation et dure au plus quatre heures. Protection Microsoft Entra ID signale maintenant User1 avec un risque utilisateur élevé, et une stratégie d'accès conditionnel basée sur les risques exige un changement de mot de passe sécurisé en cas de risque utilisateur élevé.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "As long as the assignment isn't activated, User1 can't perform Exchange Administrator tasks.", fr: "Tant que l'attribution n'est pas activée, User1 ne peut pas effectuer de tâches Exchange Administrator." } }
        - { id: s2, text: { en: "PIM detects the high user risk of User1 and refuses the next activation request by itself.", fr: "PIM détecte le risque utilisateur élevé de User1 et refuse de lui-même la prochaine demande d'activation." } }
        - { id: s3, text: { en: "When User1 completes the secure password change that the policy requires, the user risk is remediated without any administrator action.", fr: "Quand User1 effectue le changement de mot de passe sécurisé qu'exige la stratégie, le risque utilisateur est corrigé sans aucune action d'administrateur." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          An eligible assignment gives the role's privileges only after the user activates it, here with an approval and for at most four hours. PIM controls when and for how long a role is usable; detecting risk is the job of ID Protection, and PIM doesn't refuse an activation because of it. When a user completes the control that a risk-based Conditional Access policy requires, such as a secure password change, the risk is remediated automatically.
        fr: |
          Une attribution éligible ne donne les privilèges du rôle qu'après son activation par l'utilisateur, ici avec une approbation et pour quatre heures au plus. PIM contrôle quand et pendant combien de temps un rôle est utilisable ; la détection des risques est le rôle de Protection Microsoft Entra ID, et PIM ne refuse pas une activation à cause d'elle. Quand un utilisateur effectue le contrôle qu'exige une stratégie d'accès conditionnel basée sur les risques, comme un changement de mot de passe sécurisé, le risque est corrigé automatiquement.
      options:
        s2: { en: "PIM doesn't detect attacks or risks: activation is controlled by its own settings (approval, justification, multifactor authentication), and the approver decides.", fr: "PIM ne détecte ni les attaques ni les risques : l'activation est contrôlée par ses propres paramètres (approbation, justification, authentification multifacteur), et l'approbateur décide." }
    references:
      - title: What is Privileged Identity Management? - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
      - title: Remediate risks and unblock users - Microsoft Entra ID Protection
        url: https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-remediate-unblock
