chapter: 31-azure-infrastructure-security
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-31-01
    objective: "3.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A network security group (NSG) contains several inbound security rules, and more than one of them matches the same packet.

        How does the NSG decide what happens to the packet?
      fr: |
        Un groupe de sécurité réseau (NSG) contient plusieurs règles de sécurité entrantes, et plusieurs d'entre elles correspondent au même paquet.

        Comment le NSG décide-t-il du sort du paquet ?
    body:
      options:
        - { id: a, text: { en: "It applies the matching rule with the lowest priority number, then stops processing", fr: "Il applique la règle correspondante dont le numéro de priorité est le plus petit, puis arrête le traitement" } }
        - { id: b, text: { en: "It applies the matching rule with the highest priority number, then stops processing", fr: "Il applique la règle correspondante dont le numéro de priorité est le plus grand, puis arrête le traitement" } }
        - { id: c, text: { en: "It evaluates every matching rule, and a deny rule always wins over an allow rule", fr: "Il évalue toutes les règles correspondantes, et une règle de refus l'emporte toujours sur une règle d'autorisation" } }
        - { id: d, text: { en: "It applies the matching rule that was created first, then ignores the others", fr: "Il applique la règle correspondante créée en premier, puis ignore les autres" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          NSG rules are processed in priority order: the lower the number, the higher the priority. As soon as a rule matches the traffic, processing stops, so the first matching rule decides, whether it allows or denies.
        fr: |
          Les règles d'un NSG sont traitées par ordre de priorité : plus le nombre est petit, plus la priorité est élevée. Dès qu'une règle correspond au trafic, le traitement s'arrête ; c'est donc la première règle correspondante qui décide, qu'elle autorise ou qu'elle refuse.
      options:
        b: { en: "The order is the reverse: a high number means a low priority, which is why the default rules have numbers from 65000.", fr: "L'ordre est l'inverse : un grand nombre signifie une faible priorité, c'est pourquoi les règles par défaut ont des numéros à partir de 65000." }
        c: { en: "An NSG doesn't combine the matching rules: processing stops at the first match, so a lower-numbered allow rule wins over a higher-numbered deny rule.", fr: "Un NSG ne combine pas les règles correspondantes : le traitement s'arrête à la première correspondance ; une règle d'autorisation de plus petit numéro l'emporte donc sur une règle de refus de plus grand numéro." }
        d: { en: "The creation date plays no role; each rule has a priority, and two rules can't have the same priority and direction.", fr: "La date de création ne joue aucun rôle ; chaque règle a une priorité, et deux règles ne peuvent pas avoir la même priorité et la même direction." }
    references:
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-31-02
    objective: "3.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam deploys a virtual machine in an Azure virtual network. The virtual machine has no public IP address and isn't behind a public load balancer.

        Which statement describes the connections that computers on the internet try to open to this virtual machine?
      fr: |
        Fabrikam déploie une machine virtuelle dans un réseau virtuel Azure. La machine virtuelle n'a pas d'adresse IP publique et ne se trouve pas derrière un équilibreur de charge public.

        Quelle affirmation décrit les connexions que des ordinateurs d'internet tentent d'ouvrir vers cette machine virtuelle ?
    body:
      options:
        - { id: a, text: { en: "They reach it, because a virtual network accepts all inbound internet traffic by default", fr: "Elles l'atteignent, car un réseau virtuel accepte par défaut tout le trafic entrant d'internet" } }
        - { id: b, text: { en: "They reach it only on ports 80 and 443, which a virtual network opens by default", fr: "Elles l'atteignent seulement sur les ports 80 et 443, qu'un réseau virtuel ouvre par défaut" } }
        - { id: c, text: { en: "They don't reach it, because inbound access needs a public IP address or a public load balancer", fr: "Elles ne l'atteignent pas, car l'accès entrant exige une adresse IP publique ou un équilibreur de charge public" } }
        - { id: d, text: { en: "They don't reach it until an NSG that allows the traffic is associated with its subnet", fr: "Elles ne l'atteignent pas tant qu'un NSG qui autorise le trafic n'est pas associé à son sous-réseau" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A virtual network is a containment boundary: no traffic from the internet enters it by default. To accept connections from the internet, a resource needs a public IP address or must be placed behind a public load balancer.
        fr: |
          Un réseau virtuel est une limite de confinement : par défaut, aucun trafic d'internet n'y entre. Pour accepter des connexions venant d'internet, une ressource a besoin d'une adresse IP publique ou doit être placée derrière un équilibreur de charge public.
      options:
        a: { en: "The default is the opposite: inbound traffic from the internet isn't allowed into a virtual network until it is explicitly provisioned.", fr: "Le comportement par défaut est l'inverse : le trafic entrant d'internet n'est pas admis dans un réseau virtuel tant qu'il n'est pas explicitement prévu." }
        b: { en: "A virtual network opens no port to the internet by default, web ports included; ports are opened with security rules on a reachable resource.", fr: "Un réseau virtuel n'ouvre aucun port vers internet par défaut, ports web compris ; les ports s'ouvrent par des règles de sécurité sur une ressource joignable." }
        d: { en: "An NSG only filters traffic that can reach the resource; an allow rule doesn't make a virtual machine without a public IP address reachable from the internet.", fr: "Un NSG ne fait que filtrer le trafic qui peut atteindre la ressource ; une règle d'autorisation ne rend pas joignable depuis internet une machine virtuelle sans adresse IP publique." }
    references:
      - title: What is Azure Virtual Network?
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
      - title: Describe network segmentation in Azure
        url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-31-03
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum hosts a small customer portal in an Azure virtual network. Only two public IP addresses of the portal are exposed to the internet. Adatum wants DDoS mitigation tuned to the portal's traffic, with metrics and alerts. It doesn't need the DDoS rapid response team or cost protection, and it wants to minimize costs.

        What should Adatum use?
      fr: |
        Adatum héberge un petit portail client dans un réseau virtuel Azure. Seules deux adresses IP publiques du portail sont exposées à internet. Adatum veut une atténuation DDoS réglée sur le trafic du portail, avec des métriques et des alertes. Elle n'a besoin ni de l'équipe de réponse rapide DDoS ni de la protection des coûts, et veut réduire les coûts au minimum.

        Que doit utiliser Adatum ?
    body:
      options:
        - { id: a, text: { en: "DDoS Network Protection on the portal's virtual network", fr: "DDoS Network Protection sur le réseau virtuel du portail" } }
        - { id: b, text: { en: "DDoS IP Protection on the portal's public IP addresses", fr: "DDoS IP Protection sur les adresses IP publiques du portail" } }
        - { id: c, text: { en: "The default DDoS infrastructure protection of the platform", fr: "La protection d'infrastructure DDoS par défaut de la plateforme" } }
        - { id: d, text: { en: "Azure Web Application Firewall on an application gateway", fr: "Azure Web Application Firewall sur une passerelle d'application" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          DDoS IP Protection is paid per protected public IP address and has the same core features as DDoS Network Protection: always-on monitoring, mitigation tuned to the application, metrics and alerts. It leaves out the value-added services (rapid response support, cost protection, WAF discount), which Adatum doesn't need, so it is the cheapest option for two addresses.
        fr: |
          DDoS IP Protection se paie par adresse IP publique protégée et offre les mêmes fonctionnalités de base que DDoS Network Protection : surveillance permanente, atténuation réglée sur l'application, métriques et alertes. Elle laisse de côté les services à valeur ajoutée (support de réponse rapide, protection des coûts, remise sur WAF), dont Adatum n'a pas besoin ; c'est donc l'option la moins chère pour deux adresses.
      options:
        a: { en: "Network Protection would meet the technical needs, but it is priced for up to 100 protected IP addresses and includes services Adatum doesn't want, so it costs more.", fr: "Network Protection répondrait aux besoins techniques, mais elle est tarifée pour 100 adresses IP protégées et inclut des services dont Adatum ne veut pas ; elle coûte donc plus cher." }
        c: { en: "The default protection costs nothing, but it provides no telemetry, no alerting and no tuning to the portal's traffic.", fr: "La protection par défaut ne coûte rien, mais elle n'offre ni télémétrie, ni alertes, ni réglage sur le trafic du portail." }
        d: { en: "WAF protects web applications at layer 7; it doesn't provide the layer 3 and layer 4 DDoS mitigation, metrics and alerts requested.", fr: "WAF protège les applications web à la couche 7 ; il ne fournit pas l'atténuation DDoS des couches 3 et 4, ni les métriques et alertes demandées." }
    references:
      - title: About Azure DDoS Protection Tier Comparison
        url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison
      - title: Describe Azure DDoS protection
        url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-31-04
    objective: "3.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The public website of Tailspin Toys uses a TLS/SSL certificate issued by DigiCert. Twice, the certificate expired because nobody renewed it on time. Tailspin Toys wants the certificate kept in a central store with controlled access, and renewed automatically before it expires.

        What should Tailspin Toys use?
      fr: |
        Le site web public de Tailspin Toys utilise un certificat TLS/SSL émis par DigiCert. À deux reprises, le certificat a expiré parce que personne ne l'a renouvelé à temps. Tailspin Toys veut que le certificat soit conservé dans un magasin central à accès contrôlé, et renouvelé automatiquement avant son expiration.

        Que doit utiliser Tailspin Toys ?
    body:
      options:
        - { id: a, text: { en: "Azure Application Gateway", fr: "Azure Application Gateway" } }
        - { id: b, text: { en: "Azure Firewall Premium", fr: "Pare-feu Azure Premium" } }
        - { id: c, text: { en: "Azure Bastion", fr: "Azure Bastion" } }
        - { id: d, text: { en: "Azure Key Vault", fr: "Azure Key Vault" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Key Vault manages certificates as well as secrets and keys: it stores them with access controlled through Microsoft Entra ID and Azure RBAC or access policies. For certificates from its partner certificate authorities, DigiCert and GlobalSign, Key Vault can renew the certificate automatically through a lifetime action.
        fr: |
          Key Vault gère les certificats ainsi que les secrets et les clés : il les stocke avec un accès contrôlé par Microsoft Entra ID et Azure RBAC ou les stratégies d'accès. Pour les certificats de ses autorités de certification partenaires, DigiCert et GlobalSign, Key Vault peut renouveler le certificat automatiquement par une action de durée de vie.
      options:
        a: { en: "Application Gateway can present a TLS certificate to clients, but it isn't a store that renews certificates; it can read them from Key Vault.", fr: "Application Gateway peut présenter un certificat TLS aux clients, mais ce n'est pas un magasin qui renouvelle les certificats ; il peut les lire dans Key Vault." }
        b: { en: "Azure Firewall Premium uses a certificate to inspect outbound TLS traffic; it doesn't store or renew the certificates of a website.", fr: "Le Pare-feu Azure Premium utilise un certificat pour inspecter le trafic TLS sortant ; il ne stocke ni ne renouvelle les certificats d'un site web." }
        c: { en: "Azure Bastion secures RDP and SSH connections to virtual machines; it doesn't manage certificates.", fr: "Azure Bastion sécurise les connexions RDP et SSH aux machines virtuelles ; il ne gère pas de certificats." }
    references:
      - title: About Azure Key Vault certificates
        url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates
      - title: About Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-31-05
    objective: "3.1.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso runs a web tier and a database tier in two subnets of an Azure virtual network named VNet1. Its HR application runs in another virtual network named VNet2. Contoso plans to peer VNet1 and VNet2 so that the web tier can call an HR API.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exécute un niveau web et un niveau base de données dans deux sous-réseaux d'un réseau virtuel Azure nommé VNet1. Son application RH s'exécute dans un autre réseau virtuel nommé VNet2. Contoso prévoit un peering entre VNet1 et VNet2 pour que le niveau web puisse appeler une API RH.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "If an attacker compromises a web server, an NSG associated with the database subnet can limit the traffic that the attacker sends from that server to the database servers.", fr: "Si un attaquant compromet un serveur web, un NSG associé au sous-réseau de base de données peut limiter le trafic que l'attaquant envoie depuis ce serveur vers les serveurs de base de données." } }
        - { id: s2, text: { en: "After the peering, an NSG associated with the subnet of the HR application can still deny the traffic that comes from the database subnet of VNet1.", fr: "Après le peering, un NSG associé au sous-réseau de l'application RH peut encore refuser le trafic qui vient du sous-réseau de base de données de VNet1." } }
        - { id: s3, text: { en: "Placing the web tier and the database tier in separate subnets is enough, on its own, to block the traffic between them.", fr: "Placer le niveau web et le niveau base de données dans des sous-réseaux distincts suffit, à lui seul, à bloquer le trafic entre eux." } }
    answer: { values: { s1: true, s2: true, s3: false } }
    explanation:
      correct:
        en: |
          Segmentation contains an attacker only if each boundary is filtered. An NSG on the database subnet can allow only the traffic the web tier needs and deny the rest, which limits lateral movement. After a peering, the resources of the two networks can communicate, but NSG rules still apply on each side and can deny selected sources.
        fr: |
          La segmentation ne contient un attaquant que si chaque limite est filtrée. Un NSG sur le sous-réseau de base de données peut n'autoriser que le trafic dont le niveau web a besoin et refuser le reste, ce qui limite le déplacement latéral. Après un peering, les ressources des deux réseaux peuvent communiquer, mais les règles des NSG s'appliquent toujours de chaque côté et peuvent refuser certaines sources.
      options:
        s3: { en: "Azure routes traffic between the subnets of a virtual network automatically; a subnet is a segment to which you attach controls such as an NSG, not a filter by itself.", fr: "Azure route automatiquement le trafic entre les sous-réseaux d'un réseau virtuel ; un sous-réseau est un segment auquel on attache des contrôles comme un NSG, pas un filtre en soi." }
    references:
      - title: Describe network segmentation in Azure
        url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/5-describe-network-segmentation
      - title: What is Azure Virtual Network?
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-31-06
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware plans network protection for four environments. For each requirement, Litware wants the least expensive option that meets it.

        Which option should Litware use for each requirement? To answer, drag the appropriate option to each requirement. Each option may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware prévoit la protection réseau de quatre environnements. Pour chaque exigence, Litware veut l'option la moins chère qui y répond.

        Quelle option Litware doit-elle utiliser pour chaque exigence ? Pour répondre, faites glisser l'option appropriée vers chaque exigence. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: basic, text: { en: "Azure Firewall Basic", fr: "Pare-feu Azure Basic" } }
        - { id: std, text: { en: "Azure Firewall Standard", fr: "Pare-feu Azure Standard" } }
        - { id: prem, text: { en: "Azure Firewall Premium", fr: "Pare-feu Azure Premium" } }
        - { id: waf, text: { en: "Azure Web Application Firewall", fr: "Azure Web Application Firewall" } }
        - { id: nsg, text: { en: "A network security group", fr: "Un groupe de sécurité réseau" } }
      targets:
        - { id: t1, text: { en: "A branch office with about 150 Mbps of traffic needs a managed, stateful firewall; alerts on traffic to known malicious IP addresses are enough.", fr: "Une agence d'environ 150 Mbit/s de trafic a besoin d'un pare-feu managé avec état ; des alertes sur le trafic vers des adresses IP malveillantes connues suffisent." } }
        - { id: t2, text: { en: "A production hub must block, not only report, the traffic to and from known malicious IP addresses and domains.", fr: "Un hub de production doit bloquer, et pas seulement signaler, le trafic depuis ou vers des adresses IP et des domaines malveillants connus." } }
        - { id: t3, text: { en: "A payment-processing workload must have its outbound HTTPS traffic decrypted and inspected.", fr: "Une charge de travail de traitement des paiements doit faire déchiffrer et inspecter son trafic HTTPS sortant." } }
        - { id: t4, text: { en: "A regulated workload needs signature-based intrusion detection and prevention for the traffic between its virtual networks.", fr: "Une charge de travail réglementée a besoin d'une détection et d'une prévention des intrusions basées sur des signatures pour le trafic entre ses réseaux virtuels." } }
    answer: { mapping: { t1: basic, t2: std, t3: prem, t4: prem } }
    explanation:
      correct:
        en: |
          Azure Firewall Basic suits small environments up to 250 Mbps, but its threat intelligence only alerts. Standard is the first SKU whose threat intelligence also denies traffic to and from known malicious addresses and domains. TLS inspection of outbound traffic and the signature-based IDPS are Premium features, designed for highly sensitive workloads such as payment processing.
        fr: |
          Le Pare-feu Azure Basic convient aux petits environnements jusqu'à 250 Mbit/s, mais son renseignement sur les menaces ne fait qu'alerter. Standard est le premier SKU dont le renseignement sur les menaces refuse aussi le trafic depuis ou vers des adresses et des domaines malveillants connus. L'inspection TLS du trafic sortant et l'IDPS basé sur des signatures sont des fonctionnalités Premium, conçues pour les charges de travail très sensibles comme le traitement des paiements.
      options:
        waf: { en: "WAF inspects HTTP requests that reach a web application; it doesn't decrypt outbound traffic, filter traffic between virtual networks or apply threat intelligence to all traffic.", fr: "WAF inspecte les requêtes HTTP qui arrivent sur une application web ; il ne déchiffre pas le trafic sortant, ne filtre pas le trafic entre réseaux virtuels et n'applique pas le renseignement sur les menaces à tout le trafic." }
        nsg: { en: "An NSG costs nothing but filters only by IP address, port and protocol; it has no threat intelligence, no TLS inspection and no IDPS.", fr: "Un NSG ne coûte rien mais ne filtre que par adresse IP, port et protocole ; il n'a ni renseignement sur les menaces, ni inspection TLS, ni IDPS." }
        basic: { en: "Basic can't be used for the production hub: in Basic, threat intelligence runs in alert mode only.", fr: "Basic ne convient pas au hub de production : dans Basic, le renseignement sur les menaces fonctionne en mode alerte uniquement." }
    references:
      - title: Choose the right Azure Firewall SKU to meet your needs
        url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
      - title: Describe Azure Firewall
        url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/3-describe-what-azure-firewall

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-31-07
    objective: "3.1.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        An audit finds two issues on the Azure virtual machines that run a payment application of Woodgrove Bank. The RDP port of each virtual machine is open to the internet on its public IP address, so that administrators can connect from home. The application reads the password of its database from a configuration file stored on the virtual machines.

        Woodgrove Bank must make sure that no management port of the virtual machines is reachable from the internet, while administrators can still connect from the Azure portal, and that the password is no longer stored on the virtual machines.

        Which two actions should Woodgrove Bank perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un audit relève deux problèmes sur les machines virtuelles Azure qui exécutent une application de paiement de Woodgrove Bank. Le port RDP de chaque machine virtuelle est ouvert à internet sur son adresse IP publique, pour que les administrateurs puissent se connecter depuis chez eux. L'application lit le mot de passe de sa base de données dans un fichier de configuration stocké sur les machines virtuelles.

        Woodgrove Bank doit faire en sorte qu'aucun port de gestion des machines virtuelles ne soit joignable depuis internet, tout en permettant aux administrateurs de se connecter depuis le portail Azure, et que le mot de passe ne soit plus stocké sur les machines virtuelles.

        Quelles deux actions Woodgrove Bank doit-elle effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Remove the public IP addresses and connect to the virtual machines through Azure Bastion", fr: "Supprimer les adresses IP publiques et se connecter aux machines virtuelles par Azure Bastion" } }
        - { id: b, text: { en: "Keep the public IP addresses and allow RDP only from the administrators' home addresses in an NSG", fr: "Garder les adresses IP publiques et n'autoriser RDP que depuis les adresses personnelles des administrateurs dans un NSG" } }
        - { id: c, text: { en: "Store the password as a key in Azure Key Vault and protect it with a hardware security module", fr: "Stocker le mot de passe comme clé dans Azure Key Vault et le protéger par un module de sécurité matériel" } }
        - { id: d, text: { en: "Store the password as a secret in Azure Key Vault and have the application read it at run time", fr: "Stocker le mot de passe comme secret dans Azure Key Vault et faire en sorte que l'application le lise à l'exécution" } }
        - { id: e, text: { en: "Enable DDoS IP Protection on the public IP addresses of the virtual machines", fr: "Activer DDoS IP Protection sur les adresses IP publiques des machines virtuelles" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          With Azure Bastion, administrators open RDP sessions over TLS from the Azure portal, and the virtual machines need no public IP address, so their management ports are no longer exposed to the internet. A password is a secret: Key Vault stores it under access control, and the application retrieves it at run time instead of keeping it in a configuration file.
        fr: |
          Avec Azure Bastion, les administrateurs ouvrent des sessions RDP sur TLS depuis le portail Azure, et les machines virtuelles n'ont besoin d'aucune adresse IP publique ; leurs ports de gestion ne sont donc plus exposés à internet. Un mot de passe est un secret : Key Vault le stocke avec un contrôle d'accès, et l'application le récupère à l'exécution au lieu de le garder dans un fichier de configuration.
      options:
        b: { en: "The RDP port stays reachable from the internet through the public IP address, only from fewer sources, and home addresses change; the requirement forbids any exposure.", fr: "Le port RDP reste joignable depuis internet par l'adresse IP publique, seulement depuis moins de sources, et les adresses personnelles changent ; l'exigence interdit toute exposition." }
        c: { en: "Key Vault keys are encryption keys used for cryptographic operations; a password that an application reads is stored as a secret.", fr: "Les clés de Key Vault sont des clés de chiffrement utilisées pour des opérations cryptographiques ; un mot de passe qu'une application lit se stocke comme secret." }
        e: { en: "DDoS IP Protection mitigates floods against public IP addresses; it doesn't close the RDP port or remove the password from the virtual machines.", fr: "DDoS IP Protection atténue les inondations contre des adresses IP publiques ; elle ne ferme pas le port RDP et ne retire pas le mot de passe des machines virtuelles." }
    references:
      - title: What is Azure Bastion?
        url: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
      - title: About Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-31-08
    objective: "3.1.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders connects its datacenter to Azure through ExpressRoute private peering. Its administrators open RDP and SSH sessions to production virtual machines in a hub virtual network and in peered spoke virtual networks, several sessions at the same time. A new security rule forbids any public IP address on the Azure resources used for these connections, including the service that brokers them, and administrators must connect only over the private connection.

        What should Northwind Traders deploy in the hub virtual network?
      fr: |
        Northwind Traders relie son centre de données à Azure par le peering privé ExpressRoute. Ses administrateurs ouvrent des sessions RDP et SSH vers des machines virtuelles de production d'un réseau virtuel hub et de réseaux virtuels spoke reliés par peering, plusieurs sessions à la fois. Une nouvelle règle de sécurité interdit toute adresse IP publique sur les ressources Azure utilisées pour ces connexions, y compris le service qui les assure, et les administrateurs doivent se connecter uniquement par la connexion privée.

        Que doit déployer Northwind Traders dans le réseau virtuel hub ?
    body:
      options:
        - { id: a, text: { en: "Azure Bastion with the Developer SKU, on shared infrastructure", fr: "Azure Bastion avec le SKU Developer, sur une infrastructure partagée" } }
        - { id: b, text: { en: "Azure Bastion with the Standard SKU, restricted by an NSG", fr: "Azure Bastion avec le SKU Standard, restreint par un NSG" } }
        - { id: c, text: { en: "Azure Bastion with the Premium SKU, as a private-only deployment", fr: "Azure Bastion avec le SKU Premium, en déploiement privé uniquement" } }
        - { id: d, text: { en: "Azure Bastion with the Basic SKU, with one host per spoke", fr: "Azure Bastion avec le SKU Basic, avec un hôte par spoke" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A private-only deployment has no public IP address: users connected through ExpressRoute private peering reach the private IP address of the bastion host, which then connects to virtual machines in its virtual network and in peered virtual networks. This deployment requires the Premium SKU, which also supports several connections at the same time.
        fr: |
          Un déploiement privé uniquement n'a pas d'adresse IP publique : les utilisateurs connectés par le peering privé ExpressRoute atteignent l'adresse IP privée de l'hôte bastion, qui se connecte ensuite aux machines virtuelles de son réseau virtuel et des réseaux virtuels reliés par peering. Ce déploiement exige le SKU Premium, qui prend aussi en charge plusieurs connexions simultanées.
      options:
        a: { en: "The Developer SKU allows one connection at a time, doesn't support peered virtual networks and isn't meant for production.", fr: "Le SKU Developer n'autorise qu'une connexion à la fois, ne prend pas en charge les réseaux virtuels reliés par peering et n'est pas destiné à la production." }
        b: { en: "A Standard deployment keeps its public IP address; an NSG can restrict who reaches it, but the rule forbids the public IP address itself.", fr: "Un déploiement Standard garde son adresse IP publique ; un NSG peut restreindre qui l'atteint, mais la règle interdit l'adresse IP publique elle-même." }
        d: { en: "A Basic deployment also has a public IP address, and one host in the hub already reaches the virtual machines of peered spokes.", fr: "Un déploiement Basic a lui aussi une adresse IP publique, et un seul hôte dans le hub atteint déjà les machines virtuelles des spokes reliés par peering." }
    references:
      - title: Deploy private-only Bastion
        url: https://learn.microsoft.com/en-us/azure/bastion/private-only-deployment
      - title: Choose the right Azure Bastion SKU to meet your needs
        url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-31-09
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware publishes an online store through Azure Application Gateway with Azure Web Application Firewall (WAF). WAF applies the managed rule set in Detection mode. DDoS Network Protection is enabled on the virtual network of the application gateway. During one day, the store receives a SYN flood against the public IP address of the gateway and a SQL injection attempt in its search form.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware publie une boutique en ligne par Azure Application Gateway avec Azure Web Application Firewall (WAF). WAF applique l'ensemble de règles managé en mode Détection. DDoS Network Protection est activée sur le réseau virtuel de la passerelle d'application. Au cours d'une journée, la boutique subit une inondation SYN contre l'adresse IP publique de la passerelle et une tentative d'injection SQL dans son formulaire de recherche.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The SYN flood is [[syn]].

          The SQL injection attempt is [[sqli]].

          To stop such SQL injection attempts before they reach the store, Proseware must [[fix]].
        fr: |
          L'inondation SYN est [[syn]].

          La tentative d'injection SQL est [[sqli]].

          Pour arrêter ces tentatives d'injection SQL avant qu'elles n'atteignent la boutique, Proseware doit [[fix]].
      slots:
        - id: syn
          options:
            - { id: ddos, text: { en: "mitigated by Azure DDoS Protection", fr: "atténuée par Azure DDoS Protection" } }
            - { id: waf, text: { en: "blocked by WAF with a 403 response", fr: "bloquée par WAF avec une réponse 403" } }
            - { id: fwd, text: { en: "forwarded to the store, because WAF is in Detection mode", fr: "transmise à la boutique, car WAF est en mode Détection" } }
        - id: sqli
          options:
            - { id: blocked, text: { en: "blocked by WAF with a 403 response", fr: "bloquée par WAF avec une réponse 403" } }
            - { id: logged, text: { en: "logged by WAF and forwarded to the store", fr: "journalisée par WAF et transmise à la boutique" } }
            - { id: ddos2, text: { en: "mitigated by Azure DDoS Protection", fr: "atténuée par Azure DDoS Protection" } }
        - id: fix
          options:
            - { id: prev, text: { en: "switch WAF to Prevention mode", fr: "passer WAF en mode Prévention" } }
            - { id: ipp, text: { en: "replace DDoS Network Protection with DDoS IP Protection", fr: "remplacer DDoS Network Protection par DDoS IP Protection" } }
            - { id: nsg, text: { en: "add an NSG rule that denies port 443 from the internet", fr: "ajouter une règle NSG qui refuse le port 443 depuis internet" } }
    answer: { values: { syn: ddos, sqli: logged, fix: prev } }
    explanation:
      correct:
        en: |
          A SYN flood is a protocol attack on layers 3 and 4, which Azure DDoS Protection mitigates; WAF works at layer 7 on HTTP requests. In Detection mode, WAF monitors and logs the requests that match its rules but doesn't block them, so the SQL injection reaches the store. In Prevention mode, WAF blocks the matching requests and returns a 403 response.
        fr: |
          Une inondation SYN est une attaque de protocole sur les couches 3 et 4, qu'Azure DDoS Protection atténue ; WAF travaille à la couche 7, sur les requêtes HTTP. En mode Détection, WAF surveille et journalise les requêtes qui correspondent à ses règles mais ne les bloque pas ; l'injection SQL atteint donc la boutique. En mode Prévention, WAF bloque les requêtes correspondantes et renvoie une réponse 403.
      options:
        waf: { en: "WAF inspects HTTP requests at layer 7; a SYN flood happens at the transport layer, before any HTTP request exists.", fr: "WAF inspecte les requêtes HTTP à la couche 7 ; une inondation SYN se produit à la couche transport, avant qu'aucune requête HTTP n'existe." }
        blocked: { en: "A 403 response is returned in Prevention mode only; in Detection mode, WAF only logs.", fr: "Une réponse 403 n'est renvoyée qu'en mode Prévention ; en mode Détection, WAF se contente de journaliser." }
        ddos2: { en: "Azure DDoS Protection doesn't protect layer 7: a SQL injection is an application-layer attack.", fr: "Azure DDoS Protection ne protège pas la couche 7 : une injection SQL est une attaque de la couche application." }
        ipp: { en: "Both DDoS tiers work at layers 3 and 4; neither one inspects the content of HTTP requests.", fr: "Les deux niveaux DDoS travaillent aux couches 3 et 4 ; aucun n'inspecte le contenu des requêtes HTTP." }
        nsg: { en: "Denying port 443 would cut off every customer of the store, not only the malicious requests.", fr: "Refuser le port 443 couperait tous les clients de la boutique, pas seulement les requêtes malveillantes." }
    references:
      - title: What is Azure Web Application Firewall on Azure Application Gateway?
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
      - title: Describe Azure DDoS protection
        url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/2-describe-azure-ddos-protection

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-31-10
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a hub virtual network that contains Azure Firewall Standard and is peered with a spoke virtual network. The spoke contains a subnet named Web and a subnet named Data. A network security group named NSG-Data is associated with the Data subnet. NSG-Data contains its default rules and one custom inbound rule, with priority 4096, that denies all traffic from the Web subnet.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un réseau virtuel hub qui contient un Pare-feu Azure Standard et qui est relié par peering à un réseau virtuel spoke. Le spoke contient un sous-réseau nommé Web et un sous-réseau nommé Data. Un groupe de sécurité réseau nommé NSG-Data est associé au sous-réseau Data. NSG-Data contient ses règles par défaut et une règle entrante personnalisée, de priorité 4096, qui refuse tout le trafic venant du sous-réseau Web.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The custom rule of NSG-Data is processed before the default rule that allows inbound traffic from the virtual network.", fr: "La règle personnalisée de NSG-Data est traitée avant la règle par défaut qui autorise le trafic entrant venant du réseau virtuel." } }
        - { id: s2, text: { en: "Adatum could give the custom rule priority 65100, so that it is processed after the default rules.", fr: "Adatum pourrait donner à la règle personnalisée la priorité 65100, pour qu'elle soit traitée après les règles par défaut." } }
        - { id: s3, text: { en: "Because the hub contains Azure Firewall, the default rules of NSG-Data no longer apply to the Data subnet.", fr: "Comme le hub contient le Pare-feu Azure, les règles par défaut de NSG-Data ne s'appliquent plus au sous-réseau Data." } }
    answer: { values: { s1: true, s2: false, s3: false } }
    explanation:
      correct:
        en: |
          Custom rules take a priority from 100 to 4096, and the default rules have priorities of 65000 and above, so even the highest allowed custom number, 4096, is processed before AllowVnetInBound (65000). The default rules can't be removed, only overridden by custom rules. An Azure Firewall in the hub complements the NSG with central filtering; it doesn't replace or disable the NSG's rules.
        fr: |
          Les règles personnalisées prennent une priorité de 100 à 4096, et les règles par défaut ont des priorités de 65000 et plus ; même le plus grand numéro personnalisé autorisé, 4096, est donc traité avant AllowVnetInBound (65000). Les règles par défaut ne peuvent pas être supprimées, seulement remplacées par des règles personnalisées. Un Pare-feu Azure dans le hub complète le NSG par un filtrage central ; il ne remplace ni ne désactive les règles du NSG.
      options:
        s2: { en: "A custom rule can't have a priority above 4096; the numbers from 65000 are reserved for the default rules.", fr: "Une règle personnalisée ne peut pas avoir une priorité supérieure à 4096 ; les numéros à partir de 65000 sont réservés aux règles par défaut." }
        s3: { en: "NSGs and Azure Firewall are used together for defense in depth: the NSG keeps filtering the traffic of the subnet with all its rules.", fr: "Les NSG et le Pare-feu Azure s'utilisent ensemble pour la défense en profondeur : le NSG continue de filtrer le trafic du sous-réseau avec toutes ses règles." }
    references:
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
      - title: Describe Azure Network Security Groups
        url: https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/6-describe-azure-network-security-groups
