chapter: 33-sentinel
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-33-01
    objective: "3.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A security operations platform has a SIEM part and a SOAR part.

        Which task belongs to the SIEM part?
      fr: |
        Une plateforme d'opérations de sécurité comporte une partie SIEM et une partie SOAR.

        Quelle tâche relève de la partie SIEM ?
    body:
      options:
        - { id: a, text: { en: "Running a predefined set of actions when a type of incident occurs", fr: "Exécuter un ensemble prédéfini d'actions quand un type d'incident se produit" } }
        - { id: b, text: { en: "Making the identity system and the ticketing tool act together", fr: "Faire agir ensemble le système d'identité et l'outil de tickets" } }
        - { id: c, text: { en: "Correlating firewall, server and sign-in events to raise an alert", fr: "Corréler les événements des pare-feux, des serveurs et des connexions pour émettre une alerte" } }
        - { id: d, text: { en: "Disabling a flagged account without waiting for an analyst", fr: "Désactiver un compte signalé sans attendre un analyste" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A SIEM collects logs and security events from the whole environment, correlates them and raises alerts that it groups into incidents: it provides visibility. Correlating events from firewalls, servers and identity systems is therefore a SIEM task.
        fr: |
          Un SIEM collecte les journaux et les événements de sécurité de tout l'environnement, les corrèle et émet des alertes qu'il regroupe en incidents : il apporte la visibilité. Corréler les événements des pare-feux, des serveurs et des systèmes d'identité est donc une tâche du SIEM.
      options:
        a: { en: "A predefined sequence of actions triggered by a type of incident is a playbook, which the SOAR part runs.", fr: "Une séquence prédéfinie d'actions déclenchée par un type d'incident est un playbook, que la partie SOAR exécute." }
        b: { en: "Making separate tools work together is orchestration, a SOAR capability.", fr: "Faire travailler ensemble des outils distincts relève de l'orchestration, une fonctionnalité du SOAR." }
        d: { en: "Acting on an alert without manual effort is automated response, the purpose of SOAR.", fr: "Agir sur une alerte sans effort manuel est la réponse automatisée, le but du SOAR." }
    references:
      - title: Define the concepts of SIEM and SOAR
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-33-02
    objective: "3.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum keeps a CSV list of the employees who left the company. The security team wants Microsoft Sentinel to correlate this list with the sign-in events it collects.

        Which Microsoft Sentinel feature should the team use?
      fr: |
        Adatum tient une liste CSV des employés qui ont quitté l'entreprise. L'équipe de sécurité veut que Microsoft Sentinel corrèle cette liste avec les événements de connexion qu'il collecte.

        Quelle fonctionnalité de Microsoft Sentinel l'équipe doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "A workbook", fr: "Un classeur (workbook)" } }
        - { id: b, text: { en: "A watchlist", fr: "Une watchlist" } }
        - { id: c, text: { en: "A notebook", fr: "Un notebook" } }
        - { id: d, text: { en: "A data connector", fr: "Un connecteur de données" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A watchlist holds your own reference data, such as high-value assets or terminated employees, imported for example from a CSV file. Microsoft Sentinel correlates it with the events of its environment, in rules, hunting queries and investigations.
        fr: |
          Une watchlist contient vos propres données de référence, comme les ressources de grande valeur ou les employés partis, importées par exemple d'un fichier CSV. Microsoft Sentinel la corrèle avec les événements de son environnement, dans les règles, les requêtes de repérage et les investigations.
      options:
        a: { en: "A workbook is an interactive visual report on the collected data; it doesn't hold a reference list to correlate.", fr: "Un classeur est un rapport visuel interactif sur les données collectées ; il ne contient pas de liste de référence à corréler." }
        c: { en: "A notebook is a Jupyter notebook for advanced analysis; it isn't the feature that stores reference data for correlation.", fr: "Un notebook est un notebook Jupyter pour l'analyse avancée ; ce n'est pas la fonctionnalité qui stocke des données de référence pour la corrélation." }
        d: { en: "A data connector ingests the logs of a product or service; a list kept by the team is brought in as a watchlist.", fr: "Un connecteur de données ingère les journaux d'un produit ou d'un service ; une liste tenue par l'équipe s'importe sous forme de watchlist." }
    references:
      - title: Watchlists in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/watchlists

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-33-03
    objective: "3.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware adds a firewall from a non-Microsoft vendor to its network. In Microsoft Sentinel, the team wants to deploy in a single step the data connector, analytics rules, workbooks and playbooks that are packaged for this firewall.

        What should the team use?
      fr: |
        Litware ajoute à son réseau un pare-feu d'un éditeur autre que Microsoft. Dans Microsoft Sentinel, l'équipe veut déployer en une seule étape le connecteur de données, les règles d'analyse, les classeurs et les playbooks empaquetés pour ce pare-feu.

        Que doit utiliser l'équipe ?
    body:
      options:
        - { id: a, text: { en: "An automation rule that runs on new incidents", fr: "Une règle d'automatisation qui s'exécute sur les nouveaux incidents" } }
        - { id: b, text: { en: "A workbook template for the firewall", fr: "Un modèle de classeur pour le pare-feu" } }
        - { id: c, text: { en: "A watchlist of the firewall addresses", fr: "Une watchlist des adresses du pare-feu" } }
        - { id: d, text: { en: "A solution from the content hub", fr: "Une solution du hub de contenu" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The content hub is the central place to find and deploy packaged content. A solution supports an end-to-end product scenario and can bundle data connectors, analytics rules, workbooks, hunting queries and playbooks, all deployed together.
        fr: |
          Le hub de contenu est l'endroit central où trouver et déployer du contenu empaqueté. Une solution couvre un scénario de bout en bout pour un produit et peut regrouper des connecteurs de données, des règles d'analyse, des classeurs, des requêtes de repérage et des playbooks, tous déployés ensemble.
      options:
        a: { en: "An automation rule handles incidents once they exist; it doesn't deploy connectors, rules or workbooks.", fr: "Une règle d'automatisation traite les incidents une fois qu'ils existent ; elle ne déploie ni connecteurs, ni règles, ni classeurs." }
        b: { en: "A workbook template only provides a report; the connector, rules and playbooks would still be missing.", fr: "Un modèle de classeur ne fournit qu'un rapport ; il manquerait encore le connecteur, les règles et les playbooks." }
        c: { en: "A watchlist imports reference data for correlation; it deploys no content.", fr: "Une watchlist importe des données de référence pour la corrélation ; elle ne déploie aucun contenu." }
    references:
      - title: Microsoft Sentinel out-of-the-box content overview
        url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-solutions

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-33-04
    objective: "3.3.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware is comparing SIEM and SOAR systems before it chooses a security operations platform. Its network team already runs firewalls at the edge of each site, and its analysts want to know what each kind of system would add on top of them.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware compare les systèmes SIEM et SOAR avant de choisir une plateforme d'opérations de sécurité. Son équipe réseau exploite déjà des pare-feux en bordure de chaque site, et ses analystes veulent savoir ce que chaque type de système ajouterait par-dessus.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A SIEM system can raise an alert by correlating a firewall event with a sign-in event from the identity system.", fr: "Un système SIEM peut émettre une alerte en corrélant un événement de pare-feu avec un événement de connexion du système d'identité." } }
        - { id: s2, text: { en: "A SIEM system sits at the network edge, where it blocks malicious traffic as a firewall does.", fr: "Un système SIEM se place en bordure du réseau, où il bloque le trafic malveillant comme le fait un pare-feu." } }
        - { id: s3, text: { en: "The main output of a SOAR system is an interactive view of what is happening in the environment.", fr: "Le résultat principal d'un système SOAR est une vue interactive de ce qui se passe dans l'environnement." } }
    answer: { values: { s1: true, s2: false, s3: false } }
    explanation:
      correct:
        en: |
          A SIEM gathers events from firewalls, servers, identity systems and applications, then correlates them to surface threats as alerts and incidents. Neither SIEM nor SOAR is a network control: they sit above the other security tools. SIEM brings visibility; SOAR brings speed, by automating the response to alerts.
        fr: |
          Un SIEM rassemble les événements des pare-feux, des serveurs, des systèmes d'identité et des applications, puis les corrèle pour faire ressortir les menaces sous forme d'alertes et d'incidents. Ni le SIEM ni le SOAR ne sont des contrôles réseau : ils se placent au-dessus des autres outils de sécurité. Le SIEM apporte la visibilité ; le SOAR apporte la vitesse, en automatisant la réponse aux alertes.
      options:
        s2: { en: "Blocking traffic at the edge is the role of a firewall; a SIEM collects and analyzes the firewall's logs.", fr: "Bloquer le trafic en bordure est le rôle d'un pare-feu ; un SIEM collecte et analyse les journaux du pare-feu." }
        s3: { en: "Visibility is what a SIEM provides; a SOAR system produces automated actions, such as disabling an account or opening a ticket.", fr: "La visibilité est ce que fournit un SIEM ; un système SOAR produit des actions automatisées, comme désactiver un compte ou ouvrir un ticket." }
    references:
      - title: Define the concepts of SIEM and SOAR
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-33-05
    objective: "3.3.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys uses Microsoft Sentinel and Microsoft Defender XDR in the Microsoft Defender portal. Its analysts triage the incidents of both products every morning by order of severity, and its engineers have built several playbooks in recent months to automate part of the response to phishing and to account compromise.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys utilise Microsoft Sentinel et Microsoft Defender XDR dans le portail Microsoft Defender. Ses analystes trient chaque matin les incidents des deux produits par ordre de gravité, et ses ingénieurs ont construit plusieurs playbooks ces derniers mois pour automatiser une partie de la réponse à l'hameçonnage et à la compromission de comptes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The analysts see the Microsoft Sentinel incidents and the Defender XDR incidents in the same incident queue.", fr: "Les analystes voient les incidents de Microsoft Sentinel et ceux de Defender XDR dans la même file d'attente d'incidents." } }
        - { id: s2, text: { en: "The Microsoft Sentinel playbooks of Tailspin Toys are Jupyter notebooks that run in Azure Machine Learning.", fr: "Les playbooks Microsoft Sentinel de Tailspin Toys sont des notebooks Jupyter qui s'exécutent dans Azure Machine Learning." } }
        - { id: s3, text: { en: "When they investigate an incident, the analysts can see the entities involved, such as users, devices and IP addresses.", fr: "Quand ils examinent un incident, les analystes peuvent voir les entités impliquées, comme les utilisateurs, les appareils et les adresses IP." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          In the Defender portal, Microsoft Sentinel uses the unified incident queue for SIEM and XDR. An incident brings together its alerts, the affected entities, a timeline and context, so that analysts can determine the scope and root cause of the attack. Playbooks are workflows built on Azure Logic Apps; Jupyter notebooks are a separate feature for advanced analysis.
        fr: |
          Dans le portail Defender, Microsoft Sentinel utilise la file d'attente d'incidents unifiée pour le SIEM et le XDR. Un incident réunit ses alertes, les entités concernées, une chronologie et du contexte, pour que les analystes déterminent l'étendue et la cause racine de l'attaque. Les playbooks sont des flux de travail construits sur Azure Logic Apps ; les notebooks Jupyter sont une fonctionnalité distincte pour l'analyse avancée.
      options:
        s2: { en: "Playbooks are Azure Logic Apps workflows that automate a response; notebooks run in Azure Machine Learning for analysis.", fr: "Les playbooks sont des flux de travail Azure Logic Apps qui automatisent une réponse ; les notebooks s'exécutent dans Azure Machine Learning pour l'analyse." }
    references:
      - title: Microsoft Sentinel in the Defender portal
        url: https://learn.microsoft.com/en-us/azure/sentinel/microsoft-sentinel-defender-portal
      - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-33-06
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys sends the logs of its on-premises Linux servers over Syslog, the logs of a non-Microsoft firewall and the activity logs of its AWS account to a single platform. The platform must correlate these sources to detect attacks that span them, and run automated responses.

        Which product should Wingtip Toys use?
      fr: |
        Wingtip Toys envoie vers une seule plateforme les journaux de ses serveurs Linux locaux par Syslog, les journaux d'un pare-feu d'un autre éditeur que Microsoft et les journaux d'activité de son compte AWS. La plateforme doit corréler ces sources pour détecter les attaques qui les traversent, et exécuter des réponses automatisées.

        Quel produit Wingtip Toys doit-elle utiliser ?
    body:
      options:
        - { id: a, text: "Microsoft Defender XDR" }
        - { id: b, text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" } }
        - { id: c, text: "Microsoft Sentinel" }
        - { id: d, text: { en: "Microsoft Defender for Cloud Apps", fr: "Microsoft Defender pour les applications cloud" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft Sentinel is a cloud-native SIEM and SOAR: its data connectors ingest Microsoft and non-Microsoft sources, including Syslog, Common Event Format and other clouds, its analytics rules correlate them, and its automation rules and playbooks automate the response. Collecting from every source and correlating across the organization is exactly the SIEM role.
        fr: |
          Microsoft Sentinel est un SIEM et un SOAR natif cloud : ses connecteurs de données ingèrent des sources Microsoft et non-Microsoft, dont Syslog, Common Event Format et d'autres clouds, ses règles d'analyse les corrèlent, et ses règles d'automatisation et ses playbooks automatisent la réponse. Collecter depuis toutes les sources et corréler à l'échelle de l'organisation est précisément le rôle d'un SIEM.
      options:
        a: { en: "Defender XDR protects specific domains (endpoints, identities, email, cloud apps) with its own services; it isn't the platform that ingests Syslog and non-Microsoft firewall logs.", fr: "Defender XDR protège des domaines précis (points de terminaison, identités, e-mail, applications cloud) avec ses propres services ; ce n'est pas la plateforme qui ingère Syslog et les journaux de pare-feux d'autres éditeurs." }
        b: { en: "Defender for Cloud protects cloud resources and workloads with posture management and workload protection; it doesn't collect and correlate the logs of every source.", fr: "Defender pour le cloud protège les ressources et les charges de travail cloud par la gestion de la posture et la protection des charges de travail ; il ne collecte ni ne corrèle les journaux de toutes les sources." }
        d: { en: "Defender for Cloud Apps is a cloud access security broker for SaaS apps; Linux servers and firewall logs are outside its scope.", fr: "Defender pour les applications cloud est un broker de sécurité d'accès au cloud pour les applications SaaS ; les serveurs Linux et les journaux de pare-feu sortent de son périmètre." }
    references:
      - title: What is Microsoft Sentinel security information and event management (SIEM)?
        url: https://learn.microsoft.com/en-us/azure/sentinel/overview

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-33-07
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A threat researcher at Woodgrove Bank wants to apply Python machine learning libraries to Microsoft Sentinel data and draw custom process trees that the built-in reports don't offer. The work must combine the Microsoft Sentinel data with an on-premises data set.

        Which Microsoft Sentinel feature meets these requirements?
      fr: |
        Une chercheuse en menaces de Woodgrove Bank veut appliquer des bibliothèques Python de machine learning aux données de Microsoft Sentinel et tracer des arborescences de processus personnalisées que les rapports intégrés n'offrent pas. Le travail doit combiner les données de Microsoft Sentinel avec un jeu de données local.

        Quelle fonctionnalité de Microsoft Sentinel répond à ces exigences ?
    body:
      options:
        - { id: a, text: { en: "Workbooks built from a custom template", fr: "Des classeurs créés à partir d'un modèle personnalisé" } }
        - { id: b, text: { en: "Hunting queries saved as detection rules", fr: "Des requêtes de repérage enregistrées comme règles de détection" } }
        - { id: c, text: { en: "Playbooks that call an external service", fr: "Des playbooks qui appellent un service externe" } }
        - { id: d, text: { en: "Notebooks that run in Azure Machine Learning", fr: "Des notebooks qui s'exécutent dans Azure Machine Learning" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Microsoft Sentinel notebooks are Jupyter notebooks that run on the Azure Machine Learning platform. They combine full programmability with Python libraries for machine learning, visualization and data analysis, so they cover analytics and visualizations that aren't provided out of the box, and they can integrate data sources outside Microsoft Sentinel.
        fr: |
          Les notebooks de Microsoft Sentinel sont des notebooks Jupyter qui s'exécutent sur la plateforme Azure Machine Learning. Ils combinent une programmabilité complète et des bibliothèques Python de machine learning, de visualisation et d'analyse de données : ils couvrent donc les analyses et les visualisations qui ne sont pas fournies d'origine, et ils peuvent intégrer des sources de données extérieures à Microsoft Sentinel.
      options:
        a: { en: "Workbooks are interactive visual reports on the collected data; they don't run Python machine learning code.", fr: "Les classeurs sont des rapports visuels interactifs sur les données collectées ; ils n'exécutent pas de code Python de machine learning." }
        b: { en: "Hunting queries search the collected data for suspicious activity; turning them into rules creates alerts, not machine learning analysis.", fr: "Les requêtes de repérage recherchent des activités suspectes dans les données collectées ; les transformer en règles crée des alertes, pas une analyse par machine learning." }
        c: { en: "Playbooks are Logic Apps workflows that automate a response to incidents; they aren't an analysis environment.", fr: "Les playbooks sont des flux de travail Logic Apps qui automatisent une réponse aux incidents ; ce ne sont pas un environnement d'analyse." }
    references:
      - title: Jupyter notebooks with Microsoft Sentinel hunting capabilities
        url: https://learn.microsoft.com/en-us/azure/sentinel/notebooks

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-33-08
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam ingests its firewall logs into Microsoft Sentinel. The logs of the last few weeks must trigger analytics rules in near real time. The same logs must also be kept for seven years, at the lowest possible cost, for investigations of long-running threats.

        Which two Microsoft Sentinel components should store the logs? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam ingère ses journaux de pare-feu dans Microsoft Sentinel. Les journaux des dernières semaines doivent déclencher les règles d'analyse en temps quasi réel. Les mêmes journaux doivent aussi être conservés sept ans, au coût le plus bas possible, pour les investigations sur les menaces de longue durée.

        Quels sont les deux composants de Microsoft Sentinel qui doivent stocker les journaux ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A watchlist", fr: "Une watchlist" } }
        - { id: b, text: { en: "The analytics tier", fr: "Le niveau analytique" } }
        - { id: c, text: { en: "A workbook", fr: "Un classeur (workbook)" } }
        - { id: d, text: { en: "The data lake tier", fr: "Le niveau lac de données" } }
        - { id: e, text: { en: "The content hub", fr: "Le hub de contenu" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The analytics tier, a Log Analytics workspace, is where analytics rules run for real-time alerting and incident management. The data lake tier is the cost-effective storage layer for long-term retention of security data, beside the analytics tier, which supports investigations that need years of history.
        fr: |
          Le niveau analytique, un espace de travail Log Analytics, est l'endroit où s'exécutent les règles d'analyse pour les alertes en temps réel et la gestion des incidents. Le niveau lac de données est la couche de stockage économique pour la conservation à long terme des données de sécurité, à côté du niveau analytique, ce qui permet les investigations qui demandent des années d'historique.
      options:
        a: { en: "A watchlist holds reference data that the team imports, such as a list of assets; it isn't a store for ingested logs.", fr: "Une watchlist contient des données de référence que l'équipe importe, comme une liste de ressources ; ce n'est pas un stockage pour les journaux ingérés." }
        c: { en: "A workbook visualizes data that is stored elsewhere; it stores no logs.", fr: "Un classeur visualise des données stockées ailleurs ; il ne stocke aucun journal." }
        e: { en: "The content hub deploys packaged solutions; it doesn't store security data.", fr: "Le hub de contenu déploie des solutions empaquetées ; il ne stocke pas de données de sécurité." }
    references:
      - title: What is Microsoft Sentinel data lake?
        url: https://learn.microsoft.com/en-us/azure/sentinel/datalake/sentinel-lake-overview
      - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-33-09
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        The security team of Northwind Traders reviews how Microsoft Sentinel finds threats and how it reports its own coverage.

        Match each Microsoft Sentinel capability to the situation it handles. To answer, drag the appropriate capability to each situation. Each capability may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe de sécurité de Northwind Traders passe en revue la façon dont Microsoft Sentinel trouve les menaces et rend compte de sa propre couverture.

        Associez chaque fonctionnalité de Microsoft Sentinel à la situation qu'elle traite. Pour répondre, faites glisser la fonctionnalité appropriée vers chaque situation. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: rule, text: { en: "Rule-based detection", fr: "Détection par règles" } }
        - { id: ml, text: { en: "Machine learning detection", fr: "Détection par machine learning" } }
        - { id: ti, text: { en: "Threat intelligence matching", fr: "Correspondance avec le renseignement sur les menaces" } }
        - { id: mitre, text: { en: "MITRE ATT&CK coverage", fr: "Couverture MITRE ATT&CK" } }
        - { id: watch, text: { en: "Watchlists", fr: "Watchlists" } }
        - { id: hunt, text: { en: "Hunting", fr: "Repérage (hunting)" } }
      targets:
        - { id: t1, text: { en: "An account that has always worked during office hours suddenly downloads large volumes of data at night; nobody defined a threshold for this", fr: "Un compte qui a toujours travaillé aux heures de bureau télécharge soudain de gros volumes de données la nuit ; personne n'a défini de seuil pour cela" } }
        - { id: t2, text: { en: "A server connects to a domain that appears in a feed of known malicious domains", fr: "Un serveur se connecte à un domaine qui figure dans un flux de domaines connus comme malveillants" } }
        - { id: t3, text: { en: "The team wants an alert when one account fails to sign in more than 50 times in five minutes", fr: "L'équipe veut une alerte quand un compte échoue à se connecter plus de 50 fois en cinq minutes" } }
        - { id: t4, text: { en: "The manager asks which attacker techniques the current rules detect and which ones they miss", fr: "Le responsable demande quelles techniques d'attaque les règles actuelles détectent et lesquelles leur échappent" } }
    answer: { mapping: { t1: ml, t2: ti, t3: rule, t4: mitre } }
    explanation:
      correct:
        en: |
          Machine learning detection learns behavioral baselines and flags deviations, without a threshold written by the team. Threat intelligence matching compares the collected data with feeds of known malicious IP addresses, domains and URLs. A condition defined by the team is rule-based detection, through an analytics rule. The MITRE ATT&CK view maps the detection coverage to attacker techniques and shows the gaps.
        fr: |
          La détection par machine learning apprend des bases de référence comportementales et signale les écarts, sans seuil écrit par l'équipe. La correspondance avec le renseignement sur les menaces compare les données collectées avec des flux d'adresses IP, de domaines et d'URL connus comme malveillants. Une condition définie par l'équipe relève de la détection par règles, au moyen d'une règle d'analyse. La vue MITRE ATT&CK rapporte la couverture de détection aux techniques d'attaque et montre les lacunes.
      options:
        watch: { en: "A watchlist brings the team's own reference data into correlation; none of the situations is about a list kept by the team.", fr: "Une watchlist apporte les données de référence de l'équipe dans la corrélation ; aucune des situations ne porte sur une liste tenue par l'équipe." }
        hunt: { en: "Hunting is a proactive search by an analyst; each situation here is handled by a detection or a coverage view, without an analyst searching.", fr: "Le repérage est une recherche proactive menée par un analyste ; chaque situation ici est traitée par une détection ou une vue de couverture, sans qu'un analyste cherche." }
    references:
      - title: Describe threat detection and mitigation capabilities in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/3-describe-sentinel-provide-integrated-threat-management

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-33-10
    objective: "3.3.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso uses Microsoft Sentinel as its SIEM and SOAR solution. The security architect is writing a document that explains which part of the platform handles each step, from the first alert to the last remediation action, and how the automation is triggered.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise Microsoft Sentinel comme solution SIEM et SOAR. L'architecte de sécurité rédige un document qui explique quelle partie de la plateforme traite chaque étape, de la première alerte à la dernière action de correction, et comment l'automatisation est déclenchée.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "When an analytics rule groups related alerts into one incident, Microsoft Sentinel is performing a SOAR function.", fr: "Quand une règle d'analyse regroupe des alertes liées en un incident, Microsoft Sentinel remplit une fonction SOAR." } }
        - { id: s2, text: { en: "An automation rule can run when an existing incident is updated, not only when an incident is created.", fr: "Une règle d'automatisation peut s'exécuter quand un incident existant est mis à jour, pas seulement quand un incident est créé." } }
        - { id: s3, text: { en: "A playbook can act on a system outside Microsoft Sentinel, such as an IT service management tool.", fr: "Un playbook peut agir sur un système extérieur à Microsoft Sentinel, comme un outil de gestion des services informatiques." } }
    answer: { values: { s1: false, s2: true, s3: true } }
    explanation:
      correct:
        en: |
          Correlating alerts and creating incidents are SIEM functions, even inside a product that is also a SOAR; the SOAR side starts when automation acts on the incident. Automation rules run when incidents are created or updated. Playbooks are built on Azure Logic Apps and integrate with internal and external systems, for example to open a ticket.
        fr: |
          Corréler les alertes et créer des incidents sont des fonctions du SIEM, même dans un produit qui est aussi un SOAR ; le côté SOAR commence quand l'automatisation agit sur l'incident. Les règles d'automatisation s'exécutent quand des incidents sont créés ou mis à jour. Les playbooks sont construits sur Azure Logic Apps et s'intègrent avec des systèmes internes et externes, par exemple pour ouvrir un ticket.
      options:
        s1: { en: "Grouping alerts into incidents is part of detection, the SIEM side; SOAR covers the automated response that follows.", fr: "Regrouper les alertes en incidents fait partie de la détection, le côté SIEM ; le SOAR couvre la réponse automatisée qui suit." }
    references:
      - title: "Automation in Microsoft Sentinel: Security orchestration, automation, and response (SOAR)"
        url: https://learn.microsoft.com/en-us/azure/sentinel/automation/automation
      - title: Define the concepts of SIEM and SOAR
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/2-define-concepts-of-siem-soar
