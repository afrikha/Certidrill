chapter: 42-purview-compliance-management
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An administrator of Wingtip Toys selects View all solutions on the home page of the Microsoft Purview portal to open Compliance Manager.

        In which group of solutions is Compliance Manager listed?
      fr: |
        Un administrateur de Wingtip Toys sélectionne Afficher toutes les solutions sur la page d'accueil du portail Microsoft Purview pour ouvrir le Gestionnaire de conformité.

        Dans quel groupe de solutions le Gestionnaire de conformité figure-t-il ?
    body:
      options:
        - { id: a, text: { en: "Data Security", fr: "Sécurité des données (Data Security)" } }
        - { id: b, text: { en: "Data Governance", fr: "Gouvernance des données (Data Governance)" } }
        - { id: c, text: { en: "Risk & Compliance", fr: "Risque et conformité (Risk & Compliance)" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Compliance Manager is a solution of the Risk & Compliance set of the Microsoft Purview portal, next to solutions such as eDiscovery, Audit and Communication Compliance. These solutions help the organization meet its legal and regulatory obligations.
        fr: |
          Le Gestionnaire de conformité est une solution de l'ensemble Risque et conformité du portail Microsoft Purview, à côté de solutions comme eDiscovery, Audit et la conformité des communications. Ces solutions aident l'organisation à respecter ses obligations légales et réglementaires.
      options:
        a: { en: "Data Security groups the solutions that protect sensitive data, such as Information Protection, Data Loss Prevention and Insider Risk Management.", fr: "Sécurité des données regroupe les solutions qui protègent les données sensibles, comme la protection des informations, la protection contre la perte de données et la gestion des risques internes." }
        b: { en: "Data Governance groups Data Map and Unified Catalog, which discover and govern data across the data estate.", fr: "Gouvernance des données regroupe Data Map et Unified Catalog, qui découvrent et gouvernent les données de tout le patrimoine de données." }
    references:
      - title: Describe Compliance Manager
        url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-42-02
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys wants to measure its compliance with the GDPR in Compliance Manager, starting from a prebuilt template instead of writing its own controls.

        Which page of Compliance Manager lists the available templates?
      fr: |
        Tailspin Toys veut mesurer sa conformité au RGPD dans le Gestionnaire de conformité, en partant d'un modèle prédéfini plutôt qu'en écrivant ses propres contrôles.

        Quelle page du Gestionnaire de conformité liste les modèles disponibles ?
    body:
      options:
        - { id: a, text: { en: "Overview", fr: "Vue d'ensemble (Overview)" } }
        - { id: b, text: { en: "Improvement actions", fr: "Actions d'amélioration (Improvement actions)" } }
        - { id: c, text: { en: "Regulations", fr: "Réglementations (Regulations)" } }
        - { id: d, text: { en: "My Library", fr: "Ma bibliothèque (My Library)" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Regulations page lists the regulations and certifications for which Compliance Manager provides templates to create assessments: more than 360 of them. An organization can also create custom templates when no prebuilt one fits.
        fr: |
          La page Réglementations liste les réglementations et les certifications pour lesquelles le Gestionnaire de conformité fournit des modèles servant à créer des évaluations : plus de 360. Une organisation peut aussi créer des modèles personnalisés quand aucun modèle prédéfini ne convient.
      options:
        a: { en: "The overview page shows the current compliance score and what needs attention; it isn't the list of templates.", fr: "La page de vue d'ensemble montre le score de conformité actuel et ce qui demande de l'attention ; ce n'est pas la liste des modèles." }
        b: { en: "Improvement actions are the recommended guidance to meet controls once an assessment exists; they aren't templates.", fr: "Les actions d'amélioration sont les recommandations qui aident à satisfaire les contrôles une fois qu'une évaluation existe ; ce ne sont pas des modèles." }
        d: { en: "My Library is a feature of the Service Trust Portal that saves Microsoft's compliance documents; it isn't part of Compliance Manager.", fr: "Ma bibliothèque est une fonctionnalité du Portail d'approbation des services qui enregistre les documents de conformité de Microsoft ; elle ne fait pas partie du Gestionnaire de conformité." }
    references:
      - title: Microsoft Purview Compliance Manager
        url: https://learn.microsoft.com/en-us/purview/compliance-manager
      - title: Describe Compliance Manager
        url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-42-03
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Among Litware's open improvement actions in Compliance Manager is the encryption of information at rest. Litware wants to know how this action is classified, because the classification affects the points it brings to the compliance score.

        Which type of action is it?
      fr: |
        Parmi les actions d'amélioration ouvertes de Litware dans le Gestionnaire de conformité figure le chiffrement des informations au repos. Litware veut savoir comment cette action est classée, car le classement influe sur les points qu'elle apporte au score de conformité.

        De quel type d'action s'agit-il ?
    body:
      options:
        - { id: a, text: { en: "Preventative", fr: "Préventive" } }
        - { id: b, text: { en: "Detective", fr: "Détective" } }
        - { id: c, text: { en: "Corrective", fr: "Corrective" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A preventative action addresses a specific risk before it happens; encrypting data at rest is the example that Microsoft gives. Preventative actions carry the most points: 27 when mandatory, 9 when discretionary.
        fr: |
          Une action préventive traite un risque précis avant qu'il ne se produise ; le chiffrement des données au repos est l'exemple que donne Microsoft. Les actions préventives rapportent le plus de points : 27 quand elles sont obligatoires, 9 quand elles sont discrétionnaires.
      options:
        b: { en: "A detective action monitors systems to find irregular conditions or breaches, for example access auditing; encryption doesn't monitor anything.", fr: "Une action détective surveille les systèmes pour repérer des conditions anormales ou des violations, par exemple l'audit des accès ; le chiffrement ne surveille rien." }
        c: { en: "A corrective action limits the damage of an incident that has happened, for example incident response; encryption at rest acts before any incident.", fr: "Une action corrective limite les dégâts d'un incident survenu, par exemple la réponse aux incidents ; le chiffrement au repos agit avant tout incident." }
    references:
      - title: Compliance Manager scoring
        url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-42-04
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum's compliance team is about to create its first assessment in Compliance Manager, for the ISO 27001 standard. Five engineers will share the work, and an external auditor will review the results next spring, so the team lead wants everyone to understand how controls, improvement actions and assessments fit together before any work is assigned.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe de conformité d'Adatum s'apprête à créer sa première évaluation dans le Gestionnaire de conformité, pour la norme ISO 27001. Cinq ingénieurs se partageront le travail et un auditeur externe examinera les résultats au printemps prochain : la responsable de l'équipe veut donc que chacun comprenne comment s'articulent contrôles, actions d'amélioration et évaluations avant que le moindre travail ne soit attribué.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A control covers system configuration only; organizational processes and the people responsible are outside its scope.", fr: "Un contrôle couvre uniquement la configuration des systèmes ; les processus de l'organisation et les personnes responsables sont hors de son périmètre." } }
        - { id: s2, text: { en: "An improvement action can be assigned to a user, but the evidence of its implementation must be kept outside Compliance Manager.", fr: "Une action d'amélioration peut être attribuée à un utilisateur, mais les preuves de son implémentation doivent être conservées en dehors du Gestionnaire de conformité." } }
        - { id: s3, text: { en: "The assessment will contain Microsoft managed controls, shared controls and customer managed controls.", fr: "L'évaluation contiendra des contrôles gérés par Microsoft, des contrôles partagés et des contrôles gérés par le client." } }
    answer: { values: { s1: false, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          A control is a requirement of a regulation, standard or policy that defines how to assess and manage system configuration, organizational process and the people responsible for meeting it. An improvement action can be assigned to a user and stores its implementation status, notes and evidence inside Compliance Manager. An assessment groups the controls of a standard, split into Microsoft managed controls, your (customer managed) controls and shared controls.
        fr: |
          Un contrôle est une exigence d'une réglementation, d'une norme ou d'une stratégie qui définit comment évaluer et gérer la configuration des systèmes, les processus de l'organisation et les personnes chargées de la satisfaire. Une action d'amélioration peut être attribuée à un utilisateur et conserve son état d'implémentation, ses notes et ses preuves dans le Gestionnaire de conformité. Une évaluation regroupe les contrôles d'une norme, répartis en contrôles gérés par Microsoft, vos contrôles (gérés par le client) et contrôles partagés.
    references:
      - title: Microsoft Purview Compliance Manager
        url: https://learn.microsoft.com/en-us/purview/compliance-manager

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-42-05
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Proseware gives its data protection team access to the Microsoft Purview portal, and to no other Microsoft admin portal.

        Which two tasks can the team perform?

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware donne à son équipe de protection des données l'accès au portail Microsoft Purview, et à aucun autre portail d'administration Microsoft.

        Quelles sont les deux tâches que l'équipe peut effectuer ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create and publish sensitivity labels", fr: "Créer et publier des étiquettes de confidentialité" } }
        - { id: b, text: { en: "Reset the password of a user account", fr: "Réinitialiser le mot de passe d'un compte d'utilisateur" } }
        - { id: c, text: { en: "Discover data assets in Unified Catalog", fr: "Découvrir des ressources de données dans Unified Catalog" } }
        - { id: d, text: { en: "Run advanced hunting queries on endpoint events", fr: "Exécuter des requêtes de repérage avancé sur les événements des points de terminaison" } }
        - { id: e, text: { en: "Create a Conditional Access policy for administrators", fr: "Créer une stratégie d'accès conditionnel pour les administrateurs" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The Microsoft Purview portal is the single entry point to the data security, data governance and risk and compliance solutions. Sensitivity labels belong to Information Protection (data security), and data asset discovery is in Unified Catalog (data governance), which replaces the search and browse features of the classic governance portal.
        fr: |
          Le portail Microsoft Purview est le point d'entrée unique des solutions de sécurité des données, de gouvernance des données et de risque et conformité. Les étiquettes de confidentialité relèvent de la protection des informations (sécurité des données), et la découverte des ressources de données se fait dans Unified Catalog (gouvernance des données), qui remplace les fonctionnalités de recherche et de navigation du portail de gouvernance classique.
      options:
        b: { en: "User accounts, groups and their passwords are managed in the Microsoft Entra admin center, not in the Purview portal.", fr: "Les comptes d'utilisateurs, les groupes et leurs mots de passe se gèrent dans le Centre d'administration Microsoft Entra, pas dans le portail Purview." }
        d: { en: "Advanced hunting, like incidents and alerts, is in the Microsoft Defender portal.", fr: "Le repérage avancé, comme les incidents et les alertes, se trouve dans le portail Microsoft Defender." }
        e: { en: "Conditional Access policies are created in the Microsoft Entra admin center.", fr: "Les stratégies d'accès conditionnel se créent dans le Centre d'administration Microsoft Entra." }
    references:
      - title: Learn about the Microsoft Purview portal
        url: https://learn.microsoft.com/en-us/purview/purview-portal

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-42-06
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam's board asks the compliance officer what the compliance score of Compliance Manager can be used for, and what it can't. She wants to list only the uses that Microsoft describes for the score.

        Which two uses should she list?

        NOTE: Each correct selection is worth one point.
      fr: |
        Le conseil d'administration de Fabrikam demande à la responsable de la conformité à quoi peut servir le score de conformité du Gestionnaire de conformité, et à quoi il ne sert pas. Elle veut lister uniquement les usages que Microsoft décrit pour ce score.

        Quels sont les deux usages qu'elle doit lister ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Track the progress of compliance over time", fr: "Suivre l'avancement de la conformité dans le temps" } }
        - { id: b, text: { en: "Prove to a regulator that Fabrikam is compliant", fr: "Prouver à un régulateur que Fabrikam est conforme" } }
        - { id: c, text: { en: "Report compliance status to leadership and auditors", fr: "Rendre compte de l'état de conformité à la direction et aux auditeurs" } }
        - { id: d, text: { en: "Measure the security posture of devices and apps", fr: "Mesurer la posture de sécurité des appareils et des applications" } }
        - { id: e, text: { en: "Implement the remaining improvement actions automatically", fr: "Implémenter automatiquement les actions d'amélioration restantes" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Microsoft describes four uses of the compliance score: understand the compliance posture at a glance, prioritize the actions with the highest potential impact, track progress over time as controls are implemented, and report the status to leadership, auditors and other stakeholders.
        fr: |
          Microsoft décrit quatre usages du score de conformité : comprendre la posture de conformité d'un coup d'œil, hiérarchiser les actions qui ont le plus fort impact potentiel, suivre l'avancement dans le temps à mesure que les contrôles sont implémentés, et rendre compte de l'état à la direction, aux auditeurs et aux autres parties prenantes.
      options:
        b: { en: "The score measures progress on recommended actions; it isn't an absolute measure of compliance and guarantees nothing to a regulator.", fr: "Le score mesure l'avancement des actions recommandées ; ce n'est pas une mesure absolue de la conformité et il ne garantit rien à un régulateur." }
        d: { en: "The security posture of identities, apps and devices is measured by Microsoft Secure Score in the Microsoft Defender portal.", fr: "La posture de sécurité des identités, des applications et des appareils est mesurée par le Degré de sécurisation Microsoft (Microsoft Secure Score) dans le portail Microsoft Defender." }
        e: { en: "Compliance Manager gives step-by-step guidance and updates the status of technical actions it detects, but the organization implements its own actions.", fr: "Le Gestionnaire de conformité donne des conseils pas à pas et met à jour l'état des actions techniques qu'il détecte, mais c'est l'organisation qui implémente ses propres actions." }
    references:
      - title: Describe Compliance Manager
        url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
      - title: Compliance Manager scoring
        url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-42-07
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso and Fabrikam each have their own Microsoft 365 tenant. In each tenant, an administrator who belongs to exactly the same Microsoft Purview role groups signs in to the Microsoft Purview portal. On the home page, Fabrikam's administrator sees a solution card for Communication Compliance, but Contoso's administrator doesn't.

        What is the most likely cause?
      fr: |
        Contoso et Fabrikam ont chacune leur propre locataire Microsoft 365. Dans chaque locataire, un administrateur qui appartient exactement aux mêmes groupes de rôles Microsoft Purview se connecte au portail Microsoft Purview. Sur la page d'accueil, l'administrateur de Fabrikam voit une carte de solution pour la conformité des communications, mais pas celui de Contoso.

        Quelle est la cause la plus probable ?
    body:
      options:
        - { id: a, text: { en: "Contoso's administrator hasn't pinned this card to the home page.", fr: "L'administrateur de Contoso n'a pas épinglé cette carte sur la page d'accueil." } }
        - { id: b, text: { en: "Contoso hasn't created any assessment in Compliance Manager yet.", fr: "Contoso n'a encore créé aucune évaluation dans le Gestionnaire de conformité." } }
        - { id: c, text: { en: "Contoso's administrator hasn't taken the guided tour of the portal.", fr: "L'administrateur de Contoso n'a pas suivi la visite guidée du portail." } }
        - { id: d, text: { en: "Contoso's subscription doesn't include Communication Compliance.", fr: "L'abonnement de Contoso n'inclut pas la conformité des communications." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The solution cards of the home page show only the solutions that the user's permissions and the organization's subscription give access to. The two administrators have the same role groups, so their permissions are the same: the difference comes from the subscriptions of the two tenants.
        fr: |
          Les cartes de solution de la page d'accueil ne montrent que les solutions auxquelles donnent accès les autorisations de l'utilisateur et l'abonnement de l'organisation. Les deux administrateurs ont les mêmes groupes de rôles, donc les mêmes autorisations : la différence vient des abonnements des deux locataires.
      options:
        a: { en: "The solution cards of the home page can't be customized; they depend on permissions and subscription.", fr: "Les cartes de solution de la page d'accueil ne peuvent pas être personnalisées ; elles dépendent des autorisations et de l'abonnement." }
        b: { en: "Compliance Manager assessments feed the compliance posture summary; they don't decide which solution cards appear.", fr: "Les évaluations du Gestionnaire de conformité alimentent le résumé de la posture de conformité ; elles ne décident pas des cartes de solution affichées." }
        c: { en: "Guided tours are help content; they don't unlock any solution in the portal.", fr: "Les visites guidées sont du contenu d'aide ; elles ne débloquent aucune solution dans le portail." }
    references:
      - title: Learn about the Microsoft Purview portal
        url: https://learn.microsoft.com/en-us/purview/purview-portal

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-42-08
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has just started to use Compliance Manager and hasn't completed any improvement action yet. In a monthly risk meeting, the compliance officer explains how the compliance score is built to the CISO, who already follows Microsoft Secure Score in the Microsoft Defender portal and wonders whether the two numbers overlap.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam vient de commencer à utiliser le Gestionnaire de conformité et n'a encore réalisé aucune action d'amélioration. Lors d'une réunion mensuelle sur les risques, la responsable de la conformité explique comment est construit le score de conformité au RSSI, qui suit déjà le Degré de sécurisation Microsoft (Microsoft Secure Score) dans le portail Microsoft Defender et se demande si les deux chiffres se recoupent.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Fabrikam's compliance score can already include points, although Fabrikam hasn't completed any action.", fr: "Le score de conformité de Fabrikam peut déjà inclure des points, bien que Fabrikam n'ait réalisé aucune action." } }
        - { id: s2, text: { en: "Microsoft Secure Score and the compliance score are the same score, displayed in two different portals.", fr: "Le Degré de sécurisation Microsoft et le score de conformité sont un même score, affiché dans deux portails différents." } }
        - { id: s3, text: { en: "When Fabrikam completes an action that it manages, the points are added to the part of the score called your points.", fr: "Quand Fabrikam réalise une action qu'elle gère, les points s'ajoutent à la partie du score appelée vos points." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          The compliance score combines Microsoft-managed points, earned by the actions that Microsoft has already completed as the cloud service provider, and your points, earned by the actions that the organization completes. A new organization can therefore have points before it completes anything. Microsoft Secure Score is a different measure: it rates the security posture in the Defender portal, while the compliance score tracks progress on data protection and regulatory actions in Compliance Manager.
        fr: |
          Le score de conformité combine les points gérés par Microsoft, obtenus par les actions que Microsoft a déjà réalisées en tant que fournisseur de services cloud, et vos points, obtenus par les actions que l'organisation réalise. Une nouvelle organisation peut donc avoir des points avant d'avoir réalisé quoi que ce soit. Le Degré de sécurisation Microsoft est une autre mesure : il évalue la posture de sécurité dans le portail Defender, alors que le score de conformité suit l'avancement des actions de protection des données et de conformité réglementaire dans le Gestionnaire de conformité.
    references:
      - title: Describe Compliance Manager
        url: https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/4-describe-compliance-manager
      - title: Microsoft Secure Score
        url: https://learn.microsoft.com/en-us/defender-xdr/microsoft-secure-score

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-42-09
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has three assessments in Compliance Manager: the default data protection baseline, ISO 27001 and NIST CSF. Before an ISO 27001 surveillance audit, the CISO wants to know how far Fabrikam itself has progressed on ISO 27001, and on that standard only.

        What should the CISO review?
      fr: |
        Fabrikam a trois évaluations dans le Gestionnaire de conformité : la base de référence de protection des données par défaut, ISO 27001 et NIST CSF. Avant un audit de surveillance ISO 27001, le RSSI veut savoir où en est Fabrikam elle-même sur ISO 27001, et sur cette seule norme.

        Que doit examiner le RSSI ?
    body:
      options:
        - { id: a, text: { en: "The overall compliance score on the dashboard", fr: "Le score de conformité global du tableau de bord" } }
        - { id: b, text: { en: "The assessment score of the ISO 27001 assessment", fr: "Le score d'évaluation de l'évaluation ISO 27001" } }
        - { id: c, text: { en: "The ISO/IEC 27001 report in the Service Trust Portal", fr: "Le rapport ISO/IEC 27001 du Portail d'approbation des services" } }
        - { id: d, text: { en: "The Microsoft Secure Score of the Fabrikam tenant", fr: "Le Degré de sécurisation Microsoft du locataire de Fabrikam" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Each assessment groups the controls of one regulation or standard and has its own assessment score, which shows the progress toward the total possible points of that assessment. The ISO 27001 assessment score isolates the standard that the audit covers.
        fr: |
          Chaque évaluation regroupe les contrôles d'une réglementation ou d'une norme et a son propre score d'évaluation, qui montre l'avancement par rapport au total des points possibles de cette évaluation. Le score de l'évaluation ISO 27001 isole la norme que couvre l'audit.
      options:
        a: { en: "The overall compliance score combines the improvement actions of all the assessments, including the baseline and NIST CSF.", fr: "Le score de conformité global combine les actions d'amélioration de toutes les évaluations, dont la base de référence et NIST CSF." }
        c: { en: "The audit reports of the Service Trust Portal certify Microsoft cloud services, not the progress of Fabrikam's own controls.", fr: "Les rapports d'audit du Portail d'approbation des services certifient les services cloud Microsoft, pas l'avancement des propres contrôles de Fabrikam." }
        d: { en: "Microsoft Secure Score measures the security posture in the Defender portal; it isn't organized by regulation or standard.", fr: "Le Degré de sécurisation Microsoft mesure la posture de sécurité dans le portail Defender ; il n'est pas organisé par réglementation ou par norme." }
    references:
      - title: Microsoft Purview Compliance Manager
        url: https://learn.microsoft.com/en-us/purview/compliance-manager

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-42-10
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has two open improvement actions in Compliance Manager. Action1 is preventative: a policy asks users to lock their computer when they leave it unattended. Action2 is detective: system access auditing, enforced centrally so that nobody can bypass it.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a deux actions d'amélioration ouvertes dans le Gestionnaire de conformité. Action1 est préventive : une règle demande aux utilisateurs de verrouiller leur ordinateur quand ils le laissent sans surveillance. Action2 est détective : l'audit des accès aux systèmes, appliqué de façon centralisée pour que personne ne puisse le contourner.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Action1 is [[kind]].

          Completing Action1 adds [[more]] completing Action2.

          If Fabrikam replaces Action1 with a screen lock that is enforced centrally on every computer, the new action is worth [[value]] the current Action1.
        fr: |
          Action1 est [[kind]].

          La réalisation d'Action1 ajoute [[more]] celle d'Action2.

          Si Fabrikam remplace Action1 par un verrouillage d'écran appliqué de façon centralisée sur chaque ordinateur, la nouvelle action vaut [[value]] l'Action1 actuelle.
      slots:
        - id: kind
          options:
            - { id: mand, text: { en: "a mandatory action", fr: "une action obligatoire" } }
            - { id: disc, text: { en: "a discretionary action", fr: "une action discrétionnaire" } }
            - { id: msft, text: { en: "a Microsoft managed action", fr: "une action gérée par Microsoft" } }
        - id: more
          options:
            - { id: more, text: { en: "more points than", fr: "plus de points que" } }
            - { id: fewer, text: { en: "fewer points than", fr: "moins de points que" } }
            - { id: equal, text: { en: "the same number of points as", fr: "autant de points que" } }
        - id: value
          options:
            - { id: more, text: { en: "more points than", fr: "plus de points que" } }
            - { id: fewer, text: { en: "fewer points than", fr: "moins de points que" } }
            - { id: equal, text: { en: "the same number of points as", fr: "autant de points que" } }
    answer: { values: { kind: disc, more: more, value: more } }
    explanation:
      correct:
        en: |
          Action1 relies on users following a policy, so it is discretionary; a mandatory action can't be bypassed. Points depend first on the type of action: a preventative discretionary action is worth 9 points, more than a detective mandatory action (3 points), so Action1 adds more. A screen lock enforced centrally becomes a preventative mandatory action, worth 27 points, more than the 9 points of Action1.
        fr: |
          Action1 dépend du respect d'une règle par les utilisateurs : elle est donc discrétionnaire ; une action obligatoire ne peut pas être contournée. Les points dépendent d'abord du type d'action : une action préventive discrétionnaire vaut 9 points, plus qu'une action détective obligatoire (3 points), donc Action1 ajoute plus de points. Un verrouillage d'écran appliqué de façon centralisée devient une action préventive obligatoire, qui vaut 27 points, plus que les 9 points d'Action1.
      options:
        mand: { en: "A mandatory action can't be bypassed, like a centrally enforced setting; a policy that users may not follow is discretionary.", fr: "Une action obligatoire ne peut pas être contournée, comme un paramètre appliqué de façon centralisée ; une règle que les utilisateurs peuvent ne pas suivre est discrétionnaire." }
        fewer: { en: "For the second sentence, being mandatory doesn't outweigh the type: a detective mandatory action (3 points) is worth less than a preventative discretionary one (9 points).", fr: "Être obligatoire ne l'emporte pas sur le type : une action détective obligatoire (3 points) vaut moins qu'une action préventive discrétionnaire (9 points)." }
    references:
      - title: Compliance Manager scoring
        url: https://learn.microsoft.com/en-us/purview/compliance-manager-scoring
