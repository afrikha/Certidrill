chapter: 11-security-compliance-concepts
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-11-01
    objective: "1.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Two systems use symmetric encryption to protect the data that they exchange.

        What is the main difficulty of this type of encryption?
      fr: |
        Deux systèmes utilisent le chiffrement symétrique pour protéger les données qu'ils échangent.

        Quelle est la principale difficulté de ce type de chiffrement ?
    body:
      options:
        - { id: a, text: { en: "Encrypting large volumes of data quickly enough", fr: "Chiffrer de gros volumes de données assez rapidement" } }
        - { id: b, text: { en: "Keeping the private key separate from the public key", fr: "Garder la clé privée séparée de la clé publique" } }
        - { id: c, text: { en: "Sharing the secret key securely between the systems", fr: "Partager la clé secrète de façon sûre entre les systèmes" } }
        - { id: d, text: { en: "Recovering the original data from the encrypted data", fr: "Retrouver les données d'origine à partir des données chiffrées" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Symmetric encryption uses the same key to encrypt and to decrypt, so both systems must hold that secret key. Distributing it securely, especially over a network, is the main challenge of this type of encryption.
        fr: |
          Le chiffrement symétrique utilise la même clé pour chiffrer et pour déchiffrer : les deux systèmes doivent donc détenir cette clé secrète. La distribuer de façon sûre, en particulier sur un réseau, est la principale difficulté de ce type de chiffrement.
      options:
        a: { en: "Symmetric encryption is fast and suited to large volumes of data; speed is its strength, not its difficulty.", fr: "Le chiffrement symétrique est rapide et adapté aux gros volumes de données ; la vitesse est sa force, pas sa difficulté." }
        b: { en: "A public key and a private key belong to asymmetric encryption; symmetric encryption uses a single key.", fr: "Une clé publique et une clé privée relèvent du chiffrement asymétrique ; le chiffrement symétrique utilise une seule clé." }
        d: { en: "Encryption is reversible: the system that holds the key decrypts the data without difficulty.", fr: "Le chiffrement est réversible : le système qui détient la clé déchiffre les données sans difficulté." }
    references:
      - title: Describe encryption and hashing
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/5-describe-encryption-hashing

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-11-02
    objective: "1.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which term refers to adhering to the laws, regulations, standards and policies that apply to an organization?
      fr: |
        Quel terme désigne le respect des lois, réglementations, normes et stratégies qui s'appliquent à une organisation ?
    body:
      options:
        - { id: a, text: { en: "Governance", fr: "Gouvernance" } }
        - { id: b, text: { en: "Data privacy", fr: "Confidentialité des données" } }
        - { id: c, text: { en: "Risk management", fr: "Gestion des risques" } }
        - { id: d, text: { en: "Compliance", fr: "Conformité" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Compliance is the adherence to the laws, regulations, standards and policies that apply to an organization, depending on its industry, its geography and the data it handles. It sets minimum requirements; it isn't a synonym for security.
        fr: |
          La conformité est le respect des lois, réglementations, normes et stratégies qui s'appliquent à une organisation, selon son secteur, sa géographie et les données qu'elle traite. Elle fixe des exigences minimales ; ce n'est pas un synonyme de sécurité.
      options:
        a: { en: "Governance is the set of rules, practices and processes that an organization uses to direct and control its activities.", fr: "La gouvernance est l'ensemble des règles, pratiques et processus qu'une organisation utilise pour diriger et contrôler ses activités." }
        b: { en: "Data privacy is the appropriate handling of personal data, one of the subjects that regulations cover, not adherence to all of them.", fr: "La confidentialité des données est le traitement approprié des données personnelles, l'un des sujets que couvrent les réglementations, et non le respect de toutes les règles." }
        c: { en: "Risk management identifies, assesses and responds to threats that can affect the organization's objectives.", fr: "La gestion des risques identifie, évalue et traite les menaces qui peuvent affecter les objectifs de l'organisation." }
    references:
      - title: Describe governance, risk, and compliance (GRC) concepts
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/6-describe-compliance-concepts

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-11-03
    objective: "1.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is moving a web application to the cloud. Fabrikam wants the cloud provider to secure the operating system and the runtime environment, while Fabrikam keeps control of the application code and its configuration.

        Which cloud service model meets this requirement?
      fr: |
        Fabrikam migre une application web vers le cloud. Fabrikam veut que le fournisseur de cloud sécurise le système d'exploitation et l'environnement d'exécution, tandis que Fabrikam garde la maîtrise du code de l'application et de sa configuration.

        Quel modèle de service cloud répond à cette exigence ?
    body:
      options:
        - { id: a, text: { en: "Infrastructure as a service (IaaS)", fr: "IaaS (infrastructure as a service)" } }
        - { id: b, text: { en: "Platform as a service (PaaS)", fr: "PaaS (platform as a service)" } }
        - { id: c, text: { en: "Software as a service (SaaS)", fr: "SaaS (software as a service)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In PaaS, the provider secures the physical infrastructure and also takes on the operating system and the runtime environment. The customer remains responsible for its application code, its configuration, the access controls and its data, which is the split that Fabrikam wants.
        fr: |
          En PaaS, le fournisseur sécurise l'infrastructure physique et prend aussi en charge le système d'exploitation et l'environnement d'exécution. Le client reste responsable du code de son application, de sa configuration, des contrôles d'accès et de ses données : c'est la répartition que veut Fabrikam.
      options:
        a: { en: "In IaaS, the provider stops at the physical datacenter, the network hardware and the hosts: Fabrikam would still secure the operating system.", fr: "En IaaS, le fournisseur s'arrête au centre de données physique, au matériel réseau et aux hôtes : Fabrikam sécuriserait encore le système d'exploitation." }
        c: { en: "In SaaS, the provider manages the entire application stack: Fabrikam would use the provider's application instead of deploying its own code.", fr: "En SaaS, le fournisseur gère toute la pile applicative : Fabrikam utiliserait l'application du fournisseur au lieu de déployer son propre code." }
    references:
      - title: Describe the shared responsibility model
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/2-describe-shared-responsibility-model

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-11-04
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware publishes an installation file on its website, together with the hash value of the file. A customer downloads the file, computes its hash with the same algorithm, and gets exactly the published value.

        What does this result show?
      fr: |
        Proseware publie un fichier d'installation sur son site web, avec la valeur de hachage du fichier. Un client télécharge le fichier, calcule son hachage avec le même algorithme et obtient exactement la valeur publiée.

        Que montre ce résultat ?
    body:
      options:
        - { id: a, text: { en: "The file is encrypted, so only the customer can read it.", fr: "Le fichier est chiffré : seul le client peut donc le lire." } }
        - { id: b, text: { en: "The file is identical to the one that Proseware hashed.", fr: "Le fichier est identique à celui que Proseware a haché." } }
        - { id: c, text: { en: "The file can be rebuilt from its hash if it gets damaged.", fr: "Le fichier peut être reconstruit à partir de son hachage s'il est endommagé." } }
        - { id: d, text: { en: "The file contains no malware or other malicious code.", fr: "Le fichier ne contient aucun logiciel malveillant ni code malveillant." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Hashing is deterministic: the same input and the same algorithm always produce the same hash. A matching value therefore shows that the downloaded file is the one that Proseware hashed, unmodified: hashing serves to verify integrity, not to hide data.
        fr: |
          Le hachage est déterministe : la même entrée et le même algorithme produisent toujours le même hachage. Une valeur identique montre donc que le fichier téléchargé est celui que Proseware a haché, sans modification : le hachage sert à vérifier l'intégrité, pas à cacher les données.
      options:
        a: { en: "Hashing uses no key and doesn't make the file unreadable: anyone can open the file.", fr: "Le hachage n'utilise aucune clé et ne rend pas le fichier illisible : n'importe qui peut ouvrir le fichier." }
        c: { en: "Hashing is one-way: the original input can't be recovered from the hash.", fr: "Le hachage est à sens unique : l'entrée d'origine ne peut pas être retrouvée à partir du hachage." }
        d: { en: "A matching hash only proves that the file wasn't changed; it says nothing about the content that Proseware hashed.", fr: "Un hachage identique prouve seulement que le fichier n'a pas été modifié ; il ne dit rien du contenu que Proseware a haché." }
    references:
      - title: Describe encryption and hashing
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/5-describe-encryption-hashing

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-11-05
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys runs an online store and an accounting system. After a difficult quarter, its security team reviews three incidents and classifies each one according to the goal of the CIA triad that the incident mainly affects.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys exploite une boutique en ligne et un système comptable. Après un trimestre difficile, son équipe de sécurité passe en revue trois incidents et classe chacun d'eux selon l'objectif de la triade CIA que l'incident affecte principalement.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          A distributed denial-of-service (DDoS) attack makes the online store unreachable for customers for six hours: the incident affects [[g1]].

          An attacker changes the bank account details on supplier invoices stored in the accounting system: the incident affects [[g2]].

          An employee sends the customer list to a personal email address outside the company: the incident affects [[g3]].
        fr: |
          Une attaque par déni de service distribué (DDoS) rend la boutique en ligne inaccessible aux clients pendant six heures : l'incident affecte [[g1]].

          Un attaquant modifie les coordonnées bancaires sur des factures de fournisseurs stockées dans le système comptable : l'incident affecte [[g2]].

          Un employé envoie la liste des clients à une adresse e-mail personnelle, hors de l'entreprise : l'incident affecte [[g3]].
      slots:
        - id: g1
          options:
            - { id: conf, text: { en: "confidentiality", fr: "la confidentialité" } }
            - { id: integ, text: { en: "integrity", fr: "l'intégrité" } }
            - { id: avail, text: { en: "availability", fr: "la disponibilité" } }
        - id: g2
          options:
            - { id: conf, text: { en: "confidentiality", fr: "la confidentialité" } }
            - { id: integ, text: { en: "integrity", fr: "l'intégrité" } }
            - { id: avail, text: { en: "availability", fr: "la disponibilité" } }
        - id: g3
          options:
            - { id: conf, text: { en: "confidentiality", fr: "la confidentialité" } }
            - { id: integ, text: { en: "integrity", fr: "l'intégrité" } }
            - { id: avail, text: { en: "availability", fr: "la disponibilité" } }
    answer:
      values: { g1: avail, g2: integ, g3: conf }
    explanation:
      correct:
        en: |
          A DDoS attack prevents authorized users from reaching the service: it breaks availability. Changing invoice data without authorization breaks integrity, which requires data to stay accurate and unmodified except by authorized changes. Sending the customer list outside the company exposes it to people who aren't authorized to read it: it breaks confidentiality.
        fr: |
          Une attaque DDoS empêche les utilisateurs autorisés d'atteindre le service : elle porte atteinte à la disponibilité. Modifier sans autorisation les données des factures porte atteinte à l'intégrité, qui exige que les données restent exactes et non modifiées, sauf par des changements autorisés. Envoyer la liste des clients hors de l'entreprise l'expose à des personnes qui ne sont pas autorisées à la lire : l'incident porte atteinte à la confidentialité.
    references:
      - title: Describe defense in depth
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/3-describe-defense-depth

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-11-06
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso uses three services from the same cloud provider: virtual machines (IaaS) that run a line-of-business application, a platform as a service (PaaS) offering that hosts its public website, and a software as a service (SaaS) email service for all its employees. The security team reviews how the tasks are split between Contoso and the provider.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise trois services du même fournisseur de cloud : des machines virtuelles (IaaS) qui exécutent une application métier, une offre PaaS (platform as a service) qui héberge son site web public et un service de messagerie SaaS (software as a service) pour tous ses employés. L'équipe de sécurité examine la répartition des tâches entre Contoso et le fournisseur.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The cloud provider applies the security updates to the email application of the SaaS service."
            fr: "Le fournisseur de cloud applique les mises à jour de sécurité à l'application de messagerie du service SaaS."
        - id: s2
          text:
            en: "For the virtual machines, the cloud provider is responsible for defining which network traffic is allowed to reach them."
            fr: "Pour les machines virtuelles, le fournisseur de cloud est responsable de définir quel trafic réseau est autorisé à les atteindre."
        - id: s3
          text:
            en: "Replacing the line-of-business application with a SaaS product would make the cloud provider responsible for classifying and protecting the application's data."
            fr: "Remplacer l'application métier par un produit SaaS rendrait le fournisseur de cloud responsable de la classification et de la protection des données de l'application."
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          In SaaS, the provider manages the entire application stack, including the updates of the application itself. In IaaS, the provider secures the datacenter, the network hardware and the hosts, but the network controls that decide which traffic reaches the virtual machines are configured by the customer and remain its responsibility. Whatever the model, the data stays the customer's responsibility: moving to SaaS never transfers its classification and protection to the provider.
        fr: |
          En SaaS, le fournisseur gère toute la pile applicative, y compris les mises à jour de l'application elle-même. En IaaS, le fournisseur sécurise le centre de données, le matériel réseau et les hôtes, mais les contrôles réseau qui décident du trafic autorisé à atteindre les machines virtuelles sont configurés par le client et restent sous sa responsabilité. Quel que soit le modèle, les données restent sous la responsabilité du client : passer au SaaS ne transfère jamais leur classification ni leur protection au fournisseur.
    references:
      - title: Describe the shared responsibility model
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/2-describe-shared-responsibility-model

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-11-07
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove Bank describes four activities of its security and compliance program. Match each activity to the governance, risk and compliance (GRC) concept that it illustrates.

        To answer, drag the appropriate concept to each activity. Each concept may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank décrit quatre activités de son programme de sécurité et de conformité. Associez chaque activité au concept de gouvernance, de risque et de conformité (GRC) qu'elle illustre.

        Pour répondre, faites glisser le concept approprié vers chaque activité. Chaque concept peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: gov, text: { en: "Governance", fr: "Gouvernance" } }
        - { id: risk, text: { en: "Risk management", fr: "Gestion des risques" } }
        - { id: comp, text: { en: "Compliance", fr: "Conformité" } }
        - { id: res, text: { en: "Data residency", fr: "Résidence des données" } }
        - { id: sov, text: { en: "Data sovereignty", fr: "Souveraineté des données" } }
        - { id: priv, text: { en: "Data privacy", fr: "Confidentialité des données" } }
      targets:
        - id: t1
          text: { en: "The board approves the rules and processes that define who makes IT decisions and how they're made", fr: "Le conseil d'administration approuve les règles et processus qui définissent qui prend les décisions informatiques et comment" }
        - id: t2
          text: { en: "The security team rates the likelihood and impact of a ransomware attack, then decides which threats to address first", fr: "L'équipe de sécurité évalue la probabilité et l'impact d'une attaque par rançongiciel, puis décide des menaces à traiter en priorité" }
        - id: t3
          text: { en: "An external auditor confirms that the bank meets the requirements of a security standard imposed by its regulator", fr: "Un auditeur externe confirme que la banque satisfait aux exigences d'une norme de sécurité imposée par son autorité de régulation" }
        - id: t4
          text: { en: "A contract requires the backups of customer data to be stored only in datacenters located in the European Union", fr: "Un contrat exige que les sauvegardes des données clients soient stockées uniquement dans des centres de données situés dans l'Union européenne" }
    answer:
      mapping: { t1: gov, t2: risk, t3: comp, t4: res }
    explanation:
      correct:
        en: |
          Governance is the system of rules, practices and processes that directs and controls the organization's activities. Risk management identifies and assesses threats, then decides how to respond to them. Compliance is adherence to the laws, regulations and standards that apply, which an audit verifies. A rule on the physical locations where data may be stored is a data residency requirement.
        fr: |
          La gouvernance est le système de règles, pratiques et processus qui dirige et contrôle les activités de l'organisation. La gestion des risques identifie et évalue les menaces, puis décide comment y répondre. La conformité est le respect des lois, réglementations et normes applicables, ce que vérifie un audit. Une règle sur les emplacements physiques où les données peuvent être stockées est une exigence de résidence des données.
      options:
        sov: { en: "Data sovereignty states that data is subject to the laws of the country or region where it is collected, held or processed; the contract only restricts where the backups are stored.", fr: "La souveraineté des données énonce que les données sont soumises aux lois du pays ou de la région où elles sont collectées, conservées ou traitées ; le contrat ne fait que restreindre l'endroit où les sauvegardes sont stockées." }
        priv: { en: "Data privacy covers the handling of personal data: transparency, consent and the rights of individuals. None of the activities is about these.", fr: "La confidentialité des données porte sur le traitement des données personnelles : transparence, consentement et droits des personnes. Aucune des activités n'en relève." }
    references:
      - title: Describe governance, risk, and compliance (GRC) concepts
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/6-describe-compliance-concepts

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-11-08
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam protects its cloud environment with DDoS protection, a perimeter firewall, network segmentation, patched virtual machines and encryption of all stored data. An attacker obtains an employee's password through phishing, signs in to the file-sharing application as that employee, and downloads the files that the employee can open.

        Which layer of defense in depth should Fabrikam strengthen to stop this type of attack?
      fr: |
        Fabrikam protège son environnement cloud par une protection DDoS, un pare-feu de périmètre, une segmentation du réseau, des machines virtuelles à jour de leurs correctifs et le chiffrement de toutes les données stockées. Un attaquant obtient le mot de passe d'un employé par hameçonnage, se connecte à l'application de partage de fichiers en tant que cet employé et télécharge les fichiers que l'employé peut ouvrir.

        Quelle couche de la défense en profondeur faut-il renforcer chez Fabrikam pour arrêter ce type d'attaque ?
    body:
      options:
        - { id: a, text: { en: "Perimeter", fr: "Périmètre" } }
        - { id: b, text: { en: "Network", fr: "Réseau" } }
        - { id: c, text: { en: "Data", fr: "Données" } }
        - { id: d, text: { en: "Identity and access", fr: "Identité et accès" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The attacker didn't break through the network: the attacker signed in with valid stolen credentials. The identity and access layer, with controls such as multifactor authentication and Conditional Access, is the one that would have rejected a sign-in based on a phished password alone.
        fr: |
          L'attaquant n'a pas percé le réseau : il s'est connecté avec des informations d'identification valides volées. La couche identité et accès, avec des contrôles comme l'authentification multifacteur et l'accès conditionnel, est celle qui aurait rejeté une connexion fondée sur un seul mot de passe hameçonné.
      options:
        a: { en: "DDoS protection and the perimeter firewall filter attack traffic, but a sign-in with valid credentials isn't attack traffic.", fr: "La protection DDoS et le pare-feu de périmètre filtrent le trafic d'attaque, mais une connexion avec des informations d'identification valides n'en est pas." }
        b: { en: "Segmentation limits lateral movement between zones; the attacker reached the application the same way the employee does.", fr: "La segmentation limite les déplacements latéraux entre les zones ; l'attaquant a atteint l'application de la même façon que l'employé." }
        c: { en: "The stored data is already encrypted, and the application decrypts it for any user who signs in with authorized credentials.", fr: "Les données stockées sont déjà chiffrées, et l'application les déchiffre pour tout utilisateur qui se connecte avec des informations d'identification autorisées." }
    references:
      - title: Describe defense in depth
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/3-describe-defense-depth

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-11-09
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Northwind Traders is adopting a Zero Trust strategy. Match each measure to the Zero Trust guiding principle that it applies.

        To answer, drag the appropriate principle to each measure. Each principle may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders adopte une stratégie de Confiance Zéro (Zero Trust). Associez chaque mesure au principe directeur de la Confiance Zéro qu'elle applique.

        Pour répondre, faites glisser le principe approprié vers chaque mesure. Chaque principe peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: ve, text: { en: "Verify explicitly", fr: "Vérifier explicitement" } }
        - { id: lp, text: { en: "Use least privilege access", fr: "Utiliser l'accès selon le moindre privilège" } }
        - { id: ab, text: { en: "Assume breach", fr: "Supposer une violation" } }
      targets:
        - id: t1
          text: { en: "Decide on each access request from the user's location and the device's health, not from the password alone", fr: "Décider de chaque demande d'accès d'après l'emplacement de l'utilisateur et l'intégrité de l'appareil, pas d'après le seul mot de passe" }
        - id: t2
          text: { en: "Give a developer only the specific permissions that a task requires, instead of a broad role granted just in case", fr: "Donner à un développeur seulement les autorisations précises qu'exige une tâche, au lieu d'un rôle étendu accordé au cas où" }
        - id: t3
          text: { en: "Divide the network into small zones so that a compromised server can't freely reach the other servers", fr: "Diviser le réseau en petites zones pour qu'un serveur compromis ne puisse pas atteindre librement les autres serveurs" }
        - id: t4
          text: { en: "Encrypt the traffic between services end to end so that intercepted data stays unreadable", fr: "Chiffrer de bout en bout le trafic entre les services pour que les données interceptées restent illisibles" }
    answer:
      mapping: { t1: ve, t2: lp, t3: ab, t4: ab }
    explanation:
      correct:
        en: |
          Verify explicitly authenticates and authorizes each request from all available signals, such as location and device compliance, not from a single factor. Use least privilege access grants just enough access, for just the time needed. Assume breach designs as if an attacker will get in: segmenting access limits what a compromised server can reach, and end-to-end encryption keeps intercepted data unreadable; both measures apply the same principle.
        fr: |
          Vérifier explicitement authentifie et autorise chaque demande à partir de tous les signaux disponibles, comme l'emplacement et la conformité de l'appareil, et non d'un seul facteur. Utiliser l'accès selon le moindre privilège accorde un accès juste suffisant, seulement le temps nécessaire. Supposer une violation consiste à concevoir comme si un attaquant allait entrer : segmenter les accès limite ce qu'un serveur compromis peut atteindre, et le chiffrement de bout en bout garde illisibles les données interceptées ; les deux mesures appliquent le même principe.
    references:
      - title: Describe the Zero Trust model
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/4-describe-zero-trust-model

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-11-10
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso distributes a software update to its customers, and the customers must be able to check that the update really comes from Contoso. Contoso also sends a confidential price list to one customer, Fabrikam, by using asymmetric encryption, so that only Fabrikam can read it.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso distribue une mise à jour logicielle à ses clients, et les clients doivent pouvoir vérifier que la mise à jour provient bien de Contoso. Contoso envoie aussi une liste de prix confidentielle à un client, Fabrikam, à l'aide du chiffrement asymétrique, pour que seul Fabrikam puisse la lire.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Contoso digitally signs the update with [[k1]].

          A customer verifies the signature of the update with [[k2]].

          Contoso encrypts the price list with [[k3]].
        fr: |
          Contoso signe numériquement la mise à jour avec [[k1]].

          Un client vérifie la signature de la mise à jour avec [[k2]].

          Contoso chiffre la liste de prix avec [[k3]].
      slots:
        - id: k1
          options:
            - { id: cpub, text: { en: "Contoso's public key", fr: "la clé publique de Contoso" } }
            - { id: cpriv, text: { en: "Contoso's private key", fr: "la clé privée de Contoso" } }
            - { id: fpub, text: { en: "Fabrikam's public key", fr: "la clé publique de Fabrikam" } }
            - { id: fpriv, text: { en: "Fabrikam's private key", fr: "la clé privée de Fabrikam" } }
        - id: k2
          options:
            - { id: cpub, text: { en: "Contoso's public key", fr: "la clé publique de Contoso" } }
            - { id: cpriv, text: { en: "Contoso's private key", fr: "la clé privée de Contoso" } }
            - { id: fpub, text: { en: "Fabrikam's public key", fr: "la clé publique de Fabrikam" } }
            - { id: fpriv, text: { en: "Fabrikam's private key", fr: "la clé privée de Fabrikam" } }
        - id: k3
          options:
            - { id: cpub, text: { en: "Contoso's public key", fr: "la clé publique de Contoso" } }
            - { id: cpriv, text: { en: "Contoso's private key", fr: "la clé privée de Contoso" } }
            - { id: fpub, text: { en: "Fabrikam's public key", fr: "la clé publique de Fabrikam" } }
            - { id: fpriv, text: { en: "Fabrikam's private key", fr: "la clé privée de Fabrikam" } }
    answer:
      values: { k1: cpriv, k2: cpub, k3: fpub }
    explanation:
      correct:
        en: |
          A digital signature is created with the sender's private key, which only Contoso holds, and anyone who has Contoso's public key can verify it: this proves that the update comes from Contoso and wasn't modified. For confidentiality, the roles are reversed: Contoso encrypts with Fabrikam's public key, and only Fabrikam's private key can decrypt the price list. Contoso never has access to Fabrikam's private key.
        fr: |
          Une signature numérique se crée avec la clé privée de l'expéditeur, que seul Contoso détient, et toute personne qui possède la clé publique de Contoso peut la vérifier : cela prouve que la mise à jour provient de Contoso et n'a pas été modifiée. Pour la confidentialité, les rôles s'inversent : Contoso chiffre avec la clé publique de Fabrikam, et seule la clé privée de Fabrikam peut déchiffrer la liste de prix. Contoso n'a jamais accès à la clé privée de Fabrikam.
      options:
        cpub: { en: "For the price list, Contoso's public key is wrong: anything encrypted with it could only be decrypted by Contoso's private key, not by Fabrikam.", fr: "Pour la liste de prix, la clé publique de Contoso ne convient pas : ce qui est chiffré avec elle ne peut être déchiffré que par la clé privée de Contoso, pas par Fabrikam." }
        fpriv: { en: "A private key never leaves its owner: Contoso can't sign or encrypt with Fabrikam's private key.", fr: "Une clé privée ne quitte jamais son propriétaire : Contoso ne peut ni signer ni chiffrer avec la clé privée de Fabrikam." }
    references:
      - title: Describe encryption and hashing
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/5-describe-encryption-hashing
