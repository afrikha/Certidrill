chapter: 21-entra-id-identities
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Which product of the Microsoft Entra family provides identity and access management for applications, services and containers?
      fr: |
        Quel produit de la famille Microsoft Entra fournit la gestion des identités et des accès des applications, des services et des conteneurs ?
    body:
      options:
        - { id: a, text: Microsoft Entra Agent ID }
        - { id: b, text: Microsoft Entra Workload ID }
        - { id: c, text: Microsoft Entra External ID }
        - { id: d, text: { en: "Microsoft Entra ID Governance", fr: "Gouvernance Microsoft Entra ID" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Microsoft Entra Workload ID manages the identities and the access of workload identities, that is software such as applications, services and containers. It extends Microsoft Entra capabilities, such as adaptive policies, to these non-human identities.
        fr: |
          Microsoft Entra Workload ID gère les identités et les accès des identités de charge de travail, c'est-à-dire des logiciels comme les applications, les services et les conteneurs. Il étend à ces identités non humaines des fonctionnalités de Microsoft Entra comme les stratégies adaptatives.
      options:
        a: { en: "Microsoft Entra Agent ID is the identity and security framework for AI agents, which are distinct from traditional workload identities.", fr: "Microsoft Entra Agent ID est le cadre d'identité et de sécurité des agents IA, qui sont distincts des identités de charge de travail classiques." }
        c: { en: "Microsoft Entra External ID gives people outside the organization, such as partners, guests and customers, access to applications.", fr: "Microsoft Entra External ID donne aux personnes extérieures à l'organisation, comme les partenaires, les invités et les clients, l'accès aux applications." }
        d: { en: "Microsoft Entra ID Governance automates access requests, assignments and reviews; it doesn't target software workloads.", fr: "La gouvernance Microsoft Entra ID automatise les demandes, les attributions et les révisions d'accès ; elle ne cible pas les charges de travail logicielles." }
    references:
      - title: Describe Microsoft Entra
        url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/1a-describe-microsoft-entra

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-21-02
    objective: "2.1.2"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        In Microsoft Entra ID, which two types of identity are grouped together as machine identities?

        NOTE: Each correct selection is worth one point.
      fr: |
        Dans Microsoft Entra ID, quels sont les deux types d'identités regroupés sous le nom d'identités de machine ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "User identities of employees", fr: "Les identités d'utilisateur des employés" } }
        - { id: b, text: { en: "Device identities", fr: "Les identités d'appareil" } }
        - { id: c, text: { en: "Guest users invited through B2B collaboration", fr: "Les utilisateurs invités par la collaboration B2B" } }
        - { id: d, text: { en: "Workload identities", fr: "Les identités de charge de travail" } }
        - { id: e, text: { en: "External members of a multitenant organization", fr: "Les membres externes d'une organisation multilocataire" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Microsoft Entra ID assigns identities to people, to devices and to software. Device identities (phones, computers, IoT devices) and workload identities (applications, services, scripts, containers) are the non-human identities, grouped together as machine identities.
        fr: |
          Microsoft Entra ID attribue des identités aux personnes, aux appareils et aux logiciels. Les identités d'appareil (téléphones, ordinateurs, appareils IoT) et les identités de charge de travail (applications, services, scripts, conteneurs) sont les identités non humaines, regroupées sous le nom d'identités de machine.
      options:
        a: { en: "Employees are people: they have user identities, which are human identities.", fr: "Les employés sont des personnes : ils ont des identités d'utilisateur, qui sont des identités humaines." }
        c: { en: "A B2B guest is a person from a partner organization, represented by a user identity.", fr: "Un invité B2B est une personne d'une organisation partenaire, représentée par une identité d'utilisateur." }
        e: { en: "An external member is a person who signs in with an external account; it's a user identity, not a machine identity.", fr: "Un membre externe est une personne qui se connecte avec un compte externe ; c'est une identité d'utilisateur, pas une identité de machine." }
    references:
      - title: Describe types of identities
        url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Litware has Microsoft Entra ID P1 licenses. Its administrators grant access to an internal resource through a group. The group must contain every Windows device of the company, and each new Windows device must be added to the group without any action from an administrator.

        To complete the sentence, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose de licences Microsoft Entra ID P1. Ses administrateurs accordent l'accès à une ressource interne par l'intermédiaire d'un groupe. Le groupe doit contenir tous les appareils Windows de l'entreprise, et chaque nouvel appareil Windows doit y être ajouté sans aucune action d'un administrateur.

        Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Create [[gtype]] that uses [[membership]].
        fr: |
          Créez [[gtype]] qui utilise [[membership]].
      slots:
        - id: gtype
          options:
            - { id: security, text: { en: "a security group", fr: "un groupe de sécurité" } }
            - { id: m365, text: { en: "a Microsoft 365 group", fr: "un groupe Microsoft 365" } }
            - { id: au, text: { en: "an administrative unit", fr: "une unité administrative" } }
        - id: membership
          options:
            - { id: assigned, text: { en: "assigned membership", fr: "une appartenance affectée" } }
            - { id: dynuser, text: { en: "dynamic membership for users", fr: "une appartenance dynamique pour les utilisateurs" } }
            - { id: dyndevice, text: { en: "dynamic membership for devices", fr: "une appartenance dynamique pour les appareils" } }
    answer:
      values: { gtype: security, membership: dyndevice }
    explanation:
      correct:
        en: |
          A security group manages access to shared resources and can contain devices, whereas the members of a Microsoft 365 group can only be users. With dynamic membership, a rule adds and removes members automatically; a dynamic group contains either users or devices, and a device rule (for example on the operating system type) adds each new Windows device without an administrator.
        fr: |
          Un groupe de sécurité gère l'accès à des ressources partagées et peut contenir des appareils, alors que les membres d'un groupe Microsoft 365 ne peuvent être que des utilisateurs. Avec l'appartenance dynamique, une règle ajoute et retire automatiquement les membres ; un groupe dynamique contient soit des utilisateurs, soit des appareils, et une règle d'appareil (par exemple sur le type de système d'exploitation) ajoute chaque nouvel appareil Windows sans administrateur.
      options:
        m365: { en: "A Microsoft 365 group is for collaboration and its members can only be users, not devices.", fr: "Un groupe Microsoft 365 sert à la collaboration et ses membres ne peuvent être que des utilisateurs, pas des appareils." }
        au: { en: "An administrative unit limits the scope of administrative roles; it isn't a group that grants access to a resource.", fr: "Une unité administrative limite l'étendue des rôles d'administration ; ce n'est pas un groupe qui accorde l'accès à une ressource." }
        assigned: { en: "With assigned membership, an administrator must add each new device manually.", fr: "Avec une appartenance affectée, un administrateur doit ajouter manuellement chaque nouvel appareil." }
        dynuser: { en: "A dynamic group for users only contains users; it can't add devices.", fr: "Un groupe dynamique pour les utilisateurs ne contient que des utilisateurs ; il ne peut pas ajouter d'appareils." }
    references:
      - title: Learn about group types, membership types, and access management
        url: https://learn.microsoft.com/en-us/entra/fundamentals/concept-learn-about-groups
      - title: Manage rules for dynamic membership groups in Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-21-04
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso deployed Microsoft Entra Cloud Sync last week to synchronize the users of its on-premises Active Directory with Microsoft Entra ID. A manager wants to know where the passwords of these users are now validated when they sign in to Microsoft 365.

        Which statement is correct?
      fr: |
        Contoso a déployé Microsoft Entra Cloud Sync la semaine dernière pour synchroniser les utilisateurs de son Active Directory local avec Microsoft Entra ID. Un responsable veut savoir où les mots de passe de ces utilisateurs sont désormais validés lorsqu'ils se connectent à Microsoft 365.

        Quelle affirmation est correcte ?
    body:
      options:
        - { id: a, text: { en: "Cloud Sync validates the passwords through its provisioning agent at each sign-in.", fr: "Cloud Sync valide les mots de passe par son agent de provisionnement à chaque connexion." } }
        - { id: b, text: { en: "Cloud Sync makes Microsoft Entra ID validate the passwords, because it always copies them to the cloud.", fr: "Cloud Sync fait valider les mots de passe par Microsoft Entra ID, car il les copie toujours dans le cloud." } }
        - { id: c, text: { en: "Cloud Sync keeps the validation on the domain controllers, because the passwords never leave the on-premises network.", fr: "Cloud Sync laisse la validation aux contrôleurs de domaine, car les mots de passe ne quittent jamais le réseau local." } }
        - { id: d, text: { en: "Cloud Sync doesn't determine where passwords are validated; the sign-in method that Contoso configures does.", fr: "Cloud Sync ne détermine pas où les mots de passe sont validés ; c'est la méthode de connexion configurée par Contoso qui le fait." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Synchronization only keeps the identity information of on-premises users and groups in line with the cloud. Where the password is checked depends on the sign-in method: Microsoft Entra ID with password hash synchronization, the on-premises Active Directory with pass-through authentication, or a trusted system such as AD FS with federation.
        fr: |
          La synchronisation se limite à maintenir les informations d'identité des utilisateurs et des groupes locaux en accord avec le cloud. L'endroit où le mot de passe est vérifié dépend de la méthode de connexion : Microsoft Entra ID avec la synchronisation de hachage du mot de passe, l'Active Directory local avec l'authentification directe, ou un système approuvé comme AD FS avec la fédération.
      options:
        a: { en: "The provisioning agent provisions and deprovisions users and groups; it takes no part in the sign-in.", fr: "L'agent de provisionnement provisionne et déprovisionne les utilisateurs et les groupes ; il ne participe pas à la connexion." }
        b: { en: "Cloud validation happens only with password hash synchronization, and even then a hash is synchronized, not the password.", fr: "La validation dans le cloud n'a lieu qu'avec la synchronisation de hachage du mot de passe, et même alors c'est un hachage qui est synchronisé, pas le mot de passe." }
        c: { en: "Validation by the domain controllers happens only with pass-through authentication, a choice separate from the synchronization tool.", fr: "La validation par les contrôleurs de domaine n'a lieu qu'avec l'authentification directe, un choix distinct de l'outil de synchronisation." }
    references:
      - title: Describe hybrid identity
        url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/4-describe-concept-of-hybrid-identity
      - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
        url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-21-05
    objective: "2.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a Microsoft Entra tenant with Microsoft Entra ID Free licenses only. Before it buys any license, the security team wants to measure how well the tenant follows Microsoft's identity security recommendations.

        Which capability can the team use without additional licenses?
      fr: |
        Tailspin Toys dispose d'un locataire Microsoft Entra qui n'a que des licences Microsoft Entra ID Free. Avant d'acheter la moindre licence, l'équipe de sécurité veut mesurer dans quelle mesure le locataire suit les recommandations de sécurité des identités de Microsoft.

        Quelle fonctionnalité l'équipe peut-elle utiliser sans licence supplémentaire ?
    body:
      options:
        - { id: a, text: { en: "Conditional Access policies", fr: "Les stratégies d'accès conditionnel" } }
        - { id: b, text: { en: "Privileged Identity Management", fr: "Privileged Identity Management" } }
        - { id: c, text: { en: "The identity secure score", fr: "Le score d'identité sécurisée" } }
        - { id: d, text: { en: "Dynamic membership groups for users", fr: "Les groupes à appartenance dynamique pour les utilisateurs" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The identity secure score is available to free and paid customers. It's a percentage that shows how well the tenant is aligned with Microsoft's security recommendations, with improvement actions; some recommendations need a paid license to act on, but the score itself doesn't.
        fr: |
          Le score d'identité sécurisée est disponible pour les clients gratuits et payants. C'est un pourcentage qui indique dans quelle mesure le locataire est aligné sur les recommandations de sécurité de Microsoft, avec des actions d'amélioration ; certaines recommandations demandent une licence payante pour être appliquées, mais pas le score lui-même.
      options:
        a: { en: "Conditional Access requires Microsoft Entra ID P1 licenses.", fr: "L'accès conditionnel demande des licences Microsoft Entra ID P1." }
        b: { en: "Privileged Identity Management requires Microsoft Entra ID P2 or Microsoft Entra ID Governance licenses.", fr: "Privileged Identity Management demande des licences Microsoft Entra ID P2 ou Gouvernance Microsoft Entra ID." }
        d: { en: "Dynamic membership groups for users require Microsoft Entra ID P1 licenses, and they don't measure the security of the tenant.", fr: "Les groupes à appartenance dynamique pour les utilisateurs demandent des licences Microsoft Entra ID P1, et ils ne mesurent pas la sécurité du locataire." }
    references:
      - title: What is the Identity Secure Score?
        url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-identity-secure-score
      - title: Microsoft Entra licensing
        url: https://learn.microsoft.com/en-us/entra/fundamentals/licensing

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-21-06
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Years ago, Adatum created accounts in its own Microsoft Entra tenant for the consultants of a partner company. The consultants sign in with these Adatum credentials, and their accounts have the Guest user type, with limited privileges.

        Which category of user are these consultants in the Adatum tenant?
      fr: |
        Il y a plusieurs années, Adatum a créé dans son propre locataire Microsoft Entra des comptes pour les consultants d'une société partenaire. Les consultants se connectent avec ces informations d'identification Adatum, et leurs comptes ont le type d'utilisateur Invité, avec des privilèges limités.

        À quelle catégorie d'utilisateurs ces consultants appartiennent-ils dans le locataire Adatum ?
    body:
      options:
        - { id: a, text: { en: "Internal member", fr: "Membre interne" } }
        - { id: b, text: { en: "External guest", fr: "Invité externe" } }
        - { id: c, text: { en: "Internal guest", fr: "Invité interne" } }
        - { id: d, text: { en: "External member", fr: "Membre externe" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A user is classified by where they authenticate and by their user type. These consultants authenticate with credentials of the Adatum tenant (internal) and have the Guest user type: they are internal guests, a pattern from before B2B collaboration. Microsoft recommends inviting them to B2B collaboration so that they use their own credentials.
        fr: |
          Un utilisateur se classe selon l'endroit où il s'authentifie et selon son type d'utilisateur. Ces consultants s'authentifient avec des informations d'identification du locataire Adatum (interne) et ont le type d'utilisateur Invité : ce sont des invités internes, une pratique antérieure à la collaboration B2B. Microsoft recommande de les inviter par la collaboration B2B pour qu'ils utilisent leurs propres informations d'identification.
      options:
        a: { en: "An internal member also authenticates in the tenant, but has the Member user type, like an employee.", fr: "Un membre interne s'authentifie aussi dans le locataire, mais a le type d'utilisateur Membre, comme un employé." }
        b: { en: "An external guest has the Guest user type but signs in with an account of another organization or identity provider.", fr: "Un invité externe a le type d'utilisateur Invité, mais se connecte avec un compte d'une autre organisation ou d'un autre fournisseur d'identité." }
        d: { en: "An external member signs in with an external account and has the Member user type, as in a multitenant organization.", fr: "Un membre externe se connecte avec un compte externe et a le type d'utilisateur Membre, comme dans une organisation multilocataire." }
    references:
      - title: Understand and manage the properties of B2B guest users
        url: https://learn.microsoft.com/en-us/entra/external-id/user-properties

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-21-07
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam has three workloads that must authenticate with Microsoft Entra ID:

        - **App1** is a web app in Azure App Service that reads secrets from Azure Key Vault. No credential can be stored in its code, and its identity must disappear automatically when App1 is deleted.
        - **Pool1** is a set of 20 Azure virtual machines that are deleted and re-created every week. All of them must use the same identity, which must keep its access between re-creations.
        - **Sync1** is an application that runs in the datacenter of a partner company, outside Azure, and calls an API that Fabrikam protects with Microsoft Entra ID.

        Which type of identity should each workload use? To answer, drag the appropriate identity type to each workload. Each identity type may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a trois charges de travail qui doivent s'authentifier auprès de Microsoft Entra ID :

        - **App1** est une application web d'Azure App Service qui lit des secrets dans Azure Key Vault. Aucune information d'identification ne peut être stockée dans son code, et son identité doit disparaître automatiquement quand App1 est supprimée.
        - **Pool1** est un ensemble de 20 machines virtuelles Azure supprimées et recréées chaque semaine. Elles doivent toutes utiliser la même identité, qui doit conserver ses accès d'une recréation à l'autre.
        - **Sync1** est une application qui s'exécute dans le centre de données d'une société partenaire, en dehors d'Azure, et qui appelle une API que Fabrikam protège avec Microsoft Entra ID.

        Quel type d'identité chaque charge de travail doit-elle utiliser ? Pour répondre, faites glisser le type d'identité approprié vers chaque charge de travail. Chaque type d'identité peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: sysmi, text: { en: "System-assigned managed identity", fr: "Identité managée affectée par le système" } }
        - { id: usermi, text: { en: "User-assigned managed identity", fr: "Identité managée affectée par l'utilisateur" } }
        - { id: sp, text: { en: "Service principal", fr: "Principal de service" } }
        - { id: agent, text: { en: "Agent identity", fr: "Identité d'agent" } }
        - { id: device, text: { en: "Device identity", fr: "Identité d'appareil" } }
      targets:
        - { id: t1, text: App1 }
        - { id: t2, text: Pool1 }
        - { id: t3, text: Sync1 }
    answer:
      mapping: { t1: sysmi, t2: usermi, t3: sp }
    explanation:
      correct:
        en: |
          A system-assigned managed identity is enabled on one Azure resource, has no credential to store, and is deleted automatically with the resource: it fits App1. A user-assigned managed identity is a standalone resource that several resources can share and that stays until it's explicitly deleted, so Pool1 keeps the same identity and its access across re-creations. Managed identities are assigned to Azure resources; Sync1 runs outside Azure, so it uses a service principal, whose credential (a secret or a certificate) Fabrikam must store and renew.
        fr: |
          Une identité managée affectée par le système est activée sur une seule ressource Azure, n'a aucune information d'identification à stocker, et est supprimée automatiquement avec la ressource : elle convient à App1. Une identité managée affectée par l'utilisateur est une ressource autonome que plusieurs ressources peuvent partager et qui reste jusqu'à sa suppression explicite ; Pool1 garde ainsi la même identité et ses accès d'une recréation à l'autre. Les identités managées sont attribuées à des ressources Azure ; Sync1 s'exécute en dehors d'Azure et utilise donc un principal de service, dont Fabrikam doit stocker et renouveler l'information d'identification (un secret ou un certificat).
      options:
        agent: { en: "Agent identities are designed for AI agents, with a human sponsor; none of these workloads is an AI agent.", fr: "Les identités d'agent sont conçues pour les agents IA, avec un sponsor humain ; aucune de ces charges de travail n'est un agent IA." }
        device: { en: "A device identity represents hardware such as a computer or a phone, not the software workload that runs on it.", fr: "Une identité d'appareil représente du matériel, comme un ordinateur ou un téléphone, pas la charge de travail logicielle qui s'y exécute." }
    references:
      - title: What is managed identities for Azure resources?
        url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
      - title: Describe types of identities
        url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/3-describe-identity-types

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-21-08
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam develops an HR application named **HRPortal** and registers it as a multitenant application in the Fabrikam tenant. Contoso, a customer of Fabrikam, has its own Microsoft Entra tenant. An administrator of the Contoso tenant consents to HRPortal so that Contoso employees can sign in to it with their Contoso accounts.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam développe une application RH nommée **HRPortal** et l'inscrit comme application multilocataire dans le locataire Fabrikam. Contoso, un client de Fabrikam, dispose de son propre locataire Microsoft Entra. Un administrateur du locataire Contoso donne son consentement à HRPortal pour que les employés de Contoso puissent s'y connecter avec leurs comptes Contoso.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A service principal that represents HRPortal is created in the Contoso tenant.", fr: "Un principal de service qui représente HRPortal est créé dans le locataire Contoso." }
        - id: s2
          text: { en: "The Contoso tenant receives its own copy of the HRPortal application object, which Contoso can modify.", fr: "Le locataire Contoso reçoit sa propre copie de l'objet application de HRPortal, que Contoso peut modifier." }
        - id: s3
          text: { en: "What HRPortal can do and access in the Contoso tenant is defined by the service principal of HRPortal in that tenant.", fr: "Ce que HRPortal peut faire et atteindre dans le locataire Contoso est défini par le principal de service de HRPortal dans ce locataire." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          An application has one application object, its global definition, in the tenant where it's registered (its home tenant, here Fabrikam). A service principal is created in every tenant where the application is used, for example when an administrator consents to it. The service principal is the local identity of the application and defines what it can do and access in that tenant, with the permissions the administrator granted.
        fr: |
          Une application a un seul objet application, sa définition globale, dans le locataire où elle est inscrite (son locataire de base, ici Fabrikam). Un principal de service est créé dans chaque locataire où l'application est utilisée, par exemple quand un administrateur y consent. Le principal de service est l'identité locale de l'application et définit ce qu'elle peut faire et atteindre dans ce locataire, avec les autorisations accordées par l'administrateur.
      options:
        s2: { en: "The application object exists only in the home tenant (Fabrikam); Contoso gets a service principal, not a copy of the application object.", fr: "L'objet application n'existe que dans le locataire de base (Fabrikam) ; Contoso obtient un principal de service, pas une copie de l'objet application." }
    references:
      - title: Application and service principal objects in Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity-platform/app-objects-and-service-principals

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-21-09
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys has one on-premises Active Directory forest and no hybrid identity solution yet. It plans a new deployment with the following requirements:

        - Users sign in to Microsoft 365 with the password that they use on-premises.
        - The synchronization tool is the one that Microsoft recommends for new deployments.
        - The sign-in method requires the least deployment effort and the least on-premises infrastructure.

        Which two components should Tailspin Toys use? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'une forêt Active Directory locale et n'a encore aucune solution d'identité hybride. Elle prévoit un nouveau déploiement avec les exigences suivantes :

        - Les utilisateurs se connectent à Microsoft 365 avec le mot de passe qu'ils utilisent en local.
        - L'outil de synchronisation est celui que Microsoft recommande pour les nouveaux déploiements.
        - La méthode de connexion demande le moins d'effort de déploiement et le moins d'infrastructure locale.

        Quels sont les deux composants que Tailspin Toys doit utiliser ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: Microsoft Entra Connect Sync }
        - { id: b, text: Microsoft Entra Cloud Sync }
        - { id: c, text: { en: "Pass-through authentication", fr: "L'authentification directe" } }
        - { id: d, text: { en: "Password hash synchronization", fr: "La synchronisation de hachage du mot de passe" } }
        - { id: e, text: { en: "Federation with Active Directory Federation Services (AD FS)", fr: "La fédération avec Active Directory Federation Services (AD FS)" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Microsoft Entra Cloud Sync is Microsoft's recommended synchronization tool: only a lightweight provisioning agent is deployed on-premises, and new synchronization features are developed primarily on it. Password hash synchronization requires the least effort for deployment, maintenance and infrastructure, because Microsoft Entra ID validates the password itself, with no authentication server on-premises.
        fr: |
          Microsoft Entra Cloud Sync est l'outil de synchronisation recommandé par Microsoft : seul un agent de provisionnement léger est déployé en local, et les nouvelles fonctionnalités de synchronisation sont développées en priorité sur cet outil. La synchronisation de hachage du mot de passe demande le moins d'effort de déploiement, de maintenance et d'infrastructure, car Microsoft Entra ID valide lui-même le mot de passe, sans serveur d'authentification en local.
      options:
        a: { en: "Connect Sync is the earlier tool, an on-premises synchronization server that Cloud Sync is replacing.", fr: "Connect Sync est l'outil antérieur, un serveur de synchronisation local que Cloud Sync remplace." }
        c: { en: "Pass-through authentication needs authentication agents on on-premises servers, which adds infrastructure compared with password hash synchronization.", fr: "L'authentification directe a besoin d'agents d'authentification sur des serveurs locaux, ce qui ajoute de l'infrastructure par rapport à la synchronisation de hachage du mot de passe." }
        e: { en: "Federation needs federation servers and proxies, the heaviest infrastructure of the three methods.", fr: "La fédération a besoin de serveurs de fédération et de proxys, l'infrastructure la plus lourde des trois méthodes." }
    references:
      - title: Describe hybrid identity
        url: https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/4-describe-concept-of-hybrid-identity
      - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
        url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-21-10
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has the following environment:

        - An on-premises Active Directory, synchronized with Microsoft Entra ID by Microsoft Entra Cloud Sync. The employees sign in by using password hash synchronization.
        - A web application on an Azure virtual machine named **VM1**. The application reads secrets from Azure Key Vault by using the system-assigned managed identity of VM1.
        - Auditors of Fabrikam, invited through B2B collaboration with the default settings. They sign in with their Fabrikam accounts.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose de l'environnement suivant :

        - Un Active Directory local, synchronisé avec Microsoft Entra ID par Microsoft Entra Cloud Sync. Les employés se connectent en utilisant la synchronisation de hachage du mot de passe.
        - Une application web sur une machine virtuelle Azure nommée **VM1**. L'application lit des secrets dans Azure Key Vault en utilisant l'identité managée affectée par le système de VM1.
        - Des auditeurs de Fabrikam, invités par la collaboration B2B avec les paramètres par défaut. Ils se connectent avec leurs comptes Fabrikam.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "During a complete outage of the on-premises datacenter of Woodgrove Bank, the employees can still sign in to Microsoft 365, and the auditors can still sign in to the cloud applications of Woodgrove Bank.", fr: "Pendant une panne complète du centre de données local de Woodgrove Bank, les employés peuvent toujours se connecter à Microsoft 365, et les auditeurs peuvent toujours se connecter aux applications cloud de Woodgrove Bank." }
        - id: s2
          text: { en: "In the Woodgrove Bank tenant, the auditors have the Member user type, because they authenticate with an account of another Microsoft Entra organization.", fr: "Dans le locataire Woodgrove Bank, les auditeurs ont le type d'utilisateur Membre, car ils s'authentifient avec un compte d'une autre organisation Microsoft Entra." }
        - id: s3
          text: { en: "If VM1 is deleted, the identity that the web application used to access Key Vault remains in the tenant until an administrator deletes it.", fr: "Si VM1 est supprimée, l'identité que l'application web utilisait pour accéder à Key Vault reste dans le locataire jusqu'à ce qu'un administrateur la supprime." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          With password hash synchronization, Microsoft Entra ID validates the employees' passwords against the synchronized hash, so sign-in doesn't depend on on-premises servers; B2B guests authenticate with their home organization, Fabrikam, so the Woodgrove datacenter plays no part in their sign-in. B2B collaboration users get the Guest user type by default. A system-assigned managed identity is tied to the lifecycle of its resource and is deleted automatically with VM1.
        fr: |
          Avec la synchronisation de hachage du mot de passe, Microsoft Entra ID valide les mots de passe des employés par rapport au hachage synchronisé ; la connexion ne dépend donc pas de serveurs locaux. Les invités B2B s'authentifient auprès de leur organisation d'origine, Fabrikam : le centre de données de Woodgrove ne joue aucun rôle dans leur connexion. Les utilisateurs de la collaboration B2B reçoivent par défaut le type d'utilisateur Invité. Une identité managée affectée par le système est liée au cycle de vie de sa ressource et est supprimée automatiquement avec VM1.
      options:
        s2: { en: "Authenticating with an external account doesn't make a user a member: by default, a B2B collaboration user is an external guest, with the Guest user type.", fr: "S'authentifier avec un compte externe ne fait pas d'un utilisateur un membre : par défaut, un utilisateur de la collaboration B2B est un invité externe, avec le type d'utilisateur Invité." }
        s3: { en: "Only a user-assigned managed identity survives its resources; a system-assigned one is deleted automatically with VM1.", fr: "Seule une identité managée affectée par l'utilisateur survit à ses ressources ; une identité affectée par le système est supprimée automatiquement avec VM1." }
    references:
      - title: Understand and manage the properties of B2B guest users
        url: https://learn.microsoft.com/en-us/entra/external-id/user-properties
      - title: What is managed identities for Azure resources?
        url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
