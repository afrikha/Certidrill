chapter: 23-access-management
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-23-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso finds that most password spray attempts against its users go through older email protocols that can't perform multifactor authentication.

        Which commonly applied Conditional Access policy closes this attack path?
      fr: |
        Contoso constate que la plupart des tentatives de pulvérisation de mots de passe contre ses utilisateurs passent par d'anciens protocoles de messagerie incapables d'effectuer l'authentification multifacteur.

        Quelle stratégie d'accès conditionnel couramment appliquée ferme cette voie d'attaque ?
    body:
      options:
        - { id: a, text: { en: "Require terms of use for all the guest users", fr: "Exiger des conditions d'utilisation pour tous les utilisateurs invités" } }
        - { id: b, text: { en: "Set a sign-in frequency of one hour for all the users", fr: "Définir une fréquence de connexion d'une heure pour tous les utilisateurs" } }
        - { id: c, text: { en: "Block the sign-ins that use legacy authentication", fr: "Bloquer les connexions qui utilisent l'authentification héritée" } }
        - { id: d, text: { en: "Require a compliant device for the administrators", fr: "Exiger un appareil conforme pour les administrateurs" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Legacy authentication protocols don't support multifactor authentication, and Microsoft's analysis shows that almost all password spray attacks use them. A Conditional Access policy that blocks legacy authentication for all users removes this path entirely, which is why it is one of the commonly applied policies.
        fr: |
          Les protocoles d'authentification hérités ne prennent pas en charge l'authentification multifacteur, et l'analyse de Microsoft montre que presque toutes les attaques par pulvérisation de mots de passe les utilisent. Une stratégie d'accès conditionnel qui bloque l'authentification héritée pour tous les utilisateurs supprime entièrement cette voie, ce qui en fait l'une des stratégies couramment appliquées.
      options:
        a: { en: "Terms of use make guests accept a document before access; they don't stop protocols that skip multifactor authentication, and employees aren't covered.", fr: "Les conditions d'utilisation font accepter un document aux invités avant l'accès ; elles n'arrêtent pas les protocoles qui contournent l'authentification multifacteur, et les employés ne sont pas couverts." }
        b: { en: "Sign-in frequency only sets how often users sign in again; an attacker who guesses a password through a legacy protocol still gets in.", fr: "La fréquence de connexion fixe seulement la périodicité des reconnexions ; un attaquant qui devine un mot de passe par un protocole hérité entre toujours." }
        d: { en: "The policy covers only the administrators, while the attacks target all the users of Contoso.", fr: "La stratégie ne couvre que les administrateurs, alors que les attaques visent tous les utilisateurs de Contoso." }
    references:
      - title: Block legacy authentication with Conditional Access - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-block-legacy-authentication
      - title: What is Conditional Access? - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-23-02
    objective: "2.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An organization applies the principle of least privilege when it assigns Microsoft Entra roles to its administrators.

        What does this principle require?
      fr: |
        Une organisation applique le principe du moindre privilège quand elle attribue des rôles Microsoft Entra à ses administrateurs.

        Qu'exige ce principe ?
    body:
      options:
        - { id: a, text: { en: "Each administrator gets the same role, so that the permissions stay consistent", fr: "Chaque administrateur reçoit le même rôle, pour que les autorisations restent cohérentes" } }
        - { id: b, text: { en: "Each administrator gets only the permissions needed for their own tasks", fr: "Chaque administrateur reçoit seulement les autorisations nécessaires à ses propres tâches" } }
        - { id: c, text: { en: "Each administrator gets Global Administrator until an audit removes it", fr: "Chaque administrateur reçoit Global Administrator jusqu'à ce qu'un audit le retire" } }
        - { id: d, text: { en: "Each administrator gets roles directly, never through a group membership", fr: "Chaque administrateur reçoit ses rôles directement, jamais par l'appartenance à un groupe" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Least privilege means granting administrators exactly the permissions they need to do their job, over the narrowest scope. Someone who only manages users gets User Administrator rather than Global Administrator, which limits what is at risk if the account is compromised.
        fr: |
          Le moindre privilège consiste à accorder aux administrateurs exactement les autorisations dont ils ont besoin pour leur travail, sur l'étendue la plus étroite. Quelqu'un qui ne gère que des utilisateurs reçoit User Administrator plutôt que Global Administrator, ce qui limite ce qui est exposé si le compte est compromis.
      options:
        a: { en: "Giving everyone the same role gives most administrators permissions they don't need, the opposite of least privilege.", fr: "Donner le même rôle à tous accorde à la plupart des administrateurs des autorisations dont ils n'ont pas besoin, l'inverse du moindre privilège." }
        c: { en: "Global Administrator is the broadest role; Microsoft recommends assigning it to very few people, not to every administrator.", fr: "Global Administrator est le rôle le plus large ; Microsoft recommande de l'attribuer à très peu de personnes, pas à chaque administrateur." }
        d: { en: "Least privilege is about the permissions granted, not about how they are assigned; Microsoft even recommends assigning roles to groups.", fr: "Le moindre privilège porte sur les autorisations accordées, pas sur la manière de les attribuer ; Microsoft recommande même d'attribuer les rôles à des groupes." }
    references:
      - title: Best practices for Microsoft Entra roles - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/best-practices

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-23-03
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware wants every user who manages Azure resources through the Azure portal, Azure CLI or Azure PowerShell to complete multifactor authentication. Access to Microsoft 365 email must not change.

        What should Litware configure?
      fr: |
        Litware veut que chaque utilisateur qui gère des ressources Azure par le portail Azure, Azure CLI ou Azure PowerShell effectue l'authentification multifacteur. L'accès à la messagerie Microsoft 365 ne doit pas changer.

        Que doit configurer Litware ?
    body:
      options:
        - { id: a, text: { en: "A Conditional Access policy that targets all resources and requires multifactor authentication", fr: "Une stratégie d'accès conditionnel qui cible toutes les ressources et exige l'authentification multifacteur" } }
        - { id: b, text: { en: "A Conditional Access policy that targets Azure management and blocks access", fr: "Une stratégie d'accès conditionnel qui cible la gestion Azure et bloque l'accès" } }
        - { id: c, text: { en: "An access review of the Azure role assignments of the subscription", fr: "Une révision d'accès des attributions de rôles Azure de l'abonnement" } }
        - { id: d, text: { en: "A Conditional Access policy that targets Azure management and requires multifactor authentication", fr: "Une stratégie d'accès conditionnel qui cible la gestion Azure et exige l'authentification multifacteur" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          "Require multifactor authentication for Azure management" is one of the commonly applied Conditional Access policies. Its target resource covers the Azure portal and Azure Resource Manager, so Azure CLI and Azure PowerShell are covered too, while other applications such as Exchange Online aren't targeted.
        fr: |
          « Exiger l'authentification multifacteur pour la gestion Azure » est l'une des stratégies d'accès conditionnel couramment appliquées. Sa ressource cible couvre le portail Azure et Azure Resource Manager, donc aussi Azure CLI et Azure PowerShell, tandis que les autres applications comme Exchange Online ne sont pas ciblées.
      options:
        a: { en: "Targeting all resources would also prompt users when they open their email, which must not change.", fr: "Cibler toutes les ressources solliciterait aussi les utilisateurs quand ils ouvrent leur messagerie, ce qui ne doit pas changer." }
        b: { en: "Blocking access prevents the users from managing Azure at all, instead of letting them in after multifactor authentication.", fr: "Bloquer l'accès empêche complètement les utilisateurs de gérer Azure, au lieu de les laisser entrer après l'authentification multifacteur." }
        c: { en: "An access review periodically confirms who still needs a role; it doesn't add a check at each sign-in.", fr: "Une révision d'accès confirme périodiquement qui a encore besoin d'un rôle ; elle n'ajoute aucune vérification à chaque connexion." }
    references:
      - title: What is Conditional Access? - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
      - title: Targeting Resources in Conditional Access Policies - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-cloud-apps

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-23-04
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum is planning how to delegate the administration of its Microsoft Entra tenant. The tenant has only Microsoft Entra ID Free licenses today, the help desk team is managed as a security group, and an automation application must receive permissions on directory objects.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum planifie la délégation de l'administration de son locataire Microsoft Entra. Le locataire ne dispose aujourd'hui que de licences Microsoft Entra ID Free, l'équipe du support est gérée comme un groupe de sécurité, et une application d'automatisation doit recevoir des autorisations sur des objets de l'annuaire.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A Microsoft Entra role can be assigned to the service principal of the automation application.", fr: "Un rôle Microsoft Entra peut être attribué au principal de service de l'application d'automatisation." } }
        - { id: s2, text: { en: "Adatum must buy Microsoft Entra ID P1 licenses before it can assign the built-in User Administrator role.", fr: "Adatum doit acheter des licences Microsoft Entra ID P1 avant de pouvoir attribuer le rôle intégré User Administrator." } }
        - { id: s3, text: { en: "A Microsoft Entra role can be assigned to a group, so that the members of the group receive the permissions of the role.", fr: "Un rôle Microsoft Entra peut être attribué à un groupe, pour que les membres du groupe reçoivent les autorisations du rôle." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          A role assignment attaches a role definition to a security principal, which can be a user, a group or a service principal: an application can therefore hold a Microsoft Entra role. A group must be created as a role-assignable group, and its members then receive the role's permissions. Built-in roles are free; only custom roles require Microsoft Entra ID P1.
        fr: |
          Une attribution de rôle rattache une définition de rôle à un principal de sécurité, qui peut être un utilisateur, un groupe ou un principal de service : une application peut donc détenir un rôle Microsoft Entra. Un groupe doit être créé comme groupe attribuable à un rôle, et ses membres reçoivent alors les autorisations du rôle. Les rôles intégrés sont gratuits ; seuls les rôles personnalisés demandent Microsoft Entra ID P1.
      options:
        s2: { en: "Using built-in Microsoft Entra roles is free: User Administrator can be assigned with Microsoft Entra ID Free.", fr: "L'utilisation des rôles Microsoft Entra intégrés est gratuite : User Administrator peut être attribué avec Microsoft Entra ID Free." }
    references:
      - title: Overview of Microsoft Entra role-based access control (RBAC) - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-23-05
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys wants its users to register their multifactor authentication methods only while they are on the company network, which is defined as a trusted named location. Registration attempts from anywhere else must be refused, and the users' other access must not be affected.

        To complete the sentence that describes the Conditional Access policy, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys veut que ses utilisateurs inscrivent leurs méthodes d'authentification multifacteur uniquement quand ils sont sur le réseau de l'entreprise, défini comme un emplacement nommé approuvé. Les tentatives d'inscription depuis tout autre endroit doivent être refusées, et les autres accès des utilisateurs ne doivent pas être affectés.

        Pour compléter la phrase qui décrit la stratégie d'accès conditionnel, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The policy targets [[target]] and applies to sign-ins from [[network]]. Its access control is Block access.
        fr: |
          La stratégie cible [[target]] et s'applique aux connexions depuis [[network]]. Son contrôle d'accès est Bloquer l'accès.
      slots:
        - id: target
          options:
            - { id: register, text: { en: "the user action Register security information", fr: "l'action utilisateur Inscrire des informations de sécurité" } }
            - { id: join, text: { en: "the user action Register or join devices", fr: "l'action utilisateur Inscrire ou joindre des appareils" } }
            - { id: all, text: { en: "all resources", fr: "toutes les ressources" } }
        - id: network
          options:
            - { id: trusted, text: { en: "the trusted locations only", fr: "les emplacements approuvés uniquement" } }
            - { id: any, text: { en: "any location, trusted locations included", fr: "tout emplacement, emplacements approuvés compris" } }
            - { id: except, text: { en: "any location except the trusted locations", fr: "tout emplacement sauf les emplacements approuvés" } }
    answer: { values: { target: register, network: except } }
    explanation:
      correct:
        en: |
          Target resources include user actions as well as applications: the Register security information action applies the policy when users register their authentication methods, and nothing else. Including any location and excluding the trusted locations makes the block apply only outside the company network. Requiring trusted locations for security information registration is one of the commonly applied policies.
        fr: |
          Les ressources cibles comprennent des actions de l'utilisateur en plus des applications : l'action Inscrire des informations de sécurité applique la stratégie quand les utilisateurs inscrivent leurs méthodes d'authentification, et à rien d'autre. Inclure tout emplacement et exclure les emplacements approuvés fait que le blocage ne s'applique qu'en dehors du réseau de l'entreprise. Exiger des emplacements approuvés pour l'inscription des informations de sécurité fait partie des stratégies couramment appliquées.
      options:
        join: { en: "Register or join devices concerns adding a device to Microsoft Entra ID, not registering authentication methods.", fr: "Inscrire ou joindre des appareils concerne l'ajout d'un appareil à Microsoft Entra ID, pas l'inscription de méthodes d'authentification." }
        all: { en: "Targeting all resources would block every application outside the office, which affects the users' other access.", fr: "Cibler toutes les ressources bloquerait toutes les applications hors du bureau, ce qui affecte les autres accès des utilisateurs." }
        trusted: { en: "Blocking from the trusted locations only would refuse registration on the company network, the opposite of the requirement.", fr: "Bloquer depuis les seuls emplacements approuvés refuserait l'inscription sur le réseau de l'entreprise, l'inverse du besoin." }
        any: { en: "With the trusted locations included, registration would be blocked everywhere, office included.", fr: "Avec les emplacements approuvés inclus, l'inscription serait bloquée partout, bureau compris." }
    references:
      - title: Targeting Resources in Conditional Access Policies - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-cloud-apps
      - title: What is Conditional Access? - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-23-06
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware has a Microsoft Entra tenant with Microsoft Entra ID P1 licenses and an Azure subscription named Sub1 that trusts the tenant. Sub1 contains two resource groups named RG1 and RG2.

        An engineer must manage the virtual machines in RG1. The engineer must have no permissions in RG2 or in the directory, and the solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Proseware dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1 et d'un abonnement Azure nommé Sub1 qui approuve le locataire. Sub1 contient deux groupes de ressources nommés RG1 et RG2.

        Un ingénieur doit gérer les machines virtuelles de RG1. L'ingénieur ne doit avoir aucune autorisation dans RG2 ni dans l'annuaire, et la solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the engineer a custom Microsoft Entra role with virtual machine permissions", fr: "Attribuer à l'ingénieur un rôle Microsoft Entra personnalisé avec des autorisations sur les machines virtuelles" } }
        - { id: b, text: { en: "Assign the engineer the Contributor Azure role at the scope of Sub1", fr: "Attribuer à l'ingénieur le rôle Azure Contributor à l'étendue de Sub1" } }
        - { id: c, text: { en: "Assign the engineer the Contributor Azure role at the scope of RG1", fr: "Attribuer à l'ingénieur le rôle Azure Contributor à l'étendue de RG1" } }
        - { id: d, text: { en: "Assign the engineer the Global Administrator role and let them elevate access", fr: "Attribuer à l'ingénieur le rôle Global Administrator et le laisser élever son accès" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Virtual machines are Azure resources, so access to them is granted with an Azure role, and a resource group is a valid Azure scope. An assignment on RG1 doesn't reach RG2, and an Azure role gives no permission in Microsoft Entra ID, so both restrictions are met.
        fr: |
          Les machines virtuelles sont des ressources Azure : l'accès s'accorde donc avec un rôle Azure, et un groupe de ressources est une étendue Azure valide. Une attribution sur RG1 n'atteint pas RG2, et un rôle Azure ne donne aucune autorisation dans Microsoft Entra ID : les deux restrictions sont respectées.
      options:
        a: { en: "Microsoft Entra roles, custom ones included, contain permissions on Microsoft Entra resources only; Azure permissions can't be placed in them.", fr: "Les rôles Microsoft Entra, personnalisés compris, ne contiennent que des autorisations sur des ressources Microsoft Entra ; on ne peut pas y placer d'autorisations Azure." }
        b: { en: "An assignment on Sub1 is inherited by every resource group, so the engineer would also manage the resources of RG2.", fr: "Une attribution sur Sub1 est héritée par tous les groupes de ressources : l'ingénieur gérerait aussi les ressources de RG2." }
        d: { en: "Global Administrator gives full control of the directory, and elevation grants User Access Administrator on every subscription: both break the restrictions.", fr: "Global Administrator donne le contrôle total de l'annuaire, et l'élévation accorde User Access Administrator sur tous les abonnements : les deux enfreignent les restrictions." }
    references:
      - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
      - title: Overview of Microsoft Entra role-based access control (RBAC) - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-23-07
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The security team of Fabrikam is writing a design document that describes what Conditional Access will and won't do for the company. The tenant contains applications used by the employees and several single-tenant service principals that automation scripts use to sign in.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe de sécurité de Fabrikam rédige un document de conception qui décrit ce que l'accès conditionnel fera et ne fera pas pour l'entreprise. Le locataire contient des applications utilisées par les employés et plusieurs principaux de service monolocataires que des scripts d'automatisation utilisent pour se connecter.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Conditional Access is designed to be Fabrikam's frontline defense against denial-of-service attacks on the sign-in service.", fr: "L'accès conditionnel est conçu pour être la défense de première ligne de Fabrikam contre les attaques par déni de service visant le service de connexion." } }
        - { id: s2, text: { en: "A Conditional Access policy can be assigned to the single-tenant service principals that the automation scripts use.", fr: "Une stratégie d'accès conditionnel peut être affectée aux principaux de service monolocataires qu'utilisent les scripts d'automatisation." } }
        - { id: s3, text: { en: "When one policy that applies to a sign-in blocks access and another requires multifactor authentication, the user gets access after completing multifactor authentication.", fr: "Quand une stratégie qui s'applique à une connexion bloque l'accès et qu'une autre exige l'authentification multifacteur, l'utilisateur obtient l'accès après avoir effectué l'authentification multifacteur." } }
    answer: { values: { s1: false, s2: true, s3: false } }
    explanation:
      correct:
        en: |
          Conditional Access is enforced after first-factor authentication, so it isn't intended as a frontline defense against denial-of-service attacks. Policies can target workload identities: single-tenant service principals registered in the tenant. All the policies that apply to a sign-in must be satisfied, and a policy with the Block control stops the evaluation and blocks the user, whatever the other policies require.
        fr: |
          L'accès conditionnel est appliqué après l'authentification du premier facteur : il n'est donc pas prévu comme défense de première ligne contre les attaques par déni de service. Les stratégies peuvent cibler des identités de charge de travail : les principaux de service monolocataires inscrits dans le locataire. Toutes les stratégies qui s'appliquent à une connexion doivent être satisfaites, et une stratégie avec le contrôle Bloquer arrête l'évaluation et bloque l'utilisateur, quoi qu'exigent les autres stratégies.
      options:
        s1: { en: "Microsoft states that Conditional Access isn't intended to be the frontline defense for scenarios like denial-of-service attacks, although it can use their signals.", fr: "Microsoft indique que l'accès conditionnel n'est pas prévu comme défense de première ligne pour des scénarios comme le déni de service, même s'il peut en utiliser les signaux." }
        s3: { en: "Block is the most restrictive decision: completing multifactor authentication for the other policy doesn't lift it.", fr: "Bloquer est la décision la plus restrictive : effectuer l'authentification multifacteur pour l'autre stratégie ne la lève pas." }
    references:
      - title: What is Conditional Access? - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
      - title: "Conditional Access Setup: Users, Groups, Agents, and Workload Identities - Microsoft Entra ID"
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-users-groups

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-23-08
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank publishes a finance web application that employees open in a browser. Employees who use unmanaged personal devices must still be able to open and read the documents of the application, but they must not be able to download them. In addition, every user must sign in again after four hours in the application.

        Which two Conditional Access controls should Woodgrove Bank configure? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank publie une application web de finance que les employés ouvrent dans un navigateur. Les employés qui utilisent des appareils personnels non gérés doivent toujours pouvoir ouvrir et lire les documents de l'application, mais ne doivent pas pouvoir les télécharger. De plus, chaque utilisateur doit se reconnecter au bout de quatre heures dans l'application.

        Quels deux contrôles d'accès conditionnel Woodgrove Bank doit-elle configurer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Grant control: Require device to be marked as compliant", fr: "Contrôle d'octroi : Exiger que l'appareil soit marqué comme conforme" } }
        - { id: b, text: { en: "Session control: Sign-in frequency", fr: "Contrôle de session : Fréquence de connexion" } }
        - { id: c, text: { en: "Grant control: Require multifactor authentication", fr: "Contrôle d'octroi : Exiger l'authentification multifacteur" } }
        - { id: d, text: { en: "Session control: Persistent browser session", fr: "Contrôle de session : Session de navigateur persistante" } }
        - { id: e, text: { en: "Session control: Conditional Access App Control", fr: "Contrôle de session : Contrôle d'application par accès conditionnel" } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Session controls limit the experience after access is granted. Sign-in frequency sets how long a user can stay signed in before being prompted to sign in again, here four hours. Conditional Access App Control routes the browser session through Microsoft Defender for Cloud Apps, whose session policies can block the download of documents on unmanaged devices while still allowing access.
        fr: |
          Les contrôles de session limitent l'expérience une fois l'accès accordé. La fréquence de connexion fixe combien de temps un utilisateur reste connecté avant d'être invité à se reconnecter, ici quatre heures. Le contrôle d'application par accès conditionnel fait passer la session du navigateur par Microsoft Defender pour les applications cloud, dont les stratégies de session peuvent bloquer le téléchargement des documents sur les appareils non gérés tout en laissant l'accès.
      options:
        a: { en: "Requiring a compliant device would refuse access from unmanaged personal devices, although these employees must still be able to read the documents.", fr: "Exiger un appareil conforme refuserait l'accès depuis les appareils personnels non gérés, alors que ces employés doivent toujours pouvoir lire les documents." }
        c: { en: "Multifactor authentication strengthens the sign-in, but it neither prevents downloads nor forces a new sign-in after four hours.", fr: "L'authentification multifacteur renforce la connexion, mais n'empêche pas les téléchargements et n'impose pas de nouvelle connexion au bout de quatre heures." }
        d: { en: "A persistent browser session keeps users signed in after they close the browser, which works against the four-hour requirement.", fr: "Une session de navigateur persistante garde les utilisateurs connectés après la fermeture du navigateur, ce qui va à l'encontre de l'exigence des quatre heures." }
    references:
      - title: "Conditional Access: Manage Session Controls Effectively - Microsoft Entra ID"
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-session
      - title: Conditional Access app control - Microsoft Defender for Cloud Apps
        url: https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-23-09
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Northwind Traders has a Microsoft Entra tenant and an Azure subscription named Sub1 that trusts the tenant. Northwind Traders is delegating four administrative tasks, and each assignment must use the narrowest scope that allows the task.

        Match each task to the role assignment that meets it. To answer, drag the appropriate role assignment to each task. Each role assignment may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un locataire Microsoft Entra et d'un abonnement Azure nommé Sub1 qui approuve le locataire. Northwind Traders délègue quatre tâches d'administration, et chaque attribution doit utiliser l'étendue la plus étroite qui permet la tâche.

        Associez chaque tâche à l'attribution de rôle qui y répond. Pour répondre, faites glisser l'attribution de rôle appropriée vers chaque tâche. Chaque attribution de rôle peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: rg, text: { en: "An Azure role assigned at the scope of a resource group", fr: "Un rôle Azure attribué à l'étendue d'un groupe de ressources" } }
        - { id: sub, text: { en: "An Azure role assigned at the scope of Sub1", fr: "Un rôle Azure attribué à l'étendue de Sub1" } }
        - { id: tenant, text: { en: "A Microsoft Entra role assigned at the scope of the tenant", fr: "Un rôle Microsoft Entra attribué à l'étendue du locataire" } }
        - { id: au, text: { en: "A Microsoft Entra role assigned at the scope of an administrative unit", fr: "Un rôle Microsoft Entra attribué à l'étendue d'une unité administrative" } }
        - { id: app, text: { en: "A Microsoft Entra role assigned at the scope of one application", fr: "Un rôle Microsoft Entra attribué à l'étendue d'une seule application" } }
      targets:
        - { id: t1, text: { en: "Manage the virtual machines of a project, which are all in the resource group RG-Proj", fr: "Gérer les machines virtuelles d'un projet, qui sont toutes dans le groupe de ressources RG-Proj" } }
        - { id: t2, text: { en: "Read the configuration of every resource in every resource group of Sub1", fr: "Lire la configuration de chaque ressource de chaque groupe de ressources de Sub1" } }
        - { id: t3, text: { en: "Manage the enterprise application App1, without access to the other applications", fr: "Gérer l'application d'entreprise App1, sans accès aux autres applications" } }
        - { id: t4, text: { en: "Manage every group of the directory, whatever the office of its members", fr: "Gérer chaque groupe de l'annuaire, quel que soit le bureau de ses membres" } }
    answer: { mapping: { t1: rg, t2: sub, t3: app, t4: tenant } }
    explanation:
      correct:
        en: |
          Virtual machines and their configuration are Azure resources: they need Azure roles, at the resource group scope for one project and at the subscription scope for every resource group. Applications and groups are Microsoft Entra resources: a Microsoft Entra role can be scoped to a single application, and a task that covers every group of the directory needs the tenant scope.
        fr: |
          Les machines virtuelles et leur configuration sont des ressources Azure : elles demandent des rôles Azure, à l'étendue du groupe de ressources pour un projet et à l'étendue de l'abonnement pour tous les groupes de ressources. Les applications et les groupes sont des ressources Microsoft Entra : un rôle Microsoft Entra peut être limité à une seule application, et une tâche qui couvre tous les groupes de l'annuaire demande l'étendue du locataire.
      options:
        au: { en: "An administrative unit limits a Microsoft Entra role to the objects it contains, for example the users of one office: it is too narrow for every group of the directory and doesn't apply to Azure resources.", fr: "Une unité administrative limite un rôle Microsoft Entra aux objets qu'elle contient, par exemple les utilisateurs d'un bureau : elle est trop étroite pour tous les groupes de l'annuaire et ne s'applique pas aux ressources Azure." }
    references:
      - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
      - title: Overview of Microsoft Entra role-based access control (RBAC) - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-23-10
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a Microsoft Entra tenant with Microsoft Entra ID P1 licenses and an Azure subscription named Sub1 that trusts the tenant. User1 is assigned the Owner role on Sub1. User2 is assigned a custom Microsoft Entra role at the tenant scope.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1 et d'un abonnement Azure nommé Sub1 qui approuve le locataire. User1 a le rôle Owner sur Sub1. User2 a un rôle Microsoft Entra personnalisé attribué à l'étendue du locataire.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "User1 can assign the Reader role on Sub1 to another user.", fr: "User1 peut attribuer le rôle Reader sur Sub1 à un autre utilisateur." } }
        - { id: s2, text: { en: "The custom role of User2 can include a permission that restarts the virtual machines of Sub1.", fr: "Le rôle personnalisé de User2 peut inclure une autorisation qui redémarre les machines virtuelles de Sub1." } }
        - { id: s3, text: { en: "User2 needs a Microsoft Entra ID P1 license because of the custom role assignment.", fr: "User2 a besoin d'une licence Microsoft Entra ID P1 en raison de l'attribution du rôle personnalisé." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          Owner is an Azure role with full access to the resources of its scope, including the right to assign Azure roles there. Microsoft Entra roles and Azure roles are separate systems: Microsoft Entra role permissions can't be used in Azure custom roles and vice versa, so a custom Microsoft Entra role only covers Microsoft Entra resources. Custom roles require a Microsoft Entra ID P1 license for every user who has a custom role assignment.
        fr: |
          Owner est un rôle Azure qui donne un accès total aux ressources de son étendue, y compris le droit d'y attribuer des rôles Azure. Les rôles Microsoft Entra et les rôles Azure sont deux systèmes distincts : les autorisations des rôles Microsoft Entra ne peuvent pas être utilisées dans des rôles Azure personnalisés, et inversement ; un rôle Microsoft Entra personnalisé ne couvre donc que des ressources Microsoft Entra. Les rôles personnalisés demandent une licence Microsoft Entra ID P1 pour chaque utilisateur qui a une attribution de rôle personnalisé.
      options:
        s2: { en: "Restarting a virtual machine is an Azure permission; it can only be part of an Azure role, never of a Microsoft Entra role.", fr: "Redémarrer une machine virtuelle est une autorisation Azure ; elle ne peut faire partie que d'un rôle Azure, jamais d'un rôle Microsoft Entra." }
    references:
      - title: Overview of Microsoft Entra role-based access control (RBAC) - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview
      - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
