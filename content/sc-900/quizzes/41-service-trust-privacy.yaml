chapter: 41-service-trust-privacy
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A compliance analyst signs in to the Service Trust Portal with her Microsoft Entra organization account to open an audit report.

        What else must she do before she can access some of the compliance materials?
      fr: |
        Une analyste de la conformité se connecte au Portail d'approbation des services avec son compte d'organisation Microsoft Entra pour ouvrir un rapport d'audit.

        Que doit-elle faire d'autre avant de pouvoir accéder à certains documents de conformité ?
    body:
      options:
        - { id: a, text: { en: "Create an assessment for the same standard in Compliance Manager", fr: "Créer une évaluation pour la même norme dans le Gestionnaire de conformité" } }
        - { id: b, text: { en: "Ask a Microsoft account manager to email her the report directly", fr: "Demander à un responsable de compte Microsoft de lui envoyer directement le rapport" } }
        - { id: c, text: { en: "Accept Microsoft's non-disclosure agreement for compliance materials", fr: "Accepter l'accord de confidentialité de Microsoft pour les documents de conformité" } }
        - { id: d, text: { en: "Save the report to My Library, then wait for a confirmation email", fr: "Enregistrer le rapport dans Ma bibliothèque, puis attendre un e-mail de confirmation" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Service Trust Portal is a public site, but some resources are reserved for authenticated users. To open them, the user signs in with a Microsoft Entra organization account and reviews and accepts the Microsoft Non-Disclosure Agreement for Compliance Materials.
        fr: |
          Le Portail d'approbation des services est un site public, mais certaines ressources sont réservées aux utilisateurs authentifiés. Pour les ouvrir, l'utilisateur se connecte avec un compte d'organisation Microsoft Entra, puis examine et accepte l'accord de confidentialité de Microsoft pour les documents de conformité.
      options:
        a: { en: "An assessment in Compliance Manager measures your own organization's compliance; it isn't a condition for reading Microsoft's audit reports.", fr: "Une évaluation du Gestionnaire de conformité mesure la conformité de votre propre organisation ; ce n'est pas une condition pour lire les rapports d'audit de Microsoft." }
        b: { en: "The reports are published for download in the portal itself; no request to a Microsoft contact is needed.", fr: "Les rapports sont publiés en téléchargement dans le portail lui-même ; aucune demande à un contact Microsoft n'est nécessaire." }
        d: { en: "My Library keeps documents in one place and sends notifications of updates; it doesn't grant access to restricted materials.", fr: "Ma bibliothèque conserve des documents au même endroit et envoie des notifications de mise à jour ; elle ne donne pas accès aux documents restreints." }
    references:
      - title: Get started with the Microsoft Service Trust Portal
        url: https://learn.microsoft.com/en-us/purview/get-started-with-service-trust-portal

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-41-02
    objective: "4.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        According to the privacy principles of Microsoft, for what purpose does Microsoft use the data that a customer stores in Microsoft cloud services?
      fr: |
        Selon les principes de confidentialité de Microsoft, dans quel but Microsoft utilise-t-il les données qu'un client stocke dans les services cloud Microsoft ?
    body:
      options:
        - { id: a, text: { en: "To target advertising at the customer's users", fr: "Pour cibler la publicité vers les utilisateurs du client" } }
        - { id: b, text: { en: "Only to provide the services the customer chose", fr: "Uniquement pour fournir les services choisis par le client" } }
        - { id: c, text: { en: "For marketing research on the customer's industry", fr: "Pour des études de marché sur le secteur du client" } }
        - { id: d, text: { en: "For any purpose that its subcontractors request", fr: "Pour tout usage que demandent ses sous-traitants" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Under the principle "You control your data", the data belongs to the customer, and Microsoft uses it only to provide the services that the customer has chosen. This commitment is guaranteed by Microsoft's contractual commitments.
        fr: |
          Selon le principe « Vous contrôlez vos données », les données appartiennent au client, et Microsoft ne les utilise que pour fournir les services que le client a choisis. Cet engagement est garanti par les engagements contractuels de Microsoft.
      options:
        a: { en: "Microsoft doesn't share customer data with advertiser-supported services and doesn't mine it for advertising.", fr: "Microsoft ne partage pas les données des clients avec des services financés par la publicité et ne les exploite pas à des fins publicitaires." }
        c: { en: "Microsoft doesn't mine customer data for purposes such as marketing research or advertising.", fr: "Microsoft n'exploite pas les données des clients à des fins comme les études de marché ou la publicité." }
        d: { en: "Subcontractors that need access to customer data can perform only the functions they were engaged for, under the same privacy commitments.", fr: "Les sous-traitants qui ont besoin d'accéder aux données des clients ne peuvent exécuter que les fonctions pour lesquelles ils ont été engagés, avec les mêmes engagements de confidentialité." }
    references:
      - title: Describe Microsoft's privacy principles
        url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-41-03
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's risk committee asks who produced the audit reports on Microsoft cloud services that are published in the Service Trust Portal.

        What should the compliance team answer?
      fr: |
        Le comité des risques de Fabrikam demande qui a produit les rapports d'audit sur les services cloud Microsoft publiés dans le Portail d'approbation des services.

        Que doit répondre l'équipe de conformité ?
    body:
      options:
        - { id: a, text: { en: "The engineering teams that operate each Microsoft cloud service", fr: "Les équipes d'ingénierie qui exploitent chaque service cloud Microsoft" } }
        - { id: b, text: { en: "The internal auditors of each customer that uses the services", fr: "Les auditeurs internes de chaque client qui utilise les services" } }
        - { id: c, text: { en: "Compliance Manager, from the signals of each customer tenant", fr: "Le Gestionnaire de conformité, à partir des signaux de chaque locataire client" } }
        - { id: d, text: { en: "External auditors who assessed the Microsoft cloud services", fr: "Des auditeurs externes qui ont évalué les services cloud Microsoft" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Service Trust Portal publishes audit reports produced by external auditors on Microsoft cloud services, which users can download. Microsoft itself writes the whitepapers of the portal, not the audit reports.
        fr: |
          Le Portail d'approbation des services publie des rapports d'audit produits par des auditeurs externes sur les services cloud Microsoft, que les utilisateurs peuvent télécharger. Microsoft rédige lui-même les livres blancs du portail, pas les rapports d'audit.
      options:
        a: { en: "The documents written by Microsoft are the whitepapers; the audit reports come from independent, external auditors.", fr: "Les documents rédigés par Microsoft sont les livres blancs ; les rapports d'audit viennent d'auditeurs externes et indépendants." }
        b: { en: "The reports assess Microsoft's services, not the customers; a customer's own auditors don't publish them in the portal.", fr: "Les rapports évaluent les services de Microsoft, pas les clients ; les propres auditeurs d'un client ne les publient pas dans le portail." }
        c: { en: "Compliance Manager calculates a compliance score for your tenant in the Microsoft Purview portal; it doesn't produce Microsoft's audit reports.", fr: "Le Gestionnaire de conformité calcule un score de conformité pour votre locataire dans le portail Microsoft Purview ; il ne produit pas les rapports d'audit de Microsoft." }
    references:
      - title: Describe the offerings of the Service Trust portal
        url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-41-04
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso plans to move the HR records of its 4,000 employees to Microsoft 365. Before the contract is signed, the works council asks the legal team several questions about these records, and the team answers them from the privacy principles of Microsoft.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso prévoit de déplacer vers Microsoft 365 les dossiers RH de ses 4 000 employés. Avant la signature du contrat, le comité social et économique pose plusieurs questions sur ces dossiers à l'équipe juridique, qui y répond à partir des principes de confidentialité de Microsoft.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Contoso can determine the geography in which its HR records are stored.", fr: "Contoso peut déterminer la zone géographique dans laquelle ses dossiers RH sont stockés." } }
        - { id: s2, text: { en: "Microsoft encrypts the HR records in transit, and encrypting them at rest is left to Contoso.", fr: "Microsoft chiffre les dossiers RH en transit, et leur chiffrement au repos est laissé à Contoso." } }
        - { id: s3, text: { en: "Microsoft's privacy commitments to Contoso are guaranteed through contractual commitments.", fr: "Les engagements de confidentialité de Microsoft envers Contoso sont garantis par des engagements contractuels." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          Under "Know where your data is located", Microsoft offers data residency options so that a customer can determine where its data is stored. Under "Your data is secured at rest and in transit", Microsoft encrypts data both at rest (up to AES-256) and in transit (TLS, IPsec): encryption at rest isn't left to the customer. Microsoft's whole approach to privacy is guaranteed through contractual commitments.
        fr: |
          Selon « Savoir où se trouvent vos données », Microsoft propose des options de résidence des données pour qu'un client puisse déterminer où ses données sont stockées. Selon « Vos données sont sécurisées au repos et en transit », Microsoft chiffre les données à la fois au repos (jusqu'à AES-256) et en transit (TLS, IPsec) : le chiffrement au repos n'est pas laissé au client. Toute l'approche de Microsoft en matière de confidentialité est garantie par des engagements contractuels.
    references:
      - title: Describe Microsoft's privacy principles
        url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-41-05
    objective: "4.1.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Health, a hospital group, is moving its patient scheduling to Microsoft cloud services. Its compliance officer prepares a document pack for the board: she signs in to the Service Trust Portal with her Microsoft Entra organization account and looks for three kinds of documents.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Health, un groupe hospitalier, déplace la planification de ses patients vers les services cloud Microsoft. Sa responsable de la conformité prépare un dossier pour le conseil d'administration : elle se connecte au Portail d'approbation des services avec son compte d'organisation Microsoft Entra et recherche trois types de documents.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To find the resources that Microsoft publishes for healthcare and life sciences organizations, she opens [[health]].

          To read Microsoft's privacy and data protection resources, she opens [[privacy]].

          To see the documents that are restricted to her own tenant, according to its subscription and permissions, she opens [[tenant]].
        fr: |
          Pour trouver les ressources que Microsoft publie pour les organisations de soins de santé et de sciences de la vie, elle ouvre [[health]].

          Pour lire les ressources de Microsoft sur la confidentialité et la protection des données, elle ouvre [[privacy]].

          Pour voir les documents restreints à son propre locataire, selon son abonnement et ses autorisations, elle ouvre [[tenant]].
      slots:
        - id: health
          options:
            - { id: crs, text: { en: "Certifications, Regulations, and Standards", fr: "Certifications, réglementations et normes" } }
            - { id: rwa, text: { en: "Reports, Whitepapers, and Artifacts", fr: "Rapports, livres blancs et artefacts" } }
            - { id: irr, text: { en: "Industry and Regional Resources", fr: "Ressources sectorielles et régionales" } }
            - { id: rfo, text: { en: "Resources for your Organization", fr: "Ressources pour votre organisation" } }
        - id: privacy
          options:
            - { id: crs, text: { en: "Certifications, Regulations, and Standards", fr: "Certifications, réglementations et normes" } }
            - { id: rwa, text: { en: "Reports, Whitepapers, and Artifacts", fr: "Rapports, livres blancs et artefacts" } }
            - { id: irr, text: { en: "Industry and Regional Resources", fr: "Ressources sectorielles et régionales" } }
            - { id: rfo, text: { en: "Resources for your Organization", fr: "Ressources pour votre organisation" } }
        - id: tenant
          options:
            - { id: crs, text: { en: "Certifications, Regulations, and Standards", fr: "Certifications, réglementations et normes" } }
            - { id: rwa, text: { en: "Reports, Whitepapers, and Artifacts", fr: "Rapports, livres blancs et artefacts" } }
            - { id: irr, text: { en: "Industry and Regional Resources", fr: "Ressources sectorielles et régionales" } }
            - { id: rfo, text: { en: "Resources for your Organization", fr: "Ressources pour votre organisation" } }
    answer: { values: { health: irr, privacy: rwa, tenant: rfo } }
    explanation:
      correct:
        en: |
          Industry and Regional Resources groups documents by industry (financial services, healthcare and life sciences, media and entertainment, United States government) and by region. Reports, Whitepapers, and Artifacts holds general documents: business continuity and disaster recovery, penetration tests, privacy and data protection, FAQ and whitepapers. Resources for your Organization lists the documents that apply to your organization, restricted by tenant according to its subscription and permissions.
        fr: |
          Ressources sectorielles et régionales regroupe des documents par secteur (services financiers, soins de santé et sciences de la vie, médias et divertissements, gouvernement des États-Unis) et par région. Rapports, livres blancs et artefacts contient des documents généraux : continuité d'activité et reprise d'activité, tests d'intrusion, confidentialité et protection des données, FAQ et livres blancs. Ressources pour votre organisation liste les documents qui s'appliquent à votre organisation, restreints par locataire selon son abonnement et ses autorisations.
      options:
        crs: { en: "Certifications, Regulations, and Standards shows how Microsoft cloud services meet standards such as ISO/IEC, SOC or GDPR; it isn't organized by industry and isn't restricted by tenant.", fr: "Certifications, réglementations et normes montre comment les services cloud Microsoft respectent des normes comme ISO/IEC, SOC ou le RGPD ; elle n'est pas organisée par secteur et n'est pas restreinte par locataire." }
    references:
      - title: Describe the offerings of the Service Trust portal
        url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-41-06
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A compliance officer at Contoso and one at Fabrikam each sign in to the Service Trust Portal with their own Microsoft Entra organization account. They open the same content category of the portal, but each of them sees a different list of documents.

        Which category did they open, and why do the lists differ?
      fr: |
        Une responsable de la conformité de Contoso et une de Fabrikam se connectent chacune au Portail d'approbation des services avec leur propre compte d'organisation Microsoft Entra. Elles ouvrent la même catégorie de contenu du portail, mais chacune voit une liste de documents différente.

        Quelle catégorie ont-elles ouverte, et pourquoi les listes diffèrent-elles ?
    body:
      options:
        - { id: a, text: { en: "Industry and Regional Resources, because documents depend on the country where each company is registered", fr: "Ressources sectorielles et régionales, car les documents dépendent du pays où chaque entreprise est immatriculée" } }
        - { id: b, text: { en: "Resources for your Organization, because access is restricted by tenant according to its subscription and permissions", fr: "Ressources pour votre organisation, car l'accès est restreint par locataire selon son abonnement et ses autorisations" } }
        - { id: c, text: { en: "Certifications, Regulations, and Standards, because each company sees only the standards it is certified for", fr: "Certifications, réglementations et normes, car chaque entreprise ne voit que les normes pour lesquelles elle est certifiée" } }
        - { id: d, text: { en: "Reports, Whitepapers, and Artifacts, because penetration test reports go only to companies that requested them", fr: "Rapports, livres blancs et artefacts, car les rapports de tests d'intrusion ne vont qu'aux entreprises qui les ont demandés" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Resources for your Organization lists the documents that apply to the signed-in user's organization. Access to them is restricted by tenant and based on the organization's subscription and permissions, so two companies see different lists in this category.
        fr: |
          Ressources pour votre organisation liste les documents qui s'appliquent à l'organisation de l'utilisateur connecté. Leur accès est restreint par locataire et dépend de l'abonnement et des autorisations de l'organisation : deux entreprises voient donc des listes différentes dans cette catégorie.
      options:
        a: { en: "Industry and Regional Resources offers documents by industry and region to every user; it doesn't filter them by the customer's country of registration.", fr: "Ressources sectorielles et régionales propose à tous les utilisateurs des documents par secteur et par région ; elle ne les filtre pas selon le pays d'immatriculation du client." }
        c: { en: "This category documents how Microsoft cloud services meet standards; it says nothing about the customer's own certifications.", fr: "Cette catégorie documente comment les services cloud Microsoft respectent les normes ; elle ne dit rien des propres certifications du client." }
        d: { en: "Third-party penetration test and security assessment reports are general documents of the portal, not documents sent on request.", fr: "Les rapports de tests d'intrusion et d'évaluations de sécurité menés par des tiers sont des documents généraux du portail, pas des documents envoyés sur demande." }
    references:
      - title: Describe the offerings of the Service Trust portal
        url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-41-07
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum prepares an ISO/IEC 27001 certification of its own information security management system, which includes the Microsoft 365 tenant used by its 900 employees. Its compliance officer has a Microsoft Entra organization account and plans to rely on the Service Trust Portal throughout the project, alongside the other tools of the security team.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum prépare une certification ISO/IEC 27001 de son propre système de management de la sécurité de l'information, qui inclut le locataire Microsoft 365 utilisé par ses 900 employés. Sa responsable de la conformité a un compte d'organisation Microsoft Entra et prévoit de s'appuyer sur le Portail d'approbation des services pendant tout le projet, à côté des autres outils de l'équipe de sécurité.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The ISO/IEC 27001 audit reports in the portal certify Adatum's own workloads in Microsoft 365.", fr: "Les rapports d'audit ISO/IEC 27001 du portail certifient les propres charges de travail d'Adatum dans Microsoft 365." } }
        - { id: s2, text: { en: "The portal provides guidance that helps Adatum manage the security and compliance of its own cloud data.", fr: "Le portail fournit des conseils qui aident Adatum à gérer la sécurité et la conformité de ses propres données cloud." } }
        - { id: s3, text: { en: "The portal alerts Adatum's security team when it detects suspicious activity in Adatum's tenant.", fr: "Le portail alerte l'équipe de sécurité d'Adatum quand il détecte une activité suspecte dans le locataire d'Adatum." } }
    answer: { values: { s1: false, s2: true, s3: false } }
    explanation:
      correct:
        en: |
          The audit reports of the Service Trust Portal assess Microsoft cloud services: they prove Microsoft's compliance, not Adatum's, whose progress is tracked in Compliance Manager. The portal also provides content and guidance on how customers can manage the security and compliance of their own cloud data. It isn't a security monitoring tool: alerts on suspicious activity come from the Microsoft Defender solutions.
        fr: |
          Les rapports d'audit du Portail d'approbation des services évaluent les services cloud Microsoft : ils prouvent la conformité de Microsoft, pas celle d'Adatum, dont l'avancement se suit dans le Gestionnaire de conformité. Le portail fournit aussi du contenu et des conseils sur la façon dont les clients peuvent gérer la sécurité et la conformité de leurs propres données cloud. Ce n'est pas un outil de surveillance de la sécurité : les alertes sur une activité suspecte viennent des solutions Microsoft Defender.
    references:
      - title: Describe the offerings of the Service Trust portal
        url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-41-08
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware is a contractor of a United States federal agency. Its compliance team needs two sets of documents from the Service Trust Portal: the documents that show how Microsoft cloud services meet FedRAMP, and the resources that Microsoft publishes exclusively for United States Government customers.

        Which two content categories should the team open? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware est un sous-traitant d'une agence fédérale des États-Unis. Son équipe de conformité a besoin de deux ensembles de documents du Portail d'approbation des services : les documents qui montrent comment les services cloud Microsoft respectent FedRAMP, et les ressources que Microsoft publie exclusivement pour les clients du gouvernement des États-Unis.

        Quelles sont les deux catégories de contenu que l'équipe doit ouvrir ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Reports, Whitepapers, and Artifacts", fr: "Rapports, livres blancs et artefacts" } }
        - { id: b, text: { en: "Certifications, Regulations, and Standards", fr: "Certifications, réglementations et normes" } }
        - { id: c, text: { en: "Resources for your Organization", fr: "Ressources pour votre organisation" } }
        - { id: d, text: { en: "Industry and Regional Resources", fr: "Ressources sectorielles et régionales" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          FedRAMP is one of the standards and regulations of the Certifications, Regulations, and Standards category, next to ISO/IEC, SOC, GDPR and PCI DSS. The resources reserved for United States Government customers are an industry entry of the Industry and Regional Resources category. The two needs therefore sit in two different categories, even though both concern the US government.
        fr: |
          FedRAMP fait partie des normes et réglementations de la catégorie Certifications, réglementations et normes, à côté d'ISO/IEC, de SOC, du RGPD et de PCI DSS. Les ressources réservées aux clients du gouvernement des États-Unis sont une entrée sectorielle de la catégorie Ressources sectorielles et régionales. Les deux besoins se trouvent donc dans deux catégories différentes, même s'ils concernent tous deux le gouvernement américain.
      options:
        a: { en: "Reports, Whitepapers, and Artifacts holds general documents (BCP and DR, penetration tests, privacy, FAQ and whitepapers), not the documents of a specific standard or industry.", fr: "Rapports, livres blancs et artefacts contient des documents généraux (continuité et reprise d'activité, tests d'intrusion, confidentialité, FAQ et livres blancs), pas les documents d'une norme ou d'un secteur précis." }
        c: { en: "Resources for your Organization shows the documents restricted to Litware's tenant; it isn't where Microsoft publishes its FedRAMP documents or its US Government resources.", fr: "Ressources pour votre organisation montre les documents restreints au locataire de Litware ; ce n'est pas là que Microsoft publie ses documents FedRAMP ni ses ressources pour le gouvernement des États-Unis." }
    references:
      - title: Get started with the Microsoft Service Trust Portal
        url: https://learn.microsoft.com/en-us/purview/get-started-with-service-trust-portal
      - title: Describe the offerings of the Service Trust portal
        url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/2-describe-service-trust-portal

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-41-09
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank keeps customer files in Microsoft 365 and encrypts some of them with keys that it manages itself. Before a meeting with the bank's regulator, the data protection officer checks her notes on what the privacy principles of Microsoft promise about government demands, subcontractors and keys.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank conserve des dossiers clients dans Microsoft 365 et en chiffre certains avec des clés qu'elle gère elle-même. Avant une réunion avec le régulateur de la banque, la déléguée à la protection des données vérifie ses notes sur ce que promettent les principes de confidentialité de Microsoft au sujet des demandes gouvernementales, des sous-traitants et des clés.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "When a government presents a legally valid demand, Microsoft gives it direct access to the bank's data.", fr: "Quand un gouvernement présente une demande juridiquement valide, Microsoft lui donne un accès direct aux données de la banque." } }
        - { id: s2, text: { en: "A subcontractor that processes the bank's data is bound by the same contractual privacy commitments as Microsoft.", fr: "Un sous-traitant qui traite les données de la banque est lié par les mêmes engagements contractuels de confidentialité que Microsoft." } }
        - { id: s3, text: { en: "By using Azure Key Vault, the bank keeps control of the encryption keys and secrets that protect its data.", fr: "En utilisant Azure Key Vault, la banque garde le contrôle des clés de chiffrement et des secrets qui protègent ses données." } }
    answer: { values: { s1: false, s2: true, s3: true } }
    explanation:
      correct:
        en: |
          Microsoft doesn't give any government direct or unfettered access to customer data: even a valid demand leads at most to the disclosure that the law requires, and Microsoft's position is that the request should be directed to the customer. Subcontractors can perform only the functions they were engaged for and are bound by the same contractual privacy commitments. Under "Your data is secured at rest and in transit", services such as Azure Key Vault give the customer control over keys and secrets.
        fr: |
          Microsoft ne donne à aucun gouvernement un accès direct ou sans entrave aux données des clients : même une demande valide conduit au plus à la divulgation que la loi exige, et la position de Microsoft est que la demande doit être adressée au client. Les sous-traitants ne peuvent exécuter que les fonctions pour lesquelles ils ont été engagés et sont liés par les mêmes engagements contractuels de confidentialité. Selon « Vos données sont sécurisées au repos et en transit », des services comme Azure Key Vault donnent au client le contrôle des clés et des secrets.
    references:
      - title: Describe Microsoft's privacy principles
        url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-41-10
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        For a contract review, Proseware's legal team writes a summary of Microsoft's cloud privacy commitments. It found four of them in Microsoft's documentation and wants to file each one under the principle that states it.

        Under which privacy principle should the team file each commitment? To answer, drag a principle onto each commitment. Each principle may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Pour la revue d'un contrat, l'équipe juridique de Proseware rédige une synthèse des engagements de confidentialité de Microsoft pour le cloud. Elle en a trouvé quatre dans la documentation de Microsoft et veut classer chacun sous le principe qui l'énonce.

        Sous quel principe de confidentialité l'équipe doit-elle classer chaque engagement ? Pour répondre, faites glisser un principe sur chaque engagement. Chaque principe peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: control, text: { en: "You control your data", fr: "Vous contrôlez vos données" } }
        - { id: location, text: { en: "Know where your data is located", fr: "Savoir où se trouvent vos données" } }
        - { id: secured, text: { en: "Your data is secured at rest and in transit", fr: "Vos données sont sécurisées au repos et en transit" } }
        - { id: defends, text: { en: "Microsoft defends your data", fr: "Microsoft défend vos données" } }
      targets:
        - { id: t1, text: { en: "Microsoft doesn't share customer data with advertiser-supported services.", fr: "Microsoft ne partage pas les données des clients avec des services financés par la publicité." } }
        - { id: t2, text: { en: "Microsoft is transparent about how customer data is stored and processed.", fr: "Microsoft fait preuve de transparence sur la façon dont les données des clients sont stockées et traitées." } }
        - { id: t3, text: { en: "Government requests for customer data should be directed to the customer.", fr: "Les demandes gouvernementales portant sur les données des clients doivent être adressées au client." } }
        - { id: t4, text: { en: "Customers can access, modify or delete their data at any time.", fr: "Les clients peuvent accéder à leurs données, les modifier ou les supprimer à tout moment." } }
    answer: { mapping: { t1: control, t2: location, t3: defends, t4: control } }
    explanation:
      correct:
        en: |
          "You control your data" covers ownership (access, modify or delete at any time) and the limits on Microsoft's use of the data, including no sharing with advertiser-supported services. "Know where your data is located" covers data residency and Microsoft's transparency about how data is stored and processed. "Microsoft defends your data" covers government requests, which Microsoft's position directs to the customer. No commitment of the list concerns encryption, so "Your data is secured at rest and in transit" isn't used.
        fr: |
          « Vous contrôlez vos données » couvre la propriété (accéder, modifier ou supprimer à tout moment) et les limites de l'usage des données par Microsoft, dont l'absence de partage avec des services financés par la publicité. « Savoir où se trouvent vos données » couvre la résidence des données et la transparence de Microsoft sur la façon dont elles sont stockées et traitées. « Microsoft défend vos données » couvre les demandes gouvernementales, que la position de Microsoft renvoie vers le client. Aucun engagement de la liste ne concerne le chiffrement : « Vos données sont sécurisées au repos et en transit » n'est donc pas utilisé.
      options:
        secured: { en: "This principle covers encryption at rest and in transit and the control of keys and secrets (Azure Key Vault); none of the four commitments is about encryption.", fr: "Ce principe couvre le chiffrement au repos et en transit et le contrôle des clés et des secrets (Azure Key Vault) ; aucun des quatre engagements ne porte sur le chiffrement." }
    references:
      - title: Describe Microsoft's privacy principles
        url: https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/3-describe-microsofts-privacy-principles
