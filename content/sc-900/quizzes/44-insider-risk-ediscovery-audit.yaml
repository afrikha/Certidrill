chapter: 44-insider-risk-ediscovery-audit
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-44-01
    objective: "4.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        In Microsoft Purview Insider Risk Management, a reviewer can hand a serious case over to eDiscovery, because the solution shares one workflow with the other Microsoft Purview solutions.

        Which principle of insider risk management does this describe?
      fr: |
        Dans la gestion des risques internes Microsoft Purview, un réviseur peut transmettre un cas grave à eDiscovery, car la solution partage un seul flux de travail avec les autres solutions Microsoft Purview.

        Quel principe de la gestion des risques internes cela décrit-il ?
    body:
      options:
        - { id: a, text: { en: "Transparency", fr: "Transparence" } }
        - { id: b, text: { en: "Configurable", fr: "Configurable" } }
        - { id: c, text: { en: "Actionable", fr: "Actionnable" } }
        - { id: d, text: { en: "Integrated", fr: "Intégré" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Integrated principle means one workflow across the Microsoft Purview solutions: for example, a case can be escalated to eDiscovery, which then preserves, reviews and exports the related content.
        fr: |
          Le principe Intégré désigne un flux de travail unique à travers les solutions Microsoft Purview : par exemple, un cas peut être transmis à eDiscovery, qui préserve, examine et exporte ensuite le contenu lié.
      options:
        a: { en: "Transparency balances user privacy against organizational risk, with privacy by design: users are pseudonymized by default.", fr: "La transparence met en balance la vie privée des utilisateurs et le risque pour l'organisation, avec une confidentialité dès la conception : les utilisateurs sont pseudonymisés par défaut." }
        b: { en: "Configurable means that policies are adapted to the industry, the geography and the business groups.", fr: "Configurable signifie que les stratégies sont adaptées au secteur, à la zone géographique et aux groupes métier." }
        c: { en: "Actionable means insights that lead to reviewer notifications, data investigations and user investigations.", fr: "Actionnable désigne des informations qui débouchent sur des notifications aux réviseurs, des investigations sur les données et des investigations sur les utilisateurs." }
    references:
      - title: Learn about Insider Risk Management
        url: https://learn.microsoft.com/en-us/purview/insider-risk-management

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-44-02
    objective: "4.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A compliance administrator of Litware used to run searches across mailboxes and sites with the separate Content search tool of Microsoft Purview.

        Where is this search capability found now?
      fr: |
        Un administrateur de conformité de Litware lançait des recherches dans les boîtes aux lettres et les sites avec l'outil distinct Recherche de contenu (Content search) de Microsoft Purview.

        Où se trouve maintenant cette fonctionnalité de recherche ?
    body:
      options:
        - { id: a, text: { en: "In Content explorer", fr: "Dans l'Explorateur de contenu" } }
        - { id: b, text: { en: "In eDiscovery", fr: "Dans eDiscovery" } }
        - { id: c, text: { en: "In Audit", fr: "Dans Audit" } }
        - { id: d, text: { en: "In Activity explorer", fr: "Dans l'Explorateur d'activités" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Content search, formerly a separate tool, is now part of eDiscovery: its functionality is included by default in a system-generated eDiscovery case, available to eDiscovery managers and administrators.
        fr: |
          La recherche de contenu, autrefois un outil distinct, fait maintenant partie d'eDiscovery : ses fonctionnalités sont incluses par défaut dans un cas eDiscovery généré par le système, accessible aux gestionnaires et aux administrateurs eDiscovery.
      options:
        a: { en: "Content explorer shows the items that have a label or a sensitive information type; it doesn't run searches for a legal investigation.", fr: "L'Explorateur de contenu montre les éléments qui ont une étiquette ou un type d'informations sensibles ; il ne lance pas de recherches pour une investigation juridique." }
        c: { en: "Audit searches the records of user and administrator activities, not the content of mailboxes and sites.", fr: "Audit recherche les enregistrements des activités des utilisateurs et des administrateurs, pas le contenu des boîtes aux lettres et des sites." }
        d: { en: "Activity explorer shows the activities performed on labeled content during the last 30 days; it doesn't search content.", fr: "L'Explorateur d'activités montre les activités effectuées sur le contenu étiqueté au cours des 30 derniers jours ; il ne recherche pas de contenu." }
    references:
      - title: Learn about eDiscovery
        url: https://learn.microsoft.com/en-us/purview/edisc

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-44-03
    objective: "4.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        During a legal case, a search of Fabrikam's reviewers finds a single Microsoft Teams chat message that mentions a disputed contract. To understand it, the reviewers need the other messages of the same Teams conversation in their review set.

        Which premium eDiscovery feature should they use?
      fr: |
        Pendant une affaire juridique, une recherche des réviseurs de Fabrikam trouve un seul message de conversation Microsoft Teams qui mentionne un contrat litigieux. Pour le comprendre, les réviseurs ont besoin des autres messages de la même conversation Teams dans leur ensemble de révision.

        Quelle fonctionnalité premium d'eDiscovery doivent-ils utiliser ?
    body:
      options:
        - { id: a, text: { en: "Optical character recognition (OCR)", fr: "La reconnaissance optique de caractères (OCR)" } }
        - { id: b, text: { en: "Automatic decryption", fr: "Le déchiffrement automatique" } }
        - { id: c, text: { en: "Conversation threading", fr: "Le regroupement des conversations en fils (conversation threading)" } }
        - { id: d, text: { en: "Near duplicate detection", fr: "La détection des quasi-doublons (near duplicate detection)" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Conversation threading adds the whole Teams or Viva Engage conversation that contains a matching message, so that reviewers read the message in its context.
        fr: |
          Le regroupement des conversations en fils ajoute toute la conversation Teams ou Viva Engage qui contient un message correspondant, pour que les réviseurs lisent le message dans son contexte.
      options:
        a: { en: "OCR extracts the text of images so that it can be searched; it doesn't add the surrounding messages.", fr: "L'OCR extrait le texte des images pour qu'il puisse être recherché ; elle n'ajoute pas les messages qui entourent le message trouvé." }
        b: { en: "Automatic decryption makes encrypted items readable in a review set; the Teams message here isn't encrypted.", fr: "Le déchiffrement automatique rend lisibles les éléments chiffrés d'un ensemble de révision ; le message Teams n'est pas chiffré ici." }
        d: { en: "Near duplicate detection groups similar documents to reduce what must be reviewed; it doesn't rebuild a conversation.", fr: "La détection des quasi-doublons regroupe les documents semblables pour réduire ce qui doit être examiné ; elle ne reconstitue pas une conversation." }
    references:
      - title: Learn about eDiscovery
        url: https://learn.microsoft.com/en-us/purview/edisc

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-44-04
    objective: "4.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An insider risk management alert at Proseware shows that an employee uploaded a confidential file to a personal cloud storage service. The investigation of the case concludes that the employee did it by mistake, unaware of the company policy. The reviewer wants the employee to learn the policy, and no legal investigation is needed.

        What should the reviewer do?
      fr: |
        Une alerte de gestion des risques internes chez Proseware montre qu'un employé a chargé un fichier confidentiel dans un service de stockage cloud personnel. L'examen du cas conclut que l'employé l'a fait par erreur, sans connaître la stratégie de l'entreprise. Le réviseur veut que l'employé apprenne la stratégie, et aucune investigation juridique n'est nécessaire.

        Que doit faire le réviseur ?
    body:
      options:
        - { id: a, text: { en: "Send the employee a reminder notice based on a notice template", fr: "Envoyer à l'employé un rappel fondé sur un modèle de notification" } }
        - { id: b, text: { en: "Escalate the case to eDiscovery for a review by the legal team", fr: "Transmettre le cas à eDiscovery pour un examen par l'équipe juridique" } }
        - { id: c, text: { en: "Dismiss the alert during triage so that the case is closed", fr: "Rejeter l'alerte lors du triage pour que le cas soit fermé" } }
        - { id: d, text: { en: "Create an audit log retention policy for the employee's account", fr: "Créer une stratégie de rétention des journaux d'audit pour le compte de l'employé" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          When users violate a policy accidentally or inadvertently, the reviewer can send them a simple reminder notice, built from notice templates that the organization customizes. This is one of the actions of the last step of the insider risk management workflow.
        fr: |
          Quand des utilisateurs enfreignent une stratégie accidentellement ou par inadvertance, le réviseur peut leur envoyer un simple rappel, créé à partir de modèles de notification que l'organisation personnalise. C'est l'une des actions de la dernière étape du flux de travail de la gestion des risques internes.
      options:
        b: { en: "Escalating to eDiscovery is for a serious case that needs a legal investigation, which the reviewer ruled out.", fr: "La transmission à eDiscovery convient à un cas grave qui exige une investigation juridique, ce que le réviseur a écarté." }
        c: { en: "Dismissing the alert would close it without telling the employee anything about the policy.", fr: "Rejeter l'alerte la fermerait sans rien dire à l'employé sur la stratégie." }
        d: { en: "An audit log retention policy keeps audit records longer; it doesn't inform the employee.", fr: "Une stratégie de rétention des journaux d'audit conserve les enregistrements d'audit plus longtemps ; elle n'informe pas l'employé." }
    references:
      - title: Learn about Insider Risk Management
        url: https://learn.microsoft.com/en-us/purview/insider-risk-management

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-44-05
    objective: "4.4.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys has just bought Microsoft Purview Audit (Premium) licenses for its users. Its auditors want the activities of the finance director to be kept longer than those of the other employees, and the IT team wonders how any new retention settings would interact with the default ones and what the former Audit (Standard) subscription allowed.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys vient d'acheter des licences Microsoft Purview Audit (Premium) pour ses utilisateurs. Ses auditeurs veulent que les activités du directeur financier soient conservées plus longtemps que celles des autres employés, et l'équipe informatique se demande comment d'éventuels nouveaux paramètres de rétention interagiraient avec ceux par défaut et ce que permettait l'ancien abonnement Audit (Standard).

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "An audit log retention policy can keep the audit records of one specific user longer than those of the other users.", fr: "Une stratégie de rétention des journaux d'audit peut conserver les enregistrements d'audit d'un utilisateur précis plus longtemps que ceux des autres utilisateurs." } }
        - { id: s2, text: { en: "The default audit retention policy takes precedence over a custom audit log retention policy that covers the same records.", fr: "La stratégie de rétention d'audit par défaut l'emporte sur une stratégie de rétention des journaux d'audit personnalisée qui couvre les mêmes enregistrements." } }
        - { id: s3, text: { en: "Organizations that have only Audit (Standard) can create audit log retention policies scoped to a service such as Exchange.", fr: "Les organisations qui n'ont qu'Audit (Standard) peuvent créer des stratégies de rétention des journaux d'audit limitées à un service comme Exchange." } }
    answer: { values: { s1: true, s2: false, s3: false } }
    explanation:
      correct:
        en: |
          Audit log retention policies are an Audit (Premium) capability. They can target a Microsoft service, specific audited activities or the users who perform them, and each policy has a retention period and a priority. Any custom audit log retention policy takes precedence over the default audit retention policy.
        fr: |
          Les stratégies de rétention des journaux d'audit sont une fonctionnalité d'Audit (Premium). Elles peuvent cibler un service Microsoft, des activités auditées précises ou les utilisateurs qui les effectuent, et chaque stratégie a une période de rétention et une priorité. Toute stratégie de rétention des journaux d'audit personnalisée l'emporte sur la stratégie de rétention d'audit par défaut.
      options:
        s2: { en: "It is the reverse: a custom audit log retention policy always takes precedence over the default one.", fr: "C'est l'inverse : une stratégie de rétention des journaux d'audit personnalisée l'emporte toujours sur celle par défaut." }
        s3: { en: "Audit (Standard) keeps records for 180 days and offers no audit log retention policies; they require Audit (Premium).", fr: "Audit (Standard) conserve les enregistrements 180 jours et ne propose aucune stratégie de rétention des journaux d'audit ; elles exigent Audit (Premium)." }
    references:
      - title: Learn about auditing solutions in Microsoft Purview
        url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-44-06
    objective: "4.4.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum's legal department uses Microsoft Purview eDiscovery for a lawsuit about a failed product launch. The evidence is spread across a SharePoint project site, the mailboxes of the project team and the Viva Engage community where the launch was discussed. Outside counsel will review part of the content on its own computers.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le service juridique d'Adatum utilise Microsoft Purview eDiscovery pour un procès sur le lancement raté d'un produit. Les preuves sont réparties entre un site de projet SharePoint, les boîtes aux lettres de l'équipe de projet et la communauté Viva Engage où le lancement a été discuté. Un cabinet d'avocats externe examinera une partie du contenu sur ses propres ordinateurs.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Exporting the results of an eDiscovery search moves the items out of their original locations into the download package.", fr: "Exporter les résultats d'une recherche eDiscovery déplace les éléments hors de leurs emplacements d'origine vers le package de téléchargement." } }
        - { id: s2, text: { en: "While the SharePoint site is on an eDiscovery hold, a document that a user deletes from the site is still preserved.", fr: "Tant que le site SharePoint est en attente eDiscovery, un document qu'un utilisateur supprime du site est toujours préservé." } }
        - { id: s3, text: { en: "An eDiscovery search can return the messages that were posted in the Viva Engage community.", fr: "Une recherche eDiscovery peut renvoyer les messages publiés dans la communauté Viva Engage." } }
    answer: { values: { s1: false, s2: true, s3: true } }
    explanation:
      correct:
        en: |
          An export copies the items from their original locations into a package that is downloaded to a local computer; the originals stay in place. A hold doesn't stop users from deleting, but it keeps what they delete: in SharePoint, a deleted document goes to the Preservation Hold library of the site. eDiscovery searches cover Exchange mailboxes, SharePoint sites, OneDrive accounts, Microsoft Teams, Microsoft 365 Groups and Viva Engage.
        fr: |
          Une exportation copie les éléments de leurs emplacements d'origine dans un package téléchargé sur un ordinateur local ; les originaux restent en place. Une mise en attente n'empêche pas les utilisateurs de supprimer, mais elle conserve ce qu'ils suppriment : dans SharePoint, un document supprimé va dans la bibliothèque de conservation (Preservation Hold library) du site. Les recherches eDiscovery couvrent les boîtes aux lettres Exchange, les sites SharePoint, les comptes OneDrive, Microsoft Teams, les groupes Microsoft 365 et Viva Engage.
      options:
        s1: { en: "Items are copied, not moved: the export leaves the content in its original locations.", fr: "Les éléments sont copiés, pas déplacés : l'exportation laisse le contenu dans ses emplacements d'origine." }
    references:
      - title: Learn about eDiscovery
        url: https://learn.microsoft.com/en-us/purview/edisc
      - title: Create holds in eDiscovery
        url: https://learn.microsoft.com/en-us/purview/edisc-hold-create

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-44-07
    objective: "4.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has two requirements. Emails that contain credit card numbers must be blocked at the moment a user sends them to an external recipient. The security team must also be alerted when the behavior of an employee over several weeks, such as unusual downloads, printing and copies to personal cloud storage, suggests data theft, so that the activity can be investigated.

        Which two Microsoft Purview capabilities should Fabrikam use? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a deux exigences. Les e-mails qui contiennent des numéros de carte de crédit doivent être bloqués au moment où un utilisateur les envoie à un destinataire externe. L'équipe de sécurité doit aussi être alertée quand le comportement d'un employé sur plusieurs semaines, comme des téléchargements inhabituels, des impressions et des copies vers un stockage cloud personnel, laisse penser à un vol de données, afin que l'activité puisse être examinée.

        Quelles sont les deux fonctionnalités Microsoft Purview que Fabrikam doit utiliser ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "An eDiscovery hold on the employees' mailboxes", fr: "Une mise en attente eDiscovery des boîtes aux lettres des employés" } }
        - { id: b, text: { en: "A data loss prevention (DLP) policy", fr: "Une stratégie de protection contre la perte de données (DLP)" } }
        - { id: c, text: { en: "An audit log retention policy for the employees", fr: "Une stratégie de rétention des journaux d'audit pour les employés" } }
        - { id: d, text: { en: "An insider risk management policy", fr: "Une stratégie de gestion des risques internes" } }
        - { id: e, text: { en: "A sensitivity label policy with mandatory labeling", fr: "Une stratégie d'étiquetage de confidentialité avec étiquetage obligatoire" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          DLP looks at the content and acts at the moment of the action: it blocks the email that contains credit card numbers. Insider risk management looks at the behavior of a user over time, correlates risk indicators such as downloads, printing and cloud uploads, and raises alerts for triage and investigation; it detects, it doesn't block.
        fr: |
          La DLP regarde le contenu et agit au moment de l'action : elle bloque l'e-mail qui contient des numéros de carte de crédit. La gestion des risques internes regarde le comportement d'un utilisateur dans la durée, corrèle des indicateurs de risque comme les téléchargements, les impressions et les chargements dans le cloud, et émet des alertes en vue du triage et de l'examen ; elle détecte, elle ne bloque pas.
      options:
        a: { en: "A hold preserves content for a legal case; it neither blocks emails nor raises alerts about behavior.", fr: "Une mise en attente préserve du contenu pour une affaire juridique ; elle ne bloque pas d'e-mails et n'émet pas d'alertes sur un comportement." }
        c: { en: "Audit records activities for later searches, but it doesn't correlate them into alerts or block anything.", fr: "Audit enregistre des activités pour des recherches ultérieures, mais il ne les corrèle pas en alertes et ne bloque rien." }
        e: { en: "Mandatory labeling forces users to choose a label; it doesn't block an email or detect risky behavior.", fr: "L'étiquetage obligatoire force les utilisateurs à choisir une étiquette ; il ne bloque pas d'e-mail et ne détecte pas de comportement à risque." }
    references:
      - title: Learn about Insider Risk Management
        url: https://learn.microsoft.com/en-us/purview/insider-risk-management
      - title: Learn about data loss prevention
        url: https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-44-08
    objective: "4.4.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The review set of a Woodgrove Bank legal case contains 250,000 emails and documents. Many documents are near-identical versions of the same file, and many emails are replies within the same threads. The reviewers must reduce the number of items they have to read, without removing any content from the review set.

        Which premium eDiscovery feature should they use?
      fr: |
        L'ensemble de révision d'une affaire juridique de Woodgrove Bank contient 250 000 e-mails et documents. De nombreux documents sont des versions presque identiques du même fichier, et de nombreux e-mails sont des réponses au sein des mêmes fils. Les réviseurs doivent réduire le nombre d'éléments qu'ils ont à lire, sans retirer aucun contenu de l'ensemble de révision.

        Quelle fonctionnalité premium d'eDiscovery doivent-ils utiliser ?
    body:
      options:
        - { id: a, text: { en: "Conversation threading", fr: "Le regroupement des conversations en fils (conversation threading)" } }
        - { id: b, text: { en: "Optical character recognition (OCR)", fr: "La reconnaissance optique de caractères (OCR)" } }
        - { id: c, text: { en: "Automatic decryption", fr: "Le déchiffrement automatique" } }
        - { id: d, text: { en: "Analytics", fr: "L'analyse (analytics)" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The analytics of premium eDiscovery include near duplicate detection, email threading and themes. They group near-identical documents and the messages of an email thread so that reviewers read fewer items, and the content stays in the review set.
        fr: |
          L'analyse d'eDiscovery premium comprend la détection des quasi-doublons, le regroupement des e-mails en fils (email threading) et les thèmes. Elle regroupe les documents presque identiques et les messages d'un même fil d'e-mails pour que les réviseurs lisent moins d'éléments, et le contenu reste dans l'ensemble de révision.
      options:
        a: { en: "Conversation threading adds the whole Teams or Viva Engage conversation around a matching message: it adds context, it doesn't reduce the volume of emails and documents.", fr: "Le regroupement des conversations en fils ajoute toute la conversation Teams ou Viva Engage autour d'un message correspondant : il ajoute du contexte, il ne réduit pas le volume d'e-mails et de documents." }
        b: { en: "OCR makes the text of images searchable; it doesn't group similar items.", fr: "L'OCR rend le texte des images recherchable ; elle ne regroupe pas les éléments semblables." }
        c: { en: "Automatic decryption makes encrypted items readable; it doesn't reduce the number of items to review.", fr: "Le déchiffrement automatique rend lisibles les éléments chiffrés ; il ne réduit pas le nombre d'éléments à examiner." }
    references:
      - title: Learn about eDiscovery
        url: https://learn.microsoft.com/en-us/purview/edisc

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-44-09
    objective: "4.4.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso is creating insider risk management policies. Each need below starts scoring user activity from a different trigger.

        Match each need to the policy template that meets it. To answer, drag the appropriate template to each need. Each template may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso crée des stratégies de gestion des risques internes. Chaque besoin ci-dessous commence à évaluer l'activité des utilisateurs à partir d'un déclencheur différent.

        Associez chaque besoin au modèle de stratégie qui y répond. Pour répondre, faites glisser le modèle approprié vers chaque besoin. Chaque modèle peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: departing, text: { en: "Data theft by departing users", fr: "Vol de données par des utilisateurs sortants (Data theft by departing users)" } }
        - { id: leaks, text: { en: "Data leaks", fr: "Fuites de données (Data leaks)" } }
        - { id: security, text: { en: "Security policy violations", fr: "Violations de stratégie de sécurité (Security policy violations)" } }
        - { id: ai, text: { en: "Risky AI usage", fr: "Utilisation risquée de l'IA (Risky AI usage)" } }
      targets:
        - { id: t1, text: { en: "Score the prompts that contain sensitive information and the responses, across the generative AI tools that users access.", fr: "Évaluer les invites qui contiennent des informations sensibles et les réponses, dans les outils d'IA générative auxquels les utilisateurs accèdent." } }
        - { id: t2, text: { en: "Start scoring the downloads and sharing of a user after a DLP policy raises a high-severity alert about that user.", fr: "Commencer à évaluer les téléchargements et les partages d'un utilisateur après qu'une stratégie DLP a émis une alerte de gravité élevée sur cet utilisateur." } }
        - { id: t3, text: { en: "Start scoring the activity of a user from the resignation date provided by the human resources system.", fr: "Commencer à évaluer l'activité d'un utilisateur à partir de la date de démission fournie par le système de ressources humaines." } }
    answer: { mapping: { t1: ai, t2: leaks, t3: departing } }
    explanation:
      correct:
        en: |
          Risky AI usage scores prompts and responses across AI tools. Data leaks scores downloads, sharing, printing and copies to personal cloud services, and its triggering event can be a DLP policy activity that creates a high-severity alert. Data theft by departing users is triggered by a resignation or termination date from the HR connector (or by the deletion of the user's Microsoft Entra account). Security policy violations relies on Microsoft Defender for Endpoint alerts and matches none of the needs.
        fr: |
          Utilisation risquée de l'IA évalue les invites et les réponses dans les outils d'IA. Fuites de données évalue les téléchargements, les partages, les impressions et les copies vers des services cloud personnels, et son événement déclencheur peut être une activité de stratégie DLP qui crée une alerte de gravité élevée. Vol de données par des utilisateurs sortants est déclenché par une date de démission ou de fin de contrat issue du connecteur RH (ou par la suppression du compte Microsoft Entra de l'utilisateur). Violations de stratégie de sécurité s'appuie sur les alertes de Microsoft Defender pour point de terminaison et ne répond à aucun des besoins.
      options:
        security: { en: "Security policy violations starts from Defender for Endpoint alerts, such as defense evasion or unwanted software, not from DLP alerts or HR dates.", fr: "Violations de stratégie de sécurité part des alertes de Defender pour point de terminaison, comme le contournement des défenses ou un logiciel indésirable, pas des alertes DLP ni des dates RH." }
    references:
      - title: Learn about Insider Risk Management policy templates
        url: https://learn.microsoft.com/en-us/purview/insider-risk-management-policy-templates

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-44-10
    objective: "4.4.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys is choosing its Microsoft Purview Audit configuration. Each of the following investigations must be possible. For each one, the solution must be the least that meets it: the lowest audit tier first, and no added configuration or license unless it is required.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys choisit sa configuration de Microsoft Purview Audit. Chacune des investigations suivantes doit être possible. Pour chacune, la solution doit être le minimum qui y répond : le niveau d'audit le plus bas d'abord, et aucune configuration ni licence ajoutée sauf si elle est nécessaire.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To find who deleted a SharePoint file four months ago, use [[sp]].

          To find who added a user to a Microsoft Entra role ten months ago, use [[entra]].

          To find who deleted a Microsoft Teams channel ten months ago, use [[teams]].
        fr: |
          Pour trouver qui a supprimé un fichier SharePoint il y a quatre mois, utilisez [[sp]].

          Pour trouver qui a ajouté un utilisateur à un rôle Microsoft Entra il y a dix mois, utilisez [[entra]].

          Pour trouver qui a supprimé un canal Microsoft Teams il y a dix mois, utilisez [[teams]].
      slots:
        - id: sp
          options:
            - { id: sp-std, text: { en: "Audit (Standard), with its default retention", fr: "Audit (Standard), avec sa rétention par défaut" } }
            - { id: sp-prem, text: { en: "Audit (Premium), with its default retention", fr: "Audit (Premium), avec sa rétention par défaut" } }
            - { id: sp-pol, text: { en: "Audit (Premium), with a one-year audit log retention policy", fr: "Audit (Premium), avec une stratégie de rétention des journaux d'audit d'un an" } }
            - { id: sp-addon, text: { en: "Audit (Premium), with the 10-year retention add-on license", fr: "Audit (Premium), avec la licence de module complémentaire de rétention de 10 ans" } }
        - id: entra
          options:
            - { id: en-std, text: { en: "Audit (Standard), with its default retention", fr: "Audit (Standard), avec sa rétention par défaut" } }
            - { id: en-prem, text: { en: "Audit (Premium), with its default retention", fr: "Audit (Premium), avec sa rétention par défaut" } }
            - { id: en-pol, text: { en: "Audit (Premium), with a one-year audit log retention policy", fr: "Audit (Premium), avec une stratégie de rétention des journaux d'audit d'un an" } }
            - { id: en-addon, text: { en: "Audit (Premium), with the 10-year retention add-on license", fr: "Audit (Premium), avec la licence de module complémentaire de rétention de 10 ans" } }
        - id: teams
          options:
            - { id: tm-std, text: { en: "Audit (Standard), with its default retention", fr: "Audit (Standard), avec sa rétention par défaut" } }
            - { id: tm-prem, text: { en: "Audit (Premium), with its default retention", fr: "Audit (Premium), avec sa rétention par défaut" } }
            - { id: tm-pol, text: { en: "Audit (Premium), with a one-year audit log retention policy", fr: "Audit (Premium), avec une stratégie de rétention des journaux d'audit d'un an" } }
            - { id: tm-addon, text: { en: "Audit (Premium), with the 10-year retention add-on license", fr: "Audit (Premium), avec la licence de module complémentaire de rétention de 10 ans" } }
    answer: { values: { sp: sp-std, entra: en-prem, teams: tm-pol } }
    explanation:
      correct:
        en: |
          Audit (Standard) keeps records for 180 days, which covers an event of four months ago. Audit (Premium) keeps Microsoft Entra ID, Exchange, OneDrive and SharePoint records for one year by default, which covers the Entra role change of ten months ago. Records of the other services, such as Microsoft Teams, are kept for 180 days even with Audit (Premium): a custom audit log retention policy of one year is needed for the Teams channel.
        fr: |
          Audit (Standard) conserve les enregistrements 180 jours, ce qui couvre un événement d'il y a quatre mois. Audit (Premium) conserve par défaut un an les enregistrements de Microsoft Entra ID, d'Exchange, de OneDrive et de SharePoint, ce qui couvre la modification de rôle Entra d'il y a dix mois. Les enregistrements des autres services, comme Microsoft Teams, sont conservés 180 jours même avec Audit (Premium) : une stratégie de rétention des journaux d'audit personnalisée d'un an est nécessaire pour le canal Teams.
      options:
        sp-prem: { en: "Audit (Premium) works, but the 180 days of Audit (Standard) already cover four months.", fr: "Audit (Premium) convient, mais les 180 jours d'Audit (Standard) couvrent déjà quatre mois." }
        en-std: { en: "Ten months is beyond the 180 days of Audit (Standard).", fr: "Dix mois dépassent les 180 jours d'Audit (Standard)." }
        en-pol: { en: "No policy is needed: Microsoft Entra ID records are already kept one year by Audit (Premium).", fr: "Aucune stratégie n'est nécessaire : Audit (Premium) conserve déjà un an les enregistrements Microsoft Entra ID." }
        tm-prem: { en: "The one-year default of Audit (Premium) doesn't cover Teams, whose records are kept 180 days.", fr: "La valeur par défaut d'un an d'Audit (Premium) ne couvre pas Teams, dont les enregistrements sont conservés 180 jours." }
        tm-addon: { en: "The 10-year add-on is for keeping records for up to 10 years; a one-year policy already covers ten months.", fr: "Le module complémentaire de 10 ans sert à conserver les enregistrements jusqu'à 10 ans ; une stratégie d'un an couvre déjà dix mois." }
    references:
      - title: Learn about auditing solutions in Microsoft Purview
        url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
